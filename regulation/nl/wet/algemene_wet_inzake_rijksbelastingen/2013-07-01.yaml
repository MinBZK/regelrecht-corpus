        bwb_id: BWBR0011353
        artikel: '10'
  - number: 67cb.2
    text: |-
      De gewijzigde bedragen vinden voor het eerst toepassing met betrekking tot verzuimen die zijn begaan na het begin
      van het kalenderjaar bij de aanvang waarvan de bedragen zijn gewijzigd.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67cb
  - number: 67d.1
    text: |-
      Indien het aan opzet van de belastingplichtige is te wijten dat met betrekking tot een belasting welke bij wege van
      aanslag wordt geheven, de aangifte niet, dan wel onjuist of onvolledig is gedaan, vormt dit een vergrijp ter zake
      waarvan de inspecteur hem, gelijktijdig met de vaststelling van de aanslag, een bestuurlijke boete kan opleggen van
      ten hoogste 100 percent van de in het tweede lid omschreven grondslag voor de boete.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67d
  - number: 67d.2
    text: 'De grondslag voor de boete wordt gevormd door:'
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67d
  - number: 67d.2.a
    text: het bedrag van de aanslag, dan wel
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67d
  - number: 67d.2.b
    text: |-
      indien verliezen in aanmerking zijn of worden genomen, het bedrag waarop de aanslag zou zijn berekend zonder
      rekening te houden met die verliezen; een en ander voor zover dat bedrag als gevolg van de opzet van de
      belastingplichtige niet zou zijn geheven.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67d
  - number: 67d.3
    text: |-
      Indien verliezen in aanmerking zijn of worden genomen en als gevolg daarvan geen aanslag kan worden vastgesteld,
      kan de inspecteur de boete, bedoeld in het eerste lid, niettemin opleggen. De bevoegdheid tot het opleggen van
      de boete vervalt door verloop van de termijn die geldt voor het vaststellen van de aanslag, die zou kunnen zijn
      vastgesteld indien geen verliezen in aanmerking zouden zijn genomen.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67d
  - number: 67d.4
    text: |-
      Voor de toepassing van het tweede en derde lid wordt met verliezen gelijkgesteld de persoonsgebonden aftrek,
      bedoeld in [artikel 6.1, eerste lid, onderdeel b, van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67d
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
  - number: 67d.5
    text: |-
      Voor zover de aanslag geheel of gedeeltelijk betrekking heeft op belastbaar inkomen als bedoeld in
      [artikel 5.1 van de Wet inkomstenbelasting 2001][ref1], bedraagt de boete, in zoverre in afwijking van het eerste
      lid, ten hoogste 300 percent van de daarover verschuldigde belasting zoals deze bij de aanslag is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67d
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
  - number: 67e.1
    text: |-
      Indien het met betrekking tot een belasting welke bij wege van aanslag wordt geheven aan opzet of grove schuld van
      de belastingplichtige is te wijten dat de aanslag tot een te laag bedrag is vastgesteld of anderszins te weinig
      belasting is geheven, vormt dit een vergrijp ter zake waarvan de inspecteur hem, gelijktijdig met de vaststelling
      van de navorderingsaanslag, een bestuurlijke boete kan opleggen van ten hoogste 100 percent van de in het tweede
      lid omschreven grondslag voor de boete.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67e
  - number: 67e.2
    text: 'De grondslag voor de boete wordt gevormd door:'
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67e
  - number: 67e.2.a
    text: het bedrag van de navorderingsaanslag, dan wel
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67e
  - number: 67e.2.b
    text: |-
      indien verliezen in aanmerking zijn of worden genomen, het bedrag waarop de navorderingsaanslag zou zijn berekend
      zonder rekening te houden met die verliezen; een en ander voor zover dat bedrag als gevolg van de opzet of de grove
      schuld van de belastingplichtige niet zou zijn geheven.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67e
  - number: 67e.3
    text: |-
      De inspecteur kan, in afwijking van het eerste lid, binnen zes maanden na de vaststelling van de
      navorderingsaanslag, een bestuurlijke boete opleggen indien de feiten of omstandigheden op grond waarvan wordt
      nagevorderd eerst bekend worden op of na het tijdstip dat is gelegen zes maanden vóór de afloop van de in
      [artikel 16][ref1] bedoelde termijnen, en er tevens aanwijzingen bestaan dat het aan opzet of grove schuld van
      de belastingplichtige is te wijten dat de aanslag tot een te laag bedrag is vastgesteld of anderszins te weinig
      belasting is geheven. Alsdan doet de inspecteur gelijktijdig met de vaststelling van de navorderingsaanslag
      mededeling aan de belastingplichtige dat wordt onderzocht of in verband met de navordering het opleggen van een
      vergrijpboete gerechtvaardigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel16
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67e
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '16'
        hoofdstuk: III
  - number: 67e.4
    text: |-
      Indien verliezen in aanmerking zijn of worden genomen en als gevolg daarvan geen navorderingsaanslag kan
      worden vastgesteld, kan de inspecteur de boete, bedoeld in het eerste lid, niettemin opleggen. De bevoegdheid
      tot het opleggen van de boete vervalt door verloop van de termijn die geldt voor het vaststellen van de
      navorderingsaanslag, die zou kunnen zijn vastgesteld indien geen verliezen in aanmerking zouden zijn genomen.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67e
  - number: 67e.5
    text: |-
      Voor de toepassing van het tweede en vierde lid wordt met verliezen gelijkgesteld de persoonsgebonden aftrek,
      bedoeld in [artikel 6.1, eerste lid, onderdeel b, van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67e
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
  - number: 67e.6
    text: |-
      Voor zover de navorderingsaanslag geheel of gedeeltelijk betrekking heeft op belastbaar inkomen als bedoeld in
      [artikel 5.1 van de Wet inkomstenbelasting 2001][ref1], bedraagt de boete, in zoverre in afwijking van het eerste
      lid, ten hoogste 300 percent van de daarover verschuldigde belasting zoals deze bij de navorderingsaanslag is
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67e
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
  - number: 67f.1
    text: |-
      Indien het aan opzet of grove schuld van de belastingplichtige of de inhoudingsplichtige is te wijten dat
      belasting welke op aangifte moet worden voldaan of afgedragen niet, gedeeltelijk niet, dan wel niet binnen de
      in de belastingwet gestelde termijn is betaald, vormt dit een vergrijp ter zake waarvan de inspecteur hem een
      bestuurlijke boete kan opleggen van ten hoogste 100 percent van de in het tweede lid omschreven grondslag voor
      de boete.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67f
  - number: 67f.2
    text: |-
      De grondslag voor de boete wordt gevormd door het bedrag van de belasting dat niet of niet tijdig is betaald, voor
      zover dat bedrag als gevolg van de opzet of de grove schuld van de belastingplichtige of de inhoudingsplichtige
      niet of niet tijdig is betaald.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67f
  - number: 67f.3
    text: |-
      Bij niet of gedeeltelijk niet betalen legt de inspecteur de boete op, gelijktijdig met de vaststelling van de
      naheffingsaanslag.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67f
  - number: 67f.4
    text: |-
      De bevoegdheid tot het opleggen van de boete wegens niet tijdig betalen, vervalt door verloop van vijf jaren na het
      einde van het kalenderjaar waarin de belastingschuld is ontstaan.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67f
  - number: 67f.5
    text: |-
      [Artikel 67e, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67e
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67f
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 67e
        hoofdstuk: VIIIA
        paragraaf: '2'
        afdeling: '1'
  - number: 67f.6
    text: |-
      [Artikel 20, eerste lid, tweede volzin, en tweede lid, tweede volzin][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel20
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67f
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '20'
        hoofdstuk: IV
  - number: 67fa
    text: |-
      Bij toepassing van [artikel 5:1, tweede lid, van de Algemene wet bestuursrecht][ref1] vervalt voor zover nodig:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67fa
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 67fa.a
    text: |-
      de voorwaarde van gelijktijdigheid, bedoeld in de [artikelen 67c, tweede lid][ref1], [67d, eerste lid][ref2],
      [67e, eerste lid][ref3], en [67f, derde lid][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67c
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel67d
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel67e
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel67f
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67fa
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 67c
        hoofdstuk: VIIIA
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 67d
        hoofdstuk: VIIIA
        paragraaf: '2'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: 67e
        hoofdstuk: VIIIA
        paragraaf: '2'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0002320
        artikel: 67f
        hoofdstuk: VIIIA
        paragraaf: '2'
        afdeling: '1'
  - number: 67fa.b
    text: |-
      de voorwaarde dat uiterlijk bij het vaststellen van de aanslag een verzuimboete kan worden opgelegd, bedoeld in
      [artikel 67a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67a
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67fa
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 67a
        hoofdstuk: VIIIA
        paragraaf: '1'
        afdeling: '1'
  - number: 67g.1
    text: De inspecteur legt de bestuurlijke boete op bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67g
  - number: 67g.2
    text: |-
      In afwijking van [artikel 5:9 van de Algemene wet bestuursrecht][ref1] stelt de inspecteur de belastingplichtige
      of de inhoudingsplichtige, uiterlijk bij de in het eerste lid bedoelde beschikking, in kennis van de in dat artikel
      bedoelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67g
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 67h
    text: |-
      Indien de grondslag voor een bestuurlijke boete wordt gevormd door het bedrag van de belasting, wordt de opgelegde
      boete naar evenredigheid verlaagd bij vermindering, teruggaaf, terugbetaling of kwijtschelding van belasting,
      voor zover deze vermindering, teruggaaf, terugbetaling of kwijtschelding het bedrag betreft waarover de boete is
      berekend.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67h
  - number: 67n.1
    text: |-
      Wanneer de belastingplichtige uiterlijk twee jaar nadat hij een onjuiste of onvolledige aangifte heeft gedaan of
      aangifte had moeten doen, alsnog een juiste en volledige aangifte doet, dan wel juiste en volledige inlichtingen,
      gegevens of aanwijzingen verstrekt vóórdat hij weet of redelijkerwijs moet vermoeden dat de inspecteur met de
      onjuistheid of onvolledigheid bekend is of bekend zal worden, wordt geen vergrijpboete opgelegd.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67n
  - number: 67n.2
    text: |-
      Ook na het verstrijken van de in het eerste lid bedoelde termijn van twee jaar is het alsnog doen van een juiste
      en volledige aangifte, dan wel het verstrekken van juiste en volledige inlichtingen, gegevens of aanwijzingen
      door de belastingplichtige vóórdat hij weet of redelijkerwijs moet vermoeden dat de inspecteur met de onjuistheid
      of onvolledigheid bekend is of bekend zal worden, een omstandigheid die aanleiding geeft tot matiging van de
      vergrijpboete.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67n
  - number: 67p
    text: |-
      Deze afdeling is van overeenkomstige toepassing ten aanzien van anderen dan de belastingplichtige of de
      inhoudingsplichtige aan wie ingevolge de belastingwet een bestuurlijke boete kan worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67p
  - number: 67pa.1
    text: |-
      Met betrekking tot het opleggen van een verzuimboete vindt [artikel 5:53 van de Algemene wet bestuursrecht][ref1]
      geen toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67pa
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 67pa.2
    text: |-
      In afwijking in zoverre van [artikel 5:45 van de Algemene wet bestuursrecht][ref1] vervalt de bevoegdheid om een in
      een belastingwet geregelde verzuim- of vergrijpboete op te leggen niet na drie, onderscheidenlijk vijf jaren nadat
      de overtreding heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67pa
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 67pb
    text: |-
      In afwijking van[ artikel 10:3, vierde lid, van de Algemene wet bestuursrecht][ref1] kan degene die de overtreding
      constateert ook worden belast met het opleggen van een bestuurlijke boete.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67pb
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: 67q.1
    text: |-
      In afwijking van [artikel 5:43 van de Algemene wet bestuursrecht][ref1] kan de inspecteur een vergrijpboete
      opleggen wegens hetzelfde feit als waarvoor eerder een verzuimboete is opgelegd, indien nieuwe bezwaren bekend
      zijn geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67q
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 67q.2
    text: |-
      Als nieuwe bezwaren kunnen enkel worden aangemerkt verklaringen van de belastingplichtige of inhoudingsplichtige of
      van derden en boeken, bescheiden en andere gegevensdragers of de inhoud daarvan, welke later bekend zijn geworden
      of niet zijn onderzocht.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67q
  - number: 67q.3
    text: |-
      Het rapport, bedoeld in [artikel 5:48 van de Algemene wet bestuursrecht][ref1], vermeldt tevens waaruit de nieuwe
      bezwaren bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67q
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 67q.4
    text: De eerder opgelegde verzuimboete wordt verrekend met de wegens hetzelfde feit opgelegde vergrijpboete.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67q
  - number: 67q.5
    text: |-
      Bij toepassing van dit artikel vervalt de voorwaarde van gelijktijdigheid, bedoeld in de
      [artikelen 67d, eerste lid][ref1], [67e, eerste lid][ref2], en [67f, derde lid][ref3], voor zover nodig.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67d
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel67e
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel67f
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67q
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 67d
        hoofdstuk: VIIIA
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 67e
        hoofdstuk: VIIIA
        paragraaf: '2'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: 67f
        hoofdstuk: VIIIA
        paragraaf: '2'
        afdeling: '1'
  - number: '68.1'
    text: 'Degene die ingevolge de belastingwet verplicht is tot:'
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel68
  - number: 68.1.a
    text: het verstrekken van inlichtingen, gegevens of aanwijzingen, en deze niet, onjuist of onvolledig verstrekt;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel68
  - number: 68.1.b
    text: |-
      het voor raadpleging beschikbaar stellen van boeken, bescheiden, andere gegevensdragers of de inhoud daarvan, en
      deze niet voor dit doel beschikbaar stelt;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel68
  - number: 68.1.c
    text: |-
      het voor raadpleging beschikbaar stellen van boeken, bescheiden, andere gegevensdragers of de inhoud daarvan, en
      deze in valse of vervalste vorm voor dit doel beschikbaar stelt;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel68
  - number: 68.1.d
    text: |-
      het voeren van een administratie overeenkomstig de daaraan bij of krachtens de belastingwet gestelde eisen, en een
      zodanige administratie niet voert;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel68
  - number: 68.1.e
    text: het bewaren van boeken, bescheiden of andere gegevensdragers, en deze niet bewaart;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel68
  - number: 68.1.f
    text: |-
      het verlenen van medewerking als bedoeld in [artikel 52, zesde lid][ref1], en deze niet verleent;


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel52
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '52'
        hoofdstuk: VIII
        afdeling: '2'
  - number: 68.1.g
    text: het uitreiken van een factuur of nota, en een onjuiste of onvolledige factuur of nota verstrekt;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel68
  - number: '68.2'
    text: |-
      Degene die niet voldoet aan de verplichting, hem opgelegd bij [artikel 47, derde lid][ref1], wordt gestraft met
      geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel47
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '47'
        hoofdstuk: VIII
        afdeling: '2'
  - number: '68.3'
    text: |-
      Niet strafbaar is degene die de in [artikel 47a][ref1] bedoelde verplichting niet nakomt ten gevolge van een voor
      het niet in Nederland gevestigde lichaam of de niet in Nederland wonende natuurlijke persoon geldend wettelijk of
      rechterlijk verbod tot het verlenen van medewerking aan de verstrekking van de verlangde gegevens of inlichtingen
      of het voor raadpleging beschikbaar stellen van boeken, bescheiden, andere gegevensdragers of de inhoud daarvan,
      dan wel ten gevolge van een hem niet toe te rekenen weigering van het niet in Nederland gevestigde lichaam of
      de niet in Nederland wonende natuurlijke persoon de verlangde gegevens of inlichtingen te verstrekken of boeken,
      bescheiden, andere gegevensdragers of de inhoud daarvan voor raadpleging beschikbaar te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel47a
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 47a
        hoofdstuk: VIII
        afdeling: '2'
  - number: '69.1'
    text: |-
      Degene die opzettelijk een bij de belastingwet voorziene aangifte niet doet, niet
      binnen de daarvoor gestelde termijn doet, dan wel een der feiten begaat, omschreven in
      [artikel 68, eerste lid, onderdelen a, b, d, e, f of g][ref1], wordt, indien het feit ertoe strekt dat te weinig
      belasting wordt geheven, gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde
      categorie of, indien dit bedrag hoger is, ten hoogste eenmaal het bedrag van de te weinig geheven belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel68
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '68'
        hoofdstuk: IX
        afdeling: '1'
  - number: '69.2'
    text: |-
      Degene die opzettelijk een bij de belastingwet voorziene aangifte onjuist of onvolledig doet, dan wel het feit
      begaat, omschreven in [artikel 68, eerste lid, onderdeel c][ref1], wordt, indien het feit ertoe strekt dat te
      weinig belasting wordt geheven, gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde
      categorie of, indien dit bedrag hoger is, ten hoogste eenmaal het bedrag van de te weinig geheven belasting, met
      dien verstande dat voor zover de onjuistheid in of onvolledigheid van de aangifte betrekking heeft op belastbaar
      inkomen als bedoeld in [artikel 5.1 van de Wet inkomstenbelasting 2001][ref2] de geldboete ten hoogste driemaal het
      bedrag van de te weinig geheven belasting bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '68'
        hoofdstuk: IX
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '5'
  - number: '69.3'
    text: |-
      Het recht tot strafvervolging op de voet van dit artikel vervalt, indien de schuldige alsnog een juiste en
      volledige aangifte doet, dan wel juiste en volledige inlichtingen, gegevens of aanwijzingen verstrekt vóórdat hij
      weet of redelijkerwijs moet vermoeden dat een of meer van de in [artikel 80, eerste lid][ref1], bedoelde ambtenaren
      de onjuistheid of onvolledigheid bekend is of bekend zal worden.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel80
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '80'
        hoofdstuk: IX
        afdeling: '3'
  - number: '69.4'
    text: |-
      Indien het feit, ter zake waarvan de verdachte kan worden vervolgd, zowel valt onder een van de bepalingen van het
      eerste of het tweede lid, als onder die van [artikel 225, tweede lid, van het Wetboek van Strafrecht][ref1], is
      strafvervolging op grond van genoemd [artikel 225, tweede lid][ref2], uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel225
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel225
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '225'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '225'
  - number: '69.5'
    text: |-
      [Artikel 68, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel68
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '68'
        hoofdstuk: IX
        afdeling: '1'
  - number: '69.6'
    text: |-
      Indien de schuldige een van de strafbare feiten, omschreven in het eerste en tweede lid, in zijn beroep begaat, kan
      hij van de uitoefening van dat beroep worden ontzet.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel69
  - number: '70'
    text: |-
      Overtreding van door Ons krachtens de belastingwet bij algemene maatregel van bestuur vastgestelde bepalingen
      wordt, voor zover die overtreding is aangemerkt als strafbaar feit, gestraft met geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel70
  - number: '71'
    text: |-
      Overtreding van door Onze Minister krachtens de belastingwet vastgestelde algemene voorschriften wordt, voor zover
      die overtreding is aangemerkt als strafbaar feit, gestraft met geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel71
  - number: '72'
    text: |-
      De bij de belastingwet strafbaar gestelde feiten waarop gevangenisstraf is gesteld, zijn misdrijven. De overige bij
      de belastingwet strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel72
  - number: '73'
    text: |-
      De Nederlandse strafwet is ook van toepassing op ieder die zich niet in Nederland schuldig maakt aan enig in de
      belastingwet omschreven misdrijf.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel73
  - number: '74'
    text: |-
      Ter zake van bij de belastingwet strafbaar gestelde feiten vindt [artikel 36][ref1] geen toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel36e
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 36e
  - number: '76.1'
    text: |-
      Ten aanzien van de bij de belastingwet strafbaar gestelde feiten met betrekking tot welke het proces-verbaal niet
      overeenkomstig [artikel 80, tweede lid][ref1], in handen van de officier van justitie is gesteld, kan, in afwijking
      van de [artikelen 257a][ref2], [257b][ref3] en [257ba van het Wetboek van Strafvordering][ref4], uitsluitend
      het bestuur van ’s Rijks belastingen een strafbeschikking uitvaardigen. Bij ministeriële regeling kunnen
      functionarissen worden aangewezen die deze bevoegdheid namens dat bestuur kunnen uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel257a
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel257b
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel257ba
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '80'
        hoofdstuk: IX
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 257a
      - id: ref3
        bwb_id: BWBR0001903
        artikel: 257b
      - id: ref4
        bwb_id: BWBR0001903
        artikel: 257ba
  - number: '76.2'
    text: |-
      In deze strafbeschikking kan een geldboete worden opgelegd. Voorts kan deze strafbeschikking aanwijzingen bevatten
      waaraan de verdachte moet voldoen. De aanwijzingen kunnen inhouden:
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel76
  - number: 76.2.a
    text: |-
      afstand van voorwerpen die in beslag zijn genomen en vatbaar zijn voor verbeurdverklaring of onttrekking aan het
      verkeer;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel76
  - number: 76.2.b
    text: |-
      uitlevering, of voldoening aan de staat van de geschatte waarde, van voorwerpen die vatbaar zijn voor
      verbeurdverklaring;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel76
  - number: 76.2.c
    text: |-
      voldoening aan de Staat van een geldbedrag gelijk aan of lager dan het geschatte voordeel – met inbegrip van
      besparing van kosten – door de verdachte verkregen door middel van of uit het strafbare feit;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel76
  - number: 76.2.d
    text: het alsnog voldoen aan een bij de belastingwet gestelde verplichting.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel76
  - number: '76.3'
    text: |-
      Een strafbeschikking waarin een geldboete wordt opgelegd van meer dan € 2 000, wordt, in afwijking van
      [artikel 257c, tweede lid, van het Wetboek van Strafvordering][ref1], slechts uitgevaardigd indien de verdachte
      daaraan voorafgaand is gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel257c
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 257c
  - number: '76.4'
    text: |-
      Een geldboete wordt, in zoverre in afwijking van [artikel 257g van het Wetboek van Strafvordering][ref1],
      ingevorderd op de wijze, voorzien in de [Invorderingswet 1990][ref2]. Daartoe wordt een afschrift van de
      strafbeschikking aan de ontvanger ter hand gesteld. Het bestuur van ’s Rijks belastingen of de aangewezen
      functionaris bepaalt voorts de termijn binnen welke aan de gegeven aanwijzingen moet zijn voldaan en zo nodig
      tevens de plaats waar zulks moet geschieden. De gestelde termijn kan voor de afloop daarvan eenmaal worden
      verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel257g
      [ref2]: https://wetten.overheid.nl/BWBR0004770
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 257g
      - id: ref2
        bwb_id: BWBR0004770
  - number: '76.5'
    text: |-
      In afwijking van [artikel 257h, tweede lid, van het Wetboek van Strafvordering][ref1] verstrekt het bestuur van
      ’s Rijks belastingen desgevraagd een afschrift van een strafbeschikking aan ieder ander dan de verdachte of zijn
      raadsman, tenzij verstrekking naar het oordeel van het bestuur ter bescherming van de belangen van degene ten
      aanzien van wie de strafbeschikking is uitgevaardigd of van de derden die in de strafbeschikking worden genoemd,
      geheel of gedeeltelijk dient te worden geweigerd. In het laatste geval kan het bestuur van ’s Rijks belastingen een
      geanonimiseerd afschrift van de strafbeschikking verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel257h
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 257h
  - number: '76.6'
    text: |-
      Indien binnen veertien dagen geen afschrift dan wel een geanonimiseerd afschrift wordt verstrekt, kan de
      verzoeker een klaagschrift indienen bij het bestuur van ’s Rijks belastingen. Deze stelt het klaagschrift, de
      strafbeschikking en het proces-verbaal in handen van de officier van justitie, welke het klaagschrift en de
      processtukken onverwijld ter kennis brengt van de rechtbank, tenzij hij alsnog aan het verzoek tegemoetkomt. De
      procesdeelnemers zijn, in afwijking van [artikel 23, vierde lid, van het Wetboek van Strafvordering][ref1] niet
      bevoegd van de inhoud van de processtukken kennis te nemen dan voorzover de rechtbank zulks toestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel23
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '23'
  - number: '76.7'
    text: |-
      [Artikel 552ab van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel552ab
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 552ab
  - number: '77.1'
    text: De rechtbanken vonnissen in eerste aanleg over bij de belastingwet strafbaar gestelde feiten.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel77
  - number: '77.2'
    text: 'De vonnissen zijn aan hoger beroep onderworpen, voor zover zij zijn gewezen:'
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel77
  - number: 77.2.a
    text: ter zake van misdrijven;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel77
  - number: 77.2.b
    text: |-
      ter zake van overtredingen ten aanzien van degene die op het tijdstip waarop de vervolging tegen hem is
      aangevangen, de leeftijd van achttien jaren nog niet had bereikt.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel77
  - number: '77.3'
    text: |-
      Tegen andere vonnissen kan de verdachte hoger beroep instellen, indien hechtenis als hoofdstraf is opgelegd, een
      geldboete van € 113 of meer is opgelegd dan wel een verbeurdverklaring is uitgesproken; het openbaar ministerie kan
      hoger beroep instellen, indien het gelijke straffen heeft gevorderd.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel77
  - number: '78'
    text: |-
      Ten aanzien van bij de belastingwet strafbaar gestelde feiten worden lichamen voor de toepassing van
      [artikel 2 van het Wetboek van Strafvordering][ref1] geacht te wonen, waar zij gevestigd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel2
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '2'
  - number: '80.1'
    text: |-
      Met het opsporen van bij de belastingwet strafbaar gestelde feiten zijn, behalve de in
      [artikel 141 van het Wetboek van Strafvordering][ref1] bedoelde personen, de ambtenaren van de rijksbelastingdienst
      belast.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '80.2'
    text: |-
      In afwijking van de [artikel 156 van het Wetboek van Strafvordering][ref1] worden alle processen-verbaal
      betreffende bij de belastingwet strafbaar gestelde feiten ingezonden bij het bestuur van ’s Rijks belastingen.
      Het bestuur doet de processen-verbaal betreffende strafbare feiten, ter zake waarvan inverzekeringstelling
      of voorlopige hechtenis is toegepast dan wel een woning tegen de wil van de bewoner is binnengetreden, met de
      inbeslaggenomen voorwerpen onverwijld toekomen aan de bevoegde officier van justitie. De overige processen-
      verbaal doet het bestuur, met de inbeslaggenomen voorwerpen, toekomen aan de officier van justitie, indien het een
      vervolging of verdere vervolging door deze wenselijk acht.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel156
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '156'
  - number: '80.3'
    text: |-
      De officier van justitie is bevoegd, de zaak ter afdoening weder in handen van het bestuur van ’s Rijks belastingen
      te stellen, hetwelk daarmede alsdan kan handelen overeenkomstig [artikel 76][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel76
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '76'
        hoofdstuk: IX
        afdeling: '2'
  - number: '80.4'
    text: |-
      Het bepaalde in [artikel 148, tweede lid, van het Wetboek van Strafvordering][ref1] vindt geen toepassing in
      zaken, waarin het bestuur van ’s Rijks belastingen het proces-verbaal niet aan de officier van justitie heeft doen
      toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel148
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '148'
  - number: '81'
    text: |-
      De ambtenaren belast met het opsporen van bij de belastingwet strafbaar gestelde feiten, zijn te allen tijde
      bevoegd tot inbeslagneming van de ingevolge het [Wetboek van Strafvordering][ref1] voor inbeslagneming vatbare
      voorwerpen. Zij kunnen daartoe hun uitlevering vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: '82.1'
    text: |-
      In zaken waarin het bestuur van ’s Rijks belastingen het proces-verbaal niet ingevolge het bepaalde in
      [artikel 80, tweede lid][ref1], aan de officier van justitie heeft doen toekomen, geldt ten aanzien van het bestuur
      van ’s Rijks belastingen hetgeen in [artikel 116 van het Wetboek van Strafvordering][ref2] ten aanzien van het
      openbaar ministerie is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel116
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '80'
        hoofdstuk: IX
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '116'
  - number: '82.2'
    text: |-
      In de zaken, bedoeld in het vorige lid, wordt bij de toepassing van de [artikelen 552a][ref1] en
      [552ab van het Wetboek van Strafvordering][ref2], alvorens het gerecht ingevolge artikel 552a, zesde lid,
      onderscheidenlijk artikel 552ab, vierde lid, van dat wetboek een beschikking neemt, ook het bestuur van
      ’s Rijks belastingen in de gelegenheid gesteld te worden gehoord en is, in afwijking van het bepaalde in
      [artikel 552d van dat wetboek][ref3], niet het openbaar ministerie doch het bestuur van ’s Rijks belastingen
      bevoegd tot het instellen van beroep in cassatie. De griffier van het gerecht hetwelk in die zaken ingevolge
      artikel 552a, zesde lid, of artikel 552ab, vierde lid, van dat wetboek een beschikking neemt, deelt deze onverwijld
      mede aan het bestuur van ’s Rijks belastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel552a
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel552ab
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel552d
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 552a
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 552ab
      - id: ref3
        bwb_id: BWBR0001903
        artikel: 552d
  - number: '83'
    text: |-
      Bij het opsporen van een bij de belastingwet strafbaar gesteld feit hebben de in [artikel 80, eerste lid][ref1],
      bedoelde ambtenaren toegang tot elke plaats, voor zover dat redelijkerwijs voor de vervulling van hun taak nodig
      is. Zij zijn bevoegd zich door bepaalde door hen aangewezen personen te doen vergezellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel80
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '80'
        hoofdstuk: IX
        afdeling: '3'
  - number: '84'
    text: |-
      Ten dienste van de vervolging en berechting van bij de belastingwet strafbaar gestelde feiten kan Onze Minister, in
      overeenstemming met Onze Minister van Veiligheid en Justitie, ambtenaren van de rijksbelastingdienst aanwijzen, die
      het contact onderhouden met het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel84
  - number: '85'
    text: |-
      De griffiers verstrekken aan het bestuur van ’s Rijks belastingen desgevraagd kosteloos afschrift of uittreksel van
      arresten of vonnissen, in belastingstrafzaken gewezen.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel85
  - number: '86'
    text: |-
      Met betrekking tot gerechtelijke mededelingen inzake bij de belastingwet strafbaar gestelde feiten hebben de
      ambtenaren van de rijksbelastingdienst de bevoegdheden bij het [Wetboek van Strafvordering][ref1] aan ambtenaren
      van politie, aangesteld voor de uitvoering van de politietaak, toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: '87'
    text: |-
      Ten aanzien van de tenuitvoerlegging van rechterlijke beslissingen inzake bij de belastingwet strafbaar gestelde
      feiten hebben de ambtenaren van de rijksbelastingdienst de bevoegdheid van deurwaarders.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel87
  - number: '88.1'
    text: 'De ambtenaren van de rijksbelastingdienst zijn tevens belast met de opsporing van:'
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel88
  - number: 88.1.a
    text: |-
      de misdrijven omschreven in de [artikelen 179 tot en met 182 van het Wetboek van Strafrecht][ref1], welke jegens
      hen zijn begaan;


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel179
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '179'
  - number: 88.1.b
    text: |-
      het misdrijf omschreven in [artikel 184 van het Wetboek van Strafrecht][ref1], indien het bevel of de vordering is
      gedaan krachtens of de handeling is ondernomen ter uitvoering van de belastingwet.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '184'
  - number: '88.2'
    text: |-
      De [artikelen 152][ref1], [153][ref2], [156][ref3] en [159 van het Wetboek van Strafvordering][ref4] zijn te dezen
      op de ambtenaren van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel152
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel153
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel156
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel159
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '152'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '153'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '156'
      - id: ref4
        bwb_id: BWBR0001903
        artikel: '159'
  - number: '90'
    text: |-
      De krachtens de wet van 14 Juni 1930 (*Stb.* 244), houdende bepalingen tot voorkoming van dubbele belasting,
      uitgevaardigde voorschriften worden geacht krachtens [Hoofdstuk VII][ref1] te zijn uitgevaardigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukVII
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: VII
  - number: '91'
    text: |-
      De wet van 13 Januari 1922 (*Stb.* 9), betreffende het opleggen van voorlopige aanslagen in de directe belastingen,
      wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel91
  - number: '92'
    text: |-
      De wet van 29 April 1925 (*Stb.* 171), tot bevordering van de richtige heffing der directe belastingen, wordt
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel92
  - number: '93'
    text: |-
      De wet van 28 Juni 1926 (*Stb.* 227), houdende bepalingen met betrekking tot het overschrijden van in
      belastingwetten gestelde termijnen, wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel93
  - number: '94'
    text: |-
      De wet van 23 April 1952 (*Stb.* 191), houdende bepalingen inzake vervanging van het fiscale noodrecht, wordt
      ingetrokken, behoudens ten aanzien van begane strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel94
  - number: '95.1'
    text: |-
      De bepalingen van deze wet treden in werking op een door Ons te bepalen tijdstip, dat verschillend kan zijn
      zowel voor de onderscheidene bepalingen van de wet als voor de onderscheidene belastingen en tijdvakken waarin of
      waarover deze worden geheven.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel95
  - number: '95.2'
    text: |-
      Voor zoverre de bepalingen van deze wet ten aanzien van enige belasting in werking zijn getreden, blijven,
      behoudens ten aanzien van begane strafbare feiten, de bepalingen in andere belastingwetten betreffende de
      onderwerpen, geregeld in eerstbedoelde bepalingen, ten aanzien van die belasting in zoverre buiten toepassing.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel95
  - number: '96'
    text: Deze wet kan worden aangehaald als "Algemene wet inzake rijksbelastingen".
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel96
