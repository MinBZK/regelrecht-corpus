    text: |-
      [artikel 9, eerste lid, van de Wet op de dividendbelasting 1965][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002515#Artikel9
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67ca
    references:
      - id: ref1
