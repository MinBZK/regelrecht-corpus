preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het ter vereenvoudiging van de wetgeving inzake rijksbelastingen
    wenselijk is, regelen welke aan een aantal belastingen gemeen zijn, in een algemene wet samen te vatten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      De bepalingen van deze wet gelden in Nederland bij de heffing van rijksbelastingen, de heffing van belastingrente,
      revisierente en bestuurlijke boeten welke ingevolge de belastingwet kunnen worden vastgesteld of opgelegd, alsmede
      bij de uitvoering van de basisregistratie inkomen, een en ander met uitzondering van de belastingen voor zover voor
      een belanghebbende na een door de inspecteur gedane uitspraak op bezwaar met betrekking tot deze belastingen beroep
      openstaat bij de Raad van Beroep voor belastingzaken, bedoeld in [hoofdstuk VIII van de Belastingwet BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029244#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0029244
        hoofdstuk: VIII
  - number: '1.2'
    text: Onder rijksbelastingen worden verstaan belastingen welke van rijkswege door de rijksbelastingdienst worden geheven.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel1
  - number: '1.3'
    text: |-
      Met betrekking tot de heffing van rijksbelastingen blijven [titel 5.2][ref1] en
      [afdeling 10.2.1 van de Algemene wet bestuursrecht][ref2] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
