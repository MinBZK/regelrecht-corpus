        artikel: '9'
  - number: 67ca.1.e
    text: |-
      de [artikelen 34c, eerste lid][ref1], [34e][ref2], [34g][ref3] en
      [35a, eerste en tweede lid, van de Wet op de omzetbelasting 1968][ref4], of


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel34c
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel34e
