  - number: 29b.1
    text: |-
      De andere partij dan de partij die het beroep in cassatie heeft ingesteld, kan binnen acht weken na de dag van
      verzending van het beroepschrift:
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel29b
  - number: 29b.1.a
    text: een verweerschrift indienen;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel29b
  - number: 29b.1.b
    text: incidenteel beroep in cassatie instellen.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel29b
  - number: 29b.2
    text: |-
      De Hoge Raad kan de in het eerste lid en de in [artikel 8:110, derde lid, van de Algemene wet bestuursrecht][ref1]
      bedoelde termijnen verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel29b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 29c.1
    text: |-
      Indien, hetzij in het beroepschrift hetzij in het verweerschrift hetzij nadien door degene die beroep in cassatie
      heeft ingesteld, binnen twee weken nadat het afschrift van het verweerschrift ter post is bezorgd, schriftelijk is
      verzocht de zaak mondeling te mogen toelichten, bepaalt de Hoge Raad dag en uur waarop de zaak door de advocaten
      van partijen zal kunnen worden bepleit. De griffier stelt beide partijen of de door hen aangewezen advocaten
      hiervan ten minste tien dagen tevoren in kennis.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel29c
  - number: 29c.2
    text: |-
      De advocaten kunnen in plaats van de zaak mondeling bij pleidooi toe te lichten een schriftelijke toelichting
      overleggen of toezenden.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel29c
  - number: 29c.3
    text: |-
      [Artikel 8:62 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing voor zover het beroep in
      cassatie is gericht tegen een uitspraak waarbij de gehele of gedeeltelijke handhaving van een bestuurlijke boete in
      het geding is.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel29c
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 29c.4
    text: |-
      In andere gevallen dan in het derde lid bedoeld, heeft de mondelinge behandeling plaats met gesloten deuren, maar
      kan de Hoge Raad bepalen dat de behandeling openbaar is, voor zover de belangen van partijen daardoor niet worden
      geschaad.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel29c
  - number: 29d.1
    text: |-
      Nadat de toelichtingen zijn gehouden of ontvangen of, indien deze niet zijn verzocht, na indiening van de
      schrifturen door partijen, stelt de griffier, indien de procureur-generaal bij de Hoge Raad de wens te kennen heeft
      gegeven om te worden gehoord, alle stukken in diens handen.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel29d
  - number: 29d.2
    text: De procureur-generaal brengt zijn schriftelijke conclusie ter kennis van de Hoge Raad.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel29d
  - number: 29d.3
    text: |-
      Een afschrift van de conclusie wordt aan partijen gezonden. Partijen kunnen binnen twee weken na verzending van het
      afschrift van de conclusie hun schriftelijk commentaar daarop aan de Hoge Raad doen toekomen.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel29d
  - number: 29e.1
    text: De uitspraak van de Hoge Raad wordt schriftelijk gedaan.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel29e
  - number: 29e.2
    text: |-
      Wanneer de Hoge Raad, hetzij op de in het beroepschrift aangevoerde, hetzij op andere gronden, de uitspraak van het
      gerechtshof, de rechtbank of de voorzieningenrechter vernietigt, beslist hij bij dezelfde uitspraak de zaak, zoals
      het gerechtshof, de rechtbank of de voorzieningenrechter had behoren te doen. Indien de beslissing van de hoofdzaak
      afhangt van feiten die bij de vroegere behandeling niet zijn komen vast te staan, verwijst de Hoge Raad, tenzij het
      punten van ondergeschikte aard betreft, het geding naar een gerechtshof of een rechtbank, ter verdere behandeling
      en beslissing van de zaak met inachtneming van de uitspraak van de Hoge Raad.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel29e
  - number: 29f.1
    text: |-
      In geval van intrekking van het beroep in cassatie door Onze Minister, kan Onze Minister op
      verzoek van de belanghebbende bij afzonderlijke uitspraak met overeenkomstige toepassing van
      [artikel 8:75 van de Algemene wet bestuursrecht][ref1] in de kosten worden veroordeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel29f
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 29f.2
    text: |-
      De griffier zendt een door hem voor eensluidend getekend afschrift van de intrekking onverwijld aan die
      belanghebbende.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel29f
  - number: 29f.3
    text: |-
      De [artikelen 6:5 tot en met 6:9][ref1], [6:11][ref2], [6:14][ref3], [6:15][ref4], [6:17][ref5], [6:21][ref6] en
      [8:75a, tweede lid, eerste en tweede volzin, van de Algemene wet bestuursrecht][ref7] zijn van overeenkomstige
      toepassing, alsmede de [artikelen 29c][ref8] en [29d][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref8]: https://wetten.overheid.nl/BWBR0002320#Artikel29c
      [ref9]: https://wetten.overheid.nl/BWBR0002320#Artikel29d
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel29f
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
