  - number: '2.4'
    text: |-
      Het in de belastingwet genoemde bestuur van ’s Rijks belastingen wordt uitgeoefend door de door Onze Minister
      aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel2
  - number: '2.5'
    text: |-
      Hetgeen bij of krachtens deze wet wordt bepaald inzake de in het derde lid, onderdeel e, bedoelde voorlopige
      aanslag, aanslag of navorderingsaanslag, is van overeenkomstige toepassing met betrekking tot de in dat
      onderdeel bedoelde voorlopige conserverende aanslag, onderscheidenlijk conserverende aanslag of conserverende
      navorderingsaanslag, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel2
  - number: 2.5.a
    text: |-
      een voorlopige aanslag en in de belastingwet daartoe aangewezen voorheffingen niet worden verrekend met een
      conserverende aanslag en een voorlopige conserverende aanslag niet wordt verrekend met een aanslag;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel2
  - number: 2.5.b
    text: |-
      een voorlopige conserverende aanslag niet wordt verrekend met een conserverende aanslag doch vervalt tegelijk met
      de vaststelling van de conserverende aanslag onder toerekening van het ter zake van de voorlopige conserverende
      aanslag verleende uitstel van betaling, de daaromtrent gestelde zekerheid, alsmede van de betalingen die op die
      conserverende voorlopige aanslag mochten zijn verricht, aan de conserverende aanslag.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel2
  - number: '2.6'
    text: |-
      Bepalingen van de belastingwet die rechtsgevolgen verbinden aan het aangaan, het bestaan, de beëindiging of het
      beëindigd zijn van een huwelijk zijn van overeenkomstige toepassing op het aangaan, het bestaan, de beëindiging
      onderscheidenlijk het beëindigd zijn van een geregistreerd partnerschap.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel2
  - number: '2.7'
    text: |-
      Voor de toepassing van de belastingwet en de daarop berustende bepalingen wordt een Europese coöperatieve
      vennootschap gelijkgesteld met een Europese naamloze vennootschap met dien verstande dat bij algemene maatregel
      van bestuur voor de toepassing van de in die algemene maatregel van bestuur genoemde bepalingen de rechtsvorm
      gelijkgesteld kan worden met een coöperatie.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel2
  - number: '3.1'
    text: |-
      De bevoegdheid van een directeur, inspecteur of ontvanger is niet bepaald naar een geografische indeling van het
      Rijk.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel3
  - number: '3.2'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de hoofdlijnen van de inrichting van de
      rijksbelastingdienst alsmede omtrent de functionaris, bedoeld in [artikel 2, derde lid, onderdeel b][ref1], onder
      wie een belastingplichtige ressorteert.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel2
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '2'
        hoofdstuk: I
  - number: '4.1'
    text: Waar iemand woont en waar een lichaam gevestigd is, wordt naar de omstandigheden beoordeeld.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel4
  - number: '4.2'
    text: |-
      Voor de toepassing van het eerste lid worden schepen en luchtvaartuigen welke in Nederland hun thuishaven hebben,
      ten opzichte van de bemanning als deel van Nederland beschouwd.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel4
  - number: '4.3'
    text: |-
      Voor de toepassing van de wettelijke bepalingen ter uitvoering van Richtlijn nr. 2009/133/EG van de Raad van de
      Europese Unie van 19 oktober 2009 betreffende de gemeenschappelijke fiscale regeling voor fusies, splitsingen,
      gedeeltelijke splitsingen, inbreng van activa en aandelenruil met betrekking tot vennootschappen uit verschillende
      lidstaten en voor de verplaatsing van de statutaire zetel van een SE of een SCE van een lidstaat naar een andere
      lidstaat (PbEU L 310), Richtlijn 2011/96/EU van de Raad van 30 november 2011 betreffende de gemeenschappelijke
      fiscale regeling voor moedermaatschappijen en dochterondernemingen uit verschillende lidstaten (PbEU 2011, L
      345/8) of [Richtlijn nr. 2003/49/EG](32003L0049) van de Raad van de Europese Unie van 3 juni 2003 betreffende een
      gemeenschappelijke belastingregeling inzake uitkeringen van interest en royalty's tussen verbonden ondernemingen
      van verschillende lidstaten (Pb L 157) wordt, in afwijking in zoverre van het eerste lid en voor zover dat
      voortvloeit uit de genoemde Richtlijnen, een lichaam geacht te zijn gevestigd in een Lid-Staat van de Europese
      Gemeenschappen indien dat lichaam volgens de fiscale wetgeving van de Lid-Staat aldaar is gevestigd.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel4
  - number: '4.4'
    text: |-
      Een instelling voor collectieve belegging in effecten als bedoeld in artikel 1 van Richtlijn nr. 2009/65/EU van
      het Europees Parlement en de Raad van de Europese Unie van 13 juli 2009 tot coördinatie van de wettelijke en
      bestuursrechtelijke bepalingen betreffende instellingen voor collectieve belegging in effecten (PbEU L 302/32),
      wordt geacht te zijn gevestigd in de lidstaat of staat waarvan de bevoegde autoriteit de instelling overeenkomstig
      artikel 5 van die richtlijn heeft toegelaten.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel4
  - number: '5.1'
    text: |-
      De vaststelling van een belastingaanslag geschiedt door het ter zake daarvan opmaken van een aanslagbiljet door de
      inspecteur. De dagtekening van het aanslagbiljet geldt als dagtekening van de vaststelling van de belastingaanslag.
      De inspecteur stelt het aanslagbiljet ter invordering van de daaruit blijkende belastingaanslag aan de ontvanger
      ter hand.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5
  - number: '5.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing met betrekking tot het door de inspecteur nemen van een
      beschikking of het doen van uitspraak strekkende tot - al dan niet nadere - vaststelling van een ingevolge de
      belastingwet verschuldigd of terug te geven bedrag.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5
  - number: 5a.1
    text: 'Als partner wordt aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5a
  - number: 5a.1.a
    text: de echtgenoot;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5a
  - number: 5a.1.b
    text: |-
      de ongehuwde meerderjarige persoon waarmee de ongehuwde meerderjarige belastingplichtige een notarieel
      samenlevingscontract is aangegaan en met wie hij staat ingeschreven op hetzelfde woonadres in de gemeentelijke
      basisadministratie persoonsgegevens of een daarmee naar aard en strekking overeenkomende administratie buiten
      Nederland.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5a
  - number: 5a.2
    text: |-
      Degene die ingevolge het eerste lid voor een deel van het kalenderjaar als partner wordt aangemerkt, wordt ook
      als partner aangemerkt in de andere perioden van het kalenderjaar, voor zover hij in die perioden op hetzelfde
      woonadres als de belastingplichtige staat ingeschreven in de gemeentelijke basisadministratie persoonsgegevens of
      een daarmee naar aard en strekking overeenkomende administratie buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5a
  - number: 5a.3
    text: |-
      Voor de toepassing van het eerste lid wordt een persoon die van tafel en bed is gescheiden, aangemerkt als
      ongehuwd. Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit lid.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5a
  - number: 5a.4
    text: 'In afwijking van het eerste lid wordt een persoon niet meer als partner aangemerkt ingeval:'
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5a
  - number: 5a.4.a
    text: |-
      een verzoek, zoals bedoeld in [artikel 150][ref1], respectievelijk [169 van Boek 1 van het Burgerlijk Wetboek][ref2]
      tot echtscheiding, respectievelijk tot scheiding van tafel en bed is ingediend, en


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel150
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel169
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '150'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '169'
  - number: 5a.4.b
    text: |-
      hij niet meer op hetzelfde woonadres in de gemeentelijke basisadministratie persoonsgegevens of een daarmee naar
      aard en strekking overeenkomende administratie buiten Nederland staat ingeschreven als de belastingplichtige.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5a
  - number: 5a.5
    text: |-
      Een persoon kan op enig moment slechts één partner hebben. Ingeval een persoon meer dan één echtgenoot heeft,
      wordt alleen de echtgenoot uit de oudste verbintenis als partner aangemerkt. Bij meer dan één notarieel
      samenlevingscontract, wordt alleen het oudste samenlevingscontract in aanmerking genomen. Een notarieel
      samenlevingscontract met meer dan één persoon, wordt niet in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5a
  - number: 5a.6
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld op basis waarvan iemand die niet in Nederland woont, geacht
      wordt op zijn woonadres te zijn ingeschreven in een naar aard en strekking met de gemeentelijke basisadministratie
      persoonsgegevens overeenkomende administratie buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5a
  - number: 5a.7
    text: |-
      Personen die partners waren op grond van het eerste lid, onderdeel b, blijven als partners aangemerkt nadat de in
      dat onderdeel bedoelde inschrijving op hetzelfde woonadres niet langer mogelijk is als gevolg van opname in een
      verpleeghuis of verzorgingshuis vanwege medische redenen of ouderdom van een van hen, zolang na het einde van die
      inschrijving op hetzelfde woonadres ten aanzien van geen van beiden een derde persoon als partner wordt aangemerkt.
      De eerste volzin vindt geen toepassing meer indien één van beiden door middel van een schriftelijke kennisgeving
      aan de inspecteur laat weten dat zij niet langer als partners willen worden aangemerkt. Bij ministeriële regeling
      kunnen nadere regels worden gesteld ten behoeve van de uitvoering van dit lid.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5a
  - number: 5b.1
    text: 'Een algemeen nut beogende instelling is:'
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5b
  - number: 5b.1.a
    text: |-
      een instelling – niet zijnde een vennootschap met in aandelen verdeeld kapitaal, een coöperatie, een onderlinge
      waarborgmaatschappij of een ander lichaam waarin bewijzen van deelgerechtigdheid kunnen worden uitgegeven – die:
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5b
  - number: 5b.1.a.1°
    text: uitsluitend of nagenoeg uitsluitend het algemeen nut beoogt;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5b
  - number: 5b.1.a.2°
    text: voldoet aan bij ministeriële regeling te stellen voorwaarden;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5b
  - number: 5b.1.a.3°
    text: |-
      gevestigd is in het Koninkrijk, in een andere lidstaat van de Europese Unie of in een bij ministeriële regeling
      aangewezen staat, en
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5b
  - number: 5b.1.a.4°
    text: door de inspecteur als zodanig is aangemerkt;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5b
  - number: 5b.1.b
    text: |-
      een niet in het Koninkrijk, in een andere lidstaat van de Europese Unie of in een bij ministeriële regeling
      aangewezen staat gevestigde, door Onze Minister als zodanig aangemerkte instelling indien en zolang zij voldoet aan
      de door hem te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5b
  - number: 5b.2
    text: |-
      Publiekrechtelijke lichamen als bedoeld in [artikel 1, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1]
      zijn algemeen nut beogende instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel1
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '1'
  - number: 5b.3
    text: 'Als algemeen nut in de zin van dit artikel wordt beschouwd:'
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5b
  - number: 5b.3.a
    text: welzijn;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5b
  - number: 5b.3.b
    text: cultuur;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5b
  - number: 5b.3.c
    text: onderwijs, wetenschap en onderzoek;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5b
  - number: 5b.3.d
    text: bescherming van natuur en milieu, daaronder begrepen bevordering van duurzaamheid;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5b
  - number: 5b.3.e
    text: gezondheidszorg;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5b
  - number: 5b.3.f
    text: jeugd- en ouderenzorg;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5b
  - number: 5b.3.g
    text: ontwikkelingssamenwerking;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5b
  - number: 5b.3.h
    text: dierenwelzijn;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5b
  - number: 5b.3.i
    text: religie, levensbeschouwing en spiritualiteit;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5b
  - number: 5b.3.j
    text: de bevordering van de democratische rechtsorde;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5b
  - number: 5b.3.k
    text: volkshuisvesting;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5b
  - number: 5b.3.l
    text: een combinatie van de bovengenoemde doelen, alsmede
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5b
  - number: 5b.3.m
    text: het financieel of op andere wijze ondersteunen van een algemeen nut beogende instelling.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5b
  - number: 5b.4
    text: |-
      Een algemeen nut beogende instelling die zich uitsluitend of nagenoeg uitsluitend richt op cultuur, kan verzoeken
      tevens te worden aangemerkt als culturele instelling.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5b
  - number: 5b.5
    text: |-
      Een instelling die werkzaamheden verricht die gericht zijn op het bieden van volkshuisvesting als bedoeld in het
      derde lid, onderdeel k, kan slechts worden aangemerkt als algemeen nut beogende instelling, indien zij op de voet
      van [artikel 70 van de Woningwet][ref1] bij koninklijk besluit is toegelaten als instelling die in het belang van
      de volkshuisvesting werkzaam is.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '70'
  - number: 5b.6
    text: |-
      Het aanmerken als een algemeen nut beogende instelling of als culturele instelling geschiedt op verzoek van de
      instelling. De inspecteur beslist op het verzoek bij voor bezwaar vatbare beschikking eventueel onder door hem te
      stellen voorwaarden. In afwijking van de eerste volzin kan de inspecteur een categorie instellingen dan wel een
      groep met elkaar verbonden instellingen bij één voor bezwaar vatbare beschikking aanmerken als instellingen als
      bedoeld in het eerste lid, ook zonder dat een daartoe strekkend verzoek is gedaan door die instellingen.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5b
  - number: 5b.7
    text: |-
      Een instelling als bedoeld in het eerste lid, wordt door de inspecteur bij voor bezwaar vatbare beschikking
      niet meer als zodanig aangemerkt met ingang van het tijdstip waarop deze instelling niet langer uitsluitend of
      nagenoeg uitsluitend een algemeen nut beogend karakter heeft, niet meer voldoet aan de bij ministeriële regeling
      gestelde voorwaarden dan wel niet meer is gevestigd als aangegeven in het eerste lid. Een instelling als bedoeld
      in het vierde lid wordt door de inspecteur bij voor bezwaar vatbare beschikking niet meer als zodanig aangemerkt
      met ingang van het tijdstip waarop deze instelling zich niet langer uitsluitend of nagenoeg uitsluitend richt op
      cultuur. Het tijdstip van intrekking kan liggen voor de datum van de dagtekening van de beschikking.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5b
  - number: 5b.8
    text: |-
      Een instelling wordt eveneens door de inspecteur niet, of niet langer, als algemeen nut beogende instelling
      aangemerkt indien de instelling, een bestuurder van die instelling of een persoon die feitelijk leiding geeft
      aan die instelling, dan wel een voor de instelling gezichtsbepalend persoon onherroepelijk is veroordeeld wegens
      aanzetten tot haat, aanzetten tot geweld of gebruik van geweld en nog geen vier kalenderjaren zijn verstreken sinds
      deze veroordeling.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5b
  - number: 5b.9
    text: |-
      Voor de toepassing van het vierde en het zesde tot en met achtste lid kunnen bij ministeriële regeling nadere
      regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5b
  - number: 5c
    text: 'Een sociaal belang behartigende instelling is een instelling:'
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5c
  - number: 5c.a
    text: die in overeenstemming met haar regelgeving een sociaal belang behartigt;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5c
  - number: 5c.b
    text: die niet aan een winstbelasting is onderworpen dan wel daarvan is vrijgesteld;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5c
  - number: 5c.c
    text: |-
      die aan de leden van het orgaan van de instelling dat het beleid bepaalt ter zake van de door die leden voor de
      instelling verrichte werkzaamheden geen andere beloning toekent dan een vergoeding voor gemaakte onkosten en een
      niet bovenmatig vacatiegeld;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5c
  - number: 5c.d
    text: |-
      die is gevestigd in het Koninkrijk, in een andere lidstaat van de Europese Unie of in een bij ministeriële regeling
      aangewezen staat.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5c
  - number: 5d.1
    text: |-
      Een steunstichting SBBI is een stichting die voldoet aan bij ministeriële regeling te stellen voorwaarden en die
      is opgericht uitsluitend met het doel geld in te zamelen ter ondersteuning van een sociaal belang behartigende
      instelling ten behoeve van een bij ministeriële regeling aan te wijzen doel.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5d
  - number: 5d.2
    text: |-
      Het ontwerp van een ministeriële regeling als bedoeld in het eerste lid wordt ten minste vier weken voordat de
      regeling wordt vastgesteld, overgelegd aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel5d
  - number: '6.1'
    text: |-
      Met betrekking tot belastingen welke ingevolge de belastingwet bij wege van aanslag worden geheven, dan wel op
      aangifte worden voldaan of afgedragen, kan de inspecteur degene die naar zijn mening vermoedelijk belastingplichtig
      of inhoudingsplichtig is uitnodigen tot het doen van aangifte. Worden door de belastingwet aangelegenheden van
      een derde aangemerkt als aangelegenheden van degene die vermoedelijk belastingplichtig of inhoudingsplichtig is,
      dan kan de inspecteur ook die derde uitnodigen tot het doen van aangifte. Bij ministeriële regeling worden regels
      gesteld met betrekking tot de wijze waarop het uitnodigen tot het doen van aangifte geschiedt.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel6
  - number: '6.2'
    text: |-
      Degene die een daartoe strekkend verzoek bij de inspecteur indient, wordt in elk geval uitgenodigd tot het doen
      van aangifte.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel6
  - number: '6.3'
    text: |-
      Bij ministeriële regeling kan degene, die in de daarbij omschreven omstandigheden verkeert, worden verplicht om
      binnen een te stellen termijn om uitnodiging tot het doen van aangifte te verzoeken.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel6
  - number: '7.1'
    text: |-
      In de uitnodiging tot het doen van aangifte wordt opgave verlangd van gegevens en kan overlegging of toezending
      worden gevraagd van bescheiden en andere gegevensdragers of de inhoud daarvan, waarvan de kennisneming voor de
      heffing van de belasting van belang kan zijn.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel7
  - number: '7.2'
    text: |-
      Onder bescheiden en andere gegevensdragers worden voor de toepassing van het eerste lid niet begrepen bescheiden en
      andere gegevensdragers welke plegen te worden opgemaakt om te dienen als bewijs tegenover derden.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel7
  - number: '8.1'
    text: 'Ieder die is uitgenodigd tot het doen van aangifte, is gehouden aangifte te doen door:'
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel8
  - number: 8.1.a
    text: |-
      de in de uitnodiging gevraagde gegevens duidelijk, stellig en zonder voorbehoud op bij ministeriële regeling te
      bepalen wijze in te vullen, te ondertekenen en in te leveren of toe te zenden, alsmede
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel8
  - number: 8.1.b
    text: |-
      de in de uitnodiging gevraagde bescheiden of andere gegevensdragers, dan wel de inhoud daarvan, op bij ministeriële
      regeling te bepalen wijze in te leveren of toe te zenden.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel8
  - number: '8.2'
    text: 'Bij ministeriële regeling kan worden bepaald:'
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel8
  - number: 8.2.a
    text: |-
      voor welke belastingen of groepen van belastingplichtigen of inhoudingsplichtigen het doen van aangifte uitsluitend
      langs elektronische weg kan geschieden, en
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel8
  - number: 8.2.b
    text: |-
      onder welke voorwaarden hiervan door de inspecteur bij voor bezwaar vatbare beschikking ontheffing kan worden
      verleend.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel8
  - number: '8.3'
    text: |-
      Het doen van aangifte is geen aanvraag in de zin van
      [artikel 1:3, derde lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
  - number: '8.4'
    text: Bij ontvangst van de aangifte wordt desverlangd een ontvangstbevestiging afgegeven.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel8
  - number: '8.5'
    text: |-
      Bij ministeriële regeling kan worden bepaald in welke gevallen en onder welke voorwaarden de inspecteur ontheffing
      kan verlenen van de verplichting de in de uitnodiging tot het doen van aangifte gevraagde gegevens en bescheiden en
      andere gegevensdragers of de inhoud daarvan in te leveren of toe te zenden.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel8
  - number: '8.6'
    text: |-
      [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] is van toepassing op verzoeken aan de inspecteur tot
      ontheffing op grond van bepalingen krachtens het tweede lid, onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '9.1'
    text: |-
      Met betrekking tot belastingen welke ingevolge de belastingwet bij wege van aanslag worden geheven, wordt de
      aangifte gedaan bij de inspecteur binnen een door deze gestelde termijn van ten minste een maand na het uitnodigen
      tot het doen van aangifte.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel9
  - number: '9.2'
    text: |-
      De inspecteur kan de door hem gestelde termijn verlengen. Hij kan aan de verlenging voorwaarden verbinden, onder
      meer dat vóór een door hem te bepalen datum op bij ministeriële regeling te bepalen wijze gegevens voor het
      opleggen van een voorlopige aanslag worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel9
  - number: '9.3'
    text: |-
      De inspecteur kan niet eerder dan na verloop van de in het eerste, onderscheidenlijk het tweede lid bedoelde
      termijn de belastingplichtige aanmanen binnen een door hem te stellen termijn aangifte te doen.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel9
  - number: '10.1'
    text: |-
      Met betrekking tot belastingen welke ingevolge de belastingwet op aangifte moeten worden voldaan of afgedragen,
      wordt de aangifte gedaan bij de inspecteur of de ontvanger die is vermeld in de uitnodiging tot het doen van
      aangifte.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel10
  - number: '10.2'
    text: |-
      Heeft de aangifte betrekking op een tijdvak, dan wordt zij gedaan binnen een door de inspecteur gestelde termijn
      van ten minste een maand na het einde van het tijdvak. Heeft de aangifte niet betrekking op een tijdvak, dan wordt
      zij gedaan binnen een door de inspecteur gestelde termijn van ten minste een maand.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel10
  - number: '10.3'
    text: De inspecteur kan onder door hem te stellen voorwaarden uitstel van het doen van aangifte verlenen.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel10
  - number: 10a.1
    text: |-
      In bij algemene maatregel van bestuur aan te wijzen gevallen kunnen belastingplichtigen of inhoudingsplichtigen
      worden gehouden de inspecteur eigener beweging mededeling te doen van onjuistheden of onvolledigheden in voor de
      belastingheffing van belang zijnde gegevens en inlichtingen die hun bekend zijn of zijn geworden.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel10a
  - number: 10a.2
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het uiterste tijdstip en de
      wijze waarop mededeling als bedoeld in het eerste lid gedaan moet worden.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel10a
  - number: 10a.3
    text: |-
      Bij algemene maatregel van bestuur kan het niet nakomen van de in het eerste en tweede lid bedoelde verplichting
      worden aangemerkt als een overtreding. Indien het niet nakomen van die verplichting is te wijten aan opzet of grove
      schuld van de belastingplichtige of inhoudingsplichtige, vormt dit een vergrijp ter zake waarvan de inspecteur hem
      een bestuurlijke boete kan opleggen van ten hoogste 100 percent van het bedrag aan belasting dat als gevolg van het
      niet nakomen van de in het eerste en tweede lid bedoelde verplichting niet is of zou zijn geheven.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel10a
  - number: '11.1'
    text: De aanslag wordt vastgesteld door de inspecteur.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel11
  - number: '11.2'
    text: |-
      De inspecteur kan bij het vaststellen van de aanslag van de aangifte afwijken, zomede de aanslag ambtshalve
      vaststellen.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel11
  - number: '11.3'
    text: |-
      De bevoegdheid tot het vaststellen van de aanslag vervalt door verloop van drie jaren na het tijdstip waarop de
      belastingschuld is ontstaan. Indien voor het doen van aangifte uitstel is verleend, wordt deze termijn met de duur
      van dit uitstel verlengd.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel11
  - number: '11.4'
    text: |-
      Voor de toepassing van het derde lid wordt belastingschuld, waarvan de grootte eerst kan worden vastgesteld na
      afloop van het tijdvak waarover de belasting wordt geheven, geacht te zijn ontstaan op het tijdstip waarop dat
      tijdvak eindigt.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel11
  - number: '12'
    text: |-
      De inspecteur neemt het besluit om aan hem die aangifte heeft gedaan, geen aanslag op te leggen, bij voor bezwaar
      vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel12
  - number: '13.1'
    text: |-
      Ingeval de grootte van de belastingschuld eerst kan worden vastgesteld na afloop van het tijdvak waarover
      de belasting wordt geheven, kan de inspecteur volgens bij ministeriële regeling te stellen regels aan de
      belastingplichtige een voorlopige aanslag opleggen tot ten hoogste het bedrag waarop de aanslag, met toepassing van
      de in [artikel 15][ref1] voorgeschreven verrekening van de voorlopige aanslagen en de in de belastingwet aangewezen
      voorheffingen, vermoedelijk zal worden vastgesteld. Een voorlopige aanslag tot een positief bedrag wordt niet
      vastgesteld voor de aanvang van het tijdvak waarover de belasting wordt geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel15
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '15'
        hoofdstuk: III
  - number: '13.2'
    text: |-
      Een voorlopige aanslag tot een negatief bedrag die voor of in de loop van het tijdvak wordt vastgesteld, wordt
      aangeduid als voorlopige teruggaaf.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel13
  - number: '13.3'
    text: |-
      Een voorlopige aanslag kan, met inachtneming van de vorige leden, door een of meer voorlopige aanslagen worden
      aangevuld.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel13
  - number: '14.1'
    text: |-
      In de gevallen waarin [artikel 13][ref1] niet van toepassing is, kan de inspecteur na het tijdstip waarop de
      belastingschuld is ontstaan, volgens door Onze Minister te stellen regelen een voorlopige aanslag opleggen tot ten
      hoogste het bedrag waarop de aanslag vermoedelijk zal worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel13
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '13'
        hoofdstuk: III
  - number: '14.2'
    text: |-
      Een voorlopige aanslag kan met inachtneming van het in het eerste lid bepaalde, door één of meer voorlopige
      aanslagen worden aangevuld.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel14
  - number: '15'
    text: |-
      De voorlopige aanslagen en de in de belastingwet aangewezen voorheffingen worden verrekend met de aanslag, dan wel
        - voor zoveel nodig - bij een door de inspecteur te nemen voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel15
  - number: '16.1'
    text: |-
      Indien enig feit grond oplevert voor het vermoeden dat een aanslag ten onrechte achterwege is gelaten of tot een
      te laag bedrag is vastgesteld, dan wel dat een in de belastingwet voorziene vermindering, ontheffing, teruggaaf
      of heffingskorting ten onrechte of tot een te hoog bedrag is verleend, kan de inspecteur de te weinig geheven
      belasting dan wel de ten onrechte of tot een te hoog bedrag verleende heffingskorting navorderen. Een feit, dat
      de inspecteur bekend was of redelijkerwijs bekend had kunnen zijn, kan geen grond voor navordering opleveren,
      behoudens in de gevallen waarin de belastingplichtige ter zake van dit feit te kwader trouw is.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel16
  - number: '16.2'
    text: 'Navordering kan mede plaatsvinden in alle gevallen waarin te weinig belasting is geheven, doordat:'
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel16
  - number: 16.2.a
    text: |-
      een voorlopige aanslag, een voorheffing, een voorlopige teruggaaf of een voorlopige verliesverrekening ten onrechte
      of tot een onjuist bedrag is verrekend;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel16
  - number: 16.2.b
    text: |-
      zich een geval voordoet als bedoeld in [artikel 2.17, derde of vierde lid, van de Wet inkomstenbelasting 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
  - number: 16.2.c
    text: |-
      ten gevolge van een fout een aanslag ten onrechte achterwege is gelaten of ten gevolge van een fout een
      belastingaanslag tot een te laag bedrag is vastgesteld, hetgeen de belastingplichtige redelijkerwijs kenbaar is,
      waarvan in elk geval sprake is indien de te weinig geheven belasting ten minste 30 percent van de ingevolge de
      belastingwet verschuldigde belasting bedraagt.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel16
  - number: '16.3'
    text: |-
      De bevoegdheid tot het vaststellen van een navorderingsaanslag vervalt door verloop van vijf jaren na het
      tijdstip waarop de belastingschuld is ontstaan. [Artikel 11, vierde lid][ref1], is te dezen van toepassing.
      Indien voor het doen van aangifte uitstel is verleend, wordt de navorderingstermijn met de duur van dit
      uitstel verlengd. De eerste volzin is niet van toepassing voor zover navordering plaatsvindt met toepassing van
      [artikel 2.17, vierde lid, van de Wet inkomstenbelasting 2001][ref2]. Voor zover navordering zonder toepassing
      van het tweede lid, onderdeel c, niet zou kunnen plaatsvinden, vervalt de bevoegdheid tot het vaststellen van een
      navorderingsaanslag, in afwijking in zoverre van de eerste volzin, door verloop van twee jaren na het tijdstip
      waarop het besluit is genomen om geen aanslag op te leggen, dan wel de belastingaanslag is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '11'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '2'
  - number: '16.4'
    text: |-
      Indien te weinig belasting is geheven over een bestanddeel van het voorwerp van enige belasting dat in het
      buitenland wordt gehouden of is opgekomen, vervalt, in afwijking in zoverre van het derde lid, eerste volzin, de
      bevoegdheid tot navorderen door verloop van twaalf jaren na het tijdstip waarop de belastingschuld is ontstaan.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel16
  - number: '16.5'
    text: |-
      Indien een bedrag als verlies van een jaar door middel van verrekening in aanmerking is genomen in een voorafgaand
      jaar, en in verband daarmede een in de belastingwet voorziene vermindering of teruggaaf ten onrechte of tot een te
      hoog bedrag is verleend, blijft de bevoegdheid tot navorderen bestaan zolang navordering mogelijk is over het jaar
      waaruit het als verlies verrekende bedrag afkomstig is.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel16
  - number: '16.6'
    text: |-
      Indien een heffingskorting ten onrechte of tot een te hoog bedrag is verleend aan de
      belastingplichtige doordat het maximale bedrag, bedoeld in de [artikelen 8.9, eerste lid][ref1],
      of [8.9a, derde lid, van de Wet inkomstenbelasting 2001][ref2], is overschreden, blijft, na afloop van de
      navorderingstermijn bedoeld in het derde lid, de bevoegdheid tot navorderen bestaan tot acht weken na het tijdstip
      waarop een belastingaanslag van zijn partner welke relevant is voor die heffingskorting, of een beschikking dan
      wel uitspraak strekkende tot vermindering van een zodanige belastingaanslag van zijn partner onherroepelijk is
      geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '8'
  - number: 18a.1
    text: |-
      Indien een op de voet van [hoofdstuk IV van de Wet waardering onroerende zaken][ref1] gegeven beschikking tot
      vaststelling van de waarde, welke ingevolge een wettelijk voorschrift ten grondslag heeft gelegen aan de heffing
      van belasting, is herzien met als gevolg dat:


      [ref1]: https://wetten.overheid.nl/BWBR0007119#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0007119
        hoofdstuk: IV
  - number: 18a.1.a
    text: |-
      een aanslag of navorderingsaanslag ten onrechte achterwege is gelaten of tot een te laag bedrag is vastgesteld,
      dan wel dat een in de belastingwet voorziene vermindering, ontheffing of teruggaaf ten onrechte of tot een te hoog
      bedrag is verleend, dan kan de inspecteur de te weinig geheven belasting navorderen;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel18a
  - number: 18a.1.b
    text: |-
      een aanslag of navorderingsaanslag ten onrechte of tot een te hoog bedrag is vastgesteld, dan wel dat een in
      de belastingwet voorziene vermindering, ontheffing of teruggaaf ten onrechte niet of tot een te laag bedrag
      is verleend, dan vernietigt de inspecteur de ten onrechte vastgestelde aanslag of navorderingsaanslag dan wel
      vermindert hij de aanslag of navorderingsaanslag, onderscheidenlijk verleent hij alsnog de in de belastingwet
      voorziene vermindering, ontheffing of teruggaaf.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel18a
  - number: 18a.2
    text: |-
      Het vaststellen van de navorderingsaanslag, onderscheidenlijk het nemen van de beschikking tot vernietiging,
      vermindering, ontheffing of teruggaaf op de voet van het eerste lid geschiedt binnen acht weken na het tijdstip
      waarop de beschikking of uitspraak strekkende tot de herziene vaststelling van de waarde onherroepelijk is
      geworden. Eerstbedoelde beschikking is voor bezwaar vatbaar.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel18a
  - number: 18a.3
    text: |-
      Ingeval de herziening gevolgen heeft voor de toepassing van [artikel 3.30a van de Wet inkomstenbelasting 2001][ref1]
      met betrekking tot een jaar, wordt in afwijking in zoverre van het tweede lid de termijn waarbinnen navordering
      mogelijk is bepaald op de voet van [artikel 16][ref2] en vangt de in dat lid bedoelde termijn van acht weken niet
      eerder aan dan op het tijdstip waarop de belastingplichtige een verzoek heeft ingediend tot aanpassing van de
      aanslag of beschikking met betrekking tot dat jaar. Een verzoek tot aanpassing wordt gedaan binnen een jaar na het
      tijdstip waarop de beschikking of uitspraak strekkende tot de herziene vaststelling van de waarde, onherroepelijk
      is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel16
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '16'
        hoofdstuk: III
  - number: 18a.4
    text: |-
      Indien aan de heffing van belasting een aan een onroerende zaak toegekende waarde ten grondslag ligt en met
      betrekking tot die onroerende zaak voor een voor die heffing van belang zijnd kalenderjaar een waarde wordt
      vastgesteld op de voet van [hoofdstuk IV van de Wet waardering onroerende zaken][ref1], zijn het eerste, tweede en
      derde lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0007119
        hoofdstuk: IV
  - number: '19.1'
    text: |-
      In de gevallen waarin de belastingwet voldoening van in een tijdvak verschuldigd geworden of afdracht van
      in een tijdvak ingehouden belasting op aangifte voorschrijft, is de belastingplichtige, onderscheidenlijk de
      inhoudingsplichtige, gehouden de belasting binnen één maand na het einde van dat tijdvak overeenkomstig de aangifte
      aan de ontvanger te betalen.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel19
  - number: '19.2'
    text: 'Bij ministeriële regeling worden regels gesteld:'
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel19
  - number: 19.2.a
    text: |-
      met betrekking tot het tijdvak waarover de belasting moet worden betaald, waarbij tevens regels kunnen worden
      gesteld volgens welke in de loop van dat tijdvak één of meer voorlopige betalingen moeten worden gedaan;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel19
  - number: 19.2.b
    text: |-
      krachtens welke door de inspecteur aan de belastingplichtige, onderscheidenlijk de inhoudingsplichtige, uitstel
      wordt verleend voor de voldoening van in een tijdvak verschuldigd geworden belasting of de afdracht van in een
      tijdvak ingehouden belasting, indien met betrekking tot dat tijdvak dan wel een tijdvak dat is geëindigd vóór,
      tegelijk met of minder dan 34 dagen na dat tijdvak een verzoek om teruggaaf van belasting is ingediend.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel19
  - number: '19.3'
    text: |-
      In de niet in het eerste lid bedoelde gevallen waarin de belastingwet voldoening of afdracht van belasting op
      aangifte voorschrijft, is de belastingplichtige, onderscheidenlijk de inhoudingsplichtige, gehouden de belasting
      overeenkomstig de aangifte aan de ontvanger te betalen binnen één maand na het tijdstip waarop de belastingschuld
      is ontstaan.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel19
  - number: '19.4'
    text: |-
      Indien voor het doen van aangifte uitstel is verleend, wordt de in het eerste en in het derde lid genoemde termijn
      van één maand met de duur van dit uitstel verlengd.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel19
  - number: '19.5'
    text: |-
      De [Algemene termijnenwet][ref1] is niet van toepassing op de in het eerste en in het derde lid gestelde termijn
      van één maand.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002448
  - number: '20.1'
    text: |-
      Indien belasting die op aangifte behoort te worden voldaan of afgedragen, geheel of gedeeltelijk niet is betaald,
      kan de inspecteur de te weinig geheven belasting naheffen. Met geheel of gedeeltelijk niet betaald zijn wordt
      gelijkgesteld het geval waarin, naar aanleiding van een gedaan verzoek, ten onrechte of tot een te hoog bedrag,
      vrijstelling of vermindering van inhouding van belasting dan wel teruggaaf van belasting is verleend.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel20
  - number: '20.2'
    text: |-
      De naheffing geschiedt bij wege van naheffingsaanslag, die wordt opgelegd aan degene, die de belasting had behoren
      te betalen, dan wel aan degene aan wie ten onrechte, of tot een te hoog bedrag, vrijstelling of vermindering van
      inhouding dan wel teruggaaf is verleend. In gevallen waarin ten gevolge van het niet naleven van bepalingen van
      de belastingwet door een ander dan de belastingplichtige, onderscheidenlijk de inhoudingsplichtige, te weinig
      belasting is geheven, wordt de naheffingsaanslag aan die ander opgelegd.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel20
  - number: '20.3'
    text: |-
      De bevoegdheid tot naheffing vervalt door verloop van vijf jaren na het einde van het kalenderjaar waarin de
      belastingschuld is ontstaan of de teruggaaf is verleend.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel20
  - number: '20.4'
    text: |-
      Indien de belastingschuld is ontstaan door de verkrijging van de economische eigendom
      van onroerende zaken of van rechten waaraan deze zijn onderworpen, bedoeld in
      [artikel 2, tweede lid, van de Wet op belastingen van rechtsverkeer][ref1], vervalt de bevoegdheid tot naheffing,
      in afwijking in zoverre van het derde lid, door verloop van twaalf jaren na het einde van het kalenderjaar waarin
      de belastingschuld is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel2
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '2'
  - number: '21'
    text: 'In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21
  - number: 21.a
    text: 'basisregistratie: verzameling gegevens waarvan bij wet is bepaald dat deze authentieke gegevens bevat;'
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21
  - number: 21.b
    text: |-
      authentiek gegeven: in een basisregistratie opgenomen gegeven dat bij wettelijk voorschrift als authentiek is
      aangemerkt;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21
  - number: 21.c
    text: |-
      verzamelinkomen: verzamelinkomen als bedoeld in [artikel 2.18 van de Wet inkomstenbelasting 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
  - number: 21.d
    text: |-
      belastbaar loon: belastbaar loon als bedoeld in [artikel 9 van de Wet op de loonbelasting 1964][ref1], met
      uitzondering van loon dat als een eindheffingsbestanddeel in de zin van die wet is belast;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel9
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '9'
  - number: 21.e
    text: 'inkomensgegeven:'
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21
  - number: 21.e.1°
    text: |-
      indien over een kalenderjaar een aanslag of navorderingsaanslag inkomstenbelasting is of wordt vastgesteld: het na
      afloop van dat kalenderjaar van betrokkene over dat kalenderjaar laatst bepaalde verzamelinkomen;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21
  - number: 21.e.2°
    text: |-
      indien over een kalenderjaar geen aanslag of navorderingsaanslag inkomstenbelasting is of wordt vastgesteld: het na
      afloop van dat kalenderjaar van betrokkene over dat kalenderjaar laatst bepaalde belastbare loon;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21
  - number: 21.f
    text: 'afnemer: bestuursorgaan dat op grond van een wettelijk voorschrift bevoegd is tot gebruik van een inkomensgegeven;'
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21
  - number: 21.g
    text: 'betrokkene: degene op wie het inkomensgegeven betrekking heeft;'
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21
  - number: 21.h
    text: |-
      terugmelding: melding als bedoeld in [artikel 21h, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel21h
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 21h
        hoofdstuk: IVA
  - number: 21a.1
    text: |-
      Er is een basisregistratie inkomen waarin inkomensgegevens met bijbehorende temporele en meta-kenmerken zijn
      opgenomen. Het inkomensgegeven, bedoeld in de vorige volzin, is een authentiek gegeven.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21a
  - number: 21a.2
    text: |-
      In de basisregistratie inkomen zijn ook bij algemene maatregel van bestuur aan te wijzen authentieke gegevens uit
      andere basisregistraties opgenomen.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21a
  - number: 21b.1
    text: De basisregistratie inkomen heeft tot doel de afnemers te voorzien van inkomensgegevens.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21b
  - number: 21b.2
    text: De inspecteur is belast met de uitvoering van de basisregistratie inkomen.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21b
  - number: 21b.3
    text: De inspecteur draagt zorg voor de juistheid, volledigheid en actualiteit van de inkomensgegevens.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21b
  - number: 21b.4
    text: |-
      De inspecteur draagt er zorg voor dat de weergave van een meegeleverd authentiek gegeven uit een andere
      basisregistratie overeenstemt met dat gegeven, als opgenomen in die andere basisregistratie.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21b
  - number: 21c.1
    text: |-
      Bij de bepaling van het inkomensgegeven, bedoeld in [artikel 21, onderdeel e, onder 1°][ref1], zijn de regels die
      gelden bij de heffing van de inkomstenbelasting van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel21
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21c
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '21'
        hoofdstuk: IVA
  - number: 21c.2
    text: |-
      Bij de bepaling van het inkomensgegeven, bedoeld in [artikel 21, onderdeel e, onder 2°][ref1], zijn de regels die
      gelden bij de heffing van de loonbelasting van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel21
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21c
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '21'
        hoofdstuk: IVA
  - number: 21c.3
    text: |-
      Bij de bepaling van het inkomensgegeven blijft [artikel 65][ref1] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel65
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21c
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '65'
        hoofdstuk: VIII
        afdeling: '5'
  - number: 21c.4
    text: |-
      Indien in het kader van de heffing van de inkomstenbelasting of de loonbelasting aan betrokkene een aanslagbiljet,
      een afschrift van de uitspraak op bezwaar of een afschrift van de beschikking ambtshalve vermindering wordt
      verstrekt, wordt het bijbehorende inkomensgegeven afzonderlijk vermeld.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21c
  - number: 21d.1
    text: |-
      De inspecteur plaatst de aantekening «in onderzoek» bij een inkomensgegeven indien ten aanzien van dat
      inkomensgegeven:
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21d
  - number: 21d.1.a
    text: een terugmelding is gedaan;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21d
  - number: 21d.1.b
    text: een bezwaar- of beroepschrift is ingediend;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21d
  - number: 21d.1.c
    text: een verzoek om ambtshalve vermindering is ingediend, of
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21d
  - number: 21d.1.d
    text: overigens gerede twijfel is ontstaan omtrent de juistheid van dat gegeven.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21d
  - number: 21d.2
    text: 'De inspecteur verwijdert de aantekening «in onderzoek»:'
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21d
  - number: 21d.2.a
    text: na de afhandeling van het onderzoek naar aanleiding van de terugmelding;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21d
  - number: 21d.2.b
    text: nadat de beslissing op bezwaar of de rechterlijke uitspraak onherroepelijk is geworden;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21d
  - number: 21d.2.c
    text: na de afhandeling van het verzoek om ambtshalve vermindering, of
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21d
  - number: 21d.2.d
    text: na de afhandeling van het onderzoek naar aanleiding van de situatie, bedoeld in het eerste lid, onderdeel d.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21d
  - number: 21e.1
    text: |-
      De inspecteur verstrekt aan een afnemer op zijn verzoek een inkomensgegeven met bijbehorende temporele en meta-
      kenmerken.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21e
  - number: 21e.2
    text: |-
      Een inkomensgegeven waarbij de aantekening «in onderzoek» is geplaatst, wordt uitsluitend verstrekt onder
      mededeling van die aantekening.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21e
  - number: 21e.3
    text: Met een inkomensgegeven kunnen authentieke gegevens uit andere basisregistraties worden meegeleverd.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21e
  - number: 21e.4
    text: |-
      De inspecteur deelt, na verwijdering van de aantekening «in onderzoek», op verzoek aan een afnemer die het
      desbetreffende inkomensgegeven voorafgaand aan de verwijdering van de aantekening verstrekt heeft gekregen mee dat
      de aantekening is verwijderd en of het gegeven is gewijzigd.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21e
  - number: 21f.1
    text: |-
      Een afnemer gebruikt een inkomensgegeven uitsluitend bij de uitoefening van een op grond van een wettelijk
      voorschrift verleende bevoegdheid tot gebruik van dit gegeven.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21f
  - number: 21f.2
    text: |-
      Een afnemer is niet bevoegd een inkomensgegeven verder bekend te maken dan noodzakelijk voor de uitoefening van de
      hem verleende bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21f
  - number: 21f.3
    text: |-
      Voor zover een inkomensgegeven ten grondslag ligt aan een besluit van een afnemer wordt het bekendgemaakt en
      verenigd in één geschrift met dat besluit.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21f
  - number: 21g.1
    text: |-
      Voor zover een afnemer een op grond van een wettelijk voorschrift verleende bevoegdheid tot gebruik van het
      inkomensgegeven uitoefent, gebruikt hij het inkomensgegeven zoals dat ten tijde van het gebruik is opgenomen in de
      basisregistratie inkomen.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21g
  - number: 21g.2
    text: Het eerste lid is niet van toepassing indien bij het inkomensgegeven de aantekening «in onderzoek» is geplaatst.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21g
  - number: 21h.1
    text: |-
      Een afnemer die gerede twijfel heeft over de juistheid van een authentiek gegeven dat hij verstrekt heeft gekregen
      uit de basisregistratie inkomen meldt dit aan de inspecteur, onder opgaaf van redenen.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21h
  - number: 21h.2
    text: |-
      Voor zover een terugmelding betrekking heeft op een authentiek gegeven dat is overgenomen uit een andere
      basisregistratie, zendt de inspecteur die melding onverwijld door aan de beheerder van die andere basisregistratie
      en doet daarvan mededeling aan de afnemer die de terugmelding heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21h
  - number: 21h.3
    text: 'Bij ministeriële regeling kunnen regels worden gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21h
  - number: 21h.3.a
    text: |-
      de gevallen waarin een terugmelding achterwege kan blijven, omdat de terugmelding niet van belang is voor het
      bijhouden van de basisregistratie;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21h
  - number: 21h.3.b
    text: de wijze waarop een terugmelding moet worden gedaan;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21h
  - number: 21h.3.c
    text: |-
      de termijn waarbinnen de afhandeling van het onderzoek naar aanleiding van een terugmelding over een
      inkomensgegeven moet plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21h
  - number: 21i
    text: |-
      Voor zover [artikel 21g, eerste lid][ref1], van toepassing is, hoeft een betrokkene aan wie door een afnemer een
      inkomensgegeven wordt gevraagd dat gegeven niet te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel21g
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21i
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 21g
        hoofdstuk: IVA
  - number: 21j.1
    text: |-
      Met een voor bezwaar vatbare beschikking van de inspecteur wordt gelijkgesteld het inkomensgegeven, bedoeld
      in [artikel 21, onderdeel e, onder 2°][ref1], zoals dat met het oorspronkelijke besluit van de afnemer is
      bekendgemaakt op grond van [artikel 21f, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel21f
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21j
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '21'
        hoofdstuk: IVA
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 21f
        hoofdstuk: IVA
  - number: 21j.2
    text: |-
      Een bezwaarschrift tegen of verzoekschrift om wijziging van het besluit van de afnemer wordt, voor zover het
      gericht is tegen het inkomensgegeven, mede aangemerkt als een bezwaarschrift tegen of verzoekschrift om ambtshalve
      vermindering van het inkomensgegeven.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21j
  - number: 21j.3
    text: |-
      Een bezwaarschrift tegen of verzoekschrift om ambtshalve vermindering van het inkomensgegeven wordt, indien gericht
      tegen het besluit van de afnemer, mede aangemerkt als een bezwaarschrift tegen of verzoekschrift om wijziging van
      het besluit van die afnemer.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21j
  - number: 21ja
    text: |-
      Voor de toepassing van de [artikelen 21d en 21j][ref1] wordt onder ambtshalve vermindering mede verstaan een
      herziening als bedoeld in [artikel 9.5, eerste lid, van de Wet inkomstenbelasting 2001][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel21d
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel9
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21ja
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 21d
        hoofdstuk: IVA
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '9'
  - number: 21k.1
    text: |-
      In bij ministeriële regeling aan te wijzen gevallen wordt een onjuist inkomensgegeven door de inspecteur ambtshalve
      verminderd.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21k
  - number: 21k.2
    text: |-
      Indien betrokkene een verzoek om ambtshalve vermindering heeft gedaan en dat verzoek geheel of gedeeltelijk wordt
      afgewezen, beslist de inspecteur dat bij een voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21k
  - number: 21k.3
    text: |-
      Het met de belastingaanslag inkomstenbelasting samenhangende inkomensgegeven, bedoeld in
      [artikel 21, onderdeel e, onder 1°][ref1], wordt voor de toepassing van dit artikel geacht onderdeel uit te maken
      van die belastingaanslag.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel21
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel21k
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '21'
        hoofdstuk: IVA
  - number: 22j
    text: |-
      In afwijking van [artikel 6:8 van de Algemene wet bestuursrecht][ref1] vangt de termijn voor het instellen van
      bezwaar aan:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel22j
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: 22j.a
    text: |-
      met ingang van de dag na die van dagtekening van een aanslagbiljet of van het afschrift van een voor bezwaar
      vatbare beschikking, tenzij de dag van dagtekening gelegen is vóór de dag van de bekendmaking, dan wel
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel22j
  - number: 22j.b
    text: met ingang van de dag na die van de voldoening of de inhouding onderscheidenlijk de afdracht.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel22j
  - number: 24a.1
    text: |-
      Hij die bezwaar heeft tegen meer dan één belastingaanslag of voor bezwaar vatbare beschikking kan daartegen bezwaar
      maken bij één bezwaarschrift.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel24a
  - number: 24a.2
    text: |-
      Indien de bedragen van een belastingaanslag en van een voor bezwaar vatbare beschikking waarbij een bestuurlijke
      boete wordt opgelegd op één aanslagbiljet zijn vermeld, wordt een bezwaarschrift tegen de belastingaanslag geacht
      mede te zijn gericht tegen de boete, tenzij uit het bezwaarschrift het tegendeel blijkt.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel24a
  - number: 24a.3
    text: |-
      Indien [artikel 30j, tweede lid, eerste volzin][ref1], van toepassing is, wordt de belastingrente voor
      de toepassing van de wettelijke voorschriften over bezwaar en beroep geacht onderdeel uit te maken van de
      belastingaanslag.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel30j
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 30j
        hoofdstuk: VA
  - number: 24a.4
    text: |-
      Het derde lid is van overeenkomstige toepassing met betrekking tot de revisierente, bedoeld in [artikel 30i][ref1],
      het verzamelinkomen, bedoeld in [artikel 2.18 van de Wet inkomstenbelasting 2001][ref2], en de betalingskorting,
      bedoeld in [artikel 27a van de Invorderingswet 1990][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel30i
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel27a
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 30i
        hoofdstuk: VA
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0004770
        artikel: 27a
  - number: '25.1'
    text: |-
      In afwijking van [artikel 7:2 van de Algemene wet bestuursrecht][ref1] wordt de belanghebbende gehoord op zijn
      verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '25.2'
    text: |-
      Indien omstandigheden daartoe nopen, kan het horen geschieden in afwijking van
      [artikel 7:5 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '25.3'
    text: |-
      Indien het bezwaar is gericht tegen een aanslag, een navorderingsaanslag, een naheffingsaanslag of een beschikking,
      met betrekking tot welke de vereiste aangifte niet is gedaan of sprake is van een onherroepelijk geworden
      informatiebeschikking als bedoeld in [artikel 52a, eerste lid][ref1], wordt bij de uitspraak op het bezwaarschrift
      de belastingaanslag of beschikking gehandhaafd, tenzij is gebleken dat en in hoeverre die belastingaanslag
      of beschikking onjuist is. De eerste volzin vindt geen toepassing voor zover het bezwaar is gericht tegen een
      vergrijpboete.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel52a
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 52a
        hoofdstuk: VIII
        afdeling: '2'
  - number: '25.4'
    text: |-
      Indien bezwaar is gemaakt tegen meer dan één belastingaanslag of voor bezwaar vatbare beschikking, kan de
      inspecteur de uitspraken vervatten in één geschrift.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel25
  - number: 25a.1
    text: |-
      In afwijking in zoverre van het overigens bij of krachtens deze wet en de [Algemene wet bestuursrecht][ref1]
      bepaalde, zijn met betrekking tot in het tweede lid bedoeld massaal bezwaar de volgende bepalingen van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 25a.2
    text: |-
      Indien naar het oordeel van Onze Minister een groot aantal bezwaren is gericht tegen de beslissing op eenzelfde
      rechtsvraag, al dan niet met accessoire kwesties die zich lenen voor niet-individuele afdoening (de rechtsvraag),
      kan hij die bezwaren aanwijzen als massaal bezwaar. Hij doet dit voor bezwaren die alleen de rechtsvraag betreffen,
      waarop nog geen uitspraak is gedaan en die zijn ingediend tot en met de dag voorafgaande aan de dag waarop de in
      het zevende lid bedoelde collectieve uitspraak terzake is gedaan, dan wel de dag voorafgaande aan de dag waarop de
      in het elfde lid eerstbedoelde uitspraak onherroepelijk wordt. Onze Minister zendt een afschrift van de aanwijzing
      aan de Tweede Kamer der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel25a
  - number: 25a.3
    text: |-
      Bij de aanwijzing als massaal bezwaar zondert Onze Minister een of meer bezwaren uit met het oog op beantwoording
      van de rechtsvraag door de bestuursrechter in belastingzaken.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel25a
  - number: 25a.4
    text: |-
      Bij de aanwijzing als massaal bezwaar wijst Onze Minister de inspecteur aan die de in het zevende lid bedoelde
      collectieve uitspraak zal doen.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel25a
  - number: 25a.5
    text: |-
      De aanwijzing als massaal bezwaar treedt in werking vier weken na de toezending van het afschrift ervan aan de
      Tweede Kamer der Staten-Generaal. De aanwijzing vervalt indien binnen die vier weken de Tweede Kamer besluit
      zich niet met de aanwijzing te kunnen verenigen. De inspecteur doet gedurende die vier weken geen uitspraak op
      de bezwaren die Onze Minister als massaal bezwaar heeft aangewezen. Indien de aanwijzing door een besluit van de
      Tweede Kamer vervalt, wordt de termijn voor het doen van uitspraak op de desbetreffende bezwaarschriften verlengd
      met vier weken.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel25a
  - number: 25a.6
    text: De belanghebbende wordt ter zake van een als massaal bezwaar aangewezen bezwaar niet gehoord.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel25a
  - number: 25a.7
    text: |-
      Indien inzake de in het derde lid bedoelde uitgezonderde bezwaren het standpunt van de belanghebbenden ter zake
      van de rechtsvraag bij onherroepelijke rechterlijke uitspraak geheel is afgewezen, beslist de aangewezen inspecteur
      binnen zes weken na het onherroepelijk worden van de laatste van die uitspraken door middel van één uitspraak
      op alle als massaal bezwaar aangewezen bezwaren (collectieve uitspraak). Als massaal bezwaar aangewezen bezwaren
      worden steeds geacht ontvankelijk te zijn.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel25a
  - number: 25a.8
    text: |-
      De collectieve uitspraak wordt bekendgemaakt door kennisgeving ervan in een van overheidswege uitgegeven blad of
      een dag-, nieuws- of huis-aan-huisblad, dan wel op een andere geschikte wijze.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel25a
  - number: 25a.9
    text: |-
      Tegen een collectieve uitspraak kan geen beroep worden ingesteld. Op verzoek van de belanghebbende vervangt de te
      zijnen aanzien bevoegde inspecteur de collectieve uitspraak door een individuele uitspraak. Het verzoek wordt niet
      ingewilligd indien het onredelijk laat is gedaan.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel25a
  - number: 25a.10
    text: Beroep tegen de individuele uitspraak kan slechts de rechtsvraag betreffen.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel25a
  - number: 25a.11
    text: |-
      Indien inzake een in het derde lid bedoeld uitgezonderd bezwaar bij onherroepelijke rechterlijke uitspraak geheel
      of gedeeltelijk aan het standpunt van de belanghebbende ter zake van de rechtsvraag is tegemoetgekomen, verliezen
      de desbetreffende bezwaren de status van massaal bezwaar.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel25a
  - number: 25a.12
    text: |-
      Indien de inspecteur voordat de collectieve uitspraak is gedaan uitspraak doet op een bezwaar dat meer omvat dan
      de rechtsvraag, beslist hij op de rechtsvraag in het nadeel van de belanghebbende. Indien de in het elfde lid
      eerstbedoelde uitspraak daartoe aanleiding geeft, komt de inspecteur alsnog aan het bezwaar inzake de rechtsvraag
      tegemoet.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel25a
  - number: 25a.13
    text: |-
      Indien de in het elfde lid eerstbedoelde uitspraak daartoe aanleiding geeft, herziet de inspecteur de in
      [artikel 26, eerste lid][ref1], bedoelde besluiten waarbij de rechtsvraag onjuist is beantwoord, voorzover bezwaren
      daartegen op de voet van het tweede lid zouden hebben geleid tot aanwijzing als massaal bezwaar. Herziening vindt
      niet plaats indien de rechtshandeling onherroepelijk was ten tijde van de aanwijzing als massaal bezwaar of indien
      de onjuiste beantwoording van de rechtsvraag bij het verrichten van de rechtshandeling de inspecteur ter kennis
      komt na het verstrijken van vijf jaren na de in de eerste volzin bedoelde rechterlijke uitspraak. De herziening
      geschiedt bij voor bezwaar vatbare beschikking binnen een jaar nadat de uitspraak onherroepelijk is geworden dan
      wel, indien dat later is, de onjuiste beantwoording van de rechtsvraag bij het verrichten van de desbetreffende
      rechtshandeling de inspecteur bekend is geworden. Bezwaar en beroep tegen de beschikking kan slechts de rechtsvraag
      betreffen. [Artikel 25b][ref2] is van overeenkomstige toepassing ten aanzien van de naar het oordeel van de
      inspecteur meest gerede partij.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel25b
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '26'
        hoofdstuk: V
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 25b
        hoofdstuk: V
        afdeling: '1'
  - number: 25b.1
    text: |-
      Een uit een uitspraak van de inspecteur voortvloeiende teruggaaf van ingehouden of op aangifte afgedragen belasting
      wordt verleend aan degene die het bezwaarschrift heeft ingediend.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel25b
  - number: 25b.2
    text: |-
      Indien zowel de inhoudingsplichtige als degene van wie is ingehouden ter zake van dezelfde feiten een
      bezwaarschrift heeft ingediend, wordt, indien uit een uitspraak terzake een teruggaaf voortvloeit, die teruggaaf
      uitsluitend verleend aan degene van wie is ingehouden.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel25b
  - number: '26.1'
    text: |-
      In afwijking van [artikel 8:1 van de Algemene wet bestuursrecht][ref1] kan tegen een ingevolge de belastingwet
      genomen besluit slechts beroep bij de bestuursrechter worden ingesteld, indien het betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 26.1.a
    text: |-
      een belastingaanslag, daaronder begrepen de in [artikel 15][ref1] voorgeschreven verrekening, of


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel15
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '15'
        hoofdstuk: III
  - number: 26.1.b
    text: een voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel26
  - number: '26.2'
    text: |-
      De voldoening of afdracht op aangifte, dan wel de inhouding door een inhoudingsplichtige, van een bedrag
      als belasting wordt voor de mogelijkheid van beroep gelijkgesteld met een voor bezwaar vatbare beschikking
      van de inspecteur. De wettelijke voorschriften inzake bezwaar en beroep tegen zodanige beschikking zijn van
      overeenkomstige toepassing, voorzover de aard van de voldoening, de afdracht of de inhouding zich daartegen niet
      verzet.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel26
  - number: 26a.1
    text: |-
      In afwijking van [artikel 8:1 van de Algemene wet bestuursrecht][ref1] kan het beroep slechts worden ingesteld
      door:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 26a.1.a
    text: de belanghebbende aan wie de belastingaanslag is opgelegd;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel26a
  - number: 26a.1.b
    text: |-
      de belanghebbende die de belasting op aangifte heeft voldaan of afgedragen of van wie de belasting is ingehouden,
      of
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel26a
  - number: 26a.1.c
    text: degene tot wie de voor bezwaar vatbare beschikking zich richt.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel26a
  - number: 26a.2
    text: |-
      Het beroep kan mede worden ingesteld door degene van wie inkomens- of vermogensbestanddelen zijn begrepen in het
      voorwerp van de belasting waarop de belastingaanslag of de voor bezwaar vatbare beschikking betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel26a
  - number: 26a.3
    text: |-
      De inspecteur stelt de in het eerste of het tweede lid bedoelde belanghebbende desgevraagd op de hoogte van de
      gegevens met betrekking tot de belastingaanslag of de beschikking voorzover deze gegevens voor het instellen van
      beroep of het maken van bezwaar redelijkerwijs van belang kunnen worden geacht.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel26a
  - number: 26b.1
    text: Hij die beroep instelt tegen meer dan één uitspraak kan dat doen bij één beroepschrift.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel26b
  - number: 26b.2
    text: |-
      [Artikel 24a, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel24a
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel26b
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 24a
        hoofdstuk: V
        afdeling: '1'
  - number: 26c
    text: |-
      In afwijking van [artikel 6:8 van de Algemene wet bestuursrecht][ref1] vangt de termijn voor het instellen van
      beroep aan met ingang van de dag na die van dagtekening van de uitspraak van de inspecteur, tenzij de dag van
      dagtekening is gelegen vóór de dag van de bekendmaking.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel26c
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: 27a
    text: |-
      Indien het beroep is gericht tegen het niet tijdig doen van een uitspraak door de inspecteur, kan de rechtbank
      bepalen dat [hoofdstuk VIII, afdeling 2][ref1], gedurende een daarbij te bepalen termijn van toepassing blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: VIII
        afdeling: '2'
  - number: 27c
    text: |-
      [Artikel 8:62 van de Algemene wet bestuursrecht][ref1] is slechts van toepassing voorzover het beroep is gericht
      tegen een uitspraak waarbij een bestuurlijke boete geheel of gedeeltelijk is gehandhaafd. In andere gevallen heeft
      het onderzoek ter zitting plaats met gesloten deuren, maar kan de rechtbank bepalen dat het onderzoek openbaar is,
      voorzover de belangen van partijen daardoor niet worden geschaad.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel27c
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 27d
    text: |-
      In afwijking van [artikel 8:67, eerste lid, van de Algemene wet bestuursrecht][ref1] bedraagt de termijn voor
      verdaging van de mondelinge uitspraak ten hoogste twee weken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel27d
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 27e.1
    text: |-
      Indien de vereiste aangifte niet is gedaan of sprake is van een onherroepelijk geworden informatiebeschikking als
      bedoeld in [artikel 52a, eerste lid][ref1], verklaart de rechtbank het beroep ongegrond, tenzij is gebleken dat en
      in hoeverre de uitspraak op het bezwaar onjuist is.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel52a
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel27e
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 52a
        hoofdstuk: VIII
        afdeling: '2'
  - number: 27e.2
    text: |-
      Indien de rechtbank het beroep tegen een in [artikel 52a, eerste lid][ref1], bedoelde informatiebeschikking
      ongegrond verklaart, stelt de rechtbank een nieuwe termijn voor het voldoen aan de in die beschikking bedoelde
      verplichtingen, in situaties waarin daar nog gevolg aan kan worden gegeven, tenzij sprake is van kennelijk
      onredelijk gebruik van procesrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel52a
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel27e
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 52a
        hoofdstuk: VIII
        afdeling: '2'
  - number: 27e.3
    text: Dit artikel vindt geen toepassing voor zover het beroep is gericht tegen een vergrijpboete.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel27e
  - number: 27f.1
    text: |-
      Een uit een uitspraak van de rechtbank voortvloeiende teruggaaf van ingehouden of op aangifte afgedragen belasting
      wordt verleend aan degene die het beroep heeft ingesteld.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel27f
  - number: 27f.2
    text: |-
      Indien zowel de inhoudingsplichtige als degene van wie is ingehouden ter zake van dezelfde feiten beroep heeft
      ingesteld, wordt, indien uit een uitspraak terzake een teruggaaf voortvloeit, die teruggaaf uitsluitend verleend
      aan degene van wie is ingehouden.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel27f
  - number: 27g.1
    text: |-
      In afwijking van [artikel 8:79, tweede lid, van de Algemene wet bestuursrecht][ref1] geschiedt de verstrekking
      overeenkomstig die bepaling van afschriften of uittreksels aan anderen dan partijen met machtiging van de
      rechtbank.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel27g
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 27g.2
    text: |-
      Met betrekking tot schriftelijke uitspraken blijft de machtiging, bedoeld in het eerste lid, slechts achterwege
      indien op een voor de uitspraak gedaan verzoek van een der partijen de rechtbank oordeelt dat ook na anonimisering
      de geheimhouding van persoonlijke en financiële gegevens onvoldoende wordt beschermd en bovendien het belang van de
      openbaarheid van de rechtspraak niet opweegt tegen dit belang.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel27g
  - number: 27h.1
    text: |-
      In afwijking van [artikel 8:104, eerste lid, aanhef en onder a, van de Algemene wet bestuursrecht][ref1] kunnen
      slechts de belanghebbende die bevoegd was beroep bij de rechtbank in te stellen en de inspecteur hoger beroep
      instellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel27h
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 27h.2
    text: |-
      De [artikelen 24a, tweede lid][ref1], [26a, derde lid][ref2], [26b, eerste lid][ref3], en
      [27c tot en met 27g][ref4] zijn van overeenkomstige toepassing in hoger beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel24a
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel26a
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel26b
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel27c
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel27h
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 24a
        hoofdstuk: V
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 26a
        hoofdstuk: V
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: 26b
        hoofdstuk: V
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0002320
        artikel: 27c
        hoofdstuk: V
        afdeling: '2'
  - number: 27h.3
    text: |-
      De werking van de uitspraak van de rechtbank of van de voorzieningenrechter wordt opgeschort totdat de termijn
      voor het instellen van hoger beroep is verstreken of, indien hoger beroep is ingesteld, op het hoger beroep
      onherroepelijk is beslist. De eerste volzin geldt niet indien de uitspraak een beroep tegen het niet tijdig nemen
      van een besluit betreft.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel27h
  - number: '28.1'
    text: |-
      De belanghebbende die bevoegd was om hoger beroep bij het gerechtshof in te stellen en Onze Minister kunnen bij de
      Hoge Raad beroep in cassatie instellen tegen:
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel28
  - number: 28.1.a
    text: |-
      een uitspraak van het gerechtshof die overeenkomstig [afdeling 8.2.6][ref1] of
      [artikel 8:104, eerste lid, onderdeel c van de Algemene wet bestuursrecht][ref2] is gedaan, en


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling8.2.6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 8.2.6
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 28.1.b
    text: |-
      een uitspraak van de voorzieningenrechter van het gerechtshof die overeenkomstig
      [artikel 8:86 van die wet is gedaan][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '28.2'
    text: |-
      De belanghebbende en Onze Minister kunnen bij de Hoge Raad voorts beroep in cassatie instellen tegen een uitspraak
      van de rechtbank als bedoeld in [artikel 8:55, zevende lid, onderdelen a en b, van die wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '28.3'
    text: |-
      Indien de belanghebbenden en Onze Minister daarmee schriftelijk instemmen, kan bij de Hoge Raad voorts beroep
      in cassatie worden ingesteld tegen een uitspraak van de rechtbank als bedoeld in [afdeling 8.2.6][ref1] of
      [artikel 8:104, eerste lid, onderdeel c van de Algemene wet bestuursrecht][ref2], alsmede tegen een uitspraak van
      de voorzieningenrechter van de rechtbank als bedoeld in [artikel 8:86 van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling8.2.6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 8.2.6
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '28.4'
    text: 'Geen beroep in cassatie kan worden ingesteld tegen:'
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel28
  - number: 28.4.a
    text: |-
      een uitspraak van het gerechtshof of de rechtbank overeenkomstig
      [artikel 8:54, eerste lid, van de Algemene wet bestuursrecht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 28.4.b
    text: |-
      een uitspraak van de rechtbank overeenkomstig [artikel 8:54a van die wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 28.4.c
    text: |-
      een uitspraak van de voorzieningenrechter van het gerechtshof of de rechtbank overeenkomstig
      [artikel 8:84, tweede lid, van die wet][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 28.4.d
    text: |-
      een uitspraak van de voorzieningenrechter van het gerechtshof of de rechtbank overeenkomstig
      [artikel 8:75a, eerste lid, van de Algemene wet bestuursrecht][ref1], in verband met
      [artikel 8:84, vijfde lid, van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '28.5'
    text: |-
      Tegen andere beslissingen van het gerechtshof, van de rechtbank of van de voorzieningenrechter kan slechts
      tegelijkertijd met het beroep in cassatie tegen de in het eerste of het tweede lid bedoelde uitspraak beroep in
      cassatie worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel28
  - number: '28.6'
    text: |-
      De [artikelen 24a, tweede lid][ref1], [26a, derde lid][ref2], en [26b, eerste lid][ref3], zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel24a
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel26a
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel26b
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 24a
        hoofdstuk: V
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 26a
        hoofdstuk: V
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: 26b
        hoofdstuk: V
        afdeling: '2'
  - number: '28.7'
    text: |-
      De werking van de uitspraak van het gerechtshof, de rechtbank of de voorzieningenrechter wordt opgeschort totdat de
      termijn voor het instellen van beroep in cassatie is verstreken of, indien beroep in cassatie is ingesteld, op het
      beroep in cassatie is beslist.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel28
  - number: 28a.1
    text: |-
      De griffier van de Hoge Raad doet van het ingestelde beroep in cassatie zo spoedig mogelijk mededeling aan de
      griffier van het gerecht dat de aangevallen uitspraak heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel28a
  - number: 28a.2
    text: |-
      De griffier van dit gerecht zendt een afschrift van de uitspraak en de op de uitspraak betrekking hebbende
      gedingstukken die onder hem berusten, onverwijld aan de griffier van de Hoge Raad.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel28a
  - number: 28a.3
    text: |-
      De griffier maakt zo nodig onverwijld alsnog een proces-verbaal op van de zitting en zendt dit aan de griffier van
      de Hoge Raad.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel28a
  - number: 28b.1
    text: |-
      Indien beroep in cassatie is ingesteld tegen een mondelinge uitspraak, wordt de mondelinge uitspraak vervangen
      door een schriftelijke uitspraak, tenzij het beroep in cassatie kennelijk niet-ontvankelijk is of de Hoge
      Raad anders bepaalt. De vervanging geschiedt binnen zes weken na de dag waarop de mededeling, bedoeld in
      [artikel 28a, eerste lid][ref1], is gedaan. Het beroep in cassatie wordt geacht gericht te zijn tegen de
      schriftelijke uitspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel28a
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 28a
        hoofdstuk: V
        afdeling: '4'
  - number: 28b.2
    text: |-
      Het gerecht dat de mondelinge uitspraak heeft gedaan, verzendt de vervangende schriftelijke uitspraak gelijktijdig
      aan partijen en aan de griffier van de Hoge Raad.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel28b
  - number: 28b.3
    text: |-
      In afwijking van [artikel 6:5, eerste lid, onderdeel d, van de Algemene wet bestuursrecht][ref1] kan de indiener
      van het beroepschrift de gronden van het beroep verstrekken of aanvullen tot zes weken na de dag waarop de
      schriftelijke uitspraak aan hem is verzonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '29'
    text: |-
      Op de behandeling van het beroep in cassatie zijn de [artikelen 8:14 tot en met 8:25][ref1],
      [8:27 tot en met 8:29][ref2], [8:31 tot en met 8:40a][ref3], [8:41, met uitzondering van het tweede lid][ref4],
      [8:41a][ref5], [8:43 tot en met 8:45][ref6], [8:52][ref7], [8:53][ref8], [8:60][ref9], [8:70][ref10],
      [8:71][ref11], [8:72a][ref12], [8:75 tot en met 8:79][ref13], [8:109][ref14], [8:110, derde en vijfde lid][ref15],
      [8:111][ref16], [8:112][ref17], [8:113, tweede lid][ref18], [8:114][ref19] en de [titels 8.4][ref20] en
      [8.6 van de Algemene wet bestuursrecht][ref21] van overeenkomstige toepassing, voor zover in deze afdeling niet
      anders is bepaald.


