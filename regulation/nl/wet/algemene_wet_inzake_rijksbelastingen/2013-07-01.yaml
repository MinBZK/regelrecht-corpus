  - number: 29h.1
    text: |-
      In geval van verwijzing zendt de griffier van de Hoge Raad de stukken en een afschrift van de uitspraak binnen een
      week aan het gerechtshof of aan de rechtbank waarheen de zaak is verwezen.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel29h
  - number: 29h.2
    text: |-
      Indien de uitspraak geen verwijzing inhoudt, zendt de griffier de door partijen overgelegde stukken onverwijld aan
      hen terug.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel29h
  - number: 29i.1
    text: |-
      Een uit een uitspraak van de Hoge Raad voortvloeiende teruggaaf van ingehouden of op aangifte afgedragen belasting
      wordt verleend aan degene die het beroep in cassatie heeft ingesteld.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel29i
  - number: 29i.2
    text: |-
      Indien zowel de inhoudingsplichtige als degene van wie is ingehouden ter zake van dezelfde omstandigheden beroep
      in cassatie heeft ingesteld, wordt, indien uit een uitspraak terzake een teruggaaf voortvloeit, die teruggaaf
      uitsluitend verleend aan degene van wie is ingehouden.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel29i
  - number: '30.1'
    text: |-
      In afwijking van [artikel 8:79, tweede lid, van de Algemene wet bestuursrecht][ref1] geschiedt de verstrekking
      overeenkomstig die bepaling van afschriften of uittreksels aan anderen dan partijen met machtiging van de Hoge
      Raad.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '30.2'
    text: |-
      [Artikel 27g, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel27g
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 27g
        hoofdstuk: V
        afdeling: '2'
  - number: 30f.1
    text: |-
      Indien met betrekking tot de inkomstenbelasting of de vennootschapsbelasting na het verstrijken van een periode
      van 6 maanden te rekenen vanaf het einde van het tijdvak waarover de belasting wordt geheven een voorlopige aanslag
      met een door de belastingplichtige te betalen bedrag aan belasting wordt vastgesteld, wordt met betrekking tot die
      aanslag aan de belastingplichtige rente – belastingrente – in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30f
  - number: 30f.2
    text: |-
      De belastingrente wordt enkelvoudig berekend over het tijdvak dat aanvangt 6 maanden te rekenen vanaf het einde van
      het tijdvak waarover de belasting wordt geheven en eindigt op de dag voorafgaand aan de dag waarop de voorlopige
      aanslag invorderbaar is ingevolge [artikel 9 van de Invorderingswet 1990][ref1] en heeft als grondslag het te
      betalen bedrag aan belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel9
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30f
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '9'
  - number: 30f.3
    text: |-
      Ingeval de voorlopige aanslag is vastgesteld overeenkomstig een op de door de inspecteur aangegeven wijze ingediend
      verzoek of overeenkomstig de ingediende aangifte met betrekking tot het tijdvak waarover de belasting wordt
      geheven, eindigt het tijdvak waarover de belastingrente wordt berekend in afwijking in zoverre van het tweede lid,
      uiterlijk 14 weken na de datum van ontvangst van het verzoek, onderscheidenlijk 19 weken na de datum van ontvangst
      van deze aangifte.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30f
  - number: 30f.4
    text: |-
      Geen belastingrente wordt in rekening gebracht ingeval de voorlopige aanslag is vastgesteld overeenkomstig een op
      de door de inspecteur aangegeven wijze ingediend verzoek dat is ontvangen voor de eerste dag van de vijfde maand,
      onderscheidenlijk overeenkomstig een ingediende aangifte die is ontvangen voor de eerste dag van de vierde maand na
      afloop van het tijdvak waarover de belasting wordt geheven.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30f
  - number: 30fa.1
    text: |-
      Indien met betrekking tot de inkomstenbelasting of de vennootschapsbelasting na het verstrijken van een periode
      van 6 maanden te rekenen vanaf het einde van het tijdvak waarover de belasting wordt geheven een voorlopige aanslag
      tot een negatief bedrag aan te betalen belasting wordt vastgesteld, wordt met betrekking tot die aanslag aan de
      belastingplichtige rente – belastingrente – vergoed ingeval wordt voldaan aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30fa
  - number: 30fa.1.a
    text: |-
      de voorlopige aanslag is overeenkomstig een op de door de inspecteur aangegeven wijze ingediend verzoek of
      overeenkomstig de ingediende aangifte met betrekking tot het tijdvak waarover de belasting wordt geheven, en
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30fa
  - number: 30fa.1.b
    text: |-
      tussen de datum van ontvangst van dat verzoek of die aangifte en de datum van vaststelling van de voorlopige
      aanslag zijn meer dan 8 weken, onderscheidenlijk meer dan 13 weken, verstreken.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30fa
  - number: 30fa.2
    text: |-
      De belastingrente wordt enkelvoudig berekend over het tijdvak dat aanvangt 8 weken na ontvangst van het verzoek,
      onderscheidenlijk 13 weken na ontvangst van de aangifte, doch niet eerder dan 6 maanden te rekenen vanaf het einde
      van het tijdvak waarover de belasting wordt geheven, en eindigt 6 weken na de dagtekening van het aanslagbiljet en
      heeft als grondslag het te betalen bedrag aan belasting.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30fa
  - number: 30fb.1
    text: |-
      Bij herziening van een voorlopige aanslag inkomstenbelasting of vennootschapsbelasting met een positief bedrag
      tot een voorlopige aanslag met een hoger positief bedrag, wordt met betrekking tot het verschil belastingrente
      in rekening gebracht over het tijdvak dat aanvangt 6 maanden te rekenen vanaf het tijdvak waarover de belasting
      wordt geheven en eindigt op de dag voorafgaand aan de dag waarop het verschil invorderbaar is ingevolge
      [artikel 9 van de Invorderingswet 1990][ref1]. Ingeval de herziening is vastgesteld overeenkomstig een op de
      door de inspecteur aangegeven wijze ingediend verzoek of overeenkomstig de ingediende aangifte met betrekking tot
      het tijdvak waarover de belasting wordt geheven, eindigt het tijdvak waarover de belastingrente wordt berekend
      in afwijking in zoverre van de eerste volzin, uiterlijk 14 weken na de datum van ontvangst van het verzoek,
      onderscheidenlijk 19 weken na ontvangst van de aangifte.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel9
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30fb
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '9'
  - number: 30fb.2
    text: |-
      Bij herziening van een voorlopige aanslag inkomstenbelasting of vennootschapsbelasting met een positief bedrag
      tot een voorlopige aanslag met een lager positief bedrag, wordt, zo eerder ter zake van dat positieve bedrag
      belastingrente in rekening is gebracht, die eerder in rekening gebrachte belastingrente voor zover toerekenbaar
      aan het verschil, verminderd. Ter zake van het verschil in positieve bedragen wordt belastingrente vergoed ingeval
      wordt voldaan aan de voorwaarden van [artikel 30fa, eerste lid][ref1], welke wordt berekend volgens het tweede lid
      van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel30fa
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30fb
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 30fa
        hoofdstuk: VA
  - number: 30fb.3
    text: |-
      Bij herziening van een voorlopige aanslag inkomstenbelasting of vennootschapsbelasting met een positief bedrag tot
      een voorlopige aanslag met een negatief bedrag, wordt, zo eerder ter zake van dat positieve bedrag belastingrente
      in rekening is gebracht, die eerder in rekening gebrachte belastingrente verminderd. Ter zake van het verschil
      tussen het positieve bedrag en het negatieve bedrag wordt belastingrente vergoed ingeval wordt voldaan aan de
      voorwaarden van [artikel 30fa, eerste lid][ref1], welke wordt berekend volgens het tweede lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel30fa
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30fb
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 30fa
        hoofdstuk: VA
  - number: 30fb.4
    text: |-
      Bij herziening van een voorlopige aanslag inkomstenbelasting of vennootschapsbelasting met een negatief bedrag
      tot een voorlopige aanslag met positief bedrag, wordt met betrekking tot het verschil tussen die bedragen
      belastingrente in rekening gebracht over het tijdvak dat aanvangt 6 maanden te rekenen vanaf het tijdvak waarover
      de belasting wordt geheven en eindigt op de dag voorafgaand aan de dag waarop het verschil invorderbaar is
      ingevolge [artikel 9 van de Invorderingswet 1990][ref1]. Ingeval de herziening is vastgesteld overeenkomstig een
      op de door de inspecteur aangegeven wijze ingediend verzoek of overeenkomstig de ingediende aangifte met betrekking
      tot het tijdvak waarover de belasting wordt geheven, eindigt het tijdvak waarover de belastingrente wordt berekend
      in afwijking in zoverre van de eerste volzin uiterlijk 14 weken na de datum van ontvangst van het verzoek,
      onderscheidenlijk 19 weken na de datum van ontvangst van deze aangifte.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel9
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30fb
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '9'
  - number: 30fb.5
    text: |-
      Bij herziening van een voorlopige aanslag inkomstenbelasting of vennootschapsbelasting met een negatief bedrag
      tot een voorlopige aanslag met een kleiner negatief bedrag wordt met betrekking tot het verschil tussen die
      bedragen belastingrente in rekening gebracht over het tijdvak dat aanvangt 6 maanden te rekenen vanaf het tijdvak
      waarover de belasting wordt geheven en eindigt op de dag voorafgaand aan de dag waarop het verschil invorderbaar
      is ingevolge [artikel 9 van de Invorderingswet 1990][ref1]. Ingeval de herziening is vastgesteld overeenkomstig een
      op de door de inspecteur aangegeven wijze ingediend verzoek of overeenkomstig de ingediende aangifte met betrekking
      tot het tijdvak waarover de belasting wordt geheven, eindigt het tijdvak waarover de belastingrente wordt berekend
      in afwijking in zoverre van de eerste volzin, uiterlijk 14 weken na de datum van ontvangst van het verzoek,
      onderscheidenlijk 19 weken na de datum van ontvangst van de aangifte.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel9
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30fb
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '9'
  - number: 30fb.6
    text: |-
      Bij herziening van een voorlopige aanslag inkomstenbelasting of vennootschapsbelasting met een negatief bedrag
      tot een voorlopige aanslag met een groter negatief bedrag wordt, ingeval wordt voldaan aan de voorwaarden van
      [artikel 30fa, eerste lid][ref1], belastingrente vergoed, berekend over het tijdvak, bedoeld in het tweede lid van
      dat artikel, en met als grondslag het verschil tussen de twee negatieve bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel30fa
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30fb
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 30fa
        hoofdstuk: VA
  - number: 30fb.7
    text: |-
      Indien naar aanleiding van een bezwaarschrift of een daaropvolgende gerechtelijke procedure een voorlopige aanslag
      wordt herzien overeenkomstig het tweede, derde of zesde lid, wordt geen rente vergoed. In het geval ter zake
      van de herziene voorlopige aanslag eerder belastingrente in rekening is gebracht, wordt deze rente verminderd
      overeenkomstig het tweede lid, onderscheidenlijk derde lid.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30fb
  - number: 30fc.1
    text: |-
      Indien met betrekking tot de inkomstenbelasting of vennootschapsbelasting na het verstrijken van een periode
      van 6 maanden te rekenen vanaf het einde van het tijdvak waarover de belasting wordt geheven een aanslag of een
      navorderingsaanslag met een door de belastingplichtige te betalen bedrag aan belasting wordt vastgesteld, wordt
      met betrekking tot die aanslag, onderscheidenlijk die navorderingsaanslag, aan de belastingplichtige rente –
      belastingrente – in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30fc
  - number: 30fc.2
    text: |-
      De belastingrente wordt enkelvoudig berekend over het tijdvak dat aanvangt 6 maanden te rekenen vanaf het einde
      van het tijdvak waarover de belasting wordt geheven en eindigt op de dag voorafgaand aan de dag waarop de aanslag,
      onderscheidenlijk de navorderingsaanslag, invorderbaar is ingevolge [artikel 9 van de Invorderingswet 1990][ref1]
      en heeft als grondslag het te betalen bedrag aan belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel9
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30fc
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '9'
  - number: 30fc.3
    text: |-
      Ingeval de aanslag is vastgesteld overeenkomstig de ingediende aangifte, eindigt het tijdvak waarover de
      belastingrente wordt berekend in afwijking in zoverre van het tweede lid, uiterlijk 19 weken na de datum van
      ontvangst van de aangifte.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30fc
  - number: 30fc.4
    text: |-
      Ingeval de navorderingsaanslag is vastgesteld naar aanleiding van een verzoek, eindigt het tijdvak waarover de
      belastingrente wordt berekend in afwijking in zoverre van het tweede lid, uiterlijk 12 weken na de datum van
      ontvangst van het verzoek.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30fc
  - number: 30fc.5
    text: |-
      Dit artikel is niet van toepassing met betrekking tot inkomstenbelasting ter zake van te conserveren
      inkomen als bedoeld in [artikel 2.8, tweede lid, van de Wet inkomstenbelasting 2001][ref1], uitgezonderd
      te conserveren inkomen dat is ontstaan door toepassing van [artikel 3.58, eerste lid][ref2], of
      [artikel 3.64, eerste lid, van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30fc
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 30fc.6
    text: |-
      Voor de toepassing van dit artikel geldt als het te betalen bedrag aan belasting: het bedrag na de verrekening
      ingevolge:
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30fc
  - number: 30fc.6.a
    text: |-
      [artikel 15][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel15
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30fc
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '15'
        hoofdstuk: III
  - number: 30fc.6.b
    text: |-
      de [artikelen 3 152, zesde lid][ref1], en [4.51, zesde lid, van de Wet inkomstenbelasting 2001][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30fc
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '4'
  - number: 30fc.6.c
    text: |-
      [artikel 21, derde lid, van de Wet op de vennootschapsbelasting 1969][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel21
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30fc
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '21'
  - number: 30fd.1
    text: |-
      Indien met betrekking tot de inkomstenbelasting of de vennootschapsbelasting na het verstrijken van een periode
      van 6 maanden te rekenen vanaf het einde van het tijdvak waarover de belasting wordt geheven een aanslag tot
      een negatief bedrag aan te betalen belasting wordt vastgesteld, wordt met betrekking tot die aanslag aan de
      belastingplichtige rente – belastingrente – vergoed ingeval wordt voldaan aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30fd
  - number: 30fd.1.a
    text: de aanslag is overeenkomstig de ingediende aangifte, en
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30fd
  - number: 30fd.1.b
    text: |-
      tussen de datum van ontvangst van die aangifte en de datum van vaststelling van de aanslag zijn meer dan 13 weken
      verstreken.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30fd
  - number: 30fd.2
    text: |-
      [Artikel 30fc, vijfde en zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel30fc
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30fd
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 30fc
        hoofdstuk: VA
  - number: 30fd.3
    text: |-
      Ingeval met de aanslag geen voorlopige aanslag is verrekend, wordt de belastingrente enkelvoudig berekend over
      het tijdvak dat aanvangt 13 weken na ontvangst van de aangifte doch niet eerder dan 6 maanden te rekenen vanaf
      het einde van het tijdvak waarover de belasting wordt geheven, en eindigt 6 weken na de dagtekening van het
      aanslagbiljet en heeft als grondslag het te betalen bedrag aan belasting.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30fd
  - number: 30fd.4
    text: |-
      Ingeval met de aanslag wel een voorlopige aanslag is verrekend, vindt de renteberekening plaats overeenkomstig
      de renteberekening bij een herziening van een voorlopige aanslag inkomstenbelasting, onderscheidenlijk
      vennootschapsbelasting, bedoeld in [artikel 30fb][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel30fb
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30fd
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 30fb
        hoofdstuk: VA
  - number: 30fe.1
    text: |-
      Indien met betrekking tot de inkomstenbelasting of de vennootschapsbelasting na het verstrijken van een periode
      van 6 maanden te rekenen vanaf het einde van het tijdvak waarover de belasting wordt geheven naar aanleiding van
      een bezwaarschrift of een daaropvolgende gerechtelijke procedure een aanslag of een navorderingsaanslag wordt
      verminderd of wordt vernietigd, dan wel een aanslag of navorderingsaanslag ambtshalve wordt verminderd, wordt
      geen rente vergoed. In het geval ter zake van de verminderde of vernietigde aanslag of navorderingsaanslag eerder
      belastingrente in rekening is gebracht, wordt deze rente verminderd overeenkomstig de herziening van een voorlopige
      aanslag, bedoeld in [artikel 30fb, tweede en derde lid.][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel30fb
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30fe
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 30fb
        hoofdstuk: VA
  - number: 30fe.2
    text: |-
      Dit artikel vindt geen toepassing bij een vermindering van een aanslag of navorderingsaanslag die voortvloeit uit
      een verrekening van een verlies van een volgend jaar.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30fe
  - number: 30g.1
    text: |-
      Indien met betrekking tot de erfbelasting een belastingaanslag met een door de belastingplichtige te betalen bedrag
      aan belasting wordt vastgesteld, wordt met betrekking tot die belastingaanslag rente – belastingrente – in rekening
      gebracht.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30g
  - number: 30g.2
    text: 'De belastingrente wordt enkelvoudig berekend:'
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30g
  - number: 30g.2.a
    text: |-
      indien het betreft een belastingaanslag ter zake van een overlijden: over het tijdvak dat aanvangt 8 maanden na
      het overlijden en eindigt op de dag voorafgaand aan de dag waarop de belastingaanslag invorderbaar is ingevolge
      [artikel 9 van de Invorderingswet 1990][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel9
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30g
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '9'
  - number: 30g.2.b
    text: |-
      indien het betreft een belastingaanslag ter zake van een verkrijging ten gevolge van de vervulling
      van een voorwaarde: over het tijdvak dat aanvangt op de dag van de vervulling van de voorwaarde
      en eindigt op de dag voorafgaand aan de dag waarop de belastingaanslag invorderbaar is ingevolge
      [artikel 9 van de Invorderingswet 1990][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel9
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30g
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '9'
  - number: 30g.2.c
    text: |-
      indien het betreft een belastingaanslag als bedoeld in [artikel 8, vijfde lid, van de Natuurschoonwet 1928][ref1]:
      over het tijdvak dat aanvangt op de dag dat zich een van de gevallen, bedoeld in artikel 8, eerste lid, van de
      Natuurschoonwet 1928, voordoet en eindigt op de dag voorafgaand aan de dag waarop de belastingaanslag invorderbaar
      is ingevolge [artikel 9 van de Invorderingswet 1990][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001939#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel9
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30g
    references:
      - id: ref1
        bwb_id: BWBR0001939
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '9'
  - number: 30g.3
    text: |-
      Indien de belastingaanslag is vastgesteld overeenkomstig een verzoek of overeenkomstig de aangifte, eindigt het
      tijdvak waarover de belastingrente wordt berekend in afwijking in zoverre van het tweede lid uiterlijk 14 weken
      na de datum van ontvangst van het verzoek, onderscheidenlijk 19 weken na de datum van ontvangst van de aangifte.
      Ingeval het betreft een navorderingsaanslag die is vastgesteld naar aanleiding van een verzoek, eindigt het tijdvak
      waarover de belastingrente wordt berekend in afwijking in zoverre van de eerste volzin uiterlijk 12 weken na de
      datum van de ontvangst van het verzoek.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30g
  - number: 30g.4
    text: |-
      Indien een belastingaanslag ter zake waarvan belastingrente in rekening is gebracht naar aanleiding van een
      bezwaarschrift, een daaropvolgende gerechtelijke procedure of een ambtshalve vermindering wordt verminderd of
      wordt vernietigd, wordt de eerder in rekening gebrachte rente naar evenredigheid verminderd, onderscheidenlijk
      vernietigd.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30g
  - number: 30g.5
    text: |-
      Voor de toepassing van dit artikel geldt als het te betalen bedrag aan belasting, het bedrag na de verrekening
      ingevolge [artikel 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel15
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30g
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '15'
        hoofdstuk: III
  - number: 30h.1
    text: |-
      Met betrekking tot naheffingsaanslagen ter zake van loonbelasting, omzetbelasting, overdrachtsbelasting, belasting
      van personenauto’s en motorrijwielen, accijns of een in [artikel 1 van de Wet belastingen op milieugrondslag][ref1]
      genoemde belasting, wordt aan degene ten name van wie de naheffingsaanslag is gesteld, rente – belastingrente – in
      rekening gebracht, ingeval de naheffingsaanslag is vastgesteld na het einde van het kalenderjaar of boekjaar waarop
      de nageheven belasting betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel1
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30h
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '1'
  - number: 30h.2
    text: |-
      De belastingrente wordt enkelvoudig berekend over het tijdvak dat aanvangt op de dag volgend op het kalenderjaar
      of boekjaar waarop de nageheven belasting betrekking heeft en eindigt op de dag voorafgaand aan de dag waarop de
      naheffingsaanslag invorderbaar is ingevolge [artikel 9 van de Invorderingswet 1990][ref1] en heeft als grondslag de
      nageheven belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel9
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30h
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '9'
  - number: 30h.3
    text: |-
      Het eerste lid vindt geen toepassing ingeval de naheffingsaanslag het gevolg is van een verbetering van een
      aangifte (suppletie), welke is gedaan binnen 3 maanden na het einde van het kalenderjaar of boekjaar waarop de
      nageheven belasting betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30h
  - number: 30h.4
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing voor zover een in het eerste lid bedoelde belasting te
      laat, doch voordat een naheffingsaanslag is vastgesteld, wordt betaald, behoudens ingeval de betaling plaatsvindt
      binnen 3 maanden na het einde van het kalenderjaar of boekjaar waarop de te laat betaalde belasting betrekking
      heeft. Belastingrente wordt berekend over het tijdvak dat aanvangt op de dag volgend op het kalenderjaar of
      boekjaar waarop de te laat betaalde belasting betrekking heeft en eindigt op de dag van betaling en heeft als
      grondslag het bedrag van de te laat betaalde belasting.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30h
  - number: 30h.5
    text: |-
      Indien een naheffingsaanslag ter zake waarvan belastingrente in rekening is gebracht naar aanleiding van een
      bezwaarschrift, een daaropvolgende gerechtelijke procedure of een ambtshalve vermindering wordt verminderd of
      wordt vernietigd, wordt de eerder in rekening gebrachte rente naar evenredigheid verminderd, onderscheidenlijk
      vernietigd.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30h
  - number: 30ha.1
    text: |-
      Met betrekking tot de in [artikel 30h][ref1] bedoelde belastingen wordt rente – belastingrente – vergoed ingeval
      een teruggaafbeschikking niet wordt vastgesteld binnen 8 weken na de ontvangst van het verzoek om die beschikking.
      De belastingrente wordt enkelvoudig berekend over het tijdvak dat aanvangt 8 weken na ontvangst van het verzoek,
      doch niet eerder dan 3 maanden na het einde van het kalenderjaar of boekjaar waarop de teruggaaf betrekking heeft
      en eindigt 14 dagen na de dagtekening van de teruggaafbeschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel30h
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30ha
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 30h
        hoofdstuk: VA
  - number: 30ha.2
    text: |-
      Uitgezonderd bij een vermindering van een naheffingsaanslag, wordt met betrekking tot de in [artikel 30h][ref1]
      bedoelde belastingen ook belastingrente vergoed indien recht ontstaat op een terug te geven bedrag dat verband
      houdt met een door de inspecteur ingenomen standpunt ter zake van de bij wege van voldoening of afdracht op
      aangifte verschuldigde of terug te geven belasting. De belastingrente wordt enkelvoudig berekend over het tijdvak
      dat aanvangt op de dag na die van de voldoening of afdracht van die belasting, doch niet eerder dan 3 maanden
      na het einde van het kalenderjaar of boekjaar waarop de teruggaaf betrekking heeft en eindigt 14 dagen na de
      dagtekening van de teruggaafbeschikking en heeft als grondslag het terug te geven bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel30h
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30ha
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 30h
        hoofdstuk: VA
  - number: 30ha.3
    text: |-
      Met betrekking tot de in [artikel 30h][ref1] bedoelde belastingen wordt ook belastingrente vergoed indien
      een afwijzende beschikking op een verzoek om een teruggaaf wordt vervangen door een teruggaafbeschikking. De
      belastingrente wordt enkelvoudig berekend over het tijdvak dat aanvangt 8 weken na de ontvangst van het verzoek
      om de teruggaaf, doch niet eerder dan 3 maanden na het einde van het kalenderjaar of boekjaar waarop de teruggaaf
      betrekking heeft en eindigt 14 dagen na de dagtekening van de teruggaafbeschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel30h
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30ha
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 30h
        hoofdstuk: VA
  - number: 30hb
    text: |-
      Het percentage van de belastingrente is gelijk aan het percentage van de ingevolge
      [artikel 120, eerste lid, van Boek 6 van het Burgerlijk Wetboek][ref1] bij algemene maatregel van bestuur
      vastgestelde wettelijke rente, bedoeld in [artikel 119 van Boek 6 van dat wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel120
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel119
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30hb
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '120'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '119'
  - number: 30i.1
    text: 'Met betrekking tot de inkomstenbelasting wordt rente – revisierente – verschuldigd, indien:'
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30i
  - number: 30i.1.a
    text: |-
      door de toepassing van
      [artikel 19b, eerste lid, tweede lid, eerste volzin, of achtste lid, van de Wet op de loonbelasting 1964][ref1]
      in verbinding met [artikel 3.81 van de Wet inkomstenbelasting 2001][ref2] of van
      [artikel 3.83, eerste of tweede lid][ref3], dan wel artikel [7.2, achtste lid, van de laatstgenoemde wet][ref4]
      de aanspraak ingevolge een pensioenregeling of aanspraak op periodieke uitkeringen, bedoeld in
      [artikel 11, eerste lid, onderdeel g][ref5], of de stamrechtspaarrekening of het stamrechtbeleggingsrecht, bedoeld
      in [artikel 11a van de Wet op de loonbelasting 1964][ref6] tot het loon wordt gerekend;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19b
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0002471#Artikel11
      [ref6]: https://wetten.overheid.nl/BWBR0002471#Artikel11a
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30i
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19b
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '7'
      - id: ref5
        bwb_id: BWBR0002471
        artikel: '11'
      - id: ref6
        bwb_id: BWBR0002471
        artikel: 11a
  - number: 30i.1.b
    text: |-
      ingevolge [artikel 3.133][ref1], [3.136][ref2]
      of [7.2, tweede lid, aanhef en onderdeel g, van de Wet inkomstenbelasting 2001][ref3] premies voor een aanspraak
      op periodieke uitkeringen als negatieve uitgaven voor inkomensvoorzieningen in aanmerking worden genomen, behoudens
      voorzover [artikel 3.69, eerste lid, aanhef en onderdeel b, van genoemde wet][ref4] met betrekking tot deze
      negatieve uitgaven voor inkomensvoorzieningen toepassing vindt;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30i
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 30i.1.c
    text: |-
      ingevolge [artikel 3.135][ref1] of
      [7.2, tweede lid, aanhef en onderdeel g, van de Wet inkomstenbelasting 2001][ref2] premies voor een aanspraak
      uit een pensioenregeling als bedoeld in [artikel 1.7, tweede lid, onderdeel b, van die wet][ref3] als negatieve
      uitgaven voor inkomensvoorzieningen in aanmerking worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel1
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30i
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '1'
  - number: 30i.2
    text: |-
      De revisierente bedraagt 20 percent van de waarde in het economische verkeer van aanspraken als
      bedoeld in het eerste lid. In afwijking van de eerste volzin bedraagt de revisierente, ingeval
      [artikel 3.136, tweede, derde of vierde lid, van de Wet inkomstenbelasting 2001][ref1] van toepassing is, 20% van
      het bedrag dat ingevolge die leden als negatieve uitgaven voor inkomensvoorzieningen in aanmerking wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30i
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 30i.3
    text: |-
      Ingeval de aanspraak is bedongen minder dan 10 jaren vóór het jaar waarin de aanspraak ingevolge een
      pensioenregeling of de aanspraak op periodieke uitkeringen tot loon wordt gerekend dan wel de negatieve uitgaven
      voor inkomensvoorzieningen worden genoten, wordt, indien de belastingplichtige dit verzoekt, in afwijking van het
      tweede lid, de revisierente gesteld op het door de belastingplichtige aannemelijk te maken bedrag dat ingevolge
      [artikel 30fc][ref1] aan belastingrente in rekening zou worden gebracht indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel30fc
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30i
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 30fc
        hoofdstuk: VA
  - number: 30i.3.a
    text: |-
      ingeval het betreft een aanspraak ingevolge een pensioenregeling of negatieve uitgaven voor inkomensvoorzieningen:
      de mogelijkheid zou bestaan de aftrek van de premies voor de aanspraak ongedaan te maken door navorderingsaanslagen
      over de jaren van die aftrek, of
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30i
  - number: 30i.3.b
    text: |-
      ingeval het betreft een aanspraak op periodieke uitkeringen: de mogelijkheid zou bestaan de aanspraak tot
      inkomen uit werk en woning te rekenen in het jaar waarop de aanspraak is ontstaan en ter zake daarvan een
      navorderingsaanslag op te leggen.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30i
  - number: 30i.4
    text: |-
      Indien revisierente wordt berekend met betrekking tot inkomstenbelasting die betrekking heeft op
      inkomsten die in aanmerking zijn genomen op grond van de [artikelen 3.83, eerste of tweede lid][ref1],
      [3.133, tweede lid, onderdelen h of j][ref2], [3.136, eerste, tweede, derde, vierde of vijfde lid][ref3],
      of [7.2, achtste lid, van de Wet inkomstenbelasting 2001][ref4], wordt bij de toepassing van het derde lid
      [artikel 30fc, vijfde lid][ref5], buiten toepassing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel30fc
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30i
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '7'
      - id: ref5
        bwb_id: BWBR0002320
        artikel: 30fc
        hoofdstuk: VA
  - number: 30j.1
    text: |-
      De inspecteur stelt het bedrag van de belastingrente vast bij voor bezwaar vatbare beschikking. Met betrekking
      tot deze beschikking zijn de bepalingen in de belastingwet die gelden voor de belastingaanslag ter zake waarvan
      belastingrente wordt berekend, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30j
  - number: 30j.2
    text: |-
      Het bedrag van de belastingrente wordt op het aanslagbiljet of op het afschrift van de uitspraak of bij de
      bekendmaking afzonderlijk vermeld. Ingeval de eerste volzin geen toepassing vindt, blijkt het bedrag van de
      belastingrente uit het afschrift van de beschikking.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30j
  - number: 30j.3
    text: |-
      Met betrekking tot de revisierente bedoeld in [artikel 30i][ref1] zijn het eerste en tweede lid van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel30i
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30j
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 30i
        hoofdstuk: VA
  - number: 30j.4
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld voor de bij de berekening van belastingrente toe te
      passen afrondingen. Voorts kunnen regels worden gesteld met betrekking tot een doelmatige berekening van de
      belastingrente.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30j
  - number: 30k
    text: |-
      Onze Minister kan in het kader van een regeling voor onderling overleg op grond van het Verdrag ter afschaffing
      van dubbele belasting in geval van winstcorrecties tussen verbonden ondernemingen (*Trb.*1990, 173), de
      [Belastingregeling voor het Koninkrijk][ref1] of een verdrag ter voorkoming van dubbele belasting, voor bepaalde
      gevallen of groepen van gevallen afwijkingen toestaan van de [artikelen 30f tot en met 30hb][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002464
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel30f
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel30k
    references:
      - id: ref1
        bwb_id: BWBR0002464
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 30f
        hoofdstuk: VA
  - number: '31'
    text: |-
      Voor de heffing van de directe belastingen en de inkomstenbelasting wordt geen rekening gehouden met
      rechtshandelingen waarvan op grond van de omstandigheid dat zij geen wezenlijke verandering van feitelijke
      verhoudingen hebben ten doel gehad, of op grond van andere bepaalde feiten en omstandigheden moet worden aangenomen
      dat zij zouden achterwege gebleven zijn indien daarmede niet de heffing van de belasting voor het vervolg geheel of
      ten dele zou worden onmogelijk gemaakt.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel31
  - number: '32'
    text: |-
      Het besluit van de inspecteur om een belastingaanslag met toepassing van [artikel 31][ref1] vast te stellen, wordt
      genomen bij voor bezwaar vatbare beschikking en niet dan nadat Onze Minister daartoe toestemming heeft verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel31
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '31'
        hoofdstuk: VI
  - number: '33.1'
    text: |-
      In geval van twijfel of een beraamde rechtshandeling onder [artikel 31][ref1] zou vallen, kan de belanghebbende
      deze vraag onderwerpen aan het oordeel van de inspecteur. De beslissing van de inspecteur wordt genomen bij voor
      bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel31
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '31'
        hoofdstuk: VI
  - number: '33.2'
    text: |-
      Indien de inspecteur de in het eerste lid bedoelde vraag ontkennend beantwoordt, kan [artikel 31][ref1] op de
      rechtshandeling, zo zij tot stand komt, niet worden toegepast, tenzij mocht blijken, dat de feiten niet volkomen
      overeenstemmen met de tevoren gegeven voorstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel31
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '31'
        hoofdstuk: VI
  - number: '34'
    text: |-
      In geval van beroep tegen een uitspraak op een bezwaarschrift betreffende een beschikking als bedoeld in
      [artikel 32][ref1] of [33][ref2], handhaaft de rechtbank de uitspraak indien blijkt, dat de in de beschikking
      omschreven rechtshandeling voldoet aan de voor de toepassing van [artikel 31][ref3] gestelde voorwaarden, en
      vernietigt het de uitspraak indien dit niet het geval is.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel31
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '32'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '33'
        hoofdstuk: VI
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '31'
        hoofdstuk: VI
  - number: '35'
    text: |-
      Nadat de in [artikel 32][ref1] bedoelde beschikking onherroepelijk is geworden kan daaraan uitvoering worden
      gegeven. Een na het onherroepelijk worden van de in de [artikelen 32][ref2] of [33][ref3] bedoelde beschikking,
      met toepassing van [artikel 31][ref4] vastgestelde belastingaanslag kan niet worden bestreden met het bezwaar, dat
      [artikel 31][ref5] geen toepassing had mogen vinden.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel33
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel31
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel31
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '32'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '32'
        hoofdstuk: VI
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '33'
        hoofdstuk: VI
      - id: ref4
        bwb_id: BWBR0002320
        artikel: '31'
        hoofdstuk: VI
      - id: ref5
        bwb_id: BWBR0002320
        artikel: '31'
        hoofdstuk: VI
  - number: '36'
    text: |-
      De termijnen van [artikel 11, derde lid][ref1], [artikel 16, derde en vierde lid][ref2], en
      [artikel 20, derde lid][ref3], worden verlengd met de tijd die verloopt tussen de dagtekening van het afschrift
      van de in [artikel 32][ref4] bedoelde beschikking en de dag welke valt een jaar na die waarop die beschikking
      onherroepelijk geworden dan wel vernietigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel32
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '11'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '16'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '20'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0002320
        artikel: '32'
        hoofdstuk: VI
  - number: '37.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen, met inachtneming van het beginsel van wederkerigheid,
      regelen worden gesteld, waardoor in aansluiting aan de desbetreffende bepalingen voorkomende in de wetgeving van
      een ander deel van het Koninkrijk of van een andere Mogendheid dan wel in de besluiten van een volkenrechtelijke
      organisatie, dubbele belasting geheel of gedeeltelijk wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel37
  - number: '37.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter voorkoming van dubbele belasting in gevallen waarin
      daaromtrent niet op andere wijze is voorzien, regels worden gesteld ten einde gehele of gedeeltelijke vrijstelling
      of vermindering te verlenen van de belasting die betrekking heeft op inkomen of vermogen uit de BES eilanden.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel37
  - number: '37.3'
    text: |-
      De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel37
  - number: '38.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter voorkoming van dubbele belasting in gevallen waarin
      daaromtrent niet op andere wijze is voorzien, regelen worden gesteld ten einde gehele of gedeeltelijke vrijstelling
      of vermindering van belasting te verlenen, indien en voor zover het voorwerp van de belasting is onderworpen
      aan een belasting die vanwege een ander land van het Koninkrijk, een andere Mogendheid of een volkenrechtelijke
      organisatie wordt geheven.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel38
  - number: '38.2'
    text: |-
      Belastbaar loon uit tegenwoordige arbeid wordt voor de toepassing van het eerste lid geacht te zijn onderworpen
      aan een belasting die vanwege een andere Mogendheid wordt geheven, indien zij wordt genoten uit privaatrechtelijke
      dienstbetrekking tot een werkgever die is gevestigd in een lidstaat van de Europese Unie of in een bij ministeriële
      regeling aangewezen staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte, voorzover
      dat loon betrekking heeft op arbeid die gedurende ten minste drie aaneengesloten maanden wordt verricht binnen het
      gebied van een Mogendheid waarmee Nederland geen verdrag ter voorkoming van dubbele belasting heeft gesloten en
      met betrekking waartoe geen regelen zijn gesteld op grond van [artikel 37][ref1]. Voor de toepassing van de vorige
      volzin omvat het gebied van een andere Mogendheid mede het gebied buiten de territoriale wateren van die Mogendheid
      waar deze in overeenstemming met het internationale recht soevereine rechten kan uitoefenen. Onze Minister is
      bevoegd voor bepaalde gevallen of groepen van gevallen te bepalen dat loon betrekking heeft op arbeid die gedurende
      ten minste drie aaneengesloten maanden wordt verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel37
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '37'
        hoofdstuk: VII
  - number: '39'
    text: |-
      In de gevallen waarin het volkenrecht, dan wel naar het oordeel van Onze Minister het internationale gebruik,
      daartoe noopt, wordt vrijstelling van belasting verleend. Onze Minister is bevoegd ter zake nadere regelen te
      stellen.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel39
  - number: '41'
    text: |-
      Hij die zich, ingevolge de belastingwet opgeroepen tot het mondeling aan de inspecteur verstrekken van gegevens
      en inlichtingen, voor het onderhoud met de inspecteur doet vertegenwoordigen, is desgevorderd gehouden zijn
      vertegenwoordiger te vergezellen.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel41
  - number: '42'
    text: |-
      De bevoegdheden van een lichaam kunnen worden uitgeoefend en zijn verplichtingen kunnen worden nagekomen door
      iedere bestuurder.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel42
  - number: '43'
    text: |-
      De bevoegdheden en de verplichtingen van een minderjarige, een onder curatele gestelde, iemand die in staat van
      faillissement is verklaard of ten aanzien van wie de schuldsaneringsregeling natuurlijke personen van toepassing
      is, of wiens vermogen onder bewind is gesteld, kunnen worden uitgeoefend en nagekomen door hun wettelijke
      vertegenwoordiger, curator en bewindvoerder. Desgevorderd zijn laatstgenoemden tot nakoming van de verplichtingen
      gehouden.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel43
  - number: '44.1'
    text: |-
      Na iemands overlijden kunnen zijn rechtverkrijgenden onder algemene titel in het uitoefenen van de bevoegdheden
      en in het nakomen van de verplichtingen, welke de overledene zou hebben gehad, ware hij in leven gebleven, worden
      vertegenwoordigd door een hunner, de executeur, de door de rechter benoemde vereffenaar van de nalatenschap of de
      bewindvoerder over de nalatenschap. Desgevorderd is ieder der in dit lid genoemde personen tot nakoming van die
      verplichtingen gehouden.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel44
  - number: '44.2'
    text: |-
      Stukken betreffende belastingaangelegenheden van een overledene kunnen worden gericht aan een der in het eerste lid
      genoemde personen.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel44
  - number: '45'
    text: |-
      Om geldige redenen kan de inspecteur vertegenwoordiging uitsluiten in de nakoming van een verplichting van hem die
      zelf tot die nakoming in staat is.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel45
  - number: '46'
    text: De bepalingen van deze afdeling gelden niet met betrekking tot strafvordering.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel46
  - number: '47.1'
    text: 'Ieder is gehouden desgevraagd aan de inspecteur:'
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel47
  - number: 47.1.a
    text: de gegevens en inlichtingen te verstrekken welke voor de belastingheffing te zijnen aanzien van belang kunnen zijn;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel47
  - number: 47.1.b
    text: |-
      de boeken, bescheiden en andere gegevensdragers of de inhoud daarvan - zulks ter keuze van de inspecteur - waarvan
      de raadpleging van belang kan zijn voor de vaststelling van de feiten welke invloed kunnen uitoefenen op de
      belastingheffing te zijnen aanzien, voor dit doel beschikbaar te stellen.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel47
  - number: '47.2'
    text: |-
      Ingeval de belastingwet aangelegenheden van een derde aanmerkt als aangelegenheden van degene die vermoedelijk
      belastingplichtig is, gelden, voor zover het deze aangelegenheden betreft, gelijke verplichtingen voor de derde.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel47
  - number: '47.3'
    text: |-
      Een ieder die de leeftijd van veertien jaar heeft bereikt, is verplicht op vordering van de inspecteur terstond een
      identiteitsbewijs als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref1] ter inzage aan te bieden,
      indien dit van belang kan zijn voor de belastingheffing te zijnen aanzien.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 47a.1
    text: |-
      Met betrekking tot een vennootschap met een geheel of ten dele in aandelen verdeeld kapitaal waarin een niet
      in Nederland gevestigd lichaam of een niet in Nederland wonende natuurlijke persoon een belang heeft van meer
      dan 50 percent en met betrekking tot een ander lichaam waarover dat niet in Nederland gevestigde lichaam of
      die natuurlijke persoon de zeggenschap heeft, is [artikel 47, eerste lid][ref1], van overeenkomstige toepassing
      ter zake van gegevens en inlichtingen alsmede gegevensdragers die in het bezit zijn van dat niet in Nederland
      gevestigde lichaam of die natuurlijke persoon. De vorige volzin is van overeenkomstige toepassing in gevallen
      waarin twee of meer lichamen of natuurlijke personen waarvan er ten minste één niet in Nederland is gevestigd
      of woont, volgens een onderlinge regeling tot samenwerking een belang houden van meer dan 50 percent in een
      vennootschap met een geheel of ten dele in aandelen verdeeld kapitaal dan wel de zeggenschap hebben in een ander
      lichaam. Ter zake van die gegevensdragers kan worden volstaan met het voor raadpleging beschikbaar stellen van de
      inhoud daarvan door middel van kopieën, leesbare afdrukken of uittreksels.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel47
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel47a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '47'
        hoofdstuk: VIII
        afdeling: '2'
  - number: 47a.2
    text: |-
      Met betrekking tot de in het eerste lid bedoelde vennootschap en het andere lichaam is
      [artikel 47, eerste lid][ref1], eveneens van overeenkomstige toepassing ter zake van gegevens en inlichtingen
      alsmede gegevensdragers die in het bezit zijn van een niet in Nederland gevestigde vennootschap met een geheel of
      ten dele in aandelen verdeeld kapitaal waarin een in het eerste lid bedoeld niet in Nederland gevestigd lichaam
      of wonend natuurlijk persoon een belang heeft van meer dan 50 percent of die in het bezit zijn van een ander
      niet in Nederland gevestigd lichaam waarover dat niet in Nederland gevestigde lichaam of die natuurlijke persoon
      zeggenschap heeft. Ter zake van die gegevensdragers kan worden volstaan met het voor raadpleging beschikbaar
      stellen van de inhoud daarvan door middel van kopieén, leesbare afdrukken of uittreksels.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel47
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel47a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '47'
        hoofdstuk: VIII
        afdeling: '2'
  - number: 47a.3
    text: |-
      Het eerste en het tweede lid zijn niet van toepassing indien het in die leden bedoelde niet in Nederland gevestigde
      lichaam of de in die leden bedoelde natuurlijke persoon is gevestigd onderscheidenlijk woont in Aruba, Curaçao,
      Sint Maarten of een staat waarmee in de relatie met Nederland een wederkerige regeling bestaat die voorziet
      in inlichtingenuitwisseling met betrekking tot de belasting voor de heffing waarvan de inspecteur de gegevens,
      inlichtingen of gegevensdragers nodig heeft.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel47a
  - number: 47a.4
    text: |-
      In afwijking van het derde lid kan Onze Minister de inspecteur toestaan het eerste en het tweede lid alsnog toe
      te passen indien is gebleken dat bij toepassing van het derde lid de gevraagde inlichtingen niet kunnen worden
      verkregen.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel47a
  - number: 47a.5
    text: |-
      Voor een weigering om te voldoen aan de in dit artikel omschreven verplichtingen kunnen de vennootschap en het
      andere lichaam zich niet met vrucht beroepen op een gebrek aan medewerking van het niet in Nederland gevestigde
      lichaam of de niet in Nederland wonende natuurlijke persoon.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel47a
  - number: 47b.1
    text: |-
      Ieder die de inspecteur verzoekt hem een sociaal-fiscaalnummer toe te kennen dan wel een hem toegekend sociaal-
      fiscaalnummer aan hem bekend te maken, is ter vaststelling van zijn identiteit gehouden een document als bedoeld
      in [artikel 1, eerste lid, onder 1° tot en met 3°, van de Wet op de identificatieplicht][ref1] ter inzage te
      verstrekken aan de inspecteur, die de aard en het nummer van dat document in de administratie opneemt.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel47b
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 47b.2
    text: |-
      Degene op wie de gegevens en inlichtingen, bedoeld in [artikel 53, tweede en derde lid][ref1], betrekking hebben,
      is gehouden, volgens bij of krachtens de belastingwet te stellen regels, aan de administratieplichtige opgave te
      verstrekken van zijn burgerservicenummer of, bij het ontbreken daarvan, zijn sociaal-fiscaalnummer.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel53
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel47b
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '53'
        hoofdstuk: VIII
        afdeling: '2'
  - number: '48.1'
    text: |-
      De in [artikel 47, eerste lid, onderdeel b][ref1], bedoelde verplichting geldt onverminderd voor een derde bij
      wie zich gegevensdragers bevinden van degene die gehouden is deze, of de inhoud daarvan, aan de inspecteur voor
      raadpleging beschikbaar te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel47
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '47'
        hoofdstuk: VIII
        afdeling: '2'
  - number: '48.2'
    text: |-
      De inspecteur stelt degene wiens gegevensdragers hij bij een derde voor raadpleging vordert, gelijktijdig hiervan
      in kennis.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel48
  - number: '49.1'
    text: |-
      De gegevens en inlichtingen dienen duidelijk, stellig en zonder voorbehoud te worden verstrekt, mondeling,
      schriftelijk of op andere wijze - zulks ter keuze van de inspecteur - en binnen een door de inspecteur te stellen
      termijn.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel49
  - number: '49.2'
    text: |-
      Toegelaten moet worden, dat kopieën, leesbare afdrukken of uittreksels worden gemaakt van de voor raadpleging
      beschikbaar gestelde gegevensdragers of de inhoud daarvan.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel49
  - number: 49a.1
    text: |-
      Bij ministeriële regeling wordt aangewezen degene die is gehouden bij het verrichten van de in die ministeriële
      regeling aan te wijzen werkzaamheden het burgerservicenummer of, bij het ontbreken daarvan, het sociaal-
      fiscaalnummer te gebruiken ten behoeve van de rijksbelastingdienst. Voor aanwijzing komt niet in aanmerking een
      overheidsorgaan als bedoeld in [artikel 1, onderdeel c, van de Wet algemene bepalingen burgerservicenummer][ref1]
      of degene aan wie het burgerservicenummer is toegekend. Onder werkzaamheden als bedoeld in de eerste volzin wordt
      mede verstaan het doen van aangifte.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel1
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel49a
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '1'
  - number: 49a.2
    text: |-
      Op het ontwerp van een ministeriële regeling als bedoeld in het eerste lid, is
      [artikel 51, tweede lid, van de Wet bescherming persoonsgegevens][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel51
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel49a
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '51'
  - number: '50.1'
    text: |-
      Degene die een gebouw of grond in gebruik heeft, is verplicht de inspecteur en de door deze aangewezen deskundigen
      desgevraagd toegang te verlenen tot alle gedeelten van dat gebouw en alle grond, voor zover dat voor een ingevolge
      de belastingwet te verrichten onderzoek nodig is.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel50
  - number: '50.2'
    text: |-
      De gevraagde toegang moet worden verleend, tussen acht uur ’s ochtends en zes uur ’s avonds, met uitzondering van
      zaterdagen, zondagen en algemeen erkende feestdagen.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel50
  - number: '50.3'
    text: |-
      Indien het gebouw of de grond wordt gebruikt voor het uitoefenen van een bedrijf, een zelfstandig beroep of een
      werkzaamheid als bedoeld in [artikel 52, eerste lid][ref1], wordt, voor zover het redelijkerwijs niet mogelijk
      is het onderzoek te doen plaatsvinden gedurende de in het tweede lid bedoelde uren, de gevraagde toegang verleend
      tijdens de uren waarin het gebruik voor de uitoefening van dat bedrijf, dat zelfstandig beroep of die werkzaamheid
      daadwerkelijk plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel52
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '52'
        hoofdstuk: VIII
        afdeling: '2'
  - number: '50.4'
    text: |-
      De gebruiker van het gebouw of de grond is verplicht desgevraagd de aanwijzingen te geven die voor het onderzoek
      nodig zijn.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel50
  - number: '51'
    text: |-
      Voor een weigering om te voldoen aan de in de [artikelen 47][ref1], [47a][ref2], [47b][ref3], [48][ref4] en
      [49][ref5] omschreven verplichtingen kan niemand zich met vrucht beroepen op de omstandigheden dat hij uit
      enigerlei hoofde tot geheimhouding verplicht is, zelfs niet indien deze hem bij een wettelijke bepaling is
      opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel47a
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel47b
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel48
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel49
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '47'
        hoofdstuk: VIII
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 47a
        hoofdstuk: VIII
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: 47b
        hoofdstuk: VIII
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0002320
        artikel: '48'
        hoofdstuk: VIII
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0002320
        artikel: '49'
        hoofdstuk: VIII
        afdeling: '2'
  - number: '52.1'
    text: |-
      Administratieplichtigen zijn gehouden van hun vermogenstoestand en van alles betreffende hun bedrijf, zelfstandig
      beroep of werkzaamheid naar de eisen van dat bedrijf, dat zelfstandig beroep of die werkzaamheid op zodanige wijze
      een administratie te voeren en de daartoe behorende boeken, bescheiden en andere gegevensdragers op zodanige wijze
      te bewaren, dat te allen tijde hun rechten en verplichtingen alsmede de voor de heffing van belasting overigens van
      belang zijnde gegevens hieruit duidelijk blijken.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel52
  - number: '52.2'
    text: 'Administratieplichtigen zijn:'
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel52
  - number: 52.2.a
    text: lichamen;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel52
  - number: 52.2.b
    text: |-
      natuurlijke personen die een bedrijf of zelfstandig een beroep uitoefenen, alsmede natuurlijke personen die
      belastbare winst uit onderneming als bedoeld in [artikel 3.3 van de Wet inkomstenbelasting 2001][ref1] genieten;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 52.2.c
    text: natuurlijke personen die inhoudingsplichtige zijn;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel52
  - number: 52.2.d
    text: |-
      natuurlijke personen die een werkzaamheid als bedoeld in de [artikelen 3.91][ref1], [3.92][ref2] en
      [3.92b van de Wet inkomstenbelasting 2001][ref3] verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '52.3'
    text: Tot de administratie behoort hetgeen ingevolge andere belastingwetten wordt bijgehouden, aangetekend of opgemaakt.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel52
  - number: '52.4'
    text: |-
      Voorzover bij of krachtens de belastingwet niet anders is bepaald, zijn administratieplichtigen verplicht de in de
      voorgaande leden bedoelde gegevensdragers gedurende zeven jaar te bewaren.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel52
  - number: '52.5'
    text: |-
      De op een gegevensdrager aangebrachte gegevens, uitgezonderd de op papier gestelde balans en staat van baten en
      lasten, kunnen op een andere gegevensdrager worden overgebracht en bewaard, mits de overbrenging geschiedt met
      juiste en volledige weergave der gegevens en deze gegevens gedurende de volledige bewaartijd beschikbaar zijn en
      binnen redelijke tijd leesbaar kunnen worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel52
  - number: '52.6'
    text: |-
      De administratie dient zodanig te zijn ingericht en te worden gevoerd en de gegevensdragers dienen zodanig te
      worden bewaard, dat controle daarvan door de inspecteur binnen een redelijke termijn mogelijk is. Daartoe verleent
      de administratieplichtige de benodigde medewerking met inbegrip van het verschaffen van het benodigde inzicht in de
      opzet en de werking van de administratie.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel52
  - number: '52.7'
    text: |-
      Ingeval een administratieplichtige een door de inspecteur op het eerste lid gebaseerde verplichting is nagekomen
      maar van oordeel is dat de verplichting onrechtmatig is opgelegd, kan hij verzoeken om vergoeding van kosten
      die rechtstreeks verband houden met deze nakoming. De inspecteur beslist op dat verzoek bij voor bezwaar vatbare
      beschikking en kent een redelijke kostenvergoeding toe in geval van een onrechtmatig opgelegde verplichting.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel52
  - number: 52a.1
    text: |-
      Indien met betrekking tot een op te leggen aanslag, navorderingsaanslag of naheffingsaanslag of een te nemen
      beschikking niet of niet volledig wordt voldaan aan de verplichtingen ingevolge [artikel 41][ref1], [47][ref2],
      [47a][ref3], [49][ref4], [52][ref5], en, voor zover het verplichtingen van administratieplichtigen betreft
      ten behoeve van de heffing van de belasting waarvan de inhouding aan hen is opgedragen, aan de verplichtingen
      ingevolge [artikel 53, eerste, tweede en derde lid][ref6], kan de inspecteur dit vaststellen bij voor
      bezwaar vatbare beschikking (informatiebeschikking). De inspecteur wijst in de informatiebeschikking op
      [artikel 25, derde lid][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel47a
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel49
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel52
      [ref6]: https://wetten.overheid.nl/BWBR0002320#Artikel53
      [ref7]: https://wetten.overheid.nl/BWBR0002320#Artikel25
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '41'
        hoofdstuk: VIII
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '47'
        hoofdstuk: VIII
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: 47a
        hoofdstuk: VIII
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0002320
        artikel: '49'
        hoofdstuk: VIII
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0002320
        artikel: '52'
        hoofdstuk: VIII
        afdeling: '2'
      - id: ref6
        bwb_id: BWBR0002320
        artikel: '53'
        hoofdstuk: VIII
        afdeling: '2'
      - id: ref7
        bwb_id: BWBR0002320
        artikel: '25'
        hoofdstuk: V
        afdeling: '1'
  - number: 52a.2
    text: |-
      De termijn voor de vaststelling van een aanslag, navorderingsaanslag of naheffingsaanslag of het nemen van een
      beschikking wordt verlengd met de periode tussen de bekendmaking van de met betrekking tot die belastingaanslag of
      beschikking genomen informatiebeschikking waarin wordt vastgesteld dat de belastingplichtige niet of niet volledig
      aan zijn verplichtingen heeft voldaan en het moment waarop deze informatiebeschikking onherroepelijk komt vast te
      staan of wordt vernietigd.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel52a
  - number: 52a.3
    text: |-
      Indien de inspecteur een aanslag, navorderingsaanslag of naheffingsaanslag vaststelt of een beschikking neemt
      voordat de met betrekking tot die belastingaanslag of beschikking genomen informatiebeschikking onherroepelijk is
      geworden, vervalt de informatiebeschikking.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel52a
  - number: 52a.4
    text: |-
      Dit artikel laat onverlet de mogelijkheid voor de inspecteur om een procedure aanhangig te maken bij de burgerlijke
      rechter strekkende tot een veroordeling tot nakoming van de verplichtingen voortvloeiende uit deze wet op straffe
      van een dwangsom.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel52a
  - number: '53.1'
    text: |-
      Met betrekking tot administratieplichtigen als bedoeld in [artikel 52][ref1] zijn de in de [artikelen 47][ref2] en
      [48 tot en met 50][ref3] geregelde verplichtingen van overeenkomstige toepassing ten behoeve van:


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel48
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '52'
        hoofdstuk: VIII
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '47'
        hoofdstuk: VIII
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '48'
        hoofdstuk: VIII
        afdeling: '2'
  - number: 53.1.a
    text: de belastingheffing van derden;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel53
  - number: 53.1.b
    text: de heffing van de belasting waarvan de inhouding aan hen is opgedragen.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel53
  - number: '53.2'
    text: |-
      Onverminderd de verplichtingen, bedoeld in het eerste lid, zijn de bij of krachtens de belastingwet aan te wijzen
      administratieplichtigen gehouden de bij of krachtens de belastingwet aan te wijzen gegevens en inlichtingen
      waarvan de kennisneming voor de heffing van de belasting van belang kan zijn eigener beweging te verstrekken aan de
      inspecteur volgens bij of krachtens de belastingwet te stellen regels.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel53
  - number: '53.3'
    text: |-
      De administratieplichtigen, bedoeld in het tweede lid, zijn gehouden bij de gegevens en inlichtingen, bedoeld in
      het tweede lid, het burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer te vermelden van
      degene op wie de gegevens en inlichtingen betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel53
  - number: '53.4'
    text: |-
      Het bepaalde in het eerste lid, aanhef en onderdeel *a*, is niet van toepassing op de personen en de lichamen als
      bedoeld in [artikel 55][ref1], voor zover het de in dat artikel bedoelde gegevens en inlichtingen betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel55
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '55'
        hoofdstuk: VIII
        afdeling: '2'
  - number: '53.5'
    text: |-
      Ingeval een administratieplichtige een door de inspecteur op het eerste lid, aanhef en onderdeel a, gebaseerde
      verplichting is nagekomen maar van oordeel is dat de verplichting onrechtmatig is opgelegd, kan hij verzoeken om
      vergoeding van kosten die rechtstreeks verband houden met deze nakoming. De inspecteur beslist op dat verzoek bij
      voor bezwaar vatbare beschikking en kent een redelijke kostenvergoeding toe in geval van een onrechtmatig opgelegde
      verplichting.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel53
  - number: 53a.1
    text: |-
      Voor een weigering om te voldoen aan de verplichtingen ten behoeve van de belastingheffing van derden kunnen alleen
      bekleders van een geestelijk ambt, notarissen, advocaten, artsen en apothekers zich beroepen op de omstandigheid,
      dat zij uit hoofde van hun stand, ambt of beroep tot geheimhouding verplicht zijn.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel53a
  - number: 53a.2
    text: |-
      Met betrekking tot de verplichtingen ten behoeve van de heffing van de belasting waarvan de inhouding aan
      administratieplichtigen is opgedragen, is [artikel 51][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel51
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel53a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '51'
        hoofdstuk: VIII
        afdeling: '2'
  - number: '54'
    text: |-
      De administratieplichtige die niet of niet volledig voldoet aan de vordering gegevensdragers, of de inhoud daarvan,
      voor raadpleging beschikbaar te stellen, wordt voor de toepassing van de [artikelen 25][ref1] en [27e][ref2]
      geacht niet volledig te hebben voldaan aan een bij of krachtens [artikel 52][ref3] opgelegde verplichting, tenzij
      aannemelijk is dat de afwezigheid of onvolledigheid van de gegevensdragers of de inhoud daarvan het gevolg is van
      overmacht.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel27e
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel52
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '25'
        hoofdstuk: V
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 27e
        hoofdstuk: V
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '52'
        hoofdstuk: VIII
        afdeling: '2'
  - number: '55.1'
    text: |-
      Onze Ministers, openbare lichamen en rechtspersonen die bij of krachtens een bijzondere wet rechtspersoonlijkheid
      hebben verkregen, de onder hen ressorterende instellingen en diensten, alsmede lichamen die hoofdzakelijk
      uitvoering geven aan het beleid van de rijksoverheid, verschaffen, mondeling, schriftelijk of op andere wijze -
      zulks ter keuze van de inspecteur - de gegevens en inlichtingen, en wel kosteloos, die hun door de inspecteur ter
      uitvoering van de belastingwet worden gevraagd.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel55
  - number: '55.2'
    text: Onze Minister kan, op schriftelijk verzoek, ontheffing verlenen van de in het eerste lid omschreven verplichting.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel55
  - number: '56'
    text: |-
      De verplichtingen welke volgens deze afdeling bestaan jegens de inspecteur, gelden mede jegens iedere door Onze
      Minister aangewezen andere ambtenaar van de rijksbelastingdienst.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel56
  - number: '57'
    text: |-
      In bezwaar-, verzoek-, beroep-, verweer- en verzetschriften moet hij die niet in Nederland een vaste woonplaats of
      plaats van vestiging heeft, domicilie kiezen in Nederland.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel57
  - number: '58'
    text: |-
      Het uitnodigen tot het doen van aangifte van degene die niet in Nederland een vaste woonplaats of plaats van
      vestiging heeft, alsmede het ingevolge de belastingwet uitreiken van een stuk aan die persoon, kan ook geschieden
      aan de in Nederland gelegen vaste inrichting voor de uitoefening van zijn bedrijf of beroep, dan wel aan de woning
      of het kantoor van de in Nederland wonende of gevestigde vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel58
  - number: '60'
    text: |-
      Ten aanzien van een na afloop van de termijn ingediend verzoekschrift is
      [artikel 6:11 van de Algemene wet bestuursrecht][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '61'
    text: |-
      Wij behouden Ons voor bij algemene maatregel van bestuur bepalingen vast te stellen tot verzekering van de heffing
      en invordering van belasting van hen die niet in Nederland een vaste woonplaats of plaats van vestiging hebben.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel61
  - number: '62'
    text: Onze Minister is bevoegd regelen te geven ter uitvoering van de belastingwet.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel62
  - number: '63'
    text: |-
      Onze Minister is bevoegd voor bepaalde gevallen of groepen van gevallen tegemoet te komen aan onbillijkheden van
      overwegende aard, welke zich bij de toepassing van de belastingwet mochten voordoen.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel63
  - number: '64.1'
    text: |-
      Ter bevordering van een doelmatige formalisering van de uit een belastingwet voortvloeiende schuld of van de op
      grond van een belastingwet op te leggen bestuurlijke boete kan de inspecteur afwijken van het overigens bij of
      krachtens de belastingwet bepaalde, indien:
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel64
  - number: 64.1.a
    text: degene aan wie de belastingaanslag wordt opgelegd, instemt met deze wijze van formaliseren, en
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel64
  - number: 64.1.b
    text: |-
      de formalisering niet leidt tot een lagere schuld dan de schuld die zonder toepassing van dit artikel voortvloeit
      uit de belastingwet of tot een lagere bestuurlijke boete dan de zonder toepassing van dit artikel op grond van de
      belastingwet op te leggen bestuurlijke boete.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel64
  - number: '64.2'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld voor de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel64
  - number: '65.1'
    text: |-
      Een onjuiste belastingaanslag of beschikking kan door de inspecteur ambtshalve worden verminderd. Een in de
      belastingwet voorziene vermindering, ontheffing of teruggaaf kan door hem ambtshalve worden verleend.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel65
  - number: '65.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van degene die een onjuist bedrag op aangifte heeft
      voldaan of afgedragen, of van wie een onjuist bedrag is ingehouden.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel65
  - number: '66'
    text: |-
      Van de bij beschikking opgelegde bestuurlijke boete kan door Onze Minister gehele of gedeeltelijke kwijtschelding
      worden verleend.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel66
  - number: '67.1'
    text: |-
      Het is een ieder verboden hetgeen hem uit of in verband met enige werkzaamheid bij de uitvoering van de
      belastingwet over de persoon of zaken van een ander blijkt of wordt meegedeeld, verder bekend te maken dan
      noodzakelijk is voor de uitvoering van de belastingwet of voor de invordering van enige rijksbelasting als bedoeld
      in de [Invorderingswet 1990][ref1] (geheimhoudingsplicht).


      [ref1]: https://wetten.overheid.nl/BWBR0004770
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0004770
  - number: '67.2'
    text: 'De geheimhoudingsplicht geldt niet indien:'
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67
  - number: 67.2.a
    text: enig wettelijk voorschrift tot de bekendmaking verplicht;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67
  - number: 67.2.b
    text: |-
      bij regeling van Onze Minister is bepaald dat bekendmaking noodzakelijk is voor de goede vervulling van een
      publiekrechtelijke taak van een bestuursorgaan;
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67
  - number: 67.2.c
    text: |-
      bekendmaking plaatsvindt aan degene op wie de gegevens betrekking hebben voorzover deze gegevens door of namens hem
      zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67
  - number: '67.3'
    text: In andere gevallen dan bedoeld in het tweede lid kan Onze Minister ontheffing verlenen van de geheimhoudingsplicht.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67
  - number: 67a.1
    text: |-
      Indien de belastingplichtige de aangifte voor een belasting welke bij wege van aanslag wordt geheven niet, dan
      wel niet binnen de ingevolge [artikel 9, derde lid][ref1], gestelde termijn heeft gedaan, vormt dit een verzuim
      ter zake waarvan de inspecteur hem, uiterlijk bij de vaststelling van de aanslag, een bestuurlijke boete van ten
      hoogste € 4 920 kan opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel9
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '9'
        hoofdstuk: II
  - number: 67a.2
    text: |-
      Indien over een jaar zowel een aanslag als een conserverende aanslag wordt vastgesteld, wordt de in het eerste lid
      bedoelde boete uitsluitend opgelegd uiterlijk bij het vaststellen van de aanslag. Wordt over een jaar uitsluitend
      een conserverende aanslag vastgesteld, dan wordt die boete opgelegd bij het vaststellen van de conserverende
      aanslag.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67a
  - number: 67b.1
    text: |-
      Indien de belastingplichtige of de inhoudingsplichtige de aangifte voor een belasting welke op aangifte moet worden
      voldaan of afgedragen niet, dan wel niet binnen de in [artikel 10][ref1] bedoelde termijn heeft gedaan, vormt dit
      een verzuim ter zake waarvan de inspecteur hem een bestuurlijke boete van ten hoogste € 123 kan opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel10
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67b
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '10'
        hoofdstuk: II
  - number: 67b.2
    text: |-
      Indien de inhoudingsplichtige de aangifte loonbelasting niet, niet binnen de in artikel 10 bedoelde termijn, dan
      wel onjuist of onvolledig heeft gedaan, vormt dit, in afwijking van het eerste lid, een verzuim terzake waarvan de
      inspecteur hem een bestuurlijke boete van ten hoogste € 1 230 kan opleggen.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67b
  - number: 67b.3
    text: |-
      De bevoegdheid tot het opleggen van de boete wegens het niet dan wel niet tijdig doen van de aangifte vervalt door
      verloop van een jaar na het einde van de termijn waarbinnen de aangifte had moeten worden gedaan. De bevoegdheid
      tot het opleggen van de boete wegens het doen van een onjuiste of onvolledige aangifte vervalt door verloop van
      vijf jaar na het einde van het kalenderjaar van het aangiftetijdvak waarop de aangifte betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67b
  - number: 67c.1
    text: |-
      Indien de belastingplichtige of de inhoudingsplichtige de belasting welke op aangifte moet worden voldaan of
      afgedragen niet, gedeeltelijk niet, dan wel niet binnen de in de belastingwet gestelde termijn heeft betaald, vormt
      dit een verzuim ter zake waarvan de inspecteur hem een bestuurlijke boete van ten hoogste € 4 920 kan opleggen.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67c
  - number: 67c.2
    text: |-
      Bij niet of gedeeltelijk niet betalen legt de inspecteur de boete op, gelijktijdig met de vaststelling van de
      naheffingsaanslag.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67c
  - number: 67c.3
    text: |-
      De bevoegdheid tot het opleggen van de boete wegens niet tijdig betalen vervalt door verloop van vijf jaren na het
      einde van het kalenderjaar waarin de belastingschuld is ontstaan.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67c
  - number: 67c.4
    text: |-
      [Artikel 20, eerste lid, tweede volzin, en tweede lid, tweede volzin][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel20
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67c
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '20'
        hoofdstuk: IV
  - number: 67ca.1
    text: 'Degene die niet voldoet aan de verplichting hem opgelegd bij of krachtens:'
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67ca
  - number: 67ca.1.a
    text: |-
      de [artikelen 6, derde lid][ref1], [43][ref2], [44][ref3], [47b, tweede lid][ref4], [49, tweede lid][ref5], en
