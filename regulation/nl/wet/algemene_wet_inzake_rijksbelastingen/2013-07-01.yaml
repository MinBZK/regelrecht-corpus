  - number: 67ca.1.f
    text: |-
      [artikel 54 van de Wet op belastingen van rechtsverkeer][ref1], begaat een verzuim ter zake waarvan de inspecteur
      hem een bestuurlijke boete van ten hoogste € 4 920 kan opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel54
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67ca
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '54'
  - number: 67ca.2
    text: |-
      De bevoegdheid tot het opleggen van de in het eerste lid bedoelde boete vervalt door verloop van vijf jaren na het
      einde van het kalenderjaar waarin de verplichting is ontstaan.
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67ca
  - number: 67cb.1
    text: |-
      De in de [artikelen 67a, eerste en tweede lid][ref1], [67b, eerste en tweede lid][ref2], [67c, eerste lid][ref3],
      en [67ca, eerste lid][ref4], genoemde bedragen worden elke vijf jaar, met ingang van 1 januari van een
      jaar, bij ministeriële regeling gewijzigd. Deze wijziging vindt voor het eerst plaats per 1 januari 2015. De
      [artikelen 10.1][ref5] en [10.2 van de Wet inkomstenbelasting 2001][ref6] zijn van overeenkomstige toepassing,
      met dien verstande dat als tabelcorrectiefactor wordt genomen het product van de factoren van de laatste vijf
      kalenderjaren.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67a
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel67b
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel67c
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel67ca
      [ref5]: https://wetten.overheid.nl/BWBR0011353#Artikel10
      [ref6]: https://wetten.overheid.nl/BWBR0011353#Artikel10
    url: https://wetten.overheid.nl/BWBR0002320/2013-07-01#Artikel67cb
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 67a
        hoofdstuk: VIIIA
