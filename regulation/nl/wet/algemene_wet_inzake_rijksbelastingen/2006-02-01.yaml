        artikel: 27g
        hoofdstuk: V
        afdeling: '2'
  - number: 27k.1
    text: |-
      De zaken die bij het gerechtshof aanhangig worden gemaakt, worden in behandeling genomen door een meervoudige
      kamer.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27k
  - number: 27k.2
    text: |-
      Indien een zaak naar het oordeel van de meervoudige kamer geschikt is voor verdere behandeling door één rechter,
      kan zij deze verwijzen naar een enkelvoudige kamer.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27k
  - number: 27k.3
    text: |-
      Indien een zaak naar het oordeel van de enkelvoudige kamer ongeschikt is voor behandeling door één rechter,
      verwijst zij deze naar een meervoudige kamer.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27k
  - number: 27k.4
    text: |-
      Verwijzing kan geschieden in elke stand van het geding. Een verwezen zaak wordt voortgezet in de stand waarin zij
      zich bevindt.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27k
  - number: 27l.1
    text: |-
      Van de indiener van het beroepschrift wordt door de griffier van het gerechtshof een griffierecht geheven.
      Indien het een beroepschrift ter zake van twee of meer samenhangende uitspraken betreft, is eenmaal griffierecht
      verschuldigd. In dat geval bedraagt het griffierecht het hoogste op grond van het tweede lid verschuldigde bedrag.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27l
  - number: 27l.2
    text: 'Het griffierecht bedraagt:'
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27l
  - number: 27l.2.a
    text: |-
      € 105 indien door een natuurlijke persoon hoger beroep is ingesteld tegen een uitspraak inzake een ander besluit
      dan een besluit als bedoeld in onderdeel b;
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27l
  - number: 27l.2.b
    text: |-
      € 211 indien door een natuurlijke persoon hoger beroep is ingesteld tegen een uitspraak inzake een besluit als
      bedoeld in [artikel 27b, eerste lid, onderdeel b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel27b
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27l
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 27b
        hoofdstuk: V
        afdeling: '2'
  - number: 27l.2.c
    text: € 422 indien anders dan door een natuurlijke persoon hoger beroep is ingesteld.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27l
  - number: 27l.3
    text: |-
      Indien de inspecteur hoger beroep heeft ingesteld en de uitspraak van de rechtbank in stand blijft, wordt van de
      Staat een griffierecht geheven van € 422.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27l
  - number: 27l.4
    text: |-
      [Artikel 8:41, tweede en vierde lid, van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27l
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 27l.5
    text: |-
      De in het tweede en derde lid genoemde bedragen kunnen bij algemene maatregel van bestuur worden gewijzigd
      voorzover het prijsindexcijfer van de gezinsconsumptie daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27l
  - number: 27m.1
    text: |-
      De andere partij dan de partij die het hoger beroep heeft ingesteld, kan bij haar verweerschrift incidenteel hoger
      beroep instellen.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27m
  - number: 27m.2
    text: |-
      De partij die het hoger beroep heeft ingesteld, wordt in de gelegenheid gesteld om binnen vier weken na verzending
      van het verweerschrift het incidentele hoger beroep te beantwoorden.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27m
  - number: 27m.3
    text: Het gerechtshof kan de in het tweede lid bedoelde termijn verlengen.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27m
  - number: 27n.1
    text: |-
      Van de verzoeker om een voorlopige voorziening wordt door de griffier een griffierecht geheven.
      [Artikel 27l, eerste lid, tweede en derde volzin, tweede en vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel27l
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27n
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 27l
        hoofdstuk: V
        afdeling: '3'
  - number: 27n.2
    text: |-
      [Artikel 8:41, tweede lid, van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing, met dien
      verstande dat de termijn binnen welke de bijschrijving of storting van het verschuldigde bedrag dient plaats te
      vinden, twee weken bedraagt. De voorzieningenrechter kan een kortere termijn stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27n
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 27n.3
    text: |-
      Indien een verzoek wordt ingetrokken omdat de inspecteur, onderscheidenlijk de belanghebbende tot wie het bestreden
      besluit is gericht, aan de voorzieningenrechter schriftelijk heeft medegedeeld de uitvoering van het bestreden
      besluit hangende de procedure met betrekking tot de hoofdzaak op te schorten dan wel de gevraagde voorlopige
      maatregelen te zullen nemen, wordt het betaalde griffierecht door de griffier terugbetaald. In de overige gevallen
      kan de Staat, indien het verzoek wordt ingetrokken, het betaalde griffierecht geheel of gedeeltelijk vergoeden.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27n
  - number: 27n.4
    text: De uitspraak kan inhouden dat het betaalde griffierecht door de Staat geheel of gedeeltelijk wordt vergoed.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27n
  - number: 27n.5
    text: |-
      Indien het verzoek is gedaan door de inspecteur en het verzoek geheel of gedeeltelijk wordt toegewezen, kan
      de uitspraak inhouden dat het betaalde griffierecht door de griffier aan de Staat geheel of gedeeltelijk wordt
      terugbetaald.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27n
  - number: 27n.6
    text: |-
      Dit artikel is van overeenkomstige toepassing op een verzoek om voorlopige voorziening dat wordt gedaan nadat een
      verzoek om herziening is gedaan.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27n
  - number: 27o
    text: |-
      Het gerechtshof bevestigt de uitspraak van de rechtbank, hetzij met overneming, hetzij met verbetering van de
      gronden, of doet, met gehele of gedeeltelijke vernietiging van de uitspraak, hetgeen de rechtbank had behoren te
      doen.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27o
  - number: 27p.1
    text: |-
      Indien het gerechtshof de uitspraak van de rechtbank geheel of gedeeltelijk vernietigt, houdt de uitspraak tevens
      in dat aan de indiener van het beroepschrift het door hem betaalde griffierecht door de Staat wordt vergoed.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27p
  - number: 27p.2
    text: |-
      In de overige gevallen kan de uitspraak inhouden dat het betaalde griffierecht door de Staat geheel of gedeeltelijk
      wordt vergoed.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27p
  - number: 27q.1
    text: 'Het gerechtshof wijst de zaak terug naar de rechtbank die deze in eerste instantie heeft behandeld, indien:'
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27q
  - number: 27q.1.a
    text: |-
      de rechtbank haar onbevoegdheid of de niet-ontvankelijkheid van het beroep heeft uitgesproken en het gerechtshof
      deze uitspraak vernietigt met bevoegdverklaring van de rechtbank onderscheidenlijk ontvankelijkverklaring van het
      beroep, of
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27q
  - number: 27q.1.b
    text: |-
      het gerechtshof om een andere reden dan bedoeld in onderdeel a van oordeel is dat de zaak opnieuw door de rechtbank
      moet worden behandeld.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27q
  - number: 27q.2
    text: |-
      De griffier zendt de gedingstukken, onder medezending van een afschrift van de uitspraak, zo spoedig mogelijk aan
      de griffier van de rechtbank.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27q
  - number: 27r
    text: |-
      In de gevallen als bedoeld in [artikel 27q, eerste lid, onderdeel a][ref1], kan het gerechtshof de zaak zonder
      terugwijzing afdoen, indien zij naar zijn oordeel geen nadere behandeling door de rechtbank behoeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel27q
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27r
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 27q
        hoofdstuk: V
        afdeling: '3'
  - number: 27s
    text: |-
      Indien het gerechtshof van oordeel is dat de uitspraak is gedaan door een andere rechtbank dan de bevoegde, kan het
      de onbevoegdheid voor gedekt verklaren en de uitspraak als bevoegdelijk gedaan aanmerken.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27s
  - number: '28.1'
    text: |-
      De belanghebbende die bevoegd was om hoger beroep bij het gerechtshof in te stellen en Onze Minister kunnen bij de
      Hoge Raad beroep in cassatie instellen tegen:
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel28
  - number: 28.1.a
    text: |-
      een uitspraak van het gerechtshof die overeenkomstig [afdeling 8.2.6 van de Algemene wet bestuursrecht][ref1] is
      gedaan, en


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling8.2.6
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 8.2.6
  - number: 28.1.b
    text: |-
      een uitspraak van de voorzieningenrechter van het gerechtshof die overeenkomstig
      [artikel 8:86 van die wet is gedaan][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '28.2'
    text: |-
      De belanghebbende en Onze Minister kunnen bij de Hoge Raad voorts beroep in cassatie instellen tegen een uitspraak
      van de rechtbank als bedoeld in [artikel 8:55, vijfde lid, van die wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '28.3'
    text: |-
      Indien de belanghebbenden en Onze Minister daarmee schriftelijk instemmen, kan bij de Hoge Raad
      voorts beroep in cassatie worden ingesteld tegen een uitspraak van de rechtbank als bedoeld in
      [afdeling 8.2.6 van de Algemene wet bestuursrecht][ref1], alsmede tegen een uitspraak van de voorzieningenrechter
      van de rechtbank als bedoeld in [artikel 8:86 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling8.2.6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 8.2.6
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '28.4'
    text: 'Geen beroep in cassatie kan worden ingesteld tegen:'
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel28
  - number: 28.4.a
    text: |-
      een uitspraak van het gerechtshof of de rechtbank overeenkomstig
      [artikel 8:54, eerste lid, van de Algemene wet bestuursrecht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 28.4.b
    text: |-
      een uitspraak van de rechtbank overeenkomstig [artikel 8:54a van die wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 28.4.c
    text: |-
      een uitspraak van de voorzieningenrechter van het gerechtshof of de rechtbank overeenkomstig
      [artikel 8:84, tweede lid, van die wet][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 28.4.d
    text: |-
      een uitspraak van de voorzieningenrechter van het gerechtshof of de rechtbank overeenkomstig
      [artikel 8:75a, eerste lid, van de Algemene wet bestuursrecht][ref1], in verband met
      [artikel 8:84, vierde lid, van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '28.5'
    text: |-
      Tegen andere beslissingen van het gerechtshof, van de rechtbank of van de voorzieningenrechter kan slechts
      tegelijkertijd met het beroep in cassatie tegen de in het eerste of het tweede lid bedoelde uitspraak beroep in
      cassatie worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel28
  - number: '28.6'
    text: |-
      De [artikelen 24a, tweede lid][ref1], [26a, derde lid][ref2], en [26b, eerste lid][ref3], zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel24a
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel26a
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel26b
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 24a
        hoofdstuk: V
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 26a
        hoofdstuk: V
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: 26b
        hoofdstuk: V
        afdeling: '2'
  - number: '28.7'
    text: |-
      De werking van de uitspraak van het gerechtshof, de rechtbank of de voorzieningenrechter wordt opgeschort totdat de
      termijn voor het instellen van beroep in cassatie is verstreken of, indien beroep in cassatie is ingesteld, op het
      beroep in cassatie is beslist.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel28
  - number: 28a.1
    text: |-
      De griffier van de Hoge Raad doet van het ingestelde beroep in cassatie zo spoedig mogelijk mededeling aan de
      griffier van het gerecht dat de aangevallen uitspraak heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel28a
  - number: 28a.2
    text: |-
      De griffier van dit gerecht zendt een afschrift van de uitspraak en de op de uitspraak betrekking hebbende
      gedingstukken die onder hem berusten, onverwijld aan de griffier van de Hoge Raad.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel28a
  - number: 28b.1
    text: |-
      Indien beroep in cassatie is ingesteld tegen een mondelinge uitspraak, wordt de mondelinge uitspraak vervangen
      door een schriftelijke uitspraak, tenzij het beroep in cassatie kennelijk niet-ontvankelijk is of de Hoge
      Raad anders bepaalt. De vervanging geschiedt binnen zes weken na de dag waarop de mededeling, bedoeld in
      [artikel 28a, eerste lid][ref1], is gedaan. Het beroep in cassatie wordt geacht gericht te zijn tegen de
      schriftelijke uitspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel28a
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 28a
        hoofdstuk: V
        afdeling: '4'
  - number: 28b.2
    text: |-
      Het gerecht dat de mondelinge uitspraak heeft gedaan, verzendt de vervangende schriftelijke uitspraak gelijktijdig
      aan partijen en aan de griffier van de Hoge Raad.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel28b
  - number: 28b.3
    text: |-
      In afwijking van [artikel 6:5, eerste lid, onderdeel d, van de Algemene wet bestuursrecht][ref1] kan de indiener
      van het beroepschrift de gronden van het beroep verstrekken of aanvullen tot zes weken na de dag waarop de
      schriftelijke uitspraak aan hem is verzonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '29'
    text: |-
      Op de behandeling van het beroep in cassatie zijn de [artikelen 8:14 tot en met 8:25][ref1],
      [8:27 tot en met 8:29][ref2], [8:31 tot en met 8:40][ref3], [8:43][ref4], [8:52][ref5], [8:53][ref6], [8:60][ref7],
      [8:70][ref8], [8:71][ref9] en [8:75 tot en met 8:79][ref10] en [titel 8.4 van de Algemene wet bestuursrecht][ref11]
      van overeenkomstige toepassing , voorzover in deze afdeling niet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref8]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref9]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref10]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref11]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref7
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref8
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref9
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref10
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref11
        bwb_id: BWBR0005537
  - number: 29a.1
    text: |-
      Van de indiener van het beroepschrift wordt door de griffier van de Hoge Raad een griffierecht geheven. Indien het
      een beroepschrift ter zake van twee of meer samenhangende uitspraken betreft, is eenmaal griffierecht verschuldigd.
      In dat geval bedraagt het griffierecht het hoogste op grond van het tweede lid verschuldigde bedrag.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel29a
  - number: 29a.2
    text: 'Het griffierecht bedraagt:'
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel29a
  - number: 29a.2.a
    text: |-
      € 105 indien door een natuurlijke persoon beroep in cassatie is ingesteld tegen een uitspraak inzake een ander
      besluit dan bedoeld in onderdeel b;
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel29a
  - number: 29a.2.b
    text: |-
      € 211 indien door een natuurlijke persoon beroep in cassatie is ingesteld tegen een uitspraak inzake een besluit
      als bedoeld in [artikel 27b, eerste lid, onderdeel b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel27b
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 27b
        hoofdstuk: V
        afdeling: '2'
  - number: 29a.2.c
    text: € 422 indien anders dan door een natuurlijke persoon beroep in cassatie is ingesteld.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel29a
  - number: 29a.3
    text: |-
      Indien Onze Minister beroep in cassatie heeft ingesteld en de uitspraak van het gerechtshof in stand blijft, wordt
      van de Staat een griffierecht geheven van € 422.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel29a
  - number: 29a.4
    text: |-
      [Artikel 8:41, tweede en vierde lid, van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 29a.5
    text: |-
      De in het tweede en derde lid genoemde bedragen kunnen bij algemene maatregel van bestuur worden gewijzigd voor
      zover het prijsindexcijfer van de gezinsconsumptie daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel29a
  - number: 29b.1
    text: |-
      De andere partij dan de partij die het beroep in cassatie heeft ingesteld, kan binnen acht weken na de dag van
      verzending van het beroepschrift een verweerschrift indienen.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel29b
  - number: 29b.2
    text: |-
      De partij kan bij het verweerschrift incidenteel beroep in cassatie instellen. In dat geval wordt de partij
      die beroep in cassatie heeft ingesteld, in de gelegenheid gesteld om binnen vier weken na verzending van het
      verweerschrift het incidentele beroep te beantwoorden.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel29b
  - number: 29b.3
    text: De Hoge Raad kan de in het eerste en tweede lid bedoelde termijnen verlengen.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel29b
  - number: 29c.1
    text: |-
      Indien, hetzij in het beroepschrift hetzij in het verweerschrift hetzij nadien door degene die beroep in cassatie
      heeft ingesteld, binnen twee weken nadat het afschrift van het verweerschrift ter post is bezorgd, schriftelijk is
      verzocht de zaak mondeling te mogen toelichten, bepaalt de Hoge Raad dag en uur waarop de zaak door de advocaten
      van partijen zal kunnen worden bepleit. De griffier stelt beide partijen of de door hen aangewezen advocaten
      hiervan ten minste tien dagen tevoren in kennis.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel29c
  - number: 29c.2
    text: |-
      De advocaten kunnen in plaats van de zaak mondeling bij pleidooi toe te lichten een schriftelijke toelichting
      overleggen of toezenden.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel29c
  - number: 29c.3
    text: |-
      [Artikel 8:62 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing voor zover het beroep in
      cassatie is gericht tegen een uitspraak waarbij de gehele of gedeeltelijke handhaving van een boete in het geding
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel29c
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 29c.4
    text: |-
      In andere gevallen dan in het derde lid bedoeld, heeft de mondelinge behandeling plaats met gesloten deuren, maar
      kan de Hoge Raad bepalen dat de behandeling openbaar is, voor zover de belangen van partijen daardoor niet worden
      geschaad.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel29c
  - number: 29d.1
    text: |-
      Nadat de toelichtingen zijn gehouden of ontvangen of, indien deze niet zijn verzocht, na indiening van de
      schrifturen door partijen, stelt de griffier, indien de procureur-generaal bij de Hoge Raad de wens te kennen heeft
      gegeven om te worden gehoord, alle stukken in diens handen.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel29d
  - number: 29d.2
    text: De procureur-generaal brengt zijn schriftelijke conclusie ter kennis van de Hoge Raad.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel29d
  - number: 29d.3
    text: |-
      Een afschrift van de conclusie wordt aan partijen gezonden. Partijen kunnen binnen twee weken na verzending van het
      afschrift van de conclusie hun schriftelijk commentaar daarop aan de Hoge Raad doen toekomen.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel29d
  - number: 29e.1
    text: De uitspraak van de Hoge Raad wordt schriftelijk gedaan.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel29e
  - number: 29e.2
    text: |-
      Wanneer de Hoge Raad, hetzij op de in het beroepschrift aangevoerde, hetzij op andere gronden, de uitspraak van het
      gerechtshof, de rechtbank of de voorzieningenrechter vernietigt, beslist hij bij dezelfde uitspraak de zaak, zoals
      het gerechtshof, de rechtbank of de voorzieningenrechter had behoren te doen. Indien de beslissing van de hoofdzaak
      afhangt van feiten die bij de vroegere behandeling niet zijn komen vast te staan, verwijst de Hoge Raad, tenzij het
      punten van ondergeschikte aard betreft, het geding naar een gerechtshof of een rechtbank, ter verdere behandeling
      en beslissing van de zaak met inachtneming van de uitspraak van de Hoge Raad.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel29e
  - number: 29f.1
    text: |-
      In geval van intrekking van het beroep in cassatie door Onze Minister, kan Onze Minister op
      verzoek van de belanghebbende bij afzonderlijke uitspraak met overeenkomstige toepassing van
      [artikel 8:75 van de Algemene wet bestuursrecht][ref1] in de kosten worden veroordeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel29f
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 29f.2
    text: |-
      De griffier zendt een door hem voor eensluidend getekend afschrift van de intrekking onverwijld aan die
      belanghebbende.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel29f
  - number: 29f.3
    text: |-
      De [artikelen 6:5 tot en met 6:9][ref1], [6:11][ref2], [6:14][ref3], [6:15][ref4], [6:17][ref5], [6:21][ref6] en
      [8:73a, tweede lid, eerste en tweede volzin, van de Algemene wet bestuursrecht][ref7] zijn van overeenkomstige
      toepassing, alsmede de [artikelen 29c][ref8] en [29d][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref8]: https://wetten.overheid.nl/BWBR0002320#Artikel29c
      [ref9]: https://wetten.overheid.nl/BWBR0002320#Artikel29d
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel29f
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref7
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref8
        bwb_id: BWBR0002320
        artikel: 29c
        hoofdstuk: V
        afdeling: '4'
      - id: ref9
        bwb_id: BWBR0002320
        artikel: 29d
        hoofdstuk: V
        afdeling: '4'
  - number: 29g.1
    text: |-
      Indien de Hoge Raad de uitspraak van het gerechtshof, van de rechtbank of van de voorzieningenrechter vernietigt,
      houdt de uitspraak tevens in dat aan de indiener van het beroepschrift het door hem betaalde griffierecht door de
      door de Hoge Raad aangewezen rechtspersoon wordt vergoed.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel29g
  - number: 29g.2
    text: |-
      In de overige gevallen kan de uitspraak inhouden dat het betaalde griffierecht geheel of gedeeltelijk door de door
      de Hoge Raad aangewezen rechtspersoon wordt vergoed.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel29g
  - number: 29h.1
    text: |-
      In geval van verwijzing zendt de griffier van de Hoge Raad de stukken en een afschrift van de uitspraak binnen een
      week aan het gerechtshof of aan de rechtbank waarheen de zaak is verwezen.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel29h
  - number: 29h.2
    text: |-
      Indien de uitspraak geen verwijzing inhoudt, zendt de griffier de door partijen overgelegde stukken onverwijld aan
      hen terug.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel29h
  - number: 29i.1
    text: |-
      Een uit een uitspraak van de Hoge Raad voortvloeiende teruggaaf van ingehouden of op aangifte afgedragen belasting
      wordt verleend aan degene die het beroep in cassatie heeft ingesteld.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel29i
  - number: 29i.2
    text: |-
      Indien zowel de inhoudingsplichtige als degene van wie is ingehouden ter zake van dezelfde omstandigheden beroep
      in cassatie heeft ingesteld, wordt, indien uit een uitspraak terzake een teruggaaf voortvloeit, die teruggaaf
      uitsluitend verleend aan degene van wie is ingehouden.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel29i
  - number: '30.1'
    text: |-
      In afwijking van [artikel 8:79, tweede lid, van de Algemene wet bestuursrecht][ref1] geschiedt de verstrekking
      overeenkomstig die bepaling van afschriften of uittreksels aan anderen dan partijen met machtiging van de Hoge
      Raad.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '30.2'
    text: |-
      [Artikel 27g, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel27g
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 27g
        hoofdstuk: V
        afdeling: '2'
  - number: 30a.1
    text: |-
      Een beschikking als bedoeld in [artikel 1:3, tweede lid, van de Algemene wet bestuursrecht][ref1] die is genomen op
      grond van wettelijke bepalingen in de zin van de [Douanewet][ref2], is voor bezwaar vatbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007632
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007632
  - number: 30a.2
    text: |-
      Een andere beslissing op grond van wettelijke bepalingen in de zin van de [Douanewet][ref1] wordt bevestigd bij
      beschikking als bedoeld in [artikel 1:3, tweede lid, van de Algemene wet bestuursrecht][ref2], indien degene jegens
      wie de beslissing is genomen daarom verzoekt binnen vier weken nadat de beslissing aan hem is medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0007632
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0007632
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '1'
  - number: 30a.3
    text: |-
      Indien een uitspraak van de rechtbank of van de voorzieningenrechter van de rechtbank betrekking heeft op een voor
      bezwaar vatbare beschikking die op grond van wettelijke bepalingen in de zin van de [Douanewet][ref1] is gegeven
      door Onze Minister, treedt voor de toepassing van dit hoofdstuk Onze Minister in de plaats van de inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0007632
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0007632
  - number: 30b
    text: |-
      De administratieplichtige, bedoeld in [artikel 9 van de Douanewet][ref1], die niet of niet volledig voldoet
      aan de vordering gegevensdragers, of de inhoud daarvan, voor raadpleging beschikbaar te stellen, wordt voor
      de toepassing van de [artikelen 25][ref2] en [27e][ref3] geacht niet volledig te hebben voldaan aan een bij of
      krachtens [artikel 8 van de Douanewet][ref4] opgelegde verplichting, tenzij aannemelijk is dat de afwezigheid of
      onvolledigheid van de gegevensdragers of de inhoud daarvan het gevolg is van overmacht.


      [ref1]: https://wetten.overheid.nl/BWBR0007632#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel27e
      [ref4]: https://wetten.overheid.nl/BWBR0007632#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30b
    references:
      - id: ref1
        bwb_id: BWBR0007632
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '25'
        hoofdstuk: V
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: 27e
        hoofdstuk: V
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0007632
        artikel: '8'
  - number: 30f.1
    text: |-
      Met betrekking tot de inkomstenbelasting en de vennootschapsbelasting wordt rente - heffingsrente -
      berekend ingeval een voorlopige aanslag, een aanslag of een navorderingsaanslag wordt vastgesteld. De
      eerste volzin is niet van toepassing met betrekking tot inkomstenbelasting ter zake van te conserveren
      inkomen als bedoeld in [artikel 2.8, tweede lid, van de Wet inkomstenbelasting 2001][ref1], uitgezonderd
      te conserveren inkomen dat is ontstaan door toepassing van [artikel 3.58, eerste lid][ref2], of
      [artikel 3.64, eerste lid, van de Wet inkomstenbelasting 2001][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30f
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 30f.2
    text: |-
      Met betrekking tot de loonbelasting, de omzetbelasting, de overdrachtsbelasting, de belasting van personenauto’s
      en motorrijwielen, de accijns, de verbruiksbelastingen van alcoholvrije dranken en van pruimtabak en snuiftabak en
      de in [artikel 1 van de Wet belastingen op milieugrondslag][ref1] genoemde belastingen wordt heffingsrente berekend
      ingeval:


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel1
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30f
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '1'
  - number: 30f.2.a
    text: |-
      een naheffingsaanslag wordt vastgesteld vanwege de omstandigheid dat de verschuldigde belasting meer beloopt
      dan die welke is aangegeven, tenzij die naheffingsaanslag het gevolg is van een vrijwillige verbetering van de
      aangifte, welke wordt gedaan binnen drie maanden na het einde van het kalenderjaar of het boekjaar waarop de
      nageheven belasting betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30f
  - number: 30f.2.b
    text: |-
      een teruggaaf van belasting plaatsvindt vanwege de omstandigheid dat de verschuldigde belasting minder beloopt dan
      die welke is aangegeven.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30f
  - number: 30f.3
    text: 'De heffingsrente wordt enkelvoudig berekend:'
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30f
  - number: 30f.3.a
    text: |-
      met betrekking tot de inkomstenbelasting en de vennootschapsbelasting: over het tijdvak dat aanvangt op de dag
      na het midden van het tijdvak waarover de belasting wordt geheven en eindigt op de dag van de dagtekening van het
      aanslagbiljet;
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30f
  - number: 30f.3.b
    text: 'met betrekking tot de loonbelasting:'
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30f
  - number: 30f.3.b.1°
    text: |-
      indien een naheffingsaanslag wordt opgelegd aan de werknemer, de artiest, de beroepssporter of het buitenlandse
      gezelschap dan wel aan hem een teruggaaf wordt verleend: over het tijdvak dat aanvangt op de dag na het einde van
      het kalenderjaar waarop de nageheven belasting dan wel de teruggaaf betrekking heeft en eindigt op de dag van de
      dagtekening van het aanslagbiljet dan wel op de dag van de dagtekening van het afschrift van de beschikking of van
      de kennisgeving waaruit van de teruggaaf blijkt;
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30f
  - number: 30f.3.b.2°
    text: |-
      in de overige gevallen waarin een naheffingsaanslag wordt opgelegd: over het tijdvak dat aanvangt op de dag na het
      einde van het kalenderjaar waarop de nageheven belasting betrekking heeft en eindigt op de dag van de dagtekening
      van het aanslagbiljet;
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30f
  - number: 30f.3.b.3°
    text: |-
      in de overige gevallen waarin een teruggaaf wordt verleend: over het tijdvak dat aanvangt drie maanden na het einde
      van het kalenderjaar waarop de teruggaaf betrekking heeft en eindigt op de dag van de dagtekening van het afschrift
      van de uitspraak of de beschikking of van de kennisgeving waaruit van de teruggaaf blijkt;
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30f
  - number: 30f.3.c
    text: |-
      met betrekking tot de omzetbelasting, de overdrachtsbelasting, de belasting van personenauto’s en motorrijwielen,
      de accijns en de verbruiksbelastingen van alcoholvrije dranken en van pruimtabak en snuiftabak en de in
      [artikel 1 van de Wet belastingen op milieugrondslag][ref1] genoemde belastingen:


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel1
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30f
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '1'
  - number: 30f.3.c.1°
    text: |-
      indien een naheffingsaanslag wordt opgelegd: over het tijdvak dat aanvangt op de dag na het einde van het
      kalenderjaar of het boekjaar waarop de nageheven belasting betrekking heeft en eindigt op de dag van de dagtekening
      van het aanslagbiljet;
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30f
  - number: 30f.3.c.2°
    text: |-
      indien een teruggaaf wordt verleend: over het tijdvak dat aanvangt drie maanden na het einde van het kalenderjaar
      of het boekjaar waarop de teruggaaf betrekking heeft en eindigt op de dag van de dagtekening van het afschrift van
      de uitspraak of van de kennisgeving waaruit van de teruggaaf blijkt;
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30f
  - number: 30f.3.d
    text: |-
      ingeval het tweede lid, tweede volzin, van toepassing is: over het tijdvak dat aanvangt op de dag na het einde
      van het kalenderjaar of het boekjaar waarop de te laat betaalde belasting betrekking heeft en eindigt op de dag
      van betaling.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30f
  - number: 30f.4
    text: |-
      Bij ministeriële regeling kunnen afwijkende regels worden gesteld over de aanvang van het tijdvak waarover de rente
      wordt berekend voor gevallen waarin de belastingplicht voor de inkomstenbelasting of de vennootschapsbelasting in
      de loop van het kalenderjaar ontstaat of eindigt.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30f
  - number: 30f.5
    text: |-
      Voor de toepassing van dit hoofdstuk geldt als het bedrag van de aanslag: het bedrag van de aanslag na de
      verrekening ingevolge
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30f
  - number: 30f.5.a
    text: |-
      [artikel 15][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel15
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30f
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '15'
        hoofdstuk: III
  - number: 30f.5.b
    text: |-
      de [artikelen 3.152, vijfde lid][ref1], en [4.51, vijfde lid, van de Wet inkomstenbelasting 2001][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30f
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '4'
  - number: 30f.5.c
    text: |-
      [artikel 21, derde lid, van de Wet op de vennootschapsbelasting 1969][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel21
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30f
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '21'
  - number: 30f.6
    text: |-
      Het percentage van de heffingsrente in een kalenderkwartaal is gelijk aan de op de eerste werkdag van de tweede
      kalendermaand voorafgaande aan dat kwartaal door de Europese Centrale Bank voor basisherfinancieringstransacties
      toegepaste interestvoet (de minimale biedrente), dan wel, indien dit lager is, het naar de gemiddelde koers van
      die dag door Onze Minister berekende, ongewogen gemiddelde effectieve rendement van de laatste drie uitgegeven, aan
      Euronext effectenbeurs te Amsterdam genoteerde staatsleningen waarbij dit effectieve rendement naar beneden wordt
      afgerond op een vijfvoud van honderdstenprocenten en vervolgens wordt verminderd met 0,5 procentpunt, met dien
      verstande dat het aldus bepaalde percentage van de heffingsrente vervolgens wordt vermeerderd met 1,50 procentpunt.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30f
  - number: 30g.1
    text: |-
      Heffingsrente wordt vergoed over het negatieve bedrag van de voorlopige aanslag, over het negatieve bedrag van de
      aanslag, alsmede over het bedrag van de teruggaaf.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30g
  - number: 30g.2
    text: 'Heffingsrente wordt mede vergoed bij vermindering van:'
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30g
  - number: 30g.2.a
    text: 'het negatieve bedrag van de aanslag: over die vermindering;'
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30g
  - number: 30g.2.b
    text: |-
      de aanslag die geen negatief bedrag beloopt tot een aanslag die wel een negatief bedrag beloopt: over dat negatieve
      bedrag.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30g
  - number: 30g.3
    text: |-
      Bij vermindering van de aanslag eindigt in afwijking in zoverre van [artikel 30][ref1], het tijdvak waarover de
      heffingsrente wordt berekend op de dag van de dagtekening van het afschrift van de uitspraak of van de kennisgeving
      waaruit van de vermindering blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel30f
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30g
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 30f
        hoofdstuk: VA
  - number: 30g.4
    text: |-
      Het tweede lid vindt geen toepassing bij een vermindering van de aanslag die voortvloeit uit de verrekening van een
      verlies van een volgend jaar.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30g
  - number: 30h.1
    text: |-
      Heffingsrente wordt in rekening gebracht over het positieve bedrag van de belastingaanslag, dan wel, indien
      [artikel 30][ref1], van toepassing is, over het bedrag van de te laat betaalde belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel30f
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30h
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 30f
        hoofdstuk: VA
  - number: 30h.2
    text: |-
      De in rekening gebrachte heffingsrente wordt verlaagd bij vermindering van het positieve bedrag van de
      belastingaanslag, tenzij de vermindering voortvloeit uit de verrekening van een verlies van een volgend jaar.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30h
  - number: 30i.1
    text: 'Met betrekking tot de inkomstenbelasting wordt rente – revisierente – verschuldigd, indien:'
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30i
  - number: 30i.1.a
    text: |-
      door de toepassing van
      [artikel 19b, eerste lid, tweede lid, eerste volzin, of zevende lid, van de Wet op de loonbelasting 1964][ref1]
      in verbinding met [artikel 3.81 van de Wet inkomstenbelasting 2001][ref2] of van
      [artikel 3.83, eerste of tweede lid][ref3], dan wel artikel [7.2, achtste lid, van de laatstgenoemde wet][ref4]
      de aanspraak ingevolge een pensioenregeling of aanspraak op periodieke uitkeringen, bedoeld in
      [artikel 11, eerste lid, onderdeel g, van de Wet op de loonbelasting 1964][ref5] tot het loon wordt gerekend;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19b
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0002471#Artikel11
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30i
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19b
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '7'
      - id: ref5
        bwb_id: BWBR0002471
        artikel: '11'
  - number: 30i.1.b
    text: |-
      ingevolge [artikel 3.133][ref1], [3.136][ref2]
      of [7.2, tweede lid, aanhef en onderdeel g, van de Wet inkomstenbelasting 2001][ref3] premies voor een aanspraak
      op periodieke uitkeringen als negatieve uitgaven voor inkomensvoorzieningen in aanmerking worden genomen, behoudens
      voorzover [artikel 3.69, eerste lid, aanhef en onderdeel b, van genoemde wet][ref4] met betrekking tot deze
      negatieve uitgaven voor inkomensvoorzieningen toepassing vindt;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30i
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 30i.1.c
    text: |-
      ingevolge [artikel 3.135][ref1] of
      [7.2, tweede lid, aanhef en onderdeel g, van de Wet inkomstenbelasting 2001][ref2] premies voor een aanspraak
      uit een pensioenregeling als bedoeld in [artikel 1.7, tweede lid, onderdeel b, van die wet][ref3] als negatieve
      uitgaven voor inkomensvoorzieningen in aanmerking worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel1
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30i
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '1'
  - number: 30i.2
    text: |-
      De revisierente bedraagt 20 percent van de waarde in het economische verkeer van aanspraken als bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30i
  - number: 30i.3
    text: |-
      Ingeval de aanspraak is bedongen minder dan 10 jaren vóór het jaar waarin de aanspraak ingevolge een
      pensioenregeling of de aanspraak op periodieke uitkeringen tot loon wordt gerekend dan wel de negatieve uitgaven
      voor inkomensvoorzieningen worden genoten, wordt, indien de belastingplichtige dit verzoekt, in afwijking van het
      tweede lid, de revisierente gesteld op het door de belastingplichtige aannemelijk te maken bedrag dat ingevolge de
      [artikelen 30f][ref1] en [30h][ref2] aan heffingsrente in rekening zou worden gebracht indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel30f
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel30h
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30i
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 30f
        hoofdstuk: VA
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 30h
        hoofdstuk: VA
  - number: 30i.3.a
    text: |-
      ingeval het betreft een aanspraak ingevolge een pensioenregeling of negatieve uitgaven voor inkomensvoorzieningen:
      de mogelijkheid zou bestaan de aftrek van de premies voor de aanspraak ongedaan te maken door navorderingsaanslagen
      over de jaren van die aftrek, of
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30i
  - number: 30i.3.b
    text: |-
      ingeval het betreft een aanspraak op periodieke uitkeringen: de mogelijkheid zou bestaan de aanspraak tot
      inkomen uit werk en woning te rekenen in het jaar waarop de aanspraak is ontstaan en ter zake daarvan een
      navorderingsaanslag op te leggen.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30i
  - number: 30i.4
    text: |-
      Indien revisierente wordt berekend met betrekking tot inkomstenbelasting die betrekking heeft op
      inkomsten die in aanmerking zijn genomen op grond van de [artikelen 3.83, eerste of tweede lid][ref1],
      [3.133, tweede lid, onderdelen h of j][ref2], [3.136, eerste lid][ref3], of
      [7.2, achtste lid, van de Wet inkomstenbelasting 2001][ref4], wordt bij de toepassing van het derde lid
      [artikel 30f, eerste lid, tweede volzin][ref5], buiten aanmerking gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel30f
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30i
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '7'
      - id: ref5
        bwb_id: BWBR0002320
        artikel: 30f
        hoofdstuk: VA
  - number: 30j.1
    text: |-
      De inspecteur stelt het bedrag van de heffingsrente vast bij voor bezwaar vatbare beschikking. Met betrekking
      tot deze beschikking zijn de bepalingen in de belastingwet die gelden voor de belastingaanslag ter zake waarvan
      heffingsrente wordt berekend, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30j
  - number: 30j.2
    text: |-
      Het bedrag van de heffingsrente wordt op het aanslagbiljet of op het afschrift van de uitspraak of bij de
      bekendmaking afzonderlijk vermeld. Ingeval de eerste volzin geen toepassing vindt, blijkt het bedrag van de
      heffingsrente uit het afschrift van de beschikking.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30j
  - number: 30j.3
    text: |-
      Met betrekking tot de revisierente bedoeld in [artikel 30i][ref1] zijn het eerste en tweede lid van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel30i
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30j
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 30i
        hoofdstuk: VA
  - number: 30k
    text: |-
      Onze Minister kan in het kader van een regeling voor onderling overleg op grond van het Verdrag ter afschaffing
      van dubbele belasting in geval van winstcorrecties tussen verbonden ondernemingen (*Trb.*1990, 173), de
      [Belastingregeling voor het Koninkrijk][ref1] of een verdrag ter voorkoming van dubbele belasting, voor bepaalde
      gevallen of groepen van gevallen afwijkingen toestaan van de [artikelen 30f][ref2], [30g][ref3] en [30h][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002464
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel30f
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel30g
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel30h
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel30k
    references:
      - id: ref1
        bwb_id: BWBR0002464
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 30f
        hoofdstuk: VA
      - id: ref3
        bwb_id: BWBR0002320
        artikel: 30g
        hoofdstuk: VA
      - id: ref4
        bwb_id: BWBR0002320
        artikel: 30h
        hoofdstuk: VA
  - number: '31'
    text: |-
      Voor de heffing van de directe belastingen en de inkomstenbelasting wordt geen rekening gehouden met
      rechtshandelingen waarvan op grond van de omstandigheid dat zij geen wezenlijke verandering van feitelijke
      verhoudingen hebben ten doel gehad, of op grond van andere bepaalde feiten en omstandigheden moet worden aangenomen
      dat zij zouden achterwege gebleven zijn indien daarmede niet de heffing van de belasting voor het vervolg geheel of
      ten dele zou worden onmogelijk gemaakt.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel31
  - number: '32'
    text: |-
      Het besluit van de inspecteur om een belastingaanslag met toepassing van [artikel 31][ref1] vast te stellen, wordt
      genomen bij voor bezwaar vatbare beschikking en niet dan nadat Onze Minister daartoe toestemming heeft verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel31
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '31'
        hoofdstuk: VI
  - number: '33.1'
    text: |-
      In geval van twijfel of een beraamde rechtshandeling onder [artikel 31][ref1] zou vallen, kan de belanghebbende
      deze vraag onderwerpen aan het oordeel van de inspecteur. De beslissing van de inspecteur wordt genomen bij voor
      bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel31
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '31'
        hoofdstuk: VI
  - number: '33.2'
    text: |-
      Indien de inspecteur de in het eerste lid bedoelde vraag ontkennend beantwoordt, kan [artikel 31][ref1] op de
      rechtshandeling, zo zij tot stand komt, niet worden toegepast, tenzij mocht blijken, dat de feiten niet volkomen
      overeenstemmen met de tevoren gegeven voorstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel31
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '31'
        hoofdstuk: VI
  - number: '34'
    text: |-
      In geval van beroep tegen een uitspraak op een bezwaarschrift betreffende een beschikking als bedoeld in
      [artikel 32][ref1] of [33][ref2], handhaaft de rechtbank de uitspraak indien blijkt, dat de in de beschikking
      omschreven rechtshandeling voldoet aan de voor de toepassing van [artikel 31][ref3] gestelde voorwaarden, en
      vernietigt het de uitspraak indien dit niet het geval is.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel31
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '32'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '33'
        hoofdstuk: VI
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '31'
        hoofdstuk: VI
  - number: '35'
    text: |-
      Nadat de in [artikel 32][ref1] bedoelde beschikking onherroepelijk is geworden kan daaraan uitvoering worden
      gegeven. Een na het onherroepelijk worden van de in de [artikelen 32][ref2] of [33][ref3] bedoelde beschikking,
      met toepassing van [artikel 31][ref4] vastgestelde belastingaanslag kan niet worden bestreden met het bezwaar, dat
      [artikel 31][ref5] geen toepassing had mogen vinden.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel33
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel31
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel31
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '32'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '32'
        hoofdstuk: VI
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '33'
        hoofdstuk: VI
      - id: ref4
        bwb_id: BWBR0002320
        artikel: '31'
        hoofdstuk: VI
      - id: ref5
        bwb_id: BWBR0002320
        artikel: '31'
        hoofdstuk: VI
  - number: '36'
    text: |-
      De termijnen van [artikel 11, derde lid][ref1], [artikel 16, derde en vierde lid][ref2], en
      [artikel 20, derde lid][ref3], worden verlengd met de tijd die verloopt tussen de dagtekening van het afschrift
      van de in [artikel 32][ref4] bedoelde beschikking en de dag welke valt een jaar na die waarop die beschikking
      onherroepelijk geworden dan wel vernietigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel32
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '11'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '16'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '20'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0002320
        artikel: '32'
        hoofdstuk: VI
  - number: '37'
    text: |-
      Bij algemene maatregel van bestuur kunnen, met inachtneming van het beginsel van wederkerigheid, regelen worden
      gesteld, waardoor in aansluiting aan de desbetreffende bepalingen voorkomende in de wetgeving van een ander deel
      van het Koninkrijk of van een andere Mogendheid dan wel in de besluiten van een volkenrechtelijke organisatie,
      dubbele belasting geheel of gedeeltelijk wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel37
  - number: '38.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen ter voorkoming van dubbele belasting in gevallen waarin daaromtrent niet
      op andere wijze is voorzien, regelen worden gesteld ten einde gehele of gedeeltelijke vrijstelling of vermindering
      van belasting te verlenen, indien en voor zover het voorwerp van de belasting is onderworpen aan een belasting
      die vanwege een ander land van het Koninkrijk, een andere Mogendheid of een volkenrechtelijke organisatie wordt
      geheven.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel38
  - number: '38.2'
    text: |-
      Belastbaar loon uit tegenwoordige arbeid wordt voor de toepassing van het eerste lid geacht te zijn onderworpen
      aan een belasting die vanwege een andere Mogendheid wordt geheven, indien zij wordt genoten uit privaatrechtelijke
      dienstbetrekking tot een binnen het Rijk gevestigde werkgever, voorzover dat loon betrekking heeft op arbeid
      die gedurende ten minste drie aaneengesloten maanden wordt verricht binnen het gebied van een Mogendheid waarmee
      Nederland geen verdrag ter voorkoming van dubbele belasting heeft gesloten en met betrekking waartoe geen regelen
      zijn gesteld op grond van [artikel 37][ref1]. Voor de toepassing van de vorige volzin omvat het gebied van een
      andere Mogendheid mede het gebied buiten de territoriale wateren van die Mogendheid waar deze in overeenstemming
      met het internationale recht soevereine rechten kan uitoefenen. Onze Minister is bevoegd voor bepaalde gevallen of
      groepen van gevallen te bepalen dat loon betrekking heeft op arbeid die gedurende ten minste drie aaneengesloten
      maanden wordt verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel37
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '37'
        hoofdstuk: VII
  - number: '39'
    text: |-
      In de gevallen waarin het volkenrecht, dan wel naar het oordeel van Onze Minister het internationale gebruik,
      daartoe noopt, wordt vrijstelling van belasting verleend. Onze Minister is bevoegd ter zake nadere regelen te
      stellen.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel39
  - number: '41.1'
    text: Vertegenwoordiging kan plaats hebben krachtens volmacht dan wel met vergunning van de inspecteur.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel41
  - number: '41.2'
    text: |-
      Hij die zich, ingevolge de belastingwet opgeroepen tot het mondeling aan de inspecteur verstrekken van gegevens
      en inlichtingen, voor het onderhoud met de inspecteur doet vertegenwoordigen, is desgevorderd gehouden zijn
      vertegenwoordiger te vergezellen.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel41
  - number: '42'
    text: |-
      De bevoegdheden van een lichaam kunnen worden uitgeoefend en zijn verplichtingen kunnen worden nagekomen door
      iedere bestuurder.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel42
  - number: '43'
    text: |-
      De bevoegdheden en de verplichtingen van een minderjarige, een onder curatele gestelde, iemand die in staat van
      faillissement is verklaard of ten aanzien van wie de schuldsaneringsregeling natuurlijke personen van toepassing
      is, of wiens vermogen onder bewind is gesteld, kunnen worden uitgeoefend en nagekomen door hun wettelijke
      vertegenwoordiger, curator en bewindvoerder. Desgevorderd zijn laatstgenoemden tot nakoming van de verplichtingen
      gehouden.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel43
  - number: '44.1'
    text: |-
      Na iemands overlijden kunnen zijn rechtverkrijgenden onder algemene titel in het uitoefenen van de bevoegdheden
      en in het nakomen van de verplichtingen, welke de overledene zou hebben gehad, ware hij in leven gebleven, worden
      vertegenwoordigd door een hunner, de executeur, de door de rechter benoemde vereffenaar van de nalatenschap of de
      bewindvoerder over de nalatenschap. Desgevorderd is ieder der in dit lid genoemde personen tot nakoming van die
      verplichtingen gehouden.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel44
  - number: '44.2'
    text: |-
      Stukken betreffende belastingaangelegenheden van een overledene kunnen worden gericht aan een der in het eerste lid
      genoemde personen.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel44
  - number: '45'
    text: |-
      Om geldige redenen kan de inspecteur vertegenwoordiging uitsluiten in de nakoming van een verplichting van hem die
      zelf tot die nakoming in staat is.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel45
  - number: '46'
    text: De bepalingen van deze afdeling gelden niet met betrekking tot strafvordering.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel46
  - number: '47.1'
    text: 'Ieder is gehouden desgevraagd aan de inspecteur:'
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel47
  - number: 47.1.a
    text: de gegevens en inlichtingen te verstrekken welke voor de belastingheffing te zijnen aanzien van belang kunnen zijn;
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel47
  - number: 47.1.b
    text: |-
      de boeken, bescheiden en andere gegevensdragers of de inhoud daarvan - zulks ter keuze van de inspecteur - waarvan
      de raadpleging van belang kan zijn voor de vaststelling van de feiten welke invloed kunnen uitoefenen op de
      belastingheffing te zijnen aanzien, voor dit doel beschikbaar te stellen.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel47
  - number: '47.2'
    text: |-
      Ingeval de belastingwet aangelegenheden van een derde aanmerkt als aangelegenheden van degene die vermoedelijk
      belastingplichtig is, gelden, voor zover het deze aangelegenheden betreft, gelijke verplichtingen voor de derde.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel47
  - number: '47.3'
    text: |-
      Een ieder die de leeftijd van veertien jaar heeft bereikt, is verplicht op vordering van de inspecteur terstond een
      identiteitsbewijs als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref1] ter inzage aan te bieden,
      indien dit van belang kan zijn voor de belastingheffing te zijnen aanzien.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 47a.1
    text: |-
      Met betrekking tot een vennootschap met een geheel of ten dele in aandelen verdeeld kapitaal waarin een niet
      binnen het Rijk gevestigd lichaam of een niet binnen het Rijk wonende natuurlijke persoon een belang heeft van
      meer dan 50 percent en met betrekking tot een ander lichaam waarover dat niet binnen het Rijk gevestigde lichaam
      of die natuurlijke persoon de zeggenschap heeft, is [artikel 47, eerste lid][ref1], van overeenkomstige toepassing
      ter zake van gegevens en inlichtingen alsmede gegevensdragers die in het bezit zijn van dat niet binnen het Rijk
      gevestigde lichaam of die natuurlijke persoon. De vorige volzin is van overeenkomstige toepassing in gevallen
      waarin twee of meer lichamen of natuurlijke personen waarvan er ten minste één niet binnen het Rijk is gevestigd
      of woont, volgens een onderlinge regeling tot samenwerking een belang houden van meer dan 50 percent in een
      vennootschap met een geheel of ten dele in aandelen verdeeld kapitaal dan wel de zeggenschap hebben in een ander
      lichaam. Ter zake van die gegevensdragers kan worden volstaan met het voor raadpleging beschikbaar stellen van de
      inhoud daarvan door middel van kopieën, leesbare afdrukken of uittreksels.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel47
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel47a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '47'
        hoofdstuk: VIII
        afdeling: '2'
  - number: 47a.2
    text: |-
      Met betrekking tot de in het eerste lid bedoelde vennootschap en het andere lichaam is
      [artikel 47, eerste lid][ref1], eveneens van overeenkomstige toepassing ter zake van gegevens en inlichtingen
      alsmede gegevensdragers die in het bezit zijn van een niet binnen het Rijk gevestigde vennootschap met een
      geheel of ten dele in aandelen verdeeld kapitaal waarin een in het eerste lid bedoeld niet binnen het Rijk
      gevestigd lichaam of wonend natuurlijk persoon een belang heeft van meer dan 50 percent of die in het bezit
      zijn van een ander niet binnen het Rijk gevestigd lichaam waarover dat niet binnen het Rijk gevestigde lichaam
      of die natuurlijke persoon zeggenschap heeft. Ter zake van die gegevensdragers kan worden volstaan met het voor
      raadpleging beschikbaar stellen van de inhoud daarvan door middel van kopieén, leesbare afdrukken of uittreksels.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel47
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel47a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '47'
        hoofdstuk: VIII
        afdeling: '2'
  - number: 47a.3
    text: |-
      Het eerste en het tweede lid zijn niet van toepassing indien het in die leden bedoelde niet binnen het Rijk
      gevestigde lichaam of de in die leden bedoelde natuurlijke persoon is gevestigd onderscheidenlijk woont in een
      staat waarmee in de relatie met Nederland een wederkerige regeling bestaat die voorziet in inlichtingenuitwisseling
      met betrekking tot de belasting voor de heffing waarvan de inspecteur de gegevens, inlichtingen of gegevensdragers
      nodig heeft. Door Onze Minister worden de in dit lid bedoelde staten aangewezen.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel47a
  - number: 47a.4
    text: |-
      In afwijking van het derde lid kan Onze Minister de inspecteur toestaan het eerste en het tweede lid alsnog toe
      te passen indien is gebleken dat bij toepassing van het derde lid de gevraagde inlichtingen niet kunnen worden
      verkregen.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel47a
  - number: 47a.5
    text: |-
      Voor een weigering om te voldoen aan de in dit artikel omschreven verplichtingen kunnen de vennootschap en het
      andere lichaam zich niet met vrucht beroepen op een gebrek aan medewerking van het niet binnen het Rijk gevestigde
      lichaam of de niet binnen het Rijk wonende natuurlijke persoon.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel47a
  - number: 47b.1
    text: |-
      Ieder die de inspecteur verzoekt hem een sociaal-fiscaalnummer toe te kennen dan wel een hem toegekend sociaal-
      fiscaalnummer aan hem bekend te maken, is ter vaststelling van zijn identiteit gehouden een document als bedoeld
      in [artikel 1, eerste lid, onder 1° tot en met 3°, van de Wet op de identificatieplicht][ref1] ter inzage te
      verstrekken aan de inspecteur, die de aard en het nummer van dat document in de administratie opneemt.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel47b
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 47b.2
    text: |-
      Degene op wie de gegevens en inlichtingen, bedoeld in [artikel 53, tweede en derde lid][ref1], betrekking
      hebben, is gehouden, volgens bij of krachtens de belastingwet te stellen regels, aan de administratieplichtige
      opgave te verstrekken van zijn sociaal-fiscaalnummer, een document dat op hem betrekking heeft als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref2] ter inzage te verstrekken en een afschrift daarvan in de
      administratie van de administratieplichtige te laten opnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel47b
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '53'
        hoofdstuk: VIII
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '48.1'
    text: |-
      De in [artikel 47, eerste lid, onderdeel b][ref1], bedoelde verplichting geldt onverminderd voor een derde bij
      wie zich gegevensdragers bevinden van degene die gehouden is deze, of de inhoud daarvan, aan de inspecteur voor
      raadpleging beschikbaar te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel47
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '47'
        hoofdstuk: VIII
        afdeling: '2'
  - number: '48.2'
    text: |-
      De inspecteur stelt degene wiens gegevensdragers hij bij een derde voor raadpleging vordert, gelijktijdig hiervan
      in kennis.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel48
  - number: '49.1'
    text: |-
      De gegevens en inlichtingen dienen duidelijk, stellig en zonder voorbehoud te worden verstrekt, mondeling,
      schriftelijk of op andere wijze - zulks ter keuze van de inspecteur - en binnen een door de inspecteur te stellen
      termijn.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel49
  - number: '49.2'
    text: |-
      Toegelaten moet worden, dat kopieën, leesbare afdrukken of uittreksels worden gemaakt van de voor raadpleging
      beschikbaar gestelde gegevensdragers of de inhoud daarvan.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel49
  - number: '50.1'
    text: |-
      Degene die een gebouw of grond in gebruik heeft, is verplicht de inspecteur en de door deze aangewezen deskundigen
      desgevraagd toegang te verlenen tot alle gedeelten van dat gebouw en alle grond, voor zover dat voor een ingevolge
      de belastingwet te verrichten onderzoek nodig is.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel50
  - number: '50.2'
    text: |-
      De gevraagde toegang moet worden verleend, tussen acht uur ’s ochtends en zes uur ’s avonds, met uitzondering van
      zaterdagen, zondagen en algemeen erkende feestdagen.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel50
  - number: '50.3'
    text: |-
      Indien het gebouw of de grond wordt gebruikt voor het uitoefenen van een bedrijf, een zelfstandig beroep of een
      werkzaamheid als bedoeld in [artikel 52, eerste lid][ref1], wordt, voor zover het redelijkerwijs niet mogelijk
      is het onderzoek te doen plaatsvinden gedurende de in het tweede lid bedoelde uren, de gevraagde toegang verleend
      tijdens de uren waarin het gebruik voor de uitoefening van dat bedrijf, dat zelfstandig beroep of die werkzaamheid
      daadwerkelijk plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel52
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '52'
        hoofdstuk: VIII
        afdeling: '2'
  - number: '50.4'
    text: |-
      De gebruiker van het gebouw of de grond is verplicht desgevraagd de aanwijzingen te geven die voor het onderzoek
      nodig zijn.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel50
  - number: '51'
    text: |-
      Voor een weigering om te voldoen aan de in de [artikelen 47][ref1], [47a][ref2], [47b][ref3], [48][ref4] en
      [49][ref5] omschreven verplichtingen kan niemand zich met vrucht beroepen op de omstandigheden dat hij uit
      enigerlei hoofde tot geheimhouding verplicht is, zelfs niet indien deze hem bij een wettelijke bepaling is
      opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel47a
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel47b
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel48
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel49
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '47'
        hoofdstuk: VIII
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 47a
        hoofdstuk: VIII
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: 47b
        hoofdstuk: VIII
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0002320
        artikel: '48'
        hoofdstuk: VIII
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0002320
        artikel: '49'
        hoofdstuk: VIII
        afdeling: '2'
  - number: '52.1'
    text: |-
      Administratieplichtigen zijn gehouden van hun vermogenstoestand en van alles betreffende hun bedrijf, zelfstandig
      beroep of werkzaamheid naar de eisen van dat bedrijf, dat zelfstandig beroep of die werkzaamheid op zodanige wijze
      een administratie te voeren en de daartoe behorende boeken, bescheiden en andere gegevensdragers op zodanige wijze
      te bewaren, dat te allen tijde hun rechten en verplichtingen alsmede de voor de heffing van belasting overigens van
      belang zijnde gegevens hieruit duidelijk blijken.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel52
  - number: '52.2'
    text: 'Administratieplichtigen zijn:'
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel52
  - number: 52.2.a
    text: lichamen;
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel52
  - number: 52.2.b
    text: |-
      natuurlijke personen die een bedrijf of zelfstandig een beroep uitoefenen, alsmede natuurlijke personen die
      belastbare winst uit onderneming als bedoeld in [artikel 3.3 van de Wet inkomstenbelasting 2001][ref1] genieten;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 52.2.c
    text: natuurlijke personen die inhoudingsplichtige zijn;
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel52
  - number: 52.2.d
    text: |-
      natuurlijke personen die een werkzaamheid als bedoeld in de [artikelen 3.91][ref1] en
      [3.92 van de Wet inkomstenbelasting 2001][ref2] verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '52.3'
    text: Tot de administratie behoort hetgeen ingevolge andere belastingwetten wordt bijgehouden, aangetekend of opgemaakt.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel52
  - number: '52.4'
    text: |-
      Voorzover bij of krachtens de belastingwet niet anders is bepaald, zijn administratieplichtigen verplicht de in de
      voorgaande leden bedoelde gegevensdragers gedurende zeven jaar te bewaren.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel52
  - number: '52.5'
    text: |-
      De op een gegevensdrager aangebrachte gegevens, uitgezonderd de op papier gestelde balans en staat van baten en
      lasten, kunnen op een andere gegevensdrager worden overgebracht en bewaard, mits de overbrenging geschiedt met
      juiste en volledige weergave der gegevens en deze gegevens gedurende de volledige bewaartijd beschikbaar zijn en
      binnen redelijke tijd leesbaar kunnen worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel52
  - number: '52.6'
    text: |-
      De administratie dient zodanig te zijn ingericht en te worden gevoerd en de gegevensdragers dienen zodanig te
      worden bewaard, dat controle daarvan door de inspecteur binnen een redelijke termijn mogelijk is. Daartoe verleent
      de administratieplichtige de benodigde medewerking met inbegrip van het verschaffen van het benodigde inzicht in de
      opzet en de werking van de administratie.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel52
  - number: 52a
    text: |-
      De bij of krachtens de belastingwet aan te wijzen administratieplichtigen zijn gehouden, volgens bij of
      krachtens de belastingwet te stellen regels, van degene op wie de gegevens en inlichtingen, bedoeld in
      [artikel 53, tweede en derde lid][ref1], betrekking hebben:


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel53
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '53'
        hoofdstuk: VIII
        afdeling: '2'
  - number: 52a.a
    text: opgave te verlangen van diens sociaal-fiscaalnummer;
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel52a
  - number: 52a.b
    text: |-
      de identiteit vast te stellen aan de hand van een document als bedoeld in [artikel 47b, tweede lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel47b
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 47b
        hoofdstuk: VIII
        afdeling: '2'
  - number: 52a.c
    text: |-
      in de administratie op te nemen diens sociaal-fiscaalnummer, een afschrift van het document, bedoeld in
      [artikel 47b, tweede lid][ref1], en voorzover uit het afschrift niet de aard of het nummer van het document blijkt
      ook de aard of het nummer van dat document.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel47b
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 47b
        hoofdstuk: VIII
        afdeling: '2'
  - number: '53.1'
    text: |-
      Met betrekking tot administratieplichtigen als bedoeld in [artikel 52][ref1] zijn de in de [artikelen 47][ref2] en
      [48 tot en met 50][ref3] geregelde verplichtingen van overeenkomstige toepassing ten behoeve van:


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel48
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '52'
        hoofdstuk: VIII
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '47'
        hoofdstuk: VIII
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '48'
        hoofdstuk: VIII
        afdeling: '2'
  - number: 53.1.a
    text: de belastingheffing van derden;
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel53
  - number: 53.1.b
    text: de heffing van de belasting waarvan de inhouding aan hen is opgedragen.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel53
  - number: '53.2'
    text: |-
      Onverminderd de verplichtingen, bedoeld in het eerste lid, zijn de bij of krachtens de belastingwet aan te wijzen
      administratieplichtigen gehouden de bij of krachtens de belastingwet aan te wijzen gegevens en inlichtingen
      waarvan de kennisneming voor de heffing van de belasting van belang kan zijn eigener beweging te verstrekken aan de
      inspecteur volgens bij of krachtens de belastingwet te stellen regels.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel53
  - number: '53.3'
    text: |-
      De administratieplichtigen, bedoeld in het tweede lid, zijn gehouden bij de gegevens en inlichtingen, bedoeld in
      het tweede lid, het sociaal-fiscaalnummer te vermelden van degene op wie de gegevens en inlichtingen betrekking
      hebben.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel53
  - number: '53.4'
    text: |-
      Het bepaalde in het eerste lid, aanhef en onderdeel *a*, is niet van toepassing op de personen en de lichamen als
      bedoeld in [artikel 55][ref1], voor zover het de in dat artikel bedoelde gegevens en inlichtingen betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel55
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '55'
        hoofdstuk: VIII
        afdeling: '2'
  - number: 53a.1
    text: |-
      Voor een weigering om te voldoen aan de verplichtingen ten behoeve van de belastingheffing van derden kunnen alleen
      bekleders van een geestelijk ambt, notarissen, advocaten, procureurs, artsen en apothekers zich beroepen op de
      omstandigheid, dat zij uit hoofde van hun stand, ambt of beroep tot geheimhouding verplicht zijn.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel53a
  - number: 53a.2
    text: |-
      Met betrekking tot de verplichtingen ten behoeve van de heffing van de belasting waarvan de inhouding aan
      administratieplichtigen is opgedragen, is [artikel 51][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel51
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel53a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '51'
        hoofdstuk: VIII
        afdeling: '2'
  - number: '54'
    text: |-
      De administratieplichtige die niet of niet volledig voldoet aan de vordering gegevensdragers, of de inhoud daarvan,
      voor raadpleging beschikbaar te stellen, wordt voor de toepassing van de [artikelen 25][ref1] en [27e][ref2]
      geacht niet volledig te hebben voldaan aan een bij of krachtens de [artikelen 52][ref3] of [52a][ref4] opgelegde
      verplichting, tenzij aannemelijk is dat de afwezigheid of onvolledigheid van de gegevensdragers of de inhoud
      daarvan het gevolg is van overmacht.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel27e
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel52
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel52a
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '25'
        hoofdstuk: V
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 27e
        hoofdstuk: V
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '52'
        hoofdstuk: VIII
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0002320
        artikel: 52a
        hoofdstuk: VIII
        afdeling: '2'
  - number: '55.1'
    text: |-
      Onze Ministers, openbare lichamen en rechtspersonen die bij of krachtens een bijzondere wet rechtspersoonlijkheid
      hebben verkregen, de onder hen ressorterende instellingen en diensten, alsmede lichamen die hoofdzakelijk
      uitvoering geven aan het beleid van het Rijk, verschaffen, mondeling, schriftelijk of op andere wijze - zulks ter
      keuze van de inspecteur - de gegevens en inlichtingen, en wel kosteloos, die hun door de inspecteur ter uitvoering
      van de belastingwet worden gevraagd.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel55
  - number: '55.2'
    text: Onze Minister kan, op schriftelijk verzoek, ontheffing verlenen van de in het eerste lid omschreven verplichting.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel55
  - number: '56'
    text: |-
      De verplichtingen welke volgens deze afdeling bestaan jegens de inspecteur, gelden mede jegens iedere door Onze
      Minister aangewezen andere ambtenaar van de rijksbelastingdienst.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel56
  - number: '57'
    text: |-
      In bezwaar-, verzoek-, beroep-, verweer- en verzetschriften moet hij die niet binnen het Rijk een vaste woonplaats
      of plaats van vestiging heeft, domicilie kiezen binnen het Rijk.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel57
  - number: '58'
    text: |-
      Het uitnodigen tot het doen van aangifte van degene die niet binnen het Rijk een vaste woonplaats of plaats van
      vestiging heeft, alsmede het ingevolge de belastingwet uitreiken van een stuk aan die persoon, kan ook geschieden
      aan de binnen het Rijk gelegen vaste inrichting voor de uitoefening van zijn bedrijf of beroep, dan wel aan de
      woning of het kantoor van de binnen het Rijk wonende of gevestigde vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel58
  - number: '59.1'
    text: |-
      Betreft een verzoekschrift meer dan één belastingaanslag of beschikking, dan stelt de inspecteur de verzoeker in
      de gelegenheid het geschrift te vervangen door zoveel verzoekschriften als er belastingaanslagen of beschikkingen
      zijn. Maakt de verzoeker van de hem geboden gelegenheid gebruik, dan worden de nieuwe verzoekschriften geacht op
      dezelfde dag als het oorspronkelijke geschrift door de inspecteur te zijn ontvangen.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel59
  - number: '59.2'
    text: |-
      Een bij een onbevoegde inspecteur ingediend verzoekschrift wordt geacht bij de bevoegde inspecteur te zijn
      ingediend op de dag waarop het bij eerstbedoelde inspecteur is ingekomen.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel59
  - number: '60'
    text: |-
      Ten aanzien van een na afloop van de termijn ingediend verzoekschrift is
      [artikel 6:11 van de Algemene wet bestuursrecht][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '61'
    text: |-
      Wij behouden Ons voor bij algemene maatregel van bestuur bepalingen vast te stellen tot verzekering van de heffing
      en invordering van belasting van hen die niet binnen het Rijk een vaste woonplaats of plaats van vestiging hebben.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel61
  - number: '62'
    text: Onze Minister is bevoegd regelen te geven ter uitvoering van de belastingwet.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel62
  - number: '63'
    text: |-
      Onze Minister is bevoegd voor bepaalde gevallen of groepen van gevallen tegemoet te komen aan onbillijkheden van
      overwegende aard, welke zich bij de toepassing van de belastingwet mochten voordoen.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel63
  - number: '65.1'
    text: |-
      Een onjuiste belastingaanslag of beschikking kan door de inspecteur ambtshalve worden verminderd. Een in de
      belastingwet voorziene vermindering, ontheffing of teruggaaf kan door hem ambtshalve worden verleend.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel65
  - number: '65.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van degene die een onjuist bedrag op aangifte heeft
      voldaan of afgedragen, of van wie een onjuist bedrag is ingehouden.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel65
  - number: '66'
    text: |-
      Van de bij beschikking opgelegde boete kan door Onze Minister gehele of gedeeltelijke kwijtschelding worden
      verleend.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel66
  - number: '67.1'
    text: |-
      Het is een ieder verboden hetgeen hem in enige werkzaamheid bij de uitvoering van de belastingwet, of in verband
      daarmede, nopens de persoon of de zaken van een ander blijkt of medegedeeld wordt, verder bekend te maken dan nodig
      is voor de uitvoering van de belastingwet of voor de heffing of de invordering van enige rijksbelasting.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67
  - number: '67.2'
    text: Onze Minister kan ontheffing verlenen van het in het eerste lid vervatte verbod.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67
  - number: 67a.1
    text: |-
      Indien de belastingplichtige de aangifte voor een belasting welke bij wege van aanslag wordt geheven niet, dan wel
      niet binnen de ingevolge [artikel 9, derde lid][ref1], gestelde termijn heeft gedaan, vormt dit een verzuim ter
      zake waarvan de inspecteur hem, gelijktijdig met de vaststelling van de aanslag, een boete van ten hoogste € 1 134
      kan opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel9
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '9'
        hoofdstuk: II
  - number: 67a.2
    text: |-
      Indien over een jaar zowel een aanslag als een conserverende aanslag wordt vastgesteld, wordt de in het eerste
      lid bedoelde boete uitsluitend opgelegd bij het vaststellen van de aanslag. Wordt over een jaar uitsluitend een
      conserverende aanslag vastgesteld, dan wordt die boete opgelegd bij het vaststellen van de conserverende aanslag.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67a
  - number: 67b.1
    text: |-
      Indien de belastingplichtige of de inhoudingsplichtige de aangifte voor een belasting welke op aangifte moet worden
      voldaan of afgedragen niet, dan wel niet binnen de in [artikel 10][ref1] bedoelde termijn heeft gedaan, vormt dit
      een verzuim ter zake waarvan de inspecteur hem een boete van ten hoogste € 113 kan opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel10
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67b
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '10'
        hoofdstuk: II
  - number: 67b.2
    text: |-
      Indien de inhoudingsplichtige de aangifte loonbelasting niet, niet binnen de in artikel 10 bedoelde termijn, dan
      wel onjuist of onvolledig heeft gedaan, vormt dit, in afwijking van het eerste lid, een verzuim terzake waarvan de
      inspecteur hem een boete van ten hoogste € 1134 kan opleggen.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67b
  - number: 67b.3
    text: |-
      De bevoegdheid tot het opleggen van de boete wegens het niet dan wel niet tijdig doen van de aangifte vervalt door
      verloop van een jaar na het einde van de termijn waarbinnen de aangifte had moeten worden gedaan. De bevoegdheid
      tot het opleggen van de boete wegens het doen van een onjuiste of onvolledige aangifte vervalt door verloop van
      vijf jaar na het einde van het kalenderjaar van het aangiftetijdvak waarop de aangifte betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67b
  - number: 67c.1
    text: |-
      Indien de belastingplichtige of de inhoudingsplichtige de belasting welke op aangifte moet worden voldaan of
      afgedragen niet, gedeeltelijk niet, dan wel niet binnen de in de belastingwet gestelde termijn heeft betaald, vormt
      dit een verzuim ter zake waarvan de inspecteur hem een boete van ten hoogste € 4 537 kan opleggen.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67c
  - number: 67c.2
    text: |-
      Bij niet of gedeeltelijk niet betalen legt de inspecteur de boete op, gelijktijdig met de vaststelling van de
      naheffingsaanslag.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67c
  - number: 67c.3
    text: |-
      De bevoegdheid tot het opleggen van de boete wegens niet tijdig betalen vervalt door verloop van vijf jaren na het
      einde van het kalenderjaar waarin de belastingschuld is ontstaan.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67c
  - number: 67d.1
    text: |-
      Indien het aan opzet van de belastingplichtige is te wijten dat met betrekking tot een belasting welke bij wege van
      aanslag wordt geheven, de aangifte niet, dan wel onjuist of onvolledig is gedaan, vormt dit een vergrijp ter zake
      waarvan de inspecteur hem, gelijktijdig met de vaststelling van de aanslag, een boete kan opleggen van ten hoogste
      100 percent van de in het tweede lid omschreven grondslag voor de boete.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67d
  - number: 67d.2
    text: 'De grondslag voor de boete wordt gevormd door:'
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67d
  - number: 67d.2.a
    text: het bedrag van de aanslag, dan wel
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67d
  - number: 67d.2.b
    text: |-
      indien verliezen in aanmerking zijn of worden genomen, het bedrag waarop de aanslag zou zijn berekend zonder
      rekening te houden met die verliezen; een en ander voor zover dat bedrag als gevolg van de opzet van de
      belastingplichtige niet zou zijn geheven.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67d
  - number: 67d.3
    text: |-
      Indien verliezen in aanmerking zijn of worden genomen en als gevolg daarvan geen aanslag kan worden vastgesteld,
      kan de inspecteur de boete, bedoeld in het eerste lid, niettemin opleggen. De bevoegdheid tot het opleggen van
      de boete vervalt door verloop van de termijn die geldt voor het vaststellen van de aanslag, die zou kunnen zijn
      vastgesteld indien geen verliezen in aanmerking zouden zijn genomen.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67d
  - number: 67d.4
    text: |-
      Voor de toepassing van het tweede en derde lid wordt met verliezen gelijkgesteld de persoonsgebonden aftrek,
      bedoeld in [artikel 6.1, eerste lid, onderdeel b, van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67d
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
  - number: 67e.1
    text: |-
      Indien het met betrekking tot een belasting welke bij wege van aanslag wordt geheven aan opzet of grove schuld van
      de belastingplichtige is te wijten dat de aanslag tot een te laag bedrag is vastgesteld of anderszins te weinig
      belasting is geheven, vormt dit een vergrijp ter zake waarvan de inspecteur hem, gelijktijdig met de vaststelling
      van de navorderingsaanslag, een boete kan opleggen van ten hoogste 100 percent van de in het tweede lid omschreven
      grondslag voor de boete.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67e
  - number: 67e.2
    text: 'De grondslag voor de boete wordt gevormd door:'
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67e
  - number: 67e.2.a
    text: het bedrag van de navorderingsaanslag, dan wel
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67e
  - number: 67e.2.b
    text: |-
      indien verliezen in aanmerking zijn of worden genomen, het bedrag waarop de navorderingsaanslag zou zijn berekend
      zonder rekening te houden met die verliezen; een en ander voor zover dat bedrag als gevolg van de opzet of de grove
      schuld van de belastingplichtige niet zou zijn geheven.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67e
  - number: 67e.3
    text: |-
      De inspecteur kan, in afwijking van het eerste lid, binnen zes maanden na de vaststelling van de
      navorderingsaanslag, een boete opleggen indien de feiten of omstandigheden op grond waarvan wordt nagevorderd eerst
      bekend worden op of na het tijdstip dat is gelegen zes maanden vóór de afloop van de in [artikel 16][ref1] bedoelde
      termijnen, en er tevens aanwijzingen bestaan dat het aan opzet of grove schuld van de belastingplichtige is te
      wijten dat de aanslag tot een te laag bedrag is vastgesteld of anderszins te weinig belasting is geheven. Alsdan
      doet de inspecteur gelijktijdig met de vaststelling van de navorderingsaanslag mededeling aan de belastingplichtige
      dat wordt onderzocht of in verband met de navordering het opleggen van een vergrijpboete gerechtvaardigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel16
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67e
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '16'
        hoofdstuk: III
  - number: 67e.4
    text: |-
      Indien verliezen in aanmerking zijn of worden genomen en als gevolg daarvan geen navorderingsaanslag kan
      worden vastgesteld, kan de inspecteur de boete, bedoeld in het eerste lid, niettemin opleggen. De bevoegdheid
      tot het opleggen van de boete vervalt door verloop van de termijn die geldt voor het vaststellen van de
      navorderingsaanslag, die zou kunnen zijn vastgesteld indien geen verliezen in aanmerking zouden zijn genomen.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67e
  - number: 67e.5
    text: |-
      Voor de toepassing van het tweede en vierde lid wordt met verliezen gelijkgesteld de persoonsgebonden aftrek,
      bedoeld in [artikel 6.1, eerste lid, onderdeel b, van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67e
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
  - number: 67f.1
    text: |-
      Indien het aan opzet of grove schuld van de belastingplichtige of de inhoudingsplichtige is te wijten dat
      belasting welke op aangifte moet worden voldaan of afgedragen niet, gedeeltelijk niet, dan wel niet binnen de in de
      belastingwet gestelde termijn is betaald, vormt dit een vergrijp ter zake waarvan de inspecteur hem een boete kan
      opleggen van ten hoogste 100 percent van de in het tweede lid omschreven grondslag voor de boete.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67f
  - number: 67f.2
    text: |-
      De grondslag voor de boete wordt gevormd door het bedrag van de belasting dat niet of niet tijdig is betaald, voor
      zover dat bedrag als gevolg van de opzet of de grove schuld van de belastingplichtige of de inhoudingsplichtige
      niet of niet tijdig is betaald.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67f
  - number: 67f.3
    text: |-
      Bij niet of gedeeltelijk niet betalen legt de inspecteur de boete op, gelijktijdig met de vaststelling van de
      naheffingsaanslag.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67f
  - number: 67f.4
    text: |-
      De bevoegdheid tot het opleggen van de boete wegens niet tijdig betalen, vervalt door verloop van vijf jaren na het
      einde van het kalenderjaar waarin de belastingschuld is ontstaan.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67f
  - number: 67f.5
    text: |-
      [Artikel 67e, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67e
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67f
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 67e
        hoofdstuk: VIIIA
        paragraaf: '2'
        afdeling: '1'
  - number: 67f.6
    text: |-
      [Artikel 20, eerste lid, tweede volzin, en tweede lid, tweede volzin][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel20
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67f
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '20'
        hoofdstuk: IV
  - number: 67g.1
    text: De inspecteur legt de boete op bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67g
  - number: 67g.2
    text: |-
      Onverminderd het bepaalde in [artikel 67k][ref1] stelt de inspecteur de belastingplichtige of de
      inhoudingsplichtige, uiterlijk bij de in het eerste lid bedoelde beschikking, in kennis van de gronden waarop de
      oplegging van de boete berust.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67k
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67g
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 67k
        hoofdstuk: VIIIA
        paragraaf: '1'
        afdeling: '2'
  - number: 67g.3
    text: |-
      Op verzoek van de belastingplichtige of de inhoudingsplichtige die de kennisgeving wegens zijn gebrekkige kennis
      van de Nederlandse taal onvoldoende begrijpt, draagt de inspecteur er zoveel mogelijk zorg voor dat de in die
      kennisgeving vermelde gronden aan de belastingplichtige of de inhoudingsplichtige worden medegedeeld in een voor
      hem begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67g
  - number: 67g.4
    text: |-
      Indien een boete gelijktijdig wordt opgelegd met de vaststelling van een belastingaanslag, wordt het bedrag van de
      boete afzonderlijk op het aanslagbiljet vermeld.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67g
  - number: 67h
    text: |-
      Indien de grondslag voor een boete wordt gevormd door het bedrag van de belasting, wordt de opgelegde boete naar
      evenredigheid verlaagd bij vermindering, teruggaaf, terugbetaling of kwijtschelding van belasting, voor zover deze
      vermindering, teruggaaf, terugbetaling of kwijtschelding het bedrag betreft waarover de boete is berekend.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67h
  - number: 67i.1
    text: Geen boete wordt opgelegd aan de belastingplichtige of de inhoudingsplichtige die is overleden.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67i
  - number: 67i.2
    text: |-
      Indien een boete op het tijdstip van het overlijden van de belastingplichtige of de inhoudingsplichtige niet
      onherroepelijk vaststaat, vernietigt de inspecteur de beschikking waarbij de boete is opgelegd op verzoek van een
      belanghebbende bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67i
  - number: 67i.3
    text: |-
      Indien een boete op het tijdstip van het overlijden van de belastingplichtige of de inhoudingsplichtige
      onherroepelijk vaststaat, maar nog niet of niet volledig is betaald, verlaagt de inspecteur op verzoek van een
      belanghebbende de boete tot het op dat tijdstip betaalde bedrag bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67i
  - number: 67i.4
    text: |-
      Het verzoek, bedoeld in het tweede, onderscheidenlijk derde lid, wordt ingediend binnen vijf jaren nadat de
      belastingplichtige of de inhoudingsplichtige is overleden.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67i
  - number: 67j
    text: |-
      Indien de inspecteur jegens de belastingplichtige of de inhoudingsplichtige een handeling heeft verricht waaraan
      deze in redelijkheid de gevolgtrekking kan verbinden dat aan hem wegens een bepaalde gedraging een boete zal
      worden opgelegd, is, voor zoveel nodig in afwijking van [hoofdstuk VIII, afdeling 2][ref1], de belastingplichtige
      onderscheidenlijk de inhoudingsplichtige niet langer verplicht ter zake van die gedraging enige verklaring af te
      leggen voorzover het betreft de boete-oplegging.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67j
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: VIII
        afdeling: '2'
  - number: 67k.1
    text: |-
      Alvorens een vergrijpboete op te leggen, stelt de inspecteur de belastingplichtige of de inhoudingsplichtige in
      kennis van zijn voornemen daartoe, onder vermelding van de gronden waarop het voornemen berust.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67k
  - number: 67k.2
    text: |-
      De inspecteur stelt de belastingplichtige of de inhoudingsplichtige in de gelegenheid binnen een door hem te
      stellen termijn de in die kennisgeving vermelde gronden gemotiveerd te betwisten.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67k
  - number: 67l.1
    text: |-
      De inspecteur kan de belastingplichtige of de inhoudingsplichtige ten aanzien van wie de redelijke verwachting
      bestaat dat hem een bestuurlijke boete kan worden opgelegd, oproepen voor een verhoor. In deze oproep deelt de
      inspecteur hem mede dat hij zich desgewenst kan doen bijstaan.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67l
  - number: 67l.2
    text: |-
      Voordat het verhoor aanvangt, deelt de inspecteur de belastingplichtige of de inhoudingsplichtige mede dat hij niet
      tot antwoorden verplicht is.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67l
  - number: 67l.3
    text: |-
      Op verzoek van de belastingplichtige of de inhoudingsplichtige die de Nederlandse taal onvoldoende begrijpt, draagt
      de inspecteur er zorg voor dat een tolk wordt benoemd die de belastingplichtige of de inhoudingsplichtige tijdens
      het verhoor kan bijstaan, tenzij redelijkerwijs kan worden aangenomen dat daaraan geen behoefte bestaat; aan de
      tolk wordt ten laste van het Rijk een vergoeding toegekend ingevolge de [Wet tarieven in strafzaken][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002406
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67l
    references:
      - id: ref1
        bwb_id: BWBR0002406
  - number: 67m
    text: |-
      De inspecteur stelt de belastingplichtige of de inhoudingsplichtige op diens verzoek in de gelegenheid inzage te
      nemen in, dan wel kopieën, leesbare afdrukken of uittreksels te vervaardigen van de gegevensdragers waarop het
      voornemen tot het opleggen, dan wel het opleggen van een bestuurlijke boete berust.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67m
  - number: 67n
    text: |-
      Een vergrijpboete wordt niet opgelegd aan de belastingplichtige die alsnog een juiste en volledige aangifte doet,
      dan wel juiste en volledige inlichtingen, gegevens of aanwijzingen verstrekt vóórdat hij weet of redelijkerwijs
      moet vermoeden dat de inspecteur met de onjuistheid of onvolledigheid bekend is of bekend zal worden.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67n
  - number: 67o
    text: |-
      De bevoegdheid tot het opleggen van een bestuurlijke boete vervalt indien ter zake van het feit op grond waarvan de
      boete kan worden opgelegd, tegen de belastingplichtige of de inhoudingsplichtige een strafvervolging is ingesteld
      en het onderzoek ter terechtzitting een aanvang heeft genomen, dan wel het recht tot strafvervolging is vervallen
      ingevolge [artikel 76 van deze wet][ref1] of [artikel 74 van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67o
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '76'
        hoofdstuk: IX
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '74'
  - number: 67p
    text: |-
      Deze afdeling is van overeenkomstige toepassing ten aanzien van anderen dan de belastingplichtige of de
      inhoudingsplichtige aan wie ingevolge de belastingwet een bestuurlijke boete kan worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67p
  - number: 67q
    text: |-
      Bij het opleggen van de bestuurlijke boeten bedoeld in [hoofdstuk 5 van de Douanewet][ref1] blijft
      [artikel 67n][ref2] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007632#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel67n
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel67q
    references:
      - id: ref1
        bwb_id: BWBR0007632
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 67n
        hoofdstuk: VIIIA
        paragraaf: '1'
        afdeling: '2'
  - number: '68.1'
    text: 'Degene die niet voldoet aan de verplichting hem opgelegd bij of krachtens:'
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel68
  - number: 68.1.a
    text: |-
      de [artikelen 6, derde lid][ref1], [43][ref2], [44][ref3], [47b, tweede lid][ref4], [49, tweede lid][ref5],
      [50, eerste lid][ref6], en [52a, onderdelen a en b][ref7];


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel43
