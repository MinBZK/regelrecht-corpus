        afdeling: '2'
      - id: ref7
        bwb_id: BWBR0002320
        artikel: '53'
        hoofdstuk: VIII
        afdeling: '2'
  - number: 27e.c
    text: |-
      niet volledig is voldaan aan de verplichting tot inlichtingenverstrekking ingevolge artikel 14 van het Communautair
      douanewetboek; of
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27e
  - number: 27e.d
    text: |-
      niet volledig is voldaan aan de verplichtingen ingevolge de [artikelen 8][ref1] en [9 van de Douanewet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0007632#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007632#Artikel9
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27e
    references:
      - id: ref1
        bwb_id: BWBR0007632
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0007632
        artikel: '9'
  - number: 27f.1
    text: |-
      Een uit een uitspraak van de rechtbank voortvloeiende teruggaaf van ingehouden of op aangifte afgedragen belasting
      wordt verleend aan degene die het beroep heeft ingesteld.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27f
  - number: 27f.2
    text: |-
      Indien zowel de inhoudingsplichtige als degene van wie is ingehouden ter zake van dezelfde feiten beroep heeft
      ingesteld, wordt, indien uit een uitspraak terzake een teruggaaf voortvloeit, die teruggaaf uitsluitend verleend
      aan degene van wie is ingehouden.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27f
  - number: 27g.1
    text: |-
      In afwijking van [artikel 8:79, tweede lid, van de Algemene wet bestuursrecht][ref1] geschiedt de verstrekking
      overeenkomstig die bepaling van afschriften of uittreksels aan anderen dan partijen met machtiging van de
      rechtbank.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27g
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 27g.2
    text: |-
      Met betrekking tot schriftelijke uitspraken blijft de machtiging, bedoeld in het eerste lid, slechts achterwege
      indien op een voor de uitspraak gedaan verzoek van een der partijen de rechtbank oordeelt dat ook na anonimisering
      de geheimhouding van persoonlijke en financiële gegevens onvoldoende wordt beschermd en bovendien het belang van de
      openbaarheid van de rechtspraak niet opweegt tegen dit belang.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27g
  - number: 27h.1
    text: |-
      De belanghebbende die bevoegd was beroep bij de rechtbank in te stellen en de inspecteur kunnen
      bij het gerechtshof hoger beroep instellen tegen een uitspraak van de rechtbank als bedoeld in
      [afdeling 8.2.6 van de Algemene wet bestuursrecht][ref1] en tegen een uitspraak van de voorzieningenrechter van de
      rechtbank als bedoeld in [artikel 8:86 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling8.2.6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27h
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 8.2.6
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 27h.2
    text: 'Geen hoger beroep kan worden ingesteld tegen:'
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27h
  - number: 27h.2.a
    text: |-
      een uitspraak van de rechtbank na toepassing van [artikel 8:54, eerste lid, van de Algemene wet bestuursrecht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27h
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 27h.2.b
    text: |-
      een uitspraak van de rechtbank als bedoeld in [artikel 8:54a van die wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27h
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 27h.2.c
    text: |-
      een uitspraak van de rechtbank als bedoeld in [artikel 8:55, vijfde lid, van die wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27h
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 27h.2.d
    text: |-
      een uitspraak van de voorzieningenrechter van de rechtbank als bedoeld in
      [artikel 8:84, tweede lid, van die wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27h
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 27h.2.e
    text: |-
      een uitspraak van de voorzieningenrechter van de rechtbank als bedoeld in [artikel 8:75a, eerste lid][ref1], in
      verband met [artikel 8:84, vierde lid, van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27h
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 27h.3
    text: |-
      Tegen andere beslissingen van de rechtbank onderscheidenlijk de voorzieningenrechter kan slechts tegelijkertijd met
      het hoger beroep tegen de in het eerste lid bedoelde uitspraak hoger beroep worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27h
  - number: 27h.4
    text: |-
      De artikelen [24a, tweede lid][ref1], [26a, derde lid][ref2], en [26b, eerste lid][ref3], zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel24a
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel26a
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel26b
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27h
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 24a
        hoofdstuk: V
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 26a
        hoofdstuk: V
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: 26b
        hoofdstuk: V
        afdeling: '2'
  - number: 27h.5
    text: |-
      De werking van de uitspraak van de rechtbank of van de voorzieningenrechter wordt opgeschort totdat de termijn
      voor het instellen van hoger beroep is verstreken of, indien hoger beroep is ingesteld, op het hoger beroep
      onherroepelijk is beslist.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27h
  - number: 27i.1
    text: |-
      De griffier doet van het ingestelde hoger beroep zo spoedig mogelijk mededeling aan de griffier van de rechtbank
      die de uitspraak heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27i
  - number: 27i.2
    text: |-
      De griffier van de rechtbank, bedoeld in het eerste lid, zendt de gedingstukken met vier afschriften van het
      proces-verbaal van de zitting, voorzover dit op de zaak betrekking heeft, en vier afschriften van de uitspraak
      binnen een week na ontvangst van de in het eerste lid bedoelde mededeling aan de griffier van het gerechtshof.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27i
  - number: 27j.1
    text: |-
      Op het hoger beroep is [hoofdstuk 8 van de Algemene wet bestuursrecht][ref1], met uitzondering van
      [afdeling 8.1.1][ref2] en de [artikelen 8:10][ref3], [8:41][ref4], [8:74][ref5] en [8:82][ref6], van
      overeenkomstige toepassing, voorzover in deze afdeling niet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling8.1.1
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27j
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: 8.1.1
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 27j.2
    text: |-
      [Artikel 8:13 van de Algemene wet bestuursrecht][ref1] is niet van overeenkomstige toepassing indien hoger beroep
      is ingesteld bij de douanekamer van het gerechtshof te Amsterdam.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27j
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 27j.3
    text: |-
      De [artikelen 27c][ref1], [27d][ref2], [27e][ref3], [27f][ref4] en [27g][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel27c
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel27d
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel27e
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel27f
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel27g
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27j
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 27c
        hoofdstuk: V
        afdeling: '2'
