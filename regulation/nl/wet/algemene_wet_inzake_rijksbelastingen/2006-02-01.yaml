        hoofdstuk: VIII
        afdeling: '2'
  - number: 68.1.b
    text: |-
      [artikel 7, tweede lid, van de Wet op de kansspelbelasting][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002359#Artikel7
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel68
    references:
