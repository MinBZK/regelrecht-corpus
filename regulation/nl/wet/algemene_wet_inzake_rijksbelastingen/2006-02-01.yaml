  - number: 68.1.d
    text: |-
      [artikel 9, eerste lid, van de Wet op de dividendbelasting 1965][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002515#Artikel9
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0002515
        artikel: '9'
  - number: 68.1.e
    text: |-
      [artikel 35, eerste, tweede en derde lid, van de Wet op de omzetbelasting 1968][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel35
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '35'
  - number: '68.2'
    text: 'Degene die ingevolge de belastingwet verplicht is tot:'
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel68
  - number: 68.2.a
    text: het verstrekken van inlichtingen, gegevens of aanwijzingen, en deze niet, onjuist of onvolledig verstrekt;
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel68
  - number: 68.2.b
    text: |-
      het voor raadpleging beschikbaar stellen van boeken, bescheiden, andere gegevensdragers of de inhoud daarvan, en
      deze niet voor dit doel beschikbaar stelt;
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel68
  - number: 68.2.c
    text: |-
      het voor raadpleging beschikbaar stellen van boeken, bescheiden, andere gegevensdragers of de inhoud daarvan, en
      deze in valse of vervalste vorm voor dit doel beschikbaar stelt;
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel68
  - number: 68.2.d
    text: |-
      het voeren van een administratie overeenkomstig de daaraan bij of krachtens de belastingwet gestelde eisen, en een
      zodanige administratie niet voert;
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel68
  - number: 68.2.e
    text: het bewaren van boeken, bescheiden of andere gegevensdragers, en deze niet bewaart;
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel68
  - number: 68.2.f
    text: |-
      het verlenen van medewerking als bedoeld in [artikel 52, zesde lid][ref1], en deze niet verleent;


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel52
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '52'
        hoofdstuk: VIII
        afdeling: '2'
  - number: 68.2.g
    text: het uitreiken van een factuur of nota, en een onjuiste of onvolledige factuur of nota verstrekt;
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel68
  - number: '68.3'
    text: |-
      Degene die niet voldoet aan de verplichting, hem opgelegd bij [artikel 47, derde lid][ref1], wordt gestraft met
      geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel47
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '47'
        hoofdstuk: VIII
        afdeling: '2'
  - number: '68.4'
    text: |-
      Niet strafbaar is degene die de in [artikel 47a][ref1] bedoelde verplichting niet nakomt ten gevolge van een
      voor het niet binnen het Rijk gevestigde lichaam of de niet binnen het Rijk wonende natuurlijke persoon geldend
      wettelijk of rechterlijk verbod tot het verlenen van medewerking aan de verstrekking van de verlangde gegevens
      of inlichtingen of het voor raadpleging beschikbaar stellen van boeken, bescheiden, andere gegevensdragers of
      de inhoud daarvan, dan wel ten gevolge van een hem niet toe te rekenen weigering van het niet binnen het Rijk
      gevestigde lichaam of de niet binnen het Rijk wonende natuurlijke persoon de verlangde gegevens of inlichtingen
      te verstrekken of boeken, bescheiden, andere gegevensdragers of de inhoud daarvan voor raadpleging beschikbaar
      te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel47a
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 47a
        hoofdstuk: VIII
        afdeling: '2'
  - number: '69.1'
    text: |-
      Degene die opzettelijk een bij de belastingwet voorziene aangifte niet doet, niet
      binnen de daarvoor gestelde termijn doet, dan wel een der feiten begaat, omschreven in
      [artikel 68, tweede lid, onderdeel a, b, d, e, f of g][ref1], wordt, indien het feit ertoe strekt dat te weinig
      belasting wordt geheven, gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde
      categorie of, indien dit bedrag hoger is, ten hoogste eenmaal het bedrag van de te weinig geheven belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel68
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '68'
        hoofdstuk: IX
        afdeling: '1'
  - number: '69.2'
    text: |-
      Degene die opzettelijk een bij de belastingwet voorziene aangifte onjuist of onvolledig doet, dan wel het feit
      begaat, omschreven in [artikel 68, tweede lid, onderdeel c][ref1], wordt, indien het feit ertoe strekt dat te
      weinig belasting wordt geheven, gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde
      categorie of, indien dit bedrag hoger is, ten hoogste eenmaal het bedrag van de te weinig geheven belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel68
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '68'
        hoofdstuk: IX
        afdeling: '1'
  - number: '69.3'
    text: |-
      Het recht tot strafvervolging op de voet van dit artikel vervalt, indien de schuldige alsnog een juiste en
      volledige aangifte doet, dan wel juiste en volledige inlichtingen, gegevens of aanwijzingen verstrekt vóórdat hij
      weet of redelijkerwijs moet vermoeden dat een of meer van de in [artikel 80, eerste lid][ref1], bedoelde ambtenaren
      de onjuistheid of onvolledigheid bekend is of bekend zal worden.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel80
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '80'
        hoofdstuk: IX
        afdeling: '3'
  - number: '69.4'
    text: |-
      Indien het feit, ter zake waarvan de verdachte kan worden vervolgd, zowel valt onder een van de bepalingen van het
      eerste of het tweede lid, als onder die van [artikel 225, tweede lid, van het Wetboek van Strafrecht][ref1], is
      strafvervolging op grond van genoemd [artikel 225, tweede lid][ref2], uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel225
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel225
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '225'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '225'
  - number: '69.5'
    text: |-
      [Artikel 68, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel68
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '68'
        hoofdstuk: IX
        afdeling: '1'
  - number: 69a
    text: |-
      Het recht tot strafvervolging op de voet van [artikel 69][ref1] met betrekking tot een vergrijp als bedoeld in
      [artikel 67d][ref2] of [67e][ref3] vervalt, indien de inspecteur aan een belastingplichtige ter zake reeds een
      boete heeft opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel67d
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel67e
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel69a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '69'
        hoofdstuk: IX
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 67d
        hoofdstuk: VIIIA
        paragraaf: '2'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: 67e
        hoofdstuk: VIIIA
        paragraaf: '2'
        afdeling: '1'
  - number: '70'
    text: |-
      Overtreding van door Ons krachtens de belastingwet bij algemene maatregel van bestuur vastgestelde bepalingen
      wordt, voor zover die overtreding is aangemerkt als strafbaar feit, gestraft met geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel70
  - number: '71'
    text: |-
      Overtreding van door Onze Minister krachtens de belastingwet vastgestelde algemene voorschriften wordt, voor zover
      die overtreding is aangemerkt als strafbaar feit, gestraft met geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel71
  - number: '72'
    text: |-
      De bij de belastingwet strafbaar gestelde feiten waarop gevangenisstraf is gesteld, zijn misdrijven. De overige bij
      de belastingwet strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel72
  - number: '73'
    text: |-
      De Nederlandse strafwet is ook van toepassing op ieder die zich buiten het Rijk schuldig maakt aan enig in de
      belastingwet omschreven misdrijf.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel73
  - number: '74'
    text: |-
      Ter zake van bij de belastingwet strafbaar gestelde feiten vindt [artikel 36][ref1] geen toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel36e
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 36e
  - number: '76.1'
    text: |-
      Ten aanzien van bij de belastingwet strafbaar gestelde feiten gelden in plaats van de [artikelen 74][ref1] en
      [74][ref2] de volgende bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel74a
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 74a
  - number: '76.2'
    text: |-
      Ten aanzien van feiten, met betrekking tot welke het proces-verbaal niet overeenkomstig
      [artikel 80, tweede lid][ref1], in handen van de officier van justitie is gesteld, vervalt het recht tot
      strafvordering door vrijwillige voldoening aan de voorwaarden welke het bestuur van ’s Rijks belastingen ter
      voorkoming van de strafvervolging mocht hebben gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel80
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '80'
        hoofdstuk: IX
        afdeling: '3'
  - number: '76.3'
    text: 'Als voorwaarden kunnen worden gesteld:'
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel76
  - number: 76.3.a
    text: |-
      betaling aan de Staat van een geldsom, te bepalen op ten minste € 3 en ten hoogste het maximum van de geldboete die
      voor het feit kan worden opgelegd;
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel76
  - number: 76.3.b
    text: |-
      afstand van voorwerpen die in beslag zijn genomen en vatbaar zijn voor verbeurdverklaring of onttrekking aan het
      verkeer;
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel76
  - number: 76.3.c
    text: |-
      uitlevering, of voldoening aan de Staat van de geschatte waarde, van voorwerpen die vatbaar zijn voor
      verbeurdverklaring;
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel76
  - number: 76.3.d
    text: |-
      voldoening aan de Staat van een geldbedrag gelijk aan of lager dan het geschatte voordeel - met inbegrip van
      besparing van kosten - door de verdachte verkregen door middel van of uit het strafbare feit;
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel76
  - number: 76.3.e
    text: het alsnog voldoen aan een bij de belastingwet gestelde verplichting;
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel76
  - number: '76.4'
    text: |-
      Het bestuur van ’s Rijks belastingen bepaalt telkens de termijn binnen welke aan de gestelde voorwaarden moet zijn
      voldaan en zo nodig tevens de plaats waar zulks moet geschieden. De gestelde termijn kan vóór de afloop daarvan
      éénmaal worden verlengd.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel76
  - number: '76.5'
    text: |-
      [Artikel 552ab van het Wetboek van Strafvordering is v][ref1]an overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel552
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '552'
  - number: 76a.1
    text: |-
      Medeplichtigheid aan de in de [artikelen 44, eerste lid][ref1], [45][ref2], [46, eerste lid][ref3],
      en [48, eerste lid, onderdeel ][ref4] vermelde overtredingen is strafbaar. Te dien aanzien vinden de
      [artikelen 48][ref5] en [49 van het Wetboek van Strafrecht][ref6] overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007632#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0007632#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0007632#Artikel46
      [ref4]: https://wetten.overheid.nl/BWBR0007632#Artikel48
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel48
      [ref6]: https://wetten.overheid.nl/BWBR0001854#Artikel49
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel76a
    references:
      - id: ref1
        bwb_id: BWBR0007632
        artikel: '44'
      - id: ref2
        bwb_id: BWBR0007632
        artikel: '45'
      - id: ref3
        bwb_id: BWBR0007632
        artikel: '46'
      - id: ref4
        bwb_id: BWBR0007632
        artikel: '48'
      - id: ref5
        bwb_id: BWBR0001854
        artikel: '48'
      - id: ref6
        bwb_id: BWBR0001854
        artikel: '49'
  - number: 76a.2
    text: |-
      Poging tot de in [artikel 46, eerste lid, van de Douanewet][ref1] vermelde overtreding is strafbaar. Te dien
      aanzien vindt [artikel 45 van het Wetboek van Strafrecht][ref2] overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007632#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel45
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel76a
    references:
      - id: ref1
        bwb_id: BWBR0007632
        artikel: '46'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '45'
  - number: 76b
    text: |-
      De Nederlandse strafwet is ook van toepassing op ieder die zich buiten Nederland schuldig maakt aan de in
      [artikel 48, eerste lid, onderdeel ][ref1] omschreven overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0007632#Artikel48
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel76b
    references:
      - id: ref1
        bwb_id: BWBR0007632
        artikel: '48'
  - number: 76c
    text: |-
      Bij veroordeling wegens een der in de [artikelen 44][ref1], [45][ref2], [46][ref3], [47][ref4] en
      [48, eerste lid, onderdeel ][ref5] omschreven strafbare feiten kunnen de in [artikel 33][ref6] genoemde voorwerpen
      ook worden verbeurdverklaard, indien zij niet aan de in dat artikel bedoelde persoon toebehoren.


      [ref1]: https://wetten.overheid.nl/BWBR0007632#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0007632#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0007632#Artikel46
      [ref4]: https://wetten.overheid.nl/BWBR0007632#Artikel47
      [ref5]: https://wetten.overheid.nl/BWBR0007632#Artikel48
      [ref6]: https://wetten.overheid.nl/BWBR0001854#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel76c
    references:
      - id: ref1
        bwb_id: BWBR0007632
        artikel: '44'
      - id: ref2
        bwb_id: BWBR0007632
        artikel: '45'
      - id: ref3
        bwb_id: BWBR0007632
        artikel: '46'
      - id: ref4
        bwb_id: BWBR0007632
        artikel: '47'
      - id: ref5
        bwb_id: BWBR0007632
        artikel: '48'
      - id: ref6
        bwb_id: BWBR0001854
        artikel: 33a
  - number: '77.1'
    text: De rechtbanken vonnissen in eerste aanleg over bij de belastingwet strafbaar gestelde feiten.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel77
  - number: '77.2'
    text: 'De vonnissen zijn aan hoger beroep onderworpen, voor zover zij zijn gewezen:'
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel77
  - number: 77.2.a
    text: ter zake van misdrijven;
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel77
  - number: 77.2.b
    text: |-
      ter zake van overtredingen ten aanzien van degene die op het tijdstip waarop de vervolging tegen hem is
      aangevangen, de leeftijd van achttien jaren nog niet had bereikt.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel77
  - number: '77.3'
    text: |-
      Tegen andere vonnissen kan de verdachte hoger beroep instellen, indien hechtenis als hoofdstraf is opgelegd, een
      geldboete van € 113 of meer is opgelegd dan wel een verbeurdverklaring is uitgesproken; het openbaar ministerie kan
      hoger beroep instellen, indien het gelijke straffen heeft gevorderd.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel77
  - number: '78'
    text: |-
      Ten aanzien van bij de belastingwet strafbaar gestelde feiten worden lichamen voor de toepassing van
      [artikel 2 van het Wetboek van Strafvordering][ref1] geacht te wonen, waar zij gevestigd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel2
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '2'
  - number: '80.1'
    text: |-
      Met het opsporen van bij de belastingwet strafbaar gestelde feiten zijn, behalve de in
      [artikel 141 van het Wetboek van Strafvordering][ref1] bedoelde personen, de ambtenaren van de rijksbelastingdienst
      belast.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '80.2'
    text: |-
      In afwijking van de [artikelen 155][ref1], [156][ref2] en [157 van het Wetboek van Strafvordering][ref3] worden
      alle processen-verbaal betreffende bij de belastingwet strafbaar gestelde feiten ingezonden bij het bestuur
      van ’s Rijks belastingen. Het bestuur doet de processen-verbaal betreffende strafbare feiten, ter zake waarvan
      inverzekeringstelling of voorlopige hechtenis is toegepast dan wel een woning tegen de wil van de bewoner is
      binnengetreden, met de inbeslaggenomen voorwerpen onverwijld toekomen aan de bevoegde officier van justitie.
      De overige processen-verbaal doet het bestuur, met de inbeslaggenomen voorwerpen, toekomen aan de officier van
      justitie, indien het een vervolging wenselijk acht.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel155
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel156
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel157
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '155'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '156'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '157'
  - number: '80.3'
    text: |-
      De officier van justitie is bevoegd, de zaak ter afdoening weder in handen van het bestuur van ’s Rijks belastingen
      te stellen, hetwelk daarmede alsdan kan handelen overeenkomstig [artikel 76][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel76
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '76'
        hoofdstuk: IX
        afdeling: '2'
  - number: '80.4'
    text: |-
      Het bepaalde in [artikel 148, tweede lid, van het Wetboek van Strafvordering][ref1] vindt geen toepassing in
      zaken, waarin het bestuur van ’s Rijks belastingen het proces-verbaal niet aan de officier van justitie heeft doen
      toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel148
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '148'
  - number: '81'
    text: |-
      De ambtenaren belast met het opsporen van bij de belastingwet strafbaar gestelde feiten, zijn te allen tijde
      bevoegd tot inbeslagneming van de ingevolge het [Wetboek van Strafvordering][ref1] voor inbeslagneming vatbare
      voorwerpen. Zij kunnen daartoe hun uitlevering vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: '82.1'
    text: |-
      In zaken waarin het bestuur van ’s Rijks belastingen het proces-verbaal niet ingevolge het bepaalde in
      [artikel 80, tweede lid][ref1], aan de officier van justitie heeft doen toekomen, geldt ten aanzien van het bestuur
      van ’s Rijks belastingen hetgeen in [artikel 116 van het Wetboek van Strafvordering][ref2] ten aanzien van het
      openbaar ministerie is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel116
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '80'
        hoofdstuk: IX
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '116'
  - number: '82.2'
    text: |-
      In de zaken, bedoeld in het vorige lid, wordt bij de toepassing van de [artikelen 552a][ref1] en
      [552ab van het Wetboek van Strafvordering][ref2], alvorens het gerecht ingevolge [artikel 552a, vijfde lid][ref3],
      onderscheidenlijk [artikel 552ab, vierde lid][ref4], van dat artikel een beschikking neemt, ook het bestuur
      van ’s Rijks belastingen in de gelegenheid gesteld te worden gehoord en is, in afwijking van het bepaalde in
      [artikel 552d van dat wetboek][ref5], niet het openbaar ministerie doch het bestuur van ’s Rijks belastingen
      bevoegd tot het instellen van beroep in cassatie. De griffier van het gerecht hetwelk in die zaken ingevolge
      [artikel 552a, vijfde lid][ref6], of [artikel 552ab, vierde lid, van dat wetboek][ref7] een beschikking neemt,
      deelt deze onverwijld mede aan het bestuur van ’s Rijks belastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel552a
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel552ab
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel552a
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel552ab
      [ref5]: https://wetten.overheid.nl/BWBR0001903#Artikel552d
      [ref6]: https://wetten.overheid.nl/BWBR0001903#Artikel552a
      [ref7]: https://wetten.overheid.nl/BWBR0001903#Artikel552ab
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 552a
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 552ab
      - id: ref3
        bwb_id: BWBR0001903
        artikel: 552a
      - id: ref4
        bwb_id: BWBR0001903
        artikel: 552ab
      - id: ref5
        bwb_id: BWBR0001903
        artikel: 552d
      - id: ref6
        bwb_id: BWBR0001903
        artikel: 552a
      - id: ref7
        bwb_id: BWBR0001903
        artikel: 552ab
  - number: '83'
    text: |-
      Bij het opsporen van een bij de belastingwet strafbaar gesteld feit hebben de in [artikel 80, eerste lid][ref1],
      bedoelde ambtenaren toegang tot elke plaats, voor zover dat redelijkerwijs voor de vervulling van hun taak nodig
      is. Zij zijn bevoegd zich door bepaalde door hen aangewezen personen te doen vergezellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel80
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '80'
        hoofdstuk: IX
        afdeling: '3'
  - number: '84'
    text: |-
      Ten dienste van de vervolging en berechting van bij de belastingwet strafbaar gestelde feiten kan Onze Minister, in
      overeenstemming met Onze Minister van Justitie, ambtenaren van de rijksbelastingdienst aanwijzen, die het contact
      onderhouden met het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel84
  - number: '85'
    text: |-
      De griffiers verstrekken aan het bestuur van ’s Rijks belastingen desgevraagd kosteloos afschrift of uittreksel van
      arresten of vonnissen, in belastingstrafzaken gewezen.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel85
  - number: '86'
    text: |-
      Met betrekking tot gerechtelijke mededelingen inzake bij de belastingwet strafbaar gestelde feiten hebben de
      ambtenaren van de rijksbelastingdienst de bevoegdheden bij het [Wetboek van Strafvordering][ref1] aan ambtenaren,
      aangesteld voor de uitvoering van de politietaak, toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: '87'
    text: |-
      Ten aanzien van de tenuitvoerlegging van rechterlijke beslissingen inzake bij de belastingwet strafbaar gestelde
      feiten hebben de ambtenaren van de rijksbelastingdienst de bevoegdheid van deurwaarders.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel87
  - number: '88.1'
    text: 'De ambtenaren van de rijksbelastingdienst zijn tevens belast met de opsporing van:'
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel88
  - number: 88.1.a
    text: |-
      de misdrijven omschreven in de [artikelen 179 tot en met 182 van het Wetboek van Strafrecht][ref1], welke jegens
      hen zijn begaan;


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel179
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '179'
  - number: 88.1.b
    text: |-
      het misdrijf omschreven in [artikel 184 van het Wetboek van Strafrecht][ref1], indien het bevel of de vordering is
      gedaan krachtens of de handeling is ondernomen ter uitvoering van de belastingwet.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '184'
  - number: '88.2'
    text: |-
      De [artikelen 152][ref1], [153][ref2], [157][ref3] en [159 van het Wetboek van Strafvordering][ref4] zijn te dezen
      op de ambtenaren van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel152
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel153
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel157
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel159
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '152'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '153'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '157'
      - id: ref4
        bwb_id: BWBR0001903
        artikel: '159'
  - number: 88a.1
    text: |-
      Met betrekking tot bij wettelijke bepalingen in de zin van de [Douanewet][ref1] strafbaar gestelde feiten en
      met uitbreiding van [artikel 53 van het Wetboek van Strafvordering][ref2] is de inspecteur bevoegd een van
      misdrijf verdachte persoon die is aangehouden in of op een entrepot, ruimte voor tijdelijke opslag, plaats,
      spoorwegemplacement, haven, luchthaven, terrein, gebouw, erf of vervoermiddel, een en ander als bedoeld in
      de [artikelen 12][ref3] en [14 van de Douanewet][ref4], of bij het juist hebben verlaten van een locatie of
      vervoermiddel als in die artikelen bedoeld, na aanhouding naar een plaats voor verhoor te geleiden dan wel diens
      aanhouding of voorgeleiding te bevelen.


      [ref1]: https://wetten.overheid.nl/BWBR0007632
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel53
      [ref3]: https://wetten.overheid.nl/BWBR0007632#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0007632#Artikel14
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel88a
    references:
      - id: ref1
        bwb_id: BWBR0007632
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '53'
      - id: ref3
        bwb_id: BWBR0007632
        artikel: '12'
      - id: ref4
        bwb_id: BWBR0007632
        artikel: '14'
  - number: 88a.2
    text: |-
      Indien de inspecteur die de verdachte heeft aangehouden of voor wie de verdachte wordt geleid de
      inverzekeringstelling of de bewaring van de verdachte nodig oordeelt, doet hij de verdachte voorgeleiden voor de
      officier van justitie of voor een hulpofficier van justitie.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel88a
  - number: 88a.3
    text: |-
      Indien de verdachte niet voor de officier of voor een hulpofficier van justitie wordt voorgeleid, wordt de
      verdachte, na te zijn verhoord, dadelijk in vrijheid gesteld.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel88a
  - number: 88a.4
    text: |-
      De verdachte mag niet langer dan zes uren voor verhoor worden opgehouden, met dien verstande dat de tijd tussen
      middernacht en negen uur voormiddags niet wordt meegerekend.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel88a
  - number: 88b.1
    text: |-
      Goederen die in beslag zijn genomen ter zake van het begaan van strafbare feiten als bedoeld in de wettelijke
      bepalingen in de zin van de [Douanewet][ref1], kunnen, voor zover de eisen van het onderzoek of het algemeen belang
      bij hun vernietiging of onbruikbaarmaking zich niet daartegen verzetten, zo nodig na monsterneming, overeenkomstig
      bij ministeriële regeling te stellen regels, tegen zekerheidstelling worden vrijgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0007632
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel88b
    references:
      - id: ref1
        bwb_id: BWBR0007632
  - number: 88b.2
    text: |-
      Het bepaalde in het eerste lid vindt geen toepassing ten aanzien van goederen, in beslag genomen in zaken waarin
      het bestuur van ’s Rijks belastingen het proces-verbaal ingevolge het bepaalde in [artikel 80, tweede lid][ref1],
      aan de officier van justitie heeft doen toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel80
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel88b
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '80'
        hoofdstuk: IX
        afdeling: '3'
  - number: 88b.3
    text: |-
      De overeenkomstig het eerste lid gestelde zekerheid treedt voor de toepassing van bepalingen betreffende
      verbeurdverklaring en inbeslagneming, alsmede voor de uitoefening van het recht van verhaal, in de plaats van de in
      beslag genomen goederen.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel88b
  - number: 88c.1
    text: |-
      Van goederen die ter zake van het begaan van strafbare feiten als bedoeld in de wettelijke bepalingen in de zin
      van de [Douanewet][ref1], in beslag zijn genomen van onbekende personen wordt volgens bij ministeriële regeling te
      stellen regels in het openbaar mededeling gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007632
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel88c
    references:
      - id: ref1
        bwb_id: BWBR0007632
  - number: 88c.2
    text: |-
      Indien niet binnen een jaar na dagtekening van de in het eerste lid bedoelde mededeling op voldoende wijze blijkt
      wie de ten aanzien van de in beslag genomen goederen bevonden overtreding van de in dat lid bedoelde wettelijke
      bepalingen heeft begaan en evenmin de belanghebbende bij de goederen aannemelijk maakt dat zij ten onrechte in
      beslag zijn genomen, vervallen de goederen aan de staat.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel88c
  - number: '90'
    text: |-
      De krachtens de wet van 14 Juni 1930 (*Stb.* 244), houdende bepalingen tot voorkoming van dubbele belasting,
      uitgevaardigde voorschriften worden geacht krachtens [Hoofdstuk VII][ref1] te zijn uitgevaardigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukVII
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: VII
  - number: '91'
    text: |-
      De wet van 13 Januari 1922 (*Stb.* 9), betreffende het opleggen van voorlopige aanslagen in de directe belastingen,
      wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel91
  - number: '92'
    text: |-
      De wet van 29 April 1925 (*Stb.* 171), tot bevordering van de richtige heffing der directe belastingen, wordt
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel92
  - number: '93'
    text: |-
      De wet van 28 Juni 1926 (*Stb.* 227), houdende bepalingen met betrekking tot het overschrijden van in
      belastingwetten gestelde termijnen, wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel93
  - number: '94'
    text: |-
      De wet van 23 April 1952 (*Stb.* 191), houdende bepalingen inzake vervanging van het fiscale noodrecht, wordt
      ingetrokken, behoudens ten aanzien van begane strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel94
  - number: '95.1'
    text: |-
      De bepalingen van deze wet treden in werking op een door Ons te bepalen tijdstip, dat verschillend kan zijn
      zowel voor de onderscheidene bepalingen van de wet als voor de onderscheidene belastingen en tijdvakken waarin of
      waarover deze worden geheven.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel95
  - number: '95.2'
    text: |-
      Voor zoverre de bepalingen van deze wet ten aanzien van enige belasting in werking zijn getreden, blijven,
      behoudens ten aanzien van begane strafbare feiten, de bepalingen in andere belastingwetten betreffende de
      onderwerpen, geregeld in eerstbedoelde bepalingen, ten aanzien van die belasting in zoverre buiten toepassing.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel95
  - number: '96'
    text: Deze wet kan worden aangehaald als "Algemene wet inzake rijksbelastingen".
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel96
