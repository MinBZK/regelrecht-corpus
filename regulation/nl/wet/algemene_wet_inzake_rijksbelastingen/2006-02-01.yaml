      - id: ref6
        bwb_id: BWBR0007168
      - id: ref7
        bwb_id: BWBR0007632
  - number: 27b.1.c
    text: € 281 indien anders dan door een natuurlijke persoon beroep is ingesteld.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27b
  - number: 27b.2
    text: |-
      De in het eerste lid genoemde bedragen kunnen bij algemene maatregel van bestuur worden gewijzigd voor zover het
      prijsindexcijfer van de gezinsconsumptie daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27b
  - number: 27c
    text: |-
      [Artikel 8:62 van de Algemene wet bestuursrecht][ref1] is slechts van toepassing voorzover het beroep is gericht
      tegen een uitspraak waarbij een boete geheel of gedeeltelijk is gehandhaafd. In andere gevallen heeft het onderzoek
      ter zitting plaats met gesloten deuren, maar kan de rechtbank bepalen dat het onderzoek openbaar is, voorzover de
      belangen van partijen daardoor niet worden geschaad.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27c
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 27d
    text: |-
      In afwijking van [artikel 8:67, eerste lid, van de Algemene wet bestuursrecht][ref1] bedraagt de termijn voor
      verdaging van de mondelinge uitspraak ten hoogste twee weken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27d
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 27e
    text: 'Indien:'
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27e
  - number: 27e.a
    text: de vereiste aangifte niet is gedaan;
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27e
  - number: 27e.b
    text: |-
      niet volledig is voldaan aan de verplichtingen ingevolge de [artikelen 41, tweede lid][ref1], [47][ref2],
      [47a][ref3], [49][ref4], [52][ref5] , alsmede aan de verplichtingen ingevolge de [artikelen 52a][ref6] en
      [53, eerste, tweede en derde lid][ref7], voorzover het verplichtingen van administratieplichtigen betreft ten
      behoeve van de heffing van de belasting waarvan de inhouding aan hen is opgedragen;


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel47a
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel49
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel52
      [ref6]: https://wetten.overheid.nl/BWBR0002320#Artikel52a
      [ref7]: https://wetten.overheid.nl/BWBR0002320#Artikel53
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel27e
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '41'
        hoofdstuk: VIII
        afdeling: '1'
      - id: ref2
