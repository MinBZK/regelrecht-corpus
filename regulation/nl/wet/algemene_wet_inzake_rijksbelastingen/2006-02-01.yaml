preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het ter vereenvoudiging van de wetgeving inzake rijksbelastingen
    wenselijk is, regelen welke aan een aantal belastingen gemeen zijn, in een algemene wet samen te vatten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      De bepalingen van deze wet gelden bij de heffing van rijksbelastingen, alsmede bij de heffing van heffingsrente,
      revisierente, compenserende rente, kosten van ambtelijke werkzaamheden en bestuurlijke boeten welke ingevolge de
      belastingwet kunnen worden vastgesteld of opgelegd.
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel1
  - number: '1.2'
    text: |-
      Onder rijksbelastingen worden verstaan belastingen welke van rijkswege door de rijksbelastingdienst worden geheven.
      Voor de toepassing van deze wet worden onder rijksbelastingen tevens verstaan rechten bij invoer en rechten bij
      uitvoer als bedoeld in [artikel 1, tweede lid, onderscheidenlijk derde lid, van de Douanewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007632#Artikel1
    url: https://wetten.overheid.nl/BWBR0002320/2006-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007632
        artikel: '1'
  - number: '1.3'
    text: |-
      Ten aanzien van de rechten bij invoer en de rechten bij uitvoer, alsmede ten aanzien van de compenserende
      rente, de kosten van ambtelijke werkzaamheden en de met toepassing van [hoofdstuk 5 van de Douanewet][ref1]
      opgelegde bestuurlijke boeten, blijven [hoofdstuk VIII, afdelingen 2][ref2] en [5][ref3], en
      [hoofdstuk IX, afdeling 1][ref4], buiten toepassing. In afwijking van de eerste volzin zijn de
      [artikelen 62][ref5], [65][ref6] en [66][ref7] van toepassing met betrekking tot de boeten, bedoeld in
      [hoofdstuk 5 van de Douanewet][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0007632#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0002320#HoofdstukVIII
      [ref3]: https://wetten.overheid.nl/BWBR0002320#HoofdstukVIII
