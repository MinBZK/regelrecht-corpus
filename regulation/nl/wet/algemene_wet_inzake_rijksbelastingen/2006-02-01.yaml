  - number: 68.1.c
    text: |-
      de [artikelen 28, aanhef en onderdelen a, b, d en e][ref1], [29][ref2], [35d][ref3],
      [35e, eerste lid, aanhef en onderdelen a, b, d, e en f][ref4], [35k][ref5], [35l][ref6] en
