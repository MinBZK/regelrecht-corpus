---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_vleeskeuring
regulatory_layer: WET
publication_date: '2012-12-20'
valid_from: '2012-10-01'
bwb_id: BWBR0019274
url: https://wetten.overheid.nl/BWBR0019274/2012-10-01
preamble:
  text: |-
    Gelet op verordening (EG) nr. 852/2004 van het Europees Parlement en de Raad van de Europese Unie van 29 april 2004
    inzake levensmiddelenhygiëne (PbEU L 139), verordening (EG) nr. 853/2004 van het Europees Parlement en de Raad van
    de Europese Unie van 29 april 2004 houdende vaststelling van specifieke hygiënevoorschriften voor levensmiddelen
    van dierlijke oorsprong (PbEU L 139), verordening (EG) nr. 854/2004 van het Europees Parlement en de Raad van
    de Europese Unie van 29 april 2004 houdende vaststelling van specifieke voorschriften voor de organisatie van
    de officiële controles van voor menselijke consumptie bestemde producten van dierlijke oorsprong (PbEU L 139),
    verordening (EG) nr. 882/2004 van het Europees Parlement en de Raad van de Europese Unie van 29 april 2004 inzake
    officiële controles op de naleving van de wetgeving inzake diervoeders en levensmiddelen en de voorschriften inzake
    diergezondheid en dierenwelzijn (PbEU L 165) en verordening (EG) nr. 999/2001 van het Europees Parlement en de
    Raad van de Europese Unie van 22 mei 2001 houdende vaststelling van voorschriften inzake preventie, bestrijding en
    uitroeiing van bepaalde overdraagbare spongiforme encefalopathieën (PbEG L 147);

    Gelet op artikel 19 van de Landbouwwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel1
  - number: 1.a
    text: |-
      [verordening (EG) nr. 999/2001](32001R0999): [verordening (EG) nr. 999/2001](32001R0999) van het Europees
      Parlement en de Raad van de Europese Unie van 22 mei 2001 houdende vaststelling van voorschriften inzake preventie,
      bestrijding en uitroeiing van bepaalde overdraagbare spongiforme encefalopathieën (PbEG L 147);
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel1
  - number: 1.b
    text: |-
      verordening (EG) nr. 178/2002: verordening (EG) nr. 178/2002 van het Europees Parlement en de Raad van
      de Europese Unie van 28 januari 2002 tot vaststelling van de algemene beginselen en voorschriften van de
      levensmiddelenwetgeving, tot oprichting van een Europese Autoriteit voor voedselveiligheid en tot vaststelling van
      procedures voor voedselveiligheidsaangelegenheden (PbEU L 31);
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel1
  - number: 1.c
    text: |-
      [verordening (EG) nr. 852/2004](32004R0852): [verordening (EG) nr. 852/2004](32004R0852) van het Europees Parlement
      en de Raad van de Europese Unie van 29 april 2004 inzake levensmiddelenhygiëne (PbEU L 139);
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel1
  - number: 1.d
    text: |-
      [verordening (EG) nr. 853/2004](32004R0853): [verordening (EG) nr. 853/2004](32004R0853) van het Europees Parlement
      en de Raad van de Europese Unie van 29 april 2004 houdende vaststelling van specifieke hygiënevoorschriften voor
      levensmiddelen van dierlijke oorsprong (PbEU L 139);
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel1
  - number: 1.e
    text: |-
      [verordening (EG) nr. 854/2004](32004R0854): [verordening (EG) nr. 854/2004](32004R0854) van het Europees Parlement
      en de Raad van de Europese Unie van 29 april 2004 houdende vaststelling van specifieke voorschriften voor de
      organisatie van de officiële controles van voor menselijke consumptie bestemde producten van dierlijke oorsprong
      (PbEU L 139);
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel1
  - number: 1.f
    text: |-
      [verordening (EG) nr. 882/2004](32004R0882): [verordening (EG) nr. 882/2004](32004R0882) van het Europees Parlement
      en de Raad van de Europese Unie van 29 april 2004 inzake officiële controles op de naleving van de wetgeving inzake
      diervoeders en levensmiddelen en de voorschriften inzake diergezondheid en dierenwelzijn (PbEU L 165);
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel1
  - number: 1.g
    text: |-
      verordening (EG) nr. 2075/2005: verordening (EG) nr. 2075/2005 van de Commissie van 5 december 2005 tot
      vaststelling van specifieke voorschriften voor de officiële controles op Trichinella in vlees (PbEU L 338);
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel1
  - number: 1.h
    text: 'minister: Minister van Landbouw, Natuur en Voedselkwaliteit;'
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel1
  - number: 1.i
    text: |-
      hygiënecode: een nationale gids voor goede praktijken inzake hygiëne en de toepassing van HACCP-beginselen als
      bedoeld in artikel 7 van [verordening (EG) 852/2004](32004R0852);
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel1
  - number: 1.j
    text: |-
      communautaire uitvoeringsmaatregel: verordening, richtlijn of beschikking als bedoeld in artikel 249 van het
      Verdrag tot oprichting van de Europese Gemeenschap, vastgesteld krachtens [verordening (EG) nr. 852/2004]
      (32004R0852), [verordening (EG) nr. 853/2004](32004R0853), [verordening (EG) nr. 854/2004](32004R0854),
      [verordening (EG) nr. 999/2001](32001R0999) of [verordening (EG) nr. 882/2004](32004R0882).
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel1
  - number: '2'
    text: |-
      Deze regeling is van toepassing op exploitanten van levensmiddelenbedrijven als bedoeld in sectie I tot en met
      IV van bijlage III bij verordening (EG) nr. 853/2004, en op de levering van vlees, bedoeld artikel 1, derde lid,
      onderdelen d en e, van die verordening en de productie van dat geleverde vlees.
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel2
  - number: '3.1'
    text: |-
      Het is verboden in strijd te handelen met de artikelen 3 en 4, eerste, tweede en derde lid, 5, eerste lid,
      tweede lid, laatste alinea, en vierde lid, 6, tweede lid, laatste alinea, en derde lid, van [verordening (EG) nr.
      852/2004](32004R0852), en krachtens artikel 4, vierde lid, 5, vijfde lid, 6, derde lid, onderdeel c, dan wel 13,
      eerste en tweede lid, van die verordening vastgestelde communautaire uitvoeringsmaatregelen.
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel3
  - number: '3.2'
    text: |-
      Het is verboden te handelen in strijd met de artikelen 3 en 4, eerste tot en met vierde lid, 5, en 7, eerste lid,
      van [verordening (EG) nr. 853/2004](32004R0853), en krachtens de artikelen 3, tweede lid, 9 dan wel 10, eerste en
      tweede lid, van die verordening vastgestelde communautaire uitvoeringsmaatregelen.
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel3
  - number: '3.3'
    text: |-
      Het is verboden in strijd te handelen met artikel 8, derde lid, en onderdelen 4.1, 7, 8.1 en 11.3 van bijlage V van
      verordening (EG) nr. 999/2001.
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel3
  - number: '3.4'
    text: |-
      Het is verboden vers vlees dat op grond van artikel 5, derde lid, onderdeel e, van [verordening (EG) nr. 854/2004]
      (32004R0854) ongeschikt is verklaard voor menselijke consumptie, in de handel te brengen.
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel3
  - number: '3.5'
    text: |-
      Het is verboden in strijd te handelen met de artikelen 14, 17, eerste lid, 18 en 19 van verordening (EG) nr.
      178/2002.
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel3
  - number: '3.6'
    text: |-
      Het is verboden in strijd te handelen met de krachtens de artikelen 18 en 19 van verordening (EG) nr. 854/2004
      vastgestelde communautaire uitvoeringsmaatregelen.
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel3
  - number: '4.1'
    text: 'De minister is de bevoegde autoriteit, bedoeld in:'
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel4
  - number: 4.1.a
    text: |-
      [verordening (EG) nr. 852/2004](32004R0852), en krachtens de artikelen 4, vierde lid, 5, vijfde lid, 6, derde lid,
      onderdeel c, en 13, eerste en tweede lid, van die verordening vastgestelde communautaire uitvoeringsmaatregelen;
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel4
  - number: 4.1.b
    text: |-
      [verordening (EG) nr. 853/2004](32004R0853), en krachtens de artikelen 3, tweede lid, 9 en 10, eerste en tweede
      lid, van die verordening vastgestelde communautaire uitvoeringsmaatregelen;
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel4
  - number: 4.1.c
    text: |-
      verordening (EG) nr. 854/2004, en krachtens de artikelen 16 en 18, onderdelen 1 tot en met 12, van die verordening
      vastgestelde communautaire uitvoeringsmaatregelen;
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel4
  - number: 4.1.d
    text: verordening (EG) nr. 882/2004, en krachtens die verordening vastgestelde communautaire uitvoeringsmaatregelen;
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel4
  - number: 4.1.e
    text: onderdelen 4.3, 8.1 en 9 van bijlage V bij verordening (EG) nr. 999/2001;
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel4
  - number: 4.1.f
    text: de artikelen 14, achtste lid, 18, tweede en derde lid, en 19 van verordening (EG) nr. 178/2002.
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel4
  - number: '4.2'
    text: |-
      De minister is bevoegd de besluiten te nemen waartoe [verordening (EG) nr. 854/2004](32004R0854) de officiële
      dierenarts opdraagt.
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel4
  - number: '4.3'
    text: |-
      In afwijking van het eerste lid is ingeval een taak wordt opgedragen die niet bestaat in het nemen van een besluit,
      de bevoegde autoriteit de Voedsel en Waren Autoriteit.
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel4
  - number: '4.4'
    text: De officiële dierenarts is een dierenarts, verbonden aan de Voedsel en Waren Autoriteit.
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel4
  - number: '4.5'
    text: |-
      Het is toegestaan dat personeel van een slachthuis bijstand verleent bij de officiële controles, bedoeld in artikel
      5, zesde lid, onderdeel a, van [verordening (EG) nr. 854/2004](32004R0854).
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel4
  - number: '5'
    text: |-
      Een communautaire uitvoeringsmaatregel, of een wijziging daarvan, treedt voor de toepassing van deze regeling in
      werking met ingang van de dag waarop daaraan uiterlijk uitvoering moet zijn gegeven, of bij gebreke daarvan, de dag
      waarop de maatregel is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel5
  - number: '6'
    text: |-
      Een aanvraag tot het verlenen van een erkenning als bedoeld in artikel 4 van [verordening (EG) nr. 853/2004]
      (32004R0853) en onderdelen 4.3, 8.1 en 9 van bijlage V bij verordening (EG) nr. 999/2001 wordt ingediend bij de
      Voedsel en Waren Autoriteit.
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel6
  - number: '7.1'
    text: |-
      De minister erkent uitsnijderijen als bedoeld in onderdelen 4.3 en 9 van bijlage V bij verordening (EG) nr.
      999/2001.
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel7
  - number: '7.2'
    text: |-
      Een aanvraag tot het verlenen van een erkenning als bedoeld in het eerste lid wordt ingediend bij de Voedsel en
      Waren Autoriteit.
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel7
  - number: '8.1'
    text: De minister keurt een hygiënecode goed.
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel8
  - number: '8.2'
    text: Een aanvraag om een hygiënecode goed te keuren wordt ingediend bij de Voedsel en Waren Autoriteit.
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel8
  - number: '8.3'
    text: |-
      De minister trekt de goedkeuring van een hygiënecode in indien niet meer wordt voldaan aan de voorwaarden van
      artikel 8 van [verordening (EG) nr. 852/2004](32004R0852).
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel8
  - number: 8a.1
    text: |-
      Indien voor de toepassing van bijlage III, sectie I, hoofdstuk VII, punt 3, van verordening (EG) nr. 853/2004
      gebruik wordt gemaakt van een goedgekeurd vervoermiddel, wordt de keuring van het vervoermiddel verricht door de
      Dienst Wegverkeer, bedoeld in [artikel 4a van de Wegenverkeerswet 1994][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4a
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4a
  - number: 8a.2
    text: |-
      Ter vergoeding van de kosten voor de keuring als bedoeld in het eerste lid, worden bij de aanvrager van een
      keuring bedragen in rekening gebracht waarvan de hoogte en de wijze van betalen worden vastgesteld door de Dienst
      Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel8a
  - number: '9'
    text: |-
      De in artikel 1, derde lid, onderdeel d, van [verordening (EG) nr. 853/2004](32004R0853), bedoelde rechtstreekse
      levering, evenals de productie van het vlees, geschiedt op zindelijke wijze en zodanig dat:
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel9
  - number: 9.1°
    text: |-
      geen verontreiniging plaats kan hebben met zodanige hoeveelheden van stoffen dat zij uit het oogpunt van
      gezondheid van de mens schadelijk kunnen zijn, of met organismen of virussen die onder redelijkerwijs te verwachten
      omstandigheden schadelijk kunnen zijn of worden, en
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel9
  - number: 9.2°
    text: |-
      onder 1° bedoelde organismen zich niet zodanig kunnen vermeerderen of zodanige toxinen kunnen vormen dat zij uit
      het oogpunt van de gezondheid van de mens schadelijk kunnen zijn of worden.
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel9
  - number: 9a.1
    text: |-
      Bij het rechtstreeks leveren, bedoeld in artikel 1, derde lid, onderdeel e, van verordening (EG) nr. 853/2004 van
      grof vrij wild wordt voldaan aan bijlage III, sectie IV, hoofdstuk II, onderdelen 1, 2, 4 en 5, van verordening
      (EG) nr. 853/2004.
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel9a
  - number: 9a.2
    text: |-
      Bij het rechtstreeks leveren, bedoeld in artikel 1, derde lid, onderdeel e, van verordening (EG) nr. 853/2004 van
      klein vrij wild wordt voldaan aan bijlage III, sectie IV, hoofdstuk III, onderdelen 1, 2 en 4, van verordening (EG)
      nr. 853/2004.
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel9a
  - number: 9a.3
    text: |-
      Het onderzoek, bedoeld in bijlage III, sectie IV, hoofdstuk II, onderdeel 2, en bijlage III, sectie IV, hoofdstuk
      III, onderdeel 1, van verordening (EG) nr. 853/2004, wordt uitgevoerd door een gekwalificeerd persoon als bedoeld
      in bijlage III, sectie IV, hoofdstuk I, van verordening (EG) nr. 853/2004.
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel9a
  - number: 9b.1
    text: |-
      Indien het de rechtstreekse levering van wilde zwijnen betreft, neemt de gekwalificeerde persoon tijdens het
      onderzoek, bedoeld in [artikel 9a, derde lid][ref1], een monster als bedoeld in artikel 2, derde lid, derde alinea,
      van verordening (EG) nr. 2075/2005.


      [ref1]: https://wetten.overheid.nl/BWBR0019274#Artikel9a
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0019274
        artikel: 9a
        paragraaf: '2'
  - number: 9b.2
    text: |-
      De monstername en het onderzoek van het monster geschieden overeenkomstig bijlage I, hoofdstuk I, onderdeel 1,
      onderdeel 2, onder c, tweede alinea en onderdeel 3, onder I en II, en bijlage III, aanhef en onderdeel a, d en f,
      van verordening (EG) nr. 2075/2005.
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel9b
  - number: 9b.3
    text: |-
      De gekwalificeerde persoon brengt een administratieve koppeling aan tussen de karkassen van de wilde zwijnen en
      het monster.
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel9b
  - number: 9b.4
    text: |-
      De karkassen van wilde zwijnen en delen daarvan mogen slechts in de handel worden gebracht indien de uitslag van
      het onderzoek, bedoeld in het tweede lid, negatief is gebleken. De karkassen van wilde zwijnen of delen daarvan
      worden bij levering vergezeld van een kopie van de uitslag, dan wel een gelijkwaardig elektronisch bewijs waaruit
      de uitslag van het onderzoek blijkt.
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel9b
  - number: 9b.5
    text: |-
      Indien de uitslag van het onderzoek, bedoeld in het tweede lid, positief is gebleken, zijn het karkas van het wilde
      zwijn en delen daarvan ongeschikt voor consumptie.
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel9b
  - number: 9b.6
    text: |-
      De uitslag van het onderzoek, bedoeld in het tweede lid, wordt tenminste drie jaar bewaard door de aanbieder van
      het monster.
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel9b
  - number: '10.1'
    text: |-
      De exploitant van een levensmiddelenbedrijf kan, ingeval hij zich met een beslissing met betrekking tot het vlees,
      afkomstig van als landbouwhuisdier gehouden hoefdieren, als bedoeld in artikel 5, derde lid, onderdeel e, van
      [verordening (EG) nr. 854/2004](32004R0854) niet kan verenigen, herkeuring vorderen op kosten van ongelijk.
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel10
  - number: '10.2'
    text: |-
      Bij de herkeuring wordt de beslissing met betrekking tot het vlees, afkomstig van als landbouwhuisdier gehouden
      hoefdieren, bedoeld in artikel 5, derde lid, onderdeel e, van [verordening (EG) nr. 854/2004](32004R0853),
      heroverwogen.
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel10
  - number: '10.3'
    text: |-
      Herkeuring wordt verricht door een andere officiële dierenarts dan diegene die de oorspronkelijke keuring heeft
      uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel10
  - number: '10.4'
    text: De minister neemt de beslissing op de aanvraag tot herkeuring.
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel10
  - number: '11.1'
    text: Een aanvraag tot herkeuring wordt ingediend bij de Voedsel en Waren Autoriteit.
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel11
  - number: '11.2'
    text: Herkeuring vindt eerst plaats nadat de daarvoor geldende retributies zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel11
  - number: '11.3'
    text: |-
      Herkeuring wordt zo spoedig mogelijk aangevraagd en uiterlijk binnen 12 uur na het beëindigen van de dag waarop
      de beslissing met betrekking tot het vlees, afkomstig van als landbouwhuisdier gehouden hoefdieren, bedoeld in
      artikel 5, derde lid, onderdeel e, van [verordening (EG) nr. 854/2004](32004R0853), werd genomen. Ingeval op deze
      dag een zondag, of een of meer erkende feestdagen volgt, dan wordt de aanvraag tot herkeuring binnen 12 uur na het
      beëindigen daarvan ingediend.
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel11
  - number: '11.4'
    text: |-
      In afwijking van het tweede lid wordt herkeuring van organen of delen van organen onmiddellijk na de beslissing met
      betrekking tot het vlees, afkomstig van als landbouwhuisdier gehouden hoefdieren, bedoeld in artikel 5, derde lid,
      onderdeel e, van [verordening (EG) nr. 854/2004](32004R0853), aangevraagd.
    url: https://wetten.overheid.nl/BWBR0019274/2012-10-01#Artikel11
  - number: '12'
    text: |-
      Erkenningen die ter uitvoering van bijlage XI bij [verordening (EG) nr. 999/2001](32001R0999) zijn verleend, op
      grond van [artikel 5 van de Regeling uitvoer vers vlees en vleesbereidingen 1985][ref1] worden geacht te zijn
      verleend op grond van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0003737#Artikel5
