    Gelet op artikel 71 van de Organisatie-wet sociale verzekeringen 1997;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009504/2002-04-07#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *Minister:* de Minister van Sociale Zaken en Werkgelegenheid;

      b. *de lasten met betrekking tot het Arbeidsongeschiktheidsfonds jonggehandicapten:*

      1°. de uitkeringen ingevolge de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref1];

      2°. de vakantie-uitkeringen, bedoeld in artikel 21, van de Wet arbeidsonge-schiktheidsvoorziening
      jonggehandicapten;

      3°. de ingevolge enige wet over de uitkeringen door het Uitvoeringsinstituut werknemersverzekeringen verschuldigde
      premies, die niet op deze uitkeringen in mindering kunnen worden gebracht;

      4°. het op grond van [artikel 50, vierde lid, van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref2],
      aan ’s Rijks kas af te dragen bedrag;

      5°. de subsidies, bedoeld in artikel 67 van de Wet arbeidsongeschiktheids-voorziening jonggehandicapten;

      6°. de uitvoeringskosten van de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0008657
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel50
      [ref3]: https://wetten.overheid.nl/BWBR0008657
