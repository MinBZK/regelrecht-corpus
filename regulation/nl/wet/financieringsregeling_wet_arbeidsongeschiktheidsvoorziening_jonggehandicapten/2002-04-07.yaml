  - number: '7'
    text: |-
      1 De Minister stelt jaarlijks vóór 31 oktober de omvang van de middelen tot dekking van de uitgaven ten laste van
      het Arbeidsongeschiktheidsfonds jonggehandicapten over het afgelopen kalenderjaar definitief vast.

      2 In het besluit bedoeld in het eerste lid worden afzonderlijk vermeld:

      a. de omvang van de middelen tot dekking van de betaalde uitkeringen en vakantie-uitkeringen;

      b. het op de middelen, bedoeld onder a, op grond van
      [artikel 50, vierde lid, van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref1], in mindering
      gebrachte bedrag;

      c. de omvang van de middelen tot dekking van de subsidies, bedoeld in
      [artikel 67 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref2];

      d. de omvang van de middelen tot dekking van de aan de uitvoering van de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref3] verbonden kosten.

      3 Indien de op grond van het eerste lid vastgestelde omvang van de middelen tot dekking van de uitgaven ten laste
      van het Arbeidsongeschiktheids-fonds jonggehandicapten afwijkt van de op basis van deze regeling betaalde bedragen
      vindt een definitieve afrekening met het Uitvoeringsinstituut werknemersverzekeringen ten gunste of ten laste van
      het Arbeidsongeschiktheidsfonds jonggehandicapten plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0008657
