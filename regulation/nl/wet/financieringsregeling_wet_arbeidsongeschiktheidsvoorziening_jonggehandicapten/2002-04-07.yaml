  - number: '8'
    text: |-
      1 In afwijking van [artikel 2][ref1] draagt de Minister van Sociale Zaken en Werkgelegenheid in het
      eerste kwartaal 1998 op aanvraag van het Uitvoeringsinstituut werknemersverzekeringen voorschotten af ten
      behoeve van de uitgaven met betrekking tot de maanden januari tot en met maart 1998 met betrekking tot de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref2].

      2 Verschillen tussen de in het eerste lid bedoelde voorschotten en de werkelijk benodigde financiële middelen
      worden uiterlijk in de maand mei 1998 verrekend.


      [ref1]: https://wetten.overheid.nl/BWBR0009504#Artikel2
