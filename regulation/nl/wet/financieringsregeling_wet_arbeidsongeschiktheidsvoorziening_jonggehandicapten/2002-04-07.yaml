  - number: '4'
    text: |-
      1 Voor de vijftiende dag van elke maand verstrekt het Uitvoeringsinstituut werknemersverzekeringen aan de Minister:

      a. een opgave van de werkelijke lasten van het Arbeidsongeschiktheidsfonds jonggehandicapten over de maand gelegen
      twee maanden voor de huidige maand;

      b. een opgave van de werkelijke lasten van het Arbeidsongeschiktheidsfonds jonggehandicapten, over perioden die
      vooraf gaan aan de onder a genoemde periode, voor zover daarop correcties plaats hebben gevonden, in elk geval
      uitgesplitst naar het jaar waarop de correcties betrekking hebben.

      2 In afwijking van het eerste lid verstrekt het Uitvoeringsinstituut werknemersverzekeringen voor de
      vijftiende dag van de maand mei 1998 aan de Minister een afzonderlijke opgave van de werkelijke lasten van het
      Arbeidsongeschiktheidsfonds jonggehandicapten over de maand januari en februari 1998.
    url: https://wetten.overheid.nl/BWBR0009504/2002-04-07#Artikel4
  - number: '5'
    text: |-
      De in artikel 4 genoemde opgaven worden zodanig gespecificeerd dat daarin afzonderlijk worden vermeld:

      a. de uitbetaalde uitkeringen;

      b. de uitbetaalde vakantie-uitkeringen;

      c. de op grond van enige wet over zowel de uitkeringen als de vakantie-uitkeringen door het Uitvoeringsinstituut
      werknemersverzekeringen verschuldigde premies die niet op deze uitkeringen in mindering worden gebracht;

      d. het op grond van artikel 50, vierde lid, van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten, aan 's
      Rijks kas af te dragen bedrag;

      e. de subsidies, bedoeld in artikel 67 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten.
    url: https://wetten.overheid.nl/BWBR0009504/2002-04-07#Artikel5
  - number: '6'
    text: |-
      Voor de vijftiende dag van elke maand verstrekt het Uitvoeringsinstituut werknemersverzekeringen aan de Minister:

      a. een opgave van de volumegegevens met betrekking tot de bedragen, bedoeld in [artikel 5, onder a en d][ref1] over
      de maand gelegen drie maanden voor de huidige maand;

      b. een opgave van de aantallen subsidies, bedoeld in [artikel 5, onder e][ref2], over de maand gelegen drie maanden
      voor de huidige maand;

      c. een opgave van de volumegegevens met betrekking tot de gespecificeerde uitkeringen als bedoeld in
      [artikel 5, onder a en d][ref3] over perioden die vooraf gaan aan de onder a genoemde periode, voor zover daarop
      correcties plaats hebben gevonden;

      d. een opgave van de aantallen subsidies, bedoeld in [artikel 5, onder e][ref4], over perioden die voorafgaan aan
      de onder b genoemde periode, voor zover daarop correcties plaats hebben gevonden.


