        artikel: '50'
  - number: '3'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen houdt bij de raming, zoals bedoeld in
      [artikel 2, eerste lid][ref1] en het bijgestelde bedrag van de benodigde financiële middelen, zoals bedoeld in
      [artikel 2, tweede lid][ref2], rekening met besluiten van de Minister van Sociale Zaken en Werkgelegenheid als
      bedoeld in [artikel 48, eerste en tweede lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3].

      2 De bedragen, voortvloeiend uit het eerste lid, met betrekking tot het lopende jaar, worden maandelijks
      zodanig berekend, dat niet meer dan één twaalfde gedeelte van het totale bedrag per jaar maal het aantal in
      het kalenderjaar aangevangen maanden ten laste komt van de begroting van de Minister van Sociale Zaken en
      Werkgelegenheid.


