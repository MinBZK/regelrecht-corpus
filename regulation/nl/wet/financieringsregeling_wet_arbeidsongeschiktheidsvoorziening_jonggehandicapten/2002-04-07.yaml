  - number: '2'
    text: |-
      1 Op de eerste werkdag van elke maand verstrekt het Uitvoeringsinstituut werknemersverzekeringen aan de Minister
      een viermaandsraming van de benodigde financiële middelen in die maand en de drie daaropvolgende maanden ten
      behoeve van de lasten van het Arbeidsongeschiktheidsfonds jonggehandicapten.

      Deze raming wordt zodanig gespecificeerd, dat daaruit afzonderlijk blijkt, welk bedrag op de
      totale lasten in mindering wordt gebracht in verband met de afdracht aan ’s Rijks kas op grond van
      [artikel 50, vierde lid, van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref1].

      2 Gedurende de maand kan het Uitvoeringsinstituut werknemersverzekeringen het geraamde bedrag aan financiële
      middelen bijstellen en overeenkomstig de Wet geïntegreerd middelenbeheer het geraamde bedrag aan financiële
      middelen en de bijstelling opnemen bij de Minister van Financiën ten laste van de begroting van de Minister van
      Sociale Zaken en Werkgelegenheid.

      3 In geval na afloop van een kalenderkwartaal blijkt dat de door het Uitvoeringsinstituut werknemersverzekeringen
      opgenomen financiële middelen meer dan 10 % afwijken van het totaal van de ramingen van de eerste maand van de
      in dat kwartaal ingediende viermaandsramingen, verstrekt het Uitvoeringsinstituut werknemersverzekeringen een
      onderbouwde verklaring van deze afwijking aan de Minister van Sociale Zaken en Werkgelegenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel50
    url: https://wetten.overheid.nl/BWBR0009504/2002-04-07#Artikel2
    references:
      - id: ref1
