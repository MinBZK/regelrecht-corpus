  - number: 1f
    text: |-
      1 Indien degene die zich heeft gemeld op grond van [artikel 1a, tweede lid, onderdeel b][ref1], niet meer voldoet
      aan het criterium, bedoeld in [artikel 1a, tweede lid, onderdeel a][ref2], doet hij hiervan zo spoedig mogelijk
      mededeling aan de minister.

      2 Indien niet wordt voldaan aan het bepaalde in het eerste lid, kan Onze Minister besluiten dat de vrijstelling,
      bedoeld in [artikel 1a, tweede lid][ref3], niet geldt gedurende een periode van maximaal 2 jaar, te rekenen vanaf
      de datum van dit besluit.


