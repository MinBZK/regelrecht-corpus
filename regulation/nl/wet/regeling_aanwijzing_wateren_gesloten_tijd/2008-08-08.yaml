  - number: 2b
    text: |-
      Deze regeling berust op [artikel 6, derde lid, van het Reglement voor de Binnenvisserij 1985](onbekend) en [artikel
      2, eerste lid, van de Regeling visserij-inspanning](onbekend).
    url: https://wetten.overheid.nl/BWBR0003800/2008-08-08#Artikel2b
