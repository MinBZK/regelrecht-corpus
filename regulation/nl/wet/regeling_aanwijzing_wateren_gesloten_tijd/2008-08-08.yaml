  - number: 1e
    text: |-
      Onze Minister bevestigt binnen drie weken de ontvangst van de melding, bedoeld in de
      [artikelen 1a, tweede lid, onderdeel b][ref1], en [1b, eerste lid, onderdeel b][ref2], en de ontvangst van de
      accountantsverklaring, bedoeld in [artikel 1a, tweede lid, onderdeel d][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003800#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0003800#Artikel1b
      [ref3]: https://wetten.overheid.nl/BWBR0003800#Artikel1a
