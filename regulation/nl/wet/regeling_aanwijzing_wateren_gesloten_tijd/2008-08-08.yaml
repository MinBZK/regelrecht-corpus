  - number: 1c
    text: |-
      Het verbod, bedoeld in [artikel 1a, eerste lid][ref1], is niet van toepassing op degene die de visrechthebbende
      of de houder van de schriftelijke toestemming, bedoeld in de [artikelen 1a, tweede lid][ref2], en
      [1b, eerste lid][ref3], behulpzaam is bij het vissen met een vistuig, dat niet door één persoon kan worden bediend.


      [ref1]: https://wetten.overheid.nl/BWBR0003800#Artikel1a
