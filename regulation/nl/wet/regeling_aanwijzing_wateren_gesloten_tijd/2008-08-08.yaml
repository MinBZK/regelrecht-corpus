  - number: 1d
    text: |-
      Werknemers die vissen in dienst van de visrechthebbende of de houder van een schriftelijke toestemming, bedoeld in
      [artikel 1a, tweede lid][ref1] en [artikel 1b, eerste lid][ref2], hebben het bewijs van dit dienstverband bij de
      uitvoering van de visserij bij zich.


      [ref1]: https://wetten.overheid.nl/BWBR0003800#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0003800#Artikel1b
