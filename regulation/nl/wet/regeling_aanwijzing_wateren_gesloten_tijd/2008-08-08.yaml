preamble:
  text: |-
    Gelet op artikel 6, derde lid, van het Reglement voor de binnenvisserij 1985 (Stb. 283);

    Gehoord de Voorlopige Adviesraad voor de Binnenvisserij en de Natuurbeschermingsraad;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0003800/2008-08-08#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Als water waarin het verboden is te vissen met de hengel in de periode van 1 april tot en met 31 mei, wordt
      aangewezen:

      1. Het Houtwiel, ten noorden van Veenwouden (Fr.).

      2. Het Rottighe Meente, in de gemeente Weststellingwerf (Fr.);

      3. De Deelen, begrensd door de Buitendijkse hoofdvaart, de Deelenweg, de Hooivaartsweg. Tweede of Nieuwe Deel, de
      lijn van oost naar west door de lange warren langs de dwarssloten, het Binnenkanaal, de Hooivaartsweg, de vaart
      tussen het gemaal Dijksman en de P.C. Otterweg en het Stroomkanaal;

      4. De wateren, gelegen in het Ilperveld, begrensd door de Purmerlanderrijweg, het Noord-Hollandschkanaal, de
      gemeentegrens tussen Ilpendam en Landsmeer (Banscheiding) en de rijweg Landsmeer-Den Ilp-Purmerland.

      5. De wateren gelegen in het gebied begrensd door het Noord-Hollandschkanaal, de Purmerringvaart tussen Ilpendam
      en Het Stinke Vuil, het Stinke Vuil, de Gouwzee, het IJsselmeer, het Buiten IJ en de in aanleg zijnde noordelijke
      ringweg van Amsterdam tussen de Schellingwouderbrug en de IJtunnelweg bij Nieuwendam, met uitzondering van het
      Kinselmeer, de binnen de bebouwde kommen gelegen wateren, alsmede de langs openbare wegen gelegen wateren voor
      zover wordt gevist vanaf de wegzijde;

      6. De wateren, gelegen in het gebied begrensd door de Zaan, de Knollendammervaart, het Noord-Hollandschkanaal, de
      noordelijke Ringvaart en de Wijde Wormer, het verbindingskanaal tussen de twee laatstgenoemde wateren, de Braak en
      de Poel;

      7. De Oude Zederik, gelegen tussen Ameide en Meerkerk;

      8. De Hoge Boezem van de Nederwaard;

      9.

      10. Het gebied van de Nieuwkoopse plassen begrensd door de weg van de Noordse buurt naar Noorden en Nieuwkoop,
      de Ziendeweg, de Meije, de Kadewatering tot Slikkendam en de provinciale weg Slikkendam-Noordse buurt, met
      uitzondering van:

      a. de Noordeinderplas tot het Brampjesgat,

      b. de Maarten Freekerwei,

      c. de Zuideinderplas,

      en voor zover het betreft het vissen met de hengel vanuit boten met uitzondering van;

      d. (zuidelijk deel) Ziendevaart vanaf Ziendesluis tot Elleboog vaart,

      e. 't Wije ten zuiden begrensd door jachthaven Lelieveld en ten noorden door Tatje,

      f. de Voorwetering langs het Zuideinde, Dorpsstraat, Noordense weg en Simon van Capelweg tot hotel de Watergeus,

      g. de Meijewetering vanaf de ten noorden van dit water gelegen camping de Balvert tot Vliet,

      h. de gemeentevaart lopende vanaf 't Wije tot de zwemsteiger op de zuidoostelijke punt van Meijepark,

      i. de gemeentevaart ten noorden van 't Wije aanvangende bij Tatje tot aan de Noordeinderplas,

      j. het gebied gelegen ten noorden van de Zuideinderplas en begrensd door de jachthaven Lelieveld in het noorden,
      ten westen door de weg Zuideinde en ten oosten door land grenzend aan de gemeentevaart,

      k. het water Vliet lopend vanaf de Simon van Capelweg ten noorden en tot aan de Meijewetering ten zuiden,

      l. de Kadewetering lopend vanaf Vliet ten westen tot de Slikkendammersluis,

      m. 't Wije achter Van der Weijden,

      n. de Kleine Polder;

      o. het Brampjesgat;

      p. de Schepengaten;

      q. het Wijhe van de Vliet;

      r. het Schippersgat en

      s. de verbindingsvaart tussen het Wijhe van de Vliet en het Schippersgat.
    url: https://wetten.overheid.nl/BWBR0003800/2008-08-08#Artikel1
  - number: 1a
    text: |-
      1 Als wateren, waarin het is verboden te vissen met de vistuigen, genoemd in
      [artikel 2, eerste lid, onderdelen c tot en met p, van het Reglement voor de binnenvisserij 1985][ref1] worden
      aangewezen de wateren, bedoeld in [artikel 1, vierde lid, onderdeel d, van de Visserijwet 1963][ref2] met
      uitzondering van het IJsselmeer.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing op de visrechthebbende en de houder van een
      schriftelijke toestemming die:

      a. beschikt over minimaal 250 hectare viswater en daarmee inkomsten uit de visserij genereert van minimaal
      € 8.500,– bruto per jaar,

      b. zich daartoe heeft gemeld bij Onze Minister,

      c. de melding, bedoeld in onderdeel b, vergezeld heeft doen gaan van een verklaring
      van een accountant of een accountant-administratieconsulent als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref3], waaruit blijkt dat in het kalenderjaar
      voorafgaande aan de melding is voldaan aan het criterium, bedoeld in [artikel 1a, tweede lid, onderdeel a][ref4],
      en

      d. voorts telkens éénmaal in de vier jaar, te rekenen vanaf de melding bedoeld in onderdeel b, Onze Minister
      een verklaring heeft doen toekomen als bedoeld in onderdeel c, waaruit blijkt dat in het kalenderjaar
      voorafgaande aan de toezending van deze verklaring nog steeds is voldaan aan het criterium, bedoeld in
      [artikel 1a, tweede lid, onderdeel a][ref5].

      3 Het verbod, bedoeld in het eerste lid, is niet van toepassing op het vissen in een binnen een afgesloten erf
      gelegen viswater, dat geen voor het doorlaten van vis geschikte verbinding met andere wateren bezit, alsmede op het
      vissen in een viskwekerij.

      4 Bij de bepaling van het areaal, bedoeld in het tweede lid, onderdeel a, wordt mede begrepen
      het oppervlak aan viswater waarvoor vergunning is verleend ingevolge de [artikelen 3][ref6] en
      [11 van de Beschikking visserij visserijzone, zeegebied en kustwateren][ref7], met uitzondering van het viswater
      waarvoor ingevolge voornoemde Beschikking vergunning is verleend voor recreatief vissen voor uitsluitend eigen
      gebruik met maximaal twee fuiken of met beperkte lengte hoekwant (tot maximaal 200 meter) of met beperkte lengte
      staand want (tot maximaal 150 meter).


