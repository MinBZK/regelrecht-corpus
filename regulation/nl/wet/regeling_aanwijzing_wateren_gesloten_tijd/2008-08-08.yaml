  - number: '2'
    text: |-
      Als water, waarin het verboden is te vissen met enig vistuig wordt aangewezen: de Geul, bovenstrooms van de grens
      tussen de gemeenten Valkenburg en Meerssen en haar zijbeken, de Voerenbeek en de Noordbeek met dien verstande, dat
      het van 1 april tot en met 30 september toegestaan is te vissen met het aalkistje en de hengel, voor zover deze
      niet is geaasd met worm of nabootsing daarvan.
    url: https://wetten.overheid.nl/BWBR0003800/2008-08-08#Artikel2
  - number: 2a
    text: |-
      Als periode, waarin het verboden is te vissen op grond van
      [artikel 2, eerste lid, van de Regeling visserij-inspanning IJsselmeer][ref1], wordt voor het tijdvak van 1 juni
      2008 tot en met 31 mei 2009 vastgesteld de periode van 16 augustus tot en met 27 september 2008.


      [ref1]: https://wetten.overheid.nl/BWBR0008072#Artikel2
    url: https://wetten.overheid.nl/BWBR0003800/2008-08-08#Artikel2a
