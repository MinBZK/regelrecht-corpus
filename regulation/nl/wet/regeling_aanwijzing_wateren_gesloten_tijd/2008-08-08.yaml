  - number: 1b
    text: |-
      1 Het verbod, bedoeld in [artikel 1a, eerste lid][ref1], is niet van toepassing op de visrechthebbende en de houder
      van een schriftelijke toestemming die

      a. beschikt over minimaal 250 hectare viswater,

      b. zich daartoe heeft gemeld bij Onze Minister, en

      c. de melding, bedoeld in onderdeel b, vergezeld heeft doen gaan van:

      1°. een bedrijfsplan, waaruit een perspectief kan worden afgeleid om binnen twee jaren na de melding te voldoen aan
      het inkomstencriterium, bedoeld in [artikel 1a, tweede lid, onderdeel a][ref2], en

      2°. een verklaring als bedoeld in [artikel 1a, tweede lid, onderdeel c][ref3], waaruit blijkt dat op het tijdstip
      van de melding is voldaan aan het areaalscriterium, bedoeld in [artikel 1a, tweede lid, onderdeel a][ref4].

      d. gedurende een periode van twee jaren voorafgaande aan de melding, bedoeld in onderdeel b, niet heeft gevist op
      basis van de in het eerste lid bedoelde vrijstelling.

      2 De in het eerste lid bedoelde vrijstelling van het in [artikel 1a, eerste lid][ref5] neergelegde verbod, geldt
      gedurende een periode van twee jaren, te rekenen vanaf de melding, bedoeld in onderdeel b.


