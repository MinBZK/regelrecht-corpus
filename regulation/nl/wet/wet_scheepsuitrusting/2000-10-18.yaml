---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_scheepsuitrusting
regulatory_layer: WET
publication_date: '2016-09-09'
valid_from: '2000-10-18'
bwb_id: BWBR0011301
url: https://wetten.overheid.nl/BWBR0011301/2000-10-18
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, gelet op richtlijn nr. 96/98/EG van de Raad van de Europese Unie
    van 20 december 1996 inzake uitrusting van zeeschepen (PbEG 1997, L 46), noodzakelijk is regels te stellen met
    betrekking tot de productie en keuring van uitrusting voor zeeschepen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel1
  - number: 1.a
    text: |-
      richtlijn: [richtlijn nr. 96/98/EG](31996L0098) van de Raad van de Europese Unie van 20 december 1996 inzake
      uitrusting van zeeschepen (PbEG 1997, L 46);
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel1
  - number: 1.b
    text: 'de verdragen:'
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel1
  - number: 1.b.1°
    text: het op 5 april 1966 te Londen tot stand gekomen Verdrag betreffende de uitwatering van schepen (Trb. 1966, 275);
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel1
  - number: 1.b.2°
    text: |-
      het op 20 oktober 1972 te Londen tot stand gekomen Verdrag inzake Internationale Voorschriften ter voorkoming van
      aanvaringen op zee (Trb. 1974, 51);
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel1
  - number: 1.b.3°
    text: |-
      het op 2 november 1973 te Londen tot stand gekomen Verdrag ter voorkoming van verontreiniging door schepen, (Trb.
      1975, 147);
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel1
  - number: 1.b.4°
    text: |-
      het op 1 november 1974 te Londen tot stand gekomen Verdrag voor de beveiliging van mensenlevens op zee (Trb. 1976,
      157);
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel1
  - number: 1.b.5°
    text: |-
      de bij de onder 1° tot en met 4° genoemde verdragen behorende bindende protocollen, bindende bijlagen of bindende
      aanhangsels;
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel1
  - number: 1.c
    text: 'uitrusting: de onderdelen van scheepsuitrusting, genoemd in bijlage A.1 van de richtlijn;'
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel1
  - number: 1.d
    text: |-
      Nederlands schip: een schip dat op grond van Nederlandse rechtsregels gerechtigd is de vlag van het Koninkrijk te
      voeren, en waarvoor de verdragen voorschrijven dat de aan boord te plaatsen uitrusting overeenkomstig de verdragen
      is goedgekeurd;
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel1
  - number: 1.e
    text: 'productvoorschriften: de relevante fabricagevoorschriften en beproevingsnormen uit bijlage A.1 van de richtlijn;'
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel1
  - number: 1.f
    text: 'overeenstemmingsbeoordeling: het onderzoek naar het voldoen van uitrusting aan de productvoorschriften;'
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel1
  - number: 1.g
    text: |-
      merk van overeenstemming: het symbool, weergegeven in bijlage D van de richtlijn, dat wordt aangebracht op
      uitrusting waarvan overeenkomstig deze wet of een andere regeling ter uitvoering van de richtlijn is aangetoond dat
      zij voldoet aan de toepasselijke voorschriften uit de verdragen;
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel1
  - number: 1.h
    text: |-
      keuringsinstantie: een ingevolge [artikel 4, eerste lid][ref1], aangewezen instantie;


      [ref1]: https://wetten.overheid.nl/BWBR0011301#Artikel4
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011301
        artikel: '4'
        hoofdstuk: '2'
  - number: 1.i
    text: 'Onze Minister: Onze Minister van Verkeer en Waterstaat.'
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel1
  - number: '2'
    text: |-
      Deze wet is niet van toepassing op uitrusting, bestemd voor plaatsing aan boord van oorlogsschepen,
      marinehulpschepen en andere schepen die in gebruik zijn voor de uitvoering van een militaire taak.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel2
  - number: '3.1'
    text: Uitrusting, bestemd voor plaatsing aan boord van een Nederlands schip, voldoet aan de productvoorschriften.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel3
  - number: '3.2'
    text: |-
      Uitrusting als bedoeld in het eerste lid, wordt uitsluitend in de handel gebracht, indien zij is voorzien van het
      merk van overeenstemming.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel3
  - number: '4.1'
    text: |-
      Onze Minister wijst, met inachtneming van bijlage C van de richtlijn, de instanties aan die zijn belast met door
      hem aan te geven, in het kader van een of meer modules van overeenstemmingsbeoordeling als bedoeld in bijlage B van
      de richtlijn, te verrichten taken.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel4
  - number: '4.2'
    text: |-
      Aan een aanwijzing als bedoeld in het eerste lid, kunnen voorschriften worden verbonden, die mede betrekking kunnen
      hebben op de door de aangewezen instantie in rekening te brengen tarieven.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel4
  - number: '4.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld betreffende de criteria voor de beoordeling van instanties
      die in aanmerking wensen te komen voor een aanwijzing als bedoeld in het eerste lid, de wijze van beoordeling en de
      door deze instanties verschuldigde vergoeding voor de kosten van de beoordeling.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel4
  - number: '4.4'
    text: 'Onze Minister trekt een aanwijzing als bedoeld in het eerste lid, in:'
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel4
  - number: 4.4.a
    text: |-
      indien hij van oordeel is dat de keuringsinstantie niet meer voldoet aan de criteria van bijlage C van de richtlijn
      of de in de ministeriële regeling, bedoeld in het derde lid, opgenomen criteria voor de beoordeling van instanties;
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel4
  - number: 4.4.b
    text: |-
      indien de keuringsinstantie de bij of krachtens deze wet gestelde regels of de aan de aanwijzing verbonden
      voorschriften niet naleeft.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel4
  - number: '5'
    text: |-
      Onze Minister stelt de Commissie van de Europese Gemeenschappen en de andere lidstaten van de Europese Unie in
      kennis van een aanwijzing of een intrekking ingevolge [artikel 4][ref1] en vermeldt in geval van een aanwijzing
      de aan de aangewezen instantie toegekende taken en het door de Commissie van de Europese Gemeenschappen aan die
      instantie toegekende identificatienummer.


      [ref1]: https://wetten.overheid.nl/BWBR0011301#Artikel4
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011301
        artikel: '4'
        hoofdstuk: '2'
  - number: '6'
    text: |-
      In deze paragraaf wordt onder keuringsinstantie mede verstaan: een door een andere lidstaat van de Europese Unie
      bij de Commissie van de Europese Gemeenschappen aangemelde instantie, belast met in het kader van een of meer
      modules van overeenstemmingsbeoordeling als bedoeld in bijlage B van de richtlijn, te verrichten taken.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel6
  - number: '7.1'
    text: |-
      De fabrikant volgt voor uitrusting, bestemd voor plaatsing aan boord van een Nederlands schip, een procedure van
      overeenstemmingsbeoordeling.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel7
  - number: '7.2'
    text: |-
      Voor uitrusting, niet zijnde uitrusting als bedoeld in het eerste lid, kan de fabrikant een procedure van
      overeenstemmingsbeoordeling volgen.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel7
  - number: '7.3'
    text: Een procedure van overeenstemmingsbeoordeling wordt gevolgd, voordat uitrusting in de handel wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel7
  - number: '8.1'
    text: |-
      Een procedure van overeenstemmingsbeoordeling behelst voor uitrusting waarop ingevolge bijlage A.1 van de
      richtlijn:
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel8
  - number: 8.1.a
    text: |-
      de overeenstemmingsbeoordelingsmodules B en C van toepassing zijn: het EG-typeonderzoek, aangevuld met de procedure
      van overeenstemming met het type;
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel8
  - number: 8.1.b
    text: |-
      de overeenstemmingsbeoordelingsmodules B en D van toepassing zijn: het EG-typeonderzoek, aangevuld met de procedure
      van productiekwaliteitsborging;
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel8
  - number: 8.1.c
    text: |-
      de overeenstemmingsbeoordelingsmodules B en E van toepassing zijn: het EG-typeonderzoek, aangevuld met de procedure
      van productkwaliteitsborging;
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel8
  - number: 8.1.d
    text: |-
      de overeenstemmingsbeoordelingsmodules B en F van toepassing zijn: het EG-typeonderzoek, aangevuld met de procedure
      van productkeuring;
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel8
  - number: 8.1.e
    text: 'overeenstemmingsbeoordelingsmodule G van toepassing is: de procedure van eenheidskeuring;'
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel8
  - number: 8.1.f
    text: 'overeenstemmingsbeoordelingsmodule H van toepassing is: de procedure van volledige kwaliteitsborging,'
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel8
  - number: '8.2'
    text: |-
      De procedure van eenheidskeuring, bedoeld in het eerste lid, onderdeel e, kan uitsluitend worden gevolgd voor
      uitrusting die per stuk of in kleine hoeveelheden en niet in serie- of massaproductie wordt geproduceerd.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel8
  - number: '8.3'
    text: |-
      Indien ingevolge bijlage A.1 van de richtlijn twee of meer procedures als bedoeld in het eerste lid, van toepassing
      zijn, kiest de fabrikant, onverminderd het tweede lid, voor een van de toepasselijke procedures.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel8
  - number: '8.4'
    text: |-
      Indien op uitrusting zowel beproevingsnormen van de Internationale Elektrotechnische Commissie (IEC) als
      beproevingsnormen van het Europees Normalisatie-instituut voor Telecommunicatie (ETSI) van toepassing zijn, kiest
      de fabrikant voor de normen van een van beide instanties.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel8
  - number: '9.1'
    text: |-
      De fabrikant kiest voor de uitvoering van een procedure van overeenstemmingsbeoordeling een keuringsinstantie die
      bevoegd is om de in het kader van die procedure aan een keuringsinstantie opgedragen taken te verrichten.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel9
  - number: '9.2'
    text: |-
      Indien een procedure als bedoeld in [artikel 8, eerste lid, onderdelen a tot en met d][ref1], wordt gevolgd, kan
      voor de aanvullende procedure een andere keuringsinstantie worden gekozen dan voor het EG-typeonderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0011301#Artikel8
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011301
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '10.1'
    text: |-
      De fabrikant brengt op uitrusting die voldoet aan de productvoorschriften en waarvoor een toepasselijke procedure
      van overeenstemmingsbeoordeling is gevolgd, in de laatste fase van het productieproces het merk van overeenstemming
      aan.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel10
  - number: '10.2'
    text: |-
      Het merk van overeenstemming wordt, indien de keuringsinstantie die de procedure van overeenstemmingsbeoordeling
      heeft uitgevoerd, betrokken is bij de fase van fabricagecontrole, gevolgd door het identificatienummer van die
      instantie. Het identificatienummer wordt door de fabrikant aangebracht, indien het niet door de keuringsinstantie
      zelf wordt aangebracht.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel10
  - number: '10.3'
    text: |-
      Het merk van overeenstemming en in voorkomend geval het identificatienummer, bedoeld in het tweede lid, worden
      gevolgd door de twee laatste cijfers van het jaar waarin het merk van overeenstemming is aangebracht.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel10
  - number: '10.4'
    text: |-
      Het merk van overeenstemming wordt, met inachtneming van bijlage D van de richtlijn, op een zodanige wijze op de
      uitrusting of een daaraan bevestigd gegevensplaatje aangebracht, dat het voor de verwachte gebruiksduur van de
      uitrusting zichtbaar, leesbaar en onuitwisbaar zal zijn, met dien verstande dat het merk van overeenstemming op
      de verpakking, een etiket of een brochure wordt aangebracht, indien de aard van de uitrusting aanbrenging op de
      uitrusting zelf niet toelaat.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel10
  - number: '11.1'
    text: |-
      De fabrikant stelt voor uitrusting waarop hij het merk van overeenstemming heeft aangebracht, een schriftelijke
      verklaring van overeenstemming op, waarin hij met inachtneming van de regels, opgenomen in bijlage B van de
      richtlijn, verklaart dat die uitrusting:
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel11
  - number: 11.1.a
    text: |-
      in overeenstemming is met het certificaat van EG-typeonderzoek en voldoet aan de productvoorschriften,
      indien voor de uitrusting de procedure van overeenstemmingsbeoordeling is gevolgd, bedoeld in
      [artikel 8, eerste lid, onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011301#Artikel8
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011301
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 11.1.b
    text: |-
      in overeenstemming is met het certificaat van EG-typeonderzoek, indien voor de uitrusting een procedure van
      overeenstemmingsbeoordeling is gevolgd als bedoeld in [artikel 8, eerste lid, onderdelen b, c of d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011301#Artikel8
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011301
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 11.1.c
    text: |-
      voldoet aan de productvoorschriften, indien voor de uitrusting een procedure van overeenstemmingsbeoordeling is
      gevolgd als bedoeld in [artikel 8, eerste lid, onderdelen e of f][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011301#Artikel8
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011301
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '11.2'
    text: De verklaring van overeenstemming, bedoeld in het eerste lid, vergezelt de uitrusting.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel11
  - number: '12'
    text: |-
      De fabrikant verleent de keuringsinstantie en de door deze ingevolge [artikel 16, tweede lid][ref1], aangewezen
      natuurlijke personen of rechtspersonen alle medewerking, voorzover dat noodzakelijk is voor de uitvoering van de
      procedure van overeenstemmingsbeoordeling en de uitoefening van andere in deze wet bedoelde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0011301#Artikel16
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0011301
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '13.1'
    text: |-
      De door de fabrikant in het kader van een procedure van overeenstemmingsbeoordeling aan de keuringsinstantie te
      verstrekken technische documentatie voldoet aan het aanhangsel van bijlage B van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel13
  - number: '13.2'
    text: |-
      De fabrikant bewaart gedurende een periode van ten minste tien jaren de technische documentatie, bedoeld in het
      eerste lid, alsmede andere bij ministeriële regeling te bepalen gegevens.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel13
  - number: '13.3'
    text: |-
      De fabrikant verstrekt aan de personen of instanties die door Nederland of een andere lidstaat van de Europese Unie
      zijn belast met het uitvoeren van door de verdragen voorgeschreven prestatieproeven op uitrusting in bedrijf aan
      boord van schepen, desgevraagd de inspectie- en beproevingsverslagen die bij de overeenstemmingsbeoordeling van die
      uitrusting zijn opgesteld.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel13
  - number: '14.1'
    text: |-
      Voorzover door de fabrikant niet is voldaan aan de verplichtingen, bedoeld in de [artikelen 7 tot en met 13][ref1],
      rusten deze verplichtingen op de gemachtigde van de fabrikant of op degene die de uitrusting in de handel brengt.


      [ref1]: https://wetten.overheid.nl/BWBR0011301#Artikel7
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0011301
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '14.2'
    text: |-
      Zodra de gemachtigde van de fabrikant of degene die de uitrusting in de handel brengt, aan een ingevolge het eerste
      lid op hem rustende verplichting heeft voldaan, is die verplichting voor de ander en voor de fabrikant opgeheven.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel14
  - number: '15'
    text: |-
      Indien voor uitrusting, niet zijnde uitrusting bestemd voor plaatsing aan boord van een Nederlands schip,
      door de fabrikant geen procedure van overeenstemmingsbeoordeling is gevolgd, komt de bevoegdheid, bedoeld in
      [artikel 7, tweede lid][ref1], toe aan de gemachtigde van de fabrikant of de persoon die de uitrusting in de handel
      brengt. De [artikelen 8 tot en met 13][ref2] zijn alsdan van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011301#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0011301#Artikel8
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0011301
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0011301
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '16.1'
    text: |-
      Een keuringsinstantie neemt bij de uitvoering van de taken waarmee zij in het kader van de procedures van
      overeenstemmingsbeoordeling is belast, de in bijlage B van de richtlijn opgenomen regels in acht.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel16
  - number: '16.2'
    text: |-
      Een keuringsinstantie is bevoegd om met inachtneming van bij ministeriële regeling gegeven voorschriften
      beproevingen en controles te doen verrichten door andere natuurlijke personen of rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel16
  - number: '17'
    text: |-
      Een keuringsinstantie die een procedure van overeenstemmingsbeoordeling heeft uitgevoerd, brengt, indien zij
      betrokken is bij de fase van fabricagecontrole, naast het merk van overeenstemming haar identificatienummer aan of
      ziet erop toe dat dit nummer wordt aangebracht door de fabrikant, diens gemachtigde of degene die de uitrusting in
      de handel brengt.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel17
  - number: '18.1'
    text: |-
      Indien de keuringsinstantie die een certificaat van EG-typeonderzoek of een certificaat van EG-ontwerponderzoek
      heeft afgegeven, vermoedt dat de uitrusting waarop het certificaat betrekking heeft, niet meer aan de
      productvoorschriften voldoet ten gevolge van een wijziging van die voorschriften, stelt zij daarnaar een onderzoek
      in.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel18
  - number: '18.2'
    text: |-
      De keuringsinstantie trekt het certificaat van EG-typeonderzoek of het certificaat van EG-ontwerponderzoek in,
      indien een onderzoek als bedoeld in het eerste lid, uitwijst dat de uitrusting waarop het certificaat betrekking
      heeft, niet meer aan de productvoorschriften voldoet.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel18
  - number: '19.1'
    text: |-
      Een keuringsinstantie verstrekt desgevraagd aan Onze Minister de voor de uitoefening van diens taak benodigde
      inlichtingen. Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voorzover dat voor de
      vervulling van zijn taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel19
  - number: '19.2'
    text: |-
      Een keuringsinstantie verstrekt aan de personen of instanties die door een lidstaat van de Europese Unie zijn
      belast met het toezicht op de naleving van veiligheidsvoorschriften aan boord van schepen waarvoor door of namens
      die lidstaat veiligheidscertificaten zijn afgegeven, aan andere keuringsinstanties en aan aangemelde instanties
      als bedoeld in [artikel 6][ref1], desgevraagd inlichtingen ter zake van de door haar uitgevoerde procedures van
      overeenstemmingsbeoordeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011301#Artikel6
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011301
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '20.1'
    text: |-
      In uitzonderlijke gevallen van technische innovatie kan Onze Minister voor uitrusting, bestemd voor plaatsing
      aan boord van een Nederlands schip, waarvoor toepasselijke keuringsvoorschriften ontbreken, een certificaat van
      gelijkwaardigheid afgeven, indien die uitrusting naar zijn oordeel ten minste gelijkwaardig is aan uitrusting die
      voldoet aan de productvoorschriften.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel20
  - number: '20.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld betreffende de toepassing van het eerste lid, de wijze
      waarop de gelijkwaardigheid van uitrusting wordt beoordeeld, en de verschuldigde vergoeding voor de kosten van de
      beoordeling van gelijkwaardigheid en de afgifte van het certificaat van gelijkwaardigheid.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel20
  - number: '20.3'
    text: |-
      Aan het gebruik van uitrusting waarvoor een certificaat van gelijkwaardigheid is afgegeven, kunnen beperkingen en
      voorschriften worden verbonden. Deze beperkingen en voorschriften worden in het certificaat vermeld.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel20
  - number: '20.4'
    text: |-
      Onze Minister stelt de Commissie van de Europese Gemeenschappen en de andere lidstaten van de Europese Unie
      onmiddellijk in kennis van de afgifte van een certificaat van gelijkwaardigheid. Hij vermeldt daarbij de
      bijzonderheden van het geval en doet de Commissie en de andere lidstaten afschriften van de beoordelingsverslagen
      toekomen.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel20
  - number: '21.1'
    text: |-
      Ten behoeve van de beproeving van uitrusting in bedrijf aan boord van een Nederlands schip kan Onze Minister voor
      uitrusting waarvoor geen procedure van overeenstemmingsbeoordeling is gevolgd, een certificaat ten behoeve van
      beproeving afgeven.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel21
  - number: '21.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld betreffende de toepassing van het eerste lid en de voor de
      afgifte van een certificaat van beproeving verschuldigde vergoeding.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel21
  - number: '21.3'
    text: |-
      Aan het gebruik van uitrusting waarvoor een certificaat ten behoeve van beproeving is afgegeven, kunnen beperkingen
      en voorschriften worden verbonden. Deze beperkingen en voorschriften worden in het certificaat vermeld.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel21
  - number: '21.4'
    text: |-
      Onze Minister bepaalt de geldigheidsduur van het certificaat. De geldigheidsduur is niet langer dan voor een goede
      beproeving van de uitrusting redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel21
  - number: '22'
    text: |-
      Uitrusting waarvoor een certificaat van gelijkwaardigheid of een certificaat ten behoeve van beproeving is
      afgegeven, behoeft in afwijking van [artikel 3, eerste lid][ref1], niet te voldoen aan de productvoorschriften en
      mag, mits vergezeld van het desbetreffende certificaat, in afwijking van [artikel 3, tweede lid][ref2], ook zonder
      merk van overeenstemming in de handel worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0011301#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011301#Artikel3
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0011301
        artikel: '3'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0011301
        artikel: '3'
        hoofdstuk: '1'
  - number: '23.1'
    text: |-
      Indien Onze Minister van oordeel is dat uitrusting die is voorzien van het merk van overeenstemming, ook wanneer
      zij op de juiste wijze aan boord is geplaatst en op de juiste wijze wordt onderhouden en gebruikt voor haar
      gebruiksdoel, de gezondheid of de veiligheid van de bemanning, de passagiers of andere personen in gevaar kan
      brengen of het mariene milieu kan aantasten, neemt hij passende voorlopige maatregelen om die uitrusting uit de
      handel te nemen. Zo nodig verbiedt hij het in de handel brengen van die uitrusting.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel23
  - number: '23.2'
    text: |-
      Onze Minister stelt de andere lidstaten van de Europese Unie en de Commissie van de Europese Gemeenschappen
      onmiddellijk en onder opgave van redenen in kennis van maatregelen als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel23
  - number: '24.1'
    text: |-
      Indien Onze Minister van oordeel is dat op uitrusting in strijd met deze wet het merk van overeenstemming is
      aangebracht, neemt hij passende maatregelen om die uitrusting uit de handel te nemen. Zo nodig verbiedt hij het in
      de handel brengen van die uitrusting.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel24
  - number: '24.2'
    text: |-
      Onze Minister stelt de andere lidstaten van de Europese Unie en de Commissie van de Europese Gemeenschappen in
      kennis van maatregelen als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel24
  - number: '25'
    text: |-
      De fabrikant, diens gemachtigde of de persoon die verantwoordelijk is voor het in de handel brengen, verleent
      alle medewerking die noodzakelijk is voor de uitvoering van maatregelen als bedoeld in de [artikelen 23][ref1]
      en [24][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011301#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0011301#Artikel24
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011301
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011301
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '26.1'
    text: |-
      Het is verboden uitrusting, bestemd voor plaatsing aan boord van een Nederlands schip, in de handel te brengen of
      daartoe voorhanden te hebben, indien die uitrusting niet is voorzien van het merk van overeenstemming en ook niet
      vergezeld gaat van een certificaat van gelijkwaardigheid als bedoeld in [artikel 20][ref1], of een certificaat ten
      behoeve van beproeving als bedoeld in [artikel 21][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011301#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0011301#Artikel21
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0011301
        artikel: '20'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0011301
        artikel: '21'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '26.2'
    text: |-
      Het is verboden om het merk van overeenstemming aan te brengen op uitrusting die niet voldoet aan de
      productvoorschriften of waarvoor geen procedure van overeenstemmingsbeoordeling is gevolgd.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel26
  - number: '26.3'
    text: |-
      Het is verboden merktekens of opschriften aan te brengen die anderen kunnen misleiden omtrent de betekenis of de
      grafische vormgeving van het merk van overeenstemming, of die de zichtbaarheid of de leesbaarheid van het merk
      verminderen.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel26
  - number: '26.4'
    text: |-
      Het is verboden te handelen in strijd met een verplichting als bedoeld in de [artikelen 12][ref1],
      [13][ref2] en [25][ref3] of met een verbod als bedoeld in [artikel 23, eerste lid, tweede volzin][ref4], en
      [24, eerste lid, tweede volzin][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0011301#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0011301#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0011301#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0011301#Artikel23
      [ref5]: https://wetten.overheid.nl/BWBR0011301#Artikel24
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0011301
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0011301
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0011301
        artikel: '25'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0011301
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0011301
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '27.1'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de ambtenaren van de
      Scheepvaartinspectie en de ambtenaren van de Rijksdienst voor Radiocommunicatie.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel27
  - number: '27.2'
    text: |-
      Onze Minister kan voor bepaalde door hem aan te wijzen taken, verband houdende met het toezicht op de naleving
      van het bij of krachtens deze wet bepaalde, ambtenaren van andere diensttakken ter beschikking stellen van de
      Scheepvaartinspectie of de Rijksdienst voor Radiocommunicatie. Indien de terbeschikkingstelling ambtenaren betreft,
      ressorterende onder een ander ministerie dan dat van Onze Minister, wordt het desbetreffende besluit genomen in
      overeenstemming met de minister van dat andere ministerie.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel27
  - number: '27.3'
    text: Van een besluit als bedoeld in het tweede lid, wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel27
  - number: '28'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het in het kader van
      [artikel 4, vierde lid, onderdeel a][ref1], op de keuringsinstanties uit te oefenen toezicht en de door de
      keuringsinstanties voor de uitoefening van dat toezicht verschuldigde vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0011301#Artikel4
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0011301
        artikel: '4'
        hoofdstuk: '2'
  - number: '29.1'
    text: |-
      De [artikelen 3][ref1], [7, eerste lid][ref2], en [26, eerste lid][ref3], zijn tot en met 31 december 2000
      niet van toepassing op uitrusting, genoemd in bijlage A.1 van de richtlijn, naar de tekst van die bijlage
      zoals deze op 20 december 1996 is vastgesteld, indien die uitrusting is vervaardigd voor de inwerkingtreding
      van deze wet en is goedgekeurd op grond van regels, gesteld krachtens de [Schepenwet][ref4] of de
      [Wet voorkoming verontreiniging door schepen][ref5], die voor 20 december 1996 van kracht waren.


      [ref1]: https://wetten.overheid.nl/BWBR0011301#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011301#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0011301#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0001876
      [ref5]: https://wetten.overheid.nl/BWBR0003642
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0011301
        artikel: '3'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0011301
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0011301
        artikel: '26'
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0001876
      - id: ref5
        bwb_id: BWBR0003642
  - number: '29.2'
    text: |-
      De [artikelen 3][ref1], [7, eerste lid][ref2], en [26, eerste lid][ref3], zijn gedurende een termijn van
      twee jaren niet van toepassing op uitrusting die ingevolge een na 20 december 1996 vastgesteld besluit van
      de Commissie van de Europese Gemeenschappen of van de Raad van de Europese Unie in bijlage A.1 is opgenomen,
      indien die uitrusting is vervaardigd voor de dag waarop het desbetreffende besluit voor de toepassing van deze
      wet is gaan gelden, en zij is goedgekeurd op grond van regels, gesteld krachtens de [Schepenwet][ref4] of de
      [Wet voorkoming verontreiniging door schepen][ref5], die voor de vaststelling van dat besluit van kracht waren.
      De termijn van twee jaren vangt aan op de dag waarop het wijzigingsbesluit voor de toepassing van deze wet gaat
      gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0011301#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011301#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0011301#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0001876
      [ref5]: https://wetten.overheid.nl/BWBR0003642
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0011301
        artikel: '3'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0011301
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0011301
        artikel: '26'
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0001876
      - id: ref5
        bwb_id: BWBR0003642
  - number: '29.3'
    text: |-
      Bij ministeriële regeling kunnen, voorzover nodig ter uitvoering van een besluit van de Commissie van de Europese
      Gemeenschappen of van de Raad van de Europese Unie tot wijziging van bijlage A.1 van de richtlijn, aanvullende
      regels van overgangsrecht worden gesteld.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel29
  - number: '30.1'
    text: |-
      Een wijziging van de richtlijn gaat voor de toepassing van deze wet gelden met ingang van de dag waarop aan de
      betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel30
  - number: '30.2'
    text: |-
      Een wijziging van de verdragen gaat voor de toepassing van deze wet gelden met ingang van de dag waarop die
      wijziging internationaal in werking treedt.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel30
  - number: '31'
    text: |-
      Voorzover op grond van de Overeenkomst inzake de Europese Economische Ruimte de richtlijn ook verbindend is
      voor een staat, niet zijnde een lidstaat van de Europese Unie, wordt deze staat voor de toepassing van deze wet
      gelijkgesteld met een lidstaat van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel31
  - number: '34'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel34
  - number: '35'
    text: 'Deze wet wordt aangehaald als: Wet scheepsuitrusting.'
    url: https://wetten.overheid.nl/BWBR0011301/2000-10-18#Artikel35
