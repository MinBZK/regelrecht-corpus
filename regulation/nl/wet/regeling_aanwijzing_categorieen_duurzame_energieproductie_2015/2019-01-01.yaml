      mest.
    url: https://wetten.overheid.nl/BWBR0036245/2019-01-01#Artikel26
  - number: '26.2'
    text: |-
      Indien de aanvrager, in aanvulling op de subsidie als bedoeld in het eerste
      lid op grond van de MEP of OV-MEP, subsidie heeft ontvangen op grond van
      [artikel 116 van de Regeling aanwijzing categorieën duurzame energieproductie 2012][ref1],
      [artikel 72 van de Regeling aanwijzing categorieën duurzame energieproductie 2013][ref2],
      [artikel 72 van de Regeling aanwijzing categorieën duurzame energieproductie 2014][ref3] of [artikel 44][ref4] van
      deze regeling, eindigt de subsidieperiode van deze subsidie in ieder geval op het moment dat de subsidieperiode van
      de subsidie verstrekt op grond van het eerste lid aanvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0031291#Artikel116
      [ref2]: https://wetten.overheid.nl/BWBR0032881#Artikel72
