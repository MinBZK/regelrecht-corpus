      a. waarmee hernieuwbaar gas wordt geproduceerd uitsluitend door middel van allesvergisting, of

      b. waarmee hernieuwbaar gas wordt geproduceerd uitsluitend door middel van vergisting en co-vergisting van
      dierlijke mest.

