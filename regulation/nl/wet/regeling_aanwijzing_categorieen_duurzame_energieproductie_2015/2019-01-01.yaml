  - number: '4'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare elektriciteit geproduceerd door een
      productie-installatie waarmee door middel van hydro-mechanisch-elektrische omzetting hernieuwbare elektriciteit
      wordt geproduceerd uit potentiële dan wel kinetische energie van stromend water dat niet specifiek ten behoeve van
      de elektriciteitsproductie omhoog is gepompt:

      a. in installaties met een valhoogte gelijk aan of groter dan 50 centimeter, of

      b. in installaties met een valhoogte gelijk aan of groter dan 50 centimeter,

      die ingrijpend zijn gerenoveerd en waarbij ten minste de turbines nieuw zijn.
    url: https://wetten.overheid.nl/BWBR0036245/2019-01-01#Artikel4
  - number: '5'
    text: |-
      1 Subsidie als bedoeld in [artikel 4][ref1] wordt voor een periode van 15 jaar verstrekt.

      2 De subsidie-ontvanger neemt de productie-installatie, bedoeld in [artikel 4][ref2], binnen 4 jaar na de datum van
      inwerkingtreding van de beschikking tot subsidieverlening in gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0036245#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0036245#Artikel4
    url: https://wetten.overheid.nl/BWBR0036245/2019-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0036245
        artikel: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0036245
        artikel: '4'
        paragraaf: '3'
  - number: '6'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare elektriciteit geproduceerd door
      een productie-installatie waarmee hernieuwbare elektriciteit wordt geproduceerd uit gas dat vrijkomt ten gevolge
      van biologische afbraakreacties bij de zuivering van huishoudelijk afvalwater, bedrijfsafvalwater en afvloeiend
      hemelwater, gebruik makende van thermische drukhydrolyse, waarbij ten minste het deel van de productie-installatie,
      dat bedoeld is voor thermische drukhydrolyse nieuw is.
    url: https://wetten.overheid.nl/BWBR0036245/2019-01-01#Artikel6
  - number: '7'
    text: |-
      1 Subsidie als bedoeld in [artikel 6][ref1] wordt voor een periode van 12 jaar verstrekt.

      2 De subsidie-ontvanger neemt de productie-installatie, bedoeld in [artikel 6][ref2], binnen 4 jaar na de datum van
      inwerkingtreding van de beschikking tot subsidieverlening in gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0036245#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0036245#Artikel6
    url: https://wetten.overheid.nl/BWBR0036245/2019-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0036245
        artikel: '6'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0036245
        artikel: '6'
        paragraaf: '3'
  - number: '8'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare elektriciteit geproduceerd door
      een productie-installatie voor de productie van hernieuwbare elektriciteit met behulp van windenergie die niet
      is opgericht in de territoriale zee, in de Nederlandse exclusieve economische zone of op een locatie waar op
      het moment van aanvragen een productie-installatie voor de productie van hernieuwbare elektriciteit met behulp
      van windenergie staat of heeft gestaan met een hoger vermogen, tenzij bij de vervanging van één of meerdere
      windturbines het vermogen per windturbine ten minste 1 MW toeneemt, welke wordt gerealiseerd in een gemeente die in
      de lijst in [bijlage 2][ref1] een windsnelheid heeft van:

      a. ≥ 8,0 m/s,

      b. ≥ 7,5 en < 8,0 m/s,

