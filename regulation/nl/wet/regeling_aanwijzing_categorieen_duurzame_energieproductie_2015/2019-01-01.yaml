      vermogen ten minste 20% van de som van het nominale warmte en elektrisch vermogen bedraagt;
    url: https://wetten.overheid.nl/BWBR0036245/2019-01-01#Artikel54
  - number: 54.d
    text: |-
      een productie-installatie waarmee hernieuwbare elektriciteit en hernieuwbare warmte wordt geproduceerd uitsluitend
      door middel van vergisting en co-vergisting van dierlijke mest, waarbij ten minste de vergister nieuw is en waarbij
      het nominaal elektrisch vermogen ten minste 20% van de som van het nominale warmte en elektrisch vermogen bedraagt,
    url: https://wetten.overheid.nl/BWBR0036245/2019-01-01#Artikel54
  - number: 54.e
    text: |-
      een productie-installatie waarmee hernieuwbare elektriciteit en hernieuwbare warmte wordt geproduceerd uitsluitend
      door middel van vergisting van meer dan 95% dierlijke mest, waarbij ten minste de vergister nieuw is, of
    url: https://wetten.overheid.nl/BWBR0036245/2019-01-01#Artikel54
  - number: 54.f
    text: |-
