    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare elektriciteit of hernieuwbare
      elektriciteit en hernieuwbare warmte geproduceerd door een productie-installatie voor de productie van hernieuwbare
      elektriciteit of hernieuwbare elektriciteit en hernieuwbare warmte uit biogas dat vrijkomt ten gevolge van
      biologische afbraakreacties bij de thermofiele zuivering van uitsluitend secundair slib, waarbij sprake is van
      een centrale productie-installatie waarvoor secundair slib grotendeels extern wordt aangevoerd van een of meerdere
      andere RWZI’s en waarbij tenminste de vergister zelf nieuw is.
