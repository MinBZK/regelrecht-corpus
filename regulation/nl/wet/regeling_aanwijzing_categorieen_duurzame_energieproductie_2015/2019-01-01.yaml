  - number: '62'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare elektriciteit geproduceerd door
      een productie-installatie voor de productie van hernieuwbare elektriciteit met behulp van windenergie die niet
      is opgericht op een locatie waarvoor op het moment van aanvragen productie-installatie voor de productie van
      hernieuwbare elektriciteit met behulp van windenergie staat of heeft gestaan met een hoger vermogen tenzij bij de
      vervanging van één of meerdere windturbines het vermogen per windturbine ten minste 1 MW toeneemt, en ten aanzien
      waarvan voor 1 januari 2015 een ontwerp-inpassingsplan of ontwerpbestemmingsplan ter inzage is gelegd of de
      aanvraag voor een omgevingsvergunning is ingediend.
    url: https://wetten.overheid.nl/BWBR0036245/2019-01-01#Artikel62
  - number: '63'
    text: |-
      1 Subsidie als bedoeld in [artikel 62][ref1] wordt voor een periode van 15 jaar verstrekt.

      2 De subsidie-ontvanger neemt de productie-installatie, bedoeld [artikel 62][ref2] binnen 4 jaar na de datum van
      inwerkingtreding van de beschikking tot subsidieverlening in gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0036245#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0036245#Artikel62
