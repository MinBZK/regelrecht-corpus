  - number: '65'
    text: |-
      1 Voor een productie-installatie als bedoeld in [artikel 62][ref1] wordt,

      a. het basisbedrag voor subsidie, bedoeld in [artikel 11, eerste lid, van het besluit][ref2], vastgesteld op €
      0,1125 per kWh,

      b. voor de productie van hernieuwbare elektriciteit, het maximaal aantal vollasturen

        - wanneer de aanvraag in de eerste fase is ingediend, vastgesteld op 2.800,
        - wanneer de aanvraag in de tweede fase is ingediend, vastgesteld op 2.160, en
        - wanneer de aanvraag in fase 3 tot en met 9 is ingediend, vastgesteld op 1.840,

      c. voor de productie van hernieuwbare elektriciteit de basiselektriciteitsprijs, bedoeld in
      [artikel 12, eerste lid, van het besluit][ref3], vastgesteld op € 0,037 per kWh, en

      d. de correctie op het basisbedrag voor subsidie voor 2015:

        - voor wat betreft de elektriciteitsprijs, bedoeld in [artikel 14, eerste lid, onderdeel a, van het besluit][ref4],
      vastgesteld op € 0,048 per kWh, en
        - voor wat betreft de correcties, bedoeld in [artikel 14, eerste lid, onderdelen b en c, van het besluit][ref5]
      vastgesteld op € 0 per kWh.

      2 Voor de vergelijking van de basisbedragen, bedoeld in [artikel 58, tweede lid, van het besluit][ref6], wordt het
      basisbedrag voor een productie-installatie als bedoeld in [artikel 62][ref7], vastgesteld op 0,1125, gedeeld door
      een correctiefactor van 1,25.


