    text: |-
      1 Het subsidieplafond voor het verlenen van subsidie voor de productie van hernieuwbare elektriciteit,
      hernieuwbaar gas en hernieuwbare warmte op grond van de [artikelen 4][ref1], [6][ref2], [8][ref3], [10][ref4],
      [12][ref5], [14][ref6], [16][ref7], [18][ref8], [20][ref9], [22][ref10], [24][ref11], [26, eerste lid][ref12],
      [28, eerste lid][ref13], [30, eerste lid][ref14], [32, eerste lid][ref15], [34, eerste lid][ref16], [36][ref17],
      [38][ref18], [40, eerste lid][ref19], [42, eerste lid][ref20], [44, eerste lid][ref21], [46][ref22],
      [48, eerste lid][ref23], [50, eerste lid][ref24], [52, eerste lid][ref25], [54][ref26], [56][ref27] en [62][ref28],
      die is aangevraagd in de periode van 31 maart 2015, 09:00 uur, tot 17 december 2015, 17:00 uur, bedraagt €
      3.500.000.000,–.

      2 De minister verdeelt het bedrag, genoemd in het eerste lid, op volgorde van binnenkomst van de aanvragen.

      3 Per categorie productie-installaties kan in de periode, genoemd in het eerste lid, per adres waarop een
      productie-installatie wordt geplaatst maximaal één aanvraag worden ingediend.

      4 De minister beslist afwijzend op een aanvraag om subsidie voor de productie van hernieuwbare elektriciteit,
      hernieuwbaar gas of hernieuwbare warmte door een productie-installatie van een categorie als bedoeld in het eerste
      lid indien geen toestemming van de eigenaar van de beoogde locatie is verkregen voor het plaatsen van de productie-
      installatie.

      5 Een subsidie als bedoeld in het eerste lid van meer dan € 400.000.000,– wordt verleend onder de opschortende
      voorwaarde dat binnen zes weken na afgifte van deze beschikking een uitvoeringsovereenkomst overeenkomstig de
      overeenkomst opgenomen in de bij deze regeling behorende [bijlage 1][ref29] tot stand is gekomen tussen de Staat en
      de subsidie-aanvrager.

      6 Indien voor dezelfde periode, of gedeeltelijk voor dezelfde periode, meerdere beschikkingen zijn afgegeven voor
      dezelfde productie-installatie en dezelfde soort hernieuwbare energie, worden voor de toepassing van het vijfde
      lid de subsidies die de subsidie-ontvanger ontvangt, bedoeld in [artikel 15][ref30] of [48 van het besluit][ref31],
      van de beschikkingen waarvan de periode waarover subsidie wordt verstrekt nog niet zijn aangevangen bij elkaar
      opgeteld.


