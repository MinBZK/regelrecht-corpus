  - number: '2.2'
    text: De minister verdeelt het bedrag, genoemd in het eerste lid, op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0036245/2019-01-01#Artikel2
  - number: '2.3'
    text: |-
      Per categorie productie-installaties kan in de periode, genoemd in het eerste lid, per adres waarop een productie-
      installatie wordt geplaatst maximaal één aanvraag worden ingediend.
    url: https://wetten.overheid.nl/BWBR0036245/2019-01-01#Artikel2
  - number: '2.4'
    text: |-
      De minister beslist afwijzend op een aanvraag om subsidie voor de productie van hernieuwbare elektriciteit,
      hernieuwbaar gas of hernieuwbare warmte door een productie-installatie van een categorie als bedoeld in het eerste
      lid indien geen toestemming van de eigenaar van de beoogde locatie is verkregen voor het plaatsen van de productie-
      installatie.
    url: https://wetten.overheid.nl/BWBR0036245/2019-01-01#Artikel2
  - number: '2.5'
    text: |-
      Een subsidie als bedoeld in het eerste lid van meer dan € 400.000.000,– wordt verleend onder de opschortende
      voorwaarde dat binnen zes weken na afgifte van deze beschikking een uitvoeringsovereenkomst overeenkomstig de
      overeenkomst opgenomen in de bij deze regeling behorende [bijlage 1][ref1] tot stand is gekomen tussen de Staat en
      de subsidie-aanvrager.


      [ref1]: https://wetten.overheid.nl/BWBR0036245
    url: https://wetten.overheid.nl/BWBR0036245/2019-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0036245
  - number: '2.6'
    text: |-
      Indien voor dezelfde periode, of gedeeltelijk voor dezelfde periode, meerdere beschikkingen zijn afgegeven voor
      dezelfde productie-installatie en dezelfde soort hernieuwbare energie, worden voor de toepassing van het vijfde
      lid de subsidies die de subsidie-ontvanger ontvangt, bedoeld in [artikel 15][ref1] of [48 van het besluit][ref2],
      van de beschikkingen waarvan de periode waarover subsidie wordt verstrekt nog niet zijn aangevangen bij elkaar
      opgeteld.


