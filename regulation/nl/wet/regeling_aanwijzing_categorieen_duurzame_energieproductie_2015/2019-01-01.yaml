      1 De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare elektriciteit, of hernieuwbare
      elektriciteit en hernieuwbare warmte uit biomassa geproduceerd door een productie-installatie met een nominaal
      vermogen groter dan of gelijk aan 100 MW voor de productie van elektriciteit door middel van kolen,

      a. waarbij gebruik wordt gemaakt van een bestaande installatie waarvoor op grond van de MEP subsidie van meer
      dan € 0,– is ontvangen, waarin biomassa als bedoeld in de nummers 110 tot en met 132 van de NTA 8003: 2008 wordt
      meegestookt, of biomassa als bedoeld in de nummers 110 tot en met 132 en 170 tot en met 179 van de NTA 8003: 2008
      wordt vergast en waarvan het aannemelijk is dat deze ten minste voor de duur van de subsidieperiode kan blijven
      produceren, of

      b. waarin biomassa als bedoeld in de nummers 110 tot en met 132 van de NTA 8003: 2008 wordt meegestookt, waarbij
      de delen van de productie-installatie die uitsluitend gebruikt worden voor de meestook van biomassa nieuw zijn, en
      waarvan het aannemelijk is dat deze ten minste voor de duur van de subsidieperiode kan blijven produceren.

      2 De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare elektriciteit, of hernieuwbare
      elektriciteit en hernieuwbare warmte uit biomassa geproduceerd door een productie-installatie als bedoeld in het
      eerste lid, voor maximaal 15% van de gerealiseerde jaarlijkse hernieuwbare energieproductie biomassa als bedoeld in
      NTA 8003: 2008, met uitzondering van de nummers 100, 101, 150 tot en met 179.

      3 Een producent aan wie subsidie is verstrekt op grond van het eerste lid draagt er zorg voor dat
      wordt aangetoond dat de gebruikte vloeibare biomassa voldoet aan de duurzaamheidscriteria, bedoeld in
      [artikel 17, eerste lid][ref1], van de richtlijn hernieuwbare energie.

      4 Een producent aan wie subsidie is verstrekt op grond van het eerste lid draagt er zorg voor dat
      voldoende aannemelijk wordt gemaakt dat de gebruikte biomassa, niet zijnde vloeibare biomassa, voldoet aan
      [artikel 7 van de algemene uitvoeringsregeling][ref2].

      5 Indien sprake is van productie van hernieuwbare elektriciteit en hernieuwbare warmte verstrekt de minister
      subsidie voor de geproduceerde hernieuwbare elektriciteit en 15% van de geproduceerde en nuttig aangewende
      hernieuwbare warmte.

      6 De maximale productie, bedoeld in [artikel 2, vijfde lid, van het besluit][ref3], voor de productie van
      hernieuwbare elektriciteit, of hernieuwbare elektriciteit en hernieuwbare warmte op grond van het eerste lid, die
      is aangevraagd in de periode van 31 maart 2015, 09:00 uur, tot 17 december 2015, 17:00 uur, bedraagt 55.555.555.555
      kWh.


      [ref1]: https://wetten.overheid.nl/BWBR0036245#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0023563#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0022735#Artikel2
