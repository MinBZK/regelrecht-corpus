  - number: '34.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare elektriciteit, of hernieuwbare
      elektriciteit en hernieuwbare warmte uit biomassa geproduceerd door een productie-installatie met een nominaal
      vermogen groter dan of gelijk aan 100 MW voor de productie van elektriciteit door middel van kolen,
    url: https://wetten.overheid.nl/BWBR0036245/2019-01-01#Artikel34
  - number: 34.1.a
    text: |-
      waarbij gebruik wordt gemaakt van een bestaande installatie waarvoor op grond van de MEP subsidie van meer dan
      € 0,– is ontvangen, waarin biomassa als bedoeld in de nummers 110 tot en met 132 van de NTA 8003: 2008 wordt
      meegestookt, of biomassa als bedoeld in de nummers 110 tot en met 132 en 170 tot en met 179 van de NTA 8003: 2008
      wordt vergast en waarvan het aannemelijk is dat deze ten minste voor de duur van de subsidieperiode kan blijven
      produceren, of
    url: https://wetten.overheid.nl/BWBR0036245/2019-01-01#Artikel34
  - number: 34.1.b
    text: |-
      waarin biomassa als bedoeld in de nummers 110 tot en met 132 van de NTA 8003: 2008 wordt meegestookt, waarbij de
      delen van de productie-installatie die uitsluitend gebruikt worden voor de meestook van biomassa nieuw zijn, en
      waarvan het aannemelijk is dat deze ten minste voor de duur van de subsidieperiode kan blijven produceren.
    url: https://wetten.overheid.nl/BWBR0036245/2019-01-01#Artikel34
  - number: '34.2'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare elektriciteit, of hernieuwbare
      elektriciteit en hernieuwbare warmte uit biomassa geproduceerd door een productie-installatie als bedoeld in het
      eerste lid, voor maximaal 15% van de gerealiseerde jaarlijkse hernieuwbare energieproductie biomassa als bedoeld in
      NTA 8003: 2008, met uitzondering van de nummers 100, 101, 150 tot en met 179.
    url: https://wetten.overheid.nl/BWBR0036245/2019-01-01#Artikel34
  - number: '34.3'
    text: |-
      Een producent aan wie subsidie is verstrekt op grond van het eerste lid draagt er zorg voor dat
      wordt aangetoond dat de gebruikte vloeibare biomassa voldoet aan de duurzaamheidscriteria, bedoeld in
      [artikel 17, eerste lid][ref1], van de richtlijn hernieuwbare energie.


      [ref1]: https://wetten.overheid.nl/BWBR0036245#Artikel17
    url: https://wetten.overheid.nl/BWBR0036245/2019-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0036245
        artikel: '17'
        paragraaf: '3'
  - number: '34.4'
    text: |-
      Een producent aan wie subsidie is verstrekt op grond van het eerste lid draagt er zorg voor dat voldoende
      aannemelijk wordt gemaakt dat de gebruikte biomassa, niet zijnde vloeibare biomassa, voldoet aan
      [artikel 7 van de algemene uitvoeringsregeling][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023563#Artikel7
    url: https://wetten.overheid.nl/BWBR0036245/2019-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0023563
        artikel: '7'
