    text: |-
      Indien sprake is van productie van hernieuwbare elektriciteit en hernieuwbare warmte verstrekt de minister subsidie
      voor de geproduceerde hernieuwbare elektriciteit en 15% van de geproduceerde en nuttig aangewende hernieuwbare
      warmte.
    url: https://wetten.overheid.nl/BWBR0036245/2019-01-01#Artikel34
  - number: '34.6'
    text: |-
      De maximale productie, bedoeld in [artikel 2, vijfde lid, van het besluit][ref1], voor de productie van
      hernieuwbare elektriciteit, of hernieuwbare elektriciteit en hernieuwbare warmte op grond van het eerste lid, die
      is aangevraagd in de periode van 31 maart 2015, 09:00 uur, tot 17 december 2015, 17:00 uur, bedraagt 55.555.555.555
      kWh.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel2
    url: https://wetten.overheid.nl/BWBR0036245/2019-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0022735
        artikel: '2'
  - number: '35.1'
    text: |-
      Subsidie als bedoeld in [artikel 34, eerste lid][ref1], wordt voor een periode van 8 jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0036245#Artikel34
    url: https://wetten.overheid.nl/BWBR0036245/2019-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0036245
        artikel: '34'
        paragraaf: '3'
  - number: '35.2'
    text: |-
