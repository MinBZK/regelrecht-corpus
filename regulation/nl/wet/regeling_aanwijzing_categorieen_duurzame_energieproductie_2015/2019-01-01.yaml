        artikel: '44'
        paragraaf: '3'
  - number: '49.1'
    text: |-
      Subsidie als bedoeld in [artikel 48, eerste lid][ref1], wordt voor een periode van 12 jaar verstrekt, de periode
      vangt niet eerder aan dan nadat de aanvraag om subsidie is gedaan, en de subsidieperiode van de subsidie verstrekt
      op grond van de MEP of OV-MEP, ten minste 10 jaar daarvoor is aangevangen.


      [ref1]: https://wetten.overheid.nl/BWBR0036245#Artikel48
    url: https://wetten.overheid.nl/BWBR0036245/2019-01-01#Artikel49
    references:
