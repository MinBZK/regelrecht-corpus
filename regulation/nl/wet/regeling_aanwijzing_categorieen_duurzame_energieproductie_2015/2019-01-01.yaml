    text: |-
      Productie-installaties als bedoeld in [artikel 34, eerste lid][ref1], worden aangewezen als productie-installaties
      als bedoeld in [artikel 48, derde lid, van het besluit][ref2] met dien verstande dat het verschil in kWh dat bij
      het aantal kWh dat het volgende jaar voor subsidie in aanmerking komt kan worden opgeteld, bedoeld in artikel 48,
      derde lid, van het besluit, wordt gemaximeerd op 25% van het aantal kWh dat het desbetreffende jaar voor subsidie
      in aanmerking komt zonder het daarbij opgetelde verschil in kWh vanwege minder geproduceerde kWh in voorgaande
      jaren. Het verschil in kWh dat bij het aantal kWh dat het volgende jaar voor subsidie in aanmerking komt kan
      worden opgeteld, kan alleen in dit volgende jaar worden benut en kan pas worden benut als het aantal kWh dat het
      desbetreffende jaar voor subsidie in aanmerking komt volledig is benut.


      [ref1]: https://wetten.overheid.nl/BWBR0036245#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel48
    url: https://wetten.overheid.nl/BWBR0036245/2019-01-01#Artikel3
