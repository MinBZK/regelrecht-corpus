        bwb_id: BWBR0018989
  - number: 44.1.c
    text: |-
      een productie-installatie voor de productie van hernieuwbare elektriciteit en hernieuwbare warmte door middel van
      thermische conversie van vaste of vloeibare biomassa.
    url: https://wetten.overheid.nl/BWBR0036245/2019-01-01#Artikel44
  - number: '44.2'
    text: |-
      Een producent aan wie subsidie is verstrekt op grond van het eerste lid, onderdeel c, draagt er zorg voor dat wordt
      aangetoond dat de gebruikte vloeibare biomassa voldoet aan de duurzaamheidscriteria, bedoeld in artikel 17, eerste
      lid, van de richtlijn hernieuwbare energie.
    url: https://wetten.overheid.nl/BWBR0036245/2019-01-01#Artikel44
  - number: '45.1'
    text: |-
      Subsidie als bedoeld in [artikel 44, eerste lid][ref1], wordt voor een periode van 5 jaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0036245#Artikel44
    url: https://wetten.overheid.nl/BWBR0036245/2019-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0036245
        artikel: '44'
        paragraaf: '3'
  - number: '45.2'
    text: |-
      De subsidie-ontvanger draagt er zorg voor dat de hernieuwbare warmte, opgewekt door de productie-installatie,
      bedoeld in [artikel 44, eerste lid][ref1], nuttig wordt gebruikt binnen 18 maanden na de datum van inwerkingtreding
      van de beschikking tot subsidieverlening.


