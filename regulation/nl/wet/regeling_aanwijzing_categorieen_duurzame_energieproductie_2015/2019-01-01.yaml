  - number: '48.1'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare elektriciteit en hernieuwbare warmte,
      of hernieuwbare elektriciteit, geproduceerd door een bestaande productie-installatie waarvoor op grond van de MEP
      of OV-MEP subsidie van meer dan € 0,– is ontvangen en waarvoor op het moment van aanvraag de subsidieperiode op
      grond van voorgenoemde subsidieregelingen ten minste 7 jaar daarvoor is aangevangen:
    url: https://wetten.overheid.nl/BWBR0036245/2019-01-01#Artikel48
  - number: 48.1.a
    text: |-
      waarmee hernieuwbare elektriciteit en hernieuwbare warmte wordt geproduceerd uitsluitend door middel van
      allesvergisting en waarbij het nominaal elektrisch vermogen ten minste 20% van de som van het nominale warmte en
      elektrisch vermogen bedraagt; of
    url: https://wetten.overheid.nl/BWBR0036245/2019-01-01#Artikel48
  - number: 48.1.b
    text: |-
      waarmee hernieuwbare elektriciteit en hernieuwbare warmte wordt geproduceerd uitsluitend door middel van vergisting
      en co-vergisting van dierlijke mest en waarbij het nominaal elektrisch vermogen ten minste 20% van de som van het
      nominale warmte en elektrisch vermogen bedraagt.
    url: https://wetten.overheid.nl/BWBR0036245/2019-01-01#Artikel48
  - number: '48.2'
    text: |-
      Indien de aanvrager in aanvulling op de subsidie op grond van de MEP of OV-MEP, subsidie heeft ontvangen
      op grond van [artikel 116 van de Regeling aanwijzing categorieën duurzame energieproductie 2012][ref1],
      [artikel 72 van de Regeling aanwijzing categorieën duurzame energieproductie 2013][ref2],
      [artikel 72 van de Regeling aanwijzing categorieën duurzame energieproductie 2014][ref3], of [artikel 44][ref4]
      van deze regeling, eindigt de subsidieperiode van deze subsidie in ieder geval op het moment dat de subsidieperiode
      van de subsidie verstrekt op grond van het eerste lid aanvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0031291#Artikel116
      [ref2]: https://wetten.overheid.nl/BWBR0032881#Artikel72
      [ref3]: https://wetten.overheid.nl/BWBR0034817#Artikel72
      [ref4]: https://wetten.overheid.nl/BWBR0036245#Artikel44
    url: https://wetten.overheid.nl/BWBR0036245/2019-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0031291
        artikel: '116'
