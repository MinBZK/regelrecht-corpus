      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte geproduceerd door:

      a. een productie-installatie, bestaande uit één of meerdere doubletten, waarmee hernieuwbare warmte wordt
      geproduceerd uitsluitend door middel van één of meerdere geothermische bronnen met een diepte van minimaal 500
      meter.

      b. een productie-installatie, bestaande uit één of meerdere doubletten, waarmee hernieuwbare warmte wordt
      geproduceerd uitsluitend door middel van één of meerdere geothermische bronnen met een diepte van minimaal 3500
      meter.
