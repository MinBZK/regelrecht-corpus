      1 Productie-installaties als bedoeld in de [artikelen 26, eerste lid][ref1], [34, eerste lid, onderdeel a][ref2],
      [48, eerste lid][ref3], [50, eerste lid][ref4], en [52, eerste lid][ref5], worden aangewezen als productie-
      installaties als bedoeld in [artikel 3, eerste lid, onderdeel a van het besluit][ref6].

      2 Productie-installaties als bedoeld in [artikel 4, onderdeel b][ref7], worden aangewezen als productie-
      installaties als bedoeld in [artikel 3, eerste lid, onderdeel c en derde lid, onderdeel c, van het besluit][ref8].

      3 Productie-installaties als bedoeld in de [artikelen 44, eerste lid][ref9], worden aangewezen als productie-
      installaties als bedoeld in [artikel 3, eerste lid, onderdeel d, van het besluit][ref10].

      4 Productie-installaties als bedoeld in de [artikelen 26, eerste lid][ref11], [48, eerste lid][ref12],
      [50, eerste lid][ref13] en [52, eerste lid][ref14], worden, indien subsidie is verstrekt op grond
      van [artikel 116 van de Regeling aanwijzing categorieën duurzame energieproductie 2012][ref15],
      [artikel 72 van de Regeling aanwijzing categorieën duurzame energieproductie 2013][ref16],
      [artikel 72 van de Regeling aanwijzing categorieën duurzame energieproductie 2014][ref17] of
      [artikel 44][ref18] van deze regeling, aangewezen als productie-installaties als bedoeld in
      [artikel 3, tweede lid, onderdeel a, van het besluit][ref19].

      5 Productie-installaties als bedoeld in de [artikelen 4, onderdeel b][ref20], [6][ref21], [22][ref22],
      [24][ref23], [26, eerste lid][ref24], [34, eerste lid][ref25], [40, eerste lid][ref26], [48, eerste lid][ref27],
      [50, eerste lid][ref28], [52, eerste lid][ref29], [54][ref30] en [56][ref31], worden aangewezen als productie-
      installaties als bedoeld in [artikel 3, vierde lid, van het besluit][ref32].

      6 Productie-installaties als bedoeld in [artikel 44, eerste lid][ref33], worden, indien subsidie is verstrekt op
      grond van de [regeling aanwijzing categorieën duurzame energieproductie 2008][ref34], aangewezen als productie-
      installaties als bedoeld in [artikel 3, tweede lid, onderdeel a, en vierde lid van het besluit][ref35].

      7 Productie-installaties als bedoeld in [artikel 44, eerste lid][ref36], worden, indien subsidie
      is verstrekt op grond van de MEP of OV-MEP, aangewezen als productie-installaties als bedoeld in
      [artikel 3, vierde lid, van het besluit][ref37].

      8 Productie-installaties als bedoeld in de [artikelen 4][ref38], [6][ref39], [8][ref40], [10][ref41], [12][ref42],
      [14][ref43], [16][ref44], [18][ref45] en [20][ref46] worden aangewezen als productie-installaties als bedoeld in
      [artikel 15, derde, vierde en zesde lid, van het besluit][ref47] met dien verstande dat het verschil in kWh dat bij
      het aantal geproduceerde kWh van het volgende jaar kan worden opgeteld, bedoeld in artikel 15, vierde lid, van het
      besluit, wordt gemaximeerd op 25% van het aantal kWh dat het desbetreffende jaar voor subsidie in aanmerking komt.

      9 Productie-installaties als bedoeld in [artikel 62][ref48], worden aangewezen als productie-installaties als
      bedoeld in [artikel 15, zesde lid, van het besluit][ref49].

      10 Productie-installaties als bedoeld in de [artikelen 22][ref50], [24][ref51], [26, eerste lid][ref52],
      [28, eerste lid][ref53], en [56][ref54] worden aangewezen als productie-installaties als bedoeld in
      [artikel 32, derde en vierde lid, van het besluit][ref55] met dien verstande dat het verschil in kWh dat bij het
      aantal geproduceerde kWh van het volgende jaar kan worden opgeteld, bedoeld in artikel 32, vierde lid, van het
      besluit, wordt gemaximeerd op 25% van het aantal kWh dat het desbetreffende jaar voor subsidie in aanmerking komt.

      11 Productie-installaties als bedoeld in de [artikelen 22][ref56] en [26, eerste lid][ref57], worden aangewezen als
      productie-installaties als bedoeld in [artikel 32, zesde lid van het besluit][ref58].

      12 Productie-installaties als bedoeld in [artikel 54][ref59], worden aangewezen als productie-installaties als
      bedoeld in [artikel 32, zevende lid van het besluit][ref60].

      13 Productie-installaties als bedoeld in de [artikelen 30, eerste lid][ref61], [32, eerste lid][ref62],
      [36][ref63], [38][ref64], [40, eerste lid][ref65], [42, eerste lid][ref66], [44, eerste lid][ref67],
      [46][ref68], [48, eerste lid][ref69], [50, eerste lid][ref70], [52, eerste lid][ref71],
      [54][ref72], en [56, eerste lid][ref73], worden aangewezen als productie-installaties als bedoeld in
      [artikel 48, derde en vierde lid, van het besluit][ref74] met dien verstande dat het verschil in kWh dat bij het
      aantal geproduceerde kWh van het volgende jaar kan worden opgeteld, bedoeld in artikel 48, vierde lid, van het
      besluit, wordt gemaximeerd op 25% van het aantal kWh dat het desbetreffende jaar voor subsidie in aanmerking komt.

      14 Productie-installaties als bedoeld in [artikel 34, eerste lid][ref75], worden aangewezen als productie-
      installaties als bedoeld in [artikel 48, derde lid, van het besluit][ref76] met dien verstande dat het verschil
      in kWh dat bij het aantal kWh dat het volgende jaar voor subsidie in aanmerking komt kan worden opgeteld, bedoeld
      in artikel 48, derde lid, van het besluit, wordt gemaximeerd op 25% van het aantal kWh dat het desbetreffende jaar
      voor subsidie in aanmerking komt zonder het daarbij opgetelde verschil in kWh vanwege minder geproduceerde kWh in
      voorgaande jaren. Het verschil in kWh dat bij het aantal kWh dat het volgende jaar voor subsidie in aanmerking komt
      kan worden opgeteld, kan alleen in dit volgende jaar worden benut en kan pas worden benut als het aantal kWh dat
      het desbetreffende jaar voor subsidie in aanmerking komt volledig is benut.

      15 Productie-installaties als bedoeld in de [artikelen 34, eerste lid][ref77], [38][ref78],
      [42, eerste lid][ref79], [48, eerste lid][ref80], [50, eerste lid][ref81], [54][ref82], en [56, eerste lid][ref83],
      worden aangewezen als productie-installaties als bedoeld in [artikel 48, zevende lid van het besluit][ref84].

      16 Productie-installaties als bedoeld in de [artikelen 8][ref85], [10][ref86], [12][ref87], [14][ref88],
      [22][ref89], [26, eerste lid][ref90], [48, eerste lid][ref91], [52, eerste lid][ref92], [54][ref93], en [62][ref94]
      worden aangewezen als productie-installaties als bedoeld in [artikel 56, eerste lid, van het besluit][ref95].

      17 Productie-installaties als bedoeld in de [artikelen 4][ref96], [6][ref97], [16][ref98], [18][ref99],
      [20][ref100], [24][ref101], [28, eerste lid][ref102], [30, eerste lid][ref103], [32, eerste lid][ref104],
      [34, eerste lid][ref105], [36][ref106], [38][ref107], [40, eerste lid][ref108], [42, eerste lid][ref109],
      [44, eerste lid][ref110], [46][ref111], [50][ref112] en [56][ref113], worden aangewezen als productie-installaties
      als bedoeld in [artikel 56, eerste lid, derde volzin, van het besluit][ref114].


