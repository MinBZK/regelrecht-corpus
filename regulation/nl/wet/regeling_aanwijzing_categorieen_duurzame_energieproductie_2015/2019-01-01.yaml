      1 De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare elektriciteit en hernieuwbare
      warmte, of hernieuwbare elektriciteit, geproduceerd door een bestaande productie-installatie waarvoor op grond van
      de MEP of OV-MEP subsidie van meer dan € 0,– is ontvangen en waarvoor op het moment van aanvraag de subsidieperiode
      op grond van voorgenoemde subsidieregelingen ten minste 7 jaar daarvoor is aangevangen:

      a. waarmee hernieuwbare elektriciteit en hernieuwbare warmte wordt geproduceerd uitsluitend door middel van
      allesvergisting en waarbij het nominaal elektrisch vermogen ten minste 20% van de som van het nominale warmte en
      elektrisch vermogen bedraagt; of

      b. waarmee hernieuwbare elektriciteit en hernieuwbare warmte wordt geproduceerd uitsluitend door middel van
      vergisting en co-vergisting van dierlijke mest en waarbij het nominaal elektrisch vermogen ten minste 20% van de
      som van het nominale warmte en elektrisch vermogen bedraagt.

      2 Indien de aanvrager in aanvulling op de subsidie op grond van de MEP of OV-MEP, subsidie heeft ontvangen
      op grond van [artikel 116 van de Regeling aanwijzing categorieën duurzame energieproductie 2012][ref1],
      [artikel 72 van de Regeling aanwijzing categorieën duurzame energieproductie 2013][ref2],
      [artikel 72 van de Regeling aanwijzing categorieën duurzame energieproductie 2014][ref3], of [artikel 44][ref4]
      van deze regeling, eindigt de subsidieperiode van deze subsidie in ieder geval op het moment dat de subsidieperiode
      van de subsidie verstrekt op grond van het eerste lid aanvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0031291#Artikel116
