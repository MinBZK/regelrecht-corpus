articles:
  - number: '1'
    text: |-
      In deze landsverordening wordt verstaan onder: - *Minister:* de Minister van Arbeid en Sociale Zaken;
        - *bank:* de Sociale Verzekeringsbank;
        - *werkgever:* iedere natuurlijke of rechtspersoon, die hier te lande een of meer werknemers arbeid doet
      verrichten, alsmede de natuurlijke of rechtspersoon die, hier te lande gevestigd, een of meer werknemers, die
      eveneens hier te lande gevestigd zijn, arbeid doet verrichten in het buitenland;
        - *werknemer:* een ieder die voor een werkgever in dienstverband of persoonlijk in aangenomen werk arbeid verricht,
      behalve: 'voor wat degene betreft, die persoonlijk in aangenomen werk arbeid verricht: indien hij zelf door de bank'
      als werkgever is aangemerkt; ouders en inwonende kinderen van de werkgever tenzij van een normaal dienstverband
      tegen het gebruikelijke loon sprake is; huispersoneel en thuiswerkers; losse werknemer, waaronder wordt verstaan
      werknemers die als regel geen twaalf achtereenvolgende dagen, niet medegerekend zondagen en daarmede krachtens
      de Arbeidsregeling 1952 (P.B. 1958, no. 24) gelijkgestelde dagen, in dienst van de werkgever zijn; degene, die
      een dagloon geniet hoger dan NAF. 164,25 indien voor hem een 6-daagse werkweek geldt, ongeacht of dit loon bij
      één of meerdere werkgevers wordt genoten; degene, die een dagloon geniet hoger dan NAF. 197,10 indien voor hem
      een 5-daagse werkweek geldt, ongeacht of dit loon bij één of meerdere werkgevers wordt genoten; de kapitein en
      schepelingen op Nederlands-Antilliaanse zeeschepen; degene, die in dienst is van een publiekrechtelijk lichaam en
      aan de voor hem geldende rechtspositieregelingen aanspraak op tegemoetkoming bij ziekte kan ontlenen. Indien de in
      aangenomen werk arbeidende persoon, die niet zelf door de bank als werkgever is aangemerkt, zich bij het verrichten
      van zijn arbeid door anderen laat bijstaan, worden ook die anderen beschouwd als werknemer van de werkgever, van
      wie het werk is aangenomen. Bij landsbesluit houdende algemene maatregelen kunnen personen, die ingevolge het
      voorgaande niet de hoedanigheid van werknemer hebben, als werknemer worden aangemerkt, eventueel onder nader te
      stellen voorwaarden;
        - *gewezen werknemer:* een persoon die: niet meer aangemerkt kan worden als werknemer in de zin van dit artikel;
      ingezetene is; geen aanspraak kan maken op geneeskundige behandeling en verpleging wegens ziekte dan krachtens deze
      landsverordening; niet de leeftijd van 60 jaar heeft bereikt; en geen inkomen geniet anders dan verstrekkingen ten
      laste van één van de eilandgebieden van de Nederlandse Antillen;
        - *gezinsleden:* de echtgenote of echtgenoot van een als kostwinner aangemerkte werknemer of gewezen werknemer
      alsmede diens kinderen en indien voornoemde personen: ingezetenen zijn; geen aanspraak als werknemer of gewezen
      werknemer kunnen maken op geneeskundige behandeling en verpleging wegens ziekte krachtens deze landsverordening of
      een andere landsverordening; en de leeftijd van zestig jaar niet hebben bereikt;
        - *kinderen:* minderjarige wettige en natuurlijke kinderen van de werknemer of gewezen werknemer; minderjarige
      onwettige kinderen ten aanzien van wie de mannelijke werknemer of gewezen werknemer bij rechterlijk vonnis
      is veroordeeld tot het voorzien in het levensonderhoud danwel bij authentieke akte de onderhoudsplicht heeft
      erkend, of die met hem in een gezinsverband samenwonen; minderjarige aangehuwde en pleegkinderen behorende
      tot het gezinsverband van de werknemer of gewezen werknemer; en kinderen, genoemd in de hieraan voorafgaande
      gedachtenstrepen, die meerderjarig zijn geworden en wier tijd geheel of grotendeels in beslag wordt genomen door
      of in verband met het volgen van onderwijs of van een beroepsopleiding voorzover zij de leeftijd van 25 jaar
      niet hebben bereikt; pleegkinderen: de kinderen die door de werknemer of gewezen werknemer worden onderhouden en
      opgevoed als waren zij eigen kinderen;
        - *kostwinner:* de werknemer of gewezen werknemer die geheel of in overwegende mate voorziet in het levensonderhoud
      van de gezinsleden, en die indien binnen een gezinsverband meerdere inkomens zijn, de persoon met het hoogste
      inkomen is, of indien de inkomens gelijk zijn, de man is;
        - *verzekerde:* een ieder die krachtens de bepalingen van deze landsverordening tegenover de bank recht heeft op
      tegemoetkoming, bestaande uit geneeskundige behandeling en verpleging, alsook voor wat betreft de werknemer op
      uitkeringen in geld;
        - *Behandelende geneeskundige:* de geneeskundige die op aanwijzing of met goedvinden van de bank de werknemer
      onderzoekt of behandelt;
        - *Controlerende geneeskundige:* de geneeskundige die als zodanig door de bank is aangewezen;
        - *Arbeidsongeschiktheid:* de toestand waarin de werknemer verkeert, die als gevolg van ziekte gedurende een etmaal
      of langer niet in staat is om zijn normale arbeid te verrichten of deze arbeid zo lang niet mag verrichten hetzij
      om een medisch noodzakelijk onderzoek mogelijk te maken hetzij om te voorkomen dat zijn genezing wordt belemmerd,
      dan wel om besmetting van anderen te voorkomen;
        - *Loon:* elke uitkering in welke vorm ook welke de werknemer als vergoeding voor zijn arbeid ten laste van zijn
      werkgever geniet, alsook ontvangsten van derden, welke van invloed zijn op de voorwaarden der arbeidsovereenkomst,
      behalve: vergoeding voor het verrichten van overwerk in de zin van de Arbeidsregeling 1952 (P.B. 1958, no. 24);
        - *de toeslag op het loon ingevolge artikel 58 van de Landsverordening Algemene Ouderdomsverzekering (P.B.
      1960, no. 83) en artikel 52 van de Landsverordening Algemene Weduwen- en wezenverzekering (PB. 1965, no. 194):*
      de sociale verzekeringspremies welke ten laste van de werkgever komen; vergoeding boven het normale loon voor
      het tijdelijk verrichten van andere dan de normale arbeid, waartoe hij ingevolge arbeidsovereenkomst met zijn
      werkgever verplicht is; vergoeding welke bij uitzondering wordt gegeven voor het verrichten van een boven het
      normale liggende arbeidsprestatie; hetgeen ingevolge artikel 6, derde lid, onderdelen d tot en met h, van de
      Landsverordening op de Loonbelasting 1976 (P.B. 1975, no. 254) niet tot het loon wordt gerekend; de verplichte
      bijdragen van de werkgever in spaarfondsen; uitkeringen voor opleiding of studie van de kinderen; gratificaties bij
      verjaardagen of ambtsjubilea; kwijtscheldingen van leningen verstrekt door de werkgever; de financiële voordelen
      uit geldleningen met een lage rente verstrekt door de werkgever;
        - *dagloon van de werknemer voor wie een 6-daagse werkweek geldt:* bij een uurloon: de geldswaarde van het loon
      per uur, vermenigvuldigd met het aantal werkuren per week van de betrokken werknemer, het verkregen produkt gedeeld
      door 6; bij een weekloon: de geldswaarde van het loon per week gedeeld door 6; bij een maandloon: de geldswaarde
      van het loon per maand vermenigvuldigd met 3 en gedeeld door 78;
        - *dagloon van de werknemer voor wie een 5-daagse werkweek geldt:* bij een uurloon: de geldswaarde van het loon
      per uur, vermenigvuldigd met het aantal werkuren per week van de betrokken werknemer, het verkregen produkt gedeeld
      door 5; bij een weekloon: de geldswaarde van het loon per week gedeeld door 5; bij een maandloon: de geldswaarde
      van het loon per maand vermenigvuldigd met 3 en gedeeld door 65.
        - *inkomen:* het zuiver inkomen in de zin van de Landsverordening op de inkomstenbelasting 1943 (P.B. 1956, no. 9).
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel1
  - number: 1a.1
    text: |-
      Voor de vaststelling of een werknemer aangemerkt wordt als werknemer in de zin van [artikel 1][ref1] wordt tot
      het einde van een kalenderjaar geen rekening gehouden met wijzigingen van het loon, welke tijdens de duur van
      het dienstverband onderscheidenlijk van de verrichting van het aangenomen werk na 1 november van het voorafgaande
      kalenderjaar plaatsvinden of hebben plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0028728#Artikel1
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0028728
        artikel: '1'
  - number: 1a.2
    text: |-
      In afwijking van het eerste lid wordt, ingeval de werknemer tengevolge van een wijziging van werkgever na 1
      november van het voorafgaande kalenderjaar een dagloon geniet hoger dan het dagloon, genoemd in [artikel 1][ref1],
      onder «werknemer» voor een 6-daagse onderscheidenlijk voor een 5-daagse werkweek, voor de vaststelling of deze
      werknemer aangemerkt wordt als werknemer in de zin van artikel 1, uitgegaan van het bij de nieuwe werkgever genoten
      dagloon.


      [ref1]: https://wetten.overheid.nl/BWBR0028728#Artikel1
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0028728
        artikel: '1'
  - number: 1b
    text: |-
      De bedragen, genoemd in [artikel 1][ref1] onder «werknemer», kunnen bij landsbesluit, houdende algemene
      maatregelen, worden aangepast aan de ontwikkeling van de prijsindexcijfers van de gezinsconsumptie. De aanpassing
      heeft plaats met ingang van de eerste dag van enig kalenderjaar op basis van de stijging welke het prijsindexcijfer
      voor de maand augustus daaraan voorafgaande aangeeft ten opzichte van het prijsindexcijfer voor de maand augustus
      van het voorafgaande jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028728#Artikel1
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0028728
        artikel: '1'
  - number: 1c
    text: |-
      De gezinsleden worden alleen verzekerd indien de werknemer onderscheidenlijk de gewezen werknemer ten genoegen van
      de bank schriftelijk heeft aangetoond dat hij of zij als kostwinner in de zin van deze landsverordening kan worden
      aangemerkt.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel1c
  - number: '2.1'
    text: |-
      Werkgever en werknemer stellen bij de aanvang van het dienstverband onderscheidenlijk de aanvang van de
      werkzaamheden en telkens wanneer het loon gewijzigd wordt, het dagloon vast met inachtneming van het daaromtrent in
      [artikel 1][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0028728#Artikel1
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028728
        artikel: '1'
  - number: '2.2'
    text: |-
      Indien het loon geheel of gedeeltelijk bestaat uit huisvesting, verstrekkingen in natura, onderricht of
      geldelijke uitkeringen waarvan de grootte niet bij voorbaat vaststaat zoals provisie, commissie, tantième,
      fooien, vergoedingen voor aangenomen werk e.d., bepalen werkgever en werknemer ter vaststelling van het dagloon de
      gemiddelde geldswaarde daarvan.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel2
  - number: '2.3'
    text: |-
      Indien het aantal werkuren per week, in het geval een uurloon wordt betaald, niet bij voorbaat vaststaat, bepalen
      werkgever en werknemer ter vaststelling van het dagloon het te verwachten gemiddeld aantal werkuren per week.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel2
  - number: '2.4'
    text: |-
      De bank kan al dan niet op verzoek van werkgever of werknemer het dagloon vaststellen of het vastgestelde dagloon
      wijzigen. Zij brengt haar beslissing, welke in de plaats treedt van de beslissing van werkgever en werknemer,
      schriftelijk en met redenen omkleed ter kennis van de werkgever en de werknemer.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel2
  - number: '2.5'
    text: |-
      Bij landsbesluit, houdende algemene maatregelen kunnen regelen worden vastgesteld, welke bij de bepaling van de
      geldswaarde van het niet in geld genoten loon moeten worden in acht genomen.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel2
  - number: '3.1'
    text: |-
      De werknemer heeft in geval van ziekte krachtens de bepalingen van deze landsverordening tegenover de bank recht
      op tegemoetkoming, bestaande uit geneeskundige behandeling en verpleging, en uitkeringen in geld. De gezinsleden en
      de gewezen werknemer hebben in geval van ziekte krachtens de bepalingen van deze landsverordening tegenover de bank
      recht op tegemoetkoming, bestaande uit geneeskundige behandeling en verpleging.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel3
  - number: '3.2'
    text: Met ziekte worden gelijkgesteld zwangerschap en bevalling van de vrouwelijke verzekerde.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel3
  - number: '3.3'
    text: |-
      Met ziekte wordt tevens gelijkgesteld lichamelijk letsel als gevolg van een ongeval, tenzij de werknemer op grond
      daarvan rechten ontleent aan de Landsverordening Ongevallenverzekering.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel3
  - number: '4.1'
    text: De verzekerde heeft recht op geneeskundige behandeling en verpleging met ingang van de dag van de ziekmelding.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel4
  - number: '4.2'
    text: 'De geneeskundige behandeling en verpleging omvat:'
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel4
  - number: 4.2.a
    text: |-
      geneeskundig onderzoek en geneeskundige behandeling met inbegrip van specialistisch onderzoek en specialistische
      behandeling;
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel4
  - number: 4.2.b
    text: verpleging in een ziekeninrichting met inbegrip van verblijf ter observatie;
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel4
  - number: 4.2.c
    text: verstrekking van geneesmiddelen en verbandmiddelen;
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel4
  - number: 4.2.d
    text: |-
      tandheelkundige behandeling ter genezing van een mondziekte welke niet terug te brengen is tot een geval van
      caries;
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel4
  - number: 4.2.e
    text: verloskundige hulp, voor- en nabehandeling bij zwangerschap en bevalling;
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel4
  - number: 4.2.f
    text: vervoer;
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel4
  - number: '4.3'
    text: |-
      Op schriftelijk verzoek van de verzekerde kan de bank bepalen dat in plaats van geneeskundige behandeling en
      verpleging een vergoeding wordt verstrekt overeenkomstig de regelen daaromtrent bij landsbesluit, houdende algemene
      maatregelen vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel4
  - number: '5.1'
    text: |-
      De werknemer die als gevolg van ziekte arbeidsongeschikt is, heeft recht op een uitkering in geld, ziekengeld
      genaamd, met ingang van de derde dag na die van de ziekmelding. Niettemin wordt over de dag van de ziekmelding
      en de twee daarop volgende dagen ziekengeld uitgekeerd, indien naar het oordeel van de behandelende geneeskundige
      de ziekte opneming in een ziekeninrichting noodzakelijk maakt. Het ziekengeld wordt over de bedoelde drie dagen
      eveneens uitgekeerd, indien de duur van de ziekte tengevolge van dezelfde ziekteoorzaak langer dan drie dagen
      bedraagt, ook wanneer geen opneming in een ziekeninrichting noodzakelijk is geweest. Ter zake van eenzelfde
      ziekteoorzaak vervalt dit recht twee jaar nadien, indien het betreft een arbeidsovereenkomst aangegaan voor
      onbepaalde tijd, ongeacht het voortduren van de arbeidsovereenkomst. Voor een arbeidsovereenkomst aangegaan voor
      bepaalde tijd vervalt dit recht na verloop van de periode waarvoor zij is aangegaan maar uiterlijk twee jaren na de
      dag van de ziektemelding wegens eenzelfde ziekteoorzaak. Indien een overeenkomst voor bepaalde tijd verlengd wordt,
      is het bepaalde met betrekking tot arbeidsovereenkomsten aangegaan voor onbepaalde tijd van toepassing. In geval
      van zwangerschap wordt de vrouwelijke arbeider geacht gedurende de duur van het zwangerschaps- en bevallingsverlof,
      bedoeld in artikel 1614ca van het Burgerlijk Wetboek van de Nederlandse Antillen, arbeidsongeschikt te zijn.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel5
  - number: '5.2'
    text: |-
      Het ziekengeld bedraagt per dag 80% van het dagloon van de werknemer maar niet meer dan 80% van het dagloon,
      genoemd in [artikel 1][ref1], onder «werknemer».


      [ref1]: https://wetten.overheid.nl/BWBR0028728#Artikel1
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028728
        artikel: '1'
  - number: '5.3'
    text: |-
      Indien het loon met terugwerkende kracht is verhoogd, wordt ter bepaling van het ziekengeld met deze verhoging
      rekening gehouden vanaf het tijdstip dat de verhoging van het loon door de werkgever aan de werknemer is
      uitbetaald.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel5
  - number: '5.4'
    text: 'De werknemer heeft geen recht op ziekengeld:'
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel5
  - number: 5.4.a
    text: |-
      over de zondagen of de daarvoor voor hem in de plaats tredende vrije dagen, terwijl de werknemer voor wie een 5-
      daagse werkweek geldt bovendien geen recht heeft op ziekengeld over de vrije zaterdagen of de daarvoor voor hem in
      de plaats tredende vrije dagen;
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel5
  - number: 5.4.b
    text: over de periode dat hem ziekengeld ter zake van een andere ziekte wordt uitgekeerd.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel5
  - number: '5.5'
    text: |-
      Wanneer de werknemer tijdens zijn arbeidsongeschiktheid van zijn werkgever loon ontvangt, wordt het ziekengeld
      per dag verminderd met het bedrag, waarmede het ziekengeld en het loon per dag tezamen het dagloon, waarnaar het
      ziekengeld is berekend, overtreft.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel5
  - number: '5.6'
    text: |-
      Tijdens het dienstverband of de werkzaamheden is de werkgever in geval van arbeidsongeschiktheid van de werknemer
      verplicht een uitkering gelijk aan het ziekengeld waarop de werknemer over de betreffende loontermijn tegenover de
      bank recht heeft, aan de werknemer uit te betalen op de dag waarop het loon moet worden uitbetaald of zou moeten
      worden uitbetaald indien de werknemer niet arbeidsongeschikt zou zijn. De werkgever die een uitkering volgens het
      bepaalde in de voorgaande volzin heeft uitbetaald heeft, in plaats van de werknemer, tegenover de bank recht op het
      betreffende ziekengeld en op uitbetaling daarvan uiterlijk zeven dagen na schriftelijke aanvrage bij de bank, in
      te dienen na afloop van de maand waarin de uitkering wordt uitbetaald. Indien de werkgever de uitkering niet tijdig
      uitbetaalt, keert de bank het ziekengeld aan de werknemer uit.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel5
  - number: '5.7'
    text: |-
      De Bank is bevoegd om op grond van verdragen, convenanten en andersoortige overeenkomsten met uitvoerders van
      instellingen van sociale voorzieningen, het ziekengeld van een werknemer te verminderen ter ontneming van een ten
      onrechte verkregen voordeel van de werknemer op het gebied van sociale voorzieningen.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel5
  - number: '5.8'
    text: |-
      De Bank is eveneens bevoegd om het ziekengeld van een werknemer te verminderen ter ontneming van een ten onrechte
      verkregen voordeel van de werknemer op het gebied van de door de Bank uitgevoerde sociale verzekeringswetten.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel5
  - number: '5.9'
    text: |-
      De in het zevende en achtste lid bedoelde vermindering kan ineens geschieden indien het ten onrechte genoten
      voordeel niet groter is dan een derde deel van het door de Bank verstrekte ziekengeld. In alle andere gevallen kan
      de vermindering niet meer bedragen dan een derde deel van het ziekengeld.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel5
  - number: '6.1'
    text: |-
      Zo spoedig mogelijk deelt de bank, mede aan de hand van de bevindingen en voorschriften van de behandelende
      geneeskundige, aan de werknemer schriftelijk mede welke tegemoetkoming hem zal worden verstrekt en eventueel dat
      en op welke gronden zij zich niet of niet langer tot tegemoetkoming gehouden acht. De werknemer stelt de werkgever
      onverwijld van deze mededeling in kennis.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel6
  - number: '6.2'
    text: 'Zodra de behandelende geneeskundige bevindt dat de werknemer:'
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel6
  - number: 6.2.a
    text: zich onder geneeskundige behandeling moet stellen;
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel6
  - number: 6.2.b
    text: zich niet of niet langer onder geneeskundige behandeling behoeft te stellen;
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel6
  - number: 6.2.c
    text: als bedlegerig patiënt behandeld moet worden;
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel6
  - number: 6.2.d
    text: niet of niet langer als bedlegerig patiënt behandeld behoeft te worden;
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel6
  - number: 6.2.e
    text: arbeidsongeschikt is;
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel6
  - number: 6.2.f
    text: niet of niet langer arbeidsongeschikt is;
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel6
  - number: '6.3'
    text: |-
      Het tweede lid is, met uitzondering van de tekst na de twee laatste gedachtenstrepen, van overeenkomstige
      toepassing op de gezinsleden en gewezen werknemers.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel6
  - number: '7.1'
    text: 'De werknemer heeft geen recht op tegemoetkoming of verliest dit recht:'
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel7
  - number: 7.1.a
    text: |-
      indien de ziekte te wijten is aan zijn opzet of grove schuld dan wel aan het gebruik van alcoholhoudende drank of
      bedwelmende middelen;
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel7
  - number: 7.1.b
    text: indien en zolang hij zich niet onder behandeling van de behandelende geneeskundige heeft gesteld;
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel7
  - number: 7.1.c
    text: indien hij zich schuldig maakt aan gedragingen waardoor zijn genezing wordt belemmerd;
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel7
  - number: 7.1.d
    text: |-
      indien hij niet op de tijden en plaatsen, door de bank aangewezen, de behandelende geneeskundige toestaat hem te
      onderzoeken of te behandelen dan wel diens voorschriften niet opvolgt of zich daarnaast aan andere geneeskundige
      behandeling onderwerpt;
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel7
  - number: 7.1.e
    text: |-
      indien hij niet op de tijden en plaatsen, door de bank aangewezen, de controlerende geneeskundige toestaat hem
      te onderzoeken;
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel7
  - number: 7.1.f
    text: |-
      indien hij de aanwijzingen van de controlerende geneeskundige, ook wanneer deze afwijken van de voorschriften van
      de behandelende geneeskundige, niet opvolgt;
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel7
  - number: 7.1.g
    text: indien hij zonder de toestemming van de bank het eiland verlaat waar hem de tegemoetkoming wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel7
  - number: 7.1.h
    text: |-
      indien en voor zoveel hij, met betrekking tot de ziekte, recht heeft op tegemoetkoming krachtens de
      Landsverordening Ongevallenverzekering of krachtens enige wettelijke regeling op het gebied der volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel7
  - number: '7.2'
    text: |-
      Indien de werknemer tevens rechten ontleent aan een buitenlandse soortgelijke wettelijke regeling worden de
      rechten, waarop krachtens deze landsverordening aanspraak bestaat, dienovereenkomstig verminderd.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel7
  - number: '7.3'
    text: |-
      Geen recht op geneeskundige behandeling en verpleging bestaat voor zover de kosten daarvan worden gedekt op grond
      van de Landsverordening algemene verzekering bijzondere ziektekosten (PB. 1996, no. 211).
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel7
  - number: '7.4'
    text: |-
      Het eerste lid, onderdelen a tot en met g, en het tweede lid zijn van overeenkomstige toepassing op de gezinsleden
      en gewezen werknemers.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel7
  - number: 7a
    text: |-
      In de gevallen dat de beëindiging of het verlies van het recht op tegemoetkoming van de verzekerde als gevolg
      van de toepassing van de bepalingen van deze landsverordening tot hardheden leidt, is de bank bevoegd, hetzij op
      verzoek, hetzij ambtshalve deze hardheden geheel of gedeeltelijk op te heffen.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel7a
  - number: '8.1'
    text: |-
      Ter zake van de kosten verbonden aan de uitvoering van deze landsverordening is aan de bank een premie
      verschuldigd. Het bepaalde in de artikelen 3, leden 2, 3, 4 en 5, 4, 21, lid 1, 21a, 21b, 21c en 21d van de
      Landsverordening op de Loonbelasting 1976 (P.B. 1975, no. 254) is van overeenkomstige toepassing ten aanzien van de
      door de werkgever verschuldigde premie, met dien verstande dat in plaats van «inhoudingsplichtige» telkens gelezen
      wordt «werkgever(s)» en dat de Directeur van de Sociale Verzekeringsbank in de plaats treedt van de Inspecteur
      der Belasting.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8
  - number: '8.2'
    text: |-
      De premie voor de werknemer en diens gezinsleden wordt berekend naar een percentage van het dagloon van
      de werknemer met dien verstande dat over het gedeelte van het dagloon dat boven het dagloon, genoemd in
      [artikel 1][ref1], onder «werknemer» ligt, geen premie wordt geheven. De premie voor de gewezen werknemer en diens
      gezinsleden wordt berekend naar een percentage van het laatst genoten dagloon van de gewezen werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0028728#Artikel1
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028728
        artikel: '1'
  - number: '8.3'
    text: |-
      Als regel worden de percentages, bedoeld in het tweede lid, telkens voor een periode van twee jaren vastgesteld en
      wel zodanig dat het totaal van de over de eerstvolgende periode te ontvangen premies voldoende zal zijn om daaruit
      de te verwachten uitgaven van het ziektefonds, bedoeld in het tiende lid, over die periode te voldoen, alsmede om
      een bij landsbesluit, houdende algemene maatregelen te bepalen reserve te vormen en in stand te houden.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8
  - number: '8.4'
    text: |-
      Indien het loon met terugwerkende kracht is verhoogd, wordt voor de berekening van de premie met deze verhoging
      rekening gehouden vanaf het tijdstip dat de verhoging van het loon door de werkgever aan de werknemer is
      uitbetaald.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8
  - number: '8.5'
    text: |-
      De premie voor de werknemer en diens gezinsleden is verschuldigd door de werkgever, de werknemer en de
      rechtspersoon de Nederlandse Antillen.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8
  - number: '8.6'
    text: |-
      Het percentage, bedoeld in de eerste volzin van het tweede lid, alsmede de verdeling van de premie, bedoeld in
      het vijfde lid, tussen werkgever, werknemer en de rechtspersoon de Nederlandse Antillen worden vastgesteld bij
      landsbesluit, houdende algemene maatregelen.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8
  - number: '8.7'
    text: |-
      De premie voor de gewezen werknemer en diens gezinsleden is verschuldigd door de rechtspersoon de Nederlandse
      Antillen en het percentage, bedoeld in de tweede volzin van het tweede lid, wordt vastgesteld bij landsbesluit,
      houdende algemene maatregelen.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8
  - number: '8.8'
    text: |-
      Een overeenkomst met betrekking tot de verzekering van geneeskundige verzorging of van de kosten daarvan, gesloten
      voor een persoon die nadien ten gevolge van de aanpassing van het dagloon hij landsbesluit, houdende algemene
      maatregelen als bedoeld in de eerste volzin van [artikel 1b][ref1], als werknemer krachtens deze landsverordening
      wordt verzekerd, vervalt met ingang van het tijdstip van inwerkingtreding van dat landsbesluit, voorzover aan de
      overeenkomst rechten kunnen worden ontleend, gelijkwaardig aan die welke uit de in deze landsverordening geregelde
      verzekering voortvloeien. De premie, welke voor de geheel of gedeeltelijk vervallen verzekering is vooruitbetaald,
      wordt door de verzekeraar, naar gelang het vervallen gedeelte van de overeenkomst, terugbetaald onder aftrek
      van ten hoogste 25 procent van het terug te betalen bedrag voor administratiekosten. Deze bepaling is van
      overeenkomstige toepassing op de gezinsleden van deze persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0028728#Artikel1b
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028728
        artikel: 1b
  - number: '8.9'
    text: |-
      De premie wordt ten behoeve van de bank geheven: van de werknemer door inhouding op het loon door de werkgever;
      van de werkgever door middel van afdracht op aangifte; van de rechtspersoon de Nederlandse Antillen door aanslagen
      op te leggen aan deze rechtspersoon gedifferentieerd per eilandgebied waar de werknemer of gewezen werknemer zijn
      woonplaats heeft.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8
  - number: '8.10'
    text: |-
      De premie wordt gestort in een door de bank beheerd ziektefonds. Bij landsbesluit, houdende algemene maatregelen
      worden voorschriften vastgesteld met betrekking tot de belegging van de gelden van het ziektefonds.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8
  - number: '8.11'
    text: |-
      Ten laste van het ziektefonds komen de door de bank verstrekte tegemoetkomingen, bedoeld in de
      [artikelen 3, eerste lid][ref1], en [5, eerste lid][ref2], alsmede alle andere kosten verbonden aan de uitvoering
      van deze landsverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0028728#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028728#Artikel5
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028728
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0028728
        artikel: '5'
  - number: '8.12'
    text: |-
      Ingeval het ziekengeld, bedoeld in [artikel 5, tweede lid][ref1], aan de werknemer persoonlijk door de bank wordt
      uitbetaald, wordt de premie, bedoeld in het tweede lid, door de bank op het ziekengeld ingehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0028728#Artikel5
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028728
        artikel: '5'
  - number: 8a.1
    text: De werkgever is inhoudingsplichtig ten aanzien van het gedeelte van de premie dat ten laste komt van de werknemer.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8a
  - number: 8a.2
    text: 'De werkgever is verplicht de premie in te houden op het tijdstip waarop het loon:'
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8a
  - number: 8a.2.a
    text: betaald of verrekend wordt, ter beschikking van de werknemer wordt gesteld of rentedragend wordt; of
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8a
  - number: 8a.2.b
    text: vorderbaar en tevens inbaar wordt.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8a
  - number: 8b.1
    text: |-
      De werkgever is verplicht de premie die hij over een tijdvak van een maand of korter heeft ingehouden of had moeten
      inhouden, alsmede het gedeelte van de premie dat te zijnen laste komt, binnen vijftien dagen na het einde van die
      maand, op aangifte af te dragen. Indien de inhouding over een tijdvak van langer dan een maand geschiedt, is de
      werkgever verplicht het gedeelte van de premie dat ten laste van de werknemer komt, alsmede het gedeelte dat te
      zijnen laste komt, binnen vijftien dagen na het einde van dat tijdvak, op aangifte af te dragen
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8b
  - number: 8b.2
    text: De werkgever is niet gerechtigd de af te dragen premie te compenseren met vorderingen op de bank.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8b
  - number: 8b.3
    text: |-
      De aangifte wordt gelijktijdig met de afdracht gedaan bij de bank in het eilandgebied waar de werkgever gevestigd
      is. Indien de werkgever met binnen de Nederlandse Antillen gevestigd is, geschieden vorenbedoelde aangifte en
      afdracht bij de bank in het eilandgebied waar de betrokken werknemers hun werkzaamheden verrichten
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8b
  - number: 8b.4
    text: De bank kan onder door haar te stellen voorwaarden uitstel van het doen van aangifte verlenen.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8b
  - number: 8b.5
    text: |-
      De bank kan van de werkgever die de premie over een tijdvak van langer dan een maand moet afdragen, vorderen dat
      hij binnen vijftien dagen na het einde van elke maand een gedeelte van de in te houden en af te dragen premie bij
      wijze van voorlopige betaling afdraagt.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8b
  - number: 8b.6
    text: |-
      Ook in gevallen dat geen premie behoeft te worden ingehouden en afgedragen, moet de aangifte op de in het eerste en
      derde lid aangegeven wijze gedaan worden.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8b
  - number: 8c.1
    text: |-
      De bank verstrekt de werkgever het benodigde aantal aangifteformulieren, hetzij op diens verzoek, hetzij
      ambtshalve. De werkgever is, in het geval hij deze formulieren niet van de bank heeft ontvangen, verplicht om de
      bank te verzoeken deze te verstrekken.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8c
  - number: 8c.2
    text: |-
      De werkgever is gehouden het aangifteformulier duidelijk, volledig, stellig en zonder voorbehoud naar waarheid in
      te vullen of te doen invullen en te ondertekenen.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8c
  - number: 8c.3
    text: |-
      De werkgever houdt in en draagt af onafhankelijk van het feit of en tot welk bedrag andere werkgevers van de
      werknemer inhouden, behoudens een andersluidende beslissing van de bank. Indien onverschuldigd is betaald,
      zal de onverschuldigd betaalde premie op verzoek door de bank worden gerestitueerd aan de rechthebbenden. De
      rechtsvordering tot terugbetaling van onverschuldigd betaalde premie verjaart door verloop van vijf jaren sedert
      het einde van het kalenderjaar, waarin de premie is afgedragen.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8c
  - number: 8c.4
    text: |-
      Een werkgever die de Nederlandse Antillen metterwoon wenst te verlaten, is verplicht terstond aangifte en afdracht
      te doen over het lopende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8c
  - number: 8d.1
    text: |-
      Indien de premie geheel of gedeeltelijk niet binnen de voorgeschreven termijn door de werkgever is afgedragen,
      kan de niet of te weinig afgedragen premie door middel van een aanslag, op te leggen ten name van de werkgever,
      nageheven worden, zolang niet sedert het einde van het kalenderjaar, waarin de premieschuld is ontstaan, vijf
      jaren zijn verstreken. De werkgever is gerechtigd het nageheven bedrag te verhalen op zijn werknemer voorzover het
      betrekking heeft op van de werknemer ten onrechte niet ingehouden premie.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8d
  - number: 8d.2
    text: Ten aanzien van eenzelfde tijdvak kunnen meerdere aanslagen worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8d
  - number: 8e.1
    text: |-
      Indien de werkgever niet binnen de voorgeschreven termijn aangifte en afdracht doet, danwel het aangifteformulier
      onjuist of onvolledig invult, wordt het bedrag van de premie verhoogd met ten hoogste 100%.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8e
  - number: 8e.2
    text: |-
      De verhoging, bedoeld in het eerste lid, wordt als premie beschouwd. De werkgever is niet gerechtigd deze verhoging
      op zijn werknemers te verhalen.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8e
  - number: 8e.3
    text: |-
      De verhoging, bedoeld in het eerste lid, kan buiten toepassing blijven, indien de in gebreke geblevene uit eigen
      beweging schriftelijk mededeling heeft gedaan, dat ten onrechte geen of te weinig premie is afgedragen en daarbij
      tevens de nodige inlichtingen verstrekt.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8e
  - number: 8f.1
    text: |-
      De werkgever is gehouden een loonadministratie te voeren, waaruit duidelijk blijkt aan de hand waarvan en de wijze
      waarop de premie is berekend en ingehouden.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8f
  - number: 8f.2
    text: |-
      De werkgever is gehouden na afloop van het kalenderjaar aan de werknemer, die bij het einde van het kalenderjaar in
      zijn dienst is of persoonlijk in aangenomen werk arbeid voor hem verricht, een verklaring af te geven betreffende
      het in dat kalenderjaar verkregen loon en de ingehouden premie. Bij beëindiging van het dienstverband of de
      werkzaamheden in de loop van het kalenderjaar is de werkgever gehouden aan de werknemer een zelfde verklaring af te
      geven over de tijd, waarin hij bij hem in dat kalenderjaar in dienstverband werkzaam was onderscheidenlijk voor hem
      werkzaamheden verrichtte. De verklaring wordt binnen tien dagen na het verzoek van de werknemer afgegeven.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8f
  - number: 8f.3
    text: |-
      De loonadministratie moet gedurende vijf jaren na het einde van het kalenderjaar waarop het betrekking heeft,
      worden bewaard.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8f
  - number: 8g.1
    text: 'Hoofdelijk aansprakelijk is:'
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8g
  - number: 8g.1.a
    text: |-
      voor de premie en de administratieve boete af te dragen respectievelijk verschuldigd door een niet binnen de
      Nederlandse Antillen wonende of gevestigde werkgever de leider van zijn vaste inrichting binnen de Nederlandse
      Antillen, zijn binnen de Nederlandse Antillen wonende of gevestigde vaste vertegenwoordiger danwel degene die de
      leiding heeft van de hier te lande verrichte werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8g
  - number: 8g.1.b
    text: |-
      voor de premie en de administratieve boete af te dragen respectievelijk verschuldigd door een binnen de Nederlandse
      Antillen gevestigde rechtspersoon: ieder van de bestuurders;
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8g
  - number: 8g.1.c
    text: |-
      voor de premie en de administratieve boete af te dragen respectievelijk verschuldigd door twee of meer werkgevers:
      ieder van de werkgevers.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8g
  - number: 8g.2
    text: |-
      De werknemer kan hoofdelijk aansprakelijk gesteld worden voor de van hem ten onrechte niet of te weinig ingehouden
      premie, tenzij hij de bank tijdig van de nalatigheid van de werkgever in kennis heeft gesteld.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8g
  - number: 8g.3
    text: |-
      Indien de werkgever niet binnen de Nederlandse Antillen woont of gevestigd is, kan de werknemer mede aansprakelijk
      worden gesteld voor het gedeelte van de premie dat ten laste komt van de werknemer.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8g
  - number: 8g.4
    text: |-
      De werknemer die in dienstbetrekking is bij of werkzaamheden verricht voor een niet binnen de Nederlandse Antillen
      wonende of gevestigde werkgever en die de Nederlandse Antillen wenst te verlaten, dient hiervan schriftelijk
      mededeling te doen aan de bank en kan terstond mede aansprakelijk gesteld worden voor het gedeelte van de premie
      dat te zijnen laste komt.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8g
  - number: 8g.5
    text: De heffing van de premie ingevolge het eerste tot en met het vierde lid geschiedt door middel van een aanslag.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8g
  - number: 8h.1
    text: |-
      De werkgever, diens vaste vertegenwoordiger, de leider van de vaste inrichting van de werkgever of degene die de
      leiding heeft van de hier te lande verrichte werkzaamheden is desgevraagd gehouden aan de bank of aan de door deze
      aangewezen personen en deskundigen inzage te verlenen of afschrift te verstrekken van de boeken, bescheiden en
      geschriften, welke voor de vaststelling van de premie redelijkerwijs van belang zijn.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8h
  - number: 8h.2
    text: |-
      Degene die inzage van de boeken, bescheiden en geschriften, bedoeld in het eerste lid, is gevraagd, wordt geacht
      die in zijn bezit te hebben, tenzij het tegendeel aannemelijk is gemaakt.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8h
  - number: 8h.3
    text: |-
      Bij een weigering om te voldoen aan een verplichting als bedoeld in het eerste lid, kan een werkgever, diens
      vaste vertegenwoordiger, de leider van de vaste inrichting van de werkgever of degene die de leiding heeft van de
      hier te lande verrichte werkzaamheden, niet met vrucht een beroep doen op de omstandigheid dat hij uit hoofde van
      zijn stand, zijn beroep of zijn ambt tot geheimhouding verplicht is, zelfs al mocht deze hem bij enig wettelijk
      voorschrift zijn opgelegd.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8h
  - number: 8i
    text: |-
      Het is een ieder verboden hetgeen hem, bij de uitvoering van deze landsverordening of in verband daarmede,
      nopens inkomen, opbrengst, uitdelingen, medische gegevens en in het algemeen nopens de zaken of werkzaamheden
      van een ander, blijkt of medegedeeld wordt, verder bekend te maken dan nodig is voor de uitvoering van deze
      landsverordening.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8i
  - number: 8j.1
    text: |-
      Invordering van de premie, de administratieve boete en al hetgeen de bank verder uit hoofde van deze
      landsverordening te vorderen heeft, heeft plaats volgens de regelen, welke van toepassing zijn op de invordering
      van de directe belastingen, met dien verstande dat de bank in plaats van de Ontvanger met de invordering is belast.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8j
  - number: 8j.2
    text: |-
      De vordering wegens premie, met inbegrip van alle kosten, is bevoorrecht op alle goederen van de aansprakelijke
      natuurlijke of rechtspersoon en gaat boven alle andere voorrechten met uitzondering van die ter zake van de directe
      belastingen, die van de [artikelen 287][ref1] en [288, onder a, van Boek 3 van het Burgerlijk Wetboek][ref2],
      alsmede dat van [artikel 284 van Boek 3 van het Burgerlijk Wetboek][ref3], voor zover de daarbedoelde kosten zijn
      gemaakt na de voorlopige of definitieve aanslag.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel287
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel288
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel284
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8j
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '287'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '288'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '284'
  - number: 8j.3
    text: Aanslagen zijn invorderbaar vijftien dagen na de dagtekening van het aanslagbiljet.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8j
  - number: 8j.4
    text: |-
      Indien er sprake is van een geval als bedoeld in [artikel 8c, vierde lid][ref1], of [artikel 8g, vierde lid][ref2],
      is de aanslag terstond invorderbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028728#Artikel8c
      [ref2]: https://wetten.overheid.nl/BWBR0028728#Artikel8g
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8j
    references:
      - id: ref1
        bwb_id: BWBR0028728
        artikel: 8c
      - id: ref2
        bwb_id: BWBR0028728
        artikel: 8g
  - number: 8j.5
    text: |-
      De verzending van aanslagbiljetten ten name van de werknemer kan mede plaats hebben door tussenkomst van de
      werkgever, die alsdan gehouden is het bedrag van de aanslag op het loon van de werknemer in te houden. Artikel
      1614r, eerste lid, ten 8°, van het Burgerlijk Wetboek van de Nederlandse Antillen is van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel8j
  - number: '9.1'
    text: |-
      In bijzondere gevallen kan de Minister, gehoord de bank, bepalen dat de werknemer in plaats van tegenover de bank
      tegenover de werkgever recht heeft op tegemoetkoming als bedoeld in deze landsverordening. In dat geval zijn de
      werkgever en de werknemer de premie, als bedoeld in [artikel 8][ref1], niet verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0028728#Artikel8
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028728
        artikel: '8'
  - number: '9.2'
    text: 'De Minister maakt van zijn in het voorgaande lid bedoelde bevoegdheid slechts gebruik, indien:'
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel9
  - number: 9.2.a
    text: |-
      de werkgever tot zekerheid voor de nakoming van zijn verplichtingen garantie stelt volgens nader bij landsbesluit,
      houdende algemene maatregelen te stellen regelen;
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel9
  - number: 9.2.b
    text: |-
      de werkgever de beschikking heeft over een medische dienst welke in staat is de werknemer geneeskundige behandeling
      en verpleging te verstrekken overeenkomstig de bepalingen van deze landsverordening.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel9
  - number: '9.3'
    text: |-
      De in het eerste lid bedoelde werkgever is verplicht om de bank op nader door haar vast te stellen wijze opgave
      te doen van de gevallen van ziekte welke onder zijn werknemers zijn voorgekomen en met betrekking tot de ziekte
      aantekening te houden van de verstrekte tegemoetkomingen.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel9
  - number: '9.4'
    text: |-
      In de gevallen, waarin de Minister van zijn bevoegdheid als bedoeld in het eerste lid gebruikt heeft gemaakt,
      wordt voor de toepassing van de [artikelen 1][ref1] onder «behandelende geneeskundige», [3, eerste lid][ref2],
      [4, derde lid][ref3], [6][ref4] en [7, eerste lid][ref5], onderdelen d en g, in plaats van «bank» gelezen
      «werkgever» en zijn de [artikelen 5, zesde lid][ref6], tweede en derde volzin, en 6, eerste lid, tweede volzin niet
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028728#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028728#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0028728#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0028728#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0028728#Artikel7
      [ref6]: https://wetten.overheid.nl/BWBR0028728#Artikel5
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028728
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0028728
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0028728
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0028728
        artikel: '6'
      - id: ref5
        bwb_id: BWBR0028728
        artikel: '7'
      - id: ref6
        bwb_id: BWBR0028728
        artikel: '5'
  - number: '9.5'
    text: |-
      De werknemer, die bezwaar heeft tegen de beslissing van de werkgever kan binnen drie weken na dagtekening daarvan
      een bezwaarschrift indienen bij de bank. Deze beslist op het bezwaarschrift en brengt haar beslissing, welke in de
      plaats treedt van de beslissing van de werkgever, schriftelijk en met redenen omkleed ter kennis van de werkgever
      en de werknemer.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel9
  - number: '9.6'
    text: |-
      De vordering van de arbeider [bedoeld zal zijn: werknemer] wegens de tegemoetkoming is bevoorrecht op alle goederen
      van de werkgever en gaat boven alle andere voorrechten met uitzondering van die terzake van de directe belastingen,
      die van de [artikelen 287][ref1] en [288, onder a, van Boek 3 van het Burgerlijk Wetboek][ref2], alsmede dat van
      [artikel 284 van Boek 3 van het Burgerlijk Wetboek][ref3], voor zover de daar bedoelde kosten zijn gemaakt na het
      ontstaan van de vordering van de arbeider [bedoeld zal zijn: werknemer].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel287
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel288
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel284
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '287'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '288'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '284'
  - number: '9.7'
    text: De tegemoetkoming aan de in dit artikel bedoelde werknemer wordt zonder enig voorbehoud door de bank gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel9
  - number: '10'
    text: |-
      Tegen een beslissing van de Bank staat voor belanghebbende binnen zes weken na de dag waarop deze is gegeven,
      beroep open bij het Gerecht in eerste aanleg van de Nederlandse Antillen.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel10
  - number: 10a
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel10a
  - number: 10b
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel10b
  - number: 10c
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel10c
  - number: '11.1'
    text: |-
      De termijnen van het ziekengeld, welke niet zijn ingevorderd binnen twee jaar na de eerste dag, waarop zij konden
      worden ingevorderd, worden niet meer uitbetaald.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel11
  - number: '11.2'
    text: |-
      Ieder beding, dat de aansprakelijkheid van de werkgever ingevolge de bepalingen van deze landsverordening uitsluit
      of vermindert, is nietig.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel11
  - number: '11.3'
    text: |-
      Het is de werkgever verboden de voor hem uit de bepalingen van deze landsverordening voortvloeiende kosten geheel
      of gedeeltelijk te verhalen op het loon van de werknemer.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel11
  - number: '11.4'
    text: |-
      De arbeidsgeschikte zieke werknemer, die ten behoeve van geneeskundig onderzoek of behandeling noodzakelijk het
      verrichten van zijn arbeid onderbreekt, behoudt gedurende die tijd tegenover zijn werkgever recht op loon.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel11
  - number: '11.5'
    text: |-
      De verzekerde, die de tegemoetkoming in ontvangst neemt, wordt daardoor niet geacht van het recht op het hem
      eventueel meer toekomende afstand te hebben gedaan.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel11
  - number: '11.6'
    text: |-
      Indien de werknemer in verband met zijn ziekte, op grond waarvan een tegemoetkoming als bedoeld in deze
      landsverordening is toegekend, tegen de werkgever een rechtsvordering tot schadevergoeding heeft naar burgerlijk
      recht, wordt die vordering op grond van deze landsverordening niet verloren, doch de rechter houdt bij de
      vaststelling der schadevergoeding rekening met hetgeen krachtens deze landsverordening aan de werknemer is
      toegekend.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel11
  - number: '11.7'
    text: |-
      Hij, die gehouden is tot vergoeding der schade door de verzekerde geleden als gevolg van ziekte, is voor de
      tegemoetkoming aan de verzekerde toegekend krachtens deze landsverordening aansprakelijk jegens degene te wiens
      laste die tegemoetkoming komt.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel11
  - number: '11.8'
    text: |-
      De tegemoetkoming is onvervreemdbaar, niet vatbaar voor verpanding of belening, evenmin voor executoriaal of
      conservatoir beslag, noch voor faillissementsbeslag, behalve tot verhaal van het verschuldigde wegens levering
      van levensbehoeften, verstrekt aan degeen tegen wie het beslag gedaan wordt en tot verhaal van onderhoud waartoe
      degene, die de uitkering geniet, ingevolge wettelijke regelingen is gehouden.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel11
  - number: '12.1'
    text: De bank is belast met de uitvoering van deze landsverordening.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel12
  - number: '12.2'
    text: |-
      Een ieder is verplicht ten behoeve van de uitvoering op verzoek aan de bank inlichtingen te verstrekken,
      desverlangd schriftelijk. De door de bank verlangde inlichtingen moeten binnen een door de bank te stellen
      termijn worden verstrekt. De verzekerde is verplicht uit eigen beweging aan de bank inlichtingen te verstrekken
      waarvan hij redelijkerwijs kan vermoeden dat deze aanleiding kunnen geven tot verlies of beëindiging van het recht
      op tegemoetkoming krachtens [artikel 3, eerste lid][ref1]. Ook is een ieder verplicht de door de bank gegeven
      aanwijzingen ten behoeve van de uitvoering van deze landsverordening op te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0028728#Artikel3
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028728
        artikel: '3'
  - number: '12.3'
    text: |-
      Bij niet naleving van de in tweede lid opgelegde verplichtingen door de verzekerde is de bank bevoegd de te
      verstrekken tegemoetkomingen en vergoedingen op te schorten.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel12
  - number: 12a.1
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze landsverordening bepaalde zijn belast de directeur,
      de onder-directeur, alsmede het daartoe bij landsbesluit aangewezen overige administratieve personeel van de bank.
      Een zodanige aanwijzing wordt bekendgemaakt in De Curacaosche Courant.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel12a
  - number: 12a.2
    text: |-
      De krachtens het eerste lid aangewezen personen zijn, uitsluitend voor zover dat voor de vervulling van hun taak
      redelijkerwijze noodzakelijk is, bevoegd:
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel12a
  - number: 12a.2.a
    text: 'alle inlichtingen te vragen:'
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel12a
  - number: 12a.2.b
    text: |-
      inzage te verlangen van alle boeken, bescheiden en andere informatiedragers en daarvan afschrift te nemen of deze
      daartoe tijdelijk mee te nemen;
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel12a
  - number: 12a.2.c
    text: goederen aan opneming en onderzoek te onderwerpen en deze daartoe tijdelijk mee te nemen;
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel12a
  - number: 12a.2.d
    text: |-
      alle plaatsen, met uitzondering van woningen zonder de uitdrukkelijke toestemming van de bewoners te betreden,
      vergezeld van door hen aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel12a
  - number: 12a.2.e
    text: |-
      woningen of tot woning bestemde gedeelten van vaartuigen zonder de uitdrukkelijke toestemming van de bewoner binnen
      te treden.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel12a
  - number: 12a.3
    text: |-
      Zo nodig, wordt de toegang tot een plaats als bedoeld in het tweede lid, onderdeel d, verschaft met behulp van de
      sterke arm.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel12a
  - number: 12a.4
    text: |-
      Op het binnentreden in woningen of in tot woning bestemde gedeelten van vaartuigen. als bedoeld in het
      tweede lid, onderdeel e, is [Titel X van het Derde Boek van het Wetboek van Strafvordering][ref1] van
      overeenkomstige toepassing, met uitzondering van de [artikelen 155, vierde lid][ref2], [156, tweede lid][ref3],
      [157, tweede en derde lid][ref4], [158, eerste lid, laatste zinsnede][ref5], en [160, eerste lid][ref6], en met
      dien verstande dat de machtiging wordt verleend door de procureur-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0028681
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel155
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel156
      [ref4]: https://wetten.overheid.nl/BWBR0028681#Artikel157
      [ref5]: https://wetten.overheid.nl/BWBR0028681#Artikel158
      [ref6]: https://wetten.overheid.nl/BWBR0028681#Artikel160
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0028681
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '155'
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '156'
      - id: ref4
        bwb_id: BWBR0028681
        artikel: '157'
      - id: ref5
        bwb_id: BWBR0028681
        artikel: '158'
      - id: ref6
        bwb_id: BWBR0028681
        artikel: '160'
  - number: 12a.5
    text: |-
      Bij landsbesluit, houdende algemene maatregelen, kunnen regels worden gesteld met betrekking tot de wijze van
      taakuitoefening van de krachtens het eerste lid aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel12a
  - number: 12a.6
    text: |-
      Een ieder is verplicht aan de krachtens het eerste lid aangewezen personen alle medewerking te verlenen die in het
      kader van de toezichtsuitoefening op grond van het tweede lid wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel12a
  - number: 12a.7
    text: |-
      [Artikel 12, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028728#Artikel12
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0028728
        artikel: '12'
  - number: '13'
    text: |-
      Ter uitvoering van deze landsverordening kunnen nadere regelen worden gesteld bij landsbesluit, houdende algemene
      maatregelen.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel13
  - number: '14'
    text: |-
      Alle ingevolge deze landsverordening opgemaakte of overgelegde stukken, verzoekschriften en beschikkingen zijn vrij
      van het recht van zegel en van de formaliteit van registratie.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel14
  - number: 14a.1
    text: |-
      Op overtreding van [artikel 11, derde lid][ref1], en het niet of niet tijdig nakomen van een van de
      verplichtingen gesteld bij de [artikelen 5, zesde lid][ref2], eerste volzin, [6, eerste lid][ref3], tweede
      volzin, [8c, vierde lid][ref4], [8g, vierde lid][ref5]; [8h, eerste lid][ref6], [8i][ref7], [9, derde lid][ref8],
      [12, tweede lid][ref9], en krachtens [artikel 13][ref10] wordt een boete geheven van ten hoogste vijfduizend
      gulden.


      [ref1]: https://wetten.overheid.nl/BWBR0028728#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0028728#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0028728#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0028728#Artikel8c
      [ref5]: https://wetten.overheid.nl/BWBR0028728#Artikel8g
      [ref6]: https://wetten.overheid.nl/BWBR0028728#Artikel8h
      [ref7]: https://wetten.overheid.nl/BWBR0028728#Artikel8i
      [ref8]: https://wetten.overheid.nl/BWBR0028728#Artikel9
      [ref9]: https://wetten.overheid.nl/BWBR0028728#Artikel12
      [ref10]: https://wetten.overheid.nl/BWBR0028728#Artikel13
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0028728
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0028728
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0028728
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0028728
        artikel: 8c
      - id: ref5
        bwb_id: BWBR0028728
        artikel: 8g
      - id: ref6
        bwb_id: BWBR0028728
        artikel: 8h
      - id: ref7
        bwb_id: BWBR0028728
        artikel: 8i
      - id: ref8
        bwb_id: BWBR0028728
        artikel: '9'
      - id: ref9
        bwb_id: BWBR0028728
        artikel: '12'
      - id: ref10
        bwb_id: BWBR0028728
        artikel: '13'
  - number: 14a.2
    text: |-
      Onder het niet voldoen aan de verplichtingen, genoemd in de [artikelen 9, derde lid][ref1], en
      [12, tweede lid][ref2], wordt mede verstaan het verstrekken van onjuiste inlichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028728#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0028728#Artikel12
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0028728
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0028728
        artikel: '12'
  - number: 14a.3
    text: |-
      Indien een aanslag, welke werd opgelegd wegens het niet voldoen aan de verplichting van
      [artikel 8b, zesde lid][ref1], in zijn geheel moet worden verminderd, wordt een boete geheven van honderd gulden.


      [ref1]: https://wetten.overheid.nl/BWBR0028728#Artikel8b
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0028728
        artikel: 8b
  - number: 14a.4
    text: |-
      Indien er sprake is van herhaling van eenzelfde overtreding binnen twee jaar wordt het maximum van de boetes,
      genoemd in het eerste tot en met het derde lid, verdubbeld.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel14a
  - number: 14a.5
    text: De boete wordt geheven door middel van aanslagen.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel14a
  - number: '15.1'
    text: |-
      Overtreding van [artikel 11, derde lid][ref1], en het niet of niet tijdig nakomen van een van de
      verplichtingen gesteld bij de [artikelen 5, zesde lid][ref2], eerste volzin, [6, eerste lid][ref3], tweede
      volzin, [8c, vierde lid][ref4], [8f][ref5], [8g, vierde lid][ref6], [8h, eerste lid][ref7], [8i][ref8],
      [12, tweede lid][ref9], en krachtens [artikel 13][ref10] wordt gestraft met hechtenis van ten hoogste een maand of
      geldboete van ten hoogste tienduizend gulden.


      [ref1]: https://wetten.overheid.nl/BWBR0028728#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0028728#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0028728#Artikel6
