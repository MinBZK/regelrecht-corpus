  - number: '15.2'
    text: |-
      Het opzettelijk, mondeling of schriftelijk verstrekken of doen verstrekken van inlichtingen als bedoeld in de
      [artikelen 9, derde lid][ref1], en [12, tweede lid][ref2], die onjuist zijn alsmede het afleggen van een valse
      verklaring aan de bank, wordt gestraft met gevangenisstraf van ten hoogste een jaar of een geldboete van ten
      hoogste tienduizend gulden.


      [ref1]: https://wetten.overheid.nl/BWBR0028728#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0028728#Artikel12
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028728
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0028728
        artikel: '12'
  - number: '15.3'
    text: |-
      Het opzettelijk door giften, beloften, misbruik van gezag, geweld, bedreiging of misleiding bewegen van een
      werknemer om geen gebruik te maken van een hem volgens deze landsverordening toekomend recht wordt gestraft met
      gevangenisstraf van ten hoogste een jaar of geldboete van ten hoogste tienduizend gulden
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel15
  - number: '15.4'
    text: |-
      De in het eerste lid strafbaar gestelde feiten zijn overtredingen en de in het tweede en derde lid strafbaar
      gestelde feiten misdrijven.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel15
  - number: 15a
    text: |-
      Een administratieve boete vervalt, indien degene die haar heeft belopen, wegens het feit op grond waarvan boete is
      verschuldigd, onherroepelijk is veroordeeld, is vrijgesproken of is ontslagen van rechtsvervolging.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel15a
  - number: 15b.1
    text: |-
      Met de opsporing van de bij deze landsverordening strafbaar gestelde feiten zijn, naast de in
      [artikel 184 van het Wetboek van Strafvordering][ref1] bedoelde ambtenaren, belast de directeur, de onder-
      directeur, het daartoe bij landsbesluit aangewezen overige administratieve personeel van de bank, alsmede de
      daartoe bij landsbesluit aangewezen ambtenaren van de Inspectie der Belastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel184
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '184'
  - number: 15b.2
    text: |-
      Bij landsbesluit, houdende algemene maatregelen, kunnen regels worden gesteld met betrekking tot de vereisten
      waaraan de krachtens het eerste lid aangewezen personen dienen te voldoen.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel15b
  - number: '16.1'
    text: |-
      Deze landsverordening, welke kan worden aangehaald als «Landsverordening Ziekteverzekering», treedt in werking op
      een nader bij landsbesluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel16
  - number: '16.2'
    text: Op het tijdstip als bedoeld in het voorgaande lid vervalt de Ziekteregeling 1936 (P.B. 1946, no. 101).
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel16
  - number: '16.3'
    text: |-
      De aanspraak op tegemoetkoming krachtens de Ziekteregeling 1936 op grond van een ziekteoorzaak, welke voor de dag
      van inwerkingtreding van deze landsverordening is ontstaan, blijft nadien van kracht, doch wordt geacht te bestaan
      krachtens deze landsverordening.
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel16
