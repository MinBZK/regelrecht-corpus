      [ref6]: https://wetten.overheid.nl/BWBR0028728#Artikel8g
      [ref7]: https://wetten.overheid.nl/BWBR0028728#Artikel8h
      [ref8]: https://wetten.overheid.nl/BWBR0028728#Artikel8i
      [ref9]: https://wetten.overheid.nl/BWBR0028728#Artikel12
      [ref10]: https://wetten.overheid.nl/BWBR0028728#Artikel13
    url: https://wetten.overheid.nl/BWBR0028728/2010-10-10#Artikel15
