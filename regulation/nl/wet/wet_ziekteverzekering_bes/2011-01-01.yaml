---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_ziekteverzekering_bes
regulatory_layer: WET
publication_date: '2025-02-19'
valid_from: '2011-01-01'
bwb_id: BWBR0028728
url: https://wetten.overheid.nl/BWBR0028728/2011-01-01
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel1
  - number: 1.1.a
    text: '*Onze Minister:* Onze Minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel1
  - number: 1.1.b
    text: |-
      *werkgever:* iedere natuurlijke of rechtspersoon, die binnen het openbare lichaam Bonaire, Sint Eustatius of Saba
      één of meer werknemers arbeid doet verrichten, alsmede de natuurlijke of rechtspersoon die, gevestigd binnen het
      openbare lichaam Bonaire, Sint Eustatius of Saba, één of meer werknemers, die eveneens gevestigd zijn binnen het
      openbare lichaam Bonaire, Sint Eustatius of Saba, arbeid doet verrichten in het buitenland;
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel1
  - number: 1.1.c
    text: |-
      *werknemer:* een natuurlijke persoon, die met toepassing van [artikel 2 van de Wet loonbelasting BES][ref1] als
      werknemer wordt beschouwd omdat hij tot een inhoudingsplichtige in dienstbetrekking staat met uitzondering van:


      [ref1]: https://wetten.overheid.nl/BWBR0029283#Artikel2
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0029283
        artikel: '2'
  - number: 1.1.c.1°
    text: |-
      een werknemer, die als regel geen twaalf achtereenvolgende dagen, niet meegerekend zondagen, en daarmee op grond
      van de [Arbeidswet 2000 BES][ref1] gelijkgestelde dagen, in dienst van de werkgever is,


      [ref1]: https://wetten.overheid.nl/BWBR0028202
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028202
  - number: 1.1.c.2°
    text: |-
      de kapitein en schepelingen op zeeschepen van Aruba, Curaçao, Sint Maarten of de openbare lichamen Bonaire, Sint
      Eustatius of Saba,
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel1
  - number: 1.1.c.3°
    text: |-
      degene, die in dienst is van een publiekrechtelijk lichaam en aan de voor hem geldende rechtspositieregelingen
      aanspraak op een uitkering bij ziekte kan ontlenen, en
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel1
  - number: 1.1.c.4°
    text: |-
      de bestuurder of commissaris, bedoeld in [artikel 3, tweede lid, onderdeel a, van de Wet loonbelasting BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0029283#Artikel3
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0029283
        artikel: '3'
  - number: 1.1.d
    text: |-
      *behandelend geneeskundige:* de geneeskundige die op aanwijzing of met goedvinden van Onze Minster de werknemer
      onderzoekt of behandelt;
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel1
  - number: 1.1.e
    text: '*controlerend geneeskundige:* de geneeskundige die als zodanig door Onze Minister is aangewezen;'
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel1
  - number: 1.1.f
    text: |-
      *arbeidsongeschiktheid:* de toestand waarin de werknemer verkeert, die als gevolg van ziekte gedurende een etmaal
      of langer niet in staat is om zijn normale arbeid te verrichten of deze arbeid zo lang niet mag verrichten hetzij
      om een medisch noodzakelijk onderzoek mogelijk te maken hetzij om te voorkomen dat zijn genezing wordt belemmerd,
      dan wel om besmetting van anderen te voorkomen;
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel1
  - number: 1.1.g
    text: |-
      *loon:* het loon, bedoeld in de [artikelen 6][ref1] en [9a van de Wet loonbelasting BES][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0029283#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0029283#Artikel9a
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0029283
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0029283
        artikel: 9a
  - number: 1.1.h
    text: '*loon per dag van de werknemer voor wie een zesdaagse werkweek geldt:*'
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel1
  - number: 1.1.h.1°
    text: |-
      bij een uurloon: de waarde in het economisch verkeer van het loon per uur, vermenigvuldigd met het aantal werkuren
      per week van de betrokken werknemer, het verkregen produkt gedeeld door zes,
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel1
  - number: 1.1.h.2°
    text: 'bij een weekloon: de waarde in het economisch verkeer van het loon per week gedeeld door zes,'
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel1
  - number: 1.1.h.3°
    text: |-
      bij een maandloon: de waarde in het economisch verkeer van het loon per maand vermenigvuldigd met drie en gedeeld
      door 78;
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel1
  - number: 1.1.i
    text: '*loon per dag van de werknemer voor wie een vijfdaagse werkweek geldt:*'
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel1
  - number: 1.1.i.1°
    text: |-
      bij een uurloon: de waarde in het economisch verkeer van het loon per uur, vermenigvuldigd met het aantal werkuren
      per week van de betrokken werknemer, het verkregen produkt gedeeld door vijf,
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel1
  - number: 1.1.i.2°
    text: 'bij een weekloon: de waarde in het economisch verkeer van het loon per week gedeeld door vijf,'
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel1
  - number: 1.1.i.3°
    text: |-
      bij een maandloon: de waarde in het economisch verkeer van het loon per maand vermenigvuldigd met drie en gedeeld
      door 65;
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel1
  - number: 1.1.j
    text: '*loon per dag van een werknemer met een werkweek van minder dan vijf dagen:*'
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel1
  - number: 1.1.j.1°
    text: |-
      bij een uurloon: de waarde in het economisch verkeer van het loon per uur, vermenigvuldigd met het aantal werkuren
      per week van de betrokken werknemer, het verkregen produkt gedeeld door het aantal dagen waarop de werknemer op
      grond van zijn arbeidsovereenkomst werkt,
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel1
  - number: 1.1.j.2°
    text: |-
      bij een weekloon: de waarde in het economisch verkeer van het loon per week gedeeld door het aantal dagen waarop de
      werknemer op grond van zijn arbeidsovereenkomst werkt,
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel1
  - number: 1.1.j.3°
    text: |-
      bij een maandloon: de waarde in het economisch verkeer van het loon per maand gedeeld door het aantal dagen per
      maand dat op grond van de arbeidsovereenkomst zou zijn gewerkt;
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel1
  - number: 1.1.k
    text: |-
      *inkomen:* de belastbare som als bedoeld in [artikel 24, eerste lid, van de Wet inkomstenbelasting BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel24
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '24'
  - number: 1.1.l
    text: '*inspecteur:* de bij regeling van Onze Minister van Financiën als zodanig aangewezen functionaris;'
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel1
  - number: 1.1.m
    text: '*ontvanger:* de bij regeling van Onze Minister van Financiën als zodanig aangewezen functionaris.'
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel1
  - number: '1.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen personen, die op grond van het eerste lid niet de hoedanigheid van
      werknemer hebben, als werknemer worden aangemerkt en kunnen hiervoor nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel1
  - number: '2.1'
    text: |-
      Indien het loon geheel of gedeeltelijk bestaat uit huisvesting, verstrekkingen in natura, onderricht of
      geldelijke uitkeringen waarvan de grootte niet bij voorbaat vaststaat zoals provisie, commissie, tantième,
      fooien of vergoedingen voor aangenomen werk, bepalen werkgever en werknemer ter vaststelling van het
      loon per dag de gemiddelde waarde in het economisch verkeer daarvan met overeenkomstige toepassing van
      [artikel 6C van de Wet loonbelasting BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029283#Artikel6c
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0029283
        artikel: 6c
  - number: '2.2'
    text: |-
      Indien sprake is van een uurloon en het aantal werkuren per week niet bij voorbaat vaststaat wordt het loon per dag
      vastgesteld aan de hand van het gemiddelde aantal werkuren per week in de periode van dertien weken voorafgaand aan
      de eerste dag waarop de werknemer ziek is geworden.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel2
  - number: '3.1'
    text: De werknemer heeft in geval van ziekte op grond van deze wet tegenover Onze Minister recht op een uitkering.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel3
  - number: '3.2'
    text: Met ziekte worden gelijkgesteld zwangerschap en bevalling van de vrouwelijke verzekerde.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel3
  - number: '3.3'
    text: |-
      Met ziekte wordt tevens gelijkgesteld lichamelijk letsel als gevolg van een ongeval, tenzij de werknemer op grond
      daarvan recht heeft op ongevallengeld op grond van de [Wet ongevallenverzekering BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028497
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0028497
  - number: '5.1'
    text: |-
      De werknemer die als gevolg van ziekte arbeidsongeschikt is, heeft recht op een uitkering in geld, ziekengeld
      genaamd, met ingang van de derde dag na die van de ziekmelding. Niettemin wordt over de dag van de ziekmelding
      en de twee daarop volgende dagen ziekengeld uitgekeerd, indien naar het oordeel van de behandelende geneeskundige
      de ziekte opneming in een ziekeninrichting noodzakelijk maakt. Het ziekengeld wordt over de bedoelde drie dagen
      eveneens uitgekeerd, indien de duur van de ziekte als gevolg van dezelfde ziekteoorzaak langer dan drie dagen
      bedraagt, ook wanneer geen opneming in een ziekeninrichting noodzakelijk is geweest. Ter zake van eenzelfde
      ziekteoorzaak vervalt dit recht twee jaar nadien, indien het betreft een arbeidsovereenkomst aangegaan voor
      onbepaalde tijd, ongeacht het voortduren van de arbeidsovereenkomst. Voor een arbeidsovereenkomst aangegaan voor
      bepaalde tijd vervalt dit recht na verloop van de periode waarvoor zij is aangegaan maar uiterlijk twee jaren na de
      dag van de ziektemelding wegens eenzelfde ziekteoorzaak. Indien een overeenkomst voor bepaalde tijd verlengd wordt,
      is het bepaalde met betrekking tot arbeidsovereenkomsten aangegaan voor onbepaalde tijd van toepassing. In geval
      van zwangerschap wordt de vrouwelijke arbeider geacht gedurende de duur van het zwangerschaps- en bevallingsverlof,
      bedoeld in [artikel 1614ca van het Burgerlijk Wetboek BES][ref1], arbeidsongeschikt te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1614ca
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1614ca
  - number: '5.2'
    text: |-
      Het ziekengeld bedraagt per dag 80% van het loon per dag van de werknemer. Voor zover het loon per dag meer heeft
      bedragen dan een door Onze Minister vastgesteld bedrag blijft het bij de toepassing van de eerste zin buiten
      aanmerking.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel5
  - number: '5.3'
    text: |-
      Indien het loon met terugwerkende kracht is verhoogd, wordt ter bepaling van het ziekengeld met deze verhoging
      rekening gehouden vanaf het tijdstip dat de verhoging van het loon door de werkgever aan de werknemer is
      uitbetaald.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel5
  - number: '5.4'
    text: 'De werknemer heeft geen recht op ziekengeld:'
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel5
  - number: 5.4.a
    text: |-
      over de zondagen of de daarvoor voor hem in de plaats tredende vrije dagen, terwijl de werknemer voor wie een
      vijfdaagse werkweek geldt bovendien geen recht heeft op ziekengeld over de vrije zaterdagen of de daarvoor voor hem
      in de plaats tredende vrije dagen;
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel5
  - number: 5.4.b
    text: over de periode dat hem ziekengeld ter zake van een andere ziekte wordt uitgekeerd.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel5
  - number: '5.5'
    text: |-
      Wanneer de werknemer tijdens zijn arbeidsongeschiktheid van zijn werkgever loon ontvangt, wordt het ziekengeld per
      dag verminderd met het bedrag, waarmede het ziekengeld en het loon per dag gezamenlijk het loon per dag, waarnaar
      het ziekengeld is berekend, overtreft.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel5
  - number: '5.6'
    text: |-
      Tijdens het dienstverband of de werkzaamheden is de werkgever in geval van arbeidsongeschiktheid van de werknemer
      verplicht een uitkering gelijk aan het ziekengeld waarop de werknemer over de desbetreffende loontermijn tegenover
      Onze Minister recht heeft, aan de werknemer uit te betalen op de dag waarop het loon moet worden uitbetaald of
      zou moeten worden uitbetaald indien de werknemer niet arbeidsongeschikt zou zijn. De werkgever die een uitkering
      op grond van de vorige zin heeft uitbetaald heeft, in plaats van de werknemer, tegenover Onze Minister recht
      op het desbetreffende ziekengeld en op uitbetaling daarvan uiterlijk zeven dagen na schriftelijke aanvraag bij
      Onze Minister, in te dienen na afloop van de maand waarin de uitkering wordt uitbetaald. Indien de werkgever de
      uitkering niet tijdig uitbetaalt, keert Onze Minister het ziekengeld aan de werknemer uit.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel5
  - number: '5.7'
    text: |-
      Onze Minister is bevoegd om op grond van verdragen, convenanten en andersoortige overeenkomsten met uitvoerders van
      instellingen van sociale voorzieningen, het ziekengeld van een werknemer te verminderen ter ontneming van een ten
      onrechte verkregen voordeel van de werknemer op het gebied van sociale voorzieningen.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel5
  - number: '5.8'
    text: |-
      Onze Minister is eveneens bevoegd om het ziekengeld van een werknemer te verminderen ter ontneming van
      een ten onrechte verkregen voordeel van de werknemer op het gebied van de door Onze Minister uitbetaalde
      socialeverzekeringsuitkeringen.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel5
  - number: '5.9'
    text: |-
      De in het zevende en achtste lid bedoelde vermindering kan ineens geschieden indien het ten onrechte genoten
      voordeel niet groter is dan een derde deel van het door Onze Minister verstrekte ziekengeld. In alle andere
      gevallen kan de vermindering niet meer bedragen dan een derde deel van het ziekengeld.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel5
  - number: '6.1'
    text: |-
      Zo spoedig mogelijk deelt Onze Minister, mede aan de hand van de bevindingen en voorschriften van de behandelende
      geneeskundige, aan de werknemer schriftelijk mede welke uitkering hem zal worden verstrekt en eventueel dat en op
      welke gronden Onze Minister zich niet of niet langer tot uitkering gehouden acht. De werknemer stelt de werkgever
      onverwijld van deze mededeling in kennis.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel6
  - number: '6.2'
    text: 'Zodra de behandelende geneeskundige vaststelt dat de werknemer:'
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel6
  - number: 6.2.a
    text: zich onder geneeskundige behandeling moet stellen;
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel6
  - number: 6.2.b
    text: zich niet of niet langer onder geneeskundige behandeling behoeft te stellen;
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel6
  - number: 6.2.c
    text: als bedlegerig patiënt behandeld moet worden;
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel6
  - number: 6.2.d
    text: niet of niet langer als bedlegerig patiënt behandeld behoeft te worden;
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel6
  - number: 6.2.e
    text: arbeidsongeschikt is;
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel6
  - number: 6.2.f
    text: niet of niet langer arbeidsongeschikt is; of
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel6
  - number: '7.1'
    text: 'De werknemer heeft geen recht op uitkering of verliest dit recht:'
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel7
  - number: 7.1.a
    text: |-
      indien de ziekte te wijten is aan zijn opzet of grove schuld dan wel aan het gebruik van alcoholhoudende drank of
      bedwelmende middelen;
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel7
  - number: 7.1.b
    text: indien en zolang hij zich niet onder behandeling van de behandelende geneeskundige heeft gesteld;
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel7
  - number: 7.1.c
    text: indien hij zich schuldig maakt aan gedragingen waardoor zijn genezing wordt belemmerd;
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel7
  - number: 7.1.d
    text: |-
      indien hij niet op de tijden en plaatsen, door Onze Minister aangewezen, de behandelende geneeskundige toestaat hem
      te onderzoeken of te behandelen dan wel diens voorschriften niet opvolgt of zich daarnaast aan andere geneeskundige
      behandeling onderwerpt;
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel7
  - number: 7.1.e
    text: |-
      indien hij niet op de tijden en plaatsen, door Onze Minister aangewezen, de controlerende geneeskundige toestaat
      hem te onderzoeken;
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel7
  - number: 7.1.f
    text: |-
      indien hij de aanwijzingen van de controlerende geneeskundige, ook wanneer deze afwijken van de voorschriften van
      de behandelende geneeskundige, niet opvolgt;
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel7
  - number: 7.1.g
    text: indien hij zonder de toestemming van Onze Minister het eiland verlaat waar hem de uitkering wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel7
  - number: 7.1.h
    text: |-
      indien en voor zoveel hij, met betrekking tot de ziekte, recht heeft op uitkering op grond van de
      [Wet ongevallenverzekering BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028497
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028497
  - number: 7a
    text: |-
      In de gevallen dat de beëindiging of het verlies van het recht op uitkering van de verzekerde als gevolg van
      de toepassing van de bepalingen van deze wet tot kennelijke hardheid leidt, is Onze Minister bevoegd, hetzij op
      verzoek, hetzij ambtshalve deze kennelijke hardheid geheel of gedeeltelijk op te heffen.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel7a
  - number: '8.1'
    text: |-
      Ter zake van de kosten verbonden aan deze wet is een premie verschuldigd, die gezamenlijk wordt geheven met de
      zorgverzekeringspremie.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel8
  - number: '8.2'
    text: |-
      De premie, bedoeld in het eerste lid, wordt geheven met overeenkomstige toepassing van
      [hoofdstuk III van de Wet loonbelasting BES][ref1], met dien verstande dat in plaats van «inhoudingsplichtige»
      telkens gelezen wordt «werkgever».


      [ref1]: https://wetten.overheid.nl/BWBR0029283#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0029283
        hoofdstuk: III
  - number: '8.3'
    text: De premie wordt geheven naar een percentage van het loon van de werknemer.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel8
  - number: '8.4'
    text: |-
      Het premiepercentage, bedoeld in het derde lid, wordt met ingang van elk kalenderjaar bij ministeriële regeling in
      overeenstemming met Onze Minister van Financiën voor de periode van één jaar vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel8
  - number: '8.5'
    text: |-
      Indien het loon met terugwerkende kracht is verhoogd, wordt voor de berekening van de premie met deze verhoging
      rekening gehouden vanaf het tijdstip dat de verhoging van het loon door de werkgever aan de werknemer is
      uitbetaald.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel8
  - number: '8.6'
    text: De premie is verschuldigd door de werkgever.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel8
  - number: '8.7'
    text: De premie wordt door de inspecteur geheven van de werkgever door middel van afdracht op aangifte.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel8
  - number: '8.8'
    text: De premie komt ten gunste van het Rijk.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel8
  - number: '8.9'
    text: |-
      Ten laste van het Rijk komen de door Onze Minister verstrekte uitkeringen, bedoeld in de
      [artikelen 3, eerste lid][ref1], en [5, eerste lid][ref2], en alle kosten verbonden aan de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0028728#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028728#Artikel5
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028728
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0028728
        artikel: '5'
  - number: 8a
    text: |-
      Voor zover op grond van deze wet niet anders is bepaald is ten aanzien van de premieheffing en invordering op grond
      van [artikel 8][ref1] en de invordering daarvan [hoofdstuk VIII van de Belastingwet BES][ref2] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028728#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0029244#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0028728
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0029244
        hoofdstuk: VIII
  - number: 8h.1
    text: |-
      De werkgever, diens vaste vertegenwoordiger, de leider van de vaste inrichting van de werkgever of degene die
      de leiding heeft van binnen de openbare lichamen Bonaire, Sint Eustatius of Saba verrichte werkzaamheden is
      desgevraagd gehouden aan Onze Minister of aan de door deze aangewezen personen en deskundigen inzage te verlenen
      of afschrift te verstrekken van de boeken, bescheiden en geschriften, welke voor de vaststelling van de premie
      redelijkerwijs van belang zijn.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel8h
  - number: 8h.2
    text: |-
      Degene die inzage van de boeken, bescheiden en geschriften, bedoeld in het eerste lid, is gevraagd, wordt geacht
      die in zijn bezit te hebben, tenzij het tegendeel aannemelijk is gemaakt.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel8h
  - number: 8h.3
    text: |-
      Bij een weigering om te voldoen aan een verplichting als bedoeld in het eerste lid, kan een werkgever, diens vaste
      vertegenwoordiger, de leider van de vaste inrichting van de werkgever of degene die de leiding heeft van binnen de
      openbare lichamen Bonaire, Sint Eustatius of Saba verrichte werkzaamheden, niet met vrucht een beroep doen op de
      omstandigheid dat hij uit hoofde van zijn stand, zijn beroep of zijn ambt tot geheimhouding verplicht is, zelfs al
      mocht deze hem bij enig wettelijk voorschrift zijn opgelegd.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel8h
  - number: 8i
    text: |-
      Het is een ieder verboden hetgeen hem, bij de uitvoering van deze wet of in verband daarmee, over inkomen,
      opbrengst, uitdelingen, medische gegevens en in het algemeen over de zaken of werkzaamheden van een ander, blijkt
      of medegedeeld wordt, verder bekend te maken dan nodig is voor de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel8i
  - number: 10a
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel10a
  - number: 10b
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel10b
  - number: 10c
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel10c
  - number: '11.1'
    text: |-
      De termijnen van het ziekengeld, die niet zijn ingevorderd binnen twee jaar na de eerste dag, waarop zij konden
      worden ingevorderd, worden niet meer uitbetaald.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel11
  - number: '11.2'
    text: Ieder beding, dat de aansprakelijkheid van de werkgever op grond van deze wet uitsluit of vermindert, is nietig.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel11
  - number: '11.3'
    text: |-
      Het is de werkgever verboden de voor hem uit de bepalingen van deze wet voortvloeiende kosten geheel of
      gedeeltelijk te verhalen op het loon van de werknemer.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel11
  - number: '11.4'
    text: |-
      De arbeidsgeschikte zieke werknemer, die ten behoeve van geneeskundig onderzoek of behandeling noodzakelijk het
      verrichten van zijn arbeid onderbreekt, behoudt gedurende die tijd tegenover zijn werkgever recht op loon.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel11
  - number: '11.5'
    text: |-
      De verzekerde, die de uitkering in ontvangst neemt, wordt daardoor niet geacht van het recht op het hem eventueel
      meer toekomende afstand te hebben gedaan.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel11
  - number: '11.6'
    text: |-
      Indien de werknemer in verband met zijn ziekte, op grond waarvan een uitkering als bedoeld in deze wet is
      toegekend, tegen de werkgever een rechtsvordering tot schadevergoeding heeft naar burgerlijk recht, wordt die
      vordering op grond van deze wet niet verloren, doch de rechter houdt bij de vaststelling der schadevergoeding
      rekening met hetgeen op grond van deze wet aan de werknemer is toegekend.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel11
  - number: '11.7'
    text: |-
      De persoon, die gehouden is tot vergoeding van schade die door de verzekerde is geleden door ziekte, is voor de
      uitkering aan de verzekerde op grond van deze wet aansprakelijk jegens degene te wiens laste die uitkering komt.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel11
  - number: '11.8'
    text: |-
      De uitkering is onvervreemdbaar, niet vatbaar voor verpanding of belening, evenmin voor executoriaal of
      conservatoir beslag, noch voor faillissementsbeslag, behalve tot verhaal van het verschuldigde wegens levering
      van levensbehoeften, verstrekt aan degene tegen wie het beslag gedaan wordt en tot verhaal van onderhoud waartoe
      degene, die de uitkering geniet, op grond van enig wettelijk voorschrift is gehouden.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel11
  - number: '12.1'
    text: |-
      Onze Minister is belast met de uitvoering van deze wet, met dien verstande, dat de heffing van de premie geschiedt
      door de inspecteur en de invordering daarvan door de ontvanger.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel12
  - number: '12.2'
    text: |-
      Een ieder is verplicht ten behoeve van de uitvoering op verzoek aan Onze Minister inlichtingen te verstrekken,
      desverlangd schriftelijk. De door Onze Minister verlangde inlichtingen moeten binnen een door Onze Minister te
      stellen termijn worden verstrekt. De verzekerde is verplicht uit eigen beweging aan Onze Minister inlichtingen
      te verstrekken waarvan de verzekerde redelijkerwijs kan vermoeden dat deze aanleiding kunnen geven tot verlies of
      beëindiging van het recht op uitkering op grond van [artikel 3, eerste lid][ref1]. Ook is een ieder verplicht de
      door Onze Minister gegeven aanwijzingen ten behoeve van de uitvoering van deze wet op te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0028728#Artikel3
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028728
        artikel: '3'
  - number: '12.3'
    text: |-
      Bij niet naleving van de in tweede lid opgelegde verplichtingen door de verzekerde is Onze Minister bevoegd de te
      verstrekken tegemoetkomingen en vergoedingen op te schorten.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel12
  - number: '12.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de verplichtingen,
      bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel12
  - number: 12a.1
    text: |-
      Onze Minister kan bij ministeriële regeling functionarissen aanwijzen, die zijn belast met het toezicht op deze
      wet.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel12a
  - number: 12a.2
    text: |-
      De op grond van het eerste lid aangewezen functionarissen zijn, uitsluitend voor zover dat voor de vervulling van
      hun taak redelijkerwijs noodzakelijk is, bevoegd:
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel12a
  - number: 12a.2.a
    text: 'alle inlichtingen te vragen:'
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel12a
  - number: 12a.2.b
    text: |-
      inzage te verlangen van alle boeken, bescheiden en andere informatiedragers en daarvan afschrift te nemen of deze
      daartoe tijdelijk mee te nemen;
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel12a
  - number: 12a.2.c
    text: goederen aan opneming en onderzoek te onderwerpen en deze daartoe tijdelijk mee te nemen;
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel12a
  - number: 12a.2.d
    text: |-
      alle plaatsen, met uitzondering van woningen zonder de uitdrukkelijke toestemming van de bewoners te betreden,
      vergezeld van door hen aangewezen functionarissen;
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel12a
  - number: 12a.2.e
    text: |-
      woningen of tot woning bestemde gedeelten van vaartuigen zonder de uitdrukkelijke toestemming van de bewoner binnen
      te treden.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel12a
  - number: 12a.3
    text: |-
      Zo nodig, wordt de toegang tot een plaats als bedoeld in het tweede lid, onderdeel d, verschaft met behulp van de
      sterke arm.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel12a
  - number: 12a.4
    text: |-
      Op het binnentreden in woningen of in tot woning bestemde gedeelten van vaartuigen als bedoeld in het
      tweede lid, onderdeel e, is [Titel X van het Derde Boek van het Wetboek van Strafvordering BES][ref1] van
      overeenkomstige toepassing, met uitzondering van de [artikelen 155, vierde lid][ref2], [156, tweede lid][ref3],
      [157, tweede en derde lid][ref4], [158, eerste lid, laatste zinsnede][ref5], en [160, eerste lid][ref6], en met
      dien verstande dat de machtiging wordt verleend door de procureur-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0028681
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel155
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel156
      [ref4]: https://wetten.overheid.nl/BWBR0028681#Artikel157
      [ref5]: https://wetten.overheid.nl/BWBR0028681#Artikel158
      [ref6]: https://wetten.overheid.nl/BWBR0028681#Artikel160
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0028681
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '155'
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '156'
      - id: ref4
        bwb_id: BWBR0028681
        artikel: '157'
      - id: ref5
        bwb_id: BWBR0028681
        artikel: '158'
      - id: ref6
        bwb_id: BWBR0028681
        artikel: '160'
  - number: 12a.5
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de taakuitoefening van de op grond van
      het eerste lid aangewezen functionarissen.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel12a
  - number: 12a.6
    text: |-
      Een ieder is verplicht aan de op grond van het eerste lid aangewezen functionarissen alle medewerking te verlenen
      die in het kader van de toezichtsuitoefening op grond van het tweede en derde lid wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel12a
  - number: '13'
    text: Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld ter uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel13
  - number: '14'
    text: |-
      Alle op grond van deze wet opgemaakte of overgelegde stukken, verzoekschriften en beschikkingen zijn vrij van het
      recht van zegel en van de formaliteit van registratie.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel14
  - number: 14a.1
    text: |-
      Op overtreding van [artikel 11, derde lid][ref1], en het niet of niet tijdig nakomen van een van de
      verplichtingen gesteld bij de [artikelen 5, zesde lid, eerste zin][ref2], [6, eerste lid, tweede zin][ref3],
      [8h, eerste lid][ref4], [8i][ref5], [12, tweede lid][ref6], en krachtens [artikel 13][ref7] wordt een boete geheven
      van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028728#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0028728#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0028728#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0028728#Artikel8h
      [ref5]: https://wetten.overheid.nl/BWBR0028728#Artikel8i
      [ref6]: https://wetten.overheid.nl/BWBR0028728#Artikel12
      [ref7]: https://wetten.overheid.nl/BWBR0028728#Artikel13
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0028728
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0028728
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0028728
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0028728
        artikel: 8h
      - id: ref5
        bwb_id: BWBR0028728
        artikel: 8i
      - id: ref6
        bwb_id: BWBR0028728
        artikel: '12'
      - id: ref7
        bwb_id: BWBR0028728
        artikel: '13'
  - number: 14a.2
    text: |-
      Onder het niet voldoen aan de verplichtingen, genoemd in [artikel 12, tweede lid][ref1], wordt mede verstaan het
      verstrekken van onjuiste inlichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028728#Artikel12
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0028728
        artikel: '12'
  - number: 14a.3
    text: |-
      Indien er sprake is van herhaling van eenzelfde overtreding binnen twee jaar wordt het maximum van de boetes,
      genoemd in het eerste tot en met het derde lid, verdubbeld.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel14a
  - number: 14a.4
    text: De boete wordt geheven door middel van een beschikking van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel14a
  - number: '15.1'
    text: |-
      Overtreding van [artikel 11, derde lid][ref1], en het niet of niet tijdig nakomen van een van de
      verplichtingen gesteld bij de [artikelen 5, zesde lid, eerste zin][ref2], [6, eerste lid, tweede zin][ref3],
      [8h, eerste lid][ref4], [8i][ref5], [12, tweede lid][ref6], en op grond van [artikel 13][ref7] wordt gestraft met
      hechtenis van ten hoogste een maand of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028728#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0028728#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0028728#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0028728#Artikel8h
      [ref5]: https://wetten.overheid.nl/BWBR0028728#Artikel8i
      [ref6]: https://wetten.overheid.nl/BWBR0028728#Artikel12
      [ref7]: https://wetten.overheid.nl/BWBR0028728#Artikel13
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028728
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0028728
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0028728
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0028728
        artikel: 8h
      - id: ref5
        bwb_id: BWBR0028728
        artikel: 8i
      - id: ref6
        bwb_id: BWBR0028728
        artikel: '12'
      - id: ref7
        bwb_id: BWBR0028728
        artikel: '13'
  - number: '15.2'
    text: |-
      Het opzettelijk, mondeling of schriftelijk verstrekken of doen verstrekken van inlichtingen als bedoeld in
      [artikel 12, tweede lid][ref1], die onjuist zijn alsmede het afleggen van een valse verklaring aan Onze Minister,
      wordt gestraft met gevangenisstraf van ten hoogste een jaar of een geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028728#Artikel12
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028728
        artikel: '12'
  - number: '15.3'
    text: |-
      Het opzettelijk door giften, beloften, misbruik van gezag, geweld, bedreiging of misleiding bewegen van
      een werknemer om geen gebruik te maken van een hem op grond van deze wet toekomend recht wordt gestraft met
      gevangenisstraf van ten hoogste een jaar of geldboete van de derde categorie
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel15
  - number: '15.4'
    text: |-
      De in het eerste lid strafbaar gestelde feiten zijn overtredingen en de in het tweede en derde lid strafbaar
      gestelde feiten misdrijven.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel15
  - number: 15a
    text: |-
      Een administratieve boete vervalt, indien degene aan wie de administratieve boete is opgelegd, wegens het feit
      op grond waarvan boete is verschuldigd, onherroepelijk is veroordeeld, is vrijgesproken of is ontslagen van
      rechtsvervolging.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel15a
  - number: 15b.1
    text: |-
      Met de opsporing van bij deze wet strafbaar gestelde feiten zijn, naast de in
      [artikel 184 van het Wetboek van Strafvordering][ref1] bedoelde ambtenaren, belast de door Onze Minister van
      Justitie, in overeenstemming met Onze Minister, aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel184
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '184'
  - number: 15b.2
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld ten aanzien van de functievervulling van de
      op grond van het eerste lid aangestelde functionarissen.
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel15b
  - number: '16'
    text: 'Deze wet wordt aangehaald als: Wet ziekteverzekering BES.'
    url: https://wetten.overheid.nl/BWBR0028728/2011-01-01#Artikel16
