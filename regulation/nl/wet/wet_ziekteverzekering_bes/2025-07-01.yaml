  - number: 7a
    text: |-
      In de gevallen dat de beëindiging of het verlies van het recht op uitkering als gevolg van de toepassing van
      de bepalingen van deze wet tot kennelijke hardheid leidt, is Onze Minister bevoegd, hetzij op verzoek, hetzij
      ambtshalve deze kennelijke hardheid geheel of gedeeltelijk op te heffen.
    url: https://wetten.overheid.nl/BWBR0028728/2025-07-01#Artikel7a
  - number: '8'
    text: |-
      1 Ter zake van de kosten verbonden aan deze wet is een premie verschuldigd, die gezamenlijk wordt geheven met de
      zorgverzekeringspremie.

      2 De premie, bedoeld in het eerste lid, wordt geheven met overeenkomstige toepassing van
      [hoofdstuk IV van de Wet loonbelasting BES][ref1], met dien verstande dat in plaats van «inhoudingsplichtige»
      telkens gelezen wordt «werkgever».

      3 De premie wordt geheven naar een percentage van het loon van de werknemer.

      4 Het premiepercentage, bedoeld in het derde lid, wordt met ingang van elk kalenderjaar bij ministeriële regeling
      in overeenstemming met Onze Minister van Financiën voor de periode van één jaar vastgesteld.

      5 Indien het loon met terugwerkende kracht is verhoogd, wordt voor de berekening van de premie met deze verhoging
      rekening gehouden vanaf het tijdstip dat de verhoging van het loon door de werkgever aan de werknemer is
      uitbetaald.

      6 De premie is verschuldigd door de werkgever.

      7 De premie wordt door de inspecteur geheven van de werkgever door middel van afdracht op aangifte.

      8 De premie komt ten gunste van het Rijk.

      9 Ten laste van het Rijk komen de door Onze Minister verstrekte uitkeringen, bedoeld in de
      [artikelen 3, eerste lid][ref2], en [5, eerste lid][ref3], en alle kosten verbonden aan de uitvoering van deze wet.


