  - number: 8h
    text: |-
      1 De werkgever, diens vaste vertegenwoordiger, de leider van de vaste inrichting van de werkgever of degene
      die de leiding heeft van binnen de openbare lichamen Bonaire, Sint Eustatius of Saba verrichte werkzaamheden is
      desgevraagd gehouden aan Onze Minister of aan de door deze aangewezen personen en deskundigen inzage te verlenen
      of afschrift te verstrekken van de boeken, bescheiden en geschriften, welke voor de vaststelling van de premie
      redelijkerwijs van belang zijn.

      2 Degene die inzage van de boeken, bescheiden en geschriften, bedoeld in het eerste lid, is gevraagd, wordt geacht
      die in zijn bezit te hebben, tenzij het tegendeel aannemelijk is gemaakt.

      3 Bij een weigering om te voldoen aan een verplichting als bedoeld in het eerste lid, kan een werkgever, diens
      vaste vertegenwoordiger, de leider van de vaste inrichting van de werkgever of degene die de leiding heeft van
      binnen de openbare lichamen Bonaire, Sint Eustatius of Saba verrichte werkzaamheden, niet met vrucht een beroep
      doen op de omstandigheid dat hij uit hoofde van zijn stand, zijn beroep of zijn ambt tot geheimhouding verplicht
      is, zelfs al mocht deze hem bij enig wettelijk voorschrift zijn opgelegd.
    url: https://wetten.overheid.nl/BWBR0028728/2025-07-01#Artikel8h
  - number: 8i
    text: |-
      Het is een ieder verboden hetgeen hem, bij de uitvoering van deze wet of in verband daarmee, over inkomen,
      opbrengst, uitdelingen, medische gegevens en in het algemeen over de zaken of werkzaamheden van een ander, blijkt
      of medegedeeld wordt, verder bekend te maken dan nodig is voor de uitvoering van deze wet.
