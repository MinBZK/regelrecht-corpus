  - number: 12e
    text: |-
      1 Onze Minister is bevoegd een ten onrechte uitbetaalde uitkering terug te vorderen van diegene aan wie de
      uitkering is betaald, indien:

      a. het ten onrechte uitbetalen het gevolg is van het niet verstrekken van inlichtingen of het verstrekken van
      onjuiste inlichtingen;

      b. het ten onrechte uitbetalen het gevolg is van het geheel of gedeeltelijk verlies van het recht op een uitkering
      op grond van [artikel 7, eerste lid][ref1]; of

      c. Onze Minister anderszins foutief of ten onrechte een uitkering heeft uitbetaald.

      2 In afwijking van [artikel 203 van Boek 6 van het Burgerlijk Wetboek BES][ref2], kan de werkgever het
      teruggevorderde bedrag niet verhalen op de werknemer, indien de terugvordering in redelijkheid voor rekening van de
      werkgever behoort te komen.

      3 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0028728#Artikel7
