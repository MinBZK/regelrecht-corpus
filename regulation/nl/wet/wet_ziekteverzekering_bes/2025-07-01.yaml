      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. *Onze Minister:* Onze Minister van Sociale Zaken en Werkgelegenheid;

      b. *werkgever:* iedere natuurlijke of rechtspersoon, die binnen het openbare lichaam Bonaire, Sint Eustatius of
      Saba één of meer werknemers arbeid doet verrichten, alsmede de natuurlijke of rechtspersoon die, gevestigd binnen
      het openbare lichaam Bonaire, Sint Eustatius of Saba, één of meer werknemers, die eveneens gevestigd zijn binnen
      het openbare lichaam Bonaire, Sint Eustatius of Saba, arbeid doet verrichten in het buitenland;

      c. *werknemer:* een natuurlijke persoon, die met toepassing van [artikel 2 van de Wet loonbelasting BES][ref1] als
      werknemer wordt beschouwd omdat hij tot een inhoudingsplichtige in dienstbetrekking staat met uitzondering van:

      1°. de kapitein en schepelingen op zeeschepen van Aruba, Curaçao, Sint Maarten of de openbare lichamen Bonaire,
      Sint Eustatius of Saba,

      2°. degene, die in dienst is van een publiekrechtelijk lichaam en aan de voor hem geldende rechtspositieregelingen
      aanspraak op een uitkering bij ziekte kan ontlenen, en

      3°. de bestuurder of commissaris, bedoeld in
      [artikel 3, tweede lid, onderdeel a, van de Wet loonbelasting BES][ref2];

      d. *behandelend geneeskundige:* de geneeskundige die op aanwijzing of met goedvinden van Onze Minster de werknemer
      onderzoekt of behandelt;

      e. *controlerend geneeskundige:* de geneeskundige die als zodanig door Onze Minister is aangewezen;

      f. *arbeidsongeschiktheid:* de toestand waarin de werknemer verkeert, die als gevolg van ziekte gedurende een
      etmaal of langer niet in staat is om zijn normale arbeid te verrichten of deze arbeid zo lang niet mag verrichten
      hetzij om een medisch noodzakelijk onderzoek mogelijk te maken hetzij om te voorkomen dat zijn genezing wordt
      belemmerd, dan wel om besmetting van anderen te voorkomen;

      g. *loon:* het loon, bedoeld in [artikel 6 van de Wet loonbelasting BES][ref3];

      h. *loon per dag van de werknemer voor wie een zesdaagse werkweek geldt:*

      1°. bij een uurloon: de waarde in het economisch verkeer van het loon per uur, vermenigvuldigd met het aantal
      werkuren per week van de betrokken werknemer, het verkregen produkt gedeeld door zes,

      2°. bij een weekloon: de waarde in het economisch verkeer van het loon per week gedeeld door zes,

      3°. bij een maandloon: de waarde in het economisch verkeer van het loon per maand vermenigvuldigd met drie en
      gedeeld door 78;

      i. *loon per dag van de werknemer voor wie een vijfdaagse werkweek geldt:*

      1°. bij een uurloon: de waarde in het economisch verkeer van het loon per uur, vermenigvuldigd met het aantal
      werkuren per week van de betrokken werknemer, het verkregen produkt gedeeld door vijf,

      2°. bij een weekloon: de waarde in het economisch verkeer van het loon per week gedeeld door vijf,

      3°. bij een maandloon: de waarde in het economisch verkeer van het loon per maand vermenigvuldigd met drie en
      gedeeld door 65;

      j. *loon per dag van een werknemer met een werkweek van minder dan vijf dagen:*

      1°. bij een uurloon: de waarde in het economisch verkeer van het loon per uur, vermenigvuldigd met het aantal
      werkuren per week van de betrokken werknemer, het verkregen produkt gedeeld door het aantal dagen waarop de
      werknemer op grond van zijn arbeidsovereenkomst werkt,

      2°. bij een weekloon: de waarde in het economisch verkeer van het loon per week gedeeld door het aantal dagen
      waarop de werknemer op grond van zijn arbeidsovereenkomst werkt,

      3°. bij een maandloon: de waarde in het economisch verkeer van het loon per maand gedeeld door het aantal dagen per
      maand dat op grond van de arbeidsovereenkomst zou zijn gewerkt;

      k. *inkomen:* de belastbare som als bedoeld in [artikel 24, eerste lid, van de Wet inkomstenbelasting BES][ref4];

      l. *inspecteur:* de bij regeling van Onze Minister van Financiën als zodanig aangewezen functionaris;

      m. *ontvanger:* de bij regeling van Onze Minister van Financiën als zodanig aangewezen functionaris;

      n. *uitreiziger:* persoon ten aanzien van wie op grond van een melding van de opsporingsdiensten of
      inlichtingen- en veiligheidsdiensten, gericht aan Onze Minister, is gebleken dat het gegronde vermoeden
      bestaat dat deze persoon zich buiten de openbare lichamen Bonaire, Sint Eustatius en Saba bevindt met het
      doel om zich aan te sluiten bij een organisatie die is geplaatst op de lijst van organisaties, bedoeld in
      [artikel 14, vierde lid, van de Rijkswet op het Nederlanderschap][ref5].

      2 Bij algemene maatregel van bestuur kunnen personen, die op grond van het eerste lid niet de hoedanigheid van
      werknemer hebben, als werknemer worden aangemerkt en kunnen hiervoor nadere regels worden gesteld.


