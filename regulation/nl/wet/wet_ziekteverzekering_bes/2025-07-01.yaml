        artikel: '5'
  - number: '7'
    text: |-
      De werknemer heeft geen recht op uitkering of verliest dit recht:

      a. indien de ziekte te wijten is aan zijn opzet of grove schuld dan wel aan het gebruik van alcoholhoudende drank
      of bedwelmende middelen;

      b. indien en zolang hij zich niet onder behandeling van de behandelende geneeskundige heeft gesteld;

      c. indien hij zich schuldig maakt aan gedragingen waardoor zijn genezing wordt belemmerd;

      d. indien hij niet op de tijden en plaatsen, door Onze Minister aangewezen, de behandelende geneeskundige
      toestaat hem te onderzoeken of te behandelen dan wel diens voorschriften niet opvolgt of zich daarnaast aan andere
      geneeskundige behandeling onderwerpt;

      e. indien hij niet op de tijden en plaatsen, door Onze Minister aangewezen, de controlerende geneeskundige toestaat
      hem te onderzoeken;

      f. indien hij de aanwijzingen van de controlerende geneeskundige, ook wanneer deze afwijken van de voorschriften
      van de behandelende geneeskundige, niet opvolgt;

      g. indien hij zonder de toestemming van Onze Minister het eiland verlaat waar hem de uitkering wordt verstrekt;

      h. indien en voor zoveel hij, met betrekking tot de ziekte, recht heeft op uitkering op grond van de
      [Wet ongevallenverzekering BES][ref1];

      i. indien en voor zolang hij een uitreiziger is.


