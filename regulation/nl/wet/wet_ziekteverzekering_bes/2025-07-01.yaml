  - number: 14a
    text: |-
      1 Op overtreding van [artikel 11, derde lid][ref1], en het niet of niet tijdig nakomen van een van de
      verplichtingen gesteld bij de [artikelen 5, zesde lid, eerste zin][ref2], [6, eerste lid, tweede zin][ref3],
      [8h, eerste lid][ref4], [8i][ref5], [12, tweede lid][ref6], en krachtens [artikel 13][ref7] wordt een boete geheven
      van de tweede categorie.

      2 Onder het niet voldoen aan de verplichtingen, genoemd in [artikel 12, tweede lid][ref8], wordt mede verstaan het
      verstrekken van onjuiste inlichtingen.

      3 Indien er sprake is van herhaling van eenzelfde overtreding binnen twee jaar wordt het maximum van de boetes,
      genoemd in het eerste lid, verdubbeld.

      4 De boete wordt geheven door middel van een beschikking van Onze Minister.


