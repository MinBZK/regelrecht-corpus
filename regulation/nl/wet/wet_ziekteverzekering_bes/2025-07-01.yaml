  - number: '3'
    text: |-
      1 De werknemer heeft in geval van ziekte op grond van deze wet tegenover Onze Minister recht op een uitkering.

      2 Met ziekte worden gelijkgesteld zwangerschap en bevalling van de vrouwelijke verzekerde.

      3 Met ziekte wordt tevens gelijkgesteld lichamelijk letsel als gevolg van een ongeval, tenzij de werknemer op grond
      daarvan recht heeft op ongevallengeld op grond van de [Wet ongevallenverzekering BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028497
