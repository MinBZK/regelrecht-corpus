        bwb_id: BWBR0028497
  - number: '5'
    text: |-
      1 De werknemer die als gevolg van ziekte arbeidsongeschikt is, heeft recht op een uitkering in geld, ziekengeld
      genaamd, met ingang van de derde dag na die van de ziekmelding. Niettemin wordt over de dag van de ziekmelding
      en de twee daarop volgende dagen ziekengeld uitgekeerd, indien naar het oordeel van de behandelende geneeskundige
      de ziekte opneming in een ziekeninrichting noodzakelijk maakt. Het ziekengeld wordt over de bedoelde drie dagen
      eveneens uitgekeerd, indien de duur van de ziekte als gevolg van dezelfde ziekteoorzaak langer dan drie dagen
      bedraagt, ook wanneer geen opneming in een ziekeninrichting noodzakelijk is geweest. Ter zake van eenzelfde
      ziekteoorzaak vervalt dit recht bij onafgebroken arbeidsongeschiktheid twee jaar nadien, indien het betreft een
      arbeidsovereenkomst aangegaan voor onbepaalde tijd, ongeacht het voortduren van de arbeidsovereenkomst. Voor
      een arbeidsovereenkomst aangegaan voor bepaalde tijd vervalt dit recht na verloop van de periode waarvoor zij is
      aangegaan maar uiterlijk twee jaren na de dag van de ziektemelding wegens eenzelfde ziekteoorzaak en onafgebroken
      arbeidsongeschiktheid gedurende deze periode. Indien een overeenkomst voor bepaalde tijd verlengd wordt, is het
      bepaalde met betrekking tot arbeidsovereenkomsten aangegaan voor onbepaalde tijd van toepassing. In geval van
      zwangerschap wordt de vrouwelijke arbeider geacht gedurende de duur van het zwangerschaps- en bevallingsverlof,
      bedoeld in [artikel 1614ca van het Burgerlijk Wetboek BES Boek 7a][ref1], arbeidsongeschikt te zijn. Voor het
      bepalen van de onafgebroken arbeidsongeschiktheid gedurende een periode worden tijdvakken van ongeschiktheid
      samengeteld, indien zij elkaar met een onderbreking van minder dan vier weken opvolgen.

      2 Het ziekengeld bedraagt per dag 80% van het loon per dag van de werknemer, en 100% van het loon per dag van de
      werknemer gedurende het zwangerschaps- en bevallingsverlof, bedoeld in het eerste lid. Voor zover het loon per dag
      meer heeft bedragen dan een door Onze Minister vastgesteld bedrag blijft het bij de toepassing van de eerste zin
      buiten aanmerking.

      3 Indien het loon met terugwerkende kracht is verhoogd, wordt ter bepaling van het ziekengeld met deze verhoging
      rekening gehouden vanaf het tijdstip dat de verhoging van het loon door de werkgever aan de werknemer is
      uitbetaald.

      4 De werknemer heeft geen recht op ziekengeld:

      a. over de zondagen of de daarvoor voor hem in de plaats tredende vrije dagen, terwijl de werknemer voor wie een
      werkweek van vijf dagen of minder geldt bovendien geen recht heeft op ziekengeld over de vrije zaterdagen of de
      daarvoor voor hem in de plaats tredende vrije dagen;

      b. over de periode dat hem ziekengeld ter zake van een andere ziekte wordt uitgekeerd.

      5 Wanneer de werknemer tijdens zijn arbeidsongeschiktheid van zijn werkgever loon ontvangt, wordt het ziekengeld
      per dag verminderd met het bedrag, waarmede het ziekengeld en het loon per dag gezamenlijk het loon per dag,
      waarnaar het ziekengeld is berekend, overtreft.

      6 Tijdens het dienstverband of de werkzaamheden is de werkgever in geval van arbeidsongeschiktheid van de werknemer
      verplicht een uitkering gelijk aan het ziekengeld waarop de werknemer over de desbetreffende loontermijn tegenover
      Onze Minister recht heeft, aan de werknemer uit te betalen op de dag waarop het loon moet worden uitbetaald of
      zou moeten worden uitbetaald indien de werknemer niet arbeidsongeschikt zou zijn. De werkgever die op grond van
      deze verplichting de uitkering uitbetaalt, heeft, in plaats van de werknemer, tegenover Onze Minister recht op
      het desbetreffende ziekengeld en op uitbetaling daarvan door Onze Minister. Indien de werkgever de uitkering niet
      tijdig uitbetaalt, keert Onze Minister het ziekengeld aan de werknemer uit.

      7 Onze Minister is bevoegd om op grond van verdragen, convenanten en andersoortige overeenkomsten met uitvoerders
      van instellingen van sociale voorzieningen, het ziekengeld van een werknemer te verminderen ter ontneming van een
      ten onrechte verkregen voordeel van de werknemer op het gebied van sociale voorzieningen.

      8 Onze Minister is eveneens bevoegd om het ziekengeld van een werknemer te verminderen ter ontneming van
      een ten onrechte verkregen voordeel van de werknemer op het gebied van de door Onze Minister uitbetaalde
      socialeverzekeringsuitkeringen.

      9 De in het zevende en achtste lid bedoelde vermindering kan ineens geschieden indien het ten onrechte genoten
      voordeel niet groter is dan een derde deel van het door Onze Minister verstrekte ziekengeld. In alle andere
      gevallen kan de vermindering niet meer bedragen dan een derde deel van het ziekengeld.


