  - number: 12d
    text: |-
      1 Onze Minister kan een beschikking herzien dan wel intrekken indien:

      a. het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 12, tweede lid][ref1], of
      [12b][ref2] heeft geleid tot een te hoge of ten onrechte toegekende uitkering;

      b. ten onrechte een uitkering is toegekend; of

      c. het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 12, tweede lid][ref3], of
      [12b][ref4] ertoe leidt dat niet kan worden vastgesteld of nog recht op een uitkering bestaat.

      2 Indien daarvoor dringende redenen aanwezig zijn, kan Onze Minister geheel of gedeeltelijk van herziening of
      intrekking afzien.


