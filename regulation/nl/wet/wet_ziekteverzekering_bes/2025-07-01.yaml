    text: |-
      1 Overtreding van [artikel 11, derde lid][ref1], en het niet of niet tijdig nakomen van een van de
      verplichtingen gesteld bij de [artikelen 5, zesde lid, eerste zin][ref2], [6, eerste lid, tweede zin][ref3],
      [8h, eerste lid][ref4], [8i][ref5], [12, tweede lid][ref6], en op grond van [artikel 13][ref7] wordt gestraft met
      hechtenis van ten hoogste een maand of geldboete van de derde categorie.

      2 Het opzettelijk, mondeling of schriftelijk verstrekken of doen verstrekken van inlichtingen als bedoeld in
      [artikel 12, tweede lid][ref8], die onjuist zijn alsmede het afleggen van een valse verklaring aan Onze Minister,
      wordt gestraft met gevangenisstraf van ten hoogste een jaar of een geldboete van de derde categorie.

      3 Het opzettelijk door giften, beloften, misbruik van gezag, geweld, bedreiging of misleiding bewegen van
      een werknemer om geen gebruik te maken van een hem op grond van deze wet toekomend recht wordt gestraft met
      gevangenisstraf van ten hoogste een jaar of geldboete van de derde categorie

      4 De in het eerste lid strafbaar gestelde feiten zijn overtredingen en de in het tweede en derde lid strafbaar
      gestelde feiten misdrijven.


