  - number: '11'
    text: |-
      1 De termijnen van het ziekengeld, die niet zijn ingevorderd binnen twee jaar na de eerste dag, waarop zij konden
      worden ingevorderd, worden niet meer uitbetaald.

      2 Ieder beding, dat de aansprakelijkheid van de werkgever op grond van deze wet uitsluit of vermindert, is nietig.

      3 Het is de werkgever verboden de voor hem uit de bepalingen van deze wet voortvloeiende kosten geheel of
      gedeeltelijk te verhalen op het loon van de werknemer.

      4 De arbeidsgeschikte zieke werknemer, die ten behoeve van geneeskundig onderzoek of behandeling noodzakelijk het
      verrichten van zijn arbeid onderbreekt, behoudt gedurende die tijd tegenover zijn werkgever recht op loon.

      5 De verzekerde, die de uitkering in ontvangst neemt, wordt daardoor niet geacht van het recht op het hem eventueel
      meer toekomende afstand te hebben gedaan.

      6 Indien de werknemer in verband met zijn ziekte, op grond waarvan een uitkering als bedoeld in deze wet is
      toegekend, tegen de werkgever een rechtsvordering tot schadevergoeding heeft naar burgerlijk recht, wordt die
      vordering op grond van deze wet niet verloren, doch de rechter houdt bij de vaststelling der schadevergoeding
      rekening met hetgeen op grond van deze wet aan de werknemer is toegekend.

      7 De persoon, die gehouden is tot vergoeding van schade die door de verzekerde is geleden door ziekte, is voor de
      uitkering aan de verzekerde op grond van deze wet aansprakelijk jegens degene te wiens laste die uitkering komt.

      8 De uitkering is onvervreemdbaar, niet vatbaar voor verpanding of belening, evenmin voor executoriaal of
      conservatoir beslag, noch voor faillissementsbeslag, behalve tot verhaal van het verschuldigde wegens levering
      van levensbehoeften, verstrekt aan degene tegen wie het beslag gedaan wordt en tot verhaal van onderhoud waartoe
      degene, die de uitkering geniet, op grond van enig wettelijk voorschrift is gehouden.
    url: https://wetten.overheid.nl/BWBR0028728/2025-07-01#Artikel11
  - number: '12'
    text: |-
      1 Onze Minister is belast met de uitvoering van deze wet, met dien verstande, dat de heffing van de premie
      geschiedt door de inspecteur en de invordering daarvan door de ontvanger.

      2 Eenieder is verplicht ten behoeve van de uitvoering op verzoek aan Onze Minister inlichtingen te verstrekken,
      desverlangd schriftelijk. De door Onze Minister verlangde inlichtingen moeten binnen een door Onze Minister te
      stellen termijn worden verstrekt. De werknemer, alsmede de werkgever is verplicht uit eigen beweging aan Onze
      Minister inlichtingen te verstrekken waarvan redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn
      op het recht op uitkering, de hoogte of de duur van de uitkering. Ook is eenieder verplicht de door Onze Minister
      gegeven aanwijzingen ten behoeve van de uitvoering van deze wet op te volgen.

      3 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de verplichtingen,
      bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0028728/2025-07-01#Artikel12
  - number: 12a
    text: |-
      1 Onze Minister kan bij ministeriële regeling functionarissen aanwijzen, die zijn belast met het toezicht op deze
      wet.

      2 [Titel 5.2 van de Algemene wet bestuursrecht][ref1] is van toepassing, met uitzondering van de
      [artikelen 5.18][ref2] en [5.19][ref3].

      3 Op het binnentreden in woningen of in tot woning bestemde gedeelten van vaartuigen zonder de uitdrukkelijke
      toestemming van de bewoner, is [Titel X van het Derde Boek van het Wetboek van Strafvordering BES][ref4] van
      overeenkomstige toepassing, met uitzondering van de [artikelen 155, vierde lid][ref5], [156, tweede lid][ref6],
      [157, tweede en derde lid][ref7], [158, eerste lid, laatste zinsnede][ref8], en [160, eerste lid][ref9], en met
      dien verstande dat de machtiging wordt verleend door de procureur-generaal.

      4 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de taakuitoefening van de op grond
      van het eerste lid aangewezen functionarissen.


