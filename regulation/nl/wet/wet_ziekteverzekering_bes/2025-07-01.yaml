  - number: '6'
    text: |-
      1 Zo spoedig mogelijk na de aanvraag deelt Onze Minister, mede aan de hand van geneeskundige beoordeling,
      schriftelijk mee welke uitkering zal worden verstrekt aan de in [artikel 5, zesde lid, tweede zin][ref1], bedoelde
      werkgever. Als de werkgever de in artikel 5, zesde lid, eerste zin, bedoelde verplichting niet naleeft, geschiedt
      de schriftelijke mededeling, bedoeld in de eerste zin, aan de werknemer.

      2 Zodra de behandelende geneeskundige vaststelt dat de werknemer:

      a. zich onder geneeskundige behandeling moet stellen;

      b. zich niet of niet langer onder geneeskundige behandeling behoeft te stellen;

      c. als bedlegerig patiënt behandeld moet worden;

      d. niet of niet langer als bedlegerig patiënt behandeld behoeft te worden;

      e. arbeidsongeschikt is;

      f. niet of niet langer arbeidsongeschikt is; of

      geeft hij van deze bevindingen en zijn daaruit volgende voorschriften schriftelijk kennis aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0028728#Artikel5
    url: https://wetten.overheid.nl/BWBR0028728/2025-07-01#Artikel6
