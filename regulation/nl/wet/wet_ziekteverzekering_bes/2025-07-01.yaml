    text: |-
      1 De bekendmaking van een beschikking geschiedt door toezending of uitreiking aan de rechthebbende.

      2 Indien de bekendmaking van de beschikking niet kan geschieden op de wijze als voorzien in het eerste lid,
      geschiedt zij op een andere geschikte wijze.

      3 De beschikking vermeldt de dagtekening van de beslissing, de gronden waarop deze berust, alsmede waar beroep kan
      worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0028728/2025-07-01#Artikel14b
  - number: 14c
    text: |-
      1 De belanghebbende kan tegen een beschikking op grond van deze wet beroep instellen bij het Gerecht, bedoeld in
      [artikel 1, eerste lid, onderdeel b, van de Wet administratieve rechtspraak BES][ref1].

      2 Bij een beroep tegen een beschikking op grond van [artikel 7, aanhef en onderdeel i][ref2], is
      [artikel 23, eerste lid, laatste zin, van de Wet administratieve rechtspraak BES][ref3] niet van toepassing.

      3 Bij een bestuurlijke heroverweging van een beschikking op grond van [artikel 7, aanhef en onderdeel i][ref4],
      is [artikel 24, eerste en tweede lid, van de Wet administratieve rechtspraak BES][ref5] van overeenkomstige
      toepassing.

      4 Met betrekking tot een beschikking op grond van [artikel 7, aanhef en onderdeel i][ref6], kan het
      Gerecht, bedoeld in [artikel 1, eerste lid, onderdeel b, van de Wet administratieve rechtspraak BES][ref7],
      indien het bestuursorgaan niet voldoet aan de verplichting, bedoeld in
      [artikel 23 van de Wet administratieve rechtspraak BES][ref8], daaruit de gevolgtrekking maken die hem geraden
      voorkomt.


