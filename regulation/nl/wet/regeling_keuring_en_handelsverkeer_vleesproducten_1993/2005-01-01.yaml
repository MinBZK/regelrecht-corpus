  - number: '4'
    text: |-
      Een handelsdocument, onderscheidenlijk keuringscertificaat als bedoeld in
      [artikel 3, eerste lid, en vierde lid][ref1], wordt slechts afgegeven indien:

      a. de vleesproducten zijn bereid en opgeslagen in een vleesproductenfabriek die is erkend overeenkomstig
      [artikel 13][ref2];

      b. de vleesproducten zijn bereid uit:

      1. vers vlees dat is voorzien van een merk als bedoeld in
      [artikel 11 van de Regeling uitvoer vers vlees en vleesbereidingen 1985][ref3] (Stcrt. 1984, 252) dan wel

      2. voor zover bij de bereiding tevens of uitsluitend vlees van pluimvee is gebruikt, dit pluimveevlees is voorzien
      van een merk als bedoeld in [artikel 4.2, eerste lid, van de Regeling keuring en handel dierlijke producten][ref4],
      dan wel

      3. voor zover bij de bereiding tevens of uitsluitend konijnevlees of vlees van gekweekt wild is gebruikt, dit vlees
      voldoet aan de in[richtlijn 91/495/EEG](31991L0495) aan dat vlees gestelde eisen, dan wel

      3a° voor zover bij de bereiding tevens of uitsluitend vlees van vrij wild is gebruikt, dit vlees voldoet aan de in
      [richtlijn 92/45/EEG](31992L0045) aan dat vlees gestelde eisen, dan wel

      4. één of meer vleesproducten, welke voldoen aan het bepaalde in deze regeling, dan wel

      5. één of meer vleesbereidingen die voldoen aan
      [artikel 10.2, eerste lid, van de Regeling keuring en handel dierlijke producten][ref5];

      c. onverminderd onderdeel b, voor zover het vlees betreft dat is ingevoerd uit een derde land, niet zijnde
      Noorwegen dat vlees voldoet aan de minimumeisen van hoofdstuk III van [richtlijn 71/118/EEG](31971L0118) en het
      overeenkomstig [richtlijn 97/78/EG](31997L0078) is gecontroleerd.

      d. de vleesproducten niet zijn bereid met vlees dat met inachtneming van de eisen van de artikelen 5 en 6 van
      [richtlijn 64/433/EEG](31964L0433), artikel 4, eerste lid, derde alinea, van [richtlijn 71/118/EEG](31971L0118)
      en hoofdstuk IX van bijlage I van [richtlijn 71/118/EEG](31971L0118), of anderszins voor menselijke consumptie
      ongeschikt is verklaard, en van:

      1) de organen van het genitaal apparaat van vrouwelijke of mannelijke dieren, met uitzondering van de testikels;

      2) de organen van het urinair apparaat, met uitzondering van de nieren en de blaas;

      3) kraakbeen van het strottehoofd, de luchtpijp en de extra-lobulaire bronchiën;

      4) ogen en oogleden;

      5) de externe gehoorgang;

      6) hoornachtig weefsel, en

      7) bij pluimvee, de kop – met uitzondering van de kam en de oorschelpen, de lellen en de caruncula –, de slokdarm,
      de krop, de darmen en de organen van het genitaal apparaat;

      e. de vleesproducten zijn bereid in overeenstemming met het bepaalde in artikel 4, eerste lid, onderdeel a, van
      [richtlijn 77/99/EEG](31977L0099), met inachtneming van de eisen van hoofdstuk III van bijlage B, behorend bij
      [richtlijn 77/99/EEG](31977L0099), en wat gepasteuriseerde of gesteriliseerde producten in hermetisch gesloten
      recipiënten of kant-en-klaargerechten betreft, deze producten voldoen aan de desbetreffende eisen van hoofdstuk
      VIII of hoofdstuk IX van genoemde bijlage B;

      f. de vleesproducten zijn gecontroleerd overeenkomstig artikel 3, onderdeel A, sub 4, van [richtlijn 77/99/EEG]
      (31977L0099) en – voor zover van toepassing – voldoen aan de eisen van artikel 7, tweede lid, van die richtlijn;

      g. de vleesproducten, indien zij zijn voorzien van een onmiddellijke verpakking, een eindverpakking of een etiket,
      zijn verpakt of geëtiketteerd met inachtneming van artikel 3, onderdeel A, sub 6, van [richtlijn 77/99/EEG]
      (31977L0099);

      h. de vleesprodukten zijn voorzien van het keurmerk, bedoeld in hoofdstuk VI van bijlage B, behorend bij [richtlijn
      77/99/EEG](31977L0099), waarbij tevens wordt voldaan aan het bepaalde in artikel 3, onderdeel A, sub 7, van die
      richtlijn;

      i. de vleesproducten zijn gehanteerd, opgeslagen en vervoerd in overeenstemming met het bepaalde in artikel 3,
      onderdeel a, sub 8, van [richtlijn 77/99/EEG](31977L0099);

      j. de vleesproducten niet onderworpen zijn geweest aan ioniserende straling, tenzij zulks om medische redenen
      verantwoord is en duidelijk op het product en op het certificaat dan wel handelsdocument staat vermeld dat het
      werd doorstraald;

      k. bij het gebruik van lokalen, werktuigen en materieel, die worden gebruikt voor de vervaardiging van
      vleesproducten van of met vlees met een EEG-keurmerk, wordt voldaan aan het bepaalde in artikel 4, tweede lid, van
      [richtlijn 77/99/EEG](31977L0099);

      l. voor zover de producten worden uitgevoerd via een herverpakkingscentrum, dit centrum is erkend overeenkomstig
      [artikel 13, vijfde lid][ref6];

      m. gewaarborgd is dat voldaan is aan het bepaalde in [artikel 3, tweede lid][ref7], eerste alinea, van [richtlijn
      89/662/EEG](31989L0662), en

      n. op grond van de regelgeving van de Europese Gemeenschap of de Toezichthoudende Autoriteit van de Europese
      Vrijhandelsassociatie geen verbod geldt om de vleesproducten uit te voeren of, voor zover de producten zijn bestemd
      voor een lid-staat of Noorwegen, van enige plaats in Nederland naar het grondgebied van die staat te vervoeren.


