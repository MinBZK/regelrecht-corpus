  - number: '8'
    text: |-
      1 Indien in vleesproducten separatorvlees wordt verwerkt dient dit vlees te voldoen aan de volgende eisen:

      a. het moet zijn verkregen in een voor export van vlees, onderscheidenlijk van pluimveevlees erkende uitsnijderij
      of erkend verwerkingsbedrijf;

      b. het moet indien het separatorvlees van vee betreft, zijn verkregen van beenderen van een dier dat binnen 72 uur
      na het slachten is ontbeend;

      c. het moet zijn verkregen van beenderen die voldoen aan de eisen voor vers vlees, vers pluimveevlees dan wel
      vleesproducten, bedoeld in [artikel 4, eerste lid, onderdeel b][ref1];

      d. de beenderen van vee dienen:

        - in geval van warm uitbenen binnen 4 uur na het uitbenen te zijn verwerkt;
        - indien zij onmiddellijk na het uitbenen op een temperatuur van ten hoogste 5°C in de kern zijn gebracht en
      voordurend bij deze temperatuur zijn bewaard, binnen 48 uur na het slachten te zijn verwerkt;
        - indien zij binnen 6 uur na het ontbenen op een temperatuur van ten hoogste – 18°C in de kern zijn gebracht
      en voortdurend bij deze temperatuur zijn bewaard, binnen 14 dagen te zijn verwerkt, met dien verstande dat het
      ontdooien van deze beenderen niet met water mag geschieden en het ontdooien dient te geschieden in een ruimte
      waarin de temperatuur ten hoogste 5°C bedraagt;
        - indien zij volgens een andere door de Minister toegestane wijze zijn geconserveerd, binnen een door de Minister
      te bepalen tijdvak te zijn verwerkt;

      e. het separatorvlees mag niet zijn verkregen van

      1. beenderen als bedoeld in bijlage XI, hoofdstuk A, punt 3, van [verordening 999/2001/EG](32001R0999);

      2. onderpoten van pluimvee of van koppen, met uitzondering van varkenskoppen welke zijn ontdaan van:

        - dat deel van de kop waarin zich de neus en kaakholten bevinden;
        - gedeelten van de kaken waarin zich de tanden bevinden;
        - mondslijmvlies;
        - oren.

      f. de beenderen moeten zijn verwerkt in een machine die vervaardigd is van corrosiebestendig materiaal, gemakkelijk
      is te reinigen en te desinfecteren, in goede staat van onderhoud wordt gehouden en die schoon dient te zijn;

      g. 1. ten aanzien van de verwerking van beenderen van vee dient de temperatuur in de verwerkingsruimte ten hoogste
      10°C te zijn en de temperatuur van het bij de verwerking der beenderen verkregen materiaal mag tijdens deze
      verwerking niet meer dan 5°C stijgen, tenzij de temperatuur van het daarbij verkregen separatorvlees ten hoogste
      7°C bedraagt;

      2. ten aanzien van de verwerking van beenderen van pluimvee dient de temperatuur in de verwerkingsruimte ten
      hoogste 12°C te zijn en de temperatuur van de bij de verwerking der beenderen verkregen substantie mag tijdens deze
      verwerking niet meer stijgen dan technisch onvermijdbaar is;

      h. het calciumgehalte van het separatorvlees mag ten hoogste 0,25% bedragen, metaaldeeltjes dienen afwezig te zijn,
      de botdeeltjes in de pulp mogen niet groter zijn dan 1 mm en het botgehalte mag ten hoogste 1% zijn;

      i. gekoeld separatorvlees dient gekoeld te worden vervoerd, en bevroren separatorvlees in bevroren toestand; tevens
      dient het te worden begeleid door een geleidebiljet, afgegeven door de officiële dierenarts, die is belast met de
      controle op het bedrijf waar het separatorvlees is verkregen.

      2 Het separatorvlees dient:

      a. indien het afkomstig is van vee:

      1) hetzij op de dag van verkrijging in vleesproducten te worden verwerkt;

      2) hetzij na binnen 6 uur na het verkrijgen op een temperatuur van ten hoogste 3°C in de kern te zijn gebracht en
      voortdurend bij deze temperatuur te zijn bewaard, binnen 48 uur te worden verwerkt;

      3) hetzij na binnen 6 uur na het verkrijgen op een temperatuur van ten hoogste –18°C in de kern te zijn gebracht
      en voorzien van een label waarop het erkenningsnummer van de uitsnijderij onderscheidenlijk het verwerkingsbedrijf,
      waarin het is verkregen en de datum van verkrijging is vermeld, voortdurend bij genoemde temperatuur te zijn
      bewaard, binnen 3 maanden te worden verwerkt.

      b. indien het afkomstig is van pluimvee:

      1) na verkrijging onverwijld op een temperatuur van ten hoogste 4°C dan wel ten hoogste –12°C (bevroren) dan
      wel ten hoogste –18°C (diepgevroren) te worden gebracht. In het eerste geval dient het separatorvlees binnen 48
      uur te worden verwerkt. In bedrijven waar de produktie plaatsvindt in een ononderbroken procesgang kan van de
      laatstgenoemde voorwaarde worden afgeweken, wanneer na verkrijging van het separatorvlees twee dagen niet wordt
      gewerkt. In deze situatie kan de genoemde termijn van twee dagen worden verlengd tot drie dagen na verkrijging
      van het separatorvlees. In de laatste twee in de eerste volzin genoemde gevallen dient het separatorvlees binnen 3
      maanden te worden verwerkt;

      2) te zijn voorzien van een label waarop het erkenningsnummer van de uitsnijderij onderscheidenlijk het
      verwerkingsbedrijf, waarin het is verkregen en de datum van verkrijging is vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005602#Artikel4
