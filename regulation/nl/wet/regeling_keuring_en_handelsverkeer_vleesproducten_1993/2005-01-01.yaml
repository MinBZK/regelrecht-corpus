  - number: '3'
    text: |-
      1 Als bewijsstuk, bedoeld in [artikel 69, eerste lid, van de Veewet][ref1] wordt voor vleesproducten van vee,
      alsmede voor vleesproducten van vee en van pluimvee, konijnen, gekweekt wild of vrij wild samen, voor zover het
      betreft uitvoer naar een lid-staat of Noorwegen, aangewezen:

        - een begeleidend handelsdocument overeenkomstig artikel 3, onderdeel A, sub 9, onder b, punt i, van [richtlijn
      77/99/EEG](31977L0099), dan wel
        - indien het om producten gaat die zijn verkregen van vlees afkomstig uit een slachthuis dat is gelegen in een
      gebied of een zone waarvoor om veterinairrechtelijke redenen beperkingen gelden, of om vlees als bedoeld in artikel
      6 van [richtlijn 64/433/EEG](31964L0433), dan wel om producten die voor een andere lid-staat of Noorwegen, zijn
      bestemd na doorvoer via een derde land, niet zijnde Noorwegen, in een met een loodje verzegeld vervoermiddel, een
      keuringscertificaat overeenkomstig bijlage D, behorend bij [richtlijn 77/99/EEG](31977L0099), met dien verstande
      echter dat, in afwijking hiervan
        - voor zover het betreft producten als bedoeld in het tweede gedachtenstreepje in hermetisch gesloten recipiënten
      die de in hoofdstuk VIII, punt B, van bijlage B, behorend bij [richtlijn 77/99/EEG](31977L0099), bedoelde
      behandeling hebben ondergaan, als bewijsstuk wordt aangewezen het in het eerste gedachtenstreepje bedoelde
      handelsdocument.

      2 Als bewijsstuk, bedoeld in [artikel 69, eerste lid, van de Veewet][ref2] wordt voor producten die andere
      levensmiddelen bevatten en die voor een gering percentage uit vlees en vleesproducten van vee, alsmede van vee en
      van pluimvee, konijnen, gekweekt wild of vrij wild tezamen zijn samengesteld, aangewezen het keurmerk, bedoeld in
      artikel 5, eerste lid, van [richtlijn 83/201/EEG](31983L0201), dat moet zijn aangebracht overeenkomstig hoofdstuk
      VI van bijlage B, behorende bij [richtlijn 77/99/EEG](31977L0099).

      3 Als bewijsstuk, bedoeld in [artikel 69, eerste lid, van de Veewet][ref3], wordt voor

      a. vleesproducten van vee, alsmede voor vleesproducten van vee en van pluimvee, konijnen, gekweekt wild of vrij
      wild te zamen, bestemd voor een derde land, niet zijnde Noorwegen, en

      b. andere producten van dierlijke oorsprong, voor zover afkomstig van vee, dan wel van vee en van pluimvee,
      konijnen, gekweekt wild of vrij wild tezamen, aangewezen het handelsdocument, bedoeld in artikel 3, onderdeel A,
      sub 9, onder b, punt i, van [richtlijn 77/99/EEG](31977L0099), met dien verstande dat in dat document de oorsprong
      van genoemde producten moet worden aangegeven.

      4 Het vervoer van vleesproducten van pluimvee, konijnen, gekweekt wild of vrij wild van enige plaats in Nederland
      naar het grondgebied van en bestemd voor een lid-staat of Noorwegen is slechts toegestaan indien:

        - de zending vergezeld gaat van het handelsdocument, bedoeld in het eerste lid, dan wel
        - indien het om producten gaat die zijn verkregen van vlees afkomstig uit een slachthuis dat is gelegen in een
      gebied of een zone waarvoor om veterinairrechtelijke redenen beperkingen gelden, of om producten die voor een
      andere lid-staat of Noorwegen, zijn bestemd na doorvoer via een derde land, niet zijnde Noorwegen, in een met een
      loodje verzegeld vervoermiddel, de zending vergezeld gaat van een keuringscertificaat overeenkomstig bijlage D,
      behorend bij [richtlijn 77/99/EEG](31977L0099), met dien verstande dat, in afwijking hiervan
        - voor zover het betreft producten als bedoeld in het tweede gedachtenstreepje, in hermetisch gesloten
      recipiënten die de in hoofdstuk VIII, punt B, van bijlage B, behorend bij [richtlijn 77/99/EEG](31977L0099),
      bedoelde behandeling hebben ondergaan, de zending vergezeld gaat van het in het eerste gedachtenstreepje bedoelde
      handelsdocument.

      5 Het vervoer van producten die andere levensmiddelen bevatten en die voor een gering percentage uit vlees of
      vleesproducten van pluimvee, konijnen, gekweekt wild of vrij wild zijn samengesteld, van enige plaats in Nederland
      naar het grondgebied van en bestemd voor een ander land, is slechts toegestaan indien de producten zijn voorzien
      van het keurmerk, bedoeld in het tweede lid, dat moet zijn aangebracht overeenkomstig hoofdstuk VI van bijlage B,
      behorende bij [richtlijn 77/99/EEG](31977L0099).

      6 Het vervoer van

      a. vleesproducten van pluimvee, konijnen, gekweekt wild of vrij wild, van enige plaats in Nederland naar het
      grondgebied en bestemd voor een derde land, niet zijnde Noorwegen, en

      b. andere producten van dierlijke oorsprong, afkomstig van pluimvee, konijnen, gekweekt wild of vrij wild, van
      enige plaats in Nederland naar het grondgebied van en bestemd voor een ander land is slechts toegestaan indien de
      zending vergezeld gaat van het handelsdocument, bedoeld in het derde lid.

      7 De in het eerste tot en met zesde lid bedoelde certificaten dan wel handelsdocumenten worden afgegeven door de
      Minister.

      8 Ten behoeve van het onderzoek of een certificaat dan wel een handelsdocument als bedoeld in de eerste tot en met
      zesde lid, kan worden verstrekt, dient de aanvrager tijdig een op de zending producten, waarvoor dat certificaat
      of dat handelsdocument wordt gevraagd, betrekking hebbend, daartoe bestemd aanvraagformulier aan de officiële
      dierenarts, die dit onderzoek verricht, te overhandigen.


