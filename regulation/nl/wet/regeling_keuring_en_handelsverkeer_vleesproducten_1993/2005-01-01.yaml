    text: |-
      Het keurmerk, bedoeld in [artikel 3, tweede en vijfde lid][ref1], wordt slechts aangebracht, indien:

      a. de producten bereid zijn in een krachtens het bepaalde in [artikel 13][ref2] erkende vleesproductenfabriek;

      b. is voldaan aan de eisen neergelegd in [artikel 4, eerste lid, onderdelen b tot en met g en i tot en met m][ref3],
      en

      c. op grond van de regelgeving van de Europese Gemeenschap of de Toezichthoudende Autoriteit van de Europese
      Vrijhandelsassociatie geen verbod geldt om de producten uit te voeren of, voor zover de producten zijn bestemd voor
      een lid-staat of Noorwegen, van enige plaats in Nederland naar het grondgebied van die staat te vervoeren.


