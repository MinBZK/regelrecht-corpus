  - number: 13a
    text: |-
      1 Het laten vervaardigen en het in voorraad hebben van de in deze regeling genoemde merken, alsmede het in op grond
      van deze regeling erkende vleesproductenfabrieken, inrichtingen als bedoeld in [artikel 13, vierde lid][ref1],
      en herverpakkingscentra voorhanden hebben van stempels en andere werktuigen waarmee deze merken kunnen worden
      vervaardigd of aangebracht, is slechts toegestaan met toestemming van de Minister van Landbouw, Natuurbeheer en
      Visserij. Aan deze toestemming kunnen voorschriften worden verbonden. Deze toestemming kan onder beperkingen worden
      verleend.

      2 Het gebruik van de in deze regeling genoemde merken is slechts toegestaan in fabrieken, inrichtingen en centra
      als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005602#Artikel13
    url: https://wetten.overheid.nl/BWBR0005602/2005-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0005602
        artikel: '13'
        paragraaf: '4'
  - number: '14'
    text: |-
      De minister van Landbouw, Natuurbeheer en Visserij kan ontheffing verlenen van het bepaalde in deze regeling; hij
      kan aan een dergelijke ontheffing voorschriften en beperkingen stellen.
    url: https://wetten.overheid.nl/BWBR0005602/2005-01-01#Artikel14
  - number: '15'
    text: |-
      Een wijziging van een of meer onderdelen van de in deze regeling genoemde richtlijnen treedt voor de toepassing van
      de artikelen uit deze regeling, waarin naar die onderdelen wordt verwezen, in werking met ingang van de dag waarop
      aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0005602/2005-01-01#Artikel15
  - number: '16'
    text: De Regeling uitvoer vleesproducten 1979 (Stcrt. 150) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005602/2005-01-01#Artikel16
  - number: '17'
    text: |-
      1 Deze regeling kan worden aangehaald als: [Regeling keuring en handelsverkeer vleesproducten 1993][ref1].

      2 Zij treedt in werking met ingang van de dag na die van haar bekendmaking in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0005602
