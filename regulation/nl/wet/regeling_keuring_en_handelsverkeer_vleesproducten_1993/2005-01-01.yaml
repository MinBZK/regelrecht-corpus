      1 De Minister geeft een handelsdocument als bedoeld in [artikel 3, derde en zesde lid][ref1], voor de producten,
      bedoeld in de onderdelen a van die artikelleden, slechts af indien:

      a. is voldaan aan het bepaalde in het eerste lid [artikel 4, onderdelen a, d, e, f, g][ref2], i, j, en k;

      b. de vleesproducten bereid zijn uit:

      1. vers vlees dat is voorzien van een merk als bedoeld in
      [artikel 11 van de Regeling uitvoer vers vlees en vleesbereidingen 1985][ref3] (Stcrt. 1984, 252) dan wel

      2. vlees dat is voorzien van een keurmerk als bedoeld in
      [artikel 2, eerste lid, onderdeel A, onder e, van het Besluit produktie en handel vers vlees][ref4];

      3. voor zover bij de bereiding tevens of uitsluitend vlees van pluimvee is gebruikt, dit pluimveevlees is voorzien
      van een merk als bedoeld in artikel 3, eerste lid, onderdeel e, van [richtlijn 71/118/EEG](31971L0118);

      4. voor zover bij de bereiding tevens of uitsluitend konijnevlees of vlees van gekweekt wild is gebruikt, dit vlees
      voldoet aan de in [richtlijn 91/495/EEG](31991L0495) aan dat vlees gestelde eisen, dan wel

      4a° voor zover bij de bereiding tevens of uitsluitend vlees van vrij wild is gebruikt, dit vlees voldoet aan de in
      [richtlijn 92/45/EEG](31992L0045) aan dat vlees gestelde eisen, dan wel

      5. één of meer vleesproducten, welke voldoen aan het bepaalde in deze regeling, dan wel

      6. één of meer vleesbereidingen die voldoen aan, voor zover van toepassing,
      [artikel 10.2, tweede lid, van de Regeling keuring en handel dierlijke producten][ref5];

      c. is voldaan aan de door het land van bestemming in zijn handelsdocument gestelde aanvullende eisen;

      d. de vleesproducten, onmiddellijk nadat zij zijn bereid voorzien zijn van een door de Minister vastgesteld
      keurmerk en

      e. de verpakking is voorzien van een duidelijk leesbare, door de betrokken officiële dierenarts goedgekeurde en
      bij hem gedeponeerde aanduiding waaruit blijkt, voor welk land of welke groep van landen de vleesproducten zijn
      vervaardigd.

      2 De Minister geeft een handelsdocument als bedoeld in [artikel 3, derde en zesde lid][ref6], voor de producten,
      bedoeld in de onderdelen b van die artikelleden, slechts af indien:

      a. zijn verkregen in een inrichting die een vergunning heeft gekregen overeenkomstig het bepaalde in
      [artikel 13, vierde lid][ref7], en die voorkomt in een register van dergelijke inrichtingen, dat wordt bijgehouden
      door de Minister;

      b. worden vervaardigd overeenkomstig de specifieke voorwaarden van bijlage C, behorend bij [richtlijn 77/99/EEG]
      (31977L0099), en

      c. worden onderworpen aan de controles van hoofdstuk IV van bijlage B, behorend bij [richtlijn 77/99/EEG]
      (31977L0099);

      d. voor zover de producten zijn bestemd voor een derde land, niet zijn Noorwegen, is voldaan aan de door dat land
      in zijn handelsdocument gestelde aanvullende eisen.

      3 De Minister geeft een handelsdocument als bedoeld in [artikel 3, derde en zesde lid][ref8], voor de producten,
      bedoeld in die artikelleden, slechts af indien op grond van de regelgeving van de Europese Gemeenschap of de
      Toezichthoudende Autoriteit van de Europese Vrijhandelsassociatie geen verbod geldt om die producten uit te voeren
      of, voor zover de producten zijn bestemd voor een lid-staat of Noorwegen, van enige plaats in Nederland naar het
      grondgebied van die staat te vervoeren.


