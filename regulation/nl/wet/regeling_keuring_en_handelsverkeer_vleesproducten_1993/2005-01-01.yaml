  - number: '9'
    text: |-
      1 Als bewijsstuk als bedoeld in [artikel 69, eerste lid, van de Veewet][ref1] wordt voor vleesproducten van
      vee, alsmede voor vleesproducten van vee en van pluimvee, konijnen, gekweekt wild of vrij wild samen, voor zover
      afkomstig uit, alsmede bestemd voor een lid-staat of Noorwegen, aangewezen:

      a. het handelsdocument, bedoeld in [artikel 3, eerste lid][ref2];

      b. het keuringscertificaat, bedoeld in artikel 9, onderdeel a, van [richtlijn 77/99/EEG](31977L0099), indien het
      gaat om producten die zijn verkregen van vlees afkomstig uit een slachthuis dat is gelegen in een gebied of zone
      waarvoor om veterinairrechtelijke redenen beperkingen gelden, om vlees als bedoeld in artikel 6 van [richtlijn
      64/433/EEG](31964L0433), dan wel om producten die voor een lid-staat of Noorwegen zijn bestemd na doorvoer via een
      derde land, niet zijnde Noorwegen, in een met een loodje verzegeld vervoermiddel;

      c. in afwijking van onderdeel b, het handelsdocument, bedoeld in [artikel 3, eerste lid][ref3], voor zover het in
      hermetisch gesloten recipiënten producten als bedoeld in onderdeel b betreft die de in hoofdstuk VIII, punt B, van
      bijlage B, behorende bij [richtlijn 77/99/EEG](31977L0099) bedoelde behandeling hebben ondergaan, dan wel

      d. in afwijking van onderdeel a, b of c, het keurmerk, bedoeld in [artikel 3, tweede lid][ref4], voor zover het
      vleesproducten als bedoeld in [richtlijn 83/201/EEG](31983L0201) betreft.

      2 Als bewijsstuk, bedoeld in [artikel 69, eerste lid, van de Veewet][ref5] wordt voor andere producten van
      dierlijke oorsprong, afkomstig van vee, almede voor dergelijke producten afkomstig van vee en van pluimvee,
      konijnen en, dan wel of, gekweekt wild samen, afkomstig uit alsmede bestemd voor een lid-staat of Noorwegen
      aangewezen het handelsdocument bedoeld in [artikel 3, derde lid][ref6].

      3 Het vervoer van vleesproducten van pluimvee, konijnen en, dan wel of, gekweekt wild, afkomstig uit een lid-staat
      of Noorwegen, van enige plaats in Nederland naar het grondgebied en bestemd voor een lid-staat of Noorwegen, is
      slechts toegestaan indien de vleesproducten overeenkomstig het bepaalde in het eerste lid vergezeld gaan van het
      desbetreffende, in het eerste lid voorgeschreven document, onderscheidenlijk gemerkt zijn met het desbetreffende,
      in het eerste lid voorgeschreven merk.

      4 Het vervoer van andere producten van dierlijke oorsprong, afkomstig van pluimvee, konijnen en, dan wel of,
      gekweekt wild, afkomstig uit een lid-staat of Noorwegen, van enige plaats in Nederland naar het grondgebied
      en bestemd voor een lid-staat of Noorwegen is slechts toegestaan indien die producten vergezeld gaan van het
      handelsdocument, bedoeld in het tweede lid.


