  - number: '10'
    text: |-
      1 Als bewijsstukken onderscheidenlijk bewijsstuk, bedoeld in [artikel 69, eerste lid, van de Veewet][ref1] worden,
      onderscheidenlijk wordt, voor:

      a. vleesproducten dan wel andere producten van dierlijke oorsprong, afkomstig van vee, alsmede voor

      b. vleesproducten dan wel andere producten van dierlijke oorsprong, afkomstig van vee en van pluimvee, konijnen,
      gekweekt wild of vrij wild samen, afkomstig uit een derde land, aangewezen:

      1e voorzover de producten bestemd zijn voor een lidstaat, het Gemeenschappelijk veterinair document van
      binnenkomst, bedoeld in [verordening 136/2004/EG](32004R0136), en het gewaarmerkt afschrift, bedoeld in artikel 7,
      vierde lid, van [richtlijn 97/78/EG](31997L0078);

      2e voorzover de producten bestemd zijn voor een derde land, het bij de partij behorende document.

      2 Het vervoer van vleesproducten dan wel andere producten van dierlijke oorsprong, van pluimvee, konijnen, gekweekt
      wild of vrij wild, afkomstig uit een derde land, van enige plaats in Nederland naar het grondgebied van en bestemd
      voor een lidstaat onderscheidenlijk derde land is slechts toegestaan indien de zending vergezeld gaat van de
      documenten onderscheidenlijk het document, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001900#Artikel69
