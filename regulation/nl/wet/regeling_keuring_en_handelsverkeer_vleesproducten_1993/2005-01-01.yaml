  - number: '2'
    text: |-
      1 Deze regeling is niet van toepassing op de bereiding en de opslag van voor menselijke consumptie bestemde
      vleesproducten alsmede van andere voor menselijke consumptie bestemde producten van dierlijke oorsprong, in
      detailhandelszaken of in lokalen die aan verkooppunten grenzen, waar de bereiding en de opslag uitsluitend met het
      oog op rechtstreekse verkoop aan de consument geschieden.

      2 Het bepaalde in de [artikelen 10][ref1] en [11, eerste lid, onderdelen a en b, en tweede lid][ref2],
      is, met inachtneming van artikel 8 van [verordening 136/2004/EG](32004R0136), niet van toepassing op
      de vleesproducten en andere producten van dierlijke oorsprong, bedoeld in artikel 16, eerste lid, van
      [richtlijn 97/78/EG](31997L0078), met dien versatnde dat onder commerciële monsters, bedoeld in artikel 16,
      eerste lid, onderdeel e, van [richtlijn 97/78/EG](31997L0078) wordt verstaan handelsmonsters, bedoeld in
      [artikel 1.1, eerste lid, van de Regeling keuring en handel dierlijke producten][ref3].

      3 Het verbod, bedoeld in [artikel 69, eerste lid, van de Veewet][ref4] (Stb. 1920, 153) is niet van toepassing op
      de in het eerste en tweede lid genoemde producten.


