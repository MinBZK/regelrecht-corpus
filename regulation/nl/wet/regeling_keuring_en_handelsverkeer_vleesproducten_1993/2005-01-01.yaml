  - number: 11b
    text: |-
      1 Vleesproducten als bedoeld in [artikel 11a, eerste lid, onderdeel 1][ref1], bestemd voor gebruik in Nederland,
      worden slechts voorzien van een keurmerk als bedoeld in [artikel 4, eerste lid, onderdeel h][ref2], indien:

      a. de producten zijn bereid uit:

      1. vlees van pluimvee of van gekweekt vederwild, dat is voorzien van een merk als bedoeld in artikel 3, eerste lid,
      onderdeel e, van [richtlijn 71/118/EEG](31971L0118);

      2.

      2a° vlees van klein vrij wild, dat is voorzien van een merk als bedoeld in artikel 3, vierde lid, onderdeel i, van
      [richtlijn 92/45/EEG](31992L0045);

      3. één of meer vleesproducten, die zijn vervaardigd van vlees als bedoeld in de subonderdelen 1 en, dan wel of, 2,
      en voldoen aan het bepaalde in deze regeling, dan wel

      4. één of meer vleesbereidingen die zijn voorzien van een keurmerk als bedoeld in
      [artikel 10.2, eerste lid, van de Regeling keuring en handel dierlijke producten][ref3] ten bewijze dat zij voldoen
      aan artikel 10.3 van die regeling;

      b. onverminderd onderdeel a, voor zover sprake is van vleesproducten bereid met uit een derde land, niet zijnde
      Noorwegen, ingevoerd vlees, dit vlees voldoet aan aan de minimumeisen van hoofdstuk III van [richtlijn 71/118/EEG]
      (31971L0118) en dit vlees overeenkomstig [richtlijn 90/675/EEG](31990L0675) is gecontroleerd;

      c. de vleesproducten niet zijn bereid met vlees van:

      1º de organen van het genitaal apparaat van vrouwelijke of mannelijke dieren, met uitzondering van de testikels;

      2º de organen van het urinair apparaat, met uitzondering van de nieren en de blaas;

      3º kraakbeen van het strottehoofd, de luchtpijp en de extralobulaire bronchiën;

      4º ogen en oogleden;

      5º de externe gehoorgang;

      6º hoornachtig weefsel, en

      7º bij pluimvee, de kop – met uitzondering van de kam en de oorschelpen, de lellen en de caruncula –, de slokdarm,
      de krop, de darmen en de organen van het genitaal apparaat;

      d. ter zake van de vleesproducten is voldaan aan het bepaalde in [artikel 4, eerste lid, onderdelen e, f, g][ref4],
      i, j en k, en, voor zover van toepassing, [artikel 8, eerste en tweede lid][ref5].

      e. voor zover de producten worden vervoerd via een herverpakkingscentrum, dit centrum is erkend overeenkomstig
      [artikel 13, vijfde lid][ref6].

      2 Produkten die andere levensmiddelen bevatten en die voor een gering percentage uit vlees of vleessoorten zijn
      samengesteld, als bedoeld in [artikel 11a, eerste lid, onderdeel 2][ref7], en die bestemd zijn voor gebruik in
      Nederland, worden slechts voorzien van een keurmerk als bedoeld in [artikel 3, tweede lid][ref8], indien is voldaan
      aan het bepaalde in het eerste lid, onderdelen a tot en met e.


