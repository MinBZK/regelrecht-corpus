preamble:
  text: |-
    Overwegende, dat uitvoering dient te worden gegeven aan de Richtlijn van de Raad van de Europese Gemeenschappen
    van 14 december 1988, nr. 88/658/EEG, tot wijziging van richtlijn 77/99/EEG inzake gezondheidsvraagstukken op het
    gebied van het intracommunautaire handelsverkeer in vleesproducten (PbEG 1988, L 382);

    Gelet op de artikelen 69, 70, tweede lid, en 71 van de Veewet (Stb. 1920, 153) en de artikelen 19, eerste lid, en
    26 van de Landbouwwet (Stb. 1957, 342);

    Gehoord het Produktschap voor Vee en Vlees, de Centrale Organisatie voor de Vleesgroothandel, het Produktschap
    voor Pluimvee en Eieren, het Bedrijfschap Pluimveehandel en -industrie, de Vereniging van de Nederlandse
    pluimveeverwerkende industrie en de Vereniging voor de Nederlandse Vleeswarenindustrie.

    Besluit:
  url: https://wetten.overheid.nl/BWBR0005602/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:




              *richtlijn 64/433/EEG:*


              richtlijn van de Raad van de Europese Gemeenschappen betreffende de gezondheidsvoorschriften voor de
      produktie en het in de handel brengen van vers vlees (PbEG L 121);




              *richtlijn 71/118/EEG:*


              richtlijn van de Raad van de Europese Gemeenschappen van 15 februari 1971 inzake gezondheidsvraagstukken op
      het gebied van het handelsverkeer in vers vlees van pluimvee (PbEG L 55);




              *richtlijn 77/99/EEG:*


              richtlijn van de Raad van de Europese Gemeenschappen betreffende de gezondheidsvoorschriften voor de
      produktie en het in de handel brengen van vleesproducten en bepaalde andere producten van dierlijke oorsprong (PbEG
      1977, L 26);




              *richtlijn 80/215/EEG:*


              richtlijn van de Raad van de Europese Gemeenschappen van 22 januari 1980 inzake veterinairrechtelijke
      vraagstukken op het gebied van het intracommunautaire handelsverkeer in vleesproducten (PbEG L 47);




              *richtlijn 83/201/EEG:*


              richtlijn van de Commissie van de Europese Gemeenschappen van 12 april 1983 houdende afwijking van
      [Richtlijn 77/99/EEG](31977L0099) van de Raad ten aanzien van sommige producten die andere levensmiddelen bevatten
      en die voor een gering percentage uit vlees of vleesproducten zijn samengesteld (PbEG L 112);




              *richtlijn 88/657/EEG:*


              richtlijn van de Raad van de Europese Gemeenschappen van 14 december 1988 tot vaststelling van de eisen
      voor de produktie van en het handelsverkeer in gehakt, vlees in stukken van minder dan 100 gram en vleesbereidingen
      en tot wijziging van de [richtlijnen 64/433/EEG](31964L0433), [71/118/EEG](31971L0118) en [72/462/EEG](31972L0462)
      (PbEG L 382);




              *richtlijn 89/662/EEG:*


              richtlijn van de Raad van de Europese Gemeenschappen van 11 december 1989 inzake veterinaire controles
      in het intracommunautaire handelsverkeer in het vooruitzicht van de totstandbrenging van de interne markt (PbEG
      L 395);




              *richtlijn 91/495/EEG:*


              richtlijn van de Raad van de Europese Gemeenschappen van 27 november 1990 inzake gezondheidsvoorschriften
      en veterinairrechtelijke voorschriften voor de produktie en het in de handel brengen van konijnevlees en vlees van
      gekweekt wild (PbEG 1991, L 268);




              [richtlijn 97/78/EG](31997L0078):

              [richtlijn nr. 97/78/EG](31997L0078) van de Raad van de Europese Unie van 18 december 1997 tot vaststelling
      van de beginselen voor de organisatie van de veterinaire controles voor producten die uit derde landen in de
      Gemeenschap worden binnengebracht (PbEG 1998, L 24);




              *verordening 999/2001/EG:*


              verordening van het Europees Parlement en de Raad van 22 mei 2001, houdende vaststelling van voorschriften
      inzake preventie, bestrijding en uitroeiing van bepaalde overdraagbare spongiforme encefalopathieën;




              *verordening 136/2004/EG:*


              [verordening (EG) nr. 136/2004](32004R0136) van de Commissie van de Europese Gemeenschappen van 22 januari
      2004 tot vaststelling van procedures voor de veterinaire controles in de grensinspectieposten van de Gemeenschap
      bij het binnenbrengen van producten uit derde landen (PbEU L 21);




              *de Minister:*


              de Minister van Landbouw, Natuurbeheer en Visserij




              *officiële dierenarts:*


              door de bevoegde centrale autoriteit van het land van verzending aangewezen dierenarts;




              *vers vlees:*


              vlees, dat geen behandeling heeft ondergaan ter bevordering van de houdbaarheid, tenzij het betreft een
      koelbehandeling;




              *pluimvee:*


              huisdieren, behorende tot de soorten: kippen, kalkoenen, parelhoenders, eenden of ganzen;




              *vlees van pluimvee:*


              alle delen van pluimvee, die naar hun aard geschikt zijn voor menselijke consumptie;




              *konijnen:*


              tamme konijnen;




              *konijnevlees:*


              alle voor menselijke consumptie geschikte delen van konijnen;




              *gekweekt wild:*


              landzoogdieren en vogels als bedoeld in artikel 2, onderdeel 2, van [richtlijn 91/495/EEG](31991L0495),
      niet zijnde vee als bedoeld in [artikel 66, onderdeel a, van de Veewet][ref1] en niet zijnde konijnen;




              *vlees van gekweekt wild:*


              vlees als bedoeld in artikel 2, onderdeel 2, van [richtlijn 91/495/EEG](31991L0495);




              *gekweekt vederwild:*


              vogels als bedoeld in artikel 2, onderdeel 3, van [richtlijn 91/495/EEG](31991L0495);




              *hazen:*


              hazen die in gevangenschap zijn gekweekt, gehouden en geslacht;




              *hazevlees:*


              alle voor menselijke consumptie geschikte delen van hazen;




              *vleesproducten:*


              producten, als bedoeld in artikel 2, onderdeel a, aanhef, van [richtlijn 77/99/EEG](31977L0099), niet
      zijnde vlees onderscheidenlijk producten als bedoeld in [artikel 2, onderdeel a, sub i][ref2] en ii, van die
      richtlijn;




              *andere producten van dierlijke oorsprong:*


              producten als bedoeld in artikel 2, onderdeel b, van [richtlijn 77/99/EEG](31977L0099);




              *kant-en-klaargerechten:*


              verpakte vleesproducten die overeenstemmen met gekookte of voorgekookte culinaire bereidingen, in
      onmiddellijke verpakking, en door koude geconserveerd;




              *vleesbereidingen:*


              vlees als bedoeld in artikel 2 van [richtlijn 64/433/EEG](31964L0433), 71/118/EEG of 92/45/EEG, dan wel
      vlees dat voldoet aan [artikel 3][ref3], 6 of 8 van [richtlijn 91/495/EEG](31991L0495), waaraan levensmiddelen,
      kruiderijen of additieven zijn toegevoegd of dat een behandeling heeft ondergaan in een mate die niet volstaat om
      de inwendige celstructuur van het vlees te veranderen en aldus de kenmerken van vers vlees te doen verdwijnen;




              *producten die andere levensmiddelen bevatten en die voor een gering percentage uit vlees of vleesproducten
      zijn samengesteld:*


              vleesproducten met niet meer dan 10 gewichtspercenten toegevoegd vlees of vleesproducten in verhouding tot
      het eindproduct, klaar voor het gebruik, na bereiding volgens de gebruiksaanwijzingen van de fabrikant;




              *lid-staat:*


              lid-staat van de Europese Unie, niet zijnde Nederland;




              *derde land:*


              land, niet zijnde Nederland en niet zijnde een lid-staat;




              *separatorvlees:*


              verkleinde substantie verkregen door beenderen van vee of pluimvee machinaal te ontdoen van spierweefsel,
      bindweefsel, merg en vet;




              *hermetisch gesloten recipiënt:*


              bergingsmiddel dat geen lucht doorlaat bestemd om de inhoud tijdens en na de hittebehandeling te beschermen
      tegen het binnendringen van micro-organismen;




              *onmiddellijke verpakking:*


              het beschermen van vleesproducten en andere producten van dierlijke oorsprong, die, na behandeling, bestemd
      zijn voor menselijke consumptie of de bereiding van andere levensmiddelen, door middel van een eerste omhulsel
      of van een eerste bergingsmiddel dat rechtstreeks in contact komt met het betrokken product, alsmede het eerste
      omhulsel of het eerste bergingsmiddel zelf;




              *eindverpakking:*


              het plaatsen van een of meer al dan niet van een onmiddellijke verpakking voorziene vleesproducten of
      andere producten van dierlijke oorsprong, die, na behandeling, bestemd zijn voor menselijke consumptie of de
      bereiding van andere levensmiddelen, in een bergingsmiddel, alsmede het bergingsmiddel zelf;




              *herverpakkingscentrum:*


              werkplaats of opslagplaats waar producten bestemd om in de handel te worden gebracht, opnieuw worden
      bijeengebracht en/of worden voorzien van een nieuwe onmiddellijke verpakking;




              *partij:*


              eenzelfde hoeveelheid producten van dezelfde aard waarvoor – voor zover voorgeschreven eenzelfde veterinair
      certificaat of document geldt, die met hetzelfde vervoermiddel wordt vervoerd van één inrichting naar eenzelfde
      plaats van bestemming.




              *richtlijn 92/45/EEG:*


              richtlijn van de Raad van de Europese Gemeenschappen van 16 juni 1992 betreffende de
      gezondheidsvoorschriften en veterinairrechtelijke voorschriften voor het doden van vrij wild en het in de handel
      brengen van vlees van vrij wild (PbEG L 268);




              *vrij wild:*


              landzoogdieren en vogels als bedoeld in artikel 2, eerste lid, onderdeel a, van [richtlijn 92/45/EEG]
      (31992L0045);



            klein vrij wild:

              zoogdieren en vogels als bedoeld in artikel 2, eerste lid, onderdeel c, van [richtlijn 92/45/EEG]
      (31992L0045);



            vlees van vrij wild:

              alle voor menselijke consumptie geschikte delen van vrij wild;



            belanghebbende bij de lading:

              belanghebbende bij de lading als bedoeld in artikel 2, tweede lid, onderdeel e, van [richtlijn 97/78/EG]
      (31997L0078);




              [verordening 1829/2003](32003R1829):

              verordening (EG) nr. 1829/2003 van het Europees Parlement en de Raad van de Europese Unie van 22 september
      2003 inzake genetisch gemodificeerde levensmiddelen en diervoeders (PbEU L 268);




              [verordening 1830/2003](32003R1830):

              verordening (EG) nr. 1830/2003 van het Europees Parlement en de Raad van de Europese Unie van 22 september
      2003 betreffende de traceerbaarheid van genetisch gemodificeerde organismen en de traceerbaarheid van met genetisch
      gemodificeerde organismen geproduceerde levensmiddelen en diervoeders en tot wijziging van [Richtlijn 2001/18/EG]
      (32001L0018) (PbEU L 268).


