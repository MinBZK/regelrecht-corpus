  - number: '12'
    text: |-
      1 Bij de aanvraag om een erkenning of vergunning als bedoeld in [artikel 13][ref1] dient de aanvrager een volledig
      en naar waarheid ingevulde en ondertekende verklaring van een door de Minister vastgesteld model over te leggen,
      inhoudende, dat in zijn bedrijf geen vleesproducten bestemd voor de export naar een land zullen worden bereid
      dan wel herverpakt indien niet wordt voldaan aan de door dat land in zijn invoercertificaat of -handelsdocument
      gestelde bijzondere eisen.

      2 Aan een vleesproductenfabriek, een inrichting waar andere producten van dierlijke oorsprong worden geproduceerd,
      dan wel een herverpakkingscentrum wordt, indien de inrichting overeenkomstig deze regeling is erkend, een
      toelatingsnummer toegekend.

      3 Eenzelfde toelatingsnummer als dat, bedoeld in het tweede lid, kan worden toegekend aan een inrichting of
      herverpakkingscentrum als bedoeld in [artikel 8, eerste lid][ref2], tweede alinea, onderdelen i en ii, van
      [richtlijn 77/99/EEG](31977L0099).

      4 Indien een uit hoofde van de [artikelen 13, eerste of tweede lid][ref3], erkende inrichting geïntegreerd is
      in een erkende inrichting als bedoeld in [artikel 8, eerste lid][ref4], derde alinea, van [richtlijn 77/99/EEG]
      (31977L0099), mogen de voor het personeel bestemde lokalen, apparatuur en installaties, alsmede alle lokalen
      waar geen gevaar bestaat voor besmetting van grondstoffen of producten zonder onmiddellijke verpakking, voor deze
      inrichtingen gemeenschappelijk zijn.


