  - number: '11'
    text: |-
      1 De eisen, bedoeld in [artikel 69 van de Veewet][ref1] zijn voor wat betreft de uitvoer, bedoeld in de
      [artikelen 9][ref2] en [10][ref3] de volgende:

      a. in geval van uitvoer naar meer dan één bestemming moeten er van de producten evenveel partijen worden
      gemaakt als er bestemmingen zijn en dient elke partij te zijn voorzien van de dienaangaande op grond van de
      [artikelen 9][ref4] en [10][ref5] vereiste bewijsstukken;

      b. in geval van uitvoer van producten afkomstig uit een derde land naar een derde land:

        - heeft de Minister vooraf toestemming verleend voor het brengen van de partij in Nederland;
        - heeft de belanghebbende bij de lading voor het brengen van de partij in Nederland aan de Minister schriftelijk
      toegezegd de partij weer in bezit te zullen nemen en schriftelijk toegezegd de producten overeenkomstig artikel 17
      van [richtlijn 97/78/EG](31997L0078) te behandelen, indien de producten in het derde land worden geweigerd;
        - vindt het vervoer over Nederlands grondgebied onder douanetoezicht plaats zonder splitsing of lossing van de
      partij in verzegelde voertuigen of verzegelde containers;

      c. indien de producten bestemd zijn voor een derde land, dient te zijn voldaan aan het bepaalde in
      [artikel 3, tweede lid][ref6], tweede alinea, van [richtlijn 89/662/EEG](31989L0662);

      d. de producten mogen geen tekenen van bederf of andere ondeugdelijkheden vertonen;

      e. is voldaan aan:

      1°. de artikelen 4, eerste, tweede en zesde lid, 8, eerste lid, 9, eerste en derde lid, en 13 van [verordening
      1829/2003](32003R1829);

      2°. de artikelen 4, eerste, tweede, vierde en zesde lid, en 5, eerste en tweede lid, van [verordening 1830/2003]
      (32003R1830).

      2 Ten aanzien van het vervoer, bedoeld in [artikel 9, derde lid][ref7], en 10, tweede lid, is het bepaalde in het
      eerste lid van overeenkomstige toepassing.


