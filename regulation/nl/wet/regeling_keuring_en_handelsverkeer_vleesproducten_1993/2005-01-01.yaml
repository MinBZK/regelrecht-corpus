  - number: '7'
    text: |-
      Ten aanzien van in Nederland vervaardigde vleesproducten geldt voorts het volgende:

      a. Het onderzoek of voldaan is aan het bepaalde in [artikel 4, eerste lid, onderdelen a tot en met l][ref1], vindt
      uitsluitend plaats in de fabriek waar de vleesproducten worden bereid;

      b. de keurmerken, bedoeld in
      [artikel 4, eerste lid, onderdeel h, in artikel 5, eerste lid, onderdeel d, en in artikel 6][ref2], worden slechts
      aangebracht onder verantwoordelijkheid van de officiële dierenarts;

      c. de in onderdeel b bedoelde keurmerken mogen slechts éénmaal worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0005602#Artikel4
