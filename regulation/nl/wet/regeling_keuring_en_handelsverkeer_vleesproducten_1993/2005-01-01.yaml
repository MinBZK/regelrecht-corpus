  - number: '13'
    text: |-
      1 Tenzij sprake is van een geval als bedoeld in het tweede of derde lid, wordt een vleesproductenfabriek slechts
      erkend indien:

      a. is voldaan aan de eisen gesteld in hoofdstuk I van bijlage A en hoofdstuk I van bijlage B, behorend bij
      [richtlijn 77/99/EEG](31977L0099), met dien verstande dat aan de Voedsel en Waren Autoriteit de volgende
      voorzieningen om niet ter beschikking worden gesteld:

        - 1 afsluitbare ruimte met een afsluitbare kast, een tafel, stoelen en een telefoon;
        - en indien gewoonlijk 2 uur of meer per dag controle wordt uitgeoefend, 1 kleedruimte met wasgelegenheid en
      toilet, enz.

      b. is gewaarborgd dat ook de overige voorschriften van bijlage A en bijlage B, behorend bij [richtlijn 77/99/EEG]
      (31977L0099), voor zover van toepassing, worden nageleefd;

      c. is voldaan aan de eisen bedoeld in artikel 7 van [richtlijn 77/99/EEG](31977L0099).

      2 Indien een vleesproductenfabriek geen industriële productiestructuur en - capaciteit bezit en niet meer dan 7,5
      ton, dan wel, wanneer het ganzelever betreft, 1 ton afgewerkt vleesproduct per week produceert wordt dit bedrijf
      erkend indien wordt voldaan aan het bepaalde in het eerste lid, onderdelen a, b en c, met dien verstande dat:

        - niet behoeft te worden voldaan aan het bepaalde hoofdstuk I, punt 3, van bijlage A, behorend bij [richtlijn
      77/99/EEG](31977L0099) met betrekking tot de lokalen voor de opslag van grondstoffen en eindproducten, mits het
      bedrijf beschikt over een lokaal of voorziening als bedoeld in [artikel 9, eerste lid][ref1], tweede alinea,
      onderdeel i of ii, van [richtlijn 77/99/EEG](31977L0099);
        - niet behoeft te worden voldaan aan het bepaalde in hoofdstuk I van bijlage B en hoofdstuk I, punt 2, onder g, van
      bijlage a, behorend bij [richtlijn 77/99/EEG](31977L0099), wat kranen betreft en punt 11, zodat kan worden volstaan
      met kasten in plaats van kleedlokalen, en
        - hoofdstuk VII van bijlage B, niet van toepassing is op de opslag in dit bedrijf, noch op het vervoer van andere
      producten dan die bedoeld in artikel 7, tweede lid, van [richtlijn 77/99/EEG](31977L0099).

      3 Een vleesproductenfabriek waar producten worden vervaardigd die andere levensmiddelen bevatten en die voor een
      gering percentage uit vlees of vleesproducten zijn samengesteld, wordt, ongeacht of de betreffende fabriek een
      industriële productiestructuur en -capaciteit bezit, slechts erkend indien:

      a. de bedrijfsruimten waar vers vlees of vleesproducten worden ingeslagen, opgeslagen, behandeld en verwerkt in
      producten die andere levensmiddelen bevatten en die voor een gering percentage uit vlees of vleesproducten zijn
      samengesteld, en waar deze laatstbedoelde producten worden vervaardigd en opgeslagen voldoen aan de eisen gesteld
      in hoofdstuk I van bijlage A van [richtlijn 77/99/EEG](31977L0099);

      b. is gewaarborgd dat ook de overige voorschriften van bijlage A en B van [richtlijn 77/99/EEG](31977L0099), voor
      zover van toepassing, worden nageleefd.

      4 Een vergunning voor een inrichting waar andere producten van dierlijke oorsprong worden geproduceerd, wordt
      slechts afgegeven indien deze inrichting:

      a. voldoet aan het bepaalde in [artikel 6][ref2], met inachtneming van de eisen van artikel 7, van [richtlijn
      77/99/EEG](31977L0099), en

      b. wordt gecontroleerd overeenkomstig artikel 8 van [richtlijn 77/99/EEG](31977L0099);

      5 Een herverpakkingscentrum wordt slechts erkend indien:

      a. voor zover het een centrum betreft waar vleesproducten of andere producten van dierlijke oorsprong uitsluitend
      worden gehergroepeerd zonder dat de onmiddellijke verpakking wordt verwijderd:

      1º. die producten overeenkomstig hoofdstuk VII, punt 1, van bijlage B van [richtlijn 77/99/EEG](31977L0099) worden
      opgeslagen, en

      2º. de lokalen of opslagruimten, waarin de vorenbedoelde producten worden opgeslagen, overigens voldoen aan
      hoofdstuk I van de bijlage van [richtlijn 93/43/EEG](31993L0043);

      b. voor zover het een centrum betreft waar vleesproducten of andere producten van dierlijke oorsprong van hun
      onmiddellijke verpakking worden ontdaan en van een nieuwe onmiddellijke verpakking worden voorzien, dat centrum
      voldoet aan bijlage A, alsmede hoofdstuk I, punten 1, met uitzondering van onderdeel c, en 2, onderdelen a, b,
      c, i en j, hoofdstuk II, punten 1, 2 en 3, en de hoofdstukken V en VII van bijlage B van [richtlijn 77/99/EEG]
      (31977L0099);

      c. voor zover het centrum tevens dient als koel- of vrieshuis, ten behoeve van het verrichten van de handelingen,
      bedoeld in onderdeel b, een apart lokaal aanwezig is dat voldoet aan de in dat onderdeel bedoelde eisen;

      d. is gewaarborgd dat:

      1º. voor zover het een centrum betreft als bedoeld in onderdeel a, de vleesproducten of andere producten van
      dierlijke oorsprong die van dat centrum afkomstig zijn, voorzien blijven van het keurmerk dat is aangebracht in de
      producerende inrichting van oorsprong, tenzij dat keurmerk ten gevolge van de handelingen, bedoeld in onderdeel a,
      niet meer lees- of zichtbaar is, in welk geval is gewaarborgd dat de eindverpakking van de gehergroepeerde partij
      overeenkomstig hoofdstuk VI van bijlage B van [richtlijn 77/99/EEG](31977L0099) wordt voorzien van het keurmerk van
      dat centrum;

      2º. voor zover het een centrum betreft als bedoeld in onderdeel b, de vleesproducten of andere producten van
      dierlijke oorsprong ten aanzien waarvan handelingen als bedoeld in onderdeel b zijn verricht, overeenkomstig
      hoofdstuk VI van bijlage B van [richtlijn 77/99/EEG](31977L0099) worden voorzien van het keurmerk van dat centrum;

      e. in dat centrum gebruik wordt gemaakt van een registratiesysteem aan de hand waarvan is na te gaan uit welke
      producerende inrichting van oorsprong de herverpakte producten afkomstig zijn;

      f. in dat centrum wordt voldaan aan de eisen, bedoeld in artikel 7 van [richtlijn 77/99/EEG](31977L0099).

      6 Onverminderd het bepaalde in de voorgaande leden wordt een vleesproductenfabriek, een inrichting waar andere
      producten van dierlijke oosprong worden vervaardigd, onderscheidenlijk een herverpakkingscentrum slechts erkend
      indien de officiële dierenarts te allen tijde vrije toegang heeft tot alle delen van de desbetreffende inrichting,
      ten einde erop toe te zien dat het bepaalde in deze regeling wordt nageleefd, en, in geval van twijfel over de
      herkomst van het vlees, tot de boekhoudkundige documenten aan de hand waarvan hij het slachthuis van oorsprong of
      de inrichting van oorsprong van de grondstoffen kan opsporen.

      7 In de werk- en opslagruimten van een erkende vleesproductenfabriek, een inrichting waar andere producten van
      dierlijke oosprong worden vervaardigd, onderscheidenlijk een herverpakkingscentrum dient op een voor ieder goed
      zichtbare plaats een goed leesbare instructie aanwezig te zijn, waarin is aangegeven welke hygiënische eisen bij de
      werkzaamheden in acht moeten worden genomen.

      8 Indien de officiële dierenarts een duidelijke overtreding van de voorschriften van deze regeling of een
      belemmering van een adequate keuring constateert, kan onderscheidenlijk moet hij de maatregelen nemen, bedoeld in
      [artikel 8, eerste lid][ref3], vierde alinea, onderdeel i, onderscheidenlijk onderdeel ii, van [richtlijn 77/99/
      EEG](31977L0099).


      [ref1]: https://wetten.overheid.nl/BWBR0005602#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005602#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005602#Artikel8
