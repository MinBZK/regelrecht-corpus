        artikel: '14'
  - number: 7b.2.1
    text: De in een tijdvak verschuldigd geworden belasting wordt op aangifte voldaan.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.2
  - number: 7b.2.2
    text: |-
      In afwijking van [artikel 8.5, tweede lid, eerste zin][ref1], en [artikel 8.11, derde lid][ref2], stelt de
      inspecteur de termijn voor het doen van aangifte zodanig vast dat deze niet eerder verstrijkt dan zeventien maanden
      na het einde van het tijdvak.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.2
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '3'
  - number: 7b.2.3
    text: |-
      In afwijking van [artikel 8.11, eerste lid][ref1], is de belastingplichtige gehouden de belasting overeenkomstig de
      aangifte aan de ontvanger te betalen binnen zeventien maanden na het einde van het tijdvak.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.2
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '3'
  - number: 7b.2.4
    text: |-
      Indien [artikel 8.4, zevende lid, van de Wet minimumbelasting 2024][ref1] toepassing vindt op een bedrag aan
      ingevolge [hoofdstuk 3 van die wet][ref2] verschuldigde binnenlandse bijheffing vervalt de betalingsverplichting
      voor dat bedrag aan binnenlandse bijheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.2
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0049111
        hoofdstuk: '3'
  - number: 7b.3.1
    text: |-
      In afwijking van [artikel 8.12, vierde lid][ref1], vervalt de bevoegdheid tot naheffing door verloop van zes jaren
      en vier maanden na het einde van het tijdvak waarover de belasting is verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.3
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '3'
  - number: 7b.3.2
    text: |-
      Indien [artikel 7b.8, eerste en tweede lid][ref1], toepassing vindt, vervalt in afwijking van
      [artikel 8.12, vierde lid][ref2], de bevoegdheid tot naheffing door verloop van zes jaren en zeven maanden na het
      einde van het tijdvak waarover de belasting is verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel7b
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.3
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: 7b
        hoofdstuk: VIIb
      - id: ref2
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '3'
  - number: 7b.3.3
    text: |-
      Indien [artikel 8.4, zevende lid, van de Wet minimumbelasting 2024][ref1] toepassing vindt op een bedrag aan
      ingevolge [hoofdstuk 3 van die wet][ref2] verschuldigde binnenlandse bijheffing vervalt:


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.3
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0049111
        hoofdstuk: '3'
  - number: 7b.3.3.a
    text: de bevoegdheid tot naheffing met betrekking tot dat bedrag; en
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.3
  - number: 7b.3.3.b
    text: een voor dat bedrag reeds opgelegde naheffingsaanslag die nog niet is ingevorderd.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.3
  - number: 7b.4.1
    text: |-
      De belastingplichtige is gehouden de inspecteur eigener beweging juiste en volledige inlichtingen of gegevens
      die van belang kunnen zijn voor de heffing van de belasting te verstrekken binnen twee weken nadat hem bekend is
      geworden dat die inlichtingen of gegevens niet, onjuist of onvolledig door hem zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.4
  - number: 7b.4.2
    text: De verplichting, bedoeld in het eerste lid, wordt nagekomen op de door de inspecteur aangegeven wijze.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.4
  - number: 7b.4.3
    text: |-
      De verplichting, bedoeld in het eerste lid, vervalt door verloop van zes jaren en vier maanden na het einde van het
      tijdvak waarover de belasting is verschuldigd.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.4
  - number: 7b.4.4
    text: |-
      Indien [artikel 7b.8, eerste en tweede lid][ref1], toepassing vindt, vervalt de verplichting, bedoeld in het
      eerste lid, door verloop van zes jaren en zeven maanden na het einde van het tijdvak waarover de belasting is
      verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel7b
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.4
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: 7b
        hoofdstuk: VIIb
  - number: 7b.5.1
    text: |-
      Voor de toepassing van [artikel 8.22, tweede lid][ref1], vormt het verzuim het niet doen van aangifte
      dan wel het niet doen van aangifte binnen de ingevolge [artikel 7b.2, tweede lid][ref2], dan wel
      [artikel 7b.8, eerste lid][ref3], gestelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel7b
      [ref3]: https://wetten.overheid.nl/BWBR0029244#Artikel7b
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.5
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0029244
        artikel: 7b
        hoofdstuk: VIIb
      - id: ref3
        bwb_id: BWBR0029244
        artikel: 7b
        hoofdstuk: VIIb
  - number: 7b.5.2
    text: |-
      Voor de toepassing van [artikel 8.23, eerste lid][ref1], vormt het verzuim het niet, gedeeltelijk niet, dan wel
      niet binnen de ingevolge [artikel 7b.2, derde lid][ref2], dan wel [artikel 7b.8, tweede lid][ref3], gestelde
      termijn betalen van de belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel7b
      [ref3]: https://wetten.overheid.nl/BWBR0029244#Artikel7b
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.5
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0029244
        artikel: 7b
        hoofdstuk: VIIb
      - id: ref3
        bwb_id: BWBR0029244
        artikel: 7b
        hoofdstuk: VIIb
  - number: 7b.5.3
    text: |-
      In afwijking van de [artikelen 8.23, derde lid][ref1], en [8.26, vierde lid][ref2], vervalt de bevoegdheid tot het
      opleggen van een bestuurlijke boete op grond van die artikelen door verloop van zes jaren en vier maanden na het
      einde van het tijdvak waarover de belasting is verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.5
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '1'
  - number: 7b.5.4
    text: |-
      Indien [artikel 7b.8, eerste en tweede lid][ref1], toepassing vindt, vervalt in afwijking van de
      [artikelen 8.23, derde lid][ref2], en [8.26, vierde lid][ref3], de bevoegdheid tot het opleggen van een
      bestuurlijke boete op grond van die artikelen door verloop van zes jaren en zeven maanden na het einde van het
      tijdvak waarover de belasting is verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel7b
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.5
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: 7b
        hoofdstuk: VIIb
      - id: ref2
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '1'
  - number: 7b.6.1
    text: |-
      Indien het aan opzet of grove schuld van de belastingplichtige is te wijten dat de verplichting, bedoeld in
      [artikel 7b.4, eerste lid][ref1], niet is of wordt nagekomen, vormt dit een vergrijp ter zake waarvan de
      inspecteur hem een boete kan opleggen van ten hoogste 100 percent van de in het tweede lid omschreven grondslag van
      de boete.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel7b
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.6
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: 7b
        hoofdstuk: VIIb
  - number: 7b.6.2
    text: |-
      De grondslag voor de boete wordt gevormd door het bedrag aan belasting dat als gevolg van het niet nakomen van de
      verplichting, bedoeld in [artikel 7b.4, eerste lid][ref1], ten onrechte niet zou zijn geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel7b
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.6
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: 7b
        hoofdstuk: VIIb
  - number: 7b.6.3
    text: |-
      De bevoegdheid tot het opleggen van een vergrijpboete op grond van het eerste lid vervalt door verloop van zes
      jaren en vier maanden na het einde van het tijdvak waarover de belasting is verschuldigd.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.6
  - number: 7b.6.4
    text: |-
      Indien [artikel 7b.8, eerste en tweede lid][ref1], toepassing vindt, vervalt de bevoegdheid tot het opleggen van
      een vergrijpboete op grond van het eerste lid door verloop van zes jaren en zeven maanden na het einde van het
      tijdvak waarover de belasting is verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel7b
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.6
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: 7b
        hoofdstuk: VIIb
  - number: 7b.7
    text: |-
      Hoofdelijk aansprakelijk is voor de minimumbelasting die over een tijdvak is geheven van een
      groepsentiteit behorend tot een multinationale groep of binnenlandse groep als bedoeld in
      [artikel 1.2, eerste lid, van de Wet minimumbelasting 2024][ref1]: elk van de groepsentiteiten die in dat tijdvak
      deel uitmaakt of uitmaakte van die multinationale groep of binnenlandse groep.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel1
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.7
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '1'
  - number: 7b.8.1
    text: |-
      In afwijking van de [artikelen 8.5, tweede lid, eerste zin][ref1], [8.11, derde lid][ref2], en
      [7b.2, tweede lid][ref3], stelt de inspecteur de termijn voor het doen van aangifte over het overgangsjaar zodanig
      vast dat deze niet eerder verstrijkt dan twintig maanden na het einde van dat tijdvak.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0029244#Artikel7b
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.8
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0029244
        artikel: 7b
        hoofdstuk: VIIb
  - number: 7b.8.2
    text: |-
      In afwijking van de [artikelen 8.11, eerste lid][ref1], en [7b.2, derde lid][ref2], is de belastingplichtige
      gehouden de belasting over het overgangsjaar aan de ontvanger overeenkomstig de aangifte te betalen binnen twintig
      maanden na het einde van dat tijdvak.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel7b
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.8
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0029244
        artikel: 7b
        hoofdstuk: VIIb
  - number: 7b.8.3
    text: |-
      In afwijking van [artikel 13.1, zevende lid, van de Wet minimumbelasting 2024][ref1] worden de bijheffing-
      informatieaangifte en kennisgeving, bedoeld in dat artikel, met betrekking tot het overgangsjaar binnen achttien
      maanden na het einde van dat tijdvak ingediend bij de inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel13
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.8
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '13'
  - number: 7b.8.4
    text: |-
      Dit artikel vindt geen toepassing indien door de multinationale groep waartoe de belastingplichtige behoort
      voorafgaand aan het overgangsjaar een bijheffing-informatieaangifte is ingediend in een andere staat waarmee
      Nederland voor wat betreft de BES eilanden voor dat jaar een kwalificerende overeenkomst tussen bevoegde
      autoriteiten als bedoeld in [artikel 13.1, eerste lid, onderdeel b, van de Wet minimumbelasting 2024][ref1]heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel13
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.8
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '13'
  - number: 7b.8.5
    text: |-
      Voor de toepassing van dit artikel wordt onder overgangsjaar verstaan: het eerste verslagjaar waarin een
      multinationale groep als bedoeld in [artikel 1.2, eerste lid, van de Wet minimumbelasting 2024][ref1] met
      betrekking tot de BES eilanden regels ter implementatie van [Richtlijn (EU) 2022/2525](32022L2525) of van de
      OESO-modelregels dient toe te passen, of het eerste verslagjaar waarin een binnenlandse groep als bedoeld in
      artikel 1.2, eerste lid, van die wet in samenhang met [artikel 7b.1, eerste lid, onderdeel a][ref2], voldoet aan
      de criteria, bedoeld in [artikel 2.1 van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel7b
      [ref3]: https://wetten.overheid.nl/BWBR0049111#Artikel2
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.8
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0029244
        artikel: 7b
        hoofdstuk: VIIb
      - id: ref3
        bwb_id: BWBR0049111
        artikel: '2'
  - number: 7b.9
    text: 'Indien het overgangsjaar eindigt vóór 31 december 2024 of het verslagjaar eindigt vóór 31 maart 2025:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.9
  - number: 7b.9.a
    text: |-
      worden, in afwijking van [artikel 13.1, zevende lid, van de Wet minimumbelasting 2024][ref1] en
      [artikel 7b.8, derde lid][ref2], de bijheffing-informatieaangifte en de kennisgeving met betrekking tot dat
      overgangsjaar of verslagjaar vóór 30 juni 2026 ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel7b
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.9
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0029244
        artikel: 7b
        hoofdstuk: VIIb
  - number: 7b.9.b
    text: |-
      verstrijkt de termijn voor het doen van aangifte, in afwijking van [artikel 8.5, tweede lid, eerste zin][ref1],
      [artikel 7b.2, tweede lid][ref2] en [artikel 7b.8, eerste lid][ref3], niet eerder dan 1 september 2026.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel7b
      [ref3]: https://wetten.overheid.nl/BWBR0029244#Artikel7b
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.9
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0029244
        artikel: 7b
        hoofdstuk: VIIb
      - id: ref3
        bwb_id: BWBR0029244
        artikel: 7b
        hoofdstuk: VIIb
  - number: 7b.9.c
    text: |-
      is de belastingplichtige, in afwijking van [artikel 8.11, eerste lid][ref1], [artikel 7b.2, derde lid][ref2], en
      [artikel 7b.8, tweede lid][ref3], gehouden vóór 1 september 2026 de belasting over dat overgangsjaar of verslagjaar
      overeenkomstig de aangifte aan de ontvanger te betalen.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel7b
      [ref3]: https://wetten.overheid.nl/BWBR0029244#Artikel7b
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.9
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0029244
        artikel: 7b
        hoofdstuk: VIIb
      - id: ref3
        bwb_id: BWBR0029244
        artikel: 7b
        hoofdstuk: VIIb
  - number: 7b.9.d
    text: |-
      vervalt de bevoegdheid tot naheffing, in afwijking van [artikel 8.12, vierde lid][ref1], en
      [artikel 7b.2, eerste en tweede lid][ref2], op 1 augustus 2031.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel7b
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.9
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0029244
        artikel: 7b
        hoofdstuk: VIIb
  - number: 7b.9.e
    text: |-
      vervalt de inlichtingenverplichting, bedoeld in [artikel 7b.4, eerste lid][ref1], in afwijking van artikel 7b.4,
      derde en vierde lid, op 1 augustus 2031.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel7b
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.9
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: 7b
        hoofdstuk: VIIb
  - number: 7b.9.f
    text: |-
      vervalt, in afwijking van [artikel 8.23, eerste lid][ref1], en [artikel 7b.5, derde en vierde lid][ref2], de
      bevoegdheid tot het opleggen van een bestuurlijke boete op grond van die artikelen op 1 augustus 2031.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel7b
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.9
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0029244
        artikel: 7b
        hoofdstuk: VIIb
  - number: 7b.9.g
    text: |-
      vervalt de bevoegdheid tot het opleggen van een vergrijpboete, bedoeld in [artikel 7b.6, eerste lid][ref1], in
      afwijking van artikel 7b.6, derde en vierde lid, op 1 augustus 2031.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel7b
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.9
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: 7b
        hoofdstuk: VIIb
  - number: 8.1.1
    text: |-
      De bevoegdheid van een directeur, inspecteur of ontvanger is niet bepaald naar de geografische indeling van het
      Rijk.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.1
  - number: 8.1.2
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de hoofdlijnen van de inrichting van de
      rijksbelastingdienst en omtrent de functionaris, bedoeld in het eerste lid, onder wie de belastingplichtige en de
      belastingschuldige ressorteren.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.1
  - number: 8.2.1
    text: |-
      De vaststelling van een belastingaanslag geschiedt door het ter zake daarvan opmaken van een aanslagbiljet door de
      inspecteur. De dagtekening van het aanslagbiljet geldt als dagtekening van de vaststelling van de belastingaanslag.
      De inspecteur stelt het aanslagbiljet ter invordering van de daaruit blijkende belastingaanslag aan de ontvanger
      ter hand.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.2
  - number: 8.2.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing met betrekking tot het door de inspecteur nemen van een
      beschikking of het doen van uitspraak strekkende tot – al dan niet nadere – vaststelling van een ingevolge de
      belastingwet verschuldigd of terug te geven bedrag.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.2
  - number: 8.2.3
    text: |-
      De inspecteur vermeldt op het aanslagbiljet of in de kennisgeving van de beschikking of uitspraak in ieder geval de
      termijn of de termijnen waarbinnen het verschuldigde of terug te geven bedrag moet worden betaald.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.2
  - number: 8.3.1
    text: |-
      Met betrekking tot de BES belastingen kan de inspecteur degene die naar zijn mening vermoedelijk belastingplichtig
      of inhoudingsplichtig is uitnodigen tot het doen van aangifte. Worden door deze wet aangelegenheden van een derde
      aangemerkt als aangelegenheden van degene die vermoedelijk belastingplichtig of inhoudingsplichtig is, dan kan de
      inspecteur ook die derde uitnodigen tot het doen van aangifte.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.3
  - number: 8.3.2
    text: |-
      Degene die een daartoe strekkend verzoek bij de inspecteur indient, wordt in elk geval uitgenodigd tot het doen
      van aangifte.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.3
  - number: 8.3.3
    text: |-
      In de uitnodiging tot het doen van aangifte wordt opgave verlangd van gegevens en kan overlegging of toezending
      worden gevraagd van bescheiden en andere gegevensdragers of de inhoud daarvan, waarvan de kennisneming voor de
      heffing van de belasting van belang kan zijn.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.3
  - number: 8.3.4
    text: |-
      Ieder die is uitgenodigd tot het doen van aangifte, is gehouden aangifte te doen door de in de uitnodiging
      gevraagde gegevens duidelijk, stellig en zonder voorbehoud in te vullen, te ondertekenen en in te leveren of toe
      te zenden.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.3
  - number: 8.3.5
    text: 'Bij ministeriële regeling kan worden bepaald:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.3
  - number: 8.3.5.a
    text: |-
      voor welke belastingen of groepen van belastingplichtigen of inhoudingsplichtigen het doen van aangifte uitsluitend
      langs elektronische weg kan geschieden; en
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.3
  - number: 8.3.5.b
    text: |-
      onder welke voorwaarden hiervan door de inspecteur bij voor bezwaar vatbare beschikking ontheffing kan worden
      verleend.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.3
  - number: 8.4.1
    text: |-
      Met betrekking tot belastingen welke bij wege van aanslag worden geheven, moet het aangiftebiljet binnen een door
      de inspecteur gestelde termijn van ten minste twee maanden na uitreiking van het biljet bij de inspecteur worden
      ingeleverd.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.4
  - number: 8.4.2
    text: |-
      De inspecteur maant, na verloop van de in het eerste lid bedoelde termijn, de belastingplichtige aan binnen een
      door hem te stellen termijn van ten minste vijf werkdagen aangifte te doen, tenzij uitstel voor het doen van
      aangifte overeenkomstig [artikel 8.6][ref1] is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '1'
  - number: 8.4.3
    text: Bij de inlevering van het aangiftebiljet wordt op verzoek een ontvangstbewijs afgegeven.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.4
  - number: 8.4.4
    text: |-
      De belastingplichtige aan wie niet binnen zes maanden na het ontstaan van de belastingschuld een aangiftebiljet
      is uitgereikt, is gehouden binnen vijftien dagen na afloop van deze termijn de inspecteur te verzoeken een
      aangiftebiljet uit te reiken.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.4
  - number: 8.4.5
    text: |-
      Het vierde lid is niet van toepassing indien redelijkerwijs kan worden aangenomen dat over dat tijdvak, na
      verrekening van voorheffingen, geen belasting verschuldigd is of geen aanslag zal worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.4
  - number: 8.5.1
    text: |-
      Met betrekking tot belasting welke op aangifte moet worden voldaan of afgedragen, moet de aangifte worden gedaan
      bij de inspecteur.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.5
  - number: 8.5.2
    text: |-
      Heeft de aangifte betrekking op een tijdvak, dan wordt zij gedaan binnen een termijn van vijftien dagen na het
      einde van dat tijdvak. Heeft de aangifte betrekking op een tijdstip, dan wordt zij gedaan binnen een termijn van
      vijftien dagen na het tijdstip waarop de belastingschuld is ontstaan.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.5
  - number: 8.5.3
    text: |-
      De belastingplichtige dan wel inhoudingsplichtige aan wie niet reeds een aangiftebiljet is uitgereikt, is gehouden
      vóór het tijdstip waarop de belasting moet worden betaald de inspecteur te verzoeken een aangiftebiljet uit te
      reiken.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.5
  - number: 8.5.4
    text: De directeur kan bepalen onder welke voorwaarden het aangiftebiljet bij de ontvanger kan worden ingediend.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.5
  - number: 8.6.1
    text: |-
      De inspecteur kan onder door hem te stellen voorwaarden uitstel verlenen voor het indienen van het aangiftebiljet.
      Uitstel wordt niet langer verleend dan tot achttien maanden na de datum waarop de belastingschuld is ontstaan.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.6
  - number: 8.6.2
    text: |-
      In afwijking van hetgeen in deze wet is bepaald, is de belastingplichtige die voornemens is de BES eilanden
      metterwoon te verlaten dan wel voornemens is zijn plaats van vestiging over te brengen naar een niet op de
      BES eilanden gelegen plaats, verplicht terstond aangifte te doen voor de inkomstenbelasting, bedoeld in de
      [Wet inkomstenbelasting BES][ref1], de opbrengstbelasting en de algemene bestedingsbelasting tot het einde van
      de belastingplicht.


      [ref1]: https://wetten.overheid.nl/BWBR0029281
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.6
    references:
      - id: ref1
        bwb_id: BWBR0029281
  - number: 8.6a.1
    text: |-
      In bij algemene maatregel van bestuur aan te wijzen gevallen kunnen belastingplichtigen of inhoudingsplichtigen
      worden gehouden de inspecteur eigener beweging mededeling te doen van onjuistheden of onvolledigheden in voor de
      belastingheffing van belang zijnde gegevens en inlichtingen die hun bekend zijn of zijn geworden.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.6a
  - number: 8.6a.2
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het uiterste tijdstip en de
      wijze waarop de mededeling gedaan moet worden.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.6a
  - number: 8.6a.3
    text: |-
      Bij algemene maatregel van bestuur kan het niet nakomen van de verplichting worden aangemerkt als een overtreding.
      Indien het niet nakomen van de verplichting is te wijten aan opzet of grove schuld van de belastingplichtige,
      onderscheidenlijk de inhoudingsplichtige, vormt dit een vergrijp ter zake waarvan de inspecteur hem een
      bestuurlijke boete kan opleggen van ten hoogste 100 percent van het bedrag aan belasting dat als gevolg van het
      niet nakomen van de verplichting niet is of zou zijn geheven.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.6a
  - number: 8.7.1
    text: De aanslag wordt vastgesteld door de inspecteur.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.7
  - number: 8.7.2
    text: |-
      De inspecteur kan bij het vaststellen van de aanslag van de aangifte gemotiveerd afwijken, alsmede bij het
      ontbreken van de aangifte de aanslag ambtshalve vaststellen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.7
  - number: 8.7.3
    text: |-
      De bevoegdheid tot het vaststellen van de aanslag vervalt door verloop van drie jaar na het tijdstip waarop de
      belastingschuld is ontstaan. Indien voor het doen van aangifte uitstel is verleend, wordt deze termijn met de
      duur van dit uitstel verlengd. Indien binnen zes maanden voor het einde van de termijn een verzoek als bedoeld in
      [artikel 8.3, tweede lid][ref1], wordt gedaan, of gegevens worden verstrekt zonder een aan die verstrekking van
      gegevens voorafgaande uitnodiging tot het doen van aangifte en die gegevens ook en op dezelfde wijze zouden moeten
      worden verstrekt in geval van een aan die verstrekking van gegevens voorafgaande uitnodiging tot het doen van
      aangifte, wordt die termijn met zes maanden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.7
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '1'
  - number: 8.7.4
    text: |-
      Een belastingschuld waarvan de grootte eerst kan worden vastgesteld na afloop van het tijdvak waarover de belasting
      wordt geheven, wordt geacht te zijn ontstaan op het tijdstip waarop dat tijdvak of de belastingplicht eindigt.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.7
  - number: 8.8.1
    text: |-
      De inspecteur kan, ingeval de grootte van de belastingschuld eerst kan worden vastgesteld na afloop van het tijdvak
      waarover de belasting wordt geheven, na aanvang van het belastingtijdvak aan de belastingplichtige een voorlopige
      aanslag opleggen tot het bedrag waarop de aanslag vermoedelijk zal worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.8
  - number: 8.8.2
    text: |-
      De voorlopige aanslag blijft beperkt tot het bedrag waarmee de aanslag vermoedelijk de voorheffingen te boven zal
      gaan.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.8
  - number: 8.8.3
    text: Een voorlopige aanslag kan worden gevolgd door één of meer voorlopige aanslagen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.8
  - number: 8.8.4
    text: De voorlopige aanslag en de voorheffingen worden verrekend met de aanslag.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.8
  - number: 8.8.5
    text: |-
      Een voorlopige aanslag kan de inspecteur ook opleggen aan niet op de BES eilanden wonende of gevestigde
      belastingplichtigen, die slechts tijdelijk op de BES eilanden een bedrijf of beroep uitoefenen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.8
  - number: 8.8.6
    text: |-
      Een voorlopige aanslag kan direct na het ontstaan van de belastingschuld of, bij tijdvak- belastingen, direct na
      aanvang van het tijdvak, altijd worden opgelegd tot het bedrag dat de inspecteur juist voorkomt indien:
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.8
  - number: 8.8.6.a
    text: |-
      de belastingplichtige in staat van faillissement is verklaard of, indien sprake is van een lichaam, in geval van
      ontbinding, beëindiging of vereffening ervan;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.8
  - number: 8.8.6.b
    text: |-
      de belastingplichtige de BES eilanden metterwoon wil verlaten dan wel zijn plaats van vestiging wil overbrengen
      naar een plaats niet op de BES eilanden;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.8
  - number: 8.8.6.c
    text: |-
      het bedrijf van de belastingplichtige wordt gestaakt of aanmerkelijk wordt ingekrompen, of de belastingplichtige op
      de BES eilanden gelegen onroerende goederen of daarop gevestigde rechten vervreemdt.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.8
  - number: 8.8.7
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van het eerste lid nadere regels worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.8
  - number: '8.9'
    text: |-
      De inspecteur neemt het besluit om aan hem die aangifte heeft gedaan, geen aanslag op te leggen, bij voor bezwaar
      vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.9
  - number: 8.10.1
    text: |-
      Indien enig feit grond oplevert voor het vermoeden dat een aanslag ten onrechte achterwege is gelaten of tot een
      te laag bedrag is vastgesteld, dan wel dat een in de belastingwet voorziene vermindering, ontheffing of teruggaaf
      ten onrechte of tot een te hoog bedrag is verleend, kan de inspecteur de te weinig geheven belasting navorderen.
      Een feit, dat de inspecteur bekend was of redelijkerwijs bekend had kunnen zijn, kan geen grond voor navordering
      opleveren, behoudens in de gevallen waarin de belastingplichtige ter zake van dit feit te kwader trouw is.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.10
  - number: 8.10.2
    text: 'Navordering kan mede plaatsvinden in alle gevallen waarin te weinig belasting is geheven, doordat:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.10
  - number: 8.10.2.a
    text: |-
      een voorlopige aanslag, een voorheffing, of een voorlopige teruggaaf ten onrechte of tot een onjuist bedrag is
      verrekend;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.10
  - number: 8.10.2.b
    text: |-
      een bij de belastingplichtige in aanmerking te nemen bestanddeel van het voorwerp van enige belasting ten onrechte
      in aanmerking is genomen bij hem of bij zijn echtgenoot;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.10
  - number: 8.10.2.c
    text: |-
      de belastingvrije som, bedoeld in [artikel 24, tweede lid, van de Wet inkomstenbelasting BES][ref1] ten onrechte of
      tot een te hoog bedrag is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel24
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.10
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '24'
  - number: 8.10.3
    text: |-
      De bevoegdheid tot het vaststellen van een navorderingsaanslag vervalt door verloop van vijf jaren na het tijdstip
      waarop de belastingschuld is ontstaan. [Artikel 8.7, vierde lid][ref1], is hierbij van toepassing. Indien voor het
      doen van aangifte uitstel is verleend, wordt de navorderingstermijn met de duur van dit uitstel verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.10
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '2'
  - number: 8.10.4
    text: |-
      Indien te weinig belasting is geheven over het bestanddeel van het voorwerp van enige belasting dat in het
      buitenland wordt gehouden of is opgekomen, vervalt, in afwijking van het derde lid, de bevoegdheid tot navorderen
      door verloop van twaalf jaren na het tijdstip waarop de belastingschuld is ontstaan.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.10
  - number: 8.10.5
    text: |-
      Indien binnen zes maanden voor het einde van de termijn, bedoeld in het derde lid, eerste zin, of van de
      termijn, bedoeld in het vierde lid, gegevens worden verstrekt zonder een aan die verstrekking van gegevens
      voorafgaande uitnodiging tot het doen van aangifte en die gegevens ook en op dezelfde wijze zouden moeten
      worden verstrekt in geval van een aan die verstrekking van gegevens voorafgaande uitnodiging tot het doen van
      aangifte, wordt die verstrekking van gegevens aangemerkt als het op uitnodiging doen van aangifte, bedoeld in
      [artikel 8.3, eerste lid][ref1], en wordt de termijn met zes maanden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.10
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '1'
  - number: 8.11.1
    text: |-
      In geval de belastingwet voldoening van in een tijdvak verschuldigde belasting dan wel afdracht van in een tijdvak
      ingehouden belasting voorschrijft, is de belastingplichtige dan wel de inhoudingsplichtige gehouden binnen vijftien
      dagen na afloop van dat tijdvak de belasting overeenkomstig de aangifte te betalen bij de ontvanger.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.11
  - number: 8.11.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot het tijdvak waarover de belasting moet
      worden betaald, waarbij tevens regels kunnen worden gesteld volgens welke in de loop van dat tijdvak één of meer
      voorlopige betalingen moeten worden gedaan.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.11
  - number: 8.11.3
    text: |-
      In geval over een belastingtijdvak geen belasting is verschuldigd, moet aangifte worden gedaan bij de inspecteur
      binnen vijftien dagen na het einde van dat tijdvak.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.11
  - number: 8.11.4
    text: |-
      In de niet in het eerste lid bedoelde gevallen moet de belasting overeenkomstig de aangifte worden betaald binnen
      vijftien dagen na het tijdstip waarop de belastingschuld is ontstaan.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.11
  - number: 8.11.5
    text: |-
      Indien voor het doen van aangifte uitstel is verleend, wordt de in het eerste en in het vierde lid genoemde termijn
      van vijftien dagen met de duur van dit uitstel verlengd.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.11
  - number: 8.12.1
    text: |-
      De inspecteur kan, indien de belasting die op aangifte behoort te worden voldaan of afgedragen niet of niet
      volledig is betaald, de niet of te weinig betaalde belasting naheffen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.12
  - number: 8.12.2
    text: |-
      Met niet of niet volledig betaald zijn als bedoeld in het eerste lid wordt gelijkgesteld het geval waarin, naar
      aanleiding van een gedaan verzoek, ten onrechte of tot een te hoog bedrag, vrijstelling of vermindering van
      inhouding van belasting dan wel teruggaaf van belasting is verleend.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.12
  - number: 8.12.3
    text: |-
      De naheffing geschiedt bij wege van naheffingsaanslag, die wordt opgelegd aan degene die de belasting had behoren
      te betalen, dan wel aan wie ten onrechte, of tot een te hoog bedrag, vrijstelling of vermindering van inhouding dan
      wel teruggaaf is verleend. In gevallen waarin ten gevolge van het niet naleven van bepalingen van de belastingwet
      door een ander dan de belastingplichtige, onderscheidenlijk de inhoudingsplichtige, te weinig belasting is geheven,
      wordt de naheffingsaanslag aan die ander opgelegd.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.12
  - number: 8.12.4
    text: |-
      De bevoegdheid tot naheffing vervalt door verloop van vijf jaar na het einde van het kalenderjaar waarin de
      belastingschuld is ontstaan of de teruggaaf is verleend.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.12
  - number: 8.13.1
    text: |-
      Vertegenwoordiging is mogelijk op grond van schriftelijke volmacht. Op vordering van de inspecteur dient het stuk
      waaruit van de volmacht blijkt, te worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.13
  - number: 8.13.2
    text: |-
      Degene die is opgeroepen om mondeling aan de inspecteur inlichtingen en gegevens te verstrekken, en zich doet
      vertegenwoordigen, is gehouden op vordering van de inspecteur zijn vertegenwoordiger te vergezellen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.13
  - number: 8.13.3
    text: De inspecteur kan de vertegenwoordiging door een bepaalde persoon gemotiveerd weigeren.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.13
  - number: 8.14.1
    text: |-
      De bevoegdheden en de verplichtingen van een minderjarige, een onder curatele gestelde of iemand die in staat van
      faillissement is verklaard, of wiens vermogen onder bewind is gesteld, kunnen worden uitgeoefend en nagekomen door
      hun wettelijke vertegenwoordiger, curator of bewindvoerder. Desgevorderd zijn laatstgenoemden tot nakoming van die
      verplichtingen gehouden.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.14
  - number: 8.14.2
    text: |-
      De bevoegdheden van een lichaam kunnen worden uitgeoefend en zijn verplichtingen kunnen worden nagekomen door
      iedere bestuurder. Desgevorderd is ieder van hen tot nakoming van die verplichtingen gehouden.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.14
  - number: 8.14.3
    text: |-
      Indien iemand is overleden, kunnen de erfgenamen in het uitoefenen van de bevoegdheden en het nakomen van de
      verplichtingen welke de overledene zou hebben gehad, als hij in leven was gebleven, worden vertegenwoordigd door
      één hunner, de executeurtestamentair, de bewindvoerder of de curator over de nalatenschap. Desgevorderd is ieder
      van de genoemde personen tot nakoming van die verplichtingen gehouden.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.14
  - number: 8.14.4
    text: |-
      Stukken betreffende belastingaangelegenheden van een overledene kunnen worden gericht aan een van de in het derde
      lid genoemde personen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.14
  - number: 8.14.5
    text: |-
      Ieder, die op de BES eilanden in dienst is van – of werkzaam is ten behoeve van – vennootschappen, verenigingen,
      maatschappijen, stichtingen of lichamen, als bedoeld in [artikel 1.3, onderdeel c][ref1], of een ieder die bij
      ontbinding of vereffening, met de vereffening is belast, kan, na in de gelegenheid te zijn gesteld om van zijn
      bezwaren te doen blijken, door de inspecteur worden aangewezen als hun vertegenwoordiger.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel1
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.14
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '1'
        hoofdstuk: I
  - number: '8.15'
    text: |-
      De inspecteur kan vertegenwoordiging uitsluiten in de nakoming van een verplichting van degene die zelf tot
      nakoming in staat is.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.15
  - number: '8.16'
    text: De bepalingen van deze afdeling gelden niet met betrekking tot strafvordering.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.16
  - number: '8.17'
    text: |-
      In bezwaar- en beroepschriften is degene die niet op de BES eilanden een vaste woonplaats of plaats van vestiging
      heeft, verplicht domicilie kiezen op de BES eilanden.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.17
  - number: '8.18'
    text: |-
      Ingeval ingevolge de belastingwet een aangiftebiljet of ander stuk moet worden uitgereikt aan degene die niet op de
      BES eilanden een vaste woonplaats of plaats van vestiging heeft, kan die uitreiking ook geschieden:
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.18
  - number: 8.18.a
    text: |-
      middels bezorging of afgifte bij de op de BES eilanden gelegen vaste inrichting voor de uitoefening van zijn
      bedrijf of beroep;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.18
  - number: 8.18.b
    text: aan de woning of het kantoor van zijn op de BES eilanden wonende of gevestigde vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.18
  - number: '8.19'
    text: 'Onze Minister is bevoegd:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.19
  - number: 8.19.a
    text: bij ministeriële regeling nadere regels te geven ter uitvoering van de belastingwet;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.19
  - number: 8.19.b
    text: |-
      voor bepaalde gevallen of groepen van gevallen tegemoet te komen aan onbillijkheden van overwegende aard, welke
      zich bij de toepassing van de belastingwet mochten voordoen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.19
  - number: 8.20.1
    text: |-
      Een onjuiste belastingaanslag of beschikking kan door de inspecteur ambtshalve worden verminderd. Een in de
      belastingwet voorziene vermindering, ontheffing of teruggaaf kan door hem ambtshalve worden verleend.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.20
  - number: 8.20.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van degene die een onjuist bedrag op aangifte heeft
      voldaan of afgedragen, of van wie een onjuist bedrag is ingehouden.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.20
  - number: 8.20.3
    text: |-
      De termijn waarbinnen de belanghebbende aanspraak kan maken op het ambtshalve verlenen van vermindering van een
      onjuiste belastingaangifte of beschikking of op het ambtshalve verlenen van een in de belastingwet voorziene
      vermindering, ontheffing of teruggaaf vervalt:
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.20
  - number: 8.20.3.a
    text: |-
      voor aanslagbelastingen: door verloop van vijf jaar na het einde van het kalenderjaar waarop de belastingaanslag,
      onderscheidenlijk de vermindering, de ontheffing of de teruggaaf, betrekking heeft, waarbij voor afwijkende
      tijdvakken deze termijn gaat lopen na afloop van het boekjaar of belastingtijdvak, terwijl voor tijdstipbelastingen
      de termijn gaat lopen na het tijdstip waarop de belastingschuld is ontstaan;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.20
  - number: 8.20.3.b
    text: |-
      voor aangiftebelastingen: door verloop van vijf jaar na het einde van het belastingjaar waarin de belastingschuld
      is ontstaan of waarop de vermindering, de ontheffing of de teruggaaf betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.20
  - number: 8.20.4
    text: |-
      Tenzij is gebleken in hoeverre de belastingaanslag of de beschikking onjuist is, verleend de inspecteur geen
      vermindering, ontheffing of teruggaaf als een verzoek om vermindering of teruggaaf betrekking heeft op een
      belastingaanslag, onderscheidenlijk een beschikking, waarvoor:
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.20
  - number: 8.20.4.a
    text: de vereiste aangifte niet is gedaan; of
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.20
  - number: 8.20.4.b
    text: |-
      niet volledig is voldaan aan de verplichtingen ingevolge de [artikelen 8.13, tweede lid][ref1], [8.83][ref2],
      [8.84][ref3], [8.86][ref4], [8.87][ref5] en [8.87a][ref6] voor zover het verplichtingen van administratieplichtigen
      betreft ten behoeve van de heffing van de belasting waarvan de inhouding aan hen is opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.20
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
      - id: ref3
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
      - id: ref4
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
      - id: ref5
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
      - id: ref6
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
  - number: 8.21.1
    text: |-
      Het is een ieder verboden hetgeen hem uit of in verband met enige werkzaamheid bij de uitvoering van de
      belastingwet over de persoon of zaken van een ander blijkt of wordt meegedeeld, verder bekend te maken dan
      noodzakelijk is voor de uitvoering van de belastingwet of voor de invordering van enige BES belasting.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.21
  - number: 8.21.2
    text: 'De geheimhoudingsplicht geldt niet indien:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.21
  - number: 8.21.2.a
    text: enig wettelijk voorschrift tot bekendmaking verplicht;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.21
  - number: 8.21.2.b
    text: |-
      bij regeling van Onze Minister is bepaald dat bekendmaking noodzakelijk is voor de goede vervulling van een
      publiekrechtelijke taak van een bestuursorgaan;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.21
  - number: 8.21.2.c
    text: |-
      bekendmaking plaatsvindt aan degene op wie de gegevens betrekking hebben voor zover deze gegevens door of namens
      hem zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.21
  - number: 8.21.3
    text: Onze Minister kan ontheffing verlenen van het in het eerste lid vervatte verbod.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.21
  - number: 8.22.1
    text: |-
      Indien de belastingplichtige de aangifte voor een belasting welke bij wege van aanslag wordt geheven niet, dan wel
      niet binnen de ingevolge [artikel 8.4, tweede lid][ref1], gestelde termijn heeft gedaan, vormt dit een verzuim ter
      zake waarvan de inspecteur hem, gelijktijdig met de vaststelling van de aanslag een boete van ten hoogste USD 1 400
      kan opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.22
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '1'
  - number: 8.22.2
    text: |-
      Indien de belastingplichtige of de inhoudingsplichtige de aangifte voor een belasting welke op aangifte moet worden
      voldaan of afgedragen niet, dan wel niet binnen de ingevolge [artikel 8.5, tweede lid][ref1], gestelde termijn
      heeft gedaan, vormt dit een verzuim ter zake waarvan de inspecteur hem een boete van ten hoogste USD 1 400 kan
      opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.22
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '1'
  - number: 8.22.3
    text: |-
      De bevoegdheid tot het opleggen van een boete wegens het niet dan wel niet tijdig doen van de aangifte vervalt door
      het verloop van een jaar na het einde van de termijn waarbinnen de aangifte had moeten worden gedaan.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.22
  - number: 8.23.1
    text: |-
      Indien de belastingplichtige of inhoudingsplichtige de belasting die op aangifte moet worden voldaan of afgedragen
      niet, gedeeltelijk niet, dan wel niet binnen de ingevolge [artikel 8.11, eerste lid][ref1], gestelde termijn heeft
      betaald, vormt dit een verzuim ter zake waarvan de inspecteur hem een boete van ten hoogste USD 5 600 kan opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.23
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '3'
  - number: 8.23.2
    text: |-
      Bij niet of gedeeltelijk niet betalen legt de inspecteur de boete op, gelijktijdig met de vaststelling van de
      naheffingsaanslag.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.23
  - number: 8.23.3
    text: |-
      De bevoegdheid tot het opleggen van de in het eerste lid bedoelde boete vervalt door verloop van vijf jaar na het
      einde van het kalenderjaar waarin de belastingschuld is ontstaan.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.23
  - number: 8.23.4
    text: |-
      [Artikel 8.12, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.23
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '3'
  - number: 8.24.1
    text: |-
      Indien de administratieplichtige niet, niet tijdig of niet volledig de opgave, bedoeld in
      [artikel 8.87, tweede en derde lid][ref1], verstrekt, vormt dit een verzuim ter zake waarvan de inspecteur hem een
      boete van ten hoogste USD 2 800 kan opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.24
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
  - number: 8.24.2
    text: |-
      De bevoegdheid tot het opleggen van een boete als bedoeld in het eerste lid vervalt door verloop van een jaar na
      het einde van de termijn waarbinnen de opgave, bedoeld in [artikel 8.87, tweede en derde lid][ref1], had moeten
      worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.24
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
  - number: 8.24a.1
    text: |-
      Indien een lichaam dat op grond van [artikel 8.87a][ref1] gehouden is een jaarrekening in te dienen de
      jaarrekening niet of niet tijdig indient, vormt dit een verzuim ter zake waarvan de inspecteur hem een boete van
      ten hoogste USD 14 000 kan opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.24a
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
  - number: 8.24a.2
    text: |-
      De bevoegdheid tot het opleggen van een boete als bedoeld in het eerste lid vervalt door verloop van een jaar na
      het einde van de termijn waarbinnen de jaarrekening, bedoeld in [artikel 8.87a, eerste lid][ref1], had moeten
      worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.24a
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
  - number: 8.24b.1
    text: |-
      Indien het aan opzet of grove schuld van de belastingplichtige is te wijten dat met betrekking tot een belasting
      welke bij wege van aanslag wordt geheven, de aangifte niet, dan wel onjuist of onvolledig is gedaan, vormt dit
      een vergrijp ter zake waarvan de inspecteur hem, gelijktijdig met de vaststelling van de aanslag, een bestuurlijke
      boete kan opleggen van ten hoogste 100 percent van de in het tweede lid omschreven grondslag voor die bestuurlijke
      boete.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.24b
  - number: 8.24b.2
    text: |-
      De grondslag voor de bestuurlijke boete wordt, voor zover een bedrag als gevolg van de opzet of grove schuld van de
      belastingplichtige niet is of zou zijn geheven, gevormd door:
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.24b
  - number: 8.24b.2.a
    text: het bedrag van de aanslag; of
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.24b
  - number: 8.24b.2.b
    text: |-
      indien verliezen ten onrechte in aanmerking zijn of worden genomen: het bedrag waarop de aanslag zou zijn berekend
      zonder rekening te houden met die verliezen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.24b
  - number: 8.24b.3
    text: |-
      Indien verliezen in aanmerking zijn of worden genomen en als gevolg daarvan geen aanslag kan worden vastgesteld,
      kan de inspecteur de bestuurlijke boete niettemin opleggen. De bevoegdheid tot het opleggen van de bestuurlijke
      boete vervalt door verloop van vijf jaren na het einde van het kalenderjaar waarin de belastingschuld zou zijn
      ontstaan indien geen verliezen in aanmerking zouden zijn genomen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.24b
  - number: 8.25.1
    text: |-
      Indien het met betrekking tot een belasting welke bij wege van aanslag wordt geheven aan opzet of grove schuld van
      de belastingplichtige is te wijten dat de aanslag te laag is vastgesteld dan wel anderszins te weinig belasting
      is geheven, vormt dit een vergrijp ter zake waarvan de inspecteur hem, gelijktijdig met de vaststelling van de
      navorderingsaanslag, een boete kan opleggen van ten hoogste 100% van de in het tweede lid omschreven grondslag voor
      de boete.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.25
  - number: 8.25.2
    text: 'De grondslag voor de boete is:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.25
  - number: 8.25.2.a
    text: het bedrag van de navorderingsaanslag, dan wel
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.25
  - number: 8.25.2.b
    text: |-
      indien verliezen in aanmerking zijn of worden genomen, het bedrag waarop de navorderingsaanslag zou zijn berekend
      zonder rekening te houden met die verliezen;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.25
  - number: 8.25.3
    text: |-
      De inspecteur kan, in afwijking van het eerste lid, binnen zes maanden na de vaststelling van de
      navorderingsaanslag een boete opleggen indien de feiten of omstandigheden op grond waarvan wordt nagevorderd eerst
      bekend worden binnen zes maanden vóór de afloop van de in [artikel 8.10, derde en vierde lid][ref1], bedoelde
      termijn en er tevens aanwijzingen zijn dat het aan opzet of grove schuld van de belastingplichtige is te wijten
      dat de aanslag tot een te laag bedrag is vastgesteld dan wel anderszins te weinig belasting is geheven. In dat
      geval doet de inspecteur vóór of gelijktijdig met de vaststelling van de navorderingsaanslag mededeling aan
      de belastingplichtige dat wordt onderzocht of in verband met de navordering het opleggen van een vergrijpboete
      gerechtvaardigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.25
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '2'
  - number: 8.25.4
    text: |-
      Indien verliezen in aanmerking zijn of worden genomen en als gevolg daarvan geen navorderingsaanslag kan
      worden vastgesteld, kan de inspecteur de boete, bedoeld in het eerste lid, niettemin opleggen. De bevoegdheid
      tot het opleggen van de boete vervalt door het verloop van de termijn die geldt voor het vaststellen van de
      navorderingsaanslag, die zou kunnen zijn vastgesteld indien geen verliezen in aanmerking zouden zijn genomen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.25
  - number: 8.26.1
    text: |-
      Indien het aan opzet of grove schuld van de belastingplichtige of de inhoudingsplichtige is te wijten dat
      belasting welke op aangifte moet worden voldaan of afgedragen niet, gedeeltelijk niet, dan wel niet binnen de in de
      belastingwet gestelde termijn is betaald, vormt dit een vergrijp ter zake waarvan de inspecteur hem een boete kan
      opleggen van ten hoogste 100% van de in het tweede lid omschreven grondslag voor de boete.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.26
  - number: 8.26.2
    text: |-
      De grondslag voor de boete wordt gevormd door het bedrag van de belasting dat niet of niet tijdig is betaald, voor
      zover dat bedrag als gevolg van de opzet of de grove schuld van de belastingplichtige of de inhoudingsplichtige
      niet of niet tijdig is betaald.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.26
  - number: 8.26.3
    text: |-
      Bij niet of gedeeltelijk niet betalen legt de inspecteur de boete op, gelijktijdig met de vaststelling van de
      naheffingsaanslag.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.26
  - number: 8.26.4
    text: |-
      De bevoegdheid tot het opleggen van de boete wegens niet tijdig betalen, vervalt door verloop van vijf jaren na het
      einde van het kalenderjaar waarin de belastingschuld is ontstaan.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.26
  - number: 8.26.5
    text: |-
      [Artikel 8.25, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.26
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '1'
  - number: 8.26.6
    text: |-
      [Artikel 8.12, tweede lid, en derde lid][ref1], tweede volzin, zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.26
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '3'
  - number: 8.27.1
    text: |-
      Alvorens een vergrijpboete op te leggen, stelt de inspecteur de belastingplichtige of inhoudingsplichtige in kennis
      van zijn voornemen daartoe, onder vermelding van de gronden waarop het voornemen berust.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.27
  - number: 8.27.2
    text: |-
      De inspecteur stelt de belastingplichtige of inhoudingsplichtige in de gelegenheid binnen een door hem daarvoor te
      stellen termijn van ten minste twee weken de in die kennisgeving vermelde gronden gemotiveerd te betwisten.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.27
  - number: 8.27.3
    text: |-
      Indien niet is voldaan aan het bepaalde in het eerste of tweede lid, heeft dat niet de nietigheid van de boete
      tot gevolg.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.27
  - number: 8.27a.1
    text: |-
      Indien nieuwe bezwaren bekend zijn geworden kan de inspecteur een vergrijpboete opleggen wegens hetzelfde feit
      als waarvoor eerder een verzuimboete is opgelegd. Als nieuwe bezwaren als bedoeld in de eerste volzin kunnen enkel
      worden aangemerkt verklaringen van de belastingplichtige of inhoudingsplichtige of van derden en boeken, bescheiden
      en andere gegevensdragers of de inhoud daarvan, die later bekend zijn geworden of niet zijn onderzocht.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.27a
  - number: 8.27a.2
    text: |-
      Bij het opleggen van een vergrijpboete als bedoeld in het eerste lid vermeldt de inspecteur waaruit de nieuwe
      bezwaren bestaan.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.27a
  - number: 8.27a.3
    text: De eerder opgelegde verzuimboete wordt verrekend met de wegens hetzelfde feit opgelegde vergrijpboete.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.27a
  - number: 8.27a.4
    text: |-
      Bij toepassing van dit artikel vervalt de voorwaarde van gelijktijdigheid als bedoeld in
      [artikel 8.25, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.27a
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '1'
  - number: 8.28.1
    text: De inspecteur legt de boete op bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.28
  - number: 8.28.2
    text: |-
      Onverminderd het bepaalde in [artikel 8.27, eerste en tweede lid][ref1], stelt de inspecteur de belastingplichtige
      of inhoudingsplichtige, uiterlijk bij de in het eerste lid bedoelde beschikking, in kennis van de gronden waarop de
      oplegging van de boete berust.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.28
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '2'
  - number: 8.28.3
    text: |-
      Op verzoek van de belastingplichtige of inhoudingsplichtige die de kennisgeving wegens zijn gebrekkige kennis
      van de Nederlandse taal onvoldoende begrijpt, draagt de inspecteur er zoveel mogelijk zorg voor dat de in die
      kennisgeving vermelde gronden aan de belastingplichtige of inhoudingsplichtige worden medegedeeld in een voor hem
      begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.28
  - number: 8.28.4
    text: |-
      Indien de boete gelijktijdig wordt opgelegd met de vaststelling van een belastingaanslag, wordt het bedrag van de
      boete afzonderlijk op het aanslagbiljet vermeld.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.28
  - number: 8.28.5
    text: |-
      De boete wordt ingevorderd overeenkomstig de bepalingen die gelden voor de invordering van de belasting ter zake
      waarvan de boete is opgelegd.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.28
  - number: '8.29'
    text: |-
      [Titel 7 van dit hoofdstuk][ref1] is van overeenkomstige toepassing bij het opleggen van bestuurlijke boeten,
      met dien verstande dat de belastingplichtige of inhoudingsplichtige tegen wie het onderzoek naar de oplegging van
      een bestuurlijke boete is gericht slechts gehouden is toe te laten dat de inspecteur gegevensdragers of de inhoud
      daarvan raadpleegt dan wel toegang te verlenen tot gebouwen of gronden.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.29
    references:
      - id: ref1
        bwb_id: BWBR0029244
        hoofdstuk: VIII
  - number: '8.30'
    text: |-
      Indien de inspecteur jegens de belastingplichtige of de inhoudingsplichtige een handeling heeft verricht waaraan
      deze in redelijkheid de gevolgtrekking kan verbinden dat aan hem wegens een bepaalde gedraging een boete zal
      worden opgelegd, is, voor zoveel nodig in afwijking van [titel 7][ref1], de belastingplichtige onderscheidenlijk de
      inhoudingsplichtige niet langer verplicht ter zake van die gedraging enige verklaring af te leggen voor zover het
      betreft de boete-oplegging.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.30
    references:
      - id: ref1
        bwb_id: BWBR0029244
        hoofdstuk: VIII
  - number: 8.31.1
    text: |-
      De inspecteur kan de belastingplichtige of inhoudingsplichtige ten aanzien van wie de redelijke verwachting bestaat
      dat hem een vergrijpboete kan worden opgelegd, oproepen voor een verhoor. In deze oproep deelt de inspecteur hem
      mee dat hij zich desgewenst kan doen bijstaan.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.31
  - number: 8.31.2
    text: |-
      Voordat het verhoor aanvangt, deelt de inspecteur de belastingplichtige of inhoudingsplichtige mee dat hij niet tot
      antwoorden verplicht is.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.31
  - number: 8.31.3
    text: |-
      De inspecteur kan op verzoek van de belastingplichtige of inhoudingsplichtige die het Nederlands, Papiaments of
      Engels onvoldoende begrijpt, toestaan dat deze zich tijdens het verhoor door een tolk laat bijstaan.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.31
  - number: '8.32'
    text: |-
      De inspecteur stelt de belastingplichtige of inhoudingsplichtige op diens verzoek in de gelegenheid inzage te nemen
      in, dan wel kopieën, leesbare afdrukken of uittreksels te vervaardigen van de gegevensdragers waarop het voornemen
      tot het opleggen van een bestuurlijke boete berust.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.32
  - number: '8.33'
    text: |-
      Ingeval een belastingplichtige of inhoudingsplichtige alsnog een juiste en volledige aangifte doet dan wel
      juiste en volledige inlichtingen, gegevens of aanwijzingen verstrekt vóórdat hij weet of redelijkerwijs moet
      vermoeden dat de inspecteur de onjuistheid of onvolledigheid bekend is of bekend zal worden, wordt in plaats van
      een vergrijpboete een verzuimboete opgelegd van ten hoogste 15% van de belasting die op grond van de juiste en
      volledige aangifte of juiste en volledige inlichtingen is verschuldigd.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.33
  - number: 8.34.1
    text: |-
      Een opgelegde boete vervalt indien de belastingplichtige of inhoudingsplichtige wegens het vergrijp op grond
      waarvan de boete verschuldigd is, bij onherroepelijke rechterlijke uitspraak is vrijgesproken, ontslagen van
      rechtsvervolging of veroordeeld.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.34
  - number: 8.34.2
    text: |-
      De inspecteur legt een in deze afdeling bedoelde vergrijpboete niet op voor zover het niet aan opzet of grove
      schuld van de belastingplichtige of inhoudingsplichtige is te wijten dat te weinig belasting is geheven.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.34
  - number: 8.34.3
    text: |-
      Ingeval na het opleggen van een vergrijpboete blijkt dat de grondslag daarvoor ontbreekt maar wel een grondslag
      aanwezig is voor een verzuimboete, kan deze lagere boete daarvoor in de plaats worden gesteld. De reeds opgelegde
      boete wordt dan verminderd tot het bedrag van de verzuimboete.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.34
  - number: 8.35.1
    text: Geen boete wordt opgelegd aan de belastingplichtige of inhoudingsplichtige die is overleden.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.35
  - number: 8.35.2
    text: |-
      Indien een boete op het tijdstip van het overlijden van de belastingplichtige of de inhoudingsplichtige niet
      onherroepelijk vaststaat, vernietigt de inspecteur de beschikking waarbij de boete is opgelegd op verzoek van een
      belanghebbende bij beschikking.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.35
  - number: '8.36'
    text: |-
      Indien de grondslag voor een boete wordt gevormd door het bedrag van de belasting, wordt de opgelegde boete naar
      evenredigheid verlaagd bij vermindering, teruggaaf, terugbetaling of kwijtschelding van belasting, voor zover deze
      vermindering, teruggaaf, terugbetaling of kwijtschelding het bedrag betreft waarover de boete is berekend.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.36
  - number: '8.37'
    text: |-
      Deze afdeling is van overeenkomstige toepassing ten aanzien van anderen dan de belastingplichtige of
      inhoudingsplichtige aan wie ingevolge de belastingwet een bestuurlijke boete kan worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.37
  - number: 8.38.1
    text: De ontvanger is belast met de invordering van BES belastingen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.38
  - number: 8.38.2
    text: |-
      Naast de bevoegdheden die de ontvanger heeft ingevolge deze wet beschikt hij ook over de bevoegdheden die een
      schuldeiser heeft op grond van enige andere wettelijke bepaling.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.38
  - number: 8.39.1
    text: De kosten van vervolging zijn ten laste van degene die in gebreke is gebleven het verschuldigde tijdig te betalen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.39
  - number: 8.39.2
    text: Bij algemene maatregel van bestuur kunnen de kosten van vervolging worden bepaald.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.39
  - number: '8.40'
    text: |-
      De toerekening en afschrijving van de betalingen of van de tot verhaal van het verschuldigde ontoereikende
      opbrengst bij uitwinning geschiedt in de volgende orde:
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.40
  - number: 8.40.a
    text: op de kosten van vervolging;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.40
  - number: 8.40.b
    text: op de interest;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.40
  - number: 8.40.c
    text: op de bestuurlijke boeten;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.40
  - number: 8.40.d
    text: op de oudste openstaande aanslagen of termijnen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.40
  - number: '8.41'
    text: |-
      Naast het bepaalde in de [artikelen 8.96][ref1] en [8 102][ref2] wordt de verplichting tot betaling van de BES
      belastingen niet geschorst door:


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.41
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '3'
  - number: 8.41.a
    text: |-
      verkrijging van surseance van betaling voor zover volgens het [Faillissementswet BES][ref1] de surseance ten
      aanzien van de verplichting tot betaling niet werkt;


      [ref1]: https://wetten.overheid.nl/BWBR0028917
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.41
    references:
      - id: ref1
        bwb_id: BWBR0028917
  - number: 8.41.b
    text: door het voorbehouden recht van beraad;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.41
  - number: 8.41.c
    text: door aanvaarding onder voorrecht van boedelbeschrijving.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.41
  - number: 8.41a
    text: |-
      Op het bezwaar en beroep inzake de op grond van deze titel genomen beschikkingen is titel 8 van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.41a
  - number: '8.42'
    text: Een belastingaanslag is door de belastingschuldige in zijn geheel verschuldigd.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.42
  - number: 8.43.1
    text: Een belastingaanslag is invorderbaar twee maanden na de dagtekening van het aanslagbiljet.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.43
  - number: 8.43.2
    text: |-
      In afwijking van het eerste lid is een voorlopige aanslag, gedagtekend vóór 1 november van het belastingjaar
      waarop deze betrekking heeft, invorderbaar in zoveel gelijke termijnen als er na de maand van dagtekening van het
      aanslagbiljet nog maanden in het belastingjaar overblijven. Op de laatste dag van elk van die maanden vervalt een
      termijn.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.43
  - number: 8.43.3
    text: |-
      In afwijking van het eerste lid is een naheffingsaanslag alsmede een navorderingsaanslag invorderbaar een maand na
      dagtekening van het aanslagbiljet.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.43
  - number: 8.43.4
    text: |-
      De [Algemene termijnenwet][ref1] is niet van toepassing op de in de voorgaande leden gestelde termijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.43
    references:
      - id: ref1
        bwb_id: BWBR0002448
  - number: 8.44.1
    text: |-
      Een belastingschuldige die een belastingaanslag niet binnen de gestelde termijn betaalt, wordt door de ontvanger
      aangemaand om alsnog binnen veertien dagen het verschuldigde te voldoen, met kennisgeving dat hij bij gebreke
      daarvan door rechtsmiddelen tot betaling zal worden gedwongen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.44
  - number: 8.44.2
    text: |-
      Bij overschrijding van een voor de belastingaanslag geldende betalingstermijn wordt aan de belastingschuldige een
      interest in rekening gebracht over het op de belastingaanslag openstaande bedrag van zes percent per jaar, met
      een minimum van één USD en verder naar boven afgerond tot een veelvoud van USD 0,50 met dien verstande dat dit
      bedrag wordt verlaagd ingeval de belastingaanslag wordt verminderd. De interest wordt enkelvoudig berekend over het
      tijdvak dat aanvangt op de dag waarop de belastingaanslag invorderbaar is ingevolge [artikel 8.43][ref1] en eindigt
      op de dag voorafgaand aan die van de betaling of verrekening.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.44
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '2'
  - number: 8.44.3
    text: |-
      Indien een belastingaanslag leidt tot een uit te betalen bedrag en de uitbetaling of verrekening hiervan later
      plaatsvindt dan twee maanden na de dagtekening van het aanslagbiljet, wordt aan de belastingschuldige een interest
      vergoed over het uit te betalen bedrag van zes percent per jaar, met een minimum van één USD en verder naar boven
      afgerond tot een veelvoud van USD 0,50. De interest wordt enkelvoudig berekend over het tijdvak dat aanvangt op de
      dag na de dagtekening van de tot uitbetaling strekkende belastingaanslag en eindigt op de dag voorafgaand aan die
      van de betaling of verrekening.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.44
  - number: 8.44.4
    text: |-
      Interest wordt niet vergoed voor zover het aan de belastingschuldige is te wijten dat de uitbetaling of verrekening
      niet tijdig is geschied.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.44
  - number: '8.45'
    text: |-
      Indien een aanmaning uiterlijk een maand na de verzending niet tot betaling of het verlenen van een
      betalingsregeling heeft geleid kan de ontvanger overgaan tot dwanginvordering.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.45
  - number: '8.46'
    text: |-
      De belastingaanslag, de bestuurlijke boete, de interest en de kosten van vervolging kunnen worden ingevorderd door
      middel van een dwangschrift. Het dwangschrift kan betrekking hebben op verschillende aanslagen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.46
  - number: 8.47.1
    text: 'De dwangschriften dragen aan het hoofd de woorden: «In naam van de Koning» en bevatten:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.47
  - number: 8.47.1.a
    text: een zo volledig mogelijke aanduiding van degene tegen wie de vordering gericht wordt;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.47
  - number: 8.47.1.b
    text: |-
      de aard, de grondslag en het bedrag van de vordering; de titel van de vordering of de artikelen van de wettelijke
      regeling, waarop de vordering wordt gegrond;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.47
  - number: 8.47.1.c
    text: in alle gevallen de last tot betaling.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.47
  - number: 8.47.2
    text: Zij worden uitgevaardigd door de ontvanger.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.47
  - number: '8.48'
    text: |-
      Alle exploten en andere akten van vervolging voor de invordering van BES belastingen worden betekend
      door belastingdeurwaarders ten verzoeke van de ontvanger overeenkomstig de bepalingen van het
      [Wetboek van Burgerlijke Rechtsvordering BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028496
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.48
    references:
      - id: ref1
        bwb_id: BWBR0028496
  - number: '8.49'
    text: |-
      De dwangschriften hebben dezelfde kracht en worden op dezelfde wijze ten uitvoer gelegd als de grossen van in
      kracht van gewijsde gegane vonnissen in burgerlijke zaken.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.49
  - number: '8.50'
    text: |-
      Indien een dwangschrift, uitgevaardigd voor een gedeelte van het in te vorderen bedrag, ten uitvoer wordt gelegd
      door beslag, kan bij datzelfde dwangschrift het volle openstaande bedrag worden ingevorderd, mits dit bedrag in het
      dwangschrift is vermeld.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.50
  - number: 8.51.1
    text: |-
      Wanneer ter gelegenheid van een inbeslagneming vóór de sluiting van het proces-verbaal het volle bedrag van het
      verschuldigde met de kosten aan de belastingdeurwaarder wordt aangeboden, is deze verplicht de gelden aan te nemen,
      daarvoor dadelijk kwitantie te geven en ervan melding te maken in of op het proces-verbaal.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.51
  - number: 8.51.2
    text: In alle andere gevallen zijn betalingen, aan de belastingdeurwaarder gedaan, ongeldig.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.51
  - number: 8.52.1
    text: |-
      In afwijking van [artikel 8.43][ref1] zijn alle verschuldigde BES belastingen ineens en terstond invorderbaar:


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.52
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '2'
  - number: 8.52.1.a
    text: wanneer de belastingschuldige in staat van faillissement is verklaard;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.52
  - number: 8.52.1.b
    text: |-
      wanneer de ontvanger aannemelijk maakt dat belastingschuldige de BES eilanden wil verlaten met wegvoering of na
      vervreemding van zijn goederen;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.52
  - number: 8.52.1.c
    text: |-
      wanneer op goederen waarop een belastingschuld van de belastingschuldige kan worden verhaald, beslag is gelegd voor
      zijn belastingschuld;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.52
  - number: 8.52.1.d
    text: |-
      wanneer de ontvanger aannemelijk maakt dat gegronde vrees bestaat dat goederen van de belastingschuldige zullen
      worden verduisterd;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.52
  - number: 8.52.1.e
    text: wanneer goederen van de belastingschuldige worden verkocht ten gevolge van een beslaglegging namens derden.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.52
  - number: 8.52.2
    text: 'Indien de verschuldigde belasting ineens en terstond invorderbaar is, kan:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.52
  - number: 8.52.2.a
    text: |-
      het dwangschrift zonder voorafgaande aanmaning of, indien reeds een aanmaning is uitgereikt, terstond worden
      uitgevaardigd;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.52
  - number: 8.52.2.b
    text: |-
      het dwangschrift onmiddellijk na het bevel tot betaling, of, indien zodanig bevel reeds mocht zijn gedaan, terstond
      worden ten uitvoer gelegd.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.52
  - number: 8.53.1
    text: |-
      De belastingschuldige kan tegen de tenuitvoerlegging van een dwangschrift in verzet komen. Het verzet schorst de
      tenuitvoerlegging van het dwangschrift voor zover deze door het verzet wordt bestreden.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.53
  - number: 8.53.2
    text: |-
      Het verzet wordt betekend aan de ontvanger, die de betaling vervolgt en moet op straffe van nietigheid
      bevatten keuze van domicilie in de hoofdplaats op de BES eilanden, waar de ontvanger is gevestigd waaronder de
      belastingschuldige ressorteert. Eveneens op straffe van nietigheid moet binnen een maand na deze betekening het
      geding tegen de ontvanger worden aanhangig gemaakt.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.53
  - number: 8.53.3
    text: |-
      Verzet kan niet gegrond zijn op het niet ontvangen van aanslagbiljet of aanmaning en kan nimmer gericht zijn tegen
      de wettigheid of de hoegrootheid van het gevorderde bedrag, noch gegrond zijn op de bewering dat aanspraak zou
      bestaan op ontheffing of vermindering.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.53
  - number: 8.53.4
    text: |-
      Indien het verzet wordt afgewezen, is geen hoger beroep ontvankelijk dan na bewijs, dat de BES belasting is
      geconsigneerd in handen van de ontvanger, die de betaling vervolgt.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.53
  - number: 8.54.1
    text: |-
      Al degenen, die gelden aan belastingschuldigen toekomende onder zich hebben alsmede allen, die schuldenaar zijn van
      opeisbare vorderingen van belastingschuldigen, zijn verplicht op de daartoe gedane vordering van de ontvanger, voor
      zover de gelden die onder hen berusten of door hen verschuldigd strekken voor rekening van de belastingschuldige en
      vatbaar zijn voor beslag, de door deze verschuldigde sommen te betalen zonder daartoe een rangregeling, verificatie
      of rechterlijk bevel af te wachten, tenzij onder hen beslag is gelegd of verzet gedaan is ter zake van vorderingen
      waaraan voorrang boven de vorderingen van ‘s Rijks schatkist is toegekend. Zij zijn zelfs bevoegd de betaling uit
      eigen beweging te doen, voordat zij tot afgifte van de gelden of tot voldoening van het door hen verschuldigde
      overgaan. Voldoening aan de vordering geldt als betaling aan de belastingschuldige.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.54
  - number: 8.54.2
    text: |-
      De belastingschuldige kan op voet van [artikel 8.53][ref1] in verzet komen tegen de vordering als ware deze de
      tenuitvoerlegging van een dwangschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.54
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '3'
  - number: 8.54.3
    text: |-
      De ontvanger vervolgt degene die in gebreke blijft aan de vordering te voldoen bij executoriaal beslag volgens
      de regels in [Boek 2, titel 2, afdeling 2, van het Wetboek van Burgerlijke Rechtsvordering BES][ref1]. De kosten
      van vervolging komen voor rekening van degene die in gebreke blijft aan de vordering te voldoen, zonder recht van
      verhaal op de belastingschuldige.


      [ref1]: https://wetten.overheid.nl/BWBR0028496#Afdeling2
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.54
    references:
      - id: ref1
        bwb_id: BWBR0028496
        afdeling: '2'
  - number: 8.55.1
    text: ‘s Rijks schatkist heeft een voorrecht op alle goederen van de belastingschuldige.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.55
  - number: 8.55.2
    text: |-
      Het voorrecht gaat boven alle andere voorrechten met uitzondering van die van de [artikelen 287][ref1]
      en [288, onderdeel a, van Boek 3 van het Burgerlijk Wetboek BES][ref2], alsmede dat van
      [artikel 284 van Boek 3 van het Burgerlijk Wetboek BES][ref3] voor zover de kosten zijn gemaakt na de dagtekening
      van het aanslagbiljet. Het voorrecht gaat tevens boven pand, voor zover het pandrecht rust op een zaak of vrucht
      als is bedoeld in [artikel 8.56][ref4] die zich bevindt in het bezit van de schuldenaar of in het huis, in de
      bedrijfsruimte of op het erf, door hem bewoond of bij hem in gebruik en tegen inbeslagneming waarvan derden zich
      op die grond niet kunnen verzetten. Het behoudt deze rang in geval van faillissement van de belastingschuldige,
      ongeacht of tevoren inbeslagneming heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel287
      [ref2]: https://wetten.overheid.nl/BWBR0028745#Artikel288
      [ref3]: https://wetten.overheid.nl/BWBR0028745#Artikel284
      [ref4]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.55
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '287'
      - id: ref2
        bwb_id: BWBR0028745
        artikel: '288'
      - id: ref3
        bwb_id: BWBR0028745
        artikel: '284'
      - id: ref4
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        paragraaf: '1'
        afdeling: '4'
  - number: 8.56.1
    text: |-
      Derden die geheel of gedeeltelijk recht menen te hebben op roerende zaken waarop ter zake van de belastingschuld
      beslag is gelegd of die een recht van terugvordering hebben jegens degene die een zaak onrechtmatig of van een
      onbevoegde heeft verkregen, kunnen verzet in rechte doen tegen de inbeslagneming vóór de verkoop en uiterlijk
      binnen zeven dagen te rekenen vanaf de dag van beslaglegging.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.56
  - number: 8.56.2
    text: |-
      Derden kunnen echter nimmer verzet in rechte doen tegen de inbeslagneming van roerende zaken, tot stoffering van
      een huis of ten gebruike van het bedrijf dienende, alsmede van ingeoogste vruchten, wanneer die zaken of vruchten
      zich tijdens de inbeslagneming bevinden in het bezit van de schuldenaar of in het huis, in de bedrijfsruimte of op
      het erf, door hem bewoond of bij hem in gebruik.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.56
  - number: 8.57.1
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de gevallen waarin de ontvanger uitstel
      van betaling verleent.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.57
  - number: 8.57.2
    text: De ontvanger beslist bij voor bezwaar vatbare beschikking op een verzoek om uitstel van betaling.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.57
  - number: 8.57.3
    text: |-
      Gedurende het uitstel van betaling wordt op grond van [artikel 8.44, tweede lid][ref1], interest in rekening
      gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.57
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '3'
  - number: 8.57.4
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot het verlenen van uitstel van betaling
      voor de duur van tien jaren – te rekenen vanaf de laatste dag van het kalenderjaar waarin de belastingplichtige
      de BES eilanden metterwoon heeft verlaten – mits voldoende zekerheid is gesteld, voor belastingaanslagen voor
      zover daarin is begrepen inkomstenbelasting ter zake van de vervreemding van tot een aanmerkelijk belang behorende
      aandelen en winstbewijzen waarbij de [Wet inkomstenbelasting BES][ref1] toepassing heeft gevonden, alsmede met
      betrekking tot het beëindigen van het uitstel van betaling.


      [ref1]: https://wetten.overheid.nl/BWBR0029281
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.57
    references:
      - id: ref1
        bwb_id: BWBR0029281
  - number: 8.58.1
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld krachtens welke aan de belastingschuldige die niet in
      staat is anders dan met buitengewoon bezwaar een belastingaanslag geheel of gedeeltelijk te betalen, gehele of
      gedeeltelijke kwijtschelding kan worden verleend.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.58
  - number: 8.58.2
    text: |-
      Bij ministeriële regeling kunnen tevens regels gesteld worden krachtens welke ter zake van de belasting waarvoor
      op de voet van [artikel 8.57, vierde lid][ref1], uitstel van betaling is verleend, kwijtschelding van belasting kan
      worden verleend en tot welke bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.58
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        paragraaf: '2'
        afdeling: '4'
  - number: 8.58.3
    text: De ontvanger beslist bij voor bezwaar vatbare beschikking op een verzoek om kwijtschelding.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.58
  - number: 8.59.1
    text: |-
      De ontvanger is ten aanzien van de belastingschuldige bevoegd aan hem uit te betalen en van hem te innen bedragen
      voor zover de invordering daarvan aan hem is opgedragen met elkaar te verrekenen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.59
  - number: 8.59.2
    text: De ontvanger stelt de belastingschuldige onverwijld in kennis van de verrekening.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.59
  - number: 8.60.1
    text: |-
      Belastingaanslagen verjaren vijf jaren na dagtekening van het aanslagbiljet of vijf jaren na de laatst betekende
      akte van vervolging.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.60
  - number: 8.60.2
    text: |-
      De verjaring wordt gestuit door een erkentenis van de belastingschuldige, door woorden of door daden, van het
      bestaan van de belastingschuld.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.60
  - number: 8.60.3
    text: 'De verjaringstermijn wordt verlengd met de tijd gedurende welke na de aanvang van die termijn:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.60
  - number: 8.60.3.a
    text: de belastingschuldige uitstel van betaling heeft;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.60
  - number: 8.60.3.b
    text: |-
      de tenuitvoerlegging van een dwangschrift is geschorst ingevolge een lopend rechtsgeding, met dien verstande dat de
      termijn waarmee de verjaringstermijn wordt verlengd een aanvang neemt op de dag waarop het rechtsgeding door middel
      van dagvaarding aanhangig wordt gemaakt;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.60
  - number: 8.60.3.c
    text: de belastingschuldige surseance van betaling heeft;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.60
  - number: 8.60.3.d
    text: de belastingschuldige in staat van faillissement verkeert;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.60
  - number: 8.60.3.e
    text: de belastingschuldige zich metterwoon niet op de BES eilanden bevindt.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.60
  - number: '8.61'
    text: |-
      In deze afdeling wordt, in afwijking in zoverre van [artikel 1.3, onderdeel d][ref1], onder de belasting mede
      begrepen de daarmee samenhangende bestuurlijke boeten, interest en kosten van vervolging voor zover het belopen
      daarvan aan de aansprakelijk gestelde is te wijten.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel1
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.61
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '1'
        hoofdstuk: I
  - number: 8.62.1
    text: |-
      De aansprakelijkstelling wordt bij voor bezwaar vatbare beschikking bekend gemaakt door de ontvanger aan de
      aansprakelijk gestelde.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.62
  - number: 8.62.2
    text: |-
      Het bedrag, verschuldigd op grond van deze afdeling, is invorderbaar twee maanden nadat aansprakelijkstelling heeft
      plaatsgevonden. [Artikel 8.39][ref1] en [afdeling 3][ref2] en [4][ref3] van deze titel zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0029244#HoofdstukVIII
      [ref3]: https://wetten.overheid.nl/BWBR0029244#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.62
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0029244
        hoofdstuk: VIII
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0029244
        hoofdstuk: VIII
        afdeling: '4'
  - number: 8.62.3
    text: |-
      De ontvanger stelt de aansprakelijk gestelde desgevraagd op de hoogte van de gegevens met betrekking tot de
      belasting waarvoor hij aansprakelijk is gesteld voor zover deze gegevens voor het maken van bezwaar of het
      instellen van beroep van belang kunnen worden geacht.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.62
  - number: 8.62.4
    text: |-
      Voor zover de aansprakelijkstelling een bestuurlijke boete betreft, is [afdeling 2 van titel 3][ref1] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.62
    references:
      - id: ref1
        bwb_id: BWBR0029244
        hoofdstuk: VIII
        afdeling: '2'
  - number: 8.63.1
    text: |-
      Indien ten onrechte geen of te weinig algemene bestedingsbelasting is geheven, door toedoen van een ander dan de
      ondernemer, is die ander hoofdelijk aansprakelijk voor die algemene bestedingsbelasting.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.63
  - number: 8.63.2
    text: |-
      Indien krachtens [artikel 6.12, vierde lid][ref1], de algemene bestedingsbelasting wordt geheven van degene aan
      wie de levering wordt verricht of de dienst wordt verleend, is, in bij ministeriële regeling aan te wijzen gevallen
      en onder daarbij te stellen voorwaarden, de ondernemer die de levering verricht of de dienst verleent hoofdelijk
      aansprakelijk voor die belasting, tenzij de ondernemer aantoont dat het niet aan hem te wijten is dat de belasting
      niet is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel6
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.63
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '6'
        hoofdstuk: VI
        afdeling: '4'
  - number: '8.64'
    text: |-
      Ingeval een niet in het openbaar lichaam van zijn afnemer wonende of gevestigde ondernemer, een andere dan een BES
      ondernemer als bedoeld in [artikel 6.1, onderdeel g][ref1], diensten verricht ten behoeve van een in dat openbaar
      lichaam wonende of gevestigde afnemer, niet zijnde een ondernemer, is degene aan wie de dienst wordt verleend,
      hoofdelijk aansprakelijk voor de algemene bestedingsbelasting, de boeten, interest en kosten indien deze dienst aan
      belasting zou zijn onderworpen wanneer de dienst door een in het openbaar lichaam wonende of gevestigde ondernemer
      zou zijn verricht behoudens ingeval de betrokkene ten genoegen van de inspecteur kan aantonen dat de verschuldigde
      belasting aan hem in rekening is gebracht en hij deze betaald heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel6
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.64
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '6'
        hoofdstuk: VI
  - number: 8.65.1
    text: |-
      In afwijking in zoverre van andere wettelijke regelingen is hoofdelijk aansprakelijk voor de loonbelasting,
      de premie op grond van de [Wet algemene ouderdomsverzekering BES][ref1], de premie op grond van
      de [Wet algemene weduwen en wezenverzekering BES][ref2], de premie op grond van het Besluit premie
      zorgverzekering BES, de premie op grond van de Wet Ziektekostenverzekering BES, de premie op grond van de
      [Wet Ongevallenverzekering BES][ref3], de premie op grond van de [Cessantiawet BES][ref4] en de premie op
      grond van het [Besluit Zorgverzekering BES][ref5], de vastgoedbelasting, de opbrengstbelasting, de algemene
      bestedingsbelasting, de overdrachtsbelasting, de kansspelbelasting en de accijnzen, verschuldigd door:


      [ref1]: https://wetten.overheid.nl/BWBR0028459
      [ref2]: https://wetten.overheid.nl/BWBR0028387
      [ref3]: https://wetten.overheid.nl/BWBR0028497
      [ref4]: https://wetten.overheid.nl/BWBR0028304
      [ref5]: https://wetten.overheid.nl/BWBR0029404
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.65
    references:
      - id: ref1
        bwb_id: BWBR0028459
      - id: ref2
        bwb_id: BWBR0028387
      - id: ref3
        bwb_id: BWBR0028497
      - id: ref4
        bwb_id: BWBR0028304
      - id: ref5
        bwb_id: BWBR0029404
  - number: 8.65.1.a
    text: |-
      een lichaam zonder rechtspersoonlijkheid of een rechtspersoonlijkheid bezittend lichaam dat niet volledig
      rechtsbevoegd is: ieder van de bestuurders;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.65
  - number: 8.65.1.b
    text: |-
      een niet op de BES eilanden gevestigd lichaam: de leider van zijn vaste inrichting op de BES eilanden dan wel zijn
      op de BES eilanden wonende of gevestigde vaste vertegenwoordiger;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.65
  - number: 8.65.1.c
    text: |-
      een lichaam dat is ontbonden: ieder van de met de vereffening belaste personen – met uitzondering van de door de
      rechter benoemde vereffenaar – voor zover het niet betalen van de belasting-, premie- of accijnsschuld het gevolg
      is van aan hem te wijten kennelijk onbehoorlijk bestuur, met dien verstande dat geen aansprakelijkstelling kan
      plaatsvinden indien na de ontbinding drie jaren zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.65
  - number: 8.65.2
    text: |-
      Voor de toepassing van dit artikel wordt als bestuurder aangemerkt de volledig aansprakelijke vennoot van een maat-
      of vennootschap.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.65
  - number: 8.65.3
    text: |-
      Voor de toepassing van dit artikel wordt ingeval een bestuurder van een lichaam zelf een lichaam is, onder
      bestuurder mede verstaan ieder van de bestuurders van het laatstbedoelde lichaam.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.65
  - number: 8.65.4
    text: |-
      Degene die op grond van het eerste lid, onderdelen a en b, aansprakelijk is, is niet aansprakelijk voor zover hij
      bewijst dat het niet aan hem is te wijten dat de belasting, premie of accijns niet is voldaan.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.65
  - number: 8.65a.1
    text: |-
      Hoofdelijk aansprakelijk is voor de loonbelasting, de premie op grond van
      de [Wet algemene ouderdomsverzekering BES][ref1], de premie op grond van de
      [Wet algemene weduwen en wezenverzekering BES][ref2], de premie op grond van het Besluit premie
      zorgverzekering BES, de premie op grond van de Wet Ziektekostenverzekering BES, de premie op grond van de Wet
      Ongevallenverzekering BES, de premie op grond van de [Cessantiawet BES][ref3] en de premie op grond van het
      [Besluit Zorgverzekering BES][ref4], de vastgoedbelasting, de opbrengstbelasting, de algemene bestedingsbelasting,
      de overdrachtsbelasting, de kansspelbelasting en de accijnzen verschuldigd door een rechtspersoonlijkheid bezittend
      lichaam dat volledig rechtsbevoegd is: ieder van de bestuurders overeenkomstig het bepaalde in de volgende leden.


      [ref1]: https://wetten.overheid.nl/BWBR0028459
      [ref2]: https://wetten.overheid.nl/BWBR0028387
      [ref3]: https://wetten.overheid.nl/BWBR0028304
      [ref4]: https://wetten.overheid.nl/BWBR0029404
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.65a
    references:
      - id: ref1
        bwb_id: BWBR0028459
      - id: ref2
        bwb_id: BWBR0028387
      - id: ref3
        bwb_id: BWBR0028304
      - id: ref4
        bwb_id: BWBR0029404
  - number: 8.65a.2
    text: |-
      Het lichaam, bedoeld in het eerste lid, is verplicht om onverwijld nadat gebleken is dat het niet tot betaling van
      de in dat lid bedoelde belastingen, premies of accijnzen in staat is, daarvan schriftelijk mededeling te doen aan
      de ontvanger en, indien de ontvanger dit verlangt, nadere inlichtingen te verstrekken en stukken over te leggen.
      Elke bestuurder is bevoegd om namens het lichaam aan deze verplichting te voldoen. Bij of krachtens algemene
      maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de inhoud van de mededeling, de aard
      en de inhoud van de te verstrekken inlichtingen en de over te leggen stukken, alsmede de termijnen waarbinnen het
      doen van de mededeling, het verstrekken van de inlichtingen en het overleggen van de stukken dienen te geschieden.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.65a
  - number: 8.65a.3
    text: |-
      Indien het lichaam op juiste wijze aan zijn in het tweede lid bedoelde verplichting heeft voldaan, is een
      bestuurder aansprakelijk indien aannemelijk is, dat het niet betalen van de belasting, premie of accijns het gevolg
      is van aan hem te wijten kennelijk onbehoorlijk bestuur in de periode van drie jaren, voorafgaande aan het tijdstip
      van de mededeling.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.65a
  - number: 8.65a.4
    text: |-
      Indien het lichaam niet of niet op juiste wijze aan zijn in het tweede lid bedoelde verplichting heeft voldaan,
      is een bestuurder op de voet van het bepaalde in het derde lid aansprakelijk, met dien verstande dat wordt vermoed
      dat het niet betalen aan hem is te wijten en dat de periode van drie jaren wordt geacht in te gaan op het tijdstip
      waarop het lichaam in gebreke is. Tot de weerlegging van het vermoeden wordt slechts toegelaten de bestuurder
      die aannemelijk maakt dat het niet aan hem is te wijten dat het lichaam niet aan zijn in het tweede lid bedoelde
      verplichting heeft voldaan.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.65a
  - number: 8.65a.5
    text: 'Voor de toepassing van dit artikel wordt onder bestuurder mede verstaan:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.65a
  - number: 8.65a.5.a
    text: de gewezen bestuurder tijdens wiens bestuur de belasting-, premie- of accijnsschuld is ontstaan;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.65a
  - number: 8.65a.5.b
    text: |-
      degene ten aanzien van wie aannemelijk is dat hij het beleid van het lichaam heeft bepaald of mede heeft bepaald
      als ware hij bestuurder, met uitzondering van de door de rechter benoemde bewindvoerder;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.65a
  - number: 8.65a.5.c
    text: 'indien een bestuurder van een lichaam een lichaam is: ieder van de bestuurders van het laatstbedoelde lichaam.'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.65a
  - number: 8.65a.6
    text: De tweede volzin van het vierde lid is niet van toepassing op de gewezen bestuurder.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.65a
  - number: 8.65a.7
    text: |-
      Voor de toepassing van dit artikel wordt onder belasting, premie of accijns uitsluitend verstaan de belasting,
      premie of accijns die het lichaam als inhoudingsplichtige of als ondernemer is verschuldigd.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.65a
  - number: 8.65a.8
    text: |-
      Indien de bestuurder van het lichaam ingevolge dit artikel aansprakelijk is en niet in staat is tot betaling
      van zijn schuld ter zake, zijn de door die bestuurder onverplicht verrichte rechtshandelingen waardoor de
      mogelijkheid tot verhaal op hem is verminderd, vernietigbaar en kan de ontvanger deze vernietigingsgrond inroepen,
      indien aannemelijk is dat deze rechtshandelingen geheel of nagenoeg geheel met dat oogmerk zijn verricht.
      [Artikel 45, vierde en vijfde lid, van Boek 3 van het Burgerlijk Wetboek BES][ref1] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel45
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.65a
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '45'
  - number: 8.66.1
    text: |-
      Voor de loonbelasting verschuldigd door een niet op de BES eilanden wonende of gevestigde inhoudingsplichtige is
      hoofdelijk aansprakelijk:
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.66
  - number: 8.66.1.a
    text: de leider van de vaste inrichting op de BES eilanden;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.66
  - number: 8.66.1.b
    text: zijn op de BES eilanden wonende of gevestigde vaste vertegenwoordiger; of
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.66
  - number: 8.66.1.c
    text: degene, die de leiding heeft van op de BES eilanden verrichte werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.66
  - number: 8.66.2
    text: |-
      De werknemer kan hoofdelijk aansprakelijk worden gesteld voor de van hem ten onrechte niet ingehouden
      loonbelasting, tenzij hij de inspecteur tijdig van de nalatigheid van de inhoudingsplichtige in kennis heeft
      gesteld.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.66
  - number: 8.66.3
    text: |-
      Indien de inhoudingsplichtige niet op de BES eilanden woont of gevestigd is, kan de werknemer mede aansprakelijk
      worden gesteld voor de verschuldigde belasting.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.66
  - number: 8.66.4
    text: |-
      De werknemer, die in dienstbetrekking is bij een niet op de BES eilanden wonende of gevestigde inhoudingsplichtige
      en die de BES eilanden wenst te verlaten, kan mede aansprakelijk worden gesteld voor de verschuldigde belasting.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.66
  - number: 8.67.1
    text: |-
      Voor de loonbelasting, de sociale verzekeringspremies en de algemene bestedingsbelasting welke de
      inhoudingsplichtige verschuldigd is in verband met het verrichten van werkzaamheden door een werknemer die met
      instandhouding van de dienstbetrekking tot de inhoudingsplichtige, de uitlener, door deze ter beschikking is
      gesteld van een derde, de inlener, om onder diens toezicht of leiding werkzaam te zijn, is de inlener of ingeval
      doorlening plaatsvindt, de in het tweede lid bedoelde doorlener, hoofdelijk aansprakelijk behoudens voor zover hij
      aantoont dat ten aanzien van hem een te hoog bedrag aan belasting in aanmerking is genomen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.67
  - number: 8.67.2
    text: |-
      Onder inlener wordt mede verstaan de doorlener, zijnde degene aan wie een werknemer ter beschikking is gesteld
      en die deze werknemer vervolgens ter beschikking stelt aan een derde om onder diens toezicht en leiding werkzaam
      te zijn.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.67
  - number: 8.67.3
    text: |-
      Voor zover een inlener ingevolge een schriftelijke overeenkomst met een uitlener het bedrag waarvoor hij op
      grond van het eerste lid hoofdelijk aansprakelijk is, heeft overgemaakt op een rekening die door die inlener bij
      een ingevolge de [Wet financiële markten BES][ref1] ingeschreven kredietinstelling ter zake van dat werk wordt
      gehouden voor betaling van loonbelasting, sociale verzekeringspremies en algemene bestedingsbelasting, wordt elke
      betaling die de uitlener voor dat doel voor het tijdvak waarin het werk is uitgevoerd ten laste van die rekening
      heeft gedaan, vermoed betrekking te hebben op dat werk. Bij algemene maatregel van bestuur kunnen met betrekking
      tot de toepassing van dit lid nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0030883
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.67
    references:
      - id: ref1
        bwb_id: BWBR0030883
  - number: 8.67.4
    text: |-
      De aansprakelijkheid op grond van het eerste lid geldt niet met betrekking tot de belasting verschuldigd door een
      inlener indien aannemelijk is dat de niet-betaling door de uitlener noch aan hem noch aan de inlener te wijten is.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.67
  - number: 8.68.1
    text: |-
      In dit artikel wordt verstaan onder: - *aannemer:* degene, die zich jegens de opdrachtgever verbindt om buiten
      dienstbetrekking een werk uit te voeren tegen een te betalen prijs;
        - *onderaannemer:* degene, die zich jegens een aannemer verbindt om buiten dienstbetrekking het in onderdeel a
      bedoelde werk geheel of gedeeltelijk uit te voeren tegen een te betalen prijs.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.68
  - number: 8.68.2
    text: |-
      Voor de toepassing van dit artikel wordt de onderaannemer ten opzichte van zijn onderaannemer als aannemer
      beschouwd.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.68
  - number: 8.68.3
    text: |-
      Voor de toepassing van dit artikel wordt met een aannemer gelijkgesteld degene die, zonder daartoe van een
      opdrachtgever opdracht te hebben gekregen, buiten dienstbetrekking in de normale uitoefening van zijn bedrijf een
      werk uitvoert.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.68
  - number: 8.68.4
    text: |-
      Voor de toepassing van dit artikel wordt ten opzichte van de aannemer als onderaannemer beschouwd de verkoper van
      een toekomstig goed, voor zover de koop en verkoop voortvloeit uit, of verband houdt met, het in het eerste lid,
      onderdeel a, bedoelde werk.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.68
  - number: 8.68.5
    text: |-
      De aannemer is hoofdelijk aansprakelijk voor de loonbelasting, de sociale verzekeringspremies en de algemene
      bestedingsbelasting:
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.68
  - number: 8.68.5.a
    text: |-
      die de onderaannemer en, indien een werk geheel of gedeeltelijk door een of meer volgende onderaannemers wordt
      uitgevoerd, iedere volgende onderaannemer, verschuldigd is in verband met het verrichten van werkzaamheden door
      zijn werknemers ter zake van dat werk, behoudens voor zover hij aannemelijk maakt dat ten aanzien van hem een te
      hoog bedrag aan belasting in aanmerking is genomen;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.68
  - number: 8.68.5.b
    text: |-
      waarvan de onderaannemer en, indien een werk geheel of gedeeltelijk door een of meer volgende onderaannemers wordt
      uitgevoerd, iedere volgende onderaannemer, ingevolge [artikel 8.65][ref1] hoofdelijk aansprakelijk is ter zake van
      dat werk, behoudens voor zover hij aannemelijk maakt dat ten aanzien van hem een te hoog bedrag aan belasting in
      aanmerking is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.68
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        paragraaf: '2'
        afdeling: '5'
  - number: 8.68.6
    text: |-
      Voor zover een aannemer ingevolge een schriftelijke overeenkomst met een onderaannemer het bedrag waarvoor hij op
      grond van het vijfde lid hoofdelijk aansprakelijk is, heeft overgemaakt op een rekening die door die onderaannemer
      bij een ingevolge de [Wet financiële markten BES][ref1] ingeschreven kredietinstelling ter zake van dat werk
      wordt gehouden voor betaling van belasting, wordt elke betaling die de onderaannemer voor dat doel voor het
      tijdvak waarin het werk is uitgevoerd ten laste van die rekening heeft gedaan, vermoed betrekking te hebben op
      dat werk. Onder betaling van belasting, als bedoeld in de vorige volzin, wordt mede begrepen een betaling door een
      onderaannemer aan zijn onderaannemer, welke betaling ingevolge een tussen hen gesloten schriftelijke overeenkomst
      wordt gedaan op een rekening als bedoeld in de vorige volzin. Bij algemene maatregel van bestuur kunnen met
      betrekking tot de toepassing van dit lid nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0030883
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.68
    references:
      - id: ref1
        bwb_id: BWBR0030883
  - number: 8.68.7
    text: |-
      De aansprakelijkheid op grond van het vijfde lid geldt niet met betrekking tot de belasting verschuldigd door
      een aannemer indien aannemelijk is dat de niet-betaling door de onderaannemer noch aan hem noch aan de aannemer
      te wijten is, dan wel, indien de aannemer uiterlijk binnen een maand na dagtekening van de overeenkomst met de
      onderaannemer een afschrift van de door alle partijen ondertekende overeenkomst aan de inspecteur heeft overgelegd.
      De overeenkomst dient in ieder geval te vermelden de naam of benaming en de woonplaats van de onderaannemer, het
      onderdeel van het werk waarvoor de onderaannemer zorg draagt, de plaats en de datum van het werk, de geschatte
      aanneemsom en de geschatte loonsom. Bij algemene maatregel van bestuur kunnen met betrekking tot de toepassing van
      dit lid nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.68
  - number: 8.68.8
    text: 'De voorgaande leden zijn niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.68
  - number: 8.68.8.1°
    text: |-
      een werk, tot de uitvoering waarvan een onderaannemer zich jegens een aannemer heeft verbonden, geheel of
      grotendeels wordt verricht op de plaats, waar de onderneming van de onderaannemer is gevestigd, of
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.68
  - number: 8.68.8.2°
    text: |-
      de uitvoering van een werk waartoe een onderaannemer zich jegens een aannemer heeft verbonden ondergeschikt is aan
      een tussen hen gesloten overeenkomst van koop en verkoop van een bestaande zaak.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.68
  - number: '8.69'
    text: |-
      Bij algemene maatregel van bestuur kunnen bedrijfssectoren en bedrijfstakken worden aangewezen ten aanzien waarvan
      [artikel 8.67][ref1] alsmede [artikel 8.68][ref2] niet van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.69
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        paragraaf: '2'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        paragraaf: '2'
        afdeling: '5'
  - number: '8.70'
    text: |-
      Indien [artikel 4.2, derde lid][ref1], toepassing vindt, is ieder van de belastingplichtigen hoofdelijk
      aansprakelijk voor het gehele belastingbedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel4
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.70
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '4'
        hoofdstuk: IV
  - number: 8.71.1
    text: |-
      Indien een lichaam als bedoeld in [artikel 5.6, tweede lid][ref1], wordt ontbonden, is hoofdelijk aansprakelijk
      voor de door het lichaam verschuldigde opbrengstbelasting ieder van de met de vereffening belaste personen, met
      uitzondering van een door de rechter benoemde vereffenaar, tenzij deze aantoont dat het niet aan hem te wijten is
      dat de opbrengstbelasting niet is voldaan, met dien verstande dat geen aansprakelijkheidsstelling kan plaatsvinden
      indien na de ontbinding vijf jaren zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel5
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.71
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '5'
        hoofdstuk: V
  - number: 8.71.2
    text: |-
      Indien ten onrechte geen of te weinig opbrengstbelasting is geheven, door toedoen of mede door toedoen van een
      ander dan de inhoudingsplichtige, is die ander hoofdelijk aansprakelijk voor die belasting.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.71
  - number: '8.72'
    text: |-
      Indien krachtens [artikel 7.18][ref1] overdrachtsbelasting ter zake van een verkrijging moet worden voldaan ter
      gelegenheid van de aanbieding ter registratie van de door de notaris ter zake opgemaakte akte, is de notaris
      hoofdelijk aansprakelijk voor die belasting tot het bedrag dat ingevolge de inhoud van de akte is verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel7
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.72
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '7'
        hoofdstuk: VII
  - number: 8.73.1
    text: |-
      Degene, die ingevolge deze afdeling heeft betaald, heeft hiervoor verhaal op de belastingschuldige dan wel de
      inhoudingsplichtige die de belasting verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.73
  - number: 8.73.2
    text: |-
      Indien het in het eerste lid bedoelde verhaal geheel of gedeeltelijk onmogelijk blijkt en twee of meer personen
      hoofdelijk aansprakelijk zijn, moeten zij onderling voor gelijke delen in het niet betaalde deel bijdragen. Indien
      [artikel 8.68][ref1] van toepassing is en het aandeel in het totaal van het uit te voeren werk dat iedere van de
      hoofdelijk aansprakelijk gestelden heeft laten uitvoeren kan worden vastgesteld, draagt, in afwijking van de eerste
      volzin, ieder in evenredigheid met dat aandeel bij. Indien dit aandeel niet kan worden vastgesteld, moeten zij
      onderling voor gelijke delen in het niet betaalde deel bijdragen. Degene, die meer heeft betaald dan zijn aandeel,
      heeft voor het meerdere verhaal op degene, die minder dan zijn aandeel heeft betaald. Een tekort, veroorzaakt
      doordat één van hen geen verhaal biedt, wordt over de anderen verdeeld naar evenredigheid van de gedeelten waarvoor
      de schuld ieder van hen aanging.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.73
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        paragraaf: '2'
        afdeling: '5'
  - number: 8.73.3
    text: |-
      Ieder die in de belasting heeft bijgedragen, blijft gerechtigd het bijgedragene alsnog van de belastingschuldige
      terug te vorderen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.73
  - number: 8.74.1
    text: |-
      Met gevangenisstraf van ten hoogste zes maanden of een geldboete van de vierde categorie of, indien de te weinig
      geheven belasting hoger is dan dit bedrag, ten hoogste eenmaal het bedrag van de te weinig geheven belasting, dan
      wel met beide straffen wordt gestraft degene die ingevolge deze wet verplicht is tot:
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.74
  - number: 8.74.1.a
    text: |-
      het uitreiken van een nota overeenkomstig [artikel 5.9, eerste lid][ref1], en deze niet of niet overeenkomstig
      genoemd artikel verstrekt;


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel5
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.74
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '5'
        hoofdstuk: V
  - number: 8.74.1.b
    text: |-
      het bewaren van nota’s overeenkomstig [artikel 5.9, tweede lid][ref1], en deze niet of niet op de voorgeschreven
      wijze bewaart;


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel5
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.74
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '5'
        hoofdstuk: V
  - number: 8.74.1.c
    text: |-
      naleving van de verplichtingen van hoofdstuk VI en daaraan niet, niet tijdig, niet juist of niet volledig voldoet
      of het verbod van [artikel 6.24][ref1] overtreedt;


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel6
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.74
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '6'
        hoofdstuk: VI
  - number: 8.74.1.d
    text: het binnen een gestelde termijn doen van aangifte dat niet binnen de gestelde termijn, onjuist of onvolledig doet;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.74
  - number: 8.74.1.e
    text: het verstrekken van inlichtingen, gegevens of aanwijzingen, en deze niet, onjuist of onvolledig verstrekt;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.74
  - number: 8.74.1.f
    text: |-
      het ter inzage verstrekken van gegevensdragers of de inhoud daarvan, en deze niet of in valse of vervalste vorm
      voor dit doel ter beschikking stelt;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.74
  - number: 8.74.1.g
    text: |-
      het voeren van een administratie overeenkomstig de in de belastingwet gestelde eisen, en een zodanige administratie
      niet voert;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.74
  - number: 8.74.1.h
    text: het bewaren van gegevensdragers, en deze niet bewaart;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.74
  - number: 8.74.1.i
    text: |-
      het verlenen van medewerking als bedoeld in [artikel 8.86 vijfde lid][ref1], en deze niet verleent;


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.74
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
  - number: 8.74.1.j
    text: |-
      het verstekken van de opgave, bedoeld in [artikel 8.87, tweede en derde lid][ref1], en deze opgave niet verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.74
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
  - number: 8.74.2
    text: |-
      Ieder, die in een notariële akte een lagere koopsom doet vermelden dan de waarde in het economische verkeer of
      in zodanige akte niet doet opnemen alle bijkomende verbintenissen of bedingen, met het gevolg, dat de belasting
      wordt geheven over een lager bedrag dan volgens deze belasting tot grondslag van de heffing moet strekken, wordt
      gestraft met een geldboete van de tweede categorie en bij herhaling met een geldboete van de derde categorie en
      gevangenisstraf van ten hoogste drie maanden, tezamen of afzonderlijk. Met dezelfde straf wordt gestraft elke
      ondertekenaar van een valse opgave van de waarde als bedoeld in [artikel 7.13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel7
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.74
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '7'
        hoofdstuk: VII
  - number: 8.74.3
    text: |-
      Degene die zich opzettelijk schuldig maakt aan een in het eerste lid, onderdelen d tot en met j, omschreven
      strafbaar gesteld feit, wordt, indien het feit ertoe strekt dat te weinig belasting wordt geheven, gestraft met
      gevangenisstraf van ten hoogste vier jaar of een geldboete van de vijfde categorie of, indien de te weinig geheven
      belasting hoger is dan dit bedrag, ten hoogste tweemaal het bedrag van de te weinig geheven belasting, dan wel met
      beide straffen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.74
  - number: 8.74.4
    text: |-
      Het recht tot strafvervolging op de voet van dit artikel vervalt indien degene op wie de verplichting
      rust alsnog een juiste en volledige aangifte doet of juiste en volledige inlichtingen, gegevens of
      aanwijzingen verstrekt voordat hij weet of redelijkerwijs moet vermoeden dat de inspecteur of een van de in
      [artikel 8.79, eerste lid][ref1], bedoelde ambtenaren en personen de onjuistheid of onvolledigheid bekend is of
      bekend zal worden.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.74
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
  - number: 8.75.1
    text: |-
      Degene die opzettelijk de hem ingevolge [artikel 8.21][ref1] opgelegde geheimhoudingsplicht schendt, wordt gestraft
      met gevangenisstraf van ten hoogste twee jaar of een geldboete van de vijfde categorie dan wel met beide straffen.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.75
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '4'
  - number: 8.75.2
    text: |-
      Degene aan wiens schuld schending van de geheimhouding te wijten is, wordt gestraft met gevangenisstraf van ten
      hoogste zes maanden of een geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.75
  - number: 8.75.3
    text: |-
      Vervolging inzake schending van de geheimhouding wordt slechts ingesteld op klacht van hem, te wiens aanzien de
      geheimhouding is geschonden.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.75
  - number: '8.76'
    text: |-
      Degene die niet voldoet aan de hem opgelegde verplichting ingevolge de [artikelen 8.84, tweede lid][ref1], en
      [8.85, eerste lid][ref2], wordt gestraft met een geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.76
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
  - number: 8.77.1
    text: |-
      Overtreding van krachtens deze wet bij algemene maatregel van bestuur vastgestelde bepalingen wordt, voor zover die
      overtreding is aangemerkt als strafbaar feit, gestraft met een geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.77
  - number: 8.77.2
    text: |-
      Overtreding van een door Onze Minister krachtens de belastingwet vastgestelde ministeriële regeling wordt, voor
      zover die overtreding is aangemerkt als strafbaar feit, gestraft met een geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.77
  - number: 8.78.1
    text: |-
      De bij deze wet strafbaar gestelde feiten waarop gevangenisstraf is gesteld, zijn misdrijven. De overige bij deze
      wet strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.78
  - number: 8.78.2
    text: |-
      Het [Wetboek van Strafrecht BES][ref1] is mede van toepassing op ieder die zich niet op de BES eilanden schuldig
      maakt aan een bij of krachtens deze wet als misdrijf omschreven strafbaar gesteld feit.


      [ref1]: https://wetten.overheid.nl/BWBR0028570
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.78
    references:
      - id: ref1
        bwb_id: BWBR0028570
  - number: 8.79.1
    text: |-
      Met het opsporen van de bij belastingwet strafbaar gestelde feiten zijn, naast de in
      [artikel 184 van het Wetboek van Strafvordering BES][ref1] bedoelde personen, de ambtenaren van de
      rijksbelastingdienst belast.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel184
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.79
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '184'
  - number: 8.79.2
    text: |-
      De ambtenaren van de rijksbelastingdienst zijn te allen tijde bevoegd tot inbeslagneming van de ingevolge het
      [Wetboek van Strafvordering BES][ref1] voor inbeslagneming vatbare voorwerpen. Zij kunnen daartoe hun uitlevering
      vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0028681
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.79
    references:
      - id: ref1
        bwb_id: BWBR0028681
  - number: 8.79.3
    text: |-
      Bij het opsporen van een bij de belastingwet strafbaar gesteld feit hebben de in het eerste lid bedoelde ambtenaren
      toegang tot elke plaats, voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is. Zij zijn
      bevoegd zich door bepaalde door hen aangewezen personen te laten vergezellen. Voor het betreden van woningen is
      [titel X van het Derde boek van het Wetboek van Strafvordering BES][ref1] onverkort van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.79
    references:
      - id: ref1
        bwb_id: BWBR0028681
  - number: 8.80.1
    text: |-
      De in [artikel 8.79, eerste lid][ref1], bedoelde ambtenaren maken van hun bevindingen proces-verbaal op en delen
      dit in afschrift mede aan degene tot wie de opsporing zich richt.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.80
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
  - number: 8.80.2
    text: |-
      Alle processen-verbaal betreffende de bij deze wet strafbaar gestelde feiten worden ingezonden aan de directeur.
      De directeur doet de processen-verbaal betreffende strafbare feiten, ter zake waarvan inverzekeringstelling
      of voorlopige hechtenis is toegepast dan wel een woning zonder de uitdrukkelijke toestemming van de bewoner is
      binnengetreden, met de in beslag genomen voorwerpen, onverwijld toekomen aan de officier van justitie. De overige
      processen-verbaal doet de directeur met de in beslag genomen voorwerpen toekomen aan de officier van justitie
      indien hij een vervolging wenselijk acht.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.80
  - number: 8.80.3
    text: |-
      De officier van justitie is bevoegd, de zaak ter afdoening weer in handen van de directeur te stellen, die daarmede
      alsdan kan handelen overeenkomstig [artikel 8.81][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.80
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
  - number: 8.80.4
    text: |-
      Het bepaalde in [artikel 14 van het Wetboek van Strafvordering BES][ref1] is niet van toepassing in zaken waarin de
      directeur het proces-verbaal niet aan de officier van justitie heeft doen toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel14
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.80
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '14'
  - number: 8.81.1
    text: |-
      Ten aanzien van feiten, met betrekking tot welk het proces-verbaal niet in handen van de officier van justitie is
      gesteld, vervalt het recht tot strafvordering indien vrijwillig wordt voldaan aan de voorwaarden welke de directeur
      ter voorkoming van de strafvervolging heeft gesteld.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.81
  - number: 8.81.2
    text: 'Als voorwaarden kunnen worden gesteld:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.81
  - number: 8.81.2.a
    text: |-
      betaling aan de BES eilanden van een geldsom van ten minste USD 56 en ten hoogste het maximum van de geldboete die
      voor het feit kan worden opgelegd;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.81
  - number: 8.81.2.b
    text: |-
      afstand van voorwerpen die in beslag genomen zijn en vatbaar voor verbeurdverklaring of onttrekking aan het
      verkeer;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.81
  - number: 8.81.2.c
    text: |-
      uitlevering, of voldoening aan de BES eilanden van de geschatte waarde, van voorwerpen die vatbaar zijn voor
      verbeurdverklaring;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.81
  - number: 8.81.2.d
    text: |-
      voldoening aan de BES eilanden van een geldbedrag gelijk aan of lager dan het geschatte voordeel – met inbegrip van
      besparing van kosten – door de verdachte verkregen door middel van of uit het strafbare feit;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.81
  - number: 8.81.2.e
    text: het alsnog voldoen aan een bij deze wet gestelde verplichting.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.81
  - number: 8.81.3
    text: |-
      De directeur bepaalt telkens de termijn waarbinnen aan de gestelde voorwaarden moet zijn voldaan, en zo nodig
      tevens de plaats waar dat moet gebeuren.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.81
  - number: '8.82'
    text: |-
      De griffier van het Hof verstrekt aan de directeur desgevraagd kosteloos afschrift of uittreksel van vonnissen, in
      belastingstrafzaken gewezen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.82
  - number: 8.83.1
    text: 'Een ieder is gehouden aan de inspecteur op diens verzoek:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.83
  - number: 8.83.1.a
    text: |-
      de gegevens en inlichtingen te verstrekken welke voor de belastingheffing ten aanzien van hem van belang kunnen
      zijn;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.83
  - number: 8.83.1.b
    text: |-
      de gegevensdragers of de inhoud daarvan, zulks naar keuze van de inspecteur, waarvan de inzage van belang kan zijn
      voor de vaststelling van de feiten die op de belastingheffing ten aanzien van hem invloed kunnen uitoefenen, voor
      dit doel beschikbaar te stellen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.83
  - number: 8.83.2
    text: |-
      De in het eerste lid, onderdeel b, genoemde verplichting geldt eveneens voor de derde bij wie de gegevensdragers
      zich bevinden. De inspecteur stelt degene wiens gegevensdragers bij de derde worden ingezien zo spoedig mogelijk
      van de inzage in kennis.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.83
  - number: 8.83.3
    text: |-
      Op degene, die direct of indirect ten minste 50% van de aandelen heeft in het kapitaal van dan wel de zeggenschap
      heeft over een lichaam dat onderworpen is aan één of meer van de in [artikel 1.3, onderdeel d][ref1], genoemde
      BES belastingen, is het eerste lid van overeenkomstige toepassing ten aanzien van gegevens en inlichtingen alsmede
      gegevensdragers die in het bezit zijn van de aandeelhouder en welke van belang kunnen zijn voor de belastingheffing
      van dat lichaam. De eerste volzin is mede van toepassing in gevallen waarin twee of meer natuurlijke personen of
      lichamen volgens een onderlinge regeling tot samenwerking een belang houden van 50% of meer dan wel de zeggenschap
      hebben over een lichaam dat onderworpen is aan één of meer van de in artikel 1.3, onderdeel d, bedoelde BES
      belastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel1
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.83
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '1'
        hoofdstuk: I
  - number: 8.83.4
    text: |-
      Ingeval de belastingwet aangelegenheden van een derde aanmerkt als aangelegenheden van de vermoedelijk
      belastingplichtige, gelden voor de derde gelijke verplichtingen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.83
  - number: 8.83.5
    text: |-
      Een ieder is gehouden ter vaststelling van zijn identiteit, indien zulks voor de heffing van de loonbelasting van
      belang kan zijn, op eerste verzoek van de inspecteur aan deze een geldig paspoort, geldige identiteitskaart dan wel
      geldig rijbewijs ter inzage te verstrekken.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.83
  - number: 8.83a.1
    text: 'Voor de bepaling van de verschuldigde vastgoedbelasting is eenieder die:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.83a
  - number: 8.83a.1.a
    text: |-
      op enig moment van een onroerende zaak het genot verkrijgt krachtens eigendom, bezit of beperkt recht, verplicht
      binnen vier maanden na die verkrijging daarvan melding te doen bij de inspecteur;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.83a
  - number: 8.83a.1.b
    text: |-
      van een onroerende zaak het genot krachtens eigendom, bezit of beperkt recht heeft, ter zake waarvan zich
      wijzigingen als bedoeld in [artikel 4.8, eerste lid][ref1], hebben voorgedaan, verplicht binnen vier maanden nadat
      die wijzigingen zich hebben voorgedaan hiervan melding te doen bij de inspecteur;


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel4
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.83a
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '4'
        hoofdstuk: IV
  - number: 8.83a.1.c
    text: |-
      bij het begin van een kalenderjaar van een onroerende zaak het genot krachtens eigendom, bezit of beperkt recht
      heeft en binnen een jaar na afloop van dat kalenderjaar geen aanslag heeft ontvangen, verplicht hiervan melding te
      doen bij de inspecteur binnen vier maanden na afloop van dat jaar.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.83a
  - number: 8.83a.2
    text: |-
      Ingeval meerdere personen of lichamen van een onroerende zaak het genot krachtens eigendom, bezit of beperkt recht
      hebben kan een van hen als vertegenwoordiger de meldingen doen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.83a
  - number: 8.83a.3
    text: 'De meldingen bevatten in ieder geval de volgende informatie:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.83a
  - number: 8.83a.3.a
    text: |-
      de naam, het adres en, indien personen of lichamen die het genot krachtens eigendom, bezit of beperkt recht van
      de onroerende zaak hebben op de BES eilanden wonen, onderscheidenlijk zijn gevestigd, een al dan niet fiscaal
      identificatienummer van die personen, onderscheidenlijk lichamen;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.83a
  - number: 8.83a.3.b
    text: de datum waarop het genot krachtens eigendom, bezit of beperkt recht van de onroerende zaak aanvangt;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.83a
  - number: 8.83a.3.c
    text: krachtens welk recht er het genot van de onroerende zaak is;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.83a
  - number: 8.83a.3.d
    text: het adres van de onroerende zaak; en
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.83a
  - number: 8.83a.3.e
    text: |-
      een indicatieve waarde van de onroerende zaak, dan wel een indicatie van de wijziging van de waarde die zich
      die zich als gevolg van een wijziging van de onroerende zaak als bedoeld in het eerste lid, onderdeel b, heeft
      voorgedaan.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.83a
  - number: 8.83a.4
    text: |-
      Ingeval de aanslag niet of tot een te laag bedrag is vastgesteld omdat niet tijdig is voldaan aan de
      meldingsplicht, kan de inspecteur gelijktijdig met de vaststelling van de aanslag een bestuurlijke boete van ten
      hoogste 100 percent van het bedrag van de aanslag opleggen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.83a
  - number: 8.84.1
    text: |-
      De gegevens en inlichtingen dienen duidelijk, stellig en zonder voorbehoud te worden verstrekt, mondeling,
      schriftelijk of op andere wijze, zulks naar keuze van de inspecteur, en binnen een door de inspecteur te stellen
      termijn. De gevraagde gegevens en inlichtingen dienen kosteloos te worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.84
  - number: 8.84.2
    text: |-
      Toegelaten moet worden dat kopieën, leesbare afdrukken of uittreksels worden gemaakt van de voor de raadpleging
      beschikbaar gestelde gegevensdragers of de inhoud daarvan. Indien het maken van kopieën of leesbare afdrukken niet
      ter plaatse kan geschieden, is de inspecteur bevoegd de gegevensdragers voor dat doel voor korte tijd mee te nemen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.84
  - number: 8.84.3
    text: |-
      Inzage in gegevensdragers dient te worden verleend op het kantoor van de inspecteur binnen een door hem te stellen
      termijn. De inspecteur kan akkoord gaan met inzage op een andere plaats, voor zover dat de voortgang van het
      onderzoek niet belemmert.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.84
  - number: 8.85.1
    text: |-
      Degene die een gebouw of grond in gebruik heeft, is verplicht ten behoeve van een ingevolge de belastingwet te
      verrichten onderzoek de inspecteur en de door deze aangewezen deskundigen desgevraagd toegang te verlenen tot alle
      gedeelten van dat gebouw of van die grond.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.85
  - number: 8.85.2
    text: |-
      De gevraagde toegang wordt verleend, tussen acht uur ’s ochtends en zes uur ’s avonds, met uitzondering van
      zaterdagen, zondagen en algemeen erkende feestdagen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.85
  - number: 8.85.3
    text: |-
      Indien het gebouw of de grond wordt gebruikt voor het uitoefenen van een bedrijf of een zelfstandig beroep wordt
      de gevraagde toegang mede verleend tijdens de uren waarin het gebruik voor de uitoefening van dat bedrijf of
      zelfstandig beroep daadwerkelijk plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.85
  - number: 8.85.4
    text: |-
      De gebruiker van het gebouw of de grond is verplicht desgevorderd aanwijzingen te geven die voor het onderzoek
      nodig zijn.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.85
  - number: 8.85.5
    text: |-
      De tot de toegang bevoegde personen treden een woning zonder de uitdrukkelijke toestemming van de bewoner niet
      binnen dan met inachtneming van het bepaalde in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.85
  - number: 8.85.6
    text: |-
      Op het binnentreden in woningen is [titel X van het Derde Boek van het Wetboek van Strafvordering BES][ref1] van
      overeenkomstige toepassing, met uitzondering van de [artikelen 155, vierde lid][ref2], [156, tweede lid][ref3],
      [157, tweede en derde lid][ref4], [158, eerste lid][ref5], en [160, eerste lid][ref6], en met dien verstande dat
      de machtiging wordt verleend door de procureur generaal, de officier van justitie dan wel een hulpofficier van
      justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0028681
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel155
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel156
      [ref4]: https://wetten.overheid.nl/BWBR0028681#Artikel157
      [ref5]: https://wetten.overheid.nl/BWBR0028681#Artikel158
      [ref6]: https://wetten.overheid.nl/BWBR0028681#Artikel160
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.85
    references:
      - id: ref1
        bwb_id: BWBR0028681
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '155'
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '156'
      - id: ref4
        bwb_id: BWBR0028681
        artikel: '157'
      - id: ref5
        bwb_id: BWBR0028681
        artikel: '158'
      - id: ref6
        bwb_id: BWBR0028681
        artikel: '160'
  - number: 8.86.1
    text: 'Administratieplichtigen zijn:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.86
  - number: 8.86.1.a
    text: natuurlijke personen die een bedrijf of beroep uitoefenen;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.86
  - number: 8.86.1.b
    text: natuurlijke personen die inhoudingsplichtig zijn;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.86
  - number: 8.86.1.c
    text: lichamen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.86
  - number: 8.86.2
    text: |-
      Administratieplichtigen zijn gehouden van hun vermogenstoestand en van alles betreffende hun bedrijf naar de eisen
      van dat bedrijf op zodanige wijze een administratie te voeren en de daartoe behorende gegevensdragers op zodanige
      wijze te bewaren, dat te allen tijde hun rechten en verplichtingen alsmede de voor de heffing van de belasting
      overigens van belang zijnde gegevens hieruit duidelijk blijken.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.86
  - number: 8.86.3
    text: |-
      De administratie behoort te worden gevoerd in het Nederlands, Papiaments of Engels met gebruikmaking van de daarbij
      gebruikelijke cijfers.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.86
  - number: 8.86.4
    text: Tot de administratie behoort hetgeen ingevolge de belastingwet wordt vastgelegd.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.86
  - number: 8.86.5
    text: |-
      De inrichting, het bijhouden en bewaren van de administratie dient controle daarvan door de inspecteur binnen
      een redelijke termijn mogelijk te maken. De administratieplichtige verleent de hiervoor benodigde medewerking en
      verschaft het nodige inzicht in de opzet en de werking van de administratie.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.86
  - number: 8.86.6
    text: |-
      Administratieplichtigen zijn verplicht hun administratie en de daartoe behorende gegevensdragers gedurende zeven
      jaar te bewaren.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.86
  - number: 8.86.7
    text: |-
      De administratieplichtige die de gevorderde gegevensdragers of de inhoud daarvan, niet of slechts ten dele
      ter inzage verstrekt, wordt geacht niet volledig te hebben voldaan aan een op grond van dit artikel opgelegde
      verplichting tenzij aannemelijk wordt gemaakt dat de afwezigheid of onvolledigheid van de gegevensdragers of de
      inhoud ervan het gevolg is van overmacht.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.86
  - number: 8.86.8
    text: Iedere administratieplichtige is gehouden bij de inspecteur een identificatienummer aan te vragen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.86
  - number: 8.86.9
    text: |-
      De inspecteur kent op verzoek van een belanghebbende aan deze een identificatienummer toe, dan wel maakt aan
      de belanghebbende op diens verzoek een reeds toegekend identificatienummer bekend. De belanghebbende is ter
      vaststelling van zijn identiteit gehouden een geldig paspoort, geldige identiteitskaart dan wel geldig rijbewijs
      ter inzage te verstrekken.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.86
  - number: 8.87.1
    text: |-
      Met betrekking tot administratieplichtigen als bedoeld in [artikel 8.86, eerste lid][ref1], zijn de in de
      [artikelen 8.83][ref2], [8.84][ref3], [8.85][ref4] en [8.86][ref5], omschreven verplichtingen van overeenkomstige
      toepassing ten behoeve van de belastingheffing van derden en de heffing van de belasting waarvan de inhouding aan
      hen is opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.87
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
      - id: ref3
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
      - id: ref4
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
      - id: ref5
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
  - number: 8.87.2
    text: |-
      Administratieplichtigen zijn gehouden binnen drie maanden na afloop van het kalenderjaar aan de inspecteur een
      opgave te verstrekken betreffende derden die in dat kalenderjaar bij of voor de administratieplichtige, anders dan
      in dienstbetrekking, werkzaamheden of diensten hebben verricht, met uitzondering van andere administratieplichtigen
      die bij of voor de administratieplichtige werkzaamheden of diensten hebben verricht.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.87
  - number: 8.87.3
    text: |-
      Administratieplichtigen zijn gehouden binnen drie maanden na afloop van het kalenderjaar aan de inspecteur een
      opgave te verstrekken betreffende de personen die in dat kalenderjaar bij of voor de administratieplichtige in
      dienstbetrekking zijn geweest.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.87
  - number: 8.87.4
    text: |-
      De in het tweede en derde lid genoemde opgaaf moet worden gedaan op een formulier dat bij de inspecteur
      verkrijgbaar is.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.87
  - number: 8.87.5
    text: |-
      Onverminderd de verplichtingen, bedoeld in het eerste tot en met vierde lid, zijn de bij of krachtens de
      belastingwet aan te wijzen administratieplichtigen gehouden de bij of krachtens de belastingwet aan te wijzen
      gegevens en inlichtingen waarvan de kennisneming voor de heffing van de belasting van belang kan zijn eigener
      beweging te verstrekken aan de inspecteur volgens bij of krachtens de belastingwet te stellen regels.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.87
  - number: 8.87a.1
    text: |-
      Elk op de BES eilanden gevestigd lichaam is gehouden jaarlijks binnen negen maanden na afloop van het boekjaar
      een door de bestuurder van het lichaam gewaarmerkt afschrift van de jaarrekening, bestaande uit een balans, winst-
      en verliesrekening en toelichting op deze stukken, bij de inspecteur in te dienen. De eerste zin is eveneens
      van toepassing op een lichaam dat op grond van [artikel 5.2][ref1] geacht wordt in Nederland te zijn gevestigd,
      alsmede op een lichaam dat niet op de BES eilanden is gevestigd en een onderneming drijft met behulp van een op de
      BES eilanden aanwezige vaste inrichting of met behulp van een op de BES eilanden woonachtige of gevestigde vaste
      vertegenwoordiger.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel5
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.87a
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '5'
        hoofdstuk: V
  - number: 8.87a.2
    text: |-
      De jaarrekening wordt opgesteld volgens de bepalingen van
      [artikel 15 van Boek 2 van het Burgerlijk Wetboek BES][ref1], dan wel volgens soortgelijke buitenlandse
      regelingen. Onze Minister kan nadere regels geven voor de opstelling van de jaarrekening.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel15
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.87a
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '15'
  - number: 8.87a.3
    text: De inspecteur reikt tegen ontvangst van de jaarrekening een ontvangstbewijs uit.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.87a
  - number: 8.87a.4
    text: De inspecteur kan onder door hem te stellen voorwaarden uitstel voor het indienen van de jaarrekening verlenen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.87a
  - number: 8.88.1
    text: |-
      Voor een weigering om te voldoen aan de in de [artikelen 8.83][ref1], [8.84][ref2], [8.85][ref3], [8.86][ref4] en
      [8.87][ref5] omschreven verplichtingen kan niemand zich beroepen op de omstandigheid dat hij uit enigerlei hoofde
      tot geheimhouding verplicht is, zelfs niet indien deze hem bij een wet is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.88
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
      - id: ref3
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
      - id: ref4
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
      - id: ref5
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
  - number: 8.88.2
    text: |-
      Voor een weigering om te voldoen aan de in de [artikelen 8.83][ref1] en [8.84][ref2] omschreven verplichtingen
      kan niemand zich met vrucht beroepen op de vertrouwelijkheid van zijn contacten met een verschoningsgerechtigde
      als bedoeld in het derde lid voor zover het gegevens, inlichtingen en andere gegevensdragers of de inhoud daarvan
      betreft waarover diegene ook zonder die vertrouwelijke contacten beschikt of redelijkerwijs kan beschikken.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.88
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
  - number: 8.88.3
    text: |-
      Voor een weigering om te voldoen aan de verplichtingen ten aanzien van derden als bedoeld in
      [artikel 8.87, eerste lid][ref1], kunnen alleen geestelijken, notarissen, advocaten, artsen en apothekers zich
      beroepen op de omstandigheid dat zij uit hoofde van hun stand, ambt of beroep tot geheimhouding verplicht zijn,
      voor zover het betreft hetgeen aan hen in die hoedanigheid is toevertrouwd of door hen in die hoedanigheid is
      meegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.88
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
  - number: 8.89.1
    text: Voor het onderzoek van gegevensdragers kunnen door de inspecteur deskundigen en tolken worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.89
  - number: 8.89.2
    text: |-
      Alvorens zijn taak te aanvaarden legt de deskundige of de tolk in handen van de gezaghebber de eed of belofte af,
      dat hij de hem op te dragen werkzaamheden eerlijk, nauwgezet en naar zijn beste weten zal verrichten.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.89
  - number: 8.89.3
    text: |-
      Aan de in het eerste lid bedoelde deskundigen en tolken kan een vergoeding worden toegekend volgens bij of
      krachtens algemene maatregel van bestuur te stellen regels.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.89
  - number: 8.89a.1
    text: |-
      Administratieplichtigen zijn gehouden ter zake van levering van goederen en het voor derden verrichten van
      werkzaamheden of diensten een factuur uit te reiken en een kopie daarvan te bewaren. Deze factuur dient doorlopend
      genummerd en gedagtekend te zijn en dient op duidelijke en overzichtelijke wijze te bevatten:
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.89a
  - number: 8.89a.1.a
    text: de datum waarop de levering, de werkzaamheid of de dienst is verricht;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.89a
  - number: 8.89a.1.b
    text: |-
      een omschrijving van de aard en de hoeveelheid van de goederen, werkzaamheden of diensten die zijn geleverd of zijn
      verricht, alsmede het ter zake daarvan in rekening gebrachte bedrag en het bedrag aan algemene bestedingsbelasting;
      en
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.89a
  - number: 8.89a.1.c
    text: |-
      de naam, het adres en het door de Belastingdienst toegekende registratienummer van degene die de levering, de
      werkzaamheid of de dienst heeft verricht alsmede, indien dit een administratieplichtige is, van degene aan wie de
      levering, de werkzaamheid of de dienst is verricht.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.89a
  - number: 8.89a.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld voor de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.89a
  - number: 8.90.1
    text: |-
      De [artikelen 8.83][ref1], [8.84][ref2] en [8.87][ref3] zijn van overeenkomstige toepassing ten behoeve van de
      invordering van de belastingschuldige en aansprakelijk gestelde.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.90
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
      - id: ref3
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
  - number: 8.90.2
    text: 'Voor de inspecteur wordt gelezen: de ontvanger, en voor de belastingheffing: de invordering.'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.90
  - number: 8.91.1
    text: |-
      Onze Ministers, openbare lichamen en rechtspersonen die bij of krachtens een bijzondere wet rechtspersoonlijkheid
      hebben verkregen, de onder hen ressorterende instellingen en diensten, alsmede lichamen die hoofdzakelijk
      uitvoering geven aan het beleid van het Rijk, verschaffen, mondeling, schriftelijk of op andere wijze – zulks ter
      keuze van de inspecteur – de gegevens en inlichtingen, en wel kosteloos, die hun door de inspecteur ter uitvoering
      van de belastingwet worden gevraagd.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.91
  - number: 8.91.2
    text: Onze Minister kan, op schriftelijk verzoek, ontheffing verlenen van de in het eerste lid omschreven verplichting.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.91
  - number: 8.92.1
    text: |-
      Degene die bezwaar heeft tegen een hem opgelegde belastingaanslag of tegen een ingevolge de belastingwet
      door de inspecteur genomen voor bezwaar vatbare beschikking, kan binnen twee maanden na de dagtekening van
      het aanslagbiljet of van het ter post bezorgde of uitgereikte afschrift van de beschikking een gemotiveerd
      bezwaarschrift indienen bij de inspecteur. De inspecteur tekent onverwijld de datum van ontvangst aan op het
      bezwaarschrift. De inspecteur zendt de indiener onverwijld een bewijs van ontvangst, waarin die datum is vermeld.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.92
  - number: 8.92.2
    text: |-
      Degene die bezwaar heeft tegen het bedrag dat als belasting door hem op aangifte is voldaan of afgedragen of
      dat als belasting door een inhoudingsplichtige van hem is ingehouden, kan binnen twee maanden na de betaling
      respectievelijk de inhouding een gemotiveerd bezwaarschrift indienen bij de inspecteur.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.92
  - number: 8.92.3
    text: |-
      Hij die bezwaar heeft tegen meer dan één belastingaanslag of voor bezwaar vatbare beschikking kan daartegen bezwaar
      maken bij één bezwaarschrift.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.92
  - number: 8.92.4
    text: |-
      Indien de bedragen van een belastingaanslag en van een voor bezwaar vatbare beschikking waarbij een bestuurlijke
      boete wordt opgelegd op één aanslagbiljet zijn vermeld, wordt een bezwaarschrift tegen een belastingaanslag geacht
      mede te zijn gericht tegen de boete, tenzij uit het bezwaarschrift het tegendeel blijkt.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.92
  - number: 8.93.1
    text: De inspecteur doet uitspraak op het bezwaarschrift.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.93
  - number: 8.93.2
    text: |-
      Met een uitspraak wordt gelijkgesteld het weigeren dan wel niet tijdig doen van de uitspraak. Een uitspraak
      wordt geacht niet tijdig te zijn gedaan indien de inspecteur niet binnen negen maanden na ontvangst van het
      bezwaarschrift een uitspraak heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.93
  - number: 8.93.3
    text: |-
      Indien de belanghebbende in zijn bezwaarschrift het verlangen daartoe te kennen geeft, wordt hij vóór de uitspraak
      door de inspecteur gehoord. Alle oproepingen worden gedaan op een termijn van ten minste zeven dagen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.93
  - number: 8.93.4
    text: Indien niet of niet volledig aan het bezwaar wordt tegemoet gekomen, wordt de uitspraak gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.93
  - number: 8.93.5
    text: |-
      Indien het bezwaar is gericht tegen een belastingaanslag met betrekking tot welke ten onrechte de vereiste aangifte
      niet is gedaan of niet volledig is voldaan aan de verplichting ingevolge de [artikelen 8.83][ref1], [8.84][ref2],
      [8.85][ref3] en [8.86][ref4] wordt de belastingaanslag gehandhaafd, tenzij gebleken is dat, en zo ja in hoeverre,
      deze onjuist is.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.93
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
      - id: ref3
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
      - id: ref4
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
  - number: 8.94.1
    text: |-
      De inspecteur kan de termijn voor het doen van een uitspraak als bedoeld in [artikel 8.93, tweede lid][ref1],
      verlengen met ten hoogste negen maanden indien:


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.94
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '1'
  - number: 8.94.1.a
    text: |-
      de belanghebbende niet of niet volledig voldoet aan het verzoek van de inspecteur gegevensdragers, of de
      inhoud daarvan, waarvan de inzage van belang kan zijn voor de afhandeling van het bezwaarschrift, voor dit doel
      beschikbaar te stellen;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.94
  - number: 8.94.1.b
    text: |-
      de belanghebbende niet of niet volledig voldoet aan het verzoek van de inspecteur gegevens en inlichtingen te
      verstrekken welke voor de afhandeling van het bezwaarschrift van belang kunnen zijn;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.94
  - number: 8.94.1.c
    text: |-
      de inspecteur met betrekking tot het geschil waartegen het bezwaar is gericht, de uitkomst van een vergelijkbare
      procedure door het Gerecht in eerste aanleg wil afwachten;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.94
  - number: 8.94.1.d
    text: |-
      de inspecteur een verzoek om inlichtingen, welke voor de afhandeling van het bezwaarschrift van belang kan zijn,
      aan een bevoegde autoriteit van een andere staat heeft gedaan;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.94
  - number: 8.94.1.e
    text: |-
      een boekenonderzoek, ingesteld door de rijksbelastingdienst, welke voor de afhandeling van het bezwaarschrift van
      belang kan zijn, nog niet is afgerond.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.94
  - number: 8.94.2
    text: |-
      Van een verlenging van de termijn voor het doen van uitspraak stelt de inspecteur de belanghebbende schriftelijk in
      kennis. De inspecteur is gehouden om, zodra dat in redelijkheid van hem verwacht kan worden, uitspraak te doen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.94
  - number: 8.95.1
    text: Voor de behandeling van het bezwaar is geen recht verschuldigd.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.95
  - number: 8.95.2
    text: |-
      De kosten die de belastingplichtige in verband met de behandeling van het bezwaar redelijkerwijs heeft moeten
      maken, worden ten laste van ‘s Rijks schatkist uitsluitend vergoed op verzoek van de belastingplichtige, voor
      zover de belastingaanslag of de voor bezwaar vatbare beschikking wordt herroepen wegens aan de inspecteur te wijten
      onrechtmatigheid.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.95
  - number: 8.95.3
    text: |-
      Het verzoek wordt gedaan voordat de inspecteur op het bezwaar heeft beslist. De inspecteur beslist op het verzoek
      bij de beslissing op het bezwaar.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.95
  - number: 8.95.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de kosten waarop de
      vergoeding, bedoeld in het eerste lid, uitsluitend betrekking kan hebben en de wijze waarop het bedrag van de
      kosten wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.95
  - number: '8.96'
    text: |-
      De verplichting tot betaling wordt niet geschorst door de indiening van een bezwaarschrift inzake een
      belastingaanslag.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.96
  - number: 8.101.1
    text: De belanghebbende kan tegen een uitspraak op bezwaar beroep instellen bij het Gerecht in eerste aanleg.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.101
  - number: 8.101.2
    text: De termijn voor het instellen van beroep bedraagt twee maanden na dagtekening van de uitspraak op bezwaar.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.101
  - number: 8.101.3
    text: 'Het beroep kan slechts worden ingesteld door:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.101
  - number: 8.101.3.a
    text: de belanghebbende aan wie de belastingaanslag is opgelegd;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.101
  - number: 8.101.3.b
    text: de belanghebbende die de belasting op aangifte heeft voldaan of afgedragen of van wie de belasting is ingehouden;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.101
  - number: 8.101.3.c
    text: degene tot wie de voor bezwaar vatbare beschikking zich richt, of
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.101
  - number: 8.101.3.d
    text: |-
      degene van wie inkomens- of vermogensbestanddelen zijn begrepen in het voorwerp van belasting waarop de
      belastingaanslag of de voor bezwaar vatbare beschikking betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.101
  - number: 8.101.4
    text: |-
      De inspecteur stelt de in het derde lid bedoelde belanghebbende desgevraagd op de hoogte van de gegevens met
      betrekking tot de belastingaanslag of de beschikking voor zover deze gegevens voor het instellen van beroep of het
      maken van bezwaar redelijkerwijs van belang kunnen worden geacht.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.101
  - number: 8.101.5
    text: Het Gerecht in eerste aanleg bevestigt de ontvangst van het beroepschrift schriftelijk.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.101
  - number: '8.102'
    text: De verplichting tot betaling wordt niet geschorst door het instellen van beroep.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.102
  - number: 8.102a.1
    text: |-
      Zaken die bij het Gerecht in eerste aanleg aanhangig worden gemaakt, worden in behandeling genomen door een
      enkelvoudige kamer.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.102a
  - number: 8.102a.2
    text: De enkelvoudige kamer kan een zaak naar een meervoudige kamer verwijzen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.102a
  - number: 8.102a.3
    text: |-
      Verwijzing kan geschieden in elke stand van het geding. Een verwezen zaak wordt voortgezet in de stand waarin zij
      zich bevindt.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.102a
  - number: 8.102b.1
    text: |-
      De voorschriften omtrent de behandeling van het beroep zijn op de behandeling zowel door een enkelvoudige als door
      een meervoudige kamer van toepassing.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.102b
  - number: 8.102b.2
    text: |-
      Degene die zitting heeft in een enkelvoudige kamer heeft tevens de bevoegdheden en de verplichtingen die de
      voorzitter van een meervoudige kamer heeft.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.102b
  - number: 8.103.1
    text: Het instellen van beroep geschiedt door het indienen van een beroepschrift bij het Gerecht in eerste aanleg.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.103
  - number: 8.103.2
    text: 'Het beroepschrift wordt ondertekend en bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.103
  - number: 8.103.2.a
    text: de naam en het adres van de indiener;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.103
  - number: 8.103.2.b
    text: de dagtekening;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.103
  - number: 8.103.2.c
    text: een omschrijving van de belastingaanslag of de beschikking waartegen het beroep is gericht;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.103
  - number: 8.103.2.d
    text: de gronden van het beroep.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.103
  - number: 8.103.3
    text: |-
      Bij het beroepschrift wordt zo mogelijk een afschrift van de belastingaanslag of beschikking en de uitspraak op
      bezwaar overgelegd.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.103
  - number: 8.103.4
    text: |-
      Het beroep kan niet-ontvankelijk worden verklaard, indien niet is voldaan aan een in dit artikel of in enig ander
      in deze wet gesteld vereiste voor het in behandeling nemen van het beroepschrift, mits de indiener de gelegenheid
      heeft gehad het verzuim te herstellen binnen een hem daartoe gestelde termijn.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.103
  - number: 8.103.5
    text: |-
      Ten aanzien van een na afloop van de termijn ingediend beroepschrift blijft niet-ontvankelijkverklaring op grond
      daarvan achterwege indien redelijkerwijs niet kan worden geoordeeld dat de indiener in verzuim is geweest.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.103
  - number: 8.103.6
    text: Hij die beroep instelt tegen meer dan één uitspraak kan dat doen bij één beroepschrift.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.103
  - number: 8.103.7
    text: |-
      [Artikel 8.92, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.103
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '1'
  - number: 8.104.1
    text: |-
      Van de indiener van het beroepschrift wordt ten behoeve van ’s Rijks schatkist een griffierecht geheven ten bedrage
      van USD 30.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.104
  - number: 8.104.2
    text: |-
      De griffier wijst de indiener van het beroepschrift op de verschuldigdheid van het griffierecht en deelt hem mee
      dat het griffierecht binnen zes weken na de verzending van zijn mededeling dient te zijn betaald aan het Gerecht in
      eerste aanleg.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.104
  - number: 8.104.3
    text: |-
      Indien het griffierecht niet tijdig is betaald, wordt het beroep niet-ontvankelijk verklaard, tenzij redelijkerwijs
      niet kan worden geoordeeld dat de indiener van het beroepschrift in verzuim is geweest.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.104
  - number: 8.104.4
    text: |-
      Indien het Gerecht in eerste aanleg het beroep geheel of gedeeltelijk gegrond verklaart, vergoedt de inspecteur het
      door de indiener van het beroepschrift betaalde griffierecht.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.104
  - number: 8.104a
    text: De griffier zendt zo spoedig mogelijk een kopie van alle door een partij toegezonden stukken aan de wederpartij.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.104a
  - number: 8.105.1
    text: |-
      Binnen vier weken na verzending van het beroepschrift aan de inspecteur zendt deze de op de zaak betrekking
      hebbende stukken aan het Gerecht in eerste aanleg en dient hij een verweerschrift in.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.105
  - number: 8.105.2
    text: Het Gerecht in eerste aanleg kan de in het eerste lid bedoelde termijn verlengen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.105
  - number: '8.106'
    text: |-
      Het Gerecht in eerste aanleg kan de indiener van het beroepschrift in de gelegenheid stellen schriftelijk te
      repliceren. In dat geval wordt de inspecteur in de gelegenheid gesteld schriftelijk te dupliceren. Het Gerecht in
      eerste aanleg stelt de termijnen voor repliek en dupliek vast.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.106
  - number: 8.106a
    text: |-
      Het Gerecht in eerste aanleg kan onmiddellijk uitspraak doen indien een nader onderzoek het Gerecht niet nodig
      voorkomt, omdat:
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.106a
  - number: 8.106a.a
    text: het beroep kennelijk niet-ontvankelijk is;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.106a
  - number: 8.106a.b
    text: het beroep kennelijk ongegrond is;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.106a
  - number: 8.106a.c
    text: het beroep kennelijk gegrond is, of
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.106a
  - number: 8.106a.d
    text: de inspecteur kennelijk aan de bezwaren van de belanghebbende tegemoet is gekomen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.106a
  - number: 8.106b.1
    text: |-
      Tegen de in [artikel 8.106a][ref1] bedoelde uitspraak kunnen partijen schriftelijk verzet doen bij het Gerecht in
      eerste aanleg. [Artikel 8.103][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.106b
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '3'
  - number: 8.106b.2
    text: |-
      Alvorens een uitspraak te doen op het verzet, kan het Gerecht in eerste aanleg de partij die het verzet deed in
      de gelegenheid stellen te worden gehoord. Is het Gerecht in eerste aanleg van oordeel dat het verzet ongegrond
      is, dan gaat het niet tot ongegrondverklaring over dan na de indiener van het verzetschrift die daarom vroeg in de
      gelegenheid te hebben gesteld te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.106b
  - number: 8.106b.3
    text: |-
      Is het Gerecht in eerste aanleg van oordeel dat het verzet gegrond is, dan vervalt de in [artikel 8.106a][ref1]
      bedoelde uitspraak en wordt de zaak alsnog in behandeling genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.106b
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '3'
  - number: 8.107.1
    text: |-
      Zodra het verweerschrift of de dupliek is ingediend, dan wel de termijn daarvoor is verstreken, worden partijen ten
      minste zes weken van tevoren uitgenodigd om op een in de uitnodiging te vermelden plaats en tijdstip op een zitting
      van het Gerecht in eerste aanleg te verschijnen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.107
  - number: 8.107.2
    text: |-
      Als partijen daarvoor toestemming hebben verleend, kan het Gerecht in eerste aanleg bepalen dat het onderzoek ter
      zitting achterwege blijft.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.107
  - number: 8.107.3
    text: |-
      Tot tien dagen voor de zitting kunnen partijen nadere stukken indienen. Op deze bevoegdheid worden partijen in de
      uitnodiging gewezen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.107
  - number: 8.107.4
    text: |-
      Behoudens voor zover het beroep is gericht tegen een uitspraak waarbij een boete geheel of gedeeltelijk is
      gehandhaafd, vindt het onderzoek ter zitting plaats met gesloten deuren. Het Gerecht in eerste aanleg kan bepalen
      dat het onderzoek openbaar is, mits de belangen van partijen daardoor niet worden geschaad.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.107
  - number: 8.108.1
    text: Partijen kunnen zich laten bijstaan of door een gemachtigde laten vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.108
  - number: 8.108.2
    text: |-
      Het Gerecht in eerste aanleg kan een partij oproepen om in persoon dan wel in persoon of bij gemachtigde te
      verschijnen, al dan niet voor het geven van inlichtingen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.108
  - number: 8.108.3
    text: |-
      Partijen die door het Gerecht in eerste aanleg zijn opgeroepen om in persoon dan wel in persoon of bij gemachtigde
      te verschijnen, al dan niet voor het geven van inlichtingen, zijn verplicht te verschijnen en de verlangde
      inlichtingen te geven. Partijen worden hierop gewezen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.108
  - number: 8.108.4
    text: |-
      Indien een partij niet voldoet aan de verplichting te verschijnen of inlichtingen te verstrekken, kan het Gerecht
      in eerste aanleg daaruit de gevolgtrekkingen maken die hem geraden voorkomen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.108
  - number: 8.109.1
    text: Het Gerecht in eerste aanleg kan getuigen oproepen en deskundigen en tolken benoemen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.109
  - number: 8.109.2
    text: |-
      De opgeroepen getuige en de deskundige of de tolk die zijn benoeming heeft aanvaard en door het Gerecht in eerste
      aanleg wordt opgeroepen, zijn verplicht aan de oproeping gevolg te geven. In de oproeping van de deskundige wordt
      vermeld de opdracht die moet worden vervuld, en de plaats en het tijdstip waarop de opdracht moet worden vervuld.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.109
  - number: 8.109.3
    text: |-
      Namen en woonplaatsen van de opgeroepen getuigen en deskundigen en de feiten waarop het horen betrekking zal hebben
      onderscheidenlijk de opdracht die moet worden vervuld, worden bij de uitnodiging, bedoeld in [artikel 8.107][ref1],
      aan partijen zo veel mogelijk medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.109
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '3'
  - number: 8.109.4
    text: |-
      Alvorens zijn taak te aanvaarden legt de deskundige of tolk de eed of belofte af, dat hij de hem opgedragen
      werkzaamheden eerlijk, nauwgezet en naar beste weten zal verrichten en geheim zal houden, wat geheim behoort te
      blijven.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.109
  - number: 8.109.5
    text: |-
      Aan door het Gerecht in eerste aanleg opgeroepen deskundigen en tolken worden een vergoeding toegekend volgens bij
      of krachtens algemene maatregel van bestuur te stellen regels.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.109
  - number: 8.110.1
    text: |-
      Partijen kunnen getuigen en deskundigen meebrengen of bij aangetekende brief of deurwaardersexploit oproepen,
      mits daarvan uiterlijk een week voor de dag van de zitting aan het Gerecht in eerste aanleg mededeling is gedaan,
      met vermelding van namen en woonplaatsen. Op deze bevoegdheid worden partijen in de uitnodiging, bedoeld in
      [artikel 8.107][ref1], gewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.110
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '3'
  - number: 8.110.2
    text: |-
      Het Gerecht in eerste aanleg kan afzien van het horen van door een partij meegebrachte of opgeroepen getuigen en
      deskundigen indien hij van oordeel is dat dit redelijkerwijs niet kan bijdragen aan de beoordeling van de zaak.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.110
  - number: 8.111.1
    text: |-
      Het Gerecht in eerste aanleg kan het onderzoek ter zitting schorsen. Indien bij de schorsing geen
      tijdstip van een nadere zitting is bepaald, bepaalt het Gerecht in eerste aanleg dit zo spoedig mogelijk.
      [Artikel 8.107, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.111
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '3'
  - number: 8.111.2
    text: Het Gerecht in eerste aanleg sluit het onderzoek, wanneer hij van oordeel is dat het is voltooid.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.111
  - number: 8.111.3
    text: Zodra het onderzoek is gesloten, deelt de voorzitter mee wanneer uitspraak gedaan zal worden.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.111
  - number: 8.111.4
    text: |-
      Indien het Gerecht in eerste aanleg van oordeel is dat het onderzoek ter zitting niet volledig is geweest, kan
      hij het onderzoek heropenen. Het Gerecht in eerste aanleg bepaalt daarbij op welke wijze het onderzoek wordt
      voortgezet.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.111
  - number: 8.111.5
    text: |-
      De griffier doet zo spoedig mogelijk mededeling aan partijen van de heropening van het onderzoek en de wijze waarop
      dit wordt voortgezet.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.111
  - number: 8.112.1
    text: |-
      Tenzij mondeling uitspraak wordt gedaan, doet het Gerecht in eerste aanleg binnen zes weken na de sluiting van het
      onderzoek schriftelijk uitspraak. In bijzondere omstandigheden kan het Gerecht in eerste aanleg deze termijn met
      ten hoogste zes weken verlengen, van welke verlenging mededeling wordt gedaan aan partijen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.112
  - number: 8.112.2
    text: 'De schriftelijke uitspraak vermeldt:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.112
  - number: 8.112.2.a
    text: de namen van partijen en van hun vertegenwoordigers of gemachtigden;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.112
  - number: 8.112.2.b
    text: de gronden van de beslissing;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.112
  - number: 8.112.2.c
    text: de beslissing;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.112
  - number: 8.112.2.d
    text: de naam van de rechter of de namen van de rechters die de zaak heeft onderscheidenlijk hebben behandeld; en
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.112
  - number: 8.112.2.e
    text: de dag waarop de beslissing is uitgesproken.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.112
  - number: 8.112.3
    text: |-
      De uitspraak wordt ondertekend door de voorzitter en de griffier. Bij verhindering van de voorzitter of de griffier
      wordt dit in de uitspraak vermeld.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.112
  - number: 8.112.4
    text: |-
      Het Gerecht in eerste aanleg spreekt de beslissing, bedoeld in het tweede lid, onderdeel c, in het openbaar uit, in
      tegenwoordigheid van de griffier.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.112
  - number: 8.113.1
    text: |-
      Het Gerecht in eerste aanleg kan na de sluiting van het onderzoek ter zitting onmiddellijk mondeling uitspraak
      doen. De uitspraak kan voor ten hoogste twee weken worden verdaagd onder aanzegging aan partijen van het tijdstip
      van de uitspraak.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.113
  - number: 8.113.2
    text: De mondelinge uitspraak bestaat uit de beslissing en de gronden van de beslissing.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.113
  - number: 8.113.3
    text: Van de mondelinge uitspraak wordt door de griffier een proces-verbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.113
  - number: 8.113.4
    text: |-
      Het proces-verbaal van de mondelinge uitspraak wordt door de voorzitter en de griffier ondertekend. Bij
      verhindering van de voorzitter of de griffier wordt dit in het proces-verbaal vermeld.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.113
  - number: 8.113.5
    text: |-
      Het Gerecht in eerste aanleg spreekt de beslissing, bedoeld in het tweede lid, in het openbaar uit, in
      tegenwoordigheid van de griffier.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.113
  - number: '8.114'
    text: |-
      Indien het beroep is gericht tegen een belastingaanslag met betrekking tot welke ten onrechte de vereiste aangifte
      niet is gedaan, of niet volledig is voldaan aan de verplichting ingevolge de [artikelen 8.83][ref1], [8.84][ref2]
      en [8.86][ref3] verklaart het Gerecht in eerste aanleg het beroep tegen de belastingaanslag ongegrond, tenzij
      gebleken is dat, en zo ja in hoeverre, de uitspraak op bezwaar onjuist is.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.114
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
      - id: ref3
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
  - number: 8.115a.1
    text: |-
      Het Gerecht in eerste aanleg is bij uitsluiting bevoegd een partij te veroordelen in de kosten die een andere
      partij in verband met de behandeling van het beroep bij het Gerecht in eerste aanleg en van het bezwaar
      redelijkerwijs heeft moeten maken. [Artikel 8.95, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.115a
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '1'
  - number: 8.115a.2
    text: |-
      Een natuurlijk persoon kan slechts in de kosten worden veroordeeld in geval van kennelijk onredelijk gebruik van
      procesrecht.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.115a
  - number: 8.115a.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels gesteld worden over de kosten waarop een
      veroordeling als bedoeld in het eerste lid uitsluitend betrekking kan hebben en over de wijze waarop bij de
      uitspraak het bedrag van de kosten wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.115a
  - number: 8.115b.1
    text: |-
      Indien het Gerecht in eerste aanleg het beroep gegrond verklaart, kan hij, indien daarvoor gronden zijn, op verzoek
      van een partij het bestuursorgaan veroordelen tot vergoeding van de schade die die partij lijdt.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.115b
  - number: 8.115b.2
    text: |-
      Indien het Gerecht in eerste aanleg de omvang van de schadevergoeding bij zijn uitspraak niet of niet volledig kan
      vaststellen, bepaalt hij in zijn uitspraak dat ter voorbereiding van een nadere uitspraak daarover de behandeling
      van de zaak wordt heropend. Het Gerecht in eerste aanleg bepaalt daarbij op welke wijze de behandeling wordt
      voortgezet.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.115b
  - number: '8.116'
    text: |-
      Binnen twee weken na de dagtekening van de uitspraak zendt de griffier kosteloos een afschrift van de uitspraak of
      van het proces-verbaal van de mondelinge uitspraak aan partijen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.116
  - number: 8.116a.1
    text: |-
      Partijen kunnen bij het Hof hoger beroep instellen tegen een uitspraak van het Gerecht in eerste aanleg als bedoeld
      in de [artikelen 8.112][ref1] en [8.113][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.116a
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '3'
  - number: 8.116a.2
    text: |-
      De termijn voor het instellen van hoger beroep bedraagt twee maanden na de dag van de toezending van de uitspraak
      van het Gerecht in eerste aanleg overeenkomstig [artikel 8.116][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.116a
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '3'
  - number: 8.116a.3
    text: |-
      De partij die hoger beroep instelt, wordt aangeduid als appellant in hoger beroep, de wederpartij als verweerder in
      hoger beroep.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.116a
  - number: 8.116b
    text: |-
      Op het hoger beroep zijn de artikelen van [afdeling 3][ref1], met uitzondering van de [artikelen 8.102a][ref2] en
      [8.102b][ref3], van overeenkomstige toepassing, voor zover in deze afdeling niet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#HoofdstukVIII
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.116b
    references:
      - id: ref1
        bwb_id: BWBR0029244
        hoofdstuk: VIII
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '3'
  - number: 8.116c.1
    text: |-
      Van de indiener van het beroepschrift in hoger beroep wordt ten behoeve van ’s Rijks schatkist een griffierecht
      geheven ten bedrage van USD 60.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.116c
  - number: 8.116c.2
    text: |-
      De griffier wijst de indiener van het beroepschrift op de verschuldigdheid van het griffierecht en deelt hem mee
      dat het griffierecht binnen zes weken na de verzending van zijn mededeling dient te zijn betaald aan het Hof.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.116c
  - number: 8.116c.3
    text: |-
      Indien het griffierecht niet tijdig is betaald, wordt het beroep niet-ontvankelijk verklaard, tenzij redelijkerwijs
      niet kan worden geoordeeld dat de indiener van het beroepschrift in verzuim is geweest.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.116c
  - number: 8.116c.4
    text: |-
      Indien het Hof het beroep geheel of gedeeltelijk gegrond verklaart, vergoedt de inspecteur het door de indiener van
      het beroepschrift betaalde griffierecht.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.116c
  - number: 8.116d.1
    text: |-
      Het Hof bevestigt de uitspraak van het Gerecht in eerste aanleg, hetzij met overneming hetzij met verbetering van
      de gronden, of doet, met gehele of gedeeltelijke vernietiging van die uitspraak, hetgeen het Gerecht in eerste
      aanleg had behoren te doen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.116d
  - number: 8.116d.2
    text: |-
      Wanneer het Gerecht in eerste aanleg de niet-ontvankelijkheid heeft uitgesproken en het Hof deze uitspraak
      vernietigt met een ontvankelijkverklaring, wordt de zaak terugverwezen naar het Gerecht in eerste aanleg om te
      worden hervat in de stand waarin de behandeling zich bevond. Tegen de nieuwe uitspraak van het Gerecht in eerste
      aanleg staat hoger beroep open overeenkomstig deze afdeling.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.116d
  - number: 8.116d.3
    text: |-
      In de gevallen, bedoeld in het tweede lid, kan het Hof de zaak zonder terugwijzing afdoen, indien zij naar zijn
      oordeel geen nadere behandeling door het Gerecht in eerste aanleg behoeft.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.116d
  - number: '8.117'
    text: |-
      Alle rechtsvorderingen tot betaling van belastingen, alsmede alle strafvervolgingen wegens misdrijven in
      belastingzaken behoren tot de kennisneming van de rechter in eerste aanleg op de zittingsplaats, waar de ontvanger
      waaronder de belastingschuldige ressorteert is gevestigd of het misdrijf is gepleegd en in hoger beroep tot de
      kennisneming van het Hof.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.117
  - number: '8.118'
    text: |-
      Behoudens de bepalingen van deze wet worden burgerlijke rechtsvorderingen behandeld overeenkomstig
      het [Wetboek van Burgerlijke Rechtsvordering BES][ref1], strafvervolgingen overeenkomstig het
      [Wetboek van Strafvordering BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028496
      [ref2]: https://wetten.overheid.nl/BWBR0028681
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.118
    references:
      - id: ref1
        bwb_id: BWBR0028496
      - id: ref2
        bwb_id: BWBR0028681
  - number: '8.119'
    text: |-
      Waar in wettelijke regelingen ten aanzien van belastingen, bijdragen en vergoedingen op de overtreding een
      geldboete tot een bepaald bedrag als straf is gesteld, geldt dit bedrag voor de toepassing van artikel 76 van het
      Wetboek van Strafrecht BES als het daar bedoelde maximum.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.119
  - number: '8.120'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld, waardoor in aansluiting aan de
      desbetreffende bepalingen voorkomende in de wetgeving van een ander deel van het Koninkrijk of van een andere
      staat dan wel in de besluiten van een volkenrechtelijke organisatie, dubbele belasting geheel of gedeeltelijk wordt
      voorkomen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.120
  - number: 8.121.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter voorkoming van dubbele belasting in gevallen waarin
      daaromtrent niet op andere wijze is voorzien, regels worden gesteld teneinde gehele of gedeeltelijke vrijstelling
      of vermindering te verlenen van de belasting die betrekking heeft op inkomen of vermogen uit Nederland.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.121
  - number: 8.121.2
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overlegd.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.121
  - number: '8.122'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld waardoor ten aanzien van op de BES
      eilanden wonende diplomatieke, consulaire en andere vertegenwoordigers van een vreemde Mogendheid alsmede hun
      gezinsleden, de hun toegevoegde ambtenaren en de bij hen inwonende in hun dienst zijnde personen vrijstelling van
      belasting wordt verleend.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.122
  - number: '8.123'
    text: |-
      Indien een gedeelte van een inkomen wordt genoten van een internationale organisatie en dit gedeelte ingevolge
      bepalingen van internationaal recht van de heffing van belasting op de BES eilanden is vrijgesteld, wordt behoudens
      voor zover bij die bepalingen een nadere wijze van berekenen is voorgeschreven, de inkomstenbelasting verschuldigd
      over het overige gedeelte van het inkomen gesteld op het verschil tussen de belasting berekend zonder inachtneming
      van de vrijstelling en de belasting welke volgens bij of krachtens algemene maatregel van bestuur vast te stellen
      regels aan het vrijgestelde gedeelte van het inkomen dient te worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.123
  - number: 8.124.1
    text: |-
      De bepalingen van deze afdeling strekken tot uitvoering van regelingen van internationaal recht tot het verlenen
      van wederzijdse bijstand bij de heffing van belastingen, alsmede renten daarover en bestuursrechtelijke sancties en
      boeten die daarmee verband houden.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.124
  - number: 8.124.2
    text: |-
      Deze afdeling is tevens van toepassing op het verzoek tot het verlenen van wederzijdse bijstand van een bevoegde
      autoriteit van een andere staat voor zover Nederland met die staat een regeling is overeengekomen die voorziet in
      het verlenen van wederzijdse bijstand bij de heffing, alsmede renten daarover en bestuursrechtelijke sancties en
      boeten die daarmee verband houden.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.124
  - number: '8.125'
    text: |-
      Op verzoek van een bevoegde autoriteit kan Onze Minister haar de inlichtingen verstrekken waarom zij vraagt en die
      voor haar van belang kunnen zijn bij de heffing van belastingen, alsmede renten of bestuursrechtelijke sancties of
      boeten die daarmee verband houden.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.125
  - number: '8.126'
    text: |-
      Onze Minister kan in overleg met een bevoegde autoriteit gevallen of groepen van gevallen aanwijzen in welke hij
      zonder voorafgaand verzoek inlichtingen zal verstrekken, alsmede de voorwaarden bepalen waaronder de verstrekking
      zal geschieden.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.126
  - number: '8.127'
    text: |-
      Onze Minister kan een bevoegde autoriteit uit eigen beweging inlichtingen verstrekken die voor haar van belang
      kunnen zijn bij de bepaling van een belastingschuld in de gevallen waarin:
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.127
  - number: 8.127.a
    text: |-
      vermoed wordt dat in de staat van de bevoegde autoriteit ten onrechte een vermindering, ontheffing, teruggaaf of
      vrijstelling van belasting zou worden verleend dan wel heffing van belasting ten onrechte achterwege zou blijven
      ingeval de inlichtingen niet zouden zijn verstrekt;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.127
  - number: 8.127.b
    text: |-
      op de BES eilanden een vermindering, ontheffing, teruggaaf of vrijstelling van belasting is verleend die van
      invloed kan zijn op de belastingheffing in de staat van die bevoegde autoriteit;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.127
  - number: 8.127.c
    text: |-
      op de BES eilanden rechtshandelingen of andere handelingen zijn verricht met het doel de heffing van belasting in
      de staat van de bevoegde autoriteit geheel of ten dele onmogelijk te maken;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.127
  - number: 8.127.d
    text: zulks overigens naar het oordeel van Onze Minister is geboden.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.127
  - number: 8.128.1
    text: Op verzoek van een bevoegde autoriteit van een staat kan Onze Minister overgaan tot de notificatie van stukken.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.128
  - number: 8.128.2
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder de notificatie van stukken verstaan de uitreiking aan de
      geadresseerde op de BES eilanden van een door een administratieve autoriteit van een staat uitgevaardigd document,
      houdende een akte of beslissing, inzake de heffing van belastingen, alsmede renten of bestuursrechtelijke sancties
      of boeten die daarmee verband houden.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.128
  - number: 8.128.3
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld betreffende de notificatie van stukken en de behandeling van
      het verzoek daartoe.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.128
  - number: 8.129.1
    text: |-
      Onze Minister laat door een ambtenaar van de rijksbelastingdienst zo nodig een onderzoek instellen ten behoeve van
      het verstrekken van inlichtingen, bedoeld in de [artikelen 8.125][ref1], [8.126][ref2] of [8.127][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.129
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        paragraaf: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        paragraaf: '2'
        afdeling: '2'
  - number: 8.129.2
    text: |-
      Een onderzoek als bedoeld in het eerste lid kan ook plaatsvinden op verzoek van een bevoegde autoriteit van een
      staat. In voorkomend geval deelt Onze Minister deze bevoegde autoriteit mee op welke gronden hij een onderzoek niet
      noodzakelijk acht.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.129
  - number: 8.129.3
    text: |-
      Bij het in het eerste lid bedoelde onderzoek zijn de bepalingen van [Titel 7][ref1] van dit hoofdstuk van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.129
    references:
      - id: ref1
        bwb_id: BWBR0029244
        hoofdstuk: VIII
  - number: 8.129.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden administratieplichtigen aangewezen die gehouden zijn eigener
      beweging bij of krachtens algemene maatregel van bestuur aan te wijzen gegevens en inlichtingen te verstrekken
      aan Onze Minister met het oog op de uitvoering van regelingen van internationaal en interregionaal recht tot
      het verlenen van wederzijdse bijstand bij de heffing en invordering van belastingen. Bij of krachtens algemene
      maatregel van bestuur worden regels gesteld met betrekking tot het uiterste tijdstip en de wijze waarop de in de
      eerste volzin bedoelde gegevens en inlichtingen aan Onze Minister dienen te worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.129
  - number: 8.129.5
    text: |-
      Geen beroep kan worden ingesteld tegen de aankondiging van een onderzoek als bedoeld in het eerste lid, alsmede
      tegen het onderzoek zelve.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.129
  - number: 8.130.1
    text: |-
      Onze Minister kan met één of meer bevoegde autoriteiten van een staat overeenkomen om gelijktijdig, elk op het
      eigen grondgebied, bij één of meer personen ten aanzien van wie zij een gezamenlijk of complementair belang hebben,
      controles te verrichten en de aldus verkregen inlichtingen uit te wisselen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.130
  - number: 8.130.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld betreffende het gelijktijdige onderzoek en de behandeling
      van een voorstel daartoe.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.130
  - number: 8.131.1
    text: |-
      Onze Minister kan met een bevoegde autoriteit van een staat overeenkomen dat, ter uitwisseling van inlichtingen in
      het kader van de in [artikel 8.124][ref1] bedoelde wederzijdse bijstand, door de bevoegde autoriteit van een staat
      gemachtigde ambtenaren onder de door Onze Minister gestelde voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.131
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        paragraaf: '1'
        afdeling: '2'
  - number: 8.131.1.a
    text: aanwezig kunnen zijn in de kantoren van de ambtenaren van de rijksbelastingdienst op de BES eilanden;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.131
  - number: 8.131.1.b
    text: aanwezig kunnen zijn bij onderzoeken die op de BES eilanden worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.131
  - number: 8.131.2
    text: |-
      In de overeenkomst, bedoeld in het eerste lid, kan Onze Minister toestaan dat ambtenaren van de bevoegde autoriteit
      van die staat op de BES eilanden personen kunnen ondervragen en bescheiden kunnen onderzoeken.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.131
  - number: 8.131.3
    text: |-
      De door een bevoegde autoriteit van een staat gemachtigde ambtenaren die op de BES eilanden aanwezig zijn, dienen
      te allen tijde een schriftelijke opdracht te kunnen overleggen waaruit hun identiteit en hun officiële hoedanigheid
      blijkt.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.131
  - number: 8.132.1
    text: |-
      Onze Minister en een bevoegde autoriteit van een staat kunnen overeenkomen dat, in het kader van het verstrekken
      van inlichtingen aan de BES eilanden, door Onze Minister aangewezen ambtenaren van de rijksbelastingdienst onder de
      door de bevoegde autoriteit van een staat gestelde voorwaarden:
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.132
  - number: 8.132.1.a
    text: |-
      aanwezig kunnen zijn in de kantoren waar de ambtenaren van de bevoegde autoriteit van een staat hun taken
      vervullen;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.132
  - number: 8.132.1.b
    text: |-
      aanwezig kunnen zijn bij administratief onderzoek dat wordt uitgevoerd op het grondgebied van de bevoegde
      autoriteit van een staat.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.132
  - number: 8.132.2
    text: |-
      Voor zover het in de staat van de bevoegde autoriteit wettelijk is toegestaan, kunnen in het kader van de
      overeenkomst, bedoeld in het eerste lid, de bij een administratief onderzoek aanwezige ambtenaren van de
      rijksbelastingdienst, personen ondervragen en bescheiden onderzoeken.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.132
  - number: 8.132.3
    text: |-
      Ambtenaren van de rijksbelastingdienst, die overeenkomstig het eerste lid op het grondgebied van de bevoegde
      autoriteit van een staat aanwezig zijn, dienen te allen tijde een schriftelijke opdracht te kunnen overleggen
      waaruit hun identiteit en hun officiële hoedanigheid blijkt.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.132
  - number: '8.133'
    text: |-
      [Titel 6][ref1] van dit hoofdstuk is van overeenkomstige toepassing ten aanzien van degene die niet voldoet aan
      de verplichtingen, bedoeld in de [artikelen 8.129][ref2] en [8.133a][ref3] en de daarop berustende bepalingen en
      [artikel 8.133b][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0029244#HoofdstukVIII
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.133
    references:
      - id: ref1
        bwb_id: BWBR0029244
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        paragraaf: '4'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        paragraaf: 4a
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        paragraaf: 4a
        afdeling: '2'
  - number: 8.133a.1
    text: |-
      Met betrekking tot een rapporterende financiële instelling zijn [artikel 2a][ref1] en
      [afdeling 4A van de Wet op de internationale bijstandsverlening bij de heffing van belastingen][ref2], met
      uitzondering van artikel 2a, eerste lid, onderdelen a, b en f, onder 3°, van die wet, van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0003954#Afdeling4a
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.133a
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: 2a
      - id: ref2
        bwb_id: BWBR0003954
        afdeling: 4a
  - number: 8.133a.2
    text: |-
      Voor de toepassing van dit artikel en de daarop berustende bepalingen wordt verstaan onder: - *rapporterende
      financiële instelling:* een financiële instelling op de BES eilanden, niet zijnde een niet-rapporterende financiële
      instelling;
        - *financiële instelling op de BES eilanden:* 1°. een op de BES eilanden gevestigde financiële instelling, met
      uitzondering van de niet op de BES eilanden gelegen filialen van die instelling; 2°. een op de BES eilanden gelegen
      filiaal van een niet op de BES eilanden gevestigde financiële instelling.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.133a
  - number: 8.133a.3
    text: |-
      Bij de overeenkomstige toepassing van [artikel 2a][ref1] en
      [afdeling 4A van de Wet op de internationale bijstandsverlening bij de heffing van belastingen][ref2], bedoeld in
      het eerste lid, wordt:


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0003954#Afdeling4a
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.133a
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: 2a
      - id: ref2
        bwb_id: BWBR0003954
        afdeling: 4a
  - number: 8.133a.3.a
    text: |-
      onder een niet-rapporterende financiële instelling mede verstaan een bij ministeriële regeling aangewezen
      financiële instelling met een laag risico om te worden gebruikt voor belastingontduiking;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.133a
  - number: 8.133a.3.b
    text: |-
      onder een uitgezonderde rekening mede verstaan een bij ministeriële regeling aangewezen financiële rekening met een
      laag risico om te worden gebruikt voor belastingontduiking;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.133a
  - number: 8.133b
    text: |-
      [Artikel 10g, eerste lid, van de Wet op de internationale bijstandsverlening bij de heffing van belastingen][ref1]
      is van overeenkomstige toepassing op verkrijging van toegang met het oog op de tenuitvoerlegging en handhaving van
      [artikel 8.133a][ref2] en de daarop berustende bepalingen, alsmede met het oog op het nakomen van overeenkomsten
      met rechtsgebieden op grond waarvan het land Nederland informatie als bedoeld in de [artikelen 10b][ref3]
      en [10c van de Wet op de internationale bijstandsverlening bij de heffing van belastingen][ref4] aan die
      rechtsgebieden zal verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel10g
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003954#Artikel10b
      [ref4]: https://wetten.overheid.nl/BWBR0003954#Artikel10c
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.133b
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: 10g
      - id: ref2
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        paragraaf: 4a
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0003954
        artikel: 10b
      - id: ref4
        bwb_id: BWBR0003954
        artikel: 10c
  - number: 8.134.1
    text: |-
      Onze Minister verstrekt geen inlichtingen indien de verstrekking daarvan niet strekt tot uitvoering van
      regelingen van internationaal en interregionaal recht tot het verlenen van wederzijdse bijstand bij de heffing van
      belastingen, alsmede renten daarover en bestuursrechtelijke sancties en boeten die daarmee verband houden.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.134
  - number: 8.134.2
    text: 'Onze Minister behoeft geen inlichtingen te verstrekken indien:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.134
  - number: 8.134.2.a
    text: de openbare orde van de BES eilanden zich daartegen verzet;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.134
  - number: 8.134.2.b
    text: |-
      die inlichtingen op de BES eilanden krachtens wettelijke bepalingen of op grond van de administratieve praktijk
      niet zouden kunnen worden verkregen voor de heffing en invordering belastingen, alsmede voor de renten daarover of
      bestuursrechtelijke sancties of boeten die daarmee verband houden;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.134
  - number: 8.134.2.c
    text: |-
      aannemelijk is dat de bevoegde autoriteit in de eigen staat niet eerst de gebruikelijke mogelijkheden voor het
      verkrijgen van de door haar gevraagde inlichtingen heeft benut, die zij in de gegeven situatie had kunnen benutten
      zonder het beoogde resultaat in gevaar te brengen;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.134
  - number: 8.134.2.d
    text: |-
      de bevoegde autoriteit voor wie de inlichtingen zouden zijn bestemd, niet bevoegd of in staat is Onze Minister
      soortgelijke inlichtingen te verstrekken;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.134
  - number: 8.134.2.e
    text: daarmee een commercieel, een industrieel of een beroepsgeheim zou worden onthuld;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.134
  - number: 8.134.2.f
    text: |-
      de verstrekking strijdig zou zijn met algemeen aanvaarde beginselen van belastingheffing of overige begrenzingen
      die voortvloeien uit de van toepassing zijnde bepalingen van internationaal en interregionaal recht.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.134
  - number: '8.135'
    text: |-
      Onze Minister verstrekt geen inlichtingen aan een bevoegde autoriteit indien de wetgeving van de staat van die
      autoriteit geen verplichting tot geheimhouding oplegt aan ambtenaren van de belastingadministratie van die staat
      met betrekking tot hetgeen hun wordt medegedeeld of blijkt bij de uitvoering van de belastingwetten van die staat.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.135
  - number: 8.136.1
    text: |-
      Tenzij een bevoegde autoriteit anders bepaalt, kunnen de door haar aan Onze Minister verstrekte inlichtingen
      uitsluitend worden gebruikt voor de heffing belastingen, alsmede renten daarover of bestuursrechtelijke sancties of
      boeten die daarmee verband houden.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.136
  - number: 8.136.2
    text: |-
      Uitsluitend met toestemming van de bevoegde autoriteit van een staat kan Onze Minister de door hem van haar
      ontvangen inlichtingen aan de bevoegde autoriteit van een andere staat verstrekken.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.136
  - number: 8.136.3
    text: |-
      Onze Minister kan aan een bevoegde autoriteit toestemming verlenen de inlichtingen voor een ander doel te gebruiken
      dan voor de heffing van belastingen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.136
  - number: 8.136.4
    text: |-
      Onze Minister kan op een daartoe strekkend verzoek een bevoegde autoriteit toestemming verlenen de van hem
      ontvangen inlichtingen aan een bevoegde autoriteit van een andere staat te verstrekken.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.136
  - number: 8.137.1
    text: |-
      Op verzoek van de ontvanger, bedoeld in [artikel 1.3, onderdeel k][ref1], onderneemt de ontvanger, bedoeld in
      artikel 2, eerste lid, onderdeel i, van de Invorderingswet 1990, de nodige stappen om een schuldvordering van
      eerstgenoemde ontvanger in te vorderen alsof het een schuldvordering van laatstgenoemde ontvanger betrof.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel1
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.137
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '1'
        hoofdstuk: I
  - number: 8.137.2
    text: |-
      Op verzoek van de ontvanger, bedoeld in artikel 2, eerste lid, onderdeel i, van de Invorderingswet 1990, onderneemt
      de ontvanger, bedoeld in [artikel 1.3, onderdeel k][ref1], de nodige stappen om een schuldvordering ontstaan in
      Nederland, in te vorderen alsof het een schuldvordering van laatstgenoemde ontvanger betrof.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel1
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.137
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '1'
        hoofdstuk: I
  - number: 8.137.3
    text: |-
      De bepalingen van het eerste of tweede lid zijn slechts van toepassing op een schuldvordering die onderwerp is van
      een executoriale titel op de BES eilanden of in Nederland, die niet wordt bestreden.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.137
  - number: 8.137.4
    text: |-
      Op verzoek van de verzoekende ontvanger neemt de aangezochte ontvanger met het oog op de invordering van een
      in dit artikel bedoelde schuld conservatoire maatregelen zelfs indien de vordering wordt bestreden en nog niet
      invorderbaar is.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.137
  - number: 8.137.5
    text: |-
      Aan de in te vorderen schuld, bedoeld in dit artikel, behoeft geen preferentiële behandeling te worden toegekend
      ten opzichte van vergelijkbare schuldvorderingen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel8.137
  - number: '10.1'
    text: 'Deze wet wordt aangehaald als: Belastingwet BES.'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel10.1
  - number: '10.2'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      hoofdstukken, artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel10.2
