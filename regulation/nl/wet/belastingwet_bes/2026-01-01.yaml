preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is maatregelen te treffen zodat voor Bonaire, Sint
    Eustatius en Saba wordt voorzien in een fiscaal stelsel op het moment dat in het kader van de staatkundige
    vernieuwing van het Koninkrijk der Nederlanden deze eilanden als openbaar lichaam onderdeel gaan uitmaken van het
    land Nederland;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      De bepalingen van deze belastingwet gelden op de BES eilanden bij de heffing van de BES belastingen alsmede de
      invordering van de BES belastingen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel1.1
  - number: '1.2'
    text: 'Krachtens deze belastingwet worden de volgende belastingen geheven en ingevorderd:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel1.2
  - number: 1.2.a
    text: vastgoedbelasting;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel1.2
  - number: 1.2.b
    text: opbrengstbelasting;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel1.2
  - number: 1.2.c
    text: algemene bestedingsbelasting;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel1.2
  - number: 1.2.d
    text: overdrachtsbelasting, en
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel1.2
  - number: 1.2.e
    text: kansspelbelasting.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel1.2
  - number: 1.3.1
    text: |-
      Deze belastingwet verstaat onder: - *Onze Minister:* Onze Minister van Financiën;
        - *belastingwet:* deze wet alsmede alle op deze wet berustende bepalingen;
        - *lichamen:* verenigingen en andere rechtspersonen, maat- en vennootschappen en doelvermogens;
        - *BES belastingen:* de in [artikel 1.2][ref1] genoemde belastingen alsmede de loonbelasting geheven op basis van
      de [Wet loonbelasting BES][ref2], de inkomstenbelasting geheven op basis van de [Wet inkomstenbelasting BES][ref3]
      en de minimumbelasting geheven op basis van [hoofdstuk VIIB][ref4], waaronder worden begrepen de bestuurlijke
      boeten die ingevolge deze wet kunnen worden opgelegd of vastgesteld, interest, alsmede de kosten van vervolging;
        - *Koninkrijk:* Koninkrijk der Nederlanden;
        - *Rijk:* het land Nederland, zijnde Nederland en de BES eilanden;
        - *Nederland:* het in Europa gelegen deel van het Rijk;
        - *BES eilanden:* de openbare lichamen Bonaire, Sint Eustatius en Saba, met daar onder begrepen, met in achtneming
      van de [Rijkswet tot vaststelling van een zeegrens tussen Curaçao en Bonaire, en tussen Sint Maarten en Saba][ref5],
      het buiten de territoriale zee van de BES eilanden gelegen deel van de zeebodem en de ondergrond daarvan, voor
      zover het Koninkrijk daar op grond van het internationale recht ten behoeve van de exploratie en de exploitatie
      van natuurlijke rijkdommen soevereine rechten mag uitoefenen, alsmede de in, op of boven dat gebied aanwezige
      installaties en andere inrichtingen ten behoeve van de exploratie en exploitatie van natuurlijke rijkdommen in
      dat gebied;
        - *binnenland:* de BES eilanden;
        - *openbaar lichaam:* Bonaire, Sint Eustatius of Saba, waarbij het openbaar lichaam Bonaire de eilanden Bonaire en
      Klein Bonaire omvat;
        - *directeur, inspecteur of ontvanger:* de bij ministeriële regeling als zodanig aangewezen functionaris van de
      rijksbelastingdienst;
        - *belastingdeurwaarder:* de bij ministeriële regeling als zodanig aangewezen ambtenaar met dien verstande dat
      de betrekking van belastingdeurwaarder van de BES belastingen verenigbaar is met die van deurwaarder bij een
      rechterlijk college of gerecht in eerste aanleg;
        - *belastingaanslag:* de voorlopige aanslag, de aanslag, de navorderingsaanslag, en de naheffingsaanslag;
        - *belastingplichtige:* de natuurlijke persoon of rechtspersoon van wie op grond van deze wet een belasting wordt
      geheven;
        - *belastingschuldige:* degene te wiens naam de belastingaanslag is gesteld;
        - *het Hof:* het Gemeenschappelijk Hof van Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire, Sint Eustatius
      en Saba;
        - *het Gerecht in eerste aanleg:* het Gerecht in eerste aanleg van Bonaire, Sint Eustatius en Saba;
        - *bevoegde autoriteit:* de door een staat tot het uitwisselen van inlichtingen aangewezen persoon of instantie;
        - *USD:* dollar van de Verenigde Staten van Amerika;
        - *personenauto:* de personenauto, bedoeld in
      [artikel 3, eerste lid, van de Wet op de belasting van personenauto’s en motorrijwielen 1992][ref6];
        - *bestelauto:* de bestelauto, bedoeld in
