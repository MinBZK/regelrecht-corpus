  - number: 1.3.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld op basis waarvan motorrijtuigen voor de toepassing van deze
      wet, de [Wet inkomstenbelasting BES][ref1] of de [Wet loonbelasting BES][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0029281
      [ref2]: https://wetten.overheid.nl/BWBR0029283
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0029281
      - id: ref2
        bwb_id: BWBR0029283
  - number: 1.3.2.a
    text: niet als personenauto worden aangemerkt; of
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel1.3
  - number: 1.3.2.b
    text: niet als bestelauto worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel1.3
  - number: '1.4'
    text: 'Waar in deze belastingwet wordt gesproken van:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel1.4
  - number: 1.4.a
    text: |-
      de bestuurder van een lichaam, wordt daaronder begrepen de beherende vennoot van een maat- of vennootschap en de
      binnenlandse vertegenwoordiger van een niet op de BES eilanden gevestigd lichaam, alsmede in geval van ontbinding
      degene die met de vereffening is belast;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel1.4
  - number: 1.4.b
    text: |-
      vereniging, wordt daaronder begrepen het samenwerkingsverband zonder rechtspersoonlijkheid die maatschappelijk met
      een vereniging gelijk kan worden gesteld;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel1.4
  - number: 1.4.c
    text: Mogendheid, wordt daaronder begrepen een daarmee gelijk te stellen bestuurlijke eenheid;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel1.4
  - number: 1.4.d
    text: staat, wordt daaronder begrepen Mogendheid;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel1.4
  - number: 1.4.e
    text: |-
      verdrag, wordt daaronder begrepen regelen ter voorkoming van dubbele belasting die zijn overeengekomen met een in
      onderdeel d bedoelde bestuurlijke eenheid;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel1.4
  - number: 1.4.f
    text: |-
      regeling ter voorkoming van dubbele belasting, wordt daaronder begrepen regelen ter voorkoming van dubbele
      belasting die zijn overeengekomen met een in onderdeel d bedoelde bestuurlijke eenheid.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel1.4
  - number: 1.5.1
    text: Waar iemand woont en waar een lichaam is gevestigd, wordt naar de omstandigheden beoordeeld.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel1.5
  - number: 1.5.2
    text: |-
      Voor de toepassing van het eerste lid worden schepen en luchtvaartuigen welke op de BES eilanden hun thuishaven
      hebben, ten aanzien van de bemanning als deel van de BES eilanden beschouwd.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel1.5
  - number: '4.1'
    text: |-
      Onder de naam vastgoedbelasting wordt een belasting geheven ter zake van voordelen uit een op de BES eilanden
      gelegen onroerende zaak.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.1
  - number: 4.2.1
    text: |-
      De belasting wordt geheven van degene die bij het begin van het kalenderjaar het genot heeft krachtens eigendom,
      bezit of beperkt recht van een onroerende zaak.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.2
  - number: 4.2.2
    text: |-
      Als genothebbende krachtens eigendom, bezit of beperkt recht wordt aangemerkt, degene die bij het begin van het
      kalenderjaar als zodanig in de kadastrale registratie is vermeld, tenzij blijkt dat op dat tijdstip een ander
      genothebbende krachtens eigendom, bezit of beperkt recht is.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.2
  - number: 4.2.3
    text: |-
      Indien bij het begin van het kalenderjaar meer dan een belastingplichtige het genot heeft krachtens eigendom, bezit
      of beperkt recht van een onroerende zaak, wordt de belasting geheven van alle belastingplichtigen gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.2
  - number: 4.2.4
    text: |-
      Indien belastingplichtigen bij het begin van het kalenderjaar het genot krachtens eigendom, bezit of beperkt recht
      van een onroerende zaak hebben en dit genot elk van deze belastingplichtigen afzonderlijk het recht geeft om de
      onroerende zaak gedurende een deel van het kalenderjaar te gebruiken (time-share), wordt de belasting geheven van
      al deze belastingplichtigen gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.2
  - number: '4.3'
    text: 'Voor de toepassing van dit hoofdstuk wordt als één onroerende zaak aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.3
  - number: 4.3.a
    text: een gebouwd eigendom;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.3
  - number: 4.3.b
    text: een ongebouwd eigendom;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.3
  - number: 4.3.c
    text: |-
      een gedeelte van een in onderdeel a of in onderdeel b bedoeld eigendom dat blijkens zijn indeling is bestemd om als
      een afzonderlijk geheel te worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.3
  - number: 4.3.d
    text: |-
      een samenstel van twee of meer van de in onderdeel a of onderdeel b bedoelde eigendommen of in onderdeel c bedoelde
      gedeelten daarvan die bij dezelfde belastingplichtige in gebruik zijn en die, naar de omstandigheden beoordeeld,
      bij elkaar behoren.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.3
  - number: '4.4'
    text: 'De belasting wordt niet geheven ter zake van voordelen uit:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.4
  - number: 4.4.a
    text: |-
      onroerende zaken die als eigen woning worden aangemerkt als bedoeld in
      [artikel 4 van de Wet inkomstenbelasting BES][ref1] en die de belastingplichtige als hoofdverblijf ter beschikking
      staan;


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel4
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '4'
  - number: 4.4.b
    text: |-
      onroerende zaken die tot het vermogen van een onderneming behoren waarmee een belastingplichtige voor de
      inkomstenbelasting opbrengst als bedoeld in [artikel 6 van de Wet inkomstenbelasting BES][ref1] verkrijgt;


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel6
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '6'
  - number: 4.4.c
    text: |-
      onroerende zaken die in hoofdzaak zijn bestemd voor de openbare eredienst met uitzondering van delen van zodanige
      onroerende zaken die dienen als woning;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.4
  - number: 4.4.d
    text: |-
      waterverdedigings- en waterbeheersingswerken die worden beheerd door organen, instellingen of diensten van
      publiekrechtelijke rechtspersonen, met uitzondering van de delen van zodanige werken die dienen als woning;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.4
  - number: 4.4.e
    text: |-
      werken die zijn bestemd voor de levering van water, de inzameling en zuivering van riool- en ander afvalwater of
      de levering van elektriciteit en die worden beheerd door organen, instellingen of diensten van publiekrechtelijke
      rechtspersonen, met uitzondering van de delen van zodanige werken die dienen als woning;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.4
  - number: 4.4.f
    text: |-
      ten behoeve van de land- of bosbouw bedrijfsmatig geëxploiteerde cultuurgrond, daaronder mede begrepen de open
      grond, voor zover die niet de ondergrond vormt van gebouwde eigendommen;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.4
  - number: 4.4.g
    text: |-
      natuurterreinen, waaronder mede wordt verstaan duinen, zandverstuivingen, moerassen en plassen, die door
      rechtspersonen met volledige rechtsbevoegdheid welke zich uitsluitend of nagenoeg uitsluitend het behoud van
      natuurschoon ten doel stellen, beheerd worden;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.4
  - number: 4.4.h
    text: |-
      onroerende zaken, waarvan het Rijk of de openbare lichamen Bonaire, Sint Eustatius of Saba het genot krachtens
      eigendom, bezit of beperkt recht hebben, behoudens voor zover die zaak wordt gebruikt in het kader van een
      onderneming of een andere economische activiteit;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.4
  - number: 4.4.i
    text: |-
      onroerende zaken, niet zijnde zelfstandige woningen, voor zover het genot daarvan krachtens eigendom, bezit of
      beperkt recht berust bij, bij ministeriële regeling aan te wijzen, charitatieve of culturele instellingen, doelen
      voor de behartiging van het algemeen nut of een sociaal belang of organisaties van werkgevers of werknemers en de
      betreffende onroerende zaak uitsluitend of nagenoeg uitsluitend door de belastingplichtige zelf wordt gebruikt;
      een aanwijzing is alleen mogelijk indien de belastingplichtige geen winst beoogt en er geen verstoring van
      concurrentieverhoudingen optreedt ten opzichte van belastingplichtigen die wel winst beogen;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.4
  - number: 4.4.j
    text: |-
      onroerende zaken, voor zover een lichaam dat op grond van [artikel 5.2][ref1], in Nederland wordt geacht te zijn
      gevestigd het genot krachtens eigendom, bezit of beperkt recht heeft;


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel5
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '5'
        hoofdstuk: V
  - number: 4.4.k
    text: |-
      onroerende zaken, waarvan de waarde uitsluitend of nagenoeg uitsluitend wordt bepaald door de waarde van de
      daarvan deel uitmakende braakliggende grond, voor zover degene of degenen die het genot krachtens eigendom,
      bezit of beperkt recht heeft of hebben een natuurlijke persoon is of zijn en inwoner is of zijn van de BES
      eilanden, met dien verstande dat grond waarop een woning wordt gebouwd ook als braakliggende grond wordt
      aangemerkt, mits de te bouwen woning binnen 24 maanden na aanvang van de bouwactiviteiten voor degene of degenen
      die het genot krachtens eigendom, bezit of beperkt recht heeft of hebben, als een eigen woning als bedoeld in
      [artikel 4 van de Wet inkomstenbelasting BES][ref1] wordt aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0029281
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0029281
  - number: 4.5.1
    text: |-
      De heffingsmaatstaf is de waarde die aan de onroerende zaak dient te worden toegekend, indien de volle en
      onbezwaarde eigendom daarvan zou kunnen worden overgedragen en de verkrijger de zaak in de staat waarin die zich
      bevindt, onmiddellijk en in volle omvang in gebruik zou kunnen nemen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.5
  - number: 4.5.2
    text: |-
      In afwijking in zoverre van het eerste lid wordt de waarde van een onroerende zaak bepaald op de vervangingswaarde
      indien dit leidt tot een hogere waarde dan die ingevolge het eerste lid. Bij de berekening van de vervangingswaarde
      wordt rekening gehouden met:
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.5
  - number: 4.5.2.a
    text: de aard en de bestemming van de zaak;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.5
  - number: 4.5.2.b
    text: |-
      de sedert de stichting van de zaak opgetreden technische en functionele veroudering, waarbij de invloed van latere
      wijzigingen in aanmerking wordt genomen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.5
  - number: 4.6.1
    text: |-
      De inspecteur stelt de waarde van de onroerende zaken ter zake waarvan de vastgoedbelasting wordt geheven vast bij
      voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.6
  - number: 4.6.2
    text: |-
      De waarde wordt bepaald naar de waarde die de onroerende zaak op de waardepeildatum heeft naar de staat waarin de
      zaak op die datum verkeert.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.6
  - number: 4.6.3
    text: De waardepeildatum ligt aan het begin van het tijdvak waarvoor de waarde wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.6
  - number: 4.6.4
    text: De waarde geldt voor een tijdvak van vijf achtereenvolgende kalenderjaren.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.6
  - number: 4.6.5
    text: |-
      Indien er met betrekking tot een onroerende zaak meer dan één genothebbende krachtens eigendom, bezit of beperkt
      recht is, kan de beschikking, bedoeld in het eerste lid, worden toegezonden aan één van hen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.6
  - number: 4.7.1
    text: |-
      In afwijking in zoverre van [hoofdstuk VIII][ref1], stelt de inspecteur de aanslag vast, zonder dat daaraan een
      aangifte is voorafgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0029244
        hoofdstuk: VIII
  - number: 4.7.2
    text: Bezwaar tegen de aanslag kan niet gegrond zijn op de stelling dat de waarde onjuist is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.7
  - number: 4.7.3
    text: De belasting wordt geheven over een tijdvak van één kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.7
  - number: 4.7.4
    text: |-
      Indien er met betrekking tot een onroerende zaak meer dan één genothebbende krachtens eigendom, bezit of beperkt
      recht is, kan de inspecteur de aanslag opleggen aan één van hen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.7
  - number: 4.7.5
    text: |-
      Indien er met betrekking tot een onroerende zaak meer dan één genothebbende krachtens eigendom, bezit of beperkt
      recht is, vordert de ontvanger de belastingaanslag in bij degene op wiens naam de aanslag is gesteld, zonder
      rekening te houden met de rechten van de overige belastingplichtigen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.7
  - number: 4.8.1
    text: |-
      Indien de onroerende zaak in het jaar voorafgaand aan het tijdvak van heffing of in de loop van het tijdvak van
      heffing wijzigt als gevolg van bouw, verbouwing, verbetering, afbraak of vernietiging wordt in afwijking van
      [artikel 4.6, derde en vierde lid][ref1], de waarde bepaald naar de staat van die zaak bij het begin van het
      kalenderjaar volgend op dat waarin de genoemde wijziging zich heeft voorgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel4
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '4'
        hoofdstuk: IV
  - number: 4.8.2
    text: |-
      Indien de waarde van een onroerende zaak door toepassing van het eerste lid hoger wordt vastgesteld, wordt deze
      waardestijging, voor zover deze voortvloeit uit bouw, verbouw, verbetering, uitbreiding of renovatie van de
      desbetreffende onroerende zaak, eerst in aanmerking genomen bij het begin van het zesde kalenderjaar volgend
      op het kalenderjaar waarin deze waardestijging zich heeft voorgedaan. De eerste volzin is niet van toepassing
      met betrekking tot onroerende zaken waarvan het genot krachtens eigendom, bezit of beperkt recht berust bij een
      rechtspersoon die op grond van [artikel 5.4 van de Douane- en Accijnswet BES][ref1] is toegelaten tot een handels-
      en dienstenentrepot. Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de toepassing
      van de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0029236#Artikel5
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0029236
        artikel: '5'
  - number: 4.8.3
    text: |-
      Dit artikel is van toepassing op de vaststelling van de waarde van een onroerende zaak op of na 1 januari 2025. Op
      de vaststelling van de waarde van een onroerende zaak voor of op 31 december 2024, blijft dit artikel zoals het op
      31 december 2024 luidde van toepassing.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.8
  - number: 4.9.1
    text: De belasting bedraagt 17,5% van de voordelen uit een onroerende zaak.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.9
  - number: 4.9.2
    text: |-
      In afwijking van het eerste lid, bedraagt de belasting 11 percent van de voordelen uit een onroerende zaak indien
      de onroerende zaak een hotel betreft voor zover het genot daarvan krachtens eigendom, bezit of beperkt recht berust
      bij een niet-natuurlijke persoon.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.9
  - number: 4.9.3
    text: |-
      Voor de toepassing van het tweede lid wordt onder een hotel verstaan een onroerende zaak die of een complex van
      onroerende zaken dat bedrijfsmatig door een niet-natuurlijke persoon wordt geëxploiteerd, geheel of nagenoeg geheel
      gericht is op kortdurend verblijf van toeristen en beschikt over volwaardige gemeenschappelijke hotelvoorzieningen.
      Bij ministeriële regeling kunnen nadere voorwaarden worden gesteld waaraan een onroerende zaak moet voldoen om voor
      de toepassing van het tweede lid als hotel te worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.9
  - number: 4.10.1
    text: |-
      De voordelen uit een onroerende zaak worden gesteld op 4% van de waarde van de onroerende zaak, met dien
      verstande dat ingeval de onroerende zaak een zelfstandige woning betreft, niet zijnde een woning als bedoeld in
      [artikel 4.4, onderdeel a][ref1], de voordelen worden gesteld op 4% van de waarde, voor zover deze waarde meer
      bedraagt dan USD 70.000. Voor de toepassing van de eerste volzin is, mits alle eigenaren natuurlijke personen zijn,
      [artikel 4.2, derde lid][ref2], van overeenkomstige toepassing en kunnen bij ministeriële regeling regels worden
      gesteld om te bepalen of sprake is van een zelfstandige woning.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel4
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '4'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0029244
        artikel: '4'
        hoofdstuk: IV
  - number: 4.10.2
    text: |-
      In afwijking van het eerste lid worden de voordelen uit een onroerende zaak bij een belastingplichtige als bedoeld
      in [artikel 4.2, vierde lid][ref1], bepaald op basis van het eerste lid, en vervolgens vermenigvuldigd met een
      gebruiksfactor. De gebruiksfactor is het aantal dagen in het kalenderjaar dat de belastingplichtige een onroerende
      zaak waarvan hij het genot krachtens eigendom, bezit of beperkt recht heeft mag gebruiken, gedeeld door het
      aantal dagen in het kalenderjaar. Indien de hiervoor bedoelde belastingplichtigen de onroerende zaak in totaal
      minder dan het aantal dagen in het kalenderjaar mogen gebruiken wordt het op grond van de eerste twee volzinnen
      bepaalde voordeel vermenigvuldigd met een leegstandsfactor. Deze leegstandsfactor bedraagt het aantal dagen in het
      kalenderjaar gedeeld door het totaal aantal dagen dat deze belastingplichtigen de onroerende zaak mogen gebruiken.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel4
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '4'
        hoofdstuk: IV
  - number: 4.11.1
    text: |-
      De belastingplichtige, bedoeld in [artikel 4.2, eerste, derde en vierde lid][ref1], kan op de BES eilanden een
      fiscaal vertegenwoordiger aanstellen. De fiscaal vertegenwoordiger woont of is gevestigd op de BES eilanden.
      De fiscaal vertegenwoordiger treedt in de plaats van de belastingplichtige met betrekking tot de rechten en
      verplichtingen die voortvloeien uit deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel4
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.11
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '4'
        hoofdstuk: IV
  - number: 4.11.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald in welke gevallen een belastingplichtige
      verplicht is een fiscaal vertegenwoordiger aan te stellen. Door de inspecteur kan in elk geval als
      fiscaal vertegenwoordiger worden aangemerkt degene die namens de belastingplichtige als bedoeld in
      [artikel 4.2, eerste, derde en vierde lid][ref1], het beheer voert over een onroerende zaak waarvan die
      belastingplichtige het genot heeft krachtens eigendom, bezit of beperkt recht.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel4
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.11
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '4'
        hoofdstuk: IV
  - number: 4.11.3
    text: |-
      De fiscaal vertegenwoordiger is bevoegd de door hem betaalde belasting als zodanig te verhalen op degenen die op
      grond van [artikel 4.2, eerste, derde en vierde lid][ref1], belastingplichtig zijn, tot ten hoogste het bedrag aan
      belasting dat diegene verschuldigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel4
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel4.11
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '4'
        hoofdstuk: IV
  - number: 5.1.1
    text: 'Onder de naam opbrengstbelasting wordt een belasting geheven van degenen die:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.1
  - number: 5.1.1.a
    text: |-
      rechtstreeks of door middel van certificaten gerechtigd zijn tot de opbrengst van aandelen in en winstbewijzen van
      op de BES eilanden gevestigde naamloze vennootschappen, besloten vennootschappen met beperkte aansprakelijkheid,
      open commanditaire vennootschappen en andere vennootschappen waarvan het kapitaal geheel of ten dele in aandelen
      is verdeeld;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.1
  - number: 5.1.1.b
    text: |-
      rechtstreeks of door middel van certificaten gerechtigd zijn tot de opbrengst van lidmaatschapsbewijzen in en
      winstbewijzen van op de BES eilanden gevestigde coöperaties en verenigingen op coöperatieve grondslag, onderlinge
      waarborgmaatschappijen en verenigingen welke op onderlinge grondslag als verzekeraar of als kredietinstelling
      optreden alsmede andere, hiervoor niet genoemde verenigingen indien zij een onderneming drijven;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.1
  - number: 5.1.1.c
    text: gerechtigd zijn tot een of meer uitdelingen van een op de BES eilanden gevestigde stichting of een doelvermogen;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.1
  - number: 5.1.1.d
    text: |-
      gerechtigd zijn tot de opbrengst van bewijzen van deelgerechtigdheid in een op de BES eilanden gevestigd open fonds
      voor gemene rekening.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.1
  - number: 5.1.2
    text: |-
      Voor de toepassing van dit hoofdstuk wordt, in afwijking van [artikel 1.3, onderdeel c][ref1], verstaan onder
      lichamen de in het eerste lid onder a, b, c en d genoemde rechtsvormen.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel1
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '1'
        hoofdstuk: I
  - number: 5.2.1
    text: |-
      In afwijking in zoverre van [artikel 1.5][ref1] wordt een lichaam dat op de BES eilanden is gevestigd, voor de
      toepassing van dit hoofdstuk geacht in Nederland te zijn gevestigd. De eerste volzin is niet van toepassing met
      betrekking tot op de BES eilanden gevestigde stichtingen en doelvermogens.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel1
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '1'
        hoofdstuk: I
  - number: 5.2.2
    text: |-
      Niettegenstaande het eerste lid wordt een lichaam geacht op de BES eilanden te zijn gevestigd indien de inspecteur
      op verzoek van het lichaam bij voor bezwaar vatbare beschikking heeft vastgesteld dat aannemelijk is dat:
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.2
  - number: 5.2.2.a
    text: |-
      het lichaam op jaarbasis een omzet heeft van ten hoogste USD 80 000, de bezittingen van het lichaam doorgaans ten
      hoogste USD 200 000 bedragen en het lichaam zich niet bezighoudt met financiële dienstverlening, royaltybetalingen,
      verzekerings- en herverzekeringsactiviteiten, daaronder mede begrepen diensten ter zake van het optreden als
      directie van vennootschappen waarvan de statutaire zetel of feitelijke leiding op de BES eilanden gevestigd is en
      andere dienstverlening ter zake van het trustbedrijf;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.2
  - number: 5.2.2.b
    text: |-
      de bezittingen van het lichaam doorgaans voor ten hoogste 50 percent bestaan uit beleggingen, deelnemingen,
      liquiditeiten, activa waarvan het gebruik of gebruiksrecht ter beschikking wordt gesteld aan personen die buiten
      de BES eilanden wonen of zijn gevestigd en overige bezittingen die worden aangewend voor het direct of indirect
      financieren van personen die buiten de BES eilanden wonen of zijn gevestigd; of
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.2
  - number: 5.2.2.c
    text: 'het lichaam:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.2
  - number: 5.2.2.c.1°
    text: |-
      voltijds blijvend werk verschaft aan doorgaans ten minste drie op de BES eilanden wonende natuurlijke personen
      die zich zelfstandig bezighouden met werkzaamheden betrekking hebbend op de bezittingen genoemd in het tweede lid,
      onderdeel b, en hun bevoegdheden en verantwoordelijkheden in overeenstemming zijn met de aard en functie van die
      werkzaamheden; en
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.2
  - number: 5.2.2.c.2°
    text: |-
      voor ten minste een periode van 24 maanden een op de BES eilanden gelegen onroerende zaak of een deel van
      een onroerende zaak ter waarde van ten minste USD 50 000 ter beschikking heeft voor de uitvoering van de
      bedrijfsactiviteiten van het lichaam en, ingeval dit lichaam zich bezighoudt met financiële dienstverlening,
      royaltybetalingen, verzekerings- en herverzekeringsactiviteiten, daaronder mede begrepen diensten ter zake van
      het optreden als directie van vennootschappen waarvan de statutaire zetel of feitelijke leiding op de BES eilanden
      gevestigd is en andere dienstverlening ter zake van het trustbedrijf, zich daarin een eigen kantoor bevindt dat is
      voorzien van in de financiële sector gebruikelijke faciliteiten.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.2
  - number: 5.2.3
    text: 'Het eerste lid is niet van toepassing op een lichaam:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.2
  - number: 5.2.3.a
    text: |-
      dat is toegelaten tot een handels- en dienstenentrepot als bedoeld in
      [hoofdstuk V van de Douane- en Accijnswet BES][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0029236#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0029236
        hoofdstuk: V
  - number: 5.2.3.b
    text: |-
      waarvan de inspecteur op verzoek van dat lichaam bij voor bezwaar vatbare beschikking heeft vastgesteld dat dat
      lichaam voor ten minste 50 percent deelneemt in een lichaam dat is toegelaten tot een handels- en dienstenentrepot
      als bedoeld in [hoofdstuk V van de Douane- en Accijnswet BES][ref1] of dat een beschikking heeft ontvangen als
      bedoeld in het tweede lid, en de overige bezittingen van het lichaam voldoen aan het tweede lid, onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0029236#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0029236
        hoofdstuk: V
  - number: 5.2.4
    text: 'De in het tweede en derde lid bedoelde beschikking vervalt direct na het moment waarop het lichaam:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.2
  - number: 5.2.4.a
    text: naar de omstandigheden beoordeeld niet meer op de BES eilanden is gevestigd;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.2
  - number: 5.2.4.b
    text: |-
      wordt toegelaten tot een handels- en dienstenentrepot als bedoeld in
      [hoofdstuk V van de Douane- en Accijnswet BES][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0029236#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0029236
        hoofdstuk: V
  - number: 5.2.4.c
    text: niet meer voldoet aan de in het tweede of derde lid bedoelde vereisten.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.2
  - number: 5.2.5
    text: |-
      Op het begrip deelneming als bedoeld in het tweede lid, onderdeel b, en [artikel 5.7, onderdeel a][ref1], is
      [artikel 13, tweede lid, van de Wet op de vennootschapsbelasting 1969][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel13
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '5'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0002672
        artikel: '13'
  - number: 5.2.6
    text: |-
      Voor de toepassing van het tweede lid, onderdeel b, worden activa waarvan het gebruik of gebruiksrecht ter
      beschikking wordt gesteld aan natuurlijke personen die op de BES eilanden verblijven maar niet op de BES eilanden
      wonen niet beschouwd als activa waarvan het gebruik of gebruiksrecht ter beschikking wordt gesteld aan natuurlijke
      personen die buiten de BES eilanden wonen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.2
  - number: 5.2.7
    text: |-
      Als aan de voorwaarden wordt voldaan, wordt het verzoek, bedoeld in de aanhef van het tweede lid of het derde lid,
      onderdeel b, ingewilligd met ingang van de aanvang van het in het verzoek aangegeven eerste kalenderjaar waarin de
      belastingplichtige voor de toepassing van deze wet op de BES eilanden is gevestigd, doch niet eerder dan 24 maanden
      voor het tijdstip waarop het verzoek door de inspecteur is ontvangen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.2
  - number: '5.3'
    text: De belasting wordt geheven naar de opbrengst.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.3
  - number: 5.4.1
    text: 'Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder opbrengst:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.4
  - number: 5.4.1.a
    text: |-
      onmiddellijke of middellijke uitdelingen van winst onder welke naam of in welke vorm ook gedaan, daar onder
      begrepen hetgeen bij inkoop van aandelen, lidmaatschapsbewijzen of bewijzen van deelgerechtigdheid of bij
      liquidatie wordt ontvangen boven de nominale waarde;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.4
  - number: 5.4.1.b
    text: |-
      de nominale waarde van aandelen, lidmaatschapsbewijzen of bewijzen van deelgerechtigdheid uitgereikt aan
      aandeelhouders, leden of deelnemers, voor zover niet blijkt dat storting heeft plaats gevonden of zal plaatsvinden;
      bijschrijving op aandelen, op lidmaatschapsbewijzen of bewijzen van deelgerechtigdheid wordt met uitreiking
      gelijkgesteld;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.4
  - number: 5.4.1.c
    text: |-
      gehele of gedeeltelijke teruggaaf van hetgeen op aandelen, lidmaatschapsbewijzen of bewijzen van deelgerechtigdheid
      is gestort, tenzij de nominale waarde van de desbetreffende geplaatste aandelen, lidmaatschapsbewijzen of bewijzen
      van deelgerechtigdheid bij statutenwijziging met een gelijk bedrag is verminderd;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.4
  - number: 5.4.1.d
    text: |-
      hetgeen wordt uitgedeeld op winstbewijzen, daaronder begrepen hetgeen wordt genoten ter gelegenheid van afkoop of
      inkoop daarvan;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.4
  - number: 5.4.1.e
    text: hetgeen wordt uitgedeeld door een stichting of een doelvermogen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.4
  - number: 5.4.2
    text: |-
      Niet in geld genoten opbrengst wordt in aanmerking genomen naar de waarde welke daaraan in het economische verkeer
      kan worden toegekend op het tijdstip van ter beschikking stellen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.4
  - number: 5.5.1
    text: De belasting bedraagt 7,5 percent van de opbrengst.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.5
  - number: 5.5.2
    text: |-
      Neemt het lichaam dat de opbrengst verschuldigd is de belasting voor zijn rekening, dan wordt voor het berekenen
      van de belasting de opbrengst vermenigvuldigd met 100/92,5.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.5
  - number: 5.6.1
    text: De belasting wordt geheven door inhouding op de opbrengst.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.6
  - number: 5.6.2
    text: |-
      Inhoudingsplichtige is het op de BES eilanden gevestigde lichaam bedoeld in
      [artikel 5.2, tweede of derde lid][ref1], dat de opbrengst verschuldigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel5
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '5'
        hoofdstuk: V
  - number: 5.6.3
    text: |-
      De inhoudingsplichtige is verplicht de belasting in te houden op het tijdstip waarop de opbrengst ter beschikking
      is gesteld.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.6
  - number: 5.6.4
    text: |-
      De inhoudingsplichtige is verplicht de ingehouden belasting op aangifte af te dragen. In afwijking van
      [artikel 8.11, derde lid][ref1], wordt geen aangifte gedaan indien in het kwartaal geen opbrengst ter beschikking
      is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '3'
  - number: 5.6.5
    text: |-
      Overtreft de belasting de opbrengst in geld, dan wordt het ontbrekende geacht te zijn ingehouden op het in het
      derde lid omschreven tijdstip, met dien verstande dat de inhoudingsplichtige bevoegd is dat ontbrekende te verhalen
      op degene die tot de opbrengst gerechtigd is. De inhoudingsplichtige kan de afgifte van de niet in geld genoten
      opbrengst opschorten tot voldoening van deze vordering plaats vindt.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.6
  - number: '5.7'
    text: 'Inhouding van de belasting blijft achterwege met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.7
  - number: 5.7.a
    text: |-
      de opbrengst van aandelen, lidmaatschapsbewijzen, winstbewijzen en bewijzen van deelgerechtigdheid die voor een op
      de BES eilanden gevestigd lichaam, bedoeld in [artikel 5.2, tweede of derde lid][ref1], een deelneming vormt die
      behoort tot het vermogen van de door het lichaam op de BES eilanden gedreven onderneming;


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel5
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '5'
        hoofdstuk: V
  - number: 5.7.b
    text: |-
      uitdelingen toegekend door een stichting of een doelvermogen aan, of ten behoeve van, binnen het Rijk gevestigde of
      georganiseerde kerkelijke, levensbeschouwelijke, charitatieve, culturele, wetenschappelijke instellingen of doelen
      bij welke de behartiging van het algemeen nut of een sociaal belang op de voorgrond staat, alsmede uitdelingen
      aan of ten behoeve van door Onze Minister als zodanig aangemerkte buiten het Rijk gevestigde of georganiseerde
      instellingen en doelen;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.7
  - number: 5.7.c
    text: |-
      uitdelingen gedaan door een stichting of doelvermogen, voor zover deze uitdelingen zijn aan te merken als
      uitkeringen in het kader van een pensioenregeling als bedoeld in [artikel 6A van de Wet loonbelasting BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029283#Artikel6a
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0029283
        artikel: 6a
  - number: '5.8'
    text: |-
      Indien een inhoudingsplichtige niet langer voldoet aan de voorwaarden van [artikel 5.2, tweede of derde lid][ref1],
      of op basis van [artikel 1.5][ref2] niet langer op de BES eilanden is gevestigd of voor de toepassing van een
      verdrag of regeling ter voorkoming van dubbele belasting niet meer wordt aangemerkt als inwoner van de BES
      eilanden, dan wordt voor de toepassing van dit hoofdstuk de inhoudingsplichtige op het direct daar aan voorafgaande
      tijdstip geacht zijn vermogen te hebben uitgedeeld aan de deelgerechtigden tot dat vermogen naar de mate van hun
      gerechtigdheid.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel1
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '5'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0029244
        artikel: '1'
        hoofdstuk: I
  - number: 5.9.1
    text: |-
      De inhoudingsplichtige, degene bij wie de opbrengst is betaalbaar gesteld, het administratiekantoor dat de
      opbrengst doorbetaalt aan certificaathouders, of degene tot wiens beroep het kopen of innen van dividendbewijzen
      gewoonlijk behoort, is, zodra de opbrengst is uitbetaald, tegoedgeschreven, verrekend of uitgereikt, gehouden ten
      behoeve van de rechthebbende een gedagtekende nota uit te reiken waaruit blijkt de:
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.9
  - number: 5.9.1.a
    text: naam en het adres van degene die de nota uitreikt;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.9
  - number: 5.9.1.b
    text: naam en het adres van de rechthebbende;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.9
  - number: 5.9.1.c
    text: dag waarop de opbrengst ter beschikking is gesteld;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.9
  - number: 5.9.1.d
    text: omschrijving en het bedrag van de opbrengst; en
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.9
  - number: 5.9.1.e
    text: ingehouden belasting over de totale in de nota begrepen opbrengst.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.9
  - number: 5.9.2
    text: 'Degene die ingevolge het eerste lid gehouden is nota’s uit te reiken, is verplicht:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.9
  - number: 5.9.2.a
    text: de nota’s doorlopend te nummeren al dan niet in series; en
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.9
  - number: 5.9.2.b
    text: dubbelen van de nota’s te vervaardigen en gedurende vijf jaren op serie en nummer te bewaren.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.9
  - number: 5.9.3
    text: |-
      Van de in het eerste en tweede lid genoemde verplichtingen kan Onze Minister gehele of gedeeltelijke ontheffing
      verlenen. Aan deze ontheffing kunnen door Onze Minister voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel5.9
  - number: '6.1'
    text: |-
      In dit hoofdstuk en in de daarop gebaseerde bepalingen wordt verstaan onder: - *goederen:* alle lichamelijke zaken,
      alsmede water, elektriciteit, gas, warmte, koude en soortgelijke zaken;
        - *producent:* een ondernemer die in een openbaar lichaam goederen voortbrengt met behulp van grond- of hulpstoffen
      of van halffabricaten, voor zover hij de levering van de door hem voortgebrachte goederen niet verricht vanuit een
      inrichting die grotendeels is ingericht, bestemd en wordt gebruikt voor de verkoop van die goederen aan anderen
      dan ondernemers;
        - *handels- en dienstenentrepot:* handels- en dienstenentrepot als bedoeld in de Douane- en Accijnswet BES;
        - *douanewetgeving:* de [hoofdstukken I][ref1], [II][ref2] en [III van de Douane- en Accijnswet BES][ref3];
        - *douaneregime:* een in de douanewetgeving voorzien regime voor onder douanetoezicht geplaatste goederen;
        - *CO-uitstoot van een personenauto en een bestelauto:* de CO-uitstoot gemeten overeenkomstig bijlage XII bij
      Verordening (EG) nr. 692/2008 van de Commissie van 18 juli 2008 tot uitvoering en wijziging van Verordening
      (EG) nr. 715/2007 van het Europees Parlement en de Raad betreffende de type goedkeuring van motorvoertuigen met
      betrekking tot emissies van lichte personen- en bedrijfsvoertuigen (Euro 5 en Euro 6) en de toegang tot reparatie-
      en onderhoudsinformatie (PbEU 2008, L 199). Indien de meting mede met LPG of aardgas als brandstof is uitgevoerd,
      wordt de CO-uitstoot van de auto met LPG of aardgas als brandstofsoort gehanteerd;
        - *BES ondernemer:* een ondernemer die op de BES eilanden woont of is gevestigd dan wel aldaar een vaste inrichting
      heeft van waaruit een dienst wordt verricht, of die, bij gebreke van een dergelijke zetel of vaste inrichting, zijn
      woonplaats of gebruikelijke verblijfplaats op de BES eilanden heeft;
        - *elektriciteitsbedrijf:* een producent in de zin van
      [artikel 1.1 van de Wet elektriciteit en drinkwater BES][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0029236#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0029283#HoofdstukII
      [ref3]: https://wetten.overheid.nl/BWBR0029283#HoofdstukIII
      [ref4]: https://wetten.overheid.nl/BWBR0037861#Artikel1
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0029236
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0029283
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0029283
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0037861
        artikel: '1'
  - number: '6.2'
    text: 'Onder de naam algemene bestedingsbelasting wordt in een openbaar lichaam een belasting geheven ter zake van:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.2
  - number: 6.2.a
    text: |-
      de leveringen van door producenten voortgebrachte goederen welke in dat openbaar lichaam door producenten in het
      kader van hun onderneming onder bezwarende titel worden verricht;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.2
  - number: 6.2.b
    text: |-
      de leveringen van diensten, welke in dat openbaar lichaam door ondernemers in het kader van hun onderneming onder
      bezwarende titel worden verricht;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.2
  - number: 6.2.c
    text: de invoer van goederen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.2
  - number: '6.3'
    text: |-
      Onder bij ministeriële regeling te stellen voorwaarden kan op de belasting, verschuldigd ter zake van leveringen
      van goederen, door de producent in een tijdvak van aangifte in aftrek worden gebracht:
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.3
  - number: 6.3.a
    text: |-
      de belasting die in het tijdvak van aangifte is betaald ter zake van door andere producenten aan hem verrichte
      leveringen van goederen, mits de belasting in rekening is gebracht op een op de voorgeschreven wijze opgemaakte
      factuur;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.3
  - number: 6.3.b
    text: de door hem ter zake van invoer van goederen in het tijdvak van aangifte betaalde belasting;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.3
  - number: 6.4.1
    text: 'Leveringen van goederen zijn:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.4
  - number: 6.4.1.a
    text: de overdracht van goederen ingevolge een overeenkomst;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.4
  - number: 6.4.1.b
    text: de afgifte van goederen ingevolge een overeenkomst van huurkoop of financiële leasing;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.4
  - number: 6.4.1.c
    text: |-
      de rechtsovergang van goederen die het onderwerp uitmaken van een overeenkomst tot het aanbrengen van die goederen
      aan een ander goed;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.4
  - number: 6.4.1.d
    text: |-
      het beschikken over goederen voor andere dan bedrijfsdoeleinden, ten gevolge waarvan de goederen het
      bedrijfsvermogen van de producent verlaten;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.4
  - number: 6.4.1.e
    text: de rechtsovergang van goederen ingevolge een vordering door of namens de overheid;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.4
  - number: 6.4.1.f
    text: |-
      de oplevering van een als onroerende zaak aan te merken nieuw gebouw of nieuw werk, een nieuw gedeelte van een
      gebouw of werk daaronder begrepen, door degene die dat gebouw of werk heeft vervaardigd.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.4
  - number: 6.4.2
    text: |-
      Goederen welke worden geleverd en diensten welke worden verleend door tussenkomst van een commissionair of
      dergelijke ondernemer die overeenkomsten sluit op eigen naam maar op order en voor rekening van een ander, worden
      geacht aan en vervolgens door die ondernemer te zijn geleverd of verleend.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.4
  - number: '6.5'
    text: |-
      Diensten zijn alle prestaties, niet zijnde leveringen van goederen in de zin van [artikel 6.4][ref1], die tegen
      vergoeding worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel6
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '6'
        hoofdstuk: VI
        afdeling: '1'
  - number: 6.5a.1
    text: |-
      Bij overgang van het geheel of een gedeelte van een algemeenheid van goederen, al dan niet tegen vergoeding of
      in de vorm van een inbreng in een vennootschap, wordt geacht dat geen leveringen of diensten plaatsvinden en
      treedt, tenzij bij ministeriële regeling anders is bepaald, degene op wie de goederen overgaan in de plaats van
      de overdrager.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.5a
  - number: 6.5a.2
    text: |-
      Indien van een overgang als bedoeld in het tweede lid deel uitmaakt de levering van goederen die de overdrager
      als producent heeft voortgebracht, worden deze goederen voor de overdrager geacht te zijn belast als bedoeld in
      [artikel 6.3, aanhef en slot][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel6
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.5a
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '6'
        hoofdstuk: VI
  - number: 6.5a.3
    text: |-
      Degene op wie de goederen overgaan als bedoeld in het eerste lid, wordt voor de volgende levering van goederen, die
      door de overdrager als producent zijn voortgebracht, aangemerkt als producent van die goederen en voor zover van
      toepassing als vervaardiger van die goederen in de zin van [artikel 6.4, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel6
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.5a
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '6'
        hoofdstuk: VI
        afdeling: '1'
  - number: '6.6'
    text: 'De plaats waar een levering wordt verricht, is:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.6
  - number: 6.6.a
    text: |-
      indien het goed in verband met de levering, anders dan in de zin van [artikel 6.4, eerste lid, onderdeel c][ref1],
      wordt verzonden of vervoerd, de plaats waar de verzending of het vervoer aanvangt;


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel6
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '6'
        hoofdstuk: VI
        afdeling: '1'
  - number: 6.6.b
    text: in andere gevallen de plaats waar het goed zich bevindt op het tijdstip van de levering.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.6
  - number: 6.7.1
    text: |-
      Voor zover diensten worden verricht door een BES ondernemer aan een afnemer die in een openbaar lichaam is
      gevestigd of daar zijn woonplaats of gebruikelijke verblijfplaats heeft dan wel in dat openbaar lichaam de zetel
      van zijn bedrijfsuitoefening heeft gevestigd, is de plaats van die diensten gelegen in het openbaar lichaam van
      de dienstverrichter.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.7
  - number: 6.7.2
    text: |-
      In afwijking in zoverre van het eerste lid wordt de BES ondernemer voor de toepassing van de regels voor de plaats
      van dienst voor de hierna genoemde diensten niet aangemerkt als BES ondernemer:
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.7
  - number: 6.7.2.a
    text: andere diensten dan bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.7
  - number: 6.7.2.b
    text: diensten aan een buiten de BES eilanden gelegen vaste inrichting van een ondernemer;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.7
  - number: 6.7.2.c
    text: |-
      diensten die de BES ondernemer verricht vanuit een buiten de BES eilanden gelegen vaste inrichting van zijn
      onderneming.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.7
  - number: 6.7.3
    text: |-
      Voor zover op grond van de bepalingen van de [artikelen 6.7a tot en met 6.7j][ref1] niet een andere plaats
      van dienst wordt aangewezen, is ten aanzien van diensten verricht door een ondernemer, een andere dan een BES
      ondernemer, de plaats van dienst:


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel6
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.7
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '6'
        hoofdstuk: VI
        afdeling: '1'
  - number: 6.7.3.a
    text: |-
      verricht voor een als zodanig handelende ondernemer, de plaats waar die ondernemer de zetel van zijn
      bedrijfsuitoefening heeft gevestigd. Worden deze diensten evenwel verricht voor een vaste inrichting van de
      ondernemer op een andere plaats dan die waar hij de zetel van zijn bedrijfsuitoefening heeft gevestigd, dan geldt
      als plaats van dienst de plaats waar deze vaste inrichting zich bevindt. Bij gebreke van een dergelijke zetel of
      vaste inrichting, geldt als plaats van de dienst de woonplaats of gebruikelijke verblijfplaats van de ondernemer
      die deze diensten afneemt;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.7
  - number: 6.7.3.b
    text: |-
      verricht voor een andere dan ondernemer, de plaats waar de dienstverrichter de zetel van zijn bedrijfsuitoefening
      heeft gevestigd. Worden deze diensten evenwel verricht vanuit een vaste inrichting van de dienstverrichter, op
      een andere plaats dan die waar hij de zetel van zijn bedrijfsuitoefening heeft gevestigd, dan geldt als plaats van
      dienst de plaats waar deze vaste inrichting zich bevindt. Bij gebreke van een dergelijke zetel of vaste inrichting,
      geldt als plaats van de diensten de woonplaats of de gebruikelijke verblijfplaats van de dienstverrichter.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.7
  - number: 6.7a
    text: |-
      De plaats van een dienst die voor andere dan ondernemers wordt verricht door een tussenpersoon die in naam en voor
      rekening van derden handelt, is de plaats waar de onderliggende handeling overeenkomstig de bepalingen van dit
      hoofdstuk wordt verricht.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.7a
  - number: 6.7b
    text: |-
      De plaats van een door een ondernemer, een andere dan een BES ondernemer, verrichte dienst die betrekking heeft op
      een onroerende zaak, met inbegrip van diensten van experts en makelaars in onroerende zaken, het verstrekken van
      accommodatie in het hotelbedrijf of in sectoren met een soortgelijke functie, zoals vakantiekampen of locaties die
      zijn ontwikkeld voor gebruik als kampeerterreinen, het verlenen van gebruiksrechten op een onroerende zaak, alsmede
      van diensten die erop gericht zijn de uitvoering van bouwwerken voor te bereiden of te coördineren, zoals de
      diensten verricht door architecten en door bureaus die toezicht houden op de uitvoering van het werk, is de plaats
      waar de onroerende zaak is gelegen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.7b
  - number: 6.7c
    text: |-
      De plaats van vervoerdiensten verricht door een ondernemer, een andere dan een BES ondernemer, is de plaats waar
      het vervoer plaatsvindt, zulks naar verhouding van de afgelegde afstanden.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.7c
  - number: 6.7d
    text: |-
      De plaats van een door een ondernemer, een andere dan een BES ondernemer, voor een ondernemer verrichte dienst
      bestaande in het verlenen van toegang tot culturele, artistieke, sportieve, wetenschappelijke, educatieve,
      vermakelijkheids- of soortgelijke evenementen, zoals beurzen en tentoonstellingen, en met de toegangverlening
      samenhangende diensten, is de plaats waar deze evenementen daadwerkelijk plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.7d
  - number: 6.7e.1
    text: |-
      De plaats van door een ondernemer, een andere dan een BES ondernemer, voor een andere dan ondernemer verrichte
      diensten en van daarmee samenhangende diensten, in verband met culturele, artistieke, sportieve, wetenschappelijke,
      educatieve, vermakelijkheids- of soortgelijke activiteiten, zoals beurzen en tentoonstellingen, inclusief
      de dienstverrichtingen van de organisatoren van dergelijke activiteiten, is de plaats waar die activiteiten
      daadwerkelijk plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.7e
  - number: 6.7e.2
    text: |-
      De plaats van de volgende door een ondernemer, een andere dan een BES ondernemer, verrichte diensten die voor
      andere dan ondernemers worden verricht, is de plaats waar die diensten daadwerkelijk worden verricht:
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.7e
  - number: 6.7e.2.a
    text: activiteiten die met vervoer samenhangen, zoals laden, lossen, intern vervoer en soortgelijke activiteiten;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.7e
  - number: 6.7e.2.b
    text: deskundigenonderzoeken en werkzaamheden met betrekking tot roerende lichamelijke zaken.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.7e
  - number: 6.7f
    text: |-
      De plaats van door een ondernemer, een andere dan een BES ondernemer, verrichte restaurant- en cateringdiensten is
      de plaats waar die diensten materieel worden verricht.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.7f
  - number: 6.7g.1
    text: |-
      De plaats van dienst van kortdurende en andere dan kortdurende verhuur van een vervoermiddel, verricht door een
      ondernemer, een andere dan een BES ondernemer, is de plaats waar dat vervoermiddel daadwerkelijk ter beschikking
      van de afnemer wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.7g
  - number: 6.7g.2
    text: |-
      In afwijking van het eerste lid is de plaats van dienst van andere dan kortdurende verhuur van een vervoermiddel
      bij verhuur aan:
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.7g
  - number: 6.7g.2.a
    text: |-
      een andere dan een ondernemer die gevestigd is of woont in de Unie, genoemd in
      [artikel 2a, eerste lid, onderdeel c, van de Wet op de omzetbelasting 1968][ref1], de plaats waar die afnemer
      gevestigd is of woont;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel2a
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.7g
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 2a
  - number: 6.7g.2.b
    text: |-
      een ondernemer die de zetel van zijn bedrijfsuitoefening heeft in de Unie, genoemd in onderdeel a, of in die
      Unie over een vaste inrichting beschikt die de dienst afneemt, of, bij gebreke van een dergelijke zetel of vaste
      inrichting, zijn woonplaats of gebruikelijke verblijfplaats in die Unie heeft, de plaats waar die afnemer de zetel
      van zijn bedrijfsuitoefening heeft gevestigd, of zijn woonplaats of gebruikelijke verblijfplaats heeft.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.7g
  - number: 6.7g.3
    text: |-
      In afwijking van het eerste en tweede lid is de plaats van dienst van andere dan kortdurende verhuur van een
      pleziervaartuig aan een afnemer, een andere dan een in het tweede lid, onderdeel b, bedoelde ondernemer, de plaats
      waar het pleziervaartuig effectief ter beschikking van de afnemer wordt gesteld, indien deze dienst daadwerkelijk
      door de dienstverrichter wordt verricht vanuit de zetel van zijn bedrijfsuitoefening of een vaste inrichting
      aldaar.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.7g
  - number: 6.7g.4
    text: |-
      Voor de toepassing van dit artikel wordt onder «kortdurende verhuur» verstaan: het ononderbroken bezit of gebruik
      van het vervoermiddel gedurende een periode van ten hoogste dertig dagen, en voor schepen ten hoogste negentig
      dagen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.7g
  - number: 6.7h.1
    text: |-
      De plaats van dienst van de volgende diensten die door een ondernemer, een andere dan een BES ondernemer, worden
      verricht voor een andere dan een ondernemer, is de plaats waar de afnemer gevestigd is of zijn woonplaats of
      gebruikelijke verblijfplaats heeft:
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.7h
  - number: 6.7h.1.a
    text: |-
      telecommunicatiediensten als bedoeld in
      [artikel 2a, eerste lid, onderdeel r, van de Wet op de omzetbelasting 1968][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel2a
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.7h
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 2a
  - number: 6.7h.1.b
    text: radio- en televisieomroepdiensten;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.7h
  - number: 6.7h.1.c
    text: |-
      elektronische diensten als bedoeld in
      [artikel 2a, eerste lid, onderdeel q, van de Wet op de omzetbelasting 1968][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel2a
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.7h
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 2a
  - number: 6.7h.2
    text: |-
      Het feit dat de dienstverrichter en de afnemer langs elektronische weg berichten uitwisselen, betekent op zich niet
      dat de verrichte dienst een elektronische dienst is.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.7h
  - number: 6.7i.1
    text: |-
      De plaats van de volgende diensten, verricht voor een andere dan ondernemer die buiten de BES eilanden gevestigd
      is of aldaar zijn woonplaats of gebruikelijke verblijfplaats heeft, is de plaats waar deze persoon gevestigd is of
      zijn woonplaats of gebruikelijke verblijfplaats heeft:
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.7i
  - number: 6.7i.1.a
    text: |-
      de overdracht en het verlenen van auteursrechten, octrooien, licentierechten, handelsmerken en soortgelijke
      rechten;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.7i
  - number: 6.7i.1.b
    text: diensten op het gebied van de reclame;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.7i
  - number: 6.7i.1.c
    text: |-
      diensten verricht door raadgevende personen, ingenieurs, adviesbureaus, advocaten, accountants en andere
      soortgelijke diensten, alsmede gegevensverwerking en informatieverschaffing;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.7i
  - number: 6.7i.1.d
    text: |-
      de verplichting om een beroepsactiviteit of een in dit artikel vermeld recht geheel of gedeeltelijk niet uit te
      oefenen;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.7i
  - number: 6.7i.1.e
    text: |-
      bank-, financiële en verzekeringsverrichtingen met inbegrip van herverzekeringsverrichtingen en met uitzondering
      van de verhuur van safeloketten;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.7i
  - number: 6.7i.1.f
    text: het beschikbaar stellen van personeel;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.7i
  - number: 6.7i.1.g
    text: de verhuur van roerende lichamelijke zaken, met uitzondering van alle vervoermiddelen;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.7i
  - number: 6.7i.1.h
    text: |-
      het bieden van toegang tot aardgas- en elektriciteitsdistributiesystemen alsmede het verrichten van transport- en
      transmissiediensten via deze systemen en het verrichten van andere daarmee rechtstreeks verbonden diensten.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.7i
  - number: 6.7i.2
    text: |-
      In afwijking van het eerste lid worden de diensten, genoemd in dat lid, die worden verricht voor een andere dan
      ondernemer, verricht in een openbaar lichaam, wanneer het werkelijk gebruik en de werkelijke exploitatie in dat
      openbaar lichaam plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.7i
  - number: 6.7j
    text: |-
      Diensten als bedoeld in [artikel 6.7i, eerste lid, onderdelen a tot en met g][ref1], die worden verricht voor in
      een openbaar lichaam gevestigde lichamen in de zin van deze wet, andere dan ondernemers, die worden verricht door
      ondernemers die buiten de BES eilanden wonen of zijn gevestigd dan wel aldaar een vaste inrichting hebben van
      waaruit de dienst wordt verricht, of die, bij gebreke van een dergelijke zetel of vaste inrichting, hun woonplaats
      of gebruikelijke verblijfplaats buiten de BES eilanden hebben, en waarvan de plaats van die diensten buiten de BES
      eilanden is gelegen, worden aangemerkt als worden zij in het openbaar lichaam van de afnemer verricht, wanneer het
      werkelijke gebruik en de werkelijke exploitatie in dat openbaar lichaam plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel6
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.7j
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '6'
        hoofdstuk: VI
        afdeling: '1'
  - number: 6.7k
    text: |-
      Voor de toepassing van de regels voor de plaats van dienst in dit hoofdstuk en de daarop
      gebaseerde bepalingen wordt een ondernemer die ook werkzaamheden verricht die overeenkomstig
      [artikel 7, zevende lid, onderdeel a, van de Wet op de omzetbelasting 1968][ref1] niet als belastbare
      goederenleveringen of diensten worden beschouwd, met betrekking tot alle voor hem verrichte diensten als ondernemer
      aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel7
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.7k
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '7'
  - number: 6.7l
    text: |-
      Bij ministeriële regeling kan, om dubbele heffing of niet-heffing te voorkomen en onder daarbij te stellen
      regels, voor de diensten, bedoeld in de [artikelen 6.7 tot en met 6.7j][ref1], een andere plaats van dienst worden
      aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel6
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.7l
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '6'
        hoofdstuk: VI
        afdeling: '1'
  - number: 6.8.1
    text: |-
      Ondernemer is een ieder die een bedrijf of beroep zelfstandig uitoefent, alsmede een ieder die een
      vermogensbestanddeel exploiteert om er duurzaam opbrengst uit te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.8
  - number: 6.8.2
    text: |-
      Bij ministeriële regeling kan worden bepaald dat publiekrechtelijke lichamen die, anders dan als ondernemer,
      prestaties verrichten welke uit hun aard ook door ondernemers kunnen worden verricht, met betrekking tot die
      prestaties als ondernemer worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.8
  - number: 6.9.1
    text: De belasting wordt berekend over de vergoeding.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.9
  - number: 6.9.2
    text: |-
      De vergoeding is het totale bedrag – of voor zover de tegenprestatie niet in een geldsom bestaat, de totale
      waarde van de tegenprestatie welke – ter zake van de levering of de dienst in rekening wordt gebracht, de algemene
      bestedingsbelasting niet daaronder begrepen. Indien ter zake van de levering of de dienst meer wordt voldaan dan
      hetgeen in rekening is gebracht, komt in plaats daarvan in aanmerking hetgeen is voldaan. Als de vergoeding minder
      bedraagt dan de waarde in het economisch verkeer van de verrichte prestatie, wordt de vergoeding gesteld op die
      waarde.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.9
  - number: 6.9.3
    text: |-
      Door de ondernemer verschuldigde belastingen en andere heffingen, die aan de afnemer afzonderlijk in rekening
      worden gebracht, behoren niet tot de vergoeding.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.9
  - number: 6.9.4
    text: |-
      De vergoeding voor het bepalen van de verschuldigde belasting wordt in geval van een levering als bedoeld in
      [artikel 6.4, eerste lid, onderdeel d][ref1], gesteld op het bedrag, de algemene bestedingsbelasting niet
      daaronder begrepen, dat voor de goederen zou worden ontvangen, indien deze op het tijdstip van de levering zouden
      worden aangeschaft in de toestand waarin zij zich op dat tijdstip bevinden.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel6
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.9
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '6'
        hoofdstuk: VI
        afdeling: '1'
  - number: 6.9.5
    text: |-
      Indien gegevens voor het bepalen van de vergoeding zijn uitgedrukt in een andere munteenheid dan die van de BES
      eilanden, wordt de wisselkoers vastgesteld overeenkomstig de laatst genoteerde verkoopkoers op het tijdstip waarop
      de belasting verschuldigd wordt.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.9
  - number: 6.10.1
    text: De belasting bedraagt 8 percent.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.10
  - number: 6.10.2
    text: 'In afwijking van het eerste lid bedraagt de belasting:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.10
  - number: 6.10.2.a
    text: |-
      6 percent ter zake van het verrichten van diensten, en in uitzondering daarop, 7 percent ter zake van
      verzekeringen;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.10
  - number: 6.10.2.b
    text: 25 percent voor personenauto’s en bestelauto’s met een CO-uitstoot;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.10
  - number: 6.10.2.c
    text: nihil voor personenauto’s en bestelauto’s zonder een CO-uitstoot;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.10
  - number: 6.10.2.d
    text: |-
      nihil voor leveringen van hierna genoemde goederen, mits is voldaan aan bij ministeriële regeling te stellen
      voorwaarden:
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.10
  - number: 6.10.2.d.1°
    text: van buiten een openbaar lichaam komende goederen die niet zijn ingevoerd;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.10
  - number: 6.10.2.d.2°
    text: |-
      goederen welke door een producent worden: - uitgevoerd uit een openbaar lichaam, daaronder mede begrepen uitvoer
      uit een in een openbaar lichaam ingesteld handels- en dienstenentrepot;
        - gebracht onder een douaneregime;
        - ingeslagen in een openbaar lichaam ingesteld handels- en dienstenentrepot, voor zover die goederen bestemd zijn
      voor uitvoer;
        - worden geleverd aan een in een handels- en dienstenentrepot gevestigde ondernemer, voor zover die goederen
      bestemd zijn voor uitvoer;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.10
  - number: 6.10.2.e
    text: |-
      nihil voor de (op)levering en installatie van niet-geïntegreerde zonnepanelen en geïntegreerde zonnepanelen welke
      als dakbedekking dienen, mits zij bij een elektriciteitsbedrijf (op)geleverd en geïnstalleerd worden; hetzelfde
      geldt voor bij ministeriële regeling aangewezen producten die bestemd zijn om daarop aangesloten te worden, ook
      indien zij apart geleverd en geïnstalleerd worden;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.10
  - number: 6.10.2.f
    text: |-
      nihil voor de (op)levering en installatie van windturbines, mits zij bij een elektriciteitsbedrijf (op)geleverd
      en geïnstalleerd worden; hetzelfde geldt voor speciaal voor windturbines ontworpen of aangepaste onderdelen, ook
      indien zij apart geleverd en geïnstalleerd worden.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.10
  - number: 6.10.3
    text: |-
      Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt bij de (op)levering van een (nieuw)
      gebouw, de levering en installatie van geïntegreerde zonnepanelen en -collectoren welke als dakbedekking dienen,
      inclusief bij ministeriële regeling aangewezen producten die daarop aangesloten zijn, geacht afsplitsbaar te zijn
      van het (nieuwe) gebouw.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.10
  - number: 6.10a.1
    text: |-
      In afwijking van [artikel 6.10, eerste en tweede lid, onderdelen a en b][ref1], bedraagt in de openbare lichamen
      Sint Eustatius en Saba:


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel6
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.10a
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '6'
        hoofdstuk: VI
        afdeling: '2'
  - number: 6.10a.1.a
    text: 'de in dat eerste lid bedoelde belasting: 6 percent;'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.10a
  - number: 6.10a.1.b
    text: |-
      de in dat tweede lid, onderdeel a, bedoelde belasting: 4 percent en in uitzondering daarop, 5 percent ter zake
      van verzekeringen;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.10a
  - number: 6.10a.1.c
    text: |-
      de in dat tweede lid, onderdeel b, bedoelde belasting 18, 22 of 30 percent, berekend aan de hand van de volgende
      tabel:








                        Bij een vergoeding voor de auto van meer dan


                        maar niet meer dan


                        bedraagt de belasting in kolom III vermelde bedrag dat wordt vermeerderd met het in kolom IV
      vermelde percentage te nemen van het gedeelte van het belastbare bedrag dat het in kolom I vermelde bedrag te boven
      gaat




                        I


                        II


                        III


                        IV







                        USD 20 000



                        18 percent




                        USD 20 000


                        USD 30 000


                        USD 3 600


                        22 percent




                        USD 30 000



                        USD 5 800


                        30 percent
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.10a
  - number: 6.10a.2
    text: |-
      In afwijking in zoverre van het eerste lid, onderdeel c, geldt voor het in dat onderdeel opgenomen percentage van
      18 voor niet gebruikte personenauto’s en bestelauto’s een percentage van 10 en gelden voor de in de derde kolom
      opgenomen bedragen van USD 3 600 en USD 5 800 bedragen van USD 2 000 en USD 4 200.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.10a
  - number: 6.11.1
    text: 'Onder bij ministeriële regeling vast te stellen voorwaarden en beperkingen zijn van de belasting vrijgesteld:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.11
  - number: 6.11.1.a
    text: |-
      de levering van eerste levensbehoeften, voor zover behorend tot bij ministeriële
      regeling aan te wijzen hoofdstukken of posten van het geharmoniseerde systeem, genoemd in
      [artikel 3.1 tweede lid, onderdeel a, van de Douane- en Accijnswet BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0029236#Artikel3
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.11
    references:
      - id: ref1
        bwb_id: BWBR0029236
        artikel: '3'
  - number: 6.11.1.b
    text: |-
      de diensten bestaande uit het verzorgen van het openbaar personenvervoer over de weg, schoolbusdiensten daaronder
      mede begrepen;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.11
  - number: 6.11.1.c
    text: |-
      de diensten die door ziekenhuizen, laboratoria voor medisch onderzoek, artsen, tandartsen, tandtechnici, verpleeg-
      en verloskundigen, fysio- en oefentherapeuten, chiropractors, logopedisten, diëtisten, podotherapeuten en
      psychologen als zodanig worden verricht;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.11
  - number: 6.11.1.d
    text: |-
      de levering van geneesmiddelen voor menselijk gebruik op recept van een arts in de zin van het
      [Besluit geneeskunde BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028449
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.11
    references:
      - id: ref1
        bwb_id: BWBR0028449
  - number: 6.11.1.e
    text: |-
      de levering van medische kunst- en hulpmiddelen, waarbij onder medische kunst- en hulpmiddelen worden verstaan
      orthopedische artikelen en toestellen – daaronder begrepen medisch-chirurgische gordels en banden alsmede krukken
      – kunstgebitten, kunsttanden, kunstogen, kunstledematen en dergelijke artikelen, hoorapparaten voor hardhorigen,
      breukspalken en andere artikelen en apparaten voor de behandeling van breuken in het beendergestel;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.11
  - number: 6.11.1.f
    text: de verzorging van niet-commercieel onderwijs;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.11
  - number: 6.11.1.g
    text: |-
      de verzorging van postzendingen die de houder van de concessie ingevolge het bepaalde bij en krachtens
      [artikel 2, tweede lid, van de Wet post BES][ref1], verplicht is te vervoeren;


      [ref1]: https://wetten.overheid.nl/BWBR0028263
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.11
    references:
      - id: ref1
        bwb_id: BWBR0028263
  - number: 6.11.1.h
    text: |-
      de levering van water, elektriciteit en gas door waterleidings-, elektriciteits- en gasbedrijven alsmede de
      levering van brandstoffen voor de opwekking van energie aan die bedrijven;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.11
  - number: 6.11.1.i
    text: |-
      de (op)levering en installatie van niet-geïntegreerde zonnepanelen en -collectoren en geïntegreerde zonnepanelen
      en -collectoren welke als dakbedekking dienen, mits zij bij een ander dan een elektriciteitsbedrijf (op)geleverd
      en geïnstalleerd worden; hetzelfde geldt voor bij ministeriële regeling aangewezen producten die bestemd zijn om
      daarop aangesloten te worden, ook indien zij apart geleverd en geïnstalleerd worden;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.11
  - number: 6.11.1.j
    text: |-
      de (op)levering en installatie van windturbines, mits zij bij een ander dan een elektriciteitsbedrijf (op)geleverd
      en geïnstalleerd worden; hetzelfde geldt voor speciaal voor windturbines ontworpen of aangepaste onderdelen, ook
      indien zij apart geleverd en geïnstalleerd worden;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.11
  - number: 6.11.1.k
    text: |-
      de levering van een onroerende zaak, een andere dan een nieuw vervaardigd gebouw of werk als bedoeld in
      [artikel 6.4, eerste lid, onderdeel f][ref1], en het bij dat gebouw of werk behorende terrein, indien ter zake
      van die levering overdrachtsbelasting verschuldigd is;


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel6
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.11
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '6'
        hoofdstuk: VI
        afdeling: '1'
  - number: 6.11.1.l
    text: |-
      de levensverzekeringen, ziektekostenverzekeringen en herverzekeringen door verzekeringsmaatschappijen, alsmede de
      diensten door tussenpersonen bij verzekeringen, waarbij onder levensverzekering wordt verstaan een verzekering die
      uitsluitend of nagenoeg uitsluitend ten doel heeft een of meerdere termijnen van uitkering te verzorgen, en welke
      afhankelijk is van het leven van de verzekerde, daaronder mede begrepen uitvaartverzekeringen, ongeacht de wijze
      van uitkering;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.11
  - number: 6.11.1.m
    text: |-
      de verhuur in een openbaar lichaam van hotelkamers en appartementen, indien in dat
      openbaar lichaam ter zake van die diensten een toeristenbelasting als bedoeld in
      [artikel 53 van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref1], verschuldigd is op
      grond van een eilandsverordening;


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel53
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.11
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '53'
  - number: 6.11.1.n
    text: |-
      de kansspelen in de zin van [artikel 7a.2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel7a
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.11
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: 7a
        hoofdstuk: VIIa
  - number: 6.11.1.o
    text: |-
      het ter beschikking stellen en uitlenen van gelden, en de diensten, bemiddeling daaronder begrepen, doch met
      uitzondering van bewaring en beheer, betreffende waardepapieren, bank- en muntbiljetten en munten die in enige
      staat de hoedanigheid van wettig betaalmiddel bezitten, met uitzondering van bankbiljetten en munten, welke
      gewoonlijk niet als wettig betaalmiddel worden gebruikt of welke een verzamelwaarde hebben, waarbij onder
      waardepapieren niet wordt verstaan documenten die goederen vertegenwoordigen, rechten op onroerende zaken, de
      zakelijke rechten die aan de rechthebbende de bevoegdheid verschaffen om een onroerende zaak te gebruiken en
      de deelbewijzen en aandelen waarvan het bezit rechtens of in feite recht geven op eigendom of het genot van een
      onroerende zaak of een deel daarvan;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.11
  - number: 6.11.1.p
    text: |-
      de leveringen van goederen en het verlenen van diensten aan beroepsconsuls en andere beroepsvertegenwoordigers
      van vreemde mogendheden, de hun toegevoegde ambtenaren en de bij hen inwonende en in dienst zijnde personen, allen
      mits zij vreemdeling zijn en overigens op het grondgebied van een openbaar lichaam geen ondernemer zijn en onder
      voorwaarde van wederkerigheid;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.11
  - number: 6.11.1.q
    text: de vervoersdiensten door middel van luchtvaartuigen of zeeschepen;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.11
  - number: 6.11.1.r
    text: |-
      de diensten die in een zee- of luchthavengebied in een openbaar lichaam worden verricht met betrekking tot
      aldaar nog niet ingevoerde binnenkomende goederen en uitgaande goederen, en de diensten ten behoeve van
      zeeschepen en luchtvaartuigen die als openbaar vervoermiddel worden gebruikt voor personen- of goederenvervoer,
      oorlogsluchtvaartuigen daaronder begrepen, waarbij onder zeeschepen worden verstaan alle vaartuigen, gebruikt of
      geschikt om te worden gebruikt als middel van vervoer te water met uitzondering van pleziervaartuigen;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.11
  - number: 6.11.1.s
    text: |-
      de leveringen van brandstoffen, smeermiddelen en andere vloeistoffen, bestemd voor de voortstuwing, smering
      en ander technisch gebruik aan boord van zeeschepen en luchtvaartuigen als bedoeld in onderdeel p, alsmede de
      leveringen van goederen welke zijn bestemd voor de bevoorrading van uitgaande:
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.11
  - number: 6.11.1.s.1°
    text: |-
      zeeschepen waarmee enigerlei economische activiteit wordt verricht, met uitzondering van schepen voor de
      kustvisserij;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.11
  - number: 6.11.1.s.2°
    text: |-
      reddingsboten, schepen voor hulpverlening op zee of schepen voor de kustvisserij, met uitzondering van voor
      laatstgenoemde schepen bestemde scheepsproviand;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.11
  - number: 6.11.1.s.3°
    text: oorlogschepen met als bestemming een haven of ankerplaats buiten een openbaar lichaam;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.11
  - number: 6.11.1.s.4°
    text: luchtvaartuigen;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.11
  - number: 6.11.1.t
    text: |-
      de diensten, als bedoeld in [artikel 5.2, eerste lid van de Douane en Accijnswet BES][ref1] die door een in een
      handels- en dienstenentrepot gevestigde ondernemer als zodanig worden verricht;


      [ref1]: https://wetten.overheid.nl/BWBR0029236#Artikel5
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.11
    references:
      - id: ref1
        bwb_id: BWBR0029236
        artikel: '5'
  - number: 6.11.1.u
    text: |-
      leveringen van goederen aan een in een handels- en dienstenentrepot gevestigde ondernemer, voor zover die goederen
      worden gebruikt ten behoeve van de in dat entrepot aanwezige goederen en bedrijfsmiddelen van die ondernemer;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.11
  - number: 6.11.1.v
    text: |-
      de diensten die worden verricht aan een in een handels- en dienstenentrepot gevestigde ondernemer, uitsluitend
      voor zover die diensten verricht worden ten behoeve van de in een handels- en dienstenentrepot wettelijk toegelaten
      activiteiten of ten behoeve van zijn in dat entrepot aanwezige goederen en bedrijfsmiddelen;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.11
  - number: 6.11.1.w
    text: |-
      het verzorgen en verplegen van in een inrichting opgenomen personen, alsmede het verstrekken van spijzen
      en dranken, geneesmiddelen en verbandmiddelen aan die personen, alsmede diensten door verzorgings- en
      bejaardentehuizen voor zover deze diensten zien op de huisvesting en verzorging van de bewoners;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.11
  - number: 6.11.1.x
    text: |-
      de verhuur aan in een openbaar lichaam woonachtige particulieren van onroerende zaken, welke zijn ingericht,
      bestemd en worden gebruikt voor permanente bewoning;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.11
  - number: 6.11.1.y
    text: |-
      leveringen van goederen en het verrichten van diensten voor projecten voor zover die in het kader van onderlinge
      hulp voor rekening van Aruba, Curaçao of Sint Maarten komen, dan wel in het kader van ontwikkelingshulp voor
      rekening van internationale organisaties komen;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.11
  - number: 6.11.1.z
    text: |-
      de opvang van kinderen in kinderopvang, zijnde het bedrijfsmatig of anders dan om niet verzorgen, opvoeden en
      bijdragen aan de ontwikkeling van kinderen tot de eerste dag van de maand waarop het voortgezet onderwijs voor die
      kinderen begint, indien het betreft kinderopvang in een geregistreerd kindercentrum, alsmede de opvang van kinderen
      in een organisatie die gastouderopvang tot stand brengt en begeleidt en door tussenkomst waarvan de betaling door
      ouders aan gastouders geschiedt, met dien verstande dat tot kinderopvang of gastouderopvang niet worden gerekend:
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.11
  - number: 6.11.1.z.1°
    text: het toezicht op schoolgaande kinderen dat zich beperkt tot het toezicht tijdens de middagpauze;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.11
  - number: 6.11.1.z.2°
    text: |-
      de verzorging, de opvoeding en de bijdrage aan de ontwikkeling van kinderen, anders dan gastouderopvang, die
      geschiedt op een plaats waar het kind zijn hoofdverblijf heeft.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.11
  - number: 6.11.2
    text: |-
      Om dubbele heffing van de belasting of om concurrentieverstoring te voorkomen kunnen bij ministeriële regeling,
      onder daarbij te stellen voorwaarden en beperkingen, andere dan de in het eerste lid genoemde leveringen van
      goederen en diensten van de belasting worden vrijgesteld.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.11
  - number: 6.11.3
    text: |-
      Voor de toepassing van het eerste lid, onderdeel h, wordt met elektriciteitsbedrijven gelijkgesteld eenieder die
      hernieuwbare elektriciteit produceert met behulp van een installatie, die hoofdzakelijk produceert voor eigen
      gebruik en de geproduceerde elektriciteit die niet wordt verbruikt levert aan het elektriciteitsnet.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.11
  - number: 6.12.1
    text: De belasting wordt geheven van de ondernemer die de levering of de dienst verricht.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.12
  - number: 6.12.2
    text: |-
      Indien de producent die de levering verricht of de ondernemer, een andere dan een BES ondernemer, die de dienst
      verricht niet in het openbaar lichaam van zijn afnemer woont of is gevestigd en aldaar geen vaste inrichting heeft
      van waaruit de levering of de dienst wordt verricht, en degene aan wie de levering wordt verricht of de dienst
      wordt verleend, een ondernemer is die in dat openbaar lichaam woont of is gevestigd dan wel aldaar een vaste
      inrichting heeft, of een in een openbaar lichaam gevestigd lichaam, wordt de belasting geheven van degene aan wie
      de levering wordt verricht of de dienst wordt verleend.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.12
  - number: 6.12.3
    text: |-
      Voor de toepassing van dit artikel wordt een ondernemer die een vaste inrichting heeft in een openbaar lichaam,
      geacht een niet in dat openbaar lichaam gevestigde ondernemer te zijn wanneer aan de volgende voorwaarden is
      voldaan:
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.12
  - number: 6.12.3.a
    text: hij verricht in het openbaar lichaam een belastbare goederenlevering of een dienst;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.12
  - number: 6.12.3.b
    text: |-
      bij het verrichten van die goederenlevering of die dienst is de vaste inrichting in het openbaar lichaam niet
      betrokken.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.12
  - number: 6.12.4
    text: |-
      In bij ministeriële regeling aan te wijzen gevallen wordt onder bij deze regeling te stellen bepalingen de
      belasting, ten einde voor de inning daarvan meer waarborgen te scheppen, geheven van degene aan wie de levering
      wordt verricht of de dienst wordt verleend.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.12
  - number: '6.13'
    text: |-
      In afwijking in zoverre van [artikel 6.12, eerste lid][ref1], is de belasting ter zake van verzekeringen die worden
      afgesloten bij een niet in het openbaar lichaam van de afnemer gevestigde verzekeringsmaatschappij, verschuldigd
      door de tussenpersoon bij die verzekering.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel6
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.13
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '6'
        hoofdstuk: VI
        afdeling: '4'
  - number: 6.14.1
    text: 'De belasting wordt verschuldigd:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.14
  - number: 6.14.1.a
    text: |-
      in gevallen waarin een factuur moet worden uitgereikt, op het tijdstip van de uitreiking of, indien deze niet
      tijdig plaatsvindt, het tijdstip waarop zij uiterlijk had moeten geschieden;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.14
  - number: 6.14.1.b
    text: in andere gevallen op het tijdstip waarop de levering of de dienst wordt verricht.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.14
  - number: 6.14.2
    text: |-
      In afwijking in zoverre van het eerste lid wordt de belasting of het desbetreffende gedeelte daarvan uiterlijk
      verschuldigd op het tijdstip waarop de vergoeding geheel of gedeeltelijk wordt ontvangen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.14
  - number: 6.14.3
    text: |-
      Iedere producent die leveringen van goederen verricht als bedoeld in [artikel 6.2, onderdeel a][ref1], aan een
      andere ondernemer reikt aan die ondernemer een doorlopend genummerde en gedagtekende factuur als bedoeld in
      [artikel 8.89a, eerste lid][ref2], uit.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.14
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '6'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
  - number: 6.14.4
    text: |-
      De producent moet de in het derde lid bedoelde factuur uitreiken binnen vijftien dagen na de maand waarin de
      levering is verricht. De producent is verplicht een kopie van de uitgereikte factuur op te maken.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.14
  - number: 6.14.5
    text: |-
      Indien een producent met een andere ondernemer is overeengekomen dat de vergoeding voor de door hem te verrichten
      prestatie vooraf of in gedeelten zal worden voldaan, is hij op verzoek van zijn afnemer verplicht, in afwijking
      in zoverre van het vierde lid, ter zake van die betaling of deelbetalingen vóór het tijdstip van de opeisbaarheid
      daarvan telkens een overeenkomstig het derde lid opgemaakte factuur uit te reiken.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.14
  - number: 6.14.6
    text: |-
      Voor de toepassing van het eerste lid, onderdeel b, worden de diensten waarvan de belasting op grond van
      [artikel 6.12, tweede lid][ref1], verschuldigd is door de afnemer van deze diensten en die doorlopend worden
      verricht gedurende een periode langer dan één jaar geacht bij de afloop van elk kalenderjaar te zijn voltooid
      zolang de dienstverrichting doorloopt en die geen aanleiding geven tot afrekeningen of betalingen in die periode.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel6
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.14
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '6'
        hoofdstuk: VI
        afdeling: '4'
  - number: 6.14.7
    text: |-
      Ieder die enig document uitreikt waarop een bedrag aan algemene bestedingsbelasting wordt vermeld welke hij, anders
      dan op grond van dit artikel niet verschuldigd is geworden, wordt die belasting verschuldigd op het tijdstip dat
      hij het document heeft uitgereikt. Hij is verplicht deze belasting op de voet van [artikel 6.15][ref1] te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel6
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.14
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '6'
        hoofdstuk: VI
        afdeling: '4'
  - number: 6.14.8
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.14
  - number: 6.15.1
    text: De in een tijdvak verschuldigde belasting moet op aangifte worden voldaan.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.15
  - number: 6.15.2
    text: |-
      Indien de op grond van [artikel 6.3][ref1] voor aftrek in aanmerking komende belasting meer bedraagt dan de in
      het tijdvak verschuldigd geworden belasting, wordt, onder bij ministeriële regeling te stellen voorwaarden en
      beperkingen, het verschil aan de producent op zijn verzoek terugbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel6
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.15
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '6'
        hoofdstuk: VI
  - number: 6.15.3
    text: |-
      Een verzoek om teruggaaf van belasting geschiedt bij de aangifte over het tijdvak waarin het recht op teruggaaf
      is ontstaan. In gevallen waarin geen aangifte op de voet van het eerste lid moet worden ingediend, geschiedt een
      verzoek om teruggaaf door het doen van aangifte.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.15
  - number: 6.15.4
    text: De inspecteur beslist op het verzoek om teruggaaf bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.15
  - number: 6.15.5
    text: |-
      De inspecteur kan onder door hem te stellen voorwaarden een vereenvoudigde wijze van het doen van aangifte
      toestaan.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.15
  - number: '6.16'
    text: |-
      De inspecteur is bevoegd op schriftelijk verzoek bij voor bezwaar vatbare beschikking teruggaaf te verlenen van de
      belasting ter zake van leveringen en diensten, voor zover de ondernemer aannemelijk maakt dat:
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.16
  - number: 6.16.a
    text: de vergoeding geheel of gedeeltelijk niet is en niet zal worden ontvangen;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.16
  - number: 6.16.b
    text: |-
      de vergoeding wordt terugbetaald omdat een vermindering van de vergoeding achteraf is verleend of omdat de goederen
      in ongebruikte staat zijn teruggenomen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.16
  - number: 6.17.1
    text: |-
      Invoer van goederen is het brengen van goederen in het vrije verkeer in een openbaar lichaam, daaronder mede te
      verstaan:
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.17
  - number: 6.17.1.a
    text: het van buiten het openbaar lichaam brengen van goederen in dat openbaar lichaam;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.17
  - number: 6.17.1.b
    text: |-
      het in dat openbaar lichaam beëindigen van, dan wel het in dat openbaar lichaam onttrekken van goederen aan een
      douaneregime;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.17
  - number: 6.17.1.c
    text: |-
      het vanuit een in dat openbaar lichaam ingesteld handels- en dienstenentrepot ten aanzien van goederen beëindigen
      van, dan wel het in dat entrepot onttrekken van goederen aan, het voor dat handels- en dienstenentrepot geldende
      regime;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.17
  - number: 6.17.1.d
    text: de bevoorrading in dat openbaar lichaam van vervoermiddelen met goederen die niet in het vrije verkeer zijn.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.17
  - number: 6.17.2
    text: 'Als invoer wordt niet aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.17
  - number: 6.17.2.a
    text: |-
      het in een openbaar lichaam brengen van goederen als bedoeld in het eerste lid, onderdelen a, b en c, waarop een
      douaneregime van toepassing is;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.17
  - number: 6.17.2.b
    text: |-
      het in een openbaar lichaam beëindigen van een douaneregime voor zover dit regime wordt opgevolgd door een ander
      douaneregime;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.17
  - number: 6.17.2.c
    text: |-
      het van buiten een openbaar lichaam brengen van goederen in een in dat openbaar lichaam ingesteld handels- en
      dienstenentrepot;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.17
  - number: 6.17.2.d
    text: |-
      de uitslag uit een handels- en dienstenentrepot van goederen die onder een douaneregime worden gebracht of worden
      ingeslagen in een ander handels- en dienstenentrepot.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.17
  - number: 6.17.3
    text: |-
      In afwijking in zoverre van het eerste en tweede lid wordt voor accijnsgoederen in de zin van
      [hoofdstuk 4 van de Douane- en Accijnswet BES][ref1] als invoer van goederen aangemerkt:


      [ref1]: https://wetten.overheid.nl/BWBR0029236#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.17
    references:
      - id: ref1
        bwb_id: BWBR0029236
        hoofdstuk: IV
  - number: 6.17.3.a
    text: |-
      uitslag in de zin van [artikel 4.4 van de Douane- en Accijnswet BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0029236#Artikel4
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.17
    references:
      - id: ref1
        bwb_id: BWBR0029236
        artikel: '4'
  - number: 6.17.3.b
    text: |-
      invoer in de zin van [artikel 4.5 van de Douane- en Accijnswet BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029236#Artikel4
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.17
    references:
      - id: ref1
        bwb_id: BWBR0029236
        artikel: '4'
  - number: 6.18.1
    text: De belasting wordt berekend over de douanewaarde.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.18
  - number: 6.18.2
    text: 'In de douanewaarde zijn begrepen:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.18
  - number: 6.18.2.a
    text: |-
      de rechten bij invoer, belastingen en heffingen, met uitzondering van de ter zake van de invoer in een openbaar
      lichaam verschuldigde algemene bestedingsbelasting;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.18
  - number: 6.18.2.b
    text: de bijkomende kosten, zoals kosten van commissie, verpakking, vervoer en verzekering tot de plaats van bestemming.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.18
  - number: 6.18.3
    text: |-
      Onder vervoer als bedoeld in het tweede lid, onderdeel b, wordt niet begrepen het vervoer van de plaats van brengen
      van goederen in een openbaar lichaam tot de plaats van bestemming.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.18
  - number: 6.19.1
    text: De belasting bedraagt 8 percent.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.19
  - number: 6.19.2
    text: 'In afwijking van het eerste lid bedraagt de belasting:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.19
  - number: 6.19.2.a
    text: 25 percent voor personenauto’s en bestelauto’s met een CO-uitstoot;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.19
  - number: 6.19.2.b
    text: nihil voor personenauto’s en bestelauto’s zonder een CO-uitstoot.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.19
  - number: 6.19a.1
    text: |-
      In afwijking van [artikel 6.19, eerste lid en tweede lid, onderdeel a][ref1], bedraagt in de openbare lichamen Sint
      Eustatius en Saba:


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel6
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.19a
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '6'
        hoofdstuk: VI
        afdeling: '2'
  - number: 6.19a.1.a
    text: 'de in dat eerste lid bedoelde belasting: 6 percent;'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.19a
  - number: 6.19a.1.b
    text: |-
      de in dat tweede lid, onderdeel a, bedoelde belasting 18, 22 of 30 percent, berekend aan de hand van de volgende
      tabel:








                        Bij een douanewaarde voor de auto van meer dan


                        maar niet meer dan


                        bedraagt de belasting in kolom III vermelde bedrag dat wordt vermeerderd met het in kolom IV
      vermelde percentage te nemen van het gedeelte van het belastbare bedrag dat het in kolom I vermelde bedrag te boven
      gaat




                        I


                        II


                        III


                        IV







                        USD 20 000



                        18 percent




                        USD 20 000


                        USD 30 000


                        USD 3 600


                        22 percent




                        USD 30 000



                        USD 5 800


                        30 percent
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.19a
  - number: 6.19a.2
    text: |-
      In afwijking in zoverre van het eerste lid, onderdeel b, geldt voor het in dat onderdeel opgenomen percentage van
      18 voor niet gebruikte personenauto’s en bestelauto’s een percentage van 10 en gelden voor de in de derde kolom
      opgenomen bedragen van USD 3 600 en USD 5 800 bedragen van USD 2 000 en USD 4 200.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.19a
  - number: 6.20.1
    text: |-
      Bij ministeriële regeling wordt, onder daarbij te stellen voorwaarden en beperkingen, vrijstelling van belasting
      verleend:
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.20
  - number: 6.20.1.a
    text: |-
      op verzoek van een producent om daarvoor voor de invoer van in het kader van zijn onderneming te gebruiken grond-
      of hulpstoffen en halffabricaten te worden aangewezen;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.20
  - number: 6.20.1.b
    text: voor de invoer van goederen waarvoor aanspraak op vrijstelling van invoerrechten bestaat;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.20
  - number: 6.20.1.c
    text: |-
      voor de invoer van eerste levensbehoeften, geneesmiddelen en medische kunst- en hulpmiddelen als bedoeld in
      [artikel 6.11, eerste lid, onderdelen a, d en e][ref1], alsmede van andere goederen waarvan de levering in het
      openbare lichaam is vrijgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel6
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.20
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '6'
        hoofdstuk: VI
        afdeling: '3'
  - number: 6.20.2
    text: |-
      De inspecteur beslist bij voor bezwaar vatbare beschikking op een schriftelijk verzoek van een producent voor de in
      het eerste lid, onderdeel a, bedoelde aanwijzing.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.20
  - number: 6.21.1
    text: |-
      Ter zake van het heffen en invorderen van de belasting bij invoer zijn de bepalingen van de douanewetgeving van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.21
  - number: 6.21.2
    text: |-
      Bij ministeriële regeling kan, onder daarbij te stellen voorwaarden en beperkingen, teruggaaf van bij invoer
      verschuldigde belasting worden verleend in de gevallen waarin op grond van de douanewetgeving aanspraak op
      teruggaaf van rechten bij invoer bestaat of, in andere gevallen, om redenen van billijkheid.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.21
  - number: 6.21.3
    text: |-
      Belasting waarvan op grond van het tweede lid teruggaaf wordt verleend komt niet voor aftrek op de voet
      van [artikel 6.3, onderdeel b][ref1], in aanmerking. Heeft de aftrek reeds plaatsgevonden dan wordt de
      producent die de aftrek heeft genoten het in aftrek gebrachte bedrag alsnog, op aangifte als bedoeld in
      [artikel 6.15, eerste lid][ref2], verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel6
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.21
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '6'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0029244
        artikel: '6'
        hoofdstuk: VI
        afdeling: '4'
  - number: 6.22.1
    text: 'Op schriftelijk verzoek van de ondernemer kan aan hem door de inspecteur:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.22
  - number: 6.22.1.a
    text: |-
      ontheffing van het voldoen van belasting worden verleend indien de ondernemer een natuurlijke persoon is, in het
      openbaar lichaam woont of is gevestigd dan wel aldaar een vaste inrichting heeft, en de ondernemer aannemelijk
      kan maken dat hij per kalenderjaar een omzet exclusief algemene bestedingsbelasting zal behalen van USD 30.000
      of minder;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.22
  - number: 6.22.1.b
    text: |-
      teruggaaf worden verleend van de belasting die door hem reeds op aangifte is voldaan in het kalenderjaar met ingang
      waarvan hij van de belasting is ontheven.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.22
  - number: 6.22.2
    text: |-
      In afwijking van het eerste lid, kan ook de aldaar bedoelde ontheffing worden verleend aan de ondernemer, een
      andere dan een natuurlijk persoon, die uitsluitend of nagenoeg uitsluitend sociale of culturele prestaties
      verricht. Om in aanmerking te kunnen komen voor ontheffing dient de ondernemer voorafgaand aan het verrichten van
      de sociale of culturele prestaties, een schriftelijk verzoek aan de inspecteur te richten.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.22
  - number: 6.22.3
    text: |-
      Indien een ondernemer meer dan één bedrijf of beroep heeft of uitoefent, worden deze bedrijven of beroepen voor de
      toepassing van dit artikel gezamenlijk in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.22
  - number: 6.22.4
    text: |-
      De ondernemer aan wie een ontheffing is verleend, is verplicht periodiek aan de inspecteur een opgave te doen
      van zijn omzet. Voor het vaststellen van deze periode zijn de bepalingen van [artikel 6.15][ref1] en [8.11][ref2]
      van overeenkomstige toepassing. Indien de ondernemer verzuimt een opgave te doen, kan de inspecteur de ontheffing
      intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.22
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '6'
        hoofdstuk: VI
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '3'
  - number: 6.22.5
    text: |-
      Indien de ondernemer die is ontheven van het voldoen van de belasting in een kalenderjaar een bedrijfsomzet
      exclusief algemene bestedingsbelasting heeft behaald van meer dan USD 30.000 wordt hij alsnog over zijn prestaties
      in dat jaar belasting verschuldigd. In dat geval vervalt de ontheffing van die ondernemer. De ondernemer is
      verplicht de verschuldigde belasting op de eerste aangifte van het volgende kalenderjaar te voldoen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.22
  - number: 6.22.6
    text: |-
      De ontheffingen als bedoeld in het eerste en tweede lid worden verleend bij voor bezwaar vatbare beschikking en
      gelden met ingang van het kalenderjaar waarin de inspecteur de ontheffing heeft verleend. Op de ondernemer aan
      wie een ontheffing als bedoeld in het eerste en tweede lid is verleend, blijven de bepalingen van dit hoofdstuk
      onverkort van toepassing.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.22
  - number: 6.22.7
    text: |-
      Indien na afloop van een kalenderjaar blijkt dat de ondernemer, zijnde een natuurlijke persoon, die in het openbaar
      lichaam woont of is gevestigd dan wel aldaar een vaste inrichting heeft, over dat kalenderjaar een omzet exclusief
      algemene bestedingsbelasting heeft behaald van USD 30.000 of minder en hem voor dat jaar geen ontheffing was
      verleend, krijgt op schriftelijk verzoek teruggaaf van de door hem over dat jaar op aangifte voldane belasting.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.22
  - number: 6.22.8
    text: |-
      Het in het eerste, vijfde en zevende lid vermelde bedrag wordt bij het begin van het kalenderjaar bij ministeriële
      regeling vervangen door een ander. Dit bedrag wordt berekend door het te vervangen bedrag te vermenigvuldigen met
      de tabelcorrectiefactor van [artikel 25 van de Wet inkomstenbelasting BES][ref1] en vervolgens de nodig geachte
      afronding aan te brengen. Indien in het voorafgaande jaar een dergelijke afronding is toegepast, kan bij vervanging
      worden uitgegaan van het niet-afgeronde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel25
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.22
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '25'
  - number: 6.22.9
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld ter zake van de toepassing van dit artikel en
      kunnen ondernemers worden aangewezen waarop in afwijking van het bepaalde in de tweede volzin van het zesde lid de
      bepalingen van dit hoofdstuk niet of gedeeltelijk niet van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.22
  - number: '6.23'
    text: |-
      De ondernemer die in een openbaar lichaam woont of is gevestigd, wordt geacht zijn leveringen en diensten in dat
      openbaar lichaam te verrichten, voor zover hij niet aan de hand van boeken, bescheiden of andere gegevensdragers
      het tegendeel aantoont. Deze bepaling is eveneens van toepassing op de ondernemer die in een openbaar lichaam een
      vaste inrichting heeft, voor zover de leveringen en diensten vanuit die inrichting worden verricht.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.23
  - number: '6.24'
    text: |-
      Het is verboden in de gevallen waarin ingevolge dit hoofdstuk algemene bestedingsbelasting verschuldigd is,
      goederen en diensten aan te bieden tegen prijzen waarin de algemene bestedingsbelasting niet is begrepen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.24
  - number: 6.25.1
    text: 'Met inachtneming van bij ministeriële regeling te stellen regels, is een ondernemer verplicht:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.25
  - number: 6.25.1.a
    text: |-
      aantekening te houden van de door hem en aan hem verrichte leveringen van goederen en verleende diensten, van
      de invoer van goederen in en de uitvoer van goederen uit het openbaar lichaam waarin hij woont of is gevestigd,
      alsmede van andere gegevens die van belang zijn met betrekking tot de heffing van de belasting;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.25
  - number: 6.25.1.b
    text: |-
      dagelijks aantekening te houden van de uitgaven en ontvangsten ter zake van de aan hem en door hem verrichte
      leveringen van goederen en verleende diensten;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.25
  - number: 6.25.1.c
    text: |-
      zijn boekhouding met betrekking tot zijn omzet op zodanige duidelijke en overzichtelijke wijze te voeren en met
      vermelding van zodanige bijzonderheden dat aan de hand daarvan kan worden vastgesteld of de belastingheffing op
      de juiste wijze plaatsvindt en de over een bepaald belastingtijdvak door hem verschuldigde belasting kan worden
      vastgesteld;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.25
  - number: 6.25.1.d
    text: |-
      in zijn administratie kopieën te bewaren van de door hemzelf dan wel, in zijn naam en voor zijn rekening, door zijn
      afnemer of een derde uitgereikte facturen, en alle door hemzelf ontvangen facturen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.25
  - number: 6.25.2
    text: |-
      Bij ministeriële regeling kunnen, onder daarbij te stellen voorwaarden en beperkingen, nadere regels worden gesteld
      in hoeverre ondernemers die geen prestaties verrichten als bedoeld in [artikel 6.2][ref1], alsmede ondernemers
      die uitsluitend vrijgestelde prestaties verrichten, of ondernemers die zowel vrijgestelde als belaste prestaties
      verrichten, zijn ontheven van verplichtingen ingevolge dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel6
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.25
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '6'
        hoofdstuk: VI
  - number: 6.25.3
    text: |-
      Bij ministeriële regeling kunnen, onder daarbij te stellen voorwaarden en beperkingen, nadere regels worden gesteld
      in welke gevallen lichamen als bedoeld in de [artikelen 6.8][ref1] en [6.12][ref2], alsmede ondernemers aan wie de
      levering of de dienst wordt verricht als bedoeld in artikel 6.12, tweede lid, gehouden zijn te voldoen aan de in
      het eerste lid genoemde verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel6
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.25
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '6'
        hoofdstuk: VI
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0029244
        artikel: '6'
        hoofdstuk: VI
        afdeling: '4'
  - number: '6.26'
    text: 'Bij ministeriële regeling kunnen:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.26
  - number: 6.26.a
    text: nadere regels worden gesteld welke tot vergemakkelijking van de heffing kunnen leiden;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.26
  - number: 6.26.b
    text: |-
      andere in het kader van het hoofdstuk passende nadere regels worden gesteld inzake de toepassing van dit hoofdstuk
      en ter aanvulling van de in dit hoofdstuk geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.26
  - number: 6.27.1
    text: |-
      Hij die ingevolge een vóór de inwerkingtreding van een wijziging in de wetgeving inzake algemene
      bestedingsbelasting gesloten overeenkomst verplicht is goederen te leveren of een dienst te verlenen, is bevoegd
      hetgeen met betrekking tot die goederen of die dienst wegens algemene bestedingsbelasting meer is gevorderd dan
      vóór de inwerkingtreding van die wijziging had kunnen geschieden, terug te vorderen van degene aan wie hij de
      goederen moet leveren of de dienst moet verlenen. Hiermee strijdige bedingen zijn nietig.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.27
  - number: '6.28'
    text: 'Ingeval van wijziging van de in dit hoofdstuk genoemde tarieven van heffing wordt:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.28
  - number: 6.28.a
    text: |-
      de algemene bestedingbelasting die na de dag voorafgaande aan de dag waarop een nieuw percentage van toepassing is,
      verschuldigd wordt ter zake van leveringen en diensten die worden verricht vóór of op eerstgenoemde dag, berekend
      naar het tarief dat geldt op het tijdstip waarop de levering of de dienst wordt verricht;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.28
  - number: 6.28.b
    text: |-
      indien algemene bestedingsbelasting vóór de dag waarop een nieuw percentage van toepassing wordt verschuldigd
      is ter zake van leveringen en diensten die worden verricht op of na die dag, hetgeen meer verschuldigd zou zijn
      geweest indien de belasting zou zijn berekend naar het percentage dat geldt op het tijdstip waarop de levering of
      de dienst wordt verricht, alsnog verschuldigd op die dag.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel6.28
  - number: '7.1'
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder: - *overdracht:* de verkrijging door
      natuurlijke personen en rechtspersonen van onroerende zaken of schepen als ook de vestiging, afstand en opzegging
      van vruchtgebruik, van gebruik en van bewoning, erfdienstbaarheden, erfpacht, opstal, grondrenten, hetzij in geld
      hetzij in natura verschuldigd, alsmede de rechtsvorderingen dienende om onroerende zaken of de rechten waaraan deze
      zijn onderworpen terug te eisen of te doen overdragen;
        - *onroerende zaken:* onroerende zaken welke op de BES eilanden gelegen zijn en de rechten waaraan deze zijn
      onderworpen;
        - *schepen:* op de BES eilanden geregistreerde schepen, metende ten minste 20 kubieke meters bruto inhoud.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.1
  - number: '7.2'
    text: |-
      Onverminderd de bepalingen van het Burgerlijk Wetboek BES en het [Wetboek van Koophandel BES][ref1] omtrent
      overdracht van onroerende zaken en schepen, moeten oprichtingen van een naamloze vennootschap, besloten
      vennootschap, coöperatie of vereniging waarbij onroerende zaken of schepen worden ingebracht, op straffe van
      nietigheid geschieden bij op de BES eilanden verleden authentieke akte.


      [ref1]: https://wetten.overheid.nl/BWBR0028278
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0028278
  - number: 7.3.1
    text: |-
      Onder de naam overdrachtsbelasting wordt een belasting geheven ter zake van de overdracht van onroerende zaken en
      van schepen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.3
  - number: 7.3.2
    text: |-
      Met overdracht, bedoeld in het eerste lid, wordt voor de toepassing van dit hoofdstuk gelijkgesteld de inbreng van
      onroerende zaken of geregistreerde schepen door de commanditaire vennoot in een open commanditaire vennootschappen
      op aandelen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.3
  - number: 7.4.1
    text: |-
      Onder bij ministeriële regeling te stellen voorwaarden en beperkingen is van de belasting vrijgesteld de
      overdracht:
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.4
  - number: 7.4.1.a
    text: |-
      aan de staat of een openbaar lichaam, alsmede aan een naamloze vennootschap of besloten vennootschap waarvan alle
      aandelen al dan niet middellijk toebehoren aan de staat of een openbaar lichaam, mits het lichaam dat de onroerende
      zaak of het schip, direct dan wel indirect, verkrijgt, schriftelijk verklaart de onroerende zaak, onderscheidenlijk
      het schip, niet op een zodanige wijze te gaan gebruiken dat daarmee in concurrentie wordt getreden met
      belastingplichtigen die winst beogen, met dien verstande dat indien de onroerende zaak, onderscheidenlijk het
      schip, binnen vijf jaar na verkrijging alsnog op een zodanige wijze gebruikt gaat worden dat daarmee wel in
      concurrentie wordt getreden met belastingplichtigen die winst beogen, de belasting alsnog is verschuldigd zodra
      sprake is van het in concurrentie treden met belastingplichtigen die winst beogen;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.4
  - number: 7.4.1.b
    text: krachtens boedelmenging;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.4
  - number: 7.4.1.c
    text: |-
      krachtens verdeling van een huwelijksgemeenschap of nalatenschap, waarin de verkrijger was gerechtigd als
      rechtverkrijgende;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.4
  - number: 7.4.1.d
    text: bij inbreng van een onderneming in maat- of vennootschappen;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.4
  - number: 7.4.1.e
    text: |-
      krachtens of op grond van verdelingen tussen deelgenoten indien de titel van de gemeenschap is vermeld en de
      gemeenschap behoorlijk is aangetoond;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.4
  - number: 7.4.1.f
    text: |-
      krachtens of op grond van een verdeling tussen deelgenoten als bedoeld in [artikel 7.11][ref1] voor zover de
      overeenkomst betrekking heeft op het geval van overlijden en geen vergoeding is bedongen;


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel7
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '7'
        hoofdstuk: VII
  - number: 7.4.1.g
    text: |-
      van een nieuw vervaardigd gebouw of werk als bedoeld in [artikel 6.4, eerste lid, onderdeel f][ref1], en het bij
      dat gebouw of werk behorende terrein.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel6
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '6'
        hoofdstuk: VI
        afdeling: '1'
  - number: 7.4.2
    text: |-
      Het eerste lid, onderdeel e, is niet van toepassing op verdelingen tussen deelgenoten als bedoeld in
      [artikel 7.6 tot en met 7.11][ref1] waarvan de titel van de gemeenschap is vermeld en de gemeenschap behoorlijk
      is aangetoond.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel7
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '7'
        hoofdstuk: VII
  - number: '7.5'
    text: |-
      Voor zover de titel van de gemeenschap niet is vermeld of de gemeenschap niet behoorlijk is aangetoond, is op akten
      van verdeling de belasting verschuldigd over de toegedeelde waarde van de onroerende zaken of schepen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.5
  - number: 7.6.1
    text: |-
      Op akten van verdeling van onroerende zaken of schepen voor zover deze zijn ingebracht in een maatschap of een
      naamloze vennootschap, besloten vennootschap, coöperatie of vereniging, is de belasting verschuldigd over de waarde
      ten tijde van de verdeling van de onroerende zaak of schip voor zover deze waarde niet is toe te rekenen aan de
      inbrenger of diens erfgenamen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.6
  - number: 7.6.2
    text: |-
      Indien een deelgenoot op de in [artikel 7.11][ref1] bedoelde wijze of door aankoop na de oprichting van de in het
      eerste lid bedoelde maatschap of naamloze vennootschap, besloten vennootschap, coöperatie of vereniging een aandeel
      verkrijgt in de door anderen ingebrachte onroerende zaken of schepen wordt dit aandeel voor de berekening van de
      op de verdeling verschuldigde belasting geacht door die deelgenoot of zijn erfgenamen of rechtverkrijgenden te zijn
      ingebracht, mits blijkt, dat voor de verkrijging van dat aandeel de belasting is betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel7
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.6
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '7'
        hoofdstuk: VII
  - number: 7.6.3
    text: |-
      Dit artikel is niet van toepassing op de verdeling van onroerende zaken of schepen voor zover deze verdeling
      plaatsvindt in het kader van de ontbinding van een naamloze vennootschap, besloten vennootschap of een open
      commanditaire vennootschap en ter zake van de inbreng van de onroerende zaak of het schip overdrachtsbelasting
      is betaald.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.6
  - number: 7.7.1
    text: |-
      Indien de onverdeeldheid van onroerende zaken of schepen uitsluitend uit een overdracht is ontstaan, is op de akte
      van verdeling van die onverdeeldheid de belasting verschuldigd over de in het tweede lid opgenomen waarde.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.7
  - number: 7.7.2
    text: |-
      De waarde van de overdracht is het aan hen, die zelf of wier erflaters of rechtsvoorgangers uitsluitend bij
      overdracht een aandeel verkregen hadden, toegedeelde onder aftrek van de waarde van het aandeel krachtens de titel
      van gemeenschap in elk hun toegedeeld goed, voor de verkrijging waarvan de belasting is betaald.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.7
  - number: 7.7.3
    text: 'Het eerste lid is niet toepassing indien de onverdeeldheid is ontstaan door:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.7
  - number: 7.7.3.a
    text: inbreng in een maatschap, naamloze vennootschap of besloten vennootschap;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.7
  - number: 7.7.3.b
    text: overdracht van het geheel door de enige rechthebbende of alle deelgenoten tezamen aan gezamenlijke verkrijgers;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.7
  - number: 7.7.3.c
    text: ontbinding van een coöperatie of vereniging, mits wegens de inbreng de belasting is betaald.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.7
  - number: '7.8'
    text: |-
      Indien bij een verdeling als bedoeld bij [artikelen 7.6][ref1] en [7.7][ref2] aan verschillende deelgenoten tezamen
      goederen zijn toegedeeld en later tot verdeling van die goederen wordt overgegaan, is op de latere akte of akten
      wegens deze verdeling belasting verschuldigd, die, indien de daarbij gedane toedelingen reeds bij de eerste akte
      hadden plaats gehad, meer verschuldigd zou zijn geweest dan hierop is geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel7
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.8
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '7'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0029244
        artikel: '7'
        hoofdstuk: VII
  - number: 7.9.1
    text: |-
      Op akten van verkoop van aandelen in onroerende zaken of schepen, voor zover deze zijn ingebracht in een maatschap
      of die aandelen zijn ontstaan door ontbinding van een naamloze vennootschap, besloten vennootschap, coöperatie of
      vereniging, is, indien die overdracht geschiedt aan een deelgenoot krachtens dezelfde titel of aan zijn erven of
      rechtverkrijgenden, de belasting eveneens verschuldigd van de waarde van de kopers aandeel krachtens die titel.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.9
  - number: 7.9.2
    text: 'Het eerste lid van dit artikel is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.9
  - number: 7.9.2.a
    text: |-
      de goederen onderdeel uitmaken van een onverdeeldheid vanwege een in [artikel 7.3][ref1] bedoelde inbreng in een
      open commanditaire vennootschap, indien wegens de inbreng de belasting is betaald;


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel7
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.9
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '7'
        hoofdstuk: VII
  - number: 7.9.2.b
    text: de koper zelf de onroerende zaak of het schip heeft ingebracht.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.9
  - number: 7.10.1
    text: |-
      Akten, die ten aanzien van gezamenlijk bezeten onroerende zaken of schepen de verklaring bevatten, dat daarvan
      de verdeling heeft plaats gehad, zonder opgaaf van al de verdeelde goederen, van haar waarde en van de wijze
      van verdeling, worden voor de toepassing van dit hoofdstuk als akten van verdeling aangemerkt. De belasting is
      verschuldigd over de waarde van de onroerende zaken en schepen tenzij partijen de ontbrekende opgaven doen en
      aantonen dat geen of minder belasting verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.10
  - number: 7.10.2
    text: |-
      De te veel geheven belasting wordt teruggegeven, indien de vereiste schriftelijke opgaven en gemelde aantoning
      alsnog geschieden binnen het jaar volgend op het jaar waarin de verdeling heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.10
  - number: 7.11.1
    text: |-
      Indien, met uitzondering van het geval van huwelijksgemeenschap, een aandeel in onroerende zaken of schepen
      ingevolge een overeenkomst tussen de deelgenoten bij uittreding uit de bestaande gemeenschap aan de overige
      deelgenoten verblijft tegen of zonder vergoeding aan de uitgetredene, is bij elk zodanig uittreden de belasting
      verschuldigd alsof het aandeel van de uitgetredene bij de uittreding aan de verkrijgers ware overgedragen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.11
  - number: 7.11.2
    text: |-
      Het vorige lid is van overeenkomstige toepassing indien bedoelde overeenkomst betrekking heeft op het geval
      van overlijden, doch slechts voor zover de belasting schuldig is over de waarde die aan de erfgenamen of
      rechtverkrijgenden van de overledene wordt vergoed.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.11
  - number: '7.12'
    text: |-
      De belasting bedraagt 5 percent van de waarde van de onroerende zaak of het schip. De waarde is ten minste gelijk
      aan die van de tegenprestatie.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.12
  - number: '7.13'
    text: 'Onder waarde wordt verstaan: waarde in het economische verkeer.'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.13
  - number: '7.14'
    text: |-
      In geval van overdracht binnen zes maanden na een vorige overdracht van dezelfde onroerende zaak of hetzelfde
      schip door een ander wordt de waarde verminderd met het bedrag waarover ter zake van de vorige overdracht
      overdrachtsbelasting of algemene bestedingsbelasting was verschuldigd, voor zover de algemene bestedingsbelasting
      niet ingevolge [artikel 6.3, aanhef en onderdeel a][ref1], in aftrek is of kan worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel6
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.14
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '6'
        hoofdstuk: VI
  - number: '7.15'
    text: De belasting wordt geheven van de verkrijger.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.15
  - number: '7.16'
    text: De belasting wordt geheven bij wege van voldoening op aangifte.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.16
  - number: 7.17.1
    text: |-
      Indien een overdracht of andere rechtshandeling, als bedoeld in dit hoofdstuk, onder een opschortende
      voorwaarde heeft plaatsgevonden, kan naar keuze van de verkrijger in plaats van voldoening als bedoeld in het
      [artikel 7.16][ref1] en [artikel 8.11][ref2], zekerheid voor de belasting worden gesteld ten genoege van de
      inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.17
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '7'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        afdeling: '3'
  - number: 7.17.2
    text: |-
      Indien de verkrijger kan bewijzen dat de in het vorige lid bedoelde opschortende voorwaarde niet is vervuld, wordt
      op zijn verzoek:
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.17
  - number: 7.17.2.a
    text: |-
      de zekerheid vrijgegeven en kan de voldoening als bedoeld in [artikel 7.16][ref1] definitief achterwege blijven, of


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel7
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.17
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '7'
        hoofdstuk: VII
  - number: 7.17.2.b
    text: indien geen zekerheid is gesteld, de belasting die ter zake is voldaan, teruggegeven.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.17
  - number: '7.18'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld welke ertoe strekken, dat de belasting ter zake van een
      verkrijging waarvan een notariële akte is opgemaakt, wordt voldaan ter gelegenheid van de aanbieding van die akte
      ter registratie.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.18
  - number: 7.19.1
    text: 'De verkrijger heeft een recht op teruggaaf van te zijner laste verschuldigde belasting indien:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.19
  - number: 7.19.1.a
    text: |-
      een overeenkomst of rechtshandeling, waarvan de belasting is betaald, is vernietigd bij een rechterlijke uitspraak,
      die in kracht van gewijsde is gegaan;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.19
  - number: 7.19.1.b
    text: |-
      een vonnis van onteigening wordt bewezen te zijn vervallen overeenkomstig
      [artikel 62 van de Onteigeningswet BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028729#Artikel62
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.19
    references:
      - id: ref1
        bwb_id: BWBR0028729
        artikel: '62'
  - number: 7.19.1.c
    text: gebleken is dat te veel of ten onrechte overdrachtsbelasting is betaald.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.19
  - number: 7.19.2
    text: |-
      Voor de in dit hoofdstuk bedoelde teruggaven moet belanghebbende, bedoeld in het eerste lid, onder overlegging
      van een gewaarmerkt afschrift van de in dit artikel bedoelde uitspraak of vonnis of van andere bescheiden, een
      schriftelijk daartoe strekkend verzoek worden ingediend bij de inspecteur, die bij voor bezwaar vatbare beschikking
      op het verzoek tot teruggave beslist.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.19
  - number: 7.20.1
    text: |-
      Het Rijk heeft voor de belasting en de boete een voorrecht gedurende twee jaren na de dagtekening van de akte of
      bij ontstentenis van een akte gedurende twee jaren volgend op het jaar waarin de overdracht heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.20
  - number: 7.20.2
    text: |-
      Het in het eerste lid bedoelde voorrecht gaat boven hypotheek en alle andere voorrechten, met uitzondering van die
      van [artikel 288, onder a, van Boek 3 van het Burgerlijk Wetboek BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel288
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.20
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '288'
  - number: '7.21'
    text: |-
      Het recht tot dwanginvordering van de belasting verschuldigd op een niet geregistreerde akte verjaart na twintig
      jaren na de dagtekening van deze akte. Als die dagtekening geldt de dagtekening van de akte, tenzij het tegendeel
      blijkt. Het recht tot dwanginvordering van de belasting van een niet geregistreerd vonnis verjaart na drie jaren na
      de dagtekening van het vonnis.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.21
  - number: '7.22'
    text: |-
      De notarissen zijn niet verplicht hun diensten te verlenen voor het verlijden van akten, aan overdrachtsbelasting
      onderworpen, wanneer niet een voldoende som ter voldoening van de belasting in hun handen ter verrekening is
      gestort of voor de betaling van de belasting voldoende zekerheid is gesteld. Wat betreft de aan de belasting
      onderworpen overdrachten waarvoor vonnissen zijn gegeven, zijn de belanghebbenden verplicht tot gelijke storting
      als gemeld in handen van de griffier, uiterlijk op de voorlaatste werkdag van de termijn van registratie.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.22
  - number: 7.23.1
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld ter zake van de registratie van akten, alsmede ter zake van
      daarmee samenhangende verplichtingen, verboden en aansprakelijkheids- en strafbepalingen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.23
  - number: 7.23.2
    text: |-
      Op de aansprakelijkstelling, bedoeld in het eerste lid, zijn de [artikelen 8.61][ref1] en [8.62][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.23
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        paragraaf: '1'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0029244
        artikel: '8'
        hoofdstuk: VIII
        paragraaf: '1'
        afdeling: '5'
  - number: 7.23.3
    text: |-
      Op een bij of krachtens het eerste lid strafbaar gesteld feit is [titel 6 van hoofdstuk VIII][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.23
    references:
      - id: ref1
        bwb_id: BWBR0029244
        hoofdstuk: VIII
  - number: '7.24'
    text: 'Bij ministeriële regeling kunnen:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.24
  - number: 7.24.a
    text: regels worden gesteld welke tot vergemakkelijking van de heffing kunnen leiden;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.24
  - number: 7.24.b
    text: |-
      andere in het kader van het hoofdstuk passende regels worden gesteld inzake de toepassing van dit hoofdstuk en ter
      aanvulling van de in dit hoofdstuk geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7.24
  - number: 7a.1
    text: 'Onder de naam «kansspelbelasting» wordt een directe belasting geheven van:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7a.1
  - number: 7a.1.a
    text: |-
      degene die gelegenheid geeft tot deelname aan binnenlandse kansspelen en aan wie daarvoor een vergunning is
      verleend als bedoeld in de [Wet hazardspelen BES I][ref1] of de [Wet hazardspelen BES II][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0028450
      [ref2]: https://wetten.overheid.nl/BWBR0028244
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7a.1
    references:
      - id: ref1
        bwb_id: BWBR0028450
      - id: ref2
        bwb_id: BWBR0028244
  - number: 7a.1.b
    text: |-
      degene die gelegenheid geeft tot deelname aan een binnenlands kansspel en aan wie daarvoor een vergunning is
      verleend als bedoeld in de [Loterijwet BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028260
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7a.1
    references:
      - id: ref1
        bwb_id: BWBR0028260
  - number: 7a.1.c
    text: |-
      de gerechtigden tot de prijzen van binnenlandse kansspelen, niet zijnde kansspelen waarvoor degene, bedoeld in
      onderdeel a of b, gelegenheid biedt;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7a.1
  - number: 7a.1.d
    text: de op de BES eilanden wonende of gevestigde gerechtigden tot de prijzen van buitenlandse kansspelen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7a.1
  - number: 7a.2.1
    text: 'Onder kansspelen worden verstaan gelegenheden, gegeven tot mededinging naar:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7a.2
  - number: 7a.2.1.a
    text: |-
      prijzen en premies, indien de aanwijzing der winnaars geschiedt door enige kansbepaling waarop de deelnemers in het
      algemeen geen overwegende invloed kunnen uitoefenen, met uitzondering van levensverzekeringen en premieleningen;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7a.2
  - number: 7a.2.1.b
    text: |-
      prijzen en premies, uitgeloofd ten behoeve van de deelnemers aan een prijsvraag van welke aard ook, tenzij
      een wetenschappelijke of kunstzinnige prestatie wordt gevorderd, dan wel een prestatie waarmee het algemeen
      maatschappelijk belang wordt gediend.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7a.2
  - number: 7a.2.2
    text: |-
      Kansspelen worden als binnenlands beschouwd, indien zij worden gehouden door natuurlijke personen of door lichamen
      in de zin van [artikel 1.3, onderdeel c, van deze wet][ref1], van wie een of meer op de BES eilanden wonen of zijn
      gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel1
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7a.2
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '1'
        hoofdstuk: I
  - number: 7a.2.3
    text: Kansspelen worden als buitenlands beschouwd, indien zij niet vallen onder het tweede lid.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7a.2
  - number: 7a.3.1
    text: 'De belasting wordt geheven:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7a.3
  - number: 7a.3.1.a
    text: |-
      in de gevallen waarin [artikel 7a.1, onderdeel a][ref1], van toepassing is, naar het verschil tussen de in een
      tijdvak ontvangen inzetten en de ter beschikking gestelde prijzen, dan wel, zo een ander dan de belastingplichtige
      de prijzen ter beschikking stelt, naar hetgeen in een tijdvak ontvangen wordt voor het geven van gelegenheid tot
      deelneming aan kansspelen;


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel7a
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7a.3
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: 7a
        hoofdstuk: VIIa
  - number: 7a.3.1.b
    text: |-
      in de gevallen waarin [artikel 7a.1, onderdeel b, c of d][ref1], van toepassing is, naar de prijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel7a
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7a.3
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: 7a
        hoofdstuk: VIIa
  - number: 7a.3.2
    text: |-
      Onder prijzen worden verstaan alle goederen waaraan in het economische verkeer waarde kan worden toegekend, welke
      aan de deelnemers van de kansspelen uit hoofde van hun deelneming toevallen.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7a.3
  - number: 7a.3.3
    text: |-
      Voor zover de prijzen niet in geld bestaan, worden zij in aanmerking genomen naar de waarde welke daaraan in het
      economische verkeer kan worden toegekend.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7a.3
  - number: 7a.4.1
    text: |-
      Indien [artikel 7a.1, onderdeel b, c of d][ref1], van toepassing is, is van de belasting vrijgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel7a
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7a.4
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: 7a
        hoofdstuk: VIIa
  - number: 7a.4.1.a
    text: de prijs welke niet meer bedraagt dan USD 600;
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7a.4
  - number: 7a.4.1.b
    text: |-
      de prijs welke niet uitgaat boven de prestatie welke staat tegenover de deelneming uit hoofde waarvan aanspraak op
      de prijs bestaat.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7a.4
  - number: 7a.4.2
    text: |-
      Alle prijzen uit loterijen en prijsvragen welke verschuldigd zijn door dezelfde schuldenaar en vallen op loten of
      onderdelen van loten op grond van dezelfde toevallige gebeurtenis, worden voor de toepassing van het eerste lid
      tezamen als één prijs beschouwd.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7a.4
  - number: 7a.5.1
    text: De belasting bedraagt 10 percent.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7a.5
  - number: 7a.5.2
    text: |-
      Neemt, in het geval waarin [artikel 7a.1, onderdeel c][ref1], van toepassing is, degene die de prijs verschuldigd
      is, de belasting voor zijn rekening, dan wordt voor het berekenen van de belasting de prijs met 100/90
      vermenigvuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel7a
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7a.5
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: 7a
        hoofdstuk: VIIa
  - number: 7a.6.1
    text: |-
      In de gevallen waarin [artikel 7a.1, onderdeel a][ref1], van toepassing is, moet de in een tijdvak verschuldigd
      geworden belasting op aangifte worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel7a
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7a.6
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: 7a
        hoofdstuk: VIIa
  - number: 7a.6.2
    text: |-
      De belasting is verschuldigd op de laatste dag van het tijdvak, bedoeld in
      [artikel 7a.3, eerste lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel7a
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7a.6
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: 7a
        hoofdstuk: VIIa
  - number: 7a.6.3
    text: |-
      Indien het in [artikel 7a.3, eerste lid, onderdeel a][ref1], bedoelde verschil over een tijdvak negatief is, wordt
      het verrekend met het positieve verschil over een volgend tijdvak. De verrekening geschiedt in de volgorde waarin
      zich negatieve en positieve verschillen voordoen.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel7a
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7a.6
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: 7a
        hoofdstuk: VIIa
  - number: 7a.7
    text: |-
      De belastingplichtige is gehouden volgens door Onze Minister te stellen regelen een register te houden en daarin de
      gegevens te boeken welke voor de heffing van de belasting van belang zijn.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7a.7
  - number: 7a.8.1
    text: |-
      In de gevallen waarin [artikel 7a.1, onderdeel b][ref1], van toepassing is, wordt de belasting geheven door
      inhouding op de prijs.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel7a
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7a.8
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: 7a
        hoofdstuk: VIIa
  - number: 7a.8.2
    text: |-
      Inhoudingsplichtige is de belastingplichtige, bedoeld in [artikel 7a.1, onderdeel b][ref1], die de prijs
      verschuldigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel7a
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7a.8
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: 7a
        hoofdstuk: VIIa
  - number: 7a.8.3
    text: |-
      De inhoudingsplichtige is verplicht de belasting in te houden op het tijdstip waarop de prijs ter beschikking is
      gesteld.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7a.8
  - number: 7a.8.4
    text: |-
      De inhoudingsplichtige is verplicht de ingehouden belasting op aangifte af te dragen. Overtreft de belasting de
      prijs voor zover deze in geld bestaat, dan wordt het ontbrekende geacht te zijn ingehouden op het in het derde lid
      omschreven tijdstip, met dien verstande dat de inhoudingsplichtige bevoegd is dat ontbrekende te verhalen op de
      gerechtigde tot de prijs. De inhoudingsplichtige kan de afgifte van de prijs voor zover deze niet in geld bestaat
      opschorten tot voldoening van deze vordering plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7a.8
  - number: 7a.9.1
    text: |-
      De inhoudingsplichtige is gehouden volgens door Onze Minister te stellen regelen een register te houden en daarin
      de gegevens te boeken welke voor de heffing van de belasting van belang zijn.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7a.9
  - number: 7a.9.2
    text: |-
      Degene bij wie de prijs is betaalbaar gesteld, is gehouden op verzoek van de gerechtigde tot de prijs aan hem
      volgens door Onze Minister te stellen regelen, zodra de prijs is uitbetaald, tegoedgeschreven, verrekend of
      afgegeven, een gedagtekende nota uit te reiken, waaruit van de inhouding blijkt.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7a.9
  - number: 7a.10.1
    text: |-
      In de gevallen waarin [artikel 7a.1, onderdeel c of d][ref1], van toepassing is, moet de belasting op aangifte
      worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel7a
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7a.10
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: 7a
        hoofdstuk: VIIa
  - number: 7a.10.2
    text: 'De belasting wordt verschuldigd op het tijdstip waarop de prijs:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7a.10
  - number: 7a.10.2.a
    text: |-
      ontvangen of verrekend wordt, ter beschikking van de belastingplichtige wordt gesteld of rentedragend wordt, dan
      wel
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7a.10
  - number: 7a.10.2.b
    text: vorderbaar en tevens inbaar wordt.
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7a.10
  - number: 7b.1.1
    text: |-
      Met betrekking tot groepsentiteiten als bedoeld in [artikel 2.1 van de Wet minimumbelasting 2024][ref1] die op
      grond van [artikel 1.5][ref2] in samenhang met [artikel 5.2][ref3] zijn gevestigd op de BES eilanden of die een
      op de BES eilanden gelegen vaste inrichting zijn als bedoeld in onderdeel c van de definitie van vaste inrichting
      in [artikel 1.2, eerste lid, van de Wet minimumbelasting 2024][ref4] is de [Wet minimumbelasting 2024][ref5],
      met uitzondering van de artikelen, bedoeld in het derde lid, van overeenkomstige toepassing, met dien verstande
      dat daarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0029244#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0049111#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0049111
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.1
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0029244
        artikel: '1'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0029244
        artikel: '5'
        hoofdstuk: V
      - id: ref4
        bwb_id: BWBR0049111
        artikel: '1'
      - id: ref5
        bwb_id: BWBR0049111
  - number: 7b.1.1.a
    text: 'wordt gelezen voor:'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.1
  - number: 7b.1.1.a.1°
    text: 'Nederland: de BES eilanden;'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.1
  - number: 7b.1.1.a.2°
    text: 'in Nederland: op de BES eilanden;'
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.1
  - number: 7b.1.1.b
    text: |-
      in de in [artikel 1.2, eerste lid, van die wet][ref1] opgenomen definities van kwalificerende binnenlandse
      bijheffing, kwalificerende inkomen-inclusiemaatregel en kwalificerende onderbelastewinstmaatregel, en in
      [artikel 6.2, tweede lid, onderdeel a, onder 4°, van die wet][ref2] de zinsnede «, met betrekking tot derde
      staten,» buiten toepassing blijft;


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Artikel6
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.1
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0049111
        artikel: '6'
  - number: 7b.1.1.c
    text: |-
      in [artikel 4.1, eerste lid, aanhef, van die wet][ref1] de zinsnede «of door een in een lidstaat gevestigde
      uiteindelijkemoederentiteit die een uitgesloten entiteit is» buiten toepassing blijft;


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel4
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.1
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '4'
  - number: 7b.1.1.d
    text: |-
      in [artikel 13.3, eerste en tweede lid, van die wet][ref1] wordt gelezen
      voor [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2]:
      [artikel 27, vierde lid, van het Wetboek van Strafrecht BES][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel27
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.1
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '23'
      - id: ref3
        bwb_id: BWBR0028570
        artikel: '27'
  - number: 7b.1.2
    text: |-
      In afwijking van de in [artikel 1.2, eerste lid, van de Wet minimumbelasting 2024][ref1] opgenomen definitie van
      derde staat wordt daaronder voor de toepassing van die [wet][ref2] op groepsentiteiten als bedoeld in het eerste
      lid, aanhef, verstaan: het Koninkrijk der Nederlanden met uitzondering van de BES eilanden, en elke andere staat.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0049111
    url: https://wetten.overheid.nl/BWBR0029244/2026-01-01#Artikel7b.1
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0049111
  - number: 7b.1.3
    text: |-
      [Artikel 5.1, eerste lid, onderdeel c, en vijfde lid][ref1], de [hoofdstukken 11][ref2] en [12][ref3] en
      [artikel 14.3 van de Wet minimumbelasting 2024][ref4] zijn niet van overeenkomstige toepassing op groepsentiteiten
      als bedoeld in het eerste lid, aanhef.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Hoofdstuk11
      [ref3]: https://wetten.overheid.nl/BWBR0049111#Hoofdstuk12
      [ref4]: https://wetten.overheid.nl/BWBR0049111#Artikel14
