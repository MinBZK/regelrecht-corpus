      1 In de begroting of de meerjarenraming opgenomen investeringen worden geacht te zijn gedaan op 1 juli van het jaar
      van aanschaf of ingebruikname.

      2 Gerealiseerde investeringen worden afgeschreven vanaf het moment van aanschaf of ingebruikname.
