        artikel: '6'
  - number: '12'
    text: |-
      1 De bepaling van het exploitatieresultaat in de meerjarenraming en de jaarrekening, zijnde het resultaat uit
      normale bedrijfsvoering plus de buitengewone baten minus de buitengewone lasten, geschiedt zonder dotaties of
      onttrekkingen aan de bestemmingsreserves, tenzij de minister van Binnenlandse Zaken en Koninkrijksrelaties, al dan
      niet op verzoek van de korpsbeheerder, anderszins besluit.

      2 Mutaties in reserves die gepland zijn of waarvoor reeds toestemming is verleend door het Regionaal College,
      worden bij de bestemming van het resultaat expliciet in beeld gebracht.
