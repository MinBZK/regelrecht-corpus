  - number: '2'
    text: |-
      1 Bij een actief dat in gebruik is, kan van de in [artikel 1][ref1] genoemde termijnen worden afgeweken, mits
      hiervoor vooraf toestemming is verleend door de minister van Binnenlandse Zaken en Koninkrijksrelaties.

      2 Bij een nieuw actief kan van de in [artikel 1][ref2] genoemde termijnen worden afgeweken, mits hiervoor
      uiterlijk in het jaar van aanschaf van dat actief toestemming is verleend door de minister van Binnenlandse Zaken
      en Koninkrijksrelaties.

      3 Voor activa die niet in [artikel 1][ref3] zijn genoemd, blijft de afschrijvingstermijn ongewijzigd.


