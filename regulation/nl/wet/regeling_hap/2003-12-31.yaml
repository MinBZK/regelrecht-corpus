                  10 jaar




                  c. inbouw


                  10 jaar




                  d. overige onderdelen


                  4 jaar




                  3.5 overige vaartuigen


                  10 jaar








                  *4. Verbindingen en automatisering*





                  4.1 Radiobediensystemen
                  (vaste apparatuur)


