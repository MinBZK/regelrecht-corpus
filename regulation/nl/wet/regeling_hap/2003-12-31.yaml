      De afschrijvingstermijnen voor de materiële vaste activa luiden als volgt:








                  *1. Grond*


                  geen








                  *2. Huisvesting*





                  2.1 Standaard-gebouwen/ casco


                  35 jaar




                  2.2 Verbouwingen





                  a. met als oogmerk de levensduur te
                  verlengen


