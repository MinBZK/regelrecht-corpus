    text: |-
      Onder de financiële vaste activa wordt opgenomen de netto-vermogenswaarde (het saldo van bezittingen en schulden)
      van alle samenwerkingsverbanden waarin het regionaal politiekorps deelneemt, zowel van bovenregionale als van
      interregionale aard.
    url: https://wetten.overheid.nl/BWBR0016223/2003-12-31#Artikel4
  - number: '5'
    text: Beleggingen van liquide middelen in welke vorm ook worden opgenomen onder de post liquide middelen.
    url: https://wetten.overheid.nl/BWBR0016223/2003-12-31#Artikel5
  - number: '6'
    text: |-
      De balans bevat de volgende voorzieningen:

      1. een Voorziening Tijdelijke Ouderenregeling (TOR).

      De omvang van deze voorziening wordt per balansdatum als volgt berekend:

      A x B x C + D – E, waarin:

      A = het aantal personen dat in de jaren waarvoor de TOR van kracht is, naar verwachting van de TOR gebruik maakt;

      B = de periode gedurende welke de personen onder A gebruik maken van de TOR;

      C = het salarisniveau, inclusief sociale lasten, van de personen onder A volgens de begroting, respectievelijk, in
      voorkomend geval, de jaarrekening;

      D = de kosten van het verlof, inclusief sociale lasten, voorafgaand aan de postactieve periode;

      E = de bijdrage die voor de personen onder A van het Rijk als bijzondere bijdrage wordt ontvangen als
      tegemoetkoming in de kosten van de TOR;

      2. een Voorziening wachtgelden/WW.

      Deze voorziening wordt als volgt berekend:

      P x Q x R, waarin:

      P = het aantal personen per balansdatum dat recht heeft op een uitkering als vervat in een wachtgeldregeling/WW;

      Q = de periode gedurende welke de personen onder P gebruik maken van de wachtgeldregeling/WW;

      R = het salarisniveau van de personen onder P volgens de begroting, respectievelijk, in voorkomend geval, de
      jaarrekening;

      3. een Voorziening periodiek onderhoud huisvesting. Aan deze voorziening ligt een door het Regionaal College
      goedgekeurd meerjarig onderhoudsplan ten grondslag.
    url: https://wetten.overheid.nl/BWBR0016223/2003-12-31#Artikel6
  - number: '7'
    text: |-
      1 Het vormen van nieuwe voorzieningen is toegestaan nadat daartoe op verzoek van de korpsbeheerder toestemming is
      verleend door de minister van Binnenlandse Zaken en Koninkrijksrelaties.

      2 Het verzoek, bedoeld in het eerste lid dient te worden ingediend uiterlijk op 1 december van het begrotingsjaar
      waarin de voorziening wordt gevormd.
    url: https://wetten.overheid.nl/BWBR0016223/2003-12-31#Artikel7
  - number: '8'
    text: |-
      1 De balans bevat tenminste de volgende kortlopende schulden:

      a. een post Vakantiegeld. Deze post heeft betrekking op de opgebouwde vakantierechten van het personeel per de
      datum van de balans.

      b. een post Verlofstuwmeer. Deze post wordt als volgt berekend:

      E x F, waarin E de som is van het aantal openstaande verlofuren, overuren, meeruren en spaaruren per balansdatum
      en F een bedrag per uur zoals vastgelegd in de circulaire die jaarlijks uiterlijk 1 december op grond van
      [artikel 2, achtste lid, van het Besluit financiën regionale politiekorpsen][ref1] wordt verzonden.

      2 De egalisatierekening behoort tot de balanspost Kortlopende schulden.


      [ref1]: https://wetten.overheid.nl/BWBR0006562#Artikel2
    url: https://wetten.overheid.nl/BWBR0016223/2003-12-31#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006562
        artikel: '2'
  - number: '9'
    text: |-
      1 Aanschaffingen boven een bedrag van € 5.000 en aanschaffingen waarvan het bedrag per eenheid groter is dan € 500
      en het totaalbedrag van de aanschaffing een bedrag van € 5.000 overschrijdt, worden geactiveerd.

      2 Toepassing van het begrip ‘ideaalcomplex’ in plaats van activering is niet toegestaan.

      3 De kosten van groot onderhoud dat ten doel heeft de levensduur van een gebouw te verlengen of de functionaliteit
      van een gebouw te wijzigen, worden geactiveerd en afgeschreven over de resterende gebruiksduur van het pand.
    url: https://wetten.overheid.nl/BWBR0016223/2003-12-31#Artikel9
  - number: '10'
    text: |-
      Een voordelig, respectievelijk nadelig effect als gevolg van de herziening van de afschrijvingstermijnen over het
      reeds verstreken deel van de afschrijvingsperiode, genoemd in [artikel 1][ref1], wordt ten gunste, respectievelijk
      ten laste van de reserve waardeverschillen gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0016223#Artikel1
    url: https://wetten.overheid.nl/BWBR0016223/2003-12-31#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0016223
        artikel: '1'
  - number: '11'
    text: |-
      1 De omvang van de reserve waardeverschillen die vrijvalt als gevolg van het bepaalde in het Besluit van 15
      december 2003, tot wijziging van het Besluit comptabele regelgeving regionale politiekorpsen en het Besluit
      financiën regionale politiekorpsen in verband met de mogelijkheid om regels te stellen ter zake van de begroting,
      meerjarenraming en jaarrekening, alsmede de wijziging van de uiterste datum van indiening van de jaarrekening en
      het jaarverslag (Stb. 2003, 560) wordt ten gunste, respectievelijk ten laste van de algemene reserve gebracht.

      2 De mutaties in de balansposten als gevolg van het bepaalde in [artikel 6][ref1] worden ten gunste,
      respectievelijk ten laste van de algemene reserve gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0016223#Artikel6
    url: https://wetten.overheid.nl/BWBR0016223/2003-12-31#Artikel11
    references:
