                  b. zonder oogmerk de levensduur te
                  verlengen


                  b. Op basis van de resterende levensduur




                  2.3 Installaties


                  15 jaar




                  2.4 Inrichting gebouwen / inventaris


                  10 jaar








                  *3. Vervoer*





