$id: bijdrageregeling_geluidhinder_nieuwe_woningen
regulatory_layer: WET
publication_date: '2021-03-26'
valid_from: '2009-07-04'
bwb_id: BWBR0003777
url: https://wetten.overheid.nl/BWBR0003777/2009-07-04
preamble:
  text: 'Besluiten:'
  url: https://wetten.overheid.nl/BWBR0003777/2009-07-04#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

      a. minister: de minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

      b. inspecteur: de ter plaatse bevoegde inspecteur van de volksgezondheid, belast met het toezicht op de hygiëne van
      het milieu;

      c. geluidsbelasting van de gevel vanwege een weg: de waarde van de geluidsbelasting van de gevel, bepaald
      overeenkomstig het Reken- en Meetvoorschrift Verkeerslawaai (Staatsuitgeverij 1981, nr. 250-147-00), niet
      verminderd met de aftrek, bedoeld in het Besluit aftrek resultaat berekening en meting geluidsbelasting vanwege een
      weg (Stcrt. 1981, 116);

      d. geluidsbelasting van de gevel vanwege een spoorlijn: de waarde van de geluidsbelasting van de gevel, bepaald
      overeenkomstig het Reken- en Meetvoorschrift Railverkeerslawaai (Stcrt. 1987, 122);

      e. Voorzieningen: werken voor zover deze strekken tot het afschermen of weren van geluid;

      f. geluidafschermende voorzieningen: schermen of wallen;

      g. geluidwerende voorzieningen: voorzieningen aan de gevel;

      h. geluidsgevoelige ruimten: ruimten als bedoeld in het Besluit geluidsgevoelige ruimten van een woning (Stcrt.
      1981, 116).

      2 Deze regeling is niet van toepassing met betrekking tot het treffen van geluidwerende voorzieningen aan woningen,
      indien voor het treffen van die voorzieningen geldelijke steun kan worden verleend op voet van de Regeling
      geldelijke steun huurwoningen normkostensysteem 1988 (Stcrt. 1988, 202) of van de Regeling geldelijke steun
      voorzieningen aan huurwoningen 1987 (Stcrt. 1988, 203).
    url: https://wetten.overheid.nl/BWBR0003777/2009-07-04#Artikel1
  - number: '6'
    text: |-
      1 De minister kan aan een gemeente een bijdrage ineens verlenen in de kosten, voortvloeiend uit het treffen van
      voorzieningen tegen wegverkeerslawaai aan woningen die vallen onder de omschrijving van artikel 88, eerste lid,
      onder f, van de Wet geluidshinder.

      2 De minister kan aan een gemeente een bijdrage ineens verlenen ter tegemoetkoming in de kosten, voortvloeiend uit
      het treffen van voorzieningen tegen wegverkeerslawaai aan nieuw te bouwen woningen.

      a. die dienen ter vervanging van woningen en gebouwen die vallen onder de omschrijving van artikel 88, eerste lid,
      onder a, van de Wet geluidshinder of

      b. waarvan de bouw is toegelaten in een bestemmingsplan dat is vastgesteld voor 1 januari 1982 en dat op 1 maart
      1986 nog niet van kracht was.

      3 De minister kan tevens aan een gemeente ten behoeve van nieuw te bouwen woningen een bijdrage ineens verlenen
      ter tegemoetkoming in de kosten, voortvloeiend uit het treffen van voorzieningen tegen spoorweglawaai, vanwege een
      spoorweg die op 1 juli 1987 aanwezig is, al dan niet in wijziging, indien:

      a. die woningen dienen ter vervanging van woningen of gebouwen, die op die datum aanwezig waren of

      b. de bouw van die woningen is toegelaten in een bestemmingsplan dat op die datum geldend is.

      4 Een bijdrage als bedoeld in het derde lid wordt verleend mede namens de minister van Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0003777/2009-07-04#Artikel6
  - number: '7'
    text: |-
      1 Een bijdrage als bedoeld in artikel 6, eerste lid, wordt niet verleend indien:

      a. de bouw van de betreffende woningen wordt toegelaten in een bestemmingsplan, dat door de gemeenteraad is
      vastgesteld na 1 januari1982;

      b. ten behoeve van de bouw van de betreffende woningen door burgemeester en wethouders na 1 januari 1982
      bij gedeputeerde staten een verzoek om een verklaring van geen bezwaar ten behoeve van de verlening van een
      vrijstelling van de voorschriften van het geldende bestemmingsplan en het verlenen van een bouwvergunning is
      ingediend.

      2 Een bijdrage als bedoeld in artikel 6, tweede lid, onder a, onderscheidenlijk 6, derde lid, onder a, wordt niet
      verleend indien voor de bestaande woningen of gebouwen ingevolge artikel 126, eerste lid, onder a, van de Wet
      geluidhinder onderscheidenlijk de Bijdrageregeling spoorweglawaai, dan wel de Bijdrageregeling spoorweglawaai
      bestaande woningen reeds een bijdrage ten behoeve van het treffen van voorzieningen is verleend.
    url: https://wetten.overheid.nl/BWBR0003777/2009-07-04#Artikel7
  - number: '8'
    text: |-
      Een bijdrage als bedoeld in artikel 6, eerste of tweede lid, wordt slechts verleend indien voor het treffen van de
      voorzieningen de geluidsbelasting van de gevel vanwege de weg meer bedraagt dan 55 dB(A).
    url: https://wetten.overheid.nl/BWBR0003777/2009-07-04#Artikel8
  - number: '9'
    text: |-
      Een bijdrage als bedoeld in artikel 6, eerste of tweede lid, wordt, indien de voorzieningen bestaan uit
      geluidwerende werken, voorts slechts verleend indien na het treffen van die voorzieningen de geluidwering van de
      gevel voldoet aan de eisen, gesteld in het Besluit geluidwering gebouwen (Stb. 1982, 755) en de op grond van dat
      besluit vereiste geluidwering ten minste 26 dB(A) bedraagt.
    url: https://wetten.overheid.nl/BWBR0003777/2009-07-04#Artikel9
  - number: '10'
    text: |-
      Een bijdrage als bedoeld in artikel 6, eerste of tweede lid, onder b, onderscheidenlijk artikel 6, tweede lid,
      onder a, wordt bovendien slechts verleend, indien na het treffen van de voorzieningen de geluidsbelasting van de
      gevel vanwege de weg niet meer bedraagt dan 70dB(A), onderscheidenlijk 75 dB(A).
    url: https://wetten.overheid.nl/BWBR0003777/2009-07-04#Artikel10
  - number: '11'
    text: |-
      Een bijdrage als bedoeld in artikel 6, derde lid, wordt slechts verleend indien de geluidsbelasting van de gevel
      vanwege de spoorlijn voor het treffen van de voorzieningen meer bedraagt dan 60 dB(A) en na het treffen van de
      voorzieningen niet meer dan 73 dB(A).
    url: https://wetten.overheid.nl/BWBR0003777/2009-07-04#Artikel11
  - number: '12'
    text: |-
      Een bijdrage als bedoeld in artikel 6, derde lid, wordt bovendien slechts verleend indien de geluidwering van de
      gevel:

      1°. ten minste gelijk is aan het verschil tussen de geluidsbelasting van de gevel vanwege de spoorweg en een waarde
      van 37 dB(A), voor zover de gevel dient ter bescherming van een of meer geluidsgevoelige ruimten.

      2°. en tevens, uitgaande van het standaardspectrum voor buitengeluid zoals opgenomen in de bijlage bij het Besluit
      geluidwering gebouwen (Stb. 1982, 755), ten minste 26 dB(A) bedraagt.
    url: https://wetten.overheid.nl/BWBR0003777/2009-07-04#Artikel12
  - number: '13'
    text: |-
      Bijdragen als bedoeld in artikel 6 worden niet verleend indien met het treffen van de voorzieningen is begonnen
      voordat de beslissing omtrent het toekennen van de bijdrage aan burgemeester en wethouders is medegedeeld.
    url: https://wetten.overheid.nl/BWBR0003777/2009-07-04#Artikel13
  - number: '14'
    text: |-
      1 Bijdragen als bedoeld in artikel 6 worden verleend onder de voorwaarde, dat:

      a. binnen zes maanden met het treffen van de voorzieningen wordt begonnen;

      b. aan de door de minister met controle belaste personen op door hen te bepalen tijdstippen:

      1°. inzage wordt verleend van de op de voorzieningen betrekking hebbende bescheiden of tekeningen;

      2°. gelegenheid wordt gegeven tot het controleren, waaronder mede te verstaan het nemen van afschrift, van de op de
      voorzieningen betrekking hebbende gegevens en

      3°. alle inlichtingen worden verstrekt, die naar hun oordeel noodzakelijk zijn voor het beoordelen of deze regeling
      juist wordt toegepast.

      2 De minister kan, telkens op een daartoe strekkend verzoek van het gemeentebestuur, de in het eerste lid, onder a,
      bedoelde termijn met een door hem te bepalen termijn verlengen, echter slechts onder door hem van geval tot geval
      te bepalen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0003777/2009-07-04#Artikel14
  - number: '16'
    text: |-
      Bijdragen als bedoeld in artikel 6 worden slechts verleend, indien de voorzieningen waarop de aanvraag betrekking
      heeft, in geval van meerdere geluidbronnen ten gevolge waarvan voorzieningen dienen te worden getroffen, tevens
      voldoen aan het bepaalde in artikel 8, zesde lid van het Besluit geluidwering gebouwen.
    url: https://wetten.overheid.nl/BWBR0003777/2009-07-04#Artikel16
  - number: '17'
    text: |-
      1 De bijdrage, bedoeld in artikel 6, bestaat uit een bijdrage in de kosten van de te treffen voorzieningen,
      verhoogd met een bijdrage in de aan het treffen van de voorzieningen verbonden kosten voor voorbereiding,
      begeleiding en toezicht.

      2 De bijdrage in de kosten van het treffen van voorzieningen bedraagt 50% van het bedrag, vastgesteld
      overeenkomstig de bij deze regeling behorende bijlage.

      3 Tot de kosten van het treffen van voorzieningen worden gerekend de kosten voor de uitvoering van de
      voorzieningen, inclusief b.t.w.

      4 De bijdrage in de aan het treffen van de voorzieningen verbonden kosten voor voorbereiding, begeleiding en
      toezicht bedraagt:

        - in geval van het treffen van geluidafschermende voorzieningen: 15% van de bijdrage, bedoeld in het tweede lid,
      dan wel, ingeval die voorzieningen worden getroffen op een terrein in eigendom van de Nederlandse Spoorwegen N.V.,
      5% van de bijdrage, bedoeld in het tweede lid;
        - in geval van het treffen van geluidwerende voorzieningen: 10% van de bijdrage, bedoeld in het tweede lid, dan
      wel, ingeval overeenkomstig artikel 22 een steekproef wordt uitgevoerd, 15% van die bijdrage.
    url: https://wetten.overheid.nl/BWBR0003777/2009-07-04#Artikel17
  - number: '18'
    text: |-
      1 Verlening van een voorschot geschiedt bij de beschikking tot het verlenen van een bijdrage. Het voorschot wordt
      aangepast aan de aard en de omvang alsmede de voortgang van het werk. Indien de toegekende bijdrage f 400 000 niet
      te boven gaat, bedraagt het voorschot de helft van de verleende bijdrage.

      2 De minister kan tevens op basis van een raming van burgemeester en wethouders van de bijdrage, berekend op grond
      van artikel 17, tweede lid, indien deze naar verwachting f 400 000 te boven gaat, de helft van de ingevolge artikel
      17, vierde lid, te verlenen bijdrage als voorschot verlenen voor onderzoeken als bedoeld in artikel 19, tweede en
      derde lid.
    url: https://wetten.overheid.nl/BWBR0003777/2009-07-04#Artikel18
  - number: '19'
    text: |-
      1 De geluidsbelasting van de woningen waarvoor een bijdrage als bedoeld in artikel 6, tweede of derde lid,
      onder a, wordt of zal worden verstrekt, wordt vastgesteld door burgemeester en wethouders op basis van een
      akoestisch onderzoek. Tot dit onderzoek behoort een globale berekening van het effect van enkele alternatieven van
      geluidafschermende werken. Een rapport van het onderzoek maakt deel uit van de aanvraag.

      2 Indien naar oordeel van burgemeester en wethouders, mede op basis van het akoestisch rapport, geluidafschermende
      voorzieningen daadwerkelijk te realiseren zijn, worden de aard, de vormgeving, de plaats van deze voorzieningen
      en het effect daarvan op de geluidsbelasting van de gevels van de woningen vastgesteld op basis van een definitief
      akoestisch en zonodig grondmechanisch onderzoek. Een rapport van dit onderzoek maakt deel uit van de aanvraag.

      3 Indien naar het oordeel van burgemeester en wethouders mede op basis van het akoestisch rapport
      geluidafschermende voorzieningen ter plaatse niet toepasbaar zijn om de geluidsbelasting van de gevel te
      verminderen, worden geluidwerende voorzieningen vastgesteld op basis van een akoestisch bouwtechnisch onderzoek.
      Een rapport van dit onderzoek maakt deel uit van de aanvraag.

      4 Alvorens burgemeester en wethouders overeenkomstig het eerste lid de geluidsbelasting van de woningen vaststellen
      plegen zij overleg met de inspecteur.
    url: https://wetten.overheid.nl/BWBR0003777/2009-07-04#Artikel19
  - number: '20'
    text: |-
      1 Een aanvraag om verlening van een bijdrage als bedoeld in artikel 6 wordt door tussenkomst van de hoofdingenieur-
      directeur van de volkshuisvesting in de provincie ingediend bij de minister op een door hem vast te stellen en
      beschikbaar te stellen formulier.

      2 Voor zover, naast een bijdrage als bedoeld in artikel 6, met betrekking tot de desbetreffende woning geldelijke
      steun wordt aangevraagd op voet van:

      a. de Beschikking geldelijke steun eigen woningen 1984 (Stcrt. 1988, 214);

      b. de Beschikking bijdrage ineens nieuwe vrije sectorwoningen (Stcrt. 1988, 214) of

      c. de Regeling premiehuurwoningen 1989 (Stcrt. 1988, 211), wordt een aanvraag als bedoeld in het eerste lid
      ingediend op hetzelfde tijdstip, dat de desbetreffende aanvraag om geldelijke steun op voet van een van de in de
      onderdelen a, b en c bedoelde regelingen wordt ingediend.

      3 Indien de aanvraag een bijdrage betreft als bedoeld in artikel 6, eerste lid, en derde lid, onder b, maakt
      van de aanvraag deel uit een samenvatting van het akoestisch onderzoek, bedoeld in artikel 93, tweede lid,
      onderscheidenlijk 94, eerste lid, van de Wet geluidshinder.

      4 Bijdragen als bedoeld in artikel 6, eerste lid, en derde lid, onder b, worden, indien artikel 95 van de Wet
      geluidhinder van toepassing is, bovendien slechts uitgekeerd nadat de minister een afschrift heeft ontvangen van
      het op die woningen betrekking hebbende besluit van gedeputeerde staten, bedoeld in artikel 96 van de wet.
    url: https://wetten.overheid.nl/BWBR0003777/2009-07-04#Artikel20
  - number: '21'
    text: |-
      1 Bijdragen als bedoeld in artikel 6 worden betaald nadat de minister een schriftelijke verklaring van burgemeester
      en wethouders heeft ontvangen betreffende de voltooiing van het werk.

      2 Ingeval de in het eerste lid bedoelde bijdragen betrekking hebben op geluidafschermende voorzieningen,
      wordt bij de schriftelijke verklaring, bedoeld in dat lid, tevens gevoegd een opgave van de blijkens een
      accountantsverklaring geverifieerde werkelijke kosten van de voorzieningen.
    url: https://wetten.overheid.nl/BWBR0003777/2009-07-04#Artikel21
  - number: '22'
    text: |-
      1 Indien ten behoeve van de verklaring, bedoeld in artikel 21, eerste lid, in het kader van de oplevering van
      geluidwerende voorzieningen bij steekproef een meting wordt uitgevoerd ter controle van de geluidwering, is de
      steekproefgrootte ten minste één op de tien woningen indien de vereiste geluidwering 30 dB(A) of hoger is, en
      overigens ten minste één op de twintig woningen.

      2 Van elke meting ingevolge het eerste lid worden in een rapport het resultaat en alle voor die meting relevante
      gegevens weergegeven. Het rapport wordt gevoegd bij de verklaring, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003777/2009-07-04#Artikel22
  - number: '23'
    text: |-
      Indien zich, voordat de voorzieningen zijn getroffen, wijzigingen voordoen ten aanzien van de omvang van het
      project, de periode van uitvoering of de aard van de voorzieningen ten opzichte van de beschrijving in de aanvraag,
      dient dit terstond door burgemeester en wethouders aan de minister te worden gemeld.
    url: https://wetten.overheid.nl/BWBR0003777/2009-07-04#Artikel23
  - number: '24'
    text: |-
      De minister kan bij het verlenen van een bijdrage als bedoeld in artikel 6 afwijken van de hoogte van de in deze
      regeling vastgestelde bedragen en percentages en nadere en zonodig van deze regeling afwijkende voorschriften
      stellen.
    url: https://wetten.overheid.nl/BWBR0003777/2009-07-04#Artikel24
  - number: '25'
    text: |-
      Een beschikking tot verlening van een bijdrage als bedoeld in artikel 6 kan worden ingetrokken indien:

      a. wordt of is gehandeld in strijd met de bepalingen van deze regeling, dan wel met de aan de beschikking tot
      verlening van de bijdrage verbonden voorwaarden;

      b. de voorzieningen zijn of worden getroffen in afwijking van de bij de aanvraag verstrekte gegevens, tenzij de
      minister toestemming voor de afwijking heeft verleend.
    url: https://wetten.overheid.nl/BWBR0003777/2009-07-04#Artikel25
  - number: '26'
    text: |-
      Ten aanzien van nieuw te bouwen scholen en gebouwen voor verzorging en verpleging, als bedoeld in artikel 4 van
      het Besluit grenswaarden binnen zones langs wegen, en terreinen als bedoeld in artikel 7 van dat besluit alsmede
      ten aanzien van standplaatsen voor woonwagens zijn de artikelen 6 tot en met 14 en 16 tot en met 25, voor zover
      mogelijk, van overeenkomstige toepassing, met dien verstande dat in artikel 10 voor 70dB(A) wordt gelezen: de voor
      de betreffende gebouwen ingevolge de Wet geluidhinder toegestane waarde, vermeerderd met 5dB(A) dat in artikel
      11 – voor zover betrekking hebbend op standplaatsen voor woonwagens – voor 73 dB(A) wordt gelezen: 65 dB(A), dat
      in artikel 12 voor 37dB(A) wordt gelezen: 35dB(A) en dat in afwijking in zoverre van artikel 20, de aanvraag om
      een bijdrage als bedoeld in artikel 6 ten behoeve van scholen en gebouwen voor verpleging wordt ingediend door
      tussenkomst van de inspecteur.
    url: https://wetten.overheid.nl/BWBR0003777/2009-07-04#Artikel26
  - number: '28'
    text: |-
      1 Deze regeling kan worden aangehaald als Bijdrageregeling geluidhinder nieuwe woningen.

      2 Zij treedt in werking met ingang van de dag na de datum van plaatsing ervan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003777/2009-07-04#Artikel28
