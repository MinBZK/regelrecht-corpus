  - number: '2'
    text: |-
      1 De volgende opleidingsdomeinen worden vastgesteld:

      a. Bouw en infra;

      b. Afbouw, hout en onderhoud;

      c. Techniek en procesindustrie;

      d. Ambacht, laboratorium en gezondheidstechniek;

      e. Media en vormgeving;

      f. Informatie en communicatietechnologie;

      g. Mobiliteit en voertuigen;

      h. Transport, scheepvaart en logistiek;

      i. Handel en ondernemerschap;

      j. Economie en administratie;

      k. Veiligheid en sport;

      l. Uiterlijke verzorging;

      m. Horeca en bakkerij;

      n. Toerisme en recreatie;

      o. Zorg en welzijn;

      p. Voedsel, natuur en leefomgeving.

      2 In [bijlage 1][ref1] behorende bij deze regeling wordt per kwalificatiedossier vastgesteld tot welk
      opleidingsdomein als bedoeld in het eerste lid het kwalificatiedossier behoort, met uitzondering van die
      kwalificatiedossiers, die uitsluitend gericht zijn op de kwalificatie voor entree op de arbeidsmarkt.


      [ref1]: https://wetten.overheid.nl/BWBR0031310
    url: https://wetten.overheid.nl/BWBR0031310/2015-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0031310
  - number: '3'
    text: |-
      1 Voor de kwalificatiedossiers opgenomen in [bijlage 1][ref1] behorende bij deze regeling worden de kwalificaties
      vastgesteld overeenkomstig [bijlage 2][ref2] behorende bij deze regeling.

      2 In [bijlage 1][ref3] worden per kwalificatie vastgesteld:

      a. de soort beroepsopleiding, bedoeld in [artikel 7.2.2, eerste lid, van de wet][ref4], waarop de kwalificatie
      is gericht;

      b. de leerweg of leerwegen, bedoeld in [artikel 7.2.2, tweede lid, van de wet][ref5], waarin die beroepsopleiding
      kan worden verzorgd;

      c. het niveau, bedoeld in [artikel 7.2.2, derde lid, van de wet][ref6], van die beroepsopleiding;

      d. de hoogte van de studielast, bedoeld in [artikel 7.2.4, negende lid, van de wet][ref7], van die
      beroepsopleiding;

      e. of toepassing is gegeven aan [artikel 7.2.6, eerste lid, van de wet][ref8], en

      f. de prijsfactor, bedoeld in [artikel 2.2.3, vierde lid van het Uitvoeringsbesluit WEB][ref9].


