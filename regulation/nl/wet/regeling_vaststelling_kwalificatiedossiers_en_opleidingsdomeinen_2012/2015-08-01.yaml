articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *wet:* [Wet educatie en beroepsonderwijs][ref1];

      b. *opleidingsdomein:* een opleidingsdomein als bedoeld in [artikel 1.1.1, onder t2, van de wet][ref2];

      c. *kwalificatie:* een kwalificatie, als bedoeld in [artikel 1.1.1, onder t, van de wet][ref3];

      d. *kwalificatiedossier:* een kwalificatiedossier, als bedoeld in [artikel 1.1.1, onder t1, van de wet][ref4].


