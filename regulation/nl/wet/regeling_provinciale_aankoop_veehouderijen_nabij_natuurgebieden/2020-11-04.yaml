  - number: '1.2'
    text: |-
      De stikstofdepositie van een veehouderijvestiging wordt bepaald met gebruikmaking van de Aankoop-Calculator en
      uitgedrukt in het aantal mol stikstof per hectare per jaar.
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel1
  - number: '2'
    text: |-
      De minister kan een provincie op aanvraag een eenmalige specifieke uitkering verstrekken die onder de voorwaarden,
      vermeld in de [artikelen 3 tot en met 7][ref1], wordt aangewend voor het aankopen van veehouderijen met het oog op
      een blijvende vermindering van de stikstofdepositie op stikstofgevoelige Natura 2000-gebieden.


      [ref1]: https://wetten.overheid.nl/BWBR0044295#Artikel3
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0044295
        artikel: '3'
  - number: '3'
    text: |-
      De uitkering wordt door de provincie aangewend voor de aankoop van veehouderijen met productierecht of
      veehouderijen zonder productierecht voor zover het een vestiging betreft die is gelegen op het grondgebied van
      de provincie en waarvan de stikstofdepositie op stikstofgevoelig Natura 2000-gebied voor zover gelegen binnen een
      straal van 10 km vanaf de vestiging van de veehouderij, in het afgelopen jaar meer bedraagt dan 2 mol stikstof per
      hectare per jaar en waarvoor, voor zover het veehouderijen met productierecht betreft, het benodigde productierecht
      voor ten minste 80% zonder beperking ter beschikking staat aan de veehouderij.
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel3
  - number: '4.1'
    text: 'In dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel4
  - number: 4.1.a
    text: |-
      *voorfinanciering Rijk:* financiering van een aankoop waarbij de in [artikel 5, eerste lid][ref1], bedoelde
      subsidiabele kosten van de aankoop worden gedekt uit de uitkering onder de verplichting uiterlijk ten tijde van de
      in [artikel 12, eerste lid][ref2], bedoelde verantwoording een vergoeding van 100% van de vermogensvorming aan de
      minister te verstrekken;


      [ref1]: https://wetten.overheid.nl/BWBR0044295#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0044295#Artikel12
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0044295
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0044295
        artikel: '12'
  - number: 4.1.b
    text: |-
      *financiering provincie:* financiering van een aankoop waarbij de in [artikel 5, eerste lid][ref1], bedoelde
      subsidiabele kosten van de aankoop na aftrek van de restwaarde, zoals geraamd ten tijde van de aankoop, worden
      gedekt uit de uitkering;


      [ref1]: https://wetten.overheid.nl/BWBR0044295#Artikel5
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0044295
        artikel: '5'
  - number: 4.1.c
    text: |-
      *deel A en deel B van de uitkering:* deel A, respectievelijk deel B van de uitkering, als bedoeld in
      [artikel 9, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044295#Artikel9
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0044295
        artikel: '9'
  - number: '4.2'
    text: |-
      Voor zover deel A van de uitkering toereikend is voor de financiering van de aankoop, vindt die aankoop plaats met
      toepassing van voorfinanciering Rijk.
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel4
  - number: '4.3'
    text: |-
      Het tweede lid is mede van toepassing op een aankoop die voor ten minste 50% met deel A van de uitkering kan worden
      gefinancierd.
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel4
  - number: '4.4'
    text: |-
      Indien geen aankopen meer kunnen worden gedaan met aanwending van deel A van de uitkering, worden, onder de
      voorwaarde dat provinciale staten van de provincie die het aangaat, hiermee hebben ingestemd, aankopen gedaan met
      aanwending van deel B van de uitkering, op welke aankopen financiering provincie van toepassing is.
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel4
  - number: '4.5'
    text: |-
      Indien provinciale staten van een provincie die het aangaat, hebben besloten dat aankopen kunnen worden gedaan
      met financiering provincie ongeacht of hiervoor deel A of deel B van de uitkering wordt aangewend, worden aankopen
      waarvoor de overeenkomst wordt gesloten na het besluit van provinciale staten gedaan met financiering provincie.
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel4
  - number: '5.1'
    text: |-
      De uitkering kan slechts worden aangewend voor de financiering van kosten in verband met de aankoop van een
      vestiging van een veehouderij die betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel5
  - number: 5.1.a
    text: het laten vervallen van productierecht;
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel5
  - number: 5.1.b
    text: de verkrijging van bedrijfsmiddelen en bedrijfsgebouwen;
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel5
  - number: 5.1.c
    text: de verkrijging van landbouwgrond;
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel5
  - number: 5.1.d
    text: de sloop van bedrijfsgebouwen, behalve voor zover het proceskosten betreft en met inachtneming van het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel5
  - number: '5.2'
    text: |-
      In geval van grondruil wordt, voor de toepassing van [artikel 4][ref1], de vermogensvorming dan wel de restwaarde,
      bedoeld in artikel 4, eerste lid, onderdeel a, respectievelijk onderdeel b, bepaald voor de grond die de provincie
      bij de grondruil heeft verworven respectievelijk zal verwerven.


      [ref1]: https://wetten.overheid.nl/BWBR0044295#Artikel4
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0044295
        artikel: '4'
  - number: '5.3'
    text: De uitkering wordt zodanig aangewend dat geen sprake is van ongeoorloofde verlening van staatssteun.
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel5
  - number: '5.4'
    text: De koopsom is gebaseerd op de marktwaarde van de in het eerste lid bedoelde vermogensbestanddelen.
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel5
  - number: '5.5'
    text: |-
      De provincie wendt, indien in het kader van de aankoop omzetbelasting aan de provincie in rekening wordt gebracht,
      de uitkering niet aan voor de financiering daarvan indien:
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel5
  - number: 5.5.a
    text: |-
      de provincie voor compensatie hiervan in aanmerking komt op grond van de [Wet op het BTW-compensatiefonds][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013817
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013817
  - number: 5.5.b
    text: |-
      de provincie in verband met de aankoop als ondernemer wordt aangemerkt in de zin van de
      [Wet op de omzetbelasting 1968][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: '6.1'
    text: |-
      Bij de aanwending van de uitkering voor een aankoop waarborgt de provincie dat de aankoop leidt tot een blijvende
      vermindering van de stikstofemissie vanaf de vestiging, onder meer door uitvoering van het tweede, derde en vierde
      lid.
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel6
  - number: '6.2'
    text: |-
      De provincie draagt er zorg voor dat voorafgaand aan de levering van bedrijfsmiddelen, bedrijfsgebouwen en
      landbouwgrond en binnen een jaar na het sluiten van de koopovereenkomst dan wel binnen de gangbare termijn voor een
      productieronde van de desbetreffende diersoort indien die termijn langer is dan een jaar:
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel6
  - number: 6.2.a
    text: |-
      de activiteiten van de veehouderij op de vestiging zijn beëindigd en de meststoffen vanaf de vestiging zijn
      verwijderd;
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel6
  - number: 6.2.b
    text: |-
      het productierecht dat benodigd is voor het houden van vee op de desbetreffende vestiging voor zover dat
      productierecht zonder beperking aan de veehouderij ter beschikking staat, is komen te vervallen;
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel6
  - number: 6.2.c
    text: |-
      al naar gelang de toepasselijke verplichtingen op grond van de [Wet algemene bepalingen omgevingsrecht][ref1], de
      [Wet milieubeheer][ref2] en de [Wet natuurbescherming][ref3] de omgevingsrechtelijke melding en vergunning en de
      vergunning als bedoeld in [artikel 2.7, tweede lid, van de Wet natuurbescherming][ref4] voor de vestiging worden
      ingetrokken of zodanig worden aangepast dat er niet langer veehouderijactiviteiten zijn toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0024779
      [ref2]: https://wetten.overheid.nl/BWBR0003245
      [ref3]: https://wetten.overheid.nl/BWBR0037552
      [ref4]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0024779
      - id: ref2
        bwb_id: BWBR0003245
      - id: ref3
        bwb_id: BWBR0037552
      - id: ref4
        bwb_id: BWBR0037552
        artikel: '2'
  - number: '6.3'
    text: 'De provincie draagt er zorg voor dat in het kader van de aankoop wordt overeengekomen met de veehouderij dat deze:'
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel6
  - number: 6.3.a
    text: |-
      niet elders in Nederland een veehouderij zal vestigen of overnemen, ook niet via een deelneming van de veehouder in
      een vennootschap, samenwerkingsverband of anderszins;
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel6
  - number: 6.3.b
    text: |-
      anderszins medewerking zal verlenen aan het realiseren van een blijvende vermindering van de stikstofemissie vanaf
      de vestiging.
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel6
  - number: '6.4'
    text: 'De provincie bewerkstelligt dat:'
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel6
  - number: 6.4.a
    text: |-
      de planologische bestemming van de vestiging van de veehouderij zodanig wordt gewijzigd dat op die plaats niet
      langer veehouderijactiviteiten kunnen plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel6
  - number: 6.4.b
    text: |-
      bij aankoop van landbouwgrond waarbij de restwaarde lager is dan de subsidiabele kosten, bedoeld in
      [artikel 5, eerste lid, onder c][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0044295#Artikel5
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0044295
        artikel: '5'
  - number: 6.4.b.i
    text: |-
      voorafgaand aan de in [artikel 12, eerste lid][ref1], bedoelde verantwoording contractueel wordt vastgelegd onder
      welke voorwaarden die grond gebruikt kan worden;


      [ref1]: https://wetten.overheid.nl/BWBR0044295#Artikel12
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0044295
        artikel: '12'
  - number: 6.4.b.ii
    text: de planologische bestemming van die grond hiermee in overeenstemming wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel6
  - number: '6.5'
    text: |-
      In geval van grondruil wordt bij de toepassing van het vierde lid, onderdeel b, uitgegaan van de grond en de
      restwaarde van die grond die de provincie bij de grondruil heeft verworven.
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel6
  - number: '7.1'
    text: |-
      De uitkering wordt zodanig aangewend dat per provincie het totaal van de kosten die worden gemaakt voor de aankoop
      van veehouderijen met productierecht, uitgezonderd de proceskosten en de kosten voor aankoop van bij de vestiging
      behorende landbouwgrond, gedeeld door het totaal van de stikstofdeposities, bedoeld in [artikel 3][ref1], van de
      vestigingen van die veehouderijen, niet meer bedraagt dan € 1.000.000 per mol stikstofdepositie per hectare per
      jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0044295#Artikel3
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0044295
        artikel: '3'
  - number: '7.2'
    text: |-
      De uitkering wordt zodanig aangewend dat per provincie het totaal van de kosten die worden gemaakt voor de
      aankoop van een of meer veehouderijen zonder productierecht, uitgezonderd de proceskosten en de kosten voor
      aankoop van bij de vestiging behorende landbouwgrond, gedeeld door het totaal van de stikstofdeposities, bedoeld
      in [artikel 3][ref1], van de vestigingen van die veehouderijen, niet meer bedraagt dan € 125.000 per mol
      stikstofdepositie per hectare per jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0044295#Artikel3
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0044295
        artikel: '3'
  - number: '7.3'
    text: |-
      De uitkering wordt zodanig aangewend dat per provincie het totaal van de kosten die worden gemaakt voor de aankoop
      van landbouwgrond die behoort bij de vestiging van een of meer veehouderijen, uitgezonderd de proceskosten, gedeeld
      door het totaal van de stikstofdeposities, bedoeld in [artikel 3][ref1], van die landbouwgrond, niet meer bedraagt
      dan € 10.000.000 per mol stikstofdepositie per hectare per jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0044295#Artikel3
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0044295
        artikel: '3'
  - number: '8'
    text: |-
      De uitkering wordt zodanig aangewend dat de koopovereenkomst uiterlijk achttien maanden na de inwerkingtreding van
      deze regeling wordt gesloten.
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel8
  - number: '9.1'
    text: Het plafond voor de verstrekking van specifieke uitkeringen op grond van deze regeling bedraagt € 95.000.000,–.
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel9
  - number: '9.2'
    text: |-
      Bij de verdeling van het plafond wordt onderscheiden tussen deel A en deel B van het plafond, die elk 50% van het
      plafond bedragen.
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel9
  - number: '9.3'
    text: Bij de verdeling van deel A van het plafond wordt gebruik gemaakt van de verdeelsleutel, vermeld in de bijlage.
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel9
  - number: '9.4'
    text: Bij de verdeling van deel B van het plafond wordt gebruik gemaakt van de verdeelsleutel, vermeld in de bijlage.
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel9
  - number: '9.5'
    text: |-
      De minister kan per provincie één uitkering verstrekken die bestaat uit een deel A, gebaseerd op de verdeling van
      deel A van het plafond, en een deel B, gebaseerd op de verdeling van deel B van het plafond.
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel9
  - number: '9.6'
    text: |-
      De uitkering bestaat ten hoogste uit het totaal van de bedragen die met toepassing van het derde en vierde lid voor
      die provincie beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel9
  - number: '9.7'
    text: |-
      Indien de aanvraag betrekking heeft op een lager bedrag dan het bedrag, bedoeld in het zesde lid, worden de
      bedragen die met toepassing van het derde en vierde lid voor die provincie beschikbaar zijn, elk naar rato
      verminderd.
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel9
  - number: '9.8'
    text: |-
      Een provincie kan een aanvraag indienen met gebruikmaking van een middel dat door de minister beschikbaar wordt
      gesteld.
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel9
  - number: '9.9'
    text: |-
      Indien het plafond niet binnen vier maanden na de inwerkingtreding van deze regeling geheel is verdeeld, wordt het
      resterende deel toegedeeld door het ambtshalve verhogen van deel B van de op grond van deze regeling verstrekte
      uitkeringen, voor zover het uitkeringen betreft voor het maximale uitkeringsbedrag, bedoeld in het zesde lid, naar
      rato van de omvang van die uitkeringen.
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel9
  - number: '10'
    text: |-
      De minister verleent de provincie binnen zes weken na de verlening van de uitkering een voorschot van 100% van
      het uitkeringsbedrag.
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel10
  - number: '11.1'
    text: |-
      De minister kan desgevraagd een provincie informatie verschaffen uit registraties op grond van de
      [Meststoffenwet][ref1], de Identificatie en registratie-wetgeving en de [Landbouwwet][ref2] voor zover noodzakelijk
      met het oog op de toepassing van de [artikelen 3][ref3] en [6, tweede lid, onderdelen a en b][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004054
      [ref2]: https://wetten.overheid.nl/BWBR0002252
      [ref3]: https://wetten.overheid.nl/BWBR0044295#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0044295#Artikel6
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004054
      - id: ref2
        bwb_id: BWBR0002252
      - id: ref3
        bwb_id: BWBR0044295
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0044295
        artikel: '6'
  - number: '11.2'
    text: |-
      De provincie verschaft desgevraagd de minister informatie over de aanwending van de uitkering, met inbegrip van
      de borging dat aankopen leiden tot een blijvende vermindering van de stikstofemissie vanaf de vestiging van de
      aangekochte veehouderijen, en over de feitelijke ontwikkeling inzake die stikstofemissie en de stikstofdepositie op
      het in [artikel 3][ref1] bedoelde Natura 2000-gebied.


      [ref1]: https://wetten.overheid.nl/BWBR0044295#Artikel3
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0044295
        artikel: '3'
  - number: '11.3'
    text: De provincie werkt mee aan een door de minister ingestelde evaluatie van deze regeling.
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel11
  - number: '11.4'
    text: |-
      De in het tweede en derde lid bedoelde verplichtingen gelden tot vijf jaar na de datum van de beschikking tot
      vaststelling van de uitkering.
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel11
  - number: '12.1'
    text: |-
      De provincie legt jaarlijks verantwoording af over de besteding van de uitkering voor de desbetreffende aankoop op
      de wijze als bepaald in [artikel 17a van de Financiële-verhoudingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a
  - number: '12.2'
    text: |-
      Nadat de minister de relevante verantwoordingsinformatie, bedoeld in
      [artikel 17a van de Financiële-verhoudingswet][ref1], van de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties heeft ontvangen, stelt de minister binnen 22 weken na die ontvangst de uitkering vast met
      inachtneming van die informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a
  - number: '12.3'
    text: |-
      De minister kan voor een beoordeling van de juistheid van informatie die is verstrekt voor de vaststelling van de
      uitkering, gebruik maken van de daarvoor noodzakelijke gegevens die zijn opgenomen in registraties op grond van de
      [Meststoffenwet][ref1], de Identificatie en registratie-wetgeving en de [Landbouwwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004054
      [ref2]: https://wetten.overheid.nl/BWBR0002252
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004054
      - id: ref2
        bwb_id: BWBR0002252
  - number: '13'
    text: |-
      Deze regeling treedt in werking met ingang van 1 november 2020 en vervalt met ingang van 1 november 2021, met dien
      verstande dat deze regeling van toepassing blijft op aanvragen op grond van deze regeling die tussen 1 november
      2020 en 1 november 2021 zijn gedaan. Indien de Staatscourant waarin deze regeling wordt geplaatst, wordt uitgegeven
      na 31 oktober 2020, treedt zij in werking met ingang van de dag na de datum van uitgifte van de Staatscourant
      waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel13
  - number: '14'
    text: 'Deze regeling wordt aangehaald als: Regeling provinciale aankoop veehouderijen nabij natuurgebieden.'
    url: https://wetten.overheid.nl/BWBR0044295/2020-11-04#Artikel14
