  - number: '8'
    text: De uitkering wordt zodanig aangewend dat de koopovereenkomst uiterlijk wordt gesloten op 30 november 2022.
    url: https://wetten.overheid.nl/BWBR0046077/2022-09-09#Artikel8
  - number: '9'
    text: |-
      1 Het plafond voor de verstrekking van specifieke uitkeringen op grond van deze regeling bedraagt in totaal
      € 228.300.000, bestaande uit:

      a. € 95.000.000; en

      b. € 133.300.000.

      2 Bij de verdeling van het plafond, bedoeld in het eerste lid, onder a, wordt onderscheiden tussen deel A en deel B
      van het plafond, die elk 50% van het plafond bedragen.

      3 Bij de verdeling van deel A van het plafond, bedoeld in het eerste lid, onder a, wordt gebruik gemaakt van de
      verdeelsleutel, vermeld in [bijlage 1][ref1].

      4 Bij de verdeling van deel B van het plafond, bedoeld in het eerste lid, onder a, wordt gebruik gemaakt van de
      verdeelsleutel, vermeld in [bijlage 1][ref2].

      5 Het plafond, bedoeld in het eerste lid, onder b, is onderverdeeld in een maximaal bedrag per provincie zoals
      vermeld in [bijlage 2][ref3].

      6 De minister kan per provincie één uitkering verstrekken die bestaat uit:

      a. een deel A, gebaseerd op de verdeling van deel A van het plafond, bedoeld in het eerste lid, onder a;

      b. een deel B, gebaseerd op de verdeling van deel B van het plafond bedoeld in het eerste lid, onder a; en

      c. voor een provincie, genoemd in [bijlage 2][ref4]: een deel, gebaseerd op het bedrag, bedoeld in het vijfde lid.

      7 De uitkering van de delen A en B bestaat ten hoogste uit het totaal van de bedragen die met toepassing van het
      derde en vierde lid voor die provincie beschikbaar zijn.

      8 Indien de aanvraag van de delen A en B betrekking heeft op een lager bedrag dan het bedrag, bedoeld in het
      zevende lid, worden de bedragen die met toepassing van het derde en vierde lid voor die provincie beschikbaar zijn,
      elk naar rato verminderd.

      9 Een provincie kan een aanvraag indienen met gebruikmaking van een middel dat door de minister beschikbaar wordt
      gesteld.

      10 Als het plafond, bedoeld in het eerste lid, onder b, niet binnen vier maanden na de inwerkingtreding van deze
      regeling geheel is verdeeld, wordt het resterende deel toegedeeld door het ambtshalve verhogen van de op grond van
      het zesde lid, onder c, verstrekte uitkeringen, voor zover het uitkeringen betreft voor het maximale bedrag per
      provincie zoals vermeld in [bijlage 2][ref5], naar rato van de omvang van die uitkeringen.


