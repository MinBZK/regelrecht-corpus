  - number: '12'
    text: |-
      1 De provincie legt na afloop van de periode, bedoeld in [artikel 6, tweede lid][ref1], verantwoording
      af over de besteding van de uitkering voor de desbetreffende aankoop op de wijze als bepaald in
      [artikel 17a van de Financiële-verhoudingswet][ref2].

      2 Nadat de minister de relevante verantwoordingsinformatie, bedoeld in
      [artikel 17a van de Financiële-verhoudingswet][ref3], van de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties heeft ontvangen, stelt de minister binnen 22 weken na die ontvangst de uitkering vast met
      inachtneming van die informatie.

      3 De minister kan voor een beoordeling van de juistheid van informatie die is verstrekt voor de vaststelling van de
      uitkering, gebruik maken van de daarvoor noodzakelijke gegevens die zijn opgenomen in registraties op grond van de
      [Meststoffenwet][ref4], de [Wet dieren][ref5] en de [Landbouwwet][ref6].


