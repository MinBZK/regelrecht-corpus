  - number: '7'
    text: |-
      1 De uitkering wordt zodanig aangewend dat per provincie het totaal van de kosten die worden gemaakt voor
      de aankoop van veehouderijen met productierecht, uitgezonderd de proceskosten en de kosten voor aankoop
      van bij de vestiging behorende landbouwgrond, gedeeld door het totaal van de stikstofdeposities, bedoeld
      in [artikel 3][ref1], van de vestigingen van die veehouderijen, niet meer bedraagt dan € 1.000.000 per mol
      stikstofdepositie per hectare per jaar.

      2 De uitkering wordt zodanig aangewend dat per provincie het totaal van de kosten die worden gemaakt voor de
      aankoop van een of meer veehouderijen zonder productierecht, uitgezonderd de proceskosten en de kosten voor
      aankoop van bij de vestiging behorende landbouwgrond, gedeeld door het totaal van de stikstofdeposities,
      bedoeld in [artikel 3][ref2], van de vestigingen van die veehouderijen, niet meer bedraagt dan € 250.000 per mol
      stikstofdepositie per hectare per jaar.

      3 De uitkering wordt zodanig aangewend dat per provincie het totaal van de kosten die worden gemaakt voor de
      aankoop van landbouwgrond die behoort bij de vestiging van een of meer veehouderijen, uitgezonderd de proceskosten,
      gedeeld door het totaal van de stikstofdeposities, bedoeld in [artikel 3][ref3], van die landbouwgrond, niet meer
      bedraagt dan € 10.000.000 per mol stikstofdepositie per hectare per jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0046077#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0046077#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0046077#Artikel3
