  - number: '10'
    text: |-
      De minister verleent de provincie binnen zes weken na de verlening van de uitkering een voorschot van 100% van
      het uitkeringsbedrag.
    url: https://wetten.overheid.nl/BWBR0046077/2022-09-09#Artikel10
  - number: '11'
    text: |-
      1 De minister kan desgevraagd een provincie informatie verschaffen uit registraties op grond van de
      [Meststoffenwet][ref1], de [Wet dieren][ref2] en de [Landbouwwet][ref3] voor zover noodzakelijk met het oog op de
      toepassing van de [artikelen 3][ref4] en [6, tweede lid, onderdelen a en b][ref5].

      2 De provincie verschaft desgevraagd de minister informatie over de aanwending van de uitkering, met inbegrip van
      de borging dat aankopen leiden tot een blijvende vermindering van de stikstofemissie vanaf de vestiging van de
      aangekochte veehouderijen, en over de feitelijke ontwikkeling inzake die stikstofemissie en de stikstofdepositie op
      het in [artikel 3][ref6] bedoelde Natura 2000-gebied.

      3 De provincie werkt mee aan een door de minister ingestelde evaluatie van deze regeling.

      4 De in het tweede en derde lid bedoelde verplichtingen gelden tot vijf jaar na de datum van de beschikking tot
      vaststelling van de uitkering.


