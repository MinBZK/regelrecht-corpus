    text: |-
      1 In deze regeling wordt verstaan onder:

        - *aankoop:* **aankoop in de zin van [artikel 3][ref1], met inbegrip van de levering van bedrijfsmiddelen,
      bedrijfsgebouwen of landbouwgrond;
        - *Aankoop-Calculator:* rekeninstrument voor het bepalen van de stikstofdepositie op Natura 2000-gebied,
      beschikbaar op [https://aankoopcalculator.aerius.nl/](onbekend);
        - *bedrijfsgebouwen:* gebouwen, uitgezonderd een bedrijfswoning, en bouwwerken die deel uitmaken van een
      veehouderij, waaronder dierenverblijven, mest- en voersilo’s en mestkelders;
        - *bedrijfsmiddelen:* roerende zaken die worden gebruikt door een veehouderij, zoals trekkers en andere werktuigen;
        - *grondruil:* maatregel waarbij de provincie na de aankoop van landbouwgrond deze grond voorafgaand aan de in
      [artikel 12, eerste lid][ref2], bedoelde verantwoording geheel of gedeeltelijk verkoopt ter verwerving van andere
      grond met een landbouwbestemming in de directe omgeving van het Natura 2000-gebied in de nabijheid waarvan de
      aangekochte veehouderij is gelegen, zonder dat voor die verwerving extra financiële middelen benodigd zijn;
        - *landbouwgrond:* bij een vestiging van een veehouderij behorende grond met een landbouwbestemming die wordt
      gebruikt voor de veehouderij, met uitzondering van de grond onder en rond de bedrijfswoning;
        - *minister:* Minister van Landbouw, Natuur en Voedselkwaliteit;
        - *proceskosten:* indirecte kosten die worden gemaakt in het kader van de aankoop, bedoeld in [artikel 3][ref3],
      zoals kosten van planvorming, adviseurs, taxateurs, notarissen en kadaster;
        - *omgevingsrechtelijke melding en vergunning:* melding op grond van het [Activiteitenbesluit milieubeheer][ref4]
      of, na de inwerkingtreding van de [Omgevingswet][ref5], melding als bedoeld in
      [artikel 4.808 van het Besluit activiteiten leefomgeving][ref6], vergunning als bedoeld in
      [artikel 2.1, eerste lid, onder i, van de Wet algemene bepalingen omgevingsrecht][ref7], vergunning verleend
      krachtens artikel 2.1, eerste lid, onderdeel e, van de Wet algemene bepalingen omgevingsrecht, dan wel, na
      inwerkingtreding van de Omgevingswet, vergunning voor een milieubelastende activiteit als bedoeld in die wet;
        - *productierecht:* productierecht als bedoeld in [artikel 1, eerste lid, onderdeel aa, van de Meststoffenwet][ref8];
        - *restwaarde:* economische waarde die de bij de aankoop door de provincie verkregen vermogensbestanddelen hebben
      na uitvoering van de in [artikel 6][ref9] bedoelde maatregelen, zoals bepaald door een onafhankelijke taxateur;
        - *stikstofgevoelig Natura 2000-gebied:* Natura 2000-gebied als bedoeld in
      [artikel 1.1, eerste lid, van de Wet natuurbescherming][ref10], dan wel, na inwerkingtreding van de
      [Omgevingswet][ref11], als bedoeld in die wet, met een voor stikstof gevoelige habitat met een te hoge
      stikstofbelasting, dat deel uitmaakte van het programma aanpak stikstof 2015–2021 als vastgesteld door de Minister
      van Landbouw, Natuur en Voedselkwaliteit en de Minister van Infrastructuur en Waterstaat;
        - *veehouderij:* onderneming waarin de primaire productie van landbouwproducten plaatsvindt door het houden van
      landbouwhuisdieren;
        - *veehouderij met productierecht:* veehouderij voor het houden van melkvee, als bedoeld in
      [artikel 1, eerste lid, onderdeel kk, van de Meststoffenwet][ref12], of van kippen, kalkoenen of varkens;
        - *veehouderij zonder productierecht:* veehouderij voor het houden van vleeskalveren of andere
      runderen, bestemd voor de productie van vlees, voor zover geen sprake is van melkvee, als bedoeld in
      [artikel 1, eerste lid, onderdeel kk, van de Meststoffenwet][ref13], of melkgeiten;
        - *vermogensvorming:* opbrengsten van de bij de aankoop door de provincie verkregen vermogensbestanddelen en
      restwaarde van die vermogensbestanddelen;
        - *vestiging:* gebouw of complex van gebouwen waar door een veehouderij duurzaam vee wordt gehouden.

      2 De stikstofdepositie van een veehouderijvestiging wordt bepaald met gebruikmaking van de Aankoop-Calculator en
      uitgedrukt in het aantal mol stikstof per hectare per jaar.


