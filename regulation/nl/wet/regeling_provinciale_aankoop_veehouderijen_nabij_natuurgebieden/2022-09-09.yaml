  - number: 12a
    text: |-
      Aanvragen die zijn ingediend en uitkeringen en voorschotten die zijn verleend op grond van de
      [Regeling provinciale aankoop veehouderijen nabij natuurgebieden][ref1] zoals zij luidde tot 1 november 2021,
      worden aangemerkt als aanvragen, uitkeringen en voorschotten op grond van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0044295
