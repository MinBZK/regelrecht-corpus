  - number: '6'
    text: |-
      1 Bij de aanwending van de uitkering voor een aankoop waarborgt de provincie dat de aankoop leidt tot een blijvende
      vermindering van de stikstofemissie vanaf de vestiging, onder meer door uitvoering van het tweede, derde en vierde
      lid.

      2 De provincie draagt er zorg voor dat voorafgaand aan de levering van bedrijfsmiddelen, bedrijfsgebouwen en
      landbouwgrond en binnen een jaar na het sluiten van de koopovereenkomst dan wel binnen de gangbare termijn voor een
      productieronde van de desbetreffende diersoort indien die termijn langer is dan een jaar:

      a. de activiteiten van de veehouderij op de vestiging zijn beëindigd en de meststoffen vanaf de vestiging zijn
      verwijderd;

      b. het productierecht dat benodigd is voor het houden van vee op de desbetreffende vestiging voor zover dat
      productierecht zonder beperking aan de veehouderij ter beschikking staat, is komen te vervallen;

      c. al naar gelang de toepasselijke verplichtingen op grond van de [Wet algemene bepalingen omgevingsrecht][ref1],
      de [Wet milieubeheer][ref2] en de [Wet natuurbescherming][ref3], dan wel op grond van de
      [Omgevingswet][ref4]: de omgevingsrechtelijke melding en vergunning en de vergunning als bedoeld in
      [artikel 2.7, tweede lid, van de Wet natuurbescherming][ref5], dan wel, na de inwerkingtreding van de
      Omgevingswet, de omgevingsvergunning voor de Natura 2000-activiteit voor de vestiging worden ingetrokken of zodanig
      worden aangepast dat er niet langer veehouderijactiviteiten zijn toegestaan.

      3 De provincie draagt er zorg voor dat in het kader van de aankoop wordt overeengekomen met de veehouderij dat
      deze:

      a. niet elders in Nederland een veehouderij zal vestigen of overnemen, ook niet via een deelneming van de veehouder
      in een vennootschap, samenwerkingsverband of anderszins;

      b. anderszins medewerking zal verlenen aan het realiseren van een blijvende vermindering van de stikstofemissie
      vanaf de vestiging.

      4 De provincie bewerkstelligt dat:

      a. de planologische bestemming van de vestiging van de veehouderij zodanig wordt gewijzigd dat op die plaats niet
      langer veehouderijactiviteiten kunnen plaatsvinden;

      b. bij aankoop van landbouwgrond waarbij de restwaarde lager is dan de subsidiabele kosten, bedoeld in
      [artikel 5, eerste lid, onder c][ref6]:

      i. voorafgaand aan de in [artikel 12, eerste lid][ref7], bedoelde verantwoording contractueel wordt vastgelegd
      onder welke voorwaarden die grond gebruikt kan worden;

      ii. de planologische bestemming van die grond hiermee in overeenstemming wordt gebracht.

      5 In geval van grondruil wordt bij de toepassing van het vierde lid, onderdeel b, uitgegaan van de grond en de
      restwaarde van die grond die de provincie bij de grondruil heeft verworven.


