  - number: '13'
    text: |-
      1 Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst en werkt terug tot en met 1 november 2021.

      2 Deze regeling vervalt met ingang van 1 december 2022, met dien verstande dat zij van toepassing blijft op
      voordien ingediende aanvragen.
    url: https://wetten.overheid.nl/BWBR0046077/2022-09-09#Artikel13
