  - number: '5'
    text: |-
      1 De uitkering kan slechts worden aangewend voor de financiering van kosten in verband met de aankoop van een
      vestiging van een veehouderij die betrekking hebben op:

      a. het laten vervallen van productierecht;

      b. de verkrijging van bedrijfsmiddelen en bedrijfsgebouwen;

      c. de verkrijging van landbouwgrond;

      d. de sloop van bedrijfsgebouwen,

      behalve voor zover het proceskosten betreft en met inachtneming van het vijfde lid.

      2 In geval van grondruil wordt, voor de toepassing van [artikel 4][ref1], de vermogensvorming dan wel de
      restwaarde, bedoeld in artikel 4, eerste lid, onderdeel a, respectievelijk onderdeel b, bepaald voor de grond die
      de provincie bij de grondruil heeft verworven respectievelijk zal verwerven.

      3 De uitkering wordt zodanig aangewend dat geen sprake is van ongeoorloofde verlening van staatssteun.

      4 De koopsom is gebaseerd op de marktwaarde van de in het eerste lid bedoelde vermogensbestanddelen.

      5 De provincie wendt, indien in het kader van de aankoop omzetbelasting aan de provincie in rekening wordt
      gebracht, de uitkering niet aan voor de financiering daarvan indien:

      a. de provincie voor compensatie hiervan in aanmerking komt op grond van de [Wet op het BTW-compensatiefonds][ref2];

      b. de provincie in verband met de aankoop als ondernemer wordt aangemerkt in de zin van de
      [Wet op de omzetbelasting 1968][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0046077#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013817
      [ref3]: https://wetten.overheid.nl/BWBR0002629
