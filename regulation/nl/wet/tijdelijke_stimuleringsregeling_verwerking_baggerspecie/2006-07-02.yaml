        artikel: '5'
  - number: '7'
    text: |-
      1 De subsidieontvanger voert een zodanig ingerichte administratie, dat daaruit te allen tijde de voor de
      vaststelling van de subsidie van belang zijnde rechten en verplichtingen alsmede de betalingen en ontvangsten
      kunnen worden nagegaan. De administratie en de daartoe behorende bescheiden worden gedurende tien jaar na
      vaststelling van de subsidie bewaard.

      2 De subsidieontvanger verleent medewerking aan het verzoek van de minister of de uitvoeringsorganisatie om
      informatie dan wel aan het door de minister of de uitvoeringsorganisatie laten verrichten van een contra-expertise
      of controle van de boekhouding.

      3 De subsidieontvanger doet onverwijld nadat een verzoek tot verlening van surseance van betaling aan of
      faillietverklaring van hem bij de rechtbank is ingediend, daarvan mededeling aan de uitvoeringsorganisatie.

      4 De subsidieontvanger doet onverwijld mededeling aan de uitvoeringsorganisatie indien er afwijkingen optreden
      t.a.v. de geplande activiteiten als aangegeven op het in [artikel 6 lid 1][ref1] aangegeven formulier.

      5 De subsidieontvanger meldt aan de uitvoeringsorganisatie iedere wijziging in verwerkingstechniek, anders dan
      waarvoor subsidie is aangevraagd.

      6 Nadat er is gebaggerd en de partij baggerspecie is afgeleverd bij de subsidieontvanger meldt deze aan de
      uitvoeringsorganisatie de ex situ kwaliteitsgegevens van de partij, conform NEN 5740: Bodem. Onderzoeksstrategie
      bij verkennend onderzoek of VKB 1018: Monsterneming grond ten behoeve van partijkeuringen en de ex situ gegevens
      van de kwantiteit van de partij conform RAW 22.07.10: Meet- en verrekenmethoden.


      [ref1]: https://wetten.overheid.nl/BWBR0013877#Artikel6
