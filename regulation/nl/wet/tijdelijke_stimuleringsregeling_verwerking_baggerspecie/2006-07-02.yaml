  - number: '2'
    text: |-
      De minister kan ter stimulering van verwerking van een partij klasse 3 of klasse 4 baggerspecie een eenmalige
      subsidie verstrekken aan een verwerker als tegemoetkoming in de kosten van realisatie van de verwerking.
    url: https://wetten.overheid.nl/BWBR0013877/2006-07-02#Artikel2
  - number: '3'
    text: |-
      1 Alleen verwerking van niet-reinigbare baggerspecie met een minimum partij-omvang van 500 ton droge stof,
      afkomstig van Nederlandse wateren, komt in aanmerking voor subsidie. De niet-reinigbaarheid wordt bij de aanvraag
      aangetoond door middel van het overleggen van:

      a. het rapport van één van de, voor de desbetreffende partij toepasselijke, protocollen, genoemd onder punt 4.2 van
      het in [bijlage A][ref1] van deze regeling opgenomen aanvraagformulier, of

      b. een verklaring als bedoeld in
      [artikel 12, eerste lid, onderdeel e, van de Wet belastingen op milieugrondslag][ref2] zoals dit luidde op
      31 december 2004.

      2 Alleen baggerspecie die volledig is verwerkt tot een bouwstof, en is toegepast in een werk als bedoeld in
      [artikel 1, eerste lid, onderdeel a, van het Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming][ref3] dan
      wel is afgezet op de markt, komt in aanmerking voor subsidie.

      3 Alleen baggerspecie welke nog niet gebaggerd is op het moment dat de aanvraag wordt ingediend komt in aanmerking
      voor subsidie.

      4 Geen subsidie wordt verleend voor de verwerking van baggerspecie indien de opdracht is verkregen door
      inschrijving op de in het kader van de proef Grootschalige verwerking baggerspecie uitgeschreven aanbesteding,
      gepubliceerd in de Staatscourant van 15 oktober 2003, nr. 199.

      5 Geen subsidie voor verwerking wordt verstrekt indien reeds subsidie is verstrekt door een ander bestuursorgaan.

      6 De Minister trekt de subsidie in indien:

      a. niet binnen één jaar na de subsidieverlening het transport naar de verwerker heeft plaatsgevonden van ten minste
      250 ton droge stof van de partij baggerspecie waarop de subsidie betrekking heeft;

      b. de verwerking en afzet van de bouwstof in een werk of op de markt voor bouw(grond)stoffen niet binnen vier jaar
      na de subsidieverlening is voltooid.

      7 Voor de verwerking van de baggerspecie waarvoor de subsidie is verleend, beschikt de subsidieontvanger of, indien
      het werk aan een derde is opgedragen, deze derde, over een inrichting in de zin van de [Wet milieubeheer][ref4]
      voor de verwerking van baggerspecie.


