        bwb_id: BWBR0007667
  - number: '6'
    text: |-
      1 De verwerker dient een aanvraag van de subsidie in bij de uitvoeringsorganisatie met gebruikmaking van
      het in [bijlage A][ref1] vermelde formulier en de aanvraag gaat vergezeld van de in dit formulier aangegeven
      bewijsstukken.

      2 Voor elk van de drie kwaliteitsklassen als aangegeven in [artikel 5 lid 1][ref2], 2 en 3 wordt een aparte
      aanvraag ingediend.

      3 In geval de ontdoener en verwerker niet dezelfde rechtspersoon zijn wordt een overeenkomst tussen ontdoener en
      verwerker bij de aanvraag overgelegd, voor de verwerking van de desbetreffende partij baggerspecie.


      [ref1]: https://wetten.overheid.nl/BWBR0013877
      [ref2]: https://wetten.overheid.nl/BWBR0013877#Artikel5
    url: https://wetten.overheid.nl/BWBR0013877/2006-07-02#Artikel6
