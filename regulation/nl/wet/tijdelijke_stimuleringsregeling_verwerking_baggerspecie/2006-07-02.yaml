  - number: '4'
    text: |-
      Het subsidieplafond voor de uitvoering van de regeling bedraagt € 3,6 miljoen inclusief BTW voor de periode van 4
      jaar vanaf de inwerkingtreding van de regeling.
    url: https://wetten.overheid.nl/BWBR0013877/2006-07-02#Artikel4
  - number: '5'
    text: |-
      1 De subsidie voor verwerking van een partij baggerspecie klasse 3 met alle
      componenten beneden of gelijk aan de samenstellingswaarden voor grond, bedoeld in
      [bijlage 2 van het Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming][ref1], bedraagt € 4,- (inclusief
      BTW) per ton droge stof.

      2 De subsidie voor verwerking van een partij baggerspecie klasse 3 met één of meer componenten boven de
      samenstellingswaarden voor grond, zoals bedoeld in het Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming
      bijlage 2, bedraagt € 10,- (inclusief BTW) per ton droge stof.

      3 De subsidie voor verwerking van een partij baggerspecie klasse 4 bedraagt € 23,- (inclusief BTW) per ton droge
      stof.


      [ref1]: https://wetten.overheid.nl/BWBR0007667
    url: https://wetten.overheid.nl/BWBR0013877/2006-07-02#Artikel5
    references:
