  - number: '8'
    text: |-
      1 Op aanvragen die voldoen aan [artikel 6][ref1] wordt in volgorde van ontvangst beslist.

      2 De minister geeft op de aanvraag een beschikking omtrent verlening van subsidie binnen dertien weken na de datum
      van ontvangst van de aanvraag.

      3 Indien de beschikking omtrent verlening van de subsidie niet binnen dertien weken kan worden gegeven, stelt
      de minister de aanvrager daarvan in kennis en noemt daarbij een redelijke termijn waar binnen de beschikking wel
      tegemoet kan worden gezien.


      [ref1]: https://wetten.overheid.nl/BWBR0013877#Artikel6
    url: https://wetten.overheid.nl/BWBR0013877/2006-07-02#Artikel8
