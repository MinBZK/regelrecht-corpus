        artikel: '6'
  - number: '9'
    text: |-
      1 De subsidieontvanger dient binnen dertien weken nadat de verwerking heeft plaatsgevonden en de bouwstof is
      toegepast in een werk of afgezet op de markt een aanvraag tot subsidievaststelling in.

      2 De aanvraag tot subsidievaststelling gaat vergezeld van:

      a. een schriftelijke verantwoording omtrent het verloop, de uitvoering en de resultaten van de activiteiten volgens
      het format zoals opgenomen in [bijlage 2][ref1] van [bijlage A][ref2];

      b. een goedkeurende accountantsverklaring overeenkomstig het in [bijlage B][ref3] opgenomen controleprotocol.

      3 Indien de aanvraag tot subsidievaststelling minder bedraagt dan € 100.000 inclusief BTW kan in afwijking van het
      tweede lid, onder b, worden volstaan met de schriftelijke verantwoording als vermeld in het tweede lid, onder a.

      4 Op aanvraag kan de termijn, zoals bedoeld in het eerste lid, worden verlengd met ten hoogste dertien weken.

      5 Indien de aanvrager niet binnen de termijn zoals bedoeld in het eerste en vierde lid, een aanvraag tot
      subsidievaststelling indient, stelt de minister de subsidie ambtshalve vast.

      6 Uitkering van de subsidie vindt niet eerder plaats dan nadat de subsidie is vastgesteld.


