preamble:
  text: |-
    Gelet op de artikelen, 3, 4 en 6 van de Kaderwet subsidies verkeer en waterstaat;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0013877/2006-07-02#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:



              a

                *minister:*


                Minister van Verkeer en Waterstaat;



              b

                *afvalstoffen:*


                afvalstoffen als bedoeld in de [Wet milieubeheer][ref1];



              c

                *baggerspecie:*


                grond die uit de bodem is vrijgekomen via het oppervlaktewater of de voor dat water bestemde ruimte,
      daaronder begrepen sediment en het residu van de reiniging van baggerspecie;
                Niet vallende onder baggerspecie:
                voorwerpen die afzonderlijk van of uit de waterbodem zijn verwijderd;
      voorwerpen die redelijkerwijs tijdens het baggeren uit de baggerspecie kunnen worden verwijderd, alsmede voorwerpen
      die na het baggeren uit de baggerspecie zijn verwijderd;
      stoffen en producten die zijn ontstaan door de behandeling of toepassing van baggerspecie, het residu van de
      reiniging van baggerspecie daaronder niet begrepen;



              d

                *bouwstof:*


                materiaal in de hoedanigheid waarin het is bestemd in een werk te worden gebruikt en waarin de
      totaalgehalten van silicium, calcium of aluminium tezamen meer dan 10% (m/m) van dat materiaal bedragen en dat
      voldoet aan het bij of krachtens het [Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming][ref2] bepaalde;



              e

                *verontreinigde baggerspecie:*


                baggerspecie met een kwaliteit liggend boven één of meer van de streefwaarden voor sediment zoals vermeld
      in Tabel 1 van de Regeringsbeslissing Vierde Nota Waterhuishouding zoals gewijzigd in de ministerraad van 12 mei
      2000, Staatscourant 2000, 114;



              f

                *reinigbare baggerspecie:*


                verontreinigde baggerspecie met een zandgehalte gelijk aan of groter dan 60 gewichtsprocent op droge
      stofbasis;



              g

                *klasse 3 baggerspecie:*


                verontreinigde baggerspecie met een kwaliteit liggend boven één of meer van de toetsingswaarden
      en onder of gelijk aan de interventiewaarden zoals vermeld in Tabel 2 van de Regeringsbeslissing Vierde Nota
      Waterhuishouding zoals gewijzigd in de ministerraad van 12 mei 2000, Staatscourant 2000, 114;



              h

                *klasse 4 baggerspecie:*


                verontreinigde baggerspecie met een kwaliteit liggend boven één of meer van de interventiewaarden zoals
      vermeld in Tabel 2 van de Regeringsbeslissing Vierde Nota Waterhuishouding zoals gewijzigd in de ministerraad van
      12 mei 2000, Staatscourant 2000, 114;



              i

                *partij:*


                een hoeveelheid baggerspecie welke is bepaald naar herkomst, kwaliteit en omvang;



              j

                *verwerken:*


                zodanig behandelen van baggerspecie dat er een bouwstof ontstaat;



              k

                *verwerker:*


                organisatie die beschikt over een ISO 9001 certificaat voor het verwerken van baggerspecie of een
      aantoonbaar traject tot het verkrijgen daarvan heeft ingezet;



              l

                *ontdoener:*


                degene die zich ontdoet of voornemens is zich te ontdoen van baggerspecie;



              m

                *residu van de reiniging van baggerspecie:*


                slibfractie resterend na het afscheiden van zand uit de baggerspecie;



              n

                *uitvoeringsorganisatie:*


                door de minister aan te wijzen organisatie belast met de uitvoering van de regeling;



              o

                *NEN:*


                door de Stichting Nederlands Normalisatie-instituut uitgegeven norm;



              p

                *VKB:*


                een door de Vereniging Kwaliteitsborging Bodemonderzoek uitgegeven protocol;



              q

                *RAW:*


                Rationalisatie en Automatisering in de Grond-, Water-, en Wegenbouw.


