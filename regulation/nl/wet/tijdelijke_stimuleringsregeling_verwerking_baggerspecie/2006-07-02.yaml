  - number: '10'
    text: |-
      Met het toezicht op de naleving van de aan de subsidie verbonden verplichtingen zijn belast de door de Minister
      aangewezen medewerkers van de uitvoeringsorganisatie.
    url: https://wetten.overheid.nl/BWBR0013877/2006-07-02#Artikel10
  - number: '11'
    text: |-
      1 De minister stelt jaarlijks na de inwerkingtreding van deze regeling een verslag vast over de doeltreffendheid en
      de effecten van deze regeling in de praktijk.

      2 Ten behoeve van de inhoud van het in het eerste lid genoemde verslag levert de uitvoeringsorganisatie een
      bijdrage voor wat betreft de wijze waarop de besteding van de subsidiegelden heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0013877/2006-07-02#Artikel11
  - number: '12'
    text: |-
      1 Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst en vervalt vier jaar na het tijdstip van inwerkingtreding.

      2 In afwijking van het eerste lid blijft de regeling van toepassing op de aanvragen voor subsidie die voor het
      verval van de regeling zijn ingediend.
    url: https://wetten.overheid.nl/BWBR0013877/2006-07-02#Artikel12
  - number: '13'
    text: 'Deze regeling wordt aangehaald als: Tijdelijke Stimuleringsregeling verwerking baggerspecie.'
    url: https://wetten.overheid.nl/BWBR0013877/2006-07-02#Artikel13
  - number: BB:1
    text: |-
      1.1 Dit controleprotocol heeft betrekking op de aanvraag tot subsidievaststelling ten behoeve van ... De
      voorwaarden voor deze subsidie liggen vast in de Tijdelijke Stimuleringsregeling verwerking baggerspecie zoals
      gepubliceerd in de Staatscourant van...*(datum).*

      1.2 In dit controleprotocol wordt uiteengezet welke algemene uitgangspunten en specifieke vereisten gelden bij de
      uitvoering van de controle van de aanvraag tot subsidievaststelling door de accountant van de subsidieontvanger,
      alsmede op welke wijze de uitkomsten van deze controle dienen te worden gerapporteerd.

      1.3 De verantwoordelijkheid voor het opstellen van de aanvraag tot subsidievaststelling berust bij de
      subsidieontvanger.

      1.4 In de aanvraag tot subsidievaststelling moet worden aangegeven in hoeverre de werkelijke omvang van de
      aangeleverde en verwerkte partij baggerspecie, zoals opgenomen in de door de subsidieontvanger ingediende aanvraag
      en waarvoor een subsidie is toegezegd, werkelijk zijn aangeleverd en verwerkt.
    url: https://wetten.overheid.nl/BWBR0013877/2006-07-02#Artikel1
  - number: BB:2
    text: |-
      2.1 De controle betreft zowel de getrouwe weergave als de rechtmatigheid. Van de controlerend accountant wordt
      verwacht dat hij niet alleen de getrouwe weergave controleert, maar ook dat hij de naleving van de relevante
      voorwaarden toetst, dat nagegaan wordt dat met betrekking tot de in de aanvraag tot subsidievaststelling
      opgenomen hoeveelheden, van toepassing zijnde ontvangsten en andere gegevens toetst, dat de prestaties
      daadwerkelijk zijn verricht en passen binnen het kader van de activiteiten zoals die genoemd zijn in de Tijdelijke
      Stimuleringsregeling verwerking baggerspecie.

      2.2 Ten aanzien van de uitvoering van de controle door de derde accountant geldt de gebruikelijke bij soortgelijke
      controles gehanteerde toleranties. De controletolerantie heeft uitsluitend betrekking op het totaal van de kosten,
      dus niet op de afzonderlijk genoemde kostenposten.

      2.3 Voor de rapportering geldt dat de bij de controle geconstateerde en niet gecorrigeerde fouten en onzekerheden,
      die individueel of in totaal meer bedragen dan 1% van het totaal van kosten en individueel meer bedragen dan €
      10.000, dienen deze individueel te worden gerapporteerd.

      2.4 Het is in beginsel mogelijk dat door de Accountantsdienst van het Ministerie van Verkeer en Waterstaat
      of door deze aangewezen accountants een review zal worden uitgevoerd bij de controlerend accountant van de
      subsidieontvanger ter toetsing van de naleving van het controleprotocol. Indien een review wordt uitgevoerd zal
      hierover overleg worden gepleegd met de subsidieontvanger.
    url: https://wetten.overheid.nl/BWBR0013877/2006-07-02#Artikel2
  - number: BB:3
    text: |-
      3.1 Bij de uitvoering van de controle dient te worden vastgesteld dat:

      a. Alleen verwerking van niet-reinigbare baggerspecie klasse 3 of 4, afkomstig uit Nederlandse wateren, waarvoor
      een verklaring wordt overgelegd als bedoeld in artikel 12, eerste lid, onderdeel e, van de Wet belastingen op
      milieugrondslag met een minimum partijomvang van 500 ton droge stof, op de eindafrekening zijn verantwoord.

      b. Alleen baggerspecie die volledig is verwerkt tot een bouwstof, en is toegepast in een werk als bedoeld in
      artikel 1, eerste lid, onderdeel a, van het Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming dan wel is
      afgezet op de markt, op de eindafrekening zijn verantwoord.

      c. Alleen baggerspecie welke nog niet gebaggerd was op het moment dat de aanvraag was ingediend op de
      eindafrekening zijn verantwoord.

      d. De op de eindafrekening verantwoorde hoeveelheden passen binnen de omschrijving van de activiteit zoals
      beschreven in de Tijdelijke Stimuleringsregeling verwerking baggerspecie.

      e. Op de eindafrekening verantwoorde hoeveelheden baggerspecie juist zijn weergegeven.

      f. Verwerking van baggerspecie welke is aangeboden aan de te realiseren combinatie van verwerking dan wel reiniging
      en stortcapaciteit op de locatie Koegorspolder niet op eindafrekening zijn verantwoord.

      g. Geen subsidie reeds is verstrekt door een ander bestuursorgaan.

      h. Het transport van de partij baggerspecie naar de verwerker binnen één jaar na de subsidieverlening volledig
      heeft plaatsgevonden en de verwerking en afzet van de bouwstof in een werk of op de markt voor bouw(grond)stoffen
      binnen vier jaar na de subsidieverlening is voltooid.

      3.2 Ten aanzien van de onder 3.1 opgenomen specifieke aandachtspunten geldt dat alle bij de controle geconstateerde
      en niet gecorrigeerde fouten en onzekerheden dienen te worden gerapporteerd.
    url: https://wetten.overheid.nl/BWBR0013877/2006-07-02#Artikel3
  - number: BB:4
    text: |-
      Een model van de accountantsverklaring luidt als volgt:

        - **ACCOUNTANTSVERKLARING**
        - *Opdracht* Wij hebben  de bijgaande en door ons gewaarmerkte eindafrekening inzake de Tijdelijke
      Stimuleringregeling verwerking baggerspecie zoals vastgelegd in de Staatscourant van ... *(datum)* gecontroleerd.
      Deze afrekening is bestemd voor de bepaling van de definitieve subsidie van het Ministerie van Verkeer en
      Waterstaat in het kader van Tijdelijke Stimuleringsregeling verwerking baggerspecie. Deze eindafrekening is
      opgesteld onder verantwoordelijkheid van de leiding van ... (naam huishouding . Het is onze verantwoordelijkheid
      een accountantsverklaring inzake deze eindafrekening te verstrekken. Voor het onderhavige project is met
      beschikking van NOVEM, kenmerk ... de dato ... een subsidie verleend (tot een maximum) van € ... (bedrag).
        - *Werkzaamheden* Onze controle is verricht overeenkomstig algemeen aanvaarde richtlijnen met betrekking tot
      controleopdrachten en overigens zoals omschreven in het controleprotocol Tijdelijke Stimuleringsregeling verwerking
      baggerspecie versie <datum invullen>. Volgens de richtlijnen dient onze controle zodanig te worden gepland en
      uitgevoerd, dat een redelijke mate van zekerheid wordt verkregen dat de eindafrekening geen onjuistheden van
      materieel belang bevat. Een controle omvat onder meer een onderzoek door middel van deelwaarnemingen van informatie
      ter onderbouwing van de bedragen in de eindafrekening. Tevens omvat een controle een beoordeling van de grondslagen
      voor financiële verslaggeving die bij het opmaken de eindafrekening zijn toegepast. Wij zijn van mening dat onze
      controle een deugdelijke grondslag vormt voor ons oordeel.
        - *Oordeel* Op grond van ons onderzoek zijn wij van oordeel dat is voldaan aan alle ter zake gestelde voorwaarden
      (behoudens hierna vermelde bevindingen). Bevindingen en kwantitatieve gegevens (indien van toepassing) *(plaats,
      datum)* *Naam accountantskantoor/dienst* *Handtekening accountant*
    url: https://wetten.overheid.nl/BWBR0013877/2006-07-02#Artikel4
