        artikel: '94'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002856
        artikel: '93'
        paragraaf: '4'
  - number: '96'
    text: >-
      1 Ter vergoeding van de kosten voor het afleggen van de proeve is de aanvrager een door de ledenvergadering bij
      verordening vast te stellen bedrag verschuldigd.


      2 Verordeningen, vastgesteld krachtens het eerste lid, behoeven de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel96
  - number: '97'
    text: De NOvAA draagt zorg voor een opleiding voor de proeve.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel97
  - number: '98'
    text: >-
      Tegen een op grond van deze wet genomen besluit kan een belanghebbende beroep instellen bij het College van Beroep
      voor het bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel98
  - number: '99'
    text: |-
      1 Met de opsporing van bij deze wet strafbaar gestelde feiten zijn, behalve de bij of krachtens
      [artikel 141 van het Wetboek van Strafvordering][ref1] aangewezen ambtenaren, belast zij, die daartoe door Onze
      Minister van Justitie in overeenstemming met Onze Minister zijn aangewezen.

      2 Van een krachtens het eerste lid vastgestelde beschikking wordt mededeling gedaan in de *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '100'
    text: 'Deze wet kan worden aangehaald als: Wet op de Accountants-Administratieconsulenten.'
