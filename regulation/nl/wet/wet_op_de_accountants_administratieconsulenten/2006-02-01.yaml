        bwb_id: BWBR0002856
        artikel: '41'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002856
        artikel: '52'
        paragraaf: '2'
  - number: '44'
    text: |-
      1 De inschrijving wordt geweigerd:

      a. indien de aanvrager niet voldoet aan de bij [artikel 38][ref1] voor inschrijving gestelde eis;

      b. indien de aanvrager ingevolge in kracht van gewijsde gegane rechterlijke uitspraak in staat van faillissement
      verkeert of ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is;

      c. indien de aanvrager ingevolge in kracht van gewijsde gegane rechterlijke uitspraak onder curatele is gesteld;

      d. indien de aanvrager ingevolge rechterlijke uitspraak is ontzet van het recht het accountantsberoep uit te
      oefenen;

      e. indien gegronde vrees bestaat, dat de aanvrager na inschrijving inbreuk zal maken op wettelijke voorschriften,
      de Accountants-Administratieconsulenten betreffende, of dat zijn inschrijving in het register bedoeld in
      [artikel 36][ref2] uit anderen hoofde de eer van de stand van Accountants-Administratieconsulenten zal schaden.

      2 Het eerste lid, onder e, is niet van toepassing op een aanvrager, die beschikt over de in
      [artikel 38, onder c][ref3], bedoelde verklaring, indien hij zonder zich in Nederland te vestigen onderzoeken als
      bedoeld in [artikel 393, eerste lid, van boek 2 van het Burgerlijk Wetboek][ref4] bij wijze van dienstverlening
      wil verrichten, mits hij bevoegd is tot het wettelijk voorgeschreven onderzoek van jaarrekeningen in een Lid-Staat
      van de Europese Gemeenschappen, anders dan Nederland, of in een andere Staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte (*Trb.* 1992, 132).


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0002856#Artikel38
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '38'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002856
        artikel: '36'
