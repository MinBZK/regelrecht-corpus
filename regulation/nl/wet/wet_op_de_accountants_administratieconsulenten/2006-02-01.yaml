        artikel: '89'
        paragraaf: '2'
  - number: '89'
    text: |-
      Het curatorium, bedoeld in [artikel 75 van de Wet op de Registeraccountants][ref1], oefent toezicht uit op de
      werkzaamheden van het examenbureau.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel75
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '75'
  - number: '90'
    text: >-
      Binnen acht weken na afloop van elk boekjaar van de NovAA brengt het examenbureau aan Onze Minister verslag uit
      omtrent zijn werkzaamheden gedurende dat jaar. Het examenbureau zendt tevens een exemplaar van het verslag aan het
      bestuur. Het bestuur stelt de leden in de gelegenheid van het verslag kennis te nemen.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel90
  - number: '91'
    text: |-
      1 Op verzoek van een onderwijsinstelling geeft het examenbureau ter zake van een door die instelling af te nemen
      examen of een deel van een examen een verklaring van gelijkwaardigheid af, indien dat examen naar zijn oordeel
      gelijkwaardig is aan het theoretisch gedeelte van het in [artikel 80][ref1] bedoelde examen.

      2 Het examenbureau trekt een verklaring als bedoeld in het eerste lid, al dan niet voorwaardelijk, in, indien
      naar zijn oordeel het desbetreffende examen of het desbetreffende deel van een examen niet langer voldoet aan het
      vereiste van gelijkwaardigheid bedoeld in dat lid.

      3 Van beschikkingen, gegeven krachtens dit artikel, wordt door het examenbureau mededeling gedaan in de
      *Staatscourant*.

      4 Een belanghebbende kan tegen een krachtens dit artikel gegeven beschikking beroep instellen bij Onze Minister.

      5 Alvorens te beslissen op het beroepschrift hoort Onze Minister het curatorium.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel80
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '80'
        paragraaf: '1'
  - number: '92'
    text: |-
      1 Een onderwijsinstelling die in het bezit is van een verklaring als bedoeld in [artikel 91, eerste lid][ref1],
      zendt uiterlijk zes maanden voor de aanvang van het komende cursusjaar het examenprogramma voor het door haar in
      dat cursusjaar af te nemen examen of deel van een examen, ten aanzien waarvan de verklaring is afgegeven, aan het
      examenbureau.

      2 Het examenbureau toetst of het examenprogramma voldoet aan de vereisten die daaraan gesteld moeten worden uit
      hoofde van de op grond van [artikel 91, eerste lid][ref2], afgegeven verklaring van gelijkwaardigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel91
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '91'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002856
        artikel: '91'
        paragraaf: '3'
  - number: '93'
    text: |-
      Het examenbureau geeft een verklaring van vakbekwaamheid af aan degene die:

      a. 1. beschikt over een bewijsstuk waaruit blijkt dat hij voldoet aan de eisen van vakbekwaamheid, die in een
      Lid-Staat van de Europese Gemeenschappen, anders dan Nederland, of in een andere Staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte, krachtens wettelijke regelingen worden gesteld voor de
      toelating tot de controle van jaarrekeningen als bedoeld in artikel 1 van de achtste richtlijn van de Raad van de
      Europese Gemeenschappen van 10 april 1984 op de grondslag van artikel 54, lid 3, sub *g*, van het Verdrag inzake de
      toelating van personen, belast met de wettelijke controle van boekhoudbescheiden (*PbEG* L 126), of

      2. in andere gevallen dan bedoeld in het eerste onderdeel, beschikt over een in een ander land dan Nederland
      verkregen diploma of soortgelijk bewijsstuk, waaruit naar het oordeel van het examenbureau eenzelfde niveau van
      vakbekwaamheid blijkt als die, welke blijkt uit het met goed gevolg afgelegd hebben van het in [artikel 80][ref1]
      bedoelde examen, en

      b. met goed gevolg de in [artikel 94, eerste lid][ref2], bedoelde proeve van bekwaamheid heeft afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel94
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '80'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002856
        artikel: '94'
        paragraaf: '4'
  - number: '94'
    text: |-
      1 Er wordt ten minste tweemaal per jaar voor degenen, die voldoen aan de in [artikel 93, onder ][ref1], gestelde
      eis, een proeve van bekwaamheid afgenomen, waarbij de kennis van de betrokkene van het Nederlands recht wordt
      getoetst, voor zover deze kennis noodzakelijk is voor een goede uitoefening van de controle van jaarrekeningen en
      andere financiële verantwoordingen, alsmede diens kennis van de voor Accountants-Administratieconsulenten geldende
      gedrags- en beroepsregels.

      2 Het examenbureau regelt, met inachtneming van het in het eerste lid bepaalde, de omvang en de inrichting van
      de proeve, alsmede de eisen voor het verkrijgen van vrijstelling van bepaalde onderdelen daarvan. Deze regeling
      behoeft de goedkeuring van Onze Minister. Het examenbureau maakt de regeling na goedkeuring in de *Staatscourant*
      bekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel93
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '93'
        paragraaf: '4'
  - number: '95'
    text: |-
      1 Degene, die aan de in [artikel 94, eerste lid][ref1], bedoelde proeve wil deelnemen, dient daartoe een verzoek in
      bij het examenbureau, onder overlegging van een bewijsstuk als bedoeld in[ artikel 93, onder ][ref2].

      2 Op een verzoek om toelating tot de proeve wordt door het examenbureau binnen vier maanden na ontvangst van dat
      verzoek beslist.

      3 Een belanghebbende kan tegen een beschikking als bedoeld in het tweede lid beroep instellen bij Onze Minister.

      4 Alvorens te beslissen, hoort Onze Minister het curatorium.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel94
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel93
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel95
    references:
      - id: ref1
