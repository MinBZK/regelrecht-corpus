preamble:
  text: >-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het wenselijk is bij de wet nadere regelen te stellen betreffende het
    accountantswezen, in het bijzonder met betrekking tot de dienstverlening op het gebied van de accountancy en de
    daarmee verband houdende werkzaamheden ten behoeve van ondernemingen, behorende tot het midden- of kleinbedrijf;


    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

      a. Onze Minister: Onze Minister van Economische Zaken;

      b. Onze Ministers: Onze Ministers van Economische Zaken en van Justitie;

      c. NOvAA: de Nederlandse Orde van Accountants-Administratieconsulenten, bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel2
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '2'
        paragraaf: '1'
  - number: '2'
    text: |-
      1 Er is een Nederlandse Orde van Accountants-Administratieconsulenten die tot leden heeft degenen, die zijn
      ingeschreven in het register bedoeld in [artikel 36][ref1].

      2 De NOvAA is gevestigd te 's-Gravenhage. Zij is een openbaar lichaam in de zin van
      [artikel 134 van de Grondwet][ref2].

      3 De NOvAA heeft tot taak de bevordering van een goede beroepsuitoefening door Accountants-Administratieconsulenten
      en de behartiging van hun gemeenschappelijk belang. Haar taak omvat mede de zorg voor de eer van de stand van die
      accountants en het verzorgen of doen verzorgen van een opleiding tot het theoretische gedeelte van het examen,
      bedoeld in [artikel 80][ref3].

      4 In afwijking van het eerste lid zijn degenen, die op grond van [artikel 38, onder ][ref4], juncto
      [artikel 44, tweede lid][ref5], in het register zijn ingeschreven, slechts lid van de NOvAA indien zij de wens
      daartoe schriftelijk aan het bestuur van de NOvAA kenbaar hebben gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0001840#Artikel134
      [ref3]: https://wetten.overheid.nl/BWBR0002856#Artikel80
      [ref4]: https://wetten.overheid.nl/BWBR0002856#Artikel38
      [ref5]: https://wetten.overheid.nl/BWBR0002856#Artikel44
