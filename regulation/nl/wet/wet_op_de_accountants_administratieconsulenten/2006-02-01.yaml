      - id: ref4
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '45'
    text: |-
      1 Hij, die in het accountantsregister wenst te worden ingeschreven, dient daartoe een aanvraag in bij het bestuur,
      onder betaling van een door de ledenvergadering bij verordening te bepalen bedrag.

      2 Verordeningen vastgesteld krachtens het eerste lid, behoeven de goedkeuring van Onze Minister.

      3 Onze Minister kan bepalen, welke gegevens bij de aanvraag dienen te worden verstrekt.

      4 Op de voorbereiding van de beschikking op de aanvraag tot inschrijving is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '47'
    text: >-
      Het bestuur schrijft de aanvrager, te wiens aanzien tot inschrijving is beslist, binnen drie dagen in het
      accountantsregister in.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel47
  - number: '48'
    text: |-
      1 Het bestuur haalt een inschrijving in het accountantsregister door:

      a. in geval van overlijden van de ingeschrevene;

      b. op verzoek van de ingeschrevene;

      c. indien de ingeschrevene in een der in artikel 44, eerste lid, onder *b* tot en met *d*, genoemde omstandigheden
      is komen te verkeren;

      d. ter tenuitvoerlegging, krachtens [artikel 53, tweede lid][ref1], van een daartoe strekkende tuchtrechtelijke
      maatregel.

      2 Doorhaling van de inschrijving brengt mede verlies van de betrekkingen, waarbij de hoedanigheid van lid van de
      NOvAA ingevolge het bij of krachtens deze wet bepaalde vereiste voor benoembaarheid of verkiesbaarheid is.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel53
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '53'
        paragraaf: '2'
  - number: '49'
    text: |-
      1 Hij, die in het accountantsregister ingeschreven is geweest met een aantekening als bedoeld
      in[ artikel 36, derde lid][ref1], wordt geacht te voldoen aan de bij [artikel 38][ref2] voor inschrijving gestelde
      eis.

      2 Bij het indienen van een aanvraag om opnieuw in het accountantsregister te worden ingeschreven moet, indien
      de vorige inschrijving is doorgehaald op een der gronden, bedoeld in [artikel 48, eerste lid, onder ][ref3], het
      bewijs worden overgelegd, dat deze grond heeft opgehouden te bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0002856#Artikel48
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '36'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002856
        artikel: '38'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002856
        artikel: '48'
        paragraaf: '2'
  - number: '50'
    text: >-
      Van elke inschrijving in het accountantsregister en elke doorhaling van een inschrijving wordt door het bestuur op
      bij algemene maatregel van bestuur te bepalen wijze mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel50
  - number: '51'
    text: |-
      1 De tuchtrechtspraak heeft ten doel het weren en beteugelen van misslagen van Accountants-
      Administratieconsulenten, in de uitoefening van hun beroep begaan en van inbreuken op verordeningen van de NOvAA en
      op de eer van de stand van vorenbedoelde Accountants-Administratieconsulenten.

      2 De tuchtrechtspraak wordt in eerste aanleg door een of meer raden van tucht voor registeraccountants en
      Accountants-Administratieconsulenten en in beroep, tevens in hoogste ressort, door het College van Beroep voor het
      bedrijfsleven uitgeoefend.

      3 In geval van doorhaling van een inschrijving in het accountantsregister blijft de betrokkene ter zake van
      handelingen en gedragingen, die gedurende de tijd, dat hij ingeschreven stond, hebben plaats gehad, aan de
      tuchtrechtspraak onderworpen.

      4 Indien de betrokkene wederom wordt ingeschreven, is hij bovendien aan deze rechtspraak onderworpen ter zake van
      handelingen en gedragingen, die gedurende de tijd, dat zijn inschrijving doorgehaald was, hebben plaats gehad en
      tot weigering van de inschrijving op grond van [artikel 44, eerste lid, onder ][ref1], aanleiding zouden hebben
      gegeven, zo zij reeds bij de behandeling van de aanvraag bekend waren geweest.

      5 Bij algemene maatregel van bestuur wordt het aantal raden van tucht bepaald, alsmede het rechtsgebied en de zetel
      van elk van deze raden.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel44
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '44'
        paragraaf: '2'
  - number: '52'
    text: |-
      1 Het berechtende college zal, indien het oordeelt, dat het tegen de betrokken Accountant-Administratieconsulent
      gerezen bezwaar gegrond is, een der volgende maatregelen kunnen opleggen:

      a. schriftelijke waarschuwing;

      b. schriftelijke berisping;

      c. schorsing als Accountant-Administratieconsulent, voor ten hoogste zes maanden;

      d. doorhaling van de inschrijving in het in [artikel 36][ref1] bedoelde accountantsregister.

      2 De maatregel van schorsing als Accountant-Administratieconsulent brengt mede verlies, voor de tijd
      gedurende welke de maatregel van kracht is, van het recht de benaming accountant of de titel Accountant-
      Administratieconsulent te voeren. Voorts brengt deze maatregel mede verlies van de betrekkingen, waarbij de
      hoedanigheid van lid van de NOvAA ingevolge het bij of krachtens deze wet bepaalde vereiste voor benoembaarheid of
      verkiesbaarheid is.

      3 De beslissing van het college wordt in het openbaar uitgesproken. Het college kan echter bij zijn beslissing
      houdende oplegging van een maatregel bepalen, dat deze, al dan niet of gedeeltelijk openbaar zal worden gemaakt.
      Het bepaalt daarbij tevens de wijze, waarop de openbaarmaking zal geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel36
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '36'
        paragraaf: '1'
  - number: '53'
    text: |-
      1 De maatregel van schorsing als Accountant-Administratieconsulent gaat in bij het onherroepelijk worden van de
      beslissing of op zodanig tijdstip nadien als in de beslissing is bepaald.

      2 Het bestuur van de NOvAA draagt zorg voor de tenuitvoerlegging van de maatregelen van schriftelijke waarschuwing,
      van schriftelijke berisping en van doorhaling van de inschrijving in het register bedoeld in [artikel 36][ref1]
      en voor de in [artikel 52, derde lid][ref2], bedoelde openbaarmaking. De ten uitvoerlegging en de openbaarmaking
      geschieden niet voordat de beslissing onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel52
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '36'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002856
        artikel: '52'
        paragraaf: '2'
  - number: '54'
    text: |-
      1 De raden van tucht bestaan ieder uit de volgende leden:

      a. een voorzitter en een of meer plaatsvervangende voorzitters die voldoen aan de vereisten voor benoembaarheid
      tot rechter in een rechtbank en die met enige bij de wet ingestelde rechtspraak belast zijn of belast zijn geweest,
      doch het beroep van registeraccountant of het beroep van Accountant-Administratieconsulent niet uitoefenen noch
      hebben uitgeoefend;

      b. zes registeraccountants;

      c. zes Accountants-Administratieconsulenten, ten aanzien van wie bij de inschrijving in het in
      [artikel 36, eerste lid][ref1], bedoelde register een aantekening als bedoeld in [artikel 36, derde lid][ref2],
      is geplaatst;

      d. zes personen die geen deel uitmaken van de categorieën bedoeld onder *a* tot en met *c* en die deskundig zijn
      ter zake van werkzaamheden verwant aan die van accountants.

      2 De leden worden benoemd door Onze Minister.

      3 Onze Minister van Economische Zaken stelt een beschikking tot benoeming van een lid als in het eerste lid, onder
      *a*, bedoeld niet vast dan in overeenstemming met Onze Minister van Justitie.

      4 Onze Minister benoemt voor iedere raad van tucht een secretaris.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel36
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '36'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002856
        artikel: '36'
        paragraaf: '1'
  - number: '55'
    text: >-
      1 De leden van een raad van tucht worden voor vier jaren benoemd. Zij treden tegelijk af en zijn terstond
      herbenoembaar.


      2 Hij, die benoemd is ter vervulling van een tussentijds opengevallen plaats, treedt af op het tijdstip, waarop
      degene, in wiens plaats hij is benoemd, had moeten aftreden.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel55
  - number: '56'
    text: |-
      1 Tussen de leden en de secretaris van een raad van tucht mag niet bestaan de verhouding van echtgenoten of
      geregistreerde partners, bloed- of aanverwantschap tot de derde graad ingesloten, of de verhouding van werkgever
      tot werknemer. Zij mogen niet met elkaar in de uitoefening van een beroep voor gemene rekening of onder
      gemeenschappelijke naam optreden.

      2 De leden van de raden van tucht kunnen niet tevens deel uitmaken van het bestuur van de in
      [artikel 1 van de Wet op de Registeraccountants][ref1] bedoelde Orde of van het bestuur van de NOvAA.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel1
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '1'
  - number: '57'
    text: >-
      De leden van de raden van tucht ontvangen vergoeding van reis- en verblijfkosten en vergoeding voor tijdverzuim
      volgens door Onze Minister te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel57
  - number: '58'
    text: >-
      Het is aan de leden en de secretarissen van de raden van tucht verboden:


      a. hetgeen zij als zodanig te weten zijn gekomen bekend te maken;


      b. de gevoelens te openbaren, welke in raadkamer over aanhangige gedingen zijn geuit;


      c. over een voor hen aanhangig geding of een geding, dat naar zij weten of vermoeden voor hen aanhangig zal worden,
      zich in te laten in enig onderhoud of gesprek met belanghebbenden of van dezen enige bijzondere inlichting of
      schriftelijk stuk aan te nemen.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel58
  - number: '59'
    text: >-
      Het in de [artikelen 46c, eerste lid, onder a, en tweede lid](onbekend), [46d](onbekend), [46f](onbekend), [46g,
      eerste en tweede lid](onbekend), [46i, eerste lid, met uitzondering van onderdeel c, en derde lid](onbekend),
      [46j](onbekend), [46l, eerste lid, met uitzondering van onderdeel c, en derde lid](onbekend),[ 46m](onbekend),
      [46o](onbekend), en[46p, eerste tot en met vijfde lid, van de Wet op de rechtspositie rechterlijke ambtenaren ]
      (onbekend) bepaalde is van overeenkomstige toepassing ten aanzien van de leden van een raad van tucht, met dien
      verstande dat de disciplinaire maatregel van waarschuwing ten aanzien van de leden van een raad van tucht door de
      voorzitter van de betreffende raad van tucht wordt opgelegd.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel59
  - number: '60'
    text: >-
      Onze Minister regelt de samenstelling en de werkwijze van het secretariaat van ieder van de raden van tucht. Onze
      Minister kan nadere regelen vaststellen met betrekking tot indienstneming c.q. aanstelling, arbeidsvoorwaarden en
      geheimhoudingsplicht van het personeel.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel60
  - number: '61'
    text: >-
      Aan de behandeling en de beslissing van tuchtzaken in de zin van deze wet wordt op straffe van nietigheid
      van de beslissing deelgenomen door drie of vijf leden van de raad van tucht, onder wie de voorzitter of een
      plaatsvervangend voorzitter.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel61
  - number: '62'
    text: |-
      1 De raad van tucht neemt een tegen een Accountant-Administratieconsulent gerezen bezwaar in behandeling hetzij op
      een bij die raad ingediende klacht, hetzij op het verzoek van het bestuur, hetzij ambtshalve.

      2 De raad geeft van het in behandeling nemen van een bezwaar onverwijld kennis aan de betrokken Accountant-
      Administratieconsulent onder vermelding van de inhoud van het bezwaar.

      3 In het geval, bedoeld in [artikel 51, vierde lid][ref1], neemt de raad het bezwaar niet in behandeling dan op
      verzoek van het bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel51
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '51'
        paragraaf: '1'
  - number: '63'
    text: >-
      1 Een lid van een raad van tucht kan zich verschonen en kan worden gewraakt, indien er te zijnen aanzien feiten of
      omstandigheden bestaan, waardoor in het algemeen de rechterlijke onpartijdigheid schade zou kunnen lijden.


      2 Over de verschoning of wraking wordt door de overige leden van de raad van tucht zo spoedig mogelijk beslist. In
      geval van staking van stemmen is het verzoek tot wraking of verschoning toegestaan.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel63
  - number: '64'
    text: >-
      1 De raad van tucht beslist niet dan na verhoor, althans oproeping bij aangetekende brief, van de betrokken
      accountant, benevens, indien de behandeling op klacht, dan wel op verzoek van het bestuur geschiedt, van de klager,
      onderscheidenlijk van het bestuur.


      2 De betrokkene kan - tenzij de raad van tucht beveelt, dat hij in persoon zal verschijnen - zich ter
      terechtzitting doen vertegenwoordigen door een daartoe gemachtigde. Hij kan zich door een raadsman doen bijstaan.


      3 De raad van tucht kan weigeren bepaalde personen, die niet advocaat zijn, als gemachtigde of als raadsman toe te
      laten. Bij zodanige weigering houdt de raad de zaak tot een volgende zitting aan.


      4 De betrokkene en zijn raadsman worden in de gelegenheid gesteld tijdig van de processtukken kennis te nemen.


      5 De raad van tucht behandelt de klacht in een openbare zitting. De raad kan om gewichtige redenen beslissen dat de
      behandeling geheel of gedeeltelijk met gesloten deuren zal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel64
  - number: '65'
    text: |-
      1 De raad van tucht kan getuigen en deskundigen oproepen en horen.

      2 Op verzoek van de raad van tucht doet de officier van justitie bij de rechtbank, binnen welker rechtsgebied
      de raad van tucht zitting houdt, de betrokken getuige of deskundige dagvaarden. De betrokkene is verplicht na
      dagvaarding te verschijnen.

      3 Verschijnt een getuige of een deskundige op de dagvaarding niet, dan doet de officier van justitie op verzoek van
      de raad hem andermaal dagvaarden, desverzocht met bevel tot medebrenging.

      4 [Artikel 556 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.

      5 De getuigen worden beëdigd de gehele waarheid en niets dan de waarheid te zeggen, de deskundigen verslag naar hun
      geweten te geven.

      6 Ten aanzien van getuigen en deskundigen zijn de
      [artikelen 217 tot en met 219 van het Wetboek van Strafvordering][ref2] van overeenkomstige toepassing.

      7 De getuigen en deskundigen ontvangen desverkiezende op vertoon van hun oproeping of dagvaarding
      schadeloosstelling, door de voorzitter van de raad van tucht te begroten overeenkomstig het bij of krachtens het
      Tarief van justitiekosten en salarissen in burgerlijke zaken bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel556
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel217
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '556'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '217'
  - number: '66'
    text: >-
      1 De beslissing van de raad van tucht aangaande een tegen een Accountant-Administratieconsulent gerezen bezwaar is
      op straffe van nietigheid met redenen omkleed en wordt in het openbaar uitgesproken.


      2 De raad van tucht zendt van zijn beslissing onverwijld bij aangetekende brief afschrift aan de betrokken
      Accountant-Administratieconsulent, en, indien naar aanleiding van een klacht is beslist, aan de klager, alsmede aan
      het bestuur.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel66
  - number: '67'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de in de
      [artikelen 62 tot en met 66][ref1] geregelde rechtsgang.

      2 Een voordracht tot vaststelling, wijziging of intrekking van een algemene maatregel van bestuur, als in het
      eerste lid bedoeld, wordt gedaan door Onze Ministers gezamenlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel62
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '62'
        paragraaf: '4'
  - number: '68'
    text: |-
      1 Tegen een beslissing van de raad van tucht aangaande een tegen een Accountant-Administratieconsulent gerezen
      bezwaar kan binnen twee maanden na de dag van verzending van de in [artikel 66, tweede lid][ref1], bedoelde
      aangetekende brief beroep worden ingesteld bij het College van Beroep voor het bedrijfsleven:

      a. door de betrokken accountant, indien het bezwaar geheel of gedeeltelijk gegrond is verklaard;

      b. door de klager, indien zijn bezwaar geheel of gedeeltelijk ongegrond is verklaard;

      c. door het bestuur.

      2 Het beroep wordt ingesteld bij met redenen omkleed beroepschrift, bij de griffier van het College in tweevoud
      of, indien het beroep door een klager is ingesteld, in drievoud in te dienen tezamen met een authentiek afschrift
      van de beslissing, waartegen het beroep is gericht. De griffier geeft van de instelling van het beroep onverwijld
      kennis aan de raad van tucht, alsmede, indien het beroep door een klager of door het bestuur is ingesteld, aan de
      betrokken accountant. Indien het beroep door de accountant is ingesteld in een procedure die bij de raad van tucht
      bij klacht of op verzoek van het bestuur is aanhangig gemaakt, geeft de griffier voorts van de instelling van het
      beroep onverwijld kennis aan de klager, respectievelijk aan het bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel66
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '66'
        paragraaf: '4'
  - number: '69'
    text: |-
      De raad van tucht doet binnen een en twintig dagen na ontvangst van de mededeling, bedoeld in
      [artikel 68, tweede lid][ref1], de stukken toekomen aan de griffier van het College van Beroep voor het
      bedrijfsleven.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel68
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '68'
        paragraaf: '5'
  - number: '70'
    text: >-
      1 Is het beroep kennelijk niet-ontvankelijk of ongegrond, dan kan, zonder dat een nader onderzoek door het College
      van Beroep voor het bedrijfsleven vereist is, de voorzitter bij met redenen omklede beschikking het beroep niet-
      ontvankelijk of ongegrond verklaren. De griffier zendt afschrift van de beschikking aan de raad van tucht, alsmede
      bij aangetekende brief aan de betrokken accountant en, indien de procedure bij de raad van tucht bij klacht is
      aanhangig gemaakt, aan de klager.


      2 Tegen de beschikking, in het eerste lid bedoeld, kan degene, die het beroep heeft ingesteld, binnen veertien
      dagen na de verzending van de onderhavige brief, verzet doen bij het College. Het verzet wordt gedaan door een
      schriftelijke verklaring aan de griffier van het College.


      3 Het College verklaart het verzet niet-ontvankelijk, gegrond of ongegrond. Indien het verzet gegrond wordt
      verklaard, vervalt de beschikking.


      4 Is het College van oordeel, dat het beroep kennelijk niet-ontvankelijk of ongegrond is, dan kan het zonder nader
      onderzoek het verzet niet-ontvankelijk of ongegrond verklaren, echter niet dan na de betrokkene in de gelegenheid
      te hebben gesteld te worden gehoord.


      5 De beschikking van het College ter zake van het gedane verzet is met redenen omkleed.


      6 De griffier brengt de beschikking van het College ter kennis van de betrokken accountant en de klager, alsmede
      van de raad van tucht.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel70
  - number: '71'
    text: |-
      1 Indien [artikel 70][ref1] geen toepassing vindt of het verzet gegrond is verklaard, bepaalt de voorzitter de dag
      voor de behandeling der zaak. De griffier brengt bij aangetekend schrijven de rechtsdag ter kennis van de betrokken
      accountant en de klager, respectievelijk het bestuur.

      2 Voor de behandeling ter terechtzitting worden de processtukken in origineel of in door de griffier gewaarmerkte
      afschriften gedurende ten minste tien dagen ter griffie van het College van Beroep voor het bedrijfsleven,
      ter griffie van een rechtbank of elders ter kosteloze inzage voor de betrokken accountant en de klager of hun
      gemachtigden nedergelegd. Het tijdstip, waarop de gelegenheid tot inzage een aanvang zal nemen, wordt door de
      griffier tijdig tevoren ter kennis van bedoelde personen gebracht.

      3 De in het tweede lid bedoelde termijn kan met toestemming van de accountant en de klager, respectievelijk het
      bestuur, worden verkort.

      4 Is de termijn niet in acht genomen, dan bepaalt het College van Beroep voor het bedrijfsleven een nieuwe
      rechtsdag, tenzij de betrokken accountant en de klager, respectievelijk het bestuur, in persoon of bij gemachtigde
      zijn verschenen. In dit laatste geval kan op verzoek van elk hunner uitstel worden verleend.

      5 In de gevallen, waarin op de terechtzitting de behandeling van de zaak voor een bepaalde tijd wordt uitgesteld of
      geschorst, wordt geen nieuwe kennisgeving gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel70
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '70'
        paragraaf: '5'
  - number: '72'
    text: |-
      Op het rechtsgeding voor het College van Beroep voor het bedrijfsleven zijn de [artikelen 63][ref1],
      [64, derde, vierde en vijfde lid][ref2], en [65][ref3] van overeenkomstig toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel64
      [ref3]: https://wetten.overheid.nl/BWBR0002856#Artikel65
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '63'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002856
        artikel: '64'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0002856
        artikel: '65'
        paragraaf: '4'
  - number: '73'
    text: >-
      Aan de betrokken accountant en de klager respectievelijk het bestuur of hun gemachtigden en aan de raadslieden
      wordt de gelegenheid gegeven het woord te voeren en de middelen van beroep toe te lichten.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel73
  - number: '74'
    text: >-
      Het College van Beroep voor het bedrijfsleven kan de raad van tucht, die de beslissing in aanleg heeft genomen,
      uitnodigen inlichtingen te geven.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel74
  - number: '75'
    text: >-
      Na de behandeling van de zaak ter terechtzitting bepaalt de voorzitter de dag voor de uitspraak. Het College van
      Beroep voor het bedrijfsleven kan ook terstond uitspraak doen.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel75
  - number: '76'
    text: >-
      1 Het College van Beroep voor het bedrijfsleven verklaart het beroep niet-ontvankelijk, verwerpt het of verklaart
      het gegrond.


      2 Indien het College niet voldoende is ingelicht, kan het bevelen, dat de behandeling der zaak op een nader te
      bepalen datum zal worden hervat.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel76
  - number: '77'
    text: >-
      Indien het College van Beroep voor het bedrijfsleven het beroep gegrond verklaart, vernietigt het de beslissing van
      de raad van tucht; het doet alsdan de zaak zelf af of verwijst haar naar een der raden van tucht om haar af te doen
      met inachtneming van de beslissing van het College.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel77
  - number: '78'
    text: >-
      1 De uitspraak van het College van Beroep voor het bedrijfsleven houdt de gronden in en wijst de voorschriften aan,
      waarop zij rust.


      2 De uitspraak wordt door de voorzitter van de kamer, die de uitspraak heeft gedaan, en de griffier ondertekend.
      Indien de voorzitter zich in de onmogelijkheid bevindt de uitspraak te ondertekenen, geschiedt zulks door het
      oudst benoemde gewone of plaatsvervangende lid, dat de uitspraak mede gewezen heeft. Indien de griffier zich in de
      onmogelijkheid bevindt, wordt daarvan instede van de ondertekening melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel78
  - number: '79'
    text: |-
      1 Het College van Beroep voor het bedrijfsleven zendt van zijn beslissing onverwijld afschrift:

      a. aan de betrokken accountant;

      b. aan de klager, indien de beslissing betreft een bezwaar, dat op klacht in behandeling is genomen;

      c. aan het bestuur;

      d. aan de raad van tucht, die de zaak in eerste instantie heeft behandeld;

      e. aan de raad van tucht, naar welke de zaak krachtens [artikel 77][ref1] is verwezen.

      2 Het College kan in afwijking van het eerste lid, onder *b*, bij zijn beslissing bepalen, dat de klager kennis
      wordt gegeven uitsluitend van dat deel der beslissing, dat voor hem van belang is.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel77
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '77'
        paragraaf: '5'
  - number: '80'
    text: Er is een accountantsexamen, dat bestaat uit een theoretisch gedeelte en een praktijkgedeelte.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel80
  - number: '81'
    text: >-
      1 Bij het theoretische gedeelte van het examen wordt getoetst of de noodzakelijke theoretische kennis van
      de vakgebieden die voor de bij of krachtens de wet vereiste controles van jaarrekeningen en geconsolideerde
      jaarrekeningen van belang zijn, aanwezig is.


      2 De omvang en de inhoud van het theoretisch gedeelte van het examen worden nader geregeld bij algemene maatregel
      van bestuur. Daarbij worden tevens geregeld de eisen voor de toelating tot dit examengedeelte, alsmede die voor het
      verkrijgen van vrijstelling voor bepaalde onderdelen daarvan.


      3 Het theoretische gedeelte van het examen kan in onderdelen worden afgelegd, waarbij elk onderdeel ten minste
      tweemaal per jaar wordt geëxamineerd.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel81
  - number: '82'
    text: |-
      1 Bij het praktijkgedeelte van het examen wordt getoetst of de in [artikel 81, eerste lid][ref1], bedoelde kennis
      in de praktijk kan worden gebracht.

      2 De omvang en inhoud van het praktijkgedeelte van het examen worden nader geregeld bij algemene maatregel van
      bestuur. Daarbij worden tevens geregeld de eisen voor toelating tot dit examengedeelte, alsmede die voor het
      verkrijgen van vrijstelling van bepaalde onderdelen daarvan.

      3 Het praktijkgedeelte van het examen kan in onderdelen worden afgelegd, waarbij elk onderdeel ten minste tweemaal
      per jaar wordt geëxamineerd.

      4 Ten behoeve van het praktijkgedeelte van het examen dient gedurende ten minste drie jaar een praktijkopleiding
      die in het bijzonder betrekking heeft op de controle van jaarrekeningen, geconsolideerde jaarrekeningen of
      soortgelijke financiële opstellingen te worden gevolgd bij personen die voldoende waarborgen bieden voor de
      opleiding van de stagiair.

      5 De in het vierde lid bedoelde praktijkopleiding dient gedurende ten minste twee jaar te worden gevolgd bij een
      Accountant-Administratieconsulent.

      6 De ledenvergadering kan bij verordening nadere regels stellen voor de praktijkopleiding. De verordening wordt
      terstond na vaststelling ter kennis gebracht van het examenbureau.

      7 De NOvAA verleent medewerking aan de praktijkopleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel81
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '81'
        paragraaf: '1'
  - number: '83'
    text: >-
      1 Zij, die aan het theoretisch gedeelte of het praktijkgedeelte van het examen, dan wel aan onderdelen van deze
      gedeelten, wensen deel te nemen, worden daartoe niet toegelaten dan na betaling van een door de ledenvergadering
      bij verordening vast te stellen examengeld, dat dient ter vergoeding van de aan het examen verbonden kosten.


      2 Verordeningen, vastgesteld krachtens het eerste lid, behoeven de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel83
  - number: '84'
    text: >-
      1 Zij, die het theoretisch gedeelte of het praktijkgedeelte van het examen met goed gevolg hebben afgelegd,
      ontvangen daarvan een getuigschrift.


      2 Zij, die zowel het theoretische als het praktische gedeelte van het examen met goed gevolg hebben afgelegd,
      ontvangen een diploma.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel84
  - number: '85'
    text: |-
      1 Er is een examenbureau. Onze Minister bepaalt het aantal leden en benoemt dezen. Hij wijst uit de leden van het
      bureau de voorzitter aan.

      2 Onze Minister stelt een beschikking krachtens het eerste lid niet vast dan na het bestuur van de NOvAA en het in
      [artikel 89][ref1] bedoelde curatorium te hebben gehoord.

      3 De leden van het examenbureau treden om de vier jaren tegelijk af en kunnen terstond opnieuw worden benoemd. Hij,
      die benoemd is ter vervulling van een tussentijds opengevallen plaats, treedt af op het tijdstip, waarop degene, in
      wiens plaats hij is benoemd, had moeten aftreden.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel89
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '89'
        paragraaf: '2'
  - number: '86'
    text: >-
      1 De leden van het examenbureau ontvangen een vergoeding van reis- en verblijfkosten en kunnen vergoeding voor
      tijdverzuim ontvangen, een en ander volgens regelen, door de ledenvergadering bij verordening te stellen.


      2 Verordeningen, vastgesteld krachtens het eerste lid, behoeven de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel86
  - number: '87'
    text: |-
      1 Het examenbureau regelt de inrichting van het examen.

      2 De regeling behoeft de goedkeuring van het in [artikel 89][ref1] bedoelde curatorium.

      3 De mondelinge gedeelten van het examen worden in het openbaar afgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel89
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '89'
        paragraaf: '2'
  - number: '88'
    text: |-
      Het examenbureau is belast met de uitvoering van de krachtens [artikel 87][ref1] vastgestelde regeling. Het
      benoemt, na overleg met het in [artikel 89][ref2] bedoelde curatorium, de examinatoren en heeft de leiding van
      het examen.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel89
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0002856
