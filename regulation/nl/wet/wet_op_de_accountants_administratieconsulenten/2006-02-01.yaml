  - number: '3'
    text: >-
      Het bestuur van de NOvAA verstrekt Onze Ministers desgevraagd alle inlichtingen over alle zaken, de NOvAA
      betreffende.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel3
  - number: '4'
    text: De NOvAA heeft een ledenvergadering, een bestuur en een voorzitter.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel4
  - number: '5'
    text: |-
      1 Het aantal leden van het bestuur wordt door de algemene ledenvergadering bepaald, doch bedraagt tenminste zeven.
      De bestuursleden worden door de ledenvergadering uit de leden van de NOvAA voor vier jaren benoemd.

      2 Jaarlijks treedt een deel der bestuursleden volgens een door de ledenvergadering vast te stellen rooster af.
      Het rooster wordt zodanig ingericht, dat voorzover mogelijk telkenmale hetzelfde aantal bestuursleden aftreedt. De
      aftredenden zijn niet terstond herbenoembaar.

      3 Hij, die benoemd is ter vervulling van een tussentijds opengevallen plaats, treedt af op het tijdstip waarop
      degene, in wiens plaats hij is benoemd, had moeten aftreden.

      4 De jaarlijkse benoeming van bestuursleden ter vervulling van de ingevolge het tweede lid openvallende plaatsen
      geschiedt in de bijeenkomst van de ledenvergadering, waarin overeenkomstig [artikel 29][ref1] het bestuur rekening
      en verantwoording doet.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel29
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '29'
        paragraaf: '5'
  - number: '6'
    text: De leden van het bestuur ontvangen vergoeding van reis- en verblijfkosten.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel6
  - number: '8'
    text: |-
      1 De voorzitter en de plaatsvervangende voorzitter worden door de ledenvergadering uit de bestuursleden telkens
      voor een jaar benoemd. Behoudens ter vervulling van een tussentijds openvallende plaats geschiedt de benoeming
      in de bijeenkomst van de ledenvergadering, waarin overeenkomstig [artikel 29][ref1] het bestuur rekening en
      verantwoording doet.

      2 De [artikelen 5, derde lid][ref2], en [6][ref3] zijn ten aanzien van de voorzitter en de plaatsvervangende
      voorzitter van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0002856#Artikel6
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '29'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0002856
        artikel: '5'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002856
        artikel: '6'
        paragraaf: '2'
  - number: '9'
    text: >-
      1 Het personeel, dat de NOvAA en de bij of krachtens deze wet ingestelde colleges voor de vervulling van hun taak
      behoeven, wordt door of namens de NOvAA in dienst genomen op arbeidsovereenkomst naar burgerlijk recht.


      2 De ledenvergadering regelt bij verordening de voorwaarden, waaronder de indienstneming geschiedt.


      3 Verordeningen, vastgesteld krachtens het tweede lid, behoeven de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel9
  - number: '10'
    text: >-
      Het bestuur roept de ledenvergadering bijeen, zo dikwijls het zulks nodig oordeelt en voorts indien tenminste
      veertig leden van de NOvAA, onder opgaaf van de te behandelen punten, om haar bijeenroeping verzoeken.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel10
  - number: '11'
    text: >-
      De voorzitter van de NOvAA bekleedt in de bijeenkomsten van de ledenvergadering en in de bestuursvergaderingen
      het voorzitterschap.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel11
  - number: '12'
    text: Het bestuur vergadert niet, wanneer niet tenminste de helft van het aantal zitting hebbende leden is opgekomen.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel12
  - number: '13'
    text: >-
      De leden van het bestuur zijn niet gerechtelijk vervolgbaar voor hetgeen zij in de bestuursvergadering hebben
      gezegd of aan haar schriftelijk hebben overgelegd.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel13
  - number: '14'
    text: De leden van het bestuur stemmen zonder last of ruggespraak.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel14
  - number: '15'
    text: >-
      De leden van het bestuur onthouden zich in de bestuursvergaderingen van medestemmen over aangelegenheden, die hun,
      hun echtgenoten of hun geregistreerde partners, hun bloed- of aanverwanten tot de derde graad ingesloten, degenen
      met wie zij in de uitoefening van een beroep voor gemene rekening of onder gemeenschappelijke naam optreden, hun
      werknemers, hun werkgevers, hun opdrachtgevers of degenen, op wie de in de uitoefening van hun beroep verrichte
      werkzaamheden rechtstreeks betrekking hebben, persoonlijk aangaan.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel15
  - number: '16'
    text: >-
      1 De bijeenkomsten van de ledenvergadering worden in het openbaar gehouden.


      2 De deuren worden gesloten, wanneer tenminste een vijfde van de aanwezige leden daarom verzoekt of de voorzitter
      het nodig oordeelt.


      3 De ledenvergadering beslist vervolgens of met gesloten deuren zal worden vergaderd.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel16
  - number: '17'
    text: >-
      1 Indien bij het nemen van een beslissing geen der leden stemming vraagt, is het voorstel aangenomen.


      2 Stemming over personen vindt plaats bij gesloten en ongetekende stembriefjes.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel17
  - number: '18'
    text: >-
      1 Een stemming in een bijeenkomst van de ledenvergadering is nietig, indien niet meer dan de helft van het aantal
      blijkens de presentielijst opgekomen leden eraan heeft deelgenomen.


      2 Een stemming in een bestuursvergadering is nietig, indien niet tenminste de helft van het aantal zittinghebbende
      leden, die zich niet van medestemmen moeten onthouden, eraan heeft deelgenomen


      3 Bij stemming over personen worden leden, die blanco briefjes ingeleverd hebben, voor de toepassing van dit
      artikel geacht aan de stemming te hebben deelgenomen.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel18
  - number: '19'
    text: >-
      1 Ieder lid kan slechts één stem uitbrengen.


      2 Voor het tot stand komen van een beslissing bij stemming wordt de volstrekte meerderheid van de uitgebrachte
      stemmen vereist. Blanco stemmen worden voor de toepassing van dit artikel geacht niet te zijn uitgebracht.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel19
  - number: '20'
    text: >-
      1 Bij staking van stemmen in een bijeenkomst van de ledenvergadering of in een voltallige bestuursvergadering is,
      indien het zaken betreft, het voorstel verworpen en beslist, indien het personen betreft, het lot.


      2 Bij staking van stemmen in een niet voltallige bestuursvergadering wordt het nemen van een beslissing tot een
      volgende vergadering uitgesteld, waarin de beraadslagingen kunnen worden heropend. Indien de stemmen dan opnieuw
      staken, is het eerste lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel20
  - number: '21'
    text: >-
      1 De ledenvergadering kan bij verordening nadere regelen stellen betreffende haar werkwijze en die van het bestuur.


      2 Het bestuur kan nadere regelen stellen betreffende zijn werkwijze, voor zover niet de ledenvergadering daarin bij
      verordening heeft voorzien.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel21
  - number: '22'
    text: Het bestuur bestuurt de NOvAA en voert het beheer over haar vermogen.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel22
  - number: '23'
    text: De voorzitter vertegenwoordigt de NOvAA in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel23
  - number: '24'
    text: |-
      1 De ledenvergadering maakt de verordeningen, die zij ter vervulling van de in [artikel 2, derde lid][ref1],
      omschreven taak nodig oordeelt.

      2 De ledenvergadering stelt ten behoeve van een goede uitoefening van de werkzaamheden van Accountants-
      Administratieconsulenten bij verordening gedrags- en beroepsregels vast, welke gelden voor alle Accountants-
      Administratieconsulenten.

      3 Voor zover uit deze wet niet anders blijkt, zijn de verordeningen van de NOvAA slechts verbindend voor haar leden
      en organen.

      4 De ledenvergadering kan de bevoegdheid tot het geven van nadere voorschriften omtrent door haar bij verordening
      geregelde onderwerpen overdragen aan het bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel2
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '2'
        paragraaf: '1'
  - number: '25'
    text: |-
      1 De voorschriften in de in [artikel 24, tweede lid][ref1], bedoelde verordening met betrekking
      tot de uitoefening van de werkzaamheden van Accountants-Administratieconsulenten ter zake van het
      verrichten van de wettelijke controle van jaarrekeningen, geconsolideerde jaarrekeningen en soortgelijke
      financiële opstellingen, dienen dezelfde inhoud te hebben als de desbetreffende voorschriften in de in
      [artikel 19, tweede lid, van de Wet op de Registeraccountants][ref2] bedoelde verordening.

      2 Met het oog op de uitvoering van het eerste lid wordt een ontwerp voor de desbetreffende bepalingen van de
      verordening opgesteld door een commissie, bestaande uit een gelijk aantal leden van de Nederlandse Orde van
      Accountants-Administratieconsulenten en van het Nederlands Instituut voor Registeraccountants.

      3 Indien een verordening houdende de in het eerste lid bedoelde voorschriften wordt vernietigd op grond van
      [artikel 34][ref3] en de ledenvergadering niet binnen zes maanden na de datum van vernietiging een verordening
      heeft vastgesteld in overeenstemming met het bepaalde in het eerste lid, worden de in dat lid bedoelde
      voorschriften vastgesteld door Onze Minister van Economische Zaken, in overeenstemming met Onze Minister van
      Justitie. Deze voorschriften gelden totdat een door de ledenvergadering overeenkomstig het eerste lid vastgestelde
      verordening in werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002374#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0002856#Artikel34
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '24'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002374
        artikel: '19'
      - id: ref3
        bwb_id: BWBR0002856
        artikel: '34'
        paragraaf: '6'
  - number: '26'
    text: >-
      1 De ontwerpen van verordeningen worden door het bestuur op bij algemene maatregel van bestuur te bepalen wijze
      openbaar gemaakt. Een ieder kan gedurende drie weken na de openbaarmaking van een ontwerp bij het bestuur zijn
      bedenkingen schriftelijk naar voren brengen. Het bestuur brengt de naar voren gebrachte bedenkingen ter kennis van
      de leden.


      2 De verordeningen worden door het bestuur op bij algemene maatregel van bestuur te bepalen wijze bekendgemaakt.
      Indien zij de goedkeuring van Onze Minister behoeven, geschiedt de bekendmaking niet dan nadat de goedkeuring
      is verleend en wordt bij de bekendmaking aan de voet van de verordening het besluit vermeld, waarbij deze is
      goedgekeurd. De verordeningen treden, indien zij niet anders bepalen, niet eerder in werking dan de tweede dag na
      die van de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel26
  - number: '27'
    text: Het boekjaar van de NOvAA loopt van 1 januari tot en met 31 december.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel27
  - number: '28'
    text: >-
      Vóór de aanvang van het boekjaar stelt de ledenvergadering de begroting van de NOvAA vast. Het bestuur dient
      daartoe een ontwerpbegroting in, vergezeld van de nodige toelichting. Het ontwerp wordt door het bestuur, tenminste
      twee weken vóór de behandeling daarvan door de ledenvergadering, aan de leden toegezonden.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel28
  - number: '29'
    text: |-
      1 Voor elk boekjaar benoemt de ledenvergadering uit de leden een Accountant-Administratieconsulent bij wiens
      inschrijving in het in [artikel 36, eerste lid][ref1], bedoelde register een aantekening als bedoeld in
      [artikel 36, derde lid][ref2], is geplaatst, die belast is met de controle op de financiële verantwoording,
      benevens een plaatsvervanger voor deze.

      2 De Accountant-Administratieconsulent brengt binnen dertien weken na afloop van het betrokken boekjaar een verslag
      uit aan het bestuur.

      3 Binnen zes maanden na afloop van het boekjaar doet het bestuur aan de ledenvergadering rekening en verantwoording
      over zijn in het boekjaar gevoerde bestuur, onder overlegging van een balans en staat van baten en lasten met
      toelichting en met een verklaring van een Accountant-Administratieconsulent daarover. De balans, de staat van
      baten en lasten, de toelichting en de verklaring van de Accountant-Administratieconsulent worden door het bestuur,
      tenminste twee weken vóór behandeling daarvan door de ledenvergadering, aan de leden toegezonden.

      4 De ledenvergadering stelt de rekening vast. De vaststelling strekt tot décharge van het bestuur, behoudens in
      geval van later gebleken valsheid in bewijsstukken of andere onregelmatigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel36
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '36'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002856
        artikel: '36'
        paragraaf: '1'
  - number: '30'
    text: >-
      De NOvAA kan van haar leden jaarlijks bijdragen heffen, waarvan het bedrag voor elk boekjaar afzonderlijk door
      de ledenvergadering bij verordening wordt vastgesteld. Het bedrag kan voor verschillende categorieën van leden
      verschillend zijn.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel30
  - number: '31'
    text: De NOvAA draagt alle kosten en is gerechtigd tot alle baten, uit de uitvoering van deze wet voortvloeiende.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel31
  - number: '32'
    text: |-
      1 Het bestuur kan de krachtens deze wet aan de NOvAA verschuldigde bedragen, verhoogd met de op de invordering
      vallende kosten, bij dwangbevel invorderen. Geen invordering behoort te geschieden dan nadat de nalatige
      schuldenaar door het bestuur bij aangetekende brief tot betaling is aangemaand, doch in gebreke is gebleven
      binnen de in de aanmaning gestelde termijn, die tenminste tien dagen behoort te bedragen, aan zijn verplichting
      te voldoen.

      2 Het dwangbevel levert een executoriale titel op, die met toepassing van de voorschriften van het
      [Wetboek van Burgerlijke rechtsvordering][ref1] kan worden tenuitvoergelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '33'
    text: |-
      1 Indien een verordening van de NOvAA de goedkeuring van een Onzer Ministers behoeft, wordt deze alleen geweigerd
      wegens strijd met het recht of het algemeen belang.

      2 Onze Minister kan bij een beslissing tot goedkeuring van een verordening bepalen dat nadere voorschriften,
      overeenkomstig [artikel 24, vierde lid][ref1], ter uitvoering van die verordening gegeven, eveneens zijn
      goedkeuring behoeven. Het eerste lid is wat de goedkeuring van die nadere voorschriften betreft van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel24
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '24'
        paragraaf: '4'
  - number: '34'
    text: >-
      1 Verordeningen en andere beslissingen van de NOvAA kunnen bij koninklijk besluit worden vernietigd.


      2 Van een besluit tot schorsing of vernietiging wordt mededeling gedaan door plaatsing in de *Staatscourant*.


      3 Het achterwege blijven van vernietiging binnen de termijn waarvoor een beslissing is geschorst wordt, nadat de
      schorsing is geëindigd, voor zover het een bekendgemaakte beslissing betreft, door het bestuur op bij algemene
      maatregel te bepalen wijze bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel34
  - number: '35'
    text: >-
      Het bestuur brengt jaarlijks vóór 1 augustus aan Onze Minister verslag uit omtrent de werkzaamheden van de NOvAA in
      het afgelopen boekjaar. Dit verslag wordt, tegen betaling van de kosten, algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel35
  - number: '36'
    text: |-
      1 Er is een accountantsregister, waarin als Accountant-Administratieconsulent op hun aanvraag worden ingeschreven
      zij, die voldoen aan de bij deze wet gestelde eisen.

      2 Bij elke inschrijving worden in het register vermeld de naam, voornamen, geboortedatum en het adres van de
      betrokkene en de datum der inschrijving.

      3 Bij de inschrijving van degene die voldoet aan de bij [artikel 38][ref1] voor inschrijving gestelde eis wordt
      de aantekening geplaatst dat hem het in [artikel 393, eerste lid, van boek 2 van het Burgerlijk Wetboek][ref2]
      bedoelde onderzoek van jaarrekeningen kan worden opgedragen.

      4 Bij elke doorhaling van een inschrijving wordt de datum der doorhaling vermeld.

      5 In geval van schorsing van een ingeschrevene als Accountant-Administratieconsulent worden vermeld de tijdstippen,
      waarop de schorsing aanvangt en eindigt.

      6 Met het beheer van het accountantsregister is belast het bestuur van de NOvAA.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '38'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '37'
    text: |-
      1 Het accountantsregister ligt voor een ieder kosteloos ter inzage bij het bestuur van de NOvAA.

      2 Tegen betaling van een vergoeding, volgens een door de ledenvergadering bij verordening vast te stellen tarief,
      wordt aan een ieder, die zulks verlangt, schriftelijk medegedeeld:

      a. of een persoon in het register bedoeld in [artikel 36][ref1] staat ingeschreven;

      b. of een ingeschrevene als Accountant-Administratieconsulent is geschorst;

      c. of ten aanzien van een ingeschrevene een aantekening als bedoeld in [artikel 36, derde lid][ref2], is geplaatst.

      3 Ten dienste van het Rijk, de provincies, de gemeenten en andere publiekrechtelijke lichamen worden schriftelijke
      mededelingen als in het tweede lid bedoeld kosteloos verstrekt.

      4 Verordeningen vastgesteld krachtens het tweede lid, behoeven de goedkeuring van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel36
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '36'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002856
        artikel: '36'
        paragraaf: '1'
  - number: '38'
    text: |-
      In het accountantsregister kunnen worden ingeschreven zij, die beschikken over:

      a. een diploma, afgegeven op grond van het met goed gevolg afgelegd hebben van het in [artikel 80][ref1] bedoelde
      examen;

      b. een diploma, afgegeven op grond van het met goed gevolg afgelegd hebben van een examen, ter zake waarvan een
      verklaring als bedoeld in [artikel 91, eerste lid][ref2], is afgegeven, alsmede een getuigschrift van het met goed
      gevolg afgelegd hebben van het praktijkgedeelte van het in artikel 80 bedoelde examen;

      c. een verklaring van vakbekwaamheid als bedoeld in [artikel 93][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel91
      [ref3]: https://wetten.overheid.nl/BWBR0002856#Artikel93
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '80'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002856
        artikel: '91'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0002856
        artikel: '93'
        paragraaf: '4'
  - number: '39'
    text: |-
      Degene, die is ingeschreven in het register bedoeld in [artikel 36][ref1], is gerechtigd tot het voeren van de
      titel Accountant-Administratieconsulent, afgekort AA.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel36
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '36'
        paragraaf: '1'
  - number: '40'
    text: |-
      Het is degene, die niet is ingeschreven in het register bedoeld in [artikel 36][ref1], verboden de titel
      Accountant-Administratieconsulent zonder toevoeging dan wel in enigerlei samenstelling of afkorting te voeren, dan
      wel zich zodanig te gedragen, dat daardoor bij het publiek redelijkerwijs de indruk moet worden gewekt, dat hij tot
      het voeren van deze titel gerechtigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel36
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '36'
        paragraaf: '1'
  - number: '41'
    text: |-
      1 Het is degene, die niet is ingeschreven in het register bedoeld in [artikel 36][ref1] of in het register
      bedoeld in [artikel 55 van de Wet op de Registeraccountants][ref2] verboden om anders dan in besloten kring de
      benaming accountant zonder nadere toevoeging dan wel in enige samenstelling of afkorting, anders dan die van
      registeraccountant of Accountant-Administratieconsulent te voeren, danwel zich zodanig te gedragen, dat daardoor
      bij het publiek redelijkerwijs de indruk moet worden gewekt, dat hij tot het voeren van die benaming gerechtigd is.

      2 In afwijking van het bepaalde in het eerste lid is het degene, die in een dienstbetrekking werkzaam is,
      toegestaan de benaming adjunct-accountant, assistent-accountant of een andere soortgelijke benaming te voeren,
      indien hij werkzaamheden verricht onder rechtstreekse verantwoordelijkheid van een in die dienstbetrekking boven
      hem geplaatste accountant.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0002374#Artikel55
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '36'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002374
        artikel: '55'
  - number: '42'
    text: |-
      Onze Minister kan bepalen dat degene, die is ingeschreven in het register, bedoeld in [artikel 36][ref1], en die
      een opleidings- of beroepstitel of een afkorting daarvan voert, waartoe hij op grond van een wettelijke regeling
      van een andere Staat dan Nederland is gerechtigd, bij het voeren van die titel of afkorting tevens de naam en de
      plaats van vestiging van de instelling of examencommissie, die deze titel heeft verleend, moet vermelden.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel36
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '36'
        paragraaf: '1'
  - number: '43'
    text: |-
      1 Degene, die in strijd handelt met het bepaalde in de [artikelen 40][ref1], [41, eerste lid][ref2], en
      [52, tweede lid][ref3], wordt gestraft met een geldboete van de tweede categorie.

      2 De in het eerste lid strafbaar gestelde feiten zijn overtredingen.

      3 Indien tijdens het plegen van een in het eerste lid omschreven overtreding nog geen jaar is verlopen sedert een
      vroegere veroordeling van de schuldige wegens een dier overtredingen onherroepelijk is geworden, wordt hij gestraft
      met een hechtenis van ten hoogste twee weken of geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0002856#Artikel52
    url: https://wetten.overheid.nl/BWBR0002856/2006-02-01#Artikel43
