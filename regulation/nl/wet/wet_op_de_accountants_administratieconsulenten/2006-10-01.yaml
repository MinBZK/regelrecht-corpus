---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_de_accountants_administratieconsulenten
regulatory_layer: WET
publication_date: '2006-02-23'
valid_from: '2006-10-01'
bwb_id: BWBR0002856
url: https://wetten.overheid.nl/BWBR0002856/2006-10-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is bij de wet nadere regelen te stellen betreffende het
    accountantswezen, in het bijzonder met betrekking tot de dienstverlening op het gebied van de accountancy en de
    daarmee verband houdende werkzaamheden ten behoeve van ondernemingen, behorende tot het midden- of kleinbedrijf;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Financiën;'
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel1
  - number: 1.b
    text: |-
      NOvAA: de Nederlandse Orde van Accountants-Administratieconsulenten, bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel2
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '2'
        paragraaf: '1'
  - number: '2.1'
    text: |-
      Er is een Nederlandse Orde van Accountants-Administratieconsulenten die tot leden heeft degenen, die zijn
      ingeschreven in het register bedoeld in [artikel 36][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel36
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '36'
        paragraaf: '1'
  - number: '2.2'
    text: |-
      De NOvAA is gevestigd te 's-Gravenhage. Zij is een openbaar lichaam in de zin van
      [artikel 134 van de Grondwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel134
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '134'
  - number: '2.3'
    text: |-
      De NOvAA heeft tot taak de bevordering van een goede beroepsuitoefening door Accountants-
      Administratieconsulenten en de behartiging van hun gemeenschappelijk belang. Ten aanzien van
      Accountants-Administratieconsulenten die werkzaamheden verrichten als externe accountant als bedoeld in
      [artikel 1, onderdeel e, van de Wet toezicht accountantsorganisaties][ref1] heeft de NOvAA tot taak de
      bevordering van een goede beroepsuitoefening van deze accountants binnen accountantsorganisaties als bedoeld
      in [artikel 1, onderdeel a, van die wet][ref2]. Haar taak omvat mede de zorg voor de eer van de stand van
      de Accountants-Administratieconsulenten en het verzorgen of doen verzorgen van de praktijkstage, bedoeld in
      [artikel 54][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002856#Artikel54
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0002856
        artikel: '54'
        paragraaf: '3'
  - number: '2.4'
    text: |-
      In afwijking van het eerste lid zijn degenen, die op grond van [artikel 38, onder c][ref1], juncto
      [artikel 44, tweede lid][ref2], in het register zijn ingeschreven, slechts lid van de NOvAA indien zij de wens
      daartoe schriftelijk aan het bestuur van de NOvAA kenbaar hebben gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel44
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '38'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002856
        artikel: '44'
        paragraaf: '2'
  - number: '3'
    text: |-
      Het bestuur van de NOvAA verstrekt Onze Ministers desgevraagd alle inlichtingen over alle zaken, de NOvAA
      betreffende.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel3
  - number: 3a
    text: |-
      Indien de NOvAA haar taken vervult met betrekking tot Accountants-
      Administratieconsulenten die werkzaamheden verrichten als externe accountant als bedoeld
      in [artikel 1, onderdeel e, van de Wet toezicht accountantsorganisaties][ref1], werkt de
      NOvAA , voor zover noodzakelijk ten behoeve van de uitoefening van het toezicht ingevolge de
      [Wet toezicht accountantsorganisaties][ref2], samen met de Stichting Autoriteit Financiële Markten. In de daartoe
      voorkomende gevallen pleegt de NOvAA overleg met de Stichting Autoriteit Financiële Markten.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0019468
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0019468
  - number: '4'
    text: De NOvAA heeft een ledenvergadering, een bestuur en een voorzitter.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel4
  - number: '5.1'
    text: |-
      Het aantal leden van het bestuur wordt door de algemene ledenvergadering bepaald, doch bedraagt tenminste zeven. De
      bestuursleden worden door de ledenvergadering uit de leden van de NOvAA voor vier jaren benoemd.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel5
  - number: '5.2'
    text: |-
      Jaarlijks treedt een deel der bestuursleden volgens een door de ledenvergadering vast te stellen rooster af. Het
      rooster wordt zodanig ingericht, dat voorzover mogelijk telkenmale hetzelfde aantal bestuursleden aftreedt. De
      aftredenden zijn niet terstond herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel5
  - number: '5.3'
    text: |-
      Hij, die benoemd is ter vervulling van een tussentijds opengevallen plaats, treedt af op het tijdstip waarop
      degene, in wiens plaats hij is benoemd, had moeten aftreden.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel5
  - number: '5.4'
    text: |-
      De jaarlijkse benoeming van bestuursleden ter vervulling van de ingevolge het tweede lid openvallende plaatsen
      geschiedt in de bijeenkomst van de ledenvergadering, waarin overeenkomstig [artikel 29][ref1] het bestuur rekening
      en verantwoording doet.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel29
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '29'
        paragraaf: '5'
  - number: '6'
    text: De leden van het bestuur ontvangen vergoeding van reis- en verblijfkosten.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel6
  - number: '8.1'
    text: |-
      De voorzitter en de plaatsvervangende voorzitter worden door de ledenvergadering uit de bestuursleden telkens
      voor een jaar benoemd. Behoudens ter vervulling van een tussentijds openvallende plaats geschiedt de benoeming
      in de bijeenkomst van de ledenvergadering, waarin overeenkomstig [artikel 29][ref1] het bestuur rekening en
      verantwoording doet.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel29
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '29'
        paragraaf: '5'
  - number: '8.2'
    text: |-
      De [artikelen 5, derde lid][ref1], en [6][ref2] zijn ten aanzien van de voorzitter en de plaatsvervangende
      voorzitter van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel6
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002856
        artikel: '6'
        paragraaf: '2'
  - number: '9.1'
    text: |-
      Het personeel, dat de NOvAA en de bij of krachtens deze wet ingestelde colleges voor de vervulling van hun taak
      behoeven, wordt door of namens de NOvAA in dienst genomen op arbeidsovereenkomst naar burgerlijk recht.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel9
  - number: '9.2'
    text: De ledenvergadering regelt bij verordening de voorwaarden, waaronder de indienstneming geschiedt.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel9
  - number: '9.3'
    text: Verordeningen, vastgesteld krachtens het tweede lid, behoeven de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel9
  - number: '10'
    text: |-
      Het bestuur roept de ledenvergadering bijeen, zo dikwijls het zulks nodig oordeelt en voorts indien tenminste
      veertig leden van de NOvAA, onder opgaaf van de te behandelen punten, om haar bijeenroeping verzoeken.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel10
  - number: '11'
    text: |-
      De voorzitter van de NOvAA bekleedt in de bijeenkomsten van de ledenvergadering en in de bestuursvergaderingen
      het voorzitterschap.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel11
  - number: '12'
    text: Het bestuur vergadert niet, wanneer niet tenminste de helft van het aantal zitting hebbende leden is opgekomen.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel12
  - number: '13'
    text: |-
      De leden van het bestuur zijn niet gerechtelijk vervolgbaar voor hetgeen zij in de bestuursvergadering hebben
      gezegd of aan haar schriftelijk hebben overgelegd.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel13
  - number: '14'
    text: De leden van het bestuur stemmen zonder last of ruggespraak.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel14
  - number: '15'
    text: |-
      De leden van het bestuur onthouden zich in de bestuursvergaderingen van medestemmen over aangelegenheden, die hun,
      hun echtgenoten of hun geregistreerde partners, hun bloed- of aanverwanten tot de derde graad ingesloten, degenen
      met wie zij in de uitoefening van een beroep voor gemene rekening of onder gemeenschappelijke naam optreden, hun
      werknemers, hun werkgevers, hun opdrachtgevers of degenen, op wie de in de uitoefening van hun beroep verrichte
      werkzaamheden rechtstreeks betrekking hebben, persoonlijk aangaan.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel15
  - number: '16.1'
    text: De bijeenkomsten van de ledenvergadering worden in het openbaar gehouden.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel16
  - number: '16.2'
    text: |-
      De deuren worden gesloten, wanneer tenminste een vijfde van de aanwezige leden daarom verzoekt of de voorzitter het
      nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel16
  - number: '16.3'
    text: De ledenvergadering beslist vervolgens of met gesloten deuren zal worden vergaderd.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel16
  - number: '17.1'
    text: Indien bij het nemen van een beslissing geen der leden stemming vraagt, is het voorstel aangenomen.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel17
  - number: '17.2'
    text: Stemming over personen vindt plaats bij gesloten en ongetekende stembriefjes.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel17
  - number: '18.1'
    text: |-
      Een stemming in een bijeenkomst van de ledenvergadering is nietig, indien niet meer dan de helft van het aantal
      blijkens de presentielijst opgekomen leden eraan heeft deelgenomen.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel18
  - number: '18.2'
    text: |-
      Een stemming in een bestuursvergadering is nietig, indien niet tenminste de helft van het aantal zittinghebbende
      leden, die zich niet van medestemmen moeten onthouden, eraan heeft deelgenomen
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel18
  - number: '18.3'
    text: |-
      Bij stemming over personen worden leden, die blanco briefjes ingeleverd hebben, voor de toepassing van dit artikel
      geacht aan de stemming te hebben deelgenomen.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel18
  - number: '19.1'
    text: Ieder lid kan slechts één stem uitbrengen.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel19
  - number: '19.2'
    text: |-
      Tenzij bij verordening anders is bepaald, kan een lid aan een ander lid schriftelijk volmacht verlenen tot het
      uitbrengen van zijn stem. Een lid kan voor ten hoogste drie andere leden een stem uitbrengen. Leden van het bestuur
      kunnen niet als gevolmachtigde optreden.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel19
  - number: '19.3'
    text: |-
      Voor het tot stand komen van een beslissing bij stemming wordt de volstrekte meerderheid van de uitgebrachte
      stemmen vereist. Blanco stemmen worden voor de toepassing van dit artikel geacht niet te zijn uitgebracht.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel19
  - number: '20.1'
    text: |-
      Bij staking van stemmen in een bijeenkomst van de ledenvergadering of in een voltallige bestuursvergadering is,
      indien het zaken betreft, het voorstel verworpen en beslist, indien het personen betreft, het lot.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel20
  - number: '20.2'
    text: |-
      Bij staking van stemmen in een niet voltallige bestuursvergadering wordt het nemen van een beslissing tot een
      volgende vergadering uitgesteld, waarin de beraadslagingen kunnen worden heropend. Indien de stemmen dan opnieuw
      staken, is het eerste lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel20
  - number: '21.1'
    text: De ledenvergadering kan bij verordening nadere regelen stellen betreffende haar werkwijze en die van het bestuur.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel21
  - number: '21.2'
    text: |-
      Het bestuur kan nadere regelen stellen betreffende zijn werkwijze, voor zover niet de ledenvergadering daarin bij
      verordening heeft voorzien.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel21
  - number: '22'
    text: Het bestuur bestuurt de NOvAA en voert het beheer over haar vermogen.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel22
  - number: '23'
    text: De voorzitter vertegenwoordigt de NOvAA in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel23
  - number: '24.1'
    text: |-
      De ledenvergadering maakt de verordeningen, die zij ter vervulling van de in [artikel 2, derde lid][ref1],
      omschreven taak nodig oordeelt.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel2
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '2'
        paragraaf: '1'
  - number: '24.2'
    text: |-
      De ledenvergadering stelt ten behoeve van een goede uitoefening van de werkzaamheden van Accountants-
      Administratieconsulenten bij verordening gedrags- en beroepsregels vast, welke gelden voor alle Accountants-
      Administratieconsulenten.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel24
  - number: '24.3'
    text: |-
      Voor zover uit deze wet niet anders blijkt, zijn de verordeningen van de NOvAA slechts verbindend voor haar leden
      en organen.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel24
  - number: '24.4'
    text: |-
      De ledenvergadering stelt bij verordening regels vast terzake van de onafhankelijkheid, het stelsel
      van kwaliteitsbeheersing en de integere bedrijfsvoering van accountantsorganisaties als bedoeld in
      [artikel 1, eerste lid, onderdeel a, van de Wet toezicht accountantsorganisaties][ref1], welke verbindend zijn voor
      alle accountantsorganisaties waarbinnen Accountants-Administratieconsulenten hun beroep uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel1
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '1'
  - number: '24.5'
    text: |-
      De ledenvergadering kan de bevoegdheid tot het geven van nadere voorschriften omtrent door haar bij verordening
      geregelde onderwerpen overdragen aan het bestuur.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel24
  - number: '24.6'
    text: |-
      Verordeningen, vastgesteld krachtens het tweede lid, met betrekking tot de uitoefening van de werkzaamheden
      van Accountants-Administratieconsulenten ter zake van het verrichten van wettelijke controles als bedoeld in
      [artikel 1, onderdeel j, van de Wet toezicht accountantsorganisaties][ref1], en vierde lid, behoeven de goedkeuring
      van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel1
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '1'
  - number: '25.1'
    text: |-
      De voorschriften in de in [artikel 24, tweede lid][ref1], bedoelde verordening met betrekking tot de uitoefening
      van de werkzaamheden van Accountants-Administratieconsulenten ter zake van het verrichten van wettelijke
      controles als bedoeld in [artikel 1, eerste lid, onderdeel j, van de Wet toezicht accountantsorganisaties][ref2],
      dienen dezelfde inhoud te hebben als de desbetreffende voorschriften in de in
      [artikel 19, tweede lid, van de Wet op de Registeraccountants][ref3] bedoelde verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002374#Artikel19
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '24'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0002374
        artikel: '19'
  - number: '25.2'
    text: |-
      Met het oog op de uitvoering van het eerste lid wordt een ontwerp voor de desbetreffende bepalingen van de
      verordening opgesteld door een commissie, bestaande uit een gelijk aantal leden van de Nederlandse Orde van
      Accountants-Administratieconsulenten en van het Nederlands Instituut voor Registeraccountants.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel25
  - number: '25.3'
    text: |-
      In afwijking van het eerste en tweede lid kan Onze Minister van Financiën, op voorstel van de NOvAA,
      bij ministeriële regeling regels stellen met betrekking tot het in het eerste lid bedoelde onderwerp.
      Daarbij bepaalt Onze Minister van Financiën tevens welke bepalingen uit de verordeningen, bedoeld in
      [artikel 19, tweede lid, van de Wet op de Registeraccountants][ref1] en [artikel 24, tweede lid][ref2], buiten
      toepassing blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel24
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0002856
        artikel: '24'
        paragraaf: '4'
  - number: '25.4'
    text: |-
      Indien een verordening houdende de in het eerste lid bedoelde voorschriften wordt vernietigd op grond van
      [artikel 34][ref1] en de ledenvergadering niet binnen zes maanden na de datum van vernietiging een verordening
      heeft vastgesteld in overeenstemming met het bepaalde in het eerste lid, worden de in dat lid bedoelde
      voorschriften vastgesteld door Onze Minister, in overeenstemming met Onze Minister van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel34
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '34'
        paragraaf: '6'
  - number: '26.1'
    text: |-
      De ontwerpen van verordeningen worden door het bestuur op bij algemene maatregel van bestuur te bepalen wijze
      openbaar gemaakt. Een ieder kan gedurende drie weken na de openbaarmaking van een ontwerp bij het bestuur zijn
      bedenkingen schriftelijk naar voren brengen. Het bestuur brengt de naar voren gebrachte bedenkingen ter kennis van
      de leden.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel26
  - number: '26.2'
    text: |-
      De verordeningen worden door het bestuur op bij algemene maatregel van bestuur te bepalen wijze bekendgemaakt.
      Indien zij de goedkeuring van Onze Minister behoeven, geschiedt de bekendmaking niet dan nadat de goedkeuring
      is verleend en wordt bij de bekendmaking aan de voet van de verordening het besluit vermeld, waarbij deze is
      goedgekeurd. De verordeningen treden, indien zij niet anders bepalen, niet eerder in werking dan de tweede dag na
      die van de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel26
  - number: '27'
    text: Het boekjaar van de NOvAA loopt van 1 januari tot en met 31 december.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel27
  - number: '28'
    text: |-
      Vóór de aanvang van het boekjaar stelt de ledenvergadering de begroting van de NOvAA vast. Het bestuur dient
      daartoe een ontwerpbegroting in, vergezeld van de nodige toelichting. Het ontwerp wordt door het bestuur, tenminste
      twee weken vóór de behandeling daarvan door de ledenvergadering, aan de leden toegezonden.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel28
  - number: '29.1'
    text: |-
      Voor elk boekjaar benoemt de ledenvergadering uit de leden een Accountant-Administratieconsulent bij wiens
      inschrijving in het in [artikel 36, eerste lid][ref1], bedoelde register een aantekening als bedoeld in
      [artikel 36, derde lid][ref2], is geplaatst, die belast is met de controle op de financiële verantwoording,
      benevens een plaatsvervanger voor deze.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel36
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '36'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002856
        artikel: '36'
        paragraaf: '1'
  - number: '29.2'
    text: |-
      De Accountant-Administratieconsulent brengt binnen dertien weken na afloop van het betrokken boekjaar een verslag
      uit aan het bestuur.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel29
  - number: '29.3'
    text: |-
      Binnen zes maanden na afloop van het boekjaar doet het bestuur aan de ledenvergadering rekening en verantwoording
      over zijn in het boekjaar gevoerde bestuur, onder overlegging van een balans en staat van baten en lasten met
      toelichting en met een verklaring van een Accountant-Administratieconsulent daarover. De balans, de staat van
      baten en lasten, de toelichting en de verklaring van de Accountant-Administratieconsulent worden door het bestuur,
      tenminste twee weken vóór behandeling daarvan door de ledenvergadering, aan de leden toegezonden.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel29
  - number: '29.4'
    text: |-
      De ledenvergadering stelt de rekening vast. De vaststelling strekt tot décharge van het bestuur, behoudens in geval
      van later gebleken valsheid in bewijsstukken of andere onregelmatigheden.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel29
  - number: '30.1'
    text: |-
      De NOvAA kan van haar leden jaarlijks bijdragen heffen, waarvan het bedrag voor elk boekjaar afzonderlijk door
      de ledenvergadering bij verordening wordt vastgesteld. Het bedrag kan voor verschillende categorieën van leden
      verschillend zijn.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel30
  - number: '30.2'
    text: De verordening, bedoeld in het eerste lid, eerste volzin, behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel30
  - number: '31'
    text: De NOvAA draagt alle kosten en is gerechtigd tot alle baten, uit de uitvoering van deze wet voortvloeiende.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel31
  - number: '32.1'
    text: |-
      Het bestuur kan de krachtens deze wet aan de NOvAA verschuldigde bedragen, verhoogd met de op de invordering
      vallende kosten, bij dwangbevel invorderen. Geen invordering behoort te geschieden dan nadat de nalatige
      schuldenaar door het bestuur bij aangetekende brief tot betaling is aangemaand, doch in gebreke is gebleven
      binnen de in de aanmaning gestelde termijn, die tenminste tien dagen behoort te bedragen, aan zijn verplichting
      te voldoen.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel32
  - number: '32.2'
    text: |-
      Het dwangbevel levert een executoriale titel op, die met toepassing van de voorschriften van het
      [Wetboek van Burgerlijke rechtsvordering][ref1] kan worden tenuitvoergelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '33.1'
    text: |-
      Indien een verordening van de NOvAA de goedkeuring van een Onzer Ministers behoeft, wordt deze alleen geweigerd
      wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel33
  - number: '33.2'
    text: |-
      Onze Minister kan bij een beslissing tot goedkeuring van een verordening bepalen dat nadere voorschriften,
      overeenkomstig [artikel 24, vierde lid][ref1], ter uitvoering van die verordening gegeven, eveneens zijn
      goedkeuring behoeven. Het eerste lid is wat de goedkeuring van die nadere voorschriften betreft van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel24
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '24'
        paragraaf: '4'
  - number: '34.1'
    text: Verordeningen en andere beslissingen van de NOvAA kunnen bij koninklijk besluit worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel34
  - number: '34.2'
    text: Van een besluit tot schorsing of vernietiging wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel34
  - number: '34.3'
    text: |-
      Het achterwege blijven van vernietiging binnen de termijn waarvoor een beslissing is geschorst wordt, nadat de
      schorsing is geëindigd, voor zover het een bekendgemaakte beslissing betreft, door het bestuur op bij algemene
      maatregel te bepalen wijze bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel34
  - number: '35'
    text: |-
      Het bestuur brengt jaarlijks vóór 1 augustus aan Onze Minister verslag uit omtrent de werkzaamheden van de NOvAA in
      het afgelopen boekjaar. Dit verslag wordt, tegen betaling van de kosten, algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel35
  - number: '36.1'
    text: |-
      Er is een accountantsregister, waarin als Accountant-Administratieconsulent op hun aanvraag worden ingeschreven
      zij, die voldoen aan de bij deze wet gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel36
  - number: '36.2'
    text: |-
      Bij elke inschrijving worden in het register vermeld de naam, voornamen, geboortedatum en het adres van de
      betrokkene en de datum der inschrijving.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel36
  - number: '36.3'
    text: |-
      Bij de inschrijving van degene die voldoet aan de bij [artikel 38][ref1] voor inschrijving gestelde eis wordt
      de aantekening geplaatst dat hem het in [artikel 393, eerste lid, van boek 2 van het Burgerlijk Wetboek][ref2]
      bedoelde onderzoek van jaarrekeningen kan worden opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '38'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '36.4'
    text: Bij elke doorhaling van een inschrijving wordt de datum der doorhaling vermeld.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel36
  - number: '36.5'
    text: |-
      In geval van schorsing van een ingeschrevene als Accountant-Administratieconsulent worden vermeld de tijdstippen,
      waarop de schorsing aanvangt en eindigt.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel36
  - number: '36.6'
    text: Met het beheer van het accountantsregister is belast het bestuur van de NOvAA.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel36
  - number: '37.1'
    text: Het accountantsregister ligt voor een ieder kosteloos ter inzage bij het bestuur van de NOvAA.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel37
  - number: '37.2'
    text: |-
      Tegen betaling van een vergoeding, volgens een door de ledenvergadering bij verordening vast te stellen tarief,
      wordt aan een ieder, die zulks verlangt, schriftelijk medegedeeld:
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel37
  - number: 37.2.a
    text: |-
      of een persoon in het register bedoeld in [artikel 36][ref1] staat ingeschreven;


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel36
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '36'
        paragraaf: '1'
  - number: 37.2.b
    text: of een ingeschrevene als Accountant-Administratieconsulent is geschorst;
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel37
  - number: 37.2.c
    text: |-
      of ten aanzien van een ingeschrevene een aantekening als bedoeld in [artikel 36, derde lid][ref1], is geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel36
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '36'
        paragraaf: '1'
  - number: '37.3'
    text: |-
      Ten dienste van het Rijk, de provincies, de gemeenten en andere publiekrechtelijke lichamen worden schriftelijke
      mededelingen als in het tweede lid bedoeld kosteloos verstrekt.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel37
  - number: '37.4'
    text: Verordeningen vastgesteld krachtens het tweede lid, behoeven de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel37
  - number: '38'
    text: 'In het accountantsregister kunnen worden ingeschreven degenen die:'
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel38
  - number: 38.a
    text: |-
      beschikken over getuigschriften waaruit blijkt dat zij de opleiding, bedoeld in [artikel 53][ref1], met goed gevolg
      hebben afgerond; of


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel53
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '53'
        paragraaf: '2'
  - number: 38.b
    text: |-
      beschikken over een verklaring van vakbekwaamheid als bedoeld in [artikel 57][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel57
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '57'
        paragraaf: '3'
  - number: '39'
    text: |-
      Degene, die is ingeschreven in het register bedoeld in [artikel 36][ref1], is gerechtigd tot het voeren van de
      titel Accountant-Administratieconsulent, afgekort AA.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel36
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '36'
        paragraaf: '1'
  - number: '40'
    text: |-
      Het is degene, die niet is ingeschreven in het register bedoeld in [artikel 36][ref1], verboden de titel
      Accountant-Administratieconsulent zonder toevoeging dan wel in enigerlei samenstelling of afkorting te voeren, dan
      wel zich zodanig te gedragen, dat daardoor bij het publiek redelijkerwijs de indruk moet worden gewekt, dat hij tot
      het voeren van deze titel gerechtigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel36
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '36'
        paragraaf: '1'
  - number: '41.1'
    text: |-
      Het is degene, die niet is ingeschreven in het register bedoeld in [artikel 36][ref1] of in het register
      bedoeld in [artikel 55 van de Wet op de Registeraccountants][ref2] verboden om anders dan in besloten kring de
      benaming accountant zonder nadere toevoeging dan wel in enige samenstelling of afkorting, anders dan die van
      registeraccountant of Accountant-Administratieconsulent te voeren, danwel zich zodanig te gedragen, dat daardoor
      bij het publiek redelijkerwijs de indruk moet worden gewekt, dat hij tot het voeren van die benaming gerechtigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0002374#Artikel55
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '36'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002374
        artikel: '55'
  - number: '41.2'
    text: |-
      In afwijking van het bepaalde in het eerste lid is het degene, die in een dienstbetrekking werkzaam is, toegestaan
      de benaming adjunct-accountant, assistent-accountant of een andere soortgelijke benaming te voeren, indien
      hij werkzaamheden verricht onder rechtstreekse verantwoordelijkheid van een in die dienstbetrekking boven hem
      geplaatste accountant.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel41
  - number: '42'
    text: |-
      Onze Minister kan bepalen dat degene, die is ingeschreven in het register, bedoeld in [artikel 36][ref1], en die
      een opleidings- of beroepstitel of een afkorting daarvan voert, waartoe hij op grond van een wettelijke regeling
      van een andere Staat dan Nederland is gerechtigd, bij het voeren van die titel of afkorting tevens de naam en de
      plaats van vestiging van de instelling of examencommissie, die deze titel heeft verleend, moet vermelden.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel36
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '36'
        paragraaf: '1'
  - number: '43.1'
    text: |-
      Degene, die in strijd handelt met het bepaalde in de [artikelen 40][ref1], [41, eerste lid][ref2], en
      [52, tweede lid][ref3], wordt gestraft met een geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0002856#Artikel52
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '40'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002856
        artikel: '41'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002856
        artikel: '52'
        paragraaf: '2'
  - number: '43.2'
    text: De in het eerste lid strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel43
  - number: '43.3'
    text: |-
      Indien tijdens het plegen van een in het eerste lid omschreven overtreding nog geen jaar is verlopen sedert een
      vroegere veroordeling van de schuldige wegens een dier overtredingen onherroepelijk is geworden, wordt hij gestraft
      met een hechtenis van ten hoogste twee weken of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel43
  - number: '44.1'
    text: 'De inschrijving wordt geweigerd:'
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel44
  - number: 44.1.a
    text: |-
      indien de aanvrager niet voldoet aan de bij [artikel 38][ref1] voor inschrijving gestelde eis;


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel38
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '38'
        paragraaf: '2'
  - number: 44.1.b
    text: |-
      indien de aanvrager ingevolge in kracht van gewijsde gegane rechterlijke uitspraak in staat van faillissement
      verkeert of ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is;
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel44
  - number: 44.1.c
    text: indien de aanvrager ingevolge in kracht van gewijsde gegane rechterlijke uitspraak onder curatele is gesteld;
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel44
  - number: 44.1.d
    text: indien de aanvrager ingevolge rechterlijke uitspraak is ontzet van het recht het accountantsberoep uit te oefenen;
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel44
  - number: 44.1.e
    text: |-
      indien gegronde vrees bestaat, dat de aanvrager na inschrijving inbreuk zal maken op wettelijke voorschriften,
      de Accountants-Administratieconsulenten betreffende, of dat zijn inschrijving in het register bedoeld in
      [artikel 36][ref1] uit anderen hoofde de eer van de stand van Accountants-Administratieconsulenten zal schaden.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel36
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '36'
        paragraaf: '1'
  - number: '44.2'
    text: |-
      Het eerste lid, onder e, is niet van toepassing op een aanvrager, die beschikt over de in
      [artikel 38, onder c][ref1], bedoelde verklaring, indien hij zonder zich in Nederland te vestigen onderzoeken als
      bedoeld in [artikel 393, eerste lid, van boek 2 van het Burgerlijk Wetboek][ref2] bij wijze van dienstverlening
      wil verrichten, mits hij bevoegd is tot het wettelijk voorgeschreven onderzoek van jaarrekeningen in een Lid-Staat
      van de Europese Gemeenschappen, anders dan Nederland, of in een andere Staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte (*Trb.* 1992, 132).


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '38'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '45.1'
    text: |-
      Hij, die in het accountantsregister wenst te worden ingeschreven, dient daartoe een aanvraag in bij het bestuur,
      onder betaling van een door de ledenvergadering bij verordening te bepalen bedrag.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel45
  - number: '45.2'
    text: Verordeningen vastgesteld krachtens het eerste lid, behoeven de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel45
  - number: '45.3'
    text: Onze Minister kan bepalen, welke gegevens bij de aanvraag dienen te worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel45
  - number: '45.4'
    text: |-
      Op de voorbereiding van de beschikking op de aanvraag tot inschrijving is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '47'
    text: |-
      Het bestuur schrijft de aanvrager, te wiens aanzien tot inschrijving is beslist, binnen drie dagen in het
      accountantsregister in.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel47
  - number: '48.1'
    text: 'Het bestuur haalt een inschrijving in het accountantsregister door:'
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel48
  - number: 48.1.a
    text: in geval van overlijden van de ingeschrevene;
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel48
  - number: 48.1.b
    text: op verzoek van de ingeschrevene;
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel48
  - number: 48.1.c
    text: |-
      indien de ingeschrevene in een der in [artikel 44, eerste lid, onder b tot en met d][ref1], genoemde omstandigheden
      is komen te verkeren;


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel44
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '44'
        paragraaf: '2'
  - number: 48.1.d
    text: |-
      ter tenuitvoerlegging, krachtens [artikel 53, tweede lid][ref1], van een daartoe strekkende tuchtrechtelijke
      maatregel;


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel53
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '53'
        paragraaf: '2'
  - number: 48.1.e
    text: |-
      indien de accountantskamer een maatregel tot doorhaling van de gegevens van de ingeschrevene in het register,
      bedoeld in [artikel 11 van de Wet toezicht accountantsorganisaties][ref1], heeft opgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel11
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '11'
  - number: 48.1.f
    text: |-
      indien de ingeschrevene na de tenuitvoerlegging van een dwangbevel in gebreke blijft de jaarlijkse bijdrage,
      bedoeld in [artikel 30][ref1], te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel30
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '30'
        paragraaf: '5'
  - number: '48.2'
    text: |-
      Doorhaling van de inschrijving brengt mede verlies van de betrekkingen, waarbij de hoedanigheid van lid van de
      NOvAA ingevolge het bij of krachtens deze wet bepaalde vereiste voor benoembaarheid of verkiesbaarheid is.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel48
  - number: '49.1'
    text: |-
      Hij, die in het accountantsregister ingeschreven is geweest met een aantekening als bedoeld
      in[ artikel 36, derde lid][ref1], wordt geacht te voldoen aan de bij [artikel 38][ref2] voor inschrijving gestelde
      eis.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel38
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '36'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002856
        artikel: '38'
        paragraaf: '2'
  - number: '49.2'
    text: |-
      Bij het indienen van een aanvraag om opnieuw in het accountantsregister te worden ingeschreven moet, indien de
      vorige inschrijving is doorgehaald op een der gronden, bedoeld in [artikel 48, eerste lid, onder ][ref1], het
      bewijs worden overgelegd, dat deze grond heeft opgehouden te bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel48
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '48'
        paragraaf: '2'
  - number: '50'
    text: |-
      Van elke doorhaling van een inschrijving in het accountantsregister wordt door het bestuur op bij algemene
      maatregel van bestuur te bepalen wijze mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel50
  - number: '51.1'
    text: |-
      De tuchtrechtspraak heeft ten doel het weren en beteugelen van misslagen van Accountants-Administratieconsulenten,
      in de uitoefening van hun beroep begaan en van inbreuken op verordeningen van de NOvAA en op de eer van de stand
      van vorenbedoelde Accountants-Administratieconsulenten.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel51
  - number: '51.2'
    text: |-
      De tuchtrechtspraak wordt in eerste aanleg door een of meer raden van tucht voor registeraccountants en
      Accountants-Administratieconsulenten en in beroep, tevens in hoogste ressort, door het College van Beroep voor het
      bedrijfsleven uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel51
  - number: '51.3'
    text: |-
      In geval van doorhaling van een inschrijving in het accountantsregister blijft de betrokkene ter zake van
      handelingen en gedragingen, die gedurende de tijd, dat hij ingeschreven stond, hebben plaats gehad, aan de
      tuchtrechtspraak onderworpen.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel51
  - number: '51.4'
    text: |-
      Indien de betrokkene wederom wordt ingeschreven, is hij bovendien aan deze rechtspraak onderworpen ter zake van
      handelingen en gedragingen, die gedurende de tijd, dat zijn inschrijving doorgehaald was, hebben plaats gehad en
      tot weigering van de inschrijving op grond van [artikel 44, eerste lid, onder ][ref1], aanleiding zouden hebben
      gegeven, zo zij reeds bij de behandeling van de aanvraag bekend waren geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel44
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '44'
        paragraaf: '2'
  - number: '51.5'
    text: |-
      Bij algemene maatregel van bestuur wordt het aantal raden van tucht bepaald, alsmede het rechtsgebied en de zetel
      van elk van deze raden.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel51
  - number: '52.1'
    text: |-
      Het berechtende college zal, indien het oordeelt, dat het tegen de betrokken Accountant-Administratieconsulent
      gerezen bezwaar gegrond is, een der volgende maatregelen kunnen opleggen:
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel52
  - number: 52.1.a
    text: schriftelijke waarschuwing;
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel52
  - number: 52.1.b
    text: schriftelijke berisping;
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel52
  - number: 52.1.c
    text: schorsing als Accountant-Administratieconsulent, voor ten hoogste zes maanden;
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel52
  - number: 52.1.d
    text: |-
      doorhaling van de inschrijving in het in [artikel 36][ref1] bedoelde accountantsregister.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel36
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '36'
        paragraaf: '1'
  - number: '52.2'
    text: |-
      De maatregel van schorsing als Accountant-Administratieconsulent brengt mede verlies, voor de tijd gedurende welke
      de maatregel van kracht is, van het recht de benaming accountant of de titel Accountant-Administratieconsulent te
      voeren. Voorts brengt deze maatregel mede verlies van de betrekkingen, waarbij de hoedanigheid van lid van de NOvAA
      ingevolge het bij of krachtens deze wet bepaalde vereiste voor benoembaarheid of verkiesbaarheid is.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel52
  - number: '52.3'
    text: |-
      De beslissing van het college wordt in het openbaar uitgesproken. Het college kan echter bij zijn beslissing
      houdende oplegging van een maatregel bepalen, dat deze, al dan niet of gedeeltelijk openbaar zal worden gemaakt.
      Het bepaalt daarbij tevens de wijze, waarop de openbaarmaking zal geschieden.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel52
  - number: '53.1'
    text: |-
      De maatregel van schorsing als Accountant-Administratieconsulent gaat in bij het onherroepelijk worden van de
      beslissing of op zodanig tijdstip nadien als in de beslissing is bepaald.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel53
  - number: '53.2'
    text: |-
      Het bestuur van de NOvAA draagt zorg voor de tenuitvoerlegging van de maatregelen van schriftelijke waarschuwing,
      van schriftelijke berisping en van doorhaling van de inschrijving in het register bedoeld in [artikel 36][ref1]
      en voor de in [artikel 52, derde lid][ref2], bedoelde openbaarmaking. De ten uitvoerlegging en de openbaarmaking
      geschieden niet voordat de beslissing onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel52
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '36'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002856
        artikel: '52'
        paragraaf: '2'
  - number: '54.1'
    text: 'De raden van tucht bestaan ieder uit de volgende leden:'
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel54
  - number: 54.1.a
    text: |-
      een voorzitter en een of meer plaatsvervangende voorzitters die voldoen aan de vereisten voor benoembaarheid tot
      rechter in een rechtbank en die met enige bij de wet ingestelde rechtspraak belast zijn of belast zijn geweest,
      doch het beroep van registeraccountant of het beroep van Accountant-Administratieconsulent niet uitoefenen noch
      hebben uitgeoefend;
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel54
  - number: 54.1.b
    text: zes registeraccountants;
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel54
  - number: 54.1.c
    text: |-
      zes Accountants-Administratieconsulenten, ten aanzien van wie bij de inschrijving in het in
      [artikel 36, eerste lid][ref1], bedoelde register een aantekening als bedoeld in [artikel 36, derde lid][ref2],
      is geplaatst;


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel36
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '36'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002856
        artikel: '36'
        paragraaf: '1'
  - number: 54.1.d
    text: |-
      zes personen die geen deel uitmaken van de categorieën bedoeld onder *a* tot en met *c* en die deskundig zijn ter
      zake van werkzaamheden verwant aan die van accountants.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel54
  - number: '54.2'
    text: De leden worden benoemd door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel54
  - number: '54.3'
    text: |-
      Onze Minister van Economische Zaken stelt een beschikking tot benoeming van een lid als in het eerste lid, onder
      *a*, bedoeld niet vast dan in overeenstemming met Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel54
  - number: '54.4'
    text: Onze Minister benoemt voor iedere raad van tucht een secretaris.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel54
  - number: '55.1'
    text: |-
      De leden van een raad van tucht worden voor vier jaren benoemd. Zij treden tegelijk af en zijn terstond
      herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel55
  - number: '55.2'
    text: |-
      Hij, die benoemd is ter vervulling van een tussentijds opengevallen plaats, treedt af op het tijdstip, waarop
      degene, in wiens plaats hij is benoemd, had moeten aftreden.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel55
  - number: '56.1'
    text: |-
      Tussen de leden en de secretaris van een raad van tucht mag niet bestaan de verhouding van echtgenoten of
      geregistreerde partners, bloed- of aanverwantschap tot de derde graad ingesloten, of de verhouding van werkgever
      tot werknemer. Zij mogen niet met elkaar in de uitoefening van een beroep voor gemene rekening of onder
      gemeenschappelijke naam optreden.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel56
  - number: '56.2'
    text: |-
      De leden van de raden van tucht kunnen niet tevens deel uitmaken van het bestuur van de in
      [artikel 1 van de Wet op de Registeraccountants][ref1] bedoelde Orde of van het bestuur van de NOvAA.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel1
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '1'
  - number: '57'
    text: |-
      De leden van de raden van tucht ontvangen vergoeding van reis- en verblijfkosten en vergoeding voor tijdverzuim
      volgens door Onze Minister te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel57
  - number: '58'
    text: 'Het is aan de leden en de secretarissen van de raden van tucht verboden:'
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel58
  - number: 58.a
    text: hetgeen zij als zodanig te weten zijn gekomen bekend te maken;
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel58
  - number: 58.b
    text: de gevoelens te openbaren, welke in raadkamer over aanhangige gedingen zijn geuit;
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel58
  - number: 58.c
    text: |-
      over een voor hen aanhangig geding of een geding, dat naar zij weten of vermoeden voor hen aanhangig zal worden,
      zich in te laten in enig onderhoud of gesprek met belanghebbenden of van dezen enige bijzondere inlichting of
      schriftelijk stuk aan te nemen.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel58
  - number: '59'
    text: |-
      Het in de [artikelen 46c, eerste lid, onder a, en tweede lid](onbekend), [46d](onbekend), [46f](onbekend), [46g,
      eerste en tweede lid](onbekend), [46i, eerste lid, met uitzondering van onderdeel c, en derde lid](onbekend),
      [46j](onbekend), [46l, eerste lid, met uitzondering van onderdeel c, en derde lid](onbekend),[ 46m](onbekend),
      [46o](onbekend), en[46p, eerste tot en met vijfde lid, van de Wet op de rechtspositie rechterlijke ambtenaren ]
      (onbekend) bepaalde is van overeenkomstige toepassing ten aanzien van de leden van een raad van tucht, met dien
      verstande dat de disciplinaire maatregel van waarschuwing ten aanzien van de leden van een raad van tucht door de
      voorzitter van de betreffende raad van tucht wordt opgelegd.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel59
  - number: '60'
    text: |-
      Onze Minister regelt de samenstelling en de werkwijze van het secretariaat van ieder van de raden van tucht. Onze
      Minister kan nadere regelen vaststellen met betrekking tot indienstneming c.q. aanstelling, arbeidsvoorwaarden en
      geheimhoudingsplicht van het personeel.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel60
  - number: '61'
    text: |-
      Aan de behandeling en de beslissing van tuchtzaken in de zin van deze wet wordt op straffe van nietigheid
      van de beslissing deelgenomen door drie of vijf leden van de raad van tucht, onder wie de voorzitter of een
      plaatsvervangend voorzitter.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel61
  - number: '62.1'
    text: |-
      De raad van tucht neemt een tegen een Accountant-Administratieconsulent gerezen bezwaar in behandeling hetzij op
      een bij die raad ingediende klacht, hetzij op het verzoek van het bestuur, hetzij ambtshalve.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel62
  - number: '62.2'
    text: |-
      De raad geeft van het in behandeling nemen van een bezwaar onverwijld kennis aan de betrokken Accountant-
      Administratieconsulent onder vermelding van de inhoud van het bezwaar.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel62
  - number: '62.3'
    text: |-
      In het geval, bedoeld in [artikel 51, vierde lid][ref1], neemt de raad het bezwaar niet in behandeling dan op
      verzoek van het bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel51
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '51'
        paragraaf: '1'
  - number: '63.1'
    text: |-
      Een lid van een raad van tucht kan zich verschonen en kan worden gewraakt, indien er te zijnen aanzien feiten of
      omstandigheden bestaan, waardoor in het algemeen de rechterlijke onpartijdigheid schade zou kunnen lijden.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel63
  - number: '63.2'
    text: |-
      Over de verschoning of wraking wordt door de overige leden van de raad van tucht zo spoedig mogelijk beslist. In
      geval van staking van stemmen is het verzoek tot wraking of verschoning toegestaan.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel63
  - number: '64.1'
    text: |-
      De raad van tucht beslist niet dan na verhoor, althans oproeping bij aangetekende brief, van de betrokken
      accountant, benevens, indien de behandeling op klacht, dan wel op verzoek van het bestuur geschiedt, van de klager,
      onderscheidenlijk van het bestuur.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel64
  - number: '64.2'
    text: |-
      De betrokkene kan - tenzij de raad van tucht beveelt, dat hij in persoon zal verschijnen - zich ter terechtzitting
      doen vertegenwoordigen door een daartoe gemachtigde. Hij kan zich door een raadsman doen bijstaan.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel64
  - number: '64.3'
    text: |-
      De raad van tucht kan weigeren bepaalde personen, die niet advocaat zijn, als gemachtigde of als raadsman toe te
      laten. Bij zodanige weigering houdt de raad de zaak tot een volgende zitting aan.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel64
  - number: '64.4'
    text: De betrokkene en zijn raadsman worden in de gelegenheid gesteld tijdig van de processtukken kennis te nemen.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel64
  - number: '64.5'
    text: |-
      De raad van tucht behandelt de klacht in een openbare zitting. De raad kan om gewichtige redenen beslissen dat de
      behandeling geheel of gedeeltelijk met gesloten deuren zal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel64
  - number: '65.1'
    text: De raad van tucht kan getuigen en deskundigen oproepen en horen.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel65
  - number: '65.2'
    text: |-
      Op verzoek van de raad van tucht doet de officier van justitie bij de rechtbank, binnen welker rechtsgebied de raad
      van tucht zitting houdt, de betrokken getuige of deskundige dagvaarden. De betrokkene is verplicht na dagvaarding
      te verschijnen.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel65
  - number: '65.3'
    text: |-
      Verschijnt een getuige of een deskundige op de dagvaarding niet, dan doet de officier van justitie op verzoek van
      de raad hem andermaal dagvaarden, desverzocht met bevel tot medebrenging.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel65
  - number: '65.4'
    text: |-
      [Artikel 556 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel556
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '556'
  - number: '65.5'
    text: |-
      De getuigen worden beëdigd de gehele waarheid en niets dan de waarheid te zeggen, de deskundigen verslag naar hun
      geweten te geven.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel65
  - number: '65.6'
    text: |-
      Ten aanzien van getuigen en deskundigen zijn de
      [artikelen 217 tot en met 219 van het Wetboek van Strafvordering][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel217
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '217'
  - number: '65.7'
    text: |-
      De getuigen en deskundigen ontvangen desverkiezende op vertoon van hun oproeping of dagvaarding schadeloosstelling,
      door de voorzitter van de raad van tucht te begroten overeenkomstig het bij of krachtens het Tarief van
      justitiekosten en salarissen in burgerlijke zaken bepaalde.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel65
  - number: '66.1'
    text: |-
      De beslissing van de raad van tucht aangaande een tegen een Accountant-Administratieconsulent gerezen bezwaar is op
      straffe van nietigheid met redenen omkleed en wordt in het openbaar uitgesproken.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel66
  - number: '66.2'
    text: |-
      De raad van tucht zendt van zijn beslissing onverwijld bij aangetekende brief afschrift aan de betrokken
      Accountant-Administratieconsulent, en, indien naar aanleiding van een klacht is beslist, aan de klager, alsmede aan
      het bestuur.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel66
  - number: '67.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de in de
      [artikelen 62 tot en met 66][ref1] geregelde rechtsgang.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel62
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '62'
        paragraaf: '4'
  - number: '67.2'
    text: |-
      Een voordracht tot vaststelling, wijziging of intrekking van een algemene maatregel van bestuur, als in het eerste
      lid bedoeld, wordt gedaan door Onze Ministers gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel67
  - number: '68.1'
    text: |-
      Tegen een beslissing van de raad van tucht aangaande een tegen een Accountant-Administratieconsulent gerezen
      bezwaar kan binnen twee maanden na de dag van verzending van de in [artikel 66, tweede lid][ref1], bedoelde
      aangetekende brief beroep worden ingesteld bij het College van Beroep voor het bedrijfsleven:


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel66
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '66'
        paragraaf: '4'
  - number: 68.1.a
    text: door de betrokken accountant, indien het bezwaar geheel of gedeeltelijk gegrond is verklaard;
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel68
  - number: 68.1.b
    text: door de klager, indien zijn bezwaar geheel of gedeeltelijk ongegrond is verklaard;
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel68
  - number: 68.1.c
    text: door het bestuur.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel68
  - number: '68.2'
    text: |-
      Het beroep wordt ingesteld bij met redenen omkleed beroepschrift, bij de griffier van het College in tweevoud
      of, indien het beroep door een klager is ingesteld, in drievoud in te dienen tezamen met een authentiek afschrift
      van de beslissing, waartegen het beroep is gericht. De griffier geeft van de instelling van het beroep onverwijld
      kennis aan de raad van tucht, alsmede, indien het beroep door een klager of door het bestuur is ingesteld, aan de
      betrokken accountant. Indien het beroep door de accountant is ingesteld in een procedure die bij de raad van tucht
      bij klacht of op verzoek van het bestuur is aanhangig gemaakt, geeft de griffier voorts van de instelling van het
      beroep onverwijld kennis aan de klager, respectievelijk aan het bestuur.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel68
  - number: '69'
    text: |-
      De raad van tucht doet binnen een en twintig dagen na ontvangst van de mededeling, bedoeld in
      [artikel 68, tweede lid][ref1], de stukken toekomen aan de griffier van het College van Beroep voor het
      bedrijfsleven.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel68
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '68'
        paragraaf: '5'
  - number: '70.1'
    text: |-
      Is het beroep kennelijk niet-ontvankelijk of ongegrond, dan kan, zonder dat een nader onderzoek door het College
      van Beroep voor het bedrijfsleven vereist is, de voorzitter bij met redenen omklede beschikking het beroep niet-
      ontvankelijk of ongegrond verklaren. De griffier zendt afschrift van de beschikking aan de raad van tucht, alsmede
      bij aangetekende brief aan de betrokken accountant en, indien de procedure bij de raad van tucht bij klacht is
      aanhangig gemaakt, aan de klager.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel70
  - number: '70.2'
    text: |-
      Tegen de beschikking, in het eerste lid bedoeld, kan degene, die het beroep heeft ingesteld, binnen veertien
      dagen na de verzending van de onderhavige brief, verzet doen bij het College. Het verzet wordt gedaan door een
      schriftelijke verklaring aan de griffier van het College.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel70
  - number: '70.3'
    text: |-
      Het College verklaart het verzet niet-ontvankelijk, gegrond of ongegrond. Indien het verzet gegrond wordt
      verklaard, vervalt de beschikking.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel70
  - number: '70.4'
    text: |-
      Is het College van oordeel, dat het beroep kennelijk niet-ontvankelijk of ongegrond is, dan kan het zonder nader
      onderzoek het verzet niet-ontvankelijk of ongegrond verklaren, echter niet dan na de betrokkene in de gelegenheid
      te hebben gesteld te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel70
  - number: '70.5'
    text: De beschikking van het College ter zake van het gedane verzet is met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel70
  - number: '70.6'
    text: |-
      De griffier brengt de beschikking van het College ter kennis van de betrokken accountant en de klager, alsmede van
      de raad van tucht.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel70
  - number: '71.1'
    text: |-
      Indien [artikel 70][ref1] geen toepassing vindt of het verzet gegrond is verklaard, bepaalt de voorzitter de dag
      voor de behandeling der zaak. De griffier brengt bij aangetekend schrijven de rechtsdag ter kennis van de betrokken
      accountant en de klager, respectievelijk het bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel70
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '70'
        paragraaf: '5'
  - number: '71.2'
    text: |-
      Voor de behandeling ter terechtzitting worden de processtukken in origineel of in door de griffier gewaarmerkte
      afschriften gedurende ten minste tien dagen ter griffie van het College van Beroep voor het bedrijfsleven,
      ter griffie van een rechtbank of elders ter kosteloze inzage voor de betrokken accountant en de klager of hun
      gemachtigden nedergelegd. Het tijdstip, waarop de gelegenheid tot inzage een aanvang zal nemen, wordt door de
      griffier tijdig tevoren ter kennis van bedoelde personen gebracht.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel71
  - number: '71.3'
    text: |-
      De in het tweede lid bedoelde termijn kan met toestemming van de accountant en de klager, respectievelijk het
      bestuur, worden verkort.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel71
  - number: '71.4'
    text: |-
      Is de termijn niet in acht genomen, dan bepaalt het College van Beroep voor het bedrijfsleven een nieuwe rechtsdag,
      tenzij de betrokken accountant en de klager, respectievelijk het bestuur, in persoon of bij gemachtigde zijn
      verschenen. In dit laatste geval kan op verzoek van elk hunner uitstel worden verleend.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel71
  - number: '71.5'
    text: |-
      In de gevallen, waarin op de terechtzitting de behandeling van de zaak voor een bepaalde tijd wordt uitgesteld of
      geschorst, wordt geen nieuwe kennisgeving gedaan.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel71
  - number: '72'
    text: |-
      Op het rechtsgeding voor het College van Beroep voor het bedrijfsleven zijn de [artikelen 63][ref1],
      [64, derde, vierde en vijfde lid][ref2], en [65][ref3] van overeenkomstig toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel64
      [ref3]: https://wetten.overheid.nl/BWBR0002856#Artikel65
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '63'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002856
        artikel: '64'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0002856
        artikel: '65'
        paragraaf: '4'
  - number: '73'
    text: |-
      Aan de betrokken accountant en de klager respectievelijk het bestuur of hun gemachtigden en aan de raadslieden
      wordt de gelegenheid gegeven het woord te voeren en de middelen van beroep toe te lichten.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel73
  - number: '74'
    text: |-
      Het College van Beroep voor het bedrijfsleven kan de raad van tucht, die de beslissing in aanleg heeft genomen,
      uitnodigen inlichtingen te geven.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel74
  - number: '75'
    text: |-
      Na de behandeling van de zaak ter terechtzitting bepaalt de voorzitter de dag voor de uitspraak. Het College van
      Beroep voor het bedrijfsleven kan ook terstond uitspraak doen.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel75
  - number: '76.1'
    text: |-
      Het College van Beroep voor het bedrijfsleven verklaart het beroep niet-ontvankelijk, verwerpt het of verklaart
      het gegrond.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel76
  - number: '76.2'
    text: |-
      Indien het College niet voldoende is ingelicht, kan het bevelen, dat de behandeling der zaak op een nader te
      bepalen datum zal worden hervat.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel76
  - number: '77'
    text: |-
      Indien het College van Beroep voor het bedrijfsleven het beroep gegrond verklaart, vernietigt het de beslissing van
      de raad van tucht; het doet alsdan de zaak zelf af of verwijst haar naar een der raden van tucht om haar af te doen
      met inachtneming van de beslissing van het College.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel77
  - number: '78.1'
    text: |-
      De uitspraak van het College van Beroep voor het bedrijfsleven houdt de gronden in en wijst de voorschriften aan,
      waarop zij rust.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel78
  - number: '78.2'
    text: |-
      De uitspraak wordt door de voorzitter van de kamer, die de uitspraak heeft gedaan, en de griffier ondertekend.
      Indien de voorzitter zich in de onmogelijkheid bevindt de uitspraak te ondertekenen, geschiedt zulks door het
      oudst benoemde gewone of plaatsvervangende lid, dat de uitspraak mede gewezen heeft. Indien de griffier zich in de
      onmogelijkheid bevindt, wordt daarvan instede van de ondertekening melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel78
  - number: '79.1'
    text: 'Het College van Beroep voor het bedrijfsleven zendt van zijn beslissing onverwijld afschrift:'
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel79
  - number: 79.1.a
    text: aan de betrokken accountant;
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel79
  - number: 79.1.b
    text: aan de klager, indien de beslissing betreft een bezwaar, dat op klacht in behandeling is genomen;
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel79
  - number: 79.1.c
    text: aan het bestuur;
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel79
  - number: 79.1.d
    text: aan de raad van tucht, die de zaak in eerste instantie heeft behandeld;
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel79
  - number: 79.1.e
    text: |-
      aan de raad van tucht, naar welke de zaak krachtens [artikel 77][ref1] is verwezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel77
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '77'
        paragraaf: '5'
  - number: '79.2'
    text: |-
      Het College kan in afwijking van het eerste lid, onder *b*, bij zijn beslissing bepalen, dat de klager kennis wordt
      gegeven uitsluitend van dat deel der beslissing, dat voor hem van belang is.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel79
  - number: 52_bis
    text: |-
      Tegen een op grond van deze wet genomen besluit kan een belanghebbende beroep instellen bij het College van Beroep
      voor het bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel52
  - number: 53_bis
    text: |-
      De opleiding tot Accountant-Administratieconsulent omvat bij algemene maatregel van bestuur vast te stellen
      vakgebieden die voor de bij of krachtens de wet vereiste controles van financiële verantwoordingen van belang zijn,
      en voldoet aan de in [artikel 56, eerste lid, onderdeel a][ref1], bedoelde eindtermen.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel56
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '56'
        paragraaf: '3'
  - number: 54_bis.1
    text: |-
      Gedurende ten minste drie jaar dient als onderdeel van de opleiding een praktijkstage te worden gevolgd waarvoor de
      NOvAA zorg draagt. De praktijkstage wordt afgesloten met een examen. Indien het examen met goed gevolg is afgelegd,
      geeft de NOvAA daarvan een getuigschrift af.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel54
  - number: 54_bis.2
    text: |-
      Bij verordening als bedoeld in [artikel 24][ref1] worden met betrekking tot de praktijkstage in elk geval geregeld:


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel24
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '24'
        paragraaf: '4'
  - number: 54_bis.2.a
    text: de toelatingseisen;
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel54
  - number: 54_bis.2.b
    text: |-
      de inhoud van het examen, de wijze waarop het examen wordt afgenomen en de personen die bevoegd zijn het examen af
      te nemen;
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel54
  - number: 54_bis.2.c
    text: de voorwaarden voor de toelating tot het afleggen van het examen;
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel54
  - number: 54_bis.2.d
    text: de voorwaarden voor het verkrijgen van vrijstelling van bepaalde onderdelen van het examen;
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel54
  - number: 54_bis.2.e
    text: de hoogte van de examengelden en te wiens laste deze komen.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel54
  - number: 54_bis.3
    text: De verordening, bedoeld in het tweede lid, behoeft de goedkeuring van Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel54
  - number: 55_bis
    text: |-
      Bij de beoordeling of aan de toelatingeisen voor de praktijkstage is voldaan, bepaalt de NOvAA aan de hand van de
      vastgestelde eindtermen, bedoeld in [artikel 56, eerste lid, onderdeel a][ref1], en de overgelegde getuigschriften
      van opleidingen of een aanvulling op de genoten opleiding noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel56
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '56'
        paragraaf: '3'
  - number: 56_bis.1
    text: |-
      De Commissie eindtermen accountantsopleiding, bedoeld in
      [artikel 69, eerste lid, van de Wet op de Registeraccountants][ref1], heeft tot taak:


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel69
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '69'
  - number: 56_bis.1.a
    text: het vaststellen van de eindtermen;
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel56
  - number: 56_bis.1.b
    text: |-
      het aanwijzen van opleidingen die geheel of gedeeltelijk voldoen aan de in onderdeel a bedoelde eindtermen, met
      uitzondering van de eindtermen die betrekking hebben op de praktijkstage, voor zover deze opleidingen niet zijn
      geaccrediteerd overeenkomstig artikel 5.10 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek;
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel56
  - number: 56_bis.1.c
    text: het toetsen van de praktijkstage aan de mate waarin wordt voldaan aan de eindtermen.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel56
  - number: 56_bis.2
    text: De vastgestelde eindtermen worden bekendgemaakt door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel56
  - number: 57_bis.1
    text: 'De Commissie eindtermen accountantsopleiding geeft een verklaring van vakbekwaamheid af aan degene die:'
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel57
  - number: 57_bis.1.a
    text: |-
      beschikt over een bewijsstuk waaruit blijkt dat hij voldoet aan de eisen van vakbekwaamheid die in een lidstaat
      van de Europese Gemeenschappen, anders dan Nederland, of in een andere Staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte, krachtens wettelijke regeling worden gesteld voor de toelating tot de
      controle van jaarrekeningen als bedoeld in artikel 1 van de Achtste [Richtlijn nr. 84/253/EEG](31984L0253) van de
      Raad van de Europese Gemeenschappen van 10 april 1984 op de grondslag van artikel 54, lid 3, sub g, van het Verdrag
      inzake de toelating van personen, belast met de controle van boekhoudbescheiden (PbEG L 126); of
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel57
  - number: 57_bis.1.b
    text: |-
      in andere gevallen dan bedoeld in het eerste onderdeel, beschikt over een in een ander land dan Nederland
      verkregen diploma of soortgelijk bewijsstuk, waaruit naar het oordeel van de Commissie eindtermen, bedoeld
      in [artikel 69, eerste lid, van de Wet op de Registeraccountants][ref1], eenzelfde niveau van vakbekwaamheid
      blijkt als die, welke blijkt uit het met goed gevolg hebben voltooid van de opleiding tot Accountant-
      Administratieconsulent; en


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel69
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '69'
  - number: 57_bis.1.c
    text: |-
      met goed gevolg een examen heeft afgelegd waarbij de kennis van de betrokkene van het Nederlandse recht wordt
      getoetst; en
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel57
  - number: 57_bis.1.d
    text: |-
      met goed gevolg een examen heeft afgelegd waarbij de kennis van de betrokkene van de voor de Accountants-
      Administratieconsulenten geldende gedrags- en beroepsregels wordt getoetst.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel57
  - number: 57_bis.2
    text: |-
      De inhoud van het examen, bedoeld in het eerste lid, onderdeel c, wordt geregeld bij algemene maatregel van
      bestuur. De inhoud van het examen, bedoeld in het eerste lid, onderdeel d, wordt vastgesteld bij verordening
      als bedoeld in [artikel 24][ref1]. De verordening, bedoeld in de vorige volzin, behoeft de goedkeuring van Onze
      Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel24
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel57
    references:
