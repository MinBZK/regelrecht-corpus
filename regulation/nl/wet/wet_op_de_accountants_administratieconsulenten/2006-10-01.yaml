  - number: '99.2'
    text: Van een krachtens het eerste lid vastgestelde beschikking wordt mededeling gedaan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0002856/2006-10-01#Artikel99
  - number: '100'
    text: 'Deze wet kan worden aangehaald als: Wet op de Accountants-Administratieconsulenten.'
