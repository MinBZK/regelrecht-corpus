  - number: 3.2.9
    text: |-
      De minister beslist afwijzend op een aanvraag tot subsidieverlening voor zover:

      a. de subsidieaanvrager niet voldoet aan de vereisten van artikel 31, derde lid, van [verordening 508/2014]
      (onbekend);

      b. de subsidiabele kosten, bedoeld in [artikel 3.2.5][ref1] minder dan € 10.000 bedragen;

      c. de subsidieaanvrager voorafgaand aan de subsidieaanvraag al volledig of gedeeltelijk eigenaar van een
      vissersvaartuig is of is geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel3.2.5
