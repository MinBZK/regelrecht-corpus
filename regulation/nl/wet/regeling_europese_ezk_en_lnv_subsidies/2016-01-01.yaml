        artikel: '2.4'
        hoofdstuk: '2'
  - number: 3.4.6
    text: |-
      De minister rangschikt een aanvraag voor een rendementsverbeteringsproject, waarop niet afwijzend is beslist, hoger
      naarmate deze:

      a. meer bijdraagt aan kostenbesparing, waardevermeerdering of het op elkaar aansluiten van vraag en aanbod (25%);

      b. een meer innovatief karakter heeft (25%);

      c. meer economisch of technisch perspectief heeft voor toepassing op praktijkschaal (20%);

      d. een groter uitstralingseffect heeft voor toepassing door andere ondernemingen (15%);

      e. een meer ecologisch duurzaam karakter heeft (10%);

      f. een breder aantal betrokkenen kent (5%).
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel3.4.6
  - number: 3.4.7
    text: |-
      Onverminderd de [artikelen 1.5][ref1] en [3.1.2][ref2], komen operationele kosten als bedoeld in artikel 25, tweede
      lid, van verordening 508/2014 niet voor subsidie in aanmerking.


