    text: |-
      De minister verdeelt het subsidieplafond voor rendementsverbeteringsprojecten op volgorde van rangschikking van de
      aanvragen als bedoeld in [artikel 2.4, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel2.4
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel3.4.5
    references:
