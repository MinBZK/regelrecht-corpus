        artikel: 4:89
      - id: ref3
        bwb_id: BWBR0005291
  - number: 4.1.10
    text: |-
      1 Een verzekeraar dient vóór 1 februari een aanvraag in bij de minister voor goedkeuring van de voorwaarden van
      een verzekering.

      2 De aanvraag, bedoeld in het eerste lid, gaat vergezeld van:

      a. een onderbouwing van de premie;

      b. een verklaring van de verzekeraar dat hij zijn administratie die betrekking heeft op de verzekeringsvoorwaarden,
      ten minste vier kalenderjaren na afloop van de verzekering ter beschikking houdt van de minister;

      c. het standaardmodel van de verzekeringspolis, en

      d. documenten waarin de verzekeraar ten genoegen van de minister aantoont dat de verzekeringsvoorwaarden voldoen
      aan het bepaalde in deze regeling.

      3 De minister beslist binnen een termijn van 22 weken op de aanvraag, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel4.1.10
  - number: 4.1.11
    text: |-
      1 De minister verleent uitsluitend goedkeuring aan de verzekeringsvoorwaarden indien:

      a. het financieel verlies van de landbouwer wordt gedekt:

      1°. voor zover dat meer is dan 30% van de gemiddelde jaarproductie in de laatste drie jaar of van de gemiddelde
      productie van drie van de laatste vijf jaar waarbij de hoogste en laagste productie van deze vijf jaar niet wordt
      meegerekend,

      2°. dat het gevolg is van een lagere opbrengst in kwantiteit of kwaliteit,

      3°. dat optreedt op een aaneengesloten stuk grond waarop één enkel gewas wordt geteeld, en

      4°. dat redelijkerwijs is toe te rekenen aan ongunstige weersomstandigheden als bedoeld in [artikel 4.1.13][ref1];

      b. alle open teelten verzekerd kunnen worden;

      c. geen eisen worden gesteld aan de aard of hoeveelheid van de toekomstige productie door de verzekerde;

      d. de voorwaarde wordt gesteld dat de schade wordt vastgesteld door een schade-expert;

      e. de verzekeraar niet tot uitkering overgaat voor zover de landbouwer van overheidswege een tegemoetkoming in de
      schade ontvangt die ertoe leidt dat hij meer compensatie ontvangt dan hij schade heeft geleden;

      f. slechts één keer tot uitkering wordt gekomen voor dezelfde gebeurtenis bij dezelfde teelt;

      g. de verzekering wordt aangegaan voor een periode van twaalf maanden;

      h. de verzekering geen dekking biedt voor:

      1°. genomen preventiemaatregelen, en

      2°. bereddingsmaatregelen die genomen zijn op grond van de verzekeringspolis of [artikel 7:957 BW][ref2], maar
      waarbij geen verlies als bedoeld in onderdeel a is opgetreden;

      i. de verzekeraar toestemming wordt verleend door de verzekerde om diens persoonsgegevens te verwerken ten behoeve
      van de controle op de naleving van deze regeling;

      j. de verzekeraar verklaart dat hij niet meer dan een keer dezelfde schade van de landbouwer verzekert;

      k. de verzekeraar verklaart dat hij alle ontvangen subsidiebedragen aanwendt om de premienota van de betreffende
      landbouwer overeenkomstig de voorwaarden van deze regeling te voldoen, en

      l. de verzekeraar verklaart dat de minister in kennis wordt gesteld van eventuele aanpassingen in de administratie
      van de verzekeraar, voor zover deze aanpassingen negatieve gevolgen hebben voor de betrouwbaarheid van de daarin
      verwerkte gegevens.

      2 De minister verleent de goedkeuring voor een periode van een jaar, en kan aan de goedkeuring nadere voorschriften
      verbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel4.1.13
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel957
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel4.1.11
    references:
      - id: ref1
        bwb_id: BWBR0036758
        artikel: 4.1.13
        hoofdstuk: '4'
        paragraaf: 4.1.2
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '957'
  - number: 4.1.12
    text: |-
      1 De goedkeuring, bedoeld in [artikel 4.1.11, eerste lid][ref1], kan op verzoek van de verzekeraar steeds voor een
      periode van een jaar worden verlengd.

      2 De minister stemt in met het verzoek tot verlenging van de goedkeuring indien de verzekeringsvoorwaarden
      ongewijzigd blijven dan wel sprake is van niet-essentiële wijzigingen.

      3 De verzekeraar dient vóór 1 december een verzoek tot verlenging van de goedkeuring in bij de minister en meldt
      daarbij de eventuele wijzigingen van de verzekeringsvoorwaarden.

      4 De minister beslist binnen 6 weken op het verzoek, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel4.1.11
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel4.1.12
    references:
      - id: ref1
        bwb_id: BWBR0036758
        artikel: 4.1.11
        hoofdstuk: '4'
        paragraaf: 4.1.2
  - number: 4.1.13
    text: |-
      1 Onder ongunstige weersomstandigheden worden in elk geval begrepen:

      a. weersomstandigheden die volgens een schade-expert of het Koninklijk Nederlands Meteorologisch Instituut met een
      natuurramp kunnen worden gelijkgesteld, en

      b. elk van de volgende weersomstandigheden:

      1°. regenval;

      2°. droogte;

      3°. (nacht)vorst;

      4°. sneeuw;

      5°. ijzel;

      6°. storm;

      7°. hagel, of

      8°. brand door blikseminslag.

      2 De weersomstandigheden, bedoeld in het eerste lid, worden geacht vooraf te zijn erkend door de minister als
      bedoeld in artikel 37, tweede lid, van [verordening 1305/2013](onbekend). De minister kan in aanvulling daarop, na
      overleg met de brancheorganisatie van verzekeraars, ook andere ongunstige weersomstandigheden erkennen.
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel4.1.13
  - number: 4.1.14
    text: |-
      1 In afwijking van [artikel 4.1.11, eerste lid, onderdeel a, onder 1°][ref1], mag een verzekering ook tot
      uitkering komen bij een financieel verlies van 30% of minder, mits de verzekeraar ten genoegen van de minister
      onderscheidt welk deel van de premie betrekking heeft op vergoeding van het financieel verlies van de landbouwer
      van 30% of minder. In dat geval heeft de steun slechts betrekking op het gedeelte van de premie dat ziet op
      verzekeringsvoorwaarden die in overeenstemming zijn met de bepalingen van deze regeling.

      2 Het onderscheid, bedoeld in het eerste lid, moet helder zijn omschreven in de verzekeringsvoorwaarden.

      3 In afwijking van [artikel 4.1.11, eerste lid, onderdeel g][ref2], mag een verzekering voor langer dan twaalf
      maanden worden aangegaan, mits de premie jaarlijks wordt betaald en de jaarlijkse premie betrekking heeft op de
      productie van een periode van twaalf maanden.

      4 De minister publiceert een lijst van de goedgekeurde verzekeringen op de website van de Rijksdienst voor
      Ondernemend Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel4.1.11
      [ref2]: https://wetten.overheid.nl/BWBR0036758#Artikel4.1.11
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel4.1.14
    references:
      - id: ref1
        bwb_id: BWBR0036758
        artikel: 4.1.11
        hoofdstuk: '4'
        paragraaf: 4.1.2
      - id: ref2
        bwb_id: BWBR0036758
        artikel: 4.1.11
        hoofdstuk: '4'
        paragraaf: 4.1.2
  - number: 4.1.15
    text: |-
      1 In afwijking van [artikel 4.1.11, eerste lid, onderdeel d][ref1], mag de schade worden vastgesteld op basis van
      een rekenmodel.

      2 Het rekenmodel wordt tezamen met de verzekeringsvoorwaarden goedgekeurd door de minister.

      3 De minister keurt het rekenmodel uitsluitend goed indien de verzekeraar aantoont dat de uitkomsten van het
      rekenmodel vergelijkbaar zijn met een schadebeoordeling door een schade-expert. Het rekenmodel bevat daartoe
      tenminste de noodzakelijke gegevens om de schade vast te kunnen stellen aan de hand van bedrijfsspecifieke gegevens
      van het landbouwbedrijf zoals het gewas en de grondsoort op perceelsniveau en de feitelijke weersomstandigheid die
      de schade veroorzaakt.

      4 De verzekeraar onderzoekt elk gebruik van het rekenmodel met behulp van een steekproef. De resultaten worden ter
      beschikking gehouden van de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel4.1.11
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel4.1.15
    references:
      - id: ref1
        bwb_id: BWBR0036758
        artikel: 4.1.11
        hoofdstuk: '4'
        paragraaf: 4.1.2
  - number: 4.1.16
    text: |-
      De minister geeft in voorkomende gevallen uitvoering aan artikel 54, eerste en derde lid, en artikel 56 van
      [verordening 1306/2013](onbekend).
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel4.1.16
  - number: 4.1.17
    text: De minister verricht de controles, bedoeld in artikel 59 van [verordening 1306/2013](onbekend).
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel4.1.17
  - number: 4.1.18
    text: |-
      1 De minister besluit tot het niet betalen dan wel de gehele of gedeeltelijke intrekking van de subsidie
      overeenkomstig artikel 63, eerste lid, van [verordening 1306/2013](onbekend).

      2 De minister stelt de sancties, bedoeld in artikel 63, tweede lid, van [verordening 1306/2013](onbekend), vast met
      inachtneming van artikel 64 van [verordening 1306/2013](onbekend).

      3 De minister geeft bij de uitvoering van de bevoegdheden, genoemd in het eerste en tweede lid, toepassing aan
      artikel 63 van [verordening 809/2014](onbekend).
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel4.1.18
  - number: 4.1.19
    text: Deze titel vervalt met ingang van 21 januari 2020.
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel4.1.19
  - number: 5.1.1
    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - *auditautoriteit:* door de minister als zodanig aangewezen autoriteit;
        - *certificeringsautoriteit:* door de minister als zodanig aangewezen autoriteit;
        - *financieringsinstrument:* financieringsinstrument als bedoeld in artikel 37, eerste lid, van [verordening
      1303/2013](onbekend);
        - *programmasubsidie:* subsidie die wordt verstrekt aan een autoriteit van een grensoverschrijdend programma ten
      behoeve van het financieren van projecten die binnen dat grensoverschrijdende programma vallen;
        - *verordening 1299/2013:* verordening (EU) nr. 1299/2013 van het Europees Parlement en de Raad van 17 december
      2013 betreffende specifieke bepalingen voor steun uit het Europees Fonds voor regionale ontwikkeling ter
      verwezenlijking van de doelstelling ‘Europese territoriale samenwerking’ (PbEU 2013, L347).
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel5.1.1
  - number: 5.1.2
    text: Dit hoofdstuk vervalt met ingang van 1 december 2019.
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel5.1.2
  - number: 5.2.1
    text: |-
      1 De managementautoriteit verstrekt subsidie voor activiteiten passend binnen het programma waarvoor de
      managementautoriteit is aangewezen.

      2 Een subsidie als bedoeld in het eerste lid kan worden verstrekt in de vorm van een bijdrage aan een
      financieringsinstrument.
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel5.2.1
  - number: 5.2.2
    text: |-
      1 De managementautoriteit stelt een subsidieplafond of twee of meer deelplafonds ter uitvoering van deze regeling
      vast, alsmede de wijze van verdeling van het beschikbare bedrag onder het desbetreffende plafond.

      2 De managementautoriteit kan een beschikbaar subsidiebedrag bestemmen voor een of meer financieringsinstrumenten.

      3 De managementautoriteit maakt de criteria, bedoeld in artikel 125, derde lid, van [verordening 1303/2013]
      (onbekend), die worden gehanteerd binnen de wijze van verdeling, bedoeld in het eerste lid, bekend.
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel5.2.2
  - number: 5.2.3
    text: |-
      Een aanvraag om subsidie wordt ingediend met gebruikmaking van een middel dat door de managementautoriteit
      beschikbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel5.2.3
  - number: 5.2.4
    text: |-
      1 De managementautoriteit geeft binnen 26 weken een beschikking op een aanvraag tot subsidieverlening.

      2 In het geval van de verdeling van een beschikbaar subsidiebedrag, als bedoeld in
      [artikel 5.2.6, onderdeel b][ref1], begint de termijn, bedoeld in het eerste lid, op de eerste dag na afloop van
      de aanvraagperiode.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel5.2.6
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel5.2.4
    references:
      - id: ref1
        bwb_id: BWBR0036758
        artikel: 5.2.6
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.2.5
    text: |-
      1 De managementautoriteit beslist afwijzend op een aanvraag indien:

      a. de totale subsidiabele kosten van het project minder bedragen dan € 200.000;

      b. het project niet voldoet aan deze regeling, de EFRO-verordeningen, of de wijze van verdeling van het beschikbare
      bedrag, bedoeld in [artikel 5.2.2, eerste lid][ref1];

      c. het project niet voldoende bijdraagt aan de verwezenlijking van de specifieke doelstellingen binnen het
      programma of het gedeelte van het programma waarvoor het deelplafond beschikbaar is gesteld;

      d. de aanvrager niet heeft voldaan aan enig wettelijk voorschrift voor het in behandeling nemen van de aanvraag op
      de uiterste datum van indiening in het geval van verdeling zoals bedoeld in [artikel 5.2.6, onderdeel b][ref2];

      e. de managementautoriteit door toewijzing niet zou voldoen aan een van de verplichtingen gesteld in artikel 125
      van [verordening 1303/2013](onbekend), of

      f. de aanvrager een ondernemer is tegen wie een bevel tot terugvordering uitstaat als bedoeld in artikel 1, vierde
      lid, onderdeel a, van Verordening (EU) 651/2014 van de Commissie van 17 juni 2014 waarbij bepaalde categorieën
      steun op grond van de artikelen 107 en 108 van het verdrag met de interne markt verenigbaar worden geacht (PbEU L
      2014, 187).

      2 De managementautoriteit kan geheel of gedeeltelijk afwijzend beslissen op een aanvraag indien blijkt dat de
      beoogde financiering door de overige financiers geheel of gedeeltelijk niet zal worden verleend.

      3 De managementautoriteit kan in afwijking van het eerste lid, aanhef en onderdeel a, bij de wijze van verdeling,
      bedoeld in [artikel 5.2.2, eerste lid][ref3], bepalen dat het eerste lid, onderdeel a, niet van toepassing is op
      subsidies voor het mkb.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel5.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0036758#Artikel5.2.6
      [ref3]: https://wetten.overheid.nl/BWBR0036758#Artikel5.2.2
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel5.2.5
    references:
      - id: ref1
        bwb_id: BWBR0036758
        artikel: 5.2.2
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0036758
        artikel: 5.2.6
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref3
        bwb_id: BWBR0036758
        artikel: 5.2.2
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.2.6
    text: |-
      Behoudens de bijdrage aan een financieringsinstrument, bedoeld in [artikel 5.2.2, tweede lid][ref1], verdeelt de
      managementautoriteit een beschikbaar subsidiebedrag

      a. op volgorde van ontvangst van de aanvragen, overeenkomstig [artikel 5.2.7][ref2] of

      b. op basis van rangschikking naar geschiktheid, overeenkomstig [artikel 5.2.8][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel5.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0036758#Artikel5.2.7
      [ref3]: https://wetten.overheid.nl/BWBR0036758#Artikel5.2.8
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel5.2.6
    references:
      - id: ref1
        bwb_id: BWBR0036758
        artikel: 5.2.2
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0036758
        artikel: 5.2.7
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref3
        bwb_id: BWBR0036758
        artikel: 5.2.8
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.2.7
    text: |-
      1 Volgens de volgorde van ontvangst, bedoeld in [artikel 5.2.6, onderdeel a][ref1], komt de eerst ontvangen
      aanvraag het eerst voor subsidie in aanmerking.

      2 Indien een aanvrager niet heeft voldaan aan enig wettelijk voorschrift voor het in behandeling nemen van de
      aanvraag en met toepassing van [artikel 4:5 van de Algemene wet bestuursrecht][ref2] de gelegenheid heeft gehad de
      aanvraag aan te vullen, geldt met betrekking tot de verdeling de dag waarop de aanvraag voldoet aan de wettelijke
      voorschriften als datum van ontvangst.

      3 Indien de managementautoriteit op de dag dat het subsidieplafond wordt bereikt meer dan één aanvraag ontvangt,
      stelt zij de onderlinge rangschikking van die aanvragen vast door middel van loting.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel5.2.6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel5.2.7
    references:
      - id: ref1
        bwb_id: BWBR0036758
        artikel: 5.2.6
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:5
  - number: 5.2.8
    text: |-
      1 Volgens de rangschikking naar geschiktheid, bedoeld in [artikel 5.2.6, onderdeel b][ref1], komt de hoogst
      gerangschikte aanvraag het eerst voor subsidie in aanmerking.

      2 Voor zover het subsidieplafond dreigt te worden overschreden, stelt de managementautoriteit de onderlinge
      rangschikking van die aanvragen die bij de beoordeling gelijk zijn gerangschikt vast door middel van loting.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel5.2.6
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel5.2.8
    references:
      - id: ref1
        bwb_id: BWBR0036758
        artikel: 5.2.6
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.2.9
    text: |-
      1 De subsidieontvanger voert het project uit overeenkomstig het projectplan waarop de subsidieverlening betrekking
      heeft en voltooit het uiterlijk op het bij de verlening bepaalde tijdstip.

      2 De in artikel 71, eerste lid, van [verordening 1303/2013](onbekend) bedoelde termijn van vijf jaar wordt in geval
      van het behoud van investeringen of van door het mkb gecreëerde werkgelegenheid, verkort tot drie jaar.
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel5.2.9
  - number: 5.2.10
    text: |-
      Een wijziging van een project waarvoor subsidie wordt verstrekt, betreffende

      a. de subsidieontvanger,

      b. de uit te voeren activiteiten of de te realiseren doelstellingen,

      c. de financiering van het project, of

      d. de planning of looptijd,

      behoeft de goedkeuring van de managementautoriteit.
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel5.2.10
  - number: 5.2.11
    text: |-
      De subsidieontvanger doet onverwijld schriftelijk melding aan de managementautoriteit zodra aannemelijk is dat

      a. de activiteiten waarvoor subsidie is verleend niet, niet tijdig of niet geheel zullen worden verricht, of

      b. niet, niet tijdig of niet geheel aan de aan de beschikking tot subsidieverlening verbonden verplichtingen zal
      worden voldaan.
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel5.2.11
  - number: 5.2.12
    text: |-
      De subsidieontvanger voert een administratie die zodanig is ingericht dat daaruit te allen tijde op eenvoudige
      en duidelijke wijze alle door hem gemaakte en betaalde kosten en de aan het project toe te rekenen opbrengsten
      kunnen worden afgelezen en gespecificeerd, met dien verstande dat ter zake van de kosten bedoeld in
      [artikel 1.4, eerste en tweede lid][ref1], een door middel van een inzichtelijke tijdschrijving controleerbare
      urenverantwoording per werknemer aanwezig dient te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel1.4
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel5.2.12
    references:
      - id: ref1
        bwb_id: BWBR0036758
        artikel: '1.4'
        hoofdstuk: '1'
  - number: 5.2.13
    text: |-
      1 De managementautoriteit kan verplichtingen verbinden aan de subsidie.

      2 De managementautoriteit verbindt zodanig verplichtingen aan de subsidie dat de subsidieontvanger aan de
      certificeringsautoriteit en de auditautoriteit de medewerking verleent die zij voor hun taakvervulling nodig
      hebben.
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel5.2.13
  - number: 5.2.14
    text: |-
      Een aanvraag om subsidievaststelling wordt ingediend met gebruikmaking van een middel dat door de
      managementautoriteit beschikbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel5.2.14
  - number: 5.2.15
    text: De managementautoriteit geeft binnen 26 weken een beschikking op een aanvraag tot subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel5.2.15
  - number: 5.3.1
    text: |-
      De minister verstrekt op aanvraag subsidie aan degene die een project tot stand brengt dat past in een programma en
      dat bijdraagt aan de realisatie van het Rijksbeleid op het gebied van innovatie of koolstofarme economie.
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel5.3.1
  - number: 5.3.2
    text: |-
      1 Het subsidieplafond voor subsidies als bedoeld in [artikel 5.3.1][ref1] is voor de gehele programmaperiode:

      a. voor het programma dat de provincies Groningen, Friesland en Drenthe beslaat: € 18.573.000;

      b. voor het programma dat de provincies Overijssel en Gelderland beslaat: € 17.991.000;

      c. voor het programma dat de provincies Limburg, Noord-Brabant en Zeeland beslaat: € 20.384.000;

      d. voor het programma dat de provincies Zuid-Holland, Noord-Holland, Utrecht en Flevoland beslaat: € 34.052.000.

      2 Het voor de cofinanciering beschikbare bedrag wordt in jaarlijkse tranches beschikbaar gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel5.3.1
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel5.3.2
    references:
      - id: ref1
        bwb_id: BWBR0036758
        artikel: 5.3.1
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.3.3
    text: |-
      De minister beslist afwijzend op een aanvraag om subsidie indien het project onvoldoende bijdraagt aan de
      realisatie van het in [artikel 5.3.1][ref1] bedoelde Rijksbeleid of de subsidieaanvrager niet in aanmerking komt
      voor subsidie op grond van [paragraaf 5.2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel5.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0036758#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel5.3.3
    references:
      - id: ref1
        bwb_id: BWBR0036758
        artikel: 5.3.1
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref2
        bwb_id: BWBR0036758
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.3.4
    text: |-
      In afwijking van [hoofdstuk 2][ref1], zijn de [artikelen 5.2.3 tot en met 5.2.15][ref2] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0036758#Artikel5.2.3
