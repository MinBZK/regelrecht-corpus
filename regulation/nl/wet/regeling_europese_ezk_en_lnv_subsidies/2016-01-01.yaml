articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *bevoegde autoriteit:* de minister of managementautoriteit;
        - *bruto jaarloon:* bruto jaarsalaris, inclusief een niet-prestatiegebonden eindejaarsuitkering of een beloning in
      de vorm van een dertiende maand, zijnde een vast bedrag of vastgesteld percentage van het salaris, dat werknemers
      als extra loon ontvangen, voor zover dit is geregeld in de geldende CAO of arbeidsovereenkomst, exclusief
      vakantiegeld, exclusief (overige) vergoedingen, bijzondere beloningen, winst- of prestatieafhankelijke uitkeringen
      en aanvullende werkgeverslasten;
        - *groep:* groep als bedoeld in [artikel 2:24b van het Burgerlijk Wetboek][ref1];
        - *laatste betaling:* laatste betaling door de bevoegde autoriteit aan de begunstigde van het bedrag of een deel
      van het bedrag, genoemd in de beschikking tot subsidievaststelling;
        - *managementautoriteit:* door de minister als zodanig aangewezen autoriteit;
        - *minister:* Minister van Economische Zaken;
        - *mkb:* midden- en kleinbedrijf als bedoeld in artikel 2, onderdeel 28, van [verordening 1303/2013](onbekend);
        - *netto-inkomsten:* netto-inkomsten als bedoeld in artikel 61, eerste lid, van [verordening 1303/2013](onbekend);
        - *onderneming:* iedere eenheid, ongeacht haar rechtsvorm of wijze van financiering, die een economische activiteit
      uitoefent;
        - *penvoerder:* de door de deelnemers aan het samenwerkingsverband aangewezen penvoerende persoon of organisatie;
        - *samenwerkingsverband:* verband dat geen rechtspersoonlijkheid bezit, bestaand uit ten minste twee niet in
      een groep verbonden deelnemers, dat is opgericht ten behoeve van de uitvoering van activiteiten, niet zijnde een
      vennootschap;
        - *subsidieontvanger:* begunstigde als bedoeld in artikel 2, onderdeel 10, van [verordening 1303/2013](onbekend);
        - *verordening 1301/2013:* verordening (EU) nr. 1301/2013 van het Europees Parlement en de Raad van 17 december
      2013 betreffende het Europees Fonds voor Regionale Ontwikkeling en specifieke bepalingen met betrekking tot de
      doelstelling ‘Investeren in groei en werkgelegenheid’, en tot intrekking van [Verordening (EG) nr. 1080/2006]
      (onbekend) (PbEU 2013, L347);
        - *verordening 1303/2013:* verordening (EU) nr. 1303/2013 van het Europees Parlement en de Raad van 17 december
      2013 houdende gemeenschappelijke bepalingen inzake het Europees Fonds voor regionale ontwikkeling, het Europees
      Sociaal Fonds, het Cohesiefonds, het Europees Landbouwfonds voor plattelandsontwikkeling en het Europees Fonds
      voor maritieme zaken en visserij en algemene bepalingen inzake het Europees Fonds voor regionale ontwikkeling, het
      Europees Sociaal Fonds, het Cohesiefonds en het Europees Fonds voor maritieme zaken en visserij, en tot intrekking
      van [Verordening (EG) nr. 1083/2006](onbekend) van de Raad (PbEU 2013, L347);
        - *verordening 1305/2013:* verordening (EU) nr. 1305/2013 van het Europees Parlement en de Raad van 17 december
      2013 inzake steun voor plattelandsontwikkeling (ELFPO) en tot intrekking van [Verordening (EG) nr. 1698/2005]
      (onbekend) van de Raad (PbEU 2013, L347);
        - *verordening 508/2014:* verordening (EU) nr. 508/2014 van het Europees Parlement en de Raad van 15 mei 2014
      inzake het Europees Fonds voor maritieme zaken en visserij en tot intrekking van de [Verordeningen (EG) nr.
      2328/2003](onbekend), [(EG) nr. 861/2006](onbekend), [(EG) nr. 1198/2006](onbekend) en [(EG) nr. 791/2007]
      (onbekend) van de Raad en Verordening (EU) [nr. 1255/2011](onbekend) van het Europees Parlement en de Raad (PbEU
      2014, L149).


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
