        artikel: 3.1.2
        hoofdstuk: '3'
  - number: 3.3.9
    text: |-
      1 De subsidie bedraagt 75 procent van de subsidiabele kosten.

      2 Indien de subsidie wordt aangevraagd door een samenwerkingsverband als bedoeld in
      [artikel 3.3.2, onderdeel c][ref1], bedraagt de subsidie 85 procent van de subsidiabele kosten.

      3 De subsidie bedraagt ten hoogste € 600 000 per aanlandplichtinnovatieproject.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel3.3.2
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel3.3.9
