  - number: 4.1.4
    text: |-
      1 De subsidie bedraagt 65% van de verzekeringspremie, exclusief belastingen.

      2 De subsidie betreft enkel de oppervlakte van de verzekerde percelen die via de verzamelaanvraag als zodanig zijn
      opgegeven.
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel4.1.4
  - number: 4.1.5
    text: |-
      Indien het subsidieplafond wordt overschreden, wordt het percentage, bedoeld in [artikel 4.1.4, eerste lid][ref1],
      evenredig verlaagd.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel4.1.4
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel4.1.5
