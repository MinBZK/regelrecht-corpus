    text: |-
      1 De subsidie bedraagt ten hoogste 25 procent van de subsidiabele kosten.

      2 De subsidie bedraagt ten hoogste € 75.000 per jonge visser.
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel3.2.7
  - number: 3.2.8
    text: |-
      1 De aanschaf van het vissersvaartuig vindt plaats na de datum van ontvangst van de subsidieaanvraag, bedoeld in
      [artikel 2.9][ref1], en binnen 6 maanden na de datum van subsidieverlening.

      2 De betaling en levering van het vissersvaartuig vindt plaats na de datum van ontvangst van de subsidieaanvraag,
      bedoeld in [artikel 2.9][ref2], en voor het indienen van de aanvraag tot subsidievaststelling, bedoeld in
