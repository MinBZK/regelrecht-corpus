  - number: '1.2'
    text: |-
      Onverminderd artikel 65, elfde lid, van [verordening 1303/2013](onbekend), wordt, indien reeds door een
      bestuursorgaan of de Europese Commissie subsidie is verstrekt voor de subsidiabele kosten of een deel daarvan,
      slechts een zodanig bedrag aan subsidie verstrekt dat het totale bedrag aan subsidies niet meer bedraagt dan het
      bedrag dat volgens de toepasselijke Europese verordeningen toegestaan is.
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel1.2
  - number: '1.3'
    text: |-
      Voor zover zij direct verbonden zijn met de uitvoering van de desbetreffende subsidiabele activiteit, komen als
      subsidiabele kosten in aanmerking:

      a. loonkosten en overheadkosten voor zover zij zijn berekend overeenkomstig [artikel 1.4, eerste lid][ref1];

      b. bijdragen in natura als bedoeld in artikel 69, eerste lid, van [verordening 1303/2013](onbekend);

      c. afschrijvingskosten als bedoeld in artikel 69, tweede lid, van [verordening 1303/2013](onbekend);

      d. andere kosten waarvoor een factuur of document met gelijkwaardige bewijskracht kan worden overlegd.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel1.4
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0036758
        artikel: '1.4'
        hoofdstuk: '1'
  - number: '1.4'
    text: |-
      1 Loonkosten worden berekend door het aantal aan het project of de investering bestede uren te vermenigvuldigen met
      een volgens één van de volgende methodieken berekend tarief:

      a. een per medewerker bepaald individueel uurtarief, berekend op basis van bruto jaarloon, vermeerderd met een
      opslag van 32% voor werkgeverslasten, waarna over dat bedrag 15% aan overheadkosten wordt berekend en dat bedrag
      vervolgens door 1.720 uur op basis van een 40-urige werkweek wordt gedeeld;

      b. een per medewerker bepaald individueel uurtarief, berekend op basis van bruto jaarloon, vermeerderd met een
      opslag van 32% voor werkgeverslasten, waarna over dat bedrag 15% aan overheadkosten wordt berekend en dat bedrag
      vervolgens door 1.720 uur op basis van een volledige werkweek wordt gedeeld;

      c. een door de minister goedgekeurde integrale kostensystematiek, bedoeld in
      [artikel 12, eerste lid, van het Kaderbesluit nationale EZ-subsidies][ref1], of

      d. een door de Europese Commissie goedgekeurde methodiek voor soortgelijke projecten en subsidieontvangers als
      bedoeld in artikel 67, vijfde lid, onderdeel b, van [verordening 1303/2013](onbekend).

      2 De kosten van de door een subsidieontvanger verrichte eigen arbeid als bedoeld in artikel 69, eerste lid,
      onderdeel e, van [verordening 1303/2013](onbekend) ten behoeve van het project of de investering worden, indien een
      berekening overeenkomstig het eerste lid niet mogelijk is, berekend door het aantal uren dat de betrokken persoon
      ten behoeve van het project of de investering heeft gemaakt te vermenigvuldigen met een vast uurtarief van € 39.

      3 In afwijking van het tweede lid wordt in geval van subsidies op grond van verordening 508/2014, een vast
      uurtarief van € 36 berekend.

      4 Indien subsidie wordt verleend in de vorm, bedoeld in artikel 67, eerste lid, onder c, van [verordening
      1303/2013](onbekend), is dit artikel niet van toepassing.

      5 Indien wordt gekozen voor de integrale kostensystematiek, zijn
      [artikel 12, derde lid, van het Kaderbesluit nationale EZ-subsidies][ref2] en
      [artikel 1.2, eerste lid, van de Regeling nationale EZ-subsidies][ref3], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0035474#Artikel1.2
