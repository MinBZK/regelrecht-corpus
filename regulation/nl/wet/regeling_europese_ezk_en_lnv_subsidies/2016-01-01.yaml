  - number: 4.1.6
    text: |-
      1 De minister beslist afwijzend op een aanvraag om subsidie indien:

      a. de aanvrager niet voldoet aan [artikel 4.1.2, derde lid][ref1];

      b. de aanvrager ofwel in het geval hij een volmacht heeft verleend als bedoeld in [artikel 4.1.9][ref2], het deel
      van de verzekeringspremie dat overeenkomt met de gehele verzekeringspremie verminderd met de aangevraagde subsidie
      op grond van deze regeling, ofwel indien de aanvrager geen volmacht heeft verleend als bedoeld in artikel 4.1.9, de
      volledige verzekeringspremie, niet vóór 1 november van het jaar van de aanvraag heeft betaald, of

      c. geen toestemming als bedoeld in [artikel 4.1.8, eerste lid, onder d en e][ref3], is gegeven.

      2 Indien de verstrekte subsidie lager is dan de aangevraagde subsidie als gevolg van een bij besluit van de
      minister vastgestelde verlaging van de subsidie, dient de landbouwer de met dit verschil overeenkomende premie vóór
      1 juli volgend op het jaar van de aanvraag aan de verzekeraar te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel4.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0036758#Artikel4.1.9
      [ref3]: https://wetten.overheid.nl/BWBR0036758#Artikel4.1.8
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel4.1.6
    references:
