  - number: 3.3.5
    text: |-
      De minister verdeelt de subsidieplafonds voor aanlandplichtinnovatieprojecten selectiviteit of
      aanlandplichtinnovatieprojecten overlevingskans op volgorde van rangschikking van de aanvragen als bedoeld in
      [artikel 2.4, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel2.4
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel3.3.5
    references:
      - id: ref1
        bwb_id: BWBR0036758
        artikel: '2.4'
        hoofdstuk: '2'
  - number: 3.3.6
    text: |-
      1 De minister rangschikt een aanvraag voor een aanlandplichtinnovatieproject selectiviteit, waarop niet afwijzend
      is beslist, hoger naarmate deze:

      a. een meer innovatief karakter heeft (10%);

      b. meer economisch of technisch perspectief heeft op toepassing op praktijkschaal (5%);

      c. een groter uitstralingseffect heeft voor toepassing door ondernemingen (5%);

      d. minder negatieve effecten heeft op de natuur (5%);

      e. meer bijdraagt aan de uitvoerbaarheid en naleefbaarheid voor vissers of visserijondernemingen van de
      aanlandplicht (35%);

      f. meer bijdraagt aan het vergroten van de selectiviteit van vismethoden (40%).

      2 De minister rangschikt een aanvraag voor een aanlandplichtinnovatieproject overlevingskans, waarop niet afwijzend
      is beslist, hoger naarmate deze:

      a. een meer innovatief karakter heeft (10%);

      b. meer economisch of technisch perspectief heeft op toepassing op praktijkschaal (5%);

      c. een groter uitstralingseffect heeft voor toepassing door ondernemingen (5%);

      d. minder negatieve effecten heeft op de natuur (5%);

      e. meer bijdraagt aan de uitvoerbaarheid en naleefbaarheid voor vissers of visserijondernemingen van de
      aanlandplicht (35%);

      f. meer bijdraagt aan het aantonen of verbeteren van de overlevingskans van vissoorten (40%).
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel3.3.6
  - number: 3.3.7
    text: |-
      1 Indien bij de rangschikking van de aanlandinnovatieprojecten blijkt dat één van de in artikel 39, vierde lid,
      van verordening 508/2014 vastgestelde maxima wordt overschreden, komen de aanlandplichtinnovatieprojecten die het
      hoogste zijn gerangschikt op grond van [artikel 3.3.6, eerste of tweede lid][ref1], als eerste in aanmerking voor
      subsidie totdat dit maximum is bereikt, en wordt subsidie aan de overige aanlandinnovatieprojecten die op basis van
      de rangschikking en de hoogte van het subsidieplafond in aanmerking zouden komen voor subsidie, verleend onder de
      opschortende voorwaarde van goedkeuring door de Europese Commissie.

      2 De overige gerangschikte aanlandplichtinnovatieprojecten worden afgewezen, maar komen alsnog voor subsidie in
      aanmerking indien:

      a. er budget beschikbaar komt doordat een of meerdere hoger gerangschikte aanlandinnovatieprojecten niet worden
      goedgekeurd door de Europese Commissie, en

      b. deze worden goedgekeurd door de Europese Commissie.

      3 De minister stelt de subsidieaanvrager zo spoedig mogelijk nadat het oordeel van de Europese Commissie bekend is
      op de hoogte van dit oordeel en eventuele gevolgen voor de eerder afgegeven beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel3.3.6
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel3.3.7
    references:
      - id: ref1
        bwb_id: BWBR0036758
        artikel: 3.3.6
        hoofdstuk: '3'
  - number: 3.3.8
    text: |-
      Onverminderd de [artikelen 1.5][ref1] en [3.1.2][ref2], komen operationele kosten als bedoeld in artikel 25, tweede
      lid, van verordening 508/2014 niet in aanmerking voor subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel1.5
      [ref2]: https://wetten.overheid.nl/BWBR0036758#Artikel3.1.2
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel3.3.8
