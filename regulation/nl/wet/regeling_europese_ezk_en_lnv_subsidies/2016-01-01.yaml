  - number: 3.1.7
    text: |-
      Indien subsidie wordt verstrekt aan een eigenaar van een vissersvaartuig als bedoeld in artikel 25
      van [verordening 508/2014](onbekend), wordt de beschikking tot subsidievaststelling onverminderd
      [artikel 4:49 van de Algemene wet bestuursrecht][ref1] ingetrokken of ten nadele van de subsidieontvanger gewijzigd
      indien het vissersvaartuig binnen vijf jaar te rekenen vanaf de datum van de laatste betaling naar buiten de
      Europese Unie wordt overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel449
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel3.1.7
