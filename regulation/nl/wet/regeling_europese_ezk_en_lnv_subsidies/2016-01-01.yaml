      die voor die datum zijn verleend.
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel3.4.14
  - number: 4.1.1
    text: |-
      In deze titel wordt verstaan onder:

        - *betaalorgaan:* betaalorgaan als bedoeld in artikel 7, eerste lid, van [verordening 1306/2013](onbekend);
        - *landbouwer:* actieve landbouwer als bedoeld in artikel 36, tweede lid, van [verordening 1305/2013](onbekend);
        - *open teelten:* open teelten van de sectoren akkerbouw, vollegrondsgroententeelt, bollenteelt, sierteelt,
      fruitteelt en boomkwekerij;
        - *premie:* premie, bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1];
        - *schade-expert:* deskundige die de gedragscode van expertiseorganisaties van het Verbond van Verzekeraars of een
      daarmee gelijk te stellen gedragscode in acht neemt;
        - *verzekeraar:* ** verzekeraar, bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref2];
        - *verzekering:* verzekering als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref3];
        - *verordening 1306/2013:* verordening (EU) nr. 1306/2013 van het Europees Parlement en de Raad van 17 december
      2013 inzake de financiering, het beheer en de monitoring van het gemeenschappelijk landbouwbeleid en tot intrekking
      van [Verordeningen (EEG) nr. 352/78](onbekend), [(EG) nr. 165/94](onbekend), [(EG) nr. 2799/98](onbekend), [(EG)
      nr. 814/2000](onbekend), [(EG) nr. 1290/2005](onbekend) en [(EG) nr. 485/2008](onbekend) van de Raad (PbEU L 347);
        - *verordening 809/2014:* verordening (EU) nr. 809/2014 van de Commissie van 17 juli 2014 tot vaststelling van
      uitvoeringsbepalingen voor Verordening (EU) nr. 1306/2013 van het Europees Parlement en de Raad wat betreft
      het geïntegreerd beheers- en controlesysteem, plattelandsontwikkelingsmaatregelen en de randvoorwaarden (PbEU
      L 227/69);
        - *verzekeringspolis:* bewijs van verzekering tussen landbouwer en verzekeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel11
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel4.1.1
    references:
