  - number: 3.2.3
    text: |-
      Onverminderd de [artikelen 2.9][ref1] en [3.1.4][ref2] bevat een aanvraag tot subsidieverlening:

      a. gegevens over het vissersvaartuig bedoeld in [artikel 3.2.2][ref3], waaronder de leeftijd van het
      vissersvaartuig, de lengte van het vissersvaartuig, in geval van zee- en kustvisserij het vlootsegment waartoe het
      vissersvaartuig behoort, de prijs van het vissersvaartuig, een uniek kenmerk van het vissersvaartuig en in geval
      van inschrijving in het kadaster, het visserijregister of het vlootregister het nummer hiervan;

      b. in afwijking van [artikel 3.1.4, onderdeel e][ref4], een taxatierapport van een onafhankelijke en deskundige
      taxateur van de marktwaarde van het vissersvaartuig en een offerte van het desbetreffende vissersvaartuig, of een
      offerte van het desbetreffende vaartuig en twee offertes van vergelijkbare vissersvaartuigen. Het taxatierapport of
      de offertes zijn ten hoogste drie maanden oud en geven ten minste inzicht in de waarde van het vissersvaartuig en
      de inventaris;

      c. bewijs van werkervaring of beroepsopleiding als bedoeld in artikel 31, derde lid, van [verordening 508/2014]
      (onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel2.9
      [ref2]: https://wetten.overheid.nl/BWBR0036758#Artikel3.1.4
      [ref3]: https://wetten.overheid.nl/BWBR0036758#Artikel3.2.2
      [ref4]: https://wetten.overheid.nl/BWBR0036758#Artikel3.1.4
