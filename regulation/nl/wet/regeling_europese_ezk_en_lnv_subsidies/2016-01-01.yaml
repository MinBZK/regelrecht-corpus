  - number: 3.1.3
    text: |-
      Onverminderd [artikel 2.11][ref1], beslist de minister afwijzend op een aanvraag tot subsidieverlening indien:

      a. de subsidieaanvrager niet ontvankelijk is voor steun ingevolge artikel 10 van [verordening 508/2014](onbekend);

      b. de activiteiten waarvoor subsidie wordt gevraagd niet subsidiabel zijn ingevolge artikel 11 van [verordening
      508/2014](onbekend);

      c. de subsidieaanvrager niet voldoet aan de verplichting tot het verstrekken van informatie, bedoeld in artikel 111
      van [verordening 508/2014](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel2.11
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel3.1.3
    references:
      - id: ref1
        bwb_id: BWBR0036758
        artikel: '2.11'
        hoofdstuk: '2'
  - number: 3.1.4
    text: |-
      Onverminderd [artikel 2.9][ref1] bevat een aanvraag tot subsidieverlening in ieder geval:

      a. het nummer waaronder de subsidieaanvrager geregistreerd is bij de Kamer van Koophandel of in het geval de
      subsidieaanvrager een natuurlijke persoon is, het burgerservicenummer;

      b. gegevens waaruit blijkt dat de subsidieaanvrager beschikt over voldoende financiële capaciteit als bedoeld
      in artikel 125, derde lid, onderdeel d, van [verordening 1303/2013](onbekend) om het project of de investering
      waarvoor subsidie wordt aangevraagd uit te kunnen voeren;

      c. een verklaring dat de subsidieaanvrager, indien hij een marktdeelnemer is als bedoeld in artikel 4, eerste lid,
      onderdeel 30, van [verordening 1380/2013](onbekend), voldoet aan artikel 10, eerste en derde lid, van [verordening
      508/2014](onbekend);

      d. gegevens ten behoeve van monitoring of evaluatie als bedoeld in artikel 111 van [verordening 508/2014]
      (onbekend);

      e. voor zover ten tijde van de aanvraag tot subsidieverlening bekend is dat de aanvrager een opdracht wil verlenen
      als bedoeld in [artikel 3.1.6, tweede lid][ref2], kopieën van opgevraagde offertes als bedoeld in artikel 3.1.6,
      tweede lid, en de relevante redenen voor een op basis van deze offertes genomen gunningsbeslissing;

      f. voor zover ten tijde van de aanvraag tot subsidieverlening bekend is dat een aanvrager een opdracht wil verlenen
      als bedoeld in [artikel 3.1.6, vierde lid][ref3], gegevens over de gevolgde procedure en de gunningsbeslissing,
      bedoeld in artikel 3.1.6, vijfde lid;

      g. een beschrijving van de communicatieactiviteiten, bedoeld in Bijlage V, paragraaf 3.1, tweede lid, onderdeel e,
      van verordening 508/2014 die de subsidieontvanger of het samenwerkingsverband wil gaan ondernemen.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel2.9
      [ref2]: https://wetten.overheid.nl/BWBR0036758#Artikel3.1.6
      [ref3]: https://wetten.overheid.nl/BWBR0036758#Artikel3.1.6
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel3.1.4
