      a. een wetenschappelijk of technisch rapport als bedoeld in [artikel 3.3.11, derde lid][ref3];

      b. een verklaring van de technische of wetenschappelijke organisatie dat de onderzoeksopzet aan wetenschappelijke
      standaarden voldoet die in het maatschappelijk verkeer als aanvaardbaar worden beschouwd en dat de resultaten
