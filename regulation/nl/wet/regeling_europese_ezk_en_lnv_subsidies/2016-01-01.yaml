        artikel: 4.1.2
        hoofdstuk: '4'
        paragraaf: 4.1.2
      - id: ref2
        bwb_id: BWBR0036758
        artikel: 4.1.9
        hoofdstuk: '4'
        paragraaf: 4.1.2
      - id: ref3
