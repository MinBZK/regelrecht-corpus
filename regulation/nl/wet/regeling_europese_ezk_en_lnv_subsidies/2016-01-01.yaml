    text: De minister verdeelt het subsidieplafond op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel3.2.4
  - number: 3.2.5
    text: |-
      1 Slechts de door de jonge visser gemaakte aanschafkosten van het vissersvaartuig als bedoeld in
      [artikel 3.2.2][ref1], komen voor subsidie in aanmerking.

      2 Al hetgeen volgens verkeersopvatting onderdeel van het vissersvaartuig uitmaakt, is deel van het vissersvaartuig
      en mag worden meegerekend bij de aanschafkosten.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel3.2.2
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel3.2.5
