  - number: 3.2.2
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een jonge visser voor een eerste aanschaf van een vissersvaartuig,
      of een deel daarvan, met een lengte over alles van minder dan 24 meter, dat:

      a. is uitgerust voor zeevisserij, kustvisserij of binnenvisserij;

      b. vijf tot dertig jaar oud is;

      c. behoort tot een vlootsegment waarvoor in het in artikel 22, tweede lid, van [verordening 1380/2013](onbekend)
      bedoelde verslag over de vangstcapaciteit een evenwicht met de voor dat segment beschikbare vangstmogelijkheden
      wordt aangetoond, en

      d. voor het indienen van de aanvraag tot subsidievaststelling als bedoeld in [artikel 2.19][ref1], in het
      visserijregister ingeschreven staat.

      2 In geval van aanschaf van een vissersvaartuig dat is uitgerust voor de binnenvisserij met uitzondering van het
      IJsselmeer:

      a. is het eerste lid, onderdelen c en d, niet van toepassing, en

      b. voldoet de jonge visser voor het indienen van de aanvraag tot subsidievaststelling
      als bedoeld in [artikel 2.20][ref2], aan de vereisten van [artikel 55][ref3] of
      [artikel 56 van de Uitvoeringsregeling visserij][ref4].

      3 In geval van aanschaf van een vissersvaartuig dat is uitgerust voor de binnenvisserij en dat wordt gebruikt om te
      vissen op het IJsselmeer:

      a. is het eerste lid, onderdeel c, niet van toepassing, en

      b. is de jonge visser voor het indienen van de aanvraag tot subsidievaststelling in het bezit van een vergunning
      als bedoeld in [artikel 8, eerste lid, van het Reglement voor de binnenvisserij 1985][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel2.19
      [ref2]: https://wetten.overheid.nl/BWBR0036758#Artikel2.20
      [ref3]: https://wetten.overheid.nl/BWBR0024539#Artikel55
      [ref4]: https://wetten.overheid.nl/BWBR0024539#Artikel56
      [ref5]: https://wetten.overheid.nl/BWBR0009027#Artikel8
