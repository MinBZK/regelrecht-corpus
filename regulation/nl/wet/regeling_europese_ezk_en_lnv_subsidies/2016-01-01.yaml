    text: |-
      In deze titel wordt verstaan onder:

        - *binnenvisserij:* binnenvisserij als bedoeld in
      [artikel 1, vierde lid, onderdeel d, van de Visserijwet 1963][ref1];
        - *jonge visser:* jonge visser als bedoeld in artikel 31, derde lid, eerste zin, van [verordening 508/2014]
      (onbekend);
        - *kustvisserij:* kustvisserij als bedoeld in [artikel 1, vierde lid, onderdeel c, van de Visserijwet 1963][ref2];
        - *visserijregister:* register als bedoeld in
      [artikel 1, onderdeel d, van het Besluit registratie vissersvaartuigen 1998][ref3];
        - *zeevisserij:* zeevisserij als bedoeld in [artikel 1, vierde lid, onderdeel b, van de Visserijwet 1963][ref4].


