  - number: 3.2.11
    text: Deze titel vervalt met ingang van 1 juli 2020.
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel3.2.11
  - number: 3.3.1
    text: |-
      In deze titel wordt verstaan onder:

        - *aanlandplicht:* aanlandingsplicht als bedoeld in artikel 15 van verordening 1380/2013;
        - *aanlandplichtinnovatieproject:* project dat a. tot doel heeft nieuwe technische of organisatorische kennis
      te ontwikkelen of te ontwikkelen en in te voeren; b. past binnen een van de doelen, bedoeld in artikel 39,
      eerste lid, van verordening 508/2014, en c. in het kader van de aanlandplicht gericht is op: 1°. verbeteren
      van de selectiviteit (aanlandplichtinnovatieproject selectiviteit), of 2°. het aantonen van en vergroten van de
      overlevingskans van vissoorten (aanlandplichtinnovatieproject overlevingskans);
        - *algemeen nut beogende instelling:* een instelling als bedoeld in
      [artikel 5b, eerste lid, van de Algemene wet inzake rijksbelastingen][ref1];
        - *visserijorganisatie:* een organisatie waarvan uit de doelstelling in de statuten blijkt dat zij het collectief
      belang van vissers of visserijondernemingen behartigt.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel5b
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel3.3.1
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 5b
  - number: 3.3.2
    text: |-
      De minister verstrekt op aanvraag subsidie voor de uitvoering van een aanlandplichtinnovatieproject aan:

      a. een visserijorganisatie;

      b. deelnemers in een samenwerkingsverband van visserijorganisaties, of

      c. deelnemers in een samenwerkingsverband van één of meer visserijorganisaties en één of meer algemeen nut beogende
      instellingen, gericht op de bescherming van de biologische rijkdommen van de zee.
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel3.3.2
  - number: 3.3.3
    text: |-
      Een aanlandplichtinnovatieproject wordt uitgevoerd met actieve betrokkenheid van een wetenschappelijke of
      technische organisatie, die de resultaten van het project en het wetenschappelijk of technisch rapport, bedoeld in
      [artikel 3.3.11, derde lid][ref1], valideert.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel3.3.11
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel3.3.3
    references:
      - id: ref1
        bwb_id: BWBR0036758
        artikel: 3.3.11
        hoofdstuk: '3'
  - number: 3.3.4
    text: |-
      Onverminderd de [artikelen 2.9][ref1] en [3.1.4][ref2], bevat een aanvraag tot subsidieverlening in ieder geval:

      a. gegevens waaruit blijkt hoe de actieve betrokkenheid, bedoeld in [artikel 3.3.3][ref3], van een technische of
      wetenschappelijke organisatie bij het aanlandplichtinnovatieproject geborgd zal worden;

      b. het nummer waaronder een vissersvaartuig dat wordt ingezet in het kader van een aanlandplichtinnovatieproject
      geregistreerd staat in het vlootregister, of indien dit niet mogelijk is, het maximum aantal vissersvaartuigen van
      de nationale vloot dat zal worden ingezet voor het project en het maximum brutotonnage van deze vissersvaartuigen;

      c. een raming van de te verwachten netto-inkomsten, bedoeld in artikel 39, zesde en zevende lid, van verordening
      508/2014;

      d. een kopie van de op het moment van de subsidieaanvraag geldende statuten, waaruit de doelstelling van de
      subsidieaanvrager blijkt;

      e. een verklaring van een wetenschappelijke of technische organisatie waaruit blijkt dat deze bereid is om de in
      [artikel 3.3.3][ref4] omschreven rol te vervullen, overeenkomstig de gegevens, bedoeld in onderdeel a.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel2.9
      [ref2]: https://wetten.overheid.nl/BWBR0036758#Artikel3.1.4
      [ref3]: https://wetten.overheid.nl/BWBR0036758#Artikel3.3.3
      [ref4]: https://wetten.overheid.nl/BWBR0036758#Artikel3.3.3
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel3.3.4
    references:
