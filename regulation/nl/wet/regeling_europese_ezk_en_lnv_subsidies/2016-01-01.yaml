      [ref3]: https://wetten.overheid.nl/BWBR0036758#Artikel3.4.3
      [ref4]: https://wetten.overheid.nl/BWBR0036758#Artikel3.4.3
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel3.4.4
