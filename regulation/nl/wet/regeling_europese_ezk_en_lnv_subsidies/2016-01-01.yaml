  - number: 5.4.1
    text: De minister verstrekt op aanvraag een programmasubsidie.
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel5.4.1
  - number: 5.4.2
    text: |-
      1 Het subsidieplafond voor subsidies als bedoeld in [artikel 5.4.1][ref1] is voor de gehele programmaperiode:

      a. voor het programma dat de provincies Groningen, Friesland, Drenthe, Overijssel, Flevoland, Gelderland en
      de COROP-gebieden Noordoost-Noord-Brabant, Zuidoost-Noord Brabant, Noord-Limburg, Midden-Limburg alsmede de in
      aanmerking komende Duitse gebieden beslaat: € 22.300.000;

      b. voor het programma dat de provincies Zeeland, Noord-Brabant, Limburg alsmede de in aanmerking komende Vlaamse
      gebieden beslaat: € 14.900.000;

      c. voor het programma dat de provincie Zeeland en de COROP-gebieden Kop van Noord-Holland, Alkmaar en omgeving,
      IJmond, Agglomeratie Haarlem, Agglomeratie ’s-Gravenhage, Delft en Westland, Agglomeratie Leiden en Bollenstreek,
      Groot-Rijnmond, Zuidoost-Zuid-Holland, West-Noord-Brabant alsmede de in aanmerking komende Engelse, Belgische en
      Franse gebieden beslaat: € 8.200.000, en

      d. voor het programma dat de COROP-gebieden Midden-Limburg, Zuid-Limburg, Zuidoost-Noord Brabant alsmede de in
      aanmerking komende Belgische en Duitse gebieden beslaat: € 3.600.000.

      2 De minister verleent eenmaal per jaar een voorschot.

      3 Rentebaten over een voorschot worden op dezelfde wijze besteed als de programmasubsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel5.4.1
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel5.4.2
    references:
      - id: ref1
        bwb_id: BWBR0036758
        artikel: 5.4.1
        hoofdstuk: '5'
        paragraaf: '4'
  - number: 5.4.3
    text: |-
      1 De ontvanger van een programmasubsidie financiert geen projecten ten laste van de programmasubsidie zonder
      voorafgaande schriftelijke instemming van de minister.

      2 De minister onthoudt de instemming, bedoeld in het eerste lid, indien:

      a. het project niet voldoet aan [verordening 1303/2013](onbekend), [verordening 1301/2013](onbekend), [verordening
      1299/2013](onbekend) of deze regeling, of

      b. de beoogde financiering door de overige financiers niet of niet volledig is aangevraagd, dan wel niet of niet
      volledig zal worden verleend.

      3 In aanvulling op het tweede lid onthoudt de minister de instemming indien het project niet in voldoende mate
      bijdraagt aan tenminste vier van de volgende aspecten:

      a. de ontwikkeling van nieuwe kennis of innovatie dan wel de toepassing van kennis in nieuwe projecten, diensten,
      organisatievormen, processen, markten of combinaties hiervan;

      b. verbeteren van de aansluiting tussen onderwijs en arbeidsmarkt of arbeidsmobiliteit;

      c. bijdragen aan het realiseren van een koolstofarme economie;

      d. efficiënt omgaan met grondstoffen;

      e. economische structuurversterking binnen economische sectoren of in het programmagebied;

      f. de deelname van of een brede en intensieve samenwerking met een relevant consortium;

      g. aannemelijkheid van marktperspectief of kansen op een vervolg;

      h. de realisatie van Rijksbeleid op het gebied van innovatie, koolstofarme economie, efficiënt omgaan met
      grondstoffen of verbeteren van de aansluiting tussen onderwijs en arbeidsmarkt;

      i. een kruising tussen prioritaire sectoren of een kruising tussen een prioritaire sector en één van de volgende
      sector overstijgende thema’s:

      1°. nanotechnologie;

      2°. ICT;

      3°. circulaire economie, of

      4°. Slimme industrie.

      4 Het derde lid is niet van toepassing op projecten in de prioriteit Technische Bijstand.
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel5.4.3
  - number: '6.2'
    text: |-
      1 Het recht zoals dat luidde voor 1 juli 2015, blijft van toepassing op:

      a. aanvragen tot subsidieverlening die voor die datum zijn ingediend op grond
      van de [Uitvoeringsregeling EFRO programmaperiode 2014–2020][ref1] of de
      [Regeling Subsidiëring brede weersverzekering][ref2];

      b. subsidies die voor die datum zijn verleend op grond van de
      [Uitvoeringsregeling EFRO programmaperiode 2014–2020][ref3] of de
