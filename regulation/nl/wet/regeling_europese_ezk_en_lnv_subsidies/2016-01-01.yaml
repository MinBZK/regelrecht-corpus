        artikel: '2.9'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0036758
        artikel: 3.3.7
        hoofdstuk: '3'
  - number: 3.3.11
    text: |-
      1 De subsidieontvanger of het samenwerkingsverband zet niet meer vissersvaartuigen in en overschrijdt niet de
      bruttotonnage, zoals aangegeven bij de aanvraag op grond van [artikel 3.3.4, onderdeel b][ref1].

      2 De subsidieontvanger of het samenwerkingsverband zorgt dat de onderzoeksopzet die aan het
      aanlandplichtinnovatieproject ten grondslag ligt, voldoet aan de algemeen aanvaarde wetenschappelijke standaarden
      en dat de resultaten voldoende wetenschappelijk worden onderbouwd.

      3 De subsidieontvanger of het samenwerkingsverband stelt een wetenschappelijk of technisch rapport op of laat deze
      opstellen door de technische of wetenschappelijke organisatie, waarin de onderzoeksopzet, de resultaten van het
      aanlandplichtinnovatieproject en de bijdrage van de technische of wetenschappelijke organisatie aan het project
      wordt beschreven.

      4 De subsidieontvanger of het samenwerkingsverband, dan wel een van de deelnemers aan een samenwerkingsverband,
      stelt het wetenschappelijk of technisch rapport, bedoeld in het derde lid, gelijktijdig met het indienen van de
      aanvraag tot subsidievaststelling, gedurende een periode van drie jaar, beschikbaar op zijn website.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel3.3.4
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel3.3.11
