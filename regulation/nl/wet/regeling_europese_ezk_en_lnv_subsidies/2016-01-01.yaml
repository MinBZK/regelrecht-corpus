        artikel: 4.1.8
        hoofdstuk: '4'
        paragraaf: 4.1.2
  - number: 4.1.7
    text: |-
      De minister beslist op een aanvraag om subsidieverlening uiterlijk 15 mei van het jaar volgend op het jaar van
      de aanvraag.
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel4.1.7
  - number: 4.1.8
    text: |-
      De aanvrager verstrekt de volgende gegevens aan de minister:

      a. het polisnummer van de verzekering;

      b. een kopie van de verzekeringspolis;

      c. een bewijs van betaling van het deel van de verzekeringspremie, bedoeld in
      [artikel 4.1.6, eerste lid, onderdeel b, en tweede lid][ref1];

      d. toestemming aan de minister om persoonsgegevens te verwerken ten behoeve van de controle op de naleving van
      deze regeling;

      e. toestemming aan de minister om perceelsgegevens uit te wisselen met de verzekeraar ten behoeve van de controle
      op de naleving van deze regeling;

      f. een verklaring dat hij zich bewust is van alle voorwaarden voor verkrijging van deze subsidie;

      g. de naam van de verzekeraar met wie de verzekering is afgesloten, en

      h. een verklaring dat hij zich niet meer dan één keer verzekert voor dezelfde schade.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel4.1.6
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel4.1.8
    references:
      - id: ref1
        bwb_id: BWBR0036758
        artikel: 4.1.6
        hoofdstuk: '4'
        paragraaf: 4.1.2
  - number: 4.1.9
    text: |-
      1 De betaling van de subsidie, bedoeld in [artikel 4.1.2][ref1], geschiedt overeenkomstig
      [artikel 4:89, vierde lid, van de Algemene wet bestuursrecht][ref2] en overeenkomstig een door de aanvrager daartoe
      verstrekte volmacht als bedoeld in [titel 3 van Boek 3 van het Burgerlijk Wetboek][ref3], aan de verzekeraar met
      wie de landbouwer de verzekering heeft gesloten.

      2 Bij gebreke van een volmacht als bedoeld in het eerste lid vindt betaling plaats door bijschrijving op een door
      de aanvrager opgegeven bankrekening.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel4.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel489
      [ref3]: https://wetten.overheid.nl/BWBR0005291
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel4.1.9
    references:
      - id: ref1
        bwb_id: BWBR0036758
        artikel: 4.1.2
