  - number: 3.2.6
    text: |-
      Onverminderd de [artikelen 1.5][ref1] en [3.1.2][ref2], komen de volgende kosten niet in aanmerking voor subsidie:

      a. netten;

      b. vangstrechten zoals contingenten of vergunningen;

      c. financieringskosten;

      d. huurkoop;

      e. kosten van het taxatierapport of de offertes als bedoeld in [artikel 3.2.3][ref3];

      f. operationele kosten als bedoeld in artikel 25, tweede lid, van [verordening 508/2014](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel1.5
      [ref2]: https://wetten.overheid.nl/BWBR0036758#Artikel3.1.2
