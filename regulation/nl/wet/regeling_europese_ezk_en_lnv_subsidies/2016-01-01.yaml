  - number: '2.15'
    text: |-
      1 De subsidieontvanger of de penvoerder doet onverwijld schriftelijk mededeling aan de minister van de
      indiening bij de rechtbank van een verzoek tot het op hem respectievelijk op een van de deelnemers van het
      samenwerkingsverband van toepassing verklaren van de schuldsaneringsregeling natuurlijke personen, tot verlening
      van surseance van betaling aan hem respectievelijk aan een van de deelnemers van het samenwerkingsverband, of tot
      faillietverklaring van hem respectievelijk van een van de deelnemers van het samenwerkingsverband.

      2 De subsidieontvanger of penvoerder doet onverwijld schriftelijk mededeling aan de minister zodra aannemelijk
      is dat:

      a. de subsidiabele activiteiten niet, niet tijdig of niet geheel zullen worden verricht, of

      b. niet, niet tijdig of niet geheel aan de aan de subsidie verbonden verplichtingen zal worden voldaan.
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel2.15
  - number: '2.16'
    text: |-
      1 Aan de beschikking tot subsidieverlening is, in geval deze betrekking heeft op een projectplan, de verplichting
      verbonden om de activiteiten overeenkomstig dit plan uit te voeren.

      2 De subsidieontvanger meldt aan de minister indien de subsidiabele kosten zoals opgenomen in de mijlpalen in het
      projectplan of, indien er geen mijlpalenplanning is, in het desbetreffende kalenderjaar meer dan 25% afwijken van
      de begroting.

      3 De minister kan voor het vertragen of het essentieel wijzigen van de wijze van uitvoering van de activiteiten
      op voorafgaand verzoek van de subsidieontvanger ontheffing verlenen van de verplichting, bedoeld in het eerste
      lid, tenzij hierdoor afbreuk wordt gedaan aan de activiteit waarvoor subsidie is verleend, de doelstelling van de
      subsidie of de voorwaarden van de subsidieverstrekking. Aan de ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel2.16
  - number: '2.17'
    text: |-
      1 De subsidieontvanger of penvoerder voert een zodanige administratie dat daaruit te allen tijde op eenvoudige en
      duidelijke wijze is af te leiden:

      a. de aard, inhoud en voortgang van de verrichte activiteiten;

      b. het aantal eenheden dat per kostendrager is besteed aan activiteiten die voor subsidie in aanmerking komen;

      c. in geval loonkosten of eigen arbeid subsidiabel zijn, het aantal uren dat per persoon is besteed aan
      activiteiten die voor subsidie in aanmerking komen;

      d. indien een tarief als bedoeld in [artikel 1,4, eerste lid][ref1], wordt gehanteerd, de berekening en
      samenstelling van het tarief;

      e. de specifiek ten behoeve van de activiteiten gemaakte en betaalde kosten.

      2 De administratie wordt ten minste zeven jaar na de datum van de laatste betaling bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel1.4
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0036758
        artikel: '1.4'
        hoofdstuk: '1'
  - number: '2.18'
    text: |-
      1 Indien de periode van uitvoering van een project dat voor subsidie in aanmerking komt meer dan twaalf maanden in
      beslag neemt, wordt bij de beschikking tot subsidieverlening de verplichting opgelegd tot indiening van één of meer
      rapportages waarin de voortgang van het project wordt beschreven, waarbij rekening wordt gehouden met de mijlpalen
      van het project.

      2 Indien subsidieontvangers samenwerken in een samenwerkingsverband, kan de penvoerder hun rapportages indienen.
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel2.18
  - number: '2.19'
    text: |-
      1 Indien subsidie wordt verstrekt voor een investering als bedoeld in artikel 71, eerste lid,
      van [verordening 1303/2013](onbekend), wordt de beschikking tot subsidievaststelling onverminderd
      [artikel 4:49 van de Algemene wet bestuursrecht][ref1] ingetrokken of ten nadele van de subsidieontvanger gewijzigd
      indien de investering gedurende vijf jaar te rekenen vanaf de datum van de laatste betaling een belangrijke
      wijziging ondergaat die:

      a. het gevolg is van de beëindiging of verplaatsing van productiecapaciteit als bedoeld in artikel 71, eerste lid,
      onderdeel a, van [verordening 1303/2013](onbekend);

      b. het gevolg is van een verandering in de aard van de eigendom van een infrastructuurvoorziening waardoor een
      onderneming of overheidsinstantie onrechtmatig voordeel behaalt, als bedoeld in artikel 71, eerste lid, onderdeel
      b, van [verordening 1303/2013](onbekend), of

      c. een substantiële verandering is als bedoeld in artikel 71, eerste lid, onderdeel c, van [verordening 1303/2013]
      (onbekend) of de bij deze regeling opgelegde uitvoeringsvoorwaarden raakt.

      2 Indien subsidie wordt verstrekt voor een investering als bedoeld in artikel 71, tweede lid,
      van [verordening 1303/2013](onbekend), wordt de beschikking tot subsidievaststelling onverminderd
      [artikel 4:49 van de Algemene wet bestuursrecht][ref2] ingetrokken of ten nadele van de subsidieontvanger gewijzigd
      indien de investering binnen tien jaar na de laatste betaling wordt verplaatst naar een locatie buiten de Europese
      Unie.

      3 Het tweede lid is niet van toepassing op het mkb.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel449
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel449
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:49
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:49
  - number: '2.20'
    text: |-
      1 De subsidieontvanger dient zijn aanvraag tot subsidievaststelling in binnen dertien weken na het tijdstip waarop
      de activiteiten moeten zijn voltooid.

      2 De aanvraag wordt ingediend met gebruikmaking van een middel dat door de minister beschikbaar wordt gesteld.

      3 Bij een aanvraag tot subsidievaststelling wordt in voorkomend geval mededeling gedaan van andere inkomsten,
      waaronder subsidies, waarmee de activiteit waarop de subsidie betrekking heeft is gefinancierd.

      4 De aanvraag tot subsidievaststelling bevat in ieder geval:

      a. gegevens over de subsidieontvanger, waaronder naam, adres en het door de minister toegekende referentienummer;

      b. gegevens over de hoogte van de gemaakte en betaalde subsidiabele kosten;

      c. voor zover van toepassing gegevens over netto-inkomsten als bedoeld in artikel 61 van [verordening 1303/2013]
      (onbekend).

      5 Een aanvraag tot vaststelling van een subsidie voor de uitvoering van een project gaat vergezeld van een
      eindverslag. Het eindverslag bevat ten minste:

      a. een beschrijving van de activiteiten die in het kader van het project zijn verricht;

      b. een evaluatie van de mate waarin de activiteiten hebben bijgedragen aan de doelstellingen, omschreven in het
      projectplan dat onderdeel vormt van de beschikking tot subsidieverlening;

      c. de kennis en informatie die met het project zijn opgedaan, en

      d. de wijze waarop de kennis en informatie, bedoeld in onderdeel c, openbaar is of zal worden gemaakt, indien in
      deze regeling is bepaald dat openbaarmaking plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel2.20
  - number: '2.21'
    text: |-
      Indien subsidieontvangers samenwerken in een samenwerkingsverband, dient de penvoerder hun aanvraag tot
      subsidievaststelling in.
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel2.21
  - number: '2.22'
    text: |-
      1 De minister geeft de beschikking tot subsidievaststelling binnen dertien weken na ontvangst van de aanvraag
      daartoe dan wel nadat de voor het indienen ervan geldende termijn is verstreken.

      2 Indien subsidieontvangers samenwerken in een samenwerkingsverband, verzendt de minister de beschikkingen tot
      subsidievaststelling aan de penvoerder
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel2.22
  - number: 3.1.1
    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - *marktdeelnemer:* marktdeelnemer als bedoeld in artikel 4, eerste lid, onderdeel 30, van verordening 1380/2013;
        - *producentenorganisatie voor visserijproducten:* producentenorganisatie voor visserijproducten als bedoeld in
      artikel 6, eerste lid, van verordening 1379/2013;
        - *verordening 1379/2013:* Verordening (EU) nr. 1379/2013 van het Europees Parlement en de Raad van 11 december
      2013 houdende een gemeenschappelijke marktordening voor visserijproducten en aquacultuurproducten, tot wijziging
      van Verordeningen (EG) nr. 1184/2006 en (EG) nr. 1224/2009 van de Raad en tot intrekking van Verordening (EG) nr.
      104/2000 van de Raad (PbEU 2013, L 354);
        - *verordening 1380/2013:* verordening (EU) nr. 1380/2013 van het Europees Parlement en de Raad van 11 december
      2013 inzake het gemeenschappelijk visserijbeleid, tot wijziging van [Verordeningen (EG) nr. 1954/2003](onbekend)
      en [(EG) nr. 1224/2009](onbekend) van de Raad en tot intrekking van Verordeningen [(EG) nr. 2371/2002](onbekend) en
      [(EG) nr. 639/2004](onbekend) van de Raad en Besluit [2004/585/EG](onbekend) van de Raad (PbEU 2013, L 354);
        - *verordening 763/2014:* Uitvoeringsverordening (EU) nr. 763/2014 van de Commissie van 11 juli 2014 houdende
      uitvoeringsbepalingen voor Verordening (EU) nr. 508/2014 van het Europees Parlement en de Raad inzake het
      Europees Fonds voor maritieme zaken en visserij met betrekking tot de technische kenmerken van voorlichtings- en
      publiciteitsmaatregelen en instructies over de vormgeving van het embleem van de Unie;
        - *visser:* natuurlijk persoon die zich bezighoudt met visserijactiviteiten en zijn hoofdberoep uitoefent aan boord
      van een vissersvaartuig dat in bedrijf is;
        - *visserijactiviteit:* visserijactiviteit als bedoeld in artikel 4, eerste lid, onderdeel 28, van verordening
      1380/2013;
        - *visserijonderneming:* onderneming die zich bezighoudt met visserijactiviteiten;
        - *vissersvaartuig:* vissersvaartuig als bedoeld in artikel 4, eerste lid, onderdeel 4, van [verordening 1380/2013]
      (onbekend);
        - *vlootregister:* register als bedoeld in artikel 24 van [verordening 1380/2013](onbekend);
        - *wetenschappelijke of technische organisatie:* a. onder a en b van de [bijlage van de Wet op het hoger onderwijs
      en wetenschappelijk onderzoek](onbekend) genoemde instelling voor hoger onderwijs; b. andere dan onder a bedoelde
      geheel of gedeeltelijk, meerjarig door de overheid gefinancierde onderzoeksorganisatie zonder winstoogmerk die
      activiteiten verricht met als doel de algemene wetenschappelijke of technische kennis uit te breiden; c. geheel of
      gedeeltelijk, meerjarig door een andere lidstaat van de Europese Unie gefinancierde: 1°. openbare instelling voor
      hoger onderwijs gelijkwaardig aan een instelling als bedoeld onder a, 2°. onderzoeksorganisatie zonder winstoogmerk
      die activiteiten verricht met als doel de algemene wetenschappelijke en technische kennis uit te breiden; d.
      rechtspersoon ten aanzien waarvan een instelling als bedoeld onder a, b of c direct of indirect: 1°. meer dan de
      helft van het geplaatste kapitaal verschaft, 2°. volledig aansprakelijk vennoot is, of 3°. overwegende zeggenschap
      heeft; e. onderzoeksorganisatie zonder winstoogmerk met eigen medewerkers in loondienst, die tot doel heeft
      via het structureel doen van eigen onderzoek en het ontwikkelen en testen van technische toepassingen door haar
      medewerkers, de technologische kennis op een specifiek terrein te bevorderen, die geen instelling is als bedoeld
      onder a tot en met d.
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel3.1.1
  - number: 3.1.2
    text: |-
      Onverminderd [artikel 1.5][ref1], komen de kosten van de activiteiten bedoeld in artikel 11 van [verordening
      508/2014](onbekend) niet voor subsidie in aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel1.5
