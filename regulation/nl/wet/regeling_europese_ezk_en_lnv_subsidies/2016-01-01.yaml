    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel3.3.17
  - number: 3.4.1
    text: |-
      In deze titel wordt verstaan onder een rendementsverbeteringsproject, een project dat:

      a. tot doel heeft kennis te ontwikkelen of te ontwikkelen en in te voeren, gericht op het verbeteren van
      rendementen in de visserij, door middel van:

      1°. kostenbesparing;

      2°. waardevermeerdering, of

      3°. het beter op elkaar aansluiten van vraag en aanbod, en

      b. past binnen een van de doelen, bedoeld in artikel 26, eerste lid, van verordening 508/2014.
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel3.4.1
  - number: 3.4.2
    text: |-
      De minister verstrekt op aanvraag subsidie voor de uitvoering van een rendementsverbeteringsproject aan:

      a. een producentenorganisatie voor visserijproducten;

      b. deelnemers in een samenwerkingsverband van visserijondernemingen of producentenorganisaties voor
      visserijproducten;

      c. deelnemers in een samenwerkingsverband van één of meer visserijondernemingen en één of meer
      producentenorganisaties voor visserijproducten, of

      d. deelnemers in een samenwerkingsverband van minstens één visserijonderneming of producentenorganisatie voor
      visserijproducten en één of meer marktdeelnemers uit de visserijsector, die niet als visserijonderneming kunnen
      worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel3.4.2
  - number: 3.4.3
    text: |-
      Een rendementsverbeteringsproject wordt uitgevoerd met actieve betrokkenheid van een wetenschappelijke of
      technische organisatie, die de resultaten van het project valideert.
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel3.4.3
  - number: 3.4.4
    text: |-
      Onverminderd de [artikelen 2.9][ref1] en [3.1.4][ref2], bevat een aanvraag tot subsidieverlening in ieder geval:

      a. gegevens waaruit blijkt hoe de actieve betrokkenheid, bedoeld in [artikel 3.4.3][ref3], van een technische of
      wetenschappelijke organisatie bij het rendementsverbeteringsproject geborgd zal worden;

      b. een verklaring van een wetenschappelijke of technische organisatie waaruit blijkt dat deze bereid is om de in
      [artikel 3.4.3][ref4] omschreven rol te vervullen, overeenkomstig de gegevens, bedoeld in onderdeel a.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel2.9
