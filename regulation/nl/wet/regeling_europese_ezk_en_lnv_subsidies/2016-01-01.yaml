        hoofdstuk: '3'
  - number: 3.3.10
    text: |-
      1 Met de uitvoering van de op grond van deze titel gesubsidieerde aanlandplichtinnovatieprojecten wordt gestart na
      de datum van ontvangst van de subsidieaanvraag, bedoeld in [artikel 2.9][ref1], maar uiterlijk binnen 12 maanden na
      de subsidieverlening.

      2 De op grond van deze titel gesubsidieerde aanlandplichtinnovatieprojecten worden voltooid binnen 36 maanden na
      subsidieverlening.

      3 Indien er sprake is van een subsidieverlening onder opschortende voorwaarde als bedoeld in
      [artikel 3.3.7, eerste lid][ref2], beginnen de termijnen, bedoeld in het eerste en tweede lid, te lopen vanaf de
      datum waarop de minister de subsidieaanvrager op de hoogte heeft gesteld van het oordeel, bedoeld in artikel 3.3.7,
      derde lid, indien het aanlandinnovatieproject is goedgekeurd door de Europese Commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel2.9
      [ref2]: https://wetten.overheid.nl/BWBR0036758#Artikel3.3.7
    url: https://wetten.overheid.nl/BWBR0036758/2016-01-01#Artikel3.3.10
    references:
