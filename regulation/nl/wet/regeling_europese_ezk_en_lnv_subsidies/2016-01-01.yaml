      c. subsidies die voor die datum zijn vastgesteld op grond van de
      [Uitvoeringsregeling EFRO programmaperiode 2014–2020][ref5] of de
      [Regeling Subsidiëring brede weersverzekering][ref6].

      2 Het recht zoals dat luidde voor 1 januari 2016 blijft van toepassing op:

      a. aanvragen tot subsidieverlening die voor die datum zijn ingediend op grond van de
