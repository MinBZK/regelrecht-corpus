    text: |-
      De minister beslist afwijzend op een aanvraag indien:

      a) de aanvrager niet beschikt over voor het project gekwalificeerd en geregeld opgeleid personeel als bedoeld in
      artikel 14, derde lid, van [Verordening 1305/2013](32013R1305);

      b) na toepassing van [artikel 4.10.7][ref1] aan één van de onderdelen a tot en met d van het eerste lid van dat
      artikel minder dan drie punten zijn toegekend;

      c) De aanvrager een producentengroepering of -organisatie is die een landbouwonderneming verplicht lid te zijn van
      de groepering of organisatie om deel te kunnen nemen aan het project;

      d) het project niet past binnen de onderwerpen van [artikel 4.10.1, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel4.10.7
      [ref2]: https://wetten.overheid.nl/BWBR0036758#Artikel4.10.1
