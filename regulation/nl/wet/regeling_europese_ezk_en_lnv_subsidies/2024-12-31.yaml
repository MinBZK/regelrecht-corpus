  - number: 4.11.7
    text: |-
      1 Met de uitvoering van een op grond van deze titel gesubsidieerd investeringsproject wordt gestart binnen twee
      maanden na de subsidieverlening.

      2 De termijn, bedoeld in [artikel 2.11, tweede lid, onderdeel b][ref1], loopt af op 1 oktober 2024.


