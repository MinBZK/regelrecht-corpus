  - number: 3.1.3
    text: |-
      Onverminderd [artikel 2.11][ref1], beslist de minister afwijzend op een aanvraag tot subsidieverlening indien:

      a. de subsidieaanvrager niet ontvankelijk is voor steun ingevolge artikel 10 van [verordening 508/2014]
      (32014R0508);

      b. de activiteiten waarvoor subsidie wordt gevraagd niet subsidiabel zijn ingevolge artikel 11 van [verordening
      508/2014](32014R0508);

      c. de subsidieaanvrager niet voldoet aan de verplichting tot het verstrekken van informatie, bedoeld in artikel 111
      van [verordening 508/2014](32014R0508).


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel2.11
    url: https://wetten.overheid.nl/BWBR0036758/2024-12-31#Artikel3.1.3
