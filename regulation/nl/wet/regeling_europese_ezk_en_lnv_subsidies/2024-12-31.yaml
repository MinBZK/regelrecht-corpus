  - number: 4.11.10
    text: |-
      1 Bij de aanleg en het beheer van een investering maakt de subsidieontvanger geen gebruik van meststoffen of
      gewasbeschermingsmiddelen, voor zover de investering betrekking heeft op een natuurvriendelijke oever, een
      natuurvriendelijke overhoek, een natuurvriendelijke sloot, een poel of een meerjarige bloemrijke akkerrand of
      kruidenrijke akkerrand als bedoeld in [artikel 4.11.2, tweede lid, onderdelen a, b, c, d en e][ref1].

      2 Vanaf het moment van aanleg meet de subsidieontvanger met de grondwaterpeilbuizen, bedoeld in
      [artikel 4.11.2, derde lid][ref2], het effect van de hoogte van de grondwaterstand, bedoeld in artikel 4.11.2,
      eerste lid, onderdeel b, subonderdeel 1°.

      3 De subsidieontvanger verstrekt vanaf het jaar van de aanleg van de grondwaterpeilbuizen jaarlijks een document
      met de data die verkregen wordt met de metingen, bedoeld in het tweede lid, met gebruikmaking van een door de
      minister beschikbaar gesteld middel.

      4 De subsidieontvanger draagt zorg voor een adequaat onderhoud van de aangelegde waterinfiltratiesystemen, bedoeld
      in [artikel 4.11.2, derde lid][ref3].

      5 De verplichtingen, gesteld in dit artikel, gelden gedurende vijf jaar na de datum van de beschikking tot
      subsidievaststelling.

      6 [Artikel 2.18][ref4] is niet van toepassing op deze titel.


