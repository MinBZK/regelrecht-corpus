  - number: 4.9.9
    text: |-
      1 De Minister kent aan een aanvraag, op basis van het bijbehorende projectplan, een hoger aantal punten toe
      naarmate naar verwachting:

      a. de mate van effectiviteit hoger is;

      b. de haalbaarheid hoger is;

      c. de mate van efficiëntie van uitvoering hoger is; en

      d. de mate van innovativiteit hoger is.

      2 Het aantal punten bedraagt per onderdeel van het eerste lid ten hoogste 4.

      3 Voor de rangschikking van een aanvraag wordt het aantal punten gegeven voor het eerste lid, onderdelen a, b, c en
      d, vermenigvuldigd met onderscheidenlijk 3, 2, 2 en 2.

      5 De Minister rangschikt de aanvragen waarop niet afwijzend is beslist hoger naarmate in totaal meer punten aan het
      proefproject zijn toegekend.

      6 Indien aan twee of meer aanvragen een gelijk aantal punten is toegekend, rangschikt de Minister een aanvraag
      hoger naarmate meer punten zijn toegekend aan onderdeel a van het eerste lid. Hierna stelt de Minister de
      onderlinge rangschikking van aanvragen die bij de beoordeling gelijk zijn gerangschikt vast door middel van loting.
    url: https://wetten.overheid.nl/BWBR0036758/2024-12-31#Artikel4.9.9
  - number: 4.9.10
    text: |-
      1 Onverminderd [artikel 2.9, vierde lid][ref1], neemt de subsidieontvanger in het projectplan op:

      a) een beschrijving van de huidige situatie in de keten, waaronder een beschrijving bij de partners van het
      betreffende samenwerkingsverband met betrekking tot het houden van kalveren en vermarkten van de producten uit
      de kalverhouderij;

      b) een beschrijving van de beoogde maatregelen die op effectieve en efficiënte wijze kunnen bijdragen aan het
      behalen van een van de vormen van samenwerking, bedoeld in [4.9.2, tweede lid][ref2];

      c) de verwachte concrete resultaten van de maatregelen, bedoeld in onderdeel b, waaronder een uitwerking van het
      verwachte effect op het gebied van diergezondheid en dierenwelzijn van het vleeskalf en het verwachte verdienmodel
      en schaalbaarheid van dit samenwerkingsverband;

      d) een beschrijving van de rol en de taken van de bij de uitvoering van het projectplan betrokken partijen
      waaronder de verdeling van verantwoordelijkheden, bevoegdheden en financiële verplichtingen van de deelnemers;

      e) (een inschatting van) de risico’s, randvoorwaarden en de negatieve (neven)omgevingseffecten op andere actoren
      binnen of buiten het projectgebied of sector;

      f) de uitvoering en realisatietermijn waarbij per te onderscheiden fase van de projectactiviteit een start- en
      einddatum wordt benoemd;

      g) de verwachte bijdrage aan de selectiecriteria, bedoeld in [artikel 4.9.9, eerste lid][ref3];

      h) de verwachte bijdrage aan kennisverspreiding waaronder een communicatieplan waarbij de activiteiten worden
      beschreven, op welke wijze de kalverketen wordt betrokken en welke netwerken worden ingezet;

      i) een financieringsplan;

      j) monitoring van en gegevensverzameling over de uitvoering en opbrengsten van de proefprojecten met betrekking tot
      verdienmodellen en schaalbaarheid;

      k) een opgave van de verwachtte netto inkomsten van het project.

      2 Het projectplan wordt opgesteld overeenkomstig een door de Minister ter beschikking gesteld model.

      3 De subsidieontvanger maakt de resultaten van de activiteit openbaar via het EIP-netwerk, bedoeld in artikel 53
      van [verordening 1305/2013](32013R1305), en andere geëigende netwerken.

      4 De penvoerder van een samenwerkingsverband als bedoeld in [artikel 4.9.3][ref4], dient uiterlijk een jaar
      na subsidieverlening een tussenrapportage in bij de Minister. Deze tussenrapportage bevat een overzicht van de
      uitgevoerde activiteiten en de behaalde deelresultaten.

      5 De subsidieontvanger verleent gedurende ten hoogste vijf jaar na de datum van de beschikking tot
      subsidievaststelling medewerking aan een evaluatie van de effecten van de door hem uitgevoerde activiteiten,
      bedoeld in [artikel 4.9.2, eerste lid][ref5], voor zover deze medewerking redelijkerwijs van hem verlangd kan
      worden.

      6 De subsidieontvanger voldoet aan artikel 80 van [Verordening 1305/2013](32013R1305).

      7 De in het samenwerkingsverband samenwerkende partijen werken mee aan een door de Minister voorgeschreven wijze
      van monitoring met betrekking tot de gezondheid en het welzijn van kalveren.


