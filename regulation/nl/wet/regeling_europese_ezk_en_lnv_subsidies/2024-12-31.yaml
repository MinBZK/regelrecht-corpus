        artikel: '1'
  - number: 4.11.2
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een grondeigenaar voor het zelfstandig of in een
      samenwerkingsverband van grondeigenaren uitvoeren van een investeringsproject betreffende een niet-productieve
      investering of combinatie van niet-productieve investeringen als bedoeld in artikel 17, eerste lid, onderdeel d,
      van [verordening 1305/2013](32013R1305), die bestemd is respectievelijk zijn voor:

      a. het inrichten van landbouwgrond of de hieraan grenzende grond die begint binnen ten hoogste 5 meter en eindigt
      binnen ten hoogste 20 meter van deze landbouwgrond, die de desbetreffende grondeigenaar in eigendom heeft, gericht
      op het leveren van een bijdrage aan grotere diversiteit in het landschap in Nederland; of

      b. het inrichten van veengrond die de desbetreffende grondeigenaar in eigendom heeft, gericht op het leveren van
      een bijdrage aan de agromilieu- en klimaatdoelstellingen in Nederland door:

      1°. het verbeteren van het inzicht in het effect van de hoogte van de grondwaterstand; of

      2°. het verhogen van de grondwaterstand.

      2 Een investering als bedoeld in het eerste lid, onderdeel a, betreft de aanschaf, het plaatsen en, voor zover van
      toepassing, het afrasteren van een of meer van de volgende producten:

      a. een natuurvriendelijke oever met:

      1°. een breedte van ten minste 3 meter en ten hoogste 10 meter; en

      2°. een lengte van ten minste 25 meter;

      b. een natuurvriendelijke overhoek met een oppervlakte van tenminste 10 vierkante meter;

      c. een natuurvriendelijke sloot met:

      1°. een breedte van ten minste 3 meter en ten hoogste 10 meter; en

      2°. een lengte van ten minste 25 meter;

      d. een poel met een oppervlakte van:

      1°. tenminste 50 vierkante meter; en

      2°. ten hoogste 5.000 vierkante meter;

      e. een meerjarige bloemrijke akkerrand of kruidenrijke akkerrand met:

      1°. een breedte van ten minste 3 meter en ten hoogste 20 meter; en

      2°. een lengte van 10 meter;

      f. een solitaire boom met een hoogte van ten minste 0,5 meter;

      g. een bomenrij met ten minste:

      1°. een lengte van 50 meter;

      2°. vier bomen per 50 meter lengte van die bomenrij; en

      3°. een hoogte van 0,5 meter per boom van die bomenrij;

      h. een boomgroep bestaande uit één of meer subgroepen van vijf bomen met:

      1°. een oppervlakte van ten hoogste 1,5 hectare op maaiveldniveau; en

      2°. een hoogte van ten minste 0,5 meter per boom van die boomgroep;

      i. een houtwal met een oppervlakte van tenminste 100 vierkante meter; of

      j. een heg met een lengte van ten minste 25 meter.

      3 Een investering als bedoeld in het eerste lid, onderdeel b, subonderdeel 1°, betreft de aanschaf en het plaatsen
      van één of meer grondwaterpeilbuizen, waarbij per 50 hectare veengrond die de grondeigenaar, bedoeld in het eerste
      lid, in eigendom heeft ten hoogste één grondwaterpeilbuis geplaatst wordt.

      4 Een investering als bedoeld in het eerste lid, onderdeel b, subonderdeel 2°, betreft de aanschaf en het plaatsen
      van waterinfiltratiesystemen, waaronder uitsluitend begrepen onderwaterdrainage- of drukdrainage systemen, op
      veengrond die de grondeigenaar, bedoeld in het eerste lid, in eigendom heeft, waarmee:

      a. de emissie van CO vanuit deze veengrond gereduceerd wordt met ten minste 10 procent; en

      b. de emissie van CO uitkomt onder de 10 ton per hectare van deze veengrond.

      5 Per investeringsproject kan slechts één aanvraag tot subsidieverlening worden ingediend.
    url: https://wetten.overheid.nl/BWBR0036758/2024-12-31#Artikel4.11.2
  - number: 4.11.3
    text: |-
      1 Onverminderd [artikel 2.9, derde lid][ref1], bevat een aanvraag tot subsidieverlening voor een
      investeringsproject als bedoeld in [artikel 4.11.2, eerste lid][ref2], ten minste:

      a. een verklaring van de subsidieaanvrager dat de investering of investeringen niet in strijd is
      respectievelijk zijn met het bestemmingsplan van de gemeente waarbinnen zich de grond, bedoeld in
      [artikel 4.11.2, eerste lid, onderdelen a of b][ref3] bevindt;

      b. informatie over of reeds door een bestuursorgaan of de Europese Commissie subsidie verstrekt is voor dezelfde
      investering of dezelfde combinatie van investeringen of een onderdeel daarvan op dezelfde locatie;

      c. een verklaring dat de desbetreffende investering niet gebruikt zal worden om te voldoen aan de
      herbeplantingsplicht, bedoeld in [artikel 4.3 van de Wet natuurbescherming][ref4], voor zover de aanvraag
      betrekking heeft op een investering in een solitaire boom, bomenrij, boomgroep, houtwal of heg als bedoeld in
      [artikel 4.11.2, tweede lid, onderdelen f tot en met j][ref5].

      2 Onverminderd [artikel 2.9, vierde lid][ref6]:

      a. bevat het projectplan, waarvan de aanvraag tot subsidieverlening vergezeld gaat:

      1°. de benaming van elke investering en de bijbehorende kenmerken hiervan;

      2°. een kaart van de beoogde locatie, waarop wordt aangegeven waar elke beoogde investering geplaatst wordt;

      b. gaat de aanvraag tot subsidieverlening vergezeld van:

      1°. een kopie van drie offertes met daarin de naam van de investering of investeringen met bijhorende kenmerken en
      de totale kosten voor deze investering of investeringen;

      2°. een berekening van de verwachte reductie van de emissie van CO die met een investering behaald wordt, indien
      het een investering als bedoeld in [artikel 4.11.2, vierde lid][ref7], betreft.

      3 Voor de berekening van de verwachte reductie van emissie van CO, bedoeld in het tweede lid, onderdeel
      b, subonderdeel 2°, wordt gebruik gemaakt van het rekenmodel SOMERS 1.0 zoals dat beschikbaar is via
      [www.nobveenweiden.nl](http://www.nobveenweiden.nl) tijdens de openstellingsperiode waarin de aanvraag tot
      subsidieverlening is ingediend.


