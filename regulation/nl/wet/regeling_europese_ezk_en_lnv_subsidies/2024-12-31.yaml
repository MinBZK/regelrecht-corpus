  - number: 4.11.1
    text: |-
      In deze titel wordt verstaan onder:

        - *grasland:* perceel dat op 15 mei 2022 in de perceelsregistratie is geregistreerd als grasland als bedoeld in
      [artikel 1, derde lid, van het Besluit gebruik meststoffen][ref1];
        - *grondeigenaar:* natuurlijke persoon of rechtspersoon die grond in eigendom heeft, niet zijnde
      de Staat der Nederlanden, een gemeente, provincie, waterschap, openbaar lichaam als bedoeld in
      [artikel 8, eerste lid, van de Wet gemeenschappelijke regelingen][ref2], of ander overheidsorgaan;
        - *landbouwgrond:* landbouwareaal als bedoeld in artikel 2, eerste lid, onderdeel f, van [verordening 1305/2013]
      (32013R1305);
        - *minister:* Minister voor Natuur en Stikstof;
        - *veengrond:* landbouwgrond die bestaat uit veengrond als bedoeld in
      [artikel 1, eerste lid, onderdeel n, van de Meststoffenwet][ref3] in de volgende gebieden: a. de provincie
      Fryslân, Noord-Holland, Utrecht of Zuid-Holland; b. de gemeente Groningen, Midden-Groningen of Westerkwartier in
      de provincie Groningen; of c. de gemeenten Kampen, Staphorst, Steenwijkerland, Zwartewaterland of Zwolle in de
      provincie Overijssel.


      [ref1]: https://wetten.overheid.nl/BWBR0009066#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel1
    url: https://wetten.overheid.nl/BWBR0036758/2024-12-31#Artikel4.11.1
    references:
