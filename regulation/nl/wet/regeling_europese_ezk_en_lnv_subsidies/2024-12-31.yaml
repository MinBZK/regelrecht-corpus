    text: |-
      1 De minister kent aan een aanvraag een aantal punten toe op basis van de in [bijlage 5][ref1] opgenomen lijst
      van investeringen.

      2 Bij een aanvraag bestaande uit twee investeringen binnen één van de categorieën zoals opgenomen in
      [artikel 4.7.2, eerste lid][ref2], wordt voor de rangschikking het aan de investeringen toegekende aantal punten
      zoals opgenomen in [bijlage 5][ref3], opgeteld en vervolgens door twee gedeeld.

      3 De minister rangschikt de aanvragen waarop niet afwijzend is beslist hoger naarmate gemiddeld meer punten aan de
      aanvraag zijn toegekend.


