  - number: 4.11.9
    text: |-
      1 De minister kent aan een aanvraag de volgende punten toe:

      a. afhankelijk van het aantal soorten producten, bedoeld in [artikel 4.11.2, tweede lid][ref1]:

      1°. acht punten, indien het een investering betreft in ten hoogste één soort product;

      2°. negen punten, indien het investeringen betreft in twee of drie soorten producten;

      3°. tien punten, indien het investeringen betreft in tenminste vier soorten producten;

      b. zeven punten, indien het investeringsproject betrekking heeft op een investering in een product als bedoeld in
      [artikel 4.11.2, derde lid][ref2];

      c. één punt, indien het investeringsproject betrekking heeft op een investering in een product als bedoeld in
      [artikel 4.11.2, vierde lid][ref3].

      2 Indien de subsidieaanvraag een investeringsproject betreft dat betrekking heeft op:

      a. zowel een investering als bedoeld in het eerste lid, onderdeel a, als een investering als bedoeld in het eerste
      lid, onderdeel b, kent de minister uitsluitend punten toe voor het onderdeel waarop de hoogste score behaald is;

      b. zowel een investering als bedoeld in het eerste lid, onderdeel c als een investering als bedoeld in het eerste
      lid, onderdeel a of b, telt de minister, in afwijking van onderdeel a van dit lid, het met de verschillende
      onderdelen behaalde aantal punten bij elkaar op en deelt dit vervolgens door het aantal onderdelen.

      3 De minister rangschikt de aanvragen waarop niet afwijzend is beslist hoger naarmate in totaal meer punten aan het
      investeringsproject zijn toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel4.11.2
