      1 Het subsidieplafond voor deze regeling bedraagt € 10.000.000.

      2 De Minister verdeelt het subsidieplafond, bedoeld in het eerste lid, per thema, als bedoeld in
      [artikel 4.9.2, tweede lid][ref1], op volgorde van rangschikking van de aanvragen, bedoeld in de
      [artikelen 2.4, onderdeel b][ref2], en [2.6][ref3].

      2 Na rangschikking overeenkomstig [artikel 4.9.9][ref4] worden de aanvragen gecategoriseerd in een van de vier
      thema’s, bedoeld in [artikel 4.9.2, tweede lid][ref5]. In elke categorie worden allereerst de projecten met de
      hoogste scores gehonoreerd, daarna de projecten in de rangen daaropvolgend. Als er in een of meer categorieën geen
      aanvragen meer zijn, worden in de overige categorieën de aanvragen met dezelfde rangorde binnen de verschillende
      categorieën gehonoreerd.


