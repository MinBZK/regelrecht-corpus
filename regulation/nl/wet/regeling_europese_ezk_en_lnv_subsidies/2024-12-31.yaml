  - number: 4.11.11
    text: |-
      1 De minister geeft in voorkomende gevallen uitvoering aan artikel 54, eerste en derde lid, en artikel 56 van
      [verordening 1306/2013](32013R1306).

      2 De minister verricht de controles, bedoeld in artikel 59 van [verordening 1306/2013](32013R1306).
    url: https://wetten.overheid.nl/BWBR0036758/2024-12-31#Artikel4.11.11
  - number: 4.11.12
    text: |-
      1 De minister besluit tot het niet betalen dan wel de gehele of gedeeltelijke intrekking van de subsidie
      overeenkomstig artikel 63, eerste lid, van [verordening 1306/2013](32013R1306).

      2 De minister stelt de sancties, bedoeld in artikel 63, tweede lid, van [verordening 1306/2013](32013R1306), vast
      met inachtneming van artikel 64 van [verordening 1306/2013](32013R1306).

      3 De minister geeft bij de uitvoering van de bevoegdheden, genoemd in het eerste en tweede lid, toepassing aan
      artikel 63 van [verordening 809/2014](32014R0809).
    url: https://wetten.overheid.nl/BWBR0036758/2024-12-31#Artikel4.11.12
  - number: 4.11.13
    text: |-
      1 Onverminderd [artikel 2.20, eerste lid][ref1], dient de subsidieontvanger zijn aanvraag tot subsidievaststelling
      in uiterlijk op 1 januari 2025.

      2 Onverminderd [artikel 2.20, vierde en vijfde lid][ref2], gaat de aanvraag tot subsidievaststelling vergezeld van:

      a. een factuur, betaalbewijs en een kaart met de GPS-coördinaten van de investering of investeringen, waaruit volgt
      wat de naam, bijhorende kenmerken en plaats van de investering of investeringen is;

      b. een verklaring van de aanvrager waaruit volgt dat gedurende vijf jaar na subsidievaststelling voldaan zal worden
      aan de verplichtingen, bedoeld in [artikel 4.11.10, derde lid][ref3], voor zover het investeringsproject betrekking
      heeft op een investering in grondwaterpeilbuizen als bedoeld in [artikel 4.11.2, derde lid][ref4];

      c. documenten met daarin informatie over de wijze van plaatsing van de investering, voor zover het
      investeringsproject betrekking heeft op een investering in één of meer waterinfiltratiesystemen als bedoeld in
      [artikel 4.11.2, vierde lid][ref5], bestaande uit:

      1°. kopieën van de perceelsregistratie van de veengrond waarop de investering of investeringen geplaatst zijn;

      2°. gegevens over de diepte van de ligging van de buizen van het desbetreffende waterinfiltratiesysteem in meters,
      ten opzichte van het Normale Amsterdamse Peil (NAP);

      3°. gegevens over de afstand tussen de buizen van het desbetreffende waterinfiltratiesysteem in meters; en

      4°. een toelichting of er een hoog scenario of medium scenario is gebruikt bij de aanleg van de desbetreffende
      investering, voor zover de investering een drukdrainagesysteem betreft.

      3 Voor de toelichting op het gebruik van een hoog scenario of medium scenario, bedoeld in het tweede lid,
      onderdeel c, subonderdeel 4°, wordt gebruik gemaakt van de uitgangspunten uit het rekenmodel SOMERS 1.0 zoals dat
      beschikbaar is via [www.nobveenweiden.nl](http://www.nobveenweiden.nl) tijdens de periode waarin de aanvraag tot
      subsidievaststelling is ingediend.


