    text: |-
      1 De minister verstrekt op aanvraag subsidie voor een investering, opgenomen in [bijlage 5][ref1] bij deze
      regeling, in een van de volgende categorieën:

      a. Precisielandbouw en Smart Farming;

      b. Digitalisering;

      c. Water, droogte, verzilting;

      d. Duurzame bedrijfsvoering; en

      e. Natuurinclusieve landbouw en kringlooplandbouw.

      2 Per landbouwbedrijf kan een aanvraag voor maximaal twee verschillende investeringen worden gedaan.

      3 Onverminderd [artikel 2.9][ref2] bevat een aanvraag tot subsidieverlening in ieder geval:

      a. het KVK-nummer van het landbouwbedrijf;

      b. een offerte voor de investering of investeringen, bedoeld in [bijlage 5][ref3]; en

      c. de voor de investering of investeringen benodigde bewijsstukken, opgenomen in [bijlage 5][ref4].


