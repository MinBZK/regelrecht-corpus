      Onverminderd [artikel 2.11][ref1] beslist de Minister afwijzend op een aanvraag voor subsidieverlening indien:

      a. een activiteit onder een van de thema’s als bedoeld in [artikel 4.9.2, tweede lid][ref2], niet nieuw is voor het
      samenwerkingsverband als bedoeld in [artikel 4.9.3, eerste lid][ref3];

      b. aan een aanvraag met het project dat bijdraagt aan de doelstelling, bedoeld in [4.9.2, tweede lid][ref4], minder
      dan 20 punten zijn toegekend op grond van [artikel 4.9.9, derde lid][ref5].


