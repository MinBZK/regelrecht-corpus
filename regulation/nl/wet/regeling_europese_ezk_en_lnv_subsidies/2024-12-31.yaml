      a. er sprake is van een onvolledige aanvraag;

      b. de aanvraag na afloop van de openstelling is ingediend;

      c. voor het moment van subsidieaanvraag door de begunstigde reeds verplichtingen zijn aangegaan ten aanzien van de
      investeringen waarvoor subsidie is aangevraagd.


