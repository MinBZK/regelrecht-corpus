      b. de opdrachtbevestiging;

      c. een onderbouwing waaruit blijkt dat de investering voldoet aan de voorwaarden van [bijlage 5][ref2]; en

      d. de voor de investering of investeringen benodigde bewijsstukken, opgenomen in [bijlage 5][ref3].

      2 In afwijking van [artikel 2.20][ref4] wordt de aanvraag tot subsidievaststelling uiterlijk op 31 december 2024
      ingediend.


