      1 Voor zover van toepassing worden bij subsidieverlening de subsidiabele kosten overeenkomstig artikel 61 of
      artikel 65, achtste lid, van verordening 1303/2013 verminderd met de netto-inkomsten, bedoeld in de artikelen 61 of
      65, achtste lid, van die verordening.

      2 Voor zover van toepassing worden, indien bij het verstrekken van een voorschot als bedoeld in
      [artikel 2.14][ref1] of bij de subsidievaststelling blijkt dat de netto-inkomsten, bedoeld in artikel 65, achtste
      lid, van verordening 1303/2013, de eerder met de subsidiabele kosten verrekende netto-inkomsten te boven gaan, de
      subsidiabele kosten overeenkomstig artikel 65, achtste lid, van die verordening verminderd met het verschil tussen
      deze bedragen aan netto-inkomsten.

      3 In afwijking van [artikel 1.7][ref2] worden, indien de netto-inkomsten, bedoeld in artikel 61 van verordening
      1303/2013, niet vooraf objectief te bepalen zijn, de subsidiabele kosten na afloop van het project verminderd met
      de gerealiseerde netto-inkomsten overeenkomstig artikel 61, zesde lid, van die verordening.


