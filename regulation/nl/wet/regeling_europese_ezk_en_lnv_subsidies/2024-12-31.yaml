  - number: '2.19'
    text: |-
      1 Indien subsidie wordt verstrekt voor een investering als bedoeld in artikel 71, eerste lid, van
      [verordening 1303/2013](32013R1303), wordt de beschikking tot subsidievaststelling onverminderd
      [artikel 4:49 van de Algemene wet bestuursrecht][ref1] ingetrokken of ten nadele van de subsidieontvanger gewijzigd
      indien de investering gedurende vijf jaar te rekenen vanaf de datum van de laatste betaling een belangrijke
      wijziging ondergaat die:

      a. het gevolg is van de beëindiging of verplaatsing van productiecapaciteit als bedoeld in artikel 71, eerste lid,
      onderdeel a, van [verordening 1303/2013](32013R1303);

      b. het gevolg is van een verandering in de aard van de eigendom van een infrastructuurvoorziening waardoor een
      onderneming of overheidsinstantie onrechtmatig voordeel behaalt, als bedoeld in artikel 71, eerste lid, onderdeel
      b, van [verordening 1303/2013](32013R1303), of

      c. een substantiële verandering is als bedoeld in artikel 71, eerste lid, onderdeel c, van [verordening 1303/2013]
      (32013R1303) of de bij deze regeling opgelegde uitvoeringsvoorwaarden raakt.

      2 Indien subsidie wordt verstrekt voor een investering als bedoeld in artikel 71, tweede lid, van
      [verordening 1303/2013](32013R1303), wordt de beschikking tot subsidievaststelling onverminderd
      [artikel 4:49 van de Algemene wet bestuursrecht][ref2] ingetrokken of ten nadele van de subsidieontvanger gewijzigd
      indien de investering binnen tien jaar na de laatste betaling wordt verplaatst naar een locatie buiten de Europese
      Unie.

      3 Het tweede lid is niet van toepassing op het mkb.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel449
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel449
