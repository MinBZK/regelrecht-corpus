  - number: 4.9.1
    text: |-
      In deze titel wordt verstaan onder:

        - *afzetkanaal:* groothandel, winkel of winkelketen die producten uit de kalverhouderij verkoopt, te koop aanbiedt,
      levert of op andere wijze verhandelt;
        - *kalverhouder:* een eigenaar of houder van een of meerdere stallen waarin bedrijfsmatig vleeskalveren worden
      gehouden;
        - *kalverhouderij:* veehouderij die eigenaar is of houder van een of meerdere stallen waarin bedrijfsmatig
      vleeskalveren worden gehouden;
        - *kalverketen:* de samenwerking tussen melkveehouder, veetransporteur, kalverhouder, slachter of afzetkanaal die
      ziet op vleeskalveren.
        - *melkveehouder:* een eigenaar of houder van melkkoeien die melk levert aan een zuivelonderneming of die de op het
      eigen bedrijf geproduceerde melk zelf verwerkt tot eindproducten.
        - *slachter:* slachthuis waar het vleeskalf geslacht wordt.
        - *verzamelcentrum:* inrichting voor het verzamelen van vleeskalveren van waaruit dieren worden verplaatst.
        - *verordening 1306/2013:* [verordening (EU) nr. 1306/2013](32013R1306) van het Europees parlement en de Raad van
      17 december 2013 inzake de financiering, het beheer en de monitoring van het gemeenschappelijk landbouwbeleid en
      tot intrekking van [Verordeningen (EEG) nr. 352/78](31978R0352), [(EG) nr. 165/94](31994R0165), [(EG) nr. 2799/98]
      (31998R2799), [(EG) nr. 814/2000](32000R0814), [(EG) nr. 1290/2005](32005R1290) en [(EG) nr. 485/2008](32008R0485)
      van de Raad (PbEU 2013, L 347);
        - *vleeskalveren:* kalveren geboren op de melkveehouderij die louter worden gehouden voor de productie van rund-
      of kalfsvlees.
    url: https://wetten.overheid.nl/BWBR0036758/2024-12-31#Artikel4.9.1
  - number: 4.9.2
    text: |-
      1 De Minister verstrekt op aanvraag subsidie voor het uitvoeren van een project dat bestaat uit:

      a) Het gezamenlijk ontwikkelen, toetsen en demonstreren van nieuwe concepten in de kalverketen die moeten leiden
      tot een verbetering van het dierenwelzijn en de diergezondheid van kalveren;

      b) het formuleren van een projectplan voor het bereiken van toekomstbestendige landbouw in de kalverketen
      overeenkomstig de in [artikel 4.9.10, eerste lid][ref1], gestelde voorschriften;

      c) de uitvoering van een proefproject ter uitvoering van een projectplan;

      d) monitoring van en gegevensverzameling over de uitvoering en resultaten van een proefproject;

      e) kennisverspreiding van de verworven kennis van de resultaten van een proefproject.

      2 Het proefproject moet bijdragen aan één van de vier volgende thema’s:

      a) thema ‘loyaal aan lokaal’ waarbij de melkveehouder zijn kalveren rechtstreeks, zonder tussenkomst van een
      verzamelcentrum, aan een kalverhouder levert en de kalveren worden gehouden volgens een gezamenlijk gezondheidsplan
      van de melkvee- en kalverhouder;

      b) thema ‘maximaal integraal’ waarbij kalveren tot de leeftijd van 3 maanden oud bij de melkveehouder blijven;

      c) thema ‘thuis en tevreden’ waarbij de kalveren bij de melkveehouder blijven tot ze geslacht worden of;

      d) thema ‘ gezonde kalverketen overig’ waarbij de aanvrager onderbouwt welke verandering in de keten op welke wijze
      zal leiden tot een verbetering van de gezondheid en het welzijn van kalveren.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel4.9.10
    url: https://wetten.overheid.nl/BWBR0036758/2024-12-31#Artikel4.9.2
    references:
      - id: ref1
        bwb_id: BWBR0036758
        artikel: 4.9.10
        hoofdstuk: '4'
  - number: 4.9.3
    text: |-
      De subsidie wordt verleend aan een samenwerkingsverband dat bestaat uit tenminste één melkveehouder, slachter en
      afzetkanaal, waar nodig aangevuld met andere partijen uit de kalverketen.
    url: https://wetten.overheid.nl/BWBR0036758/2024-12-31#Artikel4.9.3
  - number: 4.9.4
    text: De subsidie bedraagt ten minste € 75.000 en ten hoogste € 1.000.000 per proefproject.
    url: https://wetten.overheid.nl/BWBR0036758/2024-12-31#Artikel4.9.4
  - number: 4.9.5
    text: |-
      1 Voor subsidie komen uitsluitend de kosten, bedoeld in [artikel 1.3, eerste lid, onderdelen a, b, c en d][ref1],
      in aanmerking, overeenkomstig het tweede tot en met vierde lid.

      2 Voor de oprichting van een projectmatig samenwerkingsverband en het gezamenlijk formuleren van een projectplan,
      wordt in afwijking van [artikel 2.11, tweede lid, onderdeel c][ref2], tot een jaar voor de datum van indienen van
      de aanvraag tot subsidieverlening, 100% subsidie verstrekt voor de volgende kosten:

      a. kosten voor het werven van deelnemers;

      b. kosten voor het netwerken om het project goed te definiëren;

      c. kosten voor het opstellen van een projectplan en de samenwerkingsovereenkomst;

      d. kosten voor projectmanagement en projectadministratie.

      3 Voor de uitvoering van een proefproject wordt 100% subsidie verstrekt voor de volgende kosten:

      e. coördinatiekosten van het samenwerkingsverband;

      f. kosten voor het verspreiden van resultaten van het project;

      g. operationele kosten direct verbonden aan de uitvoering van het proefproject, waaronder kosten gemaakt voor
      monitoring van het project;

      h. kosten voor projectmanagement en projectadministratie.

      4 Indien voor de uitvoering van een proefproject een fysieke investering wordt gedaan, wordt 40% subsidie verstrekt
      voor de volgende kosten:

      i. kosten voor de bouw of verbetering van stallen;

      j. kosten voor de verwerving of leasing van onroerende zaken;

      k. kosten voor de aankoop van grond;

      l. kosten van de koop of huurkoop van nieuwe machines en installaties tot maximaal de marktwaarde van de activa;

      m. kosten van verwerving of ontwikkeling van computersoftware;

      n. kosten van verwerving van merken.

      5 In afwijking van de [artikelen 1.3, eerste lid, onderdeel a][ref3], en
      [1.4, eerste lid, onderdeel a, subonderdeel 1 en 2][ref4], worden de loonkosten berekend door een per medewerker
      bepaald individueel uurtarief, berekend op basis van bruto jaarloon, vermeerderd met een opslag van 43,5% voor
      werkgeverslasten waarna over dat bedrag 15% aan overheadkosten wordt berekend en dat bedrag vervolgens wordt
      gedeeld door 1.720 uur op basis van een 40-urige werkweek, te vermenigvuldigen met het aantal aan het project of de
      investering bestede uren.

      6 In afwijking van [artikel 1.4, tweede lid][ref5], worden indien gebruik wordt gemaakt van de rekenmethode,
      bedoeld in het vijfde lid, de kosten van de door een subsidieontvanger verrichte eigen arbeid, bedoeld in artikel
      69, eerste lid, onderdeel e, van [verordening 1303/2013](32013R1303), berekend door het aantal uren dat de
      betrokken persoon ten behoeve van het project of de investering heeft gemaakt te vermenigvuldigen met een vast
      uurtarief van € 35,–.

      7 Overeenkomstig artikel 69, derde lid, onderdeel b, van [verordening 1303/2013](32013R1303), zijn kosten voor de
      aankoop van niet-bebouwde en bebouwde grond subsidiabel tot een bedrag van maximaal 10% van de totale subsidiabele
      uitgaven van het project.


