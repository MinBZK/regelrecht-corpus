  - number: 1.4a
    text: |-
      De kosten, bedoeld in [artikel 1.3, eerste lid, onderdelen b tot en met d][ref1], kunnen worden berekend door de
      loonkosten, berekend overeenkomstig [artikel 1.4, eerste lid, onderdeel a, onder 5°][ref2], te vermenigvuldigen
      met 40%.


