  - number: 4.10.7
    text: |-
      1 De minister kent aan een aanvraag, op basis van het bijhorende projectplan, een hoger aantal punten toe naarmate
      naar verwachting:

      a. de impact van het project groter is;

      b. de kwaliteit van de combinatie van het samenwerkingsverband en de aanvrager hoger is;

      c. de kwaliteit van het projectplan hoger is; en

      d. de kosteneffectiviteit van het project hoger is.

      2 Het aantal punten bedraagt per onderdeel van het eerste lid ten hoogste vijf punten.

      3 Voor de rangschikking wordt het aantal punten gegeven voor het eerste lid, onderdeel a, vermenigvuldigd met twee.

      4 De minister rangschikt de aanvragen waarop niet afwijzend is beslist hoger naarmate in totaal meer punten aan het
      project zijn toegekend.
    url: https://wetten.overheid.nl/BWBR0036758/2024-12-31#Artikel4.10.7
  - number: 4.10.8
    text: |-
      1 Onverminderd in [artikel 2.9][ref1], bevat een aanvraag voor subsidie als bedoeld in [artikel 4.10.1][ref2] ten
      minste:

      a. gegevens over de aanvrager, waaronder contactgegevens en het nummer waaronder zijn onderneming geregistreerd is
      bij de Kamer van Koophandel;

      b. gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;

      c. het projectplan zoals bedoeld in het tweede lid van dit artikel;

      d. een verklaring van het samenwerkingsverband waarin het samenwerkingsverband aangeeft behoefte te hebben aan
      kennisoverdracht.

      2 De subsidieontvanger stelt een projectplan op waarin in ieder geval worden opgenomen de activiteiten waarvoor
      subsidie wordt aangevraagd, de doelstellingen van het project, de start- en einddatum, de samenstelling van het
      samenwerkingsverband, de totale kosten, de omvang van de gevraagde subsidie en een samenvatting van het project.

      3 Het projectplan wordt opgesteld overeenkomstig een door de minister ter beschikking gesteld model.

      4 De aanvrager werkt eraan mee dat informatie over de projecten, waaraan subsidie als bedoeld in
      [artikel 4.10.1][ref3] wordt verstrekt, wordt gedeeld op Groen Kennisnet.


