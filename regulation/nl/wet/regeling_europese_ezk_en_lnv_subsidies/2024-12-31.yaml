    text: |-
      1 De start van het proefproject vindt plaats na de datum van indiening van de aanvraag tot subsidieverlening,
      bedoeld in [artikel 2.9][ref1], en uiterlijk binnen twee maanden na de datum van subsidieverlening

      2 De afronding van het proefproject vindt plaats binnen twee jaar na de datum van subsidieverlening en voor het
      indienen van de aanvraag tot subsidievaststelling, bedoeld in [artikel 2.20][ref2]. Indien het proefproject is
      afgerond, dient de subsidieontvanger overeenkomstig artikel 2.20 zijn aanvraag tot subsidievaststelling in binnen
      13 weken doch uiterlijk op 1 april 2025.


