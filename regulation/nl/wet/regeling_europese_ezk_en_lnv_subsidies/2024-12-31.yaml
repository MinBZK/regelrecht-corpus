  - number: 4.11.8
    text: |-
      Onverminderd [artikel 2.11][ref1] beslist de minister afwijzend op een aanvraag tot subsidieverlening:

      a. indien het aannemelijk is dat de investering of investeringen waarop de aanvraag tot subsidieverlening
      betrekking heeft, in strijd is respectievelijk zijn met het bestemmingsplan van de gemeente waarbinnen zich de
      grond, bedoeld in [artikel 4.11.2, eerste lid, onderdeel a of b][ref2], bevindt;

      b. indien reeds door een bestuursorgaan of de Europese Commissie subsidie is verstrekt voor dezelfde investering of
      dezelfde combinatie van investeringen of een onderdeel daarvan op dezelfde locatie;

      c. voor zover de redelijkheid van de kosten van het desbetreffende investeringsproject niet blijkt uit de offertes,
      bedoeld in [artikel 4.11.3, tweede lid, onderdeel b, subonderdeel 1°][ref3];

      d. indien de te verlenen subsidie per investeringsproject minder dan € 70.000 zou bedragen;

      e. voor zover deze aanvraag betrekking heeft op een investering in:

      1°. een product als bedoeld in [artikel 4.11.2, tweede lid][ref4], dat geheel of gedeeltelijk bestemd is voor het
      deel van het erf waarop zich een woning bevindt;

      2°. een meerjarige bloemrijke akkerrand of kruidenrijke akkerrand als bedoeld in
      [artikel 4.11.2, tweede lid, onderdeel e][ref5], die bestemd is voor aanleg op grond die grenst aan grasland;

      3°. een solitaire boom, bomenrij, boomgroep, houtwal of heg als bedoeld in
      [artikel 4.11.2, tweede lid, onderdelen f tot en met j][ref6], die bestemd is voor plaatsing in grasland, gebruikt
      zal worden om te voldoen aan de herbeplantingsplicht, bedoeld in [artikel 4.3 van de Wet natuurbescherming][ref7]
      of betrekking heeft op een uitheemse soort.


