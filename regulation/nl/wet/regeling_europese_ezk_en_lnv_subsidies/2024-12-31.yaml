  - number: 4.10.1
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een onderneming voor de uitvoering van trainingen, workshops,
      coaching, voorlichtingsactiviteiten en demonstratieactiviteiten ten behoeve van een samenwerkingsverband, bestaande
      uit landbouwondernemingen.

      2 De activiteiten, bedoeld in het eerste lid, hebben voor een samenwerkingsverband als bedoeld in het eerste lid,
      een of meer van de volgende onderwerpen:

      a) Kringlooplandbouw:

      a. (stikstof)emissie en hergebruik nutriënten;

      b. gezonde bodem, water en teeltsystemen;

      c. weerbare teeltsystemen en gewasbescherming;

      d. circulair gebruik van gewassen, grondstoffen en nieuwe plantaardige eiwitbronnen;

      e. natuurinclusieve landbouw;

      f. precisielandbouw.

      b) Duurzaam Ondernemerschap:

      a. persoonlijke ontwikkeling van ondernemers en hun bedrijf;

      b. horizontale samenwerking;

      c. bedrijfsopvolging;

      d. duurzaam verdienvermogen.
    url: https://wetten.overheid.nl/BWBR0036758/2024-12-31#Artikel4.10.1
  - number: 4.10.2
    text: |-
      1 Voor subsidie komen in aanmerking kosten van de organisatie en uitvoering van trainingen, workshops, coaching,
      voorlichtingsacties en demonstratieactiviteiten als bedoeld in artikel 14, vierde lid, van de [Verordening
      1305/2013](32013R1305).

      2 Voor subsidie komen niet in aanmerking kosten voor de ontwikkeling van middelen ten behoeve van de
      kennisoverdracht.

      3 In afwijking van de [artikelen 1.3, eerste lid, onderdeel a][ref1], en [1.4, eerste lid][ref2], worden de
      loonkosten berekend door een per medewerker bepaald individueel uurtarief, berekend op basis van bruto jaarloon,
      vermeerderd met een opslag van 43,5% voor werkgeverslasten waarna over dat bedrag 15% aan overheadkosten
      wordt berekend en dat bedrag vervolgens wordt gedeeld door 1.720 uur op basis van een 40-urige werkweek, te
      vermenigvuldigen met het aantal aan het project of de investering bestede uren.

      4 In afwijking van [artikel 1.4, tweede lid][ref3], worden de kosten van de door een subsidieontvanger verrichte
      eigen arbeid, bedoeld in artikel 69, eerste lid, onderdeel e, van [verordening 1303/2013](32013R1303), berekend
      door het aantal uren dat de betrokken persoon ten behoeve van het project of de investering heeft gemaakt te
      vermenigvuldigen met een vast uurtarief van € 35,–.


