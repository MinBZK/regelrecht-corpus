      toepassing, vergezeld van bescheiden waaruit blijkt dat de activiteiten waarvoor een investering is bestemd, worden
      uitgevoerd met inachtneming van de wettelijke voorschriften die daarop van toepassing zijn.

      2 De [artikelen 3.1.4, aanhef en onderdeel e][ref3], en [3.1.6, tweede lid][ref4], zijn niet van toepassing op
      deze titel.


