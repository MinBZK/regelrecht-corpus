    text: |-
      1 De minister kent aan een aanvraag, op basis van het bijbehorende projectplan, een hoger aantal punten toe
      naarmate naar verwachting:

      a. de mate van effectiviteit hoger is;

      b. de haalbaarheid hoger is;

      c. de mate van efficiëntie van uitvoering hoger is; en

      d. de mate van innovativiteit hoger is.

      2 Het aantal punten bedraagt per onderdeel van het eerste lid ten hoogste 5.

      3 Voor de rangschikking van een aanvraag met een project dat bijdraagt aan de doelstellingen als bedoeld in
      [artikel 4.5.2, tweede lid, onderdelen a en c][ref1], wordt het aantal punten gegeven voor het eerste lid,
      onderdelen a, b, c en d, vermenigvuldigd met onderscheidenlijk 4, 3, 2 en 1.

      4 Voor de rangschikking van een aanvraag met een project dat bijdraagt aan de doelstelling als bedoeld in
      [artikel 4.5.2, tweede lid, onderdeel b][ref2], wordt het aantal punten gegeven voor het eerste lid, onderdelen a,
      b, c en d, vermenigvuldigd met onderscheidenlijk 2, 1, 1 en 4.

      5 De minister rangschikt de aanvragen waarop niet afwijzend is beslist hoger naarmate in totaal meer punten aan het
      project zijn toegekend.

      6 Indien aan twee of meer aanvragen met een project dat bijdraagt aan de doelstellingen als bedoeld in
      [artikel 4.5.2, tweede lid, onderdelen a en c][ref3], in totaal een gelijk aantal punten is toegekend, rangschikt
      de minister een aanvraag hoger naarmate meer punten zijn toegekend aan respectievelijk onderdeel a, b, c en d, van
      het eerste lid.

      7 Indien aan twee of meer aanvragen met een project dat bijdraagt aan de doelstellingen als bedoeld in
      [artikel 4.5.2, tweede lid, onderdeel b][ref4], in totaal een gelijk aantal punten is toegekend, rangschikt de
      minister een aanvraag hoger naarmate meer punten zijn toegekend aan respectievelijk onderdeel d, a, b en c, van het
      eerste lid.


