  - number: 4.8.11
    text: |-
      1 De subsidieontvanger neemt in het plan op:

      a. een uitwerking van de doelen gericht op:

      1°. het verbeteren van het verdienvermogen van de landbouwsector;

      2°. de matiging van en aanpassing aan klimaatverandering en duurzame energie;

      3°. de duurzame ontwikkeling en het efficiënt beheer van natuurlijke hulpbronnen zoals water, bodem en lucht; of

      4°. de bescherming van de biodiversiteit, het versterken van ecosysteemdiensten en de instandhouding van habitats
      en landschappen;

      b. een beschrijving van de rol en de taken van de bij de uitvoering van het plan betrokken partijen; en

      c. de startdatum van het project.

      2 De subsidieontvanger maakt de resultaten van het project openbaar via het EIP-netwerk, bedoeld in artikel 53 van
      [verordening 1305/2013](32013R1305), en andere geëigende netwerken.

      3 De subsidieontvanger start de uitvoering van het project uiterlijk twee maanden na de dagtekening van de
      subsidieverlening.

      4 De subsidieontvanger, bedoeld in [artikel 4.8.3][ref1], dient in voorkomend geval uiterlijk op 31 december 2023
      een voortgangsrapportage in bij de minister. Deze voortgangsrapportage bevat een overzicht van de uitgevoerde
      activiteiten en de behaalde deelresultaten.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel4.8.3
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel4.8.11
    references:
