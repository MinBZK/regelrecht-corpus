      subsidiabele kosten, bedoeld in [artikel 4.8.5][ref1].

      2 De hoogte van de subsidie bedraagt voor de in [artikel 4.8.2, derde lid, onder a, b, d en e][ref2] genoemde
      projecten minimaal € 100.000 en maximaal € 500.000.

      3 De hoogte van de subsidie bedraagt voor de in [artikel 4.8.2, derde lid, onder c][ref3], genoemde projecten
      minimaal € 300.000 en maximaal € 2.000.000.


