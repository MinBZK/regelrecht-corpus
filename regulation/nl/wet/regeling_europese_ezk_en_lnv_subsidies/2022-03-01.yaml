  - number: '2.20'
    text: |-
      1 De subsidieontvanger dient zijn aanvraag tot subsidievaststelling in binnen dertien weken na het tijdstip waarop
      de activiteiten moeten zijn voltooid.

      2 De aanvraag wordt ingediend met gebruikmaking van een middel dat door de minister beschikbaar wordt gesteld.

      3 Bij een aanvraag tot subsidievaststelling wordt in voorkomend geval mededeling gedaan van andere inkomsten,
      waaronder subsidies, waarmee de activiteit waarop de subsidie betrekking heeft is gefinancierd.

      4 De aanvraag tot subsidievaststelling bevat in ieder geval:

      a. gegevens over de subsidieontvanger, waaronder naam, adres en het door de minister toegekende referentienummer;

      b. gegevens over de hoogte van de gemaakte en betaalde subsidiabele kosten;

      c. voor zover van toepassing gegevens over netto-inkomsten als bedoeld in de artikelen 61 of 65, achtste lid, van
      [verordening 1303/2013](32013R1303).

      5 Een aanvraag tot vaststelling van een subsidie voor de uitvoering van een project gaat vergezeld van een
      eindverslag. Het eindverslag bevat ten minste:

      a. een beschrijving van de activiteiten die in het kader van het project zijn verricht;

      b. een evaluatie van de mate waarin de activiteiten hebben bijgedragen aan de doelstellingen, omschreven in het
      projectplan dat onderdeel vormt van de beschikking tot subsidieverlening;

      c. de kennis en informatie die met het project zijn opgedaan, en

      d. de wijze waarop de kennis en informatie, bedoeld in onderdeel c, openbaar is of zal worden gemaakt, indien in
      deze regeling is bepaald dat openbaarmaking plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel2.20
  - number: '2.21'
    text: |-
      Indien subsidieontvangers samenwerken in een samenwerkingsverband, dient de penvoerder hun aanvraag tot
      subsidievaststelling in.
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel2.21
  - number: '2.22'
    text: |-
      1 De minister geeft de beschikking tot subsidievaststelling binnen dertien weken na ontvangst van de aanvraag
      daartoe dan wel nadat de voor het indienen ervan geldende termijn is verstreken.

      2 Indien subsidieontvangers samenwerken in een samenwerkingsverband, verzendt de minister de beschikkingen tot
      subsidievaststelling aan de penvoerder
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel2.22
  - number: 3.1.1
    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - *algemeen nut beogende instelling:* instelling als bedoeld in
      [artikel 5b, eerste lid, van de Algemene wet inzake rijksbelastingen][ref1];
        - *aquacultuurproducten:* aquacultuurproducten als bedoeld in artikel 4, eerste lid, onderdeel 34, van verordening
      1380/2013;
        - *binnenvisserij:* binnenvisserij als bedoeld in
      [artikel 1, vierde lid, onderdeel d, van de Visserijwet 1963][ref2];
        - *binnenwateren:* binnenwateren als bedoeld in [artikel 1, onderdeel e, van de Uitvoeringsregeling visserij][ref3];
        - *kustvisserij:* kustvisserij als bedoeld in [artikel 1, vierde lid, onderdeel c, van de Visserijwet 1963][ref4];
        - *marktdeelnemer:* marktdeelnemer als bedoeld in artikel 4, eerste lid, onderdeel 30, van verordening 1380/2013;
        - *producentenorganisatie voor aquacultuurproducten:* producentenorganisatie voor aquacultuurproducten als bedoeld
      in artikel 6, eerste lid, van verordening 1379/2013;
        - *producentenorganisatie voor visserijproducten:* producentenorganisatie voor visserijproducten als bedoeld in
      artikel 6, eerste lid, van verordening 1379/2013;
        - *technische organisatie:* a. onder c en g van de [bijlage van de Wet op het hoger onderwijs en wetenschappelijk
      onderzoek](onbekend) genoemde instelling voor hoger onderwijs; b. geheel of gedeeltelijk, meerjarig door een
      andere lidstaat van de Europese Unie gefinancierde openbare instelling voor hoger onderwijs gelijkwaardig aan
      een instelling als bedoeld onder a; c. rechtspersoon ten aanzien waarvan een instelling als bedoeld onder a of b
      direct of indirect: 1°. meer dan de helft van het geplaatste kapitaal verschaft, 2°. volledig aansprakelijk vennoot
      is, of 3°. overwegende zeggenschap heeft; d. onderzoeksorganisatie zonder winstoogmerk met eigen medewerkers
      in loondienst, die tot doel heeft via het structureel doen van eigen onderzoek en het ontwikkelen en testen van
      technische toepassingen door haar medewerkers, de technologische kennis op een specifiek terrein te bevorderen, die
      geen instelling is als bedoeld onder a tot en met c; e. organisatie, niet zijnde een wetenschappelijke organisatie
      of een organisatie als bedoeld onder a tot en met d, die wetenschappelijke of technische kennis heeft op het gebied
      van de op grond van dit hoofdstuk te subsidiëren activiteiten, en die als bedrijfsactiviteit adviesopdrachten
      uitvoert;
        - *verordening 1379/2013:* Verordening (EU) nr. 1379/2013 van het Europees Parlement en de Raad van 11 december
      2013 houdende een gemeenschappelijke marktordening voor visserijproducten en aquacultuurproducten, tot wijziging
      van Verordeningen (EG) nr. 1184/2006 en (EG) nr. 1224/2009 van de Raad en tot intrekking van Verordening (EG) nr.
      104/2000 van de Raad (PbEU 2013, L 354);
        - *verordening 1380/2013:* verordening (EU) nr. 1380/2013 van het Europees Parlement en de Raad van 11 december
      2013 inzake het gemeenschappelijk visserijbeleid, tot wijziging van [Verordeningen (EG) nr. 1954/2003](32003R1954)
      en [(EG) nr. 1224/2009](32009R1224) van de Raad en tot intrekking van Verordeningen [(EG) nr. 2371/2002]
      (32002R2371) en [(EG) nr. 639/2004](32004R0639) van de Raad en Besluit [2004/585/EG](32485R2004) van de Raad (PbEU
      2013, L 354);
        - *verordening 763/2014:* Uitvoeringsverordening (EU) nr. 763/2014 van de Commissie van 11 juli 2014 houdende
      uitvoeringsbepalingen voor Verordening (EU) nr. 508/2014 van het Europees Parlement en de Raad inzake het
      Europees Fonds voor maritieme zaken en visserij met betrekking tot de technische kenmerken van voorlichtings- en
      publiciteitsmaatregelen en instructies over de vormgeving van het embleem van de Unie;
        - *visser:* natuurlijk persoon die zich bezighoudt met visserijactiviteiten en zijn hoofdberoep uitoefent aan boord
      van een vissersvaartuig dat in bedrijf is;
        - *visserijactiviteit:* visserijactiviteit als bedoeld in artikel 4, eerste lid, onderdeel 28, van verordening
      1380/2013;
        - *visserijonderneming:* onderneming die zich bezighoudt met visserijactiviteiten;
        - *visserijorganisatie:* een organisatie waarvan uit de doelstellingen in de statuten blijkt dat zij het collectief
      belang van vissers of visserijondernemingen behartigt;
        - *vissersvaartuig:* vissersvaartuig als bedoeld in artikel 4, eerste lid, onderdeel 4, van [verordening 1380/2013]
      (32013R1380);
        - *vlootregister:* register als bedoeld in artikel 24 van [verordening 1380/2013](32013R1380);
        - *wetenschappelijke organisatie:* a. onder a en b van de bijlage van de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref5] genoemde instelling voor hoger onderwijs; b.
      andere dan onder a bedoelde geheel of gedeeltelijk, meerjarig door de overheid gefinancierde onderzoeksorganisatie
      zonder winstoogmerk die activiteiten verricht met als doel de algemene wetenschappelijke of technische kennis
      uit te breiden; c. geheel of gedeeltelijk, meerjarig door een andere lidstaat van de Europese Unie gefinancierde:
      1°. openbare instelling voor hoger onderwijs gelijkwaardig aan een instelling als bedoeld onder a, 2°.
      onderzoeksorganisatie zonder winstoogmerk die activiteiten verricht met als doel de algemene wetenschappelijke en
      technische kennis uit te breiden; d. rechtspersoon ten aanzien waarvan een instelling als bedoeld onder a, b of c
      direct of indirect: 1°. meer dan de helft van het geplaatste kapitaal verschaft, 2°. volledig aansprakelijk vennoot
      is, of 3°. overwegende zeggenschap heeft;
        - *zeevisserij:* zeevisserij als bedoeld in [artikel 1, vierde lid, onderdeel b, van de Visserijwet 1963][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel5b
