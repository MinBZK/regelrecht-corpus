  - number: 3.9.7
    text: |-
      1 De subsidie bedraagt 50 procent van de subsidiabele kosten.

      2 In afwijking van het eerste lid bedraagt de subsidie:

      a. 30 procent van de subsidiabele kosten voor een onderneming die geen mkb is;

      b. 100 procent van de subsidiabele kosten:

      1°. voor een publiekrechtelijke instantie, of

      2°. voor een visserijorganisatie of algemeen nut beogende instelling die geen onderneming is als bedoeld in
      onderdeel a, wanneer het samenwerkingsproject wetenschap en visserij innovatieve kenmerken heeft.

      3 De subsidie bedraagt ten hoogste € 1.000.000 per samenwerkingsproject wetenschap en visserij.
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel3.9.7
  - number: 3.9.8
    text: |-
      1 Met de uitvoering van de op grond van deze titel gesubsidieerde samenwerkingsprojecten wetenschap en visserij
      wordt gestart na de datum van ontvangst van de subsidieaanvraag, bedoeld in [artikel 2.9][ref1], maar uiterlijk
      binnen 12 maanden na de subsidieverlening.

      2 De op grond van deze titel gesubsidieerde samenwerkingsprojecten wetenschap en visserij worden voltooid binnen 36
      maanden na subsidieverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel2.9
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel3.9.8
    references:
      - id: ref1
        bwb_id: BWBR0036758
        artikel: '2.9'
        hoofdstuk: '2'
  - number: 3.9.9
    text: |-
      De subsidieontvanger of het samenwerkingsverband draagt er zorg voor dat de resultaten van kennisvragen en
      onderzoeken waarvoor op grond van deze titel subsidie is verstrekt, vanaf het moment dat de desbetreffende
      kennisvragen en onderzoeken zijn afgerond en tot drie jaar na het tijdstip waarop de aanvraag tot
      subsidievaststelling is ingediend, beschikbaar worden gesteld op een website die voor een ieder gratis toegankelijk
      is.
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel3.9.9
  - number: 3.9.10
    text: |-
      De minister beslist afwijzend op een aanvraag tot subsidieverlening voor een samenwerkingsproject wetenschap
      en visserij voor zover de subsidiabele kosten, bedoeld in [artikel 1.3, eerste lid][ref1], minder dan € 150.000
      bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel1.3
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel3.9.10
