  - number: '1.2'
    text: |-
      Onverminderd artikel 65, elfde lid, van [verordening 1303/2013](32013R1303), wordt, indien reeds door een
      bestuursorgaan of de Europese Commissie subsidie is verstrekt voor de subsidiabele kosten of een deel daarvan,
      slechts een zodanig bedrag aan subsidie verstrekt dat het totale bedrag aan subsidies niet meer bedraagt dan het
      bedrag dat volgens de toepasselijke Europese verordeningen toegestaan is.
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel1.2
  - number: '1.3'
    text: |-
      1 Voor zover zij direct verbonden zijn met de uitvoering van de desbetreffende subsidiabele activiteit, komen als
      subsidiabele kosten in aanmerking:

      a. loonkosten, al dan niet in combinatie met overheadkosten, voor zover zij zijn berekend overeenkomstig
      [artikel 1.4, eerste lid][ref1], tot ten hoogste het aantal uren dat voor berekening van het uurtarief, bedoeld in
      artikel 1.4, eerste lid, onderdeel a, onder 1°, 2° en 5°, is gebruikt;

      b. bijdragen in natura als bedoeld in artikel 69, eerste lid, van [verordening 1303/2013](32013R1303);

      c. afschrijvingskosten als bedoeld in artikel 69, tweede lid, van [verordening 1303/2013](32013R1303);

      d. andere kosten waarvoor een factuur of document met gelijkwaardige bewijskracht kan worden overlegd of voor zover
      zij zijn berekend overeenkomstig [artikel 1.4a][ref2].

      2 De kosten, bedoeld in het eerste lid, onderdelen b en c, kunnen worden berekend overeenkomstig
      [artikel 1.4a][ref3].

      3 Het eerste lid is niet van toepassing op het verstrekken van subsidie in het kader van Europese territoriale
      samenwerking als bedoeld in [paragraaf 5.4][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel1.4
      [ref2]: https://wetten.overheid.nl/BWBR0036758#Artikel1.4a
      [ref3]: https://wetten.overheid.nl/BWBR0036758#Artikel1.4a
      [ref4]: https://wetten.overheid.nl/BWBR0036758#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel1.3
    references:
