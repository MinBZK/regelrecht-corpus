    text: |-
      1 Het subsidieplafond voor subsidies als bedoeld in [artikel 5.4.1][ref1] is voor de gehele programmaperiode:

      a. voor het programma dat de provincies Groningen, Friesland, Drenthe, Overijssel, Flevoland, Gelderland en
      de COROP-gebieden Noordoost-Noord-Brabant, Zuidoost-Noord Brabant, Noord-Limburg, Midden-Limburg alsmede de in
      aanmerking komende Duitse gebieden beslaat: € 22.300.000;

      b. voor het programma dat de provincies Zeeland, Noord-Brabant, Limburg alsmede de in aanmerking komende Vlaamse
      gebieden beslaat: € 14.900.000;

      c. voor het programma dat de provincie Zeeland en de COROP-gebieden Kop van Noord-Holland, Alkmaar en omgeving,
      IJmond, Agglomeratie Haarlem, Agglomeratie ’s-Gravenhage, Delft en Westland, Agglomeratie Leiden en Bollenstreek,
      Groot-Rijnmond, Zuidoost-Zuid-Holland, West-Noord-Brabant alsmede de in aanmerking komende Engelse, Belgische en
      Franse gebieden beslaat: € 8.200.000, en

      d. voor het programma dat de COROP-gebieden Midden-Limburg, Zuid-Limburg, Zuidoost-Noord Brabant alsmede de in
      aanmerking komende Belgische en Duitse gebieden beslaat: € 3.600.000.

      2 De minister verleent eenmaal per jaar een voorschot.

      3 Rentebaten over een voorschot worden op dezelfde wijze besteed als de programmasubsidie of als de subsidie,
      bedoeld in [artikel 5.4.1, tweede lid][ref2].


