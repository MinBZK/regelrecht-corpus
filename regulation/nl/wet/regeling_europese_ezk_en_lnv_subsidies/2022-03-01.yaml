  - number: 4.5.3
    text: |-
      1 De subsidie wordt verleend aan:

      a. een gecertificeerd agrarisch collectief;

      b. een samenwerkingsverband van twee of meer gecertificeerde agrarische collectieven;

      c. een samenwerkingsverband dat bestaat uit een of meer gecertificeerde agrarische collectieven samen met
      landbouwers, producentengroeperingen, andere MKB-bedrijven, coöperaties of brancheorganisaties; of

      d. een samenwerkingsverband dat bestaat uit tenminste één landbouwer samen met andere landbouwers,
      producentengroeperingen, coöperaties, andere MKB-bedrijven of brancheorganisaties.

      2 Samenwerkingsverbanden als bedoeld in het eerste lid, onderdeel c, komen slechts voor subsidie in aanmerking
      indien:

      a. een deelnemende natuurlijke persoon geen eigenaar is van of zeggenschap heeft over een deelnemende
      rechtspersoon; en

      b. een deelnemende rechtspersoon niet dezelfde eigenaar heeft als een andere deelnemende rechtspersoon.

      3 Indien de subsidie wordt aangevraagd door een samenwerkingsverband als bedoeld in het eerste lid, onderdeel c, is
      een gecertificeerd agrarisch collectief dat deelneemt aan het samenwerkingsverband penvoerder.

      4 In afwijking van het eerste lid wordt subsidie voor een project dat bijdraagt aan de doelstellingen als bedoeld
      in [artikel 4.5.2, tweede lid, onderdeel a][ref1], alleen verleend aan een begunstigde als bedoeld in het eerste
      lid, onderdelen a, b en c.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel4.5.2
