  - number: 3.9.1
    text: |-
      In deze titel wordt verstaan onder:

        - *kennissysteem:* netwerk, partnerschapovereenkomst of vereniging als bedoeld in artikel 28, eerste lid, onderdeel
      a, van [verordening 508/2014](32014R0508);
        - *publiekrechtelijke instantie:* publiekrechtelijke instantie als bedoeld in artikel 2, punt 16, van [verordening
      1303/2013](32013R1303);
        - *samenwerkingsproject wetenschap en visserij:* project gericht op het opzetten van een kennissysteem of op
      activiteiten als bedoeld in artikel 28, eerste lid, onderdeel b, juncto tweede lid, van [verordening 508/2014]
      (32014R0508) die worden verricht in het kader van een kennissysteem.
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel3.9.1
  - number: 3.9.2
    text: |-
      De minister verstrekt op aanvraag subsidie voor de uitvoering van een samenwerkingsproject wetenschap en visserij
      aan:

      a. vissers;

      b. visserijorganisaties;

      c. algemeen nut beogende instellingen;

      d. publiekrechtelijke instanties, of

      e. een samenwerkingsverband van twee of meer van de in de onderdelen a tot en met d bedoelde partijen.
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel3.9.2
  - number: 3.9.3
    text: |-
      Onverminderd de [artikelen 2.9][ref1] en [3.1.4][ref2] bevat een aanvraag tot subsidieverlening:

      a. indien de aanvraag betrekking heeft op het opzetten van een kennissysteem: een verklaring van de
      wetenschappelijke organisatie, waaruit de actieve rol van deze wetenschappelijke organisatie binnen het
      kennissysteem blijkt;

      b. indien de aanvraag alleen betrekking heeft op activiteiten als bedoeld in artikel 28, eerste lid, onderdeel b,
      juncto tweede lid, van [verordening 508/2014](32014R0508): een bewijs van het bestaan van het kennissysteem en van
      de actieve rol van de wetenschappelijke organisatie daarbinnen;

      c. indien de subsidieaanvrager een visserijorganisatie of algemeen nut beogende instelling is en deze bij de
      aanvraag aangeeft het subsidiepercentage, bedoeld in [artikel 3.9.7, tweede lid, onderdeel b, onder 2°][ref3], te
      willen ontvangen: gegevens waaruit de innovatieve kenmerken van het project blijken.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel2.9
      [ref2]: https://wetten.overheid.nl/BWBR0036758#Artikel3.1.4
      [ref3]: https://wetten.overheid.nl/BWBR0036758#Artikel3.9.7
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel3.9.3
