    text: |-
      1 De minister verleent ten hoogste vier maal per jaar voorschotten.

      2 De subsidieontvanger, bedoeld in [artikel 4.5.3, eerste lid, onderdeel a][ref1], of de penvoerder van een
      samenwerkingsverband als bedoeld in artikel 4.5.3, eerste lid, onderdelen b, c en d, dient een aanvraag voor een
      voorschot in na afloop van de uitvoering van een product of activiteit, bedoeld in [bijlage 4][ref2], onderdeel
      A, kolom 1, ter hoogte van het overeenkomstig bijlage 4, onderdeel A, kolom 3, voor dat product of die activiteit
      bepaalde respectievelijk berekende bedrag, vermeerderd met additionele kosten als bedoeld in bijlage 4, onderdeel
      A, kolom 4.

      3 Onverminderd [artikel 2.14, eerste lid][ref3], bedraagt het voorschot dat wordt verleend aan een
      subsidieontvanger als bedoeld in [artikel 4.5.3, eerste lid, onderdeel a][ref4], ten minste € 50.000, en bedraagt
      de som van de voorschotten die naar aanleiding van een aanvraag worden verleend aan de deelnemers van een
      samenwerkingsverband als bedoeld in artikel 4.5.3, eerste lid, onderdelen b, c, en d, ten minste € 50.000.


