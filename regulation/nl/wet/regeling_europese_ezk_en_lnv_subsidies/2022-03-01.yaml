  - number: 3.1.4.a
    text: |-
      Voor zover de subsidieontvanger voor de kosten waarvoor hij een voorschot als bedoeld in [artikel 2.14][ref1]
      aanvraagt, een opdracht als bedoeld in [artikel 3.1.6, tweede lid][ref2], heeft verleend, bevat de aanvraag tot
      voorschotverlening als bedoeld in artikel 2.14, kopieën van de opgevraagde offertes als bedoeld in artikel 3.1.6,
      tweede lid, en de relevante redenen voor een op basis van deze offertes genomen gunningsbeslissing.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel2.14
      [ref2]: https://wetten.overheid.nl/BWBR0036758#Artikel3.1.6
