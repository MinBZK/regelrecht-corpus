    text: |-
      1 De minister beslist afwijzend op een aanvraag tot subsidieverlening indien de aanvraag niet voldoet aan de bij
      deze regeling gestelde regels.

      2 De minister beslist afwijzend op een aanvraag tot subsidieverlening voor zover:

      a. onvoldoende vertrouwen bestaat dat de betrokkenen de activiteiten kunnen financieren;

      b. het onaannemelijk wordt geacht dat de activiteiten binnen een bij deze regeling gestelde termijn kunnen worden
      voltooid;

      c. de activiteiten voor het indienen van de subsidieaanvraag zijn voltooid;

      d. de activiteiten onvoldoende bijdragen aan de doelstellingen van de subsidie.
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel2.11
  - number: '2.12'
    text: |-
      1 Indien het subsidieplafond wordt verdeeld op volgorde van rangschikking, wordt een beschikking tot
      subsidieverlening gegeven binnen 22 weken na afloop van de periode van het aanvragen van de subsidie.

      2 Indien het subsidieplafond op een andere wijze wordt verdeeld, wordt een beschikking tot subsidieverlening
      gegeven binnen 13 weken na afloop van het aanvragen van de subsidie.
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel2.12
  - number: '2.13'
    text: |-
      Indien de subsidie wordt verleend aan deelnemers in een samenwerkingsverband, verzendt de minister de beschikkingen
      tot subsidieverlening aan de penvoerder.
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel2.13
  - number: '2.14'
    text: |-
      1 Indien in deze regeling is bepaald dat er voorschotten worden verstrekt, bedraagt het voorschot ten hoogste 90%
      van de te verlenen subsidie.

      2 Een voorschot wordt op aanvraag verstrekt met gebruikmaking van een middel, dat door de minister beschikbaar
      wordt gesteld.

      3 Het voorschot wordt aangevraagd door de subsidieontvanger of de penvoerder.

      4 Een voorschot wordt verstrekt voor de volgende gemaakte kosten:

      a. loonkosten en overheadkosten als bedoeld in [artikel 1.3, onderdeel a][ref1];

      b. bijdragen in natura als bedoeld in [artikel 1.3, onderdeel b][ref2];

      c. afschrijvingskosten als bedoeld in [artikel 1.3, onderdeel c][ref3];

      d. kosten als bedoeld in [artikel 1.3, onderdeel d][ref4], voor zover deze kosten ook betaald zijn.

      5 Voor zover van toepassing gaat een aanvraag om een voorschot vergezeld van gegevens over de netto-inkomsten,
      bedoeld in artikel 65, achtste lid, van verordening 1303/2013.


