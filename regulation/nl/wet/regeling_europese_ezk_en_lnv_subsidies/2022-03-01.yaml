        bwb_id: BWBR0036758
        artikel: '1.4'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0036758
        artikel: '1.4'
        hoofdstuk: '1'
  - number: 5.2.13
    text: |-
      1 De managementautoriteit kan verplichtingen verbinden aan de subsidie.

      2 De managementautoriteit verbindt zodanig verplichtingen aan de subsidie dat de subsidieontvanger aan de
      certificeringsautoriteit en de auditautoriteit de medewerking verleent die zij voor hun taakvervulling nodig
      hebben.
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel5.2.13
  - number: 5.2.14
    text: |-
      Een aanvraag om subsidievaststelling wordt ingediend met gebruikmaking van een middel dat door de
      managementautoriteit beschikbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel5.2.14
  - number: 5.2.15
    text: De managementautoriteit geeft binnen 26 weken een beschikking op een aanvraag tot subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel5.2.15
  - number: 5.3.1
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan degene die een project tot stand brengt dat past in een programma
      en dat bijdraagt aan de realisatie van het Rijksbeleid op het gebied van innovatie of koolstofarme economie.

      2 De minister verstrekt op aanvraag subsidie aan degene die een project tot stand brengt dat past in een programma
      en dat bijdraagt aan:

      a. de realisatie van het Rijksbeleid, bedoeld in het eerste lid, en

      b. de bevordering van het crisisherstel in de context van de COVID-19-pandemie en de voorbereiding van een groen,
      digitaal en veerkrachtig herstel van de economie.
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel5.3.1
  - number: 5.3.2
    text: |-
      1 Het subsidieplafond voor subsidies als bedoeld in [artikel 5.3.1, eerste lid][ref1], is voor de gehele
      programmaperiode:

      a. voor het programma dat de provincies Groningen, Friesland en Drenthe beslaat: € 18.823.000;

      b. voor het programma dat de provincies Overijssel en Gelderland beslaat: € 18.241.000;

      c. voor het programma dat de provincies Limburg, Noord-Brabant en Zeeland beslaat: € 20.634.000;

      d. voor het programma dat de provincies Zuid-Holland, Noord-Holland, Utrecht en Flevoland beslaat: € 34.302.000.

      2 Het subsidieplafond voor subsidies als bedoeld in [artikel 5.3.1, tweede lid][ref2], is voor de gehele
      programmaperiode:

      a. voor het programma dat de provincies Groningen, Friesland en Drenthe beslaat: € 6.123.000;

      b. voor het programma dat de provincies Overijssel en Gelderland beslaat: € 5.931.000;

      c. voor het programma dat de provincies Limburg, Noord-Brabant en Zeeland beslaat: € 6.720.000;

      d. voor het programma dat de provincies Zuid-Holland, Noord-Holland, Utrecht en Flevoland beslaat: € 11.226.000.

      3 Het voor de cofinanciering beschikbare bedrag wordt in jaarlijkse tranches beschikbaar gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel5.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0036758#Artikel5.3.1
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel5.3.2
    references:
      - id: ref1
        bwb_id: BWBR0036758
        artikel: 5.3.1
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref2
        bwb_id: BWBR0036758
        artikel: 5.3.1
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.3.3
    text: |-
      De minister beslist afwijzend op een aanvraag om subsidie, indien:

      a. het project onvoldoende bijdraagt aan de realisatie van het in [artikel 5.3.1, eerste lid][ref1], bedoelde
      Rijksbeleid;

      b. een aanvraag om subsidie betrekking heeft op subsidies als bedoeld in [artikel 5.3.1, tweede lid][ref2], indien
      het project onvoldoende bijdraagt aan de bevordering van het crisisherstel in de context van de COVID-19-pandemie
      en de voorbereiding van een groen, digitaal en veerkrachtig herstel van de economie; of

      c. de subsidieaanvrager niet in aanmerking komt voor subsidie op grond van [paragraaf 5.2][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel5.3.1
