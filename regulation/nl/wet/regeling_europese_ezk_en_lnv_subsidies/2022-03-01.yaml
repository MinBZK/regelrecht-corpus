  - number: 4.1.9
    text: |-
      1 De betaling van de subsidie, bedoeld in [artikel 4.1.2][ref1], geschiedt overeenkomstig
      [artikel 4:89, vierde lid, van de Algemene wet bestuursrecht][ref2] en overeenkomstig een door de aanvrager daartoe
      verstrekte volmacht als bedoeld in [titel 3 van Boek 3 van het Burgerlijk Wetboek][ref3], aan de verzekeraar met
      wie de landbouwer de verzekering heeft gesloten.

      2 Bij gebreke van een volmacht als bedoeld in het eerste lid vindt betaling plaats door bijschrijving op een door
      de aanvrager opgegeven bankrekening.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel4.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel489
      [ref3]: https://wetten.overheid.nl/BWBR0005291
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel4.1.9
