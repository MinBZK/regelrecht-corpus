  - number: 3.9.12
    text: |-
      Indien de subsidieaanvrager een visserijorganisatie of een algemeen nut beogende instelling is en deze bij de
      aanvraag aangeeft het subsidiepercentage, bedoeld in [artikel 3.9.7, tweede lid, onderdeel b, onder 2°][ref1], te
      willen ontvangen, adviseert de adviescommissie EFMZV, in aanvulling op [artikel 3.1.8][ref2], de minister over de
      innovatieve kenmerken van het door die subsidieaanvrager ingediende samenwerkingsproject wetenschap en visserij.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel3.9.7
      [ref2]: https://wetten.overheid.nl/BWBR0036758#Artikel3.1.8
