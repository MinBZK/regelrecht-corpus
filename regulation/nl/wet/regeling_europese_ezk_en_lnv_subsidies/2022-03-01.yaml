    text: |-
      1 Het subsidieplafond voor deze module bedraagt € 7.500.000.

      2 De minister verdeelt per openstelling het subsidieplafond op volgorde van rangschikking van de aanvragen als
      bedoeld in de [artikelen 2.4, onderdeel b][ref1], en [2.6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel2.4
