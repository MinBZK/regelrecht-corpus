  - number: 4.5.9
    text: |-
      1 De subsidieontvanger neemt in het plan op:

      a. een uitwerking op het niveau van het gebied of de sector van doelen op het gebied van:

      1°. matiging van en aanpassing aan klimaatverandering en duurzame energie;

      2°. duurzame ontwikkeling en efficiënt beheer van natuurlijke hulpbronnen zoals water, bodem en lucht; of

      3°. de bescherming van de biodiversiteit, het versterken van ecosysteemdiensten en de instandhouding van habitats
      en landschappen;

      b. een beschrijving van de huidige situatie in het gebied of de sector in het licht van de doelen, bedoeld in
      onderdeel a;

      c. een beschrijving van maatregelen op of aanpalend aan landbouwgrond die op effectieve en efficiënte wijze kunnen
      bijdragen aan het behalen van de doelen, bedoeld in onderdeel a;

      d. een beschrijving van maatregelen die op effectieve en efficiënte wijze kunnen bijdragen aan het behalen van een
      van de doelen, bedoeld in [4.5.2, tweede lid][ref1];

      e. de verwachte uitkomsten van de maatregelen, bedoeld in onderdelen c en d;

      f. een beschrijving van de rol en de taken van de bij de uitvoering van het plan betrokken partijen;

      g. een kaart waarop is aangegeven waar de maatregelen, bedoeld in onderdeel c, uitgevoerd kunnen worden;

      h. (een inschatting van) de (neven)effecten op andere actoren binnen of buiten het projectgebied of sector; en

      i. de startdatum van proefprojecten.

      2 De subsidieontvanger spant zich in om samen te werken met andere ontvangers van de subsidie met het oog op het
      uitwisselen van ervaringen, het ontwikkelen van ideeën en het opstellen van gezamenlijke rapportages.

      3 De subsidieontvanger maakt de resultaten van de activiteit openbaar via het EIP-netwerk, bedoeld in artikel 53
      van [verordening 1305/2013](32013R1305), en andere geëigende netwerken.

      4 De subsidieontvanger start de uitvoering van de activiteit uiterlijk twee maanden na de dagtekening van de
      subsidieverlening.

      5 De subsidieontvanger, bedoeld in [artikel 4.5.3, eerste lid, onderdeel a][ref2], of de penvoerder van een
      samenwerkingsverband als bedoeld in artikel 4.5.3, eerste lid, onderdelen b, c en d, dient in voorkomend geval
      uiterlijk 31 december 2022 een tussenrapportage in bij de minister. Deze tussenrapportage bevat een overzicht van
      de uitgevoerde activiteiten en de behaalde deelresultaten.

      6 De activiteiten ter uitvoering van proefprojecten voldoen aan de volgende voorwaarden:

      a. uitvoering vindt plaats op landbouwgrond of in, aan of op landschapselementen, of watergangen direct grenzend
      aan landbouwgrond, waarbij sprake mag zijn van een scheiding van die landbouwgrond door een kavelpad of watergang;

      b. de subsidieontvanger doet uiterlijk twee weken voor aanvang van de activiteit een opgave van deze activiteit op
      perceelsniveau in het daartoe door de minister beschikbaar gestelde systeem;

      c. de subsidieontvanger meldt een wijziging van een activiteit op perceelsniveau uiterlijk één week voorafgaand
      aan het ingaan van de wijziging aan de minister door de wijziging op perceelsniveau door te voeren via het systeem,
      bedoeld in onderdeel b.

      7 De subsidieontvanger verleent gedurende ten hoogste vijf jaar na de datum van de beschikking tot
      subsidievaststelling medewerking aan een evaluatie van de effecten van de door hem uitgevoerde activiteiten,
      bedoeld in [artikel 4.5.2, derde lid][ref3], voor zover deze medewerking redelijkerwijs van hem verlangd kan
      worden.


