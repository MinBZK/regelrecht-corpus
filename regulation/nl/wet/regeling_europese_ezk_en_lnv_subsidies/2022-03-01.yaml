  - number: 4.7.2
    text: |-
      1 De minister verstrekt op aanvraag subsidie voor een investering, opgenomen in [bijlagen 5][ref1] en [6][ref2]
      bij deze regeling, in een van de volgende categorieën:

      a. Precisielandbouw en Smart Farming;

      b. Digitalisering;

      c. Water;

      d. Duurzame bedrijfsvoering; en

      e. Natuurinclusieve landbouw en kringlooplandbouw.

      2 Per landbouwbedrijf kan een aanvraag voor maximaal twee verschillende investeringen worden gedaan.

      3 Onverminderd [artikel 2.9][ref3] bevat een aanvraag tot subsidieverlening in ieder geval:

      a. het KVK-nummer van het landbouwbedrijf;

      b. een offerte voor de investering of investeringen, bedoeld in [bijlagen 5][ref4] en [6][ref5]; en

      c. de voor de investering of investeringen benodigde bewijsstukken, opgenomen in [bijlagen 5][ref6] en [6][ref7].

      4 Onverminderd het derde lid bevat een aanvraag tot subsidieverlening, wanneer de subsidie wordt aangevraagd
      door een jonge landbouwer als bedoeld in [artikel 4.7.3, tweede lid][ref8], de notariële akte van overdracht van
      aandelen of van de oprichting van de besloten vennootschap en het aandelenregister of de door alle maten getekende
      maatschapsakte met vermelding van alle maten.


      [ref1]: https://wetten.overheid.nl/BWBR0036758
