  - number: '2.2'
    text: |-
      De minister kan op aanvraag voor activiteiten op de gebieden, genoemd in
      [artikel 2 van de Kaderwet EZ-subsidies][ref1], en voor activiteiten als bedoeld in [verordening 508/2014]
      (32014R0508) subsidie verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0007919#Artikel2
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0007919
        artikel: '2'
  - number: '2.3'
    text: |-
      1 De minister kan op grond van deze regeling uitsluitend subsidie verstrekken indien hij de mogelijkheid tot het
      doen van een aanvraag tot subsidieverlening heeft opengesteld door vaststelling van een subsidieplafond en een
      periode voor indiening van de aanvraag.

      2 De minister kan de openstelling beperken tot bepaalde activiteiten, categorieën van aanvragers of een bepaald
      aantal aanvragen.

      3 De minister kan verschillende subsidieplafonds vaststellen voor verschillende activiteiten of categorieën van
      aanvragers.
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel2.3
  - number: '2.4'
    text: |-
      De minister verdeelt het subsidieplafond:

      a. op volgorde van binnenkomst van de aanvragen;

      b. op volgorde van rangschikking van de aanvragen;

      c. evenredig over de ingediende aanvragen, of

      d. door loting.
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel2.4
  - number: '2.5'
    text: |-
      1 Indien wordt gekozen voor verdeling van het subsidieplafond op volgorde van binnenkomst van de aanvragen, komt de
      aanvraag die het eerst is binnengekomen, het eerst voor subsidie in aanmerking.

      2 Indien een aanvrager niet heeft voldaan aan enig wettelijk voorschrift voor het in behandeling nemen van de
      aanvraag en met toepassing van [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad de
      aanvraag aan te vullen, geldt met betrekking tot de verdeling de dag of het tijdstip waarop de aanvraag voldoet aan
      de wettelijke voorschriften als datum of tijdstip van binnenkomst.

      3 Indien de minister op de dag dat het subsidieplafond wordt bereikt meer dan één aanvraag ontvangt, en de volgorde
      van die aanvragen niet op grond van het tijdstip van binnenkomst kan worden vastgesteld, stelt hij de onderlinge
      rangschikking van die aanvragen vast door middel van loting.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:5
  - number: '2.6'
    text: |-
      1 Indien wordt gekozen voor verdeling van het subsidieplafond op volgorde van rangschikking van de aanvragen, komt
      de aanvraag die naar het oordeel van de minister de grootste bijdrage levert aan de doelstelling van de subsidie,
      het eerst voor subsidie in aanmerking.

      2 Voor zover het subsidieplafond wordt overschreden, stelt de minister de onderlinge rangschikking van die
      aanvragen die bij de beoordeling gelijk zijn gerangschikt vast door middel van loting.
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel2.6
  - number: '2.7'
    text: |-
      Indien per categorie van aanvragers of activiteiten een subsidieplafond is vastgesteld, vindt de verdeling, bedoeld
      in [artikel 2.4][ref1], plaats per categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel2.4
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0036758
        artikel: '2.4'
        hoofdstuk: '2'
  - number: '2.8'
    text: |-
      1 De minister kan een adviescommissie instellen.

      2 Een adviescommissie heeft tot taak de minister op zijn verzoek te adviseren omtrent aanvragen om subsidie.

      3 De adviezen van een adviescommissie gaan vergezeld van een deugdelijke motivering.

      4 Een adviescommissie bestaat uit een voorzitter en een aantal leden. De leden zijn deskundig op het terrein waarop
      de adviescommissie een taak heeft. De voorzitter en de leden zijn geen ambtenaren, werkzaam bij het Ministerie van
      Economische Zaken of andere ministeries die voor de subsidie verantwoordelijk zijn of mede verantwoordelijk zijn.

      5 De voorzitter en de leden worden door de minister benoemd en ontslagen.

      6 Bij de instelling van een adviescommissie worden de periode waarvoor de voorzitter en de leden worden benoemd en
      het aantal leden vastgesteld.

      7 Een adviescommissie stelt haar eigen werkwijze schriftelijk vast.

      8 Een lid van een adviescommissie neemt niet deel aan de voorbereiding en vaststelling van een advies, indien hij
      een persoonlijk belang heeft bij de beschikking op de aanvraag.

      9 De minister kan waarnemers aanwijzen, die het recht hebben de vergaderingen van een adviescommissie bij te wonen.

      10 In het secretariaat van een adviescommissie wordt door de minister voorzien.

      11 Het beheer van de bescheiden betreffende de werkzaamheden van een adviescommissie geschiedt op overeenkomstige
      wijze als bij het Ministerie van Economische Zaken. De bescheiden worden na beëindiging van de werkzaamheden van
      een adviescommissie bewaard in het archief van dat ministerie.

      12 Een adviescommissie verstrekt desgevraagd aan de minister de voor de uitoefening van zijn taak benodigde
      inlichtingen. De minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de
      vervulling van zijn taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel2.8
  - number: '2.9'
    text: |-
      1 Een aanvraag tot subsidieverlening wordt ingediend met gebruikmaking van een middel, dat door de minister
      beschikbaar wordt gesteld.

      2 Bij een aanvraag tot subsidieverlening wordt in voorkomend geval mededeling gedaan van andere inkomsten,
      waaronder subsidies, waarmee de activiteit waarop de subsidie betrekking heeft wordt of zal worden gefinancierd.

      3 Een aanvraag tot subsidieverlening bevat in ieder geval gegevens over:

      a. de subsidieaanvrager, waaronder naam van de natuurlijke persoon, rechtspersoon of publieke instelling, adres
      en rekeningnummer;

      b. voor zover van toepassing gegevens over de netto-inkomsten als bedoeld in de artikelen 61 of 65, achtste lid,
      van [verordening 1303/2013](32013R1303).

      4 Een aanvraag tot subsidieverlening voor een project gaat vergezeld van een projectplan, waarin ten minste zijn
      opgenomen:

      a. een beschrijving van het project, waaronder:

      1°. de doelstellingen;

      2°. een probleemanalyse waaruit onder andere de noodzaak van het project en de ter uitvoering daarvan te maken
      kosten blijken;

      3°. de activiteiten en wijze van uitvoering daarvan;

      4°. voor zover van toepassing een overzicht van de aan het samenwerkingsverband deelnemende partijen en de
      verdeling van verantwoordelijkheden, bevoegdheden en financiële verplichtingen van de deelnemers, alsmede een
      bewijsstuk waaruit blijkt dat de penvoerder bevoegd is om namens de deelnemers aan het samenwerkingsverband te
      handelen;

      b. informatie waaruit blijkt in hoeverre het project bijdraagt aan de doeleinden waarvoor subsidie wordt verstrekt;

      c. een sluitende begroting voor het project, die een meerjarenbegroting is met liquiditeitsplanning per jaar voor
      zover het project langer dan een jaar duurt, met een toelichting daarop;

      d. criteria voor het toetsen van de resultaten van het project;

      e. de verwachte realisatietermijn, met een beschrijving van het tijdpad en mijlpalen indien de termijn langer dan
      een jaar is.

      5 Indien aanvragers van subsidie samenwerken in een samenwerkingsverband, dient de penvoerder een aanvraag in.
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel2.9
  - number: '2.10'
    text: |-
      Onverminderd [artikel 1.5][ref1], komen in geval van een samenwerkingsverband, kosten die een deelnemer van het
      samenwerkingsverband in rekening brengt bij een andere deelnemer aan het samenwerkingsverband niet voor subsidie
      in aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel1.5
