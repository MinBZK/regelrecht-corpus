  - number: 4.5.1
    text: |-
      In deze titel wordt verstaan onder:

        - *gecertificeerd agrarisch collectief:* vereniging met volledige rechtsbevoegdheid bestaande uit landbouwers
      en andere grondgebruikers van landbouwgrond, die beschikt over een geldig certificaat collectief agrarisch
      natuurbeheer, verleend door gedeputeerde staten van de provincie op wiens grondgebied haar werkgebied is gelegen;
        - *veenweidegebied:* veengrond als bedoeld in [artikel 1, eerste lid, onderdeel n, van de Meststoffenwet][ref1] in
      de provincies Fryslan, Noord-Holland, Zuid-Holland, Utrecht en in provincie Groningen in de gemeenten Groningen,
      Midden-Groningen en Westerkwartier en in provincie Overijssel in de gemeenten Kampen, Staphorst, Steenwijkerland,
      Zwartewaterland en Zwolle;
        - *verordening 1306/2013:* verordening (EU) nr. 1306/2013 van het Europees Parlement en de Raad van 17 december
      2013 inzake de financiering, het beheer en de monitoring van het gemeenschappelijk landbouwbeleid en tot intrekking
      van [Verordeningen (EEG) nr. 352/78](31978R0352), [(EG) nr. 165/94](31994R0165), [(EG) nr. 2799/98](31998R2799),
      [(EG) nr. 814/2000](32000R0814), [(EG) nr. 1290/2005](32005R1290) en [(EG) nr. 485/2008](32008R0485) van de Raad
      (PbEU 2013, L 347);
        - *zand- en lössgrond:* zand- en lössgrond als bedoeld in
      [artikel 1, eerste lid, onderdeel o, van de Meststoffenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel1
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel4.5.1
