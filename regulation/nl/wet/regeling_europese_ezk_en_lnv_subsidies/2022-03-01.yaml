        hoofdstuk: '2'
  - number: 4.4.5
    text: |-
      1 De minister rangschikt een aanvraag voor subsidie, waarop niet afwijzend is beslist, hoger naarmate de
      vleeskalverenhouder meer stalplaatsen heeft, een hoger percentage van ammoniakreductie wordt bereikt en in een
      groter deel van het bedrijf deze ammoniakreductie wordt bereikt. Voor de rangschikking worden de volgende criteria
      toegepast:

      a. aantal stalplaatsen, waaraan de volgende scores worden toegekend met een wegingsfactor 1:

      1°. minder dan 400 stalplaatsen: 1 punt;

      2°. tussen de 400 en 600 stalplaatsen: 2 punten, en

      3°. meer dan 600 stalplaatsen: 3 punten.

      b. het gemiddelde percentage ammoniakreductie dat wordt bereikt bij gebruik van al dan niet meerdere systemen op
      het bedrijf, waaraan de volgende scores worden toegekend met een wegingsfactor 2:

      1°. een reductiepercentage van minder dan 50 procent: 1 punt;

      2°. een reductiepercentage tussen de 50 tot en met 70 procent: 2 punten, en

      3°. een reductiepercentage van meer 70 procent: 3 punten.

      c. voor welk deel van het bedrijf, uitgedrukt in een percentage, reducerende maatregelen worden getroffen, waaraan
      de volgende scores worden toegekend met een wegingsfactor 1:

      1°. het percentage bedraagt minder dan 30 procent: 1 punt;

      2°. het percentage bedraagt tussen de 30 tot en met 60 procent: 2 punten, en

      3°. het percentage bedraagt meer dan 60 procent: 3 punten.

      2 Het aantal punten dat wordt behaald, betreft de score onder a, b en c van het eerste lid vermeerderd met de
      wegingsfactor. Het maximum aantal punten is 12.

      3 Indien een aanvraag minder dan 4 punten behaalt, wordt de aanvraag afgewezen.

      4 Aanvragen worden op volgorde van rangschikking toegewezen.
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel4.4.5
