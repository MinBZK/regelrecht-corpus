  - number: 4.1.12
    text: |-
      1 De goedkeuring, bedoeld in [artikel 4.1.11, eerste lid][ref1], kan op verzoek van de verzekeraar steeds voor een
      periode van een jaar worden verlengd.

      2 De verzekeraar dient vóór 15 januari een verzoek tot verlenging van de goedkeuring in bij de minister en meldt
      daarbij de eventuele wijzigingen van de verzekeringsvoorwaarden.

      3 De minister beslist binnen 6 weken op het verzoek, bedoeld in het eerste lid.

      4 Bij een verzoek tot verlenging verstrekt de verzekeraar het totaalbedrag aan schade-uitkeringen gedaan op het
      product brede weersverzekering van het jaar voorafgaande aan het jaar waarvoor verzoek tot verlenging van de
      goedkeuring van de verzekeringsvoorwaarden wordt aangevraagd.

      5 Alvorens te besluiten op het verzoek tot verlenging beoordeelt de minister de redelijkheid van kosten als
      bedoeld in artikel 48, tweede lid, onderdeel e, van [verordening 809/2014](32014R0809) aan de hand van de met de
      schade-uitkeringsbedragen berekende loss ratio over de vijf voorafgaande jaren. Indien de minister na onderzoek
      concludeert dat niet meer van redelijke kosten kan worden gesproken moet de verzekeraar binnen een door de minister
      te bepalen termijn aangeven op welke wijze het meerjarig loss ratio getal in het nieuwe verzekeringsjaar weer boven
      de daartoe door de minister vastgestelde signaleringswaarde wordt gebracht. Indien niet afdoende gewaarborgd is dat
      het meerjarig loss ratio getal beneden de signaleringswaarde blijft, wordt de goedkeuring geweigerd.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel4.1.11
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel4.1.12
    references:
      - id: ref1
        bwb_id: BWBR0036758
        artikel: 4.1.11
        hoofdstuk: '4'
        paragraaf: 4.1.2
  - number: 4.1.13
    text: |-
      1 Onder ongunstige weersomstandigheden worden in elk geval begrepen:

      a. weersomstandigheden die volgens een schade-expert of het Koninklijk Nederlands Meteorologisch Instituut met een
      natuurramp kunnen worden gelijkgesteld, en

      b. elk van de volgende weersomstandigheden:

      1°. regenval;

      2°. droogte;

      3°. (nacht)vorst;

      4°. sneeuw;

      5°. ijzel;

      6°. storm;

      7°. hagel, of

      8°. brand door blikseminslag.

      2 De weersomstandigheden, bedoeld in het eerste lid, worden geacht vooraf te zijn erkend door de minister als
      bedoeld in artikel 37, tweede lid, van [verordening 1305/2013](32013R1305). De minister kan in aanvulling daarop,
      na overleg met de brancheorganisatie van verzekeraars, ook andere ongunstige weersomstandigheden erkennen.
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel4.1.13
  - number: 4.1.14
    text: |-
      1 In afwijking van [artikel 4.1.11, eerste lid, onderdeel a, onder 1°][ref1], mag een verzekering ook tot
      uitkering komen bij een financieel verlies van 20% of minder, mits de verzekeraar ten genoegen van de minister
      onderscheidt welk deel van de premie betrekking heeft op vergoeding van het financieel verlies van de landbouwer
      van 20% of minder. In dat geval heeft de steun slechts betrekking op het gedeelte van de premie dat ziet op
      verzekeringsvoorwaarden die in overeenstemming zijn met de bepalingen van deze regeling.

      2 Het onderscheid, bedoeld in het eerste lid, moet helder zijn omschreven in de verzekeringsvoorwaarden.

      3 In afwijking van [artikel 4.1.11, eerste lid, onderdeel g][ref2], mag een verzekering voor langer dan twaalf
      maanden worden aangegaan, mits de premie jaarlijks wordt betaald en de jaarlijkse premie betrekking heeft op de
      productie van een periode van twaalf maanden.

      4 De minister publiceert een lijst van de goedgekeurde verzekeringen op de website van de Rijksdienst voor
      Ondernemend Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel4.1.11
      [ref2]: https://wetten.overheid.nl/BWBR0036758#Artikel4.1.11
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel4.1.14
    references:
