  - number: '1.7'
    text: |-
      In geval een project of investering netto-inkomsten als bedoeld in artikel 61 van [verordening 1303/2013]
      (32013R1303) genereert, brengt de bevoegde autoriteit de netto-inkomsten bij de beschikking tot subsidieverlening
      in mindering op de subsidiabele kosten overeenkomstig de methode, bedoeld in artikel 61, derde lid, onderdeel b,
      van [verordening 1303/2013](32013R1303), tenzij de bevoegde autoriteit voor de desbetreffende sector of subsector
      heeft gekozen voor een vast netto-inkomstenpercentage als bedoeld in artikel 61, derde lid, onderdeel a, van
      [verordening 1303/2013](32013R1303).
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel1.7
  - number: '1.8'
    text: |-
      De bevoegde autoriteit stelt beleidsregels vast voor de toepassing van financiële correcties, als bedoeld in
      artikel 143, tweede lid, van [verordening 1303/2013](32013R1303).
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel1.8
  - number: '1.9'
    text: |-
      Als procedure, bedoeld in artikel 140, vijfde lid, van [verordening 1303/2013](32013R1303) wordt vastgesteld de
      procedure van [bijlage 1][ref1] bij deze regeling.


