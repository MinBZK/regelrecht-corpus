        artikel: 4.8.3
        hoofdstuk: '4'
  - number: 4.8.12
    text: |-
      1 De minister verleent ten hoogste twee maal per jaar voorschotten.

      2 De subsidieontvanger, bedoeld in [artikel 4.8.3][ref1], dient een aanvraag voor een voorschot op basis van
      gerealiseerde en betaalde kosten in na afloop van de uitvoering van een product of activiteit zoals omschreven in
      het projectplan, gekoppeld aan een projectfase.

      3 De in het tweede lid genoemde aanvraag dient vergezeld te gaan van een voortgangsraportage.

      4 Onverminderd [artikel 2.14, eerste lid][ref2], bedraagt het voorschot dat wordt aangevraagd door een
      subsidieontvanger als bedoeld in [artikel 4.8.3][ref3], ten minste € 50.000.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel4.8.3
      [ref2]: https://wetten.overheid.nl/BWBR0036758#Artikel2.14
      [ref3]: https://wetten.overheid.nl/BWBR0036758#Artikel4.8.3
