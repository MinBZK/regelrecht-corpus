  - number: 4.7.1
    text: |-
      In deze titel wordt verstaan onder:

        - *investering:* investering zoals opgenomen in [bijlage 5][ref1] en [bijlage 6][ref2] en in één van de onder
      [artikel 4.7.2, eerste lid][ref3], opgenomen categorieën, waarbij producten die onmiskenbaar met elkaar verbonden
      zijn worden beschouwd als één investering;
        - *landbouwbedrijf:* alle eenheden op het grondgebied van Nederland die voor landbouwactiviteiten worden gebruikt
      en door een landbouwer worden beheerd;
        - *landbouwer:* actieve landbouwer als bedoeld in artikel 36, tweede lid, van [verordening 1305/2013](onbekend);
        - *verordening 1306/2013:* [verordening (EU) nr. 1306/2013](32013R1306) van het Europees Parlement en de Raad
      van 17 december 2013 inzake de financiering, het beheer en de monitoring van het gemeenschappelijk landbouwbeleid
      en tot intrekking van Verordeningen (EEG) nr. 352/78, (EG) nr. 165/94, (EG) nr. 2799/98, (EG) nr. 814/2000, (EG)
      nr. 1290/2005 en (EG) nr. 485/2008 van de Raad (PbEU 2013, L 347).


      [ref1]: https://wetten.overheid.nl/BWBR0036758
      [ref2]: https://wetten.overheid.nl/BWBR0036758
      [ref3]: https://wetten.overheid.nl/BWBR0036758#Artikel4.7.2
