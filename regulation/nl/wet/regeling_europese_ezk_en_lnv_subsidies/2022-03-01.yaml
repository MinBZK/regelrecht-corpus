  - number: 3.1.7
    text: |-
      1 Indien subsidie wordt verstrekt aan een eigenaar van een vissersvaartuig als bedoeld in artikel 25
      van [verordening 508/2014](32014R0508), wordt de beschikking tot subsidievaststelling onverminderd
      [artikel 4:49 van de Algemene wet bestuursrecht][ref1] ingetrokken of ten nadele van de subsidieontvanger gewijzigd
      indien het vissersvaartuig binnen vijf jaar te rekenen vanaf de datum van de laatste betaling naar buiten de
      Europese Unie wordt overgedragen.

      2 Indien subsidie wordt verstrekt voor een vaartuig dat uitsluitend in binnenwateren actief is als bedoeld in
      artikel 3, tweede lid, onderdeel 15, van verordening 508/2014, wordt de beschikking tot subsidievaststelling,
      onverminderd het eerste lid en [artikel 4:49 van de Algemene wet bestuursrecht][ref2], ingetrokken of ten nadele
      van de subsidieontvanger gewijzigd, indien het vaartuig binnen vijf jaar te rekenen vanaf de datum van de laatste
      betaling niet uitsluitend actief is in binnenwateren.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel449
