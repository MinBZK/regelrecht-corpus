  - number: 4.1.3
    text: |-
      1 Onverminderd [artikel 1.2][ref1], wordt geen subsidie verstrekt voor zover de landbouwer van overheidswege een
      andere bijdrage ontvangt voor de premie, bedoeld in [artikel 4.1.2, eerste lid][ref2].

      2 Geen subsidie wordt verstrekt indien de landbouwer zijn teelt niet tegen alle ongunstige weersomstandigheden,
      genoemd in [artikel 4.1.13][ref3], heeft verzekerd.

      3 Geen subsidie wordt verstrekt ten behoeve van de premie die wordt betaald voor de verzekering van de open teelt
      op landbouwgrond die is gelegen buiten Nederland.

      4 Onverminderd artikel 13, eerste lid, tweede alinea, van [verordening 640/2014](32014R0640) beslist de minister
      afwijzend op een aanvraag om subsidie, indien:

      a. de aanvrager niet voldoet aan [artikel 4.1.2, derde lid][ref4];

      b. de aanvrager ofwel in het geval hij een volmacht heeft verleend als bedoeld in [artikel 4.1.9][ref5], het deel
      van de verzekeringspremie dat overeenkomt met de gehele verzekeringspremie verminderd met de aangevraagde subsidie
      op grond van deze regeling, ofwel indien de aanvrager geen volmacht heeft verleend als bedoeld in artikel 4.1.9, de
      volledige verzekeringspremie, niet vóór 1 november van het jaar van de aanvraag heeft betaald, of

      c. geen toestemming als bedoeld in [artikel 4.1.8, onderdelen d en e][ref6], is gegeven.


