    text: |-
      1 De Minister verstrekt op aanvraag een programmasubsidie voor de programma’s, bedoeld in
      [artikel 5.4.2, eerste lid, onderdelen a, b en d][ref1].

      2 De Minister verstrekt op aanvraag een subsidie aan degene die een project tot stand brengt dat past in het
      programma, bedoeld in [artikel 5.4.2, eerste lid, onderdeel c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel5.4.2
      [ref2]: https://wetten.overheid.nl/BWBR0036758#Artikel5.4.2
