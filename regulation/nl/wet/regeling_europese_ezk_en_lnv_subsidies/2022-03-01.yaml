  - number: '6.2'
    text: |-
      1 Het recht zoals dat luidde voor 1 juli 2015, blijft van toepassing op:

      a. aanvragen tot subsidieverlening die voor die datum zijn ingediend op grond
      van de [Uitvoeringsregeling EFRO programmaperiode 2014–2020][ref1] of de
      [Regeling Subsidiëring brede weersverzekering][ref2];

      b. subsidies die voor die datum zijn verleend op grond van de
      [Uitvoeringsregeling EFRO programmaperiode 2014–2020][ref3] of de
      [Regeling Subsidiëring brede weersverzekering][ref4], en

      c. subsidies die voor die datum zijn vastgesteld op grond van de
      [Uitvoeringsregeling EFRO programmaperiode 2014–2020][ref5] of de
      [Regeling Subsidiëring brede weersverzekering][ref6].

      2 Het recht zoals dat luidde voor 1 januari 2016 blijft van toepassing op:

      a. aanvragen tot subsidieverlening die voor die datum zijn ingediend op grond van de
      [Regeling LNV-subsidies][ref7];

      b. subsidies die voor die datum zijn verleend op grond van de [Regeling LNV-subsidies][ref8], en

      c. subsidies die voor die datum zijn vastgesteld op grond van de [Regeling LNV-subsidies][ref9].

      3 Op aanvragen om subsidie die zijn ingediend voor het tijdstip van inwerkingtreding van een wijziging van deze
      regeling, op subsidies die voor dat tijdstip zijn verleend en op subsidies die voor dat tijdstip zijn vastgesteld,
      blijft deze regeling van toepassing zoals deze luidde voor dat tijdstip tenzij de wijziging met terugwerkende
      kracht in werking treedt.


