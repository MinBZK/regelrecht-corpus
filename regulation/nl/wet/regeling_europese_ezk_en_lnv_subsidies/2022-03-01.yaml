  - number: 3.9.4
    text: |-
      De minister verdeelt het subsidieplafond voor samenwerkingsprojecten wetenschap en visserij op volgorde van
      rangschikking van de aanvragen als bedoeld in [artikel 2.4, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel2.4
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel3.9.4
    references:
      - id: ref1
        bwb_id: BWBR0036758
        artikel: '2.4'
        hoofdstuk: '2'
  - number: 3.9.5
    text: |-
      De minister rangschikt een aanvraag voor een samenwerkingsproject wetenschap en visserij, waarop niet afwijzend is
      beslist, hoger, naarmate deze:

      a. een kennissysteem betreft dat makkelijker toegankelijk is voor vissers (20 procent);

      b. meer bijdraagt aan kennisverspreiding (20 procent);

      c. meer gericht is op het genereren van kennis die toepasbaar is in de praktijk (20 procent);

      d. meer bijdraagt aan samenwerking tussen vissers en partners in de visserijketen (10 procent);

      e. meer bijdraagt aan samenwerking tussen vissers en partners in sectoren buiten de visserijketen (10 procent);

      f. meer bijdraagt aan ecologische verduurzaming van de visserijsector (15 procent);

      g. meer vernieuwend is in de structuur van samenwerking tussen vissers en wetenschappers (5 procent).
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel3.9.5
  - number: 3.9.6
    text: |-
      Onverminderd de [artikelen 1.5][ref1], [2.10][ref2] en [3.1.2][ref3] komen operationele kosten als bedoeld in
      artikel 25, tweede lid, van [verordening 508/2014](32014R0508) niet in aanmerking voor subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel1.5
      [ref2]: https://wetten.overheid.nl/BWBR0036758#Artikel2.10
      [ref3]: https://wetten.overheid.nl/BWBR0036758#Artikel3.1.2
