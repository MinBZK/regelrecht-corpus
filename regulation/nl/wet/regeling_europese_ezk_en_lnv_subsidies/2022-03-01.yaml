  - number: 4.3.10
    text: |-
      Deze titel vervalt met ingang van 1 oktober 2022, met dien verstande dat deze van toepassing blijft op subsidies
      die voor die datum zijn verleend.
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel4.3.10
  - number: 4.4.1
    text: |-
      In deze titel wordt verstaan onder:

        - *ammoniak reducerende eenheid:* één of meer systemen die voldoen aan de voorwaarden van
      [bijlage 1 van de Regeling ammoniak en veehouderij][ref1];
        - *vleeskalverenhouder:* een eigenaar van een of meerdere stallen waarin bedrijfsmatig vleeskalveren worden
      gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0013629
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel4.4.1
    references:
      - id: ref1
        bwb_id: BWBR0013629
  - number: 4.4.2
    text: |-
      1 De minister verstrekt op aanvraag subsidie voor de aanschaf en installatie van een ammoniak reducerende eenheid
      door een vleeskalverenhouder.

      2 Onverminderd [artikel 2.9][ref1] bevat een aanvraag voor subsidieverlening in ieder geval:

      a. een offerte voor een ammoniak reducerende eenheid, en

      b. een plattegrond met stalindeling van het bedrijf van de vleeskalverenhouder waaruit het aantal kalverplaatsen
      blijkt.

      3 De subsidie bedraagt 40 procent van de aanschaf- en installatiekosten, bedoeld in het eerste lid.

      4 De subsidie bedraagt ten hoogste € 100.000 per vleeskalverenhouder.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel2.9
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel4.4.2
    references:
      - id: ref1
        bwb_id: BWBR0036758
        artikel: '2.9'
        hoofdstuk: '2'
  - number: 4.4.3
