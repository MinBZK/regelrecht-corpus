  - number: '1.5'
    text: |-
      Onverminderd artikel 69, derde lid, van [verordening 1303/2013](32013R1303), komen in geval van
      [artikel 1.3, onderdeel d][ref1], de volgende kosten niet in aanmerking voor subsidie:

      a. administratieve en financiële sancties en boetes;

      b. winstopslagen binnen een groep of samenwerkingsverband;

      c. fooien en geschenken;

      d. representatiekosten en -vergoedingen;

      e. kosten van personeelsactiviteiten;

      f. kosten van overboekingen en annuleringen;

      g. gratificaties en bonussen;

      h. kosten van outplacementtraject.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel1.3
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel1.5
    references:
