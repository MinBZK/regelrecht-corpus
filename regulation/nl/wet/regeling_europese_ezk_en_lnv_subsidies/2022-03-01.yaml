  - number: 4.8.5
    text: |-
      1 Voor subsidie komen uitsluitend de kosten, bedoeld in [artikel 1.3, eerste lid, onderdelen a, b en d][ref1] in
      aanmerking, voor zover deze zien op:

      a. de oprichting van een projectmatig samenwerkingsverband en het gezamenlijk formuleren van een projectplan, de
      volgende kosten:

      1°. kosten voor het werven van de deelnemers;

      2°. kosten voor het netwerken om het project goed te definiëren;

      3°. kosten voor het opstellen van een projectplan en de samenwerkingsovereenkomst;

      4°. kosten voor projectmanagement en projectadministratie.

      b. de uitvoering van een project, de volgende kosten:

      1°. coördinatiekosten van het samenwerkingsverband;

      2°. kosten voor het verspreiden van resultaten van het project;

      3°. operationele kosten direct verbonden aan de uitvoering van het project;

      4°. kosten voor projectmanagement en projectadministratie.

      c. het geval dat voor de uitvoering van een project een fysieke investering wordt gedaan, de volgende kosten:

      1°. kosten voor bouw of verbetering van onroerende zaken;

      2°. kosten voor verwerving of leasing van onroerende zaken:

      3°. kosten voor aankoop van grond;

      4°. kosten van de koop of huurkoop van nieuwe machines en installaties tot maximaal de marktwaarde van de activa.

      2 De kosten, bedoeld in het eerste lid, onder a, komen slechts voor subsidie in aanmerking indien deze kosten zijn
      gemaakt na 7 juli 2021.

      3 In afwijking van de [artikelen 1.3][ref2], [1.4][ref3] en [1.4a][ref4] worden de subsidiabele kosten berekend met
      gebruikmaking van één van onderstaande rekenmethodes en door:

      a. het totaal aan kosten, bedoeld in [artikel 1.3, eerste lid, onder b en d][ref5], voor zover de kosten geen
      verband houden met de uitvoering van overheidsopdrachten voor werken met een waarde boven het drempelbedrag,
      genoemd in artikel 4, onderdeel a, van [Richtlijn 2014/24](32014L0024)/EU van het Europees Parlement en de Raad
      van 26 februari 2014 betreffende het plaatsen van overheidsopdrachten en tot intrekking van [Richtlijn 2004/18/EG]
      (32004L0018) (PbEU 2014, L 94), te vermenigvuldigen met 20% voor de berekening van de directe loonkosten, waarna
      het bedrag wordt vermeerderd met 15% aan overheadkosten; of

      b. het totaal aan directe loonkosten te vermenigvuldigen met 40%, waarbij de loonkosten worden berekend door een
      per medewerker bepaald individueel uurtarief, berekend op basis van bruto jaarloon, vermeerderd met een opslag van
      43,5% voor werkgeverslasten en vervolgens gedeeld door 1.720 uur op basis van een volledige 40-urige werkweek, te
      vermenigvuldigen met het aantal aan het project of de investering bestede uren.

      4 Indien gebruik wordt gemaakt van de rekenmethode, genoemd in het derde lid, onder a, worden de kosten, bedoeld
      in [artikel 1.3, eerste lid, onder b][ref6], berekend door het aantal uren dat de betrokken persoon ten behoeve van
      het project of de investering heeft gemaakt te vermenigvuldigen met een vast uurtarief van € 35,–.

      5 De hoogte van de subsidie bedraagt:

      a. indien gebruik wordt gemaakt van de rekenmethode, genoemd in het derde lid, onder a:

      1°. 100% van de subsidiabele kosten voor zover het gaat om kosten voor niet-productieve investeringen en

      2°. 40% van de subsidiabele kosten voor productieve investeringen;

      b. indien gebruik wordt gemaakt van de rekenmethode, genoemd in het derde lid, onder b, en het project geen
      productieve investeringen bevat, 100% van de subsidiabele kosten;

      c. indien gebruik wordt gemaakt van de rekenmethode, genoemd in het derde lid, onder b en het project een of
      meerdere productieve investeringen bevat:

      1°. 100% van de subsidiabele loonkosten berekend conform het derde lid, onder b, en

      2°. 40% van de overige subsidiabele kosten.


