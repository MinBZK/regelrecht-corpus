  - number: 4.5.2
    text: |-
      1 De minister verstrekt op aanvraag subsidie voor het uitvoeren van een project dat bestaat uit:

      a. het formuleren van een plan voor het bereiken van toekomstbestendige landbouw overeenkomstig de in
      [artikel 4.5.9, eerste lid][ref1], gestelde voorschriften;

      b. de uitvoering van proefprojecten ter uitvoering van het plan;

      c. monitoring van en gegevensverzameling over de uitvoering en opbrengsten van de proefprojecten.

      2 Het proefproject bestaat uit het uitproberen van nieuwe maatregelen, en het onderzoeken van de effecten van die
      maatregelen:

      a. gericht op het nieuwe GLB, waarbij in regionaal of sectoraal verband ten minste een agrarisch collectief
      betrokken is en waarbij het project bijdraagt aan:

      1°. het streven dat de GLB-steun eenvoudiger wordt en prestaties levert;

      2°. het vergroten van draagvlak in het gebied of de sector waar het project op is gericht; of

      3°. het uitproberen van nieuwe samenwerkingsvormen tussen de partijen die betrokken zijn bij de uitvoering van
      het project.

      b. gericht op reductie van CO-emissie in veenweidegebieden; of

      c. gericht op het nieuwe GLB en het sluiten van kringlopen, in het bijzonder maatregelen waarbij het project
      bijdraagt aan:

      1°. meer duurzaam beheer van de landbouwbodems en koolstofvastlegging in de landbouwbodems;

      2°. geen of minder intensieve vruchtwisseling per perceel (inclusief mengteelt, opvolging van uitspoelingsgevoelige
      gewassen door diepwortelende of niet-uitspoelingsgevoelige gewassen en strokenteelt), bij voorkeur plaatsvindend op
      zand- of lössgrond;

      3°. grondwaterbeschermingsgebieden waar vergoedingen gelden voor gebiedsspecifieke nadelen als gevolg van bepaalde
      vereisten voortvloeiend uit de uitvoering van de Kaderrichtlijn Water;

      4°. het sluiten van kringlopen in samenwerkingsverbanden tussen veehouder en akkerbouwer op niveau van percelen,
      bedrijven en regio’s binnen en buiten deze samenwerking; of

      5°. het uitproberen van nieuwe beloningsvormen door samenwerking tussen overheden, marktpartijen of
      maatschappelijke groepering.

      3 Onverminderd [artikel 2.9, vierde lid][ref2], bevat het projectplan een omschrijving van:

      a. de beoogde producten en activiteiten, bedoeld in [bijlage 4][ref3], onderdeel A, kolom 1, overeenkomstig de in
      kolom 2 opgenomen beschrijving;

      b. de mogelijke risico’s en randvoorwaarden;

      c. de mogelijke negatieve omgevingseffecten.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel4.5.9
      [ref2]: https://wetten.overheid.nl/BWBR0036758#Artikel2.9
      [ref3]: https://wetten.overheid.nl/BWBR0036758
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel4.5.2
