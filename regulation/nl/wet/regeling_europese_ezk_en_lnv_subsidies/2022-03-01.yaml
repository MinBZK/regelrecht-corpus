        artikel: '1.3'
        hoofdstuk: '1'
  - number: 3.9.11
    text: |-
      1 Er kan een voorschot worden verstrekt als bedoeld in [artikel 2.14][ref1].

      2 Een aanvraag om een voorschot wordt in ieder geval ingediend tegelijkertijd met een tussenrapportage als bedoeld
      in [artikel 2.18, eerste lid][ref2].

      3 Tevens kan een aanvraag om een voorschot op een ander moment worden ingediend. In dat geval gaat zij vergezeld
      van een beschrijving van de voortgang van het samenwerkingsproject wetenschap en visserij.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel2.14
      [ref2]: https://wetten.overheid.nl/BWBR0036758#Artikel2.18
