  - number: 5.2.6
    text: |-
      Behoudens de bijdrage aan een financieringsinstrument, bedoeld in [artikel 5.2.2, tweede lid][ref1], verdeelt de
      managementautoriteit een beschikbaar subsidiebedrag

      a. op volgorde van ontvangst van de aanvragen, overeenkomstig [artikel 5.2.7][ref2] of

      b. op basis van rangschikking naar geschiktheid, overeenkomstig [artikel 5.2.8][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel5.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0036758#Artikel5.2.7
      [ref3]: https://wetten.overheid.nl/BWBR0036758#Artikel5.2.8
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel5.2.6
    references:
      - id: ref1
        bwb_id: BWBR0036758
        artikel: 5.2.2
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
