      f. € 1.570 respectievelijk € 942 voor een investering als bedoeld in
      [artikel 3.10.1, tweede lid, aanhef en onderdeel f][ref7];

      g. € 12.187 respectievelijk € 7.312 voor een investering als bedoeld in
      [artikel 3.10.1, tweede lid, aanhef en onderdeel g][ref8], voor zover het een koelinstallatie betreft met een
      vermogen tot 16 kW;

      h. € 17.550 respectievelijk € 10.530 voor een investering als bedoeld in
      [artikel 3.10.1, tweede lid, aanhef en onderdeel g][ref9], voor zover het een koelinstallatie betreft met een
