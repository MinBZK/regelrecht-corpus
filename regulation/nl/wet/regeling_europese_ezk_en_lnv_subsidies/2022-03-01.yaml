  - number: 4.7.3
    text: |-
      1 De subsidie wordt verstrekt aan landbouwers en jonge landbouwers.

      2 Een jonge landbouwer is een persoon die bij het indienen van de aanvraag om subsidie niet ouder is dan 40 jaar,
      een erkende landbouwkundige opleiding of een gelijkwaardige opleiding afgerond heeft of over ten minste drie jaar
      werkervaring op een landbouwbedrijf beschikt en die:

      a. zich voor het eerst als bedrijfshoofd op een landbouwbedrijf vestigt; en

      b. hetzij alleen hetzij gezamenlijk met andere landbouwers daadwerkelijke, langdurige zeggenschap over het
      landbouwbedrijf heeft wat betreft de beslissingen die op het gebied van het beheer, de voordelen en de financiële
      risico's worden genomen.

      3 Van daadwerkelijke, langdurige zeggenschap als bedoeld in het tweede lid, onderdeel b, is sprake als de jonge
      landbouwer:

      a. op basis van de statuten of een schriftelijke door alle maten of vennoten ondertekende overeenkomst tenminste
      een blokkerende zeggenschap heeft ter zake van bedrijfsbeslissingen met een financieel belang van meer dan
      € 25.000,–; en

      b. ten minste mede belast is met de dagelijkse bedrijfsvoering.

      4 Van daadwerkelijke, langdurige zeggenschap als bedoeld in het tweede lid, onderdeel b, is geen sprake indien:

      a. de jonge landbouwer een commanditaire vennoot van het betreffende landbouwbedrijf is; of

      b. de schriftelijke overeenkomst, bedoeld in het derde lid, onderdeel a, door elk der partijen eenzijdig kan worden
      opgezegd.

      5 Onder vestiging als bedoeld in dit artikel wordt verstaan: de datum waarop de aanvrager een handeling of
      handelingen stelt of voltooit in verband met die vestiging.
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel4.7.3
  - number: 4.7.4
    text: |-
      1 De subsidie bedraagt 60% van de subsidiabele kosten.

      2 In afwijking van het eerste lid bedraagt de subsidie 75% van de subsidiabele kosten, indien deze wordt
      aangevraagd door een jonge landbouwer als bedoeld in [artikel 4.7.3, tweede lid][ref1].

      3 De hoogte van de subsidie bedraagt voor de in [artikel 4.7.2, eerste lid][ref2], genoemde investeringen minimaal
      € 25.000 en maximaal € 150.000.

      4 In afwijking van het derde lid kan de hoogte van de subsidieverlening minder dan € 25.000,– bedragen in de
      volgende gevallen:

      a. er wordt een aanvraag tot subsidieverlening gedaan voor één of twee investeringen opgenomen op
      [bijlage 6][ref3];

      b. er wordt uitsluitend subsidie aangevraagd voor een investering als bedoeld in categorie C4 opgenomen in
      [bijlage 5][ref4] en de subsidie wordt verleend als een forfaitair bedrag als bedoeld in artikel 67, lid 1, onder
      c, van [verordening 1303/2013](32013R1303), dat wordt vastgesteld op basis van een ontwerpbegroting als bedoeld in
      artikel 67, lid 5, onder a bis, van [verordening 1303/2013](32013R1303).


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel4.7.3
