        paragraaf: '5.2'
  - number: 5.2.7
    text: |-
      1 Volgens de volgorde van ontvangst, bedoeld in [artikel 5.2.6, onderdeel a][ref1], komt de eerst ontvangen
      aanvraag het eerst voor subsidie in aanmerking.

      2 Indien een aanvrager niet heeft voldaan aan enig wettelijk voorschrift voor het in behandeling nemen van de
      aanvraag en met toepassing van [artikel 4:5 van de Algemene wet bestuursrecht][ref2] de gelegenheid heeft gehad de
      aanvraag aan te vullen, geldt met betrekking tot de verdeling de dag waarop de aanvraag voldoet aan de wettelijke
      voorschriften als datum van ontvangst.

      3 Indien de managementautoriteit op de dag dat het subsidieplafond wordt bereikt meer dan één aanvraag ontvangt,
      stelt zij de onderlinge rangschikking van die aanvragen vast door middel van loting.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel5.2.6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel5.2.7
    references:
      - id: ref1
        bwb_id: BWBR0036758
        artikel: 5.2.6
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:5
  - number: 5.2.8
    text: |-
      1 Volgens de rangschikking naar geschiktheid, bedoeld in [artikel 5.2.6, onderdeel b][ref1], komt de hoogst
      gerangschikte aanvraag het eerst voor subsidie in aanmerking.

      2 Voor zover het subsidieplafond dreigt te worden overschreden, stelt de managementautoriteit de onderlinge
      rangschikking van die aanvragen die bij de beoordeling gelijk zijn gerangschikt vast door middel van loting.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel5.2.6
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel5.2.8
    references:
      - id: ref1
        bwb_id: BWBR0036758
        artikel: 5.2.6
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.2.9
    text: |-
      1 De subsidieontvanger voert het project uit overeenkomstig het projectplan waarop de subsidieverlening betrekking
      heeft en voltooit het uiterlijk op het bij de verlening bepaalde tijdstip.

      2 De in artikel 71, eerste lid, van [verordening 1303/2013](32013R1303) bedoelde termijn van vijf jaar wordt in
      geval van het behoud van investeringen of van door het mkb gecreëerde werkgelegenheid, verkort tot drie jaar.
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel5.2.9
  - number: 5.2.10
    text: |-
      Een wijziging van een project waarvoor subsidie wordt verstrekt, betreffende

      a. de subsidieontvanger,

      b. de uit te voeren activiteiten of de te realiseren doelstellingen,

      c. de financiering van het project, of

      d. de planning of looptijd,

      behoeft de goedkeuring van de managementautoriteit.
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel5.2.10
  - number: 5.2.11
    text: |-
      De subsidieontvanger doet onverwijld schriftelijk melding aan de managementautoriteit zodra aannemelijk is dat

      a. de activiteiten waarvoor subsidie is verleend niet, niet tijdig of niet geheel zullen worden verricht, of

      b. niet, niet tijdig of niet geheel aan de aan de beschikking tot subsidieverlening verbonden verplichtingen zal
      worden voldaan.
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel5.2.11
  - number: 5.2.12
    text: |-
      1 De subsidieontvanger voert een administratie die zodanig is ingericht dat daaruit te allen tijde op
      eenvoudige en duidelijke wijze alle door hem gemaakte en betaalde kosten en de aan het project toe te rekenen
      opbrengsten kunnen worden afgelezen en gespecificeerd, met dien verstande dat ter zake van de kosten bedoeld in
      [artikel 1.4, eerste lid, onderdeel a, en tweede lid][ref1], een door middel van een inzichtelijke tijdschrijving
      controleerbare urenverantwoording per werknemer aanwezig dient te zijn.

      2 Indien de subsidieontvanger werkgever is, stelt deze voor personen als bedoeld in
      [artikel 1.4, eerste lid, onderdeel c][ref2], een document op met vermelding van het vaste percentage, bedoeld in
      dat onderdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel1.4
      [ref2]: https://wetten.overheid.nl/BWBR0036758#Artikel1.4
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel5.2.12
    references:
