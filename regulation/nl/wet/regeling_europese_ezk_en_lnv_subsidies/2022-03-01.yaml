  - number: 4.8.3
    text: |-
      1 De subsidie wordt voor een project dat bijdraagt aan de doelstellingen, bedoeld in
      [artikel 4.8.2, derde lid, onderdeel a][ref1], alleen verleend aan een samenwerkingsverband, wanneer in het
      samenwerkingsverband minimaal drie partijen betrokken zijn, waaronder minimaal één landbouwer en één ketenpartner.

      2 De subsidie wordt voor een project dat bijdraagt aan de doelstellingen, bedoeld in
      [artikel 4.8.2, derde lid, onderdelen b en c][ref2], alleen verleend aan een samenwerkingsverband dat bestaat uit
      tenminste één landbouwer samen met andere landbouwers, producentengroeperingen, coöperaties, andere MKB-bedrijven
      of brancheorganisaties.

      3 De subsidie wordt voor een project dat bijdraagt aan de doelstellingen, bedoeld in
      [artikel 4.8.2, derde lid, onderdeel d][ref3], alleen verleend aan een samenwerkingsverband, wanneer het
      samenwerkingsverband bestaat uit sector-vertegenwoordigende rechtspersonen of andere samenwerkingsverbanden
      bestaande uit samenwerkende agrariërs.

      4 De subsidie wordt voor een project dat bijdraagt aan de doelstellingen, bedoeld in
      [artikel 4.8.2, derde lid, onderdeel e][ref4], alleen verleend aan een samenwerkingsverband, wanneer het
      samenwerkingsverband bestaat uit minimaal twintig landbouwers en minimaal één coördinator.


