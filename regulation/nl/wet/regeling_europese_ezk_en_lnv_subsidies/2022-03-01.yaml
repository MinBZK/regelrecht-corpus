  - number: 4.8.13
    text: |-
      1 De minister geeft in voorkomende gevallen uitvoering aan artikel 54, eerste en derde lid, en artikel 56 van
      [verordening 1306/2013](32013R1306).

      2 De minister verricht de controles, bedoeld in artikel 59 van [verordening 1306/2013](32013R1306).
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel4.8.13
  - number: 4.8.14
    text: |-
      1 De minister besluit tot het niet betalen dan wel de gehele of gedeeltelijke intrekking van de subsidie
      overeenkomstig artikel 63, eerste lid, van [verordening 1306/2013](32013R1306).

      2 De minister stelt de sancties, bedoeld in artikel 63, tweede lid, van [verordening 1306/2013](32013R1306), vast
      met inachtneming van artikel 64 van [verordening 1306/2013](32013R1306).

      3 De minister geeft bij de uitvoering van de bevoegdheden, genoemd in het eerste en tweede lid, toepassing aan
      artikel 63 van [verordening 809/2014](32014R0809).
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel4.8.14
  - number: 4.8.15
    text: |-
      Deze titel vervalt met ingang van 31 december 2024, met dien verstande dat deze van toepassing blijft op subsidies
      die voor die datum zijn verleend.
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel4.8.15
  - number: 5.1.1
    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - *auditautoriteit:* door de minister als zodanig aangewezen autoriteit;
        - *certificeringsautoriteit:* door de minister als zodanig aangewezen autoriteit;
        - *financieringsinstrument:* financieringsinstrument als bedoeld in artikel 37, eerste lid, van [verordening
      1303/2013](32013R1303);
        - *programmasubsidie:* subsidie die wordt verstrekt aan een autoriteit van een grensoverschrijdend programma ten
      behoeve van het financieren van projecten die binnen dat grensoverschrijdende programma vallen;
        - *verordening 1299/2013:* verordening (EU) nr. 1299/2013 van het Europees Parlement en de Raad van 17 december
      2013 betreffende specifieke bepalingen voor steun uit het Europees Fonds voor regionale ontwikkeling ter
      verwezenlijking van de doelstelling ‘Europese territoriale samenwerking’ (PbEU 2013, L347).
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel5.1.1
  - number: 5.1.2
    text: Dit hoofdstuk vervalt met ingang van 1 januari 2024.
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel5.1.2
  - number: 5.2.1
    text: |-
      1 De managementautoriteit verstrekt subsidie voor activiteiten passend binnen het programma waarvoor de
      managementautoriteit is aangewezen.

      2 Een subsidie als bedoeld in het eerste lid kan worden verstrekt in de vorm van een bijdrage aan een
      financieringsinstrument.
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel5.2.1
  - number: 5.2.2
    text: |-
      1 De managementautoriteit stelt een subsidieplafond of twee of meer deelplafonds ter uitvoering van deze regeling
      vast, alsmede de wijze van verdeling van het beschikbare bedrag onder het desbetreffende plafond.

      2 De managementautoriteit kan een beschikbaar subsidiebedrag bestemmen voor een of meer financieringsinstrumenten.

      3 De managementautoriteit maakt de criteria, bedoeld in artikel 125, derde lid, van [verordening 1303/2013]
      (32013R1303), die worden gehanteerd binnen de wijze van verdeling, bedoeld in het eerste lid, bekend.
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel5.2.2
  - number: 5.2.3
    text: |-
      Een aanvraag om subsidie wordt ingediend met gebruikmaking van een middel dat door de managementautoriteit
      beschikbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel5.2.3
  - number: 5.2.4
    text: |-
      1 De managementautoriteit geeft binnen 26 weken een beschikking op een aanvraag tot subsidieverlening.

      2 In het geval van de verdeling van een beschikbaar subsidiebedrag, als bedoeld in
      [artikel 5.2.6, onderdeel b][ref1], begint de termijn, bedoeld in het eerste lid, op de eerste dag na afloop van
      de aanvraagperiode.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel5.2.6
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel5.2.4
    references:
      - id: ref1
        bwb_id: BWBR0036758
        artikel: 5.2.6
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.2.5
    text: |-
      1 De managementautoriteit beslist afwijzend op een aanvraag indien:

      a. de totale subsidiabele kosten van het project minder bedragen dan € 200.000;

      b. het project niet voldoet aan deze regeling, de EFRO-verordeningen, of de wijze van verdeling van het beschikbare
      bedrag, bedoeld in [artikel 5.2.2, eerste lid][ref1];

      c. het project niet voldoende bijdraagt aan de verwezenlijking van de specifieke doelstellingen binnen het
      programma of het gedeelte van het programma waarvoor het deelplafond beschikbaar is gesteld;

      d. de aanvrager niet heeft voldaan aan enig wettelijk voorschrift voor het in behandeling nemen van de aanvraag op
      de uiterste datum van indiening in het geval van verdeling zoals bedoeld in [artikel 5.2.6, onderdeel b][ref2];

      e. de managementautoriteit door toewijzing niet zou voldoen aan een van de verplichtingen gesteld in artikel 125
      van [verordening 1303/2013](32013R1303), of

      f. de aanvrager een ondernemer is tegen wie een bevel tot terugvordering uitstaat als bedoeld in artikel 1, vierde
      lid, onderdeel a, van Verordening (EU) 651/2014 van de Commissie van 17 juni 2014 waarbij bepaalde categorieën
      steun op grond van de artikelen 107 en 108 van het verdrag met de interne markt verenigbaar worden geacht (PbEU L
      2014, 187).

      2 De managementautoriteit kan geheel of gedeeltelijk afwijzend beslissen op een aanvraag indien blijkt dat de
      beoogde financiering door de overige financiers geheel of gedeeltelijk niet zal worden verleend.

      3 De managementautoriteit kan in afwijking van het eerste lid, aanhef en onderdeel a, bij de wijze van verdeling,
      bedoeld in [artikel 5.2.2, eerste lid][ref3], bepalen dat het eerste lid, onderdeel a, niet van toepassing is op
      subsidies voor het mkb.

      4 Het eerste lid, onderdeel a, is niet van toepassing op het verstrekken van subsidie door de managementautoriteit
      van het programma, bedoeld in [artikel 5.4.2, eerste lid, onderdeel d][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel5.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0036758#Artikel5.2.6
      [ref3]: https://wetten.overheid.nl/BWBR0036758#Artikel5.2.2
      [ref4]: https://wetten.overheid.nl/BWBR0036758#Artikel5.4.2
