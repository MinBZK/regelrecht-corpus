      1 Indien de periode van uitvoering van een project dat voor subsidie in aanmerking komt meer dan twaalf maanden in
      beslag neemt, wordt bij de beschikking tot subsidieverlening de verplichting opgelegd tot indiening van één of meer
      rapportages waarin de voortgang van het project wordt beschreven, waarbij rekening wordt gehouden met de mijlpalen
      van het project.

      2 Indien subsidieontvangers samenwerken in een samenwerkingsverband, kan de penvoerder hun rapportages indienen.
