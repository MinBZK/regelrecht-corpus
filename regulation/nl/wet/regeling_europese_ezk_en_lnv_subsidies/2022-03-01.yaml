  - number: 3.10.7
    text: |-
      Onverminderd de [artikelen 2.11][ref1] en [3.1.3][ref2] beslist de minister afwijzend op een aanvraag tot
      subsidieverlening indien:

      a. niet voldaan wordt aan de eisen van artikel 42, eerste lid, aanhef en onderdeel a, van [verordening 508/2014]
      (32014R0508);

      b. een investering bestemd is voor een vissersvaartuig:

      1°. dat niet volledig of gedeeltelijk eigendom is van de subsidieaanvrager;

      2°. dat niet onder Nederlandse vlag vaart;

      3°. waarvoor reeds hetzelfde type investering is gedaan; of

      4°. waarvoor reeds op grond van [artikel 3.10.1][ref3] subsidie is verleend voor hetzelfde type investering; of

      c. het aannemelijk is dat de activiteiten waarvoor een investering is bestemd in strijd zijn met de toepasselijke
      wettelijke voorschriften.


