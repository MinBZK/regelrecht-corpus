      Deze titel vervalt met ingang van 1 april 2022, met dien verstande dat deze van toepassing blijft op subsidies die
      voor die datum zijn verleend.
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel3.9.13
  - number: 3.10.1
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een visserijonderneming voor investeringen die waarde toevoegen
      aan visserijproducten als bedoeld in artikel 42, aanhef en eerste lid, onderdeel a, van [verordening 508/2014]
      (32014R0508).

      2 Een investering betreft de aanschaf en het gebruiksklaar maken van:

      a. een automatische conserveermachine voor langoustines;

      b. een automatische kookketel voor garnalen;

      c. een spoelsorteermachine die is uitgerust met een buitentrommel met ten minste 6 millimeter spijlwijdte;

      d. een scholstripmachine;

      e. een slurryijsmachine;

      f. een buitentrommel met ten minste 6 millimeter spijlwijdte die bestemd is voor een spoelsorteermachine;

      g. een koelinstallatie die gebruik maakt van het koudemiddel CO met een vermogen van ten minste 10 kW; of

      h. een luchtzuiveraar die:

      1°. uitgerust is met een ventilator, ionisatietechniek en een filter of filters;

      2°. ten minste 800 m3 lucht zuivert per uur; en

      3°. met een efficiëntie van ten minste 75% bacteriën en schimmels uit de lucht filtert.
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel3.10.1
  - number: 3.10.2
    text: Per visserijonderneming kan slechts één aanvraag worden ingediend.
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel3.10.2
  - number: 3.10.3
    text: |-
