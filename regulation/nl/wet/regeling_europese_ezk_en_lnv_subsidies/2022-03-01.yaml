  - number: 4.8.8
    text: |-
      Onverminderd [artikel 2.11][ref1] beslist de minister afwijzend op een aanvraag voor subsidieverlening indien:

      a. een activiteit als bedoeld in [artikel 4.8.2, derde lid][ref2], niet nieuw is voor de aanvrager of een deelnemer
      aan een samenwerkingsverband als bedoeld in [artikel 4.8.3][ref3];

      b. aan een aanvraag met een project dat bijdraagt aan de doelstelling, bedoeld in [4.8.2, derde lid][ref4], minder
      dan 30 punten zijn toegekend op grond van [artikel 4.8.9, derde of vierde lid][ref5];

      c. met de uitvoering van de activiteit, niet zijnde de uitvoering van voorbereidingshandelingen voor de uitvoering
      van de activiteit, is gestart voordat de aanvraag om subsidie is ingediend.


