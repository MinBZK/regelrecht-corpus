  - number: 4.1.7
    text: |-
      De minister beslist op een aanvraag om subsidieverlening uiterlijk 15 mei van het jaar volgend op het jaar van
      de aanvraag.
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel4.1.7
  - number: 4.1.8
    text: |-
      De aanvrager verstrekt de volgende gegevens aan de minister:

      a. het polisnummer van de verzekering;

      b. een kopie van de verzekeringspolis;

      c. een bewijs van betaling van het deel van de verzekeringspremie, bedoeld in
      [artikelen 4.1.3, vierde lid, onderdeel b][ref1], en [4.1.18, vierde lid][ref2];

      d. toestemming aan de minister om persoonsgegevens te verwerken ten behoeve van de controle op de naleving van
      deze regeling;

      e. toestemming aan de minister om perceelsgegevens uit te wisselen met de verzekeraar ten behoeve van de controle
      op de naleving van deze regeling;

      f. een verklaring dat hij zich bewust is van alle voorwaarden voor verkrijging van deze subsidie;

      g. de naam van de verzekeraar met wie de verzekering is afgesloten, en

      h. een verklaring dat hij zich niet meer dan één keer verzekert voor dezelfde schade.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel4.1.3
      [ref2]: https://wetten.overheid.nl/BWBR0036758#Artikel4.1.18
