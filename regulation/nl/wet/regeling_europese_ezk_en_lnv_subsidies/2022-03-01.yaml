  - number: 4.8.1
    text: |-
      In deze titel wordt verstaan onder:

        - *duurzame toegevoegde waardeketen:* duurzame keten van activiteiten waarbij waarde aan de producten wordt
      toegevoegd op het moment dat deze een volgende activiteit in een keten passeren en waarbij de keten als geheel het
      product toegevoegde waarde geeft;
        - *EIP:* een Europees Partnerschap voor innovatie, voor de productiviteit en duurzaamheid in de landbouw als
      bedoeld in artikel 53 van [verordening 1305/2013](32013R1305);
        - *ketenpartner:* instelling of dienstverlener waarmee de eigen activiteiten worden afgestemd omdat deze een rol
      speelt in het gezamenlijk te doorlopen traject;
        - *KPI:* kritieke prestatie-indicator;
        - *landbouwer:* actieve landbouwer als bedoeld in artikel 36, tweede lid, van [verordening 1305/2013](32013R1305);
        - *landbouwproducten:* voortbrengselen van bodem, veeteelt en visserij alsmede de producten in eerste graad van
      bewerking welke met de genoemde voortbrengselen rechtstreeks verband houden, zoals vermeld in artikel 38 en bijlage
      II van het Verdrag van de werking van de Europese Unie (VWEU);
        - *operationele groepen:* samenwerkingsverbanden die deel uit maken van een EIP, de groep bestaat uit minimaal twee
      actoren, waarvan minimaal één landbouwer deel uitmaakt of een organisatie die landbouwers vertegenwoordigt en de
      groep is gericht op het ontwikkelen, valideren en verfijnen van innovaties;
        - *niet-productieve investering:* investering die niet leidt tot een aanzienlijke stijging van de waarde
      of de rentabiliteit van het landbouwbedrijf of een andere onderneming en die bijdraagt aan agro-milieu en
      klimaatdoelstellingen, zoals bedoeld in artikel 17, eerste lid, onder d, van [verordening 1305/2013](32013R1305);
        - *productieve investering:* investering in vaste of immateriële activa die worden aangewend voor de productie van
      goederen en diensten en die leidt tot een stijging van de waarde of de rentabiliteit van het landbouwbedrijf of een
      andere onderneming;
        - *verdienmodel:* manier waarop geld verdiend kan worden met een bepaalde activiteit;
        - *verordening 1306/2013:* [verordening (EU) nr. 1306/2013](32013R1306) van het Europees Parlement en de Raad
      van 17 december 2013 inzake de financiering, het beheer en de monitoring van het gemeenschappelijk landbouwbeleid
      en tot intrekking van Verordeningen (EEG) nr. 352/78, (EG) nr. 165/94, (EG) nr. 2799/98, (EG) nr. 814/2000, (EG)
      nr. 1290/2005 en (EG) nr. 485/2008 van de Raad (PbEU 2013, L 347);
        - *voorbereidingskosten:* kosten van handelingen ter voorbereiding van de subsidiabele activiteit(en) waar subsidie
      voor wordt aangevraagd, waaronder het maken van het projectplan.
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel4.8.1
  - number: 4.8.2
    text: |-
      1 De minister verstrekt op aanvraag subsidie voor een project gericht op toekomstbestendige landbouw, waarvan het
      projectplan voldoet aan de in het vijfde lid gestelde vereisten.

      2 Het project bestaat uit:

      a. het uitwerken van een projectplan voor het bereiken van toekomstbestendige landbouw overeenkomstig de in
      [artikel 4.8.11, eerste lid][ref1], gestelde voorschriften; en

      b. de uitvoering van het project ter uitvoering van het plan.

      3 Het project bestaat uit het ontwikkelen van nieuwe, opschaalbare initiatieven die bijdragen aan economisch
      herstel en aan de transitie naar een duurzame, toekomstbestendige landbouw:

      a. gericht op het ontwikkelen van een duurzame toegevoegde waardeketen gericht op landbouwproducten tot een
      marktrijp concept dat ziet op de handel en afzet van landbouwproducten;

      b. gericht op het ondersteunen van de innovatieve digitalisering van:

      1°. data-gedreven KPI’s als hulpmiddel ten behoeve van de handel en afzet van landbouwproducten met in achtneming
      van de principes van kringlooplandbouw;

      2°. natuurinclusieve en diverse teeltsystemen die bijdragen aan nieuwe verdienmodellen.

      c. gericht op gebiedsgerichte pilots waarin het gaat om de ontwikkeling van:

      1°. regionale verdienmodellen gericht op de afzet van landbouwproducten die bijdragen aan klimaatmitigatie, een
      verbetering van bodembeheer, biodiversiteit en kringlooplandbouw;

      2°. koolstofvastlegging in de bodem als verdienmodel voor koolstoflandbouw, het verminderen van de
      bodemverdichting, en maatregelen die inspelen op klimaatverandering.

      d. gericht op sectorale initiatieven binnen de landbouw voor het ontwikkelen van duurzame verdienmodellen ter
      versterking van de regierol van de primaire sector bij het verduurzamen van het voedselsysteem; of

      e. gericht op het ondersteunen van samenwerkingsverbanden bij de toepassing van maatregelen ter beperking van de
      ammoniakemissie.

      4 Onverminderd [artikel 2.9][ref2] bevat de aanvraag de keuze voor de rekenmethode die wordt gebruikt voor de
      berekening van de subsidiabele kosten, zoals opgenomen in [artikel 4.8.5, derde lid][ref3].

      5 Onverminderd [artikel 2.9, vierde lid][ref4], wordt het projectplan ingediend met gebruikmaking van een format,
      dat door de minister beschikbaar wordt gesteld en bevat het projectplan een beschrijving van:

      a. de te verwachten resultaten en de bijdrage aan de doelstelling van de subsidiemodule;

      b. de beoogde activiteiten voor de kennisverspreiding van de resultaten met gebruik van de hiertoe geëigende
      netwerken;

      c. de mogelijke risico’s en randvoorwaarden; en

      d. de mogelijke negatieve omgevingseffecten.


