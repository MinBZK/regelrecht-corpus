      - id: ref2
        bwb_id: BWBR0036758
        artikel: 4.1.11
        hoofdstuk: '4'
        paragraaf: 4.1.2
  - number: 4.1.15
    text: |-
      1 In afwijking van [artikel 4.1.11, eerste lid, onderdeel d][ref1], mag de schade worden vastgesteld op basis van
      een rekenmodel.

      2 Het rekenmodel wordt tezamen met de verzekeringsvoorwaarden goedgekeurd door de minister.

      3 De minister keurt het rekenmodel uitsluitend goed indien de verzekeraar aantoont dat de uitkomsten van het
      rekenmodel vergelijkbaar zijn met een schadebeoordeling door een schade-expert. Het rekenmodel bevat daartoe
      tenminste de noodzakelijke gegevens om de schade vast te kunnen stellen aan de hand van bedrijfsspecifieke gegevens
      van het landbouwbedrijf zoals het gewas en de grondsoort op perceelsniveau en de feitelijke weersomstandigheid die
      de schade veroorzaakt.

      4 De verzekeraar onderzoekt elk gebruik van het rekenmodel met behulp van een steekproef. De resultaten worden ter
      beschikking gehouden van de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel4.1.11
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel4.1.15
    references:
      - id: ref1
        bwb_id: BWBR0036758
        artikel: 4.1.11
        hoofdstuk: '4'
        paragraaf: 4.1.2
  - number: 4.1.16
    text: |-
      De minister geeft in voorkomende gevallen uitvoering aan artikel 54, eerste en derde lid, en artikel 56 van
      [verordening 1306/2013](32013R1306).
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel4.1.16
  - number: 4.1.17
    text: De minister verricht de controles, bedoeld in artikel 59 van [verordening 1306/2013](32013R1306).
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel4.1.17
  - number: 4.1.18
    text: |-
      1 De minister besluit tot het niet betalen dan wel de gehele of gedeeltelijke intrekking van de subsidie
      overeenkomstig artikel 63, eerste lid, van [verordening 1306/2013](32013R1306).

      2 De minister stelt de sancties, bedoeld in artikel 63, tweede lid, van [verordening 1306/2013](32013R1306), vast
      met inachtneming van artikel 64 van [verordening 1306/2013](32013R1306).

      3 De minister geeft bij de uitvoering van de bevoegdheden, genoemd in het eerste en tweede lid, toepassing aan
      artikel 63 van [verordening 809/2014](32014R0809).

      4 Indien de verstrekte subsidie lager is dan de aangevraagde subsidie als gevolg van een bij besluit van de
      minister vastgestelde verlaging van de subsidie, dient de landbouwer de met dit verschil overeenkomende premie te
      voldoen vóór 1 juli volgend op het jaar van de aanvraag aan de verzekeraar.

      5 Indien de landbouwer niet of niet geheel het in het vierde lid bedoelde bedrag tijdig heeft betaald, wordt de
      subsidie evenredig percentueel verlaagd met het verschil tussen het bedrag dat tijdig is betaald en het bedrag dat
      had moeten zijn betaald.
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel4.1.18
  - number: 4.1.19
    text: Deze titel vervalt met ingang van 21 januari 2025.
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel4.1.19
  - number: 4.3.1
    text: |-
      In deze titel wordt verstaan onder:

        - *vleeskalverenhouder:* een eigenaar van een of meerdere stallen waarin bedrijfsmatig vleeskalveren worden
      gehouden;
        - *welzijnsvriendelijke stalvloer:* een stalvloer voor vleeskalveren die voldoet aan de voorwaarden van
      [bijlage 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036758
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel4.3.1
    references:
      - id: ref1
        bwb_id: BWBR0036758
  - number: 4.3.2
    text: |-
      1 De minister verstrekt op aanvraag subsidie voor de aanschaf en installatie van een welzijnsvriendelijke stalvloer
      en indien van toepassing, wanneer de welzijnsvriendelijke stalvloer niet op de bestaande roostervloer kan worden
      bevestigd, voor de aanschaf van nieuwe roostervloeren of voor de kosten voor het laten infrezen van de bestaande
      roostervloeren door een vleeskalverenhouder.

      2 Onverminderd [artikel 2.9][ref1] bevat een aanvraag voor subsidieverlening in ieder geval:

      a. een offerte voor een welzijnsvriendelijke stalvloer, en

      b. een plattegrond met stalindeling van het bedrijf van de vleeskalverenhouder waaruit het aantal kalverplaatsen
      blijkt.

      3 De subsidie bedraagt 40 procent van de aanschaf- en installatiekosten, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel2.9
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel4.3.2
    references:
      - id: ref1
        bwb_id: BWBR0036758
        artikel: '2.9'
        hoofdstuk: '2'
  - number: 4.3.3
    text: |-
      Onverminderd [artikel 1.2][ref1], wordt geen subsidie verstrekt voor zover de vleeskalverenhouder van overheidswege
      een andere bijdrage ontvangt voor de aanschaf- en installatiekosten, bedoeld in [artikel 4.3.2, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel1.2
      [ref2]: https://wetten.overheid.nl/BWBR0036758#Artikel4.3.2
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel4.3.3
    references:
      - id: ref1
        bwb_id: BWBR0036758
        artikel: '1.2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0036758
        artikel: 4.3.2
        hoofdstuk: '4'
        paragraaf: 4.3.2
  - number: 4.3.4
    text: |-
      De minister verdeelt per openstelling het subsidieplafond op volgorde van rangschikking van de aanvragen als
      bedoeld in de [artikelen 2.4, onderdeel b][ref1], en [2.6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel2.4
      [ref2]: https://wetten.overheid.nl/BWBR0036758#Artikel2.6
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel4.3.4
    references:
      - id: ref1
        bwb_id: BWBR0036758
        artikel: '2.4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0036758
        artikel: '2.6'
        hoofdstuk: '2'
  - number: 4.3.5
    text: |-
      1 De minister rangschikt een aanvraag voor subsidie, waarop niet afwijzend is beslist, hoger naarmate
      de vleeskalverenhouder meer stalplaatsen heeft, een hoger percentage van het aantal stalplaatsen een
      welzijnsvriendelijke stalvloer krijgt en als sprake is van renovatie van een bestaande stal in tegenstelling tot
      nieuwbouw. Voor de rangschikking worden de volgende criteria toegepast:

      a. aantal stalplaatsen, waaraan de volgende scores worden toegekend met een wegingsfactor 1:

      1°. minder dan 400 stalplaatsen: 1 punt;

      2°. tussen de 400 en 600 stalplaatsen: 2 punten, en

      3°. meer dan 600 stalplaatsen: 3 punten.

      b. het percentage van de stalplaatsen van alle stallen waarvan de stalvloer wordt vervangen door een
      welzijnsvriendelijke stalvloer, waaraan de volgende scores worden toegekend met een wegingsfactor 2:

      1°. een percentage van 0 tot en met 30 procent: 1 punt;

      2°. een percentage van 31 tot en met 60 procent: 2 punten, en

      3°. een percentage van 61 tot en met 100 procent: 3 punten.

      c. er is sprake van nieuwbouw of renovatie van de stal, waaraan de volgende scores worden toegekend met een
      wegingsfactor 1:

      1°. nieuwbouw: 1 punt, en

      2°. renovatie: 2 punten.

      2 Het aantal punten dat wordt behaald betreft de score onder a, b en c van het eerste lid vermeerderd met de
      wegingsfactor. Het maximum aantal punten is 11.

      3 Indien een aanvraag minder dan 4 punten behaalt, wordt de aanvraag afgewezen.

      4 Aanvragen worden op volgorde van rangschikking toegewezen.
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel4.3.5
  - number: 4.3.6
    text: |-
      Onverminderd [artikel 1.5][ref1] en in afwijking van [artikel 1.3][ref2], komen de volgende kosten niet in
      aanmerking voor subsidie:

      a. tweedehands vloeren;

      b. bijdragen in natura;

      c. afschrijvingskosten, en

      d. loonkosten.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel1.5
      [ref2]: https://wetten.overheid.nl/BWBR0036758#Artikel1.3
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel4.3.6
    references:
      - id: ref1
        bwb_id: BWBR0036758
        artikel: '1.5'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0036758
        artikel: '1.3'
        hoofdstuk: '1'
  - number: 4.3.7
    text: |-
      1 De aanschaf van een welzijnsvriendelijke stalvloer vindt plaats na de datum van indiening van de aanvraag tot
      subsidieverlening, bedoeld in [artikel 2.9][ref1], en binnen twee jaar na de datum van subsidieverlening.

      2 De betaling, levering en installatie van een welzijnsvriendelijke stalvloer vinden plaats binnen twee jaar
      na de datum van subsidieverlening en voor het indienen van de aanvraag tot subsidievaststelling, bedoeld in
      [artikel 2.20][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel2.9
      [ref2]: https://wetten.overheid.nl/BWBR0036758#Artikel2.20
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel4.3.7
    references:
      - id: ref1
        bwb_id: BWBR0036758
        artikel: '2.9'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0036758
        artikel: '2.20'
        hoofdstuk: '2'
  - number: 4.3.8
    text: |-
      Onverminderd [artikel 2.20][ref1] bevat de aanvraag tot subsidievaststelling in ieder geval:

      a. een gespecificeerde factuur en een afschrift van het betalingsbewijs van de welzijnsvriendelijke stalvloer, en

      b. een specificatie van de vloer waaruit blijkt dat deze voldoet aan de voorwaarden van [bijlage 3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel2.20
      [ref2]: https://wetten.overheid.nl/BWBR0036758
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel4.3.8
    references:
      - id: ref1
        bwb_id: BWBR0036758
        artikel: '2.20'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0036758
  - number: 4.3.9
    text: |-
      De [artikelen 4.1.16 tot en met 4.1.18][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0036758#Artikel4.1.16
    url: https://wetten.overheid.nl/BWBR0036758/2022-03-01#Artikel4.3.9
