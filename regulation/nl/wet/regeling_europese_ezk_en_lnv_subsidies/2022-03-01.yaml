  - number: 5.4.3
    text: |-
      1 De ontvanger van een programmasubsidie als bedoeld in [artikel 5.4.1, eerste lid][ref1], financiert geen
      projecten ten laste van de programmasubsidie als bedoeld in artikel 5.4.1, eerste lid, zonder voorafgaande
      schriftelijke instemming van de minister.

      2 De minister onthoudt de instemming, bedoeld in het eerste lid, indien:

      a. het project niet voldoet aan [verordening 1303/2013](32013R1303), [verordening 1301/2013](32013R1301),
      [verordening 1299/2013](32013R1299) of deze regeling, of

      b. de beoogde financiering door de overige financiers niet of niet volledig is aangevraagd, dan wel niet of niet
      volledig zal worden verleend.

      3 De Minister onthoudt tevens de instemming of wijst een aanvraag als bedoeld in [artikel 5.4.1, tweede lid][ref2],
      af indien het project niet in voldoende mate bijdraagt aan tenminste vier van de volgende aspecten:

      a. de ontwikkeling van nieuwe kennis of innovatie dan wel de toepassing van kennis in nieuwe projecten, diensten,
      organisatievormen, processen, markten of combinaties hiervan;

      b. verbeteren van de aansluiting tussen onderwijs en arbeidsmarkt of arbeidsmobiliteit;

      c. bijdragen aan het realiseren van een koolstofarme economie;

      d. efficiënt omgaan met grondstoffen;

      e. economische structuurversterking binnen economische sectoren of in het programmagebied;

      f. de deelname van of een brede en intensieve samenwerking met een relevant consortium;

      g. aannemelijkheid van marktperspectief of kansen op een vervolg;

      h. de realisatie van Rijksbeleid op het gebied van innovatie, koolstofarme economie, efficiënt omgaan met
      grondstoffen of verbeteren van de aansluiting tussen onderwijs en arbeidsmarkt;

      i. een kruising tussen prioritaire sectoren of een kruising tussen een prioritaire sector en één van de volgende
      sector overstijgende thema’s:

      1°. nanotechnologie;

      2°. ICT;

      3°. circulaire economie, of

      4°. Slimme industrie.

      4 Het derde lid is niet van toepassing op projecten in de prioriteit Technische Bijstand.


