      a. gegevens ten behoeve van monitoring of evaluatie als bedoeld in artikel 111 van verordening 508/2014;

      b. voor zover deze nog niet zijn aangeleverd bij de aanvraag tot voorschotverlening, bedoeld in
      [artikel 3.1.4.a][ref2], kopieën van opgevraagde offertes als bedoeld in [artikel 3.1.6, tweede lid][ref3], en de
