      [artikel 2.11, tweede lid, onderdeel d][ref1], en de rangschikking van aanvragen tot subsidieverlening, indien de
      verdeling van een subsidieplafond overeenkomstig [artikel 2.4, onderdeel b][ref2], wordt bepaald.

      2 De commissie bestaat uit ten minste vijf en ten hoogste tien leden.

      3 De voorzitter en de leden worden voor een periode van drie jaar benoemd.


