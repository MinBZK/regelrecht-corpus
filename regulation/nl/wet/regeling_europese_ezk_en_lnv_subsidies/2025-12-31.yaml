      1 Onverminderd [artikel 2.20][ref1], bevat de aanvraag tot subsidievaststelling:

      a. gegevens ten behoeve van monitoring of evaluatie als bedoeld in artikel 111 van verordening 508/2014;

      b. voor zover deze nog niet zijn aangeleverd bij de aanvraag tot voorschotverlening, bedoeld in
      [artikel 3.1.4.a][ref2], kopieën van opgevraagde offertes als bedoeld in [artikel 3.1.6, tweede lid][ref3], en de
      relevante redenen voor een op basis van deze offertes genomen gunningsbeslissing;

      c. voor zover deze nog niet zijn aangeleverd bij de aanvraag tot subsidieverlening op grond van
      [artikel 3.1.4, onderdeel f][ref4], gegevens over de gevolgde procedure en de gunningsbeslissing, bedoeld in
