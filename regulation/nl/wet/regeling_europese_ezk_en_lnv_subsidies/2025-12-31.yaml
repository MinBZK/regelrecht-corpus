  - number: '1.4'
    text: |-
      1 Loonkosten worden berekend:

      a. door het aantal aan het project of de investering bestede uren te vermenigvuldigen met een volgens één van de
      volgende methodieken berekend tarief:

      1°. een per medewerker bepaald individueel uurtarief, berekend op basis van bruto jaarloon, vermeerderd met een
      opslag van 32% voor werkgeverslasten, waarna over dat bedrag 15% aan overheadkosten wordt berekend en dat bedrag
      vervolgens door 1.720 uur op basis van een 40-urige werkweek wordt gedeeld;

      2°. een per medewerker bepaald individueel uurtarief, berekend op basis van bruto jaarloon, vermeerderd met een
      opslag van 32% voor werkgeverslasten, waarna over dat bedrag 15% aan overheadkosten wordt berekend en dat bedrag
      vervolgens door 1.720 uur op basis van een volledige werkweek wordt gedeeld;

      3°. een door de minister goedgekeurde integrale kostensystematiek, bedoeld in
      [artikel 12, eerste lid, van het Kaderbesluit nationale EZ-subsidies][ref1];

      4°. een door de Europese Commissie goedgekeurde methodiek voor soortgelijke projecten en subsidieontvangers als
      bedoeld in artikel 67, vijfde lid, onderdeel b, van [verordening 1303/2013](32013R1303); of

      5°. een per medewerker bepaald individueel uurtarief, berekend op basis van bruto jaarloon, vermeerderd met een
      opslag van 32% voor werkgeverslasten en vervolgens gedeeld door 1.720 uur op basis van een 40-urige werkweek of een
      volledige werkweek;

      b. door de kosten, bedoeld in [artikel 1.3, eerste lid, onderdelen b tot en met d][ref2], te vermenigvuldigen
      met 20%, voor zover deze kosten geen verband houden met de uitvoering van overheidsopdrachten voor werken met
      een waarde boven het drempelbedrag, genoemd in artikel 4, onderdeel a, van [Richtlijn 2014/24](32014L0024)/EU van
      het Europees Parlement en de Raad van 26 februari 2014 betreffende het plaatsen van overheidsopdrachten en tot
      intrekking van [Richtlijn 2004/18/EG](32004L0018) (PbEU 2014, L 94); of

      c. voor personen die in deeltijd aan de uitvoering van de desbetreffende subsidiabele activiteit hebben gewerkt
      door het bruto loon, vermeerderd met een opslag van 32% voor werkgeverslasten, waarna over dat bedrag 15% aan
      overheadkosten wordt berekend, te vermenigvuldigen met het vaste percentage van de tijd dat zij per maand aan de
      activiteit hebben gewerkt.

      2 De kosten van de door een subsidieontvanger verrichte eigen arbeid als bedoeld in artikel 69, eerste lid,
      onderdeel e, van [verordening 1303/2013](32013R1303) ten behoeve van het project of de investering worden, indien
      een berekening overeenkomstig het eerste lid niet mogelijk is, berekend door het aantal uren dat de betrokken
      persoon ten behoeve van het project of de investering heeft gemaakt te vermenigvuldigen met een vast uurtarief
      van € 39.

      3 In afwijking van het tweede lid wordt in geval van subsidies op grond van verordening 508/2014, een vast
      uurtarief van € 36 berekend.

      4 Indien subsidie wordt verleend in de vorm, bedoeld in artikel 67, eerste lid, onder c, van [verordening
      1303/2013](32013R1303), is dit artikel niet van toepassing.

      5 Indien wordt gekozen voor de integrale kostensystematiek, zijn
      [artikel 12, derde lid, van het Kaderbesluit nationale EZ-subsidies][ref3] en
      [artikel 1.2, eerste lid, van de Regeling nationale EZ-subsidies][ref4], van overeenkomstige toepassing.


