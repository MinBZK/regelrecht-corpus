        artikel: '1.3'
        hoofdstuk: '1'
  - number: '1.6'
    text: |-
      Indien toepassing wordt gegeven aan [artikel 4:57 van de Algemene wet bestuursrecht][ref1],
      [artikel 6 van de Kaderwet EZ-subsidies][ref2] of in geval van terugvordering op grond van [verordening 1303/2013]
      (32013R1303), [verordening 1301/2013](32013R1301), [verordening 1305/2013](32013R1305), [verordening 508/2014]
      (32014R0508) of [verordening 809/2014](32014R0809), worden terug te vorderen bedragen vermeerderd met de wettelijke
      rente, bedoeld in [artikel 6:120, eerste lid, van het Burgerlijk Wetboek][ref3], die wordt berekend over de periode
      vanaf de datum van het verstrijken van de termijn waarbinnen betaling door de subsidieontvanger moet plaatsvinden
      en de datum van terugbetaling door de subsidieontvanger.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel457
      [ref2]: https://wetten.overheid.nl/BWBR0007919#Artikel6
