  - number: 3.1.6
    text: |-
      1 De subsidieontvanger blijft gedurende ten minste vijf jaar na de datum van de laatste betaling voldoen aan de
      voorwaarden van artikel 10, eerste lid, van [verordening 508/2014](32014R0508).

      2 Indien de subsidieontvanger subsidie aanwendt voor het verlenen van een opdracht waarbij de totale kosten bij
      één opdrachtnemer hoger zullen zijn dan € 25.000, vraagt hij voorafgaand aan de opdrachtverlening drie offertes op
      bij van elkaar onafhankelijke aanbieders. De subsidieontvanger gunt de opdracht aan de aanbieder met de economisch
      meest voordelige offerte.

      3 De minister kan op verzoek van de subsidieontvanger of de penvoerder ontheffing verlenen van de verplichting,
      bedoeld in het tweede lid. Aan de ontheffing kunnen voorschriften worden verbonden.

      4 Het tweede lid is niet van toepassing als de subsidieontvanger die subsidie wil aanwenden voor het verlenen van
      een opdracht een aanbestedende dienst is als bedoeld in [artikel 1.1 van de Aanbestedingswet 2012][ref1] en de
      opdracht die hij wil verlenen op grond van de [Aanbestedingswet 2012][ref2] moet worden aanbesteed.

      5 Indien het vierde lid van toepassing is, stelt de subsidieontvanger of de penvoerder de minister op de hoogte van
      de gevolgde procedure en de gunningsbeslissing, overeenkomstig [artikel 2.130 van de Aanbestedingswet 2012][ref3].

      6 Het tweede lid is niet van toepassing indien de subsidie wordt aangewend voor het verlenen van een opdracht aan
      een wetenschappelijke organisatie.

      7 De subsidieontvanger voert de communicatieactiviteiten uit, bedoeld in [artikel 3.1.4, onderdeel g][ref4].

      8 De subsidieontvanger draagt er zorg voor dat bij alle op het publiek gerichte voorlichtings- en
      publiciteitsmaatregelen duidelijk wordt gemaakt dat voor de desbetreffende concrete actie steun uit het Europees
      Fonds voor maritieme zaken en visserij is verleend, overeenkomstig de vereisten uit verordening 763/2014.

      9 De subsidieontvanger verleent de Europese Audit Autoriteit, de Europese Commissie of de Europese Rekenkamer alle
      medewerking die deze redelijkerwijs kan vorderen bij de uitoefening van hun taken.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0032203
      [ref3]: https://wetten.overheid.nl/BWBR0032203#Artikel2.130
      [ref4]: https://wetten.overheid.nl/BWBR0036758#Artikel3.1.4
