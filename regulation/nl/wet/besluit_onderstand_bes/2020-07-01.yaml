  - number: '21.2'
    text: |-
      De overeenkomstig het eerste lid herziene bedragen treden in de plaats van de bedragen, genoemd in de
      [artikelen 13][ref1], [14][ref2], [15][ref3], [16][ref4], [17][ref5] en [17a][ref6].


