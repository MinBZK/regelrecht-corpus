  - number: '21.4'
    text: |-
      Indien een wijziging als bedoeld in het derde lid samenvalt met een herziening als bedoeld in het eerste lid,
      wordt het bedrag voorafgaande aan de wijziging herzien en geschiedt de herziening bij de in het derde lid bedoelde
      ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel21
  - number: '22'
    text: |-
      De aanvraag van onderstand is gericht aan Onze Minister en geschiedt in het openbaar lichaam waar de alleenstaande
      of het gezin rechtmatig woonachtig is.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel22
  - number: '23.1'
    text: |-
      Onze Minister stelt het recht op onderstand op schriftelijke aanvraag of, indien een schriftelijke aanvraag niet
      mogelijk is, ambtshalve vast.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel23
  - number: '23.2'
    text: |-
      De onderstand wordt door de personen met een gezamenlijke huishouding gezamenlijk aangevraagd dan wel door een van
      hen met schriftelijke toestemming van de ander.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel23
  - number: '23.3'
    text: |-
      Onze Minister stelt het recht op onderstand ambtshalve vast indien een van de personen met een gezamenlijke
      huishouding niet met de aanvraag instemt, doch onderstandsverlening, gezien de belangen van de overige gezinsleden,
      niettemin geboden is.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel23
  - number: '24'
    text: |-
      Indien Onze Minister heeft vastgesteld dat recht op onderstand bestaat, wordt de onderstand toegekend vanaf de dag
      waarop dit recht is ontstaan, voor zover deze dag niet ligt voor de dag waarop de alleenstaande of het gezin de
      aanvraag van onderstand heeft ingediend.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel24
  - number: '25'
    text: De algemene onderstand wordt tweewekelijks vastgesteld en betaald.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel25
  - number: '26.1'
    text: De onderstand is niet vatbaar voor vervreemding of verpanding.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel26
  - number: '26.2'
    text: Bijzondere onderstand is niet vatbaar voor beslag.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel26
  - number: '26.3'
    text: |-
      Een machtiging tot het in ontvangst nemen van de onderstand, onder welke vorm of welke benaming ook verleend, is
      steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel26
  - number: '26.4'
    text: Elk beding, strijdig met dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel26
  - number: '27.1'
    text: Tenzij in dit besluit anders is bepaald, wordt de onderstand verleend om niet.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel27
  - number: '27.2'
    text: Tenzij in dit besluit anders wordt bepaald, wordt de onderstand verstrekt in de vorm van geld.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel27
  - number: '28'
    text: |-
      De alleenstaande die of het gezin dat eigenaar is van een door hemzelf of door het gezin bewoonde woning met
      bijbehorend erf, heeft recht op onderstand voor zover tegeldemaking, bezwaring of verdere bezwaring, van het in de
      woning met bijbehorend erf gebonden vermogen in redelijkheid niet kan worden verlangd.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel28
  - number: '29.1'
    text: |-
      Onze Minister is bevoegd om bij wijze van voorschot algemene of bijzondere onderstand te verlenen in de vorm van
      een renteloze geldlening, zolang het recht op algemene of bijzondere onderstand niet is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel29
  - number: '29.2'
    text: |-
      Indien onderstand wordt verleend over een periode waarover met toepassing van het eerste lid een voorschot is
      verleend, kan deze onderstand zonder machtiging van de belanghebbende worden verrekend met dit voorschot.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel29
  - number: '30.1'
    text: |-
      Indien de alleenstaande of het gezin de voor de verlening van onderstand van belang zijnde gegevens of de
      gevorderde bewijsstukken niet, niet tijdig of onvolledig heeft verstrekt en de alleenstaande of het gezin dit te
      verwijten valt, dan wel indien de alleenstaande of het gezin anderszins onvoldoende medewerking verleent, kan Onze
      Minister het recht op onderstand beëindigen.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel30
  - number: '30.2'
    text: |-
      Alvorens Onze Minister een besluit neemt tot beëindiging van het recht op onderstand, nodigt Onze Minister de
      alleenstaande of het gezin uit om binnen een door hem te stellen termijn het verzuim te herstellen.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel30
  - number: '31.1'
    text: |-
      Naast de verplichtingen die op grond van [hoofdstuk 2][ref1] in elk geval aan de onderstand verbonden zijn, dan
      wel daaraan door Onze Minister verbonden worden, kan Onze Minister vanaf de dag waarop de alleenstaande of het
      gezin onderstand heeft aangevraagd als bedoeld in [artikel 22][ref2], verplichtingen opleggen die strekken tot
      arbeidsinschakeling, dan wel die verband houden met aard en doel van een bepaalde vorm van onderstand of die
      strekken tot zijn vermindering of beëindiging.


      [ref1]: https://wetten.overheid.nl/BWBR0028595#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0028595#Artikel22
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0028595
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0028595
        artikel: '22'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '31.2'
    text: |-
      Een verplichting als bedoeld in het eerste lid kan, op advies van een arts, inhouden het zich onderwerpen aan een
      noodzakelijke behandeling van medische aard.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel31
  - number: '32'
    text: |-
      Indien en zolang er gegronde redenen zijn om aan te nemen dat de alleenstaande of het gezin zonder hulp niet in
      staat is tot een verantwoorde besteding van zijn bestaansmiddelen, kan Onze Minister:
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel32
  - number: 32.a
    text: |-
      aan de onderstand de verplichting verbinden dat de alleenstaande of het gezin eraan meewerkt dat Onze Minister in
      naam van de alleenstaande of het gezin noodzakelijke betalingen uit de toegekende onderstand verricht;
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel32
  - number: 32.b
    text: de onderstand in natura verstrekken.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel32
  - number: '33.1'
    text: 'Onze Minister kan kosten van onderstand terugvorderen, voor zover de onderstand:'
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel33
  - number: 33.1.a
    text: ten onrechte of tot een te hoog bedrag is verleend;
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel33
  - number: 33.1.b
    text: |-
      op grond van [artikel 29][ref1] bij wijze van voorschot is verleend en nadien is vastgesteld dat geen recht op
      onderstand bestaat;


      [ref1]: https://wetten.overheid.nl/BWBR0028595#Artikel29
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0028595
        artikel: '29'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 33.1.c
    text: anderszins onverschuldigd is betaald voor zover de belanghebbende dit redelijkerwijs had kunnen begrijpen, of
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel33
  - number: 33.1.d
    text: 'anderszins onverschuldigd is betaald, waaronder begrepen dat:'
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel33
  - number: 33.1.d.1°
    text: |-
      de belanghebbende naderhand met betrekking tot de periode waarover onderstand is verleend, over in aanmerking te
      nemen middelen als bedoeld in [paragraaf 3.3][ref1] beschikt of kan beschikken;


      [ref1]: https://wetten.overheid.nl/BWBR0028595#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0028595
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 33.1.d.2°
    text: |-
      onderstand is verleend met een bepaalde bestemming en naderhand door de belanghebbende vergoedingen of
      tegemoetkomingen worden ontvangen met het oog op die bestemming.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel33
  - number: '33.2'
    text: |-
      Het in aanmerking nemen van in de voorafgaande drie maanden ontvangen middelen, voor zover deze niet vallen onder
      de vrijlating, bedoeld in [artikel 19][ref1], wordt niet als terugvordering beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0028595#Artikel19
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0028595
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: '33.3'
    text: |-
      Bij gebreke van tijdige betaling kan de vordering worden verhoogd met de wettelijke rente en de op de
      terugvordering betrekking hebbende kosten.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel33
  - number: '34.1'
    text: |-
      Onverminderd [artikel 33][ref1] kunnen kosten van onderstand, indien de onderstand aan een gezin wordt verleend,
      van alle gezinsleden worden teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0028595#Artikel33
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0028595
        artikel: '33'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: '34.2'
    text: |-
      De in het eerste lid bedoelde personen zijn hoofdelijk aansprakelijk voor de terugbetaling van kosten van
      onderstand die worden teruggevorderd.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel34
  - number: '35.1'
    text: |-
      Een besluit tot terugvordering van kosten van onderstand vermeldt hetgeen wordt teruggevorderd, de termijn of
      termijnen waarbinnen moet worden betaald, alsmede de wijze waarop het besluit, bij gebreke van tijdige betaling,
      ten uitvoer wordt gelegd.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel35
  - number: '35.2'
    text: |-
      De persoon van wie kosten van onderstand worden teruggevorderd, is verplicht desgevraagd aan Onze Minister de
      inlichtingen te verstrekken die voor terugvordering op grond van deze paragraaf van belang zijn.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel35
  - number: '36.1'
    text: |-
      Een ieder is verplicht desgevraagd en bevoegd uit eigen beweging aan Onze Minister kosteloos opgaven en
      inlichtingen te verstrekken omtrent feiten en omstandigheden die noodzakelijk zijn voor de uitvoering van dit
      besluit ten opzichte van een persoon te wiens behoeve onderstand is gevraagd of wordt verleend en die in zijn
      dienst dan wel voor hem arbeid verricht, heeft verricht of zou kunnen gaan verrichten. De verplichting strekt zich
      mede uit tot de inkomsten van een persoon van wie kosten van onderstand op grond van [paragraaf 6.4][ref1] worden
      of kunnen worden teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0028595#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0028595
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: '36.2'
    text: |-
      De opgaven en inlichtingen worden desgevraagd schriftelijk, of in een andere vorm die redelijkerwijs kan worden
      verlangd, binnen een door Onze Minister schriftelijk te stellen termijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel36
  - number: '37'
    text: |-
      Bij regeling van Onze Minister aangewezen instanties en personen zijn verplicht desgevraagd aan Onze Minister
      kosteloos opgaven en inlichtingen te verstrekken die noodzakelijk zijn voor de uitvoering van dit besluit.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel37
  - number: '38.1'
    text: |-
      Het is een ieder verboden hetgeen hem uit of in verband met enige werkzaamheid bij de uitvoering van dit besluit
      over de persoon of zaken van een ander blijkt of wordt meegedeeld, verder bekend te maken dan voor de uitvoering
      van dit besluit noodzakelijk is dan wel op grond van dit besluit is voorgeschreven of toegestaan.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel38
  - number: '38.2'
    text: 'Het in het eerste lid vervatte verbod is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel38
  - number: 38.2.a
    text: enig wettelijk voorschrift tot bekendmaking verplicht;
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel38
  - number: 38.2.b
    text: |-
      degene op wie de gegevens betrekking hebben schriftelijk heeft verklaard tegen de verstrekking van deze gegevens
      geen bezwaar te hebben;
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel38
  - number: 38.2.c
    text: de gegevens niet herleidbaar zijn tot individuele natuurlijke personen.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel38
  - number: '38.3'
    text: |-
      Ten behoeve van wetenschappelijk onderzoek of statistiek kunnen desgevraagd gegevens aan derden worden verstrekt
      voor zover de persoonlijke levenssfeer van de belanghebbende daardoor niet onevenredig wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel38
  - number: '39'
    text: |-
      Onze Minister is verplicht, indien hij bij de uitvoering van dit besluit het gegronde vermoeden krijgt van
      een misdrijf dat is gepleegd ten nadele van een Nederlands of buitenlands uitvoeringsorgaan van de sociale
      verzekeringswetten of van een Nederlands of buitenlands overheidsorgaan, voor zover dit is belast met het
      verrichten van uitkeringen, het doen van verstrekkingen dan wel het heffen van bijdragen, het betrokken orgaan
      hiervan in kennis te stellen.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel39
  - number: '40'
    text: |-
      Bij regeling van Onze Minister worden instanties en personen aangewezen aan wie Onze Minister bevoegd is om uit
      eigen beweging en verplicht desgevraagd uit de administratie ter zake van de uitvoering van dit besluit kosteloos
      gegevens te verstrekken en wordt bepaald voor welke doeleinden deze gegevens mogen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel40
  - number: 40a.1
    text: De bekendmaking van een beschikking geschiedt door toezending of uitreiking aan de belanghebbende.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel40a
  - number: 40a.2
    text: |-
      Indien de bekendmaking van de beschikking niet kan geschieden op de wijze als voorzien in het eerste lid geschiedt
      zij op een andere geschikte wijze.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel40a
  - number: 40a.3
    text: |-
      De beschikking vermeldt de dagtekening van de beslissing, de gronden waarop deze berust, alsmede waar beroep kan
      worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel40a
  - number: 40b.1
    text: |-
      De belanghebbende kan tegen een beschikking op grond van dit besluit beroep instellen bij het Gerecht, bedoeld in
      [artikel 1, eerste lid, onderdeel b, van de Wet administratieve rechtspraak BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel1
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel40b
    references:
      - id: ref1
        bwb_id: BWBR0028455
        artikel: '1'
  - number: 40b.2
    text: |-
      Bij een beroep tegen een beschikking op grond van [artikel 7, eerste lid, onderdeel f][ref1], is
      [artikel 23, eerste lid, laatste zin, van de Wet administratieve rechtspraak BES][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028595#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0028455#Artikel23
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel40b
    references:
      - id: ref1
        bwb_id: BWBR0028595
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0028455
        artikel: '23'
  - number: 40b.3
    text: |-
      Bij een bestuurlijke heroverweging van een beschikking op grond van [artikel 7, eerste lid, onderdeel f][ref1],
      is [artikel 24, eerste en tweede lid, van de Wet administratieve rechtspraak BES][ref2] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028595#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0028455#Artikel24
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel40b
    references:
      - id: ref1
        bwb_id: BWBR0028595
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0028455
        artikel: '24'
  - number: 40b.4
    text: |-
      Met betrekking tot een beschikking op grond van [artikel 7, eerste lid, onderdeel f][ref1], kan het
      Gerecht, bedoeld in [artikel 1, eerste lid, onderdeel b, van de Wet administratieve rechtspraak BES][ref2],
      indien het bestuursorgaan niet voldoet aan de verplichting, bedoeld in
      [artikel 23 van de Wet administratieve rechtspraak BES][ref3], daaruit de gevolgtrekking maken die hem geraden
      voorkomt.


      [ref1]: https://wetten.overheid.nl/BWBR0028595#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0028455#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0028455#Artikel23
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel40b
    references:
      - id: ref1
        bwb_id: BWBR0028595
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0028455
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0028455
        artikel: '23'
  - number: '41.1'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens dit besluit bepaalde zijn belast de daartoe bij besluit
      van Onze Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel41
  - number: '41.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel41
  - number: '41.3'
    text: |-
      [Titel 5.2 van de Algemene wet bestuursrecht][ref1] is van toepassing, met uitzondering van de
      [artikelen 5.18][ref2] en [5.19][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 41a
    text: |-
      [Afdeling 3.3 van de Algemene wet bestuursrecht][ref1] is van toepassing met dien verstande dat in:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.3
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.3'
  - number: 41a.a
    text: |-
      [artikel 3:5, eerste lid][ref1], in plaats van «besluiten» wordt gelezen «beschikkingen» en in de
      [artikelen 3:6, tweede lid][ref2], [3:8][ref3] en [3:9][ref4] in plaats van «het besluit» wordt gelezen «de
      beschikking»;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 41a.b
    text: |-
      [artikel 3:7, tweede lid][ref1], in plaats van «[Artikel 10 van de Wet openbaarheid van bestuur][ref2]» wordt
      gelezen «[Artikel 11 van de Wet openbaarheid van bestuur BES][ref3]».


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005252#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0028154#Artikel11
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005252
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0028154
        artikel: '11'
  - number: '42'
    text: |-
      Dit besluit treedt in werking op het tijdstip waarop
      __REF000___________________________________________________________________________________________________________
      _____ in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0028249#ArtikelI
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0028249
        artikel: I
  - number: '43'
    text: 'Dit besluit wordt aangehaald als: Besluit onderstand BES.'
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel43
