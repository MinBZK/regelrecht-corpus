preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid van 13 juli 2010, nr. IVV/I/2010/13018,
    gedaan mede namens de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties;

    Gelet op artikel 18.3, eerste, vierde en vijfde lid, van de Invoeringswet openbare lichamen Bonaire, Sint Eustatius
    en Saba;

    De Raad van State gehoord (advies van 12 augustus 2010, nr. W12.10.0343/III);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid van 8 september 2010, nr. IVV/
    I/2010/16119, uitgebracht mede namens de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties,

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *minimumloon:* bruto minimumuurloon,
      genoemd in [artikel 9 van de Wet minimumlonen BES][ref1], vermenigvuldigd met 80 uur;
        - *Onze Minister:* Onze Minister van Sociale Zaken en Werkgelegenheid;
        - *openbaar lichaam/openbare lichamen:* openbare lichamen Bonaire, Sint Eustatius of Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0028170#Artikel9
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028170
        artikel: '9'
  - number: '2.1'
    text: |-
      Van een gezamenlijke huishouding is sprake indien twee personen hun hoofdverblijf in dezelfde woning hebben en zij
      blijk geven zorg te dragen voor elkaar door middel van het leveren van een bijdrage in de kosten van de huishouding
      dan wel anderszins.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel2
  - number: '2.2'
    text: |-
      Een gezamenlijke huishouding wordt in ieder geval aanwezig geacht indien de belanghebbenden hun hoofdverblijf
      hebben in dezelfde woning en:
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel2
  - number: 2.2.a
    text: zij met elkaar gehuwd zijn of zijn geweest; of
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel2
  - number: 2.2.b
    text: uit hun relatie een kind is geboren of erkenning heeft plaatsgevonden van een kind van de een door de ander.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel2
  - number: '2.3'
    text: |-
      Indien twee personen hun hoofdverblijf hebben in dezelfde woning en tussen hen bloedverwantschap bestaat tot en
      met de tweede graad, kan Onze Minister bepalen dat dit gelet op alle omstandigheden niet wordt aangemerkt als een
      gezamenlijke huishouding.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel2
  - number: '3'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *alleenstaande:* de ongehuwde die geen
      tot zijn last komende kinderen heeft en geen gezamenlijke huishouding voert met een ander;
        - *alleenstaande ouder:* de ongehuwde die de volledige zorg heeft voor een of meer tot zijn last komende kinderen
      en geen gezamenlijke huishouding voert met een ander;
        - *gezin:* a. de personen met een gezamenlijke huishouding tezamen; b. de personen met een gezamenlijke huishouding
      met de tot hun last komende kinderen; c. de alleenstaande ouder met de tot zijn last komende kinderen;
        - *kind:* het in een openbaar lichaam woonachtige eigen kind, stiefkind of pleegkind;
        - *ten laste komend kind:* het kind jonger dan 18 jaar dat tot het huishouden behoort van de alleenstaande ouder of
      de gehuwde en door hem in belangrijke mate wordt onderhouden;
        - *uitreiziger:* persoon ten aanzien van wie op grond van een melding van de opsporingsdiensten of inlichtingen-
      en veiligheidsdiensten, gericht aan Onze Minister, is gebleken dat het gegronde vermoeden bestaat dat deze persoon
      zich buiten de openbare lichamen bevindt met het doel om zich aan te sluiten bij een organisatie die is geplaatst
      op de lijst van organisaties, bedoeld in [artikel 14, vierde lid, van de Rijkswet op het Nederlanderschap][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel14
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '14'
  - number: '4'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *algemene onderstand:* de onderstand ter
      voorziening in de algemeen noodzakelijke kosten van het bestaan;
        - *arbeidsinschakeling:* het verkrijgen van algemeen geaccepteerde arbeid;
        - *bijzondere onderstand:* de onderstand, bedoeld in [artikel 20][ref1];
        - *onderstand:* algemene en bijzondere onderstand;
        - *voorliggende voorziening:* elke voorziening buiten dit besluit waarop de alleenstaande of het gezin aanspraak
      kan maken, dan wel een beroep kan doen, ter verwerving van middelen of ter bekostiging van specifieke uitgaven;
        - *zelfstandig wonend:* de situatie waarin geen ander dan de alleenstaande, de alleenstaande ouder of het gezin
      zijn hoofdverblijf heeft in de woning van de alleenstaande, de alleenstaande ouder of het gezin.


      [ref1]: https://wetten.overheid.nl/BWBR0028595#Artikel20
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028595
        artikel: '20'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '5.1'
    text: |-
      De belanghebbende van 18 jaar of ouder doch jonger dan de leeftijd waarop recht op ouderdomspensioen ontstaat op
      grond van de [Wet algemene ouderdomsverzekering BES][ref1] is vanaf de dag van aanvraag van onderstand verplicht:


      [ref1]: https://wetten.overheid.nl/BWBR0028459
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028459
  - number: 5.1.a
    text: naar vermogen algemeen geaccepteerde arbeid te verkrijgen en deze te aanvaarden;
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel5
  - number: 5.1.b
    text: zich aan te melden voor arbeidsbemiddeling bij het bestuurscollege van het openbaar lichaam;
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel5
  - number: 5.1.c
    text: |-
      gebruik te maken van een door of vanwege het bestuurscollege aangeboden voorziening gericht op arbeidsinschakeling,
      alsmede mee te werken aan een onderzoek naar zijn mogelijkheden tot arbeidsinschakeling.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel5
  - number: '5.2'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn, kan Onze Minister in individuele gevallen tijdelijk ontheffing
      verlenen van een verplichting als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel5
  - number: '5.3'
    text: |-
      Indien onderstand wordt verleend aan personen met een gezamenlijke huishouding gelden de verplichtingen, bedoeld in
      het eerste lid, voor ieder van hen.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel5
  - number: '6.1'
    text: |-
      De persoon die rechtmatig woonachtig is in een openbaar lichaam en die naar het oordeel van Onze Minister aldaar
      in zodanige omstandigheden verkeert dat hij niet de middelen kan verwerven om in de noodzakelijke kosten van
      het bestaan te voorzien en die voldoet aan de plicht tot arbeidsinschakeling, heeft recht op onderstand van
      overheidswege.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel6
  - number: '6.2'
    text: |-
      Het recht op onderstand komt de personen met een gezamenlijke huishouding gezamenlijk toe, tenzij een van deze
      personen geen recht heeft op onderstand.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel6
  - number: '7.1'
    text: 'Geen recht op onderstand heeft de persoon:'
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel7
  - number: 7.1.a
    text: aan wie rechtens zijn vrijheid is ontnomen;
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel7
  - number: 7.1.b
    text: |-
      die wegens werkstaking of uitsluiting niet deelneemt aan de arbeid, voor zover diens gebrek aan middelen daarvan
      het gevolg is;
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel7
  - number: 7.1.c
    text: |-
      die op het moment van aanvraag korter dan vijf jaar onafgebroken rechtmatig woonachtig is in de openbare lichamen,
      tenzij naar het oordeel van Onze Minister van Justitie de te voorziene onderstandsbehoeftigheid geen aanleiding zal
      zijn het recht tot verblijf van de betrokken persoon te beëindigen;
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel7
  - number: 7.1.d
    text: |-
      voor zover die per kalenderjaar langer dan vier weken verblijf houdt buiten de openbare lichamen dan wel een
      aaneengesloten periode van langer dan vier weken verblijf houdt buiten de openbare lichamen;
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel7
  - number: 7.1.e
    text: die jonger is dan 18 jaar;
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel7
  - number: 7.1.f
    text: die een uitreiziger is.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel7
  - number: '7.2'
    text: |-
      Het eerste lid, onderdeel c, is niet van toepassing op de persoon die, nadat hij ten minste vijf jaar onafgebroken
      rechtmatig woonachtig is geweest in de openbare lichamen:
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel7
  - number: 7.2.a
    text: |-
      de openbare lichamen metterwoon heeft verlaten en binnen vijf jaar na dit vertrek opnieuw rechtmatig woonachtig is
      in de openbare lichamen; of
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel7
  - number: 7.2.b
    text: |-
      de openbare lichamen om redenen van studie metterwoon heeft verlaten en binnen vijf jaar na beëindiging van de
      studie opnieuw rechtmatig woonachtig is in de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel7
  - number: '7.3'
    text: |-
      In afwijking van het eerste lid, onderdeel d, geldt voor personen die de leeftijd hebben bereikt waarop recht op
      ouderdomspensioen ontstaat op grond van de [Wet algemene ouderdomsverzekering BES][ref1], een periode van dertien
      weken.


      [ref1]: https://wetten.overheid.nl/BWBR0028459
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028459
  - number: '8'
    text: 'In ieder geval worden niet tot de noodzakelijke kosten van het bestaan gerekend:'
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel8
  - number: 8.a
    text: de voldoening van alimentatieverplichtingen;
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel8
  - number: 8.b
    text: de betaling van een boete;
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel8
  - number: 8.c
    text: geleden of toegebrachte schade;
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel8
  - number: 8.d
    text: de aflossing van schulden.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel8
  - number: '9'
    text: |-
      Geen recht op onderstand bestaat voor zover een beroep kan worden gedaan op een voorliggende voorziening die,
      gezien haar aard en doel, wordt geacht voor de belanghebbende toereikend en passend te zijn. Het recht op
      onderstand strekt zich evenmin uit tot kosten die in de voorliggende voorziening als niet-noodzakelijk worden
      aangemerkt.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel9
  - number: '10'
    text: |-
      Aan een persoon die geen recht op onderstand heeft, kan Onze Minister, gelet op alle omstandigheden, in afwijking
      van deze paragraaf onderstand verlenen, indien zeer dringende redenen daartoe noodzaken.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel10
  - number: '11.1'
    text: |-
      De belanghebbende doet aan Onze Minister op verzoek of onverwijld uit eigen beweging mededeling van alle
      feiten en omstandigheden waarvan hem redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op zijn
      arbeidsinschakeling of het recht op onderstand.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel11
  - number: '11.2'
    text: |-
      De belanghebbende is verplicht aan Onze Minister desgevraagd de medewerking te verlenen die redelijkerwijs nodig is
      voor de uitvoering van dit besluit.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel11
  - number: '11.3'
    text: |-
      Onze Minister stelt bij de uitvoering van dit besluit de identiteit van de belanghebbende vast aan de hand van een
      document als bedoeld in [artikel 2 van de Wet identificatieplicht BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028575#Artikel2
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028575
        artikel: '2'
  - number: '12.1'
    text: |-
      Onze Minister stemt de onderstand en de daaraan verbonden verplichtingen af op de omstandigheden, mogelijkheden
      en middelen van de belanghebbende, alsmede op het betoonde besef van verantwoordelijkheid voor de voorziening in
      het bestaan.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel12
  - number: '12.2'
    text: |-
      Indien de belanghebbende naar het oordeel van Onze Minister tekortschietend besef van verantwoordelijkheid betoont
      voor de voorziening in het bestaan dan wel de uit dit besluit voortvloeiende verplichtingen niet of niet voldoende
      nakomt, waaronder begrepen het zich jegens Onze Minister zeer ernstig misdragen, kan Onze Minister de onderstand
      verlagen. Van een verlaging wordt afgezien indien elke mate van verwijtbaarheid ontbreekt.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel12
  - number: '12.3'
    text: Bij de toepassing van het eerste lid wordt onder belanghebbende persoon mede verstaan het gezin.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel12
  - number: '12.4'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld met betrekking tot het verlagen van de onderstand, bedoeld in
      het tweede lid.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel12
  - number: '13'
    text: |-
      Het basisbedrag van de algemene onderstand bedraagt per twee weken:






                  a. indien de belanghebbende woonachtig is in het openbaar lichaam Bonaire:


                  USD 151 ;




                  b. indien de belanghebbende woonachtig is in het openbaar lichaam Sint Eustatius:


                  USD 185;




                  c. indien de belanghebbende woonachtig is in het openbaar lichaam Saba:


                  USD 181.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel13
  - number: '14'
    text: |-
      Het basisbedrag van de algemene onderstand, genoemd in [artikel 13][ref1], wordt voor een zelfstandig wonende
      belanghebbende verhoogd met een toeslag per twee weken van:






                  a. indien de belanghebbende woonachtig is in het openbaar lichaam Bonaire:


                  USD 19 ;




                  b. indien de belanghebbende woonachtig is in het openbaar lichaam Sint Eustatius:


                  USD 19 ;




                  c. indien de belanghebbende woonachtig is in het openbaar lichaam Saba:


                  USD 19 .


      [ref1]: https://wetten.overheid.nl/BWBR0028595#Artikel13
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028595
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '15'
    text: |-
      Het basisbedrag van de algemene onderstand, genoemd in [artikel 13][ref1], wordt voor personen met een gezamenlijke
      huishouding verhoogd met een toeslag per twee weken van:






                  a. indien de belanghebbende woonachtig is in het openbaar lichaam Bonaire:


                  USD 47 :




                  b. indien de belanghebbende woonachtig is in het openbaar lichaam Sint Eustatius:


                  USD 47 ;




                  c. indien de belanghebbende woonachtig is in het openbaar lichaam Saba:


                  USD 47 .


      [ref1]: https://wetten.overheid.nl/BWBR0028595#Artikel13
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028595
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '16.1'
    text: |-
      Het basisbedrag van de algemene onderstand, genoemd in [artikel 13][ref1], wordt voor een gezin met een of meer ten
      laste komende kinderen verhoogd met een toeslag per twee weken van:






                    a. indien het gezin woonachtig is in het openbaar lichaam Bonaire:


                    USD 23 ;




                    b. indien het gezin woonachtig is in het openbaar lichaam Sint Eustatius:


                    USD 23 ;




                    c. indien het gezin woonachtig is in het openbaar lichaam Saba:


                    USD 23




                    voor het eerste kind.


      [ref1]: https://wetten.overheid.nl/BWBR0028595#Artikel13
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028595
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '16.2'
    text: |-
      Het basisbedrag van de algemene onderstand, genoemd in [artikel 13][ref1], wordt voor een gezin met twee of meer
      ten laste komende kinderen verhoogd met een toeslag per twee weken van:






                    a. indien het gezin woonachtig is in het openbaar lichaam Bonaire:


                    USD 12 ;




                    b. indien het gezin woonachtig is in het openbaar lichaam Sint Eustatius:


                    USD 12 ;




                    c. indien het gezin woonachtig is in het openbaar lichaam Saba:


                    USD 12




                    per kind voor het tweede en derde kind.


      [ref1]: https://wetten.overheid.nl/BWBR0028595#Artikel13
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028595
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '16.3'
    text: Het gezin heeft voor ten hoogste drie kinderen recht op toeslag.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel16
  - number: '17.1'
    text: |-
      Het basisbedrag van de algemene onderstand, genoemd in [artikel 13][ref1], wordt bij volledige en duurzame
      arbeidsongeschiktheid van de alleenstaande, van de alleenstaande ouder of van een van de personen dan wel beide
      personen die een gezamenlijke huishouding voeren, verhoogd met een enkelvoudige toeslag per twee weken van:






                    a. indien de belanghebbende woonachtig is in het openbaar lichaam Bonaire:


                    USD 100;




                    b. indien de belanghebbende woonachtig is in het openbaar lichaam Sint Eustatius:


                    USD 122;




                    c. indien de belanghebbende woonachtig is in het openbaar lichaam Saba:


                    USD 120.


      [ref1]: https://wetten.overheid.nl/BWBR0028595#Artikel13
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028595
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '17.2'
    text: |-
      Voor de toepassing van het eerste lid is volledig en duurzaam arbeidsongeschikt, de persoon die als rechtstreeks
      en objectief medisch vast te stellen gevolg van ziekte of gebrek volledig en duurzaam niet in staat is om algemeen
      geaccepteerde arbeid te verrichten.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel17
  - number: '17.3'
    text: |-
      Indien recht bestaat op de toeslag, bedoeld in [artikel 17a][ref1], bestaat er geen recht op de toeslag, bedoeld in
      het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028595#Artikel17a
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028595
        artikel: 17a
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 17a
    text: |-
      Het basisbedrag van de algemene onderstand, genoemd in [artikel 13][ref1], wordt voor de alleenstaande,
      de alleenstaande ouder of de personen die een gezamenlijke huishouding voeren, die de leeftijd heeft
      bereikt of die de leeftijd hebben bereikt waarop recht op ouderdomspensioen ontstaat op grond van de
      [Wet algemene ouderdomsverzekering BES][ref2], verhoogd met een enkelvoudige toeslag per twee weken van:


      [ref1]: https://wetten.overheid.nl/BWBR0028595#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0028459
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0028595
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0028459
  - number: 17a.a
    text: 'indien de belanghebbende woonachtig is in het openbaar lichaam Bonaire: USD 186 ;'
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel17a
  - number: 17a.b
    text: 'indien de belanghebbende woonachtig is in het openbaar lichaam Sint Eustatius: USD 233 ;'
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel17a
  - number: 17a.c
    text: 'indien de belanghebbende woonachtig is in het openbaar lichaam Saba: USD 224 .'
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel17a
  - number: 17b
    text: |-
      Het basisbedrag van de algemene onderstand, genoemd in [artikel 13][ref1], en de toeslagen, genoemd in de
      [artikelen 14 tot en met 17a][ref2], bij elkaar overschrijden niet de hoogte van het minimumloon.


      [ref1]: https://wetten.overheid.nl/BWBR0028595#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0028595#Artikel14
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0028595
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0028595
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '18.1'
    text: |-
      Tot de middelen worden alle vermogens- en inkomensbestanddelen gerekend waarover de alleenstaande of het gezin
      beschikt of redelijkerwijs kan beschikken.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel18
  - number: '18.2'
    text: 'Niet tot de middelen worden gerekend:'
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel18
  - number: 18.2.a
    text: |-
      bijdragen van familie en derden voor zover deze naar het oordeel van Onze Minister uit een oogpunt van verlening
      van onderstand verantwoord zijn;
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel18
  - number: 18.2.b
    text: |-
      de kinderbijslag BES, bedoeld in [artikel 9 van de Wet kinderbijslagvoorziening BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037347#Artikel9
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0037347
        artikel: '9'
  - number: 18.2.c
    text: |-
      de kerstuitkering, bedoeld in [artikel 22a van de Wet algemene ouderdomsverzekering BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel22a
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: 22a
  - number: '19'
    text: |-
      Inkomsten uit arbeid die de alleenstaande of het gezin heeft verworven over de periode waarin beroep wordt gedaan
      op onderstand, worden vrijgelaten voor zover de onderstand en de verworven inkomsten bij elkaar de hoogte van het
      minimumloon niet overschrijden.
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel19
  - number: '20'
    text: |-
      Onverminderd [paragraaf 2.2.][ref1] kan Onze Minister bijzondere onderstand toekennen aan de alleenstaande
      of het gezin voor zover de alleenstaande of het gezin niet de middelen kan verwerven om te voorzien in de uit
      bijzondere omstandigheden voortvloeiende noodzakelijke kosten van het bestaan en voldoet aan de plicht tot
      arbeidsinschakeling, behoudens in geval de omstandigheid, bedoeld in [artikel 17][ref2], aan de orde is.


      [ref1]: https://wetten.overheid.nl/BWBR0028595#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0028595#Artikel17
    url: https://wetten.overheid.nl/BWBR0028595/2020-07-01#Artikel20
    references:
