        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0028595
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '21.1'
    text: |-
      Indien uit de door het Centraal Bureau voor de Statistiek vast te stellen consumentenprijsindexcijfers voor
      Bonaire, Sint Eustatius en Saba blijkt, dat de prijsindexcijfers voor het derde kwartaal van het lopende jaar,
      vergeleken met de prijsindexcijfers voor het derde kwartaal van het voorafgaande jaar zijn gestegen of gedaald, kan
      Onze Minister bedragen vaststellen, die met ingang van 1 januari van het komende jaar in de plaats treden van de
      in de [artikelen 13][ref1], [14][ref2], [15][ref3], [16][ref4], [17][ref5] en [17a][ref6] genoemde bedragen. Onze
      Minister bepaalt welke consumentenprijsindexcijfers zoals vastgesteld door het Centraal Bureau voor de Statistiek
      voor de toepassing van de eerste zin worden gebruikt. De consumentenprijsindexcijfers kunnen voor de onderscheiden
      openbare lichamen verschillend zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028595#Artikel13
