  - number: '21.3'
    text: |-
      Indien er naar het oordeel van Onze Minister bijzondere omstandigheden zijn, kunnen de bedragen, genoemd in de
      [artikelen 13][ref1], [14][ref2], [15][ref3], [16][ref4], [17][ref5] en [17a][ref6] bij ministeriële regeling met
      ingang van een bij die regeling aan te geven datum worden gewijzigd. De gewijzigde bedragen treden in de plaats van
      de bedragen, genoemd in de [artikelen 13][ref7], [14][ref8], [15][ref9], [16][ref10], [17][ref11] en [17a][ref12].


      [ref1]: https://wetten.overheid.nl/BWBR0028595#Artikel13
