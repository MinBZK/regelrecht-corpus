  - number: '22'
    text: |-
      De aanvraag van onderstand is gericht aan Onze Minister en geschiedt in het openbaar lichaam waar de alleenstaande
      of het gezin rechtmatig woonachtig is.
    url: https://wetten.overheid.nl/BWBR0028595/2026-01-01#Artikel22
  - number: '23'
    text: |-
      1 Onze Minister stelt het recht op onderstand op schriftelijke aanvraag of, indien een schriftelijke aanvraag niet
      mogelijk is, ambtshalve vast.

      2 De onderstand wordt door de personen met een gezamenlijke huishouding gezamenlijk aangevraagd dan wel door een
      van hen met schriftelijke toestemming van de ander.

      3 Onze Minister stelt het recht op onderstand ambtshalve vast indien een van de personen met een gezamenlijke
      huishouding niet met de aanvraag instemt, doch onderstandsverlening, gezien de belangen van de overige gezinsleden,
      niettemin geboden is.
    url: https://wetten.overheid.nl/BWBR0028595/2026-01-01#Artikel23
  - number: '24'
    text: |-
      Indien Onze Minister heeft vastgesteld dat recht op onderstand bestaat, wordt de onderstand toegekend vanaf de dag
      waarop dit recht is ontstaan, voor zover deze dag niet ligt voor de dag waarop de alleenstaande of het gezin de
      aanvraag van onderstand heeft ingediend.
    url: https://wetten.overheid.nl/BWBR0028595/2026-01-01#Artikel24
  - number: '25'
    text: De algemene onderstand wordt tweewekelijks vastgesteld en betaald.
    url: https://wetten.overheid.nl/BWBR0028595/2026-01-01#Artikel25
  - number: '26'
    text: |-
      1 De onderstand is niet vatbaar voor vervreemding of verpanding.

      2 Bijzondere onderstand is niet vatbaar voor beslag.

      3 Een machtiging tot het in ontvangst nemen van de onderstand, onder welke vorm of welke benaming ook verleend, is
      steeds herroepelijk.

      4 Elk beding, strijdig met dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0028595/2026-01-01#Artikel26
  - number: '27'
    text: |-
      1 Tenzij in dit besluit anders is bepaald, wordt de onderstand verleend om niet.

      2 Algemene onderstand wordt in geld verstrekt, tenzij naar het oordeel van Onze Minister in een individuele
      situatie verstrekking in natura is aangewezen.

      3 Bijzondere onderstand wordt in natura verstrekt, tenzij naar het oordeel van Onze Minister in een individuele
      situatie verstrekking in geld is aangewezen.
    url: https://wetten.overheid.nl/BWBR0028595/2026-01-01#Artikel27
  - number: '28'
    text: |-
      De alleenstaande die of het gezin dat eigenaar is van een door hemzelf of door het gezin bewoonde woning met
      bijbehorend erf, heeft recht op onderstand voor zover tegeldemaking, bezwaring of verdere bezwaring, van het in de
      woning met bijbehorend erf gebonden vermogen in redelijkheid niet kan worden verlangd.
    url: https://wetten.overheid.nl/BWBR0028595/2026-01-01#Artikel28
  - number: '29'
    text: |-
      1 Onze Minister is bevoegd om bij wijze van voorschot algemene of bijzondere onderstand te verlenen in de vorm van
      een renteloze geldlening, zolang het recht op algemene of bijzondere onderstand niet is vastgesteld.

      2 Indien onderstand wordt verleend over een periode waarover met toepassing van het eerste lid een voorschot is
      verleend, kan deze onderstand zonder machtiging van de belanghebbende worden verrekend met dit voorschot.
    url: https://wetten.overheid.nl/BWBR0028595/2026-01-01#Artikel29
  - number: '30'
    text: |-
      1 Indien de alleenstaande of het gezin de voor de verlening van onderstand van belang zijnde gegevens of de
      gevorderde bewijsstukken niet, niet tijdig of onvolledig heeft verstrekt en de alleenstaande of het gezin dit te
      verwijten valt, dan wel indien de alleenstaande of het gezin anderszins onvoldoende medewerking verleent, kan Onze
      Minister het recht op onderstand beëindigen.

      2 Alvorens Onze Minister een besluit neemt tot beëindiging van het recht op onderstand, nodigt Onze Minister de
      alleenstaande of het gezin uit om binnen een door hem te stellen termijn het verzuim te herstellen.
    url: https://wetten.overheid.nl/BWBR0028595/2026-01-01#Artikel30
  - number: '31'
    text: |-
      1 Naast de verplichtingen die op grond van [hoofdstuk 2][ref1] in elk geval aan de onderstand verbonden zijn,
      dan wel daaraan door Onze Minister verbonden worden, kan Onze Minister vanaf de dag waarop de alleenstaande of
      het gezin onderstand heeft aangevraagd als bedoeld in [artikel 22][ref2], verplichtingen opleggen die strekken
      tot arbeidsinschakeling, dan wel die verband houden met aard en doel van een bepaalde vorm van onderstand of die
      strekken tot zijn vermindering of beëindiging.

      2 Een verplichting als bedoeld in het eerste lid kan, op advies van een arts, inhouden het zich onderwerpen aan een
      noodzakelijke behandeling van medische aard.


      [ref1]: https://wetten.overheid.nl/BWBR0028595#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0028595#Artikel22
    url: https://wetten.overheid.nl/BWBR0028595/2026-01-01#Artikel31
