      - id: ref1
        bwb_id: BWBR0028595
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0028595
        artikel: '22'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '32'
    text: |-
      Indien en zolang er gegronde redenen zijn om aan te nemen dat de alleenstaande of het gezin zonder hulp niet in
      staat is tot een verantwoorde besteding van zijn bestaansmiddelen, kan Onze Minister:

      a. aan de onderstand de verplichting verbinden dat de alleenstaande of het gezin eraan meewerkt dat Onze Minister
      in naam van de alleenstaande of het gezin noodzakelijke betalingen uit de toegekende onderstand verricht;

      b. de onderstand in natura verstrekken.
    url: https://wetten.overheid.nl/BWBR0028595/2026-01-01#Artikel32
  - number: '33'
    text: |-
      1 Onze Minister kan kosten van onderstand terugvorderen, voor zover de onderstand:

      a. ten onrechte of tot een te hoog bedrag is verleend;

      b. op grond van [artikel 29][ref1] bij wijze van voorschot is verleend en nadien is vastgesteld dat geen recht op
      onderstand bestaat;

      c. anderszins onverschuldigd is betaald voor zover de belanghebbende dit redelijkerwijs had kunnen begrijpen, of

      d. anderszins onverschuldigd is betaald, waaronder begrepen dat:

      1°. de belanghebbende naderhand met betrekking tot de periode waarover onderstand is verleend, over in aanmerking
      te nemen middelen als bedoeld in [paragraaf 3.3][ref2] beschikt of kan beschikken;

      2°. onderstand is verleend met een bepaalde bestemming en naderhand door de belanghebbende vergoedingen of
      tegemoetkomingen worden ontvangen met het oog op die bestemming.

      2 Het in aanmerking nemen van in de voorafgaande drie maanden ontvangen middelen, voor zover deze niet vallen onder
      de vrijlating, bedoeld in [artikel 19][ref3], wordt niet als terugvordering beschouwd.

      3 Bij gebreke van tijdige betaling kan de vordering worden verhoogd met de wettelijke rente en de op de
      terugvordering betrekking hebbende kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0028595#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0028595#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0028595#Artikel19
    url: https://wetten.overheid.nl/BWBR0028595/2026-01-01#Artikel33
    references:
      - id: ref1
