        artikel: 22a
  - number: 18a
    text: |-
      1 Onder vermogen wordt verstaan de waarde van de bezittingen waarover de alleenstaande of het gezin beschikt of
      redelijkerwijs kan beschikken, verminderd met de aanwezige schulden. De waarde van bezittingen wordt vastgesteld op
      de waarde in het economische verkeer bij vrije oplevering.

      2 Niet als vermogen wordt in aanmerking genomen:

      a. bezittingen in natura die naar hun aard en waarde algemeen gebruikelijk zijn of, gelet op de omstandigheden van
      persoon en gezin, noodzakelijk zijn;

      b. het bij de aanvang van de onderstand aanwezige vermogen voor zover dit minder bedraagt dan de van toepassing
      zijnde vermogensgrens, genoemd in het derde lid;

      c. de economische waarde van de woning die tevens hoofdverblijf is, tenzij Onze Minister van oordeel is dat de
      waarde van de woning in alle redelijkheid bij het vermogen kan worden betrokken;

      d. bij regeling van Onze Minister aan te wijzen uitkeringen en vergoedingen voor materiële en immateriële schade;

      e. giften en andere dan de in onderdeel d bedoelde vergoedingen voor materiële en immateriële schade voor zover
      deze, gelet op de aard en de hoogte ervan, vanuit het oogpunt van onderstandsverlening verantwoord zijn.

      3 De vermogensgrens, bedoeld in het tweede lid, onderdeel b, is:

      a. voor de alleenstaande die de pensioengerechtigde leeftijd niet heeft bereikt:

      1°. indien de belanghebbende woonachtig is in het openbaar lichaam Bonaire: USD 4.380 ;

      2°. indien de belanghebbende woonachtig is in het openbaar lichaam Sint Eustatius: USD 5.300 ;

      3°. indien de belanghebbende woonachtig is in het openbaar lichaam Saba: USD 5.230 .

      b. voor het gezin waarvan geen van de gezinsleden de pensioengerechtigde leeftijd heeft bereikt:

      1°. indien de belanghebbende woonachtig is in het openbaar lichaam Bonaire: USD 8.760 ;

      2°. indien de belanghebbende woonachtig is in het openbaar lichaam Sint Eustatius: USD 10.600 ;

      3°. indien de belanghebbende woonachtig is in het openbaar lichaam Saba: USD 10.460 .

      c. voor de alleenstaande die de pensioengerechtigde leeftijd heeft bereikt:

      1°. indien de belanghebbende woonachtig is in het openbaar lichaam Bonaire: USD 8.760 ;

      2°. indien de belanghebbende woonachtig is in het openbaar lichaam Sint Eustatius: USD 10.600 ;

      3°. indien de belanghebbende woonachtig is in het openbaar lichaam Saba: USD 10.460 .

      d. voor het gezin waarvan ten minste een van de gezinsleden de pensioengerechtigde leeftijd heeft bereikt:

      1°. indien de belanghebbende woonachtig is in het openbaar lichaam Bonaire: USD 17.520 ;

      2°. indien de belanghebbende woonachtig is in het openbaar lichaam Sint Eustatius: USD 21.200 ;

      3°. indien de belanghebbende woonachtig is in het openbaar lichaam Saba: USD 20.920 .
    url: https://wetten.overheid.nl/BWBR0028595/2026-01-01#Artikel18a
  - number: '19'
    text: |-
      1 Inkomsten uit arbeid of uit kinderalimentatie die de alleenstaande of het gezin heeft verworven over de periode
      waarin beroep wordt gedaan op onderstand, worden vrijgelaten voor zover de onderstand en de verworven inkomsten bij
      elkaar de hoogte van het minimumloon niet overschrijden.

      2 Inkomsten uit pensioen, anders dan van overheidswege, die zijn verworven door de alleenstaande of een van de
      leden van het gezin, die de pensioengerechtigde leeftijd heeft of hebben bereikt, worden vrijgelaten tot een bedrag
      van USD 25  per twee weken.
    url: https://wetten.overheid.nl/BWBR0028595/2026-01-01#Artikel19
  - number: '20'
    text: |-
      1 Onverminderd [paragraaf 2.2.][ref1] kan Onze Minister bijzondere onderstand toekennen aan de alleenstaande
      of het gezin voor zover de alleenstaande of het gezin niet de middelen kan verwerven om te voorzien in de uit
      bijzondere omstandigheden voortvloeiende noodzakelijke kosten van het bestaan en voldoet aan de plicht tot
      arbeidsinschakeling, behoudens in geval de omstandigheid, bedoeld in [artikel 17][ref2], aan de orde is.

      2 Bij de toepassing van het eerste lid, wordt ten aanzien van de personen woonachtig in het openbaar lichaam Saba,
      in plaats van «Onze Minister» gelezen «het bestuurscollege van het openbaar lichaam Saba».

      3 Het bestuurscollege van het openbaar lichaam Saba treedt, wat de overige taken, bevoegdheden en verplichtingen
      betreft met betrekking tot de uitvoering van de bijzondere onderstand, in de plaats van Onze Minister ten aanzien
      van de personen woonachtig in het openbaar lichaam Saba.

      4 De eilandsraad van het openbaar lichaam Saba stelt bij eilandsverordening regels over de uitvoering van de
      bepalingen van dit besluit met betrekking tot bijzondere onderstand. Deze regels bevatten in elk geval bepalingen
      omtrent:

      a. de aanvraag en criteria voor verlening van bijzondere onderstand;

      b. de onderscheiden kostensoorten van bijzondere onderstand;

      c. de maatregelen en terugvordering;

      d. de afwijking van de eilandsverordening ten gunste van de belanghebbende met het oog op onredelijke gevolgen.


      [ref1]: https://wetten.overheid.nl/BWBR0028595#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0028595#Artikel17
