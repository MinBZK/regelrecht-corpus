  - number: '34'
    text: |-
      1 Onverminderd [artikel 33][ref1] kunnen kosten van onderstand, indien de onderstand aan een gezin wordt verleend,
      van alle gezinsleden worden teruggevorderd.

      2 De in het eerste lid bedoelde personen zijn hoofdelijk aansprakelijk voor de terugbetaling van kosten van
      onderstand die worden teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0028595#Artikel33
    url: https://wetten.overheid.nl/BWBR0028595/2026-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0028595
        artikel: '33'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: '35'
    text: |-
      1 Een besluit tot terugvordering van kosten van onderstand vermeldt hetgeen wordt teruggevorderd, de termijn of
      termijnen waarbinnen moet worden betaald, alsmede de wijze waarop het besluit, bij gebreke van tijdige betaling,
      ten uitvoer wordt gelegd.

      2 De persoon van wie kosten van onderstand worden teruggevorderd, is verplicht desgevraagd aan Onze Minister de
      inlichtingen te verstrekken die voor terugvordering op grond van deze paragraaf van belang zijn.
    url: https://wetten.overheid.nl/BWBR0028595/2026-01-01#Artikel35
  - number: '36'
    text: |-
      1 Een ieder is verplicht desgevraagd en bevoegd uit eigen beweging aan Onze Minister kosteloos opgaven en
      inlichtingen te verstrekken omtrent feiten en omstandigheden die noodzakelijk zijn voor de uitvoering van dit
      besluit ten opzichte van een persoon te wiens behoeve onderstand is gevraagd of wordt verleend en die in zijn
      dienst dan wel voor hem arbeid verricht, heeft verricht of zou kunnen gaan verrichten. De verplichting strekt zich
      mede uit tot de inkomsten van een persoon van wie kosten van onderstand op grond van [paragraaf 6.4][ref1] worden
      of kunnen worden teruggevorderd.

      2 De opgaven en inlichtingen worden desgevraagd schriftelijk, of in een andere vorm die redelijkerwijs kan worden
      verlangd, binnen een door Onze Minister schriftelijk te stellen termijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0028595#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0028595/2026-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0028595
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: '37'
    text: |-
      Bij regeling van Onze Minister aangewezen instanties en personen zijn verplicht desgevraagd aan Onze Minister
      kosteloos opgaven en inlichtingen te verstrekken die noodzakelijk zijn voor de uitvoering van dit besluit.
    url: https://wetten.overheid.nl/BWBR0028595/2026-01-01#Artikel37
  - number: '38'
    text: |-
      1 Het is een ieder verboden hetgeen hem uit of in verband met enige werkzaamheid bij de uitvoering van dit besluit
      over de persoon of zaken van een ander blijkt of wordt meegedeeld, verder bekend te maken dan voor de uitvoering
      van dit besluit noodzakelijk is dan wel op grond van dit besluit is voorgeschreven of toegestaan.

      2 Het in het eerste lid vervatte verbod is niet van toepassing indien:

      a. enig wettelijk voorschrift tot bekendmaking verplicht;

      b. degene op wie de gegevens betrekking hebben schriftelijk heeft verklaard tegen de verstrekking van deze gegevens
      geen bezwaar te hebben;

      c. de gegevens niet herleidbaar zijn tot individuele natuurlijke personen.

      3 Ten behoeve van wetenschappelijk onderzoek of statistiek kunnen desgevraagd gegevens aan derden worden verstrekt
      voor zover de persoonlijke levenssfeer van de belanghebbende daardoor niet onevenredig wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0028595/2026-01-01#Artikel38
  - number: '39'
    text: |-
      Onze Minister is verplicht, indien hij bij de uitvoering van dit besluit het gegronde vermoeden krijgt van
      een misdrijf dat is gepleegd ten nadele van een Nederlands of buitenlands uitvoeringsorgaan van de sociale
      verzekeringswetten of van een Nederlands of buitenlands overheidsorgaan, voor zover dit is belast met het
      verrichten van uitkeringen, het doen van verstrekkingen dan wel het heffen van bijdragen, het betrokken orgaan
      hiervan in kennis te stellen.
    url: https://wetten.overheid.nl/BWBR0028595/2026-01-01#Artikel39
  - number: '40'
    text: |-
      Bij regeling van Onze Minister worden instanties en personen aangewezen aan wie Onze Minister bevoegd is om uit
      eigen beweging en verplicht desgevraagd uit de administratie ter zake van de uitvoering van dit besluit kosteloos
      gegevens te verstrekken en wordt bepaald voor welke doeleinden deze gegevens mogen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0028595/2026-01-01#Artikel40
  - number: 40a
    text: |-
      1 De bekendmaking van een beschikking geschiedt door toezending of uitreiking aan de belanghebbende.

      2 Indien de bekendmaking van de beschikking niet kan geschieden op de wijze als voorzien in het eerste lid
      geschiedt zij op een andere geschikte wijze.

      3 De beschikking vermeldt de dagtekening van de beslissing, de gronden waarop deze berust, alsmede waar beroep kan
      worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0028595/2026-01-01#Artikel40a
  - number: 40b
    text: |-
      1 De belanghebbende kan tegen een beschikking op grond van dit besluit beroep instellen bij het Gerecht, bedoeld in
      [artikel 1, eerste lid, onderdeel b, van de Wet administratieve rechtspraak BES][ref1].

      2 Bij een beroep tegen een beschikking op grond van [artikel 7, eerste lid, onderdeel f][ref2], is
      [artikel 23, eerste lid, laatste zin, van de Wet administratieve rechtspraak BES][ref3] niet van toepassing.

      3 Bij een bestuurlijke heroverweging van een beschikking op grond van [artikel 7, eerste lid, onderdeel f][ref4],
      is [artikel 24, eerste en tweede lid, van de Wet administratieve rechtspraak BES][ref5] van overeenkomstige
      toepassing.

      4 Met betrekking tot een beschikking op grond van [artikel 7, eerste lid, onderdeel f][ref6], kan het
      Gerecht, bedoeld in [artikel 1, eerste lid, onderdeel b, van de Wet administratieve rechtspraak BES][ref7],
      indien het bestuursorgaan niet voldoet aan de verplichting, bedoeld in
      [artikel 23 van de Wet administratieve rechtspraak BES][ref8], daaruit de gevolgtrekking maken die hem geraden
      voorkomt.


