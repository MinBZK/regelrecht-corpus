  - number: 41b
    text: |-
      Schulden die voor de inwerkingtreding van het Besluit van 2 september 2020 tot wijziging van het Besluit onderstand
      BES in verband met diverse verbeteringen ten aanzien van de AOV-toeslag, het uitsluiten van fraudevorderingen
      bij de vermogenstoets en diverse andere wijzigingen (Stb. 2020, 370) zijn ontstaan door een terugvordering,
      een geldboete die daarmee verband houdt, een bestuurlijke boete of geldboete op grond van de wetten, genoemd in
      [artikel 18a, vierde lid][ref1], worden als schuld in aanmerking genomen voor de belanghebbende aan wie op grond
      van [artikel 24][ref2] onderstand is toegekend vanaf de dag gelegen voor de dag van inwerkingtreding van dat
      besluit, zolang dat recht op bijstand bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0028595#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0028595#Artikel24
