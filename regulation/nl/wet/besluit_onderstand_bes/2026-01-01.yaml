  - number: 41a
    text: |-
      [Afdeling 3.3 van de Algemene wet bestuursrecht][ref1] is van toepassing met dien verstande dat in:

      a. [artikel 3:5, eerste lid][ref2], in plaats van «besluiten» wordt gelezen «beschikkingen» en in de
      [artikelen 3:6, tweede lid][ref3], [3:8][ref4] en [3:9][ref5] in plaats van «het besluit» wordt gelezen «de
      beschikking»;

      b. [artikel 3:7, tweede lid][ref6], in plaats van «[Artikel 10 van de Wet openbaarheid van bestuur][ref7]» wordt
      gelezen «[Artikel 11 van de Wet openbaarheid van bestuur BES][ref8]».


