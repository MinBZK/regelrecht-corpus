        artikel: '20'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '5'
    text: |-
      1 De belanghebbende van 18 jaar of ouder doch jonger dan de pensioengerechtigde leeftijd is vanaf de dag van
      aanvraag van onderstand verplicht:

      a. naar vermogen algemeen geaccepteerde arbeid te verkrijgen en deze te aanvaarden;

      b. zich aan te melden voor arbeidsbemiddeling bij het bestuurscollege van het openbaar lichaam;

      c. gebruik te maken van een door of vanwege het bestuurscollege aangeboden voorziening gericht op
      arbeidsinschakeling, alsmede mee te werken aan een onderzoek naar zijn mogelijkheden tot arbeidsinschakeling.

      2 Indien daarvoor dringende redenen aanwezig zijn, kan Onze Minister in individuele gevallen tijdelijk ontheffing
      verlenen van een verplichting als bedoeld in het eerste lid.

      3 Indien onderstand wordt verleend aan personen met een gezamenlijke huishouding gelden de verplichtingen, bedoeld
      in het eerste lid, voor ieder van hen.

      4 De verplichtingen, bedoeld in het eerste lid, zijn niet van toepassing op de belanghebbende die volledig en
      duurzaam arbeidsongeschikt is.

      5 De beoordeling van volledige en duurzame arbeidsongeschiktheid wordt gebaseerd op een medisch onderzoek en, voor
      zover dat naar het oordeel van Onze Minister nodig is, een arbeidskundig onderzoek.
    url: https://wetten.overheid.nl/BWBR0028595/2026-01-01#Artikel5
  - number: '6'
    text: |-
      1 De persoon die rechtmatig woonachtig is in een openbaar lichaam en die naar het oordeel van Onze Minister
      aldaar in zodanige omstandigheden verkeert dat hij niet de middelen kan verwerven om in de noodzakelijke kosten
      van het bestaan te voorzien en die voldoet aan de plicht tot arbeidsinschakeling, heeft recht op onderstand van
      overheidswege.

      2 Het recht op onderstand komt de personen met een gezamenlijke huishouding gezamenlijk toe, tenzij een van deze
      personen geen recht heeft op onderstand.
    url: https://wetten.overheid.nl/BWBR0028595/2026-01-01#Artikel6
  - number: '7'
    text: |-
      1 Geen recht op onderstand heeft de persoon:

      a. aan wie rechtens zijn vrijheid is ontnomen;

      b. die wegens werkstaking of uitsluiting niet deelneemt aan de arbeid, voor zover diens gebrek aan middelen daarvan
      het gevolg is;

      c. die op het moment van aanvraag korter dan vijf jaar onafgebroken rechtmatig woonachtig is in de openbare
      lichamen, tenzij naar het oordeel van Onze Minister van Justitie de te voorziene onderstandsbehoeftigheid geen
      aanleiding zal zijn het recht tot verblijf van de betrokken persoon te beëindigen;

      d. voor zover die per kalenderjaar langer dan vier weken verblijf houdt buiten de openbare lichamen dan wel een
      aaneengesloten periode van langer dan vier weken verblijf houdt buiten de openbare lichamen;

      e. die jonger is dan 18 jaar;

      f. die een uitreiziger is.

      2 Het eerste lid, onderdeel c, is niet van toepassing op de persoon die, nadat hij ten minste vijf jaar
      onafgebroken rechtmatig woonachtig is geweest in de openbare lichamen:

      a. de openbare lichamen metterwoon heeft verlaten en binnen vijf jaar na dit vertrek opnieuw rechtmatig woonachtig
      is in de openbare lichamen; of

      b. de openbare lichamen om redenen van studie metterwoon heeft verlaten en binnen vijf jaar na beëindiging van de
      studie opnieuw rechtmatig woonachtig is in de openbare lichamen.

      3 In afwijking van het eerste lid, onderdeel d, geldt voor personen die de pensioengerechtigde leeftijd hebben
      bereikt, een periode van dertien weken.
    url: https://wetten.overheid.nl/BWBR0028595/2026-01-01#Artikel7
  - number: '8'
    text: |-
      In ieder geval worden niet tot de noodzakelijke kosten van het bestaan gerekend:

      a. de voldoening van alimentatieverplichtingen;

      b. de betaling van een boete;

      c. geleden of toegebrachte schade;

      d. de aflossing van schulden.
    url: https://wetten.overheid.nl/BWBR0028595/2026-01-01#Artikel8
  - number: '9'
    text: |-
      Geen recht op onderstand bestaat voor zover een beroep kan worden gedaan op een voorliggende voorziening die,
      gezien haar aard en doel, wordt geacht voor de belanghebbende toereikend en passend te zijn. Het recht op
      onderstand strekt zich evenmin uit tot kosten die in de voorliggende voorziening als niet-noodzakelijk worden
      aangemerkt.
    url: https://wetten.overheid.nl/BWBR0028595/2026-01-01#Artikel9
  - number: '10'
    text: |-
      Aan een persoon die geen recht op onderstand heeft, kan Onze Minister, gelet op alle omstandigheden, in afwijking
      van deze paragraaf onderstand verlenen, indien zeer dringende redenen daartoe noodzaken.
    url: https://wetten.overheid.nl/BWBR0028595/2026-01-01#Artikel10
  - number: '11'
    text: |-
      1 De belanghebbende doet aan Onze Minister op verzoek of onverwijld uit eigen beweging mededeling van alle
      feiten en omstandigheden waarvan hem redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op zijn
      arbeidsinschakeling of het recht op onderstand.

      2 Onze Minister stelt bij de uitvoering van dit besluit de identiteit van de belanghebbende vast aan de hand van
      een document als bedoeld in [artikel 2 van de Wet identificatieplicht BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028575#Artikel2
    url: https://wetten.overheid.nl/BWBR0028595/2026-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028575
        artikel: '2'
  - number: 11a
    text: |-
      1 Bij ministeriële regeling kunnen controlevoorschriften worden vastgesteld. Deze voorschriften gaan niet verder
      dan strikt noodzakelijk is voor een juiste uitvoering van dit besluit.

      2 De belanghebbende volgt de voorschriften op en verleent anderszins aan Onze Minister desgevraagd de medewerking
      die redelijkerwijs nodig is voor de uitvoering van dit besluit.

      3 De belanghebbende onthoudt zich van zeer ernstige misdragingen jegens de met de uitvoering van deze wet belaste
      personen en instanties tijdens het verrichten van hun werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0028595/2026-01-01#Artikel11a
  - number: '12'
    text: |-
      1 Onze Minister stemt de onderstand en de daaraan verbonden verplichtingen af op de omstandigheden, mogelijkheden
      en middelen van de belanghebbende, alsmede op het betoonde besef van verantwoordelijkheid voor de voorziening in
      het bestaan.

      2 Indien de belanghebbende naar het oordeel van Onze Minister tekortschietend besef van verantwoordelijkheid
      betoont voor de voorziening in het bestaan dan wel de uit dit besluit voortvloeiende verplichtingen niet of niet
      voldoende nakomt, kan Onze Minister de onderstand verlagen. Van een verlaging wordt afgezien indien elke mate van
      verwijtbaarheid ontbreekt.

      3 Bij de toepassing van het eerste lid wordt onder belanghebbende persoon mede verstaan het gezin.

      4 Bij regeling van Onze Minister worden regels gesteld met betrekking tot het verlagen van de onderstand, bedoeld
      in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0028595/2026-01-01#Artikel12
