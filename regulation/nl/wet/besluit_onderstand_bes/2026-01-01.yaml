articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - *minimumloon:* bruto minimumuurloon, genoemd in [artikel 9 van de Wet minimumlonen BES][ref1], vermenigvuldigd
      met 80 uur;
        - *Onze Minister:* Onze Minister van Sociale Zaken en Werkgelegenheid;
        - *openbaar lichaam/openbare lichamen:* openbare lichamen Bonaire, Sint Eustatius of Saba;
        - *pensioengerechtigde leeftijd:* leeftijd waarop recht op ouderdomspensioen ontstaat op grond van de
      [Wet algemene ouderdomsverzekering BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028170#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0028459
