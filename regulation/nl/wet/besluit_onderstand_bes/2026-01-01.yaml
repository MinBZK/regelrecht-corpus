  - number: '21'
    text: |-
      1 Indien uit de door het Centraal Bureau voor de Statistiek vast te stellen consumentenprijsindexcijfers voor
      Bonaire, Sint Eustatius en Saba blijkt, dat de prijsindexcijfers voor het derde kwartaal van het lopende jaar,
      vergeleken met de prijsindexcijfers voor het derde kwartaal van het voorafgaande jaar zijn gestegen of gedaald, kan
      Onze Minister bedragen vaststellen, die met ingang van 1 januari van het komende jaar in de plaats treden van de
      in de [artikelen 13][ref1], [14][ref2], [15][ref3], [16][ref4], [17][ref5], [17a][ref6], [18a][ref7] en [19][ref8]
      genoemde bedragen. Onze Minister bepaalt welke consumentenprijsindexcijfers zoals vastgesteld door het Centraal
      Bureau voor de Statistiek voor de toepassing van de eerste zin worden gebruikt. De consumentenprijsindexcijfers
      kunnen voor de onderscheiden openbare lichamen verschillend zijn.

      2 De overeenkomstig het eerste lid herziene bedragen treden in de plaats van de bedragen, genoemd in de
      [artikelen 13][ref9], [14][ref10], [15][ref11], [16][ref12], [17][ref13], [17a][ref14], [18a][ref15] en
      [19][ref16].

      3 Indien er naar het oordeel van Onze Minister bijzondere omstandigheden zijn, kunnen de bedragen, genoemd in
      de [artikelen 13][ref17], [14][ref18], [15][ref19], [16][ref20], [17][ref21], [17a][ref22], [18a][ref23] en
      [19][ref24] bij ministeriële regeling met ingang van een bij die regeling aan te geven datum worden gewijzigd.
      De gewijzigde bedragen treden in de plaats van de bedragen, genoemd in de [artikelen 13][ref25], [14][ref26],
      [15][ref27], [16][ref28], [17][ref29], [17a][ref30], [18a][ref31] en [19][ref32].

      4 Indien een wijziging als bedoeld in het derde lid samenvalt met een herziening als bedoeld in het eerste lid,
      wordt het bedrag voorafgaande aan de wijziging herzien en geschiedt de herziening bij de in het derde lid bedoelde
      ministeriële regeling.


