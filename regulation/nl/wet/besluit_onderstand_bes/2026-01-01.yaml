      1 Tot de middelen worden alle vermogens- en inkomensbestanddelen gerekend waarover de alleenstaande of het gezin
      beschikt of redelijkerwijs kan beschikken.

      2 Niet tot de middelen worden gerekend:

      a. bijdragen van familie en derden voor zover deze naar het oordeel van Onze Minister uit een oogpunt van verlening
      van onderstand verantwoord zijn;

      b. de kinderbijslag BES, bedoeld in [artikel 9 van de Wet kinderbijslagvoorziening BES][ref1];

      c. de kerstuitkering, bedoeld in [artikel 22a van de Wet algemene ouderdomsverzekering BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037347#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0028459#Artikel22a
