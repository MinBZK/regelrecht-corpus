  - number: 41b_bis
    text: |-
      [Artikel 20][ref1], zoals dat luidde voor de datum van inwerkingtreding van artikel I, onderdeel A, van het Besluit
      van 26 januari 2021 tot wijziging van het Besluit onderstand BES en het Besluit uitvoering Wet arbeid vreemdelingen
      BES in verband met wijziging van taken ten aanzien van de bijzondere onderstand op Saba en ten aanzien van het
      uitzonderen van onderwijzers van de tewerkstellingsvergunningsplicht op Saba (Stb. 2021, 43), blijft van toepassing
      op voor die datum ingediende aanvragen voor bijzondere onderstand van personen woonachtig in het openbaar lichaam
      Saba.


