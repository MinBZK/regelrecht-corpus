  - number: V
    text: |-
      1 De tarieven, vastgesteld op grond van artikel 27 van de Elektriciteitswet 1989, gelden voor een vergunninghouder
      als bedoeld in [artikel 1 van de Elektriciteitswet 1998][ref1] tot en met 31 december 1999.

      2 Iedere vergunninghouder zendt voor 1 oktober 1999 aan Onze Minister, bedoeld
      in [artikel 1 van de Elektriciteitswet 1998][ref2], met inachtneming van
      [artikel 40, tweede en derde lid, van die wet][ref3] een voorstel met betrekking tot de tarieven die deze
      vergunninghouder in 2000 ten hoogste mag berekenen voor de levering van elektriciteit aan beschermde afnemers aan
      wie deze vergunninghouder op grond van [artikel 39, eerste lid, van die wet][ref4] verplicht is elektriciteit te
      leveren. In afwijking van [artikel 41 van de Elektriciteitswet 1998][ref5] baseert iedere vergunninghouder het
      voorstel op de vergelijkbare tarieven die bij afnemers in rekening werden gebracht in 1996.

      3 Bij de vaststelling van de tarieven, bedoeld in het tweede lid, houdt Onze Minister rekening met de
      [artikelen 40, tweede en derde lid, van de Elektriciteitswet 1998][ref6] en met belangrijke kostenstijgingen na 1
      januari 1996 die hun oorzaak vinden buiten de invloedssfeer van de desbetreffende vergunninghouder.


