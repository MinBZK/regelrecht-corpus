preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, gelet op een daartoe strekkend verzoek van de
    Tweede Kamer der Staten-Generaal, om nadere regels ten aanzien van het netbeheer en de levering van elektriciteit
    aan beschermde afnemers uit te werken in de Elektriciteitswet 1998, waarbij mede uitvoering wordt gegeven aan
    richtlijn nr. 96/92/EG van het Europees Parlement en de Raad van de Europese Unie van 19 december 1996 betreffende
    gemeenschappelijke regels voor de interne markt voor elektriciteit (PbEG 1997, L 27), en om de Elektriciteitswet
    1998 tevens op een aantal andere punten te wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0010501/1999-07-01#ArtikelAanhef
articles:
  - number: III
    text: |-
      1 Onze Minister kan besluiten dat afnemers, niet zijnde beschermde afnemers, tot en met 31 december 2000 verplicht
      zijn de uitvoering van de programma-verantwoordelijkheid over te dragen aan:

      a. een vergunninghouder, tenzij deze de programma-verantwoordelijkheid heeft overgedragen aan een natuurlijke
      persoon of rechtspersoon als bedoeld in de onderdelen b of c,

      b. een producent die vergunninghouder was als bedoeld in artikel 1 van de Elektriciteitswet 1989 of zijn
      rechtsopvolger, tenzij deze de programma-verantwoordelijkheid heeft overgedragen aan een natuurlijke persoon of
      rechtspersoon als bedoeld in de onderdelen a of c, of

      c. een afnemer, leverancier of handelaar die op een verzoek daartoe door de netbeheerder van het landelijk
      hoogspanningsnet is aanvaard als programma-verantwoordelijke.

      2 De netbeheerder van het landelijk hoogspanningsnet aanvaardt het verzoek, bedoeld in het eerste lid, onderdeel c,
      met inachtneming van het derde lid.

      3 De directeur van de dienst bepaalt op het tijdstip van inwerkingtreding van dit artikel het aantal programma-
      verantwoordelijken dat in de periode tot 31 december 2000 ten hoogste aanvaard kan worden, alsmede de wijze van
      verdeling van het aantal programma-verantwoordelijken, die niet mag leiden tot bevoordeling van een van de groepen,
      bedoeld in het eerste lid, of van leden van die groepen.

      4 Het aantal programma-verantwoordelijken en de wijze van verdeling van het aantal programma-verantwoordelijken
      worden bekend gemaakt in de Staatscourant.

      5 Het tweede tot en met het vierde lid vinden toepassing indien Onze Minister een besluit als bedoeld in het eerste
      lid heeft genomen.
    url: https://wetten.overheid.nl/BWBR0010501/1999-07-01#ArtikelIII
  - number: IV
    text: |-
      1 De tarieven, vastgesteld op grond van artikel 27 van de Elektriciteitswet 1989, gelden voor een netbeheerder als
      bedoeld in [artikel 1 van de Elektriciteitswet 1998][ref1] tot en met 31 december 1999.

      2 Iedere netbeheerder zendt voor 1 oktober 1999 aan de directeur van de dienst, bedoeld in
      [artikel 5, tweede lid, van de Elektriciteitswet 1998][ref2], met inachtneming van de [artikelen 25a tot en
      met 25c van die wet](onbekend) een voorstel met betrekking tot de tarieven die deze netbeheerder in 2000 ten
      hoogste mag berekenen voor de aansluiting op een net of voor het transport van elektriciteit alsmede, indien
      het de netbeheerder van het landelijk hoogspanningsnet betreft, voor het verrichten van de systeemdiensten en de
      handhaving van de energiebalans. In afwijking van [artikel 27 van de Elektriciteitswet 1998][ref3] baseert iedere
      netbeheerder het voorstel op de vergelijkbare tarieven die bij afnemers in rekening werden gebracht in 1996.

      3 Bij de vaststelling van de tarieven, bedoeld in het tweede lid, houdt de directeur van de dienst rekening met:

      a. de artikelen [25a tot en met 25c van de Elektriciteitswet 1998][ref4],

      b. investeringen als bedoeld in [artikel 27, tweede lid, van de Elektriciteitswet 1998][ref5] die zijn gedaan na 1
      januari 1996,

      c. belangrijke kostenstijgingen na 1 januari 1996 die hun oorzaak vinden buiten de invloedssfeer van de
      desbetreffende netbeheerder, en

      d. andere objectieve factoren die voor netbeheerders aantoonbaar leiden tot verschillen in tariefniveaus.


