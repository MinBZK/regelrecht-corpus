  - number: VI
    text: |-
      1 Onze Minister kan een ontheffing, verleend op grond van
      [artikel 15, tweede lid, van de Elektriciteitswet 1998][ref1], zoals dat gold op het tijdstip
      van plaatsing van deze wet in het Staatsblad, intrekken, indien de ontheffing op grond van
      [artikel 15, tweede lid, van de Elektriciteitswet 1998][ref2], zoals dat komt te luiden na inwerkingtreding van
      [Artikel I, onderdeel F][ref3], van deze wet, niet zou zijn verleend.

      2 De rechtspersoon wiens ontheffing met toepassing van het eerste lid is ingetrokken, doet binnen vier weken
      een aanvraag voor een ontheffing als bedoeld in [artikel 15, tweede lid, van de Elektriciteitswet 1998][ref4],
      zoals dat komt te luiden na inwerkingtreding van [Artikel I, onderdeel F][ref5], van deze wet, dan
      wel wijst binnen vier weken een andere rechtspersoon als netbeheerder aan met inachtneming van de
      [artikelen 10 tot en met 13 van de Elektriciteitswet 1998][ref6].

      3 Indien de rechtspersoon, bedoeld in het tweede lid, op grond van de
      [artikelen 65 van de Elektriciteitswet 1998][ref7] en 2 en 8 van het Besluit kostenverhaal Elektriciteitswet 1998,
      een vergoeding heeft betaald voor het verlenen van een ontheffing en deze ontheffing is ingetrokken op grond van
      het eerste lid, is deze rechtspersoon na indiening van de aanvraag voor een ontheffing of het aanwijzen van een
      netbeheerder op grond van het tweede lid, geen vergoeding verschuldigd voor het verlenen van de ontheffing of van
      instemming met de aanwijzing van een netbeheerder.

      4 Indien de behandeling van aanvragen om een ontheffing is aangehouden totdat deze wet in het Staatsblad is
      geplaatst, is op die behandeling [artikel 15 van de Elektriciteitswet 1998][ref8], zoals dat komt te luiden na
      inwerkingtreding van [artikel I, onderdeel F][ref9], van deze wet, van toepassing.


