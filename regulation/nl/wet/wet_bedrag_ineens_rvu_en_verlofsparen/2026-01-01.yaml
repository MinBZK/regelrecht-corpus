preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Pensioenwet, de Wet verplichte
    beroepspensioenregeling, de Wet op het financieel toezicht, de Wet inkomstenbelasting 2001 en de Wet op de
    loonbelasting 1964 aan te passen om in de tweede en derde pijler meer keuzevrijheid te bieden door het introduceren
    van de mogelijkheid om een deel van de aanspraken op ouderdomspensioen op de ingangsdatum hiervan te laten
    afkopen of om een deel van de aanspraken op periodieke uitkeringen voortvloeiend uit een lijfrenteverzekering,
    lijfrenterekening of lijfrentebeleggingsrecht op de ingangsdatum hiervan te laten afkopen, de pseudo-eindheffing
    bij regelingen voor vervroegde uittreding tijdelijk te versoepelen en de fiscale ruimte voor het sparen van
    bovenwettelijk verlof uit te breiden;

    Zo is het dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-Generaal,
    hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0044727/2026-01-01#ArtikelAanhef
articles:
  - number: VI
    text: |-
      1 Onze Ministers van Sociale Zaken en Werkgelegenheid en Financiën zenden binnen twee jaar na de inwerkingtreding
      van [artikel I][ref1] van deze wet, en vervolgens na drie jaar, aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten in de praktijk van de artikelen I, [II][ref2], [III][ref3], [IV][ref4] en
      [V, onderdeel C en F][ref5], van deze wet.

      2 Onze Ministers van Sociale Zaken en Werkgelegenheid en Financiën zenden binnen vijf jaar na de inwerkingtreding
      van [artikel I][ref6] van deze wet aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten in de
      praktijk van [artikel V, onderdeel A][ref7], van deze wet.


