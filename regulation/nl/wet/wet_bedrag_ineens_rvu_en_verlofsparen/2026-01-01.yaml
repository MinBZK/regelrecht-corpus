  - number: VII
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      artikelen of onderdelen daarvan verschillend kan worden vastgesteld. In dat besluit kan worden bepaald
      dat [artikel V, onderdelen A en D][ref1], van deze wet terugwerkt tot en met een in dat besluit
      te bepalen tijdstip. Bij toepassing van de tweede zin is het in artikel V, onderdeel D, opgenomen
      [artikel 32ba, achtste lid, van de Wet op de loonbelasting 1964][ref2] van overeenkomstige toepassing op de datum
      van inwerkingtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0044727#ArtikelV
