preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het met het oog op de inwerkingtreding van de nieuwe voorschriften nopens
    de ruimtelijke ordening en de volkshuisvesting wenselijk is om regelen te stellen omtrent de overgang van de oude
    op de nieuwe wetgeving alsmede om wijziging te brengen in enkele bestaande wetten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002452/1994-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Bepalingen in provinciale en gemeentelijke verordeningen betreffende onderwerpen, waarvoor bij de
      [Wet op de Ruimtelijke Ordening][ref1] of de [Woningwet][ref2] voorschriften zijn gegeven, blijven van kracht, voor
      zover zij niet met die voorschriften in strijd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002375
      [ref2]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0002452/1994-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002375
      - id: ref2
        bwb_id: BWBR0005181
  - number: '2'
    text: |-
      De Woningwet (wet van 22 juni 1901, *Stb.* 158) voortaan aan te halen als Woningwet 1901 wordt, behoudens het
      bepaalde in de volgende artikelen, ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002452/1994-01-01#Artikel2
  - number: '3'
    text: |-
      1 Voorschriften, als bedoeld in artikel 1 of artikel 2, eerste lid, der Woningwet 1901, alsmede overeenkomstig het
      bepaalde in [artikel 149 van de Gemeentewet][ref1] (*Stb.* 1992, 96) vastgestelde voorschriften, welke voorzien in
      onderwerpen, als omschreven in [hoofdstuk II der Woningwet][ref2], worden geacht voorschriften te zijn als bedoeld
      in afdeling 1 van genoemd hoofdstuk der Woningwet.

      2 Op voorschriften, als in de aanhef van het eerste lid bedoeld, welke bij de inwerkingtreding van deze wet zijn
      vastgesteld, doch nog niet zijn goedgekeurd of ten aanzien waarvan bij die inwerkingtreding de beslissing omtrent
      goedkeuring nog niet in beroep onaantastbaar is, blijft artikel 11 van de Woningwet 1901 van toepassing.

      3 De gemeenteraden brengen de in het eerste lid bedoelde voorschriften met de [Woningwet][ref3] in overeenstemming.
      Indien de raad hieraan binnen drie jaren na de inwerkingtreding van deze wet niet heeft voldaan passen Gedeputeerde
      Staten [artikel 21 der Woningwet][ref4] toe.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel149
      [ref2]: https://wetten.overheid.nl/BWBR0005181#HoofdstukII
      [ref3]: https://wetten.overheid.nl/BWBR0005181
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel21
    url: https://wetten.overheid.nl/BWBR0002452/1994-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '149'
      - id: ref2
        bwb_id: BWBR0005181
        hoofdstuk: II
      - id: ref3
