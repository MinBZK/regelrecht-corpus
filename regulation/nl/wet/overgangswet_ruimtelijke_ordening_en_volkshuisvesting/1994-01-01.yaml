  - number: '9'
    text: |-
      1 Besluiten tot onbewoonbaarverklaring genomen ingevolge paragraaf 4 der Woningwet 1901, alsmede daartoe
      strekkende adviezen van de inspecteur worden geacht onderscheidenlijk krachtens [artikel 33][ref1] en
      [artikel 34 der Woningwet][ref2] te zijn genomen of uitgebracht.

      2 Ten aanzien van onbewoonbaarverklaringen en adviezen, als in het eerste lid bedoeld, blijft voor zover de termijn
      om voorziening te vragen bij de inwerkingtreding van deze wet nog niet is verstreken, artikel 26 der Woningwet 1901
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel34
