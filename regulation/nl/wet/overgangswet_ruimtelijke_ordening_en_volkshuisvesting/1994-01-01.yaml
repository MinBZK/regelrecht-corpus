  - number: '11'
    text: |-
      1 Indien vóór de inwerkingtreding van deze wet volgens de voorschriften van de Woningwet 1901 een ontwerp voor een
      maatregel, als bedoeld in [artikel 10, eerste lid][ref1], van deze wet ter inzage is gelegd, kan die maatregel ook
      na die inwerkingtreding nog volgens de voorschriften van de Woningwet 1901 worden vastgesteld.

      2 Op maatregelen, vastgesteld ingevolge het eerste lid, en op maatregelen, als bedoeld in
      [artikel 10, eerste lid][ref2], van deze wet, welke bij de inwerkingtreding van deze wet zijn vastgesteld, doch nog
      niet zijn goedgekeurd, of ten aanzien waarvan bij die inwerkingtreding de beslissing omtrent goedkeuring nog niet
      in beroep onaantastbaar is, blijven de artikelen 11, onderscheidenlijk 35 en 37, 38, 40 en 43*a* der Woningwet 1901
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002452#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002452#Artikel10
    url: https://wetten.overheid.nl/BWBR0002452/1994-01-01#Artikel11
