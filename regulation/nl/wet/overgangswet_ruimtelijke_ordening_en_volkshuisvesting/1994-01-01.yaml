  - number: '14'
    text: |-
      1 De voorwaarde van terugbetaling, genoemd in de artikelen 52 en 57 van de Woningwet 1901 en verbonden aan op grond
      van de artikelen 52 en 56, derde lid, van die wet verleende bijdragen, vervalt.

      2 Voorschriften, gegeven ter uitvoering van de paragrafen 8 en 9 van de Woningwet 1901 - voorzover zij niet
      krachtens artikel 52, derde lid, van die wet zijn uitgevaardigd - alsmede de op die voorschriften berustende
      uitvoeringsbepalingen blijven van kracht en worden geacht ter uitvoering van de [Woningwet][ref1] te zijn gegeven.

      3

      4 De verplichting tot terugbetaling, verbonden aan bij of krachtens besluit van de gemeenteraad op andere wijze
      dan door middel van bijdragen, als bedoeld in het eerste lid, verleende geldelijke steun ter tegemoetkoming in
      ongedekte jaarlijkse tekorten, die voortspruiten uit de exploitatie van - vóór 1 januari 1946 tot stand gekomen
        - woningen door ingevolge [artikel 78 van de Onteigeningswet][ref2] toegelaten verenigingen, vennootschappen en
      stichtingen, vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0005181
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel78
    url: https://wetten.overheid.nl/BWBR0002452/1994-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005181
      - id: ref2
        bwb_id: BWBR0001842
        artikel: '78'
  - number: '15'
    text: |-
      1 Op verzoeken om een vergunning, als bedoeld in artikel 73 der Woningwet 1901, ingekomen vóór de inwerkingtreding
      van deze wet, beslissen burgemeester en wethouders volgens het ten tijde van de indiening van het verzoek geldende
      recht. Op deze beslissing blijft artikel 73, vierde lid, der Woningwet 1901 van toepassing.

      2 Vergunningen, als bedoeld in artikel 73 der Woningwet 1901 worden geacht vergunningen, als bedoeld
      in [artikel 47 der Woningwet][ref1] te zijn. In deze vergunningen wordt voor de toepassing van
      [artikel 49 der Woningwet][ref2] geacht een termijn van vijf jaren te zijn gesteld.

      3 Met betrekking tot beslissingen omtrent vergunning, ten aanzien waarvan bij de inwerkingtreding van deze wet
      de termijn om voorziening te vragen nog niet is verstreken, blijft artikel 73, vierde lid, der Woningwet 1901 van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel49
    url: https://wetten.overheid.nl/BWBR0002452/1994-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '47'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '49'
  - number: '16'
    text: |-
      1 Onze Minister van Volkshuisvesting en Bouwnijverheid kan toestaan, dat woningen, waarvan de bewoning ingevolge
      artikel 2 van de Woningnoodwet 1918 (*Stb.* 379, vervallen 6 maanden na de inwerkingtreding van het Koninklijk
      besluit van 12 september 1931, *Stb.* 396) na een bepaalde termijn moest ophouden, langer worden bewoond. De
      toestemming wordt telkens voor een bepaalde termijn verleend, die voor verlenging vatbaar is. Na de dag, waarop
      de bewoning ingevolge de beschikking van voornoemde Minister moet ophouden, moet het gemeentebestuur de woning
      onverwijld doen ontruimen en afbreken, tenzij voor zoveel het afbreken betreft, met goedkeuring van die Minister
      aan de woning een andere bestemming wordt gegeven.

      2 De bepalingen, die ingevolge de Woningnoodwet 1918 (*Stb.* 379) golden ten aanzien van woningen als bedoeld in
      het eerste lid, blijven van kracht, behoudens wijziging, aanvulling of intrekking door Ons.
    url: https://wetten.overheid.nl/BWBR0002452/1994-01-01#Artikel16
  - number: '29'
    text: |-
      De wet van 28 september 1950, *Stb.* K 415, houdende voorlopige regeling inzake het Nationale Plan en de
      streekplannen, hierna aangehaald als: voorlopige wet, wordt, behoudens hetgeen bij [artikel 32][ref1] wordt
      bepaald, ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002452#Artikel32
    url: https://wetten.overheid.nl/BWBR0002452/1994-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002452
        artikel: '32'
        hoofdstuk: IV
  - number: '30'
    text: |-
      1 Streekplannen, als bedoeld in de voorlopige wet, voor zover zij bij de inwerkingtreding van deze wet zijn
      goedgekeurd en die, omtrent welker goedkeuring bij die inwerkingtreding nog niet is beslist, worden geacht
      streekplannen, als bedoeld in [hoofdstuk III van de Wet op de Ruimtelijke Ordening][ref1] te zijn.

      2 Indien vóór de inwerkingtreding van deze wet volgens de voorschriften van de voorlopige wet een ontwerp voor
      een streekplan ter inzage is gelegd, kan dat plan ook na die inwerkingtreding nog volgens de voorschriften van de
      voorlopige wet worden vastgesteld.

      3 Op streekplannen, die ingevolge het tweede lid zijn vastgesteld, is het eerste lid van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0002452/1994-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002375
        hoofdstuk: III
  - number: '31'
    text: |-
      Besluiten, als bedoeld in [artikel 8, tweede lid][ref1], der voorlopige wet, blijven nog 5 jaren na de
      inwerkingtreding van deze wet van kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002452#Artikel8
    url: https://wetten.overheid.nl/BWBR0002452/1994-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002452
        artikel: '8'
        hoofdstuk: II
  - number: '34'
    text: |-
      Op ingevolge de Woningwet 1901 tot stand gekomen bouwverboden en bijzondere voorschriften ter bepaling van een
      voorgevelrooilijn blijft [artikel 40][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel40b
    url: https://wetten.overheid.nl/BWBR0002452/1994-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 40b
  - number: '35'
    text: |-
      Op onteigeningen, ten aanzien waarvan de ter inzage legging, als bedoeld in
      [artikel 80 van de Onteigeningswet][ref1], heeft plaats gehad vóór de inwerkingtreding van deze wet, blijven de
      bepalingen van [Titel IV van de Onteigeningswet][ref2], zoals die vóór evenbedoeld tijdstip golden, van kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0001842
    url: https://wetten.overheid.nl/BWBR0002452/1994-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '80'
      - id: ref2
        bwb_id: BWBR0001842
  - number: '36'
    text: |-
      Verenigingen, vennootschappen en stichtingen, toegelaten ingevolge [artikel 78 van de Onteigeningswet][ref1],
      worden geacht toegelaten te zijn ingevolge [artikel 59, eerste lid, van de Woningwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel59
    url: https://wetten.overheid.nl/BWBR0002452/1994-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '78'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '59'
  - number: '48'
    text: |-
      1 Deze wet kan worden aangehaald als Overgangswet ruimtelijke ordening en volkshuisvesting.

      2 Zij treedt in werking op een door Ons te bepalen tijdstip. Wij kunnen een ander tijdstip vaststellen, waarop het
      eerste en [het derde en vierde lid van artikel 14][ref1], alsmede de uitzondering, gemaakt op het tweede lid van
      dat artikel, in werking treden.


      [ref1]: https://wetten.overheid.nl/BWBR0002452#Artikel14
