      - id: ref4
        bwb_id: BWBR0005181
        artikel: '21'
  - number: '4'
    text: |-
      Voorschriften, gegeven ter uitvoering van artikel 1*bis* van de Woningwet 1901, blijven van kracht en worden geacht
      ter uitvoering van [artikel 3, vijfde lid, van de Woningwet][ref1] te zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel3
    url: https://wetten.overheid.nl/BWBR0002452/1994-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '3'
  - number: '5'
    text: |-
      1 Op verzoeken om een vergunning, als bedoeld in artikel 6, eerste lid, der Woningwet 1901, ingekomen vóór de
      inwerkingtreding van deze wet, beslissen burgemeester en wethouders volgens het ten tijde van de indiening van het
      verzoek geldende recht. Op deze beslissing blijft artikel 7 der Woningwet 1901 van toepassing.

      2 Vergunningen, als bedoeld in artikel 6, eerste lid, onder *a*, van de Woningwet 1901 worden geacht vergunningen,
      als bedoeld in [artikel 47 van de Woningwet][ref1] te zijn.

      3 Vergunningen, als bedoeld in artikel 6, eerste lid, onder *b*, van de Woningwet 1901 worden geacht vergunningen,
      als bedoeld in [artikel 55 van de Woningwet][ref2] te zijn.

      4 Op een besluit, als bedoeld in artikel 6, zesde lid, der Woningwet 1901, ten aanzien waarvan bij de
      inwerkingtreding van deze wet de beroepstermijn nog niet is verstreken, blijft artikel 7 der Woningwet 1901 van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel55
    url: https://wetten.overheid.nl/BWBR0002452/1994-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '47'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '55'
  - number: '6'
    text: |-
      In de gevallen, dat vergunning is verleend ingevolge artikel 8 van de Woningwet 1901 is
      [artikel 49, zevende lid, van de Woningwet][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel49
    url: https://wetten.overheid.nl/BWBR0002452/1994-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '49'
  - number: '7'
    text: |-
      Door Gedeputeerde Staten ingevolge artikel 13, tweede lid, der Woningwet 1901 vastgestelde regelingen worden geacht
      krachtens [artikel 87, vierde lid, der Woningwet][ref1] te zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel87
    url: https://wetten.overheid.nl/BWBR0002452/1994-01-01#Artikel7
