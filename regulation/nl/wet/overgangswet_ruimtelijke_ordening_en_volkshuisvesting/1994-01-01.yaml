  - number: '10'
    text: |-
      1 Bijzondere voorschriften ter bepaling van voor- of achtergevelrooilijnen, als bedoeld in
      [artikel 2, tweede lid][ref1], bouwverboden, als bedoeld in [artikel 35][ref2], plannen van uitbreiding, als
      bedoeld in paragraaf 7, met daarbij behorende bebouwingsvoorschriften en voorschriften, als bedoeld in artikel 43
      der Woningwet 1901, worden geacht bestemmingsplannen in de zin van de [Wet op de Ruimtelijke Ordening][ref3] te
      zijn. Zij behouden het rechtsgevolg, dat zij bij de inwerkingtreding van deze wet hadden.

      2 Op de in het vorige lid aangegeven, ingevolge de Woningwet 1901 tot stand gekomen, planologische maatregelen
      is [artikel 49 van de Wet op de Ruimtelijke Ordening][ref4] gedurende 5 jaren na het in werking treden van deze
      wet niet van toepassing. Gemeentelijke schadevergoedingsverordeningen, van toepassing op in dit lid bedoelde
      planologische maatregelen, blijven ten hoogste tot dit tijdstip van kracht.

      3 De gemeenteraden brengen de in het eerste lid bedoelde maatregelen binnen vijf jaren na de inwerkingtreding van
      deze wet met de [Wet op de Ruimtelijke Ordening][ref5] in overeenstemming.


      [ref1]: https://wetten.overheid.nl/BWBR0002452#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002452#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0002375
