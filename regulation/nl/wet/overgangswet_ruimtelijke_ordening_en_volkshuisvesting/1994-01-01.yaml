  - number: '12'
    text: |-
      Een verplichting ingevolge de [artikelen 36, vijfde lid][ref1], en [44, eerste lid][ref2],
      [artikel 38, tweede lid][ref3] of de artikelen 40 en 44, vierde lid, van de Woningwet 1901 wordt geacht een
      verplichting ingevolge [artikel 37, tweede lid][ref4], onderscheidenlijk [artikel 30][ref5], onderscheidenlijk
      [artikel 40 van de Wet op de Ruimtelijke Ordening][ref6] te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002452#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0002452#Artikel44
