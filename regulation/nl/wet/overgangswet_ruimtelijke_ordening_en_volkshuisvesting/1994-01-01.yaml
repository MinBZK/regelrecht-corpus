  - number: '8'
    text: |-
      1 Aanschrijvingen, als bedoeld in paragraaf 3 der Woningwet 1901, alsmede daartoe strekkende adviezen van de
      inspecteur worden geacht onderscheidenlijk krachtens [artikel 25][ref1] en [artikel 29 der Woningwet][ref2] te
      zijn uitgebracht.

      2 Ten aanzien van adviezen en aanschrijvingen, als in het eerste lid bedoeld, blijven [artikel 20][ref3] en, voor
      zover de termijn om voorziening te vragen bij de inwerkingtreding van deze wet nog niet is verstreken, artikel 24
      van de Woningwet 1901 van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel29
