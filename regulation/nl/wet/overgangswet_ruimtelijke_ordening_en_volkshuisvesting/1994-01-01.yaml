    text: |-
      Een besluit, genomen ingevolge artikel 36, vierde lid, van de Woningwet 1901 wordt geacht ingevolge
      [artikel 21, eerste lid, van de Wet op de Ruimtelijke Ordening][ref1] genomen te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel21
    url: https://wetten.overheid.nl/BWBR0002452/1994-01-01#Artikel13
