  - number: '2.25'
    text: |-
      1 Een vergunning van Onze Minister van Verkeer en Waterstaat dan wel het bestuur van een waterschap
      met betrekking tot een handeling als bedoeld in [artikel 6.2 van de Waterwet][ref1], die onmiddellijk
      voor het tijdstip van inwerkingtreding van dat artikel van de Waterwet van kracht is krachtens
      [artikel 1, eerste, tweede of derde lid, van de Wet verontreiniging oppervlaktewateren][ref2], wordt gelijkgesteld
      met een door Onze Minister van Verkeer en Waterstaat onderscheidenlijk het bestuur van het waterschap
      verleende watervergunning als bedoeld in de [Waterwet][ref3] voor de desbetreffende handeling, tenzij ingevolge
      [artikel 6.7 van die wet][ref4] een vrijstelling van toepassing is.

      2 Een vergunning met betrekking tot lozen met behulp van een werk dat op een ander werk is aangesloten, die
      onmiddellijk voor het tijdstip van inwerkingtreding van [artikel 6.2 van de Waterwet][ref5] van kracht is krachtens
      [artikel 1, tweede lid, van de Wet verontreiniging oppervlaktewateren][ref6], wordt, indien op dat lozen artikel
      6.2 van de Waterwet niet van toepassing is, gelijkgesteld met:

      a. indien het lozen plaatsvindt vanuit een inrichting als bedoeld in
      [artikel 1.1, derde lid, van de Wet milieubeheer][ref7]: een vergunning krachtens [artikel 8.1 van die wet][ref8],
      verleend door het voor die inrichting bevoegde gezag ingevolge [artikel 8.2 van die wet][ref9];

      b. indien het lozen plaatsvindt anders dan vanuit een inrichting als bedoeld in
      [artikel 1.1, derde lid, van de Wet milieubeheer][ref10]: een ontheffing krachtens
      [artikel 10.63, eerste lid, van die wet][ref11], verleend door burgemeester en wethouders.

      3 Het dagelijks bestuur van het waterschap draagt de archiefbescheiden die betrekking hebben op vergunningen als
      bedoeld in het tweede lid over aan:

      a. in gevallen als bedoeld in onderdeel a van dat lid: het bevoegde gezag, bedoeld in dat onderdeel;

      b. in gevallen als bedoeld in onderdeel b van dat lid: burgemeester en wethouders.

      4 Het derde lid geldt niet voor bescheiden die overeenkomstig de [Archiefwet 1995][ref12] zijn overgebracht naar
      een archiefbewaarplaats.


