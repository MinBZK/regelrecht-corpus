      1 De [artikelen 7.14 tot en met 7.17 van de Waterwet][ref1] zijn niet van toepassing indien de schade is
      veroorzaakt door een uitoefening van een taak of bevoegdheid die plaatsvond voor het tijdstip van inwerkingtreding
      van die artikelen.

      2 De [artikelen 12b][ref2] of [78 van de Waterstaatswet 1900][ref3],
      [9 van de Wet verontreiniging oppervlaktewateren][ref4], [40][ref5] en [41 van de Wet op de waterhuishouding][ref6]
      dan wel [41][ref7] en [42 van de Grondwaterwet][ref8], zoals die luidden onmiddellijk voor het tijdstip van
      inwerkingtreding van [hoofdstuk 6 van de Waterwet][ref9], blijven van toepassing met betrekking tot een schade als
      bedoeld in het eerste lid, voor zover onderscheidenlijk onder die bepalingen vallend.


