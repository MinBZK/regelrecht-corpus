  - number: '2.38'
    text: |-
      Het bestuursorgaan dat vóór het tijdstip van inwerkingtreding van [hoofdstuk 8 van de Waterwet][ref1] een
      beschikking tot toepassing van bestuursdwang, oplegging van een last onder dwangsom of intrekking van een
      vergunning of ontheffing heeft gegeven ter zake van een overtreding van een voorschrift dat door deze wet wordt
      ingetrokken, maar ingevolge [§ 2.2.6][ref2] van kracht blijft na die intrekking, blijft bevoegd met betrekking tot
      die beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0026710#Hoofdstuk2
