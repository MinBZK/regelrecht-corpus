  - number: '2.16'
    text: |-
      1 [Artikel 5.4 van de Waterwet][ref1] is niet van toepassing op de aanleg of wijziging van een waterstaatswerk
      waarvoor op het tijdstip van inwerkingtreding van dat artikel:

      a. door de beheerder een beslissing is genomen als bedoeld in [artikel 148 van de Waterschapswet][ref2] die – voor
      zover vereist – is goedgekeurd door gedeputeerde staten, of

      b. een koninklijk besluit als bedoeld in [artikel 12, eerste of tweede lid, van de Waterstaatswet 1900][ref3] is
      vastgesteld.

      2 Indien onmiddellijk voor het tijdstip van inwerkingtreding van [artikel 5.4 van de Waterwet][ref4]

      a. nog goedkeuring door gedeputeerde staten benodigd is voor een beslissing als bedoeld in
      [artikel 148 van de Waterschapswet][ref5], dan wel

      b. met betrekking tot een beoogd koninklijk besluit als bedoeld in
      [artikel 12, eerste of tweede lid, van de Waterstaatswet 1900][ref6] een kennisgeving als bedoeld in het derde lid
      van dat artikel is gedaan,

      blijft de [Waterschapswet][ref7] van toepassing op die goedkeuring, onderscheidenlijk de
      [Waterstaatswet 1900][ref8] op verdere voorbereiding, vaststelling en mededeling van dat besluit.

      3 Het eerste lid, aanhef en onderdeel a of b, is van overeenkomstige toepassing op een overeenkomstig het tweede
      lid goedgekeurde beslissing onderscheidenlijk tot stand gebracht koninklijk besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel5.4
