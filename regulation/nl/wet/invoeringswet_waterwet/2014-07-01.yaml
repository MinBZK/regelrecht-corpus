  - number: '2.17'
    text: |-
      1 Het recht zoals dat gold onmiddellijk vóór het tijdstip van inwerkingtreding van [artikel 1.13][ref1],
      met uitzondering van de [artikelen 76m tot en met 76o van de Wet bodembescherming][ref2],
      blijft van toepassing ten aanzien van saneringen van gevallen van verontreiniging in de bodem
      of oever van een oppervlaktewaterlichaam waarvoor vóór dat tijdstip een beschikking als bedoeld
      in [artikel 29, eerste lid, van de Wet bodembescherming][ref3] is gegeven waarbij ingevolge
      [artikel 37, eerste lid, van de Wet bodembescherming][ref4] is vastgesteld dat spoedige sanering
      noodzakelijk is. De eerste volzin is van toepassing tot het moment dat het bevoegde gezag overeenkomstig
      [artikel 39c, tweede lid, van de Wet bodembescherming][ref5] heeft ingestemd met het verslag van de sanering.

      2 Bevelen als bedoeld in [artikel 30, tweede tot en met vierde lid][ref6], in samenhang met
      [artikel 35, eerste lid, van de Wet bodembescherming][ref7], gegeven vóór het tijdstip van inwerkingtreding van
      [artikel 1.13][ref8], worden vanaf dat tijdstip aangemerkt als bevelen als bedoeld in artikel 30, tweede tot en met
      vierde lid, van de Wet bodembescherming in samenhang met [artikel 5.15, tweede lid, van de Waterwet][ref9].

      3 Bevelen als bedoeld in [artikel 43, eerste, derde of vierde lid][ref10], in samenhang met
      [artikel 63a, eerste lid, van de Wet bodembescherming][ref11] tot het verrichten van nader onderzoek
      of het treffen van tijdelijke beveiligingsmaatregelen, gegeven vóór het tijdstip van inwerkingtreding
      van [artikel 1.13][ref12], worden vanaf dat tijdstip aangemerkt als bevelen als bedoeld in
      [artikel 5.16, eerste, tweede of derde lid, van de Waterwet][ref13] tot het verrichten van onderzoek of het treffen
      van tijdelijke beveiligingsmaatregelen.

      4 Bevelen als bedoeld in [artikel 43, eerste, derde of vierde lid, van de Wet bodembescherming][ref14] tot
      het verrichten van nader onderzoek of het treffen van tijdelijke beveiligingsmaatregelen, dat betrekking heeft
      op de bodem of oever van een oppervlaktewaterlichaam, gegeven door gedeputeerde staten vóór het tijdstip van
      inwerkingtreding van [artikel 1.13][ref15], worden vanaf dat tijdstip aangemerkt als bevelen als bedoeld in
      [artikel 5.16, eerste, tweede of derde lid, van de Waterwet][ref16] tot het verrichten van onderzoek of het treffen
      van tijdelijke beveiligingsmaatregelen, gegeven door de beheerder, bedoeld in [artikel 1.1 van die wet][ref17].

      5 [Artikel 74 van de Wet bodembescherming][ref18] blijft van toepassing ten aanzien van bevelen als bedoeld in
      [artikel 30, derde of vierde lid][ref19], of [artikel 49][ref20] juncto artikel 30, derde of vierde lid, van die
      wet, met betrekking tot de bodem of oever van een oppervlaktewaterlichaam, gegeven door gedeputeerde staten vóór
      het tijdstip van inwerkingtreding van [artikel 1.13][ref21].

      6 [Artikel 75 van de Wet bodembescherming][ref22] blijft van toepassing ten aanzien van het verhalen van de
      kosten van onderzoeksgevallen en van saneringsonderzoek en sanering van gevallen van ernstige verontreiniging
      van de bodem of oever van een oppervlaktewaterlichaam, voor zover die kosten zijn gemaakt dan wel tot het doen
      van onderzoek of het uitvoeren van een sanering opdracht is verstrekt vóór het tijdstip van inwerkingtreding van
      [artikel 1.13][ref23].


