      1 De leggers, bedoeld in [artikel 5.1 van de Waterwet][ref1], worden, voor zover die geen betrekking hebben op
      waterkeringen, uiterlijk drie jaar na het tijdstip van inwerkingtreding van dat artikel vastgesteld.

      2 Bij of krachtens provinciale verordening of algemene maatregel van bestuur kan worden bepaald dat
      [artikel 5.1, eerste lid, van de Waterwet][ref2] gedurende een daarbij vast te stellen termijn niet van
      toepassing is op daarbij aan te wijzen waterkeringen of onderdelen daarvan die in beheer zijn bij een waterschap
      onderscheidenlijk het Rijk.

      3 Een legger, overzichtskaart of beheersregister met betrekking tot een primaire waterkering, vastgesteld
      overeenkomstig [artikel 13 van de Wet op de waterkering][ref3], wordt gelijkgesteld met een legger, overzichtskaart
      of beheersregister als bedoeld in [artikel 5.1 van de Waterwet][ref4].


