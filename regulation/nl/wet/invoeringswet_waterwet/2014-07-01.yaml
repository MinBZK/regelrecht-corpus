  - number: 2.25a
    text: |-
      1 Tot het tijdstip van inwerkingtreding van [artikel 2.26 van de Wet algemene bepalingen omgevingsrecht][ref1],
      stelt het bevoegd gezag voor een vergunning als bedoeld in
      [artikel 8.1, eerste lid, van de Wet milieubeheer][ref2], waarbij vanuit een inrichting waartoe een gpbv-
      installatie behoort of vanuit een inrichting die behoort tot een aangewezen categorie van inrichtingen als bedoeld
      in artikel 8.1, tweede lid, van de Wet milieubeheer, afvalwater of andere afvalstoffen in een voorziening voor de
      inzameling en het transport van afvalwater worden gebracht, naar aanleiding van de aanvraag om die vergunning het
      dagelijks bestuur van het in [artikel 3.4, eerste lid, van de Waterwet][ref3] bedoelde waterschap of de beheerder
      van het oppervlaktewaterlichaam waarop het afvalwater vanuit die voorziening wordt gebracht, in de gelegenheid
      advies uit te brengen.

      2 Indien ten gevolge van de activiteit waarvoor vergunning wordt gevraagd:

      a. de doelmatige werking van het zuiveringtechnisch werk zou worden belemmerd, of

      b. de krachtens [hoofdstuk 5 van de Wet milieubeheer][ref4] gestelde grenswaarden voor de kwaliteit van het
      oppervlaktewater zouden worden overschreden,

      kan het advies inhouden dat de daarin opgenomen voorschriften die nodig zijn om die gevolgen te voorkomen, aan de
      vergunning moeten worden verbonden. Indien die gevolgen niet kunnen worden voorkomen, kan het advies inhouden dat
      de vergunning geheel of gedeeltelijk moet worden geweigerd.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.26
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8.1
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel3.4
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0026710/2014-07-01#Artikel2.25a
