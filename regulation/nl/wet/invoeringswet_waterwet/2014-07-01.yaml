  - number: '2.26'
    text: |-
      Een ontheffing met betrekking tot een handeling als bedoeld in [artikel 6.3 van de Waterwet][ref1], die
      onmiddellijk voor het tijdstip van inwerkingtreding van dat artikel van de Waterwet van kracht is overeenkomstig
      [artikel 3 van de Wet verontreiniging zeewater][ref2], wordt gelijkgesteld met een door Onze Minister van Verkeer
      en Waterstaat verleende watervergunning als bedoeld in de Waterwet voor de desbetreffende handeling, tenzij
      ingevolge [artikel 6.7 van die wet][ref3] een vrijstelling van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.3
      [ref2]: https://wetten.overheid.nl/BWBR0002975#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel6.7
