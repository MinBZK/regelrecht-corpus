      Het horen van gedeputeerde staten van de betrokken provincies en de beheerders alsmede de bevoegde autoriteiten
      van de andere staten in het stroomgebieddistrict, bedoeld in [artikel 1.2, derde lid, van de Waterwet][ref1],
      blijft achterwege voor zover de in de maatregel vast te stellen grenzen gelijk zijn aan de grenzen
      die onmiddellijk voor het tijdstip van inwerkingtreding van dat artikel van kracht zijn ingevolge
      [artikel 2a van de Wet op de waterhuishouding][ref2].


