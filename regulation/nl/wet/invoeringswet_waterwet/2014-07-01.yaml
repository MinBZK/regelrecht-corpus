    text: |-
      Met betrekking tot subsidies die krachtens [artikel 12 van de Wet op de waterkering][ref1] zijn verleend blijft het
      bepaalde bij en krachtens genoemd artikel, zoals dat luidde onmiddellijk voor het tijdstip van inwerkingtreding van
      artikel 7.23 van de Waterwet, van toepassing.


