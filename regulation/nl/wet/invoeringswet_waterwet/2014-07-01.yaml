      1 De aanwijzingen van beheerders ingevolge [artikel 3.2 van de Waterwet][ref1] kunnen, voor zover die betrekking
      hebben op de vaarweg- of havenfunctie van onderdelen van watersystemen, uiterlijk zes jaar na het tijdstip van
      inwerkingtreding van dat artikel worden vastgesteld.

      2 Tot het tijdstip van van kracht worden van een aanwijzing als bedoeld in het eerste lid blijft de zorg voor de
      vaarweg- of havenfunctie berusten bij het overheidslichaam dat onmiddellijk voor het tijdstip van inwerkingtreding
      van [artikel 3.2 van de Waterwet][ref2] die zorg behartigde met betrekking tot de desbetreffende vaarweg of haven.


