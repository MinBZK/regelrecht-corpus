      1 Een plan als bedoeld in [artikel 7, eerste lid, van de Wet op de waterkering][ref1], dat is vastgesteld vóór het
      tijdstip van inwerkingtreding van [artikel 5.4 van de Waterwet][ref2], wordt gelijkgesteld met een projectplan als
      bedoeld in laatstgenoemd artikel.

      2 [Artikel 5.4 van de Waterwet][ref3] is niet van toepassing op de aanleg, versterking of verlegging
      van een primaire waterkering ten aanzien waarvan voor het tijdstip van inwerkingtreding van dat
      artikel toepassing is gegeven aan [afdeling 3.5][ref4] dan wel [artikel 3.33, eerste lid][ref5], of
      [artikel 3.35, eerste lid, van de Wet ruimtelijke ordening][ref6].

      3 Het eerste lid en [artikel 5.4 van de Waterwet][ref7] zijn
