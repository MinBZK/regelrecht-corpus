  - number: '2.29'
    text: |-
      1 Het recht zoals dat gold onmiddellijk vóór het tijdstip van inwerkingtreding van
      [paragraaf 6.2 van de Waterwet][ref1] blijft van toepassing ten aanzien van de voorbereiding en vaststelling van
      een besluit op een voor die inwerkingtreding gedane aanvraag om een vergunning, ontheffing of concessie als bedoeld
      in:

      a. [artikel 14 van de Grondwaterwet][ref2],

      b. [artikel 2 van de Wet beheer rijkswaterstaatswerken][ref3],

      c. __REF000___________________________________________________________________________________________________________
      ___________________,

      d. [artikel 1, eerste, tweede of derde lid, van de Wet verontreiniging oppervlaktewateren][ref5],

      e. [artikel 3 van de Wet verontreiniging zeewater][ref6],

      f. [artikel 24 van de Wet op de waterhuishouding][ref7], of

      g. een verordening van een waterschap als bedoeld in [artikel 6.13 van de Waterwet][ref8], alsmede op de beslissing
      op een bezwaar of beroep, ingediend onderscheidenlijk ingesteld tegen een zodanig besluit.

      2 Een vergunning, ontheffing of concessie die overeenkomstig het eerste lid wordt verleend wordt, zodra deze
      onherroepelijk is geworden, gelijkgesteld met een door het betrokken bestuursorgaan verleende watervergunning voor
      de desbetreffende handeling, voor zover na de inwerkingtreding van [paragraaf 6.2 van de Waterwet][ref9] nog steeds
      een vergunning of ontheffing voor die handeling wordt vereist.


