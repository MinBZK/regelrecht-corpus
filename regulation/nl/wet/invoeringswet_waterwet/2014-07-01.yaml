    text: |-
      De [artikelen 7.18][ref1] en [7.20 van de Waterwet][ref2] zijn niet van toepassing met betrekking tot schade als
      bedoeld in artikel 7.18 van die wet die is veroorzaakt voor het tijdstip van inwerkingtreding van dat artikel. Met
      betrekking tot een zodanige schade blijven de [artikelen 35][ref3] en [36 van de Grondwaterwet][ref4], zoals die
      luidden onmiddellijk voor dat tijdstip, van toepassing.


