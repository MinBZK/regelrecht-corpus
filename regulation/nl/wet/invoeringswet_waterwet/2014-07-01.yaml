  - number: '2.39'
    text: |-
      1 [Hoofdstuk XIX van de Waterschapswet][ref1] blijft van toepassing met betrekking tot besluiten en beslissingen
      die ingevolge dat hoofdstuk zijn onderworpen aan de goedkeuring van gedeputeerde staten, indien die zijn
      vastgesteld voor het tijdstip van inwerkingtreding van [artikel 1.8, onderdeel E][ref2].

      2 [Hoofdstuk XX van de Waterschapswet][ref3] blijft van toepassing met betrekking tot besluiten waartegen
      belanghebbenden ingevolge dat hoofdstuk administratief beroep kunnen instellen bij gedeputeerde staten, indien die
      zijn vastgesteld voor het tijdstip van inwerkingtreding van [artikel 1.8, onderdeel F][ref4].


