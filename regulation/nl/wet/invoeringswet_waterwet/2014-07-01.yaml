  - number: 2.25b
    text: |-
      Tot het tijdstip van inwerkingtreding van [artikel 5.20 van de Wet algemene bepalingen omgevingsrecht][ref1],
      kan in gevallen waarin vanuit een inrichting die behoort tot een categorie van inrichtingen als bedoeld in
      [artikel 1.1, derde lid, van de Wet milieubeheer][ref2], van waaruit afvalwater of andere afvalstoffen in een
      voorziening voor de inzameling en het transport van afvalwater worden gebracht tengevolge waarvan:

      a. de doelmatige werking van het zuiveringtechnisch werk wordt belemmerd, of

      b. de krachtens [hoofdstuk 5 van de Wet milieubeheer][ref3] gestelde grenswaarden voor de kwaliteit van het
      oppervlaktewater worden overschreden,

      het dagelijks bestuur van het in [artikel 3.4, eerste lid, van de Waterwet][ref4] bedoelde waterschap of de
      beheerder van het oppervlaktewaterlichaam waarop het afvalwater vanuit die voorziening wordt gebracht, voor zover
      dat nodig is om die gevolgen te beperken of weg te nemen, het voor die inrichting bevoegde bestuursorgaan een
      verzoek doen om een beschikking te geven tot oplegging van bestuursdwang, oplegging van een last onder dwangsom of
      intrekking van een vergunning of ontheffing. Het bevoegde bestuursorgaan geeft daaraan gevolg, voor zover dat niet
      in strijd is met het belang van de bescherming van het milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel5.20
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel1.1
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk5
      [ref4]: https://wetten.overheid.nl/BWBR0025458#Artikel3.4
