  - number: '2.28'
    text: |-
      Een vergunning of ontheffing voor een handeling in een watersysteem of een beschermingszone die onmiddellijk
      voor het tijdstip van inwerkingtreding van [hoofdstuk 6 van de Waterwet][ref1] van kracht is overeenkomstig een
      verordening van een waterschap wordt gelijkgesteld met een door dat waterschap verleende watervergunning, voor
      zover na dat tijdstip ingevolge een zodanige verordening nog steeds een vergunning of ontheffing voor die handeling
      wordt vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0026710/2014-07-01#Artikel2.28
