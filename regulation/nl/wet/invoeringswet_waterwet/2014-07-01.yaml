  - number: '2.12'
    text: |-
      1 Een nota waterhuishouding, provinciaal plan voor de waterhuishouding of beheerplan voor de
      rijkswateren dan wel voor andere wateren dan rijkswateren, die of dat is vastgesteld overeenkomstig de
      [Wet op de waterhuishouding][ref1] en betrekking heeft op de planperiode die aanvangt op 22 december 2009, wordt
      gelijkgesteld met het nationaal waterplan, onderscheidenlijk het regionaal waterplan van de betrokken provincie of
      het beheerplan van de betrokken beheerder, een en ander als bedoeld in [hoofdstuk 4 van de Waterwet][ref2].

      2 Indien onmiddellijk voor het tijdstip van inwerkingtreding van de [Waterwet][ref3] met toepassing van
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref4] een nota of plan als bedoeld in het eerste lid in
      voorbereiding is, blijft de [Wet op de waterhuishouding][ref5] van toepassing op de verdere voorbereiding,
      vaststelling en goedkeuring daarvan. Het eerste lid is van overeenkomstige toepassing op de aldus tot stand
      gebrachte nota en het aldus tot stand gebrachte plan.


      [ref1]: https://wetten.overheid.nl/BWBR0004575
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0025458
