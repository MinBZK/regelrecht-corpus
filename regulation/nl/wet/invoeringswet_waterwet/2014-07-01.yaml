  - number: '2.27'
    text: |-
      Een vergunning met betrekking tot een handeling als bedoeld in [artikel 6.5, onderdeel a, van de Waterwet][ref1],
      die onmiddellijk voor het tijdstip van inwerkingtreding van [hoofdstuk 6 van de Waterwet][ref2] van kracht is
      overeenkomstig [artikel 24 van de Wet op de waterhuishouding][ref3], wordt gelijkgesteld met een watervergunning
      als bedoeld in de [Waterwet][ref4] voor de desbetreffende handeling, voor zover deze krachtens artikel 6.5,
      onderdeel a, van die wet dan wel een verordening van een waterschap wordt vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.5
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Hoofdstuk6
