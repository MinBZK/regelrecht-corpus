  - number: '2.30'
    text: |-
      1 [Artikel 6.8 van de Waterwet][ref1] is mede van toepassing op een ieder die vóór het
      tijdstip van inwerkingtreding van dat artikel handelingen heeft verricht als bedoeld in de
      [artikelen 6 tot en met 11 van de Wet bodembescherming][ref2], zoals die luidden onmiddellijk vóór het tijdstip
      van inwerkingtreding van eerstgenoemd artikel 6.8, en die wist of redelijkerwijs had kunnen vermoeden dat door die
      handelingen de bodem of oever van een oppervlaktewaterlichaam kon worden verontreinigd of aangetast.

      2 Een aanwijzing als bedoeld in [artikel 27, tweede lid, van de Wet bodembescherming][ref3], gegeven door Onze
      Minister van Verkeer en Waterstaat of gedeputeerde staten vóór het tijdstip, bedoeld in het eerste lid, die
      betrekking heeft op een verontreiniging of aantasting van de bodem of oever van een oppervlaktewaterlichaam
      ten gevolge van handelingen als bedoeld in het eerste lid, wordt gelijkgesteld met een aanwijzing als
      bedoeld in [artikel 6.9, tweede lid, van de Waterwet][ref4], gegeven door de beheerder, bedoeld in
      [artikel 1.1 van die wet][ref5].

      3 Een beschikking tot het toepassen van bestuursdwang of een last onder dwangsom, gegeven door Onze Minister
      van Verkeer en Waterstaat of gedeputeerde staten vóór het tijdstip, bedoeld in het tweede lid, ter zake van een
      overtreding van het in [artikel 13 van de Wet bodembescherming][ref6] bepaalde met betrekking tot de bodem of oever
      van een oppervlaktewaterlichaam, wordt gelijkgesteld met een beschikking tot het toepassen van bestuursdwang of een
      last onder dwangsom, gegeven door de beheerder, bedoeld in [artikel 1.1 van de Waterwet][ref7].


