      Artikel 7.21 van de Waterwet is niet van toepassing indien schade als bedoeld in dat artikel is veroorzaakt
      voor het tijdstip van inwerkingtreding van dat artikel. Met betrekking tot een zodanige schade blijft voor
      waterstaatswerken in beheer bij het rijk [artikel 9 van de Wet beheer rijkswaterstaatswerken][ref1] dan wel, voor
      andere waterstaatswerken, [artikel 12c van de Waterstaatswet 1900][ref2], zoals die artikelen luidden onmiddellijk
      voor dat tijdstip, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008331#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0001867#Artikel12c
    url: https://wetten.overheid.nl/BWBR0026710/2014-07-01#Artikel2.36
