    text: |-
      Deze regeling is van toepassing op subsidies die worden verstrekt volgens de regels van het
      [Kaderbesluit EZ-subsidies][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024796
    url: https://wetten.overheid.nl/BWBR0026689/2010-01-01#Artikel2
    references:
