articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *algemene groepsvrijstellingsverordening:* [verordening (EG) nr. 800/2008](32008R0800) van de Commissie
      van de Europese Gemeenschappen van 6 augustus 2008 waarbij bepaalde categorieën steun op grond van de
      artikelen 87 en 88 van het Verdrag met de gemeenschappelijke markt verenigbaar worden verklaard (‘de algemene
      groepsvrijstellingsverordening’) (PbEU L 214);
        - *algemene opleiding:* een algemene opleiding als bedoeld in artikel 38, onderdeel 2, van de algemene
      groepsvrijstellingsverordening;
        - *besluit:* [Kaderbesluit EZ-subsidies][ref1];
        - *communautaire norm:* communautaire norm als bedoeld in punt 70.3 van de Communautaire richtsnoeren inzake
      staatssteun voor milieubescherming nr. 2008/C 82/01 (PbEU C 82);
        - *eco-innovatie:* eco-innovatie als bedoeld in punt 70.4 van de Communautaire richtsnoeren inzake staatssteun voor
      milieubescherming nr. 2008/C 82/01 (PbEU C 82);
        - *experimentele ontwikkeling:* experimentele ontwikkeling als bedoeld in paragraaf 2.2, onder g, van de
      Communautaire kaderregeling inzake staatssteun voor onderzoek, ontwikkeling en innovatie nr. 2006/C 323/01 (PbEU
      C 323);
        - *fundamenteel onderzoek:* fundamenteel onderzoek als bedoeld in paragraaf 2.2, onder e, van de Communautaire
      kaderregeling inzake staatssteun voor onderzoek, ontwikkeling en innovatie nr. 2006/C 323/01 (PbEU C 323);
        - *hernieuwbare energiebronnen:* hernieuwbare energiebronnen als bedoeld in punt 70.5 van de Communautaire
      richtsnoeren inzake staatssteun voor milieubescherming nr. 2008/C 82/01 (PbEU C 82);
        - *hooggekwalificeerd personeel:* hooggekwalificeerd personeel als bedoeld in paragraaf 2.2, onderdeel k, van de
      Communautaire kaderregeling inzake staatssteun voor onderzoek, ontwikkeling en innovatie nr. 2006/C 323/01 (PbEU
      C 323);
        - *industrieel onderzoek:* industrieel onderzoek als bedoeld in paragraaf 2.2, onderdeel f, van de Communautaire
      kaderregeling inzake staatssteun voor onderzoek, ontwikkeling en innovatie nr. 2006/C 323/01 (PbEU C 323);
        - *innovatieadviesdienst:* een innovatieadviesdienst in de zin van paragraaf 5.6, eerste gedachtestreepje van de
      Communautaire kaderregeling inzake staatssteun voor onderzoek, ontwikkeling en innovatie nr. 2006/C 323/01 (PbEU
      C 323);
        - *innovatiecluster:* een innovatiecluster als bedoeld in paragraaf 2.2, onderdeel m, van de Communautaire
      kaderregeling inzake staatssteun voor onderzoek, ontwikkeling en innovatie nr. 2006/C 323/01 (PbEU C 323);
        - *innovatieve starter:* een innovatieve starter als bedoeld in paragraaf 5.4 van de Communautaire kaderregeling
      inzake staatssteun voor onderzoek, ontwikkeling en innovatie nr. 2006/C 323/01 (PbEU C 323);
        - *milieubescherming:* milieubescherming als bedoeld in punt 70.1 van de Communautaire richtsnoeren inzake
      staatssteun voor milieubescherming nr. 2008/C 82/01 (PbEU C 82);
        - *referentiekosten:* kosten voor een investering ten behoeve van een in Nederland gangbaar systeem, apparaat of
      techniek die in technisch opzicht vergelijkbaar is met een in Nederland uit te voeren project maar waarmee niet
      hetzelfde niveau van milieubescherming kan worden bereikt als met het uit te voeren project, terwijl, in geval van
      een uit te voeren project voor hernieuwbare energie, de capaciteit voor de opwekking van energie van dat project
      ten minste overeenkomt met die van de eerstbedoelde investering;
        - *specifieke opleiding:* een specifieke opleiding als bedoeld in artikel 38, onderdeel 1, van de algemene
      groepsvrijstellingsverordening;
        - *stadsverwarming:* stadsverwarming als bedoeld in punt 70.12 van de Communautaire richtsnoeren inzake staatssteun
      voor milieubescherming nr. 2008/C 82/01 (PbEU C 82);
        - *technische haalbaarheidsstudie:* technische haalbaarheidsstudie in de zin van paragraaf 5.2 van de Communautaire
      kaderregeling inzake staatssteun voor onderzoek, ontwikkeling en innovatie nr. 2006/C 323/01 (PbEU C 323);
        - *warmtekrachtkoppeling:* warmtekrachtkoppeling als bedoeld in punt 70.10 van de Communautaire richtsnoeren inzake
      staatssteun voor milieubescherming nr. 2008/C 82/01 (PbEU C 82).


