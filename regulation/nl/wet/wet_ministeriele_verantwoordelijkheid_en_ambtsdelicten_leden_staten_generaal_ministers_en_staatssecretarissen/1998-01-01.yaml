---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_ministeriele_verantwoordelijkheid_en_ambtsdelicten_leden_staten_generaal_ministers_en_staatssecretarissen
regulatory_layer: WET
publication_date: '2018-07-27'
valid_from: '1998-01-01'
bwb_id: BWBR0001844
url: https://wetten.overheid.nl/BWBR0001844/1998-01-01
preamble:
  text: |-
    Wij WILLEM III, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, Groot-Hertog van Luxemburg,
    enz., enz., enz.,

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat, ter voldoening aan art. 73, in verband met art. 53 der Grondwet, de
    strafregtelijke verantwoordelijkheid van de Hoofden der Ministeriële Departementen moet worden geregeld door de wet
    en die regeling behoort plaats te hebben met inachtneming van art. 159 der Grondwet;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001844/1998-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      De Hoofden der Ministeriële Departementen zorgen voor de uitvoering der [Grondwet][ref1] en der andere wetten, voor
      zooverre die van de Kroon afhangt.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0001844/1998-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '1.2'
    text: |-
      Zij zijn wegens het niet naleven van deze verpligting verantwoordelijk en in regten vervolgbaar overeenkomstig de
      volgende bepalingen.
    url: https://wetten.overheid.nl/BWBR0001844/1998-01-01#Artikel1
  - number: '2'
    text: |-
      De mede-onderteekening van Koninklijke besluiten of Koninklijke beschikkingen wijst het Hoofd van het Ministerieel
      Departement aan, dat voor die besluiten of beschikkingen aansprakelijk is.
    url: https://wetten.overheid.nl/BWBR0001844/1998-01-01#Artikel2
  - number: '4'
    text: |-
      De Hoofden der Ministeriële Departementen staan ter vervolging, hetzij van Onzentwege, hetzij van wege de Tweede
      Kamer, te regt voor den Hoogen Raad.
    url: https://wetten.overheid.nl/BWBR0001844/1998-01-01#Artikel4
  - number: '5.1'
    text: |-
      Het besluit, waarbij van Onzentwege de vervolging van een der Hoofden van Ministeriële Departementen bevolen
      wordt, bevat eene naauwkeurige aanduiding der feiten, waarop de beschuldiging van een of meerdere der bij deze
      wet strafbaar gestelde misdrijven rust, benevens den last op den procureur-generaal bij den Hoogen Raad om de
      vervolging in te stellen.
    url: https://wetten.overheid.nl/BWBR0001844/1998-01-01#Artikel5
  - number: '5.2'
    text: Afschrift van dit besluit wordt aan de beide Kamers der Staten-Generaal medegedeeld.
    url: https://wetten.overheid.nl/BWBR0001844/1998-01-01#Artikel5
  - number: '6'
    text: |-
      De Tweede Kamer der Staten-Generaal, zoodanige mededeeling ontvangen hebbende, neemt harerzijds geene aanklagt
      tegen denzelfden persoon wegens dezelfde feiten in overweging.
    url: https://wetten.overheid.nl/BWBR0001844/1998-01-01#Artikel6
  - number: '7'
    text: |-
      Geene aanklagt tegen een der Hoofden van de Ministeriële Departementen wordt bij de Kamer in overweging genomen,
      tenzij door vijf leden schriftelijk en met opgave der feiten ingediend.
    url: https://wetten.overheid.nl/BWBR0001844/1998-01-01#Artikel7
  - number: '8.1'
    text: De Kamer overweegt in de afdeelingen of de aanklagt een onderwerp van nader onderzoek zal uitmaken.
    url: https://wetten.overheid.nl/BWBR0001844/1998-01-01#Artikel8
  - number: '8.2'
    text: De Voorzitter geeft van het indienen der aanklagt binnen 24 uren kennis aan den betrokken Minister.
    url: https://wetten.overheid.nl/BWBR0001844/1998-01-01#Artikel8
  - number: '8.3'
    text: |-
      Het in overweging nemen der aanklagt kan niet vroeger dan acht dagen na deze kennisgeving aan de orde gesteld
      worden.
    url: https://wetten.overheid.nl/BWBR0001844/1998-01-01#Artikel8
  - number: '9'
    text: |-
      Wanneer tot het in overweging nemen der aanklagt besloten is, wordt zij gesteld in handen eener commissie van
      onderzoek, daartoe door de volle Vergadering te benoemen.
    url: https://wetten.overheid.nl/BWBR0001844/1998-01-01#Artikel9
  - number: '10'
    text: |-
      Zij, die de aanklagt hebben ingediend, zijn van deze commissie uitgesloten, doch kunnen door haar, tot het geven
      van nadere inlichtingen, worden gehoord.
    url: https://wetten.overheid.nl/BWBR0001844/1998-01-01#Artikel10
  - number: '11.1'
    text: |-
      De commissie van onderzoek is belast met het opsporen en verzamelen van alle bescheiden, inlichtingen en bewijzen,
      die tot opheldering van de feiten, in de aanklagt vermeld, kunnen leiden.
    url: https://wetten.overheid.nl/BWBR0001844/1998-01-01#Artikel11
  - number: '11.2'
    text: De bepalingen der wet tot regeling van het regt van onderzoek (enquête) zijn daarbij van toepassing.
    url: https://wetten.overheid.nl/BWBR0001844/1998-01-01#Artikel11
  - number: '11.3'
    text: |-
      De bloedverwanten en aanverwanten van de betrokken minister, in de rechte linie en tot in de derde graad, alsmede
      zijn echtgenoot of zijn geregistreerde partner, zelfs na echtscheiding onderscheidenlijk beëindiging van het
      geregistreerd partnerschap anders dan door de dood of vermissing, kunnen niet genoodzaakt worden verklaringen af
      te leggen.
    url: https://wetten.overheid.nl/BWBR0001844/1998-01-01#Artikel11
  - number: '12.1'
    text: |-
      In iederen stand van het onderzoek is de commissie verpligt den betrokken Minister, wanneer hij dit wenscht, te
      hooren.
    url: https://wetten.overheid.nl/BWBR0001844/1998-01-01#Artikel12
  - number: '12.2'
    text: Hij kan niet genoodzaakt worden voor haar te verschijnen.
    url: https://wetten.overheid.nl/BWBR0001844/1998-01-01#Artikel12
  - number: '13.1'
    text: |-
      Zoodra de commissie van onderzoek de aanklagt genoegzaam toegelicht acht, brengt zij over de daarbij aangevoerde
      feiten verslag uit.
    url: https://wetten.overheid.nl/BWBR0001844/1998-01-01#Artikel13
  - number: '13.2'
    text: |-
      Dit verslag wordt aan de Afdeelingen verzonden, en over de aanklagt verder geraadpleegd als over een voorstel van
      wet.
    url: https://wetten.overheid.nl/BWBR0001844/1998-01-01#Artikel13
  - number: '14.1'
    text: |-
      Bij de beraadslaging over de aanklagt wordt de betrokken Minister, op zijn verlangen, gehoord, en aan hem in ieder
      geval het laatst het woord gegeven.
    url: https://wetten.overheid.nl/BWBR0001844/1998-01-01#Artikel14
  - number: '14.2'
    text: Hij behoudt dit regt, niettegenstaande hij vóór of gedurende het onderzoek mogt zijn afgetreden.
    url: https://wetten.overheid.nl/BWBR0001844/1998-01-01#Artikel14
  - number: '15.1'
    text: |-
      Wanneer eene aanklagt tegen een der Hoofden van de Ministeriële Departementen door de Tweede Kamer niet in
      overweging is genomen, kan, bij het opkomen van nieuwe bezwaren, de aanklagt hervat, in ieder geval, van Onzentwege
      de vervolging van den betrokken Minister ter zake derzelfde feiten bevolen worden.
    url: https://wetten.overheid.nl/BWBR0001844/1998-01-01#Artikel15
  - number: '15.2'
    text: |-
      Wanneer echter de aanklagt, na gedaan onderzoek en gehouden beraadslagingen, door de Tweede Kamer verworpen is, kan
      tegen den betrokken Minister wegens dezelfde feiten, noch van Onzentwege, noch van wege de Kamer, op nieuw eenig
      onderzoek ingesteld of eene strafvervolging gelast worden.
    url: https://wetten.overheid.nl/BWBR0001844/1998-01-01#Artikel15
  - number: '16.1'
    text: |-
      Iedere aanklagt tegen een der Hoofden van de Ministeriële Departementen wordt geacht verworpen te zijn, wanneer
      binnen drie maanden, na hare indiening, door de Tweede Kamer geen eindbesluit is genomen.
    url: https://wetten.overheid.nl/BWBR0001844/1998-01-01#Artikel16
  - number: '16.2'
    text: |-
      Wanneer de aanklagt aanleiding geeft tot een onderzoek in de overzeesche bezittingen, kan deze termijn door de
      Tweede Kamer tot één jaar verlengd worden.
    url: https://wetten.overheid.nl/BWBR0001844/1998-01-01#Artikel16
  - number: '16.3'
    text: |-
      Bij sluiting der zitting van de Staten-Generaal gedurende den loop van het onderzoek, begint, met den dag der
      opening van de volgende zitting, een nieuwe termijn van drie maanden te loopen.
    url: https://wetten.overheid.nl/BWBR0001844/1998-01-01#Artikel16
  - number: '16.4'
    text: |-
      Bij ontbinding der Tweede Kamer vervalt eene, bij haar aanhangige, aanklagt van regtswege, onverminderd de
      bevoegdheid tot het doen eener nieuwe aanklagt overeenkomstig [art. 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001844#Artikel7
    url: https://wetten.overheid.nl/BWBR0001844/1998-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001844
        artikel: '7'
  - number: '17'
    text: |-
      De stilzwijgende verwerping eener aanklagte, ten gevolge van het verloopen van den termijn, kan niet ingeroepen
      worden tegen den van Onzentwege gegeven last, om denzelfden persoon wegens dezelfde feiten te vervolgen.
    url: https://wetten.overheid.nl/BWBR0001844/1998-01-01#Artikel17
  - number: '18.1'
    text: De Tweede Kamer toetst de aangeklaagde feiten aan het regt, de billijkheid, de zedelijkheid en het staatsbelang.
    url: https://wetten.overheid.nl/BWBR0001844/1998-01-01#Artikel18
  - number: '18.2'
    text: |-
      Genoegzame gronden tot vervolging vindende, wijst zij, bij haar besluit, de feiten, waarop de beschuldiging rust,
      naauwkeurig aan, en belast den procureur-generaal bij den Hoogen Raad met de vervolging, onder toezending, binnen
      drie dagen, van het besluit met de aanklagt en de verzamelde bescheiden.
    url: https://wetten.overheid.nl/BWBR0001844/1998-01-01#Artikel18
  - number: '18.3'
    text: Afschrift van dat besluit wordt aan Ons en aan de Eerste Kamer der Staten-Generaal medegedeeld.
    url: https://wetten.overheid.nl/BWBR0001844/1998-01-01#Artikel18
  - number: '19'
    text: |-
      Na de ontvangst der mededeeling, bij het vorig artikel voorgeschreven, wordt van Onzentwege tegen den aangeklaagden
      Minister wegens dezelfde feiten geene vervolging gelast.
    url: https://wetten.overheid.nl/BWBR0001844/1998-01-01#Artikel19
  - number: '36'
    text: |-
      De regtsvordering tot vergoeding van schade, door een bij deze wet strafbaar gesteld feit geleden, kan alléén op
      eene veroordeeling door den Hoogen Raad rusten, en wordt voor den gewonen burgerlijken regter ingesteld.
    url: https://wetten.overheid.nl/BWBR0001844/1998-01-01#Artikel36
