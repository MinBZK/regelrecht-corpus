$id: wet_ministeriele_verantwoordelijkheid_en_ambtsdelicten_leden_staten_generaal_ministers_en_staatssecretarissen
regulatory_layer: WET
publication_date: '2018-07-27'
valid_from: '2018-09-19'
bwb_id: BWBR0001844
url: https://wetten.overheid.nl/BWBR0001844/2018-09-19
preamble:
  text: |-
    Wij WILLEM III, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, Groot-Hertog van Luxemburg,
    enz., enz., enz.,

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat, ter voldoening aan art. 73, in verband met art. 53 der Grondwet, de
    strafregtelijke verantwoordelijkheid van de Hoofden der Ministeriële Departementen moet worden geregeld door de wet
    en die regeling behoort plaats te hebben met inachtneming van art. 159 der Grondwet;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001844/2018-09-19#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Onze Ministers dragen zorg voor de uitvoering van de Grondwet en de andere wetten, voor zover die van de regering
      afhangt.
    url: https://wetten.overheid.nl/BWBR0001844/2018-09-19#Artikel1
  - number: '1.2'
    text: |-
      Zij zijn wegens het niet naleven van deze verplichting verantwoordelijk en in rechte vervolgbaar overeenkomstig de
      bepalingen in [hoofdstuk 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001844#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0001844/2018-09-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001844
        hoofdstuk: '2'
  - number: '2'
    text: |-
      De medeondertekening van wetten en koninklijke besluiten door een of meer ministers of staatssecretarissen wijst de
      voor die wetten en koninklijke besluiten verantwoordelijke ministers of staatssecretarissen aan.
    url: https://wetten.overheid.nl/BWBR0001844/2018-09-19#Artikel2
  - number: '3.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder: - *ambtsdelicten:* ambtsmisdrijven of ambtsovertredingen, begaan door een
      lid van de Staten-Generaal, een minister of een staatssecretaris in die betrekking;
        - *vervolging:* vervolging wegens een ambtsdelict.
    url: https://wetten.overheid.nl/BWBR0001844/2018-09-19#Artikel3
  - number: '3.2'
    text: |-
      Onder ambtsdelicten worden mede verstaan strafbare feiten begaan onder een der verzwarende omstandigheden,
      omschreven in [artikel 44 van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel44
    url: https://wetten.overheid.nl/BWBR0001844/2018-09-19#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '44'
  - number: '4.1'
    text: |-
      De leden van de Staten-Generaal, Onze ministers en de staatssecretarissen staan, ook na hun aftreden, wegens
      ambtsdelicten terecht voor de Hoge Raad.
    url: https://wetten.overheid.nl/BWBR0001844/2018-09-19#Artikel4
  - number: '4.2'
    text: De opdracht tot vervolging wordt gegeven bij koninklijk besluit of bij een besluit van de Tweede Kamer.
    url: https://wetten.overheid.nl/BWBR0001844/2018-09-19#Artikel4
  - number: '4.3'
    text: |-
      De procureur-generaal bij de Hoge Raad is verplicht aan de ontvangen opdracht tot vervolging onmiddellijk gevolg
      te geven.
    url: https://wetten.overheid.nl/BWBR0001844/2018-09-19#Artikel4
  - number: '5.1'
    text: |-
      Het koninklijk besluit waarbij de opdracht wordt gegeven tot vervolging bevat een nauwkeurige aanduiding van het
      ten laste gelegde feit en de opdracht aan de procureur-generaal bij de Hoge Raad om de vervolging in te stellen.
    url: https://wetten.overheid.nl/BWBR0001844/2018-09-19#Artikel5
  - number: '5.2'
    text: Afschrift van dit besluit wordt aan de beide Kamers der Staten-Generaal toegezonden.
    url: https://wetten.overheid.nl/BWBR0001844/2018-09-19#Artikel5
  - number: '6'
    text: |-
      Indien bij koninklijk besluit opdracht is gegeven tot vervolging, neemt de Tweede Kamer geen aanklacht tegen
      dezelfde persoon wegens dezelfde feiten in overweging.
    url: https://wetten.overheid.nl/BWBR0001844/2018-09-19#Artikel6
  - number: '7'
    text: |-
      Indien ten minste vijf leden van de Tweede Kamer een schriftelijke en met redenen omklede aanklacht indienen wegens
      een vermoedelijk ambtsdelict, beslist de Tweede Kamer of zij die aanklacht in overweging neemt.
    url: https://wetten.overheid.nl/BWBR0001844/2018-09-19#Artikel7
  - number: '8'
    text: |-
      Alvorens de Tweede Kamer beslist of zij de aanklacht in overweging neemt, stelt de voorzitter van de Tweede
      Kamer degene tegen wie de aanklacht is gericht in de gelegenheid naar diens keuze schriftelijk of mondeling een
      zienswijze naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0001844/2018-09-19#Artikel8
  - number: '9'
    text: |-
      Indien de Tweede Kamer besluit tot het in overweging nemen van de aanklacht, stelt zij een commissie van onderzoek
      in.
    url: https://wetten.overheid.nl/BWBR0001844/2018-09-19#Artikel9
  - number: '10'
    text: |-
      De Tweede Kamer benoemt de leden van de commissie van onderzoek uit haar midden. Leden die de aanklacht hebben
      ingediend, kunnen geen lid zijn van de commissie. Wel kunnen zij door de commissie ten behoeve van het geven van
      nadere inlichtingen worden gehoord.
    url: https://wetten.overheid.nl/BWBR0001844/2018-09-19#Artikel10
  - number: '11.1'
    text: |-
      De commissie van onderzoek is belast met het opsporen en verzamelen van alle bescheiden, inlichtingen en bewijzen,
      die tot opheldering van de feiten, in de aanklacht vermeld, kunnen leiden.
    url: https://wetten.overheid.nl/BWBR0001844/2018-09-19#Artikel11
  - number: '11.2'
    text: |-
      De [hoofdstukken 3][ref1], [4][ref2], [5][ref3] en [7 van de Wet op de parlementaire enquête 2008][ref4] zijn
      van overeenkomstige toepassing, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0023825#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0023825#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0023825#Hoofdstuk5
      [ref4]: https://wetten.overheid.nl/BWBR0023825#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0001844/2018-09-19#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0023825
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0023825
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0023825
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0023825
        hoofdstuk: '7'
  - number: 11.2.a
    text: degene tegen wie de aanklacht is gericht niet verplicht is de commissie van onderzoek medewerking te verlenen;
    url: https://wetten.overheid.nl/BWBR0001844/2018-09-19#Artikel11
  - number: 11.2.b
    text: |-
      [artikel 217 van het Wetboek van Strafvordering][ref1] van overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel217
    url: https://wetten.overheid.nl/BWBR0001844/2018-09-19#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '217'
  - number: '12'
    text: |-
      In iedere stand van het onderzoek is de commissie van onderzoek verplicht om degene tegen wie de aanklacht is
      gericht, indien deze dit wenst, te horen.
    url: https://wetten.overheid.nl/BWBR0001844/2018-09-19#Artikel12
  - number: '13'
    text: |-
      Zodra de commissie van onderzoek de aanklacht genoegzaam toegelicht acht, brengt zij over de daarbij aangevoerde
      feiten verslag uit aan de Tweede Kamer.
    url: https://wetten.overheid.nl/BWBR0001844/2018-09-19#Artikel13
  - number: '14.1'
    text: |-
      Bij de beraadslaging over de aanklacht wordt degene tegen wie de aanklacht is gericht gehoord, indien deze daarom
      verzoekt. Aan deze persoon wordt in ieder geval het laatst het woord gegeven.
    url: https://wetten.overheid.nl/BWBR0001844/2018-09-19#Artikel14
  - number: '14.2'
    text: |-
      Het eerste lid geldt eveneens indien voor of tijdens het onderzoek het kamerlidmaatschap van het betrokken lid van
      de Staten-Generaal is beëindigd of aan de betrokken minister of staatssecretaris ontslag is verleend.
    url: https://wetten.overheid.nl/BWBR0001844/2018-09-19#Artikel14
  - number: '15.1'
    text: |-
      Indien de Tweede Kamer een aanklacht als bedoeld in [artikel 7][ref1] niet in overweging heeft genomen, kan zij
      deze bij het opkomen van nieuwe bezwaren alsnog in overweging nemen. Eveneens kan in dat geval bij koninklijk
      besluit de opdracht worden gegeven tot vervolging van dezelfde persoon wegens dezelfde feiten.


      [ref1]: https://wetten.overheid.nl/BWBR0001844#Artikel7
    url: https://wetten.overheid.nl/BWBR0001844/2018-09-19#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001844
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '15.2'
    text: |-
      Indien de Tweede Kamer de aanklacht na gedaan onderzoek en gehouden beraadslaging heeft verworpen, kan ten aanzien
      van dezelfde persoon wegens dezelfde feiten noch door de regering noch door de Tweede Kamer opnieuw onderzoek
      worden gedaan noch een opdracht tot vervolging worden gegeven.
    url: https://wetten.overheid.nl/BWBR0001844/2018-09-19#Artikel15
  - number: '16.1'
    text: |-
      Een aanklacht wordt geacht te zijn verworpen indien de Tweede Kamer binnen drie maanden na de indiening van de
      aanklacht geen eindbeslissing heeft genomen.
    url: https://wetten.overheid.nl/BWBR0001844/2018-09-19#Artikel16
  - number: '16.2'
    text: De Tweede Kamer kan besluiten de termijn, bedoeld in het eerste lid, te verlengen met ten hoogste twee maanden.
    url: https://wetten.overheid.nl/BWBR0001844/2018-09-19#Artikel16
  - number: '17'
    text: |-
      Indien een aanklacht overeenkomstig [artikel 16][ref1] wordt geacht te zijn verworpen, blijft de regering bevoegd
      om bij koninklijk besluit de opdracht te geven tot vervolging van dezelfde persoon wegens dezelfde feiten.


      [ref1]: https://wetten.overheid.nl/BWBR0001844#Artikel16
    url: https://wetten.overheid.nl/BWBR0001844/2018-09-19#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001844
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '18.1'
    text: De Tweede Kamer toetst de aangeklaagde feiten aan het recht, de billijkheid, de zedelijkheid en het staatsbelang.
    url: https://wetten.overheid.nl/BWBR0001844/2018-09-19#Artikel18
  - number: '18.2'
    text: |-
      Indien de Tweede Kamer genoegzame gronden tot vervolging aanwezig acht, geeft zij opdracht aan de procureur-
      generaal bij de Hoge Raad om de vervolging in te stellen. Het daartoe strekkende besluit bevat een nauwkeurige
      aanduiding van het ten laste gelegde feit. Binnen drie dagen nadat de Tweede Kamer het besluit heeft genomen, wordt
      dit tezamen met de aanklacht en de verzamelde informatie toegezonden aan de procureur-generaal.
    url: https://wetten.overheid.nl/BWBR0001844/2018-09-19#Artikel18
  - number: '18.3'
    text: |-
      Een afschrift van het besluit wordt toegezonden aan de betrokkene, aan Onze Minister van Justitie en Veiligheid en
      aan de Eerste Kamer.
    url: https://wetten.overheid.nl/BWBR0001844/2018-09-19#Artikel18
  - number: '19'
    text: |-
      Indien de Tweede Kamer opdracht heeft gegeven tot vervolging, kan bij koninklijk besluit geen opdracht worden
      gegeven tot vervolging van dezelfde persoon wegens dezelfde feiten.
    url: https://wetten.overheid.nl/BWBR0001844/2018-09-19#Artikel19
  - number: '36'
    text: |-
      Een vordering tot vergoeding van schade, geleden door een ambtsdelict als bedoeld in [hoofdstuk 2][ref1], kan
      slechts berusten op een veroordeling door de Hoge Raad en kan uitsluitend bij de burgerlijke rechter worden
      ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001844#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0001844/2018-09-19#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0001844
        hoofdstuk: '2'
  - number: '37'
    text: |-
      Deze wet wordt aangehaald als: Wet ministeriële verantwoordelijkheid en ambtsdelicten leden Staten-Generaal,
      ministers en staatssecretarissen.
    url: https://wetten.overheid.nl/BWBR0001844/2018-09-19#Artikel37
