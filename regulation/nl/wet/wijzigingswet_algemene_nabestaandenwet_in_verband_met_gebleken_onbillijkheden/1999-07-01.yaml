  - number: V
    text: |-
      Indien de toepassing van [artikel 3, zevende lid, van de Algemene nabestaandenwet][ref1] in verband met de
      uitbreiding van het begrip bloedverwant in de eerste graad tot de persoon die met de nabestaande een gezamenlijke
      huishouding voert leidt tot het beëindigen van het recht op nabestaandenuitkering, gaat deze wijziging eerst in zes
      maanden na inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel3
    url: https://wetten.overheid.nl/BWBR0009706/1999-07-01#ArtikelV
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '3'
  - number: VI
    text: |-
      Beschikkingen voor de inwerkingtreding van deze wet gegeven door de Bank, bedoeld in
      [artikel 1, eerste lid, onderdeel c, van de Algemene nabestaandenwet][ref1], op grond van artikel 67, achtste lid,
      van die wet en de daarop berustende bepalingen, worden in overeenstemming gebracht met de bepalingen van deze wet
      en aangemerkt als beschikkingen op grond van [artikel 67 van de Algemene nabestaandenwet][ref2] zoals dat artikel
      luidt na inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel67
