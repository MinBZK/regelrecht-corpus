preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, met het oog op het voorkomen van onbillijkheden en
    teneinde enige correcties aan te brengen in de Algemene nabestaandenwet, de Algemene nabestaandenwet en de Wet
    financiering volksverzekeringen te wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009706/1999-07-01#ArtikelAanhef
articles:
  - number: IV
    text: |-
      1 Voor de nabestaande wiens uitkering op grond van [artikel 16, eerste lid, aanhef en onderdeel b][ref1],
      zoals dit onderdeel op de dag voor inwerkingtreding van deze wet luidde, is geëindigd in verband met het voeren
      van een gezamenlijke huishouding anders dan ten behoeve van de verzorging van een hulpbehoevende als bedoeld
      in [artikel 1, eerste lid, onderdeel l, van de Algemene nabestaandenwet][ref2], herleeft het recht op een
      nabestaandenuitkering met ingang van de eerste dag van de maand dat hij deze gezamenlijke huishouding uiterlijk
      binnen zes maanden na inwerkingtreding van deze wet, niet meer voert.

      2 De Bank, bedoeld in [artikel 1, eerste lid, onderdeel c, van de Algemene nabestaandenwet][ref3], kan, in
      afwijking van het eerste lid, een langere termijn vaststellen indien de toepassing wat de termijn van zes maanden
      betreft, zal leiden tot een onbillijkheid van overwegende aard.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007795#Artikel1
