  - number: '40'
    text: |-
      1 Binnen acht weken nadat de aanvraag tot inschrijving in het accountantsregister is ontvangen neemt de
      beroepsorganisatie een besluit.

      2 De aanvrager wordt binnen drie werkdagen na het besluit tot inschrijving door het bestuur ingeschreven in het
      accountantsregister.
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel40
  - number: '41'
    text: |-
      1 Degene die is ingeschreven in het register, is gerechtigd tot het voeren van de titel Registeraccountant,
      afgekort RA of Accountants-Administratieconsulent, afgekort AA. De titel wordt bij het besluit tot inschrijving
      verleend.

      2 Het is degene die niet in het accountantsregister is ingeschreven verboden om anders dan in besloten kring de
      titels, genoemd in het eerste lid, of de benaming accountant zonder nadere toevoeging dan wel in samenstelling of
      afkorting te voeren, dan wel zich zodanig te gedragen, dat daardoor bij het publiek redelijkerwijs de indruk kan
      zijn gewekt, dat hij tot het voeren van die benaming gerechtigd is.

      3 In afwijking van het tweede lid is het degene die in een dienstbetrekking werkzaam is onder de rechtstreekse
      verantwoordelijkheid van een accountant, toegestaan de benaming adjunct-accountant, assistent-accountant of een
      andere soortgelijke benaming te voeren.
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel41
  - number: '42'
    text: |-
      1 Ten aanzien van de uitoefening van zijn beroep is de accountant onderworpen aan tuchtrechtspraak op grond van de
      [Wet tuchtrechtspraak accountants][ref1] ter zake van:

      a. enig handelen of nalaten in strijd met het bij of krachtens deze wet bepaalde; en

      b. enig ander dan in onderdeel a bedoeld handelen of nalaten in strijd met het belang van een goede uitoefening van
      het accountantsberoep.

      2 De tuchtrechtspraak wordt uitgeoefend in eerste aanleg door de accountantskamer en in hoger beroep, tevens in
      hoogste ressort, door het College van Beroep voor het bedrijfsleven.


      [ref1]: https://wetten.overheid.nl/BWBR0024238
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0024238
  - number: '43'
    text: |-
      1 Het bestuur haalt een inschrijving in het accountantsregister door:

      a. in geval van overlijden van de ingeschrevene;

      b. op verzoek van de ingeschrevene;

      c. indien de ingeschrevene in een van de omstandigheden, genoemd in
      [artikel 39, eerste lid, onderdelen b tot en met d][ref1], is komen te verkeren;

      d. ter tenuitvoerlegging van een daartoe strekkende tuchtrechtelijke maatregel;

      e. ter uitvoering van een voorlopige voorziening als bedoeld in [artikel 41][ref2] of
      [44 van de Wet tuchtrechtspraak accountants][ref3];

      f. indien de ingeschrevene na de tenuitvoerlegging van een dwangbevel in gebreke blijft de jaarlijkse bijdrage,
      bedoeld in [artikel 30, eerste lid][ref4], te voldoen.

      2 Doorhaling van de inschrijving leidt tot verlies van de betrekkingen binnen de beroepsorganisatie waarvoor het
      lidmaatschap een vereiste is.


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0024238#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0024238#Artikel44
      [ref4]: https://wetten.overheid.nl/BWBR0032573#Artikel30
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel43
