      1 Indien de inwerkingtreding van deze wet gedurende een boekjaar van het Nederlands Instituut van
      Registeraccountants of de Nederlandse Orde van Accountants-Administratieconsulenten plaatsvindt, dan gaat de
      contributieverplichting van de leden van de op te heffen openbare lichamen voor het resterend deel van het boekjaar
      voor een evenredig deel over op de leden van de beroepsorganisatie.

      2 Het boekjaar van het Nederlands Instituut van Registeraccountants loopt van 1 januari tot en met 31 december.
