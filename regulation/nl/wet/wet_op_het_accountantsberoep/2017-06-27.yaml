  - number: '2'
    text: |-
      1 Er is een Nederlandse beroepsorganisatie van accountants. De beroepsorganisatie is een openbaar lichaam als
      bedoeld in [artikel 134 van de Grondwet][ref1].

      2 De beroepsorganisatie is gevestigd te Amsterdam.

      3 Accountants zijn lid van de beroepsorganisatie, tenzij [artikel 39, tweede lid][ref2] van toepassing is en de
      accountant een wens tot lidmaatschap niet schriftelijk aan het bestuur kenbaar heeft gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel134
      [ref2]: https://wetten.overheid.nl/BWBR0032573#Artikel39
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '134'
      - id: ref2
        bwb_id: BWBR0032573
        artikel: '39'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '3'
    text: |-
      De beroepsorganisatie heeft de volgende taken:

      a. bevorderen van een goede beroepsuitoefening door accountants, onder meer door het vaststellen van
      beroepsreglementering;

      b. behartigen van de gemeenschappelijke belangen van accountants;

      c. zorg dragen voor de eer van de stand van de accountants; en

      d. zorg dragen voor de praktijkopleiding, bedoeld in [artikel 47][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel47
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0032573
        artikel: '47'
        hoofdstuk: '7'
  - number: '4'
    text: De beroepsorganisatie heeft een ledenvergadering, een bestuur, een voorzitter, ledengroepen en een bureau.
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel4
  - number: '5'
    text: |-
      1 De ledenvergadering stelt verordeningen vast.

      2 De ledenvergadering houdt toezicht op het bestuur. De ledenvergadering kan bestuursleden, met uitzondering van
      de afgevaardigden, bedoeld in [artikel 17, derde lid][ref1], in hun functie schorsen of ontslaan, indien zij het
      vertrouwen in hun wijze van taakvervulling heeft verloren of wegens andere gegronde redenen.


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel17
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0032573
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '6'
    text: |-
      Het bestuur roept de ledenvergadering zo dikwijls als het zulks nodig acht, doch minstens een keer per jaar bijeen
      of op verzoek van ten minste één procent van de leden.
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel6
  - number: '7'
    text: |-
      1 De ledenvergadering is openbaar.

      2 De deuren worden gesloten, wanneer ten minste een vijfde van de aanwezige leden daar om verzoekt of de voorzitter
      het nodig acht, tenzij de ledenvergadering anders beslist.

      3 Het personeel dat in dienst is bij de beroepsorganisatie kan een besloten vergadering bijwonen, tenzij de
      ledenvergadering anders beslist.

      4 Het verslag van een besloten vergadering wordt niet openbaar gemaakt, tenzij de ledenvergadering anders beslist.
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel7
  - number: '8'
    text: |-
      1 De ledenvergadering neemt beslissingen bij meerderheid van stemmen. Blanco stemmen worden hierbij geacht niet te
      zijn uitgebracht.

      2 Bij staking van stemmen over personen beslist het lot.

      3 Stemmingen over personen zijn geheim.
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel8
  - number: '9'
    text: |-
      1 Een stemming in een bijeenkomst van de ledenvergadering is nietig, indien niet meer dan de helft van de stemmen
      is uitgebracht van de ter vergadering aanwezige of vertegenwoordigde stemgerechtigden.

      2 Bij stemming over personen worden blanco stemmen, voor de toepassing van dit artikel meegerekend.
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel9
  - number: '10'
    text: |-
      1 Ieder lid kan één stem uitbrengen.

      2 Tenzij bij verordening anders is bepaald, kan een lid aan een ander lid schriftelijk volmacht verlenen tot het
      uitbrengen van zijn stem. Een lid kan voor ten hoogste drie andere leden een stem uitbrengen. Leden van het bestuur
      kunnen niet als gevolmachtigde optreden.
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel10
  - number: '11'
    text: |-
      1 Het bestuur bestuurt de beroepsorganisatie en beheert het accountantsregister en het vermogen van de
      beroepsorganisatie.

      2 Het bestuur vertegenwoordigt de beroepsorganisatie in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel11
  - number: '12'
    text: |-
      1 Het aantal leden van het bestuur wordt door de ledenvergadering bepaald, doch bedraagt ten minste zeven.

      2 Het bestuur bestaat uit personen die door de ledenvergadering worden benoemd en uit afgevaardigden uit de
      ledengroepbesturen. Het bestuur bestaat voor de meerderheid uit personen die door de ledenvergadering worden
      benoemd.

      3 Jaarlijks treedt een deel van de bestuursleden die zijn benoemd door de ledenvergadering af volgens een door
      de ledenvergadering vast te stellen rooster. Het rooster wordt zodanig ingericht, dat voor zover mogelijk telkens
      hetzelfde aantal bestuursleden aftreedt.

      4 Bestuursleden worden benoemd voor vier jaren. In afwijking hiervan treedt een bestuurslid dat is benoemd ter
      vervulling van een tussentijds opengevallen plaats af, op het tijdstip waarop degene in wiens plaats hij is benoemd
      had moeten aftreden.

      5 Een afgetreden bestuurslid is niet terstond herbenoembaar, tenzij hij is benoemd voor een tussentijds
      opengevallen plaats.

      6 Het bestuur bevordert dat het bestuur een evenwichtige afspiegeling van de accountantsberoepsgroep vormt, waarin
      de verschillende categorieën accountants naar de aard van hun werkzaamheden in het bestuur zijn vertegenwoordigd.
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel12
  - number: '13'
    text: |-
      1 Het bestuur neemt beslissingen en besluiten bij meerderheid van stemmen.

      2 De leden van het bestuur stemmen zonder last.

      3 Een stemming in een bestuursvergadering is nietig, indien niet ten minste de helft van het aantal zittinghebbende
      leden die zich niet van medestemmen moeten onthouden, eraan heeft deelgenomen.

      4 In een bestuursvergadering onthouden de leden van het bestuur zich van stemmen over aangelegenheden die specifiek
      betrekking hebben op:

      a. henzelf;

      b. hun echtgenoten of geregistreerde partners;

      c. hun bloed- of aanverwanten tot de derde graad;

      d. degenen met wie zij in de uitoefening van een beroep voor gemene rekening of onder gemeenschappelijke naam
      optreden;

      e. hun werknemers;

      f. hun werkgevers;

      g. hun opdrachtgevers;

      h. degenen, op wie de in de uitoefening van hun beroep verrichte werkzaamheden rechtstreeks betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel13
  - number: '14'
    text: |-
      De voorzitter van het bestuur, dan wel bij zijn afwezigheid de plaatsvervangend voorzitter, bekleedt tijdens de
      bestuurs- en ledenvergaderingen het voorzitterschap.
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel14
  - number: '15'
    text: De voorzitter en de plaatsvervangend voorzitter worden jaarlijks door de ledenvergadering uit het bestuur benoemd.
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel15
  - number: '16'
    text: |-
      1 Een ledengroep is een bij verordening ingesteld verband van leden van de beroepsorganisatie die zijn verenigd
      naar de aard van hun werkzaamheden of hun functie als accountant.

      2 Ieder lid van de beroepsorganisatie die actief deelneemt aan het arbeidsproces, is tevens lid van een ledengroep.
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel16
  - number: '17'
    text: |-
      1 Een ledengroep heeft een bestuur, bestaande uit ten minste vijf personen uit de ledengroep.

      2 Het ledengroepbestuur heeft als taak:

      a. het behartigen van de belangen van de ledengroep;

      b. het adviseren van het bestuur over kwesties die de ledengroep aangaan.

      3 De ledengroep benoemt uit het ledengroepbestuur een afgevaardigde die zitting heeft in het bestuur van de
      beroepsorganisatie, tenzij bij verordening anders is bepaald.

      4 Een ledengroep houdt toezicht op haar ledengroepbestuur. De ledengroep kan ledengroepbestuursleden in hun functie
      schorsen of ontslaan, indien zij het vertrouwen in hun wijze van taakvervulling heeft verloren of wegens andere
      gegronde redenen.

      5 Leden van het ledengroepbestuur worden door de ledengroep benoemd voor een periode van vier jaar. In afwijking
      hiervan treedt een bestuurslid dat is benoemd ter vervulling van een tussentijds opengevallen plaats af, op het
      tijdstip waarop degene in wiens plaats hij is benoemd had moeten aftreden.

      6 Een afgetreden bestuurslid is niet terstond herbenoembaar, tenzij hij is benoemd voor een tussentijds
      opengevallen plaats.
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel17
  - number: '18'
    text: |-
      1 De beroepsorganisatie beschikt over een bureau dat de organen van de beroepsorganisatie ondersteunt bij de
      uitvoering van hun taken.

      2 Het bureau staat onder leiding van een directie.

      3 Het personeel dat werkzaam is bij de beroepsorganisatie wordt door het bestuur van de beroepsorganisatie in
      dienst genomen op arbeidsovereenkomst naar burgerlijk recht.
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel18
  - number: '19'
    text: |-
      1 De ledenvergadering kan verordeningen vaststellen die zij nodig acht ter vervulling van de taken, genoemd in
      [artikel 3][ref1].

      2 De ledenvergadering stelt in ieder geval verordeningen vast met betrekking tot:

      a. gedrags- en beroepsregels ten behoeve van een goede uitoefening van de werkzaamheden van accountants;

      b. de onafhankelijkheid, het stelsel van kwaliteitsbeheersing en de integere bedrijfsvoering van
      accountantsorganisaties;

      c. behandeling van klachten over accountants;

      d. de werkwijze van de verschillende organen van de beroepsorganisatie;

      e. het instellen en opheffen van de ledengroepen, alsmede de organisatie en werkwijze van de ledengroep en het
      ledengroepbestuur;

      f. het in dienst nemen van het personeel dat werkzaam is bij het bureau;

      g. de bijdragen van de leden, bedoeld in [artikel 30, eerste lid][ref2];

      h. de tarieven die in rekening worden gebracht voor de werkzaamheden als bedoeld in [artikel 30, tweede lid][ref3];

      i. de vergoeding van de kosten, bedoeld in [artikel 38, eerste lid][ref4];

      j. de praktijkopleiding en het daarbij behorende examen, bedoeld in [artikel 47, eerste lid][ref5];

      k. de beroepsprofielen behorend bij de accountantstitels, genoemd in [artikel 41, eerste lid][ref6];

      l. de inrichting, de wijze van afname en de hoogte van de examengelden van het examen, bedoeld in
      [artikel 54, eerste lid, onderdeel c][ref7], en de voorwaarden voor het verkrijgen van vrijstellingen van
      onderdelen daarvan;.

      m. de inhoud van het examen ten behoeve van de verklaring van vakbekwaamheid, bedoeld in
      [artikel 54, eerste lid, onderdeel d][ref8];

      n. het instellen, opheffen en beheer van eventuele fondsen in het belang van de beroepsgroep.

      3 De ledenvergadering kan bij verordening de bevoegdheid tot het stellen van nadere voorschriften delegeren aan
      het bestuur.

      4 Verordeningen en de daarop berustende nadere voorschriften bevatten geen verplichtingen of voorschriften die niet
      strikt noodzakelijk zijn voor verwezenlijking van het doel dat met de verordening wordt beoogd en beperken niet
      onnodig de marktwerking.

      5 Verordeningen en de daarop berustende bepalingen zijn slechts verbindend ten aanzien van accountants en organen
      van de beroepsorganisatie, tenzij bij wet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel3
