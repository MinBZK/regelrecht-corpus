  - number: '55'
    text: |-
      1 Met het toezicht op de naleving van [artikel 41, tweede lid][ref1], van deze wet, zijn belast de bij besluit van
      Onze Minister aangewezen personen.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.

      3 De toezichthouder beschikt niet over de bevoegdheden, genoemd in de [artikelen 5:18][ref2] en
      [5:19 van de Algemene wet bestuursrecht][ref3].


