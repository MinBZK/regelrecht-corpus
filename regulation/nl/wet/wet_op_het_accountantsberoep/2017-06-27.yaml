        artikel: '46'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0032573
        artikel: '19'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: 5a.9
      - id: ref4
        bwb_id: BWBR0005682
        artikel: 5a.11
  - number: '50'
    text: |-
      1 De opleidingsinstituten wier opleiding op grond van [artikel 49, tweede lid, onderdeel b][ref1], is aangewezen
      en de betrokkenen bij de praktijkopleiding, verstrekken desgevraagd alle inlichtingen die de commissie voor haar
      taakuitvoering nodig heeft.

      2 De commissie kan voorwaarden verbinden aan de aanwijzing, bedoeld in [artikel 49, tweede lid, onderdeel b][ref2].

      3 De commissie kan de aanwijzing, bedoeld in [artikel 49, tweede lid, onderdeel b][ref3], intrekken indien de
      opleiding niet voldoet aan de eindtermen, bedoeld in dat onderdeel.

      4 De commissie kan een aanwijzing geven ten aanzien van de uitvoering van de praktijkopleiding indien uit een
      toetsing als bedoeld in [artikel 49, tweede lid, onderdeel c][ref4], blijkt dat de praktijkopleiding niet voldoet
      aan de eindtermen die gelden voor de praktijkopleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel49
