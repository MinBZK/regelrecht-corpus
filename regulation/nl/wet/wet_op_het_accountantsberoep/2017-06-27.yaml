  - number: '70'
    text: |-
      1 De beroepsorganisatie is de rechtsopvolger onder algemene titel van het Nederlands Instituut van
      Registeraccountants en de Nederlandse Orde van Accountants-Administratieconsulenten.

      2 Het personeel dat op de datum van inwerkingtreding van deze wet in dienst is bij het Nederlands Instituut van
      Registeraccountants of de Nederlandse Orde van Accountant-Administratieconsulenten, treedt met ingang van die
      datum, met behoud van rechten, in dienst bij het bureau van de beroepsorganisatie.
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel70
  - number: '71'
    text: |-
      1 Binnen zes maanden na de inwerkingtreding van deze wet belegt het bestuur van de beroepsorganisatie een
      ledenvergadering waarin in ieder geval de volgende besluiten worden genomen:

      a. het benoemen van de bestuursleden;

      b. het vaststellen van de begroting.

      2 In afwijking van [artikel 12, vierde lid][ref1], kunnen de door de gezamenlijke ledenvergadering benoemde
      bestuursleden voor een kortere periode dan vier jaar worden benoemd, in verband met het op te stellen rooster,
      bedoeld in dat artikel.

      3 Tot de benoeming van de bestuursleden, bedoeld in het eerste lid, onder a, wordt het bestuur van de
      beroepsorganisatie gevormd door de gezamenlijke bestuursleden van het opgeheven Nederlands Instituut van
      Registeraccountants en de opgeheven Nederlandse Orde van Accountants-Administratieconsulenten.

      4 Het bestuur neemt beslissingen ten aanzien van de werkwijze van de ledenvergadering, bedoeld in het eerste lid,
      waarin bij of krachtens de wet niet is voorzien.

      5 De verordeningen en nadere voorschriften van het Nederlands Instituut van Registeraccountants en de Nederlandse
      Orde van Accountants-Administratieconsulenten blijven op de beroepsorganisatie, de Registeraccountants,
      respectievelijk de Accountants-Administratieconsulenten en de accountantsorganisaties van kracht tot drie jaar na
      de inwerkingtreding van deze wet, tenzij de ledenvergadering, respectievelijk het bestuur deze heeft ingetrokken
      of gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel12
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel71
