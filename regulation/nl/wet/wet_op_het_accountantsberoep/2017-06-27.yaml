        artikel: '36'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '38'
    text: |-
      1 Degene die in het accountantsregister wenst te worden ingeschreven, dient daartoe een aanvraag in bij het
      bestuur. De beroepsorganisatie kan een vergoeding voor de kosten van de inschrijving in rekening brengen bij de
      aanvrager.

      2 Degene die de aanvraag doet verstrekt daarbij de volgende gegevens:

      a. één of meerdere getuigschriften waaruit blijkt dat hij een opleiding als bedoeld in [artikel 46][ref1], die
      passend is bij de door hem aangevraagde beroepstitel, met goed gevolg heeft afgerond, of een verklaring van
      vakbekwaamheid als bedoeld in [artikel 54, eerste lid][ref2]; en

      b. een verklaring omtrent het gedrag op grond van de [Wet justitiële en strafvorderlijke gegevens][ref3].

      3 Op de voorbereiding van de beschikking op de aanvraag tot inschrijving is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref4] van toepassing.

      4 Bij ministeriële regeling kunnen regels worden gesteld over de gegevens die worden verstrekt bij de aanvraag
      tot inschrijving.


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0032573#Artikel54
      [ref3]: https://wetten.overheid.nl/BWBR0014194
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0032573
        artikel: '46'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0032573
        artikel: '54'
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0014194
      - id: ref4
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '39'
    text: |-
      1 De inschrijving wordt geweigerd indien:

      a. de aanvrager niet voldoet aan de voorwaarden, gesteld bij of krachtens [artikel 38][ref1];

      b. de aanvrager ingevolge een in kracht van gewijsde gegane rechterlijke uitspraak in staat van faillissement
      verkeert of ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is;

      c. de aanvrager ingevolge een in kracht van gewijsde gegane rechterlijke uitspraak onder curatele is gesteld;

      d. indien de aanvrager ingevolge een rechterlijke uitspraak is ontzet van het recht het accountantsberoep uit te
      oefenen;

      e. er, gelet op de antecedenten van de aanvrager, gegronde vrees bestaat dat de aanvrager zal handelen of
      nalaten in strijd met wettelijke voorschriften, de accountant betreffende, of dat zijn inschrijving in het
      accountantsregister op andere wijze de eer van de stand van accountants zal schaden.

      2 Het eerste lid, onderdeel e, is niet van toepassing op een aanvrager, die beschikt over een verklaring van
      vakbekwaamheid als bedoeld in [artikel 54, eerste lid][ref2], indien hij zonder zich in Nederland te vestigen
      onderzoeken als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref3] bij wijze van
      dienstverlening wil verrichten, mits hij bevoegd is tot het wettelijk voorgeschreven onderzoek van jaarrekeningen
      in een lidstaat van de Europese Unie, anders dan Nederland, of in een andere Staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte (Trb. 1992, 132).


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0032573#Artikel54
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel393
