        paragraaf: '2.3'
  - number: '72'
    text: |-
      Degenen die op het moment van de inwerkingtreding van deze wet zijn ingeschreven in de
      registers, bedoeld in [artikel 55, eerste lid, van de Wet op de Registeraccountants][ref1] of
      [artikel 36, eerste lid van de Wet op de Accountant-Administratieconsulenten][ref2], zoals die artikelen luidden
      op het moment van inwerkingtreding van [artikel 58][ref3] van deze wet, worden vanaf dat moment geacht op
      overeenkomstige wijze te zijn ingeschreven in het accountantsregister. [Artikel 36, tweede en derde lid][ref4], is
      van overeenkomstige toepassing.


