  - number: '46'
    text: |-
      De opleiding tot accountant omvat bij algemene maatregel van bestuur vast te stellen vakgebieden en voldoet
      aan de eindtermen, bedoeld in [artikel 49, tweede lid, onderdeel a][ref1], die voor controles van financiële
      verantwoordingen van belang zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel49
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0032573
        artikel: '49'
        hoofdstuk: '7'
  - number: '47'
    text: |-
      1 Gedurende ten minste drie jaar wordt als onderdeel van de opleiding tot accountant een praktijkopleiding gevolgd
      waarvoor de beroepsorganisatie zorg draagt. De praktijkopleiding wordt afgesloten met een examen. Indien het examen
      met goed gevolg is afgelegd, geeft de beroepsorganisatie daarvan een getuigschrift af.

      2 De verordening over de praktijkopleiding en het daarbij behorende examen, bedoeld in
      [artikel 19, tweede lid, onderdeel j][ref1], bevat regels over:

      a. de toelatingseisen voor de praktijkopleiding;

      b. de inhoud van het examen, de wijze waarop het examen wordt afgenomen en de personen die bevoegd zijn het examen
      af te nemen;

      c. de voorwaarden voor de toelating tot het afleggen van het examen;

      d. de voorwaarden voor het verkrijgen van vrijstelling van bepaalde onderdelen van het examen;

      e. de hoogte van de examengelden en te wiens laste deze komen.


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel19
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0032573
        artikel: '19'
        hoofdstuk: '3'
  - number: '48'
    text: |-
      De beroepsorganisatie beoordeelt aan de hand van de vastgestelde eindtermen, bedoeld in
      [artikel 49, tweede lid][ref1], en de verstrekte getuigschriften van opleidingen of degene die een
      praktijkopleiding wil volgen voldoet aan de toelatingseisen daarvoor.


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel49
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0032573
        artikel: '49'
        hoofdstuk: '7'
  - number: '49'
    text: |-
      1 Er is een Commissie eindtermen accountantsopleiding.

      2 De commissie heeft tot taak:

      a. het vaststellen van de eindtermen, met inachtneming van de vakgebieden, bedoeld in [artikel 46][ref1], en de
      beroepsprofielen, bedoeld in [artikel 19, tweede lid, onderdeel k][ref2];

      b. het aanwijzen van opleidingen die geheel of gedeeltelijk voldoen aan de in onderdeel
      a bedoelde eindtermen, met uitzondering van de eindtermen die betrekking hebben op de
      praktijkopleiding, voor zover deze opleidingen niet zijn geaccrediteerd overeenkomstig
      [artikel 5a.9 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3] of niet de toets nieuwe
      opleiding overeenkomstig [artikel 5a.11 van de Wet op het hoger en wetenschappelijk onderzoek][ref4] met positief
      gevolg hebben ondergaan;

      c. het toetsen of de praktijkopleidingen voldoen aan de eindtermen, bedoeld in onderdeel a die gelden voor de
      praktijkopleiding.

      3 De commissie maakt de vastgestelde eindtermen bekend door plaatsing in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0032573#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel5a.9
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel5a.11
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel49
    references:
      - id: ref1
