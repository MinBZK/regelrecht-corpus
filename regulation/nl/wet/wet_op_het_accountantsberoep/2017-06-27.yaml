      1 Onze Minister is bevoegd tot oplegging van een last onder dwangsom ter handhaving van
      [artikel 41, tweede lid][ref1], van deze wet en [artikel 5:20 van de Algemene wet bestuursrecht][ref2].

      2 Onze Minister is bevoegd tot oplegging van een bestuurlijke boete wegens overtreding van
      [artikel 41, tweede lid][ref3], van deze wet en [artikel 5:20 van de Algemene wet bestuursrecht][ref4].

      3 De op grond van het tweede lid op te leggen bestuurlijke boete bedraagt ten hoogste het bedrag dat is vastgesteld
      voor de tweede categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref5].


