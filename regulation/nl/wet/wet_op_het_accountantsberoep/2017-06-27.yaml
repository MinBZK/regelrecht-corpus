preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Wet op de Registeraccountants en de Wet op de
    Accountants-Administratieconsulenten te vervangen door de Wet op het accountantsberoep, waarin het Nederlands
    Instituut van Registeraccountants en de Nederlandse Orde van Accountants-Administratieconsulenten worden
    samengevoegd tot één Nederlandse beroepsorganisatie van accountants;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt, voor zover niet anders is bepaald, verstaan onder:

        - *accountant:* een Registeraccountant of Accountant-Administratieconsulent;
        - *accountantskamer:* de accountantskamer te Zwolle, bedoeld in
      [artikel 10 van de Wet tuchtrechtspraak accountants][ref1];
        - *accountantsorganisatie:* een accountantsorganisatie als bedoeld in
      [artikel 1, eerste lid, onderdeel a, van de Wet toezicht accountantsorganisaties][ref2];
        - *accountantsregister:* het register, bedoeld in [artikel 36, eerste lid][ref3], waarin de accountants zijn
      ingeschreven;
        - *Autoriteit Financiële Markten:* de Stichting Autoriteit Financiële Markten;
        - *beroepsorganisatie:* de Nederlandse beroepsorganisatie van accountants;
        - *commissie:* de Commissie eindtermen accountantsopleiding, bedoeld in [artikel 49, eerste lid][ref4];
        - *Onze Minister:* Onze Minister van Financiën;
        - *wettelijke controle:* een wettelijke controle als bedoeld in
      [artikel 1, eerste lid, onderdeel p, van de Wet toezicht accountantsorganisaties][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0024238#Artikel10
