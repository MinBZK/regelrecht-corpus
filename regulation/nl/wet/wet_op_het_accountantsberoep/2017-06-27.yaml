  - number: '20'
    text: |-
      Het bestuur, de ledengroep en het ledengroepbestuur kunnen nadere voorschriften stellen over hun werkwijze, voor
      zover daarin niet bij of krachtens een ander wettelijk voorschrift is voorzien.
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel20
  - number: '21'
    text: |-
      1 De bevoegdheid tot het maken van verordeningen en nadere voorschriften blijft ten aanzien van onderwerpen waarin
      door een wet, algemene maatregel van bestuur of ministeriële regeling is voorzien, gehandhaafd, voor zover de
      verordeningen daarmee niet in strijd zijn.

      2 De bepalingen van verordeningen en nadere voorschriften in wier onderwerp door een wet, algemene maatregel van
      bestuur of ministeriële regeling wordt voorzien, zijn van rechtswege vervallen.
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel21
  - number: '22'
    text: |-
      1 Het bestuur, een ledengroepbestuur of ten minste honderd leden gezamenlijk, kunnen een voorstel voor een
      verordening indienen.

      2 Het bestuur legt ontwerpverordeningen ten minste twee maanden voorafgaand aan de datum waarop de ledenvergadering
      plaatsvindt op elektronische wijze ter inzage.

      3 Een ieder kan gedurende vier weken na de publicatie van een ontwerpverordening bij het bestuur een zienswijze
      indienen. Het bestuur brengt de naar voren gebrachte zienswijzen ter kennis van de leden.
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel22
  - number: '23'
    text: |-
      1 Bekendmaking van verordeningen en nadere voorschriften geschiedt door plaatsing in de Staatscourant.

      2 Verordeningen of nadere voorschriften treden niet eerder in werking dan de dag na uitgifte van de Staatscourant
      waarin deze zijn gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel23
  - number: '24'
    text: |-
      De beroepsorganisatie werkt samen met de Autoriteit Financiële Markten, voor zover dat noodzakelijk is ten behoeve
      van de uitoefening van het toezicht ingevolge de [Wet toezicht accountantsorganisaties][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019468
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0019468
  - number: '25'
    text: |-
      1 De beroepsorganisatie kan, in afwijking van [artikel 2:5 van de Algemene wet bestuursrecht][ref1], vertrouwelijke
      gegevens of inlichtingen verkregen bij de uitoefening van de ingevolge deze wet opgedragen taken, verstrekken aan:

      a. de Autoriteit Financiële Markten;

      b. een organisatorisch verband van marktpartijen, dat zich ten doel stelt een doeltreffende bijdrage te
      leveren aan de uitvoering door de Autoriteit Financiële Markten van het toezicht op de naleving van de
      [Wet toezicht accountantsorganisaties][ref2] en daartoe met de Autoriteit Financiële Markten een convenant heeft
      afgesloten;

      c. de accountantskamer; of

      d. het College van Beroep voor het bedrijfsleven;

      voor zover de verstrekking nodig is voor de vervulling van hun taak ingevolge de Wet toezicht
      accountantsorganisatie, of de [Wet tuchtrechtspraak accountants][ref3].

      2 Indien de beroepsorganisatie vertrouwelijke gegevens of inlichtingen op grond van het eerste lid heeft verstrekt
      aan een in dat lid bedoelde instantie en die instantie verzoekt om die gegevens of inlichtingen te mogen gebruiken
      voor een ander doel dan waarvoor zij zijn verstrekt, willigt de beroepsorganisatie dat verzoek slechts in:

      a. indien het beoogde gebruik niet in strijd is met het eerste lid; of

      b. voor zover die instantie op een andere wijze dan in deze wet voorzien, met inachtneming van de daarvoor geldende
      wettelijke procedures, voor dat andere doel de beschikking over die gegevens of inlichtingen zou kunnen verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0019468
      [ref3]: https://wetten.overheid.nl/BWBR0024238
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 2:5
      - id: ref2
        bwb_id: BWBR0019468
      - id: ref3
        bwb_id: BWBR0024238
  - number: '26'
    text: |-
      De beroepsorganisatie draagt alle kosten en is gerechtigd tot alle baten, uit de uitvoering van deze wet
      voortvloeiende.
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel26
  - number: '27'
    text: Het boekjaar van de beroepsorganisatie loopt van 1 januari tot en met 31 december.
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel27
  - number: '28'
    text: |-
      Vóór de aanvang van het boekjaar stelt de ledenvergadering de begroting van de beroepsorganisatie vast. Het bestuur
      dient daartoe een ontwerpbegroting in, vergezeld van de nodige toelichting. Het ontwerp wordt door het bestuur, ten
      minste twee weken vóór de behandeling daarvan door de ledenvergadering, op elektronische wijze bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel28
  - number: '29'
    text: |-
      1 Voor elk boekjaar benoemt de ledenvergadering een accountant die is belast met de controle op de financiële
      verantwoording, alsmede een plaatsvervanger voor deze.

      2 De accountant, bedoeld in het eerste lid, brengt binnen dertien weken na afloop van het betrokken boekjaar een
      verslag uit aan het bestuur.

      3 Binnen zes maanden na afloop van het boekjaar doet het bestuur aan de ledenvergadering rekening en verantwoording
      over zijn in het boekjaar gevoerde bestuur, onder overlegging van een balans en staat van baten en lasten met
      toelichting en met een verklaring van een accountant daarover. De balans, de staat van baten en lasten, de
      toelichting en de verklaring worden door het bestuur, ten minste twee weken vóór behandeling daarvan door de
      ledenvergadering, aan de leden toegezonden.

      4 De ledenvergadering stelt de rekening vast en verleent décharge aan het bestuur, behoudens in geval van later
      gebleken valsheid in bewijsstukken of andere onregelmatigheden.
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel29
  - number: '30'
    text: |-
      1 De beroepsorganisatie kan van haar leden jaarlijks bijdragen heffen. De hoogte van de bijdrage kan voor
      verschillende categorieën van leden verschillend worden vastgesteld.

      2 De beroepsorganisatie kan de kosten van de werkzaamheden die zij verricht ter beoordeling van de kwaliteit van de
      beroepsuitoefening van een accountant in rekening brengen bij haar leden of de kantoren waarbij deze leden werkzaam
      zijn.
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel30
  - number: '31'
    text: Het bestuur kan de krachtens deze wet aan de beroepsorganisatie verschuldigde bedragen bij dwangbevel invorderen.
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel31
  - number: '32'
    text: Het bestuur verstrekt Onze Minister desgevraagd alle inlichtingen over zaken die de beroepsorganisatie betreffen.
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel32
  - number: '33'
    text: |-
      1 Het bestuur zendt de vastgestelde begroting voor aanvang van het boekjaar aan Onze Minister.

      2 Het bestuur zendt een verslag over de werkzaamheden van de beroepsorganisatie in het afgelopen boekjaar, tezamen
      met de jaarrekening en de daarbij behorende accountantsverklaring voor 1 augustus van het jaar volgend op het
      boekjaar aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel33
  - number: '34'
    text: |-
      1 Goedkeuring van Onze Minister behoeven:

      a. verordeningen over de onderwerpen, genoemd in
      [artikel 19, tweede lid, onderdelen b tot en met n, en onderdeel a][ref1], voor zover deze betrekking hebben op het
      verrichten van wettelijke controles;

      b. nadere voorschriften die gebaseerd zijn op een verordening als bedoeld in de onderdelen a of b, en betrekking
      hebben op het verrichten van wettelijke controles;

      c. overige nadere voorschriften waarvan Onze Minister bij de goedkeuring van de verordening waarop het nadere
      voorschrift is gebaseerd heeft bepaald dat zij goedkeuring behoeven.

      2 Goedkeuring kan alleen worden onthouden wanneer een verordening of een nader voorschrift in strijd is met het
      recht of het algemeen belang.

      3 Goedkeuring van verordeningen of nadere voorschriften vindt plaats voorafgaand aan de bekendmaking van de
      verordening of het nadere voorschrift in de Staatscourant. Indien een verordening of nader voorschrift goedkeuring
      behoeft wordt in die regeling het besluit tot goedkeuring vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel19
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0032573
        artikel: '19'
        hoofdstuk: '3'
  - number: '35'
    text: |-
      1 Verordeningen en andere besluiten van de beroepsorganisatie kunnen bij koninklijk besluit worden vernietigd.

      2 Van een besluit tot schorsing of vernietiging wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel35
  - number: '36'
    text: |-
      1 Er is een accountantsregister waarin accountants zijn ingeschreven.

      2 In het accountantsregister worden, voor zover van toepassing, de volgende gegevens van de ingeschrevene
      opgenomen:

      a. de naam;

      b. de voornamen;

      c. de geboortedatum;

      d. het adres;

      e. het kantooradres dan wel het adres van de organisatie of instelling waar de accountant werkzaam is;

      f. de datum van inschrijving;

      g. de titel, bedoeld in [artikel 41][ref1];

      h. de ledengroep waartoe de ingeschrevene behoort;

      i. indien de opleiding van de ingeschrevene voldoet aan de eindtermen voor het uitvoeren van wettelijke controles:
      een aantekening daarvan;

      j. indien een tuchtmaatregel is opgelegd: de opgelegde maatregel en het tijdstip waarop deze is ingegaan en, voor
      zover van toepassing, het tijdstip waarop deze eindigt;

      k. de datum van een doorhaling van een ingeschrevene.

      3 De vermelding van de tuchtrechtelijke maatregel wordt na tien jaren, gerekend vanaf het tijdstip waarop de
      tuchtrechtelijke maatregel is opgelegd, uit het accountantsregister verwijderd.

      4 Onverminderd het derde lid wordt een tuchtrechtelijke maatregel tot tijdelijke doorhaling van de inschrijving in
      het accountantsregister tot vijf jaar na het einde van de maatregel in het accountantsregister vermeld.

      5 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over het accountantsregister.


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel41
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0032573
        artikel: '41'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: '37'
    text: |-
      1 Aan een ieder wordt kosteloos inzage verleend in het accountantsregister. De beroepsorganisatie verstrekt aan een
      ieder desgevraagd, tegen betaling van de kostprijs, een afschrift uit het accountantsregister.

      2 Afschriften uit het accountantsregister worden kosteloos verstrekt aan het Rijk, de provincies en de gemeenten,
      alsmede aan andere publiekrechtelijke lichamen binnen Nederland en de Europese Unie.

      3 Het ter inzage gelegde accountantsregister of het afschrift uit het accountantsregister bevat de gegevens,
      bedoeld in [artikel 36, tweede lid][ref1], uitgezonderd onderdeel d.


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel36
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel37
