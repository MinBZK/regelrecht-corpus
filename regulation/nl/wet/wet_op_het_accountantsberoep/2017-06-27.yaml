  - number: '51'
    text: |-
      1 De commissie heeft ten hoogste acht leden waaronder de voorzitter.

      2 Benoeming van de leden geschiedt voor een periode van ten hoogste vijf jaar. Bij de benoeming bepaalt Onze
      Minister wie de voorzitter is. De leden zijn eenmaal herbenoembaar.

      3 Schorsing en ontslag vinden slechts plaats wegens ongeschiktheid of onbekwaamheid voor de vervulde functie dan
      wel wegens andere zwaarwegende in de persoon van de betrokkene gelegen redenen. Ontslag vindt voorts plaats op
      eigen verzoek.
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel51
  - number: '52'
    text: |-
      1 De commissie stelt een bestuursreglement vast.

      2 In het bestuursreglement worden regels vastgesteld omtrent het aanvaarden van een nevenfunctie anders dan uit
      hoofde van het lidmaatschap van de commissie.
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel52
  - number: '53'
    text: |-
      1 De commissie brengt jaarlijks de kosten van de werkzaamheden die zij verricht in verband met de uitoefening van
      haar taak op grond van deze wet in rekening bij de beroepsorganisatie, voor zover deze kosten niet ten laste komen
      van de Rijksbegroting.

      2 De kosten worden gebaseerd op de begroting waarmee Onze Minister heeft ingestemd. Alvorens de begroting aan Onze
      Minister wordt voorgelegd stelt de commissie het bestuur van de beroepsorganisatie ten minste drie weken in de
      gelegenheid, een zienswijze te geven over het ontwerp van begroting. Een uitgebrachte zienswijze wordt meegezonden
      met de begroting aan Onze Minister.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel53
  - number: '54'
    text: |-
      1 De commissie geeft een verklaring van vakbekwaamheid af aan degene die:

      a. beschikt over een bewijsstuk waaruit blijkt dat hij als wettelijke auditor als bedoeld in artikel 2, onderdeel
      2, van [richtlijn 2006/43/EG](32006L0043) van het Europees Parlement en de Raad van 17 mei 2006, betreffende
      de wettelijke controles van jaarrekeningen en geconsolideerde jaarrekeningen, tot wijziging van de [Richtlijnen
      78/660/EEG](31978L0660) en [83/349/EEG](31983L0349) van de Raad en houdende intrekking van [Richtlijn 84/253/
      EEG](31984L0253) van de Raad (PbEU 2006, L 157/87), is toegelaten tot het verrichten van controles als bedoeld
      in artikel 2, onderdeel 1, van voornoemde richtlijn, in een andere lidstaat van de Europese Unie of in een andere
      staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte; of

      b. beschikt over een in een ander land dan genoemd in onderdeel a, verkregen diploma of soortgelijk bewijsstuk,
      waaruit naar het oordeel van de commissie eenzelfde niveau van vakbekwaamheid blijkt als in Nederland, welke blijkt
      uit het met goed gevolg hebben voltooid van de opleiding tot accountant; en

      c. met goed gevolg een examen heeft afgelegd waarbij de kennis van de betrokkene van het Nederlandse recht wordt
      getoetst; en

      d. met goed gevolg een examen heeft afgelegd waarbij de kennis van de betrokkene van de voor de accountants
      geldende gedrags- en beroepsregels wordt getoetst.

      2 De verklaring is gericht op inschrijving in het accountantsregister als Registeraccountant
      dan wel Accountants-Administratieconsulent, of in het openbaar register, bedoeld in
      [artikel 11, eerste lid, van de Wet toezicht accountantsorganisaties][ref1] als externe accountant die een
      wettelijke auditor is als bedoeld in [artikel 27 van die wet][ref2] afhankelijk van de bevoegdheden die in het
      buitenland aan het bewijsstuk verbonden zijn en, indien het een diploma of soortgelijk bewijsstuk als bedoeld in
      het eerste lid, onderdeel b betreft, de eindtermen die daaraan ten grondslag liggen.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het examen, bedoeld in het
      eerste lid, onderdeel c.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel27
