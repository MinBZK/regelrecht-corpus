      De [Wet op de Registeraccountants][ref1], de [Wet op de Accountants-Administratieconsulenten][ref2] en de daarop
      berustende bepalingen, blijven van kracht op handelingen en gedragingen van natuurlijke en rechtspersonen, die
      hebben plaatsgevonden voorafgaand aan het intrekken of vervallen van die bepalingen.


