  - number: '44'
    text: |-
      Het bestuur draagt zorg voor het bekendmaken van elke doorhaling van een inschrijving in het accountantsregister.
      Dit geschiedt in ieder geval, voor zover mogelijk, door een mededeling aan de betrokkene en een elektronische
      publicatie.
    url: https://wetten.overheid.nl/BWBR0032573/2017-06-27#Artikel44
  - number: '45'
    text: |-
      1 Hij die ingeschreven is geweest, wordt bij een aanvraag tot herinschrijving geacht te voldoen aan
      [artikel 38, tweede lid, onderdeel a][ref1].

      2 Indien de inschrijving is doorgehaald op grond van [artikel 43, eerste lid, onderdeel c][ref2], is
      herinschrijving mogelijk wanneer de aanvrager het bewijs overlegt, dat deze grond heeft opgehouden te bestaan.

      3 Indien de inschrijving is doorgehaald ter uitvoering van een tuchtrechtelijke maatregel is herinschrijving niet
      mogelijk gedurende de termijn waarvoor de tuchtrechtelijke maatregel is opgelegd.

      4 Indien de inschrijving is doorgehaald op grond van [artikel 43, eerste lid, onderdeel f][ref3], is inschrijving
      weer mogelijk nadat de aanvrager de verschuldigde bijdragen alsnog heeft betaald, alsmede de kosten voor de
      invordering en de wettelijke rente.


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0032573#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0032573#Artikel43
