preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het met het oog op een betere aanwending van de voor de gezondheidszorg
    beschikbare middelen en met het oog op het beheersen van de kosten van de gezondheidszorg noodzakelijk is in de
    Wet ziekenhuisvoorzieningen enige bepalingen op te nemen die het mogelijk maken de totstandkoming van plannen voor
    ziekenhuizen te bevorderen en ten aanzien van de ziekenhuizen, naast sluiting, enige minder ingrijpende maatregelen
    te treffen teneinde de capaciteit van de ziekenhuizen met die plannen in overeenstemming te kunnen brengen, alsmede
    enige daarmee verband houdende wijzigingen aan te brengen in de Ziekenfondswet en de Algemene Wet Bijzondere
    Ziektekosten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005069/1991-06-13#ArtikelAanhef
articles:
  - number: IV
    text: |-
      De beslissing op een verzoek tot uitbreiding van het aantal bedden, functie-eenheden of medische specialismen
      in ziekenhuizen, ingediend na 28 juni 1989, kan in afwijking van andersluidende wettelijke bepalingen worden
      aangehouden tot uiterlijk zes maanden na het tijdstip waarop deze wet in werking treedt.
    url: https://wetten.overheid.nl/BWBR0005069/1991-06-13#ArtikelIV
  - number: V
    text: |-
      Deze wet treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin zij
      wordt geplaatst, en werkt voor wat betreft [artikel IV][ref1] terug tot en met 28 juni 1989.


      [ref1]: https://wetten.overheid.nl/BWBR0005069#ArtikelIV
    url: https://wetten.overheid.nl/BWBR0005069/1991-06-13#ArtikelV
    references:
      - id: ref1
        bwb_id: BWBR0005069
        artikel: IV
  - number: VI
    text: Deze wet kan worden aangehaald als Wet versterking Wzv-instrumentarium.
    url: https://wetten.overheid.nl/BWBR0005069/1991-06-13#ArtikelVI
