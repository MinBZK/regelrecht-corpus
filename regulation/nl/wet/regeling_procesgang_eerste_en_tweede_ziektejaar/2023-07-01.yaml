articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0013540/2023-07-01#Artikel1
  - number: 1.a
    text: |-
      *Arbodienst:* een dienst als bedoeld in de [Arbeidsomstandighedenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010346
    url: https://wetten.overheid.nl/BWBR0013540/2023-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010346
  - number: 1.b
    text: |-
      *bedrijfsarts:* de persoon, bedoeld in [artikel 14, eerste lid, van de Arbeidsomstandighedenwet][ref1] die belast
      is met de advisering, bedoeld in [artikel 14, eerste lid, onderdeel b, van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel14
    url: https://wetten.overheid.nl/BWBR0013540/2023-07-01#Artikel1
    references:
