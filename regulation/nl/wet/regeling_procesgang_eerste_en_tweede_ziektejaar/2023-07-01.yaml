  - number: 1.e
    text: |-
      *werknemer:* een werknemer als bedoeld in [artikel 71a van de Wet op de arbeidsongeschiktheidsverzekering][ref1] en
      de verzekerde, bedoeld in [artikel 25, eerste lid, van de Wet Werk en inkomen naar arbeidsvermogen][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel25
    url: https://wetten.overheid.nl/BWBR0013540/2023-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '25'
  - number: 1.f
    text: '*UWV:* het Uitvoeringsinstituut werknemersverzekeringen.'
    url: https://wetten.overheid.nl/BWBR0013540/2023-07-01#Artikel1
  - number: '2.1'
    text: |-
      De werkgever verstrekt aan de bedrijfsarts of de arbodienst tijdig alle noodzakelijke gegevens met betrekking tot
      het ziekteverzuim van zijn werknemers, teneinde de bedrijfsarts of arbodienst in staat te stellen de advisering,
      bedoeld in [artikel 14, eerste lid, onderdeel b, van de Arbeidsomstandighedenwet][ref1] en in deze regeling, naar
      behoren te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
    url: https://wetten.overheid.nl/BWBR0013540/2023-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
  - number: '2.2'
    text: |-
      De werkgever verlangt indien er naar de verwachting van de bedrijfsarts of de arbodienst sprake is van dreigend
      langdurig ziekteverzuim, binnen zes weken na de eerste dag van ongeschiktheid tot het verrichten van arbeid een
      oordeel van de bedrijfsarts of de arbodienst over het desbetreffende ziektegeval.
    url: https://wetten.overheid.nl/BWBR0013540/2023-07-01#Artikel2
  - number: '2.3'
    text: |-
      De werkgever verlangt onverwijld een oordeel van de bedrijfsarts of de arbodienst als bedoeld in het tweede lid
      indien eerst na zes weken blijkt dat het ziekteverzuim naar de verwachting van de bedrijfsarts of de arbodienst
      langdurig dreigt te zijn.
    url: https://wetten.overheid.nl/BWBR0013540/2023-07-01#Artikel2
  - number: '3'
    text: |-
      Indien er op enig moment gedurende de ziekte van de werknemer naar de verwachting van de bedrijfsarts
      of de arbodienst sprake is van dreigend langdurig ziekteverzuim houdt de werkgever aantekening als
      bedoeld in [artikel 71a, eerste lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1] of
      [artikel 25, eerste lid, van de Wet Werk en inkomen naar arbeidsvermogen][ref2] en legt hij in ieder geval alle
      gegevens, documenten en correspondentie vast die betrekking hebben op het verloop van het ziekteverzuim, het aantal
      feitelijk gewerkte uren, en de op grond van deze regeling ondernomen activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel25
    url: https://wetten.overheid.nl/BWBR0013540/2023-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '25'
  - number: '4.1'
    text: |-
      Indien uit het oordeel van de bedrijfsarts of de arbodienst, bedoeld in [artikel 2, tweede of derde lid][ref1],
      blijkt dat er nog mogelijkheden zijn om de terugkeer naar arbeid van de werknemer te bevorderen, stelt de werkgever
      in overeenstemming met de werknemer, binnen twee weken na het oordeel een plan van aanpak op.


      [ref1]: https://wetten.overheid.nl/BWBR0013540#Artikel2
    url: https://wetten.overheid.nl/BWBR0013540/2023-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013540
        artikel: '2'
  - number: '4.2'
    text: 'Het plan van aanpak, bedoeld in het eerste lid, omvat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0013540/2023-07-01#Artikel4
  - number: 4.2.a
    text: |-
      de door de werkgever en de werknemer te ondernemen activiteiten gericht op inschakeling in de arbeid, de daarmee te
      bereiken doelstellingen, de termijnen waarbinnen die doelstellingen naar verwachting kunnen worden bereikt, alsmede
      de visie van de werkgever en de werknemer hierop;
    url: https://wetten.overheid.nl/BWBR0013540/2023-07-01#Artikel4
  - number: 4.2.b
    text: |-
      afspraken omtrent de momenten waarop de in het plan van aanpak overeengekomen activiteiten door de werkgever en
      de werknemer worden geëvalueerd, die evaluatie vindt periodiek, en in ieder geval aan het einde van het eerste
      ziektejaar plaats, en omvat de visie van de werkgever en de werknemer hierop; en
    url: https://wetten.overheid.nl/BWBR0013540/2023-07-01#Artikel4
  - number: 4.2.c
    text: |-
      aanwijzing van een persoon die de overeengekomen activiteiten begeleidt en het contact verzorgt tussen werknemer,
      werkgever en bedrijfsarts of arbodienst.
    url: https://wetten.overheid.nl/BWBR0013540/2023-07-01#Artikel4
  - number: '4.3'
    text: |-
      Het plan van aanpak wordt schriftelijk vastgelegd. De werkgever verstrekt hiervan onverwijld een afschrift aan de
      werknemer, de in het tweede lid, onderdeel c, bedoelde persoon en de bedrijfsarts of de arbodienst.
    url: https://wetten.overheid.nl/BWBR0013540/2023-07-01#Artikel4
  - number: '4.4'
    text: |-
      De werkgever draagt er zorg voor dat de bedrijfsarts of de arbodienst de werknemer regelmatig hoort over het
      verloop van de ongeschiktheid tot het verrichten van arbeid en verlangt indien het verloop van de ongeschiktheid
      naar het oordeel van de bedrijfsarts of de arbodienst bijstelling van het plan van aanpak noodzakelijk maakt,
      hieromtrent onverwijld advies van de bedrijfsarts of de arbodienst aan zichzelf en de werknemer.
    url: https://wetten.overheid.nl/BWBR0013540/2023-07-01#Artikel4
  - number: '4.5'
    text: |-
      Het plan van aanpak wordt bijgesteld indien de evaluatie van dat plan van aanpak of het in het vierde lid bedoeld
      advies van de bedrijfsarts of de arbodienst daartoe aanleiding geeft. Het eerste tot en met derde lid zijn van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0013540/2023-07-01#Artikel4
  - number: '5'
    text: |-
      Van de termijnen, bedoeld in [artikel 2][ref1] en [4][ref2], kan door de werkgever en de werknemer gemotiveerd
      worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0013540#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013540#Artikel4
    url: https://wetten.overheid.nl/BWBR0013540/2023-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013540
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0013540
        artikel: '4'
  - number: '6.1'
    text: |-
      Het reïntegratieverslag, bedoeld in [artikel 71a, derde lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1]
      en [artikel 25, derde lid, van de Wet Werk en inkomen naar arbeidsvermogen][ref2] bevat in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel25
    url: https://wetten.overheid.nl/BWBR0013540/2023-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '25'
  - number: 6.1.a
    text: de noodzakelijke administratieve gegevens van de werknemer, werkgever en bedrijfsarts of arbodienst;
    url: https://wetten.overheid.nl/BWBR0013540/2023-07-01#Artikel6
  - number: 6.1.b
    text: gegevens omtrent de aard van het bedrijf van de werkgever;
    url: https://wetten.overheid.nl/BWBR0013540/2023-07-01#Artikel6
  - number: 6.1.c
    text: gegevens omtrent de functie van de werknemer;
    url: https://wetten.overheid.nl/BWBR0013540/2023-07-01#Artikel6
  - number: 6.1.d
    text: gegevens omtrent de bekwaamheden van de werknemer;
    url: https://wetten.overheid.nl/BWBR0013540/2023-07-01#Artikel6
  - number: 6.1.e
    text: vermelding van de eerste dag van ongeschiktheid tot het verrichten van arbeid wegens ziekte;
    url: https://wetten.overheid.nl/BWBR0013540/2023-07-01#Artikel6
  - number: 6.1.f
    text: |-
      het oordeel en het advies van de bedrijfsarts of de arbodienst, bedoeld in [artikel 2, tweede en derde lid][ref1],
      respectievelijk [artikel 4, vierde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0013540#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013540#Artikel4
    url: https://wetten.overheid.nl/BWBR0013540/2023-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013540
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0013540
        artikel: '4'
  - number: 6.1.g
    text: |-
      het door de werkgever en de werknemer overeengekomen plan van aanpak en de bijstellingen, bedoeld in
      [artikel 4, vijfde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013540#Artikel4
    url: https://wetten.overheid.nl/BWBR0013540/2023-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013540
        artikel: '4'
  - number: 6.1.h
    text: |-
      de evaluatie aan het einde van het eerste ziektejaar, bedoeld in [artikel 4, tweede lid, onderdeel b][ref1],
      alsmede de meest recente evaluatie van de voortgang en de uitvoering van de in het plan van aanpak gemaakte
      afspraken;


      [ref1]: https://wetten.overheid.nl/BWBR0013540#Artikel4
    url: https://wetten.overheid.nl/BWBR0013540/2023-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013540
        artikel: '4'
  - number: 6.1.i
    text: een actueel oordeel over de kwaliteit van de arbeidsrelatie door de werkgever en de bedrijfsarts of de arbodienst;
    url: https://wetten.overheid.nl/BWBR0013540/2023-07-01#Artikel6
  - number: 6.1.j
    text: |-
      een actueel oordeel van de bedrijfsarts of de arbodienst over het verloop van de ongeschiktheid tot werken, de
      functionele beperkingen en mogelijkheden van de werknemer tot het verrichten van arbeid;
    url: https://wetten.overheid.nl/BWBR0013540/2023-07-01#Artikel6
  - number: 6.1.k
    text: |-
      een actueel oordeel van de bedrijfsarts of de arbodienst en de werkgever over de aanwezigheid van passende arbeid
      bij de werkgever, en
    url: https://wetten.overheid.nl/BWBR0013540/2023-07-01#Artikel6
  - number: 6.1.l
    text: een oordeel van de werknemer omtrent de op grond van de onderdelen a tot en met k opgenomen gegevens en oordelen.
    url: https://wetten.overheid.nl/BWBR0013540/2023-07-01#Artikel6
  - number: '6.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing met betrekking tot het reïntegratieverslag, bedoeld in
      [artikel 38, tweede lid, Ziektewet][ref1], voor zover dit gezien de resterende duur van het dienstverband gerekend
      vanaf de eerste dag van ongeschiktheid tot werken redelijkerwijs te verlangen is.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel38
    url: https://wetten.overheid.nl/BWBR0013540/2023-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '38'
  - number: '7'
    text: |-
      Het UWV is bevoegd voor de vastlegging van de in [artikel 6, onderdeel j][ref1], bedoelde gegevens standaarden vast
      te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0013540#Artikel6
    url: https://wetten.overheid.nl/BWBR0013540/2023-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0013540
        artikel: '6'
  - number: 7a
    text: |-
      Indien voor een goede uitvoering van deze regeling naar het oordeel van de bedrijfsarts of de arbodienst
      aanvullende deskundigheid is vereist, draagt de bedrijfsarts of de arbodienst zorg voor tijdige inschakeling
      daarvan.
    url: https://wetten.overheid.nl/BWBR0013540/2023-07-01#Artikel7a
  - number: 7b.1
    text: |-
      [Artikel 4, tweede lid, onderdelen a en b][ref1], van deze regeling, zoals dat luidde voor inwerkingtreding
      van artikel I, onderdeel A, van de Regeling van de Minister van Sociale Zaken en Werkgelegenheid van 9 mei 2023
      tot wijziging van de Regeling procesgang eerste en tweede ziektejaar en de Regeling procesgang eerste en tweede
      ziektejaar voor vangnetters zonder werkgever in verband met regels over de re-integratievisie en een enkele andere
      wijziging blijft van toepassing voor werknemers van wie de eerste ziektedag is gelegen voor 1 juli 2023, indien het
      plan van aanpak en de eerstejaarsevaluatie niet na deze datum zijn opgesteld of bijgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0013540#Artikel4
    url: https://wetten.overheid.nl/BWBR0013540/2023-07-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0013540
        artikel: '4'
  - number: 7b.2
    text: Dit artikel vervalt met ingang van 1 juli 2025.
    url: https://wetten.overheid.nl/BWBR0013540/2023-07-01#Artikel7b
  - number: '8'
    text: |-
      Deze regeling is mede gebaseerd op [artikel 38, zesde lid, van de Ziektewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel38
    url: https://wetten.overheid.nl/BWBR0013540/2023-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '38'
  - number: '9'
    text: 'Deze regeling wordt aangehaald als: Regeling procesgang eerste en tweede ziektejaar.'
    url: https://wetten.overheid.nl/BWBR0013540/2023-07-01#Artikel9
