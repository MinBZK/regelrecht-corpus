    text: |-
      *werkgever:* een werkgever als bedoeld in
      [artikel 71a van de Wet op de arbeidsongeschiktheidsverzekering][ref1]__REF001_____________________________________
      __________________________________;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel25
    url: https://wetten.overheid.nl/BWBR0013540/2023-07-01#Artikel1
