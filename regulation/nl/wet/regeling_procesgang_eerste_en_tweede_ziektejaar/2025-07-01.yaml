  - number: '5'
    text: |-
      Van de termijnen, bedoeld in [artikel 2][ref1] en [4][ref2], kan door de werkgever en de werknemer gemotiveerd
      worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0013540#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013540#Artikel4
