  - number: '2'
    text: |-
      1 De werkgever verstrekt aan de bedrijfsarts of de arbodienst tijdig alle noodzakelijke gegevens met betrekking tot
      het ziekteverzuim van zijn werknemers, teneinde de bedrijfsarts of arbodienst in staat te stellen de advisering,
      bedoeld in [artikel 14, eerste lid, onderdeel b, van de Arbeidsomstandighedenwet][ref1] en in deze regeling, naar
      behoren te verrichten.

      2 De werkgever verlangt indien er naar de verwachting van de bedrijfsarts of de arbodienst sprake is van dreigend
      langdurig ziekteverzuim, binnen zes weken na de eerste dag van ongeschiktheid tot het verrichten van arbeid een
      oordeel van de bedrijfsarts of de arbodienst over het desbetreffende ziektegeval.

      3 De werkgever verlangt onverwijld een oordeel van de bedrijfsarts of de arbodienst als bedoeld in het tweede lid
      indien eerst na zes weken blijkt dat het ziekteverzuim naar de verwachting van de bedrijfsarts of de arbodienst
      langdurig dreigt te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
    url: https://wetten.overheid.nl/BWBR0013540/2025-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
  - number: '3'
    text: |-
      Indien er op enig moment gedurende de ziekte van de werknemer naar de verwachting van de bedrijfsarts
      of de arbodienst sprake is van dreigend langdurig ziekteverzuim houdt de werkgever aantekening als
      bedoeld in [artikel 71a, eerste lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1] of
      [artikel 25, eerste lid, van de Wet Werk en inkomen naar arbeidsvermogen][ref2] en legt hij in ieder geval alle
      gegevens, documenten en correspondentie vast die betrekking hebben op het verloop van het ziekteverzuim, het aantal
      feitelijk gewerkte uren, en de op grond van deze regeling ondernomen activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel25
    url: https://wetten.overheid.nl/BWBR0013540/2025-07-01#Artikel3
