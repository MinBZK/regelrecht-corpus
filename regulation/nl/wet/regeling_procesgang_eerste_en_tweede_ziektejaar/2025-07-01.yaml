      - id: ref2
        bwb_id: BWBR0013540
        artikel: '4'
  - number: '6'
    text: |-
      1 Het reïntegratieverslag, bedoeld in
      [artikel 71a, derde lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1] en
      [artikel 25, derde lid, van de Wet Werk en inkomen naar arbeidsvermogen][ref2] bevat in ieder geval:

      a. de noodzakelijke administratieve gegevens van de werknemer, werkgever en bedrijfsarts of arbodienst;

      b. gegevens omtrent de aard van het bedrijf van de werkgever;

      c. gegevens omtrent de functie van de werknemer;

      d. gegevens omtrent de bekwaamheden van de werknemer;

      e. vermelding van de eerste dag van ongeschiktheid tot het verrichten van arbeid wegens ziekte;

      f. het oordeel en het advies van de bedrijfsarts of de arbodienst, bedoeld in
      [artikel 2, tweede en derde lid][ref3], respectievelijk [artikel 4, vierde lid][ref4];

      g. het door de werkgever en de werknemer overeengekomen plan van aanpak en de bijstellingen, bedoeld in
      [artikel 4, vijfde lid][ref5];

      h. de evaluatie aan het einde van het eerste ziektejaar, bedoeld in [artikel 4, tweede lid, onderdeel b][ref6],
      alsmede de meest recente evaluatie van de voortgang en de uitvoering van de in het plan van aanpak gemaakte
      afspraken;

      i. een actueel oordeel over de kwaliteit van de arbeidsrelatie door de werkgever en de bedrijfsarts of de
      arbodienst;

      j. een actueel oordeel van de bedrijfsarts of de arbodienst over het verloop van de ongeschiktheid tot werken, de
      functionele beperkingen en mogelijkheden van de werknemer tot het verrichten van arbeid;

      k. een actueel oordeel van de bedrijfsarts of de arbodienst en de werkgever over de aanwezigheid van passende
      arbeid bij de werkgever, en

      l. een oordeel van de werknemer omtrent de op grond van de onderdelen a tot en met k opgenomen gegevens en
      oordelen.

      2 Het eerste lid is van overeenkomstige toepassing met betrekking tot het reïntegratieverslag, bedoeld in
      [artikel 38, tweede lid, Ziektewet][ref7], voor zover dit gezien de resterende duur van het dienstverband gerekend
      vanaf de eerste dag van ongeschiktheid tot werken redelijkerwijs te verlangen is.


