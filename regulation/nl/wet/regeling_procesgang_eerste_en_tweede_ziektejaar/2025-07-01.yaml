        artikel: '25'
  - number: '4'
    text: |-
      1 Indien uit het oordeel van de bedrijfsarts of de arbodienst, bedoeld in [artikel 2, tweede of derde lid][ref1],
      blijkt dat er nog mogelijkheden zijn om de terugkeer naar arbeid van de werknemer te bevorderen, stelt de werkgever
      in overeenstemming met de werknemer, binnen twee weken na het oordeel een plan van aanpak op.

      2 Het plan van aanpak, bedoeld in het eerste lid, omvat in ieder geval:

      a. de door de werkgever en de werknemer te ondernemen activiteiten gericht op inschakeling in de arbeid, de daarmee
      te bereiken doelstellingen, de termijnen waarbinnen die doelstellingen naar verwachting kunnen worden bereikt,
      alsmede de visie van de werkgever en de werknemer hierop;

      b. afspraken omtrent de momenten waarop de in het plan van aanpak overeengekomen activiteiten door de werkgever
      en de werknemer worden geëvalueerd, die evaluatie vindt periodiek, en in ieder geval aan het einde van het eerste
      ziektejaar plaats, en omvat de visie van de werkgever en de werknemer hierop; en

      c. aanwijzing van een persoon die de overeengekomen activiteiten begeleidt en het contact verzorgt tussen
      werknemer, werkgever en bedrijfsarts of arbodienst.

      3 Het plan van aanpak wordt schriftelijk vastgelegd. De werkgever verstrekt hiervan onverwijld een afschrift aan de
      werknemer, de in het tweede lid, onderdeel c, bedoelde persoon en de bedrijfsarts of de arbodienst.

      4 De werkgever draagt er zorg voor dat de bedrijfsarts of de arbodienst de werknemer regelmatig hoort over het
      verloop van de ongeschiktheid tot het verrichten van arbeid en verlangt indien het verloop van de ongeschiktheid
      naar het oordeel van de bedrijfsarts of de arbodienst bijstelling van het plan van aanpak noodzakelijk maakt,
      hieromtrent onverwijld advies van de bedrijfsarts of de arbodienst aan zichzelf en de werknemer.

      5 Het plan van aanpak wordt bijgesteld indien de evaluatie van dat plan van aanpak of het in het vierde lid bedoeld
      advies van de bedrijfsarts of de arbodienst daartoe aanleiding geeft. Het eerste tot en met derde lid zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013540#Artikel2
    url: https://wetten.overheid.nl/BWBR0013540/2025-07-01#Artikel4
