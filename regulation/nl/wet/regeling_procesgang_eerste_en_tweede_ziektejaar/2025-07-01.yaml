    Gelet op artikel 71a, tweede lid en zevende lid, van de Wet op de arbeidsongeschiktheidsverzekering,

    Besluit:
  url: https://wetten.overheid.nl/BWBR0013540/2025-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *Arbodienst:*

      een dienst als bedoeld in de [Arbeidsomstandighedenwet][ref1];

      b. *bedrijfsarts:*

      de persoon, bedoeld in [artikel 14, eerste lid, van de Arbeidsomstandighedenwet][ref2] die belast is met de
      advisering, bedoeld in [artikel 14, eerste lid, onderdeel b, van die wet][ref3];

      c. *plan van aanpak:*

      het plan van aanpak, bedoeld in
      [artikel 71a, tweede lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref4]__REF001________________________
      _______________________________________________;

      d. *werkgever:*

      een werkgever als bedoeld in
      [artikel 71a van de Wet op de arbeidsongeschiktheidsverzekering][ref6]__REF001_____________________________________
      __________________________________;

      e. *werknemer:*

      een werknemer als bedoeld in [artikel 71a van de Wet op de arbeidsongeschiktheidsverzekering][ref8] en de
      verzekerde, bedoeld in [artikel 25, eerste lid, van de Wet Werk en inkomen naar arbeidsvermogen][ref9];

      f. *UWV:*

      het Uitvoeringsinstituut werknemersverzekeringen.


