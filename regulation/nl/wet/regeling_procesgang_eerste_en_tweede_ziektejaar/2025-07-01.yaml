  - number: 7a
    text: |-
      Indien voor een goede uitvoering van deze regeling naar het oordeel van de bedrijfsarts of de arbodienst
      aanvullende deskundigheid is vereist, draagt de bedrijfsarts of de arbodienst zorg voor tijdige inschakeling
      daarvan.
    url: https://wetten.overheid.nl/BWBR0013540/2025-07-01#Artikel7a
