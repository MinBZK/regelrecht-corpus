$id: besluit_tarief_justitiekosten_strafzaken_bes
regulatory_layer: WET
publication_date: '2010-10-01'
valid_from: '2010-10-10'
bwb_id: BWBR0028534
url: https://wetten.overheid.nl/BWBR0028534/2010-10-10
articles:
  - number: '1'
    text: |-
      1 De bepalingen van dit besluit zijn van toepassing op de kosten die in verband met de behandeling van strafzaken
      moeten worden gemaakt en de kosten die moeten worden gemaakt in zaken, waarin het openbaar ministerie optreedt en
      waarvan de burgerlijke rechter kennis neemt.

      2 Dit besluit berust op [artikel 59 van de Rijkswet Gemeenschappelijk Hof van Justitie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028070#Artikel59
    url: https://wetten.overheid.nl/BWBR0028534/2010-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028070
        artikel: '59'
  - number: '2'
    text: |-
      1 Aan getuigen, deskundigen en tolken worden de werkelijke reiskosten vergoed, voorzover hun geen reisbiljet ’s
      Rijkswege werd verstrekt.

      2 De reiskosten worden berekend op basis van de reiskosten die worden vergoed aan ambtenaren die recht hebben
      op vervoer per tweede klasse vervoermiddelen. In bijzondere gevallen kan de procureur-generaal toestaan, dat een
      getuige, deskundige of tolk gebruik maakt van de eerste klasse van een vervoermiddel.

      3 Voor de berekening van de reiskosten van getuigen, deskundigen en tolken, wordt de plaats van het hoofdverblijf
      als uitgangspunt genomen. De tijdelijke verblijfplaats kan tot uitgangspunt worden genomen, indien de getuige,
      deskundige of tolk zich buiten zijn hoofdverblijf ophoudt.
    url: https://wetten.overheid.nl/BWBR0028534/2010-10-10#Artikel2
  - number: '3'
    text: |-
      1 Aan getuigen, deskundigen en tolken worden zo nodig verblijfkosten vergoed, berekend op basis van de
      verblijfkosten, die toegekend worden aan ambtenaren, gerangschikt in de tweede klasse.

      2 In bijzondere gevallen kan de procureur-generaal toestaan, dat een getuige, deskundige of tolk wat de vergoeding
      van verblijfkosten betreft zal worden gelijkgesteld met een ambtenaar, gerangschikt in de eerste klasse.
    url: https://wetten.overheid.nl/BWBR0028534/2010-10-10#Artikel3
  - number: '4'
    text: |-
      Indien een getuige, deskundige of tolk de reis- en verblijfkosten niet kan voorschieten, kan het openbaar
      ministerie de opgeroepene in zijn verblijfplaats een reisbiljet verstrekken. Het openbaar ministerie kan de
      betaling van de verblijfkosten van de opgeroepene rechtstreeks aan de hotel-, logement- of pensionhouder voldoen.
    url: https://wetten.overheid.nl/BWBR0028534/2010-10-10#Artikel4
  - number: '5'
    text: |-
      Als een getuige, deskundige of tolk die in het buitenland verblijft, zijn overkomst afhankelijk stelt van een
      andere of hogere schadeloosstelling dan voorzien in dit besluit, wordt de schadeloosstelling vooraf geregeld na
      bekomen machtiging van Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0028534/2010-10-10#Artikel5
  - number: '6'
    text: |-
      1 Aan geneeskundigen en psychologen is verschuldigd:

      a. voor het verlenen van eerste hulp aan een gewonde, inclusief verbandmiddelen en verklaring ten behoeve van de
      justitie USD 13,97;

      b. voor ieder nader onderzoek, inclusief verklaring ten behoeve van de justitie 13,97;

      c. voor een onderzoek door een specialist, inclusief uitgebreid wetenschappelijk rapport ten behoeve van de
      justitie USD 27,93;

      d. voor het constateren van de dood, inclusief verklaring, mede betreffende de vermoedelijke doodsoorzaak, ten
      behoeve van de justitie 19,55;

      e. voor lijkopeningen, teneinde de oorzaak van de dood vast te stellen, inclusief histologisch onderzoek en
      bijbehorend rapport ten behoeve der justitie 167,60;

      f. voor het onderzoek naar de toestand van personen, die vermoed worden krankzinnig te zijn, inclusief zo nodig
      verklaring tot opname in een inrichting tot verpleging van geesteszieken 19,55;

      g. voor het eerste onderzoek naar de zielstoestand van verdachten of beklaagden, inclusief verslag ten behoeve van
      de justitie USD 27,93;

      h. voor ieder nader verslag betreffende de zielstoestand van verdachten of beklaagden USD 27,93;

      i. het op verzoek van de justitie afgeven van een kort praktisch rapport met toegelichte conclusie niet vallende
      onder verrichtingen a tot en met h:

      huisarts USD 11,17;

      specialist USD 16,76;

      j. het op verzoek van de justitie afgeven van een uitvoerig wetenschappelijk rapport, niet vallende onder de
      verrichtingen a tot en met h:

      huisarts USD 5,59;

      specialist USD 41,90.

      2 In bijzondere gevallen kan Onze Minister van Justitie een hoger bedrag toekennen ter zake van verrichtingen als
      in het voorgaande lid bedoeld.

      3 Wanneer de in het eerste lid onder a tot en met f bedoelde verrichtingen geheel of gedeeltelijk plaats vinden
      tussen 22.00 en 06.00 uur wordt de vergoeding verdubbeld.
    url: https://wetten.overheid.nl/BWBR0028534/2010-10-10#Artikel6
  - number: '7'
    text: |-
      Geneeskundigen en psychologen, die een inkomen uit ’s Rijks kas genieten, zijn uitgesloten van het genot der
      vergoedingen als bedoeld in [artikel 6][ref1], tenzij bij ministeriële regeling anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028534#Artikel6
    url: https://wetten.overheid.nl/BWBR0028534/2010-10-10#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028534
        artikel: '6'
  - number: '8'
    text: |-
      Voor verdere behandeling na het verlenen van eerste hulp en na het instellen van een nader onderzoek op verzoek
      van de justitie, wordt geen vergoeding uit ’s Rijks kas verleend. Evenmin wordt het honorarium bedoeld in
      [artikel 6][ref1] gelijktijdig genoten met vacantiegelden.


      [ref1]: https://wetten.overheid.nl/BWBR0028534#Artikel6
    url: https://wetten.overheid.nl/BWBR0028534/2010-10-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028534
        artikel: '6'
  - number: 8a
    text: |-
      1 De Procureur-Generaal kan voor het duiken naar drenkelingen of lijken een redelijke schadeloosstelling toekennen
      tot een maximum van USD 27,93 per uur;

      2 Onder «duiken» wordt in dit artikel verstaan de tijd gedurende welke de duiker zich in het water heeft bevonden.
    url: https://wetten.overheid.nl/BWBR0028534/2010-10-10#Artikel8a
  - number: '9'
    text: |-
      De kosten wegens justitiële onderzoeken in verband met de mogelijkheid van een gepleegd misdrijf, zoals
      lijkschouwingen, het opgraven en weer begraven van lijken en het duiken naar drenkelingen of lijken worden gerekend
      tot de gerechtskosten in strafzaken.
    url: https://wetten.overheid.nl/BWBR0028534/2010-10-10#Artikel9
  - number: '10'
    text: |-
      1 Voor andere verrichtingen dan die, genoemd in [artikel 6][ref1], is aan deskundigen en tolken verschuldigd een
      vergoeding naar reden van USD 11,17 per uur, en een naar die maatstaf te berekenen beloning voor het afgeven van
      schriftelijke verklaringen.

      2 Aan personen in bezoldigde rijksdienst wordt geen beloning toegekend wegens verrichtingen ten behoeve van de
      justitie als deskundige, tolk of voor het duiken naar drenkelingen of lijken indien de verrichtingen in diensttijd
      hebben plaats gehad, tenzij bij ministeriële regeling anders wordt bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028534#Artikel6
    url: https://wetten.overheid.nl/BWBR0028534/2010-10-10#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0028534
        artikel: '6'
  - number: '11'
    text: |-
      Voor schriftelijke vertalingen is verschuldigd voor elke bladzijde van vijf en twintig regels, elke regel van
      twaalf tot veertien lettergrepen, USD 13,97.
    url: https://wetten.overheid.nl/BWBR0028534/2010-10-10#Artikel11
  - number: '12'
    text: |-
      De uitgaven voor benodigdheden, die zijn aangekocht voor een onderzoek, worden terugbetaald op gespecificeerde
      rekeningen, tenzij de deskundige de benodigdheden voor verder gebruik wil behouden.
    url: https://wetten.overheid.nl/BWBR0028534/2010-10-10#Artikel12
  - number: '13'
    text: |-
      1 De rechter kan aan getuigen wegens tijdverlies een redelijke schadeloosstelling toekennen tot een maximum van USD
      11,17 per uur.

      2 Aan begeleiders van getuigen, die zich door ziekte of lichaamsgebreken of op grond van hun leeftijd noodzakelijk
      moeten laten vergezellen, kan de rechter eveneens een schadeloosstelling als in het eerste lid van dit artikel
      bedoeld toekennen.
    url: https://wetten.overheid.nl/BWBR0028534/2010-10-10#Artikel13
  - number: '14'
    text: |-
      Voor de bewaring en het noodzakelijke onderhoud van in beslag genomen of verzegelde zaken worden vergoed de
      werkelijk gemaakte kosten, waaronder begrepen het arbeidsloon, vermeerderd met een bewaarloon van USD 3,35 per dag.
    url: https://wetten.overheid.nl/BWBR0028534/2010-10-10#Artikel14
  - number: '15'
    text: |-
      De kosten van uitlevering en van rogatoire commissies worden zoveel mogelijk berekend op de voet van dit tarief,
      met dien verstande dat uit te leveren misdadigers zoveel mogelijk per goedkoopste gelegenheid worden vervoerd.
    url: https://wetten.overheid.nl/BWBR0028534/2010-10-10#Artikel15
  - number: '16'
    text: |-
      1 Voor elke door de deurwaarder uitgebrachte dagvaarding, oproeping, betekening of kennisgeving wordt hem het
      bedrag van USD 4,19 toegekend.

      2 Wegens schrijfloon wordt geen afzonderlijke vergoeding toegekend.
    url: https://wetten.overheid.nl/BWBR0028534/2010-10-10#Artikel16
  - number: '17'
    text: |-
      Voor verkoop van inbeslaggenomen zaken wordt aan de deurwaarders 2% van de bruto opbrengst toegekend met een
      minimum van USD 2,24.
    url: https://wetten.overheid.nl/BWBR0028534/2010-10-10#Artikel17
  - number: '18'
    text: |-
      Voor de medebrenging van verdachten, beklaagden, tolken, deskundigen of getuigen ter uitvoering van een
      rechterlijk bevel dan wel overbrenging op rechterlijk bevel van verdachten, beklaagden of veroordeelden wordt aan
      de deurwaarder een bedrag van USD 6,99 toegekend. Het exploot van betekening en het afschrift van het bevel of
      rechterlijke beslissing zijn in dit bedrag begrepen.
    url: https://wetten.overheid.nl/BWBR0028534/2010-10-10#Artikel18
  - number: '19'
    text: |-
      1 Voor het proces-verbaal van nasporing bedoeld bij artikel 96 van het Wetboek van Strafvordering BES, ingeval de
      beklaagde niet krachtens het tegen hem uitgevaardigde bevel van gevangenneming kan worden gevat, de betekening en
      afschrift van het bevel daaronder begrepen, wordt aan de deurwaarder toegekend USD 3,35.

      2 Voor iedere persoon in een en dezelfde zaak zal slechts één proces-verbaal van nasporing in rekening worden
      gebracht.
    url: https://wetten.overheid.nl/BWBR0028534/2010-10-10#Artikel19
  - number: '20'
    text: |-
      Voor gevangenneming wordt geen vergoeding toegekend, indien de aan te houden personen zich reeds in de macht der
      justitie of politie bevinden of zich vrijwillig aanmelden.
    url: https://wetten.overheid.nl/BWBR0028534/2010-10-10#Artikel20
  - number: '21'
    text: Bij dienst ter terechtzitting wordt per afgeroepen zaak USD 0,42 vergoed.
    url: https://wetten.overheid.nl/BWBR0028534/2010-10-10#Artikel21
  - number: '22'
    text: |-
      1 De deurwaarders dienen in het begin van elke maand een declaratie in wegens hun verrichtingen gedurende de
      afgelopen maand.

      2 Aan de declaratie wordt gehecht een door de deurwaarder gedagtekende en ondertekende specificatie, waarvan het
      model in [bijlage I][ref1] van dit besluit is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028534
    url: https://wetten.overheid.nl/BWBR0028534/2010-10-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0028534
  - number: '23'
    text: |-
      De in het [vorige artikel][ref1] bedoelde stukken worden ingediend bij het openbaar ministerie bij het Gerecht in
      eerste aanleg, dat de bescheiden – na akkoordverklaring voor zover het de zaken in eerste aanleg betreft – met het
      oog op de betaalbaarstelling doorzendt aan het parket van de procureur generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0028534#Artikel22
    url: https://wetten.overheid.nl/BWBR0028534/2010-10-10#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028534
        artikel: '22'
  - number: '24'
    text: |-
      In geval van vrijspraak, niet-ontvankelijk-verklaring van het openbaar ministerie of ontslag van rechtsvervolging
      kan de rechter aan de verdachte een schadeloosstelling wegens reis- en verblijfkosten en tijdverlies toekennen,
      tenzij de artikelen 178 tot en met 182 van het Wetboek van Strafvordering BES kunnen worden toegepast.
    url: https://wetten.overheid.nl/BWBR0028534/2010-10-10#Artikel24
  - number: '25'
    text: |-
      De schadeloosstelling aan getuigen en deskundigen, die door een verdachte worden opgeroepen, komen alleen ten laste
      van ’s Rijks kas als de verdachte wordt vrijgesproken, buiten vervolging gesteld of het openbaar ministerie niet
      ontvankelijk wordt verklaard.
    url: https://wetten.overheid.nl/BWBR0028534/2010-10-10#Artikel25
  - number: '26'
    text: |-
      1 De kosten voortvloeiende uit de toepassing van dit besluit komen ten laste van ’s Rijks kas.

      2 De kosten, bedoeld in het eerste lid, worden voldaan door het parket van de procureur-generaal.

      3 De betalingen vinden plaats tegen overlegging van een verklaring, afgegeven door het openbaar ministerie of de
      rechter, zonder nadere betaalbaarstelling, ingevolge het model in [bijlage II][ref1] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0028534
    url: https://wetten.overheid.nl/BWBR0028534/2010-10-10#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0028534
  - number: '27'
    text: |-
      Het openbaar ministerie draagt zorg voor de toekenning van vergoedingen en schadeloosstellingen en de afgifte van
      reisbiljetten, voorzover een en ander niet uitdrukkelijk aan de rechter is opgedragen.
    url: https://wetten.overheid.nl/BWBR0028534/2010-10-10#Artikel27
  - number: '28'
    text: |-
      Waar in de bepalingen van dit besluit de vaststelling van vergoedingen of schadeloosstellingen aan de rechter wordt
      opgedragen, wordt bij zaken, die in hoger beroep behandeld worden, onder «rechter» verstaan de president van het
      Gemeenschappelijk Hof van Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028534/2010-10-10#Artikel28
  - number: '29'
    text: |-
      In gevallen, waarin dit besluit niet voorziet, kan de procureur-generaal uitgaven doen ten behoeve van de justitie
      mits het bedrag niet hoger is dan USD 167,60. Voor het doen van grotere uitgaven is machtiging van Onze Minister
      van Justitie vereist.
    url: https://wetten.overheid.nl/BWBR0028534/2010-10-10#Artikel29
  - number: '30'
    text: 'Dit besluit wordt aangehaald als: Besluit tarief justitiekosten strafzaken BES.'
    url: https://wetten.overheid.nl/BWBR0028534/2010-10-10#Artikel30
