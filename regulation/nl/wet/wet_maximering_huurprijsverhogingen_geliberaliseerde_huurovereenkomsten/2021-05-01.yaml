  - number: IV
    text: |-
      Deze wet treedt in werking met ingang van een bij koninklijk besluit te bepalen tijdstip, met uitzondering van de
      [artikelen IA][ref1] en [IIIA][ref2] die in werking treden drie jaar na dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0045063#ArtikelIa
