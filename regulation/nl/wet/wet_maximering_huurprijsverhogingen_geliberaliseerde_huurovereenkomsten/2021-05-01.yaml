preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de huurprijsverhogingen voor geliberaliseerde
    huurovereenkomsten te maximeren;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0045063/2021-05-01#ArtikelAanhef
articles:
  - number: IIIb
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties zendt binnen tweeënhalf jaar na inwerkingtreding van
      de [artikelen I][ref1] en [II][ref2] aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van
      deze wet in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0045063#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0045063#ArtikelII
    url: https://wetten.overheid.nl/BWBR0045063/2021-05-01#ArtikelIIIb
