preamble:
  text: |-
    Gelet op artikel 11 van het Reglement voor de Binnenvisserij 1985 (Stb. 283);

    Gehoord de Voorlopige Adviesraad voor de Binnenvisserij;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0003803/1985-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Van het bepaalde in artikel 2, eerste lid en artikel 5, eerste lid van het Reglement voor de Binnenvisserij wordt
      vrijstelling verleend voor zover het betreft het vissen met de oesterkor in het Grevelingenmeer.
    url: https://wetten.overheid.nl/BWBR0003803/1985-08-01#Artikel1
  - number: '2'
    text: |-
      De beschikking van de minister van Landbouw en Visserij van 19 november 1982, nr. J 6713 (Stcrt. 226) wordt
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003803/1985-08-01#Artikel2
  - number: '3'
    text: Deze regeling wordt bekendgemaakt in de Nederlandse Staatscourant en werkt terug tot en met 1 juni 1985.
    url: https://wetten.overheid.nl/BWBR0003803/1985-08-01#Artikel3
