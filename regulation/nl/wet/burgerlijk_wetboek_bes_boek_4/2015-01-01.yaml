articles:
  - number: 551 t/m 857
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel551_tm_857
  - number: '858'
    text: Erfopvolging heeft alleen door de dood plaats.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel858
  - number: '859'
    text: |-
      Indien verscheidene personen, van welke de een tot des anderen erfenis geroepen is, door een en hetzelfde ongeval,
      of op dezelfde dag, omkomen, zonder dat men weten kunne wie het eerst overleden zij, worden zij vermoed op
      hetzelfde ogenblik gestorven te zijn, en er heeft geen overgang van erfenis van de een ten behoeve van de ander
      plaats.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel859
  - number: '860'
    text: |-
      1 Tot de erfenis worden door de wet geroepen zij die tot de overledene in familierechtelijke betrekkingen stonden,
      en de langstlevende echtgenoot, volgens de hierna vastgestelde regelen.

      2 Bij gebreke van zodanige personen als bedoeld in het vorige lid, vervallen de goederen aan de Staat, onder de
      last om de schulden te voldoen, voor zover de waarde dier goederen toereikend is.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel860
  - number: '861'
    text: |-
      1 De erfgenamen treden van rechtswege in het bezit der goederen en rechtsvorderingen van de overledene.

      2 Indien er geschil ontstaat wie erfgenaam, en alzo tot dat bezit bevoegd is, kan de rechter bevelen, dat de
      goederen onder gerechtelijke bewaring zullen worden gesteld.

      3 De Staat moet zich door de rechter doen in het bezit stellen, en is, op straffe van schadevergoeding, gehouden de
      nalatenschap te laten verzegelen, en een boedelbeschrijving

      te doen opmaken, in de vorm voor de aanvaarding van nalatenschappen onder het voorrecht van boedelbeschrijving
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel861
  - number: '862'
    text: |-
      1 De erfgenaam heeft een rechtsvordering tot verkrijging der erfenis tegen al degenen, die, hetzij onder die
      titel, of zonder titel, in het bezit zijn van de gehele nalatenschap, of van een gedeelte daarvan, mitsgaders tegen
      degenen, die met arglist hebben opgehouden te bezitten.

      2 Hij kan deze rechtsvordering instellen voor het geheel, indien hij alleen erfgenaam is, en voor zijn aandeel, zo
      er meer erfgenamen zijn.

      3 Die rechtsvordering strekt tot afgifte van al hetgeen zich, onder welke titel ook, in de nalatenschap bevindt,
      met de vruchten, inkomsten en schadeloosstelling, volgens de regelen, welke ten aanzien van de opvordering van
      eigendom zijn voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel862
  - number: '863'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel863
  - number: '864'
    text: Ten einde als erfgenamen te kunnen optreden, moet men bestaan op het ogenblik dat de erfenis is opengevallen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel864
  - number: '865'
    text: |-
      Als onwaardig om erfgenamen te zijn worden beschouwd, en als zodanig van de erfenis uitgesloten:

      1°. hij, die veroordeeld is, ter zake dat hij de overledene heeft omgebracht of getracht heeft om te brengen;

      2°. hij, die bij rechterlijke uitspraak overtuigd is tegen de erflater lasterlijk te hebben ingebracht een
      beschuldiging van een misdrijf, waartegen een vrijheidsstraf met een maximum van ten minste vier jaren is bedreigd;

      3°. hij, die de overledene door geweld of feitelijkheid belet heeft zijn uiterste wil te maken of te herroepen;

      4°. hij, die de uiterste wil van de overledene heeft verduisterd, vernietigd of vervalst.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel865
  - number: '866'
    text: |-
      De erfgenaam, die uit hoofde van onwaardigheid van de erfenis is uitgesloten, is gehouden tot de teruggave van alle
      vruchten en inkomsten, waarvan hij sedert het openvallen der erfenis genot heeft gehad.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel866
  - number: '867'
    text: |-
      Kinderen van een onwaardig verklaarde persoon, uit eigen hoofde tot de erfenis komende, zijn niet uitgesloten
      door de schuld van hun ouders; doch dezen zijn in geen geval bevoegd om van de goederen dier nalatenschap het
      vruchtgenot te vorderen, hetwelk de wet aan ouders op de goederen van hun kinderen toekent.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel867
  - number: '868'
    text: |-
      Plaatsvervulling geeft aan de vertegenwoordigende persoon het recht om te treden in de plaats, in de graad en in de
      rechten van degene, die vertegenwoordigd wordt.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel868
  - number: '869'
    text: |-
      1 Plaatsvervulling heeft in de rechte nedergaande linie in het oneindige plaats.

      2 Dezelve wordt in alle gevallen toegelaten, hetzij de kinderen van de overledene tezamen tot de erfenis komen met
      de nakomelingen van een vooroverleden kind, hetzij, al de kinderen van de overledene vóór hem gestorven zijnde, de
      nakomelingen dier vooroverleden kinderen zich onderling in gelijke of ongelijke graden bestaan.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel869
  - number: '870'
    text: |-
      Er bestaat geen plaatsvervulling ten opzichte van naastbestaanden in de opgaande linie. De naaste in ieder der
      beide liniën sluit te allen tijde degene uit, die in een verdere graad is.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel870
  - number: '871'
    text: |-
      In de zijdlinie wordt de plaatsvervulling toegelaten ten voordele van kinderen en nakomelingen van des overledenen
      broeders en zusters, hetzij die gezamenlijk met hun ooms of moeien tot de nalatenschap komen, hetzij dat, na
      het vooroverlijden der broeders en zusters van de overledene, de erfenis overga tot derzelver nakomelingen, aan
      elkander in gelijke of in ongelijke graden bestaande.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel871
  - number: '872'
    text: |-
      Plaatsvervulling wordt ook toegelaten in de erfopvolging van zijdmagen, wanneer nevens degene, die de erflater het
      naast in den bloede bestaat, er nog kinderen of afkomelingen aanwezig zijn van vooroverleden broeders of zusters
      van eerstgemelde.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel872
  - number: '873'
    text: |-
      In al de gevallen, waarin plaatsvervulling wordt toegelaten, heeft de verdeling bij staken plaats; indien dezelfde
      staak verscheidene takken heeft voortgebracht, geschiedt de onderverdeling in iedere tak wederom bij staken, en
      onder de personen in dezelfde tak geschiedt de verdeling bij hoofden.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel873
  - number: '874'
    text: Niemand kan voor een levende persoon bij plaatsvervulling optreden.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel874
  - number: '875'
    text: |-
      Een kind ontleent niet van zijn ouders het recht om hen te vertegenwoordigen, en men kan zelfs degene
      vertegenwoordigen, wiens boedel men niet heeft willen aanvaarden.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel875
  - number: '876'
    text: |-
      De wet slaat geen acht, noch op de aard, noch op de oorsprong der goederen, om de erfopvolging in dezelve te
      regelen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel876
  - number: '877'
    text: |-
      1 Alle erfenissen, welke, hetzij geheel, hetzij voor een gedeelte, aan bloedverwanten in de opgaande of zijdlinie
      te beurt vallen, worden in twee gelijke delen gekloofd, waarvan het ene aan de nabestaanden in de vaderlijke, en
      het andere aan die in de moederlijke linie te beurt valt, behoudens de bepalingen in de [artikelen 881][ref1],
      [882][ref2] en [886][ref3] voorkomende.

      2 De erfenis kan nimmer van de ene linie tot de andere overgaan, dan wanneer er in een der beide liniën, noch
      bloedverwant in de opgaande linie, noch zijdmaag gevonden wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0028746#Artikel881
      [ref2]: https://wetten.overheid.nl/BWBR0028746#Artikel882
      [ref3]: https://wetten.overheid.nl/BWBR0028746#Artikel886
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel877
    references:
      - id: ref1
        bwb_id: BWBR0028746
        artikel: '881'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0028746
        artikel: '882'
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0028746
        artikel: '886'
        afdeling: Tweede
  - number: '878'
    text: |-
      Deze eerste verdeling tussen de vaderlijke en de moederlijke liniën daargesteld zijnde, heeft er geen verdere
      kloving tussen de onderscheiden takken plaats; maar de helft, aan iedere linie te beurt gevallen, behoort
      aan de erfgenaam, of de erfgenamen, welke de overledene het naast in graad bestaan, behoudens het geval van
      plaatsvervulling.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel878
  - number: '879'
    text: |-
      1 De kinderen of hun afstammelingen erven van hun ouders, grootouders, of verdere bloedverwanten in de opgaande
      linie, zonder onderscheid van kunne of eerstgeboorte, en zelfs wanneer zij uit verschillende huwelijken verwekt
      zijn.

      2 Zij erven voor gelijke delen bij hoofden, wanneer zij allen in de eerste graad zijn, en uit eigen hoofde geroepen
      worden; zij erven bij staken, wanneer zij allen, of een gedeelte hunner, bij plaatsvervulling opkomen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel879
  - number: 879a
    text: |-
      Voor zoveel betreft de nalatenschap van de vooroverleden echtgenoot wordt de langstlevende echtgenoot voor de
      toepassing der bepalingen van deze titel met een kind van de overledene gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel879a
  - number: 879b
    text: |-
      1 De langstlevende echtgenoot mag de inboedel tot zich nemen, tenzij hij tezamen erft met nakomelingen van de
      erflater die niet zijn eigen nakomelingen zijn.

      2 Voor zover deze inboedel behoort tot de nalatenschap van de erflater, komt de waarde daarvan alsdan in mindering
      van het erfdeel van die echtgenoot.

      3 Overtreft die waarde die van het erfdeel, dan moet het verschil aan de medeërfgenamen vooraf worden vergoed.

      4 In dit artikel wordt onder inboedel verstaan: alle roerende zaken, met uitzondering van geld, geldswaardige
      papieren, schepen, luchtvaartuigen en zaken die in de uitoefening van een beroep of bedrijf worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel879b
  - number: '880'
    text: |-
      1 Indien de overledene noch nakomelingen, noch echtgenoot, noch broeders of zusters achterlaten heeft, wordt de
      nalatenschap in twee gelijke delen tussen de bloedverwanten in de vaderlijke, en die in de moederlijke opgaande
      linie verdeeld, behoudens de bepaling van [artikel 886][ref1].

      2 De naaste in graad in de opgaande linie bekomt de helft aan zijn linie behorende, met uitsluiting van alle
      anderen.

      3 Bloedverwanten in de opgaande linie, van dezelfde graad, erven bij hoofde.


      [ref1]: https://wetten.overheid.nl/BWBR0028746#Artikel886
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel880
    references:
      - id: ref1
        bwb_id: BWBR0028746
        artikel: '886'
        afdeling: Tweede
  - number: '881'
    text: |-
      1 Wanneer de vader en de moeder van een persoon, welke overleden is zonder nakomelingen en zonder echtgenoot na te
      laten, hem overleven, bekomt ieder hunner een derde gedeelte der nalatenschap, indien de verstorvene slechts één
      broeder of één zuster heeft achtergelaten, welke het overige derde gedeelte bekomt.

      2 De vader en de moeder erven ieder voor een vierde gedeelte, indien de overledene meerdere broeders of zusters
      heeft achtergelaten, en in dat geval vallen aan deze laatstgemelden de twee overige vierde gedeelten te beurt.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel881
  - number: '882'
    text: |-
      Wanneer de vader of de moeder van iemand, overleden zonder nakomelingen en zonder echtgenoot na te laten, vóór
      hem gestorven is, zal de langstlevende de helft der nalatenschap bekomen, indien de overledene slechts één broeder
      of één zuster achterlaat; een derde, indien hij er twee achtergelaten heeft; en een vierde gedeelte, indien er
      meerdere broeders of zusters achtergebleven zijn. De overige delen vallen aan de broeders en zusters te beurt.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel882
  - number: '883'
    text: |-
      Indien vader en moeder van een persoon, welke gestorven is zonder nakomelingen en zonder echtgenoot na te laten,
      vooroverleden zijn, worden de broeders en zusters tot de gehele erfenis geroepen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel883
  - number: '884'
    text: |-
      De verdeling van al hetgeen, volgens de bepalingen der hierboven staande artikelen, aan de broeders en de zusters
      toekomt, geschiedt onder hen in gelijke delen, indien zij allen van hetzelfde bed zijn; indien dit niet het geval
      is, wordt hetgeen zij erven in twee gelijke delen tussen de vaderlijke en de moederlijke liniën des overledenen
      verdeeld; de volle broeders en zusters bekomen hun deel in beide de liniën, en die van halven bedde slechts
      in de linie, tot welke zij behoren. Indien er niet dan halve broeders of zusters, van één kant slechts, zijn
      achtergebleven, bekomen zij de gehele nalatenschap, met uitsluiting van alle andere bloedverwanten in de andere
      linie.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel884
  - number: '885'
    text: |-
      1 Bij gebreke van broeders en zusters, en tevens van nabestaanden in een der beide opgaande liniën, komt de
      nalatenschap voor de ene helft aan de in leven zijnde bloedverwanten in de opgaande linie, en voor de wederhelft
      aan de zijdmagen in de andere linie, met uitzondering van het geval bij het volgende artikel vermeld.

      2 Bij gebreke van broeders en zusters en van nabestaanden in de beide opgaande liniën, worden in iedere zijdlinie
      de naaste bloedverwanten, ieder voor de helft, tot de erfenis geroepen.

      3 Indien er in dezelfde zijdlinie bloedverwanten van dezelfde graad gevonden worden, delen zij onder elkander bij
      hoofden, behoudens de bepaling van [artikel 872][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028746#Artikel872
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel885
    references:
      - id: ref1
        bwb_id: BWBR0028746
        artikel: '872'
        afdeling: Eerste
  - number: '886'
    text: |-
      De langstlevende vader of moeder erft alleen de gehele nalatenschap van zijn kind, hetwelke zonder nakomelingen,
      echtgenoot, broeders of zusters na te laten overleden is.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel886
  - number: '887'
    text: |-
      Onder de benaming van broeders en zusters, in deze afdeling voorkomende, worden steeds de afstammelingen van ieder
      hunner begrepen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel887
  - number: '888'
    text: |-
      1 Bloedverwanten, welke de overledene verder dan in de zesde graad in de zijdlinie bestaan, erven niet.

      2 Indien in de ene linie geen bloedverwanten van de graad, waarin men erven kan, gevonden worden, bekomen de
      bloedverwanten in de andere linie de gehele erfenis.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel888
  - number: '901'
    text: |-
      1 De goederen, welke iemand bij zijn overlijden nalaat, behoren aan zijn wettelijke erfgenamen, voor zover hij
      daarover niet bij uiterste wil wettiglijk mocht hebben beschikt.

      2 Men kan geen afstand doen van een erfenis die nog niet opengevallen is, noch over een zodanige nalatenschap
      enig beding aangaan, zelfs niet met toestemming van degene over wiens nalatenschap gehandeld wordt, behoudens de
      bepalingen van [artikel 146 van Boek 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel146
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel901
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '146'
  - number: '902'
    text: |-
      Een testament of uiterste wil is een akte, houdende de verklaring van hetgeen iemand wil dat na zijn dood zal
      geschieden, en welke akte door hem kan worden herroepen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel902
  - number: '903'
    text: |-
      1 Uiterste wilsbeschikkingen ten aanzien van goederen zijn, of algemeen, of onder een algemene titel, of onder een
      bijzondere titel.

      2 Elk dezer beschikkingen, hetzij dezelve gedaan zij onder de benaming van erfstelling, hetzij onder de benaming
      van legaat, of onder elke andere benaming, zal kracht hebben, volgens de regelen bij deze titel voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel903
  - number: '904'
    text: |-
      Een uiterste wilsbeschikking ten voordele van de naaste bloedverwanten, of het naaste bloed van de erflater, zonder
      verdere aanduiding, wordt geacht te zijn gemaakt ten voordele van zijn door de wet geroepen erfgenamen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel904
  - number: '905'
    text: |-
      De uiterste wilsbeschikking ten voordele van de armen, zonder andere aanduiding, wordt geacht gemaakt te zijn
      ten behoeve van al de noodlijdenden, zonder onderscheid van godsdienst, welke in de plaats, alwaar de erfenis is
      opengevallen, door armeninrichtingen bedeeld worden.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel905
  - number: '906'
    text: |-
      1 De erfstellingen over de hand of fideï-commissaire substitutiën zijn verboden.

      2 Dienvolgens is, zelfs ten aanzien van de benoemde erfgenaam of legataris, nietig en van onwaarde elke
      beschikking, waarbij dezelve belast wordt de erfenis of het legaat te bewaren, en aan een derde, voor het geheel of
      voor een gedeelte, uit te keren.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel906
  - number: '907'
    text: |-
      Van de bij het vorige artikel verboden erfstellingen over de hand zijn uitgezonderd die, welke bij de zevende en
      achtste afdeling van deze titel zijn toegelaten.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel907
  - number: '908'
    text: |-
      1 De bepaling waarbij een derde, of, bij diens vooroverlijden, al deszelfs kinderen, reeds geboren of die nog
      zullen worden geboren, zijn geroepen tot het geheel of tot een gedeelte van hetgeen de erfgenaam of legataris,
      bij zijn overlijden, van de erfenis of van het legaat onvervreemd of onverteerd zal overlaten, is geen verboden
      erfstelling over de hand.

      2 Door zodanige erfstelling of legaat mag de erflater zijn erfgenamen, aan welke een wettelijk erfdeel toekomt,
      niet benadelen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel908
  - number: '909'
    text: |-
      De beschikking, waardoor een derde tot een erfenis of een legaat geroepen wordt, in het geval dat de geroepen
      erfgenaam of legataris dezelve niet geniet, is van waarde.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel909
  - number: '910'
    text: |-
      [Artikel 906][ref1] is niet van toepassing op een legaat van een vruchtgebruiker.


      [ref1]: https://wetten.overheid.nl/BWBR0028746#Artikel906
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel910
    references:
      - id: ref1
        bwb_id: BWBR0028746
        artikel: '906'
        afdeling: Eerste
  - number: '911'
    text: |-
      Een voorwaarde of een last die de strekking heeft de bevoegdheid tot vervreemding of bezwaring van goederen uit te
      sluiten, wordt voor niet geschreven gehouden.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel911
  - number: '912'
    text: Indien de bewoordingen ener uiterste wilsbeschikking duidelijk zijn, mag men daarvan door uitlegging niet afwijken.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel912
  - number: '913'
    text: |-
      Indien daarentegen de bewoordingen ener uiterste wilsbeschikking voor onderscheiden opvattingen vatbaar zijn, moet
      men veeleer nagaan, welke de bedoeling des erflaters geweest zij, dan zich, tegen die bedoeling, aan de letterlijke
      zin der woorden houden.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel913
  - number: '914'
    text: |-
      In zodanig geval moeten ook de bewoordingen worden opgevat in de zin, die met de aard der beschikking en derzelver
      onderwerp het meest overeenkomt, en bij voorkeur in dier voege, dat de beschikking enige uitwerking of gevolg
      hebbe.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel914
  - number: '915'
    text: |-
      In alle uiterste wilsbeschikkingen worden de voorwaarden, die onverstaanbaar of onmogelijk zijn, of die met de
      wetten en goede zeden strijden, voor niet geschreven gehouden.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel915
  - number: '916'
    text: |-
      De voorwaarde wordt gehouden voor vervuld, wanneer hij, die bij de niet-vervulling daarvan belang mocht hebben, de
      vervulling heeft belet.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel916
  - number: '917'
    text: |-
      De vermelding van een valse beweegreden wordt voor niet geschreven gehouden, tenzij uit de uiterste wil blijken
      mocht, dat de erflater de beschikking niet zoude hebben gemaakt, indien hij van de valsheid der beweegreden kennis
      had gedragen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel917
  - number: '918'
    text: |-
      De vermelding van een, hetzij ware, hetzij valse beweegreden, die echter met de wetten of de goede zeden strijdt,
      maakt de erfstelling of het legaat nietig.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel918
  - number: '919'
    text: |-
      Indien een ondeelbare last aan verscheidene erfgenamen of legatarissen is opgelegd geworden, en een of meer
      hunner van de erfenis of het legaat afzien, ofwel onbekwaam zijn om het gemaakte te beuren, zal hij, die zich
      voor het geheel van de last wil kwijten, het hem nagelaten gedeelte kunnen vorderen, en zijn verhaal hebben op de
      nalatenschap, voor hetgeen hij voor de anderen mocht hebben betaald.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel919
  - number: '920'
    text: |-
      Uiterste willen, gemaakt tengevolge van dwang, bedrog of arglist, zijn nietig. [Artikel 44 van Boek 3][ref1] is
      niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel44
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel920
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '44'
  - number: '921'
    text: |-
      Indien door een en hetzelfde ongeval, of op dezelfde dag, mochten omkomen de erflater en de erfgenaam of de
      legataris, of degene, die bij een geoorloofde ondererfstelling in plaats van deze laatste zoude zijn opgetreden,
      zonder dat men weten kunne, wie van de alzo omgekomenen het eerst overleden zij, worden zij vermoed op hetzelfde
      ogenblik gestorven te zijn, en er heeft geen overgang van rechten tengevolge van de uiterste wil plaats.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel921
  - number: '922'
    text: Tot het maken of herroepen van een uiterste wil moet men zijn verstandelijke vermogens bezitten.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel922
  - number: '923'
    text: |-
      Alle personen kunnen bij uiterste wil beschikken, en daaruit voordeel genieten, uitgezonderd de zodanigen, die
      daartoe, volgens de bepalingen van deze afdeling, zijn onbekwaam verklaard.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel923
  - number: '924'
    text: |-
      1 Behalve zij die handelingsbekwaam zijn, kunnen ook minderjarigen die de leeftijd van zestien jaren hebben bereikt
      uiterste wilsbeschikkingen maken.

      2 Hij die onder curatele staat, kan slechts met toestemming van de rechter in eerste aanleg uiterste
      wilsbeschikkingen maken. De rechter kan aan zijn toestemming voorwaarden verbinden.

      3 De bekwaamheid van de erflater wordt beoordeeld naar de staat waarin hij zich bevond op het ogenblik dat de
      beschikking werd gemaakt.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel924
  - number: '925'
    text: |-
      De bekwaamheid van de erflater wordt beoordeeld naar de staat, waarin hij zich bevond op het ogenblik dat de
      uiterste wil gemaakt is.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel925
  - number: '926'
    text: |-
      1 Om uit kracht van een uiterste wil iets te kunnen genieten, moet men bestaan op het ogenblik van de dood des
      erflaters. Rechten uit een uiterste wil ten voordele van een rechtspersoon die voor dat ogenblik is opgehouden
      te bestaan ten gevolge van een fusie of splitsing, komen toe aan de verkrijgende rechtspersoon, onderscheidenlijk
      de verkrijgende rechtspersoon waarvan de aan de akte van splitsing gehechte beschrijving dat bepaalt. Indien aan
      de hand van de aan de akte van splitsing gehechte beschrijving niet kan worden bepaald welke rechtspersoon in de
      plaats en de rechten treedt van de gesplitste rechtspersoon, is [artikel 352 van Boek 2][ref1] van overeenkomstige
      toepassing.

      2 Deze bepaling is niet toepasselijk op personen, die geroepen zijn om uit stichtingen genot te trekken.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel352
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel926
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '352'
  - number: '927'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel927
  - number: '928'
    text: |-
      Een echtgenoot kan geen voordeel genieten door de uiterste wilsbeschikkingen van zijn medeëchtgenoot, indien het
      huwelijk zonder behoorlijke toestemming mocht zijn aangegaan, en de erflater gestorven is op een tijdstip, waarop
      de wettigheid van dit huwelijk te dier oorzake nog in rechten kon worden betwist.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel928
  - number: '929'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel929
  - number: 929a
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel929a
  - number: 929b
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel929b
  - number: '930'
    text: |-
      Echtgenoten kunnen, ten opzichte van de goederen welke in gemeenschap zijn, niet verder beschikken dan over het
      aandeel, dat ieder hunner in de gemeenschap heeft. Indien echter enig goed uit de gemeenschap is gemaakt, kan de
      legataris hetzelve niet in natura vorderen, indien dat goed niet aan de erfgenamen van de erflater is aanbedeeld.
      In dat geval wordt de legataris schadeloosgesteld uit het aandeel in de gemeenschap, aan de erfgenamen van de
      erflater aangekomen, en, bij ongenoegzaamheid, uit de goederen aan die erfgenamen persoonlijk toebehorende.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel930
  - number: '931'
    text: |-
      1 Een minderjarige, ofschoon de ouderdom van achttien jaren bereikt hebbende, kan bij uiterste wil ten voordele van
      zijn voogd geen beschikking maken.

      2 Meerderjarig geworden zijnde, kan hij zijn gewezen voogd net bij uiterste wil bevoordelen, dan na het afleggen en
      sluiten der voogdijrekening.

      3 Van de twee hierboven vermelde gevallen zijn uitgezonderd bloedverwanten van de minderjarige in de opgaande
      linie, die zijn voogden zijn of geweest zijn.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel931
  - number: '932'
    text: |-
      1 Minderjarigen kunnen niet bij uiterste wil beschikken ten voordele van hun leermeesters, gouverneurs of
      gouvernanten, welke met hen tezamen wonen, noch ten voordele van hun onderwijzers of onderwijzeressen, bij welke de
      minderjarigen in de kost besteed zijn.

      2 Hiervan zijn uitgezonderd de beschikkingen tot vergelding van gedane diensten, bij wijze van legaat gemaakt, met
      inachtneming echter zowel van de gegoedheid van de maker, als van de diensten die aan dezelve zijn bewezen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel932
  - number: '933'
    text: |-
      1 De geneesheren, heelmeesters, apothekers en andere personen de geneeskunde uitoefenende, welke iemand, gedurende
      de ziekte waaraan hij overleden is, bediend hebben, alsmede de bedienaars van de godsdienst, welke hem gedurende
      die ziekte hebben bijgestaan, kunnen geen voordeel trekken uit de uiterste wilsbeschikkingen, welke zodanige
      persoon, gedurende de loop dier ziekte, te hunnen behoeve mocht hebben gemaakt.

      2 Ook kan degene die een voor de verzorging of verpleging van bejaarden of geestelijk gestoorden bestemde
      instelling exploiteert of die daarvan de leiding heeft of daarin werkzaam is, geen voordeel trekken uit de uiterste
      wilsbeschikkingen, welke zodanig persoon gedurende zijn verblijf in die instelling te zijnen behoeve mocht hebben
      gemaakt.

      3 Hiervan zijn uitgezonderd:

      1°. de beschikkingen tot vergelding van gedane diensten, bij wijze van legaat gemaakt, evenals bij het vorige
      artikel is vastgesteld;

      2°. de beschikkingen ten voordele van de echtgenoot van de erflater;

      3°. de beschikkingen, zelfs algemene, gemaakt ten voordele van bloedverwanten tot de vierde graad ingesloten,
      indien de overledene geen erfgenamen in de rechte linie mocht hebben nagelaten; tenware degene, te wiens voordele
      de beschikking gemaakt is, zelf onder het getal dier erfgenamen mocht behoren.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel933
  - number: '934'
    text: |-
      De notaris, die een uiterste wil bij openbare akte heeft verleden, en de getuigen, die daarbij zijn tegenwoordig
      geweest, kunnen niets genieten van hetgeen aan hen bij die uiterste wil mocht zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel934
  - number: '935'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel935
  - number: '936'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel936
  - number: '937'
    text: |-
      1 Een uiterste wilsbeschikking, gemaakt ten voordele van iemand, die onbekwaam is om te erven, is nietig, zelfs
      wanneer de beschikking mocht zijn gemaakt op de naam van een tussenbeide komende persoon.

      2 Voor tussenbeide komende personen worden gehouden de vader en de moeder, de kinderen en afstammelingen, en de
      echtgenoot van degene, die onbekwaam is om te erven.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel937
  - number: '938'
    text: |-
      Hij, die veroordeeld is omdat hij de erflater heeft omgebracht, hij, die de uiterste wil des erflaters heeft
      verdonkerd, vernietigd of vervalst, of die de erflater door geweld of dadelijkheden heeft belet zijn uiterste wil
      te herroepen of te veranderen, zal, evenmin als zijn medeëchtgenoot en zijn kinderen, uit de uiterste wil enig
      voordeel kunnen genieten.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel938
  - number: '939'
    text: |-
      De legitieme portie of het wettelijk erfdeel is een gedeelte der goederen, hetwelk aan de bij de wet geroepen
      erfgenamen in de rechte linie wordt toegekend, en waarover de overledene, noch bij gift onder de levenden, noch bij
      uiterste wil, heeft mogen beschikken.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel939
  - number: '940'
    text: |-
      1 In de nederdalende linie, indien de erflater slechts één kind nalaat, bestaat dat wettelijk erfdeel in de helft
      van de goederen, welke het kind bij versterf zoude hebben geërfd.

      2 Indien er twee kinderen overblijven, is het wettelijk erfdeel voor ieder kind twee derde gedeelten van hetgeen
      hetzelve bij versterf zoude erven.

      3 Ingeval de overledene drie of meer kinderen nalaat, zal het wettelijk erfdeel drie vierde gedeelten bedragen van
      hetgeen elk kind bij versterf zoude gehad hebben.

      4 Onder de naam van kinderen worden begrepen de afstammelingen, in welke graad zij ook zijn; echter worden dezen
      alleen gerekend in plaats van het kind, hetwelk zij in de nalatenschap van de erflater vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel940
  - number: '941'
    text: |-
      In de opgaande linie bedraagt het wettelijk erfdeel altijd de helft van hetgeen, volgens de wet, aan elke
      bloedverwant in die linie bij versterf toekomt.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel941
  - number: '942'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel942
  - number: 942a
    text: |-
      1 In de gevallen, waarin voor het berekenen der legitieme portie rekening moet worden gehouden met erfgenamen,
      die wel zijn erfgenamen bij versterf, doch niet zijn legitimarissen, zullen, wanneer aan anderen dan bedoelde
      erfgenamen, hetzij bij akte onder de levenden, hetzij bij uiterste wil, meer is geschonken dan het aandeel
      bedraagt, waarover men zou mogen beschikken, indien zodanige erfgenamen niet aanwezig waren, bedoelde giften of
      schenkingen kunnen worden verminderd tot genoemd bedrag, zulks op de vordering en ten bate van de legitimarissen en
      van derzelver erfgenamen of rechthebbenden.

      2 De [artikelen 946–955][ref1] vinden overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028746#Artikel946
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel942a
    references:
      - id: ref1
        bwb_id: BWBR0028746
        artikel: '946'
        afdeling: Derde
  - number: '943'
    text: |-
      Bij gebreke van legitimarissen mogen de giften, bij akte onder de levenden of bij uiterste wil gedaan, het gehele
      beloop der goederen van de nalatenschap bevatten.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel943
  - number: '944'
    text: |-
      Wanneer de beschikking, bij akte onder de levenden of bij uiterste wil gedaan, bestaat in een vruchtgebruik of in
      een lijfrente, waarvan het beloop het wettelijk erfdeel benadeelt, hebben de erfgenamen, aan welke dat erfdeel is
      toegekend, de keus, of om deze beschikking uit te voeren, ofwel om aan de begiftigden of legatarissen de eigendom
      van het beschikbare gedeelte af te staan.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel944
  - number: '945'
    text: |-
      Het aandeel, waarover men beschikken mag, kan, hetzij in het geheel of gedeeltelijk, bij akte onder de levenden of
      bij uiterste wil, aan vreemden, ofwel aan kinderen of andere personen, die tot een erfenis gerechtigd zijn, worden
      weggeschonken, behoudens de gevallen, waarin deze laatsten, naar aanleiding van de zestiende titel van dit boek,
      tot inbreng gehouden zijn.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel945
  - number: '946'
    text: |-
      1 Legitimarissen en hun rechtverkrijgenden onder algemene titel kunnen makingen en giften die aan het wettelijk
      erfdeel tekort doen, door inkorting verminderen, indien voldaan is aan de vereisten, in deze afdeling daartoe
      gesteld.

      Door inkorting wordt een making of gift vernietigd, voor zover zij aan het wettelijk erfdeel tekort doet.
      [Artikel 52 van Boek 3][ref1] is niet van toepassing.

      2 Desniettegenstaande zullen de legitimarissen van die vermindering niets kunnen genieten ten nadele van de
      schuldeisers van de overledene.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel52
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel946
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '52'
  - number: '947'
    text: |-
      Om de hoegrootheid van het wettelijk erfdeel te bepalen, maakt men een opsomming van al de goederen, die op het
      tijdstip van het overlijden van de gever of erflater aanwezig waren; men voegt daarbij het beloop der goederen,
      waarover bij giften onder de levenden beschikt is, berekend naar de staat, waarin zij zich op het tijdstip der gift
      bevonden hebben, en hun waarde op het ogenblik van het overlijden van de gever; men berekent over al die goederen,
      na de schulden daarvan te hebben afgetrokken, hoeveel, naarmate van de betrekking der legitimarissen, het erfdeel
      is, hetwelk zij kunnen vorderen, en men trekt daarvan af hetgeen dezen, zelfs met vrijstelling van inbreng, van de
      overledene hebben ontvangen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel947
  - number: '948'
    text: |-
      Alle vervreemding van enig goed, hetzij onder de last ener lijfrente, hetzij met voorbehoud van vruchtgebruik, aan
      een der erfgenamen in de rechte linie gedaan, wordt beschouwd als een gift.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel948
  - number: '949'
    text: |-
      1 Indien de gegeven zaak vóór het overlijden van de schenker, buiten schuld van de begiftigde, is verloren gegaan,
      zal zij niet worden begrepen onder de massa der goederen, over welke het wettelijk erfdeel moet worden berekend.

      2 De gegeven zaak zal onder de massa worden begrepen, indien zij ter oorzaak van het onvermogen van de begiftigde
      niet kan worden terugverkregen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel949
  - number: '950'
    text: |-
      De giften onder de levenden zullen nimmer mogen worden verminderd, dan nadat al de goederen, welke bij uiterste
      wil zijn weggemaakt, zullen bevonden worden niet genoegzaam te zijn om het wettelijk aandeel te verzekeren. Wanneer
      alsdan een vermindering van de giften onder de levenden moet plaatshebben, zal men dezelve aanvangen met de gift,
      welke het laatst gedaan is, en alzo verder van deze tot de vroegere opklimmen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel950
  - number: '951'
    text: |-
      1 De teruggave van de goederen, welke naar aanleiding van het voorgaande artikel moet plaatshebben, geschiedt in
      natura, niettegenstaande alle tegenstrijdige bepalingen.

      2 Indien echter de vermindering moet worden toegepast op een goed, hetwelk niet gevoeglijk kan worden verdeeld, zal
      de begiftigde, zelfs wanneer het een vreemde is, de bevoegdheid hebben om in gereed geld op te leggen, hetgeen de
      legitimaris toekomt.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel951
  - number: '952'
    text: |-
      De vermindering der bij uiterste wil gedane makingen zal geschieden zonder onderscheid te maken tussen de
      erfstellingen en legaten, tenzij de erflater uitdrukkelijk mocht hebben bevolen, dat deze of gene erfstelling of
      legaat bij voorkeur moest worden voldaan; in welk geval zodanige erfstelling of legaat niet zal worden verminderd,
      dan ingeval de waarde van de andere makingen niet mocht toereikend zijn om het wettelijke erfdeel op te leveren.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel952
  - number: '953'
    text: |-
      De begiftigde zal de vruchten van hetgeen de gift meer bedraagt dan het gedeelte, waarover beschikt kan worden,
      teruggeven, te rekenen van de dag dat de gever overleden is, indien de eis tot vermindering is gedaan binnen het
      jaar, en anderszins van de dag dat die eis gedaan is.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel953
  - number: '954'
    text: |-
      De goederen, die uit kracht van vermindering in de boedel moeten terugkeren, worden daardoor vrij van beperkte
      rechten die daarop sinds de uitvoering van de gift zijn gevestigd.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel954
  - number: '955'
    text: |-
      1 Tegenover derde-verkrijgers van vermaakte of gegeven goederen, aan wie niet een beroep op de
      [artikelen 86 tot en met 88 van Boek 3][ref1] toekomt, moet worden ingekort volgens de volgorde dier
      vervreemdingen, te beginnen met die vervreemdingen welke het laatst gedaan is.

      2 Desniettemin zal de inkorting tegen derde verkrijgers geen plaatshebben, dan voor zover de begiftigde geen andere
      goederen mocht hebben overgehouden, welke in de gift begrepen waren, en deze niet genoegzaam zijn om het wettelijk
      erfdeel in zijn geheel te voldoen, en indien de waarde der vervreemde goederen niet op zijn persoonlijke goederen
      mocht kunnen worden verhaald.

      3 De rechtsvordering tot inkorting jegens derde-verkrijgers verjaart door het tijdsverloop van drie jaren, te
      rekenen van de dag waarop de legitimaris de erfenis heeft aanvaard.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel86
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel955
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '86'
  - number: '956'
    text: |-
      Geen uiterste wil kan bij dezelfde akte door twee of meer personen gemaakt worden, hetzij ten voordele van een
      derde, hetzij onder de titel van een wederkerige of onderlinge beschikking.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel956
  - number: '957'
    text: |-
      Een uiterste wil kan alleen worden gemaakt, of bij een olografische of eigenhandig geschreven akte, of bij een
      openbare akte, of bij een geheime of gesloten beschikking.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel957
  - number: '958'
    text: |-
      1 Een olografische uiterste wil moet met de hand des erflaters geheel geschreven en getekend zijn.

      2 Dezelve moet door de erflater bij een notaris in bewaring worden gesteld.

      3 De notaris, bijgestaan door twee getuigen, zal daarvan onmiddellijk een door hem met de erflater en de getuigen
      getekende akte van bewaargeving opmaken, hetzij aan de voet van de uiterste wil, indien dezelve open aan hem is
      ter hand gesteld, hetzij afzonderlijk, indien het stuk verzegeld aan hem mocht zijn aangeboden; in welk laatste
      geval de erflater, in tegenwoordigheid van de notaris en de getuigen, op de omslag moet aantekenen, en door zijn
      ondertekening bekrachtigen, dat hetzelve zijn uiterste wil bevat.

      4 Ingeval de erflater door enige verhindering, die na de ondertekening van de uiterste wil of van de omslag is
      opgekomen, de omslag of de akte van bewaargeving, ofwel beide, niet kan tekenen, moet de notaris daarvan, evenals
      van de oorzaak des beletsels, melding maken.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel958
  - number: '959'
    text: |-
      1 Zodanige olografische uiterste wil, overeenkomstig het voorgaande artikel, door de notaris zijnde in bewaring
      genomen, heeft dezelfde kracht als een bij openbare akte gemaakte uiterste wil, en wordt gerekend gemaakt te zijn
      op de dag der akte van bewaargeving, zonder aanzien der dagtekening, welke zich in de uiterste wil zelf mocht
      bevinden.

      2 De als olografische uiterste wil door de notaris in bewaring genomen akte wordt, tot het bewijs van het
      tegendeel, vermoed met de hand van de erflater geheel geschreven en getekend te zijn.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel959
  - number: '960'
    text: |-
      1 De erflater kan te allen tijde zijn olografische testament terugvorderen, mits hij, ter verantwoording van de
      notaris, van de teruggave bij een authentieke akte doe blijken.

      2 Door de teruggave wordt het olografische testament als herroepen beschouwd.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel960
  - number: '961'
    text: |-
      1 Bij een enkel onderhands, door de erflater geheel geschreven, gedagtekend en ondertekend stuk, kunnen, zonder
      verdere formaliteiten, beschikkingen na dode worden gemaakt, doch alleen en bij uitsluiting ter aanstelling
      van executeren, ter bestelling van begrafenis, tot het maken van legaten van klederen, van lijfstoebehoren, van
      bepaalde lijfsieraden en van bijzondere meubelen.

      2 De herroeping van zodanig stuk kan op dezelfde wijze onder de hand geschieden.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel961
  - number: '962'
    text: |-
      Indien zodanig stuk, als waarvan in het vorige artikel is gesproken, na het overlijden van de erflater gevonden
      wordt, moet hetzelve worden aangeboden aan de rechter van het kanton, alwaar de erfenis is opengevallen; deze zal,
      indien het stuk verzegeld is, hetzelve openen, en in alle geval een proces-verbaal van de aanbieding, alsmede van
      de staat waarin hetzelve zich bevindt, opmaken; hij zal eindelijk dat stuk aan een notaris ter hand stellen, ten
      einde hetzelve onder zijn minuten te bewaren.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel962
  - number: '963'
    text: |-
      Een olografische uiterste wil, welke gesloten aan de notaris is ter hand gesteld, zal, na de dood des erflaters,
      aan de rechter in eerste aanleg worden aangeboden, welke zal handelen zoals bij [artikel 968][ref1], ten aanzien
      van besloten uiterste willen is voorgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0028746#Artikel968
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel963
    references:
      - id: ref1
        bwb_id: BWBR0028746
        artikel: '968'
        afdeling: Vierde
  - number: '964'
    text: |-
      Een uiterste wil bij openbare akte moet ten overstaan van een notaris, en in tegenwoordigheid van twee getuigen,
      worden verleden.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel964
  - number: '965'
    text: |-
      1 De notaris moet de wil des erflaters, zoals die zakelijk aan hem door de erflater is opgegeven, in duidelijke
      bewoordingen schrijven of doen schrijven.

      2 Indien de opgave buiten de tegenwoordigheid der getuigen is gedaan, en het opstel door de notaris is
      gereedgemaakt, moet de erflater, alvorens de voorlezing daarvan geschiede, zijn wil nader zakelijk, in
      tegenwoordigheid der getuigen, opgeven.

      3 Daarna zal, in tegenwoordigheid der getuigen, de uiterste wil door de notaris worden voorgelezen, en na die
      voorlezing door hem aan de erflater worden afgevraagd, of het voorgelezene zijn uiterste wil bevat.

      4 Indien de uiterste wil in tegenwoordigheid der getuigen is opgegeven, en terstond is in geschrift gebracht, zal
      gelijke voorlezing en afvraging in tegenwoordigheid der getuigen geschieden.

      5 De akte moet vervolgens door de erflater, de notaris en de getuigen worden ondertekend.

      6 Indien de erflater verklaart, dat hij niet kan ondertekenen, of indien hij daarin verhinderd wordt, moet ook die
      verklaring en de oorzaak der verhindering in de akte worden vermeld.

      7 Van de nakoming van al deze formaliteiten moet uitdrukkelijk worden melding gemaakt in de akte van uiterste wil.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel965
  - number: '966'
    text: |-
      1 Wanneer de erflater een besloten of geheim testament wil maken, zal hij verplicht zijn zijn beschikkingen te
      ondertekenen, hetzij hij die zelf geschreven hebbe, hetzij hij die door een ander hebbe laten schrijven; het papier
      hetwelk zijn beschikkingen bevat, of het papier hetwelk tot een omslag dient, indien er een omslag gebruikt wordt,
      zal gesloten en verzegeld worden.

      2 De erflater zal hetzelve alzo gesloten en verzegeld aan de notaris, in tegenwoordigheid van vier getuigen,
      aanbieden, of hij zal het in hun tegenwoordigheid moeten doen sluiten en verzegelen, en moeten verklaren, dat
      in het gemelde papier zijn uiterste wil begrepen is, en dat die uiterste wil, hetzij door hem zelf geschreven en
      door hem getekend is, of door een ander geschreven en door hem getekend is. De notaris zal daarvan een akte van
      superscriptie opmaken, die op dat papier, of op het papier tot omslag dienende, zal geschreven worden; deze akte
      zal zowel door de erflater, als door de notaris, benevens de getuigen, ondertekend worden, en, ingeval de erflater
      door enige verhindering, die na de ondertekening van de uiterste wil is opgekomen, de akte van superscriptie niet
      kan ondertekenen, zal van de oorzaak van het beletsel melding gemaakt worden.

      3 Al de in tegenwoordigheid van de notaris en de getuigen in acht te nemen formaliteiten moeten worden vervuld,
      zonder intussen tot enige andere akte over te gaan.

      4 De besloten of geheime uiterste wil moet onder de minuten van de notaris blijven berusten, die dat stuk ontvangen
      heeft.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel966
  - number: '967'
    text: |-
      1 Ingeval de erflater niet kan spreken, maar wel schrijven, zal hij een besloten uiterste wil kunnen maken,
      mits dezelve met zijn hand geheel geschreven, gedagtekend en ondertekend worde, hij dezelve aan de notaris en de
      getuigen aanbiede, en boven de akte van superscriptie in hun tegenwoordigheid schrijve en ondertekene, dat het
      papier hetwelk hij hun aanbiedt zijn uiterste wil is; waarna de notaris de akte van superscriptie zal schrijven, en
      daarin melding maken, dat de erflater die verklaring, in tegenwoordigheid van de notaris en de getuigen, geschreven
      heeft, en zal bovendien worden in acht genomen al hetgeen bij het [voorgaande artikel][ref1] is bepaald.

      2 De uiterste willen, in het voorgaande en in dit artikel bedoeld, worden, tot het bewijs van het tegendeel,
      vermoed door de erflater ondertekend, laatstgemelde uiterste willen daarenboven met zijn hand geheel geschreven en
      gedagtekend te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028746#Artikel966
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel967
    references:
      - id: ref1
        bwb_id: BWBR0028746
        artikel: '966'
        afdeling: Vierde
  - number: '968'
    text: |-
      Na de dood van de erflater moet de besloten of geheime uiterste wil worden aangeboden aan de rechter, binnen wiens
      rechtsgebied de erfenis is opengevallen; deze rechter zal die uiterste wil openen, en proces-verbaal opmaken van de
      aanbieding en de opening van de uiterste wil, alsmede van de staat waarin zich dezelve bevindt, en dit stuk daarna
      aan de notaris, die de aanbieding heeft gedaan, teruggeven.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel968
  - number: '969'
    text: |-
      De notaris, die onder zijn minuten een uiterste wil, van welke aard ook, heeft, moet daarvan, na de dood van de
      erflater, aan de belanghebbende personen kennis geven.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel969
  - number: '970'
    text: |-
      1 De getuigen, die bij het maken van uiterste willen tegenwoordig zijn, moeten zijn meerderjarig, en ingezetenen
      van Curaçao, Sint Maarten, of van de openbare lichamen Bonaire, Sint Eustatius en Saba. Zij moeten de taal verstaan
      waarin de uiterste wil is opgesteld, of die waarin de akte van superscriptie of bewaargeving is geschreven.

      2 Tot getuigen van een uiterste wil, bij openbare akte op te maken, kunnen niet genomen worden de erfgenamen of de
      legatarissen, noch derzelver bloedverwanten of aangehuwden, tot in de vierde graad ingesloten, noch de kinderen of
      kleinkinderen, of bloedverwanten in dezelfde graad, noch de huisbedienden der notarissen, voor welke de uiterste
      wil verleden wordt.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel970
  - number: '971'
    text: |-
      1 Een ingezetene van de openbare lichamen Bonaire, Sint Eustatius of Saba, die zich in een vreemd land bevindt, zal
      geen andere uiterste wil kunnen maken dan bij authentieke akte, en met inachtneming van de formaliteiten, welke in
      het land, alwaar de akte verleden wordt, gebruikelijk zijn.

      2 Hij is echter bevoegd om bij een onderhands stuk te beschikken, op de voet en de wijze als bij
      [artikel 961][ref1] is omschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0028746#Artikel961
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel971
    references:
      - id: ref1
        bwb_id: BWBR0028746
        artikel: '961'
        afdeling: Vierde
  - number: '972'
    text: |-
      In tijd van oorlog kunnen de krijgslieden en andere personen tot de legers behorende, en zich in het veld ofwel
      in een belegerde plaats bevindende, hun uiterste wil maken ten overstaan van een officier, of, zo er geen officier
      aanwezig is, van de persoon, die op de plaats het hoogste militaire gezag uitoefent, en in tegenwoordigheid van
      twee getuigen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel972
  - number: '973'
    text: |-
      De uiterste wil van personen, die zich, gedurende de loop ener reis, op zee bevinden, kan verleden worden ten
      overstaan van de kapitein of de stuurman van het vaartuig, of, bij gebreke van dezelve, voor degene, die hun plaats
      vervult, in tegenwoordigheid van twee getuigen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel973
  - number: '974'
    text: |-
      In plaatsen, met welke alle gemeenschap, uit hoofde van de pest of andere besmettelijke ziekte, verboden is, of
      waar geen mogelijkheid bestaat om zich van het ministerie van een notaris te bedienen, kunnen de uiterste willen
      gemaakt worden voor elk openbaar ambtenaar, in tegenwoordigheid van twee getuigen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel974
  - number: '975'
    text: |-
      1 De uiterste willen, in de drie voorgaande artikelen vermeld, zullen door de erflaters, alsmede door degenen voor
      wie zij verleden zijn, en ten minste door een der getuigen, ondertekend moeten worden.

      2 Indien de erflater of een der getuigen verklaart, dat hij niet schrijven kan of belet wordt te tekenen, zal van
      die verklaring, alsmede van de oorzaak van het beletsel, in de akte uitdrukkelijk worden melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel975
  - number: '976'
    text: |-
      Deze uiterste willen zullen krachteloos zijn, indien de erflater komt te sterven zes maanden nadat de oorzaak,
      waarom dezelve in die vorm zijn gemaakt, heeft opgehouden.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel976
  - number: '977'
    text: |-
      In de gevallen, bij de [artikelen 972][ref1], [973][ref2] en [974][ref3] voorzien, kunnen de daarbij vermelde
      personen beschikken bij een onderhands stuk, mits hetzelve geheel door de hand des erflaters zij geschreven,
      gedagtekend en ondertekend.


      [ref1]: https://wetten.overheid.nl/BWBR0028746#Artikel972
      [ref2]: https://wetten.overheid.nl/BWBR0028746#Artikel973
      [ref3]: https://wetten.overheid.nl/BWBR0028746#Artikel974
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel977
    references:
      - id: ref1
        bwb_id: BWBR0028746
        artikel: '972'
        afdeling: Vierde
      - id: ref2
        bwb_id: BWBR0028746
        artikel: '973'
        afdeling: Vierde
      - id: ref3
        bwb_id: BWBR0028746
        artikel: '974'
        afdeling: Vierde
  - number: '978'
    text: |-
      Zodanige uiterste wil zal krachteloos zijn, indien de erflater is overleden drie maanden nadat de oorzaak, in
      voorzeide drie artikelen vermeld, heeft opgehouden, tenware dat stuk bij een notaris mocht zijn in bewaring
      gegeven, op de wijze als bij [artikel 958][ref1] is voorgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0028746#Artikel958
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel978
    references:
      - id: ref1
        bwb_id: BWBR0028746
        artikel: '958'
        afdeling: Vierde
  - number: '979'
    text: |-
      De formaliteiten, waaraan de onderscheiden uiterste willen, volgens de bepalingen van deze afdeling, onderworpen
      zijn, moeten worden in acht genomen, op straffe van nietigheid.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel979
  - number: '980'
    text: |-
      Erfstelling is een uiterste wilsbeschikking, waarbij de erflater aan een of meer personen de goederen geeft, welke
      hij bij zijn overlijden zal nalaten, hetzij in het geheel, hetzij voor een gedeelte, zoals de helft, een derde.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel980
  - number: '981'
    text: |-
      1 Bij het overlijden van de erflater, treden van rechtswege in het bezit van de nagelaten goederen, zowel de bij
      uiterste wil benoemde erfgenamen, als degenen aan wie de wet een gedeelte in de nalatenschap toekent.

      2 [Artikel 862][ref1] is op hen toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028746#Artikel862
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel981
    references:
      - id: ref1
        bwb_id: BWBR0028746
        artikel: '862'
        afdeling: Eerste
  - number: '982'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel982
  - number: '983'
    text: |-
      Een legaat is een bijzondere beschikking, waarbij de erflater aan een of meer personen zekere bepaalde goederen
      geeft, ofwel al zijn goederen van een zekere soort of het vruchtgebruik van alle of van een gedeelte zijner
      goederen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel983
  - number: '984'
    text: |-
      Alle zuivere en onvoorwaardelijke legaten geven, van de dag van het overlijden van de erflater af, aan de legataris
      het recht op verkrijging van het gelegateerde, welk recht op zijn erfgenamen of rechtverkrijgenden overgaat.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel984
  - number: '985'
    text: |-
      1 De legataris zal de afgifte van het gelegateerde aan de erfgenamen of legatarissen, die daarmede belast zijn,
      moeten vragen.

      2 Hij heeft recht op de vruchten of rente, van de dag van het overlijden van de erflater af, indien de eis tot
      afgifte binnen het jaar is gedaan, of indien die afgifte binnen hetzelfde tijdvak vrijwillig heeft plaatsgehad.
      Indien die eis later geschiedt, heeft hij slechts recht op de vruchten en de rente, te rekenen van de dag dat de
      eis gedaan is.

      3 Degenen op wie de schuld uit een legaat van een geldsom rust, komt niet in verzuim door het enkele verstrijken
      van een voor de voldoening bepaalde termijn.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel985
  - number: '986'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel986
  - number: '987'
    text: |-
      De belastingen, welke, onder welke benaming ook, op legaten ten behoeve van de Staat gelegd zijn, komen ten laste
      van de legataris, tenzij de erflater het tegendeel hebbe bevolen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel987
  - number: '988'
    text: |-
      Indien de erflater aan onderscheiden legatarissen de voldoening van een last heeft opgelegd, zijn zij daartoe
      gehouden, elk in evenredigheid van de hoegrootheid van zijn legaat, tenzij de erflater daaromtrent anders mocht
      hebben beschikt.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel988
  - number: '989'
    text: |-
      Het gelegateerde zal worden uitgekeerd met al hetgeen daartoe behoort, en in de staat, waarin het zich op de dag
      van het overlijden van de erflater bevindt.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel989
  - number: '990'
    text: |-
      1 Hetgeen echter de erflater, na het legateren van enige onroerende zaak of een beperkt recht waaraan deze is
      onderworpen, tot vergroting van die zaak heeft aangekocht of verkregen, is, al ware het ook daaraan grenzende, niet
      in het legaat begrepen, tenzij de erflater anders hadde bevolen.

      2 De verbeteringen, verfraaiingen of nieuwe opbouwingen, op de onroerende zaak door de erflater gemaakt, of de
      vergroting van de omtrek van een ingesloten grond, zullen zonder nieuwe beschikking gerekend worden een gedeelte
      van het legaat uit te maken.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel990
  - number: '991'
    text: |-
      Indien, vóór of na het maken van de uiterste wil, de gelegateerde zaak voor een schuld van de nalatenschap, of
      ook voor de schuld van een derde, bij hypotheek verbonden of met een vruchtgebruik belast is, is degene, die het
      legaat moet uitkeren, niet gehouden om het goed van dat verband te ontheffen, tenware hij bij een uitdrukkelijke
      beschikking van de erflater belast zij zulks te doen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel991
  - number: '992'
    text: |-
      Wanneer de erflater enig bepaald goed van een ander gelegateerd heeft, zal dit legaat nietig zijn, hetzij de
      erflater al dan niet geweten hebbe, dat dit goed hem niet toebehoorde.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel992
  - number: '993'
    text: |-
      De bepaling van het vorige artikel belet echter niet, dat aan de erfgenaam of legataris, als voorwaarde, de
      verplichting kan worden opgelegd, om aan derden zekere uitkeringen uit zijn eigen goederen te doen, of schulden
      kwijt te schelden.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel993
  - number: '994'
    text: |-
      Legaten van onbepaalde zaken, doch van een zeker geslacht, zijn bestaanbaar, hetzij de erflater zodanige zaken
      hebbe nagelaten of niet.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel994
  - number: '995'
    text: |-
      Wanneer het legaat in een onbepaalde zaak bestaat, is de erfgenaam niet verplicht de beste soort te geven, maar hij
      kan ook met het afgeven der slechtste niet volstaan.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel995
  - number: '996'
    text: |-
      Indien blotelijk de vruchten of inkomsten zijn gelegateerd, zonder dat de erflater het woord «vruchtgebruik»
      of «gebruik» heeft gebezigd, blijft het goed onder het beheer van de erfgenaam, die verplicht is de vruchten en
      inkomsten aan de legataris uit te keren.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel996
  - number: '997'
    text: |-
      Een legaat, aan een schuldeiser gemaakt, wordt niet gerekend tot afdoening der schuld te zijn nagelaten, zomin als
      een legaat, aan dienstboden gemaakt, kan geacht worden tot betaling van verdiend loon gegeven te zijn.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel997
  - number: '998'
    text: |-
      Wanneer de nalatenschap niet voor het geheel of een gedeelte is aanvaard, of wanneer dezelve is aanvaard onder
      het voorrecht van boedelbeschrijving, en de nagelaten goederen niet voldoende zijn om de legaten in hun geheel
      te voldoen, zullen al de legaten, in evenredigheid van hun hoegrootheid, worden verminderd, tenware de erflater
      daaromtrent anders mocht hebben beschikt.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel998
  - number: '999'
    text: |-
      1 De goederen, waarover ouders het recht van beschikking hebben, kunnen door hen, bij uiterste wil, geheel of
      gedeeltelijk, worden gegeven aan een of meer hunner kinderen, met last om die goederen uit te keren, zowel aan
      derzelver kinderen die reeds geboren zijn, als aan die welke nog geboren zullen worden.

      2 In geval van vooroverlijden van een kind, zal dezelfde beschikking kunnen worden gemaakt ten voordele van een of
      meer kleinkinderen, met last om de goederen aan hun kinderen, welke reeds geboren zullen worden, uit te keren.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel999
  - number: '1000'
    text: |-
      1 Insgelijks zal de uiterste wilsbeschikking bestaanbaar zijn ten voordele van een of meer broeders of zusters van
      de erflater, voor het geheel of een gedeelte der goederen, die bij de wet niet buiten beschikking gehouden zijn,
      onder de last om de goederen uit te keren, zowel aan de kinderen van zijn voorzeide broeders en zusters welke reeds
      geboren zijn, als aan die welke nog geboren zullen worden.

      2 Dezelfde beschikking kan worden gemaakt ten voordele van een of meer kinderen van vooroverleden broeders of
      zusters, onder de last om de goederen uit te keren, zowel aan derzelver kinderen die reeds geboren zijn, als aan
      die welke nog geboren zullen worden.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1000
  - number: '1001'
    text: |-
      1 Indien de bezwaarde erfgenaam sterft, met achterlating van kinderen in de eerste graad, en afkomelingen van een
      vooroverleden kind, zullen deze laatsten, bij plaatsvervulling, het aandeel van het vooroverleden kind genieten.

      2 Hetzelfde zal plaatshebben, indien, al de kinderen in de eerste graad vooroverleden zijnde, degene, die met de
      overgave belast is, niet dan kleinkinderen nalaat.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1001
  - number: '1002'
    text: |-
      De beschikkingen, bij de [artikelen 999][ref1] en [1000][ref2] toegelaten, zullen niet anders gelden dan voor
      zover de erfstelling over de hand slechts zal zijn gemaakt voor één graad, en ten voordele van al de kinderen van
      de bezwaarde persoon die reeds geboren zijn, en nog geboren zullen worden, zonder uitzondering of voorrang van
      ouderdom of kunne.


      [ref1]: https://wetten.overheid.nl/BWBR0028746#Artikel999
      [ref2]: https://wetten.overheid.nl/BWBR0028746#Artikel1000
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1002
    references:
      - id: ref1
        bwb_id: BWBR0028746
        artikel: '999'
        afdeling: Zevende
      - id: ref2
        bwb_id: BWBR0028746
        artikel: '1000'
        afdeling: Zevende
  - number: '1003'
    text: |-
      1 De rechten van de bij erfstelling over de hand geroepen erfgenamen nemen aanvang op het tijdstip dat het genot
      van de bezwaarde ophoudt.

      2 De vrijwillige afstand van het genot, ten voordele van de verwachters gedaan, zal geen nadeel kunnen toebrengen
      aan de schuldeisers van de bezwaarde persoon, wiens schuldvorderingen ouder dan deze afstand zijn, noch aan de
      kinderen, die na die afstand mochten geboren worden.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1003
  - number: '1004'
    text: |-
      1 Hij, die de, volgens de voorgaande artikelen, geoorloofde beschikkingen maakt, mag bij uiterste wil, of bij een
      latere notariële akte, het goed zelf, gedurende de tijd van het bezwaar, onder het beheer stellen van een of meer
      bewindvoerders.

      2 Op het bewind zijn de bepalingen omtrent het bewind over een vruchtgebruik van toepassing.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1004
  - number: '1005'
    text: |-
      Bij overlijden of bij gebreke van de gestelde bewindvoerder, benoemt de rechter in eerste aanleg, op verzoek van de
      bezwaarden of van andere belanghebbenden, of ook op vordering van het openbaar ministerie, een andere in de plaats
      van de ontbrekende.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1005
  - number: '1006'
    text: |-
      1 Binnen een maand na het overlijden van degene, die, onder de last van uitkering, over de goederen beschikt
      heeft, zal, op verzoek van de gestelde bewindvoerder, van de belanghebbende, of van het openbaar ministerie, een
      boedelbeschrijving worden gemaakt van al de goederen, die de nalatenschap uitmaken.

      2 Indien het gemaakte slechts in een legaat bestaat, zal er een bijzondere lijst worden gemaakt van al de daaronder
      begrepen voorwerpen.

      3 Deze boedelbeschrijving of lijst zal de begroting der goederen bevatten.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1006
  - number: '1007'
    text: |-
      1 De boedelbeschrijving of lijst zal gemaakt worden in tegenwoordigheid van de benoemde bewindvoerder en andere
      belanghebbenden, of dezen behoorlijk zijnde opgeroepen.

      2 Indien dezen bij de boedelbeschrijving tegenwoordig zijn, kan dezelve onder de hand geschieden; in welk geval dat
      stuk, binnen de tijd van veertien dagen na het voleindigen van de boedelbeschrijving, ter griffie van het gerecht
      in eerste aanleg moet worden overgebracht.

      3 De kosten, daarop vallende, komen ten laste der goederen, in de beschikking over de hand begrepen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1007
  - number: '1008'
    text: |-
      Indien de erflater geen bewindvoerder heeft benoemd, worden de goederen door de bezwaarde erfgenaam beheerd, en is
      deze verplicht zekerheid te stellen voor de bewaring, het behoorlijke gebruik en de wederoplevering der goederen,
      tenware de erflater hem uitdrukkelijk van alle verplichting tot het stellen van zekerheid hadde vrijgesteld.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1008
  - number: '1009'
    text: |-
      De bezwaarde erfgenaam, die, in het geval van het vorige artikel, geen zekerheid kan stellen, moet gedogen, dat
      de goederen, op verzoek van belanghebbenden, of op de vordering van het openbaar ministerie, worden gesteld onder
      het beheer van een bewindvoerder, door de rechter in eerste aanleg te benoemen. Op het beheer zijn de bepalingen
      omtrent het bewind over een vruchtgebruik van toepassing.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1009
  - number: '1010'
    text: |-
      De bezwaarde erfgenaam, die zelf het beheer heeft, moet het bezwaarde goed als een goed huisvader gebruiken, en
      staat daaromtrent, alsmede ten aanzien van het dragen van kosten en lasten, en het doen van reparatiën, gelijk met
      een vruchtgebruiker.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1010
  - number: '1011'
    text: |-
      1 De registergoederen, alsmede de renten en schuldvorderingen, mogen niet worden vervreemd of bezwaard dan op
      verlof van de rechter in eerste aanleg, na verhoor van de verwachter.

      2 Deze machtiging kan alleen verleend worden in geval van volstrekte noodzakelijkheid, of van blijkbaar voordeel,
      zowel van de verwachter als van de bezwaarde erfgenamen, en, in geval van vervreemding, tegen zekerheid van
      wederbelegging onder het fideï-commissair verband, indien de bezwaarde het goed zelf beheert.

      3 Indien de goederen onder bewind zijn gesteld, zijn de bewindvoerders verplicht de opbrengst te beleggen, op de
      voet als ten aanzien van voogden is voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1011
  - number: '1012'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1012
  - number: '1013'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1013
  - number: '1014'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1014
  - number: '1015'
    text: |-
      In geval van erfstelling of van legaat, op de voet als bij [artikel 908][ref1] is vermeld, is de bezwaarde
      erfgenaam of legataris bevoegd om het aan hem gemaakte te vervreemden en te verteren, en zelfs bij schenking onder
      de levenden daarover te beschikken, tenzij dit laatste door de erflater, voor het geheel of ten dele, mocht zijn
      verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0028746#Artikel908
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1015
    references:
      - id: ref1
        bwb_id: BWBR0028746
        artikel: '908'
        afdeling: Eerste
  - number: '1016'
    text: |-
      De verplichting tot het maken ener boedelbeschrijving of lijst, na het overlijden van de erflater, en tot het
      overbrengen van die stukken ter griffie van het gerecht in eerste aanleg, bij de [artikelen 1006][ref1] en
      [1007][ref2] voorgeschreven, is ook toepasselijk op de bezwaarde erfgenaam of legataris, van welke bij deze
      afdeling wordt gehandeld; doch hij is niet gehouden om enige zekerheid te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0028746#Artikel1006
      [ref2]: https://wetten.overheid.nl/BWBR0028746#Artikel1007
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1016
    references:
      - id: ref1
        bwb_id: BWBR0028746
        artikel: '1006'
        afdeling: Zevende
      - id: ref2
        bwb_id: BWBR0028746
        artikel: '1007'
        afdeling: Zevende
  - number: '1017'
    text: |-
      1 Na het overlijden van de bezwaarde erfgenaam of legataris heeft de verwachter het recht, om de dadelijke afgifte
      te vorderen van hetgeen van de erfenis of van het legaat in natura mocht zijn overgebleven.

      2 Ten aanzien van de gerede penningen of van de opbrengst der vervreemde goederen, kan uit aantekeningen van de
      bezwaarde erfgenaam of legataris, uit huiselijke papieren, of door alle andere bewijsmiddelen worden opgemaakt, of,
      en in hoeverre, er iets van de erfenis of van het legaat is overgebleven.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1017
  - number: '1018'
    text: |-
      Een uiterste wil kan, noch in zijn geheel, noch ten dele, herroepen worden dan bij een latere uiterste
      wilsbeschikking, of bij een bijzondere notariële akte, waarbij de erflater de gehele of gedeeltelijke intrekking
      van zijn vroegere uiterste wil te kennen geeft, onverminderd de bepaling van [artikel 960][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028746#Artikel960
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1018
    references:
      - id: ref1
        bwb_id: BWBR0028746
        artikel: '960'
        afdeling: Vierde
  - number: '1019'
    text: |-
      Indien een latere uiterste wil, welke de uitdrukkelijke herroeping van de vorige bevat, niet is voorzien van de
      formaliteiten, welke tot de deugdelijkheid van een uiterste wil worden vereist, maar wel van die, welke gevorderd
      worden tot de deugdelijkheid van een notariële akte, zullen de vroegere beschikkingen, welke in de latere akte
      mochten zijn herhaald, niet als herroepen worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1019
  - number: '1020'
    text: |-
      1 Een latere uiterste wil, waarbij de voorgaande niet op een uitdrukkelijke wijze herroepen wordt, vernietigt
      alleen de beschikkingen, in die vroegere uiterste wil vervat, welke met de nieuwe beschikkingen niet zijn overeen
      te brengen, of daarmede strijden.

      2 De bepaling van dit artikel is niet toepasselijk, wanneer de latere uiterste wil nietig is uit hoofde van gebrek
      in de vorm, al ware dezelve ook geldig als notariële akte.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1020
  - number: '1021'
    text: |-
      De herroeping, hetzij uitdrukkelijk, hetzij stilzwijgend, bij een latere uiterste wil gedaan, zal volkomen van
      kracht zijn, ofschoon die nieuwe akte buiten gevolg blijve door de onbevoegdheid van de gestelde erfgenaam of
      legataris, of door hun weigering om de erfenis te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1021
  - number: '1022'
    text: |-
      Alle vervreemding, zelfs bij verkoop met vermogen van wederinkoop, of bij verruiling, welke de erflater van het
      gelegateerde goed, geheel of gedeeltelijk, doet, zal de herroeping van het legaat, ten aanzien van al wat vervreemd
      of verruild is, met zich brengen, tenware het vervreemde goed in des erflaters boedel mocht zijn teruggekeerd.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1022
  - number: '1023'
    text: |-
      Alle beschikking bij uiterste wil gedaan, onder een voorwaarde, van een onzekere gebeurtenis afhangende, en van
      zodanige aard, dat de erflater gerekend moet worden aan het al of niet voorvallen dier gebeurtenis de uitvoering
      zijner beschikking verbonden te hebben, zal vervallen, indien de gestelde erfgenaam of legataris vóór de vervulling
      der voorwaarde komt te overlijden.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1023
  - number: '1024'
    text: |-
      Wanneer de voorwaarde, volgens de bedoeling van de erflater, alleen de uitvoering der beschikking opschort, belet
      zulks niet, dat de gestelde erfgenaam of legataris een verkregen recht hebbe, hetwelk hij aan zijn erfgenamen
      overdraagt.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1024
  - number: '1025'
    text: |-
      1 Een legaat vervalt, wanneer het gelegateerde goed, bij het leven van de erflater, geheel is tenietgegaan.

      2 Hetzelfde heeft ook plaats, indien het goed, na zijn dood, zonder toedoen of schuld van de erfgenaam of van
      andere personen, door welke het legaat verschuldigd is, teniet is gegaan, ofschoon dezen mochten hebben verzuimd
      dat goed op zijn tijd uit te keren, wanneer het, in handen van de legataris geweest zijnde, eveneens zoude zijn
      tenietgegaan.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1025
  - number: '1026'
    text: |-
      Een legaat van een rente, inschuld of andere schuldvordering op een derde, vervalt ten aanzien van hetgeen
      gedurende het leven van de erflater daarop mocht zijn betaald.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1026
  - number: '1027'
    text: |-
      1 Een beschikking, bij uiterste wil gedaan, vervalt, wanneer de gestelde erfgenaam of legataris de erfenis of het
      legaat verwerpt, of onbekwaam bevonden wordt om dezelve te genieten.

      2 Indien bij de beschikking voordelen aan derden waren gemaakt, zullen dezelve, in dat geval, niet vervallen, maar
      zal degene, aan wie de erfenis of het legaat opkomt, daarmede belast blijven, behoudens echter de bevoegdheid van
      deze, om van de erfenis of van het legaat gaaf en onvoorwaardelijk afstand te doen ten behoeve van degene, aan wie
      de voordelen waren besproken.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1027
  - number: '1028'
    text: |-
      1 Er zal aanwas plaatshebben ten voordele van de gestelde erfgenamen of legatarissen, ingeval de erfstelling
      of het legaat aan verscheidene personen gezamenlijk gemaakt is, en de beschikking ten opzichte van enigen der
      medeërfgenamen of medelegatarissen geen gevolg kan hebben.

      2 De erfstelling of het legaat zal geacht worden gezamenlijk gemaakt te zijn, wanneer het gemaakt is bij een en
      dezelfde beschikking, en de erflater niet aan elk der medeërfgenamen of medelegatarissen zijn bepaalde aandeel in
      het goed heeft aangewezen, zoals de helft, een derde deel, enz.

      3 De uitdrukking «voor gelijke aandelen» of «gedeelten» wordt niet geacht een aanwijzing te zijn van een zodanig
      bepaald aandeel, als waarvan in dit artikel gesproken wordt.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1028
  - number: '1029'
    text: |-
      Voorts zal de erflater mede geacht worden gezamenlijk gelegateerd te hebben, wanneer een zaak, die zonder schade te
      lijden niet voor verdeling vatbaar is, bij dezelfde akte aan onderscheiden personen, al ware het ook afzonderlijk,
      is gemaakt geworden.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1029
  - number: '1030'
    text: |-
      De vervallenverklaring van uiterste wilsbeschikkingen kan, na de dood des erflaters, worden gevraagd, ter zake van
      het niet ten uitvoer brengen der voorwaarden.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1030
  - number: '1031'
    text: |-
      1 Een erflater mag, hetzij bij uiterste wil, hetzij bij zodanige onderhandse akte als bij [artikel 961][ref1]
      vermeld is, hetzij bij een bijzondere notariële akte, een of meer uitvoerders van zijn uiterste wilsbeschikking
      aanstellen.

      2 Hij kan ook verscheidene personen benoemen, ten einde bij ontstentenis elkander als uitvoerders op te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0028746#Artikel961
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1031
    references:
      - id: ref1
        bwb_id: BWBR0028746
        artikel: '961'
        afdeling: Vierde
  - number: '1032'
    text: |-
      Handelingsonbekwamen, zij van wie een of meer goederen onder een bewind als bedoeld in [titel 19 van Boek 1][ref1]
      zijn gesteld, en zij die in staat van faillissement verkeren, kunnen niet uitvoerder van uiterste wilsbeschikkingen
      zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028743
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1032
    references:
      - id: ref1
        bwb_id: BWBR0028743
  - number: '1033'
    text: |-
      1 Aan de uitvoerders van uiterste wilsbeschikkingen kan door de erflater de bezitneming van al de goederen der
      nalatenschap, of van een bepaald gedeelte daarvan, worden gegeven.

      2 Het bezit zal van rechtswege niet langer duren dan één jaar, te rekenen van de dag waarop de uitvoerders zich in
      het bezit hebben kunnen stellen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1033
  - number: '1034'
    text: |-
      Indien al de erfgenamen het daaromtrent eens zijn, kunnen zij het bezit doen ophouden, mits zij de uitvoerders der
      uiterste wilsbeschikking in staat stellen tot de betaling of afgifte der zuivere en onvoorwaardelijke legaten, of
      doen blijken dat die legaten reeds zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1034
  - number: '1035'
    text: |-
      De uitvoerders ener uiterste wilsbeschikking moeten de nalatenschap doen verzegelen, indien er minderjarige of
      onder curatele gestelde erfgenamen zijn, welke op het overlijden van de erflater van geen voogden of curators zijn
      voorzien, of zodanige erfgenamen, welke noch in persoon noch bij gemachtigde tegenwoordig zijn.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1035
  - number: '1036'
    text: |-
      Zij moeten een boedelbeschrijving doen opmaken van de goederen der nalatenschap, in tegenwoordigheid, of na
      bij behoorlijk exploit gedane oproeping der erfgenamen, welke zich binnen het eiland, waarop de nalatenschap is
      opengevallen, bevinden.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1036
  - number: '1037'
    text: |-
      Zij dragen zorg dat des overledenen uiterste wil worde ten uitvoer gelegd, en zij kunnen, in geval van geschil, in
      rechten optreden om de geldigheid van de uiterste wil staande te houden.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1037
  - number: '1038'
    text: |-
      1 Indien de vereiste penningen niet voorhanden zijn tot het uitkeren der legaten, hebben de uitvoerders de
      bevoegdheid om de goederen des boedels, in het openbaar, en volgens de gebruiken der plaats, te doen verkopen;
      alles tenware de erfgenamen mochten goedvinden om het nodige voorschot van penningen te doen. Voor de verkoop van
      registergoederen behoeven de uitvoerders de toestemming der erfgenamen of, bij gebreke daarvan, de machtiging van
      de rechter in eerste aanleg.

      2 Die verkoop zal ook onder de hand kunnen geschieden, indien al de erfgenamen het daaromtrent zijn eens geworden,
      behoudens de bepalingen ten opzichte van minderjarigen en onder curatele gestelde personen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1038
  - number: '1039'
    text: |-
      1 De uitvoerders zijn bevoegd, in het openbaar en met inachtneming der plaatselijke gebruiken, zodanige roerende
      goederen te verkopen, die aan bederf onderhevig zijn, of uit anderen hoofde niet zonder schade voor de boedel
      kunnen worden aangehouden.

      2 De onderhandse verkoop dier goederen kan alleen geschieden in het geval bij het tweede lid van het vorige artikel
      omschreven.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1039
  - number: '1040'
    text: |-
      De uitvoerders, die het bezit van de nalatenschap hebben, zijn bevoegd om, zelfs in rechten, de schulden in te
      vorderen, welke, gedurende dat bezit, vervallen en opeisbaar zijn.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1040
  - number: '1041'
    text: |-
      Zij hebben geen bevoegdheid om de goederen der nalatenschap te verkopen, ten einde dezelve tot verdeling
      te brengen, maar zijn verplichten om, bij het eindigen van hun beheer, aan de belanghebbenden rekening en
      verantwoording te doen, met uitkering van al de goederen des boedels, benevens het slot der rekening, ten einde
      tussen de erfgenamen verdeeld te worden. In het maken der verdeling moeten zij de erfgenamen behulpzaam zijn,
      indien dezen zulks vorderen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1041
  - number: '1042'
    text: De macht van de uitvoerder eens uitersten wils gaat niet tot zijn erfgenamen over.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1042
  - number: '1043'
    text: |-
      Indien er verscheidene uitvoerders van een uiterste wilsbeschikking zijn, die deze last aangenomen hebben, kan één
      hunner, bij gebreke van de andere, alleen werkzaam zijn, en zij zijn ieder voor het geheel ter zake van hun beheer
      aansprakelijk, tenware de erflater hun werkzaamheden mocht verdeeld hebben, en dat ieder hunner zich binnen de
      kring der hem opgedragen bemoeienissen hebbe gehouden.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1043
  - number: '1044'
    text: |-
      De onkosten, door de uitvoerder ener uiterste wilsbeschikking gemaakt, voor de verzegeling, de boedelbeschrijving,
      de rekening en verantwoording, en de overige tot zijn werkzaamheden betrekkelijke zaken, komen ten laste der
      nalatenschap.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1044
  - number: '1045'
    text: |-
      Elke bepaling, waarbij de erflater bevolen heeft, dat de uitvoerder zijns uitersten wils van het opmaken ener
      boedelbeschrijving, of van het afleggen van rekening en verantwoording zal zijn ontheven, is van rechtswege nietig.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1045
  - number: '1046'
    text: |-
      1 Onverminderd het reeds bepaalde voor het geval van vruchtgebruik, van erfstellingen over de hand, en van
      minderjarigen en onder curatele gestelden, mag de erflater bij uiterste wil, of bij een bijzondere notariële
      akte, een of meer bewindvoerders aanstellen, ten einde de goederen, aan zijn erfgenamen of legatarissen nagelaten,
      gedurende derzelver leven, of gedurende een bepaalde tijd, te beheren, mits hierdoor geen inbreuk worde gemaakt op
      de vrije uitkering van het wettelijk aandeel der erfgenamen.

      2 De bepalingen van [artikel 1048][ref1] zijn op dit geval toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028746#Artikel1048
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1046
    references:
      - id: ref1
        bwb_id: BWBR0028746
        artikel: '1048'
  - number: '1047'
    text: |-
      Indien de erflater geen personen heeft aangewezen, welke in de plaats van de ontbrekende bewindvoerders zullen
      optreden, wordt daarin door de rechter in eerste aanleg voorzien.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1047
  - number: '1048'
    text: |-
      1 Niemand is gehouden de last van uitvoerder ener uiterste wilsbeschikking, of van bewindvoerder ener erfenis of
      eens legaats, aan te nemen, doch hij, die zodanige last heeft aanvaard, is verplicht dezelve te voleindigen.

      2 Indien de erflater aan de uitvoerder voor de waarneming zijner werkzaamheden geen bepaalde beloning heeft
      toegekend, of geen bijzonder legaat daarvoor aan dezelve gemaakt heeft, is laatstgemelde voor zich, of, meer dan
      één uitvoerder benoemd zijnde, zijn zij bevoegd voor hen tezamen als loon in rekening te brengen twee en een half
      ten honderd der ontvangsten en anderhalf ten honderd der uitgaven.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1048
  - number: '1049'
    text: |-
      De uitvoerders van uiterste wilsbeschikkingen, mitsgaders de bewindvoerders bij [artikel 1046][ref1] vermeld,
      kunnen om dezelfde redenen als de voogden worden afgezet.


      [ref1]: https://wetten.overheid.nl/BWBR0028746#Artikel1046
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1049
    references:
      - id: ref1
        bwb_id: BWBR0028746
        artikel: '1046'
  - number: '1050'
    text: |-
      1 Alle personen, aan welke een erfenis is opgekomen, en die verkiezen mochten om de gesteldheid der nalatenschap
      te onderzoeken, ten einde te kunne beoordelen, of het van hun belang is dezelve, hetzij zuiver, hetzij onder het
      voorrecht van boedelbeschrijving, te aanvaarden, ofwel te verwerpen, zullen het recht hebben om zich te beraden, en
      daarvan een verklaring moeten afleggen ter griffie van het gerecht in eerste aanleg, binnen welks rechtsgebied de
      erfenis is opengevallen; zullende die verklaring in het daartoe bestemde register worden ingeschreven.

      2 Een authentiek afschrift der opgemaakte akte wordt door de rechter in eerste aanleg, zodra mogelijk, opgezonden
      naar de griffie van het Gemeenschappelijk Hof van Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire, Sint
      Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1050
  - number: '1051'
    text: |-
      1 Aan de erfgenaam wordt, te rekenen van de dag der afgelegde verklaring, een tijdvak van vier maanden vergund, ten
      einde de boedel te doen beschrijven en zich te beraden.

      2 Niettemin is de rechter in eerste aanleg bevoegd om, wanneer de erfgenaam in rechten vervolgd wordt, uit hoofde
      van dringende redenen, de hierboven bepaalde termijn te verlengen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1051
  - number: '1052'
    text: |-
      1 Gedurende de voorschreven termijn kan de erfgenaam, die zich beraadt, niet worden genoodzaakt de hoedanigheid
      van erfgenaam aan te nemen. Geen rechterlijke veroordeling kan tegen hem worden verkregen, en de uitvoering van de
      vonnissen, die ten laste van de overledene zijn uitgesproken, blijft opgeschort.

      2 Hij is verplicht, evenals een goed huisvader, voor het behoud der goederen van de nalatenschap zorg te dragen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1052
  - number: '1053'
    text: |-
      1 De erfgenaam, die zich beraadt, is bevoegd om aan de rechter in eerste aanleg verlof te vragen, ten einde al
      zodanige voorwerpen te verkopen, welke niet behoeven of niet kunnen worden bewaard, mitsgaders om al zulke daden te
      verrichten, die geen uitstel dulden.

      2 De wijze van verkoop zal bij het rechterlijk verlof worden bepaald.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1053
  - number: '1054'
    text: |-
      De rechter in eerste aanleg kan, op verzoek der belanghebbende partijen, al zodanige maatregelen voorschrijven,
      welke hij mocht nodig achten, zowel tot behoud van de goederen der nalatenschap, als van de belangen van derden.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1054
  - number: '1055'
    text: |-
      1 Na verloop van de termijn bij [artikel 1051][ref1] bepaald, kan de erfgenaam worden genoodzaakt de nalatenschap
      te verwerpen of dezelve te aanvaarden, hetzij zuiver, hetzij onder het voorrecht van boedelbeschrijving. In het
      laatste geval moet daarvan een verklaring worden afgelegd, op dezelfde wijze als bij [artikel 1050][ref2] is
      vastgesteld.

      2 Het bepaalde bij het [tweede lid van artikel 1050][ref3] is in dit geval mede van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028746#Artikel1051
      [ref2]: https://wetten.overheid.nl/BWBR0028746#Artikel1050
      [ref3]: https://wetten.overheid.nl/BWBR0028746#Artikel1050
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1055
    references:
      - id: ref1
        bwb_id: BWBR0028746
        artikel: '1051'
      - id: ref2
        bwb_id: BWBR0028746
        artikel: '1050'
      - id: ref3
        bwb_id: BWBR0028746
        artikel: '1050'
  - number: '1056'
    text: |-
      Zelfs na verloop van de termijn, behoudt de erfgenaam het vermogen om de boedel te doen beschrijven, en dezelve
      onder het voorrecht van boedelbeschrijving te aanvaarden, tenzij hij zich als zuiver erfgenaam hebbe gedragen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1056
  - number: '1057'
    text: |-
      De erfgenaam verliest het voorrecht van boedelbeschrijving, en wordt als zuiver erfgenaam beschouwd:

      1°. indien hij willens en wetens, en te kwader trouw, enige goederen, tot de nalatenschap behorende, niet op de
      boedelbeschrijving heeft gebracht;

      2°. indien hij zich aan verduistering van goederen, tot de erfenis behorende, heeft schuldig gemaakt.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1057
  - number: '1058'
    text: |-
      Het voorrecht van boedelbeschrijving heeft ten gevolge:

      1°. dat de erfgenaam niet verder tot de betaling der schulden en lasten der nalatenschap gehouden is, dan ten
      belope der waarde van de goederen, welke dezelve bevat, en zelfs, dat hij zich van die betaling kan ontslaan, door
      al de goederen, tot de nalatenschap behorende, aan de beschikking der schuldeisers en legatarissen over te laten;

      2°. dat de eigen goederen van de erfgenaam niet met die der nalatenschap worden vermengd, en dat hij het recht
      behoudt om zijn eigen inschulden tegen de nalatenschap te doen gelden;

      3°. dat de erfgenaam die een schuld der nalatenschap uit zijn overig vermogen heeft voldaan, optreedt als
      schuldeiser van de nalatenschap voor het bedrag van die schuld in de rang die zij had.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1058
  - number: '1059'
    text: |-
      De erfgenaam, die de nalatenschap onder het voorrecht van boedelbeschrijving heeft aanvaard, is verplicht de
      daartoe behorende goederen als een goed huisvader te besturen, en de nalatenschap zodra mogelijk, tot effenheid te
      brengen; hij is aan de schuldeisers en legatarissen verantwoording verschuldigd.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1059
  - number: '1060'
    text: |-
      1 Hij vermag de goederen der nalatenschap op geen andere wijze te verkopen dan in het openbaar, en volgens de
      gebruiken der plaats.

      2 De artikelen 57 tot en met 59 van het Faillissementsbesluit 1931 zijn van overeenkomstige toepassing; tegen de
      gegeven beschikkingen staat geen rechtsmiddel open.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1060
  - number: '1061'
    text: |-
      1 Op verzoek van een belanghebbende kan de rechter in eerste aanleg een of meer erfgenamen van een nalatenschap
      die beneficiair is aanvaard, gelasten zekerheid te stellen voor hun beheer en de nakoming van hun overige
      verplichtingen. De rechter in eerste aanleg stelt het bedrag en de aard van de zekerheid vast.

      2 Komt de erfgenaam zijn verplichting tot het stellen van zekerheid niet na, dan kan de rechter in eerste aanleg op
      verzoek van een belanghebbende een of meer vereffenaars benoemen. De bepalingen van de dertiende titel betreffende
      de uitvoerders van uiterste wilsbeschikkingen zijn op de vereffenaars zoveel mogelijk van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1061
  - number: '1062'
    text: |-
      Binnen de tijd van drie maanden, te rekenen van het verloop des termijns bij [artikel 1051][ref1] bepaald, zal
      de erfgenaam verplicht zijn om, door middel van een aankondiging in een der in de openbare lichamen Bonaire, Sint
      Eustatius of Saba verschijnende nieuwsbladen, alsmede door aanplakking aan het gebouw van het gerecht in eerste
      aanleg, de onbekende schuldeisers op te roepen, ten einde zowel aan dezen, als aan degenen die bekend zijn, en
      aan de legatarissen, dadelijk rekening en verantwoording van zijn beheer af te leggen, en hun schuldvorderingen en
      legaten te voldoen, voor zover het bedrag der nalatenschap toereikend zal zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028746#Artikel1051
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1062
    references:
      - id: ref1
        bwb_id: BWBR0028746
        artikel: '1051'
  - number: '1063'
    text: |-
      1 Na het aanzuiveren der rekening en verantwoording, zal de erfgenaam aan de schuldeisers, welke op dat
      tijdstip mochten bekend zijn, hun vorderingen, hetzij in het geheel, hetzij in evenredigheid van het beloop der
      nalatenschap, moeten voldoen.

      2 De schuldeisers, die na de uitdeling opkomen, zullen, naarmate dat zij zich aanmelden, alleen uit de onverkochte
      goederen en het overschot worden betaald.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1063
  - number: '1064'
    text: |-
      Indien er enig verzet plaatsheeft, kunnen de schuldeisers niet worden voldaan, dan tengevolge ener rangschikking
      door de rechter te regelen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1064
  - number: '1065'
    text: |-
      1 De legatarissen kunnen de voldoening van hun legaten niet eisen, dan na verloop van de bij [artikel 1062][ref1]
      bepaalde termijn, en na de uitbetaling waarvan bij [artikel 1063][ref2] gesproken wordt.

      2 De schuldeisers, die na de voldoening der legaten opkomen, hebben alleen hun verhaal tegen de legatarissen.

      3 Dat verhaal verjaart door een verloop van drie jaren na de dag, op welke de uitbetaling aan de legataris heeft
      plaatsgehad.


      [ref1]: https://wetten.overheid.nl/BWBR0028746#Artikel1062
      [ref2]: https://wetten.overheid.nl/BWBR0028746#Artikel1063
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1065
    references:
      - id: ref1
        bwb_id: BWBR0028746
        artikel: '1062'
      - id: ref2
        bwb_id: BWBR0028746
        artikel: '1063'
  - number: '1066'
    text: |-
      1 De erfgenaam, die de nalatenschap onder het voorrecht van boedelbeschrijving heeft aanvaard, kan niet vroeger in
      zijn eigen goederen worden aangesproken, dan nadat hij, tot het afleggen zijner rekening zijnde aangemaand, mocht
      zijn in gebreke gebleven aan die verplichting te voldoen.

      2 Na het aanzuiveren der rekening zijn zijn eigen goederen alleen aansprakelijk voor de voldoening der geldsommen,
      welke, van de nalatenschap afkomstig, in zijn handen zijn gekomen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1066
  - number: '1067'
    text: |-
      De kosten van verzegeling, van boedelbeschrijving, van het opmaken der rekening, mitsgaders alle andere, die op een
      wettige wijze gemaakt zijn, komen ten laste der nalatenschap.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1067
  - number: '1068'
    text: |-
      De bepalingen van de [artikelen 1051][ref1], [1057][ref2] en volgende zijn insgelijks toepasselijk op erfgenamen,
      die, zonder zich van het recht van beraad bediend te hebben, een erfenis onder het voorrecht van boedelbeschrijving
      aanvaard hebben, door de verklaring af te leggen bij het slot van [artikel 1055][ref3] vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028746#Artikel1051
      [ref2]: https://wetten.overheid.nl/BWBR0028746#Artikel1057
      [ref3]: https://wetten.overheid.nl/BWBR0028746#Artikel1055
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1068
    references:
      - id: ref1
        bwb_id: BWBR0028746
        artikel: '1051'
      - id: ref2
        bwb_id: BWBR0028746
        artikel: '1057'
      - id: ref3
        bwb_id: BWBR0028746
        artikel: '1055'
  - number: '1069'
    text: |-
      Een bepaling, waarbij de erflater zoude hebben verboden om van het recht van beraad en van het voorrecht van
      boedelbeschrijving gebruik te maken, is nietig en van onwaarde.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1069
  - number: '1070'
    text: Een erfenis kan of zuiver, of onder het voorrecht van boedelbeschrijving worden aanvaard.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1070
  - number: '1071'
    text: Niemand is gehouden een hem opgekomen erfenis te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1071
  - number: '1072'
    text: |-
      Erfenissen, aan minderjarige en onder curatele gestelde personen opgekomen, kunnen niet wettiglijk worden aanvaard,
      dan met inachtneming der wetsbepalingen, welke die personen betreffen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1072
  - number: '1073'
    text: Het aanvaarding ener erfenis heeft een terugwerkende kracht tot op de dag, waarop dezelve is opengevallen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1073
  - number: '1074'
    text: |-
      De aanvaarding ener erfenis geschiedt uitdrukkelijk of stilzwijgend; dezelve geschiedt uitdrukkelijk, wanneer
      men in een authentiek of onderhands geschrift de titel of de hoedanigheid van erfgenaam aanneemt; de aanvaarding
      geschiedt stilzwijgend, wanneer de erfgenaam een daad verricht, welke zijn mening om de erfenis te aanvaarden
      noodzakelijk aan den dag legt, en waartoe hij slechts in zijn hoedanigheid als erfgenaam zoude zijn bevoegd
      geweest.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1074
  - number: '1075'
    text: |-
      Al hetgeen tot de begrafenis betrekking heeft, de daden dienende alleen tot bewaring, alsook die, welke strekken
      om op de nalatenschap toezicht te hebben, of dezelve bij voorraad te beheren, worden niet gerekend daden te zijn,
      welke de stilzwijgende aanvaarding ener erfenis kenschetsen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1075
  - number: '1076'
    text: |-
      1 Indien erfgenamen verschillen omtrent het al of niet aanvaarden ener erfenis, kan de ene dezelve aanvaarden, en
      de andere die verwerpen.

      2 Indien erfgenamen verschillen omtrent de wijze van aanvaarding ener erfenis, wordt dezelve onder voorrecht van
      boedelbeschrijving aanvaard.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1076
  - number: '1077'
    text: |-
      Wanneer iemand, aan wie een erfenis is opgekomen, overleden is zonder die verworpen of aanvaard te hebben, zijn
      deszelfs erfgenamen bevoegd de erfenis in zijn plaats te aanvaarden of te verwerpen, en de bepaling van het
      voorgaande artikel is op hen toepasselijk.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1077
  - number: '1078'
    text: |-
      Hij, die voor zijn erfdeel een erfenis heeft aanvaard, vermag het aandeel niet te verwerpen, hetwelk hem door recht
      van aanwas is opgekomen, behalve in het geval bij [artikel 1080][ref1] voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0028746#Artikel1080
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1078
    references:
      - id: ref1
        bwb_id: BWBR0028746
        artikel: '1080'
        afdeling: Eerste
  - number: '1079'
    text: |-
      Een aanvaarding is vatbaar voor vernietiging op grond van dwaling, indien de erfenis meer dan de helft is
      verminderd ten gevolge der ontdekking van een op het ogenblik der aanvaarding onbekende uiterste wilsbeschikking.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1079
  - number: '1080'
    text: |-
      Het aandeel van een erfgenaam behoort na de vernietiging van zijn aanvaarding niet door aanwas aan zijn mede-
      erfgenamen, dan voor zover zij het aanvaarden.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1080
  - number: '1081'
    text: |-
      De bevoegdheid om een erfenis te aanvaarden verjaart door het verloop van dertig jaren, te rekenen van de dag
      waarop dezelve is opengevallen, mits vóór of na het verloop van dat tijdvak de nalatenschap aanvaard zij door een
      van degenen, die door de wet, of door een uiterste wil, daartoe geroepen zijn, onverminderd echter de rechten van
      derden op de nalatenschap, door enige wettige titel verkregen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1081
  - number: '1082'
    text: |-
      De erfgenaam, die de erfenis verworpen heeft, kan dezelve nog aanvaarden, zolang zij nog niet door degenen, welke
      door de wet of door een uiterste wil geroepen worden, aanvaard is, behoudens de rechten van derden, zoals bij het
      voorgaande artikel gezegd is.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1082
  - number: '1083'
    text: |-
      1 Het verwerpen ener erfenis moet uitdrukkelijk geschieden, en moet plaatshebben door middels ener verklaring,
      afgelegd ter griffie van het gerecht in eerste aanleg, onder welks ressort de erfenis opengevallen is.

      2 Het bepaalde bij het [tweede lid van artikel 1050][ref1] is hier van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028746#Artikel1050
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1083
    references:
      - id: ref1
        bwb_id: BWBR0028746
        artikel: '1050'
  - number: '1084'
    text: De erfgenaam, die de erfenis verwerpt, wordt geacht nooit erfgenaam geweest te zijn.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1084
  - number: '1085'
    text: |-
      Het erfdeel van degene, die de erfenis verwerpt, vervalt aan degenen, die tot hetzelve zouden zijn geroepen, indien
      degene, die verwerpt, bij het overlijden des erflaters niet in leven ware geweest.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1085
  - number: '1086'
    text: |-
      Hij, die een erfenis verworpen heeft, kan nimmer bij plaatsvervulling vertegenwoordigd worden; indien hij de enige
      erfgenaam in zijn graad is, of indien al de erfgenamen de erfenis verwerpen, komen de kinderen uit eigen hoofde, en
      erven bij gelijke delen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1086
  - number: '1087'
    text: |-
      1 De schuldeisers van degene, die ten nadele hunner rechten een erfenis heeft verworpen, kunnen zich door de
      rechter in eerste aanleg doen machtigen om de nalatenschap in naam van hun schuldenaar, in zijn plaats en voor hem
      te aanvaarden.

      2 In dat geval wordt de verwerping der erfenis niet verder dan ten voordele der schuldeisers, en ten belope van
      hun schuldvorderingen, vernietigd; dezelve is geenszins nietig ten voordele van de erfgenaam, die de erfenis heeft
      verworpen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1087
  - number: '1088'
    text: De bevoegdheid om een erfenis te verwerpen kan door geen verjaring verloren gaan.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1088
  - number: '1089'
    text: |-
      Men kan, zelfs bij huwelijkse voorwaarden, geen afstand doen van de erfenis van iemand, die nog in leven is, noch
      de rechten vervreemden, welke men bij vervolg van tijd op zodanige erfenis mocht kunnen verkrijgen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1089
  - number: '1090'
    text: |-
      Erfgenamen, welke goederen, tot een nalatenschap behorende, hebben te zoek gemaakt of verborgen gehouden, verliezen
      de bevoegdheid om de erfenis te verwerpen; zij blijven zuivere erfgenamen, niettegenstaande hun verwerping, zonder
      dat zij enig deel in het te zoek gemaakte of verborgene mogen vorderen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1090
  - number: '1091'
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1091
