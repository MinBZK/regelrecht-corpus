  - number: '1110'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1110
  - number: '1111'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1111
  - number: '1112'
    text: |-
      De erfgenamen moeten alle schenkingen onder de levenden, welke zij van de erflater hebben genoten, inbrengen en wel
      als volgt:

      1° door de erfgenamen in de nederdalende linie, hetzij dezelve de nalatenschap zuiver, of onder het voorrecht van
      boedelbeschrijving hebben aanvaard, en hetzij dezelve slechts tot het wettelijk erfdeel of tot meer zijn geroepen;
      tenware de giften met uitdrukkelijke vrijstelling van inbreng zijn gedaan, of de begiftigden bij een authentieke
      akte, of bij uiterste wil, van de verplichting tot inbreng zijn ontheven;

      2° door alle andere erfgenamen, hetzij bij versterf, hetzij bij uiterste wil, doch alleen in het geval dat de
      erflater of schenker de inbreng uitdrukkelijk heeft bevolen of bedongen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1112
  - number: '1113'
    text: |-
      De erfgenaam, die de erfenis verwerpt, is niet gehouden in te brengen hetgeen aan hem geschonken is, dan ter
      aanvulling van zodanig gedeelte als waardoor het wettelijk erfdeel zijner medeërfgenamen mocht verkort zijn.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1113
  - number: '1114'
    text: |-
      Indien de inbreng meer bedraagt dan het erfdeel, behoeft dat meerdere niet te worden ingebracht, onverminderd het
      bepaalde bij het [vorige artikel][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028746#Artikel1113
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1114
    references:
      - id: ref1
        bwb_id: BWBR0028746
        artikel: '1113'
        afdeling: Tweede
  - number: '1115'
    text: |-
      1 De ouders behoeven de giften niet in te brengen, die aan hun kind door deszelfs grootouders gedaan zijn.

      2 Op gelijke wijze behoeft een kind, dat uit eigen hoofde de erfenis zijner grootouders beurt, niet in te brengen
      de door dezen aan zijn ouders gedane gift.

      3 Daarentegen moet het kind, dat slechts bij plaatsvervulling die erfenis beurt, de giften inbrengen, welke aan
      zijn ouders gedaan zijn, zelfs indien het kind de nalatenschap zijner ouders mocht hebben verworpen.

      4 Het kind is echter, in geval van zodanige verwerping, niet jegens zijn medeërfgenamen in de grootouderlijke
      nalatenschap aansprakelijk voor de schulden zijner ouders.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1115
  - number: '1116'
    text: |-
      1 Giften, welke aan de ene echtgenoot door een der ouders van de andere echtgenoot gedaan zijn, zijn zelfs voor de
      helft niet aan inbreng onderworpen, al ware het ook, dat de geschonken voorwerpen in de gemeenschap vielen.

      2 Indien de giften gezamenlijk aan de beide echtgenoten door de vader of de moeder van een hunner gedaan zijn, moet
      de inbreng voor de helft plaatshebben.

      3 Wanneer de giften aan de echtgenoot door zijn eigen vader of zijn eigen moeder gedaan zijn, moet hij dezelve voor
      het geheel inbrengen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1116
  - number: '1117'
    text: |-
      1 De inbreng geschiedt alleen in de nalatenschap des schenkers; dezelve is slechts door de ene erfgenaam ten
      behoeve van de andere verschuldigd.

      2 Ten behoeve van legatarissen of van schuldeisers van de boedel heeft geen inbreng plaats.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1117
  - number: '1118'
    text: |-
      Inbreng geschiedt, hetzij door het genotene in natura in de boedel terug te brengen, hetzij door zoveel minder dan
      de andere deelgenoten te ontvangen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1118
  - number: '1119'
    text: |-
      1 De inbreng van goederen kan geschieden ter keuze des inbrengers, hetzij door dezelve in natura terug te geven,
      zoals zij zich op het ogenblik van de inbreng bevonden, hetzij door het inbrengen der waarde, welke zij ten tijde
      der gift hadden.

      2 In het eerste geval is de inbrenger verantwoordelijk voor de vermindering, welke de goederen door zijn schuld
      hebben ondergaan, en verplicht om dezelve te zuiveren van de beperkte rechten die hij daarop heeft gevestigd.

      3 De inbrenger heeft recht op vergoeding van de door hem gemaakte kosten die hij niet zou hebben gedragen, indien
      hij vruchtgebruiker was geweest.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1119
  - number: '1120'
    text: |-
      De inbreng van gereed geld geschiedt ter keuze des inbrengers door de betaling van deszelfs bedrag, of door zich
      dat bedrag in mindering van zijn erfdeel te doen aanbedelen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1120
  - number: '1121'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1121
  - number: '1122'
    text: |-
      Behalve de schenkingen, in [artikel 1112][ref1] aan inbreng onderworpen, moet ook worden ingebracht al hetgeen
      is verstrekt om aan de erfgenaam een stand, een beroep of bedrijf te verschaffen, of ter betaling van deszelfs
      schulden, en al hetgeen ten huwelijk is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0028746#Artikel1112
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1122
    references:
      - id: ref1
        bwb_id: BWBR0028746
        artikel: '1112'
        afdeling: Tweede
  - number: '1123'
    text: |-
      Aan inbreng zijn niet onderworpen:

      de kosten van verzorging en opvoeding;

      de uitkeringen tot noodzakelijk levensonderhoud;

      de uitgaven tot het aanleren van enige tak van koophandel, kunst, handwerk of bedrijf;

      de kosten van studie;

      de kosten tot plaatsvervanging of nummerverwisseling in ‘s de krijgsmacht van het Koninkrijk;

      de bruiloftskosten, klederen en kleinoden tot huwelijksuitzet gegeven.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1123
  - number: '1124'
    text: |-
      De rente en vruchten van hetgeen aan inbreng is onderworpen worden eerst verschuldigd van de dag, dat een erfenis
      is opengevallen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1124
  - number: '1125'
    text: Al hetgeen door toeval en zonder schuld van de begiftigde is verloren gegaan, behoeft niet te worden ingebracht.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1125
  - number: '1126'
    text: |-
      De erfgenamen, die een erfenis hebben aanvaard, moeten in de betaling der schulden, legaten en andere lasten zoveel
      dragen, als in evenredigheid staat met hetgeen ieder uit de nalatenschap ontvangt.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1126
  - number: '1127'
    text: |-
      Zij zijn tot die betaling persoonlijk, en ieder naarmate van de hoegrootheid van zijn erfdeel, gehouden,
      onverminderd de rechten der schuldeisers op de gehele nalatenschap, zolang die nog is onverdeeld, mitsgaders die
      der hypothecaire schuldeisers.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1127
  - number: '1128'
    text: |-
      1 Indien tot de nalatenschap behorende goederen met pand of hypotheek bezwaard zijn, heeft ieder der medeërfgenamen
      het recht om te vorderen, dat die lasten uit de boedel worden gekweten, en de goederen van het verband bevrijd,
      alvorens er tot het vormen der kavelingen worde overgegaan.

      2 Wanneer de erfgenamen de nalatenschap verdelen in de staat waarin zij zich bevindt, moet het bezwaarde goed
      worden geschat op dezelfde voet als de overige goederen; alsdan wordt de hoofdsom der lasten van de gehele prijs
      des goeds afgetrokken, en de erfgenaam, aan wie het goed te beurt is gevallen, blijft alsdan alleen ten aanzien
      zijner medeërfgenamen met de voldoening der schuld belast, en moet hen daarvoor vrijwaren.

      3 Indien de lasten alleen op het goed gevestigd zijn, zonder dat daarbij een personeel verband bestaat, kan geen
      der medeërfgenamen vorderen, dat de last worde afbetaald, en alsdan wordt het goed onder de verdeling begrepen,
      onder aftrek van de hoofdsom dier lasten.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1128
  - number: '1129'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1129
  - number: '1130'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1130
  - number: '1131'
    text: Een legataris is niet voor de schulden en lasten der nalatenschap verbonden.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1131
  - number: '1132'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1132
  - number: '1133'
    text: |-
      De schuldeisers en de legatarissen van de overledene mogen van de schuldeisers van de erfgenaam vorderen, dat de
      boedel van de overledene worde afgescheiden van die des erfgenaams.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1133
  - number: '1134'
    text: |-
      Indien tot de nalatenschap een registergoed behoort en de schuldeisers of legatarissen hun rechtsvordering tot
      afscheiding binnen zes maanden nadat de nalatenschap is opengevallen hebben aangevangen, zijn zij bevoegd om het
      instellen daarvan te doen inschrijven in de openbare registers, bedoeld in [titel 1, afdeling 2, van Boek 3][ref1],
      waartoe aan de bewaarder mede een authentiek afschrift van de akte van overlijden van de erflater of een ander
      bewijs dat de rechtsvordering binnen de voormelde termijn is ingesteld, wordt aangeboden. Na de inschrijving kan de
      erfgenaam het goed niet vervreemden of bezwaren ten nadele van de rechten van de eisers ten laste der nalatenschap


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Afdeling2
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1134
    references:
      - id: ref1
        bwb_id: BWBR0028745
        afdeling: '2'
  - number: '1135'
    text: |-
      Dat recht kan echter niet meer worden uitgeoefend, zodra er schuldvernieuwing in de schuldvordering tegen de
      overledene plaatsheeft, door de erfgenaam als schuldenaar aan te nemen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1135
  - number: '1136'
    text: Hetzelve recht verjaart door het tijdsverloop van drie jaren.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1136
  - number: '1137'
    text: |-
      De schuldeisers van de erfgenaam hebben geen bevoegdheid, om die afscheiding des boedels tegen de schuldeisers der
      nalatenschap te vorderen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1137
  - number: '1138'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1138
  - number: '1139'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1139
  - number: '1140'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1140
  - number: '1141'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1141
  - number: '1142'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1142
  - number: '1143'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1143
  - number: '1144'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1144
  - number: '1145'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1145
  - number: '1146'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1146
  - number: '1147'
    text: |-
      De bloedverwanten in de opgaande linie mogen bij uiterste wilsbeschikking, of bij notariële akte, tussen hun
      afkomelingen onderling of tussen dezen en hun langstlevende echtgenoot de verdeling hunner goederen maken. Op deze
      verdeling is [artikel 186, eerste lid, van Boek 3][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel186
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1147
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '186'
  - number: '1148'
    text: |-
      Indien al de goederen, welke de bloedverwant in de opgaande linie op de dag van zijn overlijden nalaat, niet in de
      verdeling begrepen zijn geweest, zullen die niet verdeelde goederen volgens de wet worden verdeeld.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1148
  - number: '1149'
    text: |-
      Indien de verdeling niet gemaakt is tussen al de kinderen, die ten tijde van het overlijden in leven zijn, en
      de afkomelingen der vooroverledene, zal de verdeling geheel en al nietig zijn. Er kan een nieuwe verdeling in
      de wettelijke vorm worden gevorderd, hetzij door de kinderen of afkomelingen, die daarbij geen aandeel gekregen
      hebben, hetzij zelfs door degenen, tussen welke de verdeling gemaakt is.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1149
  - number: '1150'
    text: |-
      De verdeling overeenkomstig [artikel 1147][ref1] gemaakt, kan worden vernietigd uit hoofde van benadeling, meer
      dan een vierde bedragende. Zij kan alsmede worden vernietigd, indien de verdeling, en hetgeen met vrijstelling van
      inbreng is vooruit gemaakt, het wettelijk erfdeel van de een of ander der afkomelingen mocht hebben verkort. De
      benadeelde kan de grond tot vernietiging inroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0028746#Artikel1147
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1150
    references:
      - id: ref1
        bwb_id: BWBR0028746
        artikel: '1147'
        afdeling: Vijfde
  - number: '1151'
    text: |-
      De erfgenamen, die een beroep doen op een der in het vorige artikel bedoelde gronden tot vernietiging, zullen de
      kosten, tot de schatting der goederen vereist, moeten voorschieten, en die kosten zullen te hunnen laste blijven,
      indien hun vordering ongegrond bevonden wordt.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1151
  - number: '1152'
    text: |-
      Wanneer, bij het openvallen ener nalatenschap, zich niemand opdoet, die daarop aanspraak maakt, of wanneer de
      bekende erfgenamen dezelve verwerpen, wordt de nalatenschap als onbeheerd beschouwd.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1152
  - number: '1153'
    text: |-
      1 De rechter in eerste aanleg, onder wiens ressort de nalatenschap opengevallen is, moet, op verzoek der
      belanghebbende personen, of op de voordracht van het openbaar ministerie, een curator benoemen. Van elke benoeming
      geeft de griffier van het gerecht in eerste aanleg onverwijld kennis aan de Procureur-Generaal.

      2 Indien de curatele verleend wordt ter zake dat zich niemand opdoet, die als erfgenaam aanspraak op de
      nalatenschap maakt, benoemt de rechter bij voorkeur tot curator de gestelde uitvoerder van de uiterste wil, tenware
      deze mocht verlangen door een ander vervangen te worden.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1153
  - number: '1154'
    text: |-
      1 De curator is gehouden de nalatenschap te doen verzegelen, en door een notaris een boedelbeschrijving te doen
      opmaken, mitsgaders de nalatenschap te beheren en tot effenheid te brengen.

      2 Hij is verplicht, door oproepingen in de openbare nieuwspapieren of andere doelmatige middelen, de erfgenamen op
      te sporen.

      3 Hij moet in rechten optreden ten aanzien der rechtsvorderingen, die tegen de nalatenschap zijn aangevangen, en
      alle rechten, die de overledene toebehoorden, uitoefenen en voortzetten. Hij is verplicht het gerede geld, hetwelk
      zich in de nalatenschap bevindt, mitsgaders de opbrengst der verkochte goederen, in de kas der gerechtelijke
      consignatiën te storten, ten einde te strekken tot behoud der rechten van de belanghebbende partijen, en daarvan,
      aan wie zulks zal behoren, rekening te doen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1154
  - number: '1155'
    text: |-
      Indien zich, na verloop van drie jaren, te rekenen van het openvallen der nalatenschap, geen erfgenaam opdoet, zal
      de slotrekening moeten worden gedaan aan de Staat, hetwelk bevoegd zal zijn om zich bij voorraad in het bezit der
      nagelaten goederen te doen stellen.
    url: https://wetten.overheid.nl/BWBR0028746/2015-01-01#Artikel1155
  - number: '1156'
    text: |-
      De [artikelen 1062 tot en met 1065][ref1] en [1067][ref2] zijn ook op de curators van onbeheerde nalatenschappen
      toepasselijk. Zij kunnen als loon in rekening brengen twee en een half ten honderd der ontvangsten en anderhalf ten
      honderd der uitgaven.


      [ref1]: https://wetten.overheid.nl/BWBR0028746#Artikel1062
      [ref2]: https://wetten.overheid.nl/BWBR0028746#Artikel1067
