  - number: '2'
    text: |-
      Voor diergeneesmiddelen welke ingevolge [artikel 5, eerste lid, onder c van het besluit][ref1] niet behoeven te
      worden geregistreerd wordt vrijstelling verleend van het in [artikel 32, eerste lid, van de wet][ref2] gestelde
      verbod ten behoeve van de bereiding van gemedicineerd voerder.


      [ref1]: https://wetten.overheid.nl/BWBR0003929#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel32
