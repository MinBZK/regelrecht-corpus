articles:
  - number: '1'
    text: |-
      Voor de toepassing van deze regeling wordt verstaan onder:

            wet:

              [Diergeneesmiddelenwet][ref1] (Stb. 1985, 410);



            besluit:

              [Besluit uitzonderingen registratieregime diergeneesmiddelen][ref2] (Stb. 1986, 228).


      [ref1]: https://wetten.overheid.nl/BWBR0003818
      [ref2]: https://wetten.overheid.nl/BWBR0003929
