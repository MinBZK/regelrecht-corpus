preamble:
  text: |-
    Gelet op de artikelen 5, tweede lid, en 6, vierde lid, van verordening (EG) nr. 842/2006 van het Europees Parlement
    en de Raad van de Europese Unie van 17 mei 2006 inzake bepaalde gefluoreerde broeikasgassen (PbEU L 161), de
    artikelen 6, eerste en tweede lid, 9, eerste en tweede lid, 10, eerste lid, en 11, eerste lid, van verordening (EG)
    nr. 303/2008 van de Europese Commissie van 2 april 2008 tot instelling, ingevolge Verordening (EG) nr. 842/2006
    van het Europees Parlement en de Raad van de Europese Unie, van minimumeisen en de voorwaarden voor wederzijdse
    erkenning voor de certificering van bedrijven en personeel betreffende stationaire koel-, klimaatregelings- en
    warmtepompapparatuur die bepaalde gefluoreerde broeikasgassen bevat (PbEU L 92), de artikelen 2, derde lid, en
    3, eerste lid, van verordening (EG) nr. 307/2008 van de Europese Commissie van 2 april 2008 tot vaststelling,
    ingevolge Verordening (EG) nr. 842/2006 van het Europees Parlement en de Raad van de Europese Unie, van
    minimumeisen voor opleidingsprogramma’s en de voorwaarden voor wederzijdse erkenning van opleidingsvoorschriften
    voor personeel op het gebied van bepaalde gefluoreerde broeikasgassen bevattende klimaatregelingssystemen in
    bepaalde motorvoertuigen (PbEU L 92), de artikelen 16, vijfde lid, en 17, eerste lid, van verordening (EG)
    nr. 2037/2000 van het Europees Parlement en de Raad van de Europese Unie van 29 juni 2000 betreffende de
    ozonlaag afbrekende stoffen (PbEG L 244), artikel 4, eerste tot en met derde lid, van het Besluit gefluoreerde
    broeikasgassen milieubeheer en de artikelen 4 en 6 van het Besluit ozonlaagafbrekende stoffen milieubeheer;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *airco van een mobiel werktuig:* koelinstallatie die – niet hermetisch
      gesloten is en minder dan drie kilogram gefluoreerde broeikasgassen of gereguleerde stoffen bevat, of – hermetisch
      gesloten is en minder dan zes kilogram gefluoreerde broeikasgassen of gereguleerde stoffen bevat, en hoofdzakelijk
      bestemd is om de luchttemperatuur en de vochtigheid in de bestuurdersruimte van een werktuig als bedoeld in
      [bijlage I][ref1] bij deze regeling te doen dalen;
        - *airco van een voertuig:* koelinstallatie die – niet hermetisch gesloten is en minder dan drie kilogram
      gefluoreerde broeikasgassen of gereguleerde stoffen bevat, of – hermetisch gesloten is en minder dan zes
      kilogram gefluoreerde broeikasgassen of gereguleerde stoffen bevat, en hoofdzakelijk bestemd is om de
      luchttemperatuur en de vochtigheid in de bestuurdersruimte of de passagiersruimte van een voertuig als bedoeld in
      [artikel 1, eerste lid, onder c en d, van de Wegenverkeerswet 1994][ref2] te doen dalen;
        - *deelnemer:* deelnemer aan het examen, bedoeld in [artikel 3, eerste lid][ref3];
        - *exameninstelling:* door de Minister aangewezen instelling als bedoeld in
      [artikel 3, tweede tot en met vierde lid][ref4];
        - *installeren:* aaneenkoppelen van twee of meer apparatuuronderdelen of circuits die gefluoreerde broeikasgassen
      of gereguleerde stoffen bevatten of daartoe bestemd zijn met het oog op het plaatsen van een systeem op de
      locatie waar het zal functioneren, inclusief de handeling waarbij leidingen voor gefluoreerde broeikasgassen of
      gereguleerde stoffen van een systeem worden aaneengekoppeld om een koelcircuit te voltooien ongeacht de noodzaak
      het systeem na montage te vullen;
        - *keuringsinstantie:* door de minister aangewezen instantie als bedoeld in [artikel 25, eerste lid][ref5];
        - *koelinstallatie:* drukapparatuur of drukapparaat als bedoeld in
      [artikel 1, onder e, van het Warenwetbesluit drukapparatuur][ref6], waarin zich gefluoreerde broeikasgassen of
      gereguleerde stoffen bevinden;
        - *koudemiddelenregistratie:* registratie waarbij wordt bijgehouden de hoeveelheid gefluoreerde broeikasgassen en
      gereguleerde stoffen die wordt gevuld of bijgevuld in koelinstallaties en de teruggewonnen hoeveelheid gefluoreerde
      broeikasgassen en gereguleerde stoffen uit koelinstallaties evenals de bestemming hiervan;
        - *lekcontrole:* controle op lekkage als bedoeld in artikel 3, tweede lid, van de f-gassenverordening
      voor zover het gefluoreerde broeikasgassen betreft en controle op lekdichtheid als bedoeld in
      [artikel 3.2, onder c, van de Regeling lekdichtheid koelinstallaties][ref7] in de gebruiksfase 2006 voorzover het
      gereguleerde stoffen betreft;
        - *minister:* Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;
        - *mobiele airco:* airco van een voertuig of airco van een mobiel werktuig;
        - *mobiele koelinstallatie:* koelinstallatie die – niet hermetisch gesloten is en drie kilogram of
      meer gefluoreerde broeikasgassen of gereguleerde stoffen bevat of – hermetisch gesloten is en zes
      kilogram of meer gefluoreerde broeikasgassen of gereguleerde stoffen bevat, en zich bevindt in of op een
      spoorvoertuig als bedoeld in [artikel 1, onder e, van de Spoorwegwet][ref8] of een voertuig als bedoeld in
      [artikel 1, eerste lid, onder c of d, van de Wegenverkeerswet 1994][ref9];
        - *onderhouden:* alle werkzaamheden, met uitzondering van het terugwinnen en het uitvoeren van lekcontroles,
      waarbij de circuits die gefluoreerde broeikasgassen of gereguleerde stoffen bevatten of daartoe bestemd zijn,
      worden geopend, waaronder het vullen van het systeem met gefluoreerde broeikasgassen of gereguleerde stoffen,
      het wegnemen van een of meer circuit- of apparatuuronderdelen, het hermonteren van een of meer circuit- of
      apparatuuronderdelen en het herstellen van lekken;
        - *stationaire koelinstallatie:* koelinstallatie die tijdens het functioneren niet mobiel is;
        - *terugwinnen:* verzamelen en opslaan van gefluoreerde broeikasgassen of gereguleerde stoffen tijdens onderhoud
      of voorafgaand aan de verwijdering van koelinstallaties of houders als bedoeld in artikel 2, onder 12, van de f-
      gassenverordening.


