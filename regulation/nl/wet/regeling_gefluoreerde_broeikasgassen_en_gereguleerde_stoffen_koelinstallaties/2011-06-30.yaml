    text: Deze regeling treedt in werking met ingang van 1 januari 2010.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel35
  - number: '36'
    text: 'Deze regeling wordt aangehaald als: Regeling gefluoreerde broeikasgassen en gereguleerde stoffen koelinstallaties.'
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel36
