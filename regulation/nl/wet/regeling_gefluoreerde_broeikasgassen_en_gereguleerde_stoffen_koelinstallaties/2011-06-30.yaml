  - number: '2.1'
    text: |-
      Personen die een of meer van de volgende werkzaamheden verrichten aan stationaire en mobiele koelinstallaties,
      beschikken over een bij de betreffende categorie van werkzaamheden behorend diploma als bedoeld in het tweede lid:
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel2
  - number: 2.1.a
    text: 'het verrichten van lekcontroles van mobiele koelinstallaties, en van stationaire koelinstallaties:'
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel2
  - number: 2.1.a.1°
    text: |-
      die niet hermetisch gesloten zijn en drie kilogram of meer gefluoreerde broeikasgassen of gereguleerde stoffen
      bevatten of
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel2
  - number: 2.1.a.2°
    text: die hermetisch gesloten zijn en zes kilogram of meer gefluoreerde broeikasgassen of gereguleerde stoffen bevatten;
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel2
  - number: 2.1.b
    text: het terugwinnen;
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel2
  - number: 2.1.c
    text: het installeren, of
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel2
  - number: 2.1.d
    text: het onderhouden.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel2
  - number: '2.2'
    text: 'Het diploma heeft betrekking op een van de volgende categorieën van werkzaamheden:'
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel2
  - number: 2.2.a
    text: 'categorie I: de houder van het diploma is bevoegd alle werkzaamheden als genoemd in het eerste lid te verrichten;'
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel2
  - number: 2.2.b
    text: 'categorie II: de houder van het diploma is bevoegd:'
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel2
  - number: 2.2.b.1°
    text: |-
      de werkzaamheid, genoemd in het eerste lid, onder a, te verrichten op voorwaarde dat hierbij het koelcircuit, dat
      de gefluoreerde broeikasgassen of gereguleerde stoffen bevat, niet wordt geopend;
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel2
  - number: 2.2.b.2°
    text: |-
      de werkzaamheden, genoemd in het eerste lid, onder b tot en met d, te verrichten bij stationaire koelinstallaties
      die niet hermetisch gesloten zijn en minder dan drie kilogram gefluoreerde broeikasgassen of gereguleerde stoffen
      bevatten of die hermetisch gesloten zijn en minder dan zes kilogram gefluoreerde broeikasgassen of gereguleerde
      stoffen bevatten;
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel2
  - number: 2.2.c
    text: |-
      categorie III: de houder van het diploma is bevoegd de werkzaamheid, genoemd in het eerste lid, onder b, te
      verrichten bij stationaire koelinstallaties die niet hermetisch gesloten zijn en minder dan drie kilogram
      gefluoreerde broeikasgassen of gereguleerde stoffen bevatten of die hermetisch gesloten zijn en minder dan zes
      kilogram gefluoreerde broeikasgassen of gereguleerde stoffen bevatten;
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel2
  - number: 2.2.d
    text: |-
      categorie IV: de houder van het diploma is bevoegd de werkzaamheid, genoemd in het eerste lid, onder a, te
      verrichten voorzover hierbij het koelcircuit, dat de gefluoreerde broeikasgassen of gereguleerde stoffen bevat,
      niet wordt geopend.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel2
  - number: '2.3'
    text: |-
      Personen die belast zijn met het terugwinnen bij mobiele airco’s beschikken over een bij deze werkzaamheid behorend
      diploma.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel2
  - number: '2.4'
    text: |-
      Degene die beschikt over een diploma behorend tot categorie I als bedoeld in het tweede lid, onder a, is tevens
      gerechtigd de werkzaamheid, bedoeld in het derde lid, te verrichten.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel2
  - number: '2.5'
    text: 'Voor personen:'
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel2
  - number: 2.5.a
    text: |-
      die een opleiding voor het kunnen verrichten van de betreffende werkzaamheid volgen met het oogmerk het hierbij
      behorende diploma te verkrijgen, en
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel2
  - number: 2.5.b
    text: |-
      die tot het moment dat het diploma voor die betreffende werkzaamheid is verkregen bij het verrichten van die
      werkzaamheid werkzaam zijn onder direct toezicht en verantwoordelijkheid van iemand die over een bij het bij die
      werkzaamheid behorend diploma beschikt, is het eerste lid voor een periode van maximaal twee jaar en het derde lid
      voor een periode van maximaal een jaar niet van toepassing, te rekenen vanaf de aanvangsdatum van de opleiding.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel2
  - number: '3.1'
    text: |-
      Een diploma wordt verkregen door het met gunstig gevolg afleggen van het examen bij een exameninstelling als
      bedoeld in het tweede tot en met vierde lid.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel3
  - number: '3.2'
    text: |-
      De Stichting Emissiepreventie Koudetechniek is aangewezen als de instelling die het examen afneemt voor een diploma
      voor het verrichten van de werkzaamheden, bedoeld in [artikel 2, tweede lid][ref1], aan stationaire en mobiele
      koelinstallaties.


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel2
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '3.3'
    text: |-
      De Stichting Vakopleiding Automobiel- en Motorrijwielbedrijf is aangewezen als de instelling die het examen afneemt
      voor een diploma voor het verrichten van de werkzaamheden, bedoeld in [artikel 2, derde lid][ref1], aan airco’s
      van voertuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel2
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '3.4'
    text: |-
      De Stichting Certificering Examinering Risicovolle Taken is aangewezen als de instelling die het examen afneemt
      voor een diploma voor het verrichten van de werkzaamheden, bedoeld in [artikel 2, derde lid][ref1], aan airco’s van
      mobiele werktuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel2
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '3.5'
    text: Een persoon meldt zich voor het afleggen van het examen vooraf aan bij de betreffende exameninstelling.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel3
  - number: '3.6'
    text: |-
      Tijdens het examen voor een diploma als bedoeld in [artikel 2, eerste lid][ref1], wordt getoetst of een deelnemer
      voldoet aan de exameneisen behorend bij de betreffende categorie van werkzaamheden, die zijn neergelegd in
      [bijlage II][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0026453
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0026453
  - number: '3.7'
    text: |-
      Tijdens het examen voor een diploma als bedoeld in [artikel 2, derde lid][ref1], wordt getoetst of een deelnemer
      voldoet aan de exameneisen, die zijn neergelegd in [bijlage III][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0026453
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0026453
  - number: '3.8'
    text: |-
      Onverminderd de [artikelen 8, vijfde lid, onder c][ref1], en [16][ref2] is de geldigheidsduur van het diploma
      onbeperkt.


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0026453#Artikel16
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0026453
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '3.9'
    text: Onder het examen wordt in deze regeling mede verstaan het herexamen, tenzij nadrukkelijk anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel3
  - number: '4.1'
    text: |-
      De minister stelt de inhoud van het examen, bedoeld in [artikel 3, eerste lid][ref1], vast waarmee getoetst wordt
      of een deelnemer voldoet aan de exameneisen behorend bij de betreffende categorie van werkzaamheden, die zijn
      neergelegd in de [bijlagen II][ref2] of [III][ref3] bij deze regeling. Voorafgaande aan de vaststelling adviseert
      de exameninstelling de minister over de inhoud van het examen.


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0026453
      [ref3]: https://wetten.overheid.nl/BWBR0026453
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0026453
      - id: ref3
        bwb_id: BWBR0026453
  - number: '4.2'
    text: |-
      Het examen, bedoeld in [artikel 3, eerste lid][ref1], bestaat uit een theorie- en een praktijkgedeelte.


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel3
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '5'
    text: |-
      De minister stelt de uitslag van het examen, bedoeld in [artikel 3, eerste lid][ref1], met inachtneming van het
      advies van de exameninstelling inzake de resultaten van het door een deelnemer afgelegde examen vast en draagt er
      zorg voor dat de uitslag binnen drie weken na ontvangst van dat advies aan een deelnemer wordt verzonden.


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel3
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '6.1'
    text: |-
      Indien een deelnemer een of meer onderdelen van het examen, bedoeld in [artikel 3, eerste lid][ref1], niet met goed
      gevolg heeft afgelegd, wordt hij in de gelegenheid gesteld een herexamen te doen voor het betreffende onderdeel of
      de betreffende onderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel3
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '6.2'
    text: |-
      Het herexamen vindt plaats binnen zes maanden nadat een deelnemer van de resultaten van het examen op de hoogte
      is gesteld.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel6
  - number: '6.3'
    text: |-
      Indien een deelnemer een of meer onderdelen van het herexamen niet met goed gevolg heeft afgelegd, is hij niet
      gerechtigd opnieuw herexamen te doen.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel6
  - number: '7.1'
    text: |-
      Een deelnemer is voor het afleggen van het examen, bedoeld in [artikel 3, eerste lid][ref1], voorafgaand een
      vergoeding verschuldigd aan de exameninstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel3
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '7.2'
    text: |-
      Indien de verschuldigde vergoeding niet voor de dag waarop het examen zal worden afgenomen is ontvangen wordt de
      deelnemer uitgesloten van deelname aan het examen.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel7
  - number: '7.3'
    text: |-
      De exameninstelling doet de minister jaarlijks een voorstel voor de hoogte van de verschuldigde vergoeding voor het
      afleggen van het examen voor het volgende kalenderjaar. De minister stelt de hoogte van de vergoeding vast.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel7
  - number: '7.4'
    text: |-
      De hoogte van de vergoeding, bedoeld in het eerste lid, bedraagt voor een examen of een herexamen dat wordt
      afgelegd:
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel7
  - number: 7.4.a
    text: |-
      met het oog op het verkrijgen van een diploma voor werkzaamheden als bedoeld in
      [artikel 2, tweede lid, onder a of b][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel2
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 7.4.a.1°
    text: 'voor een examen of een herexamen op alle onderdelen: € 714,– inclusief BTW;'
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel7
  - number: 7.4.a.2°
    text: 'voor een herexamen van het theoriegedeelte: € 119,– inclusief BTW;'
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel7
  - number: 7.4.a.3°
    text: 'voor een herexamen van een onderdeel van het praktijkgedeelte: € 327,– inclusief BTW;'
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel7
  - number: 7.4.b
    text: |-
      met het oog op het verkrijgen van een diploma voor werkzaamheden als bedoeld in
      [artikel 2, tweede lid, onder c of d][ref1] voor een examen of voor een herexamen: € 476,– inclusief BTW;


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel2
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 7.4.c
    text: |-
      met het oog op het verkrijgen van een diploma voor werkzaamheden als bedoeld in [artikel 2, derde lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel2
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 7.4.c.1°
    text: 'voor een examen of een herexamen op alle onderdelen: € 286,– inclusief BTW;'
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel7
  - number: 7.4.c.2°
    text: 'voor een herexamen van het theoriegedeelte: € 89,– inclusief BTW;'
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel7
  - number: 7.4.c.3°
    text: 'voor een herexamen van het praktijkgedeelte: € 250,– inclusief BTW.'
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel7
  - number: '7.5'
    text: |-
      In afwijking van het vierde lid, onder a, bedraagt de hoogte van de vergoeding voor een examen
      of een herexamen met het oog op het verkrijgen van een diploma voor werkzaamheden als bedoeld in
      [artikel 2, tweede lid, onder a][ref1], indien de deelnemer al beschikt over een diploma voor werkzaamheden als
      bedoeld in [artikel 2, tweede lid, onder b][ref2], voor een examen of voor een herexamen: € 268,– inclusief BTW.


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0026453#Artikel2
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0026453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '8.1'
    text: |-
      Indien onvoorziene omstandigheden daartoe aanleiding geven, kan de minister beslissen dat het examen, bedoeld in
      [artikel 3, eerste lid][ref1], geheel of gedeeltelijk opnieuw wordt afgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel3
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '8.2'
    text: |-
      Indien een deelnemer in strijd heeft gehandeld met deze regeling of het examenreglement, bedoeld in
      [artikel 9, tweede lid][ref1], of zich ten aanzien van het examen aan enig bedrog heeft schuldig gemaakt, bericht
      de exameninstelling de minister hieromtrent.


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel9
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '8.3'
    text: |-
      In het geval, bedoeld in het tweede lid, wordt door een examinator binnen een week na constatering van de
      onregelmatigheid een schriftelijk verslag opgemaakt. Dit verslag bevat in ieder geval:
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel8
  - number: 8.3.a
    text: het examen waarop het voorval betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel8
  - number: 8.3.b
    text: het tijdstip waarop het voorval heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel8
  - number: 8.3.c
    text: de naam van de betrokken deelnemer;
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel8
  - number: 8.3.d
    text: een omschrijving van het voorval;
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel8
  - number: 8.3.e
    text: de datum en het tijdstip waarop het verslag is gemaakt;
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel8
  - number: 8.3.f
    text: de zienswijze van de betrokken deelnemer;
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel8
  - number: 8.3.g
    text: de zienswijze van een eventuele getuige, met diens naam;
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel8
  - number: 8.3.h
    text: de naam en de handtekening van degene die het verslag heeft gemaakt;
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel8
  - number: 8.3.i
    text: zo mogelijk originele bewijsstukken die de bevindingen onderbouwen.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel8
  - number: '8.4'
    text: |-
      Het verslag wordt aan de betrokken deelnemer toegezonden. Voorts wordt onverwijld een afschrift aan de minister
      gezonden.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel8
  - number: '8.5'
    text: |-
      Indien een deelnemer zich aan een handeling, als bedoeld in het tweede lid, schuldig heeft gemaakt kan de minister
      besluiten:
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel8
  - number: 8.5.a
    text: |-
      dat een deelnemer voor een periode van ten hoogste zes maanden wordt uitgesloten van deelname aan een of meer
      examens als bedoeld in deze regeling;
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel8
  - number: 8.5.b
    text: tot ongeldigverklaring van het examen;
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel8
  - number: 8.5.c
    text: tot intrekking van een reeds verleend diploma op grond van deze regeling.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel8
  - number: '9.1'
    text: |-
      De exameninstelling is belast met de feitelijke werkzaamheden met betrekking tot het organiseren en afnemen van het
      examen, bedoeld in [artikel 3, eerste lid][ref1], waaronder:


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel3
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 9.1.a
    text: |-
      het uitbrengen van het advies, bedoeld in [artikel 4, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel4
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 9.1.b
    text: het geven van voorlichting over en bekendheid aan het examen;
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel9
  - number: 9.1.c
    text: het vaststellen van de examendatum, het tijdstip en de plaats;
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel9
  - number: 9.1.d
    text: het toezenden van de uitnodiging voor de deelname aan het examen;
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel9
  - number: 9.1.e
    text: het afnemen van het examen door examinatoren;
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel9
  - number: 9.1.f
    text: |-
      het factureren van de vergoeding, bedoeld in [artikel 7, eerste lid][ref1], aan een deelnemer;


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel7
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 9.1.g
    text: |-
      het binnen drie weken na afloop van het examen uitbrengen van het advies, bedoeld in [artikel 5][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel5
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 9.1.h
    text: het registeren van individuele en algemene resultaten van de examens.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel9
  - number: '9.2'
    text: 'De exameninstelling stelt een examenreglement vast. Het reglement bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel9
  - number: 9.2.a
    text: de procedure- en gedragsregels die gelden voorafgaand, gedurende en na afloop van het examen;
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel9
  - number: 9.2.b
    text: |-
      de criteria op basis waarvan het examen wordt beoordeeld ten behoeve van het advies over de examenresultaten,
      bedoeld in [artikel 5][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel5
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 9.2.c
    text: |-
      onverminderd [artikel 10][ref1] de termijn waarbinnen individuele en algemene resultaten van de examens bewaard
      blijven, en


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel10
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 9.2.d
    text: de procedures voor externe afstemming en klachten in verband met de uitvoering van deze regeling.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel9
  - number: '9.3'
    text: 'De exameninstelling stelt een huishoudelijk reglement vast dat ten minste bevat:'
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel9
  - number: 9.3.a
    text: de taken die een examinator heeft;
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel9
  - number: 9.3.b
    text: 'de criteria waaraan de examinator moet voldoen, waarbij ten minste wordt vastgelegd:'
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel9
  - number: 9.3.b.1°
    text: dat hij voldoende kennis heeft van de relevante examenmethoden en de examendocumenten, en
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel9
  - number: 9.3.b.2°
    text: dat hij voldoende relevante praktijkervaring heeft;
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel9
  - number: 9.3.c
    text: |-
      de criteria waaraan de examenruimte moet voldoen en welke technische middelen en hulpmiddelen beschikbaar moeten
      zijn;
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel9
  - number: 9.3.d
    text: de procedures voor interne controles en evaluaties van de uitvoering van deze regeling.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel9
  - number: '9.4'
    text: Het examenreglement, het huishoudelijk reglement, en wijzigingen hiervan behoeven de goedkeuring van de minister.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel9
  - number: '9.5'
    text: |-
      De exameninstelling is onafhankelijk en onpartijdig en neemt bij de uitvoering van de werkzaamheden het
      examenreglement en het huishoudelijk reglement in acht.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel9
  - number: '9.6'
    text: De exameninstelling neemt afdoende maatregelen om fraude voor, tijdens en na het examen te voorkomen.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel9
  - number: '9.7'
    text: |-
      Indien de exameninstelling niet meer voldoet aan een of meer van haar verplichtingen, bericht zij dit onverwijld
      schriftelijk aan de minister.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel9
  - number: '10'
    text: |-
      De exameninstelling is gehouden de inschrijving van een deelnemer, de resultaten van het door hem afgelegde examen,
      bedoeld in [artikel 3, eerste lid][ref1], evenals het advies aan de minister, bedoeld in [artikel 5][ref2], te
      bewaren tot:


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0026453#Artikel5
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0026453
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 10.a
    text: ten minste dertien weken na de dag van het examen;
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel10
  - number: 10.b
    text: |-
      ten minste dertien weken na de dag waarop de beslissing op het bezwaarschrift bekend is gemaakt, indien tegen de
      uitslag van het examen bezwaar is gemaakt, of
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel10
  - number: 10.c
    text: |-
      ten minste dertien weken na de dag waarop het beroep onherroepelijk is, indien tegen een beslissing op bezwaar
      beroep is ingesteld.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel10
  - number: '11.1'
    text: |-
      De exameninstelling verstrekt desgevraagd aan de minister alle voor de uitoefening van zijn taak benodigde
      inlichtingen. De minister kan inzage vorderen van alle zakelijke gegevens en bescheiden, indien dat voor de
      vervulling van zijn taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel11
  - number: '11.2'
    text: |-
      De exameninstelling zendt elk jaar een jaarverslag aan de minister waarin verantwoording wordt afgelegd over
      de wijze waarop zij in het voorafgaande kalenderjaar uitvoering heeft gegeven aan haar taken en verplichtingen
      voortvloeiend uit deze regeling.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel11
  - number: '11.3'
    text: |-
      Het jaarverslag wordt opgesteld met inachtneming van de richtsnoeren, bedoeld in [bijlage IV][ref1] bij deze
      regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0026453
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0026453
  - number: '12.1'
    text: |-
      De minister kan de aanwijzing van de exameninstelling schorsen, indien de instelling naar het oordeel van de
      minister een of meer van de taken of verplichtingen, bedoeld in de [artikelen 9 tot en met 11][ref1], niet of
      onvoldoende uitvoert respectievelijk nakomt.


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel9
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '12.2'
    text: |-
      In geval van schorsing geeft de minister de exameninstelling gedurende een door hem te bepalen periode de
      gelegenheid de tekortkoming ongedaan te maken.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel12
  - number: '12.3'
    text: |-
      Indien de tekortkoming door de exameninstelling binnen de door de minister gestelde termijn naar het oordeel van de
      minister ongedaan is gemaakt, wordt de schorsing van de aanwijzing opgeheven.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel12
  - number: '13'
    text: 'De minister kan de aanwijzing van de exameninstelling intrekken indien:'
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel13
  - number: 13.a
    text: de instelling hierom verzoekt;
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel13
  - number: 13.b
    text: |-
      de instelling naar het oordeel van de minister ernstig tekortschiet bij de uitvoering of nakoming van een of meer
      van de taken of verplichtingen, bedoeld in de [artikelen 9 tot en met 11][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel9
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 13.c
    text: de instelling niet meewerkt aan een controle door de minister in het kader van deze regeling;
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel13
  - number: 13.d
    text: |-
      de aanwijzing ingevolge [artikel 12, eerste lid][ref1], is geschorst en de tekortkoming binnen de door de minister
      gestelde termijn niet ongedaan is gemaakt, of


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel12
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 13.e
    text: de instelling surseance van betaling is verleend of in staat van faillissement verkeert.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel13
  - number: '14.1'
    text: |-
      De minister verstrekt het diploma aan een deelnemer die met gunstig gevolg het examen, bedoeld in
      [artikel 3, eerste lid][ref1], heeft afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel3
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '14.2'
    text: |-
      De minister registreert aan wie een diploma als bedoeld in [artikel 3, eerste lid][ref1], is uitgereikt. Deze
      gegevens worden bewaard totdat de betrokkene de pensioengerechtigde leeftijd heeft bereikt doch ten minste vijf
      jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel3
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '15'
    text: 'Het diploma vermeldt ten minste:'
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel15
  - number: 15.a
    text: de volledige naam van de houder van het diploma;
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel15
  - number: 15.b
    text: een registratienummer afgegeven door de minister;
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel15
  - number: 15.c
    text: |-
      de werkzaamheden, bedoeld in de [artikelen 2, eerste of derde lid][ref1], die de houder van het diploma bevoegd is
      te verrichten;


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel2
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 15.d
    text: de datum van afgifte en de ondertekening door de minister.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel15
  - number: '16'
    text: |-
      Indien de houder van een diploma bij voortduring in strijd handelt met deze regeling,
      [artikel 3 van het Besluit gefluoreerde broeikasgassen milieubeheer][ref1], of de
      [Regeling lekdichtheid koelinstallaties in de gebruiksfase 2006][ref2] kan de minister tot intrekking van het
      diploma besluiten. In dat geval levert de betrokkene zijn diploma in bij de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0022857#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020550
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0022857
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020550
  - number: '17.1'
    text: Een deelnemer is aan de minister een vergoeding verschuldigd voor het ontvangen van de uitslag van het examen.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel17
  - number: '17.2'
    text: 'De hoogte van de vergoeding, bedoeld in het eerste lid, bedraagt: € 20,–.'
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel17
  - number: '18'
    text: |-
      Een bedrijf dat stationaire of mobiele koelinstallaties installeert of onderhoudt mag deze werkzaamheden
      uitsluitend verrichten indien het beschikt over een geldig bedrijfscertificaat dat is afgegeven door een
      keuringsinstantie.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel18
  - number: '19.1'
    text: |-
      Een bedrijf kan een bedrijfscertificaat als bedoeld in [artikel 18][ref1] verkrijgen, indien het beschikt over:


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel18
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 19.1.a
    text: |-
      personeel dat houder is van een diploma als bedoeld in [artikel 2, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel2
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 19.1.b
    text: voldoende adequaat gediplomeerd personeel als bedoeld onder a in relatie tot het ter zake te verwachten werkaanbod;
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel19
  - number: 19.1.c
    text: |-
      voldoende en adequate instrumenten voor en noodzakelijke procedures ten behoeve van het personeel dat zich bezig
      houdt met de betreffende werkzaamheden, en
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel19
  - number: 19.1.d
    text: een koudemiddelenregistratie.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel19
  - number: '19.2'
    text: 'Bij de aanvraag van een bedrijfscertificaat worden ten minste overgelegd:'
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel19
  - number: 19.2.a
    text: |-
      een overzicht van de beschikbaarheid van het personeel, bedoeld in het eerste lid, onder a, in relatie tot het
      te verwachten werkaanbod evenals kopieën van de diploma’s, bedoeld in [artikel 2, tweede lid][ref1], van het
      personeel;


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel2
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 19.2.b
    text: een document waarin de voor het personeel noodzakelijke instrumenten en procedures zijn beschreven;
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel19
  - number: 19.2.c
    text: een koudemiddelenregistratie, en
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel19
  - number: 19.2.d
    text: het registratienummer uit het handelsregister.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel19
  - number: '19.3'
    text: |-
      Een bedrijf als bedoeld in [artikel 18][ref1] kan een aanvraag voor een bedrijfscertificaat indienen bij een
      keuringinstantie.


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel18
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '19.4'
    text: |-
      Een bedrijf voldoet na afgifte van een bedrijfscertificaat bij voortduring aan de eisen, bedoeld in het eerste lid,
      en stelt op verzoek van de keuringsinstantie de gegevens van de koudemiddelenregistratie beschikbaar.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel19
  - number: '19.5'
    text: |-
      Indien een bedrijf niet meer voldoet aan de eisen op basis waarvan een bedrijfscertificaat is verleend, bericht zij
      dit onverwijld schriftelijk aan de keuringsinstantie.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel19
  - number: '20'
    text: 'Het bedrijfscertificaat vermeldt ten minste:'
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel20
  - number: 20.a
    text: de naam van het bedrijf;
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel20
  - number: 20.b
    text: een registratienummer afgegeven door de keuringsinstantie;
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel20
  - number: 20.c
    text: |-
      de werkzaamheden, bedoeld in [artikel 18][ref1], die de houder van het bedrijfscertificaat bevoegd is te
      verrichten;


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel18
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 20.d
    text: de datum van afgifte en de ondertekening door een vertegenwoordiger van de keuringinstantie.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel20
  - number: '21.1'
    text: |-
      De keuringsinstantie voert vierentwintig maanden na afgifte van een bedrijfscertificaat een
      tussentijdse beoordeling uit waarbij wordt bezien of een bedrijf nog voldoet aan de eisen, genoemd in
      [artikel 19, eerste lid][ref1]. De tussentijdse beoordeling wordt vervolgens iedere achtenveertig maanden herhaald.


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel19
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '21.2'
    text: |-
      De keuringsinstantie voert achtenveertig maanden na afgifte van een bedrijfscertificaat een herkeuring uit waarbij
      wordt beoordeeld of een bedrijf nog voldoet aan de eisen, genoemd in [artikel 19, eerste lid][ref1]. De herkeuring
      wordt vervolgens iedere achtenveertig maanden herhaald.


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel19
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '22.1'
    text: 'De keuringinstantie kan een bedrijfscertificaat tijdelijk of definitief intrekken:'
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel22
  - number: 22.1.a
    text: indien een bedrijf hierom verzoekt;
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel22
  - number: 22.1.b
    text: |-
      indien een bedrijf naar het oordeel van de keuringinstantie niet meer voldoet aan een of meer eisen als genoemd in
      [artikel 19, eerste lid][ref1], of in strijd handelt met [artikel 19, vierde of vijfde lid][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0026453#Artikel19
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0026453
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 22.1.c
    text: |-
      indien een bedrijf niet of onvoldoende meewerkt aan een tussentijdse beoordeling of herkeuring door de
      keuringinstantie of de keuringsinstantie anderszins niet in staat is een bedrijf te beoordelen.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel22
  - number: 22.1.d
    text: een bedrijf surseance van betaling is verleend of in staat van faillissement verkeert.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel22
  - number: '22.2'
    text: |-
      Bij een tijdelijke intrekking stelt de keuringinstantie een bedrijf gedurende een door de keuringinstantie te
      bepalen periode in de gelegenheid de tekortkoming ongedaan te maken.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel22
  - number: '22.3'
    text: |-
      Indien de tekortkoming door een bedrijf binnen de door de keuringinstantie gestelde termijn naar het oordeel van de
      keuringinstantie ongedaan is gemaakt, wordt de tijdelijke intrekking van een bedrijfscertificaat opgeheven.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel22
  - number: '22.4'
    text: |-
      De keuringinstantie kan een bedrijfscertificaat in ieder geval definitief intrekken, indien een bedrijfscertificaat
      tijdelijk is ingetrokken en de tekortkoming binnen de door de keuringinstantie gestelde termijn niet ongedaan is
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel22
  - number: '22.5'
    text: |-
      Indien de aanwijzing van de keuringsinstantie ingevolge [artikel 29, eerste lid][ref1], wordt ingetrokken, vervalt
      het oorspronkelijke bedrijfscertificaat van rechtswege na vierentwintig maanden te rekenen vanaf de dag van de
      intrekking van de aanwijzing, of zoveel eerder als een nieuw bedrijfscertificaat door een andere keuringsinstantie
      is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel29
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: '23'
    text: |-
      De keuringsinstantie neemt bij de certificering, tussentijdse beoordeling en herkeuring van bedrijven, bedoeld in
      de [artikelen 19][ref1] en [21][ref2], en de tijdelijke en definitieve intrekking van bedrijfscertificaten, bedoeld
      in [artikel 22][ref3], de bepalingen die zijn neergelegd in [bijlage V][ref4] bij deze regeling in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0026453#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0026453#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0026453
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0026453
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref3
        bwb_id: BWBR0026453
        artikel: '22'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref4
        bwb_id: BWBR0026453
  - number: '24'
    text: |-
      De keuringinstantie is belast met het beoordelen van bedrijven in het kader van deze regeling, het afgeven van
      bedrijfscertificaten en het in voorkomende gevallen tijdelijk of definitief intrekken hiervan.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel24
  - number: '25.1'
    text: |-
      Een instantie kan door de minister worden aangewezen als keuringinstantie indien de instantie voldoet aan de
      volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel25
  - number: 25.1.a
    text: |-
      zij is onafhankelijk en onpartijdig bij de uitvoering van de werkzaamheden ingevolge [paragraaf 3.1][ref1] van
      deze regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0026453
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 25.1.b
    text: |-
      zij houdt in een register bij welke bedrijven over een bedrijfscertificaat beschikken en houdt deze gegevens
      actueel;
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel25
  - number: 25.1.c
    text: |-
      zij beschikt over een reglement waarin ten minste de te volgen procedures zijn neergelegd voor het verstrekken en
      het tijdelijk en definitief intrekken van een bedrijfscertificaat en het tussentijds beoordelen en herkeuren van
      bedrijven, en
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel25
  - number: 25.1.d
    text: |-
      zij beschikt over personeel dat voor het uitvoeren van de beoordelingen van bedrijven voldoet aan de eisen, die
      zijn neergelegd in [bijlage VI][ref1] bij deze regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0026453
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0026453
  - number: 25.1.e
    text: |-
      zij registreert op een geaggregeerd niveau de gegevens van de resultaten van de koudemiddelenregistratie die door
      bedrijven ingevolge [artikel 19, vierde lid][ref1], beschikbaar zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel19
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '25.2'
    text: De keuringinstantie bewaart de gegevens, bedoeld in het eerste lid, onder b en e, ten minste vijf jaar.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel25
  - number: '25.3'
    text: |-
      De keuringinstantie neemt bij de uitvoering van de werkzaamheden ingevolge [paragraaf 3.1][ref1] van deze regeling
      het reglement, bedoeld in het eerste lid, onder c, in acht en voldoet bij voortduring aan de voorwaarden, bedoeld
      in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0026453
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '25.4'
    text: |-
      Indien de keuringsinstantie niet meer voldoet aan een of meer van haar verplichtingen, bericht zij dit onverwijld
      schriftelijk aan de minister.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel25
  - number: '25.5'
    text: |-
      De minister overlegt periodiek met alle keuringinstanties. De keuringinstanties zijn verplicht aan dit overleg deel
      te nemen.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel25
  - number: '26.1'
    text: |-
      Een instantie kan een aanvraag voor een aanwijzing als bedoeld in [artikel 25, eerste lid][ref1], indienen bij
      de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel25
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '26.2'
    text: |-
      Bij de aanvraag toont de instantie aan dat zij voldoet aan de eisen, genoemd in [artikel 25, eerste lid][ref1],
      door overlegging van de daarvoor noodzakelijke gegevens en bescheiden die direct of indirect van belang zijn voor
      de beoordeling van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel25
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '27.1'
    text: |-
      De keuringinstantie verstrekt desgevraagd aan de minister alle voor de uitoefening van zijn taak benodigde
      inlichtingen. De minister kan inzage vorderen van alle zakelijke gegevens en bescheiden, indien dat voor de
      vervulling van zijn taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel27
  - number: '27.2'
    text: |-
      De keuringinstantie stuurt elk jaar een jaarverslag aan de minister waarin verantwoording wordt afgelegd over
      de wijze waarop zij in het voorafgaande kalenderjaar uitvoering heeft gegeven aan haar taken en verplichtingen
      voortvloeiende uit deze regeling.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel27
  - number: '27.3'
    text: |-
      Het jaarverslag wordt opgesteld met inachtneming van de richtsnoeren, die zijn neergelegd in [bijlage VII][ref1]
      bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0026453
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0026453
  - number: '28.1'
    text: |-
      De minister kan de aanwijzing van de keuringinstantie schorsen, indien de instantie naar het oordeel van de
      minister:
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel28
  - number: 28.1.a
    text: |-
      niet meer voldoet aan een of meer van de verplichtingen, bedoeld in de [artikelen 25][ref1] of [27][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0026453#Artikel27
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0026453
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 28.1.b
    text: |-
      niet geacht wordt in staat te zijn een of meer van de werkzaamheden, bedoeld in [paragraaf 3.1][ref1], naar behoren
      uit te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0026453
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '28.2'
    text: |-
      Bij schorsing geeft de minister de keuringinstantie gedurende een door hem te bepalen periode gelegenheid de
      tekortkoming ongedaan te maken.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel28
  - number: '28.3'
    text: |-
      Indien de tekortkoming door de keuringinstantie binnen de door de minister gestelde termijn naar het oordeel van de
      minister ongedaan is gemaakt, wordt de schorsing opgeheven.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel28
  - number: '29.1'
    text: 'De minister kan de aanwijzing van de keuringinstantie intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel29
  - number: 29.1.a
    text: de instantie hierom verzoekt;
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel29
  - number: 29.1.b
    text: |-
      de instantie ernstig tekort is geschoten bij de uitvoering van [artikel 24][ref1] of de naleving van een of meer
      van de verplichtingen, bedoeld in de [artikelen 25][ref2] en [27][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0026453#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0026453#Artikel27
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0026453
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0026453
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 29.1.c
    text: de instantie misbruik maakt van haar bevoegdheden;
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel29
  - number: 29.1.d
    text: de instantie niet meewerkt aan een controle door de minister in het kader van deze regeling;
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel29
  - number: 29.1.e
    text: |-
      de aanwijzing ingevolge [artikel 28, eerste lid][ref1], is geschorst en de tekortkoming naar het oordeel van de
      minister binnen de door de hem gestelde termijn niet ongedaan is gemaakt, of


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel28
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 29.1.f
    text: de instantie surseance van betaling is verleend of in staat van faillissement verkeert.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel29
  - number: '29.2'
    text: |-
      De keuringsinstantie overlegt bij intrekking van de aanwijzing aan de minister alle relevante inlichtingen en
      bescheiden, waaronder het register, bedoeld in [artikel 25, eerste lid, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel25
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '29.3'
    text: |-
      De keuringsinstantie stelt de betrokken bedrijven onverwijld op de hoogte van het besluit van de minister tot
      intrekking van de aanwijzing.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel29
  - number: '30.1'
    text: |-
      Degene die houder is van een diploma STEK-monteur of een diploma CFK-monteur wordt geacht tot 1 juli 2010 houder te
      zijn van een diploma behorend bij categorie I als bedoeld in [artikel 2, tweede lid, onder a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel2
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '30.2'
    text: |-
      [Artikel 2, derde lid][ref1], is tot 1 juli 2010 niet van toepassing op een persoon die beschikt over een diploma
      auto-airco monteur (STEK) of een diploma demonteur auto-airco (STEK).


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel2
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '30.3'
    text: |-
      Een bedrijf dat aan de ter zake geldende eisen ingevolge de Aanwijzingsregeling Stichting Erkenningsregeling
      voor de uitoefening van het Koeltechnisch Installatiebedrijf voldoet en als zodanig is erkend wordt geacht tot
      1 juli 2011 houder te zijn van een tussentijds bedrijfscertificaat ten behoeve van het kunnen verrichten van de
      werkzaamheden, bedoeld in [artikel 18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel18
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '31.1'
    text: |-
      Nadat degene die houder is van een diploma STEK-monteur of een diploma CFK-monteur dit diploma aan de
      minister heeft toegezonden, verstrekt de minister een diploma behorend bij categorie I als bedoeld in
      [artikel 2, tweede lid, onder a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel2
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '31.2'
    text: |-
      Nadat degene die houder is van een diploma auto-airco monteur (STEK) of een diploma demonteur auto-airco
      (STEK) dit diploma aan de minister heeft toegezonden, verstrekt de minister een diploma als bedoeld in
      [artikel 2, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel2
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '31.3'
    text: |-
      Indien de toezending van het diploma, bedoeld in het eerste of tweede lid, geschiedt voor 1 maart 2010, zendt
      de minister het diploma behorend bij categorie I als bedoeld in [artikel 2, tweede lid, onder a][ref1], of het
      diploma, bedoeld in [artikel 2, derde lid][ref2], tezamen met het oorspronkelijke diploma voor 1 juli 2010 aan de
      betrokkene toe.


      [ref1]: https://wetten.overheid.nl/BWBR0026453#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0026453#Artikel2
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0026453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0026453
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '32.1'
    text: |-
      Met de beroepseisen, bedoeld in artikel 2, eerste lid, en waarop Verordening (EG) nr. 303/2008 van de Europese
      Commissie van 2 april 2008 tot instelling, ingevolge Verordening (EG) nr. 842/2006 van het Europees Parlement en
      de Raad van de Europese Unie, van minimumeisen en de voorwaarden voor wederzijdse erkenning voor de certificering
      van bedrijven en personeel betreffende stationaire koel-, klimaatregelings- en warmtepompapparatuur die bepaalde
      gefluoreerde broeikasgassen bevat (PbEU L 92) niet van toepassing is, worden gelijkgesteld beroepseisen die worden
      gesteld in een andere lidstaat van de Europese Unie dan wel een staat, niet zijnde een lidstaat van de Europese
      Unie die partij is bij een daartoe strekkend of mede daartoe strekkend Verdrag dat Nederland bindt, en die een
      beroepsniveau waarborgen dat ten minste gelijkwaardig is aan het niveau van deze regeling.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel32
  - number: '32.2'
    text: |-
      Met de beroepseisen, bedoeld in artikel 2, derde lid, en waarop Verordening (EG) nr. 307/2008 van de Europese
      Commissie van 2 april 2008 tot vaststelling, ingevolge Verordening (EG) nr. 842/2006 van het Europees Parlement
      en de Raad van de Europese Unie, van minimumeisen voor opleidingsprogramma’s en de voorwaarden voor wederzijdse
      erkenning van opleidingsvoorschriften voor personeel op het gebied van bepaalde gefluoreerde broeikasgassen
      bevattende klimaatregelingssystemen in bepaalde motorvoertuigen (PbEU L 92) niet van toepassing is, worden
      gelijkgesteld beroepseisen die worden gesteld in een andere lidstaat van de Europese Unie dan wel een staat, niet
      zijnde een lidstaat van de Europese Unie die partij is bij een daartoe strekkend of mede daartoe strekkend Verdrag
      dat Nederland bindt, en die een beroepsniveau waarborgen dat ten minste gelijkwaardig is aan het niveau van deze
      regeling.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel32
  - number: '32.3'
    text: |-
      Met een bedrijfscertificaat als bedoeld in artikel 18 en waarop Verordening (EG) nr. 303/2008 van de Europese
      Commissie van 2 april 2008 tot instelling, ingevolge Verordening (EG) nr. 842/2006 van het Europees Parlement en
      de Raad van de Europese Unie, van minimumeisen en de voorwaarden voor wederzijdse erkenning voor de certificering
      van bedrijven en personeel betreffende stationaire koel-, klimaatregelings- en warmtepompapparatuur die bepaalde
      gefluoreerde broeikasgassen bevat (PbEU L 92) niet van toepassing is, wordt gelijkgesteld een verklaring van
      goedkeuring, afgegeven door een onafhankelijke keuringsinstantie in een andere lidstaat van de Europese Unie
      dan wel een staat, niet zijnde een lidstaat van de Europese Unie die partij is bij een daartoe strekkend of mede
      daartoe strekkend Verdrag dat Nederland bindt, welke verklaring is afgegeven op basis van onderzoekingen die een
      beschermingsniveau bieden dat ten minste gelijkwaardig is aan het niveau van deze regeling.
    url: https://wetten.overheid.nl/BWBR0026453/2011-06-30#Artikel32
  - number: '33'
    text: |-
