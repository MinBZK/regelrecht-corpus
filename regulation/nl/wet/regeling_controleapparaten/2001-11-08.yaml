---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_controleapparaten
regulatory_layer: WET
publication_date: '2005-07-11'
valid_from: '2001-11-08'
bwb_id: BWBR0010021
url: https://wetten.overheid.nl/BWBR0010021/2001-11-08
preamble:
  text: |-
    Gelet op de artikelen 2.4:5, 2.4:6 en 2.6:1, eerste lid, onderdeel b, van het Arbeidstijdenbesluit vervoer;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a
            Besluit:

              [Arbeidstijdenbesluit vervoer][ref1];



            b
            importeur:

              door de fabrikant contractueel erkende importeur;



            c
            installateur:

              natuurlijke persoon of rechtspersoon die bedrijfsmatig de inbouw verzorgt van, alsmede onderzoeken verricht
      aan controleapparaten;



            d
            mobiele installatie-eenheid:

              installatie-eenheid waarmee niet steeds in dezelfde werkplaats, doch afwisselend in verscheidene
      werkplaatsen gewerkt wordt;



            e
            onderzoek:

              het op grond van [artikel 38, onderdelen a en b][ref2], verplichte onderzoek van het controleapparaat;



            f
            reparateur:

              natuurlijke persoon of rechtspersoon die bedrijfsmatig reparaties uitvoert aan controleapparaten;



            g
            reparatie:

              het repareren van het mechanisme van een controleapparaat en alles wat daarmee verband houdt, een en ander
      voor zover het de bevoegdheid van de installateur te boven gaat;



            h
            werkplaats:

              overdekte en behoorlijk af te sluiten ruimte waarin de werkzaamheden onder alle weersomstandigheden normaal
      kunnen worden verricht;



            i
            erkenninghouder:

              een installateur of een reparateur die op grond van deze regeling als zodanig is erkend.


      [ref1]: https://wetten.overheid.nl/BWBR0009386
      [ref2]: https://wetten.overheid.nl/BWBR0010021#Artikel38
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009386
      - id: ref2
        bwb_id: BWBR0010021
        artikel: '38'
        paragraaf: '8'
  - number: '2.1'
    text: |-
      Een goedkeuring van een controleapparaat of registratieblad wordt door de Dienst Wegverkeer verleend indien voldaan
      wordt aan het bepaalde bij of krachtens artikel 5 van [verordening (EEG) nr. 3821/85](31985R3821).
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel2
  - number: '2.2'
    text: |-
      De aanvraag tot goedkeuring van een controleapparaat of registratieblad wordt ingediend bij de Dienst Wegverkeer,
      waarbij alle op het controleapparaat en het registratieblad betrekking hebbende gegevens worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel2
  - number: '3.1'
    text: 'De Dienst Wegverkeer kan een erkenning verlenen als:'
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel3
  - number: 3.1.a
    text: installateur;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel3
  - number: 3.1.b
    text: reparateur.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel3
  - number: '3.2'
    text: 'In de erkenning wordt vermeld:'
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel3
  - number: 3.2.a
    text: of het een erkenning als installateur, dan wel als reparateur betreft;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel3
  - number: 3.2.b
    text: de door de erkenninghouder gevoerde merken controleapparaat ten aanzien waarvan de erkenning verleend wordt;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel3
  - number: 3.2.c
    text: naam en adres van de erkenninghouder;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel3
  - number: 3.2.d
    text: |-
      het adres van de werkplaats waar de met inbouw, onderzoek en reparatie verband houdende werkzaamheden worden
      verricht;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel3
  - number: 3.2.e
    text: |-
      het ingevolge [artikel 7][ref1] toegekende verzegelnummer.


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Artikel7
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0010021
        artikel: '7'
        paragraaf: '3'
  - number: '3.3'
    text: |-
      Het tweede lid, onderdeel d, is niet van toepassing in geval van een erkenning als bedoeld in
      [artikel 4, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Artikel4
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0010021
        artikel: '4'
        paragraaf: '3'
  - number: '4.1'
    text: |-
      De Dienst Wegverkeer verleent een erkenning als installateur of reparateur aan de natuurlijke persoon of
      rechtspersoon die ten aanzien van de gevoerde merken voldoet aan de in [paragraaf 4][ref1] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Paragraaf4
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0010021
        paragraaf: '4'
  - number: '4.2'
    text: |-
      Een erkenning voor een mobiele installatie-eenheid wordt verleend aan een natuurlijke persoon of rechtspersoon
      voor de door deze gevoerde merken controleapparaat ten aanzien waarvan wordt voldaan aan de eisen, gesteld in de
      [artikelen 9][ref1] en [11][ref2] tot met 14.


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0010021#Artikel11
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0010021
        artikel: '9'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0010021
        artikel: '11'
        paragraaf: '4'
  - number: '4.3'
    text: 'De in het tweede lid bedoelde mobiele installatie-eenheid wordt ten behoeve van de identificatie gekoppeld aan:'
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel4
  - number: 4.3.a
    text: de naam van de persoon die de werkzaamheden verricht, dan wel
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel4
  - number: 4.3.b
    text: het kenteken van het voertuig van waaruit de werkzaamheden worden verricht.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel4
  - number: '5.1'
    text: |-
      De aanvraag voor een erkenning wordt bij de Dienst wegverkeer ingediend door middel van een volledig ingevuld en
      ondertekend aanvraagformulier.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel5
  - number: '5.2'
    text: 'De aanvrager van een erkenning overlegt tegelijk met het aanvraagformulier de volgende bescheiden:'
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel5
  - number: 5.2.a
    text: |-
      voorzover inschrijving in het handelsregister ingevolge de Handelsregisterwet verplicht is, een niet eerder dan één
      jaar vóór het tijdstip van indiening van de aanvraag door de secretaris van de Kamer van Koophandel en Fabrieken
      waarbij de aanvrager of een onderneming waarop de aanvraag betrekking heeft, is ingeschreven, verstrekt uittreksel,
      afschrift, fotografische reproduktie of schriftelijke mededeling waaruit blijkt dat de aanvrager of de onderneming
      op het tijdstip van afgifte van dat geschrift was ingeschreven in het handelsregister;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel5
  - number: 5.2.b
    text: |-
      voorzover inschrijving in het verenigingenregister of het stichtingenregister ingevolge boek 2 van het Burgerlijk
      Wetboek verplicht is of inschrijving in het verenigingenregister ingevolge [artikel 30, derde lid][ref1], van Boek
      2 van genoemd wetboek is geschied, een niet eerder dan één jaar vóór het tijdstip van indiening van de aanvraag
      door de secretaris van de Kamer van Koophandel en Fabrieken waarbij de aanvrager is ingeschreven, verstrekte
      afdruk of schriftelijke mededeling waaruit blijkt dat de aanvrager op het tijdstip van afgifte van die afdruk of
      mededeling was ingeschreven in het verenigingenregister of in het stichtingenregister;


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Artikel30
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010021
        artikel: '30'
        paragraaf: '6'
  - number: 5.2.c
    text: |-
      indien de aanvraag namens de aanvrager door een ander wordt ingediend, een gewaarmerkt afschrift van een geschrift
      waaruit blijkt dat die ander tot de vertegenwoordiging bevoegd is.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel5
  - number: '6'
    text: |-
      De Dienst Wegverkeer kent aan de erkenninghouder toegangscodes toe voor de melding van de inbouw of het onderzoek,
      bedoeld in [artikel 31][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Artikel31
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0010021
        artikel: '31'
        paragraaf: '6'
  - number: '7'
    text: 'De Dienst Wegverkeer kent een verzegelnummer toe aan:'
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel7
  - number: 7.a
    text: de erkenninghouder
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel7
  - number: 7.b
    text: daartoe aangewezen opsporingsambtenaren van de Rijksverkeersinspectie
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel7
  - number: 7.c
    text: |-
      de ambtenaren als bedoeld in [artikel 3, eerste lid, van de Politiewet 1993][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel3
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '3'
  - number: '8.1'
    text: |-
      De Dienst Wegverkeer trekt een erkenning geheel of gedeeltelijk in, indien degene aan wie de erkenning is verleend,
      daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel8
  - number: '8.2'
    text: |-
      De Dienst Wegverkeer kan een erkenning geheel of gedeeltelijk intrekken indien degene aan wie de erkenning is
      verleend:
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel8
  - number: 8.2.a
    text: |-
      niet meer voldoet aan de erkenningseisen, neergelegd in [paragraaf 4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Paragraaf4
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0010021
        paragraaf: '4'
  - number: 8.2.b
    text: |-
      in strijd handelt met de erkenningsvoorschriften, neergelegd in [paragraaf 5][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Paragraaf5
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0010021
        paragraaf: '5'
  - number: 8.2.c
    text: |-
      in strijd met de voorschriften, neergelegd in [paragraaf 6][ref1], een inbouw, onderzoek of reparatie verricht;


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Paragraaf6
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0010021
        paragraaf: '6'
  - number: 8.2.d
    text: |-
      de verplichtingen, neergelegd in [paragraaf 7][ref1], niet nakomt.


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Paragraaf7
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0010021
        paragraaf: '7'
  - number: '8.3'
    text: |-
      De Dienst Wegverkeer kan de aan een erkenning verbonden voorschriften wijzigen indien gewijzigde inzichten dan wel
      ontwikkelingen in de techniek zulks noodzakelijk maken.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel8
  - number: '8.4'
    text: |-
      De Dienst Wegverkeer kan in de gevallen, bedoeld in het tweede lid, onderdelen a en c, een erkenning schorsen voor
      een door hem daarbij vast te stellen termijn die ten hoogste drie maanden bedraagt.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel8
  - number: '9.1'
    text: 'De aanvrager van een erkenning als installateur beschikt over:'
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel9
  - number: 9.1.a
    text: |-
      door de Dienst Wegverkeer goedgekeurde wegdraaital-meetapparatuur, geschikt voor zowel mechanische als
      elektronische controleapparaataandrijving;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel9
  - number: 9.1.b
    text: |-
      een door de Dienst Wegverkeer goedgekeurde impulsenteller ten behoeve van het afstellen van elektronisch aanpasbare
      controleapparaten;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel9
  - number: 9.1.c
    text: een verzegelinrichting, geschikt voor de gevoerde merken controleapparaat;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel9
  - number: 9.1.d
    text: een bandenpomp met bandenluchtdrukmeetapparatuur;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel9
  - number: 9.1.e
    text: |-
      door de Dienst Wegverkeer goedgekeurde testapparatuur voor snelheids- en afstandsmetingen alsmede voor de daarop
      betrekking hebbende registratie;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel9
  - number: 9.1.f
    text: apparatuur voorzien van een loep voor het onderzoeken van registratiebladen;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel9
  - number: 9.1.g
    text: een onderzoeksjablone, waarop de toegestane tolerantiegebieden staan aangegeven;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel9
  - number: 9.1.h
    text: |-
      overige, door de fabrikant of importeur van de gevoerde merken controleapparaat voorgeschreven gereedschappen,
      apparatuur, werkplaatshandboeken en documentatie.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel9
  - number: '9.2'
    text: 'De aanvrager beschikt over:'
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel9
  - number: 9.2.a
    text: |-
      een door de Dienst Wegverkeer goedgekeurde rollentestbank of remmentestbank, aangepast ten behoeve van het bepalen
      van het wegdraaital of het bepalen van de bandenomtrek, dan wel
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel9
  - number: 9.2.b
    text: een voor motorrijtuigen geschikte horizontale effen meetbaan van ten minste 20 meter lengte.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel9
  - number: '9.3'
    text: |-
      De apparatuur, genoemd in het eerste lid, onderdelen e, f en g, is niet vereist voor werkplaatsen van fabrikanten
      of importeurs van motorrijtuigen, mits de inbouw betrekking heeft op motorrijtuigen die voor de eerste maal in
      gebruik worden genomen.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel9
  - number: '10'
    text: 'De aanvrager van een erkenning als reparateur beschikt over:'
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel10
  - number: 10.a
    text: |-
      een door de Dienst Wegverkeer goedgekeurde impulsenteller ten behoeve van het afstellen van elektronisch aanpasbare
      controleapparaten;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel10
  - number: 10.b
    text: |-
      door de Dienst Wegverkeer goedgekeurde testapparatuur voor snelheids- en afstandsmetingen alsmede voor de daarop
      betrekking hebbende registratie;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel10
  - number: 10.c
    text: apparatuur voorzien van een loep voor het onderzoeken van registratiebladen;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel10
  - number: 10.d
    text: een onderzoeksjablone, waarop de toegestane tolerantiegebieden staan aangegeven;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel10
  - number: 10.e
    text: een verzegelinrichting welke geschikt is voor de gevoerde merken controleapparaat;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel10
  - number: 10.f
    text: |-
      overige, door de fabrikant of importeur van de gevoerde merken controleapparaat voorgeschreven gereedschappen,
      apparatuur, werkplaatshandboeken en documentatie.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel10
  - number: '11'
    text: |-
      De aanvrager van een erkenning als installateur of reparateur beschikt over een register, waarvan de
      registerkaarten overeenkomen met het door de Dienst Wegverkeer vastgestelde model zoals opgenomen in de bijlage bij
      deze regeling.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel11
  - number: '12.1'
    text: |-
      De aanvrager van een erkenning als installateur, dan wel het door hem voor installatie en onderzoek van
      controleapparaten aangewezen personeel, heeft met goed gevolg, aan te tonen door middel van een in de werkplaats
      aanwezig bewijs van deelname, een cursus doorlopen met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel12
  - number: 12.1.a
    text: het installeren en functioneren van controleapparaten;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel12
  - number: 12.1.b
    text: |-
      het functioneren van snelheidsbegrenzers met betrekking tot aspecten die van belang zijn bij de inbouw en het
      onderzoek van controleapparaten;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel12
  - number: 12.1.c
    text: |-
      het functioneren van motorrijtuigen met betrekking tot aspecten die van belang zijn bij de inbouw en het onderzoek
      van controleapparaten;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel12
  - number: 12.1.d
    text: |-
      de wettelijke voorschriften ten aanzien van controleapparaten alsmede ten aanzien van snelheidsbegrenzers voorzover
      van belang voor de inbouw en het onderzoek van controleapparaten.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel12
  - number: '12.2'
    text: |-
      De aanvrager van een erkenning als reparateur dan wel het door hem voor reparatie van controleapparaten aangewezen
      personeel heeft met goed gevolg, aan te tonen door middel van een in de werkplaats aanwezig bewijs van deelname,
      een cursus doorlopen met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel12
  - number: 12.2.a
    text: het repareren van controleapparaten;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel12
  - number: 12.2.b
    text: de wettelijke voorschriften ten aanzien van controleapparaten.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel12
  - number: '12.3'
    text: |-
      De in het eerste, onderscheidenlijk tweede lid bedoelde cursussen zijn georganiseerd door de fabrikant of importeur
      van de in het kader van de erkenning als installateur of reparateur te voeren merken controleapparaat, dan wel door
      een door de Dienst Wegverkeer aangewezen instelling.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel12
  - number: '13.1'
    text: |-
      De aanvrager van de erkenning meldt bij de Dienst Wegverkeer de personen, bedoeld in [artikel 12][ref1], eerste dan
      wel tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Artikel12
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0010021
        artikel: '12'
        paragraaf: '4'
  - number: '13.2'
    text: 'Op het bewijs van deelname is ten minste vermeld:'
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel13
  - number: 13.2.a
    text: maand en jaar van deelname aan de cursus;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel13
  - number: 13.2.b
    text: de typen en merken controleapparaat waarop de cursus betrekking had;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel13
  - number: 13.2.c
    text: de naam van de deelnemer aan de cursus.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel13
  - number: '14.1'
    text: |-
      De aanvrager van een erkenning als installateur beschikt over een voorziening voor het door middel van
      datacommunicatie melden van de inbouw en het onderzoek aan de Dienst Wegverkeer. Deze voorziening moet geschikt
      zijn voor de toegangsstructuur van een door de Directeur geaccepteerd netwerk.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel14
  - number: '14.2'
    text: |-
      Het in het eerste lid bepaalde geldt niet voor fabrikanten of importeurs van motorrijtuigen, mits deze zich
      beperken tot het inbouwen van controleapparaten in motorrijtuigen die voor de eerste maal in gebruik worden
      genomen.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel14
  - number: '15'
    text: |-
      De Erkenninghouder draagt er zorg voor dat onderzoeken, installaties en reparaties slechts worden uitgevoerd door
      de in [artikel 12][ref1] bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Artikel12
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0010021
        artikel: '12'
        paragraaf: '4'
  - number: '16'
    text: |-
      Onverminderd [artikel 12][ref1] beschikt de houder van een erkenning dan wel het door hem aangewezen personeel over
      actuele kennis omtrent de in het kader van de erkenning te voeren merken controleapparaat. [Artikel 13][ref2] is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0010021#Artikel13
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0010021
        artikel: '12'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0010021
        artikel: '13'
        paragraaf: '4'
  - number: '17'
    text: |-
      Behoudens in geval van een erkenning als bedoeld in [artikel 4, tweede lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Artikel4
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0010021
        artikel: '4'
        paragraaf: '3'
  - number: 17.a
    text: |-
      geschieden de met de inbouw, het onderzoek en de reparatie verband houdende werkzaamheden slechts in de werkplaats
      welke in de erkenning is vermeld;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel17
  - number: 17.b
    text: is aan de buitenkant van de werkplaats duidelijk zichtbaar een schild aangebracht waaruit de erkenning blijkt.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel17
  - number: '18'
    text: |-
      De erkenninghouder draagt er zorg voor dat de bij hem in gebruik zijnde verzegelinrichting alsmede de aan hem
      verstrekte toegangscodes niet toegankelijk zijn voor onbevoegden.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel18
  - number: '21.1'
    text: 'Bij het onderzoek wordt de werking gecontroleerd van:'
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel21
  - number: 21.1.a
    text: de snelheidsmeter;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel21
  - number: 21.1.b
    text: het uurwerk;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel21
  - number: 21.1.c
    text: de verlichting van het controleapparaat;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel21
  - number: 21.1.d
    text: de merkorganen, bedoeld in bijlage I, hoofdstuk III onder 1.3 van [Verordening (EEG) nr. 3821/85](31985R3821);
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel21
  - number: '21.2'
    text: 'Bij het onderzoek wordt de verzegeling gecontroleerd van:'
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel21
  - number: 21.2.a
    text: het mechanisme van het controleapparaat;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel21
  - number: 21.2.b
    text: de kilometerteller.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel21
  - number: '21.3'
    text: Een niet goed functionerend of incompleet controleapparaat wordt onverwijld vervangen.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel21
  - number: '22.1'
    text: |-
      Bij het onderzoek wordt de kenmerkende coëfficiënt, als bedoeld in bijlage I, hoofdstuk I onder d) van [Verordening
      (EEG) nr. 3821/85](31985R3821) bepaald door het berekenen van het aantal omwentelingen of impulsen over 1 kilometer
      en op het installatieplaatje en op de registerkaart aangeduid met W= ... omw/km, of W= ... imp/km.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel22
  - number: '22.2'
    text: |-
      De effectieve omtrek der wielbanden, als bedoeld in bijlage I, hoofdstuk I onder e) van [Verordening (EEG) nr.
      3821/85](31985R3821), wordt bepaald door het berekenen van de gemiddelde afstand die door de aangedreven wielen bij
      een volledige omwenteling wordt afgelegd en op het installatieplaatje en op de registerkaart aangeduid met L= ...
      m.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel22
  - number: '22.3'
    text: |-
      De kenmerkende coëfficiënten en de effectieve omtrek der wielbanden worden vastgesteld op een aangepaste
      rollentestbank, een aangepaste remmentestbank of een meetbaan.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel22
  - number: '25.1'
    text: |-
      Bij het onderzoek wordt met behulp van een voor het desbetreffende controleapparaat goedgekeurd registratieblad een
      testregistratie gemaakt met ten minste de registraties van:
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel25
  - number: 25.1.a
    text: de snelheid in ten minste drie stappen;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel25
  - number: 25.1.b
    text: de snelheid bij maximum snelheidsbereik;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel25
  - number: 25.1.c
    text: de werktijd, rijtijd en rusttijd;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel25
  - number: 25.1.d
    text: de afgelegde weg;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel25
  - number: 25.1.e
    text: de werking van de schrijfstiftgeleiding.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel25
  - number: '25.2'
    text: |-
      Met behulp van een leesapparaat, voorzien van een loep en een onderzoekssjabloon, wordt beoordeeld of de
      testregistraties op het testregistratieblad de maximaal toelaatbare fouten, genoemd in hoofdstuk III, onder f) 1 en
      2 van bijlage I van [verordening (EEG) nr. 3821/85](31985R3821) niet overschrijden.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel25
  - number: '25.3'
    text: |-
      Bij het onderzoek worden na inbouw in het motorrijtuig de navolgende waarden met betrekking tot de door het
      controleapparaat geregistreerde gegevens niet overschreden:
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel25
  - number: 25.3.a
    text: 'afgelegde afstand: 2% meer of minder dan de werkelijke afstand, die ten minste 1 km moet bedragen;'
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel25
  - number: 25.3.b
    text: 'snelheid: 4 km/h meer of minder ten opzichte van de werkelijke snelheid.'
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel25
  - number: '25.4'
    text: |-
      Bij reparatie wordt vastgesteld dat de in het tweede lid genoemde waarden met betrekking tot de door de tachograaf
      geregistreerde gegevens niet worden overschreden.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel25
  - number: '26.1'
    text: |-
      Na het onderzoek worden alle verzegelingen, genoemd in Hoofdstuk V onder 4 van bijlage I van [Verordening (EEG) nr.
      3821/85](31985R3821), voorzien van het aan de erkenninghouder toegekend verzegelnummer, aangebracht:
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel26
  - number: 26.1.a
    text: |-
      op de verbinding tussen de aandrijfkabel of de elektrische bedrading van de impulsgever en het controleapparaat en
      op de verbinding tussen de aandrijfkabel of de elektrische bedrading van de impulsgever en het motorrijtuig;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel26
  - number: 26.1.b
    text: op alle eventueel daar tussen liggende onderbreekbare punten;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel26
  - number: 26.1.c
    text: op het mechanisme van het controleapparaat;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel26
  - number: 26.1.d
    text: op de in het controleapparaat aanwezige kilometerteller;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel26
  - number: 26.1.e
    text: op het aanpassingsorgaan en de aansluiting hiervan op het circuit;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel26
  - number: 26.1.f
    text: op alle overige punten waarmee de instelling van het controleapparaat kan worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel26
  - number: '26.2'
    text: |-
      De verzegeling op het mechanisme van het controleapparaat wordt slechts door een reparateur aangebracht; indien
      verbreking van deze verzegeling echter noodzakelijk is voor het wijzigen van de kilometertellerstand, mag de
      verzegeling door de installateur worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel26
  - number: '26.3'
    text: |-
      In geval van verbreking in het belang van opsporing door ambtenaren als bedoeld in [artikel 7 onder b en c][ref1],
      wordt, in afwijking van het eerste lid, een nieuwe verzegeling aangebracht op de plaatsen waar deze verbroken is.


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Artikel7
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0010021
        artikel: '7'
        paragraaf: '3'
  - number: '26.4'
    text: 'Verbreking als bedoeld in het derde lid vindt slechts plaats ter controle van:'
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel26
  - number: 26.4.a
    text: de juiste instelling van de apparaatconstante van het controleapparaat;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel26
  - number: 26.4.b
    text: |-
      de juiste aansturing van de snelheidsbegrenzer voor zover dit geschiedt met daartoe door de Dienst Wegverkeer
      goedgekeurde testapparatuur;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel26
  - number: 26.4.c
    text: de aanwezigheid van voorzieningen waarmee de juiste werking van het controleapparaat kan worden beïnvloed;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel26
  - number: 26.4.d
    text: |-
      de aanwezigheid van voorzieningen waarmee de juiste werking van de snelheidsbegrenzer kan worden beïnvloed, indien
      het gestelde in [artikel 16 lid 2 van de Erkenningsregeling Snelheidsbegrenzers][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0007081#Artikel16
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0007081
        artikel: '16'
  - number: '26.5'
    text: |-
      Van de verzegeling als bedoeld in het derde lid, wordt aan de bestuurder een schriftelijke kennisgeving,
      gewaarmerkt door de betreffende ambtenaar en voorzien van het in [artikel 7 onder b onderscheidenlijk c][ref1]
      bedoelde verzegelnummer, uitgereikt met de reden waarom de verzegeling werd verbroken.


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Artikel7
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0010021
        artikel: '7'
        paragraaf: '3'
  - number: '27'
    text: |-
      Na het onderzoek wordt een korte rijproef uitgevoerd, waarbij het in [artikel 25, eerste lid][ref1], bedoelde
      testregistratieblad in het controleapparaat aanwezig is, opdat vastgesteld kan worden dat het controleapparaat
      goed functioneert.


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Artikel25
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0010021
        artikel: '25'
        paragraaf: '6'
  - number: '28.1'
    text: |-
      Van iedere inbouw en ieder onderzoek worden de volgende gegevens in het in [artikel 11][ref1] bedoelde register
      vastgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Artikel11
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0010021
        artikel: '11'
        paragraaf: '4'
  - number: 28.1.a
    text: 'met betrekking tot de installateur:'
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel28
  - number: 28.1.a.1
    text: de naam en het adres van de installateur,
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel28
  - number: 28.1.a.2
    text: de naam van de persoon die de inbouw of het onderzoek heeft verricht;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel28
  - number: 28.1.b
    text: 'met betrekking tot het motorrijtuig:'
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel28
  - number: 28.1.b.1
    text: het kenteken, of
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel28
  - number: 28.1.b.2
    text: indien het motorrijtuig nog niet is voorzien van een kenteken, het chassisnummer,
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel28
  - number: 28.1.b.3
    text: merk en type,
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel28
  - number: 28.1.b.4
    text: de kilometerstand,
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel28
  - number: 28.1.b.5
    text: effectieve omtrek der wielbanden, en
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel28
  - number: 28.1.b.6
    text: de ongecorrigeerde kenmerkende coëfficiënt van het motorrijtuig in omw/km of imp/km;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel28
  - number: 28.1.c
    text: 'met betrekking tot de installatie:'
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel28
  - number: 28.1.c.1
    text: |-
      de ongecorrigeerde kenmerkende coëfficiënt in omw/km of imp/km of in geval van een aanpasbaar controleapparaat de
      ingestelde apparaatconstante in imp/km, en
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel28
  - number: 28.1.c.2
    text: het merk, type en serienummer van het controleapparaat;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel28
  - number: 28.1.d
    text: 'met betrekking tot de uitgevoerde werkzaamheden:'
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel28
  - number: 28.1.d.1
    text: de datum van de inbouw of het onderzoek, en
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel28
  - number: 28.1.d.2
    text: de handtekening van de in onderdeel a, onder 2°, bedoelde persoon.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel28
  - number: '28.2'
    text: |-
      Het in het eerste lid bepaalde geldt niet voor fabrikanten of importeurs van motorrijtuigen, mits dezen zich
      beperken tot het inbouwen van controleapparaten in motorrijtuigen die voor de eerste maal in gebruik worden
      genomen.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel28
  - number: '28.3'
    text: |-
      Het bij inbouw of onderzoek gebruikte testregistratieblad, het bij de reparatie gebruikte testregistratieblad dan
      wel een afschrift van laatstgenoemd testregistratieblad wordt bij het register gevoegd.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel28
  - number: '28.4'
    text: |-
      In afwijking van het derde lid mag, in geval van toepassing van een controleapparaat dat door een erkende
      reparateur is gerepareerd, het testregistratieblad vervangen worden door het door de reparateur voor dit
      controleapparaat afgegeven testregistratieblad, mits dit blad de in [artikel 25][ref1] bedoelde registraties bevat.


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Artikel25
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0010021
        artikel: '25'
        paragraaf: '6'
  - number: '29'
    text: |-
      Van iedere reparatie worden de volgende gegevens in het in [artikel 11][ref1] bedoelde register vastgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Artikel11
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0010021
        artikel: '11'
        paragraaf: '4'
  - number: 29.a
    text: de naam en het adres van de reparateur,
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel29
  - number: 29.b
    text: de naam van de persoon die de reparatie heeft uitgevoerd,
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel29
  - number: 29.c
    text: merk, type en serienummer van het controleapparaat,
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel29
  - number: 29.d
    text: de aard van de reparatie,
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel29
  - number: 29.e
    text: de datum van de reparatie, en
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel29
  - number: 29.f
    text: de handtekening van de in onderdeel b bedoelde persoon.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel29
  - number: '30'
    text: |-
      De erkenninghouder bewaart het register gedurende ten minste drie jaar vanaf het moment van inbouw, onderzoek of
      reparatie.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel30
  - number: '31.1'
    text: |-
      Na de inbouw of het onderzoek worden door middel van datacommunicatie de volgende gegevens aan de Dienst Wegverkeer
      gemeld:
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel31
  - number: 31.1.a
    text: toegangscodes;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel31
  - number: 31.1.b
    text: |-
      indien het motorrijtuig is voorzien van een kenteken: het kenteken en de meldcode, gevormd door de laatste vier
      cijfers van het chassisnummer;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel31
  - number: 31.1.c
    text: 'indien het motorrijtuig nog niet is voorzien van een kenteken: het volledige chassisnummer;'
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel31
  - number: 31.1.d
    text: merk, serienummer en ingestelde apparaatconstante van het controleapparaat.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel31
  - number: '31.2'
    text: |-
      In geval van een mobiele installatie-eenheid wordt in aanvulling op het eerste lid tevens het adres met postcode
      van de werkplaats waar de inbouw of het onderzoek is verricht, gemeld.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel31
  - number: '31.3'
    text: |-
      De in het eerste lid genoemde meldingsplicht geldt niet voor fabrikanten of importeurs van motorrijtuigen,
      voorzover het de inbouw betreft in motorrijtuigen die voor de eerste maal in gebruik worden genomen.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel31
  - number: '31.4'
    text: De door de Dienst Wegverkeer gegeven aanwijzingen met betrekking tot de melding worden in acht genomen.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel31
  - number: '32.1'
    text: |-
      Nadat is vastgesteld dat alle in [artikel 26][ref1] bedoelde verzegelingen aanwezig zijn, wordt in de
      bestuurdersruimte op het controleapparaat of op een duidelijk zichtbare en goed waarneembare plaats in de directe
      nabijheid van het controleapparaat een goed zichtbaar en leesbaar installatieplaatje aangebracht waarop ten minste
      de volgende gegevens op onuitwisbare wijze zijn aangebracht:


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Artikel26
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0010021
        artikel: '26'
        paragraaf: '6'
  - number: 32.1.a
    text: de naam, het adres en het verzegelnummer van de installateur,
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel32
  - number: 32.1.b
    text: het kenteken van het motorrijtuig, dan wel, indien dit nog niet bekend is, het chassisnummer,
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel32
  - number: 32.1.c
    text: de kenmerkende coëfficiënt van het motorrijtuig;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel32
  - number: 32.1.d
    text: de bandenomtrek van het motorrijtuig, en
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel32
  - number: 32.1.e
    text: de datum van de inbouw of van het onderzoek.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel32
  - number: '32.2'
    text: |-
      In geval van inbouw of onderzoek van een elektronisch aanpasbaar controleapparaat wordt op of in het
      controleapparaat een sticker aangebracht, waarop de ingestelde vier- of meercijferige apparaatconstante goed
      zichtbaar en leesbaar staat vermeld, waarbij de apparaatconstante wordt aangeduid met k= ......imp/km.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel32
  - number: '32.3'
    text: |-
      De in het tweede lid bedoelde sticker wordt van een verzegeling voorzien dan wel zodanig aangebracht dat deze bij
      verwijdering onherstelbaar wordt beschadigd.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel32
  - number: '33'
    text: |-
      Het in [artikel 32][ref1] bedoelde installatieplaatje wordt niet aangebracht dan nadat is vastgesteld dat het
      controleapparaat goed is afgesteld en verzegeld en door de Dienst Wegverkeer is medegedeeld dat:


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Artikel32
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0010021
        artikel: '32'
        paragraaf: '6'
  - number: 33.a
    text: |-
      de in [artikel 31][ref1] bedoelde melding niet leidt tot een controle van de inbouw of het onderzoek door Dienst
      Wegverkeer, of


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Artikel31
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0010021
        artikel: '31'
        paragraaf: '6'
  - number: 33.b
    text: |-
      de melding leidt tot een controle van de inbouw of het onderzoek, doch deze controle niet binnen 90 minuten na de
      melding wordt begonnen, dan wel
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel33
  - number: 33.c
    text: |-
      de melding leidt tot een controle van de inbouw of het onderzoek en deze controle heeft geleid tot een goedkeuring
      van de desbetreffende werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel33
  - number: '34.1'
    text: |-
      De Dienst Wegverkeer schouwt ten minste één keer per jaar het bedrijf of de mobiele installatie-eenheid van de
      erkenninghouder.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel34
  - number: '34.2'
    text: |-
      De Dienst Wegverkeer voert tenminste eenmaal per jaar op ten minste 5% van de landelijk verrichte inbouwen en
      onderzoeken een controle uit.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel34
  - number: '35'
    text: |-
      De erkenninghouder mag in de staat van een motorrijtuig dat aan een controle als bedoeld in
      [artikel 34, onderdeel b][ref1], zal worden onderworpen, gedurende een periode van 90 minuten na het tijdstip van
      melding van de inbouw of het onderzoek geen wijziging brengen of laten brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Artikel34
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0010021
        artikel: '34'
        paragraaf: '7'
  - number: '36.1'
    text: |-
      De erkenninghouder verleent alle medewerking aan de in [artikel 34, onderdelen a en b][ref1], bedoelde handelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Artikel34
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0010021
        artikel: '34'
        paragraaf: '7'
  - number: '36.2'
    text: |-
      Tijdens de in [artikel 34, tweede lid][ref1], bedoelde handelingen is degene die de inbouw of het onderzoek heeft
      verricht aanwezig.


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Artikel34
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0010021
        artikel: '34'
        paragraaf: '7'
  - number: '37.1'
    text: |-
      De werkgever en de persoon, bedoeld in artikel 2.2:2 van het Besluit, zorgen ervoor dat het controleapparaat door
      een erkende installateur is aangebracht, en door deze is voorzien van een installatieplaatje en van verzegelingen
      als bedoeld in [artikel 26, eerste lid][ref1], onderscheidenlijk [artikel 32][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0010021#Artikel32
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0010021
        artikel: '26'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0010021
        artikel: '32'
        paragraaf: '6'
  - number: '37.2'
    text: |-
      In afwijking van het eerste lid mag een motorrijtuig, ingevoerd uit één der lid-staten van de Europese Unie of een
      andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte, zijn voorzien van een
      controleapparaat dat volgens de in die lid-staat geldende voorschriften is geïnstalleerd.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel37
  - number: '38'
    text: 'De werkgever en de persoon, bedoeld in artikel 2.2:2 van het Besluit, zorgen ervoor dat:'
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel38
  - number: 38.a
    text: ten minste eenmaal per twee jaar het controleapparaat door een erkende installateur wordt onderzocht;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel38
  - number: 38.b
    text: |-
      na iedere verbreking van verzegelingen als bedoeld in [artikel 26, eerste lid][ref1], en na iedere wijziging
      aan het motorrijtuig waardoor wegdraaital of bandenomtrek zijn beïnvloed, het controleapparaat door een erkend
      installateur wordt onderzocht;


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Artikel26
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0010021
        artikel: '26'
        paragraaf: '6'
  - number: 38.c
    text: |-
      na ieder onderzoek het controleapparaat door een erkende installateur is voorzien van een installatieplaatje en van
      verzegelingen als bedoeld in de [artikelen 26, eerste lid][ref1], onderscheiden-lijk 32;


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Artikel26
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0010021
        artikel: '26'
        paragraaf: '6'
  - number: 38.d
    text: |-
      tijdens het gebruik van het motorrijtuig de maximaal toelaatbare fouten, aangegeven in bijlage I, hoofdstuk III
      onder f) 3 van [Verordening nr. (EEG) 3821/85](31985R3821) niet worden overschreden;
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel38
  - number: 38.e
    text: de onder c bedoelde verzegelingen ongewijzigd en intact blijven.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel38
  - number: '39'
    text: |-
      Van de verplichting tot installatie en gebruik van het controleapparaat wordt vrijstelling verleend voor
      motorrijtuigen die:
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel39
  - number: 39.a
    text: |-
      vervoer verrichten als bedoeld in artikel 13, onderdelen c, e, f en g van [verordening (EEG) nr. 3820/85]
      (31985R3820);
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel39
  - number: 39.b
    text: |-
      worden gebruikt voor het geven van rijonderricht en zijn voorzien van een krachtens de
      [Regeling vaststelling L-bord][ref1] voorgeschreven blauwe plaat met de letter L.


      [ref1]: https://wetten.overheid.nl/BWBR0008048
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0008048
  - number: '41'
    text: |-
      De op grond van de Regeling voorschriften tachografen erkende installateurs en reparateurs zijn erkend op grond van
      deze regeling.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel41
  - number: '42'
    text: De Regeling voorschriften tachografen wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel42
  - number: '43'
    text: |-
      Deze regeling wordt aangehaald als: [Regeling controleapparaten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010021
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0010021
  - number: '44'
    text: Deze regeling treedt in werking met ingang van 1 december 1998.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel44
