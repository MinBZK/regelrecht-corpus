        artikel: '31'
        paragraaf: '6'
  - number: '7'
    text: |-
      De Dienst Wegverkeer kent een verzegelnummer toe aan:

      a. de erkenninghouder

      b. daartoe aangewezen opsporingsambtenaren van de Rijksverkeersinspectie

      c. de ambtenaren als bedoeld in [artikel 3, eerste lid, van de Politiewet 1993][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel3
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '3'
  - number: '8'
    text: |-
      1 De Dienst Wegverkeer trekt een erkenning geheel of gedeeltelijk in, indien degene aan wie de erkenning is
      verleend, daarom verzoekt.

      2 De Dienst Wegverkeer kan een erkenning geheel of gedeeltelijk intrekken indien degene aan wie de erkenning is
      verleend:

      a. niet meer voldoet aan de erkenningseisen, neergelegd in [paragraaf 4][ref1];

      b. in strijd handelt met de erkenningsvoorschriften, neergelegd in [paragraaf 5][ref2];

      c. in strijd met de voorschriften, neergelegd in [paragraaf 6][ref3], een inbouw, onderzoek of reparatie verricht;

      d. de verplichtingen, neergelegd in [paragraaf 7][ref4], niet nakomt.

      3 De Dienst Wegverkeer kan de aan een erkenning verbonden voorschriften wijzigen indien gewijzigde inzichten dan
      wel ontwikkelingen in de techniek zulks noodzakelijk maken.

      4 De Dienst Wegverkeer kan in de gevallen, bedoeld in het tweede lid, onderdelen a en c, een erkenning schorsen
      voor een door hem daarbij vast te stellen termijn die ten hoogste drie maanden bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Paragraaf4
      [ref2]: https://wetten.overheid.nl/BWBR0010021#Paragraaf5
      [ref3]: https://wetten.overheid.nl/BWBR0010021#Paragraaf6
      [ref4]: https://wetten.overheid.nl/BWBR0010021#Paragraaf7
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel8
