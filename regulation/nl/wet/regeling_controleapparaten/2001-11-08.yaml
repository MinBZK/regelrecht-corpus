        artikel: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0010021
        artikel: '4'
        paragraaf: '3'
  - number: '4'
    text: |-
      1 De Dienst Wegverkeer verleent een erkenning als installateur of reparateur aan de natuurlijke persoon of
      rechtspersoon die ten aanzien van de gevoerde merken voldoet aan de in [paragraaf 4][ref1] gestelde eisen.

      2 Een erkenning voor een mobiele installatie-eenheid wordt verleend aan een natuurlijke persoon of rechtspersoon
      voor de door deze gevoerde merken controleapparaat ten aanzien waarvan wordt voldaan aan de eisen, gesteld in de
      [artikelen 9][ref2] en [11][ref3] tot met 14.

      3 De in het tweede lid bedoelde mobiele installatie-eenheid wordt ten behoeve van de identificatie gekoppeld aan:

      a. de naam van de persoon die de werkzaamheden verricht, dan wel

      b. het kenteken van het voertuig van waaruit de werkzaamheden worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Paragraaf4
      [ref2]: https://wetten.overheid.nl/BWBR0010021#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0010021#Artikel11
