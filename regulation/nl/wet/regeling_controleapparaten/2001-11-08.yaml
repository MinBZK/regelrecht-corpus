  - number: '5'
    text: |-
      1 De aanvraag voor een erkenning wordt bij de Dienst wegverkeer ingediend door middel van een volledig ingevuld en
      ondertekend aanvraagformulier.

      2 De aanvrager van een erkenning overlegt tegelijk met het aanvraagformulier de volgende bescheiden:

      a. voorzover inschrijving in het handelsregister ingevolge de Handelsregisterwet verplicht is, een niet eerder
      dan één jaar vóór het tijdstip van indiening van de aanvraag door de secretaris van de Kamer van Koophandel en
      Fabrieken waarbij de aanvrager of een onderneming waarop de aanvraag betrekking heeft, is ingeschreven, verstrekt
      uittreksel, afschrift, fotografische reproduktie of schriftelijke mededeling waaruit blijkt dat de aanvrager of de
      onderneming op het tijdstip van afgifte van dat geschrift was ingeschreven in het handelsregister;

      b. voorzover inschrijving in het verenigingenregister of het stichtingenregister ingevolge boek
      2 van het Burgerlijk Wetboek verplicht is of inschrijving in het verenigingenregister ingevolge
      [artikel 30, derde lid][ref1], van Boek 2 van genoemd wetboek is geschied, een niet eerder dan één jaar vóór
      het tijdstip van indiening van de aanvraag door de secretaris van de Kamer van Koophandel en Fabrieken waarbij
      de aanvrager is ingeschreven, verstrekte afdruk of schriftelijke mededeling waaruit blijkt dat de aanvrager op
      het tijdstip van afgifte van die afdruk of mededeling was ingeschreven in het verenigingenregister of in het
      stichtingenregister;

      c. indien de aanvraag namens de aanvrager door een ander wordt ingediend, een gewaarmerkt afschrift van een
      geschrift waaruit blijkt dat die ander tot de vertegenwoordiging bevoegd is.


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Artikel30
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010021
        artikel: '30'
        paragraaf: '6'
  - number: '6'
    text: |-
      De Dienst Wegverkeer kent aan de erkenninghouder toegangscodes toe voor de melding van de inbouw of het onderzoek,
      bedoeld in [artikel 31][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Artikel31
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel6
