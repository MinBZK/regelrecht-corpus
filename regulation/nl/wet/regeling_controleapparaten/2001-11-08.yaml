        paragraaf: '7'
  - number: '9'
    text: |-
      1 De aanvrager van een erkenning als installateur beschikt over:

      a. door de Dienst Wegverkeer goedgekeurde wegdraaital-meetapparatuur, geschikt voor zowel mechanische als
      elektronische controleapparaataandrijving;

      b. een door de Dienst Wegverkeer goedgekeurde impulsenteller ten behoeve van het afstellen van elektronisch
      aanpasbare controleapparaten;

      c. een verzegelinrichting, geschikt voor de gevoerde merken controleapparaat;

      d. een bandenpomp met bandenluchtdrukmeetapparatuur;

      e. door de Dienst Wegverkeer goedgekeurde testapparatuur voor snelheids- en afstandsmetingen alsmede voor de daarop
      betrekking hebbende registratie;

      f. apparatuur voorzien van een loep voor het onderzoeken van registratiebladen;

      g. een onderzoeksjablone, waarop de toegestane tolerantiegebieden staan aangegeven;

      h. overige, door de fabrikant of importeur van de gevoerde merken controleapparaat voorgeschreven gereedschappen,
      apparatuur, werkplaatshandboeken en documentatie.

      2 De aanvrager beschikt over:

      a. een door de Dienst Wegverkeer goedgekeurde rollentestbank of remmentestbank, aangepast ten behoeve van het
      bepalen van het wegdraaital of het bepalen van de bandenomtrek, dan wel

      b. een voor motorrijtuigen geschikte horizontale effen meetbaan van ten minste 20 meter lengte.

      3 De apparatuur, genoemd in het eerste lid, onderdelen e, f en g, is niet vereist voor werkplaatsen van fabrikanten
      of importeurs van motorrijtuigen, mits de inbouw betrekking heeft op motorrijtuigen die voor de eerste maal in
      gebruik worden genomen.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel9
  - number: '10'
    text: |-
      De aanvrager van een erkenning als reparateur beschikt over:

      a. een door de Dienst Wegverkeer goedgekeurde impulsenteller ten behoeve van het afstellen van elektronisch
      aanpasbare controleapparaten;

      b. door de Dienst Wegverkeer goedgekeurde testapparatuur voor snelheids- en afstandsmetingen alsmede voor de daarop
      betrekking hebbende registratie;

      c. apparatuur voorzien van een loep voor het onderzoeken van registratiebladen;

      d. een onderzoeksjablone, waarop de toegestane tolerantiegebieden staan aangegeven;

      e. een verzegelinrichting welke geschikt is voor de gevoerde merken controleapparaat;

      f. overige, door de fabrikant of importeur van de gevoerde merken controleapparaat voorgeschreven gereedschappen,
      apparatuur, werkplaatshandboeken en documentatie.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel10
  - number: '11'
    text: |-
      De aanvrager van een erkenning als installateur of reparateur beschikt over een register, waarvan de
      registerkaarten overeenkomen met het door de Dienst Wegverkeer vastgestelde model zoals opgenomen in de bijlage bij
      deze regeling.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel11
  - number: '12'
    text: |-
      1 De aanvrager van een erkenning als installateur, dan wel het door hem voor installatie en onderzoek van
      controleapparaten aangewezen personeel, heeft met goed gevolg, aan te tonen door middel van een in de werkplaats
      aanwezig bewijs van deelname, een cursus doorlopen met betrekking tot:

      a. het installeren en functioneren van controleapparaten;

      b. het functioneren van snelheidsbegrenzers met betrekking tot aspecten die van belang zijn bij de inbouw en het
      onderzoek van controleapparaten;

      c. het functioneren van motorrijtuigen met betrekking tot aspecten die van belang zijn bij de inbouw en het
      onderzoek van controleapparaten;

      d. de wettelijke voorschriften ten aanzien van controleapparaten alsmede ten aanzien van snelheidsbegrenzers
      voorzover van belang voor de inbouw en het onderzoek van controleapparaten.

      2 De aanvrager van een erkenning als reparateur dan wel het door hem voor reparatie van controleapparaten
      aangewezen personeel heeft met goed gevolg, aan te tonen door middel van een in de werkplaats aanwezig bewijs van
      deelname, een cursus doorlopen met betrekking tot:

      a. het repareren van controleapparaten;

      b. de wettelijke voorschriften ten aanzien van controleapparaten.

      3 De in het eerste, onderscheidenlijk tweede lid bedoelde cursussen zijn georganiseerd door de fabrikant of
      importeur van de in het kader van de erkenning als installateur of reparateur te voeren merken controleapparaat,
      dan wel door een door de Dienst Wegverkeer aangewezen instelling.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel12
  - number: '13'
    text: |-
      1 De aanvrager van de erkenning meldt bij de Dienst Wegverkeer de personen, bedoeld in [artikel 12][ref1], eerste
      dan wel tweede lid.

      2 Op het bewijs van deelname is ten minste vermeld:

      a. maand en jaar van deelname aan de cursus;

      b. de typen en merken controleapparaat waarop de cursus betrekking had;

      c. de naam van de deelnemer aan de cursus.


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Artikel12
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0010021
        artikel: '12'
        paragraaf: '4'
  - number: '14'
    text: |-
      1 De aanvrager van een erkenning als installateur beschikt over een voorziening voor het door middel van
      datacommunicatie melden van de inbouw en het onderzoek aan de Dienst Wegverkeer. Deze voorziening moet geschikt
      zijn voor de toegangsstructuur van een door de Directeur geaccepteerd netwerk.

      2 Het in het eerste lid bepaalde geldt niet voor fabrikanten of importeurs van motorrijtuigen, mits deze zich
      beperken tot het inbouwen van controleapparaten in motorrijtuigen die voor de eerste maal in gebruik worden
      genomen.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel14
  - number: '15'
    text: |-
      De Erkenninghouder draagt er zorg voor dat onderzoeken, installaties en reparaties slechts worden uitgevoerd door
      de in [artikel 12][ref1] bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Artikel12
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0010021
        artikel: '12'
        paragraaf: '4'
  - number: '16'
    text: |-
      Onverminderd [artikel 12][ref1] beschikt de houder van een erkenning dan wel het door hem aangewezen personeel over
      actuele kennis omtrent de in het kader van de erkenning te voeren merken controleapparaat. [Artikel 13][ref2] is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0010021#Artikel13
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0010021
        artikel: '12'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0010021
        artikel: '13'
        paragraaf: '4'
  - number: '17'
    text: |-
      Behoudens in geval van een erkenning als bedoeld in [artikel 4, tweede lid][ref1]:

      a. geschieden de met de inbouw, het onderzoek en de reparatie verband houdende werkzaamheden slechts in de
      werkplaats welke in de erkenning is vermeld;

      b. is aan de buitenkant van de werkplaats duidelijk zichtbaar een schild aangebracht waaruit de erkenning blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Artikel4
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0010021
        artikel: '4'
        paragraaf: '3'
  - number: '18'
    text: |-
      De erkenninghouder draagt er zorg voor dat de bij hem in gebruik zijnde verzegelinrichting alsmede de aan hem
      verstrekte toegangscodes niet toegankelijk zijn voor onbevoegden.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel18
  - number: '21'
    text: |-
      1 Bij het onderzoek wordt de werking gecontroleerd van:

      a. de snelheidsmeter;

      b. het uurwerk;

      c. de verlichting van het controleapparaat;

      d. de merkorganen, bedoeld in bijlage I, hoofdstuk III onder 1.3 van [Verordening (EEG) nr. 3821/85](31985R3821);

      2 Bij het onderzoek wordt de verzegeling gecontroleerd van:

      a. het mechanisme van het controleapparaat;

      b. de kilometerteller.

      3 Een niet goed functionerend of incompleet controleapparaat wordt onverwijld vervangen.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel21
  - number: '22'
    text: |-
      1 Bij het onderzoek wordt de kenmerkende coëfficiënt, als bedoeld in bijlage I, hoofdstuk I onder d) van
      [Verordening (EEG) nr. 3821/85](31985R3821) bepaald door het berekenen van het aantal omwentelingen of impulsen
      over 1 kilometer en op het installatieplaatje en op de registerkaart aangeduid met W= ... omw/km, of W= ... imp/km.

      2 De effectieve omtrek der wielbanden, als bedoeld in bijlage I, hoofdstuk I onder e) van [Verordening (EEG) nr.
      3821/85](31985R3821), wordt bepaald door het berekenen van de gemiddelde afstand die door de aangedreven wielen bij
      een volledige omwenteling wordt afgelegd en op het installatieplaatje en op de registerkaart aangeduid met L= ...
      m.

      3 De kenmerkende coëfficiënten en de effectieve omtrek der wielbanden worden vastgesteld op een aangepaste
      rollentestbank, een aangepaste remmentestbank of een meetbaan.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel22
  - number: '25'
    text: |-
      1 Bij het onderzoek wordt met behulp van een voor het desbetreffende controleapparaat goedgekeurd registratieblad
      een testregistratie gemaakt met ten minste de registraties van:

      a. de snelheid in ten minste drie stappen;

      b. de snelheid bij maximum snelheidsbereik;

      c. de werktijd, rijtijd en rusttijd;

      d. de afgelegde weg;

      e. de werking van de schrijfstiftgeleiding.

      2 Met behulp van een leesapparaat, voorzien van een loep en een onderzoekssjabloon, wordt beoordeeld of de
      testregistraties op het testregistratieblad de maximaal toelaatbare fouten, genoemd in hoofdstuk III, onder f) 1 en
      2 van bijlage I van [verordening (EEG) nr. 3821/85](31985R3821) niet overschrijden.

      3 Bij het onderzoek worden na inbouw in het motorrijtuig de navolgende waarden met betrekking tot de door het
      controleapparaat geregistreerde gegevens niet overschreden:

      a. afgelegde afstand: 2% meer of minder dan de werkelijke afstand, die ten minste 1 km moet bedragen;

      b. snelheid: 4 km/h meer of minder ten opzichte van de werkelijke snelheid.

      4 Bij reparatie wordt vastgesteld dat de in het tweede lid genoemde waarden met betrekking tot de door de
      tachograaf geregistreerde gegevens niet worden overschreden.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel25
  - number: '26'
    text: |-
      1 Na het onderzoek worden alle verzegelingen, genoemd in Hoofdstuk V onder 4 van bijlage I van [Verordening (EEG)
      nr. 3821/85](31985R3821), voorzien van het aan de erkenninghouder toegekend verzegelnummer, aangebracht:

      a. op de verbinding tussen de aandrijfkabel of de elektrische bedrading van de impulsgever en het controleapparaat
      en op de verbinding tussen de aandrijfkabel of de elektrische bedrading van de impulsgever en het motorrijtuig;

      b. op alle eventueel daar tussen liggende onderbreekbare punten;

      c. op het mechanisme van het controleapparaat;

      d. op de in het controleapparaat aanwezige kilometerteller;

      e. op het aanpassingsorgaan en de aansluiting hiervan op het circuit;

      f. op alle overige punten waarmee de instelling van het controleapparaat kan worden gewijzigd.

      2 De verzegeling op het mechanisme van het controleapparaat wordt slechts door een reparateur aangebracht; indien
      verbreking van deze verzegeling echter noodzakelijk is voor het wijzigen van de kilometertellerstand, mag de
      verzegeling door de installateur worden aangebracht.

      3 In geval van verbreking in het belang van opsporing door ambtenaren als bedoeld in
      [artikel 7 onder b en c][ref1], wordt, in afwijking van het eerste lid, een nieuwe verzegeling aangebracht op de
      plaatsen waar deze verbroken is.

      4 Verbreking als bedoeld in het derde lid vindt slechts plaats ter controle van:

      a. de juiste instelling van de apparaatconstante van het controleapparaat;

      b. de juiste aansturing van de snelheidsbegrenzer voor zover dit geschiedt met daartoe door de Dienst Wegverkeer
      goedgekeurde testapparatuur;

      c. de aanwezigheid van voorzieningen waarmee de juiste werking van het controleapparaat kan worden beïnvloed;

      d. de aanwezigheid van voorzieningen waarmee de juiste werking van de snelheidsbegrenzer kan worden beïnvloed,
      indien het gestelde in [artikel 16 lid 2 van de Erkenningsregeling Snelheidsbegrenzers][ref2] van toepassing is.

      5 Van de verzegeling als bedoeld in het derde lid, wordt aan de bestuurder een schriftelijke kennisgeving,
      gewaarmerkt door de betreffende ambtenaar en voorzien van het in [artikel 7 onder b onderscheidenlijk c][ref3]
      bedoelde verzegelnummer, uitgereikt met de reden waarom de verzegeling werd verbroken.


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007081#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0010021#Artikel7
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0010021
        artikel: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0007081
        artikel: '16'
      - id: ref3
        bwb_id: BWBR0010021
        artikel: '7'
        paragraaf: '3'
  - number: '27'
    text: |-
      Na het onderzoek wordt een korte rijproef uitgevoerd, waarbij het in [artikel 25, eerste lid][ref1], bedoelde
      testregistratieblad in het controleapparaat aanwezig is, opdat vastgesteld kan worden dat het controleapparaat
      goed functioneert.


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Artikel25
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0010021
        artikel: '25'
        paragraaf: '6'
  - number: '28'
    text: |-
      1 Van iedere inbouw en ieder onderzoek worden de volgende gegevens in het in [artikel 11][ref1] bedoelde register
      vastgelegd:

      a. met betrekking tot de installateur:

      1° de naam en het adres van de installateur,

      2° de naam van de persoon die de inbouw of het onderzoek heeft verricht;

      b. met betrekking tot het motorrijtuig:

      1° het kenteken, of

      2° indien het motorrijtuig nog niet is voorzien van een kenteken, het chassisnummer,

      3° merk en type,

      4° de kilometerstand,

      5° effectieve omtrek der wielbanden, en

      6° de ongecorrigeerde kenmerkende coëfficiënt van het motorrijtuig in omw/km of imp/km;

      c. met betrekking tot de installatie:

      1° de ongecorrigeerde kenmerkende coëfficiënt in omw/km of imp/km of in geval van een aanpasbaar controleapparaat
      de ingestelde apparaatconstante in imp/km, en

      2° het merk, type en serienummer van het controleapparaat;

      d. met betrekking tot de uitgevoerde werkzaamheden:

      1° de datum van de inbouw of het onderzoek, en

      2° de handtekening van de in onderdeel a, onder 2°, bedoelde persoon.

      2 Het in het eerste lid bepaalde geldt niet voor fabrikanten of importeurs van motorrijtuigen, mits dezen zich
      beperken tot het inbouwen van controleapparaten in motorrijtuigen die voor de eerste maal in gebruik worden
      genomen.

      3 Het bij inbouw of onderzoek gebruikte testregistratieblad, het bij de reparatie gebruikte testregistratieblad dan
      wel een afschrift van laatstgenoemd testregistratieblad wordt bij het register gevoegd.

      4 In afwijking van het derde lid mag, in geval van toepassing van een controleapparaat dat door een erkende
      reparateur is gerepareerd, het testregistratieblad vervangen worden door het door de reparateur voor dit
      controleapparaat afgegeven testregistratieblad, mits dit blad de in [artikel 25][ref2] bedoelde registraties bevat.


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0010021#Artikel25
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0010021
        artikel: '11'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0010021
        artikel: '25'
        paragraaf: '6'
  - number: '29'
    text: |-
      Van iedere reparatie worden de volgende gegevens in het in [artikel 11][ref1] bedoelde register vastgelegd:

      a. de naam en het adres van de reparateur,

      b. de naam van de persoon die de reparatie heeft uitgevoerd,

      c. merk, type en serienummer van het controleapparaat,

      d. de aard van de reparatie,

      e. de datum van de reparatie, en

      f. de handtekening van de in onderdeel b bedoelde persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Artikel11
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0010021
        artikel: '11'
        paragraaf: '4'
  - number: '30'
    text: |-
      De erkenninghouder bewaart het register gedurende ten minste drie jaar vanaf het moment van inbouw, onderzoek of
      reparatie.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel30
  - number: '31'
    text: |-
      1 Na de inbouw of het onderzoek worden door middel van datacommunicatie de volgende gegevens aan de Dienst
      Wegverkeer gemeld:

      a. toegangscodes;

      b. indien het motorrijtuig is voorzien van een kenteken: het kenteken en de meldcode, gevormd door de laatste vier
      cijfers van het chassisnummer;

      c. indien het motorrijtuig nog niet is voorzien van een kenteken: het volledige chassisnummer;

      d. merk, serienummer en ingestelde apparaatconstante van het controleapparaat.

      2 In geval van een mobiele installatie-eenheid wordt in aanvulling op het eerste lid tevens het adres met postcode
      van de werkplaats waar de inbouw of het onderzoek is verricht, gemeld.

      3 De in het eerste lid genoemde meldingsplicht geldt niet voor fabrikanten of importeurs van motorrijtuigen,
      voorzover het de inbouw betreft in motorrijtuigen die voor de eerste maal in gebruik worden genomen.

      4 De door de Dienst Wegverkeer gegeven aanwijzingen met betrekking tot de melding worden in acht genomen.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel31
  - number: '32'
    text: |-
      1 Nadat is vastgesteld dat alle in [artikel 26][ref1] bedoelde verzegelingen aanwezig zijn, wordt in de
      bestuurdersruimte op het controleapparaat of op een duidelijk zichtbare en goed waarneembare plaats in de directe
      nabijheid van het controleapparaat een goed zichtbaar en leesbaar installatieplaatje aangebracht waarop ten minste
      de volgende gegevens op onuitwisbare wijze zijn aangebracht:

      a. de naam, het adres en het verzegelnummer van de installateur,

      b. het kenteken van het motorrijtuig, dan wel, indien dit nog niet bekend is, het chassisnummer,

      c. de kenmerkende coëfficiënt van het motorrijtuig;

      d. de bandenomtrek van het motorrijtuig, en

      e. de datum van de inbouw of van het onderzoek.

      2 In geval van inbouw of onderzoek van een elektronisch aanpasbaar controleapparaat wordt op of in het
      controleapparaat een sticker aangebracht, waarop de ingestelde vier- of meercijferige apparaatconstante goed
      zichtbaar en leesbaar staat vermeld, waarbij de apparaatconstante wordt aangeduid met

      k= ......imp/km.

      3 De in het tweede lid bedoelde sticker wordt van een verzegeling voorzien dan wel zodanig aangebracht dat deze bij
      verwijdering onherstelbaar wordt beschadigd.


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Artikel26
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0010021
        artikel: '26'
        paragraaf: '6'
  - number: '33'
    text: |-
      Het in [artikel 32][ref1] bedoelde installatieplaatje wordt niet aangebracht dan nadat is vastgesteld dat het
      controleapparaat goed is afgesteld en verzegeld en door de Dienst Wegverkeer is medegedeeld dat:

      a. de in [artikel 31][ref2] bedoelde melding niet leidt tot een controle van de inbouw of het onderzoek door Dienst
      Wegverkeer, of

      b. de melding leidt tot een controle van de inbouw of het onderzoek, doch deze controle niet binnen 90 minuten na
      de melding wordt begonnen, dan wel

      c. de melding leidt tot een controle van de inbouw of het onderzoek en deze controle heeft geleid tot een
      goedkeuring van de desbetreffende werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0010021#Artikel31
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0010021
        artikel: '32'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0010021
        artikel: '31'
        paragraaf: '6'
  - number: '34'
    text: |-
      1 De Dienst Wegverkeer schouwt ten minste één keer per jaar het bedrijf of de mobiele installatie-eenheid van de
      erkenninghouder.

      2 De Dienst Wegverkeer voert tenminste eenmaal per jaar op ten minste 5% van de landelijk verrichte inbouwen en
      onderzoeken een controle uit.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel34
  - number: '35'
    text: |-
      De erkenninghouder mag in de staat van een motorrijtuig dat aan een controle als bedoeld in
      [artikel 34, onderdeel b][ref1], zal worden onderworpen, gedurende een periode van 90 minuten na het tijdstip van
      melding van de inbouw of het onderzoek geen wijziging brengen of laten brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Artikel34
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0010021
        artikel: '34'
        paragraaf: '7'
  - number: '36'
    text: |-
      1 De erkenninghouder verleent alle medewerking aan de in [artikel 34, onderdelen a en b][ref1], bedoelde
      handelingen.

      2 Tijdens de in [artikel 34, tweede lid][ref2], bedoelde handelingen is degene die de inbouw of het onderzoek heeft
      verricht aanwezig.


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0010021#Artikel34
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0010021
        artikel: '34'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0010021
        artikel: '34'
        paragraaf: '7'
  - number: '37'
    text: |-
      1 De werkgever en de persoon, bedoeld in artikel 2.2:2 van het Besluit, zorgen ervoor dat het controleapparaat door
      een erkende installateur is aangebracht, en door deze is voorzien van een installatieplaatje en van verzegelingen
      als bedoeld in [artikel 26, eerste lid][ref1], onderscheidenlijk [artikel 32][ref2].

      2 In afwijking van het eerste lid mag een motorrijtuig, ingevoerd uit één der lid-staten van de Europese Unie of
      een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte, zijn voorzien van
      een controleapparaat dat volgens de in die lid-staat geldende voorschriften is geïnstalleerd.


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0010021#Artikel32
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0010021
        artikel: '26'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0010021
        artikel: '32'
        paragraaf: '6'
  - number: '38'
    text: |-
      De werkgever en de persoon, bedoeld in artikel 2.2:2 van het Besluit, zorgen ervoor dat:

      a. ten minste eenmaal per twee jaar het controleapparaat door een erkende installateur wordt onderzocht;

      b. na iedere verbreking van verzegelingen als bedoeld in [artikel 26, eerste lid][ref1], en na iedere wijziging
      aan het motorrijtuig waardoor wegdraaital of bandenomtrek zijn beïnvloed, het controleapparaat door een erkend
      installateur wordt onderzocht;

      c. na ieder onderzoek het controleapparaat door een erkende installateur is voorzien van een installatieplaatje en
      van verzegelingen als bedoeld in de [artikelen 26, eerste lid][ref2], onderscheiden-lijk 32;

      d. tijdens het gebruik van het motorrijtuig de maximaal toelaatbare fouten, aangegeven in bijlage I, hoofdstuk III
      onder f) 3 van [Verordening nr. (EEG) 3821/85](31985R3821) niet worden overschreden;

      e. de onder c bedoelde verzegelingen ongewijzigd en intact blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0010021#Artikel26
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0010021
        artikel: '26'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0010021
        artikel: '26'
        paragraaf: '6'
  - number: '39'
    text: |-
      Van de verplichting tot installatie en gebruik van het controleapparaat wordt vrijstelling verleend voor
      motorrijtuigen die:

      a. vervoer verrichten als bedoeld in artikel 13, onderdelen c, e, f en g van [verordening (EEG) nr. 3820/85]
      (31985R3820);

      b. worden gebruikt voor het geven van rijonderricht en zijn voorzien van een krachtens de
      [Regeling vaststelling L-bord][ref1] voorgeschreven blauwe plaat met de letter L.


      [ref1]: https://wetten.overheid.nl/BWBR0008048
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0008048
  - number: '41'
    text: |-
      De op grond van de Regeling voorschriften tachografen erkende installateurs en reparateurs zijn erkend op grond van
      deze regeling.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel41
  - number: '42'
    text: De Regeling voorschriften tachografen wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel42
  - number: '43'
    text: |-
      Deze regeling wordt aangehaald als: [Regeling controleapparaten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010021
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0010021
  - number: '44'
    text: Deze regeling treedt in werking met ingang van 1 december 1998.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel44
