  - number: '2'
    text: |-
      1 Een goedkeuring van een controleapparaat of registratieblad wordt door de Dienst Wegverkeer verleend indien
      voldaan wordt aan het bepaalde bij of krachtens artikel 5 van [verordening (EEG) nr. 3821/85](31985R3821).

      2 De aanvraag tot goedkeuring van een controleapparaat of registratieblad wordt ingediend bij de Dienst Wegverkeer,
      waarbij alle op het controleapparaat en het registratieblad betrekking hebbende gegevens worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel2
  - number: '3'
    text: |-
      1 De Dienst Wegverkeer kan een erkenning verlenen als:

      a. installateur;

      b. reparateur.

      2 In de erkenning wordt vermeld:

      a. of het een erkenning als installateur, dan wel als reparateur betreft;

      b. de door de erkenninghouder gevoerde merken controleapparaat ten aanzien waarvan de erkenning verleend wordt;

      c. naam en adres van de erkenninghouder;

      d. het adres van de werkplaats waar de met inbouw, onderzoek en reparatie verband houdende werkzaamheden worden
      verricht;

      e. het ingevolge [artikel 7][ref1] toegekende verzegelnummer.

      3 Het tweede lid, onderdeel d, is niet van toepassing in geval van een erkenning als bedoeld in
      [artikel 4, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010021#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0010021#Artikel4
    url: https://wetten.overheid.nl/BWBR0010021/2001-11-08#Artikel3
    references:
      - id: ref1
