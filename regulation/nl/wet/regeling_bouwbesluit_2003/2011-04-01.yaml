  - number: '5.55'
    text: |-
      Een buiten de bebouwde kom gelegen te bouwen wegtunnel voor twee rijrichtingen met een tunnellengte van meer dan
      250 m heeft ten minste twee wegtunnelbuizen.
    url: https://wetten.overheid.nl/BWBR0014319/2011-04-01#Artikel5.55
  - number: '5.56'
    text: |-
      Een te bouwen wegtunnelbuis met een tunnellengte van meer dan 250 m heeft een rijbaanvloer met een helling van ten
      hoogste 1 : 20.
    url: https://wetten.overheid.nl/BWBR0014319/2011-04-01#Artikel5.56
  - number: '5.57'
    text: |-
      Een te bouwen wegtunnel met een tunnellengte van meer dan 250 m heeft een voorziening die een uit oogpunt van
      verkeersveiligheid voldoende geleidelijke overgang van daglicht naar kunstlicht waarborgt.
    url: https://wetten.overheid.nl/BWBR0014319/2011-04-01#Artikel5.57
  - number: '5.58'
    text: |-
      Een te bouwen wegtunnelbuis met een tunnellengte van meer dan 250 m heeft, voor een doelmatige doorgang voor
      wegvoertuigen, een vloer met een breedte van ten minste 7 m en een hoogte boven die breedte van ten minste 4,2 m.
    url: https://wetten.overheid.nl/BWBR0014319/2011-04-01#Artikel5.58
  - number: '5.59'
    text: |-
      Een buiten de bebouwde kom gelegen bestaande wegtunnel voor twee rijrichtingen met een tunnellengte van meer dan
      250 m heeft ten minste twee wegtunnelbuizen.
    url: https://wetten.overheid.nl/BWBR0014319/2011-04-01#Artikel5.59
  - number: '5.60'
    text: |-
      Een buiten de bebouwde kom gelegen bestaande wegtunnel met een tunnellengte van meer dan 250 m heeft een
      voorziening die een uit oogpunt van verkeersveiligheid voldoende geleidelijke overgang van daglicht naar kunstlicht
      waarborgt.
    url: https://wetten.overheid.nl/BWBR0014319/2011-04-01#Artikel5.60
  - number: '6.1'
    text: |-
      De Regeling Bouwbesluit nieuwbouw 1998, de Regeling Bouwbesluit bestaande bouw 1998, de Regeling Bouwbesluit
      materialen 1998, de [Regeling Bouwbesluit aansluitvoorwaarden](onbekend) en de Regeling Bouwbesluit CE-markeringen
      en erkende kwaliteitsverklaringen worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0014319/2011-04-01#Artikel6.1
  - number: '6.2'
    text: Deze regeling treedt in werking met ingang van 1 januari 2003.
    url: https://wetten.overheid.nl/BWBR0014319/2011-04-01#Artikel6.2
  - number: '6.3'
    text: 'Deze regeling wordt aangehaald als: Regeling Bouwbesluit 2003'
    url: https://wetten.overheid.nl/BWBR0014319/2011-04-01#Artikel6.3
