    text: |-
      1 Bij de berekening van de karakteristieke geluidwering van een scheidingsconstructie als bedoeld in
      [artikel 3.4, derde lid, van het besluit][ref1] worden herleidingswaarden voor het geluidspectrum toegepast
      overeenkomstig tabel 6 van NEN 5077.

      2 Bij de berekening van de karakteristieke geluidwering van een scheidingsconstructie als bedoeld in
      [artikel 3.4, derde lid, van het besluit][ref2], wordt een herleidingsterm *C*** voor de variatie in
      geluidbelasting toegepast, zoals aangegeven in [artikel 4.9, eerste, derde en vierde lid][ref3].

      3 Bij de berekening van de karakteristieke geluidwering van een scheidingsconstructie als bedoeld in
      [artikel 3.4, vierde lid, van het besluit][ref4], worden een herleidingsterm *C*** voor de variatie in
      geluidbelasting gehanteerd, zoals aangegeven in [artikel 4.9][ref5] en herleidingswaarden C** voor het
      geluidspectrum, zoals aangegeven in artikel 4.10.

      4 Berekeningen van de geluidwering vinden plaats voor de octaafbanden met de middenfrequenties 125 Hz, 250 Hz, 500
      Hz, 1000 Hz en 2000 Hz.

      5 De geluidwering (G**) wordt berekend uit het genormeerd geluiddrukniveauverschil van de gevel (D**) in
      octaafbanden met de herleidingswaarden C**volgens de formule:

      Hierbij worden de herleidingswaarden *C**i* bepaald op grond van het eerste of derde lid.

      6 Het genormeerd geluiddrukniveauverschil van de gevel (D**) wordt bepaald uit het genormeerd
      geluiddrukniveauverschil (D**;**) per constructie-onderdeel en de herleidingsterm voor de variatie in
      geluidbelasting (C**) voor het betreffende constructie-onderdeel ** volgens de formule:

      waarin *C*** volgt uit het bepaalde in het tweede of derde lid.

      7 Het genormeerd geluiddrukniveauverschil (D**;**) wordt per constructie-onderdeel ** berekend volgens NEN-EN
      12354-3, waarbij de invulling van de rekenmethode die in de annexes B en D van die norm wordt gegeven als een
      integraal onderdeel van de methode wordt beschouwd en ∆*L* = 0 dB wordt gesteld.

      8 Ten aanzien van de te hanteren invoergegevens voor de berekeningen zijn de aanwijzingen in NEN-EN 12354-
      3 annex B van toepassing. Als invoergegeven voor elementen waarvan de akoestische prestatie is gebaseerd op
      laboratoriummetingen, zoals de luchtgeluidisolatie *R* van bouwelementen en het genormeerd geluidniveauverschil *D*
      van ventilatievoorzieningen, wordt het meetresultaat met 2 dB verminderd.

      9 De karakteristieke geluidwering van een scheidingsconstructie in relatie tot de
      [artikelen 3.3, eerste, vierde en vijfde lid][ref6], en [3.4, derde lid, van het besluit][ref7] wordt bepaald uit
      de geluidwering van de scheidingsconstructie volgens onderdeel 5.3.6 van NEN 5077.


