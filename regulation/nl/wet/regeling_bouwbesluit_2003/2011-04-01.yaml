  - number: '4.9'
    text: |-
      1 Indien bij twee of meer geluidbelaste constructie-onderdelen van de uitwendige scheidingsconstructie deze
      onderdelen niet gelijktijdig door een vliegtuig direct aangestraald kunnen worden, worden voor de herleidingsterm
      *C*** als bedoeld in NEN 5077, onderdeel 5.3.4, en in [artikel 4.8, zesde lid][ref1], de volgende waarden
      gehanteerd:

      a. *C*  ** = 0 dB voor de constructie-onderdelen *k* waarvoor de hoek tussen de verbindingslijn geluidsbron en het
      onderdeel en de normaal op het onderdeel niet groter is dan 70°;

      b. *C*  ** = 3 dB voor de constructie-onderdelen *k* waarvoor de hoek tussen de verbindingslijn geluidsbron en het
      onderdeel en de normaal op het onderdeel groter is dan 70° en niet groter dan 90°, en

      c. *C*  ** = 8 dB voor de constructie-onderdelen *k* waarvoor de hoek tussen de verbindingslijn geluidsbron en het
      onderdeel en de normaal op het onderdeel groter is dan 90°.

      2 De geluidwering *G* van de uitwendige scheidingsconstructie is de laagste van de bepaalde geluidweringen bij
      mogelijke combinaties van direct en niet direct aangestraalde onderdelen van de uitwendige scheidingsconstructie.

      3 Voor het constructie-onderdeel *k* van de uitwendige scheidingsconstructie dat het verst van het gemiddelde
      grondpad is verwijderd, wordt *C*** = 8 dB gehanteerd, indien de hoek tussen het onderdeel van de uitwendige
      scheidingsconstructie en het gemiddelde grondpad kleiner is dan 30°.

      4 In verband met de hoekafhankelijkheid van de geluidwering van de uitwendige scheidingsconstructie  wordt
      een herleidingsterm*C*** toegepast als bedoeld in NEN 5077, onderdeel 5.3.4.  is afhankelijk van de momentane
      vliegtuigpositie die wordt beschreven door de hoeken *α* en *β*. De horizontale hoek *α* is gedefinieerd
      als de hoek tussen de normaal op het constructie-onderdeel *k* van de uitwendige scheidingsconstructie en de
      verbindingslijn tussen het middelpunt van het constructie-onderdeel van de uitwendige scheidingsconstructie in het
      referentievlak en de projectie van de vliegtuigpositie op het referentievlak. De verticale hoek *β* is gedefinieerd
      als de hoek tussen de verbindingslijn tussen het middelpunt van het constructie-onderdeel van de uitwendige
      scheidingsconstructie in het referentievlak en de vliegtuigpositie en de verbindingslijn tussen het middelpunt
      van het constructie-onderdeel van de uitwendige scheidingsconstructie in het referentievlak en de projectie van
      de vliegtuigpositie op het referentievlak.  wordt op grond van metingen of berekeningen per luchtvaartterrein
      vastgesteld.

      5 De herleidingsterm *C*** bedoeld in het vierde lid, wordt per constructie-onderdeel *k* van de uitwendige
      scheidingsconstructie per procedure m bepaald uit:

      *C*  = *L*(1) - *L*(2)

      waarbij :

      *L*  (1) = de *L* geluidsbelasting in dB(A), als bedoeld in [artikel 4.11, tweede lid][ref2], voor procedure *m*;

      *L*  (2) = de *L* geluidsbelasting in dB(A), berekend overeenkomstig de
      [Regeling berekening nachtelijke geluidsbelasting][ref3], met mede-integratie van de hoekafhankelijke geluidwering
      *φ*, voor procedure *m* en constructie-onderdeel *k*.


      [ref1]: https://wetten.overheid.nl/BWBR0014319#Artikel4.8
      [ref2]: https://wetten.overheid.nl/BWBR0014319#Artikel4.11
      [ref3]: https://wetten.overheid.nl/BWBR0008336
    url: https://wetten.overheid.nl/BWBR0014319/2011-04-01#Artikel4.9
