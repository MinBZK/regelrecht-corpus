  - number: '1.15'
    text: |-
      De minister kan ten aanzien van bouwproducten als bedoeld in artikel 6, tweede lid, van de richtlijn bouwproducten,
      die niet vallen onder artikel 4, tweede lid, van die richtlijn, toestemming verlenen voor het in de handel brengen
      daarvan.
    url: https://wetten.overheid.nl/BWBR0014319/2011-04-01#Artikel1.15
  - number: '1.16'
    text: |-
      1 De minister maakt eenmaal per kalenderjaar in de Staatscourant een overzicht bekend van de in
      [artikel 1.12, eerste lid][ref1], genoemde instellingen.

      2 De minister draagt zorg voor de opstelling en bekendmaking van een overzicht, alsmede van wijzigingen van dat
      overzicht van bouwproducten als bedoeld in [artikel 1.15][ref2]. Dit overzicht bevat tevens bouwproducten als
      bedoeld in artikel 4, vijfde lid, van de richtlijn bouwproducten.


