      [artikel 2.12, vijfde lid, van het besluit][ref1] voldaan, indien een uiterste grenstoestand van een
      hoofddraagconstructie van een wegtunnelbuis gedurende 30 minuten, en voorzover deze onder open water ligt 60
      minuten, niet wordt overschreden bij de volgens NEN 6702 bepaalde bijzondere belastingscombinaties die kunnen
      optreden bij brand.


