  - number: '5.25'
    text: |-
      Voor een wegtunnel met een tunnellengte van meer dan 250 m, worden het
      [tweede tot en met vierde lid van artikel 2.148 van het besluit][ref1] als volgt gelezen:

      2. De loopafstand tussen een punt op de rijbaanvloer en ten minste een toegang van het rookcompartiment is
      ten hoogste 150 m. Deze afstand wordt gemeten over een route die uitsluitend voert over vloeren, trappen of
      hellingbanen zonder dat deuren worden gepasseerd die met een sleutel moeten worden geopend. Deze route heeft een
      vrije doorgang met een breedte van ten minste 0,85 m en een hoogte van ten minste 2.1 m. De breedte geldt niet
      voorzover deze route over een trap voert. De afstand tussen twee toegangen is ten hoogste 250 m.

      3. Een toegang van een rookcompartiment heeft een vrije doorgang met een breedte van ten minste 0,85 m en een
      hoogte van ten minste 2.1 m.

      4. Een deur van een toegang van een rookcompartiment draait bij het openen niet tegen de vluchtrichting in.


      [ref1]: https://wetten.overheid.nl/BWBR0012727#Artikel2.148
    url: https://wetten.overheid.nl/BWBR0014319/2011-04-01#Artikel5.25
