  - number: '5.1'
    text: |-
      Voor een te bouwen wegtunnel met een tunnellengte van meer dan 250 m is aan
      [artikel 2.9, zevende lid, van het besluit][ref1] voldaan, indien een uiterste grenstoestand van een
      hoofddraagconstructie van een wegtunnelbuis gedurende 60 minuten, en voorzover deze onder open water ligt 120
      minuten, niet wordt overschreden bij de volgens NEN 6702 bepaalde bijzondere belastingscombinaties die kunnen
      optreden bij brand.


