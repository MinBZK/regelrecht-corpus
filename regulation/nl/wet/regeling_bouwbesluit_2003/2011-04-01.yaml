  - number: '5.39'
    text: |-
      Een wegtunnelbuis met een lengte van meer dan 250 m heeft een zodanig aantal hulpposten dat de loopafstand tussen
      een punt op de rijbaanvloer en ten minste een hulppost niet groter is dan 75 m. Deze afstand wordt gemeten over een
      route die uitsluitend voert over vloeren, trappen of hellingbanen zonder dat deuren worden gepasseerd die met een
      sleutel moeten worden geopend. De afstand tussen twee opeenvolgende hulpposten is ten hoogste 100 m.
    url: https://wetten.overheid.nl/BWBR0014319/2011-04-01#Artikel5.39
