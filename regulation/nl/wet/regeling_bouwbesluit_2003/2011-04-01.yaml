  - number: '4.31'
    text: |-
      Bij de toepassing van NEN 6790 geldt het volgende:

      a. ten aanzien van de verwijzing in onderdeel 5.2.1 en onderdeel 5.3 naar NEN 6700 is [artikel 4.24][ref1] van
      toepassing;

      b. onderdeel 7.1 en onderdeel 7.3 blijven buiten toepassing;

      c. onderdeel 7.2 wordt als volgt gelezen:

      De rekenregels in deze norm zijn niet van toepassing op metselwerk van cellenbeton dat op enigerlei wijze in
      contact komt met grondwater;

      d. de onderdelen 9.1.4 en 9.2.2 blijven buiten toepassing;

      e. in onderdeel 12.2:

      1º. de zin na het eerste aandachtstreepje wordt als volgt gelezen:

        - krachten voortkomend uit een scheefstand van 1/300 van de hoogte of de feitelijke scheefstand, indien deze
      groter is dan 1/300 van de hoogte, die voor ten minste vier naast elkaar gelegen rijen kolommen of wanden van elke
      verdieping in dezelfde richting moet worden aangenomen (zie fig. 14); en

      2º. de zin na het tweede aandachtstreepje wordt als volgt gelezen:

        - krachten voortkomend uit windbelasting;

      f. onderdeel 12.3 blijft buiten toepassing, en

      g. in Bijlage A:

      1º in onderdeel A.1 blijft de verwijzing in de tweede alinea naar onderdeel A.2 van bijlage A buiten toepassing;

      2º onderdeel A.2 blijft buiten toepassing;

      3º in onderdeel A.3 wordt het opschrift als volgt gelezen:

      Proefstukken

      4º onderdeel A.3.1 wordt als volgt gelezen:

      Afmetingen

      De proefstukken moeten aan de ter beoordeling staande constructie zijn ontleend en moeten de volgende afmetingen
      hebben:

        - de dikte dient gelijk te zijn aan de bouwdeeldikte met een maximum van 300 mm;
        - de breedte dient gelijk te zijn aan de dikte; en
        - de hoogte moet gelijk zijn aan 5 maal de dikte.;

      5º. onderdeel A.3.2 wordt als volgt gelezen:

      Aantal proefstukken

      Er moeten ten minste 6 proefstukken zijn vervaardigd, en

      6º. onderdeel A.3.3 blijft buiten toepassing.


