  - number: '5.49'
    text: |-
      Bij een wegtunnelbuis met een tunnelbuislengte van meer dan 500 m is de component voor afvoer van lucht als bedoeld
      in de in [artikel 3.68, vijfde lid, van het besluit][ref1] bedoelde voorziening voor luchtverversing mechanisch.


