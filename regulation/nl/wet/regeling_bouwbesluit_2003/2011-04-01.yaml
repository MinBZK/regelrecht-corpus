articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:




              *asbest:*


              stoffen of producten, die een of meer van de volgende vezelachtige silicaten bevatten:
              actinoliet (Cas-nummer 77536-66-4);
      amosiet (Cas-nummer 12172-73-5);
      anthofylliet (Cas-nummer 77536-67-5);
      chrysotiel (Cas-nummer 12001-29-5);
      crocidoliet (Cas-nummer 12001-28-4);
      tremoliet (Cas-nummer 77536-68-6).




              *besluit:*


              [Bouwbesluit 2003][ref1];




              *CE-markering:*


              CE-markering als bedoeld in artikel 4 van de richtlijn bouwproducten;




              *conformiteitscertificaat:*


              verklaring als bedoeld in artikel 13 in verbinding met artikel 14, eerste lid, onderdeel b, en tweede lid,
      van de richtlijn bouwproducten;




              *conformiteitsverklaring:*


              verklaring als bedoeld in artikel 13 in verbinding met artikel 14, eerste lid, onderdeel a, en tweede lid,
      van de richtlijn bouwproducten;




              *Europese technische goedkeuring:*


              Europese technische goedkeuring als bedoeld in hoofdstuk III van de richtlijn bouwproducten;




              *geharmoniseerde norm:*


              Europese norm of geharmoniseerd document als bedoeld in artikel 4, eerste lid, van de richtlijn
      bouwproducten, hetwelk door CEN of CENELEC in opdracht van de Commissie van de Europese gemeenschappen is
      aangenomen overeenkomstig de [richtlijn nr. 98/34/EG](31998L0034) van de Raad van de Europese gemeenschappen van
      22 juni 1998 betreffende een informatieprocedure op het gebied van normen en technische voorschriften en regels
      betreffende de diensten van de informatiemaatschappij (PbEG L 204), zoals gewijzigd bij [richtlijn nr. 98/48/EG]
      (31998L0048) van 20 juni 1998 (PbEG L 217);




              *giftige stoffen:*


              stoffen of preparaten waarvan reeds een geringe hoeveelheid bij inademing of opneming via de mond of via de
      huid acute of chronische aandoeningen of de dood kan veroorzaken;




              *hoge spanning:*


              hoge spanning als bedoeld in NEN 1041 en V 1041;



            hoofdweg:

              hoofdweg als bedoeld in de[ Tracéwet][ref2];



            hoofdvaarweg:

              ** hoofdvaarweg als bedoeld in de [Tracéwet][ref3];




              *lage spanning:*


              lage spanning als bedoeld in NEN 1010;



            landelijke spoorweg:

              ** landelijke spoorweg als bedoeld in de [Tracéwet][ref4];




              *minister:*


              Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;




              *nationale technische specificatie:*


              technische specificatie als bedoeld in artikel 4, derde lid, van de richtlijn bouwproducten en vastgesteld
      overeenkomstig de in dat lid en in artikel 5, tweede lid, van die richtlijn beschreven procedure;




              *rijbaan:*


              rijbaan als bedoeld in artikel 1 van het Reglement verkeersregels en verkeerstekens 1990;




              *rijbaanvloer:*


              voor een rijbaan bestemd gedeelte van een vloer van een wegtunnelbuis;




              *tunnelbuislengte:*


              lengte van het omsloten gedeelte van een tunnelbuis;




              *V:*


              door de Hoofdcommissie voor de Normalisatie (een voorloper van de Stichting Nederlands Normalisatie-
      Instituut) uitgegeven leidraad;




              *ve:*


              vezelequivalent is een maat voor de carcinogene potentie van de soorten asbest en de vezellengte, waarbij
      geldt:
              chrysotiele vezel met een lengte van meer dan 5 micrometer: equivalentiefactor 1,
      chrysotiele vezel met een lengte van ten hoogste 5 micrometer: equivalentiefactor 0,1,
      amfibole vezel met een lengte van meer dan 5 micrometer: equivalentiefactor 10, en
      amfibole vezel met een lengte van ten hoogste 5 micrometer: equivalentiefactor 1;




              *wegtunnelbuis:*


              gedeelte van een wegtunnel voor een rijbaan;




              *zeer giftige stoffen:*


              stoffen of preparaten waarvan reeds een zeer geringe hoeveelheid bij inademing of opneming via de mond of
      via de huid acute of chronische aandoeningen of de dood kan veroorzaken.


