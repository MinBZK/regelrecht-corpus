    text: |-
      Voor een te bouwen wegtunnel met een tunnellengte van meer dan 250 m is aan
      [artikel 2.24, tweede lid, van het besluit][ref1] voldaan, indien:

      a. een hoogteverschil tussen vloeren waarover een rookvrije vluchtroute voert of tussen een van die vloeren en
      het aansluitende terrein, dat groter is dan 0,21 m wordt overbrugd door een vaste trap of een vaste hellingbaan,
      behalve voorzover de rookvrije vluchtroute door een wegtunnelbuis voert;

      b. een hoogteverschil tussen vloeren waarover een route voert als bedoeld in [artikel 5.25, onderdeel 2][ref2], dat
      groter is dan 0,3 m wordt overbrugd door een vaste trap of een vaste hellingbaan.


