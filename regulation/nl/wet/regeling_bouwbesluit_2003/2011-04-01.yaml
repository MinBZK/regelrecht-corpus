      tussen de concentratie van asbestvezels in de buitenlucht en de concentratie van asbestvezels in de binnenlucht
      van een voor mensen toegankelijke ruimte, voorzover deze concentratie afkomstig is uit een of meer constructie-
      onderdelen die die ruimte begrenzen dan wel uit een of meer in die ruimte aanwezige constructie-onderdelen, niet
      groter dan 1.000 ve/m3.

      2 In een bestaand bouwwerk is, gelet op [artikel 3.109b van het besluit][ref2], de getalwaarde van het verschil
      tussen de concentratie van asbestvezels in de buitenlucht en de concentratie van asbestvezels in de binnenlucht
      van een voor mensen toegankelijke ruimte, voorzover deze concentratie afkomstig is uit een of meer constructie-
      onderdelen die die ruimte begrenzen dan wel uit een of meer in die ruimte aanwezige constructie-onderdelen, niet
      groter dan 100.000 ve/m3.


