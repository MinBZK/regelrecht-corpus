  - number: '2.2'
    text: |-
      De getalswaarde van de stijging van de concentratie van formaldehyde in de binnenlucht van een verblijfsgebied
      ten opzichte van de concentratie van formaldehyde in de buitenlucht, uitgedrukt in μg/m³, mag, voorzover deze
      concentratie afkomstig is uit een of meer constructie-onderdelen die dat verblijfsgebied begrenzen, dan wel uit een
      of meer in dat verblijfsgebied gelegen constructie-onderdelen, niet groter zijn dan:

      2 + 3,17 • 10-6 • t4 • R + 0,86 • 10-3 • A • t • R + 1,5 • 10-3 • R²

      waarin:

      t is de getalswaarde van de luchttemperatuur in het te meten gebied onderscheidenlijk de te meten woonwagen,
      uitgedrukt in °C;

      R is de getalswaarde van de relatieve luchtvochtigheid in het te meten gebied onderscheidenlijk de te meten
      woonwagen, uitgedrukt in %; en

      A is de getalswaarde, uitgedrukt in m², van de verticale doorsnede van:

      a. de constructie-onderdelen, geen bouwconstructie zijnde, gelegen in het verblijfsgebied; onderscheidenlijk

      b. de constructie-onderdelen, gelegen in de woonwagen, zij het dat geen grotere waarde mag zijn aangehouden dan 20.
    url: https://wetten.overheid.nl/BWBR0014319/2011-04-01#Artikel2.2
  - number: '2.3'
    text: |-
      1 De toename van de concentratie van formaldehyde in de binnenlucht moet zijn bepaald aan de hand van de
      concentraties van formaldehyde, bepaald door onderzoek van een monster van de binnenlucht en de buitenlucht.

      2 In het te meten verblijfsgebied moet gedurende ten minste drie aaneengesloten uren, voorafgaand aan de bepaling,
      de luchttemperatuur, de relatieve luchtvochtigheid, alsmede de met behulp van een ventilator en een deur- of
      raamschot tot stand gebrachte toevoer van verse lucht en afvoer van binnenlucht constant zijn gehouden, met:

      a. een variatie in de luchttemperatuur van ten hoogste 0,5°C;

      b. een variatie in de relatieve luchtvochtigheid van ten hoogste 5%; en

      c. een variatie in de toevoer van verse lucht en afvoer van binnenlucht van ten hoogste 10%.

      3 De concentratie van formaldehyde in het te meten verblijfsgebied moet worden bepaald bij:

      a. een luchttemperatuur in het verblijfsgebied tussen 18 °C en 25 °C;

      b. een relatieve luchtvochtigheid in het verblijfsgebied tussen 25% en 75%, en

      c. een toevoer van verse lucht in en een afvoer van binnenlucht uit het verblijfsgebied met een capaciteit van 0,15
      • 10-3 m³/s per m² vloeroppervlakte van het te meten verblijfsgebied met een afwijking van ten hoogste 0,01 • 10-3
      m³/s per m² vloeroppervlakte.

      4 Gedurende de drie uren bedoeld in het tweede lid, alsmede gedurende de bepaling, bedoeld in het derde lid,
      moeten de aanwezige voorzieningen voor de toevoer van verse lucht en afvoer van binnenlucht, alsmede de beweegbare
      constructie-onderdelen in de scheidingsconstructie die het verblijfsgebied begrenzen, zijn gesloten en moeten de
      beweegbare constructie-onderdelen binnen het verblijfsgebied onderscheidenlijk de woonwagen zijn geopend.

      5 Gedurende de drie aaneengesloten uren, voorafgaande aan de bepaling, bedoeld in het tweede lid, alsmede gedurende
      de bepaling, bedoeld in het derde lid, mogen zich geen personen in het te meten verblijfsgebied bevinden.
    url: https://wetten.overheid.nl/BWBR0014319/2011-04-01#Artikel2.3
  - number: '2.4'
    text: |-
      1 De toevoer van verse lucht en afvoer van binnenlucht, bedoeld in [artikel 2.3][ref1], moet tot stand zijn
      gebracht door middel van:

      a. een ventilator met een capaciteit van ten minste 0,15 • 10-3m³/s per m² vloeroppervlakte van het te meten
      verblijfsgebied, en

      b. een deur- of raamschot, waardoor lucht van buiten naar binnen wordt gevoerd.

      2 De omstandigheden, bedoeld in [artikel 2.3][ref2], moeten zijn bepaald met behulp van:

      a. een, in combinatie met bijbehorende registratie-apparatuur, geijkte luchttemperatuurmeter met een meetgebied
      tussen 15 °C en 30 °C en met een meetonnauwkeurigheid van ten hoogste 0,5 °C van de meetwaarde;

      b. een, in combinatie met bijbehorende registratie-apparatuur, geijkte luchtvochtigheidsmeter met een meetgebied
      tussen 15% en 90% en met een meetonnauwkeurigheid van ten hoogste 5% van de meetwaarde, en

      c. een, in combinatie met bijbehorende registratie-apparatuur, geijkte luchtvolumestroommeter die een meetgebied
      heeft dat is afgestemd op de te meten voorziening, en met een meetonnauwkeurigheid van ten hoogste 10% van de
      meetwaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0014319#Artikel2.3
      [ref2]: https://wetten.overheid.nl/BWBR0014319#Artikel2.3
