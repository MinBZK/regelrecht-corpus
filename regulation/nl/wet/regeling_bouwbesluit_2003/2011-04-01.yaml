  - number: '3.1'
    text: |-
      Een ruimte waardoor een rookvrije vluchtroute voert heeft afhankelijk van de oppervlakte van de daarop aangewezen
      ruimten en van de bezettingsgraadklasse van die ruimten een zodanige opvang- en doorstroomcapaciteit dat in geval
      van brand snel en veilig kan worden gevlucht. Daarbij kan rekening worden gehouden met gefaseerde ontruiming.
    url: https://wetten.overheid.nl/BWBR0014319/2011-04-01#Artikel3.1
