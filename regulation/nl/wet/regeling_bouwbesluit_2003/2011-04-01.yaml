  - number: '1.10'
    text: |-
      1 De minister draagt zorg voor publicatie in de Staatscourant van de referenties van:

      a. geharmoniseerde normen, voorzover die niet overeenkomstig de daarvoor krachtens de richtlijn bouwproducten
      geldende procedure in Nederlandse normen zijn getransponeerd;

      b. Nederlandse normen waarin de op die normen betrekking hebbende geharmoniseerde normen zijn getransponeerd;

      c. goedkeuringsrichtlijnen voor Europese technische goedkeuringen als bedoeld in artikel 11, derde lid, van de
      richtlijn bouwproducten;

      d. overeenkomstig artikel 4, derde lid, en artikel 5, tweede lid, van de richtlijn bouwproducten aan Nederland
      gezonden nationale technische specificaties.

      2 De publicatie geschiedt:

      a. voor de in het eerste lid, onder a, b en d, bedoelde referenties: zo spoedig mogelijk na publicatie door de
      Europese Commissie van de referenties van de geharmoniseerde normen en nationale technische specificaties in het
      Publicatieblad van de Europese gemeenschappen;

      b. voor de in het eerste lid, onder c, bedoelde referenties: binnen een redelijke termijn nadat de Europese
      Commissie de desbetreffende definitieve goedkeuringsrichtlijnen aan de lidstaten heeft bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0014319/2011-04-01#Artikel1.10
  - number: '1.11'
    text: |-
      1 Een bouwproduct dat in overeenstemming is met een geharmoniseerde of Nederlandse norm of een nationale technische
      specificatie, als bedoeld in [artikel 1.10, eerste lid, onder a, b of d][ref1], is met ingang van de datum, die
      daartoe is aangegeven in het Publicatieblad van de Europese gemeenschappen, overeenkomstig de daarop betrekking
      hebbende voorschriften van de richtlijn bouwproducten voorzien van de CE-markering en de daarbij behorende
      opschriften die op dat product betrekking hebben.

      2 De fabrikant van een bouwproduct of zijn in een lidstaat gevestigde gemachtigde is bevoegd na een publicatie,
      als bedoeld in [artikel 1.10, tweede lid, onder a][ref2], de CE-markering en de daarbij behorende opschriften
      die op dat product betrekking hebben, overeenkomstig de daarop betrekking hebbende voorschriften van de richtlijn
      bouwproducten aan te brengen op een bouwproduct, op een aan het product bevestigd label, op de verpakking ervan of
      op een begeleidend handelsdocument, indien het product:

      a. in overeenstemming is met op dat product betrekking hebbende Nederlandse normen waarin de daarop betrekking
      hebbende geharmoniseerde normen zijn getransponeerd,

      b. in overeenstemming is met een op dat product betrekking hebbende nationale technische specificatie of

      c. anderszins in overeenstemming is met geharmoniseerde normen.

      3 De fabrikant van een bouwproduct of zijn in een lidstaat gevestigde gemachtigde is bevoegd na een bekendmaking
      als bedoeld in [artikel 1.10, tweede lid, onder b][ref3], de CE-markering en de daarbij behorende opschriften
      die op dat product betrekking hebben, overeenkomstig de daarop betrekking hebbende voorschriften van de richtlijn
      bouwproducten aan te brengen op een bouwproduct, op een aan het product bevestigd label, op de verpakking ervan
      of op een begeleidend handelsdocument, indien het product in overeenstemming is met een voor dat product verleende
      Europese technische goedkeuring.

      4 Indien voor een bouwproduct overeenkomstig hoofdstuk V van de richtlijn bouwproducten een conformiteitsverklaring
      dan wel een conformiteitscertificaat is afgegeven wordt dat product geacht in overeenstemming te zijn met:

      a. een norm als bedoeld in [artikel 1.10, eerste lid, onder a of b][ref4];

      b. een technische goedkeuring als bedoeld in [artikel 1.10, eerste lid, onder c][ref5];

      c. een technische goedkeuring als bedoeld in artikel 9, tweede lid, van de richtlijn bouwproducten, of;

      d. een technische specificatie als bedoeld in [artikel 1.10, eerste lid, onder d][ref6].


