    text: |-
      Voor een wegtunnel met een tunnellengte van meer dan 250 m worden het
      [eerste tot en met derde lid van artikel 2.152 van het besluit][ref1] als volgt gelezen:

      1. De loopafstand tussen een punt op de rijbaanvloer en ten minste een toegang van het rookcompartiment is
      ten hoogste 150 m. Deze afstand wordt gemeten over een route die uitsluitend voert over vloeren, trappen of
      hellingbanen zonder dat deuren worden gepasseerd die met een sleutel moeten worden geopend. Deze route heeft een
      vrije doorgang met een breedte van ten minste 0,7 m en een hoogte van ten minste 1,9 m. De afstand tussen twee
      toegangen is ten hoogste 250 m.

      2. Een toegang van een rookcompartiment heeft een vrije doorgang met een breedte van ten minste 0,7 m en een hoogte
      van ten minste 1,9 m.

      3. Een deur van een toegang van een rookcompartiment draait bij het openen niet tegen de vluchtrichting in.


