  - number: '1.14'
    text: |-
      1 De op grond van [artikel 1.12, eerste lid][ref1], aangewezen instelling vrijwaart de minister van enige
      aansprakelijkheid, voortvloeiend uit de taken die zij verricht ter uitvoering van artikel 16 of 18 van de richtlijn
      bouwproducten.

      2 Een op grond van [artikel 1.12, eerste lid][ref2], aangewezen instelling verstrekt desgevraagd aan de minister de
      voor de uitoefening van zijn taak benodigde inlichtingen.

      3 Een op grond van [artikel 1.12, eerste lid][ref3], aangewezen instelling stelt jaarlijks voor 1 juli een verslag
      op van de werkzaamheden die in het daaraan voorafgaande kalenderjaar ter uitvoering van artikel 16 of artikel 18
      van de richtlijn bouwproducten zijn verricht. Het verslag wordt gezonden aan de minister en in afschrift aan de
      VROM inspectie en algemeen verkrijgbaar gesteld.


