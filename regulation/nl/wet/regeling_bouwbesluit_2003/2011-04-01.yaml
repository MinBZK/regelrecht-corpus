      Bij de toepassing van NEN 3859 geldt het volgende:

      a. bij de verwijzing in de onderdelen 5.2.1 en 9.1 van deze norm naar NEN 6710, NEN 6720, NEN 6760 en NEN 6770
      zijn de [artikelen 4.27][ref1], [4.28][ref2], [4.29][ref3] respectievelijk [4.30][ref4] van deze regeling van
      toepassing;

      b. in onderdeel 5.2.1 vervalt de zinsnede `- 6.1 van NEN 6740:1991 voor funderingsconstructies;'

      c. onderdeel 5.2.2 wordt gelezen als volgt:

      In afwijking van het gestelde in 5.2.1 moet:

        - bij de rekenmethode de rekenwaarden van de belastingen zijn ontleend aan de voorgeschreven fundamentele
      belastingscombinaties;
        - bij de rekenmethode de rekenwaarden van de materiaalgrootheden zijn ontleend aan hoofdstuk 9;

      d. onderdeel 5.2.3 wordt gelezen als volgt:

      In aanvulling op het gestelde in 5.2.1, mogen de hier gegeven bepalingsmethoden slechts zijn toegepast mits daarbij
      ten minste aan de voorwaarden in de onderdelen 7.4, 11.2 en 11.3 is voldaan;

