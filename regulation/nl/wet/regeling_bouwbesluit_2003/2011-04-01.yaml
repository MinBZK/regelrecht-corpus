      *C*** voor de variatie in geluidbelasting toegepast zoals aangegeven in [artikel 4.9, vierde en vijfde lid][ref6],
      en herleidingswaarden C** voor het geluidspectrum, zoals aangegeven in [artikel 4.10][ref7].


