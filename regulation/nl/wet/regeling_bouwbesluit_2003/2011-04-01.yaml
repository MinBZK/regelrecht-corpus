      Bij de toepassing van NEN 6720 geldt het volgende:

      a. ten aanzien van de verwijzing in onderdeel 4.1.2.0 en 4.1.2.2 naar NEN 6700 is [artikel 4.24][ref1] van
      toepassing;

      b. onderdeel 4.3 blijft buiten toepassing;

      c. de onderdelen 5.1.1.2 tot en met 5.1.1.4, 5.1.2 tot en met 5.1.5, alsmede 5.2 blijven buiten toepassing;

      d. in onderdeel 6.1.1 wordt de definitie van *f*' als volgt gelezen:

      *f*' is de korteduur karakteristieke kubusdruksterkte (kubusribbe 150 mm), waarvoor moet worden aangehouden de
      ondergrens van het eenzijdige overdekkingsinterval voor een fractie γ = 0,95 en een onbetrouwbaarheidsdrempel α =
      0,4, bepaald door middel van onderzoek aan de constructie;

      e. in onderdeel 6.1.2 wordt de eerste volzin als volgt gelezen:

      Treksterkte

      De rekenwaarde van de treksterkte ƒ moet zijn bepaald uit:

      waarin:

      a. *f*  is de laagste waarde van:

      1º de waarde van de karakteristieke korteduur splijttreksterkte (kubusribbe 150 mm), bepaald door middel van
      onderzoek aan de constructie, of

      2º *f*  = 1,05 + 0,05 *f*', in N/mm², en

      b. γ is 1,4.;

      f. onderdeel 6.1.3 wordt als volgt gelezen:

      De representatieve waarde en de rekenwaarde van de elasticiteitsmodulus E' is de laagste waarde van:

      a. 0,9 van de waarde van de elasticiteitsmodulus in de oorsprong van de spanning-rekrelatie, bepaald door middel
      van onderzoek aan de constructie, of

      b. *E*' = (22250 + 250 *f*'), in N/mm²;

      g. onderdeel 6.1.5 de definitie van k wordt als volgt gelezen:

      k is de factor, afhankelijk van de ouderdom t van het beton, op het tijdstip van belasten zoals aangegeven in tabel
      5 voor sterkteklasse 32,5 en 32,5R;

      h. ten aanzien van de verwijzing in onderdeel 6.4 alsmede 9.16.2 naar NEN 6770 is artikel 4.30 van toepassing;

      i. in onderdeel 7.3.1 wordt de eerste volzin als volgt gelezen:

      Voor het bepalen van de krachtsverdeling in een constructie moet zijn uitgegaan van de schematisering van de
      constructie volgens 7.1 en een van de theorieën genoemd in 7.2;

      j. in onderdeel 8.1.1 wordt de definitie van *M* als volgt gelezen:

      *M*  is de rekenwaarde van het maximale buigend moment;

      k. de onderdelen 8.1.7 en 8.6 blijven buiten toepassing;

      l. onderdeel 8.7 wordt als volgt gelezen:

      Duurzaamheid

      Vermindering van de sterkte van de constructie door corrosie van de wapening dient in rekening te zijn gebracht.
      Deze eis betreft zowel de sterktevermindering die is opgetreden voor het moment van beoordelen als de te verwachten
      sterktevermindering binnen één jaar, gerekend vanaf het moment van beoordelen.;

      m. onderdeel 9.1 blijft buiten toepassing;

      n. in onderdeel 9.2.a wordt de tweede volzin als volgt gelezen:

      De van toepassing zijnde milieuklasse is milieuklasse 1;

      o. de onderdelen 9.2.e en 9.4 blijven buiten toepassing, en

      p. ten aanzien van de verwijzing in onderdeel 9.14.3 naar NEN 6790 is [artikel 4.30][ref2] van toepassing.


