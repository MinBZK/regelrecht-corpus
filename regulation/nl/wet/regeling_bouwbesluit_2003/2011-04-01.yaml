  - number: '1.13'
    text: |-
      1 Een instelling als bedoeld in [artikel 1.12, eerste lid][ref1], wordt door de minister aangewezen, indien zij:

      a. rechtspersoonlijkheid bezit,

      b. een vestiging in Nederland heeft,

      c. beschikt over bekwaam personeel,

      d. beschikt over doeltreffende voorzieningen,

      e. onpartijdig is,

      f. beschikt over een kwaliteitssysteem dat op schrift is gesteld,

      g. zorgvuldig is,

      h. verzekerd is voor beroepsaansprakelijkheid, en

      i. geen nevenactiviteiten verricht die het vertrouwen in de instelling kunnen schaden.

      2 Of een instelling aan de in het eerste lid, onder c, d, e, f en g, genoemde eisen voldoet, wordt beoordeeld
      volgens de voorwaarden die zijn opgenomen in [bijlage II][ref2] bij deze regeling.

      3 Uitbesteding van werkzaamheden in het kader van artikel 16 of 18 van de richtlijn is toegestaan, indien wordt
      voldaan aan de voorwaarden die zijn opgenomen in [bijlage III][ref3] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0014319#Artikel1.12
      [ref2]: https://wetten.overheid.nl/BWBR0014319
      [ref3]: https://wetten.overheid.nl/BWBR0014319
    url: https://wetten.overheid.nl/BWBR0014319/2011-04-01#Artikel1.13
