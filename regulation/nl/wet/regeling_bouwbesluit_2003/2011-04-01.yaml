      door installaties die permanent aanwezig kunnen zijn moet bepaald zijn op grond van de werkelijk optredende
      belastingen.;

      k. in onderdeel 8.5.2.a) worden de eerste twee volzinnen vervangen door: De geconcentreerde belasting moet bepaald
      zijn op grond van de werkelijk optredende belasting.;

      l. onderdeel 8.6.1 wordt gelezen als volgt: Indien een kasconstructie wordt belast door gewassen en de media waarop
      deze groeien, dan moet met het eigen gewicht van deze gewassen en de media rekening zijn gehouden;

