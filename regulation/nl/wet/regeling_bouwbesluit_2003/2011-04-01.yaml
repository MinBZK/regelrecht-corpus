      Bij de toepassing van NEN-EN 81-72 geldt het volgende:

      a. bij onderdeel 5.1.1 geldt het volgende:

      1. ‘een tegen brand beschermde hal’ wordt telkens gelezen als: verkeersruimte, die al dan niet tezamen met de
      liftschacht een rookcompartiment als bedoeld in [afdeling 2.16 van het besluit][ref1] is.

      2. ‘Zie bijlage B en bijlage E’ wordt gelezen als:

      Zie bijlage B en bijlage E.

      De liftschacht van een brandweerlift heeft een volgens NEN 6068 bepaalde weerstand tegen branddoorslag en
      brandoverslag naar een verblijfsgebied, een toiletruimte, een badruimte, een meterruimte en een technische ruimte
      van ten minste 60 minuten.

      b. in onderdeel 5.2.3 geldt voor de vrije doorgang van de toegang van de liftschacht een minimum breedte van 85 cm.

      c. voor de in onderdeel 5.9.1 genoemde primaire en secundaire voorziening voor elektriciteit is [artikel 4.1][ref2]
      van deze regeling van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012727#Afdeling2.16
