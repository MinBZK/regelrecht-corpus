      b De partiële factoren voor bijzondere belastingen hebben in het geval van de beoordeling van bestaande
      constructies uitsluitend betrekking op brand.

      d. onderdeel 5.5.1 wordt als volgt gelezen:

      5.5.1 Voor de beoordeling van de constructieve veiligheid van bestaande bouwwerken bedraagt de referentieperiode
      1 jaar;

      e. in onderdeel 5.5.2 wordt voor 't' gelezen:

      t is de referentieperiode voor de bepaling van de reductiefactor voor de gelijkmatig verdeelde belasting in jaren
      volgens 5.5.1, waarbij voor bouwwerken behorende tot veiligheidsklasse 2 of 3 voor de bepaling van de correctie ten
      minste wordt uitgegaan van t = 15 jaren.

      f. in onderdeel 6.1.1 van deze norm wordt bij het laatste aandachtstreepje gelezen:

        - bijzondere belastingen moeten zijn ontleend aan 9.2;

      g. onderdeel 6.3.2, eerste volzin, laatste aandachtspunt, blijft buiten toepassing;

      h. ten aanzien van de verwijzing in de onderdelen 6.3.3.3 naar NEN 6710, NEN 6720, NEN 6760 en NEN 6770 zijn de
      [artikelen 4.27][ref2], [4.28][ref3], [4.29][ref4] respectievelijk [4.30][ref5] van toepassing;

      i. onderdeel 7.1.2.1 wordt als volgt gelezen:

      7.1.2.1 Het gewicht van bouwwerken moet zijn berekend op grond van de werkelijke afmetingen en het gemiddelde
      gewicht per volume van het materiaal;

      j. onderdeel 7.1.3.2 wordt als volgt gelezen:

      7.1.3.2 Niet-dragende binnenwanden moeten in rekening zijn gebracht als lijnlast;

      k. ten aanzien van de verwijzing in onderdeel 7.3 naar NEN 6720 is [artikel 4.28][ref6] van toepassing;

      l. onderdeel 8.2.5.3 van deze norm blijft buiten toepassing;

      m. onderdeel 8.3.2.1 van deze norm wordt als volgt gelezen:

      8.3.2.1 Voor de bepaling van de belasting door goederen en transportmiddelen moet zijn uitgegaan van de ten
      tijde van de verlening van de bouwvergunning of de omgevingsvergunning berekende vloerbelasting in relatie tot de
      oorspronkelijke bestemming van die vloer;

      n. in onderdeel 8.5.2:

      1º. de eerste volzin van de tweede alinea wordt als volgt gelezen:

      Afhankelijk van het beladen gewicht van de voertuigen, waarvan bij de verlening van de bouwvergunning of de
      omgevingsvergunning is uitgegaan, moet voor deze belastingen zijn aangehouden, en

      2º. de eerste volzin van het derde aandachtstreepje wordt als volgt gelezen:

      De belasting moet zijn bepaald op basis van het zwaarst mogelijke voertuig dat van de garage gebruik maakt, en

      o. In onderdeel 8.7.1.4 van deze norm wordt *γ* = 1,3 gelezen als *γ* = 1,1 ingeval de hoogteligging van het dak,
      en de afmetingen en de hoogteligging van de noodafvoeren als beschreven in onderdeel 8.7.1.3 in-situ zijn gemeten;

      p. in onderdeel 8.8.2 van deze norm wordt de eerste volzin als volgt gelezen:

      De belastingen die optreden als gevolg van temperatuurvariaties moeten zijn gebaseerd op de grootte van de
      optredende temperatuurvariaties, zij het dat ten minste moet zijn gerekend op temperaturen volgens tabel 12.

