  - number: '1.17'
    text: |-
      Een instelling die overeenkomstig artikel 16 van de richtlijn bouwproducten door de lidstaat van
      oorsprong is erkend met het oog op het afgeven van kwaliteitsverklaringen voor andere lidstaten, wordt
      gelijkgesteld met een door de minister aangewezen onafhankelijk deskundig instituut als bedoeld in
      [artikel 1, eerste lid, onderdeel i, van de Woningwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0014319/2011-04-01#Artikel1.17
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
  - number: '1.18'
    text: |-
      1 Kwaliteitsverklaringen als bedoeld in [artikel 1, eerste lid, onderdeel i, van de Woningwet][ref1], worden
      afgegeven op basis van een door de minister erkend stelsel van kwaliteitsverklaringen voor de bouw.

      2 De voorwaarden waaronder kwaliteitsverklaringen binnen het stelsel, bedoeld in het eerste lid, worden afgegeven,
      worden vastgelegd in een overeenkomst tussen de bij het stelsel betrokken partijen. De minister maakt deze
      overeenkomst in de Staatscourant bekend.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0014319/2011-04-01#Artikel1.18
