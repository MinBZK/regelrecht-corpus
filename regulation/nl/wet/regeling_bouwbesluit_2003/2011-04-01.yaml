  - number: '4.11'
    text: |-
      1 De geluidwering *G* van de uitwendige scheidingsconstructie bij nachtelijk vliegverkeer wordt als volgt berekend:

      = {10 log {10*L*Aeq;buiten;starten/10 + 10*L*Aeq;buiten;landen/10} - *L*

      Hierbij wordt de *L* geluidsbelasting in dB(A) binnen een ruimte (*L*), als volgt berekend:

      *L*  = 10 log {10*L*Aeq;binnen;starten/10 + 10*L*Aeq;binnen;landen/10}

      *L*  = *L* - *G*

      *L*  = *L* - *G*

      waarin:

      *L*  = de *L* geluidsbelasting in dB(A) binnen een ruimte ten gevolge van startend vliegverkeer;

      *L*  = de *L* geluidsbelasting in dB(A) buiten de woonfunctie of de gezondheidszorgfunctie ten gevolge van startend
      vliegverkeer als bedoeld in het tweede lid;

      *G*  = de geluidwering van de uitwendige scheidingsconstructie in dB(A) bij startend vliegverkeer;

      *L*  = de ** geluidsbelasting in dB(A) binnen een ruimte ten gevolge van landend vliegverkeer;

      *L*  = de ** geluidsbelasting in dB(A) buiten de woonfunctie of de gezondheidszorgfunctie ten gevolge van landend
      vliegverkeer als bedoeld in het tweede lid;

      *G*  = de geluidwering van de uitwendige scheidingsconstructie in dB(A) bij landend vliegverkeer

      2 De*L* geluidsbelasting in dB(A) buiten de woonfunctie of de gezondheidszorgfunctie voor startend en landend
      vliegverkeer wordt berekend overeenkomstig de Regeling berekening nachtelijke geluidsbelasting, waarbij de
      geluidwering van de uitwendige scheidingsconstructie onderscheiden naar startend en landend vliegverkeer, *L*,
      gelijk wordt gesteld aan 0 dB(A).
    url: https://wetten.overheid.nl/BWBR0014319/2011-04-01#Artikel4.11
