  - number: '5.33'
    text: |-
      Voor een wegtunnel met een tunnellengte van meer dan 250 m worden het
      [eerste en tweede lid van artikel 2.167 van het besluit][ref1] als volgt gelezen:

      1. Een toegang waardoor een rookvrije vluchtroute voert heeft een vrije doorgang met een breedte van ten minste
      0,85 m en een hoogte van ten minste 2,1 m.

      2. Een rookvrije vluchtroute heeft een vrije doorgang met een breedte van ten minste 1,2 m en een hoogte van ten
      minste 2,1 m. De breedte geldt niet voor een verkeersroute voorzover deze over een trap voert en niet voor een
      toegang.


      [ref1]: https://wetten.overheid.nl/BWBR0012727#Artikel2.167
    url: https://wetten.overheid.nl/BWBR0014319/2011-04-01#Artikel5.33
