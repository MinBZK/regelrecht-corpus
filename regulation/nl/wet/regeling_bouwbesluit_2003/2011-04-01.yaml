  - number: '1.12'
    text: |-
      1 De minister wijst certificatie- en inspectie-instellingen en testlaboratoria aan, die de taken, bedoeld in
      artikel 16 onderscheidenlijk artikel 18 van de richtlijn bouwproducten, uitvoeren.

      2 De minister kan aan een aanwijzing voorschriften verbinden.

      3 De minister kan maximum tarieven vaststellen voor de taken, die de op grond van het eerste lid aangewezen
      instellingen ter uitvoering van de artikelen 16 en 18 van de richtlijn verrichten.

      4 De minister kan de aanwijzing intrekken, indien de desbetreffende instelling de aan de aanwijzing verbonden
      voorschriften als bedoeld in het tweede lid niet naleeft, en indien hij van oordeel is dat de desbetreffende
      instelling niet meer voldoet aan de voorwaarden, bedoeld in [artikel 1.13, tweede en derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014319#Artikel1.13
    url: https://wetten.overheid.nl/BWBR0014319/2011-04-01#Artikel1.12
    references:
