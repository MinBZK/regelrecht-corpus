---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_grenswaarden_afvalwater_vcm_bedrijven
regulatory_layer: WET
publication_date: '2020-12-03'
valid_from: '2009-12-22'
bwb_id: BWBR0011474
url: https://wetten.overheid.nl/BWBR0011474/2009-12-22
preamble:
  text: |-
    Gelet op OSPAR-Besluit 98/4 inzake de grenswaarden voor emissie en lozing bij de productie van vinylchloride-
    monomeer (VCM), met inbegrip van de productie van 1,2-dichloorethaan (EDC) (OSPAR 98/14/1 para B-8.2 en annex 39)
    en op artikel 1a, derde lid, van de Wet verontreiniging oppervlaktewateren;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0011474/2009-12-22#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0011474/2009-12-22#Artikel1
  - number: 1.a
    text: 'VCM: vinylchloride-monomeer;'
    url: https://wetten.overheid.nl/BWBR0011474/2009-12-22#Artikel1
  - number: 1.b
    text: 'EDC: 1,2-dichloorethaan;'
    url: https://wetten.overheid.nl/BWBR0011474/2009-12-22#Artikel1
  - number: 1.c
    text: 'chloroform: de chemische verbinding CHCl (c.a.s. nr. 67-66-3);'
    url: https://wetten.overheid.nl/BWBR0011474/2009-12-22#Artikel1
  - number: 1.d
    text: |-
      gechloreerde koolwaterstoffen: de som van de verbindingen EDC, VCM, chloroform, tetrachloorkoolstof,
      trichloorethaan, methylchloride en hexachloorbenzeen en andere soortgelijke stoffen;
    url: https://wetten.overheid.nl/BWBR0011474/2009-12-22#Artikel1
  - number: 1.e
    text: 'dioxines: polychloordibenzo-p-dioxines en polychloordibenzofuranen, uitgedrukt in toxiciteitsequivalent (TEQ);'
    url: https://wetten.overheid.nl/BWBR0011474/2009-12-22#Artikel1
  - number: 1.f
    text: 'productie van VCM: industrieel proces waarbij VCM wordt geproduceerd;'
    url: https://wetten.overheid.nl/BWBR0011474/2009-12-22#Artikel1
  - number: 1.g
    text: 'productie van EDC: industrieel proces waarbij EDC wordt geproduceerd;'
    url: https://wetten.overheid.nl/BWBR0011474/2009-12-22#Artikel1
  - number: 1.h
    text: |-
      VCM-bedrijf: bedrijf dat VCM of EDC produceert uit etheen en chloor of uit etheen of waterstofchloride als
      grondstoffen;
    url: https://wetten.overheid.nl/BWBR0011474/2009-12-22#Artikel1
  - number: 1.i
    text: 'bijlage: bij deze regeling behorende bijlage;'
    url: https://wetten.overheid.nl/BWBR0011474/2009-12-22#Artikel1
  - number: 1.j
    text: '*lozen:* brengen van:'
    url: https://wetten.overheid.nl/BWBR0011474/2009-12-22#Artikel1
  - number: 1.j.1°
    text: stoffen in een oppervlaktewaterlichaam;
    url: https://wetten.overheid.nl/BWBR0011474/2009-12-22#Artikel1
  - number: 1.j.2°
    text: |-
      afvalwater of andere afvalstoffen in een openbaar hemelwaterstelsel, een openbaar ontwateringstelsel, een openbaar
      vuilwaterriool of een andere voorziening voor de inzameling en het transport van afvalwater, of
    url: https://wetten.overheid.nl/BWBR0011474/2009-12-22#Artikel1
  - number: 1.j.3°
    text: |-
      stoffen op een zuiveringtechnisch werk met behulp van een werk niet zijnde een voorziening voor de inzameling en
      het transport van afvalwater.
    url: https://wetten.overheid.nl/BWBR0011474/2009-12-22#Artikel1
  - number: 1a
    text: |-
      Deze regeling berust op [artikel 6.3 van het Waterbesluit][ref1] en [artikel 8.40, eerste lid][ref2], in samenhang
      met [artikel 21.6, zesde lid, van de Wet milieubeheer][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0026872#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel21
    url: https://wetten.overheid.nl/BWBR0011474/2009-12-22#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0026872
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '21'
  - number: '2.1'
    text: |-
      Voor een VCM-bedrijf gelden als de hoogst toelaatbare gewichtshoeveelheid en concentratie van stoffen voorkomend
      in afvalwater die worden geloosd, de grenswaarden die overeenkomen met de waarden die het resultaat zijn van
      toepassing van de beste bestaande technieken, met dien verstande dat die gewichtshoeveelheid en concentratie in
      ieder geval niet hoger zijn dan de in bijlage I opgenomen grenswaarden.
    url: https://wetten.overheid.nl/BWBR0011474/2009-12-22#Artikel2
  - number: '2.2'
    text: |-
      Een VCM-bedrijf kan niet door middel van verdunning van het afvalwater aan de in het eerste lid bedoelde
      grenswaarden voldoen.
    url: https://wetten.overheid.nl/BWBR0011474/2009-12-22#Artikel2
  - number: '3.1'
    text: |-
      Bij het bemonsteren, meten en analyseren van de concentraties en vrachten voor de stoffen waarvoor in bijlage I
      grenswaarden zijn vastgesteld, wordt ten minste voldaan aan de in bijlage II gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0011474/2009-12-22#Artikel3
  - number: '3.2'
    text: Bij het analyseren wordt gebruikgemaakt van de in bijlage III aangegeven methoden.
    url: https://wetten.overheid.nl/BWBR0011474/2009-12-22#Artikel3
  - number: '4'
    text: |-
      Voorzover de in deze regeling vastgestelde grenswaarden voor afvalwater dat vrijkomt bij de productie van EDC,
      strenger zijn dan de grenswaarden, vastgesteld in de regeling van de Minister van Volkshuisvesting, Ruimtelijke
      Ordening en Milieubeheer van 3 januari 1992 houdende grenswaarden voor EDC in afvalwater (Stb. 25), blijven de
      bepalingen van laatstgenoemde regeling buiten toepassing en gelden de bepalingen van de onderhavige regeling.
    url: https://wetten.overheid.nl/BWBR0011474/2009-12-22#Artikel4
  - number: '5.1'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de datum van uitgifte van het Staatsblad waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0011474/2009-12-22#Artikel5
  - number: '5.2'
    text: |-
      Deze regeling blijft tot 1 januari 2006 buiten toepassing voor een VCM-bedrijf dat op de datum van inwerkingtreding
      van deze regeling in werking is, tenzij na die datum naar het oordeel van het bevoegd gezag de capaciteit voor het
      produceren van VCM of EDC aanzienlijk is uitgebreid of aanzienlijke technische wijzigingen van het productieproces
      hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0011474/2009-12-22#Artikel5
  - number: '6'
    text: 'Deze regeling wordt aangehaald als: Regeling grenswaarden afvalwater VCM-bedrijven.'
    url: https://wetten.overheid.nl/BWBR0011474/2009-12-22#Artikel6
