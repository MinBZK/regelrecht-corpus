$id: regeling_grenswaarden_afvalwater_vcm_bedrijven
regulatory_layer: WET
publication_date: '2020-12-03'
valid_from: '2000-08-12'
bwb_id: BWBR0011474
url: https://wetten.overheid.nl/BWBR0011474/2000-08-12
preamble:
  text: |-
    Gelet op OSPAR-Besluit 98/4 inzake de grenswaarden voor emissie en lozing bij de productie van vinylchloride-
    monomeer (VCM), met inbegrip van de productie van 1,2-dichloorethaan (EDC) (OSPAR 98/14/1 para B-8.2 en annex 39)
    en op artikel 1a, derde lid, van de Wet verontreiniging oppervlaktewateren;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0011474/2000-08-12#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. VCM: vinylchloride-monomeer;

      b. EDC: 1,2-dichloorethaan;

      c. chloroform: de chemische verbinding CHCl (c.a.s. nr. 67-66-3);

      d. gechloreerde koolwaterstoffen: de som van de verbindingen EDC, VCM, chloroform, tetrachloorkoolstof,
      trichloorethaan, methylchloride en hexachloorbenzeen en andere soortgelijke stoffen;

      e. dioxines: polychloordibenzo-p-dioxines en polychloordibenzofuranen, uitgedrukt in toxiciteitsequivalent (TEQ);

      f. productie van VCM: industrieel proces waarbij VCM wordt geproduceerd;

      g. productie van EDC: industrieel proces waarbij EDC wordt geproduceerd;

      h. VCM-bedrijf: bedrijf dat VCM of EDC produceert uit etheen en chloor of uit etheen of waterstofchloride als
      grondstoffen;

      i. . bevoegd gezag: het bestuursorgaan dat overeenkomstig artikel 3 onderscheidenlijk artikel 6, eerste lid, van de
      wet bevoegd is of zou zijn een vergunning te verlenen;

      j. vergunning: vergunning op grond van artikel 1 van de wet;

      k. wet: Wet verontreiniging oppervlaktewateren;

      l. bijlage: bij deze regeling behorende bijlage.
    url: https://wetten.overheid.nl/BWBR0011474/2000-08-12#Artikel1
  - number: '2'
    text: |-
      1 Voor een VCM-bedrijf gelden als de hoogst toelaatbare gewichtshoeveelheid en concentratie van stoffen voorkomend
      in afvalwater die in oppervlaktewater worden gebracht, de grenswaarden die overeenkomen met de waarden die het
      resultaat zijn van toepassing van de beste bestaande technieken, met dien verstande dat die gewichtshoeveelheid en
      concentratie in ieder geval niet hoger zijn dan de in bijlage I opgenomen grenswaarden.

      2 Een VCM-bedrijf kan niet door middel van verdunning van het afvalwater aan de in het eerste lid bedoelde
      grenswaarden voldoen.
    url: https://wetten.overheid.nl/BWBR0011474/2000-08-12#Artikel2
  - number: '3'
    text: |-
      1 Bij het bemonsteren, meten en analyseren van de concentraties en vrachten voor de stoffen waarvoor in bijlage I
      grenswaarden zijn vastgesteld, wordt ten minste voldaan aan de in bijlage II gestelde eisen.

      2 Bij het analyseren wordt gebruikgemaakt van de in bijlage III aangegeven methoden.
    url: https://wetten.overheid.nl/BWBR0011474/2000-08-12#Artikel3
  - number: '4'
    text: |-
      Voorzover de in deze regeling vastgestelde grenswaarden voor afvalwater dat vrijkomt bij de productie van EDC,
      strenger zijn dan de grenswaarden, vastgesteld in de regeling van de Minister van Volkshuisvesting, Ruimtelijke
      Ordening en Milieubeheer van 3 januari 1992 houdende grenswaarden voor EDC in afvalwater (Stb. 25), blijven de
      bepalingen van laatstgenoemde regeling buiten toepassing en gelden de bepalingen van de onderhavige regeling.
    url: https://wetten.overheid.nl/BWBR0011474/2000-08-12#Artikel4
  - number: '5'
    text: |-
      1 Deze regeling treedt in werking met ingang van de tweede dag na de datum van uitgifte van het Staatsblad waarin
      zij wordt geplaatst.

      2 Deze regeling blijft tot 1 januari 2006 buiten toepassing voor een VCM-bedrijf dat op de datum van
      inwerkingtreding van deze regeling in werking is, tenzij na die datum naar het oordeel van het bevoegd gezag de
      capaciteit voor het produceren van VCM of EDC aanzienlijk is uitgebreid of aanzienlijke technische wijzigingen van
      het productieproces hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0011474/2000-08-12#Artikel5
  - number: '6'
    text: 'Deze regeling wordt aangehaald als: Regeling grenswaarden afvalwater VCM-bedrijven.'
    url: https://wetten.overheid.nl/BWBR0011474/2000-08-12#Artikel6
