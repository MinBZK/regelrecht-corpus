preamble:
  text: |-
    Gelet op de artikelen 6, 7, derde lid, en 10 van het Subsidiebesluit Ministerie van Buitenlandse Zaken;

    Gelet op de artikelen 9.3 en 9.4 van de Subsidieregeling Ministerie van Buitenlandse Zaken 2006;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0019639/2006-03-15#ArtikelAanhef
articles:
  - number: I
    text: |-
      Subsidieverlening op grond van het [Subsidiebesluit Ministerie van Buitenlandse Zaken][ref1] en de
      [artikelen 9.3][ref2] en [9.4 van de Subsidieregeling Ministerie van Buitenlandse Zaken 2006][ref3]
      in het kader van het Europafonds geschiedt tot en met 31 december 2006 met inachtneming van het
      [Besluit van de Minister van Buitenlandse Zaken van 21 december 2005][ref4], nr. DVL 3154/05, tot vaststelling van
      een beleidsvoornemen en een subsidieplafond, zoals luidend voor inwerkingtreding van de Subsidieregeling Ministerie
      van Buitenlandse Zaken 2006, met dien verstande dat:

      a in [artikel 4, eerste volzin][ref5], in plaats van het vermelde bedrag geldt: € 1.750.000;

      b in [artikel 5, eerste volzin][ref6], in plaats van het vermelde bedrag geldt: € 750.000, en

      c in [artikel 5 in plaats van de tweede volzin][ref7] geldt: Aanvragen kunnen worden ingediend vanaf 1 juli 2006
      tot en met 31 augustus 2006.


