  - number: '56'
    text: |-
      1 De schuldeiser die retentierecht heeft op een aan de schuldenaar toebehorende zaak, verliest dit recht niet door
      de faillietverklaring.

      2 De zaak kan door de curator worden opgeëist en met toepassing van de [artikelen 96][ref1] of
      [169, vierde en vijfde lid][ref2], worden verkocht, onverminderd de voorrang, aan de schuldeiser in
      [artikel 292 van Boek 3 van het Burgerlijk Wetboek BES][ref3] toegekend. De curator kan ook, indien dit in
      het belang is van de boedel, de zaak in de boedel terugbrengen door voldoening van de vordering waarvoor het
      retentierecht kan worden uitgeoefend.

      3 De schuldeiser kan de curator een redelijke termijn stellen om tot toepassing van het tweede lid over te
      gaan. Heeft de curator de zaak niet binnen deze termijn verkocht, dan kan de schuldeiser haar verkopen met
      overeenkomstige toepassing van de bepalingen, betreffende parate executie door een pandhouder, of, als het een
      registergoed betreft, die betreffende parate executie door een hypotheekhouder. De rechter-commissaris kan de
      termijn op verzoek van de curator een of meer malen te verlengen.

      4 Betreft het een registergoed, dan zegt de schuldeiser, op straffe van verval van het recht van parate executie,
      binnen veertien dagen na het verstrijken van de in het derde lid bedoelde termijn, aan de curator bij exploit aan
      dat hij tot executie overgaat, en doet dit exploit in de openbare registers inschrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel96
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel169
      [ref3]: https://wetten.overheid.nl/BWBR0028745#Artikel292
