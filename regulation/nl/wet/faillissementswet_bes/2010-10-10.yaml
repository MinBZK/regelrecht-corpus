      1 Gedurende acht dagen na den dag van de betrekkelijke uitspraak bestaat recht van hooger beroep:

      1°. voor den schuldenaar, wiens aangifte tot faillietverklaring is afgewezen, of die, nadat hij op de aanvraag
      tot faillietverklaring is gehoord, in staat van faillissement is verklaard, of wiens in [artikel 7][ref1] bedoeld
      verzet is afgewezen;

      2°. voor hem, die een aanvraag tot faillietverklaring gedaan heeft, indien de aanvraag is afgewezen of de daarop
      gevolgde faillietverklaring tengevolge van verzet is vernietigd;

      3°. voor den schuldeischer of belanghebbende, wiens in [artikel 8][ref2] bedoeld verzet is vernietigd;

      4°. voor den schuldenaar, den schuldeischer, die de faillietverklaring verzocht heeft en het Openbaar Ministerie,
      bij vernietiging van de faillietverklaring tengevolge van het in [artikel 8][ref3] bedoelde verzet.

      2 Op het instellen en de behandeling van het beroep is het bepaalde bij [artikel 7][ref4] van overeenkomstige
      toepassing.


