  - number: '241'
    text: |-
      De schuldenaar is bevoegd bij of na het verzoek tot surséance aan hen, die vorderingen hebben, ten aanzien waarvan
      de surséance werkt, een akkoord aan te bieden.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel241
  - number: '242'
    text: |-
      1 Het ontwerp van akkoord wordt, indien het niet ingevolge [artikel 206][ref1] ter griffie van het gerecht in
      eersten aanleg berust, aldaar nedergelegd ter kostelooze inzage van een ieder.

      2 Een afschrift moet zoodra mogelijk aan de bewindvoerders en de deskundigen worden toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel206
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel242
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '206'
        afdeling: Eerste
  - number: '243'
    text: |-
      Het ontwerp van akkoord vervalt, indien, voordat het vonnis van homologatie van het akkoord in kracht van gewijsde
      is gegaan, eene rechtelijke beslissing houdende beëindiging der surséance in kracht van gewijsde gaat.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel243
  - number: '244'
    text: |-
      1 Indien het ontwerp van akkoord tegelijk met het verzoekschrift tot verleening van surséance ter griffie is
      nedergelegd, kan de rechter in eersten aanleg, bewindvoerders gehoord, gelasten, dat de in [artikel 209][ref1]
      bedoelde behandeling van het verzoek niet zal plaats hebben, in welk geval hij tevens zal vaststellen:

      1°. den dag, waarop uiterlijk de schuldvorderingen, ten aanzien waarvan de surséance werkt, bij de bewindvoerders
      moeten worden ingediend;

      2°. dag en uur, waarop over het aangeboden akkoord zal worden geraadpleegd en beslist.

      2 Tusschen de dagen, onder 1e en 2e vermeld, moeten tenminste veertien dagen verloopen.

      3 Indien de rechter in eersten aanleg van deze bevoegdheid geen gebruik maakt of het ontwerp van akkoord niet
      tegelijk met het verzoekschrift tot het verleenen van surséance ter griffie is nedergelegd, zal hij, bewindvoerders
      gehoord, de dagen en uren, in het eerste lid bedoeld, vaststellen zoodra de beschikking, waarbij de surséance
      definitief is verleend, kracht van gewijsde heeft gekregen of, indien het ontwerp van akkoord eerst daarna ter
      griffie is nedergelegd, dadelijk na die nederlegging.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel209
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel244
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '209'
        afdeling: Eerste
  - number: '245'
    text: |-
      1 De bewindvoerders doen dadelijk zoowel van de in het [vorige artikel][ref1] bedoelde beschikking als van de
      nederlegging ter griffie van het ontwerp van akkoord – tenzij deze reeds ingevolge [artikel 207][ref2] is bekend
      gemaakt – aankondiging in de Staatscourant.

      2 Zij geven tevens van een en ander bij brieven kennis aan alle bekende schuldeischers. Daarbij wordt op het
      bepaalde bij [artikel 246, tweede lid][ref3], gewezen.

      3 De schuldeischers kunnen verschijnen in persoon of bij schriftelijk gemachtigde. De volmacht is vrij van zegel en
      van de formaliteit van registratie.

      4 De bewindvoerders kunnen vorderen, dat de schuldenaar hun een door hen te bepalen bedrag ter bestrijding van de
      kosten dezer aankondigingen en kennisgevingen vooraf ter hand stelt.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel244
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel207
      [ref3]: https://wetten.overheid.nl/BWBR0028917#Artikel246
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel245
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '244'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0028917
        artikel: '207'
        afdeling: Eerste
      - id: ref3
        bwb_id: BWBR0028917
        artikel: '246'
        afdeling: Tweede
  - number: '246'
    text: |-
      1 De indiening der schuldvorderingen geschiedt bij de bewindvoerders door de overlegging eener rekening of andere
      schriftelijke verklaring, aangevende den aard en het bedrag der vordering, vergezeld van de bewijsstukken of een
      afschrift daarvan.

      2 Vorderingen ten aanzien waarvan de surséance niet werkt, komen voor indiening niet in aanmerking. Heeft nochtans
      indiening plaats gehad, dan werkt de surséance ook ten aanzien van die vorderingen en gaat een aan de vordering
      verbonden voorrecht, retentierecht, pandrecht of hypotheek verloren. Een en ander geldt niet, voor zover de
      vordering vóór de aanvang der stemming wordt teruggenomen.

      3 De schuldeischers zijn bevoegd van de bewindvoerders een ontvangstbewijs te vorderen.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel246
  - number: '247'
    text: |-
      De bewindvoerders toetsen de ingezonden rekeningen aan de administratie en opgaven van den schuldenaar, treden,
      als zij tegen de toelating eener vordering bezwaar hebben, met den schuldeischer in overleg, en zijn bevoegd van
      dezen overlegging van ontbrekende stukken alsook raadpleging van zijn administratie en van de oorspronkelijke
      bewijsstukken te vorderen.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel247
  - number: '248'
    text: |-
      De bewindvoerders brengen de bij hen ingediende vorderingen op eene lijst, vermeldende de namen en woonplaatsen
      der schuldeischers, het bedrag en de omschrijving der vorderingen, alsmede of en in hoever de bewindvoerders die
      vorderingen erkennen of betwisten.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel248
  - number: '249'
    text: |-
      1 Eene rentedragende vordering wordt op de lijst gebracht met bijrekening der rente tot den aanvang der surséance.

      2 De [artikelen 125][ref1], [128–130][ref2] en [131, eerste en tweede lid][ref3], vinden overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel125
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel128
      [ref3]: https://wetten.overheid.nl/BWBR0028917#Artikel131
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel249
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '125'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0028917
