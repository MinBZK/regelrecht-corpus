  - number: 15a
    text: |-
      1 Indien de rechter-commissaris – en in de gevallen bedoeld in de [Elfde Afdeeling van Titel I][ref1] en in
      [Titel II][ref2] van dit besluit, de rechter in eersten aanleg – zulks in het belang van den boedel of van de
      schuldeischers, of wegens afwezigheid van den schuldenaar, of om andere gewichtige, daarbij te vermelden, redenen
      noodig oordeelt, beveelt hij van elke in dit besluit bevolen aankondiging, bekendmaking of openbaarmaking in het in
      [artikel 11][ref3] bedoeld blad, mede plaatsing in de Staatscourant, alsook ingeval hij hiertoe gronden vindt, in
      een of meer door hem aan te wijzen nieuwsbladen.

      2 Indien het vonnis van faillietverklaring in de Staatscourant is bekendgemaakt, doet de curator van een uitspraak
      houdende vernietiging van de of opheffing van het faillissement, als bedoeld in de [artikelen 12][ref4] en
      [14][ref5], daarvan mede aankondiging in de Staatscourant.

      3 Indien aan de aankondiging, bekendmaking of openbaarmaking eenig rechtsgevolg verbonden of daarvan een termijn
      afhankelijk gesteld is, komt slechts de plaatsing in het in [artikel 1][ref6] bedoeld blad in aanmerking.


