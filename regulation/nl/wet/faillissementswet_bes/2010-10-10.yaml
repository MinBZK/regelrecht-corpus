  - number: '16'
    text: |-
      1 De griffier van het gerecht in eerste aanleg houdt in de openbare lichamen Bonaire, Sint Eustatius of Saba een
      openbaar register bij, waarin hij, voor ieder faillissement afzonderlijk, achtereenvolgens, met vermelding van de
      dagteekeningen inschrijft:

      1°. een uittreksel van de rechterlijke beslissingen, waarbij de faillietverklaring uitgesproken of weder opgeheven
      is;

      2°. den summieren inhoud en de homologatie van het akkoord;

      3°. de ontbinding van het akkoord;

      4°. het bedrag van de uitdeelingen bij vereffening;

      5°. de opheffing van het faillissement ingevolge [artikel 14][ref1];

      6°. de rehabilitatie.

      2 Omtrent de vorm en inhoud van het register worden bij algemene maatregel van bestuur nadere regels gesteld.

      3 De griffier is verplicht aan ieder kosteloos inzage van het register en tegen betaling een uittreksel daaruit
      te verstrekken.

      4 Op het register bestaat een alphabetische klapper.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel14
