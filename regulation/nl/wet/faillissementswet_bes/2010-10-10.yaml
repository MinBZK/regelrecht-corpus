  - number: '10'
    text: |-
      1 Indien tengevolge van verzet of hooger beroep de faillietverklaring wordt vernietigd, blijven niettemin geldig
      en verbindend voor den schuldenaar de handelingen, door den curator verricht vóór of op den dag, waarop aan het
      voorschrift tot aankondiging overeenkomstig [artikel 12][ref1] is voldaan.

      2 Hangende het verzet of het hooger beroep kan raadpleging over een akkoord niet plaats hebben; ook kan niet tot de
      vereffening van den boedel buiten toestemming van den schuldenaar worden overgegaan.


