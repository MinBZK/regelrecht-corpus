  - number: '239'
    text: |-
      1 Het loon van de deskundigen, benoemd ingevolge de bepaling van [artikel 216][ref1], en van de bewindvoerders
      wordt bepaald door den rechter in eersten aanleg en bij voorrang voldaan.

      2 Dit laatste is ook van toepassing op hunne verschotten en op die, door den griffier ten gevolge van de bepalingen
      van dezen titel gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel216
