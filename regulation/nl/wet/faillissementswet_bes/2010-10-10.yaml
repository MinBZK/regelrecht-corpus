      - id: ref3
        bwb_id: BWBR0028917
        artikel: '126'
        afdeling: Vijfde
  - number: '53'
    text: |-
      1 Pand- en hypotheekhouders kunnen hun recht uitoefenen, alsof er geen faillissement was.

      2 Bij de verdeling kunnen uit eigen hoofde mede de beperkt gerechtigden opkomen, wier recht vóór de
      faillietverklaring was gevestigd, maar door de executie door een pand- of hypotheekhouder is vervallen voor hun
      recht op schadevergoeding, bedoeld in [artikel 282 van Boek 3 van het Burgerlijk Wetboek BES][ref1].

      3 Bij de verdeling van de opbrengst oefent de curator ten behoeve van de boedel mede de rechten uit, die de wet aan
      beslagleggers op het goed toekent. Hij behartigt daarbij mede de belangen van de bevoorrechte schuldeisers die in
      rang boven de voormelde pand- en hypotheekhouders en beperkt gerechtigden gaan.

      4 Zo een rangregeling nodig is, wordt deze verzocht aan de rechter-commissaris. De verdeling
      geschiedt ten overstaan van deze rechter-commissaris op de wijze voorgeschreven in het
      [Wetboek van Burgerlijke Rechtsvordering BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel282
      [ref2]: https://wetten.overheid.nl/BWBR0028496
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '282'
      - id: ref2
        bwb_id: BWBR0028496
  - number: '54'
    text: |-
      1 De curator kan de pand- en hypotheekhouders een redelijke termijn stellen om tot uitoefening van hun rechten
      overeenkomstig [artikel 53][ref1] over te gaan. Heeft de pand- of hypotheekhouder het onderpand niet binnen
      deze termijn verkocht, dan kan de curator de goederen opeisen en met toepassing van de [artikelen 96][ref2]
      of [169, vierde en vijfde lid][ref3], verkopen, onverminderd het recht van de pand- en hypotheekhouders op de
      opbrengst. De rechter-commissaris kan de termijn op verzoek van de pand- of hypotheekhouder een of meer malen
      verlengen.

      2 De curator kan een met pand of hypotheek bezwaard goed tot op het tijdstip van de verkoop lossen tegen voldoening
      van hetgeen waarvoor het pand- of hypotheekrecht tot zekerheid strekt, alsmede van de reeds gemaakte kosten van
      executie.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel96
      [ref3]: https://wetten.overheid.nl/BWBR0028917#Artikel169
