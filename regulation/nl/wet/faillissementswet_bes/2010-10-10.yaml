  - number: '11'
    text: |-
      1 De rechter in eersten aanleg, die het vonnis tot faillietverklaring uitsprak of wiens vonnis tot
      faillietverklaring rechtsgevolgen heeft, of aan wien, in de bij [artikel 13][ref1] bedoelde gevallen, de aangifte
      of aanvraag is ingediend, vervult tevens de functie van rechter-commissaris in het faillissement.

      2 Het vonnis van faillietverklaring houdt in de aanstelling van één of meer curators in het faillissement.

      3 Van de faillietverklaring geeft de griffier onverwijld kennis aan de administratiën der posterijen, telefonen en
      der telegrafen.

      4 De curator plaatst onverwijld een uittreksel uit het vonnis van faillietverklaring, houdende vermelding van den
      naam, de woonplaats of het kantoor en het beroep van den gefailleerde, van den naam van den rechter-commissaris,
      van den naam en de woonplaats of het kantoor des curators, van den dag van de uitspraak, alsmede van den naam, het
      beroep en de woonplaats of het kantoor van ieder lid der voorloopige commissie uit de schuldeischers, zoo er eene
      benoemd is, in de Staatscourant en in een of meer door de rechter-commissaris aan te wijzen nieuwsbladen.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel13
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel11
