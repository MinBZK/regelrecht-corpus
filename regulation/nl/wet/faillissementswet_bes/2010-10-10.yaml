  - number: '75'
    text: |-
      De curator is niet gebonden aan het advies der commissie. Zoo hij zich daarmede niet vereenigt, geeft hij hiervan
      onmiddellijk kennis aan de commissie, welke de beslissing van den rechter-commissaris kan inroepen. Zoo zij
      verklaart, dit te doen, is de curator verplicht de uitvoering van de voorgenomen, met het advies der commissie
      strijdige handeling, gedurende drie dagen op te schorten.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel75
  - number: '76'
    text: |-
      1 In de vergaderingen van schuldeischers is de rechter-commissaris voorzitter.

      2 De tegenwoordigheid van den curator of van iemand, die hem met goedvinden van den rechter-commissaris vervangt,
      is verplicht.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel76
  - number: '77'
    text: |-
      1 In de vergaderingen van schuldeischers worden de besluiten genomen met volstrekte meerderheid van stemmen van de
      aanwezige schuldeischers.

      2 Voor elke honderd US dollar brengt ieder schuldeischers ééne stem uit. Voor vorderingen of overschietende
      gedeelten van vorderingen, beneden honderd gulden, wordt mede ééne stem uitgebracht.

      3 Splitsing van vorderingen na de faillietverklaring gedaan, doet stemrecht niet verwerven.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel77
  - number: '79'
    text: |-
      Ten behoeve van de schuldeischers, die zich op eene vergadering hebben doen vertegenwoordigen, worden alle
      oproepingen voor latere vergaderingen en alle kennisgevingen aan den gemachtigde gedaan, ten ware zij den curator
      schriftelijk verzoeken, dat die oproepingen en kennisgevingen aan hen zelve of aan een anderen gemachtigde
      geschieden.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel79
  - number: '80'
    text: |-
      1 Behalve de door dit besluit voorgeschreven vergaderingen, wordt er eene vergadering van schuldeischers gehouden
      zoo dikwijls de rechter-commissaris dit noodig oordeelt of hem daartoe door de commissie uit de schuldeischers
      of door ten minste vijf schuldeischers, vertegenwoordigende één vijfde deel van de erkende en de voorwaardelijk
      toegelaten schuldvorderingen, een met redenen omkleed verzoek wordt gedaan.

      2 In elk geval bepaalt de rechter-commissaris dag, uur en plaats voor de vergadering; waartoe de curator de
      stemgerechtigde schuldeischers ten minste ééne maand van te voren oproept bij advertentie in het nieuwsblad,
      bedoeld in [artikel 11][ref1], en bij brieven, beide vermeldende het in de vergadering te behandelen onderwerp.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel11
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '11'
        afdeling: Eerste
  - number: '81'
    text: |-
      Alle beschikkingen in zaken, het beheer of de vereffening van den faillieten boedel betreffende, zijn uitvoerbaar
      bij voorraad en op de minuut, tenzij het tegendeel bepaald is.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel81
  - number: '82'
    text: |-
      1 Bij het vonnis van faillietverklaring kan de rechter in eersten aanleg, of te allen tijde daarna, doch in
      het laatste geval niet dan op verzoek van den curator of van één of meer der schuldeischers, kan de rechter-
      commissaris bevelen, dat de gefailleerde wegens het niet nakomen van verplichtingen welke de wet hem in verband
      met zijn faillissement oplegt, dan wel wegens gegronde vrees voor het niet nakomen van zodanige verplichtingen, in
      verzekerde bewaring worde gesteld, hetzij in een huis van bewaring, hetzij in zijn eigene woning onder het opzicht
      van een dienaar van de openbare macht.

      2 Het Openbaar Ministerie legt het bevel hiertoe ten uitvoer.

      3 Dit bevel is voor niet langer dan voor dertig dagen geldig, gerekend van den dag, waarop het ten uitvoer is
      gelegd. Aan het einde van dien termijn kan de rechter-commissaris op een verzoek als in het eerste lid bedoeld,
      het bevel voor ten hoogste dertig dagen verlengen. Daarna kan hetzelfde telkens op dezelfde wijze voor ten hoogste
      dertig dagen geschieden.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel82
  - number: '83'
    text: |-
      1 De rechter-commissaris heeft de bevoegdheid, op verzoek van den gefailleerde, dezen uit de verzekerde bewaring te
      ontslaan, met of zonder zekerheidsstelling, dat hij te allen tijde op de eerste oproeping zal verschijnen.

      2 Het bedrag van de zekerheidstelling wordt door den rechter-commissaris bepaald en komt bij niet-verschijning van
      den gefailleerde ten voordeele van den boedel.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel83
  - number: '84'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel84
  - number: '85'
    text: |-
      1 In alle gevallen, waarin de tegenwoordigheid van den gefailleerde bij deze of gene bepaalde werkzaamheid, den
      boedel betreffende, vereischt wordt, kan hij, zoo hij zich in verzekerde bewaring bevindt, op last van den rechter-
      commissaris uit de bewaarplaats worden overgebracht.

      2 Het Openbaar Ministerie legt de last hiertoe ten uitvoer.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel85
  - number: '86'
    text: |-
      Gedurende het faillissement mag de gefailleerde zonder toestemming van den rechter-commissaris zijne woonplaats
      niet verlaten.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel86
  - number: '87'
    text: |-
      De curator zorgt, dadelijk na de aanvaarding van zijne betrekking, door alle noodige en gepaste middelen voor
      de bewaring van den boedel. Hij neemt onmiddellijk de bescheiden en andere gegevensdragers, gelden, kleinoodiën,
      effecten en andere papieren van waarde tegen ontvangbewijs onder zich. Hij is bevoegd de gelden aan den ontvanger
      voor de gerechtelijke consignatiën in bewaring te geven.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel87
  - number: '88'
    text: |-
      1 De curator doet, zoo hij of de rechter-commissaris dit noodig acht, dadelijk den boedel verzegelen door een
      notaris.

      2 Buiten de verzegeling blijven, doch worden in het proces-verbaal kortelijk beschreven, de goederen vermeld
      in de [artikelen 18 eerste lid, onder 1e.][ref1], en [87][ref2], alsmede de voorwerpen tot het bedrijf van den
      gefailleerde vereischt, indien dit wordt voortgezet.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel87
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '18'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0028917
        artikel: '87'
        afdeling: Vierde
  - number: '89'
    text: |-
      1 De curator gaat zoo spoedig mogelijk over tot het opmaken van eene beschrijving van den faillieten boedel.

      2 De boedelbeschrijving kan ondershands worden opgemaakt en de waardeering door den curator geschieden, een en
      ander onder goedkeuring van den rechter-commissaris.

      3 De leden van de voorlopige commissie uit de schuldeischers zijn bevoegd bij de beschrijving tegenwoordig te zijn.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel89
  - number: '90'
    text: |-
      Van de goederen, vermeld in [artikel 18 eerste lid, onder 1e][ref1]., wordt een staat aan de beschrijving gehecht;
      die, vermeld in [artikel 87][ref2], worden in de beschrijving opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel87
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '18'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0028917
        artikel: '87'
        afdeling: Vierde
  - number: '91'
    text: |-
      De curator gaat dadelijk na de beschrijving van den boedel over tot het opmaken van een staat, waaruit de aard en
      het bedrag van de baten en schulden des boedels, de namen en woonplaatsen der schuldeischers, alsmede het bedrag
      van de vorderingen van ieder hunner blijken.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel91
  - number: '92'
    text: |-
      Door den curator gewaarmerkte afschriften van de boedelbeschrijving en van den staat, vermeld in het
      [voorgaande artikel][ref1], worden ter kostelooze inzage van een ieder gelegd ter griffie van het gerecht in eerste
      aanleg in het openbaar lichaam waar het faillissement werd uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel91
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '91'
        afdeling: Vierde
  - number: '93'
    text: |-
      De curator is bevoegd het bedrijf van den gefailleerde voort te zetten. Indien eene commissie uit de schuldeischers
      niet is benoemd, heeft hij daartoe de machtiging van den rechter-commissaris noodig.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel93
  - number: '94'
    text: |-
      1 De curator opent de aan den gefailleerde gerichte brieven, telegrammen en schriftelijk overgebrachte
      telefoonberichten. Die, welke niet op den boedel betrekking hebben, stelt hij terstond aan den gefailleerde
      ter hand. De administratiën der posterijen, der telefonen en der telegrafen zijn, na van den griffier ontvangen
      kennisgeving, verplicht, den curator de brieven, telegrammen en schriftelijk over te brengen telefoonberichten,
      voor den gefailleerde bestemd, af te geven, totdat de curator of de rechter-commissaris haar van die verplichting
      ontslaat of zij de kennisgeving ontvangen, bedoeld in [artikel 12][ref1].

      2 Protesten, exploiten, verklaringen en termijnstellingen, betreffende de boedel, geschieden door en aan de
      curator.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel12
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '12'
        afdeling: Eerste
  - number: '95'
    text: |-
      De curator is bevoegd naar omstandigheden eene door den rechter-commissaris vastgestelde som ter voorziening in het
      levensonderhoud van den gefailleerde en zijn huisgezin uit te keeren.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel95
  - number: '96'
    text: |-
      1 De curator is bevoegd goederen te vervreemden, indien en voor zoover de vervreemding noodzakelijk is ter
      bestrijding van de kosten van het faillissement, of de goederen niet dan met nadeel voor den boedel bewaard kunnen
      blijven.

      2 De bepaling van [artikel 169 vierde lid][ref1], is toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel169
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '169'
        afdeling: Zevende
  - number: '97'
    text: |-
      1 De curator houdt alle gelden, kleinoodiën, effecten en andere papieren van waarde onder zijne onmiddellijke
      bewaring, tenzij de rechter-commissaris daarvoor een andere wijze van bewaring bepaalt.

      2 Gereede gelden, welke voor het beheer niet noodig zijn, belegt de curator ten name van den boedel op de wijze
      door den rechter-commissaris goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel97
  - number: '98'
    text: |-
      Over gelden, kleinoodiën, effecten en andere papieren van waarde, welke, volgens bepaling van den rechter-
      commissaris, door een derde worden bewaard, en over belegde gelden mag de curator niet anders beschikken dan door
      middel van door den rechter-commissaris voor gezien geteekende stukken.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel98
  - number: '99'
    text: |-
      De curator is, na ingewonnen advies van de commissie uit de schuldeischers, zoo die er is, en onder goedkeuring van
      den rechter-commissaris, bevoegd vaststellingsovereenkomsten of schikkingen aan te gaan.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel99
  - number: '100'
    text: |-
      1 De gefailleerde is verplicht voor den rechter-commissaris, den curator of de commissie uit de schuldeischers te
      verschijnen en dezen alle inlichtingen te verschaffen, zoo dikwijls hij daartoe wordt opgeroepen.

      2 Bij faillissement van een in gemeenschap van goederen gehuwden echtgenoot rust de verplichting om inlichtingen te
      geven op ieder der echtgenooten voor zoover hij gehandeld heeft.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel100
  - number: '101'
    text: |-
      Bij het faillissement van eene naamloze vennootschap, besloten vennootschap, wederkeerige verzekerings- of
      waarborgmaatschappij of eenige andere, rechtspersoonlijkheid bezittende vereeniging of stichting zijn de bepalingen
      van de [artikelen 82 – 86][ref1] op de bestuurders, die van [artikel 100 eerste lid][ref2], op bestuurders en
      commissarissen toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel100
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '82'
        afdeling: Vierde
      - id: ref2
        bwb_id: BWBR0028917
        artikel: '100'
        afdeling: Vierde
  - number: '102'
    text: |-
      De griffier is verplicht aan elken schuldeischer op diens verzoek en op diens kosten afschrift te geven van de
      stukken, welke ingevolge eenige bepaling van dit besluit ter griffie worden nedergelegd of zich aldaar bevinden.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel102
  - number: '103'
    text: |-
      1 De rechter-commissaris bepaalt uiterlijk binnen veertien dagen nadat het vonnis van faillietverklaring in kracht
      van gewijsde is gegaan:

      1°. den dag, waarop uiterlijk de schuldvorderingen ingediend moeten worden;

      2°. dag, uur en plaats, waarop de verificatie-vergadering zal gehouden worden.

      2 Tusschen de dagen, onder 1e. en 2e. vermeld, moeten ten minste veertien dagen verloopen.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel103
  - number: '104'
    text: |-
      De curator geeft van deze beschikkingen onmiddellijk aan alle bekende schuldeischers bij brieven kennis, en doet
      daarvan aankondiging in het nieuwsblad, bedoeld in [artikel 11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel11
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '11'
        afdeling: Eerste
  - number: '105'
    text: |-
      1 De indiening van de schuldvorderingen geschiedt bij den curator door de overlegging van eene rekening of andere
      schriftelijke verklaring, aangevende den aard en het bedrag van de vordering, vergezeld van de bewijsstukken of een
      afschrift daarvan, en van opgave, of op voorrecht, pand, hypotheek of retentierecht aanspraak wordt gemaakt.

      2 De schuldeischers zijn bevoegd van den curator een ontvangbewijs te vorderen.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel105
  - number: '106'
    text: |-
      De curator toetst de ingezonden rekeningen aan de administratie en opgaven van den gefailleerde, treedt, als hij
      tegen de toelating van eene vordering bezwaar heeft, met den schuldeischer in overleg, en is bevoegd van dezen
      overlegging van ontbrekende stukken alsook inzage van zijne administratie en van de oorspronkelijke bewijsstukken
      te vorderen.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel106
  - number: '107'
    text: |-
      De curator brengt de vorderingen, welke hij goedkeurt, op eene lijst van voorloopig erkende schuldvorderingen, en
      de vorderingen, welke hij betwist op eene afzonderlijke lijst, vermeldende de gronden van betwisting.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel107
  - number: '108'
    text: |-
      1 In de lijsten, bedoeld in het [vorige artikel][ref1], wordt elke vordering omschreven en daarbij aangegeven, of
      zij naar de meening van den curator bevoorrecht of door pand of hypotheek gedekt is, dan wel of ter zake van de
      vordering retentierecht kan worden uitgeoefend.

      2 Betwist de curator alleen den voorrang of het retentierecht, zoo wordt de vordering op de lijst der voorloopig
      erkende schuldvorderingen gebracht met aanteekening van deze betwisting en de gronden daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel107
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '107'
        afdeling: Vijfde
  - number: '109'
    text: |-
      Van ieder der lijsten, in [artikel 107][ref1] bedoeld, legt de curator een afschrift neder ter griffie van het in
      [artikel 92][ref2] aangewezen gerecht in eersten aanleg, om aldaar gedurende de zeven aan de verificatievergadering
      voorafgaande dagen kosteloos ter inzage te liggen voor een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel92
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '107'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0028917
        artikel: '92'
        afdeling: Vierde
  - number: '110'
    text: |-
      Van de krachtens [artikel 109][ref1] gedane nederlegging der lijsten geeft de curator aan alle bekende
      schuldeischers schriftelijk bericht, waarbij hij eene nadere oproeping tot de verificatievergadering voegt en
      tevens vermeldt, of de gefailleerde een ontwerp-akkoord ter griffie heeft nedergelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel109
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '109'
        afdeling: Vijfde
  - number: '111'
    text: |-
      De gefailleerde woont de verificatie-vergadering in persoon bij, ten einde aldaar alle inlichtingen over de
      oorzaken van het faillissement en den staat van den boedel te geven, welke de rechter-commissaris van hem vraagt.
      De schuldeischers zijn bevoegd om den rechter-commissaris te verzoeken omtrent bepaalde door hen op te geven
      punten inlichtingen aan den gefailleerde te vragen. De vragen aan den gefailleerde gesteld en de door hem gegeven
      antwoorden worden in het proces-verbaal opgeteekend.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel111
  - number: '112'
    text: |-
      Bij het faillissement van eene naamlooze vennootschap, besloten vennootschap, wederkeerige verzekerings- of
      waarborg-maatschappij of eenige andere, rechtspersoonlijkheid bezittende, vereeniging of stichting, rust op de
      bestuurders de verplichting, in het [vorige artikel][ref1] den gefailleerde opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel111
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '111'
        afdeling: Vijfde
  - number: '113'
    text: |-
      De schuldeischers mogen ter vergadering verschijnen in persoon of bij gemachtigde. De schriftelijke volmacht is
      vrij van zegel en van de formaliteit van registratie.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel113
  - number: '114'
    text: |-
      1 Op de vergadering leest de rechter-commissaris de lijst van de voorloopig erkende en die van de door den curator
      betwiste schuldvorderingen voor. Ieder van de op de lijsten voorkomende schuldeischers is bevoegd, den curator
      omtrent elke vordering en haar plaatsing op een van de lijsten inlichtingen te vragen of wel hare juistheid, den
      beweerden voorrang of het beweerde retentierecht te betwisten, of te verklaren, dat hij zich bij de betwisting van
      den curator aansluit.

      2 De curator is bevoegd op de door hem gedane voorloopige erkenning of betwisting terug te komen, of wel te
      vorderen, dat de schuldeischer de deugdelijkheid van zijne noch door den curator, noch door een der schuldeischers
      betwiste schuldvordering onder eede bevestige; indien de oorspronkelijke schuldeischer overleden is, moeten zijne
      rechthebbenden onder eede verklaren, dat zij te goeder trouw gelooven dat de schuld bestaat en onvoldaan is.

      3 Bestaat er behoefte aan verdaging van de vergadering, dan wordt deze binnen acht dagen, op het door den rechter-
      commissaris aangewezen tijdstip, zonder nadere oproeping, voortgezet.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel114
  - number: '115'
    text: |-
      1 De eed, bedoeld in het tweede lid van het [vorige artikel][ref1], wordt in persoon of door een daartoe bijzonder
      gevolmachtigde afgelegd in handen van den rechter-commissaris, hetzij onmiddellijk op de vergadering, hetzij op een
      lateren door den rechter-commissaris daartoe bepaalden dag. De volmacht mag ondershands worden verleend.

      2 Indien de schuldeischer, aan wien de eed is opgedragen, niet ter vergadering aanwezig is, geeft de griffier hem
      onmiddellijk kennis van de eedsopdracht en van den voor de eedsaflegging bepaalden dag.

      3 De rechter-commissaris geeft den schuldeischer eene verklaring van de eedsaflegging, tenzij de eed wordt afgelegd
      in eene vergadering van schuldeischers, in welk geval van de aflegging aanteekening wordt gehouden in het proces-
      verbaal van die vergadering.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel114
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '114'
        afdeling: Vijfde
  - number: '116'
    text: |-
      1 De vorderingen, welke niet betwist worden, worden overgebracht op eene in het proces-verbaal opgenomen lijst van
      erkende schuldeischers. Op het papier aan order en aan toonder teekent de curator de erkenning aan.

      2 De schuldvorderingen, van welke de curator de beëediging heeft gevorderd, worden voorwaardelijk toegelaten,
      totdat door het al of niet afleggen van den eed op den bij het eerste lid van [artikel 115][ref1] bedoelden tijd
      over hare toelating definitief zal zijn beslist.

      3 Het proces-verbaal van de vergadering wordt onderteekend door den rechter-commissaris en den griffier.

      4 De in het proces-verbaal van de vergadering opgeteekende erkenning van eene vordering heeft in het faillissement
      kracht van gewijsde zaak. Alleen op grond van bedrog is de curator bevoegd, daarvan vernietiging te vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel115
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '115'
        afdeling: Vijfde
  - number: '117'
    text: |-
      1 De rechter-commissaris verwijst, in geval van betwisting, de partijen, zoo hij ze niet kan vereenigen en voor
      zoover het geschil niet reeds aanhangig is, naar eene door hem bepaalde terechtzitting van den rechter in eersten
      aanleg zonder dat daartoe eene oproeping wordt vereischt.

      2 Verschijnt de schuldeischer, die de verificatie vraagt, op de bepaalde terechtzitting niet, dan wordt hij
      geacht zijne aanvrage te hebben ingetrokken; verschijnt hij, die de betwisting doet, niet, dan wordt hij geacht de
      betwisting te laten varen en erkent de rechter in eersten aanleg de vordering.

      3 Schuldeischers, die ter verificatie-vergadering eene betwisting niet hebben gedaan, kunnen zich in het geding
      niet voegen noch tusschen komen.

      4 Van de uitspraak is hooger beroep op het Hof van Justitie toegelaten.

      5 Het geding in hooger beroep wordt alleen gevoerd tusschen hen, die in eersten aanleg partijen zijn geweest.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel117
  - number: '118'
    text: |-
      1 Wanneer de curator de betwisting heeft gedaan, wordt de loop van het rechtsgeding van rechtswege geschorst door
      het in kracht van gewijsde gaan van de homologatie van een akkoord in het faillissement, tenzij de stukken van het
      geding reeds tot het geven van eene beslissing aan den rechter zijn overgelegd, in welk geval de vordering, indien
      zij wordt erkend, geacht wordt in het faillissement erkend te zijn, terwijl ten aanzien van de beslissing omtrent
      de kosten van het geding de schuldenaar in de plaats treedt van den curator.

      2 De schuldenaar kan bij exploit verklaren, dat hij het rechtsgeding overneemt achtervolgens de laatste
      gedingstukken in plaats van den curator.

      3 Zoolang dit niet is geschied, heeft de wederpartij het recht den schuldenaar tot de overneming te dagvaarden.

      4 Verschijnt de schuldenaar niet, dan is [artikel 189 van het Wetboek van Burgerlijke Rechtsvordering BES][ref1]
      van toepassing.

      5 Wanneer de betwisting is gedaan door een medeschuldeischer, kan het geding, nadat de homologatie van een akkoord
      in het faillissement in kracht van gewijsde is gegaan, door partijen worden voortgezet uitsluitend ten einde den
      rechter te doen beslissen over de proceskosten.


      [ref1]: https://wetten.overheid.nl/BWBR0028496#Artikel189
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0028496
        artikel: '189'
  - number: '119'
    text: |-
      De schuldeischer, wiens vordering betwist wordt, is tot staving daarvan niet tot nader of meer bewijs gehouden, dan
      hij tegen den gefailleerde zelf zou moeten leveren.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel119
  - number: '120'
    text: |-
      1 Indien de schuldeischer, wiens vordering betwist wordt, niet ter vergadering aanwezig is, geeft de griffier hem
      onmiddellijk kennis van de gedane betwisting en verwijzing.

      2 De schuldeischer mag zich in het geding op het ontbreken van die kennisgeving niet beroepen.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel120
  - number: '121'
    text: |-
      De rechter-commissaris is bevoegd om vorderingen, welke betwist worden, voorwaardelijk toe te laten tot een door
      hem bepaald bedrag. Wanneer de voorrang betwist wordt, is de rechter-commissaris bevoegd dezen voorwaardelijk te
      erkennen.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel121
  - number: '122'
    text: |-
      1 Ook de gefailleerde is bevoegd om zich, onder summiere opgaaf van zijne gronden, tegen de toelating van eene
      vordering, hetzij voor het geheel, hetzij voor een gedeelte, of tegen de erkenning van den beweerden voorrang, te
      verzetten. In dit geval geschiedt in het proces-verbaal aanteekening van de betwisting en van hare gronden, zonder
      verwijzing van de partijen naar eene terechtzitting van het gerecht in eersten aanleg en zonder dat daardoor de
      erkenning van de vordering in het faillissement wordt verhinderd.

      2 Betwisting, waarvoor gronden niet worden opgegeven, of welke niet de geheele vordering omvat en toch niet
      uitdrukkelijk aanwijst, welk deel wordt erkend en welk deel betwist, wordt niet als betwisting aangemerkt.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel122
  - number: '123'
    text: |-
      1 Vorderingen, na afloop van den in [artikel 103, onder 1e.][ref1], genoemden termijn, doch uiterlijk twee dagen
      vóór den dag, waarop de verificatie-vergadering zal worden gehouden, bij den curator ingediend, worden op daartoe
      ter vergadering gedaan verzoek geverifieerd, indien noch de curator noch een der aanwezige schuldeischers daartegen
      bezwaar maakt.

      2 Daarna ingediende vorderingen worden niet geverifieerd.

      3 De bepalingen van het eerste en het tweede lid zijn niet toepasselijk, indien de schuldeischer niet in Bonaire,
      Sint Eustatius of Saba woont en daardoor verhinderd was zich eerder aan te melden.

      4 In geval van bezwaar, als in het eerste lid bedoeld of van geschil over het al dan niet aanwezig zijn
      van verhindering, als in het derde lid bedoeld, beslist de rechter-commissaris, na de vergadering te hebben
      geraadpleegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel103
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '103'
        afdeling: Vijfde
  - number: '124'
    text: |-
      Interesten na de faillietverklaring loopende, mogen niet geverifieerd worden, tenzij door pand of hypotheek gedekt.
      In dit geval worden zij pro memorie geverifieerd. Voor zooverre de interesten op de opbrengst van het onderpand
      niet batig gerangschikt worden, kan de schuldeischer uit deze verificatie rechten niet ontleenen.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel124
  - number: '125'
    text: |-
      1 Eene vordering onder eene ontbindende voorwaarde wordt voor het geheele bedrag geverifieerd, onverminderd de
      werking van de voorwaarde, wanneer zij vervuld wordt.

      2 Eene vordering onder eene opschortende voorwaarde kan geverifieerd worden voor hare waarde op het oogenblik der
      faillietverklaring. Indien de curator en de rechter-commissaris het niet eens kunnen worden over deze wijze van
      verificatie, wordt zoodanige vordering voor het volle bedrag voorwaardelijk toegelaten.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel125
  - number: '126'
    text: |-
      1 Eene vordering, waarvan het tijdstip der opeischbaarheid onzeker is, of welke recht geeft op periodieke
      uitkeeringen, wordt geverifieerd voor hare waarde op den dag der faillietverklaring.

      2 Alle schuldvorderingen, vervallende binnen één jaar na den dag, waarop het faillissement is aangevangen,
      worden behandeld, alsof zij op dat tijdstip opeischbaar waren. Alle later dan één jaar daarna vervallende
      schuldvorderingen worden geverifieerd voor de waarde, welke zij hebben na verloop van een jaar sedert den aanvang
      van het faillissement.

      3 Bij de berekening wordt uitsluitend gelet op het tijdstip en de wijze van aflossing, het kansgenot, waar dit
      bestaat, en, indien de vordering rentedragend is, op den bedongen rentevoet.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel126
  - number: '127'
    text: |-
      1 Schuldeisers wier vorderingen door pand, hypotheek of retentierecht gedekt of op een bepaald voorwerp bevoorrecht
      zijn, maar die kunnen aantonen dat een deel hunner vordering vermoedelijk niet batig gerangschikt zal kunnen
      worden op de opbrengst der verbonden goederen, kunnen verlangen dat hun voor dat deel de rechten van concurrente
      schuldeisers worden toegekend met behoud van hun recht van voorrang.

      2 Het bedrag waarvoor pand- en hypotheekhouders batig gerangschikt kunnen worden, wordt bepaald met inachtneming
      van [artikel 483e van het Wetboek van Burgerlijke Rechtsvordering BES][ref1], met dien verstande dat voor het
      tijdstip van het opmaken van de staat in de plaats treedt de aanvang van de dag waarop de faillietverklaring werd
      uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0028496#Artikel483e
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0028496
        artikel: 483e
  - number: '128'
    text: |-
      Vorderingen, waarvan de waarde onbepaald, onzeker, niet in in Bonaire, Sint Eustatius of Saba wettig gangbare munt
      of in het geheel niet in geld is uitgedrukt, worden geverifieerd voor hunnen geschatte waarde in in Bonaire, Sint
      Eustatius of Saba wettig gangbare munt.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel128
  - number: '129'
    text: |-
      Schuldvorderingen aan toonder mogen ten name van «toonder» geverifieerd worden. Iedere ten name van «toonder»
      geverifieerde vordering wordt als de vordering van een afzonderlijk schuldeischer beschouwd.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel129
  - number: '130'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel130
  - number: '131'
    text: |-
      1 Indien van hoofdelijke schuldenaren één of meer in staat van faillissement verkeeren, kan de schuldeischer in het
      faillissement van dien schuldenaar, onderscheidenlijk in het faillissement van ieder van die schuldenaren opkomen
      voor en betaling ontvangen over het geheele bedrag, hem ten tijde van de faillietverklaring nog verschuldigd,
      totdat zijne vordering ten volle zal zijn gekweten.

      2 Een hoofdelijke schuldenaar kan, zo nodig voorwaardelijk, worden toegelaten voor de bedragen waarvoor hij op
      de gefailleerde krachtens hun onderlinge rechtsverhouding als hoofdelijke medeschuldenaren een vordering heeft
      verkregen of zal verkrijgen. De toelating geschiedt echter slechts:

      a. voor zover de schuldeiser daarvoor zelf niet kan opkomen of, hoewel hij zulks kan, niet opkomt;

      b. voor het geval de schuldeiser gedurende het faillissement voor het gehele bedrag waarvoor hij is opgekomen,
      wordt voldaan;

      c. voor zover om een andere reden de toelating geen voor de concurrente schuldeisers nadelige invloed heeft op de
      aan hen uit te keren percenten.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel131
  - number: '132'
    text: |-
      1 Na afloop van de verificatie brengt de curator verslag uit over den stand van den boedel en geeft daaromtrent
      alle door de schuldeischers verlangde inlichtingen. Het verslag wordt, met het proces-verbaal van de verificatie-
      vergadering, na afloop van de vergadering ter griffie nedergelegd ter kostelooze inzage van iedere belanghebbende.

      2 Zoowel de curator, als de schuldeischers en de gefailleerde mogen na de nederlegging van het proces-verbaal aan
      den rechter in eersten aanleg verbetering daarvan verzoeken, indien uit de stukken zelve blijkt dat in het proces-
      verbaal eene vergissing is geslopen.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel132
  - number: '133'
    text: De gefailleerde is bevoegd aan zijne gezamenlijke schuldeischers een akkoord aan te bieden.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel133
  - number: '134'
    text: |-
      1 Indien de gefailleerde een ontwerp van akkoord, ten minste acht dagen vóór de vergadering tot verificatie van de
      schuldvorderingen, ter plaatse in [artikel 92][ref1] aangewezen heeft nedergelegd, ter kostelooze inzage van een
      ieder, wordt daarover in die vergadering na afloop van de verificatie dadelijk geraadpleegd en beslist, behoudens
      de bepaling van [artikel 136][ref2].

      2 Een afschrift van het ontwerp van akkoord moet, gelijktijdig met de nederlegging ter griffie, worden toegezonden
      aan den curator en aan ieder der leden van de voorloopige commissie uit de schuldeischers.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel92
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel136
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '92'
        afdeling: Vierde
      - id: ref2
        bwb_id: BWBR0028917
        artikel: '136'
        afdeling: Zesde
  - number: '135'
    text: |-
      De curator en de commissie uit de schuldeischers zijn verplicht ieder afzonderlijk ter vergadering een schriftelijk
      advies over het aangeboden akkoord te geven.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel135
  - number: '136'
    text: |-
      De raadpleging en beslissing worden tot eene volgende door den rechter-commissaris op ten hoogste drie weken later
      bepaalde vergadering uitgesteld:

      1°. indien staande de vergadering eene definitieve commissie uit de schuldeischers is benoemd, niet bestaande uit
      dezelfde personen als de voorloopige, en de meerderheid van de verschenen schuldeischers van haar een schriftelijk
      advies over het aangeboden akkoord verlangt;

      2°. indien het ontwerp van akkoord niet tijdig ter griffie is nedergelegd en de meerderheid van de verschenen
      schuldeischers zich vóór uitstel verklaart.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel136
  - number: '137'
    text: |-
      Wanneer de raadpleging en de stemming over het akkoord, ingevolge de bepalingen van het voorgaande artikel,
      worden uitgesteld tot eene nadere vergadering, geeft de curator daarvan onverwijld aan de niet op de verificatie-
      vergadering verschenen, erkende of voorwaardelijk toegelaten schuldeischers kennis bij brieven, vermeldende den
      summieren inhoud van het akkoord.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel137
  - number: '138'
    text: |-
      1 Van de stemming over het akkoord zijn uitgesloten de schuldeisers aan wier vordering voorrang verbonden is,
      daaronder begrepen degenen wier voorrang betwist wordt, tenzij zij, vóór de aanvang der stemming, van hun voorrang
      ten behoeve van de boedel afstand hebben gedaan.

      2 Deze afstand maakt hen tot concurrente schuldeischers, ook voor het geval het akkoord niet mocht worden
      aangenomen.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel138
  - number: '139'
    text: |-
      De gefailleerde is bevoegd tot toelichting en verdediging van het akkoord op te treden en het, staande de
      raadpleging, te wijzigen.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel139
  - number: '140'
    text: |-
      Tot het aannemen van het akkoord wordt vereist de toestemming van twee derden van de erkende en de voorwaardelijk
      toegelaten concurrente schuldeisers, die drie vierden van het bedrag van de door geen voorrang gedekte erkende en
      voorwaardelijk toegelaten schuldvorderingen vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel140
  - number: '141'
    text: |-
      Indien twee derde van de ter vergadering verschenen schuldeischers, meer dan de helft van het gezamenlijk
      bedrag van de schuldvorderingen, waarvoor stemrecht mag worden uitgeoefend, vertegenwoordigende, in het akkoord
      bewilligen, wordt ten hoogste acht dagen later eene tweede stemming gehouden, zonder dat daartoe eene nadere
      oproeping vereischt wordt. Bij deze stemming is niemand gebonden aan zijne de eerste maal uitgebrachte stem.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel141
  - number: '142'
    text: |-
      Latere veranderingen, in het getal van de schuldeischers of in het bedrag van de vorderingen, zijn niet van invloed
      op de geldigheid van de aanneming of de verwerping van het akkoord.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel142
  - number: '143'
    text: |-
      1 Het proces-verbaal van de vergadering vermeldt den inhoud van het akkoord, de namen van de verschenen
      stemgerechtigde schuldeischers, de door ieder hunner uitgebrachte stem, den uitslag van de stemming en al wat
      verder op de vergadering is voorgevallen. Het wordt onderteekend door den rechter-commissaris en den griffier.

      2 Gedurende acht dagen kan een ieder ter griffie kosteloos inzage van het proces-verbaal verkrijgen.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel143
  - number: '144'
    text: |-
      1 Zoowel de schuldeischers, die vóór gestemd hebben, als de gefailleerde, mogen gedurende acht dagen na afloop van
      de vergadering aan het Hof van Justitie verbetering van het proces-verbaal verzoeken, indien uit de stukken zelve
      blijkt, dat de rechter-commissaris het akkoord ten onrechte als verworpen heeft beschouwd.

      2 Het verzoek wordt bij den rechter-commissaris ingediend, die het, vergezeld van zijn schriftelijk bericht, zoo
      spoedig mogelijk aan het Hof van Justitie verzendt.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel144
  - number: '145'
    text: |-
      1 Indien het akkoord is aangenomen, bepaald de rechter-commissaris vóór het sluiten van de vergadering de
      terechtzitting, waarop de rechter in eersten aanleg de homologatie zal behandelen.

      2 Bij toepassing van [artikel 144][ref1] bepaalt de rechter-commissaris de terechtzitting zoo spoedig mogelijk na
      ontvangst van de beschikking van het Hof. Van deze bepaling geeft de curator aan de schuldeischers schriftelijk
      kennis.

      3 De terechtzitting wordt gehouden ten minste acht en ten hoogste veertien dagen na de stemming over het akkoord
      of, bij toepassing van [artikel 144][ref2], na de ontvangst van de beschikking van het Hof.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel144
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel144
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel145
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '144'
        afdeling: Zesde
      - id: ref2
        bwb_id: BWBR0028917
        artikel: '144'
        afdeling: Zesde
  - number: '146'
    text: |-
      1 Gedurende dien tijd mogen de schuldeischers aan den rechter-commissaris schriftelijk de redenen opgeven waarom
      zij weigering van de homologatie wenschelijk achten.

      2 De rechter-commissaris brengt aan de rechter in eerste aanleg, die de homologatie zal behandelen, een
      schriftelijk rapport uit.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel146
  - number: '147'
    text: |-
      1 Op den bepaalden dag leest de griffier ter openbare terechtzitting het in [artikel 143][ref1] bedoelde proces-
      verbaal voor en mag ieder der schuldeischers in persoon of bij gemachtigde de gronden uiteenzetten, waarop hij de
      homologatie wenscht of haar bestrijdt.

      2 De rechter in eersten aanleg weigert de homologatie:

      1°. indien de baten des boedels, de bij het akkoord bedongen som aanmerkelijk ten boven gaan;

      2°. indien de nakoming van het akkoord niet voldoende is gewaarborgd;

      3°. indien het akkoord door bedrog, door begunstiging van één of meer schuldeischers of met behulp van andere
      oneerlijke middelen is tot stand gekomen, onverschillig of de gefailleerde dan wel een ander daartoe heeft
      medegewerkt.

      3 De rechter in eersten aanleg mag ook op andere gronden en ook ambtshalve de homologatie weigeren.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel143
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '143'
        afdeling: Zesde
  - number: 148a
    text: |-
      Binnen acht dagen na de beschikking van de rechter in eerste aanleg kunnen, zo de homologatie is geweigerd, zowel
      de schuldeisers die voor het akkoord stemden als de gefailleerde, zo de homologatie is toegestaan, de schuldeisers
      die tegenstemden of bij de stemming afwezig waren, tegen die beschikking in hoger beroep komen. In het laatste
      geval hebben ook de schuldeisers, die vóór stemden, ditzelfde recht, doch alleen op grond van het ontdekken na de
      homologatie van handelingen als in artikel 148, 2de lid, sub 3 e genoemd.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel148a
  - number: 148b
    text: |-
      1 Het hoger beroep geschiedt bij een verzoekschrift, in te dienen ter griffie van het gerecht in eerste aanleg,
      in het openbaar lichaam Bonaire, Sint Eustatius of Saba, waar de beschikking genomen werd, welk verzoekschrift,
      voorzien van een aantekening van de griffier omtrent de datum van indiening daarvan, met de overige tot de zaak
      betrekkelijke stukken, waaronder het van de behandeling der homologatie in eerste aanleg opgemaakt proces-verbaal
      en van de beroepen beschikking, door de griffier onverwijld aan het Hof wordt gezonden. De voorzitter van het Hof
      bepaalt terstond dag en uur voor de behandeling, welke zal moeten plaats hebben binnen twintig dagen.

      2 Op de behandeling van het hoger beroep zijn [artikel 147][ref1] en artikel 148, eerste lid, toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel147
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel148b
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '147'
        afdeling: Zesde
  - number: '149'
    text: |-
      Het gehomologeerde akkoord is verbindend voor alle geen voorrang hebbende schuldeisers, onverschillig of zij al dan
      niet in het faillissement opgekomen zijn.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel149
  - number: '150'
    text: |-
      Na verwerping of weigering van de homologatie van het akkoord mag de gefailleerde in hetzelfde faillissement een
      akkoord niet meer aanbieden.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel150
  - number: '151'
    text: |-
      Het in kracht van gewijsde gegaan vonnis van homologatie levert, in verband met het proces-verbaal van de
      verificatie, ten behoeve van de erkende vorderingen, voor zoover zij niet door den gefailleerde overeenkomstig
      [artikel 22][ref1] betwist zijn, een voor tenuitvoerlegging vatbaren titel op tegen den schuldenaar en de tot het
      akkoord als borgen toegetreden personen.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel22
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel151
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '22'
        afdeling: Tweede
  - number: '152'
    text: |-
      Niettegenstaande het akkoord behouden de schuldeischers al hunne rechten tegen de borgen en andere mede-
      schuldenaren van den schuldenaar. De rechten, welke zij op goederen van derden kunnen uitoefenen, blijven bestaan
      als ware geen akkoord tot stand gekomen.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel152
  - number: '153'
    text: Zodra de homologatie van het accoord in kracht van gewijsde is gegaan, eindigt het faillissement.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel153
  - number: '154'
    text: |-
      1 Nadat de homologatie in kracht van gewijsde is gegaan is de curator verplicht, ten overstaan van den rechter-
      commissaris rekening en verantwoording aan den schuldenaar te doen.

      2 Indien bij het akkoord deswege niet anders is bepaald, geeft de curator aan den schuldenaar tegen behoorlijke
      kwijting af alle tot den boedel behoorende zaken, gelden, boeken, papieren en andere gegevensdragers.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel154
  - number: '155'
    text: |-
      1 Het bedrag, waarop geverifieerde schuldeischers, krachtens een erkend voorrecht, aanspraak kunnen maken, alsmede
      de kosten van het faillissement moeten in handen van den curator worden gestort, tenzij de schuldenaar deswege
      zekerheid stelt. Zoolang hieraan niet is voldaan, is de curator verplicht alle tot den boedel behoorende goederen
      en gelden onder zich te houden, totdat dit bedrag en de bedoelde kosten aan de daarop rechthebbenden zijn voldaan.

      2 Wanneer na het in kracht van gewijsde gaan van het vonnis van homologatie ééne maand is verloopen, zonder dat
      van wege den schuldenaar de voldoening van een en ander is geschied, gaat de curator daartoe over uit de voorhanden
      baten des boedels.

      3 Het bedrag in het eerste lid bedoeld, en het deel daarvan, aan ieder schuldeischer krachtens zijn recht van
      voorrang toe te kennen, wordt desnoodig door den rechter-commissaris begroot.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel155
  - number: '156'
    text: |-
      Voor zooveel betreft vorderingen, waarvan het voorrecht voorwaardelijk erkend is, bepaalt de in het
      [vorige artikel][ref1] bedoelde verplichting van den schuldenaar zich tot het stellen van zekerheid en is de
      curator bij gebreke daarvan slechts gehouden tot het reserveeren uit de baten des boedels van het bedrag, waarop
      het voorrecht aanspraak geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel155
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '155'
        afdeling: Zesde
  - number: '157'
    text: |-
      1 Elke schuldeischer, jegens wien de schuldenaar in gebreke blijft aan den inhoud daarvan te voldoen, is bevoegd om
      ontbinding van het gehomologeerde akkoord te vorderen.

      2 Op den schuldenaar rust het bewijs, dat aan het akkoord is voldaan.

      3 De rechter is, ook ambtshalve, bevoegd om den schuldenaar uitstel van ten hoogste ééne maand te verleenen, ten
      einde alsnog aan zijne verplichtingen te voldoen.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel157
  - number: '158'
    text: |-
      De vordering tot ontbinding van het akkoord wordt op dezelfde wijze aangebracht en beslist, als ten aanzien van het
      verzoek tot faillietverklaring in de [artikelen 4][ref1], [5][ref2], [6][ref3] en [7][ref4] is voorgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0028917#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0028917#Artikel7
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '4'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0028917
        artikel: '5'
        afdeling: Eerste
      - id: ref3
        bwb_id: BWBR0028917
        artikel: '6'
        afdeling: Eerste
      - id: ref4
        bwb_id: BWBR0028917
        artikel: '7'
        afdeling: Eerste
  - number: '159'
    text: |-
      1 In het vonnis, waarbij de ontbinding van het akkoord wordt uitgesproken, wordt tevens heropening van het
      faillissement bevolen met benoeming van een curator, alsmede van eene commissie uit de schuldeischers indien er in
      het faillissement reeds eene geweest is.

      2 Bij voorkeur worden daartoe de personen gekozen, die vroeger in het faillissement die betrekkingen hebben
      waargenomen.

      3 De curator draagt zorg voor de bekendmaking van het vonnis op de wijze in [artikel 11, vierde lid][ref1],
      voorgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel11
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel159
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '11'
        afdeling: Eerste
  - number: '160'
    text: |-
      1 De [artikelen 10 eerste lid][ref1], [11 eerste lid][ref2][12–15 ][ref3]en die, welke vervat zijn in de
      [tweede][ref4], [derde][ref5] en [vierde afdeeling][ref6] van dezen titel, zijn bij heropening van het faillisement
      toepasselijk.

      2 Evenzoo zijn toepasselijk de bepalingen van de afdeeling over de verificatie van schuldvorderingen, behoudens
      deze wijziging, dat de verificatie beperkt blijft tot de schuldvorderingen, welke niet reeds vroeger geverifieerd
      werden.

      3 Niettemin worden ook de reeds geverifieerde schuldeischers tot bijwoning van de verificatievergadering opgeroepen
      en hebben zij het recht de vorderingen, waarvoor toelating verzocht werd, te betwisten.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0028917#Artikel12
