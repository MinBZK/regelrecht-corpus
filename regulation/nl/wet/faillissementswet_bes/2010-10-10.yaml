        artikel: '13'
        afdeling: Eerste
  - number: '12'
    text: |-
      1 Zoodra een vonnis van faillietverklaring tengevolge van verzet of hooger beroep is vernietigd, en in het eerste
      geval de termijn om in hooger beroep te komen, verstreken is, zonder dat daarvan gebruik is gemaakt, geeft de
      griffier van het gerecht, welks rechter de vernietiging heeft uitgesproken, van die uitspraak kennis aan den
      curator en aan de administratiën der posterijen, der telefonen en der telegrafen. De curator doet van die uitspraak
      aankondiging in het in [artikel 11][ref1] bedoelde blad.

      2 Gelijke kennisgeving geschiedt, in geval van vernietiging van een vonnis van faillietverklaring in hoger beroep,
      aan de griffier van het gerecht in eerste aanleg, in het openbaar lichaam Bonaire, Sint Eustatius of Saba, waar het
      vonnis is gewezen.

      3 De rechter, die de vernietiging van een vonnis van faillietverklaring uitspreekt, stelt tevens het bedrag vast
      van de faillissementskosten en van het salaris des curators. Hij brengt dit bedrag ten laste van dengene, die de
      faillietverklaring heeft aangevraagd, van den schuldenaar, of van beide in de door den rechter bepaalde verhouding.
      Tegen deze beslissing staat een rechtsmiddel niet open. Een bevelschrift van tenuitvoerlegging wordt daarvan
      uitgegeven ten behoeve van den curator.


