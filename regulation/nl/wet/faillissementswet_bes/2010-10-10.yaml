  - number: '8'
    text: |-
      1 Elke schuldeiser, met uitzondering van hem, die de faillietverklaring heeft verzocht en elke belanghebbende heeft
      tegen de faillietverklaring recht van verzet gedurende acht dagen na de dag van de uitspraak. Indien hij tijdens de
      uitspraak zich niet in de openbare lichamen Bonaire, Sint Eustatius of Saba bevindt, heeft hij gedurende veertien
      dagen dat recht.

      2 Het verzet geschiedt door indiening van een verzoekschrift ter griffie van het gerecht in eerste aanleg in het
      openbaar lichaam Bonaire, Sint Eustatius of Saba, waar de faillietverklaring werd uitgesproken.

      3 De rechter in eersten aanleg bepaald terstond dag en uur voor de behandeling. De griffier geeft dengene die het
      verzet gedaan heeft, daarvan bij brief kennis. Uiterlijk op den vierden dag, volgende op dien waarop het verzoek
      is ingediend, wordt op last van den rechter in eersten aanleg van het gedane verzet, alsmede van den tijd voor de
      behandeling bepaald, bij deurwaardersexploot kennis gegeven aan den schuldenaar en, indien de faillietverklaring
      door een schuldeischer is verzocht, ook aan dezen.

      4 Deze kennisgeving geldt voor oproeping van den schuldenaar en van dien schuldeischer.

      5 De behandeling geschiedt op de wijze bij [artikel 4][ref1] voorgeschreven.


