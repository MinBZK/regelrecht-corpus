  - number: '65'
    text: |-
      1 Ieder der schuldeischers, de commissie uit hun midden benoemd en ook de gefailleerde mogen bij verzoekschrift
      tegen elke handeling van den curator bij den rechter-commissaris opkomen, of van dezen een bevel uitlokken, dat de
      curator eene bepaalde handeling verrichte of eene voorgenomen handeling nalate.

      2 De rechter-commissaris beslist, na den curator gehoord te hebben, binnen drie dagen.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel65
  - number: '66'
    text: |-
      1 Indien meer dan één curator benoemd is, wordt voor de geldigheid van hunne handelingen toestemming van de
      meerderheid of bij staking van stemmen eene beslissing van den rechter-commissaris vereischt.

      2 De curator, aan wien bij het vonnis van faillietverklaring een bepaalde werkkring is aangewezen, is binnen de
      grenzen daarvan zelfstandig tot handelen bevoegd.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel66
  - number: '67'
    text: |-
      1 Onverminderd het bepaalde in het derde lid van [artikel 12][ref1], stelt de rechter-commissaris het salaris van
      den curator in elk faillissement vast.

      2 Ingeval van akkoord wordt het salaris bij het vonnis van homologatie bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel12
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel67
