  - number: '238'
    text: |-
      1 Indien de faillietverklaring wordt uitgesproken ingevolge eene der bepalingen van dezen titel of wel binnen ééne
      maand na het einde der surséance, gelden de volgende regelen:

      1°. het tijdstip, waarop de termijnen, in de [artikelen 39][ref1] en [41][ref2] vermeld, aanvangen, wordt berekend
      van den aanvang der surséance af;

      2°. de curator oefent de bevoegdheid uit, in het eerste lid van [artikel 218][ref3] aan de bewindvoerders
      toegekend;

      3°. handelingen, door den schuldenaar met medewerking, machtiging of bijstand van de bewindvoerders verricht,
      worden beschouwd als handelingen van den curator en boedelschulden, gedurende de surséance ontstaan, zullen ook in
      het faillissement als boedelschulden gelden;

      4°. de boedel is niet aansprakelijk voor verbintenissen van den schuldenaar, zonder medewerking, machtiging of
      bijstand van de bewindvoerders gedurende de surséance ontstaan, dan voor zooverre deze ten gevolge daarvan gebaat
      is.

      2 Is opnieuw surséance verzocht, binnen eene maand na afloop van eene vroeger verleende, dan geldt hetgeen in het
      eerste lid is bepaald mede voor het tijdvak der eerstvolgende surséance.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0028917#Artikel218
