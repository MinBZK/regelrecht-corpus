  - number: '161'
    text: |-
      De handelingen, door den schuldenaar in den tijd tusschen de homologatie van het akkoord en de
      heropening van het faillissement verricht, zijn voor den boedel verbindend, behoudens de toepassing van
      [artikel 38 en volgende][ref1], zoo daartoe gronden zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel38
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel161
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '38'
        afdeling: Tweede
  - number: '162'
    text: |-
      1 Na de heropening van het faillissement mag niet opnieuw een akkoord worden aangeboden.

      2 De curator gaat zonder verwijl tot de vereffening over.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel162
  - number: '163'
    text: |-
      1 Indien tijdens de heropening jegens eenige schuldeischers reeds geheel of gedeeltelijk aan het akkoord is
      voldaan, worden bij de verdeeling aan de nieuwe schuldeischers en diegene onder de oude, die nog geene voldoening
      ontvingen, de bij het akkoord toegezegde percenten, en wordt aan hen, die gedeeltelijk betaling ontvingen, hetgeen
      aan het toegezegde bedrag nog ontbreekt, vooruitbetaald.

      2 In hetgeen alsdan nog overschiet deelen alle schuldeischers, zoo oude als nieuwe, gelijkelijk.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel163
  - number: '164'
    text: |-
      Het [vorige artikel][ref1] is eveneens toepasselijk, indien de boedel van den schuldenaar, terwijl deze nog niet
      volledig aan het akkoord heeft voldaan, opnieuw in staat van faillissement wordt verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel163
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '163'
        afdeling: Zesde
  - number: '165'
    text: |-
      1 Indien op de verificatie-vergadering een akkoord niet is aangeboden of indien het aangeboden akkoord verworpen of
      de homologatie definitief geweigerd is, verkeert de boedel van rechtswege in staat van insolventie.

      2 De [artikelen 93][ref1] en [95][ref2] houden op van toepassing te zijn, wanneer vast staat, dat het bedrijf van
      den gefailleerde niet overeenkomstig de volgende artikelen zal worden voortgezet of wanneer de voortzetting wordt
      gestaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel95
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel165
