  - number: '40'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel40
  - number: '41'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel41
  - number: '42'
    text: |-
      In geval van benadeling door een rechtshandeling om niet, die de schuldenaar heeft verricht binnen één jaar vóór de
      faillietverklaring, wordt vermoed, dat hij wist of behoorde te weten dat benadeling van de schuldeisers het gevolg
      van de rechtshandeling zou zijn.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel42
  - number: '43'
    text: |-
      De voldoening door de schuldenaar aan een opeisbare schuld wordt alleen dan vernietigd, indien is aangetoond,
      hetzij dat hij die de betaling ontving, wist dat het faillissement van de schuldenaar reeds aangevraagd was, hetzij
      dat de betaling het gevolg was van overleg tussen de schuldenaar en de schuldeiser, dat ten doel had laatstgenoemde
      door die betaling boven andere schuldeisers te begunstigen.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel43
  - number: '44'
    text: |-
      1 Krachtens het [vorige artikel][ref1] kan terugvordering niet geschieden van hem, die als houder van een papier
      aan order of toonder, uit hoofde van zijne rechtsverhouding tot vroegere houders, tot aanneming van de betaling
      verplicht was.

      2 In dit geval is hij, te wiens bate het papier is uitgegeven, verplicht de door den schuldenaar betaalde som
      aan den boedel terug te geven, wanneer wordt aangetoond, hetzij dat hij bij de uitgifte van het papier de in het
      [vorige artikel][ref2] genoemde wetenschap bezat, hetzij dat de uitgifte het gevolg was van een overleg als in dat
      artikel bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel43
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel44
