        afdeling: Vijfde
      - id: ref3
        bwb_id: BWBR0028917
        artikel: '131'
        afdeling: Vijfde
  - number: '250'
    text: |-
      1 Eene vordering onder eene opschortende voorwaarde kan op de lijst gebracht worden voor hare waarde bij den
      aanvang der surséance.

      2 Indien de bewindvoerders en de schuldeischers het niet eens kunnen worden over deze waardebepaling, wordt
      zoodanige vordering voor het volle bedrag voorwaardelijk toegelaten.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel250
  - number: '251'
    text: |-
      1 Eene vordering, waarvan het tijdstip der opeischbaarheid onzeker is, of welke recht geeft op periodieke
      uitkeeringen, wordt op de lijst gebracht voor hare waarde bij den aanvang der surséance.

      2 Alle schuldvorderingen, vervallende binnen één jaar na den aanvang der surséance, worden behandeld, alsof zij
      op dat tijdstip opeischbaar waren. Alle later dan één jaar daarna vervallende schuldvorderingen worden op de lijst
      gebracht voor de waarde, die zij hebben na verloop van een jaar na dat tijdstip.

      3 Bij de berekening wordt uitsluitend gelet op het tijdstip en de wijze van aflossing, het kansgenot, waar dit
      bestaat, en, indien de vordering rentedragend is, op den bedongen rentevoet.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel251
  - number: '252'
    text: |-
      1 Van de in [artikel 248][ref1] bedoelde lijst wordt een afschrift door de bewindvoerders ter griffie van het
      gerecht in eersten aanleg nedergelegd, om aldaar gedurende de zeven dagen voorafgaande aan de vergadering, in
      [artikel 244][ref2] bedoeld, kosteloos ter inzage te liggen voor een ieder.

      2 De nederlegging geschiedt kosteloos.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel248
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel244
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel252
