        artikel: '74'
        paragraaf: '3'
        afdeling: Derde
  - number: '69'
    text: |-
      1 De rechter-commissaris heeft de bevoegdheid den curator te allen tijde, na hem gehoord of behoorlijk opgeroepen
      te hebben, te ontslaan en door een ander te vervangen, of hem één of meer mede curators toe te voegen, een en ander
      ambtshalve of op een met redenen omkleed verzoek van één of meer schuldeischers, van de commissie uit hun midden,
      of van den gefailleerde.

      2 De ontslagen curator legt rekening en verantwoording van zijn beheer af aan den in zijne plaats benoemden
      curator.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel69
  - number: '70'
    text: |-
      1 Bij het vonnis van faillietverklaring kan de rechter in eersten aanleg of, zoolang over de benoeming van de in
      het volgende artikel genoemde commissie eene beslissing nog niet is genomen, kan de rechter-commissaris, zoo de
      belangrijkheid of de aard des boedels daartoe aanleiding geeft, uit de aan het gerecht bekende schuldeischers eene
      voorloopige commissie van een tot drie leden benoemen, ten einde den curator van advies te dienen.

      2 Indien een lid van de voorloopige commissie zijne benoeming niet aanneemt, bedankt of overlijdt, voorziet
      de rechter-commissaris op de verificatie-vergadering de schuldeischers, na afloop van de verificatie, over de
      benoeming van eene definitieve commissie uit hun midden. Zoo de vergadering deze wenschelijk acht, gaat hij
      dadelijk tot de benoeming over. Ook deze commissie bestaat uit een tot drie leden.

      3 Een verslag van het hieromtrent verhandelde wordt in het proces-verbaal der vergadering opgenomen.

      4 Indien een lid van de definitieve commissie zijne benoeming niet aanneemt, bedankt of overlijdt, voorziet de
      rechter-commissaris in de daardoor ontstane vacature.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel70
  - number: '72'
    text: |-
      De commissie is bevoegd om te allen tijde raadpleging te vorderen van het op het faillissement betrekking hebbende
      boeken, bescheiden en andere gegevevensdragers. De curator is verplicht aan de commissie alle van hem verlangde
      inlichtingen te verstrekken.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel72
  - number: '73'
    text: |-
      Tot het inwinnen van het advies der commissie vergadert de curator met haar, zoo dikwijls hij het noodig acht. In
      deze vergaderingen zit hij voor en voert hij de pen.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel73
  - number: '74'
    text: |-
      1 De curator is verplicht het advies der commissie in te winnen, alvorens een rechtsvordering in te stellen of eene
      aanhangige voort te zetten of zich tegen eene ingestelde of aanhangige rechtsvordering te verdedigen, behalve waar
      het geldt verificatiegeschillen; omtrent het al of niet voortzetten van het bedrijf des gefailleerden; alsmede in
      de gevallen van de [artikelen 33][ref1], [35][ref2], [36][ref3] en [54 tweede lid][ref4], [69 tweede lid][ref5],
      [95][ref6], [96][ref7], [169 derde en laatste lid][ref8], en in het algemeen omtrent de wijze van vereffening en
      tegeldemaking van den boedel en het tijdstip en het bedrag van de te houden uitdeelingen.

      2 Dit advies wordt niet vereischt, wanneer de curator de commissie tot het uitbrengen daarvan, met inachtneming van
      een bekwamen termijn, ter vergadering heeft opgeroepen en een advies niet wordt uitgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel35
