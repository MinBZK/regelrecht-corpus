  - number: '1'
    text: |-
      1 De schuldenaar, die in den toestand verkeert dat hij heeft opgehouden te betalen, wordt, hetzij op eigen
      aangifte, hetzij op verzoek van een of meer zijner schuldeischers, bij rechterlijk vonnis in staat van
      faillissement verklaard.

      2 De faillietverklaring kan ook worden uitgesproken om redenen van openbaar belang, op de vordering van het
      Openbaar Ministerie.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel1
  - number: '2'
    text: |-
      1 De faillietverklaring geschiedt door de rechter in eerste aanleg. Deze is daartoe bevoegd, indien:

      a. de schuldenaar in de openbare lichamen Bonaire, Sint Eustatius of Saba zijn woonplaats heeft, of, aldaar
      woonplaats gehad hebbend, met achterlating van schulden zich buiten de openbare lichamen Bonaire, Sint Eustatius of
      Saba heeft begeven;

      b. de schuldenaar, in de openbare lichamen Bonaire, Sint Eustatius of Saba geen woonplaats hebbend, aldaar een
      beroep of bedrijf uitoefent.

      2 De aangifte, het verzoek of de vordering daartoe moet worden ingediend ter griffie van het gerecht in eerste
      aanleg in het openbaar lichaam Bonaire, Sint Eustatius of Saba, waar de schuldenaar zijn woonplaats heeft of
      laatstelijk gehad heeft, dan wel in het geval omschreven in lid 1 sub b, waar hij een kantoor heeft.

      3 Ten aanzien van vennoten onder een firma kan de indiening ook geschieden in het openbaar lichaam Bonaire, Sint
      Eustatius of Saba, waar het kantoor der vennootschap is gevestigd.

      4 Wordt in de gevallen bedoeld bij het tweede of derde lid of in het geval bedoeld bij [artikel 3][ref1] bij meer
      dan één uitspraak op verschillende dagen de faillietverklaring uitgesproken, dan heeft alleen de eerst gedane
      uitspraak rechtsgevolgen. Hebben de uitspraken op dezelfde dag plaats, dan heeft alleen de uitspraak op het
      verzoek, ingediend in het openbaar lichaam Bonaire, en bij gebreke daarvan het verzoek, ingediend in het openbaar
      lichaam Sint Eustatius, rechtsgevolgen.

      5 Ten aanzien van naamloze vennootschappen, besloten vennootschappen, wederkerige verzekerings- of
      waarborgmaatschappijen, of enige andere, rechtspersoonlijkheid bezittende, verenigingen en van stichtingen geldt,
      ter toepassing van dit artikel, het openbaar lichaam, waar zij haar zetel hebben, als woonplaats.


