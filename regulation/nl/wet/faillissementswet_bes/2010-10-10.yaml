      - id: ref1
        bwb_id: BWBR0028917
        artikel: '248'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0028917
        artikel: '244'
        afdeling: Tweede
  - number: '253'
    text: |-
      1 De rechter in eersten aanleg kan, op verzoek van de bewindvoerders of ambtshalve, de raadpleging en stemming over
      het akkoord tot een lateren dag uitstellen.

      2 [Artikel 245][ref1] vindt alsdan overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel245
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel253
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '245'
        afdeling: Tweede
  - number: '254'
    text: |-
      1 Ter vergadering brengen zoowel de bewindvoerders als de deskundigen, zoo die er zijn, schriftelijk verslag uit
      over het aangeboden akkoord. [Artikel 139][ref1] vindt overeenkomstige toepassing.

      2 Vorderingen, na afloop van den in [artikel 244][ref2], 1e., genoemden termijn, doch uiterlijk twee dagen vóór den
      dag, waarop de vergadering zal worden gehouden, bij de bewindvoerders ingediend, worden op daartoe ter vergadering
      gedaan verzoek op de lijst geplaatst, indien noch de bewindvoerders, noch een der aanwezige schuldeischers
      daartegen bezwaar maken.

      3 Vorderingen, daarna ingediend, worden niet op de lijst geplaatst.

      4 De bepalingen van de twee voorgaande leden zijn niet toepasselijk, indien de schuldeischer buiten Bonaire, Sint
      Eustatius of Saba woont en daardoor verhinderd was zich eerder aan te melden.

      5 In geval van bezwaar, als in het tweede lid bedoeld, of van geschil over het al of niet aanwezig zijn der
      verhindering, in het vierde lid bedoeld, beslist de rechter in eersten aanleg, na de vergadering te hebben
      geraadpleegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel139
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel244
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel254
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '139'
        afdeling: Zesde
      - id: ref2
        bwb_id: BWBR0028917
        artikel: '244'
        afdeling: Tweede
  - number: '255'
    text: |-
      1 De bewindvoerders zijn bevoegd ter vergadering op elke door hen gedane erkenning of betwisting terug te komen.

      2 Zoowel de schuldenaar als ieder verschenen schuldeischer kan eene door de bewindvoerders geheel of gedeeltelijk
      erkende vordering betwisten.

      3 Betwistingen of erkenningen, op de vergadering gedaan, worden op de lijst aangeteekend.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel255
  - number: '256'
    text: |-
      De rechter in eersten aanleg bepaalt of en tot welk bedrag de schuldeischers, wier vorderingen betwist zijn, tot de
      stemming zullen worden toegelaten.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel256
  - number: '257'
    text: |-
      1 Tot het aannemen van het akkoord wordt vereischt de toestemming van twee derde der erkende en der toegelaten
      schuldeischers, welke drie vierde van het bedrag der erkende en der toegelaten schuldvorderingen vertegenwoordigen.
      Geen toestemming is vereist van een erkende of toegelaten schuldeiser, voor zover zijn schuldvordering is gegrond
      op een verbeurde dwangsom.

      2 De [artikelen 141][ref1] en [142][ref2] vinden overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel142
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel257
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '141'
        afdeling: Zesde
      - id: ref2
        bwb_id: BWBR0028917
        artikel: '142'
        afdeling: Zesde
  - number: '258'
    text: |-
      1 Het proces-verbaal van het verhandelde vermeldt den inhoud van het akkoord, de namen der verschenen
      stemgerechtigde schuldeischers, de door ieder hunner uitgebrachte stem, den uitslag der stemming en al wat verder
      is voorgevallen. De door bewindvoerders opgemaakte lijst van schuldeischers, zooals zij tijdens de raadpleging
      is aangevuld of gewijzigd, wordt, door den rechter in eersten aanleg en den griffier gewaarmerkt, aan het proces-
      verbaal gehecht.

      2 Gedurende acht dagen kan een ieder ter griffie kosteloos inzage van het proces-verbaal verkrijgen.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel258
  - number: '259'
    text: |-
      1 Zoowel de schuldeischers, die vóór gestemd hebben, als de schuldenaar kunnen gedurende acht dagen na afloop der
      stemming aan het Hof van Justitie verbetering van het proces-verbaal verzoeken, indien uit de stukken zelve blijkt,
      dat het akkoord door den rechter in eersten aanleg ten onrechte als verworpen is beschouwd.

      2 Indien het Hof het proces-verbaal verbetert, bepaalt het bij zijne beschikking den dag, waarop de rechter in
      eersten aanleg de homologatie zal behandelen, welke dag gesteld wordt op niet vroeger dan acht en niet later
      dan veertien dagen na de beschikking. Van deze beschikking geven de bewindvoerders schriftelijk kennis aan de
      schuldeischers. Deze beschikking brengt van rechtswege vernietiging mede van een ingevolge [artikel 266][ref1]
      uitgesproken faillissement.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel266
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel259
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '266'
        afdeling: Tweede
  - number: '260'
    text: |-
      1 Indien het akkoord is aangenomen, kunnen zoowel de bewindvoerders als elke schuldeischer de gronden uiteenzetten,
      waarop zij de homologatie wenschen of haar bestrijden.

      [Artikel 147, tweede lid][ref1], vindt overeenkomstige toepassing.

      2 De rechter in eersten aanleg kan bepalen, dat de behandeling der homologatie op een lateren, terstond door hem
      vast te stellen, dag zal plaats vinden.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel147
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel260
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '147'
        afdeling: Zesde
  - number: '261'
    text: |-
      1 De rechter in eerste aanleg geeft zoo spoedig mogelijk zijne met redenen omkleede beschikking.

      2 Hij weigert de homologatie:

      1°. indien de baten van de boedel de bij het akkoord bedongen som te boven gaan;

      2°. indien de nakoming van het akkoord niet voldoende is gewaarborgd;

      3°. indien het akkoord door bedrog, door begunstiging van één of meer schuldeischers of met behulp van andere
      oneerlijke middelen is tot stand gekomen, onverschillig of de schuldenaar dan wel een ander daartoe heeft
      medegewerkt;

      4°. indien het loon en de verschotten van de deskundigen en de bewindvoerders niet in handen van de bewindvoerders
      zijn gestort of daarvoor zekerheid is gesteld.

      3 Hij mag ook op andere gronden en ook ambtshalve de homologatie weigeren.

      4 De rechter in eersten aanleg, de homologatie weigerende, kan bij dezelfde beschikking den schuldenaar in
      staat van faillissement verklaren. Wordt het faillissement niet uitgesproken, dan eindigt de surséance zoodra de
      beschikking, waarbij de homologatie geweigerd is, in kracht van gewijsde is gegaan.

      5 De [artikelen 148a][ref1], [148b][ref2] en [152][ref3] vinden overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel148a
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel148b
      [ref3]: https://wetten.overheid.nl/BWBR0028917#Artikel152
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel261
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: 148a
        afdeling: Zesde
      - id: ref2
        bwb_id: BWBR0028917
        artikel: 148b
        afdeling: Zesde
      - id: ref3
        bwb_id: BWBR0028917
        artikel: '152'
        afdeling: Zesde
  - number: '262'
    text: Het gehomologeerde akkoord is verbindend voor alle schuldeischers te wier aanzien de surséance werkt.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel262
  - number: '263'
    text: |-
      Het in kracht van gewijsde gegane vonnis van homologatie levert, in verband met het in [artikel 258][ref1] bedoelde
      proces-verbaal ten behoeve der door den schuldenaar niet betwiste vorderingen een voor tenuitvoerlegging vatbaren
      titel op tegen den schuldenaar en de tot het akkoord als borgen toegetreden personen.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel258
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel263
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '258'
        afdeling: Tweede
  - number: '264'
    text: |-
      Zoolang niet over het aangeboden akkoord uiteindelijk is beslist, eindigt de surséance niet door verloop van den
      termijn, waarvoor zij is verleend.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel264
  - number: '265'
    text: De surséance neemt een einde zoodra het vonnis van homologatie in kracht van gewijsde is gegaan.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel265
  - number: '266'
    text: |-
      De rechter in eersten aanleg kan, wanneer het akkoord niet wordt aangenomen, den schuldenaar bij vonnis in staat
      van faillissement verklaren. Wordt het faillissement niet uitgesproken, dan eindigt de surséance zoodra de termijn,
      in [artikel 259][ref1] bedoeld, ongebruikt verstreken is of het Hof van Justitie verbetering van het proces-verbaal
      heeft geweigerd.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel259
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel266
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '259'
        afdeling: Tweede
  - number: '267'
    text: |-
      1 Indien de rechter in eersten aanleg den schuldenaar in staat van faillissement heeft verklaard, heeft deze
      recht van hooger beroep tegen de faillietverklaring gedurende de acht dagen na den dag, waarop de termijn van
      [artikel 259][ref1] ongebruikt verstreken is of het Hof van Justitie de verbetering van het proces-verbaal
      geweigerd heeft.

      2 Het hooger beroep wordt ingesteld door indiening van eene memorie ter griffie van het betrokken gerecht in
      eersten aanleg. De griffier handelt vervolgens overeenkomstig het bepaalde in [artikel 210][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel259
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel210
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel267
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '259'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0028917
        artikel: '210'
        afdeling: Eerste
  - number: '268'
    text: |-
      1 Ten aanzien van de ontbinding van het akkoord vinden de [artikelen 157][ref1] en [158][ref2] overeenkomstige
      toepassing.

      2 Bij het vonnis, waarbij de ontbinding van het akkoord wordt uitgesproken, wordt de schuldenaar tevens in staat
      van faillissement verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel157
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel158
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel268
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '157'
        afdeling: Zesde
      - id: ref2
        bwb_id: BWBR0028917
        artikel: '158'
        afdeling: Zesde
  - number: '269'
    text: |-
      In een faillissement, uitgesproken krachtens de [artikelen 261][ref1], [266][ref2] en [268][ref3] kan een akkoord
      niet worden aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel261
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel266
      [ref3]: https://wetten.overheid.nl/BWBR0028917#Artikel268
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel269
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '261'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0028917
        artikel: '266'
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0028917
        artikel: '268'
        afdeling: Tweede
  - number: '270'
    text: |-
      Tegen de beslissingen van den rechter, ingevolge de bepalingen van dezen titel gegeven, staat geen hoogere
      voorziening open, behalve in de gevallen, waarin het tegendeel is bepaald.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel270
  - number: '271'
    text: |-
      1 De Algemene termijnenwet is niet van toepassing op de termijnen, gesteld in de [artikelen 35][ref1], [36][ref2],
      [228][ref3] en [229][ref4].

      2 [Boek 1, Titel 10 van het Wetboek van Burgerlijke Rechtsvordering BES][ref5] is niet van toepassing op verzoeken
      ingevolge deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel35
