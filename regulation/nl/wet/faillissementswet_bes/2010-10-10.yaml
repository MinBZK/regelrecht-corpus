  - number: '19'
    text: |-
      Door de faillietverklaring verliest de schuldenaar van rechtswege de beschikking en het beheer over zijn tot het
      faillissement behoorend vermogen, te rekenen van den dag waarop de faillietverklaring wordt uitgesproken, die dag
      daaronder begrepen.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel19
  - number: '20'
    text: |-
      Voor verbintenissen van den schuldenaar, na de faillietverklaring ontstaan, is de boedel niet aansprakelijk dan
      voorzooverre deze tengevolge daarvan is gebaat.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel20
  - number: '21'
    text: |-
      1 Rechtsvorderingen, welke rechten of verplichtingen tot den faillieten boedel behoorende ten onderwerp hebben,
      worden zoowel tegen als door den curator ingesteld.

      2 Indien zij, door of tegen den gefailleerde ingesteld of voortgezet, eene veroordeeling van den gefailleerde
      tengevolge hebben, mits die veroordeeling tegenover den faillieten boedel rechtskracht.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel21
  - number: '22'
    text: |-
      Rechtsvorderingen, welke voldoening van eene verbintenis uit den boedel ten doel hebben, kunnen gedurende
      het faillissement ook tegen den gefailleerde niet op andere wijze ingesteld worden, dan door aanmelding ter
      verificatie.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel22
  - number: '23'
    text: |-
      1 Indien de rechtsvordering tijdens de faillietverklaring aanhangig en door den schuldenaar ingesteld is, wordt het
      geding ten verzoeke van den gedaagde, geschorst, teneinde dezen gelegenheid te geven, binnen een door den rechter
      bepaalden termijn, den curator tot overneming van het geding op te roepen.

      2 Zoo deze niet aan die oproeping gevolg geeft, heeft de gedaagde het recht ontslag van de instantie te vragen;
      bij gebreke daarvan, kan het geding tusschen den gefailleerde en den gedaagde worden voortgezet, buiten bezwaar van
      den boedel.

      3 Ook zonder opgeroepen te zijn, is de curator bevoegd het proces te allen tijde over te nemen en den gefailleerde
      buiten het geding te doen stellen.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel23
  - number: '24'
    text: |-
      1 Indien de rechtsvordering tijdens de faillietverklaring aanhangig en tegen den schuldenaar ingesteld is, is de
      eischer bevoegd schorsing te verzoeken, ten einde, binnen een door den rechter bepaalden termijn, den curator in
      het geding te roepen.

      2 Door zijne verschijning neemt deze het proces over en is de gefailleerde van rechtswege buiten het geding.

      3 Indien de curator verschijnende dadelijk in den eisch toestemt, worden de proceskosten van de tegenpartij niet
      beschouwd als boedelschuld.

      4 Zoo de curator niet verschijnt, is op het tegen den gefailleerde verkregen vonnis de bepaling van het
      [tweede lid van artikel 21][ref1] niet toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel21
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '21'
        afdeling: Tweede
  - number: '25'
    text: |-
      Voor zooverre tijdens de faillietverklaring aanhangige rechtsvorderingen voldoening van eene verbintenis uit den
      boedel ten doel hebben, wordt het geding na de faillietverklaring geschorst, om alleen dan voortgezet te worden,
      indien de verificatie van de vordering betwist wordt. In dit geval wordt hij, die de betwisting doet, in de plaats
      van den gefailleerde, partij in het geding.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel25
  - number: '26'
    text: |-
      1 Indien vóór de faillietverklaring de stukken van het geding tot het geven van eene beslissing aan den rechter
      zijn overgelegd, zijn het [tweede lid van artikel 21][ref1] en de [artikelen 23–25][ref2] niet toepasselijk.

      2 De [artikelen 23–25][ref3] worden weder toepasselijk, indien het geding voor den rechter, bij wien het
      aanhangig is, tengevolge van zijne beslissing wordt voortgezet.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0028917#Artikel23
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '21'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0028917
        artikel: '23'
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0028917
        artikel: '23'
        afdeling: Tweede
  - number: '27'
    text: |-
      Indien een geding door of tegen den curator, of ook in het geval van [artikel 25][ref1] tegen een schuldeischer
      wordt voortgezet, mag de curator of die schuldeischer de nietigheid inroepen van handelingen, door den schuldenaar
      vóór zijne faillietverklaring in het geding verricht, zoo bewezen wordt, dat deze door die handelingen de
      schuldeischers desbewust heeft benadeeld en dat dit aan zijne tegenpartij bekend was.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel25
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '25'
        afdeling: Tweede
  - number: '28'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel28
  - number: '29'
    text: |-
      1 Het vonnis van faillietverklaring heeft tengevolge, dat alle gerechtelijke tenuitvoerlegging op eenig deel van
      het vermogen van den schuldenaar, vóór het faillissement aangevangen, dadelijk een einde neemt, en dat, ook van
      hetzelfde oogenblik af, een vonnis niet bij lijfsdwang kan worden ten uitvoer gelegd.

      2 Gelegde beslagen vervallen; de inschrijving van een desbetreffende verklaring van de rechter-commissaris machtigt
      de bewaarder van de openbare registers tot doorhaling. Het beslag herleeft, zodra het faillissement een einde
      neemt ten gevolge van vernietiging of opheffing van het faillissement, mits het goed dan nog tot de boedel behoort.
      Indien de inschrijving van het beslag in de openbare registers is doorgehaald, vervalt de herleving, indien niet
      binnen veertien dagen na de herleving een exploit is ingeschreven, waarbij van de herleving mededeling aan de
      schuldenaar is gedaan.

      3 Indien de schuldenaar zich in gijzeling bevindt, wordt hij ontslagen, zoodra het vonnis van faillietverklaring in
      kracht van gewijsde is gegaan, behoudens toepassing van [artikel 28][ref1].

      4 Het bepaalde bij dit artikel geldt niet voor lijfsdwang bij vonnissen, beschikkingen en authentieke
      akten, waarbij een uitkering tot levensonderhoud, krachtens [Boek 1 van het Burgerlijk Wetboek BES][ref2]
      verschuldigd, daaronder begrepen het verschuldigde voor verzorging en opvoeding van een minderjarige
      en voor levensonderhoud en studie van een meerderjarige die de leeftijd van een en twintig jaren
      niet heeft bereikt, is bevolen of toegezegd, alsmede beschikkingen, waarbij een uitkering, krachtens
      [artikel 85, tweede lid, van Boek 1 van het Burgerlijk Wetboek BES][ref3] door de ene echtgenoot aan de andere
      echtgenoot verschuldigd, is bevolen.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0028743
      [ref3]: https://wetten.overheid.nl/BWBR0028743#Artikel85
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel29
