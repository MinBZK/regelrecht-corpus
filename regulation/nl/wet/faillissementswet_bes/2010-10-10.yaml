        bwb_id: BWBR0028752
        artikel: 1615j
  - number: '230'
    text: |-
      1 Voldoening nadat de surséance voorloopig is verleend doch vóór de bekendmaking daarvan aan de schuldenaar gedaan,
      ter vervulling van verbintenissen jegens dezen vóórdien ontstaan, bevrijdt hem, die haar deed, tegenover den
      boedel, zoolang zijne bekendheid met de voorloopige verleening van de surséance niet bewezen wordt.

      2 Voldoening, als in het vorig lid bedoeld, na de bekendmaking aan de schuldenaar gedaan, bevrijdt tegenover
      den boedel alleen dan, wanneer hij, die haar deed, bewijst, dat de voorloopige verleening van de surséance te
      zijner woonplaats langs den weg der wettelijke aankondiging nog niet bekend kon zijn, behoudens het recht van
      bewindvoerders om aan te toonen, dat zij hem toch bekend was.

      3 In elk geval bevrijdt voldoening aan den schuldenaar hem, die haar deed, tegenover den boedel, voor zooverre
      hetgeen door hem voldaan werd ten bate van den boedel is gekomen.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel230
  - number: '231'
    text: De surséance werkt niet ten voordeele van borgen en andere medeschuldenaren.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel231
  - number: 231a
    text: |-
      1 De rechter in eerste aanleg kan op verzoek van de schuldenaar of de bewindvoerder bepalen dat elke bevoegdheid
      van derden tot verhaal op tot de boedel behorende goederen of tot opeising van goederen die zich in de macht
      van de schuldenaar bevinden, voor een periode van ten hoogste één maand niet kan worden uitgeoefend dan met zijn
      machtiging. De rechter in eerste aanleg kan die periode éénmaal voor ten hoogste één maand verlengen.

      2 De rechter in eerste aanleg kan zijn beschikking beperken tot bepaalde derden en daaraan voorwaarden verbinden.
      De rechter in eerste aanleg kan voorwaarden verbinden aan een door hem gegeven machtiging van een derde tot
      uitoefening van een aan deze toekomende bevoegdheid.

      3 Gedurende de in het eerste lid bedoelde perioden lopen aan of door de derden ter zake van hun bevoegdheid
      gestelde termijnen voort, voor zover dit redelijkerwijze noodzakelijk is om de derde dan wel de schuldenaar en de
      bewindvoerder in staat te stellen na afloop van de periode hun standpunt te bepalen. De wederpartij kan hun daartoe
      opnieuw een redelijke termijn stellen.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel231a
  - number: '232'
    text: |-
      1 Nadat de surséance is verleend, kan zij, op verzoek van de bewindvoerders, van één of meer der schuldeischers of
      ook ambtshalve door den rechter in eersten aanleg worden ingetrokken:

      1°. indien de schuldenaar zich, gedurende den loop der surséance, aan kwade trouw in het beheer van den boedel
      schuldig maakt;

      2°. indien hij zijne schuldeischers tracht te benadeelen;

      3°. indien hij handelt in strijd met [artikel 218, eerste lid][ref1];

      4°. indien hij nalaat te doen, wat in de bepalingen, bij het verleenen der surséance of later gesteld, aan hem is
      opgelegd of wat naar het oordeel der bewindvoerders door hem in het belang des boedels moet worden gedaan;

      5°. indien, hangende de surséance, de staat des boedels zoodanig blijkt te zijn, dat handhaving der surséance niet
      langer wenschelijk is of het vooruitzicht, dat de schuldenaar na verloop van tijd zijne schuldeischers zal kunnen
      bevredigen blijkt niet te bestaan.

      2 In de gevallen, vermeld onder 1e. en 5e., zijn de bewindvoerders verplicht de intrekking te vragen.

      3 De verzoeker, de schuldenaar en de bewindvoerders worden gehoord of behoorlijk opgeroepen. De oproeping geschiedt
      door den griffier tegen een door den rechter in eersten aanleg te bepalen dag. De beschikking is met redenen
      omkleed.

      4 Indien op grond van dit artikel de surséance wordt ingetrokken, kan bij dezelfde beschikking de
      faillietverklaring van de schuldenaar worden uitgesproken. Wordt het faillissement niet uitgesproken, dan blijft de
      surséance gehandhaafd tot de beschikking van den rechter in eersten aanleg in kracht van gewijsde is gegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel218
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel232
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '218'
        afdeling: Eerste
  - number: '233'
    text: |-
      1 Gedurende acht dagen na den dag der beschikking heeft, in geval van intrekking der surséance geweigerd is,
      hij, die het verzoek tot intrekking heeft gedaan, recht van hooger beroep tegen de beschikking van den rechter in
      eersten aanleg.

      2 Het hooger beroep wordt ingesteld door indiening van eene memorie ter griffie van het gerecht in eerste aanleg,
      in het openbaar lichaam, waar de surséance is ingetrokken of de intrekking daarvan geweigerd is.

      3 De griffier geeft hiervan ten spoedigste aan hen, die het verzoek tot intrekking hebben gedaan, den schuldenaar
      en de bewindvoerders schriftelijk kennis en zendt de terzake betrekkelijke stukken, waaronder een afschrift van de
      beschikking waarvan beroep, zoo spoedig mogelijk aan het Hof van Justitie.

      4 [Artikel 211][ref1] vindt overeenkomstige toepassing.

      5 De beschikking van het Hof wordt door den griffier terstond medegedeeld aan de griffie van het gerecht in eerste
      aanleg, in het openbaar lichaam bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel211
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel233
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '211'
        afdeling: Eerste
  - number: '234'
    text: |-
      Zoodra eene beschikking, waarbij de surséance is ingetrokken, in kracht van gewijsde is gegaan, wordt zij
      aangekondigd, gelijk is voorgeschreven in [artikel 207][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel207
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel234
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '207'
        afdeling: Eerste
  - number: '235'
    text: |-
      1 Indien de rechter in eersten aanleg van oordeel is, dat de behandeling van het verzoek tot intrekking van de
      surséance niet zal zijn beeindigd vóór den dag, waarop de schuldeischers krachtens [artikel 206, tweede lid][ref1],
      worden gehoord, gelast hij, dat de griffier den schuldeischers bij brieven zal mededeelen, dat dit verhoor op dien
      dag niet zal worden gehouden.

      2 Zoo noodig bepaalt hij later den dag waarop dit verhoor alsnog zal plaats vinden; de schuldeischers worden door
      den griffier bij brieven opgeroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel206
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel235
    references:
