  - number: '4'
    text: |-
      1 De aangifte tot faillietverklaring wordt gedaan en het verzoek daartoe ingediend ter griffie en met den meesten
      spoed behandeld.

      2 Een gehuwde schuldenaar doet aangifte met medewerking van zijn echtgenoot, tenzij iedere gemeenschap tussen de
      echtgenoten is uitgesloten.

      3 Ten aanzien van eene vennootschap onder eene firma, moet de aangifte inhouden den naam en de woonplaats van elk
      der hoofdelijk voor het geheel verbondene vennooten.

      4 Het vonnis van faillietverklaring wordt ter openbare terechtzitting uitgesproken en is bij voorraad op de minute
      uitvoerbaar, niettegenstaande eenige daartegen gerichte voorziening.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel4
  - number: '5'
    text: |-
      1 De rechter in eersten aanleg kan bevelen, dat de schuldenaar worde opgeroepen, om in persoon of bij gemachtigde
      gehoord te worden. De Griffier doet de oproeping op de wijze, bij algemene maatregel van bestuur, te bepalen.

      2 Indien de schuldenaar, die is opgeroepen om gehoord te worden, gehuwd is, is zijn echtgenoot mede bevoegd om in
      persoon of bij gemachtigde te verschijnen.

      3 De faillietverklaring wordt uitgesproken, indien summierlijk blijkt van het bestaan van feiten of omstandigheden,
      welke aantoonen, dat de schuldenaar in den toestand verkeert, dat hij heeft opgehouden te betalen en, zoo een
      schuldeischer het verzoek doet, ook van het vorderingsrecht van dezen.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel5
  - number: '6'
    text: |-
      1 Hangende het onderzoek, kan de rechter in eerste aanleg de verzoeker, desgevraagd, verlof verlenen de boedel te
      doen verzegelen. Hij kan daaraan de voorwaarde verbinden van zekerheidstelling tot een door hem te bepalen bedrag.

      2 De verzegeling geschiedt door een bij dit verlof aan te wijzen notaris. Buiten de verzegeling blijven zaken die
      onder [artikel 18][ref1] vallen; in het proces-verbaal wordt een korte beschrijving daarvan opgenomen.


