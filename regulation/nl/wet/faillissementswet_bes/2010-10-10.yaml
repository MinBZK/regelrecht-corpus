        artikel: '12'
        afdeling: Eerste
  - number: '68'
    text: |-
      Het ontbreken van de machtiging van den rechter-commissaris, waar die vereischt is, of de niet-inachtneming van de
      bepalingen vervat in de [artikelen 74][ref1] en [75][ref2], is, voor zooveel derden betreft, niet van invloed op de
      geldigheid van de door den curator verrichte handeling. De curator is deswege alleen jegens den gefailleerde en de
      schuldeischers aansprakelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel74
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel68
