        bwb_id: BWBR0028917
        artikel: '206'
        afdeling: Eerste
  - number: '236'
    text: |-
      1 De schuldenaar is steeds bevoegd aan den rechter in eersten aanleg de intrekking van de surséance te verzoeken,
      op grond dat de toestand des boedels hem weder in staat stelt zijne betalingen te hervatten. De bewindvoerders en,
      indien het ene definitief verleende surséance betreft, de schuldeischers worden gehoord of behoorlijk opgeroepen.

      2 Deze oproeping geschiedt bij brieven door den griffier tegen een door den rechter in eersten aanleg te bepalen
      dag.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel236
  - number: '237'
    text: |-
      1 Gedurende eene surséance kan faillietverklaring niet rauwelijks worden gevorderd.

      2 Indien ingevolge eene der bepalingen van dezen titel eene faillietverklaring uitgesproken wordt, vindt
      [artikel 11][ref1] overeenkomstige toepassing; wordt ingevolge die bepalingen een faillissement vernietigd, dan
      vinden de [artikelen 10][ref2] en [12][ref3] overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0028917#Artikel12
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel237
