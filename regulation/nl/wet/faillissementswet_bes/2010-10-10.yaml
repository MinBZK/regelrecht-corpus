  - number: '168'
    text: |-
      1 De rechter-commissaris is bevoegd om op verzoek van een schuldeischer of van den curator te gelasten, dat de
      voortzetting van het bedrijf wordt gestaakt. Op dit verzoek worden gehoord de commissie uit de schuldeischers,
      indien deze er is, alsmede de curator, indien deze het verzoek niet gedaan heeft.

      2 Bovendien mag de rechter-commissaris iedere schuldeischer en den schuldenaar hooren.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel168
  - number: '169'
    text: |-
      1 Indien een voorstel tot voortzetting van het bedrijf niet of niet tijdig wordt gedaan of indien het wordt
      verworpen of de voortzetting wordt gestaakt, gaat de curator onmiddellijk over tot vereffening en te gelde making
      van alle baten des boedels, zonder dat daartoe de toestemming of medewerking van den gefailleerde noodig is.

      2 Niettemin kan den gefailleerde eenig door den rechter-commissaris aangewezen huisraad worden gelaten.

      3 Ook in geval van voortzetting van het bedrijf kunnen baten van den boedel, welke voor de voortzetting niet noodig
      zijn, worden te gelde gemaakt.

      4 De goederen worden in het openbaar of met toestemming van den rechter-commissaris ondershands verkocht.

      5 Over alle niet spoedig of in het geheel niet voor vereffening vatbare baten beschikt de curator op de door den
      rechter-commissaris goedgekeurde wijze.

      6 De curator kan ten behoeve van de vereffening van de diensten des gefailleerden gebruik maken, tegen eene door
      den rechter-commissaris vastgestelde vergoeding.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel169
  - number: '170'
    text: |-
      Nadat de boedel insolvent is geworden, is de rechter-commissaris bevoegd, om op door hem bepaalde dag, uur en
      plaats, eene vergadering van schuldeischers te beleggen, ten einde hen zoo noodig te raadplegen over de wijze
      van vereffening van den boedel, en zoo noodig de verificatie te doen plaats hebben van de schuldvorderingen,
      welke na afloop van den in [artikel 103, eerste lid, onder 1e.][ref1], bepaalden termijn nog zijn ingediend en
      niet reeds ingevolge [artikel 123][ref2] geverifieerd zijn. De curator handelt ten opzichte van deze vorderingen
      overeenkomstig de bepalingen van de [artikelen 106–109][ref3]. Hij roept de schuldeischers ten minste tien
      dagen vóór de vergadering, bij brieven op, waarin het onderwerp van de vergadering wordt vermeld en hun tevens
      de bepaling van [artikel 109][ref4] wordt herinnerd. Bovendien plaatst hij gelijke oproeping in het nieuwsblad,
      bedoeld in [artikel 11][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel103
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel123
      [ref3]: https://wetten.overheid.nl/BWBR0028917#Artikel106
      [ref4]: https://wetten.overheid.nl/BWBR0028917#Artikel109
      [ref5]: https://wetten.overheid.nl/BWBR0028917#Artikel11
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel170
