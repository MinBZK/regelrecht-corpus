  - number: '240'
    text: |-
      De bepalingen van internationaal recht van de [artikelen 195–197][ref1] vinden bij surséance overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel195
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel240
