  - number: '167'
    text: |-
      1 Indien binnen acht dagen, nadat de homologatie van een akkoord definitief is geweigerd, de curator of
      een schuldeischer bij den rechter-commissaris een voorstel indient tot voortzetting van het bedrijf van den
      gefailleerde, belegt de rechter-commissaris op door hem terstond bepaalden dag, uur en plaats, eene vergadering van
      schuldeischers ten einde over het voorstel te doen beraadslagen en beslissen.

      2 De curator roept de schuldeischers ten minste tien dagen vóór de vergadering op bij brieven, waarin het
      ingediende voorstel wordt vermeld en hun tevens de bepaling van [artikel 109][ref1] wordt herinnerd. Bovendien
      plaatst hij gelijke oproeping in het nieuwsblad bedoeld in [artikel 11][ref2].

      3 [Artikel 166, lid 2][ref3], [5][ref4], [7][ref5], [8][ref6], [9][ref7], [10][ref8] en [11][ref9], is van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel109
