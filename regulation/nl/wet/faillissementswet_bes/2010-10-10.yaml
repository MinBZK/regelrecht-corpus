        artikel: '11'
        afdeling: Eerste
  - number: '171'
    text: |-
      Zoo dikwijls er, naar het oordeel van den rechter-commissaris, voldoende gereede penningen aanwezig zijn, beveelt
      deze eene uitdeeling aan de geverifieerde schuldeischers.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel171
  - number: '172'
    text: |-
      1 De curator maakt telkens de uitdeelingslijst op en onderwerpt die aan de goedkeuring van den rechter-commissaris.
      De lijst houdt in een staat van ontvangsten en uitgaven (daaronder begrepen het salaris van den curator), de namen
      der schuldeischers, het geverifieerde bedrag van ieders vordering benevens de daarop te ontvangen uitkeering.

      2 Voor de concurrente schuldeisers worden de door de rechter-commissaris te bepalen percenten uitgetrokken.
      Voor de schuldeisers die voorrang hebben, ongeacht of deze betwist wordt, en die niet reeds overeenkomstig
      [artikel 53][ref1] of [56, derde lid][ref2], voldaan zijn, wordt het bedrag uitgetrokken, waarvoor zij batig
      gerangschikt kunnen worden op de opbrengst der goederen waarop hun voorrang betrekking heeft. Zo dit minder is dan
      het gehele bedrag van hun vorderingen, worden voor het ontbrekende, zo de goederen waarop hun vordering betrekking
      heeft nog niet verkocht zijn, voor hun hele vordering, gelijke percenten uitgetrokken als voor de concurrente
      schuldeisers.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel56
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '53'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0028917
        artikel: '56'
        afdeling: Tweede
  - number: '173'
    text: |-
      Voor de voorwaardelijk toegelaten schuldvorderingen worden op de uitdeelingslijst de percenten over het volle
      bedrag uitgetrokken.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel173
  - number: '174'
    text: |-
      1 De algemene faillissementskosten worden omgeslagen over ieder deel van de boedel, met uitzondering van hetgeen
      na een executie overeenkomstig [artikel 53][ref1] of [56, derde lid, tweede volzin][ref2], toekomt aan de pand- of
      hypotheekhouders, aan de schuldeisers met retentierecht en aan de beperkt gerechtigden, en huurders wier recht door
      de executie is vervallen of verloren gegaan, maar met inbegrip van hetgeen krachtens een zodanige executie aan de
      curator is uitgekeerd ten behoeve van een schuldeiser die boven een of meer van voormelde personen bevoorrecht was.

      2 De in het vorige lid genoemde uitzondering geldt eveneens ten aanzien van luchtvaartuigen, welke overeenkomstig
      [artikel 55a][ref3] door een schuldeiser zelf zijn verkocht.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel56
      [ref3]: https://wetten.overheid.nl/BWBR0028917#Artikel55a
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel174
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '53'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0028917
        artikel: '56'
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0028917
        artikel: 55a
        afdeling: Tweede
  - number: '175'
    text: |-
      1 De door den rechter-commissaris goedgekeurde uitdeelingslijst ligt gedurende tien dagen ter plaatse in
      [artikel 92][ref1] aangewezen kosteloos ter inzage van de schuldeischers.

      2 Van de nederlegging wordt door de zorg van den curator aankondiging gedaan in het nieuwsblad, bedoeld in
      [artikel 11][ref2], terwijl daarvan bovendien aan ieder der erkende en voorwaardelijk toegelaten schuldeischers
      schriftelijk kennis wordt gegeven, met vermelding van het voor hen uitgetrokken bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel92
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel11
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel175
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '92'
        afdeling: Vierde
      - id: ref2
        bwb_id: BWBR0028917
        artikel: '11'
        afdeling: Eerste
  - number: '176'
    text: |-
      1 Gedurende den in het [vorige artikel][ref1] genoemden termijn kan ieder schuldeischer in verzet komen tegen de
      uitdeelingslijst, door inlevering van een met redenen omkleed bezwaarschrift ter griffie van het gerecht in eerste
      aanleg, in het openbaar lichaam Bonaire, Sint Eustatius of Saba waar het faillissement werd uitgesproken; de
      griffier geeft hem een bewijs van ontvangst af.

      2 Het bezwaarschrift wordt als bijlage bij de lijst gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel175
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel176
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '175'
        afdeling: Zevende
  - number: '177'
    text: |-
      1 Zoo er verzet gedaan is, zendt de rechter-commissaris onmiddellijk na afloop van den termijn van inzage het
      bezwaarschrift en de overige stukken, vergezeld van zijn schriftelijk rapport, aan het Hof van Justitie.

      2 De griffier van het Hof van Justitie doet aan de opposanten en aan den curator schriftelijk mededeeling van den
      dag van behandeling.

      3 Op den bepaalden dag leest de griffier ter openbare terechtzitting het schriftelijk rapport van den rechter-
      commissaris voor en is de curator en ieder der schuldeischers in persoon of bij gemachtigde bevoegd om de gronden
      uiteen te zetten ter verdediging of bestrijding van de uitdeelingslijst.

      4 Op denzelfden dag, of anders zoo spoedig mogelijk, geeft het Hof van Justitie zijne met redenen omkleede
      beschikking.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel177
  - number: '178'
    text: |-
      1 Ook een niet-geverifieerde schuldeischer, zoomede een schuldeischer, wiens vordering voor een te laag bedrag is
      geverifieerd, doch overeenkomstig zijne opgave, mag verzet doen, mits hij uiterlijk twee dagen vóór dien waarop het
      verzet ter openbare terechtzitting zal behandeld worden, de vordering of het niet-geverifieerde deel der vordering
      bij den curator indiene, een afschrift daarvan ter griffie van het Hof van Justitie bij het bezwaarschrift voege,
      en in dit bezwaarschrift tevens verzoek doet om geverifieerd te worden.

      2 De verificatie geschiedt alsdan op de wijze bij [artikel 114][ref1] en volgende voorgeschreven, ter openbare
      terechtzitting, bestemd voor de behandeling van het verzet en vóórdat daarmede een aanvang wordt gemaakt.

      3 Indien dit verzet alleen ten doel heeft als schuldeischer geverifieerd te worden, en er niet tevens door anderen
      verzet is gedaan, komen de kosten van het verzet ten laste van den nalatigen schuldeischer.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel114
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel178
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '114'
        afdeling: Vijfde
  - number: '179'
    text: |-
      Door verloop van den termijn van [artikel 175][ref1], of, zoo er verzet is gedaan, door het op het verzet gegeven
      beschikking, wordt de uitdeelingslijst verbindend.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel175
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel179
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '175'
        afdeling: Zevende
  - number: '180'
    text: |-
      1 Door levering ingevolge verkoop door de curator en de voldoening van de koopprijs gaan alle op het verkochte
      goed rustende hypotheken teniet en vervallen de beperkte rechten die niet tegen alle geverifieerde schuldeisers
      ingeroepen kunnen worden.

      2 De rechter-commissaris geeft, desverlangd, aan de koper een verklaring af van dit tenietgaan en vervallen.
      De verklaring kan bij of na de levering in de registers worden ingeschreven. Zij machtigt dan de bewaarder der
      registers tot doorhaling van de betrokken inschrijvingen.

      3 Op verkoop, door de curator, van tot de boedel behorende schepen, is
      [artikel 575 van het Wetboek van Burgerlijke Rechtsvordering BES][ref1] toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028496#Artikel575
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel180
    references:
      - id: ref1
        bwb_id: BWBR0028496
        artikel: '575'
  - number: '181'
    text: |-
      1 De uitdeeling, uitgetrokken voor een voorwaardelijk toegelaten schuldeischer, wordt niet uitgekeerd, zoolang niet
      omtrent zijne vordering is beslist. Blijkt het ten slotte, dat hij niets of minder te vorderen heeft, dan komen de
      voor hem bestemde gelden geheel of ten deele ten bate van de andere schuldeischers.

      2 Uitdeelingen bestemd voor vorderingen, welker voorrang betwist wordt, worden, voor zooverre zij meer bedragen dan
      de percenten over de concurrente vorderingen uit te keeren, gereserveerd tot na de uitspraak over den voorrang.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel181
  - number: '182'
    text: |-
      Indien enig goed met betrekking waartoe een schuldeiser voorrang heeft, wordt verkocht, nadat hem ingevolge
      [artikel 171][ref1] in verband met het slot van [artikel 172][ref2], reeds een uitkering is gedaan, wordt hem
      bij een volgende uitdeling het bedrag waarvoor hij op de opbrengst van goed batig gerangschikt is, niet anders
      uitgekeerd dan onder aftrek van de percenten die hij reeds tevoren over dit bedrag ontving.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel171
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel172
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel182
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '171'
        afdeling: Zevende
      - id: ref2
        bwb_id: BWBR0028917
        artikel: '172'
        afdeling: Zevende
  - number: '183'
    text: |-
      1 Aan schuldeischers die, ten gevolge van hun verzuim om op te komen, eerst geverifieerd worden nadat er reeds
      uitdeelingen hebben plaats gehad, wordt uit de nog voorhanden baten een bedrag, evenredig aan het door de overige
      erkende schuldeischers reeds genotene, vooruitbetaald.

      2 Indien zij voorrang hebben, verliezen zij dien, voor zooverre de opbrengst van de zaak, waarop die voorrang
      kleefde, bij eene vroegere uitdeelingslijst aan andere schuldeischers bij voorrang is toegekend.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel183
  - number: '184'
    text: |-
      Na afloop van den termijn van inzage, bedoeld bij [artikel 175][ref1], of na uitspraak van het vonnis op het
      verzet, is de curator verplicht de vastgestelde uitkeering onverwijld te doen. De uitkeeringen, waarover niet
      binnen ééne maand daarna is beschikt of welke ingevolge [artikel 181][ref2] gereserveerd zijn, stort hij in de kas
      der gerechtelijke consignatiën


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel175
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel181
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel184
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '175'
        afdeling: Zevende
      - id: ref2
        bwb_id: BWBR0028917
        artikel: '181'
        afdeling: Zevende
  - number: '185'
    text: |-
      1 Zoodra aan de geverifieerde schuldeischers het volle bedrag van hunne vorderingen is uitgekeerd, of zoodra
      de slotuitdeelingslijst verbindend is geworden, neemt het faillissement een einde, behoudens de bepaling van
      [artikel 186][ref1]. De curator doet daarvan aankondiging op de wijze bij [artikel 11][ref2] bepaald.

      2 Na verloop van eene maand doet de curator rekening en verantwoording van zijn beheer aan den rechter-commissaris.

      3 De door den curator in den boedel gevonden boeken, papieren en andere gegevensdragers geeft hij tegen behoorlijk
      bewijs aan den schuldenaar af.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel186
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel11
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel185
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '186'
        afdeling: Zevende
      - id: ref2
        bwb_id: BWBR0028917
        artikel: '11'
        afdeling: Eerste
  - number: '186'
    text: |-
      Indien na de slotuitdeeling ingevolge [artikel 181][ref1] gereserveerde uitdeelingen aan den boedel terugvallen of
      mocht blijken, dat er nog baten van den boedel aanwezig zijn, welke ten tijde van de vereffening niet bekend waren,
      gaat de curator, op bevel van den rechter in eersten aanleg, tot vereffening en verdeeling daarvan over op den
      grondslag van de vroegere uitdeelingslijsten.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel181
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel186
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '181'
        afdeling: Zevende
  - number: '187'
    text: |-
      Door het verbindend worden van de slotuitdeelingslijst herkrijgen de schuldeischers voor hunne vorderingen, in
      zooverre deze onvoldaan zijn gebleven, hunne rechten van executie op de goederen van den schuldenaar.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel187
  - number: '188'
    text: |-
      De in het [vierde lid van artikel 116][ref1] bedoelde erkenning van eene vordering heeft kracht van gewijsde zaak
      tegen den schuldenaar; het proces-verbaal van de verificatie-vergadering levert voor de daarin als erkend vermelde
      vorderingen den voor tenuitvoerlegging vatbaren titel op tegen den schuldenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel116
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel188
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '116'
        afdeling: Vijfde
  - number: '189'
    text: |-
      De bepaling van het [vorige artikel][ref1] geldt niet voor zoover de vordering door den gefailleerde overeenkomstig
      [artikel 122][ref2] betwist is.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel188
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel122
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel189
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '188'
        afdeling: Achtste
      - id: ref2
        bwb_id: BWBR0028917
        artikel: '122'
        afdeling: Vijfde
  - number: '190'
    text: |-
      De boedel van een overledene wordt in staat van faillissement verklaard, indien één of meer der schuldeischers
      daartoe verzoek doen en summier aantoonen, dat de overledene in den toestand verkeerde, dat hij had opgehouden te
      betalen of dat de nalatenschap ten tijde van het overlijden niet toereikend was ter betaling van de schulden van
      den overledene.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel190
  - number: '191'
    text: |-
      1 Het verzoek wordt gericht tot den rechter in eersten aanleg, die tijdens het overlijden van den schuldenaar
      bevoegd was de faillietverklaring uit te spreken.

      2 De erfgenamen worden op het verzoek gehoord of daartoe opgeroepen bij een aan het sterfhuis beteekend exploot,
      zonder dat het noodig is hen bij name aan te duiden, alsmede, voor zooverre zij bekend zijn, bij brieven van den
      griffier.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel191
  - number: '192'
    text: |-
      De faillietverklaring heeft van rechtswege ten gevolge de afscheiding van den boedel van den overledene van dien
      van zijne erfgenamen, in dier voege als bij [artikel 1133 van Boek 4 van het Burgerlijk Wetboek BES][ref1] is
      omschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0028746#Artikel1133
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel192
    references:
      - id: ref1
        bwb_id: BWBR0028746
        artikel: '1133'
  - number: '193'
    text: |-
      De faillietverklaring kan aangevraagd worden zoo lang niet drie maanden na de aanvaarding van de nalatenschap en
      tevens zes maanden na overlijden van den schuldenaar zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel193
  - number: '194'
    text: |-
      De [zesde afdeeling][ref1] van dezen titel is op het faillissement van eene nalatenschap niet toepasselijk; evenmin
      de [achtste afdeeling][ref2], tenzij de erfenis zuiver is aanvaard.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#AfdelingZesde
      [ref2]: https://wetten.overheid.nl/BWBR0028917#AfdelingAchtste
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel194
    references:
      - id: ref1
        bwb_id: BWBR0028917
        afdeling: Zesde
      - id: ref2
        bwb_id: BWBR0028917
        afdeling: Achtste
  - number: '195'
    text: |-
      Schuldeischers, die na de faillietverklaring hunne vordering geheel of gedeeltelijk afzonderlijk verhaald
      hebben op zich in het buitenland bevindende, aan hen niet bij voorrang verbonden, goederen van den hier te lande
      gefailleerden schuldenaar, zijn verplicht het aldus verhaalde aan den boedel te vergoeden.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel195
  - number: '196'
    text: |-
      1 De schuldeischer, die zijne vordering tegen den gefailleerde, geheel of gedeeltelijk, afzonderlijk of bij
      voorrang te verhalen in het buitenland zich bevindende goederen van den gefailleerde, is verplicht het aldus
      verhaalde aan den boedel te vergoeden.

      2 De overdracht wordt, behoudens tegenbewijs, vermoed met dit doel te zijn geschiedt, als hij is gedaan met de
      wetenschap, dat de faillietverklaring reeds was aangevraagd of aangevraagd zou worden.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel196
  - number: '197'
    text: |-
      1 Gelijke verplichting tot vergoeding jegens de boedel rust op hem die zijn vordering of zijn schuld geheel of
      gedeeltelijk aan een derde overdraagt, die daardoor in staat wordt gesteld in het buitenland een door deze wet niet
      toegelaten verrekening in te roepen.

      2 Het tweede lid van het [vorige artikel][ref1] is hier toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel196
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel197
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '196'
        afdeling: Tiende
  - number: '198'
    text: |-
      Nadat het faillissement overeenkomstig de [artikelen 153][ref1] of [185][ref2] geëindigd is, is de schuldenaar of
      zijn zijne erfgenamen, ook in geval van [artikel 190][ref3], bevoegd een verzoek van rehabilitatie in te leveren
      bij den rechter in eersten aanleg, die het faillissement heeft berecht.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel153
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel185
      [ref3]: https://wetten.overheid.nl/BWBR0028917#Artikel190
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel198
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '153'
        afdeling: Zesde
      - id: ref2
        bwb_id: BWBR0028917
        artikel: '185'
        afdeling: Zevende
      - id: ref3
        bwb_id: BWBR0028917
        artikel: '190'
        afdeling: Negende
  - number: '199'
    text: |-
      De schuldenaar of zijne erfgenamen zijn tot dit verzoek niet ontvankelijk, tenzij bij het verzoekschrift zij
      overgelegd het bewijs, waaruit blijkt, dat alle erkende schuldeischers, ten genoegen van elk hunner, zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel199
  - number: '200'
    text: Van het verzoek wordt aankondiging gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel200
  - number: '201'
    text: |-
      1 Ieder erkend schuldeischer is bevoegd om binnen den tijd van drie maanden na voorschreven aankondiging verzet
      tegen het verzoek te doen, door inlevering van een met redenen omkleed bezwaarschrift ter griffie; de griffier
      geeft hem een bewijs van ontvangst af.

      2 Dit verzet mag alleen daarop gegrond zijn, dat de verzoeker niet behoorlijk aan het voorschrift van
      [artikel 199][ref1] heeft voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel199
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel201
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '199'
        afdeling: Elfde
  - number: '202'
    text: |-
      1 Na verloop van de voormelde drie maanden, zal de rechter in eersten aanleg, om het even of er al dan niet verzet
      is gedaan, het verzoek toestaan of weigeren.

      2 Tegen de beslissing van den rechter in eersten aanleg is eenige voorziening niet toegelaten.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel202
  - number: '203'
    text: |-
      Het vonnis, waarbij de rehabilitatie wordt toegestaan, wordt ter openbare terechtzitting uitgesproken, terwijl mede
      daarvan aanteekening geschiedt in het in [artikel 16][ref1] bedoelde register.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel16
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel203
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '16'
        afdeling: Eerste
  - number: '204'
    text: |-
      De schuldenaar, die voorziet, dat hij met betalen van zijne opeischbare schulden niet zal kunnen voortgaan, kan
      surséance van betaling aanvragen.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel204
  - number: '205'
    text: |-
      1 Hij zal zich daartoe, onder overlegging van een door behoorlijke bescheiden gestaafde staat, als bedoeld in
      [artikel 91][ref1], wenden tot de rechter in eerste aanleg bij een verzoekschrift, in te dienen ter griffie van het
      gerecht in eerste aanleg, in het openbaar lichaam, aangegeven in [artikel 2][ref2].

      2 Bij het verzoekschrift kan een ontwerp van akkoord worden gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel2
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel205
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '91'
        afdeling: Vierde
      - id: ref2
        bwb_id: BWBR0028917
        artikel: '2'
        afdeling: Eerste
  - number: '206'
    text: |-
      1 Het verzoekschrift met bijbehorende stukken wordt ter griffie van het gerecht in eerste aanleg, in het in het
      eerste lid van het voorgaande artikel bedoelde openbaar lichaam, neergelegd. De nederlegging geschiedt kosteloos.

      2 De rechter in eersten aanleg zal dadelijk de gevraagde surséance voorloopig verleenen en een of meer
      bewindvoerders benoemen, ten einde met den schuldenaar het beheer over diens zaken te voeren. Bovendien beveelt
      hij, dat de bekende schuldeischers, benevens de schuldenaar, tegen een door hem op korten termijn bepaalden dag,
      door den griffier bij brieven worden opgeroepen, ten einde, alvorens beslist wordt omtrent het definitief verleenen
      van de gevraagde surséance, op het verzoekschrift te worden gehoord. Behalve de dag worden uur en plaats der
      bijeenkomst daarbij vermeld, alsmede of een ontwerp van akkoord bij het verzoekschrift is gevoegd.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel206
  - number: '207'
    text: |-
      1 De griffier doet van de indiening van het verzoek, van de voorloopige verleening van surséance, van de namen
      en woonplaatsen der benoemde bewindvoerders en van den overeenkomstig het tweede lid van het voorgaande artikel
      bepaalden dag onmiddellijk aankondiging in de Staatscourant.

      2 Indien bij het verzoekschrift een ontwerp van akkoord is gevoegd, wordt daarvan in de aankondiging melding
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel207
  - number: '208'
    text: De surséance wordt geacht te zijn ingegaan bij den aanvang van den dag, waarop zij voorloopig is verleend.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel208
  - number: '209'
    text: |-
      1 Ten bepaalden dage hoort de rechter in eersten aanleg den schuldenaar, de bewindvoerders en de in persoon of bij
      schriftelijk gemachtigde opgekomen schuldeischers. Iedere schuldeischer is bevoegd om, zelfs zonder opgeroepen te
      zijn, op te komen.

      2 De rechter in eersten aanleg kan den schuldenaar definitief surséance verleenen, tenzij zich daartegen verklaren
      hetzij houders van meer dan één vierde van het bedrag der ter vergadering vertegenwoordigde, in [artikel 223][ref1]
      bedoelde, schuldvorderingen, hetzij meer dan één derde der houders van zoodanige vorderingen.

      3 Over de toelating tot de stemming beslist, bij verschil, de rechter in eersten aanleg.

      4 Surséance wordt niet definitief verleend, indien er gegronde vrees bestaat, dat de schuldenaar zal trachten de
      schuldeischers tijdens de surséance te benadeelen of het vooruitzicht niet bestaat, dat hij na verloop van tijd
      zijne schuldeischers zal kunnen bevredigen.

      5 De rechter in eersten aanleg, het verzoek afwijzende, kan bij dezelfde beschikking den schuldenaar in staat van
      faillissement verklaren. Wordt het faillissement niet uitgesproken, dan blijft de voorloopig verleende surséance
      gehandhaafd tot de beschikking van den rechter in eersten aanleg in kracht van gewijsde is gegaan.

      6 Indien eene aanvrage tot faillietverklaring en een verzoek tot surséance gelijktijdig aanhangig zijn, komt eerst
      het laatste in behandeling.

      7 De beschikking op het verzoek is met redenen omkleed en wordt uitgesproken ter openbare terechtzitting.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel223
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel209
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '223'
        afdeling: Eerste
  - number: '210'
    text: |-
      1 Gedurende acht dagen na den dag der uitspraak heeft, in geval van afwijzing van het verzoek, de schuldenaar, of,
      ingeval de surséance verleend is, iedere schuldeischer, die zich niet vóór het verleenen daarvan heeft verklaard,
      recht van hooger beroep.

      2 Het hoger beroep wordt ingesteld door indiening van ene memorie ter griffie van het gerecht in eerste aanleg,
      in het openbaar lichaam, waar op het verzoek tot verlening van surséance is uitspraak gedaan. De griffier geeft
      hiervan aan ieder der opgekomen schuldeischers, als in [artikel 209, eerste lid][ref1], bedoeld, zoomede, indien
      het hooger beroep door een schuldeischer ingesteld is, ook aan den schuldenaar schriftelijk kennis en zendt de in
      [artikel 205][ref2] bedoelde stukken met een afschrift van het terzake opgemaakt proces-verbaal en van het vonnis
      waarvan beroep, zoo spoedig mogelijk aan het Hof van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel209
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel205
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel210
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '209'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0028917
        artikel: '205'
        afdeling: Eerste
  - number: '211'
    text: |-
      1 Bij de behandeling van het hooger beroep wordt het verzoek niet opnieuw in stemming gebracht, maar ieder
      schuldeischer is bevoegd in persoon of bij schriftelijk gemachtigde aan de bestrijding of verdediging van de
      uitspraak, waartegen het beroep gericht is, deel te nemen.

      2 De behandeling heeft plaats in raadkamer; de griffier van het Hof geeft ten minste vijf dagen van te voren aan
      ieder der opgekomen schuldeischers als in [artikel 209, eerste lid][ref1], bedoeld, zoomede aan den schuldenaar,
      schriftelijk kennis van den dag en het uur van de behandeling. De uitspraak geschiedt ter openbare terechtzitting.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel209
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel211
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '209'
        afdeling: Eerste
  - number: '212'
    text: |-
      De beschikking waarbij de surséance definitief wordt toegestaan, wordt aangekondigd op de wijze, in
      [artikel 207][ref1] voorgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel207
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel212
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '207'
        afdeling: Eerste
  - number: 212a
    text: |-
      De griffier van het gerecht in eerste aanleg houdt in elk openbaar lichaam een openbaar register bij met betrekking
      tot surséances van betaling. [Artikel 16][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel16
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel212a
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '16'
        afdeling: Eerste
  - number: '213'
    text: |-
      1 Bij het definitief verleenen der surséance bepaalt de rechter in eersten aanleg haar duur op ten hoogste
      anderhalf jaar.

      2 Vóór het einde der surséance kan door den schuldenaar hare verlenging voor ten hoogste anderhalf jaar worden
      gevraagd. Het verzoek wordt behandeld op dezelfde wijze als een verzoek tot verleening van surséance. Zoolang bij
      afloop der surséance op een verzoek tot verlenging nog niet is beschikt, blijft de surséance gehandhaafd.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel213
  - number: '214'
    text: |-
      1 Indien meer dan één bewindvoerder is benoemd, wordt voor de geldigheid hunner handelingen toestemming der
      meerderheid of bij staking van stemmen eene beslissing van den rechter in eersten aanleg vereischt. Het tweede lid
      van [artikel 66][ref1] vindt overeenkomstige toepassing.

      2 De rechter in eersten aanleg is te allen tijde bevoegd een bewindvoerder, na hem gehoord of behoorlijk opgeroepen
      te hebben, te ontslaan en door een ander te vervangen of hem één of meer bewindvoerders toe te voegen, een en ander
      op verzoek van hem zelven, van de andere bewindvoerders of van een of meer schuldeischers, dan wel ambtshalve.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel66
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel214
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '66'
        paragraaf: '2'
        afdeling: Derde
  - number: '215'
    text: |-
      1 Bij het voorloopig verleenen der surséance kan de rechter in eersten aanleg zoodanige bepalingen maken, als hij
      ter beveiliging van de belangen der schuldeischers noodig oordeelt.

      2 Hij kan dit ook gedurende de surséance doen op verzoek van de bewindvoerders of van één of meer schuldeischers,
      dan wel ambtshalve.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel215
  - number: '216'
    text: |-
      1 De rechter in eersten aanleg is bevoegd bij het voorloopig verleenen der surséance één of meer deskundigen
      te benoemen teneinde binnen een door hem te bepalen termijn, die zoo noodig kan worden verlengd, een onderzoek
      naar den staat van den boedel in te stellen en een beredeneerd verslag van hunne bevinding uit te brengen. Het
      [laatste lid van artikel 215][ref1] vindt overeenkomstige toepassing.

      2 Het verslag van de deskundigen bevat een met redenen omkleed oordeel over de betrouwbaarheid van de door den
      schuldenaar overgelegde staat en bescheiden en over de vraag of er vooruitzicht bestaat, dat de schuldenaar na
      verloop van tijd zijne schuldeischers zal kunnen bevredigen. Het verslag geeft zoo mogelijk de maatregelen aan,
      welke tot die bevrediging kunnen leiden.

      3 De deskundigen leggen hun verslag neder ter griffie van het gerecht in eersten aanleg, ter kostelooze inzage van
      een ieder. De nederlegging geschiedt kosteloos.

      4 Het [laatste lid van artikel 214][ref2] vindt ten aanzien van de deskundigen overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel215
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel214
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel216
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '215'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0028917
        artikel: '214'
        afdeling: Eerste
  - number: '217'
    text: |-
      1 De bewindvoerders brengen, telkens na verloop van drie maanden, een verslag uit over den toestand van den boedel.
      Met dit verslag wordt gehandeld, gelijk in het [derde lid van artikel 216][ref1] is voorgeschreven.

      2 De termijn, bedoeld in het vorige lid, kan door den rechter in eersten aanleg worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel216
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel217
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '216'
        afdeling: Eerste
  - number: '218'
    text: |-
      1 Gedurende de surséance is de schuldenaar onbevoegd eenige daad van beheer of beschikking betreffende den boedel
      te verrichten zonder medewerking machtiging of bijstand van de bewindvoerders. Indien de schuldenaar in strijd
      daarmede gehandeld heeft, zijn de bewindvoerders bevoegd alles te doen, wat vereischt wordt, om den boedel te dier
      zake schadeloos te houden.

      2 Voor verbintenissen van den schuldenaar, zonder medewerking, machtiging of bijstand van de bewindvoerders na
      den aanvang der surséance ontstaan, is de boedel niet aansprakelijk, dan voorzooverre deze tengevolge daarvan is
      gebaat.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel218
  - number: '219'
    text: |-
      1 Indien de schuldenaar in eenige gemeenschap gehuwd is, worden onder den boedel de baten en lasten van die
      gemeenschap begrepen.

      2 De [artikelen 57][ref1] en [58][ref2] vinden overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel58
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel219
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '57'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0028917
        artikel: '58'
        afdeling: Tweede
  - number: '220'
    text: |-
      1 Gedurende de surséance kan de schuldenaar niet tot betaling van zijn in [artikel 223][ref1] bedoelde schulden
      worden genoodzaakt en blijven alle tot verhaal van die schulden aangevangen executies geschorst.

      2 De gelegde beslagen vervallen en de schuldenaar die zich in gijzeling bevindt, wordt daaruit ontslagen, zodra
      de uitspraak, houdende definitieve verlening der surséance of homologatie van het akkoord, in kracht van gewijsde
      is gegaan, beide tenzij de rechter in eerste aanleg op verzoek van de bewindvoerders reeds een vroeger tijdstip
      daarvoor heeft bepaald. De inschrijving van een desbetreffende, op verzoek van de bewindvoerders af te geven,
      verklaring van de rechter in eerste aanleg machtigt de bewaarder van de openbare registers tot doorhaling.

      3 Het eerste en tweede lid vinden geen toepassing ten aanzien van executies en beslagen ten behoeve van vorderingen
      waaraan voorrang is verbonden, voor zover het de goederen betreft, waarop de voorrang rust.

      4 Ter zake van schulden waarvoor het eerste lid geldt, is [artikel 32][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel223
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel32
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel220
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '223'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0028917
        artikel: '32'
        afdeling: Tweede
  - number: '221'
    text: |-
      1 De surséance stuit den loop niet van reeds aanhangige rechtsvorderingen, noch belet het aanleggen van nieuwe.

      2 Indien niettemin de rechtsgedingen blootelijk betreffen de vordering van betaling eener schuld, door den
      schuldenaar erkend, en de aanlegger geen belang heeft om vonnis te verkrijgen, teneinde rechten tegen derden te
      doen gelden, is de rechter bevoegd, na van de erkenning der schuld akte te hebben verleend, het uitspreken van het
      vonnis op te schorten tot na het einde der surséance.

      3 De schuldenaar kan, voor zooveel betreft rechtsvorderingen, welke rechten of verplichtingen tot den boedel
      behoorende ten onderwerp hebben, noch eischende, noch verwerende in rechte optreden, zonder medewerking der
      bewindvoerders.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel221
  - number: '222'
    text: |-
      De surséance werkt niet ten aanzien van:

      1°. vorderingen waaraan voorrang is verbonden, behoudens voor zover zij niet verhaald kunnen worden op de goederen
      waarop de voorrang rust;

      2°. vorderingen wegens kosten van levensonderhoud of van verzorging en opvoeding, verschuldigd krachtens de wet
      en vastgesteld bij overeenkomst of rechterlijke uitspraak, behoudens voor zover het gaat om vóór de aanvang der
      surséance vervallen termijnen, waarvan het gerecht in eerste aanleg het bedrag heeft vastgesteld, waarvoor de
      surséance werkt;

      3°. termijnen van huurkoop.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel222
  - number: '223'
    text: |-
      De betaling van alle andere schulden, bestaande vóór den aanvang der surséance, kan, zoolang de surséance duurt,
      niet anders plaats hebben dan aan alle schuldeischers gezamenlijk, in evenredigheid hunner vorderingen.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel223
  - number: '224'
    text: |-
      1 Degene die zowel schuldenaar als schuldeiser van de boedel is, kan zijn schuld met zijn vordering op de boedel
      verrekenen, indien beide zijn ontstaan vóór de aanvang van de surséance of voortvloeien uit een handeling, vóór de
      aanvang van de surséance met de schuldenaar verricht.

      2 De vordering op de schuldenaar wordt, zo nodig, berekend naar de regels, in de [artikelen 125][ref1] en
      [126][ref2] gesteld.

      3 Van de zijde van de boedel kan geen beroep gedaan worden op
      [artikel 136 van Boek 6 van het Burgerlijk Wetboek BES][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel125
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel126
      [ref3]: https://wetten.overheid.nl/BWBR0028749#Artikel136
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel224
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '125'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0028917
        artikel: '126'
        afdeling: Vijfde
      - id: ref3
        bwb_id: BWBR0028749
        artikel: '136'
  - number: '225'
    text: |-
      1 Niettemin is degene die een schuld aan de boedel of een vordering op de boedel vóór de aanvang van de surséance
      van een derde heeft overgenomen, niet bevoegd tot verrekening, indien hij bij de overneming niet te goeder trouw
      heeft gehandeld.

      2 Na de aanvang van de surséance overgenomen vorderingen of schulden kunnen niet worden verrekend.

      3 De [artikelen 51][ref1] en [52][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel52
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel225
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '51'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0028917
        artikel: '52'
        afdeling: Tweede
  - number: '226'
    text: |-
      1 Indien een wederkerige overeenkomst bij de aanvang van de surséance zowel door de schuldenaar als door zijn
      wederpartij in het geheel niet of slechts gedeeltelijk is nagekomen en de schuldenaar en de bewindvoerder zich niet
      binnen een hun daartoe schriftelijk door de wederpartij gestelde redelijke termijn bereid verklaren de overeenkomst
      gestand te doen, verliezen zij het recht hunnerzijds nakoming van de overeenkomst te vorderen.

      2 Indien de schuldenaar en de bewindvoerder zich wel tot nakoming van de overeenkomst bereid verklaren, stellen
      zij, desverlangd, voor deze nakoming zekerheid.

      3 Het eerste en tweede lid zijn niet van toepassing op overeenkomsten waarbij de schuldenaar slechts verbintenissen
      op zich heeft genomen tot door hem persoonlijk te verrichten handelingen.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel226
  - number: 226a
    text: |-
      Voor vorderingen die de wederpartij uit hoofde van ontbinding of vernietiging van een vóór de aanvang van de
      surséance met de schuldenaar gesloten overeenkomst op deze heeft verkregen, of die strekken tot schadevergoeding
      ter zake van tekortschieten in de nakoming van een vóór de aanvang van de surséance op deze verkregen vordering,
      kan zij opkomen op de voet, in [artikel 223][ref1] bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel223
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel226a
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '223'
        afdeling: Eerste
  - number: '227'
    text: |-
      Indien in het geval van [artikel 226][ref1], de levering van waren, die ter beurze op termijn worden verhandeld,
      bedongen is tegen een vastgesteld tijdstip of binnen een bepaalden termijn, en dit tijdstip invalt of die termijn
      verstrijkt na den aanvang der surséance, wordt de overeenkomst door de voorloopige verleening van surséance,
      ontbonden en kan de wederpartij van den schuldenaar zonder meer voor schadevergoeding opkomen op den voet, in
      [artikel 223][ref2] bepaald. Lijdt de boedel door de ontbinding schade dan is de wederpartij verplicht deze te
      vergoeden.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel226
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel223
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel227
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '226'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0028917
        artikel: '223'
        afdeling: Eerste
  - number: 227a
    text: |-
      1 Zodra de surséance een aanvang heeft genomen, kan zoowel de schuldenaar, die huurkooper is, als de verkooper den
      huurkoop ontbonden verklaren.

      2 Deze ontbinding heeft dezelfde gevolgen als ontbinding der overeenkomst wegens het niet nakomen door den kooper
      van zijne verplichtingen.

      3 De verkooper kan voor het hem verschuldigde bedrag opkomen op den voet als in [artikel 223][ref1] bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel223
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel227a
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '223'
        afdeling: Eerste
  - number: '228'
    text: |-
      1 Zoodra de surséance een aanvang heeft genomen, kan de schuldenaar, die huurder is, met inachtneming van het bij
      [artikel 218 ][ref1]bepaalde, de huur tusschentijds doen eindigen, mits de opzegging geschiede tegen een tijdstip,
      waarop dergelijke overeenkomsten naar plaatselijk gebruik eindigen. Bovendien moet bij de opzegging de daarvoor
      overeengekomen of gebruikelijke termijn in acht genomen worden, met dien verstande echter, dat een termijn van drie
      maanden in elk geval voldoende zal zijn. Zijn de huurpenningen vooruit betaald, dan kan de huur niet eerder worden
      opgezegd dan tegen den dag, waarop de termijn, waarvoor vooruitbetaling heeft plaats gehad, eindigt.

      2 Van den aanvang der surséance af is, de huurprijs boedelschuld.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel218
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel228
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '218'
        afdeling: Eerste
  - number: '229'
    text: |-
      1 Zodra de surséance een aanvang heeft genomen, kan de schuldenaar, met inachtneming van het bij
      [artikel 218][ref1] bepaalde, aan arbeiders in zijn dienst, de dienstbetrekking opzeggen, met inachtneming
      van de overeengekomen of wettelijke termijnen, met dien verstande echter, dat in elk geval de dienstbetrekking
      kan worden geëindigd door opzegging met een termijn van zes weken of, indien de termijn, omschreven in
      [artikel 1615 j, eerste lid van Boek 7A, van het Burgerlijk wetboek BES][ref2] langer is dan zes weken, met
      inachtneming van die termijn.

      2 Zodra de surséance een aanvang heeft genomen, behoeft bij opzegging der dienstbetrekking door arbeiders in dienst
      van de schuldenaar het bepaalde in [artikel 1615 j, eerste lid van Boek 7A, van het Burgerlijk wetboek BES][ref3]
      niet in acht te worden genomen. Van de aanvang der surséance af zijn het loon en de met de arbeidsovereenkomst
      samenhangende premieschulden boedelschuld.

      3 Dit artikel is van overeenkomstige toepassing op agentuurovereenkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel218
      [ref2]: https://wetten.overheid.nl/BWBR0028752#Artikel1615j
      [ref3]: https://wetten.overheid.nl/BWBR0028752#Artikel1615j
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel229
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '218'
        afdeling: Eerste
      - id: ref2
        bwb_id: BWBR0028752
        artikel: 1615j
