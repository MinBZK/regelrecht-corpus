  - number: 56b
    text: |-
      1 Zijn krachtens [artikel 56a][ref1] goederen buiten het faillissement gebleven en heeft de bewindvoerder
      opgehouden de schuldeisers te betalen die deze goederen onbelast met bewind kunnen uitwinnen, dan kan de rechter in
      eerste aanleg die de faillietverklaring heeft uitgesproken op verzoek van ieder van deze schuldeisers die niet in
      het faillissement kunnen opkomen, de curator opdragen ook het beheer van deze goederen op zich te nemen en voor de
      vereffening te hunnen behoeve zorg te dragen.

      2 De bepalingen, betreffende faillietverklaring en faillissement, zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel56a
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel56b
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: 56a
        afdeling: Tweede
  - number: '57'
    text: |-
      1 De echtgenoot van de gefailleerde neemt alle goederen, die hem toebehoren en niet in de gemeenschap vallen,
      terug.

      2 De aanbrengst van de bij huwelijkse voorwaarden buiten de gemeenschap gehouden rechten aan toonder en roerende
      zaken wordt bewezen zoals bij [artikel 130 van Boek 1 van het Burgerlijk wetboek BES][ref1] ten opzichte van derden
      is voorgeschreven.

      3 Van de aan de echtgenoot van de gefailleerde opgekomen rechten aan toonder en roerende zaken, ten aanzien waarvan
      bij uiterste wilsbeschikking van de erflater of bij gift is bepaald dat zij buiten de gemeenschap vallen, moet,
      in geval van geschil, door beschrijving of bescheiden blijken. Hetzelfde geldt voor zodanige rechten en zaken,
      hem staande huwelijk bij erfenis, legaat of schenking opgekomen, die ingevolge de huwelijkse voorwaarden buiten de
      gemeenschap vallen.

      4 De goederen, voortgesproten uit de belegging of wederbelegging van gelden aan de echtgenoot van de gefailleerde
      buiten de gemeenschap toebehorende, worden insgelijks door die echtgenoot teruggenomen, mits de belegging of
      wederbelegging, ingeval van geschil, door voldoende bescheiden, ten genoege van de rechter, zij bewezen.

      5 Indien de goederen aan de echtgenoot van de gefailleerde toebehorende, door de gefailleerde zijn vervreemd, doch
      de koopprijs nog niet is betaald, of wel de kooppenningen nog onvermengd met de failliete boedel aanwezig zijn, kan
      de echtgenoot zijn recht van terugneming op die koopprijs of op de voorhanden kooppenningen uitoefenen.

      6 Voor zijn persoonlijke schuldvorderingen treedt de echtgenoot van de gefailleerde als schuldeiser op.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel130
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '130'
  - number: '58'
    text: |-
      De echtgenoot van de gefailleerde heeft geen aanspraak op de boedel terzake van voordelen bij huwelijkse
      voorwaarden besproken. Wederkerig kunnen de schuldeisers geen genot hebben van de voordelen, die aan de
      gefailleerde bij huwelijkse voorwaarden door zijne echtgenoot zijn toegezegd.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel58
  - number: '59'
    text: |-
      1 Het faillissement van den in eenige gemeenschap van goederen gehuwden echtgenoot wordt als faillissement van
      die gemeenschap behandel. Het omvat, behoudens de uitzonderingen van het eerste lid van [artikel 18][ref1], alle
      goederen, welke in de gemeenschap vallen, en strekt ten behoeve van alle schuldeischers, die op de goederen der
      gemeenschap verhaal hebben. Goederen die de gefailleerde buiten de gemeenschap heeft, strekken slechts tot verhaal
      van schulden die daarop verhaald zouden kunnen worden, indien er generlei gemeenschap was.

      2 De bepalingen in dit besluit vervat omtrent handelingen door den schuldenaar verricht, zijn bij faillissement van
      een in gemeenschap gehuwden echtgenoot, toepasselijk op de handelingen waardoor de gemeenschap wettig verbonden is,
      onverschillig wie van de echtgenooten deze verrichte.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel18
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '18'
        afdeling: Tweede
  - number: 59a
    text: |-
      1 De rechter-commissaris kan op verzoek van elke belanghebbende of ambtshalve bij schriftelijke beschikking bepalen
      dat elke bevoegdheid van derden tot verhaal op tot de boedel behorende goederen of tot opeising van goederen die
      zich in de macht van de gefailleerde of van de curator bevinden, voor een periode van ten hoogste één maand niet
      dan met zijn machtiging kan worden uitgeoefend. De rechter-commissaris kan deze periode éénmaal voor ten hoogste
      één maand verlengen.

      2 De rechter-commissaris kan zijn beschikking beperken tot bepaalde derden en voorwaarden verbinden zowel aan zijn
      beschikking als aan de machtiging van een derde tot uitoefening van een aan deze toekomende bevoegdheid.

      3 Gedurende de in het eerste lid bedoelde perioden lopen aan of door de derden ter zake van hun bevoegdheid
      gestelde termijnen voort, voor zover dit redelijkerwijze noodzakelijk is om de derde dan wel de curator in staat
      te stellen na afloop van de periode zijn standpunt te bepalen. Degene die de termijn heeft gesteld, kan opnieuw een
      redelijke termijn stellen.

      4 De in de eerste volzin van het eerste lid bedoelde beslissing kan ook op verlangen van de aanvrager van het
      faillissement of van de schuldenaar worden gegeven in het vonnis van faillietverklaring.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel59a
  - number: '60'
    text: De rechter-commissaris houdt toezicht op het beheer en de vereffening van den faillieten boedel.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel60
  - number: '61'
    text: |-
      Alvorens in eenige zaak, het beheer of de vereffening van den faillieten boedel betreffende, eene beslissing te
      geven, is het Hof van Justitie verplicht, den rechter-commissaris schriftelijk te hooren.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel61
  - number: '62'
    text: |-
      1 De rechter-commissaris is bevoegd ter opheldering van alle omstandigheden, het faillissement betreffende,
      getuigen te hooren of een onderzoek van deskundigen te bevelen.

      2 De getuigen worden gedagvaard namens den rechter-commissaris.

      3 Bij niet-verschijning of weigering om getuigenis af te leggen, zijn de
      [artikelen 150 tot en met 154 van het Wetboek van Burgerlijke Rechtsvordering BES][ref1] toepasselijk.

      4 De echtgenoot of gewezen echtgenoot, de kinderen en verdere afkomelingen en de ouders en grootouders van den
      gefailleerde mogen zich van het geven van getuigenis verschoonen.


      [ref1]: https://wetten.overheid.nl/BWBR0028496#Artikel150
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0028496
        artikel: '150'
  - number: '63'
    text: |-
      1 Van de beschikkingen van den rechter-commissaris vermeld in de [artikelen 55a, derde lid][ref1], [59a][ref2],
      [64 tweede lid][ref3], [69 eerste lid][ref4], [82][ref5] en [93][ref6] is gedurende vijf dagen hoger beroep op het
      Hof van Justitie.

      2 Het beroep wordt ingesteld door het indienen van een memorie ter griffie van het gerecht in eerste aanleg, in het
      openbaar lichaam waar het faillissement werd uitgesproken. De rechter-commissaris verzendt die memorie, vergezeld
      van zijn schriftelijk bericht, zoo spoedig mogelijk aan het Hof van Justitie.

      3 Tegen de overige beschikkingen van den rechter-commissaris is hoger beroep niet toegelaten.


