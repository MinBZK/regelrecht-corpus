  - number: '17'
    text: |-
      1 Het faillissement omvat het geheele vermogen van den schuldenaar ten tijde van de faillietverklaring, alsmede
      hetgeen hij gedurende het faillissement verwerft.

      2 Is de schuldenaar eene vennootschap onder eene firma, dan omvat het faillissement het geheele vermogen der
      hoofdelijk voor het geheel aansprakelijke vennooten ten tijde van de faillietverklaring, alsmede hetgeen zij
      gedurende het faillissement verwerven.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel17
  - number: '18'
    text: |-
      1 Niettemin blijven buiten het faillissement:

      1°. de zaken, vermeld in
      [artikel 447, onderdelen a tot en met c, van het Wetboek van Burgerlijke Rechtsvordering BES][ref1], de toerusting
      van de leden van de krijgsmacht volgens hun dienst en rang, het auteursrecht in de gevallen waarin het niet vatbaar
      is voor beslag, alsmede hetgeen in het eerste lid van [artikel 448 van genoemd wetboek][ref2] omschreven is, tenzij
      in het faillissement schuldeisers opkomen wegens vorderingen, vermeld in het tweede lid van dat artikel;

      2°. hetgeen de gefailleerde door persoonlijke werkzaamheid, als bezoldiging wegens een ambt of bediening dan
      wel als soldij, riddersoldij, gagement, pensioen, uitkering bij wijze van pensioen of onderstand gedurende het
      faillissement verkrijgt indien en voor zoover de rechter-commissaris zulks bepaalt;

      3°. de gelden, welke aan den gefailleerde verstrekt worden ter voldoening aan een wettelijken onderhoudsplicht;

      4°. Een door de rechter-commissaris te bepalen bedrag uit de opbrengst van het in
      [artikel 253l, eerste en tweede lid, van Boek 1 van het Burgerlijk wetboek BES][ref3] bedoelde vruchtgenot, ter
      bestrijding van de in artikel 253l, derde lid, van Boek 1 van dat wetboek vermelde lasten en van de kosten van
      verzorging en opvoeding van het kind.

      5°. het ingevolge [artikel 642c van het Wetboek van Burgerlijke Rechtsvordering BES][ref4] gestorte bedrag;

      6°. de goederen, bedoeld in [artikel 56a, derde lid][ref5].

      2 In dit artikel wordt onder «gefailleerde» mede begrepen de echtgenoot van en in eenige gemeenschap gehuwden
      gefailleerde.


      [ref1]: https://wetten.overheid.nl/BWBR0028496#Artikel447
      [ref2]: https://wetten.overheid.nl/BWBR0028496#Artikel448
      [ref3]: https://wetten.overheid.nl/BWBR0028743#Artikel253l
      [ref4]: https://wetten.overheid.nl/BWBR0028496#Artikel642c
      [ref5]: https://wetten.overheid.nl/BWBR0028917#Artikel56a
