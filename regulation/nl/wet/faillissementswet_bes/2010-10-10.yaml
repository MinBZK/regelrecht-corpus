  - number: '55'
    text: |-
      Indien de opbrengst niet toereikend is om een pand- of hypotheekhouder of een dergenen wier beperkt recht door de
      executie is vervallen, te voldoen, kan deze voor het ontbrekende als concurrent schuldeiser in de boedel opkomen.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel55
  - number: 55a
    text: |-
      1 De [artikelen 53 tot en met 55][ref1] zijn niet van toepassing, ingeval de hypotheek rust op een luchtvaartuig
      dat teboekstaat in het register, bedoeld in [artikel 1302 van Boek 8 van het Burgerlijk Wetboek BES][ref2], of in
      een verdragsregister als bedoeld in [artikel 1300, onderdeel d, van dat boek][ref3].

      2 Hypotheekhouders wier rechten rusten op luchtvaartuigen als bedoeld in het eerste lid, en andere schuldeisers
      die op grond van [artikel 1317 van Boek 8 van het Burgerlijk Wetboek BES][ref4] een voorrecht op het luchtvaartuig
      hebben, kunnen hun recht uitoefenen, alsof er geen faillissement was. [Artikel 53, tweede en derde lid][ref5], is
      van overeenkomstige toepassing.

      3 De curator kan deze schuldeisers een redelijke termijn stellen om tot uitoefening van hun rechten overeenkomstig
      het tweede lid over te gaan. Heeft de schuldeiser het luchtvaartuig niet binnen deze termijn verkocht, dan kan de
      curator het luchtvaartuig verkopen. De rechter-commissaris kan de termijn op verzoek van de schuldeiser een of meer
      malen verlengen.

      4 Op verkoop door de curator zijn de [artikelen 584d][ref6] en
      [584f tot en met 584q van het Wetboek van Burgerlijke Rechtsvordering BES][ref7] van overeenkomstige toepassing,
      met dien verstande dat de curator wordt aangemerkt als beslaglegger uit hoofde van een vordering die niet van enige
      voorrang is voorzien, en dat met het vonnis van faillietverklaring wordt gehandeld, als voorgeschreven voor het
      proces-verbaal van beslag.

      5 De rechter-commissaris in het faillissement kan in dat geval bepalen dat een door hem vast te
      stellen gedeelte van de algemene faillissementskosten als kosten van de executie in de zin van
      [artikel 584n van het Wetboek van Burgerlijke Rechtsvordering BES][ref8] zal gelden.

      6 De curator kan het luchtvaartuig tot op het tijdstip van de verkoop lossen tegen voldoening van het daarop
      verschuldigde, alsmede van de reeds gemaakte kosten van executie.

      7 [Artikel 55][ref9] is van overeenkomstige toepassing.


