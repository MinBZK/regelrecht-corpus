  - number: '7'
    text: |-
      1 De schuldenaar, die in staat van faillissement is verklaard, heeft, zoo hij op de aanvraag tot faillietverklaring
      niet is gehoord, gedurende acht dagen na den dag van uitspraak recht van verzet.

      2 Indien hij tijdens de uitspraak zich niet in Bonaire, Sint Eustatius of Saba bevindt, heeft hij gedurende een
      maand dat recht.

      3 Het verzet wordt ingesteld door indiening van een verzoekschrift ter griffie van het gerecht in eerste aanleg, in
      het openbaar lichaam Bonaire, Sint Eustatius of Saba, waar de faillietverklaring werd uitgesproken.

      4 De rechter in eersten aanleg bepaalt terstond dag en uur voor de behandeling. De griffier geeft dengene die het
      verzet gedaan heeft, daarvan bij brief kennis. Uiterlijk op den vierden dag, volgende op dien, waarop het verzoek
      is ingediend, wordt op last van den rechter in eersten aanleg van het gedane verzet, alsmede van den tijd voor de
      behandeling bepaald, bij deurwaardersexploot aan den schuldeischer, die het verzoek tot faillietverklaring heeft
      ingediend, en bij brief van den griffier aan het Openbaar Ministerie, op wiens vordering de faillietverklaring is
      uitgesproken, kennis gegeven.

      5 Deze kennisgeving geldt voor oproeping van hem, die de faillietverklaring heeft uitgelokt.

      6 De behandeling geschiedt op de wijze bij [artikel 4][ref1] voorgeschreven.


