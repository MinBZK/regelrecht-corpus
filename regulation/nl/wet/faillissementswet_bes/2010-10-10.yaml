  - number: '13'
    text: |-
      Wordt de faillietverklaring in hoger beroep uitgesproken met vernietiging van een vonnis, waarbij de aangifte of
      aanvrage tot faillietverklaring werd afgewezen, dan geeft de griffier van het Hof van Justitie van die uitspraak
      kennis aan de griffier van het gerecht in eerste aanleg, in de openbare lichamen Bonaire, Sint Eustatius of Saba,
      waar de aangifte of aanvrage is ingediend.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel13
  - number: '14'
    text: |-
      1 Indien de toestand van den boedel daartoe aanleiding geeft, is de rechter-commissaris bevoegd om, na de commissie
      uit de schuldeischers, zoo die er is, te hebben gehoord, de kostelooze behandeling te bevelen.

      2 Indien de toestand van den boedel daartoe aanleiding geeft, is de rechter in eersten aanleg bevoegd om, na de
      commissie uit de schuldeischers, zoo die er is, te hebben gehoord, en na verhoor of behoorlijke oproeping van den
      gefailleerde, bij in het openbaar uitgesproken beschikking de opheffing van het faillissement te bevelen.

      3 De beschikking, bevelende de opheffing van het faillissement, wordt op dezelfde wijze openbaar gemaakt als
      het vonnis van faillietverklaring en daartegen kunnen de schuldenaar en de schuldeischers zoo mede het Openbaar
      Ministerie op dezelfde wijze en binnen dezelfde termijnen opkomen als ten aanzien van het vonnis, waarbij eene
      faillietverklaring is geweigerd.

      4 De rechter, die de opheffing van het faillissement beveelt, stelt tevens het bedrag vast van de
      faillissementskosten en brengt dit bedrag ten laste van den schuldenaar. Zij worden bij voorrang boven alle andere
      schulden voldaan. Tegen deze vaststelling staat een rechtsmiddel niet open. Een bevelschrift van tenuitvoerlegging
      wordt daarvan uitgegeven ten behoeve van den curator.

      5 Indien na een dergelijke opheffing opnieuw aangifte of aanvraag tot faillietverklaring wordt gedaan, is de
      schuldenaar of de aanvrager verplicht om aan te toonen, dat er voldoende baten aanwezig zijn om de kosten van het
      faillissement te bestrijden.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel14
  - number: '15'
    text: |-
      1 Elke in dit besluit bevolen plaatsing in de Staatscourant, geschiedt op kosten van de belanghebbenden.

      2 Alle stukken, opgemaakt ter voldoening aan de bepalingen van dit besluit, zijn vrij van zegel.

      3 Daaronder zijn evenwel niet begrepen de processen-verbaal en akten, houdende verkoop of andere overeenkomsten,
      noch de stukken betrekkelijk andere rechtsgedingen over rechten en verplichtingen van den boedel dan die, welke het
      gevolg zijn van de verwijzing door den rechter-commissaris bedoeld in [artikel 117][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel117
