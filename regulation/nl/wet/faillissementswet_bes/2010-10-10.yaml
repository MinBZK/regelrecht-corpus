        artikel: '43'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0028917
        artikel: '43'
        afdeling: Tweede
  - number: '45'
    text: |-
      1 Rechtsvorderingen, gegrond op de bepalingen der [artikelen 38–44][ref1], worden ingesteld door den curator.

      2 Niettemin kunnen de schuldeischers op gronden, aan de bepalingen ontleend, de toelating van eene vordering
      bestrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel38
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '38'
        afdeling: Tweede
  - number: '46'
    text: |-
      Beëindiging van het faillissement door de homologatie van een akkoord doet de rechtsvorderingen in het
      [vorige artikel][ref1] bedoeld, vervallen, tenzij het akkoord boedelafstand inhoudt, in welk geval zij ten behoeve
      van de schuldeischers vervolgd of ingesteld kunnen worden door de vereffenaars.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel45
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '45'
        afdeling: Tweede
  - number: '47'
    text: |-
      1 Hetgeen door de vernietigde rechtshandeling uit het vermogen van de schuldenaar gegaan is,
      wordt door hen jegens wie de vernietiging werkt, aan de curator teruggegeven met inachtneming van
      [titel 4, afdeling 2, van Boek 6 van het Burgerlijk Wetboek BES][ref1].

      2 Rechten, door derden te goeder trouw anders dan om niet op de terug te geven goederen verkregen, worden
      geëerbiedigd. Tegen een derde te goeder trouw die om niet heeft verkregen, heeft geen terugvordering plaats, voor
      zover hij aantoont dat hij ten tijde van de faillietverklaring niet ten gevolge van de rechtshandeling gebaat was.

      3 Het door de schuldenaar uit hoofde van de vernietigde rechtshandeling ontvangene of de waarde daarvan wordt door
      de curator teruggegeven, voor zover de boedel erdoor is gebaat. Voor het tekortkomende kunnen zij jegens wie de
      vernietiging werkt, als concurrent schuldeiser opkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028749
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0028749
  - number: '48'
    text: |-
      1 Voldoening ná de faillietverklaring, doch vóór de bekendmaking daarvan aan de gefailleerde gedaan, tot nakoming
      van verbintenissen jegens deze vóór de faillietverklaring ontstaan, bevrijdt degene die haar deed, tegenover de
      boedel, zolang zijn bekendheid met de faillietverklaring niet bewezen wordt.

      2 Voldoening als in het eerste lid bedoeld, na de bekendmaking der faillietverklaring aan de gefailleerde gedaan,
      bevrijdt tegenover de boedel alleen dan, indien degene die haar deed, bewijst dat de faillietverklaring te zijner
      woonplaatse langs de weg der wettelijke aankondiging nog niet bekend kon zijn, behoudens het recht van de curator
      om aan te tonen dat zij hem toch bekend was.

      3 In elk geval bevrijdt voldoening aan de gefailleerde de schuldenaar tegenover de boedel, voor zover hetgeen door
      hem voldaan werd, ten bate van de boedel is gekomen.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel48
  - number: '49'
    text: |-
      1 Degene die zowel schuldenaar als schuldeiser van de gefailleerde is, kan zijn schuld met zijn vordering op de
      gefailleerde verrekenen, indien beide zijn ontstaan vóór de faillietverklaring of voortvloeien uit handelingen,
      vóór de faillietverklaring met de gefailleerde verricht.

      2 De vordering op de gefailleerde wordt, zo nodig, berekend naar de regels, in de [artikelen 125][ref1] en
      [126][ref2] gesteld.

      3 De curator kan geen beroep doen op [artikel 136 van Boek 6 van het Burgerlijk Wetboek BES][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel125
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel126
      [ref3]: https://wetten.overheid.nl/BWBR0028749#Artikel136
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '125'
        afdeling: Vijfde
      - id: ref2
        bwb_id: BWBR0028917
        artikel: '126'
        afdeling: Vijfde
      - id: ref3
        bwb_id: BWBR0028749
        artikel: '136'
  - number: '50'
    text: |-
      1 Niettemin is degene die een schuld aan de gefailleerde of een vordering op de gefailleerde vóór de
      faillietverklaring van een derde heeft overgenomen, niet bevoegd tot verrekening, indien hij bij de overneming niet
      te goeder trouw heeft gehandeld.

      2 Na de faillietverklaring overgenomen vorderingen of schulden kunnen niet worden verrekend.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel50
  - number: '51'
    text: |-
      De schuldenaar van de gefailleerde, die zijn schuld wil verrekenen met een vordering aan order of toonder, dient te
      bewijzen dat hij het papier reeds op het ogenblik der faillietverklaring te goeder trouw had verkregen.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel51
  - number: '52'
    text: |-
      Degene die met de gefailleerde deelgenoot is in een gemeenschap waarvan tijdens het faillissement een verdeling
      plaatsvindt, kan toepassing van [artikel 184, eerste lid, van Boek 3 van het Burgerlijk Wetboek BES][ref1]
      verlangen, ook als de schuld van de gefailleerde aan de gemeenschap er een is onder een nog niet vervulde
      opschortende voorwaarde. De [artikelen 125][ref2] en [126][ref3] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel184
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel125
      [ref3]: https://wetten.overheid.nl/BWBR0028917#Artikel126
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel52
