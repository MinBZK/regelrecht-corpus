  - number: 56a
    text: |-
      1 Indien tot het vermogen van de gefailleerde onder bewind staande goederen behoren en zich schuldeisers ter
      verificatie hebben aangemeld die deze goederen onbelast met het bewind kunnen uitwinnen, eist de curator deze
      goederen van de bewindvoerder op, neemt deze onder zijn beheer en maakt deze te gelde, voor zover dit voor de
      voldoening van deze schuldeisers uit de opbrengst nodig is. Door de opeising eindigt het bewind over het goed.
      De opbrengst wordt overeenkomstig deze wet onder deze schuldeisers verdeeld, voor zover zij zijn geverifieerd.
      De curator draagt hetgeen na deze verdeling van de opbrengst over is, aan de bewindvoerder af, tenzij de andere
      schuldeisers de onder bewind staande goederen onder de last van het bewind kunnen uitwinnen, in welk geval het
      restant overeenkomstig deze wet onder deze laatste schuldeisers verdeeld wordt.

      2 Indien zich slechts schuldeisers ter verificatie hebben aangemeld, die de goederen onder de last van het
      bewind kunnen uitwinnen, worden deze goederen door de curator overeenkomstig de [artikelen 96][ref1] of
      [169, vierde en vijfde lid][ref2], onder die last verkocht.

      3 Buiten de gevallen, bedoeld in het eerste en tweede lid, blijven de onder bewind staande goederen buiten het
      faillissement en wordt slechts aan de curator uitgekeerd, hetgeen de goederen netto aan vruchten hebben opgebracht.

      4 De bewindvoerder legt allen tijde, zodra de curator dit verlangt, aan deze rekening en verantwoording af.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel96
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel169
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel56a
    references:
      - id: ref1
