  - number: 29a
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel29a
  - number: '30'
    text: |-
      Indien vóór het faillissement van den schuldenaar de uitwinning van zijne goederen zoover was gevorderd, dat de dag
      van den verkoop reeds was bepaald, is de curator bevoegd om op machtiging van den rechter-commissaris, den verkoop
      voor rekening van den boedel te laten voortgaan.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel30
  - number: '31'
    text: |-
      1 Indien op de dag van de faillietverklaring nog niet alle handelingen die voor een levering door de schuldenaar
      nodig zijn, hebben plaatsgevonden, kan de levering niet geldig meer geschieden.

      2 Heeft de schuldenaar voor de dag van de faillietverklaring een toekomstig goed bij voorbaat geleverd, dan valt
      dit goed, indien het eerst na de aanvang van die dag door hem is verkregen, in de boedel, tenzij het gaat om nog te
      velde staande vruchten of beplantingen, die reeds voor de faillietverklaring uit hoofde van een zakelijk recht of
      een huurovereenkomst aan de schuldenaar toekwamen.

      3 Voor de toepassing van de [artikelen 86][ref1] en [238 van Boek 3 van het Burgerlijk Wetboek BES][ref2] wordt
      degene die van de schuldenaar heeft verkregen, geacht na de bekendmaking van de faillietverklaring, bedoeld in
      [artikel 11, vierde lid][ref3], diens onbevoegdheid te hebben gekend.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel86
      [ref2]: https://wetten.overheid.nl/BWBR0028745#Artikel238
      [ref3]: https://wetten.overheid.nl/BWBR0028917#Artikel11
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '86'
      - id: ref2
        bwb_id: BWBR0028745
        artikel: '238'
      - id: ref3
        bwb_id: BWBR0028917
        artikel: '11'
        afdeling: Eerste
  - number: 31a
    text: |-
      Indien een beding als bedoeld in [artikel 252 van Boek 6 van het Burgerlijk Wetboek BES][ref1], op de
      dag van de faillietverklaring nog niet in de openbare registers was ingeschreven, kan de curator het
      registergoed ten aanzien waarvan het is gemaakt, vrij van het beding overeenkomstig de [artikelen 96][ref2] of
      [169, vierde en vijfde lid][ref3], vervreemden.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel252
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel96
      [ref3]: https://wetten.overheid.nl/BWBR0028917#Artikel169
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '252'
      - id: ref2
        bwb_id: BWBR0028917
        artikel: '96'
        afdeling: Vierde
      - id: ref3
        bwb_id: BWBR0028917
        artikel: '169'
        afdeling: Zevende
  - number: 31b
    text: |-
      Aan een gift, door de schuldenaar gedaan onder een opschortende voorwaarde of een opschortende tijdsbepaling, die
      op de dag van de faillietverklaring nog niet was vervuld of verschenen, ontleent de begiftigde generlei recht tegen
      de boedel.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel31b
  - number: '32'
    text: |-
      1 Ingeval een verjaringstermijn, betreffende een rechtsvordering als bedoeld in [artikel 22][ref1], zou aflopen
      gedurende het faillissement of binnen zes maanden na het einde daarvan, loopt de termijn voort, totdat zes maanden
      na het einde van het faillissement zijn verstreken.

      2 Het eerste lid is van overeenkomstige toepassing op van rechtswege aanvangende vervaltermijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel22
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '22'
        afdeling: Tweede
  - number: 32a
    text: |-
      Ingeval een termijn die vóór de faillietverklaring uit hoofde van [artikel 55, tweede lid, van Boek 3][ref1] of
      van [artikel 88 van Boek 6 van het Burgerlijk Wetboek BES][ref2] aan de schuldenaar was gesteld, ten tijde van de
      faillietverklaring nog niet was verstreken, loopt de termijn voort, voor zover dit redelijkerwijze noodzakelijk
      is om de curator in staat te stellen zijn standpunt te bepalen. De wederpartij kan de curator daartoe een nieuwe
      redelijke termijn stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0028749#Artikel88
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '55'
      - id: ref2
        bwb_id: BWBR0028749
        artikel: '88'
  - number: '33'
    text: |-
      1 Indien een wederkerige overeenkomst ten tijde van de faillietverklaring zowel door de schuldenaar als door zijn
      wederpartij in het geheel niet of slechts gedeeltelijk is nagekomen en de curator zich niet binnen een hem daartoe
      schriftelijk door de wederpartij gestelde redelijke termijn bereid verklaart de overeenkomst gestand te doen,
      verliest de curator het recht zijnerzijds nakoming van de overeenkomst te vorderen.

      2 Indien de curator zich wel tot nakoming van de overeenkomst bereid verklaart, stelt hij bij die verklaring voor
      deze nakoming zekerheid.

      3 Het eerste en tweede lid zijn niet van toepassing op overeenkomsten waarbij de gefailleerde slechts
      verbintenissen op zich heeft genomen tot door hem persoonlijk te verrichten handelingen.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel33
  - number: 33a
    text: |-
      Voor vorderingen die de wederpartij uit hoofde van ontbinding of vernietiging van een vóór de faillietverklaring
      met de schuldenaar gesloten overeenkomst op deze heeft verkregen, of die strekken tot schadevergoeding ter zake
      van tekortschieten in de nakoming van een vóór de faillietverklaring op deze verkregen vordering, kan zij als
      concurrent schuldeiser in het faillissement opkomen.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel33a
  - number: '34'
    text: |-
      Indien in het geval van [artikel 33][ref1], de levering van waren, welke ter beurze op termijn worden verhandeld,
      bedongen is tegen een vastgesteld tijdstip of binnen een bepaalden termijn, en dit tijdstip invalt of die
      termijn verstrijkt na de faillietverklaring, wordt de overeenkomst door de faillietverklaring ontbonden en mag de
      wederpartij van den gefailleerde zonder meer voor schadevergoeding als concurrent schuldeischer opkomen. Lijdt de
      boedel door de ontbinding schade, dan is de wederpartij verplicht deze te vergoeden.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel33
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0028917
        artikel: '33'
        afdeling: Tweede
  - number: 34a
    text: |-
      1 Indien de gefailleerde huurkooper is, kan zoowel de curator als de verkooper den huurkoop ontbonden verklaren.

      2 Deze ontbinding heeft dezelfde gevolgen als ontbinding der overeenkomst wegens het niet nakomen door den kooper
      van zijne verplichtingen.

      3 De verkoper kan voor het hem verschuldigde bedrag als concurrent schuldeischer opkomen.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel34a
  - number: '35'
    text: |-
      Indien de gefailleerde huurder is, kan zoowel de curator als de verhuurder de huur tusschentijds doen eindigen,
      mits de opzegging geschiede tegen een tijdstip, waarop dergelijke overeenkomsten naar plaatselijk gebruik eindigen.
      Bovendien moet bij de opzegging de daarvoor overeengekomen of gebruikelijke termijn in acht genomen worden, met
      dien verstande echter, dat een termijn van drie maanden in elk geval voldoende zal zijn. Zijn er huurpenningen
      vooruitbetaald, dan kan de huur niet eerder opgezegd worden, dan tegen den dag, waarop de termijn, waarvoor
      vooruitbetaling heeft plaats gehad, eindigt. Van den dag van de faillietverklaring af is de huurprijs boedelschuld.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel35
  - number: '36'
    text: |-
      1 Arbeiders in dienst van den gefailleerde kunnen de dienstbetrekking opzeggen, en hun kan wederkeerig
      door den curator de dienstbetrekking opgezegd worden, met inachtneming van de overeengekomen of
      wettelijke termijnen, met dien verstande echter dat in elk geval de dienstbetrekking kan worden geëindigd
      door opzegging met een termijn van zes weken en dat bij opzegging door arbeiders het bepaalde in
      [artikel 1615j, eerste lid van Boek 7A, van het Burgerlijk wetboek BES][ref1] niet in acht behoeft te worden
      genomen. Van den dag der faillietverklaring af zijn het loon en de met de arbeidsovereenkomst samenhangende
      premieschulden boedelschuld.

      2 Dit artikel is van overeenkomstige toepassing op agentuurovereenkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1615j
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1615j
  - number: '37'
    text: |-
      1 De curator aanvaardt erfenissen, gedurende het faillissement aan den gefailleerde opkomende, niet anders dan
      onder voorrecht van boedelbeschrijving.

      2 Tot het verwerpen van eene nalatenschap behoeft de curator machtiging van den rechter-commissaris.
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel37
  - number: '38'
    text: |-
      1 De curator kan ten behoeve van de boedel elke rechtshandeling die de schuldenaar vóór de faillietverklaring
      onverplicht heeft verricht, en waarvan deze bij dit verrichten wist of behoorde te weten dat daarvan
      benadeling van de schuldeisers het gevolg zou zijn, door een buitengerechtelijke verklaring vernietigen.
      [Artikel 50, tweede lid, van Boek 3 van het Burgerlijk Wetboek BES][ref1] is niet van toepassing.

      2 Een rechtshandeling, anders dan om niet, die hetzij meerzijdig is, hetzij eenzijdig en tot een of meer bepaalde
      personen gericht, wordt wegens benadeling slechts vernietigd, indien ook degenen met of jegens wie de schuldenaar
      de rechtshandeling verrichtte, wisten of behoorden te weten dat daarvan benadeling van de schuldeisers het gevolg
      zou zijn.

      3 Wordt een rechtshandeling om niet wegens benadeling vernietigd, dan heeft de vernietiging ten aanzien van de
      bevoordeelde die wist noch behoorde te weten dat van de rechtshandeling benadeling van de schuldeisers het gevolg
      zou zijn, geen werking, voor zover hij aantoont dat hij ten tijde van de faillietverklaring niet ten gevolge van de
      rechtshandeling gebaat was.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel50
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '50'
  - number: '39'
    text: |-
      1 Indien de rechtshandeling waardoor de schuldeisers zijn benadeeld, is verricht binnen een jaar voor de
      faillietverklaring en de schuldenaar zich niet reeds voor de aanvang van die termijn daartoe had verplicht, wordt
      de aan het slot van [artikel 38, eerste lid, eerste volzin][ref1], bedoelde wetenschap, behoudens tegenbewijs,
      vermoed aan beide zijden te bestaan:

      1°. bij overeenkomsten waarbij de waarde der verbintenis aan de zijde van de schuldenaar aanmerkelijk die der
      verbintenis aan de andere zijde overtreft;

      2°. bij rechtshandelingen ter voldoening van of zekerheidstelling voor een niet opeisbare schuld;

      3°. bij rechtshandelingen, door de schuldenaar die een natuurlijk persoon is, verricht met of jegens:

      a. zijn echtgenoot, zijn pleegkind of een bloed- of aanverwant tot in de derde graad;

      b. een rechtspersoon waarin hij, zijn echtgenoot, zijn pleegkind of een bloed- of aanverwant tot in de derde graad
      bestuurder of commissaris is, dan wel waarin deze personen, afzonderlijk of tezamen, als aandeelhouder rechtstreeks
      of middellijk voor ten minste de helft van het geplaatste kapitaal deelnemen;

      4°. bij rechtshandelingen, door de schuldenaar die rechtspersoon is, verricht met of jegens een natuurlijk persoon:

      a. die bestuurder of commissaris van de rechtspersoon is, dan wel met of jegens diens echtgenoot, pleegkind of
      bloed- of aanverwant tot in de derde graad;

      b. die, al dan niet tezamen met zijn echtgenoot, zijn pleegkinderen en zijn bloed- of aanverwanten tot in de derde
      graad, als aandeelhouder rechtstreeks of middellijk voor ten minste de helft van het geplaatste kapitaal deelneemt;

      c. wiens echtgenoot, pleegkinderen of bloed- of aanverwanten tot in de derde graad, afzonderlijk of tezamen, als
      aandeelhouder rechtstreeks of middellijk voor tenminste de helft van het geplaatste kapitaal deelnemen;

      5°. bij rechtshandelingen, door de schuldenaar die rechtspersoon is, verricht met of jegens een andere
      rechtspersoon, indien:

      a. een van deze rechtspersonen bestuurder is van de andere;

      b. een bestuurder, natuurlijk persoon, van een van deze rechtspersonen, of diens echtgenoot, pleegkind of bloed- of
      aanverwant tot in de derde graad, bestuurder is van de andere;

      c. een bestuurder, natuurlijk persoon, of een commissaris van een van deze rechtspersonen, of diens echtgenoot,
      pleegkind of bloed- of aanverwant tot in de derde graad, afzonderlijk of tezamen, als aandeelhouder rechtstreeks of
      middellijk voor ten minste de helft van het geplaatste kapitaal deelneemt in de andere;

      d. in beide rechtspersonen voor ten minste de helft van het geplaatste kapitaal rechtstreeks of middellijk
      wordt deelgenomen door dezelfde rechtspersoon, danwel dezelfde natuurlijke persoon, al dan niet tezamen met zijn
      echtgenoot, zijn pleegkinderen en zijn bloed- of aanverwanten tot in de derde graad;

      6°. bij rechtshandelingen, door de schuldenaar die rechtspersoon is, verricht met of jegens een groepsmaatschappij.

      2 Met een echtgenoot wordt een andere levensgezel gelijkgesteld.

      3 Onder pleegkind wordt verstaan degene die duurzaam als eigen kind is verzorgd en opgevoed.

      4 Onder bestuurder, commissaris of aandeelhouder wordt mede verstaan degene die minder dan een jaar vóór de
      rechtshandeling bestuurder, commissaris of aandeelhouder is geweest.

      5 Indien de bestuurder van een rechtspersoon-bestuurder zelf een rechtspersoon is, wordt deze rechtspersoon met de
      rechtspersoonbestuurder gelijkgesteld.

      6 Een groepsmaatschappij is een vennootschap of rechtspersoon, die met een of meer andere vennootschappen of
      rechtspersonen organisatorisch in een economische eenheid is verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel38
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel39
