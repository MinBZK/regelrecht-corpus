        bwb_id: BWBR0028917
        artikel: '95'
        afdeling: Vierde
  - number: '166'
    text: |-
      1 Indien ter verificatie-vergadering een akkoord niet is aangeboden of indien het aangeboden akkoord is verworpen,
      mag de curator of een ter vergadering aanwezige schuldeischer voorstellen, dat het bedrijf van den gefailleerde
      worde voortgezet.

      2 De commissie uit de schuldeischers, indien deze er is, en, zoo het voorstel is gedaan door een schuldeischer, de
      curator geven hun advies over dit voorstel.

      3 Op verlangen van den curator of van een der aanwezige schuldeischers, stelt de rechter-commissaris de
      beraadslaging en beslissing over het voorstel uit tot eene daartoe op ten hoogste veertien dagen later bepaalde
      vergadering.

      4 De curator geeft onverwijld aan de schuldeischers, die niet ter vergadering aanwezig waren, kennis van deze
      nadere vergadering bij brieven, waarin het ingediende voorstel wordt vermeld en hun tevens de bepaling van
      [artikel 109][ref1] wordt herinnerd.

      5 Op deze vergadering heeft, zoo noodig, tevens de verificatie plaats van de schuldvorderingen, welke na afloop
      van den in [artikel 103, eerste lid, onder 1°][ref2]., bepaalden termijn zijn ingediend en niet reeds ingevolge
      [artikel 123][ref3] geverifieerd zijn.

      6 De curator handelt ten opzichte van deze vorderingen overeenkomstig de bepalingen van de
      [artikelen 106–109][ref4].

      7 Het voorstel is aangenomen, indien de schuldeischers, vertegenwoordigende meer dan de helft der erkende en
      voorwaardelijk toegelaten schuldvorderingen, welke niet door pand, hypotheek of retentierecht zijn gedekt, zich
      daarvóór verklaren.

      8 In dit geval vindt, indien eene commissie uit de schuldeischers niet bestaat, artikel 71 overeenkomstige
      toepassing.

      9 Het proces-verbaal der vergadering vermeldt de namen der verschenen schuldeischers, de door ieder hunner
      uitgebrachte stem, den uitslag van de stemming en al wat verder ter vergadering is voorgevallen.

      10 Gedurende acht dagen kan een ieder ter griffie kosteloos inzage van het proces-verbaal verkrijgen.

      11 De curator en de schuldeischers zijn bevoegd om gedurende acht dagen na afloop van de vergadering aan het Hof
      van Justitie te vragen, alsnog te verklaren, dat het voorstel is aangenomen of verworpen, indien uit de stukken
      zelf blijkt, dat de rechter-commissaris dit ten onrechte als verworpen of aangenomen heeft beschouwd. In dit geval
      is [artikel 144][ref5], tweede lid, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028917#Artikel109
      [ref2]: https://wetten.overheid.nl/BWBR0028917#Artikel103
      [ref3]: https://wetten.overheid.nl/BWBR0028917#Artikel123
      [ref4]: https://wetten.overheid.nl/BWBR0028917#Artikel106
      [ref5]: https://wetten.overheid.nl/BWBR0028917#Artikel144
    url: https://wetten.overheid.nl/BWBR0028917/2010-10-10#Artikel166
