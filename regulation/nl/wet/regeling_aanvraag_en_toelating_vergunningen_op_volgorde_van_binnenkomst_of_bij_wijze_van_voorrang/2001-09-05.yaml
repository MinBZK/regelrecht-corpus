---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_aanvraag_en_toelating_vergunningen_op_volgorde_van_binnenkomst_of_bij_wijze_van_voorrang
regulatory_layer: WET
publication_date: '2003-10-27'
valid_from: '2001-09-05'
bwb_id: BWBR0010035
url: https://wetten.overheid.nl/BWBR0010035/2001-09-05
preamble:
  text: |-
    Gelet op artikel 3.4, eerste lid, van de Telecommunicatiewet en de artikelen 11, 12, 14, en 18 van het
    Frequentiebesluit;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel1
  - number: 1.a
    text: |-
      wet: [Telecommunicatiewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009950
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009950
  - number: 1.b
    text: 'minister: de Minister van Verkeer en Waterstaat.'
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel1
  - number: '2.1'
    text: |-
      Een aanvraag tot verlening van een vergunning voor het gebruik van frequentieruimte door middel van de procedure
      op volgorde van binnenkomst of bij wijze van voorrang, dient te geschieden door middel van een daartoe strekkend
      formulier.
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel2
  - number: '2.2'
    text: |-
      De aanvraag tot verlening van een vergunning voor frequentieruimte alsmede de aanvraag tot wijziging of intrekking
      van een vergunning wordt ingediend bij de divisie Telecom van de Inspectie Verkeer en Waterstaat van het Ministerie
      van Verkeer en Waterstaat. Van aanvragen die betrekking hebben op openbare telecommunicatienetwerken of openbare
      telecommunicatiediensten verstrekt de minister een afschrift aan het college.
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel2
  - number: '2.3'
    text: |-
      Een aanvraag voor de verlening van een vergunning voor het gebruik van frequentieruimte ten dienste van
      singlepoint-singlepoint straalverbindingen, alsmede een aanvraag voor de verlening, wijziging of intrekking
      van een vergunning voor het gebruik van frequentieruimte ten dienste van de maritieme radiocommunicatie of
      voor het gebruik van frequentieruimte ten dienste van het doen van onderzoekingen kan bij de Rijksdienst voor
      Radiocommunicatie worden ingediend langs elektronische weg met gebruikmaking van een daartoe strekkend elektronisch
      aanvraagformulier.
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel2
  - number: '2.4'
    text: |-
      De aanvrager die voor de eerste maal een aanvraag langs elektronische weg als bedoeld in het derde lid indient,
      geeft daarbij een persoonlijke code op en verzendt binnen drie dagen na de datum van elektronische verzending van
      het elektronisch aanvraagformulier aan de divisie Telecom van de Inspectie Verkeer en Waterstaat per gewone post
      een door hem ondertekende schriftelijke verklaring dat hij een aanvraag langs elektronische weg heeft ingediend.
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel2
  - number: '2.5'
    text: |-
      Bij het indienen van een volgende aanvraag langs elektronische weg verstrekt de aanvrager naast de op het
      elektronische aanvraagformulier gevraagde gegevens de persoonlijke code, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel2
  - number: '2.6'
    text: |-
      Voor de verklaring, bedoeld in het vierde lid, gebruikt de aanvrager de door de divisie Telecom van de Inspectie
      Verkeer en Waterstaat opgestelde modelverklaring.
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel2
  - number: '2.7'
    text: |-
      Indien de aanvraag tot verlening van een vergunning betrekking heeft op frequentieruimte die is bestemd voor
      openbare telecommunicatienetwerken of openbare telecommunicatiediensten, kan de minister, naast de gegevens die
      worden gevraagd in het formulier, nadere gegevens vragen aan de aanvrager ter beoordeling van het bepaalde in
      [artikel 3, eerste lid, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010035#Artikel3
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010035
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '3.1'
    text: |-
      Een vergunning voor het gebruik van frequentieruimte die bestemd is voor het aanbieden van openbare
      telecommunicatienetwerken of openbare telecommunicatiediensten dan wel bestemd is voor commerciële omroep wordt
      slechts verleend aan de aanvrager die:
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel3
  - number: 3.1.a
    text: 'voldoet aan de navolgende voorwaarden met betrekking tot zijn financiële positie:'
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel3
  - number: 3.1.a.1º
    text: |-
      de aanvrager verkeert niet in staat van faillissement, noch is een verzoek tot faillietverklaring van de aanvrager
      ingediend,
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel3
  - number: 3.1.a.2º
    text: |-
      de aanvrager is geen surséance van betaling verleend, noch is ten aanzien van de aanvrager surséance van betaling
      aangevraagd,
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel3
  - number: 3.1.a.3º
    text: er is geen beslag gelegd op een of meer bedrijfsmiddelen van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel3
  - number: 3.1.b
    text: |-
      op grond van de in de aanvraag vermelde gegevens naar het oordeel van de minister naar verwachting kan voldoen aan
      het met betrekking tot de vergunning bepaalde.
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel3
  - number: '3.2'
    text: |-
      Een vergunning als bedoeld in het eerste lid wordt slechts verleend als de aanvrager aantoont een redelijk belang
      te hebben bij de gevraagde vergunning.
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel3
  - number: '4.1'
    text: |-
      Een vergunning voor het gebruik van frequentieruimte ten dienste van de maritieme radiocommunicatie wordt verleend
      aan natuurlijke personen van 16 jaar en ouder indien dezen in het bezit zijn van een geldig certificaat van
      bediening of aan rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel4
  - number: '4.2'
    text: |-
      Een vergunning als bedoeld in het eerste lid wordt slechts verleend als de aanvrager aantoont een redelijk belang
      te hebben bij de gevraagde vergunning.
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel4
  - number: '5.1'
    text: |-
      Vergunningen voor het gebruik van frequentieruimte ten dienste van het doen van onderzoekingen worden onderverdeeld
      in de categorieën A, C, en N, welke worden onderscheiden door de voor elk van deze categorieën toegewezen
      frequentiebanden en de toegestane zendvermogens zoals aangegeven in bijlage 1, behorende bij deze regeling.
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel5
  - number: '5.2'
    text: |-
      Een vergunning als bedoeld in het eerste lid van de categorie A of C wordt slechts verleend aan natuurlijke
      personen van 14 jaar en ouder die met goed gevolg het vereiste examen hebben afgelegd dat voor de te onderscheiden
      categorieën verschillend is.
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel5
  - number: '5.3'
    text: |-
      Een vergunning als bedoeld in het eerste lid van de categorie N wordt slechts verleend aan natuurlijke personen van
      12 jaar en ouder die met goed gevolg het voor die categorie vereiste examen hebben afgelegd.
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel5
  - number: '5.4'
    text: |-
      Een vergunning als bedoeld in het eerste lid van de categorie A wordt slechts verleend aan verenigingen van
      radiozendamateurs waarvan het ledental en de samenstelling voldoende representatief is voor de door de vereniging
      te behartigen belangen van de radiozendamateurs.
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel5
  - number: '5.5'
    text: |-
      Een vergunning van de categorie A of C wordt slechts verleend aan onderwijsinstellingen waarvan het doen van
      onderzoekingen met radiozendapparaten essentieel is voor het geven van het onderwijs.
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel5
  - number: '5.6'
    text: |-
      Aan andere aanvragers dan bedoeld in de leden 2 tot en met 5 wordt slechts een vergunning verleend in de categorie
      A, C, of N indien dezen naar het oordeel van de minister geacht kunnen worden op enigerlei wijze in het belang van
      het wetenschappelijk onderzoek van het radiospectrum werkzaam te zijn.
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel5
  - number: '6'
    text: |-
      Een vergunning voor het gebruik van frequentieruimte voor ander gebruik dan bedoeld in de [artikelen 3][ref1]
      tot en met [5][ref2] wordt slechts verleend indien de aanvrager aantoont een redelijk belang te hebben bij de
      gevraagde vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0010035#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010035#Artikel5
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0010035
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0010035
        artikel: '5'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '7'
    text: |-
      De gebruiker van frequentieruimte waarvoor geen vergunning is vereist, zorgt er voor dat door het gebruik
      van het gewenste signaal van het radiozendapparaat geen storing of belemmering wordt veroorzaakt in andere
      radiozendapparaten dan wel in overige elektrische of elektronische apparaten.
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel7
  - number: '8.1'
    text: 'Als categorieën radiozendapparaten, bedoeld in artikel 3.4, eerste lid, onder a, van de wet, worden aangewezen:'
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel8
  - number: 8.1.a
    text: |-
      randapparaten, zijnde koordloze telefoons, die bestemd zijn voor aansluiting op een vast openbaar telefoonnetwerk,
      mits de in bijlage 3 aangegeven frequentiebanden en de daarbij behorende gebruiksvoorschriften in acht worden
      genomen;
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel8
  - number: 8.1.b
    text: randapparaten die bestemd zijn voor aansluiting op een mobiel openbaar telefoonnetwerk;
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel8
  - number: 8.1.c
    text: |-
      radiozendapparaten voor algemene radiocommunicatie in de 27 MHz-frequentieband (CB), mits de in bijlage 3
      aangegeven frequentiebanden en de daarbij behorende gebruiksvoorschriften in acht worden genomen;
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel8
  - number: 8.1.d
    text: |-
      mobiele VHF/UHF radiotelefonen voor landmobiel gebruik die daadwerkelijk en krachtens een daartoe gesloten
      overeenkomst onderdeel zijn van een besloten netwerk, dat deel is van een radionetwerk met dynamische
      frequentietoewijzing ten behoeve waarvan een vergunning is verleend voor het gebruik van frequentieruimte
      (trunkinginstallatie);
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel8
  - number: 8.1.e
    text: |-
      randapparaten bestemd voor aansluiting op een openbaar satellietsysteem, ten behoeve van mobiele communicatie, met
      uitzondering van het nood-, spoed en veiligheidsverkeer;
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel8
  - number: 8.1.f
    text: |-
      mobiele UHF radiotelefonen, werkend in de frequentieband 446 MHz, bedoeld voor algemeen gebruik ten behoeve van
      spraak over korte afstand (PMR 446), mits de in bijlage 3 aangegeven frequentiebanden en de daarbij behorende
      gebruiksvoorschriften in acht worden genomen;
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel8
  - number: 8.1.g
    text: |-
      de in bijlage 2 bedoelde categorieën radiozendapparaten, mits de in die bijlage aangegeven frequentiebanden en de
      daarbij behorende gebruiksvoorschriften in acht worden genomen;
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel8
  - number: 8.1.h
    text: |-
      randapparaten, zijnde satellietgrondstations (SGS), werkend in de frequentiebanden 14.00 GHz tot 14.50 GHz en 29.50
      GHz tot 30.00 GHz, met een maximaal uitgangsvermogen van 2 Watt en een maximaal uitgestraald vermogen van 50 dBWatt
      e.i.r.p. , en geplaatst op een afstand van ten minste 500 meter buiten de begrenzing van een luchtvaartterrein als
      bedoeld in de [Luchtvaartwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002267
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002267
  - number: 8.1.i
    text: |-
      randapparaten voor mobiele communicatie via ionisatiesporen van meteoren, werkend in de frequentieband 39.00 tot
      39.20 MHz, met een maximaal uitgestraald vermogen van 50 Watt e.r.p.  en een kanaalafstand van 25 kHz, alsmede
      een maximale uitzendtijd van 100 milliseconden en een minimale wachttijd van 10 seconden, met een totaal van 24
      uitzendingen per 24 uur.
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel8
  - number: '8.2'
    text: |-
      Onder de aanwijzing, bedoeld in het eerste lid, vallen slechts apparaten die voldoen aan het bij of krachtens het
      [Besluit randapparaten en radioapparaten][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0011261
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011261
  - number: '9'
    text: Deze regeling treedt in werking met ingang van 15 december 1998.
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel9
  - number: '10'
    text: |-
      Deze regeling wordt aangehaald als:
      [Regeling aanvraag en toelating vergunningen op volgorde van binnenkomst of bij wijze van voorrang][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010035
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0010035
