preamble:
  text: |-
    Gelet op artikel 3.4, eerste lid, van de Telecommunicatiewet en de artikelen 11, 12, 14, en 18 van het
    Frequentiebesluit;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. wet: [Telecommunicatiewet][ref1];

      b. minister: de Minister van Verkeer en Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0009950
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009950
  - number: '2'
    text: |-
      1 Een aanvraag tot verlening van een vergunning voor het gebruik van frequentieruimte door middel van de procedure
      op volgorde van binnenkomst of bij wijze van voorrang, dient te geschieden door middel van een daartoe strekkend
      formulier.

      2 De aanvraag tot verlening van een vergunning voor frequentieruimte alsmede de aanvraag tot wijziging of
      intrekking van een vergunning wordt ingediend bij de divisie Telecom van de Inspectie Verkeer en Waterstaat van het
      Ministerie van Verkeer en Waterstaat. Van aanvragen die betrekking hebben op openbare telecommunicatienetwerken of
      openbare telecommunicatiediensten verstrekt de minister een afschrift aan het college.

      3 Een aanvraag voor de verlening van een vergunning voor het gebruik van frequentieruimte ten dienste van
      singlepoint-singlepoint straalverbindingen, alsmede een aanvraag voor de verlening, wijziging of intrekking
      van een vergunning voor het gebruik van frequentieruimte ten dienste van de maritieme radiocommunicatie of
      voor het gebruik van frequentieruimte ten dienste van het doen van onderzoekingen kan bij de Rijksdienst voor
      Radiocommunicatie worden ingediend langs elektronische weg met gebruikmaking van een daartoe strekkend elektronisch
      aanvraagformulier.

      4 De aanvrager die voor de eerste maal een aanvraag langs elektronische weg als bedoeld in het derde lid indient,
      geeft daarbij een persoonlijke code op en verzendt binnen drie dagen na de datum van elektronische verzending van
      het elektronisch aanvraagformulier aan de divisie Telecom van de Inspectie Verkeer en Waterstaat per gewone post
      een door hem ondertekende schriftelijke verklaring dat hij een aanvraag langs elektronische weg heeft ingediend.

      5 Bij het indienen van een volgende aanvraag langs elektronische weg verstrekt de aanvrager naast de op het
      elektronische aanvraagformulier gevraagde gegevens de persoonlijke code, bedoeld in het vierde lid.

      6 Voor de verklaring, bedoeld in het vierde lid, gebruikt de aanvrager de door de divisie Telecom van de Inspectie
      Verkeer en Waterstaat opgestelde modelverklaring.

      7 Indien de aanvraag tot verlening van een vergunning betrekking heeft op frequentieruimte die is bestemd voor
      openbare telecommunicatienetwerken of openbare telecommunicatiediensten, kan de minister, naast de gegevens die
      worden gevraagd in het formulier, nadere gegevens vragen aan de aanvrager ter beoordeling van het bepaalde in
      [artikel 3, eerste lid, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010035#Artikel3
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010035
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '3'
    text: |-
      1 Een vergunning voor het gebruik van frequentieruimte die bestemd is voor het aanbieden van openbare
      telecommunicatienetwerken of openbare telecommunicatiediensten dan wel bestemd is voor commerciële omroep wordt
      slechts verleend aan de aanvrager die:

      a. voldoet aan de navolgende voorwaarden met betrekking tot zijn financiële positie:

      1º. de aanvrager verkeert niet in staat van faillissement, noch is een verzoek tot faillietverklaring van de
      aanvrager ingediend,

      2º. de aanvrager is geen surséance van betaling verleend, noch is ten aanzien van de aanvrager surséance van
      betaling aangevraagd,

      3º. er is geen beslag gelegd op een of meer bedrijfsmiddelen van de aanvrager;

      b. op grond van de in de aanvraag vermelde gegevens naar het oordeel van de minister naar verwachting kan voldoen
      aan het met betrekking tot de vergunning bepaalde.

      2 Een vergunning als bedoeld in het eerste lid wordt slechts verleend als de aanvrager aantoont een redelijk belang
      te hebben bij de gevraagde vergunning.
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel3
  - number: '4'
    text: |-
      1 Een vergunning voor het gebruik van frequentieruimte ten dienste van de maritieme radiocommunicatie wordt
      verleend aan natuurlijke personen van 16 jaar en ouder indien dezen in het bezit zijn van een geldig certificaat
      van bediening of aan rechtspersonen.

      2 Een vergunning als bedoeld in het eerste lid wordt slechts verleend als de aanvrager aantoont een redelijk belang
      te hebben bij de gevraagde vergunning.
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel4
  - number: '5'
    text: |-
      1 Vergunningen voor het gebruik van frequentieruimte ten dienste van het doen van onderzoekingen worden
      onderverdeeld in de categorieën A, C, en N, welke worden onderscheiden door de voor elk van deze categorieën
      toegewezen frequentiebanden en de toegestane zendvermogens zoals aangegeven in bijlage 1, behorende bij deze
      regeling.

      2 Een vergunning als bedoeld in het eerste lid van de categorie A of C wordt slechts verleend aan natuurlijke
      personen van 14 jaar en ouder die met goed gevolg het vereiste examen hebben afgelegd dat voor de te onderscheiden
      categorieën verschillend is.

      3 Een vergunning als bedoeld in het eerste lid van de categorie N wordt slechts verleend aan natuurlijke personen
      van 12 jaar en ouder die met goed gevolg het voor die categorie vereiste examen hebben afgelegd.

      4 Een vergunning als bedoeld in het eerste lid van de categorie A wordt slechts verleend aan verenigingen van
      radiozendamateurs waarvan het ledental en de samenstelling voldoende representatief is voor de door de vereniging
      te behartigen belangen van de radiozendamateurs.

      5 Een vergunning van de categorie A of C wordt slechts verleend aan onderwijsinstellingen waarvan het doen van
      onderzoekingen met radiozendapparaten essentieel is voor het geven van het onderwijs.

      6 Aan andere aanvragers dan bedoeld in de leden 2 tot en met 5 wordt slechts een vergunning verleend in de
      categorie A, C, of N indien dezen naar het oordeel van de minister geacht kunnen worden op enigerlei wijze in het
      belang van het wetenschappelijk onderzoek van het radiospectrum werkzaam te zijn.
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel5
  - number: '6'
    text: |-
      Een vergunning voor het gebruik van frequentieruimte voor ander gebruik dan bedoeld in de [artikelen 3][ref1]
      tot en met [5][ref2] wordt slechts verleend indien de aanvrager aantoont een redelijk belang te hebben bij de
      gevraagde vergunning.


