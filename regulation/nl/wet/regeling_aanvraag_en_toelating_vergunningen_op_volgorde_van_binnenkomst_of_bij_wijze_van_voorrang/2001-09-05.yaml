  - number: '7'
    text: |-
      De gebruiker van frequentieruimte waarvoor geen vergunning is vereist, zorgt er voor dat door het gebruik
      van het gewenste signaal van het radiozendapparaat geen storing of belemmering wordt veroorzaakt in andere
      radiozendapparaten dan wel in overige elektrische of elektronische apparaten.
    url: https://wetten.overheid.nl/BWBR0010035/2001-09-05#Artikel7
  - number: '8'
    text: |-
      1 Als categorieën radiozendapparaten, bedoeld in artikel 3.4, eerste lid, onder a, van de wet, worden aangewezen:

      a. randapparaten, zijnde koordloze telefoons, die bestemd zijn voor aansluiting op een vast openbaar
      telefoonnetwerk, mits de in bijlage 3 aangegeven frequentiebanden en de daarbij behorende gebruiksvoorschriften in
      acht worden genomen;

      b. randapparaten die bestemd zijn voor aansluiting op een mobiel openbaar telefoonnetwerk;

      c. radiozendapparaten voor algemene radiocommunicatie in de 27 MHz-frequentieband (CB), mits de in bijlage 3
      aangegeven frequentiebanden en de daarbij behorende gebruiksvoorschriften in acht worden genomen;

      d. mobiele VHF/UHF radiotelefonen voor landmobiel gebruik die daadwerkelijk en krachtens een daartoe gesloten
      overeenkomst onderdeel zijn van een besloten netwerk, dat deel is van een radionetwerk met dynamische
      frequentietoewijzing ten behoeve waarvan een vergunning is verleend voor het gebruik van frequentieruimte
      (trunkinginstallatie);

      e. randapparaten bestemd voor aansluiting op een openbaar satellietsysteem, ten behoeve van mobiele communicatie,
      met uitzondering van het nood-, spoed en veiligheidsverkeer;

      f. mobiele UHF radiotelefonen, werkend in de frequentieband 446 MHz, bedoeld voor algemeen gebruik ten behoeve
      van spraak over korte afstand (PMR 446), mits de in bijlage 3 aangegeven frequentiebanden en de daarbij behorende
      gebruiksvoorschriften in acht worden genomen;

      g. de in bijlage 2 bedoelde categorieën radiozendapparaten, mits de in die bijlage aangegeven frequentiebanden en
      de daarbij behorende gebruiksvoorschriften in acht worden genomen;

      h. randapparaten, zijnde satellietgrondstations (SGS), werkend in de frequentiebanden 14.00 GHz tot 14.50 GHz
      en 29.50 GHz tot 30.00 GHz, met een maximaal uitgangsvermogen van 2 Watt en een maximaal uitgestraald vermogen
      van 50 dBWatt e.i.r.p. , en geplaatst op een afstand van ten minste 500 meter buiten de begrenzing van een
      luchtvaartterrein als bedoeld in de [Luchtvaartwet][ref1];

      i. randapparaten voor mobiele communicatie via ionisatiesporen van meteoren, werkend in de frequentieband 39.00
      tot 39.20 MHz, met een maximaal uitgestraald vermogen van 50 Watt e.r.p.  en een kanaalafstand van 25 kHz, alsmede
      een maximale uitzendtijd van 100 milliseconden en een minimale wachttijd van 10 seconden, met een totaal van 24
      uitzendingen per 24 uur.

      2 Onder de aanwijzing, bedoeld in het eerste lid, vallen slechts apparaten die voldoen aan het bij of krachtens het
      [Besluit randapparaten en radioapparaten][ref2] bepaalde.


