    text: |-
      De [artikelen 11 tot en met 16][ref1] zijn van overeenkomstige toepassing als krachtens
      [artikel 10, tweede lid][ref2], een brug of krachtens [artikel 10, derde lid][ref3], een tunnel in beheer overgaat.


