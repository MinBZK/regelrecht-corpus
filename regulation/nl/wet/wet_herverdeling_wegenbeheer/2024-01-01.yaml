  - number: '6'
    text: |-
      1 De in [artikel 3, tweede lid, onderdeel ][ref1], bedoelde aanwijzing geschiedt zodanig dat, tenzij naar de mening
      van provinciale staten om redenen van praktische aard anders moet worden besloten, op de overgangsdatum een brug
      die mede een functie vervult voor een in beheer overgaande weg, in beheer zal zijn bij

      a. het Rijk, als het Rijk op de overgangsdatum de weg of een van de andere over of onder deze weg geleide wegen of
      oppervlaktewateren in beheer zal hebben en de kosten wegens beheer en onderhoud ten laste komen van hoofdstuk XII
      (Verkeer en Waterstaat) van de Rijksbegroting of van een onder de zorg van Onze Minister vallend fonds, of

      b. in het geval dat *a* niet van toepassing is, de provincie, als de provincie op de overgangsdatum de weg of een
      van de andere over of onder deze weg geleide wegen of oppervlaktewateren in beheer zal hebben, of

      c. in het geval dat *a* en *b* niet van toepassing zijn, de gemeente waar de brug is gelegen, als

      1. de gemeente, of

      2. een openbaar lichaam dat onder toepassing van de [Wet gemeenschappelijke regelingen][ref2] is ingesteld, met de
      gemeente als deelnemer aan de desbetreffende gemeenschappelijke regeling,

      op de overgangsdatum de weg of een van de andere over of onder deze weg geleide wegen of oppervlaktewateren in
      beheer zal hebben.

      2 Het eerste lid is niet van toepassing, als een in beheer overgaande weg krachtens [artikel 5][ref3], of krachtens
      [artikel 4, vierde lid][ref4], in het herverdelingsplan wordt opgenomen.

      3 Als een brug over een in beheer overgaande weg ligt of als op een brug een in beheer overgaande weg ligt, en
      de nieuwe beheerder van de weg met de beheerder van de brug en de andere bij de brug betrokken beheerders van
      wegen en oppervlaktewateren blijkens een tijdig aan provinciale staten gezonden mededeling is overeengekomen bij
      wie van hen de brug op de overgangsdatum in beheer zal zijn, wordt bij de vaststelling van het herverdelingsplan
      deze overeenkomst, zonodig in afwijking van het eerste lid, in acht genomen, en wordt de brug zonodig via de in
      [artikel 3, tweede lid, onderdeel ][ref5], bedoelde nadere aanduiding in het herverdelingsplan opgenomen of zonodig
      in het in [artikel 3, tweede lid, onderdeel ][ref6], bedoelde onderdeel van het herverdelingsplan opgenomen.

      4 Als een tunnel door of onder een in beheer overgaande weg ligt of als in een tunnel een in beheer
      overgaande weg ligt, en de nieuwe beheerder van de weg met de beheerder van de tunnel en de andere
      bij de tunnel betrokken beheerders van wegen en oppervlaktewateren blijkens een tijdig aan provinciale
      staten gezonden mededeling zijn overeengekomen bij wie van hen de tunnel op de overgangsdatum van de
      weg in beheer zal zijn, wordt deze overeenkomst in acht genomen en wordt de tunnel zonodig via de in
      [artikel 3, tweede lid, onderdeel ][ref7], bedoelde nadere aanduiding in het herverdelingsplan opgenomen of zonodig
      in het in [artikel 3, tweede lid, onderdeel ][ref8], bedoelde onderdeel van het herverdelingsplan opgenomen.

      5 In geval een brug in beheer is bij een openbaar lichaam dat is gevormd onder toepassing van de
      [Wet gemeenschappelijke regelingen][ref9], en het publiekrechtelijke lichaam bij welk krachtens het eerste lid
      de brug in beheer zou komen, voor het beheer van bruggen als de bedoelde brug deelneemt aan de gemeenschappelijke
      regeling, wordt de brug niet in het herverdelingsplan opgenomen.


