  - number: '9'
    text: |-
      Tegen het besluit, bedoeld in [artikel 3, eerste lid][ref1], kunnen belanghebbende beheerders met uitzondering van
      de provincie binnen zes weken na de datum van de in [artikel 8][ref2] bedoelde toezending van het besluit beroep op
      de Kroon instellen.


