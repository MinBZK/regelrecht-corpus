      1 De in [artikel 3, tweede lid, onderdeel ][ref1], bedoelde aanduiding geschiedt wat de in subonderdeel 2 bedoelde
      uitzondering en de in de subonderdeel 3 bedoelde uitbreiding betreft, op voorstel van de oude beheerder in
      overeenstemming met de nieuwe beheerder.

      2 Het eerste lid is van overeenkomstige toepassing op de in de subonderdelen 2 en 3 van
      [artikel 3, tweede lid, onderdeel ][ref2], bedoelde uitzondering en uitbreiding.


