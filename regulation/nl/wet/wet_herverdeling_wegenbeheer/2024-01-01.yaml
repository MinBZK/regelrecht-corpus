  - number: '3'
    text: |-
      1 Provinciale staten stellen, uiterlijk acht weken voor de overgangsdatum, een herverdelingsplan vast.

      2 Het herverdelingsplan bevat:

      a. de aanwijzing, voor zover dat krachtens de [artikelen 4][ref1] en [5][ref2] noodzakelijk is, van de wegen die
      met ingang van de overgangsdatum in beheer overgaan, waarbij van elk van de in beheer overgaande wegen de oude en
      de nieuwe beheerder worden vermeld;

      b. van elk van de krachtens onderdeel *a* aangewezen wegen een zodanige nadere aanduiding met zo nodig een kaart
      van de weg en met zo nodig een tekening van het dwarsprofiel dat duidelijk wordt

      1. tot welke grens het overgaande weggebied zich uitstrekt,

      2. welke onder de zorg van de oude beheerder vallende bijbehorende werken en bijbehorende voorzieningen voor het
      wegverkeer binnen de grens van het overgaande gebied niet onder de zorg van de nieuwe beheerder van de weg komen te
      vallen, en

      3. welke onder de zorg van de oude beheerder vallende bijbehorende werken en bijbehorende voorzieningen voor het
      wegverkeer buiten het overgaande gebied onder de zorg van de nieuwe beheerder van de weg komen te vallen;

      c. de aanwijzing, voor zover dat krachtens [artikel 6, eerste tot en met derde lid][ref3], noodzakelijk is, van
      de bruggen die met ingang van de overgangsdatum in beheer overgaan, waarbij van elk van de in beheer overgaande
      bruggen de oude en de nieuwe beheerder van de brug worden vermeld;

      d. van elk van de krachtens onderdeel *c* aangewezen bruggen een zodanige nadere aanduiding met zo nodig een
      bijbehorende kaart en met zo nodig een tekening dat duidelijk wordt

      1. de begrenzing van het overgaande object,

      2. welke onder de zorg van de oude beheerder van de brug vallende bijbehorende werken en voorzieningen binnen de
      begrenzing van het overgaande object niet onder de zorg van de nieuwe beheerder van de brug komen te vallen, en

      3. welke onder de zorg van de oude beheerder van de brug vallende bijbehorende werken en voorzieningen buiten de
      begrenzing van het overgaande object onder de zorg van de nieuwe beheerder van de brug komen te vallen;

      e. de aanwijzing, voor zover dat krachtens [artikel 6, vierde lid][ref4], noodzakelijk is, van de tunnels die met
      ingang van de overgangsdatum in beheer overgaan, waarbij van elk van de in beheer overgaande tunnels de oude en de
      nieuwe beheerder van de tunnel worden vermeld, en waarbij voor de nadere aanduiding van de tunnel onderdeel *d* van
      dit lid juncto [artikel 7][ref5] van overeenkomstige toepassing is;

      f. van elk van de krachtens onderdeel *a*, onderscheidenlijk onderdeel *c*, onderscheidenlijk onderdeel *e*
      aangewezen wegen, bruggen en tunnels met overgaande bijbehorende werken en voorzieningen voor het wegverkeer
      een aanduiding van de onroerende zaken en van de rechten waaraan onroerende zaken zijn onderworpen, voor zover
      die zaken en rechten toebehoren aan de oude beheerder en na de beheersovergang dienen over te gaan op de nieuwe
      beheerder.


