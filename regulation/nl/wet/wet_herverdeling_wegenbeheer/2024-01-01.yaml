  - number: '25'
    text: |-
      1 Wie ten tijde van de beheersovergang van een weg een gebruik maakt dat bij de beheerregeling van de oude
      beheerder niet is verboden, en bij de beheerregeling van de nieuwe beheerder niet of slechts onder beschikking
      is toegestaan, mag dat gebruik in elk geval de eerste zes maanden ongewijzigd voortzetten en, mits hij binnen die
      zes maanden een beschikking heeft aangevraagd, het gebruik in elk geval ongewijzigd voortzetten totdat de nieuwe
      beheerder op de aanvraag heeft beslist.

      2 De door de oude beheerder verleende beschikking voor een gebruik van een weg waarvoor bij de beheerregeling van
      de nieuwe beheerder eveneens een beschikking is vereist, staat gelijk met een door de nieuwe beheerder verleende
      beschikking. De nieuwe beheerder mag de beschikking met de daartoe behorende voorschriften in de eerste twaalf
      maanden niet ambtshalve wijzigen of intrekken, tenzij wordt gehandeld in strijd met de beschikking.
    url: https://wetten.overheid.nl/BWBR0005697/2024-01-01#Artikel25
  - number: '26'
    text: |-
      [Artikel 25][ref1] is van overeenkomstige toepassing als krachtens [artikel 10, tweede lid][ref2], een brug of
      krachtens [artikel 10, derde lid][ref3], een tunnel in beheer overgaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005697#Artikel25
