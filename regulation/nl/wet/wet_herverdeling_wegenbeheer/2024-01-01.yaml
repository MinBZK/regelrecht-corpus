  - number: '10'
    text: |-
      1 Met ingang van een bij koninklijk besluit te bepalen datum

      a. gaat elk van de in de herverdelingsplannen aangewezen en nader aangeduide wegen in beheer over naar de in het
      herverdelingsplan aangewezen nieuwe beheerder,

      b. komen de onder de zorg van de oude beheerder vallende bijbehorende werken en voorzieningen voor het wegverkeer
      binnen de grens van het overgaande gebied te vallen onder de zorg van de nieuwe beheerder, voor zover zij niet
      krachtens [artikel 3, tweede lid, onderdeel ][ref1], zijn uitgezonderd, en

      c. komen de krachtens [artikel 3, tweede lid, onderdeel ][ref2], aangeduide bijbehorende werken en voorzieningen te
      vallen onder de zorg van de nieuwe beheerder.

      2 Met ingang van de, krachtens het eerste lid vastgestelde, overgangsdatum

      a. gaat elk van de in de herverdelingsplannen aangewezen en nader aangeduide bruggen zonder de op de brug gelegen
      weg in beheer over naar de in het herverdelingsplan aangewezen nieuwe beheerder van de brug,

      b. komen de onder de zorg van de oude beheerder van de brug vallende bijbehorende werken en voorzieningen binnen
      de begrenzing van het overgaande object te vallen onder de zorg van de nieuwe beheerder van de brug, voor zover zij
      niet krachtens [artikel 3, tweede lid, onderdeel ][ref3], zijn uitgezonderd, en

      c. komen de krachtens [artikel 3, tweede lid, onderdeel ][ref4], aangeduide bijbehorende werken en voorzieningen te
      vallen onder de zorg van de nieuwe beheerder.

      3 Het tweede lid is van overeenkomstige toepassing op de krachtens [artikel 3, tweede lid, onderdeel ][ref5],
      aangewezen en nader aangeduide tunnels.

      4 Met ingang van de dag voor de overgangsdatum worden de in de herverdelingsplannen opgenomen wegen die behoren
      tot de in [artikel 2, tweede lid, onderdeel ][ref6], subonderdeel 1, bedoelde categorie, openbaar in de zin van
      de [Wegenwet][ref7], indien zij niet uit andere hoofde inmiddels openbaar in de zin van de [Wegenwet][ref8] zijn
      geworden.


