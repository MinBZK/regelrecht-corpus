  - number: '2'
    text: |-
      1 De wegen onderscheidenlijk bruggen in de zin van deze wet zijn alleen de wegen onderscheidenlijk bruggen die
      in beheer zijn bij het Rijk, een provincie, een gemeente of een waterschap, alsmede bij een openbaar lichaam
      dat onder toepassing van de [Wet gemeenschappelijke regelingen][ref1] (*Stb.* 1984, 669) is ingesteld, met
      dien verstande dat door toepassing van [artikel 5, derde lid][ref2], ook andere wegen en door toepassing van
      [artikel 6, derde lid][ref3], ook andere bruggen onder de werking van deze wet kunnen worden gebracht.

      2 Deze wet is niet van toepassing op:

      a. wegen onderscheidenlijk bruggen in beheer bij het Rijk waarvan het beheer en onderhoud niet ten laste komt van
      een onder de zorg van Onze Minister vallend fonds of van Hoofdstuk XII (Verkeer en Waterstaat) dan wel Hoofdstuk IX
      B (Financiën) van de Rijksbegroting;

      b. wegen die op 1 januari 1987 niet openbaar waren in de zin van de [Wegenwet][ref4] (*Stb.* 1930, 342), tenzij

      1. a. de weg na 1 januari 1977 tot stand is gebracht, en

      b. de weg gedurende het tijdvak tussen de openstelling voor het verkeer en 1 januari 1987 voor een ieder
      toegankelijk is geweest, en gedurende dat tijdvak door het Rijk, een provincie, een gemeente of een waterschap is
      onderhouden, en

      c. de in [artikel 4, tweede lid, van de Wegenwet][ref5] bedoelde uitzondering niet van toepassing is geweest; of

      2. a. de weg na 1 januari 1987 tot stand is gebracht, en

      b. de weg op de dag voor de datum van vaststelling van het herverdelingsplan openbaar is in de zin van de
      [Wegenwet][ref6].


