  - number: '31'
    text: |-
      1 Een gemeente die op de in [artikel 30, tweede lid][ref1], bedoelde lijst voorkomt, verschaft met inachtneming van
      de lijst uitkeringen aan de in de lijst genoemde andere onderhoudsplichtigen.

      2 De uitkering wordt, tenzij de gemeente en de andere onderhoudsplichtige anders zijn overeengekomen, verstrekt in
      vier zo veel mogelijk gelijke kwartaalbetalingen.

      3 Een gemeente die op de in [artikel 30, vijfde lid][ref2], bedoelde lijst voorkomt, verschaft met inachtneming van
      de lijst gedurende de eerste vijf jaar na de overgangsdatum jaarlijks een uitkering aan degene die een of meer van
      de betrokken veerverbindingen verzorgt.

      4 Op de in het derde lid bedoelde uitkering is het tweede lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005697#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0005697#Artikel30
