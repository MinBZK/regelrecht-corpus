  - number: '18'
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

      a. personeelslid: degene die op de dag voor de overgangsdatum bij de oude beheerder in vaste of in tijdelijke
      dienst is aangesteld dan wel op arbeidsovereenkomst in dienst is en die uitsluitend of nagenoeg uitsluitend
      werkzaam is ten behoeve van het beheer van in beheer overgaande wegen of bruggen en wiens functie bij de oude
      beheerder als gevolg van deze overgang vervalt, mits de aanstelling in tijdelijke dienst, onderscheidenlijk de
      arbeidsovereenkomst een dienstverband betreft dat bij wijze van proef, dan wel voor een proeftijd, dan wel anders
      dan voor een vaste of kennelijk bepaalde tijd tot stand is gebracht;

      b. Sociaal Statuut: het op 15 augustus 1990 door Onze Minister vastgestelde Sociaal Statuut Herverdeling
      Wegenbeheer;

      c. provinciaal plaatsingsplan: een provinciaal plaatsingsplan als bedoeld in de artikelen 4.2 juncto 4.3 van het
      Sociaal Statuut.
    url: https://wetten.overheid.nl/BWBR0005697/2024-01-01#Artikel18
  - number: '19'
    text: |-
      1 De oude beheerder biedt, tenzij het provinciaal plaatsingsplan niet voorziet in een mogelijkheid tot plaatsing
      bij een van de nieuwe beheerders, namens een nieuwe beheerder het personeelslid een functie aan bij die nieuwe
      beheerder.

      2 Het in het eerste lid bedoelde aanbod dient een functie te betreffen die

      a. het personeelslid in verband met zijn persoonlijkheid en omstandigheden redelijkerwijs kan worden opgedragen,

      b. zoveel mogelijk overeenkomt met de functie van het personeelslid in dienst bij de oude beheerder, en

      c. wat de in de artikelen 4.22 tot en met 4.29 van het Sociaal Statuut bedoelde arbeidsvoorwaarden betreft kan
      worden aangegaan onder voorwaarden die in hun geheel beschouwd niet ongunstiger zijn dan die welke voor het
      personeelslid golden uit hoofde van zijn dienstverband bij de oude beheerder op de dag voor de overgangsdatum.

      3 Als het provinciaal plaatsingsplan niet voorziet in een mogelijkheid tot plaatsing bij een van de nieuwe
      beheerders, doet de oude beheerder, mede namens de nieuwe beheerders, hiervan mededeling aan het personeelslid.

      4 Het personeelslid dat bezwaar heeft tegen het aanbod, bedoeld in het eerste lid, of tegen de mededeling,
      bedoeld in het derde lid, kan binnen dertig dagen na de dag waarop het aanbod dan wel de mededeling is gedaan,
      een bezwaarschrift indienen bij de oude beheerder. De oude beheerder neemt, in overeenstemming met de nieuwe
      beheerder dan wel beheerders, over het bezwaar geen beslissing dan nadat hij advies heeft ingewonnen bij een
      bezwarencommissie zoals bedoeld in artikel 4.36 van het Sociaal Statuut.
    url: https://wetten.overheid.nl/BWBR0005697/2024-01-01#Artikel19
  - number: '20'
    text: |-
      1 Het personeelslid dat niet tijdig bezwaar heeft gemaakt tegen het aanbod, bedoeld in
      [artikel 19, eerste lid][ref1], en het personeelslid dat binnen twee weken na ontvangst van de afwijzende
      beslissing op het bezwaarschrift aan de oude beheerder laat weten dat hij het aanbod alsnog aanvaardt, gaat met
      ingang van de overgangsdatum over in dienst bij de nieuwe beheerder in een dienstverband van tenminste dezelfde
      aard als voor het personeelslid op de dag voor de overgangsdatum gold.

      2 Door de overgang in dienst bij de nieuwe beheerder is het personeelslid van rechtswege eervol ontslagen uit de
      dienst van de oude beheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0005697#Artikel19
    url: https://wetten.overheid.nl/BWBR0005697/2024-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005697
        artikel: '19'
        hoofdstuk: IV
  - number: '21'
    text: |-
      1 Onze Minister stelt nadere regels betreffende het aanbieden van functies aan personeelsleden, het in dienst
      overgaan, de arbeidsvoorwaarden voor een in dienst overgaand personeelslid, de om-, her- en bijscholing van een
      personeelslid en het behandelen van bezwaren van een personeelslid.

      2 Alvorens de nadere regels vast te stellen pleegt Onze Minister overleg met het Interprovinciaal Overleg,
      de Vereniging van Nederlandse Gemeenten en de Unie van Waterschappen en met de in de Centrale Commissie voor
      Georganiseerd Overleg in Ambtenarenzaken vertegenwoordigde centrales van verenigingen van ambtenaren.
    url: https://wetten.overheid.nl/BWBR0005697/2024-01-01#Artikel21
  - number: '22'
    text: |-
      1 Indien ingevolge [artikel 4, tweede lid][ref1], of [artikel 4, zesde lid][ref2], een waterschap op de
      overgangsdatum wegen in beheer heeft, verstrekt elk van de gemeenten waar door het waterschap beheerde wegen zijn
      gelegen, aan het waterschap jaarlijks een bijdrage in de kosten van de wegenzorg.

      2 De bijdrage wordt, tenzij de gemeente en het waterschap anders zijn overeengekomen, in vier zo veel mogelijk
      gelijke kwartaalbetalingen uitgekeerd.

      3 Bij algemene maatregel van bestuur wordt de hoogte van de bijdrage vastgesteld die de gemeente in het eerste jaar
      waarin de overgangsdatum valt, moet verstrekken.

      4 Met ingang van het eerste jaar na het jaar waarin de overgangsdatum valt, wordt gedurende twintig jaar de
      bijdrage jaarlijks verhoogd met een bedrag gelijk aan 3,125% van de bijdrage die in het eerste jaar waarin de
      overgangsdatum valt, is verstrekt.

      5 Met ingang van het eerste jaar na het jaar waarin de overgangsdatum valt, bedraagt de bijdrage het resultaat
      van een berekening waarbij het bedrag van de bijdrage in het voorgaande jaar, na toepassing van het vorige lid,
      wordt verhoogd onderscheidenlijk verlaagd met het percentage waarmee het Gemeentefonds in het uitkeringsjaar in
      verband met algemene loon- en prijswijzigingen groeit onderscheidenlijk afneemt ten opzichte van het voorgaande
      uitkeringsjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005697#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005697#Artikel4
    url: https://wetten.overheid.nl/BWBR0005697/2024-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005697
        artikel: '4'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005697
        artikel: '4'
        hoofdstuk: II
  - number: '23'
    text: |-
      Als op de gemeente Groningen op de overgangsdatum nog de in de [Wegenwet][ref1] bedoelde onderhoudsplicht rust voor
      een weg die is gelegen

      a. buiten het gebied van de gemeente Groningen, en

      b. in het gebied "Oost-Groningen en de Gronings-Drentse Veenkoloniën", bedoeld in
      [artikel 1 van de Herinrichtingswet Oost-Groningen en de Gronings-Drentse Veenkoloniën][ref2] (*Stb.* 1977, 694),

      verschaft de gemeente waar de weg is gelegen, aan de gemeente Groningen jaarlijks zo lang de onderhoudsplicht op de
      gemeente Groningen rust, een bijdrage in de kosten van het onderhoud.


      [ref1]: https://wetten.overheid.nl/BWBR0001948
      [ref2]: https://wetten.overheid.nl/BWBR0003143#Artikel1
