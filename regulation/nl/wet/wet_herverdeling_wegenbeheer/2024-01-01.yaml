  - number: '4'
    text: |-
      1 De in [artikel 3, tweede lid, onderdeel ][ref1], bedoelde aanwijzing geschiedt zodanig dat op de overgangsdatum

      a. elk van de wegen die in de bij deze wet behorende [bijlage 1][ref2] zijn aangegeven in rood, in beheer zal zijn
      bij het Rijk,

      b. elk van de wegen die in [bijlage 1][ref3] zijn aangegeven in groen, in beheer zal zijn bij de provincie, en

      c. elk van de overige in een gemeente gelegen wegen, onverminderd het bepaalde in [artikel 2][ref4], in beheer zal
      zijn bij die gemeente.

      2 In afwijking van het eerste lid, onderdeel *c*, geschiedt de in [artikel 3, tweede lid, onderdeel ][ref5],
      bedoelde aanwijzing zodanig dat op de overgangsdatum de overige wegen die zijn gelegen

      a. buiten de bebouwde kom in de zin van de [Wegenwet][ref6], waarbij de op 1 januari 1988 geldende grens van de
      bebouwde kom van toepassing is,

      b. in een van de gemeenten die zijn opgenomen in de bij deze wet behorende [bijlage 2][ref7], en

      c. in het gebied van een van de in bedoelde bijlage opgenomen waterschappen,

      in beheer zullen zijn bij het in bedoelde bijlage aangegeven waterschap, met dien verstande dat de wegen die zijn
      gelegen in een gebied dat behoort tot meer dan een van de in de bijlage genoemde waterschappen, niet in beheer
      zullen zijn bij het overliggende waterschap.

      3 In afwijking van het eerste lid geschiedt de in [artikel 3, tweede lid, onderdeel ][ref8], bedoelde aanwijzing
      zodanig dat op de overgangsdatum een weg die is gelegen naast een weg die

      a. niet door plaatsing van het bord G1 van [bijlage 1 van het Reglement verkeersregels en verkeerstekens 1990][ref9]
      (*Stb.* 459) als autosnelweg is aangewezen, en

      b. in de bij deze wet behorende [bijlage 1][ref10] is aangegeven in rood onderscheidenlijk groen,

      in beheer zal zijn bij het Rijk onderscheidenlijk de provincie, als de eerstbedoelde weg naar de mening van
      provinciale staten van meer belang is waar het de vervulling van functies betreft in relatie tot de in rood
      onderscheidenlijk groen aangegeven weg dan waar het de vervulling van overige functies betreft.

      4 Indien de in het eerste lid bedoelde ordening ertoe zou leiden dat een wegvak op of onder een brug, of een wegvak
      in een tunnel in het herverdelingsplan zou moeten worden opgenomen, en dat geen van de op het bouwwerk aansluitende
      wegen in het herverdelingsplan moet worden opgenomen, wordt het wegvak niet in het herverdelingsplan opgenomen,
      tenzij blijkens een tijdig aan provinciale staten gezonden mededeling de oude met de in bedoelde ordening beoogde
      nieuwe beheerder is overeengekomen dat het wegvak met ingang van de overgangsdatum in beheer zal komen bij de in
      bedoelde ordening beoogde nieuwe beheerder.

      5 In geval een weg in beheer is bij een openbaar lichaam dat is gevormd onder toepassing van de
      [Wet gemeenschappelijke regelingen][ref11], en het publiekrechtelijke lichaam bij welk krachtens het eerste
      tot en met derde lid de weg in beheer zou komen, voor het beheer van wegen als de bedoelde weg deelneemt aan de
      gemeenschappelijke regeling, wordt de weg niet in het herverdelingsplan opgenomen.

      6 In afwijking van het tweede lid, onderdeel *c*, geschiedt de in [artikel 3, tweede lid, onderdeel ][ref12],
      bedoelde aanwijzing zodanig dat op de overgangsdatum de overige wegen die zijn gelegen

      a. buiten de bebouwde kom in de zin van de [Wegenwet][ref13], waarbij de op 1 januari 1988 geldende grens van de
      bebouwde kom van toepassing is,

      b. in een van de gemeenten die zijn opgenomen in de bij deze wet behorende bijlage 2,

      c. in het gebied van meer dan een van de in bedoelde bijlage opgenomen waterschappen, en

      d. op een waterkering die in beheer is bij het in bedoelde bijlage opgenomen overliggende waterschap,

      in beheer zullen zijn bij het overliggende waterschap.


