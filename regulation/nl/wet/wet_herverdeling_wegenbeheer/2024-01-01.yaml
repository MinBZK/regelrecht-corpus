  - number: '32'
    text: |-
      1 Aan elk van de gemeenten die voorkomen in het in [artikel 30, eerste lid][ref1], bedoelde overzicht, wordt ten
      laste van de begroting van het Gemeentefonds jaarlijks een uitkering gedaan die overeenkomt met de som der aan de
      gemeente volgens het overzicht toegezegde bijdragen voor het desbetreffende jaar.

      2 Aan elk van de gemeenten die voorkomen op de in [artikel 30, tweede lid][ref2], bedoelde lijst, wordt ten laste
      van de begroting van het Gemeentefonds jaarlijks een uitkering gedaan die overeenkomt met de som der uitkeringen
      die de gemeente volgens de lijst in het desbetreffende jaar aan andere onderhoudsplichtigen moet verschaffen.

      3 Het in het eerste lid bedoelde overzicht en de in het tweede lid bedoelde lijst, alsmede het in het vierde lid
      bedoelde overzicht en de in het vijfde lid bedoelde lijst, worden opgenomen in een algemene maatregel van bestuur
      als bedoeld in [artikel 13 van de Financiële-verhoudingswet][ref3].

      4 Aan elk van de gemeenten die voorkomen in het in [artikel 30, vierde lid][ref4], bedoelde overzicht, wordt
      ten laste van de begroting van het Gemeentefonds jaarlijks gedurende de eerste vijf jaar na de overgangsdatum
      een uitkering gedaan. De hoogte van die uitkering bedraagt in het eerste jaar na de overgangsdatum het jaarlijks
      gemiddelde van de netto-uitkeringen die de betrokken gemeente volgens het overzicht over de laatste drie jaar voor
      de overgangsdatum ontving; de hoogte in het n-de jaar na het jaar waarin de overgangsdatum valt, bedraagt (5-n)/5
      van de hoogte in het eerste jaar na de overgangsdatum.

      5 Aan elk van de gemeenten die voorkomen op de in [artikel 30, vijfde lid][ref5], bedoelde lijst, wordt ten laste
      van de begroting van het Gemeentefonds jaarlijks gedurende de eerste vijf jaar na de overgangsdatum een uitkering
      gedaan waarvan de hoogte overeenkomt met de hoogte van de uitkering die de gemeente in het desbetreffende jaar
      volgens de lijst aan een of meer anderen moet verschaffen.


      [ref1]: https://wetten.overheid.nl/BWBR0005697#Artikel30
