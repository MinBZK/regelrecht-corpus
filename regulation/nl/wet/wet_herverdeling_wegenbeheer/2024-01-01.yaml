  - number: '27'
    text: |-
      1 Gedeputeerde staten zorgen er voor dat binnen twee jaar na de overgangsdatum de reserves voor het wegenbeheer
      worden verdeeld en uitgekeerd.

      2 Onder reserves voor het wegenbeheer als bedoeld in het eerste lid, worden verstaan de reserves waarvan de vorming
      ten laste van de uitkering ingevolge artikel 9 van de Wet Uitkeringen Wegen (*Stb.* 1966, 367) is verantwoord
      binnen hoofdstuk 3 "Verkeer en Vervoer", paragraaf O "Uitvoering Wet Uitkeringen Wegen", van de provinciale
      rekening, bedoeld in de Provinciale Comptabiliteitsvoorschriften 1979 (*Stb.* 1979, 324).
    url: https://wetten.overheid.nl/BWBR0005697/2024-01-01#Artikel27
  - number: '28'
    text: |-
      1 De in [artikel 27, eerste lid][ref1], bedoelde verdeling betreft de saldi van de voor verdeling in aanmerking
      komende reserves op 31 december van het jaar voor de overgangsdatum, na aftrek van de bijdragen ten laste van deze
      reserves waartoe het provinciaal bestuur ten laatste op 31 december 1989 heeft besloten, met dien verstande dat
      het saldo van de in artikel 10, vierde lid, van de Wet Uitkeringen Wegen bedoelde reserve voor voorzieningen ten
      behoeve van het wegverkeer in drie delen wordt gesplitst, waarna deze delen worden toegevoegd aan de reserves ten
      behoeve van secundaire, onderscheidenlijk tertiaire onderscheidenlijk quartaire wegen.

      2 De in het eerste lid bedoelde splitsing geschiedt overeenkomstig de op de verdeling over de categorieën
      secundaire wegen, tertiaire wegen en quartaire wegen betrekking hebbende regels van de in het jaar voor de
      overgangsdatum geldende provinciale verdelingsverordening, bedoeld in artikel 10, eerste lid, van de Wet
      Uitkeringen Wegen.

      3 De reserve ten behoeve van in artikel 7 van de Wet Uitkeringen Wegen bedoelde secundaire wegen wordt verdeeld
      naar rato van de onderhoudsbijdragen die de onderhoudsplichtigen van secundaire wegen in het jaar voor de
      overgangsdatum hebben ontvangen, en aan die onderhoudsplichtigen uitgekeerd.

      4 De reserve ten behoeve van in artikel 7 van de Wet Uitkeringen Wegen bedoelde tertiaire wegen wordt verdeeld naar
      rato van de onderhoudsbijdragen die de onderhoudsplichtigen van tertiaire wegen in het jaar voor de overgangsdatum
      hebben ontvangen, en aan die onderhoudsplichtigen uitgekeerd.

      5 De reserve ten behoeve van in artikel 7 van de Wet Uitkeringen Wegen bedoelde quartaire wegen wordt verdeeld naar
      rato van de onderhoudsbijdragen die de onderhoudsplichtigen van quartaire wegen in het jaar voor de overgangsdatum
      hebben ontvangen, en aan die onderhoudsplichtigen uitgekeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005697#Artikel27
    url: https://wetten.overheid.nl/BWBR0005697/2024-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005697
        artikel: '27'
        hoofdstuk: VI
  - number: '29'
    text: |-
      1 Gedeputeerde staten doen binnen vier maanden na de overgangsdatum aan Onze Minister per onderhoudsplichtige
      per wegvak onderscheidenlijk per veerverbinding gespecificeerd opgave van de op grond van de provinciale
      verdelingsverordening, bedoeld in artikel 10, eerste lid, van de Wet Uitkeringen Wegen, per jaar toegezegde
      bijdragen in de kosten van rente en afschrijving van kapitaaluitgaven voor zover

      a. die toezeggingen betrekking hebben op bijdragen aan andere onderhoudsplichtigen dan de provincie te verstrekken
      in de periode na de overgangsdatum,

      b. de kapitaaluitgaven betrekking hebben op werkzaamheden die zijn verricht voor de overgangsdatum, en

      c. de betalingen wegens die werkzaamheden zijn gedaan voor de overgangsdatum, of voor die datum opeisbaar zijn
      geworden.

      2 Gedeputeerde staten voegen aan de opgave een inventarisatie toe waarin voor elk van de in aanmerking komende
      gemeenten wordt aangegeven de grootte van de per jaar en per wegvak gespecificeerde uitkering die de gemeente
      aan een of meer in het eerste lid bedoelde andere onderhoudsplichtigen heeft te doen om het voor die andere
      onderhoudsplichtigen vervallen van de bijdragen in de kosten van rente en afschrijving van kapitaaluitgaven te
      compenseren.

      3 Gedeputeerde Staten doen binnen vier maanden na de overgangsdatum aan Onze Minister per veerverbinding die
      niet is gelegen in een wegverbinding of tussen wegen die in de bij deze wet behorende [bijlage 1][ref1] zijn
      aangegeven in rood of groen, gespecificeerd opgave van het jaarlijkse gemiddelde van de op grond van de provinciale
      verdelingsverordening, bedoeld in artikel 10, eerste lid, van de Wet Uitkeringen Wegen, over de laatste drie jaar
      voor de overgangsdatum verleende bijdragen aan anderen voor veerverbindingen, verminderd met de over die jaren
      verleende bijdragen in de kapitaallasten van die veerverbindingen.

      4 Gedeputeerde Staten voegen aan de in het derde lid bedoelde opgave een inventarisatie toe waarin voor de in
      aanmerking komende gemeenten wordt aangegeven, de grootte van de uitkering die de gemeente in het eerste jaar na
      de overgangsdatum heeft te doen aan andere die de betrokken veerverbindingen verzorgen, om het vervallen van de
      bijdrage of bijdragen in de kosten van de veerverbinding met uitzondering van de bijdragen in de kosten van rente
      en afschrijving van kapitaaluitgaven, te compenseren.


      [ref1]: https://wetten.overheid.nl/BWBR0005697
    url: https://wetten.overheid.nl/BWBR0005697/2024-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005697
  - number: '30'
    text: |-
      1 Onze Minister stelt aan de hand van de in [artikel 29, eerste lid][ref1], bedoelde opgaven een overzicht vast van
      de bijdragen die aan de gemeenten zijn toegezegd.

      2 Onze Minister stelt aan de hand van de in [artikel 29, tweede lid][ref2], bedoelde inventarisaties een lijst
      vast van de gemeenten die de in de lijst vermelde uitkeringen zullen verschaffen aan de in de lijst genoemde andere
      onderhoudsplichtigen.

      3 Het in het eerste lid bedoelde overzicht en de in het tweede lid bedoelde lijst worden niet vastgesteld
      dan nadat een ontwerp voor het overzicht en voor de lijst is gepubliceerd in de *Staatscourant*, de in
      [artikel 29, eerste lid][ref3], bedoelde onderhoudsplichtigen de gelegenheid is geboden bij Onze Minister
      bedenkingen tegen het ontwerp in te brengen en over deze bedenkingen een standpunt is bepaald.

      4 Onze Minister stelt aan de hand van de in [artikel 29, derde lid][ref4], bedoelde opgaven een per gemeente
      geordend overzicht vast van de jaarlijkse gemiddelden van de bijdragen die de gemeenten ontvingen over de laatste
      drie jaar voor de overgangsdatum in de kosten van overzetveren, verminderd met de bijdragen in kapitaallasten voor
      de veerverbindingen.

      5 Onze Minister stelt aan de hand van de in [artikel 29, vierde lid][ref5], bedoelde inventarisaties een lijst vast
      van de gemeente die gedurende de eerste vijf jaar na de overgangsdatum jaarlijks uitkeringen zullen verschaffen
      aan de in de lijst genoemde anderen, en van de hoogte van deze uitkeringen. Deze hoogte bedraagt in het eerste jaar
      na de overgangsdatum het jaarlijkse gemiddelde van de netto-uitkeringen die de betrokken andere dan de gemeente
      volgens het overzicht over de laatste drie jaar voor de overgangsdatum ontving; deze hoogte bedraagt in het n-de
      jaar na het jaar waarin de overgangsdatum valt, (5-n)/5 van van de hoogte in het eerste jaar na de overgangsdatum.

      6 Het derde lid is van overeenkomstige toepassing op de vaststelling van het in het vierde lid bedoelde overzicht
      en van de in het vijfde lid bedoelde lijst.


      [ref1]: https://wetten.overheid.nl/BWBR0005697#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0005697#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0005697#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0005697#Artikel29
      [ref5]: https://wetten.overheid.nl/BWBR0005697#Artikel29
