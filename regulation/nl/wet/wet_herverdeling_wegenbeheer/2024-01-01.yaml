        bwb_id: BWBR0005697
        artikel: '14'
        hoofdstuk: III
  - number: '16'
    text: |-
      1 De in [artikel 11][ref1] bedoelde overgang van rechten en verplichtingen en de in [artikel 14][ref2] bedoelde
      levering en vestiging, wijziging of afstand van rechten geschieden om niet.

      2 Het batig saldo van de inkomsten en uitgaven voortvloeiende uit de exploitatie van de in [artikel 14][ref3]
      bedoelde onroerende zaken en rechten waaraan onroerende zaken zijn onderworpen, in de periode tussen de
      overgangsdatum en de datum van de in het eerste lid bedoelde levering, wordt door de oude beheerder aan de nieuwe
      beheerder uitgekeerd.

      3 Indien de nieuwe beheerder binnen tien jaar na de overgangsdatum ten gevolge van het bestaan of het bestaan
      hebben van een verkooppunt van motorbrandstoffen schade lijdt door verontreiniging van de bodem waarop de weg die
      hij in beheer heeft gekregen, of bijbehorende werken en voorzieningen voor het wegverkeer onder zijn zorg zijn
      komen te vallen, zijn aangelegd, terwijl de verontreiniging is ontstaan voor de overgangsdatum, en het optreden
      van de schade hem niet kan worden toegerekend, vergoedt, tenzij de oude en de nieuwe beheerder anders zijn
      overeengekomen, de oude beheerder de schade aan de nieuwe beheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0005697#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005697#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0005697#Artikel14
    url: https://wetten.overheid.nl/BWBR0005697/2024-01-01#Artikel16
