preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, zowel voor een efficiëntere organisatie van de wegenzorg als in
    het licht van het streven naar decentralisatie, wenselijk is wijziging te brengen in de verdeling van openbare
    wegen over Rijk, provincies, gemeenten en waterschappen, dat bovendien het verschaffen van de in de Wet Uitkeringen
    Wegen (Stb. 1966, 367) geregelde uitkeringen moet worden beëindigd, en dat het wenselijk is in samenhang hiermee
    wijziging te brengen in de financiële verhouding tussen deze overheden;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005697/2024-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Verkeer en Waterstaat;

      b. overgangsdatum: de krachtens [artikel 10, eerste lid][ref1], van deze wet vastgestelde datum;

      c. brug: een civieltechnisch bouwwerk dat een weg door middel van een overspanning met daarop de wegverharding of
      het wegdek leidt over een weg of een oppervlaktewater;

      d. tunnel: een civieltechnisch bouwwerk waarmee een weg door of onder een weg of een oppervlaktewater wordt geleid
      of waarmee een oppervlaktewater door of onder een weg wordt geleid, mits dit bouwwerk niet tevens een weg door
      middel van een overspanning met daarop de wegverharding of het wegdek leidt over een weg of een oppervlaktewater.


      [ref1]: https://wetten.overheid.nl/BWBR0005697#Artikel10
    url: https://wetten.overheid.nl/BWBR0005697/2024-01-01#Artikel1
