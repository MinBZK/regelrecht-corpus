  - number: '12'
    text: |-
      1 De oude beheerder draagt, tenzij de oude en de nieuwe beheerder anders zijn overeengekomen, er zorg voor dat de
      in beheer overgaande weg en de naar de nieuwe beheerder overgaande bijbehorende werken en voorzieningen voor het
      wegverkeer op de dag voor de overgangsdatum in voldoende staat verkeren.

      2 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld volgens welke wordt bepaald of een weg in
      voldoende staat van onderhoud verkeert.
    url: https://wetten.overheid.nl/BWBR0005697/2024-01-01#Artikel12
  - number: '13'
    text: |-
      De oude beheerder draagt de archiefbescheiden betrekking hebbend op aangelegenheden omtrent de aanleg, het beheer
      en het onderhoud van de weg en van de naar de nieuwe beheerder overgaande bijbehorende werken en voorzieningen voor
      het wegverkeer, welke op de overgangsdatum nog niet zijn afgedaan, over aan de nieuwe beheerder.
    url: https://wetten.overheid.nl/BWBR0005697/2024-01-01#Artikel13
  - number: '14'
    text: |-
      De oude en de nieuwe beheerder zijn verplicht binnen zesendertig maanden na de overgangsdatum over te gaan
      tot onvoorwaardelijke levering, onderscheidenlijk aanvaarding van onroerende zaken en rechten als bedoeld in
      [artikel 3, tweede lid, onderdeel ][ref1], alsmede voor zover de verhouding tussen de oude en de nieuwe beheerder
      daartoe noodzaakt, tot onvoorwaardelijke vestiging, wijziging of afstand van rechten waaraan onroerende zaken zijn
      onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0005697#Artikel3
    url: https://wetten.overheid.nl/BWBR0005697/2024-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005697
        artikel: '3'
        hoofdstuk: II
  - number: '15'
    text: |-
      Ten aanzien van onroerende zaken en rechten daarop die onderwerp zijn van een beroep als bedoeld in
      [artikel 9][ref1], vangt de termijn, bedoeld in [artikel 14][ref2], aan op de dag van de uitspraak van de Kroon.


      [ref1]: https://wetten.overheid.nl/BWBR0005697#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005697#Artikel14
    url: https://wetten.overheid.nl/BWBR0005697/2024-01-01#Artikel15
