  - number: '11'
    text: |-
      1 Met ingang van de overgangsdatum gaan de rechten en plichten die betrekking hebben op de weg en de overgaande
      bijbehorende werken en voorzieningen, met uitzondering van lopende vorderingen ontstaan voor de overgangsdatum uit
      een of meer overeenkomsten of krachtens de wet, van de oude beheerder over op de nieuwe beheerder, onverminderd het
      bepaalde in de [artikelen 13][ref1], [14][ref2] en [16][ref3].

      2 Indien niet op de oude beheerder, maar op een openbaar lichaam dat onder toepassing van de
      [Wet gemeenschappelijke regelingen][ref4] is ingesteld, de plicht rust een in beheer overgaande weg te onderhouden,
      en de oude beheerder aan de desbetreffende gemeenschappelijke regeling deelneemt, komt in afwijking van het eerste
      lid de onderhoudsplicht van het openbaar lichaam met ingang van de overgangsdatum te vervallen, en gaan met ingang
      van de overgangsdatum de rechten en plichten van het openbare lichaam voor zover zij betrekking hebben op het
      onderhoud van de weg, over op de nieuwe beheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0005697#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005697#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0005697#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0003740
