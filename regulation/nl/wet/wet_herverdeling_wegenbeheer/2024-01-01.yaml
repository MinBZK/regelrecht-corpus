  - number: '38'
    text: |-
      Een besluit van provinciale staten tot vaststelling van een herverdelingsplan als bedoeld in [artikel 3][ref1],
      dat is genomen voor de datum van inwerkingtreding van deze wet, doch overeenkomstig de bepalingen van deze
      wet, wordt met ingang van datum van inwerkingtreding van deze wet gelijkgesteld met het besluit, bedoeld in
      [artikel 3, eerste lid][ref2], met dien verstande dat de termijn, bedoeld in [artikel 9][ref3], aanvangt op de
      datum van inwerkingtreding van deze wet.


