  - number: '8'
    text: |-
      Gedeputeerde staten zenden onverwijld aan de belanghebbende beheerders, alsmede aan Onze Minister, de onderdelen
      die zijn bedoeld in [artikel 3, tweede lid, onderdelen ][ref1], en voorts aan elk van de belanghebbende beheerders
      de op hem betrekking hebbende overige onderdelen van het herverdelingsplan toe.


      [ref1]: https://wetten.overheid.nl/BWBR0005697#Artikel3
    url: https://wetten.overheid.nl/BWBR0005697/2024-01-01#Artikel8
