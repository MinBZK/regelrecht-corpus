  - number: '5'
    text: |-
      1 Indien blijkens een tijdig aan provinciale staten gezonden mededeling het Rijk onderscheidenlijk een provincie
      met een gemeente is overeengekomen dat:

      a. een gedeelte van een in de bij deze wet behorende [bijlage 1][ref1] in rood, onderscheidenlijk groen aangegeven
      weg, op de overgangsdatum in beheer zal zijn bij de gemeente, of

      b. een gedeelte van een weg die behoort tot de in [artikel 4, eerste lid, onderdeel ][ref2], bedoelde wegen, op de
      overgangsdatum in beheer zal zijn bij het Rijk, onderscheidenlijk de provincie,

      wordt deze overeenkomst bij de in [artikel 3, tweede lid, onderdeel ][ref3], bedoelde aanwijzing van in beheer
      overgaande wegen in afwijking van [artikel 4, eerste en derde lid][ref4], in acht genomen.

      2 Indien blijkens een tijdig aan provinciale staten gezonden mededeling het Rijk met de provincie,
      onderscheidenlijk een gemeente is overeengekomen dat een weg die in beheer is bij het Rijk, en waarvan het beheer
      en onderhoud niet ten laste komt van de in [artikel 2, tweede lid, onderdeel ][ref5], bedoelde begrotingen,
      met ingang van de overgangsdatum in beheer zal zijn bij de provincie, onderscheidenlijk de gemeente, wordt deze
      overeenkomst bij de in [artikel 3, tweede lid, onderdeel ][ref6], bedoelde aanwijzing in acht genomen, en wordt bij
      de toepassing van deze wet afgeweken van het bepaalde in [artikel 2, tweede lid, onderdeel a][ref7].

      3 Indien blijkens een tijdig aan provinciale staten gezonden mededeling een ander dan het Rijk, de
      provincies, de gemeenten, de waterschappen en de publiekrechtelijke lichamen die met toepassing van de
      [Wet gemeenschappelijke regelingen][ref8] tot stand zijn gekomen, met het Rijk, onderscheidenlijk een provincie,
      onderscheidenlijk een gemeente is overeengekomen dat een weg die in beheer is bij die ander, met ingang van de
      overgangsdatum in beheer zal zijn bij het Rijk, onderscheidenlijk de provincie, onderscheidenlijk de gemeente,
      wordt deze overeenkomst bij de in [artikel 3, tweede lid, onderdeel ][ref9], bedoelde aanwijzing in acht genomen,
      en wordt bij de toepassing van deze wet afgeweken van het bepaalde in [artikel 2, eerste lid][ref10].

      4 Indien blijkens een tijdig aan provinciale staten gezonden mededeling een waterschap dat is opgenomen in de
      bij deze wet behorende [bijlage 2][ref11], met een gemeente is overeengekomen dat een in die gemeente gelegen
      weg met ingang van de overgangsdatum niet bij het waterschap doch bij de gemeente in beheer zal zijn, wordt
      deze overeenkomst bij de in [artikel 3, tweede lid, onderdeel ][ref12], bedoelde aanwijzing in afwijking van
      [artikel 4, tweede lid][ref13], in acht genomen.

      5 Indien een waterschap bij de in [artikel 4, eerste lid][ref14], bedoelde ordening de plaats heeft ingenomen van
      een gemeente, zijn het eerste tot en met het derde lid van toepassing met dien verstande dat voor "gemeente" wordt
      gelezen: waterschap. In het geval dat overleg met een waterschap om te komen tot een overeenkomst als bedoeld in
      het eerste, onderscheidenlijk tweede, onderscheidenlijk derde lid, niet tot overeenstemming heeft geleid, is alsnog
      het eerste, onderscheidenlijk tweede, onderscheidenlijk derde lid ongewijzigd van toepassing.


