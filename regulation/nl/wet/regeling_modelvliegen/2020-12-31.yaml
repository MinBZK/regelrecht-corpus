        artikel: 8a.51
  - number: '3'
    text: |-
      Modelluchtvaartuigen worden aangewezen als onbemande luchtvaartuigen, bedoeld in
      [artikel 5.7, derde lid, van de Wet luchtvaart][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5.7
    url: https://wetten.overheid.nl/BWBR0019147/2020-12-31#Artikel3
