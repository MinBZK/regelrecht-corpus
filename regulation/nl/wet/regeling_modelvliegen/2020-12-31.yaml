preamble:
  text: |-
    Handelende in overeenstemming met de Staatssecretaris van defensie;

    Gelet op artikel 5.7 van de Wet luchtvaart en artikel 56 van het Luchtverkeersreglement;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0019147/2020-12-31#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *modelluchtvaartuig:* luchtvaartuig, niet in staat een mens te dragen, en uitsluitend gebruikt voor
      luchtvaartvertoning, recreatie of sport;
        - *uitvoeringsverordening (EU) nr. 2019/947:* Uitvoeringsverordening (EU) nr. 2019/947 van de Commissie van 24 mei
      2019 inzake de regels en procedures voor de exploitatie van onbemande luchtvaartuigen (PbEU 20139, L 152).
    url: https://wetten.overheid.nl/BWBR0019147/2020-12-31#Artikel1
  - number: 1a
    text: |-
      Deze regeling berust op [artikel 5.7, derde lid, van de Wet luchtvaart][ref1] en
      [artikel 4a van het Besluit luchtverkeer 2014][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5.7
      [ref2]: https://wetten.overheid.nl/BWBR0035899#Artikel4a
    url: https://wetten.overheid.nl/BWBR0019147/2020-12-31#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5.7'
      - id: ref2
        bwb_id: BWBR0035899
        artikel: 4a
  - number: 1b
    text: |-
      1 Modelluchtvaartuigen verlenen voorrang aan vliegtuigen, helikopters, zweeftoestellen, vrije ballonnen en
      luchtschepen.

      2 In alle overige gevallen dat twee luchtvaartuigen kruisen op of omstreeks hetzelfde niveau, verleent het
      luchtvaartuig dat het andere aan zijn rechterzijde heeft voorrang.
    url: https://wetten.overheid.nl/BWBR0019147/2020-12-31#Artikel1b
  - number: '2'
    text: |-
      Onverminderd het [Besluit luchtverkeer 2014][ref1] gelden voor een vlucht met een modelluchtvaartuig die wordt
      uitgevoerd in het verband van een modelluchtvaartuigclub of -vereniging, als bedoeld in artikel 2, onder 10, van
      uitvoeringsverordening (EU) nr. 2019/947 de volgende regels:

      a. de vlucht wordt slechts uitgevoerd onder omstandigheden en op locaties waarbij er vanaf de grond tijdens de
      gehele vlucht goed zicht is op het modelluchtvaartuig en het luchtruim daaromheen;

      b. de bestuurder houdt tijdens de gehele vlucht goed zicht op het modelluchtvaartuig behalve wanneer de bestuurder
      wordt bijgestaan door een waarnemer die zich naast hem bevindt en zonder hulp visueel contact houdt met het
      modelluchtvaartuig en zo de bestuurder helpt om de vlucht veilig uit te voeren;

      c. een hoogtemeter hoeft niet te worden gebruikt;

      d. de vlucht wordt niet uitgevoerd buiten de daglichtperiode, zoals gepubliceerd in de luchtvaartgids;

      e. de vlucht wordt niet uitgevoerd boven gebieden met aaneengesloten bebouwing of kunstwerken, industrie-
      en havengebieden daaronder begrepen dan wel boven mensenmenigten of boven spoorlijnen of voor motorrijtuigen
      toegankelijke verharde openbare wegen, met uitzondering van wegen in 30 km-zones binnen de bebouwde kom en wegen in
      60 km-gebieden buiten de bebouwde kom;

      f. voor een vlucht wordt geen vliegplan ingediend;

      g. gecontroleerde vluchten zijn niet toegestaan;

      h. vluchten zijn toegestaan tot een hoogte van maximaal 120 meter boven de grond of het water in luchtruim met
      klasse G, mits

      1° voor vluchten binnen een afstand van 3 km van een ongecontroleerde luchthaven of een terrein dat geschikt is
      om tijdelijk en uitzonderlijk te worden gebruikt, waarvoor krachtens [artikel 8a.51 van de Wet luchtvaart][ref2]
      ontheffing is verleend, geen bezwaar bestaat bij de exploitant van de luchthaven respectievelijk de houder van
      de ontheffing;

      2° voor vluchten binnen een gebied waarin laag mag worden gevlogen door civiele of militaire luchtvaartuigen iemand
      met de bestuurder van het modelluchtvaartuig meekijkt om deze te kunnen waarschuwen voor luchtvaartuigen;

      i. in afwijking van onderdeel h zijn vluchten binnen het verband van een bij de Koninklijke Nederlandse Vereniging
      voor Luchtvaart of de Federatie Limburgse Radio Controle Vliegers aangesloten vereniging toegestaan tot een
      hoogte van maximaal 300 meter boven de grond of het water in luchtruim klasse G, mits wordt voldaan aan de in dat
      onderdeel genoemde voorwaarden;

      j. vluchten zijn toegestaan tot een hoogte van maximaal 450 meter boven de grond of het water, mits dit gebeurt
      binnen een aerodrome traffic zone van een militaire luchthaven waarop modelvliegen is toegestaan en dit gebied
      exclusief voor modelvliegen wordt gebruikt of met de andere gebruiker(s) sluitende afspraken zijn gemaakt inzake
      separatie;

      k. vluchten zijn toegestaan in luchtruim met klasse C of D, mits op schriftelijk verzoek van belanghebbende een
      convenant is gesloten met de organisatie die de plaatselijke luchtverkeersleiding verzorgt en de bestuurder zich
      houdt aan de afspraken in dat convenant;

      l. de regels voor de bediening van boordapparatuur voor het beantwoorden van vragen door radargrondstations gelden
      niet;

      m. de regels voor de navigatie- en telecommunicatie-installaties waarmee een luchtvaartuig voor het uitvoeren van
      een VFR-vlucht is uitgerust, gelden niet.


      [ref1]: https://wetten.overheid.nl/BWBR0035899
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8a.51
