---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_modelvliegen
regulatory_layer: WET
publication_date: '2021-04-21'
valid_from: '2021-04-22'
bwb_id: BWBR0019147
url: https://wetten.overheid.nl/BWBR0019147/2021-04-22
preamble:
  text: |-
    Handelende in overeenstemming met de Staatssecretaris van defensie;

    Gelet op artikel 5.7 van de Wet luchtvaart en artikel 56 van het Luchtverkeersreglement;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0019147/2021-04-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *modelluchtvaartuig:* luchtvaartuig, niet in staat een mens te dragen, en
      uitsluitend gebruikt voor luchtvaartvertoning, recreatie of sport;
        - *uitvoeringsverordening (EU) nr. 2019/947:* Uitvoeringsverordening (EU) nr. 2019/947 van de Commissie van 24 mei
      2019 inzake de regels en procedures voor de exploitatie van onbemande luchtvaartuigen (PbEU 20139, L 152).
    url: https://wetten.overheid.nl/BWBR0019147/2021-04-22#Artikel1
  - number: 1a
    text: |-
      Deze regeling berust op [artikel 5.7, derde lid, van de Wet luchtvaart][ref1] en
      [artikel 4a van het Besluit luchtverkeer 2014][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0035899#Artikel4a
    url: https://wetten.overheid.nl/BWBR0019147/2021-04-22#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0035899
        artikel: 4a
  - number: 1b.1
    text: |-
      Modelluchtvaartuigen verlenen voorrang aan vliegtuigen, helikopters, zweeftoestellen, vrije ballonnen en
      luchtschepen.
    url: https://wetten.overheid.nl/BWBR0019147/2021-04-22#Artikel1b
  - number: 1b.2
    text: |-
      In alle overige gevallen dat twee luchtvaartuigen kruisen op of omstreeks hetzelfde niveau, verleent het
      luchtvaartuig dat het andere aan zijn rechterzijde heeft voorrang.
    url: https://wetten.overheid.nl/BWBR0019147/2021-04-22#Artikel1b
  - number: '2'
    text: |-
      Onverminderd het [Besluit luchtverkeer 2014][ref1] gelden voor een vlucht met een modelluchtvaartuig die wordt
      uitgevoerd in het verband van een modelluchtvaartuigclub of -vereniging, als bedoeld in artikel 2, onder 10, van
      uitvoeringsverordening (EU) nr. 2019/947 de volgende regels:


      [ref1]: https://wetten.overheid.nl/BWBR0035899
    url: https://wetten.overheid.nl/BWBR0019147/2021-04-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0035899
  - number: 2.a
    text: |-
      de vlucht wordt slechts uitgevoerd onder omstandigheden en op locaties waarbij er vanaf de grond tijdens de gehele
      vlucht goed zicht is op het modelluchtvaartuig en het luchtruim daaromheen;
    url: https://wetten.overheid.nl/BWBR0019147/2021-04-22#Artikel2
  - number: 2.b
    text: |-
      de bestuurder houdt tijdens de gehele vlucht goed zicht op het modelluchtvaartuig behalve wanneer de bestuurder
      wordt bijgestaan door een waarnemer die zich naast hem bevindt en zonder hulp visueel contact houdt met het
      modelluchtvaartuig en zo de bestuurder helpt om de vlucht veilig uit te voeren;
    url: https://wetten.overheid.nl/BWBR0019147/2021-04-22#Artikel2
  - number: 2.c
    text: een hoogtemeter hoeft niet te worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0019147/2021-04-22#Artikel2
  - number: 2.d
    text: de vlucht wordt niet uitgevoerd buiten de daglichtperiode, zoals gepubliceerd in de luchtvaartgids;
    url: https://wetten.overheid.nl/BWBR0019147/2021-04-22#Artikel2
  - number: 2.e
    text: |-
      de vlucht wordt niet uitgevoerd boven aaneengesloten bebouwing of kunstwerken, industrie- en havengebieden
      daaronder begrepen dan wel boven mensenmenigten of boven spoorlijnen of voor motorrijtuigen toegankelijke verharde
      openbare wegen, met uitzondering van wegen in 30 km-zones binnen de bebouwde kom en wegen in 60 km-gebieden buiten
      de bebouwde kom;
    url: https://wetten.overheid.nl/BWBR0019147/2021-04-22#Artikel2
  - number: 2.f
    text: voor een vlucht wordt geen vliegplan ingediend;
    url: https://wetten.overheid.nl/BWBR0019147/2021-04-22#Artikel2
  - number: 2.g
    text: gecontroleerde vluchten zijn niet toegestaan;
    url: https://wetten.overheid.nl/BWBR0019147/2021-04-22#Artikel2
  - number: 2.h
    text: |-
      vluchten zijn toegestaan tot een hoogte van maximaal 120 meter boven de grond of het water in luchtruim met klasse
      G, mits
    url: https://wetten.overheid.nl/BWBR0019147/2021-04-22#Artikel2
  - number: 2.h.1
    text: |-
      voor vluchten binnen een afstand van 3 km van een ongecontroleerde luchthaven of een terrein dat geschikt is om
      tijdelijk en uitzonderlijk te worden gebruikt, waarvoor krachtens [artikel 8a.51 van de Wet luchtvaart][ref1]
      ontheffing is verleend, geen bezwaar bestaat bij de exploitant van de luchthaven respectievelijk de houder van
      de ontheffing;


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8a
    url: https://wetten.overheid.nl/BWBR0019147/2021-04-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: 8a
  - number: 2.h.2
    text: |-
      voor vluchten binnen een gebied waarin laag mag worden gevlogen door civiele of militaire luchtvaartuigen iemand
      met de bestuurder van het modelluchtvaartuig meekijkt om deze te kunnen waarschuwen voor luchtvaartuigen;
    url: https://wetten.overheid.nl/BWBR0019147/2021-04-22#Artikel2
  - number: 2.i
    text: |-
      in afwijking van onderdeel h zijn vluchten binnen het verband van een bij de Koninklijke Nederlandse Vereniging
      voor Luchtvaart, de Federatie Limburgse Radio Controle Vliegers of de Samenwerkende Nederlandse Modelvlieg
      Verenigingen aangesloten vereniging toegestaan tot een hoogte van maximaal 300 meter boven de grond of het water in
      luchtruim klasse G, mits wordt voldaan aan de in dat onderdeel genoemde voorwaarden;
    url: https://wetten.overheid.nl/BWBR0019147/2021-04-22#Artikel2
  - number: 2.j
    text: |-
      vluchten zijn toegestaan tot een hoogte van maximaal 450 meter boven de grond of het water, mits dit gebeurt binnen
      een aerodrome traffic zone van een militaire luchthaven waarop modelvliegen is toegestaan en dit gebied exclusief
      voor modelvliegen wordt gebruikt of met de andere gebruiker(s) sluitende afspraken zijn gemaakt inzake separatie;
    url: https://wetten.overheid.nl/BWBR0019147/2021-04-22#Artikel2
  - number: 2.k
    text: |-
      vluchten zijn toegestaan in luchtruim met klasse C of D, mits op schriftelijk verzoek van belanghebbende een
      convenant is gesloten met de organisatie die de plaatselijke luchtverkeersleiding verzorgt en de bestuurder zich
      houdt aan de afspraken in dat convenant;
    url: https://wetten.overheid.nl/BWBR0019147/2021-04-22#Artikel2
  - number: 2.l
    text: |-
      de regels voor de bediening van boordapparatuur voor het beantwoorden van vragen door radargrondstations gelden
      niet;
    url: https://wetten.overheid.nl/BWBR0019147/2021-04-22#Artikel2
  - number: 2.m
    text: |-
      de regels voor de navigatie- en telecommunicatie-installaties waarmee een luchtvaartuig voor het uitvoeren van een
      VFR-vlucht is uitgerust, gelden niet.
    url: https://wetten.overheid.nl/BWBR0019147/2021-04-22#Artikel2
  - number: '3'
    text: |-
      Modelluchtvaartuigen worden aangewezen als onbemande luchtvaartuigen, bedoeld in
      [artikel 5.7, derde lid, van de Wet luchtvaart][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0019147/2021-04-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
  - number: '7'
    text: 'Deze regeling wordt aangehaald als: Regeling modelvliegen.'
    url: https://wetten.overheid.nl/BWBR0019147/2021-04-22#Artikel7
