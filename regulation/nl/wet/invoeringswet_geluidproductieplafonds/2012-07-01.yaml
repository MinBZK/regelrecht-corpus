preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het wenselijk is, met het oog op de invoering van een herzien hoofdstuk
    11 in de Wet milieubeheer, de Wet geluidhinder en enige andere wetten te wijzigen en te voorzien in overgangsrecht;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0031679/2012-07-01#ArtikelAanhef
articles:
  - number: X
    text: |-
      Na inwerkingtreding van deze wet berusten algemene maatregelen van bestuur, voor zover zij vóór de inwerkingtreding
      van deze wet berustten op [artikel 11.1][ref1], [11.2][ref2] of [11.3 van de Wet milieubeheer][ref3], op
      [artikel 11A.1][ref4], [11A.2][ref5] onderscheidenlijk [11A.3 van de Wet milieubeheer][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11.1
