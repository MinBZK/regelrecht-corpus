  - number: XI
    text: |-
      1 De [Wet geluidhinder][ref1] en de daarop gebaseerde regelgeving zoals deze gold voor het tijdstip van
      inwerkingtreding van deze wet blijft van toepassing op de onderstaande besluiten of handelingen, totdat deze
      onherroepelijk zijn geworden:

      a. het vaststellen en goedkeuren van een bestemmingsplan met toepassing van de [Wet geluidhinder][ref2] waarvan het
      ontwerp ter inzage is gelegd voorafgaand aan de inwerkingtreding van deze wet;

      b. het verlenen van een omgevingsvergunning waarbij met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref3] van het
      bestemmingsplan of de beheersverordening wordt afgeweken, waarvoor een aanvraag is ingediend voorafgaand aan de
      inwerkingtreding van deze wet;

      c. het vaststellen van een hogere waarde voor de ten hoogste toelaatbare geluidsbelasting waarvoor de bekendmaking
      van het voornemen tot het indienen van een verzoek tot het vaststellen van die hogere waarde heeft plaatsgevonden
      voorafgaand aan de inwerkingtreding van deze wet;

      d. het vaststellen van een tracébesluit waarvan het ontwerp, bedoeld in
      [artikel 11, derde lid, van de Tracéwet][ref4], is vastgesteld voorafgaand aan de inwerkingtreding van deze wet;

      e. het opstellen van een maatregelenprogramma en het voorleggen van een saneringsprogramma aan Onze Minister,
      of het vaststellen van de ten hoogste toelaatbare waarde van de geluidsbelasting en maatregelen als bedoeld in
      [artikel 90 van de Wet geluidhinder][ref5] of [artikel 4.23 van het Besluit geluidhinder][ref6], voor bij algemene
      maatregel van bestuur aangewezen saneringsprojecten;

      f. het nemen van een besluit tot aanleg of reconstructie van een weg of aanleg of wijziging van een spoorweg
      buiten toepassing van de bestemmingsplanprocedure waarvoor de resultaten van het vereiste akoestisch onderzoek
      en een beschrijving van de maatregelen die nodig zijn aan de gemeenteraad zijn overgelegd voorafgaand aan de
      inwerkingtreding van deze wet;

      g. het vaststellen van een wegaanpassingsbesluit of geluidplan als bedoeld in de [Spoedwet wegverbreding][ref7]
      waarvoor het ontwerpbesluit ter inzage is gelegd voorafgaand aan de inwerkingtreding van deze wet.

      2 De [Wet geluidhinder][ref8] en de daarop gebaseerde regelgeving zoals deze gold voor het tijdstip van
      inwerkingtreding van deze wet kan tevens worden toegepast op de in het eerste lid genoemde besluiten, totdat deze
      onherroepelijk zijn geworden, indien de in de onderdelen a tot en met g genoemde handelingen met betrekking tot
      deze besluiten hebben plaatsgevonden vóór de eerste dag van:

      a. de twaalfde maand volgend op het tijdstip van inwerkingtreding van deze wet indien het onderdeel a betreft,
      daaronder tevens begrepen de onder c opgenomen hogere waarden besluiten die daar mee samenhangen;

      b. de derde kalendermaand volgend op het tijdstip van inwerkingtreding van deze wet bij toepassing van de
      onderdelen b, d tot en met g en c voor zover de hogere waarden besluiten niet samenhangen met een bestemmingsplan
      genoemd onder a.

      3 Voor de op het tijdstip van inwerkingtreding van deze wet aanwezige of geprojecteerde wegen en spoorwegen die op
      de geluidplafondkaart zijn geplaatst, worden na het onherroepelijk worden van een besluit als bedoeld in het eerste
      en tweede lid, dat betrekking heeft op de aanleg of wijziging van een zodanige weg of spoorweg, de eerder voor die
      weg of spoorweg met toepassing van [11.45][ref9] bepaalde geluidproductieplafonds vervangen door de geluidproductie
      berekend op basis van het bedoelde besluit. Deze plafonds worden aangemerkt als te zijn tot stand gekomen met
      toepassing van artikel 11.45, tweede lid.

      4 Op het tijdstip van inwerkingtreding van deze wet nog niet aanwezige of geprojecteerde wegen en spoorwegen,
      hebben na het onherroepelijk worden van een besluit als bedoeld in het eerste en tweede lid, dat betrekking heeft
      op de aanleg van een zodanige weg of spoorweg, indien de weg of spoorweg op de geluidplafondkaart is geplaatst,
      geluidproductieplafonds voorvloeiend uit de geluidproductie berekend op basis van het bedoelde besluit. Deze
      plafonds worden aangemerkt als te zijn tot stand gekomen met toepassing van [artikel 11.45, tweede lid][ref10].

      5 Indien ten aanzien van wegen en spoorwegen waarvoor met toepassing van [artikel 11.45, eerste lid][ref11],
      geluidproductieplafonds zijn vastgesteld, met toepassing van het eerste of het tweede lid maatregelen
      onherroepelijk zijn vastgesteld als bedoeld in het eerste lid, onder e, worden de met toepassing van 11.45, eerste
      lid, bepaalde geluidproductieplafonds verlaagd overeenkomstig het geluideffect van die maatregelen. Deze plafonds
      worden aangemerkt als te zijn tot stand gekomen met toepassing van artikel 11.45, tweede lid. Artikel 11.45, zesde
      lid, is van overeenkomstige toepassing.

      6 Indien op grond van de [Wet geluidhinder][ref12] zoals die luidde tot het tijdstip van inwerkingtreding van
      deze wet een verplichting bestond tot het treffen van geluidwerende maatregelen krachtens een onherroepelijk
      besluit, of krachtens een besluit dat onder de werking van dit artikel valt, en die maatregelen op het moment
      van inwerkingtreding nog niet zijn gerealiseerd, blijft op die verplichting de Wet geluidhinder zoals deze luidde
      onmiddellijk voor de inwerkingtreding van deze wet van toepassing.

      7 Het zesde lid is van overeenkomstige toepassing op een verplichting tot het treffen van
      maatregelen, vastgesteld op grond van [artikel 90, vijfde lid, van de Wet geluidhinder][ref13], of
      [artikel 4.23, derde lid, van het Besluit geluidhinder][ref14], niet zijnde geluidwerende maatregelen.

      8 Bij toepassing van het eerste lid, onder d of g, of het tweede lid, voor zover het de hiervoor genoemde
      onderdelen betreft, geldt tot het tijdstip waarop de maatregelen zijn uitgevoerd, voor de betreffende
      referentiepunten een vrijstelling van [artikel 11.20 van de Wet milieubeheer][ref15].

      9 Onze Minister kan regels stellen omtrent de wijze waarop de geluidproductie, bedoeld in het derde en vierde lid,
      onderscheidenlijk het geluideffect, bedoeld in het vijfde lid, wordt berekend.

      10 Voor de toepassing van dit artikel wordt onder een «bestemmingsplan» mede begrepen een inpassingsplan als
      bedoeld in [artikel 3.26][ref16] of [artikel 3.28 van de Wet ruimtelijke ordening][ref17], alsmede een wijzigings-
      of uitwerkingsplan als bedoeld in [artikel 3.6, eerste lid, onder a of b, van de Wet ruimtelijke ordening][ref18].


