  - number: XIII
    text: |-
      1 Tot het tijdstip waarop de beheerder zijn eerste verslag als bedoeld in
      [artikel 11.22 van de Wet milieubeheer][ref1] moet hebben gezonden aan Onze Minister, kan Onze Minister
      de locatie van een referentiepunt dat tot stand is gekomen met toepassing van [artikel 11.45][ref2] en
      [artikel 11.46 van de Wet milieubeheer][ref3], op verzoek van de beheerder wijzigen.

      2 In afwijking van [afdeling 11.3.3 van de Wet milieubeheer][ref4] komt het geluidproductieplafond
      op het gewijzigde referentiepunt tot stand met toepassing van [artikel 11.45][ref5] en
      [artikel 11.46 van de Wet milieubeheer][ref6].

      3 Het gewijzigde referentiepunt wordt in het geluidregister opgenomen.
      [Artikel 11.46, tweede lid, onder b tot en met e, van de Wet milieubeheer][ref7] is van overeenkomstige toepassing.


