  - number: XII
    text: |-
      1 Een publicatie, verricht op grond van [artikel 117 van de Wet geluidhinder][ref1], geldt als publicatie als
      bedoeld in [artikel 11.4, tweede lid, van de Wet milieubeheer][ref2].

      2 Een aanwijzing, verricht op grond van [artikel 117a, tweede lid, van de Wet geluidhinder][ref3], blijft in stand
      totdat een nieuwe aanwijzing is verricht op grond van [artikel 11.5 van de Wet milieubeheer][ref4].

      3 Een geluidsbelastingkaart, vastgesteld op grond [artikel 118 van de Wet geluidhinder][ref5], blijft van
      kracht totdat op grond van [artikel 11.6 van de Wet milieubeheer][ref6] een nieuwe geluidsbelastingkaart voor de
      desbetreffende wegen, spoorwegen of gemeente is vastgesteld.

      4 Een actieplan, vastgesteld op grond [artikel 122 van de Wet geluidhinder][ref7], blijft van kracht totdat op
      grond van [artikel 11.11][ref8] of [11.12 van de Wet milieubeheer][ref9] een nieuw actieplan voor de desbetreffende
      wegen, spoorwegen of gemeente is vastgesteld.


