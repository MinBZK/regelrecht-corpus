preamble:
  text: >-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het wenselijk is de weerbaarheid van niet-vitale bedrijven te versterken
    tegen digitale dreigingen;


    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0050130/2026-08-15#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      - *bedrijf:* in Nederland gevestigde natuurlijke persoon of privaatrechtelijke rechtspersoon die bedrijfsmatige
      activiteiten uitvoert, niet zijnde essentiële entiteit of belangrijke entiteit;
      - *belangrijke entiteit:* belangrijke entiteit als bedoeld in [artikel 1 van de Cyberbeveiligingswet][ref1];
      - *CSIRT:* krachtens [artikel 16, eerste lid, van de Cyberbeveiligingswet][ref2] aangewezen Computer security
      incident response team;
      - *essentiële entiteit:* essentiële entiteit als bedoeld in [artikel 1 van de Cyberbeveiligingswet][ref3];
      - *incident:* incident als bedoeld in artikel 6, onder 6, van de NIS2-richtlijn;
      - *netwerk- en informatiesysteem:* netwerk- en informatiesysteem als bedoeld in artikel 6, onder 1, van de NIS2-
      richtlijn;
      - *NIS2-richtlijn:* [Richtlijn (EU) 2022/2555](32022L2555) van het Europees Parlement en de Raad van 14 december
      2022 betreffende maatregelen voor een hoog gezamenlijk niveau van cyberbeveiliging in de Unie, tot wijziging
      van [Verordening (EU) nr. 910/2014](32014R0910) en [Richtlijn (EU) 2018/1972](32018L1972) en tot intrekking van
      [Richtlijn (EU) 2016/1148](32016L1148)*(PbEU* 2022, L 333);
      - *Onze Minister:* Onze Minister van Economische Zaken.


