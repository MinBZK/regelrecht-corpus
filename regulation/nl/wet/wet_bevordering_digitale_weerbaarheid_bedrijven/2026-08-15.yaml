        artikel: '16'
  - number: '3'
    text: |-
      1 Onze Minister kan een rechtspersoon of een orgaan daarvan verzoeken om gegevens te verstrekken die noodzakelijk
      zijn voor de vervulling van de in [artikel 2, eerste lid][ref1], genoemde taken.

      2 De rechtspersoon of het orgaan kan op grond van het eerste lid gevraagde persoonsgegevens ook aan Onze Minister
      verstrekken als die verstrekking onverenigbaar is met de doeleinden waarvoor de persoonsgegevens zijn verzameld.


      [ref1]: https://wetten.overheid.nl/BWBR0050130#Artikel2
    url: https://wetten.overheid.nl/BWBR0050130/2026-08-15#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0050130
        artikel: '2'
  - number: '4'
    text: |-
      1 Ter uitvoering van de in [artikel 2, eerste en tweede lid, onder c][ref1], genoemde taak verstrekt Onze
      Minister geen vertrouwelijke gegevens met betrekking tot een bedrijf die hij ingevolge deze wet verkrijgt, als:

      a. de geheimhouding van die gegevens onvoldoende is geborgd, of

      b. onvoldoende is gewaarborgd dat zij uitsluitend worden gebruikt voor het doel waarvoor zij worden verstrekt.

      2 Ter uitvoering van de in [artikel 2, tweede lid, onder c][ref2], genoemde taken kan Onze Minister
      vertrouwelijke gegevens met betrekking tot een essentiële entiteit of belangrijke entiteit die hij ingevolge deze
      wet verkrijgt, zonder dier instemming verstrekken aan een CSIRT, ten behoeve van de uitvoering van diens taken als
      bedoeld in [artikel 16, tweede lid, van de Cyberbeveiligingswet][ref3].

      3 De [Wet open overheid][ref4] is niet van toepassing op gegevens als bedoeld in het eerste en tweede lid, die
      herleid kunnen worden tot een bedrijf of een in het tweede lid bedoelde entiteit, behalve voor zover die gegevens
      milieu-informatie inhouden als bedoeld in [artikel 19.1a van de Wet milieubeheer][ref5]. De eerste volzin geldt
      ook als de gegevens bij een ander overheidsorgaan berusten na verstrekking op grond van dit artikel.


