        artikel: '1'
  - number: '2'
    text: |-
      1 Onze Minister heeft, ter versterking van de digitale weerbaarheid van bedrijven, de volgende taken:

      a. het analyseren en het onderzoeken van gegevens over kwetsbaarheden, dreigingen en incidenten die betrekking
      kunnen hebben op netwerk- en informatiesystemen van bedrijven;

      b. het informeren en adviseren van bedrijven over kwetsbaarheden, dreigingen en incidenten die betrekking kunnen
      hebben op hun netwerk- en informatiesystemen;

      c. indien relevant het verstrekken van ingevolge onder a verkregen gegevens aan bedrijven.

      2 Voorts heeft Onze Minister, ter verdere versterking van de digitale weerbaarheid van de Nederlandse samenleving
      of ter voorkoming van nadelige maatschappelijke gevolgen in en buiten Nederland, de volgende taken:

      a. het stimuleren van de ontwikkeling van samenwerkingsverbanden tussen bedrijven op het gebied van digitale
      weerbaarheid;

      b. samenwerken met bestuursorganen en rechtspersonen op het gebied van digitale weerbaarheid;

      c. het verstrekken van ingevolge het eerste lid, onder a, verkregen gegevens over dreigingen
      en incidenten aan een CSIRT, ten behoeve van de uitvoering van diens taken als bedoeld in
      [artikel 16, tweede lid, van de Cyberbeveiligingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0052872#Artikel16
    url: https://wetten.overheid.nl/BWBR0050130/2026-08-15#Artikel2
