preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de weerbaarheid van niet-vitale bedrijven te versterken
    tegen digitale dreigingen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0050130/2024-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *aanbieder:* aanbieder als bedoeld in [artikel 1 van de Wet beveiliging netwerk- en informatiesystemen][ref1];
        - *bedrijf:* in Nederland gevestigde natuurlijke persoon of privaatrechtelijke rechtspersoon die
      bedrijfsmatige activiteiten uitvoert, niet zijnde vitale aanbieders of digitaledienstverleners als bedoeld in
      [artikel 1 van de Wet beveiliging netwerk- en informatiesystemen][ref2];
        - *CSIRT voor digitale diensten:* CSIRT voor digitale diensten als bedoeld in
      [artikel 1 van de Wet beveiliging netwerk- en informatiesystemen][ref3];
        - *incident:* incident als bedoeld in artikel 4, onder 7, van de NIB-richtlijn;
        - *netwerk- en informatiesysteem:* netwerk- en informatiesysteem als bedoeld in artikel 4, onder 1, van de NIB-
      richtlijn;
        - *NIB-richtlijn:* [richtlijn (EU) 2016/1148](32016L1148) van het Europees Parlement en de Raad van 6 juli 2016
      houdende maatregelen voor een hoog gemeenschappelijk niveau van beveiliging van netwerk- en informatiesystemen in
      de Unie (PbEU 2016, L 194);
        - *Onze Minister:* Onze Minister van Economische Zaken en Klimaat.


