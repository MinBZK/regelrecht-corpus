        artikel: '2'
  - number: '4'
    text: |-
      1 Ter uitvoering van de in [artikel 2, eerste en tweede lid, onder c en d][ref1], genoemde taak verstrekt Onze
      Minister geen vertrouwelijke gegevens met betrekking tot een bedrijf die hij ingevolge deze wet verkrijgt, als:

      a. de geheimhouding van die gegevens onvoldoende is geborgd, of

      b. onvoldoende is gewaarborgd dat zij uitsluitend worden gebruikt voor het doel waarvoor zij worden verstrekt.

      2 Ter uitvoering van de in [artikel 2, tweede lid, onder c][ref2], genoemde taken kan
      Onze Minister vertrouwelijke gegevens met betrekking tot een vitale aanbieder als bedoeld in
      [artikel 1 van de Wet beveiliging netwerk- en informatiesystemen][ref3] of een andere aanbieder die
      onderdeel is van de Rijksoverheid die hij ingevolge deze wet verkrijgt, zonder diens instemming verstrekken
      aan de Minister van Justitie en Veiligheid, ten behoeve van de uitvoering van diens taken als bedoeld in
      [artikel 3, eerste lid, van de Wet beveiliging netwerk- en informatiesystemen][ref4].

      3 Ter uitvoering van de in [artikel 2, tweede lid, onder d][ref5], genoemde taken kan Onze
      Minister vertrouwelijke gegevens met betrekking tot een digitaledienstverlener als bedoeld in
      [artikel 1 van de Wet beveiliging netwerk- en informatiesystemen][ref6] die hij ingevolge deze wet verkrijgt,
      zonder diens instemming verstrekken aan het CSIRT voor digitale diensten, ten behoeve van de uitvoering van diens
      taken als bedoeld in [artikel 4, vierde lid, van de Wet beveiliging netwerk- en informatiesystemen][ref7].

      4 De [Wet open overheid][ref8] is niet van toepassing op gegevens als bedoeld in het eerste tot en met
      derde lid, die herleid kunnen worden tot een bedrijf of een in het tweede of derde lid bedoelde aanbieder
      onderscheidenlijk digitaledienstverlener, behalve voor zover die gegevens milieu-informatie inhouden als bedoeld
      in [artikel 19.1a van de Wet milieubeheer][ref9]. De eerste volzin geldt ook als de gegevens bij een ander
      overheidsorgaan berusten na verstrekking op grond van dit artikel.


