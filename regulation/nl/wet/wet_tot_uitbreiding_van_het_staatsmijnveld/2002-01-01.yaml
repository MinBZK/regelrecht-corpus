preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo wij in overweging genomen hebben, dat het wenschelijk is van Staatswege een Steenkolenmijn in het terrein bij
    Vlodrop te ontginnen;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001901/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De ontginning van een steenkolenmijn in het terrein bij *Vlodrop*, dat op de bij deze wet behoorende kaart in gele
      kleur met rood omlijnd is aangeduid, zal geschieden van Staatswege; aan den Staat wordt de eigendom van deze mijn
      toegekend als ware voor de ontginning volgens de wet van 21 April 1810 (*Bulletin des Lois* n°. 285) concessie
      verleend.
    url: https://wetten.overheid.nl/BWBR0001901/2002-01-01#Artikel1
  - number: '2'
    text: |-
      Het in [artikel 1][ref1] bedoelde terrein in de provincie *Limburg,* groot plm. 2200 H.A., is begrensd als volgt:

      ten westen door een rechte lijn, getrokken van grenspaal 407 naar grenspaal n°. 373;

      ten Zuiden, ten Oosten en ten Noorden door de Rijksgrens met Duitschland.


      [ref1]: https://wetten.overheid.nl/BWBR0001901#Artikel1
    url: https://wetten.overheid.nl/BWBR0001901/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001901
        artikel: '1'
  - number: '3'
    text: |-
      De eigenaren van grond, gelegen boven de in de [artikelen 1][ref1] en [2][ref2] aangewezen mijn, hebben recht op
      uitkeering uit 's Rijks schatkist van € 5,67 per H.A.


      [ref1]: https://wetten.overheid.nl/BWBR0001901#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001901#Artikel2
    url: https://wetten.overheid.nl/BWBR0001901/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001901
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001901
        artikel: '2'
  - number: '4'
    text: |-
      1 Hij, die een uitkeering, als in [artikel 3][ref1] bedoeld, meent te kunnen vorderen, moet zich ter verkrijging
      daarvan binnen één jaar na het in werking treden van deze wet, met overlegging van bewijsstukken tot staving
      van zijn recht, wenden tot Onzen Minister van Landbouw, Nijverheid en Handel, die hem binnen zes maanden na dien
      termijn kennis geeft, of hij zich met de vordering, en tot welk bedrag, vereenigt.

      2 Wordt aan den belanghebbende het bedrag, waarop hij aanspraak maakt, niet binnen zes maanden na dagteekening van
      de in het eerste lid voorgeschreven kennisgeving uitbetaald, zoo kan hij, binnen zes maanden na het verstrijken van
      dien termijn, zijne vordering in rechte doen gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0001901#Artikel3
    url: https://wetten.overheid.nl/BWBR0001901/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001901
        artikel: '3'
  - number: '5'
    text: |-
      Met uitzondering van de bepalingen betreffende de uitkeeringen aan de schatkist en betreffende de mijnpolitie,
      alsmede van die, welke onderwerpen regelen, waarin bij deze Wet is voorzien, is de wet van 21 April 1810 (*Bulletin
      des Lois* n°. 285) op ontginning van deze mijn door den Staat toepasselijk.
    url: https://wetten.overheid.nl/BWBR0001901/2002-01-01#Artikel5
