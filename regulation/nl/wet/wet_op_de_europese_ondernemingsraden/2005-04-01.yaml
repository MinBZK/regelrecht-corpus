$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_de_europese_ondernemingsraden
regulatory_layer: WET
publication_date: '2017-12-15'
valid_from: '2005-04-01'
bwb_id: BWBR0008508
url: https://wetten.overheid.nl/BWBR0008508/2005-04-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is uitvoering te geven aan de richtlijn nr. 94/45/EG
    van de Raad van de Europese Unie van 22 september 1994 inzake de instelling van een Europese ondernemingsraad of
    van een procedure in ondernemingen of concerns met een communautaire dimensie ter informatie en raadpleging van
    de werknemers;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel1
  - number: 1.1.a
    text: |-
      lid-staat: een lid-staat van de Europese Unie of een andere staat die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte;
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel1
  - number: 1.1.b
    text: |-
      richtlijn: de [richtlijn nr. 94/45/EG](31994L0045) van de Raad van de Europese Unie van 22 september 1994
      inzake de instelling van een Europese ondernemingsraad of van een procedure in ondernemingen of concerns met een
      communautaire dimensie ter informatie en raadpleging van de werknemers (*PbEG* L 254);
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel1
  - number: 1.1.c
    text: |-
      een communautaire onderneming: een onderneming, die sinds twee jaar in ten minste twee lid-staten elk gemiddeld ten
      minste 150 werknemers en in de lid-staten samen gemiddeld ten minste 1000 werknemers heeft, tenzij zij behoort tot
      een communautaire groep;
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel1
  - number: 1.1.d
    text: |-
      een communautaire groep: het geheel van ondernemingen bestaande uit een moederonderneming als bedoeld in
      [artikel 2][ref1] en de onderneming of ondernemingen waarover zij de zeggenschap uitoefent en waarvan:


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel2
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '2'
        hoofdstuk: '1'
  - number: 1.1.d.1°
    text: ten minste twee ondernemingen in verschillende lid-staten zijn gevestigd en
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel1
  - number: 1.1.d.2°
    text: |-
      sinds twee jaar ten minste een onderneming gemiddeld ten minste 150 werknemers in een lid-staat en een andere
      onderneming gemiddeld ten minste 150 werknemers in een andere lid-staat heeft en
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel1
  - number: 1.1.d.3°
    text: alle ondernemingen tezamen sinds twee jaar gemiddeld ten minste 1000 werknemers in de lid-staten hebben;
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel1
  - number: 1.1.e
    text: |-
      hoofdbestuur: 'in het geval van een communautaire onderneming: het bestuur van deze onderneming; in het geval van'
      een communautaire groep: het bestuur van de moederonderneming, bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel2
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '2'
        hoofdstuk: '1'
  - number: '1.2'
    text: |-
      Indien een communautaire onderneming haar woonplaats of zetel buiten de lid-staten heeft, wordt als hoofdbestuur
      aangemerkt:
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel1
  - number: 1.2.a
    text: |-
      een daartoe door de communautaire onderneming aangewezen persoon, belast met de feitelijke leiding van een van haar
      vestigingen binnen een lid-staat, dan wel, bij gebreke van zodanige aanwijzing:
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel1
  - number: 1.2.b
    text: |-
      degene of degenen die zijn belast met de feitelijke leiding van de vestiging die het grootste aantal werknemers
      heeft in één lid-staat.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel1
  - number: '1.3'
    text: |-
      Indien de moederonderneming, bedoeld in [artikel 2][ref1], haar woonplaats of zetel buiten de lid-staten heeft, kan
      zij als haar vertegenwoordiger aanwijzen het bestuur van een groepsonderneming met woonplaats of zetel binnen de
      lid-staten. Bij gebreke van zulk een aanwijzing wordt het bestuur van de groepsonderneming met woonplaats of zetel
      binnen de lid-staten die het grootste aantal werknemers heeft in één lid-staat, als zodanig aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel2
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '2'
        hoofdstuk: '1'
  - number: '1.4'
    text: |-
      Handelen of nalaten door het hoofdbestuur, bedoeld in het eerste lid, onderdeel *e* onderscheidenlijk het derde
      lid, wordt toegerekend aan de natuurlijke persoon of rechtspersoon, die de communautaire onderneming of de
      moederonderneming onderscheidenlijk de in het derde lid bedoelde groepsonderneming in stand houdt.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel1
  - number: '2.1'
    text: |-
      In deze wet wordt onder moederonderneming verstaan: de onderneming die binnen een communautaire groep direct
      of indirect een overheersende zeggenschap kan uitoefenen op een andere onderneming en die zelf geen onderneming
      is waarover door een andere onderneming direct of indirect een overheersende zeggenschap wordt uitgeoefend. Een
      onderneming wordt, tenzij het tegendeel blijkt, vermoed moederonderneming te zijn, indien zij:
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel2
  - number: 2.1.a
    text: |-
      meer dan de helft van de leden van het bestuursorgaan of van het leidinggevend dan wel toezichthoudend orgaan van
      de andere onderneming kan benoemen, of
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel2
  - number: 2.1.b
    text: meer dan de helft van de stemrechten in de algemene vergadering van de andere onderneming kan uitoefenen of
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel2
  - number: 2.1.c
    text: de meerderheid van het geplaatste kapitaal van de andere onderneming verschaft.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel2
  - number: '2.2'
    text: |-
      Voor de toepassing van het eerste lid worden onder de rechten van de moederonderneming ten aanzien van het
      kapitaal, het stemrecht en de benoeming mede begrepen:
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel2
  - number: 2.2.a
    text: de overeenkomstige rechten van andere ondernemingen waarop zij overheersende zeggenschap uitoefent;
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel2
  - number: 2.2.b
    text: |-
      de overeenkomstige rechten van personen of organen die handelen onder eigen naam doch voor rekening van de
      moederonderneming of van een of meer van haar groepsondernemingen.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel2
  - number: '2.3'
    text: |-
      Voor de toepassing van het eerste lid worden de rechten ten aanzien van het kapitaal en het stemrecht niet
      toegerekend aan een onderneming, indien zij deze voor rekening van anderen houdt.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel2
  - number: '2.4'
    text: |-
      Voor de toepassing van het eerste lid worden stemrechten, verbonden aan verpande aandelen, toegerekend aan de
      pandhouder, indien hij mag bepalen hoe de rechten worden uitgeoefend. Zijn de aandelen evenwel verpand voor een
      lening die de pandhouder heeft verstrekt in de gewone uitoefening van zijn bedrijf, dan worden de stemrechten hem
      slechts toegerekend, indien hij deze in eigen belang heeft uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel2
  - number: '2.5'
    text: |-
      Geen moederonderneming is een onderneming als bedoeld in [artikel 3, vijfde lid, onder ][ref1] van [Verordening
      (EEG) 4064/89](31989R4064) van de Raad van 21 december 1989 betreffende de controle op concentraties van
      ondernemingen (*PbEG* L 395).


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel3
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '3'
        hoofdstuk: '1'
  - number: '2.6'
    text: |-
      Het recht dat op een onderneming van toepassing is, bepaalt of die onderneming een moederonderneming is als bedoeld
      in het eerste lid. Indien dat recht niet het recht van een lid-staat is, wordt dat bepaald door het recht dat
      van toepassing is op de groepsonderneming, waarvan het bestuur de moederonderneming vertegenwoordigt krachtens
      [artikel 1, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel1
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '1'
        hoofdstuk: '1'
  - number: '2.7'
    text: Indien meer ondernemingen van een groep aan een of meer criteria van het eerste lid voldoen,
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel2
  - number: 2.7.a
    text: |-
      wordt de onderneming die voldoet aan het criterium [onder a)][ref1] aangemerkt als moederonderneming, waarbij het
      benoemingsrecht met betrekking tot het leidinggevend orgaan voorrang heeft;


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel2
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '2'
        hoofdstuk: '1'
  - number: 2.7.b
    text: |-
      heeft, indien toepassing van [onderdeel ][ref1] niet leidt tot aanmerking van één onderneming als
      moederonderneming, het criterium [onder ][ref2]) voorrang boven dat [onder ][ref3]);


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008508#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0008508#Artikel2
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0008508
        artikel: '2'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0008508
        artikel: '2'
        hoofdstuk: '1'
  - number: '3.1'
    text: |-
      In deze wet wordt, voor zover het in Nederland werkzame personen betreft, onder werknemer verstaan: degene die
      krachtens een arbeidsovereenkomst werkzaam is in de communautaire onderneming of de communautaire groep, en
      voor zover het in de overige lid-staten werkzame personen betreft: hetgeen het recht van die lid-staat daaronder
      verstaat.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel3
  - number: '3.2'
    text: |-
      Voor de toepassing van de [artikelen 4, achtste lid][ref1], [7][ref2], [8, tweede lid][ref3],
      [11, zesde lid][ref4], en [19, zevende lid][ref5], wordt onder vertegenwoordigers van werknemers verstaan: hetgeen
      daaronder wordt verstaan krachtens het recht van de lid-staat waarin die werknemers werkzaam zijn; voor Nederland
      zijn dat ondernemingsraden.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008508#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0008508#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0008508#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0008508#Artikel19
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '4'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0008508
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0008508
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0008508
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0008508
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '4.1'
    text: |-
      Ten aanzien van de in Nederland werkzame werknemers die lid zijn van een bijzondere onderhandelingsgroep of van een
      Europese ondernemingsraad dan wel optreden als vertegenwoordigers bij een andere wijze van informatieverstrekking
      en raadpleging van werknemers, gelden het tweede tot en met het zevende lid.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel4
  - number: '4.2'
    text: |-
      Deze werknemers behouden hun aanspraak op loon voor de tijd gedurende welke zij niet de bedongen arbeid hebben
      verricht ten gevolge van het bijwonen van een vergadering van de bijzondere onderhandelingsgroep of van de Europese
      ondernemingsraad, dan wel van een vergadering in het kader van de andere wijze van informatieverstrekking en
      raadpleging.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel4
  - number: '4.3'
    text: |-
      Voor zover dat redelijkerwijs noodzakelijk is voor de vervulling van hun taak, wordt hun in werktijd en met behoud
      van loon de gelegenheid geboden tot onderling beraad en overleg met andere personen over aangelegenheden waarbij
      zij in de uitoefening van hun functie zijn betrokken en om scholing en vorming te ontvangen.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel4
  - number: '4.4'
    text: |-
      Zij zijn verplicht tot geheimhouding van alle zaken- en bedrijfsgeheimen die zij in hun hoedanigheid vernemen,
      alsmede van alle aangelegenheden ten aanzien waarvan hun geheimhouding is opgelegd of waarvan zij, in verband met
      opgelegde geheimhouding, het vertrouwelijke karakter moeten begrijpen. Deze verplichting geldt ook voor personen
      die een functie als bedoeld in het eerste lid vervullen zonder werknemer te zijn.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel4
  - number: '4.5'
    text: |-
      De verplichting tot geheimhouding geldt niet tegenover hem die wordt benaderd voor overleg of als deskundige
      als bedoeld in de [artikelen 12][ref1] en [20][ref2], mits het hoofdbestuur of degene die de geheimhouding heeft
      opgelegd, vooraf daarvoor toestemming heeft gegeven en de betrokken persoon schriftelijk heeft verklaard dat hij
      zich ten aanzien van de betrokken aangelegenheid tot geheimhouding verplicht. In dat geval is ten aanzien van de
      bedoelde persoon de geheimhoudingsplicht van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0008508#Artikel20
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008508
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '4.6'
    text: |-
      De plicht tot geheimhouding vervalt niet door beëindiging van de in het eerste lid bedoelde functie, noch door
      beëindiging van de werkzaamheden van de betrokkene in de onderneming.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel4
  - number: '4.7'
    text: |-
      De werkgever draagt er zorg voor, dat degenen die kandidaat staan of gestaan hebben voor een functie als bedoeld
      in het eerste lid, alsmede degenen die deze functie vervullen of hebben vervuld, niet uit hoofde hiervan worden
      benadeeld in hun positie in de onderneming.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel4
  - number: '4.8'
    text: |-
      Iedere in Nederland werkzame werknemer of werknemersvertegenwoordiger kan van de werkgever verlangen dat deze hem
      een overzicht geeft van het aantal werknemers dat bij de communautaire onderneming of groep werkzaam is, alsmede
      van de verdeling van deze werknemers over de verschillende lid-staten.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel4
  - number: '4.9'
    text: |-
      De werkgever van een in Nederland werkzame werknemer die is aangewezen of gekozen als lid van een bijzondere
      onderhandelingsgroep of van een Europese ondernemingsraad doet van die verkiezing of aanwijzing mededeling aan
      het hoofdbestuur.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel4
  - number: '5.1'
    text: |-
      Iedere belanghebbende kan de ondernemingskamer van het gerechtshof te Amsterdam verzoeken te bepalen dat gevolg
      dient te worden gegeven aan hetgeen is bepaald bij deze wet, met uitzondering van [artikel 4][ref1], voor zo ver
      het tweede lid niet anders bepaalt, of bij een overeenkomst als bedoeld in de [artikelen 11][ref2] of [24][ref3].
      Een bijzondere onderhandelingsgroep of de leden daarvan en een Europese ondernemingsraad, ingesteld krachtens deze
      wet, kunnen niet in de proceskosten van deze procedure worden veroordeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008508#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0008508#Artikel24
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '4'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0008508
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0008508
        artikel: '24'
        hoofdstuk: '4'
  - number: '5.2'
    text: |-
      De bijzondere onderhandelingsgroep of de leden daarvan en een Europese ondernemingsraad kunnen aan de
      ondernemingskamer van het gerechtshof te Amsterdam verzoeken om:
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel5
  - number: 5.2.a
    text: |-
      krachtens [artikel 4, vierde en vijfde lid][ref1], [11, zevende lid][ref2] of [19, vijfde lid][ref3], opgelegde
      geheimhouding op te heffen op de grond dat degene die de geheimhouding heeft opgelegd bij afweging van de betrokken
      belangen niet in redelijkheid tot het opleggen van geheimhouding had kunnen besluiten;


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008508#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0008508#Artikel19
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '4'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0008508
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0008508
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 5.2.b
    text: |-
      degene die informatie heeft geweigerd krachtens [artikel 11, zevende lid][ref1], of [19, vijfde lid][ref2], te
      verplichten tot het verstrekken van informatie op de grond dat deze bij afweging van de betrokken belangen niet in
      redelijkheid tot het weigeren van informatie had kunnen besluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0008508#Artikel19
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008508
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '6.1'
    text: |-
      Dit hoofdstuk is van toepassing op een communautaire onderneming en een moederonderneming met woonplaats of zetel
      in Nederland.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel6
  - number: '6.2'
    text: |-
      Ingeval een communautaire onderneming of moederonderneming haar woonplaats of zetel buiten de lid-staten
      heeft, is dit hoofdstuk van toepassing, indien de in [artikel 1, tweede en derde lid][ref1], bedoelde vestiging
      onderscheidenlijk groepsonderneming woonplaats of zetel heeft in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel1
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '1'
        hoofdstuk: '1'
  - number: '7'
    text: |-
      De communautaire onderneming of de moederonderneming is verplicht op verzoek van werknemers of
      werknemersvertegenwoordigers een overzicht te geven van het aantal werknemers dat bij de communautaire onderneming
      of de communautaire groep werkzaam is en de verdeling van deze werknemers over de verschillende lid-staten.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel7
  - number: '8.1'
    text: |-
      Het hoofdbestuur kan een bijzondere onderhandelingsgroep oprichten teneinde daarmee in onderhandeling te
      treden over een overeenkomst tot instelling van een Europese ondernemingsraad, al dan niet overeenkomstig
      [paragraaf 3][ref1], of tot een regeling waarbij op een andere wijze wordt voorzien in het verstrekken
      van inlichtingen aan en het raadplegen van werknemers of hun vertegenwoordigers over grensoverschrijdende
      aangelegenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008508
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '8.2'
    text: |-
      Het hoofdbestuur is verplicht tot instelling van een bijzondere onderhandelingsgroep als bedoeld in het eerste
      lid, indien van ten minste 100 werknemers of hun vertegenwoordigers afkomstig uit tenminste twee ondernemingen of
      vestigingen in ten minste twee verschillende lid-staten een schriftelijk verzoek daartoe is ontvangen. Indien een
      verzoek daartoe is ontvangen door een tot de communautaire onderneming of groep behorende vestiging of onderneming,
      draagt het hoofdbestuur er zorg voor dat het verzoek onverwijld naar hem wordt doorgezonden en dat van de
      doorzending mededeling wordt gedaan aan de verzoekers.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel8
  - number: '8.3'
    text: |-
      De in het tweede lid bedoelde verplichting geldt, indien de bijzondere onderhandelingsgroep een besluit heeft
      genomen als bedoeld in [artikel 11, tweede lid][ref1], niet gedurende twee jaar na het nemen van dat besluit,
      tenzij het hoofdbestuur en de bijzondere onderhandelingsgroep anders zijn overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel11
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '9.1'
    text: |-
      De bijzondere onderhandelingsgroep bestaat uit één lid voor elke lid-staat waar werknemers van de communautaire
      onderneming of groep werkzaam zijn en één, twee, onderscheidenlijk drie aanvullende leden voor elke lid-staat waar
      ten minste een kwart, de helft, onderscheidenlijk driekwart van die werknemers werkzaam is.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel9
  - number: '9.2'
    text: Elk lid wordt gekozen of aangewezen overeenkomstig het recht van de lid-staat waarin hij werkzaam is.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel9
  - number: '9.3'
    text: |-
      De zetelverdeling wordt in overeenstemming gehouden met het eerste lid; indien dat er toe leidt dat het aantal
      aanvullende leden voor een lid-staat wijzigt zonder dat met betrekking tot de bezetting van die zetels een
      nieuwe verkiezing of aanwijzing heeft plaatsgevonden, hebben de voor die lid-staat zitting hebbende leden voor de
      toepassing van [artikel 13][ref1] samen zoveel stemmen als overeenkomt met het aantal zetels dat voor die lid-staat
      krachtens het eerste lid is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel13
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '10.1'
    text: |-
      Met betrekking tot de Nederlandse vestigingen en ondernemingen worden de leden van de bijzondere
      onderhandelingsgroep aangewezen, dan wel wordt hun aanwijzing ingetrokken, door de bij die vestigingen of
      ondernemingen ingestelde ondernemingsraden.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel10
  - number: '10.2'
    text: |-
      Indien met betrekking tot ondernemingsraden als bedoeld in het eerste lid een of meer centrale ondernemingsraden
      zijn ingesteld, geschiedt de aanwijzing of intrekking door die raad of raden.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel10
  - number: '10.3'
    text: |-
      Indien geen centrale ondernemingsraad is ingesteld, maar wel een of meer groepsondernemingsraden, geschiedt de
      aanwijzing of intrekking door die raad of raden.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel10
  - number: '10.4'
    text: |-
      Indien niet alle ondernemingsraden of groepsondernemingsraden zijn vertegenwoordigd in een centrale
      ondernemingsraad of groepsondernemingsraad, geschiedt de aanwijzing of intrekking door de centrale
      onderscheidenlijk groepsondernemingsraad of raden en de niet-vertegenwoordigde ondernemingsraden gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel10
  - number: '10.5'
    text: |-
      Indien er geen enkele ondernemingsraad is ingesteld, worden de leden van de bijzondere onderhandelingsgroep gekozen
      door de gezamenlijke in Nederland werkzame werknemers van de communautaire onderneming of groep. De verkiezing
      geschiedt bij geheime schriftelijke stemming, waarbij elke werknemer één stem heeft. Ten behoeve van de verkiezing
      is een vereniging van werknemers, die bedoelde werknemers onder haar leden telt, krachtens haar statuten ten doel
      heeft de belangen van haar leden als werknemers te behartigen en als zodanig binnen de betrokken onderneming of
      groep werkzaam is en voorts in het bezit is van volledige rechtsbevoegdheid, bevoegd een kandidatenlijst in te
      dienen, mits zij met haar leden binnen de onderneming of groep over de samenstelling van de kandidatenlijst overleg
      heeft gepleegd.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel10
  - number: '10.6'
    text: |-
      Bij de toepassing van het eerste tot en met vierde lid worden werknemers van Nederlandse vestigingen
      of ondernemingen die niet in een ondernemingsraad, groepsondernemingsraad of centrale ondernemingsraad
      vertegenwoordigd zijn in de gelegenheid gesteld zich over de als lid van de bijzondere onderhandelingsgroep aan te
      wijzen personen uit te spreken.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel10
  - number: '10.7'
    text: |-
      Personen die behoren tot het varend personeel in de koopvaardij, kunnen niet als lid van een bijzondere
      onderhandelingsgroep worden aangewezen of verkozen.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel10
  - number: '11.1'
    text: |-
      Na de oprichting van de bijzondere onderhandelingsgroep belegt het hoofdbestuur met deze een vergadering teneinde
      te onderhandelen over een overeenkomst als bedoeld in [artikel 8, eerste lid][ref1]. Het stelt de groep in de
      gelegenheid om bijeen te komen voordat deze vergadering plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel8
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '11.2'
    text: |-
      Zolang een overeenkomst als bedoeld in [artikel 8, eerste lid][ref1], niet tot stand is gekomen, kan de bijzondere
      onderhandelingsgroep besluiten om geen onderhandelingen aan te gaan, dan wel reeds lopende onderhandelingen af
      te breken.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel8
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '11.3'
    text: |-
      Indien het hoofdbestuur en de bijzondere onderhandelingsgroep overeenkomen een Europese ondernemingsraad in te
      stellen, dan wordt bij overeenkomst tevens het reglement van de raad vastgesteld. Tenzij het hoofdbestuur en de
      bijzondere onderhandelingsgroep anders overeenkomen, regelt het reglement tenminste de volgende aangelegenheden:
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel11
  - number: 11.3.a
    text: |-
      voor welke vestigingen of ondernemingen van de communautaire onderneming of groep de Europese ondernemingsraad
      is ingesteld;
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel11
  - number: 11.3.b
    text: de omvang en samenstelling van de raad en de zittingsduur van zijn leden;
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel11
  - number: 11.3.c
    text: het werkterrein en de bevoegdheden van de raad;
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel11
  - number: 11.3.d
    text: de wijze waarop de raad wordt ingelicht en geraadpleegd;
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel11
  - number: 11.3.e
    text: de frequentie, duur en plaats van de vergaderingen van de raad;
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel11
  - number: 11.3.f
    text: de financiële en materiële middelen waarover de raad kan beschikken.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel11
  - number: '11.4'
    text: |-
      Indien het hoofdbestuur en de bijzondere onderhandelingsgroep een andere procedure van informatieverstrekking
      en raadpleging van werknemers of hun vertegenwoordigers dan de instelling van een Europese ondernemingsraad
      overeenkomen, wordt bij overeenkomst tevens vastgelegd op welke wijze dit zal gebeuren. Daarbij wordt tenminste
      voorzien in het navolgende:
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel11
  - number: 11.4.a
    text: voor welke vestigingen of ondernemingen van de communautaire onderneming of groep de procedure geldt;
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel11
  - number: 11.4.b
    text: |-
      hoe de werknemers of hun vertegenwoordigers worden ingelicht en geraadpleegd over grensoverschrijdende
      aangelegenheden die belangrijke gevolgen voor de werknemers hebben;
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel11
  - number: 11.4.c
    text: |-
      de wijze waarop de werknemers of hun vertegenwoordigers over de in [onderdeel ][ref1] bedoelde aangelegenheden
      kunnen vergaderen;


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel11
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 11.4.d
    text: de financiële en materiële middelen die voor de uitvoering van de procedure ter beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel11
  - number: '11.5'
    text: |-
      Het hoofdbestuur en de bijzondere onderhandelingsgroep kunnen overeenkomen dat voor delen van de communautaire
      onderneming of groep afzonderlijke Europese ondernemingsraden zullen worden ingesteld, dan wel afzonderlijke
      procedures zullen gelden. Eveneens kunnen zij overeenkomen dat voor een of meer delen van de communautaire
      onderneming of groep een of meer Europese ondernemingsraden worden ingesteld en voor andere delen een of meer
      procedures zullen gelden.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel11
  - number: '11.6'
    text: |-
      De overeenkomst tussen het hoofdbestuur en de bijzondere onderhandelingsgroep houdt bepalingen in omtrent de duur
      van de overeenkomst, de wijze van onderhandelen over een nieuwe overeenkomst en de wijze waarop de overeenkomst
      wordt aangepast aan wijzigingen in de structuur of grootte van de communautaire onderneming of groep en in de
      aantallen werknemers die in de lid-staten werkzaam zijn. Indien deze bepalingen niet inhouden, dat werknemers
      of hun vertegenwoordigers van ondernemingen of vestigingen, die na het sluiten van de overeenkomst tot de
      communautaire onderneming of groep zijn gaan behoren, binnen twee jaar worden betrokken bij de vernieuwing of
      aanpassing daarvan dan wel niet binnen twee jaar worden vertegenwoordigd in de Europese ondernemingsraad of
      bij de andere procedure van informatieverstrekking en raadpleging, is het hoofdbestuur verplicht om een nieuw
      samengestelde bijzondere onderhandelingsgroep in te stellen indien tenminste 100 zodanige werknemers of hun
      vertegenwoordigers daarom verzoeken.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel11
  - number: '11.7'
    text: |-
      Het hoofdbestuur behoeft geen informatie te verstrekken, voor zover dat in redelijkheid het functioneren van de
      communautaire onderneming of de groep ernstig zou belemmeren dan wel schaden. Het hoofdbestuur kan terzake van
      de informatieverstrekking geheimhouding opleggen, indien daarvoor een redelijke grond bestaat; zoveel mogelijk
      vóór de behandeling van de betrokken aangelegenheid wordt meegedeeld, welke grond bestaat voor het opleggen van
      de geheimhouding, welke schriftelijk of mondeling verstrekte gegevens onder de geheimhouding vallen, hoelang deze
      dient te duren, alsmede of er personen zijn ten aanzien van wie de geheimhouding niet in acht behoeft te worden
      genomen.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel11
  - number: '11.8'
    text: Het hoofdbestuur staat in voor de naleving van rechten en verplichtingen, opgenomen in de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel11
  - number: '12.1'
    text: De bijzondere onderhandelingsgroep kan zich in de onderhandelingen doen bijstaan door een of meer deskundigen.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel12
  - number: '12.2'
    text: |-
      De kosten die redelijkerwijze noodzakelijk zijn voor de vervulling van de taak van de bijzondere
      onderhandelingsgroep komen ten laste van de communautaire onderneming of de moederonderneming. Voor de kosten
      van het raadplegen van een of meer deskundigen of van het voeren van rechtsgedingen geldt dit slechts, indien de
      communautaire onderneming of de moederonderneming vooraf van de te maken kosten in kennis is gesteld.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel12
  - number: '13.1'
    text: |-
      Ieder lid van de bijzondere onderhandelingsgroep heeft, onverminderd [artikel 9, derde lid][ref1], één stem. De
      bijzondere onderhandelingsgroep besluit bij volstrekte meerderheid van het aantal uitgebrachte stemmen.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel9
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '13.2'
    text: |-
      Een besluit als bedoeld in [artikel 11, tweede lid][ref1], behoeft een meerderheid van twee derden van het aantal
      uitgebrachte stemmen.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel11
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '13.3'
    text: |-
      Een besluit tot het aangaan van een overeenkomst als bedoeld in [artikel 11, eerste lid][ref1], behoeft tenminste
      zoveel stemmen als overeenkomt met de meerderheid van het aantal stemmen dat kan worden uitgebracht wanneer de
      bijzondere onderhandelingsgroep voltallig vergadert.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel11
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '14'
    text: |-
      Het hoofdbestuur draagt er zorg voor dat binnen de communautaire onderneming of groep de samenstelling van de
      bijzondere onderhandelingsgroep alsmede het tijdstip waarop een vergadering als bedoeld in [artikel 11][ref1] zal
      worden gehouden, wordt bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel11
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '15'
    text: 'Het hoofdbestuur is verplicht overeenkomstig deze paragraaf een Europese ondernemingsraad in te stellen indien:'
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel15
  - number: 15.a
    text: |-
      het hoofdbestuur er blijk van heeft gegeven niet binnen zes maanden na de ontvangst van een verzoek als bedoeld in
      [artikel 8, tweede lid][ref1], te zullen onderhandelen met een bijzondere onderhandelingsgroep;


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel8
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 15.b
    text: |-
      het hoofdbestuur en de bijzondere onderhandelingsgroep geen overeenkomst als bedoeld in
      [artikel 11, eerste lid][ref1], hebben gesloten binnen drie jaar na de ontvangst van een verzoek als bedoeld
      in [artikel 8, tweede lid][ref2], dan wel, indien het hoofdbestuur de bijzondere onderhandelingsgroep eigener
      beweging heeft ingesteld, binnen drie jaar na de datum van de instelling, tenzij een besluit als bedoeld in
      [artikel 11, tweede lid][ref3], van kracht is.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0008508#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0008508#Artikel11
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008508
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0008508
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '16.1'
    text: |-
      Indien de communautaire onderneming of groep minder dan 5000 werknemers heeft, bestaat de Europese ondernemingsraad
      uit één lid voor elke lid-staat waar de werknemers werkzaam zijn en één, twee, onderscheidenlijk drie aanvullende
      leden voor elke lid-staat waar ten minste een kwart, de helft, onderscheidenlijk driekwart van die werknemers
      werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel16
  - number: '16.2'
    text: |-
      Indien er 5000 of meer werknemers zijn, bestaat de Europese ondernemingsraad uit een lid voor elke lid-staat waar
      de werknemers werkzaam zijn en één, drie, zes, onderscheidenlijk negen aanvullende leden voor elke lid-staat waar
      tenminste een tiende, een kwart, de helft, onderscheidenlijk driekwart van die werknemers werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel16
  - number: '16.3'
    text: Elk lid wordt gekozen of aangewezen overeenkomstig het recht van de lid-staat waar hij werkzaam is.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel16
  - number: '16.4'
    text: |-
      De zetelverdeling wordt in overeenstemming gehouden met het eerste en tweede lid; indien dat er toe leidt dat het
      aantal aanvullende leden voor een lid-staat wijzigt zonder dat met betrekking tot de bezetting van die zetels een
      nieuwe verkiezing of aanwijzing heeft plaatsgevonden, hebben de voor die lid-staat zitting hebbende leden, voor
      de toepassing van de relevante bepalingen inzake de stemverhoudingen binnen de Europese ondernemingsraad, samen
      zoveel stemmen als overeenkomt met het aantal zetels dat voor die lid-staat krachtens het eerste en tweede lid
      is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel16
  - number: '17.1'
    text: |-
      Met betrekking tot de Nederlandse vestigingen en ondernemingen worden de leden van de Europese ondernemingsraad
      aangewezen of verkozen, dan wel wordt hun aanwijzing ingetrokken, overeenkomstig [artikel 10][ref1], met dien
      verstande dat die leden zitting hebben voor de duur van vier jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel10
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '17.2'
    text: |-
      Alleen werknemers van de communautaire onderneming of groep kunnen als lid worden aangewezen of verkozen. Het
      lidmaatschap eindigt van rechtswege wanneer het lid ophoudt werknemer te zijn. Personen die behoren tot het varend
      personeel in de koopvaardij, kunnen niet als lid worden aangewezen of verkozen.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel17
  - number: '18.1'
    text: |-
      De Europese ondernemingsraad kiest uit zijn midden een voorzitter en een of meer plaatsvervangende voorzitters.
      De voorzitter, of bij diens verhindering de plaatsvervangende voorzitter, vertegenwoordigt de Europese
      ondernemingsraad in rechte.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel18
  - number: '18.2'
    text: De Europese ondernemingsraad kan uit zijn midden een beperkt comité bestaande uit ten hoogste drie leden kiezen.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel18
  - number: '18.3'
    text: |-
      De Europese ondernemingsraad stelt een reglement van orde vast. Alvorens het reglement wordt vastgesteld wordt het
      hoofdbestuur in de gelegenheid gesteld zijn standpunt kenbaar te maken. Indien een beperkt comité is gekozen regelt
      het reglement de bevoegdheden daarvan.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel18
  - number: '19.1'
    text: |-
      De bevoegdheid van de Europese ondernemingsraad is beperkt tot informatieverschaffing en raadpleging over de
      vraagstukken die van belang zijn voor de hele onderneming met een communautaire dimensie of de hele groep met
      een communautaire dimensie, of voor ten minste twee vestigingen of ondernemingen van de groep in verschillende
      lid-staten. Die bevoegdheid is beperkt tot de aangelegenheden die van belang zijn voor alle vestigingen of alle
      ondernemingen van het concern in de lid-staten dan wel voor ten minste twee van de vestigingen of ondernemingen van
      het concern in verschillende lid-staten.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel19
  - number: '19.2'
    text: |-
      Het hoofdbestuur en de Europese ondernemingsraad komen ten minste één maal per kalenderjaar in vergadering
      bijeen. In de vergadering wordt de Europese ondernemingsraad aan de hand van een door het hoofdbestuur opgesteld
      schriftelijk rapport geïnformeerd en geraadpleegd over de ontwikkeling van de werkzaamheden en de vooruitzichten
      van de communautaire onderneming of groep. De informatie en raadpleging betreft in het bijzonder de structuur van
      de communautaire onderneming of groep, de financieel-economische positie, de vermoedelijke ontwikkeling van de
      activiteiten, produktie en afzet, de investeringen, wezenlijke veranderingen in de organisatie, de invoering van
      een nieuwe arbeids- of produktiewijze, de zorg voor het milieu, fusie, verplaatsing, inkrimping of sluiting van
      ondernemingen, vestigingen of belangrijke onderdelen daarvan, de stand en de ontwikkeling van de werkgelegenheid en
      collectief ontslag.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel19
  - number: '19.3'
    text: |-
      Het hoofdbestuur licht zo spoedig mogelijk de Europese ondernemingsraad of het beperkte comité in over alle
      bijzondere omstandigheden en voorgenomen besluiten die aanzienlijke gevolgen hebben voor de belangen van
      de werknemers van tenminste twee vestigingen of ondernemingen van de communautaire onderneming of groep in
      verschillende lid-staten, in het bijzonder betreffende verplaatsing of sluiting van vestigingen of collectief
      ontslag.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel19
  - number: '19.4'
    text: |-
      Indien de Europese ondernemingsraad of het beperkte comité dat verzoekt, komt deze met het hoofdbestuur of een
      ander geschikter bestuursniveau binnen de communautaire onderneming of groep met een eigen beslissingsbevoegdheid
      inzake de te behandelen onderwerpen in vergadering bijeen, om aan de hand van een door de communautaire
      onderneming of groep opgesteld schriftelijk rapport over de in het derde lid genoemde omstandigheden nader te
      worden geïnformeerd en geraadpleegd. Deze vergadering vindt plaats op een zodanig tijdstip dat die informatie en
      raadpleging nog zinvol is. Over het rapport kan na afloop van de vergadering of binnen een redelijke termijn na
      de vergadering een advies door de Europese ondernemingsraad of het beperkte comité worden uitgebracht. Voor een
      vergadering met het beperkte comité worden mede uitgenodigd de leden van de Europese ondernemingsraad die mede
      gekozen zijn door de werknemers van de vestigingen of ondernemingen die door de maatregelen rechtstreeks worden
      geraakt. De vergadering doet geen afbreuk aan de bevoegdheden van het hoofdbestuur.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel19
  - number: '19.5'
    text: |-
      Het hoofdbestuur behoeft geen informatie te verstrekken, voor zover dat in redelijkheid het functioneren van de
      communautaire onderneming of groep ernstig zou belemmeren dan wel schaden. Het hoofdbestuur kan terzake van de
      informatieverstrekking geheimhouding opleggen, indien daarvoor een redelijke grond bestaat; zoveel mogelijk vóór
      de behandeling van de betrokken aangelegenheid wordt meegedeeld, welke grond bestaat voor het opleggen van de
      geheimhouding, welke schriftelijk of mondeling verstrekte gegevens onder de geheimhouding vallen, hoelang deze
      dient te duren, alsmede of er personen zijn ten aanzien van wie de geheimhouding niet in acht behoeft te worden
      genomen.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel19
  - number: '19.6'
    text: |-
      De Europese ondernemingsraad of het beperkte comité is gerechtigd om voor elke vergadering met het hoofdbestuur
      te vergaderen zonder dat laatstbedoelde daarbij aanwezig is. De vierde volzin van het vierde lid is van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel19
  - number: '19.7'
    text: |-
      Onverminderd enige op hen rustende verplichting tot geheimhouding informeren de leden van de Europese
      ondernemingsraad de werknemersvertegenwoordigers binnen de communautaire onderneming of groep, of, bij afwezigheid
      van werknemersvertegenwoordigers, alle werknemers over de inhoud en de resultaten van de informatie- en
      raadplegingsprocedure die overeenkomstig deze paragraaf heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel19
  - number: '19.8'
    text: |-
      Het voorzitterschap van een bijeenkomst als bedoeld in het tweede of vierde lid wordt, tenzij anders wordt
      afgesproken, afwisselend bekleed door het hoofdbestuur en de Europese ondernemingsraad.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel19
  - number: '20.1'
    text: |-
      De Europese ondernemingsraad en het beperkt comité kunnen zich doen bijstaan door deskundigen van hun keuze voor
      zover dit voor het verrichten van hun taken noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel20
  - number: '20.2'
    text: |-
      De kosten die redelijkerwijze noodzakelijk zijn voor de vervulling van de taak van de Europese ondernemingsraad
      en het beperkt comité komen ten laste van de communautaire onderneming of de moederonderneming. De verplichting
      tot het dragen van de kosten van door de Europese ondernemingsraad ingeschakelde deskundigen beperkt zich tot
      één deskundige per agendaonderwerp, tenzij de Europese ondernemingsraad en de communautaire onderneming of de
      moederonderneming anders overeenkomen.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel20
  - number: '20.3'
    text: |-
      De eerste volzin van het tweede lid is eveneens van toepassing op het voeren van rechtsgedingen, echter onder de
      voorwaarde dat de communautaire onderneming of de moederonderneming vooraf van de te maken kosten in kennis is
      gesteld.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel20
  - number: '21.1'
    text: |-
      Uiterlijk vier jaar na zijn instelling besluit de Europese ondernemingsraad, al dan niet op voorstel van het
      hoofdbestuur, of het wenselijk is met het hoofdbestuur in onderhandeling te treden over het sluiten van een
      overeenkomst als bedoeld in [artikel 11, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel11
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '21.2'
    text: |-
      De [artikelen 11, derde tot en met zesde lid][ref1], en [13, eerste en derde lid][ref2], zijn van overeenkomstige
      toepassing, met dien verstande dat de Europese ondernemingsraad hierbij in de plaats treedt van de bijzondere
      onderhandelingsgroep.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0008508#Artikel13
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008508
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '22'
    text: |-
      Het hoofdbestuur draagt er zorg voor dat binnen de communautaire onderneming of groep de samenstelling van de
      Europese ondernemingsraad alsmede het tijdstip waarop een vergadering als bedoeld in [artikel 19][ref1] zal worden
      gehouden, wordt bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel19
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '23'
    text: |-
      Indien ter uitvoering van de richtlijn in een andere lid-staat dan Nederland bij een communautaire onderneming of
      groep een bijzondere onderhandelingsgroep dan wel een Europese ondernemingsraad als bedoeld in de bijlage bij de
      richtlijn wordt ingesteld, zijn op de Nederlandse vestigingen of ondernemingen van die communautaire onderneming of
      groep de [artikelen 10][ref1] en [17][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0008508#Artikel17
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008508
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '24.1'
    text: |-
      Deze wet is, behoudens [artikel 5][ref1], niet van toepassing ten aanzien van een communautaire onderneming
      of groep die op het tijdstip van inwerkingtreding van deze wet partij is bij een of meer in werking getreden
      overeenkomsten, die voorzien in een regeling terzake van informatieverstrekking aan en raadpleging van de
      werknemers over grensoverschrijdende aangelegenheden, en gesloten zijn met een werknemersvertegenwoordiging die de
      communautaire onderneming of groep redelijkerwijs representatief mocht achten voor de werknemers uit de betrokken
      lid-staten.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel5
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '5'
        hoofdstuk: '1'
  - number: '24.2'
    text: |-
      Indien deze overeenkomsten niet inhouden of binnen vijf jaar na inwerkingtreding van deze wet gaan inhouden, dat
      werknemers of hun vertegenwoordigers van ondernemingen of vestigingen, die na het sluiten van de overeenkomsten tot
      de communautaire onderneming of groep zijn gaan behoren, binnen die termijn worden betrokken bij de vernieuwing of
      aanpassing daarvan dan wel worden vertegenwoordigd in de afgesproken procedure van informatie en raadpleging, wordt
      deze wet na die termijn op de betrokken communautaire onderneming of groep van toepassing.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel24
  - number: '24.3'
    text: |-
      [Artikel 11, achtste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel11
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '24.4'
    text: |-
      Dit artikel is van overeenkomstige toepassing op een communautaire onderneming of groep, die met ingang van 15
      december 1999 onder de werking van deze wet zou komen te vallen uitsluitend als gevolg van het gaan gelden van
      de richtlijn voor het Verenigd Koninkrijk, maar die op die datum partij is bij een of meer in werking getreden
      overeenkomsten als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel24
  - number: '25.1'
    text: |-
      Voor de toepassing van [artikel 9][ref1] behoeft slechts rekening te worden gehouden met die lid-staten, waar de
      communautaire onderneming of groep werknemers heeft en waarvan de wetgeving ter uitvoering van de richtlijn in
      werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel9
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '25.2'
    text: |-
      Indien een overeenkomst als bedoeld in [artikel 11][ref1] niet een bepaling bevat, dat werknemers of hun
      vertegenwoordigers van ondernemingen of vestigingen van de communautaire onderneming of groep in lid-staten,
      waarmee overeenkomstig het eerste lid geen rekening is gehouden bij de samenstelling van de bijzondere
      onderhandelingsgroep, binnen twee jaar na de inwerkingtreding van de wetgeving van die lid-staat ter uitvoering
      van de richtlijn worden betrokken bij de vernieuwing of aanpassing van die overeenkomst dan wel binnen die termijn
      worden vertegenwoordigd in de Europese ondernemingsraad of bij de andere procedure van inlichting en raadpleging,
      wordt die overeenkomst herzien met inachtneming van [artikel 9][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0008508#Artikel9
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008508
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '27'
    text: |-
      Deze wet treedt in werking met ingang van 22 september 1996. Indien het *Staatsblad* waarin deze wet wordt
      geplaatst wordt uitgegeven na 21 september 1996, treedt zij in werking met ingang van de dag na de datum van
      uitgifte van het *Staatsblad* waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel27
  - number: '28'
    text: 'Deze wet wordt aangehaald als: Wet op de Europese ondernemingsraden.'
    url: https://wetten.overheid.nl/BWBR0008508/2005-04-01#Artikel28
