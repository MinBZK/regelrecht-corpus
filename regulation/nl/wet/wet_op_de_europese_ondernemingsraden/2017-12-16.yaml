      - id: ref2
        bwb_id: BWBR0008508
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '6.1'
    text: |-
      Dit hoofdstuk is van toepassing op een communautaire onderneming en een moederonderneming met woonplaats of zetel
      in Nederland.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel6
  - number: '6.2'
    text: |-
      Ingeval een communautaire onderneming of moederonderneming haar woonplaats of zetel buiten de betrokken staten
      heeft, is dit hoofdstuk van toepassing, indien de in [artikel 1, tweede en derde lid][ref1], bedoelde vestiging
      onderscheidenlijk groepsonderneming woonplaats of zetel heeft in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel1
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '1'
        hoofdstuk: '1'
  - number: '7.1'
    text: |-
      Een communautaire onderneming of de moederonderneming verstrekt aan werknemers of hun vertegenwoordigers gegevens
      die benodigd zijn voor de opening van onderhandelingen als bedoeld in [artikel 8, eerste lid][ref1]. Deze gegevens
      bevatten in ieder geval een overzicht van het aantal werknemers dat bij de communautaire onderneming of groep
      werkzaam is en de verdeling van deze werknemers over de verschillende betrokken staten.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel8
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '7.2'
    text: |-
      Indien na de instelling van de bijzondere onderhandelingsgroep belangrijke wijzigingen optreden in de gegevens,
      bedoeld in het eerste lid, verstrekt een communautaire onderneming of moederonderneming zo spoedig mogelijk na deze
      wijziging een gewijzigd overzicht aan de bijzondere onderhandelingsgroep en, indien die situatie zich voordoet, aan
      de werknemers of hun vertegenwoordigers van een communautaire onderneming of groep uit een betrokken staat die nog
      niet in de bijzondere onderhandelingsgroep zijn vertegenwoordigd.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel7
  - number: '8.1'
    text: |-
      Het hoofdbestuur kan een bijzondere onderhandelingsgroep oprichten teneinde daarmee in onderhandeling te
      treden over een overeenkomst tot instelling van een Europese ondernemingsraad, al dan niet overeenkomstig
      [paragraaf 3][ref1], of tot een regeling waarbij op een andere wijze wordt voorzien in het verstrekken
      van inlichtingen aan en het raadplegen van werknemers of hun vertegenwoordigers over grensoverschrijdende
      aangelegenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008508
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '8.2'
    text: |-
      Het hoofdbestuur is verplicht tot instelling van een bijzondere onderhandelingsgroep als bedoeld in het eerste
      lid, indien van ten minste 100 werknemers of hun vertegenwoordigers afkomstig uit tenminste twee ondernemingen
      of vestigingen in ten minste twee verschillende betrokken staten een schriftelijk verzoek daartoe is ontvangen.
      Indien een verzoek daartoe is ontvangen door een tot de communautaire onderneming of groep behorende vestiging of
      onderneming, draagt het hoofdbestuur er zorg voor dat het verzoek onverwijld naar hem wordt doorgezonden en dat van
      de doorzending mededeling wordt gedaan aan de verzoekers.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel8
  - number: '8.3'
    text: |-
      De in het tweede lid bedoelde verplichting geldt, indien de bijzondere onderhandelingsgroep een besluit heeft
      genomen als bedoeld in [artikel 11, tweede lid][ref1], niet gedurende twee jaar na het nemen van dat besluit,
      tenzij het hoofdbestuur en de bijzondere onderhandelingsgroep anders zijn overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel11
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '9.1'
    text: |-
      De bijzondere onderhandelingsgroep bestaat uit een zodanig aantal vertegenwoordigers van de werknemers van de
      communautaire onderneming of groep dat is gewaarborgd dat per betrokken staat een lid wordt gekozen of aangewezen
      voor elke 10%, of een deel daarvan, van de werknemers die in de betrokken staat werkzaam zijn, berekend over het
      totale aantal werknemers dat bij de communautaire onderneming of groep in alle betrokken staten tezamen werkzaam
      is.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel9
  - number: '9.2'
    text: Elk lid wordt gekozen of aangewezen overeenkomstig het recht van de betrokken staat waarin hij werkzaam is.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel9
  - number: '9.3'
    text: |-
      Het aantal leden van de bijzondere onderhandelingsgroep en de zetelverdeling wordt in overeenstemming gehouden met
      het eerste lid. Indien het aantal leden uit een betrokken staat wijzigt zonder dat met betrekking tot die zetels
      een nieuwe verkiezing of aanwijzing heeft plaatsgevonden, hebben de voor die betrokken staat zitting hebbende
      leden voor de toepassing van [artikel 13][ref1] samen zoveel stemmen als overeenkomt met het aantal leden dat voor
      die betrokken staat krachtens het eerste lid is vastgesteld en vertegenwoordigen zij samen de in die betrokken
      staat werkzame werknemers van de communautaire onderneming of groep in een door hen te bepalen verhouding,
      dan wel, indien daarover geen overeenstemming wordt bereikt, naar verhouding van het aantal werknemers dat zij
      vertegenwoordigden voor de wijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel13
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '10.1'
    text: |-
      Met betrekking tot de Nederlandse vestigingen en ondernemingen worden de leden van de bijzondere
      onderhandelingsgroep aangewezen, dan wel wordt hun aanwijzing ingetrokken, door de bij die vestigingen of
      ondernemingen ingestelde ondernemingsraden.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel10
  - number: '10.2'
    text: |-
      Indien met betrekking tot ondernemingsraden als bedoeld in het eerste lid een of meer centrale ondernemingsraden
      zijn ingesteld, geschiedt de aanwijzing of intrekking door die raad of raden.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel10
  - number: '10.3'
    text: |-
      Indien geen centrale ondernemingsraad is ingesteld, maar wel een of meer groepsondernemingsraden, geschiedt de
      aanwijzing of intrekking door die raad of raden.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel10
  - number: '10.4'
    text: |-
      Indien niet alle ondernemingsraden of groepsondernemingsraden zijn vertegenwoordigd in een centrale
      ondernemingsraad of groepsondernemingsraad, geschiedt de aanwijzing of intrekking door de centrale
      onderscheidenlijk groepsondernemingsraad of raden en de niet-vertegenwoordigde ondernemingsraden gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel10
  - number: '10.5'
    text: |-
      Indien er geen enkele ondernemingsraad is ingesteld, worden de leden van de bijzondere onderhandelingsgroep gekozen
      door de gezamenlijke in Nederland werkzame werknemers van de communautaire onderneming of groep. De verkiezing
      geschiedt bij geheime schriftelijke stemming, waarbij elke werknemer één stem heeft. Ten behoeve van de verkiezing
      is een vereniging van werknemers, die bedoelde werknemers onder haar leden telt, krachtens haar statuten ten doel
      heeft de belangen van haar leden als werknemers te behartigen en als zodanig binnen de betrokken onderneming of
      groep werkzaam is en voorts in het bezit is van volledige rechtsbevoegdheid, bevoegd een kandidatenlijst in te
      dienen, mits zij met haar leden binnen de onderneming of groep over de samenstelling van de kandidatenlijst overleg
      heeft gepleegd.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel10
  - number: '10.6'
    text: |-
      Bij de toepassing van het eerste tot en met vierde lid worden werknemers van Nederlandse vestigingen
      of ondernemingen die niet in een ondernemingsraad, groepsondernemingsraad of centrale ondernemingsraad
      vertegenwoordigd zijn in de gelegenheid gesteld zich over de als lid van de bijzondere onderhandelingsgroep aan te
      wijzen personen uit te spreken.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel10
  - number: '11.1'
    text: |-
      Na de oprichting van de bijzondere onderhandelingsgroep belegt het hoofdbestuur met deze een vergadering teneinde
      te onderhandelen over een overeenkomst als bedoeld in [artikel 8, eerste lid][ref1]. Het stelt de groep in de
      gelegenheid om bijeen te komen voor en na deze vergadering.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel8
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '11.2'
    text: |-
      Zolang een overeenkomst als bedoeld in [artikel 8, eerste lid][ref1], niet tot stand is gekomen, kan de bijzondere
      onderhandelingsgroep besluiten om geen onderhandelingen aan te gaan, dan wel reeds lopende onderhandelingen af
      te breken.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel8
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '11.3'
    text: |-
      Indien het hoofdbestuur en de bijzondere onderhandelingsgroep overeenkomen een Europese ondernemingsraad in te
      stellen, dan wordt bij overeenkomst tevens het reglement van de raad vastgesteld. Tenzij het hoofdbestuur en de
      bijzondere onderhandelingsgroep anders overeenkomen, regelt het reglement tenminste de volgende aangelegenheden:
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel11
  - number: 11.3.a
    text: |-
      voor welke vestigingen of ondernemingen van de communautaire onderneming of groep de Europese ondernemingsraad
      is ingesteld;
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel11
  - number: 11.3.b
    text: |-
      de omvang en samenstelling van de raad, waarbij werknemers zoveel mogelijk evenwichtig vertegenwoordigd worden, en
      de zittingsduur van zijn leden;
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel11
  - number: 11.3.c
    text: het werkterrein en de bevoegdheden van de raad;
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel11
  - number: 11.3.d
    text: de wijze waarop de raad wordt ingelicht en geraadpleegd;
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel11
  - number: 11.3.e
    text: |-
      de wijze waarop de informatieverstrekking en raadpleging van de raad en de informatieverstrekking en raadpleging
      van de vertegenwoordigers van werknemers, bedoeld in [artikel 3, tweede lid][ref1], aan elkaar worden gekoppeld,
      rekening houdend met hun bevoegdheden;


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel3
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '3'
        hoofdstuk: '1'
  - number: 11.3.f
    text: de frequentie, duur en plaats van de vergaderingen van de raad;
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel11
  - number: 11.3.g
    text: de financiële en materiële middelen waarover de raad kan beschikken;
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel11
  - number: 11.3.h
    text: |-
      indien binnen de raad een beperkt comité wordt ingesteld: de samenstelling, de aanwijzingsprocedure, de
      taakomschrijving en het reglement daarvan.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel11
  - number: '11.4'
    text: |-
      Indien het hoofdbestuur en de bijzondere onderhandelingsgroep een andere procedure van informatieverstrekking
      en raadpleging van werknemers of hun vertegenwoordigers dan de instelling van een Europese ondernemingsraad
      overeenkomen, wordt bij overeenkomst tevens vastgelegd op welke wijze dit zal gebeuren. Daarbij wordt tenminste
      voorzien in het navolgende:
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel11
  - number: 11.4.a
    text: voor welke vestigingen of ondernemingen van de communautaire onderneming of groep de procedure geldt;
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel11
  - number: 11.4.b
    text: |-
      hoe de werknemers of hun vertegenwoordigers worden ingelicht en geraadpleegd over grensoverschrijdende
      aangelegenheden die belangrijke gevolgen voor de werknemers hebben;
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel11
  - number: 11.4.c
    text: |-
      de wijze waarop de werknemers of hun vertegenwoordigers over de in [onderdeel ][ref1] bedoelde aangelegenheden
      kunnen vergaderen;


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel11
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 11.4.d
    text: de financiële en materiële middelen die voor de uitvoering van de procedure ter beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel11
  - number: '11.5'
    text: |-
      Het hoofdbestuur en de bijzondere onderhandelingsgroep kunnen overeenkomen dat voor delen van de communautaire
      onderneming of groep afzonderlijke Europese ondernemingsraden zullen worden ingesteld, dan wel afzonderlijke
      procedures zullen gelden. Eveneens kunnen zij overeenkomen dat voor een of meer delen van de communautaire
      onderneming of groep een of meer Europese ondernemingsraden worden ingesteld en voor andere delen een of meer
      procedures zullen gelden.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel11
  - number: '11.6'
    text: |-
      De overeenkomst tussen het hoofdbestuur en de bijzondere onderhandelingsgroep houdt bepalingen in omtrent de
      datum van inwerkingtreding, de duur van de overeenkomst, de wijze waarop de overeenkomst kan worden gewijzigd of
      opgezegd, de gevallen waarin en wijze waarop wordt onderhandeld over een nieuwe overeenkomst en de wijze waarop
      de overeenkomst wordt aangepast aan wijzigingen in de structuur of grootte van de communautaire onderneming of
      groep en in de aantallen werknemers die in de betrokken staten werkzaam zijn. Indien deze bepalingen niet inhouden,
      dat werknemers of hun vertegenwoordigers van ondernemingen of vestigingen, die na het sluiten van de overeenkomst
      tot de communautaire onderneming of groep zijn gaan behoren, binnen twee jaar worden betrokken bij de vernieuwing
      of aanpassing daarvan dan wel niet binnen twee jaar worden vertegenwoordigd in de Europese ondernemingsraad of
      bij de andere procedure van informatieverstrekking en raadpleging, is het hoofdbestuur verplicht om een nieuw
      samengestelde bijzondere onderhandelingsgroep in te stellen indien tenminste 100 zodanige werknemers of hun
      vertegenwoordigers daarom verzoeken.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel11
  - number: '11.7'
    text: |-
      Het hoofdbestuur behoeft geen informatie te verstrekken, voor zover dat in redelijkheid het functioneren van de
      communautaire onderneming of de groep ernstig zou belemmeren dan wel schaden. Het hoofdbestuur kan terzake van
      de informatieverstrekking geheimhouding opleggen, indien daarvoor een redelijke grond bestaat; zoveel mogelijk
      vóór de behandeling van de betrokken aangelegenheid wordt meegedeeld, welke grond bestaat voor het opleggen van
      de geheimhouding, welke schriftelijk of mondeling verstrekte gegevens onder de geheimhouding vallen, hoelang deze
      dient te duren, alsmede of er personen zijn ten aanzien van wie de geheimhouding niet in acht behoeft te worden
      genomen.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel11
  - number: '11.8'
    text: |-
      Indien de overeenkomst geen regels bevat als bedoeld in het derde lid, onderdeel e, vangt, in het geval
      er beslissingen worden overwogen, die waarschijnlijk belangrijke wijzigingen in de arbeidsorganisatie
      of de arbeidsovereenkomsten met zich brengen, de informatieverstrekking en raadpleging van de raad
      en de informatieverstrekking en raadpleging van de vertegenwoordigers van werknemers, bedoeld in
      [artikel 3, tweede lid][ref1], zoveel mogelijk gelijktijdig aan.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel3
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '3'
        hoofdstuk: '1'
  - number: '11.9'
    text: Het hoofdbestuur staat in voor de naleving van rechten en verplichtingen, opgenomen in de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel11
  - number: '12.1'
    text: |-
      De bijzondere onderhandelingsgroep kan zich in de onderhandelingen doen bijstaan door een of meer deskundigen van
      haar keuze, waaronder vertegenwoordigers van bevoegde en erkende werknemersorganisaties op communautair niveau
      als bedoeld in artikel 154 van het Verdrag betreffende de werking van de Europese Unie. Deze deskundigen kunnen
      op verzoek van de bijzondere onderhandelingsgroep als adviseur aanwezig zijn in de vergaderingen, bedoeld in
      [artikel 11, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel11
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '12.2'
    text: |-
      De kosten die redelijkerwijze noodzakelijk zijn voor de vervulling van de taak van de bijzondere
      onderhandelingsgroep komen ten laste van de communautaire onderneming of de moederonderneming. Voor de kosten
      van het raadplegen van een of meer deskundigen of van het voeren van rechtsgedingen geldt dit slechts, indien de
      communautaire onderneming of de moederonderneming vooraf van de te maken kosten in kennis is gesteld.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel12
  - number: '13.1'
    text: |-
      Ieder lid van de bijzondere onderhandelingsgroep heeft, onverminderd [artikel 9, derde lid][ref1], één stem. De
      bijzondere onderhandelingsgroep besluit bij volstrekte meerderheid van het aantal uitgebrachte stemmen.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel9
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '13.2'
    text: |-
      Een besluit als bedoeld in [artikel 11, tweede lid][ref1], behoeft een meerderheid van twee derden van het aantal
      uitgebrachte stemmen.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel11
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '13.3'
    text: |-
      Een besluit tot het aangaan van een overeenkomst als bedoeld in [artikel 11, eerste lid][ref1], behoeft tenminste
      zoveel stemmen als overeenkomt met de meerderheid van het aantal stemmen dat kan worden uitgebracht wanneer de
      bijzondere onderhandelingsgroep voltallig vergadert.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel11
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '14.1'
    text: |-
      Het hoofdbestuur draagt er zorg voor dat binnen de communautaire onderneming of groep de samenstelling van de
      bijzondere onderhandelingsgroep alsmede het tijdstip waarop een vergadering als bedoeld in [artikel 11][ref1] zal
      worden gehouden, wordt bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel11
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '14.2'
    text: |-
      Het hoofdbestuur stelt tevens de bevoegde en erkende werknemers- en werkgeversorganisaties op communautair
      niveau als bedoeld in artikel 154 van het Verdrag betreffende werking van de Europese Unie, in kennis van de
      samenstelling van de bijzondere onderhandelingsgroep, alsmede van het begin van de onderhandelingen, bedoeld in
      [artikel 8, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel8
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 14a.1
    text: |-
      Indien de structuur van de communautaire onderneming of groep, ingrijpend wordt gewijzigd en in de toepasselijke
      overeenkomsten daarover geen of strijdige bepalingen zijn opgenomen start het hoofdbestuur op eigen initiatief
      of op schriftelijk verzoek van ten minste 100 werknemers of hun vertegenwoordigers afkomstig uit ten minste twee
      ondernemingen of vestigingen in ten minste twee verschillende betrokken staten de in [artikel 8, eerste lid][ref1],
      bedoelde onderhandelingen en richt daartoe een bijzondere onderhandelingsgroep op.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel8
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 14a.2
    text: |-
      Behalve de overeenkomstig [artikel 9][ref1] gekozen of aangewezen leden van de bijzondere onderhandelingsgroep,
      zijn ten minste drie leden van de bestaande Europese ondernemingsraad of van elk van de bestaande Europese
      ondernemingsraden lid van de bijzondere onderhandelingsgroep.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel9
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 14a.3
    text: |-
      Tijdens de onderhandelingen, bedoeld in het eerste lid, blijven de bestaande Europese ondernemingsraad of -raden
      functioneren in overeenstemming met de toepasselijke overeenkomst of overeenkomsten, danwel blijft een andere
      procedure van informatieverstrekking en raadpleging van werknemers van toepassing, indien die is overeengekomen.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel14a
  - number: '15'
    text: 'Het hoofdbestuur is verplicht overeenkomstig deze paragraaf een Europese ondernemingsraad in te stellen indien:'
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel15
  - number: 15.a
    text: |-
      het hoofdbestuur er blijk van heeft gegeven niet binnen zes maanden na de ontvangst van een verzoek als bedoeld in
      [artikel 8, tweede lid][ref1], te zullen onderhandelen met een bijzondere onderhandelingsgroep;


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel8
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 15.b
    text: |-
      het hoofdbestuur en de bijzondere onderhandelingsgroep geen overeenkomst als bedoeld in
      [artikel 8, eerste lid][ref1] hebben gesloten binnen drie jaar na de ontvangst van een verzoek als bedoeld
      in artikel 8, tweede lid, dan wel, indien het hoofdbestuur de bijzondere onderhandelingsgroep eigener
      beweging heeft ingesteld, binnen drie jaar na de datum van de instelling, tenzij een besluit als bedoeld in
      [artikel 11, tweede lid][ref2], van kracht is.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0008508#Artikel11
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008508
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '16.1'
    text: |-
      De Europese ondernemingsraad bestaat uit een zodanig aantal vertegenwoordigers van de werknemers van de
      communautaire onderneming of groep dat is gewaarborgd dat per betrokken staat een lid wordt gekozen of aangewezen
      voor elke 10%, of een deel daarvan, van de werknemers die in de betrokken staat werkzaam zijn, berekend over het
      totale aantal werknemers dat bij de communautaire onderneming of groep in alle betrokken staten tezamen werkzaam
      is.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel16
  - number: '16.2'
    text: Elk lid wordt gekozen of aangewezen overeenkomstig het recht van de betrokken staat waar hij werkzaam is.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel16
  - number: '16.3'
    text: |-
      Het aantal leden van Europese ondernemingsraad en de zetelverdeling wordt in overeenstemming gehouden met het
      eerste lid. Indien het aantal leden uit een betrokken staat wijzigt zonder dat met betrekking tot die zetels een
      nieuwe verkiezing of aanwijzing heeft plaatsgevonden, hebben de voor die betrokken staat zitting hebbende leden
      voor de toepassing van de relevante bepalingen inzake de stemverhoudingen binnen de Europese ondernemingsraad
      samen zoveel stemmen als overeenkomt met het aantal leden dat voor die betrokken staat krachtens het eerste lid
      is vastgesteld en vertegenwoordigen zij samen de in die betrokken staat werkzame werknemers van de communautaire
      onderneming of groep in een door hen te bepalen verhouding, dan wel, indien daarover geen overeenstemming wordt
      bereikt, naar verhouding van het aantal werknemers dat zij vertegenwoordigden voor de wijziging.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel16
  - number: '17.1'
    text: |-
      Met betrekking tot de Nederlandse vestigingen en ondernemingen worden de leden van de Europese ondernemingsraad
      aangewezen of verkozen, dan wel wordt hun aanwijzing ingetrokken, overeenkomstig [artikel 10][ref1], met dien
      verstande dat die leden zitting hebben voor de duur van vier jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel10
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '17.2'
    text: |-
      Alleen werknemers van de communautaire onderneming of groep kunnen als lid worden aangewezen of verkozen. Het
      lidmaatschap eindigt van rechtswege wanneer het lid ophoudt werknemer te zijn.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel17
  - number: '17.3'
    text: |-
      Een lid van een bijzondere onderhandelingsgroep of van de Europese ondernemingsraad of diens plaatsvervanger,
      die lid is van de bemanning van een zeeschip, heeft het recht deel te nemen aan een vergadering van de bijzondere
      onderhandelingsgroep of van de Europese Ondernemingsraad of aan elke andere raadpleging die wordt georganiseerd,
      indien dat lid of die plaatsvervanger ten tijde van de vergadering niet op zee is of zich bevindt in een haven
      in een ander land dan waar de rederij is gevestigd. Voor zover mogelijk wordt een vergadering zo gepland dat het
      lid of diens plaatsvervanger op eenvoudige wijze aan de vergadering kan deelnemen. Voor zover het lid of diens
      plaatsvervanger verhinderd is een vergadering bij te wonen, wordt geprobeerd de inbreng van het lid of diens
      plaatsvervanger langs andere weg te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel17
  - number: '18.1'
    text: |-
      De Europese ondernemingsraad kiest uit zijn midden een voorzitter en een of meer plaatsvervangende voorzitters.
      De voorzitter, of bij diens verhindering de plaatsvervangende voorzitter, vertegenwoordigt de Europese
      ondernemingsraad in rechte.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel18
  - number: '18.2'
    text: De Europese ondernemingsraad kan uit zijn midden een beperkt comité bestaande uit ten hoogste vijf leden kiezen.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel18
  - number: '18.3'
    text: |-
      De Europese ondernemingsraad stelt een reglement van orde vast. Alvorens het reglement wordt vastgesteld wordt
      het hoofdbestuur in de gelegenheid gesteld zijn standpunt kenbaar te maken. Indien een beperkt comité is gekozen,
      worden in het reglement de bevoegdheden van dat comité vastgesteld, alsmede de voorzieningen die noodzakelijk zijn
      om zijn werkzaamheden te kunnen uitvoeren.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel18
  - number: '19.1'
    text: 'De informatieverstrekking aan de Europese ondernemingsraad betreft in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel19
  - number: 19.1.a
    text: |-
      de structuur, de economische en financiële situatie, de vermoedelijke ontwikkeling van de activiteiten, de
      productie en de afzet van de communautaire onderneming of groep;
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel19
  - number: 19.1.b
    text: |-
      de stand en de vermoedelijke ontwikkeling van de werkgelegenheid, de investeringen, wezenlijke veranderingen in
      de organisatie, de invoering van nieuwe werkmethoden of productieprocessen, de zorg voor het milieu, fusie, of
      inkrimping van ondernemingen, vestigingen of belangrijke onderdelen daarvan.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel19
  - number: '19.2'
    text: |-
      Het hoofdbestuur informeert zo spoedig mogelijk de Europese ondernemingsraad of het beperkte comité over alle
      bijzondere omstandigheden en voorgenomen besluiten die aanzienlijke gevolgen hebben voor de belangen van de
      werknemers, in het bijzonder betreffende verplaatsing of sluiting van ondernemingen, vestigingen of belangrijke
      onderdelen daarvan of collectief ontslag.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel19
  - number: '19.3'
    text: |-
      De raadpleging van de Europese ondernemingsraad verloopt op zodanige wijze dat deze met het hoofdbestuur of een
      ander passender bestuursniveau binnen de communautaire onderneming of groep met een eigen beslissingsbevoegdheid
      inzake de te behandelen onderwerpen bijeen kan komen en een met redenen omkleed antwoord op zijn adviezen kan
      krijgen. Raadpleging betreft in ieder geval de onderwerpen, bedoeld in het eerste lid, onderdeel b, en het tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel19
  - number: '19.4'
    text: |-
      Het hoofdbestuur en de Europese ondernemingsraad komen ten minste één maal per kalenderjaar in vergadering
      bijeen. In de vergadering wordt de Europese ondernemingsraad aan de hand van een door het hoofdbestuur opgesteld
      schriftelijk rapport geïnformeerd en geraadpleegd over de ontwikkeling van de activiteiten en de vooruitzichten van
      de communautaire onderneming of groep. Het hoofdbestuur draagt er zorg voor dat deze jaarlijkse vergadering binnen
      de communautaire onderneming of groep wordt bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel19
  - number: '19.5'
    text: |-
      Indien de Europese ondernemingsraad of het beperkte comité dat verzoekt, komt deze met het hoofdbestuur of een
      ander geschikter bestuursniveau binnen de communautaire onderneming of groep met een eigen beslissingsbevoegdheid
      inzake de te behandelen onderwerpen in vergadering bijeen, om aan de hand van een door de communautaire onderneming
      of groep opgesteld schriftelijk rapport over de in het tweede lid genoemde omstandigheden en voorgenomen besluiten
      nader te worden geïnformeerd en geraadpleegd. Voor een vergadering met het beperkte comité worden mede uitgenodigd
      de leden van de Europese ondernemingsraad die mede gekozen of aangewezen zijn door de werknemers van de vestigingen
      of ondernemingen die door de betreffende omstandigheden of voorgenomen besluiten rechtstreeks worden geraakt. De
      vergadering doet geen afbreuk aan de bevoegdheden van het hoofdbestuur.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel19
  - number: '19.6'
    text: |-
      Het hoofdbestuur behoeft geen informatie te verstrekken, voor zover dat in redelijkheid het functioneren van de
      communautaire onderneming of groep ernstig zou belemmeren dan wel schaden. Het hoofdbestuur kan terzake van de
      informatieverstrekking geheimhouding opleggen, indien daarvoor een redelijke grond bestaat. Zoveel mogelijk voor
      de behandeling van de betrokken aangelegenheid wordt meegedeeld, welke grond bestaat voor het opleggen van de
      geheimhouding, welke schriftelijk of mondeling verstrekte gegevens onder de geheimhouding vallen, hoelang deze
      duurt, alsmede of er personen zijn ten aanzien van wie de geheimhouding niet in acht behoeft te worden genomen.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel19
  - number: '19.7'
    text: |-
      Het hoofdbestuur stelt de Europese ondernemingsraad of het beperkt comité in de gelegenheid om bijeen te komen voor
      en na elke vergadering met het hoofdbestuur.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel19
  - number: '19.8'
    text: |-
      Het voorzitterschap van een bijeenkomst als bedoeld in het vierde of vijfde lid wordt, tenzij anders wordt
      afgesproken, afwisselend bekleed door het hoofdbestuur en de Europese ondernemingsraad.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel19
  - number: '20.1'
    text: |-
      De Europese ondernemingsraad en het beperkt comité kunnen zich doen bijstaan door deskundigen van hun keuze voor
      zover dit voor het verrichten van hun taken noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel20
  - number: '20.2'
    text: |-
      De kosten die redelijkerwijze noodzakelijk zijn voor de vervulling van de taak van de Europese ondernemingsraad
      en het beperkt comité komen ten laste van de communautaire onderneming of de moederonderneming. De verplichting
      tot het dragen van de kosten van door de Europese ondernemingsraad ingeschakelde deskundigen beperkt zich tot
      één deskundige per agendaonderwerp, tenzij de Europese ondernemingsraad en de communautaire onderneming of de
      moederonderneming anders overeenkomen.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel20
  - number: '20.3'
    text: |-
      De eerste volzin van het tweede lid is eveneens van toepassing op het voeren van rechtsgedingen, echter onder de
      voorwaarde dat de communautaire onderneming of de moederonderneming vooraf van de te maken kosten in kennis is
      gesteld.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel20
  - number: '21.1'
    text: |-
      Uiterlijk vier jaar na zijn instelling besluit de Europese ondernemingsraad, al dan niet op voorstel van het
      hoofdbestuur, of het wenselijk is met het hoofdbestuur in onderhandeling te treden over het sluiten van een
      overeenkomst als bedoeld in [artikel 8, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel8
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '21.2'
    text: |-
      De [artikelen 11, derde tot en met zesde lid][ref1], en [13, eerste en derde lid][ref2], zijn van overeenkomstige
      toepassing, met dien verstande dat de Europese ondernemingsraad hierbij in de plaats treedt van de bijzondere
      onderhandelingsgroep.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0008508#Artikel13
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008508
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '22'
    text: |-
      Het hoofdbestuur draagt er zorg voor dat binnen de communautaire onderneming of groep de samenstelling van de
      Europese ondernemingsraad alsmede het tijdstip waarop een vergadering als bedoeld in [artikel 19][ref1] zal worden
      gehouden, wordt bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel19
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '23'
    text: |-
      Indien ter uitvoering van de richtlijn in een andere betrokken staat dan Nederland bij een communautaire
      onderneming of groep een bijzondere onderhandelingsgroep dan wel een Europese ondernemingsraad als bedoeld in de
      bijlage bij de richtlijn wordt ingesteld, zijn op de Nederlandse vestigingen of ondernemingen van die communautaire
      onderneming of groep de [artikelen 10][ref1] en [17][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0008508#Artikel17
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008508
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '24.1'
    text: |-
      Deze wet is, behoudens de [artikelen 5][ref1] en [14a][ref2], niet van toepassing ten aanzien van een communautaire
      onderneming of groep die voor 5 februari 1997 partij was bij een of meer in werking getreden overeenkomsten,
      mits deze overeenkomsten voorzien in een regeling terzake van informatieverstrekking aan en raadpleging van de
      werknemers over grensoverschrijdende aangelegenheden, en die gesloten zijn met een werknemersvertegenwoordiging
      die de communautaire onderneming of groep redelijkerwijs representatief mocht achten voor de werknemers uit de
      betrokken staten.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008508#Artikel14a
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '5'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0008508
        artikel: 14a
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '24.2'
    text: |-
      Deze wet, zoals die luidde op de dag voor de inwerkingtreding van de Wet van 7 november 2011 tot wijziging van
      de Wet op de Europese ondernemingsraden in verband met de uitvoering van richtlijn 2009/38/EG van het Europees
      Parlement en de Raad van de Europese Unie van 6 mei 2009 (PbEU 2009, L 122), houdende herschikking van richtlijn
      94/45/ EG, inzake de instelling van een Europese ondernemingsraad of van een procedure in ondernemingen of
      concerns met een communautaire dimensie ter informatie en raadpleging van de werknemers blijft, behoudens de
      [artikelen 5][ref1] en [14a][ref2], van toepassing op een communautaire onderneming of groep die partij is bij een
      overeenkomst als bedoeld in [artikel 8, eerste lid][ref3], betrekking hebbend op het hele personeelsbestand, die in
      de periode van 5 juni 2009 tot 5 juni 2011 is ondertekend of herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008508#Artikel14a
      [ref3]: https://wetten.overheid.nl/BWBR0008508#Artikel8
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '5'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0008508
        artikel: 14a
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0008508
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '24.3'
    text: |-
      [Artikel 11, negende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel11
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '24.4'
    text: |-
      Dit artikel is van overeenkomstige toepassing op een communautaire onderneming of groep, die met ingang van 15
      december 1999 onder de werking van deze wet zou komen te vallen uitsluitend als gevolg van het gaan gelden van
      de richtlijn voor het Verenigd Koninkrijk, maar die op die datum partij is bij een of meer in werking getreden
      overeenkomsten als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel24
  - number: '25.1'
    text: |-
      Voor de toepassing van [artikel 9][ref1] behoeft slechts rekening te worden gehouden met die betrokken staten, waar
      de communautaire onderneming of groep werknemers heeft en waarvan de wetgeving ter uitvoering van de richtlijn in
      werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel9
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '25.2'
    text: |-
      Indien een overeenkomst als bedoeld in [artikel 8][ref1] niet een bepaling bevat, dat werknemers of hun
      vertegenwoordigers van ondernemingen of vestigingen van de communautaire onderneming of groep in betrokken
      staten, waarmee overeenkomstig het eerste lid geen rekening is gehouden bij de samenstelling van de bijzondere
      onderhandelingsgroep, binnen twee jaar na de inwerkingtreding van de wetgeving van die betrokken staat ter
      uitvoering van de richtlijn worden betrokken bij de vernieuwing of aanpassing van die overeenkomst dan wel binnen
      die termijn worden vertegenwoordigd in de Europese ondernemingsraad of bij de andere procedure van inlichting en
      raadpleging, wordt die overeenkomst herzien met inachtneming van [artikel 9][ref2].


