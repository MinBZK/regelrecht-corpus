---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_de_europese_ondernemingsraden
regulatory_layer: WET
publication_date: '2017-12-15'
valid_from: '2017-12-16'
bwb_id: BWBR0008508
url: https://wetten.overheid.nl/BWBR0008508/2017-12-16
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is uitvoering te geven aan de richtlijn nr. 94/45/EG
    van de Raad van de Europese Unie van 22 september 1994 inzake de instelling van een Europese ondernemingsraad of
    van een procedure in ondernemingen of concerns met een communautaire dimensie ter informatie en raadpleging van
    de werknemers;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel1
  - number: 1.1.a
    text: |-
      betrokken staat: een lid-staat van de Europese Unie of een andere staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte;
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel1
  - number: 1.1.b
    text: |-
      richtlijn: de richtlijn nr. 2009/38/EG van het Europees Parlement en de Raad van de Europese Unie van 6 mei 2009
      inzake de instelling van een Europese ondernemingsraad of van een procedure in ondernemingen of concerns met een
      communautaire dimensie ter informatie en raadpleging van de werknemers (PbEU 2009, L 122);
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel1
  - number: 1.1.c
    text: |-
      een communautaire onderneming: een onderneming, die sinds twee jaar in ten minste twee betrokken staten elk
      gemiddeld ten minste 150 werknemers en in de betrokken staten samen gemiddeld ten minste 1000 werknemers heeft,
      tenzij zij behoort tot een communautaire groep;
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel1
  - number: 1.1.d
    text: |-
      een communautaire groep: het geheel van ondernemingen bestaande uit een moederonderneming als bedoeld in
      [artikel 2][ref1] en de onderneming of ondernemingen waarover zij de zeggenschap uitoefent en waarvan:


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel2
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '2'
        hoofdstuk: '1'
  - number: 1.1.d.1°
    text: ten minste twee ondernemingen in verschillende betrokken staten zijn gevestigd en
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel1
  - number: 1.1.d.2°
    text: |-
      sinds twee jaar ten minste een onderneming gemiddeld ten minste 150 werknemers in een betrokken staat en een andere
      onderneming gemiddeld ten minste 150 werknemers in een andere betrokken staat heeft en
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel1
  - number: 1.1.d.3°
    text: alle ondernemingen tezamen sinds twee jaar gemiddeld ten minste 1000 werknemers in de betrokken staten hebben;
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel1
  - number: 1.1.e
    text: |-
      *grensoverschrijdende aangelegenheden:* aangelegenheden die voor de gehele communautaire onderneming of voor
      de gehele communautaire groep van belang zijn, of voor ten minste twee ondernemingen of vestigingen van een
      communautaire onderneming of een communautaire groep in twee verschillende betrokken staten;
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel1
  - number: 1.1.f
    text: |-
      hoofdbestuur: 'in het geval van een communautaire onderneming: het bestuur van deze onderneming; in het geval van'
      een communautaire groep: het bestuur van de moederonderneming, bedoeld in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel2
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '2'
        hoofdstuk: '1'
  - number: 1.1.g
    text: |-
      *informatieverstrekking:* het verstrekken van gegevens over grensoverschrijdende aangelegenheden door het
      hoofdbestuur of een ander passender bestuursniveau aan werknemersvertegenwoordigers, op een zodanig tijdstip, op
      een zodanige wijze en met een zodanige inhoud dat werknemersvertegenwoordigers zich een grondig oordeel kunnen
      vormen over de gevolgen en, desgewenst, raadpleging met het hoofdbestuur of een ander passender bestuursniveau
      kunnen voorbereiden;
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel1
  - number: 1.1.h
    text: |-
      *raadpleging:* het instellen van een dialoog en de uitwisseling van standpunten over voorgestelde maatregelen
      tussen het hoofdbestuur of een ander passender bestuursniveau en werknemersvertegenwoordigers, op een zodanig
      tijdstip, op een zodanige wijze en met een zodanige inhoud dat werknemersvertegenwoordigers in staat zijn op basis
      van de verstrekte informatie over voorgestelde maatregelen ten aanzien van grensoverschrijdende aangelegenheden
      waarmee de raadpleging verband houdt, binnen een redelijke termijn advies uit te brengen, waarmee rekening kan
      worden gehouden bij het nemen van het besluit.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel1
  - number: '1.2'
    text: |-
      Indien een communautaire onderneming haar woonplaats of zetel buiten de betrokken staten heeft, wordt als
      hoofdbestuur aangemerkt:
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel1
  - number: 1.2.a
    text: |-
      een daartoe door de communautaire onderneming aangewezen persoon, belast met de feitelijke leiding van een van haar
      vestigingen binnen een betrokken staat, dan wel, bij gebreke van zodanige aanwijzing:
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel1
  - number: 1.2.b
    text: |-
      degene of degenen die zijn belast met de feitelijke leiding van de vestiging die het grootste aantal werknemers
      heeft in één betrokken staat.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel1
  - number: '1.3'
    text: |-
      Indien de moederonderneming, bedoeld in [artikel 2][ref1], haar woonplaats of zetel buiten de betrokken staten
      heeft, kan zij als haar vertegenwoordiger aanwijzen het bestuur van een groepsonderneming met woonplaats of zetel
      binnen de betrokken staten. Bij gebreke van zulk een aanwijzing wordt het bestuur van de groepsonderneming met
      woonplaats of zetel binnen de betrokken staten die het grootste aantal werknemers heeft in één betrokken staat, als
      zodanig aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel2
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '2'
        hoofdstuk: '1'
  - number: '1.4'
    text: |-
      Handelen of nalaten door het hoofdbestuur, bedoeld in het eerste lid, onderdeel *e* onderscheidenlijk het derde
      lid, wordt toegerekend aan de natuurlijke persoon of rechtspersoon, die de communautaire onderneming of de
      moederonderneming onderscheidenlijk de in het derde lid bedoelde groepsonderneming in stand houdt.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel1
  - number: '2.1'
    text: |-
      In deze wet wordt onder moederonderneming verstaan: de onderneming die binnen een communautaire groep direct
      of indirect een overheersende zeggenschap kan uitoefenen op een andere onderneming en die zelf geen onderneming
      is waarover door een andere onderneming direct of indirect een overheersende zeggenschap wordt uitgeoefend. Een
      onderneming wordt, tenzij het tegendeel blijkt, vermoed moederonderneming te zijn, indien zij:
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel2
  - number: 2.1.a
    text: |-
      meer dan de helft van de leden van het bestuursorgaan of van het leidinggevend dan wel toezichthoudend orgaan van
      de andere onderneming kan benoemen, of
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel2
  - number: 2.1.b
    text: meer dan de helft van de stemrechten in de algemene vergadering van de andere onderneming kan uitoefenen of
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel2
  - number: 2.1.c
    text: de meerderheid van het geplaatste kapitaal van de andere onderneming verschaft.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel2
  - number: '2.2'
    text: |-
      Voor de toepassing van het eerste lid worden onder de rechten van de moederonderneming ten aanzien van het
      kapitaal, het stemrecht en de benoeming mede begrepen:
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel2
  - number: 2.2.a
    text: de overeenkomstige rechten van andere ondernemingen waarop zij overheersende zeggenschap uitoefent;
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel2
  - number: 2.2.b
    text: |-
      de overeenkomstige rechten van personen of organen die handelen onder eigen naam doch voor rekening van de
      moederonderneming of van een of meer van haar groepsondernemingen.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel2
  - number: '2.3'
    text: |-
      Voor de toepassing van het eerste lid worden de rechten ten aanzien van het kapitaal en het stemrecht niet
      toegerekend aan een onderneming, indien zij deze voor rekening van anderen houdt.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel2
  - number: '2.4'
    text: |-
      Voor de toepassing van het eerste lid worden stemrechten, verbonden aan verpande aandelen, toegerekend aan de
      pandhouder, indien hij mag bepalen hoe de rechten worden uitgeoefend. Zijn de aandelen evenwel verpand voor een
      lening die de pandhouder heeft verstrekt in de gewone uitoefening van zijn bedrijf, dan worden de stemrechten hem
      slechts toegerekend, indien hij deze in eigen belang heeft uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel2
  - number: '2.5'
    text: |-
      Geen moederonderneming is een onderneming als bedoeld in [artikel 3, vijfde lid, onder ][ref1] van Verordening
      (EG) 139/2004 van de Raad van 20 januari 2004 betreffende de controle op concentraties van ondernemingen (PbEG 2004
      L 24).


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel3
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '3'
        hoofdstuk: '1'
  - number: '2.6'
    text: |-
      Het recht dat op een onderneming van toepassing is, bepaalt of die onderneming een moederonderneming is als bedoeld
      in het eerste lid. Indien dat recht niet het recht van een betrokken staat is, wordt dat bepaald door het recht
      dat van toepassing is op de groepsonderneming, waarvan het bestuur de moederonderneming vertegenwoordigt krachtens
      [artikel 1, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel1
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '1'
        hoofdstuk: '1'
  - number: '2.7'
    text: Indien meer ondernemingen van een groep aan een of meer criteria van het eerste lid voldoen,
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel2
  - number: 2.7.a
    text: |-
      wordt de onderneming die voldoet aan het criterium, bedoeld in het eerste lid, onderdeel a aangemerkt als
      moederonderneming, waarbij het benoemingsrecht met betrekking tot het leidinggevend orgaan voorrang heeft;
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel2
  - number: 2.7.b
    text: |-
      heeft, indien toepassing van onderdeel a niet leidt tot aanmerking van één onderneming als moederonderneming, het
      criterium, bedoeld in het eerste lid, onderdeel b, voorrang boven dat, bedoeld in het eerste lid, onderdeel c;
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel2
  - number: '3.1'
    text: |-
      In deze wet wordt, voor zover het in Nederland werkzame personen betreft, onder werknemer verstaan: degene die
      krachtens een arbeidsovereenkomst werkzaam is in de communautaire onderneming of de communautaire groep, en voor
      zover het in de overige betrokken staten werkzame personen betreft: hetgeen het recht van die betrokken staat
      daaronder verstaat.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel3
  - number: '3.2'
    text: |-
      Voor de toepassing van de [artikelen 4, achtste tot en met tiende lid][ref1], [7][ref2], [8, tweede lid][ref3], en
      [11, derde lid, onderdeel e, zesde en achtste lid][ref4], wordt onder vertegenwoordigers van werknemers verstaan:
      hetgeen daaronder wordt verstaan krachtens het recht van de betrokken staat waarin die werknemers werkzaam zijn;
      voor Nederland zijn dat ondernemingsraden.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008508#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0008508#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0008508#Artikel11
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '4'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0008508
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0008508
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0008508
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '4.1'
    text: |-
      Ten aanzien van de in Nederland werkzame werknemers die lid zijn van een bijzondere onderhandelingsgroep of van een
      Europese ondernemingsraad dan wel optreden als vertegenwoordigers bij een andere wijze van informatieverstrekking
      en raadpleging van werknemers, gelden het tweede tot en met het zevende lid.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel4
  - number: '4.2'
    text: |-
      Deze werknemers behouden hun aanspraak op loon voor de tijd gedurende welke zij niet de bedongen arbeid hebben
      verricht ten gevolge van het bijwonen van een vergadering van de bijzondere onderhandelingsgroep of van de Europese
      ondernemingsraad, dan wel van een vergadering in het kader van de andere wijze van informatieverstrekking en
      raadpleging.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel4
  - number: '4.3'
    text: |-
      Voor zover dat redelijkerwijs noodzakelijk is voor de vervulling van hun taak, wordt hun in werktijd en met behoud
      van loon de gelegenheid geboden tot onderling beraad en overleg met andere personen over aangelegenheden waarbij
      zij in de uitoefening van hun functie zijn betrokken en om scholing en vorming te ontvangen. Aan hen worden
      voorzieningen ter beschikking gesteld, die zij in de uitoefening van hun taak redelijkerwijs nodig hebben.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel4
  - number: '4.4'
    text: |-
      Zij zijn verplicht tot geheimhouding van alle zaken- en bedrijfsgeheimen die zij in hun hoedanigheid vernemen,
      alsmede van alle aangelegenheden ten aanzien waarvan hun geheimhouding is opgelegd of waarvan zij, in verband met
      opgelegde geheimhouding, het vertrouwelijke karakter moeten begrijpen. Deze verplichting geldt ook voor personen
      die een functie als bedoeld in het eerste lid vervullen zonder werknemer te zijn.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel4
  - number: '4.5'
    text: |-
      De verplichting tot geheimhouding geldt niet tegenover hem die wordt benaderd voor overleg of als deskundige
      als bedoeld in de [artikelen 12][ref1] en [20][ref2], mits het hoofdbestuur of degene die de geheimhouding heeft
      opgelegd, vooraf daarvoor toestemming heeft gegeven en de betrokken persoon schriftelijk heeft verklaard dat hij
      zich ten aanzien van de betrokken aangelegenheid tot geheimhouding verplicht. In dat geval is ten aanzien van de
      bedoelde persoon de geheimhoudingsplicht van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0008508#Artikel20
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008508
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '4.6'
    text: |-
      De plicht tot geheimhouding vervalt niet door beëindiging van de in het eerste lid bedoelde functie, noch door
      beëindiging van de werkzaamheden van de betrokkene in de onderneming.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel4
  - number: '4.7'
    text: |-
      De werkgever draagt er zorg voor, dat degenen die kandidaat staan of gestaan hebben voor een functie als bedoeld
      in het eerste lid, alsmede degenen die deze functie vervullen of hebben vervuld, niet uit hoofde hiervan worden
      benadeeld in hun positie in de onderneming.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel4
  - number: '4.8'
    text: |-
      Onverminderd enige op hen rustende verplichting tot geheimhouding informeren de werknemers, die lid zijn
      van een Europese ondernemingsraad dan wel optreden als vertegenwoordigers bij een andere procedure van
      informatieverstrekking en raadpleging van werknemers, de werknemersvertegenwoordigers binnen de communautaire
      onderneming of groep, of, als die er niet zijn, alle werknemers over de inhoud en de resultaten van de informatie-
      en raadplegingsprocedure die overeenkomstig deze wet heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel4
  - number: '4.9'
    text: |-
      Iedere in Nederland werkzame werknemer of werknemersvertegenwoordiger kan van de werkgever verlangen
      dat deze hem gegevens verstrekt die benodigd zijn voor de opening van onderhandelingen als bedoeld in
      [artikel 8, eerste lid][ref1]. Deze gegevens bevatten in ieder geval een overzicht van het aantal werknemers dat
      bij de communautaire onderneming of groep werkzaam is en de verdeling van deze werknemers over de verschillende
      betrokken staten.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel8
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '4.10'
    text: |-
      De werkgever van een in Nederland werkzame werknemer die is aangewezen of gekozen als lid van een bijzondere
      onderhandelingsgroep of van een Europese ondernemingsraad doet van die verkiezing of aanwijzing mededeling aan
      het hoofdbestuur.
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel4
  - number: '5.1'
    text: |-
      Iedere belanghebbende kan de ondernemingskamer van het gerechtshof Amsterdam verzoeken te bepalen dat gevolg dient
      te worden gegeven aan hetgeen is bepaald bij deze wet, met uitzondering van [artikel 4][ref1], voor zo ver het
      tweede lid niet anders bepaalt, of bij een overeenkomst als bedoeld in de [artikelen 11][ref2] of [24][ref3]. Een
      bijzondere onderhandelingsgroep of de leden daarvan en een Europese ondernemingsraad, ingesteld krachtens deze wet,
      kunnen niet in de proceskosten van deze procedure worden veroordeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008508#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0008508#Artikel24
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '4'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0008508
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0008508
        artikel: '24'
        hoofdstuk: '4'
  - number: '5.2'
    text: |-
      De bijzondere onderhandelingsgroep of de leden daarvan en een Europese ondernemingsraad kunnen aan de
      ondernemingskamer van het gerechtshof Amsterdam verzoeken om:
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel5
  - number: 5.2.a
    text: |-
      krachtens [artikel 4, vierde en vijfde lid][ref1], [11, zevende lid][ref2] of [19, zesde lid][ref3], opgelegde
      geheimhouding op te heffen op de grond dat degene die de geheimhouding heeft opgelegd bij afweging van de betrokken
      belangen niet in redelijkheid tot het opleggen van geheimhouding had kunnen besluiten;


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008508#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0008508#Artikel19
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '4'
        hoofdstuk: '1'
      - id: ref2
