      - id: ref3
        bwb_id: BWBR0008508
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 5.2.b
    text: |-
      degene die informatie heeft geweigerd krachtens [artikel 11, zevende lid][ref1], of [19, zesde lid][ref2], te
      verplichten tot het verstrekken van informatie op de grond dat deze bij afweging van de betrokken belangen niet in
      redelijkheid tot het weigeren van informatie had kunnen besluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0008508#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0008508#Artikel19
    url: https://wetten.overheid.nl/BWBR0008508/2017-12-16#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008508
        artikel: '11'
        hoofdstuk: '2'
