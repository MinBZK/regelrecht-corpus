  - number: '13'
    text: |-
      1 Het bepaalde bij of krachtens de [artikelen 3][ref1], [4][ref2], [5][ref3], [8][ref4], en [12][ref5] is mede
      van toepassing op grensoverschrijdend vervoer, dat door een in Nederland gevestigde ondernemer geheel of ten dele
      in het buitenland wordt verricht.

      2 Het bepaalde bij of krachtens de [artikelen 3][ref6], [4][ref7], [5][ref8], [8][ref9], [11][ref10] en
      [12][ref11] is mede van toepassing tijdens vervoer over zee over een afstand van minder dan 150 km, wanneer het
      vervoermiddel, waarin de goederen zich bevinden, over een traject voorafgaand aan of aansluitend op het in het
      eerste lid bedoelde vervoer, over zee wordt vervoerd, zonder tussentijdse verlading der goederen.

      3 Indien het vervoer over zee plaatsvindt over een of meer trajecten, waarvoor het bepaalde in het vorige lid niet
      geldt, wordt elk traject over land, dat voorafgaat of volgt op een traject over zee, als een afzonderlijk traject
      aangemerkt.

      4 Het bepaalde bij of krachtens de [artikelen 3][ref12], [4][ref13], [5][ref14], [8][ref15], [11][ref16] en
      [12][ref17] is niet van toepassing op vervoer over land dat zonder tussentijdse verlading van de goederen met
      gebruikmaking van laadkisten geschiedt, mits deze transporten worden voorafgegaan of gevolgd door zeereizen anders
      dan die welke bedoeld in het tweede lid van dit artikel.


