  - number: '15'
    text: |-
      Deze wet kan worden aangehaald onder de titel "Wet grensoverschrijdend vervoer van aan bederf onderhevige
      levensmiddelen".

      Zij treedt in werking op een door Ons te bepalen tijdstip met uitzondering van [artikel 1][ref1] dat in werking
      treedt op de dag na de uitgifte van het *Staatsblad* waarin deze wet wordt geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0003186#Artikel1
    url: https://wetten.overheid.nl/BWBR0003186/1998-01-01#Artikel15
