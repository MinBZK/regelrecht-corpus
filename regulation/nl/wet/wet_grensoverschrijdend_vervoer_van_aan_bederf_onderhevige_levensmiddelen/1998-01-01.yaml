        artikel: '12'
  - number: '7'
    text: |-
      1 Indien tijdens het vervoer de in [artikel 4][ref1] bedoelde voorschriften niet in acht zijn genomen dan wel
      redelijkerwijs moet worden vermoed dat zulks niet is geschied, mogen de levensmiddelen niet in het verkeer worden
      gebracht dan nadat door Onze Ministers van Volksgezondheid en Milieuhygiëne en van Landbouw en Visserij daartoe
      machtiging is verleend. Aan de machtiging kunnen voorwaarden worden verbonden. Zij kan slechts worden geweigerd in
      het belang van de volksgezondheid of ter voorkoming van dierziekten.

      2 Onze Ministers kunnen bepalen, dat voor de behandeling van een verzoek om machtiging een vergoeding aan het Rijk
      verschuldigd is. Onze Ministers stellen de hoogte van de vergoeding alsmede de wijze van betaling vast.

      3 Het bepaalde in het eerste lid geldt niet indien en voor zover bij of krachtens enig wettelijk voorschrift de
      invoer of het in het verkeer brengen van een levensmiddel als in dat lid bedoeld aan een keuring of onderzoek is
      onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0003186#Artikel4
    url: https://wetten.overheid.nl/BWBR0003186/1998-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003186
        artikel: '4'
  - number: '8'
    text: |-
      1 Een vervoermiddel wordt slechts geacht te beantwoorden aan de omschrijving en normen als vastgelegd in bijlage
      1 van de overeenkomst indien dit vervoermiddel is gekeurd en ten blijke daarvan is voorzien van een geldig
      keuringscertificaat, afgegeven door een daartoe bevoegde keuringsinstelling overeenkomstig het bij of krachtens de
      [artikelen 9][ref1] en [10][ref2] bepaalde, of een fotocopie daarvan.

      2 Als bevoegde keuringsinstelling voor goederenwagens wordt aangemerkt een door Onze Minister van Verkeer en
      Waterstaat aangewezen keuringsinstelling.

      3 Als bevoegde keuringsinstelling voor vrachtauto's wordt aangemerkt de Dienst Wegverkeer, bedoeld in
      [artikel 4][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003186#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003186#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel4a
    url: https://wetten.overheid.nl/BWBR0003186/1998-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003186
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0003186
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: 4a
  - number: '9'
    text: |-
      1 Met betrekking tot

      a. de keuring door een in Nederland gevestigde keuringsinstelling;

      b. de afgifte, de geldigheidsduur en het model van het keuringscertificaat;

      c. de aanduiding aan te brengen op het vervoermiddel dient het bepaalde in de Bijlage 1, aanhangsel 1 t/m 4, van de
      Overeenkomst in acht te worden genomen.

      2 Onze Minister van Verkeer en Waterstaat stelt met betrekking tot de keuring nadere voorschriften vast.

      3 De keuringsinstelling geeft het keuringscertificaat slechts af indien het vervoermiddel overeenkomstig de in het
      eerste lid bedoelde bepalingen is gekeurd en goedgekeurd.

      4 De keuringsinstelling kan van degene die een keuringscertificaat onder zich heeft de teruggave daarvan vorderen
      indien zich naar zijn oordeel omstandigheden voordoen of bekend zijn geworden van dien aard dat, zo deze ten tijde
      van de afgifte van het certificaat hadden bestaan of bekend waren geweest, die afgifte niet zou hebben plaatsgehad.
      De betrokkene is alsdan verplicht het certificaat onverwijld bij de instelling in te leveren.

      5 Voor de behandeling van een verzoek om keuring van een vervoermiddel is een vergoeding verschuldigd. Voor
      goederenwagens stelt Onze Minister de hoogte van de vergoeding alsmede de wijze van betaling vast. Voor
      vrachtauto's stelt de Dienst Wegverkeer de hoogte van de vergoeding alsmede de wijze van betaling vast, waarbij
      [artikel 4][ref1] van overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4q
    url: https://wetten.overheid.nl/BWBR0003186/1998-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4q
  - number: '10'
    text: |-
      Met een door de in [artikel 8, tweede en derde lid][ref1], bedoelde keuringsinstelling afgegeven
      keuringscertificaat wordt gelijkgesteld:

      a. een keuringscertificaat, afgegeven overeenkomstig de Bijlage I aanhangsel 1, vierde lid, van de Overeenkomst,
      door een bevoegde keuringsinstelling in een van de landen, zijnde partij bij de Overeenkomst;

      b. een keuringscertificaat, afgegeven overeenkomstig de Bijlage I aanhangsel 1 en 2 van de Overeenkomst, door een
      bevoegde keuringsinstelling in een van de door Onze vorengenoemde Minister aangewezen landen, niet zijnde partij
      bij de Overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0003186#Artikel8
    url: https://wetten.overheid.nl/BWBR0003186/1998-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003186
        artikel: '8'
  - number: '11'
    text: |-
      De bestuurder van een vrachtauto waarmede door een in Nederland gevestigde ondernemer grensoverschrijdend vervoer
      van aan bederf onderhevige levensmiddelen wordt verricht is verplicht in het buitenland op eerste vordering van
      de in het betrokken land bevoegde ambtenaren de vrachtauto te doen stilhouden en het keuringscertificaat voor het
      desbetreffende vervoermiddel of een fotocopie daarvan behoorlijk ter inzage af te geven.
    url: https://wetten.overheid.nl/BWBR0003186/1998-01-01#Artikel11
  - number: '12'
    text: |-
      Bij algemene maatregel van bestuur kunnen voorschriften worden gegeven ter uitvoering van deze wet dan wel de
      Overeenkomst of regelingen als bedoeld in artikel 7 van de Overeenkomst.

      Daarbij kan worden afgeweken van de [artikelen 3][ref1], [4][ref2], [7][ref3], [8][ref4], [9, eerste lid][ref5],
      en [10][ref6].


