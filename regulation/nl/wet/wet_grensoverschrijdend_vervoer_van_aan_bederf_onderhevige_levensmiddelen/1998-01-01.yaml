preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de op 1 september 1970 te Genève tot stand gekomen Overeenkomst inzake
    het internationale vervoer van aan bederf onderhevige levensmiddelen en het gebruik van speciale vervoermiddelen
    bij dit vervoer (ATP), met Bijlagen, ingevolge artikel 60, tweede lid, van de Grondwet de goedkeuring der Staten-
    Generaal behoeft alvorens te kunnen worden bekrachtigd;

    dat zodanige bekrachtiging het stellen van regelen ter uitvoering van de Overeenkomst vereist;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003186/1998-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De op 1 september 1970 te Genève tot stand gekomen Overeenkomst inzake het internationaal vervoer van aan bederf
      onderhevige levensmiddelen en het gebruik van speciale vervoermiddelen bij dit vervoer (ATP), met Bijlagen, waarvan
      de Engelse en Franse tekst en de vertaling in het Nederlands in *Tractatenblad* 1972, 112 zijn geplaatst, wordt
      goedgekeurd voor Nederland.
    url: https://wetten.overheid.nl/BWBR0003186/1998-01-01#Artikel1
  - number: '2'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. "Overeenkomst": de in [artikel 1][ref1] genoemde Overeenkomst;

      b. "aan bederf onderhevige levensmiddelen": de in de Bijlagen 2 en 3 van de Overeenkomst genoemde levensmiddelen
      welke kennelijk bestemd zijn voor menselijke consumptie;

      c. "grensoverschrijdend vervoer": vervoer van goederen waarbij tenminste de grens tussen twee landen wordt
      overschreden van de plaats van inlading tot de plaats van lossing van die goederen, het laden en lossen inbegrepen;

      d. "goederenwagen": een voertuig, ingericht tot het vervoer van goederen, bestemd om langs spoorstaven te worden
      voortbewogen;

      e. "vrachtauto": een rij- of voertuig, ingericht tot het vervoer van goederen, op meer dan twee wielen, bestemd om
      over de weg te worden voortbewogen uitsluitend of mede door een mechanische kracht, op of aan het rij- of voertuig
      zelf aanwezig dan wel door elektrische tractie met stroomtoevoer van elders;

      f. "vervoermiddel": een goederenwagen, waaronder een laadkist wordt medebegrepen, of een vrachtauto, waaronder een
      laadkist, een aanhangwagen of een oplegger wordt medebegrepen.

      2 Deze wet is uitsluitend van toepassing op grensoverschrijdend vervoer van aan bederf onderhevige levensmiddelen
      met vervoermiddelen per spoor of over de weg of ten dele per spoor en ten dele over de weg.

      3 In deze wet wordt onder grensoverschrijdend vervoer niet begrepen vervoer van goederen waarbij de plaats van
      inlading en de plaats van lossing in Nederland zijn gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0003186#Artikel1
    url: https://wetten.overheid.nl/BWBR0003186/1998-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003186
        artikel: '1'
  - number: '3'
    text: |-
      Het is verboden voor het grensoverschrijdend vervoer van aan bederf onderhevige levensmiddelen bestemde
      vervoermiddelen aan te duiden als "geïsoleerde", "niet mechanisch gekoelde", "mechanisch gekoelde" of "verwarmde"
      vervoermiddelen tenzij zij beantwoorden aan de in Bijlage 1 van de Overeenkomst vastgelegde definities en normen.
    url: https://wetten.overheid.nl/BWBR0003186/1998-01-01#Artikel3
  - number: '4'
    text: |-
      Tijdens het grensoverschrijdend vervoer van aan bederf onderhevige levensmiddelen moeten de voorschriften in de
      Bijlagen 2 en 3 van de Overeenkomst worden gehandhaafd.
    url: https://wetten.overheid.nl/BWBR0003186/1998-01-01#Artikel4
  - number: '5'
    text: |-
      1 Voor het verrichten van grensoverschrijdend vervoer van aan bederf onderhevige levensmiddelen moet gebruik worden
      gemaakt van de vervoermiddelen die beantwoorden aan de in Bijlage 1 van de Overeenkomst vastgelegde definities en
      normen. Het voorgaande is niet van toepassing indien de temperaturen welke kunnen worden verwacht tijdens de gehele
      duur van het vervoer deze verplichting onnodig maken voor de naleving van de in Bijlagen 2 en 3 van de Overeenkomst
      vastgestelde temperatuurvoorschriften. De keuze en het gebruik van het vervoermiddel moet in elk geval zodanig zijn
      dat het mogelijk is de temperatuurvoorschriften tijdens de gehele duur van het vervoer in acht te nemen.

      2 Tevens dienen alle nodige maatregelen te worden genomen om de voorgeschreven temperaturen tijdens het vervoer
      te handhaven.
    url: https://wetten.overheid.nl/BWBR0003186/1998-01-01#Artikel5
  - number: '6'
    text: |-
      Met het toezicht op de naleving van het bepaalde in de [artikelen 3][ref1], [4][ref2] en [5][ref3], alsmede
      bij of krachtens [artikel 12][ref4], zijn belast de bij besluit van Onze Minister van Landbouw, Natuurbeheer en
      Visserij aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0003186#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003186#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003186#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0003186#Artikel12
    url: https://wetten.overheid.nl/BWBR0003186/1998-01-01#Artikel6
