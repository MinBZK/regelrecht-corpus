---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: diergeneesmiddelenwet
regulatory_layer: WET
publication_date: '2012-12-27'
valid_from: '2000-01-01'
bwb_id: BWBR0003818
url: https://wetten.overheid.nl/BWBR0003818/2000-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe regelen te stellen met betrekking tot
    diergeneesmiddelen en daarbij tevens regelen te stellen met betrekking tot smetstoffen die ziekten bij dieren
    kunnen veroorzaken;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: "Onze Minister": Onze Minister van Landbouw
      en Visserij; "dierenarts": degene die is ingeschreven in het register van praktizerende dierenartsen, bedoeld
      in [artikel 10, eerste lid, van de Wet op de uitoefening van de diergeneeskunde 1990][ref1]; "apotheker":
      degene die als gevestigde apotheker is ingeschreven in het register der gevestigde apothekers, bedoeld in
      [artikel 14, eerste lid, van de Wet op de Geneesmiddelenvoorziening][ref2] (*Stb.* 1958, 408), alsmede de in
      [artikel 14, tweede lid, van die wet][ref3] bedoelde apotheker in dienstbetrekking bij de zeemacht of de landmacht,
      voor zover hij de artsenijbereidkunst uitoefent uit hoofde van die dienstbetrekking; "registratiehouder": degene te
      wiens naam het diergeneesmiddel is geregistreerd; "substantie": stof, of een mengsel van stoffen, van menselijke,
      dierlijke, plantaardige of chemische oorsprong, daaronder begrepen dieren, planten, delen van dieren of planten
      alsmede micro-organismen en virussen; "diergeneesmiddel": substantie die bestemd is om al of niet na be- of
      verwerking, te worden gebruikt voor:


      [ref1]: https://wetten.overheid.nl/BWBR0004730#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002290#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0002290#Artikel14
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004730
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002290
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0002290
        artikel: '14'
  - number: 1.1.a
    text: |-
      het genezen, lenigen of voorkomen van enige aandoening, ziekte, ziekteverschijnsel, pijn, verwonding of gebrek van
      een dier;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel1
  - number: 1.1.b
    text: net herstellen, verbeteren of wijzigen van het functioneren van organen van een dier;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel1
  - number: 1.1.c
    text: het onderkennen van een ziekte of gebrek bij dieren door toepassing bij een dier;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel1
  - number: '1.2'
    text: 'Voor de toepassing van deze wet en de daarop berustende bepalingen wordt:'
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel1
  - number: 1.2.a
    text: |-
      met toepassing bij dieren gelijkgesteld toepassing bij materiaal van dierlijke herkomst uitgezonderd cel- of
      weefselcultures;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel1
  - number: 1.2.b
    text: onder afleveren niet begrepen het bij dieren toepassen van een diergeneesmiddel;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel1
  - number: 1.2.c
    text: onder diergeneesmiddel niet begrepen gemedicineerd voeder;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel1
  - number: 1.2.d
    text: |-
      in hoofdstuk III onder diergeneesmiddel mede verstaan door Onze Minister bij ministeriële regeling aangewezen
      substanties die niet bestemd zijn maar wel kunnen worden gebruikt als diergeneesmiddel.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel1
  - number: '2.1'
    text: |-
      Het is verboden een diergeneesmiddel dat niet is geregistreerd, te bereiden, voorhanden of in voorraad te hebben,
      af te leveren of bij dieren toe te passen.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel2
  - number: '2.2'
    text: 'Het verbod van het eerste lid geldt niet ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel2
  - number: 2.2.a
    text: |-
      diergeneesmiddelen die ten behoeve van één dier of een klein aantal dieren bereid worden of bereid zijn door een
      dierenarts of door een apotheker op recept van een dierenarts, voor zover het geen sera, entstoffen, biologische
      diagnostica of krachtens [artikel 5][ref1] aangewezen substanties betreft;


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel5
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '5'
        hoofdstuk: II
  - number: 2.2.b
    text: |-
      diergeneesmiddelen, andere dan sera, entstoffen of biologische diagnostica die bereid zijn uit of met behulp van
      krachtens [artikel 4, onderdeel ][ref1], aangewezen substanties, die worden doorgevoerd of die kennelijk bestemd
      zijn voor uitvoer.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel4
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '4'
        hoofdstuk: II
  - number: '3.1'
    text: |-
      Over de registratie van diergeneesmiddelen wordt door Onze Minister, in overeenstemming met Onze Minister van
      Welzijn, Volksgezondheid en Cultuur, beslist op aanvraag van de fabrikant of, indien een ander voor het in
      Nederland in de handel brengen van het diergeneesmiddel verantwoordelijk zal zijn, op aanvraag van deze laatste.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel3
  - number: '3.2'
    text: |-
      Door Onze Minister, in overeenstemming met Onze Minister van Welzijn, Volksgezondheid en Cultuur, worden regelen
      gesteld omtrent het indienen van een aanvraag tot registratie of tot verlenging van een registratie, alsmede tot
      wijziging van een registratie en omtrent de behandeling daarvan. Daarbij kan onder meer worden bepaald:
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel3
  - number: 3.2.a
    text: dat een aanvraag eerst in behandeling wordt genomen nadat een daarvoor vastgesteld bedrag is voldaan;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel3
  - number: 3.2.b
    text: welke kosten van het onderzoek, voortvloeiend uit een aanvraag, ten laste van de aanvrager worden gebracht;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel3
  - number: 3.2.c
    text: |-
      welke gegevens en bescheiden moeten worden overgelegd alvorens een aanvraag in behandeling wordt genomen, alsmede
      dat monsters ter beschikking moeten worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel3
  - number: '3.3'
    text: |-
      De registratiehouder is jaarlijks een vergoeding verschuldigd volgens bij of krachtens algemene maatregel van
      bestuur gestelde regelen.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel3
  - number: '3.4'
    text: |-
      Onze Minister stelt de in het tweede lid, onder *c*, bedoelde gegevens en bescheiden ter beschikking van
      Onze Minister van Sociale Zaken en Werkgelegenheid, voor zover deze laatste zulks in het belang van de
      arbeidsbescherming noodzakelijk acht.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel3
  - number: '3.5'
    text: |-
      Bij een regeling als bedoeld in het tweede lid, wordt in elk geval bepaald, dat volgende aanvragers tot registratie
      van een diergeneesmiddel niet naar gegevens mogen verwijzen die door een eerdere aanvrager tot registratie
      van eenzelfde diergeneesmiddel met het oog op die aanvraag zijn verstrekt, zolang nog geen 10 jaren sinds de
      registratie van datzelfde diergeneesmiddel zijn verstreken, tenzij de eerdere aanvrager schriftelijk heeft
      verklaard tegen een dergelijk verwijzen geen bezwaar te hebben.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel3
  - number: '3.6'
    text: |-
      Indien gedurende de duur van de registratie of bij gelegenheid van de wijziging dan wel de verlenging van de
      registratie aanvullende gegevens omtrent toxicologie of klinische effectiviteit moeten worden onderscheidenlijk
      zijn verstrekt is het bepaalde in het vijfde lid van overeenkomstige toepassing, met dien verstande dat de duur van
      de bescherming van de verstrekte gegevens in dat geval vijf jaren bedraagt.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel3
  - number: '3.7'
    text: |-
      Diergeneesmiddelen waarvoor ingevolge [verordening (EEG) nr. 2309/93](31993R2309) van de Raad van de Europese
      Unie van 22 juli 1993 tot vaststelling van communautaire procedures voor het verlenen van vergunningen voor en het
      toezicht op geneesmiddelen voor menselijk en diergeneeskundig gebruik en tot oprichting van een Europees Bureau
      voor de geneesmiddelenbeoordeling (PbEG L 214) een vergunning voor het in de handel brengen is verleend, worden
      gelijkgesteld met ingevolge het eerste lid geregistreerde diergeneesmiddelen. Op die diergeneesmiddelen is dit
      hoofdstuk, met uitzondering van de artikelen 2, eerste lid, 18 en 19, niet van toepassing. Op de voorschriften,
      waaronder de vergunning voor het in de handel brengen is verleend, is [artikel 7][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel7
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '7'
        hoofdstuk: II
  - number: '4'
    text: |-
      Diergeneesmiddelen worden behoudens het bepaalde in [artikel 5][ref1] geregistreerd indien:


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel5
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '5'
        hoofdstuk: II
  - number: 4.a
    text: |-
      op grond van onderzoek van de door de aanvrager overgelegde gegevens met redelijke zekerheid mag worden aangenomen,
      dat zij bij gebruik overeenkomstig de door de aanvrager opgegeven voorschriften:
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel4
  - number: 4.a.1
    text: de gestelde werking bezitten;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel4
  - number: 4.a.2
    text: geen gevaar opleveren voor de gezondheid van de mens;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel4
  - number: 4.a.3
    text: niet schadelijk zijn voor de gezondheid van dieren, en
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel4
  - number: 4.a.4
    text: niet schadelijk zijn voor het milieu of de gezondheid van planten.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel4
  - number: 4.b
    text: |-
      zij de opgegeven eigenschappen en kwalitatieve en kwantitatieve samenstelling bezitten en de voor het controleren
      daarvan opgegeven methodieken adequaat zijn;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel4
  - number: 4.c
    text: |-
      zij voldoen aan door Onze Minister in overeenstemming met Onze Minister van Welzijn, Volksgezondheid en Cultuur
      gestelde regelen met betrekking tot de substanties waaruit zij zijn samengesteld; en
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel4
  - number: 4.d
    text: |-
      zij, voor zover het sera, entstoffen of biologische diagnostica betreft, niet bereid zijn uit, of met behulp van
      door Onze Minister aangewezen substanties, waarvan naar zijn oordeel gevaar is te duchten voor de gezondheid van
      dieren of voor verstoring van de dierziektenbestrijding.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel4
  - number: '5'
    text: |-
      Onze Minister kan in overeenstemming met Onze Minister van Welzijn, Volksgezondheid en Cultuur bepalen, dat door
      hem aangewezen substanties, waarvan het gebruik als diergeneesmiddel in het belang van de volksgezondheid ongewenst
      is, niet in aanmerking komen voor registratie.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel5
  - number: '6.1'
    text: Registratie wordt verleend voor een tijdvak van 5 jaar.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel6
  - number: '6.2'
    text: |-
      Telkenmale wanneer daartoe door de registratiehouder een aanvraag op de krachtens [artikel 3, tweede lid][ref1],
      voorgeschreven wijze wordt ingediend, wordt de registratie voor een tijdvak van 5 jaar verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel3
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '3'
        hoofdstuk: II
  - number: '6.3'
    text: 'Bij de registratie kunnen voorschriften worden gegeven omtrent:'
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel6
  - number: 6.3.a
    text: |-
      de doeleinden waarvoor, de doseringen waarin, de wijze waarop en de technische hulpmiddelen waarmee het
      diergeneesmiddel uitsluitend dan wel niet mag worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel6
  - number: 6.3.b
    text: de in acht te nemen veiligheidsmaatregelen;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel6
  - number: 6.3.c
    text: de in acht te nemen wachttermijnen;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel6
  - number: 6.3.d
    text: |-
      de aanwezigheid in het diergeneesmiddel van een stof, waardoor kan worden onderkend dat het middel bij een dier is
      toegepast of aan diervoeder is toegevoegd;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel6
  - number: 6.3.e
    text: de verpakking en de aanduidingen en vermeldingen op, aan of bij de verpakking van het diergeneesmiddel.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel6
  - number: '6.4'
    text: |-
      Indien bij de registratie wordt bepaald, dat een diergeneesmiddel mag worden gebruikt voor de bereiding van een
      gemedicineerd voeder, kunnen de in het derde lid bedoelde voorschriften tevens worden gegeven met betrekking tot
      dat voeder.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel6
  - number: '6.5'
    text: De in het derde lid bedoelde voorschriften kunnen worden gewijzigd, aangevuld of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel6
  - number: '6.6'
    text: |-
      In uitzonderlijke omstandigheden kan, na overleg met de registratiehouder, op objectieve en controleerbare
      gronden aan een registratie, dan wel wijziging of verlenging van een registratie een jaarlijkse herziening
      of een specifieke verplichting, zoals aanvullend onderzoek na het verlenen van registratie of rapportage over
      bijwerkingen, worden verbonden.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel6
  - number: '7.1'
    text: |-
      Het is verboden te handelen in strijd met de in [artikel 6, derde lid][ref1], bedoelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel6
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '6'
        hoofdstuk: II
  - number: '7.2'
    text: |-
      Het verbod van het eerste lid geldt ten aanzien van anderen dan de registratiehouder slechts voor zover de in het
      eerste lid bedoelde voorschriften op, aan of bij de verpakking van het diergeneesmiddel of gemedicineerde voeder
      zijn vermeld of overeenkomstig [artikel 40, derde of vijfde lid][ref1], aan de houder van dieren zijn medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel40
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '40'
        hoofdstuk: VII
  - number: '8.1'
    text: |-
      Van een krachtens [artikel 3, eerste lid][ref1], of [artikel 6, vijfde lid][ref2], gegeven beschikking wordt
      mededeling gedaan door toezending van een afschrift aan Onze Minister van Sociale Zaken en Werkgelegenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel6
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003818
        artikel: '6'
        hoofdstuk: II
  - number: '8.2'
    text: |-
      Van het verlenen, het wijzigen of verlengen van een registratie wordt mededeling gedaan in de *Nederlandse
      Staatscourant.* Indien geen verlenging van de registratie plaatsvindt, wordt van het verstrijken van de termijn
      waarvoor de registratie gold mededeling gedaan in de Nederlandse Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel8
  - number: '9.1'
    text: |-
      Onze Minister draagt zorg, dat van de registratie van diergeneesmiddelen, de wijziging of de verlenging daarvan
      aantekening wordt gehouden in een register.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel9
  - number: '9.2'
    text: 'Onze Minister stelt regelen omtrent:'
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel9
  - number: 9.2.a
    text: de inrichting van het register;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel9
  - number: 9.2.b
    text: de wijze waarop kennis kan worden genomen van de in het register opgenomen gegevens.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel9
  - number: '10'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Welzijn, Volksgezondheid en Cultuur, een registratie
      geheel of gedeeltelijk schorsen voor een tijdvak van ten hoogste zes maanden, indien:
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel10
  - number: 10.a
    text: |-
      op grond van na de registratie te zijner kennis gekomen feiten het ernstige vermoeden bestaat dat niet wordt
      voldaan aan het in [artikel 4, onder ][ref1], bepaalde;


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel4
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '4'
        hoofdstuk: II
  - number: 10.b
    text: na de registratie het ernstige vermoeden ontstaat dat de aanvraag tot registratie onjuiste gegevens bevat.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel10
  - number: '11.1'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Welzijn, Volksgezondheid en Cultuur, een registratie
      geheel of gedeeltelijk doorhalen indien:
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel11
  - number: 11.1.a
    text: |-
      op grond van na de registratie te zijner kennis gekomen feiten blijkt dat niet wordt voldaan aan het in
      [artikel 4, onder ][ref1], bepaalde;


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel4
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '4'
        hoofdstuk: II
  - number: 11.1.b
    text: na de registratie blijkt dat de aanvraag tot registratie onjuiste gegevens bevat;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel11
  - number: 11.1.c
    text: de registratiehouder zulks bij aangetekend schrijven verzoekt.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel11
  - number: '11.2'
    text: |-
      Bij algemene maatregel van bestuur worden de gevallen vastgesteld waarin, ter uitvoering van een verordening,
      richtlijn of beschikking als bedoeld in artikel 189 van het Verdrag tot oprichting van de Europese Economische
      Gemeenschap (Trb. 1957, 91), een registratie geheel of ten dele van rechtswege vervalt.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel11
  - number: '12.1'
    text: |-
      Van een beschikking, houdende gehele of gedeeltelijke schorsing of doorhaling van een registratie, wordt mededeling
      gedaan door toezending van een afschrift aan Onze Minister van Sociale Zaken en Werkgelegenheid en wordt tevens
      mededeling gedaan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel12
  - number: '12.2'
    text: |-
      Een beschikking, houdende doorhaling van een registratie, vermeldt de datum met ingang waarvan de doorhaling
      van kracht wordt. Deze datum wordt niet vroeger gesteld dan zes maanden na de datum van de beslissing, tenzij
      bijzondere omstandigheden onmiddellijke doorhaling noodzakelijk maken.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel12
  - number: '12.3'
    text: |-
      Van het van rechtswege geheel of gedeeltelijk vervallen van een registratie wordt mededeling gedaan in de
      Staatscourant, met vermelding van de datum met ingang waarvan de registratie geheel of gedeeltelijk van rechtswege
      vervalt.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel12
  - number: '13.1'
    text: |-
      Het is behoudens het bepaalde in het tweede lid verboden een diergeneesmiddel voor zover de registratie daarvan
      ingevolge [artikel 10][ref1] of [11][ref2] geheel of gedeeltelijk is geschorst, doorgehaald onderscheidenlijk
      van rechtswege vervallen, of waarvan de termijn waarvoor de registratie gold is verstreken, te bereiden of af te
      leveren anders dan ten behoeve van de uitvoer of bij dieren toe te passen.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel11
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '10'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003818
        artikel: '11'
        hoofdstuk: II
  - number: '13.2'
    text: |-
      Onze Minister kan bepalen dat een diergeneesmiddel waarvan de termijn waarvoor de registratie gold, is verstreken,
      nog gedurende een daarbij vast te stellen periode mag worden afgeleverd of mag worden toegepast met inachtneming
      van de daarbij gestelde regelen.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel13
  - number: '14.1'
    text: |-
      Het is, onverminderd het bij of krachtens Titel 1 bepaalde, verboden geregistreerde sera, entstoffen of biologische
      diagnostica af te leveren, voorhanden of in voorraad te hebben of bij dieren toe te passen als niet uit een door
      Onze Minister vastgestelde aanduiding op de verpakking blijkt, dat zij afkomstig zijn van een goedgekeurde partij.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel14
  - number: '14.2'
    text: Onze Minister kan regelen stellen omtrent het aanbrengen van de in het eerste lid bedoelde aanduiding.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel14
  - number: '14.3'
    text: 'Het verbod van het eerste lid geldt niet:'
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel14
  - number: 14.3.a
    text: |-
      voor het voorhanden of in voorraad hebben van een partij van een geregistreerd serum, entstof of biologisch
      diagnosticum door de registratiehouder die om goedkeuring heeft gevraagd, totdat op zijn aanvraag onherroepelijk
      is beslist;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel14
  - number: 14.3.b
    text: |-
      voor het door houders van vergunningen, bedoeld in [artikel 21][ref1], voorhanden of in voorraad hebben van
      geregistreerde sera, entstoffen of biologische diagnostica die kennelijk bestemd zijn voor aflevering aan afnemers
      in het buitenland, voor zover hun vergunning zich uitstrekt tot de betreffende diergeneesmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
        hoofdstuk: III
  - number: '15.1'
    text: Op een aanvraag tot goedkeuring van een partij wordt beslist door of vanwege Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel15
  - number: '15.2'
    text: |-
      Onze Minister stelt regelen omtrent het indienen van een aanvraag en omtrent de behandeling daarvan. Daarbij
      kan worden bepaald dat een aanvraag eerst in behandeling wordt genomen nadat een daarvoor vastgesteld bedrag is
      voldaan.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel15
  - number: '16'
    text: 'Een partij wordt slechts goedgekeurd, indien:'
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel16
  - number: 16.a
    text: |-
      redelijkerwijs kan worden aangenomen dat voldaan is aan door Onze Minister gestelde eisen inzake conformiteit
      van het produkt waaruit de partij bestaat met het produkt zoals het geregistreerd is en met betrekking tot het
      verrichten van controles inzake die conformiteit;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel16
  - number: 16.b
    text: |-
      is voldaan aan de ingevolge [artikel 15, tweede lid][ref1], gestelde regelen omtrent het indienen van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel15
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '15'
        hoofdstuk: II
  - number: '17.1'
    text: |-
      Indien goedkeuring aan een partij wordt onthouden kan Onze Minister de registratiehouder bevelen de partij te
      vernietigen of te doen vernietigen. Een ieder wie zulks aangaat is verplicht te handelen overeenkomstig het bevel.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel17
  - number: '17.2'
    text: |-
      Het bevel wordt de registratiehouder bij aangetekende brief medegedeeld. Bij het bevel kunnen voorschriften worden
      gegeven omtrent de termijn waarbinnen, de plaats waar, de wijze waarop en het toezicht waaronder de vernietiging
      moet geschieden alsmede omtrent de bewaring en het vervoer vóór vernietiging.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel17
  - number: '17.3'
    text: |-
      Onze Minister is bevoegd tot toepassing van bestuursdwang ter handhaving van een bevel als bedoeld in het eerste
      lid of een voorschrift als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel17
  - number: '18.1'
    text: |-
      Het is verboden een geregistreerd diergeneesmiddel te be- of verwerken, tenzij zulks bij de registratie
      uitdrukkelijk is toegestaan.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel18
  - number: '18.2'
    text: |-
      Het is aan anderen dan de registratiehouder en degene die in zijn opdracht handelt, verboden een geregistreerd
      diergeneesmiddel te verpakken of te etiketteren, tenzij bij de registratie uitdrukkelijk anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel18
  - number: '19'
    text: |-
      Het als diergeneesmiddel aanbevelen of aanprijzen van een niet ingevolge deze wet geregistreerd diergeneesmiddel,
      dan wel het aanbevelen of aanprijzen van enige toepassing van een diergeneesmiddel in strijd met het bij of
      krachtens deze wet bepaalde, is verboden.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel19
  - number: '20.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan, voor zover het belang van de gezondheid van de mens, dieren
      of planten dan wel het belang van het milieu zich daartegen niet verzet, worden bepaald, dat het bij of krachtens
      de [artikelen 2-4][ref1], [6-13][ref2] of [19][ref3], bepaalde niet of slechts gedeeltelijk van toepassing is ten
      aanzien van bij of krachtens die maatregel aangewezen diergeneesmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0003818#Artikel19
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '2'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003818
        artikel: '6'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003818
        artikel: '19'
        hoofdstuk: II
  - number: '20.2'
    text: |-
      Ingeval van toepassing van het eerste lid kan daarbij worden bepaald, dat degene die een ingevolge dat lid
      aangewezen diergeneesmiddel in de handel brengt verplicht is daarvan overeenkomstig door Onze Minister gestelde
      regelen mededeling te doen.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel20
  - number: '21.1'
    text: |-
      Het is verboden zonder daartoe strekkende vergunning van Onze Minister diergeneesmiddelen te bereiden, te
      verpakken, te etiketteren of af te leveren.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel21
  - number: '21.2'
    text: |-
      Een vergunning, bedoeld in het eerste lid, is slechts geldig voor de daarin genoemde handelingen met betrekking tot
      de daarin genoemde diergeneesmiddelen en, voor zover deze handelingen in lokaliteiten plaatsvinden, voor de daarin
      genoemde lokaliteiten.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel21
  - number: '22.1'
    text: |-
      Het in [artikel 21][ref1] met betrekking tot het bereiden van diergeneesmiddelen gestelde verbod geldt
      niet voor het bereiden door een dierenarts of door een apotheker van diergeneesmiddelen als bedoeld in
      [artikel 2, tweede lid, onder a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel2
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003818
        artikel: '2'
        hoofdstuk: II
  - number: '22.2'
    text: |-
      Het in [artikel 21][ref1] met betrekking tot het verpakken en etiketteren van diergeneesmiddelen gestelde verbod
      geldt niet voor het verpakken of etiketteren door een dierenarts of door een apotheker van:


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
        hoofdstuk: III
  - number: 22.2.a
    text: |-
      diergeneesmiddelen als bedoeld in [artikel 2, tweede lid, onder ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel2
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '2'
        hoofdstuk: II
  - number: 22.2.b
    text: |-
      diergeneesmiddelen waarvan het verpakken en etiketteren door anderen dan de registratiehouder bij de registratie
      uitdrukkelijk is toegestaan.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel22
  - number: '22.3'
    text: |-
      Het in [artikel 21][ref1] met betrekking tot het afleveren van diergeneesmiddelen gestelde verbod geldt niet voor
      het afleveren van diergeneesmiddelen door:


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
        hoofdstuk: III
  - number: 22.3.a
    text: een dierenarts aan de houder van de dieren waarvoor de diergeneesmiddelen zijn bestemd;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel22
  - number: 22.3.b
    text: een apotheker in zijn apotheek.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel22
  - number: '23.1'
    text: |-
      Een vergunning, bedoeld in [artikel 21][ref1], wordt op verzoek verleend indien is voldaan aan bij of krachtens
      algemene maatregel van bestuur te stellen eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
        hoofdstuk: III
  - number: '23.2'
    text: 'De in het eerste lid bedoelde eisen kunnen betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel23
  - number: 23.2.a
    text: |-
      de lokaliteiten waarin het bedrijf wordt uitgeoefend, de inrichting en het gebruik van die lokaliteiten en de
      technische uitrusting van het bedrijf;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel23
  - number: 23.2.b
    text: de deskundigheid van bij de bedrijfsuitoefening betrokken personen;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel23
  - number: 23.2.c
    text: voorzieningen ten behoeve van de controle op de naleving van het bepaalde bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel23
  - number: '23.3'
    text: |-
      De eisen, bedoeld in het eerste lid, kunnen verschillen naar gelang van de soort en het type van de
      diergeneesmiddelen, hun land van herkomst, de overige werkzaamheden van degene aan wie de vergunning wordt verleend
      en naar gelang van de handelingen waarvoor de vergunning wordt verleend.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel23
  - number: '23.4'
    text: |-
      Op een aanvraag voor een vergunning, bedoeld in het eerste lid, wordt, indien de aanvraag is ingediend door een
      persoon, bedoeld in [artikel 2, eerste lid, onder ][ref1], door Onze Minister niet beslist dan na overleg met Onze
      Minister van Welzijn, Volksgezondheid en Cultuur.


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel2
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '2'
  - number: '24.1'
    text: |-
      Onze Minister stelt regelen omtrent het indienen van een aanvraag voor, dan wel tot wijziging van een vergunning
      als bedoeld in [artikel 21][ref1], en omtrent de behandeling daarvan. Daarbij kan onder meer worden bepaald:


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
        hoofdstuk: III
  - number: 24.1.a
    text: dat een aanvraag eerst in behandeling wordt genomen nadat een daarvoor vastgesteld bedrag is voldaan;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel24
  - number: 24.1.b
    text: |-
      dat alvorens een vergunning wordt verleend of gewijzigd een onderzoek ter plaatse noodzakelijk is, waarvan de
      kosten ten laste van de aanvrager worden gebracht;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel24
  - number: 24.1.c
    text: welke gegevens en bescheiden moeten worden overgelegd alvorens een aanvraag in behandeling wordt genomen.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel24
  - number: '24.2'
    text: |-
      Aan een vergunning, bedoeld in [artikel 21][ref1], kunnen voorschriften worden verbonden. Zij kan onder beperkingen
      worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
        hoofdstuk: III
  - number: '25.1'
    text: |-
      Een vergunning, bedoeld in [artikel 21][ref1], kan worden ingetrokken, indien niet langer wordt voldaan aan de in
      [artikel 23, eerste lid][ref2], bedoelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel23
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003818
        artikel: '23'
        hoofdstuk: III
  - number: '25.2'
    text: |-
      Bij wijziging of aanvulling van de in [artikel 23, eerste lid][ref1], bedoelde eisen heeft geen intrekking van
      de vergunning plaats dan nadat de houder van de vergunning in de gelegenheid is gesteld aan de gewijzigde of
      aangevulde eisen te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel23
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '23'
        hoofdstuk: III
  - number: '25.3'
    text: |-
      De kosten van de herhaalde inspecties als bedoeld in artikel 3 van [richtlijn 91/412/EG](31991L0412) van de
      Commissie van 23 juli 1991 tot vastlegging van de beginselen en richtsnoeren inzake goede praktijken bij het
      vervaardigen van geneesmiddelen voor diergeneeskundig gebruik (PbEG L 228), kunnen, volgens door Onze Minister te
      stellen regelen, ten laste van de houder van de vergunning worden gebracht.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel25
  - number: '26.1'
    text: |-
      Van een beschikking, betreffende een vergunning, als bedoeld in [artikel 21][ref1], wordt mededeling gedaan door
      toezending van een afschrift aan Onze Minister van Sociale Zaken en Werkgelegenheid en wordt tevens mededeling
      gedaan in de *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
        hoofdstuk: III
  - number: '27.1'
    text: |-
      Onze Minister draagt zorg, dat van de vergunningen, bedoeld in [artikel 21][ref1], aantekening wordt gehouden in
      een register.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
        hoofdstuk: III
  - number: '27.2'
    text: 'Onze Minister stelt regelen omtrent:'
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel27
  - number: 27.2.a
    text: de inrichting van het register;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel27
  - number: 27.2.b
    text: de wijze waarop kennis kan worden genomen van de in het register opgenomen gegevens.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel27
  - number: '28'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan, voor zover het belang van de gezondheid van de mens, dieren
      of planten dan wel het belang van het milieu zich daartegen niet verzet, worden bepaald, dat het verbod van
      [artikel 21][ref1] niet of slechts gedeeltelijk van toepassing is ten aanzien van bij of krachtens die maatregel
      aangewezen diergeneesmiddelen, niet zijnde sera, entstoffen of biologische diagnostica.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
        hoofdstuk: III
  - number: '29.1'
    text: De bepalingen van dit hoofdstuk zijn van toepassing op door Onze Minister aangewezen diergeneesmiddelen.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel29
  - number: '29.2'
    text: |-
      Ingevolge het eerste lid worden slechts diergeneesmiddelen aangewezen welke bij toepassing zonder tussenkomst van
      een dierenarts gevaar voor de gezondheid van mens of dier dan wel schade voor het milieu kunnen opleveren.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel29
  - number: '30.1'
    text: |-
      Het is verboden diergeneesmiddelen, bedoeld in [artikel 29][ref1], af te leveren.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel29
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '29'
        hoofdstuk: IV
  - number: '30.2'
    text: 'Het verbod van het eerste lid geldt niet voor het afleveren aan:'
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel30
  - number: 30.2.a
    text: |-
      houders van vergunningen, bedoeld in [artikel 21][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
        hoofdstuk: III
  - number: 30.2.b
    text: |-
      houders van vergunningen, bedoeld in [artikel 33][ref1], wier vergunning strekt tot het bereiden van gemedicineerd
      voeder, voor wat betreft diergeneesmiddelen, waarvan de verwerking in gemedicineerd voeder is toegestaan;


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel33
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '33'
        hoofdstuk: V
  - number: 30.2.c
    text: dierenartsen;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel30
  - number: 30.2.d
    text: apothekers;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel30
  - number: 30.2.e
    text: |-
      door Onze Minister, in overeenstemming met Onze Minister wie het mede aangaat, aangewezen diergeneeskundige
      instellingen of instellingen van wetenschap of onderzoek;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel30
  - number: 30.2.f
    text: |-
      personen behorende tot door Onze Minister aangewezen groepen, voor wat betreft de daarbij aangewezen
      diergeneesmiddelen;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel30
  - number: 30.2.g
    text: afnemers in het buitenland.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel30
  - number: '30.3'
    text: 'Het verbod van het eerste lid geldt voorts niet met betrekking tot het afleveren door:'
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel30
  - number: 30.3.a
    text: een dierenarts aan de houder van de dieren waarvoor de diergeneesmiddelen zijn bestemd;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel30
  - number: 30.3.b
    text: een apotheker op recept van een dierenarts aan de in het recept vermelde houder van dieren.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel30
  - number: '30.4'
    text: |-
      Het in het tweede lid, aanhef en onder *d*, en in het derde lid bepaalde geldt niet ten aanzien van door Onze
      Minister aangewezen diergeneesmiddelen die bij toepassing door anderen dan dierenartsen gevaar kunnen opleveren
      voor de gezondheid van mens of dier dan wel schade voor het milieu.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel30
  - number: '31.1'
    text: |-
      Het is verboden diergeneesmiddelen, bedoeld in [artikel 29][ref1], voorhanden of in voorraad te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel29
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '29'
        hoofdstuk: IV
  - number: '31.2'
    text: 'Het verbod van het eerste lid geldt niet voor:'
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel31
  - number: 31.2.a
    text: |-
      houders van vergunningen, bedoeld in [artikel 21][ref1], voor zover hun vergunning zich uitstrekt tot de
      betreffende diergeneesmiddelen;


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
        hoofdstuk: III
  - number: 31.2.b
    text: |-
      houders van vergunningen, bedoeld in [artikel 33][ref1], voor zover hun vergunning het verwerken van de
      desbetreffende diergeneesmiddelen in gemedicineerd voeder toelaat;


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel33
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '33'
        hoofdstuk: V
  - number: 31.2.c
    text: dierenartsen;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel31
  - number: 31.2.d
    text: apothekers;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel31
  - number: 31.2.e
    text: |-
      door Onze Minister, in overeenstemming met Onze Minister wie het mede aangaat, aangewezen diergeneeskundige
      instellingen of instellingen van wetenschap of onderzoek, voor zover het de in de aanwijzing genoemde
      diergeneesmiddelen betreft;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel31
  - number: 31.2.f
    text: |-
      personen behorende tot door Onze Minister krachtens [artikel 30, tweede lid, onder ][ref1], aangewezen groepen,
      voor zover het de voor elk van deze groepen in de aanwijzing genoemde diergeneesmiddelen betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel30
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '30'
        hoofdstuk: IV
  - number: '31.3'
    text: |-
      Het verbod van het eerste lid geldt voorts niet voor houders van dieren voor zover het diergeneesmiddelen
      betreft die niet zijn aangewezen krachtens [artikel 30, vierde lid][ref1], en die hun overeenkomstig
      [artikel 30, derde lid][ref2], zijn afgeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel30
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '30'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0003818
        artikel: '30'
        hoofdstuk: IV
  - number: '32.1'
    text: |-
      Het is verboden om bij de bereiding van een gemedicineerd voeder gebruik te maken van andere dan geregistreerde
      diergeneesmiddelen.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel32
  - number: '32.2'
    text: |-
      Het is verboden om bij de bereiding van een gemedicineerd voeder gebruik te maken van andere dan van een
      goedgekeurde partij afkomstige sera, entstoffen of biologische diagnostica.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel32
  - number: '33.1'
    text: |-
      Het is verboden zonder daartoe strekkende vergunning gemedicineerde voeders te bereiden, te verpakken, te
      etiketteren of af te leveren. Een vergunning wordt door of vanwege Onze Minister verleend.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel33
  - number: '33.2'
    text: |-
      Het in de [artikelen 21, tweede lid][ref1], en [23-28][ref2] bepaalde is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel23
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003818
        artikel: '23'
        hoofdstuk: III
  - number: '33.3'
    text: |-
      Met betrekking tot het stellen van eisen als bedoeld in [artikel 23][ref1], waaraan moet zijn voldaan alvorens
      een vergunning voor het bereiden, verpakken, etiketteren of afleveren van gemedicineerde voeders wordt verleend,
      kan bij of krachtens een algemene maatregel van bestuur de medewerking worden gevorderd van het bestuur van een
      bedrijfslichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel23
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '23'
        hoofdstuk: III
  - number: '33.4'
    text: |-
      Indien de van het bestuur van een bedrijfslichaam gevorderde medewerking bestaat in het stellen van nadere regels
      bij verordening, behoeft zodanige verordening de goedkeuring van Onze Minister. Krachtens de verordening genomen
      besluiten behoeven, voorzover dit bij of krachtens de maatregel als bedoeld in het derde lid is bepaald, de
      goedkeuring van de daarbij aangewezen autoriteit.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel33
  - number: '34.1'
    text: |-
      Onze Minister kan terzake van het verlenen van vergunningen ingevolge [artikel 33, eerste lid][ref1], de
      medewerking vorderen van het bestuur van een bedrijfslichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel33
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '33'
        hoofdstuk: V
  - number: '34.2'
    text: Deze medewerking omvat mede het houden van een register van deze vergunningen.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel34
  - number: '35.1'
    text: 'Het is verboden gemedicineerde voeders af te leveren aan anderen dan:'
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel35
  - number: 35.1.a
    text: |-
      houders van vergunningen, bedoeld in [artikel 33][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel33
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '33'
        hoofdstuk: V
  - number: 35.1.b
    text: afnemers in het buitenland;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel35
  - number: 35.1.c
    text: houders van dieren.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel35
  - number: '35.2'
    text: |-
      Onze Minister kan bepalen, dat door hem aangewezen gemedicineerde voeders aan houders van dieren uitsluitend op
      recept van een dierenarts mogen worden afgeleverd.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel35
  - number: '36.1'
    text: Het is verboden gemedicineerde voeders voorhanden of in voorraad te hebben.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel36
  - number: '36.2'
    text: 'Het verbod van het eerste lid geldt niet voor:'
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel36
  - number: 36.2.a
    text: |-
      houders van vergunningen, bedoeld in [artikel 33][ref1], voor zover hun vergunning zich uitstrekt tot de
      betreffende gemedicineerde voeders;


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel33
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '33'
        hoofdstuk: V
  - number: 36.2.b
    text: |-
      houders van dieren voor zover het gemedicineerde voeders betreft die hun overeenkomstig [artikel 35][ref1] zijn
      afgeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel35
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '35'
        hoofdstuk: V
  - number: '37.1'
    text: |-
      Het is verboden de door Onze Minister aangewezen smetstoffen die gevaar opleveren voor de gezondheid van dieren,
      voorhanden of in voorraad te hebben.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel37
  - number: '37.2'
    text: |-
      Het verbod van het eerste lid geldt, onverminderd de krachtens [artikel 38][ref1] gestelde regelen, niet:


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel38
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '38'
        hoofdstuk: VI
  - number: 37.2.a
    text: |-
      voor door Onze Minister, in overeenstemming met Onze Minister wie het mede aangaat, aangewezen instellingen van
      wetenschap of onderzoek voor zover de smetstof dient voor gebruik voor wetenschappelijke doeleinden;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel37
  - number: 37.2.b
    text: |-
      voor zover de smetstof bestemd is voor de bereiding van of controle op therapeutische of diagnostische middelen,
      bestemd voor toepassing bij onderzoek of behandeling van de mens;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel37
  - number: 37.2.c
    text: |-
      voor degene, aan wie krachtens [artikel 21][ref1] vergunning tot het bereiden van een serum, entstof of biologisch
      diagnosticum is verleend, mits de smetstof dient voor de bereiding van of controle op dat produkt.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
        hoofdstuk: III
  - number: '38'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld met betrekking tot het bereiden,
      het bewaren, het vervoeren en het vernietigen van smetstoffen, het voorkomen van verspreiding daarvan, alsmede met
      betrekking tot het voeren van een administratie en het verstrekken van gegevens omtrent smetstoffen.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel38
  - number: '39.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld omtrent het verrichten van controles
      door houders van vergunningen, bedoeld in de [artikelen 21][ref1] en [33][ref2], op de in die vergunningen vermelde
      substanties en op de bij de bereiding daarvan gebruikte grondstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel33
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003818
        artikel: '33'
        hoofdstuk: V
  - number: '39.2'
    text: |-
      Bij of krachtens de in het eerste lid bedoelde maatregel kunnen tevens regelen worden gesteld omtrent de wijze
      waarop de aldaar bedoelde controles dienen te worden verricht, het vastleggen van de resultaten van de controles
      in bescheiden, het bewaren en overleggen of afgeven van deze bescheiden en omtrent het nemen en aanhouden van
      monsters.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel39
  - number: '40.1'
    text: |-
      Onze Minister kan regelen stellen omtrent een door houders van vergunningen, bedoeld in [artikel 21][ref1] en
      [33][ref2], dierenartsen, apothekers en personen, bedoeld in [artikel 30, tweede lid, onder ][ref3], te voeren
      administratie, waaruit voor zover Onze Minister zulks voor elk dezer groepen bepaalt, de voorraad, de produktie,
      de be- of verwerking, de ontvangst, de herkomst, de aflevering, de vernietiging, de bestemming en het verbruik van
      daarbij aan te wijzen diergeneesmiddelen en gemedicineerde voeders moet kunnen blijken.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0003818#Artikel30
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003818
        artikel: '33'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0003818
        artikel: '30'
        hoofdstuk: IV
  - number: '40.2'
    text: |-
      Degene die bedrijfsmatig dieren houdt, is verplicht overeenkomstig de door Onze Minister gestelde regelen in
      een logboek aantekening te houden van de ontvangst en van de toepassing of vervoedering van door Onze Minister
      aangewezen diergeneesmiddelen en gemedicineerde voeders.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel40
  - number: '40.3'
    text: |-
      Een dierenarts of een persoon behorende tot een van de krachtens [artikel 30, tweede lid, onder ][ref1], aangewezen
      groepen, is verplicht, wanneer hij een diergeneesmiddel toepast ten aanzien waarvan een voorschrift geldt als
      bedoeld in [artikel 6, derde lid, onder ][ref2], om schriftelijk overeenkomstig door Onze Minister gestelde
      regelen te verklaren welk diergeneesmiddel hij heeft toegepast, bij welke dieren, in welke hoeveelheid en welke
      wachttermijn is voorgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel6
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '30'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0003818
        artikel: '6'
        hoofdstuk: II
  - number: '40.4'
    text: |-
      Onze Minister kan regelen stellen omtrent het bewaren van de in het eerste lid bedoelde administratie en de daarmee
      verband houdende bescheiden, van het in het tweede lid bedoelde logboek en de daarmee verband houdende bescheiden
      alsmede omtrent de wijze van controle door de houder van de administratie hierop.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel40
  - number: '40.5'
    text: |-
      Degene die een dier aan een ander overdraagt is verplicht die ander, met inachtneming van door Onze Minister te
      stellen nadere regelen, in te lichten met betrekking tot de toepassing bij dat dier van diergeneesmiddelen ten
      aanzien waarvan een voorschrift als bedoeld in [artikel 6, derde lid, onderdeel ][ref1] geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel6
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '6'
        hoofdstuk: II
  - number: '41.1'
    text: |-
      Indien op of in voortbrengselen van dierlijke oorsprong een grotere hoeveelheid van een of meer diergeneesmiddelen,
      bestanddelen daarvan of omzettingsprodukten aanwezig is dan bij of krachtens algemene maatregel van bestuur is
      bepaald, worden deze voortbrengselen door hun ondeugdelijkheid geacht de gezondheid en veiligheid van de mens in
      gevaar te kunnen brengen, zoals bedoeld in [artikel 18, onderdeel ][ref1]; voor zover zij vlees in de zin van de
      [Vleeskeuringswet][ref2] (*Stb.* 1919, 524) zijn worden zij afgekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0001896
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0001896
  - number: '41.2'
    text: |-
      Een algemene maatregel van bestuur als bedoeld in het eerste lid, kan tevens betrekking hebben op vernietiging van
      voortbrengselen waarin of waarop een grotere hoeveelheid van een of meer diergeneesmiddelen, bestanddelen daarvan
      of omzettingsprodukten aanwezig is dan is toegelaten.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel41
  - number: '42.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regelen onderscheidenlijk nadere regelen worden gesteld
      omtrent:
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel42
  - number: 42.1.a
    text: de invoer, doorvoer en uitvoer van diergeneesmiddelen, gemedicineerde voeders en van smetstoffen;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel42
  - number: 42.1.b
    text: |-
      het bereiden, het be- of verwerken, het verpakken, het etiketteren, het bewaren, het voorhanden of in voorraad
      hebben, het vervoeren, het afleveren, het toepassen, onderscheidenlijk het vervoederen, het uit de handel nemen en
      het vernietigen van diergeneesmiddelen en gemedicineerde voeders;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel42
  - number: 42.1.c
    text: het zich ontdoen van resten en ledige verpakkingen van diergeneesmiddelen of gemedicineerde voeders;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel42
  - number: 42.1.d
    text: |-
      het voorschrijven van diergeneesmiddelen en gemedicineerde voeders, alsmede omtrent de inhoud van recepten en het
      uitschrijven en afgeven daarvan;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel42
  - number: 42.1.e
    text: |-
      het gebruik en de inrichting van de lokalen welke door een dierenarts worden gebruikt voor de bewaring en in
      voorkomend geval de bereiding van diergeneesmiddelen alsmede omtrent de technische hulpmiddelen die daarin aanwezig
      moeten zijn;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel42
  - number: 42.1.f
    text: |-
      het afleveren en het bewaren van en het omgaan met grondstoffen die bij de bereiding van diergeneesmiddelen worden
      gebruikt;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel42
  - number: 42.1.g
    text: |-
      het aantekening houden en melden van bijwerkingen van een diergeneesmiddel en de inrichting van een
      geneesmiddelenbewakingssysteem;
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel42
  - number: 42.1.h
    text: |-
      het melden van wijzigingen in de gegevens, op grond waarvan de registratie is verleend, en van nieuwe elementen die
      kunnen leiden tot een wijziging in die gegevens.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel42
  - number: '42.2'
    text: |-
      Bij een in het eerste lid bedoelde maatregel kan de medewerking worden gevorderd van het bestuur van een
      bedrijfslichaam voorzover het betreft het vaststellen van regels of nadere regels als bedoeld in het eerste lid,
      onder a, b of c, ten aanzien van gemedicineerde voeders.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel42
  - number: '42.3'
    text: |-
      Verordeningen bij welke de in het tweede lid bedoelde regels worden vastgesteld behoeven de goedkeuring van Onze
      Minister. Krachtens de verordening genomen besluiten behoeven, voorzover dit bij of krachtens de maatregel als
      bedoeld in het eerste lid is bepaald, de goedkeuring van de daarbij aangewezen autoriteit.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel42
  - number: '43.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven betreffende het bereiden
      het verpakken, het etiketteren, het voorhanden of in voorraad hebben, het afleveren en het toepassen van
      diergeneesmiddelen of gemedicineerde voeders welke als zodanig dan wel voor wat betreft een uitbreiding van de
      toepassingsmogelijkheden kennelijk in een proefstadium verkeren. Daarbij kan worden afgeweken van de bepalingen van
      deze wet.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel43
  - number: '43.2'
    text: |-
      Voor zover krachtens het eerste lid proefnemingen als daar bedoeld slechts na daartoe gedane aanvraag kunnen worden
      toegestaan, kunnen de kosten voortvloeiend uit deze aanvraag geheel of gedeeltelijk ten laste van de aanvrager
      worden gebracht volgens door Onze Minister gestelde regelen.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel43
  - number: '44.1'
    text: |-
      Het is degene die bedrijfsmatig dieren houdt verboden om door Onze Minister aangewezen substanties voorhanden of in
      voorraad te hebben.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel44
  - number: '44.2'
    text: 'Ingevolge het eerste lid kunnen slechts worden aangewezen, substanties die:'
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel44
  - number: 44.2.a
    text: |-
      ingevolge een aanwijzing krachtens [artikel 5][ref1] niet in aanmerking komen voor registratie;


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel5
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '5'
        hoofdstuk: II
  - number: 44.2.b
    text: |-
      kunnen worden gebruikt voor de bereiding van diergeneesmiddelen, bedoeld in [artikel 29][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel29
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '29'
        hoofdstuk: IV
  - number: '45.1'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Welzijn, Volksgezondheid en Cultuur, voor zover het
      belang van de gezondheid van de mens, dieren of planten dan wel het belang van het milieu zich daartegen niet
      verzet, van het bij of krachtens deze wet bepaalde vrijstelling of ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel45
  - number: '45.2'
    text: |-
      Op een beschikking betreffende een ontheffing is het in [artikel 26][ref1] bepaalde van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel26
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '26'
        hoofdstuk: III
  - number: '45.3'
    text: |-
      Aan een vrijstelling of ontheffing ingevolge deze wet kunnen voorschriften worden verbonden. Zij kunnen onder
      beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel45
  - number: '46'
    text: |-
      De krachtens deze wet vastgestelde regelen van algemene aard, met uitzondering van die, bedoeld in
      [artikel 6, derde lid][ref1], worden, voor zover zij niet zijn vervat in een algemene maatregel van bestuur, bekend
      gemaakt in de *Nederlandse Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel6
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '6'
        hoofdstuk: II
  - number: '47'
    text: |-
      Tegen een op grond van deze wet genomen besluit kan een belanghebbende beroep instellen bij het College van Beroep
      voor het bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel47
  - number: '49'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter uitvoering van krachtens het Verdrag tot oprichting van
      de Europese Economische Gemeenschap vastgestelde verplichtingen inzake onderwerpen waarop deze wet van toepassing
      is, regelen worden gesteld waarbij kan worden afgeweken van de bepalingen van deze wet.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel49
  - number: '50.1'
    text: |-
      Een voordracht tot vaststelling, wijziging of intrekking van een algemene maatregel van bestuur, bedoeld in
      de [artikelen 11][ref1], [20][ref2], [23][ref3], [28][ref4], [38][ref5], [39][ref6], [41][ref7], [42][ref8],
      [43][ref9] en [49][ref10], wordt Ons gedaan door Onze Minister in overeenstemming met Onze Minister van
      Welzijn, Volksgezondheid en Cultuur en, voor zover het een algemene maatregel van bestuur, bedoeld in de
      [artikelen 23][ref11], [38][ref12], [42][ref13] en [43][ref14], betreft, na overleg met Onze Minister van Sociale
      Zaken en Werkgelegenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0003818#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0003818#Artikel28
      [ref5]: https://wetten.overheid.nl/BWBR0003818#Artikel38
      [ref6]: https://wetten.overheid.nl/BWBR0003818#Artikel39
      [ref7]: https://wetten.overheid.nl/BWBR0003818#Artikel41
      [ref8]: https://wetten.overheid.nl/BWBR0003818#Artikel42
      [ref9]: https://wetten.overheid.nl/BWBR0003818#Artikel43
      [ref10]: https://wetten.overheid.nl/BWBR0003818#Artikel49
      [ref11]: https://wetten.overheid.nl/BWBR0003818#Artikel23
      [ref12]: https://wetten.overheid.nl/BWBR0003818#Artikel38
      [ref13]: https://wetten.overheid.nl/BWBR0003818#Artikel42
      [ref14]: https://wetten.overheid.nl/BWBR0003818#Artikel43
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '11'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003818
        artikel: '20'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003818
        artikel: '23'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0003818
        artikel: '28'
        hoofdstuk: III
      - id: ref5
        bwb_id: BWBR0003818
        artikel: '38'
        hoofdstuk: VI
      - id: ref6
        bwb_id: BWBR0003818
        artikel: '39'
        hoofdstuk: VII
      - id: ref7
        bwb_id: BWBR0003818
        artikel: '41'
        hoofdstuk: VII
      - id: ref8
        bwb_id: BWBR0003818
        artikel: '42'
        hoofdstuk: VII
      - id: ref9
        bwb_id: BWBR0003818
        artikel: '43'
        hoofdstuk: VII
      - id: ref10
        bwb_id: BWBR0003818
        artikel: '49'
        hoofdstuk: VII
      - id: ref11
        bwb_id: BWBR0003818
        artikel: '23'
        hoofdstuk: III
      - id: ref12
        bwb_id: BWBR0003818
        artikel: '38'
        hoofdstuk: VI
      - id: ref13
        bwb_id: BWBR0003818
        artikel: '42'
        hoofdstuk: VII
      - id: ref14
        bwb_id: BWBR0003818
        artikel: '43'
        hoofdstuk: VII
  - number: '50.2'
    text: |-
      Onverminderd het bepaalde in het eerste lid wordt een voordracht tot vaststelling, wijziging of intrekking van een
      algemene maatregel van bestuur, bedoeld in de [artikelen 42][ref1] en [43][ref2], voor zover deze maatregel van
      toepassing is op instellingen van wetenschap of onderzoek, Ons gedaan in overeenstemming met Onze Minister wie het
      mede aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel43
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '42'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0003818
        artikel: '43'
        hoofdstuk: VII
  - number: '52.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister, in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport, aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel52
  - number: '52.2'
    text: |-
      De in het eerste lid bedoelde ambtenaren die in de uitoefening van hun taak kennis bekomen van een tuchtvergrijp
      als bedoeld in de [artikelen 14][ref1] en [15 van de Wet op de uitoefening van de diergeneeskunde 1990][ref2], doen
      daarvan onverwijld mededeling aan de krachtens [artikel 29, eerste lid, van die wet][ref3] aangewezen ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0004730#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0004730#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0003818#Artikel29
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0004730
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0004730
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0003818
        artikel: '29'
        hoofdstuk: IV
  - number: '52.3'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel52
  - number: '53'
    text: |-
      De toezichthouder is bevoegd, met medeneming van de benodigde apparatuur, een woning binnen te treden zonder
      toestemming van de bewoner.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel53
  - number: '56.1'
    text: |-
      De in [artikel 52][ref1] bedoelde ambtenaren alsmede de opsporingsambtenaren, die een monster van een
      diergeneesmiddel of gemedicineerd voeder nemen, verpakken en verzegelen dit ter plaatse.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel52
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '52'
        hoofdstuk: VIII
  - number: '57.1'
    text: |-
      De ambtenaren, bedoeld in [artikel 56, eerste lid][ref1], die een monster hebben genomen, stellen dit in handen van
      de instelling die voor onderzoek daarvan door Onze Minister is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel56
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '56'
        hoofdstuk: VIII
  - number: '57.2'
    text: Het monster wordt zo spoedig mogelijk door de aangewezen instelling onderzocht.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel57
  - number: '58.1'
    text: |-
      Diergeneesmiddelen worden geacht te zijn geregistreerd in de zin van deze wet gedurende de eerste twaalf maanden na
      de inwerkingtreding van [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel2
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '2'
        hoofdstuk: II
  - number: '58.2'
    text: |-
      Voor een diergeneesmiddel waarvoor binnen de in het eerste lid gestelde termijn een aanvraag tot registratie op
      de krachtens [artikel 3, tweede lid][ref1], voorgeschreven wijze is ingediend, blijft de registratie ingevolge het
      eerste lid ook na het verstrijken van de aldaar gestelde termijn van kracht totdat de beslissing op de aanvraag
      onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel3
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '3'
        hoofdstuk: II
  - number: '58.3'
    text: |-
      Met het oog op een geleidelijke toepassing van de bepalingen van hoofdstuk II op de ingevolge het tweede lid
      geregistreerde diergeneesmiddelen kan Onze Minister regelen stellen. Daarbij kan worden afgeweken van de bepalingen
      van [hoofdstuk II][ref1] en kan de toepassing van één of meer bepalingen van dat hoofdstuk op de ingevolge het
      tweede lid geregistreerde diergeneesmiddelen worden uitgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0003818
        hoofdstuk: II
  - number: '59.1'
    text: |-
      Een partij van een serum, entstof of biologisch diagnosticum wordt geacht te zijn goedgekeurd in de zin van deze
      wet gedurende de eerste zes maanden na inwerkingtreding van de [artikelen 2][ref1] en [14][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel14
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '2'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003818
        artikel: '14'
        hoofdstuk: II
  - number: '59.2'
    text: |-
      Indien binnen de in het eerste lid genoemde termijn op de krachtens [artikel 3, tweede lid][ref1], voorgeschreven
      wijze voor een serum, entstof of biologisch diagnosticum registratie is aangevraagd, worden de partijen daarvan
      ook na het verstrijken van genoemde termijn geacht te zijn goedgekeurd totdat op de aanvraag tot registratie
      onherroepelijk is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel3
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '3'
        hoofdstuk: II
  - number: '60.1'
    text: |-
      Degenen die diergeneesmiddelen of gemedicineerde voeders bereiden, verpakken, etiketteren of afleveren worden
      geacht in het bezit te zijn van de daarvoor ingevolge deze wet vereiste vergunningen gedurende de eerste zes
      maanden na de inwerkingtreding van [artikel 21][ref1], onderscheidenlijk [33 van deze wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel33
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003818
        artikel: '33'
        hoofdstuk: V
  - number: '60.2'
    text: |-
      Zij die binnen de in het eerste lid gestelde termijn een aanvraag voor een vergunning op de krachtens deze wet
      voorgeschreven wijze hebben ingediend, worden geacht ook na het verstrijken van de aldaar genoemde termijn in het
      bezit van de vergunning te zijn totdat de beslissing op de aanvraag onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel60
  - number: '61.1'
    text: |-
      De Tuberculinewet (*Stb.* 1951, 133) en de Wet van 1 augustus 1964, houdende regelen met betrekking tot de handel
      in antibiotica, chemotherapeutica, hormoonpreparaten en thyreostatica, bestemd of mede bestemd voor aanwending bij
      dieren (*Stb.* 363), worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel61
  - number: '61.4'
    text: |-
      Ten aanzien van zaken betreffende overtredingen van ingevolge het eerste, tweede of derde lid ingetrokken dan wel
      gewijzigde voorschriften die op het tijdstip van intrekking onderscheidenlijk wijziging bij de tot dat tijdstip
      bevoegde rechter aanhangig waren blijft deze rechter bevoegd. Ook in hoger beroep dat in de zaken bedoeld in de
      vorige volzin wordt ingesteld blijft de rechter bevoegd die tot het daar bedoelde tijdstip bevoegd was van dat
      beroep kennis te nemen.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel61
  - number: '61.5'
    text: |-
      De in het vierde lid bedoelde zaken worden, onverminderd
      [artikel 1, tweede lid, van het Wetboek van Strafrecht][ref1], afgedaan volgens de tot het in het vierde lid
      bedoelde tijdstip geldende regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel1
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '1'
  - number: '62'
    text: |-
      Zolang artikel 1 van het bij Koninklijke Boodschap van 26 oktober 1982 aan de Tweede Kamer der Staten-Generaal
      aangeboden voorstel voor een [Wet op de uitoefening van de diergeneeskunde][ref1] (nr. 17 646) nog geen kracht
      van wet heeft gekregen, wordt voor de toepassing van deze wet en de daarop berustende bepalingen verstaan onder
      "dierenarts": degene die ingevolge de Wet op de uitoefening van de diergeneeskunst (*Stb.* 1954, 372) tot de
      uitoefening der diergeneeskunde is toegelaten en van dat recht daadwerkelijk gebruik maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0004730
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0004730
  - number: '63'
    text: |-
      Deze wet is niet van toepassing op substanties voor zover daaromtrent regelen zijn of worden gesteld bij of
      krachtens de [Bestrijdingsmiddelenwet 1962][ref1] (*Stb.* 288).


      [ref1]: https://wetten.overheid.nl/BWBR0002380
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0002380
  - number: '65.1'
    text: 'Deze wet kan worden aangehaald als: Diergeneesmiddelenwet.'
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel65
  - number: '65.2'
    text: |-
      Zij treedt in werking op een door Ons te bepalen tijdstip dat voor de verschillende artikelen of onderdelen van
      artikelen verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003818/2000-01-01#Artikel65
