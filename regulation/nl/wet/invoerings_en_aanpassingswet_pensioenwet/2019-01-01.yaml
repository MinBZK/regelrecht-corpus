  - number: '21.1'
    text: |-
      [Artikel 35 van de Pensioenwet][ref1] geldt niet indien op de datum van inwerkingtreding van genoemd artikel in het
      kader van een pensioenregeling geen verwerving van pensioenaanspraken meer plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel35
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel21
    references:
