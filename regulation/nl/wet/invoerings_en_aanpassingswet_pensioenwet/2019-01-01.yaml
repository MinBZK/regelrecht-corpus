        bwb_id: BWBR0020809
        artikel: '10'
  - number: '22.4'
    text: |-
      Na de datum van inwerkingtreding van [artikel 49 van de Wet verplichte beroepspensioenregeling][ref1],
      zoals dat komt te luiden na de datum van inwerkingtreding van deze wet, wordt door de pensioenuitvoerder
      bij de eerste informatieverstrekking op grond van genoemd artikel na de datum van inwerkingtreding van
      [dat artikel][ref2] aan de deelnemer informatie verstrekt over het karakter van de pensioenregeling, bedoeld in
      [artikel 28 van de Wet verplichte beroepspensioenregeling][ref3], zoals dat komt te luiden na inwerkingtreding van
      deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel28
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel22
