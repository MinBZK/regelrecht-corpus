        artikel: 71a
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '204'
  - number: '59.1'
    text: |-
      Een ontheffing die is verleend van de [artikelen 3][ref1], [5, eerste lid][ref2], en
      [8b van de Pensioen- en spaarfondsenwet][ref3] op grond van [artikel 29 van de Pensioen- en spaarfondsenwet][ref4]
      vervalt een jaar na de datum van inwerkingtreding van [artikel 1 van de Pensioenwet][ref5].


