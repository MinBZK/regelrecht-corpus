        artikel: '20'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '210'
  - number: '58.2'
    text: |-
      Vanaf de datum van inwerkingtreding van deze wet vormt het register, bedoeld
      in [artikel 71a van de Wet verplichte beroepspensioenregeling][ref1], zoals dit
      luidde tot de datum van inwerkingtreding van deze wet, het register, bedoeld in
      [artikel 204 van de Wet verplichte beroepspensioenregeling][ref2], zoals deze luidt na inwerkingtreding van deze
      wet.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel71a
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel204
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel58
