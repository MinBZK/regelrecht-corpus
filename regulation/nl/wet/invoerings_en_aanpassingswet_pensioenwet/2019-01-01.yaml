        bwb_id: BWBR0018831
        artikel: '53'
  - number: '22.11'
    text: |-
      [Artikel 43 van de Pensioenwet][ref1] is van toepassing op degenen die na de datum van inwerkingtreding van genoemd
      artikel pensioengerechtigd geworden zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel43
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '43'
  - number: '22.12'
    text: |-
      [Artikel 54 van de Wet verplichte beroepspensioenregeling][ref1], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, is van toepassing op degenen die na de datum van inwerkingtreding van genoemd
      artikel pensioengerechtigd geworden zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel54
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '54'
  - number: '23.1'
    text: |-
      [Artikel 52 van de Pensioenwet][ref1] geldt met ingang van de datum van inwerkingtreding van genoemd artikel
      ten aanzien van de voor en na de datum van inwerkingtreding van genoemd artikel verworven en nog te verwerven
      pensioenaanspraken indien en zolang de deelnemer of de gewezen deelnemer beleggingsvrijheid heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel52
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '52'
  - number: '23.2'
    text: |-
      [Artikel 52 van de Pensioenwet][ref1] is in het eerste jaar na inwerkingtreding van genoemd artikel niet van
      toepassing indien een werkgever de pensioenregeling voor de datum van inwerkingtreding van genoemd artikel bij een
      verzekeraar heeft ondergebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel52
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '52'
  - number: '23.3'
    text: |-
      Op degene die gewezen deelnemer is geworden voor de datum van inwerkingtreding van
      [artikel 52, tweede lid, van de Pensioenwet][ref1], is genoemd artikel van toepassing indien zijn adres bij de
      pensioenuitvoerder bekend is of hij zich bij de pensioenuitvoerder heeft gemeld.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel52
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '52'
  - number: '23.4'
    text: |-
      [Artikel 63 van de Wet verplichte beroepspensioenregeling][ref1], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, geldt met ingang van de datum van inwerkingtreding van genoemd artikel ten
      aanzien van de voor en na de datum van inwerkingtreding van genoemd artikel verworven en nog te verwerven
      pensioenaanspraken indien en zolang de deelnemer of de gewezen deelnemer beleggingsvrijheid heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel63
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '63'
  - number: '23.5'
    text: |-
      [Artikel 63 van de Wet verplichte beroepspensioenregeling][ref1], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, is in het eerste jaar na inwerkingtreding van genoemd artikel niet van toepassing
      indien de beroepspensioenvereniging de pensioenregeling voor de datum van inwerkingtreding van genoemd artikel bij
      een verzekeraar heeft ondergebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel63
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '63'
  - number: '23.6'
    text: |-
      Op degene die gewezen deelnemer is geworden voor de datum van inwerkingtreding van
      [artikel 63, tweede lid, van de Wet verplichte beroepspensioenregeling][ref1], zoals dat komt te luiden na de datum
      van inwerkingtreding van deze wet, is genoemd artikel van toepassing indien zijn adres bij de pensioenuitvoerder
      bekend is of hij zich bij de pensioenuitvoerder heeft gemeld.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel63
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '63'
  - number: '24.1'
    text: |-
      Indien een verzekeraar op de peildatum een vrijwillige voortzetting uitvoert die niet overeenkomstig
      [artikel 54 van de Pensioenwet][ref1] in de tijd beperkt wordt, kan de verzekeraar deze voortzetting voor de
      betreffende deelnemer blijven uitvoeren als pensioenregeling in de zin van de [Pensioenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0020809
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '54'
      - id: ref2
        bwb_id: BWBR0020809
  - number: '24.2'
    text: |-
      Indien een verzekeraar op de peildatum een vrijwillige voortzetting uitvoert die niet overeenkomstig
      [artikel 65 van de Wet verplichte beroepspensioenregeling][ref1], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, in de tijd beperkt wordt, kan de verzekeraar deze voortzetting voor de betreffende
      deelnemer blijven uitvoeren als pensioenregeling in de zin van de [Wet verplichte beroepspensioenregeling][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0018831
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '65'
      - id: ref2
        bwb_id: BWBR0018831
  - number: 24a.1
    text: |-
      [Artikel 55, vijfde lid, van de Pensioenwet][ref1] is van toepassing indien de beëindiging van de deelneming plaats
      vindt na de datum van inwerkingtreding van genoemd artikellid.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel55
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '55'
  - number: 24a.2
    text: |-
      [Artikel 66, vijfde lid, van de Wet verplichte beroepspensioenregeling][ref1], zoals dat komt te luiden na de datum
      van inwerkingtreding van deze wet, is van toepassing indien de beëindiging van de deelneming plaats vindt na de
      datum van inwerkingtreding van genoemd artikellid.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel66
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '66'
  - number: 24a.3
    text: |-
      [Artikel 56, van de Pensioenwet][ref1] is van toepassing indien het opnemen van onbetaald verlof plaats vindt na de
      datum van inwerkingtreding van genoemd artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel56
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '56'
  - number: 24a.4
    text: |-
      [Artikel 67 van de Wet verplichte beroepspensioenregeling][ref1], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, is van toepassing indien het opnemen van onbetaald verlof plaats vindt na de datum
      van inwerkingtreding van genoemd artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel67
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '67'
  - number: '25.1'
    text: |-
      [Artikel 57 van de Pensioenwet][ref1] is van toepassing indien na de datum van inwerkingtreding van genoemd artikel
      een partnerrelatie van een deelnemer of een gewezen deelnemer eindigt door scheiding.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel57
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '57'
  - number: '25.2'
    text: |-
      In afwijking van het eerste lid is [artikel 57 van de Pensioenwet][ref1] niet van toepassing indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel57
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '57'
  - number: 25.2.a
    text: |-
      de partnerrelatie van een gewezen deelnemer met een partner in de zin van de pensioenovereenkomst eindigt na de
      datum van inwerkingtreding van genoemd artikel;
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel25
  - number: 25.2.b
    text: de gewezen deelnemer voor de datum van inwerkingtreding van genoemd artikel al gewezen deelnemer was geworden; en
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel25
  - number: 25.2.c
    text: |-
      de pensioenovereenkomst ten tijde van de datum van inwerkingtreding van genoemd artikel niet voorziet in een
      bijzonder partnerpensioen.
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel25
  - number: '25.3'
    text: |-
      [Artikel 68 van de Wet verplichte beroepspensioenregeling][ref1], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, is van toepassing indien na de datum van inwerkingtreding van genoemd artikel een
      partnerrelatie van een deelnemer of een gewezen deelnemer eindigt door scheiding.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel68
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '68'
  - number: '25.4'
    text: |-
      In afwijking van het derde lid is [artikel 68 van de Wet verplichte beroepspensioenregeling][ref1], zoals dat komt
      te luiden na de datum van inwerkingtreding van deze wet, niet van toepassing indien:


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel68
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '68'
  - number: 25.4.a
    text: |-
      de partnerrelatie van een gewezen deelnemer met een partner in de zin van de pensioenregeling eindigt na de datum
      van inwerkingtreding van genoemd artikel;
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel25
  - number: 25.4.b
    text: de gewezen deelnemer voor de datum van inwerkingtreding van genoemd artikel al gewezen deelnemer was geworden; en
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel25
  - number: 25.4.c
    text: |-
      de pensioenregeling ten tijde van de datum van inwerkingtreding van genoemd artikel niet voorziet in een bijzonder
      partnerpensioen.
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel25
  - number: 25a.1
    text: |-
      Tot de datum van inwerkingtreding van [artikel 58 van de Pensioenwet][ref1] blijven, in afwijking van
      [artikel 2][ref2], de [artikelen 8, vijfde en zesde lid, van de Pensioen- en spaarfondsenwet][ref3] en
      [9, vierde en vijfde lid, van de Regelen verzekeringsovereenkomsten Pensioen- en spaarfondsenwet][ref4] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0020828#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002089#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0004195#Artikel9
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '58'
      - id: ref2
        bwb_id: BWBR0020828
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0002089
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0004195
        artikel: '9'
  - number: 25a.2
    text: |-
      [Artikel 58 van de Pensioenwet][ref1] is niet van toepassing op meeverzekerde stijgingen voor de datum van
      inwerkingtreding van genoemd artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel58
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '58'
  - number: 25a.3
    text: |-
      Tot de datum van inwerkingtreding van [artikel 69 van de Wet verplichte beroepspensioenregeling][ref1],
      zoals dat komt te luiden na de datum van inwerkingtreding van deze wet, blijven de [artikelen 44][ref2] en
      [45, van de Wet verplichte beroepspensioenregeling][ref3], zoals deze luiden op de peildatum, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel45
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '69'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '44'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: '45'
  - number: 25a.4
    text: |-
      [Artikel 69 van de Wet verplichte beroepspensioenregeling][ref1], zoals dat komt te luiden na de datum
      van inwerkingtreding van deze wet, is niet van toepassing op meeverzekerde stijgingen voor de datum van
      inwerkingtreding van genoemd artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel69
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '69'
  - number: 25a.3
    text: |-
      [Artikel 58 van de Pensioenwet][ref1] is niet van toepassing op meeverzekerde stijgingen na de datum van
      inwerkingtreding van [genoemd artikel][ref2], voor zover de meeverzekerde stijging betrekking heeft op een
      premievrije voortzetting en het recht op de premievrije voortzetting is ontstaan voor de datum van inwerkingtreding
      van [genoemd artikel][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel58
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '58'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '58'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '58'
  - number: '26.1'
    text: |-
      [Artikel 61 van de Pensioenwet][ref1] is van toepassing op pensioenaanspraken die zijn opgebouwd na de datum van
      inwerkingtreding van genoemd artikel, tenzij in de pensioenovereenkomst is overeengekomen dat dit keuzerecht ook
      betrekking heeft op pensioenaanspraken die voor de datum van inwerkingtreding van genoemd artikel zijn opgebouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel61
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '61'
  - number: '26.2'
    text: |-
      [Artikel 73 van de Wet verplichte beroepspensioenregeling][ref1], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, is van toepassing op pensioenaanspraken die zijn opgebouwd na de datum van
      inwerkingtreding van genoemd artikel, tenzij in de pensioenregeling is overeengekomen dat dit keuzerecht ook
      betrekking heeft op pensioenaanspraken die voor de datum van inwerkingtreding van genoemd artikel zijn opgebouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel73
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '73'
  - number: '27.1'
    text: |-
      [Artikel 64 van de Pensioenwet][ref1] is van toepassing indien vervreemding of een andere handeling als bedoeld in
      dat artikel plaats vindt na de datum van inwerkingtreding van genoemd artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel64
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '64'
  - number: '27.2'
    text: |-
      [Artikel 76 van de Wet verplichte beroepspensioenregeling][ref1], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, is van toepassing indien vervreemding of een andere handeling als bedoeld in dat
      artikel plaats vindt na de datum van inwerkingtreding van genoemd artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel76
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '76'
  - number: '29.1'
    text: |-
      [Artikel 67 van de Pensioenwet][ref1] is van toepassing indien het partnerpensioen ingaat na de datum van
      inwerkingtreding van genoemd artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel67
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '67'
  - number: '29.2'
    text: |-
      Indien het partnerpensioen is ingegaan voor de datum van inwerkingtreding van
      [artikel 67 van de Pensioenwet][ref1], heeft de pensioenuitvoerder het recht om overeenkomstig genoemd artikel het
      partnerpensioen af te kopen indien de uitkering van het partnerpensioen op jaarbasis, getoetst op het tijdstip van
      ingang minder bedraagt dan het op grond van [artikel 66 van de Pensioenwet][ref2] vastgestelde bedrag per jaar en
      de partner hiermee instemt.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel66
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '67'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '66'
  - number: '29.3'
    text: |-
      [Artikel 79 van de Wet verplichte beroepspensioenregeling][ref1], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, is van toepassing indien het partnerpensioen ingaat na de datum van inwerkingtreding
      van genoemd artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel79
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '79'
  - number: '29.4'
    text: |-
      Indien het partnerpensioen is ingegaan voor de datum van inwerkingtreding van
      [artikel 79 van de Wet verplichte beroepspensioenregeling][ref1], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, heeft de pensioenuitvoerder het recht om overeenkomstig genoemd artikel het
      partnerpensioen af te kopen indien de uitkering van het partnerpensioen op jaarbasis, getoetst op het tijdstip
      van ingang minder bedraagt dan het op grond van [artikel 78 van de Wet verplichte beroepspensioenregeling][ref2],
      zoals dat komt te luiden na de datum van inwerkingtreding van deze wet, vastgestelde bedrag per jaar en de partner
      hiermee instemt.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel78
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '79'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '78'
  - number: '30.1'
    text: |-
      [Artikel 68 van de Pensioenwet][ref1] is van toepassing indien de aanspraak op bijzonder partnerpensioen op grond
      van [artikel 57 van de Pensioenwet][ref2] ontstaat als gevolg van een scheiding na de datum van inwerkingtreding
      van eerstgenoemd artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel57
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '68'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '57'
  - number: '30.2'
    text: |-
      Indien de scheiding plaatsvindt voor de datum van inwerkingtreding van [artikel 68 van de Pensioenwet][ref1], heeft
      de pensioenuitvoerder het recht om overeenkomstig genoemd artikel het bijzonder partnerpensioen af te kopen, indien
      de uitkering van het partnerpensioen op jaarbasis, getoetst op het tijdstip van de scheiding, minder bedraagt dan
      het op grond van [artikel 66 van de Pensioenwet][ref2] vastgestelde bedrag per jaar en de gewezen partner hiermee
      instemt.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel66
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '68'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '66'
  - number: '30.3'
    text: |-
      [Artikel 80 van de Wet verplichte beroepspensioenregeling][ref1], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, is van toepassing indien de aanspraak op bijzonder partnerpensioen op grond
      van [artikel 68 van de Wet verplichte beroepspensioenregeling][ref2], zoals dat komt te luiden na de datum
      van inwerkingtreding van deze wet, ontstaat als gevolg van een scheiding na de datum van inwerkingtreding van
      eerstgenoemd artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel68
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '80'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '68'
  - number: '30.4'
    text: |-
      Indien de scheiding plaatsvindt voor de datum van inwerkingtreding van
      [artikel 80 van de Wet verplichte beroepspensioenregeling][ref1], zoals dat komt te luiden na de
      datum van inwerkingtreding van deze wet, heeft de pensioenuitvoerder het recht om overeenkomstig
      genoemd artikel het bijzonder partnerpensioen af te kopen, indien de uitkering van het partnerpensioen
      op jaarbasis, getoetst op het tijdstip van de scheiding, minder bedraagt dan het op grond van
      [artikel 78 van de Wet verplichte beroepspensioenregeling][ref2], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, vastgestelde bedrag per jaar en de gewezen partner hiermee instemt.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel78
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '80'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '78'
  - number: '32.1'
    text: |-
      De [artikelen 71 tot en met 74 van de Pensioenwet][ref1] zijn van toepassing indien de verwerving van
      pensioenaanspraken, bedoeld in [artikel 71, derde lid, van de Pensioenwet][ref2] op grond van de pensioenregeling
      van een nieuwe werkgever begint na de datum van inwerkingtreding van laatstgenoemd artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel71
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '71'
  - number: '32.2'
    text: |-
      In afwijking van het eerste lid geldt dat wanneer de ontvangende pensioenuitvoerder de uitvoerder is van een
      beroepspensioenregeling de [artikelen 71 tot en met 74 van de Pensioenwet][ref1] van toepassing zijn wanneer
      de beëindiging van de dienstbetrekking dan wel de beëindiging van de deelneming plaatsvindt na de datum van
      inwerkingtreding van [artikel 71 van de Pensioenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel71
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '71'
  - number: '32.3'
    text: |-
      Indien op grond van het tweede lid geen plicht tot waardeoverdracht bestaat,
      geldt een bevoegdheid tot waardeoverdracht mits wordt voldaan aan de in
      [artikel 71, eerste lid, onderdeel a, b en c en vierde lid, van de Pensioenwet][ref1] genoemde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0020809
