        bwb_id: BWBR0002089
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '175'
  - number: '55.2'
    text: |-
      Een bestuurlijke boete die is opgelegd terzake van overtreding van een voorschrift gesteld bij
      of krachtens de [Pensioen- en spaarfondsenwet][ref1] wordt na de datum van inwerkingtreding
      van [artikel 1 van de Pensioenwet][ref2] aangemerkt als een bestuurlijke boete als bedoeld in
      [artikel 176 van laatstgenoemde wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002089
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel176
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0002089
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '176'
  - number: '55.3'
    text: |-
      De toezichthouder kan na de datum van inwerkingtreding van [artikel 1 van de Pensioenwet][ref1] tot drie jaar na de
      dag waarop een overtreding is begaan een last onder dwangsom of een boete opleggen terzake van overtreding van een
      voorschrift gesteld bij of krachtens de [Pensioen- en spaarfondsenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002089
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002089
  - number: '55.4'
    text: |-
      Een last onder dwangsom die is opgelegd terzake van overtreding van een voorschrift gesteld bij of krachtens
      de [Wet verplichte beroepspensioenregeling][ref1], zoals die luidde voor de datum van inwerkingtreding van deze
      wet, wordt na de datum van inwerkingtreding van deze wet aangemerkt als een last onder dwangsom als bedoeld in
      [artikel 170 van de Wet verplichte beroepspensioenregeling][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018831
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel170
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel55
