        bwb_id: BWBR0018831
        artikel: '28'
  - number: '22.5'
    text: |-
      [Artikel 40 van de Pensioenwet][ref1] is van toepassing op degenen die na de datum van inwerkingtreding van genoemd
      artikel gewezen deelnemer zijn geworden en de gewezen deelnemers die zich bij de pensioenuitvoerder hebben gemeld
      met het verzoek om hen de in genoemd artikel bedoelde informatie te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel40
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '40'
  - number: '22.6'
    text: |-
      [Artikel 51 van de Wet verplichte beroepspensioenregeling][ref1], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, is van toepassing op degenen die na de datum van inwerkingtreding van genoemd
      artikel gewezen deelnemer zijn geworden en de gewezen deelnemers die zich bij de pensioenuitvoerder hebben gemeld
      met het verzoek om hen de in genoemd artikel bedoelde informatie te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel51
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '51'
  - number: '22.7'
    text: |-
      [Artikel 42 van de Pensioenwet][ref1] is van toepassing op degenen van wie de datum van scheiding ligt na de datum
      van inwerkingtreding van genoemd artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel42
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '42'
  - number: '22.8'
    text: |-
      [Artikel 53 van de Wet verplichte beroepspensioenregeling][ref1], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, is van toepassing op degenen van wie de datum van scheiding ligt na de datum van
      inwerkingtreding van genoemd artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel53
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '53'
  - number: '22.9'
    text: |-
      Ten aanzien van degenen van wie de datum van scheiding voor de datum van inwerkingtreding van
      [artikel 42 van de Pensioenwet][ref1] ligt, geldt de in genoemd artikel opgenomen verplichting van de
      pensioenuitvoerder alleen ten aanzien van degenen die zich bij de pensioenuitvoerder hebben gemeld met het verzoek
      om hen de in genoemd artikel bedoelde informatie te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel42
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '42'
  - number: '22.10'
    text: |-
      Ten aanzien van degenen van wie de datum van scheiding voor de datum van inwerkingtreding van
      [artikel 53 van de Wet verplichte beroepspensioenregeling][ref1], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, ligt, geldt de in genoemd artikel opgenomen verplichting van de pensioenuitvoerder
      alleen ten aanzien van degenen die zich bij de pensioenuitvoerder hebben gemeld met het verzoek om hen de in
      genoemd artikel bedoelde informatie te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel53
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel22
