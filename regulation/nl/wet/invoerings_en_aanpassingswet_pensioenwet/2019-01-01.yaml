        artikel: '38'
  - number: 20a.1
    text: |-
      Tot de datum van inwerkingtreding van [artikel 29 van de Pensioenwet][ref1] blijven, in afwijking
      van [artikel 2][ref2], de [artikelen 3a, vierde lid, van de Pensioen- en spaarfondsenwet][ref3] en
      [12 van de Regelen verzekeringsovereenkomsten Pensioen- en spaarfondsenwet][ref4] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0020828#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002089#Artikel3a
      [ref4]: https://wetten.overheid.nl/BWBR0004195#Artikel12
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel20a
