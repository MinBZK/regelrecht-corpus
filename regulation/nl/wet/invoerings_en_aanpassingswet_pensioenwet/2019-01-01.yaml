        artikel: '183'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '186'
  - number: '57.1'
    text: |-
      Een vergunning als bedoeld in [artikel 32i van de Pensioen- en spaarfondsenwet][ref1] die is verleend op grond
      van [artikel 32j van de Pensioen- en spaarfondsenwet][ref2], berust vanaf de datum van inwerkingtreding van de
      [Pensioenwet][ref3] op [artikel 192 van laatstgenoemde wet][ref4].


