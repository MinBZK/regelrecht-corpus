        bwb_id: BWBR0002089
        artikel: 23m
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '173'
  - number: '54.2'
    text: |-
      Een bewindvoerder die is aangesteld door de ondernemingskamer van het gerechtshof Amsterdam op grond van
      [artikel 83 van de Wet verplichte beroepspensioenregeling][ref1], zoals die wet luidde tot de datum van
      inwerkingtreding van deze wet, wordt na de datum van inwerkingtreding van deze wet aangemerkt als een bewindvoerder
      die is aangesteld op grond van [artikel 168 van de Wet verplichte beroepspensioenregeling][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel168
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel54
