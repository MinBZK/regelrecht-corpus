  - number: '21.3'
    text: |-
      [Artikel 21 van de Wet verplichte beroepspensioenregeling][ref1], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, geldt niet indien op de datum van inwerkingtreding van genoemd artikel in het kader
