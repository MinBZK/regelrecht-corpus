        artikel: '35'
  - number: '21.2'
    text: |-
      De pensioenuitvoerder is niet verantwoordelijk voor de inhoud van pensioenreglementen voor de datum van
      inwerkingtreding van [artikel 35 van de Pensioenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel35
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel21
