        bwb_id: BWBR0020809
        artikel: '1'
  - number: '1.2'
    text: |-
      De definities van [artikel 1 van de Pensioenwet][ref1] zijn van overeenkomstige
      toepassing op de [artikelen 7][ref2], [8][ref3], [9][ref4], [10][ref5], het
      [eerste lid van de artikelen 11 tot en met 17][ref6], [18][ref7], [20, eerste lid][ref8],
      [21, eerste lid][ref9], [22, derde, vijfde, zevende, negende en elfde lid][ref10], [23, eerste lid][ref11],
      [24, eerste lid][ref12], [24a, eerste lid][ref13], [25, eerste en tweede lid][ref14], [26, eerste lid][ref15],
      [29, eerste en tweede lid][ref16], [30, eerste en tweede lid][ref17], [32, eerste, tweede en derde lid][ref18],
      [33, het eerste lid][ref19] van de [artikelen 35 tot en met 38][ref20], [42, eerste lid][ref21],
      [44, eerste lid][ref22], [48][ref23], [53, tweede lid][ref24], [59, derde en vierde lid][ref25], [63][ref26],
      [64][ref27] en [66][ref28] van deze wet.


