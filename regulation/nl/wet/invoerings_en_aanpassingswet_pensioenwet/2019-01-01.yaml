  - number: '20.1'
    text: |-
      De in [artikel 28 van de Pensioenwet][ref1] opgenomen informatieverplichting van een pensioenfonds jegens gewezen
      deelnemers heeft uitsluitend betrekking op degenen die na de datum van inwerkingtreding van genoemd artikel gewezen
      deelnemer zijn geworden en op de gewezen deelnemers die het pensioenfonds hebben geïnformeerd over hun adres.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel28
