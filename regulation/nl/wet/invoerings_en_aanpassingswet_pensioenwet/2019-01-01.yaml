        artikel: '53'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '84'
  - number: '59.7'
    text: |-
      Een ontheffing die is verleend van
      [artikel 63, eerste tot en met derde lid, van de Wet verplichte beroepspensioenregeling][ref1],
      zoals die luidde voor de datum van inwerkingtreding van deze wet, op grond van
      [artikel 84 van de Wet verplichte beroepspensioenregeling][ref2], zoals die luidde voor de datum van
      inwerkingtreding van deze wet, wordt vanaf de datum van inwerkingtreding van deze wet aangemerkt als
      een ontheffing die is verleend van [artikel 142 van de Wet verplichte beroepspensioenregeling][ref3],
      zoals dat komt te luiden vanaf de datum van inwerkingtreding van deze wet, op grond van
      [artikel 206 van de Wet verplichte beroepspensioenregeling][ref4], zoals dat komt te luiden vanaf de datum van
      inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel84
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel142
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel206
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '63'
      - id: ref2
