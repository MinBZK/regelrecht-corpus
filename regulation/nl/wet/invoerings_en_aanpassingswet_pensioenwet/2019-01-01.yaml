      Een ontheffing die is verleend van [artikel 9b, tweede lid, van de Pensioen- en spaarfondsenwet][ref1] op grond
      van [artikel 29 van de Pensioen- en spaarfondsenwet][ref2] blijft van kracht tot 23 september 2010, tenzij een
      pensioenfonds bijdragen ontvangt van een werkgever uit een andere lidstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel9b
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel29
