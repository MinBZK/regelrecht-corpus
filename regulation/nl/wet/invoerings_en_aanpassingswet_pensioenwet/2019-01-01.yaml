  - number: '2'
    text: |-
      De [Pensioen- en spaarfondsenwet][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002089
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002089
  - number: 2a.1
    text: |-
      Op een verzoek ingediend op grond van de [Pensioen- en spaarfondsenwet][ref1], ten aanzien waarvan op de peildatum
      nog geen beslissing is genomen, blijft, in afwijking van [artikel 2, de Pensioen- en spaarfondsenwet][ref2] van
      toepassing, tenzij in deze wet anders wordt bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002089
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel2
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0002089
      - id: ref2
        bwb_id: BWBR0002089
        artikel: '2'
  - number: 2a.2
    text: |-
      Op een verzoek ingediend op grond van de [Wet verplichte beroepspensioenregeling][ref1], zoals deze
      luidde op de peildatum, ten aanzien waarvan op de peildatum nog geen beslissing is genomen, blijft de
      [Wet verplichte beroepspensioenregeling][ref2], zoals deze luidde op de peildatum, van toepassing, tenzij in deze
      wet anders wordt bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0018831
      [ref2]: https://wetten.overheid.nl/BWBR0018831
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0018831
      - id: ref2
        bwb_id: BWBR0018831
  - number: '3'
    text: |-
      Indien een onderneming die op de peildatum is aangesloten bij een ondernemingspensioenfonds als bedoeld in
      [artikel 1, eerste lid, onderdeel c, van de Pensioen- en spaarfondsenwet][ref1] op de datum van inwerkingtreding
      van [artikel 1 van de Pensioenwet][ref2] geen deel uitmaakt van de groep waaraan dit ondernemingspensioenfonds,
      bedoeld in [artikel 1 van de Pensioenwet][ref3], is verbonden, kan dit ondernemingspensioenfonds blijven optreden
      als pensioenuitvoerder voor deze onderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel1
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '1'
  - number: '4.1'
    text: |-
      Indien een op de peildatum bestaand bedrijfstakpensioenfonds of ondernemingspensioenfonds als bedoeld in
      [artikel 1, eerste lid, onderdeel b onderscheidenlijk c, van de Pensioen- en spaarfondsenwet][ref1] op de datum van
      inwerkingtreding van [artikel 1 van de Pensioenwet][ref2] niet voldoet aan de definitie van pensioenfonds, bedoeld
      in [artikel 1 van de Pensioenwet][ref3], omdat het pensioenfonds slechts ten behoeve van één deelnemer, gewezen
      deelnemer of nabestaande werkzaam is, wordt dit pensioenfonds gelijkgesteld met een pensioenfonds in de zin van
      de [Pensioenwet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0020809
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0020809
  - number: '4.2'
    text: |-
      In afwijking van het eerste lid wordt het in dat lid bedoelde pensioenfonds een jaar na inwerkingtreding van
      [artikel 1 van de Pensioenwet][ref1] gelijkgesteld met een pensioenfonds in de zin van de [Pensioenwet][ref2],
      indien het pensioenfonds werkzaam is ten behoeve van een directeur-grootaandeelhouder waarop
      [artikel 8, eerste en tweede lid][ref3], van deze wet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020809
      [ref3]: https://wetten.overheid.nl/BWBR0020828#Artikel8
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020809
      - id: ref3
        bwb_id: BWBR0020828
        artikel: '8'
        hoofdstuk: '2'
  - number: '5'
    text: |-
      Indien op de peildatum een spaarfonds als bedoeld in [artikel 3 van de Pensioen- en spaarfondsenwet][ref1]
      werkzaam is, blijft in afwijking van [artikel 2][ref2] op dit spaarfonds de [Pensioen- en spaarfondsenwet][ref3]
      van toepassing, met dien verstande dat vanaf een jaar na de datum van inwerkingtreding van
      [artikel 1 van de Pensioenwet][ref4] geen bijdragen meer aan het spaarfonds kunnen worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020828#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002089
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel1
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020828
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0002089
      - id: ref4
        bwb_id: BWBR0020809
        artikel: '1'
  - number: '6.1'
    text: |-
      Indien een pensioen in de zin van de [Pensioen- en spaarfondsenwet][ref1] niet voldoet aan de definitie van
      ouderdoms-, partner-, wezen- of arbeidsongeschiktheidspensioen, bedoeld in [artikel 1 van de Pensioenwet][ref2],
      omdat er geen sprake is van een geldelijke, vastgestelde uitkering, wordt dit pensioen, indien het is verworven in
      de periode tot een jaar na de datum van inwerkingtreding van [artikel 1 van de Pensioenwet][ref3], gelijkgesteld
      met een pensioen in de zin van de [Pensioenwet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002089
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0020809
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002089
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0020809
  - number: '6.2'
    text: |-
      Indien een pensioen in de zin van de [Wet verplichte beroepspensioenregeling][ref1], zoals deze luidde tot
      de datum van inwerkingtreding van deze wet, niet voldoet aan de definitie van ouderdoms-, partner-, wezen- of
      arbeidsongeschiktheidspensioen, bedoeld in [artikel 1 van de Wet verplichte beroepspensioenregeling][ref2],
      zoals dat komt te luiden na de datum van inwerkingtreding van deze wet, omdat er geen sprake is van
      een geldelijke, vastgestelde uitkering, wordt dit pensioen, indien het is verworven in de periode tot
      een jaar na de datum van inwerkingtreding van deze wet gelijkgesteld met een pensioen in de zin van de
      [Wet verplichte beroepspensioenregeling][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0018831
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0018831
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018831
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0018831
  - number: '6.3'
    text: |-
      Indien op de peildatum een arbeidsongeschiktheidspensioen in de zin van de
      [Wet verplichte beroepspensioenregeling][ref1], zoals deze luidde tot de datum van inwerkingtreding
      van deze wet, niet voldoet aan de definitie van arbeidsongeschiktheidspensioen, bedoeld in
      [artikel 1 van de Wet verplichte beroepspensioenregeling][ref2], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, omdat het arbeidsongeschiktheidspensioen is toegekend nadat de arbeidsongeschiktheid
      minder dan 104 weken heeft geduurd, wordt dit arbeidsongeschiktheidspensioen gelijkgesteld met een
      arbeidsongeschiktheidspensioen in de zin van de [Wet verplichte beroepspensioenregeling][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0018831
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0018831
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018831
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0018831
  - number: '7.1'
    text: |-
      Indien een persoon die op de peildatum verbonden is aan een onderneming en pensioenaanspraken verwerft, op
      de datum van inwerkingtreding van [artikel 1 van de Pensioenwet][ref1] geen werknemer is als bedoeld in de
      [Pensioenwet][ref2], wordt hij gelijkgesteld met een werknemer als bedoeld in [die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020809
      [ref3]: https://wetten.overheid.nl/BWBR0020809
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020809
      - id: ref3
        bwb_id: BWBR0020809
  - number: '7.2'
    text: |-
      Het eerste lid is niet van toepassing op de directeur-grootaandeelhouder, bedoeld in de [Pensioenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020809
  - number: '8.1'
    text: |-
      Indien uiterlijk op de peildatum een pensioentoezegging als bedoeld in
      [artikel 2 van de Pensioen- en spaarfondsenwet][ref1] is gedaan aan een directeur-grootaandeelhouder,
      blijft gedurende een jaar na inwerkingtreding van [artikel 1 van de Pensioenwet][ref2], in afwijking van
      [artikel 2, de Pensioen- en spaarfondsenwet][ref3] van toepassing op deze pensioentoezegging.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002089#Artikel2
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0002089
        artikel: '2'
  - number: '8.2'
    text: |-
      De directeur-grootaandeelhouder, bedoeld in het eerste lid, wiens pensioentoezegging een jaar na de datum van
      inwerkingtreding van [artikel 1 van de Pensioenwet][ref1] is ondergebracht bij een pensioenuitvoerder als pensioen
      in de zin van de [Pensioen- en spaarfondsenwet][ref2], wordt gelijkgesteld met een werknemer als bedoeld in de
      [Pensioenwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002089
      [ref3]: https://wetten.overheid.nl/BWBR0020809
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002089
      - id: ref3
        bwb_id: BWBR0020809
  - number: '8.3'
    text: |-
      Indien de pensioentoezegging, bedoeld in het tweede lid, is ondergebracht bij een verzekeraar is er sprake van
      pensioen in de zin van de [Pensioen- en spaarfondsenwet][ref1] indien de directeur-grootaandeelhouder dit als
      zodanig heeft aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002089
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002089
  - number: '8.4'
    text: |-
      De directeur-grootaandeelhouder, bedoeld in het eerste lid, wiens pensioentoezegging
      een jaar na inwerkingtreding van de [Pensioenwet][ref1] overeenkomstig
      [artikel 2, derde lid, onderdeel c, van de Pensioen- en spaarfondsenwet][ref2] niet is ondergebracht bij een
      pensioenuitvoerder wordt niet gelijkgesteld met een werknemer in de zin van de [Pensioenwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020809
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0020809
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020809
      - id: ref2
        bwb_id: BWBR0002089
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0020809
  - number: '8.5'
    text: |-
      Indien de in het vierde lid bedoelde toezegging mede een toezegging omtrent partnerpensioen omvat
      en er uiterlijk een jaar na inwerkingtreding van [artikel 1 van de Pensioenwet][ref1] sprake is
      geweest van een scheiding, blijven, in afwijking van [artikel 2][ref2], de [artikelen 8a][ref3] en
      [8c, tweede lid, van de Pensioen- en spaarfondsenwet][ref4] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020828#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002089#Artikel8a
      [ref4]: https://wetten.overheid.nl/BWBR0002089#Artikel8c
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020828
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0002089
        artikel: 8a
      - id: ref4
        bwb_id: BWBR0002089
        artikel: 8c
  - number: '9'
    text: |-
      Indien uiterlijk op de peildatum een geldelijke, vastgestelde uitkering is overeengekomen voor een gewezen
      werknemer die wordt gedaan bij wijze van inkomensvoorziening bij ouderdom in verband met vervroegde uittreding
      wordt deze gelijkgesteld met een uitkering als bedoeld in [artikel 2, vierde lid, van de Pensioenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel2
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '2'
  - number: '10'
    text: |-
      Indien uiterlijk op de peildatum een geldelijke, vastgestelde uitkering is overeengekomen voor een gewezen
      werknemer die wordt gedaan bij wijze van inkomensvoorziening bij ouderdom en deze uitkering is gebaseerd op een
      regeling die leidt tot uitkeringen vanaf een bepaalde leeftijd aan werknemers die werkzaamheden verrichten die door
      de werkgever als substantieel bezwarend zijn aangemerkt, wordt deze gelijkgesteld met een uitkering als bedoeld in
      [artikel 2, vijfde lid, van de Pensioenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel2
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '2'
  - number: '11.1'
    text: |-
      [Artikel 10 van de Pensioenwet][ref1] is niet van toepassing op pensioenaanspraken die zijn verworven voor de datum
      van inwerkingtreding van genoemd artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel10
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '10'
  - number: '11.2'
    text: |-
      [Artikel 28 van de Wet verplichte beroepspensioenregeling][ref1], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, is niet van toepassing op pensioenaanspraken die zijn verworven voor de datum van
      inwerkingtreding van genoemd artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel28
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '28'
  - number: '12.1'
    text: |-
      [Artikel 11 van de Pensioenwet][ref1] is niet van toepassing op pensioenaanspraken die zijn verworven voor de datum
      van inwerkingtreding van genoemd artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel11
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '11'
  - number: '12.2'
    text: |-
      [Artikel 29 van de Wet verplichte beroepspensioenregeling][ref1], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, is niet van toepassing op pensioenaanspraken die zijn verworven voor de datum van
      inwerkingtreding van genoemd artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel29
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '29'
  - number: '13.1'
    text: |-
      [Artikel 13 van de Pensioenwet][ref1] is niet van toepassing op pensioenaanspraken die zijn verworven voor de datum
      van inwerkingtreding van genoemd artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel13
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '13'
  - number: '13.2'
    text: |-
      [Artikel 30 van de Wet verplichte beroepspensioenregeling][ref1], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, is niet van toepassing op pensioenaanspraken die zijn verworven voor de datum van
      inwerkingtreding van genoemd artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel30
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '30'
  - number: '14.1'
    text: |-
      Werknemers van 21 jaar of ouder die op de peildatum niet in de pensioenregeling van hun werkgever deelnemen, omdat
      zij jonger zijn dan de op basis van de pensioenregeling gehanteerde toegangsleeftijd, verwerven pensioenaanspraken
      vanaf de datum van inwerkingtreding van de [artikelen 8, vijfde lid][ref1], en [14 van de Pensioenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel14
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '14'
  - number: '14.2'
    text: |-
      Beroepsgenoten van 21 jaar of ouder die op de datum van inwerkingtreding van
      [artikel 22 van de Wet verplichte beroepspensioenregeling][ref1], zoals dat komt te luiden na inwerkingtreding van
      deze wet, niet in de pensioenregeling zijn opgenomen, omdat zij jonger zijn dan de op basis van de pensioenregeling
      gehanteerde toetredingsleeftijd, verwerven pensioenaanspraken vanaf de datum van inwerkingtreding van genoemd
      artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel22
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '22'
  - number: '15.1'
    text: |-
      [Artikel 15 van de Pensioenwet][ref1] is niet van toepassing ten aanzien van pensioenaanspraken die zijn verworven
      voor de datum van inwerkingtreding van genoemd artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel15
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '15'
  - number: '15.2'
    text: |-
      [Artikel 31 van de Wet verplichte beroepspensioenregeling][ref1], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, is niet van toepassing op pensioenaanspraken die zijn verworven voor de datum van
      inwerkingtreding van genoemd artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel31
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '31'
  - number: '16.1'
    text: |-
      Indien een pensioenovereenkomst op de datum van inwerkingtreding van [artikel 16 van de Pensioenwet][ref1] voorziet
      in partnerpensioen, waarbij bij de vaststelling van pensioenaanspraken en pensioenrechten op partnerpensioen
      onderscheid gemaakt wordt tussen een echtgenoot en een geregistreerde partner enerzijds en een andere partner in de
      zin van de pensioenovereenkomst anderzijds, hebben wijzigingen in rechten en verplichtingen die ontstaan als gevolg
      van de gelijkstelling, bedoeld in genoemd artikel, uitsluitend betrekking op partnerpensioenaanspraken ten behoeve
      van een partner van degene die op de datum van inwerkingtreding van genoemd artikel deelnemer is.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel16
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '16'
  - number: '16.2'
    text: |-
      Indien een pensioenregeling op de datum van inwerkingtreding van
      [artikel 32 van de Wet verplichte beroepspensioenregeling][ref1], zoals dat komt te luiden na de datum
      van inwerkingtreding van deze wet, voorziet in partnerpensioen, waarbij echter bij de vaststelling van
      pensioenaanspraken en pensioenrechten op partnerpensioen onderscheid gemaakt wordt tussen een echtgenoot en
      een geregistreerde partner enerzijds en een andere partner in de zin van de pensioenregeling anderzijds, hebben
      wijzigingen in rechten en verplichtingen die ontstaan als gevolg van de gelijkstelling, bedoeld in genoemd artikel,
      uitsluitend betrekking op partnerpensioenaanspraken ten behoeve van een partner van degene die op de datum van
      inwerkingtreding van genoemd artikel deelnemer is.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel32
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '32'
  - number: '17.1'
    text: |-
      [Artikel 21, eerste lid, van de Pensioenwet][ref1] is niet van toepassing op pensioenovereenkomsten die zijn
      gesloten voor de datum van inwerkingtreding van genoemd artikellid.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel21
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '21'
  - number: '17.2'
    text: |-
      Tot de datum van inwerkingtreding van [artikel 21, eerste lid, van de Pensioenwet][ref1] blijft, in afwijking
      van [artikel 2][ref2], [artikel 17, eerste lid, van de Pensioen- en spaarfondsenwet][ref3] van toepassing. Is de
      pensioenuitvoerder een verzekeraar dan is [artikel 17, eerste lid, van de Pensioen- en spaarfondsenwet][ref4] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002089#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0002089#Artikel17
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0002089
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0002089
        artikel: '17'
      - id: ref4
        bwb_id: BWBR0002089
        artikel: '17'
  - number: '17.3'
    text: |-
      [Artikel 48, eerste lid, van de Wet verplichte beroepspensioenregeling][ref1], zoals dat komt te luiden na de datum
      van inwerkingtreding van deze wet, is niet van toepassing op pensioenregelingen die zijn gesloten voor de datum van
      inwerkingtreding van genoemd artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel48
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '48'
  - number: '17.4'
    text: |-
      Tot de datum van inwerkingtreding van [artikel 48, eerste lid, van de Wet verplichte beroepspensioenregeling][ref1],
      zoals dat komt te luiden na de datum van inwerkingtreding van deze wet, blijft
      [artikel 25 van de Wet verplichte beroepspensioenregeling][ref2], zoals dit luidde op de peildatum, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel25
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '48'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '25'
  - number: '18.1'
    text: |-
      De in [artikel 23 van de Pensioenwet][ref1] opgenomen verplichting tot het sluiten van een uitvoeringsovereenkomst
      geldt met ingang van een jaar na de datum van inwerkingtreding van [artikel 1 van de Pensioenwet][ref2]
      voor pensioenfondsen en met ingang van twee jaar na de datum van inwerkingtreding van
      [artikel 1 van de Pensioenwet][ref3] voor verzekeraars.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel1
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '1'
  - number: '18.2'
    text: |-
      In afwijking van [artikel 2][ref1] blijft, tot het in het eerste lid bedoelde tijdstip,
      [artikel 3a, eerste lid, van de Pensioen- en spaarfondsenwet][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020828#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel3a
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020828
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0002089
        artikel: 3a
  - number: '18.3'
    text: |-
      De in [artikel 23][ref1] opgenomen verplichting van een werkgever tot onderbrenging geldt niet ten aanzien
      van een pensioentoezegging als bedoeld in de [Pensioen- en spaarfondsenwet][ref2], welke op grond van
      [artikel 2, eerste lid, onderdeel c, en vierde lid, onderdeel c, van de Pensioen- en spaarfondsenwet][ref3] al is
      ondergebracht bij een verzekeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0020828#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0002089
      [ref3]: https://wetten.overheid.nl/BWBR0002089#Artikel2
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020828
        artikel: '23'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0002089
      - id: ref3
        bwb_id: BWBR0002089
        artikel: '2'
  - number: '18.4'
    text: |-
      Ten aanzien van de in het derde lid bedoelde pensioentoezegging is de [Pensioenwet][ref1] van toepassing, met
      uitzondering van de [artikelen 23 tot en met 27][ref2] en [29][ref3], indien na de datum van inwerkingtreding van
      [artikel 1 van de Pensioenwet][ref4] nog verwerving van pensioen plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0020809
      [ref2]: https://wetten.overheid.nl/BWBR0020828#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0020828#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel1
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020809
      - id: ref2
        bwb_id: BWBR0020828
        artikel: '23'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0020828
        artikel: '29'
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0020809
        artikel: '1'
  - number: '18.5'
    text: |-
      Ten aanzien van de in het derde lid bedoelde pensioentoezegging waarbij na de datum van
      inwerkingtreding van de [Pensioenwet][ref1] geen verwerving van pensioen meer plaatsvindt, blijven,
      in afwijking van [artikel 2, de Pensioen- en spaarfondsenwet][ref2] en [hoofdstuk I][ref3] en
      [III van de Regelen verzekeringsovereenkomsten Pensioen- en spaarfondsenwet][ref4] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020809
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0004195#HoofdstukI
      [ref4]: https://wetten.overheid.nl/BWBR0004195#HoofdstukIII
