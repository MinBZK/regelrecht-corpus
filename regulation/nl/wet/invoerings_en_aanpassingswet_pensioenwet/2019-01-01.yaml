        bwb_id: BWBR0002089
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0020809
  - number: '58.1'
    text: |-
      Vanaf de datum van inwerkingtreding van deze wet vormt het register, bedoeld in
      [artikel 20, tweede lid, van de Pensioen- en spaarfondsenwet][ref1] het register, bedoeld in
      [artikel 210 van de Pensioenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel210
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel58
