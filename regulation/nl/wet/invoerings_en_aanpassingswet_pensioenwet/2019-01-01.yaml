      Een ontheffing die is verleend van
      [artikel 10b, eerste tot en met derde lid, van de Pensioen- en spaarfondsenwet][ref1] op grond van
      [artikel 29 van de Pensioen- en spaarfondsenwet][ref2] wordt vanaf de datum van inwerkingtreding
      van [artikel 1 van de Pensioenwet][ref3] aangemerkt als een ontheffing die is verleend van
      [artikel 147 van de Pensioenwet][ref4] op grond van [artikel 212 van de Pensioenwet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel10b
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel1
