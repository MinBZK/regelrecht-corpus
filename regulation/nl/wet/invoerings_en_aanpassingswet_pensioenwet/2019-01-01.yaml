  - number: '59.8'
    text: |-
      Voorschriften die zijn verbonden en beperkingen die zijn gesteld aan een ontheffing die is verleend op grond
      van de [Pensioen- en spaarfondsenwet][ref1] respectievelijk de [Wet verplichte beroepspensioenregeling][ref2],
      zoals deze luidde voor de datum van inwerkingtreding van deze wet, berusten vanaf de datum van inwerkingtreding
      van [artikel 1 van de Pensioenwet][ref3] respectievelijk vanaf de datum van inwerkingtreding van deze wet op de
      [Pensioenwet][ref4] respectievelijk de [Wet verplichte beroepspensioenregeling][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002089
      [ref2]: https://wetten.overheid.nl/BWBR0018831
