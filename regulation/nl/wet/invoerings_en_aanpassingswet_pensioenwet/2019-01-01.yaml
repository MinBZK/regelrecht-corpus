    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0018831
  - number: '55.7'
    text: |-
      Op het opleggen van een last onder dwangsom of bestuurlijke boete als bedoeld in het derde en zesde lid blijft het
      recht van toepassing dat gold op de peildatum respectievelijk op de datum voor inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel55
  - number: '56.1'
    text: |-
      De in [artikel 188 van de Pensioenwet][ref1] opgenomen mogelijkheid tot openbaarmaking en de in [artikel 191][ref2]
      opgenomen verplichting tot openbaarmaking heeft uitsluitend betrekking op feiten die plaatsvinden na de datum van
      inwerkingtreding van [artikel 1 van de Pensioenwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel188
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel191
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel1
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '188'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '191'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '1'
  - number: '56.2'
    text: |-
      De in [artikel 183 van de Wet verplichte beroepspensioenregeling][ref1], zoals dat komt te luiden
      na de datum van inwerkingtreding van deze wet, opgenomen mogelijkheid tot openbaarmaking en de in
      [artikel 186 van de Wet verplichte beroepspensioenregeling][ref2], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, opgenomen verplichting tot openbaarmaking heeft uitsluitend betrekking op feiten die
      plaatsvinden na de datum van inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel183
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel186
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel56
