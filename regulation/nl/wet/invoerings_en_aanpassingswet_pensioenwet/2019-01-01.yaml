        artikel: '83'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '168'
  - number: '55.1'
    text: |-
      Een last onder dwangsom die is opgelegd terzake van overtreding van een voorschrift gesteld
      bij of krachtens de [Pensioen- en spaarfondsenwet][ref1] wordt na de datum van inwerkingtreding
      van [artikel 1 van de Pensioenwet][ref2] aangemerkt als een last onder dwangsom als bedoeld in
      [artikel 175 van laatstgenoemde wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002089
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel175
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel55
