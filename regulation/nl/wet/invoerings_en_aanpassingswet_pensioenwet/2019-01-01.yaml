        bwb_id: BWBR0018831
  - number: '60'
    text: |-
      In afwijking van [artikel 2][ref1] blijft ten aanzien van overtredingen van
      [artikel 32, vierde en vijfde lid][ref2], en [artikel 32ba van de Pensioen- en spaarfondsenwet][ref3]
      die zijn begaan voor de datum van inwerkingtreding van [artikel 1 van de Pensioenwet][ref4],
      [artikel 30 van de Pensioen- en spaarfondsenwet][ref5] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020828#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0002089#Artikel32ba
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0002089#Artikel30
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0020828
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0002089
        artikel: '32'
      - id: ref3
        bwb_id: BWBR0002089
        artikel: 32ba
      - id: ref4
        bwb_id: BWBR0020809
        artikel: '1'
      - id: ref5
        bwb_id: BWBR0002089
        artikel: '30'
  - number: '61'
    text: |-
      Ten aanzien van de op de peildatum bij de rechter aanhangige beroepen tegen besluiten op
      grond van de [Pensioen- en spaarfondsenwet][ref1] blijft, in afwijking van [artikel 2][ref2],
      [artikel 33a van de Pensioen- en spaarfondsenwet][ref3] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002089
      [ref2]: https://wetten.overheid.nl/BWBR0020828#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002089#Artikel33a
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0002089
      - id: ref2
        bwb_id: BWBR0020828
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0002089
        artikel: 33a
  - number: '62'
    text: |-
      Een klacht die op grond van [artikel 6d van de Pensioen- en spaarfondsenwet][ref1] bij De Nederlandsche Bank
      N.V. is ingediend voor de datum van inwerkingtreding van [artikel 1 van de Pensioenwet][ref2] wordt door De
      Nederlandsche Bank beoordeeld overeenkomstig [artikel 6d van de Pensioen- en spaarfondsenwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel6d
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002089#Artikel6d
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: 6d
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0002089
        artikel: 6d
  - number: '63.1'
    text: |-
      In afwijking van [artikel 2][ref1] blijven de [artikelen 1, eerste lid, onderdeel g][ref2], en
      [8, tweede, derde en vierde lid, van de Pensioen- en spaarfondsenwet][ref3] en artikel 1, eerste lid, onderdeel d,
      van de Wet betreffende verplichte deelneming in een bedrijfspensioenfonds, zoals deze luidden op 31 december 1999,
      van toepassing ten aanzien van pensioenuitvoerders die aan die bepalingen voordien toepassing gaven, en wel in de
      gevallen en gedurende de termijn die daarvoor al waren vastgesteld, doch in elk geval niet langer dan gedurende
      tien jaar na 1 januari 2000 en met dien verstande dat de financiering ingevolge die bepalingen ten minste in
      gelijke delen per kalenderjaar plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0020828#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002089#Artikel8
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0020828
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0002089
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0002089
        artikel: '8'
  - number: '63.2'
    text: |-
      De Nederlandsche Bank N.V. kan toestaan dat, in afwijking van het eerste lid, een pensioenuitvoerder gedurende
      een langere periode dan daar bedoeld, maar niet langer dan gedurende vijftien jaar, toepassing geeft aan de daar
      genoemde bepalingen, voor zover dat noodzakelijk is ter voorkoming van onaanvaardbare financiële gevolgen voor het
      betrokken pensioenfonds of de betrokken werkgever.
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel63
  - number: '63.3'
    text: |-
      [Paragraaf 7.1][ref1] en de [artikelen 171][ref2] en [172 van de Pensioenwet][ref3] zijn van overeenkomstige
      toepassing op het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Paragraaf7.1
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel171
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel172
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0020809
        paragraaf: '7.1'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '171'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '172'
  - number: '64.1'
    text: |-
      Indien een overdragend pensioenfonds een pensioenuitvoerder is als bedoeld in [artikel 63][ref1] van deze wet,
      geldt in afwijking van [artikel 72, onderdeel a, van de Pensioenwet][ref2] geen plicht tot waardeoverdracht indien
      de financiele toestand van het pensioenfonds dat naar het oordeel van De Nederlandsche Bank N.V. niet toelaat.


      [ref1]: https://wetten.overheid.nl/BWBR0020828#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel72
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0020828
        artikel: '63'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '72'
  - number: '64.2'
    text: |-
      De plicht tot waardeoverdracht van het overdragende pensioenfonds herleeft overeenkomstig
      [artikel 74 van de Pensioenwet][ref1] wanneer de financiele toestand van het pensioenfonds dat naar het oordeel van
      De Nederlandsche Bank N.V. op een later tijdstip wel toelaat.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel74
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '74'
  - number: '64.3'
    text: |-
      Indien een overdragend beroepspensioenfonds een pensioenuitvoerder is als bedoeld in
      [artikel 214, derde lid, van de Wet verplichte beroepspensioenregeling][ref1], zoals
      dat komt te luiden na de datum van inwerkingtreding van deze wet, geldt in afwijking van
      [artikel 83, onderdeel a, van de Wet verplichte beroepspensioenregeling][ref2], zoals dat komt te luiden na de
      datum van inwerkingtreding van deze wet, geen plicht tot waardeoverdracht indien de financiele toestand van het
      beroepspensioenfonds dat naar het oordeel van De Nederlandsche Bank N.V. niet toelaat.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel214
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel83
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '214'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '83'
  - number: '64.4'
    text: |-
      De plicht tot waardeoverdracht van het overdragende beroepspensioenfonds herleeft overeenkomstig
      [artikel 85 van de Wet verplichte beroepspensioenregeling][ref1], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, wanneer de financiele toestand van het beroepspensioenfonds dat naar het oordeel van
      De Nederlandsche Bank N.V. op een later tijdstip wel toelaat.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel85
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '85'
  - number: '65.1'
    text: |-
      Een geldelijke, vastgestelde uitkering die op basis van
      [artikel 4 van het Uitvoeringsbesluit pensioenaspecten Sociaal Akkoord 2004][ref1] wordt overeengekomen is geen
      pensioen als bedoeld in de [Pensioenwet][ref2] of de [Wet verplichte beroepspensioenregeling][ref3] voor zover deze
      nog niet is gefinancierd.


      [ref1]: https://wetten.overheid.nl/BWBR0018605#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020809
      [ref3]: https://wetten.overheid.nl/BWBR0018831
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0018605
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020809
      - id: ref3
        bwb_id: BWBR0018831
  - number: '65.2'
    text: Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel65
  - number: '65.3'
    text: |-
      Na inwerkingtreding van dit artikel berust het [Uitvoeringsbesluit pensioenaspecten Sociaal Akkoord 2004][ref1]
      mede op het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0018605
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0018605
  - number: '66.1'
    text: |-
      Een pensioenuitvoerder is bevoegd de pensioenaanspraken, opgebouwd ten behoeve van pensioen in de periode
      voorafgaand aan de datum waarop de deelnemer of gewezen deelnemer de leeftijd van 65 jaar bereikt, af te kopen,
      mits het verzoek van de deelnemer of gewezen deelnemer tot afkoop uiterlijk binnen twee maanden na het ontvangen
      van de in [artikel 17, zesde lid, van de Pensioen- en spaarfondsenwet][ref1] bedoelde opgave wordt gedaan en mits
      de afkoopsom:


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel17
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: '17'
  - number: 66.1.a
    text: wordt berekend overeenkomstig bij algemene maatregel van bestuur te stellen regels;
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel66
  - number: 66.1.b
    text: |-
      wordt aangewend ten behoeve van een levensloopregeling als bedoeld in
      [artikel 19g van de Wet op de loonbelasting 1964][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19g
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19g
  - number: 66.1.c
    text: |-
      rechtstreeks wordt overgedragen aan de uitvoerder van de levensloopregeling als bedoeld in
      [artikel 19g, derde lid, van de Wet op de loonbelasting 1964][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19g
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19g
  - number: '66.2'
    text: |-
      Het eerste lid is niet van toepassing voor zover de echtgenoot ter zake van de pensioenaanspraken een recht op
      uitbetaling heeft als bedoeld in [artikel 2, tweede lid, van de Wet verevening pensioenrechten bij scheiding][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006641#Artikel2
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0006641
        artikel: '2'
  - number: '66.3'
    text: |-
      Na de datum van inwerkingtreding van dit artikel berust het
      [Uitvoeringsbesluit pensioenaspecten Sociaal Akkoord 2004][ref1] mede op het eerste lid, onderdeel a, van dit
      artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0018605
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0018605
  - number: '67'
    text: |-
      Bij algemene maatregel van bestuur kunnen met het oog op de goede invoering van de [Pensioenwet][ref1] en deze wet
      regels worden gesteld waarbij zo nodig kan worden afgeweken van het bepaalde bij of krachtens voornoemde wet of
      deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0020809
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0020809
  - number: '73.1'
    text: |-
      Voor de plaatsing in het Staatsblad stelt Onze Minister de nummering van de artikelen van de [Pensioenwet][ref1]
      opnieuw vast en brengt hij de in de [Pensioenwet][ref2] voorkomende aanhalingen van de artikelen met de nieuwe
      nummering in overeenstemming.


      [ref1]: https://wetten.overheid.nl/BWBR0020809
      [ref2]: https://wetten.overheid.nl/BWBR0020809
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0020809
      - id: ref2
        bwb_id: BWBR0020809
  - number: '73.2'
    text: |-
      De tekst van de [Wet verplichte beroepspensioenregeling][ref1], zoals deze komt te luiden na inwerkingtreding van
      deze wet, wordt in het Staatsblad geplaatst. Voor de plaatsing in het Staatsblad stelt Onze Minister de nummering
      van de artikelen opnieuw vast en brengt hij de in de [Wet verplichte beroepspensioenregeling][ref2] voorkomende
      aanhalingen van de artikelen met de nieuwe nummering in overeenstemming.


      [ref1]: https://wetten.overheid.nl/BWBR0018831
      [ref2]: https://wetten.overheid.nl/BWBR0018831
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0018831
      - id: ref2
        bwb_id: BWBR0018831
  - number: '73.3'
    text: |-
      Voor de plaatsing van deze wet in het Staatsblad brengt Onze Minister de aanhalingen van de artikelen in deze
      wet van de [Wet verplichte beroepspensioenregeling][ref1] en van de [Pensioenwet][ref2] in overeenstemming met de
      vastgestelde nummering van die wetten.


      [ref1]: https://wetten.overheid.nl/BWBR0018831
      [ref2]: https://wetten.overheid.nl/BWBR0020809
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0018831
      - id: ref2
        bwb_id: BWBR0020809
  - number: '91'
    text: 'Als de uitoefening van het bedrijf van levensverzekeraar of het bedrijf van schadeverzekeraar wordt niet beschouwd:'
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel91
  - number: 91.a
    text: |-
      het sluiten of afwikkelen van levensverzekeringen onderscheidenlijk
      schadeverzekeringen voor eigen rekening door bijdragende ondernemingen in de zin van
      [artikel 1, eerste lid, onderdeel m, van de Pensioen- en spaarfondsenwet][ref1], zoals deze luidde voor de datum
      van inwerkingtreding van deze wet, of pensioeninstellingen die voor eigen rekening geen andere levensverzekeringen
      of schadeverzekeringen sluiten of afwikkelen dan die welke dienen ter uitvoering van toezeggingen als bedoeld in
      [artikel 19][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020828#Artikel19
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020828
        artikel: '19'
        hoofdstuk: '2'
  - number: 91.b
    text: |-
      het handelen van een ondernemingsspaarfonds in de zin van
      [artikel 1, eerste lid, onderdeel d, van de Pensioen- en spaarfondsenwet][ref1], zoals deze luidde voor de datum
      van inwerkingtreding van deze wet, ter uitvoering van een door een werkgever getroffen regeling tot sparen voor een
      uitkering bij wijze van oudedagsvoorziening zolang sprake is van een spaarfonds als bedoeld in [artikel 5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020828#Artikel5
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020828
        artikel: '5'
        hoofdstuk: '2'
  - number: '96.1'
    text: 'Als de uitoefening van het bedrijf van levensverzekeraar of het bedrijf van schadeverzekeraar wordt niet beschouwd:'
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel96
  - number: 96.1.a
    text: |-
      het sluiten of afwikkelen van levensverzekeringen onderscheidenlijk schadeverzekeringen voor eigen rekening
      door ondernemingen of pensioeninstellingen die voor eigen rekening geen andere levensverzekeringen of
      schadeverzekeringen sluiten of afwikkelen dan die welke dienen ter uitvoering van toezeggingen als bedoeld in
      [artikel 19][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020828#Artikel19
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0020828
        artikel: '19'
        hoofdstuk: '2'
  - number: 96.1.b
    text: |-
      het handelen van een ondernemingsspaarfonds ter uitvoering van een door een werkgever getroffen regeling tot
      sparen voor een uitkering bij wijze van oudedagsvoorziening zolang sprake is van een spaarfonds als bedoeld in
      [artikel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020828#Artikel5
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0020828
        artikel: '5'
        hoofdstuk: '2'
  - number: '96.2'
    text: |-
      De [Wet op het financieel toezicht][ref1] is, met uitzondering van het [Algemeen Deel][ref2] en het
      [Deel Gedragstoezicht financiële markten][ref3], niet van toepassing zolang sprake is van spaarfondsen als bedoeld
      in [artikel 5][ref4] en van:


      [ref1]: https://wetten.overheid.nl/BWBR0020368
      [ref2]: https://wetten.overheid.nl/BWBR0020368
      [ref3]: https://wetten.overheid.nl/BWBR0020368
      [ref4]: https://wetten.overheid.nl/BWBR0020828#Artikel5
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0020368
      - id: ref2
        bwb_id: BWBR0020368
      - id: ref3
        bwb_id: BWBR0020368
      - id: ref4
        bwb_id: BWBR0020828
        artikel: '5'
        hoofdstuk: '2'
  - number: 96.2.a
    text: |-
      het verlenen van financiële diensten door ondernemingsspaarfondsen voorzover zij die financiële diensten verlenen
      aan de onderneming waarmee zij zijn verbonden; en
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel96
  - number: 96.2.b
    text: |-
      het beheren van individuele vermogens ten behoeve van ondernemingsspaarfondsen als bedoeld in onderdeel a of
      daaraan gelieerde fondsen door personen die zijn verbonden aan het fonds waaraan deze financiële dienst wordt
      verleend.
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel96
  - number: 96a
    text: |-
      Onze Minister brengt voor de plaatsing van deze wet in het Staatsblad de in deze wet voorkomende verwijzingen
      naar artikelen uit de [Wet op het financieel toezicht][ref1] in overeenstemming met de op grond van
      [artikel 7:1 van die wet][ref2] opnieuw vastgestelde nummering.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel7
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel96a
    references:
      - id: ref1
        bwb_id: BWBR0020368
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '7'
  - number: '97.1'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel97
  - number: '97.2'
    text: |-
      Bij de vaststelling van het in het eerste lid bedoelde tijdstip van inwerkingtreding kan onderscheid gemaakt worden
      tussen pensioenuitvoerders.
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel97
  - number: '98'
    text: 'Deze wet wordt aangehaald als: Invoerings- en aanpassingswet Pensioenwet.'
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel98
