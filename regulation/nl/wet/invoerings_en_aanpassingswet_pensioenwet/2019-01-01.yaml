      pensioenregeling de [artikelen 82 tot en met 85 van de Wet verplichte beroepspensioenregeling][ref1], zoals deze
      komen te luiden na inwerkingtreding van deze wet, van toepassing zijn wanneer de beëindiging van de deelneming
      plaatsvindt na de datum van inwerkingtreding van [artikel 82 van de Wet verplichte beroepspensioenregeling][ref2],
      zoals dat komt te luiden na de datum van inwerkingtreding van deze wet.


