  - number: 20a.2
    text: |-
      [Artikel 29 van de Pensioenwet][ref1] is niet van toepassing op premies die zijn verschuldigd voor de datum van
      inwerkingtreding van [genoemd artikel][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel29
