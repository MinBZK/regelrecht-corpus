  - number: '53.2'
    text: |-
      De toezichthouder kan na de datum van inwerkingtreding van [artikel 1 van de Pensioenwet][ref1] besluiten een of
      meer personen als curator ten aanzien van alle of bepaalde organen van een pensioenfonds te benoemen nadat door een
      pensioenfonds binnen de gestelde termijn niet of niet volledig gevolg is gegeven aan een aanwijzing op grond van de
      [Pensioen- en spaarfondsenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002089
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002089
  - number: '53.3'
    text: |-
      Een besluit tot benoeming van een of meer personen als curator op grond van
      [artikel 82 van de Wet verplichte beroepspensioenregeling][ref1], zoals deze luidde voor de datum van
      inwerkingtreding van deze wet, wordt na de datum van inwerkingtreding van deze wet aangemerkt als een besluit als
      bedoeld in [artikel 167 van de Wet verplichte beroepspensioenregeling][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel167
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '82'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '167'
  - number: '53.4'
    text: |-
      De toezichthouder kan na de datum van inwerkingtreding van deze wet besluiten een of meer personen als curator ten
      aanzien van alle of bepaalde organen van een beroepspensioenfonds te benoemen nadat door een beroepspensioenfonds
      binnen de gestelde termijn niet of niet volledig gevolg is gegeven aan een aanwijzing op grond van de
      [Wet verplichte beroepspensioenregeling][ref1], zoals deze luidde voor de datum van inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0018831
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0018831
  - number: '54.1'
    text: |-
      Een bewindvoerder die is aangesteld door de ondernemingskamer van het gerechtshof Amsterdam op grond
      van [artikel 23m van de Pensioen- en spaarfondsenwet][ref1] wordt na de datum van inwerkingtreding van
      [artikel 1 van de Pensioenwet][ref2] aangemerkt als een bewindvoerder die is aangesteld op grond van
      [artikel 173 van de Pensioenwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel23m
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel173
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel54
    references:
