        bwb_id: BWBR0020809
      - id: ref4
        bwb_id: BWBR0020809
        artikel: '192'
  - number: '57.2'
    text: |-
      Voorschriften die zijn verbonden en beperkingen die zijn gesteld aan een vergunning die is verleend
      op grond van de [Pensioen- en spaarfondsenwet][ref1] berusten vanaf de datum van inwerkingtreding van
      [artikel 1 van de Pensioenwet][ref2] op de [Pensioenwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002089
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0020809
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel57
    references:
