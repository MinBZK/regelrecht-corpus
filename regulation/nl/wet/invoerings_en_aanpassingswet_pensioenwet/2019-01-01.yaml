preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de invoering van de Pensioenwet en enkele daarmee
    samenhangende onderwerpen te regelen, zulks onder intrekking van de Pensioen- en spaarfondsenwet;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - Pensioen- en spaarfondsenwet: de
      [Pensioen- en spaarfondsenwet][ref1] en de daarop berustende bepalingen zoals deze luidden op de peildatum;
        - peildatum: de dag voorafgaand aan de inwerkingtreding van [artikel 1 van de Pensioenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002089
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel1
    url: https://wetten.overheid.nl/BWBR0020828/2019-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002089
