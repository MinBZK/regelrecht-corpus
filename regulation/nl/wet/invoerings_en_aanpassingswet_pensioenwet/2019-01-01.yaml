      Tot de datum van inwerkingtreding van de [artikelen 38 tot en met 45 van de Pensioenwet][ref1]
      blijven, in afwijking van [artikel 2][ref2], de [artikelen 8, vierde lid][ref3],
      [17][ref4], [17a][ref5] en [17b van de Pensioen- en spaarfondsenwet][ref6] en [13][ref7] en
      [13a van de Regelen verzekeringsovereenkomsten Pensioen- en spaarfondsenwet][ref8] van toepassing.


