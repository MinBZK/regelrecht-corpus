        artikel: '171'
  - number: '55.6'
    text: |-
      De toezichthouder kan na de datum van inwerkingtreding van deze wet tot drie jaar na de dag waarop een overtreding
      is begaan een last onder dwangsom of een boete opleggen terzake van overtreding van een voorschrift gesteld bij of
      krachtens de [Wet verplichte beroepspensioenregeling][ref1], zoals deze luidde voor de datum van inwerkingtreding
      van deze wet.


