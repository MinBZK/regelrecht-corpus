        bwb_id: BWBR0002089
        artikel: '29'
  - number: '59.3'
    text: |-
      Een ontheffing die is verleend van [artikel 6a van de Pensioen- en spaarfondsenwet][ref1] op grond van
      [artikel 29 van de Pensioen- en spaarfondsenwet][ref2] vervalt een jaar na de datum van inwerkingtreding van
