  - number: '21.4'
    text: |-
      De pensioenuitvoerder is niet verantwoordelijk voor de inhoud van pensioenreglementen voor de datum van
      inwerkingtreding van [artikel 21 van de Wet verplichte beroepspensioenregeling][ref1], zoals dat komt te luiden na
