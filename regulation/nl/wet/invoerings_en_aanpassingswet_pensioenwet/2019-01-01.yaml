        artikel: '28'
  - number: '20.2'
    text: |-
      De in [artikel 38 van de Wet verplichte beroepspensioenregeling][ref1], zoals dat komt te luiden na de datum
      van inwerkingtreding van deze wet, opgenomen informatieverplichting van een beroepspensioenfonds jegens gewezen
      deelnemers heeft uitsluitend betrekking op degenen die na de datum van inwerkingtreding van genoemd artikel gewezen
      deelnemer zijn geworden en op de gewezen deelnemers die het beroepspensioenfonds hebben geïnformeerd over hun
      adres.


