        bwb_id: BWBR0018831
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '170'
  - number: '55.5'
    text: |-
      Een bestuurlijke boete die is opgelegd terzake van overtreding van een voorschrift gesteld bij of krachtens de
      [Wet verplichte beroepspensioenregeling][ref1], zoals die luidde voor de datum van inwerkingtreding van deze
      wet, wordt na de datum van inwerkingtreding van deze wet aangemerkt als een bestuurlijke boete als bedoeld in
      [artikel 171 van de Wet verplichte beroepspensioenregeling][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018831
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel171
