  - number: '22.3'
    text: |-
      Na de datum van inwerkingtreding van [artikel 38 van de Pensioenwet][ref1] wordt door de pensioenuitvoerder
      bij de eerste informatieverstrekking op grond van genoemd artikel na de datum van inwerkingtreding van
      [dat artikel][ref2] aan de deelnemer informatie verstrekt over het karakter van de pensioenovereenkomst, bedoeld in
      [artikel 10 van de Pensioenwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel10
