  - number: '19'
    text: |-
      In afwijking van [artikel 2 blijft de Pensioen- en spaarfondsenwet][ref1] van toepassing op een pensioentoezegging
      als bedoeld in [artikel 2 van die wet][ref2], indien die pensioentoezegging op de peildatum niet is ondergebracht
      bij een pensioenuitvoerder op grond van:

      a. [artikel 2, derde lid, onderdeel a, van de Pensioen- en spaarfondsenwet][ref3];

      b. [artikel 2, derde lid, onderdeel d, van de Pensioen- en spaarfondsenwet][ref4]; of

      c. een ontheffing die op grond van artikel 2, eerste lid, onderdeel c, van de Beleidsregels ontheffingen Pensioen-
      en spaarfondsenwet is verleend.


