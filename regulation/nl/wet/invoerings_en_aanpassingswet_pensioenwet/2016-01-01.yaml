    text: |-
      1 [Artikel 67 van de Pensioenwet][ref1] is van toepassing indien het partnerpensioen ingaat na de datum van
      inwerkingtreding van genoemd artikel.

      2 Indien het partnerpensioen is ingegaan voor de datum van inwerkingtreding van
      [artikel 67 van de Pensioenwet][ref2], heeft de pensioenuitvoerder het recht om overeenkomstig genoemd artikel het
      partnerpensioen af te kopen indien de uitkering van het partnerpensioen op jaarbasis, getoetst op het tijdstip van
      ingang minder bedraagt dan het op grond van [artikel 66 van de Pensioenwet][ref3] vastgestelde bedrag per jaar en
      de partner hiermee instemt.

      3 [Artikel 79 van de Wet verplichte beroepspensioenregeling][ref4], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, is van toepassing indien het partnerpensioen ingaat na de datum van inwerkingtreding
      van genoemd artikel.

      4 Indien het partnerpensioen is ingegaan voor de datum van inwerkingtreding van
      [artikel 79 van de Wet verplichte beroepspensioenregeling][ref5], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, heeft de pensioenuitvoerder het recht om overeenkomstig genoemd artikel het
      partnerpensioen af te kopen indien de uitkering van het partnerpensioen op jaarbasis, getoetst op het tijdstip
      van ingang minder bedraagt dan het op grond van [artikel 78 van de Wet verplichte beroepspensioenregeling][ref6],
      zoals dat komt te luiden na de datum van inwerkingtreding van deze wet, vastgestelde bedrag per jaar en de partner
      hiermee instemt.


