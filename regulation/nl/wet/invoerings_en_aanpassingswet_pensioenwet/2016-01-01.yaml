  - number: '28'
    text: |-
      1 [Artikel 66 van de Pensioenwet][ref1] is van toepassing indien de deelneming eindigt na de datum van
      inwerkingtreding van genoemd artikel.

      2 Indien de deelneming is geëindigd voor de datum van inwerkingtreding van [artikel 66 van de Pensioenwet][ref2],
      heeft de pensioenuitvoerder het recht om op zijn vroegst twee jaar na de beëindiging van de deelneming of per de
      eerdere reguliere ingangsdatum van het ouderdomspensioen overeenkomstig genoemd artikel pensioenaanspraken af te
      kopen, indien de uitkering van het ouderdomspensioen op jaarbasis op de reguliere ingangsdatum, getoetst per 1
      januari van dat jaar lager is dan het op grond van genoemd artikel vastgestelde bedrag per jaar, tenzij de gewezen
      deelnemer of gepensioneerde hiertegen bezwaar maakt.

      3 In afwijking van het eerste lid is [artikel 66 van de Pensioenwet][ref3] van toepassing, indien de deelneming
      is geëindigd voor de datum van inwerkingtreding van genoemd artikel, maar het verzoek tot afkoop in verband met
      emigratie wordt gedaan na de datum van inwerkingtreding van genoemd artikel.

      4 Indien de pensioenuitvoerder door toepassing van het tweede lid wil afkopen op of na de reguliere ingangsdatum
      van het ouderdomspensioen, en het moment waarop de pensioenuitvoerder wil afkopen, ligt voor of op de datum
      waarop het ouderdomspensioen op grond van de [Algemene Ouderdomswet][ref4] ingaat, dan heeft de gewezen deelnemer
      het recht ervoor te kiezen dat het ouderdomspensioen waarop de afkoop betrekking heeft, ingaat op de eerste dag
      van de maand volgend op de datum waarop het ouderdomspensioen op grond van de Algemene Ouderdomswet ingaat. De
      pensioenuitvoerder koopt af op het moment dat het ouderdomspensioen waarop de afkoop betrekking heeft ingaat.
      [Artikel 62, eerste lid, van de Pensioenwet][ref5] is van overeenkomstige toepassing.

      5 [Artikel 78 van de Wet verplichte beroepspensioenregeling][ref6], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, is van toepassing indien de deelneming eindigt na de datum van inwerkingtreding van
      genoemd artikel.

      6 Indien de deelneming is geëindigd voor de datum van inwerkingtreding van
      [artikel 78 van de Wet verplichte beroepspensioenregeling][ref7], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, heeft de pensioenuitvoerder het recht om op zijn vroegst twee jaar na de beëindiging
      van de deelneming of per de eerdere reguliere ingangsdatum van het ouderdomspensioen overeenkomstig genoemd artikel
      een ouderdomspensioen af te kopen, indien de uitkering van het ouderdomspensioen op jaarbasis op de reguliere
      ingangsdatum, getoetst per 1 januari van dat jaar lager is dan het op grond van genoemd artikel vastgestelde bedrag
      per jaar, tenzij de gewezen deelnemer of gepensioneerde hiertegen bezwaar maakt.

      7 In afwijking van het vierde lid is [artikel 78 van de Wet verplichte beroepspensioenregeling][ref8], zoals dat
      komt te luiden na de datum van inwerkingtreding van deze wet, van toepassing, indien de deelneming is geëindigd
      voor de datum van inwerkingtreding van genoemd artikel, maar het verzoek tot afkoop in verband met emigratie wordt
      gedaan na de datum van inwerkingtreding van genoemd artikel.

      8 Indien de pensioenuitvoerder door toepassing van het zesde lid wil afkopen op of na de reguliere ingangsdatum
      van het ouderdomspensioen, en het moment waarop de pensioenuitvoerder wil afkopen ligt voor of op de datum waarop
      het ouderdomspensioen op grond van de [Algemene Ouderdomswet][ref9] ingaat, dan heeft de gewezen deelnemer het
      recht ervoor te kiezen dat het ouderdomspensioen waarop de afkoop betrekking heeft, ingaat op de eerste dag
      van de maand volgend op de datum waarop het ouderdomspensioen op grond van de Algemene Ouderdomswet ingaat. De
      pensioenuitvoerder koopt af op het moment dat het ouderdomspensioen waarop de afkoop betrekking heeft ingaat.
      [Artikel 74, eerste lid, van de Wet verplichte beroepspensioenregeling][ref10] is van overeenkomstige toepassing.


