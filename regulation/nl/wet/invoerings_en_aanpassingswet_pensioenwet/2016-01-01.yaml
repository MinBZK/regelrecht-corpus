      1 Een aanwijzing die is gegeven met betrekking tot een overtreding van een voorschrift gesteld bij of krachtens de
      [Pensioen- en spaarfondsenwet][ref1] wordt na de datum van inwerkingtreding van [artikel 1 van de Pensioenwet][ref2]
      aangemerkt als een aanwijzing als bedoeld in [artikel 171 van de Pensioenwet][ref3].

      2 De toezichthouder kan na de datum van inwerkingtreding van [artikel 1 van de Pensioenwet][ref4], onder toepassing
      van het op de peildatum geldende recht, een aanwijzing geven met betrekking tot een, voor de inwerkingtreding
      van [artikel 1 van de Pensioenwet][ref5], begane overtreding van een voorschrift gesteld bij of krachtens de
      [Pensioen- en spaarfondsenwet][ref6].

      3 Een aanwijzing die is gegeven met betrekking tot een overtreding van een voorschrift gesteld bij of krachtens
      de [Wet verplichte beroepspensioenregeling][ref7], zoals die luidde voor de datum van inwerkingtreding van
      deze wet, wordt na de datum van inwerkingtreding van deze wet aangemerkt als een aanwijzing als bedoeld in
      [artikel 166 van de Wet verplichte beroepspensioenregeling][ref8].

      4 De toezichthouder kan na de datum van inwerkingtreding van deze wet, onder toepassing van het voor
      de inwerkingtreding van deze wet geldende recht, een aanwijzing geven met betrekking tot een, voor
      de inwerkingtreding van deze wet, begane overtreding van een voorschrift gesteld bij of krachtens de
      [Wet verplichte beroepspensioenregeling][ref9], zoals deze luidde voor de datum van inwerkingtreding van deze wet.


