    text: |-
      1 Tot de datum van inwerkingtreding van [artikel 29 van de Pensioenwet][ref1] blijven, in afwijking
      van [artikel 2][ref2], de [artikelen 3a, vierde lid, van de Pensioen- en spaarfondsenwet][ref3] en
      [12 van de Regelen verzekeringsovereenkomsten Pensioen- en spaarfondsenwet][ref4] van toepassing.

      2 [Artikel 29 van de Pensioenwet][ref5] is niet van toepassing op premies die zijn verschuldigd voor de datum van
      inwerkingtreding van [genoemd artikel][ref6].


