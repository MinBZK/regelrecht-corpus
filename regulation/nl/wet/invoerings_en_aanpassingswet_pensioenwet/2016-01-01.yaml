  - number: '14'
    text: |-
      1 Werknemers van 21 jaar of ouder die op de peildatum niet in de pensioenregeling van hun werkgever
      deelnemen, omdat zij jonger zijn dan de op basis van de pensioenregeling gehanteerde toegangsleeftijd,
      verwerven pensioenaanspraken vanaf de datum van inwerkingtreding van de [artikelen 8, vijfde lid][ref1], en
      [14 van de Pensioenwet][ref2].

      2 Beroepsgenoten van 21 jaar of ouder die op de datum van inwerkingtreding van
      [artikel 22 van de Wet verplichte beroepspensioenregeling][ref3], zoals dat komt te luiden na inwerkingtreding van
      deze wet, niet in de pensioenregeling zijn opgenomen, omdat zij jonger zijn dan de op basis van de pensioenregeling
      gehanteerde toetredingsleeftijd, verwerven pensioenaanspraken vanaf de datum van inwerkingtreding van genoemd
      artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel8
