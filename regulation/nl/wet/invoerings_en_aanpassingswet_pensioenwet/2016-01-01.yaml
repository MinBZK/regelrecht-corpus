  - number: '35'
    text: |-
      1 [Artikel 83 van de Pensioenwet][ref1] is van toepassing indien het verzoek van de werkgever, bedoeld in het
      eerste lid van genoemd artikel, wordt gedaan na de datum van inwerkingtreding van genoemd artikel.

      2 [Artikel 91 van de Wet verplichte beroepspensioenregeling][ref2], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, is van toepassing indien het verzoek van de beroepspensioenvereniging, bedoeld in
      het eerste lid van genoemd artikel, wordt gedaan na de datum van inwerkingtreding van genoemd artikel.


