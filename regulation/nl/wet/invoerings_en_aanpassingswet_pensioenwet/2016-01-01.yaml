    text: |-
      1 Een last onder dwangsom die is opgelegd terzake van overtreding van een voorschrift gesteld
      bij of krachtens de [Pensioen- en spaarfondsenwet][ref1] wordt na de datum van inwerkingtreding
      van [artikel 1 van de Pensioenwet][ref2] aangemerkt als een last onder dwangsom als bedoeld in
      [artikel 175 van laatstgenoemde wet][ref3].

      2 Een bestuurlijke boete die is opgelegd terzake van overtreding van een voorschrift gesteld
      bij of krachtens de [Pensioen- en spaarfondsenwet][ref4] wordt na de datum van inwerkingtreding
      van [artikel 1 van de Pensioenwet][ref5] aangemerkt als een bestuurlijke boete als bedoeld in
      [artikel 176 van laatstgenoemde wet][ref6].

      3 De toezichthouder kan na de datum van inwerkingtreding van [artikel 1 van de Pensioenwet][ref7] tot drie jaar na
      de dag waarop een overtreding is begaan een last onder dwangsom of een boete opleggen terzake van overtreding van
      een voorschrift gesteld bij of krachtens de [Pensioen- en spaarfondsenwet][ref8].

      4 Een last onder dwangsom die is opgelegd terzake van overtreding van een voorschrift gesteld bij of krachtens
      de [Wet verplichte beroepspensioenregeling][ref9], zoals die luidde voor de datum van inwerkingtreding van deze
      wet, wordt na de datum van inwerkingtreding van deze wet aangemerkt als een last onder dwangsom als bedoeld in
      [artikel 170 van de Wet verplichte beroepspensioenregeling][ref10].

      5 Een bestuurlijke boete die is opgelegd terzake van overtreding van een voorschrift gesteld bij of krachtens
      de [Wet verplichte beroepspensioenregeling][ref11], zoals die luidde voor de datum van inwerkingtreding van deze
      wet, wordt na de datum van inwerkingtreding van deze wet aangemerkt als een bestuurlijke boete als bedoeld in
      [artikel 171 van de Wet verplichte beroepspensioenregeling][ref12].

      6 De toezichthouder kan na de datum van inwerkingtreding van deze wet tot drie jaar na de dag waarop een
      overtreding is begaan een last onder dwangsom of een boete opleggen terzake van overtreding van een voorschrift
      gesteld bij of krachtens de [Wet verplichte beroepspensioenregeling][ref13], zoals deze luidde voor de datum van
      inwerkingtreding van deze wet.

      7 Op het opleggen van een last onder dwangsom of bestuurlijke boete als bedoeld in het derde en zesde lid blijft
      het recht van toepassing dat gold op de peildatum respectievelijk op de datum voor inwerkingtreding van deze wet.


