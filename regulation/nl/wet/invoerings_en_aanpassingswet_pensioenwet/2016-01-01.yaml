  - number: '18'
    text: |-
      1 De in [artikel 23 van de Pensioenwet][ref1] opgenomen verplichting tot het sluiten van een
      uitvoeringsovereenkomst geldt met ingang van een jaar na de datum van inwerkingtreding van
      [artikel 1 van de Pensioenwet][ref2] voor pensioenfondsen en met ingang van twee jaar na de datum van
      inwerkingtreding van [artikel 1 van de Pensioenwet][ref3] voor verzekeraars.

      2 In afwijking van [artikel 2][ref4] blijft, tot het in het eerste lid bedoelde tijdstip,
      [artikel 3a, eerste lid, van de Pensioen- en spaarfondsenwet][ref5] van toepassing.

      3 De in [artikel 23][ref6] opgenomen verplichting van een werkgever tot onderbrenging geldt niet ten aanzien
      van een pensioentoezegging als bedoeld in de [Pensioen- en spaarfondsenwet][ref7], welke op grond van
      [artikel 2, eerste lid, onderdeel c, en vierde lid, onderdeel c, van de Pensioen- en spaarfondsenwet][ref8] al is
      ondergebracht bij een verzekeraar.

      4 Ten aanzien van de in het derde lid bedoelde pensioentoezegging is de [Pensioenwet][ref9] van toepassing, met
      uitzondering van de [artikelen 23 tot en met 27][ref10] en [29][ref11], indien na de datum van inwerkingtreding van
      [artikel 1 van de Pensioenwet][ref12] nog verwerving van pensioen plaatsvindt.

      5 Ten aanzien van de in het derde lid bedoelde pensioentoezegging waarbij na de datum van
      inwerkingtreding van de [Pensioenwet][ref13] geen verwerving van pensioen meer plaatsvindt, blijven,
      in afwijking van [artikel 2, de Pensioen- en spaarfondsenwet][ref14] en [hoofdstuk I][ref15] en
      [III van de Regelen verzekeringsovereenkomsten Pensioen- en spaarfondsenwet][ref16] van toepassing.


