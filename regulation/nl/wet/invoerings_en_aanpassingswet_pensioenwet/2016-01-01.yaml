    text: |-
      1 [Artikel 35 van de Pensioenwet][ref1] geldt niet indien op de datum van inwerkingtreding van genoemd artikel in
      het kader van een pensioenregeling geen verwerving van pensioenaanspraken meer plaatsvindt.

      2 De pensioenuitvoerder is niet verantwoordelijk voor de inhoud van pensioenreglementen voor de datum van
      inwerkingtreding van [artikel 35 van de Pensioenwet][ref2].

      3 [Artikel 21 van de Wet verplichte beroepspensioenregeling][ref3], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, geldt niet indien op de datum van inwerkingtreding van genoemd artikel in het kader
      van een pensioenregeling geen verwerving van pensioenaanspraken meer plaatsvindt.

      4 De pensioenuitvoerder is niet verantwoordelijk voor de inhoud van pensioenreglementen voor de datum van
      inwerkingtreding van [artikel 21 van de Wet verplichte beroepspensioenregeling][ref4], zoals dat komt te luiden na
      de datum van inwerkingtreding van deze wet.


