  - number: '30'
    text: |-
      1 [Artikel 68 van de Pensioenwet][ref1] is van toepassing indien de aanspraak op bijzonder partnerpensioen op grond
      van [artikel 57 van de Pensioenwet][ref2] ontstaat als gevolg van een scheiding na de datum van inwerkingtreding
      van eerstgenoemd artikel.

      2 Indien de scheiding plaatsvindt voor de datum van inwerkingtreding van [artikel 68 van de Pensioenwet][ref3],
      heeft de pensioenuitvoerder het recht om overeenkomstig genoemd artikel het bijzonder partnerpensioen af te
      kopen, indien de uitkering van het partnerpensioen op jaarbasis, getoetst op het tijdstip van de scheiding, minder
      bedraagt dan het op grond van [artikel 66 van de Pensioenwet][ref4] vastgestelde bedrag per jaar en de gewezen
      partner hiermee instemt.

      3 [Artikel 80 van de Wet verplichte beroepspensioenregeling][ref5], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, is van toepassing indien de aanspraak op bijzonder partnerpensioen op grond
      van [artikel 68 van de Wet verplichte beroepspensioenregeling][ref6], zoals dat komt te luiden na de datum
      van inwerkingtreding van deze wet, ontstaat als gevolg van een scheiding na de datum van inwerkingtreding van
      eerstgenoemd artikel.

      4 Indien de scheiding plaatsvindt voor de datum van inwerkingtreding van
      [artikel 80 van de Wet verplichte beroepspensioenregeling][ref7], zoals dat komt te luiden na de
      datum van inwerkingtreding van deze wet, heeft de pensioenuitvoerder het recht om overeenkomstig
      genoemd artikel het bijzonder partnerpensioen af te kopen, indien de uitkering van het partnerpensioen
      op jaarbasis, getoetst op het tijdstip van de scheiding, minder bedraagt dan het op grond van
      [artikel 78 van de Wet verplichte beroepspensioenregeling][ref8], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, vastgestelde bedrag per jaar en de gewezen partner hiermee instemt.


