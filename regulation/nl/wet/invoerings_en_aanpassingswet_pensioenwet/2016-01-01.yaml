    text: |-
      1 De in [artikel 28 van de Pensioenwet][ref1] opgenomen informatieverplichting van een pensioenfonds jegens gewezen
      deelnemers heeft uitsluitend betrekking op degenen die na de datum van inwerkingtreding van genoemd artikel gewezen
      deelnemer zijn geworden en op de gewezen deelnemers die het pensioenfonds hebben geïnformeerd over hun adres.

      2 De in [artikel 38 van de Wet verplichte beroepspensioenregeling][ref2], zoals dat komt te luiden na de datum
      van inwerkingtreding van deze wet, opgenomen informatieverplichting van een beroepspensioenfonds jegens gewezen
      deelnemers heeft uitsluitend betrekking op degenen die na de datum van inwerkingtreding van genoemd artikel gewezen
      deelnemer zijn geworden en op de gewezen deelnemers die het beroepspensioenfonds hebben geïnformeerd over hun
      adres.


