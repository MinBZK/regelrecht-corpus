      1 De in [artikel 188 van de Pensioenwet][ref1] opgenomen mogelijkheid tot openbaarmaking en de in
      [artikel 191][ref2] opgenomen verplichting tot openbaarmaking heeft uitsluitend betrekking op feiten die
      plaatsvinden na de datum van inwerkingtreding van [artikel 1 van de Pensioenwet][ref3].

      2 De in [artikel 183 van de Wet verplichte beroepspensioenregeling][ref4], zoals dat komt te luiden
      na de datum van inwerkingtreding van deze wet, opgenomen mogelijkheid tot openbaarmaking en de in
      [artikel 186 van de Wet verplichte beroepspensioenregeling][ref5], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, opgenomen verplichting tot openbaarmaking heeft uitsluitend betrekking op feiten die
      plaatsvinden na de datum van inwerkingtreding van deze wet.


