  - number: '8'
    text: |-
      1 Indien uiterlijk op de peildatum een pensioentoezegging als bedoeld in
      [artikel 2 van de Pensioen- en spaarfondsenwet][ref1] is gedaan aan een directeur-grootaandeelhouder,
      blijft gedurende een jaar na inwerkingtreding van [artikel 1 van de Pensioenwet][ref2], in afwijking van
      [artikel 2, de Pensioen- en spaarfondsenwet][ref3] van toepassing op deze pensioentoezegging.

      2 De directeur-grootaandeelhouder, bedoeld in het eerste lid, wiens pensioentoezegging een jaar na de datum van
      inwerkingtreding van [artikel 1 van de Pensioenwet][ref4] is ondergebracht bij een pensioenuitvoerder als pensioen
      in de zin van de [Pensioen- en spaarfondsenwet][ref5], wordt gelijkgesteld met een werknemer als bedoeld in de
      [Pensioenwet][ref6].

      3 Indien de pensioentoezegging, bedoeld in het tweede lid, is ondergebracht bij een verzekeraar is er sprake van
      pensioen in de zin van de [Pensioen- en spaarfondsenwet][ref7] indien de directeur-grootaandeelhouder dit als
      zodanig heeft aangemerkt.

      4 De directeur-grootaandeelhouder, bedoeld in het eerste lid, wiens pensioentoezegging
      een jaar na inwerkingtreding van de [Pensioenwet][ref8] overeenkomstig
      [artikel 2, derde lid, onderdeel c, van de Pensioen- en spaarfondsenwet][ref9] niet is ondergebracht bij een
      pensioenuitvoerder wordt niet gelijkgesteld met een werknemer in de zin van de [Pensioenwet][ref10].

      5 Indien de in het vierde lid bedoelde toezegging mede een toezegging omtrent partnerpensioen omvat
      en er uiterlijk een jaar na inwerkingtreding van [artikel 1 van de Pensioenwet][ref11] sprake is
      geweest van een scheiding, blijven, in afwijking van [artikel 2][ref12], de [artikelen 8a][ref13] en
      [8c, tweede lid, van de Pensioen- en spaarfondsenwet][ref14] van toepassing.


