  - number: '66'
    text: |-
      1 Een pensioenuitvoerder is bevoegd de pensioenaanspraken, opgebouwd ten behoeve van pensioen in de periode
      voorafgaand aan de datum waarop de deelnemer of gewezen deelnemer de leeftijd van 65 jaar bereikt, af te kopen,
      mits het verzoek van de deelnemer of gewezen deelnemer tot afkoop uiterlijk binnen twee maanden na het ontvangen
      van de in [artikel 17, zesde lid, van de Pensioen- en spaarfondsenwet][ref1] bedoelde opgave wordt gedaan en mits
      de afkoopsom:

      a. wordt berekend overeenkomstig bij algemene maatregel van bestuur te stellen regels;

      b. wordt aangewend ten behoeve van een levensloopregeling als bedoeld in
      [artikel 19g van de Wet op de loonbelasting 1964][ref2]; en

      c. rechtstreeks wordt overgedragen aan de uitvoerder van de levensloopregeling als bedoeld in
      [artikel 19g, derde lid, van de Wet op de loonbelasting 1964][ref3].

      2 Het eerste lid is niet van toepassing voor zover de echtgenoot ter zake van de pensioenaanspraken een recht op
      uitbetaling heeft als bedoeld in [artikel 2, tweede lid, van de Wet verevening pensioenrechten bij scheiding][ref4].

      3 Na de datum van inwerkingtreding van dit artikel berust het
      [Uitvoeringsbesluit pensioenaspecten Sociaal Akkoord 2004][ref5] mede op het eerste lid, onderdeel a, van dit
      artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel17
