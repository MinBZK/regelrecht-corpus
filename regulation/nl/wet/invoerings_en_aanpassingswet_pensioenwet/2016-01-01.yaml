  - number: '16'
    text: |-
      1 Indien een pensioenovereenkomst op de datum van inwerkingtreding van [artikel 16 van de Pensioenwet][ref1]
      voorziet in partnerpensioen, waarbij bij de vaststelling van pensioenaanspraken en pensioenrechten op
      partnerpensioen onderscheid gemaakt wordt tussen een echtgenoot en een geregistreerde partner enerzijds en een
      andere partner in de zin van de pensioenovereenkomst anderzijds, hebben wijzigingen in rechten en verplichtingen
      die ontstaan als gevolg van de gelijkstelling, bedoeld in genoemd artikel, uitsluitend betrekking op
      partnerpensioenaanspraken ten behoeve van een partner van degene die op de datum van inwerkingtreding van genoemd
      artikel deelnemer is.

      2 Indien een pensioenregeling op de datum van inwerkingtreding van
      [artikel 32 van de Wet verplichte beroepspensioenregeling][ref2], zoals dat komt te luiden na de datum
      van inwerkingtreding van deze wet, voorziet in partnerpensioen, waarbij echter bij de vaststelling van
      pensioenaanspraken en pensioenrechten op partnerpensioen onderscheid gemaakt wordt tussen een echtgenoot en
      een geregistreerde partner enerzijds en een andere partner in de zin van de pensioenregeling anderzijds, hebben
      wijzigingen in rechten en verplichtingen die ontstaan als gevolg van de gelijkstelling, bedoeld in genoemd artikel,
      uitsluitend betrekking op partnerpensioenaanspraken ten behoeve van een partner van degene die op de datum van
      inwerkingtreding van genoemd artikel deelnemer is.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel32
    url: https://wetten.overheid.nl/BWBR0020828/2016-01-01#Artikel16
