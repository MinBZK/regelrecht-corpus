      [artikel 20, tweede lid, van de Pensioen- en spaarfondsenwet][ref1] het register, bedoeld in
      [artikel 210 van de Pensioenwet][ref2].

      2 Vanaf de datum van inwerkingtreding van deze wet vormt het register, bedoeld
      in [artikel 71a van de Wet verplichte beroepspensioenregeling][ref3], zoals dit
      luidde tot de datum van inwerkingtreding van deze wet, het register, bedoeld in
      [artikel 204 van de Wet verplichte beroepspensioenregeling][ref4], zoals deze luidt na inwerkingtreding van deze
      wet.


