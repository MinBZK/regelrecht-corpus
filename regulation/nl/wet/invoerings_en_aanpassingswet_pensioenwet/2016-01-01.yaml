  - number: '22'
    text: |-
      1 Tot de datum van inwerkingtreding van de [artikelen 38 tot en met 45 van de Pensioenwet][ref1]
      blijven, in afwijking van [artikel 2][ref2], de [artikelen 8, vierde lid][ref3],
      [17][ref4], [17a][ref5] en [17b van de Pensioen- en spaarfondsenwet][ref6] en [13][ref7] en
      [13a van de Regelen verzekeringsovereenkomsten Pensioen- en spaarfondsenwet][ref8] van toepassing.

      2 Tot de datum van inwerkingtreding van de
      [artikelen 49 tot en met 56 van de Wet verplichte beroepspensioenregeling][ref9], zoals deze komen te
      luiden na de datum van inwerkingtreding van deze wet, blijven de [artikelen 26 tot en met 27][ref10] en
      [31 van de Wet verplichte beroepspensioenregeling][ref11], zoals deze luidden op de peildatum, van toepassing.

      3 Na de datum van inwerkingtreding van [artikel 38 van de Pensioenwet][ref12] wordt door de pensioenuitvoerder
      bij de eerste informatieverstrekking op grond van genoemd artikel na de datum van inwerkingtreding van
      [dat artikel][ref13] aan de deelnemer informatie verstrekt over het karakter van de pensioenovereenkomst, bedoeld
      in [artikel 10 van de Pensioenwet][ref14].

      4 Na de datum van inwerkingtreding van [artikel 49 van de Wet verplichte beroepspensioenregeling][ref15],
      zoals dat komt te luiden na de datum van inwerkingtreding van deze wet, wordt door de pensioenuitvoerder
      bij de eerste informatieverstrekking op grond van genoemd artikel na de datum van inwerkingtreding van
      [dat artikel][ref16] aan de deelnemer informatie verstrekt over het karakter van de pensioenregeling, bedoeld in
      [artikel 28 van de Wet verplichte beroepspensioenregeling][ref17], zoals dat komt te luiden na inwerkingtreding van
      deze wet.

      5 [Artikel 40 van de Pensioenwet][ref18] is van toepassing op degenen die na de datum van inwerkingtreding van
      genoemd artikel gewezen deelnemer zijn geworden en de gewezen deelnemers die zich bij de pensioenuitvoerder hebben
      gemeld met het verzoek om hen de in genoemd artikel bedoelde informatie te verstrekken.

      6 [Artikel 51 van de Wet verplichte beroepspensioenregeling][ref19], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, is van toepassing op degenen die na de datum van inwerkingtreding van genoemd
      artikel gewezen deelnemer zijn geworden en de gewezen deelnemers die zich bij de pensioenuitvoerder hebben gemeld
      met het verzoek om hen de in genoemd artikel bedoelde informatie te verstrekken.

      7 [Artikel 42 van de Pensioenwet][ref20] is van toepassing op degenen van wie de datum van scheiding ligt na de
      datum van inwerkingtreding van genoemd artikel.

      8 [Artikel 53 van de Wet verplichte beroepspensioenregeling][ref21], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, is van toepassing op degenen van wie de datum van scheiding ligt na de datum van
      inwerkingtreding van genoemd artikel.

      9 Ten aanzien van degenen van wie de datum van scheiding voor de datum van inwerkingtreding van
      [artikel 42 van de Pensioenwet][ref22] ligt, geldt de in genoemd artikel opgenomen verplichting van de
      pensioenuitvoerder alleen ten aanzien van degenen die zich bij de pensioenuitvoerder hebben gemeld met het verzoek
      om hen de in genoemd artikel bedoelde informatie te verstrekken.

      10 Ten aanzien van degenen van wie de datum van scheiding voor de datum van inwerkingtreding van
      [artikel 53 van de Wet verplichte beroepspensioenregeling][ref23], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, ligt, geldt de in genoemd artikel opgenomen verplichting van de pensioenuitvoerder
      alleen ten aanzien van degenen die zich bij de pensioenuitvoerder hebben gemeld met het verzoek om hen de in
      genoemd artikel bedoelde informatie te verstrekken.

      11 [Artikel 43 van de Pensioenwet][ref24] is van toepassing op degenen die na de datum van inwerkingtreding van
      genoemd artikel pensioengerechtigd geworden zijn.

      12 [Artikel 54 van de Wet verplichte beroepspensioenregeling][ref25], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, is van toepassing op degenen die na de datum van inwerkingtreding van genoemd
      artikel pensioengerechtigd geworden zijn.


