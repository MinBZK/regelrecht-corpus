  - number: '67'
    text: |-
      Bij algemene maatregel van bestuur kunnen met het oog op de goede invoering van de [Pensioenwet][ref1] en deze wet
      regels worden gesteld waarbij zo nodig kan worden afgeweken van het bepaalde bij of krachtens voornoemde wet of
      deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0020809
    url: https://wetten.overheid.nl/BWBR0020828/2016-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0020809
  - number: '73'
    text: |-
      1 Voor de plaatsing in het Staatsblad stelt Onze Minister de nummering van de artikelen van de [Pensioenwet][ref1]
      opnieuw vast en brengt hij de in de [Pensioenwet][ref2] voorkomende aanhalingen van de artikelen met de nieuwe
      nummering in overeenstemming.

      2 De tekst van de [Wet verplichte beroepspensioenregeling][ref3], zoals deze komt te luiden na inwerkingtreding van
      deze wet, wordt in het Staatsblad geplaatst. Voor de plaatsing in het Staatsblad stelt Onze Minister de nummering
      van de artikelen opnieuw vast en brengt hij de in de [Wet verplichte beroepspensioenregeling][ref4] voorkomende
      aanhalingen van de artikelen met de nieuwe nummering in overeenstemming.

      3 Voor de plaatsing van deze wet in het Staatsblad brengt Onze Minister de aanhalingen van de artikelen in deze
      wet van de [Wet verplichte beroepspensioenregeling][ref5] en van de [Pensioenwet][ref6] in overeenstemming met de
      vastgestelde nummering van die wetten.


