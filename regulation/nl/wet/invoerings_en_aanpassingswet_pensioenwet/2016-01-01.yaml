  - number: '64'
    text: |-
      1 Indien een overdragend pensioenfonds een pensioenuitvoerder is als bedoeld in [artikel 63][ref1] van deze wet,
      geldt in afwijking van [artikel 72, onderdeel a, van de Pensioenwet][ref2] geen plicht tot waardeoverdracht indien
      de financiele toestand van het pensioenfonds dat naar het oordeel van De Nederlandsche Bank N.V. niet toelaat.

      2 De plicht tot waardeoverdracht van het overdragende pensioenfonds herleeft overeenkomstig
      [artikel 74 van de Pensioenwet][ref3] wanneer de financiele toestand van het pensioenfonds dat naar het oordeel van
      De Nederlandsche Bank N.V. op een later tijdstip wel toelaat.

      3 Indien een overdragend beroepspensioenfonds een pensioenuitvoerder is als bedoeld in
      [artikel 214, derde lid, van de Wet verplichte beroepspensioenregeling][ref4], zoals
      dat komt te luiden na de datum van inwerkingtreding van deze wet, geldt in afwijking van
      [artikel 83, onderdeel a, van de Wet verplichte beroepspensioenregeling][ref5], zoals dat komt te luiden na de
      datum van inwerkingtreding van deze wet, geen plicht tot waardeoverdracht indien de financiele toestand van het
      beroepspensioenfonds dat naar het oordeel van De Nederlandsche Bank N.V. niet toelaat.

      4 De plicht tot waardeoverdracht van het overdragende beroepspensioenfonds herleeft overeenkomstig
      [artikel 85 van de Wet verplichte beroepspensioenregeling][ref6], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, wanneer de financiele toestand van het beroepspensioenfonds dat naar het oordeel van
      De Nederlandsche Bank N.V. op een later tijdstip wel toelaat.


