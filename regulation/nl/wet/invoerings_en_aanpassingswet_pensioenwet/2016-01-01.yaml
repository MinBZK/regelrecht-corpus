  - number: '7'
    text: |-
      1 Indien een persoon die op de peildatum verbonden is aan een onderneming en pensioenaanspraken verwerft, op
      de datum van inwerkingtreding van [artikel 1 van de Pensioenwet][ref1] geen werknemer is als bedoeld in de
      [Pensioenwet][ref2], wordt hij gelijkgesteld met een werknemer als bedoeld in [die wet][ref3].

      2 Het eerste lid is niet van toepassing op de directeur-grootaandeelhouder, bedoeld in de [Pensioenwet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020809
      [ref3]: https://wetten.overheid.nl/BWBR0020809
