  - number: '5'
    text: |-
      Indien op de peildatum een spaarfonds als bedoeld in [artikel 3 van de Pensioen- en spaarfondsenwet][ref1]
      werkzaam is, blijft in afwijking van [artikel 2][ref2] op dit spaarfonds de [Pensioen- en spaarfondsenwet][ref3]
      van toepassing, met dien verstande dat vanaf een jaar na de datum van inwerkingtreding van
      [artikel 1 van de Pensioenwet][ref4] geen bijdragen meer aan het spaarfonds kunnen worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020828#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002089
