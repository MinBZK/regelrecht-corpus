  - number: '9'
    text: |-
      Indien uiterlijk op de peildatum een geldelijke, vastgestelde uitkering is overeengekomen voor een gewezen
      werknemer die wordt gedaan bij wijze van inkomensvoorziening bij ouderdom in verband met vervroegde uittreding
      wordt deze gelijkgesteld met een uitkering als bedoeld in [artikel 2, vierde lid, van de Pensioenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel2
    url: https://wetten.overheid.nl/BWBR0020828/2016-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '2'
  - number: '10'
    text: |-
      Indien uiterlijk op de peildatum een geldelijke, vastgestelde uitkering is overeengekomen voor een gewezen
      werknemer die wordt gedaan bij wijze van inkomensvoorziening bij ouderdom en deze uitkering is gebaseerd op een
      regeling die leidt tot uitkeringen vanaf een bepaalde leeftijd aan werknemers die werkzaamheden verrichten die door
      de werkgever als substantieel bezwarend zijn aangemerkt, wordt deze gelijkgesteld met een uitkering als bedoeld in
      [artikel 2, vijfde lid, van de Pensioenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel2
    url: https://wetten.overheid.nl/BWBR0020828/2016-01-01#Artikel10
