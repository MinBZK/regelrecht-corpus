      1 [Artikel 61 van de Pensioenwet][ref1] is van toepassing op pensioenaanspraken die zijn opgebouwd na de datum van
      inwerkingtreding van genoemd artikel, tenzij in de pensioenovereenkomst is overeengekomen dat dit keuzerecht ook
      betrekking heeft op pensioenaanspraken die voor de datum van inwerkingtreding van genoemd artikel zijn opgebouwd.

      2 [Artikel 73 van de Wet verplichte beroepspensioenregeling][ref2], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, is van toepassing op pensioenaanspraken die zijn opgebouwd na de datum van
      inwerkingtreding van genoemd artikel, tenzij in de pensioenregeling is overeengekomen dat dit keuzerecht ook
      betrekking heeft op pensioenaanspraken die voor de datum van inwerkingtreding van genoemd artikel zijn opgebouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel61
