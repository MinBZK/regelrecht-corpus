  - number: 25a
    text: |-
      1 Tot de datum van inwerkingtreding van [artikel 58 van de Pensioenwet][ref1] blijven, in afwijking van
      [artikel 2][ref2], de [artikelen 8, vijfde en zesde lid, van de Pensioen- en spaarfondsenwet][ref3] en
      [9, vierde en vijfde lid, van de Regelen verzekeringsovereenkomsten Pensioen- en spaarfondsenwet][ref4] van
      toepassing.

      2 [Artikel 58 van de Pensioenwet][ref5] is niet van toepassing op meeverzekerde stijgingen voor de datum van
      inwerkingtreding van genoemd artikel.

      3 Tot de datum van inwerkingtreding van [artikel 69 van de Wet verplichte beroepspensioenregeling][ref6],
      zoals dat komt te luiden na de datum van inwerkingtreding van deze wet, blijven de [artikelen 44][ref7] en
      [45, van de Wet verplichte beroepspensioenregeling][ref8], zoals deze luiden op de peildatum, van toepassing.

      4 [Artikel 69 van de Wet verplichte beroepspensioenregeling][ref9], zoals dat komt te luiden na de datum
      van inwerkingtreding van deze wet, is niet van toepassing op meeverzekerde stijgingen voor de datum van
      inwerkingtreding van genoemd artikel.

      3 [Artikel 58 van de Pensioenwet][ref10] is niet van toepassing op meeverzekerde stijgingen na de datum van
      inwerkingtreding van [genoemd artikel][ref11], voor zover de meeverzekerde stijging betrekking heeft op een
      premievrije voortzetting en het recht op de premievrije voortzetting is ontstaan voor de datum van inwerkingtreding
      van [genoemd artikel][ref12].


