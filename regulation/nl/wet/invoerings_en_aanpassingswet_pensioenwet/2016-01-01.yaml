      1 Een besluit tot benoeming van een of meer personen als curator op grond van
      [artikel 23l van de Pensioen- en spaarfondsenwet][ref1], wordt na de datum van inwerkingtreding
      van [artikel 1 van de Pensioenwet][ref2] aangemerkt als een besluit als bedoeld in
      [artikel 172 van de Pensioenwet][ref3].

      2 De toezichthouder kan na de datum van inwerkingtreding van [artikel 1 van de Pensioenwet][ref4] besluiten een of
      meer personen als curator ten aanzien van alle of bepaalde organen van een pensioenfonds te benoemen nadat door een
      pensioenfonds binnen de gestelde termijn niet of niet volledig gevolg is gegeven aan een aanwijzing op grond van de
      [Pensioen- en spaarfondsenwet][ref5].

      3 Een besluit tot benoeming van een of meer personen als curator op grond van
      [artikel 82 van de Wet verplichte beroepspensioenregeling][ref6], zoals deze luidde voor de datum van
      inwerkingtreding van deze wet, wordt na de datum van inwerkingtreding van deze wet aangemerkt als een besluit als
      bedoeld in [artikel 167 van de Wet verplichte beroepspensioenregeling][ref7].

      4 De toezichthouder kan na de datum van inwerkingtreding van deze wet besluiten een of meer personen als
      curator ten aanzien van alle of bepaalde organen van een beroepspensioenfonds te benoemen nadat door een
      beroepspensioenfonds binnen de gestelde termijn niet of niet volledig gevolg is gegeven aan een aanwijzing op grond
      van de [Wet verplichte beroepspensioenregeling][ref8], zoals deze luidde voor de datum van inwerkingtreding van
      deze wet.


