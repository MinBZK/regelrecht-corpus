  - number: '25'
    text: |-
      1 [Artikel 57 van de Pensioenwet][ref1] is van toepassing indien na de datum van inwerkingtreding van genoemd
      artikel een partnerrelatie van een deelnemer of een gewezen deelnemer eindigt door scheiding.

      2 In afwijking van het eerste lid is [artikel 57 van de Pensioenwet][ref2] niet van toepassing indien:

      a. de partnerrelatie van een gewezen deelnemer met een partner in de zin van de pensioenovereenkomst eindigt na de
      datum van inwerkingtreding van genoemd artikel;

      b. de gewezen deelnemer voor de datum van inwerkingtreding van genoemd artikel al gewezen deelnemer was geworden;
      en

      c. de pensioenovereenkomst ten tijde van de datum van inwerkingtreding van genoemd artikel niet voorziet in een
      bijzonder partnerpensioen.

      3 [Artikel 68 van de Wet verplichte beroepspensioenregeling][ref3], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, is van toepassing indien na de datum van inwerkingtreding van genoemd artikel een
      partnerrelatie van een deelnemer of een gewezen deelnemer eindigt door scheiding.

      4 In afwijking van het derde lid is [artikel 68 van de Wet verplichte beroepspensioenregeling][ref4], zoals dat
      komt te luiden na de datum van inwerkingtreding van deze wet, niet van toepassing indien:

      a. de partnerrelatie van een gewezen deelnemer met een partner in de zin van de pensioenregeling eindigt na de
      datum van inwerkingtreding van genoemd artikel;

      b. de gewezen deelnemer voor de datum van inwerkingtreding van genoemd artikel al gewezen deelnemer was geworden;
      en

      c. de pensioenregeling ten tijde van de datum van inwerkingtreding van genoemd artikel niet voorziet in een
      bijzonder partnerpensioen.


