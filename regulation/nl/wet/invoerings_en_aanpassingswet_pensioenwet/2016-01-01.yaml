  - number: '96'
    text: |-
      1 Als de uitoefening van het bedrijf van levensverzekeraar of het bedrijf van schadeverzekeraar wordt niet
      beschouwd:

      a. het sluiten of afwikkelen van levensverzekeringen onderscheidenlijk schadeverzekeringen voor eigen
      rekening door ondernemingen of pensioeninstellingen die voor eigen rekening geen andere levensverzekeringen of
      schadeverzekeringen sluiten of afwikkelen dan die welke dienen ter uitvoering van toezeggingen als bedoeld in
      [artikel 19][ref1]; en

      b. het handelen van een ondernemingsspaarfonds ter uitvoering van een door een werkgever getroffen regeling tot
      sparen voor een uitkering bij wijze van oudedagsvoorziening zolang sprake is van een spaarfonds als bedoeld in
      [artikel 5][ref2].

      2 De [Wet op het financieel toezicht][ref3] is, met uitzondering van het [Algemeen Deel][ref4] en het
      [Deel Gedragstoezicht financiële markten][ref5], niet van toepassing zolang sprake is van spaarfondsen als bedoeld
      in [artikel 5][ref6] en van:

      a. het verlenen van financiële diensten door ondernemingsspaarfondsen voorzover zij die financiële diensten
      verlenen aan de onderneming waarmee zij zijn verbonden; en

      b. het beheren van individuele vermogens ten behoeve van ondernemingsspaarfondsen als bedoeld in onderdeel a of
      daaraan gelieerde fondsen door personen die zijn verbonden aan het fonds waaraan deze financiële dienst wordt
      verleend.


