  - number: '23'
    text: |-
      1 [Artikel 52 van de Pensioenwet][ref1] geldt met ingang van de datum van inwerkingtreding van genoemd artikel
      ten aanzien van de voor en na de datum van inwerkingtreding van genoemd artikel verworven en nog te verwerven
      pensioenaanspraken indien en zolang de deelnemer of de gewezen deelnemer beleggingsvrijheid heeft.

      2 [Artikel 52 van de Pensioenwet][ref2] is in het eerste jaar na inwerkingtreding van genoemd artikel niet van
      toepassing indien een werkgever de pensioenregeling voor de datum van inwerkingtreding van genoemd artikel bij een
      verzekeraar heeft ondergebracht.

      3 Op degene die gewezen deelnemer is geworden voor de datum van inwerkingtreding van
      [artikel 52, tweede lid, van de Pensioenwet][ref3], is genoemd artikel van toepassing indien zijn adres bij de
      pensioenuitvoerder bekend is of hij zich bij de pensioenuitvoerder heeft gemeld.

      4 [Artikel 63 van de Wet verplichte beroepspensioenregeling][ref4], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, geldt met ingang van de datum van inwerkingtreding van genoemd artikel ten
      aanzien van de voor en na de datum van inwerkingtreding van genoemd artikel verworven en nog te verwerven
      pensioenaanspraken indien en zolang de deelnemer of de gewezen deelnemer beleggingsvrijheid heeft.

      5 [Artikel 63 van de Wet verplichte beroepspensioenregeling][ref5], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, is in het eerste jaar na inwerkingtreding van genoemd artikel niet van toepassing
      indien de beroepspensioenvereniging de pensioenregeling voor de datum van inwerkingtreding van genoemd artikel bij
      een verzekeraar heeft ondergebracht.

      6 Op degene die gewezen deelnemer is geworden voor de datum van inwerkingtreding van
      [artikel 63, tweede lid, van de Wet verplichte beroepspensioenregeling][ref6], zoals dat komt te luiden na de datum
      van inwerkingtreding van deze wet, is genoemd artikel van toepassing indien zijn adres bij de pensioenuitvoerder
      bekend is of hij zich bij de pensioenuitvoerder heeft gemeld.


