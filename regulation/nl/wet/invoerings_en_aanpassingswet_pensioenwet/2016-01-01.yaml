      1 [Artikel 80 van de Pensioenwet][ref1] is van toepassing indien de in het eerste lid van genoemd artikel bedoelde
      pensioendatum is gelegen na de datum van inwerkingtreding van genoemd artikel.

      2 [Artikel 88 van de Wet verplichte beroepspensioenregeling][ref2], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, is van toepassing indien de in het eerste lid van genoemd artikel bedoelde
      pensioendatum is gelegen na de datum van inwerkingtreding van genoemd artikel.

      3 Onder pensioendatum als bedoeld in het eerste en tweede lid wordt verstaan: de reguliere pensioendatum.


