  - number: '17'
    text: |-
      1 [Artikel 21, eerste lid, van de Pensioenwet][ref1] is niet van toepassing op pensioenovereenkomsten die zijn
      gesloten voor de datum van inwerkingtreding van genoemd artikellid.

      2 Tot de datum van inwerkingtreding van [artikel 21, eerste lid, van de Pensioenwet][ref2] blijft, in afwijking
      van [artikel 2][ref3], [artikel 17, eerste lid, van de Pensioen- en spaarfondsenwet][ref4] van toepassing. Is de
      pensioenuitvoerder een verzekeraar dan is [artikel 17, eerste lid, van de Pensioen- en spaarfondsenwet][ref5] van
      overeenkomstige toepassing.

      3 [Artikel 48, eerste lid, van de Wet verplichte beroepspensioenregeling][ref6], zoals dat komt te luiden na de
      datum van inwerkingtreding van deze wet, is niet van toepassing op pensioenregelingen die zijn gesloten voor de
      datum van inwerkingtreding van genoemd artikel.

      4 Tot de datum van inwerkingtreding van
      [artikel 48, eerste lid, van de Wet verplichte beroepspensioenregeling][ref7], zoals dat komt te luiden na de datum
      van inwerkingtreding van deze wet, blijft [artikel 25 van de Wet verplichte beroepspensioenregeling][ref8], zoals
      dit luidde op de peildatum, van toepassing.


