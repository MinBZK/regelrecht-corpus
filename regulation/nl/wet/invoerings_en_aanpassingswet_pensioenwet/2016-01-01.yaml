  - number: '32'
    text: |-
      1 De [artikelen 71 tot en met 74 van de Pensioenwet][ref1] zijn van toepassing indien de verwerving van
      pensioenaanspraken, bedoeld in [artikel 71, derde lid, van de Pensioenwet][ref2] op grond van de pensioenregeling
      van een nieuwe werkgever begint na de datum van inwerkingtreding van laatstgenoemd artikel.

      2 In afwijking van het eerste lid geldt dat wanneer de ontvangende pensioenuitvoerder de uitvoerder is van een
      beroepspensioenregeling de [artikelen 71 tot en met 74 van de Pensioenwet][ref3] van toepassing zijn wanneer
      de beëindiging van de dienstbetrekking dan wel de beëindiging van de deelneming plaatsvindt na de datum van
      inwerkingtreding van [artikel 71 van de Pensioenwet][ref4].

      3 Indien op grond van het tweede lid geen plicht tot waardeoverdracht bestaat,
      geldt een bevoegdheid tot waardeoverdracht mits wordt voldaan aan de in
      [artikel 71, eerste lid, onderdeel a, b en c en vierde lid, van de Pensioenwet][ref5] genoemde voorwaarden.

      4 De [artikelen 82 tot en met 85 van de Wet verplichte beroepspensioenregeling][ref6], zoals deze komen te luiden
      na de datum van inwerkingtreding van deze wet, zijn van toepassing indien de verwerving van pensioenaanspraken als
      bedoeld in [artikel 82, derde lid, van de Wet verplichte beroepspensioenregeling][ref7], zoals dat komt te luiden
      na de datum van inwerkingtreding van deze wet, begint na de datum van inwerkingtreding van laatstgenoemd artikel.

      5 In afwijking van het vierde lid geldt dat wanneer de ontvangende pensioenuitvoerder de uitvoerder is van een
      pensioenregeling de [artikelen 82 tot en met 85 van de Wet verplichte beroepspensioenregeling][ref8], zoals deze
      komen te luiden na inwerkingtreding van deze wet, van toepassing zijn wanneer de beëindiging van de deelneming
      plaatsvindt na de datum van inwerkingtreding van [artikel 82 van de Wet verplichte beroepspensioenregeling][ref9],
      zoals dat komt te luiden na de datum van inwerkingtreding van deze wet.

      6 Indien op grond van het vijfde lid geen plicht tot waardeoverdracht bestaat,
      geldt een bevoegdheid tot waardeoverdracht mits wordt voldaan aan de in
      [artikel 82, eerste lid, onderdeel a, b en c en vierde lid, van de Wet verplichte beroepspensioenregeling][ref10],
      zoals dat komt te luiden na de datum van inwerkingtreding van deze wet, genoemde voorwaarden.


