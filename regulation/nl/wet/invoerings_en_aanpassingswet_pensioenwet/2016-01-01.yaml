      1 Een geldelijke, vastgestelde uitkering die op basis van
      [artikel 4 van het Uitvoeringsbesluit pensioenaspecten Sociaal Akkoord 2004][ref1] wordt overeengekomen is geen
      pensioen als bedoeld in de [Pensioenwet][ref2] of de [Wet verplichte beroepspensioenregeling][ref3] voor zover deze
      nog niet is gefinancierd.

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het eerste lid.

      3 Na inwerkingtreding van dit artikel berust het [Uitvoeringsbesluit pensioenaspecten Sociaal Akkoord 2004][ref4]
      mede op het tweede lid.


