        artikel: '1'
  - number: '4'
    text: |-
      1 Indien een op de peildatum bestaand bedrijfstakpensioenfonds of ondernemingspensioenfonds als bedoeld in
      [artikel 1, eerste lid, onderdeel b onderscheidenlijk c, van de Pensioen- en spaarfondsenwet][ref1] op de datum van
      inwerkingtreding van [artikel 1 van de Pensioenwet][ref2] niet voldoet aan de definitie van pensioenfonds, bedoeld
      in [artikel 1 van de Pensioenwet][ref3], omdat het pensioenfonds slechts ten behoeve van één deelnemer, gewezen
      deelnemer of nabestaande werkzaam is, wordt dit pensioenfonds gelijkgesteld met een pensioenfonds in de zin van
      de [Pensioenwet][ref4].

      2 In afwijking van het eerste lid wordt het in dat lid bedoelde pensioenfonds een jaar na inwerkingtreding
      van [artikel 1 van de Pensioenwet][ref5] gelijkgesteld met een pensioenfonds in de zin van de
      [Pensioenwet][ref6], indien het pensioenfonds werkzaam is ten behoeve van een directeur-grootaandeelhouder waarop
      [artikel 8, eerste en tweede lid][ref7], van deze wet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel1
