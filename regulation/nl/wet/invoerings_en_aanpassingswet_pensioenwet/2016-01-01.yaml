      in dat artikel plaats vindt na de datum van inwerkingtreding van genoemd artikel.

      2 [Artikel 76 van de Wet verplichte beroepspensioenregeling][ref2], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, is van toepassing indien vervreemding of een andere handeling als bedoeld in dat
