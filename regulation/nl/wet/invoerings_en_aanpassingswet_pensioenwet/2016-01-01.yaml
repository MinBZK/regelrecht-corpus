preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de invoering van de Pensioenwet en enkele daarmee
    samenhangende onderwerpen te regelen, zulks onder intrekking van de Pensioen- en spaarfondsenwet;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0020828/2016-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - Pensioen- en spaarfondsenwet: de [Pensioen- en spaarfondsenwet][ref1] en de daarop berustende bepalingen zoals
      deze luidden op de peildatum;
        - peildatum: de dag voorafgaand aan de inwerkingtreding van [artikel 1 van de Pensioenwet][ref2].

      2 De definities van [artikel 1 van de Pensioenwet][ref3] zijn van overeenkomstige
      toepassing op de [artikelen 7][ref4], [8][ref5], [9][ref6], [10][ref7], het
      [eerste lid van de artikelen 11 tot en met 17][ref8], [18][ref9], [20, eerste lid][ref10],
      [21, eerste lid][ref11], [22, derde, vijfde, zevende, negende en elfde lid][ref12], [23, eerste lid][ref13],
      [24, eerste lid][ref14], [24a, eerste lid][ref15], [25, eerste en tweede lid][ref16],
      [26, eerste lid][ref17], [28, eerste, tweede, derde en vierde lid][ref18], [29, eerste en tweede lid][ref19],
      [30, eerste en tweede lid][ref20], [32, eerste, tweede en derde lid][ref21], [33, het eerste lid][ref22]
      van de [artikelen 35 tot en met 38][ref23], [42, eerste lid][ref24], [44, eerste lid][ref25], [48][ref26],
      [53, tweede lid][ref27], [59, derde en vierde lid][ref28], [63][ref29], [64][ref30] en [66][ref31] van deze wet.

      3 De definities van [artikel 1 van de Wet verplichte beroepspensioenregeling][ref32], zoals deze komt
      te luiden na de datum van inwerkingtreding van deze wet, zijn van overeenkomstige toepassing op het
      [tweede lid van de artikelen 11 tot en met 16][ref33], [17, derde lid][ref34], [20, tweede lid][ref35],
      [21, tweede lid][ref36], [22, vierde, zesde, achtste, tiende en twaalfde lid][ref37],
      [23, tweede lid][ref38], [24, tweede lid][ref39], [24a, tweede lid][ref40], [25, derde en vierde lid][ref41],
      [26, tweede lid][ref42], [28, vijfde, zesde, zevende en achtste lid][ref43], [29, derde en vierde lid][ref44],
      [30, derde en vierde lid][ref45], [32, vierde, vijfde en zesde lid][ref46], het
      [tweede lid van de artikelen 35 tot en met 38][ref47], [42, tweede lid][ref48], [44, tweede lid][ref49] en
      [53, vierde lid][ref50] van deze wet.


