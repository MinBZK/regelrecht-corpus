  - number: 24a
    text: |-
      1 [Artikel 55, vijfde lid, van de Pensioenwet][ref1] is van toepassing indien de beëindiging van de deelneming
      plaats vindt na de datum van inwerkingtreding van genoemd artikellid.

      2 [Artikel 66, vijfde lid, van de Wet verplichte beroepspensioenregeling][ref2], zoals dat komt te luiden na de
      datum van inwerkingtreding van deze wet, is van toepassing indien de beëindiging van de deelneming plaats vindt na
      de datum van inwerkingtreding van genoemd artikellid.

      3 [Artikel 56, van de Pensioenwet][ref3] is van toepassing indien het opnemen van onbetaald verlof plaats vindt na
      de datum van inwerkingtreding van genoemd artikel.

      4 [Artikel 67 van de Wet verplichte beroepspensioenregeling][ref4], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, is van toepassing indien het opnemen van onbetaald verlof plaats vindt na de datum
      van inwerkingtreding van genoemd artikel.


