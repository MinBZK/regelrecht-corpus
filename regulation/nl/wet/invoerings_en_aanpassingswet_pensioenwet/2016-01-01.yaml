  - number: '59'
    text: |-
      1 Een ontheffing die is verleend van de [artikelen 3][ref1], [5, eerste lid][ref2], en
      [8b van de Pensioen- en spaarfondsenwet][ref3] op grond van [artikel 29 van de Pensioen- en spaarfondsenwet][ref4]
      vervalt een jaar na de datum van inwerkingtreding van [artikel 1 van de Pensioenwet][ref5].

      2 Een ontheffing die is verleend van [artikel 6 van de Pensioen- en spaarfondsenwet][ref6] op grond van
      [artikel 29 van de Pensioen- en spaarfondsenwet][ref7] blijft van kracht.

      3 Een ontheffing die is verleend van [artikel 6a van de Pensioen- en spaarfondsenwet][ref8] op grond van
      [artikel 29 van de Pensioen- en spaarfondsenwet][ref9] vervalt een jaar na de datum van inwerkingtreding van
      [artikel 1 van de Pensioenwet][ref10].

      4 Een ontheffing die is verleend van [artikel 9b, tweede lid, van de Pensioen- en spaarfondsenwet][ref11] op grond
      van [artikel 29 van de Pensioen- en spaarfondsenwet][ref12] blijft van kracht tot 23 september 2010, tenzij een
      pensioenfonds bijdragen ontvangt van een werkgever uit een andere lidstaat.

      5 Een ontheffing die is verleend van
      [artikel 10b, eerste tot en met derde lid, van de Pensioen- en spaarfondsenwet][ref13] op grond van
      [artikel 29 van de Pensioen- en spaarfondsenwet][ref14] wordt vanaf de datum van inwerkingtreding
      van [artikel 1 van de Pensioenwet][ref15] aangemerkt als een ontheffing die is verleend van
      [artikel 147 van de Pensioenwet][ref16] op grond van [artikel 212 van de Pensioenwet][ref17].

      6 Een ontheffing die is verleend van [artikel 53, eerste lid, van de Wet verplichte beroepspensioenregeling][ref18],
      zoals die luidde voor de datum van inwerkingtreding van deze wet, op grond van
      [artikel 84 van de Wet verplichte beroepspensioenregeling][ref19], zoals die luidde voor de datum van
      inwerkingtreding van deze wet, vervalt een jaar na inwerkingtreding van deze wet.

      7 Een ontheffing die is verleend van
      [artikel 63, eerste tot en met derde lid, van de Wet verplichte beroepspensioenregeling][ref20],
      zoals die luidde voor de datum van inwerkingtreding van deze wet, op grond van
      [artikel 84 van de Wet verplichte beroepspensioenregeling][ref21], zoals die luidde voor de datum van
      inwerkingtreding van deze wet, wordt vanaf de datum van inwerkingtreding van deze wet aangemerkt als
      een ontheffing die is verleend van [artikel 142 van de Wet verplichte beroepspensioenregeling][ref22],
      zoals dat komt te luiden vanaf de datum van inwerkingtreding van deze wet, op grond van
      [artikel 206 van de Wet verplichte beroepspensioenregeling][ref23], zoals dat komt te luiden vanaf de datum van
      inwerkingtreding van deze wet.

      8 Voorschriften die zijn verbonden en beperkingen die zijn gesteld aan een ontheffing die is verleend op grond
      van de [Pensioen- en spaarfondsenwet][ref24] respectievelijk de [Wet verplichte beroepspensioenregeling][ref25],
      zoals deze luidde voor de datum van inwerkingtreding van deze wet, berusten vanaf de datum van inwerkingtreding
      van [artikel 1 van de Pensioenwet][ref26] respectievelijk vanaf de datum van inwerkingtreding van deze wet op de
      [Pensioenwet][ref27] respectievelijk de [Wet verplichte beroepspensioenregeling][ref28].


