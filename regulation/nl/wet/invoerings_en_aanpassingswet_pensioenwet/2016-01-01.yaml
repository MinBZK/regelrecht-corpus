      1 Indien een verzekeraar op de peildatum een vrijwillige voortzetting uitvoert die niet overeenkomstig
      [artikel 54 van de Pensioenwet][ref1] in de tijd beperkt wordt, kan de verzekeraar deze voortzetting voor de
      betreffende deelnemer blijven uitvoeren als pensioenregeling in de zin van de [Pensioenwet][ref2].

      2 Indien een verzekeraar op de peildatum een vrijwillige voortzetting uitvoert die niet overeenkomstig
      [artikel 65 van de Wet verplichte beroepspensioenregeling][ref3], zoals dat komt te luiden na de datum van
      inwerkingtreding van deze wet, in de tijd beperkt wordt, kan de verzekeraar deze voortzetting voor de betreffende
      deelnemer blijven uitvoeren als pensioenregeling in de zin van de [Wet verplichte beroepspensioenregeling][ref4].


