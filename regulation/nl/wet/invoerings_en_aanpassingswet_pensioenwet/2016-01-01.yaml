  - number: '2'
    text: |-
      De [Pensioen- en spaarfondsenwet][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002089
    url: https://wetten.overheid.nl/BWBR0020828/2016-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002089
  - number: 2a
    text: |-
      1 Op een verzoek ingediend op grond van de [Pensioen- en spaarfondsenwet][ref1], ten
      aanzien waarvan op de peildatum nog geen beslissing is genomen, blijft, in afwijking van
      [artikel 2, de Pensioen- en spaarfondsenwet][ref2] van toepassing, tenzij in deze wet anders wordt bepaald.

      2 Op een verzoek ingediend op grond van de [Wet verplichte beroepspensioenregeling][ref3], zoals deze
      luidde op de peildatum, ten aanzien waarvan op de peildatum nog geen beslissing is genomen, blijft de
      [Wet verplichte beroepspensioenregeling][ref4], zoals deze luidde op de peildatum, van toepassing, tenzij in deze
      wet anders wordt bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002089
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0018831
      [ref4]: https://wetten.overheid.nl/BWBR0018831
    url: https://wetten.overheid.nl/BWBR0020828/2016-01-01#Artikel2a
    references:
