  - number: 1.j
    text: |-
      *Coördinatiebesluit:* [Coördinatiebesluit organisatie, bedrijfsvoering en informatiesystemen rijksdienst][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0029514
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0029514
  - number: 1.k
    text: |-
      *digitalisering:* geheel aan ontwikkelingen binnen de overheid en in de samenleving die te maken hebben met het
      toenemend gebruik van ICT, digitale informatie, data en informatiesystemen;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel1
  - number: 1.l
    text: |-
      *grote ICT-component:* ICT-component vallend onder de definitie die in het Handboek portfoliomanagement Rijk wordt
      gegeven aan grote ICT-component;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel1
  - number: 1.m
    text: '*ICT:* Informatie- en communicatietechnologie;'
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel1
  - number: 1.n
    text: |-
      *informatiebeveiliging:* proces van vaststellen van de vereiste betrouwbaarheid van informatiesystemen in termen
      van vertrouwelijkheid, beschikbaarheid en integriteit alsmede het treffen, onderhouden en controleren van een
      samenhangend pakket van bijbehorende maatregelen;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel1
  - number: 1.o
    text: |-
      *informatiesysteem:* samenhangend geheel van gegevensverzamelingen, procedures, processen en programmatuur alsmede
      de voor het informatiesysteem getroffen voorzieningen voor opslag, verwerking en communicatie;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel1
  - number: 1.p
    text: |-
      *informatievoorziening:* geheel van mensen, middelen, informatiesystemen en maatregelen, gericht op de
      informatiebehoefte van een organisatie;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel1
  - number: 1.q
    text: |-
      *portfoliomanagement:* proces van inventarisatie, registratie en actualisatie van wijzigingen in
      informatiesystemen, vastgelegd in een portfolio.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel1
  - number: '2.1'
    text: |-
      Dit besluit geldt voor de rijksdienst, zijnde de kerndepartementen en de daaronder ressorterende dienstonderdelen
      inclusief de gevestigde diensten op Caribisch Nederland.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel2
  - number: '2.2'
    text: |-
      Bij de Rijksdienst Caribisch Nederland (RCN) is een CIO Rijksdienst Caribisch Nederland (CIO RCN) aangesteld, die
      rechtstreeks ressorteert onder de CIO Binnenlandse Zaken en Koninkrijksrelaties. De CIO RCN heeft dezelfde taken en
      verantwoordelijkheden als de departementale CIO bedoeld in [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044613#Artikel3
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0044613
        artikel: '3'
        paragraaf: '2'
  - number: '3.1'
    text: |-
      De minister die belast is met de leiding van een ministerie draagt zorg voor de aanstelling van een departementale
      CIO die rechtstreeks ressorteert onder de secretaris-generaal van het ministerie.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel3
  - number: '3.2'
    text: |-
      De departementale CIO is belast met de ontwikkeling en coördinatie van het informatievoorzienings- en
      digitaliseringsbeleid en het zorgdragen voor de ontwikkeling en het beheer van de informatiesystemen van het
      ministerie conform dit beleid.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel3
  - number: '3.3'
    text: |-
      De departementale CIO is tevens belast met het inrichten van het CIO-stelsel voor het ministerie en de onder haar
      ressorterende dienstonderdelen.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel3
  - number: '3.4'
    text: De departementale CIO is lid van de bestuursraad van het ministerie.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel3
  - number: '3.5'
    text: Een CIO beschikt over een CIO-office.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel3
  - number: '3.6'
    text: |-
      Het CIO-office wordt zodanig ingericht dat over voldoende kennis en ervaring wordt beschikt om de taak, bedoeld in
      [artikel 4][ref1] uit te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0044613#Artikel4
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0044613
        artikel: '4'
        paragraaf: '2'
  - number: '4'
    text: |-
      De minister die belast is met de leiding van een ministerie draagt aan de departementale CIO met betrekking tot het
      ministerie in elk geval de volgende taken op:
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel4
  - number: 4.a
    text: |-
      het adviseren van het lijnmanagement en de minister over het beleid ten aanzien van informatievoorziening en
      digitalisering;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel4
  - number: 4.b
    text: |-
      het adviseren van het lijnmanagement en de minister over de implicaties voor informatievoorziening en
      digitalisering van (voorgenomen) wet- en regelgeving, beleids- en uitvoeringstrajecten en investeringen;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel4
  - number: 4.c
    text: |-
      het opstellen, beheren en zorgdragen voor de uitvoering van een meerjarig informatieplan voor het ministerie met
      een financiële paragraaf;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel4
  - number: 4.d
    text: |-
      het richten op en stimuleren van digitale transformatie en technologisch gedreven innovatie binnen het ministerie
      door het investeren in een cultuur van kennisdeling en door het lerend vermogen op het gebied van digitalisering
      binnen het ministerie te bevorderen;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel4
  - number: 4.e
    text: |-
      het met inachtneming van toepasselijke rijksbrede kaders en ICT-voorzieningen zorgdragen voor de ontwikkeling
      en coördinatie van informatievoorzieningsbeleid en digitaliseringsbeleid en de ontwikkeling en het beheer van de
      informatiesystemen van het ministerie;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel4
  - number: 4.f
    text: |-
      het toezien op naleving van de kaders gesteld op grond van de [artikelen 2][ref1] en
      [6 van het Coördinatiebesluit][ref2] en het gevraagd en ongevraagd informeren en adviseren van het
      verantwoordelijk lijnmanagement en de CIO Rijk hierover;


      [ref1]: https://wetten.overheid.nl/BWBR0029514#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0029514#Artikel6
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0029514
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0029514
        artikel: '6'
  - number: 4.g
    text: |-
      het ontwikkelen en coördineren van integraal portfoliomanagement en levenscyclusmanagement om de samenhang tussen
      ICT-(door)ontwikkeling en ICT-beheer van het kerndepartement en dienstonderdelen te bewaken;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel4
  - number: 4.h
    text: |-
      het gevraagd en ongevraagd adviseren en informeren van de CIO Rijk voor zover dit redelijkerwijs noodzakelijk is
      voor diens taakuitoefening, bedoeld in artikel 18;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel4
  - number: 4.i
    text: |-
      het zorgdragen voor voldoende aandacht binnen het ministerie voor continue beheeractiviteit en verbetering van de
      ICT-infrastructuur inclusief de benodigde technologische vernieuwing en informatiebeveiliging;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel4
  - number: 4.j
    text: |-
      het voeren van een solide informatiehuishouding waarbinnen de informatie duurzaam toegankelijk, vindbaar, juist,
      volledig en betrouwbaar bewaard wordt;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel4
  - number: 4.k
    text: |-
      het uitvoeren van oordelen aangaande de beheersing, haalbaarheid, risico’s en implicaties van alle voorgenomen
      en in uitvoering zijnde activiteiten met een grote ICT-component, conform de daarvoor geldende rijksbrede
      kwaliteitsnormen;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel4
  - number: 4.l
    text: |-
      het aanmelden van activiteiten bij het Adviescollege ICT-toetsing, als bedoeld in
      [artikel 7, eerste lid, onderdeel a, onder 2° van de Wet Adviescollege ICT-toetsing][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0049412#Artikel7
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0049412
        artikel: '7'
  - number: 4.m
    text: |-
      het uitvoeren van de taken met betrekking tot het (IV)beleidsterrein voor de eigen diensten die vallen onder het
      eigen ministerie;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel4
  - number: 4.n
    text: |-
      het realiseren van interoperabiliteit tussen ministeries op tenminste uitwisselfunctionaliteiten en aansluiting op
      rijksbrede generieke voorzieningen en dienstverlening.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel4
  - number: '5.1'
    text: |-
      De departementale CIO kan, na overleg met de secretaris-generaal, de minister rechtstreeks informeren, indien zijn
      taakuitoefening op grond van dit besluit daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel5
  - number: '5.2'
    text: |-
      De departementale CIO kan een CIO-oordeel of een externe kwaliteitstoets uitvoeren binnen alle fasen van projecten,
      programma’s of activiteiten met een digitaliseringsaspect of ICT-component.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel5
  - number: '5.3'
    text: |-
      Voor het aanvangen van ICT-ontwikkelprojecten en onderhoudsactiviteiten met een grote ICT-component, die onder
      verantwoordelijkheid van het ministerie worden uitgevoerd, is een positief CIO-oordeel, of een beargumenteerde
      afwijking hiervan door de secretaris-generaal van het ministerie, vereist.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel5
  - number: '5.4'
    text: |-
      De dienstonderdelen van het ministerie verstrekken de departementale CIO de informatie die noodzakelijk is voor de
      uitoefening van zijn taken op grond van dit besluit.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel5
  - number: '6.1'
    text: |-
      De minister die belast is met de leiding van een ministerie draagt zorg voor de aanstelling van een departementale
      CISO die rechtstreeks ressorteert onder de CIO van het ministerie.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel6
  - number: '6.2'
    text: |-
      De departementale CISO is belast met de ontwikkeling en coördinatie
      van het departementale informatiebeveiligingsbeleid, bedoeld in
      [artikel 3 van het Besluit Voorschrift Informatiebeveiliging Rijksdienst 2007][ref1] en
      [artikel 3 van het Besluit Voorschrift Informatiebeveiliging Rijksdienst – Bijzondere Informatie 2025][ref2] en
      het ondersteunen van het verantwoordelijk lijnmanagement bij de implementatie en naleving hiervan.


      [ref1]: https://wetten.overheid.nl/BWBR0022141#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0051482#Artikel3
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0022141
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0051482
        artikel: '3'
  - number: '7'
    text: |-
      De minister die belast is met de leiding van een ministerie draagt aan de departementale CISO ten aanzien van
      digitalisering en informatievoorziening, met betrekking tot het ministerie, de taak op tot:
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel7
  - number: 7.a
    text: |-
      het ontwikkelen en coördineren van departementaal informatiebeveiligingsbeleid en -kaders en het ondersteunen van
      de implementatie en naleving hiervan;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel7
  - number: 7.b
    text: |-
      het zorgdragen voor het departementale informatiebeveiligingsbeleid als onderdeel van het departementale
      digitaliserings- en informatievoorzieningsbeleid, bedoeld in [artikel 4, onder e][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0044613#Artikel4
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0044613
        artikel: '4'
        paragraaf: '2'
  - number: 7.c
    text: het ontwikkelen en actueel houden van een departementaal risicobeeld met betrekking tot informatiebeveiliging;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel7
  - number: 7.d
    text: |-
      het bijdragen aan het opstellen en beheren van het meerjarig informatieplan voor het ministerie, bedoeld in
      [artikel 4, onder c][ref1], met betrekking tot de departementale informatiebeveiliging;


      [ref1]: https://wetten.overheid.nl/BWBR0044613#Artikel4
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0044613
        artikel: '4'
        paragraaf: '2'
  - number: 7.e
    text: |-
      het bijdragen aan het opstellen van het rijksbrede informatiebeveiligingsbeleid, het risicobeeld en het
      calamiteitenplan, bedoeld in [artikel 20, onder a, c en j][ref1], en de rijksbrede strategie, bedoeld in
      [artikel 18, onder a][ref2], en aan het integrale beveiligingsbeleid, de risicoanalyse en het calamiteitenplan,
      bedoeld in [artikel 4, eerste, derde en zesde lid, van het Besluit BVA-stelsel Rijksdienst 2021][ref3], met
      betrekking tot de departementale informatiebeveiliging;


      [ref1]: https://wetten.overheid.nl/BWBR0044613#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0044613#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0044617#Artikel4
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0044613
        artikel: '20'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0044613
        artikel: '18'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0044617
        artikel: '4'
  - number: 7.f
    text: |-
      het gevraagd en ongevraagd adviseren van de departementale CIO, het verantwoordelijk lijnmanagement en CISO’s
      van dienstonderdelen over de informatiebeveiliging en de risico’s daarvoor van (voorgenomen) wet- en regelgeving,
      investeringen, beleids- en uitvoeringstrajecten, informatieprocessen en informatiesystemen;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel7
  - number: 7.g
    text: |-
      het gevraagd en ongevraagd adviseren en informeren van de CISO Rijk voor zover dit redelijkerwijs noodzakelijk is
      voor diens taakuitoefening, bedoeld in [artikel 20][ref1], en van de departementale beveiligingsautoriteit ten
      behoeve van diens taakuitoefening op grond van het bepaalde in het [Besluit BVA-stelsel Rijksdienst 2021][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0044613#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0044617
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0044613
        artikel: '20'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0044617
  - number: 7.h
    text: |-
      het monitoren en controleren van het informatiebeveiligingsbewustzijn binnen het ministerie, het adviseren van
      het kerndepartement en dienstonderdelen hierover en het zorgdragen voor het vergroten van het bewustzijn over
      informatiebeveiliging binnen het ministerie;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel7
  - number: 7.i
    text: |-
      het onderhouden van relaties met de inlichtingen- en veiligheidsdiensten, het Nationaal Cyber Security Centrum
      en de Nationale Coördinator Terrorismebestrijding en Veiligheid aangaande dreigingen die verband houden met de
      informatiebeveiliging van het departement;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel7
  - number: 7.j
    text: |-
      het ontwikkelen en coördineren van informatiebeveiligingsactiviteiten, -projecten en het zorgdragen voor een
      projectportfolio voor informatiebeveiliging;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel7
  - number: 7.k
    text: |-
      het bijdragen aan CIO-oordelen en kwaliteitstoetsen als bedoeld in [artikel 5, tweede lid][ref1], met betrekking
      tot informatiebeveiliging;


      [ref1]: https://wetten.overheid.nl/BWBR0044613#Artikel5
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0044613
        artikel: '5'
        paragraaf: '2'
  - number: 7.l
    text: |-
      het binnen het ministerie coördineren van onderzoeken van de Auditdienst Rijk, Algemene Rekenkamer, Adviescollege
      ICT-toetsing en eventueel Autoriteit Persoonsgegevens naar het niveau van de naleving van het betreffende
      beleidsgebied;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel7
  - number: 7.m
    text: |-
      het monitoren en signaleren van afwijkingen van
      [artikel 41, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1] en het informeren hierover van de
      secretaris-generaal als eigenaar van een zelfstandig bestuursorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel41
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '41'
  - number: '8.1'
    text: |-
      De departementale CISO kan de secretaris-generaal en het verantwoordelijk lijnmanagement van het ministerie
      rechtstreeks informeren, indien zijn taakuitoefening op grond van dit besluit en de ernst van het geconstateerde
      feit daartoe een acute aanleiding geeft. Indien vooroverleg met de CIO en de beveiligingsautoriteit niet mogelijk
      is, worden beiden zo spoedig mogelijk achteraf geïnformeerd.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel8
  - number: '8.2'
    text: |-
      De dienstonderdelen van het ministerie verstrekken de departementale CISO gevraagd en ongevraagd de informatie die
      noodzakelijk is voor de uitoefening van zijn taken.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel8
  - number: '8.3'
    text: |-
      De departementale CISO kan namens de secretaris-generaal en de departementale CIO aanwijzingen geven met
      betrekking tot informatieprocessen in het geval van een, mogelijke, ernstige en acute inbreuk op de beveiliging
      van informatiesystemen. De CISO laat onverwijld maatregelen treffen om zo veel mogelijk de beveiliging te laten
      herstellen en verdere schade te laten beperken.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel8
  - number: '8.4'
    text: |-
      De departementale CISO kan namens de secretaris-generaal en de departementale CIO en in afstemming met de
      beveiligingsautoriteit van het ministerie, aanwijzingen geven aan iedere ambtenaar, externe medewerkers en
      bezoekers, voor zover dat noodzakelijk is voor de uitvoering van het departementale informatiebeveiligingsbeleid en
      de naleving van de informatiebeveiligingsvoorschriften.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel8
  - number: '9.1'
    text: |-
      Naast de benoemde CIO, CISO, CIO Rijk en CISO Rijk kunnen de ministeries de volgende rollen invullen: - (Chief)
      Data Officer (C)DO)
        - (Chief) Privacy Officer (C)PO)
        - (Chief) Technology Officer (C)TO)
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel9
  - number: '9.2'
    text: |-
      Het staat de ministeries vrij om deze rollen als afzonderlijke functies binnen hun organisatiestructuur te
      formaliseren, rekening houdend met de specifieke behoeften en vereisten van hun operationele omgeving.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel9
  - number: '9.3'
    text: |-
      Indien de aard en het belang van de rol binnen het ministerie dit rechtvaardigen, kan aan de aanduiding van de
      rol het voorvoegsel ‘Chief’ worden toegevoegd, waarmee de status en verantwoordelijkheid van de functie worden
      benadrukt. Dit resulteert in de volgende titels: - Chief Data Officer (CDO)
        - Chief Privacy Officer (CPO)
        - Chief Technology Officer (CTO)
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel9
  - number: '9.4'
    text: |-
      De departementale (C)DO, (C)PO en (C)TO zijn een tweedelijnsfunctie en ressorteren rechtstreeks onder de
      departementale CIO. Deze tweedelijnsfunctie gaat over adviseren, kaderstellen en monitoren.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel9
  - number: '9.5'
    text: |-
      De departementale CIO is verantwoordelijk voor de functionele aansturing alsmede voor de toewijzing van taken en
      verantwoordelijkheden.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel9
  - number: '10'
    text: |-
      De departementale (C)DO ressorteert onder de departementale CIO. De CIO kan de departementale (C)DO de volgende
      taken toewijzen:
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel10
  - number: 10.a
    text: |-
      het ontwikkelen en coördineren van een gegevensstrategie die richting geeft aan het gegevens en algoritmebeleid en
      integraliteit borgt van het gegevens-, algoritme- en Artificial Intelligence (AI)-beleid;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel10
  - number: 10.b
    text: |-
      het zorgdragen voor het opstellen, beheren en monitoren van de uitvoering van het gegevens-, algoritme- en AI-
      beleid. Dit beleid omvat de volgende classificatie: gegevenstyperingsbeleid, gegevenskwaliteitsbeleid, gegevens- en
      algoritmegebruiksbeleid en gegevensdelingsbeleid;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel10
  - number: 10.c
    text: |-
      het gevraagd en ongevraagd adviseren van de departementale CIO en het verantwoordelijk lijnmanagement in lijn
      met het verkregen mandaat en (C)DO’s van dienstonderdelen over gegevens-, algoritme- en AI-vraagstukken in onder
      andere (voorgenomen) wet- en regelgeving, investeringen, beleids- en uitvoeringstrajecten, informatieprocessen en
      informatiesystemen, CIO-oordelen en kwaliteitstoetsen;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel10
  - number: 10.d
    text: |-
      het invullen van de randvoorwaarden voor en het onderkennen van de mogelijkheden van waardecreatie als ook het
      datagedreven werken. Dat houdt onder andere in het ontwikkelen, stimuleren of coördineren van activiteiten en
      projecten om dit kunnen te realiseren door onder andere te investeren in gegevenscultuur en vaardigheden die nodig
      zijn om gegevens effectief te begrijpen, interpreteren en te gebruiken;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel10
  - number: 10.e
    text: |-
      het monitoren van de uitvoering van assessments bij de inzet van algoritmes, zoals het Impact Assessment voor
      Mensenrechten (IAMA) en een AI impactassessment (AIIA) in afstemming of samenwerking met de (C)PO;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel10
  - number: 10.f
    text: |-
      het opstellen van het beleid in diens beleidsgebied (te weten de visie, kaders, indicatoren, strategie en
      governance) voor het ministerie, de inrichting van het stelsel daarvan binnen het departement en het monitoren van
      de werking binnen de organisatieonderdelen;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel10
  - number: 10.g
    text: |-
      het monitoren van de toepassing door de organisatie van de kaders op diens beleidsgebied. Het inrichten van een
      PDCA-cyclus voor de monitoring van de stand van zaken van de naleving van wet- en regelgeving en beleid bij alle
      organisatieonderdelen op diens beleidsgebied;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel10
  - number: 10.h
    text: |-
      het zoeken van afstemming en samenwerking met de (C)xO’s of specialisten van onder andere de vakgebieden:
      privacy, gegevens, informatiehuishouding, beveiliging, open source, open standaarden, technologie en duurzame
      toegankelijkheid en digitale toegankelijkheid;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel10
  - number: 10.i
    text: |-
      het adviseren over en monitoren van de naleving van (internationale) wet- en regelgeving op het betreffende
      beleidsgebied om bij te dragen aan het realiseren van maatschappelijke opgaven;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel10
  - number: 10.j
    text: |-
      het coördineren van kennisdeling en bewustwording op het betreffende beleidsgebied met daarbij specifiek oog voor
      het ethische, handelen in lijn met wet- en regelgeving op het betreffende beleidsgebied en het bijdragen aan het
      vergroten van het noodzakelijke bewustzijn binnen het ministerie of organisatieonderdeel;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel10
  - number: 10.k
    text: |-
      het adviseren van betreffende beleidsgebied-professionals en het management van dienstonderdelen bij disputen en/of
      conflicterende belangen tussen verschillende dienstonderdelen rondom vraagstukken op het betreffende beleidsgebied;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel10
  - number: 10.l
    text: |-
      het monitoren van de juiste afhandeling en juiste registratie in registers van het betreffende beleidsgebied bij
      incidenten of regulier gebruik waar dat verplicht of gewenst is;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel10
  - number: 10.m
    text: het bijdragen aan het opstellen van rijksbreed beleid in samenwerking met de CIO Rijk;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel10
  - number: 10.n
    text: het gevraagd en ongevraagd adviseren en informeren van de CIO Rijk voor zover dit redelijkerwijs noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel10
  - number: 10.o
    text: |-
      het binnen het ministerie coördineren van onderzoeken van de Auditdienst Rijk, Algemene Rekenkamer, Adviescollege
      ICT-toetsing en eventueel Autoriteit Persoonsgegevens naar het niveau van de naleving van het betreffende
      beleidsgebied;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel10
  - number: 10.p
    text: het op verzoek van de CIO bijdragen aan CIO-oordelen en kwaliteitstoetsen.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel10
  - number: '11.1'
    text: De (C)DO handelt binnen het mandaat zoals dat is verstrekt door de CIO.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel11
  - number: '11.2'
    text: De (C)DO kan gevraagd en ongevraagd adviseren over het beleidsgebied van de (C)DO.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel11
  - number: '11.3'
    text: |-
      De (C)DO kan uit hoofde van de departementale CIO informatie opvragen bij (C)xO’s, CIO’s en het verantwoordelijk
      management van de organisatie (onderdelen) om inzicht te verkrijgen in de stand van zaken met betrekking tot
      naleving van wet- en regelgeving en beleid binnen het beleidsgebied van de (C)DO.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel11
  - number: '11.4'
    text: |-
      De (C)DO kan de departementale CIO adviseren te escaleren naar secretaris-generaal of minister in het geval
      van, mogelijk, ernstig nalaten van de naleving van wetgeving, met als doel de inbreuk weg te nemen en schade te
      beperken.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel11
  - number: '12'
    text: |-
      De departementale (C)PO ressorteert onder de departementale CIO. De CIO kan de departementale (C)PO de volgende
      taken toewijzen:
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel12
  - number: 12.a
    text: het vertalen van en het bijdragen aan beleid gerelateerd aan de bescherming van privacy en persoonsgegevens;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel12
  - number: 12.b
    text: |-
      het zorgdragen voor het opstellen beheren en monitoren van de uitvoering van het privacy- en
      persoonsgegevensbeschermingsbeleid;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel12
  - number: 12.c
    text: |-
      het gevraagd en ongevraagd adviseren van de departementale CIO en het verantwoordelijk lijnmanagement en (C)PO’s
      van dienstonderdelen over verwerking van persoonsgegevens in onder andere (voorgenomen) wet- en regelgeving,
      investeringen, beleids- en uitvoeringstrajecten, informatieprocessen en informatiesystemen, CIO-oordelen en
      kwaliteitstoetsen voor zover het niet individuele casuïstiek betreft;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel12
  - number: 12.d
    text: |-
      het monitoren van de uitvoering van Data Protection Impact Assessments (DPIA’s) en Data Transfer Impact Assessments
      (DTIA’s) en assessments bij de inzet van algoritmes zoals het Impact Assessment voor Mensenrechten (IAMA) en een AI
      impactassessment (AIIA) in afstemming of samenwerking met de (C)DO functie;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel12
  - number: 12.e
    text: |-
      het opstellen van het beleid in diens beleidsgebied (te weten de visie, kaders, indicatoren, strategie en
      governance) voor het ministerie, de inrichting van het stelsel daarvan binnen het departement en het monitoren van
      de werking binnen de organisatieonderdelen;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel12
  - number: 12.f
    text: |-
      het monitoren van de toepassing door de organisatie van de kaders op diens beleidsgebied. Het inrichten van een
      PDCA-cyclus voor de monitoring van de stand van zaken van de naleving van wet- en regelgeving en beleid bij alle
      organisatieonderdelen op diens beleidsgebied;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel12
  - number: 12.g
    text: |-
      het zoeken van afstemming en samenwerking met de (C)xO’s of specialisten van onder andere de vakgebieden:
      privacy, gegevens, informatiehuishouding, beveiliging, open source, open standaarden, technologie en duurzame
      toegankelijkheid en digitale toegankelijkheid;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel12
  - number: 12.h
    text: |-
      het adviseren over en monitoren van de naleving van (internationale) wet- en regelgeving op het betreffende
      beleidsgebied om bij te dragen aan het realiseren van maatschappelijke opgaven;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel12
  - number: 12.i
    text: |-
      het coördineren van kennisdeling en bewustwording op het betreffende beleidsgebied met daarbij specifiek oog voor
      het ethische, handelen in lijn met wet- en regelgeving op het betreffende beleidsgebied en het bijdragen aan het
      vergroten van het noodzakelijke bewustzijn binnen het ministerie of organisatieonderdeel;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel12
  - number: 12.j
    text: |-
      het adviseren van betreffende beleidsgebied-professionals en het management van dienstonderdelen bij disputen en/of
      conflicterende belangen tussen verschillende dienstonderdelen rondom vraagstukken op het betreffende beleidsgebied;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel12
  - number: 12.k
    text: |-
      het monitoren van de juiste afhandeling en juiste registratie in registers van het betreffende beleidsgebied bij
      incidenten of regulier gebruik waar dat verplicht of gewenst is;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel12
  - number: 12.l
    text: het bijdragen aan het opstellen van rijksbreed beleid in samenwerking met de CIO Rijk;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel12
  - number: 12.m
    text: het gevraagd en ongevraagd adviseren en informeren van de CIO Rijk voor zover dit redelijkerwijs noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel12
  - number: 12.n
    text: |-
      het binnen het ministerie coördineren van onderzoeken van de Auditdienst Rijk, Algemene Rekenkamer, Adviescollege
      ICT-toetsing en eventueel Autoriteit Persoonsgegevens naar het niveau van de naleving van het betreffende
      beleidsgebied;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel12
  - number: 12.o
    text: het op verzoek van de CIO bijdragen aan CIO-oordelen en kwaliteitstoetsen.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel12
  - number: '13.1'
    text: De (C)PO handelt binnen het mandaat zoals dat is verstrekt door de CIO.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel13
  - number: '13.2'
    text: De (C)PO kan gevraagd en ongevraagd adviseren over het beleidsgebied van de (C)PO.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel13
  - number: '13.3'
    text: |-
      De (C)PO kan uit hoofde van de departementale CIO informatie opvragen bij (C)xO’s, CIO’s en het verantwoordelijk
      management van de organisatie (onderdelen) om inzicht te verkrijgen in de stand van zaken met betrekking tot
      naleving van wet- en regelgeving en beleid binnen het beleidsgebied van de (C)PO.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel13
  - number: '13.4'
    text: |-
      De (C)PO kan de departementale CIO adviseren te escaleren naar secretaris-generaal of minister in het geval
      van, mogelijk, ernstig nalaten van de naleving van wetgeving, met als doel de inbreuk weg te nemen en schade te
      beperken.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel13
  - number: '14'
    text: |-
      De departementale (C)TO ressorteert onder de departementale CIO. De CIO kan de departementale (C)TO de volgende
      taken toewijzen:
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel14
  - number: 14.a
    text: |-
      het adviseren van de departementale CIO en op verzoek van de CIO het lijnmanagement over het gevoerde technologie-
      en innovatiebeleid;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel14
  - number: 14.b
    text: |-
      het gevraagd en ongevraagd adviseren van de departementale CIO en het verantwoordelijk lijnmanagement en
      (C)TO’s van dienstonderdelen over de technologische innovatie, investeringen, beleids- en uitvoeringstrajecten,
      informatieprocessen en informatiesystemen, CIO-oordelen en kwaliteitstoetsen voor zover het niet individuele
      casuïstiek betreft;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel14
  - number: 14.c
    text: |-
      het mede-ontwikkelen en mede-uitvoeren van de departementale strategie samen met de departementale CIO, CISO, (C)DO
      en (C)PO, met de nadruk op bedrijfscontinuïteit en lifecyclemanagement;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel14
  - number: 14.d
    text: |-
      het mede ontwikkelen en uitvoeren van meerjarenplannen en een digitale visie voor het IT-landschap van de
      organisatie en het bijdragen op de totstandkoming van de IV-portfolio;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel14
  - number: 14.e
    text: |-
      het onderhouden van strategische relaties met ICT-leveranciers in de markt en relevante marktpartijen en diensten
      aangaande het IV-beleid van het departement;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel14
  - number: 14.f
    text: |-
      het bijdragen aan de technologische kennis en vaardigheden door technologische kennisuitwisseling in het
      departement te faciliteren;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel14
  - number: 14.g
    text: |-
      het periodiek informeren en rapporteren aan de departementale CIO over het gevoerde technologie- en
      innovatiebeleid;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel14
  - number: 14.h
    text: |-
      het opstellen van het beleid in diens beleidsgebied (te weten de visie, kaders, indicatoren, strategie en
      governance) voor het ministerie, de inrichting van het stelsel daarvan binnen het departement en het monitoren van
      de werking binnen de organisatieonderdelen;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel14
  - number: 14.i
    text: |-
      het monitoren van de toepassing door de organisatie van de kaders op diens beleidsgebied. Het inrichten van een
      PDCA-cyclus voor de monitoring van de stand van zaken van de naleving van wet- en regelgeving en beleid bij alle
      organisatieonderdelen op diens beleidsgebied;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel14
  - number: 14.j
    text: |-
      het zoeken van afstemming en samenwerking met de (C)xO’s of specialisten van onder andere de vakgebieden:
      privacy, gegevens, informatiehuishouding, beveiliging, open source, open standaarden, technologie en duurzame
      toegankelijkheid en digitale toegankelijkheid;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel14
  - number: 14.k
    text: |-
      het adviseren over en monitoren van de naleving van (internationale) wet- en regelgeving op het betreffende
      beleidsgebied om bij te dragen aan het realiseren van maatschappelijke opgaven;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel14
  - number: 14.l
    text: |-
      het coördineren van kennisdeling en bewustwording op het betreffende beleidsgebied met daarbij specifiek oog voor
      het ethische, handelen in lijn met wet- en regelgeving op het betreffende beleidsgebied en het bijdragen aan het
      vergroten van het noodzakelijke bewustzijn binnen het ministerie of organisatieonderdeel;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel14
  - number: 14.m
    text: |-
      het adviseren van betreffende beleidsgebied-professionals en het management van dienstonderdelen bij disputen en/of
      conflicterende belangen tussen verschillende dienstonderdelen rondom vraagstukken op het betreffende beleidsgebied;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel14
  - number: 14.n
    text: |-
      het monitoren van de juiste afhandeling en juiste registratie in registers van het betreffende beleidsgebied bij
      incidenten of regulier gebruik waar dat verplicht of gewenst is;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel14
  - number: 14.o
    text: het bijdragen aan het opstellen van rijksbreed beleid in samenwerking met de CIO Rijk;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel14
  - number: 14.p
    text: het gevraagd en ongevraagd adviseren en informeren van de CIO Rijk voor zover dit redelijkerwijs noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel14
  - number: 14.q
    text: |-
      het binnen het ministerie coördineren van onderzoeken van de Auditdienst Rijk, Algemene Rekenkamer, Adviescollege
      ICT-toetsing en eventueel Autoriteit Persoonsgegevens naar het niveau van de naleving van het betreffende
      beleidsgebied;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel14
  - number: 14.r
    text: het op verzoek van de CIO bijdragen aan CIO-oordelen en kwaliteitstoetsen.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel14
  - number: '15.1'
    text: De (C)TO handelt binnen het mandaat zoals dat is verstrekt door de CIO.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel15
  - number: '15.2'
    text: De (C)TO kan gevraagd en ongevraagd adviseren over het beleidsgebied van de (C)TO.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel15
  - number: '15.3'
    text: |-
      De (C)TO kan uit hoofde van de departementale CIO informatie opvragen bij (C)xO’s, CIO’s en het verantwoordelijk
      management van de organisatie (onderdelen) om inzicht te verkrijgen in de stand van zaken met betrekking tot
      naleving van wet- en regelgeving en beleid binnen het beleidsgebied van de (C)TO.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel15
  - number: '15.4'
    text: |-
      De (C)TO kan de departementale CIO adviseren te escaleren naar secretaris-generaal of minister in het geval
      van, mogelijk, ernstig nalaten van de naleving van wetgeving, met als doel de inbreuk weg te nemen en schade te
      beperken.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel15
  - number: '16.1'
    text: |-
      De minister die belast is met de leiding van een ministerie draagt er zorg voor dat voor dienstonderdelen met een
      substantieel portfolio van informatiesystemen een eigen CIO wordt aangesteld.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel16
  - number: '16.2'
    text: |-
      De CIO van een dienstonderdeel is belast met de ontwikkeling en de coördinatie van het informatievoorzienings-
      en digitaliseringsbeleid voor het dienstonderdeel en het zorgdragen voor de ontwikkeling en het beheer van
      de informatiesystemen van het dienstonderdeel conform dit beleid. De taken en bevoegdheden van de CIO van
      een dienstonderdeel zijn een afgeleide van de taken en bevoegdheden van de departementale CIO, bedoeld in de
      [artikelen 4][ref1] en [5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0044613#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0044613#Artikel5
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0044613
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0044613
        artikel: '5'
        paragraaf: '2'
  - number: '16.3'
    text: |-
      De CIO van een dienstonderdeel maakt deel uit van de hoogste ambtelijke leiding van het betreffende
      dienstonderdeel.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel16
  - number: '16.4'
    text: |-
      De minister die belast is met de leiding van een ministerie draagt er zorg voor dat voor dienstonderdelen met
      een substantieel portfolio van informatiesystemen een CISO wordt aangesteld, ressorterend onder de CIO van het
      dienstonderdeel.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel16
  - number: '16.5'
    text: |-
      De CISO van een dienstonderdeel is belast met het informatiebeveiligingsbeleid, bedoeld in
      [artikel 3 van het Besluit Voorschrift Informatiebeveiliging Rijksdienst 2007][ref1] en
      [artikel 3 van het Besluit Voorschrift Informatiebeveiliging Rijksdienst – Bijzondere Informatie 2025][ref2],
      voor zover dit betrekking heeft op het dienstonderdeel. De taken en bevoegdheden van de CISO van een
      dienstonderdeel zijn een afgeleide van de taken en bevoegdheden van de departementale CISO, bedoeld in de
      [artikelen 7][ref3] en [8][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0022141#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0051482#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0044613#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0044613#Artikel8
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0022141
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0051482
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0044613
        artikel: '7'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0044613
        artikel: '8'
        paragraaf: '2'
  - number: '16.6'
    text: |-
      Een CIO en een CISO van een dienstonderdeel maken onderdeel uit van het departementale CIO-stelsel. Hetzelfde geldt
      voor de (C)DO, (C)PO en (C)TO wanneer deze rollen zijn ingevuld.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel16
  - number: '17.1'
    text: |-
      De Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt een Chief Information Officer Rijk en een Chief
      Information Security Officer Rijk aan.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel17
  - number: '17.2'
    text: |-
      De CIO Rijk is belast met de ontwikkeling en coördinatie van het rijksbrede informatievoorziening- en
      digitaliseringsbeleid en draagt zorg voor de ontwikkeling en het beheer van de ICT-voorzieningen en
      informatiesystemen, bedoeld in [artikel 2, eerste lid onder b, van het Coördinatiebesluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029514#Artikel2
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0029514
        artikel: '2'
  - number: '17.3'
    text: |-
      De CISO Rijk is belast met de coördinatie van de maatregelen en het beleid voor de informatiebeveiliging voor zover
      deze betrekking hebben op de rijksdienst en ressorteert onder de CIO Rijk.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel17
  - number: '18'
    text: |-
      De Minister van Binnenlandse Zaken en Koninkrijksrelaties draagt aan de CIO Rijk met betrekking tot de rijksdienst
      de taak op tot:
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel18
  - number: 18.a
    text: |-
      richten op en stimuleren van digitale transformatie en technologisch gedreven innovatie, door het investeren in een
      cultuur van kennisdeling en door het lerend vermogen op het gebied van digitalisering te bevorderen;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel18
  - number: 18.b
    text: |-
      het adviseren van de Minister van Binnenlandse Zaken en Koninkrijksrelaties en het lijnmanagement van het
      Ministerie van Binnenlandse Zaken en Koninkrijksrelaties over de gevolgen voor het rijksbrede digitaliserings-
      en informatievoorzieningsbeleid, de rijksbrede informatieprocessen en informatiesystemen van onder andere
      (voorgenomen) wet- en regelgeving, beleid, uitvoeringstrajecten en investeringen voor zover deze betrekking hebben
      op de rijksdienst;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel18
  - number: 18.c
    text: het coördineren van het CIO-stelsel binnen de Rijksdienst;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel18
  - number: 18.d
    text: |-
      het ontwikkelen, coördineren en monitoren van de implementatie van het rijksbrede digitaliserings- en
      informatievoorzieningsbeleid;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel18
  - number: 18.e
    text: |-
      het ontwikkelen en beheren van kaders zoals bedoeld in [artikel 2, eerste lid][ref1], en
      [6, tweede lid, van het Coördinatiebesluit][ref2], met betrekking tot informatiesystemen van de ministeries;


      [ref1]: https://wetten.overheid.nl/BWBR0029514#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0029514#Artikel6
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0029514
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0029514
        artikel: '6'
  - number: 18.f
    text: |-
      het beoordelen van op grond van de in [artikel 6, eerste lid, van het Coördinatiebesluit][ref1] ontvangen
      informatie voor eventuele aanscherping van de kaders, bedoeld in onderdeel e, en ter bevordering van het lerend
      vermogen op het gebied van digitalisering binnen de rijksdienst;


      [ref1]: https://wetten.overheid.nl/BWBR0029514#Artikel6
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0029514
        artikel: '6'
  - number: 18.g
    text: |-
      het voorbereiden van de jaarrapportage over de digitalisering, informatievoorziening en informatiesystemen binnen
      de rijksdienst;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel18
  - number: 18.h
    text: |-
      het toezien op de naleving van de op grond van [artikelen 2, eerste lid][ref1], en
      [6, tweede lid, van het Coördinatiebesluit][ref2] gestelde kaders over de informatiesystemen van de ministeries en
      de wijze waarop de gegevens over de informatiesystemen worden verstrekt; en


      [ref1]: https://wetten.overheid.nl/BWBR0029514#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0029514#Artikel6
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0029514
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0029514
        artikel: '6'
  - number: 18.i
    text: |-
      het toezien op de kwaliteitsaspecten van de informatieplannen, bedoeld in [artikel 4, onder c][ref1],
      aan vastgestelde kwaliteitsnormen en het rapporteren hierover aan de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties;


      [ref1]: https://wetten.overheid.nl/BWBR0044613#Artikel4
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0044613
        artikel: '4'
        paragraaf: '2'
  - number: 18.j
    text: |-
      het jaarlijks voeren van individuele departementale gesprekken met de departementale CIO’s en de leden van
      het CIO-beraad. Door de CIO Rijk wordt hiervan een verslag en actielijst opgesteld, deze wordt gedeeld met de
      departementale CIO en het lid van het CIO-beraad;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel18
  - number: 18.k
    text: |-
      het ontwikkelen van een meerjarige strategie op het gebied van digitalisering en informatievoorziening en het
      coördineren en monitoren van de uitvoering daarvan en over de voortgang verslag uitbrengen aan het CIO-beraad;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel18
  - number: 18.l
    text: |-
      het coördineren van en toezien op interoperabiliteit tussen ministeries op tenminste uitwissel functionaliteiten en
      aansluiting op rijksbrede generieke voorzieningen en dienstverlening.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel18
  - number: '19.1'
    text: |-
      De CIO Rijk kan, na overleg met de secretaris-generaal van Binnenlandse Zaken en Koninkrijksrelaties, de Minister
      van Binnenlandse Zaken en Koninkrijksrelaties rechtstreeks informeren, indien zijn taakuitoefening op grond van dit
      besluit daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel19
  - number: '19.2'
    text: |-
      In onderlinge samenhang gelezen geven [artikel 11 van het Organisatiebesluit BZK 2023][ref1] en
      [artikel 5.1][ref2] en [artikel 7.1 van het Mandaatbesluit BZK 2023][ref3] de CIO Rijk het mandaat om namens
      de Minister van Binnenlandse Zaken en Koninkrijksrelaties de kaders bedoeld in [artikel 2, eerste lid][ref4], en
      __REF004___________________________________________________________________________________________________________
      _______, na overleg met de ministers die het mede aangaat, vast te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0047860#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0048593#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0048593#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0029514#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0029514#Artikel6
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0047860
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0048593
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0048593
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0029514
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0029514
        artikel: '6'
  - number: '19.3'
    text: |-
      De CIO Rijk voert namens de Minister van Binnenlandse Zaken en Koninkrijksrelaties het overleg, bedoeld in
      [artikel 3a van het Coördinatiebesluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029514#Artikel3a
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0029514
        artikel: 3a
  - number: '20'
    text: |-
      De Minister van Binnenlandse Zaken en Koninkrijksrelaties draagt aan de CISO Rijk ten aanzien van digitalisering en
      informatievoorziening met betrekking tot de rijksdienst de taak op tot:
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel20
  - number: 20.a
    text: |-
      het ontwikkelen, coördineren en monitoren van de implementatie en naleving van rijksbreed
      informatiebeveiligingsbeleid en -kaders en de wijze waarop de gegevens over de informatiebeveiliging van
      informatiesystemen door de ministeries worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel20
  - number: 20.b
    text: |-
      het zorg dragen voor het rijksbrede informatiebeveiligingsbeleid als onderdeel van het rijksbrede digitaliserings-
      en informatievoorzieningsbeleid, bedoeld in [artikel 18, onder d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0044613#Artikel18
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0044613
        artikel: '18'
        paragraaf: '3'
  - number: 20.c
    text: |-
      Het ontwikkelen en coördineren van het onderdeel informatiebeveiliging in de meerjarige strategie, bedoeld in
      [artikel 18, onderdeel d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0044613#Artikel18
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0044613
        artikel: '18'
        paragraaf: '3'
  - number: 20.d
    text: |-
      het adviseren van de CIO Rijk en het lijnmanagement van het Ministerie van Binnenlandse Zaken en
      Koninkrijksrelaties over de informatiebeveiliging en de risico’s daarvoor van (voorgenomen) wet- en regelgeving,
      investeringen, beleid, uitvoeringstrajecten, informatieprocessen en informatiesystemen voor zover deze betrekking
      hebben op de rijksdienst;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel20
  - number: 20.e
    text: |-
      het gevraagd en ongevraagd uitbrengen van rijksbrede adviezen en verstrekken van informatie, inzake
      informatiebeveiliging en het risicomanagement daarvan;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel20
  - number: 20.f
    text: |-
      het gevraagd en ongevraagd adviseren en informeren van de beveiligingsautoriteit Rijk ten behoeve van diens
      taakuitoefening op grond van het bepaalde in het [Besluit BVA-stelsel Rijksdienst 2021][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0044617
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0044617
  - number: 20.g
    text: |-
      het monitoren en controleren van het informatiebeveiligingsbewustzijn binnen de rijksdienst en het zorgdragen voor
      het vergroten van het bewustzijn over informatiebeveiliging binnen de rijksdienst;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel20
  - number: 20.h
    text: |-
      het onderhouden van relaties met de inlichtingen- en veiligheidsdiensten, het Nationaal Cyber Security Centrum
      en de Nationale Coördinator Terrorismebestrijding en Veiligheid aangaande dreigingen die verband houden met de
      informatiebeveiliging van de rijksdienst;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel20
  - number: 20.i
    text: |-
      het in samenwerking met de CISO’s en beveiligingsautoriteit Rijk opstellen en actueel houden van het rijksbrede
      risicobeeld en calamiteitenplan met betrekking tot informatiebeveiliging;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel20
  - number: 20.j
    text: het coördineren van de aanpak van rijksbrede informatiebeveiligingsincidenten en -calamiteiten.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel20
  - number: '21.1'
    text: |-
      De CISO Rijk kan de secretaris-generaal van het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties en het
      verantwoordelijk lijnmanagement van dat ministerie rechtstreeks informeren, indien zijn taakuitoefening op grond
      van dit besluit en de ernst van het geconstateerde feit daartoe een acute aanleiding geeft. Indien vooroverleg
      met de CIO Rijk en beveiligingsautoriteit Rijk niet mogelijk is, worden beiden zo spoedig als mogelijk achteraf
      geïnformeerd.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel21
  - number: '21.2'
    text: |-
      De CISO Rijk heeft een interdepartementale coördinatierol bij rijksbrede informatiebeveiligingsincidenten en
      -calamiteiten. De CISO Rijk kan, na afstemming met de betreffende departementale CISO, in het geval van een,
      mogelijke, ernstige, acute, departement-overstijgende inbreuk op de beveiliging van informatiesystemen of een
      risico daarop, namens de secretaris-generaal van het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties:
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel21
  - number: 21.2.a
    text: |-
      aanwijzingen geven aan iedere ambtenaar, externe medewerker en bezoeker met betrekking tot de informatieprocessen
      van ministeries;
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel21
  - number: 21.2.b
    text: |-
      onverwijld maatregelen laten treffen om (zo veel mogelijk) de informatiebeveiliging te laten herstellen en verdere
      schade te laten beperken.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel21
  - number: '21.3'
    text: |-
      De CISO Rijk stemt onverwijld af met de CIO Rijk, de beveiligingsautoriteit Rijk en betrokken ministeries over
      een (mogelijke) inbreuk of het risico daarop en de genomen maatregelen, als bedoeld in het tweede lid, en heeft
      daarbij in afstemming met de departementale CISO’s indien nodig direct toegang tot de secretarissen-generaal van
      ministeries.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel21
  - number: '21.4'
    text: |-
      De CISO Rijk kan de ministeries vragen informatie te verstrekken ten behoeve van het monitoren van de toepassing
      van de door het CIO-beraad, de CIO Rijk of CISO Rijk vastgestelde kaders, wet- en regelgeving en beleid op het
      gebied van informatiebeveiliging.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel21
  - number: '22.1'
    text: |-
      Er is een CIO-beraad dat primair belast is met de rijksbrede coördinatie op informatievoorziening en ICT. Het
      CIO-beraad ontwikkelt en implementeert een strategie voor de rijksdienst en bevordert digitalisering binnen de
      rijksdienst.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel22
  - number: '22.2'
    text: Het CIO-beraad wordt voorgezeten door de CIO Rijk.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel22
  - number: '22.3'
    text: Aan het CIO-beraad nemen ten minste de departementale CIO’s als lid deel.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel22
  - number: '22.4'
    text: |-
      Het CIO-beraad stelt een Reglement CIO-beraad en Voorportalen vast waarin de voorwaarden voor deelname en wijze van
      vergaderen nader zijn uitgewerkt. Dit Reglement wordt minimaal tweejaarlijks geactualiseerd.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel22
  - number: '22.5'
    text: |-
      Het CIO-beraad kan één of meerdere voorportalen instellen. De werking van het CIO-beraad en de Voorportalen wordt
      beschreven in het Reglement CIO-beraad en Voorportalen.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel22
  - number: '23.1'
    text: Er is een Rijks ICT-dashboard.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel23
  - number: '23.2'
    text: |-
      Het Rijks ICT-dashboard bevat informatie over de staat van de informatievoorziening en digitalisering binnen de
      rijksdienst.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel23
  - number: '23.3'
    text: De CIO Rijk draagt zorg voor het beheer van het Rijks ICT-dashboard en het daarbinnen gehanteerde rapportagemodel.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel23
  - number: '23.4'
    text: |-
      De departementale CIO draagt zorg voor het periodiek actualiseren van het Rijks ICT-dashboard en de kwaliteit van
      de gegevens van zijn ministerie.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel23
  - number: '24'
    text: |-
      In overleg met de Minister van Binnenlandse Zaken en Koninkrijksrelaties kan op onderdelen worden afgeweken van het
      bepaalde in dit besluit, wanneer dit de effectiviteit van de met dit besluit beoogde doelen ten goede komt.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel24
  - number: '25'
    text: Dit besluit wordt drie jaar na inwerkingtreding geëvalueerd en vervolgens elke drie jaar.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel25
  - number: '26'
    text: Dit besluit treedt in werking met ingang van 1 januari 2026.
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel26
  - number: '27'
    text: 'Dit besluit wordt aangehaald als: Besluit CIO-stelsel Rijksdienst 2026.'
    url: https://wetten.overheid.nl/BWBR0044613/2026-01-01#Artikel27
