  - number: '2'
    text: Dit besluit geldt voor de rijksdienst, zijnde de kerndepartementen en de daaronder ressorterende dienstonderdelen.
    url: https://wetten.overheid.nl/BWBR0044613/2021-01-01#Artikel2
  - number: '3'
    text: |-
      1 De minister die belast is met de leiding van een ministerie draagt zorg voor de aanstelling van een
      departementale CIO die rechtstreeks ressorteert onder de secretaris-generaal van het ministerie.

      2 De departementale CIO is belast met de ontwikkeling en coördinatie van het informatievoorzienings- en
      digitaliseringsbeleid en het zorgdragen voor de ontwikkeling en het beheer van de informatiesystemen van het
      ministerie conform dit beleid.

      3 De departementale CIO is tevens belast met het inrichten van het CIO-stelsel voor het ministerie en de onder haar
      ressorterende dienstonderdelen.

      4 De departementale CIO is lid van de bestuursraad van het ministerie.

      5 Een CIO beschikt over een CIO-office.

      6 Het CIO-office wordt zodanig ingericht dat over voldoende kennis en ervaring wordt beschikt om de taak, bedoeld
      in [artikel 4][ref1] uit te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0044613#Artikel4
    url: https://wetten.overheid.nl/BWBR0044613/2021-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0044613
        artikel: '4'
        paragraaf: '2'
  - number: '4'
    text: |-
      De minister die belast is met de leiding van een ministerie draagt aan de departementale CIO met betrekking tot het
      ministerie in elk geval de volgende taken op:

      a. het adviseren van het lijnmanagement en de minister over het beleid ten aanzien van informatievoorziening en
      digitalisering;

      b. het adviseren van het lijnmanagement en de minister over de implicaties voor informatievoorziening en
      digitalisering van (voorgenomen) wet- en regelgeving, beleids- en uitvoeringstrajecten en investeringen;

      c. het opstellen, beheren en zorgdragen voor de uitvoering van een meerjarig informatieplan voor het ministerie met
      een financiële paragraaf;

      d. het richten op en stimuleren van digitale transformatie en technologisch gedreven innovatie binnen het
      ministerie door het investeren in een cultuur van kennisdeling en door het lerend vermogen op het gebied van
      digitalisering binnen het ministerie te bevorderen;

      e. het met inachtneming van toepasselijke rijksbrede kaders en ICT-voorzieningen zorgdragen voor de ontwikkeling
      en coördinatie van informatievoorzieningsbeleid en digitaliseringsbeleid en de ontwikkeling en het beheer van de
      informatiesystemen van het ministerie;

      f. het toezien op naleving van de kaders gesteld op grond van de [artikelen 2][ref1] en
      [6 van het Coördinatiebesluit][ref2] en het gevraagd en ongevraagd informeren en adviseren van het
      verantwoordelijk lijnmanagement en de CIO Rijk hierover;

      g. het ontwikkelen en coördineren van integraal portfoliomanagement en levenscyclusmanagement om de samenhang
      tussen ICT-(door)ontwikkeling en ICT-beheer van het kerndepartement en dienstonderdelen te bewaken;

      h. het gevraagd en ongevraagd adviseren en informeren van de CIO Rijk voor zover dit redelijkerwijs noodzakelijk is
      voor diens taakuitoefening, bedoeld in [artikel 11][ref3];

      i. het zorgdragen voor voldoende aandacht binnen het ministerie voor continue beheeractiviteit en verbetering van
      de ICT-infrastructuur inclusief de benodigde technologische vernieuwing en informatiebeveiliging;

      j. het uitvoeren van oordelen aangaande de beheersing, haalbaarheid, risico’s en implicaties van alle voorgenomen
      en in uitvoering zijnde activiteiten met een grote ICT-component, conform de daarvoor geldende rijksbrede
      kwaliteitsnormen; en

      k. het aanmelden van activiteiten bij het Adviescollege ICT-toetsing, als bedoeld in
      [artikel 4, eerste lid, van het Instellingsbesluit Adviescollege ICT-toetsing][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0029514#Artikel2
