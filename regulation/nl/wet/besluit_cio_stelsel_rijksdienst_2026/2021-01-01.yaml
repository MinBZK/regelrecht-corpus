  - number: '14'
    text: |-
      1 De CISO Rijk kan de secretaris-generaal van het ministerie van Binnenlandse Zaken en Koninkrijksrelaties en het
      verantwoordelijk lijnmanagement van dat ministerie rechtstreeks informeren, indien zijn taakuitoefening op grond
      van dit besluit en de ernst van het geconstateerde feit daartoe een acute aanleiding geeft. Indien vooroverleg
      met de CIO Rijk en beveiligingsautoriteit Rijk niet mogelijk is, worden beiden zo spoedig als mogelijk achteraf
      geïnformeerd.

      2 De CISO Rijk heeft een interdepartementale coördinatierol bij rijksbrede informatiebeveiligingsincidenten en
      -calamiteiten. De CISO Rijk kan, na afstemming met de betreffende departementale CISO, in het geval van een,
      mogelijke, ernstige, acute, departement-overstijgende inbreuk op de beveiliging van informatiesystemen of een
      risico daarop, namens de secretaris-generaal van het ministerie van Binnenlandse Zaken en Koninkrijksrelaties:

      a. aanwijzingen geven aan iedere ambtenaar, externe medewerker en bezoeker met betrekking tot de
      informatieprocessen van ministeries; en

      b. onverwijld maatregelen laten treffen om (zo veel mogelijk) de informatiebeveiliging te laten herstellen en
      verdere schade te laten beperken.

      3 De CISO Rijk stemt onverwijld af met de CIO Rijk, de beveiligingsautoriteit Rijk en betrokken departementen over
      een (mogelijke) inbreuk of het risico daarop en de genomen maatregelen, als bedoeld in het tweede lid, en heeft
      daarbij in afstemming met de departementale CISO’s indien nodig direct toegang tot de secretarissen-generaal van
      ministeries.
    url: https://wetten.overheid.nl/BWBR0044613/2021-01-01#Artikel14
  - number: '15'
    text: |-
      1 Er is een CIO-beraad dat primair belast is met de rijksbrede coördinatie op informatievoorziening en ICT. Het
      CIO-beraad ontwikkelt en implementeert een I-Strategie voor de rijksdienst en bevordert digitalisering binnen de
      rijksdienst.

      2 Het CIO-beraad wordt voorgezeten door de CIO Rijk.

      3 Aan het CIO-beraad nemen ten minste de departementale CIO’s als lid deel.

      4 Het CIO-beraad stelt een handvest CIO-beraad vast waarin de voorwaarden voor deelname en wijze van vergaderen
      nader zijn uitgewerkt. Dit handvest wordt minimaal tweejaarlijks geactualiseerd.

      5 Het CIO-beraad heeft de volgende voorportalen:

      a) De CISO-raad;

      b) De Chief Technology Officer-raad, de CTO-raad;

      c) Het Tactisch Overleg Rijksnetwerken, TORN; en

      d) Het Tactisch Overleg Rijksbrede Voorzieningen, TORV.

      6 De CISO-raad functioneert als voorportaal van het CIO-beraad op het gebied van informatiebeveiligingsbeleid.
      De CISO-raad wordt voorgezeten door CISO Rijk. Aan de CISO-raad nemen ten minste de departementale CISO’s als lid
      deel.

      7 De CTO-raad functioneert als voorportaal van het CIO-beraad op het gebied van ICT-aanbodsturing en
      informatietechnologie. De CTO-raad wordt voorgezeten door de CIO Rijk. Aan de CTO-raad nemen ten minste de
      directeuren van de ICT-dienstverleners binnen de rijksdienst als lid deel.

      8 Het TORN functioneert als voorportaal van het CIO-beraad voor ontwikkeling, implementatie en beheer van de
      Rijksnetwerken. Het TORN wordt voorgezeten door een afgevaardigde van de CIO Rijk. Aan het TORN nemen ten minste
      afgevaardigden van de ICT-dienstverleners binnen de rijksdienst en afgevaardigden van de departementale CIO-offices
      deel.

      9 Het TORV functioneert als voorportaal van het CIO-beraad op het gebied van Rijksbrede ICT-voorzieningen. Het
      TORV wordt voorgezeten door een afgevaardigde van de CIO Rijk. Aan het TORV nemen ten minste afgevaardigden van de
      departementale CIO-offices deel.
    url: https://wetten.overheid.nl/BWBR0044613/2021-01-01#Artikel15
  - number: '16'
    text: |-
      1 Er is een Rijks ICT-dashboard.

      2 Het Rijks ICT-dashboard bevat informatie over de staat van de informatievoorziening en digitalisering binnen
      de rijksdienst.

      3 De CIO Rijk draagt zorg voor het beheer van het Rijks ICT-dashboard en het daarbinnen gehanteerde
      rapportagemodel.

      4 De departementale CIO draagt zorg voor het actualiseren van het Rijks ICT-dashboard en de kwaliteit van de
      gegevens van zijn ministerie.
    url: https://wetten.overheid.nl/BWBR0044613/2021-01-01#Artikel16
  - number: '17'
    text: |-
      In overleg met de Minister van Binnenlandse Zaken en Koninkrijksrelaties kan op onderdelen worden afgeweken van het
      bepaalde in dit besluit, wanneer dit de effectiviteit van de met dit besluit beoogde doelen ten goede komt.
    url: https://wetten.overheid.nl/BWBR0044613/2021-01-01#Artikel17
