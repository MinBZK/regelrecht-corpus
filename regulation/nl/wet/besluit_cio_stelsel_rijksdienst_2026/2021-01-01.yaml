preamble:
  text: |-
    Handelend in overeenstemming met het gevoelen van de ministerraad;

    Gelet op de artikelen 2, eerste lid, 3, eerste lid, en 6, tweede lid, van het Coördinatiebesluit organisatie,
    bedrijfsvoering en informatiesystemen rijksdienst;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0044613/2021-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. *beveiligingsautoriteit:* een beveiligingsautoriteit, bedoeld in
      [artikel 3 van het Besluit BVA-stelsel Rijksdienst 2021][ref1];

      b. *beveiligingsautoriteit Rijk:* de beveiligingsautoriteit Rijk, bedoeld in
      [artikel 7 van het Besluit BVA-stelsel Rijksdienst 2021][ref2];

      c. *CIO:* een Chief Information Officer, bedoeld in [artikel 3, eerste lid][ref3], en
      [artikel 9, eerste lid][ref4];

      d. *CIO Rijk:* de Chief Information Officer Rijk, bedoeld in [artikel 10, eerste lid][ref5];

      e. *CISO:* een Chief Information Security Officer, bedoeld in [artikel 5, eerste lid][ref6], en
      [artikel 9, derde lid][ref7];

      f. *CISO Rijk:* de Chief Information Security Officer Rijk, bedoeld in [artikel 10, eerste lid][ref8];

      g. *Coördinatiebesluit:*
      [Coördinatiebesluit organisatie, bedrijfsvoering en informatiesystemen rijksdienst 2011][ref9];

      h. *digitalisering:* het geheel aan ontwikkelingen binnen de overheid en in de samenleving die te maken hebben met
      het toenemend gebruik van ICT, digitale informatie, data en informatiesystemen;

      i. *grote ICT-component:* ICT-component vallend onder de definitie die in het Handboek portfoliomanagement Rijk
      wordt gegeven aan grote ICT-component;

      j. *ICT:* Informatie- en communicatietechnologie;

      k. *informatiebeveiliging:* het proces van vaststellen van de vereiste betrouwbaarheid van informatiesystemen in
      termen van vertrouwelijkheid, beschikbaarheid en integriteit alsmede het treffen, onderhouden en controleren van
      een samenhangend pakket van bijbehorende maatregelen;

      l. *informatiesysteem:* een samenhangend geheel van gegevensverzamelingen, procedures, processen en programmatuur
      alsmede de voor het informatiesysteem getroffen voorzieningen voor opslag, verwerking en communicatie;

      m. *informatievoorziening:* het geheel van mensen, middelen, informatiesystemen en maatregelen, gericht op de
      informatiebehoefte van een organisatie;

      n. *portfoliomanagement:* proces van inventarisatie, registratie en actualisatie van wijzigingen in
      informatiesystemen, vastgelegd in een portfolio.


