  - number: '12'
    text: |-
      1 De CIO Rijk kan, na overleg met de secretaris-generaal van Binnenlandse Zaken en Koninkrijksrelaties, de Minister
      van Binnenlandse Zaken en Koninkrijksrelaties rechtstreeks informeren, indien zijn taakuitoefening op grond van dit
      besluit daartoe aanleiding geeft.

      2 De CIO Rijk voert namens de Minister van Binnenlandse Zaken en Koninkrijksrelaties het overleg, bedoeld in
      [artikel 3a van het Coördinatiebesluit][ref1].


