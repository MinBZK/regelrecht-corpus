  - number: '5'
    text: |-
      1 De departementale CIO kan, na overleg met de secretaris-generaal, de minister rechtstreeks informeren, indien
      zijn taakuitoefening op grond van dit besluit daartoe aanleiding geeft.

      2 De departementale CIO kan een CIO-oordeel of een externe kwaliteitstoets uitvoeren binnen alle fasen van
      projecten, programma’s of activiteiten met een digitaliseringsaspect of ICT-component.

      3 Voor het aanvangen van ICT-ontwikkelprojecten en onderhoudsactiviteiten met een grote ICT-component, die onder
      verantwoordelijkheid van het ministerie worden uitgevoerd, is een positief CIO-oordeel, of een beargumenteerde
      afwijking hiervan door de secretaris-generaal van het ministerie, vereist.

      4 De dienstonderdelen van het ministerie verstrekken de departementale CIO de informatie die noodzakelijk is voor
      de uitoefening van zijn taken op grond van dit besluit.
    url: https://wetten.overheid.nl/BWBR0044613/2021-01-01#Artikel5
  - number: '6'
    text: |-
      1 De minister die belast is met de leiding van een ministerie draagt zorg voor de aanstelling van een
      departementale CISO die rechtstreeks ressorteert onder de CIO van het ministerie.

      2 De departementale CISO is belast met de ontwikkeling en coördinatie
      van het departementale informatiebeveiligingsbeleid, bedoeld in
      [artikel 3 van het Besluit Voorschrift Informatiebeveiliging Rijksdienst 2007][ref1] en
      [artikel 3 van het Besluit Voorschrift Informatiebeveiliging Rijksdienst - Bijzondere Informatie 2013][ref2] en het
      ondersteunen van het verantwoordelijk lijnmanagement bij de implementatie en naleving hiervan.


      [ref1]: https://wetten.overheid.nl/BWBR0022141#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0033507#Artikel3
