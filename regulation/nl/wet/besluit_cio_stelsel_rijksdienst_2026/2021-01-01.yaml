  - number: '8'
    text: |-
      1 De departementale CISO kan de secretaris-generaal en het verantwoordelijk lijnmanagement van het ministerie
      rechtstreeks informeren, indien zijn taakuitoefening op grond van dit besluit en de ernst van het geconstateerde
      feit daartoe een acute aanleiding geeft. Indien vooroverleg met de CIO en de beveiligingsautoriteit niet mogelijk
      is, worden beiden zo spoedig mogelijk achteraf geïnformeerd.

      2 De dienstonderdelen van het ministerie verstrekken de departementale CISO gevraagd en ongevraagd de informatie
      die noodzakelijk is voor de uitoefening van zijn taken.

      3 De departementale CISO kan namens de secretaris-generaal en de departementale CIO aanwijzingen geven met
      betrekking tot informatieprocessen in het geval van een, mogelijke, ernstige en acute inbreuk op de beveiliging
      van informatiesystemen. De CISO laat onverwijld maatregelen treffen om zo veel mogelijk de beveiliging te laten
      herstellen en verdere schade te laten beperken.

      4 De departementale CISO kan namens de secretaris-generaal en de departementale CIO en in afstemming met de
      beveiligingsautoriteit van het ministerie, aanwijzingen geven aan iedere ambtenaar, externe medewerkers en
      bezoekers, voor zover dat noodzakelijk is voor de uitvoering van het departementale informatiebeveiligingsbeleid en
      de naleving van de informatiebeveiligingsvoorschriften.
    url: https://wetten.overheid.nl/BWBR0044613/2021-01-01#Artikel8
  - number: '9'
    text: |-
      1 De minister die belast is met de leiding van een ministerie draagt er zorg voor dat voor dienstonderdelen met een
      substantieel portfolio van informatiesystemen een eigen CIO wordt aangesteld.

      2 De CIO van een dienstonderdeel is belast met de ontwikkeling en de coördinatie van het informatievoorzienings-
      en digitaliseringsbeleid voor het dienstonderdeel en het zorgdragen voor de ontwikkeling en het beheer van
      de informatiesystemen van het dienstonderdeel conform dit beleid. De taken en bevoegdheden van de CIO van
      een dienstonderdeel zijn een afgeleide van de taken en bevoegdheden van de departementale CIO, bedoeld in de
      [artikelen 4][ref1] en [5][ref2].

      3 De CIO van een dienstonderdeel maakt deel uit van de hoogste ambtelijke leiding van het betreffende
      dienstonderdeel.

      4 De minister die belast is met de leiding van een ministerie draagt er zorg voor dat voor dienstonderdelen met
      een substantieel portfolio van informatiesystemen een CISO wordt aangesteld, ressorterend onder de CIO van het
      dienstonderdeel.

      5 De CISO van een dienstonderdeel is belast met het informatiebeveiligingsbeleid, bedoeld
      in [artikel 3 van het Besluit Voorschrift Informatiebeveiliging Rijksdienst 2007][ref3] en
      [artikel 3 van het Besluit Voorschrift Informatiebeveiliging Rijksdienst - Bijzondere Informatie 2013][ref4], voor
      zover dit betrekking heeft op het dienstonderdeel. De taken en bevoegdheden van de CISO van een dienstonderdeel
      zijn een afgeleide van de taken en bevoegdheden van de departementale CISO, bedoeld in de [artikelen 7][ref5] en
      [8][ref6].

      6 Een CIO en een CISO van een dienstonderdeel maken onderdeel uit van het departementale CIO-stelsel.


