  - number: '7'
    text: |-
      De minister die belast is met de leiding van een ministerie draagt aan de departementale CISO ten aanzien van
      digitalisering en informatievoorziening, met betrekking tot het ministerie, de taak op tot:

      a. het ontwikkelen en coördineren van departementaal informatiebeveiligingsbeleid en -kaders en het ondersteunen
      van de implementatie en naleving hiervan;

      b. het zorgdragen voor het departementale informatiebeveiligingsbeleid als onderdeel van het departementale
      digitaliserings- en informatievoorzieningsbeleid, bedoeld in [artikel 4, onder e][ref1];

      c. het ontwikkelen en actueel houden van een departementaal risicobeeld met betrekking tot informatiebeveiliging;

      d. het bijdragen aan het opstellen en beheren van het meerjarig informatieplan voor het ministerie, bedoeld in
      [artikel 4, onder c][ref2], met betrekking tot de departementale informatiebeveiliging;

      e. het bijdragen aan het opstellen van het rijksbrede informatiebeveiligingsbeleid, het risicobeeld en het
      calamiteitenplan, bedoeld in [artikel 13, onder a, c en j][ref3], en de rijksbrede I-strategie, bedoeld in
      [artikel 11, onder a][ref4], en aan het integrale beveiligingsbeleid, de risicoanalyse en het calamiteitenplan,
      bedoeld in [artikel 4, eerste, derde en zesde lid, van het Besluit BVA-stelsel Rijksdienst 2021][ref5], met
      betrekking tot de departementale informatiebeveiliging;

      f. het gevraagd en ongevraagd adviseren van de departementale CIO, het verantwoordelijk lijnmanagement en CISO’s
      van dienstonderdelen over de informatiebeveiliging en de risico’s daarvoor van (voorgenomen) wet- en regelgeving,
      investeringen, beleids- en uitvoeringstrajecten, informatieprocessen en informatiesystemen;

      g. het gevraagd en ongevraagd adviseren en informeren van de CISO Rijk voor zover dit redelijkerwijs noodzakelijk
      is voor diens taakuitoefening, bedoeld in [artikel 13][ref6], en van de departementale beveiligingsautoriteit ten
      behoeve van diens taakuitoefening op grond van het bepaalde in het [Besluit BVA-stelsel Rijksdienst 2021][ref7];

      h. het monitoren en controleren van het informatiebeveiligingsbewustzijn binnen het ministerie, het adviseren
      van het kerndepartement en dienstonderdelen hierover en het zorgdragen voor het vergroten van het bewustzijn over
      informatiebeveiliging binnen het ministerie;

      i. het onderhouden van relaties met de inlichtingen- en veiligheidsdiensten, het Nationaal Cyber Security Centrum
      en de Nationale Coördinator Terrorismebestrijding en Veiligheid aangaande dreigingen die verband houden met de
      informatiebeveiliging van het departement;

      j. het ontwikkelen en coördineren van informatiebeveiligingsactiviteiten, -projecten en het zorgdragen voor een
      projectportfolio voor informatiebeveiliging;

      k. het bijdragen aan CIO-oordelen en kwaliteitstoetsen als bedoeld in [artikel 5, tweede lid][ref8], met betrekking
      tot informatiebeveiliging; en

      l. het monitoren en signaleren van afwijkingen van
      [artikel 41, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref9] en het informeren hierover van de
      secretaris-generaal als eigenaar van een zelfstandig bestuursorgaan.


