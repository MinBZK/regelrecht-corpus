        bwb_id: BWBR0029514
        artikel: '2'
  - number: '11'
    text: |-
      De minister van Binnenlandse Zaken en Koninkrijksrelaties draagt aan de CIO Rijk met betrekking tot de rijksdienst
      de taak op tot:

      a. richten op en stimuleren van digitale transformatie en technologisch gedreven innovatie, door het investeren in
      een cultuur van kennisdeling en door het lerend vermogen op het gebied van digitalisering te bevorderen;

      b. het adviseren van de Minister van Binnenlandse Zaken en Koninkrijksrelaties en het lijnmanagement van het
      ministerie van Binnenlandse Zaken en Koninkrijksrelaties over de gevolgen voor het rijksbrede digitaliserings-
      en informatievoorzieningsbeleid, de rijksbrede informatieprocessen en informatiesystemen van onder andere
      (voorgenomen) wet- en regelgeving, beleid, uitvoeringstrajecten en investeringen voor zover deze betrekking hebben
      op de rijksdienst;

      c. het coördineren van het CIO-stelsel binnen de Rijksdienst;

      d. het ontwikkelen, coördineren en monitoren van de implementatie van het rijksbrede digitaliserings- en
      informatievoorzieningsbeleid en van een meerjarige I-strategie en -beleid voor de rijksdienst;

      e. het ontwikkelen en beheren van kaders zoals bedoeld in [artikel 2, eerste lid][ref1], en
      [6, tweede lid, van het Coördinatiebesluit][ref2], met betrekking tot informatiesystemen van de ministeries;

      f. het beoordelen van op grond van de in [artikel 6, eerste lid, van het Coördinatiebesluit][ref3] ontvangen
      informatie voor eventuele aanscherping van de kaders, bedoeld in onderdeel e, en ter bevordering van het lerend
      vermogen op het gebied van digitalisering binnen de rijksdienst;

      g. het voorbereiden van de jaarrapportage over de digitalisering, informatievoorziening en informatiesystemen
      binnen de rijksdienst;

      h. het toezien op de naleving van de op grond van [artikelen 2, eerste lid][ref4], en
      [6, tweede lid, van het Coördinatiebesluit][ref5] gestelde kaders over de informatiesystemen van de ministeries en
      de wijze waarop de gegevens over de informatiesystemen worden verstrekt; en

      i. het toezien op de kwaliteitsaspecten van de informatieplannen, bedoeld in [artikel 4, onder c][ref6],
      aan vastgestelde kwaliteitsnormen en het rapporteren hierover aan de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties.


