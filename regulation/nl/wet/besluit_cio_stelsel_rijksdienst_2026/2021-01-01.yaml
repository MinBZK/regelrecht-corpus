  - number: '13'
    text: |-
      De minister van Binnenlandse Zaken en Koninkrijksrelaties draagt aan de CISO Rijk ten aanzien van digitalisering en
      informatievoorziening met betrekking tot de rijksdienst de taak op tot:

      a. het ontwikkelen, coördineren en monitoren van de implementatie en naleving van rijksbreed
      informatiebeveiligingsbeleid en -kaders en de wijze waarop de gegevens over de informatiebeveiliging van
      informatiesystemen door de ministeries worden verstrekt;

      b. het zorg dragen voor het rijksbrede informatiebeveiligingsbeleid als onderdeel van het rijksbrede
      digitaliserings- en informatievoorzieningsbeleid, bedoeld in [artikel 11, onder d][ref1];

      c. Het ontwikkelen en coördineren van het onderdeel informatiebeveiliging in de meerjarige I-strategie, bedoeld in
      [artikel 11, onderdeel d][ref2];

      d. het adviseren van de CIO Rijk en het lijnmanagement van het ministerie van Binnenlandse Zaken en
      Koninkrijksrelaties over de informatiebeveiliging en de risico’s daarvoor van (voorgenomen) wet- en regelgeving,
      investeringen, beleid, uitvoeringstrajecten, informatieprocessen en informatiesystemen voor zover deze betrekking
      hebben op de rijksdienst;

      e. het gevraagd en ongevraagd uitbrengen van rijksbrede adviezen en verstrekken van informatie, inzake
      informatiebeveiliging en het risicomanagement daarvan;

      f. het gevraagd en ongevraagd adviseren en informeren van de beveiligingsautoriteit Rijk ten behoeve van diens
      taakuitoefening op grond van het bepaalde in het [Besluit BVA-stelsel Rijksdienst 2021][ref3];

      g. het monitoren en controleren van het informatiebeveiligingsbewustzijn binnen de rijksdienst en het zorgdragen
      voor het vergroten van het bewustzijn over informatiebeveiliging binnen de rijksdienst;

      h. het onderhouden van relaties met de inlichtingen- en veiligheidsdiensten, het Nationaal Cyber Security Centrum
      en de Nationale Coördinator Terrorismebestrijding en Veiligheid aangaande dreigingen die verband houden met de
      informatiebeveiliging van de rijksdienst;

      i. het in samenwerking met de CISO’s en beveiligingsautoriteit Rijk opstellen en actueel houden van het rijksbrede
      risicobeeld en calamiteitenplan met betrekking tot informatiebeveiliging; en

      j. het coördineren van de aanpak van rijksbrede informatiebeveiligingsincidenten en -calamiteiten.


