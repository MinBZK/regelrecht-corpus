  - number: '10'
    text: |-
      1 De Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt een Chief Information Officer Rijk en een Chief
      Information Security Officer Rijk aan.

      2 De CIO Rijk is belast met de ontwikkeling en coördinatie van het rijksbrede informatievoorziening-
      en digitaliseringsbeleid en draagt zorg voor de ontwikkeling en het beheer van de ICT-voorzieningen en
      informatiesystemen, bedoeld in [artikel 2, eerste lid onder b, van het Coördinatiebesluit][ref1].

      3 De CISO Rijk is belast met de coördinatie van de maatregelen en het beleid voor de informatiebeveiliging voor
      zover deze betrekking hebben op de rijksdienst en ressorteert onder de CIO Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0029514#Artikel2
    url: https://wetten.overheid.nl/BWBR0044613/2021-01-01#Artikel10
