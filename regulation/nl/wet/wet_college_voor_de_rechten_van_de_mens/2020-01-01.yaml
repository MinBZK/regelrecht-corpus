        artikel: '1'
        hoofdstuk: '1'
  - number: '38'
    text: |-
      De administratie en het archief van de Commissie gelijke behandeling worden van rechtswege overgedragen aan het
      College voor de rechten van de mens.
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel38
  - number: '39.1'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel39
  - number: '39.2'
    text: |-
      Voor zover de [artikelen 15][ref1] en [16][ref2] eerder in werking treden dan [artikel 1][ref3], neemt de Commissie
      gelijke behandeling voor de toepassing van de artikelen 15, derde lid, en 16, tweede en derde lid, de plaats in van
      het College tot het tijdstip van inwerkingtreding van artikel 1.


      [ref1]: https://wetten.overheid.nl/BWBR0030733#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0030733#Artikel16
