        artikel: 46h
      - id: ref7
        bwb_id: BWBR0008365
        artikel: 46i
      - id: ref8
        bwb_id: BWBR0008365
        artikel: 46j
      - id: ref9
        bwb_id: BWBR0008365
        artikel: 46l
