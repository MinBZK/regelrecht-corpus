  - number: 17.1.a
    text: |-
      de disciplinaire maatregel, bedoeld in [artikel 46ca, eerste lid, onderdeel a][ref1], ten aanzien van de
      voorzitter van het College door de president van het gerechtshof Den Haag en ten aanzien van de overige leden en
      plaatsvervangende leden door de voorzitter van het College wordt opgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46ca
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46ca
  - number: 17.1.b
    text: |-
      het in [artikel 46c, onderdeel b][ref1], genoemde verbod zich in een onderhoud of een gesprek in te laten met
      partijen of haar advocaten of gemachtigden of een bijzondere inlichting of schriftelijk stuk van hen aan te nemen
      niet op de leden en de plaatsvervangende leden van het College van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46c
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46c
  - number: 17.1.c
    text: |-
      in de [artikelen 46j][ref1] en [46o, tweede lid][ref2], onder functionele autoriteit wordt verstaan: de voorzitter
      van het College.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46j
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46o
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46j
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46o
  - number: '17.2'
    text: |-
      De benoeming van de leden en van de plaatsvervangende leden geschiedt voor een tijdvak van ten hoogste zes jaar.
      Herbenoeming is terstond mogelijk.
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel17
  - number: '17.3'
    text: |-
      Onverminderd [artikel 9 van de Kaderwet zelfstandige bestuursorganen][ref1] komen voor benoeming als lid of
      plaatsvervangend lid, ambtenaren die werken onder de verantwoordelijkheid van een Onzer Ministers niet in
      aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel9
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '9'
  - number: '17.4'
    text: |-
      [Artikel 13 van de Kaderwet zelfstandige bestuursorganen][ref1] is van overeenkomstige toepassing op de
      plaatsvervangende leden van het College.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel13
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '13'
  - number: '17.5'
    text: |-
      Onverminderd [artikel 14, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref1] worden bij algemene
      maatregel van bestuur nadere regels gesteld over de rechtspositie van de leden, waaronder in elk geval regels
      betreffende hun beëdiging, vakantie, verlof, bedrijfsgeneeskundige begeleiding en voorzieningen bij ziekte en
      arbeidsongeschiktheid, en kunnen nadere regels worden gesteld over de rechtspositie van de plaatsvervangende leden.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel14
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '14'
  - number: 17a
    text: |-
      De [artikelen 13a tot en met 13g van de Wet op de rechterlijke organisatie][ref1] zijn van overeenkomstige
      toepassing ten aanzien van gedragingen van de leden en plaatsvervangende leden van het College, met dien verstande
      dat:


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel13a
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: 13a
  - number: 17a.a
    text: |-
      voor de overeenkomstige toepassing van die artikelen onder «het betrokken gerechtsbestuur» wordt verstaan: de
      voorzitter van het College;
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel17a
  - number: 17a.b
    text: |-
      voor de overeenkomstige toepassing van [artikel 13b, eerste lid, onderdelen b en c][ref1], onder «overeenkomstig
      [artikel 26][ref2] of [75][ref3] een klacht» wordt verstaan: een klacht.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel13b
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0001830#Artikel75
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: 13b
      - id: ref2
        bwb_id: BWBR0001830
        artikel: '26'
      - id: ref3
        bwb_id: BWBR0001830
        artikel: '75'
  - number: '18.1'
    text: Aan het College staat ter ondersteuning van zijn taak een bureau ten dienste.
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel18
  - number: '18.2'
    text: |-
      In afwijking van [artikel 4.6, eerste lid, van de Comptabiliteitswet 2016][ref1] sluit, wijzigt en beëindigt het
      College namens de Staat individuele arbeidsovereenkomsten met de bij het bureau werkzame ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel4
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '4'
  - number: '19'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld omtrent de werkwijze van de afdeling, bedoeld in
      [artikel 9][ref1], waaronder in elk geval regels betreffende:


      [ref1]: https://wetten.overheid.nl/BWBR0030733#Artikel9
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0030733
        artikel: '9'
        hoofdstuk: '2'
  - number: 19.a
    text: de wijze van behandeling;
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel19
  - number: 19.b
    text: hoor en wederhoor;
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel19
  - number: 19.c
    text: de openbaarheid van zittingen.
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel19
  - number: '20.1'
    text: |-
      De [artikelen 12][ref1] en [21 van de Kaderwet zelfstandige bestuursorganen][ref2] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel21
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '21'
  - number: '20.2'
    text: |-
      In afwijking van [artikel 20 van de Kaderwet zelfstandige bestuursorganen][ref1] is het College niet verplicht Onze
      Ministers van Binnenlandse Zaken en Koninkrijksrelaties en van Veiligheid en Justitie inlichtingen te verstrekken
      of inzage te geven in zakelijke gegevens en bescheiden, met betrekking tot de inhoud en de aanpak van lopende
      onderzoeken van het College als bedoeld in [artikel 3, onderdeel a][ref2], en [artikel 10][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0030733#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0030733#Artikel10
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0030733
        artikel: '3'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0030733
        artikel: '10'
        hoofdstuk: '2'
  - number: '20.3'
    text: |-
      In afwijking van [artikel 22 van de Kaderwet zelfstandige bestuursorganen][ref1] kunnen Onze Ministers van
      Binnenlandse Zaken en Koninkrijksrelaties en van Veiligheid en Justitie een besluit van het College dat betrekking
      heeft op het onderzoek of het oordeel, bedoeld in [artikel 10][ref2], niet vernietigen.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0030733#Artikel10
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0030733
        artikel: '10'
        hoofdstuk: '2'
  - number: '21.1'
    text: |-
      Onverminderd [artikel 18 van de Kaderwet zelfstandige bestuursorganen][ref1] bevat het jaarverslag een samenvatting
      van:


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel18
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '18'
  - number: 21.1.a
    text: de onderzoeken die het College in het voorafgaande jaar heeft gedaan;
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel21
  - number: 21.1.b
    text: de adviezen die het College in het voorafgaande jaar heeft gegeven;
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel21
  - number: 21.1.c
    text: de overige activiteiten die het College heeft ondernomen ter uitvoering van zijn taak.
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel21
  - number: '21.2'
    text: |-
      Het jaarverslag wordt openbaar gemaakt. Het College zendt dit verslag tevens aan de Nationale ombudsman, het
      College bescherming persoonsgegevens, maatschappelijke organisaties die zich de bescherming aantrekken van een of
      meer rechten van de mens en andere adviesorganen die het aangaat.
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel21
  - number: '22'
    text: |-
      Het College stelt elke vijf jaar een rapport op van zijn bevindingen ten aanzien van de werking in de praktijk van
      deze wet, de [Algemene wet gelijke behandeling][ref1], de [Wet gelijke behandeling van mannen en vrouwen][ref2]
      en [artikel 646 van Boek 7 van het Burgerlijk Wetboek][ref3]. Het College zendt dit rapport aan Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties.


      [ref1]: https://wetten.overheid.nl/BWBR0006502
      [ref2]: https://wetten.overheid.nl/BWBR0003299
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel646
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006502
      - id: ref2
        bwb_id: BWBR0003299
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '646'
  - number: '23'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties zendt zo spoedig mogelijk na ontvangst van het in
      [artikel 22][ref1] bedoelde rapport aan de Staten-Generaal een verslag over de werking in de praktijk van deze
      wet, de [Algemene wet gelijke behandeling][ref2], de [Wet gelijke behandeling van mannen en vrouwen][ref3] en
      [artikel 646 van Boek 7 van het Burgerlijk Wetboek][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0030733#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0006502
      [ref3]: https://wetten.overheid.nl/BWBR0003299
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel646
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0030733
        artikel: '22'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006502
      - id: ref3
        bwb_id: BWBR0003299
      - id: ref4
        bwb_id: BWBR0005290
        artikel: '646'
  - number: '35.1'
    text: |-
      In afwijking van [artikel 16][ref1] worden de benoemingen van de leden en de plaatsvervangende leden
      van de Commissie gelijke behandeling, onder wie de voorzitter en twee ondervoorzitters, van rechtswege
      gewijzigd in een benoeming tot leden en plaatsvervangende leden van het College voor de rechten van de mens.
      [Artikel 17, derde lid][ref2], is van overeenkomstige toepassing. De datum van benoeming in het latere ambt wordt
      gelijkgesteld met de datum van benoeming in het eerdere ambt.


      [ref1]: https://wetten.overheid.nl/BWBR0030733#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0030733#Artikel17
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0030733
        artikel: '16'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0030733
        artikel: '17'
        hoofdstuk: '3'
  - number: '35.2'
    text: |-
      De overgang van de in het eerste lid bedoelde leden en plaatsvervangende leden vindt plaats met dezelfde
      rechtspositie als die welke voor elk van hen gold bij de Commissie gelijke behandeling.
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel35
  - number: '36.1'
    text: |-
      Op het tijdstip van inwerkingtreding van [artikel 1][ref1] van deze wet behoren de personen die tot het bureau van
      de Commissie gelijke behandeling behoren, bedoeld in [artikel 17 van de Algemene wet gelijke behandeling][ref2],
      tot het bureau van het College voor de rechten van de mens.


      [ref1]: https://wetten.overheid.nl/BWBR0030733#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006502#Artikel17
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0030733
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0006502
        artikel: '17'
  - number: '36.2'
    text: |-
      De overgang van de in het eerste lid bedoelde personen vindt plaats met dezelfde rechtspositie als die welke voor
      elk van hen gold bij de Commissie gelijke behandeling.
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel36
  - number: '37'
    text: |-
      Onderzoeken op schriftelijk verzoek als bedoeld in
      [artikel 12, eerste lid, van de Algemene wet gelijke behandeling][ref1], die nog niet zijn voltooid op het tijdstip
      van inwerkingtreding van [artikel 1][ref2] van deze wet worden voortgezet door het College voor de rechten van
      de mens.


      [ref1]: https://wetten.overheid.nl/BWBR0006502#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0030733#Artikel1
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel37
