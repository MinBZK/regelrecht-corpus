preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om met het oog op de bescherming van de rechten van de
    mens, waaronder het recht op gelijke behandeling, en het bevorderen van de naleving daarvan in Nederland en mede
    ter uitvoering van Resolutie A/RES/48/134 van de Algemene Vergadering van de Verenigde Naties van 20 december 1993
    inzake nationale instituten voor de bevordering en bescherming van de rechten van de mens, aanbeveling R (97) 14
    van het Comité van ministers van de Raad van Europa van 30 september 1997 inzake de oprichting van onafhankelijke
    nationale mensenrechteninstituten, richtlijn nr. 2000/43/EG van de Raad van de Europese Unie van 29 juni 2000
    houdende toepassing van het beginsel van gelijke behandeling van personen ongeacht ras of etnische afstamming (PbEG
    L 180), richtlijn nr. 2004/113/EG van de Raad van de Europese Unie van 13 december 2004 houdende toepassing van het
    beginsel van gelijke behandeling van mannen en vrouwen bij de toegang tot en het aanbod van goederen en diensten
    (PbEU L 373) en richtlijn nr. 2006/54/EG van het Europees Parlement en de Raad van de Europese Unie van 5 juli
    2006 betreffende de toepassing van het beginsel van gelijke kansen en gelijke behandeling van mannen en vrouwen
    in arbeid en beroep (herschikking) (PbEU L 204), een nationaal mensenrechteninstituut op te richten, dat tevens
    is belast met de bescherming van het recht op gelijke behandeling en dat het mede in verband met artikel 79 van de
    Grondwet noodzakelijk is daartoe wettelijke bepalingen vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Er is een College voor de rechten van de mens, hierna te noemen: het College.'
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel1
  - number: '1.2'
    text: |-
      Het College is het nationaal instituut voor de rechten van de mens, bedoeld in Resolutie A/RES/48/134 van de
      Algemene Vergadering van de Verenigde Naties van 20 december 1993 inzake nationale instituten voor de bevordering
      en bescherming van de rechten van de mens en in aanbeveling R (97) 14 van het Comité van ministers van de Raad van
      Europa van 30 september 1997 inzake de oprichting van onafhankelijke nationale mensenrechteninstituten.
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel1
  - number: '1.3'
    text: |-
      Het College heeft tot doel in Nederland de rechten van de mens, waaronder het recht op gelijke behandeling, te
      beschermen, het bewustzijn van deze rechten te vergroten en de naleving van deze rechten te bevorderen.
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel1
  - number: '2'
    text: |-
      Deze wet, met uitzondering van [hoofdstuk 2][ref1], is mede van toepassing in de openbare lichamen Bonaire, Sint
      Eustatius en Saba, met dien verstande dat [artikel 3, onderdeel a][ref2], wordt gelezen als volgt:


      [ref1]: https://wetten.overheid.nl/BWBR0030733#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0030733#Artikel3
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0030733
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0030733
        artikel: '3'
        hoofdstuk: '1'
  - number: 2.a
    text: het doen van onderzoek naar de bescherming van de rechten van de mens;.
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel2
  - number: '3'
    text: 'De taak van het College is:'
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel3
  - number: 3.a
    text: |-
      het doen van onderzoek naar de bescherming van de rechten van de mens, waaronder het onderzoeken of een onderscheid
      is of wordt gemaakt en het geven van een oordeel daarover, bedoeld in [artikel 10][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030733#Artikel10
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0030733
        artikel: '10'
        hoofdstuk: '2'
  - number: 3.b
    text: |-
      het rapporteren en het doen van aanbevelingen over de bescherming van de rechten van de mens, waaronder het
      jaarlijks rapporteren over de mensenrechtensituatie in Nederland;
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel3
  - number: 3.c
    text: |-
      het geven van advies, bedoeld in [artikel 5][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030733#Artikel5
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0030733
        artikel: '5'
        hoofdstuk: '1'
  - number: 3.d
    text: het geven van voorlichting en het stimuleren en coördineren van onderwijs over de rechten van de mens;
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel3
  - number: 3.e
    text: het stimuleren van onderzoek naar de bescherming van de rechten van de mens;
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel3
  - number: 3.f
    text: |-
      het structureel samenwerken met maatschappelijke organisaties en met nationale, Europese en andere internationale
      instellingen die zich de bescherming aantrekken van een of meer rechten van de mens, onder meer door het
      organiseren van activiteiten in samenwerking met maatschappelijke organisaties;
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel3
  - number: 3.g
    text: |-
      het aansporen tot de ratificatie, implementatie en naleving van verdragen over de rechten van de mens en het
      aansporen tot de opheffing van voorbehouden bij zulke verdragen;
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel3
  - number: 3.h
    text: |-
      het aansporen tot de implementatie en naleving van bindende besluiten van volkenrechtelijke organisaties over de
      rechten van de mens;
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel3
  - number: 3.i
    text: het aansporen tot de naleving van Europese of internationale aanbevelingen over de rechten van de mens.
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel3
  - number: '4'
    text: Het College vervult zijn taak in onafhankelijkheid.
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel4
  - number: '5.1'
    text: |-
      Het College adviseert op schriftelijk verzoek van Onze Minister wie het aangaat of van een van beide kamers
      der Staten-Generaal over wetten, voorstellen van wet, algemene maatregelen van bestuur, ontwerpen van algemene
      maatregelen van bestuur, ministeriële regelingen en ontwerpen van ministeriële regelingen die direct of indirect
      betrekking hebben op de rechten van de mens.
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel5
  - number: '5.2'
    text: |-
      Het College kan uit eigen beweging Onze Minister wie het aangaat of een van beide kamers der Staten-Generaal
      adviseren over wetten, voorstellen van wet, algemene maatregelen van bestuur, ontwerpen van algemene maatregelen
      van bestuur, ministeriële regelingen en ontwerpen van ministeriële regelingen die direct of indirect betrekking
      hebben op de rechten van de mens.
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel5
  - number: '5.3'
    text: |-
      Het College kan op schriftelijk verzoek of uit eigen beweging een bestuursorgaan wie het aangaat of een van beide
      kamers der Staten-Generaal adviseren over ontwerpen van bindende besluiten van Europese en andere internationale
      instellingen die direct of indirect betrekking hebben op de rechten van de mens en over beleid dat direct of
      indirect betrekking heeft op de rechten van de mens.
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel5
  - number: '5.4'
    text: |-
      Het College kan op schriftelijk verzoek of uit eigen beweging een bestuursorgaan wie het aangaat adviseren over
      andere algemeen verbindende voorschriften dan bedoeld in het eerste lid die direct of indirect betrekking hebben op
      de rechten van de mens, en ontwerpen daarvan.
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel5
  - number: '6.1'
    text: |-
      Het College en daartoe door het College aangewezen personen kunnen alle inlichtingen en bescheiden vorderen die
      voor de vervulling van de taak van het College redelijkerwijs nodig zijn.
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel6
  - number: '6.2'
    text: |-
      Een ieder is verplicht de ingevolge het eerste lid gevorderde inlichtingen en bescheiden volledig en naar waarheid
      te verstrekken, een en ander op de wijze en binnen de termijn door of namens het College vast te stellen.
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel6
  - number: '6.3'
    text: |-
      Het tweede lid geldt niet voor zover het inlichtingen en bescheiden betreft waarvan het verstrekken in strijd is
      met het belang van de nationale veiligheid, dan wel een schending van een ambts- of beroepsgeheim met zich brengt.
      Voorts geldt deze verplichting niet, indien een persoon daardoor of zichzelf of een van zijn bloed- of aanverwanten
      in de rechte lijn of in de zijlijn in de tweede of de derde graad of zijn echtgenoot of eerdere echtgenoot dan wel
      geregistreerde partner of eerdere geregistreerde partner aan het gevaar van een strafrechtelijke veroordeling ter
      zake van een misdrijf zou blootstellen.
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel6
  - number: '7.1'
    text: |-
      Het College kan een onderzoek ter plaatse instellen. Het heeft toegang tot elke plaats, met uitzondering van een
      woning zonder toestemming van de bewoner, voor zover dat redelijkerwijze voor de vervulling van zijn taak nodig is.
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel7
  - number: '7.2'
    text: |-
      Het eerste lid geldt niet voor plaatsen die als verboden plaats zijn aangewezen ingevolge de
      [Wet bescherming staatsgeheimen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002074
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002074
  - number: '8.1'
    text: |-
      De onderzoeken, rapporten en aanbevelingen, bedoeld in [artikel 3, onderdelen a en b][ref1], en de adviezen,
      bedoeld in [artikel 5][ref2], worden door het College openbaar gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0030733#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0030733#Artikel5
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0030733
        artikel: '3'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0030733
        artikel: '5'
        hoofdstuk: '1'
  - number: '8.2'
    text: |-
      Onze Minister wie het aangaat stelt het College in de gelegenheid de onderzoeken, rapporten, aanbevelingen en
      adviezen met hem te bespreken.
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel8
  - number: '9'
    text: Binnen het College is een afdeling belast met de uitvoering van de in dit hoofdstuk bedoelde taak.
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel9
  - number: '10.1'
    text: |-
      Het College kan op schriftelijk verzoek onderzoeken of een onderscheid is of wordt gemaakt als bedoeld in
      de [Algemene wet gelijke behandeling][ref1], de [Wet gelijke behandeling van mannen en vrouwen][ref2] of
      [artikel 646 van Boek 7 van het Burgerlijk Wetboek][ref3], en zijn oordeel daaromtrent kenbaar maken. Voorts
      kan het College uit eigen beweging onderzoeken of zodanig onderscheid stelselmatig wordt gemaakt en zijn oordeel
      daarover kenbaar maken.


      [ref1]: https://wetten.overheid.nl/BWBR0006502
      [ref2]: https://wetten.overheid.nl/BWBR0003299
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel646
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006502
      - id: ref2
        bwb_id: BWBR0003299
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '646'
  - number: '10.2'
    text: 'Een schriftelijk verzoek als bedoeld in het eerste lid kan worden ingediend door:'
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel10
  - number: 10.2.a
    text: |-
      degene die meent dat te zijnen nadele een onderscheid is of wordt gemaakt als bedoeld in de
      [Algemene wet gelijke behandeling][ref1], de [Wet gelijke behandeling van mannen en vrouwen][ref2] of
      [artikel 646 van Boek 7 van het Burgerlijk Wetboek][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0006502
      [ref2]: https://wetten.overheid.nl/BWBR0003299
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel646
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006502
      - id: ref2
        bwb_id: BWBR0003299
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '646'
  - number: 10.2.b
    text: |-
      de natuurlijke persoon, de rechtspersoon of het bevoegd gezag, die wensen te weten of zij een onderscheid maken als
      bedoeld in de [Algemene wet gelijke behandeling][ref1], de [Wet gelijke behandeling van mannen en vrouwen][ref2] of
      [artikel 646 van Boek 7 van het Burgerlijk Wetboek][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0006502
      [ref2]: https://wetten.overheid.nl/BWBR0003299
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel646
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006502
      - id: ref2
        bwb_id: BWBR0003299
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '646'
  - number: 10.2.c
    text: |-
      degene die belast is met de beslissing over een geschil met betrekking tot onderscheid als bedoeld in
      de [Algemene wet gelijke behandeling][ref1], de [Wet gelijke behandeling van mannen en vrouwen][ref2] of
      [artikel 646 van Boek 7 van het Burgerlijk Wetboek][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0006502
      [ref2]: https://wetten.overheid.nl/BWBR0003299
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel646
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006502
      - id: ref2
        bwb_id: BWBR0003299
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '646'
  - number: 10.2.d
    text: |-
      een ondernemingsraad, die meent dat in de onderneming waarvoor deze is ingesteld, onderscheidenlijk
      een met die ondernemingsraad vergelijkbaar medezeggenschapsorgaan, dat meent dat in het organisatorisch
      samenwerkingsverband waarvoor het is ingesteld, onderscheid wordt gemaakt als bedoeld in de
      [Algemene wet gelijke behandeling][ref1], de [Wet gelijke behandeling van mannen en vrouwen][ref2] en in
      [artikel 646 van Boek 7 van het Burgerlijk Wetboek][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0006502
      [ref2]: https://wetten.overheid.nl/BWBR0003299
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel646
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006502
      - id: ref2
        bwb_id: BWBR0003299
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '646'
  - number: 10.2.e
    text: |-
      een vereniging met volledige rechtsbevoegdheid of stichting, die in overeenstemming met haar statuten
      de belangen behartigt van diegenen in wier bescherming de [Algemene wet gelijke behandeling][ref1], de
      [Wet gelijke behandeling van mannen en vrouwen][ref2] of [artikel 646 van Boek 7 van het Burgerlijk Wetboek][ref3]
      beoogt te voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0006502
      [ref2]: https://wetten.overheid.nl/BWBR0003299
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel646
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006502
      - id: ref2
        bwb_id: BWBR0003299
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '646'
  - number: '10.3'
    text: |-
      In het geval een schriftelijk verzoek als bedoeld in het tweede lid, onderdelen d en e, personen noemt ten nadele
      van wie zou zijn gehandeld, dan wel indien een onderzoek ingesteld uit eigen beweging, betrekking heeft op zodanige
      personen, stelt het College deze personen op de hoogte van het voornemen tot onderzoek. Het College is niet bevoegd
      in het onderzoek en de beoordeling personen als bedoeld in de eerste volzin te betrekken die schriftelijk hebben
      verklaard daartegen bedenkingen te hebben.
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel10
  - number: '11.1'
    text: |-
      Het College stelt een onderzoek in en brengt zijn oordeel schriftelijk en met redenen omkleed ter kennis van de
      verzoeker, van degene die het onderscheid zou maken, alsmede, in voorkomend geval, van degene, jegens wie het
      onderscheid zou worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel11
  - number: '11.2'
    text: |-
      Het College kan bij het ter kennis brengen van zijn oordeel aan degene die het onderscheid zou maken, aanbevelingen
      doen.
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel11
  - number: '11.3'
    text: |-
      Het College kan zijn oordeel ter kennis brengen van Onze Ministers wie het aangaat, van naar zijn mening in
      aanmerking komende organisaties van werkgevers, van werknemers, uit het beroepsleven of van overheidspersoneel, van
      eindgebruikers van goederen of diensten en van betrokken overlegorganen.
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel11
  - number: '12.1'
    text: 'Het College stelt geen onderzoek in of beëindigt het onderzoek, indien:'
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel12
  - number: 12.1.a
    text: |-
      het in [artikel 10, tweede lid][ref1], bedoelde verzoek kennelijk ongegrond is;


      [ref1]: https://wetten.overheid.nl/BWBR0030733#Artikel10
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0030733
        artikel: '10'
        hoofdstuk: '2'
  - number: 12.1.b
    text: het belang van de verzoeker of het gewicht van de gedraging kennelijk onvoldoende is;
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel12
  - number: 12.1.c
    text: |-
      sinds het in [artikel 10][ref1] bedoelde onderscheid een zodanige termijn is verstreken dat in redelijkheid geen
      onderzoek meer kan plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0030733#Artikel10
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0030733
        artikel: '10'
        hoofdstuk: '2'
  - number: '12.2'
    text: |-
      Indien zich gevallen als bedoeld in het eerste lid voordoen, doet het College daarover aan verzoeker schriftelijk
      en met redenen omkleed mededeling.
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel12
  - number: '13.1'
    text: |-
      Het College kan in rechte vorderen dat een gedraging die in strijd is met de
      [Algemene wet gelijke behandeling][ref1], de [Wet gelijke behandeling van mannen en vrouwen][ref2] of
      [artikel 646 van Boek 7 van het Burgerlijk Wetboek][ref3] onrechtmatig wordt verklaard, dat deze wordt verboden of
      dat een bevel wordt gegeven om de gevolgen van die gedraging ongedaan te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0006502
      [ref2]: https://wetten.overheid.nl/BWBR0003299
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel646
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006502
      - id: ref2
        bwb_id: BWBR0003299
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '646'
  - number: '13.2'
    text: |-
      Een gedraging kan niet ten grondslag worden gelegd aan een vordering als bedoeld in het eerste lid, voor zover
      degene die door deze gedraging wordt getroffen, daartegen bedenkingen heeft.
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel13
  - number: '14.1'
    text: |-
      Het College bestaat uit minimaal negen en maximaal twaalf leden, onder wie een voorzitter en twee ondervoorzitters.
      Voorts kunnen plaatsvervangende leden worden benoemd.
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel14
  - number: '14.2'
    text: |-
      De voorzitter en een van beide ondervoorzitters voldoen aan de vereisten
      voor benoembaarheid tot rechterlijk ambtenaar, gesteld bij of krachtens
      [artikel 5, eerste en tweede lid, van de Wet rechtspositie rechterlijke ambtenaren][ref1]. Bij de benoeming van de
      voorzitter van het College kan in bijzondere gevallen van het bepaalde in de eerste volzin worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel5
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '5'
  - number: '14.3'
    text: Het College wordt vertegenwoordigd door de voorzitter of, bij afwezigheid, door een ondervoorzitter.
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel14
  - number: '15.1'
    text: |-
      Er is een raad van advies. De raad adviseert het College elk jaar over het voorgenomen beleidsplan van het College
      en adviseert Onze Minister van Veiligheid en Justitie over de benoeming van de leden en de plaatsvervangende leden
      van het College.
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel15
  - number: '15.2'
    text: |-
      De raad bestaat uit de Nationale ombudsman, de voorzitter van het College bescherming persoonsgegevens,
      de voorzitter van de Raad voor de rechtspraak en uit minimaal vier en maximaal acht leden afkomstig van
      maatschappelijke organisaties die zich de bescherming aantrekken van een of meer rechten van de mens, van
      werkgevers- en werknemersorganisaties en uit de kringen van de wetenschap.
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel15
  - number: '15.3'
    text: |-
      De leden van de raad, met uitzondering van de Nationale ombudsman, de voorzitter van het College bescherming
      persoonsgegevens en de voorzitter van de Raad voor de rechtspraak, worden benoemd, geschorst en ontslagen
      door Onze Minister van Veiligheid en Justitie in overeenstemming met Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties, gehoord het College, de Nationale ombudsman, de voorzitter van het College bescherming
      persoonsgegevens en de voorzitter van de Raad voor de rechtspraak. Deze leden worden benoemd voor ten hoogste vier
      jaar. Herbenoeming kan eenmaal voor ten hoogste vier jaar plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel15
  - number: '15.4'
    text: De leden kiezen uit hun midden een voorzitter. De raad bepaalt zijn eigen werkwijze.
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel15
  - number: '15.5'
    text: |-
      [Artikel 13 van de Kaderwet zelfstandige bestuursorganen][ref1] is van overeenkomstige toepassing op de leden van
      de raad.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel13
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '13'
  - number: '16.1'
    text: |-
      De leden en de plaatsvervangende leden van het College worden benoemd bij koninklijk besluit, op voordracht van
      Onze Minister van Veiligheid en Justitie.
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel16
  - number: '16.2'
    text: |-
      Ten behoeve van de voordracht adviseert de raad in overeenstemming met het College Onze Minister van Veiligheid en
      Justitie, rekening houdend met de noodzaak van een deskundig en onafhankelijk College, alsmede met het streven naar
      een divers samengesteld College.
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel16
  - number: '16.3'
    text: |-
      Een vacature voor een lid of plaatsvervangend lid en de te volgen selectieprocedure worden door het College
      openbaar gemaakt. Het College en de raad brengen de vacature tevens onder de aandacht van maatschappelijke
      organisaties die zich de bescherming aantrekken van een of meer rechten van de mens.
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel16
  - number: '17.1'
    text: |-
      De [artikelen 46c][ref1], [46ca][ref2], [46d, tweede lid][ref3], [46f][ref4], [46g][ref5],
      [46h, eerste en tweede lid][ref6], [46i, met uitzondering van het eerste lid, onderdeel c][ref7], [46j][ref8],
      [46l, met uitzondering van het eerste lid, onderdeel c][ref9], [46m][ref10], [46n][ref11], [46o][ref12] en
      [46p van de Wet rechtspositie rechterlijke ambtenaren][ref13] zijn van overeenkomstige toepassing op de leden en
      plaatsvervangende leden van het College, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46c
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46ca
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel46d
      [ref4]: https://wetten.overheid.nl/BWBR0008365#Artikel46f
      [ref5]: https://wetten.overheid.nl/BWBR0008365#Artikel46g
      [ref6]: https://wetten.overheid.nl/BWBR0008365#Artikel46h
      [ref7]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
      [ref8]: https://wetten.overheid.nl/BWBR0008365#Artikel46j
      [ref9]: https://wetten.overheid.nl/BWBR0008365#Artikel46l
      [ref10]: https://wetten.overheid.nl/BWBR0008365#Artikel46m
      [ref11]: https://wetten.overheid.nl/BWBR0008365#Artikel46n
      [ref12]: https://wetten.overheid.nl/BWBR0008365#Artikel46o
      [ref13]: https://wetten.overheid.nl/BWBR0008365#Artikel46p
    url: https://wetten.overheid.nl/BWBR0030733/2020-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46c
      - id: ref2
        bwb_id: BWBR0008365
