  - number: 32h.3
    text: |-
      Voor het tweede lid is [artikel 33, eerste lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel33
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel32h
    references:
      - id: ref1
