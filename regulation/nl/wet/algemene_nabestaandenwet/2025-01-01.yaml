      [18][ref2], [67][ref3] of [70, eerste lid][ref4], wordt verminderd dan wel anderszins op een lager bedrag wordt
      vastgesteld dan het bedrag, bedoeld in artikel 17, eerste lid, wordt op de vakantie-uitkering een evenredige
      vermindering toegepast dan wel de vakantie-uitkering evenredig verlaagd.


