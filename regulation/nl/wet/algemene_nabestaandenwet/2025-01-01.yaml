    text: |-
      Geen recht op nabestaandenuitkering ontstaat voor de nabestaande indien hij op de dag van het overlijden van de
      verzekerde niet in Nederland woont. Geen recht op wezenuitkering ontstaat voor het kind indien het op de dag van
      het overlijden van de verzekerde niet in Nederland woont.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel32a
  - number: 32a.2
    text: |-
      Het eerste lid is niet van toepassing indien de nabestaande onderscheidenlijk het kind op de dag van het overlijden
      van de verzekerde woont in een land waarin op grond van een verdrag of een besluit van een volkenrechtelijke
      organisatie recht op nabestaandenuitkering onderscheidenlijk wezenuitkering kan bestaan.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel32a
  - number: 32a.3
