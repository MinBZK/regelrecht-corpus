      Geen recht op nabestaandenuitkering ontstaat voor de nabestaande indien hij op de dag van het overlijden van de
      verzekerde een uitreiziger is. Geen recht op wezenuitkering ontstaat voor het kind indien het op de dag van het
      overlijden van de verzekerde een uitreiziger is.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel32g
  - number: 32g.2
    text: |-
