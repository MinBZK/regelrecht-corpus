      Het derde lid is van overeenkomstige toepassing, indien de nabestaande onderscheidenlijk het kind niet in Nederland
      wonen, vanaf de dag dat betrokkene in een land woont waarmee een verdrag in werking is getreden dan wel een besluit
      van een volkenrechtelijke organisatie van kracht is geworden, op grond waarvan recht op nabestaandenuitkering
      onderscheidenlijk wezenuitkering kan bestaan.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel32a
  - number: 32a.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat recht op nabestaandenuitkering of
      wezenuitkering ontstaat voor:
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel32a
  - number: 32a.5.a
