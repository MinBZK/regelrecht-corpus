  - number: 32h.1
    text: |-
      Het recht op nabestaandenuitkering eindigt, indien de nabestaande, nadat het recht op nabestaandenuitkering
      is ingegaan, een uitreiziger is. Het recht op wezenuitkering eindigt indien het kind, nadat het recht op
      wezenuitkering is ingegaan, een uitreiziger is.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel32h
  - number: 32h.2
    text: |-
