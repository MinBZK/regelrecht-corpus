    text: |-
      niet langer het gegronde vermoeden bestaat dat het kind zich buiten Nederland bevindt met het doel zich aan te
      sluiten bij een organisatie als bedoeld in [artikel 1, onderdeel q][ref1], en het voldoet aan een voorwaarde als
