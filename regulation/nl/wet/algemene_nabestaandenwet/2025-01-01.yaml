        artikel: '33'
        hoofdstuk: '3'
        afdeling: II
  - number: '33.1'
    text: De Sociale verzekeringsbank stelt op aanvraag vast of recht op nabestaanden- of wezenuitkering bestaat.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel33
  - number: '33.2'
    text: De vakantie-uitkering wordt betaald zonder dat dit bij beschikking is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel33
  - number: '33.3'
    text: Een aanvraag wordt ingediend door middel van een door de Sociale verzekeringsbank beschikbaar gesteld formulier.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel33
  - number: '33.4'
    text: |-
      Het recht op uitkering wordt niet vastgesteld over perioden gelegen voor één jaar voorafgaand aan de dag waarop
      de Sociale verzekeringsbank de aanvraag om uitkering heeft ontvangen. De Sociale verzekeringsbank is bevoegd in
      bijzondere gevallen af te wijken van de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel33
  - number: '34.1'
    text: |-
      Onverminderd het elders in deze wet bepaalde terzake van herziening of intrekking van een besluit tot toekenning
      van uitkering en terzake van weigering van uitkering, herziet de Sociale verzekeringsbank een dergelijk besluit of
      trekt zij dat in:
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel34
  - number: 34.1.a
    text: |-
      indien het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 35][ref1],
      [36, tweede lid][ref2], of [37][ref3] heeft geleid tot het ten onrechte of tot een te hoog bedrag verlenen van
      uitkering;


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0007795#Artikel37
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '35'
        hoofdstuk: '3'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '36'
        hoofdstuk: '3'
        afdeling: II
      - id: ref3
        bwb_id: BWBR0007795
        artikel: '37'
        hoofdstuk: '3'
        afdeling: II
  - number: 34.1.b
    text: indien anderszins de uitkering ten onrechte of tot een te hoog bedrag is verleend;
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel34
  - number: 34.1.c
    text: |-
      indien het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 35][ref1], [35a][ref2],
      [36, tweede lid][ref3], of [37][ref4] er toe leidt dat niet kan worden vastgesteld of nog recht op uitkering
      bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel35a
      [ref3]: https://wetten.overheid.nl/BWBR0007795#Artikel36
      [ref4]: https://wetten.overheid.nl/BWBR0007795#Artikel37
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '35'
        hoofdstuk: '3'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0007795
        artikel: 35a
        hoofdstuk: '3'
        afdeling: II
      - id: ref3
        bwb_id: BWBR0007795
        artikel: '36'
        hoofdstuk: '3'
        afdeling: II
      - id: ref4
        bwb_id: BWBR0007795
        artikel: '37'
        hoofdstuk: '3'
        afdeling: II
  - number: '34.2'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan de Sociale verzekeringsbank besluiten geheel of gedeeltelijk
      van herziening of intrekking af te zien.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel34
  - number: '35.1'
    text: |-
      De nabestaande, het ouderloos kind en zijn wettelijke vertegenwoordiger alsmede de instelling aan welke ingevolge
      [artikel 49][ref1] of [57][ref2] de uitkering wordt uitbetaald, zijn verplicht aan de Sociale verzekeringsbank
      op haar verzoek of onverwijld uit eigen beweging alle feiten en omstandigheden mee te delen, waarvan hun
      redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op het recht op uitkering, de hoogte van de
      uitkering, het geldend maken van het recht op uitkering of op het bedrag van de uitkering, dat wordt uitbetaald.
      De verplichting geldt niet indien die feiten en omstandigheden door de Sociale verzekeringsbank kunnen worden
      vastgesteld op grond van bij wettelijk voorschrift als authentiek aangemerkte gegevens of kunnen worden verkregen
      uit bij ministeriële regeling aan te wijzen administraties. Bij ministeriële regeling wordt bepaald voor welke
      gegevens de tweede zin van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel57
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '49'
        hoofdstuk: '3'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '57'
        hoofdstuk: '3'
        afdeling: III
  - number: '35.2'
    text: |-
      Op verzoek van de Sociale verzekeringsbank legt de meerderjarige persoon die in dezelfde woning als de nabestaande
      zijn hoofdverblijf heeft, als bedoeld in [artikel 17, vijfde lid][ref1], desgevraagd alle gegevens en inlichtingen
      over die voor de beoordeling van de aanspraak op uitkering van belang kunnen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel17
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: I
  - number: 35a
    text: |-
      In aanvulling op [artikel 35][ref1] kan de Sociale verzekeringsbank de nabestaande dan wel zijn wettelijke
      vertegenwoordiger respectievelijk het ouderloos kind dan wel zijn wettelijke vertegenwoordiger verzoeken aan te
      tonen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel35
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '35'
        hoofdstuk: '3'
        afdeling: II
  - number: 35a.a
    text: de nabestaande geen gezamenlijke huishouding voert anders dan ten behoeve van de verzorging van een hulpbehoevende;
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel35a
  - number: 35a.b
    text: |-
      het kind, bedoeld in [artikel 26, tweede lid, onderdeel d][ref1], ongehuwd is en dat tot zijn huishouden ten minste
      een ander kind behoort dat recht heeft op een wezenuitkering;


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel26
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: I
  - number: 35a.c
    text: |-
      de feitelijke woonsituatie van de nabestaande of van een ouderloos kind in overeenstemming is met het verstrekte
      adres van die nabestaande of van dat ouderloos kind.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel35a
  - number: '36.1'
    text: |-
      De Sociale verzekeringsbank is bevoegd controlevoorschriften vast te stellen. Deze voorschriften mogen niet verder
      gaan dan strikt noodzakelijk is voor een juiste uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel36
  - number: '36.2'
    text: |-
      De nabestaande, het ouderloos kind dan wel zijn wettelijk vertegenwoordiger of de instelling waaraan op grond
      van [artikel 49][ref1] of [57][ref2] de uitkering wordt uitbetaald, is verplicht de voorschriften op te volgen en
      anderszins aan de Sociale verzekeringsbank desgevraagd de medewerking te verlenen die redelijkerwijs nodig is voor
      de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel57
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '49'
        hoofdstuk: '3'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '57'
        hoofdstuk: '3'
        afdeling: III
  - number: '36.3'
    text: |-
      De nabestaande, het ouderloos kind of zijn wettelijk vertegenwoordiger, onthouden zich van zeer ernstige
      misdragingen jegens de met de uitvoering van deze wet belaste personen en instanties tijdens het verrichten van
      hun werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel36
  - number: '37'
    text: |-
      Voor de toepassing van de [artikelen 5, tweede lid][ref1], [11][ref2],
      [14, eerste lid, aanhef en onderdeel b][ref3], [26, tweede lid, aanhef en onderdeel b][ref4], dan wel om te bepalen
      of een gezamenlijke huishouding ten behoeve van de verzorging van een hulpbehoevende wordt gevoerd, onderwerpt de
      betrokken persoon zich op verzoek van de Sociale verzekeringsbank aan een geneeskundig onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0007795#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0007795#Artikel26
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '5'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '11'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0007795
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0007795
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: I
  - number: '38.1'
    text: |-
      De Sociale verzekeringsbank weigert de uitkering tijdelijk of blijvend, geheel of gedeeltelijk indien
      de nabestaande, het ouderloos kind, of zijn wettelijke vertegenwoordiger een verplichting op grond
      van [artikel 36, tweede of derde lid][ref1], of [37][ref2] opgelegd, of de verplichtingen, bedoeld in
      [artikel 55, tweede lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3], niet of niet
      behoorlijk is nagekomen, dan wel de verplichting, bedoeld in [artikel 35][ref4], niet binnen de door de Sociale
      verzekeringsbank daarvoor vastgestelde termijn is nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel55
      [ref4]: https://wetten.overheid.nl/BWBR0007795#Artikel35
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '36'
        hoofdstuk: '3'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '37'
        hoofdstuk: '3'
        afdeling: II
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '55'
      - id: ref4
        bwb_id: BWBR0007795
        artikel: '35'
        hoofdstuk: '3'
        afdeling: II
  - number: '38.2'
    text: |-
      Een maatregel als bedoeld in het eerste lid wordt afgestemd op de ernst van de gedraging en de mate waarin de
      nabestaande, het ouderloos kind, of zijn wettelijke vertegenwoordiger de gedraging verweten kan worden. Van het
      opleggen van een maatregel wordt in elk geval afgezien, indien elke vorm van verwijtbaarheid ontbreekt.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel38
  - number: '38.3'
    text: |-
      De Sociale verzekeringsbank kan afzien van het opleggen van een maatregel als bedoeld in het eerste lid en volstaan
      met het geven van een schriftelijke waarschuwing ter zake van het niet tijdig nakomen van de verplichting, bedoeld
      in [artikel 35][ref1], indien het niet tijdig nakomen van de verplichting niet heeft geleid tot het ten onrechte
      of tot een te hoog bedrag verlenen van uitkering, tenzij het niet tijdig nakomen van de verplichting plaatsvindt
      binnen een periode van twee jaar te rekenen vanaf de datum waarop eerder aan de nabestaande, het ouderloos kind, of
      zijn wettelijke vertegenwoordiger, een zodanige waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel35
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '35'
        hoofdstuk: '3'
        afdeling: II
  - number: '38.4'
    text: |-
      De Sociale verzekeringsbank kan afzien van het opleggen van een maatregel indien daarvoor dringende redenen
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel38
  - number: '38.5'
    text: |-
      Het opleggen van een maatregel blijft achterwege indien voor dezelfde gedraging een bestuurlijke boete als bedoeld
      in [artikel 39][ref1] wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel39
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '39'
        hoofdstuk: '3'
        afdeling: II
  - number: '38.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste en
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel38
  - number: '39.1'
    text: |-
      De Sociale verzekeringsbank legt een bestuurlijke boete op van ten hoogste het benadelingsbedrag
      wegens het niet of niet behoorlijk nakomen door de nabestaande, het ouderloos kind, of zijn wettelijke
      vertegenwoordiger van de verplichting, bedoeld in [artikel 35][ref1]. Indien de feiten en omstandigheden,
      bedoeld in artikel 35, niet of niet behoorlijk zijn medegedeeld en deze overtreding opzettelijk is
      begaan, bedraagt de bestuurlijke boete ten hoogste het bedrag van de vijfde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2]. Indien de feiten en omstandigheden, bedoeld in
      artikel 35, niet of niet behoorlijk zijn medegedeeld en deze overtreding niet opzettelijk is begaan, bedraagt
      de bestuurlijke boete ten hoogste het bedrag van de derde categorie, bedoeld in artikel 23, vierde lid, van het
      Wetboek van Strafrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '35'
        hoofdstuk: '3'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '23'
  - number: '39.2'
    text: |-
      In dit artikel wordt onder benadelingsbedrag verstaan het brutobedrag dat als gevolg van het niet of niet
      behoorlijk nakomen van de verplichting, bedoeld in [artikel 35][ref1], ten onrechte of tot een te hoog bedrag aan
      nabestaandenuitkering of wezenuitkering is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel35
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '35'
        hoofdstuk: '3'
        afdeling: II
  - number: '39.3'
    text: |-
      Indien het niet of niet behoorlijk nakomen door de nabestaande, het ouderloos kind, of zijn wettelijke
      vertegenwoordiger van de verplichting, bedoeld in [artikel 35][ref1], niet heeft geleid tot een benadelingsbedrag,
      legt de Sociale verzekeringsbank een bestuurlijke boete op van ten hoogste het bedrag van de tweede categorie,
      bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '35'
        hoofdstuk: '3'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '23'
  - number: '39.4'
    text: |-
      De Sociale verzekeringsbank kan afzien van het opleggen van een bestuurlijke boete en volstaan met het geven
      van een schriftelijke waarschuwing wegens het niet of niet behoorlijk nakomen van de verplichting, bedoeld in
      [artikel 35][ref1], in situaties die bij algemene maatregel van bestuur worden bepaald, tenzij het niet of
      niet behoorlijk nakomen van de verplichting plaats vindt binnen een periode van twee jaar te rekenen vanaf de
      datum waarop eerder aan de nabestaande, het ouderloos kind, of zijn wettelijke vertegenwoordiger, een zodanige
      waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel35
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '35'
        hoofdstuk: '3'
        afdeling: II
  - number: '39.5'
    text: |-
      De Sociale verzekeringsbank legt een bestuurlijke boete op wegens het niet of niet behoorlijk nakomen door
      de nabestaande, het ouderloos kind, of zijn wettelijke vertegenwoordiger van de verplichting, bedoeld in
      [artikel 35][ref1], als gevolg waarvan ten onrechte of tot een te hoog bedrag aan nabestaandenuitkering of
      wezenuitkering is ontvangen, van ten hoogste 150 procent van het benadelingsbedrag, met overeenkomstige toepassing
      van het eerste lid, indien binnen een tijdvak van vijf jaar voorafgaand aan de dag van het begaan van de
      overtreding een eerdere bestuurlijke boete of strafrechtelijke sanctie is opgelegd wegens een eerdere overtreding,
      bestaande uit eenzelfde gedraging, die onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel35
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '35'
        hoofdstuk: '3'
        afdeling: II
  - number: '39.6'
    text: |-
      In afwijking van het vijfde lid is het in dat lid genoemde tijdvak van vijf jaar tien jaar indien wegens de eerdere
      overtreding, bedoeld in het vijfde lid, de nabestaande, het ouderloos kind, of zijn wettelijke vertegenwoordiger is
      gestraft met een onvoorwaardelijke gevangenisstraf.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel39
  - number: '39.7'
    text: |-
      De Sociale verzekeringsbank kan afzien van het opleggen van een bestuurlijke boete indien daarvoor dringende
      redenen aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel39
  - number: '39.8'
    text: |-
      Degene aan wie een bestuurlijke boete is opgelegd, is verplicht desgevraagd aan de Sociale verzekeringsbank de
      inlichtingen te verstrekken die voor de tenuitvoerlegging van de bestuurlijke boete van belang zijn.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel39
  - number: '39.9'
    text: Bij algemene maatregel van bestuur worden nadere regels gesteld over de hoogte van de bestuurlijke boete.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel39
  - number: '39.10'
    text: |-
      In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref1] kan de rechter in beroep of hoger beroep
      het bedrag waarop de bestuurlijke boete is vastgesteld ook ten nadele van de nabestaande, het ouderloos kind, of
      zijn wettelijke vertegenwoordiger wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '39.11'
    text: |-
      Indien ten aanzien van een overtreding waarvoor een bestuurlijke boete is opgelegd geen sprake is geweest van opzet
      of grove schuld, en voorts is gebleken dat binnen een jaar nadat de bestuurlijke boete is opgelegd niet nogmaals
      een overtreding wegens eenzelfde gedraging is begaan, is de Sociale verzekeringsbank bevoegd op verzoek van degene
      aan wie de bestuurlijke boete is opgelegd, de bestuurlijke boete geheel of gedeeltelijk kwijt te schelden bij
      medewerking aan een schuldregeling. [Artikel 55a, eerste, derde en vierde lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel55a
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: 55a
        hoofdstuk: '3'
        afdeling: III
  - number: '39.12'
    text: |-
      Het besluit tot kwijtschelding, bedoeld in het elfde lid, wordt ingetrokken of ten nadele van degene aan wie
      de bestuurlijke boete is opgelegd herzien indien binnen vijf jaar na het besluit tot kwijtschelding wederom een
      overtreding wegens eenzelfde gedraging is begaan.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel39
  - number: '41'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de termijn waarvoor uitstel van
      betaling van de bestuurlijke boete kan worden verleend alsmede omtrent de hoogte van het op grond van
      [artikel 45, eerste of tweede lid][ref1], te verrekenen bedrag en de termijn of termijnen waarbinnen deze
      verrekening plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel45
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '45'
        hoofdstuk: '3'
        afdeling: II
  - number: '45.1'
    text: |-
      De Sociale verzekeringsbank verrekent de bestuurlijke boete en een eerdere bestuurlijke boete wegens eenzelfde
      gedraging als bedoeld in [artikel 39, vijfde lid][ref1], met een uitkering op grond van deze wet, kinderbijslag op
      grond van de [Algemene Kinderbijslagwet][ref2] of ouderdomspensioen op grond van de [Algemene Ouderdomswet][ref3],
      die degene aan wie een bestuurlijke boete is opgelegd, ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0002368
      [ref3]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '39'
        hoofdstuk: '3'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002368
      - id: ref3
        bwb_id: BWBR0002221
  - number: '45.2'
    text: |-
      Onverminderd het eerste lid kan de Sociale verzekeringsbank de bestuurlijke boete verrekenen met een vordering die
      degene aan wie de bestuurlijke boete is opgelegd op hem heeft.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel45
  - number: '45.3'
    text: |-
      Het college van burgemeester en wethouders van de betrokken gemeente, onderscheidenlijk het
      Uitvoeringsinstituut werknemersverzekeringen, betaalt het bedrag van de bestuurlijke boete, zonder dat
      daarvoor een machtiging nodig is, op haar verzoek aan de Sociale verzekeringsbank indien degene aan
      wie een bestuurlijke boete is opgelegd een uitkering ontvangt op grond van de [Participatiewet][ref1],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3],
      de [Wet inkomensvoorziening oudere werklozen][ref4], de [Werkloosheidswet][ref5], de
      [Ziektewet][ref6], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref7],
      de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref8], de
      [Wet werk en inkomen naar arbeidsvermogen][ref9], de [Wet op de arbeidsongeschiktheidsverzekering][ref10] of de
      [Wet arbeid en zorg][ref11] of een toeslag op grond van de [Toeslagenwet][ref12].


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0004044
      [ref3]: https://wetten.overheid.nl/BWBR0004163
      [ref4]: https://wetten.overheid.nl/BWBR0024394
      [ref5]: https://wetten.overheid.nl/BWBR0004045
      [ref6]: https://wetten.overheid.nl/BWBR0001888
      [ref7]: https://wetten.overheid.nl/BWBR0008656
      [ref8]: https://wetten.overheid.nl/BWBR0008657
      [ref9]: https://wetten.overheid.nl/BWBR0019057
      [ref10]: https://wetten.overheid.nl/BWBR0002524
      [ref11]: https://wetten.overheid.nl/BWBR0013008
      [ref12]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0004044
      - id: ref3
        bwb_id: BWBR0004163
      - id: ref4
        bwb_id: BWBR0024394
      - id: ref5
        bwb_id: BWBR0004045
      - id: ref6
        bwb_id: BWBR0001888
      - id: ref7
        bwb_id: BWBR0008656
      - id: ref8
        bwb_id: BWBR0008657
      - id: ref9
        bwb_id: BWBR0019057
      - id: ref10
        bwb_id: BWBR0002524
      - id: ref11
        bwb_id: BWBR0013008
      - id: ref12
        bwb_id: BWBR0004043
  - number: '45.4'
    text: |-
      De in [artikel 479g van het Wetboek van Burgerlijke Rechtsvordering][ref1] aan het Landelijk Bureau Inning
      Onderhoudsbijdragen toegekende bevoegdheid komt gelijkelijk toe aan de Sociale verzekeringsbank. Indien de Sociale
      verzekeringsbank gebruik maakt van deze bevoegdheid, geschiedt de bekendmaking van het dwangbevel, in afwijking
      van [artikel 4:123, eerste lid, van de Algemene wet bestuursrecht][ref2], door middel van toezending per post aan
      degene aan wie de boete is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel479g
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 479g
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '45.5'
    text: |-
      Zolang de nabestaande, het ouderloos kind, of zijn wettelijke vertegenwoordiger, zijn verplichting, bedoeld in
      [artikel 39, achtste lid][ref1], niet of niet behoorlijk nakomt:


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel39
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '39'
        hoofdstuk: '3'
        afdeling: II
  - number: 45.5.a
    text: |-
      is de Sociale verzekeringsbank, in afwijking van [artikel 4:93, vierde lid, van de Algemene wet bestuursrecht][ref1],
      bevoegd tot verrekening voor zover beslag op de vordering van de schuldeiser nietig zou zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 45.5.b
    text: |-
      geldt de beslagvrije voet, bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref1], in afwijking van
      [artikel 4:116 van de Algemene wet bestuursrecht][ref2], niet bij de invordering van een bestuurlijke boete bij
      dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '46.1'
    text: De Sociale verzekeringsbank betaalt de uitkering waarop op grond van deze wet recht bestaat.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel46
  - number: '46.2'
    text: De betaling bedoeld in het eerste lid geschiedt in de regel per maand.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel46
  - number: '46.3'
    text: |-
      De Sociale verzekeringsbank schort de betaling van de uitkering op of schorst de betaling indien zij op grond van
      duidelijke aanwijzingen van oordeel is of het gegronde vermoeden heeft, dat:
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel46
  - number: 46.3.a
    text: het recht op uitkering niet of niet meer bestaat; of
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel46
  - number: 46.3.b
    text: recht op een lagere uitkering bestaat; of
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel46
  - number: 46.3.c
    text: |-
      de nabestaande, het ouderloos kind, of zijn wettelijke vertegenwoordiger dan wel de instelling aan welke ingevolge
      [artikel 49][ref1] of [57][ref2] de uitkering wordt uitbetaald, een verplichting bedoeld in [artikel 35][ref3],
      [35a][ref4], [36, tweede lid][ref5], of [37][ref6] niet is nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel57
      [ref3]: https://wetten.overheid.nl/BWBR0007795#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0007795#Artikel35a
      [ref5]: https://wetten.overheid.nl/BWBR0007795#Artikel36
      [ref6]: https://wetten.overheid.nl/BWBR0007795#Artikel37
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '49'
        hoofdstuk: '3'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '57'
        hoofdstuk: '3'
        afdeling: III
      - id: ref3
        bwb_id: BWBR0007795
        artikel: '35'
        hoofdstuk: '3'
        afdeling: II
      - id: ref4
        bwb_id: BWBR0007795
        artikel: 35a
        hoofdstuk: '3'
        afdeling: II
      - id: ref5
        bwb_id: BWBR0007795
        artikel: '36'
        hoofdstuk: '3'
        afdeling: II
      - id: ref6
        bwb_id: BWBR0007795
        artikel: '37'
        hoofdstuk: '3'
        afdeling: II
  - number: '46.4'
    text: |-
      De Sociale verzekeringsbank stelt de betrokken persoon of instelling onverwijld schriftelijk in kennis van de
      beslissing bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel46
  - number: 46a.1
    text: |-
      De Sociale verzekeringsbank schort de betaling van de uitkering op indien degene aan wie een uitkering
      is toegekend een vreemdeling is die niet rechtmatig in Nederland verblijf houdt als bedoeld in
      [artikel 8 van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel46a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 46a.2
    text: |-
      De betaling van de uitkering wordt hervat indien betrokkene daartoe een aanvraag indient en het de Bank is gebleken
      dat hij feitelijk buiten Nederland woont of verblijf houdt.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel46a
  - number: 46b.1
    text: |-
      De Sociale verzekeringsbank schort de betaling van de uitkering op, indien blijkt dat het door de nabestaande
      verstrekte adres van hemzelf of van een kind afwijkt van het adres waaronder de betrokkene in de basisregistratie
      personen staat ingeschreven.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel46b
  - number: 46b.2
    text: 'Geen opschorting vindt plaats:'
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel46b
  - number: 46b.2.a
    text: indien de afwijking redelijkerwijs geen gevolgen kan hebben voor het recht op of de hoogte van de uitkering;
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel46b
  - number: 46b.2.b
    text: indien de nabestaande van de afwijking redelijkerwijs geen verwijt kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel46b
  - number: 46b.3
    text: De Sociale verzekeringsbank doet schriftelijk mededeling van de opschorting aan de nabestaande.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel46b
  - number: 46b.4
    text: |-
      De opschorting wordt beëindigd zodra het aan de Sociale verzekeringsbank gebleken is dat de afwijking niet meer
      bestaat.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel46b
  - number: '47'
    text: |-
      Voor zover bij of krachtens deze wet niet anders is bepaald, wordt een voorschot op de nog niet vastgestelde
      uitkering beschouwd als een uitkering op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel47
  - number: '48'
    text: |-
      Indien de uitkering in het buitenland wordt uitbetaald, geschiedt de betaling in afwijking van
      [artikel 4:89, derde lid, van de Algemene wet bestuursrecht][ref1] op het tijdstip waarop de rekening van de
      daartoe door de schuldeiser aangewezen bank wordt gecrediteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '49.1'
    text: |-
      De Sociale verzekeringsbank is bevoegd, voor zover nodig na ingewonnen advies van het Landelijk Bureau Inning
      Onderhoudsbijdragen, de wezenuitkering betaalbaar te stellen aan een ander dan de wettelijke vertegenwoordiger van
      het kind.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel49
  - number: '49.2'
    text: |-
      Indien de rechthebbende of diens wettelijke vertegenwoordiger nalaat een aanvraag om wezenuitkering in te dienen,
      kan deze aanvraag geschieden door het Landelijk Bureau Inning Onderhoudsbijdragen, dat tevens adviseert aan wie de
      wezenuitkering betaalbaar kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel49
  - number: '50.1'
    text: |-
      De Sociale verzekeringsbank betaalt, voor zover niet reeds betaald, de vakantie-uitkering in afwijking van
      [artikel 46][ref1] jaarlijks in de maand mei over de aan die maand voorafgaande maanden, of indien het recht op
      uitkering eerder dan in de maand mei eindigt, in de desbetreffende maand, tenzij aansluitend aan het recht op
      uitkering op grond van deze wet recht op uitkering ingevolge de [Algemene Ouderdomswet][ref2] ontstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '46'
        hoofdstuk: '3'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0002221
  - number: '50.2'
    text: Bij ministeriële regeling worden nadere regels gesteld voor de betaling van de vakantie-uitkering.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel50
  - number: '51.1'
    text: |-
      Na het overlijden van degene aan wie nabestaandenuitkering is toegekend, wordt met ingang van de dag na overlijden
      nabestaandenuitkering in de vorm van een overlijdensuitkering uitbetaald:
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel51
  - number: 51.1.a
    text: aan de minderjarige kinderen tot wie de overledene in familierechtelijke betrekking stond;
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel51
  - number: 51.1.b
    text: |-
      bij ontstentenis van de in onderdeel *a* bedoelde kinderen aan degenen met wie de overledene in gezinsverband
      leefde.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel51
  - number: '51.2'
    text: |-
      De overlijdensuitkering is gelijk aan het bedrag van de nabestaandenuitkering over één maand, berekend naar de
      hoogte van die uitkering in de maand van overlijden van degene aan wie nabestaandenuitkering is toegekend.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel51
  - number: '51.3'
    text: |-
      De overlijdensuitkering wordt ambtshalve of op verzoek van de rechthebbende of rechthebbenden door de Sociale
      verzekeringsbank uitbetaald.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel51
  - number: '51.4'
    text: De overlijdensuitkering wordt in een bedrag ineens uitbetaald.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel51
  - number: '51.5'
    text: |-
      Het bedrag van de overlijdensuitkering wordt verminderd met het bedrag aan nabestaandenuitkering dat, over na het
      overlijden gelegen dagen, reeds is uitbetaald.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel51
  - number: '51.6'
    text: De overlijdensuitkering is niet vatbaar voor beslag.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel51
  - number: '52'
    text: |-
      Een uitkering op grond van deze wet die niet in ontvangst is genomen of is ingevorderd binnen twee jaar na de dag
      van betaalbaarstelling, wordt niet meer betaald.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel52
  - number: '53.1'
    text: |-
      De uitkering op grond van deze wet die als gevolg van een besluit als bedoeld in [artikel 34][ref1] onverschuldigd
      is betaald, alsmede hetgeen anderszins onverschuldigd is betaald, wordt door de Sociale verzekeringsbank van
      de nabestaande of het ouderloos kind of zijn wettelijke vertegenwoordiger, of de instelling aan welke ingevolge
      [artikel 49][ref2] of 57 de uitkering wordt uitbetaald, teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel49
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '34'
        hoofdstuk: '3'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '49'
        hoofdstuk: '3'
        afdeling: III
  - number: '53.2'
    text: |-
      In afwijking van het eerste lid kan de Sociale verzekeringsbank besluiten van terugvordering of van verdere
      terugvordering af te zien, indien de nabestaande of het ouderloos kind of zijn wettelijke vertegenwoordiger, of de
      instelling aan welke ingevolge [artikel 49][ref1] of [57][ref2] de uitkering wordt uitbetaald:


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel57
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '49'
        hoofdstuk: '3'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '57'
        hoofdstuk: '3'
        afdeling: III
  - number: 53.2.a
    text: gedurende vijf jaar volledig aan zijn betalingsverplichtingen heeft voldaan;
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel53
  - number: 53.2.b
    text: |-
      gedurende vijf jaar niet volledig aan zijn betalingsverplichtingen heeft voldaan, maar het achterstallige bedrag
      over die periode, vermeerderd met de daarover verschuldigde wettelijke rente en de op de invordering betrekking
      hebbende kosten, alsnog heeft betaald;
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel53
  - number: 53.2.c
    text: |-
      gedurende vijf jaar geen betalingen heeft verricht en niet aannemelijk is dat hij deze op enig moment zal gaan
      verrichten; of
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel53
  - number: 53.2.d
    text: een bedrag, overeenkomend met ten minste 50% van de restsom in één keer aflost.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel53
  - number: '53.3'
    text: |-
      De in het tweede lid, onderdelen a, b en c, genoemde termijn is tien jaar indien de terugvordering het gevolg is
      van het niet of niet behoorlijk nakomen van de verplichting, bedoeld in [artikel 35][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel35
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '35'
        hoofdstuk: '3'
        afdeling: II
  - number: '53.4'
    text: 'De in het tweede lid, onder a en b, genoemde termijn is drie jaar indien:'
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel53
  - number: 53.4.a
    text: |-
      het gemiddeld inkomen van de belanghebbende in die periode de beslagvrije voet bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref1] niet te boven is gegaan; en


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
  - number: 53.4.b
    text: |-
      de terugvordering niet het gevolg is van het niet of niet behoorlijk nakomen van de verplichting, bedoeld in
      [artikel 35][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel35
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '35'
        hoofdstuk: '3'
        afdeling: II
  - number: '53.5'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan de Sociale verzekeringsbank besluiten geheel of gedeeltelijk
      van de terugvordering af te zien.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel53
  - number: '53.6'
    text: |-
      Degene van wie wordt teruggevorderd is verplicht desgevraagd aan de Sociale verzekeringsbank de inlichtingen te
      verstrekken die voor de terugvordering van belang zijn.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel53
  - number: '53.7'
    text: |-
      In afwijking van het eerste lid kan de Sociale verzekeringsbank, onder voorwaarden die Onze Minister kan stellen,
      besluiten van terugvordering af te zien indien het terug te vorderen bedrag een door Onze Minister vast te stellen
      bedrag niet te boven gaat.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel53
  - number: '54.1'
    text: |-
      De Sociale verzekeringsbank kan de onverschuldigd betaalde uitkering, bedoeld in [artikel 53, eerste lid][ref1],
      invorderen bij dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel53
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '53'
        hoofdstuk: '3'
        afdeling: III
  - number: '54.2'
    text: |-
      [Artikel 45][ref1] is van overeenkomstige toepassing, met dien verstande dat indien het
      gemiddeld inkomen van de belanghebbende gedurende drie jaar de beslagvrije voet bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref2] niet te boven is gegaan, de
      Sociale verzekeringsbank de aflossingsbedragen lager vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '45'
        hoofdstuk: '3'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475c
  - number: '55'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze van tenuitvoerlegging van de
      beschikking waarbij is vastgesteld dat onverschuldigd is betaald.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel55
  - number: 55a.1
    text: |-
      In afwijking van [artikel 53, eerste lid][ref1], kan de Sociale verzekeringsbank, op verzoek van de nabestaande of
      het ouderloos kind of zijn wettelijke vertegenwoordiger, of de instelling aan welke ingevolge [artikel 49][ref2]
      of [57][ref3] de uitkering wordt uitbetaald, besluiten gedeeltelijk van terugvordering of gedeeltelijk van verdere
      terugvordering af te zien door medewerking aan een schuldregeling, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0007795#Artikel57
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel55a
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '53'
        hoofdstuk: '3'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '49'
        hoofdstuk: '3'
        afdeling: III
      - id: ref3
        bwb_id: BWBR0007795
        artikel: '57'
        hoofdstuk: '3'
        afdeling: III
  - number: 55a.1.a
    text: |-
      redelijkerwijs te voorzien is dat de nabestaande, het ouderloos kind of zijn wettelijke vertegenwoordiger,
      respectievelijk de instelling aan welke ingevolge [artikel 49][ref1] of [57][ref2] de uitkering wordt uitbetaald,
      niet zal kunnen voortgaan met het betalen van zijn schulden of indien hij in de toestand verkeert dat hij heeft
      opgehouden te betalen;


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel57
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel55a
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '49'
        hoofdstuk: '3'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '57'
        hoofdstuk: '3'
        afdeling: III
  - number: 55a.1.b
    text: |-
      redelijkerwijs te voorzien is dat een schuldregeling met betrekking tot alle vorderingen, behoudens de in het
      tweede lid bedoelde vorderingen, van de overige schuldeisers zonder een zodanig besluit niet tot stand zal komen;
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel55a
  - number: 55a.1.c
    text: |-
      een naar het oordeel van de Sociale verzekeringsbank betrouwbaar voorstel voor een
      schuldregeling tot stand is gekomen door tussenkomst van een schuldhulpverlener als bedoeld in
      [artikel 48 van de Wet op het consumentenkrediet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel48
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel55a
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '48'
  - number: 55a.1.d
    text: aannemelijk is dat medewerking aan een schuldregeling niet concurrentieverstorend werkt; en
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel55a
  - number: 55a.1.e
    text: |-
      uitdeling in het kader van de schuldregeling plaatsvindt overeenkomstig
      [artikel 349 van de Faillissementswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel349
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel55a
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '349'
  - number: 55a.2
    text: |-
      Het eerste lid is niet van toepassing indien een vordering is ontstaan door het opzettelijk of door grove schuld
      niet nakomen door de nabestaande, het ouderloos kind of zijn wettelijke vertegenwoordiger, respectievelijk
      de instelling aan welke ingevolge [artikel 49][ref1] of [57][ref2] de uitkering wordt uitbetaald, van de
      verplichting, bedoeld in [artikel 35][ref3], en hiervoor een boete als bedoeld in [artikel 39][ref4] is
      opgelegd, dan wel met betrekking tot het niet naleven van die verplichting aangifte is gedaan op grond van het
      [Wetboek van Strafrecht][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel57
      [ref3]: https://wetten.overheid.nl/BWBR0007795#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0007795#Artikel39
      [ref5]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel55a
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '49'
        hoofdstuk: '3'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '57'
        hoofdstuk: '3'
        afdeling: III
      - id: ref3
        bwb_id: BWBR0007795
        artikel: '35'
        hoofdstuk: '3'
        afdeling: II
      - id: ref4
        bwb_id: BWBR0007795
        artikel: '39'
        hoofdstuk: '3'
        afdeling: II
      - id: ref5
        bwb_id: BWBR0001854
  - number: 55a.3
    text: |-
      Het besluit tot het afzien van terugvordering of van verdere terugvordering wordt ingetrokken of ten nadele van de
      belanghebbende gewijzigd indien:
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel55a
  - number: 55a.3.a
    text: |-
      niet binnen twaalf maanden nadat dat besluit is bekendgemaakt, een schuldregeling tot stand is gekomen die voldoet
      aan de eisen, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel55a
  - number: 55a.3.b
    text: |-
      de nabestaande, het ouderloos kind of zijn wettelijke vertegenwoordiger, respectievelijk de instelling aan
      welke ingevolge [artikel 49][ref1] of [57][ref2] de uitkering wordt uitbetaald zijn schuld aan het de Sociale
      verzekeringsbank niet overeenkomstig de schuldregeling voldoet; of


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel57
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel55a
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '49'
        hoofdstuk: '3'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '57'
        hoofdstuk: '3'
        afdeling: III
  - number: 55a.3.c
    text: |-
      onjuiste of onvolledige gegevens zijn verstrekt en de verstrekking van juiste of volledige gegevens tot een ander
      besluit zou hebben geleid.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel55a
  - number: 55a.4
    text: |-
      Bij ministeriële regeling kunnen met betrekking tot dit artikel nadere regels worden gesteld ten aanzien van de
      bevoegdheid om mee te werken aan schuldregelingen.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel55a
  - number: 55b
    text: |-
      Een vordering van de Sociale verzekeringsbank als bedoeld in de [artikelen 53][ref1] en [55a][ref2] is bevoorrecht
      en volgt onmiddellijk na de vorderingen, bedoeld in [artikel 288 van Boek 3 van het Burgerlijk Wetboek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel55a
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel288
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel55b
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '53'
        hoofdstuk: '3'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0007795
        artikel: 55a
        hoofdstuk: '3'
        afdeling: III
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '288'
  - number: '56.1'
    text: |-
      Voor het in ontvangst nemen en het verlenen van kwijting voor de betaling van de uitkering wordt een minderjarige
      met een meerderjarige gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel56
  - number: '56.2'
    text: |-
      Indien de wettelijke vertegenwoordiger van de minderjarige zich schriftelijk bij de Sociale verzekeringsbank verzet
      tegen betaling aan de minderjarige wordt de uitkering aan de wettelijke vertegenwoordiger betaald.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel56
  - number: '57.1'
    text: |-
      Indien degene, aan wie uitkering op grond van deze wet is toegekend, in een inrichting ter verpleging van
      geesteszieken of van zwakzinnigen is opgenomen en de Sociale verzekeringsbank van de desbetreffende inrichting of
      van het college van burgemeester en wethouders van de gemeente die de opnamekosten betaalt, het verzoek ontvangt om
      de uitkering aan die inrichting of die gemeente uit te betalen, is de Sociale verzekeringsbank bevoegd dat verzoek
      zonder het stellen van andere voorwaarden in te willigen.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel57
  - number: '57.2'
    text: |-
      Indien degene aan wie uitkering op grond van deze wet is toegekend, aanspraak heeft op verstrekking of vergoeding
      van zorg als bedoeld in de [Wet langdurige zorg][ref1] en op grond van die wet een bijdrage voor die zorg
      verschuldigd is, is de Sociale verzekeringsbank bevoegd de uitkering tot het bedrag van die bijdrage in plaats
      van aan degene, aan wie de uitkering is toegekend, zonder diens machtiging uit te betalen aan het Zorginstituut
      Nederland, genoemd in [artikel 58, eerste lid, van de Zorgverzekeringswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035917
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel58
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0035917
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '58'
  - number: '57.3'
    text: |-
      Indien aan degene aan wie een uitkering op grond van deze wet is toegekend, een
      maatwerkvoorziening of persoonsgebonden budget wordt verstrekt voor beschermd wonen als bedoeld in
      [artikel 1.1.1 van de Wet maatschappelijke ondersteuning 2015][ref1], en hij op grond van die [wet][ref2] hiervoor
      een bijdrage is verschuldigd, is de Sociale verzekeringsbank bevoegd de uitkering tot het bedrag van die bijdrage
      in plaats van aan degene, aan wie de uitkering is toegekend, zonder diens machtiging uit te betalen aan het CAK,
      genoemd in [artikel 6.1.1, eerste lid, van de Wet langdurige zorg][ref3], dat voor de gemeente de bijdrage int.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0035362
      [ref3]: https://wetten.overheid.nl/BWBR0035917#Artikel6
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0035362
      - id: ref3
        bwb_id: BWBR0035917
        artikel: '6'
  - number: '57.4'
    text: |-
      Indien het tweede of derde lid toepassing vindt, heeft de in het eerste lid bedoelde bevoegdheid betrekking op het
      gedeelte van de uitkering dat niet aan de in het tweede of derde lid genoemde instantie wordt uitbetaald.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel57
  - number: '57.5'
    text: |-
      Een herziening van een uitkering op grond van het tweede en derde lid als gevolg van een wijziging van de
      verschuldigde bijdrage vindt plaats zonder dat dit bij beschikking is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel57
  - number: '59.1'
    text: De uitkering is
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel59
  - number: 59.1.a
    text: onvervreemdbaar,
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel59
  - number: 59.1.b
    text: niet vatbaar voor verpanding of belening.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel59
  - number: '59.2'
    text: Volmacht tot ontvangst van uitkering, onder welke vorm of welke benaming ook verleend, is steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel59
  - number: '59.3'
    text: Elk beding, strijdig met enige bepaling van dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel59
  - number: '60'
    text: |-
      Bij de vaststelling van de schadevergoeding, waarop de nabestaande en ouderloos geworden kinderen van de verzekerde
      naar burgerlijk recht aanspraak kunnen maken ter zake van het overlijden van de verzekerde, houdt de rechter
      rekening met de aanspraken op uitkeringen, die de nabestaande en het ouderloos kind op grond van deze wet hebben.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel60
  - number: '61.1'
    text: |-
      De Sociale verzekeringsbank heeft voor de krachtens deze wet gemaakte kosten verhaal op degene, die in verband
      met het veroorzaken van het overlijden van de verzekerde, jegens diens nabestaande en ouderloos geworden kinderen
      naar burgerlijk recht tot schadevergoeding is verplicht, doch ten hoogste tot het bedrag, waarvoor deze bij het
      ontbreken van de aanspraken op grond van deze wet naar burgerlijk recht aansprakelijk zou zijn, verminderd met een
      bedrag, gelijk aan dat van de schadevergoeding tot betaling waarvan de aansprakelijk persoon jegens de nabestaande
      en ouderloos geworden kinderen naar burgerlijk recht is gehouden.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel61
  - number: '61.2'
    text: |-
      De Sociale verzekeringsbank kan in plaats van het bedrag der periodieke verstrekkingen de contante waarde daarvan
      vorderen in de vorm van een jaarlijks vast te stellen afkoopsom die aan de Sociale verzekeringsbank wordt vergoed
      voor de totale schadelast ten gevolge van het veroorzaken van overlijden.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel61
  - number: '62.1'
    text: |-
      Indien de verzekerde bij zijn overlijden in dienstbetrekking werkzaam was, geldt [artikel 61][ref1], ten aanzien
      van de naar burgerlijk recht tot schadevergoeding verplichte werkgever van de verzekerde, onderscheidenlijk ten
      aanzien van de naar burgerlijk recht tot schadevergoeding verplichte persoon, die in dienstbetrekking staat tot
      dezelfde werkgever als de verzekerde jegens wiens nabestaande en ouderloos geworden kinderen naar burgerlijk recht
      verplichting tot schadevergoeding bestaat, slechts indien het overlijden van de verzekerde is te wijten aan opzet
      of bewuste roekeloosheid van die werkgever onderscheidenlijk persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel61
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '61'
        hoofdstuk: '4'
  - number: '62.2'
    text: |-
      Voor de toepassing van het eerste lid wordt mede als werkgever beschouwd de inlener, bedoeld in
      [artikel 34 van de Invorderingswet 1990][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel34
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '34'
  - number: '63'
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder gewezen verzekerde: degene, wiens
      verplichte verzekering is geëindigd.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel63
  - number: 63a.1
    text: |-
      De gewezen verzekerde kan zich vrijwillig verzekeren over een periode van tien jaar, met ingang van de dag na
      de dag waarop de verplichte verzekering is geëindigd. De eerste zin is alleen van toepassing indien de gewezen
      verzekerde direct voorafgaande aan de periode van vrijwillige verzekering ten minste een jaar verplicht verzekerd
      is geweest.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel63a
  - number: 63a.2
    text: |-
      De gewezen verzekerde, bedoeld in het eerste lid, kan zich, indien de periode van vrijwillige verzekering is
      onderbroken door een periode van verplichte verzekering korter dan een jaar, opnieuw vrijwillig verzekeren voor de
      resterende periode van de tien jaar, bedoeld in dat lid.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel63a
  - number: 63a.3
    text: 'De periode van maximaal tien jaar, bedoeld in het eerste lid, is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel63a
  - number: 63a.3.a
    text: |-
      de gewezen verzekerde die in dienstbetrekking staat tot een Nederlandse publiekrechtelijke rechtspersoon dan wel
      uit anderen hoofde loon geniet van een zodanige rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel63a
  - number: 63a.3.b
    text: |-
      de gewezen verzekerde die is uitgezonden om werkzaamheden te verrichten voor door Onze Minister in overeenstemming
      met Onze Minister van Buitenlandse Zaken aan te wijzen organisaties voor ontwikkelingssamenwerking;
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel63a
  - number: 63a.3.c
    text: |-
      de gewezen verzekerde die werkzaam is bij een door Onze Minister, Onze Minister van Volksgezondheid, Welzijn en
      Sport en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties aan te wijzen volkenrechtelijke organisatie;
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel63a
  - number: 63a.3.d
    text: |-
      de gewezen verzekerde die werkzaamheden verricht die worden bekostigd door het Rijk en die tevens in opdracht van
      het Rijk worden verricht in het kader van een wettelijke taakomschrijving of ter uitvoering van een internationaal
      verdrag dan wel een daarmee gelijk te stellen overeenkomst of een besluit van een volkenrechtelijke organisatie;
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel63a
  - number: 63a.3.e
    text: |-
      de gewezen verzekerde, die op de dag waarop de verplichte verzekering is geëindigd de leeftijd van 50 jaar heeft
      bereikt, niet in Nederland woont en recht heeft op een:
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel63a
  - number: 63a.3.e.1°
    text: |-
      uitkering op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel63a
    references:
      - id: ref1
        bwb_id: BWBR0019057
  - number: 63a.3.e.2°
    text: |-
      uitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel63a
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: 63a.3.e.3°
    text: |-
      uitkering op grond van de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel63a
    references:
      - id: ref1
        bwb_id: BWBR0008656
  - number: 63a.3.e.4°
    text: |-
      uitkering of op recht op arbeidsondersteuning op grond van de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel63a
    references:
      - id: ref1
        bwb_id: BWBR0008657
  - number: 63a.3.e.5°
    text: |-
      uitkering op grond van de [Wet arbeidsongeschiktheidsvoorziening militairen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002822
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel63a
    references:
      - id: ref1
        bwb_id: BWBR0002822
  - number: 63a.3.e.6°
    text: |-
      pensioen op basis van arbeidsongeschiktheid op grond van de [Wet privatisering Spoorwegpensioenfonds][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006319
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel63a
    references:
      - id: ref1
        bwb_id: BWBR0006319
  - number: 63a.3.e.7°
    text: |-
      pensioen op basis van arbeidsongeschiktheid op grond van de Algemene militaire pensioenwet, zoals die luidde voor 1
      januari 1998;
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel63a
  - number: 63a.3.e.8°
    text: |-
      ouderdomspensioen op grond van de [Algemene Ouderdomswet][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel63a
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 63a.3.e.9°
    text: |-
      nabestaandenuitkering op grond van deze wet, mits die uitkering of dat pensioen ten minste gelijk is aan 35%
      van het in [artikel 8, eerste lid, onderdeel b, van de Wet minimumloon en minimumvakantiebijslag][ref1] bedoelde
      bedrag; of


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel63a
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
  - number: 63a.3.f
    text: |-
      de gewezen verzekerde wiens recht op een uitkering als bedoeld in onderdeel e uitsluitend als gevolg van het
      bereiken van de pensioengerechtigde leeftijd is geëindigd;
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel63a
  - number: 63a.3.g
    text: |-
      de gewezen verzekerde, bedoeld in [artikel 63d, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel63d
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel63a
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: 63d
        hoofdstuk: '5'
  - number: 63a.4
    text: |-
      De periode van maximaal tien jaar, bedoeld in het eerste lid, is niet van toepassing op de echtgenoot van de in het
      derde lid genoemde gewezen verzekerde en de inwonende minderjarige kinderen met wie die gewezen verzekerde of die
      echtgenoot in familierechtelijke betrekking staat.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel63a
  - number: 63a.5
    text: Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van dit artikel nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel63a
  - number: 63b.1
    text: |-
      De gewezen verzekerde die van de vrijwillige verzekering, bedoeld in [artikel 63a, eerste lid][ref1], gebruik wil
      maken, is verplicht uiterlijk een jaar na de dag, waarop de verzekering is geëindigd, een aanvraag daartoe in te
      dienen bij de Sociale verzekeringsbank.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel63a
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel63b
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: 63a
        hoofdstuk: '5'
  - number: 63b.2
    text: |-
      De aanvraag wordt afgewezen indien de gewezen verzekerde niet voldoet aan de bij of krachtens dit hoofdstuk
      gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel63b
  - number: 63c.1
    text: |-
      De vrijwillige verzekering, bedoeld in [artikel 63a, eerste lid][ref1], eindigt:


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel63a
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel63c
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: 63a
        hoofdstuk: '5'
  - number: 63c.1.a
    text: |-
      met ingang van de eerste dag van de tweede maand volgend op die waarin de Sociale verzekeringsbank een
      schriftelijke opzegging van de gewezen verzekerde heeft ontvangen;
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel63c
  - number: 63c.1.b
    text: |-
      met ingang van de dag, waarop de periode van tien jaar, bedoeld in [artikel 63a, eerste lid][ref1], is verstreken;


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel63a
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel63c
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: 63a
        hoofdstuk: '5'
  - number: 63c.1.c
    text: met ingang van de dag, waarop de gewezen verzekerde verplicht verzekerd wordt op grond van deze wet;
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel63c
  - number: 63c.1.d
    text: |-
      met ingang van de eerste dag van de vierde maand volgend op de laatste dag van de door de Sociale verzekeringsbank
      gestelde termijn waarbinnen de verschuldigde premie voor de vrijwillige algemene nabestaandenverzekering, bedoeld
      in [artikel 71 van de Wet financiering sociale verzekeringen][ref1], dient te worden betaald, indien die betaling
      niet of niet geheel heeft plaatsgevonden;


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel71
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel63c
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '71'
  - number: 63c.1.e
    text: |-
      met ingang van de dag volgend op de laatste dag van een door de Sociale verzekeringsbank gestelde termijn
      waarbinnen de gewezen verzekerde de van hem, in verband met de toepassing van dit hoofdstuk, verlangde inlichtingen
      dient te verstrekken, indien de gewezen verzekerde die gegevens niet heeft verstrekt, tenzij de gewezen verzekerde
      aannemelijk maakt dat dat hem niet in overwegende mate kan worden verweten.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel63c
  - number: 63d.1
    text: |-
      De [artikelen 63 tot en met 63c][ref1] zijn van overeenkomstige toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel63
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel63d
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '63'
        hoofdstuk: '5'
  - number: 63d.1.a
    text: |-
      de gewezen verzekerde die op 31 december 1999 verplicht verzekerd was op grond van
      [artikel 26 van het Besluit uitbreiding en beperking kring verzekerden volksverzekeringen 1999][ref1]
      en die op of na 1 januari 2000, maar voor de dag van inwerkingtreding van de
      [Wet herziening vrijwillige verzekering AOW en ANW][ref2], de leeftijd van 65 jaar heeft bereikt;


      [ref1]: https://wetten.overheid.nl/BWBR0010182#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0012436
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel63d
    references:
      - id: ref1
        bwb_id: BWBR0010182
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0012436
  - number: 63d.1.b
    text: |-
      de gewezen verzekerde die op 31 december 1999 vrijwillig verzekerd was op grond van [artikel 63][ref1] van
      deze wet, zoals dat artikel luidde tot en met de dag voorafgaande aan de dag van inwerkingtreding van de
      [Wet herziening vrijwillige verzekering AOW en ANW][ref2] en wiens vrijwillige verzekering tussen 31 december 1999
      en de dag van inwerkingtreding van de Wet herziening vrijwillige verzekering AOW en ANW uitsluitend als gevolg van
      het bereiken van de leeftijd van 65 jaar is geëindigd;


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0012436
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel63d
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '63'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0012436
  - number: 63d.2
    text: |-
      De [artikelen 63 tot en met 63c][ref1] zijn van overeenkomstige toepassing op de gewezen verzekerde die op
      31 december 2005 vrijwillig verzekerd was op grond van een algemene maatregel van bestuur die gebaseerd was op
      artikel 63, zoals dat luidde op de dag voor inwerkingtreding van de Wet tot wijziging van een aantal wetten op het
      terrein van het Ministerie van Sociale Zaken en Werkgelegenheid teneinde deze in overeenstemming te brengen met de
      motie van het lid Jurgens c.s.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel63
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel63d
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '63'
        hoofdstuk: '5'
  - number: 64a.1
    text: |-
      Een beschikking op grond van deze wet en de daarop berustende bepalingen wordt gegeven binnen een redelijke termijn
      na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel64a
  - number: 64a.2
    text: |-
      De redelijke termijn is in ieder geval verstreken wanneer binnen acht weken na ontvangst van de aanvraag geen
      beschikking is gegeven, noch een kennisgeving als bedoeld in het derde lid is gedaan.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel64a
  - number: 64a.3
    text: |-
      Indien een beschikking niet binnen de termijn van acht weken kan worden gegeven, wordt die termijn met een
      redelijke termijn verlengd en wordt de aanvrager daarvan schriftelijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel64a
  - number: '65'
    text: |-
      In afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] beslist de Sociale
      verzekeringsbank binnen dertien weken gerekend vanaf de dag na die waarop de termijn voor het indienen van het
      bezwaarschrift is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '66.1'
    text: |-
      Tegen uitspraken van de Centrale Raad van Beroep kan ieder der partijen beroep in cassatie instellen terzake van
      schending of verkeerde toepassing van de [artikelen 3, tweede tot en met zesde lid][ref1], [6][ref2], [7][ref3]
      en [13][ref4] en de op die artikelen berustende bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0007795#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0007795#Artikel13
    url: https://wetten.overheid.nl/BWBR0007795/2025-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0007795
