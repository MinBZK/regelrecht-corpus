  - number: 32c.1
    text: |-
      Geen recht op nabestaandenuitkering ontstaat voor de nabestaande indien hem op de dag van het overlijden van de
      verzekerde rechtens zijn vrijheid is ontnomen. Geen recht op halfwezenuitkering ontstaat voor de nabestaande indien
      hem of de halfwees op de dag van het overlijden van de verzekerde rechtens zijn vrijheid is ontnomen. Geen recht
      op wezenuitkering ontstaat voor het kind indien het op de dag van het overlijden van de verzekerde rechtens zijn
      vrijheid is ontnomen.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel32c
