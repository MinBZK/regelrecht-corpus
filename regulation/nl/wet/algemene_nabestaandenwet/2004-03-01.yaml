  - number: '33.1'
    text: De Sociale verzekeringsbank stelt op aanvraag vast of recht op nabestaanden-, halfwezen- of wezenuitkering bestaat.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel33
  - number: '33.2'
    text: Het recht op vakantie-uitkering wordt ambtshalve vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel33
  - number: '33.3'
    text: Een aanvraag wordt ingediend door middel van een door de Sociale verzekeringsbank beschikbaar gesteld formulier.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel33
  - number: '33.4'
    text: |-
      Het recht op uitkering wordt niet vastgesteld over perioden gelegen voor één jaar voorafgaand aan de dag waarop
      de Sociale verzekeringsbank de aanvraag om uitkering heeft ontvangen. De Sociale verzekeringsbank is bevoegd in
      bijzondere gevallen af te wijken van de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel33
  - number: '33.5'
    text: |-
      Op een besluit als bedoeld in het tweede lid zijn de [artikelen 3:41][ref1] en
      [3:45 van de Algemene wet bestuursrecht][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '34.1'
    text: |-
      Onverminderd het elders in deze wet bepaalde terzake van herziening of intrekking van een besluit tot toekenning
      van uitkering en terzake van weigering van uitkering, herziet de Sociale verzekeringsbank een dergelijk besluit of
      trekt zij dat in:
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel34
  - number: 34.1.a
    text: |-
      indien het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 35][ref1],
      [36, tweede lid][ref2], of [37][ref3] heeft geleid tot het ten onrechte of tot een te hoog bedrag verlenen van
      uitkering;


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0007795#Artikel37
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '35'
        hoofdstuk: '3'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '36'
        hoofdstuk: '3'
        afdeling: II
      - id: ref3
        bwb_id: BWBR0007795
        artikel: '37'
        hoofdstuk: '3'
        afdeling: II
  - number: 34.1.b
    text: indien anderszins de uitkering ten onrechte of tot een te hoog bedrag is verleend;
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel34
  - number: 34.1.c
    text: |-
      indien het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 35][ref1],
      [36, tweede lid][ref2], of [37][ref3] er toe leidt dat niet kan worden vastgesteld of nog recht op uitkering
      bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0007795#Artikel37
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '35'
        hoofdstuk: '3'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '36'
        hoofdstuk: '3'
        afdeling: II
      - id: ref3
        bwb_id: BWBR0007795
        artikel: '37'
        hoofdstuk: '3'
        afdeling: II
  - number: '34.2'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan de Sociale verzekeringsbank besluiten geheel of gedeeltelijk
      van herziening of intrekking af te zien.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel34
  - number: '35'
    text: |-
      De nabestaande, het ouderloos kind en zijn wettelijke vertegenwoordiger alsmede de instelling aan welke ingevolge
      [artikel 49][ref1] of [57][ref2] de uitkering wordt uitbetaald, zijn verplicht aan de Sociale verzekeringsbank
      op haar verzoek of onverwijld uit eigen beweging alle feiten en omstandigheden mee te delen, waarvan hun
      redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op het recht op uitkering, de hoogte van de
      uitkering, het geldend maken van het recht op uitkering of op het bedrag van de uitkering, dat wordt uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel57
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '49'
        hoofdstuk: '3'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '57'
        hoofdstuk: '3'
        afdeling: III
  - number: '36.1'
    text: |-
      De Sociale verzekeringsbank is bevoegd controlevoorschriften vast te stellen. Deze voorschriften mogen niet verder
      gaan dan strikt noodzakelijk is voor een juiste uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel36
  - number: '36.2'
    text: |-
      De nabestaande, het ouderloos kind of zijn wettelijke vertegenwoordiger alsmede de instelling aan welke ingevolge
      [artikel 49][ref1] of [57][ref2] de uitkering wordt uitbetaald, zijn verplicht de voorschriften op te volgen die de
      Sociale verzekeringsbank ten behoeve van een doelmatige controle stelt.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel57
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '49'
        hoofdstuk: '3'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '57'
        hoofdstuk: '3'
        afdeling: III
  - number: '37'
    text: |-
      Voor de toepassing van de [artikelen 5, tweede lid][ref1], [11][ref2],
      [14, eerste lid, aanhef en onderdeel b][ref3], [26, tweede lid, aanhef en onderdeel b][ref4], dan wel om te bepalen
      of een gezamenlijke huishouding ten behoeve van de verzorging van een hulpbehoevende wordt gevoerd, onderwerpt de
      betrokken persoon zich op verzoek van de Sociale verzekeringsbank aan een geneeskundig onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0007795#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0007795#Artikel26
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '5'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '11'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0007795
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0007795
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: I
  - number: '38.1'
    text: |-
      Indien de nabestaande, het ouderloos kind, of zijn wettelijke vertegenwoordiger een verplichting op
      grond van [artikel 36, tweede lid][ref1], of [37][ref2] is opgelegd, of de verplichtingen, bedoeld in
      [artikel 55, tweede lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3] niet of niet
      behoorlijk is nagekomen, dan wel de verplichting, bedoeld in [artikel 35][ref4], niet binnen de door de Sociale
      verzekeringsbank daarvoor vastgestelde termijn is nagekomen, weigert de Sociale verzekeringsbank de uitkering
      tijdelijk of blijvend, geheel of gedeeltelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel55
      [ref4]: https://wetten.overheid.nl/BWBR0007795#Artikel35
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '36'
        hoofdstuk: '3'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '37'
        hoofdstuk: '3'
        afdeling: II
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '55'
      - id: ref4
        bwb_id: BWBR0007795
        artikel: '35'
        hoofdstuk: '3'
        afdeling: II
  - number: '38.2'
    text: |-
      Een maatregel als bedoeld in het eerste lid wordt afgestemd op de ernst van de gedraging en de mate waarin de
      nabestaande, het ouderloos kind, of zijn wettelijke vertegenwoordiger de gedraging verweten kan worden. Van het
      opleggen van een maatregel wordt in elk geval afgezien, indien elke vorm van verwijtbaarheid ontbreekt.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel38
  - number: '38.3'
    text: |-
      Indien het niet tijdig nakomen van de verplichting, bedoeld in [artikel 35][ref1], niet heeft geleid tot het ten
      onrechte of tot een te hoog bedrag verlenen van uitkering kan de Sociale verzekeringsbank afzien van het opleggen
      van een maatregel als bedoeld in het eerste lid en volstaan met het geven van een schriftelijke waarschuwing
      ter zake van het niet tijdig nakomen van de verplichting, tenzij het niet tijdig nakomen van de verplichting
      plaatsvindt binnen een periode van twee jaar te rekenen vanaf de datum waarop eerder aan de nabestaande, het
      ouderloos kind, of zijn wettelijke vertegenwoordiger, een zodanige waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel35
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '35'
        hoofdstuk: '3'
        afdeling: II
  - number: '38.4'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan de Sociale verzekeringsbank besluiten van het opleggen van een
      maatregel af te zien.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel38
  - number: '38.5'
    text: |-
      Het opleggen van een maatregel blijft achterwege indien voor dezelfde gedraging een boete als bedoeld in
      [artikel 39][ref1] wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel39
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '39'
        hoofdstuk: '3'
        afdeling: II
  - number: '38.6'
    text: De Sociale verzekeringsbank stelt nadere regels met betrekking tot het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel38
  - number: '39.1'
    text: |-
      Indien de nabestaande, het ouderloos kind, of zijn wettelijke vertegenwoordiger de verplichting bedoeld in
      [artikel 35][ref1] niet of niet behoorlijk is nagekomen legt de Sociale verzekeringsbank hem een boete op van ten
      hoogste € 2 269.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel35
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '35'
        hoofdstuk: '3'
        afdeling: II
  - number: '39.2'
    text: |-
      De hoogte van de boete wordt afgestemd op de ernst van de gedraging, de mate waarin de nabestaande, het ouderloos
      kind, of zijn wettelijke vertegenwoordiger de gedraging verweten kan worden en de omstandigheden waarin hij
      verkeert. Van het opleggen van een boete wordt in elk geval afgezien, indien elke vorm van verwijtbaarheid
      ontbreekt.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel39
  - number: '39.3'
    text: |-
      Indien het niet of niet behoorlijk nakomen van de verplichting, bedoeld in [artikel 35][ref1], niet heeft geleid
      tot het ten onrechte of tot een te hoog bedrag verlenen van uitkering kan de Sociale verzekeringsbank afzien
      van het opleggen van een boete als bedoeld in het eerste lid en volstaan met het geven van een schriftelijke
      waarschuwing ter zake van het niet of niet behoorlijk nakomen van de verplichting, tenzij het niet of niet
      behoorlijk nakomen van de verplichting plaatsvindt binnen een periode van twee jaar te rekenen vanaf de datum
      waarop eerder aan de nabestaande, het ouderloos kind, of zijn wettelijke vertegenwoordiger, een zodanige
      waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel35
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '35'
        hoofdstuk: '3'
        afdeling: II
  - number: '39.4'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan de Sociale verzekeringsbank besluiten van het opleggen van een
      boete af te zien.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel39
  - number: '39.5'
    text: |-
      Degene aan wie een boete is opgelegd is verplicht desgevraagd aan de Sociale verzekeringsbank de inlichtingen te
      verstrekken die voor de tenuitvoerlegging van de boete van belang zijn.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel39
  - number: '39.6'
    text: Voor zover de boete nog niet is geïnd, vervalt zij door het overlijden van degene aan wie zij is opgelegd.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel39
  - number: '39.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste en het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel39
  - number: '40.1'
    text: |-
      Indien de Sociale verzekeringsbank jegens de nabestaande, het ouderloos kind, of zijn wettelijke vertegenwoordiger
      een handeling verricht waaraan deze in redelijkheid de gevolgtrekking kan verbinden dat aan hem wegens een
      bepaalde gedraging een boete zal worden opgelegd, is de nabestaande, het ouderloos kind, of zijn wettelijke
      vertegenwoordiger niet langer verplicht terzake van die gedraging enige verklaring af te leggen, voor zover het
      betreft de boeteoplegging. De nabestaande, het ouderloos kind, of zijn wettelijke vertegenwoordiger wordt hiervan
      in kennis gesteld alvorens hem mondeling om informatie wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel40
  - number: '40.2'
    text: |-
      Indien de Sociale verzekeringsbank voornemens is om aan de nabestaande, het ouderloos kind, of zijn wettelijke
      vertegenwoordiger een boete op te leggen, wordt hiervan kennis gegeven aan de nabestaande, het ouderloos kind, of
      zijn wettelijke vertegenwoordiger onder vermelding van de gronden waarop het voornemen berust. De kennisgeving is
      een handeling als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel40
  - number: '40.3'
    text: |-
      Op verzoek van de nabestaande, het ouderloos kind, of zijn wettelijke vertegenwoordiger die de in het vorige lid
      bedoelde kennisgeving wegens zijn gebrekkige kennis van de Nederlandse taal onvoldoende begrijpt, draagt de Sociale
      verzekeringsbank er zoveel mogelijk zorg voor dat de in die kennisgeving vermelde gronden aan de nabestaande, het
      ouderloos kind of zijn wettelijke vertegenwoordiger, worden medegedeeld in een voor hem begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel40
  - number: '40.4'
    text: |-
      In afwijking van afdeling 4.1.2. van de Algemene wet bestuursrecht stelt de Sociale verzekeringsbank de
      nabestaande, het ouderloos kind, of zijn wettelijke vertegenwoordiger in de gelegenheid om naar keuze schriftelijk
      of mondeling zijn zienswijze naar voren te brengen, voordat de boete wordt opgelegd.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel40
  - number: '40.5'
    text: |-
      Indien de nabestaande, het ouderloos kind, of zijn wettelijke vertegenwoordiger zijn zienswijze mondeling naar
      voren brengt, draagt de Sociale verzekeringsbank er op verzoek van de nabestaande, het ouderloos kind, of zijn
      wettelijke vertegenwoordiger die de Nederlandse taal onvoldoende begrijpt, zorg voor dat een tolk wordt benoemd die
      hem kan bijstaan, tenzij redelijkerwijs kan worden aangenomen dat daaraan geen behoefte bestaat.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel40
  - number: '41.1'
    text: |-
      Het besluit waarbij de boete wordt opgelegd vermeldt de termijn of de termijnen waarbinnen deze moet worden
      betaald, alsmede de wijze waarop het besluit bij gebreke van tijdige betaling, overeenkomstig [artikel 45][ref1]
      zal worden tenuitvoergelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel45
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '45'
        hoofdstuk: '3'
        afdeling: II
  - number: '41.2'
    text: |-
      Op verzoek van de nabestaande, het ouderloos kind, of zijn wettelijke vertegenwoordiger die het in het eerste lid
      bedoelde besluit wegens zijn gebrekkige kennis van de Nederlandse taal onvoldoende begrijpt, draagt de Sociale
      verzekeringsbank er zoveel mogelijk zorg voor dat de in dat besluit vermelde informatie aan de nabestaande, het
      ouderloos kind, of zijn wettelijke vertegenwoordiger wordt meegedeeld in een voor hem begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel41
  - number: '41.3'
    text: Bij ministeriële regeling worden nadere regels gesteld met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel41
  - number: '42.1'
    text: Een boete wordt niet opgelegd zolang de gedraging wordt onderzocht door het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel42
  - number: '42.2'
    text: |-
      De oplegging van een boete blijft definitief achterwege indien ter zake van de gedraging tegen de nabestaande,
      het ouderloos kind, of zijn wettelijke vertegenwoordiger een strafvervolging is ingesteld en het onderzoek
      ter terechtzitting een aanvang heeft genomen, dan wel het recht tot strafvordering is vervallen ingevolge
      [artikel 74 van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
  - number: '42.3'
    text: |-
      Het openbaar ministerie doet van een omstandigheid als bedoeld in het eerste en het tweede lid mededeling aan de
      Sociale verzekeringsbank.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel42
  - number: '43.1'
    text: |-
      Een boete wordt opgelegd binnen een jaar nadat de Sociale verzekeringsbank de nabestaande, het ouderloos kind, of
      zijn wettelijke vertegenwoordiger overeenkomstig het bepaalde in artikel 40, vierde lid, in de gelegenheid heeft
      gesteld zijn zienswijze naar voren te brengen. Indien terzake aangifte is gedaan of proces-verbaal is opgemaakt
      en ingezonden vangt de termijn van een jaar aan op de dag na die waarop het openbaar ministerie aan de Sociale
      verzekeringsbank heeft medegedeeld dat geen strafvervolging wordt ingesteld.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel43
  - number: '43.2'
    text: |-
      Een boete wordt in elk geval niet opgelegd na verloop van vijf jaren nadat de desbetreffende gedraging heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel43
  - number: '44'
    text: |-
      In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref1] kan de rechter in beroep of hoger beroep
      het bedrag waarop de boete is vastgesteld ook ten nadele van de nabestaande, het ouderloos kind, of zijn wettelijke
      vertegenwoordiger wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '45.1'
    text: |-
      Het besluit waarbij een boete is opgelegd levert een executoriale titel op in de zin van het
      [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1]. De titel heeft mede betrekking op de rente en
      kosten, bedoeld in het zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '45.2'
    text: |-
      Indien degene aan wie een boete is opgelegd, uitkering op grond van deze wet, kinderbijslag op grond van de
      [Algemene Kinderbijslagwet][ref1] of ouderdomspensioen op grond van de [Algemene Ouderdomswet][ref2] ontvangt,
      wordt het besluit waarbij de boete is opgelegd tenuitvoergelegd door verrekening met die uitkering op grond van
      deze wet, die kinderbijslag of dat ouderdomspensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0002368
      [ref2]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002368
      - id: ref2
        bwb_id: BWBR0002221
  - number: '45.3'
    text: |-
      Indien degene aan wie de boete is opgelegd, een uitkering ontvangt op grond van de [Wet werk en bijstand][ref1],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3],
      de [Wet inkomensvoorziening kunstenaars][ref4], de [Werkloosheidswet][ref5], de
      [Ziektewet][ref6], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref7],
      de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref8], de
      [Wet op de Arbeidsongeschiktheidsverzekering][ref9] of de [Wet arbeid en zorg][ref10] of een toeslag op
      grond van de [Toeslagenwet][ref11], betaalt de betrokken gemeente, onderscheidenlijk het Uitvoeringsinstituut
      werknemersverzekeringen het bedrag van die boete, zonder dat daarvoor diens machtiging nodig is, op haar verzoek
      aan de Sociale verzekeringsbank.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0004044
      [ref3]: https://wetten.overheid.nl/BWBR0004163
      [ref4]: https://wetten.overheid.nl/BWBR0009344
      [ref5]: https://wetten.overheid.nl/BWBR0004045
      [ref6]: https://wetten.overheid.nl/BWBR0001888
      [ref7]: https://wetten.overheid.nl/BWBR0008656
      [ref8]: https://wetten.overheid.nl/BWBR0008657
      [ref9]: https://wetten.overheid.nl/BWBR0002524
      [ref10]: https://wetten.overheid.nl/BWBR0013008
      [ref11]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0004044
      - id: ref3
        bwb_id: BWBR0004163
      - id: ref4
        bwb_id: BWBR0009344
      - id: ref5
        bwb_id: BWBR0004045
      - id: ref6
        bwb_id: BWBR0001888
      - id: ref7
        bwb_id: BWBR0008656
      - id: ref8
        bwb_id: BWBR0008657
      - id: ref9
        bwb_id: BWBR0002524
      - id: ref10
        bwb_id: BWBR0013008
      - id: ref11
        bwb_id: BWBR0004043
  - number: '45.4'
    text: |-
      Indien degene aan wie een boete is opgelegd, geen kinderbijslag, pensioen of uitkering als bedoeld in het tweede of
      derde lid ontvangt of meer ontvangt, dan wel ten aanzien van zodanige uitkering toepassing van het derde lid niet
      mogelijk is, wordt het besluit waarbij de boete is opgelegd bij gebreke van tijdige betaling met toepassing van het
      [Wetboek van Burgerlijke Rechtsvordering][ref1] op zijn kosten betekend en tenuitvoergelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '45.5'
    text: |-
      De tenuitvoerlegging van een besluit waarbij een boete is opgelegd vindt plaats met toepassing van het tweede en
      derde lid, dan wel van het vierde lid, dan wel van het tweede of derde lid in combinatie met het vierde lid.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel45
  - number: '45.6'
    text: |-
      Bij gebreke van tijdige betaling wordt de verschuldigde boete verhoogd met de wettelijke rente en de op de
      invordering betrekking hebbende kosten.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel45
  - number: '45.7'
    text: |-
      Op het executoriaal beslag ingevolge dit artikel door de Sociale verzekeringsbank op loon,
      sociale uitkeringen of andere periodieke betalingen, welke derden verschuldigd zijn of worden aan
      degene aan wie een boete is opgelegd zijn de [artikelen 479 b tot en met 479g][ref1], behoudens
      [artikel 479e, tweede lid, van het Wetboek van Burgerlijke Rechtsvordering][ref2] van overeenkomstige toepassing.
      De in [artikel 479g][ref3] aan het Landelijk Bureau Inning Onderhoudsbijdragen toegekende bevoegdheid komt
      gelijkelijk toe aan de Sociale verzekeringsbank.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel479b
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel479e
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel479g
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 479b
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 479e
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 479g
  - number: '45.8'
    text: |-
      De tenuitvoerlegging van een besluit met toepassing van dit artikel geschiedt zodanig dat de nabestaande
      of het ouderloos kind blijven beschikken over een inkomen gelijk aan de beslagvrije voet bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
  - number: '45.9'
    text: |-
      Het achtste lid geldt niet, zolang de nabestaande, het ouderloos kind of zijn wettelijke vertegenwoordiger zijn
      verplichting in [artikel 39, vijfde lid][ref1], niet of niet behoorlijk nakomt.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel39
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '39'
        hoofdstuk: '3'
        afdeling: II
  - number: '46.1'
    text: |-
      De Sociale verzekeringsbank betaalt met inachtneming van [artikel 50][ref1] de uitkering zo spoedig mogelijk, doch
      uiterlijk binnen een maand nadat zij het recht op die uitkering heeft vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel50
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '50'
        hoofdstuk: '3'
        afdeling: III
  - number: '46.2'
    text: De betaling bedoeld in het eerste lid geschiedt in de regel per maand.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel46
  - number: '46.3'
    text: |-
      De Sociale verzekeringsbank schort de betaling van de uitkering op of schorst de betaling indien zij op grond van
      duidelijke aanwijzingen van oordeel is of het gegronde vermoeden heeft, dat:
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel46
  - number: 46.3.a
    text: het recht op uitkering niet of niet meer bestaat; of
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel46
  - number: 46.3.b
    text: recht op een lagere uitkering bestaat; of
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel46
  - number: 46.3.c
    text: |-
      de nabestaande, het ouderloos kind, of zijn wettelijke vertegenwoordiger dan wel de instelling aan welke ingevolge
      [artikel 49][ref1] of [57][ref2] de uitkering wordt uitbetaald, een verplichting bedoeld in [artikel 35][ref3],
      [36, tweede lid][ref4], of [37][ref5] niet is nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel57
      [ref3]: https://wetten.overheid.nl/BWBR0007795#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0007795#Artikel36
      [ref5]: https://wetten.overheid.nl/BWBR0007795#Artikel37
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '49'
        hoofdstuk: '3'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '57'
        hoofdstuk: '3'
        afdeling: III
      - id: ref3
        bwb_id: BWBR0007795
        artikel: '35'
        hoofdstuk: '3'
        afdeling: II
      - id: ref4
        bwb_id: BWBR0007795
        artikel: '36'
        hoofdstuk: '3'
        afdeling: II
      - id: ref5
        bwb_id: BWBR0007795
        artikel: '37'
        hoofdstuk: '3'
        afdeling: II
  - number: '46.4'
    text: |-
      De Sociale verzekeringsbank stelt de betrokken persoon of instelling onverwijld schriftelijk in kennis van de
      beslissing bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel46
  - number: 46a.1
    text: |-
      De Sociale verzekeringsbank schort de betaling van de uitkering op indien degene aan wie een uitkering
      is toegekend een vreemdeling is die niet rechtmatig in Nederland verblijf houdt als bedoeld in
      [artikel 8 van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel46a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 46a.2
    text: |-
      De betaling van de uitkering wordt hervat indien betrokkene daartoe een aanvraag indient en het de Bank is gebleken
      dat hij feitelijk buiten Nederland woont of verblijf houdt.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel46a
  - number: 46b.1
    text: |-
      De Sociale verzekeringsbank schort de betaling van de uitkering op, indien blijkt dat het door de nabestaande
      verstrekte adres van hemzelf of van een kind afwijkt van het adres waaronder de betrokkene in de gemeentelijke
      basisadministratie persoonsgegevens staat ingeschreven.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel46b
  - number: 46b.2
    text: 'Geen opschorting vindt plaats:'
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel46b
  - number: 46b.2.a
    text: indien de afwijking redelijkerwijs geen gevolgen kan hebben voor het recht op of de hoogte van de uitkering;
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel46b
  - number: 46b.2.b
    text: indien de nabestaande van de afwijking redelijkerwijs geen verwijt kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel46b
  - number: 46b.3
    text: De Sociale verzekeringsbank doet schriftelijk mededeling van de opschorting aan de nabestaande.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel46b
  - number: 46b.4
    text: |-
      De opschorting wordt beëindigd zodra het aan de Sociale verzekeringsbank gebleken is dat de afwijking niet meer
      bestaat.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel46b
  - number: '47.1'
    text: De Sociale verzekeringsbank is bevoegd een voorschot te betalen op een nog niet vastgestelde uitkering.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel47
  - number: '47.2'
    text: |-
      Voor zover bij of krachtens deze wet niet anders is bepaald, wordt een voorschot als bedoeld in het eerste lid
      beschouwd als een uitkering ingevolge deze wet.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel47
  - number: '48'
    text: |-
      Ingeval de uitkering in het buitenland wordt uitbetaald, worden de daaraan verbonden kosten op de uitkering in
      mindering gebracht.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel48
  - number: '49.1'
    text: |-
      De Sociale verzekeringsbank is bevoegd, voor zover nodig na ingewonnen advies van het Landelijk Bureau Inning
      Onderhoudsbijdragen, de wezenuitkering betaalbaar te stellen aan een ander dan de wettelijke vertegenwoordiger van
      het kind.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel49
  - number: '49.2'
    text: |-
      Indien de rechthebbende of diens wettelijke vertegenwoordiger nalaat een aanvraag om wezenuitkering in te dienen,
      kan deze aanvraag geschieden door het Landelijk Bureau Inning Onderhoudsbijdragen, dat tevens adviseert aan wie de
      wezenuitkering betaalbaar kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel49
  - number: '50.1'
    text: |-
      De Sociale verzekeringsbank betaalt, voor zover niet reeds betaald, de vakantie-uitkering in afwijking van
      [artikel 46][ref1] jaarlijks in de maand mei over de aan die maand voorafgaande 12 maanden, of indien het recht
      op uitkering eerder dan in de maand mei eindigt, in de desbetreffende maand, tenzij aansluitend aan het recht op
      uitkering op grond van deze wet recht op uitkering ingevolge de [Algemene Ouderdomswet][ref2] ontstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '46'
        hoofdstuk: '3'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0002221
  - number: '50.2'
    text: Bij ministeriële regeling worden nadere regels gesteld voor de betaling van de vakantie-uitkering.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel50
  - number: '51.1'
    text: |-
      Na het overlijden van degene aan wie nabestaandenuitkering of halfwezenuitkering is toegekend, wordt met ingang
      van de dag na overlijden nabestaandenuitkering of halfwezenuitkering in de vorm van een overlijdensuitkering
      uitbetaald:
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel51
  - number: 51.1.a
    text: aan de minderjarige kinderen tot wie de overledene in familierechtelijke betrekking stond;
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel51
  - number: 51.1.b
    text: |-
      bij ontstentenis van de in onderdeel *a* bedoelde kinderen aan degenen ten aanzien van wie de overledene
      grotendeels in de kosten van het bestaan voorzag en met wie hij in gezinsverband leefde.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel51
  - number: '51.2'
    text: |-
      De overlijdensuitkering is gelijk aan het bedrag van de nabestaandenuitkering of de halfwezenuitkering dan wel van
      de nabestaanden- en halfwezenuitkering over één maand, berekend naar de hoogte van die uitkeringen in de maand van
      overlijden van degene aan wie nabestaandenuitkering of halfwezenuitkering is toegekend.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel51
  - number: '51.3'
    text: |-
      De overlijdensuitkering wordt ambtshalve of op verzoek van de rechthebbende of rechthebbenden door de Sociale
      verzekeringsbank uitbetaald.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel51
  - number: '51.4'
    text: De overlijdensuitkering wordt in een bedrag ineens uitbetaald.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel51
  - number: '51.5'
    text: |-
      Het bedrag van de overlijdensuitkering wordt verminderd met het bedrag aan nabestaandenuitkering of
      halfwezenuitkering dat, over na het overlijden gelegen dagen, reeds is uitbetaald.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel51
  - number: '51.6'
    text: De overlijdensuitkering is niet vatbaar voor beslag.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel51
  - number: '52.1'
    text: |-
      Een uitkering op grond van deze wet die niet in ontvangst is genomen of is ingevorderd binnen drie maanden na de
      dag van betaalbaarstelling, wordt niet meer betaald.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel52
  - number: '52.2'
    text: |-
      De Sociale verzekeringsbank is bevoegd in bijzondere gevallen ten gunste van de nabestaande of het ouderloos kind
      af te wijken van de termijn van drie maanden.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel52
  - number: '53.1'
    text: |-
      De uitkering op grond van deze wet die als gevolg van een besluit als bedoeld in [artikel 34][ref1] onverschuldigd
      is betaald, alsmede hetgeen anderszins onverschuldigd is betaald, wordt door de Sociale verzekeringsbank van
      de nabestaande of het ouderloos kind of zijn wettelijke vertegenwoordiger, of de instelling aan welke ingevolge
      [artikel 49][ref2] of 57 de uitkering wordt uitbetaald, teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel49
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '34'
        hoofdstuk: '3'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '49'
        hoofdstuk: '3'
        afdeling: III
  - number: '53.2'
    text: |-
      In afwijking van het eerste lid kan de Sociale verzekeringsbank besluiten van terugvordering of van verdere
      terugvordering af te zien, indien de nabestaande of het ouderloos kind of zijn wettelijke vertegenwoordiger, of de
      instelling aan welke ingevolge [artikel 49][ref1] of [57][ref2] de uitkering wordt uitbetaald:


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel57
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '49'
        hoofdstuk: '3'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '57'
        hoofdstuk: '3'
        afdeling: III
  - number: 53.2.a
    text: gedurende vijf jaar volledig aan zijn betalingsverplichtingen heeft voldaan;
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel53
  - number: 53.2.b
    text: |-
      gedurende vijf jaar niet volledig aan zijn betalingsverplichtingen heeft voldaan, maar het achterstallige bedrag
      over die periode, vermeerderd met de daarover verschuldigde wettelijke rente en de op de invordering betrekking
      hebbende kosten, alsnog heeft betaald;
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel53
  - number: 53.2.c
    text: |-
      gedurende vijf jaar geen betalingen heeft verricht en niet aannemelijk is dat hij deze op enig moment zal gaan
      verrichten; of
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel53
  - number: 53.2.d
    text: een bedrag, overeenkomend met ten minste 50% van de restsom in één keer aflost.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel53
  - number: '53.3'
    text: 'De in het tweede lid, onder a en b, genoemde termijn is drie jaar indien:'
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel53
  - number: 53.3.a
    text: |-
      het gemiddeld inkomen van de belanghebbende in die periode de beslagvrije voet bedoeld in de [artikelen 475c][ref1]
      en [475d van het Wetboek van Burgerlijke Rechtsvordering][ref2] niet te boven is gegaan; en


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475d
  - number: 53.3.b
    text: |-
      de terugvordering niet het gevolg is van het niet of niet behoorlijk nakomen van de verplichting, bedoeld in
      [artikel 35][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel35
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '35'
        hoofdstuk: '3'
        afdeling: II
  - number: '53.4'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan de Sociale verzekeringsbank besluiten geheel of gedeeltelijk
      van de terugvordering af te zien.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel53
  - number: '53.5'
    text: |-
      Het besluit tot terugvordering vermeldt hetgeen wordt teruggevorderd, de termijn of termijnen waarbinnen moet
      worden betaald, alsmede dat het besluit bij gebreke van tijdige betaling zal worden tenuitvoergelegd op de wijze
      als omschreven in [artikel 54][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel54
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '54'
        hoofdstuk: '3'
        afdeling: III
  - number: '53.6'
    text: |-
      Degene van wie wordt teruggevorderd is verplicht desgevraagd aan de Sociale verzekeringsbank de inlichtingen te
      verstrekken die voor de terugvordering van belang zijn.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel53
  - number: '53.7'
    text: |-
      In afwijking van het eerste lid kan de Sociale verzekeringsbank, onder voorwaarden die Onze Minister kan stellen,
      besluiten van terugvordering af te zien indien het terug te vorderen bedrag een door Onze Minister vast te stellen
      bedrag niet te boven gaat.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel53
  - number: '54.1'
    text: |-
      Het besluit tot terugvordering levert een executoriale titel op in de zin van het [Tweede Boek van het Wetboek van
      Burgerlijke Rechtsvordering](onbekend).
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel54
  - number: '54.2'
    text: |-
      [Artikel 45][ref1] is van overeenkomstige toepassing, met dien verstande dat indien het gemiddeld inkomen
      van de belanghebbende gedurende drie jaar de beslagvrije voet bedoeld in de [artikelen 475c][ref2] en
      [475d van het Wetboek van Burgerlijke Rechtsvordering][ref3] niet te boven is gegaan, de Sociale verzekeringsbank
      de aflossingsbedragen lager vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '45'
        hoofdstuk: '3'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 475d
  - number: '55'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot
      [artikel 53, eerste, tweede, derde, vierde, vijfde en zesde lid][ref1], en [54][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel54
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '53'
        hoofdstuk: '3'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '54'
        hoofdstuk: '3'
        afdeling: III
  - number: '56.1'
    text: |-
      Voor het in ontvangst nemen en het verlenen van kwijting voor de betaling van de uitkering wordt een minderjarige
      met een meerderjarige gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel56
  - number: '56.2'
    text: |-
      Indien de wettelijke vertegenwoordiger van de minderjarige zich schriftelijk bij de Sociale verzekeringsbank verzet
      tegen betaling aan de minderjarige wordt de uitkering aan de wettelijke vertegenwoordiger betaald.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel56
  - number: '57.1'
    text: |-
      Indien degene, aan wie uitkering op grond van deze wet is toegekend, in een inrichting ter verpleging van
      geesteszieken of van zwakzinnigen is opgenomen en de Sociale verzekeringsbank van de desbetreffende inrichting
      of van de gemeente die de opnamekosten betaalt, het verzoek ontvangt om de uitkering aan die inrichting of
      die gemeente uit te betalen, is de Sociale verzekeringsbank bevoegd dat verzoek zonder het stellen van andere
      voorwaarden in te willigen.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel57
  - number: '57.2'
    text: |-
      Indien degene, aan wie uitkering op grond van deze wet is toegekend, op grond van
      [artikel 6, derde lid, van de Algemene Wet Bijzondere Ziektekosten][ref1] een bijdrage verschuldigd is in de kosten
      van een verstrekking als bedoeld in de [artikelen 6][ref2] en[ 11 van die wet][ref3] of een vergoeding als bedoeld
      in de [artikelen 11][ref4] en [12 van die wet][ref5], is de Sociale verzekeringsbank bevoegd de uitkering tot het
      bedrag van die bijdrage in plaats van aan degene, aan wie de uitkering is toegekend, zonder diens machtiging uit te
      betalen aan het College voor zorgverzekeringen, genoemd in [artikel 1a van de Ziekenfondswet][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0002614#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0002614#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0002614#Artikel12
      [ref6]: https://wetten.overheid.nl/BWBR0002460#Artikel1a
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0002614
        artikel: '11'
      - id: ref4
        bwb_id: BWBR0002614
        artikel: '11'
      - id: ref5
        bwb_id: BWBR0002614
        artikel: '12'
      - id: ref6
        bwb_id: BWBR0002460
        artikel: 1a
  - number: '57.3'
    text: |-
      Indien het tweede lid toepassing vindt, heeft de in het eerste lid bedoelde bevoegdheid betrekking op het gedeelte
      van de uitkering, dat niet aan het in het tweede lid bedoelde orgaan wordt uitbetaald.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel57
  - number: '57.4'
    text: |-
      Op de herziening van een beschikking op grond van het tweede lid als gevolg van een wijziging van de verschuldigde
      bijdrage, zijn de [artikelen 3:41][ref1] en [3:45 van de Algemene wet bestuursrecht][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '59.1'
    text: De uitkering is
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel59
  - number: 59.1.a
    text: onvervreemdbaar,
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel59
  - number: 59.1.b
    text: niet vatbaar voor verpanding of belening.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel59
  - number: '59.2'
    text: Volmacht tot ontvangst van uitkering, onder welke vorm of welke benaming ook verleend, is steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel59
  - number: '59.3'
    text: Elk beding, strijdig met enige bepaling van dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel59
  - number: '60'
    text: |-
      Bij de vaststelling van de schadevergoeding, waarop de nabestaande en ouderloos geworden kinderen van de verzekerde
      naar burgerlijk recht aanspraak kunnen maken ter zake van het overlijden van de verzekerde, houdt de rechter
      rekening met de aanspraken op uitkeringen, die de nabestaande en het ouderloos kind op grond van deze wet hebben.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel60
  - number: '61.1'
    text: |-
      De Sociale verzekeringsbank heeft voor de krachtens deze wet gemaakte kosten verhaal op degene, die in verband
      met het veroorzaken van het overlijden van de verzekerde, jegens diens nabestaande en ouderloos geworden kinderen
      naar burgerlijk recht tot schadevergoeding is verplicht, doch ten hoogste tot het bedrag, waarvoor deze bij het
      ontbreken van de aanspraken op grond van deze wet naar burgerlijk recht aansprakelijk zou zijn, verminderd met een
      bedrag, gelijk aan dat van de schadevergoeding tot betaling waarvan de aansprakelijk persoon jegens de nabestaande
      en ouderloos geworden kinderen naar burgerlijk recht is gehouden.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel61
  - number: '61.2'
    text: |-
      De Sociale verzekeringsbank kan in plaats van het bedrag der periodieke verstrekkingen de contante waarde daarvan
      vorderen in de vorm van een jaarlijks vast te stellen afkoopsom die aan de Sociale verzekeringsbank wordt vergoed
      voor de totale schadelast ten gevolge van het veroorzaken van overlijden.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel61
  - number: '62.1'
    text: |-
      Indien de verzekerde bij zijn overlijden in dienstbetrekking werkzaam was, geldt [artikel 61][ref1], ten aanzien
      van de naar burgerlijk recht tot schadevergoeding verplichte werkgever van de verzekerde, onderscheidenlijk ten
      aanzien van de naar burgerlijk recht tot schadevergoeding verplichte persoon, die in dienstbetrekking staat tot
      dezelfde werkgever als de verzekerde jegens wiens nabestaande en ouderloos geworden kinderen naar burgerlijk recht
      verplichting tot schadevergoeding bestaat, slechts indien het overlijden van de verzekerde is te wijten aan opzet
      of bewuste roekeloosheid van die werkgever onderscheidenlijk persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel61
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '61'
        hoofdstuk: '4'
  - number: '62.2'
    text: |-
      Voor de toepassing van het eerste lid wordt mede als werkgever beschouwd degene, die krachtens het eerste lid van
      [artikel 16][ref1] mede als werkgever wordt beschouwd, ongeacht de bij het tweede lid van dat artikel bedoelde
      uitzonderingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002126#Artikel16a
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0002126
        artikel: 16a
  - number: '63'
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder gewezen verzekerde: degene, wiens
      verplichte verzekering is geëindigd.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel63
  - number: 63a.1
    text: |-
      De gewezen verzekerde kan zich vrijwillig verzekeren over een periode van tien jaar, met ingang van de dag na
      de dag waarop de verplichte verzekering is geëindigd. De eerste zin is alleen van toepassing indien de gewezen
      verzekerde direct voorafgaande aan de periode van vrijwillige verzekering ten minste een jaar verplicht verzekerd
      is geweest.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel63a
  - number: 63a.2
    text: |-
      De gewezen verzekerde, bedoeld in het eerste lid, kan zich, indien de periode van vrijwillige verzekering is
      onderbroken door een periode van verplichte verzekering korter dan een jaar, opnieuw vrijwillig verzekeren voor de
      resterende periode van de tien jaar, bedoeld in dat lid.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel63a
  - number: 63a.3
    text: 'De periode van maximaal tien jaar, bedoeld in het eerste lid, is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel63a
  - number: 63a.3.a
    text: |-
      de gewezen verzekerde die in dienstbetrekking staat tot een Nederlandse publiekrechtelijke rechtspersoon dan wel
      uit anderen hoofde loon geniet van een zodanige rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel63a
  - number: 63a.3.b
    text: |-
      de gewezen verzekerde die is uitgezonden om werkzaamheden te verrichten voor door Onze Minister in overeenstemming
      met Onze Minister voor Ontwikkelingssamenwerking aan te wijzen organisaties voor ontwikkelingssamenwerking;
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel63a
  - number: 63a.3.c
    text: |-
      de gewezen verzekerde die werkzaam is bij een door Onze Minister, Onze Minister van Volksgezondheid, Welzijn en
      Sport en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties aan te wijzen volkenrechtelijke organisatie;
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel63a
  - number: 63a.3.d
    text: |-
      de gewezen verzekerde die werkzaamheden verricht die worden bekostigd door het Rijk en die tevens in opdracht van
      het Rijk worden verricht in het kader van een wettelijke taakomschrijving of ter uitvoering van een internationaal
      verdrag dan wel een daarmee gelijk te stellen overeenkomst of een besluit van een volkenrechtelijke organisatie;
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel63a
  - number: 63a.3.e
    text: |-
      de gewezen verzekerde, die op de dag waarop de verplichte verzekering is geëindigd de leeftijd van 50 jaar heeft
      bereikt, niet in Nederland woont en recht heeft op een:
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel63a
  - number: 63a.3.e.1°
    text: |-
      uitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel63a
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: 63a.3.e.2°
    text: |-
      uitkering op grond van de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel63a
    references:
      - id: ref1
        bwb_id: BWBR0008656
  - number: 63a.3.e.3°
    text: |-
      uitkering op grond van de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel63a
    references:
      - id: ref1
        bwb_id: BWBR0008657
  - number: 63a.3.e.4°
    text: |-
      uitkering op grond van de [Wet arbeidsongeschiktheidsvoorziening militairen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002822
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel63a
    references:
      - id: ref1
        bwb_id: BWBR0002822
  - number: 63a.3.e.5°
    text: |-
      pensioen op basis van arbeidsongeschiktheid op grond van de [Wet privatisering Spoorwegpensioenfonds][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006319
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel63a
    references:
      - id: ref1
        bwb_id: BWBR0006319
  - number: 63a.3.e.6°
    text: |-
      pensioen op basis van arbeidsongeschiktheid op grond van de Algemene militaire pensioenwet, zoals die luidde voor 1
      januari 1998;
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel63a
  - number: 63a.3.e.7°
    text: |-
      ouderdomspensioen op grond van de [Algemene Ouderdomswet][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel63a
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 63a.3.e.8°
    text: |-
      nabestaandenuitkering op grond van deze wet, mits die uitkering of dat pensioen ten minste gelijk is aan 35%
      van het in [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref1] bedoelde
      bedrag; of


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel63a
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
  - number: 63a.3.f
    text: |-
      de gewezen verzekerde wiens recht op een uitkering als bedoeld in onderdeel e uitsluitend als gevolg van het
      bereiken van de leeftijd van 65 jaar is geëindigd.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel63a
  - number: 63a.4
    text: |-
      De periode van maximaal tien jaar, bedoeld in het eerste lid, is niet van toepassing op de echtgenoot van de in het
      derde lid genoemde gewezen verzekerde en de inwonende minderjarige kinderen met wie die gewezen verzekerde of die
      echtgenoot in familierechtelijke betrekking staat.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel63a
  - number: 63a.5
    text: Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van dit artikel nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel63a
  - number: 63b.1
    text: |-
      De gewezen verzekerde die van de vrijwillige verzekering, bedoeld in [artikel 63a, eerste lid][ref1], gebruik wil
      maken, is verplicht uiterlijk een jaar na de dag, waarop de verzekering is geëindigd, een aanvraag daartoe in te
      dienen bij de Sociale verzekeringsbank.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel63a
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel63b
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: 63a
        hoofdstuk: '5'
  - number: 63b.2
    text: |-
      De aanvraag wordt afgewezen indien de gewezen verzekerde niet voldoet aan de bij of krachtens dit hoofdstuk
      gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel63b
  - number: 63c.1
    text: |-
      De vrijwillige verzekering, bedoeld in [artikel 63a, eerste lid][ref1], eindigt:


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel63a
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel63c
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: 63a
        hoofdstuk: '5'
  - number: 63c.1.a
    text: |-
      indien de gewezen verzekerde schriftelijk aan de Sociale verzekeringsbank te kennen geeft niet langer van de
      vrijwillige verzekering gebruik te willen maken;
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel63c
  - number: 63c.1.b
    text: |-
      met ingang van de dag, waarop de periode van tien jaar, bedoeld in [artikel 63a, eerste lid][ref1], is verstreken;


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel63a
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel63c
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: 63a
        hoofdstuk: '5'
  - number: 63c.1.c
    text: met ingang van de dag, waarop de gewezen verzekerde verplicht verzekerd wordt op grond van deze wet;
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel63c
  - number: 63c.1.d
    text: |-
      indien de verschuldigde premie voor de vrijwillige algemene nabestaandenverzekering, bedoeld in
      [artikel 26 van de Wet financiering volksverzekeringen][ref1], uiterlijk drie maanden na een door de Sociale
      verzekeringsbank vastgestelde termijn niet of niet geheel is betaald;


      [ref1]: https://wetten.overheid.nl/BWBR0004538#Artikel26
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel63c
    references:
      - id: ref1
        bwb_id: BWBR0004538
        artikel: '26'
  - number: 63c.1.e
    text: |-
      indien de gewezen verzekerde de van hem, in verband met de toepassing van dit hoofdstuk, verlangde inlichtingen
      niet binnen een door de Sociale verzekeringsbank gestelde termijn heeft verstrekt, tenzij de gewezen verzekerde
      aannemelijk maakt dat dat hem niet in overwegende mate kan worden verweten.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel63c
  - number: 63c.2
    text: |-
      Voor de toepassing van het eerste lid, onderdelen a, d en e, wordt de vrijwillige verzekering geacht te zijn
      geëindigd, met ingang van de dag volgende op die waarover voor het laatst premie is betaald.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel63c
  - number: 63d
    text: |-
      De [artikelen 63 tot en met 63c][ref1] zijn van overeenkomstige toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel63
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel63d
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '63'
        hoofdstuk: '5'
  - number: 63d.a
    text: |-
      de gewezen verzekerde die op 31 december 1999 verplicht verzekerd was op grond van
      [artikel 26 van het Besluit uitbreiding en beperking kring verzekerden volksverzekeringen 1999][ref1]
      en die op of na 1 januari 2000, maar voor de dag van inwerkingtreding van de
      [Wet herziening vrijwillige verzekering AOW en ANW][ref2], de leeftijd van 65 jaar heeft bereikt;


      [ref1]: https://wetten.overheid.nl/BWBR0010182#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0012436
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel63d
    references:
      - id: ref1
        bwb_id: BWBR0010182
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0012436
  - number: 63d.b
    text: |-
      de gewezen verzekerde die op 31 december 1999 vrijwillig verzekerd was op grond van [artikel 63][ref1] van
      deze wet, zoals dat artikel luidde tot en met de dag voorafgaande aan de dag van inwerkingtreding van de
      [Wet herziening vrijwillige verzekering AOW en ANW][ref2] en wiens vrijwillige verzekering tussen 31 december 1999
      en de dag van inwerkingtreding van de [Wet herziening vrijwillige verzekering AOW en ANW][ref3] uitsluitend als
      gevolg van het bereiken van de leeftijd van 65 jaar is geëindigd;


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0012436
      [ref3]: https://wetten.overheid.nl/BWBR0012436
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel63d
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '63'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0012436
      - id: ref3
        bwb_id: BWBR0012436
  - number: '64'
    text: |-
      Degene, die gemoedsbezwaren heeft tegen de in deze wet geregelde verzekering, alsmede de rechtspersoon waarbij
      natuurlijke personen zijn betrokken die zodanige gemoedsbezwaren hebben, kunnen van verplichtingen, welke hun bij
      of krachtens [hoofdstuk II van de Wet financiering volksverzekeringen][ref1] zijn opgelegd, overeenkomstig het bij
      of krachtens [paragraaf 8 van dat hoofdstuk][ref2] bepaalde, worden vrijgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004538#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0004538#Paragraaf8
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0004538
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0004538
        paragraaf: '8'
  - number: 64a.1
    text: |-
      Een beschikking op grond van deze wet en de daarop berustende bepalingen wordt gegeven binnen een redelijke termijn
      na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel64a
  - number: 64a.2
    text: |-
      De redelijke termijn is in ieder geval verstreken wanneer binnen acht weken na ontvangst van de aanvraag geen
      beschikking is gegeven, noch een kennisgeving als bedoeld in het derde of vierde lid is gedaan.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel64a
  - number: 64a.3
    text: |-
      Indien een beschikking niet binnen de termijn van acht weken kan worden gegeven, wordt die termijn met een
      redelijke termijn verlengd en wordt de aanvrager daarvan schriftelijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel64a
  - number: 64a.4
    text: |-
      Indien in verband met het geven van een beschikking als bedoeld in het eerste lid informatie is gevraagd aan een
      persoon of instantie buiten Nederland en om die reden de beschikking niet binnen acht weken gegeven kan worden,
      wordt die termijn verlengd met ten hoogste zes maanden en wordt de aanvrager van deze verlenging schriftelijk in
      kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel64a
  - number: '65'
    text: |-
      In afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] beslist de Sociale
      verzekeringsbank binnen dertien weken na ontvangst van het bezwaarschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '66.1'
    text: |-
      Tegen uitspraken van de Centrale Raad van Beroep kan ieder der partijen beroep in cassatie instellen terzake van
      schending of verkeerde toepassing van de [artikelen 3, tweede tot en met zesde lid][ref1], [6][ref2], [7][ref3]
      en [13][ref4] en de op die artikelen berustende bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0007795#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0007795#Artikel13
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '3'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '6'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0007795
        artikel: '7'
        hoofdstuk: '1'
      - id: ref4
        bwb_id: BWBR0007795
        artikel: '13'
        hoofdstuk: '2'
  - number: '66.2'
    text: |-
      Op dit beroep zijn de voorschriften betreffende het beroep in cassatie tegen uitspraken van de gerechtshoven inzake
      beroepen in belastingzaken van overeenkomstige toepassing, waarbij de Centrale Raad van Beroep de plaats inneemt
      van een gerechtshof.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel66
  - number: 66a.1
    text: |-
      Een persoon, wiens echtgenoot overlijdt binnen drie jaar na inwerkingtreding van deze wet, wordt aangemerkt als
      geboren voor 1 januari 1950.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel66a
  - number: 66a.2
    text: 'Voor de toepassing van het eerste lid wordt een persoon uitsluitend als nabestaande aangemerkt, indien hij:'
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel66a
  - number: 66a.2.a
    text: is geboren op of na 1 januari 1950 en voor 1 juli 1956;
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel66a
  - number: 66a.2.b
    text: |-
      op de dag van overlijden was gehuwd met de persoon die nadien is overleden, waarbij [artikel 3][ref1], buiten
      toepassing blijft; en


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel3
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel66a
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '3'
        hoofdstuk: '1'
  - number: 66a.2.c
    text: |-
      overigens ter zake van het overlijden van zijn echtgenoot, indien dat overlijden zou hebben plaatsgevonden op de
      dag voor inwerkingtreding van deze wet, recht zou hebben gehad op een weduwenpensioen op grond van de Algemene
      Weduwen- en Wezenwet.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel66a
  - number: 66a.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden in afwijking van het eerste lid regels gesteld waarbij een
      persoon die voldoet aan die regels alsmede aan het tweede lid, doch wiens echtgenoot overlijdt op of na de dag
      gelegen drie jaar na de dag van inwerkingtreding van deze wet, wordt aangemerkt als geboren voor 1 januari 1950.
      Deze regels hebben in elk geval betrekking op de periode waarbinnen en de voorwaarden waaronder een aanvraag om
      als zodanig te worden aangemerkt bij de Sociale verzekeringsbank moet worden ingediend en op de hoogte van een
      daartoe verschuldigde bijdrage. Daarnaast hebben deze regels betrekking op de door de Sociale verzekeringsbank
      verschuldigde vergoeding aan derden in verband met door hen gemaakte kosten ten behoeve van de uitvoering van de in
      de eerste zin bedoelde algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel66a
  - number: '67.1'
    text: |-
      Tot de dag met ingang waarvan hij een nieuw recht heeft op nabestaandenuitkering op grond van deze wet heeft
      de persoon die op de dag voorafgaand aan de inwerkingtreding van deze wet recht had op een uitkering op grond
      van artikel 8 van de Algemene Weduwen- en Wezenwet overeenkomstig de bepalingen van deze wet recht op een
      nabestaandenuitkering en halfwezenuitkering, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel67
  - number: 67.1.a
    text: |-
      het recht op nabestaandenuitkering niet eindigt, wanneer de nabestaande niet meer voldoet aan de voorwaarden van
      [artikel 14, eerste lid, onderdelen a en b][ref1], zolang hij de leeftijd van 65 jaar nog niet heeft bereikt,
      indien hij:


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel14
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: I
  - number: 67.1.a.1°
    text: |-
      40 jaar of ouder is op de laatste dag van de maand, waarin de dag gelegen is met ingang waarvan hij niet aan de
      bedoelde voorwaarden voldoet, of
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel67
  - number: 67.1.a.2°
    text: |-
      35 jaar of ouder, doch jonger dan 40 jaar is op de laatste dag van de maand, waarin de dag gelegen is, met ingang
      waarvan hij anders dan in verband met [artikel 5, derde lid][ref1], niet meer voldoet aan de voorwaarde voor het
      recht op uitkering overeenkomstig [artikel 14, eerste lid, onderdeel a][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel14
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '5'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: I
  - number: 67.1.b
    text: |-
      inkomen, bestaande uit een uitkering op grond van de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1] of
      de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref2] op de nabestaandenuitkering in mindering wordt
      gebracht; en


      [ref1]: https://wetten.overheid.nl/BWBR0008656
      [ref2]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0008656
      - id: ref2
        bwb_id: BWBR0008657
  - number: 67.1.c
    text: |-
      met ingang van 1 januari 1998 op de nabestaandenuitkering het overig inkomen in mindering wordt gebracht
      overeenkomstig het tweede lid, waarbij van de nabestaandenuitkering een bedrag gelijk aan 30% van het bruto-
      minimumloon buiten aanmerking blijft.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel67
  - number: '67.2'
    text: |-
      Voor de persoon, bedoeld in het eerste lid, wordt van het inkomen, bedoeld in het eerste lid, onderdeel *c*, buiten
      aanmerking gelaten een bedrag gelijk aan 70% van het bruto-minimumloon. Indien het inkomen geheel of mede bestaat
      uit inkomen uit arbeid en dat inkomen meer bedraagt dan 70% van het bruto-minimumloon, wordt naast het bedrag,
      bedoeld in de eerste zin, een derde gedeelte van dat meerdere buiten aanmerking gelaten.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel67
  - number: '67.3'
    text: |-
      Van de persoon, bedoeld in het eerste lid, die op de dag van inwerkingtreding van deze wet een gezamenlijke
      huishouding voert anders dan ten behoeve van de verzorging van een hulpbehoevende en deze gezamenlijke huishouding
      nog steeds voert op 31 december 1997, wordt de nabestaandenuitkering met ingang van 1 januari 1998 verminderd tot
      een bedrag van 30% van het bruto-minimumloon, waarop in mindering wordt gebracht een uitkering als bedoeld in het
      eerste lid, onderdeel b. Deze nabestaandenuitkering wordt verhoogd tot 70% van het netto-minimumloon met ingang van
      de eerste dag van de maand dat de nabestaande voor 1 juli 1998 geen gezamenlijke huishouding meer voert. De Sociale
      verzekeringsbank kan indien de toepassing van de tweede zin wat de datum 1 juli 1998 betreft, tot een onbillijkheid
      van overwegende aard leidt, een latere datum vaststellen.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel67
  - number: '67.5'
    text: |-
      Tot 1 januari 1998 blijft voor de persoon, bedoeld in het eerste lid, het besluit op grond van artikel 30a van de
      Algemene Weduwen- en Wezenwet, zoals dat artikel luidde op de dag voorafgaand aan de inwerkingtreding van deze wet,
      van toepassing, waarbij voor de vaststelling van de uitkering de nabestaandenuitkering en de halfwezenuitkering
      worden samengeteld en als één uitkering worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel67
  - number: '67.6'
    text: |-
      Voor de persoon, bedoeld in het eerste lid, die op de dag voorafgaand aan de inwerkingtreding van deze wet
      onder toepassing van een overeenkomst of een regeling inzake sociale zekerheid, die tussen Nederland en een of
      meer mogendheden van kracht is, recht had op een uitkering op grond van de Algemene Weduwen- en Wezenwet, geldt
      tot 1 januari 1998 dat voor de vaststelling van de uitkering vanaf de dag van inwerkingtreding van deze wet de
      nabestaandenuitkering en de halfwezenuitkering worden samengeteld en als één uitkering worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel67
  - number: '67.7'
    text: |-
      Voor de toepassing van de Wet beperking samenloop van uitkeringen ingevolge de Algemene Weduwen- en Wezenwet met
      uitkeringen en renten op grond van de Ongevallenwet 1921 wordt een uitkering op grond van de Algemene Weduwen- en
      Wezenwet als een uitkering op grond van deze wet in aanmerking genomen, met dien verstande, dat voor het bepalen
      van de rente op grond van de Ongevallenwet 1921 die tot uitbetaling komt, [artikel 18][ref1] buiten aanmerking
      blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel18
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: I
  - number: '67.8'
    text: |-
      Bij ministeriële regeling kunnen voor situaties waarin dit artikel niet of onvoldoende voorziet dan wel toepassing
      van dit artikel tot onredelijke resultaten leidt nadere en zo nodig afwijkende regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel67
  - number: '67.9'
    text: |-
      In afwijking van het derde lid wordt de nabestaandenuitkering van de persoon, bedoeld in het eerste lid, die op
      de dag van inwerkingtreding van deze wet een gezamenlijke huishouding voert ten behoeve van de verzorging van een
      hulpbehoevende en deze gezamenlijke huishouding nog steeds voert op 31 december 1997, met ingang van 1 januari 1998
      verminderd tot een bedrag van 50% van het netto minimumloon, waarop in mindering wordt gebracht een uitkering als
      bedoeld in het eerste lid, onderdeel b. Op het deel van de nabestaandenuitkering dat meer bedraagt dan 30% van het
      bruto-minimumloon, wordt het overig inkomen, bedoeld in het eerste lid, onderdeel c, in mindering gebracht. De in
      de eerste zin bedoelde nabestaandenuitkering wordt verhoogd tot 70% van het netto-minimumloon met ingang van de
      eerste dag van de maand waarin geen gezamenlijke huishouding ten behoeve van de verzorging van een hulpbehoevende
      meer wordt gevoerd.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel67
  - number: '67.10'
    text: |-
      Indien de gezamenlijke huishouding, bedoeld in het negende lid, eindigt door het overlijden van de hulpbehoevende
      die niet tevens nabestaande is, ontstaat geen nieuw recht op nabestaandenuitkering.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel67
  - number: '67.11'
    text: |-
      Van de persoon, bedoeld in het eerste lid, eindigt de in dat lid bedoelde halfwezenuitkering met ingang van
      de eerste dag van de maand waarin een recht op halfwezenuitkering ten behoeve van een halfwees als bedoeld in
      [artikel 1, onderdeel f, onder 2°][ref1] wordt toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel1
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '1'
        hoofdstuk: '1'
  - number: '69.1'
    text: |-
      Tot de dag met ingang waarvan hij een nieuw recht heeft op nabestaandenuitkering op grond van deze wet behoudt de
      persoon die op de dag voorafgaand aan de inwerkingtreding van deze wet recht had op een tijdelijke uitkering op
      grond van artikel 13 van de Algemene Weduwen- en Wezenwet deze uitkering voor de nog resterende periode, die is
      vastgesteld op grond van dit artikel van de Algemene Weduwen- en Wezenwet. Daarbij wordt inkomen bestaande uit een
      arbeidsongeschiktheidsuitkering op grond van de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1] of de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref2] op de tijdelijke uitkering in mindering gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0008656
      [ref2]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0008656
      - id: ref2
        bwb_id: BWBR0008657
  - number: '69.2'
    text: |-
      De persoon, bedoeld in het eerste lid, heeft, onverminderd het eerste lid, recht op nabestaandenuitkering vanaf
      de eerste dag van de maand volgend op de eindiging van zijn tijdelijke uitkering op grond van artikel 13 van de
      Algemene Weduwen- en Wezenwet indien hij op de laatste dag van de periode waarover hem deze tijdelijke uitkering
      is toegekend arbeidsongeschikt is en van wie aannemelijk is dat de arbeidsongeschiktheid ten minste drie maanden na
      deze dag zal voortduren.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel69
  - number: '70'
    text: |-
      De nabestaande, die op de dag voor de inwerkingtreding van deze wet een tijdelijke weduwenuitkering
      of een weduwen- en wezenpensioen ingevolge de Algemene Weduwen- en Wezenwet ontving en ingevolge
      [artikel 16, tweede lid, onderdelen ][ref1], zoals die artikelen luidden op de dag, voorafgaande aan de dag met
      ingang waarvan deze wet in werking is getreden, niet verplicht verzekerd is ingevolge de [Ziekenfondswet][ref2],
      blijft, zolang met toepassing van de [artikelen 67][ref3], [69][ref4] en [71][ref5] een uitkering wordt ontvangen
      en de omstandigheden bedoeld in [artikel 16, tweede lid, onderdelen ][ref6], zoals die artikelen luidden op de
      dag, voorafgaande aan de dag met ingang waarvan deze wet in werking is getreden, op hem van toepassing zijn,
      uitgezonderd van de verplichte verzekering ingevolge de [Ziekenfondswet][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0003934#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0002460
      [ref3]: https://wetten.overheid.nl/BWBR0007795#Artikel67
      [ref4]: https://wetten.overheid.nl/BWBR0007795#Artikel69
      [ref5]: https://wetten.overheid.nl/BWBR0007795#Artikel71
      [ref6]: https://wetten.overheid.nl/BWBR0003934#Artikel16
      [ref7]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0003934
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0002460
      - id: ref3
        bwb_id: BWBR0007795
        artikel: '67'
        hoofdstuk: '8'
      - id: ref4
        bwb_id: BWBR0007795
        artikel: '69'
        hoofdstuk: '8'
      - id: ref5
        bwb_id: BWBR0007795
        artikel: '71'
        hoofdstuk: '8'
      - id: ref6
        bwb_id: BWBR0003934
        artikel: '16'
      - id: ref7
        bwb_id: BWBR0002460
  - number: '71.1'
    text: |-
      Degene, die op de dag voor de inwerkingtreding van deze wet recht had op een wezenpensioen op grond van de Algemene
      Weduwen- en Wezenwet, heeft overeenkomstig de bepalingen in deze wet recht op een wezenuitkering.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel71
  - number: '71.2'
    text: |-
      In afwijking van het eerste lid wordt ten aanzien van het kind dat op de dag van de inwerkingtreding van deze wet
      16 jaar of ouder is en recht had op uitkering op grond van artikel 17 van de Algemene Weduwen- en Wezenwet bij de
      toepassing van [artikel 26, tweede lid, onderdelen a en c][ref1] en [artikel 29, tweede lid, onderdeel c][ref2] in
      plaats van 21 jaar gelezen: 27 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel29
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '6'
        afdeling: I
  - number: '71.3'
    text: |-
      Van de persoon, bedoeld in dit artikel, die recht heeft op uitkering op grond van
      [artikel 26, tweede lid, onderdeel c][ref1], en die op de dag van inwerkingtreding van deze wet een gezamenlijke
      huishouding voert, en deze gezamenlijke huishouding nog steeds voert op 31 december 1997, eindigt de wezenuitkering
      met ingang van 1 januari 1998.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel26
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: I
  - number: '71.4'
    text: |-
      Tot en met 31 december 1997 wordt ingeval van samenloop van een wezenuitkering met een naar aard en
      strekking daarmee overeenkomende uitkering op grond van de wetgeving van de Nederlandse Antillen, Aruba, een
      volkenrechtelijke organisatie of een andere Mogendheid, – laatstbedoelde uitkering, in afwijking van het bij of
      krachtens [artikel 20][ref1] bepaalde, niet op de wezenuitkering in mindering gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel20
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: I
  - number: '71.5'
    text: |-
      In afwijking van het derde lid eindigt de wezenuitkering van de aldaar bedoelde persoon niet zolang de persoon
      die gezamenlijke huishouding voert met een hulpbehoevende en indien de persoon of de overleden verzekerde een
      huishouding is gaan voeren met het doel de hulpbehoevende te gaan verzorgen.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel71
  - number: '73'
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt een tijdvak van verzekering op grond van
      de Algemene Weduwen- en Wezenwet mede aangemerkt als een tijdvak van verzekering op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel73
  - number: '74'
    text: |-
      De rechten en verplichtingen ten laste van het Weduwen- en Wezenfonds worden ten laste van het Nabestaandenfonds
      bedoeld in [artikel 28, tweede lid van de Wet financiering volksverzekeringen][ref1] gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0004538#Artikel28
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0004538
        artikel: '28'
  - number: '77'
    text: |-
      Overtreding van bepalingen van een krachtens deze wet uitgevaardigde algemene maatregel van bestuur, voor zover
      uitdrukkelijk als strafbaar feit in de zin van dit artikel aangeduid, wordt gestraft met hechtenis van ten hoogste
      een maand of geldboete van de tweede categorie. Het feit wordt beschouwd als een overtreding.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel77
  - number: '79'
    text: |-
      Het recht op strafvordering vervalt indien de Sociale verzekeringsbank aan de nabestaande, het ouderloos kind of
      zijn wettelijke vertegenwoordiger, ter zake van hetzelfde feit reeds een boete heeft opgelegd.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel79
  - number: '103.1'
    text: |-
      De inwerkingtreding van deze wet leidt tot 1 januari 2000 niet tot wijziging van de in guldens uitgedrukte
      aanspraken, rechten en verplichtingen zoals die voor degenen die betrokken zijn bij een pensioenregeling van een
      pensioenfonds of van een werkgever luidden op de dag voor de datum van die inwerkingtreding.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel103
  - number: '103.2'
    text: |-
      Indien voor 1 januari 2000 een herziening van de pensioenregeling in verband met deze wet wordt overeengekomen of
      overeenstemming wordt bereikt over de handhaving van de voor de datum van inwerkingtreding van deze wet geldende
      regeling van het nabestaandenpensioen, kan de inwerkingtreding van deze wet vanaf dat tijdstip wel tot wijziging
      leiden van de in het eerste lid genoemde aanspraken, rechten en verplichtingen.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel103
  - number: '103.3'
    text: |-
      Het bepaalde in het eerste lid is niet van toepassing op de pensioenaanspraken van de nabestaanden van de militair,
      gewezen militair of gepensioneerde militair die is overleden tengevolge van verwonding, ziekten of gebreken, als
      bedoeld in [artikel E11 van de Algemene militaire pensioenwet](onbekend). Onze Minister van Defensie stelt in
      verband daarmee voor de in het eerste lid bedoelde periode en met inachtneming van het tweede lid bij ministeriële
      regeling nadere regels overeenkomstig de inbouw- en franchise bepalingen van die wet.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel103
  - number: '104'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel104
  - number: '105.1'
    text: De Algemene Weduwen- en Wezenwet wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel105
  - number: '105.2'
    text: |-
      De Algemene Weduwen- en Wezenwet en de daarop berustende bepalingen blijven van toepassing op de rechten,
      verplichtingen en bevoegdheden over de tijdvakken gelegen voor de dag waarop deze wet in werking treedt, voor zover
      in deze wet niet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel105
  - number: '106'
    text: |-
      Na de inwerkingtreding van deze wet berust de ministeriële regeling op grond van artikel 4 van de Algemene Weduwen-
      en Wezenwet op [artikel 8][ref1] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel8
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '8'
        hoofdstuk: '1'
  - number: '107'
    text: |-
      Deze wet treedt in werking op een bij of krachtens koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel107
  - number: '108'
    text: 'Deze wet wordt aangehaald als: Algemene nabestaandenwet.'
    url: https://wetten.overheid.nl/BWBR0007795/2004-03-01#Artikel108
