        bwb_id: BWBR0001854
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '37'
  - number: 1.o
    text: |-
      pensioengerechtigde leeftijd: de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: '2.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel2
  - number: 2.1.a
    text: |-
      bruto-minimumloon: het in [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref1]
      bedoelde bedrag;


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
  - number: 2.1.b
    text: |-
      netto-minimumloon: het bruto-minimumloon, na aftrek van premies volksverzekeringen
      en loonbelasting. De loonbelasting en premie voor de volksverzekeringen, bedoeld in
      [artikel 1 van de Wet financiering sociale verzekeringen][ref1], worden berekend voor een werknemerdie de
      pensioengerechtigde leeftijd nog niet heeft bereikt, rekening houdend met uitsluitend 192,5% van de algemene
      heffingskorting, bedoeld in [artikel 22 van de Wet op de loonbelasting 1964][ref2], over het bruto-minimumloon;


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel22
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '22'
  - number: 2.1.c
    text: |-
      bruto-minimumvakantiebijslag: het bedrag waarop degene die aanspraak heeft op het bruto-minimumloon ingevolge
      [artikel 15 van de Wet minimumloon en minimumvakantiebijslag][ref1] aanspraak heeft;


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '15'
  - number: 2.1.d
    text: |-
      netto-minimumvakantiebijslag: het verschil tussen het bedrag, dat zou zijn berekend voor een werknemerdie de
      pensioengerechtigde leeftijd nog niet heeft bereikt, indien onderdeel b wordt toegepast op het bruto-minimumloon
      verhoogd met de bruto-minimumvakantiebijslag, en het netto-minimumloon, bedoeld in onderdeel b.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel2
  - number: '2.2'
    text: |-
      Een herziening van een uitkering op grond van deze wet in verband met een wijziging van het netto-minimumloon vindt
      plaats zonder dat dit bij beschikking is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel2
  - number: '2.3'
    text: |-
      De Sociale verzekeringsbank betaalt de herziene uitkering, bedoeld in het tweede lid, bij de eerst volgende
      uitkeringsbetaling nadat de herziening, bedoeld in het tweede lid, heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel2
  - number: '2.4'
    text: |-
      Met ingang van 1 juli 2012 wordt het in het eerste lid, onderdeel b, genoemde percentage twee keer per
      kalenderjaar, op 1 januari en 1 juli, verlaagd met 2,5 procentpunt, tot het percentage van 100 is bereikt. Van het
      herziene percentage doet onze Minister mededeling in de Staatscourant. Dit lid vervalt met ingang van 1 januari
      2032.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel2
  - number: '3.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt gelijkgesteld met:'
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel3
  - number: 3.1.a
    text: 'echtgenoot: geregistreerde partner;'
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel3
  - number: 3.1.b
    text: 'huwelijk: geregistreerd partnerschap;'
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel3
  - number: 3.1.c
    text: 'gehuwd: als partner geregistreerd;'
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel3
  - number: 3.1.d
    text: 'de huwelijkssluiting: het aangaan van het geregistreerd partnerschap;'
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel3
  - number: 3.1.e
    text: 'in het huwelijk treedt: een geregistreerd partnerschap aangaat.'
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel3
  - number: '3.2'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt als gehuwd of als echtgenoot mede aangemerkt de ongehuwde
      meerderjarige die met een andere ongehuwde meerderjarige een gezamenlijke huishouding voert, tenzij het betreft een
      bloedverwant in de eerste graad. Voor de toepassing van de eerste volzin wordt mede als ongehuwd aangemerkt degene
      die duurzaam gescheiden leeft van de persoon met wie hij gehuwd is.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel3
  - number: '3.3'
    text: |-
      Van een gezamenlijke huishouding is sprake indien twee personen hun hoofdverblijf in dezelfde woning hebben en zij
      blijk geven zorg te dragen voor elkaar door middel van het leveren van een bijdrage in de kosten van de huishouding
      dan wel anderszins.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel3
  - number: '3.4'
    text: |-
      Een gezamenlijke huishouding wordt in ieder geval aanwezig geacht, indien de betrokkenen hun hoofdverblijf hebben
      in dezelfde woning en:
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel3
  - number: 3.4.a
    text: zij met elkaar gehuwd zijn geweest of eerder voor de toepassing van deze wet daarmee gelijk zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel3
  - number: 3.4.b
    text: uit hun relatie een kind is geboren of erkenning heeft plaatsgevonden van een kind van de een door de ander;
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel3
  - number: 3.4.c
    text: |-
      zij zich wederzijds verplicht hebben tot een bijdrage aan de huishouding krachtens een geldend
      samenlevingscontract; of
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel3
  - number: 3.4.d
    text: |-
      zij op grond van een registratie worden aangemerkt als een gezamenlijke huishouding die naar aard en strekking
      overeenkomt met de gezamenlijke huishouding bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel3
  - number: '3.5'
    text: |-
      Bij algemene maatregel van bestuur wordt vastgesteld welke registraties, en gedurende welk tijdvak, in aanmerking
      worden genomen voor de toepassing van het vierde lid, onderdeel d.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel3
  - number: '3.6'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van hetgeen wordt verstaan onder het
      blijk geven zorg te dragen voor een ander, als bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel3
  - number: '3.7'
    text: |-
      Onder bloedverwant in de eerste graad als bedoeld in het tweede lid, wordt mede verstaan een meerderjarig aangehuwd
      of voormalig pleegkind van de nabestaande of een meerderjarig eigen, aangehuwd of voormalig pleegkind van de
      overleden verzekerde of van de persoon die met de nabestaande een gezamenlijke huishouding voert.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel3
  - number: '3.8'
    text: |-
      Onder voormalig pleegkind als bedoeld in het zevende lid wordt verstaan een pleegkind waarvoor de nabestaande een
      pleegvergoeding ontving of ontvangt op grond van de [Wet op de jeugdzorg][ref1] of kinderbijslag ontving op grond
      van de [Algemene Kinderbijslagwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016637
      [ref2]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0016637
      - id: ref2
        bwb_id: BWBR0002368
  - number: '4.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt in afwijking van [artikel 3, tweede tot en met zesde lid][ref1]
      onder nabestaande mede verstaan de gewezen echtgenoot van een overleden verzekerde, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel3
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '3'
        hoofdstuk: '1'
  - number: 4.1.a
    text: het huwelijk anders dan door de dood is ontbonden; en
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel4
  - number: 4.1.b
    text: |-
      de overleden verzekerde onmiddellijk voorafgaand aan het overlijden verplicht is levensonderhoud te verschaffen aan
      de gewezen echtgenoot op grond van [Boek 1 van het Burgerlijk Wetboek][ref1] krachtens een rechterlijke uitspraak
      of overeenkomst, vastgelegd in:


      [ref1]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002656
  - number: 4.1.b.1°
    text: een notariële akte;
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel4
  - number: 4.1.b.2°
    text: een akte mede ondertekend door een advocaat;
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel4
  - number: 4.1.b.3°
    text: |-
      een akte waarvan door de gewezen echtgenoot aannemelijk wordt gemaakt dat die tot stand is gekomen door de inzet
      van een bij de echtscheiding betrokken advocaat; of
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel4
  - number: 4.1.b.4°
    text: |-
      een document opgesteld in overleg tussen de gewezen echtgenoot en de overleden verzekerde door tussenkomst van een
      bemiddelaar; en
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel4
  - number: 4.1.c
    text: |-
      de gewezen echtgenoot overeenkomstig de bepalingen in deze wet recht op nabestaandenuitkering zou hebben gehad,
      indien het overlijden plaats zou hebben gehad op de dag van ontbinding van het huwelijk anders dan door de dood.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel4
  - number: '4.2'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld voor het eerste lid, onderdeel b, bij ten vierde.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel4
  - number: '5.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt voor het recht op nabestaandenuitkering als kind aangemerkt,
      een eigen kind, aangehuwd kind of pleegkind in de zin van de [Algemene Kinderbijslagwet][ref1], dat geboren is voor
      of op de dag van overlijden van de verzekerde.


      [ref1]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002368
  - number: '5.2'
    text: |-
      Voor de toepassing van het eerste lid wordt een kind van wie een vrouw zwanger is op de dag van overlijden van haar
      echtgenoot, op die dag als reeds geboren aangemerkt.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel5
  - number: '5.3'
    text: |-
      In afwijking van het eerste lid wordt niet als kind van de nabestaande aangemerkt het kind over wie de nabestaande
      geen gezag heeft wegens ontzetting daarvan.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel5
  - number: '5.4'
    text: |-
      In afwijking van het eerste lid wordt slechts als pleegkind van de nabestaande aangemerkt het pleegkind voor wie de
      nabestaande ten tijde van het overlijden van de echtgenoot zorg droeg als ware hij ouder.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel5
  - number: '6'
    text: Ingezetene in de zin van deze wet is degene die in Nederland woont.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel6
  - number: '7.1'
    text: Waar iemand woont en waar een lichaam is gevestigd, wordt naar de omstandigheden beoordeeld.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel7
  - number: '7.2'
    text: |-
      Voor de toepassing van het eerste lid worden schepen die in Nederland hun thuishaven hebben, ten opzichte van de
      bemanning als deel van Nederland beschouwd.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel7
  - number: '7.3'
    text: |-
      Degene die Nederland metterwoon heeft verlaten en binnen een jaar nadien metterwoon terugkeert zonder inmiddels
      in Aruba, Curaçao, Sint Maarten, de openbare lichamen Bonaire, Sint Eustatius en Saba, of op het grondgebied van
      een andere mogendheid te hebben gewoond, wordt ook voor de duur van zijn afwezigheid geacht in Nederland te hebben
      gewoond.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel7
  - number: '8'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt met overlijden gelijkgesteld vermoedelijk overlijden. Bij
      ministeriële regeling wordt bepaald hoe het vermoedelijke overlijden en de dag waarop het overlijden geacht wordt
      te hebben plaatsgevonden, worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel8
  - number: '9'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt mede als ouderloos aangemerkt het kind over wie de overlevende
      ouder geen gezag heeft wegens ontzetting daarvan.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel9
  - number: '10.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder inkomen verstaan het inkomen van de nabestaande uit
      arbeid of overig inkomen.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel10
  - number: '10.2'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald wat onder inkomen uit arbeid of overig inkomen als bedoeld in het
      eerste lid wordt verstaan. Daarbij kan tevens worden bepaald dat nader te bepalen inkomen dat gedeeltelijk, niet,
      of niet langer wordt genoten als gevolg van gewijzigde omstandigheden of enig handelen of nalaten van betrokkene in
      aanmerking wordt genomen alsof het wel volledig wordt genoten.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel10
  - number: '11.1'
    text: |-
      Arbeidsongeschikt is degene die als rechtstreeks en objectief medisch vast te stellen gevolg van ziekte of
      gebreken niet in staat is om met arbeid 55% te verdienen van hetgeen gezonde personen met soortgelijke opleiding en
      ervaring, ter plaatse waar hij arbeid verricht of het laatst heeft verricht, of in de omgeving daarvan, met arbeid
      gewoonlijk verdienen.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel11
  - number: '11.2'
    text: |-
      In het eerste lid wordt onder de eerstgenoemde arbeid verstaan alle algemeen geaccepteerde arbeid waartoe die
      persoon met zijn krachten en bekwaamheden in staat is.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel11
  - number: '12'
    text: |-
      Bij een besluit ingevolge [artikel 49][ref1] is mede belanghebbende het Landelijk Bureau Inning
      Onderhoudsbijdragen.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel49
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '49'
        hoofdstuk: '3'
        afdeling: III
  - number: '13.1'
    text: Verzekerd overeenkomstig de bepalingen van deze wet is degene, die
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel13
  - number: 13.1.a
    text: ingezetene is;
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel13
  - number: 13.1.b
    text: |-
      geen ingezetene is, doch ter zake van in Nederland of op het continentaal plat in dienstbetrekking verrichte arbeid
      aan de loonbelasting is onderworpen.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel13
  - number: '13.2'
    text: |-
      Niet verzekerd is de vreemdeling die niet rechtmatig in Nederland verblijf houdt in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '13.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan, in afwijking van het eerste en tweede lid, uitbreiding dan wel
      beperking worden gegeven aan de kring van verzekerden.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel13
  - number: '13.4'
    text: |-
      Indien een verzekerde ophoudt ingezetene te zijn, eindigt zijn verzekering, behoudens voor de toepassing
      van de [Wet financiering sociale verzekeringen][ref1] en voor zover niet reeds op hem van toepassing is een
      overeenkomstige regeling van Aruba, Curaçao, Sint Maarten, de openbare lichamen Bonaire, Sint Eustatius en
      Saba, van een andere Mogendheid of een volkenrechtelijke organisatie, niet eerder dan zes weken na de dag,
      met ingang waarvan hij heeft opgehouden ingezetene te zijn. Op de termijn, gesteld in de eerste volzin, is de
      [Algemene Termijnenwet][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017745
      [ref2]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0017745
      - id: ref2
        bwb_id: BWBR0002448
  - number: '13.5'
    text: |-
      Bij een maatregel, als bedoeld in het derde lid, kan worden kan worden bepaald dat bij een niet rechtmatig verblijf
      in Nederland in de zin van [artikel 8, onder a tot en met e en l][ref1], verzekerd zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 13.5.a
    text: vreemdelingen die rechtmatig in Nederland arbeid verrichten, dan wel hebben verricht;
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel13
  - number: 13.5.b
    text: |-
      vreemdelingen die, na rechtmatig verblijf te hebben gehouden in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1], rechtmatig in Nederland verblijf hebben
      als bedoeld in [artikel 8, onder g of h, van de Vreemdelingenwet 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 13a
    text: |-
      Zo nodig in afwijking van [artikel 13][ref1] en de daarop berustende bepalingen:


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel13
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '13'
        hoofdstuk: '2'
  - number: 13a.a
    text: |-
      wordt als verzekerde aangemerkt de persoon van wie de verzekering op grond van deze wet voortvloeit uit de
      toepassing van bepalingen van een verdrag of van een besluit van een volkenrechtelijke organisatie;
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel13a
  - number: 13a.b
    text: |-
      wordt niet als verzekerde aangemerkt de persoon op wie op grond van een verdrag of een besluit van een
      volkenrechtelijke organisatie de wetgeving van een andere mogendheid van toepassing is.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel13a
  - number: '14.1'
    text: 'Recht op nabestaandenuitkering heeft de nabestaande die:'
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel14
  - number: 14.1.a
    text: een ongehuwd kind heeft, dat jonger is dan 18 jaar en niet tot het huishouden van een ander behoort; of
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel14
  - number: 14.1.b
    text: arbeidsongeschikt is
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel14
  - number: 14.1.b.1°
    text: op en sedert de dag van overlijden van de verzekerde, of
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel14
  - number: 14.1.b.2°
    text: |-
      op en sedert de laatste dag van de maand waarin hij niet meer voldoet aan de voorwaarde bedoeld in onderdeel
      *a*, en wiens arbeidsongeschiktheid na de onderscheidenlijk onder 1° en 2° bedoelde dag ten minste drie maanden
      voortduurt, dan wel ten aanzien van wie aannemelijk is dat de arbeidsongeschiktheid tenminste drie maanden na de
      vorenbedoelde dag zal voortduren; of
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel14
  - number: 14.1.c
    text: geboren is voor 1 januari 1950.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel14
  - number: '14.2'
    text: Het recht op nabestaandenuitkering gaat in op de eerste dag van de maand van overlijden van de verzekerde.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel14
  - number: '14.3'
    text: |-
      Voor de nabestaande die op de dag van overlijden van de verzekerde niet voldoet aan de voorwaarde, genoemd in het
      eerste lid, onderdeel *a*, omdat het kind op het moment van overlijden tot het huishouden van een ander behoort,
      gaat het recht op nabestaandenuitkering in op de eerste dag van de maand waarin hij als gevolg van het overlijden
      wel aan die voorwaarde voldoet.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel14
  - number: '14.4'
    text: |-
      Voor de nabestaande die geen recht heeft op een nabestaandenuitkering op grond van
      [artikel 15, eerste lid, onderdeel d][ref1], gaat het recht op een nabestaandenuitkering in op de eerste dag van de
      maand dat hij, uiterlijk binnen zes maanden na het overlijden van de verzekerde, deze gezamenlijke huishouding niet
      meer voert.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel15
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: I
  - number: '14.5'
    text: |-
      De Sociale verzekeringsbank kan, in afwijking van het vierde lid, een langere termijn vaststellen indien de
      toepassing wat de termijn van zes maanden betreft, zal leiden tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel14
  - number: '15.1'
    text: 'Geen recht op nabestaandenuitkering heeft de nabestaande:'
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel15
  - number: 15.1.a
    text: |-
      wiens echtgenoot is overleden binnen een jaar, nadat hij met die echtgenoot is gehuwd en de gezondheidstoestand ten
      tijde van de huwelijkssluiting zulks redelijkerwijs moest doen verwachten; of
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel15
  - number: 15.1.b
    text: |-
      indien de echtgenoot binnen een jaar na aanvang van zijn verzekering is overleden en de gezondheidstoestand ten
      tijde van de aanvang van de verzekering zulks redelijkerwijs moest doen verwachten; of
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel15
  - number: 15.1.c
    text: indien de echtgenoot door de nabestaande of met zijn medeplichtigheid opzettelijk van het leven is beroofd.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel15
  - number: 15.1.d
    text: |-
      die een gezamenlijke huishouding voert, tenzij het betreft een gezamenlijke huishouding ten behoeve van de
      verzorging van een hulpbehoevende;
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel15
  - number: 15.1.e
    text: |-
      die al recht op een nabestaandenuitkering op grond van deze wet heeft en die nadien wederom nabestaande is geworden
      als gevolg van het overlijden van de hulpbehoevende met wie hij een gezamenlijke huishouding voerde ten behoeve van
      de verzorging van die hulpbehoevende.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel15
  - number: '15.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen ten aanzien van de gevallen waarin de overledene op grond van de algemene
      maatregel van bestuur, bedoeld in [artikel 13, tweede lid][ref1], of bij of krachtens een overeenkomst of een
      regeling inzake sociale zekerheid, die tussen Nederland en een of meer mogendheden van kracht is, ingevolge deze
      wet nimmer of nog geen jaar verzekerd is geweest, regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel13
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '13'
        hoofdstuk: '2'
  - number: '15.3'
    text: |-
      Geen recht op nabestaandenuitkering ontstaat, indien de echtgenoot overlijdt op of na de dag waarop de nabestaande
      de pensioengerechtigde leeftijd bereikt.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel15
  - number: '15.4'
    text: |-
      De onderdelen *a* en *b* van het eerste lid zijn niet van toepassing indien de nabestaande, zo hij niet opnieuw zou
      zijn gehuwd, recht op nabestaandenuitkering zou hebben gehad.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel15
  - number: '16.1'
    text: 'Het recht op nabestaandenuitkering eindigt, indien:'
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel16
  - number: 16.1.a
    text: |-
      niet langer aan de voorwaarden van [artikel 14, eerste lid, onderdelen a en b][ref1], wordt voldaan, tenzij de
      nabestaande is geboren voor 1 januari 1950; of


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel14
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: I
  - number: 16.1.b
    text: |-
      de nabestaande in het huwelijk treedt dan wel een gezamenlijke huishouding gaat voeren anders dan ten behoeve van
      de verzorging van een hulpbehoevende; of
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel16
  - number: 16.1.c
    text: de nabestaande de pensioengerechtigde leeftijd bereikt.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel16
  - number: '16.2'
    text: |-
      Het recht op uitkering eindigt met ingang van de eerste dag van de maand volgend op die waarin de in het
      eerste lid genoemde omstandigheden zich voordoen, maar in geval van onderdeel c met ingang van de dag waarop de
      pensioengerechtigde leeftijd wordt bereikt.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel16
  - number: '16.3'
    text: |-
      Voor de nabestaande wiens uitkering op grond van het eerste lid, onderdeel b, wegens het voeren van een
      gezamenlijke huishouding is geëindigd herleeft het recht op een nabestaandenuitkering met ingang van de eerste dag
      van de maand dat hij, uiterlijk binnen zes maanden na het eindigen van de nabestaandenuitkering, deze gezamenlijke
      huishouding niet meer voert.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel16
  - number: '16.4'
    text: |-
      De Sociale verzekeringsbank kan, in afwijking van het derde lid, een langere termijn vaststellen indien de
      toepassing wat de termijn van zes maanden betreft, zal leiden tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel16
  - number: '17.1'
    text: |-
      De bruto-nabestaandenuitkering wordt op een zodanig bedrag vastgesteld, dat nadat de over dat bedrag in
      te houden loonbelasting en premie voor de volksverzekeringen voor een persoon die de pensioengerechtigde
      leeftijd nog niet heeft bereikt, rekening houdend met uitsluitend de algemene heffingskorting, bedoeld in
      [artikel 22 van de Wet op de loonbelasting 1964][ref1], is afgetrokken, de netto-nabestaandenuitkering gelijk is
      aan 70% van het netto-minimumloon.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel22
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '22'
  - number: '17.2'
    text: |-
      In afwijking van het eerste lid wordt de bruto-nabestaandenuitkering van de nabestaande, zolang hij een
      gezamenlijke huishouding ten behoeve van de verzorging van een hulpbehoevende voert, op een zodanig bedrag
      vastgesteld, dat nadat de over dat bedrag in te houden loonbelasting en premie voor de volksverzekeringen voor een
      persoon die de pensioengerechtigde leeftijd nog niet heeft bereikt, rekening houdend met uitsluitend de algemene
      heffingskorting, bedoeld in [artikel 22 van de Wet op de loonbelasting 1964][ref1], is afgetrokken, de netto-
      nabestaandenuitkering gelijk is aan 50% van het netto-minimumloon.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel22
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '22'
  - number: '17.3'
    text: |-
      De bruto-nabestaandenuitkering bedraagt voor een nabestaande die woont buiten Nederland, een van de andere
      lidstaten van de Europese Unie, een andere staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte en Zwitserland, een bij ministeriële regeling vastgesteld percentage van het op grond van het
      eerste of tweede lid vastgestelde bedrag. Het percentage wordt zo bepaald dat het een weergave is van de verhouding
      tussen het kostenniveau van het land waar de nabestaande woonachtig is en dat van Nederland. Het percentage
      bedraagt maximaal 100.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel17
  - number: '17.4'
    text: |-
      De bruto-nabestaandenuitkering van de nabestaande bedoeld in [artikel 4][ref1] is niet hoger dan de door de
      overleden verzekerde aan de nabestaande verschuldigde uitkering tot levensonderhoud van de nabestaande.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel4
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '4'
        hoofdstuk: '1'
  - number: '18.1'
    text: Op de nabestaandenuitkering wordt inkomen in mindering gebracht.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel18
  - number: '18.2'
    text: 'In afwijking van het eerste lid wordt van het inkomen uit arbeid buiten aanmerking gelaten:'
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel18
  - number: 18.2.a
    text: een bedrag gelijk aan 50% van het bruto-minimumloon, alsmede
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel18
  - number: 18.2.b
    text: |-
      voor zover het inkomen uit arbeid meer bedraagt dan het in onderdeel a bedoelde bedrag, een derde gedeelte van
      dat meerdere.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel18
  - number: '18.3'
    text: |-
      In afwijking van het tweede lid wordt in de maand waarin de nabestaande de pensioengerechtigde leeftijd heeft
      bereikt, het bruto-minimumloon, bedoeld in het tweede lid, onderdeel a, vermenigvuldigd met de factor X/Y, waarbij:
        - X staat voor het aantal dagen gelegen in de maand waarin de nabestaande de pensioengerechtigde leeftijd bereikt,
      voordat de nabestaande deze leeftijd heeft bereikt, en
        - Y staat voor het aantal dagen van de maand waarin de nabestaande de pensioengerechtigde leeftijd heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel18
  - number: '18.3'
    text: |-
      Voor een nabestaande die woont buiten Nederland, een van de andere lidstaten van de Europese Unie, een andere staat
      die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte en Zwitserland, wordt, in afwijking
      van het tweede lid, een bij ministeriële regeling vastgesteld percentage van het op grond van dat lid vastgestelde
      bedrag buiten aanmerking gelaten. Het percentage wordt zo bepaald dat het een weergave is van de verhouding tussen
      het kostenniveau van het land waar de nabestaande woonachtig is en dat van Nederland. Het percentage bedraagt
      maximaal 100.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel18
  - number: '19'
    text: |-
      De nabestaandenuitkering wordt bij wijziging van het inkomen herzien. Deze herziening gaat in op de eerste dag van
      de maand waarin die wijziging zich voordoet.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel19
  - number: '20'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld voor samenloop van uitkering ingevolge deze wet
      met uitkering aan nagelaten betrekkingen ingevolge de wetgeving van Aruba, Curaçao, Sint Maarten, de wetgeving van
      Nederland ten behoeve van de openbare lichamen Bonaire, Sint Eustatius en Saba, van een andere mogendheid of van
      een volkenrechtelijke organisatie.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel20
  - number: '21.1'
    text: |-
      Indien in een pensioenregeling van een pensioenfonds of van een werkgever bepalingen zijn of worden opgenomen
      krachtens welke op enigerlei wijze geheel of gedeeltelijk met een uitkering ingevolge dit hoofdstuk rekening wordt
      gehouden, dient bij de toepassing van deze bepalingen in acht te worden genomen, dat een verhoging van de uitkering
      ingevolge deze wet als gevolg van de [artikelen 17][ref1], [25][ref2] en [29][ref3], welke plaatsvindt na ingang
      van een pensioen of na het verkrijgen van een recht op uitgesteld pensioen, buiten beschouwing blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0007795#Artikel29
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0007795
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '6'
        afdeling: I
  - number: '21.2'
    text: |-
      Het eerste lid is niet van toepassing op pensioenregelingen waarin bepalingen zijn opgenomen volgens welke een
      uitkering ingevolge deze wet en de premievrije aanspraken of het pensioen van die regeling tezamen na beëindiging
      van de actieve deelneming jaarlijks ten minste worden verhoogd met het percentage van de in het eerste lid bedoelde
      verhoging van de uitkering of het percentage van de loon- of prijsontwikkeling.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel21
  - number: '22.1'
    text: |-
      Recht op halfwezenuitkering heeft de nabestaande die een halfwees heeft, jonger dan 18 jaar, die niet tot het
      huishouden van een ander behoort.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel22
  - number: '22.2'
    text: |-
      Voor de toepassing van deze paragraaf en paragraaf 4 van deze afdeling alsmede van de [afdelingen II][ref1] en
      [III van dit hoofdstuk][ref2] wordt, in afwijking van [hoofdstuk 1][ref3], onder nabestaande verstaan: de ouder van
      een halfwees of de persoon die als ware hij ouder zorg draagt voor een halfwees, die tot zijn huishouden behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0007795#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0007795
        hoofdstuk: '3'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0007795
        hoofdstuk: '3'
        afdeling: III
      - id: ref3
        bwb_id: BWBR0007795
        hoofdstuk: '1'
  - number: '22.3'
    text: |-
      Het recht op halfwezenuitkering gaat in op de eerste dag van de maand waarin aan de voorwaarden, bedoeld in het
      eerste en tweede lid, wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel22
  - number: '22.4'
    text: |-
      Ten aanzien van het overlijden van een van beide ouders van een of meer kinderen, bestaat per huishouding slechts
      recht op één halfwezenuitkering ten aanzien van dit kind of deze kinderen voor één nabestaande. In geval sprake is
      van meer dan een nabestaande binnen één huishouding, die een aanvraag doen voor een halfwezenuitkering ten aanzien
      van dit kind of deze kinderen, bepaalt de Sociale verzekeringsbank welke nabestaande in aanmerking komt voor het
      recht op halfwezenuitkering.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel22
  - number: '23.1'
    text: 'Geen recht op halfwezenuitkering bestaat, indien:'
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel23
  - number: 23.1.a
    text: |-
      de verzekerde binnen een jaar na aanvang van zijn verzekering is overleden en de gezondheidstoestand ten tijde van
      de aanvang van de verzekering zulks redelijkerwijs moest doen verwachten; of
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel23
  - number: 23.1.b
    text: de verzekerde door de nabestaande of met zijn medeplichtigheid opzettelijk van het leven is beroofd.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel23
  - number: '23.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen ten aanzien van de gevallen waarin de overledene op grond van de algemene
      maatregel van bestuur bedoeld in [artikel 13, tweede lid][ref1], of bij of krachtens een overeenkomst of een
      regeling inzake sociale zekerheid, die tussen Nederland en een of meer mogendheden van kracht is, ingevolge deze
      wet nimmer of nog geen jaar verzekerd is geweest, regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel13
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '13'
        hoofdstuk: '2'
  - number: '24.1'
    text: 'Het recht op halfwezenuitkering eindigt met ingang van de eerste dag van de maand volgend op die:'
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel24
  - number: 24.1.a
    text: |-
      **waarin niet langer aan de voorwaarden voor het verkrijgen van een halfwezenuitkering, bedoeld in
      [artikel 22, eerste en tweede lid][ref1], wordt voldaan; of


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel22
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '22'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: I
  - number: 24.1.b
    text: '**waarin de halfwees de leeftijd van 18 jaar bereikt.'
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel24
  - number: '24.2'
    text: |-
      Het recht op halfwezenuitkering eindigt met ingang van de dag waarop de nabestaande
      een bruto-ouderdomspensioen voor de ongehuwde pensioengerechtigde als bedoeld in
      [artikel 9, eerste lid, onderdeel c, van de Algemene Ouderdomswet][ref1] ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
  - number: '24.3'
    text: |-
      Het recht op halfwezenuitkering eindigt, wanneer de halfwees wordt geadopteerd door de echtgenoot van de ouder met
      ingang van de dag, waarop de uitspraak in kracht van gewijsde is gegaan.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel24
  - number: '25.1'
    text: |-
      De bruto-halfwezenuitkering wordt op een zodanig bedrag vastgesteld, dat nadat de over dat bedrag in te
      houden loonbelasting en premie voor de volksverzekeringen voor een persoon die de pensioengerechtigde
      leeftijd nog niet heeft bereikt, rekening houdend met uitsluitend de algemene heffingskorting, bedoeld
      in [artikel 22 van de Wet op de loonbelasting 1964][ref1], en de alleenstaande-ouderkorting, bedoeld in
      [artikel 8.15 van de Wet inkomstenbelasting 2001][ref2], is afgetrokken, de netto-halfwezenuitkering gelijk is aan
      20% van het netto-minimumloon.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '8'
  - number: '25.2'
    text: |-
      De bruto-halfwezenuitkering ten behoeve van een halfwees die woont buiten Nederland, een van de andere lidstaten
      van de Europese Unie, een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte
      en Zwitserland, bedraagt een bij ministeriële regeling vastgesteld percentage van het op grond van het eerste
      lid vastgestelde bedrag. Het percentage wordt zo bepaald dat het een weergave is van de verhouding tussen het
      kostenniveau van het land waar de halfwees woonachtig is en dat van Nederland. Het percentage bedraagt maximaal
      100.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel25
  - number: '25.3'
    text: |-
      Indien een nabestaande recht heeft op een halfwezenuitkering ten aanzien van het overlijden van een van beide
      ouders ten behoeve van twee of meer kinderen waarvan er ten minste een woonachtig is in Nederland, een van
      de andere lidstaten van de Europese Unie, een andere staat die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte of Zwitserland, bedraagt de bruto-halfwezenuitkering het op grond van het eerste lid
      vastgestelde bedrag.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel25
  - number: '25.4'
    text: |-
      Indien een nabestaande recht heeft op een halfwezenuitkering ten aanzien van het overlijden van een van beide
      ouders ten behoeve van twee of meer kinderen die woonachtig zijn in verschillende landen, waarvoor op grond van het
      tweede lid percentages zijn vastgesteld bij ministeriële regeling, bedraagt de bruto-halfwezenuitkering het hoogste
      van die vastgestelde percentages van het op grond van het eerste lid vastgestelde bedrag.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel25
  - number: '25.5'
    text: |-
      Op de halfwezenuitkering ten behoeve van de halfwees, bedoeld in
      [artikel 1, aanhef en onderdeel e, onder 2°][ref1], wordt de financiële bijdrage die de overlevende ouder
      betaalt of op grond van een rechterlijke uitspraak in verband met zijn onderhoudsplicht als bedoeld in
      [Boek 1 van het Burgerlijk Wetboek][ref2] dient te betalen in mindering gebracht. De Sociale verzekeringsbank kan
      hiertoe zelf een onderzoek instellen. Indien de toepassing van de eerste zin tot een onbillijkheid van overwegende
      aard leidt kan de Sociale verzekeringsbank hiervan afzien.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0002656
  - number: '26.1'
    text: |-
      Recht op een wezenuitkering heeft een kind dat door het overlijden van een verzekerde ouderloos is geworden, zolang
      het de leeftijd van 16 jaar nog niet heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel26
  - number: '26.2'
    text: |-
      Voor de toepassing van het eerste lid wordt met een kind dat de leeftijd van 16 jaar nog niet heeft bereikt
      gelijkgesteld:
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel26
  - number: 26.2.a
    text: |-
      een kind van 16 of 17 jaar ten aanzien van wie is voldaan aan de verplichtingen, bedoeld in de
      [artikelen 2, eerste lid][ref1], en [4a, eerste lid, van de Leerplichtwet 1969][ref2], dan wel een van de
      vrijstellingen van die verplichtingen op grond van [die wet][ref3] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: 4a
      - id: ref3
        bwb_id: BWBR0002628
  - number: 26.2.b
    text: |-
      een kind van 16 of 17 jaar dat na het behalen van een startkwalificatie als bedoeld in
      [artikel 1, onderdeel f, van de Leerplichtwet 1969][ref1] op lichamelijke of psychische gronden niet geschikt is om
      tot een school onderscheidenlijk een instelling te worden toegelaten dan wel een vervolgstudie volgt;


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '1'
  - number: 26.2.c
    text: |-
      een kind van 18 jaar of ouder, doch jonger dan 21 jaar, dat als leerling of deelnemer staat ingeschreven bij een
      school of instelling als bedoeld in [artikel 4a van de Leerplichtwet 1969][ref1] en deze geregeld bezoekt of een
      vervolgstudie volgt;


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel4a
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: 4a
  - number: 26.2.d
    text: |-
      een ongehuwd kind van 16 jaar of ouder, doch jonger dan 21 jaar, dat een startkwalificatie als bedoeld in
      [artikel 1, onderdeel f, van de Leerplichtwet 1969][ref1] heeft behaald dan wel op wie een van de vrijstellingen
      als bedoeld in onderdeel a van toepassing zijn geweest of zouden zijn geweest en wiens voor werkzaamheden
      beschikbare tijd grotendeels in beslag wordt genomen door het verzorgen van zijn huishouden, waartoe overigens ten
      minste een kind dat recht heeft op wezenuitkering, behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '1'
  - number: '26.3'
    text: |-
      Voor de toepassing van het tweede lid, onderdeel d, wordt mede als ongehuwd aangemerkt het kind dat een
      gezamenlijke huishouding voert met een hulpbehoevende indien de overledene voor diens overlijden een huishouden
      met de hulpbehoevende is gaan voeren met het doel de hulpbehoevende te gaan verzorgen of indien het kind na het
      overlijden van de verzekerde een huishouding is gaan voeren met een hulpbehoevende met het doel de hulpbehoevende
      te gaan verzorgen.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel26
  - number: '26.4'
    text: |-
      Het recht op wezenuitkering gaat in op de eerste dag van de maand waarin het kind ouderloos is geworden en aan de
      voorwaarden, bedoeld in het tweede lid, wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel26
  - number: '26.5'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel26
  - number: 26a
    text: |-
      [Artikel 26][ref1], zoals dat artikel luidde op de dag voorafgaande aan de inwerkingtreding van artikel
      III, onderdeel B, de Wet van 4 februari 2010 tot wijziging van de Algemene Kinderbijslagwet en de Algemene
      nabestaandenwet in verband met aanpassing aan de invoering van een kwalificatieplicht in de Leerplichtwet 1969 en
      het aanbrengen van een aantal vereenvoudigingen in de Algemene Kinderbijslagwet alsmede enkele andere aanpassingen
      van die wet (Stb. 74) blijft van toepassing op het kind, dat voor 1 oktober 2009 de leeftijd van 16 jaar heeft
      bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel26
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: I
  - number: '27.1'
    text: 'Geen recht op wezenuitkering bestaat, indien:'
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel27
  - number: 27.1.a
    text: |-
      de verzekerde binnen een jaar na aanvang van zijn verzekering is overleden en de gezondheidstoestand ten tijde van
      de aanvang van de verzekering zulks redelijkerwijs moest doen verwachten; of
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel27
  - number: 27.1.b
    text: de verzekerde door het ouderloos kind of met zijn medeplichtigheid opzettelijk van het leven is beroofd.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel27
  - number: '27.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen ten aanzien van de gevallen waarin de overledene op grond van de algemene
      maatregel van bestuur, bedoeld in [artikel 13, tweede lid][ref1], of bij of krachtens een overeenkomst of een
      regeling inzake sociale zekerheid, die tussen Nederland en een of meer mogendheden van kracht is, ingevolge deze
      wet nimmer of nog geen jaar verzekerd is geweest, regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel13
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '13'
        hoofdstuk: '2'
  - number: '28.1'
    text: |-
      Het recht op wezenuitkering eindigt met ingang van de eerste dag van de maand volgend op die waarin niet langer
      aan de voorwaarden voor het verkrijgen van een wezenuitkering, bedoeld in [artikel 26, eerste en tweede lid][ref1],
      wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel26
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: I
  - number: '28.2'
    text: |-
      Het recht op wezenuitkering herleeft met ingang van de eerste dag van de maand, waarin het kind weer aan de
      voorwaarden voor het verkrijgen van een wezenuitkering voldoet.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel28
  - number: '28.3'
    text: 'Een kind wordt niet langer als ouderloos aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel28
  - number: 28.3.a
    text: in geval van erkenning van het kind; of
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel28
  - number: 28.3.b
    text: wanneer het wordt geadopteerd met ingang van de dag, waarop de uitspraak in kracht van gewijsde is gegaan.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel28
  - number: '28.4'
    text: |-
      Ontkenning van het door erkenning ontstane vaderschap doet het recht op wezenuitkering, zo dit nog zou hebben
      bestaan indien geen erkenning had plaatsgevonden, herleven met ingang van de dag, waarop de beschikking waarbij de
      ontkenning is uitgesproken in kracht van gewijsde is gegaan.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel28
  - number: '28.5'
    text: |-
      Herroeping van adoptie als bedoeld in het derde lid, onderdeel *b*, doet het recht, zo dit nog zou hebben bestaan,
      indien geen adoptie zou hebben plaatsgevonden, herleven met ingang van de dag, waarop de uitspraak in kracht van
      gewijsde is gegaan.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel28
  - number: '29.1'
    text: |-
      De bruto-wezenuitkering is gelijk aan een percentage van het bruto-bedrag behorend bij de nabestaandenuitkering
      bedoeld in [artikel 17, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel17
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: I
  - number: '29.2'
    text: Het in het eerste lid bedoelde percentage bedraagt voor een kind dat op de eerste dag van een kalendermaand
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel29
  - number: 29.2.a
    text: 'jonger is dan 10 jaar: 32,'
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel29
  - number: 29.2.b
    text: '10 jaar of ouder doch jonger dan 16 jaar is: 48, en'
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel29
  - number: 29.2.c
    text: '16 jaar of ouder doch jonger dan 21 jaar is: 64.'
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel29
  - number: '29.3'
    text: |-
      De bruto-wezenuitkering bedraagt voor een kind dat woont buiten Nederland, een van de andere lidstaten van de
      Europese Unie, een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte
      en Zwitserland, een bij ministeriële regeling vastgesteld percentage van het op grond van het eerste en tweede
      lid vastgestelde bedrag. Het percentage wordt zo bepaald dat het een weergave is van de verhouding tussen het
      kostenniveau van het land waar het kind woonachtig is en dat van Nederland. Het percentage bedraagt maximaal 100.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel29
  - number: 29a.1
    text: Degene die een nabestaandenuitkering ontvangt, heeft tevens recht op een tegemoetkoming.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel29a
  - number: 29a.2
    text: |-
      Degene die een halfwezenuitkering ontvangt en geen nabestaandenuitkering ontvangt als bedoeld in het eerste lid,
      heeft tevens recht op een tegemoetkoming.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel29a
  - number: 29a.3
    text: Degene die een wezenuitkering ontvangt, heeft tevens recht op een tegemoetkoming.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel29a
  - number: 29a.4
    text: |-
      De tegemoetkoming, bedoeld in het eerste tot en met derde lid, wordt niet beschouwd als een nabestaandenuitkering,
      halfwezenuitkering of wezenuitkering op grond van deze wet, behoudens voor de toepassing van
      [afdeling II van hoofdstuk 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0007795
        hoofdstuk: '3'
        afdeling: II
  - number: 29a.5
    text: |-
      Geen recht op een tegemoetkoming als bedoeld in het tweede lid bestaat voor een ongehuwde
      pensioengerechtigde als bedoeld in [artikel 9, eerste lid, onderdeel a, van de Algemene Ouderdomswet][ref1]
      die recht heeft op een tegemoetkoming als bedoeld in
      [artikel 3 van de Wet mogelijkheid koopkrachttegemoetkoming oudere belastingplichtigen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0029984#Artikel3
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0029984
        artikel: '3'
  - number: 29a.6
    text: |-
      [Artikel 2, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel2
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '2'
        hoofdstuk: '1'
  - number: 29a.7
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de hoogte, de indexering en de wijze
      van betaling van de tegemoetkoming.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel29a
  - number: 29a.8
    text: |-
      De tegemoetkoming bedraagt indien de nabestaande, de halfwees ten behoeve van wie de tegemoetkoming wordt
      ontvangen of de wees woont buiten Nederland, een van de andere lidstaten van de Europese Unie, een andere staat
      die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte en Zwitserland, een bij ministeriële
      regeling vastgesteld percentage van het op grond van het eerste tot en met zevende lid vastgestelde bedrag. Het
      percentage wordt zo bepaald dat het een weergave is van de verhouding tussen het kostenniveau van het land waar de
      nabestaande, de halfwees of wees woonachtig is en dat van Nederland. Het percentage bedraagt maximaal 100.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel29a
  - number: 29a.9
    text: De tegemoetkoming is niet vatbaar voor beslag.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel29a
  - number: '30'
    text: |-
      Recht op vakantie-uitkering over een maand heeft degene die over die maand recht heeft op een
      nabestaandenuitkering, op een halfwezenuitkering of op een wezenuitkering.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel30
  - number: '31.1'
    text: |-
      De bruto-vakantie-uitkering over de nabestaandenuitkering wordt zodanig vastgesteld, dat de netto-vakantie-
      uitkering over de nabestaandenuitkering gelijk is aan 70% van de netto-minimum-vakantiebijslag per maand.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel31
  - number: '31.2'
    text: |-
      De bruto-vakantie-uitkering over de halfwezenuitkering wordt zodanig vastgesteld dat de netto-vakantie-uitkering
      over de halfwezenuitkering gelijk is aan 20% van de netto-minimumvakantiebijslag per maand.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel31
  - number: '31.3'
    text: |-
      De bruto-vakantie-uitkering over de wezenuitkering bedraagt een bepaald percentage van bruto-bedragen vastgesteld
      op grond van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel31
  - number: '31.4'
    text: |-
      Voor de vaststelling van het in het derde lid bedoelde percentage is [artikel 29, tweede lid][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel29
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '6'
        afdeling: I
  - number: '32.1'
    text: |-
      Indien de nabestaandenuitkering met toepassing van [artikel 17, tweede, derde of vierde lid][ref1], [18][ref2] of
      [67][ref3] wordt verminderd dan wel anderszins op een lager bedrag wordt vastgesteld dan het bedrag, bedoeld in
      [artikel 17, eerste lid][ref4], wordt op de vakantie-uitkering een evenredige vermindering toegepast dan wel de
      vakantie-uitkering evenredig verlaagd.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0007795#Artikel67
      [ref4]: https://wetten.overheid.nl/BWBR0007795#Artikel17
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0007795
        artikel: '67'
        hoofdstuk: '8'
      - id: ref4
        bwb_id: BWBR0007795
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: I
  - number: '32.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld voor de berekening van de vakantie-uitkering van
      degene, wiens uitkering met toepassing van [artikel 20][ref1] is verminderd en die naast de uitkering ingevolge de
      wetgeving van een andere mogendheid geen recht heeft op een vakantie-uitkering ingevolge die wetgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel20
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: I
  - number: '32.3'
    text: |-
      Indien de halfwezenuitkering met toepassing van [artikel 25, tweede of vierde lid][ref1], op een lager bedrag wordt
      vastgesteld dan het bedrag, bedoeld in artikel 25, eerste lid, wordt de vakantie-uitkering evenredig verlaagd.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel25
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: I
  - number: '32.4'
    text: |-
      Indien de wezenuitkering met toepassing van [artikel 29, derde lid][ref1], op een lager bedrag wordt vastgesteld
      dan het bedrag, bedoeld in artikel 29, eerste en tweede lid, wordt de vakantie-uitkering evenredig verlaagd.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel29
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '6'
        afdeling: I
  - number: 32a.1
    text: |-
      Geen recht op nabestaandenuitkering ontstaat voor de nabestaande indien hij op de dag van het overlijden van de
      verzekerde niet in Nederland woont. Geen recht op halfwezenuitkering ontstaat voor de nabestaande indien hij of
      de halfwees op de dag van het overlijden van de verzekerde niet in Nederland woont. Geen recht op wezenuitkering
      ontstaat voor het kind indien het op de dag van het overlijden van de verzekerde niet in Nederland woont.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel32a
  - number: 32a.2
    text: |-
      Het eerste lid is niet van toepassing indien de nabestaande, de nabestaande of de halfwees onderscheidenlijk
      het kind op de dag van het overlijden van de verzekerde woont in een land waarin op grond van een verdrag of een
      besluit van een volkenrechtelijke organisatie recht op nabestaandenuitkering, halfwezenuitkering onderscheidenlijk
      wezenuitkering kan bestaan.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel32a
  - number: 32a.3
    text: |-
      Voor de persoon, bedoeld in het eerste lid, ontstaat, onverminderd [artikel 15][ref1], [23][ref2] of [27][ref3],
      recht op nabestaandenuitkering, halfwezenuitkering of wezenuitkering vanaf de dag dat:


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0007795#Artikel27
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0007795
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: I
  - number: 32a.3.a
    text: |-
      de nabestaande in Nederland woont en hij voldoet aan een voorwaarde als bedoeld in [artikel 14, eerste lid][ref1],
      of de voorwaarden bedoeld in [artikel 66a, tweede lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel66a
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0007795
        artikel: 66a
        hoofdstuk: '8'
  - number: 32a.3.b
    text: |-
      de nabestaande en de halfwees in Nederland wonen en de nabestaande voldoet aan de voorwaarden, bedoeld in
      [artikel 22, eerste en tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel22
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '22'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: I
  - number: 32a.3.c
    text: |-
      het kind in Nederland woont en het voldoet aan een voorwaarde als bedoeld in
      [artikel 26, eerste en tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel26
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: I
  - number: 32a.4
    text: |-
      Het derde lid is van overeenkomstige toepassing, indien de nabestaande, de nabestaande en de halfwees
      onderscheidenlijk het kind niet in Nederland wonen, vanaf de dag dat betrokkene in een land woont waarmee een
      verdrag in werking is getreden dan wel een besluit van een volkenrechtelijke organisatie van kracht is geworden, op
      grond waarvan recht op nabestaandenuitkering, halfwezenuitkering onderscheidenlijk wezenuitkering kan bestaan.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel32a
  - number: 32a.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat recht op nabestaandenuitkering,
      halfwezenuitkering of wezenuitkering ontstaat voor:
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel32a
  - number: 32a.5.a
    text: |-
      de nabestaande of het kind, indien de nabestaande, de halfwees of het kind werkzaamheden verricht in het algemeen
      belang en niet in Nederland woont;
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel32a
  - number: 32a.5.b
    text: |-
      de nabestaande of het kind, indien de nabestaande, de halfwees of het kind in Aruba, Curaçao, Sint Maarten of de
      openbare lichamen Bonaire, Sint Eustatius en Saba woont; of
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel32a
  - number: 32a.5.c
    text: de gezinsleden van de in de onderdelen a of b bedoelde nabestaande of het kind.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel32a
  - number: 32a.6
    text: |-
      Onze Minister deelt mede in welke landen op grond van een verdrag of een besluit van een volkenrechtelijke
      organisatie recht op nabestaandenuitkering, halfwezenuitkering dan wel wezenuitkering kan bestaan. In deze
      mededeling wordt tevens opgenomen:
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel32a
  - number: 32a.6.a
    text: de vindplaats van het desbetreffende verdrag of besluit, en
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel32a
  - number: 32a.6.b
    text: de eventueel in dat verdrag of besluit aanwezige beperkingen.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel32a
  - number: 32b.1
    text: |-
      Het recht op nabestaandenuitkering eindigt op de eerste dag dat de nabestaande niet in Nederland woont. Het recht
      op halfwezenuitkering eindigt op de eerste dag dat de nabestaande of de halfwees niet in Nederland woont. Het recht
      op wezenuitkering eindigt op de eerste dag dat het kind niet in Nederland woont.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel32b
  - number: 32b.2
    text: |-
      Voor de persoon, bedoeld in het eerste lid, herleeft, onverminderd [artikel 15][ref1], [23][ref2] of [27][ref3],
      het recht op nabestaandenuitkering, halfwezenuitkering of wezenuitkering op de dag dat:


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0007795#Artikel27
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel32b
    references:
