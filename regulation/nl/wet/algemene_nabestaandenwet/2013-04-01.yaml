        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0007795
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0007795
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: I
  - number: '38.1'
    text: |-
      De Sociale verzekeringsbank weigert de uitkering tijdelijk of blijvend, geheel of gedeeltelijk
      indien de nabestaande, het ouderloos kind, of zijn wettelijke vertegenwoordiger een verplichting op
      grond van [artikel 36, tweede lid][ref1], of [37][ref2] opgelegd, of de verplichtingen, bedoeld in
      [artikel 55, tweede lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3], niet of niet
      behoorlijk is nagekomen, dan wel de verplichting, bedoeld in [artikel 35][ref4], niet binnen de door de Sociale
      verzekeringsbank daarvoor vastgestelde termijn is nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel55
      [ref4]: https://wetten.overheid.nl/BWBR0007795#Artikel35
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '36'
        hoofdstuk: '3'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '37'
        hoofdstuk: '3'
        afdeling: II
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '55'
      - id: ref4
        bwb_id: BWBR0007795
        artikel: '35'
        hoofdstuk: '3'
        afdeling: II
  - number: '38.2'
    text: |-
      Een maatregel als bedoeld in het eerste lid wordt afgestemd op de ernst van de gedraging en de mate waarin de
      nabestaande, het ouderloos kind, of zijn wettelijke vertegenwoordiger de gedraging verweten kan worden. Van het
      opleggen van een maatregel wordt in elk geval afgezien, indien elke vorm van verwijtbaarheid ontbreekt.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel38
  - number: '38.3'
    text: |-
      De Sociale verzekeringsbank kan afzien van het opleggen van een maatregel als bedoeld in het eerste lid en volstaan
      met het geven van een schriftelijke waarschuwing ter zake van het niet tijdig nakomen van de verplichting, bedoeld
      in [artikel 35][ref1], indien het niet tijdig nakomen van de verplichting niet heeft geleid tot het ten onrechte
      of tot een te hoog bedrag verlenen van uitkering, tenzij het niet tijdig nakomen van de verplichting plaatsvindt
      binnen een periode van twee jaar te rekenen vanaf de datum waarop eerder aan de nabestaande, het ouderloos kind, of
      zijn wettelijke vertegenwoordiger, een zodanige waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel35
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '35'
        hoofdstuk: '3'
        afdeling: II
  - number: '38.4'
    text: |-
      De Sociale verzekeringsbank kan afzien van het opleggen van een maatregel indien daarvoor dringende redenen
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel38
  - number: '38.5'
    text: |-
      Het opleggen van een maatregel blijft achterwege indien voor dezelfde gedraging een bestuurlijke boete als bedoeld
      in [artikel 39][ref1] wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel39
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '39'
        hoofdstuk: '3'
        afdeling: II
  - number: '38.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste en
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel38
  - number: '39.1'
    text: |-
      De Sociale verzekeringsbank legt een bestuurlijke boete op van ten hoogste het benadelingsbedrag wegens het niet
      of niet behoorlijk nakomen door de nabestaande, het ouderloos kind, of zijn wettelijke vertegenwoordiger van de
      verplichting, bedoeld in [artikel 35][ref1]. De bestuurlijke boete is niet lager dan de boete die op grond van het
      derde lid zou worden opgelegd indien er geen sprake was van een benadelingsbedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel35
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '35'
        hoofdstuk: '3'
        afdeling: II
  - number: '39.2'
    text: |-
      In dit artikel wordt onder benadelingsbedrag verstaan het brutobedrag dat als gevolg van het niet of niet
      behoorlijk nakomen van de verplichting, bedoeld in [artikel 35][ref1], ten onrechte of tot een te hoog bedrag aan
      nabestaandenuitkering, halfwezenuitkering of wezenuitkering is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel35
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '35'
        hoofdstuk: '3'
        afdeling: II
  - number: '39.3'
    text: |-
      Indien het niet of niet behoorlijk nakomen door de nabestaande, het ouderloos kind, of zijn wettelijke
      vertegenwoordiger van de verplichting, bedoeld in [artikel 35][ref1], niet heeft geleid tot een benadelingsbedrag,
      legt de Sociale verzekeringsbank een bestuurlijke boete op van ten hoogste het bedrag van de tweede categorie,
      bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '35'
        hoofdstuk: '3'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '23'
  - number: '39.4'
    text: |-
      De Sociale verzekeringsbank kan afzien van het opleggen van een bestuurlijke boete als bedoeld in het derde lid
      en volstaan met het geven van een schriftelijke waarschuwing wegens het niet of niet behoorlijk nakomen van de
      verplichting, bedoeld in [artikel 35][ref1], tenzij het niet of niet behoorlijk nakomen van de verplichting plaats
      vindt binnen een periode van twee jaar te rekenen vanaf de datum waarop eerder aan de nabestaande, het ouderloos
      kind, of zijn wettelijke vertegenwoordiger, een zodanige waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel35
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '35'
        hoofdstuk: '3'
        afdeling: II
  - number: '39.5'
    text: |-
      De Sociale verzekeringsbank legt een bestuurlijke boete op wegens het niet of niet behoorlijk nakomen door
      de nabestaande, het ouderloos kind, of zijn wettelijke vertegenwoordiger van de verplichting, bedoeld in
      [artikel 35][ref1], als gevolg waarvan ten onrechte of tot een te hoog bedrag aan nabestaandenuitkering,
      halfwezenuitkering of wezenuitkering is ontvangen, van ten hoogste 150 procent van het benadelingsbedrag indien
      binnen een tijdvak van vijf jaar voorafgaand aan de dag van het begaan van de overtreding een eerdere bestuurlijke
      boete of strafrechtelijke sanctie is opgelegd wegens een eerdere overtreding, bestaande uit eenzelfde gedraging,
      die onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel35
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '35'
        hoofdstuk: '3'
        afdeling: II
  - number: '39.6'
    text: |-
      In afwijking van het vijfde lid is het in dat lid genoemde tijdvak van vijf jaar tien jaar indien wegens de eerdere
      overtreding, bedoeld in het vijfde lid, de nabestaande, het ouderloos kind, of zijn wettelijke vertegenwoordiger is
      gestraft met een onvoorwaardelijke gevangenisstraf.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel39
  - number: '39.7'
    text: 'De Sociale verzekeringsbank kan:'
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel39
  - number: 39.7.a
    text: de bestuurlijke boete verlagen indien sprake is van verminderde verwijtbaarheid;
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel39
  - number: 39.7.b
    text: afzien van het opleggen van een bestuurlijke boete indien daarvoor dringende redenen aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel39
  - number: '39.8'
    text: |-
      Degene aan wie een bestuurlijke boete is opgelegd, is verplicht desgevraagd aan de Sociale verzekeringsbank de
      inlichtingen te verstrekken die voor de tenuitvoerlegging van de bestuurlijke boete van belang zijn.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel39
  - number: '39.9'
    text: Bij algemene maatregel van bestuur worden nadere regels gesteld over de hoogte van de bestuurlijke boete.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel39
  - number: '39.10'
    text: |-
      In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref1] kan de rechter in beroep of hoger beroep
      het bedrag waarop de bestuurlijke boete is vastgesteld ook ten nadele van de nabestaande, het ouderloos kind, of
      zijn wettelijke vertegenwoordiger wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '41'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de termijn waarvoor uitstel van
      betaling van de bestuurlijke boete kan worden verleend alsmede omtrent de hoogte van het op grond van
      [artikel 45, eerste of tweede lid][ref1], te verrekenen bedrag en de termijn of termijnen waarbinnen deze
      verrekening plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel45
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '45'
        hoofdstuk: '3'
        afdeling: II
  - number: '45.1'
    text: |-
      De Sociale verzekeringsbank verrekent de bestuurlijke boete met een uitkering op grond van deze wet,
      kinderbijslag op grond van de [Algemene Kinderbijslagwet][ref1] of ouderdomspensioen op grond van de
      [Algemene Ouderdomswet][ref2], die degene aan wie een bestuurlijke boete is opgelegd, ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0002368
      [ref2]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002368
      - id: ref2
        bwb_id: BWBR0002221
  - number: '45.2'
    text: |-
      Het college van burgemeester en wethouders van de betrokken gemeente, onderscheidenlijk het
      Uitvoeringsinstituut werknemersverzekeringen, betaalt het bedrag van de bestuurlijke boete, zonder dat
      daarvoor een machtiging nodig is, op haar verzoek aan de Sociale verzekeringsbank indien degene aan wie
      een bestuurlijke boete is opgelegd een uitkering ontvangt op grond van de [Wet werk en bijstand][ref1],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3],
      de [Wet inkomensvoorziening oudere werklozen][ref4], de [Werkloosheidswet][ref5], de
      [Ziektewet][ref6], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref7], de
      [Wet werk en arbeidsondersteuning jonggehandicapten][ref8], de[ Wet werk en inkomen naar arbeidsvermogen][ref9], de
      [Wet op de arbeidsongeschiktheidsverzekering][ref10] of de [Wet arbeid en zorg][ref11] of een toeslag op grond van
      de [Toeslagenwet][ref12].


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0004044
      [ref3]: https://wetten.overheid.nl/BWBR0004163
      [ref4]: https://wetten.overheid.nl/BWBR0024394
      [ref5]: https://wetten.overheid.nl/BWBR0004045
      [ref6]: https://wetten.overheid.nl/BWBR0001888
      [ref7]: https://wetten.overheid.nl/BWBR0008656
      [ref8]: https://wetten.overheid.nl/BWBR0008657
      [ref9]: https://wetten.overheid.nl/BWBR0019057
      [ref10]: https://wetten.overheid.nl/BWBR0002524
      [ref11]: https://wetten.overheid.nl/BWBR0013008
      [ref12]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0004044
      - id: ref3
        bwb_id: BWBR0004163
      - id: ref4
        bwb_id: BWBR0024394
      - id: ref5
        bwb_id: BWBR0004045
      - id: ref6
        bwb_id: BWBR0001888
      - id: ref7
        bwb_id: BWBR0008656
      - id: ref8
        bwb_id: BWBR0008657
      - id: ref9
        bwb_id: BWBR0019057
      - id: ref10
        bwb_id: BWBR0002524
      - id: ref11
        bwb_id: BWBR0013008
      - id: ref12
        bwb_id: BWBR0004043
  - number: '45.3'
    text: |-
      De in [artikel 479g van het Wetboek van Burgerlijke Rechtsvordering][ref1] aan het Landelijk Bureau Inning
      Onderhoudsbijdragen toegekende bevoegdheid komt gelijkelijk toe aan de Sociale verzekeringsbank. Indien de Sociale
      verzekeringsbank gebruik maakt van deze bevoegdheid, geschiedt de bekendmaking van het dwangbevel, in afwijking
      van [artikel 4:123, eerste lid, van de Algemene wet bestuursrecht][ref2], door middel van toezending per post aan
      degene aan wie de boete is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel479g
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 479g
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '45.4'
    text: |-
      Zolang de nabestaande, het ouderloos kind, of zijn wettelijke vertegenwoordiger, zijn verplichting, bedoeld in
      [artikel 39, achtste lid][ref1], niet of niet behoorlijk nakomt:


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel39
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '39'
        hoofdstuk: '3'
        afdeling: II
  - number: 45.4.a
    text: |-
      is de Sociale verzekeringsbank, in afwijking van [artikel 4.93, vierde lid, van de Algemene wet bestuursrecht][ref1],
      bevoegd tot verrekening voor zover beslag op de vordering van de schuldeiser nietig zou zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 45.4.b
    text: |-
      geldt de beslagvrije voet, bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref1], in afwijking van
      [artikel 4:116 van de Algemene wet bestuursrecht][ref2], niet bij de invordering van een bestuurlijke boete bij
      dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 45a.1
    text: |-
      Bij de verrekening, bedoeld in [artikel 45, eerste lid][ref1], wordt de bestuurlijke boete,
      bedoeld in [artikel 39, vijfde lid][ref2], door Sociale verzekeringsbank, in afwijking van
      [artikel 4:93, vierde lid, van de Algemene wet bestuursrecht][ref3], verrekend gedurende een tijdvak van ten
      hoogste vijf jaar vanaf het moment van de dagtekening waarop de bestuurlijke boete is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '45'
        hoofdstuk: '3'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '39'
        hoofdstuk: '3'
        afdeling: II
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 45a.2
    text: |-
      [Artikel 45, eerste lid][ref1], en het eerste lid zijn van overeenkomstige toepassing op de verrekening van de
      bestuurlijke boete, bedoeld in [artikel 39, eerste lid][ref2], indien en voor zover op het moment van verrekening,
      bedoeld in het eerste lid, de bestuurlijke boete door de overtreder niet is betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel39
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '45'
        hoofdstuk: '3'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '39'
        hoofdstuk: '3'
        afdeling: II
  - number: 45a.3
    text: |-
      De Sociale verzekeringsbank kan op verzoek van degene aan wie de bestuurlijke boete is opgelegd besluiten het
      eerste en tweede lid niet of niet meer toe te passen indien, gelet op bijzondere omstandigheden, dringende redenen
      daartoe noodzaken.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel45a
  - number: 45a.4
    text: |-
      De voorgaande leden laten de verrekening van de bestuurlijke boete op grond van [artikel 45, eerste lid][ref1], na
      het tijdvak, bedoeld in het eerste lid, onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel45
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '45'
        hoofdstuk: '3'
        afdeling: II
  - number: 45a.5
    text: |-
      Indien als gevolg van de verrekening, bedoeld in het eerste en tweede lid, algemene bijstand op grond van de
      [Wet werk en bijstand][ref1] wordt toegekend, wordt bij de verrekening een bij ministeriële regeling bepaald deel
      van de uitkering op grond van deze wet vrijgelaten in verband met zorgkosten, woonkosten en de kosten van kinderen.
      Het vrij te laten deel van de uitkering kan afhankelijk worden gesteld van de leefsituatie.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0015703
  - number: '46.1'
    text: De Sociale verzekeringsbank betaalt de uitkering waarop op grond van deze wet recht bestaat.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel46
  - number: '46.2'
    text: De betaling bedoeld in het eerste lid geschiedt in de regel per maand.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel46
  - number: '46.3'
    text: |-
      De Sociale verzekeringsbank schort de betaling van de uitkering op of schorst de betaling indien zij op grond van
      duidelijke aanwijzingen van oordeel is of het gegronde vermoeden heeft, dat:
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel46
  - number: 46.3.a
    text: het recht op uitkering niet of niet meer bestaat; of
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel46
  - number: 46.3.b
    text: recht op een lagere uitkering bestaat; of
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel46
  - number: 46.3.c
    text: |-
      de nabestaande, het ouderloos kind, of zijn wettelijke vertegenwoordiger dan wel de instelling aan welke ingevolge
      [artikel 49][ref1] of [57][ref2] de uitkering wordt uitbetaald, een verplichting bedoeld in [artikel 35][ref3],
      [35a][ref4], [36, tweede lid][ref5], of [37][ref6] niet is nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel57
      [ref3]: https://wetten.overheid.nl/BWBR0007795#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0007795#Artikel35a
      [ref5]: https://wetten.overheid.nl/BWBR0007795#Artikel36
      [ref6]: https://wetten.overheid.nl/BWBR0007795#Artikel37
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '49'
        hoofdstuk: '3'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '57'
        hoofdstuk: '3'
        afdeling: III
      - id: ref3
        bwb_id: BWBR0007795
        artikel: '35'
        hoofdstuk: '3'
        afdeling: II
      - id: ref4
        bwb_id: BWBR0007795
        artikel: 35a
        hoofdstuk: '3'
        afdeling: II
      - id: ref5
        bwb_id: BWBR0007795
        artikel: '36'
        hoofdstuk: '3'
        afdeling: II
      - id: ref6
        bwb_id: BWBR0007795
        artikel: '37'
        hoofdstuk: '3'
        afdeling: II
  - number: '46.4'
    text: |-
      De Sociale verzekeringsbank stelt de betrokken persoon of instelling onverwijld schriftelijk in kennis van de
      beslissing bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel46
  - number: 46a.1
    text: |-
      De Sociale verzekeringsbank schort de betaling van de uitkering op indien degene aan wie een uitkering
      is toegekend een vreemdeling is die niet rechtmatig in Nederland verblijf houdt als bedoeld in
      [artikel 8 van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel46a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 46a.2
    text: |-
      De betaling van de uitkering wordt hervat indien betrokkene daartoe een aanvraag indient en het de Bank is gebleken
      dat hij feitelijk buiten Nederland woont of verblijf houdt.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel46a
  - number: 46b.1
    text: |-
      De Sociale verzekeringsbank schort de betaling van de uitkering op, indien blijkt dat het door de nabestaande
      verstrekte adres van hemzelf of van een kind afwijkt van het adres waaronder de betrokkene in de gemeentelijke
      basisadministratie persoonsgegevens staat ingeschreven.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel46b
  - number: 46b.2
    text: 'Geen opschorting vindt plaats:'
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel46b
  - number: 46b.2.a
    text: indien de afwijking redelijkerwijs geen gevolgen kan hebben voor het recht op of de hoogte van de uitkering;
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel46b
  - number: 46b.2.b
    text: indien de nabestaande van de afwijking redelijkerwijs geen verwijt kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel46b
  - number: 46b.3
    text: De Sociale verzekeringsbank doet schriftelijk mededeling van de opschorting aan de nabestaande.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel46b
  - number: 46b.4
    text: |-
      De opschorting wordt beëindigd zodra het aan de Sociale verzekeringsbank gebleken is dat de afwijking niet meer
      bestaat.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel46b
  - number: '47'
    text: |-
      Voor zover bij of krachtens deze wet niet anders is bepaald, wordt een voorschot op de nog niet vastgestelde
      uitkering beschouwd als een uitkering op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel47
  - number: '48'
    text: |-
      Indien de uitkering in het buitenland wordt uitbetaald, geschiedt de betaling in afwijking van
      [artikel 4:89, derde lid, van de Algemene wet bestuursrecht][ref1] op het tijdstip waarop de rekening van de
      daartoe door de schuldeiser aangewezen bank wordt gecrediteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '49.1'
    text: |-
      De Sociale verzekeringsbank is bevoegd, voor zover nodig na ingewonnen advies van het Landelijk Bureau Inning
      Onderhoudsbijdragen, de wezenuitkering betaalbaar te stellen aan een ander dan de wettelijke vertegenwoordiger van
      het kind.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel49
  - number: '49.2'
    text: |-
      Indien de rechthebbende of diens wettelijke vertegenwoordiger nalaat een aanvraag om wezenuitkering in te dienen,
      kan deze aanvraag geschieden door het Landelijk Bureau Inning Onderhoudsbijdragen, dat tevens adviseert aan wie de
      wezenuitkering betaalbaar kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel49
  - number: '50.1'
    text: |-
      De Sociale verzekeringsbank betaalt, voor zover niet reeds betaald, de vakantie-uitkering in afwijking van
      [artikel 46][ref1] jaarlijks in de maand mei over de aan die maand voorafgaande maanden, of indien het recht op
      uitkering eerder dan in de maand mei eindigt, in de desbetreffende maand, tenzij aansluitend aan het recht op
      uitkering op grond van deze wet recht op uitkering ingevolge de [Algemene Ouderdomswet][ref2] ontstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '46'
        hoofdstuk: '3'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0002221
  - number: '50.2'
    text: Bij ministeriële regeling worden nadere regels gesteld voor de betaling van de vakantie-uitkering.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel50
  - number: '51.1'
    text: |-
      Na het overlijden van degene aan wie nabestaandenuitkering of halfwezenuitkering is toegekend, wordt met ingang
      van de dag na overlijden nabestaandenuitkering of halfwezenuitkering in de vorm van een overlijdensuitkering
      uitbetaald:
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel51
  - number: 51.1.a
    text: aan de minderjarige kinderen tot wie de overledene in familierechtelijke betrekking stond;
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel51
  - number: 51.1.b
    text: |-
      bij ontstentenis van de in onderdeel *a* bedoelde kinderen aan degenen met wie de overledene in gezinsverband
      leefde.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel51
  - number: '51.2'
    text: |-
      De overlijdensuitkering is gelijk aan het bedrag van de nabestaandenuitkering of de halfwezenuitkering dan wel van
      de nabestaanden- en halfwezenuitkering over één maand, berekend naar de hoogte van die uitkeringen in de maand van
      overlijden van degene aan wie nabestaandenuitkering of halfwezenuitkering is toegekend.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel51
  - number: '51.3'
    text: |-
      De overlijdensuitkering wordt ambtshalve of op verzoek van de rechthebbende of rechthebbenden door de Sociale
      verzekeringsbank uitbetaald.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel51
  - number: '51.4'
    text: De overlijdensuitkering wordt in een bedrag ineens uitbetaald.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel51
  - number: '51.5'
    text: |-
      Het bedrag van de overlijdensuitkering wordt verminderd met het bedrag aan nabestaandenuitkering of
      halfwezenuitkering dat, over na het overlijden gelegen dagen, reeds is uitbetaald.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel51
  - number: '51.6'
    text: De overlijdensuitkering is niet vatbaar voor beslag.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel51
  - number: '52.1'
    text: |-
      Een uitkering op grond van deze wet die niet in ontvangst is genomen of is ingevorderd binnen drie maanden na de
      dag van betaalbaarstelling, wordt niet meer betaald.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel52
  - number: '52.2'
    text: |-
      De Sociale verzekeringsbank is bevoegd in bijzondere gevallen ten gunste van de nabestaande of het ouderloos kind
      af te wijken van de termijn van drie maanden.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel52
  - number: '53.1'
    text: |-
      De uitkering op grond van deze wet die als gevolg van een besluit als bedoeld in [artikel 34][ref1] onverschuldigd
      is betaald, alsmede hetgeen anderszins onverschuldigd is betaald, wordt door de Sociale verzekeringsbank van
      de nabestaande of het ouderloos kind of zijn wettelijke vertegenwoordiger, of de instelling aan welke ingevolge
      [artikel 49][ref2] of 57 de uitkering wordt uitbetaald, teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel49
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '34'
        hoofdstuk: '3'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '49'
        hoofdstuk: '3'
        afdeling: III
  - number: '53.2'
    text: |-
      In afwijking van het eerste lid kan de Sociale verzekeringsbank besluiten van terugvordering of van verdere
      terugvordering af te zien, indien de nabestaande of het ouderloos kind of zijn wettelijke vertegenwoordiger, of de
      instelling aan welke ingevolge [artikel 49][ref1] of [57][ref2] de uitkering wordt uitbetaald:


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel57
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '49'
        hoofdstuk: '3'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '57'
        hoofdstuk: '3'
        afdeling: III
  - number: 53.2.a
    text: gedurende vijf jaar volledig aan zijn betalingsverplichtingen heeft voldaan;
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel53
  - number: 53.2.b
    text: |-
      gedurende vijf jaar niet volledig aan zijn betalingsverplichtingen heeft voldaan, maar het achterstallige bedrag
      over die periode, vermeerderd met de daarover verschuldigde wettelijke rente en de op de invordering betrekking
      hebbende kosten, alsnog heeft betaald;
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel53
  - number: 53.2.c
    text: |-
      gedurende vijf jaar geen betalingen heeft verricht en niet aannemelijk is dat hij deze op enig moment zal gaan
      verrichten; of
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel53
  - number: 53.2.d
    text: een bedrag, overeenkomend met ten minste 50% van de restsom in één keer aflost.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel53
  - number: '53.3'
    text: |-
      De in het tweede lid, onderdelen a, b en c, genoemde termijn is tien jaar indien de terugvordering het gevolg is
      van het niet of niet behoorlijk nakomen van de verplichting, bedoeld in [artikel 35][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel35
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '35'
        hoofdstuk: '3'
        afdeling: II
  - number: '53.4'
    text: 'De in het tweede lid, onder a en b, genoemde termijn is drie jaar indien:'
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel53
  - number: 53.4.a
    text: |-
      het gemiddeld inkomen van de belanghebbende in die periode de beslagvrije voet bedoeld in de [artikelen 475c][ref1]
      en [475d van het Wetboek van Burgerlijke Rechtsvordering][ref2] niet te boven is gegaan; en


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475d
  - number: 53.4.b
    text: |-
      de terugvordering niet het gevolg is van het niet of niet behoorlijk nakomen van de verplichting, bedoeld in
      [artikel 35][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel35
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '35'
        hoofdstuk: '3'
        afdeling: II
  - number: '53.5'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan de Sociale verzekeringsbank besluiten geheel of gedeeltelijk
      van de terugvordering af te zien.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel53
  - number: '53.6'
    text: |-
      Degene van wie wordt teruggevorderd is verplicht desgevraagd aan de Sociale verzekeringsbank de inlichtingen te
      verstrekken die voor de terugvordering van belang zijn.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel53
  - number: '53.7'
    text: |-
      In afwijking van het eerste lid kan de Sociale verzekeringsbank, onder voorwaarden die Onze Minister kan stellen,
      besluiten van terugvordering af te zien indien het terug te vorderen bedrag een door Onze Minister vast te stellen
      bedrag niet te boven gaat.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel53
  - number: '54.1'
    text: |-
      De Sociale verzekeringsbank kan de onverschuldigd betaalde uitkering, bedoeld in [artikel 53, eerste lid][ref1],
      invorderen bij dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel53
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '53'
        hoofdstuk: '3'
        afdeling: III
  - number: '54.2'
    text: |-
      [Artikel 45][ref1] is van overeenkomstige toepassing, met dien verstande dat indien het gemiddeld inkomen
      van de belanghebbende gedurende drie jaar de beslagvrije voet bedoeld in de [artikelen 475c][ref2] en
      [475d van het Wetboek van Burgerlijke Rechtsvordering][ref3] niet te boven is gegaan, de Sociale verzekeringsbank
      de aflossingsbedragen lager vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '45'
        hoofdstuk: '3'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 475d
  - number: '55'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze van tenuitvoerlegging van de
      beschikking waarbij is vastgesteld dat onverschuldigd is betaald.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel55
  - number: 55a.1
    text: |-
      In afwijking van [artikel 53, eerste lid][ref1], kan de Sociale verzekeringsbank, op verzoek van de nabestaande of
      het ouderloos kind of zijn wettelijke vertegenwoordiger, of de instelling aan welke ingevolge [artikel 49][ref2]
      of [57][ref3] de uitkering wordt uitbetaald, besluiten gedeeltelijk van terugvordering of gedeeltelijk van verdere
      terugvordering af te zien door medewerking aan een schuldregeling, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0007795#Artikel57
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel55a
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '53'
        hoofdstuk: '3'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '49'
        hoofdstuk: '3'
        afdeling: III
      - id: ref3
        bwb_id: BWBR0007795
        artikel: '57'
        hoofdstuk: '3'
        afdeling: III
  - number: 55a.1.a
    text: |-
      redelijkerwijs te voorzien is dat de nabestaande, het ouderloos kind of zijn wettelijke vertegenwoordiger,
      respectievelijk de instelling aan welke ingevolge [artikel 49][ref1] of [57][ref2] de uitkering wordt uitbetaald,
      niet zal kunnen voortgaan met het betalen van zijn schulden of indien hij in de toestand verkeert dat hij heeft
      opgehouden te betalen;


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel57
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel55a
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '49'
        hoofdstuk: '3'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '57'
        hoofdstuk: '3'
        afdeling: III
  - number: 55a.1.b
    text: |-
      redelijkerwijs te voorzien is dat een schuldregeling met betrekking tot alle vorderingen, behoudens de in het
      tweede lid bedoelde vorderingen, van de overige schuldeisers zonder een zodanig besluit niet tot stand zal komen;
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel55a
  - number: 55a.1.c
    text: |-
      de vordering van de Sociale verzekeringsbank wegens onverschuldigde betaling ten minste zal worden voldaan naar
      evenredigheid met de vorderingen van de schuldeisers van gelijke rang;
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel55a
  - number: 55a.1.d
    text: |-
      een naar het oordeel van de Sociale verzekeringsbank betrouwbaar voorstel voor een
      schuldregeling tot stand is gekomen door tussenkomst van een schuldhulpverlener als bedoeld in
      [artikel 48 van de Wet op het consumentenkrediet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel48
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel55a
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '48'
  - number: 55a.1.e
    text: aannemelijk is dat medewerking aan een schuldregeling niet concurrentieverstorend werkt; en
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel55a
  - number: 55a.1.f
    text: |-
      uitdeling in het kader van de schuldregeling plaatsvindt overeenkomstig
      [artikel 349 van de Faillissementswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel349
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel55a
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '349'
  - number: 55a.2
    text: |-
      Het eerste lid is niet van toepassing indien een vordering is ontstaan door het niet nakomen door de nabestaande,
      het ouderloos kind of zijn wettelijke vertegenwoordiger, respectievelijk de instelling aan welke ingevolge
      [artikel 49][ref1] of [57][ref2] de uitkering wordt uitbetaald, van de verplichting, bedoeld in [artikel 35][ref3],
      en hiervoor een boete als bedoeld in [artikel 39][ref4] is opgelegd, dan wel met betrekking tot het niet naleven
      van die verplichting aangifte is gedaan op grond van het [Wetboek van Strafrecht][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel57
      [ref3]: https://wetten.overheid.nl/BWBR0007795#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0007795#Artikel39
      [ref5]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel55a
    references:
      - id: ref1
        bwb_id: BWBR0007795
