        bwb_id: BWBR0007795
        artikel: 32a
        hoofdstuk: '3'
        paragraaf: '9'
        afdeling: I
  - number: 32c.1
    text: |-
      Geen recht op nabestaandenuitkering ontstaat voor de nabestaande indien hem op de dag van het overlijden van de
      verzekerde, dan wel op de dag na afloop van de toepassing van [artikel 32e][ref1] met betrekking tot dat recht op
      uitkering, rechtens zijn vrijheid is ontnomen. Geen recht op halfwezenuitkering ontstaat voor de nabestaande indien
      hem of de halfwees op de dag van het overlijden van de verzekerde, dan wel op de dag na afloop van de toepassing
      van artikel 32e met betrekking tot dat recht op uitkering, rechtens zijn vrijheid is ontnomen. Geen recht op
      wezenuitkering ontstaat voor het kind indien het op de dag van het overlijden van de verzekerde, dan wel op de
      dag na afloop van de toepassing van artikel 32e met betrekking tot dat recht op uitkering, rechtens zijn vrijheid
      is ontnomen.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel32e
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel32c
    references:
