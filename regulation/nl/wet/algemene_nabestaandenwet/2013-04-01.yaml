        bwb_id: BWBR0007795
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: I
  - number: 32b.3
    text: |-
      Het tweede lid is van overeenkomstige toepassing, indien de nabestaande, de nabestaande en de halfwees
      onderscheidenlijk het kind niet in Nederland wonen, vanaf de dag dat betrokkene in een land woont waarmee een
      verdrag in werking is getreden dan wel een besluit van een volkenrechtelijke organisatie van kracht is geworden, op
      grond waarvan recht op nabestaandenuitkering, halfwezenuitkering onderscheidenlijk wezenuitkering kan bestaan.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel32b
  - number: 32b.4
    text: |-
      [Artikel 32a, tweede, vijfde en zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel32a
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel32b
    references:
