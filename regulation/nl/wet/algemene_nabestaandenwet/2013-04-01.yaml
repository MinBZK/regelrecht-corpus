  - number: 32c.3
    text: |-
      Het eerste lid is niet van toepassing en het tweede lid is van overeenkomstige toepassing op bij algemene
      maatregel van bestuur aan te wijzen categorieën personen waarbij tenuitvoerlegging van een vrijheidsstraf of
      vrijheidsbenemende maatregel buiten een justitiële inrichting plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel32c
  - number: 32d.1
    text: |-
      Het recht op nabestaandenuitkering eindigt, indien de nabestaande rechtens zijn vrijheid is ontnomen, vanaf de dag
      dat deze vrijheidsontneming één maand heeft geduurd. Het recht op halfwezenuitkering eindigt, indien de nabestaande
      of de halfwees rechtens zijn vrijheid is ontnomen, vanaf de dag dat deze vrijheidsontneming één maand heeft
      geduurd. Het recht op wezenuitkering eindigt, indien het kind rechtens zijn vrijheid is ontnomen, vanaf de dag dat
      deze vrijheidsontneming één maand heeft geduurd.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel32d
  - number: 32d.2
    text: |-
      Voor de persoon, bedoeld in het eerste lid, herleeft, onverminderd [artikel 15][ref1], [23][ref2] of [27][ref3],
      het recht op nabestaandenuitkering, halfwezenuitkering of wezenuitkering op de dag dat:


