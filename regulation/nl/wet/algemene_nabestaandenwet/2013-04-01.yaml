  - number: 32d.5
    text: |-
      Het recht op nabestaandenuitkering, respectievelijk het recht op halfwezenuitkering of het recht op
      wezenuitkering eindigt, in afwijking van het eerste lid, vanaf de dag dat de vrijheidsontneming ingaat,
      indien op de dag voorafgaande aan de vrijheidsontneming geen recht bestaat op die uitkering op grond van
      [artikel 32f, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel32f
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel32d
