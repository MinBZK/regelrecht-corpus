        hoofdstuk: '3'
        afdeling: II
      - id: ref4
        bwb_id: BWBR0007795
        artikel: '37'
        hoofdstuk: '3'
        afdeling: II
  - number: '34.2'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan de Sociale verzekeringsbank besluiten geheel of gedeeltelijk
      van herziening of intrekking af te zien.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel34
  - number: '35'
    text: |-
      De nabestaande, het ouderloos kind en zijn wettelijke vertegenwoordiger alsmede de instelling aan welke ingevolge
      [artikel 49][ref1] of [57][ref2] de uitkering wordt uitbetaald, zijn verplicht aan de Sociale verzekeringsbank
      op haar verzoek of onverwijld uit eigen beweging alle feiten en omstandigheden mee te delen, waarvan hun
      redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op het recht op uitkering, de hoogte van de
      uitkering, het geldend maken van het recht op uitkering of op het bedrag van de uitkering, dat wordt uitbetaald.
      De verplichting geldt niet indien die feiten en omstandigheden door de Sociale verzekeringsbank kunnen worden
      vastgesteld op grond van bij wettelijk voorschrift als authentiek aangemerkte gegevens of kunnen worden verkregen
      uit bij ministeriële regeling aan te wijzen administraties. Bij ministeriële regeling wordt bepaald voor welke
      gegevens de tweede zin van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel57
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '49'
        hoofdstuk: '3'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '57'
        hoofdstuk: '3'
        afdeling: III
  - number: 35a
    text: |-
      In aanvulling op [artikel 35][ref1] kan de Sociale verzekeringsbank de nabestaande dan wel zijn wettelijke
      vertegenwoordiger respectievelijk het ouderloos kind dan wel zijn wettelijke vertegenwoordiger verzoeken aan te
      tonen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel35
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '35'
        hoofdstuk: '3'
        afdeling: II
  - number: 35a.a
    text: de nabestaande geen gezamenlijke huishouding voert anders dan ten behoeve van de verzorging van een hulpbehoevende;
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel35a
  - number: 35a.b
    text: |-
      het kind, bedoeld in [artikel 26, tweede lid, onderdeel d][ref1], ongehuwd is en dat tot zijn huishouden ten minste
      een ander kind behoort dat recht heeft op een wezenuitkering;


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel26
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: I
  - number: 35a.c
    text: |-
      de feitelijke woonsituatie van de nabestaande of van een ouderloos kind in overeenstemming is met het verstrekte
      adres van die nabestaande of van dat ouderloos kind.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel35a
  - number: '36.1'
    text: |-
      De Sociale verzekeringsbank is bevoegd controlevoorschriften vast te stellen. Deze voorschriften mogen niet verder
      gaan dan strikt noodzakelijk is voor een juiste uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel36
  - number: '36.2'
    text: |-
      De nabestaande, het ouderloos kind dan wel zijn wettelijk vertegenwoordiger of de instelling waaraan op grond
      van [artikel 49][ref1] of [57][ref2] de uitkering wordt uitbetaald, is verplicht de voorschriften op te volgen en
      anderszins aan de Sociale verzekeringsbank desgevraagd de medewerking te verlenen die redelijkerwijs nodig is voor
      de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel57
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '49'
        hoofdstuk: '3'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '57'
        hoofdstuk: '3'
        afdeling: III
  - number: '37'
    text: |-
      Voor de toepassing van de [artikelen 5, tweede lid][ref1], [11][ref2],
      [14, eerste lid, aanhef en onderdeel b][ref3], [26, tweede lid, aanhef en onderdeel b][ref4], dan wel om te bepalen
      of een gezamenlijke huishouding ten behoeve van de verzorging van een hulpbehoevende wordt gevoerd, onderwerpt de
      betrokken persoon zich op verzoek van de Sociale verzekeringsbank aan een geneeskundig onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0007795#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0007795#Artikel26
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel37
