  - number: 32e
    text: |-
      Geen recht op nabestaandenuitkering ontstaat voor de nabestaande indien en voor zolang hij zich op de dag
      van het overlijden van de verzekerde en daarna onttrekt aan de tenuitvoerlegging van een vrijheidsstraf of
      vrijheidsbenemende maatregel. Geen recht op halfwezenuitkering ontstaat voor de nabestaande indien en voor zolang
      hij of de halfwees zich op de dag van het overlijden van de verzekerde en daarna onttrekt aan de tenuitvoerlegging
      van een vrijheidsstraf of vrijheidsbenemende maatregel. Geen recht op wezenuitkering ontstaat voor het kind indien
      en voor zolang het zich op de dag van het overlijden van de verzekerde en daarna onttrekt aan de tenuitvoerlegging
      van een vrijheidsstraf of vrijheidsbenemende maatregel.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel32e
  - number: 32f.1
    text: |-
      Het recht op nabestaandenuitkering eindigt, indien de nabestaande zich onttrekt aan de tenuitvoerlegging van een
      vrijheidsstraf of vrijheidsbenemende maatregel. Het recht op halfwezenuitkering eindigt indien de nabestaande of
      de halfwees zich onttrekt aan de tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel. Het
      recht op wezenuitkering eindigt indien het kind zich onttrekt aan de tenuitvoerlegging van een vrijheidsstraf of
      vrijheidsbenemende maatregel.
    url: https://wetten.overheid.nl/BWBR0007795/2013-04-01#Artikel32f
  - number: 32f.2
    text: |-
