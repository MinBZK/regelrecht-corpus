  - number: '24'
    text: |-
      Het bestuur kan naar aanleiding van een daartoe door een accountantspraktijk of accountantsafdeling schriftelijk
      ingediend en gedocumenteerd verzoek besluiten tijdelijke vrijstelling van een (her)toetsing of vrijstelling van een
      themaonderzoek te verlenen.
    url: https://wetten.overheid.nl/BWBR0031878/2013-01-17#Artikel24
  - number: '25'
    text: |-
      1 Een verzoek tot tijdelijke vrijstelling of de verlenging daarvan wordt eerst in behandeling genomen nadat het
      tarief hiervoor, waarvan de hoogte bij verordening word vastgesteld, door de desbetreffende accountantspraktijk of
      accountantsafdeling is voldaan.

      2 Een tijdelijke vrijstelling van een (her)toetsing wordt slechts verleend wanneer tijdelijk niet kan worden
      voldaan aan de normen, bedoeld in [artikel 3][ref1] doordat:

      a. de accountantspraktijk of de accountantsafdeling binnen afzienbare termijn ophoudt te bestaan;

      b. een accountantspraktijk of accountantsafdeling als partij minder dan een jaar geleden betrokken is geweest, dan
      wel betrokken is bij een fusie met of een overname van of door een accountantspraktijk of accountantsafdeling van
      vergelijkbare omvang; of

      c. de samenwerking tussen een aanzienlijk deel van de bij een accountantspraktijk of accountantafdeling werkzame
      accountants of de aan een accountantspraktijk of accountantsafdeling verbonden accountants minder dan een jaar
      geleden is verbroken.

      3 Een tijdelijke vrijstelling van een (her)toetsing kan slechts worden verleend voor de duur van maximaal één jaar
      met de mogelijkheid tot verlenging voor de duur van maximaal één jaar.

      4 Het bestuur neemt een beslissing binnen acht weken na in behandeling nemen van het verzoek tot tijdelijke
      vrijstelling van een (her)toetsing.

      5 Het bestuur kan de in het vierde lid genoemde termijn verlengen met maximaal zes weken.

      6 Accountantspraktijken of accountantsafdelingen die lid zijn van of aangesloten zijn bij een koepelorganisatie
      waaraan een accreditatie als bedoeld in [artikel 26, eerste lid][ref2], is verleend, zijn voor de duur van deze
      accreditatie vrijgesteld van toetsing door het bestuur.

      7 Accountantspraktijken of accountantsafdelingen die lid zijn van of aangesloten zijn bij een koepelorganisatie
      waarvoor een verzoek als bedoeld in [artikel 26, eerste lid][ref3], is ingediend, zijn gedurende de periode waarin
      het bestuur op het verzoek nog geen beslissing heeft genomen, vrijgesteld van toetsing door het bestuur.

      8 Accountantspraktijken of accountantsafdelingen die een aanvraag hebben ingediend voor het lidmaatschap van of de
      aansluiting bij een geaccrediteerde koepelorganisatie zijn, gedurende de periode waarin de koepelorganisatie op het
      verzoek nog geen beslissing heeft genomen, vrijgesteld van toetsing door het bestuur.

      9 Het zesde en zevende lid vinden geen toepassing in het geval de accountantspraktijk of de accountantsafdeling
      een aanvraag heeft ingediend voor het lidmaatschap van of de aansluiting bij een koepelorganisatie
      nadat een accountantspraktijk of een accountantsafdeling is aangewezen voor een toetsing op grond van in
      [artikel 11, eerste lid][ref4].

      10 Het achtste lid vindt geen toepassing in het geval de in dat lid bedoelde aanvraag is ingediend
      nadat een accountantspraktijk of een accountantsafdeling is aangewezen voor een toetsing op grond van
      [artikel 11, eerste lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0031878#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0031878#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0031878#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0031878#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0031878#Artikel11
