  - number: '17'
    text: |-
      Indien de getoetste accountantspraktijk, accountantsafdeling of individuele accountant de inhoud van het
      toetsingsverslag of het eindoordeel openbaar maakt,

      a. neemt hij het bepaalde in [artikel A-150.2 van de Verordening gedragscode][ref1] in acht en;

      b. vermeldt hij de datum waarop de meest recente (her)toetsing heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0026536#ArtikelA-150.2
    url: https://wetten.overheid.nl/BWBR0031878/2013-01-17#Artikel17
    references:
