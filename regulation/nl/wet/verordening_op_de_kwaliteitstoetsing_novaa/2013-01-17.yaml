  - number: '14'
    text: |-
      Indien zich over de wijze van uitvoering van de (her)toetsing een meningsverschil voordoet tussen de aan toetsing
      onderworpen accountantspraktijk of accountantsafdeling en de toetser of het toetsingsteam, doet het bestuur op
      verzoek van de accountantspraktijk of de accountantsafdeling of de toetser of het toetsingsteam een bindende
      uitspraak.
    url: https://wetten.overheid.nl/BWBR0031878/2013-01-17#Artikel14
  - number: '15'
    text: |-
      1 Het bestuur beperkt zich tot een marginale toetsing van het definitieve toetsingsverslag en stelt naar aanleiding
      hiervan en het eventuele commentaar als bedoeld in [artikel 13, negende lid][ref1], een eindoordeel vast, al dan
      niet voorzien van aanbevelingen of aanwijzingen voor het treffen van maatregelen ter verbetering van geconstateerde
      tekortkomingen, dat hij binnen zes weken na afloop van de in artikel 13, negende lid, bedoelde termijn ter kennis
      brengt van de accountantspraktijk of de accountantsafdeling. Het bestuur kan gemotiveerd afwijken van het voorstel
      van de toetser of het toetsingsteam.

      2 Het bestuur kan de in het eerste lid genoemde termijn van zes weken verlengen.

      3 Een eindoordeel na een toetsing kan als volgt luiden:

      a. het stelsel van kwaliteitsbeheersing voldoet in opzet en werking aan het bepaalde bij of krachtens de
      [Wet op de Accountants-Administratieconsulenten][ref2];

      b. het stelsel van kwaliteitsbeheersing behoeft verbetering en voldoet in opzet of werking op belangrijke
      onderdelen niet aan het bepaalde bij of krachtens de [Wet op de Accountants-Administratieconsulenten][ref3];

      c. het stelsel van kwaliteitsbeheersing voldoet in opzet en werking niet aan het bepaalde bij of krachtens de
      [Wet op de Accountants-Administratieconsulenten][ref4].

      4 Een eindoordeel na een hertoetsing als bedoeld in [artikel 16, eerste lid][ref5], kan als volgt luiden:

      a. het stelsel van kwaliteitsbeheersing voldoet in opzet en werking aan het bepaalde bij of krachtens de
      [Wet op de Accountants-Administratieconsulenten][ref6];

      b. het stelsel van kwaliteitsbeheersing voldoet in opzet en werking niet aan het bepaalde bij of krachtens de
      [Wet op de Accountants-Administratieconsulenten][ref7].

      5 In het geval aan een accountantspraktijk of de accountantsafdeling een eindoordeel als bedoeld in het derde lid,
      onderdeel b, wordt gegeven, dan dient de accountantspraktijk of de accountantsafdeling binnen een door het bestuur
      te stellen termijn een door het bestuur goed te keuren verbeterplan in.

      6 Het bestuur stelt een termijn waarbinnen het stelsel van kwaliteitsbeheersing dient te worden aangepast en moet
      voldoen aan het bepaalde bij of krachtens de [Wet op de Accountants-Administratieconsulenten][ref8].

      7 Het bestuur kan volstaan met een gedeeltelijke goedkeuring van het verbeterplan. Het bestuur vermeldt daarbij op
      welke onderdelen het verbeterplan tekort schiet.

      8 Voor het beoordelen van het verbeterplan, bedoeld in het vijfde lid, wordt een tarief in rekening gebracht
      waarvan de hoogte bij verordening wordt vastgesteld.

      9 De tijd welke het bestuur besteedt aan de beoordeling van een verbeterplan, schort niet de termijn op bedoeld in
      het zesde lid.

      10 In het geval een eindoordeel luidt als bedoeld in het derde lid, onderdeel c, kan de voorzitter een
      tuchtrechtelijk procedure aanhangig te maken bij de Accountantskamer.


