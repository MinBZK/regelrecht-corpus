  text: |-
    Gelet op artikel 24, eerste lid, van de Wet op de Accountants-Administratieconsulenten;

    Stelt de volgende verordening vast:
  url: https://wetten.overheid.nl/BWBR0031878/2013-01-17#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van deze verordening wordt verstaan onder:

        - *aan assurance verwante opdracht:* de aan assurance verwante opdracht, bedoeld in de
      [Verordening gedragscode][ref1];
        - *accountant:* de Accountant-Administratieconsulent;
        - *openbaar accountant:* de openbaar accountant, bedoeld in de [Verordening gedragscode][ref2];
        - *intern accountant:* de intern accountant, bedoeld in de [Verordening gedragscode][ref3];
        - *overheidsaccountant:* de overheidsaccountant, bedoeld in de [Verordening gedragscode][ref4] met uitzondering
      van de overheidsaccountant die werkzaam is bij de belastingdienst en belast is met de controle van door
      belastingplichtigen ingeleverde aangiften en de overheidsaccountant die aan deze controle direct leiding geeft;
        - *dagelijks beleidsbepaler:* de openbaar accountant, bedoeld in
      [artikel B1-291.2 van de Verordening gedragscode][ref5], dan wel de intern of overheidsaccountant, bedoeld in
      [artikel B2-291.2 van de Verordening gedragscode][ref6];
        - *accountantsafdeling:* de accountantsafdeling, bedoeld in de [Verordening gedragscode][ref7];
        - *accountantspraktijk:* de accountantspraktijk, bedoeld in de [Verordening gedragscode][ref8];
        - *assuranceopdracht:* de assuranceopdracht, bedoeld in de [Verordening gedragscode][ref9],
      met uitzondering van de opdracht tot het uitvoeren van een wettelijke controle als bedoeld in
      [artikel 1, eerste lid, onderdeel p, van de Wet toezicht accountantsorganisaties][ref10];
        - *AFM:* de Stichting Autoriteit Financiële Markten;
        - *bestuur:* het bestuur van de NOvAA;
        - *incidentenonderzoek:* een onderzoek naar vermeende tekortkomingen in de beroepsuitoefening met uitzondering van
      de uitvoering van een wettelijke controle;
        - *koepelorganisatie:* een organisatie waarvan de accountantspraktijk of de accountantsafdeling lid is of
      waarbij de accountantspraktijk of de accountantsafdeling is aangesloten en welke organisatie bevoegd is aan de
      accountantspraktijk of de accountantsafdeling bindende regels voor de kwaliteitsbeheersing op te leggen, te toetsen
      en de naleving daarvan af te dwingen;
        - *NOvAA:* de Nederlandse Orde van Accountants-Administratieconsulenten, bedoeld in
      [artikel 2, eerste lid, van de Wet op de Accountants-Administratieconsulenten][ref11];
        - *Raad:* de individuele personen die op grond van
      [artikel 3, eerste lid, van de Verordening op de Raad voor Toezicht][ref12] zijn benoemd als lid van de Raad voor
      Toezicht;
        - *thematisch onderzoek:* een onderzoek naar een bepaald aspect van de uitvoering van assurance- of aan assurance
      verwante opdrachten;
        - *toetsing:* de beoordeling van de opzet en werking van het stelsel van kwaliteitsbeheersing van een
      accountantspraktijk of een accountantsafdeling;
        - *hertoetsing:* de toetsing waarbij mede wordt beoordeeld of de accountantspraktijk of de accountantsafdeling in
      voldoende mate opvolging heeft gegeven aan het goedgekeurde verbeterplan om de kwaliteit van de beroepsuitoefening
      in overeenstemming te brengen met het bij en krachtens de [Wet op de Accountants-Administratieconsulenten][ref13]
      bepaalde;
        - *stelsel van kwaliteitsbeheersing:* het totaal van ter zake van assurance- en aan assurance verwante opdrachten
      door de accountantspraktijk of de accountantsafdeling getroffen maatregelen en ingestelde procedures ter zake
      van: 1°. de interne beheersing van de accountantspraktijk of de accountantsafdeling met betrekking tot kwaliteit;
      2°. het interne onderzoek naar de naleving van de in de [Verordening gedragscode][ref14] opgenomen fundamentele
      beginselen door de bij de accountantspraktijk of de accountantsafdeling werkzame of daaraan verbonden accountants
      en andere personen; en 3°. het interne onderzoek ten aanzien van assurance- en aan assurance verwante opdrachten
      naar de kwaliteit van de door de bij de accountantspraktijk of de accountantsafdeling werkzame of daaraan verbonden
      accountants en andere personen uitgevoerde werkzaamheden;
        - *systeem van kwaliteitsborging:* de door een organisatie getroffen maatregelen en ingestelde procedures ten
      aanzien van het onderzoek naar de opzet en de werking van het stelsel van kwaliteitsbeheersing van de bij de
      organisatie aangesloten accountants, accountantspraktijken of accountantsafdelingen;
        - *verbeterplan:* een op de in [artikel 13, vierde en vijfde lid][ref15], bedoelde aanwijzingen en aanbevelingen
      gebaseerd document, waarin op planmatige en gestructureerde wijze wordt aangegeven welke maatregelen worden
      getroffen ter correctie van de geconstateerde tekortkomingen van de opzet en werking van het in [artikel 3][ref16]
      bedoelde stelsel van kwaliteitsbeheersing;
        - *voorzitter:* de voorzitter van de NOvAA;
        - *wettelijke controle:* de wettelijke controle, bedoeld in
      [artikel 1, eerste lid, onderdeel p, van de Wet toezicht accountantsorganisaties][ref17].


