  - number: '26'
    text: |-
      1 Koepelorganisaties kunnen het bestuur verzoeken hun systeem van kwaliteitsborging te accrediteren.

      2 Ten behoeve van deze accreditatie toetst het bestuur de opzet en werking van het systeem van kwaliteitsborging.

      3 De kosten van de behandeling van een verzoek tot accreditatie, waaronder mede wordt begrepen de toetsing
      van de opzet en werking van het systeem van kwaliteitsborging, komen voor rekening van de desbetreffende
      koepelorganisatie.

      4 De toerekening van de kosten van een accreditatie wordt bij verordening vastgesteld.

      5 De accreditatie wordt verleend voor de duur van drie jaar of zoveel korter als het bestuur beslist.

      6 Het bestuur neemt een besluit binnen zestien weken na ontvangst van het verzoek als bedoeld in het eerste lid.

      7 Het bestuur kan aan de accreditatie voorwaarden verbinden.

      8 De koepelorganisatie doet onverwijld mededeling aan het bestuur van wijzigingen in het geaccrediteerde systeem
      van kwaliteitsborging.

      9 Het bestuur bericht de koepelorganisatie welke gevolgen de wijzigingen hebben voor de accreditatie.
    url: https://wetten.overheid.nl/BWBR0031878/2013-01-17#Artikel26
  - number: '27'
    text: |-
      1 De kosten van een accreditatie als bedoeld in [artikel 26, derde lid][ref1], worden gevormd door het aantal
      aangevangen dagdelen dat de toetsers gezamenlijk bij de koepelorganisatie aan de toetsing hebben besteed,
      vermenigvuldigd met het geldende tarief.

      2 Het tarief wordt door de ledenvergadering vastgesteld in de [Verordening tarieven kwaliteitstoetsing NOvAA][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0031878#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0031879
    url: https://wetten.overheid.nl/BWBR0031878/2013-01-17#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0031878
        artikel: '26'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0031879
  - number: '28'
    text: |-
      Van vertrouwelijke gegevens in het kader van de toetsing verkregen, kan geen verder en ander gebruik worden gemaakt
      dan krachtens deze verordening is bepaald, tenzij bij wet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0031878/2013-01-17#Artikel28
  - number: '29'
    text: In situaties die procedureel van aard zijn en waarin deze verordening niet voorziet, beslist het bestuur.
    url: https://wetten.overheid.nl/BWBR0031878/2013-01-17#Artikel29
  - number: '30'
    text: |-
      1 De kosten van de werkzaamheden die worden verricht ter zake van de beoordeling van de kwaliteit van de
      beroepsuitoefening van een accountant, komen voor rekening van de accountantspraktijk waarbij de accountant
      werkzaam is of waaraan de accountant is verbonden, of de onderneming, de instelling of de overheid en de daarmee
      gelijk te stellen dienst waartoe de accountantsafdeling behoort waarbij de accountant werkzaam is of waaraan de
      accountant is verbonden.

      2 De toerekening van de kosten van de werkzaamheden die worden verricht ter zake van de beoordeling van de
      kwaliteit van de beroepsuitoefening van een accountant, wordt bij verordening vastgesteld.
    url: https://wetten.overheid.nl/BWBR0031878/2013-01-17#Artikel30
  - number: '32'
    text: |-
      De [Verordening op de periodieke preventieve toetsing][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0014165
    url: https://wetten.overheid.nl/BWBR0031878/2013-01-17#Artikel32
