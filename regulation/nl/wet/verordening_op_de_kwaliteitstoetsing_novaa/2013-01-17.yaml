        bwb_id: BWBR0014165
  - number: '33'
    text: |-
      1 Deze verordening treedt in werking op de tweede dag na publicatie in de Staatscourant en werkt terug tot 1 juli
      2012.

      2 Deze verordening wordt aangehaald als: Verordening op de Kwaliteitstoetsing NOvAA.
    url: https://wetten.overheid.nl/BWBR0031878/2013-01-17#Artikel33
  - number: '34'
    text: |-
      1 De toetsing van een accountantspraktijk, welke op grond van
      [artikel 7, tweede lid, van de Verordening op de periodieke preventieve toetsing][ref1] reeds is aangewezen voor
      een toetsing, wordt met inachtneming van de bepalingen uit de Verordening op de periodieke preventieve toetsing,
      zoals deze luidde voor de inwerkingtreding van deze verordening, afgerond door het bestuur.

      2 De hertoetsing van een accountantspraktijk, welke op grond van
      [artikel 12 van de Verordening op de periodieke preventieve toetsing][ref2] reeds is aangewezen voor een
      hertoetsing, wordt met inachtneming van de bepalingen uit de Verordening op de periodieke preventieve toetsing,
      zoals deze luidde voor de inwerkingtreding van deze verordening, afgerond door het bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0014165#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0014165#Artikel12
