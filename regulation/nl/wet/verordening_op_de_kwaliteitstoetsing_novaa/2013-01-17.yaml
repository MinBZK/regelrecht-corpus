        bwb_id: BWBR0026536
        artikel: A-150.2
  - number: '18'
    text: |-
      1 Het bestuur kan bij accountantspraktijken en accountantsafdelingen een thematisch onderzoek uitvoeren.

      2 Bij de uitvoering van een thematisch onderzoek bepaalt het bestuur in elk geval:

      a. het onderwerp van het thematisch onderzoek;

      b. de periode waarin het thematisch onderzoek wordt verricht;

      c. de wijze waarop en de vorm waarin het thematisch onderzoek wordt verricht;

      d. aan wie de uitvoering van het themaonderzoek wordt opgedragen;

      e. bij welke accountantspraktijk of accountantsafdeling een thematisch onderzoek wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0031878/2013-01-17#Artikel18
  - number: '19'
    text: |-
      1 Het bestuur stelt naar aanleiding van het thematisch onderzoek een verslag vast.

      2 Het bestuur kan het verslag, bedoeld in het eerst lid, aan de accountantspraktijk of de accountantsafdeling
      verstrekken.

      3 Het bestuur kan een mededeling doen waarin de uitkomsten van het thematisch onderzoek zijn opgenomen. In de
      mededeling worden enkel geanonimiseerde gegevens opgenomen.
    url: https://wetten.overheid.nl/BWBR0031878/2013-01-17#Artikel19
  - number: '20'
    text: Het bestuur kan een incidentenonderzoek uitvoeren.
    url: https://wetten.overheid.nl/BWBR0031878/2013-01-17#Artikel20
  - number: '21'
    text: Het bestuur bepaalt de wijze waarop en de vorm waarin het incidentenonderzoek plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0031878/2013-01-17#Artikel21
  - number: '22'
    text: |-
      1 Indien een accountantspraktijk beschikt over een vergunning, als bedoeld in
      [artikel 6 van de Wet toezicht accountantsorganisaties][ref1], meldt het bestuur het eindoordeel over een bij deze
      accountantspraktijk uitgevoerde (her)toetsing bij de AFM.

      2 Indien een accountantspraktijk beschikt over een vergunning, als bedoeld in
      [artikel 6 van de Wet toezicht accountantsorganisaties][ref2], draagt het bestuur, indien een
      eindoordeel over een bij deze accountantspraktijk uitgevoerde toetsing of hertoetsing luidt als bedoeld
      in [artikel 15, derde lid, onderdeel c][ref3], respectievelijk artikel 15, vierde lid, onderdeel b, het
      toetsingsdossier over aan de AFM.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0031878#Artikel15
