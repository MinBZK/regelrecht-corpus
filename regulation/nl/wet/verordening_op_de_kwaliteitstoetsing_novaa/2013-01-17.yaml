  - number: '16'
    text: |-
      1 Na een eindoordeel als bedoeld in [artikel 15, derde lid, onderdeel b][ref1], vindt een hertoetsing plaats.

      2 De hertoetsing vindt plaats na afloop van de termijn, bedoeld in [artikel 15, zesde lid][ref2].

      3 In het geval aan een accountantspraktijk of een accountantsafdeling na een hertoetsing een eindoordeel is gegeven
      als bedoeld in [artikel 15, vierde lid, onderdeel b][ref3], kan de voorzitter een tuchtrechtelijke procedure
      aanhangig te maken bij de Accountantskamer.


