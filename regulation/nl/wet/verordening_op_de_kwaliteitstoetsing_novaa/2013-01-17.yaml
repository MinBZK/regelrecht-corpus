  - number: '23'
    text: |-
      1 Indien uit een thematisch onderzoek als bedoeld in [artikel 18, eerste lid][ref1], informatie blijkt die duidt
      op een ernstige overtreding van de bij of krachtens de [Wet toezicht accountantsorganisaties][ref2] gestelde
      voorschriften door een accountantsorganisatie dan wel door een (mede) beleidsbepaler of een externe accountant van
      een accountantsorganisatie, verstrekt het bestuur deze informatie aan de AFM.

      2 Indien uit een incidentenonderzoek als bedoeld in [artikel 20][ref3], informatie blijkt die duidt op een
      ernstige overtreding van de bij of krachtens de [Wet toezicht accountantsorganisaties][ref4] gestelde voorschriften
      door een accountantsorganisatie dan wel door een (mede) beleidsbepaler of een externe accountant van een
      accountantsorganisatie, verstrekt het bestuur deze informatie aan de AFM.


