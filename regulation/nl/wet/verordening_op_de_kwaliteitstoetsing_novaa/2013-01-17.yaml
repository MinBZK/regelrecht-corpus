  - number: '10'
    text: |-
      1 De toetsing wordt uitgevoerd aan de hand van door het bestuur vastgestelde toetsingsprogramma's.

      2 Het bestuur maakt de in het eerste lid van dit artikel bedoelde toetsingsprogramma's bekend aan de leden van
      de NOvAA.
    url: https://wetten.overheid.nl/BWBR0031878/2013-01-17#Artikel10
  - number: '11'
    text: |-
      1 Het bestuur stelt vast welke accountantspraktijken en accountantsafdelingen in een bepaald jaar in aanmerking
      komen voor een toetsing.

      2 Het bestuur wijst ten behoeve van elke toetsing of hertoetsing een toetser aan of stelt een toetsingsteam samen.

      3 De toetser of het toetsingsteam is belast met de uitvoering van de toetsing of de hertoetsing van de
      accountantspraktijk of de accountantsafdeling.

      4 Bij de aanwijzing van de toetser of bij het samenstellen van het toetsingsteam wordt rekening gehouden met
      de aard en de omvang van de te toetsen accountantspraktijk of accountantsafdeling en met mogelijke feiten en
      omstandigheden waardoor de objectiviteit van de toetsers zou kunnen worden aangetast.
    url: https://wetten.overheid.nl/BWBR0031878/2013-01-17#Artikel11
  - number: '12'
    text: |-
      1 Het bestuur maakt de datum waarop de (her)toetsing zal plaatsvinden ten minste zes weken van tevoren bekend.

      2 Indien een accountantspraktijk of een accountantsafdeling aannemelijk maakt dat een (her)toetsing op de datum
      welke op grond van het eerste lid bekend is gemaakt, niet mogelijk is, kan het bestuur een andere datum bekend
      maken waarop de (her)toetsing zal plaatsvinden.

      3 Indien het tweede lid toepassing vindt, kan het bestuur in overleg met een accountantspraktijk of een
      accountantsafdeling afwijken van de in het eerste lid genoemde termijn van zes weken.

      4 Het bestuur doet mededeling van de naam van de toetser of de samenstelling van het toetsingsteam, alsmede van de
      termijn waarbinnen een verzoek als bedoeld in het vijfde lid van dit artikel kan worden ingediend.

      5 De accountantspraktijk of de accountantsafdeling kan binnen een door het bestuur te stellen termijn aan het
      bestuur schriftelijk verzoeken elk van de toetsers die de (her)toetsing uitvoert te wraken op grond van objectieve
      feiten en omstandigheden waardoor gerede twijfel is ontstaan met betrekking tot de objectiviteit van de toetser.

      6 Indien het bestuur van oordeel is dat er sprake is van feiten en omstandigheden waardoor de objectiviteit van de
      toetser aangetast zou kunnen worden of de schijn wordt gewekt dat de objectiviteit van de toetsers aangetast zou
      kunnen worden, wijst het een andere toetser aan of wijzigt het de samenstelling van het toetsingsteam.
    url: https://wetten.overheid.nl/BWBR0031878/2013-01-17#Artikel12
  - number: '13'
    text: |-
      1 De toetser of het toetsingsteam bespreekt direct na afloop van de (her)toetsing met de accountantspraktijk of de
      accountantsafdeling de bevindingen op hoofdlijnen.

      2 De toetser of het toetsingsteam stelt binnen een door het bestuur te stellen termijn na de eindbespreking een
      concept toetsingsverslag samen.

      3 Het toetsingsverslag als bedoeld in het tweede lid omvat naast de bevindingen van de toetser of het toetsingsteam
      tevens een gemotiveerd voorstel voor een oordeel als bedoeld in [artikel 15, derde lid][ref1] of artikel 15,
      vierde lid.

      4 De toetser of het toetsingsteam kan bij het voorstel voor een oordeel als bedoeld in
      [artikel 15, derde lid][ref2], onderdeel a of artikel 15, vierde lid, onderdeel a, aanbevelingen doen voor het
      treffen van maatregelen ter verbetering van het stelsel van kwaliteitsbeheersing.

      5 Bij een voorstel voor een oordeel als bedoeld in [artikel 15, derde lid, onderdeel b][ref3], doet de toetser
      of het toetsingsteam tevens een voorstel voor aanwijzingen voor het treffen van maatregelen ter verbetering van het
      stelsel van kwaliteitsbeheersing.

      6 Bij een voorstel voor een oordeel als bedoeld in [artikel 15, derde lid, onderdeel c][ref4] of artikel 15,
      vierde lid, onderdeel b, doet de toetser of het toetsingsteam tevens een voorstel voor aanwijzingen voor het
      treffen van maatregelen ter verbetering van het stelsel van kwaliteitsbeheersing en motiveert de ernst van de
      geconstateerde tekortkomingen.

      7 De toetser of het toetsingsteam draagt zorg voor de verzending van het concept toetsingsverslag binnen een door
      het bestuur te stellen termijn aan de accountantspraktijk of de accountantsafdeling.

      8 De accountantspraktijk of de accountantsafdeling kan binnen een door het bestuur te stellen termijn schriftelijk
      commentaar op het concept toetsingsverslag, bedoeld in het tweede lid, aan de toetser of het toetsingsteam zenden
      welke na verwerking van het commentaar het toetsingsverslag definitief maakt en aan de accountantspraktijk of
      accountantsafdeling en aan het bestuur zendt.

      9 De accountantspraktijk of de accountantsafdeling kan binnen een door het bestuur te stellen termijn schriftelijk
      commentaar op het definitieve toetsingsverslag, bedoeld het achtste lid, aan het bestuur zenden.


