  - number: '3'
    text: |-
      De openbaar accountant en intern of overheidsaccountant draagt er zorg voor dat de accountantspraktijk
      of accountantsafdeling waarbij hij werkzaam is of waaraan hij is verbonden, beschikt over een stelsel van
      kwaliteitsbeheersing dat is afgestemd op de aard, omvang en het belang van de opdrachten en waarmee wordt voldaan
      aan het bepaalde bij en krachtens de [Wet op de Accountants-Administratieconsulenten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002856
    url: https://wetten.overheid.nl/BWBR0031878/2013-01-17#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002856
  - number: '4'
    text: |-
      De accountant verleent medewerking aan een toetsing een hertoetsing, een thematisch onderzoek of een
      incidentenonderzoek en stelt alle gegevens ter beschikking die nodig zijn voor een toetsing, een hertoetsing, een
      thematisch onderzoek of een incidentenonderzoek.
    url: https://wetten.overheid.nl/BWBR0031878/2013-01-17#Artikel4
  - number: '5'
    text: |-
      1 De voorzitter kan zijn bevindingen in de vorm van een klacht ter kennis van de accountantskamer brengen indien
      hem bij de uitoefening van het toezicht van feiten of omstandigheden blijkt die grond kunnen opleveren tot het
      opleggen van een tuchtrechtelijke maatregel, althans tot gegrondverklaring van de klacht.

      2 Indien bij een accountantspraktijk of accountantsafdeling meerdere accountants werkzaam zijn of aan een
      accountantspraktijk of accountantsafdeling meerdere accountants verbonden zijn, bepaalt de voorzitter voor de
      toepassing van het eerste lid, tegen welke accountant of accountants hij een klacht aanhangig maakt.
    url: https://wetten.overheid.nl/BWBR0031878/2013-01-17#Artikel5
  - number: '6'
    text: |-
      1 Het bestuur is belast met de selectie en opleiding van de toetsers.

      2 Voor de (her)toetsing van een accountantspraktijk of accountantsafdeling wijst het bestuur toetsers aan die
      voldoen aan nader door het bestuur te stellen eisen.

      3 Voor het uitvoeren van een thematisch onderzoek of incidentenonderzoek wijst het bestuur personen aan die over de
      specifieke kwalificaties beschikken om deze onderzoeken uit te voeren.
    url: https://wetten.overheid.nl/BWBR0031878/2013-01-17#Artikel6
  - number: '7'
    text: |-
      Een accountantspraktijk of accountantsafdeling wordt, om de kwaliteit van de beroepsuitoefening van een openbaar
      accountant, intern accountant of overheidsaccountant te kunnen beoordelen ten minste eenmaal in de zes jaar aan een
      toetsing onderworpen.
    url: https://wetten.overheid.nl/BWBR0031878/2013-01-17#Artikel7
  - number: '8'
    text: |-
      1 Teneinde inzicht te krijgen in de specifieke situatie van de accountantspraktijk of de accountantsafdeling wordt
      er door het bestuur aan de accountantspraktijk of aan de accountantsafdeling een jaarlijkse monitoringvragenlijst
      gestuurd. De dagelijks beleidsbepaler zorgt ervoor dat deze vragenlijst binnen een termijn van zes weken na
      ontvangst door de accountantspraktijk of de accountantsafdeling ingevuld wordt geretourneerd.

      2 Het bestuur kan een accountantspraktijk of accountantsafdeling op basis van risico-indicatoren aan een nader
      onderzoek onderwerpen.

      3 Het bestuur kan een accountantsorganisatie welke beschikt over een vergunning als bedoeld in
      [artikel 6 van de Wet toezicht accountantsorganisaties][ref1] periodiek bezoeken ter verkrijging van nadere
      inlichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel6
    url: https://wetten.overheid.nl/BWBR0031878/2013-01-17#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '6'
  - number: '9'
    text: |-
      1 Een toetsing van een accountantspraktijk houdt een onderzoek in waarbij wordt nagegaan of het stelsel
      van kwaliteitsbeheersing van de accountantspraktijk, niet betrekking hebbend op het verrichten van
      wettelijke controles door accountantsorganisaties welke beschikken over een vergunning als bedoeld in
      [artikel 6, tweede lid, van de Wet toezicht accountantsorganisaties][ref1], in opzet en werking voldoet aan het
      bij en krachtens de [Wet op de Accountants-Administratieconsulenten][ref2] bepaalde.

      2 Een toetsing van een accountantsafdeling houdt een onderzoek in waarbij wordt nagegaan of het stelsel
      van kwaliteitsbeheersing van de accountantsafdeling in opzet en werking voldoet aan het bij en krachtens de
      [Wet op de Accountants-Administratieconsulenten][ref3] bepaalde.

      3 De toetsing kan omvatten assuranceopdrachten met uitzondering van wettelijke controles
      verricht door accountantsorganisaties welke beschikken over een vergunning als bedoeld in
      [artikel 6, tweede lid, van de Wet toezicht accountantsorganisaties][ref4], aan assurance verwante opdrachten en
      overige opdrachten binnen de accountantspraktijk of de accountantsafdeling waar de accountant optreedt.

      4 De reikwijdte van de toetsing wordt bepaald door het bestuur.


