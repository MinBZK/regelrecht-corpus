  - number: '2'
    text: |-
      1 Het bestuur verleent, voor zover dat zich verdraagt met [afdeling 10.1.1 van de Algemene wet bestuursrecht][ref1],
      voor de uitoefening van de in deze verordening aan hem verstrekte bevoegdheden mandaat, volmacht en machtiging aan
      de Raad.

      2 Namens het bestuur kan de Raad binnen het gestelde in het eerste lid ondermandaat verlenen.

      3 Over de inrichting en samenstelling van de Raad worden bij verordening nadere regels gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.1.1
