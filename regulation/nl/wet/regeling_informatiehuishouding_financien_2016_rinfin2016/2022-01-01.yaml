---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_informatiehuishouding_financien_2016_rinfin2016
regulatory_layer: WET
publication_date: '2022-01-04'
valid_from: '2022-01-01'
bwb_id: BWBR0038056
url: https://wetten.overheid.nl/BWBR0038056/2022-01-01
preamble:
  text: |-
    Gelet op artikel 14 van het Archiefbesluit 1995;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel1
  - number: '1.1'
    text: |-
      *afgesloten archief:* een niet meer actueel archief dat betrekking heeft op een voltooid werkproces en dat in
      principe onveranderlijk is.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel1
  - number: '1.2'
    text: '*archief:* geheel van archiefbescheiden, ontvangen of opgemaakt door het ministerie of een onderdeel hiervan.'
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel1
  - number: '1.3'
    text: |-
      *archiefbeheer:* de feitelijke of uitvoerende werkzaamheden om archiefbescheiden (fysiek of digitaal) in goede,
      geordende en toegankelijke staat te brengen te bewaren of over te brengen, als ook om archiefbescheiden die
      daarvoor in aanmerking komen te vernietigen.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel1
  - number: '1.4'
    text: |-
      *archiefbeheerder:* degene die namens de secretaris-generaal verantwoordelijk is voor het laten uitvoeren van een
      effectief en efficiënt archiefbeheer voor de onder hem vallende archiefvormende onderdelen.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel1
  - number: '1.5'
    text: |-
      *archiefbeherend onderdeel:* de organisatie die tot taak heeft de feitelijke uitvoerende werkzaamheden met
      betrekking tot het archiefbeheer uit voeren.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel1
  - number: '1.6'
    text: '*archiefbescheiden [fysiek én digitaal]:*'
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel1
  - number: 1.6.a
    text: |-
      bescheiden, ongeacht hun vorm, door het ministerie ontvangen of opgemaakt en naar hun aard bestemd daaronder te
      berusten;
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel1
  - number: 1.6.b
    text: |-
      bescheiden, ongeacht hun vorm, met overeenkomstige bestemming, ontvangen of opgemaakt door instellingen of
      personen, wier rechten of functies op het ministerie zijn overgegaan;
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel1
  - number: 1.6.c
    text: |-
      bescheiden, ongeacht hun vorm, welke ingevolge overeenkomsten met of beschikkingen van instellingen of personen dan
      wel uit anderen hoofde in een archiefbewaarplaats zijn opgenomen om daar te berusten;
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel1
  - number: 1.6.d
    text: |-
      reproducties, ongeacht hun vorm, welke bij of krachtens de wet in de plaats zijn gesteld van de onder 1°., 2°. of
      3°. bedoelde bescheiden of welke op grond van een machtiging tot substitutie zijn vervaardigd.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel1
  - number: '1.7'
    text: |-
      *archiefvormend onderdeel:* een al dan niet tijdelijk onderdeel van het ministerie, dan wel van een ander
      overheidsorgaan, dat werkzaamheden verricht onder de verantwoordelijkheid van de minister en waarvoor afzonderlijk
      wordt gearchiveerd. Binnen het ministerie van Financiën vallen daaronder ook buitendiensten, raden, commissies en
      programma- of projectorganisaties.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel1
  - number: '1.8'
    text: |-
      *bestand:* groep gegevens of documenten die in onderlinge samenhang is te raadplegen en met een bepaald doel
      bijeengebracht is.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel1
  - number: '1.9'
    text: |-
      *bewaartermijn:* de termijn waarin archiefbescheiden in goede, geordende en toegankelijke staat moeten blijven en
      waarna vernietiging van deze archiefbescheiden moet plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel1
  - number: '1.10'
    text: |-
      *Chief Information Officer (CIO):* de functionaris bij het kerndepartement of bij de Belastingdienst die
      verantwoordelijk is voor het strategische beleid voor informatievoorziening en ICT en die de toepassing van
      rijksbrede kaders op dit terrein bewaakt.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel1
  - number: '1.11'
    text: |-
      *directeur Bedrijfsvoering:* de functionaris die belast is met de uitvoering van het archiefbeheer voor het
      kerndepartement van Financiën; niet voor de Belastingdienst.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel1
  - number: '1.12'
    text: |-
      *documentmanagementsysteem:* een opslagplaats of ‘repository’ waarin beschrijvende metadata van documenten worden
      opgeslagen die makkelijk zijn terug te vinden aan de hand van de kenmerken zoals auteur, naam, omschrijving, datum,
      categorie en status. De documenten zelf kunnen ook in de database worden opgeslagen, of op een beveiligde (netwerk)
      locatie die via de database toegankelijk is.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel1
  - number: '1.13'
    text: '*DWR:* Digitale Werkomgeving Rijksdienst, de standaard digitale werkomgeving voor alle Nederlandse rijksambtenaren.'
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel1
  - number: '1.14'
    text: |-
      *DWR-archief:* een stelsel van voorzieningen en diensten dat ten doel heeft de goede, geordende en toegankelijke
      staat van digitale archieven op lange termijn te garanderen.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel1
  - number: '1.15'
    text: |-
      *e-depot:* het digitale archiefsysteem van het Nationaal Archief dat de duurzame toegankelijkheid en de duurzame
      opslag met garanties voor authenticiteit, integriteit en volledigheid van te bewaren digitale archiefbescheiden
      garandeert.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel1
  - number: '1.16'
    text: |-
      *lopend archief:* actueel archief waarin een archiefvormend onderdeel nieuwe documenten en dossiers opslaat, die
      betrekking hebben op een nog onvoltooid werkproces.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel1
  - number: '1.17'
    text: |-
      *metadata:* gegevens die over documenten, zaken en dossiers worden vastgelegd. Het doel van het vastleggen van
      metadata is om de documenten, zaken en dossiers in het documentmanagementsysteem terugvindbaar én beheerbaar te
      maken.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel1
  - number: '1.18'
    text: |-
      *minister:* de minister van Financiën is de zorgdrager voor het ministerie van Financiën zoals bedoeld in
      [artikel 1 van de Archiefwet 1995][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel1
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '1'
  - number: '1.19'
    text: '*ministerie:* het ministerie van Financiën.'
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel1
  - number: '1.20'
    text: |-
      *overbrenging:* het overbrengen van blijvend te bewaren archiefbescheiden naar een archiefbewaarplaats (Nationaal
      Archief).
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel1
  - number: '1.21'
    text: |-
      *overdracht:* het overdragen van archiefbescheiden aan een ander organisatieonderdeel van het ministerie; dus
      alleen intern het ministerie.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel1
  - number: '1.22'
    text: |-
      *RMA:* een Records Management Applicatie ondersteunt alle functionaliteiten die nodig zijn om digitale
      archiefbescheiden gedurende hun bewaartermijn in goede, geordende en toegankelijke staat te beheren.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel1
  - number: '1.23'
    text: |-
      *selectielijst:* het wettelijk voorgeschreven instrument voor de selectie van te bewaren en te vernietigen
      overheidsarchieven, inclusief de selectietermijn, bedoeld in [artikel 5 van de Archiefwet 1995][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel5
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '5'
  - number: '1.24'
    text: |-
      *SIO:* Strategisch Informatie Overleg. In het SIO overleggen de Chief Information Officers (CIO’s) van de
      departementen met de Algemeen Rijksarchivaris over de stand van zaken, doelstellingen en prioriteiten van de
      informatiehuishouding van het departement. Dit draagt bij aan het op orde brengen van de informatiehuishouding en
      raakt daarmee aan één van de grondbeginselen van goed openbaar bestuur, namelijk het afleggen van verantwoording
      aan de Tweede Kamer en de maatschappij.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel1
  - number: '1.25'
    text: |-
      *vernietiging:* het zodanig materieel behandelen van de informatiedrager (o.a. papier, geluidsband, film, usb
      stick), dat de daarop vastgelegde informatie niet meer te reconstrueren is.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel1
  - number: '1.26'
    text: |-
      *vervanging:* de routinematige vervanging van archiefbescheiden door reproducties, die volledig de plaats innemen
      van de oorspronkelijke bescheiden.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel1
  - number: '1.27'
    text: '*vervreemding:* het in eigendom overdragen van archiefbescheiden aan een andere zorgdrager of aan derden.'
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel1
  - number: '1.28'
    text: |-
      *zorgdrager:* degene die bij of krachtens de wet belast is met de zorg voor de archiefbescheiden. In dit geval de
      minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel1
  - number: '2.1'
    text: |-
      De *Regeling Informatiehuishouding Financiën 2016* is van toepassing op het beheer van alle archiefbescheiden van
      het kerndepartement van Financiën, inclusief de Audit Dienst Rijk (ADR) en de Dienst Roerende Zaken (DRZ) maar
      met uitzondering van de personeelsdossiers van ambtenaren werkzaam bij het ministerie van wie de P-dossiers zijn
      ondergebracht bij de Rijksbrede Centrale Archiefvoorziening voor Personeelsdossiers (CAP) van P-Direkt.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel2
  - number: '2.2'
    text: |-
      De *Regeling Informatiehuishouding Financiën 2016* is niet van toepassing op het beheer van de archiefbescheiden
      van de Belastingdienst. Ten aanzien van de Belastingdienst worden afzonderlijke beheersregels vastgesteld.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel2
  - number: '2.3'
    text: |-
      De*Regeling Informatiehuishouding Financiën 2016* is geldig voor alle archiefbescheiden, zowel voor de digitale als
      voor de papieren archiefbescheiden. Bij het archiveren van nieuwe documenten is het digitale archief leidend. De
      documentaire informatievoorziening dient hoofdzakelijk digitaal te verlopen, tenzij een bijzondere omstandigheid of
      de wet voorschrijft papieren documenten te gebruiken.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel2
  - number: '3.1'
    text: '*De minister van Financiën*'
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: 3.1.a
    text: |-
      De minister is de zorgdrager voor de archiefbescheiden van het ministerie, bedoeld in
      [artikel 1, onderdeel d, van de Archiefwet 1995][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel1
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '1'
  - number: 3.1.b
    text: De minister stelt hiervoor beheersregels vast en draagt zorg voor de publicatie hiervan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: '3.2'
    text: '*De secretaris-generaal*'
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: 3.2.a
    text: |-
      De secretaris-generaal is namens de minister verantwoordelijk voor de zorg voor het beheer van de archiefbescheiden
      van het ministerie en voor de voorwaarden om goed archiefbeheer mogelijk te maken.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: 3.2.b
    text: De secretaris-generaal is verantwoordelijk voor de kwaliteit van het archiefbeheer bij het ministerie.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: 3.2.c
    text: De secretaris-generaal mandateert deze verantwoordelijkheid aan afzonderlijke archiefbeheerders.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: '3.3'
    text: '*De Chief Information Officer (CIO)*'
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: 3.3.a
    text: Het kerndepartement van het ministerie en de Belastingdienst hebben ieder een eigen Chief Information Officer.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: 3.3.b
    text: |-
      De Chief Information Officer van het kerndepartement stelt strategische beleids-, kwaliteits- en toetsingskaders op
      het gebied van het document- en archiefbeheer vast.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: 3.3.c
    text: |-
      De Chief Information Officer van het kerndepartement houdt toezicht op de naleving van de bepalingen van de
      beheersregels.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: 3.3.d
    text: |-
      Chief Information Officer van het kerndepartement coördineert, adviseert en informeert de archiefbeheerder over
      activiteiten waarmee de effectiviteit en efficiëntie van het archiefbeheer binnen het ministerie is gediend.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: 3.3.e
    text: |-
      De Chief Information Officer van het kerndepartement neemt deel aan het Strategisch Informatie overleg (SIO) met
      het Nationaal Archief.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: '3.4'
    text: '*De archiefbeheerders*'
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: 3.4.a
    text: |-
      Voor het ministerie worden hierin onderscheiden: de directeur Bedrijfsvoering voor het kerndepartement en de
      directeur-generaal voor de Belastingdienst.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: 3.4.b
    text: |-
      De archiefbeheerders zijn namens de secretaris-generaal verantwoordelijk voor het laten uitvoeren van een effectief
      en efficiënt archiefbeheer voor de onder hem/haar vallende archiefvormende onderdelen in overeenstemming met het
      bepaalde in de beheersregels en andere van toepassing zijnde regelgeving.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: 3.4.c
    text: De archiefbeheerders leggen verantwoording af aan de secretaris-generaal.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: 3.4.d
    text: |-
      De archiefbeheerder kerndepartement is verantwoordelijk voor vastgestelde beheersregels voor het archiefbeheer van
      de onder hem/haar ressorterende archiefvormende onderdelen.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: 3.4.e
    text: |-
      Nadere regels, richtlijnen en procedures voor de uitvoering van het archiefbeheer worden door de archiefbeheerder
      kerndepartement vastgesteld.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: 3.4.f
    text: |-
      Het feitelijke archiefbeheer laat de archiefbeheerder kerndepartement uitvoeren door het onder zijn
      verantwoordelijkheid vallend archiefbeherend onderdeel; dit kan ook een externe partij zijn die werkt onder een
      contract of een Dienst Verlenings Overeenkomst (DVO).
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: '3.5'
    text: '*De archiefvormende onderdelen*'
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: 3.5.a
    text: Archiefvormende onderdelen zijn de binnen het ministerie te onderscheiden dienstonderdelen (directies).
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: 3.5.b
    text: |-
      Onder archiefvormende onderdelen worden tevens begrepen de tijdelijke raden, formeel ingestelde commissies en
      projectorganisaties die onder de archiefwettelijke zorg van de minister vallen.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: 3.5.c
    text: |-
      Onder archiefvormende onderdelen worden tevens begrepen de zelfstandige bestuursorganen en geprivatiseerde
      onderdelen waarvan de archieven van voor de verzelfstandiging dan wel privatisering onder de archiefwettelijke
      zorg van de minister vallen, dan wel publiekrechtelijke zelfstandige bestuursorganen zonder rechtspersoonlijkheid
      (zie [bijlage I][ref1]).


      [ref1]: https://wetten.overheid.nl/BWBR0038056
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0038056
  - number: 3.5.d
    text: |-
      De archiefvormende onderdelen verzamelen, ontvangen en/of creëren en bewaren gegevens nodig voor hun activiteiten
      en handelingen op hun beleidsterrein. Dit zijn archiefbescheiden in de zin van de [Archiefwet 1995][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: 3.5.e
    text: De archiefvormende onderdelen zijn in deze hoedanigheid als gegevenseigenaar aan te merken.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: 3.5.f
    text: |-
      De archiefvormende onderdelen zijn ervoor verantwoordelijk hun archiefbescheiden in beheer over te dragen aan hun
      archiefbeherend onderdeel in overeenstemming met het bepaalde in deze *Regeling Informatiehuishouding Financiën
      2016* en de hierover onderling nader gemaakte afspraken.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: '3.6'
    text: '*Het archiefbeherende onderdeel (kerndepartement)*'
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: 3.6.a
    text: |-
      Het archiefbeherend onderdeel zorgt voor voldoende en geschikte archiefruimte, voor voldoende en deskundig
      personeel en voor voldoende financiële middelen.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: 3.6.b
    text: |-
      Het archiefbeherend onderdeel heeft tot taak de archiefbescheiden in goede, geordende en toegankelijke staat
      te brengen en te bewaren als ook zorg te dragen voor de vernietiging van de daarvoor in aanmerking komende
      archiefbescheiden in overeenstemming met het bepaalde in deze *Regeling Informatiehuishouding Financiën 2016* en
      andere van toepassing zijnde regelgeving.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: 3.6.c
    text: |-
      Het archiefbeherend onderdeel stelt beheersregels op, onderhoudt deze en zorgt voor de interne verspreiding en
      voorlichting.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: 3.6.d
    text: |-
      Het archiefbeherend onderdeel stelt voor de uitvoering van haar taken zo nodig nadere regels, richtlijnen en
      procedures op.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: 3.6.e
    text: |-
      Het archiefbeherend onderdeel maakt daar waar nodig afspraken met het management van de archiefvormende onderdelen
      over de uitvoering van het archiefbeheer.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: 3.6.f
    text: |-
      Het archiefbeherend onderdeel geeft periodiek aan welke activiteiten en middelen nodig zijn voor het uitvoeren van
      het archiefbeheer.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: 3.6.g
    text: |-
      Het archiefbeherend onderdeel is in alle gevallen verantwoordelijk voor het in goede, geordende en toegankelijke
      staat vervreemden, overdragen of overbrengen van archief.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: 3.6.h
    text: |-
      Het archiefbeherend onderdeel legt over de uitvoering van haar archiefbeheer verantwoording af aan de
      archiefbeheerder.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: 3.6.i
    text: |-
      Medewerkers van het archiefbeherend onderdeel hebben volledige toegang tot de informatie in het
      documentmanagementsysteem. Gerubriceerde documenten zijn alleen toegankelijk voor medewerkers van het
      archiefbeherend onderdeel met een AIVD screening.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: '3.7'
    text: '*De medewerker*'
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: 3.7.a
    text: |-
      Elke medewerker draagt er zorg voor dat hij door hem behandelde archiefbescheiden op de juiste manier opneemt in
      het documentmanagementsysteem of op correcte wijze ter opname aanbiedt aan de beheerder van het lopende archief.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: 3.7.b
    text: Elke medewerker voorziet de door hem behandelde digitale archiefbescheiden van de vereiste metagegevens.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: 3.7.c
    text: |-
      Elke medewerker gaat zorgvuldig en integer om met archiefbescheiden en neemt in het bijzonder discretie in acht als
      archiefbescheiden persoonsgegevens of andere vertrouwelijke informatie bevatten.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: 3.7.d
    text: |-
      Als een medewerker een informatiebeveiligingsincident constateert dat de belangen van personen, de eigen
      organisatie of andere organisaties schaadt of heeft geschaad, stelt hij hiervan direct z’n leidinggevende op
      de hoogte en meldt hij dit volgens de voorgeschreven incidentenmeldingsprocedure. In geval van gerubriceerde
      informatie wordt ook de BVA (Beveiligingsambtenaar) hiervan verwittigd.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: '3.8'
    text: '*De raden, commissies en programma- en/of projectorganisaties*'
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: 3.8.a
    text: |-
      De secretarissen van raden, formeel ingestelde commissies en project- en/of programmadirecties beheren hun
      archief in overleg met het archiefbeherend onderdeel. Zij brengen het archiefbeherend onderdeel op de hoogte
      van de instelling van de raad, commissie of projectorganisatie, bij voorkeur door middel van een kopie van de
      instellingsbeschikking.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: 3.8.b
    text: |-
      De secretarissen zorgen ervoor dat zij, zodra dit mogelijk is, afgesloten archiefbestanddelen overdragen aan het
      betrokken archiefbeherend onderdeel. Bij opheffing dragen de secretarissen het archief in goede en geordende staat
      direct over aan het betrokken archiefbeherend onderdeel.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: 3.8.c
    text: |-
      De projectsecretaris is verantwoordelijk voor een projectarchief dat toegankelijk is en alle archiefwaardige
      projectstukken bevat (o.a. vergaderstukken, projectdocumenten, formele besluitvormingsstukken).
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: '3.9'
    text: '*De private partijen*'
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: 3.9.a
    text: |-
      Externe private partijen die in opdracht van het ministerie werken en daarbij archiefbescheiden produceren, zijn
      verantwoordelijk voor hun eigen archiefbeheer.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: 3.9.b
    text: |-
      Als een private partij bij de uitvoering van een opdracht archiefbescheiden van het ministerie zal vormen, dient de
      opdrachtverstrekking afspraken te behelzen omtrent het beheer van de archiefbescheiden en de overdracht hiervan aan
      het ministerie na afloop van de opdracht.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: 3.9.c
    text: |-
      Het hoofd van de private partij is in alle gevallen verantwoordelijk voor het in goede, geordende en toegankelijke
      staat aanleveren van het afgesloten archief aan het archiefbeherend onderdeel.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel3
  - number: '4.1'
    text: |-
      De verantwoordelijkheid voor het identificeren en registreren van nieuwe archiefbescheiden berust bij de
      behandelend medewerker. Direct bij binnenkomst of bij creatie van documenten beoordeelt de behandelend medewerker,
      op grond van de geldende registratiecriteria, of het archiefbescheiden betreft. Vervolgens registreert hij nieuwe
      archiefbescheiden door ze in het juiste dossier op te slaan. Het archiefbeherend onderdeel speelt hierbij een
      faciliterende rol.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel4
  - number: '4.2'
    text: |-
      Bij het opslaan in een dossier krijgen nieuwe documenten de vereiste metagegevens toegekend, overeenkomstig het
      metagegevensschema gebruikt voor het documentmanagementsysteem. De metagegevens zijn zowel voorgeschreven op
      documentniveau, als op dossierniveau. Ieder document krijgt dus zowel documentgebonden metagegevens, als ook
      metagegevens die bij het betreffende dossier horen. Het archiefbeherend onderdeel speelt hierbij een faciliterende
      rol.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel4
  - number: '4.3'
    text: |-
      Het archiefbeherend onderdeel stelt dossiers beschikbaar, waarin de medewerkers nieuwe documenten opslaan.
      Bij aanmaak van deze dossiers legt het archiefbeherend onderdeel in samenspraak met de gegevenseigenaar
      direct metagegevens van het dossier vast. Eén van deze metagegevens is de waardering, die overeenkomstig de in
      [artikel 13][ref1] genoemde selectielijst gekoppeld is aan het werkproces waarvan het dossier deel uitmaakt. Een
      ander metadatagegeven is het al dan niet vertrouwelijk zijn van een dossier.


      [ref1]: https://wetten.overheid.nl/BWBR0038056#Artikel13
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0038056
        artikel: '13'
        hoofdstuk: '4'
  - number: '4.4'
    text: |-
      Het archiefbeherend onderdeel draagt zorg voor de digitale vervanging en opname in een documentmanagementsysteem
      van (nieuwe) papieren archiefbescheiden, mits deze documenten voor digitale vervanging in aanmerking komen. Hierbij
      volgt het archiefbeherend onderdeel de bepalingen in [artikel 14][ref1] betreffende vervanging.


      [ref1]: https://wetten.overheid.nl/BWBR0038056#Artikel14
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0038056
        artikel: '14'
        hoofdstuk: '4'
  - number: '4.5'
    text: |-
      De behandelende archiefvormende onderdelen zijn verantwoordelijk voor het afdoen van de archiefbescheiden binnen
      de vastgestelde termijn. Indien de afdoeningstermijn niet wettelijk is voorgeschreven bepalen de behandelende
      archiefvormende onderdelen zelf de afdoeningstermijn voor de archiefbescheiden.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel4
  - number: '5.1'
    text: |-
      De archiefbeheerder stelt de ordeningsstructuur vast voor het lopende archief, gebaseerd op de taken en
      werkprocessen van de betreffende directie.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel5
  - number: '5.2'
    text: |-
      Het archiefbeherend onderdeel bewaart de gehanteerde ordeningsstructuur als onderdeel van het betreffende archief.
      Na eventuele aanpassing van de ordeningsstructuur bewaart de archiefbeheerder de oorspronkelijke versie tezamen met
      de nieuwe versie.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel5
  - number: '5.3'
    text: |-
      Het archiefbeherend onderdeel zorgt voor de koppeling van de dossiers aan de werkprocessen en voor onderlinge
      samenhang tussen de dossiers conform de ordeningsstructuur.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel5
  - number: '5.4'
    text: |-
      De medewerkers van een archiefvormend onderdeel voegen in een dossier alle archiefbescheiden samen, die op een zaak
      betrekking hebben, tenzij de directeur van een archiefvormend onderdeel bepaalt dat dit niet doelmatig is.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel5
  - number: '5.5'
    text: |-
      De directeur van een archiefvormend onderdeel bepaalt aan de hand van de werkprocessen welke documenten een dossier
      uiteindelijk moet bevatten om volledig te zijn en welke documenten archiefwaardig zijn. De directeur is in zijn
      hoedanigheid van gegevenseigenaar ook eindverantwoordelijk voor de volledigheid en de integrale kwaliteit van de
      dossiers.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel5
  - number: '5.6'
    text: |-
      De apparatuur, besturingsprogrammatuur of toepassingsapparatuur waarmee ordening en toegankelijkheid van digitale
      archiefbescheiden is gerealiseerd, vormt een onverbrekelijke eenheid met de archiefbescheiden waarop ze zijn
      toegepast.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel5
  - number: '6.1'
    text: Het archiefbeherend onderdeel treedt in overleg met het archiefvormend onderdeel over het afsluiten van dossiers.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel6
  - number: '6.2'
    text: |-
      Bij het afsluiten van een dossier wordt gecontroleerd op volledigheid en juistheid. Het archiefvormende onderdeel
      is hiervoor verantwoordelijk.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel6
  - number: '6.3'
    text: |-
      Bij het afsluiten van het dossier moeten de metagegevens de waardering van het dossier vermelden, namelijk of de
      archiefbescheiden in het dossier bestemd zijn voor blijvend bewaren of (op termijn) vernietigen.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel6
  - number: '6.4'
    text: |-
      Ten aanzien van gerubriceerde archiefbescheiden moeten de metagegevens bij het afsluiten van het dossier vermelden,
      wie er recht hebben op inzage en wanneer de rubricering kan vervallen.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel6
  - number: '6.5'
    text: |-
      Het archiefbeherend onderdeel laat in overeenstemming met het archiefvormend onderdeel in de metagegevens
      vastleggen dat het dossier is afgesloten.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel6
  - number: '6.6'
    text: |-
      Als een dossier eenmaal is afgesloten, blijft het in principe onveranderlijk. Alleen op grond van zwaarwegende
      argumenten kan de directeur van het archiefvormend onderdeel besluiten om een afgesloten dossier tijdelijk te
      heropenen, met name om een geconstateerd mankement te verhelpen dat de volledigheid, authenticiteit of integriteit
      van het afgesloten dossier in het geding brengt.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel6
  - number: '6.7'
    text: |-
      Het toevoegen of verwijderen van archiefbescheiden in een afgesloten dossier, is voorbehouden aan het
      archiefbeherend onderdeel.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel6
  - number: '7.1'
    text: |-
      Het ministerie en haar medewerkers maken gebruik van documentmanagementsystemen voor het dagelijks beheer en de
      opslag van digitale archiefbescheiden. Het documentmanagementsysteem voldoet aan de geldende wet- en regelgeving.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel7
  - number: '7.2'
    text: |-
      Het archiefbeherend onderdeel ontwikkelt en onderhoudt in overleg met de archiefvormende onderdelen instrumenten
      voor de informatieontsluiting van de archiefbescheiden en de daarin aanwezige gegevens. Daartoe behoort ook het
      rekening houden met de eventueel ingerichte beperkingen voor de raadpleegbaarheid.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel7
  - number: '7.3'
    text: |-
      Het ontsluiten van de archiefbescheiden wordt zodanig verricht, dat het gebruik van de hierin aanwezige gegevens in
      combinatie met andere gegevensverzamelingen mogelijk is.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel7
  - number: '8.1'
    text: |-
      Voor elk binnen het ministerie gebruikt documentmanagementsysteem moet een metagegevensschema beschikbaar zijn, dat
      duidelijk omschrijft welke metagegevens ten minste aan documenten of dossiers gekoppeld moeten zijn.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel8
  - number: '8.2'
    text: |-
      De op grond van een metagegevensschema’s toegekende metagegevens zijn het resultaat van het toepassen van het
      *Toepassingsprofiel Metagegevens Rijksoverheid* en maakt het te allen tijde mogelijk van digitale archiefbescheiden
      het gedrag vast te stellen.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel8
  - number: '10.1'
    text: |-
      Om de archieven in goede, geordende en toegankelijke staat te houden, maakt het ministerie bij het vormen en
      bewaren van permanent te bewaren archiefbescheiden gebruik van standaarden en procedures die voldoen aan de eisen
      gesteld in de [Archiefregeling 2009][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027041
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0027041
  - number: '10.2'
    text: |-
      De archiefbeheerder draagt er eveneens zorg voor, dat niet permanent te bewaren archiefbescheiden gedurende hun
      bewaartermijn in goede, geordende en toegankelijke staat blijven.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel10
  - number: '10.3'
    text: |-
      De archiefbeheerder voert onder verantwoordelijkheid van de directeuren van de archiefvormende onderdelen
      kwaliteitscontroles uit op de archieven binnen het ministerie, om de duurzame toegankelijkheid van de archieven
      te garanderen. Hierbij dienen de [Archiefregeling 2009][ref1] en de *Baseline Informatiehuishouding Rijksoverheid
      (BIHR)* als richtlijn voor goed archiefbeheer.


      [ref1]: https://wetten.overheid.nl/BWBR0027041
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0027041
  - number: '11.1'
    text: |-
      Het archiefbeherend onderdeel draagt zorg voor het technische onderhoud van de digitale archiefbescheiden onder
      zijn beheer, om de blijvende toegankelijkheid en leesbaarheid te borgen met inachtneming van de authenticiteit en
      betrouwbaarheid van de archiefbescheiden.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel11
  - number: '11.2'
    text: |-
      De archiefbeheerder kan door middel van een overeenkomst afgesloten digitale archiefbestanden bij derden op laten
      slaan in een speciaal daarvoor bestemde digitale archieffaciliteit (e-depot) die voldoet aan de voorschriften in de
      [Archiefregeling 2009][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027041
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0027041
  - number: '11.3'
    text: |-
      De archiefbeheerder kan voor de opslag van afgesloten digitale archiefbestanden gebruik maken van een speciaal
      daarvoor bestemde digitale archieffaciliteit (Record Management Applicatie) die voldoet aan de voorschriften in de
      [Archiefregeling 2009][ref1]*(DWR-archief)*.


      [ref1]: https://wetten.overheid.nl/BWBR0027041
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0027041
  - number: '11.4'
    text: |-
      Het is de norm dat medewerkers gebruik maken van standaard via de DWR-werkplek aangeboden
      kantoorautomatiseringsapplicaties (inclusief het standaard documentmanagementsysteem), opdat zij digitale
      archiefbescheiden in uniforme formaten aanmaken. Daarnaast kunnen andere computerapplicaties aangewezen worden als
      digitaal archiefbestand (bv financiële administraties). Deze worden vastgelegd in een apart overzicht.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel11
  - number: '11.5'
    text: Digitale archiefbescheiden worden in principe bewaard in het formaat waarin ze zijn aangemaakt.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel11
  - number: '12.1'
    text: |-
      Indien papieren archiefbescheiden door de aard van de gebruikte materialen niet (langer) voldoen aan het
      in [artikel 10][ref1] bepaalde, gaat de archiefbeheerder over tot vervanging van de archiefbescheiden door
      reproducties, als bedoeld in [artikel 14][ref2], tenzij het archiefbescheiden betreft die zijn uitgesloten van
      vervanging.


      [ref1]: https://wetten.overheid.nl/BWBR0038056#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0038056#Artikel14
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0038056
        artikel: '10'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0038056
        artikel: '14'
        hoofdstuk: '4'
  - number: '12.2'
    text: |-
      De archiefbeheerder kan door middel van een overeenkomst afgesloten papieren archiefbestanden op laten slaan bij
      derden in speciaal daarvoor bestemde archiefruimten die voldoen aan de voorschriften voor archiefruimten in de
      [Archiefregeling 2009][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027041
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0027041
  - number: '13.1'
    text: De archiefbeheerder is verantwoordelijk voor het beschikbaar stellen van een toepasbare vastgestelde selectielijst.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel13
  - number: '13.2'
    text: 'Een selectielijst is een systematische opsomming van categorieën archiefbescheiden, die:'
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel13
  - number: 13.2.a
    text: geordend is volgens de werkprocessen, in overeenstemming met de voor het archief geldende ordeningsstructuur;
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel13
  - number: 13.2.b
    text: per categorie archiefbescheiden ten minste de bewaartermijn aangeeft;
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel13
  - number: 13.2.c
    text: aangeeft voor welke periode zij geldig is.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel13
  - number: '13.3'
    text: |-
      Het archiefbeherend onderdeel zorgt ervoor dat de vastgestelde selectielijst(en) bij het archiefbeheer worden
      toegepast.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel13
  - number: '13.4'
    text: |-
      Indien door taakveranderingen van een archiefvormend onderdeel een selectielijst niet meer aansluit bij de
      gewijzigde taken, draagt de archiefbeheerder zorg voor het ontwerp van een nieuwe selectielijst, waarbij de
      archiefbeheerder namens het archiefvormend onderdeel actualiseringvoorstellen doet.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel13
  - number: '13.5'
    text: |-
      Het vaststellen van nieuwe selectielijsten verloopt conform de
      [artikelen 2 tot en met 5 van het Archiefbesluit 1995][ref1]. De secretaris-generaal tekent nieuwe selectielijsten.


      [ref1]: https://wetten.overheid.nl/BWBR0007748#Artikel2
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007748
        artikel: '2'
  - number: '14.1'
    text: |-
      De secretaris-generaal kan besluiten over te gaan tot vervanging van archiefbescheiden door gelijkluidende
      reproducties, tenzij het archiefbescheiden betreft die zijn uitgesloten van vervanging. Vereist is dat de
      vervanging geschiedt met de juiste en volledige weergave van de in de te vervangen archiefbestanden voorkomende
      gegevens. De vernietiging van de vervangen originelen is onverbrekelijk onderdeel van het vervangingsproces.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel14
  - number: '14.2'
    text: |-
      Voor zover het voor bewaring bestemde bescheiden betreft, geeft de secretaris-generaal in zijn besluit tot
      vervanging inzicht in het toegepaste vervangingsproces (*Handboek Vervangingsbesluit*), overeenkomstig de
      [Archiefregeling 2009][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027041
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0027041
  - number: '14.3'
    text: |-
      De secretaris-generaal geeft in zijn besluit tot vervanging een overzicht van de categorieën archiefbescheiden die
      zijn uitgesloten van vervanging.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel14
  - number: '14.4'
    text: |-
      Van de vervanging van archiefbescheiden laat het archiefbeherend onderdeel een verklaring opmaken, die ten minste
      een specificatie van de vervangen archiefbescheiden behelst.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel14
  - number: '15.1'
    text: |-
      Vernietiging van archiefbescheiden vindt uitsluitend plaats op grond van een selectielijst als bedoeld in
      [artikel 13][ref1], of na vervanging van de betreffende archiefbescheiden door reproducties zoals bedoeld in
      [artikel 14][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0038056#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0038056#Artikel14
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0038056
        artikel: '13'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0038056
        artikel: '14'
        hoofdstuk: '4'
  - number: '15.2'
    text: |-
      Het archiefbeherend onderdeel draagt in overleg met het betrokken archiefvormend onderdeel zorg voor de
      vernietiging op grond van de selectielijst van daarvoor in aanmerking komende archiefbestanddelen, zo snel mogelijk
      na het verstrijken van de daarvoor in de selectielijst vastgestelde termijn en vóór dat overbrenging van het
      archief naar een archiefbewaarplaats plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel15
  - number: '15.3'
    text: |-
      Het archiefbeherend onderdeel stelt het archiefvormend onderdeel op de hoogte van het voornemen tot vernietiging
      en overlegt met het archiefvormend onderdeel, of onderdelen van het archief wellicht uitgezonderd moeten worden van
      vernietiging en juist moeten worden bewaard en zo ja, op welke grond.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel15
  - number: '15.4'
    text: |-
      Van de vernietiging stelt het archiefbeherend onderdeel een verklaring op, die ten minste een specificatie van de
      vernietigde archiefbescheiden behelst en die vermeldt op welke grond de vernietiging heeft plaatsgevonden en op
      welke wijze. De verantwoordelijk directeur van het betrokken archiefvormend onderdeel ondertekent de verklaring van
      vernietiging evenals de archiefbewaarder. De archiefbeheerder bewaart de verklaring van vernietiging blijvend in
      het archief.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel15
  - number: '15.5'
    text: |-
      Vernietiging van de archiefbescheiden vindt plaats onder verantwoordelijkheid van het archiefbeherend onderdeel.
      Voor gerubriceerd archief gelden specifieke, strengere regels.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel15
  - number: '15.6'
    text: |-
      Indien op grond van [artikel 9 lid 2 van de Archiefwet 1995][ref1] in bijzondere omstandigheden moet worden
      afgeweken van de voorgeschreven vernietigingsprocedures, draagt het archiefbeherend onderdeel zorg voor de
      uitvoering van de dan geldende regels voor noodvernietiging.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel9
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '9'
  - number: '16.1'
    text: |-
      De archiefbeheerder is verantwoordelijk voor de overbrenging van de daarvoor in aanmerking komende
      archiefbescheiden naar een archiefbewaarplaats. De selectielijst, zoals beschreven in [artikel 13][ref1], is in dit
      proces leidend. De archiefbeheerder brengt de daarvoor in aanmerking komende archiefbescheiden in principe twintig
      jaar na het afsluiten van het dossier over naar een archiefbewaarplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0038056#Artikel13
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0038056
        artikel: '13'
        hoofdstuk: '4'
  - number: '16.2'
    text: |-
      De archiefbeheerder is ervoor verantwoordelijk dat de naar het Nationaal Archief over te brengen archiefbescheiden
      voldoen aan de geldende normen van goede, geordende en toegankelijke staat.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel16
  - number: '16.3'
    text: |-
      Indien op het tijdstip van overbrenging de over te dragen archiefbescheiden zijn versleuteld door middel van
      encryptietechniek, verstrekt de archiefbeheerder de bijbehorende decryptiesleutel aan de beheerder van de
      archiefbewaarplaats.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel16
  - number: '16.4'
    text: |-
      Gebruikmaking van compressietechniek is alleen toegestaan, als het eventuele verlies aan informatie geen bedreiging
      vormt voor het voldoen aan de eisen ten aanzien van de goede, geordende en toegankelijke staat van digitale
      archiefbescheiden.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel16
  - number: '16.5'
    text: |-
      Ter voorbereiding op de overbrenging overlegt de archiefbeheerder met de directeur van het archiefvormend onderdeel
      over het al dan niet stellen van beperkingen aan de openbaarheid.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel16
  - number: '16.6'
    text: |-
      De archiefbeheerder laat de over te brengen archiefbescheiden voorzien van een document dat vermeldt hoe de
      duurzaamheid, de ordening en toegankelijkheid zijn geregeld. Van de overbrenging van archiefbescheiden laat
      de archiefbeheerder een *Verklaring van Overbrenging* (VvO) opmaken, die een specificatie van de overgebrachte
      archiefbescheiden bevat, die de grondslag aangeeft op basis waarvan de overbrenging plaatsvindt. Als er geen
      beperkende bepalingen zijn, ondertekent de archiefbeheerder de *Verklaring van Overbrenging* en bewaart deze
      blijvend in zijn archief. Indien er wel beperkende bepalingen zijn ondertekent de secretaris-generaal. De beperking
      wordt gepubliceerd in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel16
  - number: '16.7'
    text: De archiefbeheerder kan beslissen dat het wenselijk is de overbrenging van bepaalde dossiers op te schorten.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel16
  - number: '16.8'
    text: |-
      Bij opschorting van overbrenging zijn de openbaarheidsregels van de [Archiefwet 1995][ref1] op de niet
      overgebrachte archiefbescheiden van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: '17.1'
    text: |-
      Indien een directie de verantwoordelijkheid voor archiefbescheiden overdraagt aan een andere directie, stelt
      het archiefbeherend onderdeel een verklaring op, die een specificatie van de overgedragen archiefbescheiden
      bevat. Zowel de overdragende als de ontvangende directeur ondertekenen de *Verklaring van Overdracht* (VvO). Het
      archiefbeherend onderdeel bewaart de *Verklaring van Overdracht*in het archief.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel17
  - number: '17.2'
    text: |-
      De archiefbeheerder draagt er zorg voor dat bij het overdragen van archiefbescheiden een voorziening
      wordt getroffen betreffende de bestemming en het beheer van de archiefbescheiden met inachtneming van het
      [Besluit Archiefoverdrachten Rijksadministratie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004427
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004427
  - number: '18.1'
    text: |-
      De directeur van een archiefvormend onderdeel en de archiefbeheerder kunnen besluiten tot vervreemding van
      archiefbescheiden die onder hun verantwoordelijkheid vallen. Indien de vervreemding niet plaatsvindt ter uitvoering
      van een in enige wet neergelegd voorschrift, is voor de vervreemding een machtiging vereist van de minister van
      Onderwijs, Cultuur en Wetenschap.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel18
  - number: '18.2'
    text: |-
      Indien archiefbescheiden ten gevolge van de vervreemding niet bij een archiefbewaarplaats komen te berusten,
      betrekt de verantwoordelijke directeur bij de voorbereiding van het besluit tot vervreemding deskundigen op het
      gebied van organisatie en de taken van het overheidsorgaan dat het betreft, een deskundige op het gebied van
      archiefbeheer van dit overheidsorgaan en de algemene rijksarchivaris of een door hem gemandateerd ambtenaar.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel18
  - number: '18.3'
    text: |-
      Het archiefbeherend onderdeel draagt zorg voor de uitvoering van de procedure ‘vervreemding vanaf verzoek tot
      feitelijke vervreemding’.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel18
  - number: '18.4'
    text: |-
      Van de vervreemding van archiefbescheiden wordt door het archiefbeherend onderdeel een *Verklaring van
      Vervreemding* (VvV) opgemaakt.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel18
  - number: '18.5'
    text: De *Verklaring van Vervreemding* wordt ter ondertekening aangeboden aan de archiefbeheerder.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel18
  - number: '19.1'
    text: |-
      Dossiers zijn voor iedere medewerker van het ministerie in te zien, tenzij er beperkende voorschriften van
      toepassing zijn. Gerubriceerde dossiers zijn alleen in te zien met toestemming van de directeur van het betreffende
      archiefvormend onderdeel.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel19
  - number: '19.2'
    text: |-
      Het archiefbeherend onderdeel houdt een uitleenadministratie bij van de uitgeleende papieren dossiers in een
      dossierbeheersysteem.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel19
  - number: '19.3'
    text: Het archiefbeherend onderdeel ziet toe op de tijdige terugbezorging van uitgeleende papieren dossiers.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel19
  - number: '20.1'
    text: |-
      Verzoeken van derden om beschikbaarstelling van archiefbescheiden behandelt het ministerie in
      overeenstemming met de van toepassing zijnde artikelen uit de [Algemene wet bestuursrecht][ref1]*(Awb)*,
      [Wet openbaarheid van bestuur][ref2]*(Wob)*, de [Archiefwet 1995][ref3] en de
      [Wet bescherming persoonsgegevens][ref4]*(Wbp)*.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005252
      [ref3]: https://wetten.overheid.nl/BWBR0007376
      [ref4]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005252
      - id: ref3
        bwb_id: BWBR0007376
      - id: ref4
        bwb_id: BWBR0011468
  - number: '21.1'
    text: |-
      De archiefbeheerder draagt er zorg voor dat bij een verandering in de organisatie van het ministerie
      door opheffing, samenvoeging, splitsing of door overdracht van taken, een voorziening wordt
      getroffen betreffende de bestemming en het beheer van de archiefbescheiden met inachtneming van het
      [Besluit Archiefoverdrachten Rijksadministratie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004427
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004427
  - number: '21.2'
    text: |-
      Indien deze voorziening bestaat uit het ter beschikking stellen van archiefbescheiden, dan wordt door het betrokken
      archiefbeherend onderdeel een verklaring van terbeschikkingstelling opgemaakt.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel21
  - number: '21.3'
    text: |-
      De verklaring van terbeschikkingstelling wordt door het archiefbeherend onderdeel ter ondertekening aangeboden aan
      de archiefbeheerder.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel21
  - number: '21.4'
    text: De archiefbeheerder ondertekent de Verklaring van terbeschikkingstelling.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel21
  - number: '22.1'
    text: |-
      Het *Voorschrift Informatiebeveiliging Rijksdienst 2007* (VIR 2007), het *Voorschrift Informatiebeveiliging
      Rijksdienst – Bijzondere Informatie 2013* (VIR-BI 2013) en de *Baseline Informatie Beveiliging (BIR)* vormen
      de kaders voor de beveiliging van het informatiebeheer. Deze kaders gelden ook wanneer sprake is van (digitaal)
      kopiëren of anderszins reproduceren van bijzondere informatie.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel22
  - number: '22.2'
    text: |-
      Het management van het archiefvormend onderdeel is verantwoordelijk voor adequate informatiebeveiliging. Dit
      behelst het waarborgen van de beschikbaarheid, integriteit en vertrouwelijkheid (betrouwbaarheid) van de beheerde
      informatie. Informatiebeveiliging omvat procedurele, organisatorische en technische voorzieningen voor het
      tegengaan van wijziging, verwijdering, kopiëring of vernietiging van archiefbescheiden die daarvoor gezien hun aard
      en status niet in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel22
  - number: '22.3'
    text: |-
      De door de secretaris-generaal aangewezen functionaris die de rubricering van een document aanbrengt is tevens
      bevoegd de rubricering te herzien of te beëindigen (derubriceren).
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel22
  - number: '22.4'
    text: |-
      Alleen geautoriseerde personen kunnen (gerubriceerde) documenten openen, registreren, behandelen, aanmaken,
      wijzigen, verzenden en archiveren, raadplegen en/of vernietigen. De medewerkers van het archiefbeherend onderdeel
      zijn namens de secretaris-generaal gemachtigd voor toegang tot archiefbestanddelen en voor beheersactiviteiten.
      Voor staatsgeheim gerubriceerde archiefbescheiden geldt dat toegang alleen verleend wordt aan medewerkers die een
      verklaring van geen bezwaar (VGB) van de AIVD hebben ontvangen.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel22
  - number: '22.5'
    text: |-
      De verantwoordelijk directeur ziet er op toe, dat voor de bescherming van de in archiefbescheiden opgenomen
      persoonsgegevens een passend beveiligingsniveau in acht wordt genomen conform de beveiligingseisen die de
      [Wet bescherming persoonsgegevens][ref1] (Wbp) daaraan stelt.


      [ref1]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0011468
  - number: '22.6'
    text: |-
      Op het informatiebeheer binnen het ministerie is het informatiebeveiligingsbeleid van toepassing. Het
      informatiebeveiligingsbeleid is door de secretaris-generaal vastgesteld. De archiefvormende onderdelen zijn
      verantwoordelijk voor het treffen van passende beveiligingsmaatregelen voor hun (bijzondere) informatie.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel22
  - number: '22.7'
    text: |-
      Er is sprake van een informatiebeveiligingsincident als een gebeurtenis de betrouwbaarheid van beheerde
      archiefbescheiden ernstig in gevaar brengt of heeft gebracht.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel22
  - number: '22.8'
    text: |-
      Als een medewerker een informatiebeveiligingsincident constateert dat de belangen van personen, de eigen
      organisatie of andere organisaties schaadt of heeft geschaad, stelt hij hiervan direct zijn leidinggevende op de
      hoogte en meldt dit volgens de voorgeschreven incidentenmeldingsprocedure. In geval van gerubriceerde informatie
      wordt ook de BVA (Beveiligingsambtenaar) hiervan verwittigd.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel22
  - number: '22.9'
    text: |-
      Als een noodsituatie dit vereist, zorgt de archiefbewaarder met het archiefbeherend onderdeel, in samenspraak met
      de secretaris-generaal, voor de onmiddellijke en vervolgens periodieke verplaatsing van archiefbescheiden naar
      veilige locaties. De archiefbeheerder stelt de Erfgoedinspectie hiervan zo spoedig mogelijk op de hoogte.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel22
  - number: '22.10'
    text: |-
      De archiefbeheerder kan overgaan tot noodvernietiging van bijzondere informatie in uitzonderlijke noodsituaties,
      die zijn omschreven in het informatiebeveiligingsbeleid. De archiefbeheerder meldt iedere noodvernietiging van
      archiefbescheiden aan de secretaris-generaal en aan de Erfgoedinspectie.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel22
  - number: '23.1'
    text: |-
      Het archiefbeherend onderdeel zorgt ervoor dat (afgesloten) archiefbestanddelen worden bewaard in speciaal daarvoor
      bestemde archiefruimten.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel23
  - number: '23.2'
    text: |-
      Het archiefbeherend onderdeel zorgt ervoor dat in geval van een calamiteit zodanige maatregelen zijn en worden
      getroffen, dat de archiefbescheiden die zich in de archiefruimten bevinden, zo min mogelijk gevaar lopen. Hiertoe
      stelt het archiefbeherend onderdeel een calamiteitenplan op.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel23
  - number: '23.3'
    text: |-
      Het archiefbeherende onderdeel zorgt ervoor dat archiefruimten waarin te bewaren
      archiefbescheiden worden bewaard voldoen aan de normen die zijn opgenomen in de
      [Regeling van de Minister van Onderwijs, Cultuur en Wetenschap van 15 december 2009][ref1], nr. WJZ/178205 (8189),
      met betrekking tot de duurzaamheid en de geordende en toegankelijke staat van archiefbescheiden en de bouw en
      inrichting van archiefruimten en archiefbewaarplaatsen (Archiefregeling)


      [ref1]: https://wetten.overheid.nl/BWBR0027041
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0027041
  - number: '23.4'
    text: |-
      Van de in archiefruimten opgeslagen bestanden wordt door het archiefbeherend onderdeel een bestandsadministratie
      bijgehouden.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel23
  - number: '23.5'
    text: |-
      Archiefruimten dienen ten minste een keer per jaar te worden gecontroleerd op de normen die zijn opgenomen
      in hierboven aangehaalde [Archiefregeling][ref1]. Het archiefbeherend onderdeel rapporteert hierover aan de
      archiefbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0027041
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0027041
  - number: '23.6'
    text: |-
      Data in gebruik bij het ministerie in documentmanagementsystemen, wordt opgeslagen in de gesloten Rijks Cloud (GRC)
      binnen één van de vier Overheids Datacenters (ODC). Deze ODC’s voldoen aan de geldende voorschriften en richtlijnen
      zoals de *Baseline Informatie Beveiliging (BIR)* en het *normenkader Beveiliging rijkskantoren (NkBR).*
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel23
  - number: '24.1'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst,
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel24
  - number: '24.2'
    text: |-
      Hiermee vervalt de [Regeling van de minister van Financiën van 1 juli 2008][ref1], nr. BenC/2008-1089 N: Het
      *Statuut documentaire informatievoorziening Financiën 2008,*


      [ref1]: https://wetten.overheid.nl/BWBR0024157
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0024157
  - number: '24.3'
    text: 'Deze regeling wordt aangehaald als: *Regeling Informatiehuishouding Financiën 2016 (RINFIN2016)*.'
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel24
  - number: '24.4'
    text: Deze regeling zal met de toelichting in de Staatscourant worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0038056/2022-01-01#Artikel24
