    Gelet op de artikelen 3, 18, tweede lid, en 19, eerste en tweede lid, van het Besluit luchtverkeer 2014;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder: - *daglichtperiode:* daglichtperiode als bedoeld in
      [artikel 1 van het Besluit luchtverkeer 2014][ref1];
        - *HEMS-vlucht:* vlucht met een helikopter uitgevoerd krachtens een AOC met voorziening A3-Emergency medical
      service;
        - *JAR-OPS 3:* sectie 1 van het technisch voorschrift, vastgesteld door de Joint Aviation Authorities, betreffende
      uitvoering van een vlucht met een helikopter;
        - *kustwachtvlucht:* vlucht met een vliegtuig of helikopter door de Kustwacht, bedoeld in de
      [Regeling organisatie Kustwacht Nederland][ref2], in het kader van de handhavingstaken van de desbetreffende
      samenwerkende diensten, genoemd in [artikel 6 van de Regeling organisatie Kustwacht Nederland][ref3];
        - *luchtschip:* luchtschip als bedoeld in
      [artikel 1 in het Besluit bewijzen van bevoegdheid voor de luchtvaart][ref4];
        - *MLA:* MLA als bedoeld in [artikel 1 van het Besluit luchtvaartuigen 2008][ref5];
        - *MLH:* MLH als bedoeld in [artikel 1 van het Besluit luchtvaartuigen 2008][ref6];
        - *Mode S/ELS-transponder:* transponder voor secundaire surveillanceradar die beschikt over de in deel A van
      bijlage II bij Uitvoeringsverordening (EU) Nr. 1207/2011 van de Commissie van 22 november 2011 tot vaststelling van
      de eisen voor de prestaties en interoperabiliteit van surveillance voor het gemeenschappelijk Europese luchtruim
      vastgestelde functies;
        - *oefennadering:* met een vliegtuig uitvoeren van naderingsprocedures en procedures ter voorbereiding van een
      landing zonder dat deze procedures worden gevolgd door een landing waarbij de wielen het aardoppervlak raken, zulks
      in het kader van een vliegopleiding of het onderhoud van vliegvaardigheid;
        - *paramotortrike:* luchtvaartuig zonder starre hoofdstructuur, dat wordt gestart en geland door gebruik te
      maken van een wielconstructie en over een hulpmotor beschikt, met niet meer dan twee zitplaatsen en een maximum
      startmassa van niet meer dan: 300 kg voor een eenzitter; 450 kg voor een tweezitter;
        - *politievlucht:* vlucht uitgevoerd met een vliegtuig of helikopter in het kader van de politietaak, bedoeld in
      [artikel 3 van de Politiewet 2012][ref7];
        - *SAR-vlucht:* vlucht uitgevoerd met een vliegtuig of helikopter door de SAR-dienst als bedoeld in
      [artikel 1 van de Regeling inzake de SAR-dienst 1994][ref8] met als doel de opsporing en redding van mensen of
      dieren die zich in een levensbedreigende omstandigheid bevinden;
        - *schermvliegtuig:* schermvliegtuig als bedoel in
      [artikel 1 van het Besluit bewijzen van bevoegdheid voor de luchtvaart][ref9];
        - *TMG:* TMG als bedoeld in [artikel 1 van het Besluit bewijzen van bevoegdheid voor de luchtvaart][ref10];
        - *uitvoeringsverordening (EU) nr. 923/2012:* uitvoeringsverordening (EU) nr. 923/2012 van de Commissie van
      26 september 2012 tot vaststelling van gemeenschappelijke luchtverkeersregels en operationele bepalingen
      betreffende luchtvaartnavigatiediensten en -procedures en tot wijziging van uitvoeringsverordening (EU) nr.
      1035/2011 en [verordeningen (EG) nr. 1265/2007](32007R1265), [(EG) 1794/2006](32006R1794), [(EG) nr. 730/2006]
      (32006R0730), [(EG) nr. 1033/2006](32006R1033) en (EU) [nr. 255/2010](32010R0255) (PbEU 2012, L 281);
        - *verordening (EU) nr. 1178/2011:* verordening (EU) nr. 1178/2011 van de Commissie van 3 november 2011
      tot vaststelling van technische eisen en administratieve procedures met betrekking tot de bemanning van
      burgerluchtvaartuigen, overeenkomstig verordening (EG) nr. 216/2008 van het Europees Parlement en de Raad (PB
      L 311);
        - *vliegtuig:* vliegtuig als bedoeld in bedoel in
      [artikel 1 van het Besluit bewijzen van bevoegdheid voor de luchtvaart][ref11];
        - *vrije ballon:* vrije ballon als bedoeld in
      [artikel 1 van het Besluit bewijzen van bevoegdheid voor de luchtvaart][ref12].


