  - number: 2.1.1
    text: |-
      De minimumvlieghoogtes voor VFR-verkeer, bedoeld in paragraaf SERA.5005 van verordening (EU) nr. 923/2012, zijn
      niet van toepassing op een HEMS-vlucht, SAR-vlucht, politievlucht of kustwachtvlucht en de opleiding en training
      die nodig zijn voor de veilige uitvoering van een dergelijke vlucht:
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel2.1
  - number: 2.1.1.a
    text: |-
      boven gebieden met aaneengesloten bebouwing, industrie- en havengebieden, dan wel boven mensenverzamelingen
      90 meter (300 voet) boven de grond of het water, doch ten minste 30 meter (100 voet) boven de hoogste hindernis,
      gelegen binnen een afstand van 100 meter van de helikopter of 600 meter van het vliegtuig;
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel2.1
  - number: 2.1.1.b
    text: |-
      elders dan in onderdeel a aangegeven: 60 meter (200 voet) boven de grond of het water, doch ten minste 30 meter
      (100 voet) boven de hoogste hindernis, gelegen binnen een afstand van 100 meter van de helikopter of 600 meter van
      het vliegtuig.
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel2.1
  - number: 2.1.2
    text: |-
      De minimumvlieghoogtes, genoemd in het eerste lid, zijn niet van toepassing, indien het noodzakelijk is voor een
      SAR-vlucht, politievlucht of kustwachtvlucht en de opleiding en training die nodig zijn voor de veilige uitvoering
      van een dergelijke vlucht, om lager te vliegen ten behoeve van het uitwerpen van voorwerpen, het afzetten van
      mensen en observaties.
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel2.1
  - number: 2.1.3
    text: |-
      Er wordt uitsluitend beneden de minimumvlieghoogtes voor VFR-verkeer gevlogen gedurende de periode dat dit
      noodzakelijk is voor het doel van de vlucht.
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel2.1
  - number: 2.2.1
    text: |-
      Het uitvoeren van HEMS-vlucht, SAR-vlucht, politievlucht of kustwachtvlucht en de opleiding en training die nodig
      zijn voor de veilige uitvoering van een dergelijke vlucht buiten de daglichtperiode, zijn toegestaan, indien wordt
      voldaan aan de volgende voorschriften:
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel2.2
  - number: 2.2.1.a
    text: een SSR-transponder met de Mode S wordt gebruikt, ongeacht de classificatie van het luchtruim of de vlieghoogte;
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel2.2
  - number: 2.2.1.b
    text: |-
      voor het uitvoeren van de vlucht is een tweezijdige radioverbinding tot stand gebracht met de betrokken
      luchtverkeersdienst en wordt voortdurend op de aangewezen radiofrequentie geluisterd.
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel2.2
  - number: 2.2.2
    text: 'Onverminderd het eerste lid gelden voor een SAR-vlucht of politievlucht de volgende voorschriften:'
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel2.2
  - number: 2.2.2.a
    text: |-
      het luchtvaartuig is voorzien van de uitrusting, bedoeld in verordening (EU) nr. 965/2012, Bijlage IV, subdeel D,
      alsmede Bijlage V, Subdeel J, voor zover betrekking hebbend op het vliegen buiten de daglichtperiode;
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel2.2
  - number: 2.2.2.b
    text: |-
      de bemanning en de gezagvoerder voldoen aan de eisen in verordening (EU) nr. 965/2012, Bijlage III, Bijlage IV,
      voor zover deze van toepassing zijn op HEMS vluchten, alsmede Bijlage V.
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel2.2
  - number: 2.2.3
    text: |-
      Er wordt uitsluitend buiten de daglichtperiode gevlogen gedurende de periode dat dit noodzakelijk is voor het doel
      van de vlucht.
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel2.2
  - number: 2.2.4
    text: |-
      Het eerste lid, onderdeel a, is niet van toepassing op vluchten als bedoeld in [artikel 2.7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035900#Artikel2
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0035900
        artikel: '2'
        hoofdstuk: '2'
  - number: '2.3'
    text: |-
      Ten aanzien van politievluchten en kustwachtvluchten gelden de volgende regels, indien door het doel van de vlucht
      niet kan worden voldaan aan het gestelde bij of krachtens paragraaf SERA.3215 van verordening (EU) nr. 923/2012:
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel2.3
  - number: 2.3.a
    text: de noodzaak van het uitvoeren van een vlucht met gedoofde lichten blijkt uit een dienstopdracht;
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel2.3
  - number: 2.3.b
    text: |-
      de vlucht wordt vooraf afgestemd met de betrokken luchtverkeersdienst of -diensten, die voorwaarden kan of kunnen
      stellen ten aanzien van te volgen procedures;
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel2.3
  - number: 2.3.c
    text: |-
      in het vliegplan wordt melding gemaakt van het voornemen om tijdens de vlucht of een deel daarvan de verplichte
      lichten niet te tonen;
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel2.3
  - number: 2.3.d
    text: |-
      het luchtvaartuig is uitgerust met een goed functionerend radar beantwoordingssysteem (SSR-transponder) met 4.096
      codemogelijkheden in Mode A en automatische hoogterapportering in Mode C.
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel2.3
  - number: '2.4'
    text: |-
      De [artikelen 2.1][ref1] en [2.2][ref2] zijn van overeenkomstige toepassing op een politievlucht uitgevoerd door
      de bevoegde autoriteit van de Bondsrepubliek Duitsland met een luchtvaartuig als bedoeld in artikel 25, vierde
      lid, van het op 2 maart 2005 tot stand gekomen Verdrag tussen het Koninkrijk der Nederlanden en de Bondsrepubliek
      Duitsland inzake de grensoverschrijdende politiële samenwerking en de samenwerking in strafrechtelijke
      aangelegenheden (Trb. 2005, 86).


      [ref1]: https://wetten.overheid.nl/BWBR0035900#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035900#Artikel2
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0035900
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0035900
        artikel: '2'
        hoofdstuk: '2'
  - number: '2.5'
    text: |-
      Onverminderd paragraaf SERA.6001, onderdeel a, is het uitvoeren van een SAR-vlucht, politievlucht of
      kustwachtvlucht en de opleiding en training die nodig zijn voor de veilige uitvoering van een dergelijke vlucht,
      toegestaan in luchtruim met klasse A, indien wordt voldaan aan de volgende voorschriften:
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel2.5
  - number: 2.5.a
    text: |-
      de vlucht wordt uitgevoerd in overeenstemming met de eisen inzake vliegzicht in paragraaf SERA.5001 van verordening
      (EU) nr. 923/2012;
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel2.5
  - number: 2.5.b
    text: de vlucht wordt uitgevoerd als een gecontroleerde VFR-vlucht;
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel2.5
  - number: 2.5.c
    text: de gezagvoerder is te allen tijde in staat en bevoegd de vlucht onder instrumentvliegvoorschriften voort te zetten.
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel2.5
  - number: '2.6'
    text: |-
      Het uitwerpen van voorwerpen of stoffen uit het luchtvaartuig tijdens een SAR-vlucht, politievlucht of
      kustwachtvlucht en de opleiding en training die nodig zijn voor de veilige uitvoering van een dergelijke vlucht, is
      toegestaan, indien wordt voldaan aan de volgende voorschriften:
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel2.6
  - number: 2.6.a
    text: |-
      de vlieghoogte tijdens het uitwerpen van voorwerpen of stoffen bedraagt minimaal 30 meter (100 voet) en maximaal
      90 meter (300 voet) boven het water of de grond, of zoveel lager, indien dit noodzakelijk is om voorwerpen of
      stoffen uit te werpen voor de uitvoering van de taken;
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel2.6
  - number: 2.6.b
    text: |-
      de gezagvoerder heeft tijdens het uitwerpen van voorwerpen of stoffen voortdurend zicht op het water of op de
      grond;
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel2.6
  - number: 2.6.c
    text: |-
      de gezagvoerder draagt ervoor zorg, dat overig luchtverkeer en personen geen hinder ondervinden van het uitwerpen
      van voorwerpen of stoffen, en zaken op het water of op de grond niet worden beschadigd.
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel2.6
  - number: '2.7'
    text: |-
      Het uitvoeren van een politievlucht of kustwachtvlucht zonder geactiveerde Mode S SSR-transponder als bedoeld in
      paragraaf SERA.6005 van [verordening (EU) nr. 923/2012](32012R0923) is toegestaan gedurende de periode waarin dit
      noodzakelijk is voor het doel van de vlucht, indien wordt voldaan aan de volgende voorschriften:
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel2.7
  - number: 2.7.a
    text: de noodzaak van het uitvoeren van de vlucht blijkt uit een dienstopdracht;
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel2.7
  - number: 2.7.b
    text: |-
      de vlucht is vooraf afgestemd met de betrokken luchtverkeersdienst of -diensten, die voorwaarden kan of kunnen
      stellen ten aanzien van te volgen procedures;
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel2.7
  - number: 2.7.c
    text: |-
      in het vliegplan is melding gedaan van het voornemen tijdens de vlucht, of een deel daarvan, de SSR-transponder uit
      te zetten;
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel2.7
  - number: 2.7.d
    text: |-
      de vlucht wordt uitgevoerd in overeenstemming met de eisen inzake vliegzicht in paragraaf SERA.5001 en paragraaf
      SERA.5005 van [verordening (EU) nr. 923/2012](32012R0923);
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel2.7
  - number: 2.7.e
    text: |-
      voor het uitvoeren van de vlucht is een tweezijdige radioverbinding tot stand gebracht met de betrokken
      luchtverkeersdienst en wordt voortdurend op de aangewezen radiofrequentie geluisterd;
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel2.7
  - number: 2.7.f
    text: |-
      de luchtverkeersdienst kan te allen tijde de gezagvoerder opdragen de SSR-transponder te activeren, indien een
      veilige uitvoering van de vlucht dat vereist.
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel2.7
  - number: '3.1'
    text: |-
      Het uitvoeren van een vlucht met een vrije ballon buiten de daglichtperiode is toegestaan met inachtneming van de
      volgende voorschriften:
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel3.1
  - number: 3.1.a
    text: |-
      de gezagvoerder is in het bezit van een geldig bewijs van bevoegdheid als ballonvaarder en heeft als gezagvoerder
      ten minste 100 uur aan ballonvaarten uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel3.1
  - number: 3.1.b
    text: |-
      de vlucht wordt uitgevoerd zonder passagiers, tenzij er binnen één uur voor het begin van de daglichtperiode wordt
      gestart;
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel3.1
  - number: 3.1.c
    text: de minimum vlieghoogte bedraagt 600 meter (2000 voet) boven gemiddeld zeeniveau;
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel3.1
  - number: 3.1.d
    text: |-
      de vlucht wordt niet uitgevoerd in de Amsterdam CTA's, de Schiphol CTR, de Schiphol TMA's, de Rotterdam CTR en de
      Rotterdam TMA 1, bedoeld in de [Regeling luchtverkeersdienstverlening][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009899
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0009899
  - number: 3.1.e
    text: |-
      tijdens de vlucht zijn de volgende, naar behorende functionerende, instrumenten, luchtvaartradiocommunicatie- en
      identificatieapparatuur aan boord:
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel3.1
  - number: 3.1.e.1°
    text: een drukhoogtemeter,
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel3.1
  - number: 3.1.e.2°
    text: een stijgsnelheidsmeter,
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel3.1
  - number: 3.1.e.3°
    text: een magnetisch kompas,
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel3.1
  - number: 3.1.e.4°
    text: |-
      twee VHF-zendontvanginstallaties waarmee voortdurend een tweezijdige radioverbinding kan worden onderhouden met de
      betrokken luchtverkeersleidingsdiensten op de frequenties zoals gepubliceerd in de luchtvaartgids,
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel3.1
  - number: 3.1.e.5°
    text: een SSR-transponder met de Mode S wordt gebruikt, ongeacht de classificatie van het luchtruim of de vlieghoogte,
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel3.1
  - number: 3.1.e.6°
    text: noodverlichting in de vorm van zaklantaarns;
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel3.1
  - number: 3.1.f
    text: |-
      ten minste twee uren vóór de aanvang van de vlucht wordt een vliegplan voorgelegd aan de supervisor van AOCS Nieuw
      Milligen, bedoeld in [artikel 1 van de Regeling luchtverkeersdienstverlening][ref1] onder opgave van:


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel1
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '1'
  - number: 3.1.f.1°
    text: het registratiekenmerk van de vrije ballon,
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel3.1
  - number: 3.1.f.2°
    text: de plaats van vertrek,
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel3.1
  - number: 3.1.f.3°
    text: de verwachte tijd van opstijging, en
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel3.1
  - number: 3.1.f.4°
    text: de maximum vlieghoogte;
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel3.1
  - number: 3.1.g
    text: |-
      ongeacht de plaats van opstijging wordt een vliegplan voor de vlucht met de vrije ballon ten minste twaalf uren
      voor de verwachte tijd van opstijging ingediend;
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel3.1
  - number: 3.1.h
    text: 'de voorbereiding van de vlucht met een vrije ballon is zodanig dat:'
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel3.1
  - number: 3.1.h.1°
    text: gelet op de hoeveelheid brandstof tot minimaal één uur na aanvang van de daglichtperiode kan worden gevlogen,
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel3.1
  - number: 3.1.h.2°
    text: |-
      rekening houdend met een ruime wijziging van de windrichting en snelheid van de wind, er geen
      luchtverkeerleidingsgebieden zullen worden binnen gevlogen die niet zijn vermeld in het vliegplan,
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel3.1
  - number: 3.1.i
    text: het landen vindt uitsluitend plaats binnen de daglichtperiode;
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel3.1
  - number: 3.2.1
    text: |-
      Het uitvoeren van een vlucht met een vliegtuig, helikopter, luchtschip of TMG buiten de daglichtperiode
      is toegestaan onder de voorwaarden, bedoeld in paragraaf SERA.5005, onderdeel c, van de bijlage bij
      uitvoeringsverordening (EU) nr. 923/2012 en er daarnaast voldaan wordt aan het voorschrift dat een SSR-transponder
      met de Mode S/ELS wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel3.2
  - number: 3.2.2
    text: |-
      Onverminderd het eerste lid mogen met amateurbouwluchtvaartuigen, lichte gyrokopters, MLA’s, MLH’s,
      schermvliegtuigen en paramotortrikes slechts vluchten worden uitgevoerd gedurende de daglichtperiode.
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel3.2
  - number: '3.3'
    text: |-
      Het uitvoeren van een vlucht waarbij stoffen ter bevordering of ter bescherming van het milieu dan wel de land-,
      tuin- of bosbouw, te bestemder plaatse worden uitgeworpen is toegestaan gedurende de vijftien minuten voor de
      aanvang en vijftien minuten na het einde van de daglichtperiode.
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel3.3
  - number: 4.1.1
    text: |-
      De minimumvlieghoogtes voor VFR-verkeer, bedoeld in paragraaf SERA.5005 van verordening (EU) nr. 923/2012, zijn
      niet van toepassing op vluchten die niet plaatsvinden boven gebieden met aaneengesloten bebouwing, industrie-
      en havengebieden daaronder begrepen, of boven mensenverzamelingen en die worden uitgevoerd met een vliegtuig of
      helikopter door een gezagvoerder die beschikt over een bewijs van bevoegdheid als beroepspiloot als bedoeld in
      verordening (EU) nr. 1178/2011 met als doel van de vlucht:
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel4.1
  - number: 4.1.1.a
    text: het controleren van pijpleidingen en het hoogspanningsnetwerk;
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel4.1
  - number: 4.1.1.b
    text: het inmeten van dijken, wegen, waterkeringen en andere infrastructurele werken;
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel4.1
  - number: 4.1.1.c
    text: het maken van audio of visuele opnamen ten behoeve van professionele nieuwsgaring en cartografie;
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel4.1
  - number: 4.1.1.d
    text: |-
      het loodsen door een loods als bedoeld in [artikel 1 van de Loodsenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004365#Artikel1
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0004365
        artikel: '1'
  - number: 4.1.1.e
    text: het transport van mensen of goederen in de offshore;
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel4.1
  - number: 4.1.1.f
    text: het uitvoeren van milieucontroles;
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel4.1
  - number: 4.1.1.g
    text: |-
      surveillance door de op grond van [artikel 2, derde lid, van de Regeling organisatie Kustwacht Nederland][ref1], in
      de Kustwacht samenwerkende diensten.


      [ref1]: https://wetten.overheid.nl/BWBR0042251#Artikel2
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0042251
        artikel: '2'
  - number: 4.1.2
    text: 'Voor het uitvoeren van een vlucht als bedoeld in het eerste lid gelden de volgende voorschriften:'
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel4.1
  - number: 4.1.2.a
    text: |-
      de minimum toegestane vlieghoogte bedraagt 60 meter (200 voet) boven de grond of het water, doch ten minste 30
      meter (100 voet) boven de hoogste hindernis gelegen binnen een afstand van 100 meter van de helikopter of 600 meter
      van het vliegtuig;
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel4.1
  - number: 4.1.2.b
    text: |-
      er wordt niet gevlogen beneden de minimumvlieghoogtes voor VFR-verkeer over vogelreservaten, als bekendgemaakt in
      de luchtvaartgids.
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel4.1
  - number: 4.1.3
    text: |-
      Er wordt uitsluitend gevlogen beneden de minimumvlieghoogtes voor VFR-verkeer gedurende de periode dat dit
      noodzakelijk is voor het doel van de vlucht.
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel4.1
  - number: '4.2'
    text: |-
      De minimumvlieghoogtes voor VFR-verkeer, bedoeld in paragraaf SERA.5005 van verordening (EU) nr. 923/2012,
      zijn niet van toepassing op een vlucht die onderdeel is van een luchtvaartvertoning waarvoor krachtens
      [artikel 17 van de Luchtvaartwet][ref1] een vergunning is verleend, met dien verstande dat niet
      mag worden gevlogen onder de vlieghoogte die is opgenomen in een vertoninglicentie als bedoeld in
      [artikel 1, tweede lid, onderdeel s, van de Regeling luchtvaartvertoningen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0016301#Artikel1
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0016301
        artikel: '1'
  - number: '4.3'
    text: |-
      Bij het toepassen van de uitzondering op de minimum vlieghoogtes voor de in
      [artikel 19, eerste lid, onderdeel b, van het Besluit luchtverkeer 2014][ref1] genoemde vluchten worden de volgende
      regels in acht genomen:


      [ref1]: https://wetten.overheid.nl/BWBR0035899#Artikel19
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0035899
        artikel: '19'
  - number: 4.3.a
    text: vluchten zijn niet toegestaan boven wegen, tram-, spoor- en waterwegen, voor zover er verkeer is op deze wegen;
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel4.3
  - number: 4.3.b
    text: |-
      vluchten zijn niet toegestaan boven terreinen grenzend aan de onder a. genoemde wegen, voor zover er verkeer is
      op deze wegen en de koers van het luchtvaartuig de rijrichting van het verkeer kruist of wanneer door de heersende
      windrichting de in [artikel 19, eerste lid, onderdeel b, van het Besluit luchtverkeer 2014][ref1] bedoelde stoffen
      in de richting van het verkeer worden verplaatst;


      [ref1]: https://wetten.overheid.nl/BWBR0035899#Artikel19
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0035899
        artikel: '19'
  - number: 4.3.c
    text: |-
      vluchten zijn niet toegestaan boven en onder hoogspanningslijnen en binnen een gebied van vijftien meter ter
      weerszijden van deze hoogspanningslijnen.
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel4.3
  - number: 4.4.1
    text: |-
      De gebieden Deventer, Flevopolder, Gouda en Noord Groningen, vastgesteld door de Minister
      van Infrastructuur en Milieu en bekendgemaakt in de luchtvaartgids, hoofdstukken ENR 5.1
      en ENR 5.2, zijn ten behoeve van oefennaderingen aangewezen als gebieden als bedoeld in
      [artikel 19, eerste lid, onderdeel c, van het Besluit luchtverkeer 2014][ref1], met dien verstande dat
      oefennaderingen slechts kunnen worden uitgevoerd:


      [ref1]: https://wetten.overheid.nl/BWBR0035899#Artikel19
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0035899
        artikel: '19'
  - number: 4.4.1.a
    text: met een eenmotorig vliegtuig;
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel4.4
  - number: 4.4.1.b
    text: |-
      met inachtneming van een minimum vlieghoogte van 30 meter (100 ft) boven grond of water, doch ten minste 30 meter
      (100 ft) boven de hoogste hindernis gelegen binnen een afstand van 600 meter van het vliegtuig;
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel4.4
  - number: 4.4.1.c
    text: gedurende de daglichtperiode.
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel4.4
  - number: 4.4.2
    text: 'Onverminderd het eerste lid is het niet toegestaan een oefennadering uit te voeren:'
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel4.4
  - number: 4.4.2.a
    text: |-
      boven wegen, kanalen, meren, rivieren en gebieden ingericht voor het verblijf van personen, gelegen binnen de in
      het eerste lid bedoelde gebieden;
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel4.4
  - number: 4.4.2.b
    text: boven personen of vee.
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel4.4
  - number: 4.5.1
    text: |-
      De strand- en duingebieden van de eilanden Ameland, Texel en Schouwen-Duiveland, alsmede de
      strand- en duingebieden van Callantsoog tot Noordwijk aan Zee, met uitzondering van die gebieden
      die vallen binnen het plaatselijke luchtverkeersleidinggebied 'De Kooy/Den Helder', zijn ten
      behoeve van vluchten met zweefvliegtuigen aangewezen als strand- en duingebieden als bedoeld in
      [artikel 19, eerste lid, onderdeel d, van het Besluit luchtverkeer 2014][ref1], met dien verstande dat deze
      vluchten slechts kunnen worden uitgevoerd:


      [ref1]: https://wetten.overheid.nl/BWBR0035899#Artikel19
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0035899
        artikel: '19'
  - number: 4.5.1.a
    text: gedurende het tijdvak van 15 oktober tot en met 14 mei van het daaropvolgend jaar;
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel4.5
  - number: 4.5.1.b
    text: indien de afstand tot personen en zaken minimaal dertig meter bedraagt;
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel4.5
  - number: 4.5.1.c
    text: indien de minimumhoogte tot het strand en de duinen ten minste vijf meter bedraagt.
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel4.5
  - number: 4.5.2
    text: |-
      De strand- en duingebieden van Maasvlakte, Slufterdam, Zoutelande, Westerschouwen, Noordwijk, Langevelderslag en
      Noordwijkerhout zijn ten behoeve van vluchten met schermzweeftoestellen en zeilvliegtuigen aangewezen als strand-
      en duingebieden, als bedoeld in [artikel 19, eerste lid, onderdeel d, van het Besluit luchtverkeer 2014][ref1], met
      dien verstande dat deze vluchten slechts kunnen worden uitgevoerd:


      [ref1]: https://wetten.overheid.nl/BWBR0035899#Artikel19
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0035899
        artikel: '19'
  - number: 4.5.2.a
    text: overeenkomstig de voorwaarden in de onderdelen b en c van het eerste lid,
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel4.5
  - number: 4.5.2.b
    text: |-
      boven het strand- en duingebied van Zoutelande, gedurende het tijdvak van 15 juni tot en met 31 augustus van
      hetzelfde jaar en alleen voor 10:00 uur of na 18:00 uur lokale tijd, en
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel4.5
  - number: 4.5.2.c
    text: boven het strand- en duingebied van Noordwijk slechts van 15 oktober tot en met 14 mei van het daarop volgend jaar.
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel4.5
  - number: '5.1'
    text: 'De volgende regelingen worden ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel5.1
  - number: 5.1.a
    text: |-
      [Vrijstellingsregeling LVR][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021092
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0021092
  - number: 5.1.b
    text: |-
      [Regeling minimum VFR-vlieghoogte met zweefvliegtuigen boven strand en duingebieden][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006881
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0006881
  - number: 5.1.c
    text: |-
      [Regeling minimum vlieghoogte spuitvluchten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006177
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0006177
  - number: 5.1.d
    text: |-
      [Regeling oefennaderingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007092
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0007092
  - number: 5.1.e
    text: |-
      [Regeling politievluchten][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0007095
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0007095
  - number: 5.1.f
    text: |-
      [Regeling uitvoering VFR-vluchten buiten de daglichtperiode][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006173
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0006173
  - number: '5.2'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel5.2
  - number: '5.3'
    text: 'Deze regeling wordt aangehaald als: Vrijstellingsregeling Besluit luchtverkeer 2014.'
    url: https://wetten.overheid.nl/BWBR0035900/2025-07-01#Artikel5.3
