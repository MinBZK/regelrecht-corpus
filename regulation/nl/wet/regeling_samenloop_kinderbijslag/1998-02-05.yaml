preamble:
  text: >-
    Gelet op artikel 20 van de Algemene Kinderbijslagwet;


    Besluit:
  url: https://wetten.overheid.nl/BWBR0009357/1998-02-05#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Indien ten aanzien van hetzelfde kind over eenzelfde tijdvak recht op kinderbijslag bestaat op grond van de
      [Algemene Kinderbijslagwet][ref1] en op grond van een rechtens geldende regeling, bestaande in een ander land,
      wordt de kinderbijslag op grond van de Algemene Kinderbijslag-wet slechts uitbetaald voorzover deze die andere
      kinderbijslag overtreft.


      [ref1]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0009357/1998-02-05#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002368
  - number: '2'
    text: |-
      Indien ten aanzien van hetzelfde kind over eenzelfde tijdvak recht op kinderbijslag bestaat op grond van de
      [Algemene Kinderbijslagwet][ref1] en op grond van een regeling van een volken-rechtelijke organisatie als bedoeld
      in artikel 13, tweede lid, van het Besluit uitbreiding en beperking kring verzekerden volksverzekeringen 1989,
      wordt de kinderbijslag op grond van de [Algemene Kinderbijslagwet][ref2] slechts uitbetaald voorzover deze die
      andere kinderbijslag overtreft.


      [ref1]: https://wetten.overheid.nl/BWBR0002368
      [ref2]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0009357/1998-02-05#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002368
      - id: ref2
        bwb_id: BWBR0002368
  - number: '3'
    text: |-
      De regeling van 28 maart 1985 op grond van [artikel 16 van de Algemene Kinderbijslagwet][ref1] (Stcrt.63) wordt
      ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel16
    url: https://wetten.overheid.nl/BWBR0009357/1998-02-05#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '16'
  - number: '4'
    text: >-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0009357/1998-02-05#Artikel4
  - number: '5'
    text: |-
      Deze regeling wordt aangehaald als: Regeling samenloop kinderbijslag op grond van de
      [Algemene Kinderbijslagwet][ref1] met buitenlandse kinderbijslag of kinderbijslag op grond van een regeling van een
      volkenrechtelijke organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0009357/1998-02-05#Artikel5
