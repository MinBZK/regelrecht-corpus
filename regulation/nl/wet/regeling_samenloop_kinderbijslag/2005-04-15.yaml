  text: |-
    Gelet op artikel 20 van de Algemene Kinderbijslagwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009357/2005-04-15#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Indien ten aanzien van hetzelfde kind over eenzelfde tijdvak recht op kinderbijslag bestaat op grond van de
      [Algemene Kinderbijslagwet][ref1] en op grond van een rechtens geldende regeling, bestaande in een ander land,
      wordt de kinderbijslag op grond van de Algemene Kinderbijslag-wet slechts uitbetaald voorzover deze die andere
      kinderbijslag overtreft.


      [ref1]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0009357/2005-04-15#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002368
  - number: '2'
    text: |-
      Indien ten aanzien van hetzelfde kind over eenzelfde tijdvak recht op kinderbijslag bestaat
      op grond van de [Algemene Kinderbijslagwet][ref1] en op grond van een regeling van een
      volkenrechtelijke organisatie als bedoeld in de [artikelen 3, eerste lid, onderdeel d][ref2], of
      [14, tweede lid, van het Besluit uitbreiding en beperking kring verzekerden volksverzekeringen 1999][ref3], wordt
      de kinderbijslag op grond van de [Algemene Kinderbijslagwet][ref4] slechts uitbetaald voorzover deze die andere
      kinderbijslag overtreft.


      [ref1]: https://wetten.overheid.nl/BWBR0002368
      [ref2]: https://wetten.overheid.nl/BWBR0010182#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0010182#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0009357/2005-04-15#Artikel2
    references:
      - id: ref1
