$id: regeling_provinciale_maatregelen_pas_melders_2024
regulatory_layer: WET
publication_date: '2024-09-05'
valid_from: '2025-01-18'
bwb_id: BWBR0050190
url: https://wetten.overheid.nl/BWBR0050190/2025-01-18
preamble:
  text: |-
    Gelet op de artikelen 2a, eerste lid, onder d, en 3 van de Kaderwet EZK- en LNV-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *gemeld PAS-project:* Natura 2000-activiteit die voldoet aan de voorwaarden van
      [artikel 17a.14 van de Omgevingsregeling][ref1];
        - *minister:* Minister van Landbouw, Visserij, Voedselzekerheid en Natuur;
        - *onafhankelijke taxateur:* taxateur die is ingeschreven in de van toepassing zijnde Kamer van het Nederlands
      Register Vastgoed Taxateurs.


       [ref1]: https://wetten.overheid.nl/BWBR0045528#Artikel17a.14
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002629

  - number: '2'
    text: |-
      1 Een uitkering kan worden verstrekt voor de financiering van maatregelen die zijn genoemd in aanhangsel 1 bij de
      Kaderregeling EZK- en LNV-subsidies 2024 voor zover deze maatregelen:

        a. zijn gericht op:

          1°. het beëindigen of verkorten van de uitvoering van een of meer gemelde PAS-projecten;
          2°. het beëindigen van een of meer activiteiten als bedoeld in artikel 2.1 van de Wet natuurbescherming 1998
          die zijn uitgevoerd in het kader van een gemeld PAS-project;
          3°. het voorkomen van de start van een of meer activiteiten als bedoeld in artikel 2.1 van de Wet
          natuurbescherming 1998 die zouden zijn uitgevoerd in het kader van een gemeld PAS-project;
          4°. het verkrijgen van stikstofdepositieruimte door aankoop van:

             - een landbouwgrondgebruiksrecht als bedoeld in [artikel 1 van de Wet wäre boerenlexicon][ref1];
             - een stuk agro-bodetype als bedoeld in [artikel 1 van de Wet were boerenlexicon][ref2]; of
             - een in de bijlage bij de [Verordening (EU) nr. 1408/2013][ref3] bedoeld dier;

        b. het beëindigen van een activiteit als bedoeld in het eerste lid, onder a, onder 2° of 3°, geschiedt binnen 12
        maanden na de conformational van de uitkering; en
        c. de maatregelen worden uitgevoerd tussen de datum van inwerkingtreding van deze regeling en uiterlijk
        31 december 2026.

      2 De uitkering bedraagt maximaal het bedrag van de kosten van de maatregelen, bedoeld in het eerste lid, verminderd
      met:

        a. de omzetbelasting die kan worden verhaald op de in aanmerking komende kosten; en
        b. de kosten die al zijn gecompenseerd door de Commissie schadevergoeding PAS-melders.

      3 De uitkering bedraagt voor de aankoop van onroerende zaken maximaal 85% van de aankoopwaarde.
      4 De uitkering voor het verkrijgen van stikstofdepositieruimte door aankoop als bedoeld in het eerste lid, onder a, onder
      4°, bedraagt:

        a. voor primair landbouwproducenten: maximaal het bedrag dat is uitgegeven voor de aankoop; en
        b. voor niet-landbouwproducenten: maximaal € 30.000.

      5 De uitkering voor omschakeling, stikstofemissiereductie of verplaatsing bedraagt maximaal € 60.000.


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002252#Artikel1
      [ref3]: 32013R1408
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel2
    machine_readable:
      conditions:
        - id: eligibility_period
          description: Measures must be taken between the regulation's effective date and December 31, 2026
          formula: |-
            AND(
              GE(execution_date, $valid_from),
              LE(execution_date, "2026-12-31")
            )
        - id: max_expenditure_per_project
          description: Expenditure per PAS project cannot exceed the business value or €2,000,000
          formula: |-
            LE(cost, MIN(business_value, 200000000))
        - id: property_depreciation
          description: For property acquisitions, subsidy is 85% of purchase price for depreciation
          formula: |-
            LE(subsidy_amount, MUL(purchase_price, 0.85))
        - id: subsidy_stikstofruimte_agriculture
          description: Subsidy for stikstofdepositieruimte acquisition by primary agricultural producers
          formula: |-
            LE(subsidy_amount, source.regulation["32013R1408", "Artikel3.2"])
        - id: subsidy_stikstofruimte_other
          description: Subsidy for stikstofdepositieruimte acquisition by non-agricultural businesses
          formula: |-
            LE(subsidy_amount, 30000000)
        - id: subsidy_omschakeling
          description: Subsidy for omschakeling, stikstofemissie reduction, or relocation
          formula: |-
            LE(subsidy_amount, 60000000)
      rules:
        - id: exclude_deductible_vat
          description: VAT that can be deducted is excluded
          formula: |-
            EXCLUDE(cost, vat_deductible)
        - id: exclude_compensated_costs
          description: Costs already compensated by PAS-melders Compensation Commission are excluded
          formula: |-
            EXCLUDE(cost, compensated_by_commission)
        - id: exclude_other_funding
          description: Costs already funded by other grants or subsidies are excluded
          formula: |-
            EXCLUDE(cost, other_funding)
      parameters:
        execution_date:
          type: datetime
          description: Date when the measure is executed
        cost:
          type: integer
          description: Total cost of the measure in eurocents
        business_value:
          type: integer
          description: Value of the business in eurocents
        purchase_price:
          type: integer
          description: Purchase price of the property in eurocents
        subsidy_amount:
          type: integer
          description: Requested subsidy amount in eurocents
        vat_deductible:
          type: boolean
          description: Whether VAT is deductible
        compensated_by_commission:
          type: boolean
          description: Whether costs are already compensated by PAS-melders Compensation Commission
        other_funding:
          type: boolean
          description: Whether costs are already funded by other grants or subsidies

  - number: '3'
    text: |-
      1 De uitkering bedraagt voor de begrotingjaren 2024 en 2025 samen € 226.900.000.
      2 De minister stelt vast voor welk bedrag per provincie uitkering wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel3
    machine_readable:
      conditions:
        - id: total_budget_cap
          description: Total budget for 2024 and 2025 is capped at €226.9M (22690000000 eurocents)
          formula: LE(total_allocated_amount, 22690000000)
      parameters:
        total_allocated_amount:
          type: integer
          description: Total allocated amount in eurocents across all provinces

  - number: '4'
    text: |-
      1 Een provincie kan voor de jaren 2024 en 2025 een uitkering aanvragen.
      2 Een provincie kan per aanvraag maximaal € 2.000.000 ontvangen.
      3 De minister kan per provincie een maximaal bedrag vaststellen.
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel4
    machine_readable:
      conditions:
        - id: application_years
          description: Applications can only be submitted for the years 2024 and 2025
          formula: OR(EQ(application_year, 2024), EQ(application_year, 2025))
        - id: max_per_province_request
          description: Maximum amount per province request is €2M (200000000 eurocents)
          formula: LE(requested_amount, 200000000)
      parameters:
        application_year:
          type: integer
          description: The year for which the application is submitted
        requested_amount:
          type: integer
          description: Requested amount in eurocents for the application

  - number: '5'
    text: |-
      1 De aanvraag bevat in ieder geval:

        a. de hoogte van de gevraagde uitkering, waaruit blijkt welk deel de btw, de daarvan compensabele btw en welk deel
        apparatskosten betreft;

        b. voor zover de uitkering wordt aangevraagd ter financiering van een of meer gemelde PAS-projecten die worden
        genoemd in de aanvraag: een plan van aanpak met een beschrijving van de getroffen of voorgenomen maatregelen
        inclusief de bijbehorende berekeningen met AERIUS Calculator of Qgis en de waarde van de onderneming of
        ondernemingen waarvoor de melding of de meldingen is of zijn gedaan;

        c. voor zover de uitkering wordt aangevraagd ter financiering van een door de provincie voorgenomen
        subsidieregeling: een plan van aanpak waaruit blijkt dat de regeling met voldoende zekerheid een oplossing biedt
        voor gemelde PAS-projecten;

        d. een verklaring dat de provincie voldoet aan de verplichtingen, bedoeld in [artikel 7][ref1].

      2 Het aangevraagde bedrag kan maximaal 5% apparaatskosten bevatten.

      3 De aanvraag wordt ingediend met gebruikmaking van een door de minister ter beschikking gesteld middel.


       [ref1]: https://wetten.overheid.nl/BWBR0050190#Artikel7
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0050190
        artikel: '7'

  - number: '6'
    text: |-
      1 De minister geeft binnen zes weken na het indienen van de aanvraag een beschikking omtrent verlening van de
      uitkering.

      2 De beschikking vermeldt het bedrag van de uitkering en het bedrag van de compensabele omzetbelasting dat wordt
      toegevoegd aan het BTW-compensatiefonds.

      3 De minister betaalt binnen 12 weken na de verzending van de beschikking een voorschot van 100%.
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel6
    machine_readable:
      conditions:
        - id: decision_deadline
          description: Decision on granting the allowance must be made within 6 weeks of application submission
          formula: LE(decision_date, ADD(application_submission_date, "P6W"))
        - id: payment_deadline
          description: Payment of 100% advance must be made within 12 weeks of sending the decision
          formula: LE(payment_date, ADD(decision_sent_date, "P12W"))
      parameters:
        application_submission_date:
          type: datetime
          description: Date and time when the application was submitted
        decision_date:
          type: datetime
          description: Date when the decision was made
        decision_sent_date:
          type: datetime
          description: Date when the decision was sent
        payment_date:
          type: datetime
          description: Date when the 100% advance payment was made

  - number: '7'
    text: |-
      1 De provincie spant zich ervoor in om de uitkering te besteden op de meest kostenefficiënte wijze per gemeld PAS-
      project.

      2 De provincie houdt bij de besteding van de middelen rekening met haar voornemens voor het landelijk gebied en de
      opgaven voor stikstof, natuur, water en klimaat.
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel7

  - number: '8'
    text: |-
      1 Voor zover de uitkering is verstrekt voor de waardedaling, bedoeld in [artikel 2, derde lid][ref1], stelt de
      provincie de minister in één keer voor de hele uitkering, uiterlijk 15 juli 2029 gelijktijdig met de jaarlijkse
      verantwoording, bedoeld in [artikel 12, eerste lid][ref2], in kennis van de aankoopwaarde en van de opbrengst- of
      restwaarde van die goederen.

      2 De aankoopwaarde en de restwaarde van de betrokken goederen worden bepaald door een onafhankelijke taxateur. Het
      rapport van de taxateur over de restwaarde wordt door de provincie verstrekt bij de inkennisstelling, bedoeld in
      het eerste lid.


       [ref1]: https://wetten.overheid.nl/BWBR0050190#Artikel2
       [ref2]: https://wetten.overheid.nl/BWBR0050190#Artikel12
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0050190
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0050190
        artikel: '12'

  - number: '9'
    text: |-
      1 De provincie neemt bij de besteding van de uitkering het Unierecht met betrekking tot mededinging, aanbesteding
      en staatssteun in acht.

      2 De provincie informeert de minister op verzoek over de voortgang van de maatregelen waarvoor de uitkering is
      verstrekt.

      3 De provincie zorgt ervoor dat de verkregen stikstofdepositieruimte die zij niet vóór de vaststelling van de
      uitkering gebruikt voor de in [artikel 2, eerste lid][ref1], bedoelde maatregelen, beschikbaar blijft om te worden
      opgenomen in de SSRS-bank, bedoeld in [art. 17a.6 van de Omgevingsregeling][ref2].

      4 De minister kan in de beschikking tot verlening verplichtingen opleggen over de wijze van vastlegging van de
      gegevens die zijn gebruikt bij het in kaart brengen van de effecten van de maatregelen waarvoor de uitkering is
      verstrekt.

      5 De minister kan in de beschikking tot verlening andere verplichtingen opleggen in het belang van het legaliseren
      van de projecten, bedoeld in [artikel 22.21, eerste lid, van de Omgevingswet][ref3].


       [ref1]: https://wetten.overheid.nl/BWBR0050190#Artikel2
       [ref2]: https://wetten.overheid.nl/BWBR0045528#Artikel17a.6
       [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel22.21
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0050190
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0045528
        artikel: 17a.6
      - id: ref3
        bwb_id: BWBR0037885
        artikel: '22.21'

  - number: '10'
    text: |-
      1 De minister bepaalt in de beschikking tot verlening tot wanneer de maatregelen kunnen worden uitgevoerd.

      2 De minister kan voor een of meer maatregelen de in het eerste lid bedoelde periode en de termijn, genannt in
      [artikel 8, eerste lid][ref1], op verzoek van de provincie eenmalig verlengen met ten hoogste vier jaar.


       [ref1]: https://wetten.overheid.nl/BWBR0050190#Artikel8
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0050190
        artikel: '8'
    machine_readable:
      conditions:
        - id: execution_period_extension
          description: The execution period for measures can be extended by up to 4 years (1460 days) upon request
          formula: LE(extension_period_days, 1460)
      parameters:
        extension_period_days:
          type: integer
          description: The requested extension period in days (max 1460 days)
        execution_deadline:
          type: datetime
          description: The original deadline for executing the measures
        new_execution_deadline:
          type: datetime
          description: The extended deadline for executing the measures (execution_deadline + extension_period_days)

  - number: '11'
    text: |-
      1 De minister kan voor een beoordeling van de juistheid van de informatie die is verstrekt bij deiening van
      aanvragen op grond van deze regeling gebruikmaken van de daarvoor noodzakelijke gegevens die zijn opgenomen in
      registraties op grond van de volgende wettelijke voorschriften:

        a. [Meststoffenwet][ref1];

        b. [Wet dieren][ref2];

        c. [Landbouwwet][ref3];

        d. [Verordening (EU) 2016/429][ref4] van het Europees Parlement en de Raad van 9 maart 2016 betreffende
        overdraagbare dierziekten en tot wijziging en intrekking van bepaalde handelingen op het gebied van diergezondheid
        (diergezondheidswetgeving);

        e. Gedelegeerde [verordening (EU) 2019/2035][ref5] van de Commissie van 28 juni 2019 tot aanvulling van
        [Verordening (EU) 2016/429][ref4] van het Europees Parlement en de Raad wat betreft regels voor inrichtingen
        waar landdieren worden gehouden en broederijen, alsmede voor de traceerbaarheid van bepaalde gehouden landdieren
        en broedeieren.

      2 De minister kan gegevens die in het kader van deze regeling zijn verstrekt:

        a. ook verwerken voor:

          1°. het opnemen van stikstofdepositieruimte in AERIUS register;

          2°. de toepassing van [artikel 20.1, eerste lid, van de Omgevingswet][ref6], de
          [artikelen 11.68][ref7], [11.69][ref8], [11.69a][ref9], [11.69c][ref10], [12.26b][ref11] en
          [12.26c van het Besluit kwaliteit leefomgeving][ref12] en de [artikelen 10.36dc][ref13] en
          [15.5 van het Omgevingsbesluit][ref14];

        b. verstrekken aan kennisinstellingen met het oog op monitoring, voortgang en evaluatie.


