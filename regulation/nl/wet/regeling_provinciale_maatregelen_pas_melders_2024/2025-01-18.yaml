  - number: '12'
    text: |-
      1 De provincie legt jaarlijks verantwoording af over de besteding van de uitkering op de wijze, bedoeld in
      artikel 17a van de Financiële-verhoudingswet.

      2 Nadat de minister de relevante verantwoordingsinformatie, bedoeld in
      artikel 17a van de Financiële-verhoudingswet, heeft ontvangen van de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties, stelt de minister de uitkering binnen 22 weken na die ontvangst ambtshalve vast.
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a

  - number: '13'
    text: |-
      1 Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst.

      2 Deze regeling vervalt met ingang van 1 januari 2027, met dien verstande dat zij van toepassing blijft op
      uitkeringen die voor die datum zijn aangevraagd, verleend of vastgesteld.
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel13
    machine_readable:
      conditions:
        - id: regulation_validity_period
          description: Regulation is valid from effective date until 1 January 2027
          formula: |-
            AND(
              GE(application_date, $valid_from),
              LT(application_date, "2027-01-01")
            )
        - id: continued_applicability
          description: Regulation continues to apply to allowances applied for, granted, or determined before 1 January 2027
          formula: |-
            OR(
              LT(allowance_application_date, "2027-01-01"),
              LT(allowance_granted_date, "2027-01-01"),
              LT(allowance_determined_date, "2027-01-01")
            )
      parameters:
        application_date:
          type: datetime
          description: Date when the regulation is applied
        allowance_application_date:
          type: datetime
          description: Date when the allowance was applied for
        allowance_granted_date:
          type: datetime
          description: Date when the allowance was granted
        allowance_determined_date:
          type: datetime
          description: Date when the allowance was determined

  - number: '14'
    text: 'Deze regeling wordt aangehaald als: Regeling provinciale maatregelen PAS-melders 2024.'
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel14
