$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_provinciale_maatregelen_pas_melders_2024
regulatory_layer: WET
publication_date: '2024-09-05'
valid_from: '2025-01-18'
bwb_id: BWBR0050190
url: https://wetten.overheid.nl/BWBR0050190/2025-01-18
preamble:
  text: |-
    Gelet op de artikelen 2a, eerste lid, onder d, en 3 van de Kaderwet EZK- en LNV-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *gemeld PAS-project:* Natura 2000-activiteit die voldoet aan de
      voorwaarden van [artikel 17a.14 van de Omgevingsregeling][ref1];
        - *minister:* Minister van Landbouw, Visserij, Voedselzekerheid en Natuur;
        - *onafhankelijke taxateur:* taxateur die is ingeschreven in de van toepassing zijnde Kamer van het Nederlands
      Register Vastgoed Taxateurs.


      [ref1]: https://wetten.overheid.nl/BWBR0045528#Artikel17a
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0045528
        artikel: 17a
  - number: '2.1'
    text: |-
      De minister kan aan een provincie op aanvraag een specifieke uitkering verstrekken voor maatregelen die met
      voldoende zekerheid een oplossing bieden voor gemelde PAS-projecten en getroffen worden in de periode vanaf de
      inwerkingtreding van deze regeling tot en met 31 december 2026.
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel2
  - number: '2.2'
    text: |-
      Een maatregel als bedoeld in het eerste lid komt slechts in aanmerking voor een uitkering als voor het bieden
      van een oplossing voor een gemeld PAS-project niet meer middelen worden besteed dan de waarde van de onderneming
      waarvoor de melding is gedaan, met een maximum van € 2.000.000, zoals bepaald door een onafhankelijke taxateur.
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel2
  - number: '2.3'
    text: |-
      Als de oplossing het kopen van onroerende goederen omvat, kan de uitkering alleen worden verstrekt voor de
      waardedaling van de onroerende goederen door functieverandering of gebruiksbeperkingen. De uitkering bedraagt
      maximaal 85% van het aankoopbedrag.
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel2
  - number: '2.4'
    text: |-
      Een maatregel als bedoeld in het eerste lid kan inhouden dat de provincie een subsidie verstrekt aan ondernemingen
      waarvoor de melding is gedaan. De subsidie kan worden verstrekt voor verwerving van stikstofdepositieruimte,
      omschakeling, de reductie van stikstofemissie of verplaatsing, of voor de onomkeerbare volledige of gedeeltelijke
      sluiting van een veehouderijlocatie als bedoeld in artikel 5, eerste lid, van de Regeling provinciale
      gebiedsgerichte beëindiging veehouderijlocaties.
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel2
  - number: '2.5'
    text: 'Een subsidie als bedoeld in het vierde lid bedraagt per gemeld PAS-project voor:'
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel2
  - number: 2.5.a
    text: 'verwerving van stikstofdepositieruimte:'
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel2
  - number: 2.5.a.1°
    text: |-
      als de onderneming waarvoor de melding is gedaan, actief is in de primaire productie van landbouwproducten:
      maximaal het totale bedrag aan de-minimissteun dat mag worden verleend op grond van artikel 3, tweede lid,
      van [Verordening (EU) 1408/2013](32013R1408) van de Commissie van 18 december 2013 inzake de toepassing van
      de artikelen 107 en 108 van het Verdrag betreffende de werking van de Europese Unie op de-minimissteun in de
      landbouwsector;
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel2
  - number: 2.5.a.2°
    text: 'in andere gevallen: maximaal € 300.000;'
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel2
  - number: 2.5.b
    text: 'omschakeling, reductie van stikstofemissie of verplaatsing: maximaal € 600.000.'
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel2
  - number: '2.6'
    text: |-
      Een subsidie voor een sluiting als bedoeld in het vierde lid voldoet aan de Regeling provinciale gebiedsgerichte
      beëindiging veehouderijlocaties.
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel2
  - number: '2.7'
    text: Het tweede lid geldt niet voor een subsidie als bedoeld in het vierde, vijfde en zesde lid.
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel2
  - number: '2.8'
    text: |-
      De uitkering kan alleen worden verstrekt voor de kosten van verplichtingen die door de provincie zijn of worden
      aangegaan na de inwerkingtreding van deze regeling.
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel2
  - number: '2.9'
    text: 'De uitkering wordt niet verstrekt voor:'
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel2
  - number: 2.9.a
    text: |-
      de omzetbelasting die de provincie kan aftrekken op grond van de [Wet op de omzetbelasting 1968][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: 2.9.b
    text: |-
      kosten waarvoor de betrokken ondernemer al een vergoeding heeft ontvangen van de Commissie schadevergoeding PAS-
      melders;
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel2
  - number: 2.9.c
    text: kosten waarvoor al uit anderen hoofde een uitkering of subsidie is of wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel2
  - number: '3'
    text: |-
      Het uitkeringsplafond bedraagt in totaal € 226.900.000, inclusief de omzetbelasting waarvoor de provincie op grond
      van de [Wet op het BTW-compensatiefonds][ref1] voor compensatie in aanmerking komt.


      [ref1]: https://wetten.overheid.nl/BWBR0013817
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013817
  - number: '4.1'
    text: |-
      Een provincie kan in de periodes, genoemd in de tabel, telkens één aanvraag indienen. Voor elke periode geldt het
      daarbij genoemde beschikbare budget en maximumbedrag per aanvraag, beide inclusief de compensabele omzetbelasting,
      bedoeld in [artikel 3][ref1].







                    Aanvraagperiode


                    Beschikbaar budget


                    Maximumbedrag per aanvraag






                    9 september 2024 9 uur tot 4 oktober 2024 17 uur


                    € 94,8 miljoen


                    € 7,9 miljoen




                    3 februari 2025 9 uur tot 28 februari 2025 17 uur


                    € 46,15 miljoen


                    € 4,615 miljoen




                    1 september 2025 9 uur tot 30 september 2025 17 uur


                    € 46,15 miljoen


                    € 4,615 miljoen




                    2 februari 2026 9 uur tot 27 februari 2026 17 uur


                    € 39,8 miljoen


                    € 3,98 miljoen


      [ref1]: https://wetten.overheid.nl/BWBR0050190#Artikel3
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0050190
        artikel: '3'
  - number: '4.2'
    text: Het beschikbare budget wordt verdeeld op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel4
  - number: '4.3'
    text: |-
      Als een aanvrager niet heeft voldaan aan enig wettelijk voorschrift voor het in behandeling nemen van de aanvraag
      en met toepassing van [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad de aanvraag
      aan te vullen, geldt voor de verdeling de dag waarop de aanvraag voldoet aan de wettelijke voorschriften als dag
      van binnenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '5.1'
    text: 'De aanvraag bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel5
  - number: 5.1.a
    text: |-
      de hoogte van de gevraagde uitkering, waaruit blijkt welk deel de btw, de daarvan compensabele btw en welk deel
      apparaatskosten betreft;
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel5
  - number: 5.1.b
    text: |-
      voor zover de uitkering wordt aangevraagd ter financiering van een of meer gemelde PAS-projecten die worden genoemd
      in de aanvraag: een plan van aanpak met een beschrijving van de getroffen of voorgenomen maatregelen inclusief de
      bijbehorende berekeningen met AERIUS Calculator of Qgis en de waarde van de onderneming of ondernemingen waarvoor
      de melding of de meldingen is of zijn gedaan;
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel5
  - number: 5.1.c
    text: |-
      voor zover de uitkering wordt aangevraagd ter financiering van een door de provincie voorgenomen subsidieregeling:
      een plan van aanpak waaruit blijkt dat de regeling met voldoende zekerheid een oplossing biedt voor gemelde PAS-
      projecten;
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel5
  - number: 5.1.d
    text: |-
      een verklaring dat de provincie voldoet aan de verplichtingen, bedoeld in [artikel 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050190#Artikel7
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0050190
        artikel: '7'
  - number: '5.2'
    text: Het aangevraagde bedrag kan maximaal 5% apparaatskosten bevatten.
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel5
  - number: '5.3'
    text: De aanvraag wordt ingediend met gebruikmaking van een door de minister ter beschikking gesteld middel.
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel5
  - number: '6.1'
    text: |-
      De minister geeft binnen zes weken na het indienen van de aanvraag een beschikking omtrent verlening van de
      uitkering.
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel6
  - number: '6.2'
    text: |-
      De beschikking vermeldt het bedrag van de uitkering en het bedrag van de compensabele omzetbelasting dat wordt
      toegevoegd aan het BTW-compensatiefonds.
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel6
  - number: '6.3'
    text: De minister betaalt binnen 12 weken na de verzending van de beschikking een voorschot van 100%.
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel6
  - number: '7.1'
    text: |-
      De provincie spant zich ervoor in om de uitkering te besteden op de meest kostenefficiënte wijze per gemeld PAS-
      project.
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel7
  - number: '7.2'
    text: |-
      De provincie houdt bij de besteding van de middelen rekening met haar voornemens voor het landelijk gebied en de
      opgaven voor stikstof, natuur, water en klimaat.
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel7
  - number: '8.1'
    text: |-
      Voor zover de uitkering is verstrekt voor de waardedaling, bedoeld in [artikel 2, derde lid][ref1], stelt de
      provincie de minister in één keer voor de hele uitkering, uiterlijk 15 juli 2029 gelijktijdig met de jaarlijkse
      verantwoording, bedoeld in [artikel 12, eerste lid][ref2], in kennis van de aankoopwaarde en van de opbrengst- of
      restwaarde van die goederen.


      [ref1]: https://wetten.overheid.nl/BWBR0050190#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0050190#Artikel12
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0050190
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0050190
        artikel: '12'
  - number: '8.2'
    text: |-
      De aankoopwaarde en de restwaarde van de betrokken goederen worden bepaald door een onafhankelijke taxateur. Het
      rapport van de taxateur over de restwaarde wordt door de provincie verstrekt bij de inkennisstelling, bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel8
  - number: '9.1'
    text: |-
      De provincie neemt bij de besteding van de uitkering het Unierecht met betrekking tot mededinging, aanbesteding en
      staatssteun in acht.
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel9
  - number: '9.2'
    text: |-
      De provincie informeert de minister op verzoek over de voortgang van de maatregelen waarvoor de uitkering is
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel9
  - number: '9.3'
    text: |-
      De provincie zorgt ervoor dat de verkregen stikstofdepositieruimte die zij niet vóór de vaststelling van de
      uitkering gebruikt voor de in [artikel 2, eerste lid][ref1], bedoelde maatregelen, beschikbaar blijft om te worden
      opgenomen in de SSRS-bank, bedoeld in [art. 17a.6 van de Omgevingsregeling][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0050190#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045528#Artikel17a
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0050190
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0045528
        artikel: 17a
  - number: '9.4'
    text: |-
      De minister kan in de beschikking tot verlening verplichtingen opleggen over de wijze van vastlegging van de
      gegevens die zijn gebruikt bij het in kaart brengen van de effecten van de maatregelen waarvoor de uitkering is
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel9
  - number: '9.5'
    text: |-
      De minister kan in de beschikking tot verlening andere verplichtingen opleggen in het belang van het legaliseren
      van de projecten, bedoeld in [artikel 22.21, eerste lid, van de Omgevingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel22
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '22'
  - number: '10.1'
    text: De minister bepaalt in de beschikking tot verlening tot wanneer de maatregelen kunnen worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel10
  - number: '10.2'
    text: |-
      De minister kan voor een of meer maatregelen de in het eerste lid bedoelde periode en de termijn, genoemd in
      [artikel 8, eerste lid][ref1], op verzoek van de provincie eenmalig verlengen met ten hoogste vier jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0050190#Artikel8
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0050190
        artikel: '8'
  - number: '11.1'
    text: |-
      De minister kan voor een beoordeling van de juistheid van de informatie die is verstrekt bij de indiening van
      aanvragen op grond van deze regeling gebruikmaken van de daarvoor noodzakelijke gegevens die zijn opgenomen in
      registraties op grond van de volgende wettelijke voorschriften:
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel11
  - number: 11.1.a
    text: |-
      [Meststoffenwet][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: 11.1.b
    text: |-
      [Wet dieren][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0030250
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0030250
  - number: 11.1.c
    text: |-
      [Landbouwwet][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0002252
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002252
  - number: 11.1.d
    text: |-
      [Verordening (EU) 2016/429](32016R0429) van het Europees Parlement en de Raad van 9 maart 2016 betreffende
      overdraagbare dierziekten en tot wijziging en intrekking van bepaalde handelingen op het gebied van diergezondheid
      (‘diergezondheidswetgeving’);
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel11
  - number: 11.1.e
    text: |-
      Gedelegeerde [verordening (EU) 2019/2035](32019R2035) van de Commissie van 28 juni 2019 tot aanvulling van
      [Verordening (EU) 2016/429](32016R0429) van het Europees Parlement en de Raad wat betreft regels voor inrichtingen
      waar landdieren worden gehouden en broederijen, alsmede voor de traceerbaarheid van bepaalde gehouden landdieren
      en broedeieren.
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel11
  - number: '11.2'
    text: 'De minister kan gegevens die in het kader van deze regeling zijn verstrekt:'
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel11
  - number: 11.2.a
    text: 'ook verwerken voor:'
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel11
  - number: 11.2.a.1°
    text: het opnemen van stikstofdepositieruimte in AERIUS register;
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel11
  - number: 11.2.a.2°
    text: |-
      de toepassing van [artikel 20.1, eerste lid, van de Omgevingswet][ref1], de [artikelen 11.68][ref2], [11.69][ref3],
      [11.69a][ref4], [11.69c][ref5], [12.26b][ref6] en [12.26c van het Besluit kwaliteit leefomgeving][ref7] en de
      [artikelen 10.36dc][ref8] en [15.5 van het Omgevingsbesluit][ref9];


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0041313#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0041313#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0041313#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0041313#Artikel11
      [ref6]: https://wetten.overheid.nl/BWBR0041313#Artikel12
      [ref7]: https://wetten.overheid.nl/BWBR0041313#Artikel12
      [ref8]: https://wetten.overheid.nl/BWBR0041278#Artikel10
      [ref9]: https://wetten.overheid.nl/BWBR0041278#Artikel15
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel11
    references:
      - id: ref1
