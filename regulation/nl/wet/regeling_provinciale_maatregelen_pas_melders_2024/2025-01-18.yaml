        artikel: '10'
      - id: ref9
        bwb_id: BWBR0041278
        artikel: '15'
  - number: 11.2.b
    text: verstrekken aan kennisinstellingen met het oog op monitoring, voortgang en evaluatie.
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel11
  - number: '12.1'
    text: |-
      De provincie legt jaarlijks verantwoording af over de besteding van de uitkering op de wijze, bedoeld in
      [artikel 17a van de Financiële-verhoudingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a
  - number: '12.2'
    text: |-
      Nadat de minister de relevante verantwoordingsinformatie, bedoeld in
      [artikel 17a van de Financiële-verhoudingswet][ref1], heeft ontvangen van de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties, stelt de minister de uitkering binnen 22 weken na die ontvangst ambtshalve vast.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a
  - number: '13.1'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel13
  - number: '13.2'
    text: |-
      Deze regeling vervalt met ingang van 1 januari 2027, met dien verstande dat zij van toepassing blijft op
      uitkeringen die voor die datum zijn aangevraagd, verleend of vastgesteld.
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel13
  - number: '14'
    text: 'Deze regeling wordt aangehaald als: Regeling provinciale maatregelen PAS-melders 2024.'
    url: https://wetten.overheid.nl/BWBR0050190/2025-01-18#Artikel14
