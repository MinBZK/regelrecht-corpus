  - number: '111.4'
    text: |-
      Voor zover het meerjarige inzicht, bedoeld in [artikel 5, eerste lid juncto tweede lid][ref1], en
      [artikel 54, eerste lid juncto tweede lid][ref2], in de jaren 2002 tot en met 2006 niet zonder meer beschikbaar is,
      kan Onze Minister van Financiën bepalen dat andere informatie wordt verstrekt.


