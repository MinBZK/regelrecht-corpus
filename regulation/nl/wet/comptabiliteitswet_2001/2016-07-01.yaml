---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: comptabiliteitswet_2001
regulatory_layer: WET
publication_date: '2017-04-07'
valid_from: '2016-07-01'
bwb_id: BWBR0013891
url: https://wetten.overheid.nl/BWBR0013891/2016-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten.

    Alzo Wij in overweging genomen hebben dat het wenselijk is de Comptabiliteitswet te vervangen door nieuwe
    wettelijke bepalingen over het beheer van de financiën van het Rijk, mede ter uitvoering van de artikelen 78 en 105
    van de Grondwet;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan gelijk Wij goedvinden en verstaan bij deze.
  url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Tot de Rijksbegroting behoren:'
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel1
  - number: 1.1.a
    text: 'de begrotingen van de onderscheiden ministeries, hierna te noemen: de departementale begrotingen;'
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel1
  - number: 1.1.b
    text: de begrotingen van nationale schuld;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel1
  - number: 1.1.c
    text: |-
      de begroting van koninkrijksrelaties, tenzij de verplichtingen, uitgaven en ontvangsten die samenhangen
      met koninkrijksrelaties worden opgenomen in de begroting van het ministerie van Binnenlandse Zaken en
      Koninkrijksrelaties;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel1
  - number: 1.1.d
    text: de begroting van de Koning;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel1
  - number: 1.1.e
    text: de begroting van het Kabinet van de Koning;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel1
  - number: 1.1.f
    text: de begroting van de Staten-Generaal;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel1
  - number: 1.1.g
    text: de begroting van de overige Hoge Colleges van Staat en de Kabinetten van de Gouverneurs;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel1
  - number: 1.1.h
    text: de begroting van de Commissie van toezicht betreffende de inlichtingen- en veiligheidsdiensten;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel1
  - number: 1.1.i
    text: |-
      de begrotingen van de onderscheiden begrotingsfondsen, bedoeld in [artikel 9][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel9
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '9'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 1.1.j
    text: |-
      een andere begroting, indien die begroting aan de Rijksbegroting wordt toegevoegd bij de wet waarmee die begroting
      voor de eerste keer wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel1
  - number: '1.2'
    text: |-
      Begrotingen bestaan uit een begrotingsstaat als bedoeld in [artikel 4, eerste lid][ref1], waarin zijn opgenomen de
      begrotingsartikelen, en een bij die staat behorende toelichting.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel4
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '1.3'
    text: De begrotingsstaten worden elk afzonderlijk bij de wet vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel1
  - number: '1.4'
    text: |-
      In afwijking van het derde lid worden de begrotingsstaten van het Kabinet van de Koning en van de Commissie van
      toezicht betreffende de inlichtingen- en veiligheidsdiensten vastgesteld bij de wet waarmee de departementale
      begrotingsstaat van het Ministerie van Algemene Zaken wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel1
  - number: '1.5'
    text: |-
      In afwijking van het derde lid kan Onze betrokken Minister besluiten de begrotingsstaat van de departementale
      begroting en de begrotingsstaat van een begrotingsfonds waarover hij het beheer voert, in één wet te laten
      vaststellen.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel1
  - number: '1.6'
    text: |-
      In afwijking van het derde lid wordt de begrotingsstaat van nationale schuld vastgesteld bij de wet waarmee de
      departementale begrotingsstaat van het Ministerie van Financiën wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel1
  - number: '2.1'
    text: Het begrotingsjaar is het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel2
  - number: '2.2'
    text: Begrotingsartikelen worden onderscheiden in beleidsartikelen en niet-beleidsartikelen.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel2
  - number: '2.3'
    text: |-
      De begrotingen bevatten de ramingen van de verplichtingen, de uitgaven en de ontvangsten, voor zover de daarmee
      gemoeide gelden niet toebehoren aan derden.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel2
  - number: '2.4'
    text: |-
      In afwijking van het derde lid, bevatten de begrotingen geen ramingen van de verplichtingen, de uitgaven en de
      ontvangsten die op grond van [artikel 28, tweede lid][ref1], buiten het begrotingsverband zullen worden gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel28
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '28'
        hoofdstuk: II
        paragraaf: '4'
  - number: '3.1'
    text: 'Onder uitgaven en ontvangsten van een jaar worden verstaan:'
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel3
  - number: 3.1.a
    text: de geldelijke betalingen en ontvangsten in dat jaar;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel3
  - number: 3.1.b
    text: |-
      de niet-geldelijke betalingen en ontvangsten in dat jaar, bedoeld in [artikel 30, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel30
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '30'
        hoofdstuk: II
        paragraaf: '4'
  - number: 3.1.c
    text: |-
      de verrekeningen, bedoeld in [artikel 31, eerste lid][ref1], die in dat jaar plaatsvinden;


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel31
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '31'
        hoofdstuk: II
        paragraaf: '4'
  - number: 3.1.d
    text: |-
      de toevoegingen en onttrekkingen aan een begrotingsreserve als bedoeld in [artikel 5, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel5
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '5'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 3.1.e
    text: |-
      de toevoegingen en onttrekkingen aan een kasreserve als bedoeld in [artikel 11a, zevende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel11a
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: 11a
        hoofdstuk: '1'
        paragraaf: 2a
  - number: '3.2'
    text: |-
      Als verplichting van een jaar wordt geraamd het bedrag van de verplichting die in dat jaar rechtstreeks ontstaat op
      grond van een verdrag, een wet, een koninklijk besluit, een ministeriële regeling, een beschikking, een verbintenis
      of een op een controleerbare wijze vastgelegde afspraak tussen dienstonderdelen en die in dat jaar dan wel in een
      later jaar tot uitgaven leidt of kan leiden.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel3
  - number: '3.3'
    text: |-
      In afwijking van het tweede lid kan als verplichting van een jaar worden opgenomen het bedrag dat in dat jaar als
      uitgave wordt geraamd met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel3
  - number: 3.3.a
    text: salarissen, wachtgelden en soortgelijke periodieke verplichtingen;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel3
  - number: 3.3.b
    text: de uitgaven, opgenomen in de begroting van nationale schuld;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel3
  - number: 3.3.c
    text: huren, pachten en soortgelijke periodieke verplichtingen;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel3
  - number: 3.3.d
    text: andere door Onze Minister van Financiën aan te wijzen categorieën verplichtingen.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel3
  - number: '3.4'
    text: |-
      Onze Minister van Financiën doet aan de Algemene Rekenkamer schriftelijk mededeling van de aangewezen categorieën
      verplichtingen.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel3
  - number: '4.1'
    text: 'De begrotingsstaat bevat per begrotingsartikel in elk geval de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel4
  - number: 4.1.a
    text: het artikelnummer;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel4
  - number: 4.1.b
    text: de artikelomschrijving;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel4
  - number: 4.1.c
    text: bruto het maximumbedrag dat voor het aangaan van verplichtingen in het begrotingsjaar beschikbaar is;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel4
  - number: 4.1.d
    text: bruto het maximumbedrag dat voor het verrichten van uitgaven in het begrotingsjaar beschikbaar is;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel4
  - number: 4.1.e
    text: bruto het bedrag dat aan ontvangsten in het begrotingsjaar geraamd wordt.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel4
  - number: '4.2'
    text: Een begrotingsartikel is de kleinste eenheid in de begrotingsstaat.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel4
  - number: '4.3'
    text: |-
      Het eerste lid, onder d en e, is niet van toepassing op de uitgaven en de ontvangsten die op grond van
      [artikel 28, vierde lid][ref1], in mindering zullen worden gebracht op ontvangsten, onderscheidenlijk uitgaven.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel28
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '28'
        hoofdstuk: II
        paragraaf: '4'
  - number: '5.1'
    text: |-
      De toelichting bij de begrotingsstaat biedt in algemene zin of per begrotingsartikel inzicht in relevante met
      de beleids- en bedrijfsvoering samenhangende aspecten, waarvoor Onze betrokken Minister mede op grond van de
      [artikelen 20][ref1] en [21][ref2] verantwoordelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel21
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '20'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013891
        artikel: '21'
        hoofdstuk: II
        paragraaf: '3'
  - number: '5.2'
    text: |-
      Onze Minister van Financiën schrijft met toepassing van [artikel 18, eerste lid, aanhef en onder a][ref1], de
      relevante aspecten, bedoeld in het eerste lid, voor.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel18
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '18'
        hoofdstuk: '1'
        paragraaf: '6'
  - number: '5.4'
    text: |-
      Met toestemming van Onze Minister van Financiën kan ten laste van een begrotingsartikel een meerjarige
      begrotingsreserve worden aangehouden.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel5
  - number: '5.5'
    text: |-
      De toelichting bij een begrotingsartikel ten laste waarvan een begrotingsreserve wordt aangehouden, vermeldt
      de motieven voor het aanhouden ervan en biedt inzicht in de omvang van de reserve, alsmede zo mogelijk in de
      toevoeging en of onttrekking aan de reserve die in het begrotingsjaar worden verwacht.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel5
  - number: '6.1'
    text: 'Een begroting kan drie niet-beleidsartikelen bevatten, te weten:'
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel6
  - number: 6.1.a
    text: |-
      een begrotingsartikel met de omschrijving *Algemeen* voor de verplichtingen, uitgaven en ontvangsten die niet aan
      een beleidsartikel worden toegedeeld;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel6
  - number: 6.1.b
    text: |-
      een begrotingsartikel met de omschrijving *Geheim* voor de verplichtingen, uitgaven en ontvangsten waarvoor geldt
      dat openbaarmaking via toedeling aan een beleidsartikel niet in het belang van de staat is;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel6
  - number: 6.1.c
    text: een administratief begrotingsartikel met de omschrijving*Nominaal en onvoorzien*.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel6
  - number: '6.2'
    text: |-
      De bij het administratieve begrotingsartikel *Nominaal en onvoorzien* opgenomen bedragen voor verplichtingen en
      voor uitgaven kunnen zowel positief als negatief zijn.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel6
  - number: '6.3'
    text: |-
      Ten laste van het begrotingsartikel *Nominaal en onvoorzien* kunnen geen uitgaven worden gedaan en verplichtingen
      worden aangegaan; de bedragen worden bij een wijziging van de begroting toegedeeld aan een ander begrotingsartikel
      en wel zodanig dat in het betrokken jaarverslag de gerealiseerde bedragen bij het begrotingsartikel *Nominaal en
      onvoorzien* uitkomen op nihil.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel6
  - number: '6.5'
    text: |-
      In afwijking van het eerste lid en in overeenstemming met Onze Minister van Financiën kan een begroting andere
      niet-beleidsartikelen bevatten.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel6
  - number: '7.1'
    text: 'De begroting van nationale schuld bevat de ramingen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel7
  - number: 7.1.a
    text: |-
      de uitgaven en ontvangsten die voortvloeien uit transacties op de financiële markten, voor zover die transacties
      een oorspronkelijke looptijd hebben van langer dan één jaar;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel7
  - number: 7.1.b
    text: |-
      de mutatie per 31 december van het begrotingsjaar ten opzichte van 31 december van het voorgaande jaar in het saldo
      van uitgaven en ontvangsten die voortvloeien uit transacties op de financiële markten, voor zover die transacties
      een oorspronkelijke looptijd hebben van maximaal één jaar;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel7
  - number: 7.1.c
    text: |-
      de uitgaven en ontvangsten die voortvloeien uit door Onze Minister van Financiën met derden of met baten-
      lastendiensten aan te gane leningstransacties, voor zover die transacties door Onze Minister van Financiën niet
      worden geraamd op de departementale begroting van het Ministerie van Financiën;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel7
  - number: 7.1.d
    text: |-
      de mutatie per 31 december van het begrotingsjaar ten opzichte van 31 december van het voorafgaande jaar in het
      totaalsaldo van de rekeningen-courant, inclusief de daaraan gekoppelde termijndeposito's, die derden en baten-
      lastendiensten aanhouden bij 's Rijks schatkist;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel7
  - number: 7.1.e
    text: |-
      de uitgaven en ontvangsten aan rente, boete, kosten en provisie die voortvloeien uit de transacties, bedoeld onder
      b, alsmede uit de rekeningen-courant, bedoeld onder d;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel7
  - number: 7.1.f
    text: |-
      andere door Onze Minister van Financiën aan te wijzen uitgaven en ontvangsten die voortvloeien uit vermogens- of
      financieringstransacties;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel7
  - number: 7.1.g
    text: |-
      de uitgaven en ontvangsten die voortvloeien uit het betalingsverkeer met betrekking tot de centrale kassen, bedoeld
      in [artikel 24, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel24
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '24'
        hoofdstuk: II
        paragraaf: '3.1'
  - number: 7.1.h
    text: de uitgaven en ontvangsten van het personeel en het materieel met betrekking tot die begroting.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel7
  - number: '7.2'
    text: |-
      De mutaties, bedoeld in het eerste lid, onder b en d, worden als uitgave of als ontvangst opgenomen in de slotwet
      van de begroting van nationale schuld.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel7
  - number: '7.3'
    text: |-
      In afwijking van [artikel 3, eerste lid, aanhef en onder a][ref1], worden onder renteuitgaven en rente-ontvangsten
      van een jaar in de begroting van nationale schuld niet verstaan de geldelijke betalingen en ontvangsten in
      dat jaar, maar de rentekosten onderscheidenlijk de renteopbrengsten die op transactiebasis aan een jaar worden
      toegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel3
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '3'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '8'
    text: |-
      De begroting van de Koning bevat de uitkeringen aan de leden van het koninklijk huis, alsmede de uitgaven die
      functioneel samenhangen met het koningschap. De begrotingsartikelen waarin die uitkeringen worden opgenomen hebben
      het karakter van een niet-beleidsartikel.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel8
  - number: '9.1'
    text: |-
      Ten behoeve van een afzonderlijk beheer van ontvangsten en uitgaven van het Rijk kan een begrotingsfonds worden
      ingesteld.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel9
  - number: '9.2'
    text: De instelling van een begrotingsfonds geschiedt bij de wet.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel9
  - number: '9.3'
    text: |-
      De wet tot instelling van een begrotingsfonds bepaalt de aard van de uitgaven en van de ontvangsten van het
      betrokken fonds, de bestemming van een batig dan wel de aanvulling van een nadelig jaarsaldo van het fonds, alsmede
      wie van Onze Ministers verantwoordelijk is voor het beheer van de begroting van het fonds.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel9
  - number: 9a.1
    text: |-
      In afwijking van [artikel 1, eerste lid, onder i][ref1], artikel 1, tweede en derde lid, en
      [artikel 12, eerste lid][ref2], kan vanaf het begrotingsjaar 2012 worden afgezien van het indienen van een voorstel
      van wet tot vaststelling van de begrotingsstaat van het Fonds economische structuurversterking.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel12
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0013891
        artikel: '12'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 9a.2
    text: |-
      Indien in enig begrotingsjaar geen voorstel als bedoeld in het eerste lid wordt ingediend, worden, in afwijking
      van de [artikelen 2][ref1] en [3 van de Wet Fonds economische structuurversterking][ref2], de ontvangsten,
      respectievelijk de uitgaven van het fonds voor dat begrotingsjaar op nihil gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007788#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007788#Artikel3
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0007788
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007788
        artikel: '3'
  - number: 9a.3
    text: Dit artikel vervalt op het moment dat een voorstel als bedoeld in het eerste lid wordt ingediend.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel9a
  - number: '10.1'
    text: |-
      Indien voor een dienstonderdeel van een ministerie een afwijkend beheer wenselijk is, kunnen Onze betrokken
      Minister en Onze Minister van Financiën, in afwijking van [artikel 2, derde lid][ref1], besluiten aan dat
      dienstonderdeel toe te staan onder voorwaarden de begroting en de verantwoording in te richten op basis van een
      stelsel van baten en lasten.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel2
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '10.2'
    text: Een zodanig besluit wordt genomen in overeenstemming met het oordeel van de ministerraad.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel10
  - number: '10.3'
    text: |-
      Een zodanig besluit wordt niet eerder genomen dan 30 dagen nadat het voornemen daartoe schriftelijk ter kennis is
      gebracht van de Tweede Kamer van de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel10
  - number: '10.4'
    text: |-
      Indien binnen deze termijn door of namens de Kamer of door ten minste een vijfde van het grondwettelijk aantal
      leden van de Kamer de wens te kennen wordt gegeven nadere inlichtingen te ontvangen over het voorgenomen besluit,
      wordt het besluit niet eerder genomen dan nadat deze inlichtingen zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel10
  - number: '10.5'
    text: |-
      Indien de Kamer binnen 30 dagen na ontvangst van de kennisgeving of binnen 14 dagen na het verstrekken van de
      bedoelde inlichtingen zich uitspreekt tegen het voorgenomen besluit, wordt het besluit niet genomen.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel10
  - number: '10.6'
    text: |-
      Aan de schriftelijke kennisgeving, bedoeld in het derde lid, kan worden ontleend in hoeverre aan de voorwaarden,
      bedoeld in het eerste lid, is voldaan.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel10
  - number: '10.7'
    text: Onze betrokken Minister doet van een zodanig besluit kopie toekomen aan de Algemene Rekenkamer.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel10
  - number: '11.1'
    text: |-
      De betalingen aan een dienst die een baten-lastenstelsel voert, hierna te noemen: een baten-lastendienst, worden
      door het ministerie waaronder die dienst ressorteert, evenals de betalingen van een baten-lastendienst aan
      dat ministerie, door het ministerie ten laste onderscheidenlijk ten gunste van een of meer begrotingsartikelen
      gebracht.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel11
  - number: '11.2'
    text: |-
      Een begroting bevat, naast de in [artikel 4, eerste lid][ref1], bedoelde begrotingsstaat, voor de baten-
      lastendiensten die onder het betrokken ministerie ressorteren, een aparte staat met een daarbij behorende
      toelichting .


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel4
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '11.3'
    text: 'In de aparte staat wordt voor elke baten-lastendienst opgenomen:'
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel11
  - number: 11.3.a
    text: het totaal van de geraamde baten en van de geraamde lasten;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel11
  - number: 11.3.b
    text: het geraamde saldo van baten en lasten;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel11
  - number: 11.3.c
    text: het totaal van de geraamde kapitaaluitgaven en van de geraamde kapitaalontvangsten.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel11
  - number: '11.4'
    text: |-
      Tot de uitgaven en ontvangsten in een jaar van een baten-lastendienst en van een ministerie worden, behalve
      die bedoeld in [artikel 3, eerste lid][ref1], ook gerekend de verrekeningen tussen de baten-lastendienst en het
      ministerie waaronder die dienst ressorteert.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel3
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '3'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '11.5'
    text: |-
      In afwijking van [artikel 14, tweede lid][ref1], mogen alle wijzigingen in de bedragen, bedoeld in het derde lid
      van dit artikel, worden opgenomen als slotwetwijzigingen.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel14
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '14'
        hoofdstuk: '1'
        paragraaf: '4'
  - number: 11a.1
    text: |-
      Indien voor een dienstonderdeel van een ministerie een afwijkend beheer wenselijk is, kan Onze betrokken
      Minister in overeenstemming met Onze Minister van Financiën besluiten dat dienstonderdeel in te richten als een
      verplichtingen-kasagentschap.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel11a
  - number: 11a.2
    text: |-
      Een verplichtingen-kasagentschap is een dienstonderdeel waarvoor beheersregels gelden die afwijken van zowel de
      regels die gelden voor reguliere dienstonderdelen als van de regels die gelden voor baten-lastendiensten.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel11a
  - number: 11a.3
    text: |-
      Op een besluit als bedoeld in het eerste lid, is [artikel 10, tweede tot en met vijfde en zevende lid][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel10
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '10'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 11a.4
    text: |-
      De [artikelen 11, eerste, tweede, vierde en vijfde lid][ref1], en [52, tweede lid][ref2], zijn op een
      verplichtingen-kasagentschap van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel52
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '11'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013891
        artikel: '52'
        hoofdstuk: V
  - number: 11a.5
    text: |-
      In de aparte staat in de begroting voor de verplichtingen-kasagentschappen wordt voor elk verplichtingen-
      kasagentschap het totaal van de geraamde financiële verplichtingen, het totaal van de geraamde uitgaven en het
      totaal van de geraamde ontvangsten opgenomen.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel11a
  - number: 11a.6
    text: |-
      In de aparte staat in het departementaal jaarverslag voor de verplichtingen-kasagentschappen wordt voor elk
      verplichtingen-kasagentschap het totaal van de gerealiseerde financiële verplichtingen, het totaal van de
      gerealiseerde uitgaven en het totaal van de gerealiseerde ontvangsten opgenomen.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel11a
  - number: 11a.7
    text: |-
      Een verplichtingen-kasagentschap kan met instemming van Onze Minister van Financiën en onder door hem te stellen
      voorwaarden een kasreserve aanhouden.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel11a
  - number: 11a.8
    text: Onze Minister van Financiën stelt nadere regels met betrekking tot verplichtingen-kasagentschappen.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel11a
  - number: '12.1'
    text: |-
      Onze Ministers, ieder met betrekking tot de begrotingen waarvoor hij verantwoordelijk is, zenden jaarlijks aan Onze
      Minister van Financiën uiterlijk op een door hem te bepalen datum de ontwerp-begroting voor het komende jaar.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel12
  - number: '12.2'
    text: 'Onze Minister van Financiën maakt tegen een ontwerp-begroting bezwaar, voor zover:'
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel12
  - number: 12.2.a
    text: |-
      deze hem met het oog op het algemene financiële beleid of het doelmatige beheer van 's Rijks gelden niet
      toelaatbaar voorkomt;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel12
  - number: 12.2.b
    text: |-
      de in een ontwerp-begroting opgenomen bedragen niet in een redelijke verhouding staan tot de doelstellingen van het
      beleid dat aan die begroting ten grondslag ligt.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel12
  - number: '12.3'
    text: |-
      Indien Onze Minister van Financiën tegen een ontwerp-begroting geen bezwaar heeft, dan biedt hij Ons het daarop
      gebaseerde voorstel van wet tot vaststelling van de begroting ter indiening bij de Tweede Kamer aan.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel12
  - number: '12.4'
    text: |-
      Wij zenden de voorstellen van wet op de derde dinsdag van september van het jaar voorafgaande aan het jaar waarop
      deze voorstellen betrekking hebben, gelijktijdig aan de Tweede Kamer.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel12
  - number: '12.5'
    text: |-
      In afwijking van het vierde lid kunnen Wij Onze Minister van Financiën machtigen de voorstellen van wet aan de
      Tweede Kamer aan te bieden.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel12
  - number: 12a.1
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties overlegt jaarlijks vóór de in
      [artikel 12, vierde lid][ref1], genoemde datum met de Kamers der Staten-Generaal over de door de Kamers opgestelde
      ramingen van de uitgaven, de verplichtingen en de ontvangsten die als basis dienen voor de ontwerp-begroting van de
      Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel12
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '12'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 12a.2
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties neemt de ramingen, zoals opgesteld door de Kamers, op
      in het voorstel van wet tot vaststelling van de begroting van de Staten-Generaal, tenzij een evident zwaarwegende
      reden zich hiertegen verzet.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel12a
  - number: 12a.3
    text: |-
      Indien Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties ramingen wegens evident zwaarwegende redenen
      niet of niet geheel opneemt, dan licht hij dit gemotiveerd toe in de memorie van toelichting bij het voorstel van
      wet.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel12a
  - number: '13'
    text: |-
      Onze Minister van Financiën biedt op de in [artikel 12, vierde lid][ref1], genoemde dag aan de Staten-Generaal de
      Miljoenennota aan. Daarin worden in elk geval opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel12
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '12'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 13.a
    text: |-
      beschouwingen over de budgettaire betekenis van het voorgenomen beleid voor het Rijk en voor andere onderdelen van
      de collectieve sector die als budgetdisciplinesector worden aangemerkt;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel13
  - number: 13.b
    text: beschouwingen over de betekenis van het voorgenomen beleid voor de volkshuishouding;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel13
  - number: 13.c
    text: |-
      ramingen voor het begrotingsjaar en de vier op het begrotingsjaar aansluitende jaren, volgens een door hem te
      bepalen mate van samenvoeging;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel13
  - number: 13.d
    text: |-
      het overzicht, bedoeld in [artikel 15, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel15
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '15'
        hoofdstuk: '1'
        paragraaf: '4'
  - number: '14.1'
    text: |-
      Onze Ministers, ieder met betrekking tot de begrotingen waarvoor hij verantwoordelijk is, zenden ontwerp-
      begrotingswijzigingen aan Onze Minister van Financiën. [Artikel 12, tweede, derde en vijfde lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel12
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '12'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: '14.2'
    text: 'Ontwerp-begrotingswijzigingen worden in elk geval ingediend met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel14
  - number: 14.2.a
    text: de wijzigingen, samenhangend met die bedoeld in de Voorjaarsnota en wel gelijktijdig met die nota;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel14
  - number: 14.2.b
    text: |-
      nadere wijzigingen, tenzij boekhoudkundig van aard of voortvloeiend uit controlebevindingen, waaronder in elk geval
      begrepen de wijzigingen samenhangend met die bedoeld in de Miljoenennota en Najaarsnota, en wel gelijktijdig met
      de Najaarsnota;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel14
  - number: 14.2.c
    text: |-
      de slotwetwijzigingen, zijnde per begrotingsartikel de wijziging die leidt tot opheffing van het resterende
      verschil tussen de begrotingsraming, inclusief eerdere wijzigingen daarin aangebracht, en het gerealiseerde bedrag
      en wel uiterlijk op de derde woensdag van mei na afloop van het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel14
  - number: '14.3'
    text: |-
      De toelichting bij een ontwerp-begrotingswijziging, bedoeld in het tweede lid, aanhef en onder a of b, wordt op
      overeenkomstige wijze opgesteld als de toelichting die op grond van de [artikelen 5][ref1] en [6][ref2] is gegeven
      bij de desbetreffende ontwerp-begroting en sluit daarbij aan.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel6
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '5'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0013891
        artikel: '6'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '15.1'
    text: |-
      Onze Minister van Financiën biedt jaarlijks uiterlijk op 1 juni aan de Staten-Generaal de Voorjaarsnota aan,
      waarin een overzicht wordt gegeven van de wijzigingen die noodzakelijk zijn in de ramingen van de uitgaven en de
      ontvangsten van het lopende jaar en de vier daarop volgende jaren, die in de ontwerp-begrotingen zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel15
  - number: '15.2'
    text: |-
      Onze Minister van Financiën biedt jaarlijks op de derde dinsdag van september aan de Staten-Generaal in de
      Miljoenennota een overzicht aan, waarin naast de wijzigingen, bedoeld in het eerste lid, worden opgenomen de
      wijzigingen in de ramingen die nader in het lopende jaar noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel15
  - number: '15.3'
    text: |-
      Onze Minister van Financiën biedt jaarlijks uiterlijk op 1 december aan de Staten-Generaal de Najaarsnota aan,
      waarin in aansluiting op de wijzigingen, bedoeld in het tweede lid, een overzicht wordt gegeven van de wijzigingen
      in de ramingen die nader in het lopende jaar noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel15
  - number: '16.1'
    text: |-
      Voorstellen, andere dan voorstellen van wet tot vaststelling of wijziging van een begrotingsstaat, alsmede
      voornemens en toezeggingen met financiële gevolgen voor het Rijk worden niet aan de ministerraad of aan de Staten-
      Generaal aangeboden, kenbaar gemaakt dan wel gedaan, voordat Onze Minister van Financiën daarover zijn oordeel
      heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel16
  - number: '16.2'
    text: |-
      [Artikel 12, tweede lid][ref1], is ten aanzien van deze voorstellen, voornemens en toezeggingen van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel12
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '12'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: '16.3'
    text: |-
      Het eerste lid is eveneens van toepassing op voorstellen, voornemens en toezeggingen met gevolgen voor de regels
      die bij of krachtens deze wet zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel16
  - number: '17.1'
    text: |-
      Schriftelijke voorstellen, voornemens en toezeggingen als bedoeld in [artikel 16, eerste lid][ref1], bevatten in de
      toelichting daarbij een afzonderlijk onderdeel, waarin wordt ingegaan op:


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel16
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '16'
        hoofdstuk: '1'
        paragraaf: '5'
  - number: 17.1.a
    text: de doelstellingen die worden nagestreefd;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel17
  - number: 17.1.b
    text: de instrumenten die ter bereiking van de doelstellingen worden ingezet;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel17
  - number: 17.1.c
    text: |-
      de financiële gevolgen voor het Rijk en, waar mogelijk, de financiële gevolgen voor andere maatschappelijke
      sectoren.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel17
  - number: '17.2'
    text: |-
      In het afzonderlijk onderdeel van de toelichting wordt tevens aangegeven in hoeverre de financiële gevolgen voor
      het Rijk meerjarig zijn begrepen in de laatste bij de Tweede Kamer ingediende begroting.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel17
  - number: '17.3'
    text: De doelstellingen en de financiële gevolgen worden zoveel mogelijk toegelicht met prestatiegegevens.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel17
  - number: '18.1'
    text: 'Onze Minister van Financiën stelt regels met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel18
  - number: 18.1.a
    text: |-
      de voorbereiding, de wijziging en de inrichting van de begrotingen, alsmede met betrekking tot de wijze waarop de
      begrotingsramingen tot stand komen;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel18
  - number: 18.1.b
    text: |-
      de inrichting van het afzonderlijk onderdeel van de toelichting bij de voorstellen, voornemens en toezeggingen,
      bedoeld in [artikel 17, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel17
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '17'
        hoofdstuk: '1'
        paragraaf: '5'
  - number: '18.2'
    text: |-
      Onze Minister van Financiën bepaalt de criteria die gehanteerd worden voor het instellen van een begrotingsreserve
      als bedoeld in [artikel 5, vierde lid][ref1], en stelt de voorwaarden vast voor de toevoeging en de onttrekking van
      gelden aan de reserve.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel5
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '5'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '18.3'
    text: |-
      Onze Minister van Financiën stelt zo nodig nadere regels met betrekking tot baten-lastendiensten in het algemeen,
      dan wel één of enkele baten-lastendiensten in het bijzonder.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel18
  - number: '18.4'
    text: |-
      Onze Minister van Financiën kan regels stellen met betrekking tot de informatie die in de begroting wordt opgenomen
      over de zelfstandige bestuursorganen als bedoeld in het vijfde lid, en over de rechtspersonen als bedoeld in
      [artikel 91, eerste lid, onder d, van deze wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel91
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '91'
        hoofdstuk: VII
        paragraaf: '3'
  - number: '18.5'
    text: |-
      In het vierde lid wordt verstaan onder zelfstandige bestuursorganen: bestuursorganen van de centrale overheid die
      bij de wet, krachtens de wet bij algemene maatregel van bestuur of krachtens de wet bij ministeriële regeling met
      openbaar gezag zijn bekleed, en die niet hiërarchisch ondergeschikt zijn aan een minister.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel18
  - number: '19.1'
    text: |-
      Onze Ministers, ieder met betrekking tot het ministerie met de leiding waarvan hij is belast, zijn verantwoordelijk
      voor het beheer van de begrotingen van hun ministeries.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel19
  - number: '19.2'
    text: Onze Minister van Financiën is verantwoordelijk voor het beheer van de begroting van nationale schuld.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel19
  - number: '19.3'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties is verantwoordelijk voor het beheer van de begroting
      van koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel19
  - number: '19.4'
    text: |-
      Onze Minister-President, Minister van Algemene Zaken, is verantwoordelijk voor het beheer van de begroting van
      de Koning, van de begroting van het Kabinet van de Koning en van de begroting van de Commissie van toezicht
      betreffende de inlichtingen- en veiligheidsdiensten.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel19
  - number: '19.5'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties is verantwoordelijk voor het beheer van de begroting
      van de Staten-Generaal en van de begroting van de colleges, genoemd in [artikel 1, eerste lid, onder g][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel1
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '19.6'
    text: |-
      De colleges, genoemd in [artikel 1, eerste lid, onder e tot en met h][ref1], voeren het beheer over hun begroting
      of hun begrotingsdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel1
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '19.7'
    text: |-
      Over de aan dit beheer te geven inhoud maakt Onze betrokken Minister afspraken met de onderscheiden colleges,
      waarin recht wordt gedaan aan hun staatsrechtelijke positie.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel19
  - number: '19.8'
    text: |-
      De wet, bedoeld in [artikel 1, eerste lid, onderdeel j][ref1], bepaalt wie van Onze Ministers belast is met het
      beheer van de begroting die met die wet aan de Rijksbegroting wordt toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel1
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '20.1'
    text: |-
      Onze Ministers zijn verantwoordelijk voor de doeltreffendheid en de doelmatigheid van het beleid dat aan hun
      begroting ten grondslag ligt.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel20
  - number: '20.2'
    text: |-
      Onze Ministers zijn tevens verantwoordelijk voor het periodiek onderzoeken van de doeltreffendheid en de
      doelmatigheid van het beleid.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel20
  - number: '20.3'
    text: |-
      Onze Ministers stellen de Algemene Rekenkamer tijdig op de hoogte van de onderzoeken, bedoeld in het tweede lid,
      die zij doen instellen en van de resultaten daarvan.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel20
  - number: '21.1'
    text: Onze Ministers zijn verantwoordelijk voor de doelmatigheid van de bedrijfsvoering van hun ministerie.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel21
  - number: '21.2'
    text: |-
      Tot de bedrijfsvoering worden in ieder geval gerekend het financieel beheer, het materieelbeheer alsmede de
      administraties die ten behoeve van dat beheer worden bijgehouden.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel21
  - number: '21.3'
    text: Onze Ministers zijn tevens verantwoordelijk voor het periodiek onderzoeken van de bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel21
  - number: '21.4'
    text: |-
      Onze Ministers stellen de Algemene Rekenkamer tijdig op de hoogte van de onderzoeken, bedoeld in het derde lid, die
      zij doen instellen en van de resultaten daarvan.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel21
  - number: '21.5'
    text: |-
      Onze Minister-President, Minister van Algemene Zaken, is verantwoordelijk voor de bedrijfsvoering bij het Kabinet
      van de Koning en bij de Commissie van toezicht betreffende de inlichtingen- en veiligheidsdiensten.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel21
  - number: '21.6'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties is verantwoordelijk voor de bedrijfsvoering bij de
      Staten-Generaal en bij de colleges, bedoeld in [artikel 1, eerste lid, onder g][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel1
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '21.7'
    text: |-
      De colleges, genoemd in [artikel 1, eerste lid, onder e tot en met h][ref1], voeren, ieder met betrekking tot hun
      begroting of hun begrotingsdeel, in elk geval het financieel beheer, het materieelbeheer en de administraties ten
      behoeve van dat beheer. Het bepaalde in [artikel 19, zevende lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel19
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0013891
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
  - number: '22.1'
    text: |-
      Het financieel beheer voldoet aan de eisen van rechtmatigheid, ordelijkheid en controleerbaarheid en wordt
      overigens zo doelmatig mogelijk ingericht.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel22
  - number: '22.2'
    text: |-
      Onze Ministers, ieder met betrekking tot de begrotingen waarvoor hij verantwoordelijk is, beschikken met
      inachtneming van [artikel 40, tweede lid][ref1], over de bedragen die voor het aangaan van verplichtingen en voor
      het verrichten van uitgaven in die begrotingen zijn toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel40
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '40'
        hoofdstuk: III
        paragraaf: '1'
  - number: '22.3'
    text: |-
      Over het bedrag toegestaan bij een begrotingsartikel*Nominaal en onvoorzien* kunnen Onze Ministers
      slechts beschikken, voor zover dit bedrag met toepassing van [artikel 14][ref1] aan de ramingen van andere
      begrotingsartikelen is toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel14
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '14'
        hoofdstuk: '1'
        paragraaf: '4'
  - number: '22.4'
    text: Onze Ministers wijzen aan wie namens hen kunnen beschikken over de toegestane bedragen.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel22
  - number: '22.5'
    text: |-
      In afwijking van het vierde lid wijzen de colleges, bedoeld in [artikel 1, eerste lid, onder e tot en met h][ref1],
      ieder met betrekking tot hun begroting of hun begrotingsdeel, aan wie kunnen beschikken over de toegestane
      bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel1
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '22.6'
    text: Onze Ministers doen aan de Algemene Rekenkamer schriftelijk mededeling van een aanwijzing.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel22
  - number: '23.1'
    text: |-
      Wanneer een wet tot vaststelling van een begroting niet vóór 1 januari van het jaar waarop deze betrekking heeft in
      werking is getreden, kan Onze verantwoordelijke Minister in het belang van het Rijk:
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel23
  - number: 23.1.a
    text: |-
      voor het aangaan van verplichtingen beschikken over ten hoogste vier twaalfde gedeelten van de bedragen die bij de
      overeenkomstige begrotingsartikelen van het voorafgaande jaar zijn toegestaan;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel23
  - number: 23.1.b
    text: |-
      voor het verrichten van uitgaven beschikken over de bedragen die in het voorstel van de wet tot vaststelling van
      die begroting daarvoor zijn geraamd.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel23
  - number: '23.2'
    text: |-
      In het belang van het Rijk kan Onze Minister in overeenstemming met Onze Minister van Financiën met betrekking tot
      een of meer begrotingsartikelen van het eerste lid, aanhef en onder a, afwijken.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel23
  - number: '23.3'
    text: |-
      Onze Minister van Financiën doet aan de Staten-Generaal en aan de Algemene Rekenkamer schriftelijk mededeling van
      een toepassing van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel23
  - number: '24.1'
    text: |-
      De aan het Rijk toebehorende en toevertrouwde gelden en geldswaardige papieren worden in 's Rijks schatkist
      gedeponeerd.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel24
  - number: '24.2'
    text: |-
      Onze Minister van Financiën is verantwoordelijk voor het beheer van de centrale kassen van 's Rijks schatkist,
      alsmede voor de coördinatie van en het toezicht op het door de ministeries gevoerde beheer van de departementale
      kassen.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel24
  - number: '24.3'
    text: |-
      Onze Ministers zijn verantwoordelijk voor het beheer van de departementale kassen, ieder voorzover dit
      beheer voortvloeit uit het beheer van de begrotingen en de rekeningen buiten begrotingsverband waarvoor hij
      verantwoordelijk is.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel24
  - number: '24.4'
    text: |-
      In afwijking van het derde lid kan Onze Minister van Financiën bepalen dat bepaalde uitgaven en ontvangsten niet
      ten laste of ten gunste van de departementale kassen plaatsvinden, maar ten laste of ten gunste van de centrale
      kassen worden verricht.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel24
  - number: '24.5'
    text: |-
      Onze Minister van Financiën houdt per begroting één of meer rekeningen-courant aan tussen het Ministerie van
      Financiën en de onderscheiden ministeries.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel24
  - number: '24.6'
    text: |-
      Onze Minister van Financiën kan ten behoeve van een doelmatig en risico-arm kasbeheer aan derden voor zover deze
      collectieve middelen beheren, toestaan deze middelen in rekening-courant aan te houden bij het Ministerie van
      Financiën.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel24
  - number: '24.7'
    text: |-
      Over een debet- en een creditstand van een rekening-courant kan door Onze Minister van Financiën een
      rentevergoeding worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel24
  - number: 24a.1
    text: |-
      Voor de toepassing van dit artikel wordt onder subsidieregeling verstaan een algemene maatregel van
      bestuur of een ministeriële regeling op grond waarvan een subsidie kan worden verstrekt, waarop ingevolge
      [artikel 4:21 van de Algemene wet bestuursrecht titel 4.2 van die wet][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 24a.2
    text: |-
      Een subsidieregeling van het Rijk bevat een tijdstip waarop die regeling vervalt. Dit tijdstip valt niet later dan
      het tijdstip waarop na de inwerkingtreding van die regeling vijf jaren zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel24a
  - number: 24a.3
    text: |-
      Een regeling die strekt tot het verstrekken van subsidie onder in belangrijke mate dezelfde criteria voor in
      belangrijke mate dezelfde activiteiten als een in overeenstemming met het tweede lid vervallen regeling, wordt niet
      eerder vastgesteld dan 30 dagen nadat het ontwerp van die regeling met motieven omkleed aan de Tweede Kamer der
      Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel24a
  - number: 24a.4
    text: |-
      Een regeling die strekt tot wijziging van het tijdstip waarop een subsidieregeling vervalt, wordt niet eerder
      vastgesteld dan 30 dagen nadat het ontwerp van die regeling met motieven omkleed aan de Tweede Kamer der Staten-
      Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel24a
  - number: 24a.5
    text: |-
      In afwijking van het tweede lid, tweede volzin, kan een subsidieregeling een tijdstip bevatten waarop de regeling
      vervalt, dat is gelegen later dan vijf jaren, doch niet later dan tien jaren, na de inwerkingtreding van de
      regeling, indien:
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel24a
  - number: 24a.5.a
    text: |-
      uit de toelichting van de regeling blijkt dat het vervallen van de regeling binnen vijf jaren na inwerkingtreding
      ervan, gelet op de activiteiten waarvoor de subsidie wordt verleend, afbreuk doet aan de effectiviteit van die
      activiteiten, en
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel24a
  - number: 24a.5.b
    text: |-
      door Onze betrokken Minister gedurende de looptijd van de regeling een verslag over de doeltreffendheid en de
      doelmatigheid van de subsidie aan de Tweede Kamer der Staten-Generaal wordt gezonden.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel24a
  - number: 24a.6
    text: |-
      Indien binnen de in het vijfde lid genoemde termijn van 30 dagen door of namens de Tweede Kamer der Staten-Generaal
      of door ten minste een vijfde van het grondwettelijk aantal leden van de Tweede Kamer de wens te kennen wordt
      gegeven nadere inlichtingen te ontvangen over het ontwerp van de regeling, zal deze niet worden vastgesteld dan
      nadat deze inlichtingen zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel24a
  - number: 24a.7
    text: |-
      Subsidieregelingen die eindigen op of na 1 juli 2014 en subsidieregelingen die geen einddatum kennen bij
      inwerkingtreding van dit artikel worden voorzien van een vervaldatum die niet later ligt dan 1 juli 2017, tenzij
      het ontwerp van een subsidieregeling daartoe met overeenkomstige toepassing van het vijfde lid met een langere
      geldingsduur aan de Tweede Kamer is overgelegd.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel24a
  - number: '25.1'
    text: |-
      Het materieelbeheer voldoet aan de eisen van rechtmatigheid, ordelijkheid en controleerbaarheid en wordt overigens
      zo doelmatig mogelijk ingericht.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel25
  - number: '25.2'
    text: |-
      De verantwoordelijkheid voor het materieelbeheer omvat voor ieder van Onze Ministers zowel het materieel dat aan
      zijn ministerie toebehoort als het materieel dat aan zijn ministerie is toevertrouwd.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel25
  - number: '25.3'
    text: |-
      De verantwoordelijkheid voor het materieelbeheer strekt zich voor ieder van Onze Ministers slechts uit tot het
      beheer dat niet bij of krachtens de wet aan een of meer van Onze andere Ministers is opgedragen.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel25
  - number: '25.4'
    text: Onze Minister van Financiën is verantwoordelijk voor het beheer van de overtollige roerende zaken bij het Rijk.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel25
  - number: '25.5'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties is verantwoordelijk voor het beheer van de overtollige
      onroerende zaken bij het Rijk.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel25
  - number: '26.1'
    text: |-
      De bij te houden administraties waarvoor Onze Ministers verantwoordelijk zijn, bieden inzicht in het gevoerde
      beheer, voldoen aan de eisen van rechtmatigheid, ordelijkheid en controleerbaarheid en worden overigens zo
      doelmatig mogelijk ingericht.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel26
  - number: '26.2'
    text: |-
      Onze Minister van Financiën is verantwoordelijk voor de centrale administratie van 's Rijks schatkist. Het eerste
      lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel26
  - number: '27.1'
    text: |-
      Onze Ministers, ieder met betrekking tot de begrotingen waarvoor hij verantwoordelijk is, dragen aan de centrale
      directie financieel-economische zaken van hun ministerie de zorg op voor de begrotingszaken en de daarmee
      samenhangende administraties.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel27
  - number: '27.2'
    text: |-
      De zorg voor de begrotingszaken omvat mede het beoordelen van de aan Onze betrokken Minister voor te leggen
      voorstellen betreffende de begrotingen alsmede het uitoefenen van toezicht op de uitvoering van de begrotingen.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel27
  - number: '27.3'
    text: |-
      In overeenstemming met Onze Minister van Financiën kan op een andere wijze in de zorg voor de begrotingszaken en de
      daarmee samenhangende administraties worden voorzien.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel27
  - number: '27.4'
    text: |-
      In overeenstemming met Onze Minister van Financiën wijzen Onze Ministers het hoofd aan van de centrale directie,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel27
  - number: '27.5'
    text: 'Onze Ministers doen schriftelijk mededeling aan de Algemene Rekenkamer van:'
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel27
  - number: 27.5.a
    text: een toepassing van het derde lid;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel27
  - number: 27.5.b
    text: een aanwijzing, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel27
  - number: '28.1'
    text: |-
      Elke verplichting en uitgaaf enerzijds en elke ontvangst anderzijds wordt op een begrotingsartikel onder de
      verplichtingen en de uitgaven, onderscheidenlijk de ontvangsten geboekt.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel28
  - number: '28.2'
    text: |-
      Onze Minister van Financiën kan categorieën verplichtingen, uitgaven en ontvangsten aanwijzen, die op een rekening
      buiten het begrotingsverband kunnen worden geboekt, indien deze met een ander onderdeel van het Rijk dan wel met
      een derde worden verrekend.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel28
  - number: '28.3'
    text: |-
      Verplichtingen, uitgaven en ontvangsten geboekt op rekeningen buiten het begrotingsverband worden, indien
      verrekening achterwege blijft, geboekt ten laste dan wel ten gunste van begrotingsartikelen van het jaar, waarin
      blijkt dat geen verrekening zal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel28
  - number: '28.4'
    text: 'In afwijking van het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel28
  - number: 28.4.a
    text: |-
      kunnen terugbetalingen aan het Rijk op eerder in hetzelfde jaar gedane uitgaven in mindering worden geboekt van
      die uitgaven;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel28
  - number: 28.4.b
    text: kunnen terugbetalingen door het Rijk van ontvangsten in mindering worden geboekt van de ontvangsten;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel28
  - number: 28.4.c
    text: |-
      kan, in geval een geldlening geheel of gedeeltelijk wordt aangegaan ter conversie van uitstaande schuld, het bedrag
      van de afgeloste schuld in vergelijking worden gebracht met de opbrengst van de nieuwe geldlening; een daarbij
      blijkend verschil wordt alsdan ten gunste of ten laste van de begroting geboekt.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel28
  - number: '28.5'
    text: |-
      De boeking van de verplichtingen en de uitgaven geschiedt ten lastevan een begrotingsartikel in elk geval zodanig,
      dat aan de bijgehouden administraties onder meer kunnen worden ontleend:
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel28
  - number: 28.5.a
    text: het deel van de raming van de aan te gane verplichtingen dat daadwerkelijk is aangegaan;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel28
  - number: 28.5.b
    text: het deel van de raming van de uitgaven dat daadwerkelijk tot uitgaven heeft geleid;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel28
  - number: 28.5.c
    text: per individueel aangegane verplichting het deel dat nog niet tot uitgaven heeft geleid;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel28
  - number: 28.5.d
    text: het deel van de raming van de uitgaven waarvoor nog geen verplichtingen zijn aangegaan.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel28
  - number: '28.6'
    text: |-
      Onze Minister van Financiën doet aan de Algemene Rekenkamer schriftelijk mededeling van de aangewezen categorieën,
      bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel28
  - number: '29.1'
    text: |-
      Ter bepaling van het jaar ten laste of ten gunste waarvan een verplichting of een uitgaaf, onderscheidenlijk een
      ontvangst moet worden geboekt, is [artikel 3, eerste tot en met derde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel3
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '3'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '29.2'
    text: |-
      In een jaar aangegane verplichtingen, die eerst na het sluiten van de boeken van dat jaar blijken, worden geboekt
      op het overeenkomstige begrotingsartikel in het dan lopende jaar.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel29
  - number: '30.1'
    text: |-
      Onze Minister van Financiën kan categorieën niet-geldelijke betalingen en ontvangsten aanwijzen die als geldelijke
      betalingen onderscheidenlijk ontvangsten worden geboekt.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel30
  - number: '30.2'
    text: Onze Minister van Financiën doet aan de Algemene Rekenkamer schriftelijk mededeling van de aangewezen categorieën.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel30
  - number: '31.1'
    text: |-
      Verrekeningen tussen onderdelen van het Rijk, waarvan de begrotingsartikelen niet tot eenzelfde begroting behoren,
      worden geboekt als geldelijke betalingen en ontvangsten.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel31
  - number: '31.2'
    text: |-
      Het eerste lid kan tevens worden toegepast bij verrekeningen tussen dienstonderdelen waarvan de begrotingsartikelen
      tot eenzelfde begroting behoren, indien het aantoonbaar administratief doelmatig is deze verrekeningen als
      geldelijke betalingen en ontvangsten te boeken.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel31
  - number: '32.1'
    text: |-
      Onze Ministers, ieder met betrekking tot de begrotingen waarvoor hij verantwoordelijk is, verrichten namens de
      Staat de privaatrechtelijke rechtshandelingen die uit het te voeren beheer voortvloeien, tenzij bij of krachtens de
      wet is bepaald dat een van Onze andere Ministers de rechtshandeling verricht.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel32
  - number: '32.2'
    text: |-
      Onze Minister van Financiën is verantwoordelijk voor het privaatrechtelijk beheer van de roerende zaken die aan
      de Staat toebehoren dan wel zijn toevertrouwd en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties is
      verantwoordelijk voor het privaatrechtelijk beheer van de onroerende zaken die aan de Staat toebehoren dan wel
      zijn toevertrouwd, een en ander voor zover voor dat beheer niet bij of krachtens de wet een of meer van Onze andere
      Ministers verantwoordelijk zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel32
  - number: '32.3'
    text: |-
      In afwijking van het eerste lid kunnen de privaatrechtelijke rechtshandelingen, voor zover die voortvloeien uit
      het beheer van de begroting van de colleges, genoemd in [artikel 1, eerste lid, onder e tot en met h][ref1],
      worden verricht door de colleges en wel ieder met betrekking tot hun begroting of hun begrotingsdeel, tenzij bij of
      krachtens de wet is bepaald dat een andere Minister dan Onze betrokken Minister de rechtshandeling verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel1
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '32.4'
    text: |-
      Privaatrechtelijke rechtshandelingen kunnen namens Onze Ministers dan wel namens de colleges, bedoeld in het derde
      lid, worden verricht, indien zij daartoe een algemene of bijzondere volmacht hebben verleend.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel32
  - number: '33'
    text: Onze Minister van Financiën sluit overeenkomsten tot het aangaan van geldleningen door de Staat.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel33
  - number: '34.1'
    text: |-
      Het oprichten of mede-oprichten, dan wel het doen oprichten van een privaatrechtelijke rechtspersoon door de
      Staat zal niet eerder plaatsvinden dan 30 dagen, nadat van het voornemen daartoe door Onze betrokken Minister, in
      overeenstemming met het oordeel van de ministerraad, schriftelijk mededeling is gedaan aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel34
  - number: '34.2'
    text: |-
      Het oordeel van de ministerraad wordt door Onze betrokken Minister niet gevraagd, dan nadat hij met de Algemene
      Rekenkamer overleg heeft gevoerd over de voorgenomen rechtshandeling.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel34
  - number: '34.3'
    text: |-
      Indien binnen de in het eerste lid genoemde termijn door of namens een der Kamers van de Staten-Generaal of door
      ten minste een vijfde van het grondwettelijk aantal leden van een der Kamers de wens te kennen wordt gegeven nadere
      inlichtingen te ontvangen over de voorgenomen rechtshandeling, zal deze niet eerder plaatsvinden dan nadat deze
      inlichtingen zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel34
  - number: '34.4'
    text: |-
      Indien een van beide Kamers binnen 30 dagen na de schriftelijke mededeling of binnen 14 dagen na het verstrekken
      van de bedoelde inlichtingen, als haar oordeel uitspreekt dat de voorgenomen rechtshandeling een voorafgaande
      machtiging bij de wet behoeft, zal de rechtshandeling eerst plaatsvinden nadat die machtiging is verleend.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel34
  - number: 34a
    text: |-
      De procedure, bedoeld in [artikel 34, eerste, derde en vierde lid][ref1], is tevens van toepassing op een voornemen
      tot het verrichten van de volgende privaatrechtelijke rechtshandelingen door de Staat:


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel34
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '34'
        hoofdstuk: II
        paragraaf: '5'
  - number: 34a.a
    text: |-
      het verstrekken aan een privaatrechtelijke rechtspersoon van eigen vermogen, van leningen met wezenlijke kenmerken
      van eigen vermogen of van garanties ten aanzien van de omvang van het eigen vermogen;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel34a
  - number: 34a.b
    text: |-
      het overnemen van schuldtitels of aandelen van een privaatrechtelijke rechtspersoon die door een derde partij
      worden gehouden;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel34a
  - number: 34a.c
    text: |-
      het overnemen van risico’s van financiële activa van een privaatrechtelijke rechtspersoon, indien dat overnemen
      bedoeld is ter versterking van de solvabiliteit van de privaatrechtelijke rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel34a
  - number: 34b.1
    text: |-
      De procedure, bedoeld in [artikel 34, eerste, derde en vierde lid][ref1], is niet van toepassing op een
      voornemen tot het verrichten van een privaatrechtelijke rechtshandeling, bedoeld in artikel 34, eerste lid, en in
      [artikel 34a, aanhef en onder a tot en met c][ref2], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel34a
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel34b
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '34'
        hoofdstuk: II
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0013891
        artikel: 34a
        hoofdstuk: II
        paragraaf: '5'
  - number: 34b.1.a
    text: een wettelijke regeling voorziet in een rechtsgrond specifiek voor het verrichten van die rechtshandeling;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel34b
  - number: 34b.1.b
    text: |-
      het verstrekken van eigen vermogen voortvloeit uit een eerder verstrekte garantie als bedoeld in
      [artikel 34a, aanhef en onder a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel34a
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel34b
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: 34a
        hoofdstuk: II
        paragraaf: '5'
  - number: 34b.1.c
    text: |-
      een rechtshandeling niet ten doel heeft het relatieve belang van de Staat in het eigen vermogen van de betrokken
      rechtspersoon te verhogen;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel34b
  - number: 34b.1.d
    text: |-
      het volgen van de procedure, bedoeld in [artikel 34, eerste, derde en vierde lid][ref1], strijdig is met een
      wettelijke regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel34
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel34b
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '34'
        hoofdstuk: II
        paragraaf: '5'
  - number: 34b.1.e
    text: |-
      met de rechtshandeling een geringer financieel belang is gemoeid dan een door Onze Minister van Financiën vast te
      stellen bedrag, dat voor de verschillende categorieën rechtshandelingen verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel34b
  - number: 34b.2
    text: |-
      Over een voorstel van een wettelijke regeling als bedoeld in het eerste lid, aanhef en onder a, wordt, indien dat
      voorstel betrekking heeft op rechtshandelingen, bedoeld in [artikel 34, eerste lid][ref1], vóór de indiening van
      het voorstel bij de Tweede Kamer met de Algemene Rekenkamer overleg gevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel34
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel34b
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '34'
        hoofdstuk: II
        paragraaf: '5'
  - number: 34c.1
    text: |-
      Onze Minister van Financiën informeert de Staten-Generaal jaarlijks over het te voeren en gevoerde beleid met
      betrekking tot:
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel34c
  - number: 34c.1.a
    text: |-
      het verwerven, het bezit en het vervreemden van vermogen in privaatrechtelijke rechtspersonen, indien aan dat
      vermogen wezenlijke kenmerken van eigen vermogen zijn verbonden;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel34c
  - number: 34c.1.b
    text: |-
      het overnemen, het beheer en het afstoten van risico’s van financiële activa, bedoeld in
      [artikel 34a, onder c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel34a
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel34c
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: 34a
        hoofdstuk: II
        paragraaf: '5'
  - number: 34c.2
    text: |-
      De verstrekte informatie bevat met betrekking tot het vervreemden van vermogen, bedoeld in het eerste lid, onder
      a, en het overdragen van risico’s, bedoeld in het eerste lid, onder b, in elk geval de daarbij te hanteren of
      gehanteerde uitgangspunten.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel34c
  - number: '35'
    text: |-
      Het verrichten namens de Staat van een privaatrechtelijke rechtshandeling met een geldelijk belang geschiedt op een
      wijze die:
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel35
  - number: 35.a
    text: voor de Staat voldoende duidelijk de plichten en rechten van de betrokken partijen bewijsbaar vastlegt;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel35
  - number: 35.b
    text: controleerbaar is;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel35
  - number: 35.c
    text: in het maatschappelijk verkeer wordt geaccepteerd.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel35
  - number: '36'
    text: |-
      De geldigheid van privaatrechtelijke rechtshandelingen wordt niet aangetast indien de bij of krachtens deze wet
      gestelde regels niet worden nageleefd, tenzij het betreft het niet naleven van de regels omtrent de bevoegdheid van
      de handelende personen, gesteld bij of krachtens de [artikelen 32][ref1] en [33][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel33
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '32'
        hoofdstuk: II
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0013891
        artikel: '33'
        hoofdstuk: II
        paragraaf: '5'
  - number: '37'
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel37
  - number: 37.a
    text: de taak van de centrale directies financieel-economische zaken;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel37
  - number: 37.b
    text: het kasbeheer;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel37
  - number: 37.c
    text: |-
      het verrichten van privaatrechtelijke rechtshandelingen en kan worden voorgeschreven dat bepaalde
      privaatrechtelijke rechtshandelingen worden verricht in afwijking van de [artikelen 32][ref1] en [33][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel33
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '32'
        hoofdstuk: II
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0013891
        artikel: '33'
        hoofdstuk: II
        paragraaf: '5'
  - number: '38.1'
    text: |-
      Onze Minister van Financiën stelt regels met betrekking tot het financieel beheer, het materieelbeheer en de
      administraties die ten behoeve van dat beheer worden bijgehouden. Voor zover de regels inzake het materieelbeheer
      betrekking hebben op onroerend materieel worden die regels gesteld door Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel38
  - number: '38.2'
    text: 'Onze Minister van Financiën kan regels stellen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel38
  - number: 38.2.a
    text: |-
      de taken en bevoegdheden die behoren bij de verantwoordelijkheden, bedoeld in de [artikelen 20][ref1] en
      [21][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel21
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '20'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013891
        artikel: '21'
        hoofdstuk: II
        paragraaf: '3'
  - number: 38.2.b
    text: |-
      de bevoegdheid, bedoeld in [artikel 22, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel22
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '22'
        hoofdstuk: II
        paragraaf: '3.1'
  - number: '39.1'
    text: Onze Minister van Financiën is belast met het toezicht op de uitvoering van de begrotingen.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel39
  - number: '39.2'
    text: |-
      Dit toezicht omvat mede de toetsing aan de aspecten, bedoeld in [artikel 12, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel12
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '12'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: '40.1'
    text: |-
      Onze Minister van Financiën bepaalt welke gegevens hem ten behoeve van het toezicht, bedoeld in [artikel 39][ref1],
      worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel39
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '39'
        hoofdstuk: III
        paragraaf: '1'
  - number: '40.2'
    text: |-
      In het kader van het toezicht, bedoeld in [artikel 39][ref1], kan Onze Minister van Financiën begrotingsartikelen
      aanwijzen ten laste waarvan geen verplichtingen mogen worden aangegaan, voordat hij daarmee heeft ingestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel39
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '39'
        hoofdstuk: III
        paragraaf: '1'
  - number: '41.1'
    text: |-
      Onze Minister van Financiën is verantwoordelijk voor het toezicht op de inrichting van de administraties, bedoeld
      in [artikel 21, tweede lid][ref1], en voor het toezicht op de wijze waarop deze worden bijgehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel21
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '21'
        hoofdstuk: II
        paragraaf: '3'
  - number: '41.2'
    text: |-
      Onze Minister van Financiën is verantwoordelijk voor het toezicht op de inrichting van de controle die plaatsvindt
      in het kader van de uitvoering van de begrotingen.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel41
  - number: '42.1'
    text: |-
      Onze Ministers verstrekken de inlichtingen die Onze Minister van Financiën voor de uitoefening van het toezicht,
      bedoeld in de [artikelen 39][ref1] en [41][ref2], nodig heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel41
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '39'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0013891
        artikel: '41'
        hoofdstuk: III
        paragraaf: '1'
  - number: '42.2'
    text: |-
      Onze Ministers verlenen Onze Minister van Financiën te allen tijde toegang tot dan wel inzage in alle goederen,
      administraties, documenten en andere informatiedragers.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel42
  - number: '42.3'
    text: |-
      Onze Minister van Financiën wijst de ambtenaren aan die namens hem zijn belast met de uitoefening van de
      bevoegdheden, bedoeld in dit artikel.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel42
  - number: '43.1'
    text: |-
      Onverminderd het anders bij wet bepaalde, hebben Onze Ministers de in de volgende leden vermelde bevoegdheden ten
      aanzien van:
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel43
  - number: 43.1.a
    text: |-
      rechtspersonen, commanditaire vennootschappen, vennootschappen onder firma en natuurlijke personen die een beroep
      of bedrijf uitoefenen aan wie door de Staat of een derde voor rekening of risico van de Staat rechtstreeks of
      middellijk een subsidie, een lening of garantie wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel43
  - number: 43.1.b
    text: |-
      rechtspersonen, commanditaire vennootschappen, vennootschappen onder firma en natuurlijke personen die een beroep
      of bedrijf uitoefenen aan wie door de Raad van de Europese Unie, het Europees Parlement en de Raad gezamenlijk
      of de Europese Commissie op grond van een vastgesteld programma rechtstreeks of middellijk een subsidie wordt
      verstrekt;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel43
  - number: 43.1.c
    text: |-
      rechtspersonen voor zover die een bij of krachtens de wet geregelde taak uitoefenen en daartoe geheel of
      gedeeltelijk worden bekostigd uit de opbrengst van bij of krachtens de wet ingestelde heffingen.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel43
  - number: '43.2'
    text: |-
      Van de in het eerste lid bedoelde rechtspersonen, vennootschappen en natuurlijke personen kunnen Onze Ministers
      kennis nemen van:
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel43
  - number: 43.2.a
    text: jaarrekeningen, jaarverslagen en de aan de jaarrekeningen en jaarverslagen toegevoegde overige gegevens;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel43
  - number: 43.2.b
    text: |-
      verantwoordingen, gegevens en documenten die nodig zijn voor de definitieve vaststelling van de subsidie, lening
      of garantie;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel43
  - number: 43.2.c
    text: verslagen van onderzoeken van accountants die de bescheiden, bedoeld onder a en b, hebben gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel43
  - number: '43.3'
    text: |-
      Indien de bescheiden, bedoeld in het tweede lid, Onze Ministers daartoe aanleiding geven, of een of meer bescheiden
      ontbreken, zijn Onze Ministers bevoegd bij de betrokken rechtspersoon, vennootschap en natuurlijke persoon daarover
      nadere inlichtingen in te winnen dan wel inzage in ontbrekende bescheiden, documenten en andere informatiedragers
      te vorderen, alsmede, mede aan de hand van de administratie van de betrokken rechtspersoon, vennootschap of
      natuurlijke persoon dan wel bij de derde die de administratie in opdracht van de rechtspersoon, vennootschap of
      natuurlijke persoon voert, een onderzoek in te stellen. [Artikel 87, eerste lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel87
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '87'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '43.4'
    text: |-
      De [artikelen 5:12][ref1], [5:13][ref2], [5:15][ref3] en
      [5:17, tweede en derde lid, van de Algemene wet bestuursrecht][ref4] zijn van overeenkomstige toepassing ten
      aanzien van het gebruik van de bevoegdheden bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 43a.1
    text: |-
      Onze Ministers zijn bevoegd inzage te vorderen in de controledossiers van de accountant die de bescheiden, bedoeld
      in [artikel 43, tweede lid, onder a en b][ref1], heeft gecontroleerd om te bepalen of bij de vaststelling van de
      nakoming van de in [artikel 43b, derde lid][ref2], bedoelde verplichtingen kan worden gesteund op de door deze
      accountant uitgevoerde controle.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel43b
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '43'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013891
        artikel: 43b
        hoofdstuk: III
        paragraaf: '2'
  - number: 43a.2
    text: |-
      Met betrekking tot het verlenen van inzage in het controledossier kan de accountant zich niet beroepen op de
      omstandigheid dat hij op grond van andere bij of krachtens de wet opgelegde verplichtingen tot geheimhouding is
      verplicht van in dit dossier opgenomen vertrouwelijke gegevens.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel43a
  - number: 43a.3
    text: Onze Ministers zijn bevoegd van stukken uit de controledossiers, bedoeld in het eerste lid, kopieën te maken.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel43a
  - number: 43a.4
    text: |-
      De [artikelen 5:12][ref1], [5:13][ref2], [5:15][ref3] en [5:17, derde lid, van de Algemene wet bestuursrecht][ref4]
      zijn van overeenkomstige toepassing ten aanzien van het gebruik van de bevoegdheden bedoeld in het eerste en derde
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 43a.5
    text: |-
      De accountant, die op grond van [artikel 43a, eerste lid][ref1], [artikel 91, zesde lid][ref2], of
      [artikel 92, vierde lid][ref3], inzage in het controledossier verleent en kopieën van stukken uit dit dossier
      verstrekt, is niet aansprakelijk voor schade die een derde dientengevolge lijdt, tenzij aannemelijk wordt gemaakt
      dat hij gelet op alle feiten en omstandigheden in redelijkheid niet hiertoe had mogen overgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel43a
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel91
      [ref3]: https://wetten.overheid.nl/BWBR0013891#Artikel92
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: 43a
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013891
        artikel: '91'
        hoofdstuk: VII
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0013891
        artikel: '92'
        hoofdstuk: VII
        paragraaf: '3'
  - number: 43b.1
    text: |-
      Onze Ministers wijzen de personen aan die namens hen zijn belast met de uitoefening van de bevoegdheden, bedoeld in
      de [artikelen 43][ref1] en [43a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel43a
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel43b
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '43'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013891
        artikel: 43a
        hoofdstuk: III
        paragraaf: '2'
  - number: 43b.2
    text: |-
      De bevoegdheden als bedoeld in [artikel 43a][ref1] worden uitgeoefend onder
      verantwoordelijkheid van een registeraccountant of een accountant-administratieconsulent
      ten aanzien van wie in het accountantsregister een aantekening is geplaatst als bedoeld in
      [artikel 36, tweede lid, onderdeel i, van de Wet op het accountantsberoep][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel43a
      [ref2]: https://wetten.overheid.nl/BWBR0032573#Artikel36
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel43b
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: 43a
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0032573
        artikel: '36'
  - number: 43b.3
    text: |-
      De toepassing van de in de [artikelen 43][ref1] en [43a][ref2] bedoelde bevoegdheden is gericht op de nakoming door
      de in artikel 43, eerste lid, bedoelde rechtspersonen, vennootschappen en natuurlijke personen van:


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel43a
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel43b
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '43'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013891
        artikel: 43a
        hoofdstuk: III
        paragraaf: '2'
  - number: 43b.3.a
    text: |-
      bij of krachtens de wet opgelegde verplichtingen aangaande beheer, controle of toezicht ten
      aanzien van de rechtmatige en doelmatige besteding van collectieve middelen als bedoeld in
      [artikel 43, eerste lid, onder a en c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel43
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel43b
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '43'
        hoofdstuk: III
        paragraaf: '2'
  - number: 43b.3.b
    text: |-
      bij of krachtens het Verdrag betreffende de werking van de Europese Unie aan de lidstaat opgelegde verplichtingen
      aangaande beheer, controle of toezicht ten aanzien van de rechtmatige en doelmatige besteding van collectieve
      middelen als bedoeld in [artikel 43, het eerste lid, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel43
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel43b
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '43'
        hoofdstuk: III
        paragraaf: '2'
  - number: 43b.4
    text: |-
      Onze Ministers kunnen de in de [artikelen 43][ref1] en [43a][ref2] bedoelde bevoegdheden uitoefenen zolang als en
      over de jaren dat de Staat daarbij belang heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel43a
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel43b
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '43'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013891
        artikel: 43a
        hoofdstuk: III
        paragraaf: '2'
  - number: '44.1'
    text: |-
      Ter bewaking van de ontwikkeling van het EMU-saldo kan Onze Minister van Financiën regels stellen ten aanzien van
      de verstrekking van gegevens door de rechtspersonen die op basis van het geldende Europees Stelsel van Rekeningen
      (PbEG L310) tot de sector overheid worden gerekend.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel44
  - number: '44.2'
    text: |-
      Indien een dreigende overschrijding van de geldende norm voor het EMU-saldo van de overheid wordt veroorzaakt
      door een ongewenste ontwikkeling van het EMU-saldo van de rechtspersonen, bedoeld in het eerste lid, kunnen
      bij of krachtens algemene maatregel van bestuur regels worden gesteld ter beheersing van het EMU-saldo van die
      rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel44
  - number: '44.3'
    text: |-
      Een krachtens het tweede lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan acht
      weken na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel44
  - number: '44.4'
    text: |-
      Tot de rechtspersonen, bedoeld in het eerste lid, worden voor de toepassing van het bepaalde in het tweede lid, niet
      gerekend de openbare lichamen, bedoeld in [artikel 1, onder a, van de Wet financiering decentrale overheden][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011987#Artikel1
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0011987
        artikel: '1'
  - number: 44a
    text: |-
      Zelfstandige bestuursorganen als bedoeld in [artikel 18, vijfde lid][ref1], en rechtspersonen als bedoeld in
      [artikel 91, eerste lid, onder d, van deze wet][ref2] verschaffen aan Onze Minister periodiek informatie over de
      door hen te leveren en geleverde prestaties.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel91
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '18'
        hoofdstuk: '1'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0013891
        artikel: '91'
        hoofdstuk: VII
        paragraaf: '3'
  - number: '45.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden de rechtspersonen, bedoeld in
      [artikel 91, eerste lid, onder d][ref1], aangewezen die ten behoeve van een doelmatig en risico-arm kasbeheer hun
      liquide middelen rentedragend aanhouden in 's Rijks schatkist.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel91
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '91'
        hoofdstuk: VII
        paragraaf: '3'
  - number: '45.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden de rechtspersonen, bedoeld in
      [artikel 91, eerste lid, onder d][ref1], aangewezen die ten behoeve van een risico-arm kasbeheer hun liquide
      middelen uitzetten in de vorm van producten die voldoen aan door Onze Minister van Financiën te stellen eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel91
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '91'
        hoofdstuk: VII
        paragraaf: '3'
  - number: '45.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen andere rechtspersonen met een publieke taak worden aangewezen waarop het
      eerste of het tweede lid van toepassing is.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel45
  - number: '45.4'
    text: |-
      Het eerste tot en met derde lid is niet van toepassing ten aanzien van de liquide middelen die niet als collectieve
      middelen kunnen worden aangemerkt, indien die liquide middelen op een adequate wijze separaat in de jaarrekening
      van de betrokken rechtspersoon worden verantwoord.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel45
  - number: '45.5'
    text: |-
      Op verzoek van een rechtspersoon die is aangewezen overeenkomstig het eerste of het derde lid kan Onze Minister
      van Financiën, indien de rechtspersoon de noodzaak van de uitzondering voor de dagelijkse bedrijfsvoering voldoende
      aannemelijk maakt en naar het oordeel van Onze Minister van Financiën geen afbreuk wordt gedaan aan een doelmatig
      en risico-arm kasbeheer, besluiten dat bepaalde liquide middelen zijn uitgezonderd van de verplichting om deze
      rentedragend aan te houden in ’s Rijks schatkist.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel45
  - number: '45.6'
    text: |-
      De voordracht voor een krachtens het eerste, tweede en derde lid vast te stellen algemene maatregel van bestuur
      wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel45
  - number: '45.7'
    text: |-
      De [artikelen 45 tot en met 49a][ref1] zijn niet van toepassing op de rechtspersonen, bedoeld in het
      [zeventiende lid van artikel 91][ref2] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel91
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '45'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0013891
        artikel: '91'
        hoofdstuk: VII
        paragraaf: '3'
  - number: '46'
    text: |-
      Het aantrekken van financiële middelen door de rechtspersonen, bedoeld in artikel 45, met als doel daarmee via het
      uitzetten ervan additionele financiële middelen te verwerven, is verboden.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel46
  - number: '47.1'
    text: |-
      Onze betrokken Minister is belast met het toezicht op [artikel 45, tweede en vierde lid][ref1], en op
      [artikel 46][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel46
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '45'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0013891
        artikel: '46'
        hoofdstuk: IV
  - number: '47.2'
    text: |-
      Een rechtspersoon verstrekt desgevraagd aan Onze Minister alle voor dit toezicht benodigde inlichtingen. Onze
      Minister kan inzage vorderen in alle zakelijke gegevens en bescheiden, indien dat voor het toezicht redelijkerwijs
      nodig is.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel47
  - number: '47.3'
    text: |-
      Onze Minister kan een rechtspersoon die zich niet houdt aan [artikel 45, tweede of vierde lid][ref1], of
      [artikel 46][ref2], de aanwijzing geven hieraan alsnog te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel46
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '45'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0013891
        artikel: '46'
        hoofdstuk: IV
  - number: '48.1'
    text: |-
      Onverminderd het bij of krachtens andere wetten bepaalde kunnen de rechtspersonen, bedoeld in
      [artikel 45, eerste lid][ref1], met de instemming van Onze betrokken Minister, ten behoeve van de financiering van
      investeringen, leningen bij Onze Minister van Financiën verkrijgen, indien de investeringen benodigd zijn voor de
      uitvoering van de bij of krachtens de wet geregelde taken van de rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel45
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '45'
        hoofdstuk: IV
  - number: '48.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de rechtspersonen, bedoeld in [artikel 45, derde lid][ref1],
      indien op die rechtspersonen het [eerste lid van artikel 45][ref2] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel45
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '45'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0013891
        artikel: '45'
        hoofdstuk: IV
  - number: '48.3'
    text: |-
      Indien in enig jaar een rechtspersoon waaraan door Onze Minister van Financiën een lening is verstrekt, in gebreke
      blijft de daaruit voortvloeiende verplichtingen aan rente en aflossing na te komen, kan Onze Minister van Financiën
      het bedrag van de niet-nagekomen verplichtingen ten laste van de begroting van Onze betrokken Minister overboeken
      naar de begroting van Nationale Schuld.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel48
  - number: '49.1'
    text: |-
      Onverminderd het bij of krachtens andere wetten bepaalde kan Onze Minister van Financiën, in overeenstemming met
      Onze betrokken Minister, aan de rechtspersonen, bedoeld in [artikel 45, eerste lid][ref1], ter overbrugging van
      tijdelijke liquiditeitstekorten een rekening-courantkrediet verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel45
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '45'
        hoofdstuk: IV
  - number: '49.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de rechtspersonen, bedoeld in [artikel 45, derde lid][ref1],
      indien op die rechtspersonen het [eerste lid van artikel 45][ref2] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel45
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '45'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0013891
        artikel: '45'
        hoofdstuk: IV
  - number: '49.3'
    text: |-
      Indien in enig jaar een rechtspersoon waaraan door Onze Minister van Financiën een rekening-courantkrediet is
      verstrekt, in gebreke blijft de daaruit voortvloeiende verplichtingen aan rente en aflossing na te komen, kan
      Onze Minister van Financiën het bedrag van de niet-nagekomen verplichtingen ten laste van de begroting van Onze
      betrokken Minister overboeken naar de begroting van Nationale Schuld.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel49
  - number: 49a
    text: |-
      Onze Minister van Financiën kan nadere regels stellen met betrekking tot het bepaalde in de
      [artikelen 45 tot en met 49][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel45
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel49a
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '45'
        hoofdstuk: IV
  - number: '51.1'
    text: |-
      Onze Ministers leggen na afloop van een begrotingsjaar verantwoording af over het gevoerde beleid en de
      bedrijfsvoering aan de hand van:
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel51
  - number: 51.1.a
    text: |-
      de departementale jaarverslagen, zijnde de jaarverslagen die in aansluiting op de begrotingen, bedoeld in
      [artikel 1, eerste lid, onder a][ref1], worden opgemaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel1
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 51.1.b
    text: |-
      de niet-departementale jaarverslagen, zijnde de jaarverslagen die in aansluiting op de begrotingen, bedoeld in
      [artikel 1, eerste lid, onder b tot en met i][ref1], worden opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel1
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '51.2'
    text: |-
      Onze Ministers, ieder met betrekking tot de begrotingen waarvoor hij verantwoordelijk is, maken daartoe over elk
      jaar een jaarverslag op. Onze Ministers maken tevens over elk jaar de departementale saldibalans op.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel51
  - number: '52.1'
    text: |-
      Een jaarverslag als bedoeld in [artikel 51][ref1] bestaat uit een verantwoordingsstaat met een daarbij behorende
      toelichting.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel51
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '51'
        hoofdstuk: V
  - number: '52.2'
    text: |-
      Een departementaal jaarverslag bevat, naast de in het eerste lid bedoelde verantwoordingsstaat, voor de baten-
      lastendiensten die onder het betrokken ministerie ressorteren, een aparte staat met een daarbij behorende
      toelichting.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel52
  - number: '52.3'
    text: 'In de aparte staat wordt voor elke baten-lastendienst opgenomen:'
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel52
  - number: 52.3.a
    text: het totaal van de gerealiseerde baten en van de gerealiseerde lasten;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel52
  - number: 52.3.b
    text: het gerealiseerde saldo van baten en lasten;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel52
  - number: 52.3.c
    text: het totaal van de gerealiseerde kapitaaluitgaven en van de gerealiseerde kapitaalontvangsten.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel52
  - number: '53.1'
    text: |-
      De verantwoordingsstaat bevat, in de volgorde van de begrotingsartikelen van de overeenkomstige begrotingsstaat,
      per begrotingsartikel in elk geval de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel53
  - number: 53.1.a
    text: het artikelnummer;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel53
  - number: 53.1.b
    text: de artikelomschrijving;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel53
  - number: 53.1.c
    text: |-
      bruto het bedrag dat voor het aangaan van verplichtingen in de begrotingsstaat behorende bij de oorspronkelijke
      begrotingswet is opgenomen met daarnaast gesteld het overeenkomstige gerealiseerde bedrag;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel53
  - number: 53.1.d
    text: |-
      bruto het bedrag dat voor het verrichten van uitgaven in de begrotingsstaat behorende bij de oorspronkelijke
      begrotingswet is opgenomen met daarnaast gesteld het overeenkomstige gerealiseerde bedrag;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel53
  - number: 53.1.e
    text: |-
      bruto het bedrag dat aan ontvangsten in de begrotingsstaat behorende bij de oorspronkelijke begrotingswet is
      opgenomen met daarnaast gesteld het overeenkomstige gerealiseerde bedrag.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel53
  - number: '53.2'
    text: |-
      Het eerste lid, aanhef en onder d en e, is niet van toepassing op de uitgaven en de ontvangsten die op grond van
      [artikel 28, vierde lid][ref1], in mindering zijn gebracht op ontvangsten, onderscheidenlijk uitgaven.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel28
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '28'
        hoofdstuk: II
        paragraaf: '4'
  - number: '54.1'
    text: |-
      De toelichting bij de verantwoordingsstaat biedt in algemene zin of per begrotingsartikel inzicht in de relevante
      met de beleids- en bedrijfsvoering samenhangende aspecten, waaraan in de toelichting bij de begrotingsstaat,
      bedoeld in [artikel 5, eerste lid][ref1], aandacht is geschonken.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel5
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '5'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '54.2'
    text: |-
      Het meerjarige inzicht dient, uitgaande van jaar t als verslagjaar, betrekking te hebben op de jaren t-4 tot en
      met jaar t, dat wil zeggen op de periode lopende van vier jaar voorafgaand aan het verslagjaar tot en met het
      verslagjaar.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel54
  - number: '54.4'
    text: |-
      Indien met toepassing van [artikel 5, vierde lid][ref1], een begroting een begrotingsartikel bevat ten laste
      waarvan een meerjarige begrotingsreserve wordt aangehouden, biedt het jaarverslag voor dat begrotingsartikel
      inzicht in de gerealiseerde omvang van de reserve, alsmede in de toevoeging en of de onttrekking aan de reserve in
      het verslagjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel5
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '5'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '54.5'
    text: |-
      Indien een specifieke uitkering als bedoeld in [artikel 15a, eerste lid, van de Financiële-verhoudingswet][ref1]
      of een bijzondere uitkering als bedoeld in artikel 91, eerste lid, van de Wet financiën openbare lichamen Bonaire,
      Sint Eustatius en Saba wordt gevormd door bijdragen uit verschillende begrotingen als bedoeld in [artikel 1][ref2],
      dan wordt de informatie, bedoeld in het eerste tot en met het derde lid, opgenomen in de toelichting bij het
      betrokken beleidsartikel in het jaarverslag van Onze Minister die als eerste verantwoordelijk is voor die
      uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel15a
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel1
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 15a
      - id: ref2
        bwb_id: BWBR0013891
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '54.6'
    text: |-
      Onze Minister van Financiën kan nadere regels stellen met betrekking tot de informatie die Onze overige
      verantwoordelijke Minister(s) in hun jaarverslag opnemen.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel54
  - number: '55.1'
    text: |-
      Indien voor een specifieke uitkering als bedoeld in
      [artikel 15a, eerste en derde lid, van de Financiële-verhoudingswet][ref1] of een bijzondere uitkering als bedoeld
      in artikel 91, eerste lid, van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba geen jaarlijkse
      verantwoording verplicht is gesteld aan de ontvanger van de uitkering, volstaat Onze Minister wie het aangaat met
      het opnemen in het jaarverslag, bedoeld in [artikel 51][ref2], van die verantwoordingsinformatie, die volgens het
      wettelijk voorschrift aan Onze Minister moet worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel15a
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel51
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 15a
      - id: ref2
        bwb_id: BWBR0013891
        artikel: '51'
        hoofdstuk: V
  - number: '55.2'
    text: Onze Minister van Financiën kan nadere regels stellen met betrekking tot de verantwoordingsinformatie.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel55
  - number: '56.1'
    text: |-
      Een departementaal jaarverslag bevat in de toelichting bij de verantwoordingsstaat informatie over de
      bedrijfsvoering in het verslagjaar van het betrokken ministerie.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel56
  - number: '56.2'
    text: |-
      Het eerste lid is op de niet-departementale jaarverslagen zoveel mogelijk overeenkomstig van toepassing. Voor zover
      het eerste lid niet wordt toegepast, geschiedt dat in overeenstemming met Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel56
  - number: '57'
    text: |-
      Onze Minister, belast met het beheer van een begrotingsfonds, kan besluiten het jaarverslag van het begrotingsfonds
      op te nemen in een bijlage bij het departementale jaarverslag waarvoor hij verantwoordelijk is.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel57
  - number: '58.1'
    text: 'Een jaarverslag voldoet overigens aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel58
  - number: 58.1.a
    text: de erin opgenomen financiële informatie is deugdelijk weergegeven en rechtmatig tot stand gekomen;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel58
  - number: 58.1.b
    text: |-
      de erin opgenomen informatie over het gevoerde beleid en de bedrijfsvoering is op een deugdelijke wijze tot stand
      gekomen;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel58
  - number: 58.1.c
    text: |-
      de erin opgenomen informatie over het gevoerde beleid en de bedrijfsvoering voldoet aan daaraan te stellen
      kwaliteitsnormen.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel58
  - number: '58.2'
    text: |-
      Tot de financiële informatie wordt gerekend informatie over verplichtingen, uitgaven, ontvangsten, baten, lasten,
      kapitaaluitgaven, kapitaalontvangsten en balansposten, zoals deze uit de administratie blijken, en de toelichtingen
      daarbij.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel58
  - number: '58.3'
    text: |-
      De financiële informatie wordt op een duidelijk van de niet-financiële informatie te onderscheiden wijze in het
      jaarverslag gepresenteerd.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel58
  - number: '59'
    text: 'Een departementale saldibalans voldoet aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel59
  - number: 59.a
    text: |-
      de erin opgenomen informatie geeft de op het jaareinde openstaande posten, zoals deze uit de administraties
      blijken, deugdelijk weer;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel59
  - number: 59.b
    text: de erin opgenomen balansposten zijn rechtmatig tot stand gekomen.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel59
  - number: '60.1'
    text: |-
      Onze Ministers zenden het jaarverslag en de departementale saldibalans waarvoor zij verantwoordelijk zijn, te
      zamen met de ontwerp-slotwet en het samenvattende rapport, bedoeld in [artikel 66, vijfde lid][ref1], aan Onze
      Minister van Financiën uiterlijk op een door hem te bepalen datum in de maand maart van het jaar volgend op het
      begrotingsjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel66
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '66'
        hoofdstuk: VI
  - number: '60.2'
    text: |-
      Onze Minister van Financiën zendt deze stukken zo mogelijk binnen 14 dagen na ontvangst naar de Algemene
      Rekenkamer, voorzien van de opmerkingen waartoe deze stukken hem aanleiding geven. Zijn opmerkingen stuurt Onze
      Minister van Financiën tevens aan Onze betrokken Ministers.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel60
  - number: '60.3'
    text: |-
      Onze Ministers zenden binnen 14 dagen na de datum, bedoeld in het eerste lid, aan de Algemene Rekenkamer en aan
      Onze Minister van Financiën een overzicht, waarin per begrotingsartikel de controlebevindingen van de auditdienst
      van het Rijk zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel60
  - number: '61.1'
    text: |-
      Onze Minister van Financiën maakt over elk jaar het Financieel jaarverslag van het Rijk en de Saldibalans van het
      Rijk op.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel61
  - number: '61.2'
    text: 'Het Financieel jaarverslag van het Rijk bevat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel61
  - number: 61.2.a
    text: |-
      beschouwingen over de budgettaire betekenis van het gevoerde beleid voor het Rijk en voor andere onderdelen van de
      collectieve sector die als budgetdisciplinesector worden aangemerkt;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel61
  - number: 61.2.b
    text: een beschouwing over de bedrijfsvoering van het Rijk;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel61
  - number: 61.2.c
    text: de rekening van uitgaven en ontvangsten van het Rijk, voorzien van een toelichting.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel61
  - number: '61.3'
    text: |-
      De in het Financieel jaarverslag van het Rijk opgenomen rekening van uitgaven en ontvangsten sluit aan op in de
      departementale en niet-departementale jaarverslagen opgenomen verantwoordingsstaten.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel61
  - number: '61.4'
    text: De Saldibalans van het Rijk sluit aan op de departementale saldibalansen.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel61
  - number: '62'
    text: |-
      Onze Minister van Financiën zendt uiterlijk op 21 april van het jaar volgend op het verslagjaar het Financieel
      jaarverslag van het Rijk, de Saldibalans van het Rijk en het rapport, bedoeld in [artikel 67, derde lid][ref1], aan
      de Algemene Rekenkamer.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel67
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '67'
        hoofdstuk: VI
  - number: '63.1'
    text: |-
      Ter verlening van decharge door beide Kamers der Staten-Generaal aan Onze betrokken Ministers over het gevoerde
      financiële beheer in een verslagjaar, zendt Onze Minister van Financiën op de derde woensdag van mei van het
      jaar volgend op het verslagjaar de door de Algemene Rekenkamer onderzochte departementale en niet-departementale
      jaarverslagen, alsmede het door de Algemene Rekenkamer onderzochte Financieel jaarverslag van het Rijk aan de
      Tweede Kamer. Het Financieel jaarverslag van het Rijk wordt tevens aan de Eerste Kamer gezonden.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel63
  - number: '63.2'
    text: |-
      Indien de derde woensdag van mei valt in een periode waarin de Tweede Kamer der Staten-Generaal in verband met de
      verkiezing van de leden van die Kamer niet in vergadering bijeenkomt, wordt als datum van inzending van de in het
      eerste lid bedoelde bescheiden aangehouden de tweede woensdag na de eerste samenkomst van de nieuw gekozen Tweede
      Kamer.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel63
  - number: '63.3'
    text: |-
      Gelijktijdig met deze stukken zendt Onze Minister van Financiën in voorkomende gevallen aan de Tweede Kamer een
      overzicht van de jaarverslagen, van de slotwetsvoorstellen en van de voorstellen van een indemniteitswet die niet
      uiterlijk op de woensdag, bedoeld in het eerste dan wel het tweede lid, aan de Tweede Kamer worden gezonden, met de
      reden daarvan.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel63
  - number: '63.4'
    text: |-
      In voorkomende gevallen zendt Onze betrokken Minister, in een aanvulling op het betrokken jaarverslag, zijn
      standpunt inzake het in [artikel 89, derde lid][ref1], bedoelde bezwaar van de Algemene Rekenkamer zo spoedig
      mogelijk, doch in elk geval vóór de behandeling van het jaarverslag door de Tweede Kamer, aan de Tweede Kamer.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel89
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '89'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '64.1'
    text: |-
      Decharge aan Onze Ministers wordt verleend aan de hand van de betrokken jaarverslagen door daartoe strekkende
      uitspraken van elk van de beide Kamers der Staten-Generaal. Decharge wordt niet eerder verleend dan nadat de
      verklaring van goedkeuring van de Algemene Rekenkamer, bedoeld in [artikel 83, derde lid][ref1], is ontvangen en
      het betrokken slotwetsvoorstel, en in voorkomende gevallen een voorstel van een indemniteitswet, is aangenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel83
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '83'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '64.2'
    text: |-
      Nadat de Tweede Kamer Onze betrokken Minister decharge heeft verleend, plaatst de voorzitter van die Kamer op
      het betrokken jaarverslag een aantekening, waaruit de verlening van de decharge en de datum waarop die heeft
      plaatsgevonden, blijken. Het jaarverslag wordt daarop ter behandeling doorgezonden aan de voorzitter van de Eerste
      Kamer.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel64
  - number: '64.3'
    text: |-
      Nadat de Eerste Kamer Onze betrokken Minister decharge heeft verleend, plaatst de voorzitter van die Kamer
      op het betrokken jaarverslag een aantekening, waaruit de verlening van decharge en de datum waarop die heeft
      plaatsgevonden, blijken. Het jaarverslag wordt vervolgens door de voorzitter van de Eerste Kamer aan Onze Minister
      van Financiën gezonden.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel64
  - number: '64.4'
    text: |-
      Onze Minister van Financiën doet aan Onze Ministers en aan de Algemene Rekenkamer mededeling van de
      dechargeverleningen die hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel64
  - number: '65.1'
    text: |-
      Onze Minister van Financiën kan regels stellen met betrekking tot de totstandkoming en de inrichting van de
      jaarverslagen en de departementale saldibalansen.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel65
  - number: '65.2'
    text: |-
      Onze Minister van Financiën kan regels stellen met betrekking tot de informatie die in de jaarverslagen
      wordt opgenomen over de zelfstandige bestuursorganen, bedoeld in [artikel 18, vijfde lid][ref1], en over de
      rechtspersonen als bedoeld in [artikel 91, eerste lid, onder d, van deze wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel91
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '18'
        hoofdstuk: '1'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0013891
        artikel: '91'
        hoofdstuk: VII
        paragraaf: '3'
  - number: '66.1'
    text: |-
      Onze Ministers, ieder met betrekking tot de begrotingen waarvoor hij verantwoordelijk is, dragen aan de auditdienst
      van het Rijk de controle op van:
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel66
  - number: 66.1.a
    text: het gevoerde financieel en materieelbeheer;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel66
  - number: 66.1.b
    text: de ten behoeve van dat beheer bijgehouden administraties;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel66
  - number: 66.1.c
    text: |-
      de financiële informatie in de jaarverslagen, bedoeld in [artikel 51][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel51
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '51'
        hoofdstuk: V
  - number: 66.1.d
    text: de departementale saldibalansen;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel66
  - number: 66.1.e
    text: de totstandkoming van de informatie over het gevoerde beleid en de bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel66
  - number: '66.2'
    text: |-
      De auditdienst van het Rijk onderzoekt of het financieel beheer, het materieelbeheer en de ten behoeve van dat
      beheer bijgehouden administraties voldoen aan de eisen van rechtmatigheid, ordelijkheid, controleerbaarheid en
      doelmatigheid, gesteld in [artikel 22, eerste lid][ref1], respectievelijk [artikel 25, eerste lid][ref2], en
      [artikel 26, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0013891#Artikel26
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '22'
        hoofdstuk: II
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0013891
        artikel: '25'
        hoofdstuk: II
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0013891
        artikel: '26'
        hoofdstuk: II
        paragraaf: '3.3'
  - number: '66.3'
    text: 'Van een jaarverslag onderzoekt de auditdienst van het Rijk:'
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel66
  - number: 66.3.a
    text: of dit overeenkomstig de verslaggevingsvoorschriften inzake de financiële informatie is opgesteld;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel66
  - number: 66.3.b
    text: |-
      of voldaan is aan de in [artikel 58, eerste lid, onder a en b][ref1], gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel58
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '58'
        hoofdstuk: V
  - number: '66.4'
    text: 'Van een departementale saldibalans onderzoekt de auditdienst van het Rijk:'
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel66
  - number: 66.4.a
    text: of deze overeenkomstig de verslaggevingsvoorschriften is opgesteld;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel66
  - number: 66.4.b
    text: |-
      of voldaan is aan de in [artikel 59][ref1] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel59
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '59'
        hoofdstuk: V
  - number: '66.5'
    text: |-
      De resultaten van de controle worden jaarlijks vastgelegd in rapporten die zijn gericht aan Onze betrokken
      Minister. Het samenvattende rapport bevat, behalve de belangrijkste bevindingen van de controle, een
      controleverklaring.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel66
  - number: '66.6'
    text: 'De in het vijfde lid bedoelde controleverklaring heeft betrekking op:'
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel66
  - number: 66.6.a
    text: de deugdelijke weergave van de in het jaarverslag en de saldibalans opgenomen financiële informatie;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel66
  - number: 66.6.b
    text: |-
      de deugdelijke weergave van de in de bedrijfsvoeringsparagraaf van het jaarverslag opgenomen informatie over de
      naleving van de eis van rechtmatigheid;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel66
  - number: 66.6.c
    text: de naleving van de verslaggevingsvoorschriften inzake de onder a en b bedoelde informatie;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel66
  - number: 66.6.d
    text: de niet-strijdigheid van de in het jaarverslag opgenomen niet-financiële informatie met de financiële informatie.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel66
  - number: '67.1'
    text: 'Onze Minister van Financiën draagt aan de auditdienst van het Rijk het onderzoek op van:'
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel67
  - number: 67.1.a
    text: de centrale administratie van 's Rijks schatkist;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel67
  - number: 67.1.b
    text: het Financieel jaarverslag van het Rijk;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel67
  - number: 67.1.c
    text: de Saldibalans van het Rijk.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel67
  - number: '67.2'
    text: 'De auditdienst van het Rijk onderzoekt:'
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel67
  - number: 67.2.a
    text: |-
      of de centrale administratie aansluit op de administraties, bedoeld in [artikel 21, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel21
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '21'
        hoofdstuk: II
        paragraaf: '3'
  - number: 67.2.b
    text: |-
      of de centrale administratie voldoet aan de eisen, gesteld in [artikel 26, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel26
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '26'
        hoofdstuk: II
        paragraaf: '3.3'
  - number: 67.2.c
    text: |-
      of de in het Financieel jaarverslag van het Rijk opgenomen rekening van uitgaven en ontvangsten aansluit op de
      verantwoordingsstaten die zijn opgenomen in de jaarverslagen, bedoeld in [artikel 51][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel51
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '51'
        hoofdstuk: V
  - number: 67.2.d
    text: of het Financieel jaarverslag en de Saldibalans van het Rijk overeenkomstig de voorschriften zijn opgesteld;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel67
  - number: 67.2.e
    text: of de Saldibalans van het Rijk aansluit op de departementale saldibalansen.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel67
  - number: '67.3'
    text: |-
      De resultaten van deze onderzoeken worden jaarlijks vastgelegd in een rapport dat is gericht aan Onze Minister
      van Financiën. Het rapport bevat naast de belangrijkste bevindingen van de onderzoeken een mededeling omtrent de
      verantwoording van de centrale administratie van 's Rijks schatkist, omtrent het Financieel jaarverslag van het
      Rijk en omtrent de Saldibalans van het Rijk.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel67
  - number: '68.1'
    text: Onze Minister van Financiën benoemt na overleg met Onze andere Ministers het hoofd van de auditdienst van het Rijk.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel68
  - number: '68.2'
    text: Onze Minister van Financiën doet schriftelijk mededeling aan de Algemene Rekenkamer van een benoeming.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel68
  - number: '69.1'
    text: |-
      Onze Minister van Financiën stelt regels met betrekking tot de controle, bedoeld in
      [artikel 66, eerste tot en met vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel66
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '66'
        hoofdstuk: VI
  - number: '69.2'
    text: |-
      Onze Minister van Financiën kan regels stellen met betrekking tot de controleverklaring omtrent het jaarverslag en
      de saldibalans.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel69
  - number: '70.1'
    text: |-
      De Algemene Rekenkamer bestaat uit drie leden in gewone dienst die te zamen het college vormen, alsmede uit ten
      hoogste drie leden in buitengewone dienst. De president wordt uit de leden in gewone dienst bij koninklijk besluit,
      op voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, benoemd.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel70
  - number: '70.2'
    text: |-
      Van een vacature onder de leden geeft de Algemene Rekenkamer zo spoedig mogelijk kennis aan Ons en aan de Tweede
      Kamer.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel70
  - number: '70.3'
    text: |-
      Met de kennisgeving aan de Tweede Kamer wordt meegezonden een door de leden van het college van de Algemene
      Rekenkamer met meerderheid van stemmen opgemaakte aanbevelingslijst van zes kandidaten, waarop de Tweede Kamer bij
      haar voordracht zodanig acht zal slaan als haar dienstig voorkomt.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel70
  - number: '71.1'
    text: |-
      De leden in buitengewone dienst kunnen door de president worden opgeroepen om deel te nemen aan bepaalde
      werkzaamheden en hebben alsdan ter zake dezelfde bevoegdheden als de leden in gewone dienst; zij maken dan tevens
      deel uit van het college.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel71
  - number: '71.2'
    text: |-
      De leden in buitengewone dienst vervangen bovendien de leden in gewone dienst bij voorziene afwezigheid of
      ontstentenis.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel71
  - number: '72'
    text: |-
      Aan de Algemene Rekenkamer wordt toegevoegd een secretaris die op voordracht van de Algemene Rekenkamer bij
      koninklijk besluit wordt benoemd en ontslagen. Schorsing geschiedt door de Algemene Rekenkamer.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel72
  - number: '73.1'
    text: Om tot lid te kunnen worden benoemd, moet men Nederlander zijn.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel73
  - number: '73.2'
    text: |-
      De leden en de secretaris mogen geen andere openbare betrekkingen vervullen, aan welke een vaste beloning of
      toelage is verbonden, noch lid zijn van een publiekrechtelijk college, waarvoor de keuze geschiedt bij of krachtens
      wettelijk voorschrift uitgeschreven verkiezingen. Behoudens indien de onverenigbaarheid ook uit een ander wettelijk
      voorschrift voortvloeit kan hiervan bij koninklijk besluit, de Algemene Rekenkamer gehoord, ontheffing worden
      verleend.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel73
  - number: '73.3'
    text: |-
      De leden en de secretaris vervullen overigens geen betrekkingen die ongewenst zijn met het oog op een goede
      vervulling van hun ambt of handhaving van hun onpartijdigheid en onafhankelijkheid of van het vertrouwen daarin.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel73
  - number: '73.4'
    text: De betrekkingen die de leden en de secretaris buiten hun ambt vervullen, worden door de president openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel73
  - number: '74.1'
    text: |-
      Een lid wordt ontslag verleend op eigen verzoek en bij het bereiken van de leeftijd van zeventig jaar. Het ontslag
      gaat in op de eerste dag van de volgende maand.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel74
  - number: '74.2'
    text: |-
      De leden kunnen door de Hoge Raad der Nederlanden worden ontslagen of geschorst.
      [Hoofdstuk 6A van de Wet rechtspositie rechterlijke ambtenaren][ref1], met uitzondering van
      de [artikelen 46b][ref2], [46c, eerste lid, onder b, tweede en derde lid][ref3], [46d][ref4],
      [46i, eerste lid, onder c][ref5], [46k][ref6] en [46q][ref7], is daarbij van overeenkomstige toepassing, met dien
      verstande dat: - de disciplinaire maatregel van schriftelijke waarschuwing wordt opgelegd door de president van de
      Algemene Rekenkamer;
        - in [artikel 46e][ref8] voor «de rechterlijk ambtenaar, tevens zijnde president van het gerechtshof of de
      rechtbank, de president van de Hoge Raad onderscheidenlijk procureur-generaal bij de Hoge Raad» wordt gelezen« de
      president van de Algemene Rekenkamer»;
        - de president van de Algemene Rekenkamer als functionele autoriteit wordt aangemerkt;
        - voor «Onze Minister» wordt gelezen «Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties»;
        - de voordracht, bedoeld in de [artikelen 46i, vijfde lid][ref9], en [46l, tweede lid][ref10], wordt gedaan door de
      Algemene Rekenkamer;
        - in [artikel 46p, vijfde lid][ref11], in plaats van «het betrokken gerecht onderscheidenlijk het parket bij de
      Hoge Raad» wordt gelezen «de Algemene Rekenkamer».


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Hoofdstuk6A
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46b
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel46c
      [ref4]: https://wetten.overheid.nl/BWBR0008365#Artikel46d
      [ref5]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
      [ref6]: https://wetten.overheid.nl/BWBR0008365#Artikel46k
      [ref7]: https://wetten.overheid.nl/BWBR0008365#Artikel46q
      [ref8]: https://wetten.overheid.nl/BWBR0008365#Artikel46e
      [ref9]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
      [ref10]: https://wetten.overheid.nl/BWBR0008365#Artikel46l
      [ref11]: https://wetten.overheid.nl/BWBR0008365#Artikel46p
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0008365
        hoofdstuk: 6A
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46b
      - id: ref3
        bwb_id: BWBR0008365
        artikel: 46c
      - id: ref4
        bwb_id: BWBR0008365
        artikel: 46d
      - id: ref5
        bwb_id: BWBR0008365
        artikel: 46i
      - id: ref6
        bwb_id: BWBR0008365
        artikel: 46k
      - id: ref7
        bwb_id: BWBR0008365
        artikel: 46q
      - id: ref8
        bwb_id: BWBR0008365
        artikel: 46e
      - id: ref9
        bwb_id: BWBR0008365
        artikel: 46i
      - id: ref10
        bwb_id: BWBR0008365
        artikel: 46l
      - id: ref11
        bwb_id: BWBR0008365
        artikel: 46p
  - number: '74.3'
    text: |-
      Grond voor ontslag is voorts dat het lid handelt in strijd met [artikel 73, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel73
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '73'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '74.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot wachtgeld en
      voorzieningen in verband met ziekte en arbeidsongeschiktheid.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel74
  - number: '75.1'
    text: |-
      De president, de overige leden in gewone dienst, de leden in buitengewone dienst en de secretaris leggen, alvorens
      hun ambt te aanvaarden, in Onze handen de volgende eed (verklaring en belofte) af. «Ik zweer (verklaar) dat ik,
      tot het verkrijgen van mijn aanstelling, middellijk noch onmiddellijk, onder welke naam of welk voorwendsel ook,
      aan iemand iets heb gegeven of beloofd. Ik zweer (verklaar en beloof) dat ik om iets in dit ambt te doen of te
      laten, van niemand enig geschenk of enige belofte heb aangenomen of zal aannemen, middellijk of onmiddellijk. Ik
      zweer (beloof) trouw aan de Koning, dat ik de Grondwet steeds zal helpen onderhouden en mijn ambt met eerlijkheid,
      nauwgezetheid en onpartijdigheid zal vervullen. Zo waarlijk helpe mij God almachtig! (Dat verklaar en beloof ik!)».
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel75
  - number: '75.2'
    text: |-
      Daartoe door Ons gemachtigd kan ook de president in een vergadering van het college deze eed of de verklaring en
      belofte afnemen van de overige leden in gewone dienst, de leden in buitengewone dienst en de secretaris.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel75
  - number: '76'
    text: |-
      De Algemene Rekenkamer stelt voor haar werkzaamheden een reglement van orde vast. Dit reglement wordt door
      plaatsing in de Staatscourant bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel76
  - number: '77.1'
    text: |-
      De president oefent het toezicht uit op de werkzaamheden van de Algemene Rekenkamer en op de juiste toepassing van
      het bij of krachtens dit hoofdstuk bepaalde.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel77
  - number: '77.2'
    text: |-
      De president brengt alle stukken, welke aan de Algemene Rekenkamer of aan hem in zijn hoedanigheid worden
      toegezonden, voor zover zij niet bij het reglement van orde zijn uitgezonderd, ter behandeling in de vergadering
      van het college.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel77
  - number: '77.3'
    text: |-
      De taken en bevoegdheden van de president worden bij diens afwezigheid of ontstentenis waargenomen door het
      aanwezige lid in gewone dienst, dat het oudste is naar rang van benoeming.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel77
  - number: '78'
    text: |-
      Geen besluiten zullen in de vergadering van het college kunnen worden genomen, indien niet ten minste de
      meerderheid der leden van het college tegenwoordig is. Besluiten worden genomen bij meerderheid van stemmen;
      wanneer de stemmen staken, beslist de stem van de president.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel78
  - number: '79.1'
    text: |-
      De leden en de secretaris mogen niet aanwezig zijn bij de beraadslagingen en het nemen van beslissingen over
      enige zaak, die hen, hun echtgenoten, hun geregistreerde partners, degenen met wie zij duurzaam samenleven of hun
      naastbestaanden tot in de derde graad van bloedverwantschap of aanverwantschap betreffen.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel79
  - number: '79.2'
    text: |-
      Zij mogen niet deelnemen aan het onderzoek van en de beslissing over rekeningen en verantwoordingen die door hen
      worden afgelegd.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel79
  - number: '80.1'
    text: |-
      Het bij of krachtens de Ambtenarenwet bepaalde ten aanzien van de aanstelling en het ontslag van ambtenaren van
      het Rijk is van overeenkomstige toepassing op de ambtenaren van de Algemene Rekenkamer, met dien verstande dat
      voorzover de aanstelling of het ontslag geschiedt bij koninklijk besluit, de Algemene Rekenkamer daartoe een
      voordracht doet en in de overige gevallen de Algemene Rekenkamer haar ambtenaren aanstelt of ontslaat. Schorsing
      geschiedt door de Algemene Rekenkamer.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel80
  - number: '80.2'
    text: De Algemene Rekenkamer kan het aanstellen, schorsen en ontslaan van ambtenaren opdragen aan de secretaris.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel80
  - number: '81.1'
    text: |-
      De Algemene Rekenkamer stelt instructies vast voor de secretaris en voor de overige ambtenaren en voor het
      personeel dat bij de Algemene Rekenkamer in dienst is op grond van een arbeidsovereenkomst naar burgerlijk recht.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel81
  - number: '81.2'
    text: |-
      Van de ambtenaren wordt door de president hetzij de eed, hetzij de verklaring en belofte afgenomen. Ook voor het
      personeel bedoeld in het vorige lid kan de Algemene Rekenkamer voorschrijven dat daarvan hetzij de eed, hetzij de
      verklaring en belofte wordt afgenomen.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel81
  - number: '82.1'
    text: 'De Algemene Rekenkamer onderzoekt jaarlijks:'
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel82
  - number: 82.1.a
    text: het gevoerde financieel en materieelbeheer;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel82
  - number: 82.1.b
    text: de ten behoeve van dat beheer bijgehouden administraties;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel82
  - number: 82.1.c
    text: |-
      de financiële informatie in de jaarverslagen, bedoeld in [artikel 51][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel51
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '51'
        hoofdstuk: V
  - number: 82.1.d
    text: de departementale saldibalansen;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel82
  - number: 82.1.e
    text: de totstandkoming van de informatie over het gevoerde beleid en de bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel82
  - number: '82.2'
    text: |-
      De Algemene Rekenkamer onderzoekt of het financieel beheer, het materieelbeheer en de ten behoeve van dat beheer
      bijgehouden administraties voldoen aan de eisen van rechtmatigheid, ordelijkheid en controleerbaarheid, gesteld in
      [artikel 22, eerste lid][ref1], respectievelijk [artikel 25, eerste lid][ref2], en [artikel 26, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0013891#Artikel26
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '22'
        hoofdstuk: II
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0013891
        artikel: '25'
        hoofdstuk: II
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0013891
        artikel: '26'
        hoofdstuk: II
        paragraaf: '3.3'
  - number: '82.3'
    text: 'Van een jaarverslag onderzoekt de Algemene Rekenkamer:'
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel82
  - number: 82.3.a
    text: of dit overeenkomstig de verslaggevingsvoorschriften inzake de financiële informatie is opgesteld;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel82
  - number: 82.3.b
    text: |-
      of voldaan is aan de in [artikel 58, eerste lid][ref1], gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel58
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '58'
        hoofdstuk: V
  - number: '82.4'
    text: 'Van een departementale saldibalans onderzoekt de Algemene Rekenkamer:'
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel82
  - number: 82.4.a
    text: of deze overeenkomstig de verslaggevingsvoorschriften is opgesteld;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel82
  - number: 82.4.b
    text: |-
      of voldaan is aan de in [artikel 59][ref1] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel59
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '59'
        hoofdstuk: V
  - number: '82.5'
    text: De Algemene Rekenkamer legt haar bevindingen en haar oordeel jaarlijks vast in rapporten.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel82
  - number: '83.1'
    text: 'De Algemene Rekenkamer onderzoekt jaarlijks:'
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel83
  - number: 83.1.a
    text: de centrale administratie van 's Rijks schatkist;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel83
  - number: 83.1.b
    text: het Financieel jaarverslag van het Rijk;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel83
  - number: 83.1.c
    text: de Saldibalans van het Rijk;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel83
  - number: '83.2'
    text: De Algemene Rekenkamer legt haar bevindingen en haar oordeel jaarlijks vast in een rapport.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel83
  - number: '83.3'
    text: |-
      Met betrekking tot de in het Financieel jaarverslag van het Rijk opgenomen rekening van uitgaven en ontvangsten
      van het Rijk alsmede met betrekking tot de Saldibalans van het Rijk stelt de Algemene Rekenkamer een verklaring van
      goedkeuring op.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel83
  - number: '83.4'
    text: |-
      De verklaring van goedkeuring wordt gegeven onder voorbehoud van de vaststelling van de slotwetten en in
      voorkomende gevallen onder voorbehoud van de vaststelling van een indemniteitswet.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel83
  - number: '84.1'
    text: |-
      De Algemene Rekenkamer zendt haar rapporten en haar verklaring van goedkeuring met betrekking tot het afgelopen
      verslagjaar op de derde woensdag van mei aan Ons en aan de Staten-Generaal. Het [tweede lid van artikel 63][ref1]
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel63
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '63'
        hoofdstuk: V
  - number: '84.2'
    text: |-
      Indien de Algemene Rekenkamer een onderzoek als bedoeld in [artikel 82, eerste lid][ref1], respectievelijk
      [artikel 83, eerste lid][ref2], op de derde woensdag van mei nog niet heeft afgesloten, zendt zij op die datum
      een voorlopig rapport over de stand van het betrokken onderzoek. In dat geval zendt zij het definitieve rapport,
      alsmede de verklaring van goedkeuring zo spoedig mogelijk na.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel83
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '82'
        hoofdstuk: VII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013891
        artikel: '83'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '85'
    text: |-
      De Algemene Rekenkamer onderzoekt de doeltreffendheid en de doelmatigheid van het gevoerde beleid en de
      doelmatigheid van het financieel en het materieelbeheer, de daartoe bijgehouden administraties en de organisatie
      van het Rijk.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel85
  - number: '86.1'
    text: |-
      Bij het uitoefenen van haar taken kan de Algemene Rekenkamer gebruik maken van de resultaten van door anderen
      verrichte controles, onverminderd haar bevoegdheid tot eigen onderzoek.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel86
  - number: '86.2'
    text: |-
      Onze Ministers verstrekken desgevraagd aan de Algemene Rekenkamer de controleprogramma's van hen die met de
      controle belast zijn en lichten haar volledig in omtrent de resultaten van de controle door overlegging van
      rapporten of op andere door de Algemene Rekenkamer aan te geven wijze.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel86
  - number: '86.3'
    text: |-
      De Algemene Rekenkamer is bevoegd inzage te vorderen in de controledossiers van openbare accountants die in
      opdracht van Onze Ministers met een controle of een review worden belast. [Artikel 43a, tweede en derde lid][ref1],
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel43a
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: 43a
        hoofdstuk: III
        paragraaf: '2'
  - number: '87.1'
    text: |-
      De Algemene Rekenkamer is bevoegd, voor zover zij een en ander nodig acht voor het uitoefenen van haar taak, bij
      alle dienstonderdelen van het Rijk alle goederen, administraties, documenten en andere informatiedragers op door
      haar aan te geven wijze te onderzoeken.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel87
  - number: '87.2'
    text: |-
      Onze Ministers zijn gehouden desgevraagd de inlichtingen te verstrekken die de Algemene Rekenkamer voor haar taak
      nodig acht.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel87
  - number: '87.3'
    text: |-
      Het eerste en tweede lid worden met betrekking tot de begrotingsartikelen *Geheim* verricht door of verstrekt
      aan de president van de Algemene Rekenkamer in persoon. [Artikel 77, tweede en derde lid][ref1], zijn niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel77
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '77'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '87.4'
    text: |-
      De president van de Algemene Rekenkamer is ten aanzien van de gegevens die hem ter beschikking worden gesteld met
      betrekking tot de begrotingsartikelen *Geheim* verplicht tot geheimhouding.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel87
  - number: '87.5'
    text: |-
      Voor zover hij dat van belang acht, deelt hij Onze betrokken Minister in persoon de resultaten mee van zijn
      bevindingen.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel87
  - number: '88.1'
    text: |-
      Heeft de Algemene Rekenkamer op grond van haar onderzoek, bedoeld in [artikel 82][ref1], bezwaar met betrekking tot
      het gevoerde financieel beheer, het materieelbeheer of de verantwoording daarover dan deelt zij dit bezwaar mede
      aan Onze betrokken Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel82
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '82'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '88.2'
    text: |-
      Binnen een maand na ontvangst van deze mededeling stelt Onze betrokken Minister de Algemene Rekenkamer in kennis
      van hetgeen tot opheffing van haar bezwaar kan leiden.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel88
  - number: '88.3'
    text: |-
      Na afloop van deze termijn neemt de Algemene Rekenkamer haar eindbeslissing, waarvan zij mededeling doet aan Onze
      betrokken Minister.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel88
  - number: '88.4'
    text: Indien zij haar bezwaar handhaaft, doet zij hiervan tevens mededeling aan Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel88
  - number: '89.1'
    text: |-
      Handhaaft de Algemene Rekenkamer bij haar eindbeslissing haar bezwaar en houdt dit bezwaar in dat bepaalde
      verplichtingen, uitgaven of ontvangsten niet in overeenstemming met de begrotingswet of met andere wettelijke
      regelingen tot stand zijn gekomen, dan wordt binnen twee maanden aan de Tweede Kamer een voorstel tot vaststelling
      van een indemniteitswet gezonden.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel89
  - number: '89.2'
    text: |-
      Als de Algemene Rekenkamer na afloop van de in het eerste lid bedoelde termijn niet van een zodanige indiening is
      gebleken, doet zij daarvan mededeling aan de Tweede Kamer.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel89
  - number: '89.3'
    text: |-
      Handhaaft de Algemene Rekenkamer bij haar eindbeslissing haar bezwaar en betreft dit een ander bezwaar
      dan bedoeld in het eerste lid, dan maakt zij daarvan melding in het betrokken rapport, bedoeld in
      [artikel 82, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel82
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '82'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '89.4'
    text: Tevens kan zij daaromtrent een aantekening plaatsen in haar rapport bij het Financieel jaarverslag van het Rijk.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel89
  - number: '90'
    text: |-
      Op verzoek van elk van de beide kamers van de Staten-Generaal kan de Algemene Rekenkamer bepaalde onderzoeken
      instellen.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel90
  - number: '91.1'
    text: |-
      Onverminderd het anders bij wet bepaalde heeft de Algemene Rekenkamer de in de volgende leden vermelde bevoegdheden
      ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel91
  - number: 91.1.a
    text: |-
      naamloze vennootschappen en besloten vennootschappen met beperkte aansprakelijkheid, waarvan de Staat het gehele of
      nagenoeg het gehele geplaatste aandelenkapitaal houdt;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel91
  - number: 91.1.b
    text: |-
      naamloze vennootschappen en besloten vennootschappen met beperkte aansprakelijkheid, andere dan onder a bedoeld,
      waarvan de Staat ten minste 5% van het geplaatste aandelenkapitaal houdt, indien daarmede een groter financieel
      belang is gemoeid dan een door Onze Minister van Financiën vast te stellen bedrag;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel91
  - number: 91.1.c
    text: |-
      rechtspersonen, commanditaire vennootschappen en vennootschappen onder firma waaraan de Staat of een derde voor
      rekening of risico van de Staat rechtstreeks of middellijk een subsidie, lening of garantie heeft verleend;
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel91
  - number: 91.1.d
    text: |-
      rechtspersonen voor zover die een bij of krachtens de wet geregelde taak uitoefenen en daartoe geheel of
      gedeeltelijk worden bekostigd uit de opbrengst van bij of krachtens de wet ingestelde heffingen.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel91
  - number: '91.2'
    text: |-
      Aan de hand van dossiers, aanwezig bij Onze verantwoordelijke Minister dan wel bij de instelling, bedoeld in het
      negende lid, kan de Algemene Rekenkamer kennis nemen van jaarrekeningen, daarop betrekking hebbende rapporten van
      hen die deze jaarrekeningen hebben gecontroleerd en overige bescheiden, en kan zij bij Onze Minister dan wel die
      instelling daarover nadere inlichtingen inwinnen.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel91
  - number: '91.3'
    text: |-
      Indien de bescheiden, bedoeld in het tweede lid, haar daartoe aanleiding geven, of een of meer bescheiden
      ontbreken, is de Algemene Rekenkamer bevoegd bij de betrokken rechtspersonen of bij de betrokken commanditaire
      vennootschappen of vennootschappen onder firma daarover nadere inlichtingen in te winnen dan wel van hen het
      overleggen van die bescheiden te vorderen. Het inwinnen van nadere inlichtingen en het vorderen van bescheiden
      heeft, indien het De Nederlandsche Bank N.V. betreft, niet betrekking op taken ter uitvoering van het Verdrag
      betreffende de werking van de Europese Unie. Het inwinnen van nadere inlichtingen en het vorderen van bescheiden
      geschiedt, indien het de vennootschappen betreft, bedoeld in het eerste lid, onder b, door tussenkomst van Onze
      Minister en heeft wat het vorderen van bescheiden betreft uitsluitend betrekking op de jaarrekeningen en rapporten,
      bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel91
  - number: '91.4'
    text: |-
      De Algemene Rekenkamer kan tevens bij de betrokken rechtspersonen en vennootschappen een onderzoek instellen,
      behalve bij de vennootschappen, bedoeld in het eerste lid, onder b, en bij De Nederlandsche Bank N.V., voor
      zover het taken ter uitvoering van het Verdrag betreffende de werking van de Europese Unie betreft. Een
      onderzoek geschiedt bij de betrokken rechtspersoon of vennootschap mede aan de hand van de administratie of bij
      de derde die de administratie in opdracht van de rechtspersoon of vennootschap voert. Onze betrokken Minister
      wordt door de Algemene Rekenkamer van haar voornemen een dergelijk onderzoek in te stellen in kennis gesteld.
      [Artikel 87, eerste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel87
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '87'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '91.5'
    text: |-
      Onverminderd het tweede lid en onverminderd haar bevoegdheid tot eigen onderzoek maakt de Algemene Rekenkamer
      zoveel mogelijk gebruik van de resultaten van door anderen verrichte controles. [Artikel 86, tweede lid][ref1], is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel86
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '86'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '91.6'
    text: |-
      De Algemene Rekenkamer is bevoegd inzage te vorderen in de controledossiers van de accountant die de bescheiden,
      bedoeld in [artikel 43, tweede lid, onder a en b][ref1], heeft gecontroleerd van de in het eerste lid, onder c en
      d, bedoelde rechtspersonen en vennootschappen. [Artikel 43a, tweede en derde lid][ref2], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel43a
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '43'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013891
        artikel: 43a
        hoofdstuk: III
        paragraaf: '2'
  - number: '91.7'
    text: |-
      De Algemene Rekenkamer kan haar bevoegdheden uitoefenen zolang als en over de jaren dat de Staat daarbij belang
      heeft dan wel, voor zover het betreft rechtspersonen of commanditaire vennootschappen of vennootschappen onder
      firma als bedoeld onder d van het eerste lid, zolang als en over de jaren dat het algemeen belang dit vordert.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel91
  - number: '91.8'
    text: |-
      De [artikelen 5:12][ref1], [5:13][ref2], [5:15][ref3] en [5:17 van de Algemene wet bestuursrecht][ref4] zijn van
      overeenkomstige toepassing ten aanzien van het gebruik van de bevoegdheid vermeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '91.9'
    text: |-
      Een instelling die bij of krachtens de wet is belast met het uitoefenen van controle op een rechtspersoon
      als bedoeld in het eerste lid, onder d, licht de Algemene Rekenkamer op door deze aan te geven wijze volledig
      in omtrent de controlebevindingen en stelt op aanvraag haar controleprogramma aan de Algemene Rekenkamer ter
      beschikking.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel91
  - number: '91.10'
    text: |-
      Op aanvraag van Onze verantwoordelijke Minister verstrekt een rechtspersoon, een commanditaire vennootschap of
      vennootschap onder firma of een instelling als bedoeld in het negende lid zo spoedig mogelijk aan hem kopieën van
      brieven aan de Algemene Rekenkamer.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel91
  - number: '91.11'
    text: |-
      De Algemene Rekenkamer doet Onze betrokken Minister kopie toekomen van de brieven die zij toezendt aan een
      rechtspersoon, aan een commanditaire vennootschap of vennootschap onder firma of aan een instelling als bedoeld in
      het negende lid.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel91
  - number: '91.12'
    text: |-
      De Algemene Rekenkamer deelt aan Onze betrokken Minister, aan de betrokken rechtspersoon of de betrokken
      commanditaire vennootschap of vennootschap onder firma en aan de betrokken instelling als bedoeld in het negende
      lid de opmerkingen en bedenkingen mee die zij naar aanleiding van haar bevindingen van belang acht. Aan Onze
      Minister kan zij ter zake voorstellen doen.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel91
  - number: '91.13'
    text: |-
      De Algemene Rekenkamer verstrekt aan Onze Minister van Financiën, Onze betrokken Minister en aan de Staten-Generaal
      zodanige mededelingen als zij in het algemeen belang nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel91
  - number: '91.14'
    text: |-
      In geval de Algemene Rekenkamer dit in het algemeen belang geboden acht, maakt zij van haar bevindingen melding in
      een rapport of het verslag, bedoeld in [artikel 95, eerste onderscheidenlijk tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel95
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '95'
        hoofdstuk: VII
        paragraaf: '3'
  - number: '91.15'
    text: |-
      Van gegevens en bevindingen die naar hun aard vertrouwelijk zijn, maakt de Algemene Rekenkamer
      in afwijking van het veertiende lid geen melding in een rapport of het verslag, bedoeld in
      [artikel 95, eerste onderscheidenlijk tweede lid][ref1]. Mededelingen aan de Staten-Generaal als bedoeld in het
      dertiende lid die zodanige gegevens of bevindingen bevatten, verstrekt zij ter vertrouwelijke kennisneming.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel95
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '95'
        hoofdstuk: VII
        paragraaf: '3'
  - number: '91.16'
    text: |-
      Voor de toepassing van dit artikel worden onder rechtspersonen, commanditaire vennootschappen en vennootschappen
      onder firma, bedoeld in het eerste lid, onderdeel c, niet verstaan financiële ondernemingen met zetel in
      Nederland die een vergunning hebben voor het uitoefenen van het bedrijf van bank of van elektronischgeldinstelling
      ingevolge de [Wet op het financieel toezicht][ref1] of het bedrijf van kredietinstelling ingevolge de
      [Wet financiële markten BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020368
      [ref2]: https://wetten.overheid.nl/BWBR0030883
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0020368
      - id: ref2
        bwb_id: BWBR0030883
  - number: '91.17'
    text: |-
      Dit artikel is niet van toepassing op provincies, gemeenten, de openbare lichamen Bonaire, Sint Eustatius en Saba,
      rechtspersoonlijkheid bezittende lichamen, bedoeld in de[ Wet gemeenschappelijke regelingen][ref1] waterschappen en
      openbare lichamen voor beroep en bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: '92.1'
    text: |-
      Onverminderd het anders bij wet bepaalde, heeft de Algemene Rekenkamer de in de volgende leden vermelde
      bevoegdheden ten aanzien van rechtspersonen, commanditaire vennootschappen, vennootschappen onder firma en
      natuurlijke personen die een beroep of bedrijf uitoefenen aan wie door de Raad van de Europese Unie, het Europees
      Parlement en de Raad gezamenlijk of de Europese Commissie op grond van een vastgesteld programma rechtstreeks of
      middellijk een subsidie wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel92
  - number: '92.2'
    text: |-
      Aan de hand van dossiers aanwezig bij Onze verantwoordelijke Minister, kan de Algemene Rekenkamer kennis nemen
      van jaarrekeningen, daarop betrekking hebbende rapporten van hen die deze jaarrekeningen hebben gecontroleerd en
      overige bescheiden, en kan zij bij Onze Minister daarover nadere inlichtingen inwinnen.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel92
  - number: '92.3'
    text: |-
      Indien de bescheiden, bedoeld in het tweede lid, haar daartoe aanleiding geven, of een of meer bescheiden
      ontbreken, is de Algemene Rekenkamer bevoegd bij de betrokken rechtspersoon, commanditaire vennootschap,
      vennootschap onder firma of natuurlijke persoon die een beroep of bedrijf uitoefent daarover nadere inlichtingen
      in te winnen dan wel inzage in documenten en andere informatiedragers te vorderen, alsmede, mede aan de hand van
      de administratie van de betrokken rechtspersoon, vennootschap of natuurlijke persoon dan wel bij de derde die de
      administratie in opdracht van de rechtspersoon, vennootschap of natuurlijke persoon voert, een onderzoek in te
      stellen. Onze betrokken Minister wordt door de Algemene Rekenkamer van haar voornemen een dergelijk onderzoek in te
      stellen in kennis gesteld. [Artikel 87, eerste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel87
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '87'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '92.4'
    text: |-
      De Algemene Rekenkamer is bevoegd inzage te vorderen in de controledossiers van de accountant die de bescheiden,
      bedoeld in [artikel 43, tweede lid, onder a en b][ref1], heeft gecontroleerd van de in het eerste lid, onder b,
      bedoelde rechtspersonen, vennootschappen en natuurlijke personen. [Artikel 43a, tweede en derde lid][ref2], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel43a
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '43'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013891
        artikel: 43a
        hoofdstuk: III
        paragraaf: '2'
  - number: '92.5'
    text: |-
      De in de voorgaande leden vermelde bevoegdheden zijn gericht op oordeelsvorming over het door Onze Minister
      gevoerde beleid ter nakoming van de bij of krachtens het Verdrag betreffende de werking van de Europese Unie aan
      de lidstaat opgelegde verplichtingen aangaande beheer, controle of toezicht ten aanzien van de rechtmatige en
      doelmatige besteding van de subsidies als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel92
  - number: '92.6'
    text: |-
      De Algemene Rekenkamer kan de in dit artikel vermelde bevoegdheden uitoefenen zolang als en over de jaren dat de
      Staat daarbij belang heeft.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel92
  - number: '92.7'
    text: |-
      [Artikel 91, vierde, vijfde, twaalfde, dertiende, veertiende, vijftiende en zestiende lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel91
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '91'
        hoofdstuk: VII
        paragraaf: '3'
  - number: '92.8'
    text: |-
      De Algemene Rekenkamer voert overleg met de Europese Rekenkamer teneinde te komen tot afspraken over de te hanteren
      normen en criteria bij het in dit artikel bedoelde onderzoek en over de wijze van samenwerking met de Europese
      Rekenkamer.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel92
  - number: '92.9'
    text: |-
      De [artikelen 5:12][ref1], [5:13][ref2], [5:15][ref3] en [5:17 van de Algemene wet bestuursrecht][ref4] zijn van
      overeenkomstige toepassing ten aanzien van het gebruik van de bevoegdheid vermeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '93'
    text: |-
      Indien de zorg voor een administratie aan een derde wordt uitbesteed, dan is de Algemene Rekenkamer bevoegd mede
      aan de hand van de administratie van de betrokken derde dan wel bij degene die de administratie in opdracht van die
      derde voert een onderzoek in te stellen, waarbij [artikel 87, eerste lid][ref1], van overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel87
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '87'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '94.1'
    text: |-
      De Algemene Rekenkamer deelt Onze betrokken Ministers de opmerkingen en bedenkingen mee die zij naar aanleiding van
      haar werkzaamheden van belang acht. Zij kan daarbij ter zake voorstellen doen.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel94
  - number: '94.2'
    text: |-
      De Algemene Rekenkamer verstrekt aan Onze betrokken Ministers, Onze Minister van Financiën en aan de Staten-
      Generaal zodanige mededelingen als zij nodig oordeelt. Zij kan naar aanleiding daarvan met hen nader overleg
      plegen.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel94
  - number: '95.1'
    text: |-
      De Algemene Rekenkamer brengt de rapporten die zij vaststelt over haar onderzoek ter kennis aan Ons en aan de
      Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel95
  - number: '95.2'
    text: |-
      De Algemene Rekenkamer biedt Ons en de Staten-Generaal voor 1 april van elk jaar een verslag aan van haar
      werkzaamheden in het daaraan voorafgaande jaar.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel95
  - number: '96.1'
    text: |-
      Onze betrokken Minister voert overleg met Onze Minister van Financiën en met de Algemene Rekenkamer over de bij of
      krachtens de wet te stellen regels die betrekking hebben op de taken of bevoegdheden van de Algemene Rekenkamer.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel96
  - number: '96.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing, indien bij de oprichting van een rechtspersoon als bedoeld
      in [artikel 34, eerste lid][ref1], ten aanzien van deze rechtspersoon taken en of bevoegdheden ontstaan voor de
      Algemene Rekenkamer.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel34
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '34'
        hoofdstuk: II
        paragraaf: '5'
  - number: '96.3'
    text: |-
      Onze Minister van Financiën voert overleg met de Algemene Rekenkamer inzake de bij of krachtens deze wet te stellen
      regels, met uitzondering van de regels, bedoeld in de [artikelen 18, eerste lid][ref1] en [65][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel65
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '18'
        hoofdstuk: '1'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0013891
        artikel: '65'
        hoofdstuk: V
  - number: '96.4'
    text: Van de gestelde regels wordt door Onze betrokken Minister mededeling gedaan aan de Algemene Rekenkamer.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel96
  - number: '97.1'
    text: |-
      Onverminderd de [artikelen 7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2] kan, ingeval buitengewone omstandigheden
      dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-President, aan Onze Minister van
      Financiën de bevoegdheid worden verleend om regels te stellen in afwijking van deze wet en de wetten, bedoeld in
      [artikel 9, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0013891#Artikel9
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0013891
        artikel: '9'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '97.2'
    text: |-
      Wanneer het in het eerste lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepaling.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel97
  - number: '97.3'
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan wordt bij koninklijk besluit, op voordracht van
      Onze Minister-President, de bepaling die ingevolge het eerste lid in werking is gesteld, onverwijld buiten werking
      gesteld.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel97
  - number: '97.4'
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, wordt de bepaling die ingevolge het eerste lid
      in werking is gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel97
  - number: '97.5'
    text: |-
      Een besluit als bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel97
  - number: '97.6'
    text: Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het Staatsblad.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel97
  - number: '109'
    text: |-
      De bevoegdheden waarin bij of krachtens deze wet is voorzien, kunnen mede worden uitgeoefend in de openbare
      lichamen Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel109
  - number: '110'
    text: 'Deze wet wordt aangehaald als: Comptabiliteitswet 2001.'
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel110
  - number: '111.1'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip en vindt voor het eerst toepassing
      voor het begrotingsjaar 2002.
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel111
  - number: '111.2'
    text: |-
      De [Comptabiliteitswet][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0003075
    url: https://wetten.overheid.nl/BWBR0013891/2016-07-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0003075
  - number: '111.3'
    text: |-
      Met betrekking tot de begrotingsjaren voorafgaande aan het begrotingsjaar 2002 blijven de artikelen van de
      [Comptabiliteitswet][ref1], zoals deze luidden vóór de inwerkingtreding van deze wet, van toepassing.


