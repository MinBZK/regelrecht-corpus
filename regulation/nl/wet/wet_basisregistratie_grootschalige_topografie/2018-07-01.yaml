preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het ter bevordering van een goede vervulling van bepaalde
    publiekrechtelijke taken wenselijk is om een basisregistratie grootschalige topografie tot stand te brengen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *authentiek gegeven:* in een
      basisregistratie opgenomen gegeven dat bij of krachtens de wet als authentiek is aangemerkt;
        - *basislijn:* basislijn volgens het op 10 december 1982 te Montego-Bay tot stand gekomen Verdrag van de Verenigde
      Naties inzake het recht van de zee (Trb. 1983, 83);
        - *basisregistratie:* verzameling gegevens waarvan bij wet is bepaald dat deze een basisregistratie vormt;
        - *bronhouder:* bestuursorgaan of rechtspersoon aan wie bij deze wet de verantwoordelijkheid voor het bijhouden van
      geografische gegevens is opgedragen;
        - *catalogus:* catalogus als bedoeld in [artikel 4][ref1];
        - *defensieterrein:* terrein in eigendom van de Staat en in materieel beheer bij het Ministerie van Defensie met
      uitzondering van oefen- en schietterreinen;
        - *Dienst:* Dienst voor het kadaster en de openbare registers, als bedoeld in
      [artikel 2 van de Organisatiewet Kadaster][ref2];
        - *geografisch gegeven:* 1°. in [artikel 7, tweede lid][ref3], genoemd geografisch object; 2°. in de catalogus
      opgenomen kenmerk als bedoeld in [artikel 7, derde lid][ref4], dat aan een geografisch object is toegekend;
        - *Onze Minister:* Onze Minister van Infrastructuur en Milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0034026#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006463#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0034026#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0034026#Artikel7
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0034026
        artikel: '4'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0006463
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0034026
        artikel: '7'
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0034026
        artikel: '7'
        hoofdstuk: '2'
  - number: '2.1'
    text: |-
      Er is een basisregistratie grootschalige topografie, bestaande uit een landsdekkend topografisch bestand op een
      schaalniveau van 1:500 tot en met 1:5.000.
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel2
  - number: '2.2'
    text: De basisregistratie grootschalige topografie wordt gehouden door de Dienst.
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel2
  - number: '3'
    text: |-
      De basisregistratie grootschalige topografie heeft als doel het aan eenieder beschikbaar stellen van de bij of
      krachtens deze wet in die basisregistratie opgenomen gegevens ten behoeve van:
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel3
  - number: 3.a
    text: een goede vervulling van publiekrechtelijke taken;
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel3
  - number: 3.b
    text: de bevordering van een efficiënte uitwisseling en een efficiënt gebruik van geo-informatie.
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel3
  - number: '4.1'
    text: Bij ministeriële regeling wordt een catalogus vastgesteld.
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel4
  - number: '4.2'
    text: |-
      De catalogus definieert het informatiemodel voor de geografische gegevens die krachtens deze wet in de
      basisregistratie grootschalige topografie worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel4
  - number: '5'
    text: |-
      De in de [hoofdstukken 3][ref1] en [6][ref2] voor de bronhouder opgenomen verplichtingen zijn slechts voor die
      bronhouder van toepassing voor zover het betreft een geografisch object dat op grond van [artikel 10][ref3] of
      [artikel 16][ref4] aan zijn verantwoordelijkheid is toebedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0034026#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0034026#Hoofdstuk6
      [ref3]: https://wetten.overheid.nl/BWBR0034026#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0034026#Artikel16
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0034026
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0034026
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0034026
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref4
        bwb_id: BWBR0034026
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '6.1'
    text: |-
      Personen die door de bronhouder zijn belast met het verzamelen en geometrisch vastleggen van geografische gegevens
      ten behoeve van de uitvoering van deze wet zijn bevoegd met medeneming van de benodigde apparatuur en andere
      hulpmiddelen elke plaats te betreden, met uitzondering van een woning zonder toestemming van de bewoner, en daar
      waarnemingen of metingen te verrichten, voor zover dat redelijkerwijs nodig is voor de vervulling van hun taak.
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel6
  - number: '6.2'
    text: |-
      De eigenaar, de beperkt gerechtigde en de gebruiker van een onroerende zaak zijn verplicht aan de personen,
      bedoeld in het eerste lid, binnen de door dezen gestelde redelijke termijn alle medewerking te verlenen die
      dezen redelijkerwijs kunnen vorderen bij de uitoefening van de bevoegdheden, genoemd in het eerste lid, met dien
      verstande dat toegang slechts wordt verleend tussen acht uur ’s morgens en zes uur ’s avonds en dat die niet
      behoeft te worden verleend op zaterdagen, zondagen en algemeen erkende feestdagen, tenzij bij wettelijk voorschrift
      anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel6
  - number: '6.3'
    text: |-
      Indien de toegang wordt geweigerd, verschaffen de personen, bedoeld in het eerste lid, zich zo nodig toegang
      met behulp van de sterke arm. Indien het verrichten van de handelingen, bedoeld in het eerste lid, niet wordt
      toegestaan zijn de personen, bedoeld in het eerste lid, bevoegd het verrichten van die handelingen zo nodig met
      behulp van de sterke arm mogelijk te maken.
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel6
  - number: '6.4'
    text: |-
      De schade die uit de toepassing van het eerste lid voortvloeit, wordt door de bronhouder op verzoek vergoed. De
      vordering tot schadevergoeding staat ter kennisneming van de kantonrechter bij de rechtbank van het arrondissement
      waarin de onroerende zaak geheel of gedeeltelijk is gelegen. Tegen de uitspraak staat geen rechtsmiddel open.
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel6
  - number: '7.1'
    text: |-
      De basisregistratie grootschalige topografie is toegankelijk door middel van een identificerend objectnummer of een
      locatie op de kaart.
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel7
  - number: '7.2'
    text: |-
      De basisregistratie grootschalige topografie bevat de cartografische weergave van de volgende geografische
      objecten:
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel7
  - number: 7.2.a
    text: wegdeel;
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel7
  - number: 7.2.b
    text: ondersteunend wegdeel;
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel7
  - number: 7.2.c
    text: spoor;
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel7
  - number: 7.2.d
    text: onbegroeid terreindeel;
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel7
  - number: 7.2.e
    text: begroeid terreindeel;
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel7
  - number: 7.2.f
    text: waterdeel;
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel7
  - number: 7.2.g
    text: ondersteunend waterdeel;
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel7
  - number: 7.2.h
    text: pand;
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel7
  - number: 7.2.i
    text: overig bouwwerk;
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel7
  - number: 7.2.j
    text: overbruggingsdeel;
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel7
  - number: 7.2.k
    text: tunneldeel;
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel7
  - number: 7.2.l
    text: overig kunstwerkdeel;
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel7
  - number: 7.2.m
    text: scheiding;
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel7
  - number: 7.2.n
    text: kering, en
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel7
  - number: 7.2.o
    text: ongeclassificeerd object.
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel7
  - number: '7.3'
    text: |-
      De basisregistratie grootschalige topografie bevat ten aanzien van elk geografisch object een identificerend
      objectnummer, beschrijvende, geometrische, cartografische en temporele kenmerken alsmede meta-kenmerken
      overeenkomstig de daarvoor in de catalogus gestelde regels.
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel7
  - number: '7.4'
    text: |-
      De meta-kenmerken, bedoeld in het derde lid, hebben in ieder geval betrekking op de beschrijving van de oorsprong
      en de kwaliteit of nauwkeurigheid van de geografische gegevens.
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel7
  - number: '7.5'
    text: De gegevens, bedoeld in het tweede en derde lid, zijn authentieke gegevens.
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel7
  - number: '8'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat in de basisregistratie grootschalige topografie een
      ander bij die maatregel als authentiek gegeven aan te wijzen gegeven wordt opgenomen dan de gegevens, bedoeld in
      [artikel 7][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0034026#Artikel7
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0034026
        artikel: '7'
        hoofdstuk: '2'
  - number: 8.a
    text: |-
      de kenbaarheid van het betreffende gegeven van belang blijkt voor de uitoefening van een publiekrechtelijke taak
      door bestuursorganen, en
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel8
  - number: 8.b
    text: er geen gewichtige redenen zijn die zich daartegen verzetten.
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel8
  - number: '9.1'
    text: |-
      Indien een authentiek gegeven krachtens een wet tot instelling van een andere basisregistratie dan de
      basisregistratie grootschalige topografie als authentiek gegeven wordt aangemerkt, geldt dat gegeven voor de
      toepassing van deze wet als een uit die andere basisregistratie overgenomen authentiek gegeven.
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel9
  - number: '9.2'
    text: |-
      In de basisregistratie grootschalige topografie wordt een authentiek gegeven dat is overgenomen uit een andere
      basisregistratie door middel van een kenmerk onderscheiden van een authentiek gegeven ingevolge [artikel 7][ref1]
      en [8][ref2] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0034026#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0034026#Artikel8
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0034026
        artikel: '7'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0034026
        artikel: '8'
        hoofdstuk: '2'
  - number: '10.1'
    text: 'Bronhouder zijn:'
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel10
  - number: 10.1.a
    text: |-
      het dagelijks bestuur van een waterschap, voor zover het betreft geografische objecten die onderdeel
      zijn van oppervlaktewateren, waterkeringen en kunstwerken, waarvoor een legger als bedoeld in
      [artikel 5.1 van de Waterwet][ref1] is vastgesteld, alsmede de daartoe behorende terreinen en de wegen die in
      beheer zijn bij een waterschap;


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel5
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '5'
  - number: 10.1.b
    text: |-
      gedeputeerde staten van de provincie, voor zover het betreft geografische objecten die onderdeel zijn van wegen,
      spoorwegen, oppervlaktewaterlichamen, waterkeringen, kunstwerken en de daartoe behorende terreinen die in beheer
      zijn bij de provincie;
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel10
  - number: 10.1.c
    text: |-
      Onze Minister, voor zover het betreft geografische objecten die onderdeel zijn van wegen, oppervlaktewaterlichamen,
      waterkeringen, kunstwerken en de daartoe behorende terreinen die in beheer zijn bij het Rijk;
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel10
  - number: 10.1.d
    text: |-
      de beheerder van de hoofdspoorweginfrastructuur als bedoeld in [artikel 1, onder h, van de Spoorwegwet][ref1],
      voor zover het betreft geografische objecten die onderdeel zijn van spoorwegen, kunstwerken en de daartoe behorende
      terreinen waarover deze het beheer voert;


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel1
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '1'
  - number: 10.1.e
    text: |-
      Onze Minister van Economische Zaken, voor zover het betreft begroeide terreindelen die
      in het kader van de uitvoering van [artikel 24, eerste lid, van de Landbouwwet][ref1], en
      [artikel 34, eerste lid, van de Meststoffenwet][ref2] worden geïdentificeerd;


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel34
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002252
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '34'
  - number: 10.1.f
    text: |-
      Onze Minister van Defensie, voor zover het betreft geografische objecten die onderdeel zijn van defensieterrein,
      alsmede de basislijn;
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel10
  - number: 10.1.g
    text: 'burgemeester en wethouders van de gemeente, voor zover het betreft geografische objecten:'
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel10
  - number: 10.1.g.1°
    text: |-
      gesitueerd in het gebied binnen de bebouwde kom, bedoeld in
      [artikel 20a, eerste lid, van de Wegenverkeerswet 1994][ref1], met uitzondering van de geografische objecten
      waarvoor op grond van de onderdelen a tot en met f een andere bronhouder verantwoordelijk is;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel20a
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 20a
  - number: 10.1.g.2°
    text: |-
      gesitueerd in het gebied buiten de bebouwde kom en die onderdeel zijn van gebouwen met de bijbehorende erven,
      alsmede van wegen en kunstwerken en de daartoe behorende terreinen die in beheer zijn bij de gemeente, alsmede van
      spoorwegen waarvoor op grond van de onderdelen a tot en met f niet een andere bronhouder verantwoordelijk is.
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel10
  - number: '10.2'
    text: |-
      Voor een geografisch object als bedoeld in [artikel 7, tweede lid, onderdeel o][ref1], bepalen bronhouders van
      de daaraan grenzende geografische objecten in onderlinge overeenstemming door wie de bijhouding, bedoeld in
      [artikel 11][ref2], geschiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0034026#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0034026#Artikel11
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0034026
        artikel: '7'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0034026
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '11'
    text: |-
      De bronhouder draagt zorg voor het bijhouden van de geografische gegevens in de basisregistratie grootschalige
      topografie door levering van de gegevens, bedoeld in de [artikelen 7, tweede en derde lid][ref1], en [8][ref2] aan
      de Dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0034026#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0034026#Artikel8
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0034026
        artikel: '7'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0034026
        artikel: '8'
        hoofdstuk: '2'
  - number: '12'
    text: |-
      De bronhouder draagt zorg voor afstemming met een andere bronhouder over de begrenzing en de onderlinge aansluiting
      van de geografische objecten, voor zover dat nodig is om overlap van die objecten te voorkomen en om een
      landsdekkend topografisch bestand te waarborgen.
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel12
  - number: '13'
    text: |-
      Bij het leveren van een geografisch gegeven, bedoeld in [artikel 11][ref1], draagt de bronhouder er zorg voor dat
      het geografische gegeven voldoet aan de kwaliteitseisen, gesteld in de catalogus.


      [ref1]: https://wetten.overheid.nl/BWBR0034026#Artikel11
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0034026
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '14'
    text: |-
      De bronhouder draagt er zorg voor dat een in de basisregistratie grootschalige topografie weergegeven geografisch
      object in overeenstemming is met de fysieke werkelijkheid, binnen de regels ten aanzien van actualiteit die
      daarover in de catalogus worden gesteld.
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel14
  - number: '15.1'
    text: De levering van een geografisch gegeven door de bronhouder geschiedt langs elektronische weg.
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel15
  - number: '15.2'
    text: |-
      Bij het leveren van een geografisch gegeven, bedoeld in het eerste lid, neemt de bronhouder in acht de beschrijving
      van het elektronisch berichtenverkeer, bedoeld in [artikel 20, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034026#Artikel20
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0034026
        artikel: '20'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '15.3'
    text: |-
      Indien bij de bijhouding van een geografisch gegeven meerdere bronhouders betrokken zijn, dan leveren de
      bronhouders dat gegeven gezamenlijk aan de Dienst. Het eerste en tweede lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel15
  - number: '16.1'
    text: |-
      Onze Minister kan, indien dat in het belang van een goede registratie geboden is, aan bronhouders een aanwijzing
      geven ter zake van:
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel16
  - number: 16.1.a
    text: |-
      de toebedeling van een afzonderlijk geografisch object aan de verantwoordelijkheid van een bronhouder,
      overeenkomstig [artikel 10][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0034026#Artikel10
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0034026
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 16.1.b
    text: |-
      de onderlinge begrenzing van geografische objecten, indien de betrokken bronhouders daarover overeenkomstig
      [artikel 12][ref1] niet tot overeenstemming kunnen komen.


      [ref1]: https://wetten.overheid.nl/BWBR0034026#Artikel12
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0034026
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '16.2'
    text: |-
      De aanwijzing wordt slechts gegeven nadat ter zake met de betrokken bronhouders overleg is gepleegd. Tegen de
      aanwijzing kan geen beroep worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel16
  - number: '17'
    text: |-
      De Dienst draagt zorg voor een goede beschikbaarheid, werking en beveiliging van de basisregistratie grootschalige
      topografie en het register, bedoeld in [artikel 27, derde lid][ref1], door middel van een daartoe strekkende
      voorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0034026#Artikel27
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0034026
        artikel: '27'
        hoofdstuk: '6'
  - number: '18.1'
    text: |-
      De Dienst draagt zorg voor het verwerken van een door de bronhouder op grond van [artikel 11][ref1] aan hem
      geleverd geografisch gegeven in de basisregistratie grootschalige topografie.


      [ref1]: https://wetten.overheid.nl/BWBR0034026#Artikel11
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0034026
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '18.2'
    text: |-
      Het verwerken, bedoeld in het eerste lid, vindt plaats binnen vier werkdagen na ontvangst van het betreffende
      geografisch gegeven.
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel18
  - number: '19'
    text: |-
      De Dienst draagt er zorg voor dat de weergave van een krachtens deze wet in de basisregistratie grootschalige
      topografie opgenomen geografisch gegeven overeenstemt met het overeenkomstig [artikel 15][ref1] door de bronhouder
      geleverde geografisch gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0034026#Artikel15
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0034026
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '20.1'
    text: |-
      Bij ministeriële regeling wordt een systeembeschrijving vastgesteld van de inrichting van de basisregistratie
      grootschalige topografie. De systeembeschrijving omvat in ieder geval de beschrijving van het elektronisch
      berichtenverkeer tussen bronhouders en de basisregistratie grootschalige topografie.
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel20
  - number: '20.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gegeven omtrent de technische en administratieve inrichting
      van de basisregistratie grootschalige topografie.
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel20
  - number: '21.1'
    text: |-
      Onze Minister, de Dienst en een representatieve vertegenwoordiging van bronhouders plegen overleg omtrent
      aangelegenheden betreffende de technische en administratieve inrichting van de basisregistratie grootschalige
      topografie en de levering van geografische gegevens, bedoeld in [artikel 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034026#Artikel15
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0034026
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '21.2'
    text: |-
      Onze Minister, de Dienst en een representatieve vertegenwoordiging van bronhouders plegen overleg met een
      representatieve vertegenwoordiging van afnemers omtrent aangelegenheden betreffende het gebruik en de werking van
      de basisregistratie grootschalige topografie.
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel21
  - number: '22.1'
    text: |-
      De Dienst verleent aan eenieder op verzoek inzage in de basisregistratie grootschalige topografie en het register,
      bedoeld in [artikel 27, derde lid][ref1], en verstrekt aan eenieder op verzoek de daarin opgenomen gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0034026#Artikel27
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0034026
        artikel: '27'
        hoofdstuk: '6'
  - number: '22.2'
    text: |-
      De inzage in en het verstrekken van gegevens, bedoeld in het
      eerste lid, kan worden beperkt met overeenkomstige toepassing van
      __REF000___________________________________________________________________________________________________________
      _________________________.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '22.3'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gegeven omtrent de inzage in en het verstrekken van gegevens,
      bedoeld in het eerste lid, waarbij tarieven kunnen worden vastgesteld die verschuldigd zijn voor het verkrijgen
      van inzage of het verstrekken van gegevens. Gebruik van de basisregistratie grootschalige topografie dat bij of
      krachtens de wet verplicht is gesteld, is kosteloos.
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel22
  - number: '23.1'
    text: |-
      Indien een bestuursorgaan bij de vervulling van zijn publiekrechtelijke taak een gegeven nodig heeft dat krachtens
      deze wet als authentiek gegeven in de basisregistratie grootschalige topografie beschikbaar is, gebruikt het dat
      authentiek gegeven.
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel23
  - number: '23.2'
    text: 'Een bestuursorgaan kan een ander gegeven gebruiken dan een authentiek gegeven krachtens deze wet, indien:'
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel23
  - number: 23.2.a
    text: |-
      in het register, bedoeld in [artikel 27, derde lid][ref1], bij het geografisch object waarop dat gegeven betrekking
      heeft de aantekening «in onderzoek» is geplaatst;


      [ref1]: https://wetten.overheid.nl/BWBR0034026#Artikel27
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0034026
        artikel: '27'
        hoofdstuk: '6'
  - number: 23.2.b
    text: |-
      het met betrekking tot dat authentiek gegeven een melding heeft gedaan als bedoeld in
      [artikel 25, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0034026#Artikel25
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0034026
        artikel: '25'
        hoofdstuk: '6'
  - number: 23.2.c
    text: het door toepassing van het eerste lid zijn publiekrechtelijke taak niet naar behoren kan vervullen;
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel23
  - number: 23.2.d
    text: bij wettelijk voorschrift anders is bepaald dan in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel23
  - number: '23.3'
    text: |-
      Voor zover bij de uitoefening van een publiekrechtelijke taak gebruik wordt gemaakt van een topografische
      ondergrond, is een bestuursorgaan niet gehouden toepassing te geven aan het eerste lid, ingeval de uitoefening van
      die taak is gediend met gebruikmaking van een topografische ondergrond met een schaalniveau kleiner dan 1:5.000 of
      groter dan 1:500.
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel23
  - number: '24'
    text: |-
      Degene aan wie door een bestuursorgaan gevraagd wordt om een gegeven te verstrekken dat krachtens deze wet als
      authentiek gegeven in de basisregistratie grootschalige topografie beschikbaar is, behoeft dat gegeven niet te
      verstrekken, behoudens:
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel24
  - number: 24.a
    text: |-
      ingeval in het register, bedoeld in [artikel 27, derde lid][ref1], bij het geografisch object waarop dat gegeven
      betrekking heeft de aantekening «in onderzoek» is geplaatst;


      [ref1]: https://wetten.overheid.nl/BWBR0034026#Artikel27
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0034026
        artikel: '27'
        hoofdstuk: '6'
  - number: 24.b
    text: |-
      in geval van opsporing of onderzoek naar overtreding van een wettelijk voorschrift of van controle op de naleving
      van een wettelijk voorschrift;
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel24
  - number: 24.c
    text: |-
      in geval van dreiging van, of het zich voordoen van, een oproerige beweging, wanordelijkheden, verstoring van de
      openbare orde, rampen of zware ongevallen;
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel24
  - number: 24.d
    text: ingeval bij wettelijk voorschrift anders is bepaald, of
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel24
  - number: 24.e
    text: ingeval het betreffende authentiek gegeven noodzakelijk is voor de identificatie van een object.
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel24
  - number: '25.1'
    text: |-
      Een bestuursorgaan dat gerede twijfel heeft over het in overeenstemming zijn met de fysieke werkelijkheid van een
      in de basisregistratie grootschalige topografie opgenomen authentiek gegeven, binnen de normen ten aanzien van
      actualiteit en nauwkeurigheid die aan dat gegeven in de catalogus worden gesteld, of over het ontbreken van een
      authentiek gegeven in de basisregistratie grootschalige topografie, doet daarvan onder opgaaf van redenen melding
      aan de Dienst.
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel25
  - number: '25.2'
    text: 'De melding, bedoeld in het eerste lid, kan achterwege blijven indien:'
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel25
  - number: 25.2.a
    text: een wettelijk voorschrift daaraan in de weg staat;
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel25
  - number: 25.2.b
    text: de gerede twijfel ontstaat in een geval waarin een onderzoek naar een strafbaar feit plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel25
  - number: '26'
    text: |-
      Na ontvangst van een melding als bedoeld in [artikel 25, eerste lid][ref1], zendt de Dienst die melding onverwijld
      door naar de bronhouder waaraan de verantwoordelijkheid voor het bijhouden van het geografisch object waarop
      het authentiek gegeven betrekking heeft op grond van [artikel 10][ref2] of [16, eerste lid, onder a][ref3], is
      toebedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0034026#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0034026#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0034026#Artikel16
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0034026
        artikel: '25'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0034026
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref3
        bwb_id: BWBR0034026
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '27.1'
    text: |-
      De bronhouder beslist na ontvangst van een melding als bedoeld in [artikel 25, eerste lid][ref1], over de wijziging
      dan wel opneming van het betreffende authentiek gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0034026#Artikel25
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0034026
        artikel: '25'
        hoofdstuk: '6'
  - number: '27.2'
    text: |-
      Indien de bronhouder niet binnen een werkdag na ontvangst van de melding, bedoeld in
      [artikel 25, eerste lid][ref1], heeft beslist over de wijziging dan wel opneming van het betreffende authentieke
      gegeven, bericht hij aan de Dienst dat het geografisch object waarop het authentiek gegeven betrekking heeft in
      onderzoek is.


      [ref1]: https://wetten.overheid.nl/BWBR0034026#Artikel25
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0034026
        artikel: '25'
        hoofdstuk: '6'
  - number: '27.3'
    text: |-
      Op de levering en de verwerking van een bericht als bedoeld in het tweede lid zijn de [artikelen 15][ref1] en
      [18][ref2] van overeenkomstige toepassing, met dien verstande dat de Dienst in afwijking van artikel 18, eerste
      lid, het bericht verwerkt in een afzonderlijk register.


      [ref1]: https://wetten.overheid.nl/BWBR0034026#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0034026#Artikel18
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0034026
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0034026
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '27.4'
    text: |-
      De bronhouder onderzoekt het betreffende authentiek gegeven en beslist zo spoedig mogelijk over de wijziging dan
      wel opneming van dat gegeven, doch uiterlijk op het moment van de eerstvolgende bijhouding van het desbetreffende
      geografische object op grond van de actualiteitseisen die aan dat object in de catalogus worden gesteld.
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel27
  - number: '27.5'
    text: |-
      In afwijking van het bepaalde in het eerste en tweede lid zendt de bronhouder een melding als bedoeld in
      [artikel 25, eerste lid][ref1], met betrekking tot een authentiek gegeven dat uit een andere basisregistratie
      is overgenomen door naar de houder van de betreffende basisregistratie indien de bronhouder constateert dat het
      authentiek gegeven in de basisregistratie grootschalige topografie daaruit juist is afgeleid. De bronhouder doet
      hiervan mededeling aan het bestuursorgaan dat de melding heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0034026#Artikel25
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0034026
        artikel: '25'
        hoofdstuk: '6'
  - number: '28.1'
    text: |-
      Indien de bronhouder op grond van [artikel 27, eerste dan wel vierde lid][ref1], heeft beslist over wijziging
      dan wel opneming van het betreffende authentiek gegeven, levert hij indien van toepassing dat authentiek gegeven
      onverwijld aan de Dienst en bericht de bronhouder aan de Dienst dat het geografisch object waarop het authentiek
      gegeven betrekking heeft niet langer in onderzoek is.


      [ref1]: https://wetten.overheid.nl/BWBR0034026#Artikel27
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0034026
        artikel: '27'
        hoofdstuk: '6'
  - number: '28.2'
    text: |-
      De Dienst verwerkt een bericht als bedoeld in het eerste lid in het register, bedoeld in
      [artikel 27, derde lid][ref1], tegelijk met de verwerking van de wijziging in de basisregistratie grootschalige
      topografie of, indien een melding als bedoeld in [artikel 25, eerste lid][ref2], niet tot wijziging leidt, binnen
      vier werkdagen na ontvangst van dat bericht.


      [ref1]: https://wetten.overheid.nl/BWBR0034026#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0034026#Artikel25
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0034026
        artikel: '27'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0034026
        artikel: '25'
        hoofdstuk: '6'
  - number: '28.3'
    text: |-
      De bronhouder maakt zijn beslissing over wijziging dan wel opneming van het betreffende authentiek gegeven
      onverwijld bekend aan het bestuursorgaan dat de melding, bedoeld in [artikel 25, eerste lid][ref1], heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0034026#Artikel25
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0034026
        artikel: '25'
        hoofdstuk: '6'
  - number: '30.1'
    text: |-
      De bronhouder verricht eens per jaar een onderzoek naar de uitvoering van de voor hem krachtens deze wet geldende
      verplichtingen.
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel30
  - number: '30.2'
    text: |-
      De bronhouder zendt aan Onze Minister een afschrift van de resultaten van het onderzoek. Onze Minister maakt deze
      resultaten openbaar door terinzagelegging daarvan bij het Ministerie van Infrastructuur en Milieu.
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel30
  - number: '30.3'
    text: 'Bij ministeriële regeling:'
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel30
  - number: 30.3.a
    text: worden regels gegeven omtrent de elementen en de wijze van uitvoering van het onderzoek, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel30
  - number: 30.3.b
    text: |-
      kunnen nadere regels worden gegeven omtrent de uitvoering van de verplichting, bedoeld in het tweede lid, eerste
      volzin.
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel30
  - number: '31.1'
    text: |-
      Indien een bronhouder, zijnde het dagelijks bestuur van een waterschap of de beheerder van de
      hoofdspoorweginfrastructuur als bedoeld in [artikel 1, onder h, van de Spoorwegwet][ref1], een bij of
      krachtens deze wet gevorderde beslissing niet of niet naar behoren neemt dan wel een bij of krachtens deze wet
      gevorderde handeling niet of niet naar behoren verricht, kan Onze Minister besluiten daarin te voorzien ten
      laste van die bronhouder. De [artikelen 121, tweede lid][ref2], [121a tot en met 121c][ref3], [121e][ref4] en
      [121g van de Provinciewet][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel121
      [ref3]: https://wetten.overheid.nl/BWBR0005645#Artikel121a
      [ref4]: https://wetten.overheid.nl/BWBR0005645#Artikel121e
      [ref5]: https://wetten.overheid.nl/BWBR0005645#Artikel121g
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '121'
      - id: ref3
        bwb_id: BWBR0005645
        artikel: 121a
      - id: ref4
        bwb_id: BWBR0005645
        artikel: 121e
      - id: ref5
        bwb_id: BWBR0005645
        artikel: 121g
  - number: '31.2'
    text: |-
      Van een besluit tot indeplaatsstelling worden de beide Kamers der Staten-Generaal onverwijld in kennis gesteld.
      Voor zover de indeplaatsstelling het dagelijks bestuur van een waterschap betreft, wordt een afschrift van het
      besluit gezonden aan provinciale staten.
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel31
  - number: '34'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel34
  - number: '35'
    text: 'Deze wet wordt aangehaald als: Wet basisregistratie grootschalige topografie.'
    url: https://wetten.overheid.nl/BWBR0034026/2018-07-01#Artikel35
