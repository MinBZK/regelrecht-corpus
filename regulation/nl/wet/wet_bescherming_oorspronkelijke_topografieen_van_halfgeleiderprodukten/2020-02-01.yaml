preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging hebben genomen, dat het ter uitvoering van de richtlijn van de Raad van de Europese
    Gemeenschappen van 16 december 1986 betreffende de rechtsbescherming van topografieën van halfgeleiderprodukten
    (Pb. L/24, 27 januari 1987) wenselijk is regelen te treffen inzake de bescherming van oorspronkelijke topografieën
    van halfgeleiderprodukten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004224/2020-02-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. *halfgeleiderprodukt:* de definitieve vorm of de tussenvorm van een produkt;

      1°. dat uit een lichaam bestaat, dat een laag halfgeleidermateriaal en een of meer lagen geleidend, isolerend of
      halfgeleidend materiaal bevat, waarbij elk van de lagen een samenstelling heeft die in overeenstemming is met een
      vooraf bepaald driedimensionaal patroon van het lichaam, en

      2°. dat bestemd is om, uitsluitend of tezamen met andere functies, een elektronische functie te vervullen.

      b. *topografie:* een reeks samenhangende beelden, op enigerlei wijze vastgelegd,

      1°. die het driedimensionaal patroon van de lagen weergeven waaruit het halfgeleiderprodukt is samengesteld, en

      2°. waarin elk beeld het patroon of een gedeelte van het patroon van een oppervlak van het halfgeleiderprodukt in
      enig stadium van zijn vervaardiging voorstelt;

      c. *het bureau*: het bureau, bedoeld in [artikel 1 van de Rijksoctrooiwet 1995][ref1];

      d. *het register:* het door het bureau beheerde register waarin depots ingevolge deze wet worden ingeschreven;

      e. *exploiteren:* het verkopen, verhuren of het op andere wijze in het verkeer brengen van exemplaren van de
      topografie of van het halfgeleiderprodukt waarin de topografie is vervat, dan wel het aanbieden voor een van deze
      doeleinden. Voor de toepassing van de [artikelen 4][ref2], [7][ref3] en [13][ref4] wordt onder exploitatie niet
      verstaan exploitatie die geschiedt onder de voorwaarde van vertrouwelijkheid, mits deze voorwaarde alleen geldt
      tussen de desbetreffende contractspartijen.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004224#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0004224#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0004224#Artikel13
