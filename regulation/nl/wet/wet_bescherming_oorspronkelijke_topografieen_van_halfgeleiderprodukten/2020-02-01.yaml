  - number: '2'
    text: |-
      De maker van een oorspronkelijke topografie van een halfgeleiderprodukt heeft een uitsluitend recht op deze
      topografie.
    url: https://wetten.overheid.nl/BWBR0004224/2020-02-01#Artikel2
  - number: '3'
    text: |-
      Indien de arbeid, in dienst van een ander verricht, bestaat in het tot stand brengen van topografieën, wordt,
      tenzij anders is overeengekomen, als de maker van de topografie aangemerkt degene, in wiens dienst de topografie is
      tot stand gebracht.
    url: https://wetten.overheid.nl/BWBR0004224/2020-02-01#Artikel3
  - number: '4'
    text: |-
      Buiten het geval, bedoeld in [artikel 2][ref1], in samenhang met [artikel 3][ref2], komt het uitsluitend recht
      op een topografie mede toe aan de persoon die een oorspronkelijke topografie, die nog niet elders in de wereld is
      geëxploiteerd, voor het eerst in een van de lid-Staten van de Europese Gemeenschappen of in een andere Staat die
      partij is bij de Overeenkomst betreffende de Europese Economische Ruimte met uitsluiting van anderen exploiteert,
      mits deze exploitatie geschiedt met toestemming van degene die de topografie heeft tot stand gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0004224#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004224#Artikel3
    url: https://wetten.overheid.nl/BWBR0004224/2020-02-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004224
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0004224
        artikel: '3'
  - number: '5'
    text: |-
      1 Het uitsluitend recht op een topografie houdt de bevoegdheid in om

      a. de topografie te verveelvoudigen;

      b. een halfgeleiderprodukt te vervaardigen waarin de topografie is vervat;

      c. een exemplaar van de topografie of het halfgeleiderprodukt waarin de topografie is vervat, te exploiteren, dan
      wel voor een of ander aan te bieden, in voorraad te hebben of in te voeren.

      2 Het uitsluitend recht op een topografie kan tegenover derden alleen worden uitgeoefend, nadat het depot van de
      topografie is ingeschreven door het bureau.
    url: https://wetten.overheid.nl/BWBR0004224/2020-02-01#Artikel5
  - number: '6'
    text: |-
      Is een exemplaar van de topografie of het halfgeleiderprodukt waarin de topografie is vervat, in een van de lid-
      Staten van de Europese Gemeenschappen of in een andere Staat die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte door de houder van het uitsluitend recht of met diens toestemming in het verkeer
      gebracht, dan handelt de verkrijger niet in strijd met het uitsluitend recht op de topografie door ten aanzien
      van deze topografie of dit halfgeleiderprodukt de in [artikel 5, eerste lid, onder ][ref1] genoemde handelingen
      te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0004224#Artikel5
    url: https://wetten.overheid.nl/BWBR0004224/2020-02-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004224
        artikel: '5'
  - number: '7'
    text: |-
      Het uitsluitend recht op een topografie vervalt, indien niet binnen uiterlijk twee jaren na het tijdstip waarop een
      exemplaar van de topografie of het halfgeleiderprodukt waarin de topografie is vervat, voor de eerste maal door de
      houder van het uitsluitend recht of met diens toestemming in of buiten Nederland is geëxploiteerd, het depot van de
      topografie heeft plaatsgevonden, mits dit depot door het bureau in het register wordt ingeschreven.
    url: https://wetten.overheid.nl/BWBR0004224/2020-02-01#Artikel7
  - number: '8'
    text: |-
      1 Het depot geschiedt door indiening van een aanvraag om inschrijving, welke aanvraag vermeldt:

      a. naam, adres en woonplaats van de maker, indien hij een ander is dan de deposant;

      b. een aanduiding van de topografie;

      c. vergezeld is van tekeningen of afbeeldingen van de topografie;

      d. de datum waarop een exemplaar van de topografie of het halfgeleiderprodukt waarin de topografie is vervat, voor
      de eerste maal is geëxploiteerd, indien dit reeds heeft plaatsgevonden.

      Bij de aanvraag kan een exemplaar van het halfgeleiderprodukt worden overgelegd.

      2 Bij het depot kan de deposant aangeven welke delen van de in het vorige lid onder *c* genoemde stukken
      bedrijfsgeheimen bevatten en niet ter kennis van derden kunnen worden gebracht, mits de herkenbaarheid van de
      topografie gewaarborgd blijft.

      3 De aanvraag en de bijgevoegde stukken zijn in het Nederlands gesteld.

      4 Indien de deposant of diens gevolmachtigde geen woonplaats in Nederland heeft, is hij verplicht aldaar een
      correspondentie-adres aan te geven alsmede elke wijziging daarvan ter kennis van het bureau te brengen.

      5 Bij het depot dient een bewijsstuk te worden overgelegd waaruit blijkt, dat bij het bureau een bedrag is gestort
      overeenkomstig een bij algemene maatregel van bestuur vastgesteld tarief.

      6 Bij algemene maatregel van bestuur kunnen nadere regels ten aanzien van het in dit artikel bepaalde worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0004224/2020-02-01#Artikel8
  - number: '9'
    text: |-
      1 Het bureau vermeldt op de aanvraag als bedoeld in [artikel 8, eerste lid][ref1], de datum van het depot. Het
      schrijft het depot binnen vier weken in het register in.

      2 Het bureau schrijft het depot niet in, indien de in [artikel 8, onder d][ref2], bedoelde datum meer dan twee
      jaren voor de datum van het depot ligt.

      3 Bij algemene maatregel van bestuur wordt bepaald op welke wijze de inschrijving in het register plaatsvindt en
      welke gegevens daarin worden vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004224#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004224#Artikel8
    url: https://wetten.overheid.nl/BWBR0004224/2020-02-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004224
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0004224
        artikel: '8'
  - number: '10'
    text: |-
      1 Het depot kan geen aanleiding geven tot enig onderzoek door het bureau naar de inhoud van het depot.

      2 Het bureau maakt de inschrijving van het depot zo spoedig mogelijk openbaar in een door het bureau uit te geven
      blad.

      3 Bij algemene maatregel van bestuur kunnen nadere regels ten aanzien van het in het tweede lid bepaalde worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0004224/2020-02-01#Artikel10
  - number: '11'
    text: |-
      1 Een ieder kan vanaf de datum van de inschrijving van het depot desverlangd kennisnemen van de inschrijving en
      van de op het depot betrekking hebbende stukken alsmede een afschrift verkrijgen van de inschrijving. Van de in
      [artikel 8, tweede lid][ref1], genoemde stukken kan kennis worden genomen, indien de houder van het uitsluitend
      recht daartoe toestemming heeft gegeven. Voor de kennisneming zijn geen kosten verschuldigd.

      2 Bij algemene maatregel van bestuur kunnen ten aanzien van het in het vorige lid bepaalde nadere regels worden
      gesteld en wordt het voor het in het eerste lid bedoelde afschrift verschuldigde bedrag vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004224#Artikel8
    url: https://wetten.overheid.nl/BWBR0004224/2020-02-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004224
        artikel: '8'
  - number: '12'
    text: |-
      1 Onverminderd het bepaalde in [artikel 7][ref1] vervalt het uitsluitend recht op een topografie door de doorhaling
      van de inschrijving van het depot op verzoek of door het verstrijken van de geldigheidsduur.

      2 De houder van de inschrijving van het depot van een topografie kan te allen tijde doorhaling van de inschrijving
      verzoeken. Indien uit het register blijkt dat rechten aan derden zijn verleend, kan de doorhaling slechts
      geschieden met hun toestemming.


      [ref1]: https://wetten.overheid.nl/BWBR0004224#Artikel7
    url: https://wetten.overheid.nl/BWBR0004224/2020-02-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004224
        artikel: '7'
  - number: '13'
    text: |-
      1 Het uitsluitend recht op een topografie vervalt door verloop van tien jaren, te rekenen vanaf het einde van het
      kalenderjaar waarin het depot heeft plaatsgevonden, of, indien dit eerder is, vanaf het einde van het in het depot
      vermelde kalenderjaar waarin een exemplaar van de topografie of het halfgeleiderprodukt waarin de topografie is
      vervat, voor de eerste maal is geëxploiteerd.

      2 Het uitsluitend recht op een topografie die niet geëxploiteerd wordt en ten aanzien waarvan geen depot is
      verricht, vervalt door verloop van vijftien jaren te rekenen vanaf het einde van het kalenderjaar waarin de
      topografie is tot stand gebracht.
    url: https://wetten.overheid.nl/BWBR0004224/2020-02-01#Artikel13
  - number: '14'
    text: |-
      1 Het uitsluitend recht op een topografie is vatbaar voor gehele of gedeeltelijke overdracht of andere overgang. De
      levering van het uitsluitend recht op een topografie geschiedt door een daartoe bestemde akte.

      2 Het uitsluitend recht op een topografie kan voorwerp van een licentie zijn.

      3 De overdracht de vestiging van een beperkt recht of de licentie kan niet aan derden worden tegengeworpen dan
      nadat de akte in het register is ingeschreven. De [artikelen 8, derde tot en met zesde lid][ref1], [9][ref2] en
      [10][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004224#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004224#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0004224#Artikel10
    url: https://wetten.overheid.nl/BWBR0004224/2020-02-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004224
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0004224
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0004224
        artikel: '10'
  - number: '15'
    text: |-
      1 Als inbreuk op het uitsluitend recht op de topografie van een halfgeleiderprodukt wordt niet beschouwd de
      verveelvoudiging van de topografie welke uitsluitend dient voor gebruik in de privésfeer voor niet-commerciële
      doeleinden, voor onderwijsdoeleinden of voor de analyse van de topografie.

      2 Ten aanzien van een door toepassing van de in het vorige lid bedoelde analyse tot stand gebrachte oorspronkelijke
      topografie wordt het verrichten van de in [artikel 5][ref1] genoemde handelingen zonder toestemming van degene
      die het uitsluitend recht heeft op de geanalyseerde topografie, niet als inbreuk op het uitsluitend recht op
      laatstgenoemde topografie beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0004224#Artikel5
    url: https://wetten.overheid.nl/BWBR0004224/2020-02-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004224
        artikel: '5'
  - number: '16'
    text: |-
      1 De verkrijger te goeder trouw van een exemplaar van een halfgeleiderprodukt waarin een topografie is vervat, dat
      noch door de houder van het uitsluitend recht noch met diens toestemming in het verkeer is gebracht, handelt niet
      in strijd met het uitsluitend recht op deze topografie, indien hij zonder toestemming van de houder daarvan ten
      aanzien van dit halfgeleiderprodukt de in [artikel 5, eerste lid, onder ][ref1] bedoelde handelingen verricht.

      2 Zodra de in het vorige lid bedoelde verkrijger weet of behoort te weten, dat exemplaren van het
      halfgeleiderprodukt waarin de topografie is vervat, noch door de houder van het uitsluitend recht noch met diens
      toestemming in het verkeer zijn gebracht, is hij slechts bevoegd ten aanzien van de door hem te goeder trouw
      verkregen exemplaren van het halfgeleiderprodukt zonder toestemming van de houder van het uitsluitend recht de
      in [artikel 5, eerste lid, onder ][ref2] bedoelde handelingen te verrichten, indien hij aan laatstgenoemde een
      billijke vergoeding betaalt.

      3 Is een exemplaar van een halfgeleiderprodukt als bedoeld in het tweede lid in een van de lid-Staten van
      de Europese Gemeenschappen of in een andere Staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte in het verkeer gebracht met inachtneming van het bepaalde in voornoemd lid, dan handelt
      de latere verkrijger niet in strijd met het uitsluitend recht op de topografie door ten aanzien van dit
      halfgeleiderprodukt de in [artikel 5, eerste lid, onder ][ref3] genoemde handelingen te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0004224#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004224#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0004224#Artikel5
    url: https://wetten.overheid.nl/BWBR0004224/2020-02-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004224
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0004224
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0004224
        artikel: '5'
  - number: '17'
    text: |-
      1 De houder van het uitsluitend recht op een topografie kan dit recht handhaven jegens een ieder die, zonder
      daartoe gerechtigd te zijn, een van de in [artikel 5][ref1] genoemde handelingen verricht.

      2 De rechter kan op vordering van de houder van het uitsluitend recht, tussenpersonen wier diensten door derden
      worden gebruikt om inbreuk op het recht van de houder te maken, bevelen de diensten die worden gebruikt om die
      inbreuk te maken, te staken.

      3 De voorzieningenrechter kan op vordering van de houder van het uitsluitend recht tijdelijke voortzetting van de
      vermeende inbreuk op dit recht toestaan onder de voorwaarde dat zekerheid wordt gesteld voor vergoeding van de door
      de houder geleden schade. Onder dezelfde voorwaarden kan de rechter voortzetting van de dienstverlening door de
      tussenpersoon als bedoeld in het tweede lid toestaan.

      4 Hij kan, in plaats van schadevergoeding, vorderen, dat de verweerder veroordeeld wordt de door de inbreuk genoten
      winst af te dragen en dienaangaande rekening en verantwoording af te leggen; indien de rechter evenwel van oordeel
      is, dat de omstandigheden van het geval tot zulk een veroordeling geen aanleiding geven, zal hij de verweerder tot
      schadevergoeding kunnen veroordelen. In passende gevallen kan de rechter de schadevergoeding vaststellen als een
      forfaitair bedrag.

      5 De houder van het uitsluitend recht op een topografie kan de vordering tot schadevergoeding of het afdragen van
      de winst ook namens of mede namens licentienemers of pandhouders instellen, onverminderd de bevoegdheid van deze
      laatsten in een al of niet namens hen of mede namens hen door de houder van het uitsluitend recht op een topografie
      ingestelde vordering tussen te komen om rechtstreeks de door hen geleden schade vergoed te krijgen of om zich een
      evenredig deel van de door de verweerder af te dragen winst te doen toewijzen. Een zelfstandige vordering kunnen
      licentienemers en pandhouders slechts instellen met toestemming van de houder van het uitsluitend recht op de
      topografie.


      [ref1]: https://wetten.overheid.nl/BWBR0004224#Artikel5
    url: https://wetten.overheid.nl/BWBR0004224/2020-02-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004224
        artikel: '5'
  - number: '18'
    text: |-
      1 Het uitsluitend recht op een topografie geeft aan de gerechtigde de bevoegdheid om exemplaren van de topografie
      of het halfgeleiderprodukt, ten aanzien waarvan de in [artikel 5][ref1] genoemde handelingen zijn verricht in
      strijd met dit uitsluitend recht, als zijn eigendom op te eisen dan wel onttrekking aan het handelsverkeer,
      vernietiging of onbruikbaarmaking te vorderen. Teneinde tot vernietiging of onbruikbaarmaking over te gaan, kan de
      gerechtigde de afgifte van deze exemplaren vorderen.

      2 De bevoegdheid om als zijn eigendom op te eisen, als bedoeld in het eerste lid van dit artikel, bestaat eveneens
      ten aanzien van gelden waarvan aannemelijk is dat zij zijn verkregen door of als gevolg van inbreuk op het
      uitsluitend recht op een topografie. De bevoegdheid tot vordering van de vernietiging of onbruikbaarmaking bestaat
      tevens ten aanzien van de voorwerpen die rechtstreeks hebben gediend tot de totstandbrenging van de in de vorige
      zin bedoelde voorwerpen.

      3 De bepalingen van het [Wetboek van Burgerlijke Rechtsvordering][ref2] betreffende beslag en executie tot afgifte
      van roerende zaken die geen registergoederen zijn, zijn van toepassing. Bij samenloop met een ander beslag gaat
      degene die beslag heeft gelegd krachtens dit artikel voor.

      4 Tenzij anders is overeengekomen, heeft de licentienemer het recht de in de vorige leden bedoelde bevoegdheden uit
      te oefenen, voor zover deze strekken tot bescherming van de rechten waarvan de uitoefening hem is toegestaan.

      5 De bevoegdheid, bedoeld in het eerste en tweede lid, kan niet worden uitgeoefend ten aanzien van exemplaren van
      de topografie of het halfgeleiderprodukt waarin de topografie is vervat, onder personen berustende die niet in
      soortgelijke topografieën of halfgeleiderprodukten handel drijven en deze uitsluitend tot eigen gebruik hebben
      gekregen, tenzij door hen zelf inbreuk op het desbetreffende uitsluitend recht op een topografie is gepleegd.

      6 De maatregelen bedoeld in het eerste en tweede lid worden op kosten van de verweerder uitgevoerd, tenzij
      bijzondere redenen dit beletten.

      7 Bij de beoordeling van de maatregelen die de gerechtigde of diens licentienemer kan vorderen ingevolge de
      bevoegdheden, genoemd in het eerste en tweede lid, houdt de rechter rekening met de noodzakelijke evenredigheid
      tussen de ernst van de inbreuk en de gevorderde maatregelen en met de belangen van derden.

      8 De rechter kan op vordering van de houder van het uitsluitend recht degene die inbreuk op diens recht heeft
      gemaakt, bevelen al hetgeen hem bekend is omtrent de herkomst en distributiekanalen van de inbreukmakende
      topografie of het halfgeleiderproduct waarin de inbreukmakende topografie is vervat, aan de houder mee te delen
      en alle daarop betrekking hebbende gegevens aan deze te verstrekken. Onder dezelfde voorwaarden kan dit bevel
      worden gegeven aan een derde die op commerciële schaal inbreukmakende topografieën of halfgeleiderproducten
      waarin de inbreukmakende topografie is vervat in zijn bezit heeft of gebruikt, die op commerciële schaal
      diensten verleent die bij de inbreuk worden gebruikt, of die door een van deze derden is aangewezen als zijnde
      betrokken bij de productie, fabricage of distributie van deze topografieën of halfgeleiderproducten of bij het
      verlenen van deze diensten. Deze derde kan zich verschonen van het verstrekken van informatie die bewijs zou
      vormen van deelname aan een inbreuk op een recht van intellectuele eigendom door hem zelf of door de andere in
      [artikel 165, derde lid, Wetboek van Burgerlijke Rechtsvordering][ref3] bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0004224#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0001827
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel165
    url: https://wetten.overheid.nl/BWBR0004224/2020-02-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004224
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0001827
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '165'
  - number: 18a
    text: |-
      De rechter kan op vordering van de houder van het uitsluitend recht gelasten dat op kosten van degene die inbreuk
      op diens recht heeft gemaakt passende maatregelen worden getroffen tot verspreiding van informatie over de
      uitspraak.
    url: https://wetten.overheid.nl/BWBR0004224/2020-02-01#Artikel18a
  - number: '19'
    text: |-
      1 De rechtbank Den Haag en de voorzieningenrechter van die rechtbank in kort geding zijn in eerste aanleg bij
      uitsluiting bevoegd voor alle vorderingen, ingesteld ingevolge [artikel 17][ref1], alsmede voor alle vorderingen
      welke worden ingesteld door een ander dan de houder van het uitsluitend recht op een topografie ten einde te
      doen vaststellen dat bepaalde, door hem verrichte handelingen niet strijdig zijn met een uitsluitend recht op een
      topografie.

      2 Zij zijn voorts bevoegd tot kennisneming van vorderingen of verzoeken die gelijktijdig zijn ingediend met de in
      het vorige lid bedoelde vorderingen en daarmee voldoende samenhang vertonen.


      [ref1]: https://wetten.overheid.nl/BWBR0004224#Artikel17
    url: https://wetten.overheid.nl/BWBR0004224/2020-02-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004224
        artikel: '17'
  - number: '22'
    text: |-
      Van alle rechterlijke uitspraken betreffende het uitsluitend recht op een topografie wordt door de griffier van
      het college, waarvoor de zaak laatstelijk aanhangig was, binnen vier weken kosteloos een afschrift aan het bureau
      gezonden. Het bureau voegt deze uitspraken bij de stukken van het depot.
    url: https://wetten.overheid.nl/BWBR0004224/2020-02-01#Artikel22
  - number: '23'
    text: |-
      Het bureau is verplicht de rechter alle inlichtingen en technische adviezen te verstrekken die deze tot beslissing
      van aan zijn oordeel onderworpen vorderingen of verzoeken inzake het uitsluitend recht op een topografie mocht
      verlangen. Het bureau heeft voor het verstrekken van de technische adviezen aanspraak op schadeloosstelling en op
      loon, door de rechter te begroten.
    url: https://wetten.overheid.nl/BWBR0004224/2020-02-01#Artikel23
  - number: '24'
    text: |-
      1 Hij die opzettelijk inbreuk maakt op het uitsluitend recht op een topografie wordt gestraft met gevangenisstraf
      van ten hoogste zes maanden of geldboete van de vijfde categorie.

      2 Het feit wordt beschouwd als een misdrijf.
    url: https://wetten.overheid.nl/BWBR0004224/2020-02-01#Artikel24
  - number: '25'
    text: |-
      Topografieën als bedoeld in [artikel 2][ref1], die na de datum van inwerkingtreding van deze wet zijn tot stand
      gekomen, zijn uitgesloten van bescherming uit hoofde van de [Auteurswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004224#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001886
    url: https://wetten.overheid.nl/BWBR0004224/2020-02-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004224
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001886
  - number: '26'
    text: |-
      Voor bescherming ingevolge deze wet komen in aanmerking:

      a. makers die onderdaan zijn van dan wel hun gewone verblijfplaats of hun daadwerkelijke industriële of commerciële
      vestiging hebben in een van de lid-Staten van de Europese Gemeenschappen of in een andere Staat die partij is bij
      de Overeenkomst betreffende de Europese Economische Ruimte, en

      b. makers die onderdaan zijn van dan wel hun gewone verblijfplaats of hun daadwerkelijke industriële of commerciële
      vestiging hebben in andere dan de in de vorige zin bedoelde landen, indien zulks bij algemene maatregel van bestuur
      is bepaald of door de Raad van de Europese Gemeenschappen is besloten, en

      c. personen, als bedoeld in [artikel 4][ref1], die onderdaan zijn van dan wel hun gewone verblijfplaats of hun
      daadwerkelijke industriële of commerciële vestiging hebben in een van de lid-Staten van de Europese Gemeenschappen
      of in een andere Staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0004224#Artikel4
    url: https://wetten.overheid.nl/BWBR0004224/2020-02-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004224
        artikel: '4'
  - number: '27'
    text: |-
      1 Deze wet is ook van toepassing op oorspronkelijke topografieën die vóór de datum van haar inwerkingtreding zijn
      tot stand gekomen, met dien verstande dat de in [artikel 5][ref1] genoemde handelingen, indien deze vóór voornoemde
      datum door een ander dan de latere houder van het uitsluitend recht zijn verricht, niet als inbreuk op het in deze
      wet bedoelde uitsluitend recht op een topografie worden aangemerkt.

      2 Met betrekking tot oorspronkelijke topografieën die vóór de datum van inwerkingtreding van deze wet voor de
      eerste maal zijn geëxploiteerd, dient het in [artikel 8][ref2] bedoelde depot te geschieden binnen twee jaar na
      voornoemde datum.

      3 Voor oorspronkelijke topografieën die vóór de terugtrekking van het Verenigd Koninkrijk uit de Europese Unie
      op grond van deze wet beschermd werden, wordt onder «een van de lid-Staten van de Europese Gemeenschappen» in
      [artikel 26][ref3] voor de duur van de bescherming mede verstaan: het Verenigd Koninkrijk.


      [ref1]: https://wetten.overheid.nl/BWBR0004224#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004224#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0004224#Artikel26
    url: https://wetten.overheid.nl/BWBR0004224/2020-02-01#Artikel27
