  - number: 8.9.f
    text: |-
      die zijn gevestigd in een staat waarop [artikel 8.8][ref1], of daarmee vergelijkbare regelgeving in een andere
      staat, in een eerder verslagjaar niet is toegepast tenzij geen van de groepsentiteiten van de multinationale groep
      in dat verslagjaar in die staat waren gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.9
