  - number: 13.2.2
    text: |-
      De keuze, bedoeld in de [artikelen 6.7, eerste lid][ref1], [7.3, negende lid, onderdeel b][ref2],
      [7.6, derde lid][ref3], [8.2, vierde lid][ref4], [8.7, eerste lid][ref5], [8.8, eerste lid][ref6],
      [8.11, eerste lid][ref7], [8.13][ref8], [8.14][ref9] en [10.3, eerste lid][ref10], geldt voor het verslagjaar
      waarvoor die keuze gemaakt is. De keuze wordt automatisch verlengd, tenzij de informatieaangifte-indienende
      groepsentiteit de keuze ten aanzien van een volgend verslagjaar herroept.


