  - number: 1.2.2
    text: |-
      Een groepsentiteit die niet voldoet aan de omschrijving van doorkijkentiteit als bedoeld in het eerste lid, in
      geen enkele staat fiscaal inwoner is en niet onderworpen is aan een betrokken belasting of een kwalificerende
      binnenlandse bijheffing op basis van haar plaats van feitelijke leiding, plaats van oprichting of soortgelijke
      criteria, wordt aangemerkt als een doorkijkentiteit en een fiscaal transparante entiteit met betrekking tot haar
      inkomsten, uitgaven, winsten of verliezen, voor zover:
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel1.2
  - number: 1.2.2.a
    text: haar belanghouders wonen of zijn gevestigd in een staat die de entiteit als fiscaal transparant aanmerkt;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel1.2
  - number: 1.2.2.b
    text: zij geen bedrijfsinrichting heeft in de staat naar het recht waarvan zij is opgericht; en
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel1.2
  - number: 1.2.2.c
    text: haar inkomsten, uitgaven, winsten of verliezen niet toerekenbaar zijn aan een vaste inrichting.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel1.2
  - number: 1.2.3
    text: |-
      Onder een kwalificerende imputatiebelasting als bedoeld in de definitie van niet-kwalificerende restitueerbare
      imputatiebelasting in het eerste lid wordt verstaan een betrokken belasting die is toegerekend aan of betaald
      door een groepsentiteit, waaronder een vaste inrichting, en restitueerbaar is aan of verrekenbaar is door de
      ontvanger van het door die groepsentiteit uitgekeerde dividend, of, in het geval van een betrokken belasting die is
      toegerekend aan of betaald door een vaste inrichting, een door de hoofdentiteit uitgekeerd dividend, voor zover de
      restitutie betaalbaar is gesteld of de verrekening wordt verleend:
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel1.2
  - number: 1.2.3.a
    text: door een staat, niet zijnde de staat die de betrokken belasting heeft geheven;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel1.2
  - number: 1.2.3.b
    text: |-
      aan een uiteindelijk gerechtigde van het dividend, niet zijnde een natuurlijk persoon, die op grond van de
      nationale regelgeving van de staat die de betrokken belasting heeft geheven van de groepsentiteit onderworpen is
      aan belasting over het dividend tegen een nominaal tarief dat ten minste gelijk is aan het minimumbelastingtarief;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel1.2
  - number: 1.2.3.c
    text: |-
      aan een natuurlijk persoon die de uiteindelijk gerechtigde is van het dividend en inwoner is van de staat die
      de betrokken belasting heeft geheven van de groepsentiteit en die is onderworpen aan belasting over het dividend
      tegen een nominaal tarief dat ten minste gelijk is aan het gebruikelijke belastingtarief dat van toepassing is op
      regulier inkomen;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel1.2
  - number: 1.2.3.d
    text: |-
      aan een overheidsentiteit, een internationale organisatie, een ingezeten non-profitorganisatie, een ingezeten
      pensioenfonds, of een ingezeten beleggingsentiteit die geen onderdeel vormt van een multinationale groep of
      binnenlandse groep; of
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel1.2
  - number: 1.2.3.e
    text: |-
      aan een ingezeten levensverzekeringsbedrijf voor zover het dividend is ontvangen in verband met
      pensioenfondsactiviteiten in de staat van vestiging van dat levensverzekeringsbedrijf en het dividend op een
      vergelijkbare wijze aan belastingheffing is onderworpen als een dividend ontvangen door een pensioenfonds.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel1.2
  - number: 1.2.4
    text: 'Voor de toepassing van het derde lid, onderdelen d en e, geldt dat:'
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel1.2
  - number: 1.2.4.a
    text: |-
      een non-profitorganisatie of pensioenfonds ingezetene van een staat is indien die organisatie, onderscheidenlijk
      dat fonds, naar het recht van die staat is opgericht en daar wordt beheerd;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel1.2
  - number: 1.2.4.b
    text: |-
      een beleggingsentiteit ingezetene van een staat is indien zij naar het recht van die staat is opgericht en wordt
      gereguleerd;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel1.2
  - number: 1.2.4.c
    text: een levensverzekeringsbedrijf ingezetene van de staat is waarin het is gevestigd.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel1.2
  - number: 1.2.5
    text: |-
      Voor de toepassing van de definitie van doorkijkentiteit in het eerste lid en voor de toepassing van het tweede
      lid, onderdeel a, is een entiteit fiscaal transparant indien haar inkomsten, uitgaven, winsten of verliezen bij
      of krachtens de wetten van een staat rechtstreeks aan de directe belanghouder toekomen, of rechtstreeks bij hem
      opkomen, naar evenredigheid van zijn belang.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel1.2
  - number: 1.2.6
    text: 'Een staatsinvesteringsfonds dat een overheidsentiteit is wordt geacht geen:'
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel1.2
  - number: 1.2.6.a
    text: uiteindelijkemoederentiteit te zijn;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel1.2
  - number: 1.2.6.b
    text: controlerend belang te hebben in de entiteiten waarin zij een belang heeft; en
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel1.2
  - number: 1.2.6.c
    text: onderdeel te vormen van een groep.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel1.2
  - number: 1.2.7
    text: |-
      Indien de Europese Commissie een derde staat aanmerkt als een staat die een set maatregelen heeft geïmplementeerd
      in zijn nationale recht die gelijkwaardig is aan een kwalificerende inkomen-inclusiemaatregel, wordt die set
      maatregelen voor de toepassing van deze wet geacht een kwalificerende inkomen-inclusiemaatregel te zijn.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel1.2
  - number: 1.3.1
    text: |-
      Een entiteit, niet zijnde een doorkijkentiteit, is voor de toepassing van deze wet, in afwijking in zoverre van
      [artikel 4 van de Algemene wet inzake rijksbelastingen][ref1], gevestigd in de staat waarin zij op grond van
      haar plaats van feitelijke leiding, plaats van oprichting of andere soortgelijke criteria, wordt aangemerkt als
      fiscaal inwoner. Indien er op basis van de eerste zin geen staat van vestiging is, wordt de entiteit geacht te zijn
      gevestigd in de staat naar het recht waarvan zij is opgericht.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel4
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '4'
  - number: 1.3.2
    text: |-
      Een doorkijkentiteit wordt als staatloos aangemerkt, tenzij wordt voldaan aan een van de volgende voorwaarden, in
      welk geval zij wordt geacht te zijn gevestigd in de staat naar het recht waarvan zij is opgericht:
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel1.3
  - number: 1.3.2.a
    text: de doorkijkentiteit is de uiteindelijkemoederentiteit van een multinationale groep of binnenlandse groep; of
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel1.3
  - number: 1.3.2.b
    text: de doorkijkentiteit dient een kwalificerende inkomen-inclusiemaatregel toe te passen.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel1.3
  - number: 1.3.3
    text: |-
      Een vaste inrichting als bedoeld in onderdeel a van de definitie van vaste inrichting in
      [artikel 1.2, eerste lid][ref1], is gelegen in de staat waarin zij wordt aangemerkt als een vaste inrichting en
      waaraan het heffingsrecht is toegewezen op grond van het van toepassing zijnde belastingverdrag.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel1
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '1'
        hoofdstuk: '1'
  - number: 1.3.4
    text: |-
      Een vaste inrichting als bedoeld in onderdeel b van de definitie van vaste inrichting in
      [artikel 1.2, eerste lid][ref1], is gelegen in de staat waarin zij is onderworpen aan een belasting op nettobasis
      op grond van haar aanwezigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel1
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '1'
        hoofdstuk: '1'
  - number: 1.3.5
    text: |-
      Een vaste inrichting als bedoeld in onderdeel c van de definitie van vaste inrichting in
      [artikel 1.2, eerste lid][ref1], is gelegen in de staat waarin zij zich bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel1
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '1'
        hoofdstuk: '1'
  - number: 1.3.6
    text: |-
      Een vaste inrichting als bedoeld in onderdeel d van de definitie van vaste inrichting in
      [artikel 1.2, eerste lid][ref1], wordt als staatloos aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel1
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '1'
        hoofdstuk: '1'
  - number: 1.3.7
    text: |-
      Een entiteit die op grond van het eerste lid in twee staten is gevestigd, wordt behoudens in de gevallen, bedoeld
      in het achtste lid, geacht te zijn gevestigd in de staat waarin zij op grond van het tussen die staten van
      toepassing zijnde belastingverdrag als fiscaal inwoner wordt aangemerkt.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel1.3
  - number: 1.3.8
    text: |-
      Een entiteit die op grond van het eerste lid in twee staten is gevestigd, wordt geacht te zijn gevestigd in de
      staat die het hoogste bedrag aan betrokken belastingen over het verslagjaar heeft geheven, indien:
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel1.3
  - number: 1.3.8.a
    text: |-
      geen voorkoming van dubbele belasting op grond van het van toepassing zijnde belastingverdrag wordt verleend, omdat
      de entiteit voor de toepassing van dat verdrag gevestigd is in beide verdragsstaten;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel1.3
  - number: 1.3.8.b
    text: |-
      het van toepassing zijnde belastingverdrag vereist dat de bevoegde autoriteiten door middel van een onderlinge
      overlegprocedure bepalen in welke staat de entiteit geacht wordt fiscaal inwoner te zijn en daarover geen
      overeenstemming is bereikt; of
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel1.3
  - number: 1.3.8.c
    text: geen belastingverdrag tussen die staten van toepassing is.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel1.3
  - number: 1.3.9
    text: |-
      Indien voor een entiteit waarop het achtste lid van toepassing is geen vestigingsplaats kan worden bepaald omdat
      het verschuldigde bedrag aan betrokken belastingen over het verslagjaar in beide staten waarin zij is gevestigd
      gelijk of nihil is, wordt de entiteit geacht te zijn gevestigd in de staat waarin de som van de bedragen van de
      uitzondering voor werknemerslasten, bedoeld in [artikel 8.3, tweede lid][ref1], en de uitzondering voor materiële
      activa, bedoeld in artikel 8.3, derde lid, van die entiteit in dat verslagjaar het hoogst is. Indien de som
      van die bedragen in beide staten gelijk of nihil is, wordt de entiteit geacht staatloos te zijn, tenzij zij een
      uiteindelijkemoederentiteit is, in welk geval zij geacht wordt te zijn gevestigd in de staat naar het recht waarvan
      zij is opgericht.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 1.3.10
    text: |-
      Bij de bepaling van het hoogste bedrag aan betrokken belastingen, bedoeld in het achtste lid, blijft het bedrag aan
      belastingen dat overeenkomstig een belastingregeling voor buitenlandse gecontroleerde lichamen is geheven buiten
      beschouwing.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel1.3
  - number: 1.3.11
    text: |-
      Een moederentiteit die op grond van het eerste lid zowel is gevestigd in Nederland als in een andere staat waarin
      zij niet is onderworpen aan een kwalificerende inkomen-inclusiemaatregel en die als gevolg van de toepassing van
      het zevende, achtste, of negende lid, wordt geacht te zijn gevestigd in die andere staat wordt, in afwijking in
      zoverre van die leden, voor de toepassing van [hoofdstuk 4][ref1] geacht te zijn gevestigd in Nederland, tenzij
      het van toepassing zijnde belastingverdrag de toepassing van een kwalificerende inkomen-inclusiemaatregel verbiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0049111
        hoofdstuk: '4'
  - number: 1.3.12
    text: |-
      Een entiteit waarvan de vestigingsplaats in de loop van het verslagjaar wijzigt, wordt in dat verslagjaar geacht te
      zijn gevestigd in de staat waarin zij op grond van dit artikel bij de aanvang van dat verslagjaar is gevestigd.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel1.3
  - number: 1.3.13
    text: |-
      Voor de toepassing van deze wet wordt onder de vestigingsplaats van een groepsentiteit mede begrepen de plaats waar
      een vaste inrichting is gelegen.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel1.3
  - number: 2.1.1
    text: |-
      Deze wet heeft in een verslagjaar betrekking op groepsentiteiten, niet zijnde uitgesloten entiteiten als bedoeld
      in [artikel 2.2][ref1], die deel uitmaken van een multinationale groep of binnenlandse groep, indien die groep in
      ten minste twee van de vier onmiddellijk aan het verslagjaar voorafgaande verslagjaren of, indien minder dan vier
      verslagjaren vooraf zijn gegaan aan het verslagjaar, in ten minste twee van de onmiddellijk aan het verslagjaar
      voorafgaande verslagjaren, volgens de geconsolideerde jaarrekening van de uiteindelijkemoederentiteit van de groep
      een omzet heeft van ten minste € 750.000.000 per verslagjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel2
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.1.2
    text: |-
      Het bedrag van € 750.000.000 wordt opgevat en berekend met inbegrip van de in de geconsolideerde jaarrekening
      van de uiteindelijkemoederentiteit van de groep opgenomen omzet van uitgesloten entiteiten als bedoeld in
      [artikel 2.2][ref1] en wordt voor een verslagjaar dat langer of korter is dan een periode van twaalf maanden
      verhoogd, onderscheidenlijk verlaagd, naar evenredigheid van het aantal maanden in dat verslagjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel2
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.2.1
    text: 'Onder een uitgesloten entiteit wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel2.2
  - number: 2.2.1.a
    text: |-
      een overheidsentiteit, een internationale organisatie, een non-profitorganisatie, een pensioenfonds,
      een beleggingsfonds dat een uiteindelijkemoederentiteit is en een vastgoedbeleggingsvehikel dat een
      uiteindelijkemoederentiteit is;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel2.2
  - number: 2.2.1.b
    text: |-
      een entiteit waarvan ten minste 95% van de waarde zowel onmiddellijk als via een of meer uitgesloten
      entiteiten wordt gehouden door een of meer entiteiten als bedoeld in onderdeel a, niet zijnde
      pensioendienstverleningsentiteiten, en die:
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel2.2
  - number: 2.2.1.b.1°
    text: |-
      uitsluitend of nagenoeg uitsluitend activa aanhoudt of middelen belegt ten behoeve van de entiteit of entiteiten,
      bedoeld in onderdeel a, niet zijnde pensioendienstverleningsentiteiten; of
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel2.2
  - number: 2.2.1.b.2°
    text: |-
      uitsluitend activiteiten verricht die ondergeschikt zijn aan de activiteiten van de entiteit of entiteiten, bedoeld
      in onderdeel a, niet zijnde pensioendienstverleningsentiteiten;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel2.2
  - number: 2.2.1.c
    text: |-
      een entiteit waarvan ten minste 85% van de waarde zowel onmiddellijk als via een of meer uitgesloten
      entiteiten wordt gehouden door een of meer entiteiten als bedoeld in onderdeel a, niet zijnde
      pensioendienstverleningsentiteiten, mits die entiteit voldoet aan de voorwaarden, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel2.2
  - number: 2.2.2
    text: |-
      Het eerste lid, onderdeel c, is slechts van toepassing op een entiteit indien nagenoeg al het
      inkomen van die entiteit bestaat uit dividenden of vermogenswinsten of -verliezen die op basis van
      [artikel 6.2, eerste lid, onderdeel b, onderscheidenlijk onderdeel c][ref1], of een soortgelijke regeling in een
      andere staat, zijn uitgesloten van het kwalificerende inkomen of verlies.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel6
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '6'
        hoofdstuk: '6'
  - number: 2.2.3
    text: |-
      Voor de toepassing van het eerste lid, onderdeel b, onder 2°, wordt een entiteit waarvan de gehele waarde
      onmiddellijk of middellijk wordt gehouden door een of meer non-profitorganisaties geacht uitsluitend activiteiten
      te verrichten die ondergeschikt zijn aan de activiteiten van die non-profitorganisaties, indien de omzet van de
      multinationale groep of binnenlandse groep zonder de omzet van die non-profitorganisaties en de entiteiten die op
      de voet van het eerste lid, onderdelen b of c, uitgesloten entiteiten zijn voor een verslagjaar lager is dan:
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel2.2
  - number: 2.2.3.a
    text: |-
      de omzet, bedoeld in [artikel 2.1][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel2
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.2.3.b
    text: |-
      25% van de omzet van de multinationale groep of binnenlandse groep zoals gerapporteerd in de geconsolideerde
      jaarrekening van de uiteindelijkemoederentiteit van de groep.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel2.2
  - number: 2.2.4
    text: |-
      De informatieaangifte-indienende groepsentiteit kan ervoor kiezen om, in afwijking van het eerste lid, de
      entiteiten, bedoeld in het eerste lid, onderdelen b en c, niet te behandelen als uitgesloten entiteiten.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel2.2
  - number: 3.1.1
    text: |-
      Belastingplichtig voor de binnenlandse bijheffing is een in Nederland gevestigde groepsentiteit als bedoeld in
      [artikel 2.1, eerste lid][ref1], die een laagbelaste groepsentiteit is.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel2
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '2'
        hoofdstuk: '2'
  - number: 3.1.2
    text: |-
      Indien meerdere groepsentiteiten als bedoeld in het eerste lid behoren tot dezelfde multinationale groep of
      binnenlandse groep, wordt de binnenlandse bijheffing van hen geheven alsof er één belastingplichtige is, in die
      zin dat het kwalificerende inkomen van die entiteiten voor de toepassing van [artikel 8.2, vijfde lid][ref1],
      kwalificerend inkomen is van de entiteit bij wie de binnenlandse bijheffing wordt geheven. De binnenlandse
      bijheffing, bedoeld in de eerste zin, wordt geheven bij:


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 3.1.2.a
    text: |-
      de in Nederland gevestigde moederentiteit waarvan het belang niet onmiddellijk of middellijk wordt gehouden door
      een andere in Nederland gevestigde moederentiteit; of
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel3.1
  - number: 3.1.2.b
    text: |-
      indien er meerdere in Nederland gevestigde moederentiteiten als bedoeld in onderdeel a zijn of er geen in Nederland
      gevestigde moederentiteit is: een daartoe door de groep of de inspecteur aangewezen in Nederland gevestigde
      groepsentiteit.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel3.1
  - number: 3.1.3
    text: |-
      Indien het tweede lid, onderdeel b, van toepassing is, wordt, al dan niet op verzoek van een in Nederland
      gevestigde groepsentiteit, bij voor bezwaar vatbare beschikking door de inspecteur vastgesteld bij welke
      groepsentiteit de binnenlandse bijheffing wordt geheven.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel3.1
  - number: 3.1.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld waaraan het verzoek, bedoeld in
      het derde lid, moet voldoen.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel3.1
  - number: 3.2.1
    text: |-
      De over een verslagjaar verschuldigde binnenlandse bijheffing is gelijk aan de over het verslagjaar berekende
      bijheffing van de groep voor Nederland, met dien verstande dat bij die berekening niet in aanmerking wordt genomen:
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel3.2
  - number: 3.2.1.a
    text: |-
      het bedrag van de kwalificerende binnenlandse bijheffing over het verslagjaar, bedoeld in
      [artikel 8.2, tweede lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 3.2.1.b
    text: |-
      het bedrag dat op grond van [artikel 8.4, zevende lid][ref1], wordt aangemerkt als additionele bijheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 3.2.2
    text: |-
      Voor de toepassing van het eerste lid wordt de overwinst, bedoeld in [artikel 8.2, vierde lid][ref1], berekend in
      overeenstemming met een kwalificerende verslaggevingsstandaard als bedoeld in [artikel 8.13, tweede lid][ref2], en
      met inachtneming van artikel 8.13, vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 3.2.3
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld ter bepaling van hetgeen voor de toepassing van het tweede
      lid wordt verstaan onder een omvangrijke concurrentieverstoring.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel3.2
  - number: 4.1.1
    text: |-
      Belastingplichtig voor de inkomen-inclusiebijheffing is een in Nederland gevestigde groepsentiteit als bedoeld
      in [artikel 2.1, eerste lid][ref1], zijnde een uiteindelijkemoederentiteit, een tussenliggende moederentiteit
      die wordt gehouden door een in een derde staat gevestigde uiteindelijkemoederentiteit of door een in een lidstaat
      gevestigde uiteindelijkemoederentiteit die een uitgesloten entiteit is, of een partieel gehouden moederentiteit,
      die:


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel2
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '2'
        hoofdstuk: '2'
  - number: 4.1.1.a
    text: |-
      een onmiddellijk of middellijk belang heeft in een of meer in een andere staat gevestigde of staatloze laagbelaste
      groepsentiteiten;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel4.1
  - number: 4.1.1.b
    text: een onmiddellijk of middellijk belang heeft in een of meer in Nederland gevestigde laagbelaste groepsentiteiten; of
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel4.1
  - number: 4.1.1.c
    text: zelf een laagbelaste groepsentiteit is.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel4.1
  - number: 4.1.2
    text: 'Het eerste lid is niet van toepassing op een in Nederland gevestigde tussenliggende moederentiteit indien:'
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel4.1
  - number: 4.1.2.a
    text: |-
      de uiteindelijkemoederentiteit verplicht is over het verslagjaar een kwalificerende inkomen-inclusiemaatregel toe
      te passen; of
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel4.1
  - number: 4.1.2.b
    text: |-
      een andere tussenliggende moederentiteit, onmiddellijk of middellijk, een controlerend belang in de tussenliggende
      moederentiteit heeft en die andere tussenliggende moederentiteit verplicht is over het verslagjaar een
      kwalificerende inkomen-inclusiemaatregel toe te passen.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel4.1
  - number: 4.1.3
    text: |-
      Het eerste lid is niet van toepassing op een in Nederland gevestigde partieel gehouden moederentiteit indien het
      volledige belang in die entiteit, onmiddellijk of middellijk, wordt gehouden door een andere partieel gehouden
      moederentiteit die verplicht is over het verslagjaar een kwalificerende inkomen-inclusiemaatregel toe te passen.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel4.1
  - number: 4.2.1
    text: |-
      De over een verslagjaar verschuldigde inkomen-inclusiebijheffing die wordt geheven van een moederentiteit als
      bedoeld in [artikel 4.1, eerste lid, onderdelen a en b][ref1], is gelijk aan de som van de berekende bedragen aan
      bijheffing over het verslagjaar voor iedere laagbelaste groepsentiteit waarin zij een onmiddellijk of middellijk
      belang heeft, nadat die bijheffing per groepsentiteit is vermenigvuldigd met het aan de moederentiteit toerekenbare
      deel van die bijheffing over het verslagjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel4
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.2.2
    text: |-
      Het aan een moederentiteit toerekenbare deel van de bijheffing voor een laagbelaste groepsentiteit over het
      verslagjaar is gelijk aan het kwalificerende inkomen van die laagbelaste groepsentiteit over het verslagjaar
      verminderd met het bedrag van dat kwalificerende inkomen dat toerekenbaar is aan andere belanghouders in die
      entiteit en gedeeld door het kwalificerende inkomen van die groepsentiteit over het verslagjaar.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel4.2
  - number: 4.2.3
    text: |-
      Het bedrag aan kwalificerend inkomen van een laagbelaste groepsentiteit dat toerekenbaar is aan andere
      belanghouders in die entiteit is het bedrag dat op basis van de principes van de geaccepteerde financiële
      verslaggevingsstandaard die gebruikt zijn bij het opstellen van de geconsolideerde jaarrekening van de
      uiteindelijkemoederentiteit behandeld zou zijn als toerekenbaar aan die andere belanghouders als de nettowinst van
      de laagbelaste groepsentiteit gelijk zou zijn aan haar kwalificerende inkomen en:
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel4.2
  - number: 4.2.3.a
    text: |-
      de moederentiteit een geconsolideerde jaarrekening zou hebben opgesteld in lijn met die verslaggevingsstandaard (de
      hypothetische geconsolideerde jaarrekening);
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel4.2
  - number: 4.2.3.b
    text: |-
      de moederentiteit een controlerend belang in de laagbelaste groepsentiteit zou hebben waardoor alle inkomsten en
      uitgaven van de laagbelaste groepsentiteit integraal geconsolideerd zouden zijn met de inkomsten en de uitgaven van
      de moederentiteit in de hypothetische geconsolideerde jaarrekening;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel4.2
  - number: 4.2.3.c
    text: |-
      het kwalificerende inkomen van de laagbelaste groepsentiteit geheel toerekenbaar zou zijn aan transacties met
      natuurlijk personen of entiteiten die geen onderdeel vormen van de groep; en
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel4.2
  - number: 4.2.3.d
    text: |-
      alle belangen die niet middellijk of onmiddellijk door de moederentiteit worden gehouden, gehouden zouden worden
      door natuurlijk personen of entiteiten die geen onderdeel vormen van de groep.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel4.2
  - number: 4.2.4
    text: |-
      De over een verslagjaar verschuldigde inkomen-inclusiebijheffing die, al dan niet in aanvulling op het eerste lid,
      wordt geheven van een moederentiteit als bedoeld in [artikel 4.1, eerste lid, onderdeel c][ref1], is gelijk aan de
      berekende bijheffing voor die moederentiteit over het verslagjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel4
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.2.5
    text: |-
      Voor de toepassing van dit artikel wordt verstaan onder andere belanghouders: belanghouders die niet tot dezelfde
      groep behoren als de moederentiteit en de laagbelaste groepsentiteiten.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel4.2
  - number: 4.3.1
    text: |-
      Indien een moederentiteit als bedoeld in [artikel 4.1, eerste lid][ref1], een belang heeft in een laagbelaste
      groepsentiteit door middel van een tussenliggende moederentiteit of partieel gehouden moederentiteit die over
      het verslagjaar bijheffing op grond van een kwalificerende inkomen-inclusiemaatregel is verschuldigd, wordt het
      over het verslagjaar door de moederentiteit, bedoeld in [artikel 4.1, eerste lid][ref2], verschuldigde bedrag
      aan inkomen-inclusiebijheffing verminderd met het aan haar toerekenbare bedrag van die bijheffing dat door die
      tussenliggende moederentiteit of partieel gehouden moederentiteit is verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Artikel4
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0049111
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.3.2
    text: |-
      Indien [artikel 8.13][ref1] niet van toepassing is en een moederentiteit als bedoeld in
      [artikel 4.1, eerste lid][ref2], onmiddellijk of middellijk een belang heeft in een of meer laagbelaste
      groepsentiteiten ter zake waarvan in hun staat van vestiging over het verslagjaar een kwalificerende binnenlandse
      bijheffing is verschuldigd, wordt het over het verslagjaar door de moederentiteit, bedoeld in artikel 4.1, eerste
      lid, ter zake van die laagbelaste groepsentiteiten verschuldigde bedrag aan inkomen-inclusiebijheffing verminderd
      met die kwalificerende binnenlandse bijheffing, maar niet verder dan tot nihil.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Artikel4
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0049111
        artikel: '4'
        hoofdstuk: '4'
  - number: 5.1.1
    text: |-
      Belastingplichtig voor de onderbelastewinstbijheffing is een in Nederland gevestigde groepsentiteit als bedoeld
      in [artikel 2.1, eerste lid][ref1], niet zijnde een beleggingsentiteit, die behoort tot een multinationale
      groep waarvan een of meer laagbelaste groepsentiteiten deel uitmaken en waarvan de uiteindelijkemoederentiteit
      is gevestigd in een lidstaat van de Europese Unie die op grond van artikel 50, eerste lid, van [Richtlijn (EU)
      2022/2523](32022L2523) ervoor heeft gekozen om de inkomen-inclusiemaatregel en de onderbelastewinstmaatregel niet
      toe te passen met betrekking tot verslagjaren die aanvangen voor 31 december 2029.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel2
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '2'
        hoofdstuk: '2'
  - number: 5.1.2
    text: |-
      Indien meerdere in Nederland gevestigde groepsentiteiten als bedoeld in [artikel 2.1, eerste lid][ref1],
      niet zijnde beleggingsentiteiten, behoren tot een multinationale groep als bedoeld in het eerste lid, is
      belastingplichtig voor de onderbelastewinstbijheffing:


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel2
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '2'
        hoofdstuk: '2'
  - number: 5.1.2.a
    text: |-
      de in Nederland gevestigde moederentiteit waarvan het belang niet onmiddellijk of middellijk wordt gehouden door
      een andere in Nederland gevestigde moederentiteit; of
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel5.1
  - number: 5.1.2.b
    text: |-
      indien er meerdere in Nederland gevestigde moederentiteiten als bedoeld in onderdeel a zijn of er geen in Nederland
      gevestigde moederentiteit is: een daartoe door de groep of de inspecteur aangewezen in Nederland gevestigde
      groepsentiteit.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel5.1
  - number: 5.1.3
    text: |-
      Indien het tweede lid, onderdeel b, van toepassing is, wordt, al dan niet op verzoek van een in Nederland
      gevestigde groepsentiteit, bij voor bezwaar vatbare beschikking door de inspecteur vastgesteld welke groepsentiteit
      belastingplichtig is voor de onderbelastewinstbijheffing.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel5.1
  - number: 5.1.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld waaraan het verzoek, bedoeld in
      het derde lid, moet voldoen.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel5.1
  - number: 5.1.5
    text: |-
      De in Nederland gevestigde groepsentiteit, bedoeld in het eerste en tweede lid, is slechts belastingplichtig voor
      de onderbelastewinstbijheffing met betrekking tot verslagjaren die aanvangen voor 31 december 2029.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel5.1
  - number: 5.2.1
    text: |-
      De over een verslagjaar verschuldigde onderbelastewinstbijheffing is gelijk aan het bedrag van de totale
      onderbelastewinstbijheffing over het verslagjaar, bedoeld in het tweede lid, vermenigvuldigd met het
      onderbelastewinstbijheffingspercentage voor het verslagjaar, bedoeld in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel5.2
  - number: 5.2.2
    text: |-
      Het bedrag van de totale onderbelastewinstbijheffing over een verslagjaar is gelijk aan de som van de op basis van
      [artikel 8.2][ref1] berekende bedragen aan bijheffing over het verslagjaar voor iedere laagbelaste groepsentiteit
      van de multinationale groep waartoe de belastingplichtige behoort, na toepassing van de correcties, bedoeld in het
      derde en vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 5.2.3
    text: |-
      Indien het volledige belang van de uiteindelijkemoederentiteit in een laagbelaste groepsentiteit, onmiddellijk
      of middellijk, wordt gehouden via een of meer moederentiteiten die verplicht zijn om in het verslagjaar een
      kwalificerende inkomen-inclusiemaatregel toe te passen ter zake van die laagbelaste groepsentiteit, wordt voor
      de berekening van de totale onderbelastewinstbijheffing de bijheffing voor die laagbelaste groepsentiteit gesteld
      op nihil.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel5.2
  - number: 5.2.4
    text: |-
      Indien een deel van het belang van de uiteindelijkemoederentiteit in een laagbelaste groepsentiteit, onmiddellijk
      of middellijk, wordt gehouden via een of meer moederentiteiten die verplicht zijn om in het verslagjaar een
      kwalificerende inkomen-inclusiemaatregel toe te passen ter zake van die laagbelaste groepsentiteit, wordt voor de
      berekening van de totale onderbelastewinstbijheffing de bijheffing voor die laagbelaste groepsentiteit verminderd
      met het aan die moederentiteit, onderscheidenlijk die moederentiteiten, toerekenbare deel van de bijheffing die op
      grond van een kwalificerende inkomen-inclusiemaatregel is geheven ter zake van die laagbelaste groepsentiteit.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel5.2
  - number: 5.2.5
    text: |-
      Het onderbelastewinstbijheffingspercentage voor een verslagjaar bedraagt de som van 50% van de ratio M/N en 50% van
      de ratio A/B, waarbij wordt verstaan onder: M: het totale aantal werknemers, uitgedrukt in voltijdsequivalenten,
      van alle in Nederland gevestigde groepsentiteiten, niet zijnde beleggingsentiteiten, die deel uitmaken van
      de multinationale groep waartoe de belastingplichtige behoort; N: het totale aantal werknemers, uitgedrukt
      in voltijdsequivalenten, van alle groepsentiteiten, niet zijnde beleggingsentiteiten, die deel uitmaken van
      de multinationale groep waartoe de belastingplichtige behoort en die gevestigd zijn in een staat waar een
      kwalificerende onderbelastewinstmaatregel van toepassing is in het verslagjaar; A: de som van de nettoboekwaarde
      van de materiële activa van alle in Nederland gevestigde groepsentiteiten, niet zijnde beleggingsentiteiten,
      die deel uitmaken van de multinationale groep; B: de som van de nettoboekwaarde van de materiële activa van alle
      groepsentiteiten, niet zijnde beleggingsentiteiten, die deel uitmaken van de multinationale groep waartoe de
      belastingplichtige behoort en die gevestigd zijn in een staat waar een kwalificerende onderbelastewinstmaatregel
      van toepassing is in het verslagjaar.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel5.2
  - number: 5.2.6
    text: |-
      Onder werknemers als bedoeld in het vijfde lid worden mede verstaan zelfstandige contractanten, mits zij
      participeren in de reguliere bedrijfsactiviteiten van de groepsentiteit.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel5.2
  - number: 5.2.7
    text: |-
      De materiële activa, bedoeld in het vijfde lid, omvatten de materiële activa van alle in de betreffende staat
      gevestigde groepsentiteiten.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel5.2
  - number: 5.2.8
    text: |-
      Voor de toepassing van het vijfde lid worden werknemers en materiële activa toegerekend aan een vaste inrichting
      voor zover de loonkosten van de werknemers en voor zover de materiële activa zijn opgenomen in de afzonderlijke
      financiële gegevens van die vaste inrichting als bedoeld in [artikel 6.13, eerste tot en met derde lid][ref1]. De
      werknemers en materiële activa die zijn toegerekend aan de vaste inrichting worden niet in aanmerking genomen bij
      de hoofdentiteit van de vaste inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel6
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '6'
        hoofdstuk: '6'
  - number: 5.2.9
    text: |-
      Voor de toepassing van het vijfde lid worden de werknemers en de materiële activa van een doorkijkentiteit slechts
      in aanmerking genomen voor zover deze zijn toegerekend aan een vaste inrichting of, bij afwezigheid van een vaste
      inrichting, aan de groepsentiteiten die zijn gevestigd in de staat waarin de doorkijkentiteit is opgericht.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel5.2
  - number: 5.2.10
    text: |-
      Voor de toepassing van het vijfde lid worden de werknemers en de materiële activa van de in een staat gevestigde
      groepsentiteiten van een multinationale groep in een verslagjaar niet in aanmerking genomen, indien het aan
      die staat toegerekende bedrag aan onderbelastewinstbijheffing van een voorafgaand verslagjaar niet heeft
      geleid tot een additionele contante belastinglast voor die groepsentiteiten die gelijk is aan het bedrag aan
      onderbelastewinstbijheffing dat in dat voorafgaande verslagjaar is toegerekend aan die staat. De eerste zin
      is in een verslagjaar niet van toepassing indien de werknemers en de materiële activa van de groepsentiteiten
      van een multinationale groep voor alle staten met een in dat verslagjaar van toepassing zijnde kwalificerende
      onderbelastewinstmaatregel op basis van die zin in dat verslagjaar buiten aanmerking zouden blijven.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel5.2
  - number: 6.1.1
    text: |-
      Het kwalificerende inkomen of verlies van een groepsentiteit over een verslagjaar wordt bepaald door de correcties,
      bedoeld in de [artikelen 6.2 tot en met 6.14][ref1], toe te passen op de nettowinst of het nettoverlies van de
      groepsentiteit over het verslagjaar vóór de consolidatiecorrecties ter eliminatie van intra-groepstransacties,
      zoals deze nettowinst of dit nettoverlies is vastgesteld volgens de financiële verslaggevingsstandaard die is
      gebruikt bij de totstandkoming van de geconsolideerde jaarrekening van de uiteindelijkemoederentiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel6
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.1.2
    text: |-
      Indien het redelijkerwijs niet mogelijk is om de nettowinst of het nettoverlies van een groepsentiteit over een
      verslagjaar te bepalen volgens de financiële verslaggevingsstandaard die wordt gebruikt bij de totstandkoming van
      de geconsolideerde jaarrekening van de uiteindelijkemoederentiteit, mag voor de toepassing van het eerste lid de
      nettowinst of het nettoverlies van de groepsentiteit over dat verslagjaar ook worden vastgesteld aan de hand van
      een andere geaccepteerde of geautoriseerde financiële verslaggevingsstandaard, mits:
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.1
  - number: 6.1.2.a
    text: |-
      de financiële verslaggeving van de groepsentiteit is opgesteld aan de hand van die andere financiële
      verslaggevingsstandaard;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.1
  - number: 6.1.2.b
    text: de gegevens in de financiële verslaggeving betrouwbaar zijn; en
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.1
  - number: 6.1.2.c
    text: |-
      permanente verschillen van meer dan € 1.000.000 die voortvloeien uit de toepassing van die andere standaard ten
      aanzien van inkomen, uitgaven of transacties gecorrigeerd worden overeenkomstig de voor dat inkomen, die uitgaven
      of die transacties vereiste behandeling volgens de verslaggevingsstandaard die wordt gebruikt bij de totstandkoming
      van de geconsolideerde jaarrekening van de uiteindelijkemoederentiteit.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.1
  - number: 6.1.3
    text: |-
      Indien een groepsentiteit is gevestigd in een staat die een kwalificerende binnenlandse bijheffing toepast, mag de
      nettowinst of het nettoverlies van die groepsentiteit, in afwijking van het eerste en tweede lid, worden bepaald
      in overeenstemming met een geaccepteerde of geautoriseerde financiële verslaggevingsstandaard die afwijkt van de
      financiële verslaggevingsstandaard die wordt gebruikt bij de totstandkoming van de geconsolideerde jaarrekening van
      de uiteindelijkemoederentiteit, mits de gegevens in de financiële verslaggeving ter bepaling van deze nettowinst of
      dit nettoverlies zijn gecorrigeerd om elke vorm van materiële concurrentieverstoring te voorkomen.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.1
  - number: 6.1.4
    text: |-
      Indien de toepassing van een bepaalde grondslag of procedure volgens een set aan algemeen aanvaarde
      verslaggevingsbeginselen leidt tot materiële concurrentieverstoring, wordt voor het bepalen van het kwalificerende
      inkomen of verlies van een groepsentiteit de toepassing van die grondslag of procedure aangepast overeenkomstig
      de vereiste behandeling volgens de internationale standaarden voor financiële verslaglegging IFRS of IFRS zoals
      goedgekeurd door de EU overeenkomstig [Verordening (EG) nr. 1606/2002](32002R1606) van het Europees Parlement en
      de Raad van het Europees Parlement en de Raad van de Europese Unie van 19 juli 2002 betreffende de toepassing van
      internationale standaarden voor jaarrekeningen (PbEG 2002, L 243).
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.1
  - number: 6.2.1
    text: |-
      Voor het bepalen van het kwalificerende inkomen of verlies van een groepsentiteit wordt de nettowinst of het
      nettoverlies van die entiteit gecorrigeerd met het bedrag van de volgende bestanddelen:
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.2
  - number: 6.2.1.a
    text: nettobelastinglast;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.2
  - number: 6.2.1.b
    text: uitgesloten dividend;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.2
  - number: 6.2.1.c
    text: uitgesloten vermogenswinst of -verlies;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.2
  - number: 6.2.1.d
    text: inbegrepen herwaarderingswinst of -verlies;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.2
  - number: 6.2.1.e
    text: |-
      een op grond van [artikel 9.3][ref1] uitgesloten winst of verlies als gevolg van de vervreemding van activa en
      passiva;


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel9
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '9'
        hoofdstuk: '9'
  - number: 6.2.1.f
    text: asymmetrisch valutaresultaat;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.2
  - number: 6.2.1.g
    text: beleidsmatig niet-aftrekbare kosten;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.2
  - number: 6.2.1.h
    text: foutherstel of stelselwijziging ten opzichte van voorgaande periode;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.2
  - number: 6.2.1.i
    text: aangegroeide pensioenlasten;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.2
  - number: 6.2.1.j
    text: voordelen uit het prijsgeven door schuldeisers.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.2
  - number: 6.2.2
    text: |-
      Voor de toepassing van dit artikel wordt verstaan onder: - *nettobelastinglast:* het nettobedrag van de volgende
      bestanddelen: 1°. de belastinglast ter zake van betrokken belastingen, bedoeld in [artikel 7.1][ref1], met
      inbegrip van belastinglasten ter zake van betrokken belastingen op inkomen dat is uitgesloten van de berekening
      van het kwalificerende inkomen of verlies; 2°. actieve belastinglatenties toerekenbaar aan een verlies in een
      verslagjaar; 3°. belastinglasten als gevolg van kwalificerende binnenlandse bijheffingen; 4°. belastinglasten als
      gevolg van de toepassing van [Richtlijn (EU) 2022/2523](32022L2523) of, met betrekking tot derde staten, als gevolg
      van de toepassing van de OESO-modelregels; 5°. belastinglasten ter zake van niet-kwalificerende restitueerbare
      imputatiebelastingen;
        - *uitgesloten dividend:* een dividenduitkering of een andere uitkering uit hoofde van een belang in een
      entiteit, ontvangen of toegerekend aan het verslagjaar, tenzij dat belang op het moment van ontvangst of
      toerekening kwalificeert als: 1°. een portfoliobelang, dat op het moment van de uitkering gedurende minder dan
      een aaneengesloten periode van een jaar economisch eigendom is van de groepsentiteit die de dividenduitkering of
      de andere uitkering ontvangt of krijgt toegerekend; 2°. een belang in een beleggingsentiteit ter zake waarvan is
      gekozen voor toepassing van [artikel 10.6][ref2];
        - *uitgesloten vermogenswinst of -verlies:* een nettovermogenswinst of nettovermogensverlies begrepen in de
      nettowinst of het nettoverlies van een groepsentiteit als gevolg van: 1°. winsten of verliezen die voortvloeien
      uit wijzigingen in de reële waarde van een belang, niet zijnde een portfoliobelang, tenzij de informatieaangifte-
      indienende groepsentiteit ervoor kiest om ten aanzien van de groepsentiteiten in een staat de nettowinst of het
      nettoverlies niet te corrigeren met die winsten of verliezen; 2°. winsten of verliezen die voortvloeien uit een
      belang dat is opgenomen in de financiële verslaggeving met toepassing van de nettovermogenswaardemethode, tenzij
      de informatieaangifte-indienende groepsentiteit ervoor kiest om ten aanzien van de groepsentiteiten in een staat
      de nettowinst of het nettoverlies niet te corrigeren met die winsten of verliezen; 3°. winsten of verliezen
      die voortvloeien uit het niet langer aanwezig zijn van een belang, niet zijnde een portfoliobelang, tenzij de
      informatieaangifte-indienende groepsentiteit ervoor kiest om ten aanzien van de groepsentiteiten in een staat
      de nettowinst of het nettoverlies niet te corrigeren met die winsten of verliezen; 4°. valutaresultaten die
      voortvloeien uit financiële instrumenten ter afdekking van een valutarisico dat met een belang wordt gelopen,
      mits de informatieaangifte-indienende groepsentiteit ervoor kiest om de nettowinst of het nettoverlies van die
      groepsentiteit te corrigeren met die valutaresultaten;
        - *inbegrepen herwaarderingswinst of -verlies:* een winst of een verlies verminderd, onderscheidenlijk vermeerderd,
      met de met deze winst of dit verlies samenhangende betrokken belastingen over het verslagjaar, als gevolg van
      de toepassing van een verslaggevingsmethode of verslaggevingspraktijk ter zake van alle materiële vaste activa,
      op grond waarvan: 1°. de boekwaarde periodiek wordt aangepast aan de reële waarde; 2°. de winst of het verlies
      rechtstreeks in het eigen vermogen wordt verwerkt; en 3°. die winst of dat verlies in een volgend verslagjaar niet
      in de winst- en verliesrekening wordt verwerkt;
        - *asymmetrisch valutaresultaat:* een valutawinst of valutaverlies van een entiteit waarvan de financiële
      verslaggevingsvaluta en fiscale valuta verschillen en welke winst of welk verlies: 1°. in aanmerking is genomen
      bij de berekening van de belastbare winst van een groepsentiteit en toerekenbaar is aan wisselkoersfluctuaties
      tussen de financiële verslaggevingsvaluta en de fiscale valuta van die groepsentiteit; 2°. in aanmerking is
      genomen bij de berekening van de nettowinst of het nettoverlies van een groepsentiteit en toerekenbaar is aan
      wisselkoersfluctuaties tussen de financiële verslaggevingsvaluta en de fiscale valuta van die groepsentiteit;
      3°. in aanmerking is genomen bij de berekening van de nettowinst of het nettoverlies van een groepsentiteit en
      toerekenbaar is aan wisselkoersfluctuaties tussen een buitenlandse valuta en de financiële verslaggevingsvaluta van
      die groepsentiteit; of 4°. toerekenbaar is aan wisselkoersfluctuaties tussen een buitenlandse valuta en de fiscale
      valuta van die groepsentiteit, ongeacht of dergelijke valutawinsten of -verliezen deel uitmaken van de belastbare
      winst;
        - *beleidsmatig niet-aftrekbare kosten:* kosten opgekomen bij een groepsentiteit voor: 1°. illegale betalingen,
      waaronder steekpenningen en smeergeld; 2°. boetes en sancties van € 50.000 of meer, of een daaraan gelijk bedrag in
      de functionele valuta waarin de nettowinst of het nettoverlies is berekend;
        - *foutherstel of stelselwijziging ten opzichte van voorgaande periode:* een wijziging in het beginvermogen van
      een groepsentiteit bij de aanvang van een verslagjaar als gevolg van: 1°. herstel van een fout bij het bepalen
      van de nettowinst of het nettoverlies in een voorgaand verslagjaar, welke fout de inkomsten of uitgaven die in
      aanmerking kunnen worden genomen bij de berekening van het kwalificerende inkomen of verlies in dat voorgaande
      verslagjaar heeft beïnvloed, behoudens voor zover een dergelijke wijziging leidt tot een materiële vermindering
      van een verplichting voor betrokken belastingen op grond van [artikel 7.6][ref3]; 2°. een wijziging in de
      verslaggevingsstandaarden of het verslaggevingsbeleid die de inkomsten of uitgaven begrepen in de berekening van
      het kwalificerende inkomen of verlies in een voorgaand verslagjaar heeft beïnvloed;
        - *aangegroeide pensioenlasten:* het verschil tussen het bedrag aan pensioenlasten dat in een verslagjaar is
      betrokken in de bepaling van de nettowinst of het nettoverlies en het bedrag dat in dat verslagjaar aan een
      pensioenfonds is afgedragen;
        - *voordelen uit het prijsgeven door schuldeisers:* een voordeel uit het prijsgeven van een schuldvordering,
      mits de informatieaangifte-indienende groepsentiteit ervoor kiest om de nettowinst of het nettoverlies van
      een groepsentiteit te corrigeren met dat voordeel, welk voordeel: 1°. voortvloeit uit een bij wet voorziene
      insolventie- of faillissementsprocedure die onder toezicht staat van een rechterlijke instantie, een curator of een
      daarmee vergelijkbare persoon; 2°. voortvloeit uit een overeenkomst waarbij ten minste één van de schuldeisers niet
      gelieerd is aan de schuldenaar mits aannemelijk is dat de schuldenaar binnen een periode van twaalf maanden na het
      sluiten van die overeenkomst niet meer in staat zou zijn 3°. wordt toegekend indien de totale schulden de waarde
      in het economische verkeer van de activa op het moment onmiddellijk voorafgaand aan het prijsgeven van die schuld
      overtreffen en voor zover de schulden niet zijn aangegaan bij een met de schuldenaar verbonden persoon, waarbij
      het voordeel niet meer bedraagt dan het verschil tussen die schulden en de waarde in het economische verkeer van de
      activa dan wel, indien dat lager is, het bedrag van de als gevolg van het prijsgeven ontstane


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0049111#Artikel7
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.2
