  - number: 6.2.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld ten aanzien van de voorwaarden waaronder
      de informatieaangifte-indienende groepsentiteit ervoor kan kiezen om de nettowinst of het nettoverlies niet te
      corrigeren met de winsten of verliezen, bedoeld in het tweede lid, onderdeel c, onder 1° tot en met 3°.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.2
  - number: 6.2.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld ten aanzien van de voorwaarden waaronder de
      informatieaangifte-indienende groepsentiteit ervoor kan kiezen 21 om valutaresultaten als bedoeld in het tweede
      lid, onderdeel c, onder 4°, aan te merken als een uitgesloten vermogenswinst of -verlies.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.2
  - number: 6.2.5
    text: |-
      Indien de informatieaangifte-indienende groepsentiteit daarvoor in overeenstemming met
      [artikel 13.2, eerste lid][ref1], kiest, worden in afwijking van het tweede lid, onderdeel b, dividenden die een
      groepsentiteit ontvangt uit hoofde van al haar portfoliobelangen niet aangemerkt als uitgesloten dividend.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel13
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '13'
        hoofdstuk: '13'
  - number: 6.2.6
    text: |-
      Voor de toepassing van het tweede lid, onderdelen b en c, en het vijfde lid, wordt verstaan onder portfoliobelang:
      een door de multinationale groep gehouden belang in een entiteit dat recht geeft op minder dan 10% van de winsten,
      het kapitaal of de reserves van, of de stemrechten in, die entiteit.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.2
  - number: 6.3.1
    text: |-
      Voor het bepalen van het kwalificerende inkomen of verlies kan de informatieaangifte-indienende groepsentiteit
      er overeenkomstig [artikel 13.2, eerste lid][ref1], voor alle groepsentiteiten gevestigd in dezelfde staat voor
      kiezen om het bedrag dat in de financiële verslaggeving van die groepsentiteiten als kosten voor een op aandelen
      gebaseerde betaling in mindering is gebracht op de nettowinst of het nettoverlies voor die groepsentiteiten te
      vervangen door het bedrag dat voor die betaling als kosten in mindering mag worden gebracht bij de berekening van
      de belastbare winst.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel13
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '13'
        hoofdstuk: '13'
  - number: 6.3.2
    text: |-
      Indien een optie om aandelen te verkrijgen niet wordt uitgeoefend, wordt voor het bepalen van het kwalificerende
      inkomen of verlies van een groepsentiteit het bedrag aan kosten voor een op aandelen gebaseerde betaling dat in een
      voorgaand verslagjaar ter zake van die optie in mindering is gebracht op de nettowinst of het nettoverlies van die
      groepsentiteit, in het verslagjaar waarin deze optie vervalt, opgeteld bij het kwalificerende inkomen of verlies
      van die groepsentiteit.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.3
  - number: 6.3.3
    text: |-
      Indien een deel van het bedrag aan aftrekbare kosten voor op aandelen gebaseerde betalingen is opgenomen in de
      financiële verslaggeving van een groepsentiteit in verslagjaren voorafgaand aan het verslagjaar waarin voor de
      toepassing van het eerste lid is gekozen, wordt een bedrag gelijk aan het verschil tussen het volledige bedrag
      aan aftrekbare kosten voor op aandelen gebaseerde betalingen dat in mindering is gebracht bij het bepalen van het
      kwalificerende inkomen of verlies in die voorafgaande verslagjaren en het volledige bedrag dat in mindering zou
      zijn gebracht bij het bepalen van het kwalificerende inkomen of verlies in die voorafgaande verslagjaren indien
      in die jaren voor de toepassing van het eerste lid zou zijn gekozen, in aanmerking genomen bij het bepalen van het
      kwalificerende inkomen of verlies van die groepsentiteit in het verslagjaar waarin de keuze is gemaakt.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.3
  - number: 6.3.4
    text: |-
      In het verslagjaar waarin de keuze overeenkomstig [artikel 13.2, eerste lid][ref1], wordt herroepen, wordt het
      bedrag aan onbetaalde kosten voor op aandelen gebaseerde betalingen dat op grond van het eerste lid in mindering
      is gebracht op de nettowinst of het nettoverlies van een groepsentiteit, voor zover dat bedrag de kosten die
      voor die betalingen zijn opgenomen in de financiële verslaggeving te boven gaat, opgeteld bij het bepalen van het
      kwalificerende inkomen of verlies van die groepsentiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel13
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '13'
        hoofdstuk: '13'
  - number: 6.4.1
    text: |-
      Voor het bepalen van het kwalificerende inkomen of verlies van een groepsentiteit wordt elke transactie tussen
      groepsentiteiten die zijn gevestigd in verschillende staten die niet voor hetzelfde bedrag is opgenomen in de
      financiële verslaggeving van die groepsentiteiten, of die niet in overeenstemming is met het arm’s-lengthbeginsel,
      gecorrigeerd, zodat het bedrag bij beide groepsentiteiten hetzelfde is en in overeenstemming is met het arm’s-
      lengthbeginsel.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.4
  - number: 6.4.2
    text: |-
      Een verlies op een overdracht van een activum tussen twee groepsentiteiten die zijn gevestigd in dezelfde
      staat wordt gecorrigeerd op basis van het arm’s-lengthbeginsel indien dat verlies in aanmerking is genomen bij
      de berekening van het kwalificerende inkomen of verlies en dat verlies in de financiële verslaggeving niet is
      opgenomen in overeenstemming met het arm’s-lengthbeginsel.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.4
  - number: 6.4.3
    text: |-
      Voor de toepassing van dit artikel wordt onder het arm’s-lengthbeginsel verstaan: het beginsel op basis waarvan
      transacties tussen groepsentiteiten voor belastingdoeleinden in aanmerking worden genomen op basis van voorwaarden
      die door onafhankelijke ondernemingen bij vergelijkbare transacties onder vergelijkbare omstandigheden zouden zijn
      overeengekomen.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.4
  - number: '6.5'
    text: |-
      Voor het bepalen van het kwalificerende inkomen of verlies van een groepsentiteit worden kwalificerende
      restitueerbare belastingtegoeden aangemerkt als inkomen en worden niet-kwalificerende restitueerbare
      belastingtegoeden niet aangemerkt als inkomen.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.5
  - number: 6.6.1
    text: |-
      Indien de informatieaangifte-indienende groepsentiteit daarvoor in overeenstemming met
      [artikel 13.2, eerste lid][ref1], kiest, worden winsten en verliezen op activa en passiva die in de
      geconsolideerde jaarrekening voor een verslagjaar worden gewaardeerd op reële waarde bij het bepalen van het
      kwalificerende inkomen of verlies van een groepsentiteit in aanmerking genomen op basis van het realisatiebeginsel.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel13
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '13'
        hoofdstuk: '13'
  - number: 6.6.2
    text: |-
      Voor de toepassing van het eerste lid wordt voor het bepalen van de winst of het verlies bij realisatie de
      boekwaarde van een activum of passivum gesteld op de boekwaarde op het laatste van de volgende tijdstippen:
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.6
  - number: 6.6.2.a
    text: het tijdstip waarop het activum is verkregen of het passivum is ontstaan; of
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.6
  - number: 6.6.2.b
    text: de eerste dag van het verslagjaar waarvoor de keuze is gemaakt.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.6
  - number: 6.6.3
    text: |-
      De keuze, bedoeld in het eerste lid, is van toepassing op de activa en passiva van alle in een staat gevestigde
      groepsentiteiten, tenzij de informatieaangifte-indienende groepsentiteit ervoor kiest om de keuze te beperken tot
      de materiële activa van alle in een staat gevestigde groepsentiteiten, dan wel tot de activa en passiva van alle in
      een staat gevestigde beleggingsentiteiten.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.6
  - number: 6.6.4
    text: |-
      Indien voor enig verslagjaar de keuze overeenkomstig [artikel 13.2, eerste lid][ref1], wordt herroepen, wordt voor
      het bepalen van het kwalificerende inkomen of verlies van de groepsentiteiten waarvoor de keuze in het voorafgaande
      verslagjaar gold een bedrag gelijk aan het verschil tussen de reële waarde en de boekwaarde van de activa of
      passiva, welk verschil wordt bepaald op de eerste dag van het verslagjaar waarvoor de keuze wordt herroepen, in
      aanmerking genomen bij de bepaling van het kwalificerende inkomen of verlies van die groepsentiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel13
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '13'
        hoofdstuk: '13'
  - number: 6.7.1
    text: |-
      Indien de informatieaangifte-indienende groepsentiteit daarvoor in overeenstemming met
      [artikel 13.2, tweede lid][ref1], kiest, wordt de winst of het verlies van die groepsentiteiten welke in een
      verslagjaar is behaald met de vervreemding van lokale vaste activa door die groepsentiteiten aan personen of
      entiteiten die geen groepsentiteiten zijn, verrekend volgens de regels van het tweede tot en met vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel13
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.7
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '13'
        hoofdstuk: '13'
  - number: 6.7.2
    text: |-
      De nettovervreemdingswinst uit de vervreemding van lokale vaste activa door alle groepsentiteiten die
      zijn gevestigd in dezelfde staat in het verslagjaar waarvoor de keuze geldt, wordt verrekend met het
      nettovervreemdingsverlies uit de vervreemding van lokale vaste activa door die groepsentiteiten in de
      vijfjaarsperiode, bestaande uit dat verslagjaar en de vier daaraan voorafgaande verslagjaren, in de volgorde waarin
      die verliezen zijn ontstaan.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.7
  - number: 6.7.3
    text: |-
      Indien na de toepassing van het tweede lid een bedrag aan nettovervreemdingswinst resteert, wordt dit bedrag voor
      de berekening van het kwalificerende inkomen of verlies van iedere in de staat gevestigde groepsentiteit die een
      nettovervreemdingswinst heeft behaald met de vervreemding van lokale vaste activa in het verslagjaar waarvoor de
      keuze geldt, gelijkelijk verdeeld over de vijfjaarsperiode en toegerekend aan die entiteiten aan de hand van de
      verhouding van de nettovervreemdingswinst van een groepsentiteit ten opzichte van de nettovervreemdingswinst van
      alle groepsentiteiten in dat verslagjaar.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.7
  - number: 6.7.4
    text: |-
      Indien het derde lid niet kan worden toegepast omdat de met de vervreemding van lokale vaste activa behaalde
      nettovervreemdingswinst in een staat in het verslagjaar waarvoor de keuze geldt is behaald door één groepsentiteit,
      wordt het na de toepassing van het tweede lid resterende bedrag aan nettovervreemdingswinst voor de berekening
      van het kwalificerende inkomen of verlies van iedere in de staat gevestigde groepsentiteit toegerekend aan alle
      groepsentiteiten in die staat in dat verslagjaar en gelijkelijk verdeeld over de vijfjaarsperiode.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.7
  - number: 6.7.5
    text: |-
      Op elke aanpassing van het kwalificerende inkomen of verlies op grond van dit artikel voor de verslagjaren
      voorafgaand aan het verslagjaar waarvoor de keuze geldt, is [artikel 8.4, eerste lid][ref1], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.7
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 6.7.6
    text: |-
      Voor de toepassing van dit artikel wordt onder lokale vaste activa verstaan: onroerende zaken die zijn gelegen in
      de staat waarin de groepsentiteit die de onroerende zaken vervreemdt is gevestigd.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.7
  - number: '6.8'
    text: |-
      Kosten die betrekking hebben op een intra-groepsfinancieringsregeling waarbij een groepsentiteit financiering
      verstrekt aan een of meer andere groepsentiteiten van dezelfde multinationale groep worden niet in aanmerking
      genomen bij het bepalen van het kwalificerende inkomen of verlies van een groepsentiteit die de financiering
      ontvangt, indien:
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.8
  - number: 6.8.a
    text: |-
      die groepsentiteit is gevestigd in een laagbelastende staat of in een staat die als laagbelastend zou worden
      aangemerkt indien de kosten niet in aanmerking zouden worden genomen bij het bepalen van het kwalificerende inkomen
      of verlies van die groepsentiteit;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.8
  - number: 6.8.b
    text: |-
      redelijkerwijs kan worden aangenomen dat, gedurende de verwachte looptijd van de intra-groepsfinancieringsregeling,
      de kosten leiden tot een afname van het kwalificerende inkomen of een toename van het kwalificerende verlies van
      die groepsentiteit terwijl daar niet een even hoge toename van de belastbare winst van de groepsentiteit die de
      financiering verstrekt tegenover staat; en
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.8
  - number: 6.8.c
    text: |-
      de groepsentiteit die de financiering verstrekt is gevestigd in een staat die niet als laagbelastende staat wordt
      aangemerkt of niet als zodanig zou worden aangemerkt indien het inkomen dat verband houdt met de kosten niet bij
      die groepsentiteit in aanmerking zou zijn genomen bij het bepalen van het kwalificerende inkomen of verlies van
      die groepsentiteit.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.8
  - number: 6.9.1
    text: |-
      Voor het bepalen van het kwalificerende inkomen of verlies van groepsentiteiten die gevestigd zijn in dezelfde
      staat en betrokken zijn in een fiscale groepsregeling kan de informatieaangifte-indienende groepsentiteit
      er overeenkomstig [artikel 13.2, eerste lid][ref1], voor kiezen om een geconsolideerde grondslag toe te
      passen ten aanzien van inkomsten, uitgaven, winsten en verliezen die voortvloeien uit transacties tussen deze
      groepsentiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel13
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.9
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '13'
        hoofdstuk: '13'
  - number: 6.9.2
    text: |-
      In het verslagjaar waarin de keuze wordt gemaakt of overeenkomstig [artikel 13.2, eerste lid][ref1], wordt
      herroepen, worden passende correcties aangebracht om te voorkomen dat bestanddelen van het kwalificerende inkomen
      of verlies niet, of meer dan een keer, in aanmerking worden genomen als gevolg van die keuze of herroeping.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel13
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.9
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '13'
        hoofdstuk: '13'
  - number: 6.10.1
    text: |-
      Voor het bepalen van het kwalificerende inkomen of verlies van een verzekeringsmaatschappij blijft buiten
      aanmerking de bij polishouders in rekening gebrachte en door de verzekeringsmaatschappij betaalde belasting ten
      aanzien van uitkeringen aan polishouders.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.10
  - number: 6.10.2
    text: |-
      Voor het bepalen van het kwalificerende inkomen of verlies van een verzekeringsmaatschappij worden alle opbrengsten
      voor de polishouders die niet zijn opgenomen in de nettowinst of het nettoverlies in aanmerking genomen, voor zover
      de corresponderende toename of afname in de verplichtingen aan de polishouders is opgenomen in de nettowinst of
      het nettoverlies.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.10
  - number: '6.11'
    text: 'Voor het bepalen van het kwalificerende inkomen of verlies van een groepsentiteit wordt:'
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.11
  - number: 6.11.a
    text: |-
      elk bedrag dat is geboekt als een afname van het eigen vermogen van die groepsentiteit als gevolg van uitkeringen
      die zijn gedaan of verschuldigd met betrekking tot aanvullend tier 1-kapitaal dat is uitgegeven door die
      groepsentiteit aangemerkt als aftrekbare kosten;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.11
  - number: 6.11.b
    text: |-
      elk bedrag dat is geboekt als een toename van het eigen vermogen van die groepsentiteit als gevolg van
      uitkeringen die zijn of worden ontvangen met betrekking tot aanvullend tier 1-kapitaal dat wordt gehouden door een
      groepsentiteit aangemerkt als inkomen.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.11
  - number: 6.12.1
    text: |-
      Voor het bepalen van het kwalificerende inkomen of verlies van een groepsentiteit blijft het inkomen uit
      internationale scheepvaart en het inkomen uit gekwalificeerde nevenactiviteiten in de internationale scheepvaart
      van die groepsentiteit buiten aanmerking indien die groepsentiteit aannemelijk maakt dat het strategische of
      commerciële beheer van alle betrokken schepen feitelijk wordt verricht vanuit de staat waarin zij is gevestigd.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.12
  - number: 6.12.2
    text: |-
      Indien de berekening van het door een groepsentiteit behaalde inkomen uit internationale scheepvaart of inkomen uit
      gekwalificeerde nevenactiviteiten in de internationale scheepvaart resulteert in een verlies, blijft dat verlies
      buiten aanmerking bij het bepalen van het kwalificerende inkomen of verlies van die groepsentiteit.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.12
  - number: 6.12.3
    text: |-
      Voor de toepassing van het eerste lid bedraagt het inkomen uit gekwalificeerde nevenactiviteiten in de
      internationale scheepvaart van alle in een staat gevestigde groepsentiteiten ten hoogste 50% van het inkomen uit
      internationale scheepvaart van deze groepsentiteiten.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.12
  - number: 6.12.4
    text: |-
      Voor het bepalen van het inkomen uit internationale scheepvaart en het inkomen uit gekwalificeerde
      nevenactiviteiten in de internationale scheepvaart komen in aftrek de door een groepsentiteit gemaakte kosten die
      rechtstreeks toerekenbaar zijn aan haar activiteiten in de internationale scheepvaart, bedoeld in het zevende lid,
      onderdeel a, en gekwalificeerde nevenactiviteiten in de internationale scheepvaart, bedoeld in het zevende lid,
      onderdeel b.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.12
  - number: 6.12.5
    text: |-
      Voor het bepalen van het inkomen uit internationale scheepvaart en het inkomen uit gekwalificeerde
      nevenactiviteiten in de internationale scheepvaart komen de door een groepsentiteit gemaakte kosten die indirect
      voortvloeien uit haar activiteiten in de internationale scheepvaart, onderscheidenlijk haar gekwalificeerde
      nevenactiviteiten in de internationale scheepvaart, in aftrek naar de verhouding waarin haar inkomen uit die
      activiteiten, onderscheidenlijk nevenactiviteiten, staat tot haar totale inkomen.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.12
  - number: 6.12.6
    text: |-
      Alle directe en indirecte kosten die overeenkomstig het vierde en vijfde lid worden toegerekend aan het inkomen uit
      internationale scheepvaart en het inkomen uit gekwalificeerde nevenactiviteiten in de internationale scheepvaart
      van een groepsentiteit worden uitgesloten van de berekening van het kwalificerende inkomen of verlies van die
      groepsentiteit.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.12
  - number: 6.12.7
    text: |-
      Voor de toepassing van dit artikel wordt verstaan onder: - *inkomen uit internationale scheepvaart:* het door
      een groepsentiteit behaalde netto-inkomen uit de volgende activiteiten, waarbij het vervoer niet plaatsvindt
      via binnenwateren in dezelfde staat: 1°. vervoer van passagiers of vracht per schip in het internationale
      verkeer, ongeacht of het schip eigendom is van, geleased wordt door of anderszins ter beschikking staat van de
      groepsentiteit; 2°. vervoer van passagiers of vracht per schip in het internationale verkeer op basis van een
      slotcharterovereenkomst; 3°. leasing van een schip dat wordt gebruikt voor vervoer van passagiers of vracht in
      het internationale verkeer op basis van charter met volledige uitrusting, bemanning en bevoorrading; 4°. leasing
      van een schip aan een andere groepsentiteit, indien dat schip wordt gebruikt voor het vervoer van passagiers of
      vracht in het internationale verkeer, op basis van rompbevrachting; 5°. participatie in een poolovereenkomst, een
      gemeenschappelijke onderneming of een internationaal opererend agentschap voor het vervoer van passagiers of vracht
      per schip in het internationale verkeer; en 6°. verkoop van een schip dat wordt gebruikt voor het vervoer van
      passagiers of vracht in het internationale verkeer, mits het schip gedurende ten minste één jaar voor gebruik is
      aangehouden door de groepsentiteit;
        - *inkomen uit gekwalificeerde nevenactiviteiten in de internationale scheepvaart:* het door een groepsentiteit
      behaalde netto-inkomen uit de volgende activiteiten, mits die activiteiten hoofdzakelijk worden verricht in
      verband met het vervoer van passagiers of vracht per schip in het internationale verkeer: 1°. leasing van een
      schip, op basis van rompbevrachting aan een andere scheepvaartonderneming die geen groepsentiteit is, mits
      de charterovereenkomst niet langer dan drie jaar duurt; 2°. verkoop van door andere scheepvaartondernemingen
      uitgegeven vervoersbewijzen voor het binnenlandse deel van een internationale reis; 3°. leasing en kortdurende
      opslag van containers of overligkosten voor vertraagde retour van containers; 4°. dienstverlening aan andere
      scheepvaartondernemingen door technici, onderhoudspersoneel, vrachtbehandelaars, cateringpersoneel en personeel
      voor klantenservice; en 5°. investeringen die integraal zijn verricht voor het drijven van een onderneming
      bestaande uit de exploitatie van schepen in het internationale verkeer.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.12
  - number: 6.13.1
    text: |-
      Indien een groepsentiteit een vaste inrichting is als bedoeld in de onderdelen a, b of c van de definitie van vaste
      inrichting in [artikel 1.2, eerste lid][ref1], is de nettowinst of het nettoverlies van die vaste inrichting de
      nettowinst of het nettoverlies volgens de afzonderlijke financiële verslaggeving van die vaste inrichting. Indien
      die vaste inrichting geen afzonderlijke financiële verslaggeving bijhoudt, is de nettowinst of het nettoverlies
      van die vaste inrichting de nettowinst of het nettoverlies zoals die winst of dat verlies uit de afzonderlijke
      financiële verslaggeving van die vaste inrichting zou blijken indien die vaste inrichting een dergelijke
      verslaggeving zou bijhouden in overeenstemming met de financiële verslaggevingsstandaarden die als uitgangspunt
      dienen bij het opstellen van de geconsolideerde jaarrekening van de uiteindelijkemoederentiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel1
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.13
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '1'
        hoofdstuk: '1'
  - number: 6.13.2
    text: |-
      Indien een groepsentiteit een vaste inrichting is als bedoeld in de onderdelen a of b van de definitie van
      vaste inrichting in [artikel 1.2, eerste lid][ref1], komen in de nettowinst of het nettoverlies van die vaste
      inrichting enkel het inkomen en de kosten tot uitdrukking die in overeenstemming met het van toepassing zijnde
      belastingverdrag of de nationale fiscale wetgeving van de staat waarin die vaste inrichting is gelegen aan die
      vaste inrichting kunnen worden toegerekend, ongeacht het bedrag aan inkomen dat is onderworpen aan belastingheffing
      en het bedrag aan aftrekbare kosten in die staat.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel1
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.13
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '1'
        hoofdstuk: '1'
  - number: 6.13.3
    text: |-
      Indien een groepsentiteit een vaste inrichting is als bedoeld in onderdeel c van de definitie van vaste inrichting
      in [artikel 1.2, eerste lid][ref1], komen in de nettowinst of het nettoverlies van die vaste inrichting enkel het
      inkomen en de kosten tot uitdrukking die in overeenstemming met artikel 7 van het OESO-modelverdrag aan die vaste
      inrichting toerekenbaar zouden zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel1
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.13
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '1'
        hoofdstuk: '1'
  - number: 6.13.4
    text: |-
      Indien een groepsentiteit een vaste inrichting is als bedoeld in onderdeel d van de definitie van vaste inrichting
      in [artikel 1.2, eerste lid][ref1], wordt de nettowinst of het nettoverlies van die vaste inrichting bepaald aan
      de hand van het inkomen dat van belastingheffing is vrijgesteld in de staat waarin de hoofdentiteit is gevestigd
      en toerekenbaar is aan buiten die staat verrichte activiteiten, en de kosten die voor belastingdoeleinden niet in
      aftrek komen in de staat waarin de hoofdentiteit is gevestigd en toerekenbaar zijn aan buiten die staat verrichte
      activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel1
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.13
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '1'
        hoofdstuk: '1'
  - number: 6.13.5
    text: |-
      De nettowinst of het nettoverlies van een vaste inrichting wordt niet in aanmerking genomen bij het bepalen van het
      kwalificerende inkomen of verlies van de hoofdentiteit, behalve voor de toepassing van het zesde lid.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.13
  - number: 6.13.6
    text: |-
      Een nettoverlies van een vaste inrichting wordt voor de berekening van het kwalificerende inkomen of verlies van de
      hoofdentiteit aangemerkt als een last, voor zover het betreffende verlies van de vaste inrichting wordt aangemerkt
      als een last bij de berekening van de belastbare winst van de hoofdentiteit en dat verlies niet wordt verrekend
      met de belastbare winst van de hoofdentiteit en van de vaste inrichting. De nettowinst van de vaste inrichting
      die opkomt nadat de eerste zin toepassing heeft gevonden, wordt aangemerkt als kwalificerend inkomen van de
      hoofdentiteit tot het bedrag van het kwalificerende verlies dat in enig voorgaand jaar op grond van de vorige zin
      is aangemerkt als een last van de hoofdentiteit.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.13
  - number: 6.14.1
    text: |-
      De nettowinst of het nettoverlies van een groepsentiteit die een doorkijkentiteit is, wordt verminderd met het
      deel van die nettowinst of dat nettoverlies dat toerekenbaar is aan de belanghouders van die entiteit die geen
      deel uitmaken van de groep en die hun belang in de doorkijkentiteit onmiddellijk of door middel van een fiscaal
      transparante structuur houden, tenzij die doorkijkentiteit:
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.14
  - number: 6.14.1.a
    text: een uiteindelijkemoederentiteit is; of
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.14
  - number: 6.14.1.b
    text: |-
      onmiddellijk of door middel van een fiscaal transparante structuur wordt gehouden door een
      uiteindelijkemoederentiteit als bedoeld in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.14
  - number: 6.14.2
    text: |-
      Het na de toepassing van het eerste lid resterende bedrag aan nettowinst of nettoverlies van een doorkijkentiteit
      die haar onderneming geheel of gedeeltelijk uitoefent door middel van een vaste inrichting, wordt in
      overeenstemming met [artikel 6.13][ref1] toegerekend aan die vaste inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel6
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.14
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.14.3
    text: |-
      Het na de toepassing van het eerste en tweede lid resterende bedrag aan nettowinst of nettoverlies van een
      doorkijkentiteit die een fiscaal transparante entiteit is en die niet de uiteindelijkemoederentiteit is, wordt
      toegerekend aan de groepsentiteit-belanghouders in overeenstemming met hun belang in de doorkijkentiteit.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.14
  - number: 6.14.4
    text: |-
      Het na de toepassing van het eerste en tweede lid resterende bedrag aan nettowinst of nettoverlies van een
      doorkijkentiteit die een fiscaal transparante entiteit is en die de uiteindelijkemoederentiteit is, of die een
      omgekeerde hybride entiteit is, wordt toegerekend aan die uiteindelijkemoederentiteit, onderscheidenlijk die
      omgekeerde hybride entiteit.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.14
  - number: 6.14.5
    text: Het tweede, derde, en vierde lid worden afzonderlijk toegepast ten aanzien van ieder belang in de doorkijkentiteit.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.14
  - number: 6.14.6
    text: |-
      De nettowinst of het nettoverlies van een groepsentiteit die een doorkijkentiteit is, wordt verminderd met de
      nettowinst die, of het nettoverlies dat, wordt toegerekend aan een andere groepsentiteit.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel6.14
  - number: 7.1.1
    text: 'Deze wet verstaat onder de betrokken belastingen van een groepsentiteit:'
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.1
  - number: 7.1.1.a
    text: |-
      de in de financiële verslaggeving opgenomen belastinglast over het inkomen of de winst van de groepsentiteit zelf,
      of over het deel van het inkomen of de winst van een andere groepsentiteit voor zover de groepsentiteit daarin een
      belang heeft;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.1
  - number: 7.1.1.b
    text: |-
      belastingen die volgens een in aanmerking komend uitdelingsbelastingstelsel worden geheven over uitgedeelde
      winsten, veronderstelde uitdelingen en niet-zakelijke kosten;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.1
  - number: 7.1.1.c
    text: belastingen die worden geheven ter vervanging van een algemeen toepasbare winstbelasting; en
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.1
  - number: 7.1.1.d
    text: |-
      belastingen die worden geheven op basis van ingehouden winst en eigen vermogen, waaronder belastingen op meerdere
      onderdelen op basis van inkomen en eigen vermogen.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.1
  - number: 7.1.2
    text: 'Onder de betrokken belastingen van een groepsentiteit worden niet verstaan:'
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.1
  - number: 7.1.2.a
    text: de aan een moederentiteit toegerekende bijheffing op grond van een kwalificerende inkomen-inclusiemaatregel;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.1
  - number: 7.1.2.b
    text: de aan een groepsentiteit toegerekende bijheffing op grond van een kwalificerende binnenlandse bijheffing;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.1
  - number: 7.1.2.c
    text: de aan een groepsentiteit toegerekende bijheffing op grond van een kwalificerende onderbelastewinstmaatregel;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.1
  - number: 7.1.2.d
    text: een niet-kwalificerende restitueerbare imputatiebelasting; en
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.1
  - number: 7.1.2.e
    text: door een verzekeringsmaatschappij betaalde belastingen met betrekking tot teruggaven aan polishouders.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.1
  - number: 7.1.3
    text: |-
      In het verslagjaar waarin de keuze, bedoeld in [artikel 6.7, eerste lid][ref1], toepassing vindt, worden
      betrokken belastingen met betrekking tot een nettovervreemdingswinst of nettovervreemdingsverlies als gevolg van
      de vervreemding van lokale vaste activa als bedoeld in artikel 6.7, zesde lid niet in aanmerking genomen bij de
      berekening van de betrokken belastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel6
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '6'
        hoofdstuk: '6'
  - number: 7.2.1
    text: |-
      De gecorrigeerde betrokken belastingen van een groepsentiteit voor een verslagjaar worden bepaald door het
      bedrag van de acute belastinglast dat bij de bepaling van de nettowinst of het nettoverlies in het verslagjaar in
      aanmerking is genomen ter zake van betrokken belastingen te corrigeren met:
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.2
  - number: 7.2.1.a
    text: |-
      het saldobedrag van de vermeerderingen en verminderingen van de betrokken belastingen voor het verslagjaar, bedoeld
      in het tweede en derde lid;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.2
  - number: 7.2.1.b
    text: |-
      het totale bedrag van de gecorrigeerde mutaties in belastinglatenties, bedoeld in [artikel 7.3][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel7
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.2.1.c
    text: |-
      elke toename of afname van betrokken belastingen die rechtstreeks in het eigen vermogen is verwerkt en betrekking
      heeft op bedragen die in aanmerking zijn genomen bij de bepaling van het kwalificerende inkomen of verlies dat is
      onderworpen aan belastingheffing op grond van belastingwetgeving van een staat.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.2
  - number: 7.2.2
    text: 'De vermeerderingen van de betrokken belastingen van een groepsentiteit voor een verslagjaar zijn:'
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.2
  - number: 7.2.2.a
    text: |-
      het bedrag aan betrokken belastingen dat als kosten is toegerekend aan het verslagjaar bij de bepaling van de winst
      vóór belastingen in de financiële verslaggeving;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.2
  - number: 7.2.2.b
    text: |-
      het bedrag aan fictieve actieve belastinglatentie dat in het verslagjaar is verrekend op de voet van
      [artikel 7.4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel7
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.2.2.c
    text: |-
      het bedrag aan betrokken belastingen dat in een eerder verslagjaar is uitgesloten op de voet van het derde lid,
      onderdeel d, en in het verslagjaar is betaald;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.2
  - number: 7.2.2.d
    text: |-
      het bedrag aan verrekening of teruggave van een kwalificerende restitueerbare belastingteruggave dat in het
      verslagjaar in aanmerking is genomen als een vermindering van de belastinglast; en
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.2
  - number: 7.2.2.e
    text: |-
      het bedrag aan verrekening of teruggave van een kwalificerend doorgeleid belastingvoordeel uit een kwalificerend
      belang dat in het verslagjaar in aanmerking is genomen als een vermindering van de belastinglast, behalve voor
      zover het gereduceerde kwalificerende belang negatief wordt als gevolg van die verrekening of teruggave dan wel
      indien het gereduceerde kwalificerende belang reeds negatief is.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.2
  - number: 7.2.3
    text: 'De verminderingen van de betrokken belastingen van een groepsentiteit voor een verslagjaar zijn:'
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.2
  - number: 7.2.3.a
    text: |-
      het bedrag aan belastinglast dat betrekking heeft op inkomen dat niet in aanmerking wordt genomen bij de berekening
      van het kwalificerende inkomen of verlies op de voet van [hoofdstuk 6][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0049111
        hoofdstuk: '6'
  - number: 7.2.3.b
    text: |-
      het bedrag aan verrekening of teruggave van een restitueerbare belastingteruggave, niet zijnde een kwalificerende
      restitueerbare belastingteruggave, dat niet in aanmerking is genomen als een vermindering van de belastinglast;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.2
  - number: 7.2.3.c
    text: |-
      het bedrag aan verrekening of teruggave van betrokken belastingen, dat niet reeds als aanpassing van de
      belastinglast in de financiële verslaggeving is opgenomen, tenzij het een kwalificerende restitueerbare
      belastingteruggave betreft;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.2
  - number: 7.2.3.d
    text: het bedrag aan belastinglast dat betrekking heeft op een onzekere belastingpositie;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.2
  - number: 7.2.3.e
    text: |-
      het bedrag aan belastinglast ten aanzien waarvan niet de verwachting bestaat dat het binnen drie jaar na afloop van
      het verslagjaar wordt betaald; en
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.2
  - number: 7.2.3.f
    text: |-
      het bedrag aan verrekening of teruggave van betrokken belastingen dat bestaat uit een doorgeleid belastingvoordeel
      voor zover het gereduceerde kwalificerende belang negatief wordt als gevolg van die verrekening of teruggave dan
      wel indien het gereduceerde kwalificerende belang reeds negatief is en dat bedrag niet reeds als een vermindering
      van de belastinglast in de financiële verslaggeving is opgenomen.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.2
  - number: 7.2.4
    text: |-
      Bij de berekening van de gecorrigeerde betrokken belastingen van een groepsentiteit voor een verslagjaar wordt een
      bedrag dat is omschreven in meer dan een onderdeel van de voorgaande leden, slechts eenmaal in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.2
  - number: 7.2.5
    text: |-
      Indien er in een verslagjaar in een staat geen netto kwalificerend inkomen is en het bedrag aan gecorrigeerde
      betrokken belastingen voor die staat negatief is en minder dan het bedrag dat gelijk is aan het netto
      kwalificerende verlies vermenigvuldigd met het minimumbelastingtarief (verwachte gecorrigeerde betrokken
      belastingen), wordt het bedrag gelijk aan het verschil tussen het bedrag aan gecorrigeerde betrokken belastingen
      en het bedrag aan verwachte gecorrigeerde betrokken belastingen aangemerkt als additionele bijheffing voor
      dat verslagjaar. Het bedrag aan additionele bijheffing ingevolge de eerste zin wordt toegerekend aan iedere
      groepsentiteit in de staat ingevolge [artikel 8.4, vierde en vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 7.2.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld op grond waarvan in afwijking van het vijfde
      lid het bedrag gelijk aan het verschil tussen de gecorrigeerde betrokken belastingen en de verwachte gecorrigeerde
      betrokken belastingen in aanmerking kan worden genomen als een vermindering van de betrokken belastingen in een
      volgend verslagjaar waarin sprake is van kwalificerend inkomen.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.2
  - number: 7.3.1
    text: |-
      Indien het belastingtarief dat wordt toegepast voor de berekening van een belastinglatentie gelijk is aan of
      lager is dan het minimumbelastingtarief, is het totale bedrag van de gecorrigeerde mutaties in belastinglatenties
      dat ingevolge [artikel 7.2, eerste lid, onderdeel b][ref1], wordt toegevoegd aan de gecorrigeerde betrokken
      belastingen van een groepsentiteit voor een verslagjaar gelijk aan de mutaties in belastinglatenties die in
      de financiële verslaggeving worden toegerekend aan het betreffende verslagjaar met betrekking tot de betrokken
      belastingen, gecorrigeerd overeenkomstig de bepalingen in het derde tot en met zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel7
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.3.2
    text: |-
      Indien het belastingtarief dat wordt toegepast voor de berekening van een belastinglatentie hoger is dan het
      minimumbelastingtarief, is het totale bedrag van de gecorrigeerde mutaties in belastinglatenties dat ingevolge
      [artikel 7.2, eerste lid, onderdeel b][ref1], wordt toegevoegd aan de gecorrigeerde betrokken belastingen
      van een groepsentiteit voor een verslagjaar, gelijk aan de mutaties in belastinglatenties die in de financiële
      verslaggeving worden toegerekend aan het betreffende verslagjaar met betrekking tot de betrokken belastingen,
      herrekend tegen het minimumbelastingtarief, en gecorrigeerd overeenkomstig de bepalingen in het derde tot en met
      zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel7
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.3.3
    text: |-
      Bij de bepaling van het totale bedrag van de gecorrigeerde mutaties in belastinglatenties worden de mutaties in
      belastinglatenties die in de financiële verslaggeving worden toegerekend aan het betreffende verslagjaar verhoogd
      met een in het verslagjaar betaald bedrag aan:
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.3
  - number: 7.3.3.a
    text: niet-toegestane toerekening en niet-gebruikte toerekening; en
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.3
  - number: 7.3.3.b
    text: |-
      passieve belastinglatentie dat in een voorgaand jaar is teruggenomen door toepassing van
      [artikel 7.3, zevende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel7
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.3.4
    text: |-
      Indien in een verslagjaar in de financiële verslaggeving geen actieve belastinglatentie wordt opgenomen voor een
      verlies omdat niet wordt voldaan aan de voorwaarden voor de verantwoording in de jaarrekening, wordt het totale
      bedrag van de gecorrigeerde mutaties in belastinglatenties voor dat verslagjaar verminderd met het bedrag waarmee
      dat totale bedrag zou zijn verminderd indien de actieve belastinglatentie voor het betreffende verslagjaar wel zou
      zijn opgenomen in de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.3
  - number: 7.3.5
    text: 'Onder het totale bedrag van de gecorrigeerde mutaties in belastinglatenties wordt niet begrepen:'
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.3
  - number: 7.3.5.a
    text: |-
      het bedrag aan mutaties in belastinglatenties met betrekking tot bestanddelen die zijn uitgesloten van de
      berekening van het kwalificerende inkomen of verlies ingevolge [hoofdstuk 6][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0049111
        hoofdstuk: '6'
  - number: 7.3.5.b
    text: het bedrag aan belastinglatenties met betrekking tot niet-toegestane toerekening en niet-gebruikte toerekening;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.3
  - number: 7.3.5.c
    text: |-
      een wijziging in de waarde van een actieve belastinglatentie als gevolg van een aanpassing van de
      waarderingsmethode of verantwoordingsmethode;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.3
  - number: 7.3.5.d
    text: |-
      een herziening van het bedrag aan belastinglatenties als gevolg van een wijziging van het van toepassing zijnde
      nationale belastingtarief; en
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.3
  - number: 7.3.5.e
    text: |-
      het bedrag aan belastinglatenties met betrekking tot het verkrijgen van een recht op verrekening van belasting
      en de verrekening van belasting, tenzij die belastinglatenties kunnen worden aangemerkt als alternatieve
      verliesverrekeningslatenties.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.3
  - number: 7.3.6
    text: |-
      Indien een actieve belastinglatentie die voortkomt uit een kwalificerend verlies van een groepsentiteit
      wordt toegerekend aan een verslagjaar tegen een tarief dat lager is dan het minimumbelastingtarief, mag die
      belastinglatentie in dat verslagjaar worden herrekend tegen het minimumbelastingtarief indien de belastingplichtige
      aannemelijk maakt dat die actieve belastinglatentie voortkomt uit een kwalificerend verlies. Indien een actieve
      belastinglatentie ingevolge de eerste zin wordt verhoogd, wordt het totale bedrag van de gecorrigeerde mutaties in
      belastinglatenties dienovereenkomstig verminderd.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.3
  - number: 7.3.7
    text: |-
      Een bedrag aan passieve belastinglatentie dat niet is herzien en niet is betaald binnen vijf verslagjaren
      volgend op het verslagjaar waarin dat bedrag is opgekomen, wordt teruggenomen in het vijfde verslagjaar volgend
      op het verslagjaar waarin dat bedrag is opgekomen, voor zover dat bedrag eerder in aanmerking is genomen in
      het totale bedrag van de gecorrigeerde mutaties in belastinglatenties van de groepsentiteit. Het bedrag van de
      teruggenomen passieve belastinglatentie vermindert de betrokken belastingen van het vijfde verslagjaar voorafgaand
      aan het verslagjaar waarin dat bedrag is teruggenomen. Het effectieve belastingtarief en de bijheffing van het
      vijfde verslagjaar voorafgaand aan verslagjaar waarin dat bedrag is teruggenomen worden herrekend ingevolge
      [artikel 8.4, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 7.3.8
    text: |-
      In afwijking van het zevende lid wordt een bedrag aan passieve belastinglatentie niet teruggenomen indien dat
      bedrag verband houdt met:
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.3
  - number: 7.3.8.a
    text: versnelde afschrijvingen op een materiële activum;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.3
  - number: 7.3.8.b
    text: |-
      kosten van een vergunning of soortgelijke regeling van een overheid, daaronder mede begrepen een staatkundig
      onderdeel of lokale autoriteit van een overheid, voor het gebruik van onroerende zaken of de exploitatie van
      natuurlijke hulpbronnen, welk gebruik, onderscheidenlijk welke exploitatie, aanzienlijke investeringen in materiële
      activa met zich brengt;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.3
  - number: 7.3.8.c
    text: onderzoeks- en ontwikkelingskosten;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.3
  - number: 7.3.8.d
    text: kosten voor buitengebruikstelling en sanering;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.3
  - number: 7.3.8.e
    text: ongerealiseerde herwaarderingswinsten bij de toepassing van waardering tegen reële waarde;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.3
  - number: 7.3.8.f
    text: netto valutakoerswinsten;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.3
  - number: 7.3.8.g
    text: verzekeringsreserves en uitgestelde acquisitiekosten voor verzekeringspolissen;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.3
  - number: 7.3.8.h
    text: |-
      winsten uit de verkoop van materiële vaste activa die zich bevinden in de staat waarin de groepsentiteit is
      gevestigd, mits die winsten worden geherinvesteerd in materiële vaste activa in dezelfde staat; en
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.3
  - number: 7.3.8.i
    text: |-
      aanvullende bedragen die aan dit verslagjaar worden toegerekend en het gevolg zijn van een wijziging in
      verslaggevingsstandaarden met betrekking tot inkomensbestanddelen als bedoeld in de onderdelen a tot en met h.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.3
  - number: 7.3.9
    text: |-
      Voor de toepassing van dit artikel wordt verstaan onder: - *niet-toegestane toerekening:* een mutatie in een
      belastinglatentie in de financiële verslaggeving van een groepsentiteit inzake een verslagjaar en die betrekking
      heeft op een onzekere belastingpositie of op een uitdeling door een groepsentiteit;
        - *niet-gebruikte toerekening:* een toename van een passieve belastinglatentie in de financiële verslaggeving
      van een groepsentiteit inzake een verslagjaar die naar verwachting niet binnen de periode, bedoeld in het zevende
      lid, wordt betaald, en ten aanzien waarvan de informatieaangifte-indienende groepsentiteit er, overeenkomstig
      [artikel 13.2, tweede lid][ref1], voor kiest om deze toename niet op te nemen in het totale bedrag van de
      gecorrigeerde mutaties in belastinglatenties voor dat verslagjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel13
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '13'
        hoofdstuk: '13'
  - number: 7.3.10
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld op grond waarvan een belastinglatentie wordt
      aangemerkt als een alternatieve verliesverrekeningslatentie.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.3
  - number: 7.4.1
    text: |-
      In afwijking van [artikel 7.3][ref1] kan een informatieaangifte-indienende groepsentiteit ervoor kiezen om ten
      aanzien van een staat een fictieve actieve belastinglatentie te bepalen die betrekking heeft op een kwalificerend
      verlies voor ieder verslagjaar waarin sprake is van een netto kwalificerend verlies in de betreffende staat.
      De fictieve actieve belastinglatentie die betrekking heeft op het kwalificerende verlies is gelijk aan het
      netto kwalificerende verlies voor het verslagjaar voor de staat vermenigvuldigd met het minimumbelastingtarief.
      Van dit keuzerecht kan geen gebruik worden gemaakt ten aanzien van een staat met een in aanmerking komend
      uitdelingsbelastingstelsel als bedoeld in [artikel 10.3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Artikel10
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '7'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0049111
        artikel: '10'
        hoofdstuk: '10'
  - number: 7.4.2
    text: |-
      De fictieve actieve belastinglatentie wordt in enig volgend verslagjaar waarin sprake is van netto kwalificerend
      inkomen voor de betreffende staat verrekend met het bedrag van het netto kwalificerende inkomen vermenigvuldigd
      met het minimumbelastingtarief, tot ten hoogste het bedrag van de fictieve actieve belastinglatentie dat nog niet
      is verrekend.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.4
  - number: 7.4.3
    text: |-
      De fictieve actieve belastinglatentie die betrekking heeft op het kwalificerende verlies wordt verminderd met het
      bedrag dat op grond van het tweede lid in een verslagjaar wordt verrekend. Het resterende bedrag van de fictieve
      actieve belastinglatentie wordt voortgewenteld naar volgende verslagjaren.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.4
  - number: 7.4.4
    text: |-
      Indien de keuze, bedoeld in het eerste lid, wordt herroepen, wordt de resterende fictieve actieve belastinglatentie
      die betrekking heeft op het kwalificerende verlies verminderd tot nihil met ingang van de eerste dag van het eerste
      verslagjaar waarin de keuze niet langer toepassing vindt.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.4
  - number: 7.4.5
    text: |-
      De keuze, bedoeld in het eerste lid, wordt gemaakt bij de indiening van de eerste bijheffing-informatieaangifte van
      de multinationale groep of binnenlandse groep, waarin de staat waarvoor de keuze geldt is opgenomen.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.4
  - number: 7.4.6
    text: |-
      Indien een doorkijkentiteit die de uiteindelijkemoederentiteit van een multinationale groep of een binnenlandse
      groep is een keuze maakt als bedoeld in het eerste lid, wordt de fictieve actieve belastinglatentie die betrekking
      heeft op het kwalificerende verlies berekend op basis van het kwalificerende verlies van de doorkijkentiteit na
      vermindering op grond van [artikel 10.1, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel10
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '10'
        hoofdstuk: '10'
  - number: 7.5.1
    text: |-
      Aan een vaste inrichting wordt het bedrag aan betrokken belastingen toegerekend dat is opgenomen in de financiële
      verslaggeving van een groepsentiteit en verband houdt met het kwalificerende inkomen of verlies van die vaste
      inrichting.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.5
  - number: 7.5.2
    text: |-
      Aan een groepsentiteit-belanghouder wordt het bedrag aan betrokken belastingen toegerekend dat is opgenomen in de
      financiële verslaggeving van een fiscaal transparante entiteit en verband houdt met het kwalificerende inkomen of
      verlies dat is toegerekend aan die groepsentiteit-belanghouder ingevolge [artikel 6.14, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel6
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '6'
        hoofdstuk: '6'
  - number: 7.5.3
    text: |-
      Aan een groepsentiteit wordt het bedrag aan betrokken belastingen toegerekend dat is opgenomen in de financiële
      verslaggeving van haar onmiddellijke of middellijke groepsentiteit-belanghouders door toepassing van een
      belastingregeling voor buitenlandse gecontroleerde lichamen, voor zover die belastingen verband houden met het
      kwalificerende inkomen of verlies van die groepsentiteit.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.5
  - number: 7.5.4
    text: |-
      Aan een hybride groepsentiteit wordt het bedrag aan betrokken belastingen toegerekend dat is opgenomen in de
      financiële verslaggeving van haar groepsentiteit-belanghouder en dat verband houdt met het kwalificerende inkomen
      van die hybride entiteit.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.5
  - number: 7.5.5
    text: |-
      Aan een groepsentiteit die een uitdeling heeft gedaan in een verslagjaar wordt het bedrag aan betrokken belastingen
      toegerekend dat is opgenomen in de financiële verslaggeving van haar onmiddellijke groepsentiteit-belanghouder voor
      dergelijke uitdelingen.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.5
  - number: 7.5.6
    text: |-
      Aan een groepsentiteit als bedoeld in het derde en vierde lid wordt, in afwijking van hetgeen in die leden is
      bepaald, ter zake van passief inkomen een bedrag aan betrokken belastingen toegerekend dat gelijk is aan het
      bijheffingspercentage voor de staat waarin die groepsentiteit is gevestigd vermenigvuldigd met het bedrag aan
      passief inkomen van die groepsentiteit dat in aanmerking is genomen bij haar groepsentiteit-belanghouders in het
      kader van een belastingregeling voor buitenlandse gecontroleerde lichamen of uit hoofde van fiscale transparantie,
      indien dat bedrag lager is dan het bedrag van de aan haar toegerekende betrokken belastingen ten aanzien van dat
      passieve inkomen op basis van het derde en vierde lid. Voor de toepassing van de vorige zin, wordt voor de bepaling
      van het bijheffingspercentage geen rekening gehouden met de betrokken belastingen ter zake van het passieve inkomen
      van de groepsentiteit bij de groepsentiteit-belanghouder. Een bedrag aan betrokken belastingen verschuldigd door
      de groepsentiteit-belanghouder ten aanzien van dat passieve inkomen dat resteert na de toepassing van dit lid wordt
      niet toegerekend op basis van het derde en vierde lid.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.5
  - number: 7.5.7
    text: 'Voor de toepassing van het zesde lid worden de volgende inkomensbestanddelen aangemerkt als passief inkomen:'
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.5
  - number: 7.5.7.a
    text: dividend of daarmee vergelijkbare uitkeringen;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.5
  - number: 7.5.7.b
    text: rente of daarmee vergelijkbare betalingen;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.5
  - number: 7.5.7.c
    text: huur;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.5
  - number: 7.5.7.d
    text: royalty’s;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.5
  - number: 7.5.7.e
    text: lijfrenten;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.5
  - number: 7.5.7.f
    text: netto-opbrengsten ten aanzien van een goed waaruit inkomen als bedoeld in de onderdelen a tot en met e voortkomt.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.5
  - number: 7.5.8
    text: |-
      Indien het kwalificerende inkomen van een vaste inrichting op grond van [artikel 6.13, zesde lid][ref1], wordt
      aangemerkt als het kwalificerende inkomen van de hoofdentiteit, wordt de betrokken belasting met betrekking tot dat
      inkomen die wordt geheven in de staat waarin die vaste inrichting is gelegen aangemerkt als betrokken belasting van
      de hoofdentiteit voor een bedrag dat niet hoger is dan dat inkomen vermenigvuldigd met het hoogste belastingtarief
      voor inkomen in de staat waarin die hoofdentiteit is gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel6
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '6'
        hoofdstuk: '6'
  - number: 7.5.9
    text: |-
      Voor de berekening van het effectieve belastingtarief op de voet van [artikel 8.1][ref1] voor de binnenlandse
      bijheffing blijft de toerekening van de betrokken belastingen van een in een andere staat gevestigde groepsentiteit
      aan een in Nederland gevestigde groepsentiteit op de voet van het eerste lid, derde lid in samenhang met het
      zesde lid, vierde lid en vijfde lid, voor zover de belasting over de uitdeling door een andere staat is geheven,
      achterwege.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 7.5.10
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld voor de toerekening van betrokken
      belastingen ingevolge het derde lid ten aanzien van belastingregelingen voor buitenlandse gecontroleerde lichamen
      op grond waarvan de belasting wordt berekend op basis van het gezamenlijke inkomen of de gezamenlijke verliezen
      of verrekenbare belastingen van meerdere buitenlandse gecontroleerde lichamen die worden gehouden door een
      groepsentiteit.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.5
  - number: 7.6.1
    text: |-
      Indien een groepsentiteit haar betrokken belastingen voor een voorgaand verslagjaar aanpast in de financiële
      verslaggeving, wordt die aanpassing aangemerkt als een aanpassing van de betrokken belastingen in het verslagjaar
      waarin de aanpassing is gemaakt, tenzij de aanpassing verband houdt met een afname van de betrokken belastingen in
      een staat in een voorgaand verslagjaar.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.6
  - number: 7.6.2
    text: |-
      Indien sprake is van een afname van de betrokken belastingen die in een voorgaand verslagjaar zijn opgenomen in de
      gecorrigeerde betrokken belastingen, worden het effectieve belastingtarief en de bijheffing voor dat verslagjaar
      herrekend in overeenstemming met [artikel 8.4, eerste lid][ref1], door de gecorrigeerde betrokken belastingen
      te verminderen met het bedrag van de afname van de betrokken belastingen. Het kwalificerende inkomen voor dat
      verslagjaar en andere voorgaande verslagjaren wordt dienovereenkomstig aangepast.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.6
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 7.6.3
    text: |-
      De informatieaangifte-indienende groepsentiteit kan er jaarlijks, in afwijking van het eerste lid en in
      overeenstemming met [artikel 13.2, tweede lid][ref1], voor kiezen om een afname van de betrokken belastingen
      in een voorgaand verslagjaar die niet van materieel belang is aan te merken als een aanpassing van de betrokken
      belastingen in het verslagjaar waarin de aanpassing is gemaakt. Een afname van de betrokken belastingen is niet van
      materieel belang indien deze leidt tot een vermindering van de gecorrigeerde betrokken belastingen van minder dan
      € 1.000.000 vastgesteld voor een staat voor het verslagjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel13
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.6
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '13'
        hoofdstuk: '13'
  - number: 7.7.1
    text: |-
      Indien het van toepassing zijnde belastingtarief in een staat wordt verlaagd tot een tarief dat lager is dan het
      minimumbelastingtarief en die verlaging resulteert in een afname van een passieve belastinglatentie, wordt de
      afname van die belastinglatentie aangemerkt als een aanpassing van de betrokken belastingen van een groepsentiteit
      in het voorgaande verslagjaar waarin de passieve latentie overeenkomstig [artikel 7.2][ref1] is gevormd.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel7
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.7
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.7.2
    text: |-
      Indien in een verslagjaar een passieve belastinglatentie in aanmerking is genomen tegen een lager tarief dan
      het minimumbelastingtarief en het van toepassing zijnde belastingtarief in een staat in een volgend verslagjaar
      wordt verhoogd tot een tarief dat hoger is dan het minimumbelastingtarief, wordt de toename van de passieve
      belastinglatentie als gevolg van deze verhoging bij betaling ervan aangemerkt als een aanpassing van de
      betrokken belastingen in het verslagjaar waarin de passieve belastinglatentie in aanmerking is genomen. De
      aanpassing op grond van de eerste zin bedraagt ten hoogste de passieve belastinglatentie herrekend tegen het
      minimumbelastingtarief.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.7
  - number: '7.8'
    text: |-
      Indien meer dan € 1.000.000 van het bedrag dat door een groepsentiteit in een verslagjaar in aanmerking is genomen
      als gecorrigeerde betrokken belasting niet is betaald binnen drie jaar na afloop van dat verslagjaar, worden het
      effectieve belastingtarief en de bijheffing voor het verslagjaar waarin het onbetaalde bedrag als een gecorrigeerde
      betrokken belasting in aanmerking is genomen, herrekend in overeenstemming met [artikel 8.4, eerste lid][ref1],
      waarbij het onbetaalde bedrag aan betrokken belasting niet in aanmerking wordt genomen als een betrokken belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel7.8
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.1.1
    text: |-
      Het effectieve belastingtarief van een multinationale groep voor een verslagjaar wordt voor iedere staat waarin
      groepsentiteiten van die groep zijn gevestigd, mits er in die staat netto kwalificerend inkomen is, berekend
      volgens de formule: E = (B / I) x 100% waarbij wordt verstaan onder: E: het effectieve belastingtarief voor
      een verslagjaar voor een staat, uitgedrukt in een percentage dat rekenkundig wordt afgerond op vier decimalen;
      B: de som van de gecorrigeerde betrokken belastingen over het verslagjaar van alle in die staat gevestigde
      groepsentiteiten, berekend op de voet van [hoofdstuk 7][ref1]; I: het netto kwalificerende inkomen over het
      verslagjaar van alle in die staat gevestigde groepsentiteiten, berekend op de voet van het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0049111
        hoofdstuk: '7'
  - number: 8.1.2
    text: |-
      Het netto kwalificerende inkomen of verlies over een verslagjaar van alle in een staat gevestigde groepsentiteiten
      wordt berekend volgens de formule: I = W – V waarbij wordt verstaan onder: I: het netto kwalificerende inkomen of
      verlies over een verslagjaar van alle in een staat gevestigde groepsentiteiten; W: de som van het kwalificerende
      inkomen over het verslagjaar van alle in die staat gevestigde groepsentiteiten, berekend op de voet van
      [hoofdstuk 6][ref1]; V: de som van de kwalificerende verliezen over het verslagjaar van alle in die staat
      gevestigde groepsentiteiten, berekend op de voet van [hoofdstuk 6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0049111
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0049111
        hoofdstuk: '6'
  - number: 8.1.3
    text: |-
      Bij de toepassing van het eerste en tweede lid worden niet in aanmerking genomen de gecorrigeerde betrokken
      belastingen en het kwalificerende inkomen of verlies van groepsentiteiten die een beleggingsentiteit zijn.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.1
  - number: 8.1.4
    text: |-
      Het effectieve belastingtarief van een staatloze groepsentiteit voor een verslagjaar wordt afzonderlijk van het
      effectieve belastingtarief van alle andere groepsentiteiten berekend. Deze berekening geschiedt overeenkomstig
      dit artikel.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.1
  - number: 8.1.5
    text: |-
      Het eerste tot en met derde lid zijn van overeenkomstige toepassing op de berekening van het effectieve
      belastingtarief voor Nederland van een binnenlandse groep.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.1
  - number: 8.2.1
    text: |-
      Indien in een verslagjaar het effectieve belastingtarief van een multinationale groep in een staat waarin
      groepsentiteiten van die groep zijn gevestigd lager is dan het minimumbelastingtarief, of indien in een verslagjaar
      een additionele bijheffing is verschuldigd op de voet van [artikel 8.4][ref1], berekent de multinationale groep
      de bijheffing:


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.2.1.a
    text: voor die staat, overeenkomstig het tweede tot en met vierde lid; en
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.2
  - number: 8.2.1.b
    text: |-
      voor iedere groepsentiteit die kwalificerend inkomen heeft dat is meegenomen in de berekening van het netto
      kwalificerende inkomen over het verslagjaar van alle in die staat gevestigde groepsentiteiten, overeenkomstig het
      vijfde en zesde lid.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.2
  - number: 8.2.2
    text: |-
      De bijheffing voor een staat over een verslagjaar is het positieve bedrag berekend volgens de formule: S =
      (P x O) + A – N waarbij wordt verstaan onder: S: de bijheffing over een verslagjaar voor een staat; P: het
      bijheffingspercentage voor het verslagjaar voor die staat, berekend op de voet van het derde lid; O: het bedrag
      van de overwinst over het verslagjaar in die staat, berekend op de voet van het vierde lid; A: het bedrag van de
      additionele bijheffing over het verslagjaar voor die staat, berekend op de voet van [artikel 8.4][ref1]; N: het
      bedrag van de kwalificerende binnenlandse bijheffing over het verslagjaar voor die staat.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.2.3
    text: |-
      Het bijheffingspercentage voor een staat voor een verslagjaar is het verschil in procentpunten, indien positief,
      berekend volgens de formule: P = M – E waarbij wordt verstaan onder: P: het bijheffingspercentage voor een
      verslagjaar voor een staat; M: het minimumbelastingtarief; E: het effectieve belastingtarief voor het verslagjaar
      voor die staat, berekend op de voet van [artikel 8.1, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.2.4
    text: |-
      De overwinst over een verslagjaar in een staat is het positieve bedrag berekend volgens de formule: O = I – R
      waarbij wordt verstaan onder: O: het bedrag van de overwinst over een verslagjaar in een staat; I: het netto
      kwalificerende inkomen over het verslagjaar van alle in die staat gevestigde groepsentiteiten, berekend op de
      voet van [artikel 8.1, tweede lid][ref1]; R: het uitgesloten inkomen op basis van reële aanwezigheid over het
      verslagjaar van alle in die staat gevestigde groepsentiteiten, berekend op de voet van [artikel 8.3][ref2]. De
      informatieaangifte-indienende groepsentiteit kan er overeenkomstig [artikel 13.2, tweede lid][ref3], voor kiezen
      de vermindering met het uitgesloten inkomen op basis van reële aanwezigheid niet toe te passen.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0049111#Artikel13
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
      - id: ref3
        bwb_id: BWBR0049111
        artikel: '13'
        hoofdstuk: '13'
  - number: 8.2.5
    text: |-
      De bijheffing voor een groepsentiteit over een verslagjaar is het bedrag berekend volgens de formule: H = S
      x (G / W) waarbij wordt verstaan onder: H: de bijheffing over een verslagjaar voor een groepsentiteit; S: de
      bijheffing over het verslagjaar voor de staat waarin die groepsentiteit is gevestigd, berekend op de voet van
      het tweede lid; G: het kwalificerende inkomen van die groepsentiteit over het verslagjaar, berekend op de voet
      van [hoofdstuk 6][ref1]; W: de som van het kwalificerende inkomen over het verslagjaar van alle in die staat
      gevestigde groepsentiteiten, bedoeld in [artikel 8.1, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0049111
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.2.6
    text: |-
      Indien de bijheffing voor een staat voortvloeit uit een herrekening op de voet van
      [artikel 8.4, eerste lid][ref1], en er geen netto kwalificerend inkomen in die staat over het verslagjaar is,
      wordt de bijheffing toegerekend aan iedere groepsentiteit in die staat op de voet van de formule in het vijfde lid
      op basis van het kwalificerende inkomen van de groepsentiteiten over de verslagjaren waarvoor de herrekeningen op
      de voet van artikel 8.4, eerste lid, zijn verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.2.7
    text: |-
      De berekening van de bijheffing voor een in een staat gevestigde groepsentiteit ingevolge het eerste lid, onderdeel
      b, blijft achterwege indien de uiteindelijkemoederentiteit onmiddellijk of middellijk het volledige belang heeft in
      iedere in die staat gevestigde groepsentiteit en de inkomen-inclusiemaatregel van toepassing is op het belang van
      die uiteindelijkemoederentiteit in die groepsentiteiten.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.2
  - number: 8.2.8
    text: |-
      De bijheffing voor iedere staatloze groepsentiteit over een verslagjaar wordt afzonderlijk van de bijheffing van
      alle andere groepsentiteiten berekend. Deze berekening geschiedt overeenkomstig dit artikel.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.2
  - number: 8.2.9
    text: |-
      Het eerste tot en met zevende lid zijn van overeenkomstige toepassing op de berekening van de bijheffing voor
      Nederland van een binnenlandse groep en de tot die groep behorende groepsentiteiten.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.2
  - number: 8.3.1
    text: |-
      Het uitgesloten inkomen op basis van reële aanwezigheid over een verslagjaar van alle in een staat gevestigde
      groepsentiteiten van een multinationale groep of binnenlandse groep bedraagt de som van de uitzondering voor
      werknemerslasten van alle in die staat gevestigde groepsentiteiten in het verslagjaar en de uitzondering voor
      materiële activa van alle in die staat gevestigde groepsentiteiten in het verslagjaar.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.3
  - number: 8.3.2
    text: |-
      De uitzondering voor werknemerslasten van een in een staat gevestigde groepsentiteit in een verslagjaar bedraagt
      9,8% van de in het verslagjaar in aanmerking komende loonkosten ter zake van de in het verslagjaar in aanmerking
      komende werknemers die in die staat activiteiten verrichten voor de multinationale groep of binnenlandse groep, met
      uitzondering van de in aanmerking komende loonkosten die:
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.3
  - number: 8.3.2.a
    text: gekapitaliseerd en opgenomen zijn in de boekwaarde van de in aanmerking komende materiële activa;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.3
  - number: 8.3.2.b
    text: |-
      toerekenbaar zijn aan inkomen dat overeenkomstig [artikel 6.12][ref1] is uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel6
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '6'
        hoofdstuk: '6'
  - number: 8.3.3
    text: |-
      De uitzondering voor materiële activa van een in een staat gevestigde groepsentiteit in een verslagjaar bedraagt
      7,8% van de boekwaarde van de in het verslagjaar in aanmerking komende materiële activa die in de staat zijn
      gelegen, met uitzondering van:
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.3
  - number: 8.3.3.a
    text: |-
      de boekwaarde van onroerende zaken, inclusief grond en gebouwen, die worden gehouden voor de verkoop, om te leasen
      of als belegging;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.3
  - number: 8.3.3.b
    text: |-
      de boekwaarde van materiële activa die worden gebruikt om inkomen te genereren dat op de voet van
      [artikel 6.12][ref1] is uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel6
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '6'
        hoofdstuk: '6'
  - number: 8.3.4
    text: |-
      De boekwaarde van de in een verslagjaar in aanmerking komende materiële activa is het gemiddelde van de boekwaarde
      van de in aanmerking komende materiële activa aan het begin en het einde van het verslagjaar, zoals opgenomen in
      de geconsolideerde jaarrekening van de uiteindelijkemoederentiteit, verminderd met de geaccumuleerde afwaardering,
      afschrijvingen en waardeverminderingen en vermeerderd met het bedrag dat toerekenbaar is aan de gekapitaliseerde
      werknemerslasten.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.3
  - number: 8.3.5
    text: |-
      Voor de toepassing van het tweede en derde lid zijn de in aanmerking komende loonkosten en de in aanmerking komende
      materiële activa van een groepsentiteit die een vaste inrichting is, de in aanmerking komende loonkosten en de
      in aanmerking komende materiële activa die op de voet van [artikel 6.13, eerste, tweede en derde lid][ref1],
      zijn opgenomen in de afzonderlijke financiële verslaggeving van die vaste inrichting, voor zover deze kosten en
      activa worden gealloceerd aan de staat waarin de vaste inrichting is gelegen. De in aanmerking komende loonkosten
      en de in aanmerking komende materiële activa van een vaste inrichting worden niet in aanmerking genomen door de
      hoofdentiteit van de vaste inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel6
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '6'
        hoofdstuk: '6'
  - number: 8.3.6
    text: |-
      Indien het inkomen van een vaste inrichting op de voet van [artikel 6.14, eerste lid][ref1], of
      [artikel 10.1, vierde lid][ref2], is verminderd, worden de in aanmerking komende loonkosten en de in aanmerking
      komende materiële activa van die vaste inrichting in dezelfde mate uitgesloten voor de berekening van het
      uitgesloten inkomen op basis van reële aanwezigheid voor de multinationale groep of binnenlandse groep op de voet
      van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Artikel10
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0049111
        artikel: '10'
        hoofdstuk: '10'
  - number: 8.3.7
    text: |-
      In aanmerking komende loonkosten ter zake van in aanmerking komende werknemers en in aanmerking komende materiële
      activa die zijn betaald door, onderscheidenlijk die eigendom zijn van, een doorkijkentiteit worden, mits ze niet
      zijn toegerekend op grond van het vijfde en zesde lid, toegerekend aan:
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.3
  - number: 8.3.7.a
    text: |-
      de groepsentiteit-belanghouder van de doorkijkentiteit, naar evenredigheid van het bedrag dat op de voet van
      [artikel 6.14, derde lid][ref1], aan hem wordt toegerekend, indien de in aanmerking komende werknemers en de in
      aanmerking komende materiële activa zich bevinden in dezelfde staat als de groepsentiteit-belanghouder; en


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel6
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '6'
        hoofdstuk: '6'
  - number: 8.3.7.b
    text: |-
      de doorkijkentiteit, indien zij de uiteindelijkemoederentiteit is, verminderd naar evenredigheid van het inkomen
      dat niet is meegenomen in de berekening van het kwalificerende inkomen van de doorkijkentiteit op de voet van
      [artikel 10.1, eerste lid][ref1], indien de in aanmerking komende werknemers en de in aanmerking komende materiële
      activa zich bevinden in dezelfde staat als de doorkijkentiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel10
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '10'
        hoofdstuk: '10'
  - number: 8.3.8
    text: |-
      De na de toepassing van het zevende lid, onderdelen a en b, resterende in aanmerking komende loonkosten en de
      resterende in aanmerking komende materiële activa van de doorkijkentiteit worden niet meegenomen in de berekening
      van het uitgesloten inkomen op basis van reële aanwezigheid van een multinationale groep of binnenlandse groep.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.3
  - number: 8.3.9
    text: |-
      Het uitgesloten inkomen op basis van reële aanwezigheid van een staatloze groepsentiteit wordt over een verslagjaar
      afzonderlijk van het uitgesloten inkomen op basis van reële aanwezigheid van alle andere groepsentiteiten berekend.
      Deze berekening geschiedt overeenkomstig dit artikel.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.3
  - number: 8.3.10
    text: |-
      Het uitgesloten inkomen op basis van reële aanwezigheid berekend op de voet van dit artikel bevat niet de
      uitzondering voor werknemerslasten en de uitzondering voor materiële activa van in een staat gevestigde
      beleggingsentiteiten.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.3
  - number: 8.3.11
    text: |-
      Voor de toepassing van dit artikel wordt verstaan onder: - *in aanmerking komende loonkosten:* uitgaven voor
      werknemersbeloningen, waaronder salarissen, lonen, loonbelastingen en belastingen op arbeid en andere uitgaven
      die een werknemer een rechtstreeks en persoonlijk voordeel opleveren, zoals ziektekosten- en pensioenbijdragen en
      werkgeverbijdragen voor de sociale zekerheid;
        - *in aanmerking komende werknemers:* voltijd- en deeltijdwerknemers van een groepsentiteit en zelfstandige
      contractanten die onder toezicht en controle van de multinationale groep of binnenlandse groep deelnemen aan de
      normale bedrijfsactiviteiten van de multinationale groep of binnenlandse groep;
        - *in aanmerking komende materiële activa:* 1°. in een staat gelegen materiële vaste activa; 2°. in een staat
      gelegen natuurlijke rijkdommen; 3°. het gebruiksrecht van een lessee op in een staat gelegen materiële vaste
      activa; 4°. een licentie of een daarmee vergelijkbare regeling van een overheid, daaronder mede begrepen een
      staatkundig onderdeel of lokale autoriteit van een overheid, voor het gebruik van een in een staat gelegen
      onroerende zaak of voor de exploitatie van in een staat gelegen natuurlijke rijkdommen die een aanzienlijke
      investering in materiële activa met zich brengt.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.3
  - number: 8.4.1
    text: |-
      Indien de betrokken belastingen of het kwalificerende inkomen of verlies in een staat op de voet van het zevende
      lid of de [artikelen 6.7][ref1], [7.3, zesde lid][ref2], [7.6][ref3], [7.8][ref4] of [10.3, zesde lid][ref5],
      worden aangepast en dit leidt tot een wijziging van het effectieve belastingtarief en de bijheffing van
      een multinationale groep of binnenlandse groep voor die staat over een voorgaand verslagjaar, worden het
      effectieve belastingtarief en de bijheffing over dat verslagjaar voor die staat herrekend op de voet van de
      [artikelen 8.1 tot en met 8.3][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0049111#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0049111#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0049111#Artikel10
      [ref6]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0049111
        artikel: '7'
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0049111
        artikel: '7'
        hoofdstuk: '7'
      - id: ref4
        bwb_id: BWBR0049111
        artikel: '7'
        hoofdstuk: '7'
      - id: ref5
        bwb_id: BWBR0049111
        artikel: '10'
        hoofdstuk: '10'
      - id: ref6
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.4.2
    text: |-
      Indien de herrekening, bedoeld in het eerste lid, leidt tot een hoger bedrag aan bijheffing over een
      voorgaand verslagjaar, wordt het meerdere aangemerkt als een additionele bijheffing voor de toepassing van
      [artikel 8.2, tweede lid][ref1], over het verslagjaar waarin de herrekening is gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.4.3
    text: |-
      Indien voor een staat een additionele bijheffing op grond van het tweede lid is verschuldigd en er in die
      staat geen netto kwalificerend inkomen over het verslagjaar is, is het kwalificerende inkomen van een in die
      staat gevestigde groepsentiteit voor de toepassing van [artikel 4.2, tweede lid][ref1], gelijk aan de aan
      die groepsentiteit overeenkomstig [artikel 8.2, zesde lid][ref2], toegerekende bijheffing gedeeld door het
      minimumbelastingtarief.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.4.4
    text: |-
      Indien voor een staat een additionele bijheffing op grond van [artikel 7.2, vijfde lid][ref1], is verschuldigd,
      is het kwalificerende inkomen van iedere in die staat gevestigde groepsentiteit voor de toepassing van
      [artikel 4.2, tweede lid][ref2], gelijk aan de aan die groepsentiteit toegerekende additionele bijheffing
      gedeeld door het minimumbelastingtarief. De additionele bijheffing wordt toegerekend aan iedere in die staat
      gevestigde groepsentiteit volgens de formule: A = B – (G x M) waarbij wordt verstaan onder: A: het bedrag aan
      additionele bijheffing, bedoeld in [artikel 7.2, vijfde lid][ref3], dat wordt toegerekend aan een in de staat
      gevestigde groepsentiteit; B: de gecorrigeerde betrokken belastingen van die groepsentiteit, berekend op de voet
      van[ hoofdstuk 7][ref4]; G: het kwalificerende inkomen of verlies van die groepsentiteit over het verslagjaar,
      berekend op de voet van [hoofdstuk 6][ref5]; M: het minimumbelastingtarief.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0049111#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0049111#Hoofdstuk7
      [ref5]: https://wetten.overheid.nl/BWBR0049111#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '7'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0049111
        artikel: '4'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0049111
        artikel: '7'
        hoofdstuk: '7'
      - id: ref4
        bwb_id: BWBR0049111
        hoofdstuk: '7'
      - id: ref5
        bwb_id: BWBR0049111
        hoofdstuk: '6'
  - number: 8.4.5
    text: |-
      Voor de toepassing van het vierde lid wordt de additionele bijheffing uitsluitend toegerekend aan
      groepsentiteiten waarvan het bedrag aan gecorrigeerde betrokken belastingen lager is dan nul en tevens lager
      is dan het kwalificerende inkomen of verlies van de desbetreffende groepsentiteit vermenigvuldigd met het
      minimumbelastingtarief.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.4
  - number: 8.4.6
    text: |-
      Indien aan een groepsentiteit in een verslagjaar een additionele bijheffing wordt toegerekend
      overeenkomstig dit artikel of [artikel 8.2, zesde lid][ref1], wordt die entiteit voor de toepassing van de
      [hoofdstukken 3 tot en met 5][ref2] in dat verslagjaar aangemerkt als een laagbelaste groepsentiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0049111
        hoofdstuk: '3'
  - number: 8.4.7
    text: |-
      Voor zover een bedrag aan kwalificerende binnenlandse bijheffing dat over een verslagjaar is verschuldigd niet
      is betaald binnen vier verslagjaren na het verslagjaar waarover die bijheffing was verschuldigd, wordt het niet-
      betaalde bedrag aan kwalificerende binnenlandse bijheffing aangemerkt als een additionele bijheffing als bedoeld
      in [artikel 8.2, tweede lid][ref1], over het vijfde verslagjaar na het verslagjaar waarover die kwalificerende
      binnenlandse bijheffing was verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.5.1
    text: |-
      Niettegenstaande [artikel 8.13][ref1] wordt op basis van [artikel 8.4][ref2] additionele bijheffing berekend ten
      aanzien van groepsentiteiten van een multinationale groep die zijn gevestigd in een staat die voor de toepassing
      van een kwalificerende binnenlandse bijheffing niet voorziet in een herrekening op basis van een met artikel 8.4
      vergelijkbare regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.5
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.5.2
    text: |-
      Ten aanzien van een verslagjaar waarin [artikel 8.8][ref1] of [artikel 8.11][ref2] voor een staat wordt
      toegepast, vindt voor die staat geen herrekening als bedoeld in [artikel 8.4, eerste lid][ref3], plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.5
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
      - id: ref3
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.5.3
    text: |-
      Groepsentiteiten waarop het eerste lid van toepassing is, worden voor de toepassing van de [hoofdstukken 4][ref1]
      en [5][ref2] aangemerkt als laagbelaste groepsentiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.5
    references:
      - id: ref1
        bwb_id: BWBR0049111
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0049111
        hoofdstuk: '5'
  - number: 8.6.1
    text: |-
      De berekening van het effectieve belastingtarief en de bijheffing voor een staat op de voet van de
      [hoofdstukken 6 tot en met 10][ref1] voor een in minderheidsbelang gehouden subgroep van een multinationale
      groep of binnenlandse groep wordt verricht alsof elke in minderheidsbelang gehouden subgroep een afzonderlijke
      multinationale groep of binnenlandse groep is. De gecorrigeerde betrokken belastingen en het kwalificerende
      inkomen of verlies van de entiteiten die behoren tot de in minderheidsbelang gehouden subgroep worden niet in
      aanmerking genomen bij het bepalen van het effectieve belastingtarief en het netto kwalificerende inkomen van de
      multinationale groep of binnenlandse groep op de voet van [artikel 8.1, eerste en tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.6
    references:
      - id: ref1
        bwb_id: BWBR0049111
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.6.2
    text: |-
      Het effectieve belastingtarief en de bijheffing van een in minderheidsbelang gehouden groepsentiteit van een
      multinationale groep of binnenlandse groep die geen onderdeel is van een in minderheidsbelang gehouden subgroep,
      wordt berekend op entiteitsbasis op de voet van de [hoofdstukken 6 tot en met 10][ref1]. De gecorrigeerde betrokken
      belastingen en het kwalificerende inkomen of verlies van de in minderheidsbelang gehouden groepsentiteit worden
      niet in aanmerking genomen bij het bepalen van het effectieve belastingtarief en het netto kwalificerende inkomen
      van de multinationale groep of binnenlandse groep op de voet van [artikel 8.1, eerste en tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.6
    references:
      - id: ref1
        bwb_id: BWBR0049111
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.6.3
    text: |-
      Dit artikel is niet van toepassing op een in minderheidsbelang gehouden groepsentiteit die een beleggingsentiteit
      is.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.6
  - number: 8.6.4
    text: |-
      Voor de toepassing van dit artikel wordt verstaan onder: - *in minderheidsbelang gehouden groepsentiteit:* een
      groepsentiteit waarin de uiteindelijkemoederentiteit een onmiddellijk of middellijk belang van 30% of minder heeft;
        - *in minderheidsbelang gehouden moederentiteit:* een in minderheidsbelang gehouden groepsentiteit die onmiddellijk
      of middellijk het controlerende belang heeft in een andere in minderheidsbelang gehouden groepsentiteit, en waarin
      het controlerende belang niet onmiddellijk of middellijk wordt gehouden door een andere in minderheidsbelang
      gehouden groepsentiteit;
        - *in minderheidsbelang gehouden subgroep:* een in minderheidsbelang gehouden moederentiteit en haar in
      minderheidsbelang gehouden dochterentiteiten;
        - *in minderheidsbelang gehouden dochterentiteit:* een in minderheidsbelang gehouden groepsentiteit waarin
      het controlerende belang onmiddellijk of middellijk wordt gehouden door een in minderheidsbelang gehouden
      moederentiteit.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.6
  - number: 8.6.5
    text: |-
      Voor de toepassing van de [artikelen 8.7][ref1] en [8.8][ref2] worden in minderheidsbelang gehouden
      groepsentiteiten niet als een afzonderlijke groep aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.6
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.7.1
    text: |-
      Indien de informatieaangifte-indienende groepsentiteit daarvoor kiest, bedraagt de bijheffing over een
      verslagjaar voor de in een staat gevestigde groepsentiteiten enkel de additionele bijheffing, bedoeld in
      [artikel 8.4, zevende lid][ref1], (de minimis-uitzondering) mits in dat verslagjaar:


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.7
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.7.1.a
    text: |-
      de gemiddelde kwalificerende omzet van alle in die staat gevestigde groepsentiteiten minder bedraagt dan
      € 10.000.000; en
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.7
  - number: 8.7.1.b
    text: |-
      het gemiddelde netto kwalificerende inkomen van alle in die staat gevestigde groepsentiteiten minder bedraagt dan
      € 1.000.000 of ten aanzien van alle in die staat gevestigde groepsentiteiten sprake is van een gemiddeld netto
      kwalificerend verlies.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.7
  - number: 8.7.2
    text: |-
      De gemiddelde kwalificerende omzet of het gemiddelde netto kwalificerende inkomen of verlies van alle in een staat
      gevestigde groepsentiteiten over een verslagjaar is het gemiddelde van de kwalificerende omzet, onderscheidenlijk
      het gemiddelde van het netto kwalificerende inkomen of verlies, van de in die staat gevestigde groepsentiteiten
      over het verslagjaar en de twee daaraan voorafgaande verslagjaren. Bij het bepalen van de gemiddelde kwalificerende
      omzet of het gemiddelde netto kwalificerende inkomen of verlies van de in een staat gevestigde groepsentiteiten
      wordt het eerste of tweede aan het verslagjaar voorafgaande verslagjaar niet in aanmerking genomen indien in dat
      verslagjaar of die verslagjaren geen groepsentiteiten in die staat waren gevestigd of de in die staat gevestigde
      groepsentiteiten geen kwalificerende omzet of netto kwalificerende inkomen of verlies hadden.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.7
  - number: 8.7.3
    text: |-
      De kwalificerende omzet van de in een staat gevestigde groepsentiteiten over een verslagjaar is de som van
      de omzet van de in die staat gevestigde groepsentiteiten verminderd of vermeerderd met de op de voet van
      [hoofdstuk 6][ref1] aangebrachte correcties voor zover die correcties van invloed zijn op de omzet van die
      groepsentiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.7
    references:
      - id: ref1
        bwb_id: BWBR0049111
        hoofdstuk: '6'
  - number: 8.7.4
    text: |-
      Het netto kwalificerende inkomen of verlies van de in een staat gevestigde groepsentiteiten over een verslagjaar
      wordt bepaald op de voet van [artikel 8.1, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.7
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.7.5
    text: |-
      Voor de toepassing van het eerste tot en met vierde lid worden, indien een verslagjaar langer of korter is dan
      een periode van twaalf maanden, het bedrag aan kwalificerende omzet en het bedrag aan netto kwalificerend inkomen
      of verlies van alle in een staat gevestigde groepsentiteiten over dat verslagjaar verlaagd, onderscheidenlijk
      verhoogd, naar evenredigheid van een verslagjaar van twaalf maanden.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.7
  - number: 8.7.6
    text: |-
      De de minimis-uitzondering is niet van toepassing op een staatloze entiteit of een beleggingsentiteit. De omzet en
      het kwalificerende inkomen of verlies van staatloze entiteiten en beleggingsentiteiten worden uitgesloten van de
      berekening van de de minimis-uitzondering.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.7
  - number: 8.8.1
    text: |-
      Indien de informatieaangifte-indienende groepsentiteit van een multinationale groep daarvoor kiest bedraagt
      de bijheffing voor de in een staat gevestigde groepsentiteiten voor een verslagjaar dat aanvangt op of voor
      31 december 2026 en eindigt voor 1 juli 2028 nihil, mits de multinationale groep over dat verslagjaar voor die
      staat:
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.8
  - number: 8.8.1.a
    text: |-
      in een kwalificerend landenrapport totale inkomsten rapporteert van minder dan € 10.000.000 en een winst vóór
      winstbelasting van minder dan € 1.000.000;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.8
  - number: 8.8.1.b
    text: |-
      op basis van een vereenvoudigde berekening een effectief belastingtarief heeft dat ten minste gelijk is aan het
      voor dat verslagjaar geldende overgangstarief; of
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.8
  - number: 8.8.1.c
    text: |-
      in een kwalificerend landenrapport een winst vóór winstbelasting rapporteert die niet meer
      bedraagt dan het uitgesloten inkomen op basis van reële aanwezigheid berekend op de voet van
      [artikel 8.3][ref1], met dien verstande dat bij die berekening uitsluitend de werknemerslasten en de
      materiële activa in aanmerking worden genomen van groepsentiteiten die ook groepsentiteiten zijn op
      basis van [artikel 29b, onderdeel c, van de Wet op de vennootschapsbelasting 1969][ref2], of daarmee
      vergelijkbare regelgeving in een andere staat, en die groepsentiteiten op grond van [artikel 1.3][ref3]
      in dezelfde staat zijn gevestigd als de staat waarin die entiteiten voor de toepassing van
      [hoofdstuk VIIa van de Wet op de vennootschapsbelasting 1969][ref4], of daarmee vergelijkbare regelgeving in een
      andere staat, zijn gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel29b
      [ref3]: https://wetten.overheid.nl/BWBR0049111#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0002672#HoofdstukVIIa
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.8
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 29b
      - id: ref3
        bwb_id: BWBR0049111
        artikel: '1'
        hoofdstuk: '1'
      - id: ref4
        bwb_id: BWBR0002672
        hoofdstuk: VIIa
  - number: 8.8.2
    text: |-
      Indien de multinationale groep in een staat groepsentiteiten ter verkoop houdt, dient voor de toepassing van het
      eerste lid, onderdeel a, de som van de totale inkomsten zoals gerapporteerd in het kwalificerende landenrapport
      voor die staat en de omzet van de in die staat ter verkoop gehouden groepsentiteiten minder te bedragen dan
      € 10.000.000.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.8
  - number: 8.8.3
    text: |-
      Voor de toepassing van het eerste lid, onderdeel b, wordt het effectieve belastingtarief voor een staat
      vereenvoudigd berekend volgens de formule: VE = (VB/W) x 100% waarbij wordt verstaan onder: VE: het vereenvoudigde
      effectieve belastingtarief voor een verslagjaar voor een staat, uitgedrukt in een percentage dat rekenkundig
      wordt afgerond op vier decimalen; VB: de vereenvoudigde betrokken belastingen, zijnde de belastingen naar het
      inkomen in die staat over een verslagjaar zoals gerapporteerd in de kwalificerende financiële verslaggeving van
      de multinationale groep voor zover het betrokken belastingen zijn die zijn geheven over de in een kwalificerend
      landenrapport gerapporteerde winst vóór winstbelasting van groepsentiteiten die voor de toepassing van
      [hoofdstuk VIIa van de Wet op de vennootschapsbelasting 1969][ref1], of daarmee vergelijkbare regelgeving
      in een andere staat, gevestigd zijn in die staat; W: de winst vóór winstbelasting in die staat zoals door de
      multinationale groep is gerapporteerd in een kwalificerend landenrapport.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#HoofdstukVIIa
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.8
    references:
      - id: ref1
        bwb_id: BWBR0002672
        hoofdstuk: VIIa
  - number: 8.8.4
    text: |-
      Voor de berekening van de vereenvoudigde betrokken belastingen, bedoeld in het derde lid, worden de in
      de financiële verslaggeving gerapporteerde onzekere belastingposities in de staat waarvoor het effectieve
      belastingtarief vereenvoudigd wordt berekend niet in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.8
  - number: 8.8.5
    text: |-
      Voor het bepalen van de winst vóór winstbelasting, bedoeld in het eerste lid, onderdelen a en c, en het derde lid,
      wordt een nettovermogensverlies voor zover dat voortvloeit uit wijzigingen in de reële waarde van een belang, niet
      zijnde een portfoliobelang, niet in aanmerking genomen indien dat verlies meer dan € 50.000.000 bedraagt.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.8
  - number: 8.8.6
    text: |-
      Indien een uiteindelijkemoederentiteit van een multinationale groep in de staat waarin zij is gevestigd is
      onderworpen aan een aftrekbaardividendstelsel wordt voor de toepassing van het eerste lid, onderdelen a en c, en
      het derde lid de winst vóór winstbelasting in die staat verminderd met het bedrag dat is uitgedeeld als aftrekbaar
      dividend aan een belanghouder die voldoet aan de voorwaarden van [artikel 10.2, eerste lid][ref1], onderdelen
      a tot en met e. De vereenvoudigde betrokken belastingen, bedoeld in het derde lid, niet zijnde de belastingen
      waarvoor de dividendaftrek wordt toegestaan, worden evenredig aan de vermindering van de winst vóór winstbelasting
      verminderd. Artikel 10.2, derde tot en met vijfde lid, is van overeenkomstige toepassing, met dien verstande dat
      daarbij voor eerste en tweede lid wordt gelezen: eerste en tweede zin.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel10
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.8
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '10'
        hoofdstuk: '10'
  - number: 8.8.7
    text: |-
      Voor de toepassing van het eerste lid, onderdelen a en c, en het derde lid worden de winst vóór winstbelasting,
      de vereenvoudigde betrokken belastingen en de totale inkomsten van een beleggingsentiteit of een
      verzekeringsbeleggingsentiteit in aanmerking genomen in de staten waarin de groepsentiteit-belanghouders zijn
      gevestigd naar rato van het belang dat zij hebben in de beleggingsentiteit of de verzekeringsbeleggingsentiteit.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.8
  - number: 8.8.8
    text: |-
      Voor de toepassing van het eerste lid, onderdelen a en c, en het derde lid worden de winst vóór winstbelasting,
      de vereenvoudigde betrokken belastingen en de totale inkomsten van een beleggingsentiteit of een
      verzekeringsbeleggingsentiteit niet in aanmerking genomen naar rato van het belang dat een belanghouder die geen
      groepsentiteit-belanghouder is heeft in die entiteit.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.8
  - number: 8.8.9
    text: |-
      In afwijking van [artikel 7.4, vijfde lid][ref1], wordt de keuze, bedoeld in artikel 7.4, eerste lid, ten aanzien
      van een staat waarvoor dit artikel in een verslagjaar wordt toegepast, gemaakt bij de indiening van de bijheffing-
      informatieaangifte over het eerste verslagjaar waarin dit artikel ten aanzien van die staat niet wordt toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel7
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.8
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '7'
        hoofdstuk: '7'
  - number: 8.8.10
    text: |-
      Voor de toepassing van dit artikel wordt verstaan onder: - *kwalificerend landenrapport:* een landenrapport als
      bedoeld in [artikel 29e van de Wet op de vennootschapsbelasting 1969][ref1], of daarmee vergelijkbare regelgeving
      in een andere staat, mits dat rapport is opgesteld op basis van een kwalificerende financiële verslaggeving en is
      ingediend bij de relevante belastingautoriteit;
        - *kwalificerende financiële verslaggeving:* 1°. de financiële verslaggeving van de uiteindelijkemoederentiteit;
      2°. de enkelvoudige jaarrekening van iedere groepsentiteit mits die is opgesteld in overeenstemming met een
      geaccepteerde financiële verslaggevingsstandaard of een geautoriseerde financiële verslaggevingsstandaard, de
      financiële verslaggeving van de groepsentiteit is opgesteld aan de hand van die financiële verslaggevingsstandaard
      en de gegevens in de financiële verslaggeving betrouwbaar zijn; of 3°. in geval van een groepsentiteit die enkel op
      grond van haar beperkte omvang of op grond van materialiteit niet is opgenomen in de geconsolideerde jaarrekening:
      de verslaggeving van die groepsentiteit die is gebruikt voor het opstellen van het kwalificerende landenrapport van
      de multinationale groep;
        - *het voor het verslagjaar geldende overgangstarief:* voor verslagjaren die aanvangen in: 1°. 2023 of 2024: 15%;
      2°. 2025: 16%; 3°. 2026: 17%.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel29e
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.8
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 29e
  - number: '8.9'
    text: |-
      [Artikel 8.8][ref1] is niet van toepassing ten aanzien van groepsentiteiten:


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.9
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.9.a
    text: die staatloze groepsentiteiten zijn;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.9
  - number: 8.9.b
    text: 'die beleggingsentiteiten of verzekeringsbeleggingsentiteiten zijn, tenzij:'
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.9
  - number: 8.9.b.1°
    text: |-
      de informatieaangifte-indienende groepsentiteit ten aanzien van die beleggingsentiteiten of
      verzekeringsbeleggingsentiteiten ervoor kiest om [artikel 10.5][ref1] niet toe te passen of ten aanzien van
      de groepsentiteit-belanghouders in die beleggingsentiteiten of verzekeringsbeleggingsentiteiten ervoor kiest om
      [artikel 10.6][ref2] niet toe te passen; en


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Artikel10
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.9
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0049111
        artikel: '10'
        hoofdstuk: '10'
  - number: 8.9.b.2°
    text: |-
      die beleggingsentiteiten of verzekeringsbeleggingsentiteiten voor de toepassing van
      [hoofdstuk VIIa van de Wet op de vennootschapsbelasting 1969][ref1], of daarmee vergelijkbare regelgeving in een
      andere staat, in dezelfde staat zijn gevestigd als haar groepsentiteit-belanghouders;


      [ref1]: https://wetten.overheid.nl/BWBR0002672#HoofdstukVIIa
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.9
    references:
      - id: ref1
        bwb_id: BWBR0002672
        hoofdstuk: VIIa
  - number: 8.9.c
    text: |-
      die behoren tot een multinationale groep met meerdere uiteindelijkemoederentiteiten waarvan een kwalificerend
      landenrapport als bedoeld in [artikel 8.8, tiende lid, onderdeel a][ref1], niet de informatie van de gecombineerde
      groepen bevat;


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.9
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.9.d
    text: |-
      die zijn gevestigd in een staat waarin een doorkijkentiteit is gevestigd die een uiteindelijkemoederentiteit is,
      tenzij het volledige belang in die doorkijkentiteit wordt gehouden door een of meer belanghouders die voldoen aan
      de voorwaarden van [artikel 10.1, eerste lid, onderdelen a tot en met d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel10
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.9
    references:
