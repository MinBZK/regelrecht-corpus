  - number: 8.10.2
    text: |-
      Voor de toepassing van [artikel 8.8][ref1] op een joint venture en de met die joint venture verbonden partijen
      wordt voor de in een kwalificerend landenrapport gerapporteerde totale inkomsten en winst vóór winstbelasting
      gelezen: de in de kwalificerende financiële verslaggeving gerapporteerde totale omzet per staat, onderscheidenlijk
      het bedrag aan winst per staat, voordat daarop de belasting naar het inkomen in mindering is gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.10
