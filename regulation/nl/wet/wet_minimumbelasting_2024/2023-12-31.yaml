      onderbelastewinstbijheffing, volgens de regels van [hoofdstuk 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel1.1
    references:
