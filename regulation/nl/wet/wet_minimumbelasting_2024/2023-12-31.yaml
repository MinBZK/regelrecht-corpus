        artikel: '15'
        hoofdstuk: '15'
  - number: 17.1.5
    text: |-
      In afwijking van het eerste lid treedt [artikel 15.2, onderdeel D][ref1], in werking met ingang van 31 december
      2027 en vindt dat onderdeel voor het eerst toepassing met betrekking tot verslagjaren die aanvangen op of na
      31 december 2027.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel15
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel17.1
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '15'
        hoofdstuk: '15'
  - number: 17.1.6
    text: |-
      In afwijking van het eerste lid treedt [artikel 15.2, onderdeel E][ref1], in werking met ingang van 31 december
      2028 en vindt dat onderdeel voor het eerst toepassing met betrekking tot verslagjaren die aanvangen op of na
      31 december 2028.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel15
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel17.1
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '15'
        hoofdstuk: '15'
  - number: 17.1.7
    text: |-
      In afwijking van het eerste lid treedt [artikel 15.2, onderdeel F][ref1], in werking met ingang van 31 december
      2029 en vindt dat onderdeel voor het eerst toepassing met betrekking tot verslagjaren die aanvangen op of na
      31 december 2029.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel15
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel17.1
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '15'
        hoofdstuk: '15'
  - number: 17.1.8
    text: |-
      In afwijking van het eerste lid treedt [artikel 15.2, onderdeel G][ref1], in werking met ingang van 31 december
