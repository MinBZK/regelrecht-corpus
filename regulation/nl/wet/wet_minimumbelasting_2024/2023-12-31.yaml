        bwb_id: BWBR0049111
        hoofdstuk: '5'
  - number: 1.2.1
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt verstaan onder: - *aangewezen
      informatieaangifte-indienende groepsentiteit:* de groepsentiteit die geen uiteindelijkemoederentiteit is en
      die door de multinationale groep of binnenlandse groep is aangewezen om namens die groep te voldoen aan de
      informatieverplichting, bedoeld in [artikel 13.1][ref1];
        - *aftrekbaar dividend:* a. een uitdeling van winst aan een belanghouder van een groepsentiteit, waarbij die
      groepsentiteit is onderworpen aan een aftrekbaardividendstelsel op grond waarvan een uitdeling van winst aftrekbaar
      is van het belastbare inkomen van die entiteit krachtens de regelgeving van de staat waarin zij is gevestigd;
      of b. een ledendividend uitgedeeld aan een lid van een coöperatie, waarbij die coöperatie is onderworpen aan een
      aftrekbaardividendstelsel;
        - *aftrekbaardividendstelsel:* een belastingstelsel waarbij het inkomen van de belanghouders van een entiteit op
      één niveau wordt belast door de winst die wordt uitgedeeld aan de belanghouders in mindering te brengen op of uit
      te sluiten van het inkomen van de entiteit, of door een coöperatie vrij te stellen van belastingheffing;
        - *belang:* elk belang in het eigen vermogen dat recht geeft op winst, kapitaal of reserves van een entiteit of van
      een vaste inrichting;
        - *belastingregeling voor buitenlandse gecontroleerde lichamen:* een belastingmaatregel, anders dan een
      kwalificerende inkomen-inclusiemaatregel, op grond waarvan de onmiddellijke of middellijke aandeelhouder van een
      buitenlandse entiteit of de hoofdentiteit van een vaste inrichting onderworpen is aan belasting over een deel
      van of het gehele inkomen, ongeacht of dat inkomen is uitgekeerd, dat is genoten door die buitenlandse entiteit,
      onderscheidenlijk die vaste inrichting;
        - *belastingverdrag:* elke regeling ter voorkoming van dubbele belasting tussen Nederland en een andere
      bestuurlijke eenheid, waaronder een Rijkswet ter voorkoming van dubbele belasting, dan wel elk soortgelijk besluit
      ter voorkoming van dubbele belasting;
        - *beleggingsentiteit:* a. een beleggingsfonds of een vastgoedbeleggingsvehikel; b. een entiteit die onmiddellijk
      of via een of meer entiteiten als bedoeld in onderdeel a, voor ten minste 95% wordt gehouden door een entiteit als
      bedoeld in onderdeel a, en die uitsluitend of nagenoeg uitsluitend activa houdt of investeert ten behoeve van die
      entiteit, onderscheidenlijk die entiteiten; of c. een entiteit waarvan ten minste 85% van de waarde wordt gehouden
      door een entiteit als bedoeld in onderdeel a, indien nagenoeg al haar inkomen wordt verkregen uit dividenden
      of vervreemdingswinsten of -verliezen die uitgesloten zijn van de berekening van het kwalificerende inkomen of
      verlies;
        - *beleggingsfonds:* een entiteit of rechtsfiguur die: a. is opgezet om financiële of niet-financiële activa
      van verschillende investeerders, waarvan sommigen niet-verbonden zijn in de zin van artikel 5, achtste lid,
      van het OESO-modelverdrag, onder hetzelfde beheer te brengen; b. investeert volgens een vooraf vastgesteld
      investeringsbeleid; c. het voor investeerders mogelijk maakt om transactie-, onderzoeks- en analytische kosten
      te verminderen of zorgt voor het collectief spreiden van risico’s; d. als hoofddoel heeft het genereren van
      beleggingsinkomen of -winsten, dan wel de bescherming tegen een specifieke of algemene gebeurtenis of uitkomst; e.
      investeerders het recht geeft op de opbrengsten uit de activa van het fonds of het inkomen dat wordt gegenereerd
      met die activa, naar evenredigheid van hun bijdrage; f. is onderworpen of waarvan de fondsbeheerder is onderworpen
      aan de toezichtregelgeving, inclusief afdoende anti-witwas- en investeringsbeschermingsregelgeving, voor
      beleggingsfondsen in de staat naar het recht waarvan het fonds is opgericht of wordt beheerd; en g. namens de
      investeerders wordt beheerd door beleggingsfondsmanagementprofessionals;
        - *betrokken belastingen:* belastingen als bedoeld in [artikel 7.1][ref2];
        - *bijheffing:* de belasting die op grond van [artikel 8.2][ref3] is berekend voor een staat of een
      groepsentiteit;
        - *binnenlandse groep:* een groep waarvan alle groepsentiteiten in Nederland zijn gevestigd;
        - *controlerend belang:* een zodanig belang in een entiteit dat de houder van het belang, in overeenstemming
      met een geaccepteerde financiële verslaggevingstandaard verplicht is, of verplicht zou zijn geweest indien hij
      een geconsolideerde jaarrekening had opgesteld, om de activa, passiva, inkomsten, uitgaven en kasstromen van de
      entiteit integraal te consolideren, waarbij een hoofdentiteit wordt geacht het controlerend belang te houden in
      haar vaste inrichting;
        - *coöperatie:* een entiteit die collectief goederen en diensten namens haar leden verhandelt of verwerft en die in
      de staat waarin zij is gevestigd is onderworpen aan een belastingregime dat voorziet in belastingneutraliteit met
      betrekking tot goederen of diensten die door de leden via de coöperatie worden verkocht of verworven;
        - *derde staat:* een staat die geen lidstaat is van de Europese Unie;
        - *doorkijkentiteit:* een entiteit voor zover die fiscaal transparant is met betrekking tot haar inkomsten,
      uitgaven, winsten of verliezen in de staat naar het recht waarvan zij is opgericht, tenzij zij volgens de fiscale
      regelgeving van een andere staat aldaar als inwoner is onderworpen aan een betrokken belasting, waarbij die
      entiteit wordt aangemerkt als een: a. fiscaal transparante entiteit met betrekking tot haar inkomsten, uitgaven,
      winsten of verliezen voor zover zij fiscaal transparant is in de staat waarin haar belanghouders wonen of zijn
      gevestigd; b. omgekeerde hybride entiteit met betrekking tot haar inkomsten, uitgaven, winsten of verliezen voor
      zover zij niet fiscaal transparant is in de staat waarin haar belanghouders wonen of zijn gevestigd;
        - *entiteit:* een rechtsfiguur die een afzonderlijke financiële verslaggeving opstelt of een rechtspersoon, niet
      zijnde een overheid, daaronder mede begrepen een staatkundig onderdeel of lokale autoriteit van een overheid;
        - *financiële verslaggeving:* de gegevens gebruikt door een entiteit bij de totstandkoming van de geconsolideerde
      jaarrekening;
        - *fiscaal transparante structuur:* een keten van doorkijkentiteiten als bedoeld in onderdeel a van de definitie
      van doorkijkentiteit door middel waarvan een belang wordt gehouden in een groepsentiteit;
        - *geaccepteerde financiële verslaggevingsstandaard:* een internationale standaard voor financiële verslaggeving
      (IFRS of IFRS zoals goedgekeurd door de EU overeenkomstig [Verordening (EG) nr. 1606/2002](32002R1606) van het
      Europees Parlement en de Raad van de Europese Unie van 19 juli 2002 betreffende de toepassing van internationale
      standaarden voor jaarrekeningen (PbEG 2002, L 243)) en de set aan algemeen aanvaarde verslaggevingsbeginselen
      van het Gemenebest van Australië, de Federale Republiek Brazilië, Canada, de lidstaten van de Europese Unie, de
      lidstaten van de Europese Economische Ruimte, Hongkong (China), Japan, de Verenigde Mexicaanse Staten, Nieuw-
      Zeeland, de Volksrepubliek China, de Republiek India, de Republiek Korea, de Russische Federatie, de Republiek
      Singapore, de Zwitserse Bondsstaat, het Verenigd Koninkrijk van Groot-Brittannië en Noord-Ierland, en de Verenigde
      Staten van Amerika;
        - *geautoriseerde financiële verslaggevingsstandaard:* een set aan algemeen aanvaarde verslaggevingsbeginselen
      toegestaan door een organisatie met juridische autoriteit om verslaggevingsregels voor te schrijven, vast te
      stellen of te aanvaarden voor toepassing van de financiële rapportage in de staat waarin een entiteit is gevestigd;
        - *geconsolideerde jaarrekening:* a. voor een groep als bedoeld in onderdeel a van de definitie van groep:
      de jaarrekening die is opgesteld door een entiteit in overeenstemming met de geaccepteerde financiële
      verslaggevingsstandaard, waarin de activa, passiva, inkomsten, uitgaven en kasstromen van die entiteit en
      alle entiteiten waarin zij een controlerend belang heeft, zijn weergegeven als die van een enkele economische
      eenheid; b. voor een groep als bedoeld in onderdeel b van de definitie van groep: de jaarrekening opgesteld
      door de desbetreffende entiteit in overeenstemming met een geaccepteerde financiële verslaggevingsstandaard;
      c. voor een groep als bedoeld in de onderdelen a en b van de definitie van groep, indien de jaarrekening die
      is opgesteld door een uiteindelijkemoederentiteit niet in overeenstemming is met een geaccepteerde financiële
      verslaggevingsstandaard: de jaarrekening die is opgesteld in overeenstemming met een geautoriseerde financiële
      verslaggevingsstandaard waarin de activa, passiva, inkomsten, uitgaven en kasstromen van die entiteit en
      alle entiteiten waarin zij een controlerend belang heeft, zijn weergegeven als die van een enkele economische
      eenheid en waarbij de gegevens in de financiële verslaggeving zijn gecorrigeerd om elke vorm van materiële
      concurrentieverstoring te voorkomen; of d. voor een groep als bedoeld in de onderdelen a en b van de definitie van
      groep, indien de uiteindelijkemoederentiteit geen jaarrekening opstelt in overeenstemming met een geaccepteerde
      financiële verslaggevingsstandaard of een geautoriseerde financiële verslaggevingsstandaard als bedoeld in de
      onderdelen a, b of c: de jaarrekening waarin de activa, passiva, inkomsten, uitgaven en kasstromen van die entiteit
      en alle entiteiten waarin zij een controlerend belang heeft, zijn weergegeven als die van een enkele economische
      eenheid en die, indien de uiteindelijkemoederentiteit daartoe verplicht zou zijn geweest, zou zijn opgesteld
      in overeenstemming met een geaccepteerde financiële verslaggevingsstandaard of een geautoriseerde financiële
      verslaggevingsstandaard, mits voor wat betreft een geautoriseerde financiële verslaggevingsstandaard de gegevens in
      de financiële verslaggeving zijn gecorrigeerd om elke vorm van materiële concurrentieverstoring te voorkomen;
        - *gereduceerd kwalificerend belang:* het bedrag dat door de houder van een kwalificerend belang is geïnvesteerd in
      dit belang, verminderd met het gezamenlijke bedrag in een verslagjaar en de aan dat jaar voorafgaande verslagjaren
      aan: a. kwalificerende doorgeleide belastingvoordelen die bij de houder van het kwalificerende belang als een
      vermeerdering van de betrokken belastingen in aanmerking zijn genomen; b. uitdelingen door de doorkijkentiteit
      waarin het kwalificerende belang wordt gehouden aan de houder van het kwalificerende belang; of c. opbrengsten
      behaald met de vervreemding van het kwalificerende belang of een deel daarvan;
        - *groep:* a. een geheel van entiteiten die met elkaar verbonden zijn door eigendom of zeggenschap zoals omschreven
      in de geaccepteerde of geautoriseerde financiële verslaggevingsstandaard voor de opstelling van een geconsolideerde
      jaarrekening door de uiteindelijkemoederentiteit, inclusief iedere entiteit die enkel op grond van haar beperkte
      omvang, op grond van materialiteit, of op grond van het feit dat zij ter verkoop wordt gehouden, niet is opgenomen
      in die geconsolideerde jaarrekening; of b. een entiteit die een of meer vaste inrichtingen heeft, mits die entiteit
      geen onderdeel vormt van een groep als bedoeld in onderdeel a;
        - *groepsentiteit:* a. een entiteit die onderdeel is van een multinationale groep of binnenlandse groep; b. een
      vaste inrichting van een hoofdentiteit die onderdeel is van een multinationale groep;
        - *groepsentiteit-belanghouder:* een groepsentiteit die onmiddellijk of middellijk een belang heeft in een andere
      groepsentiteit die tot dezelfde multinationale groep of binnenlandse groep behoort;
        - *hoofdentiteit:* een entiteit die de nettowinst of het nettoverlies van een vaste inrichting opneemt in haar
      jaarrekening;
        - *in aanmerking komend uitdelingsbelastingstelsel:* een winstbelastingstelsel: a. op grond waarvan alleen
      belasting naar het inkomen wordt geheven over winsten indien deze worden uitgedeeld of worden geacht te zijn
      uitgedeeld aan aandeelhouders of wanneer een lichaam bepaalde niet-zakelijke uitgaven doet; b. op grond waarvan
      belasting wordt geheven tegen een tarief dat ten minste gelijk is aan het minimumbelastingtarief; en c. dat van
      kracht was op of vóór 1 juli 2021;
        - *informatieaangifte-indienende groepsentiteit:* een entiteit die in overeenstemming met [artikel 13.1][ref4] een
      bijheffing-informatieaangifte indient;
        - *internationale organisatie:* een intergouvernementele organisatie, een supranationale organisatie, of een
      agentschap of instantie waarvan het gehele belang wordt gehouden door een intergouvernementele of supranationale
      organisatie, en die organisatie, dat agentschap of die instantie: a. voornamelijk bestaat uit overheden, daaronder
      mede begrepen staatkundige onderdelen of lokale autoriteiten van overheden; b. met de staat waarin zij of het is
      gevestigd een van kracht zijnde hoofdkantoorovereenkomst heeft of een in wezen soortgelijke overeenkomst, waaronder
      in ieder geval wordt verstaan een regeling die de kantoren of vestigingen van een organisatie in de staat waarin
      zij is gevestigd voorrechten en immuniteiten verleend; en c. statuten heeft waaruit blijkt, of onderworpen is aan
      regelgeving waaruit volgt, dat het inkomen van de organisatie, het agentschap of de instantie niet toekomt aan
      private personen;
        - *joint venture:* een entiteit waarvan de financiële resultaten worden verantwoord op basis van de
      nettovermogenswaardemethode in de geconsolideerde jaarrekening van een uiteindelijkemoederentiteit, mits die
      uiteindelijkemoederentiteit onmiddellijk of middellijk een belang van ten minste 50% in die entiteit heeft, tenzij
      die entiteit: a. een uiteindelijkemoederentiteit is van een multinationale groep of binnenlandse groep die een
      kwalificerende inkomen-inclusiemaatregel moet toepassen; b. een uitgesloten entiteit is; c. een entiteit waarvan
      het belang onmiddellijk wordt gehouden door een uitgesloten entiteit en: 1°. die entiteit uitsluitend of nagenoeg
      uitsluitend activa aanhoudt of middelen belegt ten behoeve van haar investeerders; 2°. die entiteit activiteiten
      uitoefent die ondergeschikt zijn aan de activiteiten die de uitgesloten entiteit uitoefent; of 3°. nagenoeg al
      het inkomen van die entiteit niet in aanmerking wordt genomen bij de berekening van het kwalificerende inkomen
      of verlies op de voet van [artikel 6.2, eerste lid, onderdeel b, onderscheidenlijk onderdeel c][ref5]; d. een
      entiteit is die wordt gehouden door een multinationale groep of binnenlandse groep die uitsluitend bestaat uit
      uitgesloten entiteiten; of e. een met een joint venture verbonden partij is;
        - *joint venture-groep:* een joint venture en een of meer met een joint venture verbonden partijen gezamenlijk;
        - *kwalificerend belang:* een belang in een doorkijkentiteit dat is opgenomen in de financiële verslaggeving
      met toepassing van een andere methode dan die waarbij de activa, passiva, inkomsten, uitgaven en kasstromen van
      die entiteit integraal worden geconsolideerd en ten aanzien waarvan het totale rendement zonder kwalificerend
      doorgeleid belastingvoordeel naar verwachting minder bedraagt dan het totale bedrag dat door de houder van dit
      belang in dit belang is geïnvesteerd;
        - *kwalificerend doorgeleid belastingvoordeel:* een bedrag dat bestaat uit: a. een belastingtegoed dat tot
      uitdrukking komt bij de houder van een kwalificerend belang; of b. verrekenbare verliezen die tot uitdrukking komen
      bij de houder van een kwalificerend belang vermenigvuldigd met het toepasselijke nominale belastingtarief;
        - *kwalificerend inkomen of verlies:* de nettowinst of het nettoverlies uit de financiële verslaggeving van een
      groepsentiteit, aangepast in overeenstemming met de regels in de [hoofdstukken 6][ref6], [9][ref7] en [10][ref8];
        - *kwalificerende binnenlandse bijheffing:* een belasting die is geïmplementeerd in het nationale recht van
      een staat, mits die staat geen voordelen toekent die gerelateerd zijn aan die belasting, die: a. voorziet in de
      vaststelling van de overwinst van de groepsentiteiten in die staat en de toepassing van het bijheffingspercentage
      op die overwinst in overeenstemming met de maatregelen uit [Richtlijn (EU) 2022/2523](32022L2523) of, met
      betrekking tot derde staten, de OESO-modelregels, met dien verstande dat het bijheffingspercentage dient te worden
      vastgesteld op basis van het in overeenstemming met [artikel 7.5, negende lid][ref9], berekende effectieve tarief
      voor Nederland of een daarmee vergelijkbare bepaling voor andere staten; en b. wordt toegepast op een manier die
      consistent is met de maatregelen uit [Richtlijn (EU) 2022/2523](32022L2523) of, met betrekking tot derde staten, de
      OESO-modelregels;
        - *kwalificerende inkomen-inclusiemaatregel:* een set maatregelen die geïmplementeerd is in het nationale
      recht van een staat, mits die staat geen voordelen toekent die gerelateerd zijn aan die set maatregelen, die:
      a. gelijkwaardig is aan de maatregelen die zijn opgenomen in [Richtlijn (EU) 2022/2523](32022L2523) of, met
      betrekking tot derde staten, in de OESO-modelregels, en op grond waarvan de moederentiteit van een multinationale
      groep of binnenlandse groep het aan haar toerekenbare bedrag van de bijheffing met betrekking tot de laagbelaste
      groepsentiteiten berekent en betaalt; en b. wordt toegepast op een wijze die consistent is met de maatregelen
      die zijn opgenomen in [Richtlijn (EU) 2022/2523](32022L2523) of, met betrekking tot derde staten, in de OESO-
      modelregels;
        - *kwalificerende onderbelastewinstmaatregel:* een set maatregelen die in het nationale recht van een staat is
      geïmplementeerd, mits die staat geen voordelen toekent die gerelateerd zijn aan die set maatregelen, die: a.
      gelijkwaardig is aan de maatregelen die zijn opgenomen in [Richtlijn (EU) 2022/2523](32022L2523) of, met betrekking
      tot derde staten, in de OESO-modelregels, op grond waarvan die staat het aan hem toerekenbare bedrag aan bijheffing
      van een multinationale groep int dat niet is geheven op grond van een kwalificerende inkomen-inclusiemaatregel met
      betrekking tot de laagbelaste groepsentiteiten van die multinationale groep; b. wordt toegepast op een wijze die
      consistent is met de maatregelen die zijn opgenomen in [Richtlijn (EU) 2022/2523](32022L2523) of, met betrekking
      tot derde staten, in de OESO-modelregels;
        - *kwalificerend restitueerbaar belastingtegoed:* een restitueerbaar belastingtegoed, daaronder niet begrepen
      bedragen aan belasting die restitueerbaar of verrekenbaar zijn op grond van een kwalificerende imputatiebelasting
      of een niet-kwalificerende restitueerbare imputatiebelasting, dat binnen vier jaar na de datum waarop het recht
      van een groepsentiteit op dat tegoed op grond van de regelgeving van de staat die het tegoed verleent is ontstaan,
      betaald moet worden aan die groepsentiteit in de vorm van geld of een kasequivalent of, indien het tegoed
      gedeeltelijk restitueerbaar is, het deel van het tegoed dat binnen die vier jaar betaalbaar is in de vorm van geld
      of een kasequivalent;
        - *laagbelaste groepsentiteit:* a. een groepsentiteit van een multinationale groep of binnenlandse groep
      die gevestigd is in een laagbelastende staat; of b. een staatloze groepsentiteit die, met betrekking tot een
      verslagjaar, kwalificerend inkomen heeft en ten aanzien waarvan het overeenkomstig [artikel 8.1][ref10] bepaalde
      effectieve belastingtarief lager is dan het minimumbelastingtarief;
        - *laagbelastende staat:* een staat waarin een multinationale groep of binnenlandse groep in een verslagjaar een
      netto kwalificerend inkomen heeft ten aanzien waarvan het overeenkomstig [artikel 8.1][ref11] bepaalde effectieve
      belastingtarief lager is dan het minimumbelastingtarief;
        - *materiële concurrentieverstoring:* de toepassing van een set aan algemeen aanvaarde verslaggevingsbeginselen
      die resulteert in een totale afwijking van de inkomsten of de kosten van meer dan € 75.000.000 in een verslagjaar
      voor een multinationale groep of binnenlandse groep in vergelijking met het bedrag dat vastgesteld zou zijn onder
      toepassing van een vergelijkbaar beginsel of een vergelijkbare procedure volgens IFRS of IFRS zoals goedgekeurd
      door de EU overeenkomstig [Verordening (EG) nr. 1606/2002](32002R1606) van het Europees Parlement en de Raad van de
      Europese Unie van 19 juli 2002 betreffende de toepassing van internationale standaarden voor jaarrekeningen (PbEG
      2002, L 243);
        - *met een joint venture verbonden partij:* a. een entiteit waarvan de activa, passiva, inkomsten, uitgaven
      en kasstromen worden geconsolideerd door een joint venture op basis van een geaccepteerde financiële
      verslaggevingsstandaard of zouden worden geconsolideerd indien een geaccepteerde financiële verslaggevingsstandaard
      zou worden toegepast; of b. een vaste inrichting waarvan de hoofdentiteit een joint venture of een met een
      joint venture verbonden partij is, in welk geval de vaste inrichting als een afzonderlijke met een joint venture
      verbonden partij wordt beschouwd;
        - *minimumbelastingtarief:* 15%;
        - *moederentiteit:* een uiteindelijkemoederentiteit die geen uitgesloten entiteit is, een tussenliggende
      moederentiteit of een partieel gehouden moederentiteit;
        - *multinationale groep:* een groep die ten minste één entiteit of vaste inrichting omvat die niet is gevestigd,
      onderscheidenlijk gelegen, in de staat waarin de uiteindelijkemoederentiteit is gevestigd;
        - *nettoboekwaarde van materiële activa:* het gemiddelde van de begin- en eindwaarde van materiële activa, rekening
      houdend met geaccumuleerde afschrijvingen, waardeverminderingen en afwaarderingen, zoals opgenomen in de financiële
      verslaggeving;
        - *niet-kwalificerend restitueerbaar belastingtegoed:* een belastingtegoed, niet zijnde een kwalificerend
      restitueerbaar belastingtegoed, dat geheel of gedeeltelijk restitueerbaar is;
        - *niet-kwalificerende restitueerbare imputatiebelasting:* iedere belasting over winst, niet zijnde een
      kwalificerende imputatiebelasting als bedoeld in het derde lid, die is toegerekend aan of betaald door
      een groepsentiteit en die bij uitdeling van die winst in de vorm van dividend door die groepsentiteit: a.
      restitueerbaar is aan de uiteindelijk gerechtigde van het dividend; b. door de uiteindelijk gerechtigde van het
      dividend verrekenbaar is met verschuldigde belasting die niet verschuldigd is ter zake van dat dividend; of c. aan
      een aandeelhouder, restitueerbaar is aan de uitdelende groepsentiteit;
        - *non-profitorganisatie:* een entiteit die geen handels- of bedrijfsmatige activiteit verricht die niet direct
      samenhangt met het doel waarvoor zij is opgericht, en: a. die is opgericht en in de staat waarin zij is gevestigd
      wordt gedreven voor uitsluitend religieuze, charitatieve, wetenschappelijke, artistieke, culturele, sportieve,
      educatieve of andere soortgelijke doeleinden, dan wel is opgericht en in de staat waarin zij is gevestigd wordt
      gedreven als een professionele organisatie, bedrijfsvereniging, kamer van koophandel, arbeidsorganisatie, land- of
      tuinbouworganisatie, burgerorganisatie of als een organisatie uitsluitend ter bevordering van het sociale welzijn;
      b. waarvan nagenoeg al het inkomen uit de activiteiten, bedoeld onder a, is vrijgesteld van belasting naar het
      inkomen in de staat waarin zij is gevestigd; c. die geen aandeelhouders of leden heeft die een eigendomsrecht of
      een recht van vruchtgebruik hebben op haar inkomsten of activa; d. waarvan de inkomsten of de activa niet mogen
      worden uitgedeeld aan of worden aangewend ten voordele van een private persoon of een niet-charitatieve entiteit,
      behalve voor de uitvoering van charitatieve activiteiten van de entiteit, als betaling van een redelijke vergoeding
      voor verleende diensten of voor het gebruik van een bezitting of kapitaal, of als betaling die de marktwaarde van
      een bezitting vertegenwoordigt die de entiteit heeft gekocht; en e. die bij beëindiging van haar activiteiten of
      bij liquidatie of ontbinding al haar activa dient uit te delen of toe te laten komen aan een non-profitorganisatie,
      aan de overheid van de staat waarin zij is gevestigd, daaronder mede begrepen een staatkundig onderdeel of lokale
      autoriteit van die overheid, of aan een overheidsentiteit;
        - *OESO-commentaar:* het commentaar bij de OESO-modelregels zoals goedgekeurd op 11 maart 2022 met als citeertitel:
      «OECD (2022), Tax Challenges Arising from the Digitalisation of the Economy – Commentary to the Global Anti-Base
      Erosion Model Rules (Pillar Two), First Edition: Inclusive Framework on BEPS, OECD Publishing, Paris»;
        - *OESO-modelregels:* de modelregels zoals goedgekeurd op 14 december 2021 met als citeertitel: «OECD (2021), Tax
      Challenges Arising from the Digitalisation of the Economy - Global Anti-Base Erosion Model Rules (Pillar Two):
      Inclusive Framework on BEPS, OECD Publishing, Paris»;
        - *OESO-modelverdrag:* de versie van het modelverdrag tot het vermijden van dubbele belasting en het voorkomen
      van het ontgaan of ontwijken van belasting met betrekking tot belastingen naar het inkomen of vermogen van de
      Organisatie voor Economische Samenwerking en Ontwikkeling van 21 november 2017;
        - *overheidsentiteit:* een entiteit die deel uitmaakt van of volledig wordt gehouden door een overheid, daaronder
      mede begrepen een staatkundig onderdeel of lokale autoriteit van een overheid, en: a. die geen handels- of
      bedrijfsmatige activiteiten verricht en als voornaamste doel heeft het vervullen van een overheidsfunctie of
      het beheren of beleggen van activa van die overheid of de staat door het plaatsen en aanhouden van beleggingen,
      vermogensbeheer en het verrichten van daarmee verband houdende beleggingsactiviteiten met betrekking tot die
      activa; b. die verantwoording moet afleggen aan die overheid met betrekking tot haar algehele prestaties en
      jaarlijks informatieverslagen verstrekt aan die overheid; en c. waarvan de activa bij ontbinding toekomen aan die
      overheid en, voor zover die entiteit netto-inkomen uitdeelt, dat netto-inkomen toekomt aan die overheid;
        - *partieel gehouden moederentiteit:* een groepsentiteit, die geen uiteindelijkemoederentiteit, vaste inrichting,
      beleggingsentiteit of verzekeringsbeleggingsentiteit is, die onmiddellijk of middellijk een belang heeft in een
      andere groepsentiteit van dezelfde multinationale groep of binnenlandse groep en waarvan het belang in de winsten
      voor meer dan 20%, onmiddellijk of middellijk, wordt gehouden door een of meer natuurlijk personen of entiteiten
      die geen groepsentiteiten van de multinationale groep of binnenlandse groep zijn;
        - *pensioendienstverleningsentiteit:* een entiteit die is opgericht en wordt gedreven om uitsluitend of nagenoeg
      uitsluitend te beleggen ten behoeve van entiteiten als bedoeld in onderdeel a van de definitie van pensioenfonds
      of een entiteit die is opgericht en wordt gedreven om uitsluitend of nagenoeg uitsluitend activiteiten te
      verrichten die aanvullend zijn aan de gereglementeerde activiteiten, bedoeld in onderdeel a van de definitie van
      pensioenfonds, en die deel uitmaakt van dezelfde groep als de entiteiten die deze gereglementeerde activiteiten
      verrichten;
        - *pensioenfonds:* a. een entiteit die in een staat is opgericht en wordt gedreven uitsluitend of nagenoeg
      uitsluitend ten behoeve van het beheer of het verstrekken van pensioenvoorzieningen en aanvullende of incidentele
      voorzieningen aan natuurlijk personen en die gereglementeerd is door die staat of door een van zijn staatkundige
      onderdelen of lokale autoriteiten, dan wel waarvan de voorzieningen zijn verzekerd of op ander wijze zijn beschermd
      door nationale regelgeving en gefinancierd zijn door activa die worden gehouden via een fiduciaire overeenkomst of
      een beheerder om te verzekeren dat de pensioenverplichtingen worden nagekomen in het geval van insolventie van de
      multinationale groep of binnenlandse groep; b. een pensioendienstverleningsentiteit;
        - *Richtlijn (EU) 2022/2523:* [Richtlijn (EU) 2022/2523](32022L2523) van de Raad van 14 december 2022 tot
      waarborging van een mondiaal minimumniveau van belastingheffing voor groepen van multinationale ondernemingen en
      omvangrijke binnenlandse groepen in de Unie (PbEU 2022, L 328/1);
        - *tussenliggende moederentiteit:* een groepsentiteit, die geen uiteindelijkemoederentiteit, partieel gehouden
      moederentiteit, vaste inrichting, beleggingsentiteit of verzekeringsbeleggingsentiteit is, die onmiddellijk of
      middellijk een belang heeft in een andere groepsentiteit behorend tot dezelfde multinationale groep of binnenlandse
      groep;
        - *uiteindelijkemoederentiteit:* a. een entiteit die onmiddellijk of middellijk een controlerend belang heeft in
      een andere entiteit en waarin geen andere entiteit onmiddellijk of middellijk een controlerend belang heeft; b. de
      hoofdentiteit van een groep als bedoeld in onderdeel b van de definitie van groep;
        - *vaste inrichting:* a. een bedrijfsinrichting of een daarmee gelijkgestelde inrichting die is gelegen in een
      staat waar die bedrijfsinrichting, onderscheidenlijk een daarmee gelijkgestelde inrichting, wordt behandeld als een
      vaste inrichting in overeenstemming met een van toepassing zijnd belastingverdrag, mits die staat het inkomen dat
      toerekenbaar is aan die inrichting in aanmerking neemt op grond van een bepaling die vergelijkbaar is met artikel 7
      van het OESO-modelverdrag; b. indien geen belastingverdrag van toepassing is: een bedrijfsinrichting of een daarmee
      gelijkgestelde inrichting die is gelegen in een staat die het inkomen dat toerekenbaar is aan die inrichting
      belast op een nettobasis op een manier die vergelijkbaar is met de belastingheffing van entiteiten die hun fiscale
      vestigingsplaats in die staat hebben; c. indien een staat geen vennootschapsbelastingsysteem heeft: een in die
      staat gelegen bedrijfsinrichting of een daarmee gelijkgestelde inrichting die overeenkomstig het OESO-modelverdrag
      als een vaste inrichting zou zijn aangemerkt, mits die staat het recht zou hebben gehad om het overeenkomstig
      artikel 7 van dat modelverdrag aan die bedrijfsinrichting toerekenbare inkomen in de belastingheffing te betrekken;
      of d. een bedrijfsinrichting of een daarmee gelijkgestelde inrichting, anders dan die bedoeld in de onderdelen
      a tot en met c, waarmee activiteiten worden verricht buiten de staat waarin de entiteit die de nettowinst of
      het nettoverlies van die inrichting opneemt in haar jaarrekening is gevestigd, mits die staat het inkomen dat
      toerekenbaar is aan die activiteiten vrijstelt;
        - *vastgoedbeleggingsvehikel:* een wijdverbreid gehouden entiteit die overwegend vastgoed houdt en waarvan het
      inkomen op één niveau, van de entiteit of van haar belanghouders, wordt belast met hooguit één jaar uitgestelde
      belastingheffing;
        - *verslagjaar:* de verslagleggingsperiode waarover de uiteindelijkemoederentiteit van een multinationale groep
      of binnenlandse groep haar geconsolideerde jaarrekening opstelt of, indien de uiteindelijkemoederentiteit geen
      geconsolideerde jaarrekening opstelt, het kalenderjaar;
        - *verzekeringsbeleggingsentiteit:* een entiteit die zou voldoen aan de definitie van een beleggingsfonds of een
      vastgoedbeleggingsvehikel als deze entiteit niet zou zijn opgericht in verband met verplichtingen uit hoofde van
      verzekerings- of lijfrenteovereenkomsten en niet volledig zou worden gehouden door een entiteit die in de staat
      waar zij is gevestigd, is onderworpen aan regelgeving voor verzekeringsmaatschappijen.


