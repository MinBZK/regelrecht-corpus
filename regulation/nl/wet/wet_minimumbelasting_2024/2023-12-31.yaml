  - number: 8.12.b
    text: |-
      hij de informatieaangifte-indienende groepsentiteit binnen 36 maanden nadat de bijheffing-informatieaangifte voor
      dat verslagjaar is ingediend op de hoogte stelt van specifieke feiten en omstandigheden die mogelijk een materieel
      effect hebben op de toepassing van de [artikelen 8.8][ref1], [8.11][ref2], [8.13][ref3], onderscheidenlijk
      [8.14][ref4], en verzoekt om het effect van die feiten en omstandigheden op de toepassing van de artikelen 8.8,
      8.11, 8.13, onderscheidenlijk 8.14, te verduidelijken; en


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0049111#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0049111#Artikel8
