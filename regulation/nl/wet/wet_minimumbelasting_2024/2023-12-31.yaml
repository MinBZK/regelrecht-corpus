      - id: ref4
        bwb_id: BWBR0049111
        artikel: '4'
        hoofdstuk: '4'
      - id: ref5
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
      - id: ref6
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 13.1.6.b
    text: |-
      alle informatie die nodig is voor de toepassing van [artikel 5.1, eerste lid, onderdeel b, onder 2°][ref1],
      waaronder:


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel5
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel13.1
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '5'
        hoofdstuk: '5'
  - number: 13.1.6.b.1°
    text: |-
      identificatie van de groepsentiteiten die zijn gevestigd in de staat waarin de uiteindelijkemoederentiteit is
      gevestigd en de structuur van de belangen in die groepsentiteiten;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel13.1
  - number: 13.1.6.b.2°
    text: |-
      alle informatie die nodig is om het effectieve belastingtarief te bepalen in de staat waarin de
      uiteindelijkemoederentiteit is gevestigd en om de verschuldigde bijheffing te bepalen; en
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel13.1
  - number: 13.1.6.b.3°
    text: |-
      alle informatie die nodig is voor de toerekening van een dergelijke bijheffing gebaseerd op de in
      [artikel 5.2][ref1] bedoelde toerekeningsformule van de onderbelastewinstbijheffing;


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel5
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel13.1
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '5'
        hoofdstuk: '5'
  - number: 13.1.6.c
    text: alle informatie die nodig is voor de toepassing van een kwalificerende binnenlandse bijheffing.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel13.1
  - number: 13.1.7
    text: |-
      De bijheffing-informatieaangifte en de kennisgeving, bedoeld in het vierde lid, worden uiterlijk vijftien maanden
      na afloop van het verslagjaar ingediend bij de inspecteur.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel13.1
  - number: 13.2.1
    text: |-
      De keuze, bedoeld in de [artikelen 2.2, vierde lid][ref1], [6.2, vijfde lid][ref2], [6.3, eerste lid][ref3],
      [6.6, eerste lid][ref4], [6.9, eerste lid][ref5], [10.5, eerste lid][ref6], en [10.6, eerste lid][ref7], geldt voor
      een periode van vijf verslagjaren, welke periode aanvangt op de eerste dag van het verslagjaar waarvoor die keuze
      is gemaakt. De keuze wordt automatisch verlengd, tenzij de informatieaangifte-indienende groepsentiteit de keuze
      herroept na de vijfjaarsperiode. Een herroeping van de keuze geldt voor een periode van vijf verslagjaren, die
      aanvangt op de eerste dag van het verslagjaar waarvoor de keuze wordt herroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel2
