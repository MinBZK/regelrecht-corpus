  - number: 8.13.1
    text: |-
      Indien de informatieaangifte-indienende groepsentiteit van een multinationale groep daarvoor kiest, bedraagt de
      bijheffing voor de in een staat gevestigde groepsentiteiten voor een verslagjaar nihil, mits die groepsentiteiten
      over dat verslagjaar onderworpen zijn aan een kwalificerende binnenlandse bijheffing die voldoet aan:
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.13
  - number: 8.13.1.a
    text: de kwalificerende verslaggevingsstandaard;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.13
  - number: 8.13.1.b
    text: de consistentiestandaard; en
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.13
  - number: 8.13.1.c
    text: de toepassingsstandaard.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.13
  - number: 8.13.2
    text: 'Onder de kwalificerende verslaggevingsstandaard wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.13
  - number: 8.13.2.a
    text: |-
      de financiële verslaggevingsstandaard die is gebruikt bij het opstellen van de geconsolideerde jaarrekening van
      de uiteindelijkemoederentiteit;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.13
  - number: 8.13.2.b
    text: |-
      een andere geaccepteerde of geautoriseerde verslaggevingsstandaard overeenkomstig [artikel 6.1, tweede lid][ref1];
      of


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel6
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.13
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '6'
        hoofdstuk: '6'
  - number: 8.13.2.c
    text: de lokale financiële verslaggevingsstandaard.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.13
  - number: 8.13.3
    text: |-
      De kwalificerende binnenlandse bijheffing wordt alleen berekend op basis van de lokale financiële
      verslaggevingsstandaard als de financiële verslaggeving van de in die staat gevestigde groepsentiteiten is
      opgesteld op basis van de lokale verslaggevingsstandaard en:
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.13
  - number: 8.13.3.a
    text: |-
      zij op grond van nationale regelgeving verplicht zijn om die financiële verslaggeving bij te houden of te
      gebruiken; of
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.13
  - number: 8.13.3.b
    text: de financiële verslaggeving is onderworpen aan externe financiële controle.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.13
  - number: 8.13.4
    text: |-
      In afwijking van de berekening van het derde lid wordt de kwalificerende binnenlandse bijheffing berekend op basis
      van de financiële verslaggevingsstandaard die is gebruikt bij het opstellen van de geconsolideerde jaarrekening van
      de uiteindelijkemoederentiteit of een andere geaccepteerde of geautoriseerde verslaggevingsstandaard overeenkomstig
      [artikel 6.1, tweede lid][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel6
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.13
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '6'
        hoofdstuk: '6'
  - number: 8.13.4.a
    text: niet alle in die staat gevestigde groepsentiteiten voldoen aan de voorwaarden van het derde lid; of
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.13
  - number: 8.13.4.b
    text: |-
      het verslagjaar van de financiële verslaggeving die is opgesteld op basis van de lokale financiële
      verslaggevingstandaard afwijkt van het verslagjaar van de geconsolideerde jaarrekening van de multinationale groep.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.13
  - number: 8.13.5
    text: |-
      Voor een joint venture, een joint venture-groep, een in minderheidsbelang gehouden subgroep, een in
      minderheidsbelang gehouden groepsentiteit of beleggingsentiteit worden het eerste tot en met het vierde lid,
      afzonderlijk toegepast.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.13
  - number: 8.13.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voor de toepassing van het eerste lid, onderdelen b en c,
      regels gesteld voor de beoordeling of wordt voldaan aan de consistentiestandaard en de toepassingsstandaard.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.13
  - number: 8.13.7
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld op grond waarvan dit artikel niet van
      toepassing is ten aanzien van bepaalde groepsentiteiten.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.13
  - number: 8.13.8
    text: |-
      Voor de toepassing van dit artikel wordt onder lokale financiële verslaggevingstandaard verstaan: een financiële
      verslaggevingsstandaard die wordt voorgeschreven of toegestaan in een staat op basis van nationale regelgeving of
      door een organisatie met juridische autoriteit om verslaggevingsregels voor te schrijven, vast te stellen of te
      aanvaarden voor de toepassing van de financiële rapportage, mits die financiële verslaggevingsstandaard:
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.13
  - number: 8.13.8.a
    text: een geaccepteerde financiële verslaggevingsstandaard is; of
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.13
  - number: 8.13.8.b
    text: |-
      een geautoriseerde financiële verslaggevingsstandaard is waarbij de gegevens in de financiële verslaggeving zijn
      gecorrigeerd om elke vorm van materiële concurrentieverstoring te voorkomen.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.13
  - number: '8.14'
    text: |-
      Indien de informatieaangifte-indienende groepsentiteit van een multinationale groep daarvoor kiest, bedraagt voor
      de toepassing van [artikel 5.2, tweede lid][ref1], de bijheffing voor iedere laagbelaste groepsentiteit die is
      gevestigd in de staat waarin de uiteindelijkemoederentiteit is gevestigd voor een verslagjaar nihil, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel5
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.14
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '5'
        hoofdstuk: '5'
  - number: 8.14.a
    text: |-
      het verslagjaar niet langer is dan een periode van twaalf maanden en aanvangt op of voor 31 december 2025 en
      eindigt voor 31 december 2026; en
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.14
  - number: 8.14.b
    text: |-
      in de staat van vestiging een belasting naar de winst van toepassing is naar een statutair tarief van ten minste
      20%.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.14
  - number: 9.1.1
    text: |-
      Indien twee of meer groepen in een van de vier onmiddellijk aan het verslagjaar voorafgaande verslagjaren zijn
      gefuseerd tot een multinationale groep of binnenlandse groep, wordt de omzetdrempel voor die multinationale
      groep of binnenlandse groep in een aan de fusie voorafgaand verslagjaar geacht te zijn bereikt indien de som
      van de omzet van de groepen in dat verslagjaar, zoals verantwoord in de geconsolideerde jaarrekeningen van de
      uiteindelijkemoederentiteiten van die groepen, € 750.000.000 of meer bedraagt.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel9.1
  - number: 9.1.2
    text: |-
      Indien in een verslagjaar een niet tot een groep behorende entiteit fuseert met een andere niet tot een groep
      behorende entiteit of met een groep tot een multinationale groep of binnenlandse groep, en een van deze of beide
      fuserende partijen geen geconsolideerde jaarrekening opstelt, onderscheidenlijk opstellen, in een van de vier
      onmiddellijk aan het verslagjaar voorafgaande verslagjaren, wordt de omzetdrempel voor die multinationale groep
      of binnenlandse groep in een aan de fusie voorafgaand jaar verslagjaar geacht te zijn bereikt indien de som van
      de omzet van de fuserende partijen in dat verslagjaar, zoals verantwoord in de enkelvoudige jaarrekening of de
      geconsolideerde jaarrekening, € 750.000.000 of meer bedraagt.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel9.1
  - number: 9.1.3
    text: |-
      Indien in een verslagjaar een multinationale groep of binnenlandse groep wordt gesplitst in twee of meer van
      dergelijke groepen (elk een gesplitste groep), wordt de omzetdrempel door een gesplitste groep geacht te zijn
      bereikt:
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel9.1
  - number: 9.1.3.a
    text: |-
      met betrekking tot het verslagjaar waarin de splitsing plaatsvindt, indien de gesplitste groep in dat verslagjaar
      een omzet van € 750.000.000 of meer behaalt, in welk geval de gesplitste groep geacht wordt die omzet ook in ten
      minste twee van de vier onmiddellijk aan het verslagjaar voorafgaande verslagjaren te hebben behaald;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel9.1
  - number: 9.1.3.b
    text: |-
      met betrekking tot de drie verslagjaren na het verslagjaar waarin de splitsing plaatsvindt, indien de gesplitste
      groep een omzet van € 750.000.000 of meer behaalt in ten minste twee verslagjaren van het verslagjaar waarin de
      splitsing plaatsvindt en de drie verslagjaren daarna.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel9.1
  - number: 9.1.4
    text: |-
      Voor de toepassing van dit artikel wordt verstaan onder: - *fusie:* een rechtshandeling waarbij: 1°. alle of
      nagenoeg alle groepsentiteiten van twee of meer afzonderlijke groepen onder gemeenschappelijke zeggenschap worden
      gebracht, waardoor deze entiteiten tot een groep worden samengevoegd; of 2°. een entiteit die geen deel uitmaakt
      van een groep met een andere entiteit of groep onder gemeenschappelijke zeggenschap wordt gebracht, waardoor zij
      tot een groep worden samengevoegd.
        - *splitsing:* een rechtshandeling waarbij een groep wordt gesplitst in twee of meer verschillende groepen waarvan
      de groepsentiteiten na de splitsing niet meer worden opgenomen in de geconsolideerde jaarrekening door dezelfde
      uiteindelijkemoederentiteit.
        - *omzetdrempel:* het ingevolge [artikel 2.1][ref1] vereiste bedrag aan omzet in een verslagjaar volgens de
      geconsolideerde jaarrekening van de uiteindelijkemoederentiteit van de groep.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel2
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '2'
        hoofdstuk: '2'
  - number: 9.2.1
    text: |-
      Een toetredende of uittredende entiteit wordt in het verslagjaar van toetreden tot of uittreden van een
      multinationale groep of binnenlandse groep geacht deel uit te maken van die groep, indien een deel van de activa,
      passiva, het inkomen, de uitgaven en de kasstromen van die toetredende of uittredende entiteit wordt verantwoord
      in de geconsolideerde jaarrekening van de uiteindelijkemoederentiteit in het verslagjaar van het toetreden of
      uittreden. Het effectieve belastingtarief en de bijheffing van de toetredende of uittredende entiteit worden
      berekend overeenkomstig het tweede tot en met achtste lid.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel9.2
  - number: 9.2.2
    text: |-
      In het verslagjaar van toetreding of uittreding wordt door een multinationale groep of binnenlandse groep voor
      de toepassing van deze wet uitsluitend rekening gehouden met de nettowinst of het nettoverlies overeenkomstig
      [artikel 6.1, eerste lid][ref1], en vóór eliminatie van intra-groepstransacties, en de gecorrigeerde betrokken
      belastingen van de toetredende of uittredende entiteit die zijn opgenomen in de geconsolideerde jaarrekening van
      de uiteindelijkemoederentiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel6
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '6'
        hoofdstuk: '6'
  - number: 9.2.3
    text: |-
      In het verslagjaar van toetreding of uittreding en elk daaropvolgend verslagjaar worden het kwalificerende inkomen
      of verlies en de gecorrigeerde betrokken belastingen van de toetredende of uittredende entiteit bepaald op basis
      van de historische boekwaarde van de activa en passiva van die entiteit.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel9.2
  - number: 9.2.4
    text: |-
      In het verslagjaar van toetreding of uittreding wordt bij de berekening van de in aanmerking komende loonkosten,
      bedoeld in [artikel 8.3, tweede lid][ref1], van de toetredende of uittredende entiteit alleen rekening gehouden
      met de loonkosten die worden verantwoord in de geconsolideerde jaarrekening van de uiteindelijkemoederentiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 9.2.5
    text: |-
      De berekening van de boekwaarden van de in aanmerking komende materiële activa, bedoeld in
      [artikel 8.3, derde en vierde lid][ref1], van de toetredende of uittredende entiteit wordt in het verslagjaar
      van toetreding of uittreding aangepast naar rato van de periode waarin de toetredende of uittredende entiteit deel
      uitmaakte van de multinationale groep of binnenlandse groep.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 9.2.6
    text: |-
      Met uitzondering van de fictieve actieve belastinglatentie die betrekking heeft op een kwalificerend verlies
      bedoeld in [artikel 7.4][ref1], worden actieve en passieve belastinglatenties van de toetredende of uittredende
      entiteit die tussen multinationale groepen of binnenlandse groepen worden overgedragen, in aanmerking genomen
      door de verkrijgende multinationale groep of binnenlandse groep op dezelfde wijze en in dezelfde mate alsof de
      verkrijgende multinationale groep of binnenlandse groep de zeggenschap had over de groepsentiteit op het moment van
      het ontstaan van die actieve en passieve belastinglatenties.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel7
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '7'
        hoofdstuk: '7'
  - number: 9.2.7
    text: |-
      Passieve belastinglatenties van de toetredende of uittredende entiteit die eerder bij de overdragende groep in
      aanmerking zijn genomen in het totaalbedrag aan gecorrigeerde mutaties in belastinglatenties, worden voor de
      toepassing van [artikel 7.3, zevende lid][ref1], bij de overdragende multinationale groep of binnenlandse groep
      geacht te zijn teruggenomen zonder dat dit leidt tot een vermindering van de betrokken belastingen en worden
      geacht te zijn ontstaan bij de verkrijgende multinationale groep of binnenlandse groep, met dien verstande dat in
      dergelijke gevallen elke latere verlaging van de betrokken belastingen overeenkomstig artikel 7.3, zevende lid, van
      kracht wordt in het verslagjaar waarin de belastinglatentie wordt teruggenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel7
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '7'
        hoofdstuk: '7'
  - number: 9.2.8
    text: |-
      Een toetredende of uittredende entiteit die een moederentiteit is en deel uitmaakt van twee of meer multinationale
      groepen of binnenlandse groepen in het verslagjaar van toetreding of uittreding, past de inkomen-inclusiemaatregel
      met betrekking tot het toerekenbare deel van de bijheffing van de laagbelaste groepsentiteiten voor elke
      multinationale groep of binnenlandse groep afzonderlijk toe.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel9.2
  - number: 9.2.9
    text: |-
      In afwijking van het eerste tot en met achtste lid wordt de overdracht of verkrijging van een controlerend belang
      in een uittredende, onderscheidenlijk toetredende, entiteit aangemerkt als een overdracht, onderscheidenlijk
      verkrijging, van activa en passiva, indien de staat waarin de overgedragen, onderscheidenlijk verkregen,
      groepsentiteit is gevestigd, of de staat waarin de activa zich in het geval van een fiscaal transparante
      groepsentiteit bevinden, de overdracht, onderscheidenlijk de verkrijging, van dat belang op dezelfde of
      vergelijkbare wijze behandelt als een overdracht, onderscheidenlijk verkrijging, van activa en passiva en
      een betrokken belasting heft bij de overdrager op basis van het verschil tussen de fiscale boekwaarden en de
      overeengekomen overnameprijs voor het controlerende belang, dan wel de reële waarde van de activa en passiva.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel9.2
  - number: 9.2.10
    text: |-
      Voor de toepassing van dit artikel wordt verstaan onder: - *toetredende entiteit:* een entiteit die als gevolg van
      directe of indirecte belangenwijziging in die entiteit, dan wel doordat zij de uiteindelijkemoederentiteit wordt
      van een nieuwe groep, in een verslagjaar als groepsentiteit deel gaat uitmaken van een multinationale groep of
      binnenlandse groep;
        - *uittredende entiteit:* een entiteit die als gevolg van een directe of indirecte belangenwijziging in die
      entiteit niet langer deel uitmaakt van een multinationale groep of binnenlandse groep.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel9.2
  - number: 9.3.1
    text: |-
      Een groepsentiteit die activa en passiva overdraagt (de overdragende groepsentiteit) neemt het resultaat van
      de overdracht op in het kwalificerende inkomen of verlies. Een groepsentiteit die activa en passiva verkrijgt
      (de verkrijgende groepsentiteit) gaat bij de berekening van het kwalificerende inkomen of verlies uit van de
      boekwaarden van de overgenomen activa en passiva, zoals bepaald op basis van de door de uiteindelijkemoederentiteit
      in de geconsolideerde jaarrekening toegepaste financiële verslaggevingsstandaarden.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel9.3
  - number: 9.3.2
    text: |-
      In afwijking van het eerste lid wordt bij een overdracht of verkrijging van activa en passiva in het kader van
      een reorganisatie:
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel9.3
  - number: 9.3.2.a
    text: |-
      door de overdragende groepsentiteit een resultaat als gevolg van de overdracht uitgesloten bij de berekening van
      het kwalificerende inkomen of verlies; en
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel9.3
  - number: 9.3.2.b
    text: |-
      door de verkrijgende groepsentiteit bij de berekening van het kwalificerende inkomen of verlies uitgegaan van de
      boekwaarden van de activa en passiva van de overdragende groepsentiteit ten tijde van de overdracht.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel9.3
  - number: 9.3.3
    text: |-
      In afwijking van het eerste en tweede lid wordt, indien een overdracht van activa en passiva plaatsvindt in
      het kader van een reorganisatie die bij de overdragende groepsentiteit leidt tot niet-kwalificerende winsten of
      verliezen:
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel9.3
  - number: 9.3.3.a
    text: |-
      door de overdragende groepsentiteit bij de berekening van het kwalificerende inkomen of verlies de winst of
      het verlies uit hoofde van die overdracht voor zover sprake is van een niet-kwalificerende winst of verlies in
      aanmerking genomen; en
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel9.3
  - number: 9.3.3.b
    text: |-
      door de verkrijgende groepsentiteit bij de berekening van het kwalificerende inkomen of verlies na de verkrijging
      uitgegaan van de boekwaarden van de verkregen activa en passiva ten tijde van de overdracht bij de overdragende
      groepsentiteit, waarbij de boekwaarden aangepast worden in overeenstemming met lokale belastingregelgeving voor de
      verkrijgende groepsentiteit om rekening te houden met niet-kwalificerende winsten of verliezen.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel9.3
  - number: 9.3.4
    text: |-
      Indien een groepsentiteit in de staat waarin deze is gevestigd voor belastingdoeleinden verplicht is of de
      mogelijkheid heeft om de activa en passiva te boek te stellen op de reële waarde, kan de informatieaangifte-
      indienende groepsentiteit ervoor kiezen dat de eerstgenoemde groepsentiteit:
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel9.3
  - number: 9.3.4.a
    text: |-
      bij de berekening van het kwalificerende inkomen of verlies in een verslagjaar rekening houdt met een bedrag aan
      winst of verlies met betrekking tot de activa en passiva van die groepsentiteit dat:
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel9.3
  - number: 9.3.4.a.1°
    text: |-
      bestaat uit het verschil tussen de boekwaarden van de activa of passiva voor financiële verslaggevingsdoeleinden
      onmiddellijk voorafgaand aan de omstandigheid die de fiscale herwaardering bewerkstelligde en de reële waarde van
      de activa of passiva onmiddellijk na die omstandigheid; en
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel9.3
  - number: 9.3.4.a.2°
    text: |-
      wordt vermeerderd of verminderd met niet-kwalificerende winsten of verliezen die, voor zover aanwezig, in verband
      met voornoemde omstandigheid tot uitdrukking komen;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel9.3
  - number: 9.3.4.b
    text: |-
      bij de berekening van het kwalificerende inkomen of verlies in de verslagjaren die eindigen na voornoemde
      omstandigheid rekening houdt met de reële waarde voor financiële verslaggevingsdoeleinden van de activa en passiva
      onmiddellijk na die omstandigheid; en
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel9.3
  - number: 9.3.4.c
    text: |-
      het nettototaal van de bedragen, bedoeld in onderdeel a, in aanmerking neemt bij de berekening van het
      kwalificerende inkomen of verlies op een van de volgende manieren:
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel9.3
  - number: 9.3.4.c.1°
    text: in het verslagjaar waarin voornoemde omstandigheid zich voordoet;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel9.3
  - number: 9.3.4.c.2°
    text: |-
      voor een vijfde gedeelte in het verslagjaar waarin voornoemde omstandigheid zich voordoet en in ieder van de vier
      daaropvolgende verslagjaren, tenzij de groepsentiteit de multinationale groep of binnenlandse groep in een van deze
      verslagjaren verlaat, in welk geval het resterende bedrag in zijn geheel in dat verslagjaar in aanmerking wordt
      genomen.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel9.3
  - number: 9.3.5
    text: |-
      Voor de toepassing van dit artikel wordt verstaan onder: - *reorganisatie:* een omzetting of een overdracht van
      activa en passiva, zoals een fusie, een splitsing, een liquidatie of een vergelijkbare transactie, waarbij: 1°. de
      tegenprestatie voor de overdracht geheel of voor een significant deel bestaat uit de uitgifte van aandelen door de
      verkrijgende groepsentiteit of een daarmee verbonden persoon als bedoeld in artikel 5, achtste lid, van het OESO-
      modelverdrag of, in geval van een liquidatie, uit aandelenbelangen van de geliquideerde entiteit, of, indien een
      tegenprestatie ontbreekt, de uitgifte van een aandelenbelang geen economische betekenis zou hebben; 2°. de winst
      of het verlies met betrekking tot die activa bij de overdragende groepsentiteit geheel of gedeeltelijk niet is
      belast; en 3°. de belastingwetgeving van de staat waarin de verkrijgende groepsentiteit is gevestigd, vereist dat
      de verkrijgende groepsentiteit het belastbare inkomen na de overdracht of verkrijging berekent op basis van de
      fiscale boekwaarden van de activa bij de overdragende groepsentiteit, aangepast met de niet-kwalificerende winsten
      of verliezen ter zake van de overdracht of verkrijging.
        - *niet-kwalificerende winsten of verliezen:* het laagste van: 1°. de winst of het verlies van de overdragende
      groepsentiteit uit hoofde van een reorganisatie waarbij die winst of dat verlies is onderworpen aan
      belastingheffing in de staat waarin de overdragende groepsentiteit is gevestigd; 2°. de winst of het verlies uit
      hoofde van een reorganisatie zoals die winst of dat verlies voor verslaggevingsdoeleinden tot uitdrukking komt.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel9.3
  - number: 9.4.1
    text: |-
      Een moederentiteit die een onmiddellijk of middellijk belang heeft in een joint venture of in een joint
      venture-groep past de inkomen-inclusiemaatregel toe met betrekking tot het toerekenbare deel van de bijheffing
      van elk lid van die joint venture-groep in overeenstemming met de [artikelen 4.1][ref1], [4.2][ref2], en
      [4.3, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0049111#Artikel4
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0049111
        artikel: '4'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0049111
        artikel: '4'
        hoofdstuk: '4'
  - number: 9.4.2
    text: |-
      De berekening van de bijheffing van de joint venture en van de met de joint venture verbonden partijen geschiedt
      op de voet van de [hoofdstukken 6 tot en met 10][ref1] alsof de joint venture en de met de joint venture verbonden
      partijen groepsentiteiten vormen van een afzonderlijke multinationale groep of binnenlandse groep waarvan de joint
      venture de uiteindelijkemoederentiteit is.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0049111
        hoofdstuk: '6'
  - number: 9.4.3
    text: |-
      De door een joint venture-groep verschuldigde bijheffing wordt verminderd met het overeenkomstig het eerste lid
      toerekenbare deel van de bijheffing van elke moederentiteit van de leden van de joint venture-groep dat op de voet
      van het tweede lid wordt belast. Een resterend bedrag aan bijheffing wordt toegevoegd aan het totale bedrag aan
      onderbelastewinstbijheffing op de voet van [artikel 5.2, tweede lid][ref1]. Voor de toepassing van dit lid wordt
      verstaan onder door een joint venture-groep verschuldigde bijheffing het aan de moederentiteiten toerekenbare deel
      van de bijheffing ter zake van een joint venture-groep.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel5
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '5'
        hoofdstuk: '5'
  - number: 9.5.1
    text: |-
      De entiteiten en groepsentiteiten van twee of meer groepen die deel uitmaken van een multinationale groep of
      binnenlandse groep met meerdere uiteindelijkemoederentiteiten worden voor de toepassing van deze wet geacht
      deel uit te maken van één multinationale groep of binnenlandse groep met meerdere uiteindelijkemoederentiteiten.
      Een entiteit, niet zijnde een uitgesloten entiteit, wordt voor de toepassing van deze wet geacht een
      groepsentiteit te zijn indien deze integraal wordt geconsolideerd in de geconsolideerde jaarrekening
      van de uiteindelijkemoederentiteiten van de multinationale groep of binnenlandse groep met meerdere
      uiteindelijkemoederentiteiten of indien een controlerend belang in die entiteit wordt gehouden door entiteiten van
      een multinationale groep of binnenlandse groep met meerdere uiteindelijkemoederentiteiten.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel9.5
  - number: 9.5.2
    text: |-
      Voor de toepassing van deze wet is de geconsolideerde jaarrekening van de multinationale groep of binnenlandse
      groep met meerdere uiteindelijkemoederentiteiten de gecombineerde geconsolideerde jaarrekening, bedoeld in het
      zevende lid, onderdelen b, onder 2°, en c, onder 5°, die is opgesteld op basis van een geaccepteerde financiële
      verslaggevingsstandaard, die geacht wordt de verslaggevingsstandaard van de uiteindelijkemoederentiteit te zijn.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel9.5
  - number: 9.5.3
    text: |-
      De uiteindelijkemoederentiteiten van de afzonderlijke groepen die gezamenlijk de multinationale groep of
      binnenlandse groep met meerdere uiteindelijkemoederentiteiten vormen, zijn de uiteindelijkemoederentiteiten van
      die multinationale groep of binnenlandse groep met meerdere uiteindelijkemoederentiteiten. Met betrekking tot een
      multinationale groep of binnenlandse groep met meerdere uiteindelijkemoederentiteiten wordt, in voorkomend geval,
      elke verwijzing in deze wet naar het begrip uiteindelijkemoederentiteit geacht mede te omvatten een verwijzing naar
      meerdere uiteindelijkemoederentiteiten.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel9.5
  - number: 9.5.4
    text: |-
      De moederentiteiten inclusief de uiteindelijkemoederentiteiten van een multinationale groep of binnenlandse groep
      met meerdere uiteindelijkemoederentiteiten, passen ieder afzonderlijk de inkomen-inclusiebijheffing toe op de voet
      van de [artikelen 4.1][ref1], [4.2][ref2], en [4.3, eerste lid][ref3], met betrekking tot het aan hen toerekenbare
      deel van de bijheffing van de laagbelaste groepsentiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0049111#Artikel4
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel9.5
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0049111
        artikel: '4'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0049111
        artikel: '4'
        hoofdstuk: '4'
  - number: 9.5.5
    text: |-
      De groepsentiteiten van een multinationale groep of binnenlandse groep met meerdere uiteindelijkemoederentiteiten
      passen de onderbelastewinstbijheffing toe in overeenstemming met de [artikelen 5.1][ref1] en [5.2][ref2], rekening
      houdend met de bijheffing van elke laagbelaste groepsentiteit die deel uitmaakt van de multinationale groep of
      binnenlandse groep met meerdere uiteindelijkemoederentiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Artikel5
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel9.5
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0049111
        artikel: '5'
        hoofdstuk: '5'
  - number: 9.5.6
    text: |-
      De uiteindelijkemoederentiteiten van de multinationale groep of binnenlandse groep met meerdere
      uiteindelijkemoederentiteiten dienen de informatieaangifte in overeenkomstig [artikel 13.1, tweede lid][ref1],
      of zij wijzen een informatieaangifte-indienende groepsentiteit als bedoeld in artikel 13.1, derde lid, aan. De
      informatieaangifte bevat informatie met betrekking tot elke groep die deel uitmaakt van de multinationale groep of
      binnenlandse groep met meerdere uiteindelijkemoederentiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel13
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel9.5
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '13'
        hoofdstuk: '13'
  - number: 9.5.7
    text: |-
      Voor de toepassing van dit artikel wordt verstaan onder: - *multinationale groep of binnenlandse groep met
      meerdere uiteindelijkemoederentiteiten:* twee of meer groepen waarvan de uiteindelijkemoederentiteiten een
      stapelstructuurovereenkomst of een dubbele beursnoteringsovereenkomst aangaan;
        - *stapelstructuurovereenkomst:* een overeenkomst aangegaan tussen twee of meer uiteindelijkemoederentiteiten
      van afzonderlijke groepen waarbij: 1°. 50% of meer van de belangen in die uiteindelijkemoederentiteiten, indien
      beursgenoteerd, tegen een enkele koers genoteerd zijn en die, op grond van de rechtsvorm van die entiteiten,
      overdrachtsbeperkingen of andere voorwaarden of bepalingen, met elkaar zijn gecombineerd en niet zelfstandig kunnen
      worden overgedragen of verhandeld; en 2°. een van de uiteindelijkemoederentiteiten een geconsolideerde jaarrekening
      opstelt waarin de activa, passiva, inkomsten, uitgaven en kasstromen van alle entiteiten van de betrokken groepen
      gezamenlijk worden weergegeven als die van een enkele economische eenheid en die op grond van wet- en regelgeving
      door een externe accountant wordt gecontroleerd;
        - *dubbele beursnoteringsovereenkomst:* een overeenkomst aangegaan door twee of meer uiteindelijkemoederentiteiten
      van afzonderlijke groepen waarbij: 1°. de uiteindelijkemoederentiteiten hun activiteiten uitsluitend op grond van
      een contract combineren; 2°. de uiteindelijkemoederentiteiten op grond van contractuele verplichtingen dividend-
      en liquidatie-uitkeringen verrichten aan hun aandeelhouders op basis van vaste verhoudingen; 3°. de activiteiten
      van de uiteindelijkemoederentiteiten als een enkele economische eenheid worden beheerd op grond van contractuele
      afspraken terwijl de rechtspersoonlijkheid van de afzonderlijke uiteindelijkemoederentiteiten behouden blijft; 4°.
      de belangen van de uiteindelijkemoederentiteiten die onderdeel uitmaken van de overeenkomst afzonderlijk worden
      genoteerd, verhandeld of overgedragen op verschillende kapitaalmarkten; en 5°. de uiteindelijkemoederentiteiten
      een geconsolideerde jaarrekening opstellen waarin de activa, passiva, inkomsten, uitgaven en kasstromen van de
      entiteiten van alle betrokken groepen gezamenlijk worden weergegeven als die van een enkele economische eenheid en
      die op grond van wet- en regelgeving door een externe accountant worden gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel9.5
  - number: 10.1.1
    text: |-
      Het kwalificerende inkomen van een doorkijkentiteit die een uiteindelijkemoederentiteit is, wordt in het
      verslagjaar verminderd met het bedrag aan kwalificerend inkomen dat toerekenbaar is aan de belanghouder in de
      doorkijkentiteit indien:
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.1
  - number: 10.1.1.a
    text: |-
      de belanghouder is onderworpen aan belastingheffing over dat inkomen in een belastingtijdvak dat eindigt binnen
      twaalf maanden na het einde van het verslagjaar tegen een nominaal tarief dat ten minste gelijk is aan het
      minimumbelastingtarief;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.1
  - number: 10.1.1.b
    text: |-
      redelijkerwijs kan worden verwacht dat het totale bedrag van de gecorrigeerde betrokken belastingen van de
      uiteindelijkemoederentiteit en de belastingen betaald door de belanghouder over dat inkomen binnen twaalf
      maanden na het einde van het verslagjaar, ten minste gelijk is aan het bedrag dat resulteert door dat inkomen te
      vermenigvuldigen met het minimumbelastingtarief;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.1
  - number: 10.1.1.c
    text: |-
      de belanghouder een natuurlijk persoon is die fiscaal inwoner is van de staat waarin de uiteindelijkemoederentiteit
      is gevestigd en belangen houdt die recht geven op ten hoogste 5% van de winst en van de activa van de
      uiteindelijkemoederentiteit; of
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.1
  - number: 10.1.1.d
    text: |-
      de belanghouder een overheidsentiteit, een internationale organisatie, een non-profitorganisatie of een
      pensioenfonds is die, onderscheidenlijk dat, is gevestigd in de staat waarin de uiteindelijkemoederentiteit
      is gevestigd en belangen houdt die recht geven op ten hoogste 5% van de winst en van de activa van de
      uiteindelijkemoederentiteit.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.1
  - number: 10.1.2
    text: |-
      Het kwalificerende verlies van een doorkijkentiteit die een uiteindelijkemoederentiteit is, wordt in het
      verslagjaar verminderd met het bedrag aan kwalificerend verlies dat toerekenbaar is aan de belanghouder in de
      doorkijkentiteit voor zover de belanghouder dit verlies mag verrekenen met zijn belastbare inkomen.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.1
  - number: 10.1.3
    text: |-
      De betrokken belastingen van een doorkijkentiteit die een uiteindelijkemoederentiteit is, worden evenredig aan de
      vermindering van het kwalificerende inkomen op de voet van het eerste lid verminderd.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.1
  - number: 10.1.4
    text: |-
      De voorgaande leden zijn van overeenkomstige toepassing op een vaste inrichting met behulp waarvan een
      doorkijkentiteit die een uiteindelijkemoederentiteit is haar onderneming geheel of gedeeltelijk drijft, of met
      behulp waarvan een fiscaal transparante entiteit, waarin die uiteindelijkemoederentiteit onmiddellijk of door
      middel van een fiscaal transparante structuur haar belang houdt, haar onderneming geheel of gedeeltelijk drijft.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.1
  - number: 10.2.1
    text: |-
      Een uiteindelijkemoederentiteit van een multinationale groep of van een binnenlandse groep die is onderworpen
      aan een aftrekbaardividendstelsel vermindert in het verslagjaar haar kwalificerende inkomen, maar niet verder dan
      tot nihil, met het bedrag dat binnen twaalf maanden na het einde van het verslagjaar is uitgedeeld als aftrekbaar
      dividend, indien:
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.2
  - number: 10.2.1.a
    text: |-
      het dividend bij de gerechtigde is onderworpen aan belastingheffing in een belastingtijdvak dat eindigt binnen
      twaalf maanden na het einde van dat verslagjaar tegen een nominaal tarief dat ten minste gelijk is aan het
      minimumbelastingtarief;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.2
  - number: 10.2.1.b
    text: |-
      redelijkerwijs kan worden verwacht dat het totale bedrag van de gecorrigeerde betrokken belastingen van de
      uiteindelijkemoederentiteit en de belastingen die door de gerechtigde zijn betaald over dat dividend ten minste
      gelijk is aan dat inkomen vermenigvuldigd met het minimumbelastingtarief; of
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.2
  - number: 10.2.1.c
    text: |-
      de gerechtigde een natuurlijk persoon is en het verkregen dividend een ledendividend van een inkoopcoöperatie
      betreft;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.2
  - number: 10.2.1.d
    text: |-
      de gerechtigde een natuurlijk persoon is die fiscaal inwoner is van dezelfde staat als de staat waarin de
      uiteindelijkemoederentiteit is gevestigd en belangen houdt die recht geven op ten hoogste 5% van de winst en van de
      activa van de uiteindelijkemoederentiteit; of
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.2
  - number: 10.2.1.e
    text: |-
      de gerechtigde een overheidsentiteit, internationale organisatie, non-profitorganisatie of pensioenfonds, niet
      zijnde een pensioendienstverleningsentiteit, is die, onderscheidenlijk dat, is gevestigd in de staat waarin de
      uiteindelijkemoederentiteit is gevestigd.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.2
  - number: 10.2.2
    text: |-
      De betrokken belastingen van een uiteindelijkemoederentiteit als bedoeld in het eerste lid, niet zijnde
      de belastingen waarvoor de dividendaftrek wordt toegestaan, worden evenredig aan de vermindering van het
      kwalificerende inkomen op de voet van het eerste lid verminderd.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.2
  - number: 10.2.3
    text: |-
      Indien een uiteindelijkemoederentiteit als bedoeld in het eerste lid, onmiddellijk of middellijk via een of
      meer groepsmaatschappijen die zijn onderworpen aan een aftrekbaardividendstelsel, een belang heeft in een
      groepsentiteit die is onderworpen aan een aftrekbaardividendstelsel, zijn het eerste en tweede lid van toepassing
      op iedere groepsentiteit die is gevestigd in de staat waarin de uiteindelijkemoederentiteit is gevestigd en die is
      onderworpen aan het aftrekbaardividendstelsel, voor zover het kwalificerende inkomen van de betreffende entiteiten
      is dooruitgedeeld door de uiteindelijkemoederentiteit aan gerechtigden die voldoen aan de vereisten van het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.2
  - number: 10.2.4
    text: |-
      Voor de toepassing van het eerste lid, onderdelen a en b, wordt een door een inkoopcoöperatie uitgedeeld
      ledendividend voor zover dat dividend een aftrekbare uitgave of kostenpost vermindert bij de berekening van
      het belastbare inkomen of verlies van de gerechtigde aangemerkt als onderworpen aan belastingheffing bij de
      gerechtigde.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.2
  - number: 10.3.1
    text: |-
      De informatieaangifte-indienende groepsentiteit kan ten aanzien van een groepsentiteit die is onderworpen
      aan een in aanmerking komend uitdelingsbelastingstelsel ervoor kiezen het bedrag aan veronderstelde
      uitdelingsbelasting, bepaald op de voet van het tweede lid, toe te voegen aan de gecorrigeerde betrokken
      belastingen van de betreffende groepsentiteit voor het verslagjaar. De keuze wordt gemaakt in overeenstemming met
      [artikel 13.2, tweede lid][ref1], en geldt voor alle groepsentiteiten die in een staat zijn gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel13
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '13'
        hoofdstuk: '13'
  - number: 10.3.2
    text: 'Het bedrag aan veronderstelde uitdelingsbelasting is het laagste van:'
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.3
  - number: 10.3.2.a
    text: |-
      het bedrag aan gecorrigeerde betrokken belastingen dat nodig is om het effectieve belastingtarief zoals berekend op
      de voet van [artikel 8.1][ref1] voor de staat voor het verslagjaar te verhogen tot aan het minimumbelastingtarief;
      of


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 10.3.2.b
    text: |-
      het bedrag aan belasting dat verschuldigd zou zijn indien de in de staat gevestigde groepsentiteiten de volledige
      winst die wordt belast volgens een in aanmerking komend uitdelingsbelastingstelsel gedurende het verslagjaar zouden
      hebben uitgedeeld.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.3
  - number: 10.3.3
    text: |-
      Voor ieder verslagjaar waarin de keuze, bedoeld in het eerste lid, toepassing vindt, wordt een rekening voor
      veronderstelde uitdelingsbelasting bijgehouden. Het bedrag aan veronderstelde uitdelingsbelasting in een staat in
      een verslagjaar, bepaald op de voet van het tweede lid, wordt toegevoegd aan die rekening voor dat verslagjaar.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.3
  - number: 10.3.4
    text: |-
      Aan het einde van ieder verslagjaar waarin de keuze, bedoeld in het eerste lid, toepassing vindt, wordt het saldo
      aan veronderstelde uitdelingsbelasting op de rekeningen voor veronderstelde uitdelingsbelasting uit voorgaande
      jaren in chronologische volgorde verminderd, maar niet verder dan tot nihil, met achtereenvolgens:
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.3
  - number: 10.3.4.a
    text: |-
      de door de groepsentiteiten gedurende het verslagjaar betaalde belasting over daadwerkelijke uitdelingen en
      veronderstelde uitdelingen;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.3
  - number: 10.3.4.b
    text: |-
      een bedrag dat gelijk is aan het netto kwalificerende verlies in een staat vermenigvuldigd met het
      minimumbelastingtarief.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.3
  - number: 10.3.5
    text: |-
      Indien na toepassing van het vierde lid, onderdeel b, een bedrag aan netto kwalificerend verlies in een staat
      vermenigvuldigd met het minimumbelastingtarief resteert, dan vermindert dit bedrag het saldo aan veronderstelde
      uitdelingsbelasting op de rekeningen voor veronderstelde uitdelingsbelasting dat in navolgende verslagjaren
      overblijft na de toepassing van het vierde lid.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.3
  - number: 10.3.6
    text: |-
      Het saldo aan veronderstelde uitdelingsbelasting op de rekeningen voor veronderstelde uitdelingsbelasting op de
      laatste dag van het vierde verslagjaar na het verslagjaar waarvoor die rekening is bijgehouden, wordt aangemerkt
      als een vermindering van de gecorrigeerde betrokken belastingen voor het verslagjaar waarvoor die rekening is
      bijgehouden. Het effectieve belastingtarief en de bijheffing voor dat verslagjaar worden dienovereenkomstig
      herrekend op de voet van [artikel 8.4, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 10.3.7
    text: |-
      De in een verslagjaar betaalde belasting ter zake van daadwerkelijke uitdelingen en veronderstelde uitdelingen
      maakt in dat verslagjaar geen deel uit van de gecorrigeerde betrokken belastingen voor zover deze betaalde
      belasting op de voet van het vierde lid in mindering komt op een rekening voor veronderstelde uitdelingsbelasting.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.3
  - number: 10.3.8
    text: |-
      Indien een groepsentiteit ten aanzien waarvan voor de toepassing van het eerste lid is gekozen niet langer deel
      uitmaakt van een multinationale groep of een binnenlandse groep, dan wel nagenoeg al haar activa zijn overgedragen
      aan een partij die niet een in dezelfde staat gevestigde groepsentiteit van dezelfde multinationale groep of
      binnenlandse groep is, wordt het saldo aan veronderstelde uitdelingsbelasting op de rekeningen voor veronderstelde
      uitdelingsbelasting uit voorgaande verslagjaren waarvoor die rekeningen zijn bijgehouden in mindering gebracht op
      de gecorrigeerde betrokken belastingen van die verslagjaren waarvoor die rekeningen zijn bijgehouden.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.3
  - number: 10.3.9
    text: |-
      Voor de verslagjaren waarvoor de gecorrigeerde betrokken belastingen door toepassing van het achtste
      lid worden verminderd, worden het effectieve belastingtarief en de bijheffing herrekend op de voet van
      [artikel 8.4, eerste lid][ref1], met dien verstande dat de bijheffing wordt vermenigvuldigd met de ratio X/Y om de
      verschuldigde additionele bijheffing voor de staat te bepalen. Daarbij wordt verstaan onder: X: het kwalificerende
      inkomen van de groepsentiteit, bedoeld in het achtste lid, bepaald op de voet van [hoofdstuk 6][ref2], voor ieder
      verslagjaar waarvoor nog een saldo op de rekening voor veronderstelde uitdelingsbelasting voor de staat resteert;
      en Y: het netto kwalificerende inkomen van de staat, bepaald op de voet van [artikel 8.1, tweede lid][ref3],
      voor ieder verslagjaar waarin nog een saldo op de rekening voor veronderstelde uitdelingsbelasting van de staat
      resteert.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Hoofdstuk6
      [ref3]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0049111
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 10.4.1
    text: |-
      Indien een groepsentiteit van een multinationale groep of van een binnenlandse groep een beleggingsentiteit is, die
      geen fiscaal transparante entiteit is en die niet heeft gekozen voor de toepassing van de [artikelen 10.5][ref1]
      of [10.6][ref2], wordt het effectieve belastingtarief van die beleggingsentiteit afzonderlijk berekend van het
      effectieve belastingtarief van de staat waarin de groepsentiteit is gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Artikel10
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.4
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0049111
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.4.2
    text: |-
      Het effectieve belastingtarief van de beleggingsentiteit is gelijk aan de gecorrigeerde betrokken belastingen
      van de beleggingsentiteit, bedoeld in het derde lid, gedeeld door het kwalificerende inkomen of verlies van de
      beleggingsentiteit, bedoeld in het vierde lid. Indien in een staat meer dan een beleggingsentiteit is gevestigd,
      wordt het effectieve belastingtarief van die beleggingsentiteiten gezamenlijk berekend door de gecorrigeerde
      betrokken belastingen van die groepsentiteiten en het aan de multinationale groep of binnenlandse groep
      toerekenbare deel van het kwalificerende inkomen of verlies van die groepsentiteiten bij elkaar op te tellen.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.4
  - number: 10.4.3
    text: |-
      De gecorrigeerde betrokken belastingen van de beleggingsentiteit zijn de gecorrigeerde betrokken belastingen
      die op de voet van [artikel 7.5][ref1] worden toegerekend aan het aan de multinationale groep of binnenlandse
      groep toerekenbare deel van het kwalificerende inkomen van de beleggingsentiteit en de aan de beleggingsentiteit
      toegerekende betrokken belastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel7
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.4
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '7'
        hoofdstuk: '7'
  - number: 10.4.4
    text: |-
      Het kwalificerende inkomen of verlies van de beleggingsentiteit is het aan de multinationale groep of binnenlandse
      groep toerekenbare deel van het kwalificerende inkomen of verlies van de beleggingsentiteit bepaald op de voet van
      [artikel 4.2][ref1], met dien verstande dat alleen belangen waarvoor niet is gekozen voor de toepassing van de
      [artikelen 10.5][ref2] en [10.6][ref3] in aanmerking worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0049111#Artikel10
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.4
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0049111
        artikel: '10'
        hoofdstuk: '10'
      - id: ref3
        bwb_id: BWBR0049111
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.4.5
    text: |-
      De bijheffing van de beleggingsentiteit is gelijk aan het bijheffingspercentage van de beleggingsentiteit, bedoeld
      in het zesde lid, vermenigvuldigd met het bedrag dat gelijk is aan het verschil tussen het aan de multinationale
      groep of binnenlandse groep toerekenbare deel van het kwalificerende inkomen van de beleggingsentiteit en het voor
      de beleggingsentiteit op de voet van het zevende lid berekende uitgesloten inkomen op basis van reële aanwezigheid.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.4
  - number: 10.4.6
    text: |-
      Het bijheffingspercentage van de beleggingsentiteit is het percentage dat resteert, indien positief, na aftrek van
      het effectieve belastingtarief van de beleggingsentiteit van het minimumbelastingtarief.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.4
  - number: 10.4.7
    text: |-
      Het uitgesloten inkomen op basis van reële aanwezigheid van de beleggingsentiteit wordt bepaald op de voet van
      [artikel 8.3, eerste tot en met negende lid][ref1]. De in aanmerking komende loonkosten van de in aanmerking
      komende werknemers en de in aanmerking komende materiële activa van de beleggingsentiteit worden verminderd naar
      de verhouding van het aan de multinationale groep of binnenlandse groep toerekenbare deel van het kwalificerende
      inkomen van de beleggingsentiteit gedeeld door het totale kwalificerende inkomen van die beleggingsentiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.4
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 10.5.1
    text: |-
      Indien de informatieaangifte-indienende groepsentiteit er overeenkomstig [artikel 13.2, eerste lid][ref1],
      voor kiest, wordt een groepsentiteit die een beleggingsentiteit of een verzekeringsbeleggingsentiteit is,
      behandeld als een fiscaal transparante entiteit indien de groepsentiteit-belanghouder in de staat waarin hij is
      gevestigd, is onderworpen aan belastingheffing op grond van een waarderingsstelsel op basis van reële waarde of
      een vergelijkbaar stelsel waarbij de jaarlijkse wijzigingen in de reële waarde van zijn belang in een dergelijke
      groepsentiteit als inkomen in de heffing wordt betrokken tegen een belastingtarief dat ten minste gelijk is aan
      het minimumbelastingtarief.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel13
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.5
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '13'
        hoofdstuk: '13'
  - number: 10.5.2
    text: |-
      Een groepsentiteit-belanghouder die middellijk een belang heeft in een beleggingsentiteit of een
      verzekeringsbeleggingsentiteit via een onmiddellijk gehouden belang in een andere beleggingsentiteit of
      verzekeringsbeleggingsentiteit wordt geacht onderworpen te zijn aan belastingheffing op grond van een
      waarderingsstelsel op basis van reële waarde of een daarmee vergelijkbaar stelsel ten aanzien van dat middellijke
      belang, indien hij is onderworpen aan een belastingheffing op grond van een waarderingsstelsel op basis van reële
      waarde of een daarmee vergelijkbaar stelsel ten aanzien van dat onmiddellijke belang.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.5
  - number: 10.5.3
    text: |-
      Indien de keuze wordt herroepen, wordt elke winst of verlies als gevolg van de vervreemding van een activum of
      passivum gehouden door een beleggingsentiteit of een verzekeringsbeleggingsentiteit bepaald op basis van de reële
      waarde van dat activum of dat passivum op de eerste dag van het jaar waarin de herroeping heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.5
  - number: 10.5.4
    text: |-
      Voor de toepassing van het eerste lid wordt de groepsentiteit-belanghouder die een gereguleerde onderlinge
      waarborgmaatschappij is in de staat waarin hij is gevestigd geacht te zijn onderworpen aan belastingheffing als
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.5
  - number: 10.6.1
    text: |-
      Indien de informatieaangifte-indienende groepsentiteit er overeenkomstig [artikel 13.2, eerste lid][ref1], voor
      kiest mag een groepsentiteit-belanghouder van een beleggingsentiteit een belastbare-uitdelingsmethode toepassen met
      betrekking tot zijn belang in de beleggingsentiteit, mits de groepsentiteit-belanghouder geen beleggingsentiteit
      is en redelijkerwijs kan worden verwacht dat hij is onderworpen aan belastingheffing over de uitdelingen van de
      beleggingsentiteit tegen een belastingtarief dat ten minste gelijk is aan het minimumbelastingtarief.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel13
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.6
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '13'
        hoofdstuk: '13'
  - number: 10.6.2
    text: |-
      Onder toepassing van de belastbare-uitdelingsmethode worden uitdelingen en veronderstelde uitdelingen van het
      kwalificerende inkomen van een beleggingsentiteit begrepen in het kwalificerende inkomen van de groepsentiteit-
      belanghouder die de uitdeling heeft ontvangen of de veronderstelde uitdeling geacht wordt te hebben ontvangen.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.6
  - number: 10.6.3
    text: |-
      Het bedrag aan betrokken belastingen van de beleggingsentiteit dat verrekenbaar is met de belastingschuld van
      de groepsentiteit-belanghouder over de uitdeling van de beleggingsentiteit, wordt begrepen in het kwalificerende
      inkomen en de gecorrigeerde betrokken belastingen van de groepsentiteit-belanghouder die de uitdeling heeft
      ontvangen.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.6
  - number: 10.6.4
    text: |-
      Het aandeel van de groepsentiteit-belanghouder in het op de voet van het zesde lid bepaalde niet-uitgedeelde netto
      kwalificerende inkomen van een beleggingsentiteit in het referentiejaar wordt aangemerkt als kwalificerend inkomen
      van die beleggingsentiteit voor het verslagjaar. Het bedrag van dit kwalificerende inkomen vermenigvuldigd met het
      minimumbelastingtarief wordt voor de toepassing van de [hoofdstukken 3][ref1], [4][ref2] en [5][ref3] aangemerkt
      als bijheffing voor een laagbelaste groepsentiteit voor het verslagjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0049111#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.6
    references:
      - id: ref1
        bwb_id: BWBR0049111
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0049111
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0049111
        hoofdstuk: '5'
  - number: 10.6.5
    text: |-
      Het kwalificerende inkomen of verlies van een beleggingsentiteit en de gecorrigeerde betrokken
      belastingen die toerekenbaar zijn aan dergelijk inkomen voor het verslagjaar worden uitgesloten
      van de berekening van het effectieve belastingtarief op de voet van [hoofdstuk 8][ref1] en
      [artikel 10.4, eerste tot en met zesde lid][ref2], met uitzondering van het bedrag aan betrokken belastingen,
      bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Artikel10
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.6
    references:
      - id: ref1
        bwb_id: BWBR0049111
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0049111
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.6.6
    text: |-
      Het niet-uitgedeelde netto kwalificerende inkomen van een beleggingsentiteit in het referentiejaar is het bedrag
      aan kwalificerend inkomen van die beleggingsentiteit in het referentiejaar verminderd, maar niet verder dan tot
      nihil, met:
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.6
  - number: 10.6.6.a
    text: de betrokken belastingen van de beleggingsentiteit;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.6
  - number: 10.6.6.b
    text: |-
      uitdelingen en veronderstelde uitdelingen aan aandeelhouders die geen beleggingsentiteit zijn gedurende de
      referentieperiode;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.6
  - number: 10.6.6.c
    text: kwalificerende verliezen ontstaan gedurende de referentieperiode; en
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.6
  - number: 10.6.6.d
    text: |-
      een resterend bedrag aan kwalificerende verliezen dat in een voorgaande referentieperiode is ontstaan en niet reeds
      het bedrag aan niet-uitgedeeld netto kwalificerend inkomen van de beleggingsentiteit van een eerder referentiejaar
      heeft verminderd.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.6
  - number: 10.6.7
    text: |-
      Voor de toepassing van het zesde lid wordt het bedrag aan kwalificerend inkomen van een beleggingsentiteit in het
      referentiejaar niet verminderd met een bedrag aan uitdelingen en veronderstelde uitdelingen als bedoeld in het
      zesde lid, onderdeel b, of een bedrag aan kwalificerende verliezen als bedoeld in het zesde lid, onderdeel c, dat
      reeds in een voorgaand referentiejaar op de voet van het zesde lid in mindering is gebracht op het kwalificerende
      inkomen van die beleggingsentiteit.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.6
  - number: 10.6.8
    text: |-
      Voor de toepassing van dit artikel is onder meer sprake van een veronderstelde uitdeling indien een middellijk
      of onmiddellijk belang in een beleggingsentiteit wordt overgedragen aan een entiteit die geen deel uitmaakt van
      de multinationale groep of de binnenlandse groep. De veronderstelde uitdeling bedraagt het deel van het niet-
      uitgedeelde netto kwalificerende inkomen van de beleggingsentiteit dat toerekenbaar is aan het overgedragen belang
      in de beleggingsentiteit op de datum van overdracht, zonder rekening te houden met de veronderstelde uitdeling.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.6
  - number: 10.6.9
    text: |-
      Indien de keuze, bedoeld in het eerste lid, wordt herroepen, wordt het aandeel van de groepsentiteit-belanghouder
      in het niet-uitgedeelde netto kwalificerende inkomen van een beleggingsentiteit in het referentiejaar, aan
      het einde van het verslagjaar dat voorafgaat aan het verslagjaar waarin de herroeping heeft plaatsgevonden,
      aangemerkt als kwalificerend inkomen van de beleggingsentiteit voor het laatstgenoemde verslagjaar. Het bedrag
      van dit kwalificerend inkomen vermenigvuldigd met het minimumbelastingtarief wordt voor de toepassing van de
      [hoofdstukken 3][ref1], [4][ref2] en [5][ref3] voor het verslagjaar in aanmerking genomen als bijheffing van een
      laagbelaste groepsentiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0049111#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.6
    references:
      - id: ref1
        bwb_id: BWBR0049111
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0049111
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0049111
        hoofdstuk: '5'
  - number: 10.6.10
    text: |-
      Voor de toepassing van dit artikel wordt verstaan onder: - *het referentiejaar:* het derde jaar voorafgaande aan
      het verslagjaar waarover wordt gerapporteerd;
        - *de referentieperiode:* de periode vanaf de eerste dag van het referentiejaar tot en met de laatste dag van het
      verslagjaar waarover wordt gerapporteerd en waarin het belang in de beleggingsentiteit wordt gehouden;
        - *een beleggingsentiteit:* een beleggingsentiteit of een verzekeringsbeleggingsentiteit.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel10.6
  - number: 11.1.1
    text: De over een verslagjaar verschuldigd geworden belasting wordt op aangifte voldaan.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel11.1
  - number: 11.1.2
    text: |-
      In afwijking van [artikel 10, tweede lid, eerste zin, van de Algemene wet inzake rijksbelastingen][ref1] stelt de
      inspecteur de termijn voor het doen van aangifte zodanig vast dat deze niet eerder verstrijkt dan zeventien maanden
      na het einde van het verslagjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel10
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel11.1
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '10'
  - number: 11.1.3
    text: |-
      In afwijking van [artikel 19, eerste lid, van de Algemene wet inzake rijksbelastingen][ref1] is de
      belastingplichtige gehouden de belasting overeenkomstig de aangifte aan de ontvanger te betalen binnen zeventien
      maanden na het einde van het verslagjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel19
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel11.1
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '19'
  - number: 11.1.4
    text: |-
      Indien [artikel 8.4, zevende lid][ref1], toepassing vindt op een bedrag aan binnenlandse bijheffing vervalt de
      betalingsverplichting voor dat bedrag aan binnenlandse bijheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel11.1
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 11.1.5
    text: |-
      Voor de toepassing van [hoofdstuk IV van de Algemene wet inzake rijksbelastingen][ref1] op de minimumbelasting
      wordt onder tijdvak verstaan: het verslagjaar, bedoeld in [artikel 1.2, eerste lid][ref2], van de Wet
      minimumbelasting 2024.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Artikel1
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel11.1
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0049111
        artikel: '1'
        hoofdstuk: '1'
  - number: 11.2.1
    text: |-
      In afwijking van [artikel 20, derde lid, van de Algemene wet inzake rijksbelastingen][ref1] vervalt de bevoegdheid
      tot naheffing door verloop van zes jaren en vier maanden na het einde van het verslagjaar waarover de belasting
      is verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel20
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel11.2
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '20'
  - number: 11.2.2
    text: |-
      Indien [artikel 14.3, eerste en tweede lid][ref1], toepassing vindt, vervalt in afwijking van
      [artikel 20, derde lid, van de Algemene wet inzake rijksbelastingen][ref2] de bevoegdheid tot naheffing door
      verloop van zes jaren en zeven maanden na het einde van het verslagjaar waarover de belasting is verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel20
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel11.2
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '14'
        hoofdstuk: '14'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '20'
  - number: 11.2.3
    text: |-
      Indien [artikel 8.4, zevende lid][ref1], toepassing vindt op een bedrag aan binnenlandse bijheffing vervalt:


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel11.2
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 11.2.3.a
    text: de bevoegdheid tot naheffing met betrekking tot dat bedrag; en
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel11.2
  - number: 11.2.3.b
    text: een voor dat bedrag reeds opgelegde naheffingsaanslag die nog niet is ingevorderd.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel11.2
  - number: 12.1.1
    text: |-
      Met betrekking tot een naheffingsaanslag wordt aan degene ten name van wie de naheffingsaanslag is gesteld
      belastingrente in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel12.1
  - number: 12.1.2
    text: |-
      De belastingrente wordt enkelvoudig berekend over het tijdvak dat aanvangt op de dag volgend op de laatste
      dag van de ingevolge [artikel 11.1, derde lid][ref1], dan wel [artikel 14.3, tweede lid][ref2], gestelde
      betalingstermijn en eindigt op de dag voorafgaand aan de dag waarop de naheffingsaanslag invorderbaar is ingevolge
      [artikel 9 van de Invorderingswet 1990][ref3] en heeft als grondslag de nageheven belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel9
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel12.1
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '11'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0049111
        artikel: '14'
        hoofdstuk: '14'
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '9'
  - number: 12.1.3
    text: |-
      Het eerste lid vindt geen toepassing indien de naheffingsaanslag het gevolg is van een verzoek dat
      is gedaan binnen twee maanden na het einde van de ingevolge [artikel 11.1, derde lid][ref1], dan wel
      [artikel 14.3, tweede lid][ref2], gestelde betalingstermijn voor het verslagjaar waarop de nageheven belasting
      betrekking heeft. Onder verzoek wordt onder meer verstaan een herziening van een aangifte (suppletie).


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Artikel14
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel12.1
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '11'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0049111
        artikel: '14'
        hoofdstuk: '14'
  - number: 12.1.4
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing voor zover de belasting te laat, doch voordat een
      naheffingsaanslag is vastgesteld, wordt betaald, behoudens indien de betaling plaatsvindt binnen twee maanden na
      het einde van de ingevolge [artikel 11.1, derde lid][ref1], dan wel [artikel 14.3, tweede lid][ref2], gestelde
      betalingstermijn. Belastingrente wordt berekend over het tijdvak dat aanvangt op de dag volgend op de laatste dag
      van de ingevolge artikel 11.1, derde lid, dan wel artikel 14.3, tweede lid, gestelde betalingstermijn en eindigt op
      de dag van betaling en heeft als grondslag het bedrag van de te laat betaalde belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Artikel14
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel12.1
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '11'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0049111
        artikel: '14'
        hoofdstuk: '14'
  - number: 12.1.5
    text: |-
      De [artikelen 30h, derde en zesde lid][ref1], [30hb][ref2], [30ia][ref3] en
      [30j van de Algemene wet inzake rijksbelastingen][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel30h
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel30hb
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel30ia
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel30j
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel12.1
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 30h
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 30hb
      - id: ref3
        bwb_id: BWBR0002320
        artikel: 30ia
      - id: ref4
        bwb_id: BWBR0002320
        artikel: 30j
  - number: 12.1.6
    text: |-
      [Artikel 30ha, eerste tot en met derde lid, van de Algemene wet inzake rijksbelastingen][ref1] is van
      overeenkomstige toepassing met betrekking tot de minimumbelasting, met dien verstande dat daarbij voor «3 maanden
      na het einde van het kalenderjaar of boekjaar waarop de teruggaaf betrekking heeft» wordt gelezen «2 maanden na
      het einde van de ingevolge [artikel 11.1, derde lid][ref2], dan wel [artikel 14.3, tweede lid][ref3], van de Wet
      minimumbelasting 2024 gestelde betalingstermijn voor het verslagjaar waarop de teruggaaf betrekking heeft».


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel30ha
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0049111#Artikel14
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel12.1
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 30ha
      - id: ref2
        bwb_id: BWBR0049111
        artikel: '11'
        hoofdstuk: '11'
      - id: ref3
        bwb_id: BWBR0049111
        artikel: '14'
        hoofdstuk: '14'
  - number: 12.2.1
    text: |-
      De belastingplichtige is gehouden de inspecteur eigener beweging juiste en volledige inlichtingen of gegevens
      die van belang kunnen zijn voor de heffing van de belasting te verstrekken binnen twee weken nadat hem bekend is
      geworden dat die inlichtingen of gegevens niet, onjuist of onvolledig door hem zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel12.2
  - number: 12.2.2
    text: De verplichting, bedoeld in het eerste lid, wordt nagekomen op de door de inspecteur aangegeven wijze.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel12.2
  - number: 12.2.3
    text: |-
      De verplichting, bedoeld in het eerste lid, vervalt door verloop van zes jaren en vier maanden na afloop van het
      verslagjaar waarover de belasting is verschuldigd.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel12.2
  - number: 12.2.4
    text: |-
      Indien [artikel 14.3, eerste en tweede lid][ref1], toepassing vindt, vervalt de verplichting, bedoeld in het
      eerste lid, door verloop van zes jaren en zeven maanden na afloop van het verslagjaar waarover de belasting is
      verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel14
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel12.2
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '14'
        hoofdstuk: '14'
  - number: 12.3.1
    text: |-
      Voor de toepassing van [artikel 67b, eerste lid, van de Algemene wet inzake rijksbelastingen][ref1]
      vormt het verzuim het niet doen van aangifte dan wel het niet doen van aangifte binnen de ingevolge
      [artikel 11.1, tweede lid][ref2], dan wel [artikel 14.3, eerste lid][ref3], gestelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67b
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0049111#Artikel14
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel12.3
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 67b
      - id: ref2
        bwb_id: BWBR0049111
        artikel: '11'
        hoofdstuk: '11'
      - id: ref3
        bwb_id: BWBR0049111
        artikel: '14'
        hoofdstuk: '14'
  - number: 12.3.2
    text: |-
      In afwijking van de [artikelen 67c, derde lid][ref1], en
      [67f, vierde lid, van de Algemene wet inzake rijksbelastingen][ref2] vervalt de bevoegdheid tot het opleggen van
      een bestuurlijke boete op grond van die artikelen door verloop van zes jaren en vier maanden na afloop van het
      verslagjaar waarover de belasting is verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67c
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel67f
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel12.3
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 67c
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 67f
  - number: 12.3.3
    text: |-
      Indien [artikel 14.3, eerste en tweede lid][ref1], toepassing vindt, vervalt in afwijking van de
      [artikelen 67c, derde lid][ref2], en [67f, vierde lid, van de Algemene wet inzake rijksbelastingen][ref3] de
      bevoegdheid tot het opleggen van een bestuurlijke boete op grond van die artikelen door verloop van zes jaren en
      zeven maanden na afloop van het verslagjaar waarover de belasting is verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel67c
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel67f
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel12.3
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '14'
        hoofdstuk: '14'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 67c
      - id: ref3
        bwb_id: BWBR0002320
        artikel: 67f
  - number: 12.4.1
    text: |-
      Indien het aan opzet of grove schuld van de belastingplichtige is te wijten dat de verplichting, bedoeld in
      [artikel 12.2, eerste lid][ref1], niet is of wordt nagekomen, vormt dit een vergrijp ter zake waarvan de
      inspecteur hem een bestuurlijke boete kan opleggen van ten hoogste 100% van de in het tweede lid omschreven
      grondslag voor de boete.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel12
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel12.4
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '12'
        hoofdstuk: '12'
  - number: 12.4.2
    text: |-
      De grondslag voor de boete wordt gevormd door het bedrag aan belasting dat als gevolg van het niet nakomen van de
      verplichting, bedoeld in [artikel 12.2, eerste lid][ref1], ten onrechte niet zou zijn geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel12
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel12.4
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '12'
        hoofdstuk: '12'
  - number: 12.4.3
    text: |-
      Voor de toepassing van dit artikel is [artikel 67o, derde lid, van de Algemene wet inzake rijksbelastingen][ref1]
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67o
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel12.4
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 67o
  - number: 12.4.4
    text: |-
      De bevoegdheid tot het opleggen van een vergrijpboete op grond van het eerste lid vervalt door verloop van zes
      jaren en vier maanden na afloop van het verslagjaar waarover de belasting is verschuldigd.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel12.4
  - number: 12.4.5
    text: |-
      Indien [artikel 14.3, eerste en tweede lid][ref1], toepassing vindt, vervalt de bevoegdheid tot het opleggen
      van een vergrijpboete op grond van het eerste lid door verloop van zes jaren en zeven maanden na afloop van het
      verslagjaar waarover de belasting is verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel14
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel12.4
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '14'
        hoofdstuk: '14'
  - number: 13.1.1
    text: |-
      Voor de toepassing van dit hoofdstuk wordt verstaan onder: - *aangewezen lokale entiteit:* de in Nederland
      gevestigde groepsentiteit van een multinationale groep of binnenlandse groep die door de andere in Nederland
      gevestigde groepsentiteiten van die groep is aangewezen om de bijheffing-informatieaangifte in te dienen of namens
      hen de inspecteur de kennisgeving, bedoeld in het vierde lid, te verstrekken;
        - *kwalificerende overeenkomst tussen bevoegde autoriteiten:* een bilaterale of multilaterale overeenkomst of
      regeling tussen twee of meer bevoegde autoriteiten die voorziet in de automatische uitwisseling van de jaarlijkse
      bijheffing-informatieaangiften.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel13.1
  - number: 13.1.2
    text: |-
      Een in Nederland gevestigde groepsentiteit als bedoeld in [artikel 2.1, eerste lid][ref1], dient een bijheffing-
      informatieaangifte in bij de inspecteur op de voet van het vijfde lid. Deze bijheffing-informatieaangifte kan
      namens de groepsentiteit door een aangewezen lokale entiteit worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel2
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel13.1
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '2'
        hoofdstuk: '2'
  - number: 13.1.3
    text: |-
      In afwijking van het tweede lid hoeft een in Nederland gevestigde groepsentiteit geen bijheffing-informatieaangifte
      in te dienen bij de inspecteur indien de bijheffing-informatieaangifte, in overeenstemming met de voorwaarden
      omschreven in het vijfde lid, wordt ingediend door:
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel13.1
  - number: 13.1.3.a
    text: |-
      de uiteindelijkemoederentiteit die is gevestigd in een staat die voor het verslagjaar een van kracht zijnde
      kwalificerende overeenkomst tussen bevoegde autoriteiten heeft met Nederland; of
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel13.1
  - number: 13.1.3.b
    text: |-
      de aangewezen informatieaangifte-indienende groepsentiteit die is gevestigd in een staat die voor het verslagjaar
      een van kracht zijnde kwalificerende overeenkomst tussen bevoegde autoriteiten heeft met Nederland.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel13.1
  - number: 13.1.4
    text: |-
      Bij de toepassing van het derde lid stelt de in Nederland gevestigde groepsentiteit, of de aangewezen
      lokale entiteit namens die groepsentiteit, de inspecteur in kennis van de groepsentiteit die de bijheffing-
      informatieaangifte indient en waar die entiteit is gevestigd.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel13.1
  - number: 13.1.5
    text: |-
      De bijheffing-informatieaangifte wordt door middel van een standaardformulier ingediend en bevat de volgende
      informatie ten aanzien van de multinationale groep of binnenlandse groep:
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel13.1
  - number: 13.1.5.a
    text: |-
      identificatie van de groepsentiteiten, waaronder, indien deze beschikbaar zijn, hun fiscale identificatienummers,
      de staat waarin deze groepsentiteiten zijn gevestigd en de status van de groepsentiteiten voor de toepassing van
      deze wet;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel13.1
  - number: 13.1.5.b
    text: |-
      informatie over de gehele groepsstructuur van de multinationale groep of binnenlandse groep, daaronder begrepen de
      controlerende belangen in de groepsentiteiten die door andere groepsentiteiten worden gehouden;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel13.1
  - number: 13.1.5.c
    text: 'de informatie die nodig is voor het bepalen van:'
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel13.1
  - number: 13.1.5.c.1°
    text: het effectieve belastingtarief in elke staat en de bijheffing voor iedere groepsentiteit;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel13.1
  - number: 13.1.5.c.2°
    text: de bijheffing van een lid van een joint venture-groep;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel13.1
  - number: 13.1.5.c.3°
    text: |-
      het bedrag en de toerekening per staat van de bijheffing onder de (kwalificerende) inkomen-inclusiemaatregel en van
      de (kwalificerende) onderbelastewinstbijheffing; en
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel13.1
  - number: 13.1.5.d
    text: een overzicht van de keuzes die op de voet van de relevante bepalingen in deze wet zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel13.1
  - number: 13.1.6
    text: |-
      Indien een in Nederland gevestigde groepsentiteit een uiteindelijkemoederentiteit heeft die in een derde staat
      is gevestigd die voorschriften toepast die op grond van [artikel 1.2, zevende lid][ref1], zijn aangemerkt als
      gelijkwaardig aan een kwalificerende inkomen-inclusiemaatregel, dient de in Nederland gevestigde groepsentiteit
      of de aangewezen lokale entiteit een bijheffing-informatieaangifte in waarin, in afwijking van het vijfde lid, de
      volgende informatie is opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel1
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel13.1
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '1'
        hoofdstuk: '1'
  - number: 13.1.6.a
    text: |-
      alle informatie die nodig is voor de toepassing van [artikel 4.1,][ref1] waaronder:


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel4
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel13.1
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '4'
        hoofdstuk: '4'
  - number: 13.1.6.a.1°
    text: |-
      identificatie van alle groepsentiteiten waarin een partieel gehouden moederentiteit op enig moment gedurende het
      verslagjaar onmiddellijk of middellijk een belang heeft en de structuur van dergelijke belangen;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel13.1
  - number: 13.1.6.a.2°
    text: |-
      alle informatie die nodig is om het effectieve belastingtarief te bepalen van de staten waarin groepsentiteiten
      zijn gevestigd waarin de partieel gehouden moederentiteit, bedoeld in subonderdeel 1°, belangen houdt, en om de
      verschuldigde bijheffing te bepalen; en
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel13.1
  - number: 13.1.6.a.3°
    text: |-
      alle relevante informatie ten behoeve van het bepalen van het effectieve belastingtarief en de verschuldigde
      bijheffing onder 2°, in overeenstemming met de [artikelen 3.1][ref1], [3.2][ref2], [4.2][ref3], [4.3][ref4],
      [8.2, negende lid][ref5], en [artikel 8.4, zevende lid][ref6];


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0049111#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0049111#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0049111#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel13.1
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '3'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0049111
        artikel: '3'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0049111
        artikel: '4'
