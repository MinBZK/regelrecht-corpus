      bijgeheven zou kunnen worden indien de [artikelen 8.8][ref2], [8.11][ref3], [8.13][ref4], onderscheidenlijk
      [8.14][ref5], niet van toepassing zouden zijn en het effectieve belastingtarief in die staat, berekend op de voet
      van [artikel 8.1][ref6], lager is dan het minimumbelastingtarief;


