  - number: 8.9.e
    text: |-
      die zijn gevestigd in een staat ten aanzien waarvan de informatieaangifte-indienende groepsentiteit ervoor kiest
      of over eerdere verslagjaren ervoor heeft gekozen om [artikel 10.3][ref1], of daarmee vergelijkbare regelgeving in
      een andere staat, op de in die staat gevestigde groepsentiteiten toe te passen;


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel10
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.9
    references:
