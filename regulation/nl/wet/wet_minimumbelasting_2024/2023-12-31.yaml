  - number: 8.11.1
    text: |-
      Indien [artikel 8.8][ref1] niet is toegepast en de informatieaangifte-indienende groepsentiteit daarvoor kiest,
      bedraagt de bijheffing voor de in een staat gevestigde groepsentiteiten over een verslagjaar enkel de additionele
      bijheffing, bedoeld in [artikel 8.4][ref2] en [artikel 8.5, eerste lid][ref3], over dat verslagjaar voor die
      staat, mits:


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
