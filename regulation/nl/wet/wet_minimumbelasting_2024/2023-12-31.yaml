  - number: 8.11.1.a
    text: |-
      er in die staat op basis van een vereenvoudigde inkomensberekening een netto kwalificerend verlies is of een netto
      kwalificerend inkomen dat niet meer bedraagt dan het uitgesloten inkomen op basis van reële aanwezigheid voor de in
      die staat gevestigde groepsentiteiten berekend op de voet van [artikel 8.3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
