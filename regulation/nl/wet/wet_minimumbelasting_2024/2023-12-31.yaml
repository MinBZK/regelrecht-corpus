  - number: 8.10.1
    text: |-
      Voor een joint venture en de met die joint venture verbonden partijen worden de [artikelen 8.8][ref1] en
      [8.9][ref2] toegepast alsof zij groepsentiteiten vormen van een afzonderlijke multinationale groep waarvan
      de joint venture de uiteindelijkemoederentiteit is en alsof deze groepsentiteiten ook groepsentiteiten
      zijn op basis van [artikel 29b, onderdeel c, van de Wet op de vennootschapsbelasting 1969][ref3],
      of daarmee vergelijkbare regelgeving in een andere staat, en ze voor de toepassing van
      [hoofdstuk VIIa van de Wet op de vennootschapsbelasting 1969][ref4], of daarmee vergelijkbare regelgeving in
      een andere staat, fiscaal zijn gevestigd in dezelfde staat als waarin zij op grond van [artikel 1.3][ref5] zijn
      gevestigd.


