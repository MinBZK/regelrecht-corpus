        artikel: '8'
        hoofdstuk: '8'
  - number: 8.11.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de wijze waarop de vereenvoudigde
      omzet-, inkomens- en belastingberekeningen plaatsvinden voor een staat en de in die staat gevestigde
      groepsentiteiten, waaronder groepsentiteiten die enkel op grond van hun beperkte omvang of op grond van
      materialiteit niet zijn opgenomen in de geconsolideerde jaarrekening van de groep.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel8.11
  - number: '8.12'
    text: |-
      De inspecteur geeft slechts dan geen gevolg aan de keuze van een informatieaangifte-indienende groepsentiteit voor
      de toepassing van de [artikelen 8.8][ref1], [8.11][ref2], [8.13][ref3], of [8.14][ref4] ten aanzien van een staat
      voor een verslagjaar indien:


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0049111#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0049111#Artikel8
