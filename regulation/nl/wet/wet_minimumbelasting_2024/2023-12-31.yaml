      de informatieaangifte-indienende groepsentiteit niet binnen 6 maanden na het verzoek erin slaagt aannemelijk te
      maken dat die feiten en omstandigheden geen materieel effect hebben op de toepassing van de [artikelen 8.8][ref1],
      [8.11][ref2], [8.13][ref3], onderscheidenlijk [8.14][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0049111#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0049111#Artikel8
