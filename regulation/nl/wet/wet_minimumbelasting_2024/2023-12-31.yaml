      op basis van een vereenvoudigde omzet- en inkomensberekening de in die staat gevestigde groepsentiteiten voldoen
      aan de voorwaarden, bedoeld in [artikel 8.7, eerste lid, onderdelen a en b][ref1], waarbij artikel 8.7, tweede,
      vijfde en zesde lid, van overeenkomstige toepassing is; of


