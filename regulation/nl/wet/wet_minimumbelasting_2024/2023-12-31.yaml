        bwb_id: BWBR0001854
        artikel: '23'
  - number: 13.3.2
    text: |-
      Indien het aan opzet of grove schuld is te wijten dat de verplichting, bedoeld in
      [artikel 13.1, vierde lid][ref1], niet, niet tijdig, niet volledig of niet juist is of wordt nagekomen door
      de groepsentiteit of de aangewezen lokale entiteit, vormt dit een vergrijp ter zake waarvan de inspecteur de
      groepsentiteit, onderscheidenlijk de aangewezen lokale entiteit, een bestuurlijke boete van ten hoogste het bedrag
      van de vierde categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2], kan opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel13.3
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '13'
        hoofdstuk: '13'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 14.1.1
    text: |-
      Bij het bepalen van het effectieve belastingtarief voor het overgangsjaar voor een staat en elk daaropvolgend
      verslagjaar worden alle actieve en passieve belastinglatenties in aanmerking genomen die zijn opgenomen of
      vermeld in de financiële verslaggeving van alle in die staat gevestigde groepsentiteiten in het overgangsjaar
      voor die staat. Deze actieve en passieve belastinglatenties worden in aanmerking genomen tegen het
      minimumbelastingtarief of, indien dit lager is, het van toepassing zijnde belastingtarief waartegen de actieve
      of passieve belastinglatenties in de financiële verslaggeving zijn opgenomen. Een actieve belastinglatentie
      die is opgenomen tegen een lager belastingtarief dan het minimumbelastingtarief mag worden opgenomen tegen het
      minimumbelastingtarief voor zover de groepsentiteit aannemelijk maakt dat de actieve belastinglatentie toerekenbaar
      is aan een kwalificerend verlies. Een wijziging in de waarde van een actieve belastinglatentie als gevolg van een
      aanpassing van de waarderingsmethode of verantwoordingsmethode blijft buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel14.1
  - number: 14.1.2
    text: |-
      Actieve belastinglatenties ten aanzien van bestanddelen die op de voet van [hoofdstuk 6][ref1] niet in aanmerking
      worden genomen bij de berekening van het kwalificerende inkomen of verlies zijn uitgesloten van de berekening
      van het eerste lid, voor zover die actieve belastinglatenties zijn ontstaan als gevolg van een transactie die na
      30 november 2021 heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel14.1
    references:
      - id: ref1
        bwb_id: BWBR0049111
        hoofdstuk: '6'
  - number: 14.1.3
    text: |-
      Indien een overdracht van activa tussen groepsentiteiten heeft plaatsgevonden na 30 november 2021 en voor het
      begin van het overgangsjaar voor de staat waarin die groepsentiteiten zijn gevestigd, wordt de boekwaarde van de
      verworven activa, met uitzondering van voorraad, gesteld op de door de overdragende groepsentiteit gehanteerde
      boekwaarde op het moment van vervreemding. De actieve belastinglatenties en passieve belastinglatenties worden
      bepaald op basis van die grondslag.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel14.1
  - number: 14.1.4
    text: |-
      Indien [artikel 8.7][ref1] in het overgangsjaar voor een staat wordt toegepast, wordt dit artikel voor die staat
      toegepast vanaf het verslagjaar waarin artikel 8.7 voor het eerst niet wordt toegepast voor die staat.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel14.1
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 14.1.5
    text: |-
      Indien [artikel 8.8][ref1] in het overgangsjaar voor een staat wordt toegepast, worden het eerste en derde lid
      voor die staat toegepast vanaf het verslagjaar waarin artikel 8.8 voor het eerst niet wordt toegepast voor die
      staat. Voor een beleggingsentiteit of verzekeringsbeleggingsentiteit is het overgangsjaar het eerste verslagjaar
      waarin artikel 8.8 niet van toepassing is op die entiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel14.1
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 14.1.6
    text: |-
      In afwijking van het derde lid kan de groepsentiteit die activa verkrijgt van een andere groepsentiteit,
      onder bij of krachtens algemene maatregel van bestuur te stellen voorwaarden, een actieve belastinglatentie in
      aanmerking nemen ter zake van de verworven activa, dan wel de boekwaarde van de verworven activa uit de financiële
      verslaggeving overnemen.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel14.1
  - number: 14.1.7
    text: |-
      Voor de toepassing van dit artikel wordt onder overgangsjaar voor een staat verstaan: het eerste verslagjaar waarin
      een multinationale groep met betrekking tot die staat regels ter implementatie van [Richtlijn (EU) 2022/2523]
      (32022L2523) of van de OESO-modelregels dient toe te passen, of het eerste verslagjaar waarin een binnenlandse
      groep voldoet aan de criteria, bedoeld in [artikel 2.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel2
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel14.1
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '2'
        hoofdstuk: '2'
  - number: 14.2.1
    text: |-
      De binnenlandse bijheffing, bedoeld in [artikel 3.2, eerste lid][ref1], wordt in de verslagjaren, bedoeld in het
      vierde lid, verminderd met de som van de volgens het tweede lid aan ieder van de volgende in Nederland gevestigde
      groepsentiteiten toegerekende bijheffing:


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel3
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel14.2
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '3'
        hoofdstuk: '3'
  - number: 14.2.1.a
    text: |-
      de uiteindelijkemoederentiteit of een tussenliggende moederentiteit die wordt gehouden door een
      uiteindelijkemoederentiteit die een uitgesloten entiteit is; en
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel14.2
  - number: 14.2.1.b
    text: |-
      een groepsentiteit waarin die uiteindelijkemoederentiteit of tussenliggende moederentiteit een onmiddellijk of
      middellijk belang heeft.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel14.2
  - number: 14.2.2
    text: |-
      De bijheffing wordt aan iedere groepsentiteit toegerekend overeenkomstig [artikel 8.2, vijfde lid][ref1], waarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel14.2
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 14.2.2.a
    text: |-
      [artikel 3.1, tweede lid, eerste zin][ref1], buiten aanmerking blijft; en


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel3
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel14.2
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '3'
        hoofdstuk: '3'
  - number: 14.2.2.b
    text: |-
      de aldus berekende bijheffing voor een groepsentiteit als bedoeld in het eerste lid, onderdeel b, wordt
      vermenigvuldigd met het overeenkomstig [artikel 4.2, tweede, derde en vijfde lid][ref1], aan haar moederentiteit
      toerekenbare deel van die bijheffing over het verslagjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel4
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel14.2
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '4'
        hoofdstuk: '4'
  - number: 14.2.3
    text: |-
      Voor de berekening van de inkomen-inclusiebijheffing, bedoeld in [artikel 4.2, eerste en vierde lid][ref1], in
      de verslagjaren, bedoeld in het vierde lid, wordt de bijheffing voor in Nederland gevestigde groepsentiteiten in
      afwijking van [artikel 8.2, vijfde en zesde lid][ref2], gesteld op nihil, indien die zou worden geheven van:


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Artikel8
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel14.2
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0049111
        artikel: '8'
        hoofdstuk: '8'
  - number: 14.2.3.a
    text: de uiteindelijkemoederentiteit; of
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel14.2
  - number: 14.2.3.b
    text: |-
      een tussenliggende moederentiteit die wordt gehouden door een uiteindelijkemoederentiteit die een uitgesloten
      entiteit is.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel14.2
  - number: 14.2.4
    text: 'Het eerste tot en met derde lid zijn van toepassing:'
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel14.2
  - number: 14.2.4.a
    text: |-
      gedurende de eerste vijf verslagjaren van de aanvangsfase van de internationale activiteiten van de multinationale
      groep waarvan de uiteindelijkemoederentiteit of de tussenliggende moederentiteit deel uitmaakt; of
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel14.2
  - number: 14.2.4.b
    text: |-
      gedurende een periode van vijf verslagjaren vanaf het begin van het verslagjaar waarin deze wet
      ingevolge [artikel 2.1][ref1] voor het eerst van toepassing is op een binnenlandse groep waarvan de
      uiteindelijkemoederentiteit of de tussenliggende moederentiteit deel uitmaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel2
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel14.2
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '2'
        hoofdstuk: '2'
  - number: 14.2.5
    text: |-
      De onderbelastewinstbijheffing, bedoeld in [artikel 5.2, tweede lid][ref1], wordt gesteld op nihil gedurende de
      eerste vijf verslagjaren van de aanvangsfase van de internationale activiteiten van de multinationale groep.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel5
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel14.2
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '5'
        hoofdstuk: '5'
  - number: 14.2.6
    text: |-
      Een multinationale groep bevindt zich in de aanvangsfase van haar internationale activiteiten indien gedurende
      een verslagjaar:
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel14.2
  - number: 14.2.6.a
    text: haar groepsentiteiten in niet meer dan zes verschillende staten zijn gevestigd; en
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel14.2
  - number: 14.2.6.b
    text: |-
      de totale nettoboekwaarde van materiële activa van al haar groepsentiteiten die in andere staten dan de
      referentiestaat zijn gevestigd niet meer bedraagt dan € 50.000.000.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel14.2
  - number: 14.2.7
    text: |-
      De periode van vijf verslagjaren, bedoeld in het vierde lid, onderdeel a, en het vijfde lid, vangt aan op de eerste
      dag van het verslagjaar waarin een multinationale groep voor het eerst voldoet aan de criteria met betrekking
      tot de omzet als omschreven in [artikel 2.1][ref1], met dien verstande dat voor een multinationale groep die op
      31 december 2023 aan die criteria voldoet:


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel2
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel14.2
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '2'
        hoofdstuk: '2'
  - number: 14.2.7.a
    text: de periode van vijf verslagjaren, bedoeld in het vierde lid, onderdeel a, aanvangt op 31 december 2023;
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel14.2
  - number: 14.2.7.b
    text: de periode van vijf verslagjaren, bedoeld in het vijfde lid, aanvangt op 31 december 2024.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel14.2
  - number: 14.2.8
    text: |-
      De aangewezen informatieaangifte-indienende groepsentiteit stelt de inspecteur in kennis van de dag waarop de
      aanvangsfase van de internationale activiteiten, bedoeld in het zesde lid, aanvangt.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel14.2
  - number: 14.2.9
    text: |-
      Voor de toepassing van het zesde lid, onderdeel b, wordt onder referentiestaat verstaan: de staat waarin de
      groepsentiteiten van de multinationale groep de hoogste totale nettoboekwaarde van materiële activa hebben in het
      verslagjaar waarin de multinationale groep voldoet aan de criteria met betrekking tot de omzet als omschreven in
      [artikel 2.1][ref1]. De totale nettoboekwaarde van materiële activa in een staat is de som van de nettoboekwaarde
      van materiële activa van alle groepsentiteiten van de multinationale groep die in die staat zijn gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel2
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel14.2
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '2'
        hoofdstuk: '2'
  - number: 14.3.1
    text: |-
      In afwijking van [artikel 10, tweede lid, eerste zin, van de Algemene wet inzake rijksbelastingen][ref1] en
      [artikel 11.1, tweede lid][ref2], stelt de inspecteur de termijn voor het doen van aangifte over het overgangsjaar
      zodanig vast dat deze niet eerder verstrijkt dan twintig maanden na het einde van dat verslagjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Artikel11
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel14.3
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0049111
        artikel: '11'
        hoofdstuk: '11'
  - number: 14.3.2
    text: |-
      In afwijking van [artikel 19, eerste lid, van de Algemene wet inzake rijksbelastingen][ref1] en
      [artikel 11.1, derde lid][ref2], is de belastingplichtige gehouden de belasting over het overgangsjaar aan de
      ontvanger overeenkomstig de aangifte te betalen binnen twintig maanden na het einde van dat verslagjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Artikel11
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel14.3
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0049111
        artikel: '11'
        hoofdstuk: '11'
  - number: 14.3.3
    text: |-
      In afwijking van [artikel 13.1, zevende lid][ref1], worden de bijheffing-informatieaangifte en de kennisgeving met
      betrekking tot het overgangsjaar binnen achttien maanden na afloop van dat verslagjaar ingediend bij de inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel13
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel14.3
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '13'
        hoofdstuk: '13'
  - number: 14.3.4
    text: |-
      Dit artikel vindt geen toepassing indien door de multinationale groep voorafgaand aan het overgangsjaar een
      bijheffing-informatieaangifte is ingediend in een andere staat waarmee Nederland voor dat jaar een kwalificerende
      overeenkomst tussen bevoegde autoriteiten heeft.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel14.3
  - number: 14.3.5
    text: |-
      Voor de toepassing van dit artikel wordt onder overgangsjaar verstaan: het overgangsjaar voor Nederland in de zin
      van [artikel 14.1, zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel14
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel14.3
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '14'
        hoofdstuk: '14'
  - number: 17.1.1
    text: |-
      Deze wet treedt in werking met ingang van 31 december 2023 en vindt voor het eerst toepassing met betrekking tot
      verslagjaren die aanvangen op of na 31 december 2023.
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel17.1
  - number: 17.1.2
    text: |-
      In afwijking van het eerste lid treden de [artikelen 15.1][ref1] en [15.2, onderdeel A][ref2], in werking met
      ingang van 31 december 2024 en vinden zij voor het eerst toepassing met betrekking tot verslagjaren die aanvangen
      op of na 31 december 2024.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0049111#Artikel15
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel17.1
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '15'
        hoofdstuk: '15'
      - id: ref2
        bwb_id: BWBR0049111
        artikel: '15'
        hoofdstuk: '15'
  - number: 17.1.3
    text: |-
      In afwijking van het eerste lid treedt [artikel 15.2, onderdeel B][ref1], in werking met ingang van 31 december
      2025 en vindt dat onderdeel voor het eerst toepassing met betrekking tot verslagjaren die aanvangen op of na
      31 december 2025.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel15
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel17.1
    references:
      - id: ref1
        bwb_id: BWBR0049111
        artikel: '15'
        hoofdstuk: '15'
  - number: 17.1.4
    text: |-
      In afwijking van het eerste lid treedt [artikel 15.2, onderdeel C][ref1], in werking met ingang van 31 december
      2026 en vindt dat onderdeel voor het eerst toepassing met betrekking tot verslagjaren die aanvangen op of na
      31 december 2026.


      [ref1]: https://wetten.overheid.nl/BWBR0049111#Artikel15
    url: https://wetten.overheid.nl/BWBR0049111/2023-12-31#Artikel17.1
    references:
      - id: ref1
