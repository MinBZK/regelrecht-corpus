        artikel: '4'
      - id: ref2
        bwb_id: BWBR0001987
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0002698
        artikel: '17'
  - number: 10b
    text: |-
      Onze Minister kan een onder hem ressorterende ambtenaar mandaat verlenen tot het uitoefenen van de bevoegdheden,
      bedoeld in de [artikelen 2, eerste lid][ref1], en [6, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001987#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001987#Artikel6
