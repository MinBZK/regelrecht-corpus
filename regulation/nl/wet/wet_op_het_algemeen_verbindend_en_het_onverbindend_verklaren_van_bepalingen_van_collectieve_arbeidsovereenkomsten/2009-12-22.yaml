        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001987
        artikel: '2'
  - number: '3'
    text: |-
      1 Elk beding tusschen den werkgever en den werknemer, strijdig met verbindend verklaarde bepalingen, is nietig; in
      plaats van zoodanig beding gelden de verbindend verklaarde bepalingen.

      2 De nietigheid kan steeds worden ingeroepen door verenigingen met volledige rechtsbevoegdheid van werkgevers of
      werknemers, waarvan leden partij zijn bij eene arbeidsovereenkomst, waarop de verbindend verklaarde bepalingen van
      toepassing zijn.

      3 Bij gebreke van bepalingen in eene arbeidsovereenkomst omtrent aangelegenheden, geregeld in verbindend verklaarde
      bepalingen, gelden die verbindend verklaarde bepalingen.

      4 De in het tweede lid bedoelde vereenigingen kunnen van werkgevers of werknemers, die in strijd handelen met
      verbindend verklaarde bepalingen, vergoeding vorderen van de schade, die zij of hare leden daardoor lijden. Voor
      zover de schade in ander nadeel dan vermogensschade bestaat, zal als vergoeding een naar billijkheid te bepalen
      bedrag verschuldigd zijn.
    url: https://wetten.overheid.nl/BWBR0001987/2009-12-22#Artikel3
  - number: '4'
    text: |-
      1 De verbindendverklaring kan alleen geschieden op verzoek van één of meer werkgevers of één of meer vereenigingen
      van werkgevers of werknemers, die partij zijn bij de collectieve arbeidsovereenkomst.

      2 De indiening van een verzoek tot verbindendverklaring moet geschieden met inachtneming van de daaromtrent door
      Onzen Minister gegeven voorschriften.

      3 Door Onzen Minister wordt van de indiening van het verzoek mededeeling gedaan in de *Staatscourant.* Daarbij
      wordt een termijn bepaald, binnen welken bedenkingen schriftelijk bij hem kunnen worden ingebracht.

      4 Onze Minister kan omtrent het verzoek tot verbindendverklaring in overleg treden met de Stichting van de Arbeid.

      5 Voor de behandeling van een verzoek tot verbindendverklaring is door den aanvrager eene vergoeding verschuldigd,
      volgens een door Onzen Minister vast te stellen tarief. Onze Minister kan vorderen, dat de aanvrager voor de
      voldoening van die kosten eene waarborgsom stort.
    url: https://wetten.overheid.nl/BWBR0001987/2009-12-22#Artikel4
  - number: '5'
    text: |-
      1 Het besluit, waarbij de verbindendverklaring wordt uitgesproken, houdt in:

      a. eene opgaaf van de bepalingen, waarop de verbindendverklaring betrekking heeft;

      b. eene opgaaf van het tijdstip, waarop de verbindendverklaring begint te werken en dat, waarop hare werking
      eindigt;

      c. voor zoover noodig eene omschrijving van het gebied, waar en van de werkzaamheden, waarop de verbindend
      verklaarde bepalingen van toepassing zijn.

      2 Van een besluit omtrent verbindendverklaring wordt mededeling gedaan door plaatsing in de *Staatscourant*.

      3 Van de verbindendverklaring wordt aanteekening gehouden in een register, dat ingericht is volgens voorschriften
      door Onzen Minister gegeven. De collectieve arbeidsovereenkomsten, waarvan bepalingen verbindend zijn verklaard,
      worden als bijlagen bij het register bewaard.

      4 Het in het vorige lid bedoelde register met bijlagen ligt voor een ieder kosteloos ter inzage. Schriftelijke
      inlichtingen, het register betreffende, worden tegen betaling der kosten vanwege Onzen Minister aan een ieder
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0001987/2009-12-22#Artikel5
  - number: '6'
    text: |-
      1 Onze Minister is bevoegd te allen tijde de verbindendverklaring in te trekken.

      2 Indien Onze Minister overweegt de verbindendverklaring van bepalingen van eene collectieve arbeidsovereenkomst in
      te trekken, geeft hij daarvan kennis aan hen, die bij de collectieve arbeidsovereenkomst partij zijn en stelt hen
      in de gelegenheid hunne bezwaren daartegen schriftelijk of mondeling kenbaar te maken. Voorts kan Onze Minister ter
      zake in overleg treden met de Stichting van de Arbeid.

      3 Intrekking van de verbindendverklaring heeft geen terugwerkende kracht.

      4 Van de intrekking wordt aanteekening gehouden in het register, bedoeld in [artikel 5, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001987#Artikel5
    url: https://wetten.overheid.nl/BWBR0001987/2009-12-22#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001987
        artikel: '5'
  - number: '7'
    text: |-
      Het bepaalde in de [artikelen 2][ref1] tot en met [6][ref2] vindt overeenkomstige toepassing, indien de
      verbindendverklaring betreft wijzigingen in de bepalingen van collectieve arbeidsovereenkomsten, die ingevolge
      [artikel 2][ref3] algemeen verbindend zijn verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0001987#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001987#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0001987#Artikel2
    url: https://wetten.overheid.nl/BWBR0001987/2009-12-22#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001987
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001987
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0001987
        artikel: '2'
  - number: 7a
    text: |-
      1 Indien een verzoek is gedaan aan Onze Minister om een uitzondering te maken op de algemeen verbindend verklaarde
      bepalingen van een collectieve arbeidsovereenkomst, beslist Onze Minister op dit verzoek niet eerder dan op het
      moment dat die bepalingen van de collectieve arbeidsovereenkomst algemeen verbindend zijn verklaard.

      2 Indien tegen een besluit inzake het al dan niet maken van een uitzondering op de algemeen verbindend verklaarde
      bepalingen van een collectieve arbeidsovereenkomst bezwaar is gemaakt, beslist Onze Minister op dat bezwaar, in
      afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1], binnen veertien weken gerekend
      vanaf de dag na die waarop de termijn voor het indienen van het bezwaarschrift is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel710
    url: https://wetten.overheid.nl/BWBR0001987/2009-12-22#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 7:10
  - number: '8'
    text: |-
      1 Onze Minister kan bepalingen van eene collectieve arbeidsovereenkomst onverbindend verklaren, indien het algemeen
      belang zulks vereischt.

      2 Indien Onze Minister overweegt één of meer bepalingen van eene collectieve arbeidsovereenkomst onverbindend te
      verklaren, geeft hij daarvan kennis aan hen, die bij de collectieve arbeidsovereenkomst partij zijn en stelt hen in
      de gelegenheid hunne bedenkingen daartegen schriftelijk of mondeling kenbaar te maken.

      3 Onverbindendverklaring heeft geen terugwerkende kracht.

      4 Van het besluit, waarbij de onverbindendverklaring wordt uitgesproken, wordt mededeling gedaan door plaatsing
      in de *Staatscourant*. Van de onverbindendverklaring wordt aantekening gehouden in het register, bedoeld in
      [artikel 5, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001987#Artikel5
    url: https://wetten.overheid.nl/BWBR0001987/2009-12-22#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001987
        artikel: '5'
  - number: '9'
    text: |-
      1 Bij onverbindendverklaring van eene bepaling van eene collectieve arbeidsovereenkomst wordt deze bepaling geacht
      geen deel meer uit te maken van de collectieve arbeidsovereenkomst.

      2 Elk op het tijdstip van het in werking treden der onverbindendverklaring bestaand beding tusschen een werkgever
      en een werknemer, berustende op de onverbindend verklaarde bepaling, is nietig.
    url: https://wetten.overheid.nl/BWBR0001987/2009-12-22#Artikel9
  - number: '10'
    text: |-
      Indien een of meer verenigingen van werkgevers of van werknemers, op wier verzoek een verbindendverklaring
      is uitgesproken, het vermoeden gegrond achten, dat in een onderneming een of meer der verbindend verklaarde
      bepalingen niet worden nageleefd, kunnen zij met het oog op het instellen van een rechtsvordering, als bedoeld
      in [artikel 3][ref1], Onze Minister verzoeken een onderzoek daarnaar te doen instellen. Onze Minister draagt het
      onderzoek op aan daartoe door hem aangewezen onder hem ressorterende ambtenaren. Onze Minister licht de vereniging
      of de verenigingen, die om het onderzoek hebben gevraagd, in over hetgeen bij het onderzoek gebleken is.


      [ref1]: https://wetten.overheid.nl/BWBR0001987#Artikel3
    url: https://wetten.overheid.nl/BWBR0001987/2009-12-22#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001987
        artikel: '3'
  - number: 10a
    text: |-
      Indien Onze Minister heeft vastgesteld dat de Stichting van de Arbeid heeft opgehouden te bestaan
      of de haar krachtens deze wet toekomende taak te vervullen, treden voor de toepassing van de
      [artikelen 4, vierde lid][ref1], en [6, tweede lid, tweede volzin][ref2], in haar plaats de krachtens
      [artikel 17, eerste lid, van de Wet op de loonvorming][ref3] door Ons aangewezen centrale organisaties van
      werkgevers en van werknemers.


      [ref1]: https://wetten.overheid.nl/BWBR0001987#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0001987#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0002698#Artikel17
    url: https://wetten.overheid.nl/BWBR0001987/2009-12-22#Artikel10a
    references:
      - id: ref1
