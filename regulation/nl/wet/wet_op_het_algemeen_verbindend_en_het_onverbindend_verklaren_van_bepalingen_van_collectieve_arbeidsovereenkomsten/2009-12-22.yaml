preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het wenschelijk is regelen vast te stellen betreffende het algemeen
    verbindend en het onverbindend verklaren van bepalingen van collectieve arbeidsovereenkomsten;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001987/2009-12-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze wet verstaat onder:

      a. "Onze Minister": Onze Minister van Sociale Zaken;

      b. "verbindendverklaring": de in [artikel 2][ref1] bedoelde algemeen verbindendverklaring;

      c. "verbindend verklaarde bepalingen": bepalingen eener collectieve arbeidsovereenkomst, welke ingevolge
      [artikel 2][ref2] algemeen verbindend zijn verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0001987#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001987#Artikel2
    url: https://wetten.overheid.nl/BWBR0001987/2009-12-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001987
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001987
        artikel: '2'
  - number: '2'
    text: |-
      1 Onze Minister kan bepalingen van eene collectieve arbeidsovereenkomst, die in het geheele land of in een gedeelte
      des lands voor eene - naar zijn oordeel belangrijke - meerderheid van de in een bedrijf werkzame personen gelden,
      in het geheele land of in dat gedeelte des lands algemeen verbindend verklaren. Deze bepalingen zijn dan, behalve
      in de gevallen door Onzen Minister uitgezonderd, binnen dat gebied verbindend voor alle werkgevers en werknemers
      ten aanzien van arbeidsovereenkomsten, die naar den aard van den arbeid, waarop zij betrekking hebben, onder de
      collectieve arbeidsovereenkomst vallen of zouden vallen, hetzij deze arbeidsovereenkomsten op het tijdstip, waarop
      de werking der verbindendverklaring aanvangt, reeds gesloten zijn, hetzij zij daarna gesloten worden.

      2 De verbindendverklaring geschiedt, behoudens voor fondsen, die uit hun aard een meer permanent karakter dragen
      en ten aanzien waarvan een langer tijdvak kan gelden, voor een tijdvak van ten hoogste twee jaren. Het tijdstip,
      waarop de werking der verbindendverklaring eindigt, kan daarbij niet later worden gesteld dan het vroegste
      tijdstip, waarop de collectieve arbeidsovereenkomst, hetzij ingevolge het bij die overeenkomst bepaalde, hetzij
      ingevolge [artikel 19 der Wet op de collectieve arbeidsovereenkomst][ref1] zou kunnen eindigen.

      3 Verbindendverklaring heeft geen terugwerkende kracht.

      4 Indien de verbindend verklaarde bepalingen aannemingen van werk en overeenkomsten van opdracht betreffen, vindt
      hetgeen in deze wet omtrent arbeidsovereenkomsten, werkgevers en werknemers is bepaald, overeenkomstige toepassing.

      5 Van de verbindendverklaring zijn uitgesloten bepalingen eener collectieve arbeidsovereenkomst, die ten doel
      hebben:

      a. de beslissing van den rechter omtrent twistgedingen uit te sluiten;

      b. dwang uit te oefenen op werkgevers of werknemers om zich bij eene vakvereeniging van werkgevers of werknemers
      aan te sluiten;

      c. eene ongelijke behandeling van georganiseerden en ongeorganiseerden teweeg te brengen;

      d. de werknemers te betrekken bij de handhaving van regelingen betreffende de prijzen, die voor goederen of
      diensten door de werkgevers van derden gevorderd zullen worden, en betreffende de voorwaarden, waaronder door de
      werkgevers aan derden zal worden geleverd.

      6 Verbindend verklaarde bepalingen gelden ook ten aanzien van werknemers, die tijdelijk in Nederland arbeid
      verrichten en wier arbeidsovereenkomst wordt beheerst door een ander recht dan het Nederlandse recht, indien deze
      bepalingen betrekking hebben op:

      a. maximale werktijden en minimale rusttijden;

      b. het minimum aantal vakantiedagen, gedurende welke de verplichting van de werkgever om loon te betalen bestaat;

      c. minimumloon, daaronder begrepen vergoedingen voor overwerk, en daaronder niet begrepen aanvullende
      bedrijfspensioenregelingen;

      d. voorwaarden voor het ter beschikking stellen van werknemers;

      e. gezondheid, veiligheid en hygiëne op het werk;

      f. beschermende maatregelen met betrekking tot de arbeidsvoorwaarden en arbeidsomstandigheden van kinderen,
      jongeren en van zwangere of pas bevallen werkneemsters;

      g. gelijke behandeling van mannen en vrouwen, alsmede andere bepalingen inzake niet-discriminatie.


      [ref1]: https://wetten.overheid.nl/BWBR0001937#Artikel19
    url: https://wetten.overheid.nl/BWBR0001987/2009-12-22#Artikel2
    references:
