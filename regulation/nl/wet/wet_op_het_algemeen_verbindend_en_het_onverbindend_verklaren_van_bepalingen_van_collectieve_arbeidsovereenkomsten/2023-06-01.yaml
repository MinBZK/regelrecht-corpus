  - number: 2b
    text: |-
      1 Door de overgang van een onderneming, als bedoeld in artikel 662 van Boek 7 van het Burgerlijk Wetboek, gaan
      de rechten en verplichtingen welke op dat tijdstip voor de werkgever in die onderneming ten aanzien van daar
      werkzame werknemers voortvloeien uit bepalingen omtrent arbeidsvoorwaarden welke hij krachtens een besluit tot
      verbindendverklaring op grond van [artikel 2][ref1] van deze wet verplicht is na te komen, van rechtswege over op
      de verkrijger van de onderneming.

      2 De rechten en verplichtingen die ingevolge het eerste lid overgaan, eindigen op het tijdstip waarop de verkrijger
      ten aanzien van de arbeid, verricht door de in het eerste lid bedoelde werknemers, gebonden wordt aan een na de
      overgang van de onderneming tot stand gekomen collectieve arbeidsovereenkomst dan wel op het tijdstip waarop de
      verkrijger ten aanzien van die arbeid krachtens een na de overgang genomen besluit tot verbindendverklaring op
      grond van [artikel 2][ref2] van deze wet, verplicht wordt bepalingen van een collectieve arbeidsovereenkomst na te
      komen. De rechten en verplichtingen eindigen voorts zodra de werking der verbindendverklaring eindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0001987#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001987#Artikel2
    url: https://wetten.overheid.nl/BWBR0001987/2023-06-01#Artikel2b
