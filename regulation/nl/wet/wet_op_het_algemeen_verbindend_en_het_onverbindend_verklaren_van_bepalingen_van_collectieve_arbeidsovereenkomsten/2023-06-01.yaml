  - number: '14'
    text: |-
      Hetgeen nog ter voorbereiding van het in werking treden van deze wet en tot hare uitvoering noodig is, wordt bij
      algemeenen maatregel van bestuur geregeld.
    url: https://wetten.overheid.nl/BWBR0001987/2023-06-01#Artikel14
  - number: '15'
    text: |-
      Deze wet kan worden aangehaald onder den titel: "Wet op het algemeen verbindend en het onverbindend verklaren van
      bepalingen van collectieve arbeidsovereenkomsten".
    url: https://wetten.overheid.nl/BWBR0001987/2023-06-01#Artikel15
  - number: '16'
    text: Deze wet treedt in werking op een door Ons te bepalen tijdstip.
