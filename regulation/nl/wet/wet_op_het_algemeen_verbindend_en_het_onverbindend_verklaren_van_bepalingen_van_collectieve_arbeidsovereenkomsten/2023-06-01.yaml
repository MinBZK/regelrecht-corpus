  - number: 2a
    text: |-
      1 De dienstverrichter als bedoeld in
      [artikel 1, eerste lid, van de Wet arbeidsvoorwaarden gedetacheerde werknemers in de Europese Unie][ref1],
      waarborgt voor zijn gedetacheerde werknemers, wier arbeidsovereenkomst wordt beheerst door een ander recht dan
      het Nederlandse recht, de arbeidsvoorwaarden en -omstandigheden die zijn neergelegd in verbindend verklaarde
      bepalingen, of bij algemene maatregel van bestuur aangewezen bepalingen, die betrekking hebben op:

      a. maximale werktijden en minimale rusttijden;

      b. het minimale aantal vakantie- en verlofdagen, gedurende welke de verplichting van de werkgever om loon te
      betalen bestaat;

      c. beloning, waartoe in ieder geval behoren:

      1°. het geldende periodeloon in de schaal;

      2°. de van toepassing zijnde arbeidsduurverkorting per week, maand, jaar of periode;

      3°. toeslagen voor overwerk, verschoven uren en onregelmatigheid, met inbegrip van feestdagentoeslag en
      ploegentoeslag;

      4°. tussentijdse loonsverhoging;

      5°. kostenvergoeding: toeslagen of vergoeding van uitgaven voor de kosten die noodzakelijk zijn vanwege de
      uitoefening van de functie, waaronder begrepen reis-, maaltijd- en verblijfkosten voor werknemers die beroepshalve
      van huis zijn;

      6°. periodieken;

      7°. eindejaarsuitkeringen;

      8°. extra vergoedingen in verband met vakantie;

      d. voorwaarden voor het ter beschikking stellen van werknemers;

      e. gezondheid, veiligheid en hygiëne op het werk;

      f. beschermende maatregelen met betrekking tot de arbeidsvoorwaarden en arbeidsomstandigheden van kinderen,
      jongeren en van zwangere of pas bevallen werknemers;

      g. gelijke behandeling van mannen en vrouwen, alsmede andere bepalingen ter voorkoming en bestrijding van
      discriminatie; en

      h. voorwaarden van huisvesting van werknemers, indien de dienstontvanger als bedoeld in
      [artikel 1, eerste lid, van de Wet arbeidsvoorwaarden gedetacheerde werknemers in de Europese Unie][ref2]
      huisvesting ter beschikking stelt aan werknemers die zich niet op hun gewone werkplaats in Nederland bevinden.

      2 Tot de beloning, bedoeld in het eerste lid, onderdeel c, behoren niet:

      a. bijdragen aan pensioenen als bedoeld in [artikel 1 van de Pensioenwet][ref3] dan wel
      [artikel 1, eerste lid, van de Wet verplichte beroepspensioenregeling][ref4];

      b. bovenwettelijke socialezekerheidsaanspraken;

      c. toeslagen die worden uitgekeerd als vergoeding van daadwerkelijk in verband met de detachering gemaakte kosten,
      zoals reis-, maaltijd- en verblijfkosten.

      3 Indien niet uit de arbeidsvoorwaarden en -omstandigheden die van toepassing zijn op het dienstverband blijkt of,
      en zo ja welke, onderdelen van een toeslag in verband met detachering worden uitgekeerd als vergoeding voor kosten
      die daadwerkelijk verband houden met de detachering of die onderdeel zijn van de beloning, wordt de volledige
      toeslag geacht te zijn uitgekeerd als vergoeding van daadwerkelijk in verband met de detachering gemaakte kosten
      als bedoeld in het tweede lid, onderdeel c.

      4 Wanneer de detachering meer dan twaalf maanden bedraagt, waarborgt de dienstverrichter voor zijn gedetacheerde
      werknemers vanaf de dertiende maand alle verbindend verklaarde bepalingen die zijn neergelegd in de collectieve
      arbeidsovereenkomst die van toepassing is op grond van het eerste lid, met uitzondering van de bepalingen inzake
      procedures, formaliteiten en voorwaarden van de sluiting en de beëindiging van de arbeidsovereenkomst en inzake
      aanvullende bedrijfspensioenregelingen.

      5 De in het vierde lid genoemde termijn van twaalf maanden bedraagt achttien maanden indien de dienstverrichter,
      gedurende de laatste drie maanden van de periode van ten hoogste twaalf maanden waarin de detachering plaatsvindt,
      aan Onze Minister een gemotiveerde kennisgeving verstrekt, dat de in eerste instantie opgegeven vermoedelijke duur
      van de werkzaamheden zal worden overschreden tot ten hoogste achttien maanden. Wanneer de detachering in geval van
      verdere verlenging meer dan achttien maanden bedraagt, waarborgt de dienstverrichter de in het vierde lid bedoelde
      arbeidsvoorwaarden en -omstandigheden vanaf de negentiende maand.

      6 Indien een gedetacheerde werknemer door de dienstverrichter wordt vervangen door een andere gedetacheerde
      werknemer die op dezelfde plaats hetzelfde werk uitvoert, is de duur van de detachering de totale duur van de
      perioden van detachering van de afzonderlijke gedetacheerde werknemers gezamenlijk.

      7 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het eerste lid, onder
      meer over de voorwaarden onder welke andere dan verbindend verklaarde bepalingen gelden voor dienstverrichters en
      hun gedetacheerde werknemers.

      8 In het geval van werkzaamheden met het oog op de initiële assemblage of de eerste installatie van een goed, die
      een wezenlijk bestanddeel uitmaken van een overeenkomst voor de levering van goederen, noodzakelijk zijn voor het
      in werking stellen van het geleverde goed en uitgevoerd worden door gekwalificeerde of gespecialiseerde werknemers
      van de leverende onderneming, is het eerste lid, aanhef en onder b en c, niet van toepassing, mits de duur van de
      detachering niet meer dan acht dagen bedraagt en het geen werkzaamheden in de sector bouwbedrijf betreft.

      9 Voor de toepassing van het derde, vierde en vijfde lid, wordt de detachering van een gedetacheerde bestuurder als
      bedoeld in [artikel 9a, eerste lid, van de Wet arbeidsvoorwaarden gedetacheerde werknemers in de Europese Unie][ref5]
      geacht te zijn beëindigd, wanneer hij bij het verrichten van het internationaal vervoer van goederen of personen
      Nederland verlaat. Deze detacheringsperiode wordt niet gecumuleerd met eerdere detacheringsperiodes in het kader
      van dergelijke internationale activiteiten van dezelfde bestuurder of van de bestuurder die hij vervangt.

      10 In een derde land gevestigde vervoersondernemingen mogen geen gunstiger behandeling krijgen dan gelijksoortige
      in een lidstaat gevestigde ondernemingen op grond van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0038054#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel1
