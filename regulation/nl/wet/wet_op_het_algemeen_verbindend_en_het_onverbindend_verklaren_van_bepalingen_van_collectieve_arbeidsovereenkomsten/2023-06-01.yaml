  - number: 10a
    text: |-
      1 Onze Minister kan op verzoek van een of meer verenigingen van werkgevers of van
      werknemers de bij algemene maatregel van bestuur aangewezen gegevens, verkregen op grond van
      [artikel 8 van de Wet arbeidsvoorwaarden gedetacheerde werknemers in de Europese Unie][ref1], verstrekken om
      na te gaan of algemeen verbindend verklaarde bepalingen van collectieve arbeidsovereenkomsten, die gelden voor
      gedetacheerde werknemers, worden nageleefd.

      2 Onze Minister kan op verzoek van een rechtspersoon met volledige rechtsbevoegdheid, die door de organisaties
      van werkgevers en werknemers is belast of mede is belast met het toezicht op de naleving van collectieve
      arbeidsovereenkomsten, bij algemene maatregel van bestuur aangewezen gegevens, verkregen op grond van
      [artikel 8 van de Wet arbeidsvoorwaarden gedetacheerde werknemers in de Europese Unie][ref2], verstrekken ten
      behoeve van de uitvoering van het toezicht op de naleving van collectieve arbeidsovereenkomsten, die gelden voor
      gedetacheerde werknemers.

      3 Onze Minister is bevoegd om op verzoek van een of meer verenigingen van werkgevers of van werknemers
      bij algemene maatregel van bestuur aangewezen gegevens over dienstverrichters, dan wel de voor de
      uitbetaling van het loon verantwoordelijke natuurlijke personen of rechtspersonen, bedoeld in de
      [Wet arbeidsvoorwaarden gedetacheerde werknemers in de Europese Unie][ref3], die in het kader van de
      administratieve samenwerking, bedoeld in [artikel 4 van die wet][ref4], verkregen zijn van andere lidstaten, of die
      worden verwerkt door de door Onze Minister aangewezen ambtenaren op grond van artikel 4, tweede lid, van die wet en
      in verband met het toezicht op de naleving, bedoeld in [artikel 5 van die wet][ref5], te verstrekken om na te gaan
      of algemeen verbindend verklaarde bepalingen van collectieve arbeidsovereenkomsten die gelden voor gedetacheerde
      werknemers, worden nageleefd.

      4 Onze Minister is bevoegd om op verzoek van een rechtspersoon met volledige rechtsbevoegdheid, die door de
      organisaties van werkgevers en werknemers is belast of mede is belast met het toezicht op de naleving van
      collectieve arbeidsovereenkomsten bij algemene maatregel van bestuur aangewezen gegevens over dienstverrichters,
      dan wel de voor de uitbetaling van het loon verantwoordelijke natuurlijke personen of rechtspersonen, bedoeld
      in de [Wet arbeidsvoorwaarden gedetacheerde werknemers in de Europese Unie][ref6], die in het kader van de
      administratieve samenwerking, bedoeld in [artikel 4 van die wet][ref7] verkregen zijn van andere lidstaten, of
      die worden verwerkt door de door Onze Minister aangewezen ambtenaren op grond van artikel 4, tweede lid, van die
      wet en in verband met het toezicht op de naleving, bedoeld in [artikel 5 van die wet][ref8], te verstrekken ten
      behoeve van de uitvoering van het toezicht op de naleving van collectieve arbeidsovereenkomsten, die gelden voor
      gedetacheerde werknemers.

      5 Onze Minister kan aan de in het eerste en tweede lid bedoelde verenigingen
      en rechtspersonen relevante informatie verstrekken uit het IMI, bedoeld in
      [artikel 1, eerste lid, van de Wet arbeidsvoorwaarden gedetacheerde werknemers in de Europese Unie][ref9],
      voor zover dit noodzakelijk is om te controleren of algemeen verbindend verklaarde bepalingen
      van collectieve arbeidsovereenkomsten, die gelden voor gedetacheerde bestuurders als bedoeld in
      [artikel 9a, eerste lid, van die wet][ref10], door de dienstverrichter worden nageleefd.


