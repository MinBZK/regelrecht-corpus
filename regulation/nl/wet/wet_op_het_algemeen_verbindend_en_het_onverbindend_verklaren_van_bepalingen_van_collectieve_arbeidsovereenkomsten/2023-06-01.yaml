        artikel: '2'
  - number: '2'
    text: |-
      1 Onze Minister kan bepalingen van eene collectieve arbeidsovereenkomst, die in het geheele land of in een gedeelte
      des lands voor eene - naar zijn oordeel belangrijke - meerderheid van de in een bedrijf werkzame personen gelden,
      in het geheele land of in dat gedeelte des lands algemeen verbindend verklaren. Deze bepalingen zijn dan, behalve
      in de gevallen door Onzen Minister uitgezonderd, binnen dat gebied verbindend voor alle werkgevers en werknemers
      ten aanzien van arbeidsovereenkomsten, die naar den aard van den arbeid, waarop zij betrekking hebben, onder de
      collectieve arbeidsovereenkomst vallen of zouden vallen, hetzij deze arbeidsovereenkomsten op het tijdstip, waarop
      de werking der verbindendverklaring aanvangt, reeds gesloten zijn, hetzij zij daarna gesloten worden.

      2 De verbindendverklaring geschiedt, behoudens voor commissies als bedoeld in
      [artikel 671a, tweede lid, van Boek 7 van het Burgerlijk Wetboek][ref1] en fondsen, die uit hun aard een meer
      permanent karakter dragen en ten aanzien waarvan een langer tijdvak kan gelden, voor een tijdvak van ten hoogste
      twee jaren behoudens verlenging. Het tijdstip, waarop de werking der verbindendverklaring eindigt, kan daarbij niet
      later worden gesteld dan het vroegste tijdstip, waarop de collectieve arbeidsovereenkomst, hetzij ingevolge het bij
      die overeenkomst bepaalde, hetzij ingevolge [artikel 19 der Wet op de collectieve arbeidsovereenkomst][ref2] zou
      kunnen eindigen.

      3 Verbindendverklaring heeft geen terugwerkende kracht.

      4 Indien de verbindend verklaarde bepalingen aannemingen van werk en overeenkomsten van opdracht betreffen, vindt
      hetgeen in deze wet omtrent arbeidsovereenkomsten, werkgevers en werknemers is bepaald, overeenkomstige toepassing.

      5 Van de verbindendverklaring zijn uitgesloten bepalingen eener collectieve arbeidsovereenkomst, die ten doel
      hebben:

      a. de beslissing van den rechter omtrent twistgedingen uit te sluiten;

      b. dwang uit te oefenen op werkgevers of werknemers om zich bij eene vakvereeniging van werkgevers of werknemers
      aan te sluiten;

      c. eene ongelijke behandeling van georganiseerden en ongeorganiseerden teweeg te brengen;

      d. de werknemers te betrekken bij de handhaving van regelingen betreffende de prijzen, die voor goederen of
      diensten door de werkgevers van derden gevorderd zullen worden, en betreffende de voorwaarden, waaronder door de
      werkgevers aan derden zal worden geleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel671a
      [ref2]: https://wetten.overheid.nl/BWBR0001937#Artikel19
