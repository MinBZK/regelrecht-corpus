        artikel: 7:10
  - number: '8'
    text: |-
      1 Onze Minister kan bepalingen van eene collectieve arbeidsovereenkomst onverbindend verklaren, indien het algemeen
      belang zulks vereischt.

      2 Indien Onze Minister overweegt één of meer bepalingen van eene collectieve arbeidsovereenkomst onverbindend te
      verklaren, geeft hij daarvan kennis aan hen, die bij de collectieve arbeidsovereenkomst partij zijn en stelt hen in
      de gelegenheid hunne bedenkingen daartegen schriftelijk of mondeling kenbaar te maken.

      3 Onverbindendverklaring heeft geen terugwerkende kracht.

      4 Van het besluit, waarbij de onverbindendverklaring wordt uitgesproken, wordt mededeling gedaan door plaatsing
      in de *Staatscourant*. Van de onverbindendverklaring wordt aantekening gehouden in het register, bedoeld in
      [artikel 5, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001987#Artikel5
    url: https://wetten.overheid.nl/BWBR0001987/2023-06-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001987
        artikel: '5'
  - number: '9'
    text: |-
      1 Bij onverbindendverklaring van eene bepaling van eene collectieve arbeidsovereenkomst wordt deze bepaling geacht
      geen deel meer uit te maken van de collectieve arbeidsovereenkomst.

      2 Elk op het tijdstip van het in werking treden der onverbindendverklaring bestaand beding tusschen een werkgever
      en een werknemer, berustende op de onverbindend verklaarde bepaling, is nietig.
    url: https://wetten.overheid.nl/BWBR0001987/2023-06-01#Artikel9
  - number: '10'
    text: |-
      1 Indien een of meer verenigingen van werkgevers of van werknemers, op wier verzoek een verbindendverklaring
      is uitgesproken, het vermoeden gegrond achten, dat in een onderneming een of meer der verbindend verklaarde
      bepalingen niet worden nageleefd, kunnen zij met het oog op het instellen van een rechtsvordering, als
      bedoeld in [artikel 3][ref1], Onze Minister verzoeken een onderzoek daarnaar te doen instellen. Onze Minister
      draagt het onderzoek op aan daartoe door hem aangewezen onder hem ressorterende ambtenaren. Onze Minister
      verstrekt een verslag aan de vereniging, die om het onderzoek heeft gevraagd over hetgeen uit het onderzoek
      is gebleken. Daarbij kunnen gegevens worden verwerkt betreffende het in die onderneming naleven van de
      [Wet minimumloon en minimumvakantiebijslag][ref2], de [Wet allocatie arbeidskrachten door intermediairs][ref3], de
      [Wet arbeidsvoorwaarden gedetacheerde werknemers in de Europese Unie][ref4], de [Arbeidstijdenwet][ref5] en de
      daarop berustende bepalingen, of de [Arbeidsomstandighedenwet][ref6] en de daarop berustende bepalingen. Het
      verslag bevat geen gegevens waaruit de identiteit van een in het onderzoek betrokken werknemer kan worden afgeleid.
      Indien dit niet mogelijk is, worden gegevens slechts opgenomen, voor zover de persoonlijke levenssfeer van
      betrokkene hierdoor niet onevenredig wordt geschaad.

      2 Indien een naar het oordeel van Onze Minister in aanmerking komende rechtspersoon met volledige rechtsbevoegdheid
      die door een of meer verenigingen van werkgevers of van werknemers is belast of mede is belast met het toezicht op
      de naleving van algemeen verbindend verklaarde bepalingen van een collectieve arbeidsovereenkomst, het vermoeden
      gegrond acht, dat in een onderneming een of meer van die verbindend verklaarde bepalingen niet worden nageleefd,
      kan hij met het oog op dat toezicht op de naleving Onze Minister verzoeken een onderzoek daarnaar te doen instellen.
      Onze Minister draagt het onderzoek op aan daartoe door hem aangewezen onder hem ressorterende ambtenaren. Onze
      Minister verstrekt een verslag aan de rechtspersoon, die om het onderzoek heeft gevraagd over hetgeen uit het
      onderzoek is gebleken. Daarbij kunnen gegevens worden verwerkt betreffende het in die onderneming naleven van de
      [Wet minimumloon en minimumvakantiebijslag][ref7], de [Wet allocatie arbeidskrachten door intermediairs][ref8], de
      [Wet arbeidsvoorwaarden gedetacheerde werknemers in de Europese Unie][ref9], de [Arbeidstijdenwet][ref10] en de
      daarop berustende bepalingen, of de [Arbeidsomstandighedenwet][ref11] en de daarop berustende bepalingen. Het
      verslag bevat geen gegevens waaruit de identiteit van een in het onderzoek betrokken werknemer kan worden afgeleid.
      Indien dit niet mogelijk is, worden gegevens slechts opgenomen, voor zover de persoonlijke levenssfeer van
      betrokkene hierdoor niet onevenredig wordt geschaad.

      3 [Titel 5.2 van de Algemene wet bestuursrecht][ref12] is van overeenkomstige toepassing.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het in het eerste en tweede lid
      genoemde verslag.


