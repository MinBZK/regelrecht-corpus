  - number: 10c
    text: |-
      Onze Minister kan een onder hem ressorterende ambtenaar mandaat verlenen tot het uitoefenen van de bevoegdheden,
      bedoeld in de [artikelen 2, eerste lid][ref1], en [6, eerste lid][ref2].


