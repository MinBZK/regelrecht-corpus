  - number: 8:1
    text: |-
      De levensverzekeraar draagt zorg voor een adequate informatieverstrekking aan
                      cliënten. Hieronder wordt in deze regeling verstaan dat:

      a. de cliënt op duidelijke wijze wordt geïnformeerd over het verschil tussen de
                          verwachte waarde van de levensverzekering die een beleggingscomponent bevat op
                          de einddatum zoals deze bij aanvang van de levensverzekering die een
                          beleggingscomponent bevat aan de cliënt is voorgerekend en de waarde op de
                          einddatum zoals die naar de huidige verwachting zal bedragen. De
                          levensverzekeraar maakt daarbij concreet hoe laatstgenoemde waarde zich verhoudt
                          tot het oorspronkelijke doel van cliënt;

      b. de cliënt zo wordt geïnformeerd dat deze in staat zal zijn de generieke
                          financiële gevolgen te overzien indien hij zijn levensverzekering die een
                          beleggingscomponent bevat:

      1°. ongewijzigd voortzet;

      2°. wijzigt; of

      3°. afkoopt.

      c. de cliënt wordt gewezen op de urgentie om een weloverwogen keuze te maken met
                          betrekking tot zijn levensverzekering die een beleggingscomponent bevat.
    url: https://wetten.overheid.nl/BWBR0020540/2023-04-01#Artikel81
  - number: 8:2
    text: |-
      Om te voldoen aan zijn inspanningsverplichting als bedoeld in [artikel 81b van het besluit][ref1]
                      vergewist de levensverzekeraar zich ervan dat de cliënt daadwerkelijk de
                      consequenties van zijn keuze overziet.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel81b
    url: https://wetten.overheid.nl/BWBR0020540/2023-04-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 81b
  - number: 8:3
    text: |-
      Een levensverzekeraar wordt geacht eveneens te hebben voldaan aan zijn
                      inspanningsverplichting als bedoeld in [artikel 81b van het besluit][ref1]
                      ingeval de adviseur of bemiddelaar deze inspanningen heeft verricht en de
                      levensverzekeraar in zijn cliëntdossier heeft vastgelegd:

      a. de gegevens van de adviseur of bemiddelaar bij wie het volledige cliëntdossier
                          is opgeslagen;

      b. de gemaakte keuze van de cliënt;

      c. welk contact hieraan ten grondslag heeft gelegen; en

      d. wat de onderbouwing is van de cliënt voor de gemaakte keuze.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel81b
    url: https://wetten.overheid.nl/BWBR0020540/2023-04-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: 81b
  - number: 8:4
    text: |-
      1 Wanneer de cliënt niet kan worden bereikt of de cliënt geen weloverwogen keuze
                        aan de levensverzekeraar kenbaar heeft gemaakt, heeft de levensverzekeraar
                        desondanks voldaan aan zijn inspanningsverplichting als bedoeld in
      [artikel 81b van het
                          besluit][ref1], indien hij kan aantonen dat door hem of door de adviseur
      of
                        bemiddelaar voldoende inspanningen zijn geleverd om de cliënt een weloverwogen
                        keuze te kunnen laten maken. Daartoe toont de levensverzekeraar in ieder geval
                        aan:

      a. dat de cliënt een of meerdere brieven heeft ontvangen met de informatie
                            zoals bedoeld in [artikel
                              8:1][ref2];

      b. dat de cliënt binnen een redelijke termijn na het verzenden van de onder a
                            genoemde brieven, en over een langere periode, verschillende malen telefonisch
                            is benaderd;

      c. welke handelingen zijn verricht, wanneer andere handelingen zijn verricht
                            door de levensverzekeraar of adviseur of bemiddelaar om de cliënt een bewuste
                            keuze te kunnen laten maken;

      d. dat een slotbrief aan de cliënt is gestuurd, waarin de verrichte
                            inspanningen zijn weergegeven, de urgentie en de mogelijke consequenties van
                            het niet maken van een keuze worden benadrukt en waarin de cliënt alsnog,
                            blijvend, de mogelijkheid wordt geboden om een weloverwogen keuze te
                            maken.

      2 Behoudens cliënten die in het bezit zijn van een niet opbouwende
                        levensverzekering die een beleggingscomponent bevat, zoals bedoeld in
      [artikel 8:5, tweede
                          lid][ref3], mag de levensverzekeraar de cliënt als bedoeld in het eerste
      lid
                        meetellen voor het in [Bijlage 13][ref4] vastgestelde vereiste
                        resultaat.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel81b
      [ref2]: https://wetten.overheid.nl/BWBR0020540#Artikel81
      [ref3]: https://wetten.overheid.nl/BWBR0020540#Artikel85
      [ref4]: https://wetten.overheid.nl/BWBR0020540
