      d. de bewaarinstelling verricht geen andere activiteiten dan het bewaren en
                            administreren van financiële instrumenten, als bedoeld in het eerste lid,
                            onderdeel a, van cliënten van de beleggingsonderneming;

      e. de bewaarinstelling treedt uitsluitend op in het belang van de cliënten van
                            wie financiële instrumenten door de beleggingsonderneming bij de
                            bewaarinstelling in bewaring zijn gegeven;

      f. de som van de rechten van cliënten op financiële instrumenten komt overeen
                            met de som van de door de bewaarinstelling voor cliënten bewaarde financiële
                            instrumenten;

      g. de nakoming van de verplichtingen van de bewaarinstelling is gegarandeerd
                            door de beleggingsonderneming;

      h. de bewaarinstelling is jegens de cliënten aansprakelijk voor de door hen
                            geleden schade, voor zover die schade het gevolg is van verwijtbare
                            niet-nakoming van haar verplichtingen;

      i. de bewaarinstelling wordt in het risicobeoordelings-, meet- en
                            controleprocedures van de beleggingsonderneming betrokken;

      j. de bewaarinstelling beschikt over een bedrag aan eigen vermogen van ten
                            minste 125.000 euro.


