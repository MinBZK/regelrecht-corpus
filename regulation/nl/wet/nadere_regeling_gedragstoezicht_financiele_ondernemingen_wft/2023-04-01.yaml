    text: |-
      1 De risico-indicator in een reclame-uiting, anders dan via de televisie of de
                        radio, bedoeld in [artikel 52,
                          eerste lid, van het besluit][ref1] wordt
      opgesteld conform de vormgeving van
                          [bijlage 1.4][ref2], onder 1. De
                        risico-indicatoren zijn te downloaden van [www.afm.nl/reclameteksten](onbekend).

      2 De risico-indicator in een reclame-uiting via de televisie, bedoeld in
      [artikel 52, tweede lid, van het
                          besluit][ref3] wordt weergegeven gedurende de gehele reclame-
      uiting onderaan
                        in beeld en wordt opgesteld conform de vormgeving van [bijlage 1.4][ref4], onder 2. De
                        risico-indicatoren zijn te downloaden van [www.afm.nl/reclameteksten](onbekend).

      3 Informatie over de belangrijkste financiële risico’s van een complex
                        beleggingsproduct of derdepijlerpensioenproduct in een reclame-uiting via de
                        radio, bedoeld in [artikel 52,
                          derde lid, van het besluit][ref5], wordt
      weergegeven aan het einde van de
                        reclame-uiting door overneming van het geluidsbestand, te downloaden van
                        www.afm.nl/reclameteksten.

      4 De waarden voor de risico-indicatoren, bedoeld in het eerste tot en met derde
                        lid, worden berekend conform bijlage II van de gedelegeerde verordening
                        essentiële-informatiedocumenten.

      5 De Autoriteit Financiële Markten kan de risico-indicator voor gebruik in
                        reclame-uitingen, bedoeld in het eerste en tweede lid, of een geluidsbestand als
                        bedoeld in het derde lid geheel of gedeeltelijk wijzigen. De aanbieder van een
                        complex beleggingsproduct of derdepijlerpensioenproduct verwerkt een dergelijke
                        wijziging uiterlijk de eerste dag van de vierde kalendermaand na bekendmaking
                        daarvan.


