  - number: 4:2
    text: |-
      1 Een financiëledienstverlener stelt per dienstverleningsvraag een
                        vergelijkingskaart op dat is afgestemd op de gevraagde dienstverlening.

      2 Een financiëledienstverlener stelt een vergelijkingskaart op indien de gevraagde
                        dienstverlening van de consument of, indien het gaat om een verzekering, de cliënt
                        betrekking heeft op een financieel product als bedoeld in
      [artikel 86c, eerste lid van het
                          besluit][ref1].

      3 Indien een financiëledienstverlener een vergelijkingskaart opstelt voor de
                        hypotheekvraag, als bedoeld in [artikel 4:1, tweede
                          lid, onderdeel a][ref2],
      maakt de vraag over risico’s afdekken, als bedoeld in
                        artikel 4:1, tweede lid, onderdeel b, en de bijhorende antwoorden integraal deel
                        uit van de vergelijkingskaart.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel86c
      [ref2]: https://wetten.overheid.nl/BWBR0020540#Artikel41
