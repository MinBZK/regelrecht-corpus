      1 Een vergelijkingskaart als bedoeld in [artikel 86f, eerste lid, van het
                          besluit][ref1] wordt
      opgesteld overeenkomstig de [artikelen 4:2 tot en met 4:4][ref2] van dit hoofdstuk.

      2 Een vergelijkingskaart heeft betrekking op de gevraagde dienstverlening. Onder
                        de gevraagde dienstverlening vallen de volgende dienstverleningsvragen:

      a. hypotheekvraag;

      b. vraag over risico’s afdekken;

      c. vraag over vermogen opbouwen; of

      d. pensioenvraag werkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel86f
