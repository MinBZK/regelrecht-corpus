  - number: 5:1
    text: |-
      1 Het beleggingsobjectprospectus bevat een samenvatting van de kerngegevens
                        bestaande uit maximaal 1000 woorden. Deze samenvatting bevat ten minste de
                        volgende gegevens:

      a. gegevens over de aanbieder van het beleggingsobject:

      1°. naam, rechtsvorm, datum oprichting en plaats van vestiging
                                hoofdkantoor,

      2°. overzicht van de bedrijfsactiviteiten; en

      3°. beschrijving van de groep waar de aanbieder van een beleggingsobject
                                deel van uitmaakt;

      b. gegevens over de serie van beleggingsobjecten:

      1°. aard;

      2°. bestaansduur;

      3°. een overzicht van de voornaamste risico’s; en

      4°. een overzicht van de voornaamste algemene respectievelijke bijzondere
                                voorwaarden;

      c. financiële informatie:

      1°. informatie over de beleggingsobjectkosten;

      2°. de te verwachten waardeontwikkeling van het beleggingsobject conform het
                                stress, het ongunstige, het gematigde en het gunstige scenario zoals
                                beschreven in artikel 3, derde lid, van de gedelegeerde verordening
                                essentiële-informatiedocumenten; en

      3°. de gegevens bedoeld in [artikel 110 eerste lid
                                  onderdeel j, van het besluit][ref1];

      d. indien van toepassing: een overzicht van de belangrijke transacties met
                            gelieerde partijen; en

      e. ingeval van een aanpassing van het beleggingsobjectprospectus: een korte
                            toelichting op de in de desbetreffende versie van het
                            beleggingsobjectprospectus doorgevoerde wijziging ten opzichte van de
                            voorgaande versie.

      2 Indien het beleggingsobjectprospectus uit maximaal 7.500 woorden bestaat, is de
                        samenvatting, bedoeld in het eerste lid, facultatief.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel110
