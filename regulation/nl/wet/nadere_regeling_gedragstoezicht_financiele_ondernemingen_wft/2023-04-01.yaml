  - number: 7:3
    text: |-
      1 Een beleggingsonderneming houdt zich aan de in [bijlage 12][ref1] opgenomen regels met
                        betrekking tot reclame-uitingen.

      2 Het eerste lid is niet van toepassing indien het reclame-uitingen met betrekking
                        tot complexe producten betreft.


