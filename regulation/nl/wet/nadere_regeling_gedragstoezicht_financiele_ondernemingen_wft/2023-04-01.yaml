      1 De administratieve kosten, beheers-, productie- en verkoopkosten worden per
                        serie van beleggingsobjecten per boekjaar in de toelichting op de jaarrekening
                        verantwoord overeenkomstig de kruistabel van [bijlage 10][ref1]. Eventuele
                        valutakoersverschillen dienen in de bedoelde kosten te worden verantwoord. De
                        ingelegde gelden per serie van beleggingsobjecten per boekjaar, bedoeld in
      [artikel 67, eerste lid, onderdeel
                          a, van het besluit][ref2] worden separaat in de toelichting
      op de jaarrekening
                        vermeld.

      2 Indien het totaal van de in een boekjaar verantwoorde kosten niet gelijk is aan
                        het totaal van de kosten, bedoeld in het eerste lid, wordt dit verschil toegelicht
                        in de jaarrekening.

      3 Bij berekening van de kosten, bedoeld in het eerste lid, worden opbrengsten en
                        andere voordelen niet in mindering gebracht.


