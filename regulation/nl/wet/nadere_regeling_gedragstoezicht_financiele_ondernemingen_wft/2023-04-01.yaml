  - number: 8:8
    text: |-
      1 Een levensverzekeraar heeft voldaan aan zijn inspanningsverplichting als bedoeld
                        in [artikel 81b van het
                          besluit][ref1] voor cliënten die in het bezit zijn
      van een levensverzekering
                        die een beleggingscomponent bevat als bedoeld in
      [artikel 8:7, sub c,
                          onder 3 en sub d, onder 1][ref2], voor zover het levensverzekeringen die
      een
                        beleggingscomponent bevatten betreft die onderdeel zijn van een levensloopregeling
                        als bedoeld in de
      ‘__REF002__________________________________________________________________________________________________________
      ____________’ en sub
                        d onder 2, wanneer de levensverzekeraar kan aantonen dat hij deze cliënten de
                        informatie als bedoeld in [artikel 8:1][ref4]
                        heeft verstrekt.

      2 Een levensverzekeraar heeft voor cliënten die in het bezit zijn van een
                        levensverzekering die een beleggingscomponent bevat als bedoeld in
      [artikel 8:7, sub
                          b][ref5] voldaan aan zijn inspanningsverplichting als bedoeld in
      [artikel 81b van het
                          besluit][ref6], wanneer de levensverzekeraar kan aantonen dat de cliënt
      zijn
                        oorspronkelijke doelkapitaal zal behalen en de cliënt vanaf aanvang van de
                        levensverzekering die een beleggingscomponent bevat gedurende de hele looptijd
                        volledig in een spaarfonds belegt.

      3 Een levensverzekeraar heeft voldaan aan zijn inspanningsverplichting als bedoeld
                        in [artikel 81b van het
                          besluit][ref7] voor cliënten die in het bezit zijn
      van een levensverzekering
                        die een beleggingscomponent bevat als bedoeld in
      [artikel 8:7, sub b
                          tot en met d][ref8], voor zover voor deze cliënten niet reeds is voldaan
      aan
                        de inspanningsverplichting, bedoeld in het eerste en tweede lid, wanneer de
                        levensverzekeraar kan aantonen dat de desbetreffende cliënt zijn oorspronkelijke
                        doelkapitaal zal behalen en dat hij deze cliënten de informatie, bedoeld in
                          [artikel 8:1, sub a en
                          b][ref9], heeft verstrekt.


