                          wet][ref1] door het sluiten van
      een overeenkomst met een cliënt, waarin
                        tenminste is bepaald dat:

      a. de door de beleggingsonderneming aangehouden financiële instrumenten die de
                            cliënt toebehoren worden bewaard en geadministreerd:

      1° overeenkomstig het bepaalde in de [Wet
                                  giraal effectenverkeer][ref2], of

      2° in een bewaarinstelling;

      b. creditering of debitering van de bij de beleggingsonderneming aangehouden
                            rekening in financiële instrumenten van de cliënt uitsluitend geschiedt tegen
