---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_certificering_luchtvaartterreinen
regulatory_layer: WET
publication_date: '2009-10-06'
valid_from: '2003-02-20'
bwb_id: BWBR0014318
url: https://wetten.overheid.nl/BWBR0014318/2003-02-20
preamble:
  text: |-
    Gelet op artikel 132 van de Regeling Toezicht Luchtvaart;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a

              *certificaat:*


              verklaring van de minister dat de exploitant van het luchtvaartterrein door het
      veiligheidsmanagementsysteem de veiligheidsrisico's op het luchtvaartterrein beheerst en streeft naar een continue
      verbetering van de veiligheid;



            b

              *veiligheidsmanagementsysteem:*


              een systeem voor het management van de orde en de veiligheid op het luchtvaartterrein door de exploitant,
      dat voorziet in de beheersing van de orde en de veiligheid op en het veilig gebruik van het luchtvaartterrein;



            c

              *minister:*


              de Minister van Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel1
  - number: '2.1'
    text: |-
      Deze regeling is van toepassing op de krachtens [artikel 18 van de Luchtvaartwet][ref1] aangewezen
      luchtvaartterreinen, met uitzondering van de aangewezen zweefvliegterreinen Haamstede en Terlet en het terrein voor
      ultralichte vliegtuigen Onstwedde.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel18
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '18'
  - number: '2.2'
    text: |-
      Deze regeling is ook van toepassing op het luchthavengebied van de luchthaven Schiphol, bedoeld in
      [hoofdstuk 8 van de Wet luchtvaart][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005555
        hoofdstuk: '8'
  - number: '3.1'
    text: De exploitant dient ter verkrijging van het certificaat een aanvraag in bij de minister.
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel3
  - number: '3.2'
    text: |-
      De aanvraag gaat vergezeld met het luchthavenbedrijfshandboek. Het luchthavenbedrijfshandboek bevat
      een beschrijving van de aanleg, de inrichting, de uitrusting, het veilig gebruik, alsmede van het
      veiligheidsmanagementsysteem van het luchtvaartterrein.
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel3
  - number: '4.1'
    text: |-
      Om in aanmerking te komen voor een certificaat beschikt de exploitant over een werkend
      veiligheidsmanagementsysteem.
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel4
  - number: '4.2'
    text: 'Het veiligheidsmanagementsysteem bevat tenminste:'
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel4
  - number: 4.2.a
    text: veiligheidsbeleid;
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel4
  - number: 4.2.b
    text: organisatiestructuur;
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel4
  - number: 4.2.c
    text: taken, bevoegdheden en verantwoordelijkheden van sleutelfunctionarissen;
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel4
  - number: 4.2.d
    text: relevante bedrijfsprocessen;
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel4
  - number: 4.2.e
    text: risico-inventarisatie en de daaruit voortvloeiende verbeteringen;
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel4
  - number: 4.2.f
    text: bedrijfsmiddelen;
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel4
  - number: 4.2.g
    text: opleiding en training;
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel4
  - number: 4.2.h
    text: melding van ongevallen en ernstige incidenten;
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel4
  - number: 4.2.i
    text: |-
      registratie, analyse en afhandeling van ongevallen en incidenten, defecten en gebreken, afwijkingen en
      tekortkomingen en interne en externe klachten met betrekking tot de veiligheid;
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel4
  - number: 4.2.j
    text: documenten- en registratiebeheer;
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel4
  - number: 4.2.k
    text: met contractpartners gemaakte afspraken inzake de veiligheid op en rond het luchtvaartterrein;
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel4
  - number: 4.2.l
    text: |-
      een procedurebeschrijving waaruit blijkt hoe de exploitant nagaat of de door hem gestelde voorschriften met
      betrekking tot de orde en veiligheid door gebruikers van het luchtvaartterrein worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel4
  - number: '5.1'
    text: |-
      De minister onderzoekt of de aanleg, de inrichting, de uitrusting en het veilig gebruik van het luchtvaartterrein
      in overeenstemming zijn met de daarvoor geldende regels en of dit door het veiligheidsmanagementsysteem van de
      exploitant, alsmede de implementatie en naleving daarvan, geborgd wordt.
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel5
  - number: '5.2'
    text: 'Daarnaast kan de minister een onderzoek uitvoeren ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel5
  - number: 5.2.a
    text: het verlengen van de geldigheidsduur van het certificaat;
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel5
  - number: 5.2.b
    text: het wijzigen van het operationeel gebruik van het luchtvaartterrein;
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel5
  - number: 5.2.c
    text: het wijzigen van het veiligheidsmanagementsysteem.
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel5
  - number: '5.3'
    text: De minister maakt van elk onderzoek een onderzoeksrapport op.
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel5
  - number: '6.1'
    text: |-
      Indien uit het onderzoek, bedoeld in [artikel 5, eerste lid][ref1], blijkt dat de aanleg, de inrichting, de
      uitrusting en het veilig gebruik van het luchtvaartterrein in overeenstemming zijn met de daarvoor geldende regels
      en dit door het veiligheidsmanagementsysteem van de exploitant, alsmede de implementatie en naleving daarvan
      geborgd wordt, geeft de minister een certificaat af.


      [ref1]: https://wetten.overheid.nl/BWBR0014318#Artikel5
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0014318
        artikel: '5'
        paragraaf: '4'
  - number: '6.2'
    text: Het certificaat heeft een geldigheidsduur van drie jaar.
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel6
  - number: '6.3'
    text: Het certificaat vermeldt het operationeel gebruik waarvoor het certificaat is afgegeven.
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel6
  - number: '7'
    text: 'De minister trekt het certificaat in indien:'
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel7
  - number: 7.a
    text: het veiligheidsmanagementsysteem niet naar behoren functioneert; of
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel7
  - number: 7.b
    text: de orde of de veiligheid op het luchtvaartterrein niet meer gewaarborgd kan worden.
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel7
  - number: '8.1'
    text: |-
      De exploitant controleert ten minste één maal per jaar of de werking van het veiligheidsmanagementsysteem
      doeltreffend en doelmatig is.
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel8
  - number: '8.2'
    text: |-
      Bij luchtvaartterreinen die beschikken over een baan die langer is dan 1200 meter en voorzieningen hebben voor
      landingen met behulp van navigatie-instrumenten, beschikt de exploitant over een intern auditprogramma op basis
      waarvan de jaarlijkse controle van het veiligheidsmanagementsysteem wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel8
  - number: '8.3'
    text: |-
      Indien de resultaten van de controle bedoeld in het eerste lid daartoe aanleiding geven brengt de exploitant de
      nodige wijziging in het veiligheidsmanagementsysteem aan.
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel8
  - number: '8.4'
    text: |-
      In door de minister te bepalen gevallen beschikt de exploitant over een monitoringsysteem ten behoeve van de
      beoordeling van het veiligheidsmanagementsysteem van de eigen organisatie.
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel8
  - number: '9'
    text: |-
      De exploitant gaat na of de door hem uitgevaardigde voorschriften ter beheersing van de orde en de veiligheid
      worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel9
  - number: '10.1'
    text: |-
      De exploitant zorgt voor de vastlegging van gegevens, die noodzakelijk zijn voor de werking van het
      veiligheidsmanagementsysteem.
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel10
  - number: '10.2'
    text: De exploitant stelt procedures vast ten behoeve van het beheer van documentatie en registratie van deze gegevens.
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel10
  - number: '10.3'
    text: De exploitant heeft de meest recente uitgave van documenten voorhanden op de daartoe bestemde plaatsen.
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel10
  - number: '10.4'
    text: De exploitant registreert de uitgave van documenten alsmede de wijziging van documenten.
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel10
  - number: '10.5'
    text: |-
      De exploitant draagt er zorg voor dat de in het eerste lid bedoelde gegevens gedurende 5 jaren zodanig worden
      bewaard dat er geen achteruitgang van de kwaliteit plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel10
  - number: '10.6'
    text: |-
      De gegevens en de documenten zijn ten behoeve van het onderzoek door de minister als genoemd in [artikel 5][ref1],
      toegankelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0014318#Artikel5
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0014318
        artikel: '5'
        paragraaf: '4'
  - number: '11.1'
    text: |-
      De exploitant draagt er zorg voor dat het luchthavenbedrijfshandboek een actuele beschrijving bevat van het
      veiligheidsmanagementsysteem alsmede van de aanleg, de inrichting, de uitrusting en het veilig gebruik van het
      luchtvaartterrein.
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel11
  - number: '11.2'
    text: |-
      De exploitant draagt er zorg voor dat de minister en de op het luchtvaartterrein gevestigde bedrijven en
      organisaties die hun werkzaamheden op het airsidegedeelte uitoefenen, beschikken over de actuele versie van het
      luchthavenbedrijfshandboek en stelt hen onverwijld in kennis van wijzigingen daarvan.
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel11
  - number: '12'
    text: 'Deze regeling wordt aangehaald als: Regeling certificering luchtvaartterreinen.'
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel12
  - number: '13.1'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na dagtekening van de Staatscourant waarin zij wordt
      geplaatst, met uitzondering van [artikel 2, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014318#Artikel2
    url: https://wetten.overheid.nl/BWBR0014318/2003-02-20#Artikel13
    references:
