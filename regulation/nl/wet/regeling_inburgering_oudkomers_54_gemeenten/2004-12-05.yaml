---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_inburgering_oudkomers_54_gemeenten
regulatory_layer: WET
publication_date: '2008-12-11'
valid_from: '2004-12-05'
bwb_id: BWBR0015683
url: https://wetten.overheid.nl/BWBR0015683/2004-12-05
preamble:
  text: 'Besluit:'
  url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel1
  - number: 1.a
    text: 'Minister: de Minister voor Vreemdelingenzaken en Integratie;'
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel1
  - number: 1.b
    text: |-
      gemeentebestuur: het college van burgemeesters en wethouders van een gemeente, genoemd in de bijlage bij deze
      regeling;
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel1
  - number: 1.c
    text: |-
      oudkomers: leden van etnische minderheidsgroepen van 18 jaar of ouder, die buiten Nederland zijn geboren, al voor
      langere tijd legaal in Nederland verblijven anders dan voor een tijdelijk doel en die niet verplicht zijn om op
      grond van de [Wet inburgering nieuwkomers][ref1] een inburgeringsprogramma te volgen;


      [ref1]: https://wetten.overheid.nl/BWBR0009544
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009544
  - number: 1.d
    text: |-
      traject: een inburgeringsprogramma dat de oudkomer volgt en waarbij het onderdeel Nederlands als tweede taal kan
      worden gekoppeld aan onderdelen voor het bereiken van werk, toegang tot beroepsonderwijs, opvoedingsondersteuning
      of sociale activering;
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel1
  - number: 1.e
    text: 'prognose: het aantal oudkomers dat naar de verwachting van het gemeentebestuur een traject zal starten in 2004;'
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel1
  - number: 1.f
    text: |-
      monitor: het door de Minister vastgestelde model-document aan de hand waarvan het gemeentebestuur de Minister
      informatie verschaft over de gemeentelijke uitvoering op het gebied van de inburgering van oudkomers en de
      resultaten ervan en aan de hand waarvan hoogte van de bijdrage over 2004 wordt vastgesteld als bedoeld in
      [artikel 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015683#Artikel9
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0015683
        artikel: '9'
        hoofdstuk: '4'
  - number: '2'
    text: 'Doel van de regeling is:'
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel2
  - number: 2.a
    text: |-
      te bevorderen dat oudkomers die in een maatschappelijke achterstandssituatie verkeren en in het bijzonder diegenen
      die behoren tot de groep werklozen, opvoeders of geestelijke bedienaren deelnemen aan trajecten en deze afronden om
      hun maatschappelijke positie te verbeteren; en
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel2
  - number: 2.b
    text: te bevorderen dat gemeenten deze trajecten aan oudkomers aanbieden.
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel2
  - number: '3.1'
    text: |-
      De Minister verleent het gemeentebestuur een bijdrage voor het in 2004 aanbieden van trajecten aan oudkomers,
      indien het gemeentebestuur binnen zes weken na inwerkingtreding van de regeling bij de Minister een aanvraag
      indient en de Minister deze aanvraag goedkeurt.
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel3
  - number: '3.2'
    text: |-
      De bijdrage, bedoeld in het eerste lid, wordt beschikbaar gesteld onder het voorbehoud van autorisatie door de
      begrotingswetgever.
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel3
  - number: '3.3'
    text: De trajecten die in 2004 worden gestart dienen uiterlijk 31 december 2005 te zijn afgerond.
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel3
  - number: '3.4'
    text: Een aanvraag als bedoeld in het eerste lid bevat de prognose.
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel3
  - number: '4.1'
    text: |-
      Het aantal oudkomers, genoemd in de bijlage, is vastgesteld naar evenredigheid van het aantal leden van etnische
      minderheidsgroepen uit de 1e generatie die behoren tot de groep Niet-westerse allochtonen over de afzonderlijke
      gemeenten.
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel4
  - number: '4.2'
    text: Het normbedrag voor een traject bedraagt € 6.400.
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel4
  - number: '4.3'
    text: |-
      De hoogte van het bedrag, genoemd in de bijlage, is afhankelijk van het aantal oudkomers, genoemd in de bijlage, en
      het normbedrag, genoemd in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel4
  - number: '5.1'
    text: |-
      De Minister verleent het gemeentebestuur de bijdrage, bedoeld in [artikel 3, eerste lid][ref1], bij wijze van een
      voorschot.


      [ref1]: https://wetten.overheid.nl/BWBR0015683#Artikel3
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0015683
        artikel: '3'
        hoofdstuk: '2'
  - number: '5.2'
    text: |-
      Het voorschot is afhankelijk van de prognose en van het bedrag, genoemd in de bijlage, en wordt als volgt
      vastgesteld:
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel5
  - number: 5.2.a
    text: |-
      indien de prognose gelijk is aan het aantal oudkomers, genoemd in de bijlage, bedraagt het voorschot het bedrag,
      genoemd in de bijlage;
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel5
  - number: 5.2.b
    text: |-
      indien de prognose lager is dan het aantal oudkomers, genoemd in de bijlage, wordt het bedrag, genoemd in de
      bijlage, naar evenredigheid verminderd;
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel5
  - number: 5.2.c
    text: |-
      indien de prognose hoger is dan het aantal oudkomers, genoemd in de bijlage, wordt het bedrag, genoemd in de
      bijlage:
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel5
  - number: 5.2.c.1°
    text: in het geval het budget toereikend is, naar evenredigheid vermeerderd;
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel5
  - number: 5.2.c.2°
    text: |-
      in het geval het budget niet toereikend is, vastgesteld conform dat bedrag vermeerderd met een bedrag. Dat bedrag
      is afhankelijk is van de verdeling van de resterende middelen naar evenredigheid van het aantal oudkomers, genoemd
      in de bijlage.
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel5
  - number: '5.3'
    text: De Minister stelt het voorschot vóór 1 januari 2004 vast.
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel5
  - number: '5.4'
    text: Het voorschot wordt uiterlijk 31 mei 2004 betaald.
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel5
  - number: '6.1'
    text: |-
      Het gemeentebestuur aan wie het voorschot, bedoeld in [artikel 5][ref1], is verleend, sluit een overeenkomst met de
      oudkomer die start met een traject. In deze overeenkomst zijn in ieder geval opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0015683#Artikel5
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0015683
        artikel: '5'
        hoofdstuk: '2'
  - number: 6.1.a
    text: het doel van het traject;
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel6
  - number: 6.1.b
    text: de onderdelen van het traject;
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel6
  - number: 6.1.c
    text: het aantal lesuren van het traject;
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel6
  - number: 6.1.d
    text: de aard en de omvang van de individuele begeleiding;
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel6
  - number: 6.1.e
    text: de verplichtingen van het gemeentebestuur;
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel6
  - number: 6.1.f
    text: de verplichtingen van de oudkomer;
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel6
  - number: 6.1.g
    text: |-
      de informatieoverdracht tussen het gemeentebestuur, de instellingen betrokken bij het aanbieden van het traject en
      de oudkomer over de voortgang van die oudkomer in het traject;
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel6
  - number: 6.1.h
    text: de gevolgen van het niet nakomen van de overeenkomst door de oudkomer.
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel6
  - number: '6.2'
    text: |-
      Het gemeentebestuur sluit op grond van deze regeling met een oudkomer slechts één overeenkomst als bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel6
  - number: '7.1'
    text: |-
      Het gemeentebestuur aan wie het voorschot, bedoeld in [artikel 5][ref1], is verleend, draagt zorg dat de oudkomer
      met wie een overeenkomst als bedoeld in [artikel 6][ref2] is gesloten een begintoets en een eindtoets wordt
      afgenomen op grond waarvan het niveau Nederlands als tweede taal van de oudkomer wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0015683#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0015683#Artikel6
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0015683
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0015683
        artikel: '6'
        hoofdstuk: '3'
  - number: '7.2'
    text: |-
      Voor de begintoets en de eindtoets, bedoeld in het eerste lid, wordt uitsluitend gebruik gemaakt van de hierna
      volgende combinaties van toetsen:
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel7
  - number: 7.2.a
    text: de Intaketoets NT2 als begintoets met de NT2-Profieltoets, NT2-Cat of Itemdito als eindtoets; of
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel7
  - number: 7.2.b
    text: de Intaketoets Alfabetisering NT2 als begintoets met de NT2-Profieltoets Alfabetisering als eindtoets.
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel7
  - number: '8.1'
    text: |-
      Indien het gemeentebestuur het voorschot is verleend op grond van een aanvraag, bedoeld in
      [artikel 3, eerste lid][ref1], verstrekt het gemeentebestuur de Minister de informatie over de gegevens die in de
      monitor worden gevraagd, uiterlijk 1 april 2005 over de periode januari 2004 tot en met december 2004 en uiterlijk
      1 april 2006 over de periode januari 2005 tot en met december 2005.


      [ref1]: https://wetten.overheid.nl/BWBR0015683#Artikel3
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015683
        artikel: '3'
        hoofdstuk: '2'
  - number: '8.2'
    text: 'In de monitor worden in ieder geval de volgende prestatiegegevens gevraagd:'
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel8
  - number: 8.2.a
    text: |-
      het aantal oudkomers met wie een overeenkomst als bedoeld in [artikel 6][ref1] is gesloten;


      [ref1]: https://wetten.overheid.nl/BWBR0015683#Artikel6
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015683
        artikel: '6'
        hoofdstuk: '3'
  - number: 8.2.b
    text: het aantal oudkomers dat een traject heeft afgerond;
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel8
  - number: 8.2.c
    text: het aantal oudkomers dat een traject voortijdig heeft beëindigd;
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel8
  - number: 8.2.d
    text: |-
      het niveau Nederlands als tweede taal van de oudkomers, bedoeld in onderdeel b, bij afronding van het traject ten
      opzichte van het niveau Nederlands als tweede taal bij de start van het traject.
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel8
  - number: '8.3'
    text: |-
      De verstrekte informatie, bedoeld in het eerste lid, heeft alleen betrekking op trajecten die geheel of
      gedeeltelijk zijn bekostigd door de bijdrage, bedoeld in [artikel 3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015683#Artikel3
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015683
        artikel: '3'
        hoofdstuk: '2'
  - number: '8.4'
    text: Ten behoeve van deze regeling stelt de Minister een accountantsprotocol vast.
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel8
  - number: '8.5'
    text: De verstrekte informatie, bedoeld in het eerste lid, is voorzien van een accountantsverklaring.
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel8
  - number: '8.6'
    text: |-
      Het gemeentebestuur draagt er zorg voor dat zijn accountant meewerkt aan de door of namens de auditdienst van het
      ministerie van Justitie in te stellen onderzoeken naar de verrichte controlewerkzaamheden door die accountant. De
      daaraan verbonden kosten zijn begrepen in de bijdrage, bedoeld in [artikel 3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015683#Artikel3
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015683
        artikel: '3'
        hoofdstuk: '2'
  - number: '9.1'
    text: De Minister stelt de bijdrage vast aan de hand van de in de monitor verstrekte informatie.
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel9
  - number: '9.2'
    text: 'De hoogte van de bijdrage voor de kosten wordt als volgt vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel9
  - number: 9.2.a
    text: |-
      vóór 1 juni 2005 over 2004 € 2.667 voor iedere oudkomer met wie een overeenkomst als bedoeld in [artikel 6][ref1]
      is gesloten; en


      [ref1]: https://wetten.overheid.nl/BWBR0015683#Artikel6
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0015683
        artikel: '6'
        hoofdstuk: '3'
  - number: 9.2.b
    text: |-
      vóór 1 juni 2006 over 2005 € 5.333 voor iedere oudkomer die, evenals het gemeentebestuur, aan de verplichtingen,
      genoemd in de overeenkomst, bedoeld in [artikel 6][ref1], heeft voldaan en die een begintoets en een eindtoets als
      bedoeld in [artikel 7][ref2] is afgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0015683#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0015683#Artikel7
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0015683
        artikel: '6'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0015683
        artikel: '7'
        hoofdstuk: '3'
  - number: '9.3'
    text: |-
      Het aantal oudkomers dat de Minister bij het vaststellen van de bijdrage betrekt, kan het aantal in de beschikking
      genoemde oudkomers niet overtreffen.
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel9
  - number: '10.1'
    text: |-
      Het bedrag van de vastgestelde bijdrage, bedoeld in [artikel 9, eerste lid][ref1], wordt betaald onder verrekening
      van het voorschot.


      [ref1]: https://wetten.overheid.nl/BWBR0015683#Artikel9
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0015683
        artikel: '9'
        hoofdstuk: '4'
  - number: '10.2'
    text: |-
      Indien het bedrag van het voorschot hoger is dan het bedrag van de vastgestelde bijdrage, bedoeld in
      [artikel 9, eerste lid][ref1], kan de Minister het verschil terugvorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0015683#Artikel9
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0015683
        artikel: '9'
        hoofdstuk: '4'
  - number: '11'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel11
  - number: '12'
    text: 'Deze regeling wordt aangehaald als: Regeling inburgering oudkomers 54 gemeenten.'
    url: https://wetten.overheid.nl/BWBR0015683/2004-12-05#Artikel12
