  - number: 2.k
    text: |-
      Trainer/docent, in dienst van de Dienst Vervoer & Ondersteuning, zijn aangewezen als buitengewoon
      opsporingsambtenaar.
    url: https://wetten.overheid.nl/BWBR0034709/2018-09-27#Artikel2
  - number: '3.1'
    text: |-
      De buitengewoon opsporingsambtenaar is bevoegd tot het opsporen van de strafbare feiten behorend tot het domein VI
      Generieke Opsporing, van [bijlage A-I van de Circulaire Buitengewoon opsporingsambtenaar][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027483
    url: https://wetten.overheid.nl/BWBR0034709/2018-09-27#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0027483
  - number: '3.2'
    text: |-
      De opsporingsbevoegdheid, bedoeld in het eerste lid, geldt voor het grondgebied van Nederland, voor zover
      noodzakelijk voor een goede vervulling van de aan de functie gerelateerde taken.
    url: https://wetten.overheid.nl/BWBR0034709/2018-09-27#Artikel3
  - number: '3.3'
    text: |-
      De buitengewoon opsporingsambtenaar vermeldt in zijn processen-verbaal en schriftelijke verslagleggingen het in het
      eerste lid genoemde domein.
    url: https://wetten.overheid.nl/BWBR0034709/2018-09-27#Artikel3
  - number: '4'
    text: Op grond van dit besluit kunnen maximaal 1500 personen als buitengewoon opsporingsambtenaar worden beëdigd.
    url: https://wetten.overheid.nl/BWBR0034709/2018-09-27#Artikel4
  - number: '5.1'
    text: |-
      Als toezichthouder als bedoeld in [artikel 36 van het Besluit buitengewoon opsporingsambtenaar][ref1] is aangewezen
      de hoofdofficier van justitie bij het Landelijk Parket.


      [ref1]: https://wetten.overheid.nl/BWBR0007013#Artikel36
    url: https://wetten.overheid.nl/BWBR0034709/2018-09-27#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007013
        artikel: '36'
  - number: '5.2'
    text: |-
      Als direct toezichthouder als bedoeld in [artikel 36 van het Besluit buitengewoon opsporingsambtenaar][ref1] is
      aangewezen de korpschef als bedoeld in [artikel 27 van de Politiewet 2012][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007013#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel27
    url: https://wetten.overheid.nl/BWBR0034709/2018-09-27#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007013
        artikel: '36'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '27'
  - number: '6.1'
    text: |-
      De buitengewoon opsporingsambtenaar kan de in
      __REF000___________________________________________________________________________________________________________
      _______ omschreven bevoegdheden uitoefenen met gebruikmaking van handboeien, korte wapenstok, pepperspray en
      vuurwapen.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel7
    url: https://wetten.overheid.nl/BWBR0034709/2018-09-27#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '7'
  - number: '6.2'
    text: |-
      De buitengewoon opsporingsambtenaar werkzaam in de functie van (inrichtings)Beveiliger BOT en LBB, kan gedurende
      de uitoefening van zijn taak als buitengewoon opsporingsambtenaar tevens zijn uitgerust met een semi-automatisch
      machinepistool van het merk Heckler en Koch, type MP5 A2 (met vaste kolf: niet automatisch), type MP5 A3 (met
      inschuifbare kolf: niet automatisch) kaliber 9 millimeter maal 19 millimeter.
    url: https://wetten.overheid.nl/BWBR0034709/2018-09-27#Artikel6
  - number: '6.3'
    text: |-
      De buitengewoon opsporingsambtenaar werkzaam in de functie van (inrichtings)Beveiliger BOT kan gedurende de
      uitoefening van zijn taak als buitengewoon opsporingsambtenaar tevens zijn uitgerust met een semi-automatische
      uitvoering van de Heckler en Koch 416, type A5.
    url: https://wetten.overheid.nl/BWBR0034709/2018-09-27#Artikel6
  - number: '6.4'
    text: |-
      De buitengewoon opsporingsambtenaar, werkzaam in de functie van (inrichtings)Beveiliger BOT en
      (inrichtings)Beveiliger LBB, kan gedurende zijn uitoefening van zijn taak als buitengewoon opsporingsambtenaar
      bovendien zijn uitgerust met CS-traangasgranaten en traangasverspreidende middelen van een door Onze Minister
      goedgekeurd merk en type.
    url: https://wetten.overheid.nl/BWBR0034709/2018-09-27#Artikel6
  - number: '7.1'
    text: 'De algemeen directeur DV&O brengt jaarlijks, voor 1 april, verslag uit over:'
    url: https://wetten.overheid.nl/BWBR0034709/2018-09-27#Artikel7
  - number: 7.1.a
    text: |-
      het aantal buitengewoon opsporingsambtenaren werkzaam in de in [artikel 2][ref1] genoemde functie;


      [ref1]: https://wetten.overheid.nl/BWBR0034709#Artikel2
    url: https://wetten.overheid.nl/BWBR0034709/2018-09-27#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0034709
        artikel: '2'
  - number: 7.1.b
    text: de door die buitengewoon opsporingsambtenaren verrichte activiteiten;
    url: https://wetten.overheid.nl/BWBR0034709/2018-09-27#Artikel7
  - number: 7.1.c
    text: |-
      de stand van zaken met betrekking tot de opleiding van die buitengewoon opsporingsambtenaren, waarbij in ieder
      geval wordt aangegeven hoeveel personen in het verslagjaar zijn aangemeld voor het door de Staatssecretaris van
      Veiligheid en Justitie goedgekeurde examen en hoeveel personen in dat jaar voor dat examen zijn geslaagd.
    url: https://wetten.overheid.nl/BWBR0034709/2018-09-27#Artikel7
  - number: '7.2'
    text: |-
      Dit verslag wordt toegezonden aan de in [artikel 5][ref1] bedoelde toezichthouder en direct toezichthouder en aan
      het Ministerie van Veiligheid en Justitie, Dienst Justis, afdeling V&T, Postbus 20300, 2500 EH Den Haag.


      [ref1]: https://wetten.overheid.nl/BWBR0034709#Artikel5
    url: https://wetten.overheid.nl/BWBR0034709/2018-09-27#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0034709
        artikel: '5'
