      [artikel 8][ref1] genoemde besluit, worden geacht mede te zijn afgegeven op basis van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0034709#Artikel8
    url: https://wetten.overheid.nl/BWBR0034709/2018-09-27#Artikel9
