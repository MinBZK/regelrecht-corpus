---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_ruimtevaartactiviteiten
regulatory_layer: WET
publication_date: '2025-01-17'
valid_from: '2008-01-01'
bwb_id: BWBR0021418
url: https://wetten.overheid.nl/BWBR0021418/2008-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is ten aanzien van ruimtevaartactiviteiten en de
    instelling en beheer van een register van ruimtevoorwerpen regels te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Economische Zaken;'
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel1
  - number: 1.b
    text: |-
      ruimtevaartactiviteiten: het lanceren, het bedienen van de vlucht of het geleiden van ruimtevoorwerpen in de
      kosmische ruimte;
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel1
  - number: 1.c
    text: 'ruimtevoorwerp: ieder voorwerp gelanceerd of bestemd om te worden gelanceerd in de kosmische ruimte;'
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel1
  - number: 1.d
    text: |-
      Nederlands schip: een schip als bedoeld in [artikel 1, onderdeel b, van de Zeevaartbemanningswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel1
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '1'
  - number: 1.e
    text: |-
      Nederlands luchtvaartuig: een in Nederland krachtens [artikel 3.3 van de Wet luchtvaart][ref1] geregistreerd
      luchtvaartuig;


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
  - number: 1.f
    text: |-
      Ruimteverdrag: het op 27 januari 1967 te Londen/Moskou/Washington tot stand gekomen Verdrag inzake de beginselen
      waaraan de activiteiten van Staten zijn onderworpen bij het onderzoek en gebruik van de kosmische ruimte, met
      inbegrip van de maan en andere hemellichamen (Trb. 1967, 31);
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel1
  - number: 1.g
    text: |-
      Aansprakelijkheidsverdrag: de op 29 maart 1972 te Londen/Moskou/Washington tot stand gekomen Overeenkomst inzake de
      internationale aansprakelijkheid voor schade veroorzaakt door ruimtevoorwerpen (Trb. 1981, 37).
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel1
  - number: '2.1'
    text: |-
      Deze wet is van toepassing op ruimtevaartactiviteiten die worden verricht in of vanuit Nederland dan wel op of
      vanaf een Nederlands schip of Nederlands luchtvaartuig.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel2
  - number: '2.2'
    text: 'Bij algemene maatregel van bestuur kan deze wet tevens geheel of gedeeltelijk van toepassing worden verklaard op:'
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel2
  - number: 2.2.a
    text: |-
      daarbij aan te wijzen ruimtevaartactiviteiten die worden verricht door een Nederlandse natuurlijke of rechtspersoon
      op of vanaf het grondgebied van een staat die geen partij is bij het Ruimteverdrag dan wel op of vanaf een schip of
      luchtvaartuig dat valt onder de rechtsmacht van een staat die geen partij is bij het Ruimteverdrag;
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel2
  - number: 2.2.b
    text: het vanuit Nederland door een natuurlijke of rechtspersoon organiseren van activiteiten in de kosmische ruimte.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel2
  - number: '3.1'
    text: |-
      Het is verboden zonder daartoe verleende vergunning van Onze Minister ruimtevaartactiviteiten als bedoeld in
      [artikel 2][ref1] te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0021418#Artikel2
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0021418
        artikel: '2'
        hoofdstuk: '1'
  - number: '3.2'
    text: |-
      Het eerste lid is niet van toepassing op ruimtevaartactiviteiten die worden verricht onder de verantwoordelijkheid
      van één of meer Onzer Ministers.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel3
  - number: '3.3'
    text: 'Aan de vergunning kunnen voorschriften en beperkingen worden verbonden met het oog op:'
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel3
  - number: 3.3.a
    text: veiligheid van personen en goederen;
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel3
  - number: 3.3.b
    text: bescherming van het milieu in de kosmische ruimte;
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel3
  - number: 3.3.c
    text: financiële zekerheid;
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel3
  - number: 3.3.d
    text: bescherming van de openbare orde;
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel3
  - number: 3.3.e
    text: veiligheid van de staat;
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel3
  - number: 3.3.f
    text: het kunnen voldoen aan de internationale verplichtingen van de staat.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel3
  - number: '3.4'
    text: |-
      De vergunning wordt verleend onder voorwaarde van het hebben en instandhouden van de naar het oordeel van Onze
      Minister hoogst mogelijke dekking voor de aansprakelijkheid voortvloeiende uit de ruimtevaartactiviteiten waarvoor
      vergunning wordt gevraagd. Daarbij wordt rekening gehouden met hetgeen redelijkerwijs door verzekering kan worden
      gedekt.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel3
  - number: '3.5'
    text: |-
      Aan de vergunning kan een termijn worden verbonden waarbinnen de ruimtevaartactiviteiten door de vergunninghouder
      worden aangevangen.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel3
  - number: '3.6'
    text: De vergunning wordt verleend voor de duur van de ruimtevaartactiviteiten.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel3
  - number: '3.7'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van het bepaalde in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel3
  - number: '4.1'
    text: De aanvraag om een vergunning wordt ingediend bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel4
  - number: '4.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de wijze waarop de aanvraag geschiedt en de
      gegevens en bescheiden die door de aanvrager worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel4
  - number: '4.3'
    text: |-
      Bij ministeriële regeling kunnen voorts eisen worden gesteld waaraan de aanvrager moet voldoen om in aanmerking te
      komen voor een vergunning. Deze eisen kunnen betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel4
  - number: 4.3.a
    text: de kennis en ervaring van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel4
  - number: 4.3.b
    text: het verkregen hebben van toestemming voor het gebruik van frequentieruimte.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel4
  - number: '5'
    text: Onze Minister beslist op een aanvraag om een vergunning binnen zes maanden na de ontvangst daarvan.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel5
  - number: '6.1'
    text: 'Een vergunning wordt geweigerd indien:'
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel6
  - number: 6.1.a
    text: de naleving van een verdrag of een bindend besluit van een volkenrechtelijke organisatie dit vordert;
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel6
  - number: 6.1.b
    text: |-
      feiten of omstandigheden er naar het oordeel van Onze Minister op duiden dat de veiligheid van personen en
      goederen, de bescherming van het milieu in de ruimte, de bescherming van de openbare orde of de veiligheid van de
      staat door het verlenen van de vergunning in gevaar kunnen worden gebracht;
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel6
  - number: 6.1.c
    text: verlening daarvan in strijd zou zijn met bij of krachtens deze wet gestelde regels.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel6
  - number: '6.2'
    text: 'Een vergunning kan door Onze Minister worden geweigerd indien:'
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel6
  - number: 6.2.a
    text: |-
      een eerder verleende vergunning is ingetrokken wegens overtreding van bij of krachtens deze wet gestelde regels dan
      wel van de aan de vergunning verbonden voorschriften;
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel6
  - number: 6.2.b
    text: |-
      de aanvrager niet heeft voldaan aan op hem rustende verplichtingen, voortvloeiend uit een eerder verleende
      vergunning;
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel6
  - number: 6.2.c
    text: de aanvraag of de aanvrager niet voldoet aan de daarvoor bij of krachtens deze wet gestelde regels;
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel6
  - number: 6.2.d
    text: |-
      gegronde vrees bestaat dat de aanvrager niet overeenkomstig de bij of krachtens deze wet gestelde regels zal
      handelen;
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel6
  - number: 6.2.e
    text: |-
      de bescherming van de belangen, genoemd in [artikel 3, derde lid][ref1], dit vordert.


      [ref1]: https://wetten.overheid.nl/BWBR0021418#Artikel3
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0021418
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '7.1'
    text: 'De vergunning wordt ingetrokken indien:'
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel7
  - number: 7.1.a
    text: de vergunninghouder hierom verzoekt;
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel7
  - number: 7.1.b
    text: de naleving van een verdrag of een bindend besluit van een volkenrechtelijke organisatie dit vordert;
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel7
  - number: 7.1.c
    text: |-
      de vrees gewettigd is dat het van kracht blijven van de vergunning gevaar zal opleveren voor de veiligheid van
      personen en goederen, de bescherming van het milieu in de ruimte, de bescherming van de openbare orde of de
      veiligheid van de staat.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel7
  - number: '7.2'
    text: 'Een vergunning kan door Onze Minister worden ingetrokken indien:'
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel7
  - number: 7.2.a
    text: |-
      niet overeenkomstig de bij of krachtens deze wet gestelde regels dan wel de aan de vergunning verbonden
      voorschriften is of wordt gehandeld;
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel7
  - number: 7.2.b
    text: de ruimtevaartactiviteiten niet binnen de gestelde termijn zijn aangevangen;
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel7
  - number: 7.2.c
    text: het doel van de ruimtevaartactiviteiten waarvoor vergunning is verleend, wezenlijk is veranderd;
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel7
  - number: 7.2.d
    text: dit wordt gerechtvaardigd door een wijziging in de technische of financiële mogelijkheden van de vergunninghouder;
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel7
  - number: 7.2.e
    text: |-
      de bij de aanvraag verstrekte gegevens of bescheiden zodanig onjuist of onvolledig blijken, dat op de aanvraag een
      andere beslissing zou zijn genomen, als bij de beoordeling daarvan de juiste omstandigheden volledig bekend waren
      geweest;
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel7
  - number: 7.2.f
    text: |-
      de bescherming van de belangen, genoemd in [artikel 3, derde lid][ref1], dit vordert.


      [ref1]: https://wetten.overheid.nl/BWBR0021418#Artikel3
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0021418
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '7.3'
    text: |-
      Alvorens de vergunning wordt ingetrokken, neemt Onze Minister alle nodige maatregelen om de veiligheid van personen
      en goederen, de bescherming van het milieu in de ruimte, de bescherming van de openbare orde of de veiligheid van
      de staat te waarborgen. Onze Minister geeft daartoe de nodige aanwijzingen aan degene wiens vergunning zal worden
      ingetrokken. Deze is gehouden de aanwijzingen op te volgen.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel7
  - number: '7.4'
    text: |-
      Op de gronden, genoemd in het tweede lid, kan Onze Minister in plaats van de vergunning intrekken deze ook
      wijzigen.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel7
  - number: '8.1'
    text: De vergunning is niet overdraagbaar.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel8
  - number: '8.2'
    text: |-
      Onze Minister kan op verzoek de tenaamstelling van de vergunning aanpassen indien de vergunning gehouden wordt door
      een rechtspersoon die fuseert, wordt gesplitst of verandert van naam.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel8
  - number: '9.1'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat ter dekking van de kosten van werkzaamheden of diensten
      ter uitvoering van het bij of krachtens deze wet bepaalde een vergoeding verschuldigd is door degene ten behoeve
      van wie werkzaamheden of diensten zijn verricht overeenkomstig bij of krachtens algemene maatregel van bestuur
      gestelde regels.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel9
  - number: '9.2'
    text: |-
      Indien een ingevolge het eerste lid verschuldigd bedrag niet is betaald binnen de daarvoor gestelde termijn,
      wordt het desbetreffende bedrag vermeerderd met de wettelijke rente, te rekenen vanaf de dag waarop die termijn
      is verstreken.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel9
  - number: '9.3'
    text: |-
      Indien niet is betaald binnen de termijn bedoeld in het tweede lid, wordt degene die het bedrag is verschuldigd
      schriftelijk bevolen binnen twee weken alsnog het bedrag, verhoogd met de wettelijke rente en de kosten van de
      aanmaning, te betalen.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel9
  - number: '10.1'
    text: |-
      Indien zich een voorval voordoet of heeft voorgedaan dat gevaar kan opleveren voor de veiligheid van personen en
      goederen, de bescherming van het milieu in de ruimte, de bescherming van de openbare orde of de veiligheid van de
      staat, of anderszins schade kan opleveren, treft de vergunninghouder onverwijld de maatregelen die redelijkerwijs
      van hem kunnen worden verlangd om de gevolgen van die gebeurtenis te voorkomen of, voor zover die gevolgen niet
      kunnen worden voorkomen, zoveel mogelijk te beperken en ongedaan te maken.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel10
  - number: '10.2'
    text: |-
      De vergunninghouder meldt Onze Minister onverwijld een voorval als bedoeld in het eerste lid en verstrekt tevens zo
      spoedig mogelijk de gegevens met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel10
  - number: 10.2.a
    text: de oorzaken van het voorval en de omstandigheden waaronder het voorval zich heeft voorgedaan;
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel10
  - number: 10.2.b
    text: de gegevens die van belang zijn om de aard en de ernst van de gevolgen van het voorval te kunnen beoordelen;
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel10
  - number: 10.2.c
    text: |-
      de maatregelen die zijn genomen of worden overwogen om de gevolgen van het voorval te voorkomen, te beperken of
      ongedaan te maken;
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel10
  - number: 10.2.d
    text: |-
      de maatregelen die zijn genomen of worden overwogen om te voorkomen dat een zodanig voorval zich tijdens een
      ruimtevaartactiviteit nogmaals kan voordoen.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel10
  - number: '11.1'
    text: |-
      Onze Minister houdt een register met gegevens betreffende ruimtevoorwerpen die gebruikt worden in het kader van
      ruimtevaartactiviteiten als bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021418#Artikel2
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0021418
        artikel: '2'
        hoofdstuk: '1'
  - number: '11.2'
    text: |-
      De vergunninghouder verstrekt op bij algemene maatregel van bestuur vast te stellen momenten de voor het register
      benodigde gegevens.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel11
  - number: '11.3'
    text: |-
      Onze Minister draagt zorg voor registratie van ruimtevoorwerpen die gebruikt worden in het kader van
      ruimtevaartactiviteiten die worden verricht onder de verantwoordelijkheid van één of meer Onzer Ministers.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel11
  - number: '11.4'
    text: Bij of krachtens algemene maatregel van bestuur worden regels gesteld ter uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel11
  - number: '12.1'
    text: |-
      In het geval de staat op grond van artikel VII van het Ruimteverdrag of het Aansprakelijkheidsverdrag gehouden is
      tot betaling van schadevergoeding, heeft de staat het recht deze geheel of gedeeltelijk te verhalen op degene wiens
      ruimtevaartactiviteit de schade heeft veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel12
  - number: '12.2'
    text: |-
      De vergunninghouder is, per gebeurtenis of serie van gebeurtenissen met dezelfde oorzaak, aansprakelijk voor
      schade veroorzaakt door zijn ruimtevaartactiviteiten, tot de hoogte van het verzekerde bedrag, bedoeld in
      [artikel 3, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021418#Artikel3
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0021418
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '12.3'
    text: |-
      De staat oefent het recht van verhaal, bedoeld in het eerste lid, in voorkomend geval jegens de vergunninghouder
      uit tot maximaal de hoogte van het verzekerde bedrag, bedoeld in [artikel 3, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021418#Artikel3
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0021418
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '12.4'
    text: |-
      De staat kan het recht van verhaal, bedoelt in het derde lid, in voorkomend geval eveneens uitoefenen tegen de
      verzekeraar van de vergunninghouder.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel12
  - number: '13.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens de [artikelen 3][ref1],
      [7, derde lid, derde volzin][ref2], [10][ref3], en [11, tweede lid][ref4], zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0021418#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0021418#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0021418#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0021418#Artikel11
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0021418
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0021418
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0021418
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0021418
        artikel: '11'
        hoofdstuk: '3'
  - number: '13.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel13
  - number: '14.1'
    text: |-
      Onze Minister is bevoegd tot toepassing van bestuursdwang ter handhaving van de [artikelen 3][ref1],
      [7, derde lid][ref2], [10][ref3] en [11, tweede en vierde lid, van deze wet][ref4] en van
      [artikel 5:20 van de Algemene wet bestuursrecht][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0021418#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0021418#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0021418#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0021418#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0021418
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0021418
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0021418
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0021418
        artikel: '11'
        hoofdstuk: '3'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '14.2'
    text: |-
      Voor de toepassing van het eerste lid is vereiste spoed als bedoeld in
      [artikel 5:24, vijfde lid, van de Algemene wet bestuursrecht][ref1] in elk geval aanwezig indien het niet naleven
      van de in het eerste lid bedoelde verplichtingen een ernstige en directe bedreiging vormt voor de veiligheid van
      personen en goederen, de veiligheid van de staat of de openbare orde.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '15.1'
    text: |-
      Ingeval van overtreding van het bepaalde bij of krachtens [artikelen 3, eerste, derde en vierde lid][ref1],
      [7, derde lid, derde volzin][ref2], [10][ref3], of van [artikel 5:20 van de Algemene wet bestuursrecht][ref4], kan
      Onze Minister een bestuurlijke boete opleggen van ten hoogste € 450 000, of, indien dat meer is, 10 procent van de
      relevante jaaromzet van de onderneming in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0021418#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0021418#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0021418#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0021418
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0021418
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0021418
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '15.2'
    text: |-
      Ingeval van overtreding van het bepaalde bij of krachtens [artikel 11, tweede en vierde lid][ref1], kan Onze
      Minister een bestuurlijke boete opleggen van ten hoogste € 100 000.


      [ref1]: https://wetten.overheid.nl/BWBR0021418#Artikel11
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0021418
        artikel: '11'
        hoofdstuk: '3'
  - number: '15.3'
    text: |-
      De hoogte van de bestuurlijke boete wordt in ieder geval afgestemd op de ernst en de duur van de overtreding,
      alsmede op de mate waarin de overtreder daarvan een verwijt kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel15
  - number: '16.1'
    text: Onze Minister legt geen bestuurlijke boete op voorzover de overtreding niet aan de overtreder kan worden verweten.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel16
  - number: '16.2'
    text: 'Onze Minister legt geen bestuurlijke boete op indien:'
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel16
  - number: 16.2.a
    text: de overtreder is overleden;
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel16
  - number: 16.2.b
    text: aan de overtreder wegens dezelfde overtreding reeds eerder een bestuurlijke boete is opgelegd;
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel16
  - number: 16.2.c
    text: |-
      een kennisgeving als bedoeld in [artikel 20, derde lid, onderdeel a][ref1], is bekendgemaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0021418#Artikel20
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0021418
        artikel: '20'
        hoofdstuk: '5'
  - number: 16.2.d
    text: een strafvervolging is ingesteld en het onderzoek ter terechtzitting is begonnen, of
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel16
  - number: 16.2.e
    text: |-
      het recht tot strafvervolging is vervallen ingevolge [artikel 74][ref1] of [74c van het Wetboek van Strafrecht][ref2]
      dan wel ingevolge [artikel 37 van de Wet op de economische delicten][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel74c
      [ref3]: https://wetten.overheid.nl/BWBR0002063#Artikel37
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 74c
      - id: ref3
        bwb_id: BWBR0002063
        artikel: '37'
  - number: '16.3'
    text: |-
      Een bestuurlijke boete vervalt indien zij op het tijdstip van het overlijden van de overtreder niet onherroepelijk
      is. Een onherroepelijke bestuurlijke boete vervalt voorzover zij op dat tijdstip nog niet is betaald.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel16
  - number: '17.1'
    text: De bevoegdheid tot het opleggen van een bestuurlijke boete vervalt vijf jaar nadat de overtreding is begaan.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel17
  - number: '17.2'
    text: |-
      Indien tegen de bestuurlijke boete bezwaar wordt gemaakt of beroep wordt ingesteld, wordt de vervaltermijn
      opgeschort tot onherroepelijk op het bezwaar of beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel17
  - number: '18.1'
    text: |-
      Indien een ambtenaar als bedoeld in [artikel 13][ref1] vaststelt dat een overtreding als bedoeld in
      [artikel 15][ref2] is begaan, maakt hij daarvan een rapport op.


      [ref1]: https://wetten.overheid.nl/BWBR0021418#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0021418#Artikel15
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0021418
        artikel: '13'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0021418
        artikel: '15'
        hoofdstuk: '5'
  - number: '18.2'
    text: 'Het rapport is gedagtekend en vermeldt:'
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel18
  - number: 18.2.a
    text: de naam van de overtreder;
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel18
  - number: 18.2.b
    text: de overtreding alsmede de wettelijke bepaling waarmee in strijd is gehandeld;
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel18
  - number: 18.2.c
    text: feiten en omstandigheden op grond waarvan is vastgesteld dat een overtreding is gepleegd;
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel18
  - number: 18.2.d
    text: waar en wanneer de onder c bedoelde feiten en omstandigheden zich hebben voorgedaan.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel18
  - number: '18.3'
    text: Een afschrift van het rapport wordt gezonden aan degene die de overtreding heeft begaan.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel18
  - number: '18.4'
    text: |-
      Op verzoek van de belanghebbende die het rapport wegens zijn gebrekkige kennis van de Nederlandse taal onvoldoende
      begrijpt, draagt Onze Minister er zoveel mogelijk zorg voor dat de inhoud van het rapport aan de betrokkene wordt
      meegedeeld in een voor hem begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel18
  - number: '19.1'
    text: |-
      Indien aan een handeling van Onze Minister redelijkerwijs de gevolgtrekking kan worden verbonden dat aan de
      overtreder een bestuurlijke boete zal worden opgelegd, is er geen verplichting meer van de zijde van die overtreder
      om ten behoeve van deze oplegging een verklaring omtrent de overtreding af te leggen.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel19
  - number: '19.2'
    text: De overtreder wordt hierop gewezen alvorens hem wordt gevraagd inlichtingen te verstrekken.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel19
  - number: '20.1'
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] wordt de belanghebbende schriftelijk
      opgeroepen om naar keuze schriftelijk of mondeling zijn zienswijze naar voren te brengen omtrent het rapport.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
  - number: '20.2'
    text: |-
      Indien de belanghebbende zijn zienswijze mondeling naar voren brengt, draagt Onze Minister er op verzoek van
      de belanghebbende die de Nederlandse taal onvoldoende begrijpt, zorg voor dat een tolk wordt benoemd die de
      belanghebbende bij het horen kan bijstaan, tenzij redelijkerwijs kan worden aangenomen dat daaraan geen behoefte
      bestaat.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel20
  - number: '20.3'
    text: 'Indien Onze Minister, nadat de overtreder zijn zienswijze naar voren heeft gebracht, beslist dat:'
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel20
  - number: 20.3.a
    text: voor de overtreding geen bestuurlijke boete zal worden opgelegd, of
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel20
  - number: 20.3.b
    text: de overtreding alsnog aan de officier van justitie zal worden voorgelegd,
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel20
  - number: '21.1'
    text: 'De beschikking tot oplegging van een last onder dwangsom of een bestuurlijke boete, vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel21
  - number: 21.1.a
    text: de overtreding ter zake waarvan zij is gegeven, alsmede het overtreden wettelijk voorschrift;
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel21
  - number: 21.1.b
    text: |-
      indien een last onder dwangsom wordt opgelegd de naam van de overtreder, de inhoud van de last en de termijn
      waarvoor deze geldt;
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel21
  - number: 21.1.c
    text: |-
      indien een bestuurlijke boete wordt opgelegd de naam van de overtreder, de te betalen geldsom, alsmede een
      toelichting op de hoogte daarvan.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel21
  - number: '21.2'
    text: |-
      Op verzoek van de overtreder die de beschikking wegens zijn gebrekkige kennis van de Nederlandse taal onvoldoende
      begrijpt, draagt Onze Minister er zoveel mogelijk zorg voor dat de in die beschikking vermelde informatie aan de
      overtreder wordt meegedeeld in een voor hem begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel21
  - number: '21.3'
    text: |-
      Onze Minister beslist binnen dertien weken na de dagtekening van het rapport omtrent het opleggen van een
      bestuurlijke boete.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel21
  - number: '22.1'
    text: |-
      Een bestuurlijke boete wordt betaald binnen zes weken nadat de beschikking waarbij de boete is opgelegd, in werking
      is getreden.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel22
  - number: '22.2'
    text: |-
      De boete wordt vermeerderd met de wettelijke rente, te rekenen zes weken vanaf de dag waarop de in het eerste lid
      genoemde beschikking is bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel22
  - number: '22.3'
    text: |-
      Indien niet is betaald binnen de in het eerste lid genoemde termijn, wordt degene die de boete is verschuldigd
      schriftelijk bevolen binnen twee weken alsnog het bedrag van de bestuurlijke boete, verhoogd met de krachtens het
      tweede lid verschuldigde rente en de kosten van de aanmaning, te betalen.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel22
  - number: '22.4'
    text: |-
      De werking van een beschikking als bedoeld in het eerste lid wordt opgeschort totdat de beroepstermijn is
      verstreken of, indien beroep is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel22
  - number: '23.1'
    text: |-
      Bij gebreke van betaling binnen de termijn van twee weken, bedoeld in [artikel 22, derde lid][ref1], kan Onze
      Minister van de overtreder de verschuldigde boete, verhoogd met de krachtens [artikel 22, tweede lid][ref2],
      verschuldigde rente en de op de aanmaning en invordering betrekking hebbende kosten, invorderen bij dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0021418#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0021418#Artikel22
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0021418
        artikel: '22'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0021418
        artikel: '22'
        hoofdstuk: '5'
  - number: '23.2'
    text: |-
      Het dwangbevel wordt op kosten van de overtreder bij deurwaardersexploot betekend en levert een executoriale titel
      op in de zin van [Boek 2 van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '23.3'
    text: Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van de staat.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel23
  - number: '23.4'
    text: |-
      Het verzet schorst de tenuitvoerlegging. Op verzoek van de staat kan de rechter de schorsing van de
      tenuitvoerlegging opheffen.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel23
  - number: '25.1'
    text: |-
      Ruimtevaartactiviteiten als bedoeld in [artikel 2][ref1] die op de datum van inwerkingtreding van deze wet
      plaatsvinden, kunnen zonder vergunning worden voortgezet gedurende een periode van twaalf maanden vanaf deze datum.


      [ref1]: https://wetten.overheid.nl/BWBR0021418#Artikel2
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0021418
        artikel: '2'
        hoofdstuk: '1'
  - number: '25.2'
    text: |-
      Eenieder deelt binnen zes maanden na de datum van inwerkingtreding van deze wet aan Onze Minister de
      ruimtevaartactiviteiten mee die hij verricht en waarop deze wet betrekking kan hebben.
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel25
  - number: '27'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.****
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel27
  - number: '28'
    text: 'Deze wet wordt aangehaald als: Wet ruimtevaartactiviteiten.'
    url: https://wetten.overheid.nl/BWBR0021418/2008-01-01#Artikel28
