preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is om regels te stellen ter uitvoering van richtlijn
    (EU) 2015/849 van het Europees Parlement en de Raad van 20 mei 2015 inzake de voorkoming van het gebruik van
    het financiële stelsel voor het witwassen van geld of terrorismefinanciering, tot wijziging van Verordening (EU)
    nr. 648/2012 van het Europees Parlement en de Raad en tot intrekking van Richtlijn 2005/60/EG van het Europees
    Parlement en de Raad en Richtlijn 2006/70/EG van de Commissie (PbEU 2015, L 141), alsmede in verband met de
    uitvoering van verordening (EU) 2015/847 van het Europees Parlement en de Raad van 20 mei 2015 betreffende bij
    geldovermakingen te voegen informatie en tot intrekking van Verordening (EG) nr. 1781/2006 (PbEU 2015, L 141);

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0041195/2018-07-25#ArtikelAanhef
articles:
  - number: VII
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de verschillende artikelen of
      onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0041195/2018-07-25#ArtikelVII
  - number: VIII
    text: 'Deze wet wordt aangehaald als: Implementatiewet vierde anti-witwasrichtlijn.'
    url: https://wetten.overheid.nl/BWBR0041195/2018-07-25#ArtikelVIII
