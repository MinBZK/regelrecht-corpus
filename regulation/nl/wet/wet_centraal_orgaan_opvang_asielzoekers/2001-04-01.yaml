---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_centraal_orgaan_opvang_asielzoekers
regulatory_layer: WET
publication_date: '2024-06-27'
valid_from: '2001-04-01'
bwb_id: BWBR0006685
url: https://wetten.overheid.nl/BWBR0006685/2001-04-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de materiële en immateriële opvang van asielzoekers toe
    te vertrouwen aan een wettelijk ingesteld bestuursorgaan;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Welzijn, Volksgezondheid en Cultuur;'
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel1
  - number: 1.b
    text: |-
      orgaan: het Centraal Orgaan opvang asielzoekers, bedoeld in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006685#Artikel2
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006685
        artikel: '2'
        paragraaf: '2'
  - number: 1.c
    text: 'overgangsdatum: de datum waarop deze wet in werking treedt.'
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel1
  - number: '2.1'
    text: Er is een Centraal Orgaan opvang asielzoekers, dat rechtspersoonlijkheid bezit.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel2
  - number: '2.2'
    text: Het orgaan heeft zijn zetel ter plaatse door Onze Minister te bepalen.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel2
  - number: '3.1'
    text: 'Het orgaan is belast met:'
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel3
  - number: 3.1.a
    text: de materiële en immateriële opvang van asielzoekers;
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel3
  - number: 3.1.b
    text: het plaatsen van asielzoekers in een opvangvoorziening;
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel3
  - number: 3.1.c
    text: |-
      het plaatsen van asielzoekers op gemeentelijke opvangplaatsen, alsmede het betalen van bijdragen aan de
      desbetreffende gemeente ten behoeve van de kosten van deze opvang;
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel3
  - number: 3.1.d
    text: |-
      werkzaamheden met betrekking tot de bemiddeling bij de uitstroom van verblijfsgerechtigden als bedoeld in
      [artikel 60][ref1] naar door burgemeester en wethouders beschikbaar gestelde huisvesting. Onze Minister van
      Binnenlandse Zaken kan terzake beleidsregels vaststellen;


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel60a
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: 60a
  - number: 3.1.e
    text: door Onze Minister aan het orgaan op te dragen andere taken die samenhangen met de opvang van asielzoekers.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel3
  - number: '3.2'
    text: |-
      Onze minister kan het orgaan taken als bedoeld in het eerste lid opdragen met betrekking tot andere categorieën
      vreemdelingen.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel3
  - number: 3a.1
    text: |-
      In afwijking van [artikel 72, derde lid, van de Vreemdelingenwet 2000][ref1] zijn de [afdelingen 1][ref2],
      [3][ref3] en [4 van hoofdstuk 7 van de Vreemdelingenwet 2000][ref4] van toepassing op besluiten in het kader van
      het onthouden dan wel de beëindiging van verstrekkingen bij of krachtens deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Afdeling1
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Afdeling3
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Afdeling4
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '72'
      - id: ref2
        bwb_id: BWBR0011823
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0011823
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0011823
        afdeling: '4'
  - number: 3a.2
    text: |-
      In afwijking van [artikel 72, derde lid, van de Vreemdelingenwet 2000][ref1] worden handelingen van het orgaan ten
      aanzien van een vreemdeling als zodanig die worden verricht in het kader van de beëindiging van verstrekkingen bij
      of krachtens deze wet, voor de toepassing van deze wet met een beschikking gelijkgesteld. De [afdelingen 1][ref2],
      [3][ref3] en [4 van hoofdstuk 7 van de Vreemdelingenwet 2000][ref4] zijn op die beschikking van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Afdeling1
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Afdeling3
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Afdeling4
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '72'
      - id: ref2
        bwb_id: BWBR0011823
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0011823
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0011823
        afdeling: '4'
  - number: 3a.3
    text: |-
      In afwijking van het eerste en tweede lid is [artikel 82 van de Vreemdelingenwet 2000][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel82
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '82'
  - number: '4.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld ten aanzien van het verstrekken van subsidies
      door het orgaan aan gemeenten ten behoeve van kosten, verband houdende met de opvang van asielzoekers door het
      orgaan.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel4
  - number: '4.2'
    text: |-
      In deze algemene maatregel van bestuur kunnen tevens regels worden gesteld over de wijze waarop gemeenten
      dergelijke subsidies kunnen aanvragen.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel4
  - number: '5.1'
    text: Het bestuur van het orgaan bestaat uit ten hoogste negen leden, waaronder de voorzitter.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel5
  - number: '5.2'
    text: |-
      Onze Minister benoemt, schorst en ontslaat de voorzitter en de overige leden van het bestuur. Het bestuur wordt
      door Onze Minister in de gelegenheid gesteld zijn gevoelen kenbaar te maken over een voorgenomen besluit tot
      benoeming of ontslag.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel5
  - number: '5.3'
    text: |-
      Het bestuur wijst uit zijn midden een plaatsvervangend voorzitter aan en kan, eveneens uit zijn midden, een tweede
      plaatsvervangend voorzitter aanwijzen.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel5
  - number: '5.4'
    text: De leden worden benoemd voor vier jaren. De aftredende leden kunnen ten hoogste tweemaal worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel5
  - number: '6.1'
    text: Het bestuur van het orgaan stelt een bestuursreglement vast.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel6
  - number: '6.2'
    text: 'Het bestuursreglement houdt in ieder geval regels in met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel6
  - number: 6.2.a
    text: delegatie en mandaat van bevoegdheden van het bestuur;
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel6
  - number: 6.2.b
    text: de wijze van besluitvorming van het bestuur;
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel6
  - number: 6.2.c
    text: de mogelijkheid tot instelling van commissies.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel6
  - number: '7.1'
    text: |-
      Het bestuur van het orgaan draagt er zorg voor dat de taken, bedoeld in [artikel 3][ref1], op doelmatige en
      deskundige wijze worden uitgevoerd en draagt overigens zorg voor een goede uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006685#Artikel3
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006685
        artikel: '3'
        paragraaf: '2'
  - number: '7.2'
    text: |-
      Een besluit van het bestuur om werkzaamheden, die de uitvoering van taken als bedoeld in [artikel 3][ref1]
      betreffen, door derden te laten uitvoeren, behoeft voor zover het door Onze Minister aangegeven werkzaamheden
      betreft zijn goedkeuring.


      [ref1]: https://wetten.overheid.nl/BWBR0006685#Artikel3
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006685
        artikel: '3'
        paragraaf: '2'
  - number: '8.1'
    text: |-
      Het bestuur van het orgaan wordt in zijn werkzaamheden ondersteund door een bureau, aan het hoofd waarvan een
      algemene directeur is geplaatst.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel8
  - number: '8.2'
    text: Het bestuur benoemt, schorst en ontslaat de algemene directeur.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel8
  - number: '8.3'
    text: |-
      Het bestuur stelt regels met betrekking tot de taken en bevoegdheden van de algemene directeur en van de
      directeuren van de opvangcentra.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel8
  - number: '9.1'
    text: |-
      In afwijking van [artikel 1 van de Ambtenarenwet][ref1] zijn de bij het orgaan werkzame personen geen ambtenaar,
      maar werknemer naar burgerlijk recht.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel1
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '1'
  - number: '9.2'
    text: |-
      In afwijking van [artikel B1 van de Algemene burgerlijke pensioenwet](onbekend) zijn de bij het orgaan werkzame
      personen geen ambtenaar in de zin van voornoemde wet.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel9
  - number: '10'
    text: |-
      De voorzitter en de overige leden van het bestuur van het orgaan ontvangen voor hun werkzaamheden een vergoeding
      volgens door Onze Minister vast te stellen regels.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel10
  - number: '11'
    text: |-
      Het orgaan wordt in en buiten rechte vertegenwoordigd door de voorzitter van het bestuur en een ander bestuurslid.
      Bij ontstentenis wordt de voorzitter van het bestuur vervangen door de plaatsvervangend voorzitter.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel11
  - number: '12'
    text: |-
      Onze Minister kan regels stellen met betrekking tot verstrekkingen aan asielzoekers en andere categorieën
      vreemdelingen als bedoeld in [artikel 3, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006685#Artikel3
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006685
        artikel: '3'
        paragraaf: '2'
  - number: '13.1'
    text: |-
      Onze Minister kan beleidsregels vaststellen met betrekking tot de werkwijze en de uitvoering van de taken van het
      orgaan. Voor zover het taken betreft als bedoeld in [artikel 3, eerste lid, onderdeel ][ref1], worden beleidsregels
      echter niet dan in overeenstemming met Onze Minister van Binnenlandse Zaken vastgesteld. De beleidsregels hebben
      geen betrekking op de behandeling van individuele gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0006685#Artikel3
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006685
        artikel: '3'
        paragraaf: '2'
  - number: '13.2'
    text: |-
      Beleidsregels als bedoeld in het eerste lid worden niet vastgesteld dan nadat Onze Minister het bestuur van het
      orgaan in de gelegenheid heeft gesteld zijn gevoelen daaromtrent kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel13
  - number: '14.1'
    text: |-
      Onze Minister en het bestuur van het orgaan verstrekken elkaar wederzijds die informatie die van belang is voor de
      uitvoering van de uit deze wet voortvloeiende taken.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel14
  - number: '14.2'
    text: Onze Minister kan regels stellen met betrekking tot de verstrekking van informatie, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel14
  - number: '15.1'
    text: |-
      Het bestuur van het orgaan zendt jaarlijks voor 1 april aan Onze Minister een activiteitenverslag van het orgaan in
      het voorafgaande kalenderjaar. Onze Minister zendt het verslag aan beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel15
  - number: '15.2'
    text: Onze Minister kan regels stellen met betrekking tot de inrichting van het activiteitenverslag van het orgaan.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel15
  - number: '16.1'
    text: |-
      Het bestuur van het orgaan stelt het werkplan, de begroting en de jaarrekening van het orgaan vast. Deze behoeven
      de instemming van Onze Minister. De [artikelen 10:28 tot en met 10:31 van de Algemene wet bestuursrecht][ref1] zijn
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: '16.2'
    text: |-
      In afwijking van [artikel 4:21, derde lid, van de Algemene wet bestuursrecht][ref1] is [titel 4.2][ref2] van die
      wet op de subsidie van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
  - number: '16.3'
    text: De subsidie wordt per boekjaar verstrekt.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel16
  - number: '16.4'
    text: |-
      [Afdeling 4.2.8 van de Algemene wet bestuursrecht][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.2.8
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.2.8
  - number: '17.1'
    text: |-
      Het door het bestuur van het orgaan opgestelde activiteitenplan, de begroting en het financiële verslag behoeven de
      instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel17
  - number: '17.2'
    text: |-
      Indien door bijzondere omstandigheden voor het orgaan kosten ontstaan die niet zijn voorzien bij de indiening van
      de begroting wordt ter zake van die kosten een aanvullend activiteitenplan en een aanvullende begroting ingediend.
      Ook het aanvullend activiteitenplan en de aanvullende begroting behoeven de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel17
  - number: 17a.1
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel17a
  - number: 17a.1.a
    text: |-
      de gegevens die Onze Minister met het oog op het opstellen van de begroting verstrekt aan het orgaan, alsmede op
      welk tijdstip deze gegevens uiterlijk worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel17a
  - number: 17a.1.b
    text: |-
      de termijn waarbinnen Onze Minister op het verzoek tot verlening onderscheidenlijk tot vaststelling van de subsidie
      beslist;
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel17a
  - number: 17a.1.c
    text: de wijze waarop de subsidie wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel17a
  - number: 17a.1.d
    text: |-
      de handelingen, bedoeld in [artikel 4:71 van de Algemene wet bestuursrecht][ref1], waarvoor het orgaan de
      toestemming van Onze Minister behoeft;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 17a.1.e
    text: |-
      de gevallen waarin het orgaan een vergoeding voor vermogensvorming als bedoeld in
      [artikel 4:41 van de Algemene wet bestuursrecht][ref1] verschuldigd is, alsmede hoe deze vergoeding wordt berekend;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 17a.1.f
    text: het vormen van een egalisatiereserve;
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel17a
  - number: 17a.1.g
    text: de overige aan de subsidie verbonden verplichtingen;
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel17a
  - number: 17a.1.h
    text: het verlenen van voorschotten.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel17a
  - number: 17a.2
    text: |-
      De voordracht voor een krachtens het eerste lid vastgestelde algemene maatregel van bestuur wordt niet gedaan dan
      nadat het ontwerp aan de beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel17a
  - number: '18.1'
    text: Het bestuur zendt binnen vier maanden na afloop van het boekjaar het financiële verslag aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel18
  - number: '18.2'
    text: |-
      Bij het onderzoek, bedoeld in [artikel 4:78 van de Algemene wet bestuursrecht][ref1], onderzoekt
      de accountant tevens de naleving van de aan de subsidie verbonden verplichtingen. Onze Minister
      stelt een aanwijzing over de reikwijdte en de intensiteit van de controle, als bedoeld in
      [artikel 4:79 van de Algemene wet bestuursrecht][ref2], vast.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '18.3'
    text: |-
      De accountant geeft binnen dertien weken na afloop van het boekjaar aan het bestuur een schriftelijke verklaring af
      als bedoeld in [artikel 4:79, derde lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '18.4'
    text: |-
      Het bestuur en de in het tweede lid bedoelde accountant werken mee aan door Onze Minister in te stellen
      onderzoeken, die noodzakelijk zijn voor de uitvoering van de taak van het ministerie.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel18
  - number: '18.5'
    text: |-
      De instemming met het financiële verslag, bedoeld in [artikel 16, eerste lid][ref1], wordt slechts geheel of
      gedeeltelijk onthouden, indien uitgaven zijn geschied in strijd met het bepaalde bij of krachtens de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006685#Artikel16
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006685
        artikel: '16'
        paragraaf: '5'
  - number: '19'
    text: |-
      Onze Minister kan regels stellen met betrekking tot de inrichting van het activiteitenplan en de begroting, het
      beheer, de administratie en de inrichting van het financiële verslag.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel19
  - number: '20'
    text: |-
      In afwijking van [artikel 4:60 van de Algemene wet bestuursrecht][ref1] wordt de begroting voor het jaar waarin
      deze wet in werking treedt ingediend binnen een maand na die inwerkingtreding. Indien de inwerkingtreding
      plaatsvindt op een datum, gelegen na 1 september van enig jaar, geldt hetzelfde voor de begroting van het
      daaropvolgende jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '21.1'
    text: |-
      De personeelsleden van het Ministerie van Welzijn, Volksgezondheid en Cultuur die te werk zijn gesteld bij de
      Interimstichting Opvang Asielzoekers, gaan, indien Onze Minister niet anders heeft beslist, over in dienst van het
      orgaan op een arbeidsovereenkomst naar burgerlijk recht, ingaande op de overgangsdatum. Aan ieder personeelslid
      wordt ten minste één maand voor de overgangsdatum schriftelijk mededeling gedaan van de rechtspositionele gevolgen
      van een overgang in dienst van het orgaan.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel21
  - number: '21.2'
    text: |-
      De arbeidsovereenkomst geldt voor onbepaalde tijd. Indien een personeelslid was aangesteld in tijdelijke dienst
      voor bepaalde tijd of werkzaam was op arbeidsovereenkomst voor bepaalde tijd, geldt de arbeidsovereenkomst voor de
      niet verstreken tijd van de aanstelling voor bepaalde tijd dan wel van de arbeidsovereenkomst voor bepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel21
  - number: '21.3'
    text: |-
      De arbeidsovereenkomst betreft een functie die zoveel mogelijk overeenkomt met de functie die het personeelslid
      laatstelijk vervulde bij de Interimstichting Opvang Asielzoekers.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel21
  - number: '21.4'
    text: |-
      De arbeidsvoorwaarden zullen in het geheel beoordeeld niet ongunstiger zijn dan die welke voor het personeelslid
      golden uit hoofde van zijn dienstverband bij het Ministerie van Welzijn, Volksgezondheid en Cultuur. Onze Minister
      stelt nadere regels ter zake.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel21
  - number: '21.5'
    text: |-
      Door het tot stand komen van de arbeidsovereenkomst is het personeelslid van rechtswege eervol ontslagen uit de
      dienst van de staat.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel21
  - number: '21.6'
    text: |-
      In afwijking van het eerste lid komt op de overgangsdatum geen arbeidsovereenkomst tot stand met het personeelslid
      dat binnen een maand na de schriftelijke mededeling, bedoeld in het eerste lid, laatste volzin, aan Onze
      Minister heeft medegedeeld dat hij bezwaren heeft tegen de overgang in dienst bij het orgaan, tenzij hij voor de
      overgangsdatum de bezwaren heeft ingetrokken. Onze Minister stelt nadere regels met betrekking tot het onderzoek
      van de bezwaren. Onze Minister beslist op de bezwaren.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel21
  - number: '21.7'
    text: |-
      Indien Onze Minister voor de overgangsdatum de bezwaren ongegrond heeft verklaard, komt, tenzij het personeelslid
      binnen een week na de kennisgeving van deze beslissing aan Onze Minister kenbaar heeft gemaakt dit niet te
      willen, een arbeidsovereenkomst tot stand op de overgangsdatum dan wel, indien het einde van die week valt na de
      overgangsdatum, op de eerste dag van de volgende maand.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel21
  - number: '21.8'
    text: |-
      Indien Onze Minister voor de overgangsdatum de bezwaren geheel of gedeeltelijk gegrond heeft verklaard, kan
      hij daarbij beslissen dat het personeelslid niet overgaat in dienst bij het orgaan. Indien Onze Minister niet
      een zodanige beslissing heeft genomen, komt, tenzij het personeelslid binnen een week na de kennisgeving van de
      beslissing aan Onze Minister kenbaar heeft gemaakt dit niet te willen, een arbeidsovereenkomst tot stand op de
      overgangsdatum dan wel, indien het einde van de week valt na de overgangsdatum, op de eerste dag van de volgende
      maand. De inhoud van die arbeidsovereenkomst is in overeenstemming met de beslissing van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel21
  - number: '21.9'
    text: |-
      Indien het personeelslid op of na de overgangsdatum de bezwaren heeft ingetrokken, komt een arbeidsovereenkomst tot
      stand op de eerste dag van de daarop volgende maand.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel21
  - number: '21.10'
    text: |-
      Indien Onze Minister op of na de overgangsdatum de bezwaren ongegrond heeft verklaard, komt, tenzij het
      personeelslid binnen een week na de kennisgeving van de beslissing aan Onze Minister kenbaar heeft gemaakt dit niet
      te willen, een arbeidsovereenkomst tot stand op de eerste dag van de volgende maand.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel21
  - number: '21.11'
    text: |-
      Indien Onze Minister op of na de overgangsdatum de bezwaren geheel of gedeeltelijk gegrond heeft verklaard, kan
      hij beslissen dat het personeelslid niet overgaat in dienst bij het orgaan dan wel het orgaan verplichten het
      personeelslid een arbeidsovereenkomst aan te bieden, waarvan de inhoud in overeenstemming is met zijn beslissing.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel21
  - number: '22.1'
    text: |-
      Met ingang van de overgangsdatum verkrijgt een personeelslid met wie een arbeidsovereenkomst als bedoeld in
      [artikel 21, eerste lid][ref1], is gesloten, ter zake van de ouderdoms- en nabestaandenpensioenvoorziening
      aanspraken jegens een door het bestuur van het orgaan aan te wijzen instelling als bedoeld in
      [artikel 1, eerste lid, van de Pensioen- en spaarfondsenwet][ref2] die gelijkwaardig zijn aan die welke het
      personeelslid op de laatste dag van de kalendermaand voorafgaande aan de overgangsdatum heeft jegens het Algemeen
      burgerlijk pensioenfonds krachtens de Algemene burgerlijke pensioenwet en neemt de aangewezen instelling de daarmee
      verband houdende verplichtingen op zich.


      [ref1]: https://wetten.overheid.nl/BWBR0006685#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel1
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006685
        artikel: '21'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0002089
        artikel: '1'
  - number: '22.2'
    text: De in het eerste lid bedoelde instelling wordt door het bestuur van het orgaan op de overgangsdatum aangewezen.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel22
  - number: '22.3'
    text: |-
      De aanspraken die een personeelslid als bedoeld in het eerste lid toekomen krachtens de Algemene burgerlijke
      pensioenwet en de daaruit voortvloeiende verplichtingen van het Algemeen burgerlijk pensioenfonds jegens dit
      personeelslid vervallen op de overgangsdatum.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel22
  - number: '22.4'
    text: 'Het derde lid is niet van toepassing op aanspraken:'
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel22
  - number: 22.4.a
    text: die door een personeelslid voor de overgangsdatum geldend zijn gemaakt of geldend hadden kunnen worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel22
  - number: 22.4.b
    text: |-
      die betrekking hebben op het recht op invaliditeitspensioen en het recht op de aanvulling daarvan, bedoeld in
      [artikel F9 van de Algemene burgerlijke pensioenwet](onbekend), van een personeelslid dat op de dag voorafgaande
      aan de overgangsdatum blijkens een geneeskundig onderzoek als bedoeld in hoofdstuk P van de Algemene burgerlijke
      pensioenwet wegens ziekte of gebreken blijvend ongeschikt is zijn functie te vervullen, doch waarover nog geen
      beslissing van het bestuur van het Algemeen burgerlijk pensioenfonds is genomen.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel22
  - number: '22.5'
    text: |-
      Het eerste, derde en vierde lid zijn van overeenkomstige toepassing op het personeelslid dat op grond van
      [artikel 21, zevende tot en met elfde lid][ref1], na de overgangsdatum over gaat in dienst bij het orgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006685#Artikel21
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006685
        artikel: '21'
        paragraaf: '6'
  - number: '22.6'
    text: |-
      Het bestuur van het Algemeen burgerlijk pensioenfonds draagt aan de in het eerste lid bedoelde instelling een deel
      van het vermogen van het Algemeen burgerlijk pensioenfonds over. Een deel van de overdrachtssom wordt bepaald op
      grond van de aanspraken op ouderdomspensioen die krachtens de [Algemene burgerlijke pensioenwet](onbekend) ten
      behoeve van een personeelslid zijn opgebouwd tot en met de dag, voorafgaande aan de datum van indiensttreding
      bij het orgaan. In de totale overdrachtssom is een aan bedoelde aanspraken evenredig aandeel in de voorziening
      voor nabestaandenpensioenen en in de algemene reserve begrepen, een en ander volgens een door het Algemeen
      burgerlijk pensioenfonds op te stellen opgebouwde aanspraken-balans. Het over te dragen vermogen heeft eenzelfde
      rendementspotentieel als het bij het Algemeen burgerlijk pensioenfonds achterblijvende vermogen.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel22
  - number: '22.7'
    text: |-
      In afwijking van het zesde lid bedraagt het deel van de overdrachtssom dat betrekking heeft op een personeelslid
      dat vooraf gaande aan de datum van indiensttreding wegens ziekte of gebreken ongeschikt is verklaard voor
      een eerder door hem vervulde functie, een percentage van het overeenkomstig het zesde lid ten aanzien van dat
      personeelslid berekende bedrag dat gelijk is aan het percentage van zijn resterende arbeidsgeschiktheid.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel22
  - number: '22.8'
    text: |-
      Ter bepaling van de financiële gevolgen voor het Algemeen burgerlijk pensioenfonds van het vervallen van de
      verplichtingen jegens de uitgetreden personeelsleden krachtens het derde lid en van de waarde-overdracht krachtens
      het zesde lid maakt het Algemeen burgerlijk pensioenfonds een berekening van de waarde-overdracht indien deze
      gebaseerd zou zijn op de lasten-min-baten. Hiertoe wordt voor de datum van indiensttreding bij het orgaan een
      evenwichtige lasten- en batenbalans opgesteld voor de betrokken personeelsleden. Als basisbijdragepercentage
      wordt op deze balans het percentage aangehouden dat in de toekomst nodig is om de nog op te bouwen rechten van
      gerechtigden op pensioen ingevolge de [Algemene burgerlijke pensioenwet](onbekend) juist te dekken zonder rekening
      te houden met toekomstige inflatie. Als inhaalbijdrage wordt het percentage gebruikt dat nodig is om de lasten- en
      batenbalans van het fonds in evenwicht te brengen.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel22
  - number: '22.9'
    text: |-
      Het verschil tussen de waarde-overdracht krachtens het zesde lid en de lasten-min-batenuitkomst krachtens het
      achtste lid wordt verrekend tussen het Algemeen burgerlijk pensioenfonds en Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel22
  - number: '23'
    text: |-
      Ter zake van de vermogensoverdracht van het Algemeen burgerlijk pensioenfonds aan de instelling, bedoeld in
      [artikel 22, eerste lid][ref1], blijft heffing van overdrachtsbelasting achterwege.


      [ref1]: https://wetten.overheid.nl/BWBR0006685#Artikel22
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006685
        artikel: '22'
        paragraaf: '6'
  - number: '24.1'
    text: |-
      Alle zaken, rechten en verplichtingen van de Interimstichting Opvang Asielzoekers en van de Stichting Projecten
      Opvang Asielzoekers gaan bij de inwerkingtreding van deze wet over op het orgaan.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel24
  - number: '24.2'
    text: |-
      Hetzelfde geldt met betrekking tot de zaken en rechten onderscheidenlijk de verplichtingen die Onze Minister heeft
      verworven onderscheidenlijk is aangegaan ter vervulling van de taken, bedoeld in [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006685#Artikel3
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0006685
        artikel: '3'
        paragraaf: '2'
  - number: '24.3'
    text: |-
      [Artikel 23][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006685#Artikel23
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0006685
        artikel: '23'
        paragraaf: '6'
  - number: '25.1'
    text: |-
      Rechtsgedingen in burgerlijke zaken en in administratieve zaken die zijn ingesteld door of tegen de
      Interimstichting Opvang Asielzoekers of de Stichting Projecten Opvang Asielzoekers worden, met uitzondering van
      ambtenarenzaken, met ingang van inwerkingtreding van deze wet voortgezet door of tegen het orgaan.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel25
  - number: '25.2'
    text: |-
      Rechtsgedingen als bedoeld in het eerste lid, die zijn ingesteld door of tegen Onze Minister en die samenhangen
      met de vervulling van de taken, bedoeld in [artikel 3][ref1], worden met ingang van inwerkingtreding van deze wet
      voortgezet door of tegen het orgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006685#Artikel3
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0006685
        artikel: '3'
        paragraaf: '2'
  - number: '27'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel27
  - number: '28'
    text: 'Deze wet wordt aangehaald als: Wet Centraal Orgaan opvang asielzoekers.'
    url: https://wetten.overheid.nl/BWBR0006685/2001-04-01#Artikel28
