---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_centraal_orgaan_opvang_asielzoekers
regulatory_layer: WET
publication_date: '2024-06-27'
valid_from: '2020-01-01'
bwb_id: BWBR0006685
url: https://wetten.overheid.nl/BWBR0006685/2020-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de materiële en immateriële opvang van asielzoekers toe
    te vertrouwen aan een wettelijk ingesteld bestuursorgaan;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Veiligheid en Justitie;'
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel1
  - number: 1.b
    text: |-
      COA: het Centraal Orgaan opvang asielzoekers, bedoeld in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006685#Artikel2
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006685
        artikel: '2'
        paragraaf: '2'
  - number: 1.c
    text: |-
      Kaderwet: de [Kaderwet zelfstandige bestuursorganen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020495
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020495
  - number: 1.d
    text: |-
      opvangcentrum: opvangvoorziening, niet zijnde een woning, hotel of pension, waarin door het COA aan asielzoekers
      opvang wordt geboden.
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel1
  - number: '2.1'
    text: Er is een Centraal Orgaan opvang asielzoekers, dat rechtspersoonlijkheid bezit.
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel2
  - number: '2.2'
    text: Het COA heeft zijn zetel ter plaatse door Onze Minister te bepalen.
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel2
  - number: '2.3'
    text: |-
      De [Kaderwet][ref1] is van toepassing op het COA.


      [ref1]: https://wetten.overheid.nl/BWBR0020495
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020495
  - number: '3.1'
    text: 'Het COA is belast met:'
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel3
  - number: 3.1.a
    text: de materiële en immateriële opvang van asielzoekers;
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel3
  - number: 3.1.b
    text: het plaatsen van asielzoekers in een opvangvoorziening;
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel3
  - number: 3.1.c
    text: |-
      het plaatsen van asielzoekers op gemeentelijke opvangplaatsen, alsmede het betalen van bijdragen aan de
      desbetreffende gemeente ten behoeve van de kosten van deze opvang;
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel3
  - number: 3.1.d
    text: |-
      werkzaamheden met betrekking tot de bemiddeling bij de uitstroom van verblijfsgerechtigden als bedoeld in [artikel
      1, eerste lid, onderdeel g, van de Huisvestingswet 2014](onbekend) naar door burgemeester en wethouders beschikbaar
      gestelde huisvesting;
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel3
  - number: 3.1.e
    text: door Onze Minister aan het COA op te dragen andere taken die samenhangen met de opvang van asielzoekers.
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel3
  - number: '3.2'
    text: |-
      Onze minister kan het COA taken als bedoeld in het eerste lid opdragen met betrekking tot andere categorieën
      vreemdelingen.
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel3
  - number: '3.3'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld met betrekking tot verstrekkingen aan asielzoekers en
      andere categorieën vreemdelingen als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel3
  - number: '4'
    text: |-
      Bij de toepassing van [artikel 3, tweede en derde lid][ref1], doet Onze Minister, voor zover dat gevolgen heeft
      voor de uitoefening van openbaar gezag door het COA, daarvan mededeling aan beide Kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0006685#Artikel3
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006685
        artikel: '3'
        paragraaf: '2'
  - number: '5.1'
    text: |-
      In afwijking van [artikel 72, derde lid, van de Vreemdelingenwet 2000][ref1] zijn de [afdelingen 1][ref2],
      [3][ref3] en [4 van hoofdstuk 7 van de Vreemdelingenwet 2000][ref4] van toepassing op besluiten in het kader van
      het onthouden dan wel de beëindiging van verstrekkingen bij of krachtens deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Afdeling1
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Afdeling3
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Afdeling4
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '72'
      - id: ref2
        bwb_id: BWBR0011823
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0011823
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0011823
        afdeling: '4'
  - number: '5.2'
    text: |-
      In afwijking van [artikel 72, derde lid, van de Vreemdelingenwet 2000][ref1] worden handelingen van het COA ten
      aanzien van een vreemdeling als zodanig die worden verricht in het kader van de beëindiging van verstrekkingen bij
      of krachtens deze wet, voor de toepassing van deze wet met een beschikking gelijkgesteld. De [afdelingen 1][ref2],
      [3][ref3] en [4 van hoofdstuk 7 van de Vreemdelingenwet 2000][ref4] zijn op die beschikking van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Afdeling1
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Afdeling3
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Afdeling4
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '72'
      - id: ref2
        bwb_id: BWBR0011823
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0011823
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0011823
        afdeling: '4'
  - number: '5.3'
    text: |-
      In afwijking van het eerste en tweede lid is [artikel 82 van de Vreemdelingenwet 2000][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel82
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '82'
  - number: '6.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld ten aanzien van het verstrekken van subsidies
      door het COA aan gemeenten ten behoeve van kosten, verband houdende met de opvang van asielzoekers door het COA.
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel6
  - number: '6.2'
    text: |-
      In deze algemene maatregel van bestuur kunnen tevens regels worden gesteld over de wijze waarop gemeenten
      dergelijke subsidies kunnen aanvragen.
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel6
  - number: '7'
    text: Het COA heeft een bestuur.
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel7
  - number: '8.1'
    text: |-
      Het bestuur bestaat uit ten hoogste drie leden, waaronder de voorzitter. Het bestuur besluit bij meerderheid van
      stemmen. Bij het staken van stemmen geeft de stem van de voorzitter de doorslag.
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel8
  - number: '8.2'
    text: |-
      De leden van het bestuur worden benoemd voor vier jaren. De aftredende leden kunnen ten hoogste tweemaal worden
      herbenoemd.
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel8
  - number: '8.3'
    text: 'Het bestuur stelt een reglement vast, dat in ieder geval voorziet in:'
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel8
  - number: 8.3.a
    text: de vervanging van de voorzitter bij diens schorsing of ontstentenis;
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel8
  - number: 8.3.b
    text: delegatie en mandaat van bevoegdheden van het bestuur;
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel8
  - number: 8.3.c
    text: de wijze van besluitvorming van het bestuur.
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel8
  - number: '9.1'
    text: |-
      Het bestuur is belast met de dagelijkse leiding van het COA en draagt zorg voor een goede uitvoering van de taken,
      bedoeld in [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006685#Artikel3
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006685
        artikel: '3'
        paragraaf: '2'
  - number: '9.2'
    text: |-
      Een besluit van het bestuur om werkzaamheden, die de uitvoering van taken als bedoeld in [artikel 3][ref1]
      betreffen, door derden te laten uitvoeren, behoeft voor zover het door Onze Minister aangegeven werkzaamheden
      betreft zijn goedkeuring.


      [ref1]: https://wetten.overheid.nl/BWBR0006685#Artikel3
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006685
        artikel: '3'
        paragraaf: '2'
  - number: 9a.1
    text: |-
      Het bestuur stelt voor het personeel een meldcode vast waarin stapsgewijs wordt aangegeven hoe met signalen
      van huiselijk geweld of kindermishandeling wordt omgegaan en die er redelijkerwijs aan bijdraagt dat zo snel en
      adequaat mogelijk hulp kan worden geboden.
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel9a
  - number: 9a.2
    text: |-
      Onder huiselijk geweld wordt verstaan: huiselijk geweld als bedoeld in
      [artikel 1.1.1 van de Wet maatschappelijke ondersteuning 2015][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel1
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '1'
  - number: 9a.3
    text: |-
      Onder kindermishandeling wordt verstaan: kindermishandeling als bedoeld in [artikel 1.1 van de Jeugdwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
  - number: 9a.4
    text: Het bestuur bevordert de kennis en het gebruik van de meldcode.
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel9a
  - number: 9a.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt vastgesteld uit welke elementen een meldcode in ieder geval
      bestaat.
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel9a
  - number: '12'
    text: |-
      In afwijking van [artikel 2 van de Wet privatisering ABP][ref1] zijn de bij het COA werkzame personen geen
      overheidswerknemer in de zin van die wet. [Artikel 15 van de Kaderwet][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel15
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '15'
  - number: '13'
    text: Het COA wordt in en buiten rechte vertegenwoordigd door de voorzitter van het bestuur.
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel13
  - number: '14.1'
    text: |-
      Onze Minister en het bestuur verstrekken elkaar tijdig alle voor de uitoefening van hun taken benodigde
      inlichtingen.
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel14
  - number: '14.2'
    text: |-
      Onze Minister kan regels stellen met betrekking tot de verstrekking aan en door hem van inlichtingen als bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel14
  - number: '15.1'
    text: |-
      Het activiteitenverslag, bedoeld in [artikel 4:80 van de Algemene wet bestuursrecht][ref1], wordt opgenomen in het
      jaarverslag, bedoeld in [artikel 18 van de Kaderwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel18
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '18'
  - number: '15.2'
    text: Onze Minister kan regels stellen met betrekking tot de inrichting van het activiteitenverslag van het COA.
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel15
  - number: '16.1'
    text: |-
      Onze Minister verstrekt het COA een subsidie voor de uitvoering van de opgedragen taken ten laste van de begroting
      van het Ministerie van Veiligheid en Justitie.
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel16
  - number: '16.2'
    text: |-
      In afwijking van [artikel 4:21, derde lid, van de Algemene wet bestuursrecht][ref1] is
      [titel 4.2 van die wet][ref2] op de subsidie van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
  - number: '16.3'
    text: De subsidie wordt per boekjaar verstrekt.
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel16
  - number: '16.4'
    text: |-
      [Afdeling 4.2.8][ref1], met uitzondering van de [artikelen 4:71][ref2] en
      [4:72, eerste, tweede, vierde en vijfde lid, van de Algemene wet bestuursrecht][ref3] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.2.8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.2.8
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '17.1'
    text: |-
      Het activiteitenplan behoeft de instemming van Onze Minister. De
      [artikelen 10:28 tot en met 10:31 van de Algemene wet bestuursrecht][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: '17.2'
    text: |-
      Indien door bijzondere omstandigheden voor het COA kosten ontstaan die niet zijn voorzien bij de indiening van de
      begroting wordt ter zake van die kosten een aanvullend activiteitenplan en een aanvullende begroting ingediend. Ook
      het aanvullend activiteitenplan en de aanvullende begroting behoeven de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel17
  - number: '18.1'
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel18
  - number: 18.1.a
    text: |-
      de gegevens die Onze Minister met het oog op het opstellen van de begroting verstrekt aan het COA, alsmede op welk
      tijdstip deze gegevens uiterlijk worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel18
  - number: 18.1.b
    text: |-
      de termijn waarbinnen Onze Minister op het verzoek tot verlening onderscheidenlijk tot vaststelling van de subsidie
      beslist;
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel18
  - number: 18.1.c
    text: de wijze waarop de subsidie wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel18
  - number: 18.1.d
    text: |-
      de gevallen waarin het COA een vergoeding voor vermogensvorming als bedoeld in
      [artikel 4:41 van de Algemene wet bestuursrecht][ref1] verschuldigd is, alsmede hoe deze vergoeding wordt berekend;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 18.1.e
    text: de omvang en aanvulling van de egalisatiereserve en de aanwending van overschotten;
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel18
  - number: 18.1.f
    text: de overige aan de subsidie verbonden verplichtingen;
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel18
  - number: 18.1.g
    text: het verlenen van voorschotten.
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel18
  - number: '18.2'
    text: |-
      De voordracht voor een krachtens het eerste lid vastgestelde algemene maatregel van bestuur wordt niet gedaan dan
      nadat het ontwerp aan de beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel18
  - number: '19.1'
    text: |-
      Bij het onderzoek, bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1], onderzoekt de
      accountant tevens de naleving van de aan de subsidie verbonden verplichtingen. Onze Minister stelt een aanwijzing
      over de reikwijdte en de intensiteit van de controle vast.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '19.2'
    text: |-
      De accountant geeft binnen dertien weken na afloop van het boekjaar een schriftelijke verklaring af over de
      naleving van de aan de subsidie verbonden verplichtingen.
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel19
  - number: '19.3'
    text: |-
      Het bestuur werkt mee aan door Onze Minister in te stellen onderzoeken, die noodzakelijk zijn voor de uitvoering
      van de taak van het ministerie.
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel19
  - number: '20'
    text: Onze Minister kan regels stellen met betrekking tot de inrichting van het activiteitenplan en de begroting.
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel20
  - number: '21'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel21
  - number: '22'
    text: 'Deze wet wordt aangehaald als: Wet Centraal Orgaan opvang asielzoekers.'
    url: https://wetten.overheid.nl/BWBR0006685/2020-01-01#Artikel22
