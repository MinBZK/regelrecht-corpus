preamble:
  text: |-
    Gelet op artikel 3, eerste lid, aanhef onder a, en 5 van het Reglement zee- en kustvisserij 1977, (Stb. 666);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0003728/2006-02-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De aanvoerder van vis, degene die in de uitoefening van een beroep of bedrijf vis afneemt en hij die zijn
      bemiddeling verleent bij het veilen van vis zijn verplicht dagelijks een administratie bij te houden van de
      overdracht en de opslag van vis.

      2 Zij die hun bemiddeling verlenen bij het veilen van vis dienen zorg te dragen dat op of bij de op de veiling
      aanwezige vis, letterteken, nummer en nationaliteit van het vaartuig waarmee de vis is aangevoerd, is vermeld.

      3 Degene die vis op de veiling aanwezig heeft, is verplicht op of bij de op de veiling aanwezige vis het
      letterteken, nummer en nationaliteit van het vaartuig te vermelden waarmee deze vis is aangevoerd.

      4 Zij die hun bemiddeling verlenen bij het veilen van vis die afkomstig is van vissersvaartuigen die de visserij
      in span uitoefenen, dienen zorg te dragen dat op of bij de op de veiling aanwezige vis, lettertekens, nummers en
      nationaliteit van de vaartuigen waarmee de vis is aangevoerd, zijn vermeld.

      5 Degene die vis op de veiling aanwezig heeft die afkomstig is van vissersvaartuigen die de visserij in span hebben
      uitgeoefend, is verplicht op of bij de op de veiling aanwezige vis de lettertekens, nummers en nationaliteit van de
      vaartuigen te vermelden waarmee deze vis is aangevoerd.

      6 De verplichting als bedoeld in het eerste lid geldt niet voor zover in de uitoefening van een beroep of bedrijf,
      in een voor het publiek toegankelijke ruimte uitsluitend aan particulieren vis te kopen wordt aangeboden.
    url: https://wetten.overheid.nl/BWBR0003728/2006-02-01#Artikel1
  - number: 1a
    text: |-
      1 De koper van verse vis weegt alle door hem ontvangen hoeveelheden haring, makreel en horsmakreel die zijn
      gevangen in de gebieden, bedoeld in onderdeel 1.1.1 van bijlage III van [Verordening (EG) nr. 51/2006](32006R0051)
      van de Raad van de Europese Unie van 22 december 2005 tot vaststelling, voor 2006, van de vangstmogelijkheden
      voor sommige visbestanden en groepen visbestanden welke in de wateren van de Gemeenschap en, voor vaartuigen van
      de Gemeenschap, in andere wateren met vangstbeperkingen van toepassing zijn, en tot vaststelling van de bij de
      visserij in acht te nemen voorschriften (PbEU L 16), overeenkomstig onderdeel 1.6 van die bijlage.

      2 De koper of houder van bevroren haring, makreel of horsmakreel, die zijn gevangen in de in het eerste lid
      bedoelde gebieden, weegt de van die vissoorten aangevoerde hoeveelheden overeenkomstig onderdeel 1.8.1 van bijlage
      III van de in het eerste lid bedoelde verordening.

      3 In afwijking van het tweede lid kan het gewicht van verpakte bevroren haring, makreel of horsmakreel worden
      bepaald overeenkomstig onderdeel 1.8.2, van bijlage III van de in het eerste lid bedoelde verordening.

      4 Onder representatief monster als bedoeld in onderdeel 1.8.2, van bijlage III van de in het eerste lid bedoelde
      verordening wordt verstaan een overeenkomstig [bijlage 2][ref1] bij deze regeling genomen en gewogen monster.

      5 Het wegen van vis als bedoeld in het eerste en tweede lid wordt gedaan met apparatuur die ten genoegen van
      de Minister van Landbouw, Natuur en Voedselkwaliteit is goedgekeurd, gekalibreerd en verzegeld, als bedoeld in
      onderdeel 1.10.2 van bijlage III van de in het eerste lid bedoelde verordening.

      6 Degene die de weging uitvoert houdt een logboek bij als bedoeld in onderdeel 1.10.2 van bijlage III van de in het
      eerste lid bedoelde verordening, dat ten minste drie jaar wordt bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0003728
    url: https://wetten.overheid.nl/BWBR0003728/2006-02-01#Artikel1a
