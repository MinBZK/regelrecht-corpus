  - number: '3'
    text: |-
      1 Uit de administratie van degenen die in de uitoefening van een beroep of bedrijf vis afneemt moet blijken:

      a. de vissoort;

      b. per vissoort de hoeveelheid;

      c. de naam van de aanvoerders en de lettertekens, nummers en nationaliteit van de vaartuigen waarmee de vis is
      aangevoerd;

      d. de datum van de aanvoer van de vis;

      e. het vangstgebied van de vangst per deelgebied of sector als bedoeld in [bijlage 1][ref1] bij deze regeling.

      2 Het eerste lid is niet van toepassing voor zover in de uitoefening van een beroep of bedrijf, in een voor het
      publiek toegankelijke ruimte uitsluitend aan particulieren vis te koop wordt aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0003728
    url: https://wetten.overheid.nl/BWBR0003728/2006-02-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003728
  - number: '4'
    text: |-
      Uit de administratie van degene die zijn bemiddeling bij het veilen van vis verleent, moet blijken:

      a. de vissoort;

      b. per vissoort de hoeveelheid;

      c. de naam van de aanvoerders en de lettertekens, nummers en nationaliteit van de vaartuigen waarmee de vis is
      aangevoerd;

      d. de datum van de aanvoer van de vis;

      e. indien het vangstgebied door de aanvoerder bij het aanbieden van vis op de veiling is vermeld het vangstgebied
      van de vangst per deelgebied of sector als bedoeld in de [bijlage][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003728
    url: https://wetten.overheid.nl/BWBR0003728/2006-02-01#Artikel4
