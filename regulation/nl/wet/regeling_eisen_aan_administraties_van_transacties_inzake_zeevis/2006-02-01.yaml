  - number: '5'
    text: |-
      1 Alle desbetreffende aantekeningen en bescheiden, zoals nota's brieven en andere bewijsstukken, boeken, registers
      of andere hulpmiddelen waarin de gegevens als bedoeld in [artikel 2][ref1], [3][ref2] en [4][ref3] zijn
      vastgelegd, dienen vanaf het tijdstip van hun opstelling of verkrijging tot het tijdstip waarop drie kalenderjaren
      zijn verlopen te worden bewaard.

      2 Op eerste vordering van een bevoegde ambtenaar van de Algemene Inspectiedienst van het ministerie van Landbouw,
      Natuur en Voedselkwaliteit dienen de aantekeningen en bescheiden als bedoeld in het eerste lid te worden
      overgelegd.


