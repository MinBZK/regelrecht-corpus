        bwb_id: BWBR0003728
  - number: 4a
    text: |-
      1 Indien de op Nederlands grondgebied aangevoerde vis voor de eerste keer via bemiddeling van een visafslag op
      de markt wordt gebracht, is de betreffende visafslag verplicht binnen 48 uur na de verkoop een verkoopdocument
      te overhandigen aan een ambtenaar van de Algemene Inspectiedienst van het Ministerie van Landbouw, Natuur en
      Voedselkwaliteit of te deponeren in een opgavebus als bedoeld in de Beschikking plaatsing opgavebussen.

      2 Het is verboden de op Nederlands grondgebied aangevoerde vis, die voor de eerste keer anders dan via bemiddeling
      van een visafslag op de markt wordt gebracht, in ontvangst te nemen en te vervoeren voordat de koper, in het geval
      dat de vis is verkocht, of de houder in de overige gevallen, heeft overhandigd aan een ambtenaar van de Algemene
      Inspectiedienst van het Ministerie van Landbouw, Natuur en Voedselkwaliteit of heeft gedeponeerd in een opgavebus
      als bedoeld in de Beschikking plaatsing opgavebussen, hetzij:

      a. een verkoopdocument, wanneer de vis is verkocht op de plaats van aanlanding;

      b. een copie van de in [artikel 4b][ref1] genoemde documenten, wanneer de vis te koop wordt aangeboden op een
      andere plaats dan de plaats van aanlanding, alsmede na de verkoop een verkoopdocument, of

      c. een overnameverklaring als bedoeld in het vijfde lid, wanneer de vis niet te koop wordt aangeboden of bestemd is
      om later te koop te worden aangeboden.

      3 De in het tweede lid bedoelde documenten worden binnen 48 uur na het voor het eerst op de markt brengen of de
      aanlanding overhandigd aan een ambtenaar van de Algemene Inspectiedienst van het Ministerie van Landbouw, Natuur
      en Voedselkwaliteit of worden gedeponeerd in een opgavebus als bedoeld in de Beschikking plaatsing opgavebussen
      door hetzij:

      a. de koper, indien het verkoopdocumenten betreft;

      b. de houder, indien het een van andere in het tweede lid bedoelde documenten betreft.

      4 Het verkoopdocument bedoeld in het eerste en tweede lid moet de volgende gegevens bevatten:

      a. lettertekens nummer, nationaliteit en naam van het vaartuig waarmee de vis is aangevoerd;

      b. de naam van de reder of van de kapitein van het vaartuig waarmee de vis is aangevoerd;

      c. de haven en de datum van aanvoer;

      d. de naam van de verkoper en van de koper van de vis;

      e. de plaats en de datum van de verkoop;

      f. in voorkomende gevallen per vissoort de individuele maat of het individuele gewicht, de klasse, de
      aanbiedingsvorm en de versheid;

      g. per vissoort de prijs en de hoeveelheid en in voorkomende gevallen de aanbiedingsvorm en de versheid op basis
      van de individuele maat of het individuele gewicht;

      h. de toepasselijke naam van elke vissoort en het geografische gebied van oorsprong;

      i. in voorkomende gevallen, de toepasselijke minimumvismaat;

      j. in voorkomende gevallen, de verwijzing naar de referentienummers van een van de in
      [artikel 4b, onderdelen a en c][ref2], genoemde, van toepassing zijnde documenten;

      k. in voorkomende gevallen, het referentienummer van het koopcontract;

      l. de bestemming van uit de markt genomen produkten.

      5 De door de eigenaar van de aangevoerde vis of diens gemachtigde opgestelde overnameverklaring, bedoeld in het
      tweede lid, bevat ten minste de volgende gegevens:

      a. lettertekens, nummer, nationaliteit en naam van het vaartuig waarmee de vis is aangevoerd;

      b. de naam van de reder of van de kapitein van het vaartuig waarmee de vis is aangevoerd;

      c. de haven en de datum van aanvoer;

      d. in voorkomende gevallen, de verwijzing naar de referentienummers van een van de in
      [artikel 4b, onderdelen a en c][ref3], genoemde, van toepassing zijnde documenten;

      e. de toepasselijke naam van elke vissoort en het geografische gebied van oorsprong;

      f. voor elke vissoort, het gewicht, per aanbiedingsvorm;

      g. in voorkomende gevallen, de toepasselijke minimumvismaat;

      h. de plaatsen waar de vis is opgeslagen.

      6 Degene die bemiddeling verleent bij het veilen van vis bedoeld in het eerste lid en de koper bedoeld in het
      tweede lid zijn verplicht op het verkoopdocument de gegevens bedoeld in het derde lid volledig en naar waarheid
      te vermelden.

      7 Indien vis die overeenkomstig het eerste of tweede lid als verkocht is opgegeven, naar een andere plaats dan de
      plaats van aanlanding of van invoer worden vervoerd, is de vervoerder verplicht op elk moment, op verzoek van een
      met controle belaste ambtenaar, te bewijzen dat die vis daadwerkelijk is verkocht.

      8 Indien voor een bepaalde vissoort een minimumvismaat is vastgesteld op grond van artikel 4 van [verordening (EG)
      nr. 2371/2002](32002R2371) van de Raad van 20 december 2002 inzake de instandhouding en de duurzame exploitatie
      van de visbestanden in het kader van het gemeenschappelijk visserijbeleid (Pb EG L 358), is elke ondernemer
      die verantwoordelijk is voor de verkoop, de opslag of het vervoer van partijen vis van een ondermaatse vissoort
      verplicht op elk moment, op verzoek van een met controle belaste ambtenaar, het geografische oorspronggebied of de
      herkomst uit aquacultuur te bewijzen.

      9 De visafslag, respectievelijk de koper of houder, is in het geval, bedoeld in het eerste lid, respectievelijk het
      tweede lid, en voor zover het vis betreft als bedoeld in [artikel 1a][ref4], verplicht een document als bedoeld in
      onderdeel 1.9.1 van bijlage III van de in [artikel 1a, eerste lid][ref5], genoemde verordening, binnen 48 uur na
      weging van de vis te overleggen aan een ambtenaar als bedoeld in het eerste lid.


