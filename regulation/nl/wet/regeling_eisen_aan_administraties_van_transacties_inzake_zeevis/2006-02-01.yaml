  - number: 6a
    text: |-
      Degene die zijn bemiddeling bij het veilen van vis verleent, stelt ten genoege van de minister ten behoeve van de
      Algemene Inspectiedienst van het ministerie van Landbouw, Natuur en Voedselkwaliteit de volgende voorzieningen ter
      beschikking; twee afsluitbare ruimtes in het gebouw waar het veilen van vis plaatsvindt, waarin een afsluitbare
      kast, bureaus, stoelen, telefoon en elektrische aansluitingen aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0003728/2006-02-01#Artikel6a
  - number: '7'
    text: 'Deze regeling kan worden aangehaald als: Regeling eisen aan administraties van transacties inzake zeevis.'
    url: https://wetten.overheid.nl/BWBR0003728/2006-02-01#Artikel7
