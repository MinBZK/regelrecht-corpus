  - number: 4b
    text: |-
      Alle niet verwerkte of aan boord verwerkte vis die op Nederlands grondgebied wordt aan- of ingevoerd en die
      naar een andere plaats dan de plaats van aan- of invoer wordt vervoerd, moet totdat de eerste verkoop heeft
      plaatsgevonden, worden vergezeld door hetzij:

      a. een door de vervoerder opgesteld vervoersdocument dat de volgende gegevens bevat:

      1. lettertekens, nummer, nationaliteit en naam van het vaartuig waarmee de vis is aangevoerd;

      2. de plaats van bestemming van de vis;

      3. kenteken van het vervoermiddel waarmee de vis wordt vervoerd;

      4. per vissoort die wordt vervoerd, de hoeveelheid in kilogrammen verwerkt gewicht;

      5. de toepasselijke naam van elke vissoort en het geografische gebied van oorsprong;

      6. in voorkomende gevallen, de toepasselijke minimumvismaat;

      7. ingeval de invoer niet met een vissersvaartuig is geschied, de plaats waar de vis werd ingevoerd;

      8. de naam van de ontvanger van de vis;

      9. de plaats en de datum van lading;

      b. een copie van het volledig en naar waarheid ingevulde logboek-, tevens vangstopgaveformulier bedoeld in
      [artikel 2 van de Regeling logboek en opgave zeevis 1987][ref1] of

      c. een copie van het volledig en naar waarheid ingevulde document T 2 M bedoeld in artikel 1 van [verordening (EEG)
      nr. 137/79](31979R0137) van de Commissie van de Europese Gemeenschappen van 19 december 1978 houdende vaststelling
      van een bijzondere methode van administratieve samenwerking met het oog op de toepassing van het intracommunautaire
      stelsel ten aanzien van door vaartuigen van de lid-staten gevangen visserijprodukten (PbEG L 20) waarin de
      oorsprong van de hoeveelheden vervoerde vis is vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004217#Artikel2
    url: https://wetten.overheid.nl/BWBR0003728/2006-02-01#Artikel4b
