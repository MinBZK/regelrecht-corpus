        artikel: '2'
  - number: 4c
    text: |-
      Indien vis, die in een andere lidstaat van de Europese Unie dan Nederland wordt aangeland, voor het eerst op de
      markt wordt gebracht op Nederlands grondgebied, overhandigt de vervoerder van de vis binnen 48 uur na het tijdstip
      van aanlanding een copie van het vervoersdocument aan een ambtenaar van de Algemene Inspectiedienst van het
      Ministerie van Landbouw, Natuur en Voedselkwaliteit of deponeert de vervoerder deze in een opgavebus als bedoeld in
      de Beschikking plaatsing opgavebussen.
    url: https://wetten.overheid.nl/BWBR0003728/2006-02-01#Artikel4c
  - number: 4d
    text: |-
      In afwijking van [artikel 4b][ref1] wordt elke hoeveelheid kabeljauw die is gevangen in de gebieden, bedoeld in
      artikel 2 van [Verordening (EG) nr. 423/2004](32004R0423) van de Raad van 26 februari 2004 tot vaststelling van
      herstelmaatregelen voor bepaalde kabeljauwbestanden (PbEU L 70), en elke hoeveelheid van meer dan 50 kg heek die
      is gevangen in de gebieden, bedoeld in artikel 1 van [Verordening (EG) nr. 811/2004](32004R0811) van de Raad van
      21 april 2004 tot vaststelling van herstelmaatregelen voor het noordelijke heekbestand (PbEU L 150), die wordt
      vervoerd naar een andere plaats dan de plaats van aanlanding of invoer, vergezeld door de documenten, genoemd in
      [artikel 4a, tweede lid, onderdeel a][ref2], en [artikel 4b, onderdeel a][ref3].


