  - number: XII
    text: >-
      Onze Minister van Sociale Zaken en Werkgelegenheid zendt binnen vijf jaar na de inwerkingtreding van deze wet aan
      de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0016985/2005-01-01#ArtikelXII
  - number: XIII
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip,
      dat voor verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld, met
      dien verstande dat [artikel I, onderdeel L][ref1], met betrekking tot de [artikelen 76][ref2] en
      [77 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref3] terugwerkt tot en met 1 januari 2004. In het
      koninklijk besluit wordt zo nodig toepassing gegeven aan [artikel 16 van de Tijdelijke referendumwet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0016985#ArtikelI
