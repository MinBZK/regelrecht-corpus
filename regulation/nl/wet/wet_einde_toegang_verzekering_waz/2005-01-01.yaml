preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het wenselijk is de toegang tot de verzekering op grond van de Wet
    arbeidsongeschiktheidsverzekering zelfstandigen te beëindigen;


    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0016985/2005-01-01#ArtikelAanhef
articles:
  - number: XI
    text: |-
      Alle vermogenbestanddelen die door het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], afzonderlijk worden
      beheerd en geadministreerd in de vorm van het Arbeidsongeschiktheidsfonds zelfstandigen, bedoeld in artikel
      78 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen, zoals dat luidde voor de inwerkingtreding
      van [artikel I, onderdeel L][ref2], van deze wet, gaan over op het Arbeidsongeschiktheidsfonds, bedoeld in
      [artikel 72 van de Wet op de arbeidsongeschiktheidsverzekering][ref3], overeenkomstig door Onze Minister te stellen
      regels.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0016985#ArtikelI
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel72
    url: https://wetten.overheid.nl/BWBR0016985/2005-01-01#ArtikelXI
