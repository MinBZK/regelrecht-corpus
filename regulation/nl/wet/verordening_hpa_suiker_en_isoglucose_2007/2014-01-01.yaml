preamble:
  text: |-
    Gelet op artikel 23 van de Landbouwwet, artikel 2 van de Regeling medebewind Gemeenschappelijk Landbouwbeleid
    en de artikelen 96, 97 en 98 van de Wet op de bedrijfsorganisatie, in aanmerking nemende Verordeningen (EEG) nr.
    318/2006, houdende een gemeenschappelijke ordening der markten in de sector suiker, Verordening (EEG) nr. 320/2006,
    houdende een tijdelijke regeling voor de herstructurering van de suikerindustrie in de Europese Gemeenschap
    en tot de wijziging van Verordening (EG) nr. 1290/2005 betreffende de financiering van het gemeenschappelijk
    landbouwbeleid van de Raad van 20 februari 2006 en de daarbij behorende uitvoeringsverordening van de Raad van de
    EU en de Commissie (Pb EG L 58).

    Gehoord de Suikerbegeleidingscommissie;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0022087/2014-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze verordening verstaat onder:







                  a.


                  hoofdproductschap:


                  Hoofdproductschap Akkerbouw;




                  b.


                  minister:


                  Minister van Landbouw, Natuur en Voedselkwaliteit;




                  c.


                  raadsverordeningen:


                  [Verordening (EEG) nr. 318/2006](32006R0318) of [Verordening (EEG)nr. 320/2006](32006R0320) van de Raad
      van 20 februari 2006;




                  d.


                  uitvoeringsverordeningen:


                  verordening van de Raad van de EU of van de Commissie van de EG ter uitvoering van de raadsverordening.




         Overigens wordt de terminologie van de EG-verordeningen overgenomen.
    url: https://wetten.overheid.nl/BWBR0022087/2014-01-01#Artikel1
  - number: '2'
    text: |-
      Het hoofdproductschap verleent op verzoek een erkenning aan producenten van suiker en isoglucose en aan de
      verwerkers van deze producten tot de in de raadsverordening bedoelde producten. De erkende ondernemingen
      verstrekken maandelijks van de voorgaande maand aan het hoofdproductschap de in de raadsverordening gevraagde
      gegevens. Het hoofdproductschap kan aanvullende gegevens verlangen.
    url: https://wetten.overheid.nl/BWBR0022087/2014-01-01#Artikel2
  - number: '3'
    text: |-
      Erkende suikerondernemingen die over een productiequotum beschikken en erkende ondernemingen die industriële
      suiker verwerken geven, overeenkomstig de uitvoeringsbepalingen, maandelijks met ingang van het tweede kwartaal
      van 2008 het hoofdproductschap gegevens door over het door hun gehanteerde prijsniveau. Voor gegevens betreffende
      het seizoen 2006/2007 en het eerste en tweede kwartaal van het seizoen 2007/2008 worden deze rechtstreeks door de
      ondernemingen en erkende ondernemingen of via een intermediair gemeld aan de commissie.
    url: https://wetten.overheid.nl/BWBR0022087/2014-01-01#Artikel3
  - number: '4'
    text: |-
      Voor 14 april van elk jaar deelt elke door het hoofdproductschap erkende suikerfabrikant de hoeveelheid suiker
      mee die hij boven zijn productiequotum heeft geproduceerd in het lopende verkoopseizoen. Voor elk verkoopseizoen
      is de fabrikant aan het hoofdproductschap een overschotheffing verschuldigd, te bepalen over de geproduceerde
      hoeveelheden bedoeld in de raadsverordening.
    url: https://wetten.overheid.nl/BWBR0022087/2014-01-01#Artikel4
  - number: '5'
    text: |-
      Het hoofdproductschap vordert een productieheffing in over het quotum, voor het betrokken verkoopseizoen
      overeenkomstig de raadsverordening bij de producent die een suiker of isoglucose quotum beschikt.
    url: https://wetten.overheid.nl/BWBR0022087/2014-01-01#Artikel5
  - number: '6'
    text: |-
      Het hoofdproductschap vordert een herstructureringsheffing in over het quotum, voor het betrokken verkoopseizoen
      overeenkomstig de raadsverordening bij de producent die over een suiker of isoglucose quotum beschikt.
    url: https://wetten.overheid.nl/BWBR0022087/2014-01-01#Artikel6
  - number: '7.1'
    text: |-
      Het hoofdproductschap vordert bij de producent een heffing van € 730 per ton in over het extra quotum, dat voor het
      betrokken verkoopseizoen overeenkomstig de raadsverordening wordt toegekend.
    url: https://wetten.overheid.nl/BWBR0022087/2014-01-01#Artikel7
  - number: '7.2'
    text: |-
      Voor het seizoen 2006/2007 moet deze heffing vóór 31 juli 2007 worden betaald, voor het seizoen 2007/2008 moet deze
      heffing vóór 28 februari 2008 worden betaald.
    url: https://wetten.overheid.nl/BWBR0022087/2014-01-01#Artikel7
  - number: '8'
    text: |-
      [Verordening HPA suiker, isoglucose en inulinestroop 1999][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0010526
    url: https://wetten.overheid.nl/BWBR0022087/2014-01-01#Artikel8
