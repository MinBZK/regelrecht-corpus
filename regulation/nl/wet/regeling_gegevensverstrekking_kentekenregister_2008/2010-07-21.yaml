  - number: '2'
    text: |-
      1 Als categorieën van beroepsbeoefenaren als bedoeld in
      [artikel 9, eerste lid, onderdeel a, van het Kentekenreglement][ref1] aan welke gevoelige gegevens uit het
      kentekenregister kunnen worden verstrekt, met uitzondering van gegevens omtrent de aangifte van diefstal of
      verduistering van een voertuig, worden aangewezen:

      a. verzekeringsmaatschappijen waaraan een vergunning als bedoeld in
      [artikel 2:27 van de Wet op het financieel toezicht][ref2] is verleend en door hen aangewezen gevolmachtigden
      waaraan een vergunning als bedoeld in [artikel 2:92 van diezelfde wet][ref3] is verleend, voor zover het hun
      bedrijfsuitoefening ten aanzien van de verzekeringen van motorrijtuigen en aanhangwagens betreft,

      b. advocatuur,

      c. gerechtsdeurwaarders, en

      d. producenten of importeurs van motorrijtuigen of aanhangwagens of van onderdelen en uitrustingstukken van deze
      motorrijtuigen en aanhangwagens met een ‘e-’, ‘E-’ of ‘NL-’goedkeurmerk.

      2 De verstrekking van de in het eerste lid bedoelde gegevens geschiedt, onverminderd het derde lid, slechts voor de
      volgende doeleinden:

      a. wat betreft verzekeringsmaatschappijen en de door hen aangewezen gevolmachtigden: ten behoeve van schade-
      afwikkeling,

      b. wat betreft de advocatuur: ten behoeve van eigendomsgeschillen omtrent motorrijtuigen of aanhangwagens alsmede
      gerechtelijke procedures en de voorbereiding daarvan,

      c. wat betreft gerechtsdeurwaarders: ten behoeve van de voorbereiding van dagvaardingen in civielrechtelijke
      procedures waarbij motorrijtuigen zijn betrokken en waarin sprake is van wegrijden zonder te betalen na het tanken
      van motorbrandstof, zulks overeenkomstig een door of namens de tankstationbranche vast te stellen en door de
      Minister van Verkeer en Waterstaat goed te keuren protocol,

      d. wat betreft producenten en importeurs van motorrijtuigen: ten behoeve van de uitvoering van de
      [Wet op de belasting van personenauto’s en motorrijwielen 1992][ref4], en

      e. wat betreft fabrikanten en importeurs van in Nederland geregistreerde motorrijtuigen of aanhangwagens of van
      onderdelen en uitrustingstukken van deze motorrijtuigen en aanhangwagens met een ‘e-’, ‘E-’ of ‘NL-’goedkeurmerk:
      ten behoeve van het terugroepen van motorrijtuigen of aanhangwagens ingeval zich, naar het oordeel van deze
      partijen en de Dienst Wegverkeer, een gevaar voor de gezondheid van de mens of de veiligheid van de mens of
      zaken voordoet of voor kan doen en met de uitvoering van een terugroepactie niet gewacht kan worden tot regulier
      onderhoud.

      3 Aan de beroepsbeoefenaren bedoeld in het eerste lid, onderdeel a, kunnen de gegevens opgenomen in
      [bijlage I][ref5] bij deze regeling worden verstrekt ten behoeve van de totstandkoming en instandhouding van de
      verzekeringen ten aanzien van motorrijtuigen en aanhangwagens.


