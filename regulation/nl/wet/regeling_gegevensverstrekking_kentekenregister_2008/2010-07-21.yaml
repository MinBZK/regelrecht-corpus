  - number: 3a
    text: |-
      1 Aan iedere belanghebbende kan het gegeven worden verstrekt dat een kentekenbewijs door de Dienst Wegverkeer
      ongeldig is verklaard op grond van [artikel 37, derde lid, onderdeel f, van het Kentekenreglement][ref1].

      2 Verstrekking vindt plaats na opgave van een kenteken.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel37
    url: https://wetten.overheid.nl/BWBR0024045/2010-07-21#Artikel3a
