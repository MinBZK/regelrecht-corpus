  text: |-
    Gelet op artikel 41a, tweede lid, en 45a, derde lid, van de Wegenverkeerswet en de artikelen 9, tweede en derde
    lid, 14, eerste lid, en 16a, eerste lid, van het Kentekenreglement;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0024045/2010-07-21#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De volgende instanties worden aangewezen als overheidsorgaan als bedoeld in
      [artikel 41a, tweede lid, van de wet][ref1], voor zover zij niet reeds bestuursorganen zijn in de zin van
      [artikel 1:1, eerste lid, onderdeel a, van de Algemene wet bestuursrecht][ref2]:

      a. de uitvoeringsinstanties die belast zijn met het toekennen, uitbetalen en terugvorderen van uitkeringen op grond
      van sociale wetgeving, ten behoeve van het toetsen van het vermogen van aanvragers van dergelijke uitkeringen;

      b. curatoren, ten behoeve van het beheer en de vereffening van een failliete boedel als bedoeld in
      [artikel 68, eerste lid, van de Faillissementswet][ref3];

      c. bewindvoerders, bedoeld in [artikel 287, derde lid, van de Faillissementswet][ref4], voor zover zij in het kader
      van een schuldsanering gevoelige gegevens uit het kentekenregister nodig hebben ter vaststelling van het vermogen
      van een onder bewindgestelde natuurlijke persoon;

      d. Auto Recycling Nederland BV, ten behoeve van de uitvoering van de verplichtingen die voortvloeien uit het
      [Besluit beheer autowrakken][ref5];

      e. de Stichting Waarborgfonds Motorverkeer, bedoeld in
      [artikel 23, eerste lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref6], ten behoeve van de
      schadeafwikkeling en het verhaal van uitgekeerde schadevergoedingen bedoeld in de [artikelen 25][ref7] en
      [27 van die wet][ref8];

      f. de Stichting Nationale en Internationale Wegvervoer Organisatie, bedoeld in
      [artikel 1, eerste lid, onderdeel b, van de Wet goederenvervoer over de weg][ref9], ten behoeve van het verlenen
      van vergunningen voor binnenlands en internationaal beroepsgoederenvervoer over de weg alsmede voor controle op het
      juiste type vergunning;

      g. het Nederlands Bureau der Motorrijtuigverzekeraars, dat is aangewezen als Informatiecentrum als bedoeld
      in [artikel 27b, eerste lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref10], ten behoeve van
      de schadeafwikkeling en het verhaal van uitgekeerde schadevergoedingen als gevolg van schade veroorzaakt door
      motorrijtuigen die gewoonlijk zijn gestald en verzekerd in een andere lidstaat van de Europese Unie;

      h. onderzoeks- en onderwijsinstellingen, ten behoeve van wetenschappelijk onderzoek voor zover zij aantonen dat dit
      onderzoek namens of in opdracht van een overheidsinstantie wordt uitgevoerd.


