  - number: '3'
    text: |-
      Aan de door de Minister van Verkeer en Waterstaat aangewezen informatieproviders als bedoeld in
      [artikel 9, eerste lid, onderdeel b, van het Kentekenreglement][ref1] kunnen de volgende gevoelige gegevens worden
      verstrekt:

      a. de gegevens opgenomen in [bijlage II][ref2] bij deze regeling ten behoeve van statistische doeleinden;

      b. de gegevens opgenomen in [bijlage III][ref3] bij deze regeling ten behoeve van de in de desbetreffende
      aanwijzingsbeschikking opgenomen voertuiginformatiesystemen ten behoeve van de voertuigbranche, bedoeld in
      [artikel 14, eerste lid, onderdeel b, van het Kentekenreglement][ref4];

      c. de gegevens opgenomen in [bijlage III][ref5] bij deze regeling ten behoeve van informatiesystemen voor de
      totstandkoming en instandhouding van de verzekeringen ten aanzien van motorrijtuigen en aanhangwagens voor de
      verzekeraars of de door hen aangewezen gevolmachtigden bedoeld in [artikel 2, eerste lid, onderdeel a][ref6].


