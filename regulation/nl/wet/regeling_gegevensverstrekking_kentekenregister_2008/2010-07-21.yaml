        artikel: '37'
  - number: '4'
    text: |-
      1 Voor belanghebbenden als bedoeld in [artikel 9, eerste lid, onderdelen a en b, van het Kentekenreglement][ref1]
      gelden de volgende regels omtrent het gebruik en voorwaarden voor verstrekking van de uit het kentekenregister
      verstrekte gevoelige gegevens:

      a. de ontvanger treft maatregelen die waarborgen dat de gegevens uitsluitend worden gebruikt voor het doel waarvoor
      zij zijn verstrekt;

      b. de ontvanger treft maatregelen die waarborgen dat:

      1°. de ontvangen gegevens alleen toegankelijk zijn voor medewerkers voor wie toegang tot deze gegevens op basis
      van hun functie en takenpakket noodzakelijk is en die hiertoe expliciet door de hoogst verantwoordelijke binnen de
      organisatie zijn geautoriseerd;

      2°. verleende autorisaties tijdig worden aangepast bij functiewijziging of vertrek van gebruikers;

      3°. de verleende bevoegdheden alsmede alle mutaties hierop periodiek worden geëvalueerd;

      c. het benaderen van de gegevens wordt zodanig geregistreerd, dat mogelijk misbruik tijdig wordt gesignaleerd en
      stopgezet;

      d. indien de gegevens niet langer noodzakelijk zijn voor het doel waarvoor zij zijn verstrekt, worden de gegevens
      en alle kopieën daarvan terstond vernietigd;

      e. bij uitbesteding van de verwerking of delen van de verwerking aan derden blijft de ontvanger onverkort
      verantwoordelijk voor de juiste verwerking van de gegevens;

      f. de ontvanger voldoet aan de ter uitwerking van de in dit lid gestelde regels en voorwaarden met het oog op de
      beveiliging van gegevens door de Dienst Wegverkeer nader te stellen eisen.

      2 Voor de informatieproviders bedoeld in [artikel 9, eerste lid, onderdeel b, van het Kentekenreglement][ref2]
      gelden in aanvulling op het eerste lid tevens de volgende voorwaarden:

      a. binnen het autorisatiebeheer van de infomatieprovider zijn de beschikkende en controlerende bevoegdheden
      gescheiden van de uitvoerende bevoegdheden;

      b. redenen van ongeldigheid van een kentekenbewijs worden door de informatieprovider niet aan derden verstrekt,
      maar slechts het feit dat er sprake is van ongeldigheid van het kentekenbewijs. Dit geldt echter niet voor de
      volgende redenen:

      1°. het voertuig is gesloopt of geëxporteerd;

      2°. het voertuig voldoet niet aan technische eisen (wachten-op-keuring);

      3°. het voertuig voldoet mogelijk niet aan technische eisen (wachten-op-inspectie);

      c. in afwijking van het bepaalde in onderdeel b, mogen gegevens omtrent de aangifte van diefstal of verduistering
      van een voertuig door de informatieprovider aan derden worden verstrekt voor zover dit is toegestaan op grond van
      een door de Minister van Verkeer en Waterstaat en de Minister van Justitie gezamenlijk afgegeven beschikking als
      bedoeld in [artikel 9, eerste lid, onderdeel b, van het Kentekenreglement][ref3];

      d. ten aanzien van het gebruik van het Kamer van Koophandelnummer ten behoeve van de voertuiginformatiesystemen,
      bedoeld in [artikel 14, eerste lid, onderdeel b, van het Kentekenreglement][ref4], geldt dat:

      1°. dit gegeven alleen verwerkt mag worden voor voertuiginformatiesystemen die worden bijgehouden in opdracht van
      het erkende bedrijf wiens Kamer van Koophandelnummer het betreft,

      2°. het Kamer van Koophandelnummer van een erkende bedrijf dat geen rechtspersoonlijkheid bezit, alleen mag worden
      verwerkt, indien het desbetreffende erkende bedrijf expliciet toestemming voor de verwerking van zijn Kamer van
      Koophandelnummer heeft gegeven, en

      3°. de informatieprovider van deze expliciete toestemming een registratie dient bij te houden;

      e. indien de gegevens ‘numeriek deel postcode’, ‘geboortejaar’, ‘geslacht’ ook van andere bronnen worden
      verkregen en deze gegevens uit andere bronnen voor andere doelen worden gebruikt dan waarvoor de gegevens uit
      het kentekenregister zijn verstrekt, dient de informatieprovider maatregelen te nemen waardoor te allen tijde
      aangetoond kan worden uit welke bron deze voor andere doelen gebruikte gegevens zijn verkregen;

      f. het voertuigidentificatienummer, de meldcode en de duplicaatcode van het kentekenbewijs worden door de
      informatieproviders uitsluitend gebruikt als controlegegeven en worden niet aan derden verstrekt.

      3 De Dienst Wegverkeer kan van ontvangers van gevoelige gegevens verstrekking verlangen van een door deze dienst
      te bepalen verklaring afgegeven door een onafhankelijke derde waaruit blijkt dat de ontvanger heeft gehandeld in
      overeenstemming met de doeleinden waarvoor en de voorwaarden waaronder de gevoelige gegevens zijn verstrekt.

      4 De Dienst Wegverkeer kan bepalen dat de in het derde lid bedoelde verklaring betrekking dient te hebben op een
      door deze dienst te bepalen tijdsperiode. Deze tijdsperiode bedraagt maximaal drie jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel9
