  - number: 1.f
    text: |-
      het Nederlands Bureau der Motorrijtuigverzekeraars, dat is aangewezen als Informatiecentrum als bedoeld in
      [artikel 27b, eerste lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref1], ten behoeve van de
      schadeafwikkeling en het verhaal van uitgekeerde schadevergoedingen als gevolg van schade veroorzaakt door
      motorrijtuigen die gewoonlijk zijn gestald en verzekerd in een andere lidstaat van de Europese Unie.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel27b
    url: https://wetten.overheid.nl/BWBR0024045/2026-01-01#Artikel1
    references:
      - id: ref1
