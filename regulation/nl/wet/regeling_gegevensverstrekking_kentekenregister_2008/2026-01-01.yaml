    text: |-
      de uitvoeringsinstanties die belast zijn met het toekennen, uitbetalen en terugvorderen van uitkeringen op grond
      van sociale wetgeving, ten behoeve van het toetsen van het vermogen van aanvragers van dergelijke uitkeringen;
    url: https://wetten.overheid.nl/BWBR0024045/2026-01-01#Artikel1
  - number: 1.b
    text: |-
      curatoren, ten behoeve van het beheer en de vereffening van een failliete boedel als bedoeld in
      [artikel 68, eerste lid, van de Faillissementswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel68
    url: https://wetten.overheid.nl/BWBR0024045/2026-01-01#Artikel1
    references:
