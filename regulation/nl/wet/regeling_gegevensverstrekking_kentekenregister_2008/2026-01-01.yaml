        artikel: '68'
  - number: 1.c
    text: |-
      bewindvoerders, bedoeld in [artikel 287, derde lid, van de Faillissementswet][ref1], voor zover zij in het kader
      van een schuldsanering gevoelige gegevens uit het kentekenregister nodig hebben ter vaststelling van het vermogen
      van een onder bewindgestelde natuurlijke persoon;


