    text: |-
      de Stichting Waarborgfonds Motorverkeer, bedoeld in
      [artikel 23, eerste lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref1], ten behoeve van
      de schadeafwikkeling en het verhaal van uitgekeerde schadevergoedingen bedoeld in de [artikelen 25][ref2],
      [26a tot en met 26c][ref3], en [27 van die wet][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0002415#Artikel25
