        artikel: '287'
  - number: 1.d
    text: |-
      Auto Recycling Nederland BV, ten behoeve van de uitvoering van de verplichtingen die voortvloeien uit het
      [Besluit beheer autowrakken][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013707
    url: https://wetten.overheid.nl/BWBR0024045/2026-01-01#Artikel1
    references:
      - id: ref1
