        artikel: 27b
  - number: '2.1'
    text: |-
      Als categorieën van beroepsbeoefenaren als bedoeld in
      [artikel 9, eerste lid, onderdeel a, van het Kentekenreglement][ref1] aan welke gevoelige gegevens uit het
      kentekenregister kunnen worden verstrekt, met uitzondering van gegevens omtrent de aangifte van diefstal of
      verduistering van een voertuig, worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel9
    url: https://wetten.overheid.nl/BWBR0024045/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '9'
  - number: 2.1.a
    text: |-
      verzekeringsmaatschappijen waaraan een vergunning als bedoeld in
      [artikel 2:27 van de Wet op het financieel toezicht][ref1] is verleend en door hen aangewezen gevolmachtigden
      waaraan een vergunning als bedoeld in [artikel 2:92 van diezelfde wet][ref2] is verleend, voor zover het hun
      bedrijfsuitoefening ten aanzien van de verzekeringen van motorrijtuigen en aanhangwagens betreft,


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0024045/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 2.1.b
    text: advocatuur,
    url: https://wetten.overheid.nl/BWBR0024045/2026-01-01#Artikel2
  - number: 2.1.c
    text: gerechtsdeurwaarders,
    url: https://wetten.overheid.nl/BWBR0024045/2026-01-01#Artikel2
  - number: 2.1.d
    text: |-
      producenten of importeurs van motorrijtuigen of aanhangwagens of van onderdelen en uitrustingstukken van deze
      motorrijtuigen en aanhangwagens met een ‘e-’, ‘E-’ of ‘NL-’goedkeurmerk, en
    url: https://wetten.overheid.nl/BWBR0024045/2026-01-01#Artikel2
  - number: 2.1.e
    text: |-
      een bedrijf waaraan een erkenning voorbehoud en verplichtingen is verleend als bedoeld in
      [artikel 17 van het Besluit erkenningen wegverkeer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0051671#Artikel17
    url: https://wetten.overheid.nl/BWBR0024045/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0051671
        artikel: '17'
  - number: '2.2'
    text: |-
      De verstrekking van de in het eerste lid bedoelde gegevens geschiedt, onverminderd het derde en vierde lid, slechts
      voor de volgende doeleinden:
    url: https://wetten.overheid.nl/BWBR0024045/2026-01-01#Artikel2
  - number: 2.2.a
    text: |-
      wat betreft verzekeringsmaatschappijen en de door hen aangewezen gevolmachtigden: ten behoeve van schade-
      afwikkeling,
    url: https://wetten.overheid.nl/BWBR0024045/2026-01-01#Artikel2
  - number: 2.2.b
    text: |-
      wat betreft de advocatuur: ten behoeve van eigendomsgeschillen omtrent motorrijtuigen of aanhangwagens alsmede
      gerechtelijke procedures en de voorbereiding daarvan,
    url: https://wetten.overheid.nl/BWBR0024045/2026-01-01#Artikel2
  - number: 2.2.c
    text: |-
      wat betreft gerechtsdeurwaarders: ten behoeve van de voorbereiding van dagvaardingen in civielrechtelijke
      procedures waarbij motorrijtuigen zijn betrokken en waarin sprake is van wegrijden zonder te betalen na het tanken
      van motorbrandstof, zulks overeenkomstig een door of namens de tankstationbranche vast te stellen en door de
      Minister van Verkeer en Waterstaat goed te keuren protocol,
    url: https://wetten.overheid.nl/BWBR0024045/2026-01-01#Artikel2
  - number: 2.2.d
    text: |-
      wat betreft producenten en importeurs van motorrijtuigen: ten behoeve van de uitvoering van de
      [Wet op de belasting van personenauto’s en motorrijwielen 1992][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005806
    url: https://wetten.overheid.nl/BWBR0024045/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005806
  - number: 2.2.e
    text: |-
      wat betreft fabrikanten en importeurs van in Nederland geregistreerde motorrijtuigen of aanhangwagens of van
      onderdelen en uitrustingstukken van deze motorrijtuigen en aanhangwagens met een ‘e-’, ‘E-’ of ‘NL-’goedkeurmerk:
      ten behoeve van het terugroepen van motorrijtuigen of aanhangwagens ingeval zich, naar het oordeel van deze
      partijen en de Dienst Wegverkeer, een gevaar voor de gezondheid van de mens of de veiligheid van de mens of
      zaken voordoet of voor kan doen en met de uitvoering van een terugroepactie niet gewacht kan worden tot regulier
      onderhoud, en
    url: https://wetten.overheid.nl/BWBR0024045/2026-01-01#Artikel2
  - number: 2.2.f
    text: |-
      wat betreft houders van de erkenning voorbehoud en verplichtingen: gegevens ten behoeve van voertuigen in eigendom
      van het bedrijf waaraan een erkenning voorbehoud en verplichtingen is verleend, en waarover een aantekening,
      als bedoeld in [artikel 17, eerste lid, onderdeel b, van het Besluit erkenningen wegverkeer][ref1], in het
      kentekenregister is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0051671#Artikel17
    url: https://wetten.overheid.nl/BWBR0024045/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0051671
        artikel: '17'
  - number: '2.3'
    text: |-
      Aan de beroepsbeoefenaren bedoeld in het eerste lid, onderdeel a, kunnen de gegevens opgenomen in [bijlage I][ref1]
      bij deze regeling worden verstrekt ten behoeve van de totstandkoming en instandhouding van de verzekeringen ten
      aanzien van motorrijtuigen en aanhangwagens.


      [ref1]: https://wetten.overheid.nl/BWBR0024045
    url: https://wetten.overheid.nl/BWBR0024045/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0024045
  - number: '2.4'
    text: |-
      Aan de beroepsbeoefenaren bedoeld in het eerste lid, onderdeel e, kunnen persoonsgegevens
      worden verstrekt over een beslag, als bedoeld in [artikel 440, derde lid][ref1] of
      [artikel 442 van het Wetboek van Burgerlijke Rechtsvordering][ref2], op een motorrijtuig of aanhangwagen, waarover
      een aantekening, als bedoeld in [artikel 17, eerste lid, van het Besluit erkenningen wegverkeer][ref3], in het
      kentekenreglement is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel440
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel442
      [ref3]: https://wetten.overheid.nl/BWBR0051671#Artikel17
    url: https://wetten.overheid.nl/BWBR0024045/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '440'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '442'
      - id: ref3
        bwb_id: BWBR0051671
        artikel: '17'
  - number: '3'
    text: |-
      Aan de door de Minister van Verkeer en Waterstaat aangewezen informatieproviders als bedoeld in
      [artikel 9, eerste lid, onderdeel b, van het Kentekenreglement][ref1] kunnen de volgende gevoelige gegevens worden
      verstrekt:


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel9
    url: https://wetten.overheid.nl/BWBR0024045/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '9'
  - number: 3.a
    text: |-
      de gegevens opgenomen in [bijlage II][ref1] bij deze regeling ten behoeve van statistische doeleinden;


      [ref1]: https://wetten.overheid.nl/BWBR0024045
    url: https://wetten.overheid.nl/BWBR0024045/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0024045
  - number: 3.b
    text: |-
      de gegevens opgenomen in [bijlage III][ref1] bij deze regeling ten behoeve van de in de desbetreffende
      aanwijzingsbeschikking opgenomen voertuiginformatiesystemen ten behoeve van de voertuigbranche, bedoeld in
      [artikel 14, eerste lid, onderdeel b, van het Kentekenreglement][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0024045
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel14
    url: https://wetten.overheid.nl/BWBR0024045/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0024045
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '14'
  - number: 3.c
    text: |-
      de gegevens opgenomen in [bijlage III][ref1] bij deze regeling ten behoeve van informatiesystemen voor de
      totstandkoming en instandhouding van de verzekeringen ten aanzien van motorrijtuigen en aanhangwagens voor de
      verzekeraars of de door hen aangewezen gevolmachtigden bedoeld in [artikel 2, eerste lid, onderdeel a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024045
      [ref2]: https://wetten.overheid.nl/BWBR0024045#Artikel2
    url: https://wetten.overheid.nl/BWBR0024045/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0024045
      - id: ref2
        bwb_id: BWBR0024045
        artikel: '2'
  - number: 3a.1
    text: |-
      Aan iedere belanghebbende kan het gegeven worden verstrekt dat een tenaamstelling vervallen is verklaard op grond
      van [artikel 40b, vierde lid, onderdeel c, van het Kentekenreglement][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel40b
    url: https://wetten.overheid.nl/BWBR0024045/2026-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: 40b
  - number: 3a.2
    text: Verstrekking vindt plaats na opgave van een kenteken.
    url: https://wetten.overheid.nl/BWBR0024045/2026-01-01#Artikel3a
  - number: 3b
    text: |-
      Aan een bedrijf waaraan een erkenning bedrijfsvoorraad als bedoeld in
      [artikel 1 van het Besluit erkenningen wegverkeer][ref1] is verleend, kan de volledige reeks geregistreerde
      tellerstanden worden verstrekt van een motorrijtuig dat in de bedrijfsvoorraad van dat bedrijf is aangemeld.


      [ref1]: https://wetten.overheid.nl/BWBR0051671#Artikel1
    url: https://wetten.overheid.nl/BWBR0024045/2026-01-01#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0051671
        artikel: '1'
  - number: '5.1'
    text: |-
      Het tarief ter zake van de kosten van toezicht, bedoeld in
      [artikel 45a, eerste lid, van de Wegenverkeerswet 1994][ref1], maakt onderdeel uit van de tarieven voor
      verstrekking, bedoeld in [artikel 43, zesde en zevende lid, van de Wegenverkeerswet 1994][ref2], die in rekening
      worden gebracht bij personen of instanties waarop toezicht wordt gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel45a
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel43
    url: https://wetten.overheid.nl/BWBR0024045/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 45a
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '43'
  - number: '5.2'
    text: |-
      In aanvulling op het eerste lid kan het aldaar bedoelde tarief bij de in [artikel 1][ref1] aangewezen
      overheidsorganen in rekening worden gebracht op door de Dienst Wegverkeer te bepalen wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0024045#Artikel1
    url: https://wetten.overheid.nl/BWBR0024045/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0024045
        artikel: '1'
  - number: '5.3'
    text: |-
      Het tarief ter zake van de kosten van de inspectie, bedoeld in
      [artikel 45a, tweede lid, van de Wegenverkeerswet 1994][ref1], wordt in rekening gebracht, indien naar het oordeel
      van de Dienst Wegverkeer blijkt dat een gegeven onjuist in het kentekenregister is opgenomen en de onjuistheid
      van het gegeven degene aan wie het kentekenbewijs voor het geïnspecteerde voertuig is afgegeven kan worden
      tegengeworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel45a
    url: https://wetten.overheid.nl/BWBR0024045/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 45a
  - number: '5.4'
    text: |-
      In aanvulling op het derde lid komt dit tarief tevens voor rekening van degene aan wie het kentekenbewijs van het
      ter inspectie opgeroepen voertuig is afgegeven, indien het voertuig niet voor inspectie ter beschikking is gesteld,
      tenzij het niet voor inspectie ter beschikking stellen diegene niet kan worden tegengeworpen.
    url: https://wetten.overheid.nl/BWBR0024045/2026-01-01#Artikel5
  - number: '7'
    text: Deze regeling treedt in werking met ingang van 1 juli 2008.
    url: https://wetten.overheid.nl/BWBR0024045/2026-01-01#Artikel7
  - number: '8'
    text: 'Deze regeling wordt aangehaald als: Regeling gegevensverstrekking kentekenregister 2008.'
    url: https://wetten.overheid.nl/BWBR0024045/2026-01-01#Artikel8
