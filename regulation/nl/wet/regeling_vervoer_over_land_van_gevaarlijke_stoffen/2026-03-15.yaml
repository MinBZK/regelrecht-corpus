  - number: '3'
    text: |-
      Met voorwaardelijk tot het vervoer over land toegelaten gevaarlijke stoffen als bedoeld in [bijlage 1][ref1] mogen
      de handelingen, bedoeld in [artikel 2 van het Besluit vervoer gevaarlijke stoffen][ref2], worden verricht, mits de
      in deze regeling gestelde voorschriften in acht worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0010054
      [ref2]: https://wetten.overheid.nl/BWBR0008080#Artikel2
    url: https://wetten.overheid.nl/BWBR0010054/2026-03-15#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0010054
      - id: ref2
        bwb_id: BWBR0008080
        artikel: '2'
  - number: '4'
    text: |-
      1 De door de bevoegde autoriteiten op basis van randnummer 1.5.1.1 van de ADR overeengekomen tijdelijke afwijkingen
      worden in de vorm van een multilaterale overeenkomst aan de bevoegde autoriteiten van de andere lidstaten van de
      Europese Unie voorgelegd door de bevoegde autoriteit die het initiatief tot de overeenkomst neemt. Van dergelijke
      afwijkingen doet de Minister mededeling aan de Europese Commissie.

      2 De afwijkingen, bedoeld in het eerste lid, worden verleend zonder onderscheid naar nationaliteit of
      vestigingsplaats van de verzender, de vervoerder of de ontvanger, hebben een looptijd van ten hoogste vijf jaar en
      zijn niet hernieuwbaar.
    url: https://wetten.overheid.nl/BWBR0010054/2026-03-15#Artikel4
