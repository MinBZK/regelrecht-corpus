preamble:
  text: |-
    Gelet op artikel 10 van Richtlijn 94/55/EG van de Raad van de Europese Gemeenschappen van 21 november 1994
    betreffende de onderlinge aanpassing van de wetgevingen der Lid-Staten inzake het vervoer van gevaarlijke goederen
    over de weg (PbEG 94 L 319), op artikel 10 van Richtlijn 95/50/EG van de Raad van de Europese Gemeenschappen van 6
    oktober 1995 betreffende uniforme procedures voor de controle op het vervoer van gevaarlijke goederen over de weg
    (PbEG L 249), op artikel 4b, tweede lid, onderdeel a, van de Wegenverkeerswet 1994 en op artikel 2 van het Besluit
    vervoer gevaarlijke stoffen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0010054/2026-03-15#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:



              a
               Minister:

                Minister van Infrastructuur en Milieu;



              b
               bevoegde autoriteit:

                Minister,
      een in [bijlage 3][ref1] bij deze regeling erkende instantie, of
      een met toepassing van de [Regeling erkende instanties vervoer gevaarlijke stoffen][ref2] erkende instantie;



              c
              richtlijn nr. 2008/68/EG:

                richtlijn nr. 2008/68/EG van het Europees Parlement en de Raad van de Europese Unie van 24 september 2008
      betreffende het vervoer van gevaarlijke goederen over land (PbEU L 260);



              d

                [richtlijn EU 2022/1999:](31995L0050)


                [richtlijn (EU) 2022/1999](32022L1999) van het Europees Parlement en de Raad van 19 oktober 2022
      betreffende uniforme procedures voor de controle op het vervoer van gevaarlijke goederen over de weg (codificatie)
      (PbEU 2022, L 274).




      2 De in [bijlage 1][ref3] opgenomen begripsbepalingen zijn van toepassing op de [bijlagen 2][ref4], [3][ref5] en
      [4][ref6] voorzover daarin niet anders is bepaald.


