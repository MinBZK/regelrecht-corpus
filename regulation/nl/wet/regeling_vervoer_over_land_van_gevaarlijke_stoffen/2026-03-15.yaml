  - number: '2'
    text: |-
      Bij deze regeling behoren vier bijlagen:

      a. [bijlage 1][ref1]: voorschriften betreffende het vervoer van gevaarlijke stoffen over land, zijnde de
      Nederlandse vertaling van de bijlagen A en B van het ADR en de daarbij behorende aanhangsels;

      b. [bijlage 2][ref2]: voorschriften in afwijking van of in aanvulling op [bijlage 1][ref3];

      c. [bijlage 3][ref4]: erkende instanties, bedoeld in [artikel 1, eerste lid, onderdeel b, 2°][ref5];

      d. [bijlage 4][ref6]: rijkskeuringsvoorschriften betreffende het vervoer over land van gevaarlijke stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0010054
      [ref2]: https://wetten.overheid.nl/BWBR0010054
