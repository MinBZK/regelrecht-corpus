  - number: '36'
    text: |-
      1 Er is een Staatstoezicht op de volksgezondheid, ressorterend onder Onze Minister, dat bestaat uit bij algemene
      maatregel van bestuur aangewezen onderdelen en dat tot taak heeft:

      a. het verrichten van onderzoek naar de staat van de volksgezondheid en de determinanten daarvan alsmede, waar
      nodig, het aangeven en bevorderen van middelen tot verbetering daarvan;

      b. het toezicht op de naleving en de opsporing van overtredingen van het bepaalde bij of krachtens wettelijke
      voorschriften op het gebied van de volksgezondheid, een en ander voor zover de ambtenaren van het Staatstoezicht
      daarmede zijn belast bij of krachtens wettelijk voorschrift;

      c. het geven of weigeren van de toestemming, bedoeld in
      [artikel 40, derde lid, onder c, van de Geneesmiddelenwet][ref1].

      2 Het Staatstoezicht heeft voorts tot taak het uitbrengen van adviezen en het verstrekken van inlichtingen aan Onze
      Minister op verzoek of uit eigen beweging, met betrekking tot hetgeen het Staatstoezicht op grond van het eerste
      lid ter kennis is gekomen.

      3 De in het eerste lid, onder b, genoemde taken strekken zich ook uit tot de voorschriften van een verordening van
      de Raad van de Europese Gemeenschappen op het gebied van de volksgezondheid, voor zover de verordening toezicht op
      de naleving en opsporing van overtredingen daarvan vordert.

      4 Bij algemene maatregel van bestuur kan worden bepaald dat een of meer onderdelen van het Staatstoezicht
      ressorteren onder een andere Minister dan Onze Minister van Volksgezondheid, Welzijn en Sport. De voordracht voor
      een zodanige algemene maatregel van bestuur wordt gedaan door Onze Minister van Volksgezondheid, Welzijn en Sport,
      in overeenstemming met Onze Minister wie het mede aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel40
    url: https://wetten.overheid.nl/BWBR0002202/2018-08-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '40'
  - number: '37'
    text: |-
      Aan het hoofd van elk onderdeel van het Staatstoezicht staat een inspecteur-generaal. Hij neemt bij de vervulling
      van zijn taak de aanwijzingen van Onze Minister in acht.
    url: https://wetten.overheid.nl/BWBR0002202/2018-08-01#Artikel37
  - number: '38'
    text: |-
      1 De [artikelen 36, eerste, tweede en vierde lid][ref1], en [37][ref2] zijn van toepassing in de openbare lichamen
      Bonaire, Sint Eustatius en Saba.

      2 Het Staatstoezicht op de Volksgezondheid is in de openbare lichamen Bonaire, Sint Eustatius en Saba bevoegd
      tot de uitoefening van de in [artikel 36, eerste en tweede lid][ref3], genoemde taken, voor zover het gaat om de
      voorschriften bij of krachtens de:

      a. Wet toezicht op krankzinnigen BES;

      b. [Wet beperking tabaksgebruik BES][ref4];

      c. [Warenwet BES][ref5];

      d. [Opiumwet 1960 BES][ref6];

      e. [Wet op de geneesmiddelenvoorziening BES][ref7];

      f. [Wet organisatie bloedvoorziening BES][ref8];

      g. [Wet zorginstellingen BES][ref9];

      h. Vergunningwet BES.

      3 Het Staatstoezicht op de Volksgezondheid oefent in de openbare lichamen Bonaire, Sint Eustatius en Saba zijn
      taken uit met inachtneming van de rechten, plichten en bevoegdheden, genoemd in de [Hoofdstukken 3][ref10],
      [4][ref11] en [5 van de Wet Inspectie Biociden BES][ref12].


