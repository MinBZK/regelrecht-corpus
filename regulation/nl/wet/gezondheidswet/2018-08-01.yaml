    text: |-
      1 In afwijking van [artikel 16 van de Kaderwet adviescolleges][ref1] kan de voorzitter uit de leden commissies
      instellen.

      2 De voorzitter wijst uit de leden van een commissie een voorzitter aan.

      3 De voorzitter en de vice-voorzitters zijn bevoegd de vergaderingen van de onderscheidene commissies, waarvan zij
      geen lid zijn, bij te wonen en aan de beraadslagingen deel te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel16
