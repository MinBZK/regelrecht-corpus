  - number: '21'
    text: |-
      1 Er is een Gezondheidsraad.

      2 De in [artikel 10, eerste volzin, van de Kaderwet adviescolleges][ref1] opgenomen bovengrens voor het aantal
      leden van adviescolleges geldt niet voor de Gezondheidsraad.

      3 In afwijking van [artikel 10, tweede volzin, van de Kaderwet adviescolleges][ref2] kunnen bij koninklijk besluit
      uit de andere leden ten hoogste twee vice-voorzitters worden benoemd.

      4 Een vice-voorzitter oefent een door de voorzitter in overeenstemming met die vice-voorzitter te bepalen gedeelte
      van de taak van de voorzitter uit.

      5 In afwijking van [artikel 11, tweede lid, van de Kaderwet adviescolleges][ref3], kan herbenoeming van de leden
      driemaal plaatsvinden.

      6 In afwijking van [artikel 11, tweede lid, van de Kaderwet adviescolleges][ref4], worden de voorzitter en vice-
      voorzitters, ongeacht de duur van een eerder lidmaatschap, voor ten hoogste vier jaar benoemd als lid, tevens
      voorzitter, onderscheidenlijk vice-voorzitter. Herbenoeming als lid, tevens voorzitter dan wel vice-voorzitter, kan
      twee maal en telkens voor ten hoogste vier jaar plaatsvinden.


