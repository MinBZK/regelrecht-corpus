  - number: '70'
    text: |-
      1 Deze wet kan worden aangehaald als Gezondheidswet.

      2 Zij treedt in werking op een door Ons te bepalen tijdstip. Wij kunnen het inwerkingtreden van de verschillende
      onderdelen van deze wet op verschillende tijdstippen bepalen.

      3 De Gezondheidswet 1919, *Stb.* 784, vervalt.
