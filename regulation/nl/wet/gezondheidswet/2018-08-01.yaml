  - number: '41'
    text: |-
      De inspecteur-generaal dient aan Gedeputeerde Staten of aan Onze Commissaris in een provincie, aan de gemeenteraad,
      aan Burgemeester en Wethouders of aan de burgemeesters, van bericht en raad in daarvoor in aanmerking komende
      zaken, hun werkkring betreffende.
    url: https://wetten.overheid.nl/BWBR0002202/2018-08-01#Artikel41
  - number: '43'
    text: |-
      1 Gedeputeerde Staten en Burgemeester en Wethouders zenden aan de inspecteur-generaal en aan de Provinciale Raad,
      binnen wier werkgebied de provincie, respectievelijk de gemeente is gelegen, een afschrift of afdruk van elk der
      verordeningen, besluiten of verslagen, de volksgezondheid in hun provincie, respectievelijk gemeente betreffende,
      en van de daarin gemaakte aanvullingen of wijzigingen.

      2 Zij verstrekken aan de inspecteur-generaal alle door hem verlangde inlichtingen over de naleving van wetten en
      verordeningen, de volksgezondheid betreffende.
    url: https://wetten.overheid.nl/BWBR0002202/2018-08-01#Artikel43
  - number: '45'
    text: |-
      1 In elke provincie stellen de Gedeputeerde Staten een Provinciale Raad voor de Volksgezondheid in.

      2 Zij stellen de plaats van vestiging van de Raad vast.

      3 Zij regelen, met inachtneming van de voorschriften van dit hoofdstuk, de samenstelling, de bevoegdheid en de
      werkwijze van de Raad.

      4 De Provinciale Raad is rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0002202/2018-08-01#Artikel45
  - number: '47'
    text: |-
      De taak van de Provinciale Raad omvat in ieder geval:

      a. het stimuleren van de gezondheidszorg binnen de provincie;

      b. het bevorderen van de coördinatie van alle werkzaamheden, welke op het gebied van de volksgezondheid binnen de
      provincie worden verricht;

      c. het uitbrengen van adviezen, onder meer omtrent de verdeling van rijkssubsidies en het bevorderen van het ter
      beschikking stellen van gelden en andere middelen ten behoeve van de gezondheidszorg;

      d. het samenwerken met andere Provinciale Raden, indien deze samenwerking voor de gezondheidszorg dienstig is;

      e. het verrichten van werkzaamheden ter bevordering van een doelmatig stelsel van voorzieningen voor
      gezondheidszorg in de provincie.
    url: https://wetten.overheid.nl/BWBR0002202/2018-08-01#Artikel47
  - number: '48'
    text: |-
      De samenstelling van de Provinciale Raad wordt zodanig geregeld, dat daarin in elk geval zitting hebben leden
      afkomstig uit de kringen van:

      a. gemeentebesturen;

      b. instellingen voor gezondheidszorg;

      c. personen werkzaam op het terrein van de gezondheidszorg;

      d. personen of organisaties, die de belangen van de gebruikers van voorzieningen voor gezondheidszorg in algemene
      zin behartigen;

      e. verzekeringsinstellingen op het gebied van de gezondheidszorg;

      f. instellingen voor maatschappelijke dienstverlening.
    url: https://wetten.overheid.nl/BWBR0002202/2018-08-01#Artikel48
  - number: '49'
    text: |-
      De inspecteur-generaal wordt uitgenodigd de vergaderingen van de Raad zomede van de door deze ingestelde commissies
      bij te wonen. Hij heeft in de vergadering een adviserende stem.
    url: https://wetten.overheid.nl/BWBR0002202/2018-08-01#Artikel49
  - number: '50'
    text: |-
      1 De Provinciale Raad doet zich bijstaan door commissies van advies en bijstand, welke deskundig zijn op een
      bijzonder gebied van de volksgezondheid.

      2 De Provinciale Raad kan in zijn gebied één of meer districtscommissies instellen. Ten aanzien van die commissies
      is [artikel 48][ref1] van overeenkomstige toepassing.

      3 De Raad regelt de samenstelling, bevoegdheid en werkwijze van deze commissies en benoemt de leden.


      [ref1]: https://wetten.overheid.nl/BWBR0002202#Artikel48
    url: https://wetten.overheid.nl/BWBR0002202/2018-08-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0002202
        artikel: '48'
        hoofdstuk: V
        paragraaf: '2'
  - number: '51'
    text: |-
      1 De Provinciale Raad wordt bijgestaan door een bureau.

      2 De Provinciale Raad draagt zorg, dat medische inbreng in het bureau verzekerd is.
    url: https://wetten.overheid.nl/BWBR0002202/2018-08-01#Artikel51
  - number: '52'
    text: |-
      1 De directeur en andere personen, bij het bureau werkzaam, worden door de Provinciale Raad benoemd, geschorst
      en ontslagen.

      2 De arbeidsvoorwaarden, waaronder de directeur en de andere personen, bij het bureau werkzaam, hun betrekking
      vervullen, zijn gelijk aan die, welke gelden voor het personeel in dienst van de provincie.

      3 Met inachtneming van het bepaalde in het vorige lid, worden door de Gedeputeerde Staten voorschriften vastgesteld
      betreffende de bezoldiging van de directeur en van de andere personen, werkzaam bij het bureau.
    url: https://wetten.overheid.nl/BWBR0002202/2018-08-01#Artikel52
  - number: '53'
    text: De Provinciale Raad stelt voor de directeur een instructie vast.
    url: https://wetten.overheid.nl/BWBR0002202/2018-08-01#Artikel53
  - number: '54'
    text: |-
      1 De Provinciale Raad brengt op verzoek of uit eigen beweging advies uit aan de openbare lichamen en diensten en
      de particuliere rechtspersonen, welke in de Raad zijn vertegenwoordigd, alsmede aan andere openbare organen, met
      uitzondering van het Rijk.

      2 Aan particuliere rechtspersonen, andere dan bedoeld in het eerste lid, en aan natuurlijke personen kan de
      Provinciale Raad op hun verzoek, al dan niet tegen vergoeding, advies uitbrengen over onderwerpen, welke naar het
      oordeel van de Raad liggen op het terrein van de volksgezondheid.

      3 De adviezen van de Raad en zijn commissies worden opgesteld, overeenkomstig het gevoelen van de meerderheid der
      vergadering.

      4 In de adviezen wordt van afwijkende gevoelens van de minderheid gemotiveerd mededeling gedaan, en worden, indien
      de leden die deze minderheid vormen zulks wensen, hun namen vermeld.

      5 De leden zijn bevoegd minderheidsnota's bij het advies te voegen, indien het daarin uitgesproken gevoelen is
      verdedigd in de vergadering, waarin het uit te brengen advies werd behandeld.
    url: https://wetten.overheid.nl/BWBR0002202/2018-08-01#Artikel54
  - number: '56'
    text: |-
      Gedeputeerde Staten en Burgemeester en Wethouders stellen de Provinciale Raad in kennis van alle ontwerpen van
      verordeningen, welke van belang zijn voor de volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0002202/2018-08-01#Artikel56
  - number: '57'
    text: |-
      Openbare lichamen en diensten, alsmede particuliere rechtspersonen en natuurlijke personen, die in de provincie
      op het gebied van de volksgezondheid werkzaam zijn, zijn desgevraagd gehouden aan de Provinciale Raad alle op de
      volksgezondheid betrekking hebbende inlichtingen te verstrekken, welke de Raad voor de juiste vervulling van zijn
      taak nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0002202/2018-08-01#Artikel57
  - number: '58'
    text: |-
      De Provinciale Raad is desgevraagd gehouden aan de inspecteur-generaal alle gegevens en inlichtingen te
      verstrekken, welke hij voor de juiste vervulling van zijn taak nodig acht.
    url: https://wetten.overheid.nl/BWBR0002202/2018-08-01#Artikel58
  - number: '60'
    text: |-
      De Provinciale Raad zendt jaarlijks voor 1 Juni een verslag van zijn werkzaamheden in het afgelopen kalenderjaar
      aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002202/2018-08-01#Artikel60
  - number: '62'
    text: Wij behouden Ons voor ter uitvoering van deze wet bij algemene maatregel van bestuur nadere regelen te stellen.
    url: https://wetten.overheid.nl/BWBR0002202/2018-08-01#Artikel62
  - number: '69'
    text: |-
      Waar in enig wettelijk voorschrift wordt verwezen naar een artikel van de Gezondheidswet 1919, *Stb.* 784, wordt
      deze verwijzing geacht te geschieden naar de overeenkomstige bepalingen van de onderhavige wet.
    url: https://wetten.overheid.nl/BWBR0002202/2018-08-01#Artikel69
  - number: 69a
    text: |-
      1 Na de inwerkingtreding van de [Aanpassingswet derde tranche Awb I][ref1] berust het Besluit Staatstoezicht
      Volksgezondheid op [artikel 36, eerste lid, van deze wet][ref2].

      2 Ten aanzien van de in [artikel 145 van de Wet op de beroepen in de individuele gezondheidszorg][ref3]
      genoemde wetten is deze wet van toepassing zoals deze luidde voor de inwerkingtreding van de
      [Aanpassingswet derde tranche Awb I][ref4].


