preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe wettelijke voorschriften vast te stellen met
    betrekking tot de organisatie van de zorg voor de volksgezondheid;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002202/2018-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van deze wet wordt verstaan onder:

      a. "Onze Minister": Onze Minister, belast met de zaken betreffende de volksgezondheid;

      b. "inspecteur-generaal": de inspecteur-generaal, bedoeld in [artikel 37][ref1];

      c. "Provinciale Raad": de Provinciale Raad voor de Volksgezondheid;

      d. "provinciale kruisverenigingen": de provinciale verenigingen met volledige rechtsbevoegdheid, die uitsluitend
      het behartigen of doen behartigen van wijkverpleging en andere sociaal-hygiënische zorg beogen en bij een nationale
      vereniging met gelijke doelstelling zijn aangesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0002202#Artikel37
    url: https://wetten.overheid.nl/BWBR0002202/2018-08-01#Artikel1
