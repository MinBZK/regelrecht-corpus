$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: gezondheidswet
regulatory_layer: WET
publication_date: '2025-06-04'
valid_from: '2006-11-17'
bwb_id: BWBR0002202
url: https://wetten.overheid.nl/BWBR0002202/2006-11-17
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe wettelijke voorschriften vast te stellen met
    betrekking tot de organisatie van de zorg voor de volksgezondheid;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#ArtikelAanhef
articles:
  - number: '1'
    text: 'Voor de toepassing van deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel1
  - number: 1.a
    text: '"Onze Minister": Onze Minister, belast met de zaken betreffende de volksgezondheid;'
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel1
  - number: 1.b
    text: '"hoofdinspecteurs en inspecteurs":de hoofdinspecteurs en inspecteurs van het Staatstoezicht op de volksgezondheid;'
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel1
  - number: 1.c
    text: '"Provinciale Raad": de Provinciale Raad voor de Volksgezondheid;'
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel1
  - number: 1.d
    text: |-
      "provinciale kruisverenigingen": de provinciale verenigingen met volledige rechtsbevoegdheid, die uitsluitend het
      behartigen of doen behartigen van wijkverpleging en andere sociaal-hygiënische zorg beogen en bij een nationale
      vereniging met gelijke doelstelling zijn aangesloten.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel1
  - number: '21.1'
    text: Er is een Gezondheidsraad.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel21
  - number: '21.2'
    text: |-
      De in [artikel 10, eerste volzin, van de Kaderwet adviescolleges][ref1] opgenomen bovengrens voor het aantal leden
      van adviescolleges geldt niet voor de Gezondheidsraad.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel10
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '10'
  - number: '21.3'
    text: |-
      In afwijking van [artikel 10, tweede volzin, van de Kaderwet adviescolleges][ref1] kunnen bij koninklijk besluit
      uit de andere leden ten hoogste twee vice-voorzitters worden benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel10
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '10'
  - number: '21.4'
    text: |-
      Een vice-voorzitter oefent een door de voorzitter in overeenstemming met die vice-voorzitter te bepalen gedeelte
      van de taak van de voorzitter uit.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel21
  - number: '22'
    text: |-
      De Gezondheidsraad heeft tot taak Onze Ministers en de beide kamers der Staten-Generaal voor te lichten over
      de stand der wetenschap ten aanzien van vraagstukken op het gebied van de volksgezondheid door middel van het
      uitbrengen van rapporten.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel22
  - number: '23'
    text: |-
      Voor de toepassing van de [Kaderwet adviescolleges][ref1] en [artikel 9 van de Wet openbaarheid van bestuur][ref2]
      wordt een rapport dat geen advies bevat, gelijkgesteld aan een advies.


      [ref1]: https://wetten.overheid.nl/BWBR0008159
      [ref2]: https://wetten.overheid.nl/BWBR0005252#Artikel9
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0008159
      - id: ref2
        bwb_id: BWBR0005252
        artikel: '9'
  - number: '24.1'
    text: |-
      In afwijking van [artikel 16 van de Kaderwet adviescolleges][ref1] kan de voorzitter uit de leden commissies
      instellen.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel16
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '16'
  - number: '24.2'
    text: De voorzitter wijst uit de leden van een commissie een voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel24
  - number: '24.3'
    text: |-
      De voorzitter en de vice-voorzitters zijn bevoegd de vergaderingen van de onderscheidene commissies, waarvan zij
      geen lid zijn, bij te wonen en aan de beraadslagingen deel te nemen.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel24
  - number: '25'
    text: |-
      In afwijking van [artikel 19, tweede lid, van de Kaderwet adviescolleges][ref1] kan de voorzitter op verzoek van
      een commissie andere personen betrekken bij de werkzaamheden van die commissie, voor zover dat voor de vervulling
      van haar taak nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel19
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '19'
  - number: '26'
    text: |-
      In afwijking van de [artikelen 17][ref1] en [18 van de Kaderwet adviescolleges][ref2] is een commissie als bedoeld
      in [artikel 24][ref3] bevoegd in naam van de Gezondheidsraad door tussenkomst van de voorzitter een rapport als
      bedoeld in [artikel 22][ref4] uit te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0008159#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0002202#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0002202#Artikel22
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0008159
        artikel: '18'
      - id: ref3
        bwb_id: BWBR0002202
        artikel: '24'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0002202
        artikel: '22'
        hoofdstuk: III
  - number: 26a
    text: |-
      In afwijking van [artikel 21 van de Kaderwet adviescolleges][ref1] wordt een reglement van orde voor de
      Gezondheidsraad en de commissies door de voorzitter vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel21
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '21'
  - number: '27'
    text: |-
      In afwijking van [artikel 15, tweede lid, van de Kaderwet adviescolleges][ref1] is de secretaris van de
      Gezondheidsraad voor zijn werkzaamheden voor de Gezondheidsraad uitsluitend verantwoording schuldig aan de
      voorzitter.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel15
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '15'
  - number: '36.1'
    text: |-
      Er is een Staatstoezicht op de volksgezondheid, ressorterend onder Onze Minister, dat bestaat uit bij algemene
      maatregel van bestuur aangewezen onderdelen en dat tot taak heeft:
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel36
  - number: 36.1.a
    text: |-
      het verrichten van onderzoek naar de staat van de volksgezondheid en de determinanten daarvan alsmede, waar nodig,
      het aangeven en bevorderen van middelen tot verbetering daarvan;
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel36
  - number: 36.1.b
    text: |-
      het toezicht op de naleving en de opsporing van overtredingen van het bepaalde bij of krachtens wettelijke
      voorschriften op het gebied van de volksgezondheid, een en ander voor zover de ambtenaren van het Staatstoezicht
      daarmede zijn belast bij of krachtens wettelijk voorschrift.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel36
  - number: '36.2'
    text: |-
      Het Staatstoezicht heeft voorts tot taak het uitbrengen van adviezen en het verstrekken van inlichtingen aan Onze
      Minister op verzoek of uit eigen beweging, met betrekking tot hetgeen het Staatstoezicht op grond van het eerste
      lid ter kennis is gekomen.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel36
  - number: '36.3'
    text: |-
      De in het eerste lid, onder b, genoemde taken strekken zich ook uit tot de voorschriften van een verordening van de
      Raad van de Europese Gemeenschappen op het gebied van de volksgezondheid, voor zover de verordening toezicht op de
      naleving en opsporing van overtredingen daarvan vordert.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel36
  - number: '36.4'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat een of meer onderdelen van het Staatstoezicht ressorteren
      onder een andere Minister dan Onze Minister van Volksgezondheid, Welzijn en Sport. De voordracht voor een
      zodanige algemene maatregel van bestuur wordt gedaan door Onze Minister van Volksgezondheid, Welzijn en Sport, in
      overeenstemming met Onze Minister wie het mede aangaat.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel36
  - number: '38'
    text: |-
      Aan het hoofd van elk onderdeel van het Staatstoezicht staat een hoofdinspecteur. Hij neemt bij de vervulling van
      zijn taak de aanwijzingen van Onze Minister in acht.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel38
  - number: '39'
    text: |-
      Met betrekking tot de uitvoering van de in [artikel 36, eerste lid, onder a][ref1], bedoelde taak zijn
      de [artikelen 5:12][ref2], [5:13][ref3], [5:15][ref4], [5:16][ref5], [5:17][ref6], [5:18][ref7] en
      [5:20 van de Algemene wet bestuursrecht][ref8] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002202#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref8]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0002202
        artikel: '36'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref7
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref8
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '41'
    text: |-
      De inspecteurs dienen aan Gedeputeerde Staten of aan Onze Commissaris in een provincie, aan de gemeenteraad, aan
      Burgemeester en Wethouders of aan de burgemeesters, van bericht en raad in daarvoor in aanmerking komende zaken,
      hun werkkring betreffende.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel41
  - number: '43.1'
    text: |-
      Gedeputeerde Staten en Burgemeester en Wethouders zenden aan de Hoofdinspecteurs, aan de inspecteurs en aan de
      Provinciale Raad, binnen wier werkgebied de provincie, respectievelijk de gemeente is gelegen, een afschrift of
      afdruk van elk der verordeningen, besluiten of verslagen, de volksgezondheid in hun provincie, respectievelijk
      gemeente betreffende, en van de daarin gemaakte aanvullingen of wijzigingen.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel43
  - number: '43.2'
    text: |-
      Zij verstrekken aan de Hoofdinspecteur en aan de in lid 1 bedoelde inspecteurs, binnen wier werkgebied hun
      provincie, respectievelijk hun gemeente ligt, alle door dezen verlangde inlichtingen over de naleving van wetten en
      verordeningen, de volksgezondheid betreffende.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel43
  - number: '45.1'
    text: In elke provincie stellen de Gedeputeerde Staten een Provinciale Raad voor de Volksgezondheid in.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel45
  - number: '45.2'
    text: Zij stellen de plaats van vestiging van de Raad vast.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel45
  - number: '45.3'
    text: |-
      Zij regelen, met inachtneming van de voorschriften van dit hoofdstuk, de samenstelling, de bevoegdheid en de
      werkwijze van de Raad.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel45
  - number: '45.4'
    text: De Provinciale Raad is rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel45
  - number: '47'
    text: 'De taak van de Provinciale Raad omvat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel47
  - number: 47.a
    text: het stimuleren van de gezondheidszorg binnen de provincie;
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel47
  - number: 47.b
    text: |-
      het bevorderen van de coördinatie van alle werkzaamheden, welke op het gebied van de volksgezondheid binnen de
      provincie worden verricht;
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel47
  - number: 47.c
    text: |-
      het uitbrengen van adviezen, onder meer omtrent de verdeling van rijkssubsidies en het bevorderen van het ter
      beschikking stellen van gelden en andere middelen ten behoeve van de gezondheidszorg;
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel47
  - number: 47.d
    text: het samenwerken met andere Provinciale Raden, indien deze samenwerking voor de gezondheidszorg dienstig is;
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel47
  - number: 47.e
    text: |-
      het verrichten van werkzaamheden ter bevordering van een doelmatig stelsel van voorzieningen voor gezondheidszorg
      in de provincie.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel47
  - number: '48'
    text: |-
      De samenstelling van de Provinciale Raad wordt zodanig geregeld, dat daarin in elk geval zitting hebben leden
      afkomstig uit de kringen van:
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel48
  - number: 48.a
    text: gemeentebesturen;
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel48
  - number: 48.b
    text: instellingen voor gezondheidszorg;
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel48
  - number: 48.c
    text: personen werkzaam op het terrein van de gezondheidszorg;
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel48
  - number: 48.d
    text: |-
      personen of organisaties, die de belangen van de gebruikers van voorzieningen voor gezondheidszorg in algemene
      zin behartigen;
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel48
  - number: 48.e
    text: verzekeringsinstellingen op het gebied van de gezondheidszorg;
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel48
  - number: 48.f
    text: instellingen voor maatschappelijke dienstverlening.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel48
  - number: '49.1'
    text: |-
      De inspecteurs binnen wier ambtsgebied de Provinciale Raad werkzaam is, worden uitgenodigd de vergaderingen van de
      Raad zomede van de door deze ingestelde commissies bij te wonen. Zij hebben in de vergadering een adviserende stem.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel49
  - number: '49.2'
    text: |-
      De Hoofdinspecteurs zijn bevoegd de vergaderingen van de Provinciale Raad en van de door deze ingestelde
      commissies bij te wonen en hebben een adviserende stem. Zij ontvangen daartoe mededeling van het bijeenroepen der
      vergaderingen en een afschrift van de agenda.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel49
  - number: '50.1'
    text: |-
      De Provinciale Raad doet zich bijstaan door commissies van advies en bijstand, welke deskundig zijn op een
      bijzonder gebied van de volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel50
  - number: '50.2'
    text: |-
      De Provinciale Raad kan in zijn gebied één of meer districtscommissies instellen. Ten aanzien van die commissies is
      [artikel 48][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002202#Artikel48
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0002202
        artikel: '48'
        hoofdstuk: V
        paragraaf: '2'
  - number: '50.3'
    text: De Raad regelt de samenstelling, bevoegdheid en werkwijze van deze commissies en benoemt de leden.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel50
  - number: '51.1'
    text: De Provinciale Raad wordt bijgestaan door een bureau.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel51
  - number: '51.2'
    text: De Provinciale Raad draagt zorg, dat medische inbreng in het bureau verzekerd is.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel51
  - number: '52.1'
    text: |-
      De directeur en andere personen, bij het bureau werkzaam, worden door de Provinciale Raad benoemd, geschorst en
      ontslagen.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel52
  - number: '52.2'
    text: |-
      De arbeidsvoorwaarden, waaronder de directeur en de andere personen, bij het bureau werkzaam, hun betrekking
      vervullen, zijn gelijk aan die, welke gelden voor het personeel in dienst van de provincie.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel52
  - number: '52.3'
    text: |-
      Met inachtneming van het bepaalde in het vorige lid, worden door de Gedeputeerde Staten voorschriften vastgesteld
      betreffende de bezoldiging van de directeur en van de andere personen, werkzaam bij het bureau.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel52
  - number: '53'
    text: De Provinciale Raad stelt voor de directeur een instructie vast.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel53
  - number: '54.1'
    text: |-
      De Provinciale Raad brengt op verzoek of uit eigen beweging advies uit aan de openbare lichamen en diensten en
      de particuliere rechtspersonen, welke in de Raad zijn vertegenwoordigd, alsmede aan andere openbare organen, met
      uitzondering van het Rijk.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel54
  - number: '54.2'
    text: |-
      Aan particuliere rechtspersonen, andere dan bedoeld in het eerste lid, en aan natuurlijke personen kan de
      Provinciale Raad op hun verzoek, al dan niet tegen vergoeding, advies uitbrengen over onderwerpen, welke naar het
      oordeel van de Raad liggen op het terrein van de volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel54
  - number: '54.3'
    text: |-
      De adviezen van de Raad en zijn commissies worden opgesteld, overeenkomstig het gevoelen van de meerderheid der
      vergadering.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel54
  - number: '54.4'
    text: |-
      In de adviezen wordt van afwijkende gevoelens van de minderheid gemotiveerd mededeling gedaan, en worden, indien de
      leden die deze minderheid vormen zulks wensen, hun namen vermeld.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel54
  - number: '54.5'
    text: |-
      De leden zijn bevoegd minderheidsnota's bij het advies te voegen, indien het daarin uitgesproken gevoelen is
      verdedigd in de vergadering, waarin het uit te brengen advies werd behandeld.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel54
  - number: '56'
    text: |-
      Gedeputeerde Staten en Burgemeester en Wethouders stellen de Provinciale Raad in kennis van alle ontwerpen van
      verordeningen, welke van belang zijn voor de volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel56
  - number: '57'
    text: |-
      Openbare lichamen en diensten, alsmede particuliere rechtspersonen en natuurlijke personen, die in de provincie
      op het gebied van de volksgezondheid werkzaam zijn, zijn desgevraagd gehouden aan de Provinciale Raad alle op de
      volksgezondheid betrekking hebbende inlichtingen te verstrekken, welke de Raad voor de juiste vervulling van zijn
      taak nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel57
  - number: '58'
    text: |-
      De Provinciale Raad is desgevraagd gehouden aan de Hoofdinspecteurs en de inspecteurs alle gegevens en inlichtingen
      te verstrekken, welke zij voor de juiste vervulling van hun taak nodig achten.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel58
  - number: '60'
    text: |-
      De Provinciale Raad zendt jaarlijks voor 1 Juni een verslag van zijn werkzaamheden in het afgelopen kalenderjaar
      aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel60
  - number: '62'
    text: Wij behouden Ons voor ter uitvoering van deze wet bij algemene maatregel van bestuur nadere regelen te stellen.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel62
  - number: '69'
    text: |-
      Waar in enig wettelijk voorschrift wordt verwezen naar een artikel van de Gezondheidswet 1919, *Stb.* 784, wordt
      deze verwijzing geacht te geschieden naar de overeenkomstige bepalingen van de onderhavige wet.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel69
  - number: 69a.1
    text: |-
      Na de inwerkingtreding van de [Aanpassingswet derde tranche Awb I][ref1] berust het Besluit Staatstoezicht
      Volksgezondheid op [artikel 36, eerste lid, van deze wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008994
      [ref2]: https://wetten.overheid.nl/BWBR0002202#Artikel36
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel69a
    references:
      - id: ref1
        bwb_id: BWBR0008994
      - id: ref2
        bwb_id: BWBR0002202
        artikel: '36'
        hoofdstuk: IV
  - number: 69a.2
    text: |-
      Ten aanzien van de in [artikel 145 van de Wet op de beroepen in de individuele gezondheidszorg][ref1]
      genoemde wetten is deze wet van toepassing zoals deze luidde voor de inwerkingtreding van de
      [Aanpassingswet derde tranche Awb I][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel145
      [ref2]: https://wetten.overheid.nl/BWBR0008994
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel69a
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '145'
      - id: ref2
        bwb_id: BWBR0008994
  - number: '70.1'
    text: Deze wet kan worden aangehaald als Gezondheidswet.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel70
  - number: '70.2'
    text: |-
      Zij treedt in werking op een door Ons te bepalen tijdstip. Wij kunnen het inwerkingtreden van de verschillende
      onderdelen van deze wet op verschillende tijdstippen bepalen.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel70
  - number: '70.3'
    text: De Gezondheidswet 1919, *Stb.* 784, vervalt.
    url: https://wetten.overheid.nl/BWBR0002202/2006-11-17#Artikel70
