  - number: '39.2'
    text: |-
      Onze Minister is bevoegd een last onder dwangsom op te leggen ter zake van een gedraging die in strijd is met het
      eerste lid, onder b.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel39
  - number: '41'
    text: |-
      De inspecteur-generaal dient aan Gedeputeerde Staten of aan Onze Commissaris in een provincie, aan de gemeenteraad,
      aan Burgemeester en Wethouders of aan de burgemeesters, van bericht en raad in daarvoor in aanmerking komende
      zaken, hun werkkring betreffende.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel41
  - number: '43.1'
    text: |-
      Gedeputeerde Staten en Burgemeester en Wethouders zenden aan de inspecteur-generaal en aan de Provinciale Raad,
      binnen wier werkgebied de provincie, respectievelijk de gemeente is gelegen, een afschrift of afdruk van elk der
      verordeningen, besluiten of verslagen, de volksgezondheid in hun provincie, respectievelijk gemeente betreffende,
      en van de daarin gemaakte aanvullingen of wijzigingen.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel43
  - number: '43.2'
    text: |-
      Zij verstrekken aan de inspecteur-generaal alle door hem verlangde inlichtingen over de naleving van wetten en
      verordeningen, de volksgezondheid betreffende.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel43
  - number: '44.1'
    text: |-
      Het Staatstoezicht op de volksgezondheid maakt, na een daartoe strekkend besluit van een bij algemene maatregel
      van bestuur aan te wijzen bestuursorgaan, de bij die maatregel aan te wijzen onder hem berustende informatie
      openbaar inzake het toezicht op of de uitvoering van bij algemene maatregel van bestuur aan te wijzen regelgeving,
      teneinde de naleving van die regelgeving te bevorderen, het publiek inzicht te geven in de wijze waarop dat
      toezicht en die uitvoering worden verricht en wat de resultaten van die verrichtingen zijn. Bij algemene maatregel
      van bestuur kunnen anderen die met het toezicht op de naleving of met de uitvoering van de op grond van de eerste
      volzin aangewezen regelgeving zijn belast, dan wel de organisatie waarvoor zij werkzaam zijn, in plaats van het
      Staatstoezicht worden belast met openbaarmaking als bedoeld in de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44
  - number: '44.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen anderen dan het Staatstoezicht op de volksgezondheid, die belast zijn met
      het toezicht op de naleving of met de uitvoering van de op grond van het eerste lid aangewezen regelgeving worden
      verplicht onder hen berustende informatie ter openbaarmaking te verstrekken aan degene die met de openbaarmaking
      daarvan is belast, bij welke verstrekking de informatie wordt ontdaan van de gegevens, bedoeld in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44
  - number: '44.3'
    text: 'Op grond van het eerste of tweede lid kan voor openbaarmaking worden aangewezen, informatie betreffende:'
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44
  - number: 44.3.a
    text: uitkomsten van controle en onderzoek en de daaraan ten grondslag liggende gegevens;
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44
  - number: 44.3.b
    text: de indeling van ondertoezichtgestelden in nalevingcategorieën;
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44
  - number: 44.3.c
    text: |-
      informatie, die door ondertoezichtgestelden is verstrekt aan het Staatstoezicht op de volksgezondheid dan wel aan
      degene die op grond van het eerste lid, tweede volzin, is aangewezen;
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44
  - number: 44.3.d
    text: |-
      kennisgevingen van het Staatstoezicht op de volksgezondheid of van een ander met toezicht op de naleving belast,
      die op grond van het eerste lid, tweede volzin of tweede lid, is aangewezen, waarin de betrokkene wordt medegedeeld
      dat tot intensivering van het toezicht is overgegaan, dat die intensivering wordt beëindigd, dan wel dat de
      betrokkene met onmiddellijke ingang of op zeer korte termijn verbeteringen in zijn organisatie of werkwijze moet
      aanbrengen;
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44
  - number: 44.3.e
    text: |-
      adviezen aan bestuursorganen over het toezicht of de uitvoering van de op grond van het eerste lid aangewezen
      regelgeving;
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44
  - number: 44.3.f
    text: |-
      informatie van derden, anders dan informatie aangewezen op grond van het tweede lid, voor zover die informatie ten
      grondslag ligt aan het toezichts- en uitvoeringsbeleid betreffende de aangewezen regelgeving;
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44
  - number: 44.3.g
    text: waarschuwingen;
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44
  - number: 44.3.h
    text: 'besluiten, inhoudende:'
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44
  - number: 44.3.h.1
    text: |-
      bevel of de verlenging van een bevel als bedoeld in
      [artikel 27, vierde lid, van de Wet kwaliteit, klachten en geschillen zorg][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel27
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: '27'
  - number: 44.3.h.2
    text: |-
      een aanwijzing als bedoeld in [artikel 27, eerste lid, van de Wet kwaliteit, klachten en geschillen zorg][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel27
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: '27'
  - number: 44.3.h.3
    text: |-
      een bevel als bedoeld in [artikel 115 van de Geneesmiddelenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel115
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '115'
  - number: 44.3.h.4
    text: |-
      een bevel als bedoeld in [artikel 12a van de Wet op de medische hulpmiddelen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002697#Artikel12a
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002697
        artikel: 12a
  - number: 44.3.h.5
    text: |-
      de buitengebruikstelling van technische voortbrengselen als bedoeld in [artikel 30 van de Warenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel30
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '30'
  - number: 44.3.i
    text: |-
      besluiten tot het opleggen van een bestuurlijke sanctie als bedoeld in
      [artikel 5:2 in de Algemene wet bestuursrecht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 44.3.j
    text: |-
      besluiten tot verlening van een vergunning, een erkenning, een goedkeuring, een ontheffing of andere besluiten
      tot begunstiging;
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44
  - number: 44.3.k
    text: de uitvoering, wijziging, beëindiging, schorsing en intrekking van besluiten als bedoeld in dit lid.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44
  - number: '44.4'
    text: |-
      Indien de informatie betrekking heeft op een besluit als bedoeld in het derde lid, onder h of i, wordt bij de
      openbaarmaking aangegeven of een rechtsmiddel tegen dat besluit is of kan worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44
  - number: '44.5'
    text: |-
      Het Staatstoezicht op de volksgezondheid dan wel degene die op grond van het eerste lid, tweede volzin, is
      aangewezen, draagt er zorg voor dat de informatie die op grond van het eerste lid openbaar wordt gemaakt, door hem
      bij de openbaarmaking is ontdaan van:
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44
  - number: 44.5.a
    text: |-
      informatie die bedrijfs- of fabricagegegevens bevat, die door natuurlijke personen of rechtspersonen aan hem
      vertrouwelijk is meegedeeld;
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44
  - number: 44.5.b
    text: persoonsgegevens, voor zover de openbaarmaking daarvan op grond van het zesde lid niet is toegestaan; en
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44
  - number: 44.5.c
    text: |-
      informatie, waarvoor de verstrekker van die informatie uit hoofde van zijn beroep tot geheimhouding is verplicht,
      doch waarvan de met het toezicht belaste ambtenaren van het Staatstoezicht op de volksgezondheid voor de vervulling
      van hun taak kennis hebben genomen.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44
  - number: '44.6'
    text: 'De openbaar te maken informatie mag slechts persoonsgegevens bevatten, voor zover die persoonsgegevens:'
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44
  - number: 44.6.a
    text: |-
      gerelateerd zijn aan het beroeps- of bedrijfsmatig functioneren of handelen van de personen die onderwerp zijn van
      het toezicht of op wie de uitvoering betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44
  - number: 44.6.b
    text: |-
      gerelateerd zijn aan de taakvervulling van de personen die met het toezicht op de naleving of met de uitvoering van
      de aangewezen regelgeving zijn belast; of
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44
  - number: 44.6.c
    text: door de persoon ten aanzien van wie de openbaarmaking plaatsvindt, duidelijk openbaar zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44
  - number: 44a.1
    text: |-
      De openbaarmaking, bedoeld in [artikel 44][ref1], vindt niet plaats binnen twee weken na het tijdstip waarop het
      in artikel 44, eerste lid, bedoelde besluit bekend is gemaakt. Bij dat besluit wordt de betrokkene van de openbaar
      te maken informatie op de hoogte gesteld, voor zover hij van die informatie nog geen kennis heeft kunnen nemen en
      wordt de betrokkene in de gelegenheid gesteld zijn reactie op het besluit kenbaar te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0002202#Artikel44
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0002202
        artikel: '44'
        hoofdstuk: IV_a
  - number: 44a.2
    text: |-
      Indien de betrokkene zijn reactie kenbaar heeft gemaakt, wordt deze door het met openbaarmaking belaste
      bestuursorgaan eveneens openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44a
  - number: 44a.3
    text: |-
      Op de besluiten tot openbaarmaking, bedoeld in het eerste lid, is
      [artikel 4:8 van de Algemene wet bestuursrecht][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 44a.4
    text: |-
      Het derde lid blijft buiten toepassing indien het besluit tot openbaarmaking is gericht op de openbaarmaking van
      informatie over een besluit waarbij een belanghebbende op grond van [artikel 4:8 Algemene wet bestuursrecht][ref1]
      tot het naar voren brengen van een zienswijze in de gelegenheid dient te worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 44a.5
    text: |-
      Indien een verzoek om een voorlopige voorziening als bedoeld in
      [artikel 8:81 van de Algemene wet bestuursrecht][ref1] wordt gedaan tegen een besluit als bedoeld in het eerste
      lid, wordt de werking van het besluit opgeschort totdat de voorzieningenrechter op dat verzoek uitspraak heeft
      gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 44a.6
    text: |-
      De termijn van twee weken, bedoeld in het eerste lid, is niet van toepassing bij de openbaarmaking van informatie
      over:
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44a
  - number: 44a.6.a
    text: 'bevelen als bedoeld in:'
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44a
  - number: 44a.6.a.1
    text: |-
      [artikel 27, vierde lid, van de Wet kwaliteit, klachten en geschillen zorg][ref1], indien dat bevel inhoudt dat aan
      de betrokkene een beperkende maatregel is opgelegd, alsmede informatie over de verlenging van een dergelijk bevel;


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel27
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: '27'
  - number: 44a.6.a.2
    text: |-
      [artikel 115 van de Geneesmiddelenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel115
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '115'
  - number: 44a.6.a.3
    text: |-
      [artikel 12a van de Wet op de medische hulpmiddelen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002697#Artikel12a
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0002697
        artikel: 12a
  - number: 44a.6.b
    text: |-
      aanwijzingen als bedoeld in [artikel 27, eerste lid, van de Wet kwaliteit, klachten en geschillen zorg][ref1],
      indien die aanwijzing inhoudt dat aan de betrokkene een beperkende maatregel is opgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel27
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: '27'
  - number: 44a.6.c
    text: 'lasten op grond van:'
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44a
  - number: 44a.6.c.1
    text: |-
      [artikel 29 van de Wet kwaliteit, klachten en geschillen zorg][ref1], voor zover die dienen tot handhaving van een
      bevel, een verlengd bevel, beide als bedoeld onder a, onderdeel 1°, of een aanwijzing als bedoeld onder b;


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel29
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: '29'
  - number: 44a.6.c.2
    text: |-
      [artikel 114 van de Geneesmiddelenwet][ref1] tot handhaving van een bevel als bedoeld onder a, onderdeel 2°;


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel114
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '114'
  - number: 44a.6.c.3
    text: |-
      [artikel 12 van de Wet op de medische hulpmiddelen][ref1] tot handhaving van een bevel als bedoeld onder a,
      onderdeel 3°;


      [ref1]: https://wetten.overheid.nl/BWBR0002697#Artikel12
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0002697
        artikel: '12'
  - number: 44a.6.c.4
    text: |-
      [artikel 8.5 van de Wet dieren][ref1], voor zover de last dient ter handhaving van een volksgezondheid belang;


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8'
  - number: 44a.6.c.5
    text: |-
      [artikel 32 van de Warenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel32
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '32'
  - number: 44a.6.d
    text: |-
      besluiten als bedoeld in [artikel 30 van de Warenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel30
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '30'
  - number: 44a.6.e
    text: |-
      kennisgevingen van het Staatstoezicht op de volksgezondheid of van degene met toezicht belast, die is aangewezen
      op grond van [artikel 44, eerste of tweede lid][ref1], waarin de betrokkene wordt medegedeeld dat tot intensivering
      van het toezicht is overgegaan dan wel dat de betrokkene met onmiddellijke ingang of op zeer korte termijn
      verbeteringen in zijn organisatie of werkwijze moet aanbrengen.


      [ref1]: https://wetten.overheid.nl/BWBR0002202#Artikel44
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0002202
        artikel: '44'
        hoofdstuk: IV_a
  - number: 44a.7
    text: |-
      Indien openbaarmaking plaatsvindt via het internet worden bij algemene maatregel van bestuur
      regels gesteld over de periode gedurende welke het Staatstoezicht, dan wel degene die op grond van
      [artikel 44, eerste lid, tweede volzin][ref1], is aangewezen, de informatie beschikbaar stelt.


      [ref1]: https://wetten.overheid.nl/BWBR0002202#Artikel44
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0002202
        artikel: '44'
        hoofdstuk: IV_a
  - number: 44a.8
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld voor een goede uitvoering van het
      eerste en tweede lid en [artikel 44, eerste en tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002202#Artikel44
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0002202
        artikel: '44'
        hoofdstuk: IV_a
  - number: 44a.9
    text: |-
      Indien de openbaarmaking, bedoeld in [artikel 44][ref1], in strijd is of zou kunnen komen met het doel van de wet
      in het kader waarvan de openbaarmaking plaatsvindt, blijft openbaarmaking achterwege.


      [ref1]: https://wetten.overheid.nl/BWBR0002202#Artikel44
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0002202
        artikel: '44'
        hoofdstuk: IV_a
  - number: 44b
    text: |-
      De voordracht voor een algemene maatregel van bestuur krachtens de [artikelen 44][ref1] en [44a][ref2] wordt gedaan
      door Onze Minister. De voordracht wordt gedaan mede namens Onze Minister van Economische Zaken, indien de maatregel
      betrekking heeft op het toezicht en de uitvoering van regelgeving waarvoor die Minister tevens verantwoordelijk
      is. Indien de maatregel betrekking heeft op het toezicht en uitvoering van regelgeving waarvoor uitsluitend Onze
      Minister van Economische Zaken verantwoordelijk is, wordt de voordracht gedaan door die Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002202#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0002202#Artikel44a
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44b
    references:
      - id: ref1
        bwb_id: BWBR0002202
        artikel: '44'
        hoofdstuk: IV_a
      - id: ref2
        bwb_id: BWBR0002202
        artikel: 44a
        hoofdstuk: IV_a
  - number: 44c
    text: |-
      Ten aanzien van geschillen over besluiten als bedoeld in [artikel 44, eerste lid][ref1], die strekken tot
      openbaarmaking van een besluit, is bevoegd de rechter die bevoegd is te oordelen ten aanzien van geschillen over
      het te openbaren besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0002202#Artikel44
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44c
    references:
      - id: ref1
        bwb_id: BWBR0002202
        artikel: '44'
        hoofdstuk: IV_a
  - number: 44d
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt bepaald dat het Staatstoezicht op de
      volksgezondheid en anderen die zijn belast met het toezicht op de naleving van de regelgeving, bedoeld in
      [artikel 44, eerste lid][ref1], beleidsregels vaststellen over herinspecties na een negatieve uitkomst van controle
      en onderzoek bij een betrokkene. Bij of krachtens algemene maatregel van bestuur kan worden bepaald wat wordt
      verstaan onder een negatieve uitkomst. Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat de
      beleidsregels aan bij of krachtens de algemene maatregel van bestuur te bepalen voorwaarden moeten voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0002202#Artikel44
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44d
    references:
      - id: ref1
        bwb_id: BWBR0002202
        artikel: '44'
        hoofdstuk: IV_a
  - number: 44e
    text: |-
      De voordracht voor een algemene maatregel van bestuur waarbij voor de eerste maal toepassing wordt gegeven aan
      [artikel 44][ref1] of [44a][ref2], wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der
      Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002202#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0002202#Artikel44a
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel44e
    references:
      - id: ref1
        bwb_id: BWBR0002202
        artikel: '44'
        hoofdstuk: IV_a
      - id: ref2
        bwb_id: BWBR0002202
        artikel: 44a
        hoofdstuk: IV_a
  - number: '45.1'
    text: In elke provincie stellen de Gedeputeerde Staten een Provinciale Raad voor de Volksgezondheid in.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel45
  - number: '45.2'
    text: Zij stellen de plaats van vestiging van de Raad vast.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel45
  - number: '45.3'
    text: |-
      Zij regelen, met inachtneming van de voorschriften van dit hoofdstuk, de samenstelling, de bevoegdheid en de
      werkwijze van de Raad.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel45
  - number: '45.4'
    text: De Provinciale Raad is rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel45
  - number: '47'
    text: 'De taak van de Provinciale Raad omvat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel47
  - number: 47.a
    text: het stimuleren van de gezondheidszorg binnen de provincie;
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel47
  - number: 47.b
    text: |-
      het bevorderen van de coördinatie van alle werkzaamheden, welke op het gebied van de volksgezondheid binnen de
      provincie worden verricht;
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel47
  - number: 47.c
    text: |-
      het uitbrengen van adviezen, onder meer omtrent de verdeling van rijkssubsidies en het bevorderen van het ter
      beschikking stellen van gelden en andere middelen ten behoeve van de gezondheidszorg;
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel47
  - number: 47.d
    text: het samenwerken met andere Provinciale Raden, indien deze samenwerking voor de gezondheidszorg dienstig is;
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel47
  - number: 47.e
    text: |-
      het verrichten van werkzaamheden ter bevordering van een doelmatig stelsel van voorzieningen voor gezondheidszorg
      in de provincie.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel47
  - number: '48'
    text: |-
      De samenstelling van de Provinciale Raad wordt zodanig geregeld, dat daarin in elk geval zitting hebben leden
      afkomstig uit de kringen van:
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel48
  - number: 48.a
    text: gemeentebesturen;
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel48
  - number: 48.b
    text: instellingen voor gezondheidszorg;
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel48
  - number: 48.c
    text: personen werkzaam op het terrein van de gezondheidszorg;
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel48
  - number: 48.d
    text: |-
      personen of organisaties, die de belangen van de gebruikers van voorzieningen voor gezondheidszorg in algemene
      zin behartigen;
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel48
  - number: 48.e
    text: verzekeringsinstellingen op het gebied van de gezondheidszorg;
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel48
  - number: 48.f
    text: instellingen voor maatschappelijke dienstverlening.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel48
  - number: '49'
    text: |-
      De inspecteur-generaal wordt uitgenodigd de vergaderingen van de Raad zomede van de door deze ingestelde commissies
      bij te wonen. Hij heeft in de vergadering een adviserende stem.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel49
  - number: '50.1'
    text: |-
      De Provinciale Raad doet zich bijstaan door commissies van advies en bijstand, welke deskundig zijn op een
      bijzonder gebied van de volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel50
  - number: '50.2'
    text: |-
      De Provinciale Raad kan in zijn gebied één of meer districtscommissies instellen. Ten aanzien van die commissies is
      [artikel 48][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002202#Artikel48
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0002202
        artikel: '48'
        hoofdstuk: V
        paragraaf: '2'
  - number: '50.3'
    text: De Raad regelt de samenstelling, bevoegdheid en werkwijze van deze commissies en benoemt de leden.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel50
  - number: '51.1'
    text: De Provinciale Raad wordt bijgestaan door een bureau.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel51
  - number: '51.2'
    text: De Provinciale Raad draagt zorg, dat medische inbreng in het bureau verzekerd is.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel51
  - number: '52.1'
    text: |-
      De arbeidsvoorwaarden, waaronder de directeur en de andere personen, bij het bureau werkzaam, hun betrekking
      vervullen, zijn gelijk aan die, welke gelden voor het personeel in dienst van de provincie.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel52
  - number: '52.2'
    text: |-
      Gedeputeerde staten kunnen de Provinciale Raad ontheffing verlenen van de toepassing van de op grond van het eerste
      lid toe te passen arbeidsvoorwaarden inzake de salariëring van de directeur en van de andere personen, werkzaam bij
      het bureau.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel52
  - number: '53'
    text: De Provinciale Raad stelt voor de directeur een instructie vast.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel53
  - number: '54.1'
    text: |-
      De Provinciale Raad brengt op verzoek of uit eigen beweging advies uit aan de openbare lichamen en diensten en
      de particuliere rechtspersonen, welke in de Raad zijn vertegenwoordigd, alsmede aan andere openbare organen, met
      uitzondering van het Rijk.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel54
  - number: '54.2'
    text: |-
      Aan particuliere rechtspersonen, andere dan bedoeld in het eerste lid, en aan natuurlijke personen kan de
      Provinciale Raad op hun verzoek, al dan niet tegen vergoeding, advies uitbrengen over onderwerpen, welke naar het
      oordeel van de Raad liggen op het terrein van de volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel54
  - number: '54.3'
    text: |-
      De adviezen van de Raad en zijn commissies worden opgesteld, overeenkomstig het gevoelen van de meerderheid der
      vergadering.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel54
  - number: '54.4'
    text: |-
      In de adviezen wordt van afwijkende gevoelens van de minderheid gemotiveerd mededeling gedaan, en worden, indien de
      leden die deze minderheid vormen zulks wensen, hun namen vermeld.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel54
  - number: '54.5'
    text: |-
      De leden zijn bevoegd minderheidsnota's bij het advies te voegen, indien het daarin uitgesproken gevoelen is
      verdedigd in de vergadering, waarin het uit te brengen advies werd behandeld.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel54
  - number: '56'
    text: |-
      Gedeputeerde Staten en Burgemeester en Wethouders stellen de Provinciale Raad in kennis van alle ontwerpen van
      verordeningen, welke van belang zijn voor de volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel56
  - number: '57'
    text: |-
      Openbare lichamen en diensten, alsmede particuliere rechtspersonen en natuurlijke personen, die in de provincie
      op het gebied van de volksgezondheid werkzaam zijn, zijn desgevraagd gehouden aan de Provinciale Raad alle op de
      volksgezondheid betrekking hebbende inlichtingen te verstrekken, welke de Raad voor de juiste vervulling van zijn
      taak nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel57
  - number: '58'
    text: |-
      De Provinciale Raad is desgevraagd gehouden aan de inspecteur-generaal alle gegevens en inlichtingen te
      verstrekken, welke hij voor de juiste vervulling van zijn taak nodig acht.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel58
  - number: '60'
    text: |-
      De Provinciale Raad zendt jaarlijks voor 1 Juni een verslag van zijn werkzaamheden in het afgelopen kalenderjaar
      aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel60
  - number: '62'
    text: Wij behouden Ons voor ter uitvoering van deze wet bij algemene maatregel van bestuur nadere regelen te stellen.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel62
  - number: '69'
    text: |-
      Waar in enig wettelijk voorschrift wordt verwezen naar een artikel van de Gezondheidswet 1919, *Stb.* 784, wordt
      deze verwijzing geacht te geschieden naar de overeenkomstige bepalingen van de onderhavige wet.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel69
  - number: 69a.1
    text: |-
      Na de inwerkingtreding van de [Aanpassingswet derde tranche Awb I][ref1] berust het Besluit Staatstoezicht
      Volksgezondheid op [artikel 36, eerste lid, van deze wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008994
      [ref2]: https://wetten.overheid.nl/BWBR0002202#Artikel36
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel69a
    references:
      - id: ref1
        bwb_id: BWBR0008994
      - id: ref2
        bwb_id: BWBR0002202
        artikel: '36'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 69a.2
    text: |-
      Ten aanzien van de in [artikel 145 van de Wet op de beroepen in de individuele gezondheidszorg][ref1]
      genoemde wetten is deze wet van toepassing zoals deze luidde voor de inwerkingtreding van de
      [Aanpassingswet derde tranche Awb I][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel145
      [ref2]: https://wetten.overheid.nl/BWBR0008994
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel69a
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '145'
      - id: ref2
        bwb_id: BWBR0008994
  - number: '70.1'
    text: Deze wet kan worden aangehaald als Gezondheidswet.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel70
  - number: '70.2'
    text: |-
      Zij treedt in werking op een door Ons te bepalen tijdstip. Wij kunnen het inwerkingtreden van de verschillende
      onderdelen van deze wet op verschillende tijdstippen bepalen.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel70
  - number: '70.3'
    text: De Gezondheidswet 1919, *Stb.* 784, vervalt.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel70
