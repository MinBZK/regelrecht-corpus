      zijn de [artikelen 5:12][ref1], [5:13][ref2], [5:15][ref3], [5:16][ref4], [5:17][ref5], [5:18][ref6] en
      [5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref7] van overeenkomstige toepassing en is Onze
      Minister bevoegd tot overeenkomstige toepassing van artikel 5:20, derde lid, van de Algemeen wet bestuursrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
