  - number: 39.1.b
    text: |-
      zijn de ambtenaren, voor zover dat voor de vervulling van hun taak noodzakelijk is en in afwijking van
      [artikel 5:20, tweede lid, van de Algemene wet bestuursrecht][ref1], bevoegd tot inzage van de patiëntendossiers.
      Voor zover de betrokken beroepsbeoefenaar uit hoofde van zijn beroep tot geheimhouding van het dossier verplicht
      is, geldt gelijke verplichting voor de betrokken ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel39
