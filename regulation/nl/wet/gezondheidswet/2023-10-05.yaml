$id: gezondheidswet
regulatory_layer: WET
publication_date: '2025-06-04'
valid_from: '2023-10-05'
bwb_id: BWBR0002202
url: https://wetten.overheid.nl/BWBR0002202/2023-10-05
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe wettelijke voorschriften vast te stellen met
    betrekking tot de organisatie van de zorg voor de volksgezondheid;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#ArtikelAanhef
articles:
  - number: '1'
    text: 'Voor de toepassing van deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel1
  - number: 1.a
    text: '"Onze Minister": Onze Minister, belast met de zaken betreffende de volksgezondheid;'
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel1
  - number: 1.b
    text: |-
      "inspecteur-generaal": de inspecteur-generaal, bedoeld in [artikel 37][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002202#Artikel37
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002202
        artikel: '37'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 1.c
    text: '"Provinciale Raad": de Provinciale Raad voor de Volksgezondheid;'
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel1
  - number: 1.d
    text: |-
      "provinciale kruisverenigingen": de provinciale verenigingen met volledige rechtsbevoegdheid, die uitsluitend het
      behartigen of doen behartigen van wijkverpleging en andere sociaal-hygiënische zorg beogen en bij een nationale
      vereniging met gelijke doelstelling zijn aangesloten;
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel1
  - number: 1.e
    text: |-
      "persoonsgegevens": persoonsgegevens als bedoeld in artikel 4, onderdeel 1, van de Algemene verordening
      gegevensbescherming.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel1
  - number: '21.1'
    text: Er is een Gezondheidsraad.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel21
  - number: '21.2'
    text: |-
      De in [artikel 10, eerste volzin, van de Kaderwet adviescolleges][ref1] opgenomen bovengrens voor het aantal leden
      van adviescolleges geldt niet voor de Gezondheidsraad.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel10
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '10'
  - number: '21.3'
    text: |-
      In afwijking van [artikel 10, tweede volzin, van de Kaderwet adviescolleges][ref1] kunnen bij koninklijk besluit
      uit de andere leden ten hoogste twee vice-voorzitters worden benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel10
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '10'
  - number: '21.4'
    text: |-
      Een vice-voorzitter oefent een door de voorzitter in overeenstemming met die vice-voorzitter te bepalen gedeelte
      van de taak van de voorzitter uit.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel21
  - number: '21.5'
    text: |-
      In afwijking van [artikel 11, tweede lid, van de Kaderwet adviescolleges][ref1], kan herbenoeming van de leden
      driemaal plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel11
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '11'
  - number: '21.6'
    text: |-
      In afwijking van [artikel 11, tweede lid, van de Kaderwet adviescolleges][ref1], worden de voorzitter en vice-
      voorzitters, ongeacht de duur van een eerder lidmaatschap, voor ten hoogste vier jaar benoemd als lid, tevens
      voorzitter, onderscheidenlijk vice-voorzitter. Herbenoeming als lid, tevens voorzitter dan wel vice-voorzitter, kan
      twee maal en telkens voor ten hoogste vier jaar plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel11
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '11'
  - number: '22'
    text: |-
      De Gezondheidsraad heeft tot taak Onze Ministers en de beide kamers der Staten-Generaal voor te lichten
      over de stand der wetenschap ten aanzien van vraagstukken op het gebied van de volksgezondheid en het
      gezondheids(zorg)onderzoek door middel van het uitbrengen van rapporten.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel22
  - number: '23'
    text: |-
      Voor de toepassing van de [Kaderwet adviescolleges][ref1] en
      [artikel 3.3, tweede lid, onderdeel e, van de Wet open overheid][ref2] wordt een rapport dat geen advies bevat,
      gelijkgesteld aan een advies.


      [ref1]: https://wetten.overheid.nl/BWBR0008159
      [ref2]: https://wetten.overheid.nl/BWBR0045754#Artikel3
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0008159
      - id: ref2
        bwb_id: BWBR0045754
        artikel: '3'
  - number: '24.1'
    text: |-
      In afwijking van [artikel 16 van de Kaderwet adviescolleges][ref1] kan de voorzitter uit de leden commissies
      instellen.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel16
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '16'
  - number: '24.2'
    text: De voorzitter wijst uit de leden van een commissie een voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel24
  - number: '24.3'
    text: |-
      De voorzitter en de vice-voorzitters zijn bevoegd de vergaderingen van de onderscheidene commissies, waarvan zij
      geen lid zijn, bij te wonen en aan de beraadslagingen deel te nemen.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel24
  - number: '25'
    text: |-
      In afwijking van [artikel 19, tweede lid, van de Kaderwet adviescolleges][ref1] kan de voorzitter op verzoek van
      een commissie andere personen betrekken bij de werkzaamheden van die commissie, voor zover dat voor de vervulling
      van haar taak nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel19
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '19'
  - number: '26'
    text: |-
      In afwijking van de [artikelen 17][ref1], [18][ref2] en [20, eerste lid, van de Kaderwet adviescolleges][ref3]
      is een commissie als bedoeld in [artikel 24][ref4] bevoegd in naam van de Gezondheidsraad door tussenkomst van
      de voorzitter een rapport als bedoeld in [artikel 22][ref5] uit te brengen. Op de beraadslaging en besluitvorming
      binnen een commissie is [artikel 20 van de Kaderwet adviescolleges][ref6] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0008159#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0008159#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0002202#Artikel24
      [ref5]: https://wetten.overheid.nl/BWBR0002202#Artikel22
      [ref6]: https://wetten.overheid.nl/BWBR0008159#Artikel20
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0008159
        artikel: '18'
      - id: ref3
        bwb_id: BWBR0008159
        artikel: '20'
      - id: ref4
        bwb_id: BWBR0002202
        artikel: '24'
        hoofdstuk: III
      - id: ref5
        bwb_id: BWBR0002202
        artikel: '22'
        hoofdstuk: III
      - id: ref6
        bwb_id: BWBR0008159
        artikel: '20'
  - number: 26a
    text: |-
      In afwijking van [artikel 21 van de Kaderwet adviescolleges][ref1] wordt een reglement van orde voor de
      Gezondheidsraad en de commissies door de voorzitter vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel21
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '21'
  - number: '27'
    text: |-
      In afwijking van [artikel 15, tweede lid, van de Kaderwet adviescolleges][ref1] is de secretaris van de
      Gezondheidsraad voor zijn werkzaamheden voor de Gezondheidsraad uitsluitend verantwoording schuldig aan de
      voorzitter.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel15
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '15'
  - number: '36.1'
    text: |-
      Er is een Staatstoezicht op de volksgezondheid, ressorterend onder Onze Minister, dat bestaat uit bij algemene
      maatregel van bestuur aangewezen onderdelen en dat tot taak heeft:
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel36
  - number: 36.1.a
    text: |-
      het verrichten van onderzoek naar de staat van de volksgezondheid en de determinanten daarvan alsmede, waar nodig,
      het aangeven en bevorderen van middelen tot verbetering daarvan;
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel36
  - number: 36.1.b
    text: |-
      het toezicht op de naleving en de opsporing van overtredingen van het bepaalde bij of krachtens wettelijke
      voorschriften op het gebied van de volksgezondheid, een en ander voor zover de ambtenaren van het Staatstoezicht
      daarmede zijn belast bij of krachtens wettelijk voorschrift;
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel36
  - number: 36.1.c
    text: |-
      de uitvoering van bij of krachtens wettelijk voorschrift opgedragen taken en toegekende bevoegdheden op het gebied
      van de volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel36
  - number: '36.2'
    text: |-
      Het Staatstoezicht heeft voorts tot taak het uitbrengen van adviezen en het verstrekken van inlichtingen aan Onze
      Minister op verzoek of uit eigen beweging, met betrekking tot hetgeen het Staatstoezicht op grond van het eerste
      lid ter kennis is gekomen.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel36
  - number: '36.3'
    text: |-
      De in het eerste lid, onder b, genoemde taken strekken zich ook uit tot de voorschriften van een verordening van de
      Raad van de Europese Gemeenschappen op het gebied van de volksgezondheid, voor zover de verordening toezicht op de
      naleving en opsporing van overtredingen daarvan vordert.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel36
  - number: '36.4'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat een of meer onderdelen van het Staatstoezicht ressorteren
      onder een andere Minister dan Onze Minister van Volksgezondheid, Welzijn en Sport. De voordracht voor een
      zodanige algemene maatregel van bestuur wordt gedaan door Onze Minister van Volksgezondheid, Welzijn en Sport, in
      overeenstemming met Onze Minister wie het mede aangaat.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel36
  - number: '36.5'
    text: |-
      Ten behoeve van de organisatie van het Staatstoezicht op de volksgezondheid kunnen bij algemene maatregel van
      bestuur nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel36
  - number: '37'
    text: |-
      Aan het hoofd van elk onderdeel van het Staatstoezicht staat een inspecteur-generaal, die bij besluit van Onze
      Minister wordt aangewezen. De aanwijzing eindigt van rechtswege met ingang van de datum dat de uitoefening van de
      functie van hoofdinspecteur geen onderdeel meer uitmaakt van de werkzaamheden van de betreffende ambtenaar. Hij
      neemt bij de vervulling van zijn taak de aanwijzingen van Onze Minister in acht.
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel37
  - number: '38.1'
    text: |-
      De [artikelen 36, eerste, tweede en vierde lid][ref1], [37][ref2], [44][ref3] en [44a][ref4] zijn van toepassing
      in de openbare lichamen Bonaire, Sint Eustatius en Saba. Bij algemene maatregel van bestuur kan bij de aanwijzing
      van regelgeving als bedoeld in artikel 44, eerste lid, worden bepaald dat informatie betreffende het toezicht
      en de uitvoering van die regelgeving niet op basis van dat lid openbaar zal worden gemaakt, indien de informatie
      betrekking heeft op het toezicht en de uitvoering in die openbare lichamen.


      [ref1]: https://wetten.overheid.nl/BWBR0002202#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0002202#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0002202#Artikel44
      [ref4]: https://wetten.overheid.nl/BWBR0002202#Artikel44a
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel38
    references:
      - id: ref1
