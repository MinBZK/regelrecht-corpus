  - number: '38.3'
    text: |-
      Het Staatstoezicht op de Volksgezondheid oefent in de openbare lichamen Bonaire, Sint Eustatius en Saba zijn taken
      uit met inachtneming van de rechten, plichten en bevoegdheden, genoemd in de [Hoofdstukken 3][ref1], [4][ref2] en
      [5 van de Wet Inspectie Biociden BES][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028563#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0028563#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0028563#Hoofdstuk5
