  - number: '39.1'
    text: |-
      Met betrekking tot de uitvoering van de in [artikel 36, eerste lid, onder a][ref1], bedoelde taak:


      [ref1]: https://wetten.overheid.nl/BWBR0002202#Artikel36
    url: https://wetten.overheid.nl/BWBR0002202/2023-10-05#Artikel39
