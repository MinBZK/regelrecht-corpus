preamble:
  text: |-
    Gelet op artikel 16, eerste lid, van de Algemene Kinderbijslagwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0007872/2001-01-12#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. de AKW: de [Algemene Kinderbijslagwet][ref1];

      b. de Bank: de Sociale Verzekeringsbank;

      c. kinderbijslag: kinderbijslag in de zin van [Hoofdstuk III][ref2] en [Hoofdstuk IV van de AKW][ref3];

      d. een kind: een eigen kind, een aangehuwd kind of een pleegkind als bedoeld in [artikel 7, eerste lid][ref4], of
      [artikel 26, eerste lid, AKW][ref5] waarvoor kinderbijslag is aangevraagd of dat van invloed is op de hoogte van de
      kinderbijslag, en ten opzichte waarvan men niet van de verplichting tot het opgeven van wijzigingen is ontslagen;

      e. de partner: de man of vrouw met wie de aanvrager een huishouden vormt.


      [ref1]: https://wetten.overheid.nl/BWBR0002368
      [ref2]: https://wetten.overheid.nl/BWBR0002368#HoofdstukIII
      [ref3]: https://wetten.overheid.nl/BWBR0002368#HoofdstukIV
      [ref4]: https://wetten.overheid.nl/BWBR0002368#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0002368#Artikel26
    url: https://wetten.overheid.nl/BWBR0007872/2001-01-12#Artikel1
