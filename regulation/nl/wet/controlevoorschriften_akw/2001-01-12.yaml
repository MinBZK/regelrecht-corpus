      - id: ref2
        bwb_id: BWBR0007872
        artikel: '2'
        hoofdstuk: '1'
  - number: '6'
    text: |-
      Op verzoek van de Bank ondergaat het kind een geneeskundig onderzoek om zijn ziekte of gebreken zoals
      bedoeld in [artikel 9, tweede lid, onder a, AKW][ref1], of zijn arbeidsongeschiktheid zoals bedoeld in
      [artikel 7, tweede lid, onder b, AKW][ref2], vast te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel7
    url: https://wetten.overheid.nl/BWBR0007872/2001-01-12#Artikel6
    references:
      - id: ref1
