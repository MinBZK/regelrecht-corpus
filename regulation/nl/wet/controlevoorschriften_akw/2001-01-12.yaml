        artikel: '26'
  - number: '2'
    text: |-
      1 Dit besluit is van toepassing op:

      a. de persoon die kinderbijslag ontvangt of hiervoor in aanmerking wenst te komen;

      b. de partner van degene die kinderbijslag ontvangt of hiervoor in aanmerking wenst te komen, mits de partner zelf
      recht heeft op kinderbijslag, ongeacht of de partner zelf een aanvraag om kinderbijslag heeft ingediend;

      c. de persoon aan wie op grond van [artikel 21 AKW][ref1] kinderbijslag wordt betaald.

      2 Dit besluit is ook van toepassing als de in het eerste lid bedoelde personen of het kind waarvoor kinderbijslag
      is aangevraagd, buiten Nederland wonen.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel21
    url: https://wetten.overheid.nl/BWBR0007872/2001-01-12#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '21'
  - number: '3'
    text: |-
      1 Degene die in aanmerking wil komen voor kinderbijslag dient een schriftelijke aanvraag, ondertekend en gedateerd,
      in. Hij maakt gebruik van een door de Bank ter beschikking gesteld formulier.

      2 Het aanvraagformulier wordt ingediend op een door de Bank aangegeven adres.
    url: https://wetten.overheid.nl/BWBR0007872/2001-01-12#Artikel3
  - number: '5'
    text: |-
      1 Op verzoek van de Bank verstrekt de in [artikel 2, eerste lid][ref1], bedoelde persoon binnen de door de Bank
      gestelde termijn en met gebruikmaking van de door de Bank ter beschikking gestelde formulieren informatie welke
      van belang kan zijn voor het recht op of de hoogte van de kinderbijslag, het geldend maken van het recht op
      kinderbijslag of de uitbetaling van de kinderbijslag en legt terzake op verzoek van de Bank binnen de door de Bank
      gestelde termijn bewijsstukken over.

      2 Op verzoek van de Bank maakt de in [artikel 2, eerste lid][ref2], bedoelde persoon voor het melden van
      wijzigingen gebruik van het wijzigingsformulier.


      [ref1]: https://wetten.overheid.nl/BWBR0007872#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007872#Artikel2
    url: https://wetten.overheid.nl/BWBR0007872/2001-01-12#Artikel5
    references:
      - id: ref1
