        artikel: '9'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '7'
  - number: '7'
    text: |-
      l. Op verzoek van de Bank geeft de in [artikel 2, eerste lid][ref1], bedoelde persoon op een door de Bank
      vastgesteld tijdstip aan de Bank boeken, documenten en andere informatiedragers ter inzage en stelt hij deze voor
      het maken van een kopie ter beschikking stellen.

      2. Op verzoek van de Bank verstrekt de in [artikel 2, eerste lid][ref2], bedoelde persoon aan de Bank terstond een
      geldig identificatiebewijs, zoals bedoeld in de [Wet op de Identificatieplicht][ref3], ter inzage, en stelt hij
      deze voor het maken van een kopie ter beschikking.

      3. Woont de aanvrager of een kind in het buitenland, dan legt de in [artikel 2, eerste lid][ref4], bedoelde persoon
      op verzoek van de Bank op door de Bank vast te stellen tijdstippen een door een bevoegde autoriteit gewaarmerkt
      levensbewijs van degene die buiten Nederland woont over.


      [ref1]: https://wetten.overheid.nl/BWBR0007872#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007872#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006297
      [ref4]: https://wetten.overheid.nl/BWBR0007872#Artikel2
    url: https://wetten.overheid.nl/BWBR0007872/2001-01-12#Artikel7
