        hoofdstuk: '1'
  - number: '8'
    text: |-
      1 De in [artikel 2, eerste lid][ref1], bedoelde persoon verschijnt, indien hij in Nederland woont, na een oproep op
      het kantoor van de Bank en verstrekt de gevraagde gegevens.

      2 De in [artikel 2, eerste lid][ref2], bedoelde persoon verschijnt, indien hij buiten Nederland woont, na een
      oproep van de Bank op een door de Bank te bepalen kantoor en verstrekt de gevraagde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0007872#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007872#Artikel2
    url: https://wetten.overheid.nl/BWBR0007872/2001-01-12#Artikel8
