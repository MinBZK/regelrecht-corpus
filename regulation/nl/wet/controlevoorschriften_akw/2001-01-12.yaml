      - id: ref3
        bwb_id: BWBR0007872
        artikel: '2'
        hoofdstuk: '1'
  - number: '15'
    text: |-
      1 Als het kind onderwijs volgt, zorgt de in [artikel 2, eerste lid][ref1], bedoelde persoon ervoor dat, op verzoek
      van de Bank, een schoolverklaring door de onderwijsinstelling wordt ingevuld en ondertekend. Daarna doet deze
      persoon de verklaring binnen de door de Bank gestelde termijn aan de Bank toekomen.

      2 De Bank doet een verzoek als bedoeld in het eerste lid in beginsel niet indien het kind, dat de zestienjarige
      doch nog niet de achttienjarige leeftijd heeft bereikt, voorkomt in een door de Informatie Beheer Groep aan de Bank
      verstrekt bestand:

        - van kinderen die onderwijs volgen ter zake waarvan voor hen op grond van de [Les- en cursusgeldwet][ref2] les- of
      cursusgeld verschuldigd is;
        - van kinderen die zijn ingeschreven aan een instelling voor hoger onderwijs als bedoeld in
      [artikel 1.2, onder a en b van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3], en die recht
      hebben op studiefinanciering op grond van de Wet op de studiefinanciering.


      [ref1]: https://wetten.overheid.nl/BWBR0007872#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004188
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel1.2
    url: https://wetten.overheid.nl/BWBR0007872/2001-01-12#Artikel15
