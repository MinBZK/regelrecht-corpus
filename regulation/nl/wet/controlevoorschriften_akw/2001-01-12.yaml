        artikel: '1.2'
  - number: '16'
    text: |-
      Als het kind werkloos is, legt de in [artikel 2, eerste lid][ref1], bedoelde persoon op verzoek van de Bank binnen
      de door de Bank gestelde termijn een bewijs van inschrijving bij de Arbeidsvoorzieningsorganisatie aan de Bank
      over.


      [ref1]: https://wetten.overheid.nl/BWBR0007872#Artikel2
    url: https://wetten.overheid.nl/BWBR0007872/2001-01-12#Artikel16
