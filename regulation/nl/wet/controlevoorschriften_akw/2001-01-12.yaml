      - id: ref2
        bwb_id: BWBR0007872
        artikel: '2'
        hoofdstuk: '1'
  - number: '9'
    text: |-
      De in [artikel 2, eerste lid][ref1], bedoelde persoon maakt controle mogelijk door personen die daarmee door de
      Bank zijn belast.


      [ref1]: https://wetten.overheid.nl/BWBR0007872#Artikel2
    url: https://wetten.overheid.nl/BWBR0007872/2001-01-12#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007872
        artikel: '2'
        hoofdstuk: '1'
  - number: '10'
    text: |-
      Als het kind uitwonend wordt of is, stelt de in [artikel 2, eerste lid][ref1], bedoelde persoon de Bank op haar
      verzoek en binnen een door haar te stellen termijn in kennis van het adres van het kind. Op verzoek van de Bank
      legt deze persoon aan de Bank bewijsstukken over van het uitwonend zijn van dit kind en van de reden hiervan.


      [ref1]: https://wetten.overheid.nl/BWBR0007872#Artikel2
    url: https://wetten.overheid.nl/BWBR0007872/2001-01-12#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007872
        artikel: '2'
        hoofdstuk: '1'
  - number: '11'
    text: |-
      Als het kind uitwonend is in verband met het volgen van onderwijs, zorgt de in [artikel 2, eerste lid][ref1],
      bedoelde persoon ervoor dat, op verzoek van de Bank, een schoolverklaring door de onderwijsinstelling wordt
      ingevuld en ondertekend. Daarna doet deze persoon de verklaring binnen de door de Bank gestelde termijn aan de
      Bank toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0007872#Artikel2
    url: https://wetten.overheid.nl/BWBR0007872/2001-01-12#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007872
        artikel: '2'
        hoofdstuk: '1'
  - number: '12'
    text: |-
      Als een kind uitwonend is, zendt de in [artikel 2, eerste lid][ref1], bedoelde persoon binnen een door de Bank
      gestelde termijn een onderhoudsverklaring, naar waarheid en volledig ingevuld, ondertekend en gedateerd, aan
      de Bank. Op verzoek van de Bank doet deze persoon binnen de door de Bank gestelde termijn betaalbewijzen van de
      bijdrage in het onderhoud van het kind aan de Bank toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0007872#Artikel2
    url: https://wetten.overheid.nl/BWBR0007872/2001-01-12#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007872
        artikel: '2'
        hoofdstuk: '1'
  - number: '13'
    text: |-
      Als een kind uitwonend is in verband met ziekte of gebreken, legt de in [artikel 2, eerste lid][ref1], bedoelde
      persoon op verzoek van de Bank binnen een door de Bank te stellen termijn een medische verklaring over.


      [ref1]: https://wetten.overheid.nl/BWBR0007872#Artikel2
    url: https://wetten.overheid.nl/BWBR0007872/2001-01-12#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007872
        artikel: '2'
        hoofdstuk: '1'
  - number: '14'
    text: |-
      1 Als het kind uitwonend wordt of is, stelt de in [artikel 2, eerste lid][ref1], bedoelde persoon de Bank op haar
      verzoek en binnen een door haar te stellen termijn in kennis van het adres van het kind. Op verzoek van de Bank
      legt deze persoon binnen een door de Bank te stellen termijn aan de Bank bewijsstukken over van het uitwonend zijn
      van dit kind.

      2 Op verzoek van de Bank legt de in [artikel 2, eerste lid][ref2], bedoelde persoon de onderhoudsverklaring naar
      waarheid en volledig ingevuld, ondertekend en gedateerd, binnen een door de Bank gestelde termijn over aan de Bank.
      Op verzoek van de Bank doet deze persoon voorts binnen de door de Bank gestelde termijn betaalbewijzen toekomen van
      de bijdrage in het onderhoud van het kind aan de Bank.

      3 Als het kind inkomen heeft, legt de in [artikel 2, eerste lid][ref3], bedoelde persoon binnen een door de Bank te
      stellen termijn bewijsstukken van dit inkomen over.


      [ref1]: https://wetten.overheid.nl/BWBR0007872#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007872#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007872#Artikel2
    url: https://wetten.overheid.nl/BWBR0007872/2001-01-12#Artikel14
