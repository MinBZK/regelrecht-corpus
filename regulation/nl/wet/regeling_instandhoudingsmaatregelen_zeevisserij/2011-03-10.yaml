$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_instandhoudingsmaatregelen_zeevisserij
regulatory_layer: WET
publication_date: '2011-07-22'
valid_from: '2011-03-10'
bwb_id: BWBR0025587
url: https://wetten.overheid.nl/BWBR0025587/2011-03-10
preamble:
  text: |-
    Gelet op Verordening (EG) nr. 1162/2001 van de Commissie van de Europese Gemeenschappen van 14 juni 2001 tot
    vaststelling van maatregelen voor het herstel van het heekbestand in ICES-deelgebieden III, IV, V, VI en VII en
    in ICES-sectoren VIIIa, b, d, e en van daarmee samenhangende bepalingen inzake de controle op de activiteiten van
    vissersvaartuigen (PbEG L 159);

    Gelet op artikel 20 van Verordening (EG) nr. 2371/2002 van de Raad van de Europese Unie van 20 december 2002
    inzake de instandhouding en de duurzame exploitatie van de visbestanden in het kader van het gemeenschappelijk
    visserijbeleid (PbEG L 358);

    Gelet op Verordening (EG) nr. 1342/2008 van de Raad van de Europese Unie van 18 december 2008 tot vaststelling van
    een langetermijnplan voor kabeljauwbestanden en de bevissing van deze bestanden, en tot intrekking van Verordening
    (EG) nr. 423/2004 (PbEU L 348);

    Gelet op Verordening (EG) nr. 43/2009 van de Raad van de Europese Unie van 16 januari 2009 tot vaststelling, voor
    2009, van de vangstmogelijkheden voor sommige visbestanden en groepen visbestanden welke in de wateren van de
    Gemeenschap en, voor vaartuigen van de Gemeenschap, in andere wateren met vangstbeperkingen van toepassing zijn, en
    tot vaststelling van de bij de visserij in acht te nemen voorschriften (PbEU L 22);

    Gelet op de artikelen 3, 4 en 6 van het Reglement zee- en kustvisserij 1977;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel1
  - number: 1.1.a
    text: |-
      *aanverwante vissoort:* vissoort als genoemd in [artikel 11, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel11
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 1.1.b
    text: |-
      *beheersperiode:* periode genoemd in artikel 1, eerste lid, onderdeel b, van de verordening inzake
      vangstmogelijkheden;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel1
  - number: 1.1.c
    text: |-
      *contingent:* in kilogrammen uitgedrukte in het kalenderjaar in een vangstgebied te vangen hoeveelheid van
      een vissoort in levend gewicht, vermeerderd, onderscheidenlijk verminderd, met eventueel op grond van de
      [artikelen 24][ref1] of [25][ref2] voor het kalenderjaar in gebruik gekregen, onderscheidenlijk in gebruik gegeven,
      hoeveelheden van de desbetreffende vissoort, die per vissersvaartuig ten hoogste mag worden aangeland;


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0025587#Artikel25
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0025587
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 1.1.d
    text: |-
      *deelgebied, sector of deelsector:*zeegebied als omschreven in artikel 4 van de verordening inzake
      vangstmogelijkheden;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel1
  - number: 1.1.e
    text: '*gereglementeerd geografisch gebied:* de gebieden, bedoeld in artikel 3 van verordening nr. 1342/2008;'
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel1
  - number: 1.1.f
    text: |-
      *gereglementeerd vistuig:* de vistuigen behorend tot de categorieën, bedoeld in bijlage I van verordening
      nr. 1342/2008;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel1
  - number: 1.1.g
    text: |-
      *groep:* groep als bedoeld in [artikel 13, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel13
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 1.1.h
    text: |-
      *groepscontingent:* groepscontingent als bedoeld in [artikel 13][ref1], vermeerderd, onderscheidenlijk verminderd,
      met eventueel op grond van de [artikelen 24][ref2] en [25][ref3] voor het kalenderjaar in gebruik gekregen,
      onderscheidenlijk in gebruik gegeven, hoeveelheden van de desbetreffende vissoort;


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0025587#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0025587#Artikel25
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0025587
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0025587
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 1.1.i
    text: |-
      *individueel aandeel:* contingent van een vissoort dat een ondernemer heeft ingebracht in een groepscontingent,
      vermeerderd met door hem gekochte en in gebruik gekregen hoeveelheden van die vissoort en verminderd met door hem
      verkochte en in gebruik gegeven hoeveelheden van die vissoort, waarover hij als deelnemer aan een groepscontingent
      in een kalenderjaar kan beschikken;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel1
  - number: 1.1.j
    text: '*inspanningsgroep:* een inspanningsgroep als bedoeld in artikel 2, onderdeel a, van verordening nr. 1342/2008;'
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel1
  - number: 1.1.k
    text: '*minister:* de Minister van Economische Zaken, Landbouw en Innovatie;'
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel1
  - number: 1.1.l
    text: |-
      *ondernemer:* degene te wiens naam het vissersvaartuig in het visserijregister, bedoeld in
      [artikel 4 van het Besluit registratie vissersvaartuigen 1998][ref1], is geregistreerd;


      [ref1]: https://wetten.overheid.nl/BWBR0009353#Artikel4
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009353
        artikel: '4'
  - number: 1.1.m
    text: |-
      *producentenorganisatie:* producentenorganisatie als bedoeld in artikel 5 van Verordening (EG) nr. 104/2000 van de
      Raad van de Europese Unie van 17 december 1999 houdende een gemeenschappelijke ordening der markten in de sector
      visserijproducten en producten van de aquacultuur (PbEG L 17);
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel1
  - number: 1.1.n
    text: |-
      *vangstgebied:* de sectoren of deelgebieden, genoemd in [bijlage 4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025587
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0025587
  - number: 1.1.o
    text: |-
      *verordening inzake vangstmogelijkheden:* Verordening (EU) Nr. 57/2011 van de Raad van de Europese Unie van
      18 januari 2011 tot vaststelling, voor 2011, van de vangstmogelijkheden voor sommige visbestanden en groepen
      visbestanden welke in de EU-wateren en, voor EU-vaartuigen, in andere wateren met vangstbeperkingen van toepassing
      zijn;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel1
  - number: 1.1.p
    text: |-
      *verordening nr. 1224/2009:* Verordening (EG) nr. 1224/2009 van de Raad van de Europese Unie van 20 november 2009
      tot vaststelling van een communautaire controleregeling die de naleving van de regels van het gemeenschappelijk
      visserijbeleid moet garanderen, tot wijziging van Verordeningen (EG) nr. 847/96, (EG) nr. 2371/2002, (EG) nr.
      811/2004, (EG) nr. 768/2005, (EG) nr. 2115/2005, (EG) nr. 2166/2005, (EG) nr. 388/2006, (EG) nr. 509/2007, (EG) nr.
      676/2007, (EG) nr. 1098/2007, (EG) nr. 1300/2008, (EG) nr. 1342/2008 en tot intrekking van Verordeningen (EEG) nr.
      2847/93, (EG) nr. 1627/94 en (EG) nr. 1966/2006 (PbEU L 343);
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel1
  - number: 1.1.q
    text: |-
      *verordening nr. 850/98:* Verordening (EG) nr. 850/98 van de Raad van de Europese Unie van 30 maart 1998 voor de
      instandhouding van de visbestanden via technische maatregelen voor de bescherming van jonge exemplaren van mariene
      organismen (Pb EG L 125);
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel1
  - number: 1.1.r
    text: |-
      *verordening nr. 1162/2001:* Verordening (EG) nr. 1162/2001 van de Commissie van de Europese Gemeenschappen van
      14 juni 2001 tot vaststelling van maatregelen voor het herstel van het heekbestand in ICES-deelgebieden III, IV,
      V, VI en VII en in ICES-sectoren VIIIa, b, d, e en van daarmee samenhangende bepalingen inzake de controle op de
      activiteiten van vissersvaartuigen (PbEG L 159);
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel1
  - number: 1.1.s
    text: |-
      *verordening nr. 494/2002:* Verordening (EG) nr. 494/2002 van de Commissie van de Europese Gemeenschappen van
      19 maart 2002 tot vaststelling van aanvullende technische maatregelen voor het herstel van het heekbestand in de
      ICES-deelgebieden III, IV, V, VI en VII en in de ICES-sectoren VIIIa, b, d, e (PbEG L 77);
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel1
  - number: 1.1.t
    text: |-
      *verordening nr. 2371/2002:* Verordening (EG) nr. 2371/2002 van de Raad van de Europese Unie van 20 december 2002
      inzake de instandhouding en de duurzame exploitatie van de visbestanden in het kader van het gemeenschappelijk
      visserijbeleid (Pb EG L 358);
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel1
  - number: 1.1.u
    text: |-
      verordening nr. 1005/2008: Verordening nr. 1005/2008/EG van de Raad van de Europese Unie van 29 september 2008
      houdende de totstandbrenging van een communautair systeem om illegale, ongemelde en ongereglementeerde visserij te
      voorkomen, tegen te gaan en te beëindigen, tot wijziging van Verordeningen (EEG) nr. 2847/93, (EG) nr. 1936/2001 en
      (EG) nr. 601/2004 en tot intrekking van Verordeningen (EG) nr. 1093/94 en (EG) nr. 1447/1999 (PbEU L 286);
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel1
  - number: 1.1.v
    text: |-
      *verordening nr. 1342/2008:* Verordening (EG) nr. 1342/2008 van de Raad van de Europese Unie van 18 december
      2008 tot vaststelling van een langetermijnplan voor kabeljauwbestanden en de bevissing van deze bestanden, en tot
      intrekking van Verordening (EG) nr. 423/2004 (PbEU L 348);
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel1
  - number: 1.1.w
    text: '*visserij-inspanning:* inspanning zoals berekend in artikel 4 van verordening nr. 1342/2008;'
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel1
  - number: 1.1.x
    text: |-
      vistuig van het type staandwant: kieuwnetten en warrelnetten als bedoeld in bijlage I, tabel 3, van verordening
      (EG) nr. 26/2004 van de Commissie van de Europese Gemeenschappen van 30 december 2003 betreffende het communautaire
      gegevensbestand over de vissersvloot (PbEU L 5).
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van deze regeling vindt het aanlanden van vis plaats op het tijdstip waarop het vissersvaartuig
      direct of indirect verbinding met de wal heeft gekregen.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel1
  - number: 1a.1
    text: |-
      Het is verboden in strijd te handelen met op grond van artikel 108 van verordening nr. 1224/2009 vastgestelde
      maatregelen.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel1a
  - number: 1a.2
    text: |-
      Het is verboden in strijd te handelen met een krachtens artikel 36 van verordening nr. 1005/2008 vastgestelde
      noodmaatregel.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel1a
  - number: '2.1'
    text: |-
      Het is verboden met een vissersvaartuig de visserij uit te oefenen op de vissoorten genoemd in de
      [bijlagen 1][ref1], [2][ref2] en [3][ref3] in de bij die vissoorten genoemde wateren en om deze soorten aan boord
      te hebben en aan te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0025587
      [ref2]: https://wetten.overheid.nl/BWBR0025587
      [ref3]: https://wetten.overheid.nl/BWBR0025587
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0025587
      - id: ref2
        bwb_id: BWBR0025587
      - id: ref3
        bwb_id: BWBR0025587
  - number: '2.2'
    text: 'Van het verbod, bedoeld in het eerste lid, wordt vrijstelling verleend voor zover het betreft de vangst door:'
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel2
  - number: 2.2.a
    text: |-
      de gezamenlijke Nederlandse vissers van de hoeveelheid per vissoort, per deelgebied of sector en voor de periode
      vermeld in [bijlage 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025587
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0025587
  - number: 2.2.b
    text: |-
      de gezamenlijke vissers van de lidstaten van de Europese Unie van de hoeveelheid per vissoort, per deelgebied of
      sector en voor de periode vermeld in [bijlage 3][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0025587
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0025587
  - number: 2.2.c
    text: |-
      vissersvaartuigen die de vlag voeren van, of geregistreerd zijn in een andere staat dan een lidstaat van de
      Europese Unie, in de gebieden vermeld in [bijlage 1][ref1], [2][ref2] en [3][ref3], mits de visserij wordt
      uitgeoefend overeenkomstig artikel 35 van de verordening inzake vangstmogelijkheden.


      [ref1]: https://wetten.overheid.nl/BWBR0025587
      [ref2]: https://wetten.overheid.nl/BWBR0025587
      [ref3]: https://wetten.overheid.nl/BWBR0025587
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0025587
      - id: ref2
        bwb_id: BWBR0025587
      - id: ref3
        bwb_id: BWBR0025587
  - number: '2.3'
    text: |-
      De minister kan de vrijstellingen bedoeld in het tweede lid intrekken dan wel de in [bijlage 2][ref1] en
      [3][ref2] genoemde hoeveelheden wijzigen, voor zover hij dit noodzakelijk acht voor de nakoming van communautaire
      verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0025587
      [ref2]: https://wetten.overheid.nl/BWBR0025587
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0025587
      - id: ref2
        bwb_id: BWBR0025587
  - number: '2.4'
    text: |-
      De minister maakt het tijdstip bekend waarop naar zijn oordeel de in het tweede lid bedoelde hoeveelheden zijn
      opgevist. Dit tijdstip kan per vissoort verschillen.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel2
  - number: '2.5'
    text: |-
      De minister kan wijzigingen aanbrengen in de hoeveelheden, bedoeld in het tweede lid, onderdeel a, voor zover hij
      dit noodzakelijk acht voor de nakoming van communautaire verplichtingen.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel2
  - number: '3.1'
    text: |-
      De door de gezamenlijke Nederlandse vissers aangevoerde hoeveelheden vis worden in mindering gebracht op het
      desbetreffende quotum, respectievelijk het desbetreffende Gemeenschapsaandeel, bedoeld in bijlage 3 en 4, met
      uitzondering van:
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel3
  - number: 3.1.a
    text: |-
      de vangsten, waarvoor ontheffing is verleend van het verbod, bedoeld in [artikel 2, eerste lid][ref1], in verband
      met het uitoefenen van de visserij ten behoeve van wetenschappelijk onderzoek, voor zover deze het in artikel 33,
      zesde lid, van verordening nr. 1224/2009 genoemde percentage van de hoeveelheid, bedoeld in artikel 2, tweede lid,
      onderdeel a, niet te boven gaan, of


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel2
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '2'
        hoofdstuk: '2'
  - number: 3.1.b
    text: |-
      dat deel van de vangsten, waarvoor ontheffing is verleend van het verbod, bedoeld in [artikel 2, eerste lid][ref1],
      in verband met het uitoefenen van de visserij ten behoeve van een pilot in het kader van volledig gedocumenteerde
      visserij als bedoeld in artikel 7 van de verordening inzake vangstmogelijkheden, voor zover wordt voldaan aan het
      tweede lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel2
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '2'
        hoofdstuk: '2'
  - number: '3.2'
    text: |-
      Indien een Nederlandse visser op één dag meerdere malen een hoeveelheid van 50 kg of minder van dezelfde vissoort
      aanvoert, wordt de totale hoeveelheid die de visser op die dag van die vissoort aanvoert in mindering gebracht op:
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel3
  - number: 3.2.a
    text: |-
      het quotum voor de desbetreffende vissoort, bedoeld in [artikel 2, tweede lid, onderdeel a][ref1], en in voorkomend
      geval op zijn contingent, of


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel2
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '2'
        hoofdstuk: '2'
  - number: 3.2.b
    text: |-
      het desbetreffende Gemeenschapsaandeel, bedoeld [artikel 2, tweede lid, onderdeel b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel2
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '2'
        hoofdstuk: '2'
  - number: '4.1'
    text: |-
      De minister kan een deel van de vangstmogelijkheden die voor een kalenderjaar ingevolge artikel 20, eerste lid,
      van [verordening nr. 2371/2002](32002R2371) op de vissoorten en de gebieden, bedoeld in [bijlage 4][ref1], aan
      Nederland zijn toegewezen, reserveren ten behoeve van:


      [ref1]: https://wetten.overheid.nl/BWBR0025587
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0025587
  - number: 4.1.a
    text: |-
      het ruilen van vangstmogelijkheden met andere lidstaten als bedoeld in artikel 20, vijfde lid, van verordening
      nr. 2371/2002;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel4
  - number: 4.1.b
    text: |-
      verlagingen van de aan Nederland toegewezen vangstmogelijkheden, bedoeld in de artikelen 37, tweede lid, 88, eerste
      lid, 105, 106 en 107, eerste lid, van verordening nr. 1224/2009, en
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel4
  - number: 4.1.c
    text: |-
      toewijzing aan een ondernemer, respectievelijk aan een groep dan wel producentenorganisatie, waarvan is
      vastgesteld dat met het vissersvaartuig van de ondernemer of met de vissersvaartuigen van de ondernemers die bij de
      desbetreffende groep dan wel producentenorganisatie zijn aangesloten in een nader te bepalen periode de visserij is
      uitgeoefend overeenkomstig [artikel 5 van de Regeling visvergunning][ref1], de [artikelen 2 tot en met 4][ref2] en
      [10 tot en met 10b van de Regeling technische maatregelen 2000][ref3] en met de [artikelen 10][ref4], [18][ref5] en
      [19][ref6] van onderhavige regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0016244#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011061#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0011061#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0025587#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0025587#Artikel18
      [ref6]: https://wetten.overheid.nl/BWBR0025587#Artikel19
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0016244
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0011061
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0011061
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0025587
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0025587
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref6
        bwb_id: BWBR0025587
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '4.2'
    text: |-
      Voor de vangst van het deel van de vangstmogelijkheden dat is gereserveerd op grond van het eerste lid, onderdelen
      a en b, wordt, na aftrek van de geruilde hoeveelheden en de verlagingen, uiterlijk 1 juni van een kalenderjaar
      vrijstelling verleend.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel4
  - number: '4.3'
    text: |-
      Het deel van de vangstmogelijkheden dat wordt gereserveerd op grond van het eerste lid, onderdeel c, bedraagt
      ten hoogste 10% van de aan Nederland toegewezen vangstmogelijkheden op de vissoorten in de gebieden, bedoeld in
      [artikel 2, tweede lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel2
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '2'
        hoofdstuk: '2'
  - number: '4.4'
    text: |-
      Voor de vangst van het deel van de vangstmogelijkheden dat is gereserveerd op grond van het eerste lid, onderdeel
      c, wordt aan ondernemers of groepen als bedoeld in dat onderdeel uiterlijk 1 juni van een kalenderjaar vrijstelling
      als bedoeld in [artikel 2, tweede lid][ref1], verleend. De minister stelt de criteria vast die worden gehanteerd
      bij de verlening van die vrijstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel2
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '2'
        hoofdstuk: '2'
  - number: '5.1'
    text: |-
      Het is verboden met andere vaartuigen dan vissersvaartuigen de visserij met trawlnetten, staande netten, Deense
      zegennetten of soortgelijke netten uit te oefenen op de vissoorten genoemd in de [bijlage 1 tot en met 3][ref1]
      in de bij die vissoorten genoemde wateren alsmede dergelijke netten aan boord te hebben van een ander vaartuig dan
      een vissersvaartuig.


      [ref1]: https://wetten.overheid.nl/BWBR0025587
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0025587
  - number: '5.2'
    text: |-
      In afwijking van het eerste lid is het toegestaan staande netten aan boord te hebben in het zeegebied en de
      kustwateren, bedoeld in [artikel 1, onderdelen c en d, van de Uitvoeringsregeling visserij][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024539#Artikel1
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0024539
        artikel: '1'
  - number: '5.3'
    text: |-
      Een scheepswerf is, indien die daartoe melding doet aan de minister, vrijgesteld van het in het eerste lid gestelde
      verbod, voor zover het betreft de uitoefening van de visserij door een vaartuig:
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel5
  - number: 5.3.a
    text: |-
      dat in aanbouw is op die scheepswerf en nog niet is afgeleverd en niet is geregistreerd overeenkomstig het bepaalde
      bij en krachtens het [Besluit registratie vissersvaartuigen 1998][ref1] en


      [ref1]: https://wetten.overheid.nl/BWBR0009353
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009353
  - number: 5.3.b
    text: |-
      waarmee in het kader van een proefvaart de visserij wordt uitgeoefend om de werking van bij dat vaartuig behorende
      trawlnetten, Deense zegennetten of soortgelijke netten alsmede staande netten te beproeven.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel5
  - number: '5.4'
    text: |-
      Het is verboden één of meer boomkorren aan boord te hebben van een vissersvaartuig waarmee ingevolge deze regeling
      geen tong of schol in het vangstgebied mag worden opgevist, aan boord gehouden dan wel aangeland.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel5
  - number: '5.5'
    text: |-
      Het vierde lid is niet van toepassing op de visserij met een vissersvaartuig waarvoor een vergunning
      voor de garnalenvisserij als bedoeld in [artikel 36 van de Uitvoeringsregeling visserij][ref1] is
      verleend en evenmin op de visserij met een vissersvaartuig waarmee de spieringvisserij, bedoeld in
      [artikel 4, tweede lid, onderdeel c, van de Regeling technische maatregelen 2000][ref2], wordt uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0024539#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0011061#Artikel4
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0024539
        artikel: '36'
      - id: ref2
        bwb_id: BWBR0011061
        artikel: '4'
  - number: 5a
    text: 'Het is verboden om anders dan met een vissersvaartuig in de visserijzone te vissen met:'
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel5a
  - number: 5a.a
    text: een vistuig van het type staandwant;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel5a
  - number: 5a.b
    text: |-
      een aalfuik als bedoeld in [artikel 1, onderdeel e, van het Reglement voor de binnenvisserij 1985][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009027#Artikel1
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0009027
        artikel: '1'
  - number: 5a.c
    text: |-
      een ankerkuil als bedoeld in [artikel 1, onderdeel f, van het Reglement voor de binnenvisserij 1985][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009027#Artikel1
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0009027
        artikel: '1'
  - number: 5a.d
    text: |-
      een aalkistje als bedoeld in [artikel 1, onderdeel g, van het Reglement voor de binnenvisserij 1985][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009027#Artikel1
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0009027
        artikel: '1'
  - number: 5a.e
    text: |-
      een aalhoekwant als bedoeld in [artikel 1, onderdeel h, van het Reglement voor de binnenvisserij 1985][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0009027#Artikel1
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0009027
        artikel: '1'
  - number: 5a.f
    text: enig ander vast vistuig.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel5a
  - number: '6'
    text: |-
      Het is verboden vis van de soorten die zijn aangewezen krachtens
      [artikel 1, tweede lid, onderdeel a, van de Visserijwet 1963][ref1] te verhandelen indien de vis niet is gevangen
      met een vissersvaartuig.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel1
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '1'
  - number: '7'
    text: |-
      Met ingang van de door de Commissie van de Europese Gemeenschappen overeenkomstig artikel 36, tweede lid, van
      verordening nr. 1224/2009 vastgestelde datum, is het verboden in de visserijzone met een vissersvaartuig dat de
      vlag voert van, of geregistreerd is in een andere lidstaat van de Europese Unie dan Nederland, de visserij uit te
      oefenen op de vissoorten waarvoor voornoemde vaststelling geldt en die soorten aan boord te houden, over te laden
      en in Nederland aan te voeren.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel7
  - number: '8'
    text: |-
      Het is verboden diepgevroren vis in verpakkingen aan te landen, tenzij op de verpakking de in de verpakking
      aanwezige vis per vissoort is vermeld volgens de codes, bedoeld in artikel 1, vierde lid, van verordening (EEG)
      nr. 2807/83 van de Commissie van de Europese Gemeenschappen van 22 september 1983 houdende uitvoeringsbepalingen
      inzake de registratie van gegevens over de visvangst van de Lid-Staten (PbEG L 276).
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel8
  - number: '9.1'
    text: |-
      Het is uitsluitend toegestaan haring die is gevangen in de ICES-deelgebieden III, IV en VIId, aan boord te houden
      of aan te voeren, indien de vangsten voldoen aan artikel 2, van verordening (EG) nr. 1434/98 van de Raad van de
      Europese Unie van 29 juni 1998 tot vaststelling van de voorwaarden waarop haring mag worden aangevoerd voor andere
      industriële doeleinden dan rechtstreekse menselijke consumptie (Pb EG L 191), en zijn gevangen overeenkomstig de
      [artikelen 5][ref1] en [6 van de Regeling technische maatregelen 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011061#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011061#Artikel6
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011061
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0011061
        artikel: '6'
  - number: '9.2'
    text: 'De vangst van:'
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel9
  - number: 9.2.a
    text: |-
      heek wordt slechts dan aan boord gehouden of aangevoerd als de hoeveelheid heek aan boord niet meer bedraagt dan 5%
      van het gewicht van de totale vangst aan boord;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel9
  - number: 9.2.b
    text: |-
      schelvis wordt slechts dan aan boord gehouden of aangevoerd als de hoeveelheid schelvis aan boord niet meer
      bedraagt dan 50% van het gewicht van de totale vangst aan boord.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel9
  - number: '9.3'
    text: Het is verboden met een vissersvaartuig ongesorteerde vangsten van vis aan te landen.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel9
  - number: 9a.1
    text: |-
      Het is verboden in strijd te handelen met de artikelen 4, tweede tot en met vierde lid, 37, aanhef en onderdelen 3
      tot en met 6, 9 en 10, 38, aanhef en onderdelen 1 tot en met 3 en 5 tot en met 7, 39, eerste lid, 40, tweede lid,
      en 48, vierde lid, van verordening nr. 1005/2008.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel9a
  - number: 9a.2
    text: |-
      Indien een vissersvaartuig van een derde land is opgenomen op de lijst van IOO-vaartuigen, bedoeld in artikel 27
      van verordening nr. 1005/2008, is het voor dat vissersvaartuig verboden om zonder door een ambtenaar van de AID
      verleende toestemming als bedoeld in artikel 37, onderdeel 7, van die verordening, de bemanning te vervangen.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel9a
  - number: 9a.3
    text: |-
      Het is een vissersvaartuig dat is opgenomen op de lijst van IOO-vaartuigen, bedoeld in artikel 27 van verordening
      nr. 1005/2008, verboden de Nederlandse vlag te voeren.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel9a
  - number: 9a.4
    text: |-
      Het is een vissersvaartuig dat de Nederlandse vlag voert verboden charterovereenkomsten te sluiten met derde
      landen die zijn opgenomen op de lijst van niet-meewerkende derde landen, bedoeld in artikel 33 van verordening
      nr. 1005/2008.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel9a
  - number: 9a.5
    text: |-
      Waarnemingsverslagen als bedoeld in artikel 48, vierde lid, van verordening nr. 1005/2008, worden ingediend bij
      de minister.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel9a
  - number: '10'
    text: |-
      Het is verboden met een vissersvaartuig op een vissoort als bedoeld in [bijlage 4][ref1] in het voor die vissoort
      aangewezen vangstgebied te vissen dan wel een vissoort uit dat gebied aan te landen of aan boord te houden, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0025587
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0025587
  - number: 10.a
    text: voor dat vissersvaartuig geen recht op een contingent van de desbetreffende vissoort bestaat, en
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel10
  - number: 10.b
    text: |-
      het document, bedoeld in [artikel 12, eerste lid][ref1], niet aan boord aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel12
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 10a
    text: |-
      Indien ontheffing wordt verleend van [artikel 10][ref1], in verband met het uitoefenen van de visserij ten behoeve
      van een pilot in het kader van volledig gedocumenteerde visserij, geschiedt dit in overeenstemming met artikel 7
      van de verordening inzake vangstmogelijkheden.


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel10
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '11.1'
    text: |-
      Een ondernemer heeft voor de duur van het kalenderjaar recht op een contingent van een vissoort als bedoeld in
      [bijlage 4][ref1], indien hij op 31 december van het voorafgaande jaar om 24.00 uur voor zijn vissersvaartuig
      een recht op een contingent van die vissoort had, tot een in [bijlage 4][ref2] vermeld percentage van het in het
      voorafgaande jaar geldende contingent.


      [ref1]: https://wetten.overheid.nl/BWBR0025587
      [ref2]: https://wetten.overheid.nl/BWBR0025587
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0025587
      - id: ref2
        bwb_id: BWBR0025587
  - number: '11.2'
    text: |-
      Een ondernemer heeft slechts recht op een contingent van een aanverwante vissoort, indien hij ook recht heeft op
      een contingent van de volgende bij de desbetreffende aanverwante vissoort genoemde vissoort:
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel11
  - number: 11.2.a
    text: 'bij tong: schol;'
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel11
  - number: 11.2.b
    text: 'bij schol: tong;'
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel11
  - number: 11.2.c
    text: 'bij kabeljauw: wijting;'
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel11
  - number: 11.2.d
    text: 'bij wijting: kabeljauw.'
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel11
  - number: '11.3'
    text: |-
      Bij de vaststelling van een contingent voor het kalenderjaar wordt de hoeveelheid waarmee het contingent voor het
      voorafgaande jaar is verlaagd ingevolge [artikel 20][ref1], niet meegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel20
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '11.4'
    text: |-
      De minister wijzigt het in het eerste lid genoemde percentage voor een vissoort indien ten gevolge van een bindend
      besluit van de Raad van de Europese Unie, van het Europees Parlement en de Raad gezamenlijk of van de Commissie
      van de Europese Gemeenschappen de voor de gezamenlijke Nederlandse vissers beschikbare hoeveelheid van die vissoort
      wordt verlaagd.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel11
  - number: '11.5'
    text: |-
      Tenzij de vrijstelling, bedoeld in [artikel 2, tweede lid][ref1], is ingetrokken, kan de minister ten behoeve van
      een ondernemer die zijn contingent van een vissoort nog niet heeft overschreden, het in het eerste lid genoemde
      percentage wijzigen indien:


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel2
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '2'
        hoofdstuk: '2'
  - number: 11.5.a
    text: de voor de gezamenlijke Nederlandse vissers beschikbare hoeveelheid van die vissoort daartoe ruimte biedt, of
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel11
  - number: 11.5.b
    text: |-
      ten gevolge van een ruil van quota als bedoeld in artikel 20, vijfde lid, van verordening nr. 2371/2002 wijziging
      optreedt in de voor de gezamenlijke Nederlandse vissers beschikbare hoeveelheid van die vissoort.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel11
  - number: '12.1'
    text: |-
      De minister reikt aan de ondernemer, bedoeld in [artikel 11, eerste lid][ref1], een document uit voor het
      contingent van een vissoort voor het kalenderjaar, dat onder meer de volgende gegevens bevat:


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel11
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 12.1.a
    text: |-
      de naam van de ondernemer op wiens naam het vissersvaartuig, waarop het document betrekking heeft, staat
      geregistreerd, en
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel12
  - number: 12.1.b
    text: de lettertekens en het nummer van het vissersvaartuig, bedoeld in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel12
  - number: '12.2'
    text: |-
      Indien na ontbinding van een samenwerkingsverband dat een vissersvaartuig in exploitatie heeft, één of meer van
      de deelnemers van dit samenwerkingsverband de exploitatie van dat vissersvaartuig voortzetten, wordt na melding
      daartoe door alle deelnemers van het samenwerkingsverband de tenaamstelling van het document, bedoeld in het eerste
      lid, gewijzigd.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel12
  - number: '13.1'
    text: |-
      De minister kent een nieuw groepscontingent van een vissoort toe gelijk aan de som van de gezamenlijke ingebrachte
      contingenten van die vissoort voor zover deze niet reeds zijn opgevist en aangeland en verminderd met de
      hoeveelheden, bedoeld in [artikel 20][ref1], en met inachtneming van deze paragraaf, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel20
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 13.1.a
    text: |-
      de ondernemers de voor hun vissersvaartuigen toegekende contingenten van een vissoort voor het kalenderjaar ten
      behoeve van de vorming van een nieuw groepscontingent van die vissoort samenvoegen en
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel13
  - number: 13.1.b
    text: de minister vóór 1 februari van het kalenderjaar het daartoe strekkende verzoek heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel13
  - number: '13.2'
    text: 'Het bepaalde in het eerste lid geldt slechts voor een groep:'
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel13
  - number: 13.2.a
    text: die bestaat uit ten minste 15 ondernemers die lid zijn van één dezelfde producentenorganisatie;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel13
  - number: 13.2.b
    text: die rechtspersoonlijkheid bezit, en
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel13
  - number: 13.2.c
    text: die onder leiding staat van een voorzitter wiens benoeming door het Productschap Vis moet zijn goedgekeurd,
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel13
  - number: '13.3'
    text: 'Een ondernemer kan slechts deelnemen aan een groepscontingent indien:'
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel13
  - number: 13.3.a
    text: |-
      hij alle geldende, en gedurende het kalenderjaar eventueel te verwerven, contingenten van de desbetreffende
      vissoort in de groep dan wel producentenorganisatie inbrengt;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel13
  - number: 13.3.b
    text: |-
      – voorzover het een aanverwante vissoort betreft – hij alle voor hem geldende, en gedurende het kalenderjaar
      eventueel nog te verwerven contingenten van de in [artikel 11, tweede lid][ref1], bij die aanverwante vissoort
      genoemde vissoort in de groep dan wel producentenorganisatie inbrengt, en


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel11
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 13.3.c
    text: |-
      de voor het kalenderjaar voor zijn vissersvaartuig of vissersvaartuigen geldende contingenten van de desbetreffende
      vissoort of – in voorkomend geval – van de desbetreffende aanverwante vissoort als gevolg van de korting
      overeenkomstig [artikel 20][ref1] niet zijn vastgesteld op nul.


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel20
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '13.4'
    text: |-
      De ondernemer die in het kalenderjaar voor zijn vissersvaartuig of vissersvaartuigen recht heeft op contingenten
      van verschillende vissoorten, kan slechts met zijn vissersvaartuig of vissersvaartuigen aan één van de
      groepscontingenten deelnemen.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel13
  - number: '13.5'
    text: |-
      Indien een ondernemer die deelneemt aan een groepscontingent, gedurende het kalenderjaar een contingent van de
      vissoort waarvan contingenten zijn ingebracht in dat groepscontingent, verwerft, wordt dat contingent toegevoegd
      aan dat groepscontingent, tenzij dat groepscontingent of – in voorkomend geval – het groepscontingent van de
      desbetreffende aanverwante vissoort volledig is opgevist.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel13
  - number: '13.6'
    text: |-
      Het verzoek, bedoeld in het eerste lid, wordt door de groep dan wel producentenorganisatie ingediend waarbij de
      volgende bescheiden worden overgelegd:
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel13
  - number: 13.6.a
    text: een visplan;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel13
  - number: 13.6.b
    text: |-
      de statuten van de groep dan wel producentenorganisatie waarin in ieder geval is bepaald dat de leden van de groep
      dan wel producentenorganisatie alle aan te voeren vis via bemiddeling van visafslagen moeten verhandelen en dat
      bij niet-naleving van de door de groep dan wel producentenorganisatie opgestelde bepalingen een sanctiesysteem
      zal worden toegepast en op welke wijze de geïnde boetes door de groep dan wel producentenorganisatie zullen worden
      besteed;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel13
  - number: 13.6.c
    text: het huishoudelijk reglement van de groep dan wel producentenorganisatie, en
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel13
  - number: 13.6.d
    text: |-
      een ondertekende verklaring van alle leden van de groep dan wel producentenorganisatie waaruit blijkt dat zij de
      voor het kalenderjaar toegekende contingenten aan de groep dan wel producentenorganisatie in beheer hebben gegeven.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel13
  - number: '13.7'
    text: 'In het visplan, bedoeld in het zesde lid, onderdeel a, moet ten minste worden aangegeven:'
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel13
  - number: 13.7.a
    text: de spreiding van de aanvoer van het beschikbare groepscontingent;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel13
  - number: 13.7.b
    text: |-
      welke maatregelen genomen zijn of zullen worden genomen om de visserij-inspanning van de deelnemers aan het
      groepscontingent af te stemmen op de desbetreffende groepscontingenten.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel13
  - number: '13.8'
    text: |-
      Een groepscontingent als bedoeld in het eerste lid staat op naam van de groep dan wel producentenorganisatie en
      geldt ten gunste van de vissersvaartuigen waarvan de contingenten aan de groep dan wel producentenorganisatie in
      beheer zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel13
  - number: '13.9'
    text: 'De minister willigt het verzoek, bedoeld in het eerste lid, niet in indien:'
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel13
  - number: 13.9.a
    text: de bescheiden, bedoeld in het zesde lid, niet zijn overgelegd, of
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel13
  - number: 13.9.b
    text: |-
      naar zijn oordeel de naleving van deze regeling en van de afspraken die binnen de groep dan wel
      producentenorganisatie zijn gemaakt, onvoldoende is verzekerd.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel13
  - number: '14'
    text: 'Het groepsbestuur dan wel bestuur van de producentenorganisatie is verplicht om:'
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel14
  - number: 14.a
    text: een visplan op te stellen en toe te zien op de naleving daarvan;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel14
  - number: 14.b
    text: erop toe te zien dat de leden van de groep dan wel producentenorganisatie het groepscontingent niet overschrijden;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel14
  - number: 14.c
    text: de visserij op de desbetreffende vissoort te verbieden indien het groepscontingent is opgevist;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel14
  - number: 14.d
    text: |-
      in geval van overschrijding van het individueel aandeel of van het groepscontingent sanctiemaatregelen toe te
      passen;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel14
  - number: 14.e
    text: huur- en verhuurtransacties te registreren en te administreren;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel14
  - number: 14.f
    text: |-
      een deugdelijke administratie te voeren waaruit te allen tijde de omvang van het groepscontingent blijkt, alsmede
      welke hoeveelheden van de desbetreffende vissoort per vissersvaartuig, per deelgebied of sector zijn aangeland;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel14
  - number: 14.g
    text: |-
      elke wijziging van de statuten en huishoudelijke reglementen van de groep dan wel producentenorganisatie onverwijld
      aan de minister over te leggen;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel14
  - number: 14.h
    text: |-
      de ambtenaren van de Algemene Inspectiedienst van het Ministerie van Economische Zaken, Landbouw en Innovatie te
      allen tijde inzage te verlenen in de gegevens, bedoeld in onderdelen e en f;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel14
  - number: 14.i
    text: op verzoek de minister een kopie te verstrekken van de gegevens, bedoeld in onderdeel h, en
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel14
  - number: 14.j
    text: |-
      de door het groepsbestuur dan wel bestuur van de producentenorganisatie ontvangen gegevens ingevolge
      [artikel 36, eerste lid][ref1], na ontvangst onverwijld door te sturen aan de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel36
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '36'
        hoofdstuk: '4'
  - number: '15.1'
    text: |-
      De ten behoeve van een groepscontingent samengevoegde contingenten van een vissoort kunnen gedurende een
      kalenderjaar niet aan het groepscontingent worden onttrokken.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel15
  - number: '15.2'
    text: |-
      In afwijking van het eerste lid kan een ondernemer één of meer van zijn tot een groepscontingent samengevoegde
      contingenten van een vissoort, of een gedeelte daarvan, aan het groepscontingent onttrekken, mits:
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel15
  - number: 15.2.a
    text: hij daarvan melding doet aan de minister;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel15
  - number: 15.2.b
    text: |-
      de melding, bedoeld in onderdeel a, vergezeld gaat van een schriftelijke verklaring van het groepsbestuur dan wel
      bestuur van de producentenorganisatie dat het desbetreffende groepscontingent beheert, dat het met de onttrekking
      instemt, en
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel15
  - number: 15.2.c
    text: |-
      het groepscontingent van de desbetreffende vissoort of – in voorkomend geval – van de desbetreffende aanverwante
      vissoort, op het moment van ontvangst van de melding nog niet geheel is opgevist.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel15
  - number: '15.3'
    text: |-
      Indien aan de vereisten van het tweede lid is voldaan, worden de te onttrekken contingenten van een vissoort
      verminderd met de vangsten die tot de datum van onttrekking op basis van die contingenten zijn gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel15
  - number: '15.4'
    text: |-
      De onttrekking vindt slechts plaats na kennisgeving van de minister aan de ondernemer en aan de groep dan wel
      producentenorganisatie, dat de melding, bedoeld in het tweede lid, onderdeel a, is ontvangen.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel15
  - number: '16.1'
    text: |-
      De minister kan op verzoek van het desbetreffende groepsbestuur dan wel bestuur van de producentenorganisatie een
      deelnemer aan een groepscontingent van verdere deelname uitsluiten indien de deelnemer de binnen de groep dan wel
      producentenorganisatie geldende regels niet naleeft.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel16
  - number: '16.2'
    text: |-
      De uitgesloten deelnemer, bedoeld in het eerste lid, heeft voor zijn vissersvaartuig recht op een contingent van
      de desbetreffende vissoort en – in voorkomend geval – van de desbetreffende aanverwante vissoort- dat gelijk is aan
      het op grond van de [artikel 11, eerste lid][ref1], geldende contingent van die vissoort, onderscheidenlijk van die
      aanverwante vissoort, verminderd met de tot de datum van uitsluiting met dat vissersvaartuig gerealiseerde vangsten
      of indien deze hoger zijn, verminderd met het evenredig aandeel van de vangsten gerealiseerd door de deelnemers aan
      het groepscontingent.


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel11
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '17'
    text: |-
      Bij de onttrekking van contingenten, bedoeld in [artikel 15, tweede lid][ref1], alsmede bij de toekenning van een
      contingent, bedoeld in [artikel 16, tweede lid][ref2], gaat de minister bij de berekening van het desbetreffende
      contingent uit van de gegevens uit het Visserij Registratie en Informatie Systeem van het Ministerie van
      Economische Zaken, Landbouw en Innovatie, aangevuld met de gegevens uit de laatste door het groepsbestuur
      dan wel bestuur van de producentenorganisatie overgelegde kopie van de administratieve gegevens, bedoeld in
      [artikel 14, onderdeel h][ref3], behoudens tegenbewijs van de belanghebbende bij dat contingent.


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0025587#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0025587#Artikel14
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0025587
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0025587
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '18'
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel18
  - number: 18.a
    text: |-
      met een vissersvaartuig op een grotere hoeveelheid van een vissoort in het voor die vissoort aangewezen
      vangstgebied te vissen, dan wel een grotere hoeveelheid van een vissoort uit dat gebied aan te landen of aan boord
      te houden, dan overeenkomt met het voor dat vissersvaartuig voor dat gebied geldende recht op een contingent van de
      desbetreffende vissoort;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel18
  - number: 18.b
    text: |-
      indien voor meer dan één visservaartuig van één ondernemer contingenten van een vissoort gelden, op de
      desbetreffende vissoort met één van deze vissersvaartuigen in het vangstgebied te vissen, dan wel die vissoort uit
      dat gebied aan te landen of aan boord te houden, indien de som van de voor de vissersvaartuigen van die ondernemer,
      op dat gebied betrekking hebbende, geldende contingenten van die vissoort is opgevist;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel18
  - number: 18.c
    text: |-
      met een vissersvaartuig waarvan het geldende contingent van een vissoort met andere contingenten van die vissoort
      is samengevoegd tot een groepscontingent, in het voor die vissoort aangewezen vangstgebied op de desbetreffende
      vissoort te vissen, dan wel die vissoort uit dat gebied aan te landen of aan boord te houden, indien het
      groepscontingent is opgevist.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel18
  - number: '19.1'
    text: |-
      Het is verboden tong, onderscheidenlijk schol, uit het vangstgebied aan te landen met, of aan boord te houden van,
      een ander vaartuig dan waarmee op die vissoort is gevist.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel19
  - number: '19.2'
    text: 'Het is verboden met een vissersvaartuig:'
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel19
  - number: 19.2.a
    text: |-
      op tong in het vangstgebied te vissen, dan wel tong uit dat gebied aan te landen of aan boord te houden, indien het
      voor dat vissersvaartuig geldende contingent schol is opgevist;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel19
  - number: 19.2.b
    text: |-
      op kabeljauw in het vangstgebied te vissen, dan wel kabeljauw uit dat gebied aan te landen of aan boord te houden,
      indien het voor dat vissersvaartuig geldende contingent wijting is opgevist.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel19
  - number: '19.3'
    text: 'Het is verboden, indien voor meer dan één vissersvaartuig van één ondernemer:'
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel19
  - number: 19.3.a
    text: |-
      contingenten tong en schol gelden, met één van deze vissersvaartuigen op tong in het vangstgebied te vissen, dan
      wel tong uit dat gebied aan te landen of aan boord te houden, indien de som van de voor de vissersvaartuigen van
      die ondernemer geldende contingenten schol is opgevist;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel19
  - number: 19.3.b
    text: |-
      contingenten kabeljauw en wijting gelden, met één van deze vissersvaartuigen op kabeljauw in het vangstgebied
      te vissen, dan wel kabeljauw uit dat gebied aan te landen of aan boord te houden, indien de som van de voor de
      vissersvaartuigen van die ondernemer geldende contingenten wijting is opgevist.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel19
  - number: '19.4'
    text: 'Het is verboden met een vissersvaartuig waarvan:'
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel19
  - number: 19.4.a
    text: |-
      de geldende contingenten tong en schol met andere contingenten van die vissoorten zijn samengevoegd tot een
      groepscontingent, op tong in het vangstgebied te vissen, dan wel tong uit dat gebied aan te landen of aan boord te
      houden, indien het groepscontingent schol is opgevist;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel19
  - number: 19.4.b
    text: |-
      de geldende contingenten kabeljauw en wijting met andere contingenten van die vissoorten zijn samengevoegd tot een
      groepscontingent, op kabeljauw in het vangstgebied te vissen, dan wel kabeljauw uit dat gebied aan te landen of aan
      boord te houden, indien het groepscontingent wijting is opgevist.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel19
  - number: '20.1'
    text: |-
      Indien de ondernemer het voor het kalenderjaar geldende contingent van een vissoort overschrijdt, wordt het voor
      het jaar volgend op het kalenderjaar geldende contingent van die vissoort overeenkomstig gekort.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel20
  - number: '20.2'
    text: |-
      Indien de hoeveelheid van een vissoort waarmee het voor het kalenderjaar geldende contingent van die vissoort wordt
      overschreden, groter is dan de omvang van het voor het jaar volgend op het kalenderjaar geldende contingent van die
      vissoort, wordt het voor de jaren na laatstbedoeld jaar geldende contingent van die vissoort overeenkomstig gekort.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel20
  - number: '20.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing indien de ondernemer in het kalenderjaar de som van de
      voor zijn vissersvaartuigen geldende contingenten overschrijdt.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel20
  - number: '20.4'
    text: |-
      Indien het voor het kalenderjaar gevormde groepscontingent van een vissoort wordt overschreden, wordt de
      hoeveelheid van de desbetreffende vissoort waarmee het groepscontingent is overschreden, op de voor het op het
      kalenderjaar volgende jaar geldende contingenten van die vissoort van die deelnemers in mindering gebracht die in
      het kalenderjaar hun individueel aandeel van die vissoort in dat groepscontingent hebben overschreden.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel20
  - number: '20.5'
    text: |-
      Indien de hoeveelheid van die vissoort waarmee het individueel aandeel in het groepscontingent in het kalenderjaar
      wordt overschreden groter is dan de omvang van het voor op het kalenderjaar volgende jaar geldende contingent van
      die vissoort, wordt het voor de jaren na laatstbedoeld jaar geldende contingent van die vissoort overeenkomstig
      gekort.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel20
  - number: '20.6'
    text: |-
      In afwijking van het eerste tot en met het vijfde lid, kan de minister op verzoek van de ondernemer de
      overschrijding van:
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel20
  - number: 20.6.a
    text: |-
      het contingent schol geheel of gedeeltelijk in mindering brengen op het op grond van
      [artikel 11, eerste lid][ref1], geldende contingent tong waarbij voor elke 5 kilogram schol 1 kilogram tong in
      mindering wordt gebracht, of


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel11
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 20.6.b
    text: |-
      het contingent tong geheel of gedeeltelijk in mindering brengen op het op grond van [artikel 11, eerste lid][ref1],
      geldende contingent schol, waarbij voor elke kilogram tong 5 kilogram schol in mindering wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel11
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '21.1'
    text: |-
      In afwijking van [artikel 11, eerste lid][ref1], kan een ondernemer die meer dan één vissersvaartuig in eigendom
      heeft waarvoor een contingent van dezelfde vissoort geldt, die contingenten op een andere manier voor deze
      vissersvaartuigen verdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel11
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '21.2'
    text: 'De verdeling, bedoeld in het eerste lid, is slechts toegestaan, indien:'
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel21
  - number: 21.2.a
    text: |-
      – voor zover het contingenten van een aanverwante vissoort betreft – voor de betrokken vissersvaartuigen
      zowel een contingent van de desbetreffende aanverwante vissoort als een contingent van de in de
      [artikel 11, tweede lid][ref1], bij die aanverwante vissoort genoemde vissoort geldt;


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel11
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 21.2.b
    text: |-
      de contingenten van de desbetreffende vissoort of – in voorkomend geval – van de desbetreffende aanverwante
      vissoort van de betrokken vissersvaartuigen nog niet volledig zijn opgevist, dan wel niet als gevolg van de korting
      overeenkomstig [artikel 20][ref1] zijn vastgesteld op nul op het moment van ontvangst van het verzoek;


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel20
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 21.2.c
    text: |-
      de vrijstelling, bedoeld in [artikel 2, tweede lid][ref1], nog niet is ingetrokken, en


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel2
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '2'
        hoofdstuk: '2'
  - number: 21.2.d
    text: de ondernemer de minister daarvan melding doet.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel21
  - number: '21.3'
    text: |-
      De andere verdeling wordt slechts toegepast na kennisgeving van de minister aan de ondernemer dat de melding,
      bedoeld in het tweede lid, onderdeel d, is ontvangen.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel21
  - number: '22.1'
    text: |-
      Het recht van een ondernemer op een contingent van een vissoort is geheel of gedeeltelijk overdraagbaar aan één of
      meer ondernemers.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel22
  - number: '22.2'
    text: |-
      Een ondernemer die zijn contingent geheel of gedeeltelijk overdraagt, dient daarvoor een verzoek in bij de
      minister. Dit verzoek gaat vergezeld van het document, bedoeld in [artikel 12][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel12
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '22.3'
    text: |-
      Een geheel contingent van een aanverwante vissoort kan slechts worden overgedragen aan een ondernemer ten behoeve
      van een vissersvaartuig waarvoor reeds een contingent van die vissoort en van de in [artikel 11, tweede lid][ref1],
      bij die vissoort genoemde aanverwante vissoort geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel11
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '22.4'
    text: |-
      Een gedeeltelijk contingent kabeljauw kan slechts worden overgedragen aan een ondernemer ten behoeve van een
      vissersvaartuig waarvoor reeds contingenten kabeljauw en wijting gelden.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel22
  - number: '22.5'
    text: |-
      Een gedeeltelijk contingent van een andere vissoort dan genoemd in het vierde lid kan slechts worden overgedragen
      aan een ondernemer ten behoeve van een vissersvaartuig waarvoor reeds een contingent van dezelfde vissoort geldt.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel22
  - number: '22.6'
    text: |-
      Een geheel contingent van een aanverwante vissoort kan slechts worden overgedragen tegelijkertijd met de gehele
      overdracht van het contingent van de desbetreffende ondernemer van de in [artikel 11, tweede lid][ref1], bij
      de desbetreffende aanverwante vissoort genoemde vissoort, met dien verstande dat de minister op verzoek van die
      ondernemer kan toestaan het verzoek tot overdracht van laatstbedoelde vissoort voor een door hem vast te stellen
      periode aan te houden.


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel11
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '22.7'
    text: |-
      Indien ten behoeve van de ondernemer een pandrecht op het contingent van de desbetreffende vissoort is verleend,
      gaat een melding als bedoeld in het tweede lid vergezeld van een verklaring dat de pandhouder met de overdracht
      instemt.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel22
  - number: '22.8'
    text: |-
      De instemming, bedoeld in het zevende lid, is slechts vereist indien de pandhouder de minister door middel van een
      afschrift van de akte van verpanding in kennis heeft gesteld van het gevestigde pandrecht.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel22
  - number: '22.9'
    text: |-
      De overdracht vindt slechts plaats na kennisgeving van de minister aan de ondernemer aan wie het contingent van
      een vissoort wordt overgedragen, dat voor een door de ondernemer aangewezen vissersvaartuig of vissersvaartuigen
      op zijn naam een contingent van dezelfde vissoort geldt, gelijk aan het eerder voor de ondernemer die overdraagt,
      geldende contingent van die vissoort, en dat voor het lopende jaar dat contingent is verminderd met het eventueel
      reeds opgeviste deel daarvan en de hoeveelheden, bedoeld in [artikel 20][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel20
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '22.10'
    text: |-
      Indien de ondernemer aan wie de kennisgeving, bedoeld in het negende lid, is gericht, meer dan één vissersvaartuig
      heeft aangewezen, geeft hij voor elk van deze vissersvaartuigen aan op welk deel van het desbetreffende contingent
      of van de desbetreffende contingenten de overdracht betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel22
  - number: '22.11'
    text: 'De kennisgeving, bedoeld in het negende lid, vindt voor het lopende jaar slechts plaats:'
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel22
  - number: 22.11.a
    text: |-
      voor zover aan een ondernemer wordt overgedragen ten behoeve van een vissersvaartuig of vissersvaartuigen waarvoor
      een contingent van dezelfde vissoort met – in voorkomend geval – een contingent van de desbetreffende aanverwante
      vissoort geldt, indien het voor dat jaar aan de ondernemer aan wie wordt overgedragen, geldende contingent van die
      vissoort of van die aanverwante vissoort nog niet geheel is opgevist, op het moment van ontvangst van de melding,
      bedoeld in het tweede lid;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel22
  - number: 22.11.b
    text: |-
      voor zover niet aan een ondernemer wordt overdragen ten behoeve van een vissersvaartuig of vissersvaartuigen
      waarvoor het geldende contingent van de desbetreffende vissoort of – in voorkomend geval – van de desbetreffende
      aanverwante vissoort als gevolg van de korting overeenkomstig [artikel 20][ref1] is vastgesteld op nul;


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel20
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 22.11.c
    text: |-
      indien de minister de vrijstelling, bedoeld in [artikel 2, tweede lid][ref1], nog niet heeft ingetrokken, en


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel2
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '2'
        hoofdstuk: '2'
  - number: 22.11.d
    text: |-
      – voor zover het de overdracht van een contingent haring, makreel, tong, blauwe wijting, grote zilvervis of schol
      betreft – aan een ondernemer ten behoeve van een vissersvaartuig waarvoor geen contingent van dezelfde vissoort
      of – in voorkomend geval – van de desbetreffende aanverwante vissoort geldt, indien in het kalenderjaar met dat
      vissersvaartuig geen hoeveelheden van die vissoort of van die aanverwante vissoort zijn aangeland.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel22
  - number: '23.1'
    text: 'De minister kan voor een door hem vast te stellen periode:'
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel23
  - number: 23.1.a
    text: |-
      het contingent van een vissoort ten behoeve van een nader door de ondernemer aan te wijzen vissersvaartuig of
      vissersvaartuigen aanhouden, of
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel23
  - number: 23.1.b
    text: |-
      op verzoek van de ondernemer aan wie het contingent van een vissoort op grond van [artikel 22][ref1] wordt
      overgedragen, de kennisgeving van het contingent, bedoeld in [artikel 22, negende lid][ref2], ten behoeve van een
      door de ondernemer aan te wijzen vissersvaartuig of vissersvaartuigen, aanhouden.


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0025587#Artikel22
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '22'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0025587
        artikel: '22'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '23.2'
    text: |-
      Indien de ondernemer overeenkomstig het eerste lid meer dan één vissersvaartuig heeft aangewezen, geeft hij voor
      elk van deze vaartuigen aan, voor welk deel van het aangehouden contingent hij de toekenning wenst.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel23
  - number: '23.3'
    text: |-
      De toekenning van een contingent van een vissoort, bedoeld in het tweede lid, kan alleen betrekking hebben op
      vissersvaartuigen waarvoor reeds een contingent van dezelfde of – in voorkomend geval – van de desbetreffende
      aanverwante vissoort geldt.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel23
  - number: '23.4'
    text: |-
      De toekenning van een aangehouden contingent van een aanverwante vissoort kan alleen betrekking hebben op
      vissersvaartuigen waarvoor reeds een contingent van die vissoort en van de in [artikel 11, tweede lid][ref1], bij
      die vissoort genoemde aanverwante vissoort geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel11
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '23.5'
    text: |-
      De toekenning van een contingent tijdens de door de minister vastgestelde periode van aanhouding kan slechts
      plaatsvinden:
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel23
  - number: 23.5.a
    text: |-
      voorzover de ondernemer één of meer vissersvaartuigen heeft aangewezen waarvoor een contingent van dezelfde
      vissoort of – in voorkomend geval – van de desbetreffende aanverwante vissoort geldt, en het contingent van die
      vissoort of van die aanverwante vissoort nog niet geheel is opgevist op het moment van ontvangst van het verzoek
      tot toekenning;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel23
  - number: 23.5.b
    text: |-
      indien de minister de vrijstelling, bedoeld in [artikel 2, tweede lid][ref1], nog niet heeft ingetrokken;


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel2
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '2'
        hoofdstuk: '2'
  - number: 23.5.c
    text: |-
      indien het contingent van de desbetreffende vissoort of – in voorkomend geval – van de desbetreffende aanverwante
      vissoort niet als gevolg van de korting overeenkomstig [artikel 20][ref1] is vastgesteld op nul, en


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel20
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 23.5.d
    text: |-
      voorzover het een contingent haring, makreel, tong, blauwe wijting, grote zilvervis of schol betreft – indien de
      ondernemer een vissersvaartuig heeft aangewezen waarvoor geen contingent van de desbetreffende vissoort met – in
      voorkomend geval – een contingent van de desbetreffende aanverwante vissoort geldt en in het kalenderjaar met dat
      vissersvaartuig geen hoeveelheden van die vissoort of van die aanverwante vissoort zijn aangeland.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel23
  - number: '23.6'
    text: |-
      Indien de ondernemer binnen de door de minister vastgestelde periode van aanhouding geen vissersvaartuig of
      vissersvaartuigen heeft aangewezen ten behoeve waarvan een contingent kan worden toegekend, vervalt na afloop van
      deze periode de toekenning van het contingent.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel23
  - number: '24.1'
    text: |-
      Een ondernemer kan toestaan dat het contingent van een vissoort dat voor zijn vissersvaartuig geldt of dat
      ingevolge [artikel 23][ref1] is aangehouden, in het kalenderjaar geheel of gedeeltelijk wordt opgevist, aan boord
      gehouden en aangeland door:


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel23
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 24.1.a
    text: |-
      een met name genoemde ondernemer met één of meer vissersvaartuigen van wie het contingent van dezelfde vissoort of
      – in voorkomend geval – van de desbetreffende aanverwante vissoort op het moment van ontvangst van het verzoek nog
      niet geheel is opgevist, of
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel24
  - number: 24.1.b
    text: |-
      ondernemers die hun contingent van de desbetreffende vissoort hebben ingebracht in een groepscontingent, indien
      het groepscontingent van die vissoort of – in voorkomend geval – van de desbetreffende aanverwante vissoort op het
      moment van ontvangst van het verzoek nog niet geheel is opgevist.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel24
  - number: '24.2'
    text: 'Het bepaalde in het eerste lid is slechts van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel24
  - number: 24.2.a
    text: de ondernemer daarvan melding doet aan de minister;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel24
  - number: 24.2.b
    text: |-
      de toestemming, bedoeld in het eerste lid, geen betrekking heeft op een vissersvaartuig of vissersvaartuigen
      waarvan het toegekende contingent van de desbetreffende vissoort of – in voorkomend geval – van de desbetreffende
      aanverwante vissoort als gevolg van de korting overeenkomstig [artikel 20][ref1] is vastgesteld op nul, en


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel20
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 24.2.c
    text: |-
      de vrijstelling, bedoeld in [artikel 2, tweede lid][ref1], niet is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel2
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '2'
        hoofdstuk: '2'
  - number: '24.3'
    text: |-
      Onverminderd het eerste lid dient op het moment van de melding de periode waarvoor de kennisgeving van de
      toekenning van een contingent van een vissoort is aangehouden, ten minste gelijk te zijn aan de periode waarvoor
      het contingent van de desbetreffende vissoort waarvan de kennisgeving van de toekenning is aangehouden, geheel of
      gedeeltelijk in gebruik wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel24
  - number: '24.4'
    text: |-
      De ingebruikgeving vindt slechts plaats na kennisgeving van de minister aan de ondernemer, bedoeld in de aanhef van
      het eerste lid, dat de melding, bedoeld in het tweede lid, onderdeel a, is ontvangen.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel24
  - number: '25.1'
    text: |-
      Een bestuur van een groep of van een producentenorganisatie dat een groepscontingent van een vissoort beheert,
      kan een gedeelte van dit groepscontingent van die vissoort voegen bij een ander groepscontingent van die vissoort,
      indien het groepscontingent van de desbetreffende vissoort of – in voorkomend geval – van de desbetreffende
      aanverwante vissoort, beheerd door een groepsbestuur aan wie in gebruik wordt gegeven, nog niet geheel is opgevist.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel25
  - number: '25.2'
    text: |-
      Een groepsbestuur dan wel bestuur van de producentenorganisatie kan toestaan dat een gedeelte van het
      groepscontingent van een vissoort in het kalenderjaar wordt opgevist, aan boord gehouden en aangeland door een of
      meer met name genoemde ondernemers met een vissersvaartuig dat niet deelneemt aan een groepscontingent en waarvoor
      het geldende contingent van die vissoort of – in voorkomend geval – van de desbetreffende aanverwante vissoort,
      nog niet geheel is opgevist, indien de toestemming betrekking heeft op de ingebruikgeving aan een ondernemer of
      ondernemers, aan wie de voor het kalenderjaar voor hun vissersvaartuig of vissersvaartuigen geldende contingent van
      de desbetreffende vissoort of – in voorkomend geval – van de desbetreffende aanverwante vissoort niet als gevolg
      van de korting overeenkomstig [artikel 20][ref1] is vastgesteld op nul.


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel20
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '25.3'
    text: |-
      Een groepsbestuur dan wel bestuur van de producentenorganisatie kan toestaan dat een gedeelte van de op grond van
      [artikel 27, tweede lid][ref1], ingebrachte hoeveelheden makreel wordt opgevist, aan boord gehouden en aangeland
      door deelnemers aan een ander groepscontingent.


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel27
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '25.4'
    text: 'Het eerste tot en met derde lid zijn slechts van toepassing, indien:'
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel25
  - number: 25.4.a
    text: |-
      de minister de vrijstelling, bedoeld in [artikel 2, tweede lid][ref1], nog niet heeft ingetrokken, en


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel2
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '2'
        hoofdstuk: '2'
  - number: 25.4.b
    text: |-
      het bestuur van de samenvoeging, bedoeld in het eerste lid, of de toestemming, bedoeld in het tweede of derde lid,
      melding heeft gedaan aan de minister.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel25
  - number: '25.5'
    text: |-
      De ingebruikgeving, bedoeld in het eerste tot en met derde lid, vindt slechts plaats na kennisgeving van de
      minister aan de betreffende groep of producentenorganisatie, dat de overeenkomstige melding, bedoeld in het tweede,
      vierde of zesde lid, is ontvangen.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel25
  - number: '26.1'
    text: 'Het is toegestaan:'
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel26
  - number: 26.1.a
    text: |-
      per kalendermaand niet meer dan de in [bijlage 5][ref1] genoemde hoeveelheden kabeljauw of wijting uit het daarbij
      genoemde vangstgebied aan boord te hebben van of aan te landen met een vissersvaartuig waarvoor geen contingent
      kabeljauw of wijting, maar wel enig ander contingent geldt of waaraan een vergunning voor het vangen van garnalen
      overeenkomstig [artikel 36 van de Uitvoeringsregeling visserij][ref2] is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0025587
      [ref2]: https://wetten.overheid.nl/BWBR0024539#Artikel36
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0025587
      - id: ref2
        bwb_id: BWBR0024539
        artikel: '36'
  - number: 26.1.b
    text: |-
      kabeljauw of wijting uit het vangstgebied aan boord te hebben van of aan te landen met een vissersvaartuig,
      behorende tot de groep van vissersvaartuigen waarvoor geen contingent geldt en waarvoor geen vergunning is
      verleend voor het vangen van garnalen ingevolge [artikel 36 van de Uitvoeringsregeling visserij][ref1], indien
      die vissersvaartuigen in een kalenderjaar gezamenlijk ten hoogste de in [bijlage 5][ref2] genoemde hoeveelheden
      kabeljauw of wijting hebben opgevist.


      [ref1]: https://wetten.overheid.nl/BWBR0024539#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0025587
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0024539
        artikel: '36'
      - id: ref2
        bwb_id: BWBR0025587
  - number: '26.2'
    text: |-
      In afwijking van het eerste lid, is het verboden voor een vissersvaartuig met een brutotonnage van meer dan 1200 BT
      waarmee de pelagische visserij wordt uitgeoefend:
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel26
  - number: 26.2.a
    text: |-
      in het kalenderjaar meer kabeljauw of wijting aan te landen dan de som van de ingevolge het eerste lid voor het
      kalenderjaar voor dat vaartuig toegestane hoeveelheden kabeljauw of wijting, of
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel26
  - number: 26.2.b
    text: |-
      kabeljauw of wijting aan boord te hebben nadat de som van de ingevolge het eerste lid voor het kalenderjaar voor
      dat vaartuig toegestane hoeveelheden kabeljauw of wijting is aangeland.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel26
  - number: '26.3'
    text: |-
      De ondernemer die met een vissersvaartuig waarvoor geen contingenten kabeljauw en wijting gelden, deelneemt aan een
      groepscontingent, wordt geacht de som van de ingevolge het eerste lid voor het kalenderjaar toegestane hoeveelheden
      kabeljauw of wijting in de groep dan wel producentenorganisatie te hebben ingebracht.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel26
  - number: '26.4'
    text: |-
      Het is verboden met vissersvaartuigen die aan een groepscontingent deelnemen en waarvoor geen contingenten
      kabeljauw of wijting gelden, een grotere hoeveelheid kabeljauw of wijting aan boord te houden of aan te landen
      dan de som van de op grond van het derde lid in een groep dan wel producentenorganisatie ingebrachte hoeveelheden
      kabeljauw of wijting.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel26
  - number: '26.5'
    text: |-
      Indien kabeljauw of wijting wordt aangeland in gefileerde of op enige andere wijze bewerkte toestand, met
      uitzondering van gestripte toestand, dan geldt telkens de helft van de in de [bijlage 5][ref1] genoemde
      hoeveelheden kilogram.


      [ref1]: https://wetten.overheid.nl/BWBR0025587
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0025587
  - number: '27.1'
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel27
  - number: 27.1.a
    text: |-
      per kalendermaand meer dan de in [bijlage 5][ref1] genoemde hoeveelheid makreel uit sector IIa en deelgebied
      IV aan boord te hebben of aan te landen met een vissersvaartuig waarvoor geen contingent makreel, doch wel
      enig ander contingent geldt, of waaraan een vergunning is verleend voor het vangen van garnalen overeenkomstig
      [artikel 36 van de Uitvoeringsregeling visserij][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0025587
      [ref2]: https://wetten.overheid.nl/BWBR0024539#Artikel36
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0025587
      - id: ref2
        bwb_id: BWBR0024539
        artikel: '36'
  - number: 27.1.b
    text: |-
      makreel uit de sector of het deelgebied, als bedoeld in onderdeel a, aan boord te hebben van of
      aan te landen met een vissersvaartuig, behorende tot de groep vissersvaartuigen waarvoor geen
      contingent geldt en waarvoor geen vergunning is verleend voor het vangen van garnalen ingevolge
      [artikel 36 van de Uitvoeringsregeling visserij][ref1], indien die vissersvaartuigen in een kalenderjaar reeds
      gezamenlijk de in [bijlage 5][ref2] genoemde hoeveelheid makreel hebben opgevist.


      [ref1]: https://wetten.overheid.nl/BWBR0024539#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0025587
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0024539
        artikel: '36'
      - id: ref2
        bwb_id: BWBR0025587
  - number: '27.2'
    text: |-
      De ondernemer die met een vissersvaartuig waarvoor geen contingent makreel geldt, deelneemt aan een
      groepscontingent, wordt geacht de som van de ingevolge het eerste lid voor het kalenderjaar toegestane hoeveelheden
      makreel in de groep dan wel producentenorganisatie te hebben ingebracht.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel27
  - number: '27.3'
    text: |-
      Het is verboden met vissersvaartuigen die aan een groepscontingent deelnemen en waarvoor geen contingent makreel
      geldt, een grotere hoeveelheid makreel uit sector IIa en deelgebied IV aan boord te houden of aan te landen dan de
      som van de op grond van het tweede lid in een groep dan wel producentenorganisatie ingebrachte hoeveelheid makreel.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel27
  - number: '28'
    text: |-
      Het is voor de vissersvaartuigen waaraan geen contingent horsmakreel voor de EG-wateren van de ICES gebieden IVb,
      IVc en VIId tezamen is toegewezen, toegestaan om per kalenderjaar gezamenlijk de in [bijlage 5][ref1] genoemde
      hoeveelheid horsmakreel uit die gebieden tezamen aan boord te hebben of aan te landen.


      [ref1]: https://wetten.overheid.nl/BWBR0025587
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0025587
  - number: '29'
    text: |-
      Kabeljauw, wijting of makreel, gevangen door vaartuigen als bedoeld in [artikel 27, eerste lid, onderdeel b][ref1],
      of [artikel 28, eerste lid, onderdeel b][ref2], mag slechts dan worden aangeland als de hoeveelheid kabeljauw,
      wijting of makreel niet meer bedraagt dan 20% van het gewicht van de totale vangst aan boord.


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0025587#Artikel28
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0025587
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '30.1'
    text: |-
      Indien twee of meer vissersvaartuigen, waarvoor contingenten haring, betrekking hebbend op hetzelfde
      vangstgebied, kabeljauw en wijting, of makreel gelden, de visserij in span uitoefenen, wordt elk van de betrokken
      vissersvaartuigen geacht een evenredig deel van de totale door deze vissersvaartuigen aangelande hoeveelheid van de
      desbetreffende vissoort of vissoorten te hebben aangeland.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel30
  - number: '30.2'
    text: |-
      Alle tot het span te rekenen vissersvaartuigen als bedoeld in het eerste lid moeten in dezelfde haven aanlanden en
      gezamenlijk uitlossen.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel30
  - number: '31'
    text: |-
      Indien het een contingent haring betreft, kan het bepaalde in de [artikelen 13, eerste lid][ref1],
      [21, eerste lid][ref2], [artikel 22, tweede lid][ref3], voor zover verband houdend met gedeeltelijke overdracht,
      [23, eerste lid][ref4], [24, eerste lid][ref5], en [25, eerste tot en met derde lid][ref6], slechts worden
      toegepast, indien het betrekking heeft op één en hetzelfde vangstgebied.


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0025587#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0025587#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0025587#Artikel23
      [ref5]: https://wetten.overheid.nl/BWBR0025587#Artikel24
      [ref6]: https://wetten.overheid.nl/BWBR0025587#Artikel25
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0025587
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0025587
        artikel: '22'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0025587
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0025587
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref6
        bwb_id: BWBR0025587
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '32.1'
    text: |-
      Een melding als bedoeld in de [artikelen 2, zesde lid][ref1], [5, derde lid][ref2], [12, tweede lid][ref3],
      [15, tweede lid][ref4], [21, tweede lid][ref5], [24, vierde lid][ref6], en [25, tweede lid][ref7], wordt bij de
      minister gedaan op een daartoe bestemd formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025587#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0025587#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0025587#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0025587#Artikel21
      [ref6]: https://wetten.overheid.nl/BWBR0025587#Artikel24
      [ref7]: https://wetten.overheid.nl/BWBR0025587#Artikel25
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0025587
        artikel: '5'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0025587
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0025587
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0025587
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref6
        bwb_id: BWBR0025587
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref7
        bwb_id: BWBR0025587
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '32.2'
    text: |-
      Een verzoek als bedoeld in [artikel 13, eerste lid][ref1], [artikel 16, eerste lid][ref2],
      [artikel 20, zesde lid][ref3], [artikel 22, tweede lid][ref4], en [23, eerste lid][ref5], wordt bij de minister
      ingediend op een daartoe bestemd formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0025587#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0025587#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0025587#Artikel22
      [ref5]: https://wetten.overheid.nl/BWBR0025587#Artikel23
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0025587
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0025587
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0025587
        artikel: '22'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0025587
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '32.3'
    text: |-
      Een melding als bedoeld in de [artikel 21, eerste lid][ref1], alsmede – indien het een contingent haring of makreel
      betreft – een melding als bedoeld in [artikel 23, eerste lid][ref2], wordt vóór 1 december van het kalenderjaar
      ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0025587#Artikel23
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0025587
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '32.4'
    text: |-
      Een melding als bedoeld in [artikel 25, eerste en derde lid][ref1], wordt ingediend voor 15 januari van het
      kalenderjaar volgend op het jaar waar de melding op van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel25
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '32.5'
    text: |-
      Een melding als bedoeld in [artikel 25, tweede lid][ref1], en een verzoek als bedoeld in
      [artikel 20, zesde lid][ref2], alsmede – indien het een contingent van een andere vissoort dan genoemd in het derde
      lid betreft – een melding als bedoeld in [artikel 24, eerste lid][ref3], wordt vóór 1 maart van het kalenderjaar
      ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0025587#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0025587#Artikel24
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0025587
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0025587
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '33.1'
    text: |-
      Het is verboden met een vissersvaartuig met een lengte over alles van ten minste 10 meter de visserij uit te
      oefenen in de gereglementeerde geografische gebieden met gereglementeerde typen vistuig en die typen vistuig aan
      boord te houden.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel33
  - number: '33.2'
    text: 'Het verbod, bedoeld in het eerste lid, is niet van toepassing op een vissersvaartuig, indien:'
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel33
  - number: 33.2.a
    text: |-
      de minister ten aanzien van het vissersvaartuig voor de beheersperiode een speciaal visdocument heeft afgegeven
      als bedoeld in artikel 14, tweede lid, van verordening nr. 1342/2008, ten aanzien van het desbetreffende
      gereglementeerde geografisch gebied en categorie vistuig, voor zover wordt gehandeld in overeenstemming met de aan
      dat speciaal visdocument verbonden voorschriften;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel33
  - number: 33.2.b
    text: |-
      de voor de beheersperiode dan wel, voor zover het de vistuigcategorieën TR1 en TR2 betreft, de voor het
      desbetreffende gedeelte van de beheersperiode toegestane visserij-inspanning per gereglementeerd geografisch gebied
      en vistuigcategorie, vermeld in [bijlage 6][ref1], nog niet is opgebruikt;


      [ref1]: https://wetten.overheid.nl/BWBR0025587
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0025587
  - number: 33.2.c
    text: |-
      het vissersvaartuig behoort tot de vlootsegmenten MFL1 of MFL2 en is geregistreerd in het visserijregister, bedoeld
      in [artikel 4 van het Besluit registratie vissersvaartuigen 1998][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0009353#Artikel4
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0009353
        artikel: '4'
  - number: 33.2.d
    text: |-
      voor zover het de vistuigcategorieën TR1 en TR2 betreft, het vissersvaartuig in tijdvakken van twee aaneengesloten
      weken telkens ten hoogste tien kalenderdagen in een gereglementeerde geografisch gebied aanwezig is.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel33
  - number: '33.3'
    text: |-
      De minister geeft het speciale visdocument, bedoeld in het tweede lid, onderdeel a, slechts af ten aanzien van
      een vaartuig:
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel33
  - number: 33.3.a
    text: |-
      voor een gereglementeerd gebied en een gereglementeerd vistuig, indien dat vaartuig in de kalenderjaren 2006 tot en
      met 2008 heeft gevist in dat gereglementeerde geografische gebied met dat gereglementeerd vistuig;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel33
  - number: 33.3.b
    text: |-
      ten aanzien waarvan op 1 januari 2009 een onomkeerbare investeringsverplichting is aangegaan met het oog op
      visserij in de gereglementeerde geografische gebieden en met de gereglementeerde typen vistuigen;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel33
  - number: 33.3.c
    text: |-
      dat dient ter vervanging van een vissersvaartuig of vissersvaartuigen ten aanzien waarvan het recht op een speciaal
      visdocument als bedoeld in het tweede lid, onderdeel a, bestond op grond van het tweede en derde lid, onderdeel
      a of b, en de houder van dat document afstand heeft gedaan van dat recht ten gunste van de aanvrager van het
      speciale visdocument en het motorvermogen van dat vissersvaartuig niet meer bedraagt dan het motorvermogen van het
      vissersvaartuig of de vissersvaartuigen die worden vervangen, of
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel33
  - number: 33.3.d
    text: |-
      dat dient ter vervanging van een vissersvaartuig dat voldoet aan het bepaalde in onderdeel a en het motorvermogen
      van het vervangende vissersvaartuig niet meer bedraagt dan het motorvermogen van het vissersvaartuig of de
      vissersvaartuigen die worden vervangen.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel33
  - number: '33.4'
    text: |-
      De minister maakt het tijdstip bekend waarop naar zijn oordeel de in het tweede lid, onderdeel b, bedoelde
      hoeveelheden visserij-inspanning voor de beheersperiode of, indien het de vistuigcategorieën TR1 en TR2 betreft,
      het desbetreffende gedeelte van de beheersperiode zijn opgebruikt.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel33
  - number: '33.5'
    text: |-
      De minister kan weigeren een speciaal visdocument af te geven of een speciaal visdocument intrekken indien hij
      dit noodzakelijk acht ter nakoming van communautaire verplichtingen. De minister kan aan een speciaal visdocument
      voorschriften verbinden of de daaraan verbonden voorschriften wijzigen.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel33
  - number: '33.6'
    text: |-
      De minister geeft een speciaal visdocument als bedoeld in het tweede lid, onderdeel a, ten aanzien van de
      gereglementeerde vistuigen BT1 en BT2 slechts af voor een vissersvaartuig waarvoor een recht op contingenten tong
      en schol geldt op grond van [artikel 11, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel11
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '34.1'
    text: |-
      De door de gezamenlijke Nederlandse vissers gebruikte hoeveelheden visserij-inspanning worden in mindering
      gebracht op de hoeveelheden visserij-inspanning, vermeld in [bijlage 6][ref1], waarbij de hoeveelheid per vaartuig
      wordt vastgesteld overeenkomstig artikel 26, tweede tot en met vierde lid, artikel 27, tweede en derde lid, en
      artikel 29, tweede en derde lid, van verordening nr. 1224/2009, met uitzondering van de visserij-inspanning,
      waarvoor ontheffing is verleend van het verbod, bedoeld in artikel 33, eerste lid, in verband met het uitoefenen
      van de visserij ten behoeve van wetenschappelijk onderzoek, voor zover deze het in artikel 33, negende lid,
      van verordening nr. 1224/2009 genoemde percentage van de in het tweede lid, onderdeel b, bedoelde hoeveelheden
      visserij-inspanning voor de beheersperiode of, indien het de vistuigcategorieën TR1 en TR2 betreft, het
      desbetreffende gedeelte van de beheersperiode niet te boven gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0025587
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0025587
  - number: '34.2'
    text: |-
      De minister gebruikt de hoeveelheden visserij-inspanning die ingevolge punt 3 van bijlage IIa van
      de verordening inzake vangstmogelijkheden aan Nederland zijn toegewezen, maar die niet op grond van
      [artikel 2, tweede lid, onderdeel b][ref1], beschikbaar zijn gesteld, ten behoeve van:


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel2
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '2'
        hoofdstuk: '2'
  - number: 34.2.a
    text: |-
      het uitwisselen van visserij-inspanning met andere lidstaten, bedoeld in artikel 16, tweede lid, van verordening
      nr. 1342/2008;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel34
  - number: 34.2.b
    text: |-
      het overdragen visserij-inspanning tussen inspanningsgroepen, bedoeld in artikel 17, eerste lid, van verordening
      nr. 1342/2008, of
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel34
  - number: 34.2.c
    text: |-
      toewijzing aan ondernemers waarvan is vastgesteld dat met het vissersvaartuig van de ondernemer tijdens de
      beheersperiode de visserij is uitgeoefend met gebruikmaking van vistuig dat selectiever is dan de bestaande
      wettelijke verplichtingen.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel34
  - number: '34.3'
    text: |-
      Het deel van de visserij-inspanning dat is gereserveerd op grond van het tweede lid, onderdelen b en c,
      wordt, na aftrek van de overgedragen en toegewezen hoeveelheden, uiterlijk 1 juli van de beheersperiode
      beschikbaar gesteld aan vaartuigen ten behoeve waarvan een speciaal visdocument als bedoeld in
      [artikel 33, tweede lid, onderdeel a][ref1], is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel33
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '33'
        hoofdstuk: '4'
  - number: '34.4'
    text: |-
      De minister stelt de criteria vast die worden gehanteerd voor het toewijzen van de visserij-inspanning als bedoeld
      in het tweede lid, onderdeel c.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel34
  - number: '35.1'
    text: |-
      Het verbod, bedoeld in [artikel 33, eerste lid][ref1], is tijdens de beheersperiode na de bekendmaking, bedoeld
      in [artikel 33, vierde lid][ref2], niet van toepassing op een vissersvaartuig indien de minister ten behoeve van
      dat vaartuig een aanvullende hoeveelheid visserij-inspanning heeft toegekend en de aan dat vaartuig toegekende
      hoeveelheid visserij-inspanning nog niet is opgebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0025587#Artikel33
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '33'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0025587
        artikel: '33'
        hoofdstuk: '4'
  - number: '35.2'
    text: |-
      De minister kent de aanvullende hoeveelheid visserij-inspanning, bedoeld in het eerste lid, slechts toe ten aanzien
      van een vissersvaartuig, indien:
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel35
  - number: 35.2.a
    text: |-
      ten behoeve van dat vaartuig reeds voor die beheersperiode een speciaal visdocument als bedoeld in
      [artikel 33, tweede lid, onderdeel a][ref1], is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel33
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '33'
        hoofdstuk: '4'
  - number: 35.2.b
    text: |-
      met dat vissersvaartuig gedurende de gehele beheersperiode de visserij wordt uitgeoefend overeenkomstig het
      bepaalde in artikel 13, tweede lid, onderdeel a, b of c, van verordening nr. 1342/2008;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel35
  - number: 35.2.c
    text: |-
      de kapitein van het vissersvaartuig of zijn vertegenwoordiger daartoe voor 15 maart een verzoek op een daartoe
      bestemd formulier heeft ingediend bij de minister en
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel35
  - number: 35.2.d
    text: |-
      het vissersvaartuig behoort tot een inspanningsgroep als bedoeld in artikel 13, eerste lid, van verordening
      nr. 1342/2008.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel35
  - number: '35.3'
    text: |-
      De minister kan bij de toekenning van de visserij-inspanning, bedoeld in het eerste lid, aanvullende eisen stellen,
      waaronder medewerking aan frequentere controles in de zin van artikel 13, derde lid, van verordening nr. 1342/2008.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel35
  - number: '35.4'
    text: |-
      De minister kent de aanvullende hoeveelheden visserij-inspanning, bedoeld in het eerste lid, toe ten aanzien van
      de het gereglementeerde gebied en de gereglementeerde categorie vistuig waarvoor het speciale visdocument was
      toegekend voor die beheersperiode en houdt bij de vaststelling van de hoeveelheden visserij-inspanning rekening met
      het bepaalde in artikel 13, vierde lid, van [verordening 1342/2008](32008R1342).
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel35
  - number: '35.5'
    text: |-
      De minister reikt bij de toekenning van een aanvullende hoeveelheid visserij-inspanning voor de beheersperiode aan
      de ondernemer een document voor de desbetreffende visserij-inspanning uit.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel35
  - number: '35.6'
    text: De aan een vissersvaartuig toegekende aanvullende hoeveelheid visserij-inspanning is niet overdraagbaar.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel35
  - number: '35.7'
    text: 'De minister kan de toekenning, bedoeld in het eerste lid, weigeren of intrekken indien:'
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel35
  - number: 35.7.a
    text: niet wordt voldaan aan de voorwaarden van het tweede lid, onderdeel b, en derde lid of
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel35
  - number: 35.7.b
    text: hij dit noodzakelijk acht ter nakoming van communautaire verplichtingen.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel35
  - number: '36.1'
    text: |-
      De kennisgeving, bedoeld in artikel 27, eerste lid, van verordening nr. 1224/2009, wordt gedaan aan de Directeur
      Agroketens en Visserij van het Ministerie van Economische Zaken, Landbouw en Innovatie. Indien een ondernemer
      deelneemt aan een groep of een producentenorganisatie wordt de kennisgeving aan het bestuur van de groep
      onderscheidenlijk aan het bestuur van de producentenorganisatie gedaan.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel36
  - number: '36.2'
    text: 'De kennisgeving bevat ten minste de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel36
  - number: 36.2.a
    text: naam van de ondernemer;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel36
  - number: 36.2.b
    text: lettertekens en het nummer van het vissersvaartuig;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel36
  - number: 36.2.c
    text: de gereglementeerde typen vistuig die zullen worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel36
  - number: 36.2.d
    text: het gereglementeerd gebied waar zal worden gevist.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel36
  - number: '36.3'
    text: |-
      Ingeval de kapitein van een vissersvaartuig of zijn vertegenwoordiger in de beheersperiode hetzelfde
      type vistuig of dezelfde typen vistuigen denkt te gaan gebruiken als het type vistuig dat of de typen
      vistuigen die voor het desbetreffende gereglementeerd geografisch gebied is of zijn vermeld in het in
      [artikel 33, tweede lid, onderdeel a][ref1], bedoelde speciaal visdocument dat betrekking heeft op de daaraan
      voorafgaande beheersperiode, wordt de kennisgeving tot verkrijging van dat visdocument aangemerkt als kennisgeving
      als bedoeld in artikel 27, eerste lid, van verordening nr. 1224/2009.


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel33
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '33'
        hoofdstuk: '4'
  - number: '36.4'
    text: |-
      De gegevens die worden vermeld in het voor de beheersperiode af te geven speciaal visdocument worden gebaseerd op
      de meest recente kennisgeving.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel36
  - number: '36.5'
    text: Het is verboden in strijd te handelen met artikel 27 van verordening nr. 1224/2009.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel36
  - number: '36.6'
    text: |-
      Ter verkrijging van de toestemming, bedoeld in artikel 27, tweede lid, van verordening nr. 1224/2009, meldt de
      kapitein van een vissersvaartuig of zijn vertegenwoordiger het voornemen tot het gebruik van meer dan één soort
      vistuig tijdens de visreis onmiddellijk voorafgaand aan de visreis aan de Directeur Agroketens en Visserij van het
      Ministerie van Economische Zaken, Landbouw en Innovatie.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel36
  - number: '36.7'
    text: |-
      In afwijking van het zesde lid wordt, ingeval de kapitein van een vissersvaartuig of zijn vertegenwoordiger
      de in het zesde lid bedoelde gegevens onmiddellijk voorafgaand aan de visreis op grond van
      [artikel 19a van de Regeling eisen, administratie en registratie inzake uitoefening visserij][ref1] elektronisch
      heeft verstrekt, de ontvangst van die gegevens door de Algemene Inspectiedienst aangemerkt als toestemming als
      bedoeld in artikel 27, tweede lid, van verordening nr. 1224/2009.


      [ref1]: https://wetten.overheid.nl/BWBR0020043#Artikel19a
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0020043
        artikel: 19a
  - number: '36.8'
    text: |-
      Het is verboden te handelen in strijd met artikel 14, vijfde en zesde lid, en artikel 28, eerste lid, van
      verordening nr. 1224/2009.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel36
  - number: '37.1'
    text: |-
      Het verbod, bedoeld in [artikel 33, eerste lid][ref1], tot het aan boord houden van de gereglementeerde typen
      vistuig in de gereglementeerde geografische gebieden, is niet van toepassing in het geval, bedoeld in artikel 29,
      eerste lid, van verordening nr. 1224/2009.


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel33
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '33'
        hoofdstuk: '4'
  - number: '37.2'
    text: |-
      De aanvraag tot verkrijging van een speciaal visdocument als bedoeld in
      [artikel 12, derde lid, van de Regeling technische maatregelen 2000][ref1], wordt beschouwd als een melding als
      bedoeld in artikel 29, eerste lid, van verordening nr. 1224/2009.


      [ref1]: https://wetten.overheid.nl/BWBR0011061#Artikel12
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0011061
        artikel: '12'
  - number: '37.3'
    text: |-
      Een vissersvaartuig mag andere dan met de visserij verband houdende activiteiten ontplooien in de gereglementeerde
      geografische gebieden zonder dat de daarmee gemoeide tijd wordt aangemerkt als een kalenderdag, mits wordt
      voldaan aan artikel 29, tweede lid, van verordening nr. 1224/2009. Een melding als bedoeld in dat onderdeel wordt
      schriftelijk gedaan aan de minister. De melding bevat ten minste de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel37
  - number: 37.3.a
    text: naam van de ondernemer;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel37
  - number: 37.3.b
    text: lettertekens en het nummer van het vissersvaartuig en
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel37
  - number: 37.3.c
    text: de aard, datum van aanvang en duur van de activiteiten.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel37
  - number: '37.4'
    text: |-
      Indien een vissersvaartuig niet heeft kunnen vissen omdat zich een noodsituatie als bedoeld in artikel 29, derde
      lid, van verordening nr. 1224/2009 heeft voorgedaan, wordt het aantal dagen waarop het vissersvaartuig niet
      heeft kunnen vissen, niet in mindering gebracht op de betreffende hoeveelheid visserij-inspanning, bedoeld in
      [bijlage 6][ref1], indien de kapitein van het vissersvaartuig of zijn vertegenwoordiger binnen een maand nadat de
      noodsituatie zich heeft voorgedaan schriftelijk bij de minister daarvan melding heeft gemaakt en de melding wordt
      gestaafd door bewijsstukken.


      [ref1]: https://wetten.overheid.nl/BWBR0025587
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0025587
  - number: 37a.1
    text: |-
      Het is verboden om in de visserijzone met een Nederlands vissersvaartuig met een lengte van over alles van minder
      dan 10 meter de visserij uit te oefenen met een vistuig van het type staandwant.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel37a
  - number: 37a.2
    text: 'Het verbod, bedoeld in het eerste lid, is niet van toepassing op een vissersvaartuig indien:'
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel37a
  - number: 37a.2.a
    text: |-
      in de visvergunning, bedoeld in [artikel 2, eerste lid, van de Regeling visvergunning][ref1] vermeld is dat het de
      vergunninghouder is toegestaan te vissen met een vistuig van het type staandwant; en


      [ref1]: https://wetten.overheid.nl/BWBR0016244#Artikel2
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0016244
        artikel: '2'
  - number: 37a.2.b
    text: |-
      de totale toegestane visserij-inspanning voor de visserij met een vistuig van het type staandwant voor
      vissersvaartuigen met een lengte van over alles van minder dan 10 meter voor het betreffende kalenderjaar nog niet
      is opgebruikt.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel37a
  - number: 37a.3
    text: |-
      De totale toegestane visserij-inspanning voor de visserij met een vistuig van het type staandwant, bedoeld in het
      tweede lid, onderdeel b, bedraagt 188.159 kW dagen per kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel37a
  - number: 37a.4
    text: |-
      Een vermelding van een vistuig van het type staandwant op een visvergunning als bedoeld in het tweede lid,
      onderdeel a, geschiedt slechts ten aanzien van een vaartuig:
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel37a
  - number: 37a.4.a
    text: |-
      waarmee tussen 1 januari 2006 en 24 augustus 2009 blijkens de logboekgegevens gevist is met een vistuig van het
      type staandwant;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel37a
  - number: 37a.4.b
    text: |-
      waarvoor op 24 augustus 2009 een onomkeerbare investeringsverplichting is aangegaan met het oog op de visserij met
      een vistuig van het type staandwant; of
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel37a
  - number: 37a.4.c
    text: 'indien:'
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel37a
  - number: 37a.4.c.i
    text: |-
      het vaartuig dient ter vervanging van een vissersvaartuig of vissersvaartuigen ten aanzien waarvan het recht op een
      vermelding van een vistuig van het type staandwant op de visvergunning, bedoeld in het tweede lid, onderdeel a, al
      bestond op grond van onderdeel a of b van dit lid;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel37a
  - number: 37a.4.c.ii
    text: |-
      de houder van de vergunning met de vermelding van een vistuig van het type staandwant afstand heeft gedaan van het
      recht op de vermelding ten gunste van de aanvrager; en
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel37a
  - number: 37a.4.c.iii
    text: |-
      het motorvermogen van het vissersvaartuig waarvoor de vermelding wordt gevraagd niet meer bedraagt dan het
      motorvermogen van het vissersvaartuig of de vissersvaartuigen die worden vervangen.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel37a
  - number: 37a.5
    text: |-
      De kapitein of diens vertegenwoordiger meldt voordat het vaartuig de haven verlaat aan de Directeur Agroketens en
      Visserij van het Ministerie van Economische Zaken, Landbouw en Innovatie wanneer een vissersvaartuig als bedoeld in
      het tweede lid, buitengaats gaat:
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel37a
  - number: 37a.5.a
    text: zonder gebruik te maken van een vistuig van het type staandwant; of
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel37a
  - number: 37a.5.b
    text: als gedurende de visreis naast een vistuig van het type staandwant ook een ander vistuig zal worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel37a
  - number: 37a.6
    text: |-
      Wanneer een melding als bedoeld in het vijfde lid, onderdeel a, niet is gedaan voor het vaartuig buitengaats gaat,
      wordt de volledige door dat vissersvaartuig gedurende de visreis verrichte inspanning in mindering gebracht op de
      totale toegestane visserij-inspanning voor visserij met een vistuig van het type staandwant.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel37a
  - number: 37a.7
    text: |-
      Indien een vissersvaartuig als bedoeld in het tweede lid, geen melding als bedoeld in het vijfde lid, onderdeel
      a, heeft gedaan, maar niet kon vissen met vistuig van het type staandwant omdat het noodhulp bood aan een ander
      vaartuig of een gewonde persoon voor spoedeisende medische zorg vervoerde, wordt de door dat vissersvaartuig
      verrichte inspanning niet op de totale toegestane visserij-inspanning voor visserij met een vistuig van het type
      staandwant in mindering gebracht.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel37a
  - number: 37a.8
    text: |-
      De Minister maakt in de Staatscourant het tijdstip bekend waarop naar zijn oordeel de in het derde lid bedoelde
      visserij-inspanning voor een kalenderjaar is opgebruikt.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel37a
  - number: 37b
    text: |-
      Het is verboden om in de visserijzone per Nederlands vissersvaartuig op hetzelfde moment meer dan 25 kilometer
      vistuig van het type staandwant in het water te hebben uitstaan of aan boord te hebben, ongeacht de lengte van het
      desbetreffende vissersvaartuig.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel37b
  - number: 37c.1
    text: |-
      Het is verboden te vissen, vanaf de datum, bedoeld in de mededeling, bedoeld in [artikel 2, vierde lid][ref1], of
      [artikel 33, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025587#Artikel33
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel37c
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0025587
        artikel: '33'
        hoofdstuk: '4'
  - number: 37c.2
    text: |-
      Het is verboden vis aan boord te houden, over te laden, te verplaatsen, aan te landen of vangstaangiften
      in te dienen, na de door de minister vast te stellen datum, bedoeld in de mededeling, bedoeld in
      [artikel 2, vierde lid][ref1], of [artikel 33, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025587#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025587#Artikel33
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel37c
    references:
      - id: ref1
        bwb_id: BWBR0025587
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0025587
        artikel: '33'
        hoofdstuk: '4'
  - number: '38.1'
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel38
  - number: 38.1.a
    text: |-
      in de gebieden, genoemd in artikel 6, eerste lid, van verordening nr. 1162/2001 sleepnetten met een maaswijdte van
      70 mm tot 90 mm aan boord te houden of te gebruiken;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel38
  - number: 38.1.b
    text: |-
      in de gebieden, genoemd in artikel 5, eerste lid, van verordening nr. 1162/2001 bodemtrawls als bedoeld in artikel
      6, tweede lid, van die verordening aan boord te houden of te gebruiken;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel38
  - number: '38.2'
    text: 'Het eerste lid is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel38
  - number: 38.2.a
    text: |-
      op vissersvaartuigen waar een waarnemer als bedoeld in artikel 6, eerste en tweede lid, van verordening
      nr. 1162/2001 aan boord is gedurende de gehele visreis, of
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel38
  - number: 38.2.b
    text: |-
      indien met het desbetreffende vissersvaartuig na 20 juni 2001 vijf visreizen in het geval van visserij in gebieden
      als bedoeld in het eerste lid, onderdeel a, en tien visreizen in het geval van visserij in gebieden als bedoeld in
      het eerste lid, onderdeel b, zijn gemaakt met een waarnemer aan boord.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel38
  - number: '38.3'
    text: De in het vorige lid bedoelde waarnemer handelt overeenkomst artikel 6, vierde lid, van verordening nr. 1162/2001.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel38
  - number: '38.4'
    text: |-
      De kapitein van een vissersvaartuig die voornemens is de visserij uit te oefenen in de gebieden, bedoeld in het
      eerste lid, met het in dat artikellid genoemde vistuig:
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel38
  - number: 38.4.a
    text: |-
      meldt zich ten minste twee werkdagen voor aanvang van de visreis bij de Directeur Visserij van het Ministerie van
      Economische Zaken, Landbouw en Innovatie ten behoeve van het toewijzen van een waarnemer als bedoeld in het tweede
      lid, onderdeel a, en
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel38
  - number: 38.4.b
    text: handelt overeenkomstig het bepaalde in artikel 6, vijfde lid, van verordening nr. 1162/2001.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel38
  - number: '39.1'
    text: |-
      Het is verboden heek gemengd of gecombineerd met andere mariene organismen aan boord van een vissersvaartuig te
      houden.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel39
  - number: '39.2'
    text: |-
      De kapitein van een vissersvaartuig die heek aan boord houdt, handelt overeenkomstig het bepaalde in artikel 10,
      tweede lid, en 11 van verordening nr. 1162/2001.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel39
  - number: '40.1'
    text: |-
      Het is verboden in de gebieden, bedoeld in artikel 1 van verordening nr. 1162/2001, heek aan boord te houden van
      een vissersvaartuig waarop een sleepnet met een maaswijdte van 55 tot 99 mm aan boord wordt gehouden of wordt
      gebruikt indien de hoeveelheid heek meer dan 20% uitmaakt van de totale hoeveelheid mariene organismen aan boord,
      tenzij het een vissersvaartuig betreft met een lengte over alles van minder dan 12 meter, dat binnen 24 uur
      terugkeert naar de laatste haven waaruit het is vertrokken.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel40
  - number: '40.2'
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel40
  - number: 40.2.a
    text: |-
      een kuil of een tunnel van een sleepnet als bedoeld in artikel 3, onderdeel a, van verordening nr. 1162/2001 aan
      boord te houden van een vissersvaartuig of te gebruiken in de gebieden, bedoeld in artikel 1 van die verordening,
      met uitzondering van ICES-deelgebieden V en VI;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel40
  - number: 40.2.b
    text: |-
      bodemsleepnetten als bedoeld in artikel 3, onderdelen b, c en d, van verordening nr. 1162/2001 aan boord te houden
      van een vissersvaartuig of te gebruiken in de gebieden, bedoeld in artikel 1 van die verordening;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel40
  - number: 40.2.c
    text: |-
      boomkorren als bedoeld in artikel 4 van verordening nr. 1162/2001 aan boord te houden van een vissersvaartuig of te
      gebruiken in de gebieden, bedoeld in artikel 1 van die verordening;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel40
  - number: 40.2.d
    text: |-
      sleepnetten met een maaswijdte tussen 55 en 99 mm aan boord te houden van een vissersvaartuig of te gebruiken in de
      gebieden, bedoeld in artikel 5, eerste lid, onderdelen a en b, van verordening nr. 1162/2001;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel40
  - number: 40.2.e
    text: |-
      staand vistuig met een maaswijdte van minder dan 120 mm aan boord te houden van een vissersvaartuig of te gebruiken
      in de gebieden, bedoeld in artikel 5, eerste lid, onderdeel a, van verordening nr. 1162/2001;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel40
  - number: 40.2.f
    text: |-
      staand vistuig met een maaswijdte van minder dan 100 mm aan boord te houden van een vissersvaartuig of te gebruiken
      in de gebieden, bedoeld in artikel 5, eerste lid, onderdeel b, van verordening nr. 1162/2001;
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel40
  - number: '40.3'
    text: |-
      Het tweede lid, onderdeel d, is niet van toepassing, indien in overeenstemming met artikel 6 van verordening
      nr. 494/2002 wordt gehandeld.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel40
  - number: '44.1'
    text: |-
      Een ondernemer die een contingent voor een vissoort heeft toegekend gekregen voor 2009 op grond van
      [artikel 10, eerste lid, van de Regeling contingentering zeevis][ref1], wordt voor 2009 geacht een recht op dat
      contingent te hebben als bedoeld in [artikel 11, eerste lid][ref2], van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0008477#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0025587#Artikel11
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0008477
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0025587
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '44.2'
    text: |-
      Een toekenning voor het kalenderjaar van een groepscontingent op grond van
      [artikel 16, eerste lid, van de Regeling contingentering zeevis][ref1], geldt als een toekenning van een
      groepscontingent als bedoeld in [artikel 13, eerste lid][ref2], van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0008477#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0025587#Artikel13
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0008477
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0025587
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '44.3'
    text: |-
      Een besluit tot aanhouding van een contingent, op grond van [artikel 14 de Regeling contingentering zeevis][ref1],
      geldt als een besluit tot aanhouding als bedoeld in [artikel 23][ref2] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0008477#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0025587#Artikel23
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0008477
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0025587
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '44.4'
    text: |-
      Een document, uitgereikt voor een kalenderjaar op grond van
      [artikel 25, eerste lid, van de Regeling contingentering zeevis][ref1], wordt voor dat jaar beschouwd als een
      document als bedoeld in [artikel 12, eerste lid][ref2], van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0008477#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0025587#Artikel12
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0008477
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0025587
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '1'
