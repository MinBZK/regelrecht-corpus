    text: |-
      de [regeling van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 18 juni 2001][ref1],
      TRCJZ/2001/8750.


      [ref1]: https://wetten.overheid.nl/BWBR0012585
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel45
