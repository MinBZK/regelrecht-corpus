    text: 'De volgende regelingen worden ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel45
  - number: 45.a
    text: |-
      [Regeling contingentering zeevis][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008477
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0008477
  - number: 45.b
    text: |-
      [Regeling vangstbeperking][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006379
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0006379
  - number: 45.c
    text: |-
      [Regeling visserij-inspanning herstelplannen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016340
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0016340
