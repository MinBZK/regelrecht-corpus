  - number: '46.1'
    text: Deze regeling treedt in werking met ingang van 1 juli 2009.
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel46
  - number: '46.2'
    text: 'Deze regeling wordt aangehaald als: Regeling instandhoudingsmaatregelen zeevisserij.'
    url: https://wetten.overheid.nl/BWBR0025587/2011-03-10#Artikel46
