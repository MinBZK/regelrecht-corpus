preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is regels te stellen met betrekking tot het registreren
    van uiteindelijk belanghebbenden van trusts en soortgelijke juridische constructies ter implementatie van Richtlijn
    (EU) 2015/849 van het Europees Parlement en de Raad van 20 mei 2015 inzake de voorkoming van het gebruik van het
    financiële stelsel voor het witwassen van geld of terrorismefinanciering (PbEU 2015, L 141), zoals gewijzigd bij
    Richtlijn (EU) 2018/843 tot wijziging van Richtlijn (EU) 2015/849 inzake de voorkoming van het gebruik van het
    financiële stelsel voor het witwassen van geld of terrorismefinanciering (PbEU 2018, L 156/43);

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *bevoegde autoriteit:* bevoegde autoriteit
      als bedoeld in [artikel 7, tweede lid][ref1];
        - *Financiële inlichtingen eenheid:* Financiële inlichtingen eenheid, bedoeld in
      [artikel 12, eerste lid, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref2];
        - *beheerder:* Kamer van Koophandel als bedoeld in [artikel 2 van de Wet op de Kamer van Koophandel][ref3];
        - *basisregistratie:* verzameling gegevens waarvan bij wet is bepaald dat deze een basisregistratie vormt;
        - *register:* het register bedoeld in artikel 4;
        - *trust:* trust als bedoeld in het op 1 juli 1985 te ’s-Gravenhage tot stand gekomen Verdrag inzake het recht dat
      toepasselijk is op trusts en inzake de erkenning van trusts (Trb. 1985, 141);
        - *trustee:* trustee als bedoeld in het op 1 juli 1985 te ’s-Gravenhage tot stand gekomen Verdrag inzake het recht
      dat toepasselijk is op trusts en inzake de erkenning van trusts (Trb. 1985, 141);
        - *uiteindelijk belanghebbende:* uiteindelijk belanghebbende als bedoeld in
      [artikel 10a, eerste lid, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref4];
        - *vierde anti-witwasrichtlijn:* [richtlijn 2015/849](onbekend) van het Europees Parlement en de Raad van
      20 mei 2015 inzake de voorkoming van het gebruik van het financiële stelsel voor het witwassen van geld of
      terrorismefinanciering, tot wijziging van Verordening (EU) nr. 648/2012 van het Europees Parlement en de Raad
      en tot intrekking van [Richtlijn 2005/60](onbekend) van het Europees Parlement en de Raad en [Richtlijn 2006/70/
      EG](onbekend) van de Commissie (PbEU 2015, L 141), zoals gewijzigd bij [richtlijn (EU) 2018/843](32018L0843) van
      het Europees Parlement en de Raad van 30 mei 2018 tot wijziging van [Richtlijn (EU) 2015/849](32015L0849) inzake
      de voorkoming van het gebruik van het financiële stelsel voor het witwassen van geld of terrorismefinanciering,
      en tot wijziging van de [Richtlijnen 2009/138/EG](32009L0138) en [2013/36](32013L0036)/EU (PbEU 2018, L [156/43]
      (32056L0043));
        - *zakelijke relatie:* zakelijke relatie als bedoeld in
      [artikel 1, eerste lid, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0046156#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0034331#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0024282#Artikel10a
      [ref5]: https://wetten.overheid.nl/BWBR0024282#Artikel1
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel1
    references:
