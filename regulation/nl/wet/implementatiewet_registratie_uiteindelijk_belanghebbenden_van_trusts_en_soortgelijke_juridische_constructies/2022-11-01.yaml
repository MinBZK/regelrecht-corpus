        artikel: '1'
  - number: '2.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt een soortgelijke juridische constructie gelijkgesteld aan een
      trust en wordt onder een trust mede verstaan een soortgelijke juridische constructie.
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel2
  - number: '2.2'
    text: |-
      Onder een trustee wordt in deze wet en de daarop berustende bepalingen tevens verstaan degene die in een
      soortgelijke juridische constructie een vergelijkbare positie heeft als een trustee in een trust.
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel2
  - number: '2.3'
    text: |-
      Onder een soortgelijke juridische constructie wordt in deze wet en de daarop berustende bepalingen verstaan:
      bij overeenkomst of samenstel van overeenkomsten tot stand gebracht fonds zonder rechtspersoonlijkheid, niet
      zijnde een onderneming of rechtspersoon als bedoeld in de [Handelsregisterwet 2007][ref1], waarin de deelnemers
      vermogen bijeenbrengen dat voor gezamenlijke rekening wordt belegd of anderszins wordt aangewend ten behoeve
      van de uiteindelijk belanghebbenden van dat fonds, alsmede een juridische constructie die is opgenomen in de
      geconsolideerde lijst, bedoeld in artikel 31, tiende lid, van de vierde anti- witwasrichtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0021777
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0021777
  - number: '3.1'
    text: 'Deze wet is van toepassing op trusts:'
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel3
  - number: 3.1.a
    text: waarvan de trustee in Nederland woonachtig of gevestigd is; of
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel3
  - number: 3.1.b
    text: |-
      waarvan de trustee buiten de Europese Unie woonachtig of gevestigd is en namens de trust in Nederland een zakelijke
      relatie aangaat of onroerend goed verwerft.
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel3
  - number: '3.2'
    text: |-
      Deze wet is niet van toepassing op de registratie van trusts en de uiteindelijk belanghebbenden daarvan voor zover
      die trusts in een andere lidstaat van de Europese Unie zijn ingeschreven in een register als bedoeld in artikel 31
      van de vierde anti-witwasrichtlijn.
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel3
  - number: '4.1'
    text: Er is een register voor het registreren van trusts en uiteindelijk belanghebbenden van trusts.
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel4
  - number: '4.2'
    text: |-
      Het register heeft als doel het voorkomen van het gebruik van het financiële stelsel voor witwassen en financieren
      van terrorisme.
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel4
  - number: '4.3'
    text: Het register wordt gehouden door de beheerder.
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel4
  - number: '5.1'
    text: 'Het register bevat de volgende gegevens over een trust:'
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel5
  - number: 5.1.a
    text: de naam;
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel5
  - number: 5.1.b
    text: het type;
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel5
  - number: 5.1.c
    text: de datum waarop deze tot stand is gekomen;
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel5
  - number: 5.1.d
    text: de plaats waar deze tot stand is gekomen; en
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel5
  - number: 5.1.e
    text: het doel waarvoor deze tot stand is gebracht.
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel5
  - number: '5.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over categorieën van doelen als bedoeld in het
      eerste lid, onderdeel e.
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel5
  - number: '5.3'
    text: 'Het register bevat de volgende gegevens over de uiteindelijk belanghebbenden van een trust:'
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel5
  - number: 5.3.a
    text: de naam, de geboortemaand, het geboortejaar, de woonstaat en de nationaliteit;
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel5
  - number: 5.3.b
    text: |-
      het burgerservicenummer, bedoeld in
      [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref1], indien dat aan de uiteindelijk
      belanghebbende is toegekend;


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel1
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '1'
  - number: 5.3.c
    text: |-
      het fiscaal identificatienummer van een ander land dan Nederland waarvan de uiteindelijk belanghebbende ingezetene
      is, indien dat door zijn woonstaat aan hem is toegekend;
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel5
  - number: 5.3.d
    text: de geboortedag, de geboorteplaats, het geboorteland en het woonadres;
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel5
  - number: 5.3.e
    text: het e-mailadres; en
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel5
  - number: 5.3.f
    text: |-
      de aard en omvang van het door de uiteindelijk belanghebbende gehouden economische belang, waarvoor bij algemene
      maatregel van bestuur klassen kunnen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel5
  - number: '5.4'
    text: 'Het register bevat de volgende bescheiden over een trust en de uiteindelijk belanghebbenden daarvan:'
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel5
  - number: 5.4.a
    text: |-
      afschriften van documenten op grond waarvan de in het derde lid, onderdelen a, b, c en d bedoelde gegevens zijn
      geverifieerd;
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel5
  - number: 5.4.b
    text: |-
      afschriften van documenten waaruit de gegevens, bedoeld in het eerste lid, blijken alsmede van documenten,
      behorende tot bij algemene maatregel van bestuur aan te wijzen categorieën, waaruit de gegevens, bedoeld in het
      derde lid, onderdeel f, blijken.
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel5
  - number: '6'
    text: |-
      De gegevens en bescheiden, bedoeld in [artikel 5, eerste, derde en vierde lid][ref1], blijven tot een bij algemene
      maatregel van bestuur te bepalen termijn, toegankelijk via het register.


      [ref1]: https://wetten.overheid.nl/BWBR0046156#Artikel5
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0046156
        artikel: '5'
        hoofdstuk: '2'
  - number: '7.2'
    text: |-
      In afwijking van het eerste lid, zijn de in [artikel 5, derde lid, onderdelen b tot en met e][ref1], bedoelde
      gegevens en de in [artikel 5, vierde lid][ref2], bedoelde bescheiden enkel toegankelijk voor de Financiële
      inlichtingen eenheid en de bij algemene maatregel van bestuur aangewezen bevoegde autoriteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0046156#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0046156#Artikel5
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0046156
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0046156
        artikel: '5'
        hoofdstuk: '2'
  - number: '10.1'
    text: |-
      In bij algemene maatregel van bestuur te bepalen gevallen kunnen, ter bescherming van de persoonlijke
      levenssfeer van uiteindelijk belanghebbenden die in het register staan ingeschreven, gegevens of
      bescheiden of categorieën van gegevens of bescheiden, op langs elektronische weg gedaan verzoek van een
      uiteindelijk belanghebbende bij besluit van Onze Minister van Financiën worden afgeschermd tegen inzage
      door anderen dan de Financiële inlichtingen eenheid, de bevoegde autoriteiten en de instellingen bedoeld in
      __REF000___________________________________________________________________________________________________________
      _________________.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1a
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: 1a
  - number: '10.2'
    text: |-
      De in [artikel 5, derde lid, onderdeel f][ref1], bedoelde gegevens kunnen niet worden afgeschermd tegen inzage.


      [ref1]: https://wetten.overheid.nl/BWBR0046156#Artikel5
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0046156
        artikel: '5'
        hoofdstuk: '2'
  - number: '10.3'
    text: |-
      Jaarlijks worden statistische gegevens gepubliceerd over het aantal afschermingen dat op grond van dit artikel is
      toegekend, met in begrip van de gronden waarop die afschermingen zijn toegekend.
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel10
  - number: '11.1'
    text: |-
      De trustee is ten behoeve van registratie in het register, verplicht langs elektronische weg opgave te doen
      van de in [artikel 5][ref1] bedoelde gegevens en bescheiden met betrekking tot die trust en de uiteindelijk
      belanghebbenden daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0046156#Artikel5
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0046156
        artikel: '5'
        hoofdstuk: '2'
  - number: '11.2'
    text: |-
      De trustee doet uiterlijk een week na het plaatsvinden van het feit ten gevolge waarvan de verplichting tot
      registratie ontstaat, opgave overeenkomstig deze wet.
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel11
  - number: '11.3'
    text: |-
      Na opgave besluit Onze Minister van Financiën tot registratie in het register en worden de belanghebbenden van de
      betreffende trust daarvan langs elektronische weg in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel11
  - number: '11.4'
    text: Ten behoeve van de registratie overeenkomstig deze wet identificeert de trustee zich.
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel11
  - number: '11.5'
    text: |-
      In schriftelijke uitingen die namens de trust worden gedaan, wordt het unieke kenmerk vermeld dat na registratie
      aan de trust is toegekend.
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel11
  - number: '12'
    text: |-
      De trustee draagt er zorg voor dat de in [artikel 5][ref1] bedoelde gegevens en bescheiden met betrekking tot de
      trust en de uiteindelijk belanghebbenden daarvan, toereikend, actueel en accuraat zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0046156#Artikel5
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0046156
        artikel: '5'
        hoofdstuk: '2'
  - number: '13.1'
    text: De beheerder draagt zorg voor de ontwikkeling, een goede bereikbaarheid, werking en beveiliging van het register.
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel13
  - number: '13.2'
    text: |-
      De beheerder draagt er zorg voor dat de weergave van krachtens deze wet in het register opgenomen informatie
      onverwijld na het besluit bedoeld in [artikel 11, derde lid][ref1], overeenstemt met dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0046156#Artikel11
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0046156
        artikel: '11'
        hoofdstuk: '4'
  - number: '14'
    text: De beheerder kent aan een trust een uniek kenmerk toe, en neemt dit kenmerk in het register op.
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel14
  - number: '18.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld omtrent het beheer, de vorm en de technische en
      administratieve inrichting van het register.
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel18
  - number: '18.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat in het register ook informatie kan worden opgenomen die
      is overgenomen uit een basisregistratie.
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel18
  - number: '19.1'
    text: 'De beheerder stelt een protocol op aangaande:'
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel19
  - number: 19.1.a
    text: de beschikbaarheid, werking, beveiliging en andere aangelegenheden betreffende het beheer van het register; en
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel19
  - number: 19.1.b
    text: |-
      de evaluatie van de uitvoering van de bij deze wet aan de beheerder opgedragen taken welke evaluatie twee jaar na
      inwerkingtreding van deze wet wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel19
  - number: '19.2'
    text: |-
      Het protocol behoeft de goedkeuring van Onze Minister van Financiën, Onze Minister van Justitie en Veiligheid en
      Onze Minister van Economische Zaken en Klimaat.
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel19
  - number: '19.3'
    text: De goedkeuring kan worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel19
  - number: '22'
    text: |-
      Onze Minister van Financiën kan een last onder dwangsom opleggen indien er sprake is van handelen in strijd met
      [artikel 11, eerste of tweede lid][ref1], of [artikel 12][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0046156#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0046156#Artikel12
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0046156
        artikel: '11'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0046156
        artikel: '12'
        hoofdstuk: '4'
  - number: '23.1'
    text: |-
      Onze Minister van Financiën kan een bestuurlijke boete opleggen indien er sprake is van handelen in strijd met
      [artikel 11, eerste of tweede lid][ref1], of [artikel 12][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0046156#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0046156#Artikel12
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0046156
        artikel: '11'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0046156
        artikel: '12'
        hoofdstuk: '4'
  - number: '23.2'
    text: |-
      De op grond van het eerste lid op te leggen bestuurlijke boete bedraagt ten hoogste het bedrag dat is vastgesteld
      voor de vierde categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 23a.1
    text: |-
      Onze Minister van Financiën is bevoegd van een trustee inlichtingen te vorderen die hij redelijkerwijs voor de
      vervulling van zijn taak, bedoeld in de [artikelen 22][ref1] en [23][ref2], nodig heeft. Een trustee is verplicht
      aan Onze Minister van Financiën binnen de door hem gestelde redelijke termijn alle medewerking te verlenen die deze
      redelijkerwijs kan vorderen bij de uitvoering van deze bevoegdheid.


      [ref1]: https://wetten.overheid.nl/BWBR0046156#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0046156#Artikel23
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0046156
        artikel: '22'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0046156
        artikel: '23'
        hoofdstuk: '7'
  - number: '24'
    text: |-
      Het recht, bedoeld in [artikel 2, eerste lid, van de Databankenwet][ref1] is, ten aanzien van het register bedoeld
      in [artikel 4][ref2] van deze wet, voorbehouden aan de Staat der Nederlanden.


      [ref1]: https://wetten.overheid.nl/BWBR0010591#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0046156#Artikel4
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0010591
        artikel: I
      - id: ref2
        bwb_id: BWBR0046156
        artikel: '4'
        hoofdstuk: '2'
  - number: '25.1'
    text: 'Onze Minister van Financiën verleent aan de voorzitter van de Kamer van Koophandel mandaat om:'
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel25
  - number: 25.1.a
    text: |-
      besluiten te nemen als bedoeld in [artikel 10, eerste lid][ref1], en [artikel 11, derde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0046156#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0046156#Artikel11
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0046156
        artikel: '10'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0046156
        artikel: '11'
        hoofdstuk: '4'
  - number: 25.1.b
    text: |-
      te beslissen op bezwaarschriften tegen besluiten als bedoeld in onderdeel a, met dien verstande dat de persoon die
      betrokken is bij het besluitvormingsproces ten aanzien van het bezwaarschrift niet ook betrokken is geweest bij het
      besluitvormingsproces in eerste aanleg, voor zover het besluit waartegen het bezwaar zich richt, niet door hem in
      mandaat is genomen; en
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel25
  - number: 25.1.c
    text: |-
      in rechte op te treden en tegen rechterlijke uitspaken hoger beroep of cassatie in te stellen, dan wel af te zien
      van hoger beroep of cassatie.
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel25
  - number: '25.2'
    text: |-
      De voorzitter van de Kamer van Koophandel kan ten aanzien van de in het eerste lid aan hem gemandateerde
      bevoegdheden ondermandaat verlenen aan één of meer onder hem ressorterende werknemers van de beheerder.
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel25
  - number: '29'
    text: |-
      In afwijking van [artikel 11, tweede lid][ref1], vindt registratie waartoe de verplichting is ontstaan als gevolg
      van de inwerkingtreding van artikel 11 van deze wet plaats binnen drie maanden na inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0046156#Artikel11
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0046156
        artikel: '11'
        hoofdstuk: '4'
  - number: '30'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de verschillende artikelen of
      onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel30
  - number: '31'
    text: |-
      Deze wet wordt aangehaald als: Implementatiewet registratie uiteindelijk belanghebbenden van trusts en soortgelijke
      juridische constructies.
    url: https://wetten.overheid.nl/BWBR0046156/2022-11-01#Artikel31
