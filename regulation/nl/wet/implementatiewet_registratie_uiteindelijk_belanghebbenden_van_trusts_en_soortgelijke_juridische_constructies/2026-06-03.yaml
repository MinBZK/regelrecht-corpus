    text: |-
      In afwijking van [artikel 11, tweede lid][ref1], vindt registratie waartoe de verplichting is ontstaan als gevolg
      van de inwerkingtreding van artikel 11 van deze wet plaats binnen drie maanden na inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0046156#Artikel11
