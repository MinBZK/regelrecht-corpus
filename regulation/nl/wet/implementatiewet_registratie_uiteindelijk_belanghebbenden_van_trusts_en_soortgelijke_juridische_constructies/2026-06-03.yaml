  - number: '2'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt een soortgelijke juridische constructie gelijkgesteld aan
      een trust en wordt onder een trust mede verstaan een soortgelijke juridische constructie.

      2 Onder een trustee wordt in deze wet en de daarop berustende bepalingen tevens verstaan degene die in een
      soortgelijke juridische constructie een vergelijkbare positie heeft als een trustee in een trust.

      3 Onder een soortgelijke juridische constructie wordt in deze wet en de daarop berustende bepalingen verstaan:
      bij overeenkomst of samenstel van overeenkomsten tot stand gebracht fonds zonder rechtspersoonlijkheid, niet
      zijnde een onderneming of rechtspersoon als bedoeld in de [Handelsregisterwet 2007][ref1], waarin de deelnemers
      vermogen bijeenbrengen dat voor gezamenlijke rekening wordt belegd of anderszins wordt aangewend ten behoeve
      van de uiteindelijk belanghebbenden van dat fonds, alsmede een juridische constructie die is opgenomen in de
      geconsolideerde lijst, bedoeld in artikel 31, tiende lid, van de vierde anti- witwasrichtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0021777
    url: https://wetten.overheid.nl/BWBR0046156/2026-06-03#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0021777
  - number: '3'
    text: >-
      1 Deze wet is van toepassing op trusts:


      a. waarvan de trustee in Nederland woonachtig of gevestigd is; of


      b. waarvan de trustee buiten de Europese Unie woonachtig of gevestigd is en namens de trust in Nederland een
      zakelijke relatie aangaat of onroerend goed verwerft.


      2 Deze wet is niet van toepassing op de registratie van trusts en de uiteindelijk belanghebbenden daarvan voor
      zover die trusts in een andere lidstaat van de Europese Unie zijn ingeschreven in een register als bedoeld in
      artikel 31 van de vierde anti-witwasrichtlijn.
    url: https://wetten.overheid.nl/BWBR0046156/2026-06-03#Artikel3
  - number: '4'
    text: >-
      1 Er is een register voor het registreren van trusts en uiteindelijk belanghebbenden van trusts.


      2 Het register heeft als doel het voorkomen van het gebruik van het financiële stelsel voor witwassen en
      financieren van terrorisme.


      3 Het register wordt gehouden door de beheerder.
    url: https://wetten.overheid.nl/BWBR0046156/2026-06-03#Artikel4
  - number: '5'
    text: |-
      1 Het register bevat de volgende gegevens over een trust:

      a. de naam;

      b. het type;

      c. de datum waarop deze tot stand is gekomen;

      d. de plaats waar deze tot stand is gekomen; en

      e. het doel waarvoor deze tot stand is gebracht.

      2 Bij algemene maatregel van bestuur kunnen regels worden gesteld over categorieën van doelen als bedoeld in het
      eerste lid, onderdeel e.

      3 Het register bevat de volgende gegevens over de uiteindelijk belanghebbenden van een trust:

      a. de naam, de geboortemaand, het geboortejaar, de woonstaat en de nationaliteit;

      b. het burgerservicenummer, bedoeld in
      [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref1], indien dat aan de uiteindelijk
      belanghebbende is toegekend;

      c. het fiscaal identificatienummer van een ander land dan Nederland waarvan de uiteindelijk belanghebbende
      ingezetene is, indien dat door zijn woonstaat aan hem is toegekend;

      d. de geboortedag, de geboorteplaats, het geboorteland en het woonadres;

      e. het e-mailadres; en

      f. de aard en omvang van het door de uiteindelijk belanghebbende gehouden economische belang, waarvoor bij algemene
      maatregel van bestuur klassen kunnen worden vastgesteld.

      4 Het register bevat de volgende bescheiden over een trust en de uiteindelijk belanghebbenden daarvan:

      a. afschriften van documenten op grond waarvan de in het derde lid, onderdelen a, b, c en d bedoelde gegevens zijn
      geverifieerd;

      b. afschriften van documenten waaruit de gegevens, bedoeld in het eerste lid, blijken alsmede van documenten,
      behorende tot bij algemene maatregel van bestuur aan te wijzen categorieën, waaruit de gegevens, bedoeld in het
      derde lid, onderdeel f, blijken.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel1
    url: https://wetten.overheid.nl/BWBR0046156/2026-06-03#Artikel5
