      - id: ref3
        bwb_id: BWBR0046156
        artikel: '5'
        hoofdstuk: '2'
  - number: '21'
    text: |-
      1 Een instelling als bedoeld in [artikel 7, eerste lid, onderdeel b][ref1], of bevoegde autoriteit of
      bestuursorgaan, instelling of andere persoon of rechtspersoon als bedoeld in artikel 7, tweede lid, doet
      melding aan de beheerder van iedere discrepantie die zij aantreft tussen een gegeven omtrent een uiteindelijk
      belanghebbende dat zij verstrekt heeft gekregen uit het register en de informatie waarover zij uit anderen hoofde
      beschikt.

      2 Het eerste lid is niet van toepassing indien nakoming van de in dat lid neergelegde verplichting de uitoefening
      van de wettelijke taak of bevoegdheid van de betreffende autoriteit onnodig zou doorkruisen.

      3 Bij een melding als bedoeld in het eerste lid verstrekt een instelling als bedoeld in
      [artikel 7, eerste lid, onderdeel b][ref2], of bevoegde autoriteit of bestuursorgaan, instelling
      of andere persoon of rechtspersoon als bedoeld in artikel 7, tweede lid, de gegevens, bedoeld
      in [artikel 5, derde lid][ref3], waarover zij beschikt en kan zij de bescheiden, bedoeld in
      [artikel 5, vierde lid][ref4], verstrekken waarover zij beschikt.

      4 De beheerder bepaalt de wijze waarop een melding als bedoeld in het eerste lid wordt gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0046156#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0046156#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0046156#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0046156#Artikel5
    url: https://wetten.overheid.nl/BWBR0046156/2026-06-03#Artikel21
