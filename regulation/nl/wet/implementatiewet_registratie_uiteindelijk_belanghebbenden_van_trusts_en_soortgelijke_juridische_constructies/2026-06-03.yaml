        artikel: '5'
        hoofdstuk: '2'
  - number: '7'
    text: |-
      1 De in [artikel 5, eerste en derde lid, onderdelen a en f][ref1], bedoelde gegevens zijn op elektronische wijze
      toegankelijk voor:

      a. een instelling als bedoeld in
      [artikel 1, eerste lid, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref2] ten behoeve
      van een op grond van [die wet][ref3] of de [Wet toezicht trustkantoren 2018][ref4] verplicht cliëntenonderzoek;

      b. een instelling als bedoeld in [artikel 10, tweede lid, onderdelen a tot en met m, van de Sanctiewet 1977][ref5]
      ten behoeve van de naleving van de bij of krachtens [afdeling 5 van die wet][ref6] bepaalde verplichtingen met
      betrekking tot het financieel verkeer.

      2 De in [artikel 5][ref7] bedoelde gegevens en bescheiden zijn toegankelijk voor:

      a. de Financiële inlichtingen eenheid en de bij algemene maatregel van bestuur aangewezen bevoegde autoriteiten;

      b. een op grond van [artikel 10, eerste lid, van de Sanctiewet 1977][ref8] aangewezen ambtenaar of andere persoon
      in het kader van het uitoefenen van het toezicht op de naleving van het bij of krachtens die [wet][ref9] bepaalde;

      c. een krachtens [artikel 10, tweede lid, van de Sanctiewet 1977][ref10] door Onze Minister van
      Financiën aangewezen rechtspersoon in het kader van het toezicht op de naleving van het bij of krachtens
      [afdeling 5 van die wet][ref11] bepaalde met betrekking tot het financieel verkeer;

      d. bij algemene maatregel van bestuur aangewezen bestuursorganen en rechtspersonen met een overheidstaak, voor
      zover dit noodzakelijk is in het kader van de uitoefening van een taak of bevoegdheid waar bestuursorganen en
      rechtspersonen met een overheidstaak bij of krachtens de wet dan wel bij of krachtens een verordening als bedoeld
      in artikel 288 van het Verdrag betreffende de werking van de Europese Unie mee zijn belast;

      e. de instellingen, genoemd in artikel 11, eerste lid, onderdelen e tot en met h, van [Richtlijn (EU) 2024/1640]
      (32024L1640) van het Europees Parlement en de Raad van 31 mei 2024 betreffende de mechanismen die de lidstaten
      moeten invoeren om het gebruik van het financiële stelsel voor witwassen of terrorismefinanciering te voorkomen,
      tot wijziging van [Richtlijn (EU) 2019/1937](32019L1937), en tot wijziging en intrekking van [Richtlijn (EU)
      2015/849](32015L0849) (PbEU 2024, L 2024/1640).

      3 Voor zover zij een aantoonbaar legitiem belang hebben bij toegang tot de in het eerste lid bedoelde gegevens,
      zijn die gegevens op langs elektronische weg gedaan verzoek, tevens op elektronische wijze toegankelijk voor bij
      algemene maatregel van bestuur aan te wijzen categorieën van natuurlijke personen en rechtspersonen. Dit legitiem
      belang houdt verband met het voorkomen of bestrijden van witwassen, daarmee verband houdende basisdelicten, of
      financieren van terrorisme.

      4 Indien een verzoek als bedoeld in het derde lid is toegewezen, stelt de kamer de uiteindelijk belanghebbende op
      wiens gegevens het verzoek ziet daarvan op de hoogte, alsmede van welk doel het verzoek dient.

      5 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over:

      a. de in dit artikel bedoelde toegang en de wijze waarop die toegang verkregen kan worden;

      b. de bij het verlenen van die toegang te stellen voorschriften;

      c. de wijze waarop een legitiem belang als bedoeld in het derde lid kan worden aangetoond;

      d. het in behandeling nemen van een aanvraag om gegevens in te zien voor personen en rechtspersonen met een
      legitiem belang als bedoeld in het derde lid en de beslissing op deze aanvraag; en

      e. Het verlenen van een certificaat of het weigeren, opschorten of intrekken van de toegang, bedoeld in artikel 13,
      zesde tot en met achtste lid en tiende lid, van [Richtlijn (EU) 2024/1640](32024L1640) van het Europees Parlement
      en de Raad van 31 mei 2024 betreffende de mechanismen die de lidstaten moeten invoeren om het gebruik van het
      financiële stelsel voor witwassen of terrorismefinanciering te voorkomen, tot wijziging van [Richtlijn (EU)
      2019/1937](32019L1937), en tot wijziging en intrekking van [Richtlijn (EU) 2015/849](32015L0849) (PbEU 2024,
      L 2024/1640).

      6 De in [artikel 5, eerste, derde en vierde lid][ref12], bedoelde gegevens en bescheiden zijn op elektronische
      wijze toegankelijk voor de trustee voor zover deze gegevens of bescheiden betrekking hebben op de trust waarvan hij
      de trustee is of op de uiteindelijk belanghebbenden van die trust.

      7 De voordracht voor een krachtens het derde of vierde lid vast te stellen algemene maatregel van bestuur wordt
      niet eerder gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.


