  - number: '13'
    text: |-
      1 De beheerder draagt zorg voor de ontwikkeling, een goede bereikbaarheid, werking en beveiliging van het register.

      2 De beheerder draagt er zorg voor dat de weergave van krachtens deze wet in het register opgenomen informatie
      onverwijld na het besluit bedoeld in [artikel 11, derde lid][ref1], overeenstemt met dat besluit.


