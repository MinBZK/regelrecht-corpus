  - number: '11'
    text: |-
      1 De trustee is ten behoeve van registratie in het register, verplicht langs elektronische weg opgave te doen
      van de in [artikel 5][ref1] bedoelde gegevens en bescheiden met betrekking tot die trust en de uiteindelijk
      belanghebbenden daarvan.

      2 De trustee doet uiterlijk een week na het plaatsvinden van het feit ten gevolge waarvan de verplichting tot
      registratie ontstaat, opgave overeenkomstig deze wet.

      3 Na opgave besluit Onze Minister van Financiën tot registratie in het register en worden de belanghebbenden van de
      betreffende trust daarvan langs elektronische weg in kennis gesteld.

      4 Ten behoeve van de registratie overeenkomstig deze wet identificeert de trustee zich.

      5 In schriftelijke uitingen die namens de trust worden gedaan, wordt het unieke kenmerk vermeld dat na registratie
      aan de trust is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0046156#Artikel5
    url: https://wetten.overheid.nl/BWBR0046156/2026-06-03#Artikel11
