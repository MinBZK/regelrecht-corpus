  - number: '25'
    text: |-
      1 Onze Minister van Financiën verleent aan de voorzitter van de Kamer van Koophandel mandaat om:

      a. besluiten te nemen als bedoeld in [artikel 7, derde lid][ref1], [artikel 10, eerste lid][ref2], en
      [artikel 11, derde lid][ref3];

      b. te beslissen op bezwaarschriften tegen besluiten als bedoeld in onderdeel a, met dien verstande dat de persoon
      die betrokken is bij het besluitvormingsproces ten aanzien van het bezwaarschrift niet ook betrokken is geweest bij
      het besluitvormingsproces in eerste aanleg, voor zover het besluit waartegen het bezwaar zich richt, niet door hem
      in mandaat is genomen; en

      c. in rechte op te treden en tegen rechterlijke uitspaken hoger beroep of cassatie in te stellen, dan wel af te
      zien van hoger beroep of cassatie.

      2 De voorzitter van de Kamer van Koophandel kan ten aanzien van de in het eerste lid aan hem gemandateerde
      bevoegdheden ondermandaat verlenen aan één of meer onder hem ressorterende werknemers van de beheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0046156#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0046156#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0046156#Artikel11
