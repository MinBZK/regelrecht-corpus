  - number: '12'
    text: |-
      De trustee draagt er zorg voor dat de in [artikel 5][ref1] bedoelde gegevens en bescheiden met betrekking tot de
      trust en de uiteindelijk belanghebbenden daarvan, toereikend, actueel en accuraat zijn.


