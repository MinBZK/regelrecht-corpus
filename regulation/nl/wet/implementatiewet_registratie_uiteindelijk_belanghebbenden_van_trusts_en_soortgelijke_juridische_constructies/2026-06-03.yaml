        artikel: '1'
  - number: '6'
    text: |-
      De gegevens en bescheiden, bedoeld in [artikel 5, eerste, derde en vierde lid][ref1], blijven tot een bij algemene
      maatregel van bestuur te bepalen termijn, toegankelijk via het register.


      [ref1]: https://wetten.overheid.nl/BWBR0046156#Artikel5
    url: https://wetten.overheid.nl/BWBR0046156/2026-06-03#Artikel6
