  - number: '23'
    text: |-
      1 Onze Minister van Financiën kan een bestuurlijke boete opleggen indien er sprake is van handelen in strijd met
      [artikel 11, eerste of tweede lid][ref1], of [artikel 12][ref2].

      2 De op grond van het eerste lid op te leggen bestuurlijke boete bedraagt ten hoogste het bedrag dat is vastgesteld
      voor de vierde categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0046156#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0046156#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0046156/2026-06-03#Artikel23
