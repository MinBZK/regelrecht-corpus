  - number: '22'
    text: |-
      Onze Minister van Financiën kan een last onder dwangsom opleggen indien er sprake is van handelen in strijd met
      [artikel 11, eerste of tweede lid][ref1], of [artikel 12][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0046156#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0046156#Artikel12
