  - number: 23a
    text: |-
      1 Onze Minister van Financiën is bevoegd van een trustee inlichtingen te vorderen die hij redelijkerwijs voor de
      vervulling van zijn taak, bedoeld in de [artikelen 22][ref1] en [23][ref2], nodig heeft. Een trustee is verplicht
      aan Onze Minister van Financiën binnen de door hem gestelde redelijke termijn alle medewerking te verlenen die deze
      redelijkerwijs kan vorderen bij de uitvoering van deze bevoegdheid.

      2 Het eerste lid is van overeenkomstige toepassing op een instelling die een melding als bedoeld in
      [artikel 10c, eerste lid, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref3] heeft
      gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0046156#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0046156#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0024282#Artikel10c
