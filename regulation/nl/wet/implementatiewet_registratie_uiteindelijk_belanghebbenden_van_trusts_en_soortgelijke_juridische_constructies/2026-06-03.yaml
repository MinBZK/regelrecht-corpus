  - number: '9'
    text: >-
      1 Bij algemene maatregel van bestuur kan worden bepaald dat voor inzage in informatie die is opgenomen in het
      register een vergoeding verschuldigd is, welke vergoeding niet meer bedraagt dan de administratieve kosten voor
      het beschikbaar stellen van de informatie, met inbegrip van de kosten voor het bijhouden en ontwikkelen van het
      register, en kan variëren naar de wijze van inzage in informatie en de hoeveelheid informatie.


      2 Onze Minister van Financiën en Onze Minister van Justitie en Veiligheid dragen jaarlijks bij in de financiering
      van het beheer van het register voor zover die financiering niet kan worden voldaan uit de in het eerste lid
      bedoelde vergoedingen.
    url: https://wetten.overheid.nl/BWBR0046156/2026-06-03#Artikel9
  - number: '10'
    text: |-
      1 In bij algemene maatregel van bestuur te bepalen gevallen kunnen, ter bescherming van de persoonlijke levenssfeer
      van uiteindelijk belanghebbenden die in het register staan ingeschreven, gegevens of bescheiden of categorieën van
      gegevens of bescheiden, op langs elektronische weg gedaan verzoek van een uiteindelijk belanghebbende bij besluit
      van Onze Minister van Financiën worden afgeschermd tegen inzage door anderen dan:

      a. de Financiële inlichtingen eenheid en de bevoegde autoriteiten;

      b. bestuursorganen, instellingen of andere personen of rechtspersonen als bedoeld in
      [artikel 7, tweede lid][ref1];

      c. de instellingen bedoeld in
      __REF000___________________________________________________________________________________________________________
      _________________, ook voor zover deze instellingen toegang krijgen in het kader van
      [artikel 7, eerste lid, onderdeel b][ref3], van deze wet; en

      d. de trustee voor zover deze gegevens betrekking hebben op de uiteindelijk belanghebbenden van de trust waarvan
      hij de trustee is.

      2 De in [artikel 5, derde lid, onderdeel f][ref4], bedoelde gegevens kunnen niet worden afgeschermd tegen inzage.

      3 Jaarlijks worden statistische gegevens gepubliceerd over het aantal afschermingen dat op grond van dit artikel is
      toegekend, met in begrip van de gronden waarop die afschermingen zijn toegekend.


