  - number: '14'
    text: De beheerder kent aan een trust een uniek kenmerk toe, en neemt dit kenmerk in het register op.
    url: https://wetten.overheid.nl/BWBR0046156/2026-06-03#Artikel14
  - number: '15'
    text: |-
      1 De beheerder draagt er zorg voor dat bij het verstrekken van gegevens en bescheiden omtrent uiteindelijk
      belanghebbenden deze gegevens en bescheiden uitsluitend gerangschikt worden naar natuurlijke personen indien het
      verzoek daartoe wordt gedaan door de Financiële inlichtingen eenheid, een bevoegde autoriteit, bestuursorgaan,
      instelling of andere persoon of rechtspersoon als bedoeld in [artikel 7, tweede lid][ref1], voor zover deze
      handelt in het kader van de uitoefening van een wettelijke taak of bevoegdheid.

      2 De beheerder verstrekt de gegevens en bescheiden omtrent een uiteindelijk belanghebbende aan de Financiële
      inlichtingen eenheid, een bevoegde autoriteit, bestuursorgaan, instelling of andere persoon of rechtspersoon als
      bedoeld in [artikel 7, tweede lid][ref2], op een zodanige wijze dat de uiteindelijk belanghebbende geen weet heeft
      van de verstrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0046156#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0046156#Artikel7
    url: https://wetten.overheid.nl/BWBR0046156/2026-06-03#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0046156
        artikel: '7'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0046156
        artikel: '7'
        hoofdstuk: '3'
  - number: '16'
    text: |-
      De beheerder geeft een uiteindelijk belanghebbende op diens langs elektronische weg gedaan verzoek inzicht in het
      aantal keer dat zijn gegevens of bescheiden, bedoeld in [artikel 5][ref1], zijn verstrekt, met uitzondering van
      verstrekkingen aan de Financiële inlichtingen eenheid, de bevoegde autoriteiten of bestuursorganen, instellingen of
      andere personen of rechtspersonen als bedoeld in [artikel 7, tweede lid][ref2]. Bij ministeriële regeling kunnen
      regels worden gesteld over de wijze waarop de uiteindelijk belanghebbende inzicht kan krijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0046156#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0046156#Artikel7
    url: https://wetten.overheid.nl/BWBR0046156/2026-06-03#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0046156
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0046156
        artikel: '7'
        hoofdstuk: '3'
  - number: '17'
    text: |-
      1 Indien de beheerder een melding ontvangt als bedoeld in [artikel 21][ref1] van deze wet of
      [artikel 10c, eerste lid, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref2], tekent
      de beheerder in het register onverwijld aan dat ten aanzien van het gegeven een dergelijke melding is gedaan en
      stelt de uiteindelijk belanghebbenden van de betreffende trust alsmede Onze Minister van Financiën daarvan langs
      elektronische weg in kennis.

      2 Binnen een week na ontvangst van de kennisgeving, bedoeld in het eerste lid, wijzigt de trustee de geregistreerde
      gegevens of maakt hij aan de beheerder kenbaar de geregistreerde gegevens niet te wijzigen. De beheerder stelt
      Onze Minister van Financiën, de uiteindelijk belanghebbenden van de betreffende trust alsmede degene die de melding
      heeft gedaan hiervan onverwijld langs elektronische weg in kennis, en verwijdert de in het eerste lid bedoelde
      aantekening.


      [ref1]: https://wetten.overheid.nl/BWBR0046156#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel10c
    url: https://wetten.overheid.nl/BWBR0046156/2026-06-03#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0046156
        artikel: '21'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: 10c
  - number: '18'
    text: >-
      1 Bij algemene maatregel van bestuur kunnen regels worden gesteld omtrent het beheer, de vorm en de technische en
      administratieve inrichting van het register.


      2 Bij algemene maatregel van bestuur kan worden bepaald dat in het register ook informatie kan worden opgenomen die
      is overgenomen uit een basisregistratie.
    url: https://wetten.overheid.nl/BWBR0046156/2026-06-03#Artikel18
  - number: '19'
    text: >-
      1 De beheerder stelt een protocol op aangaande:


      a. de beschikbaarheid, werking, beveiliging en andere aangelegenheden betreffende het beheer van het register; en


      b. de evaluatie van de uitvoering van de bij deze wet aan de beheerder opgedragen taken welke evaluatie twee jaar
      na inwerkingtreding van deze wet wordt uitgevoerd.


      2 Het protocol behoeft de goedkeuring van Onze Minister van Financiën, Onze Minister van Justitie en Veiligheid en
      Onze Minister van Economische Zaken en Klimaat.


      3 De goedkeuring kan worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0046156/2026-06-03#Artikel19
  - number: '20'
    text: |-
      1 Ten behoeve van de uitvoering van haar taken op grond van
      [artikel 13 van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref1] kan de Financiële
      inlichtingen eenheid de in [artikel 5][ref2] bedoelde informatie uit het register tijdig en kosteloos delen met
      financiële inlichtingen eenheden van andere lidstaten van de Europese Unie.

      2 Ten behoeve van de uitvoering van hun wettelijke taken op grond waarvan zij toegang hebben gekregen tot de in
      [artikel 5][ref3] bedoelde informatie uit het register, kunnen de bevoegde autoriteiten die informatie tijdig en
      kosteloos delen met bevoegde autoriteiten van andere lidstaten van de Europese Unie.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0046156#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0046156#Artikel5
    url: https://wetten.overheid.nl/BWBR0046156/2026-06-03#Artikel20
    references:
