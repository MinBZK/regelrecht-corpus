preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is regels te stellen met betrekking tot het registreren
    van uiteindelijk belanghebbenden van trusts en soortgelijke juridische constructies ter implementatie van Richtlijn
    (EU) 2015/849 van het Europees Parlement en de Raad van 20 mei 2015 inzake de voorkoming van het gebruik van het
    financiële stelsel voor het witwassen van geld of terrorismefinanciering (PbEU 2015, L 141), zoals gewijzigd bij
    Richtlijn (EU) 2018/843 tot wijziging van Richtlijn (EU) 2015/849 inzake de voorkoming van het gebruik van het
    financiële stelsel voor het witwassen van geld of terrorismefinanciering (PbEU 2018, L 156/43);

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0046156/2022-01-28#ArtikelAanhef
