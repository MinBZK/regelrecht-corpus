  - number: '2.1'
    text: Deze regeling treedt in werking met ingang van 1 mei 1987.
    url: https://wetten.overheid.nl/BWBR0004154/1987-05-01#Artikel2
  - number: '2.2'
    text: 'Deze regeling kan worden aangehaald als: Regeling aanwijzing smetstoffen.'
