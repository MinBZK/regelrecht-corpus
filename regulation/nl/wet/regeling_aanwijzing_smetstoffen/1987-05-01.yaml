preamble:
  text: |-
    Gelet op artikel 37, eerste lid, van de Diergeneesmiddelenwet (Stb. 1985, 410):

    Gehoord de Koninklijke Nederlandse Maatschappij voor Diergeneeskunde en het Landbouwschap;

    Besluit;
  url: https://wetten.overheid.nl/BWBR0004154/1987-05-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Als smetstoffen, bedoeld in [artikel 37, eerste lid, van de Diergeneesmiddelenwet][ref1] (Stb. 1985, 410), worden
      aangewezen alle smetstoffen, die gevaar opleveren voor de gezondheid van dieren met uitzondering van smetstoffen,
      die tevens infectie- of parasitaire ziekten bij mensen kunnen veroorzaken.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel37
    url: https://wetten.overheid.nl/BWBR0004154/1987-05-01#Artikel1
