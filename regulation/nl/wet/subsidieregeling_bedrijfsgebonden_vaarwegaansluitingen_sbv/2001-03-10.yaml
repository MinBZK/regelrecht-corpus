  - number: '9'
    text: |-
      1 Binnen twaalf weken na ontvangst van de in [artikel 8, derde lid][ref1], bedoelde aanvraag tot vaststelling van
      de subsidie en de daarbij behorende bescheiden en gegevens, stelt de Minister de subsidie vast. Binnen tien weken
      na de subsidievaststelling wordt het subsidiebedrag uitbetaald.

      2 Indien de subsidieontvanger binnen de in [artikel 8, derde lid][ref2], bedoelde termijn geen aanvraag tot
      vaststelling van de subsidie heeft ingediend, stelt de Minister binnen twaalf weken na ontvangst van de in
      [artikel 8, derde lid][ref3], bedoelde overige stukken de subsidie ambtshalve vast.

      3 Indien uit de gegevens, bedoeld in [artikel 8, derde lid][ref4], blijkt dat de werkelijke kosten van
      de subsidiabele onderdelen van het project lager zijn dan de kosten op grond waarvan de beschikking
      tot subsidieverlening is gegeven, wordt de subsidie vastgesteld op grond van het in de beschikking tot
      subsidieverlening vermelde subsidiepercentage, bedoeld in [artikel 7, eerste lid, onder c][ref5], van de werkelijke
      kosten van de subsidiabele onderdelen van het project.

      4 Het vastgestelde subsidiebedrag is niet hoger dan het in de beschikking tot subsidieverlening vermelde maximale
      subsidiebedrag.

      5 Indien het vastgestelde subsidiebedrag hoger is dan hetgeen reeds als voorschot is uitbetaald, wordt het meerdere
      binnen tien weken na de dag waarop de subsidievaststelling is bekend gemaakt, uitbetaald.

      6 Indien ingevolge het derde lid het vastgestelde subsidiebedrag lager is dan hetgeen reeds als voorschot is
      uitbetaald, betaalt de subsidieontvanger op eerste vordering van de Minister binnen een daarbij te bepalen termijn
      het te veel betaalde terug.


