  - number: '6'
    text: |-
      1 De Minister beslist afwijzend op een aanvraag indien:

      a. er gegronde redenen bestaan om aan te nemen dat niet wordt voldaan aan de vereisten bedoeld in
      [artikel 2, tweede en vierde lid][ref1];

      b. de aanvraag niet voldoet aan de vereisten, bedoeld in [artikel 4, eerste tot en met derde lid][ref2];

      c. de subsidieaanvrager niet heeft aangetoond dat hem, met inbegrip van de aangevraagde subsidie, voldoende gelden
      ter beschikking zullen staan om het voorgenomen project uit te voeren, of

      d. de aanvraag betrekking heeft op een ander jaar dan waarvoor het in [artikel 3, eerste lid][ref3], bedoelde
      subsidieplafond, is vastgesteld.

      2 Indien de subsidie wordt afgewezen vanwege overschrijding van het in [artikel 3, eerste lid][ref4], bedoelde
      subsidieplafond, kan de Minister bij de beschikking tot afwijzing van de subsidie bepalen dat in het daaropvolgende
      begrotingsjaar, zonder nieuwe indiening van de aanvraag, opnieuw een beschikking op de aanvraag wordt gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0012284#Artikel2
