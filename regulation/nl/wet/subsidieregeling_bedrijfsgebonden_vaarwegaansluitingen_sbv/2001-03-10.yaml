  - number: '5'
    text: |-
      1 De Minister beslist op een aanvraag om subsidie binnen zes maanden na ontvangst van de volledige aanvraag.

      2 Indien als gevolg van de complexiteit van de te behandelen aanvraag de Minister niet binnen de in het eerste lid,
      genoemde termijn kan beslissen, kan hij deze termijn twee keer met telkens ten hoogste zes maanden verlengen.

      3 De verlening van subsidies tot het subsidieplafond, bedoeld in [artikel 3, eerste lid][ref1], vindt plaats in
      volgorde van ontvangst van de volledige aanvragen.

      4 Indien toepassing wordt gegeven aan [artikel 4, vierde lid][ref2], geldt als datum van ontvangst de datum
      waarop de door de Minister verzochte aanvulling van de aanvraag en de daarbij behorende gegevens en bescheiden is
      ontvangen, mits deze volledig is.

      5 Bij de beoordeling van de aanvragen wordt rekening gehouden met de aanwezigheid van openbare mogelijkheden van
      overslag van en naar de vaarweg in de nabije omgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0012284#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012284#Artikel4
