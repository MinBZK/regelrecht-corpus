  - number: '11'
    text: |-
      Met het toezicht op de naleving van de bij en krachtens deze regeling aan de subsidieontvanger opgelegde
      verplichtingen zijn belast de daartoe door de Minister voor het desbetreffende project aangewezen medewerkers van
      de desbetreffende regionale directie van de Rijkswaterstaat.
    url: https://wetten.overheid.nl/BWBR0012284/2001-03-10#Artikel11
  - number: '12'
    text: |-
      1 Voor 1 juli 2005 publiceert de Minister een verslag over de doeltreffendheid, de doelmatigheid en de effecten van
      deze regeling in de praktijk. Dit verslag zal tevens worden toegezonden aan de Europese Commissie.

      2 Op verzoek van de Minister verstrekt de subsidieontvanger de gevraagde informatie en verleent de
      subsidieontvanger de medewerking, nodig voor de opstelling van het verslag, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0012284/2001-03-10#Artikel12
  - number: '13'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst en werkt terug tot en met 1 januari 2001.
    url: https://wetten.overheid.nl/BWBR0012284/2001-03-10#Artikel13
  - number: '14'
    text: 'Deze regeling wordt aangehaald als: Subsidieregeling bedrijfsgebonden vaarwegaansluitingen (SBV).'
    url: https://wetten.overheid.nl/BWBR0012284/2001-03-10#Artikel14
