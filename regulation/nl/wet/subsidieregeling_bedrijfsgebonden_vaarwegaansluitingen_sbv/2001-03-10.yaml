  - number: '7'
    text: |-
      1 De beschikking tot subsidieverlening vermeldt in elk geval:

      a. de onderdelen van het project die in overeenstemming met deze regeling als subsidiabel worden aangemerkt;

      b. de totale projectkosten en de subsidiabele projectkosten (inclusief VAT-kosten en exclusief BTW), en

      c. het maximale subsidiebedrag en het vastgestelde subsidiepercentage.

      2 Bij de beschikking tot subsidieverlening wordt het ritme van uitbetaling van de subsidie vermeld.

      3 Bij de beschikking tot subsidieverlening kan bepaald worden dat een daarbij aan te geven bedrag bij wijze van
      voorschot uitbetaald wordt. Het voorschot bedraagt maximaal 60% van het maximale subsidiebedrag en wordt uitbetaald
      volgens een aan het beschikbare budget, aan de in enig begrotingsjaar beschikbare kasruimte en aan het tijdstip
      van de aanvang van de projectwerkzaamheden gerelateerd ritme van uitbetaling. Van dit ritme van uitbetaling kan
      bij de uitbetaling in voor de subsidieontvanger gunstige zin worden afgeweken. Het resterende deel van het maximale
      subsidiebedrag wordt verrekend bij de subsidievaststelling, bedoeld in [artikel 9][ref1].

      4 Het in het derde lid bedoelde voorschot wordt verleend op basis van in te dienen declaraties die zijn
      afgestemd op de gerealiseerde en geplande voortgang van de projectwerkzaamheden en die zijn onderbouwd door een
      voortgangsrapportage van het betrokken project. De voortgangsrapportage bevat in ieder geval een overzicht van de
      gerealiseerde werkzaamheden, een planning van de nog te verrichten werkzaamheden en een raming van de nog te maken
      kosten.

      5 Bij de beschikking tot subsidieverlening kunnen bijzondere verplichtingen worden opgelegd in verband met de
      specifieke omstandigheden van de bedrijfsgebonden vaarwegaansluiting.

      6 De Minister kan nadere aanwijzingen ter zake van de administratie met betrekking tot het project geven.


      [ref1]: https://wetten.overheid.nl/BWBR0012284#Artikel9
    url: https://wetten.overheid.nl/BWBR0012284/2001-03-10#Artikel7
