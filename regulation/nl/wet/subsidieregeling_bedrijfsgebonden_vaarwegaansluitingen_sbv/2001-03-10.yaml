  - number: '3'
    text: |-
      1 Het subsidieplafond dat per jaar voor het verlenen van subsidies ingevolge deze regeling beschikbaar is, is
      gelijk aan het bedrag dat in de begroting van het Ministerie van Verkeer en Waterstaat voor dat desbetreffende
      jaar daarvoor op artikel IF 02.02.02 van het Infrastructuurfonds beschikbaar wordt gesteld, rekening houdend met
      uitgaven betreffende in eerdere jaren verleende subsidies.

      2 Bij het verlenen van de subsidie worden de kosten welke naar het oordeel van de Minister redelijkerwijs door
      andere kostendragers kunnen worden gedragen, buiten beschouwing gelaten.

      3 De kosten van de subsidiabele onderdelen van het project worden slechts voorzover zij aantoonbaar betrekking
      hebben op het project en voorzover zij in redelijkheid noodzakelijk zijn, in aanmerking genomen.

      4 De subsidie voor een project bedraagt ten hoogste 50% van de subsidiabele projectkosten (inclusief VAT-kosten en
      exclusief BTW), maar niet meer dan f 1.500.000,- / € 680.670,32 (inclusief VAT-kosten en exclusief BTW), met dien
      verstande dat, indien uit anderen hoofde dan deze regeling, financiële steun is verleend dan wel aanspraak daarop
      bestaat, de subsidie op grond van deze regeling zodanig wordt verlaagd dat het totaal van alle verstrekte subsidies
      voor initiële of uitbreidingsinvesteringen niet meer dan 50% van de totale projectkosten bedraagt.

      5 Om de hoogte van de in het vierde lid bedoelde subsidie te bepalen, wordt gebruik gemaakt van de
      berekeningsmethodiek, opgenomen in de bij deze regeling behorende bijlage.
