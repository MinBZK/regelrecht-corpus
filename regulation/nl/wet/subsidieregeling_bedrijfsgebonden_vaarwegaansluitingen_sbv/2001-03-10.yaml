  - number: '4'
    text: |-
      1 De aanvraag voor een subsidie kan tot en met 31 december 2003 worden ingediend. Zij wordt gericht aan de Minister
      en ingediend bij de hoofdingenieur-directeur van de betrokken regionale directie van de Rijkswaterstaat.

      2 Bij de aanvraag worden in elk geval gevoegd:

      a. naam en adres van de subsidieaanvrager;

      b. de dagtekening;

      c. een aanduiding van de beschikking die wordt gevraagd;

      d. een recent uittreksel van de inschrijving van de subsidieaanvrager in het handelsregister;

      e. de motivering voor de uitvoering van het project;

      f. stukken waaruit blijkt dat aan de vereisten van [artikel 2, tweede en vierde lid][ref1], wordt voldaan;

      g. een beschrijving van het project op hoofdkenmerken en het (logistieke) programma van eisen;

      h. tekeningen van het project;

      i. een overzicht van alle maatregelen die voor de totstandkoming van de bedrijfsgebonden vaarwegaansluiting moeten
      worden getroffen;

      j. een kostenraming, gespecificeerd per onderdeel van het project, en een opgave van de kostenelementen die ten
      laste van andere kostendragers kunnen worden gebracht, met inbegrip van een tijdschema van de uitvoering en de
      daarbij behorende uitgaven van de projectwerkzaamheden;

      k. een opgave van de stand van zaken met betrekking tot de voor de uitvoering van het project noodzakelijke
      wettelijke procedures;

      l. een bedrijfsplan, dat in elk geval de volgende onderdelen bevat:

      1° een schema van de ondernemingsstructuur van de subsidieaanvrager;

      2° het moment waarop met de uitvoering van het project wordt begonnen;

      3° een overzicht van de ruimtelijke situatie op de plaats waar het project wordt uitgevoerd, waarbij de ontsluiting
      is aangegeven;

      4° een indicatieve vervoersgarantie betreVende een periode van vijf jaar gerekend vanaf het tijdstip dat het
      project in gebruik wordt genomen;

      5° het gemiddeld aantal beladen wegtonkilometers per jaar dat door middel van de bedrijfsgebonden
      vaarwegaansluiting wordt vermeden;

      6° een investeringsplan, met inbegrip van een tijdsplanning van investeringsuitgaven;

      7° een financieringsplan, en

      8° een opgave van het jaar waarin het project wordt voltooid.

      3 De Minister kan bepalen dat er, in aanvulling op de in het tweede lid bedoelde gegevens, andere noodzakelijke
      gegevens worden overgelegd.

      4 Indien de Minister toepassing geeft aan [artikel 4:5, eerste lid, van de Algemene wet bestuursrecht][ref2], stelt
      hij de subsidieaanvrager binnen vier weken na de datum van ontvangst van de aanvraag in de gelegenheid de aanvraag
      of de daarbij behorende gegevens en bescheiden binnen vier weken aan te vullen.


      [ref1]: https://wetten.overheid.nl/BWBR0012284#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel45
