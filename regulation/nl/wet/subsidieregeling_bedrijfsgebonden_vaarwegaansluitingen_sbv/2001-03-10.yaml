    Besluit:
  url: https://wetten.overheid.nl/BWBR0012284/2001-03-10#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a

              *Minister:*


              Minister van Verkeer en Waterstaat;



            b

              *bedrijfsgebonden vaarwegaansluiting:*


              aansluiting van een bedrijf op het vaarwegennet, uitsluitend bestemd en gebruikt voor de overslag van
      goederen van en naar de vaarweg, ten behoeve van dat bedrijf;



            c

              *infrastructuur:*


              voorzieningen die ten behoeve van een bedrijfsgebonden vaarwegaansluiting worden gerealiseerd, niet zijnde
      voorzieningen ten behoeve van de overslag van goederen van en naar de vaarweg;



            d

              *project:*


              investeringsproject waarop de subsidieaanvraag betrekking heeft;



            e

              *initiële investeringen:*


              investeringen die betrekking hebben op de realisering van nieuwe bedrijfsgebonden vaarwegaansluitingen
      voorzover die noodzakelijk zijn om deze te laten functioneren;



            f

              *uitbreidingsinvesteringen:*


              investeringen die betrekking hebben op de uitbreiding van de capaciteit van bestaande bedrijfsgebonden
      vaarwegaansluitingen;



            g

              *VAT-kosten:*


              kosten ten behoeve van voorbereiding, administratie en toezicht van het project;



            h

              *indicatieve vervoersgarantie:*


              door de Minister op te stellen formulier, in te vullen en te onderbouwen door de subsidieaanvrager,
      inhoudende een verklaring dat hij ten minste de aangegeven hoeveelheid goederen via de te subsidiëren
      bedrijfsgebonden vaarwegaansluiting zal overslaan;



            i

              *verlader:*


              aanbieder van goederen voor transport, zijnde een onderneming die in Nederland is gevestigd of in Nederland
      een nevenvestiging heeft in de zin van artikel 3, eerste lid, van de Handelsregisterwet.
    url: https://wetten.overheid.nl/BWBR0012284/2001-03-10#Artikel1
  - number: '2'
    text: |-
      1 Op aanvraag van een verlader kan de Minister ter bevordering van de modal shift van het vervoer van goederen van
      de weg naar het water subsidie verlenen ten behoeve van initiële of uitbreidingsinvesteringen in bedrijfsgebonden
      vaarwegaansluitingen, waaronder begrepen het opnieuw in gebruik nemen van in onbruik geraakte bedrijfsgebonden
      vaarwegaansluitingen. De subsidie kan worden verleend voor zowel investeringen in de infrastructuur als in de vast
      geïnstalleerde en mobiele uitrusting die nodig is voor de overslag van goederen van en naar de vaarweg.

      2 De met de bedrijfsgebonden vaarwegaansluiting gemoeide totale projectkosten worden voor ten minste 50% door de
      subsidieaanvrager risicodragend gefinancierd.

      3 Tot de totale projectkosten, bedoeld in het tweede lid, behoren de kosten van:

      a. vergunningen en leges voorzover door de Minister aanvaardbaar geacht;

      b. bouwrente. Deze is gelijk aan de rente van de meest recente staatslening op het moment van gunning van het werk;
      het bedrag en de termijn waarover de bouwrente vergoed wordt, behoeft de goedkeuring van de Minister;

      c. materialen;

      d. werkzaamheden van aanleg, bouw, wijziging of inrichting van de betrokken infrastructuur;

      e. bijkomende voorzieningen nodig om de betrokken infrastructuur na voltooiing zijn functie te kunnen laten
      vervullen;

      f. met het project samenhangende door de Minister redelijk geachte schadevergoedingen aan derden;

      g. de krachtens de [Wet op de Omzetbelasting 1968][ref1] verschuldigde belasting voorzover die niet kan worden
      teruggevorderd, en

      h. VAT.

      4 De beoogde vaarwegaansluiting waarop het project betrekking heeft:

      a. is bedrijfsgebonden;

      b. is bestemd en wordt gebruikt voor de overslag van goederen ten behoeve van één verlader;

      c. is niet bestemd of wordt niet gebruikt als containerterminal of Regionaal Overslag Centrum, zoals bedoeld in de
      [Subsidieregeling openbare inland terminals][ref2] (Stcrt. 2000, 210);

      d. heeft een zodanige capaciteit dat deze in verhouding is met de overslagvolumes die voor de eerste vijf jaren in
      de indicatieve vervoersgarantie, bedoeld in [artikel 4, tweede lid, onderdeel l, punt 4°][ref3], zijn geraamd;

      e. is voldoende ontsloten voor aanvoer en afvoer van goederen over de vaarweg, en

      f. is op het tijdstip waarop de volledige aanvraag is ontvangen niet reeds geheel of gedeeltelijk in uitvoering
      genomen of gestaakt dan wel reeds voltooid.


      [ref1]: https://wetten.overheid.nl/BWBR0002629
      [ref2]: https://wetten.overheid.nl/BWBR0011721
      [ref3]: https://wetten.overheid.nl/BWBR0012284#Artikel4
