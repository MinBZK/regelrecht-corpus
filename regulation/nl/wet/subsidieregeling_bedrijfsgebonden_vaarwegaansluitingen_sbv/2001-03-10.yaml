  - number: '8'
    text: |-
      1 De subsidieontvanger

      a. vangt met de uitvoering van het project aan binnen één jaar na de subsidieverlening;

      b. die een wijziging aanbrengt in het project of afziet van de uitvoering van het project of een onderdeel daarvan,
      deelt dit onverwijld mede aan de Minister;

      c. voert een administratie die zodanig is ingericht dat hij daaruit op ieder gewenst tijdstip op eenvoudige en
      duidelijke wijze de projectkosten kan afleiden;

      d. verleent de Minister toegang tot het project en verstrekt de door hem gevraagde gegevens;

      e. bewaart de bewijsstukken van de projectkosten gedurende ten minste vijf jaar vanaf het moment dat het project in
      gebruik is genomen;

      f. toont op verzoek van de Minister de bescheiden op één adres;

      g. neemt de nadere aanwijzingen van de Minister ter zake van de administratie met betrekking tot het project in
      acht;

      h. doet onverwijld aan de Minister mededeling van de indiening van een verzoek tot surseance van betaling;

      i. komt de in [artikel 4, tweede lid, onderdeel l, punt 4°][ref1], bedoelde vervoersgarantie na en doet daartoe
      aan de Minister, gedurende een periode van vijf jaar vanaf het tijdstip dat het project in gebruik is genomen,
      jaarlijks rapportage van de hoeveelheid goederen die via de betrokken bedrijfsgebonden vaarwegaansluiting is
      overgeslagen.

      2 De subsidieontvanger legt, indien de uitvoering van het project een looptijd van langer dan 18 maanden heeft,
      jaarlijks binnen twee maanden na afloop van het kalenderjaar een voortgangsrapportage aan de Minister over, waarin
      zijn opgenomen:

      a. een beschrijving van de in het desbetreVende kalenderjaar uitgevoerde projectwerkzaamheden en de per
      projectwerkzaamheid gedane uitgaven;

      b. een planning van de nog uit te voeren projectwerkzaamheden, en

      c. de nog te verwachten uitgaven.

      3 Onverminderd het eerste lid, onder b, en het tweede lid, zendt de subsidieontvanger binnen één jaar na voltooiing
      van het project een financiële verantwoording aan de Minister betreVende de uitvoering van het totale project,
      vergezeld van een aanvraag tot vaststelling van de subsidie en een eindverslag. Deze verantwoording is voorzien
      van een verklaring van een onafhankelijke registeraccountant of accountant-administratieconsulent alsmede een
      slotdeclaratie. De Minister schrijft een controleprotocol voor dat door de onafhankelijke registeraccountant of
      accountant-administratieconsulent wordt gehanteerd bij het opstellen van de genoemde financiële verantwoording
      en accountantsverklaring.

      4 De subsidieontvanger verkoopt gedurende vijf jaar na de subsidievaststelling geen van de gesubsidieerde
      projectonderdelen noch delen van de onderneming of de onderneming te wier bate de subsidie is verstrekt zonder
      voorafgaande schriftelijke toestemming van de Minister. Aan deze toestemming kunnen voorschriften worden verbonden
      in het belang van het doel van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0012284#Artikel4
    url: https://wetten.overheid.nl/BWBR0012284/2001-03-10#Artikel8
