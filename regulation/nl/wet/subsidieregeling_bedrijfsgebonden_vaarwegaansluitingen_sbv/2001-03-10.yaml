  - number: '10'
    text: |-
      Zolang de subsidie niet is vastgesteld kan de Minister de subsidieverlening intrekken of ten nadele van de
      subsidieontvanger wijzigen, indien:

      a. is gebleken dat niet wordt voldaan aan de vereisten, bedoeld in [artikel 2, tweede lid en vierde lid][ref1],
      aanhef en onder f;

      b. het project tussentijds wordt beëindigd;

      c. de subsidieontvanger onherroepelijk failliet is verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0012284#Artikel2
