  - number: '74.1'
    text: |-
      Landschapssubsidie wordt verstrekt ten behoeve van terreinen gelegen in natuurgebieden voor de instandhouding van
      een landschapspakket dat is opgenomen in een natuurgebiedsplan waarin het desbetreffende natuurgebied is opgenomen.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel74
  - number: '74.2'
    text: |-
      Onverminderd het eerste lid, wordt landschapssubsidie verstrekt ten behoeve van terreinen gelegen in bestaande
      bossen en natuurterreinen.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel74
  - number: '74.3'
    text: |-
      Landschapssubsidie wordt niet verstrekt ten behoeve van het beheer van terreinen in eigendom van een
      publiekrechtelijke rechtspersoon, tenzij die publiekrechtelijke rechtspersoon het terrein in gebruik heeft gegeven
      aan een ander, niet zijnde een publiekrechtelijke rechtspersoon, op basis van een erfpachtovereenkomst met een duur
      van ten minste 25 jaar.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel74
  - number: '75'
    text: Landschapssubsidie wordt verstrekt voor een tijdvak.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel75
  - number: '76.1'
    text: |-
      Indien op het terrein een landschapspakket in stand wordt gehouden, bedraagt de landschapssubsidie het bedrag
      per tijdvak dat wordt gevormd door de vermenigvuldiging van het getal zes met de beheersbijdrage opgenomen in de
      bijlagen van het desbetreffende landschapspakket en het aantal hectares waarvoor landschapssubsidie wordt verleend.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel76
  - number: '76.2'
    text: |-
      Indien op het terrein meerdere landschapspakketten in stand worden gehouden bedraagt de landschapssubsidie het
      bedrag per tijdvak de som van de beheersbijdragen die worden gevormd door de vermenigvuldiging van het getal zes
      met de beheersbijdragen opgenomen in de bijlagen van de desbetreffende landschapspakketten en het aantal hectares
      per landschapspakket waarvoor landschapssubsidie wordt verleend.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel76
  - number: '77'
    text: |-
      Indien landschapssubsidie wordt verstrekt voor de instandhouding van een of meerdere landschapspakketten binnen een
      terrein, vermeldt de beschikking tot subsidieverlening in ieder geval:
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel77
  - number: 77.a
    text: de ligging en grootte van het terrein;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel77
  - number: 77.b
    text: |-
      het doel van de landschapssubsidie, bestaande uit het gedurende het tijdvak op het terrein ontwikkelen of in stand
      houden van een of meerdere landschapspakketten;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel77
  - number: 77.c
    text: het bedrag, onderscheidenlijk de bedragen, op basis waarvan de landschapssubsidie zal worden vastgesteld, en
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel77
  - number: 77.d
    text: de datum waarop het tijdvak waarover landschapssubsidie wordt verleend, aanvangt.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel77
  - number: '78'
    text: 'De subsidieontvanger is verplicht:'
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel78
  - number: 78.a
    text: |-
      het in de beschikking tot subsidieverlening vermelde doel, bedoeld in [artikel 77, onderdeel b][ref1], te
      realiseren;


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel77
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '77'
        hoofdstuk: '8'
  - number: 78.b
    text: |-
      van omstandigheden als gevolg waarvan het redelijkerwijs niet mogelijk is te voldoen aan de verplichting, bedoeld
      in onderdeel a, binnen twee weken nadat de subsidieontvanger daarvan redelijkerwijs op de hoogte kan zijn aan de
      directeur van de Dienst Regelingen schriftelijk melding te doen, en
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel78
  - number: 78.c
    text: |-
      uiterlijk drie maanden nadat gehele of gedeeltelijke overdracht van de bevoegdheid tot gebruik en beheer van het
      betrokken terrein plaatsvindt, dit schriftelijk te melden aan de directeur van de Dienst Regelingen.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel78
  - number: '79.1'
    text: |-
      De [artikelen 25, eerste lid,][ref1][27][ref2], [28][ref3], [32][ref4], [34][ref5],
      [36, eerste en derde lid][ref6], [37][ref7] en [38, eerste lid][ref8], zijn van overeenkomstige toepassing.


