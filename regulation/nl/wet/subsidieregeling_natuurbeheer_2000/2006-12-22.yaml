  - number: '88.1'
    text: |-
      Een verzoek tot wijziging van de beschikking tot subsidieverlening kan worden gedaan met het oog op het vergroten
      van het areaal waarvoor subsidie is verleend.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel88
  - number: '88.2'
    text: |-
      Een verzoek als bedoeld in het eerste lid, kan slechts eenmaal per jaar worden gedaan te rekenen vanaf het jaar
      waarvoor de subsidie is verleend.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel88
  - number: '88.3'
    text: 'Een verzoek als bedoeld in het eerste lid, wordt slechts in behandeling genomen indien:'
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel88
  - number: 88.3.a
    text: |-
      op de toe te voegen terreinen hetzelfde basis-, plus- of landschapspakket wordt ontwikkeld, omgevormd of
      instandgehouden als dat waarvoor reeds subsidie is verleend of
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel88
  - number: 88.3.b
    text: |-
      de terreinen waarvoor subsidie wordt verzocht, voldoen aan de voorwaarden die voor de verlening van subsidies als
      bedoeld in deze regeling gelden.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel88
  - number: '88.4'
    text: |-
      In het geval, bedoeld in het derde lid, onderdeel a, zijn bepalingen omtrent minimumoppervlakte of minimumlengten,
      opgenomen in de basis-, plus-of landschapspakketten, niet van toepassing, voorzover de vergroting van het areaal
      een beheerseenheid vormt met de beheerseenheid waarvoor subsidie wordt verleend.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel88
  - number: '88.5'
    text: |-
      De [artikelen 1 tot en met 11, eerste lid][ref1], [12][ref2] en [19 tot en met 23][ref3] zijn ten aanzien van het
      verzoek, bedoeld in het eerste lid, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0010999#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0010999#Artikel19
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0010999
        artikel: '12'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0010999
        artikel: '19'
        hoofdstuk: '3'
  - number: '88.6'
    text: |-
      De subsidie met betrekking tot het vergroten van het areaal, bedoeld in het eerste lid, wordt naar evenredigheid
      verleend en vastgesteld voor het resterende gedeelte van het tijdvak, bedoeld in [artikel 24][ref1], waarvoor reeds
      subsidie was verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel24
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '88.7'
    text: |-
      Een verzoek als bedoeld in het eerste lid wordt afgewezen indien de subsidie door toewijzing van dat verzoek met
      minder dan € 50,– per jaar zou toenemen.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel88
  - number: 88a.1
    text: |-
      Een verzoek tot wijziging van de beschikking tot subsidieverlening kan worden gedaan met het oog op het verkleinen
      van het areaal waarvoor subsidie is verleend.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel88a
  - number: 88a.2
    text: |-
      Een verzoek als bedoeld in het eerste lid, kan slechts eenmaal per jaar worden gedaan te rekenen vanaf het jaar
      waarvoor de subsidie is verleend.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel88a
  - number: 88a.3
    text: |-
      Een verzoek als bedoeld in het eerste lid, wordt slechts in behandeling genomen indien het verkleinen van het
      areaal een gevolg is van de uitvoering van een werk ten algemene nutte.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel88a
  - number: 88a.4
    text: |-
      Bepalingen omtrent minimumoppervlakte of minimumlengten opgenomen in de beheerspakketten of landschapspakketten
      blijven van toepassing.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel88a
  - number: 88a.5
    text: |-
      De subsidie met betrekking tot het verkleinen van het areaal, bedoeld in het eerste lid, wordt naar evenredigheid
      verleend en vastgesteld voor het resterende gedeelte van het tijdvak, bedoeld in [artikel 24][ref1], waarvoor reeds
      subsidie was verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel24
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel88a
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 88b
    text: |-
      In geval subsidie is verleend met betrekking tot een terrein waarvan de oppervlakte waarop de subsidieverlening
      betrekking heeft groter is dan de daadwerkelijke oppervlakte wordt de subsidieverlening als volgt gewijzigd:
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel88b
  - number: 88b.a
    text: de subsidieverlening wordt gebaseerd op de daadwerkelijke oppervlakte als de afwijking ten hoogste 3% is;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel88b
  - number: 88b.b
    text: |-
      de subsidieverlening wordt gebaseerd op de daadwerkelijke oppervlakte, verminderd met tweemaal het vastgestelde
      verschil tussen de oppervlakte waarop de subsidieverlening betrekking heeft en de daadwerkelijke oppervlakte
      wanneer dit verschil groter is dan 3% of 2 hectare maar niet groter dan 20%;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel88b
  - number: 88b.c
    text: |-
      de subsidieverlening wordt ingetrokken, wanneer het verschil tussen de oppervlakte waarop de subsidieverlening
      betrekking heeft en de daadwerkelijke oppervlakte groter is dan 20%.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel88b
  - number: '89'
    text: |-
      In geval subsidie is verleend ten behoeve van een terrein, waarvan het recht tot gebruik en beheer berust bij de
      subsidieontvanger, en dat recht gaat over op een derde gedurende de periode waarover de desbetreffende subsidie is
      verleend, kan de desbetreffende subsidieverlening worden gewijzigd in een subsidieverlening aan die derde indien
      deze, uiterlijk drie maanden na de datum waarop het recht tot gebruik en beheer is overgegaan, bij wege van een aan
      de directeur van de Dienst Regelingen gericht schriftelijk stuk, verklaart te treden in de aan de subsidieverlening
      verbonden rechten en plichten, vanaf de datum met ingang waarvan de wijziging uit hoofde van dit lid van kracht
      zal zijn.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel89
  - number: '90.1'
    text: |-
      In geval subsidie is verleend op grond van [hoofdstuk 4][ref1], [6][ref2], 7 of [8][ref3] met betrekking tot
      een terrein waarvan het gebruiksrecht berust bij een natuurlijk persoon die overlijdt tijdens de periode waarover
      subsidie is verleend, wordt de desbetreffende subsidieverlening voor dat terrein ingetrokken met ingang van de dag,
      volgend op de dag van overlijden, op voorwaarde dat de erfgenamen uiterlijk drie maanden na het overlijden om deze
      intrekking verzoeken bij wege van een aan de directeur van de Dienst Regelingen gericht schriftelijk verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0010999#Hoofdstuk6
      [ref3]: https://wetten.overheid.nl/BWBR0010999#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0010999
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0010999
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0010999
        hoofdstuk: '8'
  - number: '90.2'
    text: |-
      In geval van intrekking uit hoofde van het eerste lid, wordt de subsidie over het tijdvak waarin het overlijden
      plaatsvond ambtshalve vastgesteld op het bedrag naar evenredigheid ten opzichte van de subsidie zoals die op grond
      van de subsidieverlening ten hoogste zou kunnen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel90
  - number: 90a.1
    text: |-
      Een aanvraag als bedoeld in [artikel 20a][ref1] die wordt ingediend tezamen met een verzoek van een beheerder of
      een ander dan een beheerder als bedoeld in [artikel 5][ref2] of [6][ref3] tot intrekking van een aan hem verleende
      subsidie voor het terrein waarop die aanvraag betrekking heeft, wordt niet gehonoreerd indien die aanvraag ertoe
      zou leiden dat minder dan vijf jaren subsidie voor het desbetreffende terrein kan worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel20a
      [ref2]: https://wetten.overheid.nl/BWBR0010999#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0010999#Artikel6
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel90a
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: 20a
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0010999
        artikel: '5'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0010999
        artikel: '6'
        hoofdstuk: '1'
  - number: 90a.2
    text: |-
      [Artikel 90, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel90
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel90a
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '90'
        hoofdstuk: '10'
  - number: '91.1'
    text: |-
      In geval subsidie is verleend op grond van de onderhavige regeling met betrekking tot een terrein dat deel uitmaakt
      van een gebied waar landinrichting uit kracht van de [Landinrichtingswet][ref1] geschiedt en het voldoen aan de
      aan desbetreffende subsidieverlening verbonden verplichtingen na vaststelling van het landinrichtingsplan niet meer
      mogelijk is, wordt de desbetreffende subsidieverlening ingetrokken met ingang van de dag, waarop in zodanig gebied
      de kavelovergang plaatsvindt ingevolge de in het plan van toedeling opgenomen bepalingen omtrent de inbezitneming,
      bedoeld in [artikel 196, tweede lid, onderdeel e, van de Landinrichtingswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003793
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel196
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0003793
      - id: ref2
        bwb_id: BWBR0003793
        artikel: '196'
  - number: '91.2'
    text: |-
      [Artikel 90, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel90
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '90'
        hoofdstuk: '10'
  - number: 91a.1
    text: |-
      Indien subsidie is verleend met betrekking tot een terrein dat is verworven door
      Staatsbosbeheer, het bureau beheer landbouwgronden of een instelling als bedoeld in
      __REF000___________________________________________________________________________________________________________
      ____________ en het de subsidieontvanger als gevolg van de overdracht aan een van de bedoelde organisaties niet
      meer mogelijk is te voldoen aan de verplichtingen verbonden aan de subsidieverlening, wordt de subsidieverlening
      ingetrokken met ingang van de dag, waarop de overdracht van het terrein heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0006085#Artikel3
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel91a
    references:
      - id: ref1
        bwb_id: BWBR0006085
        artikel: '3'
  - number: 91a.2
    text: |-
      In geval van intrekking op grond van het eerste lid, wordt de subsidie over het tijdvak waarin de verwerving
      plaatsvond ambtshalve vastgesteld op een bedrag evenredig met het deel van het tijdvak dat voor de overdracht is
      verstreken.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel91a
  - number: '92.1'
    text: |-
      In geval subsidie is verleend op grond van de onderhavige regeling met betrekking tot grond die wordt onteigend
      tijdens de periode waarover subsidie is verleend, wordt de desbetreffende subsidieverlening ingetrokken met ingang
      van de dag waarop het besluit tot onteigening van de betrokken grond onherroepelijk vaststaat.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel92
  - number: '92.2'
    text: |-
      [Artikel 90, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel90
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '90'
        hoofdstuk: '10'
  - number: '93'
    text: |-
      Onverschuldigd betaalde subsidies en voorschotten worden teruggevorderd, vermeerderd met de wettelijke rente tot de
      datum van ontvangst van de teruggevorderde bedragen.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel93
  - number: '94.1'
    text: |-
      Telkens wanneer met betrekking tot één of meer gronden, die zijn gelegen in een gebied als bedoeld in
      [artikel 13, eerste lid, onderdeel f, onderscheidenlijk g][ref1], aan het bureau beheer landbouwgronden een recht
      van eigendom of een daarvan afgeleid beperkt gebruiksrecht wordt aangeboden, is het bureau beheer landbouwgronden
      gehouden het hem aangeboden recht te verwerven.


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel13
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '13'
        hoofdstuk: '2'
  - number: '94.2'
    text: 'Het eerste lid geldt niet:'
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel94
  - number: 94.2.a
    text: |-
      voorzover het betrokken recht berust bij een publiekrechtelijk lichaam of een instelling als bedoeld in
      [artikel 3, eerste en tweede lid, van de Regeling subsidies particuliere natuurbeschermingsorganisaties][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006085#Artikel3
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0006085
        artikel: '3'
  - number: 94.2.b
    text: |-
      voorzover het aangeboden recht geen betrekking heeft op landbouwgrond, behoudens grond ten aanzien waarvan subsidie
      functieverandering is verleend.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel94
  - number: '95.1'
    text: |-
      Indien op de grond een verplichting is gevestigd als bedoeld in [artikel 46][ref1] en het bureau beheer
      landbouwgronden verwerving van het volle eigendomsrecht wordt aangeboden, wordt de door het bureau beheer
      landbouwgronden ter zake van dat recht te betalen grondprijs bepaald op basis van de som van:


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel46
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '46'
        hoofdstuk: '5'
  - number: 95.1.a
    text: |-
      de actuele waarde van de grond in het economisch verkeer bij bestemming natuur of bos, welke waarde wordt bepaald
      op basis van een daartoe door het bureau beheer landbouwgronden verrichte taxatie, en
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel95
  - number: 95.1.b
    text: |-
      de op het moment van verkoop nog niet uitbetaalde subsidie functieverandering, welke subsidies in contante waarde
      zijn uitgedrukt, rekening houdend met een jaarlijkse rentevoet van 4%.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel95
  - number: '95.2'
    text: |-
      Indien op de in [artikel 94][ref1] bedoelde landbouwgrond een verplichting is gevestigd als bedoeld in
      [artikel 46][ref2] en het bureau beheer landbouwgronden verwerving van een met een beperkt gebruiksrecht belast
      eigendomsrecht wordt aangeboden, wordt de door het bureau beheer landbouwgronden ter zake te betalen grondprijs
      bepaald op basis van de in het eerste lid bedoelde som, verminderd met de waarde van het desbetreffende beperkt
      gebruiksrecht, welke waarde wordt bepaald op basis van de in opdracht van het bureau beheer landbouwgronden
      verrichte taxatie.


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel94
      [ref2]: https://wetten.overheid.nl/BWBR0010999#Artikel46
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '94'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0010999
        artikel: '46'
        hoofdstuk: '5'
  - number: '95.3'
    text: |-
      In andere gevallen dan bedoeld in het eerste en tweede lid, wordt de door het bureau beheer landbouwgronden te
      betalen prijs bepaald op basis van de daartoe in opdracht van het bureau beheer landbouwgronden getaxeerde waarde
      van het aangeboden recht.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel95
  - number: '95.4'
    text: |-
      Bij de in het derde lid bedoelde taxatie wordt, in de gevallen waarin met betrekking tot de desbetreffende grond
      geen verplichting als bedoeld in [artikel 46][ref1] is gevestigd, geen rekening gehouden met de omstandigheid dat:


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel46
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '46'
        hoofdstuk: '5'
  - number: 95.4.a
    text: |-
      op de betrokken grond een aangepaste agrarische bedrijfsvoering uit hoofde van de Regeling beheersovereenkomsten
      en natuurontwikkeling, de Beschikking beheersovereenkomsten 1983, de Regeling beheersovereenkomsten 1988 of de
      Regeling beheersovereenkomsten 1993 plaatsvindt, en
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel95
  - number: 95.4.b
    text: de betrokken grond is gelegen in een natuurgebied.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel95
  - number: '96.1'
    text: |-
      Indien de uitkomst van de in opdracht van het bureau beheer landbouwgronden verrichte taxatie, bedoeld in
      [artikel 95, eerste tot en met derde lid][ref1], voor de andere partij niet aanvaardbaar is, vindt in opdracht
      van die partij nadere taxatie van de betrokken grond plaats door een driemanschap waarvan een lid wordt aangewezen
      door:


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel95
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '95'
        hoofdstuk: '11'
  - number: 96.1.a
    text: degene die het desbetreffende recht ter verwerving heeft aangeboden;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel96
  - number: 96.1.b
    text: het bureau beheer landbouwgronden, en
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel96
  - number: 96.1.c
    text: de onder a en b bedoelde personen gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel96
  - number: '96.2'
    text: |-
      Het driemanschap beslist bij meerderheid van stemmen. De beslissing van het driemanschap heeft kracht van bindend
      advies.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel96
  - number: '96.3'
    text: De kosten van de nadere taxatie, bedoeld in het eerste lid, worden gelijkelijk verdeeld tussen betrokken partijen.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel96
  - number: '97'
    text: |-
      De minister kan bij een in de Staatscourant bekend te maken besluit bepalen dat vanaf een door hem vast te stellen
      tijdstip de gehoudenheid van het bureau beheer landbouwgronden, bedoeld in [artikel 94, eerste lid][ref1], wordt
      opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel94
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '94'
        hoofdstuk: '11'
  - number: '98'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze regeling bepaalde zijn belast de ambtenaren van
      Dienst landelijk gebied van het Ministerie van Landbouw, Natuur en Voedselkwaliteit.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel98
  - number: '101.1'
    text: |-
      Beheerders die vóór 25 oktober 2003 een beschikking tot subsidieverlening hebben ontvangen met betrekking tot een
      bedrag als bedoeld in [artikel 30][ref1], zoals dat luidde tot 25 oktober 2003, behouden het recht op dat bedrag,
      tenzij zij met betrekking tot hetzelfde terrein tevens een bijdrage ontvangen voor een recreatiepakket als bedoeld
      in [bijlage 58][ref2], zoals die luidde tot 25 oktober 2003.


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0010999
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '30'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0010999
  - number: '101.2'
    text: |-
      Beheerders die vóór 25 oktober 2003 een beschikking tot subsidieverlening hebben ontvangen met betrekking tot
      de bijdrage voor begrensde waardevolle bosgemeenschappen als bedoeld in [bijlage 38, laatste alinea][ref1],
      zoals die luidde tot 25 oktober 2003, behouden het recht op die bijdrage tot het eind van het tijdvak waarop de
      subsidieverlening betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0010999
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0010999
  - number: '101.3'
    text: |-
      Beheerders die vóór 25 oktober 2003 een beschikking tot subsidieverlening hebben ontvangen met betrekking tot de
      recreatiebijdrage voor een recreatiepakket als bedoeld in [bijlage 58][ref1] of [59][ref2], zoals die luidden tot
      25 oktober 2003, ontvangen die bijdrage met ingang van 1 januari 2004 op grond van [bijlage 58][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0010999
      [ref2]: https://wetten.overheid.nl/BWBR0010999
      [ref3]: https://wetten.overheid.nl/BWBR0010999
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0010999
      - id: ref2
        bwb_id: BWBR0010999
      - id: ref3
        bwb_id: BWBR0010999
  - number: 101a.1
    text: |-
      Beheerders die vóór 25 oktober 2003 een beschikking tot subsidieverlening hebben ontvangen met betrekking
      tot een landschapspakket als bedoeld in de [bijlagen 42 tot en met 46][ref1] of [49][ref2], zoals die luidden
      tot 25 oktober 2003, waarin een bedekking van minder dan 90% was opgenomen, zijn in zoverre in afwijking van
      [artikel 78, onderdeel a][ref3], slechts verplicht tot het in stand houden van het landschapspakket, genoemd in
      [bijlage 42][ref4], met het in de subsidieverlening vastgestelde lagere bedekkingspercentage tegen de daarbij
      behorende lagere vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0010999
      [ref2]: https://wetten.overheid.nl/BWBR0010999
      [ref3]: https://wetten.overheid.nl/BWBR0010999#Artikel78
      [ref4]: https://wetten.overheid.nl/BWBR0010999
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel101a
    references:
      - id: ref1
        bwb_id: BWBR0010999
      - id: ref2
        bwb_id: BWBR0010999
      - id: ref3
        bwb_id: BWBR0010999
        artikel: '78'
        hoofdstuk: '8'
      - id: ref4
        bwb_id: BWBR0010999
  - number: 101a.2
    text: |-
      Bij de berekening op grond van het eerste lid wordt voor beheerders die een beheersbijdrage ontvangen voor een
      landschapspakket opgenomen in [bijlage 49][ref1], zoals die luidde tot 25 oktober 2003 een omrekenfactor van 2528
      gehanteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0010999
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel101a
    references:
      - id: ref1
        bwb_id: BWBR0010999
  - number: 101b.1
    text: |-
      Op een aanvraag voor subsidie op grond van [hoofdstuk 5][ref1], zoals dat luidde tot 1 oktober 2004, die is
      ingediend vóór die datum, blijven dat hoofdstuk en de [bijlagen 1 tot en met 11c][ref2], zoals die luidden tot 1
      oktober 2004, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0010999
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel101b
    references:
      - id: ref1
        bwb_id: BWBR0010999
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0010999
  - number: 101b.2
    text: |-
      In afwijking van de [artikelen 44 tot en met 46][ref1] blijven op een aanvraag voor subsidie op grond van
      [hoofdstuk 5][ref2], zoals dat luidt met ingang van 1 oktober 2004, de [artikelen 44 tot en met 49][ref3] en de
      [bijlagen 1 tot en met 11c][ref4], zoals die luidden tot 1 oktober 2004, van toepassing, als is voldaan aan elk van
      de volgende voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0010999#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0010999#Artikel44
      [ref4]: https://wetten.overheid.nl/BWBR0010999
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel101b
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '44'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0010999
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0010999
        artikel: '44'
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0010999
  - number: 101b.2.a
    text: |-
      bij de aanvraag is verzocht om toepassing van de [artikelen 44 tot en met 49][ref1] en de
      [bijlagen 1 tot en met 11c][ref2], zoals die luidden tot 1 oktober 2004;


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0010999
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel101b
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '44'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0010999
  - number: 101b.2.b
    text: de aanvraag heeft betrekking op het begrotingsjaar 2005 of 2006; en
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel101b
  - number: 101b.2.c
    text: 'de aanvrager heeft vóór 26 juli 2004:'
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel101b
  - number: 101b.2.c.i
    text: |-
      een aanvraag voor subsidie functieverandering ingediend, maar zijn aanvraag is afgewezen omdat hij niet aan alle
      subsidievoorwaarden heeft voldaan;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel101b
  - number: 101b.2.c.ii
    text: |-
      bij de betrokken gemeente een verzoek ingediend tot wijziging van het desbetreffende bestemmingsplan ten behoeve
      van particulier natuurbeheer en kan dit met schriftelijke bescheiden staven; of
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel101b
  - number: 101b.2.c.iii
    text: |-
      contact gehad met het bestuur van de betrokken provincie over concrete plannen voor functieverandering en kan dit
      met schriftelijke bescheiden staven.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel101b
  - number: 101b.3
    text: |-
      Voor de toepassing van het eerste en tweede lid wordt de termijn, bedoeld in [artikel 46, eerste lid][ref1], zoals
      dat luidde tot 1 oktober 2004, in voorkomend geval verlengd tot 1 november 2006.


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel46
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel101b
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '46'
        hoofdstuk: '5'
  - number: 101b.4
    text: |-
      De minister kan voor de toepassing van subsidie op grond van [hoofdstuk 5][ref1], zoals dat luidde tot 1 oktober
      2004, kennis geven in de Staatscourant van wijzigingen op de [bijlagen 1 tot en met 11c][ref2], zoals die luidden
      tot 1 oktober 2004.


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0010999
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel101b
    references:
      - id: ref1
        bwb_id: BWBR0010999
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0010999
  - number: 101c
    text: |-
      Beheerders die vóór 1 oktober 2004 een beschikking tot subsidieverlening hebben ontvangen met betrekking tot
      een beheersbijdrage voor een pluspakket als bedoeld in [bijlage 31][ref1] of [32][ref2], zoals die luidden tot 1
      oktober 2004, ontvangen die bijdrage met ingang van 1 januari 2005 op grond van [bijlage 31][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0010999
      [ref2]: https://wetten.overheid.nl/BWBR0010999
      [ref3]: https://wetten.overheid.nl/BWBR0010999
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel101c
    references:
      - id: ref1
        bwb_id: BWBR0010999
      - id: ref2
        bwb_id: BWBR0010999
      - id: ref3
        bwb_id: BWBR0010999
  - number: 101d
    text: |-
      Op aanvragen die zijn ingediend vóór 1 november 2005 blijft [bijlage 37][ref1] zoals die luidt tot 1 november 2005
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010999
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel101d
    references:
      - id: ref1
        bwb_id: BWBR0010999
  - number: 101e
    text: |-
      Op aanvragen die zijn ingediend vóór 1 november 2005 blijft[ bijlage 38][ref1], [39 ][ref2]onderscheidenlijk
      [62][ref3] zoals die luidt tot 1 november 2005 van toepassing voor zover de subsidieontvanger wel voldoet aan
      alle voorwaarden van die bijlage en niet aan alle voorwaarden van [bijlage 38][ref4], [39][ref5] onderscheidenlijk
      [62 ][ref6]zoals die luidt met ingang van 1 november 2005.


      [ref1]: https://wetten.overheid.nl/BWBR0010999
      [ref2]: https://wetten.overheid.nl/BWBR0010999
      [ref3]: https://wetten.overheid.nl/BWBR0010999
      [ref4]: https://wetten.overheid.nl/BWBR0010999
      [ref5]: https://wetten.overheid.nl/BWBR0010999
      [ref6]: https://wetten.overheid.nl/BWBR0010999
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel101e
    references:
      - id: ref1
        bwb_id: BWBR0010999
      - id: ref2
        bwb_id: BWBR0010999
      - id: ref3
        bwb_id: BWBR0010999
      - id: ref4
        bwb_id: BWBR0010999
      - id: ref5
        bwb_id: BWBR0010999
      - id: ref6
        bwb_id: BWBR0010999
  - number: 101f
    text: |-
      Beheerders die naar aanleiding van een vóór 1 november 2005 ingediende aanvraag voor subsidieverlening een
      beschikking tot subsidieverlening hebben ontvangen met betrekking tot een beheersbijdrage voor een pluspakket
      als bedoeld in [bijlage 37][ref1], zoals die luidde tot 1 november 2005, ontvangen die bijdrage met ingang van 1
      januari 2006 op grond van [bijlage 38][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010999
      [ref2]: https://wetten.overheid.nl/BWBR0010999
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel101f
    references:
      - id: ref1
        bwb_id: BWBR0010999
      - id: ref2
        bwb_id: BWBR0010999
  - number: '102.1'
    text: |-
      Subsidies of voorschotten daarop worden verleend onder het voorbehoud van goedkeuring van Commissie van de Europese
      Gemeenschappen.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel102
  - number: '102.2'
    text: |-
      De beslissing tot verlening van een subsidie of een voorschot daarop kan worden ingetrokken of gewijzigd ter
      verkrijging van de goedkeuring van de Commissie van de Europese Gemeenschappen voor deze regeling, of wegens het
      uitblijven daarvan.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel102
  - number: '103.1'
    text: De begrenzing van een natuurgebiedsplan die op grond van de Subsidieregeling natuurbeheer
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel103
  - number: '103.2'
    text: |-
      De regeling, opgenomen in Subsidieregeling natuurbeheer, inzake de begrenzing van een natuurgebiedsplan,
      is van toepassing ten aanzien van voornemens tot vaststelling van zodanige begrenzingen die op grond van
      [artikel 3.11 van de Algemene wet bestuursrecht][ref1] jo. artikel 13 van die regeling op het tijdstip van
      inwerkingtreding van deze regeling ter inzage liggen of hebben gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '103.3'
    text: |-
      Subsidie wordt verstrekt ten behoeve van een terrein dat is gelegen in een natuurgebied als bedoeld in het
      eerste lid met het oog op de ontwikkeling van een beheerspakket, voorzover dat beheerspakket, blijkens de in
      [bijlage 61][ref1] opgenomen tabel, in overeenstemming is met het desbetreffende natuurgebiedsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0010999
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0010999
  - number: '104.1'
    text: De Tijdelijke regeling particulier natuurbeheer
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel104
  - number: '104.2'
    text: Op subsidies verleend op grond van de in het eerste lid bedoelde regeling, blijft die regeling van toepassing.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel104
  - number: '104.3'
    text: |-
      Indien beheerders die op grond van de Tijdelijke regeling particulier natuurbeheer subsidie is verleend, subsidie
      aanvragen op grond van de onderhavige regeling:
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel104
  - number: 104.3.a
    text: |-
      is [artikel 23][ref1] niet van toepassing, en


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel23
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '23'
        hoofdstuk: '3'
  - number: 104.3.b
    text: |-
      zullen subsidies en voorschotten die reeds zijn verstrekt, worden verrekend met te verstrekken subsidies op grond
      van de onderhavige regeling.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel104
  - number: '104.4'
    text: |-
      Tot 1 maart 2002 kunnen beheerders, die subsidie ontvangen op grond van de in het eerste lid bedoelde regeling, een
      aanvraag indienen tot omzetting van de desbetreffende beschikking tot subsidieverlening naar een beschikking tot
      subsidieverlening op grond van deze regeling.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel104
  - number: '105.1'
    text: De Bijdrageregeling beheer samenwerking bos 1993
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel105
  - number: '105.2'
    text: Op subsidies, verleend op grond van de in het eerste lid genoemde regeling, blijft die regeling van toepassing.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel105
  - number: 106a
    text: |-
      Indien op grond van de [Regeling subsidies particuliere terreinbeherende natuurbeschermingsorganisaties][ref1]
      of de Regeling functiebeloning bos en natuurterreinen voor 1 januari 2000 voor een terrein een beheerssubsidie
      is verleend zonder dat dit terrein is gelegen in een natuurgebiedsplan, dan is het in afwijking van de laatste
      volzin van [bijlage 34][ref2], [punt 1][ref3], en de laatste volzin van [bijlage 35][ref4], [punt 1][ref5],
      niet vereist dat de beheerseenheid is gelegen in een natuurgebiedsplan waarvoor de pluspakketten, bedoeld in de
      [bijlagen 34][ref6] en [35][ref7], zijn opengesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006085
      [ref2]: https://wetten.overheid.nl/BWBR0010999
      [ref3]: https://wetten.overheid.nl/BWBR0010999
      [ref4]: https://wetten.overheid.nl/BWBR0010999
      [ref5]: https://wetten.overheid.nl/BWBR0010999
      [ref6]: https://wetten.overheid.nl/BWBR0010999
      [ref7]: https://wetten.overheid.nl/BWBR0010999
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel106a
    references:
