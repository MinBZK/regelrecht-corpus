  - number: '1.1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel1
  - number: 1.1.a
    text: 'minister: Minister van Landbouw, Natuur en Voedselkwaliteit;'
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel1
  - number: 1.1.b
    text: 'terrein: gebied, niet zijnde een erf of tuin, dat niet wordt doorsneden door:'
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel1
  - number: 1.1.b.i
    text: wegen breder dan 5 meter,
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel1
  - number: 1.1.b.ii
    text: waterlopen die op enig punt breder zijn dan 25 meter,
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel1
  - number: 1.1.b.iii
    text: een dubbelsporige spoorlijn, of
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel1
  - number: 1.1.b.iv
    text: een geëlektrificeerde spoorlijn, en ten hoogste tot een oppervlakte van 1% van het gebied bestaat uit bebouwing;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel1
  - number: 1.1.c
    text: |-
      beheerder: eigenaar van een terrein, erfpachter van een terrein met een erfpachtovereenkomst met een
      duur van ten minste 25 jaar of gebruiksgerechtigde op basis van een plan van tijdelijk gebruik als
      bedoeld in [artikel 189 van de Landinrichtingswet][ref1] van een terrein dat is begrensd ingevolge
      [artikel 142, eerste lid, onderdeel b, van de Landinrichtingswet][ref2] of dat in het landinrichtingsplan, bedoeld
      in [artikel 73 van de Landinrichtingswet][ref3], is aangeduid als te realiseren natuurterrein of reservaat;


