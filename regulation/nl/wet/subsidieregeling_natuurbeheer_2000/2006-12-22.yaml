  - number: '108.1'
    text: De Regeling stimulering bosuitbreiding op landbouwgronden wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel108
  - number: '108.2'
    text: Op subsidies verleend op grond van de in het eerste lid bedoelde regeling, blijft die regeling van toepassing.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel108
  - number: '110'
    text: De Subsidieregeling natuurbeheer wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel110
  - number: '111.1'
    text: De Regeling functiebeloning bos en natuurterreinen wordt met ingang van 1 januari 2000 ingetrokken.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel111
  - number: '111.2'
    text: Op subsidies verleend op grond van de in het eerste lid bedoelde regeling, blijft die regeling van toepassing.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel111
  - number: '112'
    text: Deze regeling treedt in werking met ingang van op 1 januari 2000.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel112
  - number: '113'
    text: |-
      Deze regeling wordt aangehaald als: [Subsidieregeling natuurbeheer 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010999
