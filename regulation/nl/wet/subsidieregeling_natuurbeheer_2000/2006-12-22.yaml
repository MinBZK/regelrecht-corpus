  - number: 1.1.aa
    text: |-
      verdunningsfactor: quotiënt van de oppervlakte van de grond verkregen door hemelsbreed een lijn te trekken om de
      buitenste hoeken van de buitenste terreinen waarvoor subsidie wordt aangevraagd en de totale oppervlakte van de in
      dat gebied gelegen terreinen waarvoor subsidie wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van deze regeling wordt onder ‘terrein’ mede verstaan: samenstel van terreinen dat door een
      beheerder als een geheel wordt beheerd.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel1
  - number: '1.3'
    text: |-
      Ten aanzien van een aanvraag voor subsidie die is ingediend vóór 25 oktober 2003 wordt, in zoverre in afwijking
      van het eerste lid, onderdeel c, voor de toepassing van deze regeling onder beheerder verstaan: ondernemer, dan
      wel enige andere natuurlijke persoon of rechtspersoon die krachtens zakelijk of duurzaam persoonlijk recht beschikt
      over het recht tot gebruik en beheer van een terrein, doch voor zover het een vereniging betreft, slechts een
      vereniging met volledige rechtsbevoegdheid.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel1
  - number: '2'
    text: |-
      De minister kan aan beheerders en aan anderen dan beheerders als bedoeld in [artikel 5][ref1] en [6][ref2] ter
      bevordering van de duurzame ontwikkeling en instandhouding van bossen en natuurterreinen, mede met het oog op
      de recreatieve functie daarvan, wegens inkomstenderving als gevolg van het verminderde productierendement van
      landbouwgronden, alsmede ter bevordering van de duurzame instandhouding van landschappelijke elementen op aanvraag
      subsidie verstrekken ten behoeve van:


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0010999#Artikel6
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '5'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0010999
        artikel: '6'
        hoofdstuk: '1'
  - number: 2.a
    text: |-
      de instandhouding van basis- of pluspakketten, opgenomen in de [bijlagen 12 tot en met 41][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010999
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010999
  - number: 2.b
    text: de functieverandering van landbouwgronden naar natuur en bos door de ontwikkeling van basis- of pluspakketten.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel2
  - number: 2.c
    text: |-
      de ontwikkeling en omvorming van basis- of pluspakketten, onderscheidenlijk de aanleg of het herstel van
      landschapspakketten, door middel van maatregelen met een eenmalig karakter, die rechtstreeks en direct de
      fysieke condities of kenmerken van de desbetreffende terreinen wijzigen, of door middel van beheer, zonder
      welke wijzigingen en beheer de daarop volgende instandhouding van basis- of pluspakketten, onderscheidenlijk
      landschapspakketten, niet mogelijk is;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel2
  - number: 2.d
    text: |-
      de instandhouding van het recreatiepakket, opgenomen in [bijlage 58][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0010999
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010999
  - number: 2.e
    text: |-
      de instandhouding van landschapspakketten, opgenomen in de [bijlagen 42 tot en met 56][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010999
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010999
  - number: '3.1'
    text: 'Subsidie wordt niet verstrekt aan:'
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel3
  - number: 3.1.a
    text: |-
      andere publiekrechtelijke rechtspersonen dan aan gemeenten en aan samenwerkingsverbanden als bedoeld in de
      [Wet gemeenschappelijke regelingen][ref1] voorzover aan die samenwerkingsverbanden in meerderheid gemeenten
      deelnemen;


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: 3.1.b
    text: rechtspersonen die als doelstelling de winning van drink- of industriewater hebben, noch
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel3
  - number: 3.1.c
    text: |-
      privaatrechtelijke rechtspersonen die kennelijk zijn opgericht ten behoeve van het beheer van grond of water,
      waarvan de eigendom geheel of ten dele berust bij de in de onderdelen a en b bedoelde rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel3
  - number: '3.2'
    text: |-
      Aan gemeenten of samenwerkingsverbanden als bedoeld in het eerste lid, onderdeel a, kan subsidie worden verstrekt
      overeenkomstig de [hoofdstukken 4][ref1] en [6][ref2], met dien verstande dat het desbetreffende terrein
      overeenkomstig zijn functie in een goedgekeurd bestemmingsplan is bestemd en gedurende het tijdvak waarvoor
      subsidie is verleend, deze bestemming niet wordt gewijzigd en dat de beschikking tot subsidieverlening vergezeld
      gaat van een overeenkomst ertoe strekkende dat alvorens een recht tot eigendom van het terrein gedurende de periode
      waarover subsidie wordt verleend aan anderen wordt aangeboden, het bureau beheer landbouwgronden als eerste in de
      gelegenheid wordt gesteld dit recht te verwerven.


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0010999#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0010999
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0010999
        hoofdstuk: '6'
  - number: '4'
    text: |-
      Voorzover voor dezelfde of vergelijkbare doeleinden eveneens subsidie wordt verstrekt door de minister of
      andere overheidsorganen en hierdoor het totaal van de overheidsbijdrage meer bedraagt dan de desbetreffende
      beheersbijdrage opgenomen in de desbetreffende bijlage dan wel, voor zover het inrichtingssubsidie betreft, meer
      bedraagt dan 95% van de werkelijke kosten, wordt de subsidie op grond van deze regeling zoveel lager vastgesteld
      dat het totaal van de overheidsbijdragen die beheersbijdrage, onderscheidenlijk die 95%, niet overstijgt.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel4
  - number: '5.1'
    text: |-
      Subsidie aan anderen dan beheerders kan worden verstrekt indien op het tijdstip van indiening van de
      subsidieaanvraag:
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel5
  - number: 5.1.a
    text: |-
      tussen de beheerder en de subsidieaanvrager een schriftelijke overeenkomst tot stand is gekomen, bij welke
      overeenkomst:
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel5
  - number: 5.1.a.1º
    text: |-
      de subsidieaanvrager het recht op uitbetaling van subsidies en voorschotten uit hoofde van deze regeling,
      betrekking hebbend op het desbetreffende terrein, bij voorbaat aan de beheerder overdraagt, en
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel5
  - number: 5.1.a.2º
    text: |-
      de beheerder zich bij voorbaat verbindt tot de nakoming van de verplichtingen waartoe de subsidieaanvrager uit
      hoofde van deze regeling met betrekking tot het desbetreffende terrein gehouden is, zolang de beheerder beschikt
      over het recht tot gebruik en beheer van het desbetreffende terrein, alsmede zich verbindt, bij overdracht van
      het desbetreffende gebruiksrecht aan een ander dan het bureau beheer landbouwgronden, van de verkrijger daarvan te
      bedingen dat deze, vanaf het moment van verkrijging, de in deze volzin bedoelde verplichtingen zal nakomen en zulks
      ook van zijn rechtsopvolger zal bedingen, en
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel5
  - number: 5.1.b
    text: |-
      de beheerder jegens de Staat der Nederlanden schriftelijk heeft verklaard borg te staan voor de terugbetaling van
      onverschuldigd betaalde subsidies en voorschotten.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel5
  - number: '5.2'
    text: |-
      Bij het aangaan van een overeenkomst als bedoeld in het eerste lid, onderdeel a, en het geven van een schriftelijke
      verklaring als bedoeld in het eerste lid, onderdeel b, wordt gebruik gemaakt van het model, opgenomen in
      [bijlage 63][ref1] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0010999
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010999
  - number: '6.1'
    text: 'Subsidie aan anderen dan beheerders kan worden verstrekt indien:'
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel6
  - number: 6.1.a
    text: die subsidieaanvrager rechtspersoon met volledige rechtsbevoegdheid is;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel6
  - number: 6.1.b
    text: |-
      die rechtspersoon hoofdzakelijk of mede ten doel heeft haar leden of aangeslotenen te ondersteunen bij een
      bedrijfsvoering die bevorderlijk is voor natuur en milieu, en
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel6
  - number: 6.1.c
    text: de leden of aangeslotenen, bedoeld in onderdeel b, beheerder zijn, voorzover die worden ondersteund.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel6
  - number: '6.2'
    text: |-
      Subsidie aan aanvragers, als bedoeld in het eerste lid, kan voorts slechts worden verstrekt indien bij de
      subsidieaanvraag door de rechtspersoon wordt overgelegd:
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel6
  - number: 6.2.a
    text: 'een plan waaruit blijkt:'
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel6
  - number: 6.2.a.i
    text: op welke wijze de subsidie door de rechtspersoon zal worden besteed;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel6
  - number: 6.2.a.ii
    text: |-
      op welke wijze de besteding van de subsidie ter beschikking komt van de in het eerste lid, onderdeel b, bedoelde
      leden of aangeslotenen;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel6
  - number: 6.2.a.iii
    text: op welke wijze de nakoming van de subsidieverplichtingen door de rechtspersoon wordt gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel6
  - number: '6.3'
    text: |-
      Om voor subsidie in aanmerking te kunnen komen, behoeven de statuten van de subsidieaanvrager, bedoeld in het
      eerste lid, alsmede het plan, bedoeld in het tweede lid, onderdeel a, en het reglement, bedoeld in het tweede lid,
      onderdeel b, de goedkeuring van de minister.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel6
  - number: '7.1'
    text: |-
      De minister stelt voor ieder begrotingsjaar een subsidieplafond vast voor de te verstrekken subsidies, bedoeld
      in [artikel 2][ref1]. Hij kan daarbij voor de in dat artikel onderscheiden subsidies, voor de verschillende
      maatregelen, bedoeld in [artikel 2, onderdelen c en d][ref2], alsmede per provincie, per natuurgebied, en voor
      de verschillende pakketten of voor verschillende categorieën subsidieaanvragen verschillende subsidieplafonds
      vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010999#Artikel2
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0010999
        artikel: '2'
        hoofdstuk: '1'
  - number: '7.2'
    text: |-
      De minister stelt tevens voor ieder begrotingsjaar met inachtneming van de subsidieplafonds, bedoeld in het eerste
      lid, afzonderlijk subsidieplafonds vast voor subsidie die wordt verstrekt ten behoeve van terreinen waarop de in
      het natuurgebiedsplan opgenomen doelstellingen, als bedoeld in [artikel 13, eerste lid, onderdeel b][ref1], worden
      ontwikkeld, onderscheidenlijk in stand gehouden en waarvoor eveneens subsidie functieverandering wordt verstrekt.
      De minister houdt daarbij rekening met alle reeds aangegane verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel13
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '13'
        hoofdstuk: '2'
  - number: '7.3'
    text: Van de vaststelling van subsidieplafonds geeft de minister kennis in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel7
  - number: '7.4'
    text: |-
      De minister verdeelt de beschikbare bedragen naar de datum van ontvangst van de subsidieaanvragen. Bij
      gelijktijdige datum van ontvangst van de subsidieaanvragen wordt de volgorde van behandeling bepaald door loting.
      Als datum van ontvangst wordt aangemerkt de datum waarop de aanvraag volledig is ontvangen.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel7
  - number: '7.5'
    text: |-
      De minister kan voor de verschillende subsidies en voor de verschillende basis-, plus-, landschaps- en
      recreatiepakketten of voor verschillende categorieën subsidieaanvragers, verschillende aanvraagperioden instellen.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel7
  - number: '7.6'
    text: |-
      Aanvragen worden alleen voor die subsidies en basis-, plus-, landschaps-, of recreatiepakketten of categorieën
      subsidieaanvragers in behandeling genomen, waarvoor een aanvraagperiode als bedoeld in het vijfde lid is ingesteld.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel7
  - number: '7.7'
    text: Voor aanvragen wordt gebruik gemaakt van een daartoe vastgesteld aanvraagformulier.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel7
  - number: '7.8'
    text: |-
      Aanvragen tot subsidieverlening worden beoordeeld aan de hand van natuurgebiedsplannen zoals deze door gedeputeerde
      staten van een provincie zijn vastgesteld en van kracht zijn uiterlijk 25 dagen voor openstelling van de
      desbetreffende aanvraagperiode.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel7
  - number: '8.1'
    text: |-
      De beheersbijdragen en de recreatiebijdrage van basispakketten, pluspakketten, landschapspakketten en het
      recreatiepakket en het maximumbedrag aan inrichtingssubsidie worden jaarlijks voor 1 maart van het jaar waarop
      de bijdragen betrekking hebbenin voorkomend geval met terugwerkende kracht tot 1 januari van dat jaar door de
      minister gecorrigeerd voor de werkelijke loon- en prijsontwikkeling gebaseerd op de grondslagen, bedoeld in
      [artikel 10][ref1], naar de situatie in het voorafgaande jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel10
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '10'
        hoofdstuk: '1'
  - number: '8.2'
    text: |-
      Van de vaststelling van de overeenkomstig het eerste lid gecorrigeerde beheersbijdragen, recreatiebijdrage en
      maximumbedrag aan inrichtingssubsidie geeft de minister kennis in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel8
  - number: '9'
    text: |-
      Indien beheerssubsidie, onderscheidenlijk inrichtingssubsidie, wordt aangevraagd door een beheerder aan
      wie, voorafgaand aan de aanvraag, reeds subsidie functieverandering, en beheerssubsidie, onderscheidenlijk
      inrichtingssubsidie, op grond van deze regeling is verstrekt, wordt beheerssubsidie, onderscheidenlijk
      inrichtingssubsidie, bij voorrang verstrekt, indien hij:
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel9
  - number: 9.a
    text: |-
      beheerssubsidie, onderscheidenlijk inrichtingssubsidie, aanvraagt voor een basis- of pluspakket dat is opgenomen in
      het natuurgebiedsplan;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel9
  - number: 9.b
    text: |-
      beheerssubsidie, onderscheidenlijk inrichtingssubsidie, aanvraagt ten behoeve van een terrein dat niet is gelegen
      in een natuurgebied voor een basis- of pluspakket opgenomen in de [bijlagen 20][ref1], [37][ref2] en [38][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0010999
      [ref2]: https://wetten.overheid.nl/BWBR0010999
      [ref3]: https://wetten.overheid.nl/BWBR0010999
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0010999
      - id: ref2
        bwb_id: BWBR0010999
      - id: ref3
        bwb_id: BWBR0010999
  - number: 9.c
    text: de ontwikkeling van een in het natuurgebiedsplan opgenomen basis- of pluspakket mogelijk maakt.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel9
  - number: '10'
    text: |-
      Bij het vaststellen van de beheersbijdrage of recreatiebijdrage van een basispakket, pluspakket, recreatiepakket of
      landschapspakket als bedoeld in [artikel 8][ref1] wordt rekening gehouden met de volgende grondslagen:


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel8
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '8'
        hoofdstuk: '1'
  - number: 10.a
    text: vorm van exploitatie;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel10
  - number: 10.b
    text: aan het beheer gerelateerde overheadkosten en
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel10
  - number: 10.c
    text: |-
      direct aan het beheer toe te rekenen kosten, zoals kosten voor personeel, materieel, monitoring en toezicht,
      verminderd met opbrengsten die direct met het produceren van het pakket verband houden.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel10
  - number: '11.1'
    text: |-
      Subsidie wordt niet verstrekt aan beheerders ter voldoening aan verplichtingen die op grond van enig ander
      wettelijk voorschrift zijn voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel11
  - number: '11.2'
    text: Subsidie wordt niet verstrekt indien de subsidie minder dan € 170,– per jaar bedraagt.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel11
  - number: 11a
    text: |-
      Indien de aanvrager in een jaar opzettelijk een onjuiste aanvraag tot subsidieverlening op grond van deze regeling
      heeft ingediend, wordt geen subsidie verstrekt voor het daaropvolgende jaar.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel11a
  - number: '12.1'
    text: |-
      De minister kan beleidsregels vaststellen met betrekking tot het aantal van een planten- en diersoort, bedoeld in
      de onderscheidene basis-, plus- en landschapspakketten per oppervlaktemaat en de spreiding van de betreffende soort
      binnen de beheerseenheid, onderscheidenlijk de oppervlaktemaat.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel12
  - number: '12.2'
    text: |-
      Beleidsregels als bedoeld in het eerste lid worden als [bijlage][ref1] bij deze regeling opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0010999
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0010999
  - number: '13.1'
    text: |-
      Ten behoeve van de uitvoering van deze regeling worden natuurgebieden begrensd met de vaststelling van
      natuurgebiedsplannen, die in ieder geval bevatten:
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel13
  - number: 13.1.a
    text: |-
      een kaart met een topografische ondergrond op ten hoogste schaal 1 : 25.000, waarin de grenzen van het natuurgebied
      zijn opgenomen;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel13
  - number: 13.1.b
    text: een omschrijving van de in het natuurgebied nagestreefde doelstellingen op het gebied van natuur en bos;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel13
  - number: 13.1.c
    text: de in het desbetreffende natuurgebied om te vormen of te ontwikkelen basis- of pluspakketten;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel13
  - number: 13.1.d
    text: de in het desbetreffende natuurgebied aan te leggen, te herstellen of in stand te houden landschapspakketten;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel13
  - number: 13.1.e
    text: |-
      het aantal hectares ten behoeve waarvan in het natuurgebied beheerssubsidie kan worden verleend op grond van de
      [Subsidieregeling agrarisch natuurbeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0011000
  - number: 13.1.f
    text: |-
      een aanduiding waar verwerving van in het natuurgebied gelegen landbouwgronden of andere
      gronden met het oog op natuurontwikkeling, ten behoeve van een instelling als bedoeld in
      __REF000___________________________________________________________________________________________________________
      __, dan wel ten behoeve van Staatsbosbeheer niet uitsluitend wordt nagestreefd, en


      [ref1]: https://wetten.overheid.nl/BWBR0006085#Artikel3
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006085
        artikel: '3'
  - number: 13.1.g
    text: |-
      een aanduiding waar verwerving van in het natuurgebied gelegen landbouwgronden of andere gronden met het
      oog op natuurontwikkeling, uitsluitend wordt nagestreefd ten behoeve van een instelling als bedoeld in
      __REF000___________________________________________________________________________________________________________
      __ of ten behoeve van Staatsbosbeheer dan wel ten behoeve van een instelling als bedoeld in
      [artikel 3, tweede lid, van die regeling][ref2], doch ten aanzien van deze laatstbedoelde instellingen slechts
      voorzover die gronden zijn gelegen in een door de minister goedgekeurd begrenzingenplan als bedoeld in het derde
      lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0006085#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006085#Artikel3
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006085
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0006085
        artikel: '3'
  - number: '13.2'
    text: |-
      Bij een aanduiding als bedoeld in het eerste lid, onderdeel f, kan worden vastgesteld in welke mate subsidies als
      bedoeld in [artikel 2][ref1] ten behoeve van de ontwikkeling of omvorming van basis- of pluspakketten slechts aan
      instellingen als bedoeld in die onderdelen kunnen worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel2
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '2'
        hoofdstuk: '1'
  - number: '13.3'
    text: |-
      In het natuurgebiedsplan kan een ruilgebied worden begrensd waarvan de grenzen op de in het eerste lid, onderdeel
      a, bedoelde kaart zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel13
  - number: '13.4'
    text: |-
      Indien bij de vaststelling van de natuurgebiedsplannen niet met zekerheid kan worden bepaald dat de toepassing
      van de landschapspakketten opgenomen in [bijlagen 32 tot en met 46][ref1] op alle locaties van het betreffende
      natuurgebied daadwerkelijk bijdraagt aan het bereiken van de in het eerste lid, onderdeel b, bedoelde
      doelstellingen, wordt in het natuurgebiedsplan tevens opgenomen dat de minister bij de besluitvorming omtrent
      subsidieverlening kan toetsen of het verlenen van subsidie voor een landschapspakket op de desbetreffende locatie
      doelmatig is.


      [ref1]: https://wetten.overheid.nl/BWBR0010999
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0010999
  - number: '13.5'
    text: |-
      Voor zover in natuurgebiedsplannen quota zijn opgenomen wordt met deze quota geen rekening gehouden bij de
      beoordeling van subsidieaanvragen.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel13
  - number: '13.6'
    text: |-
      Voor zover natuurgebiedsplannen voorzien in het aanleggen, herstellen of in stand houden van het landschapspakket
      dat is opgenomen in [bijlage 42][ref1] kan in het desbetreffende natuurgebied tevens het landschapspakket dat is
      opgenomen in [bijlage 43][ref2] worden aangelegd, hersteld of in stand gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0010999
      [ref2]: https://wetten.overheid.nl/BWBR0010999
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0010999
      - id: ref2
        bwb_id: BWBR0010999
  - number: '14.1'
    text: |-
      Natuurgebiedsplannen worden vastgesteld en gewijzigd bij besluit van gedeputeerde staten van de provincie waarin
      het desbetreffende gebied is gelegen.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel14
  - number: '14.2'
    text: |-
      Indien het desbetreffende gebied is gelegen op het grondgebied van twee of meer provincies, wordt het
      desbetreffende plan vastgesteld of gewijzigd door gedeputeerde staten van die provincies.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel14
  - number: '16'
    text: |-
      De minister kan aan gedeputeerde staten per basis-, plus- of recreatiepakket of groep van basis-, plus- of
      recreatiepakketten richtlijnen en aanwijzingen geven ten aanzien van het aantal hectares waarop het totaal van de
      natuurgebiedsplannen in een provincie betrekking kan hebben.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel16
  - number: '17'
    text: |-
      Vaststelling of wijziging van natuurgebiedsplannen geschiedt met inachtneming van het Structuurschema groene
      ruimte, het natuurbeleidsplan, bedoeld in [hoofdstuk II van de Natuurbeschermingswet 1998][ref1] en door de
      minister overeenkomstig [artikel 16][ref2] gegeven richtlijnen en aanwijzingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0010999#Artikel16
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0009641
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0010999
        artikel: '16'
        hoofdstuk: '2'
  - number: '18'
    text: |-
      Op de voorbereiding van een besluit tot vaststelling of wijziging van een natuurgebiedsplan is de in
      [afdeling 3.5 van de Algemene wet bestuursrecht][ref1] geregelde procedure van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.5
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.5'
  - number: '19.1'
    text: |-
      Aanvragen tot subsidieverlening uit hoofde van deze regeling worden ingediend bij de directeur van de Dienst
      Regelingen met gebruikmaking van een daartoe bestemd aanvraagformulier dat verkrijgbaar is bij de directeur van de
      Dienst Regelingen.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel19
  - number: '19.2'
    text: 'In de aanvraag tot subsidieverlening wordt in ieder geval aangegeven:'
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel19
  - number: 19.2.a
    text: |-
      welk basis-, plus-, landschaps- of recreatiepakket, onderscheidenlijk welke basis-, plus-, landschaps- of
      recreatiepakketten, de aanvraag betreft;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel19
  - number: 19.2.b
    text: of er sprake is van inrichtingssubsidie;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel19
  - number: 19.2.c
    text: of er sprake is van subsidie functieverandering;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel19
  - number: 19.2.d
    text: of er sprake is van landschapssubsidie;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel19
  - number: 19.2.e
    text: of de subsidieaanvrager beheerder is.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel19
  - number: '19.3'
    text: |-
      Tegelijkertijd met de aanvraag kan een verzoek tot ontheffing van de verplichting als bedoeld in
      [artikel 33, eerste lid, onderdeel c][ref1], worden ingediend op grond van zwaarwegende natuurwetenschappelijke
      belangen, bescherming van de persoonlijke levenssfeer, en de aard van het terrein.


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel33
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '33'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '19.4'
    text: |-
      Aanvragen worden onderscheiden naar provincies waarin het desbetreffende terrein of het grootste deel daarvan is
      gelegen.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel19
  - number: '20.1'
    text: |-
      De aanvraag tot subsidieverlening gaat in ieder geval vergezeld van één of meer topografische kaarten met een
      schaal van 1:10.000 waarop de grenzen van het voor subsidie in aanmerking gebrachte terrein is aangegeven, de in
      dat terrein gelegen wegen, vaarwegen, waterlopen en paden.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel20
  - number: '20.2'
    text: |-
      Indien de aanvraag betrekking heeft op meerdere basis-, plus-, landschaps- of recreatiepakketten binnen een terrein
      worden op de topografische kaart, bedoeld in het eerste lid, tevens de grenzen aangegeven waar de verschillende
      basis-, plus-, landschaps- of recreatiepakketten waarvoor subsidie wordt aangevraagd, zullen worden in stand
      gehouden.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel20
  - number: '20.3'
    text: |-
      Indien de aanvraag betrekking heeft op een of meer pluspakketten, opgenomen in de [bijlagen 22 tot en met 31][ref1]
      en [33][ref2], gaat deze vergezeld van een kaart waarop ten minste één waarnemingslocatie per soort per gridcel
      is aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0010999
      [ref2]: https://wetten.overheid.nl/BWBR0010999
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0010999
      - id: ref2
        bwb_id: BWBR0010999
  - number: '20.4'
    text: |-
      Indien subsidie wordt aangevraagd op grond van [artikel 5][ref1], gaat de aanvraag tot subsidieverlening tevens
      vergezeld van de met betrekking tot het desbetreffende terrein tot stand gekomen overeenkomst, bedoeld in
      [artikel 5, onderdeel a][ref2], alsmede van de met betrekking tot die grond of dat water opgestelde verklaring,
      bedoeld in [artikel 5, onderdeel b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0010999#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0010999#Artikel5
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '5'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0010999
        artikel: '5'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0010999
        artikel: '5'
        hoofdstuk: '1'
  - number: '20.5'
    text: |-
      Indien subsidie wordt aangevraagd door een aanvrager als bedoeld in [artikel 6][ref1], gaat de aanvraag vergezeld
      van de documenten, bedoeld in [artikel 6, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0010999#Artikel6
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '6'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0010999
        artikel: '6'
        hoofdstuk: '1'
  - number: 20a.1
    text: |-
      [Artikel 20, vierde en vijfde lid][ref1], is niet van toepassing indien de aanvraag tot subsidieverlening voldoet
      aan de volgende voorschriften:


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel20
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '20'
        hoofdstuk: '3'
  - number: 20a.1.a
    text: |-
      de aanvraag en de daarbij behorende kaarten worden digitaal ingediend, met gebruikmaking van een daartoe bestemd
      aanvraagformulier dat verkrijgbaar is bij de directeur van de Dienst Regelingen en dat volledig is ingevuld
      overeenkomstig de daarbij aangegeven wijze;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel20a
  - number: 20a.1.b
    text: de aanvraag heeft betrekking op ten minste 400 hectare;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel20a
  - number: 20a.1.c
    text: |-
      de aanvraag gaat vergezeld van een protocol dat is opgesteld overeenkomstig de voorschriften die zijn opgenomen in
      [bijlage 66][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0010999
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0010999
  - number: 20a.1.d
    text: |-
      de aanvraag gaat vergezeld van een verklaring, overeenkomstig een door de minister vastgesteld
      model, van een accountant-administratieconsulent of registeraccountant als bedoeld in
      [artikel 2:393, eerste lid, van het Burgerlijk Wetboek][ref1], waaruit blijkt ten behoeve van welke beheerders of
      beheerders subsidie wordt aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 20a.2
    text: |-
      Ingeval de aanvraag, bedoeld in het eerste lid, wordt ingediend vóór 1 januari 2009, wordt, in afwijking van
      het eerste lid, onderdeel c, het protocol uiterlijk op 31 december 2008 ingediend bij de directeur van de Dienst
      Regelingen.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel20a
  - number: '21'
    text: |-
      Indien er met betrekking tot een terrein meer beheerders zijn, kan door hen gezamenlijk een aanvraag worden
      ingediend, welke aanvraag, onverminderd de [artikelen 19][ref1] en [20][ref2], vergezeld gaat van een tussen hen
      gesloten overeenkomst waaruit blijkt dat zij genoegzaam en duurzaam samenwerken inzake het beheer van dat terrein.


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0010999#Artikel20
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '19'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0010999
        artikel: '20'
        hoofdstuk: '3'
  - number: '23.1'
    text: |-
      Subsidie wordt niet verstrekt aan een beheerder indien in de twee jaar voorafgaande aan de aanvraag voor
      subsidieverlening een verzoek tot intrekking van een subsidieverlening voor de desbetreffende beheerseenheid door
      de beheerder is ingediend en dit verzoek is gehonoreerd.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel23
  - number: '23.2'
    text: |-
      In afwijking van het eerste lid kan een subsidie worden verstrekt aan een beheerder, die conform een aanduiding
      als bedoeld in [artikel 13, eerste lid, onderdelen f of g][ref1], de desbetreffende beheerseenheid in de twee jaar
      voorafgaande aan de aanvraag heeft verworven, aan wie een inrichtingssubsidie is verleend of die een aanvraag als
      bedoeld in [artikel 20a][ref2] heeft ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0010999#Artikel20a
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '13'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0010999
        artikel: 20a
        hoofdstuk: '3'
  - number: '24'
    text: Beheerssubsidie wordt verstrekt voor een tijdvak.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel24
  - number: '25.1'
    text: |-
      Per terrein kan voor één of meerdere basis- of pluspakketten opgenomen in de [bijlagen 12 tot en met 41][ref1]
      beheerssubsidie worden verleend, met dien verstande dat in het terrein niet meerdere basis- of pluspakketten op
      dezelfde oppervlakte kunnen worden in stand gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0010999
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0010999
  - number: '25.2'
    text: |-
      Onverminderd het eerste lid, kunnen de landschapspakketten opgenomen in de [bijlagen 46][ref1],
      [48 tot en met 50][ref2] en [56][ref3] op dezelfde oppervlakte worden in stand gehouden als de basis- of
      pluspakketten opgenomen in de [bijlagen 12 tot en met 41][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0010999
      [ref2]: https://wetten.overheid.nl/BWBR0010999
      [ref3]: https://wetten.overheid.nl/BWBR0010999
      [ref4]: https://wetten.overheid.nl/BWBR0010999
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0010999
      - id: ref2
        bwb_id: BWBR0010999
      - id: ref3
        bwb_id: BWBR0010999
      - id: ref4
        bwb_id: BWBR0010999
  - number: '26'
    text: |-
      Beheerssubsidie ten behoeve van een terrein wordt verstrekt met het oog op de instandhouding van een of meerdere
      basis- of pluspakketten die op het tijdstip van indiening van de aanvraag voor beheerssubsidie op het terrein zijn
      ontwikkeld.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel26
  - number: '27'
    text: 'Beheerssubsidie wordt niet verstrekt:'
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel27
  - number: 27.a
    text: |-
      voor de instandhouding van een basis- of pluspakket op een beheerseenheid waarvan de oppervlakte niet ten minste
      overeenkomt met het aantal hectares dat is opgenomen als minimumoppervlakte in de bijlage waarin het desbetreffende
      basis- of pluspakket is vermeld;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel27
  - number: 27.b
    text: aan Staatsbosbeheer;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel27
  - number: 27.c
    text: 'ten behoeve van terreinen waarop verplichtingen van toepassing zijn op grond van:'
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel27
  - number: 27.c.1°
    text: |-
      de [Subsidieregeling agrarisch natuurbeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0011000
  - number: 27.c.2°
    text: de Beschikking beheersovereenkomsten 1983;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel27
  - number: 27.c.3°
    text: de Regeling beheersovereenkomsten 1988;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel27
  - number: 27.c.4°
    text: de Regeling beheersovereenkomsten 1993
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel27
  - number: 27.c.5°
    text: de Regeling beheersovereenkomsten en natuurontwikkeling;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel27
  - number: 27.c.6°
    text: de regeling stimulering bosuitbreiding op landbouwgronden;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel27
  - number: 27.c.7°
    text: de Regeling functiebeloning bos en natuurterreinen,
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel27
  - number: 27.c.8°
    text: |-
      de [Beschikking ter zake het uit productie nemen van bouwland][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0004375
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0004375
  - number: 27.c.9°
    text: de Beschikking bijdragen probleemgebieden.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel27
  - number: 27a
    text: |-
      In afwijking van [artikel 27, onderdeel a][ref1], kan beheerssubsidie worden verstrekt voor de instandhouding van
      een basis- of pluspakket op een beheerseenheid waarvan de oppervlakte kleiner is dan het aantal hectares dat is
      opgenomen als minimumoppervlakte in de bijlage waarin het desbetreffende basis- of pluspakket is vermeld, ingeval
      sprake is van een aanvraag als bedoeld in [artikel 20a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0010999#Artikel20a
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '27'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0010999
        artikel: 20a
        hoofdstuk: '3'
  - number: '28'
    text: |-
      Beheerssubsidie wordt niet verstrekt indien voor de desbetreffende beheerseenheid voor de instandhouding van
      een basis- of pluspakket bijdragen worden genoten van een rechtspersoon als bedoeld in [artikel 6][ref1] of door
      tussenkomst van een subsidieaanvrager als bedoeld in [artikel 5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0010999#Artikel5
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '6'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0010999
        artikel: '5'
        hoofdstuk: '1'
  - number: '29.1'
    text: |-
      Indien op het terrein een basis- of pluspakket in stand wordt gehouden, bedraagt de beheerssubsidie per tijdvak
      het bedrag dat wordt gevormd door de vermenigvuldiging van de beheersbijdrage opgenomen in de bijlage van het
      desbetreffende basis- of pluspakket met het getal zes en het aantal hectares waarvoor beheerssubsidie wordt
      verleend.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel29
  - number: '29.2'
    text: |-
      Indien op het terrein meerdere basis- of pluspakketten in stand worden gehouden, bedraagt de beheerssubsidie
      per tijdvak de som van de beheersbijdragen die worden gevormd door de vermenigvuldiging van de beheersbijdragen
      opgenomen in de bijlagen van elk van de onderscheiden basis- of pluspakketten met het getal zes en het aantal
      hectares per basis- of pluspakket waarvoor beheerssubsidie wordt verleend.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel29
  - number: '31'
    text: |-
      Indien beheerssubsidie wordt verleend voor de instandhouding van een of meerdere basis-of pluspakketten op een
      terrein, vermeldt de beschikking tot subsidieverlening in ieder geval:
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel31
  - number: 31.a
    text: de ligging en grootte van het terrein;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel31
  - number: 31.b
    text: |-
      het doel, onderscheidenlijk de doelen, van de beheerssubsidie, bestaande uit het gedurende het tijdvak in
      stand houden van het natuurresultaat beschreven in onderdeel 1 van het desbetreffende basis-of pluspakket,
      onderscheidenlijk de desbetreffende basis-of pluspakketten;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel31
  - number: 31.c
    text: de mate waarin het terrein dient te worden opengesteld voor publiek;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel31
  - number: 31.d
    text: de datum waarop het tijdvak waarover beheerssubsidie wordt verleend, aanvangt, en
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel31
  - number: 31.e
    text: |-
      de beheersbijdrage, onderscheidenlijk de beheersbijdragen, en de berekening op basis waarvan het bedrag van de
      beheerssubsidie zal worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel31
  - number: '32'
    text: |-
      De datum, bedoeld in [artikel 31, onderdeel d][ref1], waarop het tijdvak waarover beheerssubsidie wordt verleend
      aanvangt, kan uitsluitend de eerste dag van de onderscheiden maanden zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel31
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '31'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '33.1'
    text: 'De subsidieontvanger is verplicht:'
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel33
  - number: 33.1.a
    text: |-
      het in de beschikking tot subsidieverlening vermelde doel onderscheidenlijk doelen, bedoeld in
      [artikel 31, onderdeel b][ref1], te realiseren;


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel31
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '31'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 33.1.b
    text: |-
      de in het betreffende basis-of pluspakket, onderscheidenlijk betreffende basis-of pluspakketten, opgenomen
      beheersvoorschriften te treffen of na te leven die zijn vermeld in de bijlage waarin dat basis-of pluspakket is,
      onderscheidenlijk die basisof pluspakketten zijn opgenomen;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel33
  - number: 33.1.c
    text: |-
      het terrein ten minste 358 dagen per jaar kosteloos van zonsopgang tot zonsondergang open te stellen, toegankelijk
      te houden en de openstelling kenbaar te maken door middel van borden;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel33
  - number: 33.1.d
    text: |-
      het terrein niet te bemesten tenzij voor het beheer als bedoeld in de [bijlagen 15][ref1], [19][ref2], [28][ref3]
      of [29][ref4] toepassing van ruige mest of kalk noodzakelijk is;


      [ref1]: https://wetten.overheid.nl/BWBR0010999
      [ref2]: https://wetten.overheid.nl/BWBR0010999
      [ref3]: https://wetten.overheid.nl/BWBR0010999
      [ref4]: https://wetten.overheid.nl/BWBR0010999
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0010999
      - id: ref2
        bwb_id: BWBR0010999
      - id: ref3
        bwb_id: BWBR0010999
      - id: ref4
        bwb_id: BWBR0010999
  - number: 33.1.e
    text: de bestaande waterhuishouding van het terrein te handhaven;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel33
  - number: 33.1.f
    text: het reliëf van het terrein te handhaven;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel33
  - number: 33.1.g
    text: |-
      geen chemische onkruidbestrijding toe te passen, tenzij voor het beheer een pleksgewijze stobbenbehandeling met
      glyfosaat van Amerikaanse vogelkers, Amerikaanse eik of Robinia noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel33
  - number: 33.1.h
    text: in geval van beweiding of begrazing geen hogere veebezetting toe te passen dan 1,5 GVE op enig moment per hectare;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel33
  - number: 33.1.i
    text: |-
      in het terrein aanwezige paden, wegen, vaarwegen en waterlopen niet te verwijderen of te wijzigen en deze voldoende
      toegankelijk te houden;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel33
  - number: 33.1.j
    text: |-
      van omstandigheden als gevolg waarvan het redelijkerwijs niet mogelijk is te voldoen aan de verplichting, bedoeld
      in de onderdelen a of b binnen twee weken nadat de subsidieontvanger daarvan redelijkerwijs op de hoogte kan zijn
      aan de directeur van de Dienst Regelingen schriftelijk melding te doen;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel33
  - number: 33.1.k
    text: |-
      uiterlijk drie maanden nadat gehele of gedeeltelijke overdracht van de bevoegdheid tot gebruik en beheer van het
      betrokken terrein plaatsvindt, dit schriftelijk te melden aan de directeur van de Dienst Regelingen, en
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel33
  - number: 33.1.l
    text: |-
      ingeval aan hem subsidie is verstrekt naar aanleiding van een aanvraag als bedoeld in [artikel 20a][ref1] zich te
      houden aan het protocol, bedoeld in het eerste lid, onderdeel c van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel20a
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: 20a
        hoofdstuk: '3'
  - number: '33.2'
    text: |-
      De verplichtingen, bedoeld in het eerste lid, onderdelen d tot en met i, gelden voor de periode waarover
      beheerssubsidie is verleend, met dien verstande dat zij niet gelden voorzover dit in de beschikking tot verlening
      van beheerssubsidie, dan wel in het basis- of pluspakket anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel33
  - number: '34.1'
    text: |-
      De minister verstrekt binnen acht weken na afloop van het eerste jaar van het tijdvak een voorschot en vervolgens
      telkens ten minste een jaar later. De hoogte van het voorschot komt overeen met de beheersbijdrage van elk van
      de basis- of pluspakketten waarvoor ten behoeve van het desbetreffende terrein voor dat tijdvak subsidie wordt
      verleend.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel34
  - number: '34.2'
    text: |-
      In afwijking van het eerste lid wordt in een jaar het voorschot verminderd met 100% als de beheerder in de twee
      jaar voorafgaande aan de verstrekking van het voorschot op enig moment niet heeft voldaan aan de verplichtingen,
      bedoeld in [artikel 33, onderdelen b tot en met k][ref1], of enig ander voorschrift in de beschikking tot
      subsidieverlening niet heeft nageleefd, tenzij de aard en de ernst van het niet-nakomen van de genoemde
      verplichtingen aanleiding geven tot vermindering met een lager percentage.


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel33
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '33'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '34.3'
    text: Per terrein kunnen per tijdvak ten hoogste vijf voorschotten worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel34
  - number: '36.1'
    text: |-
      Telkens binnen 8 weken na afloop van een tijdvak dient de ontvanger van beheerssubsidie voor het desbetreffende
      terrein een aanvraag tot subsidievaststelling over dat tijdvak in bij de directeur van de Dienst Regelingen
      met gebruikmaking van een daartoe bestemd aanvraagformulier dat verkrijgbaar is bij de directeur van de Dienst
      Regelingen.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel36
  - number: '36.2'
    text: |-
      Een subsidieontvanger als bedoeld in [artikel 6][ref1], doet bij de aanvraag bedoeld in het eerste lid een opgave
      van:


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel6
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '6'
        hoofdstuk: '1'
  - number: 36.2.a
    text: de leden of aangeslotenen aan wie door hem bijdragen zijn toegekend;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel36
  - number: 36.2.b
    text: de activiteiten van die leden of aangeslotenen waarvoor de bijdragen zijn toegekend en
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel36
  - number: 36.2.c
    text: de bedragen, per lid of aangeslotene, die zijn toegekend.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel36
  - number: '36.3'
    text: |-
      Het tweede lid is niet van toepassing op een subsidieontvanger als bedoeld in [artikel 6][ref1] van wie
      de aanvraag, bedoeld in het eerste lid, vergezeld gaat van een verklaring, overeenkomstig een door de
      minister vastgesteld model, van een accountant-administratieconsulent of registeraccountant als bedoeld in
      [artikel 2:393, eerste lid, van het Burgerlijk Wetboek][ref2], waaruit blijkt dat de subsidieontvanger beschikt
      over de gegevens, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '6'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '36.4'
    text: |-
      Een subsidieontvanger aan wie subsidie is verleend op grond van een aanvraag als bedoeld in [artikel 20a][ref1],
      verstrekt bij de aanvraag, bedoeld in het eerste lid, een verklaring, overeenkomstig een door de minister
      vastgesteld model, van een accountant-administratieconsulent of registeraccountant als bedoeld in
      [artikel 2:393, eerste lid, van het Burgerlijk Wetboek][ref2], waaruit blijkt ten behoeve van welke beheerder of
      beheerders de subsidie is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel20a
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: 20a
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '36.5'
    text: |-
      De ontvanger van beheerssubsidie geeft in de aanvraag aan in hoeverre het doel, bedoeld in
      [artikel 31, onderdeel b][ref1], is gerealiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel31
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '31'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '37.1'
    text: |-
      De minister stelt na ontvangst van de in [artikel 36][ref1] bedoelde aanvraag de beheerssubsidie telkens vast
      binnen 8 weken, tenzij voor de beoordeling van de aanvraag een langere termijn dan 8 weken noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel36
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '36'
        hoofdstuk: '4'
        paragraaf: '5'
  - number: '37.2'
    text: |-
      De beheerssubsidie wordt vastgesteld overeenkomstig het bedrag dat bij de beschikking tot subsidieverlening is
      bepaald, zoals dat op grond van [artikel 8, eerste lid][ref1], door de minister is gecorrigeerd in verband met de
      werkelijke loon- en prijsontwikkeling.


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel8
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '8'
        hoofdstuk: '1'
  - number: '38.1'
    text: |-
      De subsidie per basis- of pluspakket wordt vastgesteld op het bedrag dat uit de subsidieverlening voor het
      desbetreffende terrein voortvloeit, verminderd met:
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel38
  - number: 38.1.a
    text: |-
      100%, indien niet is voldaan aan de verplichtingen, bedoeld in [artikel 33, eerste lid, onderdelen a of b][ref1],
      tenzij de aard en de ernst van de het niet-nakomen van de genoemde verplichting aanleiding geven tot vermindering
      met een lager percentage;


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel33
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '33'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 38.1.b
    text: |-
      100% indien, voorzover van toepassing, niet is voldaan aan de verplichting, bedoeld in
      [artikel 33, eerste lid, onderdelen c tot en met i en l][ref1], tenzij de aard en de ernst van het niet-nakomen van
      de genoemde verplichtingen aanleiding geven tot vermindering met een lager percentage, en


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel33
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '33'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 38.1.c
    text: |-
      5%, indien niet is voldaan aan de verplichting, bedoeld in
      [artikel 33, eerste lid, onderdeel j, onderscheidenlijk onderdeel k][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel33
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '33'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '38.2'
    text: 'In afwijking van het eerste lid wordt de subsidie vastgesteld op:'
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel38
  - number: 38.2.a
    text: |-
      de beheersbijdrage, verminderd met 15% indien niet is voldaan aan de verplichting, bedoeld in
      [artikel 33, eerste lid, onderdeel a][ref1], maar wel is voldaan aan de verplichting, bedoeld in
      [artikel 33, eerste lid, onderdeel b][ref2], ingeval voor een terrein bij aanvang van een tijdvak subsidie is
      verleend voor een basispakket;


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0010999#Artikel33
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '33'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0010999
        artikel: '33'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 38.2.b
    text: |-
      de beheersbijdrage van het corresponderende basispakket, verminderd met 10%, indien niet is voldaan aan de
      voorwaarden van het desbetreffende pluspakket, maar wel is voldaan aan de voorwaarden van het corresponderende
      basispakket, ingeval voor een terrein bij aanvang van een tijdvak subsidie is verleend voor een pluspakket; of
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel38
  - number: 38.2.c
    text: |-
      de beheersbijdrage van het in [bijlage 34][ref1] opgenomen pluspakket soortenrijk weidevogelgrasland, verminderd
      met 10%, indien niet is voldaan aan de voorwaarden van het in [bijlage 35][ref2] opgenomen pluspakket zeer
      soortenrijk weidevogelgrasland, maar wel is voldaan aan de voorwaarden van het in [bijlage 34][ref3] opgenomen
      pluspakket soortenrijk weidevogelgrasland, ingeval bij aanvang van een tijdvak subsidie is verleend voor het
      pluspakket, opgenomen in [bijlage 35][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0010999
      [ref2]: https://wetten.overheid.nl/BWBR0010999
      [ref3]: https://wetten.overheid.nl/BWBR0010999
      [ref4]: https://wetten.overheid.nl/BWBR0010999
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0010999
      - id: ref2
        bwb_id: BWBR0010999
      - id: ref3
        bwb_id: BWBR0010999
      - id: ref4
        bwb_id: BWBR0010999
  - number: '38.3'
    text: |-
      De verminderingen, bedoeld in het eerste lid, onderdeel a en tweede lid, onderdelen a tot
      en met c, worden niet toegepast voorzover niet is voldaan aan de verplichting, bedoeld in
      [artikel 33, eerste lid, onderdelen a en b][ref1], ten gevolge van overmacht.


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel33
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '33'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '38.4'
    text: |-
      De verminderingen bedoeld in het eerste en tweede lid, worden voorts niet toegepast ten aanzien van dat deel van
      die verminderingen dat het bedrag van de beheerssubsidie te boven gaat.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel38
  - number: '40.1'
    text: |-
      Subsidie functieverandering wordt verstrekt gedurende vijf aaneengesloten tijdvakken ten behoeve van de omvorming
      van landbouwgronden in bos en natuurterrein.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel40
  - number: '40.2'
    text: |-
      Subsidie functieverandering wordt niet verstrekt ten behoeve van het beheer van terreinen in eigendom van een
      publiekrechtelijke rechtspersoon, tenzij die publiekrechtelijke rechtspersoon het terrein in gebruik heeft gegeven
      aan een ander, niet zijnde een publiekrechtelijke rechtspersoon, op basis van een erfpachtovereenkomst met een duur
      van ten minste 25 jaar.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel40
  - number: '42.1'
    text: |-
      Subsidie functieverandering wordt verstrekt ten behoeve van terreinen die zijn gelegen in natuurgebieden voor de
      ontwikkeling van één of meerdere basis- of pluspakketten die zijn opgenomen in een natuurgebiedsplan waarin het
      desbetreffende natuurgebied is opgenomen.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel42
  - number: '42.2'
    text: |-
      Subsidie functieverandering wordt verstrekt ten behoeve van terreinen die niet zijn gelegen in natuurgebieden
      ten behoeve van de ontwikkeling van een basis- of pluspakket opgenomen in de [bijlagen 20][ref1], [37][ref2] en
      [38][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0010999
      [ref2]: https://wetten.overheid.nl/BWBR0010999
      [ref3]: https://wetten.overheid.nl/BWBR0010999
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0010999
      - id: ref2
        bwb_id: BWBR0010999
      - id: ref3
        bwb_id: BWBR0010999
  - number: '43'
    text: 'Subsidie functieverandering wordt niet verstrekt:'
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel43
  - number: 43.a
    text: aan beheerders aan wie ten behoeve van de verwerving van het desbetreffende terrein subsidie is verstrekt, of
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel43
  - number: 43.b
    text: aan wie subsidie functieverandering voor het desbetreffende terrein reeds eerder werd verstrekt en
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel43
  - number: 43.c
    text: |-
      aan instellingen, als bedoeld in
      __REF000___________________________________________________________________________________________________________
      __, voorzover de aanvraag betrekking heeft op een subsidie als bedoeld in [artikel 42, eerste lid][ref2], voorzover
      de aanvraag betrekking heeft op een subsidie als bedoeld in [artikel 42, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006085#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010999#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0010999#Artikel42
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0006085
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0010999
        artikel: '42'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0010999
        artikel: '42'
        hoofdstuk: '5'
  - number: '44.1'
    text: |-
      De subsidie voor functieverandering wordt bepaald aan de hand van het bedrag waarmee het desbetreffende terrein in
      waarde daalt als gevolg van de omvorming van landbouwgrond in bos of natuurterrein.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel44
  - number: '44.2'
    text: |-
      De minister bepaalt het bedrag, bedoeld in het eerste lid, aan de hand van een door de Dienst landelijk gebied van
      het Ministerie van Landbouw, Natuur en Voedselkwaliteit uitgevoerde taxatie.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel44
  - number: '45'
    text: |-
      Indien subsidie functieverandering wordt verstrekt, vermeldt de beschikking tot subsidieverstrekking in ieder
      geval:
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel45
  - number: 45.a
    text: de ligging en de grootte van het terrein;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel45
  - number: 45.b
    text: |-
      het doel van de subsidie, bestaande uit de verplichting, bedoeld in
      [artikel 46, eerste lid, onderdeel a, subonderdeel i][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel46
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '46'
        hoofdstuk: '5'
  - number: 45.c
    text: de datum waarop het tijdvak waarover subsidie functieverandering wordt verstrekt, aanvangt, en
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel45
  - number: 45.d
    text: |-
      het bedrag, bedoeld in [artikel 44, eerste lid][ref1], en de berekening op basis waarvan de subsidie
      functieverandering wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel44
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '44'
        hoofdstuk: '5'
  - number: '46.1'
    text: |-
      Subsidie functieverandering ten behoeve van de ontwikkeling van één of meerdere natuurdoelpakketten op
      landbouwgrond wordt verstrekt onder de voorwaarde dat binnen 12 maanden na de datum van verzending of uitreiking
      van de beschikking tot subsidieverstrekking:
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel46
  - number: 46.1.a
    text: |-
      een overeenkomst tussen degene aan wie de grond toebehoort en de minister, handelend namens de Staat der
      Nederlanden, tot stand komt waarin is opgenomen:
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel46
  - number: 46.1.a.i
    text: |-
      de verplichting van degene aan wie de grond toebehoort de desbetreffende landbouwgrond niet te gebruiken of te doen
      gebruiken met het oog op de uitoefening van de landbouw, en overigens datgene na te laten wat de ontwikkeling of
      instandhouding van het betrokken basis- of pluspakket op de desbetreffende grond in gevaar brengt of verstoort;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel46
  - number: 46.1.a.ii
    text: |-
      dat die verplichting zal overgaan op degenen die de grond onder bijzondere titel zullen verkrijgen en dat mede
      gebonden zullen zijn degene die van de rechthebbende een recht tot gebruik van het goed zullen verkrijgen, en
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel46
  - number: 46.1.a.iii
    text: dat de overeenkomst zal worden ingeschreven in de openbare registers, en
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel46
  - number: 46.1.b
    text: |-
      een overeenkomst tot voorfinanciering tussen degene aan wie de grond toebehoort en het Nationaal Groenfonds tot
      stand komt waarin is opgenomen:
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel46
  - number: 46.1.b.i
    text: |-
      de verplichting van degene aan wie de grond toebehoort het bedrag, bedoeld in [artikel 44, eerste lid][ref1], in
      zijn geheel te laten voorfinancieren door het Nationaal Groenfonds, en


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel44
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '44'
        hoofdstuk: '5'
  - number: 46.1.b.ii
    text: |-
      de verplichting van het Nationaal Groenfonds het bedrag, bedoeld in [artikel 44, eerste lid][ref1], in zijn geheel
      te betalen binnen 8 weken nadat zowel de desbetreffende overeenkomst is ondertekend als de overeenkomst, bedoeld in
      onderdeel a, is ingeschreven in de openbare registers.


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel44
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '44'
        hoofdstuk: '5'
  - number: '46.2'
    text: |-
      De kosten voor de inschrijving in de openbare registers van de overeenkomst, bedoeld in het eerste lid, onderdeel
      a, alsmede de kosten die voortvloeien uit de overeenkomst, bedoeld in het eerste lid, onderdeel b, komen voor
      rekening van de minister.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel46
  - number: '46.3'
    text: |-
      De minister kan een model voor een overeenkomst als bedoeld in het eerste of tweede lid vaststellen dat op
      aanwijziging van de directeur van de Dienst Regelingen wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel46
  - number: '50'
    text: Inrichtingssubsidie wordt verstrekt voor de duur van ten hoogste een tijdvak.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel50
  - number: '51.1'
    text: 'Inrichtingssubsidie wordt verstrekt ten behoeve van terreinen gelegen in natuurgebieden voor zover:'
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel51
  - number: 51.1.a
    text: |-
      deze betrekking heeft op het, door middel van eenmalige maatregelen, rechtstreeks wijzigen van de fysieke condities
      of kenmerken van het desbetreffende terrein, gericht op de omvorming of ontwikkeling van een of meerdere basis-
      of pluspakketten of landschapspakketten ten behoeve van het realiseren van een basis- of pluspakket of een
      landschapspakket voor zover dat in overeenstemming is met het desbetreffende natuurgebiedsplan of
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel51
  - number: 51.1.b
    text: |-
      deze betrekking heeft op beheersmaatregelen die gericht zijn op de omvorming of ontwikkeling van een of meerdere
      basis- of pluspakketten of landschapspakketten ten behoeve van het realiseren van een basis- of pluspakket of een
      landschapspakket voor zover dat in overeenstemming is met het desbetreffende natuurgebiedsplan.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel51
  - number: '51.2'
    text: |-
      Inrichtingssubsidie wordt verstrekt met het oog op de ontwikkeling van een basis- of pluspakket opgenomen in de
      [bijlagen 20][ref1], [37][ref2] en [38][ref3] ten behoeve van terreinen die niet zijn gelegen in natuurgebieden.


      [ref1]: https://wetten.overheid.nl/BWBR0010999
      [ref2]: https://wetten.overheid.nl/BWBR0010999
      [ref3]: https://wetten.overheid.nl/BWBR0010999
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0010999
      - id: ref2
        bwb_id: BWBR0010999
      - id: ref3
        bwb_id: BWBR0010999
  - number: '52.1'
    text: |-
      Inrichtingssubsidie wordt niet verstrekt ten behoeve van een terrein dat is
      gelegen in een natuurgebied aan andere beheerders dan instellingen als bedoeld in
      __REF000___________________________________________________________________________________________________________
      __ voorzover dit in het desbetreffende natuurgebiedsplan op grond van [artikel 13, tweede lid][ref2], is
      aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006085#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010999#Artikel13
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0006085
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0010999
        artikel: '13'
        hoofdstuk: '2'
  - number: '52.2'
    text: |-
      In de periode tussen de vaststelling van een landinrichtingsplan en de
      vaststelling van een plan van toedeling wordt aan instellingen, als bedoeld in
      __REF000___________________________________________________________________________________________________________
      __ met betrekking tot een terrein dat is gelegen binnen een blok, zoals dat in het landinrichtingsplan is begrensd,
      geen inrichtingssubsidie verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0006085#Artikel3
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0006085
        artikel: '3'
  - number: '54'
    text: 'Inrichtingssubsidie wordt niet verstrekt voor de ontwikkeling of omvorming:'
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel54
  - number: 54.a
    text: |-
      van een basis- of pluspakket op een terrein waarvan de oppervlakte niet ten minste overeenkomt met het aantal
      hectares dat is opgenomen als minimumoppervlakte in de bijlage waarin het desbetreffende basis- of pluspakket
      is vermeld, tenzij het terrein grenst aan een ander terrein waar hetzelfde basis- of pluspakket in stand wordt
      gehouden en beide terreinen tezamen voldoen aan de eisen ten aanzien van de minimumoppervlakte, of
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel54
  - number: 54.b
    text: |-
      van een landschapspakket voor een landschapselement waarvan de oppervlakte, de lengte of het aantal niet voldoet
      aan de eisen die met betrekking tot de oppervlakte, de lengte of het aantal zijn gesteld in de bijlage waarin het
      desbetreffende landschapspakket is vermeld.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel54
  - number: '55'
    text: |-
      Onverminderd [artikel 50][ref1] wordt inrichtingssubsidie verstrekt overeenkomstig een inrichtingsplan waarin in
      ieder geval zijn opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel50
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '50'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 55.a
    text: de te treffen inrichtingsmaatregelen;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel55
  - number: 55.b
    text: een beschrijving van de uitgangssituatie;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel55
  - number: 55.c
    text: de oppervlakte waarop die maatregelen zullen worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel55
  - number: 55.d
    text: de motivering voor het treffen van de maatregelen;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel55
  - number: 55.e
    text: de met die maatregelen beoogde situatie van het terrein;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel55
  - number: 55.f
    text: |-
      een gedetailleerde beschrijving van de in stand te houden, te verbeteren, aan te leggen, of te verwijderen wegen
      en paden;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel55
  - number: 55.g
    text: voorzover van toepassing, een tijdplanning voor het tijdvak waarvoor subsidie wordt verleend;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel55
  - number: 55.h
    text: de benodigde beheersmaatregelen;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel55
  - number: 55.i
    text: een gespecificeerde begroting;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel55
  - number: 55.j
    text: een opgave van de financieringswijze van de kosten, inclusief de financiële planning van de uitvoering, en
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel55
  - number: 55.k
    text: |-
      een topografische kaart met een schaal van 1 : 10.000 waarop zo nodig is aangegeven waar de onderscheiden
      maatregelen zullen worden getroffen.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel55
  - number: '56'
    text: |-
      Tot de subsidiabele kosten behoren de kosten, inclusief BTW, voorzover verrekening niet mogelijk is, verband
      houdende met:
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel56
  - number: 56.a
    text: het opstellen door derden van een inrichtingsplan;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel56
  - number: 56.b
    text: |-
      bebossing van een terrein, voorzover dit betrekking heeft op de ontwikkeling en daaropvolgende instandhouding van
      een basis- of pluspakket dat is vermeld in een van de [bijlagen 20][ref1], [37][ref2] en [38][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0010999
      [ref2]: https://wetten.overheid.nl/BWBR0010999
      [ref3]: https://wetten.overheid.nl/BWBR0010999
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0010999
      - id: ref2
        bwb_id: BWBR0010999
      - id: ref3
        bwb_id: BWBR0010999
  - number: 56.c
    text: maatregelen, gericht op wijziging van de waterhuishouding;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel56
  - number: 56.d
    text: grondverzet;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel56
  - number: 56.e
    text: |-
      maatregelen tot wijziging van de feitelijke bereikbaarheid van een terrein, waaronder in ieder geval is begrepen de
      aanleg of het herstel van wegen en paden;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel56
  - number: 56.f
    text: de verwijdering van opstallen;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel56
  - number: 56.g
    text: de verwijdering van begroeiing en beplanting, of
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel56
  - number: 56.h
    text: overige maatregelen voorzover noodzakelijk in verband met de desbetreffende inrichting.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel56
  - number: '57'
    text: 'Tot de subsidiabele beheersmaatregelen behoren in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel57
  - number: 57.a
    text: waterhuishoudkundig beheer;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel57
  - number: 57.b
    text: begrazingsbeheer;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel57
  - number: 57.c
    text: maaien, of
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel57
  - number: 57.d
    text: kappen of verwijderen van gewas of begroeiing.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel57
  - number: '58'
    text: 'Niet tot de subsidiabele kosten behoren in ieder geval de kosten, verband houdende met:'
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel58
  - number: 58.a
    text: de verwijdering van bodemverontreiniging of afval;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel58
  - number: 58.b
    text: de bouw van opstallen;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel58
  - number: 58.c
    text: de aanschaf van machines;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel58
  - number: 58.d
    text: |-
      de aanschaf van materialen, anders dan ten behoeve van het treffen van maatregelen als bedoeld in
      [artikel 56][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel56
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '56'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 58.e
    text: de aanschaf of plaatsing van recreatieve voorzieningen;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel58
  - number: 58.f
    text: de aanleg van parkeergelegenheid, of
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel58
  - number: 58.g
    text: achterstallig onderhoud, tenzij subsidie functieverandering is verleend.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel58
  - number: '59.1'
    text: 'Geen inrichtingssubsidie wordt verstrekt:'
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel59
  - number: 59.1.a
    text: |-
      voor kosten die zijn gemaakt, alvorens een beslissing op de aanvraag voor inrichtingssubsidie is genomen, behoudens
      de kosten, bedoeld in [artikel 56, onderdeel a][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel56
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '56'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 59.1.b
    text: |-
      ten behoeve van maatregelen waarmee een aanvang is gemaakt, onderscheidenlijk die reeds zijn uitgevoerd, alvorens
      een beslissing op de aanvraag voor inrichtingssubsidie is genomen.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel59
  - number: '59.2'
    text: |-
      Ten behoeve van de inrichting van een terrein in eigendom van een publiekrechtelijke rechtspersoon anders dan een
      gemeente wordt geen inrichtingssubsidie verstrekt met geldmiddelen van de Commissie van de Europese Gemeenschappen,
      tenzij die publiekrechtelijke rechtspersoon het terrein in gebruik heeft gegeven aan een ander, niet zijnde een
      publiekrechtelijke rechtspersoon, op basis van een erfpachtovereenkomst met een duur van ten minste 25 jaar.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel59
  - number: '60.1'
    text: |-
      Inrichtingssubsidie bedraagt 95% van de werkelijk gemaakte noodzakelijke subsidiabele kosten, met dien verstande
      dat geen vergoeding wordt verstrekt voor zover deze kosten meer bedragen dan een door de minister bij de
      subsidieverlening te bepalen maximumbedrag.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel60
  - number: '60.2'
    text: |-
      Het bedrag aan inrichtingssubsidie als bedoeld in [artikel 51, eerste lid, onderdeel a][ref1], dat ten hoogste kan
      worden verstrekt is opgenomen in [bijlage 64][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0010999
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '51'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0010999
  - number: '61'
    text: |-
      De minister kan beleidsregels vaststellen met het oog op de toepassing van [de artikelen 55][ref1], [56][ref2],
      [57][ref3] en [60][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0010999#Artikel56
      [ref3]: https://wetten.overheid.nl/BWBR0010999#Artikel57
      [ref4]: https://wetten.overheid.nl/BWBR0010999#Artikel60
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '55'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0010999
        artikel: '56'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0010999
        artikel: '57'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0010999
        artikel: '60'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '62'
    text: 'De subsidieverlening vermeldt:'
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel62
  - number: 62.a
    text: in hoeverre het inrichtingsplan in uitvoering kan worden genomen;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel62
  - number: 62.b
    text: het bedrag waarop de inrichtingssubsidie ten hoogste kan worden vastgesteld, en
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel62
  - number: 62.c
    text: de datum waarop de periode waarover inrichtingssubsidie wordt verleend aanvangt en eindigt.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel62
  - number: '63'
    text: |-
      De subsidieontvanger is verplicht de maatregelen overeenkomstig het inrichtingsplan als bepaald bij de
      subsidieverlening uit te voeren en overeenkomstig de tijdsplanning, bedoeld in [artikel 55, onderdeel g][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel55
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '55'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '64.1'
    text: |-
      Op de inrichtingssubsidie kan de minister ten hoogste viermaal per jaar op aanvraag tot ten hoogste 95%
      voorschotten verlenen, met een minimum van € 2.500,-.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel64
  - number: '64.2'
    text: De aanvraag tot voorschotverlening gaat vergezeld van een overzicht van de werkelijk gemaakte kosten.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel64
  - number: '64.3'
    text: |-
      De aanvraag tot voorschotverlening wordt ingediend bij de directeur van de Dienst Regelingen met gebruikmaking van
      een daartoe bestemd aanvraagformulier dat verkrijgbaar is bij de directeur van de Dienst Regelingen.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel64
  - number: '64.4'
    text: Het voorschot wordt binnen acht weken na de voorschotverlening betaald.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel64
  - number: '65.1'
    text: |-
      De ontvanger van inrichtingssubsidie dient binnen 8 weken na afloop van het tijdvak voor het desbetreffende
      terrein een aanvraag tot subsidievaststelling over dat tijdvak in bij de directeur van de Dienst Regelingen
      met gebruikmaking van een daartoe bestemd aanvraagformulier dat verkrijgbaar is bij de directeur van de Dienst
      Regelingen.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel65
  - number: '65.2'
    text: 'De aanvraag, bedoeld in het eerste lid, gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel65
  - number: 65.2.a
    text: |-
      een verklaring dat de maatregelen en, voorzover van toepassing, het beheer overeenkomstig de subsidieverlening zijn
      uitgevoerd, en
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel65
  - number: 65.2.b
    text: |-
      een financiële verantwoording met betrekking tot de getroffen maatregelen, bestaande uit een rekening alsmede,
      indien de subsidieverlening een bedrag van € 25.000,- te boven gaat, een verklaring, overeenkomstig een door de
      minister vast te stellen model, van een accountant-administratieconsulent of registeraccountant als bedoeld in
      [artikel 2:393, eerste lid, van het Burgerlijk Wetboek][ref1] waaruit blijkt dat de maatregelen zijn uitgevoerd
      overeenkomstig de beschikking tot verlening van inrichtingssubsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '66'
    text: |-
      De minister stelt na ontvangst van de in [artikel 65][ref1] bedoelde bescheiden de inrichtingssubsidie binnen 8
      weken vast op grond van de werkelijk gemaakte kosten, zoals bepaald bij de subsidieverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel65
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '65'
        hoofdstuk: '6'
        paragraaf: '5'
  - number: '67'
    text: |-
      Recreatiesubsidie wordt uitsluitend verstrekt ten behoeve van de instandhouding van een recreatiepakket ten aanzien
      van terreinen waarvoor tevens beheerssubsidie wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel67
  - number: '68'
    text: |-
      Recreatiesubsidie wordt niet verstrekt ten behoeve van het beheer van terreinen in eigendom van een
      publiekrechtelijke rechtspersoon, tenzij die publiekrechtelijke rechtspersoon het terrein in gebruik heeft gegeven
      aan een ander, niet zijnde een publiekrechtelijke rechtspersoon, op basis van een erfpachtovereenkomst met een duur
      van ten minste 25 jaar.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel68
  - number: '69'
    text: |-
      Recreatiesubsidie bedraagt per hectare per tijdvak het bedrag dat wordt gevormd door de vermenigvuldiging van de
      recreatiebijdrage opgenomen in de bijlage van het desbetreffende recreatiepakket met het getal zes.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel69
  - number: '70'
    text: |-
      Recreatiesubsidie wordt verstrekt voor een tijdvak dat begint op hetzelfde tijdstip als het tijdvak waarvoor
      beheerssubsidie wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel70
  - number: '71'
    text: 'De beschikking tot verlening van recreatiesubsidie vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel71
  - number: 71.a
    text: de ligging en grootte van het terrein;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel71
  - number: 71.b
    text: |-
      het doel van de recreatiesubsidie, bestaande uit het gedurende het tijdvak op het terrein in stand houden van een
      recreatiepakket;
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel71
  - number: 71.c
    text: de recreatiebijdrage op basis waarvan de recreatiesubsidie zal worden vastgesteld, en
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel71
  - number: 71.d
    text: de datum waarop het tijdvak waarover recreatiesubsidie wordt verleend, aanvangt.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel71
  - number: '72'
    text: 'De subsidieontvanger is verplicht:'
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel72
  - number: 72.a
    text: |-
      het in de beschikking tot subsidieverlening vermelde doel, bedoeld in [artikel 71, onderdeel b][ref1], te
      realiseren, en


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel71
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel72
    references:
