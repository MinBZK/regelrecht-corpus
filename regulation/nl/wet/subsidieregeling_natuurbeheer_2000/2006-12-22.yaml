        bwb_id: BWBR0010999
        artikel: '71'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 72.b
    text: |-
      van omstandigheden als gevolg waarvan het redelijkerwijs niet mogelijk is te voldoen aan de verplichting, bedoeld
      in onderdeel a, binnen twee weken nadat de subsidieontvanger daarvan redelijkerwijs op de hoogte kan zijn aan de
      directeur van de Dienst Regelingen schriftelijk melding te doen.
    url: https://wetten.overheid.nl/BWBR0010999/2006-12-22#Artikel72
  - number: '73'
    text: |-
      De [artikelen 25][ref1], [28][ref2], [32][ref3] tot en met [37][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0010999#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0010999#Artikel32
