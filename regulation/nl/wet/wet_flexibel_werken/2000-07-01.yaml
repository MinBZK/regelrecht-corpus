$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_flexibel_werken
regulatory_layer: WET
publication_date: '2024-12-17'
valid_from: '2000-07-01'
bwb_id: BWBR0011173
url: https://wetten.overheid.nl/BWBR0011173/2000-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels inzake het recht op aanpassing van de
    arbeidsduur tot stand te brengen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0011173/2000-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0011173/2000-07-01#Artikel1
  - number: 1.a
    text: |-
      werkgever: degene die een ander krachtens arbeidsovereenkomst naar burgerlijk recht of publiekrechtelijke
      aanstelling arbeid laat verrichten;
    url: https://wetten.overheid.nl/BWBR0011173/2000-07-01#Artikel1
  - number: 1.b
    text: 'werknemer: de ander, bedoeld onder a.'
    url: https://wetten.overheid.nl/BWBR0011173/2000-07-01#Artikel1
  - number: '2.1'
    text: |-
      De werknemer kan de werkgever verzoeken om aanpassing van de uit zijn arbeidsovereenkomst of publiekrechtelijke
      aanstelling voortvloeiende arbeidsduur, indien de werknemer ten minste een jaar voorafgaand aan het beoogde
      tijdstip van ingang van die aanpassing in dienst is bij die werkgever. Voor de berekening van de termijn van een
      jaar worden perioden waarin arbeid wordt verricht, die elkaar opvolgen met een onderbreking van niet meer dan
      drie maanden samengeteld. De vorige volzin is van overeenkomstige toepassing op perioden waarin voor verschillende
      werkgevers arbeid wordt verricht die ten aanzien van de verrichte arbeid redelijkerwijs geacht moeten worden
      elkanders opvolger te zijn.
    url: https://wetten.overheid.nl/BWBR0011173/2000-07-01#Artikel2
  - number: '2.2'
    text: |-
      Voor militaire ambtenaren wordt het recht op aanpassing van de arbeidsduur geregeld bij algemene maatregel van
      bestuur op voordracht van Onze Minister van Defensie en Onze Minister van Sociale Zaken en Werkgelegenheid met
      gebruikmaking van onbezoldigd verlof in verband met deeltijdarbeid.
    url: https://wetten.overheid.nl/BWBR0011173/2000-07-01#Artikel2
  - number: '2.3'
    text: |-
      Het verzoek om aanpassing van de arbeidsduur wordt ten minste vier maanden vóór het beoogde tijdstip van ingang
      van de aanpassing schriftelijk bij de werkgever ingediend onder opgave van het tijdstip van ingang, de omvang van
      de aanpassing van de arbeidsduur per week of, als de arbeidsduur over een ander tijdvak is overeengekomen over dat
      tijdvak en de gewenste spreiding van de uren over de week of het anderszins overeengekomen tijdvak. De werknemer
      kan ten hoogste eenmaal per twee jaren, nadat de werkgever een verzoek om aanpassing van de arbeidsduur heeft
      ingewilligd of afgewezen, opnieuw een verzoek indienen.
    url: https://wetten.overheid.nl/BWBR0011173/2000-07-01#Artikel2
  - number: '2.4'
    text: De werkgever pleegt overleg met de werknemer over diens verzoek.
    url: https://wetten.overheid.nl/BWBR0011173/2000-07-01#Artikel2
  - number: '2.5'
    text: |-
      De werkgever willigt het verzoek van de werknemer om aanpassing van de arbeidsduur in, voor zover het betreft het
      tijdstip van ingang en de omvang van de aanpassing, tenzij zwaarwegende bedrijfs- of dienstbelangen zich daartegen
      verzetten.
    url: https://wetten.overheid.nl/BWBR0011173/2000-07-01#Artikel2
  - number: '2.6'
    text: |-
      De werkgever stelt de spreiding van de uren vast overeenkomstig de wensen van de werknemer. De werkgever kan de
      gewenste spreiding van de uren wijzigen, indien hij daarbij een zodanig belang heeft dat de wens van de werknemer
      daarvoor naar maatstaven van redelijkheid en billijkheid moet wijken.
    url: https://wetten.overheid.nl/BWBR0011173/2000-07-01#Artikel2
  - number: '2.7'
    text: |-
      De beslissing op het verzoek om aanpassing van de arbeidsduur wordt door de werkgever schriftelijk aan de werknemer
      meegedeeld. Indien de werkgever het verzoek niet inwilligt of de spreiding van de uren vaststelt in afwijking van
      de wensen van de werknemer, wordt dit onder schriftelijke opgave van de redenen meegedeeld.
    url: https://wetten.overheid.nl/BWBR0011173/2000-07-01#Artikel2
  - number: '2.8'
    text: |-
      Bij vermindering van de arbeidsduur is in ieder geval sprake van een zwaarwegend bedrijfs- of dienstbelang, indien
      die vermindering leidt tot ernstige problemen:
    url: https://wetten.overheid.nl/BWBR0011173/2000-07-01#Artikel2
  - number: 2.8.a
    text: voor de bedrijfsvoering bij de herbezetting van de vrijgekomen uren;
    url: https://wetten.overheid.nl/BWBR0011173/2000-07-01#Artikel2
  - number: 2.8.b
    text: op het gebied van de veiligheid, of
    url: https://wetten.overheid.nl/BWBR0011173/2000-07-01#Artikel2
  - number: 2.8.c
    text: van roostertechnische aard.
    url: https://wetten.overheid.nl/BWBR0011173/2000-07-01#Artikel2
  - number: '2.9'
    text: |-
      Bij vermeerdering van de arbeidsduur is in ieder geval sprake van een zwaarwegend bedrijfs- of dienstbelang, indien
      die vermeerdering leidt tot ernstige problemen:
    url: https://wetten.overheid.nl/BWBR0011173/2000-07-01#Artikel2
  - number: 2.9.a
    text: van financiële of organisatorische aard;
    url: https://wetten.overheid.nl/BWBR0011173/2000-07-01#Artikel2
  - number: 2.9.b
    text: wegens het niet voorhanden zijn van voldoende werk, of
    url: https://wetten.overheid.nl/BWBR0011173/2000-07-01#Artikel2
  - number: 2.9.c
    text: omdat de vastgestelde formatieruimte of personeelsbegroting daartoe ontoereikend is.
    url: https://wetten.overheid.nl/BWBR0011173/2000-07-01#Artikel2
  - number: '2.10'
    text: |-
      Indien de werkgever niet een maand voor het beoogde tijdstip van ingang van de aanpassing op het verzoek heeft
      beslist, wordt de arbeidsduur aangepast overeenkomstig het verzoek van de werknemer.
    url: https://wetten.overheid.nl/BWBR0011173/2000-07-01#Artikel2
  - number: '2.11'
    text: |-
      Uitsluitend ten aanzien van vermeerdering van de arbeidsduur kan van dit artikel of een of meer onderdelen
      daarvan worden afgeweken bij collectieve arbeidsovereenkomst of bij regeling door of namens een daartoe bevoegd
      bestuursorgaan dan wel, indien geen collectieve arbeidsovereenkomst of regeling van toepassing is of terzake geen
      bepaling bevat, indien de werkgever terzake schriftelijke overeenstemming heeft bereikt met de ondernemingsraad of,
      bij het ontbreken daarvan, met de personeelsvertegenwoordiging.
    url: https://wetten.overheid.nl/BWBR0011173/2000-07-01#Artikel2
  - number: '2.12'
    text: |-
      Dit artikel is niet van toepassing ten aanzien van een werkgever met minder dan 10 werknemers. Deze dient een
      regeling te treffen met betrekking tot het recht van de werknemers op aanpassing van de arbeidsduur.
    url: https://wetten.overheid.nl/BWBR0011173/2000-07-01#Artikel2
  - number: '3'
    text: |-
      De werkgever kan de arbeidsverhouding van een werknemer niet beëindigen wegens de omstandigheid dat de werknemer in
      of buiten rechte om aanpassing van de arbeidsduur heeft verzocht.
    url: https://wetten.overheid.nl/BWBR0011173/2000-07-01#Artikel3
  - number: '4'
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid zendt, in overeenstemming met Onze Minister van Justitie en Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties, binnen drie jaar na de inwerkingtreding van deze wet aan de
      Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0011173/2000-07-01#Artikel4
  - number: '5'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0011173/2000-07-01#Artikel5
  - number: '6'
    text: 'Deze wet wordt aangehaald als: Wet aanpassing arbeidsduur.'
    url: https://wetten.overheid.nl/BWBR0011173/2000-07-01#Artikel6
