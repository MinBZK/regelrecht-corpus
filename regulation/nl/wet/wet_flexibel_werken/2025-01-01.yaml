  - number: '3'
    text: |-
      De werkgever kan de arbeidsverhouding van een werknemer niet beëindigen wegens de omstandigheid dat de werknemer in
      of buiten rechte om aanpassing van de arbeidsduur, arbeidsplaats of werktijd heeft verzocht.
    url: https://wetten.overheid.nl/BWBR0011173/2025-01-01#Artikel3
  - number: 3a
    text: |-
      De werkgever mag de werknemer niet benadelen wegens de omstandigheid dat de werknemer in of buiten rechte het recht
      op aanpassing van de arbeidsduur, de arbeidsplaats of de werktijd geldend maakt, ter zake bijstand heeft verleend,
      of hieromtrent een klacht binnen de onderneming heeft ingediend.
    url: https://wetten.overheid.nl/BWBR0011173/2025-01-01#Artikel3a
  - number: '4'
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid zendt, in overeenstemming met Onze Minister van Justitie en Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties, elke vijf jaar aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0011173/2025-01-01#Artikel4
  - number: 4a
    text: |-
      Het College, genoemd in [artikel 1 van de Wet College voor de rechten van de mens][ref1], kan onderzoeken of een
      onderscheid is of wordt gemaakt als bedoeld in [artikel 3a][ref2]. De [artikelen 10][ref3], [11][ref4], [12][ref5],
      [13][ref6], [22][ref7] en [23 van de Wet College voor de rechten van de mens][ref8] zijn van overeenkomstige
      toepassing.


