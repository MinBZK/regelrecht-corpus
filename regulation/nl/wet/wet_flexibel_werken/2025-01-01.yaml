  - number: 2b
    text: |-
      1 De werknemer kan de werkgever verzoeken om een vorm van arbeid met meer voorspelbare en zekere
      arbeidsvoorwaarden, indien de werknemer ten minste 26 weken voorafgaand aan het beoogde tijdstip van ingang van
      die aanpassing in dienst is bij die werkgever. Het verzoek wordt door de werknemer schriftelijk bij de werkgever
      ingediend. De tweede en derde zin van het eerste lid van [artikel 2][ref1] zijn van overeenkomstige toepassing.

      2 De werkgever beslist, indien hij tien of meer werknemers heeft, binnen een maand schriftelijk en gemotiveerd
      op het verzoek van de werknemer. Indien de werkgever minder dan tien werknemers heeft beslist hij schriftelijk en
      gemotiveerd binnen drie maanden na het verzoek.

      3 Indien de werkgever niet binnen een in het tweede lid bedoelde termijn beslist, wordt de vorm van arbeid
      aangepast overeenkomstig het verzoek van de werknemer.

      4 De werknemer kan, behoudens onvoorziene omstandigheden, een jaar nadat de werkgever een verzoek als bedoeld in
      het eerste lid heeft ingewilligd of afgewezen, opnieuw een verzoek indienen. Voor een werkgever met minder dan
      tien werknemers geldt dat de beslissing op een soortgelijk verzoek mondeling kan worden gedaan als de motivering
      voor het antwoord met betrekking tot de werknemer ongewijzigd is gebleven. Het derde lid is van overeenkomstige
      toepassing.

      5 Dit artikel is niet van toepassing op de werknemer:

      a. die doorgaans op minder dan vier dagen per week uitsluitend of nagenoeg uitsluitend diensten verricht ten
      behoeve van het huishouden van de natuurlijke persoon tot wie hij in dienstbetrekking staat. Onder het verrichten
      van diensten ten behoeve van een huishouden wordt mede verstaan het verlenen van zorg aan de leden van dat
      huishouden;

      b. die werkzaam is op basis van een zee-arbeidsovereenkomst als bedoeld in
      [artikel 694 van Boek 7 van het Burgerlijk Wetboek][ref2] of een arbeidsovereenkomst in de zeevisserij als bedoeld
      in [artikel 739][ref3] van genoemd wetboek.

      6 De werkgever mag de werknemer niet benadelen wegens de omstandigheid dat de werknemer in of buiten rechte de in
      dit artikel aan hem toegekende rechten geldend maakt, ter zake bijstand heeft verleend of een klacht hierover heeft
      ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0011173#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel694
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel739
