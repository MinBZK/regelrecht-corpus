preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels inzake het recht op aanpassing van de
    arbeidsduur tot stand te brengen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0011173/2025-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. werkgever: degene die een ander krachtens arbeidsovereenkomst naar burgerlijk recht of publiekrechtelijke
      aanstelling arbeid laat verrichten;

      b. werknemer: de ander, bedoeld onder a;

      c. arbeidsduur: het aantal overeengekomen uren waaruit een werkweek of een anderszins overeengekomen werkperiode
      van de werknemer bestaat;

      d. arbeidsplaats: iedere overeengekomen plaats die in verband met het verrichten van arbeid wordt of pleegt te
      worden gebruikt door de werknemer;

      e. werktijd: de overeengekomen tijdstippen op een werkdag of een anderszins overeengekomen tijdvak waarop de
      werknemer werkzaam is.
    url: https://wetten.overheid.nl/BWBR0011173/2025-01-01#Artikel1
  - number: 1a
    text: |-
      Deze wet is niet van toepassing ten aanzien van de aanpassing van de arbeidsduur van de werknemer die de in
      [artikel 7, onderdeel a, van de Algemene Ouderdomswet][ref1] bedoelde leeftijd heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7
    url: https://wetten.overheid.nl/BWBR0011173/2025-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '7'
  - number: '2'
    text: |-
      1 De werknemer kan de werkgever verzoeken om aanpassing voor al dan niet wisselende perioden en met al dan
      niet verschillende omvang van de uit zijn arbeidsovereenkomst of publiekrechtelijke aanstelling voortvloeiende
      arbeidsduur, arbeidsplaats of werktijd, indien de werknemer ten minste 26 weken voorafgaand aan het beoogde
      tijdstip van ingang van die aanpassing in dienst is bij die werkgever, behoudens onvoorziene omstandigheden. Voor
      de berekening van de termijn van 26 weken worden perioden waarin arbeid wordt verricht, die elkaar opvolgen met
      een onderbreking van niet meer dan zes maanden, samengeteld. De vorige volzin is van overeenkomstige toepassing
      op perioden waarin voor verschillende werkgevers arbeid wordt verricht die ten aanzien van de verrichte arbeid
      redelijkerwijs geacht moeten worden elkanders opvolger te zijn.

      2 Voor militaire ambtenaren wordt, met inachtneming van het vijftiende en zestiende lid en de artikelen 2a en
      3a, het recht op aanpassing van de arbeidsduur geregeld bij algemene maatregel van bestuur op voordracht van Onze
      Minister van Defensie en Onze Minister van Sociale Zaken en Werkgelegenheid met gebruikmaking van onbezoldigd
      verlof in verband met deeltijdarbeid.

      3 Het verzoek om aanpassing van de arbeidsduur, de arbeidsplaats of de werktijd wordt, behoudens onvoorziene
      omstandigheden, ten minste twee maanden vóór het beoogde tijdstip van ingang van de aanpassing schriftelijk bij de
      werkgever ingediend onder opgave van het tijdstip van ingang, alsmede van:

      a. de gewenste omvang van de aanpassing van de arbeidsduur per week, of, als de arbeidsduur over een ander tijdvak
      is overeengekomen, over dat tijdvak;

      b. de gewenste arbeidsplaats; of

      c. de gewenste spreiding van de werktijd van de uren over de week, of het anderszins overeengekomen tijdvak.

      De werknemer kan, behoudens onvoorziene omstandigheden, een jaar nadat de werkgever een verzoek om aanpassing van
      de arbeidsduur, arbeidsplaats of werktijd heeft ingewilligd of afgewezen, opnieuw een verzoek indienen.

      4 De werkgever pleegt overleg met de werknemer over diens verzoek.

      5 De werkgever willigt het verzoek van de werknemer om aanpassing van de arbeidsduur of de werktijd in, voor zover
      het betreft tijdstip van ingang en de omvang van de aanpassing, tenzij zwaarwegende bedrijfs- of dienstbelangen
      zich daartegen verzetten.

      6 De werkgever overweegt het verzoek van de werknemer om aanpassing van de arbeidsplaats en pleegt overleg met de
      werknemer indien hij het verzoek afwijst.

      7 De werkgever stelt de spreiding van de uren vast overeenkomstig de wensen van de werknemer. De werkgever kan de
      gewenste spreiding van de uren wijzigen, indien hij daarbij een zodanig belang heeft dat de wens van de werknemer
      daarvoor naar maatstaven van redelijkheid en billijkheid moet wijken.

      8 De beslissing op het verzoek om aanpassing van de arbeidsduur, de arbeidsplaats of de werktijd wordt door de
      werkgever schriftelijk aan de werknemer meegedeeld. Indien de werkgever het verzoek niet inwilligt, of de spreiding
      van de uren, de aanpassing van de arbeidsplaats of werktijd vaststelt in afwijking van de wensen van de werknemer,
      wordt dit onder schriftelijke opgave van de redenen meegedeeld.

      9 Bij vermindering van de arbeidsduur is in ieder geval sprake van een zwaarwegend bedrijfs- of dienstbelang,
      indien die vermindering leidt tot ernstige problemen:

      a. voor de bedrijfsvoering bij de herbezetting van de vrijgekomen uren;

      b. op het gebied van de veiligheid, of

      c. van roostertechnische aard.

      10 Bij vermeerdering van de arbeidsduur is in ieder geval sprake van een zwaarwegend bedrijfs- of dienstbelang,
      indien die vermeerdering leidt tot ernstige problemen:

      a. van financiële of organisatorische aard;

      b. wegens het niet voorhanden zijn van voldoende werk, of

      c. omdat de vastgestelde formatieruimte of personeelsbegroting daartoe ontoereikend is.

      11 Bij aanpassing van de werktijd is in ieder geval sprake van een zwaarwegend bedrijfs- of dienstbelang, indien de
      aanpassing leidt tot ernstige problemen:

      a. op het gebied van veiligheid;

      b. van roostertechnische aard; of

      c. van financiële of organisatorische aard.

      12 Indien de werkgever niet een maand voor het beoogde tijdstip van ingang van de aanpassing op het verzoek
      heeft beslist, wordt de arbeidsduur, de arbeidsplaats of de werktijd aangepast overeenkomstig het verzoek van de
      werknemer. Indien sprake is van onvoorziene omstandigheden als bedoeld in het derde lid, beslist de werkgever in
      afwijking van het bepaalde in de eerste zin binnen vijf werkdagen op het verzoek van de werknemer.

      13 De werkgever is bevoegd een beslissing als bedoeld in het achtste lid of een aanpassing als bedoeld in het
      twaalfde lid te herzien op grond van na die beslissing of aanpassing opgekomen belangen ten aanzien van de
      arbeidsplaats of op grond van na die beslissing of aanpassing opgekomen zwaarwegende bedrijfs- of dienstbelangen
      als bedoeld in het vijfde lid ten aanzien van de arbeidstijd.

      14 Alvorens de beslissing tot herziening, bedoeld in het dertiende lid, te nemen, pleegt de werkgever overleg met
      de werknemer. De werkgever deelt de werknemer de beslissing schriftelijk onder opgave van redenen mee.

      15 Indien de duur van de aanpassing van de arbeidsduur, de arbeidsplaats of de werktijd beperkt is, heeft de
      werknemer aan het eind van de overeengekomen periode het recht terug te keren naar het oorspronkelijke werkpatroon.

      16 Indien een wijziging van de omstandigheden dit rechtvaardigt, kan de werknemer de werkgever verzoeken voor het
      einde van de overeengekomen periode van de aanpassing van de arbeidsduur, de arbeidsplaats of de werktijd naar het
      oorspronkelijke werkpatroon terug te keren. Het vierde tot en met elfde lid zijn van overeenkomstige toepassing op
      een dergelijk verzoek.

      17 Uitsluitend ten aanzien van vermeerdering van de arbeidsduur of aanpassing van de arbeidsplaats of de werktijd
      kan van dit artikel of een of meer onderdelen daarvan worden afgeweken bij collectieve arbeidsovereenkomst
      of bij regeling door of namens een daartoe bevoegd bestuursorgaan dan wel, indien geen collectieve
      arbeidsovereenkomst of regeling van toepassing is of terzake geen bepaling bevat, indien de werkgever terzake
      schriftelijke overeenstemming heeft bereikt met de ondernemingsraad of, bij het ontbreken daarvan, met de
      personeelsvertegenwoordiging.

      18 Dit artikel is niet van toepassing ten aanzien van een werkgever met minder dan 10 werknemers. Deze dient een
      regeling te treffen met betrekking tot het recht van de werknemers op aanpassing van de arbeidsduur.

      19 Voor de toepassing van het zeventiende lid geldt een afwijkende regeling door of namens een daartoe bevoegd
      bestuursorgaan of een afwijkende regeling waaromtrent de werkgever schriftelijk overeenstemming heeft bereikt
      met de ondernemingsraad, of bij het ontbreken daarvan, met de personeelsvertegenwoordiging, voor vijf jaren vanaf
      het tijdstip waarop die regeling ingaat, indien geen termijn van ten hoogste vijf jaren is bepaald. Indien geen
      termijn is bepaald gaat bij wijziging van de regeling waarvan de in de eerste zin bedoelde afwijking deel uitmaakt
      binnen het in die zin bedoelde tijdvak, ten aanzien van de afwijking een nieuw tijdvak in op het tijdstip van
      inwerkingtreding van de wijziging.
    url: https://wetten.overheid.nl/BWBR0011173/2025-01-01#Artikel2
  - number: 2a
    text: |-
      1 De [artikelen 1a][ref1] en [2, derde lid, laatste zin, en zeventiende tot en met negentiende lid][ref2], zijn
      niet van toepassing op een verzoek om aanpassing van de arbeidsduur, de arbeidsplaats of de werktijd van een
      werknemer:

      a. die ouder is van een kind in de leeftijd tot acht jaar;

      b. die zorg draagt voor de verzorging van een persoon als bedoeld in
      [artikel 5:1, tweede lid van de Wet arbeid en zorg][ref3], die levensbedreigend ziek is; of

      c. die zorg draagt voor de noodzakelijke verzorging van een persoon als bedoeld in
      [artikel 5:1, tweede lid van de Wet arbeid en zorg][ref4], die ziek of hulpbehoevend is.

      2 De werkgever kan van de werknemer verlangen dat hij aannemelijk maakt dat een omstandigheden als bedoeld in het
      eerste lid zich voordoet.


