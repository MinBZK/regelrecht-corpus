        artikel: 27d
        hoofdstuk: II
      - id: ref5
        bwb_id: BWBR0001848
        artikel: '33'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '56.2'
    text: |-
      Zij zijn niet strafbaar, zoo hunne weigering of overtreding een gevolg is van den last, door de bestuurders van de
      spoorwegdienst gegeven.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel56
  - number: '58.1'
    text: |-
      Overtreding van de [artt. 36][ref1], [37 ][ref2]en [38][ref3], of van de voorwaarden gesteld bij de besluiten, naar
      aanleiding van [art. 39][ref4] genomen, wordt gestraft met geldboete van de eerste categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0001848#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0001848#Artikel38
      [ref4]: https://wetten.overheid.nl/BWBR0001848#Artikel39
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '36'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0001848
        artikel: '37'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0001848
        artikel: '38'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0001848
        artikel: '39'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '58.2'
    text: |-
      De overtreders worden daarenboven, op de vordering van het openbaar ministerie, veroordeeld om binnen een bij het
      vonnis te bepalen termijn, de zaken in den vorigen stand te herstellen.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel58
  - number: '58.3'
    text: |-
      Bij gebreke van voldoening aan die uitspraak, wordt, na verloop van den gestelden termijn, het vonnis van
      regeringswege ten koste van den overtreder ten uitvoer gelegd.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel58
  - number: '58.4'
    text: |-
      De kosten worden op den overtreder verhaald door den ontvanger der registratie, naar een staat, opgemaakt door
      dengene, die met de uitvoering van het vonnis is belast.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel58
  - number: '63.1'
    text: |-
      Overtreding van de [artt. 42][ref1], [43][ref2] en [44][ref3] wordt gestraft met geldboete van de tweede categorie
      of met gevangenis van ten hoogste ééne maand.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0001848#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0001848#Artikel44
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '42'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001848
        artikel: '43'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0001848
        artikel: '44'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '63.2'
    text: |-
      Gelijke straf wordt uitgesproken tegen de personen, in het [tweede lid van art. 35][ref1] bedoeld, of die hen,
      volgens de wet, vertegenwoordigen, wanneer zij de sluiting der hekken geplaatst aan uit- of overwegen, waarvan
      zij genot hebben, verzuimen. Zijn door hen personen met de sluiting belast, dan zijn deze wegens het verzuim
      strafschuldig.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel35
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '35'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '64.1'
    text: |-
      Overtreding van de bepalingen van een algemeenen maatregel van bestuur in een der [artikelen 27][ref1], [27][ref2]
      of [27][ref3] bedoeld, door anderen dan de in [artikel 53][ref4] en [56][ref5] genoemden, wordt gestraft met
      geldboete van de eerste categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0001848#Artikel27c
      [ref3]: https://wetten.overheid.nl/BWBR0001848#Artikel27d
      [ref4]: https://wetten.overheid.nl/BWBR0001848#Artikel53
      [ref5]: https://wetten.overheid.nl/BWBR0001848#Artikel56
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '27'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0001848
        artikel: 27c
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0001848
        artikel: 27d
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0001848
        artikel: '53'
        hoofdstuk: VI
      - id: ref5
        bwb_id: BWBR0001848
        artikel: '56'
        hoofdstuk: VI
  - number: '64.2'
    text: |-
      De beambten en bedienden van den spoorweg kunnen hen, die zich aan die overtreding schuldig maken, uit de rijtuigen
      weren of verwijderen.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel64
  - number: '64.3'
    text: |-
      Ten aanzien van beschadiging van waterstaatswerken, in beheer of onderhoud bij ondernemers van spoorwegdiensten,
      voor welke schippers, reders, eigenaars of gebruikers van vaartuigen of vlotten volgens de wet aansprakelijk zijn,
      vindt[ § 6][ref1] overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001867#Paragraaf6
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0001867
        paragraaf: '6'
  - number: '69'
    text: |-
      Deze wet is van toepassing op de dienst en het gebruik der Staatsspoorwegen, zonder evenwel verandering te brengen
      in de bepalingen der wet van 3 Julij 1863 (*Staatsblad* n°. 100) en in die van de concessie, bij de wetten van 3
      Junij 1863 (*Staatsblad* n°. 101) en van 7 Augustus 1865 (*Staatsblad* n°. 99) bekrachtigd.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel69
  - number: 69a
    text: |-
      Deze wet is niet van toepassing voor zover de [Wet personenvervoer 2000][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0011470
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel69a
    references:
      - id: ref1
        bwb_id: BWBR0011470
  - number: '70.1'
    text: |-
      Wegen door het Rijk of door eene spoorwegonderneming aangelegd tot toegang naar een station worden, voor zoover
      dit nog niet mogt zijn geschied, aan de gemeenten, op welker grondgebied zij liggen, in behoorlijken staat
      overgedragen; daarna komt het onderhoud en de verlichting ten haren laste.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel70
  - number: '70.2'
    text: |-
      Ligt een toegangsweg op het grondgebied van meer dan eene gemeente, dan wordt door Ons, den Raad van State gehoord,
      beslist aan welke gemeente die weg zal worden overgedragen.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel70
  - number: '70.3'
    text: |-
      Onderhoud van wegen aan het Rijk, aan gemeenten of anderen toebehoorende, vóór den aanleg van een spoorweg
      aangelegd, die tot toegang naar een station van den spoorweg dienen, blijft ten laste van dengene, die daarmede
      vroeger was belast.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel70
  - number: '70.4'
    text: |-
      Volgens voorschriften door Ons bij algemeenen maatregel van inwendig bestuur te geven, wordt een ligger opgemaakt
      en bijgehouden van de toegangswegen tot stations, op welken ligger de onderhoudpligtigen vermeld zijn.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel70
  - number: '71.1'
    text: |-
      De [artikelen 5:13][ref1], [5:15][ref2] en [5:20 van de Algemene wet bestuursrecht][ref3] zijn van overeenkomstige
      toepassing ten aanzien van de in [artikel 72][ref4] bedoelde ambtenaren en politieambtenaren, met dien verstande
      dat zij alleen bevoegd zijn de spoorweg en de daarbij behorende gronden en gebouwen, die voor het gebruik van
      reizigers zijn bestemd, te betreden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0001848#Artikel72
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0001848
        artikel: '72'
  - number: '71.2'
    text: |-
      De [artikelen 5:13][ref1], [5:15][ref2] en [5:20 van de Algemene wet bestuursrecht][ref3] zijn van overeenkomstige
      toepassing op bij besluit van Onze Minister van Verkeer en Waterstaat aangewezen Rijksbeambten en leden en beambten
      van openbare besturen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '72.1'
    text: |-
      Tot het opsporen der overtredingen van deze wet, van een krachtens [art. 27][ref1] uitgevaardigden algemeenen
      maatregel van bestuur, van het in [art. 5][ref2] bedoeld reglement en van de aldaar zijn, behalve de bij
      [art. 141 van het Wetboek van Strafvordering][ref3] aangewezen ambtenaren, de in [artikel 10][ref4] bedoelde
      ambtenaren bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0001848#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref4]: https://wetten.overheid.nl/BWBR0001848#Artikel10
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '27'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0001848
        artikel: '5'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref4
        bwb_id: BWBR0001848
        artikel: '10'
        hoofdstuk: II
  - number: '72.2'
    text: |-
      Ook zijn daartoe bevoegd de beëedigde beambten en bedienden van den spoorwegen over de geheele uitgestrektheid van
      den weg, waarop zij dienst doen, en binnen den kring van honderd meter aan beide zijden van dien weg.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel72
  - number: '73'
    text: De wet van 21 Augustus 1859 (*Staatsblad* n°. 98) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel73
  - number: '74.1'
    text: Deze wet treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel74
  - number: '74.2'
    text: Zij kan worden aangehaald onder den titel "Spoorwegwet".
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel74
