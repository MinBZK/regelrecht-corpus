  - number: '54.2'
    text: |-
      De boete, in het voorlaatste lid van [art. 53][ref1] bedreigd, kan niet hooger gaan dan ten hoogste € 4 500. De
      aldaar bedoelde tijd houdt op te loopen, zoodra [art. 15][ref2] wordt toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0001848#Artikel15
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '53'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0001848
        artikel: '15'
        hoofdstuk: II
  - number: '56.1'
    text: |-
      De beambten en bedienden van den spoorweg worden gestraft: zoo zij het in [art. 5][ref1] bedoeld reglement op
      het gemeenschappelijk gebruik van een spoorweg, de aldaar bedoelde regeling voor het gemeenschappelijk gebruik
      van stations, een krachtens een der [artikelen 27][ref2], [27][ref3], [27][ref4] of [33][ref5] uitgevaardigden
      algemeenen maatregel van bestuur overtreden met geldboete van de tweede categorie; zoo zij de bepalingen van deze
      wet niet naleven of daarmede in strijd handelen of doen handelen, voor zoover daaromtrent niet in het bijzonder is
      voorzien, met geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0001848#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0001848#Artikel27c
      [ref4]: https://wetten.overheid.nl/BWBR0001848#Artikel27d
      [ref5]: https://wetten.overheid.nl/BWBR0001848#Artikel33
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '5'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0001848
        artikel: '27'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0001848
        artikel: 27c
        hoofdstuk: II
