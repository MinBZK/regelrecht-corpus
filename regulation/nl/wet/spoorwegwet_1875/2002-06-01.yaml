preamble:
  text: |-
    Wij WILLEM III, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, Groot-Hertog van Luxemburg,
    enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat de wijziging en aanvulling, welke de wet van 21 Augustus 1859
    (Staatsblad n°. 98), omtrent de spoorwegdiensten en het gebruik der spoorwegen behoeft, het raadzaam maken haar
    door eene nieuwe wet te doen vervangen;

    Zoo is het, dat Wij, den Raad van State gehoord en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Onder voorbehoud van [afdeling 5 van titel 2 van Boek 8 van het Burgerlijk Wetboek][ref1] zijn de ondernemers eener
      Spoorwegdienst verantwoordelijk voor de schade, door personen of goederen bij de uitoefening der dienst geleden,
      ten ware de schade buiten hunne schuld of die hunner beambten of bedienden zij ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Afdeling5
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005034
        afdeling: '5'
  - number: '3'
    text: |-
      Ondernemers van spoorwegdiensten zijn niet bevoegd hunne verantwoordelijkheid voor verlies, vertraagde bezorging
      van of schade aan koopmanschappen en goederen, noch den omvang en duur hunner verpligtingen en den bewijslast
      door eenig beding van den vrachtbrief, of door bijzondere dienstreglementen uit te sluiten of te beperken, dan met
      inachtneming der regels, door Ons bij algemeenen maatregel van inwendig bestuur vast te stellen.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel3
  - number: '4.1'
    text: |-
      De ondernemers zijn verpligt te gedoogen, dat aan den spoorweg, waarover hunne dienst loopt, spoorwegen, door
      andere aan te leggen, zich aansluiten, en dat die weg door zoodanige wegen worde doorsneden.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel4
  - number: '4.2'
    text: |-
      Zoo, ten behoeve der aansluiting of doorsnijding, op den eerstgenoemden spoorweg werken te verrigten zijn, of de
      dienst moet worden gestaakt, wordt deswege door de ondernemers der aan te leggen spoorwegen schadeloosstelling
      verleend.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel4
  - number: '4.3'
    text: |-
      Indien Wij den aanleg van wegen, kanalen, waterleidingen of andere werken gebieden of toestaan, die den spoorweg
      doorsnijden of daarmede in aanraking komen, kunnen de ondernemers dit niet beletten, noch uit dien hoofde andere
      schadevergoeding vorderen dan teruggave van de vermeerdering der kosten van onderhoud en dienst, die uit den aanleg
      dier werken mogt voortvloeijen.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel4
  - number: '4.4'
    text: |-
      In zoodanig geval zorgt de Minister van Verkeer en Waterstaat, dat, zonder kosten voor de ondernemers, alle
      definitieve of voorloopige werken worden uitgevoerd, die vereischt worden om te beletten, dat de exploitatie van
      den spoorweg gestoord of gestaakt worde.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel4
  - number: '5.1'
    text: |-
      De ondernemers zijn insgelijks verpligt te gedoogen, dat de weg, waarover hunne dienst loopt, en de daartoe
      behoorende stations ten behoeve van andere spoorwegdiensten worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel5
  - number: '5.2'
    text: |-
      Dit geschiedt krachtens een door Ons daartoe te nemen besluit, tegen schadeloosstelling, door de ondernemers der
      spoorwegdienst, ten wier behoeve het gemeenschappelijk gebruik van den weg of van een station wordt gegund, te
      voldoen.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel5
  - number: '5.3'
    text: |-
      Het gemeenschappelijk gebruik van den weg heeft plaats overeenkomstig een reglement, door Ons, de bestuurders der
      betrokken spoorwegdiensten gehoord, vast te stellen.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel5
  - number: '5.4'
    text: |-
      De bepalingen voor het gebruik van stations tot gemeenschappelijke dienst en de uitvoering der daarvoor noodige
      werken worden door de ondernemers der betrokken spoorwegdiensten, met instemming van Onzen Minister van Verkeer en
      Waterstaat, onderling bij overeenkomst geregeld.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel5
  - number: '5.5'
    text: |-
      Indien het deswege te houden overleg niet binnen den door Onzen Minister van Verkeer en Waterstaat te bepalen
      tijd tot overeenstemming heeft geleid, worden die bepalingen door Ons, bestuurders der betrokken spoorwegdiensten
      gehoord, vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel5
  - number: '5.6'
    text: |-
      De schadeloosstellingen, in dit en in het vorig artikel bedoeld, worden, bij gebreke van minnelijke schikking, door
      den regter bepaald.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel5
  - number: '6.1'
    text: |-
      De bestuurders eener spoorwegdienst stellen een reglement voor hunne dienst vast, en onderwerpen dat aan de
      instemming van den Minister van Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel6
  - number: '6.2'
    text: Voordat met dit reglement is ingestemd, wordt de dienst niet geopend.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel6
  - number: '6.3'
    text: |-
      Geene veranderingen worden zonder instemming van den Minister van Verkeer en Waterstaat in het reglement gebragt,
      die noodige veranderingen, ook nadat ermee ingestemd is, de ondernemers gehoord, bevelen kan.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel6
  - number: '6.4'
    text: |-
      De [artikelen 10:28 tot en met 10:31 van de Algemene wet bestuursrecht][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: '7.1'
    text: |-
      De dienst wordt niet geopend, noch na eene staking hervat, dan nadat de Minister van Verkeer en Waterstaat daartoe
      machtiging heeft verleend.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel7
  - number: '7.2'
    text: |-
      Alvorens die machtiging wordt verleend, heeft eene opneming van den weg en van de daartoe behoorende werken van
      regeringswege plaats.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel7
  - number: '7.3'
    text: |-
      Gelijke opneming gaat het in gebruik nemen van nieuwe of herstelde locomotieven, tenders, rijtuigen of wagens
      vooraf.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel7
  - number: '9.1'
    text: |-
      Voor bestuurders van spoorwegdiensten worden gehouden zij, die, hetzij als ondernemers, hetzij namens de
      ondernemers, het opperbestuur over de dienst uitoefenen.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel9
  - number: 9a
    text: |-
      De [artikelen 75, eerste lid][ref1], en [186, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2] gelden niet
      voor ondernemers van een spoorwegdienst ten aanzien van door hen uitgegeven documenten voor het goederenvervoer.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel186
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '75'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '186'
  - number: '10.1'
    text: |-
      Vanwege de Minister van Verkeer en Waterstaat wordt inspectie op de spoorwegen uitgeoefend door een onder
      eenhoofdige leiding te stellen dienst. Bij algemene maatregel van bestuur worden terzake regels gesteld.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel10
  - number: '10.2'
    text: |-
      De [artikelen 5:13][ref1], [5:15][ref2], [5:16][ref3], [5:17][ref4] en
      [5:20 van de Algemene wet bestuursrecht][ref5] zijn van overeenkomstige toepassing ten aanzien van de in het eerste
      lid bedoelde ambtenaren, met dien verstande dat zij niet bevoegd zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 10.2.a
    text: |-
      rijtuigen van treinen voor autoriteiten of bestuurders van de spoorwegdienst aangewezen of door bijzondere personen
      gehuurd te betreden; en
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel10
  - number: 10.2.b
    text: |-
      inlichtingen te vragen dan wel inzage te vorderen van zakelijke gegevens en bescheiden met betrekking tot het
      geldelijk beheer van de spoorwegdienst.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel10
  - number: '10.3'
    text: |-
      De in het eerste lid bedoelde ambtenaren zijn tevens belast met het toezicht op de naleving van het bepaalde bij of
      krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel10
  - number: '10.4'
    text: |-
      De toezichthouder beschikt niet over de bevoegdheden, genoemd in de [artikelen 5:18][ref1] en
      [5:19 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '10.5'
    text: 'De toezichthouder is niet bevoegd:'
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel10
  - number: 10.5.a
    text: |-
      rijtuigen van treinen voor autoriteiten of bestuurders van de spoorwegdienst aangewezen of door bijzondere personen
      gehuurd te betreden; en
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel10
  - number: 10.5.b
    text: |-
      inlichtingen te vragen dan wel inzage te vorderen van zakelijke gegevens en bescheiden met betrekking tot het
      geldelijk beheer van de spoorwegdienst.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel10
  - number: '11'
    text: |-
      De in [artikel 10][ref1] bedoelde ambtenaren hebben recht op gratis vervoer in alle treinen.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel10
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '10'
        hoofdstuk: II
  - number: '13.1'
    text: |-
      De in [artikel 10][ref1] bedoelde ambtenaren geven schriftelijk kennis aan de bestuurders der spoorwegdienst van
      hetgeen naar hun oordeel tot instandhouding van den spoorweg en tot behoorlijke uitoefening van de dienst behoort
      te worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel10
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '10'
        hoofdstuk: II
  - number: '13.2'
    text: |-
      Zij roepen, zoo de bestuurders daaraan geen behoorlijk gevolg geven, de beslissing van den Minister van Verkeer en
      Waterstaat in.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel13
  - number: '13.3'
    text: De bestuurders kunnen tegen hetgeen hun aanbevolen werd, administratief beroep instellen bij de Minister.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel13
  - number: '13.4'
    text: |-
      Bij onmiddellijk gevaar kan degene, die ingevolge de bij [artikel 10, eerste lid][ref1], bedoelde regelen als
      hoofd van het toezicht is aangewezen, of de Minister last geven tot onverwijlde voorziening niettegenstaande het
      administratief beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel10
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '10'
        hoofdstuk: II
  - number: '14.1'
    text: |-
      Aan de beslissing van den Minister van Verkeer en Waterstaat wordt binnen den daarbij te stellen tijd door de
      bestuurders der dienst voldaan.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel14
  - number: '14.2'
    text: |-
      Geschiedt dit niet, dan is de Minister van Verkeer en Waterstaat bevoegd: zoo er nalatigheid bestaat met opzigt tot
      het herstellen of vernieuwen van den spoorweg of van de daartoe behoorende werken en gebouwen, of met opzigt tot de
      aanvulling van behoeften voor de dienst en van het getal beambten of bedienden, staking van de dienst te bevelen;
      zoo die bestaat met opzigt tot het herstellen of vernieuwen van de voor de spoorwegdienst bestemde locomotieven,
      tenders, rijtuigen of wagens, het gebruik van zoodanige locomotieven, tenders, rijtuigen of wagens te verbieden en,
      zoo noodig, bestuursdwang toe te passen.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel14
  - number: '15'
    text: |-
      De Minister van Verkeer en Waterstaat is bevoegd tot toepassing van bestuursdwang ter handhaving van zijn
      beslissing, indien de bestuurders van de spoorwegdienst de bevolen herstellingen of vernieuwingen aan de spoorweg
      of aan de daartoe behorende werken en gebouwen niet uitvoeren, of niet tot de door hem nodig geachte aanvulling van
      behoeften voor de dienst of van het getal beambten of bedienden overgaan.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel15
  - number: '16.1'
    text: |-
      Vordert de openbare veiligheid dadelijke staking van de dienst, hetzij over den geheelen weg, hetzij over een
      gedeelte daarvan, dan kan die staking worden bevolen door een in [artikel 10][ref1] bedoelde ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel10
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '10'
        hoofdstuk: II
  - number: '16.2'
    text: |-
      Dit bevel wordt gegeven door hem, die daartoe, volgens de door Ons voor te schrijven regelen, bevoegd is, en
      zooveel mogelijk schriftelijk gerigt aan de hoofdbeambten van de meest nabij zijnde stations, die daarvan terstond
      aan alle hoofdbeambten van de stations langs den weg kennis geven.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel16
  - number: '17.1'
    text: |-
      Onverminderd de [artikelen 7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2] kunnen, ingeval buitengewone omstandigheden
      dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-President, de [artikelen 17][ref3],
      [18][ref4], [19][ref5], [23][ref6], [24][ref7] en [50, tweede alinea][ref8], in werking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0001848#Artikel17a
      [ref4]: https://wetten.overheid.nl/BWBR0001848#Artikel18
      [ref5]: https://wetten.overheid.nl/BWBR0001848#Artikel19
      [ref6]: https://wetten.overheid.nl/BWBR0001848#Artikel23
      [ref7]: https://wetten.overheid.nl/BWBR0001848#Artikel24
      [ref8]: https://wetten.overheid.nl/BWBR0001848#Artikel50
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0001848
        artikel: 17a
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0001848
        artikel: '18'
        hoofdstuk: II
      - id: ref5
        bwb_id: BWBR0001848
        artikel: '19'
        hoofdstuk: II
      - id: ref6
        bwb_id: BWBR0001848
        artikel: '23'
        hoofdstuk: II
      - id: ref7
        bwb_id: BWBR0001848
        artikel: '24'
        hoofdstuk: II
      - id: ref8
        bwb_id: BWBR0001848
        artikel: '50'
        hoofdstuk: V
  - number: '17.2'
    text: |-
      Wanneer het in de eerste alinea bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepalingen.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel17
  - number: '17.3'
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan worden bij koninklijk besluit, op voordracht van
      Onze Minister-President, de bepalingen die ingevolge de eerste alinea in werking zijn gesteld, onverwijld buiten
      werking gesteld.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel17
  - number: '17.4'
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, worden bepalingen die ingevolge de eerste alinea
      in werking zijn gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel17
  - number: '17.5'
    text: |-
      Het besluit, bedoeld in de eerste, derde en vierde alinea, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking..
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel17
  - number: '17.6'
    text: Het besluit, bedoeld in de eerste, derde en vierde alinea, wordt in ieder geval geplaatst in het *Staatsblad*.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel17
  - number: 17a
    text: |-
      Wegens redenen van staatsbelang kan staking van de dienst door de Minister van Verkeer en Waterstaat worden
      bevolen.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel17a
  - number: '18'
    text: |-
      In het geval, bij het vorige artikel bedoeld zorgt de Minister van Verkeer en Waterstaat, dat zooveel mogelijk
      worde voorzien in de behoeften van het verkeer in de rigting van den spoorweg.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel18
  - number: '19'
    text: |-
      Staking der dienst in het geval, bij [artikel 17][ref1] bedoeld, wordt in de *Staatscourant* vermeld, en in de
      provincien, door welke de weg loopt, zoo spoedig mogelijk, algemeen bekend gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel17a
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: 17a
        hoofdstuk: II
  - number: '20'
    text: |-
      Eene krachtens deze wet gestaakte dienst wordt niet hervat dan na bekomen toestemming van den Minister van Verkeer
      en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel20
  - number: '21'
    text: |-
      De Minister van Verkeer en Waterstaat is bevoegd tot toepassing van bestuursdwang ter handhaving van het bevel
      tot staking dan wel ter voorkoming van het hervatten van de dienst zonder de in [artikel 20][ref1] bedoelde
      toestemming.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel20
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '20'
        hoofdstuk: II
  - number: '22'
    text: |-
      De in [artikel 10][ref1] bedoelde ambtenaren zijn bevoegd locomotieven, tenders, rijtuigen of wagens onverwijld uit
      een trein te doen verwijderen en het vertrek van een trein te verbieden, indien de toestand van het materieel of de
      zamenstelling van den trein, naar hun oordeel, voor den trein gevaar kan doen ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel10
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '10'
        hoofdstuk: II
  - number: '23.1'
    text: |-
      De Minister van Verkeer en Waterstaat is bevoegd bevel te geven tot gehele of gedeeltelijke onbruikbaarmaking van
      de baan en de daarop aanwezige bruggen, telegraaflijnen en seintoestellen.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel23
  - number: '23.2'
    text: |-
      Indien op grond van de eerste alinea onbruikbaarmaking heeft plaatsgevonden, wordt de spoorweg, zo spoedig als
      het staatsbelang zulks gedoogt, op bevel van de Minister van Verkeer en Waterstaat en op kosten van het Rijk in de
      vorige toestand hersteld.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel23
  - number: '24.1'
    text: |-
      Indien de Minister van Verkeer en Waterstaat staking van de dienst beveelt vanuit het oogpunt van belangen van ’s
      lands verdediging, kan hij tevens bepalen dat alle locomotieven, tenders, rijtuigen, wagens en ander materieel van
      de spoorweg worden verwijderd.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel24
  - number: '24.2'
    text: |-
      In het geval, bedoeld in de eerste alinea, wijst de Minister van Defensie de plaats of plaatsen aan waarheen dat
      materieel moet worden vervoerd.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel24
  - number: '27'
    text: |-
      Bij algemene maatregel van bestuur worden - met uitzondering van arbeids- en rusttijden van het personeel in
      dienst van een spoorwegonderneming - geregeld: de dienst op de stations; het toezigt over de baan en de bediening
      der seinen; de inrigting van en het toezigt over de locomotieven, tenders, rijtuigen en wagens; de zamenstelling
      der treinen; de snelheid waarmede de treinen zijn te vervoeren; het getal beambten en bedienden, op elken trein
      noodig; hetgeen in het belang der orde op elken trein is in acht te nemen; de voorwaarden voor het vervoer van
      goederen; het afhalen en bestellen der goederen, en het loon daarvoor te genieten; de behandeling der onafgehaalde
      of onbestelbare goederen; de tijd waarna die goederen kunnen verkocht worden, en de wijze waarop die verkoop zal
      kunnen geschieden; de beëediging van de beambten en bedienden van den spoorweg; en hetgeen verder ter verzekering
      van de behoorlijke uitoefening der spoorwegdiensten en het veilig verkeer over de spoorwegen, krachtens deze wet,
      is voor te schrijven.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel27
  - number: '28.1'
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel28
  - number: 28.1.a
    text: |-
      spoorwegonderneming: iedere onderneming waarvan de voornaamste activiteit bestaat uit het leveren van
      spoorwegvervoerdiensten voor goederen of reizigers en die beschikt over de tractie om de bedoelde diensten te
      verzorgen;
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel28
  - number: 28.1.b
    text: |-
      internationaal samenwerkingsverband: ieder samengaan van ten minste twee in verschillende lid-staten gevestigde
      spoorwegondernemingen, dat ten doel heeft het leveren van diensten op het gebied van internationaal vervoer tussen
      lid-staten;
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel28
  - number: 28.1.c
    text: |-
      spoorweginfrastructuur: spoorweginfrastructuur als bedoeld in bijlage I onderdeel A van [Verordening (EEG) nr.
      2598/70](31970R2598) van de Europese Commissie van 18 december 1970 (Pb L 278) met dien verstande dat onder
      «dienstgebouwen» niet wordt begrepen: het aandeel in de installaties voor het innen van de vervoerkosten;
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel28
  - number: 28.1.d
    text: |-
      beheer van spoorweginfrastructuur: totstandbrenging en onderhoud van spoorweginfrastructuur, daaronder begrepen de
      regelings- en veiligheidssystemen;
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel28
  - number: 28.1.e
    text: 'beheerder: de krachtens dit hoofdstuk met het beheer van spoorweginfrastructuur belaste instantie;'
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel28
  - number: 28.1.f
    text: |-
      toewijzing: het beschikbaarstellen van spoorweginfrastructuur door de daartoe krachtens dit hoofdstuk bevoegde
      instantie ten behoeve van de vervoerdiensten, bedoeld in [artikel 29, eerste tot en met derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel29
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '29'
        hoofdstuk: III
        paragraaf: '2'
  - number: 28.1.g
    text: |-
      verkeersleiding: de zorg voor een ongestoorde uitvoering van alle afzonderlijke toewijzingsbesluiten en, wanneer
      dit door calamiteiten of andere onvoorziene omstandigheden niet mogelijk blijkt, het bevorderen van een zo spoedig
      mogelijk herstel daarvan;
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel28
  - number: 28.1.h
    text: |-
      [richtlijn 95/18](31995L0018): [richtlijn nr. 95/18/EG](31995L0018) van de Raad van de Europese Unie van 19 juni
      1995 betreffende de verlening van vergunningen aan spoorwegondernemingen (Pb L 143);
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel28
  - number: 28.1.i
    text: |-
      [richtlijn 95/19](31995L0019): [richtlijn nr. 95/19/EG](31995L0019) van de Raad van de Europese Unie van 19
      juni 1995 inzake de toewijzing van spoorweginfrastructuurcapaciteit en de heffing van gebruiksrechten voor de
      infrastructuur (Pb L 143);
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel28
  - number: 28.1.j
    text: |-
      lid-staat: een lid-staat van de Europese Unie of een andere staat die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte;
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel28
  - number: 28.1.k
    text: 'Onze Minister: Onze Minister van Verkeer en Waterstaat.'
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel28
  - number: '28.2'
    text: |-
      Wat betreft de spoorweginfrastructuur waarop de concessie, verleend ingevolge
      [artikel 6 van de wet van 26 mei 1937 tot reorganisatie van het spoorwegbedrijf][ref1] (Stb. 520) betrekking heeft,
      zijn de volgende instanties belast met de daarbij genoemde taken:


      [ref1]: https://wetten.overheid.nl/BWBR0001988#Artikel6
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0001988
        artikel: '6'
  - number: 28.2.a
    text: 'NS Railinfrabeheer B.V., gevestigd te Utrecht: beheer van spoorweginfrastructuur,'
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel28
  - number: 28.2.b
    text: 'Railned B.V. , gevestigd te Utrecht: toewijzing, en'
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel28
  - number: 28.2.c
    text: 'NS Verkeersleiding B.V., gevestigd te Utrecht: verkeersleiding.'
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel28
  - number: '28.3'
    text: |-
      Wat betreft spoorweginfrastructuur die krachtens eigendom of enig ander zakelijk dan wel persoonlijk recht bij
      de Staat berust treedt Onze Minister dan wel een door hem aangewezen rechtspersoon op als beheerder, toewijzende
      instantie en instantie belast met de verkeersleiding.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel28
  - number: '28.4'
    text: |-
      Wat betreft andere spoorweginfrastructuur dan bedoeld in het tweede en derde lid, is de houder van de concessie tot
      de uitoefening van de dienst op die infrastructuur beheerder en treedt als toewijzende instantie respectievelijk
      als instantie, belast met de verkeersleiding de door Onze Minister aangewezen rechtspersoon op.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel28
  - number: '28.5'
    text: |-
      Dit hoofdstuk is niet van toepassing op spoorwegondernemingen waarvan de activiteiten zich beperken tot stads-
      en streekvervoer.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel28
  - number: '29.1'
    text: |-
      Internationale samenwerkingsverbanden waaraan een in Nederland gevestigde spoorwegonderneming deelneemt hebben
      rechten van toegang en doorvoer op de spoorweginfrastructuur ten behoeve van spoorwegvervoerdiensten voor goederen
      en reizigers.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29
  - number: '29.2'
    text: |-
      Internationale samenwerkingsverbanden waarvan de deelnemende spoorwegondernemingen gevestigd zijn in andere
      lidstaten dan Nederland, hebben rechten van doorvoer op de spoorweginfrastructuur ten behoeve van internationale
      spoorwegvervoerdiensten voor goederen en reizigers tussen die lid-staten.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29
  - number: '29.3'
    text: |-
      Spoorwegondernemingen die in andere lid-staten zijn of zullen worden gevestigd, hebben rechten van toegang tot
      de spoorweginfrastructuur ten behoeve van spoorwegvervoerdiensten in het kader van internationaal gecombineerd
      goederenvervoer.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29
  - number: '29.4'
    text: |-
      Uitoefening van de diensten waarop de aanspraken, bedoeld in het eerste tot en met derde lid, betrekking hebben
      is, onverminderd het overigens bij of krachtens deze wet bepaalde, uitsluitend toegestaan indien de desbetreffende
      spoorwegondernemingen in het bezit zijn van:
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29
  - number: 29.4.a
    text: |-
      een daartoe strekkende exploitatievergunning als bedoeld in artikel 2, onder b, van [richtlijn 95/18](31995L0018),
      afgegeven door Onze Minister op grond van [artikel 29a][ref1] dan wel, wat betreft spoorwegondernemingen die in
      andere lid-staten zijn gevestigd, afgegeven door de bevoegde instantie van die lid-staat, en van


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel29a
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: 29a
        hoofdstuk: III
        paragraaf: '3'
  - number: 29.4.b
    text: |-
      een veiligheidsattest als bedoeld in artikel 11, eerste lid, van [richtlijn 95/19](31995L0019) voor de
      desbetreffende spoorweginfrastructuur, afgegeven door Onze Minister op grond van [artikel 29c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel29c
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: 29c
        hoofdstuk: III
        paragraaf: '4'
  - number: '29.5'
    text: |-
      De daadwerkelijke uitoefening van de diensten waarop de aanspraken, bedoeld in het eerste tot en met derde lid,
      betrekking hebben geschiedt uitsluitend:
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29
  - number: 29.5.a
    text: |-
      op voet van daartoe strekkende besluiten houdende toewijzing van spoorweginfrastructuurcapaciteit door de
      toewijzende instantie op grond van [artikel 29e][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel29e
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: 29e
        hoofdstuk: III
        paragraaf: '5'
  - number: 29.5.b
    text: |-
      op grond van een gebruiksovereenkomst, bedoeld in [artikel 29f][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel29f
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: 29f
        hoofdstuk: III
        paragraaf: '6'
  - number: 29.5.c
    text: |-
      in voorkomend geval met inachtneming van de aanwijzingen van de instantie belast met de verkeersleiding gegeven
      krachtens [artikel 31a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel31a
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: 31a
        hoofdstuk: III
        paragraaf: '8'
  - number: 29a.1
    text: |-
      Onze Minister verleent een exploitatievergunning als bedoeld in artikel 2, onder b, van [richtlijn 95/18]
      (31995L0018) op aanvraag aan in Nederland gevestigde spoorwegondernemingen indien:
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29a
  - number: 29a.1.a
    text: |-
      de bestuurders van de spoorwegonderneming beschikken over een met het oog op de vergunning verleende verklaring als
      bedoeld in [artikel 19 van de Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002195#Artikel19
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0002195
        artikel: '19'
  - number: 29a.1.b
    text: jegens de spoorwegonderneming of haar bestuurders geen onherroepelijk faillissement is uitgesproken,
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29a
  - number: 29a.1.c
    text: |-
      de financiële positie van de spoorwegonderneming toereikend is om gedurende ten minste een jaar te kunnen voldoen
      aan haar verplichtingen,
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29a
  - number: 29a.1.d
    text: |-
      de spoorwegonderneming naar bestuurlijke inrichting, personele bezetting en materiële uitrusting een veilige
      dienstverlening en een adequaat toezicht op de activiteiten waarop de vergunning betrekking heeft waarborgt,
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29a
  - number: 29a.1.e
    text: |-
      het met taken op het gebied van veiligheid belaste personeel en het personeel op de trein volledig zijn of zullen
      zijn gekwalificeerd voor hun werkzaamheden, en
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29a
  - number: 29a.1.f
    text: |-
      de spoorwegonderneming de uit haar wettelijke aansprakelijkheid bij ongeval voortvloeiende financiële risico's door
      verzekering of door andere gelijkwaardige voorzieningen heeft gedekt.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29a
  - number: 29a.2
    text: |-
      Onze Minister kan de vergunning beperken tot bepaalde categorieën van vervoerdiensten, bedoeld in
      [artikel 29, eerste tot en met derde lid][ref1]. Aan de vergunning kunnen met het oog op het eerste lid, onderdelen
      c tot en met f, voorschriften worden verbonden. Onze Minister kan ambtshalve of op aanvraag van de vergunninghouder
      de vergunning wijzigen, alsnog voorschriften aan de vergunning verbinden dan wel de voorschriften verbonden aan de
      vergunning aanvullen of wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel29
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '29'
        hoofdstuk: III
        paragraaf: '2'
  - number: 29a.3
    text: |-
      De aanvraag om vergunning gaat in elk geval vergezeld van de gegevens, bedoeld in de bijlage bij [richtlijn 95/18]
      (31995L0018). Een wijziging van deze bijlage geldt voor de toepassing van de eerste volzin met ingang van de dag
      waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29a
  - number: 29a.4
    text: Onze Minister beslist binnen dertien weken.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29a
  - number: 29b.1
    text: De vergunning wordt verleend voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29b
  - number: 29b.2
    text: |-
      Onze Minister kan de vergunning intrekken of de werking van de vergunning voor een door hem te bepalen termijn
      schorsen indien:
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29b
  - number: 29b.2.a
    text: |-
      de vergunninghouder niet meer voldoet aan het bepaalde bij of krachtens [artikel 29a, eerste en tweede lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel29a
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29b
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: 29a
        hoofdstuk: III
        paragraaf: '3'
  - number: 29b.2.b
    text: de vergunninghouder voornemens is zijn activiteiten ingrijpend te wijzigen of uit te breiden,
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29b
  - number: 29b.2.c
    text: ten aanzien van de vergunninghouder een aanvraag tot faillissement of surséance van betaling is ingediend,
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29b
  - number: 29b.2.d
    text: |-
      de veiligheid van het spoorvervoer door wijziging van de rechtspositie van de vergunninghouder ingeval van fusie of
      bedrijfsovername niet langer is gewaarborgd,
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29b
  - number: 29b.2.e
    text: |-
      bij herhaling bij onherroepelijk rechterlijk vonnis is vastgesteld dat de vergunninghouder of haar bestuurders het
      bepaalde bij of krachtens deze wet dan wel de van toepassing zijnde voorschriften omtrent arbeidsomstandigheden of
      arbeidstijden niet hebben nageleefd, of
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29b
  - number: 29b.2.f
    text: |-
      de vergunninghouder niet binnen zes maanden na verlening van de vergunning een aanvang heeft gemaakt met de
      activiteiten waarop de vergunning betrekking heeft dan wel die activiteiten gedurende een periode van zes maanden
      heeft gestaakt;
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29b
  - number: 29b.3
    text: |-
      Voor zover dit noodzakelijk is ter beoordeling van het voldoen aan de in [artikel 29a, eerste lid][ref1],
      neergelegde eisen, van het zich voordoen van de in [artikel 29b, tweede lid, onderdeel e][ref2], bedoelde
      omstandigheden, dan wel van het voldoen aan de in [artikel 29c, eerste lid, onderdeel b][ref3], bedoelde
      voorschriften, kunnen gegevens betreffende het gedrag van bestuurders, het gedrag van de vergunninghouder en de
      gezondheid van het personeel op de trein worden verwerkt. Onze Minister is verantwoordelijke voor de verwerking van
      de gegevens als bedoeld in de [Wet bescherming persoonsgegevens][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel29a
      [ref2]: https://wetten.overheid.nl/BWBR0001848#Artikel29b
      [ref3]: https://wetten.overheid.nl/BWBR0001848#Artikel29c
      [ref4]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29b
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: 29a
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0001848
        artikel: 29b
        hoofdstuk: III
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0001848
        artikel: 29c
        hoofdstuk: III
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0011468
  - number: 29c.1
    text: |-
      Onze Minister verleent een veiligheidsattest als bedoeld in artikel 11, eerste lid, van [richtlijn 95/19]
      (31995L0019) op aanvraag indien:
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29c
  - number: 29c.1.a
    text: |-
      de aanvrager voldoet of aantoont dat hij zal voldoen aan de met het oog op de veiligheid van het verkeer over
      de desbetreffende spoorweginfrastructuur bij of krachtens de wet gestelde voorschriften, daaronder begrepen
      voorschriften voor de constructie van rollend materieel, en
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29c
  - number: 29c.1.b
    text: |-
      het personeel op de trein voldoet aan de met het oog op de vakbekwaamheid bij of krachtens de wet gestelde
      voorschriften.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29c
  - number: 29c.2
    text: |-
      Aan het veiligheidsattest kunnen met het oog op het eerste lid voorschriften worden verbonden. Onze Minister
      kan ambtshalve of op aanvraag van de houder alsnog voorschriften aan het veiligheidsattest verbinden dan wel de
      voorschriften verbonden aan het veiligheidsattest aanvullen of wijzigen.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29c
  - number: 29d.1
    text: Het veiligheidsattest heeft een geldigheidsduur van drie jaar.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29d
  - number: 29d.2
    text: |-
      Onze Minister kan het attest tussentijds intrekken wanneer de houder niet meer voldoet aan het bepaalde bij of
      krachtens [artikel 29c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel29c
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29d
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: 29c
        hoofdstuk: III
        paragraaf: '4'
  - number: 29e.1
    text: |-
      Toewijzing van spoorweginfrastructuurcapaciteit omvat de beschikbaarstelling van naar plaats,
      omvang, tijd en duur omschreven spoorweginfrastructuur ten behoeve van de vervoerdiensten, bedoeld in
      [artikel 29, eerste tot en met derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel29
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29e
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '29'
        hoofdstuk: III
        paragraaf: '2'
  - number: 29e.2
    text: |-
      Toewijzing geschiedt op aanvraag. Indien het vertrekpunt van de dienst zich bevindt op het grondgebied van een
      andere lid-staat kan een aanvraag uitsluitend door tussenkomst van de bevoegde toewijzende instantie van die lid-
      staat worden gedaan. De toewijzende instantie stelt de betrokken toewijzende instanties van andere lid-staten
      onmiddellijk in kennis van aanvragen die mede betrekking hebben op infrastructuur in die lid-staten.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29e
  - number: 29e.3
    text: |-
      De toewijzende instantie beslist binnen acht weken. Indien de aanvraag door tussenkomst van een toewijzende
      instantie van een andere lid-staat wordt ingediend, beslist de toewijzende instantie binnen vier weken.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29e
  - number: 29e.4
    text: |-
      De toewijzende instantie weigert toewijzing wanneer de aanvrager niet beschikt over een exploitatievergunning voor
      de betreffende vervoerdiensten of over een veiligheidsattest voor de betreffende infrastructuur.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29e
  - number: 29e.5
    text: |-
      De toewijzende instantie kent de aangevraagde capaciteit toe, tenzij de capaciteit niet toereikend is. Wanneer
      de capaciteit niet toereikend is om alle aanvragen in te willigen, stemt de toewijzende instantie de toewijzing
      zo veel mogelijk af op de aanvraag, zonder onderscheid naar het land van herkomst of bestemming. De toewijzende
      instantie kan daarbij:
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29e
  - number: 29e.5.a
    text: afwijken van de aangevraagde tijdstippen,
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29e
  - number: 29e.5.b
    text: afwijken van het aangevraagde traject,
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29e
  - number: 29e.5.c
    text: capaciteit geheel of gedeeltelijk weigeren.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29e
  - number: 29f.1
    text: |-
      De daadwerkelijke uitoefening van de diensten waarop de aanspraken, bedoeld in
      [artikel 29, eerste tot en met derde lid][ref1], betrekking hebben geschiedt op grondslag van een overeenkomst
      tussen de desbetreffende spoorwegmaatschappijen en internationale samenwerkingsverbanden met de terzake van de
      desbetreffende infrastructuur bevoegde instanties waarin, mede met het oog op de veiligheid van het verkeer, de
      noodzakelijke administratieve, technische en financiële bepalingen zijn neergelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel29
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29f
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '29'
        hoofdstuk: III
        paragraaf: '2'
  - number: 29f.2
    text: |-
      Indien ten aanzien van de desbetreffende infrastructuur verschillende instanties bevoegd zijn inzake het beheer,
      de toewijzing en de verkeersleiding dragen de desbetreffende instanties zorg dat de overeenkomst, bedoeld in het
      eerste lid, tot stand komt door tussenkomst van één van hen.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29f
  - number: 29g
    text: |-
      De toewijzende instantie stelt de spoorwegondernemingen en de internationale samenwerkingsverbanden
      die van de spoorweginfrastructuur gebruik maken voor het verrichten van de diensten, bedoeld in
      [artikel 29, eerste tot en met derde lid][ref1], tijdig in kennis van alle belangrijke wijzigingen in de kwaliteit
      of de capaciteit van de betrokken infrastructuur.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel29
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel29g
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '29'
        hoofdstuk: III
        paragraaf: '2'
  - number: '30'
    text: |-
      De spoorwegondernemingen en internationale samenwerkingsverbanden die gebruik maken van de spoorweginfrastructuur
      zijn ter bestrijding van de daarmee gemoeide uitgaven aan de beheerder een door hem vast te stellen vergoeding
      verschuldigd.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel30
  - number: '31.1'
    text: |-
      De vergoeding, bedoeld in [artikel 30][ref1], kan, zonder onderscheid naar land van herkomst of bestemming, worden
      berekend aan de hand van onder andere:


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel30
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '30'
        hoofdstuk: III
        paragraaf: '7'
  - number: 31.1.a
    text: de afgelegde afstand,
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel31
  - number: 31.1.b
    text: de samenstelling van de trein,
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel31
  - number: 31.1.c
    text: de snelheid,
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel31
  - number: 31.1.d
    text: de asdruk,
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel31
  - number: 31.1.e
    text: de periode waarbinnen, het tijdstip waarop of de mate waarin van de infrastructuur gebruik wordt gemaakt,
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel31
  - number: 31.1.f
    text: de aard en de slijtage van de infrastructuur,
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel31
  - number: 31.1.g
    text: de aard van de dienst, en
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel31
  - number: 31.1.h
    text: de marktsituatie.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel31
  - number: '31.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden, na overleg met de beheerder van de spoorweginfrastructuur,
      nadere regels gesteld omtrent de wijze waarop de vergoeding wordt vastgesteld en de hoogte daarvan.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel31
  - number: '31.3'
    text: |-
      Een krachtens het tweede lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan acht
      weken na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel31
  - number: 31a
    text: |-
      Met het oog op een ongestoorde uitvoering van de toewijzingsbesluiten en, wanneer dit door calamiteiten of andere
      onvoorziene omstandigheden niet mogelijk blijkt, het bevorderen van een zo spoedig mogelijk herstel daarvan, kan
      de instantie belast met de verkeersleiding de spoorwegondernemingen, de internationale samenwerkingsverbanden
      en de beheerder aanwijzingen geven inzake het gebruik van de spoorweginfrastructuur, zonodig in afwijking van de
      toewijzingsbesluiten. Degene tot wie de aanwijzing is gericht, is verplicht daaraan onverwijld gevolg te geven.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel31a
  - number: 31b.1
    text: |-
      De beheerder, de toewijzende instantie en de instantie belast met de verkeersleiding brengen Onze Minister
      jaarlijks voor 1 april verslag uit van hun werkzaamheden in het daaraan voorafgaande kalenderjaar verricht in het
      kader van hun in dit hoofdstuk opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel31b
  - number: 31b.2
    text: |-
      De beheerder, de toewijzende instantie en de instantie belast met de verkeersleiding verstrekken Onze Minister
      desgevraagd de gevraagde inlichtingen omtrent hun werkzaamheden verricht in het kader van hun in dit hoofdstuk
      opgedragen taken. Onze Minister kan inzage vorderen van de op die werkzaamheden betrekking hebbende zakelijke
      gegevens en bescheiden.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel31b
  - number: 31c
    text: |-
      Onze Minister kan de beheerder, de toewijzende instantie en de instantie belast met de verkeersleiding algemene
      aanwijzingen geven omtrent de uitvoering van hun in dit hoofdstuk opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel31c
  - number: 31d
    text: |-
      Onze Minister kan besluiten van de beheerder, de toewijzende instantie en de instantie belast met de
      verkeersleiding vernietigen.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel31d
  - number: 31e
    text: |-
      Indien naar het oordeel van Onze Minister de beheerder, de toewijzende instantie of de instantie belast met de
      verkeersleiding de in dit hoofdstuk opgedragen taken ernstig verwaarloost, kan Onze Minister bepalen dat voor de
      duur van een door hem te bepalen tijdvak de in dit hoofdstuk toegekende bevoegdheden door hem worden uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel31e
  - number: 31f.1
    text: |-
      De houder van een exploitatievergunning en de houder van een veiligheidsattest stellen Onze Minister onverwijld in
      kennis van elke wijziging van omstandigheden, van belang voor de verlening, wijziging, schorsing of intrekking van
      een vergunning respectievelijk veiligheidsattest.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel31f
  - number: 31f.2
    text: |-
      Wanneer Onze Minister van oordeel is dat ernstige twijfel bestaat over de naleving van het bepaalde krachtens
      [richtlijn 95/18](31995L0018) door een spoorwegonderneming waaraan door de bevoegde instantie van een andere lid-
      staat vergunning is verleend, stelt Onze Minister die bevoegde instantie daarvan onverwijld in kennis.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel31f
  - number: 31g.1
    text: |-
      Onze Minister doet onverwijld mededeling van zijn besluiten tot verlening, wijziging, schorsing of intrekking van
      een vergunning of veiligheidsattest aan de toewijzende instantie.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel31g
  - number: 31g.2
    text: |-
      Onze Minister doet onverwijld mededeling van zijn besluiten tot wijziging, schorsing of intrekking van een
      vergunning aan de Commissie van de Europese Gemeenschappen.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel31g
  - number: 31h.1
    text: |-
      Tegen een op grond van dit hoofdstuk door Onze Minister genomen besluit kan een belanghebbende beroep instellen bij
      het College van Beroep voor het bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel31h
  - number: 31h.2
    text: |-
      Op een beroep tegen een besluit van de toewijzende instantie inzake de toewijzing of tegen een
      besluit van de beheerder inzake de gebruiksvergoeding doet de rechtbank zonodig in afwijking van
      [artikel 8.66 van de Algemene wet bestuursrecht][ref1] binnen acht weken na de sluiting van het onderzoek
      uitspraak. Een belanghebbende en de toewijzende instantie onderscheidenlijk de beheerder kunnen bij het College van
      Beroep voor het bedrijfsleven hoger beroep instellen tegen de uitspraak van de rechtbank en tegen de uitspraak van
      de president van de rechtbank in geval van toepassing van [artikel 8:86 van de Algemene wet bestuursrecht][ref2] op
      een beroep als bedoeld in de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel31h
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 31h.3
    text: |-
      Besluiten van Onze Minister in de hoedanigheid van toewijzende instantie en beheerder op grond van
      [artikel 28, derde lid][ref1], en [artikel 31e][ref2] gelden voor de mogelijkheid van beroep en hoger beroep als
      besluiten van de toewijzende instantie respectievelijk van de beheerder. Het eerste lid is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0001848#Artikel31e
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel31h
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '28'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0001848
        artikel: 31e
        hoofdstuk: III
        paragraaf: '9'
  - number: '32.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent het bepaalde in dit
      hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel32
  - number: '32.2'
    text: |-
      De nadere regels kunnen onder meer voorzien in de verplichting voor de aanvrager tot het stellen van zekerheid bij
      de indiening van een aanvraag om toewijzing van spoorweginfrastructuurcapaciteit en het vervallen daarvan wanneer
      de aanvrager niet of niet volledig gebruik maakt van hem toegewezen capaciteit. Voorts kunnen de nadere regels
      voorzien in regels met betrekking tot het geheel of gedeeltelijk intrekken of wijzigen van besluiten houdende
      toewijzing van capaciteit wanneer de gronden tot toewijzing zijn vervallen of gewijzigd dan wel de aanvrager niet
      of niet volledig gebruik maakt van hem toegewezen capaciteit.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel32
  - number: '32.3'
    text: |-
      In de nadere regels kan bepaald worden dat bij de toewijzing voorrang wordt gegeven aan in het belang van het
      publiek verrichte diensten in de zin van [Verordening (EEG) nr. 1191/69](31969R1191) en aan diensten die geheel
      of gedeeltelijk worden verricht op speciaal voor deze diensten aangelegde of uitgeruste spoorweginfrastructuur,
      zonder onderscheid naar land van herkomst of bestemming. Voorts kunnen de nadere regels voorzien in de verlening
      van bijzondere rechten inzake de toewijzing aan spoorwegondernemingen die bepaalde categorieën diensten
      dan wel diensten in bepaalde gebieden verrichten indien deze rechten onmisbaar zijn voor een goede openbare
      dienstverrichting of voor een doeltreffend gebruik van de spoorweginfrastructuurcapaciteit dan wel om financiering
      van spoorweginfrastructuur mogelijk te maken, zonder onderscheid naar het land van herkomst of bestemming en
      onverminderd de artikelen 85, 86 en 90 van het Verdrag tot oprichting van de Europese Economische Gemeenschap.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel32
  - number: '32.4'
    text: |-
      Een krachtens het eerste lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan acht
      weken na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel32
  - number: 32a.1
    text: 'In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel32a
  - number: 32a.1.a
    text: 'Onze Minister: Onze Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel32a
  - number: 32a.1.b
    text: |-
      [richtlijn 96/48/EG](31996L0048): [richtlijn nr. 96/48/EG](31996L0048) van de Raad van de Europese Unie van 23 juli
      1996 betreffende de interoperabiliteit van het transeuropees hoge-snelheidsspoorwegsysteem (PbEG L 235);
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel32a
  - number: 32a.1.c
    text: |-
      subsysteem van structurele aard: subsysteem als bedoeld in bijlage II, onder 1, onderdeel 1.1, van [richtlijn
      96/48/EG](31996L0048).
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel32a
  - number: 32a.2
    text: |-
      De begripsbepalingen, bedoeld in artikel 2 van [richtlijn 96/48/EG](31996L0048), zijn op dit hoofdstuk en de daarop
      berustende bepalingen van toepassing.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel32a
  - number: 32a.3
    text: |-
      Deze wet en de daarop berustende bepalingen zijn niet van toepassing op subsystemen en
      interoperabiliteitsonderdelen voor zover de toepassing in strijd zou zijn met bij of krachtens [richtlijn 96/48/EG]
      (31996L0048) vastgestelde bepalingen.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel32a
  - number: 32b.1
    text: |-
      Het is verboden een interoperabiliteitsonderdeel in de handel te brengen dat niet voldoet aan de essentiële eisen.
      Degene die het onderdeel in de handel brengt, zorgt dat het onderdeel ter voldoening aan de essentiële eisen ten
      minste met inachtneming van de bepalingen van de toepasselijke technische specificaties inzake interoperabiliteit
      onderzocht is op overeenstemming met de relevante Europese specificaties.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel32b
  - number: 32b.2
    text: |-
      Interoperabiliteitsonderdelen waarvoor in een lidstaat van de Europese Unie of in een andere staat die partij
      is bij de Overeenkomst betreffende de Europese Economische Ruimte, een EG-verklaring van conformiteit of een
      EG-verklaring van geschiktheid voor gebruik als bedoeld in artikel 10, eerste lid, van [richtlijn 96/48/EG]
      (31996L0048) is opgesteld, worden vermoed te voldoen aan de desbetreffende essentiële eisen.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel32b
  - number: 32b.3
    text: |-
      Degene die een interoperabiliteitsonderdeel gebruikt, zorgt dat het onderdeel binnen zijn toepassingsgebied wordt
      gebruikt overeenkomstig zijn bestemming, en dat het naar behoren wordt geïnstalleerd en onderhouden.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel32b
  - number: 32c.1
    text: |-
      Het is verboden een subsysteem van structurele aard in gebruik te nemen dat niet voldoet aan de essentiële eisen,
      of niet in overeenstemming is met de technische specificaties inzake interoperabiliteit.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel32c
  - number: 32c.2
    text: |-
      Degene die een subsysteem van structurele aard exploiteert of beheert, zorgt dat de exploitatie dan wel het
      beheer voldoet aan de essentiële eisen en geschiedt in overeenstemming met de technische specificaties inzake
      interoperabiliteit.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel32c
  - number: 32c.3
    text: |-
      Subsystemen waarvoor in een lidstaat van de Europese Unie of in een andere staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte, een EG-keuringsverklaring als bedoeld in artikel 16, eerste lid,
      van [richtlijn 96/48/EG](31996L0048) is opgesteld, worden vermoed te voldoen aan de essentiële eisen en in
      overeenstemming te zijn met de technische specificaties inzake interoperabiliteit.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel32c
  - number: 32d.1
    text: |-
      Een EG-verklaring van conformiteit of van geschiktheid voor gebruik voor een interoperabiliteitsonderdeel kan
      worden opgesteld door de fabrikant indien deze in Nederland is gevestigd, of door een in Nederland gevestigde
      gemachtigde van de fabrikant.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel32d
  - number: 32d.2
    text: |-
      Indien het eerste lid geen toepassing vindt, kan de EG-verklaring van conformiteit of van geschiktheid voor gebruik
      van een interoperabiliteitsonderdeel worden opgesteld door degene die het interoperabiliteitsonderdeel in Nederland
      in de handel brengt.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel32d
  - number: 32d.3
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op degene die in Nederland
      interoperabiliteitsonderdelen van diverse herkomst of delen daarvan assembleert of voor eigen gebruik vervaardigt.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel32d
  - number: 32d.4
    text: |-
      Indien de desbetreffende technische specificatie inzake interoperabiliteit bepaalt dat de beoordeling van de
      conformiteit of van de geschiktheid voor gebruik van het interoperabiliteitsonderdeel wordt uitgevoerd door een
      aangemelde instantie, wordt de EG-verklaring niet opgesteld, dan nadat voor het desbetreffende onderdeel een
      onderzoekcertificaat is afgegeven door een aangemelde instantie.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel32d
  - number: 32d.5
    text: |-
      De EG-keuringsverklaring bij een subsysteem kan worden opgesteld door de aanbestedende dienst indien deze in
      Nederland is gevestigd, of door een in Nederland gevestigde gemachtigde van de aanbestedende dienst. De EG-
      keuringsverklaring wordt niet opgesteld, dan nadat voor het subsysteem door een aangemelde instantie een
      conformiteitsverklaring is afgegeven.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel32d
  - number: 32d.6
    text: |-
      EG-verklaringen van conformiteit of van geschiktheid voor gebruik en EG-keuringsverklaringen worden opgesteld met
      inachtneming van de technische specificaties inzake interoperabiliteit.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel32d
  - number: 32d.7
    text: |-
      Onze Minister kan op aanvraag een instantie erkennen als een op de voet van artikel 20, eerste lid, van [richtlijn
      96/48/EG](31996L0048) aan te melden instantie, indien de instantie aantoont te voldoen aan de minimumcriteria van
      bijlage VII van de richtlijn, en aan de bij ministeriële regeling vastgestelde erkenningscriteria. Aan de erkenning
      kunnen voorschriften en beperkingen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel32d
  - number: 32d.8
    text: |-
      Bij ministeriële regeling kunnen tarieven worden vastgesteld voor de behandeling van de aanvraag tot erkenning als
      aan te melden instantie. Onze Minister kan bij ministeriële regeling maxima vaststellen voor de door aangemelde
      instanties voor hun werkzaamheden te rekenen bedragen.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel32d
  - number: 32e.1
    text: |-
      Onze Minister kan handel in en gebruik van een interoperabiliteitsonderdeel beperken of verbieden, indien het
      onderdeel bij gebruik overeenkomstig zijn bestemming de naleving van de essentiële eisen in het gedrang dreigt
      te brengen. Onze Minister kan de fabrikant of diens gemachtigde en degene die het onderdeel in de handel brengt,
      gelasten om overeenkomstig daarbij gegeven aanwijzingen passende maatregelen te treffen om reeds in de handel
      gebrachte interoperabiliteitsonderdelen uit de handel te nemen.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel32e
  - number: 32e.2
    text: |-
      Onverminderd het eerste lid is degene die ten onrechte een EG-verklaring van conformiteit heeft opgesteld, op
      last van Onze Minister verplicht het desbetreffende interoperabiliteitsonderdeel binnen een door Onze Minister te
      bepalen termijn en overeenkomstig daarbij gegeven aanwijzingen in overeenstemming te brengen met de EG-verklaring.
      Indien het onderdeel na afloop van de termijn niet in overeenstemming is gebracht, kan Onze Minister de handel
      in en de toepassing van het onderdeel beperken of verbieden. Voorts kan Onze Minister degene die ten onrechte de
      EG-verklaring heeft opgesteld en degene die het onderdeel in de handel brengt gelasten om overeenkomstig daarbij
      gegeven aanwijzingen passende maatregelen te treffen om reeds in de handel gebrachte interoperabiliteitsonderdelen
      uit de handel te nemen.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel32e
  - number: 32f.1
    text: |-
      Machtiging tot ingebruikneming als bedoeld in [artikel 7][ref1] wordt ten aanzien van een subsysteem van
      structurele aard verleend indien:


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel7
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel32f
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '7'
        hoofdstuk: I
  - number: 32f.1.a
    text: |-
      de aanvrager aantoont dat het subsysteem zodanig is ontworpen, geconstrueerd, geïnstalleerd en kan worden
      geëxploiteerd, dat de inachtneming van de essentiële eisen niet in het gedrang komt door opneming van het
      subsysteem in het transeuropees hoge-snelheidsspoorwegsysteem en deze overigens niet in strijd is met bij of
      krachtens [richtlijn 96/48/EG](31996L0048) vastgestelde bepalingen of met toepasselijke wettelijke voorschriften;
      of
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel32f
  - number: 32f.1.b
    text: |-
      de aanvraag tot machtiging vergezeld gaat van een EG-keuringsverklaring met technisch dossier als bedoeld in
      artikel 18, derde lid, van [richtlijn 96/48/EG](31996L0048).
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel32f
  - number: 32f.2
    text: |-
      In afwijking van het eerste lid, aanhef en onderdeel b, verzoekt Onze Minister de aanvrager voor eigen rekening
      bepaalde aanvullende keuringen te laten uitvoeren, indien het subsysteem ondanks de EG-keuringsverklaring niet
      in overeenstemming is met bij of krachtens [richtlijn 96/48/EG](31996L0048) vastgestelde bepalingen of met
      toepasselijke wettelijke voorschriften.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel32f
  - number: 32f.3
    text: |-
      Indien een subsysteem waarvoor machtiging als bedoeld in [artikel 7][ref1] is verleend of dat met toestemming
      van de bevoegde autoriteiten van een andere lidstaat van de Europese Unie of een andere staat die partij is bij
      de Overeenkomst betreffende de Europese Economische Ruimte in gebruik is genomen, niet in overeenstemming is met
      bij of krachtens [richtlijn 96/48/EG](31996L0048) vastgestelde bepalingen of in strijd met dergelijke bepalingen
      wordt geëxploiteerd, kan Onze Minister beperkingen en voorschriften verbinden aan de exploitatie of de exploitatie
      verbieden. Indien voor het subsysteem een EG-keuringsverklaring is opgesteld, verzoekt Onze Minister de exploitant
      op eigen rekening bepaalde aanvullende keuringen te laten uitvoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel7
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel32f
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '7'
        hoofdstuk: I
  - number: 32g.1
    text: |-
      Ter uitvoering van dit hoofdstuk en [richtlijn 96/48/EG](31996L0048) worden bij of krachtens algemene maatregel van
      bestuur nadere regels gesteld. Tevens kunnen bij of krachtens algemene maatregel van bestuur regels worden gesteld
      met betrekking tot interoperabiliteitsonderdelen en subsystemen, voor zover dat nodig is voor uitvoering van andere
      bindende besluiten van de Raad van de Europese Unie, van het Europees Parlement en de Raad gezamenlijk of van de
      Commissie van de Europese Gemeenschappen.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel32g
  - number: 32g.2
    text: |-
      Onze Minister kan met inachtneming van artikel 7 van [richtlijn 96/48/EG](31996L0048) een technische specificatie
      inzake interoperabiliteit geheel of gedeeltelijk buiten toepassing verklaren.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel32g
  - number: 32g.3
    text: |-
      Onze Minister is bevoegd tot toepassing van bestuursdwang ter handhaving van het bij of krachtens dit hoofdstuk
      bepaalde.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel32g
  - number: 32g.4
    text: |-
      Tegen een op grond van dit hoofdstuk genomen besluit kan een belanghebbende beroep instellen bij het College van
      Beroep voor het bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel32g
  - number: 32g.5
    text: |-
      Een wijziging van [richtlijn 96/48/EG](31996L0048) en vaststelling of wijziging van een technische specificatie
      inzake interoperabiliteit of een Europese specificatie gaat voor de toepassing van deze wet en de daarop berustende
      bepalingen gelden met ingang van de dag waarop daaraan uitvoering moet zijn gegeven, tenzij bij ministerieel
      besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel32g
  - number: 32g.6
    text: |-
      Vaststelling of wijziging van een technische specificatie inzake interoperabiliteit of een Europese specificatie is
      niet van toepassing op interoperabiliteitsonderdelen waarvoor op het moment van inwerkingtreding van de wijziging
      een EG-verklaring is opgesteld, tenzij bij ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt,
      anders wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel32g
  - number: 32g.7
    text: |-
      Vaststelling of wijziging van een technische specificatie inzake interoperabiliteit of een Europese specificatie
      is niet van toepassing op subsystemen van structurele aard waarvoor op het moment van inwerkingtreding van de
      wijziging reeds machtiging als bedoeld in [artikel 7][ref1] is verleend of een EG-keuringsverklaring is opgesteld,
      tenzij bij ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, anders wordt bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel7
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel32g
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '7'
        hoofdstuk: I
  - number: '33.1'
    text: |-
      Elke spoorweg wordt, op de bij algemeenen maatregel van bestuur te bepalen wijze en behoudens daarbij te
      omschrijven uitzonderingen, afgesloten.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel33
  - number: '33.2'
    text: De kosten dier afsluiting worden gedragen door de ondernemers der over den spoorweg loopende dienst.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel33
  - number: 33a.1
    text: |-
      Met betrekking tot door Onze Minister van Verkeer en Waterstaat aangewezen spoorwegen of gedeelten daarvan,
      aangelegd door of langs bos-, veen- of heidegronden of gronden met andere licht brandbare gewassen begroeid, zorgen
      bestuurders van de spoorwegdienst dat het terrein van de spoorweg, door het graven van sloten, het omspitten of het
      bedekken met onbrandbare stoffen van een doorgaande strook gronds of door enig ander middel, van de aangrenzende
      eigendommen wordt afgescheiden, aldus, dat bij het ontstaan van brand op het terrein van de spoorweg, de brand zich
      niet op de aangrenzende eigendommen uitbreidt.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel33a
  - number: 33a.2
    text: |-
      Op het maken en instandhouden van deze voorzieningen zijn [artikel 13][ref1], het [eerste lid van artikel 14][ref2]
      en [artikel 15][ref3] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0001848#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0001848#Artikel15
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '13'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0001848
        artikel: '14'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0001848
        artikel: '15'
        hoofdstuk: II
  - number: '34.1'
    text: |-
      Zij, wier landen of erven door den spoorweg van den gemeenen weg of de gemeene vaart worden gescheiden, hebben over
      den spoorweg een regt van uitweg.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel34
  - number: '34.2'
    text: |-
      Met betrekking tot zoodanige uitwegen geldt [artikel 57 van Boek 5 van het Burgerlijk Wetboek][ref1], met
      uitzondering der verpligting tot schadevergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel57
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '57'
  - number: '34.3'
    text: |-
      Uitweg over den spoorweg kan ook in andere gevallen, voor zoover met de veiligheid van het verkeer bestaanbaar is,
      bij overeenkomst, onder goedkeuring van Onzen Minister van Verkeer en Waterstaat, worden toegestaan.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel34
  - number: '35.1'
    text: De sluiting der hekken langs den spoorweg geschiedt door of van wege de ondernemers der spoorwegdienst.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel35
  - number: '35.2'
    text: |-
      Waar de hekken tot afsluiting van uit- of overwegen dienen, geschiedt de sluiting door of van wege hen, die, hetzij
      als eigenaars, huurders of pachters of krachtens eenigen anderen titel, bruikers van landen of erven zijnde, genot
      van die wegen hebben.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel35
  - number: '36.1'
    text: |-
      Binnen den afstand van acht meter van een spoorweg en waar die in gebogen rigting is aangelegd, langs de
      binnenzijde van den boog, binnen den afstand van twintig meter, wordt geen gebouw, muur, schutting, aarden wal of
      ander verheven voorwerp opgerigt en worden geen boomen of houtgewas geplant of aangelegd.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel36
  - number: '36.2'
    text: |-
      Ter plaatse van openbare overwegen buiten bebouwde kommen is het vorig lid, met uitbreiding van den daar genoemden
      afstand van acht meter, mede van toepassing op het terrein begrensd door vier lijnen, getrokken uit punten aan
      weerskanten van den spoorweg gelegen op den openbaren weg op een afstand van twintig meter van den spoorweg, naar
      punten, gelegen op den spoorweg op een afstand van vijfhonderd meter aan weerskanten van den overweg.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel36
  - number: '37'
    text: Binnen den afstand van zes meter van een spoorweg geschiedt geenerlei uitgraving.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel37
  - number: '38'
    text: |-
      Binnen den afstand van twintig meter van een spoorweg worden geene riet- of stroodaken geplaatst, noch ligt
      ontvlambare stoffen nedergelegd.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel38
  - number: '39'
    text: |-
      Van de bepalingen in de [artt. 36][ref1], [37][ref2] en [38][ref3] kan door Onzen Minister van Waterstaat, waar het
      zonder nadeel voor de openbare veiligheid en voor den spoorweg kan geschieden, ontheffing worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0001848#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0001848#Artikel38
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '36'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0001848
        artikel: '37'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0001848
        artikel: '38'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '40.1'
    text: |-
      De afstand, in de [artikelen 36, eerste lid][ref1], [37][ref2] en [38][ref3] bedoeld, wordt gemeten uit den
      teen der glooiing van den spoorweg, waar deze in ophooging, uit de bovenlijn der glooiing, waar de spoorweg in
      ingraving, en uit een lijn, gelegen op een afstand van drie meter uit de as van het naastbijgelegen spoor, waar de
      spoorweg noch in ophooging noch in ingraving ligt.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0001848#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0001848#Artikel38
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '36'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0001848
        artikel: '37'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0001848
        artikel: '38'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '40.2'
    text: |-
      Op stations en halten wordt de bedoelde afstand gemeten uit de afsluiting van den spoorweg of, waar deze door een
      sloot wordt gevormd, uit de bovenlijn van den buitensten boord.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel40
  - number: '40.3'
    text: |-
      De afstand van twintig meter, bedoeld in [artikel 36, tweede lid][ref1], wordt gemeten in de as van den openbaren
      weg uit de as van het naastbijgelegen spoor, de afstand van vijfhonderd meter in de as van den spoorweg uit de as
      van den overweg.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel36
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '36'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '41'
    text: |-
      De Minister van Verkeer en Waterstaat is bevoegd tot toepassing van bestuursdwang ter handhaving van het bepaalde
      in de [artikelen 36][ref1], [37][ref2] en [38][ref3]. Hij kan hiertoe mandaat verlenen aan de bestuurders der
      spoorwegdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0001848#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0001848#Artikel38
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '36'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0001848
        artikel: '37'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0001848
        artikel: '38'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '42'
    text: Het is verboden op de spoorwegen eenig voorwerp, dat het verkeer belemmeren kan, neder te leggen.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel42
  - number: '43'
    text: |-
      Het is aan elk, wien het uit den aard zijner betrekking niet vrij staat, verboden, buiten toestemming van de
      bestuurders der dienst, of van hem, wien dit door de bestuurders is opgedragen, langs of op den spoorweg te loopen
      of te rijden.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel43
  - number: '44'
    text: |-
      Het is verboden, buiten de toestemming in het vorig artikel bedoeld, paarden, vee of andere dieren langs of op den
      spoorweg te drijven of te laten loopen.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel44
  - number: '50.1'
    text: |-
      Het geheel of gedeeltelijk gebruik van elken spoorweg en van het aan eene spoorwegonderneming toebehoorende
      materieel kan ten allen tijde door Ons, in het belang van ’s Rijks dienst, tegen schadeloosstelling worden
      gevorderd.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel50
  - number: '50.2'
    text: |-
      Indien het gebruik voor ’s Rijks dienst, als bedoeld in de eerste alinea, nodig is in het belang van ’s lands
      verdediging, kan de bedoelde vordering geschieden door de Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel50
  - number: '50.3'
    text: De schadeloosstelling wordt, bij gebreke van minnelijke schikking, door den regter bepaald.
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel50
  - number: '51'
    text: |-
      Regelen omtrent de aanwending van spoorwegen en spoorwegmaterieel in de gevallen, bedoeld in [art. 24][ref1] en
      de[ 2de alinea van art. 50][ref2], worden door Ons bij algemeenen maatregel van inwendig bestuur gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0001848#Artikel50
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '24'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0001848
        artikel: '50'
        hoofdstuk: V
  - number: '52'
    text: |-
      Kan in het geval, bij [art. 50][ref1] bedoeld, het vervoer van reizigers of goederen niet langs den spoorweg plaats
      hebben, dan wordt in dat vervoer voorzien op de bij [art. 18][ref2] bepaalde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0001848#Artikel18
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '50'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0001848
        artikel: '18'
        hoofdstuk: II
  - number: '53'
    text: |-
      De bestuurders eener spoorwegdienst worden gestraft: zoo zij de voorwaarden, waarop de vergunning tot uitoefening
      der dienst is verleend, niet naleven of daarmede in strijd handelen of doen handelen, met geldboete van de derde
      categorie; zoo zij de bepalingen van deze wet niet naleven of daarmede in strijd handelen of doen handelen, voor
      zoover daaromtrent niet in het bijzonder is voorzien, met geldboete van de derde categorie; zoo zij de dienst op
      den spoorweg openen, alvorens het dienstreglement, in [art. 6][ref1] bedoeld, is goedgekeurd, of die hetzij openen
      hetzij hervatten, alvorens de in het [1ste lid van art. 7][ref2] bedoelde magtiging verleend is, met geldboete van
      de derde categorie bij de openstelling of hervatting van de dienst, en van de tweede categorie voor elke dag, dien
      de geopende of hervatte dienst heeft geduurd; zoo zij de dienst voortzetten na bevel tot staking, of die hervatten
      zonder de toestemming, in [art. 20][ref3] bedoeld, met geldboete van de derde categorie bij de voortzetting of
      hervatting van de dienst, en van de tweede categorie voor elke dag, dien de voortzetting of hervatting heeft
      geduurd; zoo zij nieuwe of herstelde locomotieven, tenders, rijtuigen of wagens in gebruik nemen, alvorens zij
      daartoe, ten gevolge der opneming in het [laatste lid van art. 7][ref4] voorgeschreven, zijn gemagtigd, met
      geldboete van de tweede categorie voor elke locomotief, tender, rijtuig of wagen; zoo zij in gebreke blijven te
      voldoen aan de beslissing van den Minister van Verkeer en Waterstaat, in [art 14][ref5] bedoeld, of aan den in de
      voorlaatste alinea van [art. 13][ref6] bedoelden last, met geldboete van de eerste categorie voor elke dag verzuim;
      zoo zij het in[ art. 5][ref7] bedoeld reglement op het gemeenschappelijk gebruik van een spoorweg, de aldaar en
      in [art. 32][ref8] bedoelde regeling voor het gemeenschappelijk gebruik van stations en voor het doorgaand vervoer
      van reizigers en goederen, of een krachtens een der [artikelen 27][ref9], [27][ref10], [27][ref11] of [33][ref12]
      uitgevaardigden algemeenen maatregel van inwendig bestuur niet naleven of daarmede in strijd handelen of doen
      handelen, met geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001848#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0001848#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0001848#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0001848#Artikel14
      [ref6]: https://wetten.overheid.nl/BWBR0001848#Artikel13
      [ref7]: https://wetten.overheid.nl/BWBR0001848#Artikel5
      [ref8]: https://wetten.overheid.nl/BWBR0001848#Artikel32
      [ref9]: https://wetten.overheid.nl/BWBR0001848#Artikel27
      [ref10]: https://wetten.overheid.nl/BWBR0001848#Artikel27c
      [ref11]: https://wetten.overheid.nl/BWBR0001848#Artikel27d
      [ref12]: https://wetten.overheid.nl/BWBR0001848#Artikel33
    url: https://wetten.overheid.nl/BWBR0001848/2002-06-01#Artikel53
