  - number: '11'
    text: |-
      De in [artikel 10][ref1] bedoelde ambtenaren hebben recht op gratis vervoer in alle treinen.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel10
    url: https://wetten.overheid.nl/BWBR0001848/2009-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '10'
        hoofdstuk: II
  - number: '13'
    text: |-
      1 De in [artikel 10][ref1] bedoelde ambtenaren geven schriftelijk kennis aan de bestuurders der spoorwegdienst van
      hetgeen naar hun oordeel tot instandhouding van den spoorweg en tot behoorlijke uitoefening van de dienst behoort
      te worden gedaan.

      2 Zij roepen, zoo de bestuurders daaraan geen behoorlijk gevolg geven, de beslissing van den Minister van Verkeer
      en Waterstaat in.

      3 De bestuurders kunnen tegen hetgeen hun aanbevolen werd, administratief beroep instellen bij de Minister.

      4 Bij onmiddellijk gevaar kan degene, die ingevolge de bij [artikel 10, eerste lid][ref2], bedoelde regelen als
      hoofd van het toezicht is aangewezen, of de Minister last geven tot onverwijlde voorziening niettegenstaande het
      administratief beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0001848#Artikel10
    url: https://wetten.overheid.nl/BWBR0001848/2009-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '10'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0001848
        artikel: '10'
        hoofdstuk: II
  - number: '14'
    text: |-
      1 Aan de beslissing van den Minister van Verkeer en Waterstaat wordt binnen den daarbij te stellen tijd door de
      bestuurders der dienst voldaan.

      2 Geschiedt dit niet, dan is de Minister van Verkeer en Waterstaat bevoegd:

      zoo er nalatigheid bestaat met opzigt tot het herstellen of vernieuwen van den spoorweg of van de daartoe
      behoorende werken en gebouwen, of met opzigt tot de aanvulling van behoeften voor de dienst en van het getal
      beambten of bedienden, staking van de dienst te bevelen;

      zoo die bestaat met opzigt tot het herstellen of vernieuwen van de voor de spoorwegdienst bestemde locomotieven,
      tenders, rijtuigen of wagens, het gebruik van zoodanige locomotieven, tenders, rijtuigen of wagens te verbieden en,
      zoo noodig, tot oplegging van een last onder bestuursdwang.
    url: https://wetten.overheid.nl/BWBR0001848/2009-07-01#Artikel14
  - number: '15'
    text: |-
      De Minister van Verkeer en Waterstaat is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving
      van zijn beslissing, indien de bestuurders van de spoorwegdienst de bevolen herstellingen of vernieuwingen aan
      de spoorweg of aan de daartoe behorende werken en gebouwen niet uitvoeren, of niet tot de door hem nodig geachte
      aanvulling van behoeften voor de dienst of van het getal beambten of bedienden overgaan.
    url: https://wetten.overheid.nl/BWBR0001848/2009-07-01#Artikel15
  - number: '16'
    text: |-
      1 Vordert de openbare veiligheid dadelijke staking van de dienst, hetzij over den geheelen weg, hetzij over een
      gedeelte daarvan, dan kan die staking worden bevolen door een in [artikel 10][ref1] bedoelde ambtenaar.

      2 Dit bevel wordt gegeven door hem, die daartoe, volgens de door Ons voor te schrijven regelen, bevoegd is, en
      zooveel mogelijk schriftelijk gerigt aan de hoofdbeambten van de meest nabij zijnde stations, die daarvan terstond
      aan alle hoofdbeambten van de stations langs den weg kennis geven.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel10
    url: https://wetten.overheid.nl/BWBR0001848/2009-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '10'
        hoofdstuk: II
  - number: '17'
    text: |-
      1 Onverminderd de [artikelen 7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2] kunnen, ingeval buitengewone omstandigheden
      dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-President, de [artikelen 17][ref3],
      [18][ref4], [19][ref5], [23][ref6], [24][ref7] en [50, tweede alinea][ref8], in werking worden gesteld.

      2 Wanneer het in de eerste alinea bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepalingen.

      3 Wordt het voorstel van wet door de Staten-Generaal verworpen, dan worden bij koninklijk besluit, op voordracht
      van Onze Minister-President, de bepalingen die ingevolge de eerste alinea in werking zijn gesteld, onverwijld
      buiten werking gesteld.

      4 Bij koninklijk besluit, op voordracht van Onze Minister-President, worden bepalingen die ingevolge de eerste
      alinea in werking zijn gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.

      5 Het besluit, bedoeld in de eerste, derde en vierde alinea, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking..

      6 Het besluit, bedoeld in de eerste, derde en vierde alinea, wordt in ieder geval geplaatst in het *Staatsblad*.


