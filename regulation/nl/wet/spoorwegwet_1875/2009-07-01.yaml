  - number: '34'
    text: |-
      1 Zij, wier landen of erven door den spoorweg van den gemeenen weg of de gemeene vaart worden gescheiden, hebben
      over den spoorweg een regt van uitweg.

      2 Met betrekking tot zoodanige uitwegen geldt [artikel 57 van Boek 5 van het Burgerlijk Wetboek][ref1], met
      uitzondering der verpligting tot schadevergoeding.

      3 Uitweg over den spoorweg kan ook in andere gevallen, voor zoover met de veiligheid van het verkeer bestaanbaar
      is, bij overeenkomst, onder goedkeuring van Onzen Minister van Verkeer en Waterstaat, worden toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel57
    url: https://wetten.overheid.nl/BWBR0001848/2009-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '57'
  - number: '35'
    text: |-
      1 De sluiting der hekken langs den spoorweg geschiedt door of van wege de ondernemers der spoorwegdienst.

      2 Waar de hekken tot afsluiting van uit- of overwegen dienen, geschiedt de sluiting door of van wege hen, die,
      hetzij als eigenaars, huurders of pachters of krachtens eenigen anderen titel, bruikers van landen of erven zijnde,
      genot van die wegen hebben.
    url: https://wetten.overheid.nl/BWBR0001848/2009-07-01#Artikel35
  - number: '36'
    text: |-
      1 Binnen den afstand van acht meter van een spoorweg en waar die in gebogen rigting is aangelegd, langs de
      binnenzijde van den boog, binnen den afstand van twintig meter, wordt geen gebouw, muur, schutting, aarden wal of
      ander verheven voorwerp opgerigt en worden geen boomen of houtgewas geplant of aangelegd.

      2 Ter plaatse van openbare overwegen buiten bebouwde kommen is het vorig lid, met uitbreiding van den daar
      genoemden afstand van acht meter, mede van toepassing op het terrein begrensd door vier lijnen, getrokken uit
      punten aan weerskanten van den spoorweg gelegen op den openbaren weg op een afstand van twintig meter van den
      spoorweg, naar punten, gelegen op den spoorweg op een afstand van vijfhonderd meter aan weerskanten van den
      overweg.
    url: https://wetten.overheid.nl/BWBR0001848/2009-07-01#Artikel36
  - number: '37'
    text: Binnen den afstand van zes meter van een spoorweg geschiedt geenerlei uitgraving.
    url: https://wetten.overheid.nl/BWBR0001848/2009-07-01#Artikel37
  - number: '38'
    text: |-
      Binnen den afstand van twintig meter van een spoorweg worden geene riet- of stroodaken geplaatst, noch ligt
      ontvlambare stoffen nedergelegd.
    url: https://wetten.overheid.nl/BWBR0001848/2009-07-01#Artikel38
  - number: '39'
    text: |-
      Van de bepalingen in de [artt. 36][ref1], [37][ref2] en [38][ref3] kan door Onzen Minister van Waterstaat, waar het
      zonder nadeel voor de openbare veiligheid en voor den spoorweg kan geschieden, ontheffing worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0001848#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0001848#Artikel38
    url: https://wetten.overheid.nl/BWBR0001848/2009-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '36'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0001848
        artikel: '37'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0001848
        artikel: '38'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '40'
    text: |-
      1 De afstand, in de [artikelen 36, eerste lid][ref1], [37][ref2] en [38][ref3] bedoeld, wordt gemeten uit den
      teen der glooiing van den spoorweg, waar deze in ophooging, uit de bovenlijn der glooiing, waar de spoorweg in
      ingraving, en uit een lijn, gelegen op een afstand van drie meter uit de as van het naastbijgelegen spoor, waar de
      spoorweg noch in ophooging noch in ingraving ligt.

      2 Op stations en halten wordt de bedoelde afstand gemeten uit de afsluiting van den spoorweg of, waar deze door een
      sloot wordt gevormd, uit de bovenlijn van den buitensten boord.

      3 De afstand van twintig meter, bedoeld in [artikel 36, tweede lid][ref4], wordt gemeten in de as van den openbaren
      weg uit de as van het naastbijgelegen spoor, de afstand van vijfhonderd meter in de as van den spoorweg uit de as
      van den overweg.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0001848#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0001848#Artikel38
      [ref4]: https://wetten.overheid.nl/BWBR0001848#Artikel36
    url: https://wetten.overheid.nl/BWBR0001848/2009-07-01#Artikel40
