  - number: '70'
    text: |-
      1 Wegen door het Rijk of door eene spoorwegonderneming aangelegd tot toegang naar een station worden, voor
      zoover dit nog niet mogt zijn geschied, aan de gemeenten, op welker grondgebied zij liggen, in behoorlijken staat
      overgedragen; daarna komt het onderhoud en de verlichting ten haren laste.

      2 Ligt een toegangsweg op het grondgebied van meer dan eene gemeente, dan wordt door Ons, den Raad van State
      gehoord, beslist aan welke gemeente die weg zal worden overgedragen.

      3 Onderhoud van wegen aan het Rijk, aan gemeenten of anderen toebehoorende, vóór den aanleg van een spoorweg
      aangelegd, die tot toegang naar een station van den spoorweg dienen, blijft ten laste van dengene, die daarmede
      vroeger was belast.

      4 Volgens voorschriften door Ons bij algemeenen maatregel van inwendig bestuur te geven, wordt een ligger opgemaakt
      en bijgehouden van de toegangswegen tot stations, op welken ligger de onderhoudpligtigen vermeld zijn.
    url: https://wetten.overheid.nl/BWBR0001848/2009-07-01#Artikel70
  - number: '71'
    text: |-
      1 De [artikelen 5:13][ref1], [5:15][ref2] en [5:20 van de Algemene wet bestuursrecht][ref3] zijn van
      overeenkomstige toepassing ten aanzien van de in [artikel 72][ref4] bedoelde ambtenaren en politieambtenaren, met
      dien verstande dat zij alleen bevoegd zijn de spoorweg en de daarbij behorende gronden en gebouwen, die voor het
      gebruik van reizigers zijn bestemd, te betreden.

      2 De [artikelen 5:13][ref5], [5:15][ref6] en [5:20 van de Algemene wet bestuursrecht][ref7] zijn van
      overeenkomstige toepassing op bij besluit van Onze Minister van Verkeer en Waterstaat aangewezen Rijksbeambten en
      leden en beambten van openbare besturen.


