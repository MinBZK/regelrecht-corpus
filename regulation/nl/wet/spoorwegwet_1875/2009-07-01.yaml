    text: |-
      1 Deze wet is van toepassing op de dienst en het gebruik der Staatsspoorwegen, zonder evenwel verandering te
      brengen in de bepalingen der wet van 3 Julij 1863 (*Staatsblad* n°. 100) en in die van de concessie, bij de wetten
      van 3 Junij 1863 (*Staatsblad* n°. 101) en van 7 Augustus 1865 (*Staatsblad* n°. 99) bekrachtigd.

      2 Deze wet is niet van toepassing op hoofdspoorwegen, aangewezen krachtens
      [artikel 2, eerste lid, van de Spoorwegwet][ref1].


