  - number: 17a
    text: |-
      Wegens redenen van staatsbelang kan staking van de dienst door de Minister van Verkeer en Waterstaat worden
      bevolen.
    url: https://wetten.overheid.nl/BWBR0001848/2009-07-01#Artikel17a
  - number: '18'
    text: |-
      In het geval, bij het vorige artikel bedoeld zorgt de Minister van Verkeer en Waterstaat, dat zooveel mogelijk
      worde voorzien in de behoeften van het verkeer in de rigting van den spoorweg.
    url: https://wetten.overheid.nl/BWBR0001848/2009-07-01#Artikel18
  - number: '19'
    text: |-
      Staking der dienst in het geval, bij [artikel 17][ref1] bedoeld, wordt in de *Staatscourant* vermeld, en in de
      provincien, door welke de weg loopt, zoo spoedig mogelijk, algemeen bekend gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel17a
    url: https://wetten.overheid.nl/BWBR0001848/2009-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: 17a
        hoofdstuk: II
  - number: '20'
    text: |-
      Eene krachtens deze wet gestaakte dienst wordt niet hervat dan na bekomen toestemming van den Minister van Verkeer
      en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0001848/2009-07-01#Artikel20
  - number: '21'
    text: |-
      De Minister van Verkeer en Waterstaat is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving
      van het bevel tot staking dan wel ter voorkoming van het hervatten van de dienst zonder de in [artikel 20][ref1]
      bedoelde toestemming.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel20
    url: https://wetten.overheid.nl/BWBR0001848/2009-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '20'
        hoofdstuk: II
  - number: '22'
    text: |-
      De in [artikel 10][ref1] bedoelde ambtenaren zijn bevoegd locomotieven, tenders, rijtuigen of wagens onverwijld uit
      een trein te doen verwijderen en het vertrek van een trein te verbieden, indien de toestand van het materieel of de
      zamenstelling van den trein, naar hun oordeel, voor den trein gevaar kan doen ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel10
    url: https://wetten.overheid.nl/BWBR0001848/2009-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '10'
        hoofdstuk: II
  - number: '23'
    text: |-
      1 De Minister van Verkeer en Waterstaat is bevoegd bevel te geven tot gehele of gedeeltelijke onbruikbaarmaking van
      de baan en de daarop aanwezige bruggen, telegraaflijnen en seintoestellen.

      2 Indien op grond van de eerste alinea onbruikbaarmaking heeft plaatsgevonden, wordt de spoorweg, zo spoedig als
      het staatsbelang zulks gedoogt, op bevel van de Minister van Verkeer en Waterstaat en op kosten van het Rijk in de
      vorige toestand hersteld.
    url: https://wetten.overheid.nl/BWBR0001848/2009-07-01#Artikel23
  - number: '24'
    text: |-
      1 Indien de Minister van Verkeer en Waterstaat staking van de dienst beveelt vanuit het oogpunt van belangen van ’s
      lands verdediging, kan hij tevens bepalen dat alle locomotieven, tenders, rijtuigen, wagens en ander materieel van
      de spoorweg worden verwijderd.

      2 In het geval, bedoeld in de eerste alinea, wijst de Minister van Defensie de plaats of plaatsen aan waarheen dat
      materieel moet worden vervoerd.
    url: https://wetten.overheid.nl/BWBR0001848/2009-07-01#Artikel24
  - number: '27'
    text: |-
      Bij algemene maatregel van bestuur worden - met uitzondering van arbeids- en rusttijden van het personeel in dienst
      van een spoorwegonderneming - geregeld:

      de dienst op de stations;

      het toezigt over de baan en de bediening der seinen;

      de inrigting van en het toezigt over de locomotieven, tenders, rijtuigen en wagens;

      de zamenstelling der treinen;

      de snelheid waarmede de treinen zijn te vervoeren;

      het getal beambten en bedienden, op elken trein noodig;

      hetgeen in het belang der orde op elken trein is in acht te nemen;

      de voorwaarden voor het vervoer van goederen;

      het afhalen en bestellen der goederen, en het loon daarvoor te genieten;

      de behandeling der onafgehaalde of onbestelbare goederen;

      de tijd waarna die goederen kunnen verkocht worden, en de wijze waarop die verkoop zal kunnen geschieden;

      de beëediging van de beambten en bedienden van den spoorweg;

      en hetgeen verder ter verzekering van de behoorlijke uitoefening der spoorwegdiensten en het veilig verkeer over de
      spoorwegen, krachtens deze wet, is voor te schrijven.
    url: https://wetten.overheid.nl/BWBR0001848/2009-07-01#Artikel27
  - number: '33'
    text: |-
      1 Elke spoorweg wordt, op de bij algemeenen maatregel van bestuur te bepalen wijze en behoudens daarbij te
      omschrijven uitzonderingen, afgesloten.

      2 De kosten dier afsluiting worden gedragen door de ondernemers der over den spoorweg loopende dienst.
    url: https://wetten.overheid.nl/BWBR0001848/2009-07-01#Artikel33
  - number: 33a
    text: |-
      1 Met betrekking tot door Onze Minister van Verkeer en Waterstaat aangewezen spoorwegen of gedeelten daarvan,
      aangelegd door of langs bos-, veen- of heidegronden of gronden met andere licht brandbare gewassen begroeid, zorgen
      bestuurders van de spoorwegdienst dat het terrein van de spoorweg, door het graven van sloten, het omspitten of het
      bedekken met onbrandbare stoffen van een doorgaande strook gronds of door enig ander middel, van de aangrenzende
      eigendommen wordt afgescheiden, aldus, dat bij het ontstaan van brand op het terrein van de spoorweg, de brand zich
      niet op de aangrenzende eigendommen uitbreidt.

      2 Op het maken en instandhouden van deze voorzieningen zijn [artikel 13][ref1], het
      [eerste lid van artikel 14][ref2] en [artikel 15][ref3] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0001848#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0001848#Artikel15
