  - number: '64'
    text: |-
      1 Overtreding van de bepalingen van een algemeenen maatregel van bestuur in een der [artikelen 27][ref1],
      [27][ref2] of [27][ref3] bedoeld, door anderen dan de in [artikel 53][ref4] en [56][ref5] genoemden, wordt gestraft
      met geldboete van de eerste categorie.

      2 De beambten en bedienden van den spoorweg kunnen hen, die zich aan die overtreding schuldig maken, uit de
      rijtuigen weren of verwijderen.

      3 Ten aanzien van beschadiging van waterstaatswerken, in beheer of onderhoud bij ondernemers van spoorwegdiensten,
      voor welke schippers, reders, eigenaars of gebruikers van vaartuigen of vlotten volgens de wet aansprakelijk zijn,
      vindt[ § 6][ref6] overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0001848#Artikel27c
