preamble:
  text: |-
    Wij WILLEM III, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, Groot-Hertog van Luxemburg,
    enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat de wijziging en aanvulling, welke de wet van 21 Augustus 1859
    (Staatsblad n°. 98), omtrent de spoorwegdiensten en het gebruik der spoorwegen behoeft, het raadzaam maken haar
    door eene nieuwe wet te doen vervangen;

    Zoo is het, dat Wij, den Raad van State gehoord en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001848/2009-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Onder voorbehoud van [afdeling 5 van titel 2 van Boek 8 van het Burgerlijk Wetboek][ref1] zijn de ondernemers eener
      Spoorwegdienst verantwoordelijk voor de schade, door personen of goederen bij de uitoefening der dienst geleden,
      ten ware de schade buiten hunne schuld of die hunner beambten of bedienden zij ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Afdeling5
    url: https://wetten.overheid.nl/BWBR0001848/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005034
        afdeling: '5'
  - number: '3'
    text: |-
      Ondernemers van spoorwegdiensten zijn niet bevoegd hunne verantwoordelijkheid voor verlies, vertraagde bezorging
      van of schade aan koopmanschappen en goederen, noch den omvang en duur hunner verpligtingen en den bewijslast
      door eenig beding van den vrachtbrief, of door bijzondere dienstreglementen uit te sluiten of te beperken, dan met
      inachtneming der regels, door Ons bij algemeenen maatregel van inwendig bestuur vast te stellen.
    url: https://wetten.overheid.nl/BWBR0001848/2009-07-01#Artikel3
  - number: '4'
    text: |-
      1 De ondernemers zijn verpligt te gedoogen, dat aan den spoorweg, waarover hunne dienst loopt, spoorwegen, door
      andere aan te leggen, zich aansluiten, en dat die weg door zoodanige wegen worde doorsneden.

      2 Zoo, ten behoeve der aansluiting of doorsnijding, op den eerstgenoemden spoorweg werken te verrigten zijn, of
      de dienst moet worden gestaakt, wordt deswege door de ondernemers der aan te leggen spoorwegen schadeloosstelling
      verleend.

      3 Indien Wij den aanleg van wegen, kanalen, waterleidingen of andere werken gebieden of toestaan, die den spoorweg
      doorsnijden of daarmede in aanraking komen, kunnen de ondernemers dit niet beletten, noch uit dien hoofde andere
      schadevergoeding vorderen dan teruggave van de vermeerdering der kosten van onderhoud en dienst, die uit den aanleg
      dier werken mogt voortvloeijen.

      4 In zoodanig geval zorgt de Minister van Verkeer en Waterstaat, dat, zonder kosten voor de ondernemers, alle
      definitieve of voorloopige werken worden uitgevoerd, die vereischt worden om te beletten, dat de exploitatie van
      den spoorweg gestoord of gestaakt worde.
    url: https://wetten.overheid.nl/BWBR0001848/2009-07-01#Artikel4
  - number: '5'
    text: |-
      1 De ondernemers zijn insgelijks verpligt te gedoogen, dat de weg, waarover hunne dienst loopt, en de daartoe
      behoorende stations ten behoeve van andere spoorwegdiensten worden gebruikt.

      2 Dit geschiedt krachtens een door Ons daartoe te nemen besluit, tegen schadeloosstelling, door de ondernemers
      der spoorwegdienst, ten wier behoeve het gemeenschappelijk gebruik van den weg of van een station wordt gegund,
      te voldoen.

      3 Het gemeenschappelijk gebruik van den weg heeft plaats overeenkomstig een reglement, door Ons, de bestuurders der
      betrokken spoorwegdiensten gehoord, vast te stellen.

      4 De bepalingen voor het gebruik van stations tot gemeenschappelijke dienst en de uitvoering der daarvoor noodige
      werken worden door de ondernemers der betrokken spoorwegdiensten, met instemming van Onzen Minister van Verkeer en
      Waterstaat, onderling bij overeenkomst geregeld.

      5 Indien het deswege te houden overleg niet binnen den door Onzen Minister van Verkeer en Waterstaat te bepalen
      tijd tot overeenstemming heeft geleid, worden die bepalingen door Ons, bestuurders der betrokken spoorwegdiensten
      gehoord, vastgesteld.

      6 De schadeloosstellingen, in dit en in het vorig artikel bedoeld, worden, bij gebreke van minnelijke schikking,
      door den regter bepaald.
    url: https://wetten.overheid.nl/BWBR0001848/2009-07-01#Artikel5
  - number: '6'
    text: |-
      1 De bestuurders eener spoorwegdienst stellen een reglement voor hunne dienst vast, en onderwerpen dat aan de
      instemming van den Minister van Verkeer en Waterstaat.

      2 Voordat met dit reglement is ingestemd, wordt de dienst niet geopend.

      3 Geene veranderingen worden zonder instemming van den Minister van Verkeer en Waterstaat in het reglement gebragt,
      die noodige veranderingen, ook nadat ermee ingestemd is, de ondernemers gehoord, bevelen kan.

      4 De [artikelen 10:28 tot en met 10:31 van de Algemene wet bestuursrecht][ref1] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1028
    url: https://wetten.overheid.nl/BWBR0001848/2009-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 10:28
  - number: '7'
    text: |-
      1 De dienst wordt niet geopend, noch na eene staking hervat, dan nadat de Minister van Verkeer en Waterstaat
      daartoe machtiging heeft verleend.

      2 Alvorens die machtiging wordt verleend, heeft eene opneming van den weg en van de daartoe behoorende werken van
      regeringswege plaats.

      3 Gelijke opneming gaat het in gebruik nemen van nieuwe of herstelde locomotieven, tenders, rijtuigen of wagens
      vooraf.
    url: https://wetten.overheid.nl/BWBR0001848/2009-07-01#Artikel7
  - number: '9'
    text: |-
      1 Voor bestuurders van spoorwegdiensten worden gehouden zij, die, hetzij als ondernemers, hetzij namens de
      ondernemers, het opperbestuur over de dienst uitoefenen.
    url: https://wetten.overheid.nl/BWBR0001848/2009-07-01#Artikel9
  - number: 9a
    text: |-
      De [artikelen 75, eerste lid][ref1], en [186, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2] gelden niet
      voor ondernemers van een spoorwegdienst ten aanzien van door hen uitgegeven documenten voor het goederenvervoer.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel186
    url: https://wetten.overheid.nl/BWBR0001848/2009-07-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '75'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '186'
  - number: '10'
    text: |-
      1 Vanwege de Minister van Verkeer en Waterstaat wordt inspectie op de spoorwegen uitgeoefend door een onder
      eenhoofdige leiding te stellen dienst. Bij algemene maatregel van bestuur worden terzake regels gesteld.

      2 De [artikelen 5:13][ref1], [5:15][ref2], [5:16][ref3], [5:17][ref4] en
      [5:20 van de Algemene wet bestuursrecht][ref5] zijn van overeenkomstige toepassing ten aanzien van de in het eerste
      lid bedoelde ambtenaren, met dien verstande dat zij niet bevoegd zijn:

      a. rijtuigen van treinen voor autoriteiten of bestuurders van de spoorwegdienst aangewezen of door bijzondere
      personen gehuurd te betreden; en

      b. inlichtingen te vragen dan wel inzage te vorderen van zakelijke gegevens en bescheiden met betrekking tot het
      geldelijk beheer van de spoorwegdienst.

      3 De in het eerste lid bedoelde ambtenaren zijn tevens belast met het toezicht op de naleving van het bepaalde bij
      of krachtens deze wet.

      4 De toezichthouder beschikt niet over de bevoegdheden, genoemd in de [artikelen 5:18][ref6] en
      [5:19 van de Algemene wet bestuursrecht][ref7].

      5 De toezichthouder is niet bevoegd:

      a. rijtuigen van treinen voor autoriteiten of bestuurders van de spoorwegdienst aangewezen of door bijzondere
      personen gehuurd te betreden; en

      b. inlichtingen te vragen dan wel inzage te vorderen van zakelijke gegevens en bescheiden met betrekking tot het
      geldelijk beheer van de spoorwegdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel513
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel515
