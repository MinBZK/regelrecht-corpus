  - number: '63'
    text: |-
      1 Overtreding van de [artt. 42][ref1], [43][ref2] en [44][ref3] wordt gestraft met geldboete van de tweede
      categorie of met gevangenis van ten hoogste ééne maand.

      2 Gelijke straf wordt uitgesproken tegen de personen, in het [tweede lid van art. 35][ref4] bedoeld, of die hen,
      volgens de wet, vertegenwoordigen, wanneer zij de sluiting der hekken geplaatst aan uit- of overwegen, waarvan
      zij genot hebben, verzuimen. Zijn door hen personen met de sluiting belast, dan zijn deze wegens het verzuim
      strafschuldig.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0001848#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0001848#Artikel44
