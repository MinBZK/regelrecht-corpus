      - id: ref3
        bwb_id: BWBR0001848
        artikel: '38'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '42'
    text: Het is verboden op de spoorwegen eenig voorwerp, dat het verkeer belemmeren kan, neder te leggen.
    url: https://wetten.overheid.nl/BWBR0001848/2009-07-01#Artikel42
  - number: '43'
    text: |-
      Het is aan elk, wien het uit den aard zijner betrekking niet vrij staat, verboden, buiten toestemming van de
      bestuurders der dienst, of van hem, wien dit door de bestuurders is opgedragen, langs of op den spoorweg te loopen
      of te rijden.
    url: https://wetten.overheid.nl/BWBR0001848/2009-07-01#Artikel43
  - number: '44'
    text: |-
      Het is verboden, buiten de toestemming in het vorig artikel bedoeld, paarden, vee of andere dieren langs of op den
      spoorweg te drijven of te laten loopen.
    url: https://wetten.overheid.nl/BWBR0001848/2009-07-01#Artikel44
  - number: '50'
    text: |-
      1 Het geheel of gedeeltelijk gebruik van elken spoorweg en van het aan eene spoorwegonderneming toebehoorende
      materieel kan ten allen tijde door Ons, in het belang van ’s Rijks dienst, tegen schadeloosstelling worden
      gevorderd.

      2 Indien het gebruik voor ’s Rijks dienst, als bedoeld in de eerste alinea, nodig is in het belang van ’s lands
      verdediging, kan de bedoelde vordering geschieden door de Minister van Defensie.

      3 De schadeloosstelling wordt, bij gebreke van minnelijke schikking, door den regter bepaald.
    url: https://wetten.overheid.nl/BWBR0001848/2009-07-01#Artikel50
  - number: '51'
    text: |-
      Regelen omtrent de aanwending van spoorwegen en spoorwegmaterieel in de gevallen, bedoeld in [art. 24][ref1] en
      de[ 2de alinea van art. 50][ref2], worden door Ons bij algemeenen maatregel van inwendig bestuur gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0001848#Artikel50
    url: https://wetten.overheid.nl/BWBR0001848/2009-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '24'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0001848
        artikel: '50'
        hoofdstuk: V
  - number: '52'
    text: |-
      Kan in het geval, bij [art. 50][ref1] bedoeld, het vervoer van reizigers of goederen niet langs den spoorweg plaats
      hebben, dan wordt in dat vervoer voorzien op de bij [art. 18][ref2] bepaalde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0001848#Artikel18
    url: https://wetten.overheid.nl/BWBR0001848/2009-07-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0001848
        artikel: '50'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0001848
        artikel: '18'
        hoofdstuk: II
  - number: '53'
    text: |-
      De bestuurders eener spoorwegdienst worden gestraft:

      zoo zij de voorwaarden, waarop de vergunning tot uitoefening der dienst is verleend, niet naleven of daarmede in
      strijd handelen of doen handelen, met geldboete van de derde categorie;

      zoo zij de bepalingen van deze wet niet naleven of daarmede in strijd handelen of doen handelen, voor zoover
      daaromtrent niet in het bijzonder is voorzien, met geldboete van de derde categorie;

      zoo zij de dienst op den spoorweg openen, alvorens het dienstreglement, in [art. 6][ref1] bedoeld, is goedgekeurd,
      of die hetzij openen hetzij hervatten, alvorens de in het [1ste lid van art. 7][ref2] bedoelde magtiging verleend
      is, met geldboete van de derde categorie bij de openstelling of hervatting van de dienst, en van de tweede
      categorie voor elke dag, dien de geopende of hervatte dienst heeft geduurd;

      zoo zij de dienst voortzetten na bevel tot staking, of die hervatten zonder de toestemming, in [art. 20][ref3]
      bedoeld, met geldboete van de derde categorie bij de voortzetting of hervatting van de dienst, en van de tweede
      categorie voor elke dag, dien de voortzetting of hervatting heeft geduurd;

      zoo zij nieuwe of herstelde locomotieven, tenders, rijtuigen of wagens in gebruik nemen, alvorens zij daartoe, ten
      gevolge der opneming in het [laatste lid van art. 7][ref4] voorgeschreven, zijn gemagtigd, met geldboete van de
      tweede categorie voor elke locomotief, tender, rijtuig of wagen;

      zoo zij in gebreke blijven te voldoen aan de beslissing van den Minister van Verkeer en Waterstaat, in
      [art 14][ref5] bedoeld, of aan den in de voorlaatste alinea van [art. 13][ref6] bedoelden last, met geldboete van
      de eerste categorie voor elke dag verzuim;

      zoo zij het in[ art. 5][ref7] bedoeld reglement op het gemeenschappelijk gebruik van een spoorweg, de aldaar en
      in [art. 32][ref8] bedoelde regeling voor het gemeenschappelijk gebruik van stations en voor het doorgaand vervoer
      van reizigers en goederen, of een krachtens een der [artikelen 27][ref9], [27][ref10], [27][ref11] of [33][ref12]
      uitgevaardigden algemeenen maatregel van inwendig bestuur niet naleven of daarmede in strijd handelen of doen
      handelen, met geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001848#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0001848#Artikel20
