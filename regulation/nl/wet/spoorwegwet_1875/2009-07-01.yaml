      2 De boete, in het voorlaatste lid van [art. 53][ref1] bedreigd, kan niet hooger gaan dan ten hoogste € 4 500. De
      aldaar bedoelde tijd houdt op te loopen, zoodra [art. 15][ref2] wordt toegepast.


