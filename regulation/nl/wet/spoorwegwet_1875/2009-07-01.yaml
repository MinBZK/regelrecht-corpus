  - number: '56'
    text: |-
      1 De beambten en bedienden van den spoorweg worden gestraft:

      zoo zij het in [art. 5][ref1] bedoeld reglement op het gemeenschappelijk gebruik van een spoorweg, de aldaar
      bedoelde regeling voor het gemeenschappelijk gebruik van stations, een krachtens een der [artikelen 27][ref2],
      [27][ref3], [27][ref4] of [33][ref5] uitgevaardigden algemeenen maatregel van bestuur overtreden met geldboete van
      de tweede categorie;

      zoo zij de bepalingen van deze wet niet naleven of daarmede in strijd handelen of doen handelen, voor zoover
      daaromtrent niet in het bijzonder is voorzien, met geldboete van de tweede categorie.

      2 Zij zijn niet strafbaar, zoo hunne weigering of overtreding een gevolg is van den last, door de bestuurders van
      de spoorwegdienst gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel5
