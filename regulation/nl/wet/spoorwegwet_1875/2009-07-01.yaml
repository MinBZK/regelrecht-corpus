  - number: '58'
    text: |-
      1 Overtreding van de [artt. 36][ref1], [37 ][ref2]en [38][ref3], of van de voorwaarden gesteld bij de besluiten,
      naar aanleiding van [art. 39][ref4] genomen, wordt gestraft met geldboete van de eerste categorie.

      2 De overtreders worden daarenboven, op de vordering van het openbaar ministerie, veroordeeld om binnen een bij het
      vonnis te bepalen termijn, de zaken in den vorigen stand te herstellen.

      3 Bij gebreke van voldoening aan die uitspraak, wordt, na verloop van den gestelden termijn, het vonnis van
      regeringswege ten koste van den overtreder ten uitvoer gelegd.

      4 De kosten worden op den overtreder verhaald door den ontvanger der registratie, naar een staat, opgemaakt door
      dengene, die met de uitvoering van het vonnis is belast.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0001848#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0001848#Artikel38
