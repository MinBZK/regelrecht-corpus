  - number: '72'
    text: |-
      1 Tot het opsporen der overtredingen van deze wet, van een krachtens [art. 27][ref1] uitgevaardigden algemeenen
      maatregel van bestuur, van het in [art. 5][ref2] bedoeld reglement en van de aldaar zijn, behalve de bij
      [art. 141 van het Wetboek van Strafvordering][ref3] aangewezen ambtenaren, de in [artikel 10][ref4] bedoelde
      ambtenaren bevoegd.

      2 Ook zijn daartoe bevoegd de beëedigde beambten en bedienden van den spoorwegen over de geheele uitgestrektheid
      van den weg, waarop zij dienst doen, en binnen den kring van honderd meter aan beide zijden van dien weg.


