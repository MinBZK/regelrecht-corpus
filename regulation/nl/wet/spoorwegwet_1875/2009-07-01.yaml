  - number: '41'
    text: |-
      De Minister van Verkeer en Waterstaat is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving
      van het bepaalde in de [artikelen 36][ref1], [37][ref2] en [38][ref3]. Hij kan hiertoe mandaat verlenen aan de
      bestuurders der spoorwegdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0001848#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0001848#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0001848#Artikel38
    url: https://wetten.overheid.nl/BWBR0001848/2009-07-01#Artikel41
    references:
