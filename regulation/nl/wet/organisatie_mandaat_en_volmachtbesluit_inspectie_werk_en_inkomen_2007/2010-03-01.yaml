  - number: '5'
    text: |-
      1 Elk van de hoofden van een afdeling is verantwoordelijk voor de volgende algemene taken:

      a. het leiding geven aan de eigen afdeling;

      b. het leveren van een bijdrage aan het opstellen van het jaarplan en meerjarenplan van de Inspectie;

      c. het uitvoeren van het jaarplan van de Inspectie voor wat betreft de eigen afdeling;

      d. het ontwikkelen, uitvoeren, evalueren en aanpassen van relatiebeheer in relatie tot het hem betreffende domein
      van toezicht of aandachtsgebied en van hieruit bijdragen aan het relatiebeheer van de Inspectie;

      e. het rapporteren en het afleggen van verantwoording aan de directeur over de uitvoering van het jaarplan van de
      Inspectie voor wat betreft de eigen afdeling;

      f. het doen van voorstellen met betrekking tot het aantrekken en ontslaan van personeel.

      2 In afwijking van het eerste lid, onderdeel e, geldt voor het hoofd van de afdeling Strategie & Communicatie dat
      wordt gerapporteerd en verantwoording wordt afgelegd aan de inspecteur-generaal.
    url: https://wetten.overheid.nl/BWBR0021981/2010-03-01#Artikel5
  - number: '6'
    text: |-
      [Artikel 5][ref1] is van overeenkomstige toepassing op het hoofd Bureau Documentaire Informatievoorziening &
      Facilitymanagement, met dien verstande dat hij rapporteert en verantwoording aflegt aan het hoofd van de afdeling
      Concern Control.


      [ref1]: https://wetten.overheid.nl/BWBR0021981#Artikel5
