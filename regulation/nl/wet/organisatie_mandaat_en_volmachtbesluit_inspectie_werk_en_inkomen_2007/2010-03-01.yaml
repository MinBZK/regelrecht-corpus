  - number: '18'
    text: |-
      De afdeling Toezicht UWV/Uitkering, Keten & Organisatie is verantwoordelijk voor:

      a. het houden van toezicht op de uitvoering van de wettelijke taken door het UWV voor wat betreft:

      1°. de distribuerende processen,

      2°. de samenwerking en gegevensuitwisseling met Suwinet-partijen en andere instanties en de daarbij gebruikte ICT,

      3°. de kwaliteit van de informatiehuishouding,

      4°. de handhaving,

      5°. de algemene en de aan de onder 2° tot en met 4° genoemde onderwerpen gerelateerde ketenaspecten van de keten
      van werk en inkomen,

      6°. de organisatie van het UWV;

      b. het rapporteren over de resultaten en kwaliteit van de uitvoering van de wettelijke taken door het UWV, bedoeld
      in onderdeel a;

      c. het integrale relatiebeheer ten aanzien van het UWV;

      d. het bijdragen aan rapportages over de uitvoering op het beleidsterrein werk en inkomen;

      e. het inbrengen van kennis van de uitvoeringspraktijk in de beleidsvorming van het Ministerie.
    url: https://wetten.overheid.nl/BWBR0021981/2010-03-01#Artikel18
  - number: '19'
    text: |-
      De afdeling Toezicht UWV/Activering, Cliënt & Verantwoording is verantwoordelijk voor:

      a. het houden van toezicht op de uitvoering van de wettelijke taken door het UWV voor wat betreft:

      1°. preventie-, activerings- en re-integratietaken,

      2°. het sociaal-medisch handelen,

      3°. de klant/burgeroriëntatie, alsmede

      4°. de verantwoordingen aan de Minister;

      b. het rapporteren over de resultaten en kwaliteit van de uitvoering van de wettelijke taken door het UWV, bedoeld
      in onderdeel a;

      c. het bijdragen aan rapportages over de uitvoering op het beleidsterrein werk en inkomen;

      d. het inbrengen van kennis van de uitvoeringspraktijk in de beleidsvorming van het Ministerie.
    url: https://wetten.overheid.nl/BWBR0021981/2010-03-01#Artikel19
  - number: '20'
    text: |-
      1 Elk van de directeuren is bevoegd om namens een bewindspersoon dan wel de inspecteur-generaal besluiten te
      nemen, overeenkomsten aan te gaan en handelingen te verrichten die noch een besluit, noch een privaatrechtelijke
      rechtshandeling zijn, voor zover zij verband houden met het werkterrein van zijn directie en de onder hem
      ressorterende stafafdelingen, tenzij deze zijn voorbehouden aan een bewindspersoon, de secretaris-generaal, de
      plaatsvervangend secretaris-generaal of de inspecteur-generaal.

      2 De bevoegdheden van de directeuren, bedoeld in het eerste lid, omvatten in elk geval mandaat en machtiging ten
      aanzien van:

      a. de in [artikel 3, onderdeel e][ref1], genoemde personeelsaangelegenheden;

      b. de behandeling van klachten als bedoeld in [artikel 9:1 van de Algemene wet bestuursrecht][ref2] voor zover deze
      betrekking hebben op gedragingen van de onder elk van hen ressorterende functionarissen.

      3 De in het eerste lid genoemde bevoegdheid omvat voorts de bevoegdheid tot het nemen van dwangsombesluiten
      die verband houden met het niet tijdig afdoen van een besluit, voor zover dit betrekking heeft op hun eigen
      verantwoordelijkheden.

      4 De in het eerste lid bedoelde bevoegdheden van de directeur Toezicht gemeenten omvatten mede mandaat, volmacht en
      machtiging ten aanzien van:

      a. het in [artikel 4, onderdeel c][ref3], bedoelde personeelsbeleid van de Inspectie;

      b. de in [artikel 4, onderdeel d][ref4], genoemde personeelsaangelegenheden.

      5 De in het eerste lid genoemde bevoegdheid om overeenkomsten aan te gaan is beperkt tot overeenkomsten met een
      waarde van ten hoogste € 20.000,– per overeenkomst, met dien verstande dat de volgende overeenkomsten mogen worden
      aangegaan tot een waarde per overeenkomst van ten hoogste de laagste drempel voor aanbesteding conform de Europese
      aanbestedingsrichtlijnen:

      a. overeenkomsten die voortvloeien uit het jaarplan van de Inspectie;

      b. overeenkomsten voor het opleiden van de medewerkers van de directie, voor zover deze voortvloeien uit een door
      de inspecteur-generaal vastgesteld opleidingsplan;

      c. arbeidsovereenkomsten naar burgerlijk recht.


      [ref1]: https://wetten.overheid.nl/BWBR0021981#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel91
      [ref3]: https://wetten.overheid.nl/BWBR0021981#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0021981#Artikel4
    url: https://wetten.overheid.nl/BWBR0021981/2010-03-01#Artikel20
