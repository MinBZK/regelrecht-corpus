  - number: '12'
    text: |-
      De afdelingen Toezicht WWB 1 en Toezicht WWB 2 zijn verantwoordelijk voor:

      a. het houden van toezicht op de rechtmatigheid van de uitvoering door gemeenten van de [WWB][ref1] en de
      doeltreffendheid van [die wet][ref2];

      b. het rapporteren in gevallen van mogelijk ernstige tekortkomingen als bedoeld in
      [artikel 76, derde lid, van de WWB][ref3];

      c. het rapporteren in gevallen dat een gemeente op grond van [artikel 74, eerste lid, van de WWB][ref4] een
      aanvullende uitkering heeft aangevraagd;

      d. het rapporteren per gemeente, dan wel samenwerkingsverband van gemeenten, over de rechtmatigheid
      en doeltreffendheid van de uitvoering door gemeenten van de overige wet- en regelgeving, genoemd in
      [artikel 11, eerste lid, onderdeel a, en de Wwik][ref5];

      e. het bijdragen aan rapportages over de uitvoering op het beleidsterrein werk en inkomen;

      f. het inbrengen van kennis van de uitvoeringspraktijk in de beleidsvorming van het Ministerie.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0015703
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel76
