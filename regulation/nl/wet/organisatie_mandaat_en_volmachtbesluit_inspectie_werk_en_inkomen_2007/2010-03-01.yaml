articles:
  - number: '1'
    text: |-
      In deze regeling en de daarop berustende bepalingen wordt verstaan onder:

      a. Inspectie: de Inspectie Werk en Inkomen;

      b. wet: de [Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];

      c. CWI: de Centrale organisatie werk en inkomen, genoemd in [hoofdstuk 4 van de wet][ref2];

      d. BKWI: het Bureau Keteninformatisering Werk en Inkomen, een afzonderlijk en herkenbaar organisatieonderdeel van
      CWI als bedoeld in [artikel 6.3, tweede lid, van de Regeling SUWI][ref3];

      e. IB: het Inlichtingenbureau, genoemd in [artikel 63, eerste lid, van de wet][ref4];

      f. RWI: de Raad voor werk en inkomen, genoemd in [hoofdstuk 3 van de wet][ref5];

      g. SVB: de Sociale verzekeringsbank, genoemd in [hoofdstuk 6 van de wet][ref6];

      h. UWV: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in [hoofdstuk 5 van de wet][ref7];

      i. AFM: de Autoriteit Financiële Markten, genoemd in [artikel 1 van de Pensioenwet][ref8];

      j. cki’s: door de Minister op grond van wet- en regelgeving op het terrein van arbeidsveiligheid, arbeidsgezondheid
      en productveiligheid aangewezen certificatie- en keuringsinstellingen die zijn belast met het verstrekken van
      certificaten, dan wel het verrichten van keuringen in het belang van veiligheid en gezondheid in de arbeid;

      k. CTB: het College voor de toelating van bestrijdingsmiddelen, genoemd in
      [artikel 1a, eerste lid, van de Bestrijdingsmiddelenwet 1962][ref9];

      l. DNB: De Nederlandsche Bank N.V., genoemd in [artikel 1 van de Pensioenwet][ref10];

      m. SER: de Sociaal-Economische Raad, genoemd in [artikel 1 van de Wet op de bedrijfsorganisatie][ref11];

      n. WWB: de [Wet werk en bijstand][ref12];

      o. Bbz: het [Besluit bijstandverlening zelfstandigen 2004][ref13];

      p. IOAW: de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref14];

      q. IOAZ: de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref15];

      r. WSW: de [Wet sociale werkvoorziening][ref16];

      s. Wwik: de [Wet werk en inkomen kunstenaars][ref17];

      t. zbo’s: zelfstandige bestuursorganen.


