  - number: '13'
    text: |-
      De afdeling Toezicht WSW, Wet kinderopvang, Monitoring &Integraal Toezicht Jeugdzaken is verantwoordelijk voor:

      a. het houden van toezicht op de rechtmatigheid en doeltreffendheid van de uitvoering door gemeenten van de
      [WSW][ref1] en de doeltreffendheid van [die wet][ref2];

      b. et ontwikkelen en uitvoeren van het bij de Inspectie belegde deel van het project Integraal Toezicht Jeugdzaken
      van de daarin samenwerkende rijksinspecties;

      c. de monitoring van de uitvoering door gemeenten van de wet- en regelgeving, genoemd in
      [artikel 1, onderdelen n tot en met s][ref3];

      d. het bijdragen aan rapportages over de uitvoering op het beleidsterrein werk en inkomen;

      e. het inbrengen van kennis van de uitvoeringspraktijk in de beleidsvorming van het Ministerie.


      [ref1]: https://wetten.overheid.nl/BWBR0008903
      [ref2]: https://wetten.overheid.nl/BWBR0008903
      [ref3]: https://wetten.overheid.nl/BWBR0021981#Artikel1
    url: https://wetten.overheid.nl/BWBR0021981/2010-03-01#Artikel13
