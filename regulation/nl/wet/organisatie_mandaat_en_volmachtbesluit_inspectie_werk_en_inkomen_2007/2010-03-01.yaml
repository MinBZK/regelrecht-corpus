  - number: '4'
    text: |-
      De directeur Toezicht gemeenten is tevens verantwoordelijk voor:

      a. het leiding geven aan de stafafdelingen Concern Control en Juridische Zaken;

      b. het zorgdragen voor een betrouwbare, effectieve en efficiënte bedrijfsvoering, met uitzondering van de
      vaststelling van de formatie, binnen door de inspecteur-generaal vastgestelde kaders, voor periodieke evaluatie
      daarvan en voor planning en bewaking van de productie van de Inspectie;

      c. het personeelsbeleid van de Inspectie, met inbegrip van het arbeidsomstandigheden- en ziekteverzuimbeleid, voor
      zover dit niet is voorbehouden aan de plaatsvervangend secretaris-generaal of de inspecteur-generaal;

      d. de personeelsaangelegenheden van functionarissen die niet meer onder de inspecteur-generaal ressorteren en
      ten aanzien van wie geen andere functionaris binnen het Ministerie (meer) kan worden aangewezen, maar die op
      31 december 2002 of later onder de inspecteur-generaal ressorteerden;

      e. de werkgeversverplichtingen die voortvloeien uit wet- en regelgeving op het gebied van arbeidsomstandigheden ten
      aanzien van de Inspectie, voor zover het niet gaat om centraal georganiseerde werkgeversverplichtingen als bedoeld
      in [artikel 6, vijfde lid, onder b, van het Organisatie-, mandaat- en volmachtbesluit SZW 2004][ref1];

      f. het op orde hebben van de administratieve organisatie en informatiebeveiliging van de Inspectie;

      g. de deskundigheidsbevordering en het kwaliteitsmanagement bij de Inspectie;

      h. het informatiebeleid en de informatisering van toezichtprocessen en ondersteunende processen;

      i. de juridische en wetstechnische ondersteuning bij de ontwikkeling en uitvoering van het toezicht;

      j. de coördinatie en uitvoering van de toezichtbaarheidstoetsen, bedoeld in [artikel 41 van de wet][ref2];

      k. het fungeren als coördinatie- en aanspreekpunt voor de Inspectie inzake juridische aangelegenheden;

      l. de inbreng van juridische expertise ten behoeve van de bedrijfsvoering;

      m. het rapporteren en het afleggen van verantwoording aan de inspecteur-generaal over de uitvoering van het
      jaarplan en het meerjarenplan van de Inspectie voor wat betreft de onder hem ressorterende stafafdelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0016199#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel41
