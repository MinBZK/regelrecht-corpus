  - number: '14'
    text: |-
      De directie Toezicht zbo’s en overige bestuursorganen is verantwoordelijk voor:

      a. het houden van toezicht op de uitvoering van de wettelijke taken door de CWI, de SVB en het UWV;

      b. het houden van toezicht op de uitvoering van wettelijke taken door het BKWI en het IB;

      c. het houden van toezicht op de uitvoering van wettelijke taken door de RWI;

      d. het houden van toezicht op de SER, de AFM, DNB, het CTB en cki’s, voor zover dit toezicht is opgedragen aan
      de Minister;

      e. het uitvoeren van onderzoek naar instellingen die bij de Minister een aanwijzing tot cki op een werkveld hebben
      aangevraagd;

      f. het rapporteren over de resultaten en de kwaliteit van de uitvoering en over mogelijke risico’s voor de
      kwaliteit van de uitvoering en de uitvoeringsorganisaties, genoemd in onderdelen a tot en met c, en over de
      uitkomsten van het toezicht, bedoeld in de onderdelen d en e;

      g. het relatiebeheer met de instanties, genoemd in de onderdelen a tot en met e;

      h. het inbrengen van kennis van de uitvoeringspraktijk in de beleidsvorming door het Ministerie.
    url: https://wetten.overheid.nl/BWBR0021981/2010-03-01#Artikel14
  - number: '15'
    text: |-
      Het hoofd van de afdeling Toezicht BKWI/IB is verantwoordelijk voor:

      a. het houden van toezicht op de uitvoering van de wettelijke taken door het BKWI en het IB;

      b. het rapporteren over de resultaten en kwaliteit van de uitvoering van de wettelijke taken door het BKWI en het
      IB;

      c. het bijdragen aan rapportages over de uitvoering op het beleidsterrein werk en inkomen;

      d. het inbrengen van kennis van de uitvoeringspraktijk in de beleidsvorming van het Ministerie.
    url: https://wetten.overheid.nl/BWBR0021981/2010-03-01#Artikel15
  - number: '16'
    text: |-
      De afdeling Toezicht CWI/SVB is verantwoordelijk voor:

      a. het houden van toezicht op de uitvoering van de wettelijke taken door de CWI en de SVB;

      b. het rapporteren over de resultaten en kwaliteit van de uitvoering van de wettelijke taken door de CWI en de SVB;

      c. het bijdragen aan rapportages over de uitvoering op het beleidsterrein werk en inkomen;

      d. de coördinatie en afstemming binnen de Inspectie aangaande het toezicht op de samenwerking van
      de CWI, het UWV en de SVB met elkaar en met burgemeesters en wethouders van de gemeenten, bedoeld in
      [artikel 37, onderdeel c, van de wet][ref1];

      e. het inbrengen van kennis van de uitvoeringspraktijk in de beleidsvorming van het Ministerie.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel37
    url: https://wetten.overheid.nl/BWBR0021981/2010-03-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '37'
  - number: '17'
    text: |-
      De afdeling Toezicht overige bestuursorganen is verantwoordelijk voor:

      a. het houden van toezicht op de uitvoering van wettelijke taken door de RWI;

      b. het uitoefenen van het toezicht op de AFM en DNB, zoals bedoeld in [artikel 149 van de Pensioenwet][ref1] en
      [artikel 70 van de Wet verplichte beroepspensioenregeling][ref2], alsmede het uitoefenen van het toezicht op DNB,
      zoals bedoeld in [artikel 17 van de Wet verplichte deelneming in een bedrijfstakpensioenfonds 2000][ref3];

      c. het houden van toezicht op de SER, het CTB en cki’s, voor zover dit toezicht is opgedragen aan de Minister;

      d. het rapporteren over de resultaten en kwaliteit van de uitvoering van de wettelijke taken door de RWI, de AFM,
      DNB, de SER, het CTB en cki’s;

      e. het uitvoeren van onderzoek naar instellingen die bij de Minister een aanwijzing tot cki op een werkveld hebben
      aangevraagd;

      f. het bijdragen aan rapportages over de uitvoering op het beleidsterrein werk en inkomen;

      g. het inbrengen van kennis van de uitvoeringspraktijk in de beleidsvorming van het Ministerie.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel149
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel70
