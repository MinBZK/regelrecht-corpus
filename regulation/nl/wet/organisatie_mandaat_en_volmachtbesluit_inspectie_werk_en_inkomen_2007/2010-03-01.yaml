  - number: '7'
    text: |-
      De stafafdeling Concern Control is verantwoordelijk voor:

      a. de voorbereiding en uitvoering van, de verantwoording over, en de evaluatie van de planning- en controlcyclus op
      gebied van middelenbeheer, omvattend personeel, informatie, organisatie, financiën, administratie, huisvesting en
      kennis, alsmede de ontwikkeling en uitvoering van beleid op dat gebied, dat mede facilitymanagement en documentaire
      informatievoorziening omvat;

      b. de advisering over het blijvend voldoen aan de vereisten voor de status van baten-lastendienst;

      c. de advisering over en ondersteuning bij de uitvoering van het middelenbeheer, met inbegrip van het leveren van
      managementinformatie daarover;

      d. adviseren over en beheren van het managementcontrolsysteem van de Inspectie, waaronder het beheren en uitvoeren
      van de planning- en controlcyclus van toezichtactiviteiten;

      e. het kennismanagement, waaronder het opstellen van een opleidingsplan;

      f. het kwaliteitsmanagement;

      g. het beheer van administratieve systemen;

      h. de verzorging van administraties, waaronder de klachtenadministratie, en daarbij behorende producten;

      i. de verzorging van de administratieve en financiële afhandeling van de uitvoering van de
      personeelsaangelegenheden van de Inspectie, voor zover deze niet is opgedragen aan andere onderdelen van het
      Ministerie, zoals de directie Bedrijfsvoering;

      j. beleidsontwikkeling met betrekking tot informatievoorziening en informatisering en het opstellen van
      informatiseringsplannen;

      k. de systeemontwikkeling, de data-acquisitie en het gegevensbeheer;

      l. het voorbereiden, beheren en evalueren van dienstverleningsovereenkomsten over diensten die worden afgenomen van
      de directie Bedrijfsvoering van het Ministerie en van andere dienstverleners;

      m. het beheren, evalueren en zonodig herzien van de afspraken met de directie Communicatie van het Ministerie over
      de bibliotheekdienstverlening;

      n. de verzorging van het ambtelijk secretariaat van de ondernemingsraad.
    url: https://wetten.overheid.nl/BWBR0021981/2010-03-01#Artikel7
  - number: '8'
    text: |-
      Het Bureau Documentaire Informatievoorziening & Facilitymanagement is verantwoordelijk voor:

      a. het adviseren van het management ten aanzien van vraagstukken op het gebied van documentaire
      informatievoorziening en bij de ontwikkeling, uitbouw en implementatie van eigentijdse toepassingen op het
      vakgebied;

      b. het bevorderen van de toegankelijkheid, vindbaarheid en benaderbaarheid van kwalitatieve informatie in fysieke
      en digitale vorm door middel van eigentijdse toepassingen ten behoeve van het verwerven, opslaan, ontsluiten en ter
      beschikking stellen van kwalitatieve informatie;

      c. het verlenen van gebruiksondersteuning aan medewerkers van de Inspectie op het gebied van documentaire
      informatievoorziening;

      d. de advisering over en ontwikkeling van beleid en plannen met betrekking tot algemene facilitaire voorzieningen;

      e. de verzorging van de huisvesting van de Inspectie en overige facilitaire voorzieningen en het daaraan verbonden
      budget- en overig beheer.
    url: https://wetten.overheid.nl/BWBR0021981/2010-03-01#Artikel8
  - number: '9'
    text: |-
      De stafafdeling Juridische Zaken is ten behoeve van de gehele Inspectie verantwoordelijk voor:

      a. de juridische en wetstechnische ondersteuning bij de ontwikkeling en uitvoering van het toezicht;

      b. het bijdragen aan rapportages over de uitvoering op het beleidsterrein werk en inkomen;

      c. de coördinatie en uitvoering van de toezichtbaarheidstoetsen, bedoeld in [artikel 41 van de wet][ref1];

      d. het beheren en onderhouden van een wettendocumentatiesysteem en de verzorging van interne kennisoverdracht;

      e. het fungeren als coördinatie- en aanspreekpunt voor de Inspectie inzake juridische aangelegenheden;

      f. het inbrengen van kennis van de uitvoeringspraktijk in de beleidsvorming van het Ministerie;

      g. de inbreng van juridische expertise ten behoeve van de bedrijfsvoering.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel41
    url: https://wetten.overheid.nl/BWBR0021981/2010-03-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '41'
  - number: '10'
    text: |-
      De stafafdeling Strategie & Communicatie is verantwoordelijk voor:

      a. de strategie- en beleidsontwikkeling op het terrein van de Inspectie, waaronder het formuleren van
      uitgangspunten en doelen voor veranderingen die binnen de Inspectie nodig zijn om de gemaakte keuzen te realiseren;

      b. de totstandkoming van de programmering van de toezichtactiviteiten van de Inspectie, in het bijzonder de
      jaarplannen en meerjarenplannen van de Inspectie;

      c. het relatiebeheer van de Inspectie;

      d. het ontwikkelen en verzorgen van de in- en externe communicatie, met inbegrip van persvoorlichting;

      e. de afstemming van de externe communicatie met de directie Communicatie van het Ministerie.
    url: https://wetten.overheid.nl/BWBR0021981/2010-03-01#Artikel10
  - number: '11'
    text: |-
      De directie Toezicht gemeenten is verantwoordelijk voor:

      a. het houden van toezicht op de rechtmatigheid van de uitvoering door gemeenten van de [WWB][ref1], het
      [Bbz][ref2], de [IOAW][ref3] en de [IOAZ][ref4] en op de doeltreffendheid van die wet- en regelgeving, zoals
      bedoeld in [artikel 37, onderdeel b, onder 1° en 2°, van de wet][ref5];

      b. het houden van toezicht op de rechtmatigheid en doeltreffendheid van de uitvoering door gemeenten van de
      [WSW][ref6] en de [Wwik][ref7] en de doeltreffendheid van die wetten;

      c. het ontwikkelen en uitvoeren van het bij de Inspectie belegde deel van het project Integraal Toezicht Jeugdzaken
      van de daarin samenwerkende rijksinspecties;

      d. het rapporteren over de resultaten en kwaliteit van de uitvoering, bedoeld in de onderdelen a en b, en over de
      werkzaamheden, bedoeld in onderdeel c;

      e. het opstellen van een oordeel over mogelijke risico’s voor de kwaliteit van de uitvoering, bedoeld in de
      onderdelen a, b en c;

      f. het inbrengen van kennis van de uitvoeringspraktijk in de beleidsvorming door het Ministerie;

      g. het relatiebeheer met de uitvoerende instanties binnen het gemeentelijk domein en hun vertegenwoordigende
      organisaties, en met de instanties, bedoeld in onderdeel c.


