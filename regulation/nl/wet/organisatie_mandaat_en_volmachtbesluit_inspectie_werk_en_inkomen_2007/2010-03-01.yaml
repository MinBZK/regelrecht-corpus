  - number: '2'
    text: |-
      De Inspectie Werk en Inkomen bestaat uit de volgende organisatieonderdelen:

      a. het hierna genoemde organisatieonderdeel dat rechtstreeks ressorteert onder de inspecteur-generaal:

      1°. de stafafdeling Strategie & Communicatie;

      b. de hierna genoemde organisatieonderdelen die rechtstreeks ressorteren onder de directeur Toezicht gemeenten:

      1°. de Directie toezicht gemeenten, bestaande uit:

        - de afdelingen Toezicht WWB 1 en Toezicht WWB 2, en
        - de afdeling Toezicht WSW, Wet kinderopvang, Monitoring & Integraal Toezicht Jeugdzaken,

      2°. de stafafdeling Concern Control, en

      3°. de stafafdeling Juridische Zaken;

      c. het hierna genoemde organisatieonderdeel dat rechtstreeks ressorteert onder het hoofd van de afdeling Concern
      Control:

      1°. het Bureau Documentaire Informatievoorziening & Facilitymanagement;

      d. de hierna genoemde organisatieonderdelen die rechtstreeks ressorteren onder de directeur Toezicht zbo’s en
      overige bestuursorganen:

      1°. de Directie Toezicht zbo’s en overige bestuursorganen, bestaande uit:

        - de afdeling Toezicht BKWI/IB;
        - de afdeling Toezicht CWI/SVB;
        - de afdeling Toezicht overige bestuursorganen;
        - de afdeling Toezicht UWV/ Uitkering, Keten & Organisatie;
        - de afdeling Toezicht UWV/ Activering, Cliënt & Verantwoording.
    url: https://wetten.overheid.nl/BWBR0021981/2010-03-01#Artikel2
  - number: '3'
    text: |-
      Elk van de directeuren is verantwoordelijk voor:

      a. het leiding geven aan de eigen directie;

      b. het coördineren van het toezicht op de uitvoering van de sociale verzekeringen en voorzieningen, en op
      de werking van het stelsel daarvan, en van andere taken, bedoeld in [artikel 37, onderdeel d][ref1], en
      [artikel 39, tweede lid, van de wet][ref2], in samenspraak met de inspecteur-generaal en de andere directeur;

      c. het door tussenkomst van de inspecteur-generaal adviseren van bewindspersonen ten aanzien van het werkterrein
      van de eigen directie en het hen attenderen op politiek of maatschappelijk gevoelige aspecten daarvan;

      d. het zorgdragen voor een effectieve en efficiënte bedrijfsvoering, binnen door de inspecteur-generaal
      vastgestelde kaders, voor periodieke evaluatie daarvan en voor planning en bewaking van de productie van de eigen
      directie;

      e. de personeelsaangelegenheden van de eigen directie en de onder hem ressorterende stafafdelingen, met inbegrip
      van het arbeidsomstandigheden- en ziekteverzuimbeleid, van de onder elk van hen ressorterende functionarissen, voor
      zover dit niet is voorbehouden aan de secretaris-generaal of de inspecteur-generaal;

      f. het op orde hebben van de administratieve organisatie en informatiebeveiliging;

      g. het uitvoeren van het jaarplan van de Inspectie voor wat betreft de eigen directie;

      h. het rapporteren en het afleggen van verantwoording over de uitvoering van het jaarplan van de Inspectie aan de
      inspecteur-generaal voor wat betreft de eigen directie;

      i. de behandeling van klachten als bedoeld in [artikel 9:1 van de Algemene wet bestuursrecht][ref3] voor zover deze
      betrekking hebben op gedragingen van de onder hen ressorterende functionarissen;

      j. het materieel beheer overeenkomstig de [Regeling materieelbeheer rijksoverheid 2006][ref4] en de
      [Regeling materieelbeheer museale voorwerpen][ref5].


