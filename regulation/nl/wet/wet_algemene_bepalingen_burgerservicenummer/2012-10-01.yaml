---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_algemene_bepalingen_burgerservicenummer
regulatory_layer: WET
publication_date: '2025-11-06'
valid_from: '2012-10-01'
bwb_id: BWBR0022428
url: https://wetten.overheid.nl/BWBR0022428/2012-10-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is algemene regels te stellen in verband met de invoering
    van een uniek persoonsnummer teneinde de doelmatigheid van de administraties van de overheid en enige andere
    sectoren te vergroten en de dienstverlening aan de burger te verbeteren, een en ander met inachtneming van de eisen
    die daaraan behoren te worden gesteld ter bescherming van de persoonlijke levenssfeer;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;'
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel1
  - number: 1.b
    text: 'burgerservicenummer: het als zodanig overeenkomstig deze wet aan een natuurlijke persoon toegekend nummer;'
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel1
  - number: 1.c
    text: 'overheidsorgaan:'
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel1
  - number: 1.c.1°
    text: een orgaan van een rechtspersoon die krachtens publiekrecht is ingesteld, of
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel1
  - number: 1.c.2°
    text: een ander persoon of college, met enig openbaar gezag bekleed;
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel1
  - number: 1.d
    text: 'gebruiker:'
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel1
  - number: 1.d.1°
    text: een overheidsorgaan;
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel1
  - number: 1.d.2°
    text: |-
      ieder ander dan een overheidsorgaan of degene aan wie het burgerservicenummer is toegekend, voor zover deze
      werkzaamheden verricht waarbij het gebruik door hem of haar van het burgerservicenummer bij of krachtens de wet
      is voorgeschreven;
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel1
  - number: 1.e
    text: |-
      GBA: basisadministratie van persoonsgegevens als bedoeld in
      [artikel 2 van de Wet gemeentelijke basisadministratie persoonsgegevens][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel2
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '2'
  - number: 1.f
    text: |-
      beheervoorziening: de beheervoorziening, bedoeld in [artikel 3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 1.g
    text: 'nummerregister: het nummerregister dat deel uitmaakt van de beheervoorziening;'
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel1
  - number: 1.h
    text: |-
      sociaal-fiscaalnummer: het sociaal-fiscaalnummer, bedoeld in
      [artikel 2, derde lid, onderdeel k, van de Algemene wet inzake rijksbelastingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel2
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '2'
  - number: '2'
    text: Het burgerservicenummer bevat geen informatie over de persoon aan wie het is toegekend.
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel2
  - number: '3.1'
    text: 'Onze Minister draagt zorg voor de inrichting en de instandhouding van een beheervoorziening, waarvan deel uitmaken:'
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel3
  - number: 3.1.a
    text: |-
      voorzieningen met behulp waarvan nummers die als burgerservicenummer kunnen worden toegekend, worden aangemaakt en
      ter beschikking worden gesteld;
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel3
  - number: 3.1.b
    text: het nummerregister;
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel3
  - number: 3.1.c
    text: voorzieningen met behulp waarvan het nummerregister kan worden geraadpleegd;
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel3
  - number: 3.1.d
    text: 'voorzieningen met behulp waarvan de daartoe bestemde registraties kunnen worden geraadpleegd teneinde na te gaan:'
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel3
  - number: 3.1.d.1°
    text: of aan een bepaalde persoon reeds een burgerservicenummer is toegekend en zo ja, welk burgerservicenummer;
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel3
  - number: 3.1.d.2°
    text: aan welke persoon een bepaald burgerservicenummer is toegekend;
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel3
  - number: 3.1.d.3°
    text: |-
      of het Nederlandse document, met behulp waarvan een persoon zich identificeert, een document is als bedoeld in
      [artikel 1, eerste lid, onder 1°, 2° of 4°, van de Wet op de identificatieplicht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 3.1.e
    text: |-
      voorzieningen met behulp waarvan op verzoek aan een college van burgemeester en wethouders gegevens worden
      verstrekt, die noodzakelijk zijn voor de uitvoering van [artikel 8, tweede lid, tweede volzin][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel8
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '8'
        hoofdstuk: '3'
  - number: '3.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de inrichting, de
      instandhouding, de werking en de beveiliging van de beheervoorziening.
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel3
  - number: '4.1'
    text: 'Het nummerregister bevat:'
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel4
  - number: 4.1.a
    text: |-
      de aangemaakte nummers, bedoeld in [artikel 3, eerste lid, onder a][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 4.1.b
    text: de bij algemene maatregel van bestuur te bepalen administratieve gegevens, die op deze nummers betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel4
  - number: '4.2'
    text: |-
      Bij of krachtens de maatregel, bedoeld in het eerste lid, onder b, worden tevens regels gesteld omtrent het
      opnemen, wijzigen en verwijderen van de administratieve gegevens.
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel4
  - number: '5.1'
    text: |-
      Een college van burgemeester en wethouders verschaft Onze Minister onverwijld de inlichtingen omtrent de
      toekenning, die voor de bijhouding van het nummerregister van belang zijn.
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel5
  - number: '5.2'
    text: Bij ministeriële regeling worden regels gesteld omtrent de in het eerste lid bedoelde inlichtingen.
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel5
  - number: '6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen verplichtingen worden geregeld van overheidsorganen om aan
      Onze Minister de inlichtingen te verschaffen die voor de bijhouding van het nummerregister van belang zijn.
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel6
  - number: '7'
    text: |-
      Onze Minister draagt er zorg voor dat een nummer dat als burgerservicenummer kan worden toegekend slechts éénmaal
      wordt aangemaakt en ter beschikking gesteld aan een bestuursorgaan dat bevoegd is het nummer toe te kennen.
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel7
  - number: '8.1'
    text: |-
      Het college van burgemeester en wethouders kent onmiddellijk na de inschrijving van een persoon in de GBA aan deze
      ingeschrevene een burgerservicenummer toe, tenzij aan hem reeds een burgerservicenummer is toegekend.
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel8
  - number: '8.2'
    text: |-
      Het burgerservicenummer wordt toegekend uit de nummers die op grond van [artikel 7][ref1] aan het college
      van burgemeester en wethouders ter beschikking zijn gesteld. Indien aan de ingeschrevene reeds een sociaal-
      fiscaalnummer is toegekend, wordt, in afwijking van de eerste volzin, dit nummer door het college van burgemeester
      en wethouders aan hem als burgerservicenummer toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel7
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '7'
        hoofdstuk: '3'
  - number: '8.3'
    text: |-
      Het college van burgemeester en wethouders draagt zorg dat een burgerservicenummer foutloos en slechts éénmaal
      wordt toegekend.
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel8
  - number: '8.4'
    text: |-
      In verband met de uitvoering van dit artikel maakt het college van burgemeester en wethouders gebruik van de
      voorzieningen, bedoeld in [artikel 3, eerste lid, onder c, d en e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '8.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de uitvoering van dit artikel,
      waaronder regels betreffende de verplichtingen van overheidsorganen om gegevens te verstrekken die voor de
      uitvoering noodzakelijk zijn. De maatregel bepaalt in ieder geval welke gegevens in verband met de uitvoering van
      dit artikel aan een college van burgemeester en wethouders worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel8
  - number: '9.1'
    text: |-
      Het college van burgemeester en wethouders dat een burgerservicenummer heeft toegekend, stelt degene aan wie het
      nummer is toegekend daarvan binnen vier weken na de toekenning in kennis onder vermelding van het desbetreffende
      burgerservicenummer.
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel9
  - number: '9.2'
    text: |-
      Bij minderjarigen jonger dan 16 jaar en bij onder curatele gestelden geschiedt de kennisgeving aan de ouders,
      voogden of verzorgers, onderscheidenlijk aan de curator.
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel9
  - number: '9.3'
    text: Bij ministeriële regeling worden nadere regels gesteld omtrent de in het eerste lid bedoelde kennisgeving.
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel9
  - number: '10'
    text: |-
      Overheidsorganen kunnen bij het verwerken van persoonsgegevens in het kader van de uitvoering van hun taak gebruik
      maken van het burgerservicenummer, met inachtneming van hetgeen bij of krachtens dit hoofdstuk is bepaald.
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel10
  - number: '11.1'
    text: |-
      Bij het uitwisselen van persoonsgegevens tussen gebruikers onderling, waarbij een persoonsnummer wordt gebruikt
      als middel om persoonsgegevens in verband te brengen met een persoon aan wie een burgerservicenummer is toegekend,
      wordt het burgerservicenummer van die persoon vermeld.
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel11
  - number: '11.2'
    text: 'Het eerste lid is niet van toepassing voor zover:'
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel11
  - number: 11.2.a
    text: |-
      ten behoeve van de desbetreffende gegevensverwerking bij of krachtens wet het gebruik van een ander persoonsnummer
      dan het burgerservicenummer is voorgeschreven;
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel11
  - number: 11.2.b
    text: |-
      sprake is van bijzondere omstandigheden waarin het gebruik van het burgerservicenummer in een individueel geval
      onwenselijk is met het oog op de bescherming van de persoonlijke levenssfeer van de betrokkene, de opsporing of
      vervolging van strafbare feiten dan wel de veiligheid van de staat.
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel11
  - number: '12'
    text: |-
      Indien bij het verwerken van persoonsgegevens een burgerservicenummer wordt gebruikt, vergewist de gebruiker zich
      ervan dat het burgerservicenummer betrekking heeft op de persoon wiens persoonsgegevens hij verwerkt.
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel12
  - number: '13'
    text: |-
      Degene aan wie een burgerservicenummer is toegekend, dan wel diens wettelijk vertegenwoordiger, kan niet worden
      verplicht bij het verstrekken van persoonsgegevens aan een gebruiker een ander persoonsnummer te verstrekken dan
      het burgerservicenummer dat aan hem, onderscheidenlijk aan degene die hij vertegenwoordigt, is toegekend.
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel13
  - number: '14'
    text: |-
      Aan een gebruiker worden op zijn verzoek uit het nummerregister de inlichtingen verstrekt, die hij nodig heeft in
      verband met het gebruik van een burgerservicenummer.
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel14
  - number: '15.1'
    text: |-
      Aan een overheidsorgaan worden in verband met de uitvoering van [artikel 12][ref1] op zijn verzoek uit de
      registraties, bedoeld in [artikel 3, eerste lid, onder d][ref2], de gegevens verstrekt, die hij nodig heeft
      teneinde na te gaan:


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '12'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0022428
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 15.1.a
    text: of aan een bepaalde persoon reeds een burgerservicenummer is toegekend en zo ja, welk burgerservicenummer;
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel15
  - number: 15.1.b
    text: aan welke persoon een bepaald burgerservicenummer is toegekend;
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel15
  - number: 15.1.c
    text: |-
      of het Nederlandse document, met behulp waarvan een persoon zich identificeert, een document is als bedoeld in
      [artikel 1, eerste lid, onder 1°, 2° of 4°, van de Wet op de identificatieplicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '15.2'
    text: |-
      Met betrekking tot een gebruiker, niet zijnde een overheidsorgaan, is het eerste lid, aanhef en onder c, van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel15
  - number: '15.3'
    text: |-
      Bij of krachtens de wet kunnen gevallen worden geregeld, waarin een gebruiker, niet zijnde een overheidsorgaan,
      in verband met de uitvoering van [artikel 12][ref1] bevoegd dan wel gehouden is een registratie als bedoeld in
      [artikel 3, eerste lid, onder d][ref2], te raadplegen teneinde na te gaan:


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '12'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0022428
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 15.3.a
    text: of aan een bepaalde persoon reeds een burgerservicenummer is toegekend en zo ja, welk burgerservicenummer;
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel15
  - number: 15.3.b
    text: aan welke persoon een bepaald burgerservicenummer is toegekend.
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel15
  - number: '15.4'
    text: In de gevallen, bedoeld in het derde lid, is het eerste lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel15
  - number: '16.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld betreffende de voorwaarden waaronder
      en de wijze waarop gebruikers in verband met de uitvoering van deze paragraaf gebruik kunnen maken van:
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel16
  - number: 16.1.a
    text: het nummerregister;
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel16
  - number: 16.1.b
    text: |-
      de voorzieningen, bedoeld in [artikel 3, eerste lid, onder d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '16.2'
    text: |-
      Bij of krachtens de maatregel, bedoeld in het eerste lid, worden regels gesteld omtrent de verplichtingen van
      overheidsorganen om gegevens te verstrekken die voor de uitvoering van deze paragraaf noodzakelijk zijn. De
      maatregel bepaalt in ieder geval welke gegevens in verband met de uitvoering van deze paragraaf aan een gebruiker
      worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel16
  - number: '16.3'
    text: |-
      Bij of krachtens de maatregel, bedoeld in het eerste lid, worden in ieder geval regels gesteld betreffende de
      beveiliging van de technische voorzieningen, waarmee de gebruikers kunnen aansluiten op de beheervoorziening.
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel16
  - number: '17.1'
    text: |-
      Bij algemene maatregel van bestuur, op voordracht van Onze Minister die het aangaat, kan worden bepaald dat bij
      of krachtens de maatregel aangewezen gebruikers of categorieën van gebruikers uitsluitend door tussenkomst van
      een bij de algemene maatregel van bestuur ingestelde sectorale berichtenvoorziening gebruik kunnen maken van de
      voorzieningen, bedoeld in [artikel 3, eerste lid, onder c en d][ref1]. De maatregel bepaalt wie met betrekking tot
      de sectorale berichtenvoorziening de verantwoordelijke is.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '17.2'
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in het eerste lid, kan tevens worden bepaald dat voor bij of
      krachtens de maatregel aangewezen gebruikers of categorieën van gebruikers een bevoegdheid of een verplichting
      geldt als bedoeld in [artikel 15, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel15
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '15'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '17.3'
    text: |-
      De verantwoordelijke, bedoeld in het eerste lid, tweede volzin, levert de inlichtingen, bedoeld in
      [artikel 14][ref1], alsmede de gegevens, bedoeld in [artikel 15, eerste lid][ref2], door aan de gebruiker die door
      tussenkomst van de sectorale berichtenvoorziening de inlichtingen, onderscheidenlijk de gegevens, verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0022428#Artikel15
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '14'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0022428
        artikel: '15'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '17.4'
    text: |-
      De [artikelen 14][ref1] en [15, eerste lid][ref2], zijn van overeenkomstige toepassing op de verantwoordelijke,
      bedoeld in het eerste lid, tweede volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0022428#Artikel15
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '14'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0022428
        artikel: '15'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '17.5'
    text: |-
      De verantwoordelijke, bedoeld in het eerste lid, tweede volzin, gaat na of degene die door
      tussenkomst van de sectorale berichtenvoorziening toegang tot een voorziening als bedoeld in
      [artikel 3, eerste lid, onder c of d][ref1], verlangt een krachtens het eerste lid aangewezen gebruiker is dan wel
      behoort tot een daartoe krachtens het eerste lid aangewezen categorie van gebruikers.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '17.6'
    text: |-
      Bij of krachtens de algemene maatregel van bestuur, bedoeld in het eerste lid, worden nadere regels
      gesteld met betrekking tot de inrichting, de instandhouding, de werking en de beveiliging van de sectorale
      berichtenvoorziening.
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel17
  - number: '18.1'
    text: |-
      Onze Minister draagt zorg voor de inrichting en de instandhouding van een voorziening met behulp waarvan voor
      eenieder algemene informatie beschikbaar wordt gesteld met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel18
  - number: 18.1.a
    text: het gebruik van burgerservicenummers;
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel18
  - number: 18.1.b
    text: de gegevensverwerkingen van gebruikers, waarbij burgerservicenummers worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel18
  - number: '18.2'
    text: |-
      Overheidsorganen verschaffen Onze Minister desgevraagd de inlichtingen betreffende gegevensverwerkingen, die van
      belang zijn voor de uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel18
  - number: '18.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de
      verplichting, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel18
  - number: '19'
    text: |-
      Onze Minister benoemt een functionaris voor de gegevensbescherming als bedoeld in
      [artikel 62 van de Wet bescherming persoonsgegevens][ref1], die toeziet op de verwerking van persoonsgegevens
      in verband met de uitvoering van deze wet, voor zover Onze Minister voor deze gegevensverwerkingen de
      verantwoordelijke is.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel62
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '62'
  - number: '21.1'
    text: |-
      Onze Minister verricht eens per drie jaar een onderzoek naar de inrichting, de werking en de beveiliging van de
      beheervoorziening.
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel21
  - number: '21.2'
    text: |-
      De bestuursorganen die burgerservicenummers toekennen, verschaffen Onze Minister desgevraagd de inlichtingen
      betreffende de toekenning van burgerservicenummers.
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel21
  - number: '21.3'
    text: |-
      Onze Minister die het aangaat verricht eens per drie jaar een onderzoek naar de inrichting, de werking en de
      beveiliging van een sectorale berichtenvoorziening als bedoeld in [artikel 17, eerste lid][ref1], die onder zijn
      verantwoordelijkheid valt.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel17
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '17'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '21.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur, op voordracht van Onze Minister, onderscheidenlijk Onze
      Minister die het aangaat in overeenstemming met Onze Minister, worden nadere regels gesteld met betrekking tot de
      beoordelingscriteria en de wijze van uitvoering van de onderzoeken, bedoeld in het eerste, onderscheidenlijk het
      derde lid.
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel21
  - number: '22.1'
    text: |-
      Het sociaal-fiscaalnummer dat op het moment van inwerkingtreding van dit artikel is toegekend aan een persoon die
      is ingeschreven in de GBA van een gemeente, wordt aangemerkt als diens burgerservicenummer. [Artikel 9][ref1] is
      niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel9
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '9'
        hoofdstuk: '3'
  - number: '22.2'
    text: |-
      Op het tijdstip waarop [artikel 3, eerste lid, aanhef en onder b][ref1], in werking treedt, worden in het
      nummerregister opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 22.2.a
    text: |-
      de burgerservicenummers, bedoeld in het eerste lid, alsmede de op die nummers betrekking hebbende administratieve
      gegevens;
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel22
  - number: 22.2.b
    text: |-
      de sociaal-fiscale nummers die voor het tijdstip, bedoeld in de aanhef, zijn toegekend en waarop het eerste lid
      niet van toepassing is, alsmede de op die nummers betrekking hebbende administratieve gegevens.
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel22
  - number: '23.1'
    text: |-
      Ten aanzien van de personen aan wie op grond van deze wet een burgerservicenummer is toegekend, wordt de vermelding
      van het sociaal-fiscaalnummer in enige registratie of op enig document gelijkgesteld met de vermelding van het
      burgerservicenummer.
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel23
  - number: '23.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van de vermelding van het begrip sociaal-fiscaalnummer
      in enig wettelijk voorschrift.
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel23
  - number: '25'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld, waarbij onderscheid kan worden
      gemaakt tussen categorieën van gebruikers.
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel25
  - number: '26'
    text: 'Deze wet wordt aangehaald als: Wet algemene bepalingen burgerservicenummer.'
    url: https://wetten.overheid.nl/BWBR0022428/2012-10-01#Artikel26
