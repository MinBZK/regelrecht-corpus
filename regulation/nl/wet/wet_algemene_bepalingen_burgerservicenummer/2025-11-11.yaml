  - number: '22'
    text: |-
      1 Het bestuurscollege kent onmiddellijk een burgerservicenummer toe aan een persoon die op het moment van
      inwerkingtreding van [artikel I, onderdeel C, van de Wet invoering BSN en voorzieningen digitale overheid BES][ref1]
      reeds in de basisadministratie is ingeschreven op grond van
      [artikel 5 van de Wet basisadministraties persoonsgegevens BES][ref2], tenzij aan hem reeds een burgerservicenummer
      is toegekend.

      2 [Artikel 8, derde tot en met zesde lid][ref3], is van overeenkomstige toepassing.


