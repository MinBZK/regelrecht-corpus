  - number: '2'
    text: Het burgerservicenummer bevat geen informatie over de persoon aan wie het is toegekend.
    url: https://wetten.overheid.nl/BWBR0022428/2025-11-11#Artikel2
  - number: '3'
    text: |-
      1 Onze Minister draagt zorg voor de inrichting en de instandhouding van een beheervoorziening, waarvan deel
      uitmaken:

      a. voorzieningen met behulp waarvan nummers die als burgerservicenummer kunnen worden toegekend, worden aangemaakt
      en ter beschikking worden gesteld;

      b. het nummerregister;

      c. voorzieningen met behulp waarvan het nummerregister kan worden geraadpleegd;

      d. voorzieningen met behulp waarvan de daartoe bestemde registraties kunnen worden geraadpleegd teneinde na te
      gaan:

      1°. of aan een bepaalde persoon reeds een burgerservicenummer is toegekend en zo ja, welk burgerservicenummer;

      2°. aan welke persoon een bepaald burgerservicenummer is toegekend;

      3°. of het Nederlandse document, met behulp waarvan een persoon zich identificeert, een document is als bedoeld in
      [artikel 1, eerste lid, onder 1°, 2° of 4°, van de Wet op de identificatieplicht][ref1].

      2 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de inrichting, de
      instandhouding, de werking en de beveiliging van de beheervoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0022428/2025-11-11#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '4'
    text: |-
      1 Het nummerregister bevat:

      a. de aangemaakte nummers, bedoeld in [artikel 3, eerste lid, onder a][ref1], en

      b. de bij algemene maatregel van bestuur te bepalen administratieve gegevens, die op deze nummers betrekking
      hebben.

      2 Bij of krachtens de maatregel, bedoeld in het eerste lid, onder b, worden tevens regels gesteld omtrent het
      opnemen, wijzigen en verwijderen van de administratieve gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0022428/2025-11-11#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '5'
    text: |-
      1 Een college van burgemeester en wethouders of een bestuurscollege verschaft Onze Minister onverwijld de
      inlichtingen omtrent de toekenning, die voor de bijhouding van het nummerregister van belang zijn.

      2 Bij ministeriële regeling worden regels gesteld omtrent de in het eerste lid bedoelde inlichtingen.
    url: https://wetten.overheid.nl/BWBR0022428/2025-11-11#Artikel5
  - number: '6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen verplichtingen worden geregeld van overheidsorganen om aan
      Onze Minister de inlichtingen te verschaffen die voor de bijhouding van het nummerregister van belang zijn.
    url: https://wetten.overheid.nl/BWBR0022428/2025-11-11#Artikel6
  - number: '7'
    text: |-
      Onze Minister draagt er zorg voor dat een nummer dat als burgerservicenummer kan worden toegekend slechts éénmaal
      wordt aangemaakt en ter beschikking gesteld aan een bestuursorgaan dat bevoegd is het nummer toe te kennen.
    url: https://wetten.overheid.nl/BWBR0022428/2025-11-11#Artikel7
  - number: '8'
    text: |-
      1 Het college van burgemeester en wethouders, onderscheidenlijk Onze Minister, kent onmiddellijk na de inschrijving
      van een persoon als ingezetene, onderscheidenlijk niet-ingezetene, in de basisregistratie personen, aan de
      ingeschrevene een burgerservicenummer toe, tenzij aan hem reeds een burgerservicenummer is toegekend.

      2 Het bestuurscollege kent onmiddellijk na een inschrijving in de basisadministratie als bedoeld in
      [artikel 5 van de Wet basisadministraties persoonsgegevens BES][ref1], aan de ingeschrevene een burgerservicenummer
      toe, tenzij aan hem reeds een burgerservicenummer is toegekend.

      3 Het burgerservicenummer wordt toegekend uit de nummers die op grond van [artikel 7][ref2] ter beschikking zijn
      gesteld.

      4 Een burgerservicenummer wordt foutloos en slechts éénmaal toegekend.

      5 In verband met de uitvoering van dit artikel maakt het bestuursorgaan dat het burgerservicenummer toekent,
      gebruik van de voorzieningen, bedoeld in [artikel 3, eerste lid, onder c en d][ref3].

      6 Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de uitvoering van dit artikel,
      waaronder regels betreffende de verplichtingen van overheidsorganen om gegevens te verstrekken die voor de
      uitvoering noodzakelijk zijn. De maatregel bepaalt in ieder geval welke gegevens in verband met de uitvoering van
      dit artikel worden verstrekt aan het bestuursorgaan dat het burgerservicenummer toekent.


      [ref1]: https://wetten.overheid.nl/BWBR0028208#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0022428#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0022428/2025-11-11#Artikel8
