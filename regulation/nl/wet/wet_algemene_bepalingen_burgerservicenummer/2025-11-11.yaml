preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is algemene regels te stellen in verband met de invoering
    van een uniek persoonsnummer teneinde de doelmatigheid van de administraties van de overheid en enige andere
    sectoren te vergroten en de dienstverlening aan de burger te verbeteren, een en ander met inachtneming van de eisen
    die daaraan behoren te worden gesteld ter bescherming van de persoonlijke levenssfeer;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0022428/2025-11-11#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;

      b. burgerservicenummer: het als zodanig overeenkomstig deze wet aan een natuurlijke persoon toegekend nummer;

      c. overheidsorgaan:

      1°. een orgaan van een rechtspersoon die krachtens publiekrecht is ingesteld, of

      2°. een ander persoon of college, met enig openbaar gezag bekleed;

      d. gebruiker:

      1°. een overheidsorgaan;

      2°. ieder ander dan een overheidsorgaan of degene aan wie het burgerservicenummer is toegekend, voor zover deze
      werkzaamheden verricht waarbij het gebruik door hem of haar van het burgerservicenummer bij of krachtens de wet
      is voorgeschreven;

      e. beheervoorziening: de beheervoorziening, bedoeld in [artikel 3][ref1];

      f. nummerregister: het nummerregister dat deel uitmaakt van de beheervoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0022428/2025-11-11#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 1a
    text: |-
      1 Deze wet en de daarop berustende bepalingen zijn mede van toepassing in de openbare lichamen Bonaire, Sint
      Eustatius en Saba.

      2 In afwijking van het eerste lid is [artikel 13][ref1] eerst van toepassing met ingang van een bij Koninklijk
      Besluit te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel13
    url: https://wetten.overheid.nl/BWBR0022428/2025-11-11#Artikel1a
