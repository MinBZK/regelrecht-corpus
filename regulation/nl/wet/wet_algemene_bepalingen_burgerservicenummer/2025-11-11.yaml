  - number: '16'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld betreffende de voorwaarden waaronder
      en de wijze waarop gebruikers in verband met de uitvoering van deze paragraaf gebruik kunnen maken van:

      a. het nummerregister;

      b. de voorzieningen, bedoeld in [artikel 3, eerste lid, onder d][ref1].

      2 Bij of krachtens de maatregel, bedoeld in het eerste lid, worden regels gesteld omtrent de verplichtingen
      van overheidsorganen om gegevens te verstrekken die voor de uitvoering van deze paragraaf noodzakelijk zijn. De
      maatregel bepaalt in ieder geval welke gegevens in verband met de uitvoering van deze paragraaf aan een gebruiker
      worden verstrekt.

      3 Bij of krachtens de maatregel, bedoeld in het eerste lid, worden in ieder geval regels gesteld betreffende de
      beveiliging van de technische voorzieningen, waarmee de gebruikers kunnen aansluiten op de beheervoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel3
