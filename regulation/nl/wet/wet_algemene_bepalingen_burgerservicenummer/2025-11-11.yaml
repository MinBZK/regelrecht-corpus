      [artikel I, onderdeel C, van de Wet invoering BSN en voorzieningen digitale overheid BES][ref1] berust het
      [Besluit burgerservicenummer][ref2] mede op de [artikelen 8, zesde lid][ref3], en [22, tweede lid][ref4], van deze
      wet.


