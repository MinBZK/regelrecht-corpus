  - number: '18'
    text: |-
      1 Onze Minister draagt zorg voor de inrichting en de instandhouding van een voorziening met behulp waarvan voor
      eenieder algemene informatie beschikbaar wordt gesteld met betrekking tot:

      a. het gebruik van burgerservicenummers;

      b. de gegevensverwerkingen van gebruikers, waarbij burgerservicenummers worden gebruikt.

      2 Overheidsorganen verschaffen Onze Minister desgevraagd de inlichtingen betreffende gegevensverwerkingen, die van
      belang zijn voor de uitvoering van het eerste lid.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de
      verplichting, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0022428/2025-11-11#Artikel18
  - number: '21'
    text: |-
      1 Onze Minister verricht eens per drie jaar een onderzoek naar de inrichting, de werking en de beveiliging van
      de beheervoorziening.

      2 De bestuursorganen die burgerservicenummers toekennen, verschaffen Onze Minister desgevraagd de inlichtingen
      betreffende de toekenning van burgerservicenummers.

      3 Onze Minister die het aangaat verricht eens per drie jaar een onderzoek naar de inrichting, de werking en de
      beveiliging van een sectorale berichtenvoorziening als bedoeld in [artikel 17, eerste lid][ref1], die onder zijn
      verantwoordelijkheid valt.

      4 Bij of krachtens algemene maatregel van bestuur, op voordracht van Onze Minister, onderscheidenlijk Onze
      Minister die het aangaat in overeenstemming met Onze Minister, worden nadere regels gesteld met betrekking tot de
      beoordelingscriteria en de wijze van uitvoering van de onderzoeken, bedoeld in het eerste, onderscheidenlijk het
      derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel17
