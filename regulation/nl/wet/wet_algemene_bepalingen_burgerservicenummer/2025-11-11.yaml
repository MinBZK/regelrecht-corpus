  - number: '17'
    text: |-
      1 Bij algemene maatregel van bestuur, op voordracht van Onze Minister die het aangaat, kan worden bepaald dat bij
      of krachtens de maatregel aangewezen gebruikers of categorieën van gebruikers uitsluitend door tussenkomst van
      een bij de algemene maatregel van bestuur ingestelde sectorale berichtenvoorziening gebruik kunnen maken van de
      voorzieningen, bedoeld in [artikel 3, eerste lid, onder c en d][ref1]. De maatregel bepaalt wie met betrekking tot
      de sectorale berichtenvoorziening de verantwoordelijke is.

      2 Bij de algemene maatregel van bestuur, bedoeld in het eerste lid, kan tevens worden bepaald dat voor bij of
      krachtens de maatregel aangewezen gebruikers of categorieën van gebruikers een bevoegdheid of een verplichting
      geldt als bedoeld in [artikel 15, derde lid][ref2].

      3 De verantwoordelijke, bedoeld in het eerste lid, tweede volzin, levert de inlichtingen, bedoeld in
      [artikel 14][ref3], alsmede de gegevens, bedoeld in [artikel 15, eerste lid][ref4], door aan de gebruiker die door
      tussenkomst van de sectorale berichtenvoorziening de inlichtingen, onderscheidenlijk de gegevens, verzocht.

      4 De [artikelen 14][ref5] en [15, eerste lid][ref6], zijn van overeenkomstige toepassing op de verantwoordelijke,
      bedoeld in het eerste lid, tweede volzin.

      5 De verantwoordelijke, bedoeld in het eerste lid, tweede volzin, gaat na of degene die door
      tussenkomst van de sectorale berichtenvoorziening toegang tot een voorziening als bedoeld in
      [artikel 3, eerste lid, onder c of d][ref7], verlangt een krachtens het eerste lid aangewezen gebruiker is dan wel
      behoort tot een daartoe krachtens het eerste lid aangewezen categorie van gebruikers.

      6 Bij of krachtens de algemene maatregel van bestuur, bedoeld in het eerste lid, worden nadere regels
      gesteld met betrekking tot de inrichting, de instandhouding, de werking en de beveiliging van de sectorale
      berichtenvoorziening.


