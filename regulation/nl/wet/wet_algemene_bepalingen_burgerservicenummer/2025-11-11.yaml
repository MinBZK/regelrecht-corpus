  - number: '9'
    text: |-
      1 Het bestuursorgaan dat een burgerservicenummer heeft toegekend, stelt degene aan wie het nummer is toegekend
      daarvan binnen vier weken na de toekenning in kennis onder vermelding van het desbetreffende burgerservicenummer.

      2 Bij minderjarigen jonger dan 16 jaar en bij onder curatele gestelden geschiedt de kennisgeving aan de ouders,
      voogden of verzorgers, onderscheidenlijk aan de curator.

      3 Bij ministeriële regeling worden nadere regels gesteld omtrent de in het eerste lid bedoelde kennisgeving.
    url: https://wetten.overheid.nl/BWBR0022428/2025-11-11#Artikel9
  - number: '10'
    text: |-
      Overheidsorganen kunnen bij het verwerken van persoonsgegevens in het kader van de uitvoering van hun taak gebruik
      maken van het burgerservicenummer, met inachtneming van hetgeen bij of krachtens dit hoofdstuk is bepaald.
    url: https://wetten.overheid.nl/BWBR0022428/2025-11-11#Artikel10
  - number: '11'
    text: |-
      1 Bij het uitwisselen van persoonsgegevens tussen gebruikers onderling, waarbij een persoonsnummer wordt gebruikt
      als middel om persoonsgegevens in verband te brengen met een persoon aan wie een burgerservicenummer is toegekend,
      wordt het burgerservicenummer van die persoon vermeld.

      2 Het eerste lid is niet van toepassing voor zover:

      a. ten behoeve van de desbetreffende gegevensverwerking bij of krachtens wet het gebruik van een ander
      persoonsnummer dan het burgerservicenummer is voorgeschreven;

      b. sprake is van bijzondere omstandigheden waarin het gebruik van het burgerservicenummer in een individueel geval
      onwenselijk is met het oog op de bescherming van de persoonlijke levenssfeer van de betrokkene, de opsporing of
      vervolging van strafbare feiten dan wel de veiligheid van de staat.
    url: https://wetten.overheid.nl/BWBR0022428/2025-11-11#Artikel11
  - number: '12'
    text: |-
      Indien bij het verwerken van persoonsgegevens een burgerservicenummer wordt gebruikt, vergewist de gebruiker zich
      ervan dat het burgerservicenummer betrekking heeft op de persoon wiens persoonsgegevens hij verwerkt.
    url: https://wetten.overheid.nl/BWBR0022428/2025-11-11#Artikel12
  - number: '13'
    text: |-
      Degene aan wie een burgerservicenummer is toegekend, dan wel diens wettelijk vertegenwoordiger, kan niet worden
      verplicht bij het verstrekken van persoonsgegevens aan een gebruiker een ander persoonsnummer te verstrekken dan
      het burgerservicenummer dat aan hem, onderscheidenlijk aan degene die hij vertegenwoordigt, is toegekend.
    url: https://wetten.overheid.nl/BWBR0022428/2025-11-11#Artikel13
  - number: '14'
    text: |-
      Aan een gebruiker worden op zijn verzoek uit het nummerregister de inlichtingen verstrekt, die hij nodig heeft in
      verband met het gebruik van een burgerservicenummer.
    url: https://wetten.overheid.nl/BWBR0022428/2025-11-11#Artikel14
  - number: '15'
    text: |-
      1 Aan een overheidsorgaan worden in verband met de uitvoering van [artikel 12][ref1] op zijn verzoek uit de
      registraties, bedoeld in [artikel 3, eerste lid, onder d][ref2], de gegevens verstrekt, die hij nodig heeft
      teneinde na te gaan:

      a. of aan een bepaalde persoon reeds een burgerservicenummer is toegekend en zo ja, welk burgerservicenummer;

      b. aan welke persoon een bepaald burgerservicenummer is toegekend;

      c. of het Nederlandse document, met behulp waarvan een persoon zich identificeert, een document is als bedoeld in
      [artikel 1, eerste lid, onder 1°, 2° of 4°, van de Wet op de identificatieplicht][ref3].

      2 Met betrekking tot een gebruiker, niet zijnde een overheidsorgaan, is het eerste lid, aanhef en onder c, van
      overeenkomstige toepassing.

      3 Bij of krachtens de wet kunnen gevallen worden geregeld, waarin een gebruiker, niet zijnde een overheidsorgaan,
      in verband met de uitvoering van [artikel 12][ref4] bevoegd dan wel gehouden is een registratie als bedoeld in
      [artikel 3, eerste lid, onder d][ref5], te raadplegen teneinde na te gaan:

      a. of aan een bepaalde persoon reeds een burgerservicenummer is toegekend en zo ja, welk burgerservicenummer;

      b. aan welke persoon een bepaald burgerservicenummer is toegekend.

      4 In de gevallen, bedoeld in het derde lid, is het eerste lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0022428#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0022428#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0022428#Artikel3
