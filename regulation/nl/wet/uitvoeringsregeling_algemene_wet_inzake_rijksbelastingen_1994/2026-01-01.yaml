  - number: '1.2'
    text: |-
      Deze regeling verstaat onder de wet: de [Algemene wet inzake rijksbelastingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: 1a.1
    text: 'Een instelling wordt door de inspecteur aangemerkt als een algemeen nut beogende instelling indien en zolang:'
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1a
  - number: 1a.1.a
    text: |-
      uit de regelgeving en de feitelijke werkzaamheden van de instelling blijkt dat de instelling met het totaal van
      haar algemeen nuttige activiteiten geen winstoogmerk heeft;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1a
  - number: 1a.1.b
    text: |-
      uit de regelgeving en de feitelijke werkzaamheden van de instelling blijkt dat de instelling uitsluitend of
      nagenoeg uitsluitend het algemeen belang dient;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1a
  - number: 1a.1.c
    text: |-
      uit de regelgeving van de instelling en de feiten blijkt dat een natuurlijk persoon noch een rechtspersoon
      over het vermogen van de instelling kan beschikken als ware het zijn eigen vermogen, met dien verstande dat de
      inspecteur, zo nodig onder door hem te stellen voorwaarden, kan toestaan dat een steunstichting en de instelling of
      instellingen welke door deze stichting wordt ondersteund, onderscheidenlijk worden ondersteund, over en weer kunnen
      beschikken over elkaars vermogen als ware het eigen vermogen;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1a
  - number: 1a.1.d
    text: |-
      de instelling niet meer vermogen aanhoudt dan is aangegeven in [artikel 1b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel1b
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: 1b
        hoofdstuk: 1a
  - number: 1a.1.e
    text: |-
      de leden van het orgaan van de instelling dat het beleid bepaalt, ter zake van de door hen in die hoedanigheid voor
      de instelling verrichte werkzaamheden geen andere beloning ontvangen dan een vergoeding voor gemaakte onkosten en
      een niet-bovenmatig vacatiegeld;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1a
  - number: 1a.1.f
    text: |-
      de instelling beschikt over een actueel beleidsplan dat inzicht geeft in de door de instelling te verrichten
      werkzaamheden ter verwezenlijking van haar doelstelling, de wijze van werving van inkomsten, het beheer van het
      vermogen van de instelling en de besteding daarvan;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1a
  - number: 1a.1.g
    text: |-
      de beheerkosten van de instelling in redelijke verhouding staan tot de bestedingen ten behoeve van het doel van
      de instelling;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1a
  - number: 1a.1.h
    text: |-
      uit de regelgeving van de instelling blijkt dat bij opheffing van de instelling een batig liquidatiesaldo wordt
      besteed ten behoeve van een algemeen nut beogende instelling of van een buitenlandse instelling die uitsluitend
      of nagenoeg uitsluitend het algemeen nut beoogt maar indien het een culturele instelling als bedoeld in
      [artikel 1d][ref1] betreft, ten behoeve van een algemeen nut beogende instelling met een soortgelijke doelstelling
      of van een buitenlandse instelling die uitsluitend of nagenoeg uitsluitend het algemeen nut beoogt en die een
      soortgelijke doelstelling heeft;


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel1d
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: 1d
        hoofdstuk: 1a
  - number: 1a.1.i
    text: 'de administratie van de instelling zodanig is ingericht dat daaruit duidelijk blijkt:'
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1a
  - number: 1a.1.i.1°
    text: |-
      de aard en omvang van de aan de afzonderlijke leden van het orgaan van de instelling dat het beleid bepaalt
      toekomende onkostenvergoedingen en vacatiegelden;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1a
  - number: 1a.1.i.2°
    text: |-
      de aard en omvang van de kosten die door de instelling zijn gemaakt ten behoeve van het beheer van de instelling,
      alsmede de aard en omvang van de andere uitgaven van de instelling;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1a
  - number: 1a.1.i.3°
    text: de aard en omvang van de inkomsten van de instelling, en
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1a
  - number: 1a.1.i.4°
    text: de aard en omvang van het vermogen van de instelling, en
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1a
  - number: 1a.1.j
    text: de instelling via internet op elektronische wijze informatie met betrekking tot haar functioneren, openbaar maakt.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1a
  - number: 1a.2
    text: |-
      Een algemeen nut beogende instelling mag ter financiering van haar doelstelling commerciële activiteiten
      ontplooien, indien de inkomsten, zijnde het saldo van baten en lasten, gerealiseerd met die activiteiten, in
      overeenstemming met [artikel 1b][ref1], binnen een redelijke termijn geheel of nagenoeg geheel ten goede komen aan
      die doelstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel1b
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: 1b
        hoofdstuk: 1a
  - number: 1a.3
    text: |-
      De beschikking waarbij een instelling wordt aangemerkt als een algemeen nut beogende instelling kan terugwerken tot
      en met een voor dagtekening daarvan gelegen datum.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1a
  - number: 1a.4
    text: |-
      De inspecteur maakt het aanmerken van een instelling als een algemeen nut beogende instelling op een daartoe
      geschikte wijze publiek bekend. Het niet meer als zodanig aanmerken wordt ook op een daartoe geschikte wijze
      publiek bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1a
  - number: 1a.5
    text: |-
      Onder algemeen nuttige activiteiten worden voor de toepassing van dit artikel verstaan: alle activiteiten die
      erop zijn gericht om de doelstelling van een algemeen nut beogende instelling te verwezenlijken of te bevorderen.
      Activiteiten zijn geen algemeen nuttige activiteiten indien de instelling het geheel van die activiteiten tegen
      commerciële tarieven verricht.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1a
  - number: 1a.6
    text: |-
      Onder commerciële activiteiten worden voor de toepassing van dit artikel verstaan: het tegen commerciële tarieven
      verrichten van werkzaamheden of verlenen van diensten met het oogmerk hiermee ter financiering van de algemeen
      nuttige activiteiten van de instelling een positief resultaat te behalen.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1a
  - number: 1a.7
    text: 'De informatie, bedoeld in het eerste lid, onderdeel j, bestaat ten minste uit:'
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1a
  - number: 1a.7.a
    text: de naam van de instelling;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1a
  - number: 1a.7.b
    text: |-
      het nummer, bedoeld in [artikel 12, onderdeel a, van de Handelsregisterwet 2007][ref1], van de instelling, dan wel
      ingeval de instelling buiten Nederland is gevestigd, het voor deze regeling door de Nederlandse Belastingdienst
      verstrekte fiscale identificatienummer;


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel12
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '12'
  - number: 1a.7.c
    text: het post- of bezoekadres, dan wel het telefoonnummer, dan wel het e-mailadres van de instelling;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1a
  - number: 1a.7.d
    text: de doelstelling volgens de regelgeving van de instelling;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1a
  - number: 1a.7.e
    text: de hoofdlijnen van het actuele beleidsplan, bedoeld in het eerste lid, onderdeel f, van de instelling;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1a
  - number: 1a.7.f
    text: |-
      de bestuurssamenstelling, het beloningsbeleid van de instelling en de namen van de bestuurders, met uitzondering
      van:
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1a
  - number: 1a.7.f.1
    text: |-
      de namen van bestuurders van kerkgenootschappen alsmede hun zelfstandige onderdelen en lichamen waarin zij zijn
      verenigd, en
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1a
  - number: 1a.7.f.2
    text: |-
      de namen van bestuurders waarvoor de inspecteur op verzoek van de instelling ontheffing verleent omdat is
      aangetoond dat publicatie van deze namen een reëel gevaar oplevert voor de persoonlijke veiligheid van deze
      bestuurders of van hun familieleden;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1a
  - number: 1a.7.g
    text: een actueel verslag van de uitgeoefende activiteit of activiteiten van de instelling;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1a
  - number: 1a.7.h
    text: |-
      de balans en de staat van baten en lasten, met toelichting, van de instelling dan wel, indien het instellingen
      betreft die niet actief geld of goederen werven onder derden en die het aan hen ter beschikking staande vermogen
      of de opbrengsten daarvan uitsluitend of nagenoeg uitsluitend besteden ten behoeve van hun doelstelling (zuivere
      vermogensfondsen) of indien het kerkgenootschappen alsmede hun zelfstandige onderdelen en lichamen waarin zij zijn
      verenigd betreft, de staat van baten en lasten en een overzicht van de voorgenomen bestedingen, met toelichting.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1a
  - number: 1a.8
    text: |-
      De informatie, bedoeld in het eerste lid, onderdeel j, wordt openbaar gemaakt met gebruikmaking van een van de door
      de inspecteur vastgestelde standaardformulieren indien sprake is van een instelling:
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1a
  - number: 1a.8.a
    text: |-
      die in het betreffende boekjaar niet actief geld of goederen wierf onder derden en totale lasten had van ten minste
      € 100.000;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1a
  - number: 1a.8.b
    text: |-
      die in het betreffende boekjaar actief geld of goederen wierf onder derden en totale baten had van ten minste
      € 50.000.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1a
  - number: 1a.9
    text: |-
      De informatie, bedoeld in het zevende lid, onderdeel h, wordt telkens binnen zes maanden na afloop van het boekjaar
      openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1a
  - number: 1b.1
    text: |-
      Een algemeen nut beogende instelling houdt niet meer vermogen aan dan redelijkerwijs nodig is voor de continuïteit
      van de voorziene werkzaamheden ten behoeve van de doelstelling van de instelling.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1b
  - number: 1b.2
    text: |-
      Onder vermogen dat nodig is voor de continuïteit van de voorziene werkzaamheden als bedoeld in het eerste lid
      worden begrepen:
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1b
  - number: 1b.2.a
    text: |-
      vermogen of bestanddelen daarvan die krachtens uiterste wilsbeschikking of schenking door de instelling zijn
      verkregen, en die op grond van aan die uiterste wilsbeschikking of schenking verbonden voorwaarden, al dan niet in
      reële termen, in stand moeten worden gehouden;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1b
  - number: 1b.2.b
    text: vermogensbestanddelen voor zover de instandhouding daarvan voortvloeit uit de doelstelling van die instelling, en
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1b
  - number: 1b.2.c
    text: |-
      activa en voor de voorziene aanschaf van activa aangehouden vermogensbestanddelen, voor zover een instelling die
      activa redelijkerwijs nodig heeft ten behoeve van de doelstelling van de instelling.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1b
  - number: 1b.3
    text: |-
      De algemeen nut beogende instelling vermeldt in haar financiële administratie het doel waarvoor het vermogen wordt
      aangehouden, alsmede een motivering voor de omvang van dat vermogen.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1b
  - number: 1c
    text: |-
      Als staat als bedoeld in [artikel 5b, eerste lid, onderdeel d, onder 1° en 2°, van de wet][ref1] en als bedoeld
      in [artikel 5c, onderdeel d, van de wet][ref2] wordt aangewezen elke mogendheid waarmee in de relatie met Nederland
      voor de heffing van inkomstenbelasting, vennootschapsbelasting, schenkbelasting en erfbelasting zonder beperkingen
      of voorbehouden de uitwisseling is geregeld van gegevens, inlichtingen en gegevensdragers.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel5b
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel5c
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1c
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 5b
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 5c
  - number: 1d.1
    text: |-
      Een algemeen nut beogende instelling wordt door de inspecteur aangemerkt als een culturele instelling, indien
      en zolang uit de regelgeving en de feitelijke werkzaamheden van de instelling blijkt dat de instelling zich
      uitsluitend of nagenoeg uitsluitend richt op cultuur of cultuureducatie.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1d
  - number: 1d.2
    text: |-
      De beschikking waarbij een algemeen nut beogende instelling wordt aangemerkt als een culturele instelling kan
      terugwerken tot en met een voor dagtekening daarvan gelegen datum.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1d
  - number: 1d.3
    text: |-
      De inspecteur maakt het aanmerken van een instelling als een culturele instelling op een daartoe geschikte wijze
      publiek bekend. Het niet meer als zodanig aanmerken wordt ook op een daartoe geschikte wijze publiek bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1d
  - number: 1e.1
    text: |-
      Bij een verzoek een categorie instellingen dan wel een groep van met elkaar verbonden instellingen bij één voor
      bezwaar vatbare beschikking aan te merken als algemeen nut beogende instellingen of als culturele instellingen
      (gemeenschappelijke aanwijzing), wordt in het verzoek vermeld op welke instellingen het verzoek betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1e
  - number: 1e.2
    text: |-
      Een instelling waarop een verzoek om een gemeenschappelijke aanwijzing betrekking heeft maar die niet voldoet aan
      de voorwaarden voor aanmerking als algemeen nut beogende instelling, wordt niet in de gemeenschappelijke aanwijzing
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1e
  - number: 1e.3
    text: |-
      Een beschikking inzake een gemeenschappelijke aanwijzing kan met betrekking tot elk van de aldus aangemerkte
      instellingen afzonderlijk worden ingetrokken, met ingang van het tijdstip waarop die instelling niet meer voldoet
      aan de voorwaarden. Het intrekken van die beschikking kan terugwerken tot en met een voor dagtekening daarvan
      gelegen datum.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1e
  - number: 1f.1
    text: 'Een stichting kwalificeert als een steunstichting SBBI, indien en zolang:'
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1f
  - number: 1f.1.a
    text: 'uit haar statuten en feitelijke werkzaamheden blijkt:'
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1f
  - number: 1f.1.a.1°
    text: |-
      dat zij is opgericht uitsluitend met het doel om geld in te zamelen ter ondersteuning van een bepaalde sociaal
      belang behartigende instelling die lid is van een landelijke, representatieve koepel op het gebied van sport of
      muziek;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1f
  - number: 1f.1.a.2°
    text: |-
      dat het ingezamelde geld uitsluitend bestemd is voor een bijzondere investering of uitgave ter gelegenheid van de
      viering door die instelling van haar 5-jarig bestaan of een veelvoud daarvan;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1f
  - number: 1f.1.a.3°
    text: de wijze waarop invulling wordt gegeven aan de onder 2° bedoelde viering;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1f
  - number: 1f.1.a.4°
    text: |-
      dat de leden van het orgaan van de stichting dat het beleid bepaalt, ter zake van de door hen in die hoedanigheid
      voor de stichting verrichte werkzaamheden geen andere beloning ontvangen dan een vergoeding voor gemaakte onkosten
      en een niet-bovenmatig vacatiegeld;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1f
  - number: 1f.1.a.5°
    text: |-
      dat de stichting het voor de in de onder 2° bedoelde viering ingezamelde geld besteedt in het kalenderjaar van de
      bedoelde viering, het daaraan voorafgaande kalenderjaar of uiterlijk in het kalenderjaar erna;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1f
  - number: 1f.1.a.6°
    text: |-
      dat bij opheffing van de stichting een batig liquidatiesaldo wordt besteed ten behoeve van een algemeen nut
      beogende instelling, en
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1f
  - number: 1f.1.a.7°
    text: het kalenderjaar dat zij als steunstichting SBBI wil kwalificeren;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1f
  - number: 1f.1.b
    text: 'de administratie van de stichting zodanig is ingericht dat daaruit blijkt:'
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1f
  - number: 1f.1.b.1°
    text: |-
      de aard en omvang van de aan de afzonderlijke leden van het orgaan van de stichting dat het beleid bepaalt
      toekomende onkostenvergoedingen en vacatiegelden, en
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1f
  - number: 1f.1.b.2°
    text: |-
      de aard en omvang van de kosten die door de stichting zijn gemaakt ten behoeve van het beheer van de stichting,
      alsmede de aard en omvang van de uitgaven van de stichting ten behoeve van de in onderdeel a, onder 2°, bedoelde
      viering.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1f
  - number: 1f.2
    text: |-
      Bij de geldinzameling door de stichting wordt duidelijk aangegeven wat het doel is van de inzameling, alsmede wat
      het in het eerste lid, onderdeel a, onder 7°, bedoelde jaar is.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1f
  - number: 1f.3
    text: |-
      Per sociaal belang behartigende instelling kan slechts één stichting per viering als bedoeld in het eerste lid,
      onderdeel a, onder 2°, als steunstichting SBBI kwalificeren.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1f
  - number: 1f.4
    text: De inspecteur maakt het bestaan van een steunstichting SBBI op een daartoe geschikte wijze publiek bekend.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel1f
  - number: '2.1'
    text: |-
      Met betrekking tot belastingen welke bij wege van aanslag worden geheven, is de belastingplichtige die niet
      binnen zes maanden na het tijdstip waarop de belastingschuld is ontstaan is uitgenodigd tot het doen van aangifte,
      gehouden de inspecteur om uitnodiging tot het doen van aangifte te verzoeken.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel2
  - number: '2.2'
    text: |-
      In afwijking van het eerste lid is, met betrekking tot de erfbelasting, de belastingplichtige die niet binnen de
      in [artikel 45 van de Successiewet 1956][ref1] bedoelde termijn van twintig maanden is uitgenodigd tot het doen van
      aangifte, gehouden de inspecteur om uitnodiging tot het doen van aangifte te verzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel45
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '45'
  - number: '2.3'
    text: |-
      In afwijking van het eerste lid is, met betrekking tot de schenkbelasting, de belastingplichtige begiftigde,
      alsmede de schenker die de belastbare schenking heeft gedaan, die niet binnen twee maanden na het einde van
      het kalenderjaar waarin de schenking heeft plaatsgevonden is uitgenodigd tot het doen van aangifte, gehouden de
      inspecteur om uitnodiging tot het doen van aangifte te verzoeken.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel2
  - number: '2.4'
    text: |-
      Het verzoek wordt ingediend binnen twee weken na het verstrijken van de in het eerste, tweede en derde lid bedoelde
      tijdvakken.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel2
  - number: '2.5'
    text: |-
      Voor de toepassing van het eerste lid wordt een belastingschuld waarvan de grootte eerst kan worden vastgesteld
      na afloop van het tijdvak waarover de belasting wordt geheven, geacht te zijn ontstaan op het tijdstip waarop dat
      tijdvak of de belastingplicht eindigt.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel2
  - number: '2.6'
    text: |-
      Het eerste lid is niet van toepassing, indien over het tijdvak waarover de belasting wordt geheven reeds een
      aanslag is opgelegd, dan wel redelijkerwijs moet worden aangenomen dat over dat tijdvak, na verrekening van
      voorheffingen, geen belasting verschuldigd is, geen aanslag zal worden opgelegd of uitsluitend op grond van
      [artikel 9.4, eerste lid, onderdelen c of d, van de Wet inkomstenbelasting 2001][ref1] een aanslag zal worden
      opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel9
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '9'
  - number: '3.1'
    text: |-
      Met betrekking tot de belastingen welke op aangifte moeten worden voldaan of afgedragen, is de belastingplichtige,
      onderscheidenlijk de inhoudingsplichtige, die niet reeds is uitgenodigd tot het doen van aangifte, gehouden vóór
      het tijdstip waarop de belasting moet worden betaald, de inspecteur om uitnodiging tot het doen van aangifte te
      verzoeken.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel3
  - number: '3.2'
    text: |-
      De belastingplichtige die niet reeds is uitgenodigd tot het doen van aangifte en een teruggaaf van omzetbelasting
      wenst, is gehouden de inspecteur om uitnodiging tot het doen van aangifte te verzoeken binnen zes maanden na afloop
      van het kalenderjaar waarin het recht op teruggaaf is ontstaan.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel3
  - number: '3.3'
    text: |-
      Een rechtspersoon als bedoeld in
      [artikel 4, eerste lid, onderdeel a, van de Wet op belastingen van rechtsverkeer][ref1], die weet of redelijkerwijs
      moet vermoeden dat een verkrijging van aandelen in die rechtspersoon heeft plaatsgehad onder de in die bepaling
      genoemde omstandigheden, is gehouden vóór het tijdstip waarop de belasting ter zake van die verkrijging moet worden
      betaald, de inspecteur om uitnodiging tot het doen van aangifte te verzoeken, zo de rechtspersoon niet reeds met
      het oog op die verkrijging is uitgenodigd tot het doen van aangifte.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel4
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '4'
  - number: '3.4'
    text: |-
      Een vereniging als bedoeld in [artikel 4, eerste lid, onderdeel b, van de Wet op belastingen van rechtsverkeer][ref1],
      die voor een bepaald kalenderjaar niet reeds is uitgenodigd tot het doen van aangifte, is gehouden binnen veertien
      dagen na afloop daarvan de inspecteur om uitnodiging tot het doen van aangifte te verzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel4
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '4'
  - number: '3.5'
    text: |-
      Indien ter zake van een verkrijging van goederen als bedoeld in
      [artikel 4, eerste lid, onderdeel a, van de Wet op belastingen van rechtsverkeer][ref1] of van andere goederen
      waarvan geen notariële akte is opgemaakt een vrijstelling van overdrachtsbelasting wordt toegepast, is de
      verkrijger gehouden om binnen een maand na die verkrijging de inspecteur om uitnodiging tot het doen van aangifte
      te verzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel4
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '4'
  - number: '4'
    text: |-
      De in de [artikelen 2][ref1] en [3][ref2] omschreven verplichtingen gelden mede voor de in de [artikelen 43][ref3]
      en [44 van de wet][ref4] bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006736#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel43
      [ref4]: https://wetten.overheid.nl/BWBR0002740#Artikel44
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0006736
        artikel: '3'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '43'
      - id: ref4
        bwb_id: BWBR0002740
        artikel: '44'
  - number: 4a
    text: |-
      Het uitnodigen tot het doen van aangifte geschiedt door het uitreiken of toezenden van een aangiftebrief waaruit
      blijkt de wijze van het doen van aangifte, een omschrijving van de gevraagde gegevens of bescheiden en de termijn
      waarbinnen aangifte moet worden gedaan.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel4a
  - number: '20'
    text: |-
      Aangifte wordt gedaan door het op de in de aangiftebrief, bedoeld in [artikel 4a][ref1], aangegeven wijze,
      inleveren of toezenden van de gevraagde gegevens of bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel4a
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: 4a
        hoofdstuk: '3'
  - number: 20a
    text: |-
      De Belastingdienst kan ondersteuning verlenen bij het voldoen aan uit de belastingwet voortvloeiende verplichtingen
      van particuliere belastingplichtigen. Deze ondersteuning vindt plaats in het algemeen belang als bedoeld
      in [artikel 25h, vijfde lid, van de Mededingingswet][ref1]. Onder ondersteuning bij het voldoen aan uit de
      belastingwet voortvloeiende verplichtingen wordt in elk geval verstaan:


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel25h
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 25h
  - number: 20a.a
    text: |-
      het ter beschikking stellen van middelen voor het doen van aangifte of voor het elektronisch indienen en
      ondertekenen van aangiften, en
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel20a
  - number: 20a.b
    text: |-
      het ondersteunen, onder meer met de in onderdeel a bedoelde middelen, van partijen die, hulp bieden bij het voldoen
      aan uit de belastingwet voortvloeiende verplichtingen, voor zover die partijen geen vergoeding vragen voor het
      bieden van die hulp.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel20a
  - number: 21a
    text: |-
      Met betrekking tot de overdrachtsbelasting ter zake van een verkrijging van andere goederen dan de goederen,
      bedoeld in [artikel 4, eerste lid, onderdeel a, van de Wet op belastingen van rechtsverkeer][ref1],
      waarvan een notariële akte is opgemaakt, wordt door de notaris namens de verkrijger aangifte
      gedaan, door het aanbieden ter registratie van de akte en het aanbieden van de gegevens, bedoeld in
      [artikel 4 van de Uitvoeringsregeling Registratiewet 1970][ref2], op de wijze, bedoeld in dat artikel. In de akte
      wordt tevens vermeld of in verband met de verkrijging van de onroerende zaak of zaken tevens een of meer roerende
      zaken zijn verkregen. Indien dat het geval is, wordt in de akte voorts vermeld voor welk totaalbedrag deze roerende
      zaak of zaken werd of werden verkregen en of dat bedrag is begrepen in de in de akte vermelde tegenprestatie voor
      de onroerende zaak of zaken. De in de vorige volzin bedoelde roerende zaak of zaken worden in de akte of in een
      annex die bij de minuut is opgemaakt opgenomen. De inspecteur kan de notaris om een kopie van de annex verzoeken.
      In de akte worden alle gegevens opgenomen waarvan kennisneming van belang is of kan zijn voor de heffing van de
      overdrachtsbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0034017#Artikel4
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0034017
        artikel: '4'
  - number: 21b
    text: |-
      Aan de verplichting, bedoeld in [artikel 54 van de Wet op belastingen van rechtsverkeer][ref1], wordt voldaan
      door het duidelijk, stellig en zonder voorbehoud invullen, ondertekenen en inleveren of toezenden van het door de
      inspecteur uitgereikte of toegezonden meldingsbiljet.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel54
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel21b
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '54'
  - number: 21c.1
    text: |-
      Het verzoek, bedoeld in [artikel 10 van de Wet op de dividendbelasting 1965][ref1], wordt gedaan binnen drie jaren
      na afloop van het kalenderjaar waarin de opbrengst ter beschikking is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002515#Artikel10
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel21c
    references:
      - id: ref1
        bwb_id: BWBR0002515
        artikel: '10'
  - number: 21c.2
    text: |-
      Het verzoek, bedoeld in [artikel 10a van de Wet op de dividendbelasting 1965][ref1], wordt door natuurlijke
      personen gedaan binnen vijf jaren na afloop van het kalenderjaar waarin de opbrengst ter beschikking is gesteld en
      door lichamen binnen drie jaren na afloop van het boekjaar waarin de opbrengst ter beschikking is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002515#Artikel10a
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel21c
    references:
      - id: ref1
        bwb_id: BWBR0002515
        artikel: 10a
  - number: 21c.3
    text: |-
      Het verzoek, bedoeld in het tweede lid, wordt slechts eenmaal per kalenderjaar of boekjaar na afloop van dat
      kalenderjaar, onderscheidenlijk boekjaar, gedaan.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel21c
  - number: '22'
    text: |-
      Van de verplichting de in de uitnodiging tot het doen van aangifte gevraagde gegevens en bescheiden en andere
      gegevensdragers of de inhoud daarvan in te leveren of toe te zenden, kan de inspecteur ontheffing verlenen
      ingeval degene die is uitgenodigd tot het doen van aangifte, op een binnen de door de inspecteur ingevolge
      [artikel 9, eerste tot en met derde lid, van de wet][ref1] gestelde termijn ingediend verzoek opnieuw is
      uitgenodigd tot het doen van aangifte.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel9
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '9'
  - number: '23.1'
    text: |-
      De inspecteur legt een voorlopige aanslag op, indien het bedrag waarop de aanslag vermoedelijk zal worden
      vastgesteld, na verrekening van voorheffingen en reeds opgelegde voorlopige aanslagen, zulks naar zijn mening
      rechtvaardigt.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel23
  - number: '23.2'
    text: |-
      De bepaling van het bedrag van een voorlopige aanslag is een schatting. Voor de inkomstenbelasting kan deze
      schatting worden gedaan op grond van de gegevens die hebben gediend ter vaststelling van de meest recente
      belastingaanslag over het meest recente belastingjaar. Voor de vennootschapsbelasting kan deze schatting worden
      gedaan op grond van het gemiddelde van de gegevens die hebben gediend ter vaststelling van de meest recente
      belastingaanslagen over de twee meest recente belastingjaren. De inspecteur houdt zo veel mogelijk rekening met
      wijzigingen in de wettelijke bepalingen betreffende de heffing van belasting en met andere wijzigingen die voor de
      heffing van belasting van belang kunnen zijn. Indien:
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel23
  - number: 23.2.a
    text: |-
      een wijziging als bedoeld in de vierde volzin niet, niet tijdig, niet juist of niet volledig in de automatisering
      is of kan worden doorgevoerd waardoor hiermee bij de vaststelling van de voorlopige aanslag geen of niet op de
      juiste wijze rekening is gehouden; en
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel23
  - number: 23.2.b
    text: |-
      het bedrag van de voorlopige aanslag niet aanmerkelijk afwijkt van het bedrag waarop de aanslag vermoedelijk zal
      worden vastgesteld, na verrekening van voorheffingen en reeds opgelegde voorlopige aanslagen;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel23
  - number: '23.3'
    text: |-
      De voorlopige aanslag van een fiscale eenheid als bedoeld in
      [artikel 15 van de Wet op de vennootschapsbelasting 1969][ref1], wordt, over het jaar waarin het voegingstijdstip
      valt, alsmede die over het daaropvolgende jaar, vastgesteld alsof de moedermaatschappij en de dochtermaatschappij
      gedurende de twee voorafgaande jaren reeds verenigd waren.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '15'
  - number: '24'
    text: |-
      Indien een voorlopige aanslag inkomstenbelasting is of zal worden vastgesteld en een relevante wijziging
      optreedt in de omstandigheden die van belang zijn voor de opgelegde of op te leggen voorlopige aanslag,
      doet de belastingplichtige daarvan zo spoedig mogelijk op de door de inspecteur aangewezen wijze
      mededeling aan de inspecteur. Deze mededeling wordt geacht een verzoek om herziening als bedoeld in
      [artikel 9.5, eerste lid, van de Wet inkomstenbelasting 2001][ref1] te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel9
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '9'
  - number: '25.1'
    text: |-
      Het tijdvak waarover de omzetbelasting, de vliegbelasting, de belasting van personenauto’s en motorrijwielen en de
      assurantiebelasting moeten worden betaald, is het kalenderkwartaal of, indien de inspecteur zulks vordert, dan wel
      de belastingplichtige over een kalendermaand aangifte doet, de kalendermaand.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel25
  - number: '25.2'
    text: |-
      Ten aanzien van de belastingplichtige met een boekjaar van twaalf maanden dat niet samenvalt met het kalenderjaar,
      treden de boekjaarkwartalen en de boekjaarmaanden in de plaats van de kalenderkwartalen, onderscheidenlijk de
      kalendermaanden.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel25
  - number: '25.3'
    text: |-
      In bijzondere gevallen kan de inspecteur een ander tijdvak dan een kwartaal of een maand aanwijzen als tijdvak
      waarover de in het eerste lid bedoelde belastingen moeten worden betaald.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel25
  - number: '25.4'
    text: |-
      Het tijdvak waarover de in het eerste lid bedoelde belastingen moeten worden betaald, wordt ten aanzien van
      degene die op enig tijdstip - anders dan tijdelijk - ophoudt belastingplichtige te zijn, vervangen door het op dat
      tijdstip verstreken gedeelte van dat tijdvak.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel25
  - number: '26.1'
    text: |-
      Het tijdvak waarover de accijnzen, de verbruiksbelastingen van alcoholvrije
      dranken, de kansspelbelasting geheven van een belastingplichtige als bedoeld in
      [artikel 1, onderdelen a tot en met f, van de Wet op de kansspelbelasting][ref1], de belasting op leidingwater, de
      afvalstoffenbelasting, de kolenbelasting en de energiebelasting moeten worden betaald, is de kalendermaand.


      [ref1]: https://wetten.overheid.nl/BWBR0002359#Artikel1
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002359
        artikel: '1'
  - number: '26.2'
    text: |-
      Ten aanzien van de belastingplichtige met een boekjaar van twaalf maanden dat niet samenvalt met het kalenderjaar,
      treden de boekjaarmaanden in de plaats van de kalendermaanden.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel26
  - number: '26.3'
    text: |-
      In afwijking van het eerste lid is het tijdvak waarover de kansspelbelasting geheven de houder van een vergunning
      als bedoeld in [artikel 1, onderdelen a, b, d, e en f, van de Wet op de kansspelbelasting][ref1] moet worden
      betaald het kalenderkwartaal, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002359#Artikel1
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002359
        artikel: '1'
  - number: 26.3.a
    text: |-
      de betaalde kansspelbelasting in de aan het kalenderjaar voorafgaande twee kalenderjaren per kwartaal gemiddeld
      niet meer heeft bedragen dan € 15.000; en
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel26
  - number: 26.3.b
    text: |-
      aan de belastingplichtige in de aan het kalenderjaar voorafgaande twee kalenderjaren niet meer dan twee
      naheffingaanslagen kansspelbelasting zijn opgelegd.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel26
  - number: '26.5'
    text: |-
      In bijzondere gevallen kan de inspecteur een ander tijdvak dan de kalendermaand aanwijzen als tijdvak waarover de
      in het eerste lid bedoelde belastingen moeten worden betaald.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel26
  - number: '26.6'
    text: |-
      Het tijdvak waarover de in het eerste lid bedoelde belastingen moeten worden betaald, wordt ten aanzien van
      degene die op enig tijdstip - anders dan tijdelijk - ophoudt belastingplichtige te zijn, vervangen door het op dat
      tijdstip verstreken gedeelte van dat tijdvak.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel26
  - number: '27.1'
    text: |-
      Het tijdvak waarover de bronbelasting, de minimum CO-prijs elektriciteitsopwekking, de CO-heffing industrie en de
      CO-heffing glastuinbouw moeten worden betaald, is het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel27
  - number: '27.2'
    text: |-
      Het tijdvak waarover de bronbelasting moet worden betaald, wordt ten aanzien van degene die op enig tijdstip –
      anders dan tijdelijk – ophoudt inhoudingsplichtige te zijn, vervangen door het op dat tijdstip verstreken gedeelte
      van dat tijdvak.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel27
  - number: 27a
    text: |-
      Het tijdvak waarover de solidariteitsbijdrage moet worden betaald, is gelijk aan het bijdragejaar bedoeld in
      [artikel 1.2, eerste lid, onderdeel a, van de Wet tijdelijke solidariteitsbijdrage][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0047704#Artikel1
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0047704
        artikel: '1'
  - number: '28.1'
    text: |-
      Het tijdvak waarover de loonbelasting moet worden betaald is de kalendermaand of periode van vier aaneengesloten
      weken. De inspecteur deelt aan de inhoudingsplichtige mee welk tijdvak voor hem in een kalenderjaar van toepassing
      is.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel28
  - number: '28.2'
    text: |-
      Bij een tijdvak van vier aaneengesloten weken vangt het eerste tijdvak van het kalenderjaar aan op de maandag
      voorafgaande aan de eerste donderdag van het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel28
  - number: '28.3'
    text: Bij een tijdvak van vier aaneengesloten weken bevat het kalenderjaar maximaal 13 tijdvakken.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel28
  - number: '28.4'
    text: 'Bij een tijdvak van vier aaneengesloten weken geldt, in zoverre in afwijking van het tweede lid, dat:'
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel28
  - number: 28.4.a
    text: |-
      ingeval het eerste tijdvak van het kalenderjaar aanvangt na 1 januari van het kalenderjaar, de periode vanaf
      1 januari tot de aanvang van het eerste tijdvak wordt toegevoegd aan dat eerste tijdvak;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel28
  - number: 28.4.b
    text: |-
      ingeval het laatste tijdvak van het kalenderjaar eindigt voor 31 december van het kalenderjaar, de periode na het
      einde van het laatste tijdvak tot en met 31 december van het kalenderjaar wordt toegevoegd aan dat laatste tijdvak;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel28
  - number: 28.4.c
    text: |-
      ingeval het eerste tijdvak van het kalenderjaar aanvangt in het vorige kalenderjaar, de periode tot en met
      31 december van het vorige kalenderjaar wordt toegevoegd aan het laatste tijdvak van het vorige kalenderjaar;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel28
  - number: 28.4.d
    text: |-
      ingeval het laatste tijdvak van het kalenderjaar eindigt in het volgende kalenderjaar, de periode vanaf 1 januari
      van het volgende kalenderjaar wordt toegevoegd aan het eerste tijdvak van het volgende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel28
  - number: '28.5'
    text: |-
      Het tijdvak waarover de loonbelasting moet worden betaald, wordt ten aanzien van degene die op enig tijdstip –
        anders dan tijdelijk – ophoudt inhoudingsplichtige te zijn, vervangen door het op dat tijdstip verstreken gedeelte
      van dat tijdvak.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel28
  - number: '29'
    text: |-
      In afwijking van [artikel 28, eerste lid][ref1], is het tijdvak waarover de loonbelasting moet worden betaald:


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel28
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: '28'
        hoofdstuk: '6'
  - number: 29.a
    text: |-
      voor de zelfstandige binnenschipper die woonplaats heeft gekozen ingevolge
      [artikel 1, eerste lid, van het Uitvoeringsbesluit Algemene wet inzake rijksbelastingen 1964][ref1]: het
      kalenderhalfjaar, tenzij de inspecteur vordert dat [artikel 28][ref2] ten aanzien van deze binnenschipper van
      toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0002473#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006736#Artikel28
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002473
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006736
        artikel: '28'
        hoofdstuk: '6'
  - number: 29.b
    text: |-
      voor de natuurlijke persoon ter zake van de loonbelasting van de werknemer die uitsluitend of nagenoeg uitsluitend
      diensten verricht ten behoeve van diens huishouden, daaronder begrepen het verlenen van zorg aan de leden van dat
      huishouden: het kalenderjaar;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel29
  - number: 29.c
    text: |-
      voor de ouder ter zake van de loonbelasting van zijn in zijn onderneming werkzame kinderen voorzover de belasting
      is geheven door inhouding volgens [artikel 27, zesde lid, van de Wet op de loonbelasting 1964][ref1]: het
      kalenderjaar;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel27
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '27'
  - number: 29.d
    text: |-
      voor de natuurlijke persoon ter zake van de loonbelasting van de werknemer die
      uitsluitend diensten verricht in het kader van voorzieningen als bedoeld in
      [artikel 35, tweede lid, onderdelen b en d, van de Wet werk en inkomen naar arbeidsvermogen][ref1]: het
      kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel35
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '35'
  - number: '30.1'
    text: |-
      De inspecteur verleent op verzoek van de belastingplichtige, onderscheidenlijk de inhoudingsplichtige, uitstel
      van betaling van loonbelasting of omzetbelasting over een tijdvak, indien met betrekking tot dat tijdvak, dan wel
      een tijdvak dat is geëindigd vóór of tegelijk met dat tijdvak, door die belastingplichtige, onderscheidenlijk die
      inhoudingsplichtige, een verzoek om teruggaaf van omzetbelasting is gedaan vanwege het feit dat de verschuldigde
      omzetbelasting minder beloopt dan de voor aftrek in aanmerking komende omzetbelasting. Ingeval loonbelasting moet
      worden betaald over een tijdvak van vier weken dat niet aan het einde van een kalendermaand eindigt, wordt voor de
      toepassing van de eerste volzin:
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel30
  - number: 30.1.a
    text: dat tijdvak geacht te zijn geëindigd aan het einde van de kalendermaand waarin het tijdvak is geëindigd;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel30
  - number: 30.1.b
    text: |-
      het twaalfde tijdvak van het kalenderjaar, in afwijking van onderdeel a, geacht te zijn geëindigd aan het einde van
      het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel30
  - number: '30.2'
    text: Uitstel wordt slechts verleend tot het beloop van de teruggaaf omzetbelasting.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel30
  - number: '30.3'
    text: 'Uitstel wordt niet verleend indien:'
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel30
  - number: 30.3.a
    text: de aangifte waarvan uitstel wordt verzocht niet tijdig is gedaan;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel30
  - number: 30.3.b
    text: het verzoek niet uiterlijk gelijktijdig met de in onderdeel a bedoelde aangifte is gedaan;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel30
  - number: 30.3.c
    text: |-
      het verzoek niet mede bevat een machtiging aan de ontvanger om de teruggaaf omzetbelasting aan te wenden voor de
      betaling op de aangifte waarvan uitstel wordt verzocht; of
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel30
  - number: 30.3.d
    text: |-
      de teruggaaf omzetbelasting op de voet van [artikel 24 van de Invorderingswet 1990][ref1] kan worden verrekend met
      onherroepelijk vaststaande belastingaanslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel24
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '24'
  - number: '30.4'
    text: |-
      Indien degene die het verzoek om uitstel doet een dochtermaatschappij, onderscheidenlijk een
      moedermaatschappij is met betrekking tot welke vennootschapsbelasting wordt geheven met toepassing van
      [artikel 15 van de Wet op de vennootschapsbelasting 1969][ref1], is het eerste lid eveneens van toepassing
      indien het verzoek om teruggaaf van omzetbelasting is gedaan door de moedermaatschappij, dan wel door een andere
      dochtermaatschappij die voor de heffing van vennootschapsbelasting in deze is opgegaan, onderscheidenlijk door
      een dochtermaatschappij.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '15'
  - number: 30a
    text: |-
      De inspecteur bepaalt zo spoedig mogelijk doch binnen vijf werkdagen na de ontvangst van een terugmelding als
      bedoeld in [artikel 21d, eerste lid, onderdeel a, van de wet][ref1] of het ontstaan van een situatie als bedoeld
      in [artikel 21d, eerste lid, onderdeel d, van de wet][ref2], of de aantekening ‘in onderzoek’ al dan niet wordt
      geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel21d
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel21d
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 21d
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 21d
  - number: 30b
    text: |-
      De inspecteur vermindert ambtshalve een inkomensgegeven dat op een te hoog bedrag is bepaald zodra hem dat is
      gebleken, tenzij:
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel30b
  - number: 30b.a
    text: vijf jaren zijn verlopen na het einde van het kalenderjaar waarop het inkomensgegeven betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel30b
  - number: 30b.b
    text: |-
      de onjuistheid van het inkomensgegeven voortvloeit uit jurisprudentie die eerst is gewezen nadat de met het
      inkomensgegeven samenhangende inkomstenbelasting- of loonbelastingschuld onherroepelijk vast is komen te staan,
      tenzij de Minister van Financiën anders heeft bepaald;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel30b
  - number: 30b.c
    text: |-
      de onjuistheid van het inkomensgegeven voortvloeit uit beleidsregels van de Minister van Financiën die eerst
      zijn uitgevaardigd nadat de met het inkomensgegeven samenhangende inkomstenbelasting- of loonbelastingschuld
      onherroepelijk vast is komen te staan, tenzij de Minister van Financiën anders heeft bepaald;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel30b
  - number: 30b.d
    text: |-
      de onjuistheid van het inkomensgegeven voortvloeit uit de omstandigheid dat eerst nadat de met het inkomensgegeven
      samenhangende inkomstenbelasting- of loonbelastingschuld onherroepelijk vast is komen te staan een beroep wordt
      gedaan op een fiscale faciliteit, waarop een beroep moet worden gedaan bij de aangifte of op een ander wettelijk
      voorgeschreven moment; of
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel30b
  - number: 30b.e
    text: |-
      sprake is van enig feit waardoor het inkomensgegeven op een te hoog bedrag is bepaald en enig ander
      inkomensgegeven, al dan niet van dezelfde betrokkene, ter zake van datzelfde feit op een te laag bedrag is bepaald,
      met dien verstande dat in dat geval wel ambtshalve vermindering plaatsvindt voor zover de met het laatstgenoemde
      inkomensgegeven samenhangende inkomstenbelasting of loonbelasting is of kan worden geheven.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel30b
  - number: '31.1'
    text: |-
      Bij de bepaling van het aantal dagen waarover ingevolge hoofdstuk VA van de wet belastingrente wordt berekend,
      wordt een volle kalendermaand gesteld op 30 dagen, met uitzondering van de maand op de laatste dag waarvan het
      tijdvak waarover de rente wordt berekend eindigt, in welk geval het werkelijke aantal dagen in aanmerking wordt
      genomen.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel31
  - number: '31.2'
    text: Het bedrag van de in rekening te brengen belastingrente wordt naar beneden afgerond op gehele euro’s.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel31
  - number: '31.3'
    text: Het bedrag van de te vergoeden belastingrente wordt naar boven afgerond op gehele euro’s.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel31
  - number: 31bis.1
    text: |-
      Voor de toepassing van [artikel 30ia, derde lid, onderdeel a, van de wet][ref1] wordt het te betalen bedrag aan
      belasting of een gedeelte daarvan geacht reeds te zijn geheven, dan wel op aangifte te zijn voldaan of afgedragen,
      in de situaties waarin:


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel30ia
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel31bis
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 30ia
  - number: 31bis.1.a
    text: |-
      tussen partners als bedoeld in [artikel 1.2 van de Wet inkomstenbelasting 2001][ref1] een vermindering van de
      belastingaanslag van de ene partner leidt tot een teruggaaf van inkomstenbelasting en voor de andere partner tot
      een daarmee samenhangende belastingaanslag met een te betalen bedrag aan belasting waarover belastingrente in
      rekening wordt gebracht, terwijl het te betalen bedrag aan belasting, onderscheidenlijk een gedeelte daarvan, tot
      het moment van teruggaaf aan een van de partners geacht kan worden reeds te zijn geheven;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel1
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel31bis
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '1'
  - number: 31bis.1.b
    text: |-
      een wijziging plaatsvindt in een verkrijging krachtens erfrecht als bedoeld in
      [artikel 1, eerste lid, onder 1°, van de Successiewet 1956][ref1], of ten gevolge van de verdeling van
      de nalatenschap een wijzing plaatsvindt in de gerechtigdheid tot het ondernemingsvermogen als bedoeld in
      [artikel 35f van de Successiewet 1956][ref2], waarbij een verkrijger een teruggaaf van erfbelasting ontvangt en
      een andere verkrijger een daarmee samenhangende belastingaanslag met een te betalen bedrag aan belasting waarover
      belastingrente in rekening wordt gebracht, terwijl het te betalen bedrag aan belasting, onderscheidenlijk een
      gedeelte daarvan, tot het moment van teruggaaf aan een van de verkrijgers geacht kan worden reeds te zijn geheven;


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002226#Artikel35f
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel31bis
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002226
        artikel: 35f
  - number: 31bis.1.c
    text: |-
      een bedrag aan omzetbelasting ten onrechte in aftrek is gebracht waarna een naheffingsaanslag omzetbelasting met
      een te betalen bedrag aan belastingrente volgt, terwijl in plaats van die aftrek of een gedeelte daarvan, recht
      bestond op een bijdrage als bedoeld in de [Wet op het BTW-compensatiefonds][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013817
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel31bis
    references:
      - id: ref1
        bwb_id: BWBR0013817
  - number: 31bis.1.d
    text: |-
      ten onrechte een bijdrage als bedoeld in de [Wet op het BTW-compensatiefonds][ref1] is ontvangen waarna
      een beschikking als bedoeld in [artikel 9, vierde lid, van die wet][ref2] met een te betalen bedrag aan
      belastingrente volgt, terwijl in plaats van die bijdrage of een gedeelte daarvan, recht bestond op een teruggaaf
      van omzetbelasting;


      [ref1]: https://wetten.overheid.nl/BWBR0013817
      [ref2]: https://wetten.overheid.nl/BWBR0013817#Artikel9
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel31bis
    references:
      - id: ref1
        bwb_id: BWBR0013817
      - id: ref2
        bwb_id: BWBR0013817
        artikel: '9'
  - number: 31bis.1.e
    text: |-
      een bedrag aan overdrachtsbelasting is voldaan ten aanzien van de verkrijging van een onroerende zaak, terwijl ten
      aanzien van deze verkrijging ter zake van de levering van de onroerende zaak omzetbelasting voldaan had moeten zijn
      en de verkrijging vrijgesteld was van overdrachtsbelasting.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel31bis
  - number: 31bis.2
    text: |-
      Voor de toepassing van [artikel 30ia, derde lid, onderdeel b, van de wet][ref1] geldt dat indien sprake is van
      een verzoek aan de inspecteur om vermindering van belastingrente als bedoeld in artikel 30ia, eerste lid, van de
      wet bij dat verzoek op duidelijke en overzichtelijke wijze dient te zijn vermeld ten aanzien van welke periode
      sprake is van belastingrente die in rekening is gebracht terwijl het te betalen bedrag aan belasting reeds is
      geheven, dan wel op aangifte is voldaan of afgedragen. Het verzoek wordt op een door de inspecteur aangegeven wijze
      ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel30ia
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel31bis
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 30ia
  - number: 31bis.3
    text: |-
      Bij de vermelding van de periode, bedoeld in het tweede lid, maakt de verzoekende belastingplichtige
      aannemelijk dat hij in aanmerking komt voor de vermindering van belastingrente, bedoeld in
      [artikel 30ia, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel30ia
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel31bis
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 30ia
  - number: 31bis.4
    text: |-
      Het tweede en derde lid zijn van overeenkomstige toepassing als om de vermindering van belastingrente wordt
      verzocht via een bezwaar.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel31bis
  - number: 31bis.5
    text: |-
      Voor de toepassing van [artikel 30ia, derde lid, onderdeel c, van de wet][ref1] geldt dat indien sprake is
      van een verzoek aan de inspecteur om vermindering van belastingrente als bedoeld in artikel 30ia, eerste lid,
      van de wet de toepassing van artikel 30ia, eerste lid, van de wet achterwege blijft als het bedrag van de
      in rekening gebrachte belastingrente dat bij voor bezwaar vatbare beschikking is vastgesteld als bedoeld in
      [artikel 30j, eerste lid, van de wet][ref2], niet meer bedraagt dan € 100.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel30ia
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel30j
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel31bis
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 30ia
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 30j
  - number: 31a
    text: |-
      Voor de toepassing van [artikel 38, tweede lid, van de wet][ref1], worden van de staten die partij zijn bij de
      Overeenkomst betreffende de Europese Economische Ruimte aangewezen: IJsland, Noorwegen en Liechtenstein.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel38
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '38'
  - number: 31b
    text: 'Voor de toepassing van dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel31b
  - number: 31b.a
    text: |-
      *NAVO-Statusverdrag:* het op 19 juni 1951 te Londen tot stand gekomen Verdrag tussen de Staten die partij zijn bij
      het Noord-Atlantisch Verdrag, nopens de rechtspositie van hun krijgsmachten (Trb. 1951, 114);
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel31b
  - number: 31b.b
    text: |-
      *Hoofdkwartierenprotocol:* het op 28 augustus 1952 te Parijs tot stand gekomen Protocol bij het op 19 juni
      1951 te Londen gesloten Verdrag tussen de Staten die partij zijn bij het Noord-Atlantische Verdrag – nopens
      de rechtspositie van hun krijgsmachten – nopens de rechtspositie van internationale militaire hoofdkwartieren,
      ingesteld uit hoofde van het Noord-Atlantisch Verdrag (Trb. 1953, 11);
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel31b
  - number: 31b.c
    text: '*buitenlandse NAVO-strijdkrachten:*'
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel31b
  - number: 31b.c.1°
    text: |-
      in Nederland gelegerde buitenlandse land-, zee- of luchtstrijdkrachten van de Staten die partij zijn bij het op
      4 april 1949 te Washington tot stand gekomen Noord-Atlantisch Verdrag (Stb. 1949, J 355), het NAVO-Statusverdrag of
      het Hoofdkwartierenprotocol;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel31b
  - number: 31b.c.2°
    text: |-
      het Geallieerd Hoofdkwartier, bedoeld in artikel 1, aanhef en onderdeel c, van het Hoofdkwartierenprotocol, of
      bedoeld in artikel I, aanhef en onderdeel 3, van de op 25 mei 1964 te Parijs tot stand gekomen Overeenkomst tussen
      het Koninkrijk der Nederlanden en het Algemeen Hoofdkwartier van de Geallieerde Mogendheden in Europa ondertekende
      Overeenkomst inzake de bijzondere voorwaarden die toepasselijk zijn op de vestiging en het functioneren van
      internationale militaire hoofdkwartieren binnen het Europese grondgebied van het Koninkrijk der Nederlanden
      (Trb. 1964, 131);
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel31b
  - number: 31b.c.3°
    text: |-
      andere buitenlandse NAVO-onderdelen, voor zover het NAVO-Statusverdrag of het Hoofdkwartierenprotocol daarop van
      toepassing is;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel31b
  - number: 31b.d
    text: '*personeel van buitenlandse NAVO-strijdkrachten:*'
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel31b
  - number: 31b.d.1°
    text: |-
      een lid van de krijgsmacht als bedoeld in artikel I, eerste lid, aanhef en onderdeel a, van het NAVO-Statusverdrag
      of als bedoeld in artikel 3, eerste lid, onderdeel a, van het Hoofdkwartierenprotocol;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel31b
  - number: 31b.d.2°
    text: |-
      een lid van de civiele dienst als bedoeld in artikel I, eerste lid, aanhef en onderdeel b, van het NAVO-
      Statusverdrag of als bedoeld in artikel 3, eerste lid, aanhef en onderdeel b, van het Hoofdkwartierenprotocol;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel31b
  - number: 31b.e
    text: '*gezinslid:*'
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel31b
  - number: 31b.e.1°
    text: |-
      een inwonende persoon als bedoeld in artikel I, eerste lid, aanhef en onderdeel c, van het NAVO-Statusverdrag of
      als bedoeld in artikel 3, eerste lid, aanhef en onderdeel c, van het Hoofdkwartierenprotocol;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel31b
  - number: 31b.e.2°
    text: |-
      een niet-inwonend kind als bedoeld in artikel I, eerste lid, aanhef en onderdeel c, van het NAVO-Statusverdrag
      of als bedoeld in artikel 3, eerste lid, aanhef en onderdeel c, van het Hoofdkwartierenprotocol dat afhankelijk
      is van een lid van een krijgsmacht of civiele dienst voor zijn onderhoud, voor zover dat kind zich op Nederlands
      grondgebied bevindt;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel31b
  - number: 31b.e.3°
    text: |-
      een niet-inwonende partner als bedoeld in artikel I, eerste lid, aanhef en onderdeel c, van het NAVO-Statusverdrag
      of als bedoeld in artikel 3, eerste lid, aanhef en onderdeel c, van het Hoofdkwartierenprotocol, voor zover die
      partner zich op Nederlands grondgebied bevindt;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel31b
  - number: 31b.e.4°
    text: |-
      een persoon voor wie een NAVO-strijdkracht (Delegatieleider) verklaart dat deze de status heeft van ‘afgeleide
      NAVO-statusgerechtigde ’of ‘afgeleide Paris Protocol-gerechtigde’;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel31b
  - number: 31b.e.5°
    text: |-
      een partner als bedoeld in [artikel 5a van de Algemene wet inzake rijksbelastingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel5a
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel31b
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 5a
  - number: 31b.f
    text: '*commandant:* de bevoegde autoriteit van een buitenlandse NAVO-strijdkracht;'
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel31b
  - number: 31b.g
    text: |-
      *buitenlandse EU-strijdkrachten:* strijdkrachten van een andere lidstaat van de Europese Unie voor zover die
      in Nederland deelnemen aan een defensie-inspanning ter uitvoering van het gemeenschappelijk veiligheids- en
      defensiebeleid, bedoeld in titel V, hoofdstuk 2, afdeling 2, van het Verdrag betreffende de Europese Unie;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel31b
  - number: 31b.h
    text: '*personeel van buitenlandse EU-strijdkrachten:*'
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel31b
  - number: 31b.h.1
    text: een lid van een buitenlandse EU-strijdkracht;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel31b
  - number: 31b.h.2
    text: |-
      een lid van het begeleidend burgerpersoneel van een buitenlandse EU-strijdkracht voor zover dat lid in Nederland
      die strijdkracht begeleidt.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel31b
  - number: '32.1'
    text: |-
      Een op grond van [artikel 39 van de wet][ref1] te verlenen vrijstelling wordt:


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel39
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '39'
  - number: 32.1.a
    text: voorwaardelijk verleend;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel32
  - number: 32.1.b
    text: voor goederen of diensten verleend voor redelijke hoeveelheden.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel32
  - number: '32.2'
    text: |-
      Een in het eerste lid bedoelde vrijstelling vervalt wanneer niet of niet langer wordt voldaan aan de voorwaarden
      die voor de vrijstelling gelden. Aan de voorwaarden die voor een vrijstelling gelden, wordt in ieder geval niet
      voldaan wanneer een goed of de nutswaarde van een dienst ten aanzien waarvan vrijstelling is verleend, geheel of
      gedeeltelijk wordt gebruikt door of ten goede komt aan een ander dan degene ten behoeve van wie de vrijstelling
      is verleend. Indien een instelling of persoon niet langer aanspraak heeft op een in het eerste lid bedoelde
      vrijstelling, vervalt de vrijstelling voor in het verleden met vrijstelling aangeschafte goederen en diensten,
      voorzover het goed of het nut van de dienst geacht kan worden nog niet volledig te zijn verbruikt.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel32
  - number: '32.3'
    text: |-
      Wanneer een in het eerste lid bedoelde vrijstelling vervalt, is de belasting waarvan vrijstelling is verleend,
      verschuldigd door degene ten behoeve van wie de vrijstelling is verleend. De instelling of persoon wordt terzake
      aangemerkt als belastingplichtige. De verschuldigde belasting wordt berekend naar het tarief - en voorzover van
      toepassing de dagwaarde van het goed of de resterende nutswaarde van de dienst ten aanzien waarvan vrijstelling is
      verleend - op het moment dat de vrijstelling vervalt. Ingeval van oneigenlijk gebruik van een vrijstelling wordt de
      verschuldigde belasting vastgesteld op ten minste het bedrag waarvan vrijstelling werd verleend.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel32
  - number: '32.4'
    text: |-
      Een in het eerste lid bedoelde vrijstelling van omzetbelasting wordt verleend in de vorm van teruggaaf van
      betaalde belasting, tenzij anders is bepaald. Ingeval evenwel een prestatie wordt verricht aan een diplomatieke
      of consulaire vertegenwoordiging, een internationale organisatie of een militaire begraafplaats, kan de ondernemer
      die de prestatie verricht, ter zake van de omzetbelasting het tarief van nihil toepassen indien de instelling
      tijdig aan de ondernemer een geldige verklaring van de inspecteur ter beschikking stelt waaruit blijkt dat ter
      zake van die belasting het tarief van nihil kan worden toegepast. Op verzoek van de in de tweede volzin bedoelde
      instelling geeft de inspecteur deze verklaring af indien naar zijn oordeel aanspraak bestaat op vrijstelling van
      omzetbelasting en de vergoeding ten minste € 35.000 bedraagt.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel32
  - number: '32.5'
    text: |-
      De in het eerste lid bedoelde vrijstellingen van omzetbelasting en accijns met betrekking tot motorbrandstoffen
      bestemd voor officieel gebruik door een diplomatieke of consulaire vertegenwoordiging of een internationale
      organisatie, of bestemd voor persoonlijk gebruik door een lid of personeelslid van een dergelijke instelling worden
      slechts verleend indien voor het motorrijtuig een CD-kenteken is afgegeven, dan wel een BN/GN-kenteken in de serie
      70-00 tot en met 88-99. De vrijstellingen worden verleend in de vorm van teruggaaf van betaalde belasting.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel32
  - number: '32.6'
    text: |-
      Met inachtneming van hetgeen is bepaald in het eerste, tweede en derde lid wordt in gevallen waarin op grond van
      [artikel 39 van de wet][ref1] aanspraak bestaat op vrijstelling van belastingen bij invoer van een motorrijtuig
      mede een vrijstelling verleend van omzetbelasting bij levering dan wel intracommunautaire verwerving van een
      motorrijtuig. De vrijstelling wordt verleend bij wijze van toepassing van het tarief van nihil. De voorwaarden en
      beperkingen van de desbetreffende vrijstelling van belastingen bij invoer zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel39
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '39'
  - number: '32.7'
    text: |-
      Voor de in het vijfde lid bedoelde instellingen en personen zijn ter zake van een in het eerste
      lid bedoelde vrijstelling van omzetbelasting met betrekking tot motorbrandstoffen, vrijstelling van
      accijns en vrijstelling van belasting van personenauto's en motorrijwielen de voorwaarden van de
      [artikelen 7:8 tot en met 7:14 van de Algemene douaneregeling][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024291#Artikel7
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0024291
        artikel: '7'
  - number: '32.8'
    text: |-
      Op grond van [artikel 39 van de wet][ref1] wordt vrijstelling van omzetbelasting verleend ter zake van de levering
      van goederen aan of het verrichten van diensten voor de Europese Commissie of voor een krachtens het Unierecht
      opgericht agentschap of orgaan wanneer de Europese Commissie of een dergelijk agentschap of orgaan deze goederen of
      diensten aankoopt in het kader van de uitvoering van de hen bij het Unierecht toevertrouwde taken ter bestrijding
      van de COVID-19-pandemie, tenzij de aangekochte goederen en diensten onmiddellijk dan wel op een later tijdstip
      worden gebruikt voor latere leveringen onder bezwarende titel door de Commissie of door een dergelijk agentschap of
      orgaan. De vrijstelling wordt verleend bij wijze van toepassing van het tarief van nihil indien de afnemer tijdig
      aan de ondernemer die de prestatie verricht een geldige verklaring van de inspecteur ter beschikking stelt waaruit
      blijkt dat ter zake het tarief van nihil kan worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel39
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '39'
  - number: 32a.1
    text: |-
      In gevallen waarin op grond van [artikel 39 van de wet][ref1] een vrijstelling wordt verleend van omzetbelasting
      geheven ter zake van de levering van aardgas of elektriciteit, bestemd voor officieel gebruik door een diplomatieke
      of consulaire vertegenwoordiging, een internationale organisatie of een militaire begraafplaats, wordt mede een
      vrijstelling verleend van energiebelasting en opslag duurzame energie- en klimaattransitie.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel39
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '39'
  - number: 32a.2
    text: |-
      De vrijstelling van energiebelasting en opslag duurzame energie- en klimaattransitie wordt gerealiseerd door
      teruggaaf van in rekening gebrachte en betaalde belasting. De vrijstelling kan evenwel direct worden gerealiseerd
      indien degene die de levering verricht over een geldige verklaring van de inspecteur beschikt waaruit blijkt dat
      ter zake van de levering geen energiebelasting en opslag duurzame energie- en klimaattransitie in rekening hoeft
      te worden gebracht. [Artikel 32, vierde lid, tweede en derde zin][ref1], vindt alsdan ook toepassing bij een
      vergoeding die lager is dan € 35.000.


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel32
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: '32'
        hoofdstuk: '9'
  - number: 32a.3
    text: |-
      Een verzoek om teruggaaf van energiebelasting en opslag duurzame energie- en klimaattransitie wordt ingediend
      binnen dertien weken nadat de eindafrekening van het energiedistributiebedrijf is verzonden. Bij het verzoek om
      teruggaaf wordt de eindfactuur van het energiedistributiebedrijf overgelegd. Deze factuur wordt bij de beschikking
      op het verzoek om teruggaaf teruggezonden. [Artikel 91 van de Wet belastingen op milieugrondslag][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel91
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '91'
  - number: 32b.1
    text: |-
      In gevallen waarin op grond van [artikel 39 van de wet][ref1] een vrijstelling wordt verleend van omzetbelasting
      geheven ter zake van de levering van leidingwater, bestemd voor officieel gebruik door een diplomatieke of
      consulaire vertegenwoordiging, een internationale organisatie of een militaire begraafplaats, wordt mede een
      vrijstelling verleend van belasting op leidingwater.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel39
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '39'
  - number: 32b.2
    text: |-
      De vrijstelling van belasting op leidingwater wordt gerealiseerd door teruggaaf van in rekening gebrachte en
      betaalde belasting. De vrijstelling kan evenwel direct worden gerealiseerd indien degene die de levering verricht
      over een geldige verklaring van de inspecteur beschikt waaruit blijkt dat ter zake van de levering geen belasting
      op leidingwater in rekening hoeft te worden gebracht. [Artikel 32, vierde lid, tweede en derde zin][ref1], vindt
      alsdan ook toepassing bij een vergoeding die lager is dan € 35.000.


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel32
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: '32'
        hoofdstuk: '9'
  - number: 32b.3
    text: |-
      Een verzoek om teruggaaf van belasting op leidingwater wordt ingediend binnen dertien weken nadat
      de eindafrekening van het waterleidingbedrijf of van de afzonderlijke watervoorziening is verzonden.
      Bij het verzoek om teruggaaf wordt de eindfactuur van het waterleidingbedrijf of van de afzonderlijke
      watervoorziening overgelegd. Deze factuur wordt bij de beschikking op het verzoek om teruggaaf teruggezonden.
      [Artikel 91 van de Wet belastingen op milieugrondslag][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel91
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '91'
  - number: '33.1'
    text: |-
      Van de belastingen, genoemd in het derde lid van dit artikel zijn, met inachtneming van hetgeen is bepaald
      in de [artikelen 34][ref1], [36][ref2], [37][ref3] en [38][ref4], vrijgesteld de leden van diplomatieke
      vertegenwoordigingen en, met uitzondering van honoraire consuls, de leden van consulaire vertegenwoordigingen van
      andere Mogendheden, mits zij:


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0006736#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0006736#Artikel37
      [ref4]: https://wetten.overheid.nl/BWBR0006736#Artikel38
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: '34'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0006736
        artikel: '36'
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0006736
        artikel: '37'
        hoofdstuk: '9'
      - id: ref4
        bwb_id: BWBR0006736
        artikel: '38'
        hoofdstuk: '9'
  - number: 33.1.a
    text: geen Nederlander zijn;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel33
  - number: 33.1.b
    text: niet duurzaam verblijf houden in Nederland; en
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel33
  - number: 33.1.c
    text: bij Nederland zijn geaccrediteerd of aangemeld.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel33
  - number: '33.2'
    text: |-
      De vrijstelling voor de in het eerste lid bedoelde personen vindt overeenkomstige toepassing ten aanzien van de
      bij hen inwonende gezinsleden en, onder voorwaarde van wederkerigheid, de bij hen in dienstbetrekking staande
      particuliere bedienden, mits zij:
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel33
  - number: 33.2.a
    text: geen Nederlander zijn; en
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel33
  - number: 33.2.b
    text: niet duurzaam verblijf houden in Nederland.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel33
  - number: '33.3'
    text: 'De in dit artikel bedoelde vrijstelling vindt toepassing met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel33
  - number: 33.3.a
    text: de inkomstenbelasting;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel33
  - number: 33.3.b
    text: de loonbelasting;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel33
  - number: 33.3.c
    text: de omzetbelasting;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel33
  - number: 33.3.d
    text: de motorrijtuigenbelasting;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel33
  - number: 33.3.e
    text: de belasting van personenauto’s en motorrijwielen;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel33
  - number: 33.3.f
    text: de kansspelbelasting.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel33
  - number: '33.4'
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van de functionarissen van internationale
      organisaties die ingevolge [artikel 39 van de wet][ref1] in aanmerking komen voor de vrijstellingen zoals die
      worden verleend aan leden van diplomatieke vertegenwoordigingen. Het tweede lid is van overeenkomstige toepassing
      ten aanzien van de inwonende gezinsleden van functionarissen van internationale organisaties die ingevolge
      [artikel 39 van de wet][ref2] in aanmerking komen voor de fiscale vrijstellingen zoals die worden verleend aan de
      inwonende gezinsleden van leden van diplomatieke vertegenwoordigingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel39
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '39'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '39'
  - number: '33.5'
    text: |-
      De vrijstelling van omzetbelasting wordt slechts verleend onder voorwaarde van wederkerigheid; ten
      aanzien van functionarissen van internationale organisaties die ingevolge [artikel 39 van de wet][ref1] in
      aanmerking komen voor de vrijstellingen zoals die worden verleend aan diplomaten, wordt met inachtneming van
      [artikel 32, eerste lid][ref2], aangenomen dat aan de voorwaarde van wederkerigheid wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0006736#Artikel32
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '39'
      - id: ref2
        bwb_id: BWBR0006736
        artikel: '32'
        hoofdstuk: '9'
  - number: '34.1'
    text: |-
      De vrijstelling van inkomstenbelasting, bedoeld in [artikel 33][ref1], strekt zich niet uit tot het buiten het
      ambt of de betrekking genoten inkomen, bedoeld in [hoofdstuk 7 van de Wet inkomstenbelasting 2001][ref2]. Bij de
      berekening van de inkomstenbelasting over de niet-vrijgestelde inkomensbestanddelen wordt geen rekening gehouden
      met de vrijgestelde inkomensbestanddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: '33'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0011353
        hoofdstuk: '7'
  - number: '34.2'
    text: |-
      De vrijstelling van loonbelasting, bedoeld in [artikel 33][ref1], strekt zich niet uit tot het buiten het ambt of
      de betrekking genoten loon.


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel33
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: '33'
        hoofdstuk: '9'
  - number: '34.3'
    text: |-
      De vrijstelling van kansspelbelasting, bedoeld in [artikel 33][ref1], strekt zich niet uit tot prijzen van
      binnenlandse kansspelen.


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel33
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: '33'
        hoofdstuk: '9'
  - number: '35.1'
    text: |-
      Van de belastingen, genoemd in het tweede lid van dit artikel zijn, met inachtneming van hetgeen is bepaald
      in de [artikelen 36][ref1], [37][ref2], [38][ref3] en [39][ref4], vrijgesteld de diplomatieke en consulaire
      vertegenwoordigingen van andere Mogendheden, met uitzondering van honoraire consulaire vertegenwoordigingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0006736#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0006736#Artikel38
      [ref4]: https://wetten.overheid.nl/BWBR0006736#Artikel39
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: '36'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0006736
        artikel: '37'
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0006736
        artikel: '38'
        hoofdstuk: '9'
      - id: ref4
        bwb_id: BWBR0006736
        artikel: '39'
        hoofdstuk: '9'
  - number: '35.2'
    text: 'De in het eerste lid bedoelde vrijstelling vindt toepassing met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel35
  - number: 35.2.a
    text: de omzetbelasting;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel35
  - number: 35.2.b
    text: de motorrijtuigenbelasting;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel35
  - number: 35.2.c
    text: de belasting van personenauto’s en motorrijwielen;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel35
  - number: 35.2.d
    text: de overdrachtsbelasting.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel35
  - number: '35.3'
    text: |-
      Honoraire consulaire vertegenwoordigingen zijn, met inachtneming van hetgeen is bepaald in de [artikelen 36][ref1]
      en [39][ref2], vrijgesteld van:


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0006736#Artikel39
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: '36'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0006736
        artikel: '39'
        hoofdstuk: '9'
  - number: 35.3.a
    text: de omzetbelasting;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel35
  - number: 35.3.b
    text: de overdrachtsbelasting.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel35
  - number: '35.4'
    text: |-
      De vrijstelling van omzetbelasting, bedoeld in dit artikel, wordt slechts verleend onder voorwaarde van
      wederkerigheid.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel35
  - number: '35.5'
    text: |-
      De in dit artikel bedoelde vrijstellingen worden verleend aan het hoofd van de diplomatieke of consulaire
      vertegenwoordiging.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel35
  - number: '36.1'
    text: |-
      De vrijstelling van omzetbelasting ten behoeve van de in [artikel 33][ref1] bedoelde personen wordt verleend
      voor de levering van roerende zaken bestemd voor hun persoonlijk gebruik, met uitzondering van de levering van
      levensmiddelen, drank of tabakswaren. De vrijstelling wordt slechts verleend indien de vergoeding per factuur ten
      minste € 225 bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel33
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: '33'
        hoofdstuk: '9'
  - number: '36.2'
    text: |-
      De vrijstelling van omzetbelasting ten behoeve van de in [artikel 35, eerste lid][ref1], bedoelde diplomatieke en
      beroepsconsulaire vertegenwoordigingen wordt verleend voor de levering van goederen en het verrichten van diensten
      bestemd voor officieel gebruik van deze vertegenwoordigingen. Onder officieel gebruik wordt begrepen het huisvesten
      van leden van de vertegenwoordiging. De vrijstelling wordt slechts verleend indien de vergoeding per factuur ten
      minste € 225 bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel35
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: '35'
        hoofdstuk: '9'
  - number: '36.3'
    text: |-
      De vrijstelling van omzetbelasting ten behoeve van de in [artikel 35, derde lid][ref1], bedoelde honoraire
      consulaire vertegenwoordigingen wordt beperkt tot de volgende prestaties:


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel35
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: '35'
        hoofdstuk: '9'
  - number: 36.3.a
    text: |-
      de levering van onroerende zaken en van rechten waaraan deze zijn onderworpen, bestemd voor officieel gebruik van
      de vertegenwoordiging, daaronder begrepen onroerende zaken en rechten waaraan deze zijn onderworpen bestemd voor
      het huisvesten van de leden van de vertegenwoordiging, met uitzondering van honoraire consuls;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel36
  - number: 36.3.b
    text: |-
      de levering van goederen en het verrichten van diensten bestemd voor het bouwen, verbouwen, herstellen en
      onderhouden, hieronder niet begrepen het schoonmaken, van de officiële gebouwen van de vertegenwoordiging, met
      uitzondering van de woning van de honoraire consul;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel36
  - number: 36.3.c
    text: de verhuur aan de vertegenwoordiging van onroerende zaken, bestemd voor officieel gebruik.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel36
  - number: '36.4'
    text: |-
      De teruggaaf wordt uitsluitend verleend, indien de levering of de dienst wordt ingeschreven in een door de
      inspecteur op verzoek uitgereikt of toegezonden formulier, onder overlegging van een gedagtekende factuur, waarin
      op duidelijke en overzichtelijke wijze zijn vermeld:
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel36
  - number: 36.4.a
    text: de dag waarop de levering of de dienst wordt verricht;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel36
  - number: 36.4.b
    text: naam en adres van de ondernemer die de levering of de dienst verricht;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel36
  - number: 36.4.c
    text: naam en adres van degene aan wie de levering wordt verricht of de dienst verleend;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel36
  - number: 36.4.d
    text: een duidelijke omschrijving van de geleverde goederen of van de dienst;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel36
  - number: 36.4.e
    text: de hoeveelheid van de geleverde goederen;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel36
  - number: 36.4.f
    text: de vergoeding; en
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel36
  - number: 36.4.g
    text: het bedrag van de belasting dat ter zake van de levering of de dienst is verschuldigd.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel36
  - number: '36.5'
    text: |-
      Bij de aangifte ter verkrijging van teruggaaf wordt het in het vierde lid bedoelde formulier te zamen met de
      daarbij gevoegde facturen en eventuele bewijzen van betaling overgelegd. De facturen en eventuele bewijzen van
      betaling worden bij het afschrift van de beschikking op het verzoek om teruggaaf teruggezonden.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel36
  - number: '37.1'
    text: |-
      De vrijstelling van motorrijtuigenbelasting, bedoeld in de [artikelen 33][ref1] en [35][ref2], wordt verleend voor
      motorrijtuigen bestemd voor persoonlijk gebruik door de in [artikel 33][ref3] bedoelde personen of bestemd voor
      officieel gebruik ten behoeve van de in [artikel 35, eerste lid][ref4], bedoelde diplomatieke en beroepsconsulaire
      vertegenwoordigingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0006736#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0006736#Artikel33
      [ref4]: https://wetten.overheid.nl/BWBR0006736#Artikel35
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: '33'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0006736
        artikel: '35'
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0006736
        artikel: '33'
        hoofdstuk: '9'
      - id: ref4
        bwb_id: BWBR0006736
        artikel: '35'
        hoofdstuk: '9'
  - number: '37.2'
    text: |-
      De vrijstelling van motorrijtuigenbelasting wordt verleend indien voor het motorrijtuig een CD-kenteken is
      afgegeven, dan wel een BN/GN-kenteken in de serie 70-00 tot en met 88-99 of in de serie 90-00 tot en met 99-99. De
      inspecteur kan de vrijstelling ook verlenen indien voor het motorrijtuig een ander kenteken is afgegeven.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel37
  - number: '38.1'
    text: |-
      De vrijstelling van belasting van personenauto’s en motorrijwielen, bedoeld in de [artikelen 33][ref1]
      en [35][ref2], wordt verleend voor personenauto’s en motorrijwielen bestemd voor persoonlijk gebruik
      door de in [artikel 33][ref3] bedoelde personen of bestemd voor officieel gebruik ten behoeve van de in
      [artikel 35, eerste lid][ref4], bedoelde diplomatieke en beroepsconsulaire vertegenwoordigingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0006736#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0006736#Artikel33
      [ref4]: https://wetten.overheid.nl/BWBR0006736#Artikel35
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: '33'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0006736
        artikel: '35'
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0006736
        artikel: '33'
        hoofdstuk: '9'
      - id: ref4
        bwb_id: BWBR0006736
        artikel: '35'
        hoofdstuk: '9'
  - number: '38.2'
    text: |-
      De vrijstelling van belasting van personenauto’s en motorrijwielen wordt slechts verleend indien voor het
      motorrijtuig een CD-kenteken is afgegeven, dan wel een BN/GN-kenteken in de serie 70-00 tot en met 88-99 of in de
      serie 90-00 tot en met 99-99. Er wordt geen teruggaaf verleend van voor het motorrijtuig reeds betaalde belasting.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel38
  - number: '39.1'
    text: |-
      De vrijstelling van overdrachtsbelasting, bedoeld in [artikel 35][ref1], wordt verleend voor de belasting die is
      verschuldigd ter zake van de verkrijging door een vreemde Mogendheid van in Nederland gelegen onroerende zaken
      die bestemd zijn voor de huisvesting van een diplomatieke of consulaire vertegenwoordiging of die bestemd zijn
      voor bewoning door het hoofd van een diplomatieke of consulaire vertegenwoordiging, met uitzondering van honoraire
      consuls. De vrijstelling van overdrachtsbelasting wordt, onder voorwaarde van wederkerigheid, mede verleend
      voor de belasting die is verschuldigd ter zake van de verkrijging door een vreemde Mogendheid van in Nederland
      gelegen onroerende zaken die bestemd zijn voor bewoning door andere leden van een diplomatieke of consulaire
      vertegenwoordiging. Verkrijging wordt opgevat in de zin van de Wet op belastingen van rechtsverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel35
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: '35'
        hoofdstuk: '9'
  - number: '39.2'
    text: |-
      De vrijstelling wordt verleend in de vorm van teruggaaf van belasting, tenzij Onze Minister vooraf een vergunning
      heeft afgegeven om geen belasting te voldoen.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel39
  - number: '40.1'
    text: 'Een voorwaardelijke vrijstelling van omzetbelasting wordt verleend aan in een andere lidstaat van de Europese Unie:'
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel40
  - number: 40.1.a
    text: gevestigde diplomatieke en consulaire vertegenwoordigingen;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel40
  - number: 40.1.b
    text: gevestigde internationale organisaties;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel40
  - number: 40.1.c
    text: |-
      gelegerde NAVO-strijdkrachten of EU-strijdkrachten, met uitzondering van NAVO-strijdkrachten en EU-strijdkrachten
      van die lidstaat zelf.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel40
  - number: '40.2'
    text: |-
      Een voorwaardelijke vrijstelling van omzetbelasting wordt verleend aan personeelsleden van de in het eerste lid
      bedoelde instellingen.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel40
  - number: '40.3'
    text: |-
      Bij het verlenen van de in het eerste lid bedoelde vrijstellingen zijn de voorwaarden, zoals de andere lidstaat die
      voor de instelling, dan wel het personeelslid heeft vastgesteld voor de vrijstelling van omzetbelasting ter zake
      van prestaties in het binnenlandse vrije verkeer, van overeenkomstige toepassing. De vrijstellingen worden niet
      verleend voor goederen die bestemd zijn voor gebruik binnen Nederland, noch voor diensten verricht met betrekking
      tot dergelijke goederen.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel40
  - number: '40.4'
    text: |-
      De in het eerste en tweede lid bedoelde vrijstellingen worden slechts verleend, indien de instelling, dan wel het
      personeelslid een originele, door of namens de andere lidstaat gewaarmerkte verklaring overlegt waaruit blijkt dat
      ter zake aanspraak op vrijstelling van omzetbelasting bestaat. Voor deze verklaring dient gebruik te worden gemaakt
      van het EU-document ter uitvoering van de vrijstelling omzetbelasting en accijns bij intracommunautaire aankopen
      door ambassades en consulaten en de leden daarvan, internationale organisaties en bepaalde functionarissen daarvan,
      NAVO-onderdelen en EU-strijdkrachten.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel40
  - number: '40.5'
    text: |-
      De in het eerste lid en tweede lid bedoelde vrijstelling kan direct, bij wijze van toepassing van het tarief van
      nihil, worden verleend indien de instelling, dan wel het personeelslid, tijdig een geldige verklaring als bedoeld
      in het vierde lid ter beschikking stelt aan de ondernemer die de prestatie verricht. De in het eerste en tweede
      lid bedoelde vrijstelling kan worden verleend in de vorm van teruggaaf van belasting indien het bedrag van de
      vergoeding per factuur ten minste € 225 bedraagt.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel40
  - number: '40.6'
    text: |-
      De vrijstelling vervalt wanneer niet of niet langer wordt voldaan aan de in het derde lid bedoelde voorwaarden. De
      alsdan verschuldigde omzetbelasting bedraagt ten hoogste het bedrag waarvan vrijstelling werd verleend.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel40
  - number: '41'
    text: |-
      De werknemer die niet in Nederland woont en buiten Nederland in dienstbetrekking staat tot een Nederlandse
      publiekrechtelijke rechtspersoon, is, in afwijking in zoverre van artikel 2, derde en vierde lid, van de Wet op
      de loonbelasting 1964 en [artikel 7.2, zevende lid, van de Wet inkomstenbelasting 2001][ref1], vrijgesteld van
      loonbelasting onderscheidenlijk inkomstenbelasting indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel7
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '7'
  - number: 41.a
    text: |-
      ter zake van het loon van de werknemer niet een verdrag ter voorkoming van dubbele belasting van toepassing is en
      ook de Belastingregeling voor het Koninkrijk en de Belastingregeling voor het land Nederland niet van toepassing
      zijn; en
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel41
  - number: 41.b
    text: de werknemer is aangeworven in het land waar hij werkzaam is; en
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel41
  - number: 41.c
    text: |-
      door de Mogendheid op wier grondgebied de dienstbetrekking wordt vervuld een overeenkomstig standpunt wordt
      ingenomen ten aanzien van werknemers van haar publiekrechtelijke rechtspersonen die werkzaam zijn in Nederland en
      alhier zijn aangeworven.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel41
  - number: '42.1'
    text: |-
      Vrijstelling van omzetbelasting bij wijze van toepassing van het tarief van nihil wordt verleend voor de levering
      aan en de intracommunautaire verwerving door buitenlandse NAVO-strijdkrachten van uitrusting, proviand, materiaal
      en goederen die bestemd zijn:
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42
  - number: 42.1.a
    text: |-
      voor uitsluitend gebruik door die strijdkrachten, het personeel van die strijdkrachten of de gezinsleden van dat
      personeel; of
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42
  - number: 42.1.b
    text: |-
      te worden verkocht of om niet te worden overgedragen in militaire winkels, kantines, restaurants, clubs of messes
      voor persoonlijk gebruik aan personeel van die strijdkrachten of aan de gezinsleden van dat personeel.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42
  - number: '42.2'
    text: |-
      Vrijstelling van accijns en verbruiksbelasting van alcoholvrije dranken wordt verleend voor de uitslag tot verbruik
      respectievelijk de uitslag van goederen die worden geleverd aan buitenlandse NAVO-strijdkrachten en die bestemd
      zijn:
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42
  - number: 42.2.a
    text: voor uitsluitend gebruik door die strijdkrachten; of
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42
  - number: 42.2.b
    text: |-
      te worden verkocht of om niet te worden overgedragen in militaire winkels, kantines, restaurants, clubs of messes
      voor persoonlijk gebruik aan personeel van die strijdkrachten of aan de gezinsleden van dat personeel; of
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42
  - number: 42.2.c
    text: |-
      te worden verkocht of om niet te worden overgedragen voor consumptie ter plaatse in kantines, restaurants, clubs of
      messes van een Geallieerd Hoofdkwartier.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42
  - number: '42.3'
    text: |-
      Een lid van de krijgsmacht als bedoeld in artikel 3, eerste lid, onderdeel a, van het Hoofdkwartierenprotocol dat
      de Nederlandse nationaliteit heeft mag uitsluitend gerantsoeneerde goederen, genoemd in de bijlage, onder de in
      [artikel 42g, eerste lid][ref1] gestelde voorwaarden, kopen in militaire winkels, kantines, restaurants, clubs
      of messes.


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel42g
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: 42g
        hoofdstuk: '9'
  - number: 42a.1
    text: |-
      Vrijstelling van omzetbelasting bij wijze van teruggaaf wordt verleend voor de levering van goederen voor
      persoonlijk gebruik aan personeel van buitenlandse NAVO-strijdkrachten of aan de gezinsleden van dat personeel,
      waarbij die goederen door een ondernemer als bedoeld in [artikel 7 van de Wet op de omzetbelasting 1968][ref1]
      worden geleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel7
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '7'
  - number: 42a.2
    text: 'De vrijstelling, bedoeld in het eerste lid, is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42a
  - number: 42a.2.a
    text: alcoholhoudende dranken, tabaksproducten en voedingsmiddelen;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42a
  - number: 42a.2.b
    text: goederen waarvan het bedrag van de vergoeding per factuur minder bedraagt dan € 50;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42a
  - number: 42a.2.c
    text: goederen die zijn bestemd om blijvend te worden aangebracht aan een onroerend goed;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42a
  - number: 42a.2.d
    text: motorrijtuigen, vaartuigen en luchtvaartuigen.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42a
  - number: 42a.3
    text: |-
      De teruggaaf wordt alleen verleend indien een betalingsbewijs wordt overgelegd waarop het geleverde goed is
      omschreven en de betaalde omzetbelasting is vermeld.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42a
  - number: 42b.1
    text: |-
      Ter zake van aan buitenlandse NAVO-strijdkrachten verleende diensten, bestemd voor officieel gebruik van die
      strijdkrachten, wordt met betrekking tot de omzetbelasting het tarief van nihil toegepast.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42b
  - number: 42b.2
    text: |-
      De commandant legt bij de inspecteur een lijst over met de namen, rang, functie en handtekening van de personen van
      zijn strijdkracht die bevoegd zijn tot het aftekenen van facturen of documenten die betrekking hebben op diensten
      die verleend zijn aan zijn strijdkracht.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42b
  - number: 42c.1
    text: |-
      Vrijstelling van omzetbelasting bij wijze van toepassing van het tarief van nihil wordt verleend voor de levering
      van aardgas, elektriciteit en leidingwater aan buitenlandse NAVO-strijdkrachten en aan het personeel van die
      strijdkrachten voor hun persoonlijk gebruik.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42c
  - number: 42c.2
    text: |-
      In gevallen waarin op grond van het eerste lid een vrijstelling wordt verleend van omzetbelasting geheven
      ter zake van de levering van aardgas, elektriciteit of leidingwater, wordt mede een vrijstelling verleend van
      energiebelasting en opslag duurzame energie- en klimaattransitie, onderscheidenlijk belasting op leidingwater.
      [Artikel 32a, tweede en derde lid][ref1], onderscheidenlijk [artikel 32b, tweede en derde lid][ref2], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel32a
      [ref2]: https://wetten.overheid.nl/BWBR0006736#Artikel32b
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42c
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: 32a
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0006736
        artikel: 32b
        hoofdstuk: '9'
  - number: 42d.1
    text: |-
      Vrijstelling van omzetbelasting en accijns van minerale oliën wordt verleend voor levering van motorbrandstoffen
      aan personeel van buitenlandse NAVO-strijdkrachten en bestemd voor persoonlijk verbruik door dat personeel in
      motorrijtuigen die hun eigendom zijn.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42d
  - number: 42d.2
    text: |-
      Voor de toepassing van het eerste lid, wordt vrijstelling van omzetbelasting en accijns van minerale oliën voor
      motorbrandstoffen, ongeacht de soorten motorbrandstof, verleend aan:
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42d
  - number: 42d.2.a
    text: |-
      het personeel van Amerikaanse of Canadese strijdkrachten of de civiele diensten daarvan: maximaal 400 liter per
      maand en per personeelslid;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42d
  - number: 42d.2.b
    text: |-
      in afwijking van onderdeel a geldt voor het personeel van de overige buitenlandse NAVO-strijdkrachten en het
      militair personeel dat de Nederlandse nationaliteit heeft en verbonden is aan een Geallieerd Hoofdkwartier:
      maximaal 150 liter per maand en per personeelslid.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42d
  - number: 42d.3
    text: |-
      De vrijstelling, bedoeld in het eerste lid, wordt door de inspecteur op verzoek van of namens een personeelslid als
      bedoeld in het eerste lid verleend in de vorm van teruggaaf van betaalde belasting aan dat personeelslid.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42d
  - number: 42d.4
    text: |-
      De commandant houdt een administratie bij van de hoeveelheid motorbrandstoffen die maandelijks aan een
      personeelslid wordt geleverd. Deze administratie wordt op verzoek van de inspecteur aan hem ter beschikking gesteld
      voor een controle.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42d
  - number: 42e.1
    text: |-
      Vrijstelling van omzetbelasting en accijns van minerale oliën ter zake van de levering, de intracommunautaire
      verwerving, onderscheidenlijk de uitslag tot verbruik, wordt verleend voor minerale oliën, die in Nederland worden
      afgeleverd en bestemd zijn voor verbruik in luchtvaartuigen, oorlogsschepen en geregistreerde dienstvoertuigen van
      buitenlandse NAVO-strijdkrachten of van de bij die strijdkrachten behorende civiele diensten.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42e
  - number: 42e.2
    text: |-
      De vrijstelling van accijns van minerale oliën ter zake van de uitslag tot verbruik wordt verleend indien de
      inspecteur aan de houder van een ‘vergunning accijnsgoederenplaats’ toestemming heeft verleend tot het leveren aan
      buitenlandse NAVO-strijdkrachten of aan de bij die strijdkrachten behorende civiele diensten.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42e
  - number: 42e.3
    text: |-
      De vrijstelling van accijns voor reeds tot verbruik uitgeslagen minerale oliën wordt op verzoek verleend in de vorm
      van teruggaaf van betaalde accijns aan de strijdkrachten of de diensten, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42e
  - number: 42e.4
    text: |-
      Het tweede en derde lid zijn van overeenkomstige toepassing op de vrijstelling van omzetbelasting met dien
      verstande dat het tarief van nihil wordt toegepast, indien de inspecteur aan degene die de levering verricht
      daarvoor een vergunning heeft afgegeven.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42e
  - number: 42f.1
    text: |-
      Vrijstelling van motorrijtuigenbelasting wordt verleend voor geregistreerde dienstvoertuigen van buitenlandse NAVO-
      strijdkrachten of van de bij die strijdkrachten behorende civiele dienst.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42f
  - number: 42f.2
    text: |-
      Vrijstelling van motorrijtuigenbelasting wordt verleend voor ten hoogste twee motorrijtuigen die eigendom zijn van
      een personeelslid van buitenlandse NAVO-strijdkrachten en bestemd zijn voor persoonlijk gebruik en voor de duur van
      zijn verblijf in Nederland.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42f
  - number: 42f.3
    text: |-
      De vrijstelling, bedoeld in het tweede lid, is van overeenkomstige toepassing op personeel van buitenlandse
      NAVO-strijdkrachten en inwonende gezinsleden daarvan, waarbij dat personeel in het Koninkrijk België of in
      de Bondsrepubliek Duitsland is gestationeerd en in Nederland woont, met uitzondering van Belgische- en Duitse
      personeelsleden van buitenlandse NAVO-strijdkrachten die in Nederland wonen, maar in hun eigen land zijn
      gestationeerd.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42f
  - number: 42f.4
    text: |-
      De commandant van de zich in het Koninkrijk België of in de Bondsrepubliek Duitsland voor de dienstuitoefening
      bevindende buitenlandse NAVO-strijdkrachten verstrekt aan de inspecteur een opgave van de namen, de nationaliteiten
      en de adressen in Nederland van de personeelsleden, bedoeld in het tweede lid, van het tijdstip van hun komst naar
      Nederland, van de registratienummers en -letters van de door hen gebezigde motorrijtuigen, alsmede van de mutaties
      in voormelde gegevens.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42f
  - number: 42g.1
    text: |-
      De goederen die met vrijstelling van omzetbelasting, van accijns of van verbruiksbelasting van alcoholvrije
      dranken, bedoeld in [artikel 42][ref1], zijn geleverd aan of intracommunautair zijn verworven door buitenlandse
      NAVO-strijdkrachten, kunnen aan het personeel van die strijdkrachten of gezinsleden daarvan in militaire winkels,
      kantines, restaurants, clubs of messes worden verkocht of om niet te worden overgedragen onder voorwaarde dat:


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel42
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42g
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: '42'
        hoofdstuk: '9'
  - number: 42g.1.a
    text: |-
      het personeel van buitenlandse NAVO-strijdkrachten of gezinsleden daarvan uitsluitend toegang hebben tot militaire
      winkels, kantines, restaurants, clubs of messes op vertoon van een geldige persoonlijke identiteitskaart die
      is voorzien van naam, datum en plaats van geboorte, nationaliteit, eventueel rang en stamboeknummer, foto en
      geldigheidsduur;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42g
  - number: 42g.1.b
    text: |-
      gerantsoeneerde goederen, genoemd in de bijlage, uitsluitend worden verkocht aan personeel van de buitenlandse
      NAVO-strijdkrachten of gezinsleden daarvan die in het bezit zijn van een geldige rantsoenkaart of een elektronisch
      equivalent daarvan die, onderscheidenlijk dat, is afgegeven door de commandant;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42g
  - number: 42g.1.c
    text: |-
      de rantsoenkaarten of het elektronische equivalent daarvan geldig zijn gedurende de wekelijkse periode, die erop
      vermeld staat, de daaraan voorafgaande week en gedurende twee weken na bedoelde periode;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42g
  - number: 42g.1.d
    text: |-
      de rantsoenkaarten of het elektronische equivalent daarvan afgegeven kunnen worden in een vorm die de mogelijkheid
      biedt de rantsoenen aan te geven voor maximaal 26 achtereenvolgende weken;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42g
  - number: 42g.1.e
    text: |-
      de in de militaire winkel geleverde hoeveelheid gerantsoeneerde goederen afgeschreven worden van de op de
      rantsoenkaart of op het elektronische equivalent daarvan vermelde hoeveelheid onder vermelding van de datum van
      levering;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42g
  - number: 42g.1.f
    text: |-
      in militaire kantines, restaurants, clubs of messes gerantsoeneerde alcoholhoudende dranken slechts worden verkocht
      voor consumptie ter plaatse;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42g
  - number: 42g.1.g
    text: |-
      in militaire kantines, restaurants, clubs of messes tabaksproducten uitsluitend worden verkocht in de
      kleinhandelsverpakking en afgeschreven worden op de rantsoenkaart of op het elektronische equivalent daarvan.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42g
  - number: 42g.2
    text: |-
      De commandant houdt in zijn administratie bij de afgifte van rantsoenkaarten of het elektronische equivalent
      daarvan. Hierbij wordt in ieder geval vastgelegd het serienummer van de afgegeven kaart, in numerieke volgorde, met
      daarbij de naam van de gerechtigde en zijn rang alsmede de bijzonderheden omtrent de geldige identiteitskaart en in
      voorkomend geval zijn handtekening.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42g
  - number: 42g.3
    text: Na elke rantsoenperiode wordt de administratie gedurende zeven jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42g
  - number: 42g.4
    text: |-
      De in gebruik zijnde en niet meer in gebruik zijnde administratie wordt op verzoek ter beschikking gesteld aan
      de inspecteur.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42g
  - number: 42g.5
    text: |-
      De militaire winkels, kantines, restaurants, clubs of messes van de buitenlandse NAVO-strijdkrachten zijn gehouden
      een administratie te voeren van alle ingekochte en verkochte goederen. Deze administratie wordt zeven jaar bewaard
      en wordt desgevraagd ter beschikking gesteld aan de inspecteur voor controle.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42g
  - number: 42g.6
    text: 'De commandant zorgt ervoor dat:'
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42g
  - number: 42g.6.a
    text: |-
      personeelsleden of gezinsleden daarvan, die niet langer gerechtigd zijn tot rantsoenen, hun rantsoenkaart of het
      elektronische equivalent daarvan inleveren;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42g
  - number: 42g.6.b
    text: |-
      degene die zijn rantsoenkaart of het elektronische equivalent daarvan verliest, dat verlies aan hem opgeeft en dat
      de inspecteur en de militaire winkels, kantines, restaurants, clubs of messes daarover worden ingelicht;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42g
  - number: 42g.6.c
    text: |-
      de aankoop van goederen wordt geweigerd in het geval dat een geldig identiteitsbewijs en een rantsoenkaart of het
      elektronische equivalent daarvan niet kunnen worden getoond.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42g
  - number: 42g.7
    text: |-
      Met toestemming van de inspecteur en onder eventueel door hem te stellen voorwaarden kan het beheer en de
      exploitatie van militaire winkels, kantines, restaurants, clubs of messes worden uitbesteed aan derden.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42g
  - number: 42h
    text: |-
      De inspecteur kan toestemming verlenen om af te zien van de vrijstelling. Alsdan wordt de verschuldigde belasting
      voor:
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42h
  - number: 42h.a
    text: |-
      motorrijtuigen vastgesteld op basis van het tarief en de dagwaarde op het tijdstip dat van de vrijstelling wordt
      afgezien;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42h
  - number: 42h.b
    text: |-
      gebruiksgoederen, met uitzondering van motorrijtuigen, vastgesteld op basis van het tarief en de restwaarde van het
      gebruiksgoed op het tijdstip dat van de vrijstelling wordt afgezien waarbij een afschrijvingsperiode van drie jaren
      wordt gehanteerd.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42h
  - number: 42i.1
    text: |-
      Vrijstelling van omzetbelasting wordt verleend voor de levering van tabaksproducten, spijzen of alcoholhoudende
      dranken aan gepensioneerde leden van een krijgsmacht als bedoeld in artikel 3, eerste lid, onderdeel a, van het
      Hoofdkwartierenprotocol en aan gepensioneerde leden van de civiele dienst, bedoeld in artikel 3, eerste lid, aanhef
      en onderdeel b, van het Hoofdkwartierenprotocol, voor consumptie ter plaatse in kantines, restaurants, clubs of
      messes van een Geallieerd Hoofdkwartier.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42i
  - number: 42i.2
    text: |-
      Gepensioneerd personeel van een krijgsmacht als bedoeld in artikel I, eerste lid, aanhef en onderdeel a, van het
      NAVO-Statusverdrag of de weduwen en de weduwnaars van dat personeel, mogen niet-accijnsgoederen kopen in militaire
      winkels na daartoe van de inspecteur toestemming te hebben gekregen. Leveringen van goederen die bedoelde personen
      in dergelijke winkels hebben gekocht worden aangemerkt als uitvoer. Vervolgens worden die goederen op het tijdstip
      waarop de leveringen worden verricht aangemerkt als door bedoelde personen tegen betaling van een forfaitair
      belastingtarief van 16% in het vrije verkeer te zijn gebracht.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42i
  - number: 42i.3
    text: De inspecteur kan aan een toestemming als bedoeld in het tweede lid voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42i
  - number: 42i.4
    text: |-
      De inspecteur is bevoegd een verleende toestemming als bedoeld in het tweede lid geheel of gedeeltelijk in te
      trekken, indien aan de voorwaarden, waaronder de toestemming is verleend, niet wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42i
  - number: 42j.1
    text: |-
      Op personeel van buitenlandse NAVO-strijdkrachten en de gezinsleden van dat personeel, voor zover dat personeel in
      het Koninkrijk België of in de Bondsrepubliek Duitsland voor de dienstuitoefening is gestationeerd en in Nederland
      woont, is [artikel 42i][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel42i
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42j
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: 42i
        hoofdstuk: '9'
  - number: 42j.2
    text: |-
      De commandant van de zich in het Koninkrijk België of in de Bondsrepubliek Duitsland voor de dienstuitoefening
      bevindende buitenlandse NAVO-strijdkrachten verstrekt aan de inspecteur een opgave van de namen, de nationaliteiten
      en de adressen in Nederland van de personeelsleden, bedoeld in het eerste lid, alsmede van hun gezinsleden,
      van het tijdstip van hun komst naar Nederland, van de registratienummers en -letters van de door hen gebezigde
      motorrijtuigen, alsmede van de mutaties in voormelde gegevens.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42j
  - number: 42j.3
    text: |-
      Het eerste lid is niet van toepassing op Belgische- en Duitse personeelsleden van buitenlandse NAVO-strijdkrachten
      die in Nederland wonen, maar in hun eigen land zijn gestationeerd.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42j
  - number: 42k
    text: 'Het is niet toegestaan gerantsoeneerde goederen te kopen voor een ander, behoudens in de volgende gevallen:'
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42k
  - number: 42k.a
    text: |-
      een gezinslid mag voor een ander lid van het gezin met gebruikmaking van diens rantsoenkaart of een elektronisch
      equivalent daarvan aankopen verrichten;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42k
  - number: 42k.b
    text: |-
      opperofficieren en vlagofficieren kunnen een ondergeschikte machtigen om de normaal toegestane hoeveelheid
      gerantsoeneerde goederen te kopen. De gemachtigden leggen bij de aankoop de schriftelijke machtiging van hun
      officier over en de rantsoenkaart of een elektronisch equivalent daarvan van die officier;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42k
  - number: 42k.c
    text: |-
      personen die bevoegd zijn gerantsoeneerde goederen te kopen, maar die daartoe niet in staat zijn, kunnen een
      gemachtigde aanwijzen die zelf eveneens tot aankoop in militaire winkels gerechtigd is, om de aankopen te doen. De
      gemachtigde legt bij de aankoop een door de volmachtgever ondertekende machtiging over en de rantsoenkaart of een
      elektronisch equivalent daarvan van de volmachtgever.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42k
  - number: 42l.1
    text: |-
      De [artikelen 42a][ref1], [42f, tweede lid][ref2], en [42j][ref3] zijn niet van toepassing op militair personeel
      dat de Nederlandse nationaliteit heeft en behoort tot de buitenlandse NAVO-strijdkrachten, maar in dienst is van de
      Nederlandse strijdkrachten alsmede op de gezinsleden van dat personeel.


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel42a
      [ref2]: https://wetten.overheid.nl/BWBR0006736#Artikel42f
      [ref3]: https://wetten.overheid.nl/BWBR0006736#Artikel42j
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42l
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: 42a
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0006736
        artikel: 42f
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0006736
        artikel: 42j
        hoofdstuk: '9'
  - number: 42l.2
    text: |-
      Onverminderd [artikel 42][ref1] zijn de [artikelen 42a][ref2], [42d][ref3], [42f, tweede lid][ref4], [42i][ref5] en
      [42j][ref6] niet van toepassing op leden van de civiele dienst die de Nederlandse nationaliteit hebben en behoren
      tot het personeel van buitenlandse NAVO-strijdkrachten alsmede op de gezinsleden van die leden.


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0006736#Artikel42a
      [ref3]: https://wetten.overheid.nl/BWBR0006736#Artikel42d
      [ref4]: https://wetten.overheid.nl/BWBR0006736#Artikel42f
      [ref5]: https://wetten.overheid.nl/BWBR0006736#Artikel42i
      [ref6]: https://wetten.overheid.nl/BWBR0006736#Artikel42j
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42l
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: '42'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0006736
        artikel: 42a
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0006736
        artikel: 42d
        hoofdstuk: '9'
      - id: ref4
        bwb_id: BWBR0006736
        artikel: 42f
        hoofdstuk: '9'
      - id: ref5
        bwb_id: BWBR0006736
        artikel: 42i
        hoofdstuk: '9'
      - id: ref6
        bwb_id: BWBR0006736
        artikel: 42j
        hoofdstuk: '9'
  - number: 42m
    text: |-
      De commandant verleent desgevraagd met alle hem ten dienste staande middelen aan de inspecteur de benodigde
      medewerking:
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42m
  - number: 42m.a
    text: |-
      om te verzekeren dat goederen die in aanmerking komen voor inbeslagneming of beslaglegging aan de inspecteur
      respectievelijk de ontvanger worden overgedragen;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42m
  - number: 42m.b
    text: |-
      opdat de door het personeel van de betreffende buitenlandse NAVO-strijdkrachten en de gezinsleden daarvan
      eventueel verschuldigde omzetbelasting, belastingen op milieugrondslag, opslag duurzame energie, belastingen van
      personenauto’s en motorrijwielen, verbruiksbelasting van alcoholvrije dranken, motorrijtuigenbelasting inclusief
      provinciale opcenten, accijnzen inclusief eventuele voorraadheffing, rente, kosten, bestuurlijke boeten en
      strafbeschikkingen als bedoeld in [artikel 2 van de Invorderingswet 1990][ref1] worden betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel2
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42m
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '2'
  - number: 42n
    text: |-
      Indien de inspecteur controle wenst uit te oefenen op lokaliteiten binnen vestigingen van een buitenlandse NAVO-
      strijdkracht, vindt deze controle slechts plaats na voorafgaande kennisgeving aan de commandant.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42n
  - number: 42o
    text: |-
      De [artikelen 31b][ref1], [32, eerste, tweede, derde lid en zesde lid][ref2], [40][ref3],
      [42 tot en met 42n][ref4] alsmede [artikel 18, aanhef en onderdeel e, van de Uitvoeringsregeling accijns][ref5] en
      [artikel 10, aanhef en onderdeel d, van de Uitvoeringsregeling verbruiksbelasting van alcoholvrije dranken][ref6],
      zijn van overeenkomstige toepassing op buitenlandse strijdkrachten, het personeel daarvan en hun gezinsleden die
      behoren tot een staat die deelneemt aan het op 19 juni 1995 te Brussel tot stand gekomen Verdrag tussen de Staten
      Partij bij het Noord-Atlantisch Verdrag en de overige aan het Partnerschap voor de Vrede deelnemende Staten nopens
      de rechtspositie van hun krijgsmachten en Aanvullend protocol (Trb. 1996, 74) en het op 19 december te Brussel tot
      stand gekomen Nader Aanvullend Protocol (Trb. 1998, 188), maar geen Partij is van het NAVO-Statusverdrag.


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel31b
      [ref2]: https://wetten.overheid.nl/BWBR0006736#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0006736#Artikel40
      [ref4]: https://wetten.overheid.nl/BWBR0006736#Artikel42
      [ref5]: https://wetten.overheid.nl/BWBR0005355#Artikel18
      [ref6]: https://wetten.overheid.nl/BWBR0005812#Artikel10
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42o
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: 31b
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0006736
        artikel: '32'
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0006736
        artikel: '40'
        hoofdstuk: '9'
      - id: ref4
        bwb_id: BWBR0006736
        artikel: '42'
        hoofdstuk: '9'
      - id: ref5
        bwb_id: BWBR0005355
        artikel: '18'
      - id: ref6
        bwb_id: BWBR0005812
        artikel: '10'
  - number: 42p.1
    text: |-
      Voor de toepassing van de vrijstelling van omzetbelasting, van accijns van minerale oliën en van verbruiksbelasting
      van alcoholvrije dranken, bedoeld in [artikel 42][ref1], ter zake van goederen die zijn geleverd aan of
      intracommunautair zijn verworven door de AFNORTH International School, onderscheidenlijk de uitslag tot verbruik
      of de uitslag van goederen die zijn geleverd aan de AFNORTH International School, is ook sprake van uitsluitend
      gebruik door de strijdkrachten, in de zin van artikel 42, indien de school een zeer beperkt aantal kinderen toelaat
      dat niet tot het gezin behoort van personeel van buitenlandse NAVO-strijdkrachten.


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel42
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42p
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: '42'
        hoofdstuk: '9'
  - number: 42p.2
    text: |-
      Voor de toepassing van de vrijstelling van omzetbelasting, bedoeld in [artikel 42b][ref1], ter zake van aan de
      AFNORTH International School verleende diensten, is ook sprake van officieel gebruik van de strijdkrachten, in de
      zin van artikel 42b, indien de school een zeer beperkt aantal kinderen toelaat dat niet tot het gezin behoort van
      personeel van buitenlandse NAVO-strijdkrachten.


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel42b
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42p
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: 42b
        hoofdstuk: '9'
  - number: 42q.1
    text: |-
      Op grond van [artikel 39 van de wet][ref1] wordt vrijstelling van omzetbelasting verleend ter zake van de levering
      of de intracommunautaire verwerving van goederen en het verrichten van diensten en wordt vrijstelling van accijns
      verleend ter zake de uitslag tot verbruik van goederen aan buitenlandse EU-strijdkrachten, ten behoeve van die
      strijdkrachten of het personeel van die strijdkrachten of voor de bevoorrading van de messes of kantines van die
      strijdkrachten.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel39
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42q
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '39'
  - number: 42q.2
    text: |-
      De buitenlandse EU-strijdkrachten, het personeel van die strijdkrachten, de messes of kantines van die
      strijdkrachten worden voor de toepassing van de vrijstelling aangemerkt als buitenlandse NAVO-strijdkrachten,
      onderscheidenlijk personeel van die strijdkrachten, messes of kantines van die strijdkrachten.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42q
  - number: 42q.3
    text: |-
      In afwijking van het tweede lid zijn [artikel 42c, tweede lid][ref1], [artikel 42i][ref2], [artikel 42j][ref3],
      [artikel 42k, onderdeel a][ref4], en [artikel 42l][ref5] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel42c
      [ref2]: https://wetten.overheid.nl/BWBR0006736#Artikel42i
      [ref3]: https://wetten.overheid.nl/BWBR0006736#Artikel42j
      [ref4]: https://wetten.overheid.nl/BWBR0006736#Artikel42k
      [ref5]: https://wetten.overheid.nl/BWBR0006736#Artikel42l
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42q
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: 42c
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0006736
        artikel: 42i
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0006736
        artikel: 42j
        hoofdstuk: '9'
      - id: ref4
        bwb_id: BWBR0006736
        artikel: 42k
        hoofdstuk: '9'
      - id: ref5
        bwb_id: BWBR0006736
        artikel: 42l
        hoofdstuk: '9'
  - number: 42q.4
    text: Aan gezinsleden van personeel van buitenlandse EU-strijdkrachten wordt geen vrijstelling verleend.
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel42q
  - number: 43a
    text: |-
      Aan de verplichting, bedoeld in [artikel 47b van de wet][ref1], wordt voldaan uiterlijk op het moment
      waarop de gegevens en inlichtingen, bedoeld in [artikel 53, tweede en derde lid, van de wet][ref2],
      door een administratieplichtige als bedoeld in de [artikelen 22, eerste lid][ref3], en
      [22a, eerste lid, van het Uitvoeringsbesluit inkomstenbelasting 2001][ref4] aan de inspecteur worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel47b
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel53
      [ref3]: https://wetten.overheid.nl/BWBR0012066#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0012066#Artikel22a
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 47b
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '53'
      - id: ref3
        bwb_id: BWBR0012066
        artikel: '22'
      - id: ref4
        bwb_id: BWBR0012066
        artikel: 22a
  - number: 43c.1
    text: |-
      De geheimhoudingsplicht, bedoeld in [artikel 67, eerste lid, van de wet][ref1],
      [artikel 67, eerste lid, van de Invorderingswet 1990][ref2] en
      [artikel 10, eerste lid, van de Registratiewet 1970][ref3], geldt niet voor verstrekking aan de hierna
      genoemde bestuursorganen voor zover het betreft de hierna genoemde gegevens ten behoeve van de hierna genoemde
      publiekrechtelijke taak:


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0002739#Artikel10
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel43c
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '67'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '67'
      - id: ref3
        bwb_id: BWBR0002739
        artikel: '10'
  - number: 43c.1.a
    text: 'de Minister van Financiën:'
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel43c
  - number: 43c.1.a.1°
    text: |-
      gegevens die worden gebruikt door de Auditdienst Rijk ten behoeve van controles en onderzoeken als bedoeld in
      [hoofdstuk VI van de Comptabiliteitswet 2001][ref1], of ten behoeve van door de Belastingdienst aan de Auditdienst
      Rijk opgedragen werkzaamheden;


      [ref1]: https://wetten.overheid.nl/BWBR0013891#HoofdstukVI
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel43c
    references:
      - id: ref1
        bwb_id: BWBR0013891
        hoofdstuk: VI
  - number: 43c.1.a.2°
    text: |-
      gegevens over het vermoeden van het bestaan van een onbeheerd gelaten nalatenschap, vermogens- en persoonsgegevens
      en eventuele andere van belang geachte gegevens die nodig zijn voor de vereffening door het Rijksvastgoed- en
      ontwikkelingsbedrijf van onbeheerde nalatenschappen;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel43c
  - number: 43c.1.a.3°
    text: |-
      gegevens ten behoeve van de inspectie belastingen, toeslagen en douane die
      noodzakelijk zijn voor de uitvoering van de haar opgedragen taken als genoemd in
      [artikel 41b van het Organisatiebesluit Ministerie van Financiën 2020][ref1] en zoals nader uitgewerkt in de
      [Regeling taakuitoefening en bevoegdheden IBTD][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0043027#Artikel41b
      [ref2]: https://wetten.overheid.nl/BWBR0046866
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel43c
    references:
      - id: ref1
        bwb_id: BWBR0043027
        artikel: 41b
      - id: ref2
        bwb_id: BWBR0046866
  - number: 43c.1.b
    text: 'de Minister van Binnenlandse Zaken en Koninkrijksrelaties:'
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel43c
  - number: 43c.1.b.1°
    text: gegevens ten behoeve van de aan de Algemene Inlichtingen- en Veiligheidsdienst opgedragen taken;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel43c
  - number: 43c.1.b.2°
    text: |-
      gegevens over het inkomen van voormalige ambtenaren over een bepaalde periode ten behoeve van de uitvoering van
      ontslaguitkeringsregelingen van de sector Rijk;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel43c
  - number: 43c.1.b.3°
    text: |-
      gegevens over het inkomen van voormalige ambtsdragers over een bepaalde periode ten behoeve van de uitvoering van
      de wachtgeldregeling op basis van de [Algemene pensioenwet politieke ambtsdragers][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002691
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel43c
    references:
      - id: ref1
        bwb_id: BWBR0002691
  - number: 43c.1.b.4°
    text: |-
      gegevens over het inkomen van commissarissen van de Koning, burgemeesters, gedeputeerden, wethouders, voorzitters
      van waterschappen en leden van het dagelijks bestuur van waterschappen over een bepaalde periode ten behoeve van de
      uitvoering van verrekeningsregelingen bij neveninkomsten;
    url: https://wetten.overheid.nl/BWBR0006736/2026-01-01#Artikel43c
  - number: 43c.1.b.5°
    text: |-
