      volzin is niet van toepassing op de verstrekking van gegevens als bedoeld in het eerste lid, onderdeel l, onder 3°,
      en onderdeel aa, alsmede de onderdelen i en t voor zover het gegevens betreft die worden verstrekt aan de landelijk
      directeur van de Belastingdienst/Grote ondernemingen.
