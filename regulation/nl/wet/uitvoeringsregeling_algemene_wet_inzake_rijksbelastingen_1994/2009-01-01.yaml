  - number: '1.2'
    text: |-
      Deze regeling verstaat onder wet: de [Algemene wet inzake rijksbelastingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: '2.1'
    text: |-
      Met betrekking tot belastingen welke bij wege van aanslag worden geheven, is de belastingplichtige die niet
      binnen zes maanden na het tijdstip waarop de belastingschuld is ontstaan is uitgenodigd tot het doen van aangifte,
      gehouden de inspecteur om uitnodiging tot het doen van aangifte te verzoeken.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel2
  - number: '2.2'
    text: |-
      In afwijking van het eerste lid is, met betrekking tot het recht van successie en het recht van overgang, de
      belastingplichtige die niet binnen de in [artikel 45 van de Successiewet 1956][ref1] bedoelde termijn van acht
      maanden is uitgenodigd tot het doen van aangifte, gehouden de inspecteur om uitnodiging tot het doen van aangifte
      te verzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel45
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '45'
  - number: '2.3'
    text: |-
      In afwijking van het eerste lid is, met betrekking tot het recht van schenking, de belastingplichtige begiftigde,
      alsmede de schenker die de belastbare schenking heeft gedaan, die niet binnen twee maanden na het einde van
      het kalenderjaar waarin de schenking heeft plaatsgevonden is uitgenodigd tot het doen van aangifte, gehouden de
      inspecteur om uitnodiging tot het doen van aangifte te verzoeken.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel2
  - number: '2.4'
    text: |-
      Het verzoek wordt ingediend binnen twee weken na het verstrijken van de in het eerste, tweede en derde lid bedoelde
      tijdvakken.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel2
  - number: '2.5'
    text: |-
      Voor de toepassing van het eerste lid wordt een belastingschuld waarvan de grootte eerst kan worden vastgesteld
      na afloop van het tijdvak waarover de belasting wordt geheven, geacht te zijn ontstaan op het tijdstip waarop dat
      tijdvak of de belastingplicht eindigt.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel2
  - number: '2.6'
    text: |-
      Het eerste lid is niet van toepassing, indien over het tijdvak waarover de belasting wordt geheven reeds een
      aanslag is opgelegd, dan wel redelijkerwijs moet worden aangenomen dat over dat tijdvak, na verrekening van
      voorheffingen, geen belasting verschuldigd is of geen aanslag zal worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel2
  - number: '3.1'
    text: |-
      Met betrekking tot de belastingen welke op aangifte moeten worden voldaan of afgedragen, is de belastingplichtige,
      onderscheidenlijk de inhoudingsplichtige, die niet reeds is uitgenodigd tot het doen van aangifte, gehouden vóór
      het tijdstip waarop de belasting moet worden betaald, de inspecteur om uitnodiging tot het doen van aangifte te
      verzoeken.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel3
  - number: '3.2'
    text: |-
      Een lichaam als bedoeld in [artikel 4, eerste lid, onderdeel a, van de Wet op belastingen van rechtsverkeer][ref1],
      dat weet of redelijkerwijs moet vermoeden dat een verkrijging van aandelen in dat lichaam heeft plaatsgehad onder
      de in die bepaling genoemde omstandigheden, is gehouden vóór het tijdstip waarop de belasting ter zake van die
      verkrijging moet worden betaald, de inspecteur om uitnodiging tot het doen van aangifte te verzoeken, zo het
      lichaam niet reeds met het oog op die verkrijging is uitgenodigd tot het doen van aangifte.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel4
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '4'
  - number: '3.3'
    text: |-
      Een vereniging als bedoeld in [artikel 4, eerste lid, onderdeel b, van de Wet op belastingen van rechtsverkeer][ref1],
      die voor een bepaald kalenderjaar niet reeds is uitgenodigd tot het doen van aangifte, is gehouden binnen veertien
      dagen na afloop daarvan de inspecteur om uitnodiging tot het doen van aangifte te verzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel4
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '4'
  - number: '4'
    text: |-
      De in de [artikelen 2][ref1] en [3][ref2] omschreven verplichtingen gelden mede voor de in de [artikelen 43][ref3]
      en [44 van de wet][ref4] bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006736#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel43
      [ref4]: https://wetten.overheid.nl/BWBR0002740#Artikel44
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0006736
        artikel: '3'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '43'
      - id: ref4
        bwb_id: BWBR0002740
        artikel: '44'
  - number: 4a
    text: |-
      Het uitnodigen tot het doen van aangifte geschiedt door het uitreiken of toezenden van een aangiftebrief waaruit
      blijkt de wijze van het doen van aangifte, een omschrijving van de gevraagde gegevens of bescheiden en de termijn
      waarbinnen aangifte moet worden gedaan.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel4a
  - number: '20.1'
    text: |-
      Aangifte wordt gedaan door het op de in de aangiftebrief, bedoeld in [artikel 4a][ref1], aangegeven wijze,
      inleveren of toezenden van de gevraagde gegevens of bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel4a
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: 4a
        hoofdstuk: '3'
  - number: '20.2'
    text: |-
      Aangifte door een administratieplichtige als bedoeld in [artikel 52, tweede lid, van de wet][ref1] wordt langs
      elektronische weg gedaan indien het betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel52
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '52'
  - number: 20.2.a
    text: |-
      de inkomstenbelasting: ingeval de administratieplichtige, bedoeld in
      [artikel 52, tweede lid, onderdeel b, van de wet][ref1] binnenlands belastingplichtige is;


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel52
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '52'
  - number: 20.2.b
    text: 'de vennootschapsbelasting: ingeval de administratieplichtige binnenlands belastingplichtige is;'
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel20
  - number: 20.2.c
    text: |-
      de omzetbelasting: ingeval de administratieplichtige of diens fiscale vertegenwoordiger als bedoeld in de
      [Wet op de omzetbelasting 1968][ref1], in Nederland woont of is gevestigd;


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: 20.2.d
    text: de loonbelasting;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel20
  - number: 20.2.e
    text: de accijns;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel20
  - number: 20.2.f
    text: de verbruiksbelastingen van alcoholvrije dranken en van enkele andere produkten;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel20
  - number: 20.2.g
    text: de verpakkingenbelasting.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel20
  - number: '20.3'
    text: |-
      De inspecteur kan al dan niet op verzoek bij voor bezwaar vatbare beschikking ontheffing verlenen van een van de
      in het tweede lid bedoelde verplichtingen indien het langs elektronische weg aangifte doen onredelijk bezwarend
      is voor de administratieplichtige. De ontheffing geldt voor maximaal een jaar. De inspecteur kan de beschikking
      waarbij ontheffing is verleend intrekken bij voor bezwaar vatbare beschikking indien blijkt dat ten onrechte
      ontheffing is verleend dan wel dat de gronden voor ontheffing zich niet langer voordoen.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel20
  - number: '20.4'
    text: |-
      Het tweede lid is niet van toepassing met betrekking tot pseudo-eindheffing als bedoeld in
      [artikel 32bb van de Wet op de loonbelasting 1964][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel32bb
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 32bb
  - number: '21.1'
    text: |-
      Met betrekking tot het recht van successie, het recht van schenking en het recht van overgang verleent de
      inspecteur ontheffing van de verplichting de in de uitnodiging tot het doen van aangifte gevraagde gegevens en
      bescheiden en andere gegevensdragers of de inhoud daarvan in te leveren of toe te zenden indien:
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel21
  - number: 21.1.a
    text: |-
      de belastingplichtige binnen de voor het doen van aangifte gestelde termijn op een andere wijze de in de
      uitnodiging tot het doen van aangifte gevraagde gegevens en bescheiden en andere gegevensdragers of de inhoud
      daarvan verstrekt;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel21
  - number: 21.1.b
    text: |-
      de belastingplichtige het stuk dat deze gegevens bevat duidelijk, stellig en zonder voorbehoud opstelt en
      ondertekent.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel21
  - number: '21.2'
    text: |-
      De belastingplichtige is niet gehouden tot de verplichting, bedoeld in [artikel 2, tweede en derde lid][ref1],
      indien hij binnen de aldaar gestelde termijnen heeft voldaan aan de in het eerste lid, onderdelen a en b, gestelde
      voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel2
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: '2'
        hoofdstuk: '2'
  - number: 21a.1
    text: |-
      Met betrekking tot de overdrachtsbelasting ter zake van een verkrijging van andere goederen dan bedoeld in
      [artikel 4, eerste lid, onderdeel a, van de Wet op belastingen van rechtsverkeer][ref1], waarvan een notariële akte
      is opgemaakt, wordt aangifte gedaan door het aanbieden van die akte ter registratie. Het verschuldigde bedrag aan
      overdrachtsbelasting wordt vermeld in een aan de voet van de akte gestelde, door de verkrijger of namens deze door
      de notaris ondertekende verklaring. In die verklaring wordt tevens vermeld of in verband met de verkrijging van
      de onroerende zaak of zaken tevens een of meer roerende zaken zijn verkregen. Indien dat het geval is, wordt in de
      verklaring voorts vermeld welke roerende zaak of zaken het betreft, voor welk bedrag deze werd of werden verkregen
      en of dat bedrag is begrepen in de in de akte vermelde tegenprestatie voor de onroerende zaak of zaken. Voorzover
      overigens in de akte niet alle gegevens voorkomen waarvan kennisneming van belang kan zijn voor de heffing van de
      overdrachtsbelasting worden deze eveneens opgenomen in de verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel4
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '4'
  - number: 21a.2
    text: |-
      Voorzover de gegevens, bedoeld in de vierde volzin van het eerste lid, zijn opgenomen in het lichaam van de akte of
      in een aan de akte gehechte en door de verkrijger ondertekende bijlage kan in de verklaring worden volstaan met een
      verwijzing naar die gegevens.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel21a
  - number: 21a.3
    text: |-
      De aangifte, bedoeld in het eerste lid, kan worden gedaan door een afschrift van de aldaar bedoelde akte, vergezeld
      van het daartoe door de Belastingdienst beschikbaar gestelde voorblad, langs elektronische weg ter registratie aan
      te bieden. Dit voorblad treedt dan in de plaats van de in het eerste lid bedoelde verklaring.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel21a
  - number: 21b
    text: |-
      Aan de verplichting, bedoeld in [artikel 54 van de Wet op belastingen van rechtsverkeer][ref1], wordt voldaan
      door het duidelijk, stellig en zonder voorbehoud invullen, ondertekenen en inleveren of toezenden van het door de
      inspecteur uitgereikte of toegezonden meldingsbiljet.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel54
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel21b
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '54'
  - number: 21c
    text: |-
      De aangifte, bedoeld in [artikel 10, van de Wet op de dividendbelasting 1965][ref1], wordt gedaan binnen drie jaren
      na afloop van het kalenderjaar waarin de opbrengst ter beschikking is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002515#Artikel10
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel21c
    references:
      - id: ref1
        bwb_id: BWBR0002515
        artikel: '10'
  - number: '22'
    text: |-
      Van de verplichting de in de uitnodiging tot het doen van aangifte gevraagde gegevens en bescheiden en andere
      gegevensdragers of de inhoud daarvan in te leveren of toe te zenden, kan de inspecteur ontheffing verlenen
      ingeval degene die is uitgenodigd tot het doen van aangifte, op een binnen de door de inspecteur ingevolge
      [artikel 9, eerste tot en met derde lid, van de wet][ref1] gestelde termijn ingediend verzoek opnieuw is
      uitgenodigd tot het doen van aangifte.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel9
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '9'
  - number: '23.1'
    text: |-
      De inspecteur legt een voorlopige aanslag op, indien het bedrag waarop de aanslag vermoedelijk zal worden
      vastgesteld, na verrekening van voorheffingen en reeds opgelegde voorlopige aanslagen, zulks naar zijn mening
      rechtvaardigt.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel23
  - number: '23.2'
    text: |-
      De bepaling van het bedrag waarop een voorlopige aanslag die wordt vastgesteld in het tijdvak waarover de belasting
      wordt geheven, dan wel na het tijdstip waarop de belastingschuld is ontstaan, kan geschieden:
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel23
  - number: 23.2.a
    text: |-
      voor de inkomstenbelasting: op grond van de gegevens die hebben gediend ter vaststelling van de meest recente
      belastingaanslag over het meest recente kalenderjaar;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel23
  - number: 23.2.b
    text: |-
      voor de vennootschapsbelasting: op grond van het gemiddelde dat voortvloeit uit de gegevens die hebben gediend ter
      vaststelling van de meest recente belastingaanslag over elk van de twee voorafgaande jaren; met dien verstande dat
      daarbij op benaderende wijze rekening kan worden gehouden met wijzigingen in de wettelijke bepalingen betreffende
      de heffing van de belasting alsmede met andere wijzigingen die voor de heffing van de belasting van belang kunnen
      zijn.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel23
  - number: '23.3'
    text: |-
      De voorlopige aanslag van een fiscale eenheid als bedoeld in
      [artikel 15 van de Wet op de vennootschapsbelasting 1969][ref1], wordt, over het jaar waarin het voegingstijdstip
      valt, alsmede die over het daaropvolgende jaar, vastgesteld alsof de moedermaatschappij en de dochtermaatschappij
      gedurende de twee voorafgaande jaren reeds verenigd waren.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '15'
  - number: '24'
    text: |-
      Indien een voorlopige aanslag inkomstenbelasting is of zal worden vastgesteld en een relevante wijziging
      optreedt in de omstandigheden die van belang zijn voor de opgelegde of op te leggen voorlopige aanslag, doet
      de belastingplichtige daarvan zo spoedig mogelijk op de door de inspecteur aangewezen wijze mededeling aan de
      inspecteur.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel24
  - number: '25.1'
    text: |-
      Het tijdvak waarover de omzetbelasting, de belasting van personenauto’s en motorrijwielen, de assurantiebelasting
      en de vliegbelasting moeten worden betaald, is het kalenderkwartaal of, indien de inspecteur zulks vordert, dan wel
      de belastingplichtige over een kalendermaand aangifte doet, de kalendermaand.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel25
  - number: '25.2'
    text: |-
      Ten aanzien van de belastingplichtige met een boekjaar van twaalf maanden dat niet samenvalt met het kalenderjaar,
      treden de boekjaarkwartalen en de boekjaarmaanden in de plaats van de kalenderkwartalen, onderscheidenlijk de
      kalendermaanden.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel25
  - number: '25.3'
    text: |-
      In bijzondere gevallen kan de inspecteur een ander tijdvak dan een kwartaal of een maand aanwijzen als tijdvak
      waarover de in het eerste lid bedoelde belastingen moeten worden betaald.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel25
  - number: '25.4'
    text: |-
      Het tijdvak waarover de in het eerste lid bedoelde belastingen moeten worden betaald, wordt ten aanzien van
      degene die op enig tijdstip - anders dan tijdelijk - ophoudt belastingplichtige te zijn, vervangen door het op dat
      tijdstip verstreken gedeelte van dat tijdvak.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel25
  - number: '26.1'
    text: |-
      Het tijdvak waarover de accijnzen, de verbruiksbelastingen van alcoholvrije dranken en van pruimtabak en
      snuiftabak, de kansspelbelasting geheven van degene die gelegenheid geeft tot deelneming aan binnenlandse
      casinospelen of aan binnenlandse kansspelen welke via het internet worden gespeeld, of van de exploitant van een
      kansspelautomatenspel, de belastingen op grondwater, op leidingwater, op afvalstoffen en op kolen, alsmede de
      energiebelasting, moeten worden betaald, is de kalendermaand.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel26
  - number: '26.2'
    text: |-
      Ten aanzien van de belastingplichtige met een boekjaar van twaalf maanden dat niet samenvalt met het kalenderjaar,
      treden de boekjaarmaanden in de plaats van de kalendermaanden.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel26
  - number: '26.3'
    text: |-
      In bijzondere gevallen kan de inspecteur een ander tijdvak dan de kalendermaand aanwijzen als tijdvak waarover de
      in het eerste lid bedoelde belastingen moeten worden betaald.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel26
  - number: '26.4'
    text: |-
      Het tijdvak waarover de in het eerste lid bedoelde belastingen moeten worden betaald, wordt ten aanzien van
      degene die op enig tijdstip - anders dan tijdelijk - ophoudt belastingplichtige te zijn, vervangen door het op dat
      tijdstip verstreken gedeelte van dat tijdvak.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel26
  - number: '27.1'
    text: Het tijdvak waarover de verpakkingenbelasting moet worden betaald, is het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel27
  - number: '27.2'
    text: |-
      De ondernemer die over enig kalenderjaar verpakkingenbelasting moet betalen, doet uiterlijk aan het einde van het
      eerste, het tweede, het derde en het vierde kwartaal van dat jaar, een voorlopige betaling. Deze betaling bedraagt
      25% van de verpakkingenbelasting die over het voorafgaande kalenderjaar verschuldigd zou zijn op basis van het
      tarief dat geldt voor het kalenderjaar waarin de voorlopige betalingen moeten worden gedaan.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel27
  - number: '27.3'
    text: |-
      De ondernemer die voor het eerst over een kalenderjaar verpakkingenbelasting moet betalen, doet uiterlijk aan
      het einde van ieder resterend kwartaal van dat jaar, een voorlopige betaling. Deze betaling bedraagt in afwijking
      van het bepaalde in het tweede lid een evenredig deel van het geschatte bedrag van de over dat jaar verschuldigde
      verpakkingenbelasting. Het evenredig deel wordt bepaald door 1 te delen door het aantal nog resterende kwartalen
      van het kalenderjaar. Hierbij wordt een gedeelte van een resterend kwartaal aangemerkt als een vol kwartaal.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel27
  - number: '27.4'
    text: |-
      Voor de ondernemer die in het voorafgaande kalenderjaar voor het eerst verpakkingenbelasting moest betalen,
      bedraagt de voorlopige betaling in afwijking van het bepaalde in het tweede lid 25% van de verpakkingenbelasting
      die over het voorafgaande kalenderjaar verschuldigd zou zijn op basis van de fictie dat de ondernemer in het
      voorafgaande kalenderjaar gedurende het volle kalenderjaar belastingplichtig was voor de verpakkingenbelasting en
      op basis van het tarief dat geldt voor het kalenderjaar waarin de voorlopige betalingen moeten worden gedaan.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel27
  - number: '27.5'
    text: De inspecteur kan toestemming geven voorlopige betalingen te doen ter grootte van een ander bedrag.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel27
  - number: '28.1'
    text: |-
      Het tijdvak waarover de loonbelasting moet worden betaald is de kalendermaand of periode van vier aaneengesloten
      weken. De inspecteur deelt aan de inhoudingsplichtige mee welk tijdvak voor hem in een kalenderjaar van toepassing
      is.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel28
  - number: '28.2'
    text: |-
      Bij een tijdvak van vier aaneengesloten weken vangt het eerste tijdvak van het kalenderjaar aan op de maandag
      voorafgaande aan de eerste donderdag van het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel28
  - number: '28.3'
    text: Bij een tijdvak van vier aaneengesloten weken bevat het kalenderjaar maximaal 13 tijdvakken.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel28
  - number: '28.4'
    text: 'Bij een tijdvak van vier aaneengesloten weken geldt, in zoverre in afwijking van het tweede lid, dat:'
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel28
  - number: 28.4.a
    text: |-
      ingeval het eerste tijdvak van het kalenderjaar aanvangt na 1 januari van het kalenderjaar, de periode vanaf
      1 januari tot de aanvang van het eerste tijdvak wordt toegevoegd aan dat eerste tijdvak;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel28
  - number: 28.4.b
    text: |-
      ingeval het laatste tijdvak van het kalenderjaar eindigt voor 31 december van het kalenderjaar, de periode na het
      einde van het laatste tijdvak tot en met 31 december van het kalenderjaar wordt toegevoegd aan dat laatste tijdvak;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel28
  - number: 28.4.c
    text: |-
      ingeval het eerste tijdvak van het kalenderjaar aanvangt in het vorige kalenderjaar, de periode tot en met
      31 december van het vorige kalenderjaar wordt toegevoegd aan het laatste tijdvak van het vorige kalenderjaar;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel28
  - number: 28.4.d
    text: |-
      ingeval het laatste tijdvak van het kalenderjaar eindigt in het volgende kalenderjaar, de periode vanaf 1 januari
      van het volgende kalenderjaar wordt toegevoegd aan het eerste tijdvak van het volgende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel28
  - number: '28.5'
    text: |-
      Het tijdvak waarover de loonbelasting moet worden betaald, wordt ten aanzien van degene die op enig tijdstip –
        anders dan tijdelijk – ophoudt inhoudingsplichtige te zijn, vervangen door het op dat tijdstip verstreken gedeelte
      van dat tijdvak.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel28
  - number: '29'
    text: |-
      In afwijking van [artikel 28, eerste lid][ref1], is het tijdvak waarover de loonbelasting moet worden betaald:


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel28
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: '28'
        hoofdstuk: '6'
  - number: 29.a
    text: |-
      voor de zelfstandige binnenschipper die woonplaats heeft gekozen ingevolge
      [artikel 1, eerste lid, van het Uitvoeringsbesluit Algemene wet inzake rijksbelastingen 1964][ref1]: het
      kalenderhalfjaar, tenzij de inspecteur vordert dat [artikel 28][ref2] ten aanzien van deze binnenschipper van
      toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0002473#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006736#Artikel28
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002473
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006736
        artikel: '28'
        hoofdstuk: '6'
  - number: 29.b
    text: |-
      voor de natuurlijke persoon ter zake van de loonbelasting van de werknemer die uitsluitend of nagenoeg uitsluitend
      diensten verricht ten behoeve van diens huishouden, daaronder begrepen het verlenen van zorg aan de leden van dat
      huishouden: het kalenderjaar;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel29
  - number: 29.c
    text: |-
      voor de ouder ter zake van de loonbelasting van zijn in zijn onderneming werkzame kinderen voorzover de belasting
      is geheven door inhouding volgens [artikel 10g van het Uitvoeringsbesluit loonbelasting 1965][ref1]: het
      kalenderjaar;


      [ref1]: https://wetten.overheid.nl/BWBR0002489#Artikel10g
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002489
        artikel: 10g
  - number: 29.d
    text: |-
      voor de natuurlijke persoon ter zake van de loonbelasting van de werknemer die
      uitsluitend diensten verricht in het kader van voorzieningen als bedoeld in
      [artikel 35, tweede lid, onderdelen b en d, van de Wet werk en inkomen naar arbeidsvermogen][ref1]: het
      kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel35
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '35'
  - number: '30.1'
    text: |-
      De inspecteur verleent op verzoek van de belastingplichtige, onderscheidenlijk de inhoudingsplichtige, uitstel
      van betaling van loonbelasting of omzetbelasting over een tijdvak, indien met betrekking tot dat tijdvak, dan wel
      een tijdvak dat is geëindigd vóór of tegelijk met dat tijdvak, door die belastingplichtige, onderscheidenlijk die
      inhoudingsplichtige, een verzoek om teruggaaf van omzetbelasting is gedaan vanwege het feit dat de verschuldigde
      omzetbelasting minder beloopt dan de voor aftrek in aanmerking komende omzetbelasting. Ingeval loonbelasting moet
      worden betaald over een tijdvak van vier weken dat niet aan het einde van een kalendermaand eindigt, wordt voor de
      toepassing van de eerste volzin:
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel30
  - number: 30.1.a
    text: dat tijdvak geacht te zijn geëindigd aan het einde van de kalendermaand waarin het tijdvak is geëindigd;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel30
  - number: 30.1.b
    text: |-
      het twaalfde tijdvak van het kalenderjaar, in afwijking van onderdeel a, geacht te zijn geëindigd aan het einde van
      het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel30
  - number: '30.2'
    text: Uitstel wordt slechts verleend tot het beloop van de teruggaaf omzetbelasting.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel30
  - number: '30.3'
    text: 'Uitstel wordt niet verleend indien:'
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel30
  - number: 30.3.a
    text: de aangifte waarvan uitstel wordt verzocht niet tijdig is gedaan;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel30
  - number: 30.3.b
    text: het verzoek niet uiterlijk gelijktijdig met de in onderdeel a bedoelde aangifte is gedaan;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel30
  - number: 30.3.c
    text: |-
      het verzoek niet mede bevat een machtiging aan de ontvanger om de teruggaaf omzetbelasting aan te wenden voor de
      betaling op de aangifte waarvan uitstel wordt verzocht; of
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel30
  - number: 30.3.d
    text: |-
      de teruggaaf omzetbelasting op de voet van [artikel 24 van de Invorderingswet 1990][ref1] kan worden verrekend met
      onherroepelijk vaststaande belastingaanslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel24
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '24'
  - number: '30.4'
    text: |-
      Indien degene die het verzoek om uitstel doet een dochtermaatschappij, onderscheidenlijk een
      moedermaatschappij is met betrekking tot welke vennootschapsbelasting wordt geheven met toepassing van
      [artikel 15 van de Wet op de vennootschapsbelasting 1969][ref1], is het eerste lid eveneens van toepassing
      indien het verzoek om teruggaaf van omzetbelasting is gedaan door de moedermaatschappij, dan wel door een andere
      dochtermaatschappij die voor de heffing van vennootschapsbelasting in deze is opgegaan, onderscheidenlijk door
      een dochtermaatschappij.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '15'
  - number: 30a
    text: |-
      De inspecteur bepaalt zo spoedig mogelijk doch binnen vijf werkdagen na de ontvangst van een terugmelding als
      bedoeld in [artikel 21d, eerste lid, onderdeel a, van de wet][ref1] of het ontstaan van een situatie als bedoeld
      in [artikel 21d, eerste lid, onderdeel d, van de wet][ref2], of de aantekening ‘in onderzoek’ al dan niet wordt
      geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel21d
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel21d
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 21d
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 21d
  - number: 30b
    text: 'De inspecteur vermindert ambtshalve een inkomensgegeven dat op een te hoog bedrag is bepaald, tenzij:'
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel30b
  - number: 30b.a
    text: zeven jaren zijn verlopen na het einde van het kalenderjaar waarop het inkomensgegeven betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel30b
  - number: 30b.b
    text: |-
      de onjuistheid van het inkomensgegeven voortvloeit uit jurisprudentie die eerst is gewezen nadat de met het
      inkomensgegeven samenhangende inkomstenbelasting- of loonbelastingschuld onherroepelijk vast is komen te staan,
      tenzij de Minister van Financiën anders heeft bepaald;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel30b
  - number: 30b.c
    text: |-
      de onjuistheid van het inkomensgegeven voortvloeit uit beleidsregels van de Minister van Financiën die eerst
      zijn uitgevaardigd nadat de met het inkomensgegeven samenhangende inkomstenbelasting- of loonbelastingschuld
      onherroepelijk vast is komen te staan, tenzij de Minister van Financiën anders heeft bepaald;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel30b
  - number: 30b.d
    text: |-
      de onjuistheid van het inkomensgegeven voortvloeit uit de omstandigheid dat eerst nadat de met het inkomensgegeven
      samenhangende inkomstenbelasting- of loonbelastingschuld onherroepelijk vast is komen te staan een beroep wordt
      gedaan op een fiscale faciliteit, waarop een beroep moet worden gedaan bij de aangifte, onderscheidenlijk vóór de
      inhouding; of
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel30b
  - number: 30b.e
    text: |-
      sprake is van enig feit waardoor het inkomensgegeven op een te hoog bedrag is bepaald en enig ander
      inkomensgegeven, al dan niet van dezelfde betrokkene, ter zake van datzelfde feit op een te laag bedrag is bepaald,
      voor zover de met het laatstgenoemde inkomensgegeven samenhangende inkomstenbelasting of loonbelasting niet kan
      worden nagevorderd, onderscheidenlijk nageheven doordat de termijn voor navordering, onderscheidenlijk naheffing
      is verstreken.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel30b
  - number: '31.1'
    text: |-
      Bij de bepaling van het aantal dagen waarover ingevolge hoofdstuk VA van de wet heffingsrente wordt berekend, wordt
      een volle kalendermaand gesteld op 30 dagen, met uitzondering van de maand op de laatste dag waarvan het tijdvak
      waarover de rente wordt berekend eindigt, in welk geval het werkelijke aantal dagen in aanmerking wordt genomen.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel31
  - number: '31.2'
    text: Het bedrag van de in rekening te brengen heffingsrente wordt naar beneden afgerond op gehele euro’s.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel31
  - number: '31.3'
    text: Het bedrag van de te vergoeden heffingsrente wordt naar boven afgerond op gehele euro’s.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel31
  - number: '32.1'
    text: |-
      Een op grond van [artikel 39 van de wet][ref1] te verlenen vrijstelling wordt:


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel39
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '39'
  - number: 32.1.a
    text: voorwaardelijk verleend;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel32
  - number: 32.1.b
    text: voor goederen of diensten verleend voor redelijke hoeveelheden.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel32
  - number: '32.2'
    text: |-
      Een in het eerste lid bedoelde vrijstelling vervalt wanneer niet of niet langer wordt voldaan aan de voorwaarden
      die voor de vrijstelling gelden. Aan de voorwaarden die voor een vrijstelling gelden, wordt in ieder geval niet
      voldaan wanneer een goed of de nutswaarde van een dienst ten aanzien waarvan vrijstelling is verleend, geheel of
      gedeeltelijk wordt gebruikt door of ten goede komt aan een ander dan degene ten behoeve van wie de vrijstelling
      is verleend. Indien een instelling of persoon niet langer aanspraak heeft op een in het eerste lid bedoelde
      vrijstelling, vervalt de vrijstelling voor in het verleden met vrijstelling aangeschafte goederen en diensten,
      voorzover het goed of het nut van de dienst geacht kan worden nog niet volledig te zijn verbruikt.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel32
  - number: '32.3'
    text: |-
      Wanneer een in het eerste lid bedoelde vrijstelling vervalt, is de belasting waarvan vrijstelling is verleend,
      verschuldigd door degene ten behoeve van wie de vrijstelling is verleend. De instelling of persoon wordt terzake
      aangemerkt als belastingplichtige. De verschuldigde belasting wordt berekend naar het tarief - en voorzover van
      toepassing de dagwaarde van het goed of de resterende nutswaarde van de dienst ten aanzien waarvan vrijstelling is
      verleend - op het moment dat de vrijstelling vervalt. Ingeval van oneigenlijk gebruik van een vrijstelling wordt de
      verschuldigde belasting vastgesteld op ten minste het bedrag waarvan vrijstelling werd verleend.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel32
  - number: '32.4'
    text: |-
      Een in het eerste lid bedoelde vrijstelling van omzetbelasting wordt verleend in de vorm van teruggaaf van betaalde
      belasting. Ingeval evenwel een prestatie wordt verricht aan een diplomatieke of consulaire vertegenwoordiging,
      een internationale organisatie, buitenlandse NAVO-strijdkrachten of een militaire begraafplaats, kan de ondernemer
      die de prestatie verricht, afzien van het in rekening brengen van omzetbelasting indien de instelling tijdig aan
      de ondernemer een geldige verklaring van de inspecteur ter beschikking stelt waaruit blijkt dat geen belasting in
      rekening hoeft te worden gebracht. Op verzoek van de in de tweede volzin bedoelde instelling geeft de inspecteur
      deze verklaring af indien naar zijn oordeel aanspraak bestaat op vrijstelling van omzetbelasting en de vergoeding
      ten minste € 35.000 bedraagt.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel32
  - number: '32.5'
    text: |-
      De in het eerste lid bedoelde vrijstellingen van omzetbelasting en accijns met betrekking tot motorbrandstoffen
      bestemd voor officieel gebruik door een diplomatieke of consulaire vertegenwoordiging of een internationale
      organisatie, of bestemd voor persoonlijk gebruik door een lid of personeelslid van een dergelijke instelling worden
      slechts verleend indien voor het motorrijtuig een CD-kenteken is afgegeven, dan wel een BN/GN-kenteken in de serie
      70-00 tot en met 88-99. De vrijstellingen wordt verleend in de vorm van teruggaaf van betaalde belasting.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel32
  - number: '32.6'
    text: |-
      Met inachtneming van hetgeen is bepaald in het eerste, tweede en derde lid wordt in gevallen waarin op grond van
      [artikel 39 van de wet][ref1] aanspraak bestaat op vrijstelling van belastingen bij invoer van een motorrijtuig
      mede een vrijstelling verleend van omzetbelasting bij levering dan wel intracommunautaire verwerving van een
      motorrijtuig. De voorwaarden en beperkingen van de desbetreffende vrijstelling van belastingen bij invoer zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel39
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '39'
  - number: '32.7'
    text: |-
      Voor de in het vijfde lid bedoelde instellingen en personen zijn ter zake van een in het eerste
      lid bedoelde vrijstelling van omzetbelasting met betrekking tot motorbrandstoffen, vrijstelling van
      accijns en vrijstelling van belasting van personenauto's en motorrijwielen de voorwaarden van de
      [artikelen 7:8 tot en met 7:14 van de Algemene douaneregeling][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024291#Artikel7
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0024291
        artikel: '7'
  - number: 32a.1
    text: |-
      In gevallen waarin op grond van [artikel 39 van de wet][ref1] een vrijstelling wordt verleend van omzetbelasting
      geheven ter zake van de levering van aardgas of elektriciteit, bestemd voor officieel gebruik door een diplomatieke
      of consulaire vertegenwoordiging, een internationale organisatie, buitenlandse NAVO-strijdkrachten of een militaire
      begraafplaats, wordt mede een vrijstelling verleend van energiebelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel39
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '39'
  - number: 32a.2
    text: |-
      De vrijstelling van energiebelasting wordt gerealiseerd door teruggaaf van in rekening gebrachte en betaalde
      belasting. De vrijstelling kan evenwel direct worden gerealiseerd ten aanzien van de NAVO, buitenlandse NAVO-
      strijdkrachten en militaire begraafplaatsen, indien de inspecteur aan degene die de levering verricht een
      vergunning heeft afgegeven om ter zake van die levering geen belasting in rekening te brengen.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel32a
  - number: 32a.3
    text: |-
      Een verzoek om teruggaaf van energiebelasting wordt ingediend binnen dertien weken nadat de eindafrekening
      van het energiedistributiebedrijf is verzonden. Bij het verzoek om teruggaaf wordt de eindfactuur van het
      energiedistributiebedrijf overgelegd. Deze factuur wordt bij de beschikking op het verzoek om teruggaaf
      teruggezonden. [Artikel 91 van de Wet belastingen op milieugrondslag][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel91
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '91'
  - number: 32b.1
    text: |-
      In gevallen waarin op grond van [artikel 39 van de wet][ref1] een vrijstelling wordt verleend van omzetbelasting
      geheven ter zake van de levering van water, bestemd voor officieel gebruik door een diplomatieke of consulaire
      vertegenwoordiging, een internationale organisatie, buitenlandse NAVO-strijdkrachten of een militaire
      begraafplaats, wordt mede een vrijstelling verleend van belasting op leidingwater.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel39
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '39'
  - number: 32b.2
    text: |-
      De vrijstelling van belasting op leidingwater wordt gerealiseerd door teruggaaf van in rekening gebrachte en
      betaalde belasting. De vrijstelling kan evenwel direct worden gerealiseerd ten aanzien van de NAVO, buitenlandse
      NAVO-strijdkrachten en militaire begraafplaatsen, indien de inspecteur aan degene die de levering verricht een
      vergunning heeft afgegeven om ter zake van die levering geen belasting in rekening te brengen.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel32b
  - number: 32b.3
    text: |-
      Een verzoek om teruggaaf van belasting op leidingwater wordt ingediend binnen dertien weken nadat
      de eindafrekening van het waterleidingbedrijf of van de afzonderlijke watervoorziening is verzonden.
      Bij het verzoek om teruggaaf wordt de eindfactuur van het waterleidingbedrijf of van de afzonderlijke
      watervoorziening overgelegd. Deze factuur wordt bij de beschikking op het verzoek om teruggaaf teruggezonden.
      [Artikel 91 van de Wet belastingen op milieugrondslag][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel91
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '91'
  - number: '33.1'
    text: |-
      Van de belastingen, genoemd in het derde lid van dit artikel zijn, met inachtneming van hetgeen is bepaald
      in de [artikelen 34][ref1], [36][ref2], [37][ref3] en [38][ref4], vrijgesteld de leden van diplomatieke
      vertegenwoordigingen en, met uitzondering van honoraire consuls, de leden van consulaire vertegenwoordigingen van
      andere Mogendheden, mits zij:


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0006736#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0006736#Artikel37
      [ref4]: https://wetten.overheid.nl/BWBR0006736#Artikel38
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: '34'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0006736
        artikel: '36'
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0006736
        artikel: '37'
        hoofdstuk: '9'
      - id: ref4
        bwb_id: BWBR0006736
        artikel: '38'
        hoofdstuk: '9'
  - number: 33.1.a
    text: geen Nederlander zijn; en
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel33
  - number: 33.1.b
    text: niet duurzaam verblijf houden in Nederland.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel33
  - number: '33.2'
    text: |-
      De vrijstelling voor de in het eerste lid bedoelde personen vindt overeenkomstige toepassing ten aanzien van de
      bij hen inwonende gezinsleden en, onder voorwaarde van wederkerigheid, de bij hen in dienstbetrekking staande
      particuliere bedienden, mits zij:
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel33
  - number: 33.2.a
    text: geen Nederlander zijn; en
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel33
  - number: 33.2.b
    text: niet duurzaam verblijf houden in Nederland.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel33
  - number: '33.3'
    text: 'De in dit artikel bedoelde vrijstelling vindt toepassing met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel33
  - number: 33.3.a
    text: de inkomstenbelasting;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel33
  - number: 33.3.b
    text: de loonbelasting;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel33
  - number: 33.3.c
    text: de omzetbelasting;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel33
  - number: 33.3.d
    text: de motorrijtuigenbelasting;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel33
  - number: 33.3.e
    text: de belasting van personenauto’s en motorrijwielen;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel33
  - number: 33.3.f
    text: de kansspelbelasting.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel33
  - number: '33.4'
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van de functionarissen van internationale
      organisaties die ingevolge [artikel 39 van de wet][ref1] in aanmerking komen voor de vrijstellingen zoals die
      worden verleend aan leden van diplomatieke vertegenwoordigingen. Het tweede lid is van overeenkomstige toepassing
      ten aanzien van de inwonende gezinsleden van functionarissen van internationale organisaties die ingevolge
      [artikel 39 van de wet][ref2] in aanmerking komen voor de fiscale vrijstellingen zoals die worden verleend aan de
      inwonende gezinsleden van leden van diplomatieke vertegenwoordigingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel39
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '39'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '39'
  - number: '33.5'
    text: |-
      De vrijstelling van omzetbelasting wordt slechts verleend onder voorwaarde van wederkerigheid; ten
      aanzien van functionarissen van internationale organisaties die ingevolge [artikel 39 van de wet][ref1] in
      aanmerking komen voor de vrijstellingen zoals die worden verleend aan diplomaten, wordt met inachtneming van
      [artikel 32, eerste lid][ref2], aangenomen dat aan de voorwaarde van wederkerigheid wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0006736#Artikel32
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '39'
      - id: ref2
        bwb_id: BWBR0006736
        artikel: '32'
        hoofdstuk: '9'
  - number: '34.1'
    text: |-
      De vrijstelling van inkomstenbelasting, bedoeld in [artikel 33][ref1], strekt zich niet uit tot het buiten het
      ambt of de betrekking genoten inkomen, bedoeld in [hoofdstuk 7 van de Wet inkomstenbelasting 2001][ref2]. Bij de
      berekening van de inkomstenbelasting over de niet-vrijgestelde inkomensbestanddelen wordt geen rekening gehouden
      met de vrijgestelde inkomensbestanddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: '33'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0011353
        hoofdstuk: '7'
  - number: '34.2'
    text: |-
      De vrijstelling van loonbelasting, bedoeld in [artikel 33][ref1], strekt zich niet uit tot het buiten het ambt of
      de betrekking genoten loon.


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel33
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: '33'
        hoofdstuk: '9'
  - number: '34.3'
    text: |-
      De vrijstelling van kansspelbelasting, bedoeld in [artikel 33][ref1], strekt zich niet uit tot prijzen van
      binnenlandse kansspelen.


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel33
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: '33'
        hoofdstuk: '9'
  - number: '35.1'
    text: |-
      Van de belastingen, genoemd in het tweede lid van dit artikel zijn, met inachtneming van hetgeen is bepaald
      in de [artikelen 36][ref1], [37][ref2], [38][ref3] en [39][ref4], vrijgesteld de diplomatieke en consulaire
      vertegenwoordigingen van andere Mogendheden, met uitzondering van honoraire consulaire vertegenwoordigingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0006736#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0006736#Artikel38
      [ref4]: https://wetten.overheid.nl/BWBR0006736#Artikel39
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: '36'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0006736
        artikel: '37'
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0006736
        artikel: '38'
        hoofdstuk: '9'
      - id: ref4
        bwb_id: BWBR0006736
        artikel: '39'
        hoofdstuk: '9'
  - number: '35.2'
    text: 'De in het eerste lid bedoelde vrijstelling vindt toepassing met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel35
  - number: 35.2.a
    text: de omzetbelasting;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel35
  - number: 35.2.b
    text: de motorrijtuigenbelasting;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel35
  - number: 35.2.c
    text: de belasting van personenauto’s en motorrijwielen;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel35
  - number: 35.2.d
    text: de overdrachtsbelasting.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel35
  - number: '35.3'
    text: |-
      Honoraire consulaire vertegenwoordigingen zijn, met inachtneming van hetgeen is bepaald in de [artikelen 36][ref1]
      en [39][ref2], vrijgesteld van:


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0006736#Artikel39
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: '36'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0006736
        artikel: '39'
        hoofdstuk: '9'
  - number: 35.3.a
    text: de omzetbelasting;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel35
  - number: 35.3.b
    text: de overdrachtsbelasting.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel35
  - number: '35.4'
    text: |-
      De in dit artikel bedoelde vrijstellingen van omzetbelasting en van motorrijtuigenbelasting worden slechts verleend
      onder voorwaarde van wederkerigheid.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel35
  - number: '35.5'
    text: |-
      De in dit artikel bedoelde vrijstellingen worden verleend aan het hoofd van de diplomatieke of consulaire
      vertegenwoordiging.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel35
  - number: '36.1'
    text: |-
      De vrijstelling van omzetbelasting ten behoeve van de in [artikel 33][ref1] bedoelde personen wordt verleend
      voor de levering van roerende zaken bestemd voor hun persoonlijk gebruik, met uitzondering van de levering van
      levensmiddelen, drank of tabakswaren. De vrijstelling wordt slechts verleend indien de vergoeding per factuur ten
      minste € 225 bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel33
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: '33'
        hoofdstuk: '9'
  - number: '36.2'
    text: |-
      De vrijstelling van omzetbelasting ten behoeve van de in [artikel 35, eerste lid][ref1], bedoelde diplomatieke en
      beroepsconsulaire vertegenwoordigingen wordt verleend voor de levering van goederen en het verrichten van diensten
      bestemd voor officieel gebruik van deze vertegenwoordigingen. Onder officieel gebruik wordt begrepen het huisvesten
      van leden van de vertegenwoordiging. De vrijstelling wordt slechts verleend indien de vergoeding per factuur ten
      minste € 225 bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel35
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: '35'
        hoofdstuk: '9'
  - number: '36.3'
    text: |-
      De vrijstelling van omzetbelasting ten behoeve van de in [artikel 35, derde lid][ref1], bedoelde honoraire
      consulaire vertegenwoordigingen wordt beperkt tot de volgende prestaties:


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel35
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: '35'
        hoofdstuk: '9'
  - number: 36.3.a
    text: |-
      de levering van onroerende zaken en van rechten waaraan deze zijn onderworpen, bestemd voor officieel gebruik van
      de vertegenwoordiging, daaronder begrepen onroerende zaken en rechten waaraan deze zijn onderworpen bestemd voor
      het huisvesten van de leden van de vertegenwoordiging, met uitzondering van honoraire consuls;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel36
  - number: 36.3.b
    text: |-
      de levering van goederen en het verrichten van diensten bestemd voor het bouwen, verbouwen, herstellen en
      onderhouden, hieronder niet begrepen het schoonmaken, van de officiële gebouwen van de vertegenwoordiging, met
      uitzondering van de woning van de honoraire consul;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel36
  - number: 36.3.c
    text: de verhuur aan de vertegenwoordiging van onroerende zaken, bestemd voor officieel gebruik.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel36
  - number: '36.4'
    text: |-
      De teruggaaf wordt uitsluitend verleend, indien de levering of de dienst wordt ingeschreven in een door de
      inspecteur op verzoek uitgereikt of toegezonden formulier, onder overlegging van een gedagtekende factuur, waarin
      op duidelijke en overzichtelijke wijze zijn vermeld:
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel36
  - number: 36.4.a
    text: de dag waarop de levering of de dienst wordt verricht;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel36
  - number: 36.4.b
    text: naam en adres van de ondernemer die de levering of de dienst verricht;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel36
  - number: 36.4.c
    text: naam en adres van degene aan wie de levering wordt verricht of de dienst verleend;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel36
  - number: 36.4.d
    text: een duidelijke omschrijving van de geleverde goederen of van de dienst;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel36
  - number: 36.4.e
    text: de hoeveelheid van de geleverde goederen;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel36
  - number: 36.4.f
    text: de vergoeding; en
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel36
  - number: 36.4.g
    text: het bedrag van de belasting dat ter zake van de levering of de dienst is verschuldigd.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel36
  - number: '36.5'
    text: |-
      Bij de aangifte ter verkrijging van teruggaaf wordt het in het vierde lid bedoelde formulier te zamen met de
      daarbij gevoegde facturen en eventuele bewijzen van betaling overgelegd. De facturen en eventuele bewijzen van
      betaling worden bij het afschrift van de beschikking op het verzoek om teruggaaf teruggezonden.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel36
  - number: '37.1'
    text: |-
      De vrijstelling van motorrijtuigenbelasting, bedoeld in de [artikelen 33][ref1] en [35][ref2], wordt verleend voor
      motorrijtuigen bestemd voor persoonlijk gebruik door de in [artikel 33][ref3] bedoelde personen of bestemd voor
      officieel gebruik ten behoeve van de in [artikel 35, eerste lid][ref4], bedoelde diplomatieke en beroepsconsulaire
      vertegenwoordigingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0006736#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0006736#Artikel33
      [ref4]: https://wetten.overheid.nl/BWBR0006736#Artikel35
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: '33'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0006736
        artikel: '35'
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0006736
        artikel: '33'
        hoofdstuk: '9'
      - id: ref4
        bwb_id: BWBR0006736
        artikel: '35'
        hoofdstuk: '9'
  - number: '37.2'
    text: |-
      De vrijstelling van motorrijtuigenbelasting wordt slechts verleend indien voor het motorrijtuig een CD-kenteken is
      afgegeven, dan wel een BN/GN-kenteken in de serie 70-00 tot en met 88-99 of in de serie 90-00 tot en met 99-99.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel37
  - number: '38.1'
    text: |-
      De vrijstelling van belasting van personenauto’s en motorrijwielen, bedoeld in de [artikelen 33][ref1]
      en [35][ref2], wordt verleend voor personenauto’s en motorrijwielen bestemd voor persoonlijk gebruik
      door de in [artikel 33][ref3] bedoelde personen of bestemd voor officieel gebruik ten behoeve van de in
      [artikel 35, eerste lid][ref4], bedoelde diplomatieke en beroepsconsulaire vertegenwoordigingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0006736#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0006736#Artikel33
      [ref4]: https://wetten.overheid.nl/BWBR0006736#Artikel35
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: '33'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0006736
        artikel: '35'
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0006736
        artikel: '33'
        hoofdstuk: '9'
      - id: ref4
        bwb_id: BWBR0006736
        artikel: '35'
        hoofdstuk: '9'
  - number: '38.2'
    text: |-
      De vrijstelling van belasting van personenauto’s en motorrijwielen wordt slechts verleend indien voor het
      motorrijtuig een CD-kenteken is afgegeven, dan wel een BN/GN-kenteken in de serie 70-00 tot en met 88-99 of in de
      serie 90-00 tot en met 99-99. Er wordt geen teruggaaf verleend van voor het motorrijtuig reeds betaalde belasting.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel38
  - number: '39.1'
    text: |-
      De vrijstelling van overdrachtsbelasting, bedoeld in [artikel 35][ref1], wordt verleend voor de belasting die is
      verschuldigd ter zake van de verkrijging door een vreemde Mogendheid van in Nederland gelegen onroerende zaken
      die bestemd zijn voor de huisvesting van een diplomatieke of consulaire vertegenwoordiging of die bestemd zijn
      voor bewoning door het hoofd van een diplomatieke of consulaire vertegenwoordiging, met uitzondering van honoraire
      consuls. De vrijstelling van overdrachtsbelasting wordt, onder voorwaarde van wederkerigheid, mede verleend
      voor de belasting die is verschuldigd ter zake van de verkrijging door een vreemde Mogendheid van in Nederland
      gelegen onroerende zaken die bestemd zijn voor bewoning door andere leden van een diplomatieke of consulaire
      vertegenwoordiging. Verkrijging wordt opgevat in de zin van de Wet op belastingen van rechtsverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel35
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: '35'
        hoofdstuk: '9'
  - number: '39.2'
    text: |-
      De vrijstelling wordt verleend in de vorm van teruggaaf van belasting, tenzij Onze Minister vooraf een vergunning
      heeft afgegeven om geen belasting te voldoen.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel39
  - number: '40.1'
    text: |-
      Een voorwaardelijke vrijstelling van omzetbelasting wordt verleend aan diplomatieke en consulaire
      vertegenwoordigingen, internationale organisaties en NAVO-strijdkrachten die in een andere lid-staat van de
      Europese Gemeenschappen zijn gevestigd, dan wel gelegerd, met uitzondering van NAVO-strijdkrachten van die lid-
      staat zelf.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel40
  - number: '40.2'
    text: |-
      Een voorwaardelijke vrijstelling van omzetbelasting wordt verleend aan personeelsleden van de in het eerste lid
      bedoelde instellingen.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel40
  - number: '40.3'
    text: |-
      Bij het verlenen van de in het eerste lid bedoelde vrijstellingen zijn de voorwaarden, zoals de andere lid-staat
      die voor het instelling, dan wel het personeelslid heeft vastgesteld voor de vrijstelling van omzetbelasting ter
      zake van prestaties in het binnenlandse vrije verkeer, van overeenkomstige toepassing. De vrijstellingen worden
      niet verleend voor goederen die bestemd zijn voor gebruik binnen Nederland, noch voor diensten verricht met
      betrekking tot dergelijke goederen.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel40
  - number: '40.4'
    text: |-
      De in het eerste en tweede lid bedoelde vrijstellingen worden slechts verleend, indien het instelling, dan wel het
      personeelslid een originele, door of namens de andere lid-staat gewaarmerkte verklaring overlegt waaruit blijkt dat
      ter zake aanspraak op vrijstelling van omzetbelasting bestaat. Voor deze verklaring dient gebruik te worden gemaakt
      van het communautaire document ter uitvoering van de vrijstelling omzetbelasting en accijns bij intracommunautaire
      aankopen door ambassades en consulaten en de leden daarvan, internationale organisaties en bepaalde functionarissen
      daarvan, en NAVO-onderdelen.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel40
  - number: '40.5'
    text: |-
      De in het eerste lid en tweede lid bedoelde vrijstelling kan direct worden verleend indien de instelling, dan
      wel het personeelslid, tijdig een geldige verklaring als bedoeld in het vierde lid ter beschikking stelt aan de
      ondernemer die de prestatie verricht. De in het eerste en tweede lid bedoelde vrijstelling kan worden verleend in
      de vorm van teruggaaf van belasting indien het bedrag van de vergoeding per factuur ten minste € 225 bedraagt.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel40
  - number: '40.6'
    text: |-
      De vrijstelling vervalt wanneer niet of niet langer wordt voldaan aan de in het derde lid bedoelde voorwaarden. De
      alsdan verschuldigde omzetbelasting bedraagt ten hoogste het bedrag waarvan vrijstelling werd verleend.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel40
  - number: '41'
    text: |-
      De werknemer die niet in Nederland woont en buiten Nederland in dienstbetrekking staat tot een Nederlandse
      publiekrechtelijke rechtspersoon, is, in afwijking in zoverre van artikel 2, derde en vierde lid, van de Wet op
      de loonbelasting 1964 en [artikel 7.2, zevende lid, van de Wet inkomstenbelasting 2001][ref1], vrijgesteld van
      loonbelasting onderscheidenlijk inkomstenbelasting indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel7
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '7'
  - number: 41.a
    text: |-
      ter zake van het loon van de werknemer niet een verdrag ter voorkoming van dubbele belasting, dan wel de
      Belastingregeling voor het Koninkrijk van toepassing is; en
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel41
  - number: 41.b
    text: de werknemer is aangeworven in het land waar hij werkzaam is; en
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel41
  - number: 41.c
    text: |-
      door de Mogendheid op wier grondgebied de dienstbetrekking wordt vervuld een overeenkomstig standpunt wordt
      ingenomen ten aanzien van werknemers van haar publiekrechtelijke rechtspersonen die werkzaam zijn in Nederland en
      alhier zijn aangeworven.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel41
  - number: 43a
    text: |-
      Aan de verplichting, bedoeld in [artikel 47b, tweede lid, van de wet][ref1] wordt voldaan voordat:


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel47b
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 47b
  - number: 43a.a
    text: een rekening waarop een saldo in geld of effecten kan worden aangehouden, wordt opengesteld;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel43a
  - number: 43a.b
    text: |-
      een contante uitbetaling ter zake van het verzilveren van coupons of vergelijkbare stukken van obligaties of
      vergelijkbare waardepapieren wordt verricht, of
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel43a
  - number: 43a.c
    text: een overeenkomst van levensverzekering wordt gesloten.
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel43a
  - number: 43b
    text: |-
      De in [artikel 22, eerste lid, van het Uitvoeringsbesluit inkomstenbelasting 2001][ref1] aangewezen
      administratieplichtigen zijn gehouden op de door de inspecteur voorgeschreven wijze de in
      [artikel 22, tweede lid, van het genoemd besluit][ref2] aangewezen gegevens en inlichtingen te verstrekken voor 1
      maart van het jaar volgend op het kalenderjaar waarover de gegevens en inlichtingen worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0012066#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0012066#Artikel22
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel43b
    references:
      - id: ref1
        bwb_id: BWBR0012066
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0012066
        artikel: '22'
  - number: 43c.1
    text: |-
      De geheimhoudingsplicht, bedoeld in [artikel 67, eerste lid, van de wet][ref1],
      [artikel 67, eerste lid, van de Invorderingswet 1990][ref2] en
      [artikel 10, eerste lid, van de Registratiewet 1970][ref3], geldt niet voor verstrekking aan de hierna
      genoemde bestuursorganen voor zover het betreft de hierna genoemde gegevens ten behoeve van de hierna genoemde
      publiekrechtelijke taak:


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0002739#Artikel10
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel43c
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '67'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '67'
      - id: ref3
        bwb_id: BWBR0002739
        artikel: '10'
  - number: 43c.1.a
    text: 'de Minister van Financiën:'
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel43c
  - number: 43c.1.a.1°
    text: |-
      gegevens die worden gebruikt door de Auditdienst Financiën ten behoeve van de accountantscontrole van het
      jaarverslag van hoofdstuk IXB (Financiën) van de Rijksbegroting en ten behoeve van de controle op het financieel en
      materieel beheer van het Ministerie van Financiën;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel43c
  - number: 43c.1.a.2°
    text: |-
      gegevens over het vermoeden van het bestaan van een onbeheerd gelaten nalatenschap, vermogens- en persoonsgegevens
      en eventuele andere van belang geachte gegevens die nodig zijn voor de vereffening door de dienst Domeinen van
      onbeheerde nalatenschappen;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel43c
  - number: 43c.1.b
    text: 'de Minister van Binnenlandse Zaken en Koninkrijksrelaties:'
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel43c
  - number: 43c.1.b.1°
    text: |-
      gegevens over mogelijke ongebruikelijke transacties ten behoeve van de uitvoering en de handhaving van de
      [Wet ter voorkoming van witwassen en financieren van terrorisme][ref1] door het Korps landelijke politiediensten/
      Dienst Nationale Recherche Informatie;


      [ref1]: https://wetten.overheid.nl/BWBR0024282
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel43c
    references:
      - id: ref1
        bwb_id: BWBR0024282
  - number: 43c.1.b.2°
    text: |-
      gegevens die van belang kunnen zijn bij het uitwisselen van rechtshulpverzoeken in het kader van de aanpak
      van grensoverschrijdende, zware criminaliteit door het Korps landelijke politiediensten/Dienst Internationale
      Politiesamenwerking;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel43c
  - number: 43c.1.b.3°
    text: gegevens ten behoeve van de aan de Algemene Inlichtingen- en Veiligheidsdienst opgedragen taken;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel43c
  - number: 43c.1.b.4°
    text: |-
      gegevens over het inkomen van voormalige ambtenaren over een bepaalde periode ten behoeve van de uitvoering van
      ontslaguitkeringsregelingen van de sector Rijk;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel43c
  - number: 43c.1.b.5°
    text: |-
      gegevens over het inkomen van voormalige ambtsdragers over een bepaalde periode ten behoeve van de uitvoering van
      de wachtgeldregeling op basis van de [Algemene pensioenwet politieke ambtsdragers][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002691
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel43c
    references:
      - id: ref1
        bwb_id: BWBR0002691
  - number: 43c.1.c
    text: 'de Minister van Defensie:'
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel43c
  - number: 43c.1.c.1°
    text: |-
      gegevens over het inkomen van voormalige militairen over een bepaalde periode ten behoeve van de uitvoering van
      ontslaguitkeringsregelingen;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel43c
  - number: 43c.1.c.2°
    text: gegevens ten behoeve van de aan de Militaire Inlichtingen- en Veiligheidsdienst opgedragen taken;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel43c
  - number: 43c.1.d
    text: |-
      de Minister van Economische Zaken: gegevens die van belang kunnen zijn voor de uitvoering van het
      [Besluit borgstelling MKB-kredieten 1997][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009052
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel43c
    references:
      - id: ref1
        bwb_id: BWBR0009052
  - number: 43c.1.e
    text: |-
      de Minister van Justitie: gegevens die worden gebruikt voor de uitvoering van de [Politiewet 1993][ref1] door de
      Rijksrecherche;


      [ref1]: https://wetten.overheid.nl/BWBR0006299
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel43c
    references:
      - id: ref1
        bwb_id: BWBR0006299
  - number: 43c.1.f
    text: |-
      de Minister van Onderwijs, Cultuur en Wetenschap: gegevens over het inkomen over een bepaalde periode van
      (voormalige) ambtenaren ten behoeve van de vaststelling van werkloosheidsuitkeringen;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel43c
  - number: 43c.1.g
    text: 'de Minister van Verkeer en Waterstaat:'
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel43c
  - number: 43c.1.g.1°
    text: |-
      de aantallen personen die werkzaam zijn in bedrijven en de onttrokken hoeveelheden grondwater waarover
      grondwaterbelasting is berekend, ten behoeve van het vaststellen van de vervuilingswaarde voor de
      [Wet verontreiniging oppervlaktewateren][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002682
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel43c
    references:
      - id: ref1
        bwb_id: BWBR0002682
  - number: 43c.1.g.2°
    text: |-
      gegevens die worden gebruikt door de Inspectie Verkeer en Waterstaat ten behoeve van het toezicht op de naleving
      van wet- en regelgeving van het Ministerie van Verkeer en Waterstaat, voor zover de Inspectie Verkeer en Waterstaat
      als toezichthouder is aangewezen, alsmede werkzaamheden ter bevordering van de veiligheid en de kwaliteit van het
      leefmilieu voor zover vallend binnen de toezichtdomeinen van de Inspectie Verkeer en Waterstaat;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel43c
  - number: 43c.1.h
    text: |-
      de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer: gegevens omtrent
      rechthebbenden van auto’s, welke rechthebbenden eerste kentekenhouder zijn van een nieuw
      motorrijtuig met een roetfilter, ten behoeve van de uitvoering en handhaving door SenterNovem van de
      [Subsidieregeling voor motorrijtuigen met emissiearme dieselmotor en recht op teruggaaf BPM][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019692
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel43c
    references:
      - id: ref1
        bwb_id: BWBR0019692
  - number: 43c.1.i
    text: |-
      de voorzitter van het managementteam van de FIOD-ECD en de voorzitter van het managementteam
      van de Belastingdienst/Holland Midden: gegevens die worden gebruikt in het kader van de aan deze
      organisatieonderdelen toegewezen niet-fiscale toezichts- en opsporingstaken, waaronder begrepen
      gegevens die door de FIOD-ECD worden gebruikt in het kader van de strafrechtelijke handhaving van
      de rechtsorde ingevolge [artikel 3 van de Wet op de bijzondere opsporingsdiensten][ref1], doch met
      uitzondering van gegevens die worden gebruikt in het kader van de uitvoering en handhaving van de
      [Wet ter voorkoming van witwassen en financieren van terrorisme][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0019919#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024282
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel43c
    references:
      - id: ref1
        bwb_id: BWBR0019919
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0024282
  - number: 43c.1.j
    text: 'gemeenten:'
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel43c
  - number: 43c.1.j.1°
    text: |-
      winst uit onderneming, loon en resultaat uit overige werkzaamheden in de zin van de
      [Wet inkomstenbelasting 2001][ref1] over een bepaalde periode en identificerende gegevens van een eventuele
      inhoudingsplichtige in de zin van de [Wet op de loonbelasting 1964][ref2] van (voormalige) ambtenaren ten
      behoeve van de vaststelling van en controle op betalingen van werkloosheidsuitkeringen op grond van gemeentelijke
      verordeningen;


      [ref1]: https://wetten.overheid.nl/BWBR0011353
      [ref2]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel43c
    references:
      - id: ref1
        bwb_id: BWBR0011353
      - id: ref2
        bwb_id: BWBR0002471
  - number: 43c.1.j.2°
    text: |-
      gegevens over uit te betalen voorlopige teruggaven inkomstenbelasting wegens toegekende heffingskortingen,
      op naam van de belastingschuldige staande bankrekeningnummers zoals deze blijken uit de Rentebase,
      kentekenregistergegevens en identificerende gegevens van een eventuele inhoudingsplichtige in de zin van de
      [Wet op de loonbelasting 1964][ref1] ten behoeve van de inning van gemeentelijke belastingen;


      [ref1]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel43c
    references:
      - id: ref1
        bwb_id: BWBR0002471
  - number: 43c.1.j.3°
    text: |-
      gegevens over bewoning van een eigen woning ten behoeve van het tegengaan van permanente bewoning van
      recreatiewoningen;
    url: https://wetten.overheid.nl/BWBR0006736/2009-01-01#Artikel43c
  - number: 43c.1.j.4°
    text: |-
