    Gelet op de artikelen 6, 7, 8, 13, 14, 19, 39, 40, 47a, 62 en 71 van de Algemene wet inzake rijksbelastingen,
    artikel 31 van de Wet op de loonbelasting 1964 en de artikelen 11 en 14 van de Wet op de motorrijtuigenbelasting
    1966;

    Besluit:
