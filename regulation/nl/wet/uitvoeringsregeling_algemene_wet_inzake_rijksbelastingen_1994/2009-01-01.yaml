    text: |-
      1. Deze regeling geeft uitvoering aan de [artikelen 6][ref1], [8][ref2], [13][ref3],
      [14][ref4], [19][ref5], [21d][ref6], [21k][ref7], [30f, vierde lid][ref8], [39][ref9],
      [47b, tweede lid][ref10], [52, vierde lid][ref11], [52a][ref12], [53, tweede lid][ref13],
      [62][ref14] en [67, tweede lid, onderdeel b, van de Algemene wet inzake rijksbelastingen][ref15],
      [artikel 67, tweede lid, onderdeel b, van de Invorderingswet 1990][ref16],
      [artikel 10, tweede lid, onderdeel b, van de Registratiewet 1970][ref17], de
      [artikelen 18][ref18] en [54 van de Wet op belastingen van rechtsverkeer][ref19] en
      [artikel 10 van de Wet op de dividendbelasting 1965][ref20].


