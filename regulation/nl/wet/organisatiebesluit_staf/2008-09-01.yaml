articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: - het Ministerie: het Ministerie van Binnenlandse Zaken en
      Koninkrijksrelaties;
        - de Minister: de Minister van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel1
  - number: '2'
    text: |-
      Dit besluit heeft betrekking op de Staf, genoemd in het [Organisatiebesluit BZK 2006][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020525
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020525
  - number: '3.1'
    text: 'Het Bureau Secretaris-Generaal bestaat uit de onderdelen:'
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.1
  - number: 3.1.a
    text: de sector Beleid (BEL);
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.1
  - number: 3.1.b
    text: de sector Secretariaten (SEC);
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.1
  - number: 3.1.c
    text: de sector Administratie, Informatievoorziening en Beheers- en beleidsondersteuning (AIB);
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.1
  - number: 3.1.d
    text: de beveiligingsambtenaar (BVA);
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.1
  - number: 3.1.e
    text: het bureau Strategische Kennisontwikkeling (SKO);
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.1
  - number: 3.1.f
    text: het bureau Internationale Zaken (BIZ);
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.1
  - number: 3.1.g
    text: |-
      de Vertegenwoordiging van het Ministerie bij de Permanente Vertegenwoordiging van het Koninkrijk der Nederlanden
      bij de Europese Unie (PVEU);
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.1
  - number: 3.1.h
    text: de Projectenpool.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.1
  - number: '3.2'
    text: 'De sector Beleid heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.2
  - number: 3.2.a
    text: |-
      het uitoefenen van de secretarisfunctie voor en het adviseren aan de bewindslieden onder verantwoordelijkheid van
      de secretaris-generaal;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.2
  - number: 3.2.b
    text: het procesmatig ondersteunen van de politieke en de ambtelijke leiding;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.2
  - number: 3.2.c
    text: |-
      het ondersteunen van de secretaris-generaal in diens taken en verantwoordelijkheden met betrekking tot de
      staatsrechtelijke kennis binnen het departement;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.2
  - number: 3.2.d
    text: het behartigen en coördineren van ad hoc activiteiten met hoge politieke relevantie.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.2
  - number: '3.3'
    text: |-
      De sector Secretariaten heeft tot taak het voeren van het secretariaat van en het leveren van
      managementondersteuning aan de bewindspersonen, de secretaris-generaal en de plaatsvervangend secretaris-generaal.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.3
  - number: 3.4.1
    text: |-
      De sector Administratie, Informatievoorziening en Beheers- en beleidsondersteuning staat onder leiding van een
      hoofd.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.4
  - number: 3.4.2
    text: 'De sector heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.4
  - number: 3.4.2.a
    text: het coördineren van de stukkenstroom;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.4
  - number: 3.4.2.b
    text: het beheren van de bedrijfsvoeringapplicaties;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.4
  - number: 3.4.2.c
    text: |-
      het beleidsmatig en beheersmatig ondersteunen van de secretaris-generaal en de plaatsvervangend secretaris-
      generaal;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.4
  - number: 3.4.2.d
    text: het beleidsmatig en beheersmatig ondersteunen van het hoofd Bureau Secretaris-Generaal;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.4
  - number: 3.4.2.e
    text: het beheersmatig ondersteunen van het bureau Strategische Kennisontwikkeling;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.4
  - number: 3.4.2.f
    text: het voeren van het secretariaat van en het leveren van managementondersteuning aan het Bureau Secretaris-Generaal;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.4
  - number: 3.4.2.g
    text: het ontwikkelen van beheren van de parlementaire monitor.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.4
  - number: 3.5.1
    text: 'De Beveiligingsambtenaar heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.5
  - number: 3.5.1.a
    text: het beleidsmatig afstemmen en coördineren van de verschillende aspecten van de beveiliging;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.5
  - number: 3.5.1.b
    text: het toezicht houden op de uitvoering van de beveiliging;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.5
  - number: 3.5.1.c
    text: het verantwoordelijk zijn voor de beveiliging van staatsgeheimen;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.5
  - number: 3.5.1.d
    text: |-
      het fungeren als aanspreekpunt voor alle aspecten die samenhangen met vertrouwensfuncties en
      veiligheidsonderzoeken;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.5
  - number: 3.5.1.e
    text: het adviseren en ondersteunen bij de integrale beveiliging.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.5
  - number: 3.5.2
    text: |-
      Bovengenoemde taken of delen daarvan worden door de plaatsvervangend Beveiligingsambtenaar uitgeoefend voor zover
      hij hiermee door de Beveiligingsambtenaar is belast.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.5
  - number: 3.6.1
    text: Het bureau Strategische Kennisontwikkeling staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.6
  - number: 3.6.2
    text: 'Het bureau heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.6
  - number: 3.6.2.a
    text: |-
      het ontwikkelen en implementeren van een departementale benadering voor strategische agendavorming in samenspraak
      met de departementsonderdelen;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.6
  - number: 3.6.2.b
    text: |-
      het versterken van de strategische kennisfunctie van het Ministerie ter ondersteuning van het (de)centrale proces
      van strategische agendavorming door onderzoek, onderzoeksprogrammering, netwerkontwikkeling en kennisuitwisseling.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.6
  - number: 3.7.1
    text: Het bureau Internationale Zaken staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.7
  - number: 3.7.2
    text: 'Het bureau heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.7
  - number: 3.7.2.a
    text: |-
      de coördinatie van directoraat-generaal overstijgende onderwerpen waarvan het zwaartepunt niet aan een directoraat-
      generaal is toe te wijzen;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.7
  - number: 3.7.2.b
    text: het adviseren aan de ambtelijke en politieke leiding over concernbrede strategische afwegingen;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.7
  - number: 3.7.2.c
    text: |-
      het vertegenwoordigen van het Ministerie in vaste interdepartementale Europese en internationale
      coördinatiestructuren;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.7
  - number: 3.7.2.d
    text: het ondersteunen van de beleidsonderdelen van het Ministerie op internationaal terrein.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.7
  - number: 3.8.1
    text: |-
      De Vertegenwoordiging van het Ministerie bij de Permanente Vertegenwoordiging van het Koninkrijk der Nederlanden
      bij de Europese Unie staat onder leiding van een ambassaderaad.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.8
  - number: 3.8.2
    text: 'De Vertegenwoordiging heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.8
  - number: 3.8.2.a
    text: het behartigen van de belangen van het Ministerie bij de Europese Unie;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.8
  - number: 3.8.2.b
    text: |-
      het ondersteunen van de Permanente Vertegenwoordiger van Nederland bij de Europese Unie met betrekking tot
      aangelegenheden die het Ministerie aangaan;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.8
  - number: 3.8.2.c
    text: het voorbereiden ter plaatse van, het deelnemen aan en het rapporteren over Europese overleggen.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.8
  - number: 3.9.1
    text: De Projectenpool staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.9
  - number: 3.9.2
    text: |-
      De Projectenpool heeft de taak het Ministerie in staat te stellen om hoog gekwalificeerde projectleiders met een
      gedegen kennis van de organisatie en haar beleidsterreinen in te zetten op zowel beleidsinhoudelijke projecten als
      projecten met een uitvoerend karakter om daarmee de flexibiliteit van de organisatie te vergroten.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel3.9
  - number: '4.1'
    text: De directie Financieel-economische Zaken bestaat uit de afdelingen.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel4.1
  - number: 4.1.a
    text: afdeling Begrotingszaken en Kaderstelling (BK);
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel4.1
  - number: 4.1.b
    text: afdeling Beleidstoetsing en -advisering (BTA);
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel4.1
  - number: 4.1.c
    text: afdeling Centrale Eenheid Zelfstandige Organisaties (CZO);
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel4.1
  - number: 4.1.d
    text: het Inkoop Diensten Centrum (IDC).
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel4.1
  - number: 4.2.1
    text: De afdeling Begrotingszaken en Kaderstelling staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel4.2
  - number: 4.2.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel4.2
  - number: 4.2.2.a
    text: het zorgdragen voor de aanschrijving bij de verschillende onderdelen van de begrotingscyclus;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel4.2
  - number: 4.2.2.b
    text: het regisseren van het proces rondom de begrotingsstukken;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel4.2
  - number: 4.2.2.c
    text: het verwerken en toetsen van aangeleverde informatie;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel4.2
  - number: 4.2.2.d
    text: de verantwoordelijkheid voor het overleg met het Ministerie van Financiën over alle begrotingsaangelegenheden;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel4.2
  - number: 4.2.2.e
    text: |-
      het stellen van kaders op het gebied van (financiële) bedrijfsvoering en begrotingsvraagstukken, door financiële
      regelgeving te vertalen;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel4.2
  - number: 4.2.2.f
    text: het formuleren van de functionele eisen voor de planning- en controlcyclus ondersteunende informatiesystemen.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel4.2
  - number: 4.3.1
    text: De afdeling Beleidstoetsing en -advisering staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel4.3
  - number: 4.3.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel4.3
  - number: 4.3.2.a
    text: het zorgdragen voor tijdige en juiste aanlevering van begrotingsstukken;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel4.3
  - number: 4.3.2.b
    text: het beoordelen van informatie voor de begrotingscyclus;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel4.3
  - number: 4.3.2.c
    text: het leidinggevend zijn bij de advisering van de politieke en ambtelijke leiding rondom claims.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel4.3
  - number: 4.4.1
    text: De afdeling Centrale Eenheid Zelfstandige Organisaties staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel4.4
  - number: 4.4.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel4.4
  - number: 4.4.2.a
    text: |-
      het stellen van centrale kaders op gebied van (de aansturing van) agentschappen en het toezicht op zelfstandige
      bestuursorganen, rechtspersonen met een wettelijke taak en stichtingen;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel4.4
  - number: 4.4.2.b
    text: |-
      het fungeren als kenniscentrum ten aanzien van (de aansturing van) agentschappen en het toezicht op zelfstandige
      organisaties;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel4.4
  - number: 4.4.2.c
    text: |-
      het toetsen van de aansturing van agentschappen en het toezicht op zelfstandige bestuursorganen, rechtspersonen met
      een wettelijke taak en stichtingen;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel4.4
  - number: 4.4.2.d
    text: |-
      het fungeren als adviescentrum ten aanzien van (de aansturing van) agentschappen en het toezicht op zelfstandige
      organisaties;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel4.4
  - number: 4.4.2.e
    text: het fungeren als centraal aanspreekpunt voor externen.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel4.4
  - number: 4.5.1
    text: Het Inkoop Diensten Centrum staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel4.5
  - number: 4.5.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel4.5
  - number: 4.5.2.a
    text: het ondersteunen en adviseren in alle departementale EG-aanbestedingen en het beheren van de afgesloten contracten;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel4.5
  - number: 4.5.2.b
    text: |-
      het uitbreiden, afsluiten en het beheren van ministeriebrede raamovereenkomsten en het aanleveren van
      managementinformatie over het gebruik van deze raamovereenkomsten;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel4.5
  - number: 4.5.2.c
    text: het uitvoeren van de administratieve afhandelingen voor alle ministeriebrede raamovereenkomsten;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel4.5
  - number: 4.5.2.d
    text: het toetsen van EG-aanbestedingen op verzoek van de Coördinerend Directeur Inkoop.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel4.5
  - number: '5.1'
    text: 'De Auditdienst bestaat uit de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel5.1
  - number: 5.1.a
    text: het Bedrijfsbureau (BB);
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel5.1
  - number: 5.1.b
    text: de discipline Financial Audit (FA);
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel5.1
  - number: 5.1.c
    text: de discipline ICT-audit (IT);
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel5.1
  - number: 5.1.d
    text: de discipline Operational Audit (OA).
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel5.1
  - number: 5.2.1
    text: Het Bedrijfsbureau staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel5.2
  - number: 5.2.2
    text: 'Het Bedrijfsbureau heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel5.2
  - number: 5.2.2.a
    text: het zorgdragen voor de secretariële en administratieve ondersteuning van de dienst;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel5.2
  - number: 5.2.2.b
    text: het zorgdragen voor de interne bedrijfsvoering van de dienst;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel5.2
  - number: 5.2.2.c
    text: het beleidsmatig ondersteunen van de leiding van de dienst.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel5.2
  - number: 5.3.1
    text: De discipline Financial Audit is de verantwoordelijkheid van een tweetal auditmanagers.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel5.3
  - number: 5.3.2
    text: 'De discipline heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel5.3
  - number: 5.3.2.a
    text: het verstrekken van mededelingen over de getrouwheid van financiële en andere verantwoordingen;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel5.3
  - number: 5.3.2.b
    text: |-
      onderzoek doen naar de kwaliteit van het (financiële) beheer, voor zover dit zijn weerslag vindt in deze
      verantwoordingen;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel5.3
  - number: 5.3.2.c
    text: het uitvoeren van reviews op grond van wettelijke bepalingen of andere afspraken;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel5.3
  - number: 5.3.2.d
    text: overige assurance services.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel5.3
  - number: 5.4.1
    text: De discipline ICT-audit is de verantwoordelijkheid van een auditmanager.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel5.4
  - number: 5.4.2
    text: 'De discipline heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel5.4
  - number: 5.4.2.a
    text: |-
      het rapporteren en adviseren over de ICT-informatiestrategie, het ICT-beheer, de ICT-infrastructuren en
      informatiesystemen, zowel in ontwikkeling als in productie;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel5.4
  - number: 5.4.2.b
    text: het optreden als de onafhankelijke deskundige, bedoeld in het Voorschrift Informatiebeveiliging Rijksdienst;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel5.4
  - number: 5.4.2.c
    text: |-
      het op verzoek van derden verstrekken van mededelingen met betrekking tot opzet en bestaan van geautomatiseerde
      systemen.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel5.4
  - number: 5.5.1
    text: De discipline Operational Audit is de verantwoordelijkheid van een auditmanager.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel5.5
  - number: 5.5.2
    text: 'De discipline heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel5.5
  - number: 5.5.2.a
    text: |-
      het onderzoeken van en adviseren over de kwaliteit van de sturings- en beheersingsprocessen in samenhang met de
      primaire en ondersteunende processen (bedrijfsvoering);
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel5.5
  - number: 5.5.2.b
    text: het ad hoc beoordelen en doorlichten;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel5.5
  - number: 5.5.2.c
    text: het uitvoeren van aspect-audits gericht op de naleving van centrale beheerskaders.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel5.5
  - number: '6.1'
    text: 'De directie bestaat uit de onderdelen:'
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel6.1
  - number: 6.1.a
    text: de afdeling Wetgeving Staatsinrichting en Grondrechten (WSG);
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel6.1
  - number: 6.1.b
    text: de afdeling Wetgeving Veiligheid en Openbaar bestuur (WVOB);
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel6.1
  - number: 6.1.c
    text: de afdeling Constitutioneel Beleid (CB);
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel6.1
  - number: 6.1.d
    text: de afdeling Juridisch Adviseur (JA);
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel6.1
  - number: 6.1.e
    text: de afdeling Ondersteuning en Kennismanagement (OK).
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel6.1
  - number: 6.2.1
    text: De afdeling Wetgeving Staatsinrichting en Grondrechten staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel6.2
  - number: 6.2.2
    text: |-
      De afdeling heeft tot taak het concipiëren van de wet- en regelgeving, met inbegrip van internationale regelgeving,
      op het gebied van constitutionele zaken, informatie en de institutionele organisatie op Rijksniveau.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel6.2
  - number: 6:3.1
    text: De afdeling Wetgeving Veiligheid en Openbaar Bestuur staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel63
  - number: 6:3.2
    text: |-
      De afdeling heeft tot taak het concipiëren van de wet- en regelgeving, op de terreinen van het management van
      de openbare sector, van het Nederlands openbaar bestuur en van de openbare orde en veiligheid, met inbegrip van
      implementatie van internationale regelgeving.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel63
  - number: 6.4.1
    text: De afdeling Constitutioneel Beleid staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel6.4
  - number: 6.4.2
    text: |-
      De afdeling heeft de taak beleid te ontwikkelen en te adviseren over de constitutionele aspecten van het beleid op
      het terrein van:
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel6.4
  - number: 6.4.2.a
    text: de staatkundige verhoudingen binnen het koninkrijk;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel6.4
  - number: 6.4.2.b
    text: de staatsinrichting in brede zin;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel6.4
  - number: 6.4.2.c
    text: de klassieke en sociale grondrechten;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel6.4
  - number: 6.4.2.d
    text: |-
      de positie van het staatshoofd, de adeldom, de regering en het parlement, de ministeriële verantwoordelijkheid, de
      scheiding der staatsmachten, de herzieningsprocedure van de [Grondwet][ref1] en de betrokkenheid van de burger bij
      het democratisch bestuur;


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: 6.4.2.e
    text: |-
      de inrichting van het openbaar bestuur met uitzondering van de inrichting van het openbaar bestuur bij de
      medeoverheden;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel6.4
  - number: 6.4.2.f
    text: de internationale betrekkingen, alsmede de doorwerking van internationaal en Europees recht;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel6.4
  - number: 6.4.2.g
    text: defensie, belastingen, begroting, noodwetgeving;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel6.4
  - number: 6.4.2.h
    text: openbaarheid van bestuur;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel6.4
  - number: 6.4.2.i
    text: Europese en internationale zaken;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel6.4
  - number: 6.4.2.j
    text: het algemeen bestuursrecht;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel6.4
  - number: 6.4.2.k
    text: |-
      het preventieve en repressieve toezicht op de naleving van statutaire voorschriften, met inbegrip van het beleid
      inzake interventies in Antilliaanse en Arubaanse rechtsorde op grond van de waarborg taak van het [Statuut][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002154
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0002154
  - number: 6.5.1
    text: De afdeling Juridisch Adviseur staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel6.5
  - number: 6.5.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel6.5
  - number: 6.5.2.a
    text: |-
      het behandelen van civielrechtelijke kwesties en andere bijzondere juridische aangelegenheden, waaronder
      gecompliceerde of politiek gevoelige juridische vraagstukken;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel6.5
  - number: 6.5.2.b
    text: |-
      het adviseren van alle onderdelen van het departement voor juridische vragen waar het departement als organisatie
      en als onderdeel van de Staat mee wordt geconfronteerd, waaronder juridische geschillen, subsidieaangelegenheden,
      contracten en aanbestedingen;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel6.5
  - number: 6.5.2.c
    text: |-
      het adviseren over de toepassing van de [Wet openbaarheid van bestuur][ref1], in het bijzonder indien afwijzing van
      de openbaarheidsverzoeken wordt overwogen;


      [ref1]: https://wetten.overheid.nl/BWBR0005252
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0005252
  - number: 6.5.2.d
    text: het adviseren over de toepassing van de Europese richtlijnen inzake overheidsopdrachten en staatssteun;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel6.5
  - number: 6.5.2.e
    text: het voeren van het coördinatiepunt notificaties;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel6.5
  - number: 6.5.2.f
    text: het contact met de landsadvocaat.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel6.5
  - number: 6.6.1
    text: De afdeling Ondersteuning en Kennismanagement staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel6.6
  - number: 6.6.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel6.6
  - number: 6.6.2.a
    text: het begeleiden van de stukkenstroom;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel6.6
  - number: 6.6.2.b
    text: het voeren van het secretariaat;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel6.6
  - number: 6.6.2.c
    text: het bewaken van processen en het ondersteunen van medewerkers op het terrein van automatisering;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel6.6
  - number: 6.6.2.d
    text: het zorgdragen voor kennismanagement en het organiseren van evenementen;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel6.6
  - number: 6.6.2.e
    text: het beantwoorden van burgerbrieven.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel6.6
  - number: '7'
    text: |-
      [Artikel 3.7 van het organisatiebesluit BZK 2006][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020525#Artikel3
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020525
        artikel: '3'
  - number: '8'
    text: |-
      [Artikel 3.8 van het organisatiebesluit BZK 2006][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020525#Artikel3
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020525
        artikel: '3'
  - number: '9.1'
    text: |-
      [Artikel 3.9 van het organisatiebesluit BZK 2006][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020525#Artikel3
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0020525
        artikel: '3'
  - number: '9.2'
    text: 'Het secretariaat bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel9.2
  - number: 9.2.a
    text: de algemene leiding, bestaande uit een secretaris/directeur en een plaatsvervangend secretaris/directeur;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel9.2
  - number: 9.2.b
    text: het cluster Verkiezingsaangelegenheden;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel9.2
  - number: 9.2.c
    text: het cluster Kennisontwikkeling en ondersteuning.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel9.2
  - number: 9.3.1
    text: |-
      Het cluster Verkiezingsaangelegenheden staat onder leiding van een clustercoördinator, tevens plaatsvervangend
      secretaris/directeur.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel9.3
  - number: 9.3.2
    text: 'Het cluster heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel9.3
  - number: 9.3.2.a
    text: |-
      de ambtelijke ondersteuning van de Kiesraad als adviesorgaan voor uitvoeringstechnische aangelegenheden die het
      kiesrecht of de verkiezingen betreffen;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel9.3
  - number: 9.3.2.b
    text: |-
      de ambtelijke ondersteuning van de Kiesraad als centraal stembureau voor de verkiezingen van de leden van de Tweede
      en Eerste Kamer der Staten-Generaal en de verkiezing van de leden van het Europese Parlement;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel9.3
  - number: 9.3.2.c
    text: het fungeren als kenniscentrum op het terrein van het kiesrecht en verkiezingen.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel9.3
  - number: 9.4.1
    text: Het cluster Kennisontwikkeling en ondersteuning staat onder leiding van een clustercoördinator.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel9.4
  - number: 9.4.2
    text: 'Het cluster heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel9.4
  - number: 9.4.2.a
    text: |-
      het bevorderen van de kennisontwikkeling op het terrein van verkiezingen en kiesrecht onder meer door middel van
      het verrichten en uitbesteden van onderzoek;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel9.4
  - number: 9.4.2.b
    text: |-
      ondersteuning van de algemene leiding en het cluster Verkiezingsaangelegenheden op met name het gebied van
      communicatie, ICT-deskundigheid en financiën;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel9.4
  - number: 9.4.2.c
    text: het zorgdragen voor de secretariële ondersteuning van het secretariaat van de Kiesraad.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel9.4
  - number: '10'
    text: 'Het bureau Gemeenschappelijke Diensten heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel10
  - number: 10.a
    text: het coördineren van beleidsprocessen en het ondersteunen van de bestuursprocessen;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel10
  - number: 10.b
    text: het operationaliseren van de kaderstelling op het niveau van de Staf;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel10
  - number: 10.c
    text: het uitoefenen van de integrale control functie voor de Staf;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel10
  - number: 10.d
    text: |-
      het ondersteunen van de plaatsvervangend secretaris-generaal in zijn rol als opdrachtgever van de onderdelen van
      de Staf.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel10
  - number: '11'
    text: 'Het bureau Strategie en Innovatie heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel11
  - number: 11.a
    text: het initiëren en innoveren van de vraaggestuurde bedrijfsvoering van het Ministerie;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel11
  - number: 11.b
    text: het adviseren over de koers van de Staf op de (middel)lange termijn;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel11
  - number: 11.c
    text: |-
      het voeren van het accountmanagement ten behoeve van de opstelling en realisering van dienstverleningsafspraken
      en plusvarianten;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel11
  - number: 11.d
    text: het voeren van het secretariaat van het directeurenoverleg.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel11
  - number: '12.1'
    text: 'De directie Personeel en Organisatie bestaat uit de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.1
  - number: 12.1.a
    text: het directiesecretariaat (DS);
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.1
  - number: 12.1.b
    text: de afdeling HRM-advies (HRM-advies);
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.1
  - number: 12.1.c
    text: de afdeling Management Development, Loopbaanbeleid en Opleidingen (MLO);
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.1
  - number: 12.1.d
    text: de afdeling HRM-beleid, Juridische Zaken en Overleg (HJO);
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.1
  - number: 12.1.e
    text: de afdeling Organisatieadvies (O-advies);
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.1
  - number: 12.1.f
    text: de Personeelsbeheer, Ondersteuning en Monitoring (POM).
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.1
  - number: 12.2.1
    text: Het Directiesecretariaat staat onder leiding van een directiesecretaris.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.2
  - number: 12.2.2
    text: 'Het directiesecretariaat heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.2
  - number: 12.2.2.a
    text: het adviseren en ondersteunen van de directeur P&O ten aanzien van beleidsprocessen en bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.2
  - number: 12.2.2.b
    text: het uitvoeren van de financiële en personele beheerstaken voor de directie;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.2
  - number: 12.2.2.c
    text: |-
      het zorgdragen voor de management ondersteuning van directeur en afdelingshoofden, waaronder postregistratie en het
      bewaken van de voortgang van afhandeling van stukken en het documenteren en archiveren;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.2
  - number: 12.2.2.d
    text: het voeren van het secretariaat van de Personeelsvereniging.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.2
  - number: 12.3.1
    text: De afdeling HRM-advies staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.3
  - number: 12.3.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.3
  - number: 12.3.2.a
    text: het adviseren van het lijnmanagement over personele aangelegenheden;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.3
  - number: 12.3.2.b
    text: het adviseren van de medewerkers op het gebied van personele aangelegenheden;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.3
  - number: 12.3.2.c
    text: |-
      het bijdragen aan de ontwikkeling van het beleid en de instrumenten op het gebied van personele aangelegenheden en
      het zorgdragen voor implementatie.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.3
  - number: 12.4.1
    text: De afdeling Management Development, Loopbaanbeleid en Opleidingen staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.4
  - number: 12.4.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.4
  - number: 12.4.2.a
    text: |-
      het zorgdragen voor beleidsontwikkeling, -uitvoering en advisering op het terrein van management development en
      loopbaanbeleid voor functies vanaf schaal 14;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.4
  - number: 12.4.2.b
    text: het faciliteren van loopbaan- en opleidingsadvies;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.4
  - number: 12.4.2.c
    text: het ontwikkelen, bijstellen en realiseren van het opleiding-, mobiliteit- en diversiteitbeleid;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.4
  - number: 12.4.2.d
    text: het verzorgen van het centrale introductieprogramma en uitvoeren van de BZK-academie;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.4
  - number: 12.4.2.e
    text: het verzorgen van de backoffice-functie bij werving en selectie;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.4
  - number: 12.4.2.f
    text: het coördineren van het herplaatsingsbeleid en zorg dragen voor de uitvoering hiervan;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.4
  - number: 12.4.2.g
    text: het coördineren, begeleiden en uitvoeren van het traineeprogramma BZK;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.4
  - number: 12.4.2.h
    text: |-
      het onderhouden en uitvoeren van arbeidsmarktcommunicatie-activiteiten en het ontwikkelen en implementeren van
      ondersteunende instrumenten.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.4
  - number: 12.5.1
    text: De afdeling HRM-beleid, Juridische Zaken en Overleg staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.5
  - number: 12.5.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.5
  - number: 12.5.2.a
    text: |-
      het zorgdragen voor de ontwikkeling, evaluatie en actualisatie van het departementale HRM- en
      arbeidsomstandighedenbeleid, de regelgeving en de uitvoeringsvoorschriften en -procedures op het gebied van
      arbeidsvoorwaarden, rechtspositie en sociale zekerheid;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.5
  - number: 12.5.2.b
    text: het zorgdragen voor en onderhouden van de Organisatie- en de mandaat- en volmachtbesluiten;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.5
  - number: 12.5.2.c
    text: |-
      het adviseren en geven van voorlichting aan het lijnmanagement en personeelsfunctionarissen over complexe
      vraagstukken op genoemde gebieden;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.5
  - number: 12.5.2.d
    text: |-
      het organiseren van en adviseren over het overleg van de departementsleiding met het Georganiseerd Overleg en de
      medezeggenschap;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.5
  - number: 12.5.2.e
    text: |-
      het bijdragen aan de beslechting van personele conflicten door advisering, bemiddeling en het voeren van
      onderhandelingen;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.5
  - number: 12.5.2.f
    text: |-
      het behandelen van en het adviseren over bezwaar- en beroepszaken en het optreden als gemachtigde ter
      terechtzitting;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.5
  - number: 12.5.2.g
    text: |-
      het voeren van de secretariaten van bezwaren-, hoor- en klachtencommissies, de Groepsondernemingsraad en het
      Departementaal Georganiseerd Overleg;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.5
  - number: 12.5.2.h
    text: het vertalen in regelgeving en het uitvoeren en coördineren van het departementale integriteitbeleid;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.5
  - number: 12.5.2.i
    text: het zorgdragen voor de ontwikkeling van het reïntegratiebeleid en het coördineren van de uitvoering ervan;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.5
  - number: 12.5.2.j
    text: |-
      het zorgdragen voor de uitvoering/uitbesteding van kinderopvang, bedrijfsmaatschappelijk werk en Arbodienst en het
      afsluiten van contracten openbaar vervoer ten behoeve van het woon-werkverkeer.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.5
  - number: 12.6.1
    text: De afdeling Organisatieadvies staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.6
  - number: 12.6.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.6
  - number: 12.6.2.a
    text: het signaleren en analyseren van organisatievraagstukken en veranderingsbehoeften binnen het departement;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.6
  - number: 12.6.2.b
    text: |-
      het adviseren van de departementsleiding en het lijnmanagement over vraagstukken met betrekking tot de
      organisatorische inrichting van het Ministerie, bijbehorende verandertrajecten en formatieve vraagstukken;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.6
  - number: 12.6.2.c
    text: |-
      het coördineren van de uitvoering van omvangrijke en/of complexe projecten ter verbetering van de departementale
      organisatie of bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.6
  - number: 12.6.2.d
    text: het opzetten en beheren van het virtueel adviesnetwerk binnen het Ministerie;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.6
  - number: 12.6.2.e
    text: het ondersteunen van onderdelen van het Ministerie bij verandering van de cultuur en de werkwijze;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.6
  - number: 12.6.2.f
    text: het jaarlijks uitvoeren van het medewerkers en stakeholders onderzoek.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.6
  - number: 12.7.1
    text: De afdeling Personeelsbeheer, Ondersteuning en Monitoring staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.7
  - number: 12.7.2
    text: |-
      De afdeling bestaat uit de eenheden Personeels- en Salarisadministratie (PSA), Kwaliteitszorg, Administratieve
      Organisatie en Interne Controle (KAI), Ondersteuning (OND) en Monitoring en Personele Informatie (MPI).
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.7
  - number: 12.7.3
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.7
  - number: 12.7.3.a
    text: |-
      het afhandelen van personeels- en salarismutaties voor het departement, het Ministerie van Algemene Zaken en de
      Hoge Colleges van Staat;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.7
  - number: 12.7.3.b
    text: het zorg dragen voor de financiële afwikkeling rond de personeels- en salarisadministratie;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.7
  - number: 12.7.3.c
    text: |-
      het zorg dragen voor de interne controle en kwaliteitszorg op het terrein van de personeels- en
      salarisadministratie;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.7
  - number: 12.7.3.d
    text: het verstrekken van informatie over wet- en regelgeving op het gebied van personeelsbeheer;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.7
  - number: 12.7.3.e
    text: |-
      het zowel adviserend als beheersmatig bijdragen aan de ontwikkeling van de Administratieve Organisatie van de
      directie P&O;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.7
  - number: 12.7.3.f
    text: het leveren van ondersteuning bij de lange/korte uitzending;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.7
  - number: 12.7.3.g
    text: het voeren van de formatieadministratie;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.7
  - number: 12.7.3.h
    text: het beheren van de aan P&O gerelateerde systemen;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.7
  - number: 12.7.3.i
    text: het beheer en de ontwikkeling van Emplaza;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.7
  - number: 12.7.3.j
    text: het zorg dragen voor managementinformatie zowel structureel als ad hoc;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.7
  - number: 12.7.3.k
    text: het opstellen van het Sociaal jaarverslag;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.7
  - number: 12.7.3.l
    text: |-
      het doen van onderzoek en audits op het terrein van personele aangelegenheden, het analyseren van de resultaten en
      het rapporteren aan de opdrachtgevers dan wel dienstleiding met het oog op het monitoren van de effecten van het
      beleid ten aanzien van personele aangelegenheden;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.7
  - number: 12.7.3.m
    text: het ondersteunen van de HRM-teams en de specialistische teams;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.7
  - number: 12.7.3.n
    text: het beheer en onderhoud van de medewerkerpagina op intranet.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel12.7
  - number: '13.1'
    text: 'De directie Financiële Bedrijfsvoering bestaat uit de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.1
  - number: 13.1.a
    text: het directiesecretariaat (DS);
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.1
  - number: 13.1.b
    text: de afdeling Bedrijfsvoering, Ondersteuning en Advies (BOA);
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.1
  - number: 13.1.c
    text: de afdeling Kwaliteitsmanagement, Processen en Systemen (KPS);
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.1
  - number: 13.1.d
    text: de afdeling Financiële Administratie (FA);
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.1
  - number: 13.1.e
    text: de afdeling Uitvoering Financiële Verhoudingen (UFV).
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.1
  - number: 13.2.1
    text: Het Directiesecretariaat bestaat uit een directiesecretaris en een directiesecretaresse.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.2
  - number: 13.2.2
    text: 'Het directiesecretariaat heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.2
  - number: 13.2.2.a
    text: het adviseren en ondersteunen van de directeur FB ten aanzien van beleidsprocessen en bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.2
  - number: 13.2.2.b
    text: het ondersteunen van het management van de directie;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.2
  - number: 13.2.2.c
    text: het uitvoeren van de financiële en personele beheerstaken voor de directie;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.2
  - number: 13.2.2.d
    text: het verzorgen van vergaderingen en besprekingen;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.2
  - number: 13.2.2.e
    text: het bewaken van relevante processen voor het directiesecretariaat;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.2
  - number: 13.2.2.f
    text: |-
      het zorgdragen voor de postregistratie en het bewaken van de voortgang van afhandeling van stukken en het
      documenteren en archiveren.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.2
  - number: 13.3.1
    text: De afdeling Bedrijfsvoering, Ondersteuning en Advies staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.3
  - number: 13.3.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.3
  - number: 13.3.2.a
    text: het ontwikkelen van de visie op management control;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.3
  - number: 13.3.2.b
    text: |-
      het ondersteunen van de dienstonderdelen en directies bij het opzetten en onderhouden van het Management Control
      Systeem en de planning en controlcyclus van het Ministerie;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.3
  - number: 13.3.2.c
    text: het opstellen van de mededeling over de bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.3
  - number: 13.3.2.d
    text: het uitvoeren van onderzoeken op de desbetreffende terreinen;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.3
  - number: 13.3.2.e
    text: het ondersteunen van directies in de reguliere financiële processen.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.3
  - number: 13.4.1
    text: De afdeling Kwaliteitsmanagement, Processen en Systemen staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.4
  - number: 13.4.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.4
  - number: 13.4.2.a
    text: |-
      het inrichten, beheersen, verbeteren en beheren van bedrijfsprocessen, -informatievoorziening en aan begroting
      gerelateerde bedrijfsvoeringsystemen, administraties en producten en diensten;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.4
  - number: 13.4.2.b
    text: het faciliteren van ondersteunende processen ten behoeve van de budgethouders;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.4
  - number: 13.4.2.c
    text: het opstellen en toepassen van regelgeving voor het gebruik van de systeeminfrastructuur en de administratie;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.4
  - number: 13.4.2.d
    text: het toezicht houden op de naleving van de regelgeving;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.4
  - number: 13.4.2.e
    text: |-
      het afstemmen van de voortgang van en de gewenste ontwikkeling bij de beleidsvorming en inrichting van de
      managementinformatie, bedrijfsvoeringsystemen, gemeenschappelijke gegevens en financieel beheer met de integrale
      controlfunctie.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.4
  - number: 13.5.1
    text: De afdeling Financiële Administratie staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.5
  - number: 13.5.2
    text: De afdeling bestaat uit het cluster Centraal Kasbeheer (CK) en het cluster Financieel Beheer (FB).
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.5
  - number: 13.5.3
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.5
  - number: 13.5.3.a
    text: het voeren van de concernadministratie;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.5
  - number: 13.5.3.b
    text: het beheren van het relatiebestand;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.5
  - number: 13.5.3.c
    text: het voeren van de contractadministratie;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.5
  - number: 13.5.3.d
    text: het inrichten en uitvoeren van het betalingsverkeer van het departement;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.5
  - number: 13.5.3.e
    text: het adviseren en informeren omtrent de inrichting van het betalingsverkeer;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.5
  - number: 13.5.3.f
    text: het controleren en verwerken van de maandverantwoordingen van de kasbeheerders;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.5
  - number: 13.5.3.g
    text: het maken van grootboekrapportages;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.5
  - number: 13.5.3.h
    text: het registreren en verifiëren van facturen, vorderingen, verplichtingen en ontvangsten;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.5
  - number: 13.5.3.i
    text: Het adviseren over de wet- en regelgeving en procesgang in relatie tot de financiële administratie.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.5
  - number: 13.6.1
    text: De afdeling Uitvoering Financiële Verhoudingen staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.6
  - number: 13.6.2
    text: 'De afdeling heeft met betrekking tot het gemeente- en het provinciefonds de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.6
  - number: 13.6.2.a
    text: het bijdragen aan de beleidsvoorbereiding en de juridische kaderstelling;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.6
  - number: 13.6.2.b
    text: |-
      het verzamelen, controleren, interpreteren, bewerken en verwerken van basismateriaal voor de berekening van de
      uitkeringen;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.6
  - number: 13.6.2.c
    text: het onderhouden van relaties (onder andere door middel van convenanten) met leveranciers van basismateriaal;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.6
  - number: 13.6.2.d
    text: het betaalbaar stellen van voorschotten en uitkeringen en het vaststellen van de algemene uitkering;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.6
  - number: 13.6.2.e
    text: het voorbereiden van aanwijzingen met betrekking tot specifieke verdeelmaatstaven;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.6
  - number: 13.6.2.f
    text: |-
      het verrichten van werkzaamheden in verband met bezwaar- en beroepszaken en het vertegenwoordigen van de Minister
      in beroepszaken;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.6
  - number: 13.6.2.g
    text: het voeren van de financiële administraties;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.6
  - number: 13.6.2.h
    text: het inrichten en beheren van de administratieve organisatie en de bestuurlijke informatievoorziening;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.6
  - number: 13.6.2.i
    text: |-
      het uitvoeren van het [Besluit][ref1] en de
      [Regeling kostenverrekening en gegevensuitwisseling Wet waardering onroerende zaken][ref2] en het leveren van
      inhoudelijke bijdragen (evaluatie) over het juridisch kader hiervan;


      [ref1]: https://wetten.overheid.nl/BWBR0007230
      [ref2]: https://wetten.overheid.nl/BWBR0015059
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.6
    references:
      - id: ref1
        bwb_id: BWBR0007230
      - id: ref2
        bwb_id: BWBR0015059
  - number: 13.6.2.j
    text: |-
      het uitvoeren van de [Regeling subsidiëring Oorlogsgravenstichting][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008761
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.6
    references:
      - id: ref1
        bwb_id: BWBR0008761
  - number: 13.6.2.k
    text: |-
      het verzamelen van gegevens ten behoeve van de verrekening van de kosten van de waardering van onroerende zaken op
      voet van de [Wet waardering onroerende zaken][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007119
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.6
    references:
      - id: ref1
        bwb_id: BWBR0007119
  - number: 13.6.2.l
    text: het innen en betaalbaar stellen van gelden ten behoeve van de verrekening bedoeld onder k.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel13.6
  - number: '14.1'
    text: 'De directie Informatie en Communicatie Technologie bestaat uit de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel14.1
  - number: 14.1.a
    text: de afdeling Architectuur en innovatie (A&I);
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel14.1
  - number: 14.1.b
    text: de afdeling ICT-Beheer (IB);
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel14.1
  - number: 14.1.c
    text: de afdeling ICT-Servicedesk (IS);
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel14.1
  - number: 14.1.d
    text: de afdeling ICT-Functioneel Applictiebeheer (FAB);
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel14.1
  - number: 14.1.e
    text: de afdeling Service en Kwaliteit (S&K).
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel14.1
  - number: 14.2.1
    text: De afdeling Architectuur en Innovatie staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel14.2
  - number: 14.2.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel14.2
  - number: 14.2.2.a
    text: |-
      het voeren van de regie op de informatiearchitectuur uitmondend in voorschriften voor de ICT-infrastructuur en in
      kaderstelling voor de informatiearchitectuur van het Ministerie;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel14.2
  - number: 14.2.2.b
    text: |-
      het op aanvraag van andere directies adviseren over procesinrichting, informatieanalyse en de bijbehorende
      mogelijkheden van ICT-ondersteuning;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel14.2
  - number: 14.2.2.c
    text: het actueel houden van het architectuurplan voor de ICT binnen het Ministerie;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel14.2
  - number: 14.2.2.d
    text: het volgen van ontwikkelingen in de ICT-markt en deze toepasbaar maken voor het Ministerie;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel14.2
  - number: 14.2.2.e
    text: het zorgdragen voor het inpassen van nieuwe functionaliteiten in de ICT-infrastructuur;
    url: https://wetten.overheid.nl/BWBR0023182/2008-09-01#Artikel14.2
  - number: 14.2.2.f
    text: |-
