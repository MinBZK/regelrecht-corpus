$id: subsidieregeling_indemniteit_bruiklenen
regulatory_layer: WET
publication_date: '2004-10-25'
valid_from: '2002-01-01'
bwb_id: BWBR0007839
url: https://wetten.overheid.nl/BWBR0007839/2002-01-01
preamble:
  text: |-
    Gelet op de artikelen 2, 5, 11, vijfde lid, 12, tweede lid, 32, eerste lid, 36, tweede lid, en 48 van het
    Bekostigingsbesluit cultuuruitingen;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0007839/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a

              *minister:*


              de Minister van Onderwijs, Cultuur en Wetenschappen;



            b

              *Besluit:*


              [Bekostigingsbesluit cultuuruitingen][ref1];



            c

              *instelling:*


              een in belangrijke mate door de Staat of een ander overheidslichaam structureel gefinancierde instelling
      die gespecialiseerd is in het beheren van museale collecties of het organiseren van tentoonstellingen.



            d

              *voorwerp:*


              een voorwerp van cultuurhistorische betekenis met de daarbij behorende verpakking, lijst, raam, kader,
      sokkel en dergelijke;



            e

              *tentoonstelling:*


              een tijdelijke tentoonstelling in Nederland, georganiseerd door een instelling, die naar het oordeel van de
      minister van uitzonderlijk belang is door:
              een belangrijke visie te bieden op periodes, kwesties, personen of produkten van cultuurhistorische
      betekenis;
      een overtuigende waardering op te willen wekken voor de onder 1° genoemde zaken of personen; en
      een omvangrijke compilatie te bieden van belangrijke voorwerpen die men normaliter niet in Nederland te zien krijgt
      of die in Nederland zelf moeilijk te bezichtigen zijn;



            f

              *indemniteitsverklaring:*


              beschikking waarbij een aanspraak op financiële middelen als bedoeld in [artikel 2][ref2] wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006759
      [ref2]: https://wetten.overheid.nl/BWBR0007839#Artikel2
    url: https://wetten.overheid.nl/BWBR0007839/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006759
      - id: ref2
        bwb_id: BWBR0007839
        artikel: '2'
        paragraaf: '2'
  - number: '2.1'
    text: |-
      De minister kan, in overeenstemming met de Minister van Financiën, aan een instelling ten behoeve van een
      tentoonstelling een aanspraak op financiële middelen verlenen voor het geval dat de exploitatie van de
      tentoonstelling een tekort vertoont en voorzover dat tekort wordt veroorzaakt door verlies van of schade aan door
      derden ten behoeve van de tentoonstelling in bruikleen gegeven voorwerpen.
    url: https://wetten.overheid.nl/BWBR0007839/2002-01-01#Artikel2
  - number: '2.2'
    text: |-
      De aanspraak kan worden verleend onder de in [bijlage I][ref1] opgenomen voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0007839
    url: https://wetten.overheid.nl/BWBR0007839/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007839
  - number: '2.3'
    text: |-
      Het totaal van de in enig begrotingsjaar ontstane aanspraken op financiële middelen op grond van
      indemniteitsverklaringen zal niet meer bedragen dan vijfhonderd miljoen gulden per begrotingsjaar, terwijl
      bovendien het totale risico voor de Staat op enig moment het bedrag van € 226.890.000 niet te boven zal gaan.
    url: https://wetten.overheid.nl/BWBR0007839/2002-01-01#Artikel2
  - number: '3.1'
    text: |-
      Een indemniteitsverklaring kan slechts worden verleend indien een instelling naar het oordeel van de minister, in
      overeenstemming met de Minister van Financiën, heeft aangetoond, dat:
    url: https://wetten.overheid.nl/BWBR0007839/2002-01-01#Artikel3
  - number: 3.1.a
    text: |-
      de kosten van de verzekering van de tentoonstelling zodanig hoog zijn dat deze zonder indemniteitsverklaring geen
      doorgang zal kunnen vinden;
    url: https://wetten.overheid.nl/BWBR0007839/2002-01-01#Artikel3
  - number: 3.1.b
    text: een indemniteitsverklaring een aanmerkelijke besparing op de verzekeringskosten ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0007839/2002-01-01#Artikel3
  - number: '3.2'
    text: |-
      Een indemniteitsverklaring kan voorts slechts worden verleend indien er naar het oordeel van de minister een
      acceptabele verhouding aanwezig is tussen enerzijds het belang van de tentoonstelling en de besparing, bedoeld in
      het eerste lid, onder b, en anderzijds het door de Staat te aanvaarden risico.
    url: https://wetten.overheid.nl/BWBR0007839/2002-01-01#Artikel3
  - number: '4'
    text: |-
      De aanvraag voor een indemniteitsverklaring gaat, onverminderd [artikel 11][ref1] van het Besluit, vergezeld van:


      [ref1]: https://wetten.overheid.nl/BWBR0006759#Artikel11
    url: https://wetten.overheid.nl/BWBR0007839/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006759
        artikel: '11'
  - number: 4.a
    text: een tentoonstellings- en beveiligingsplan alsmede een overzicht van de klimaatbeheersingsvoorzieningen;
    url: https://wetten.overheid.nl/BWBR0007839/2002-01-01#Artikel4
  - number: 4.b
    text: drie verzekeringsoffertes.
    url: https://wetten.overheid.nl/BWBR0007839/2002-01-01#Artikel4
  - number: '5'
    text: Op de aanvragen wordt beslist in de volgorde waarin zij door de minister zijn ontvangen.
    url: https://wetten.overheid.nl/BWBR0007839/2002-01-01#Artikel5
  - number: '6.1'
    text: |-
      De rapportage omtrent de naleving van de subsidiebepalingen, bedoeld in [artikel 36][ref1] van het Besluit,
      geschiedt overeenkomstig de voorschriften die daaromtrent in de indemniteitsverklaring zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006759#Artikel36
    url: https://wetten.overheid.nl/BWBR0007839/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006759
        artikel: '36'
  - number: '6.2'
    text: |-
      De rapportage, bedoeld in het eerste lid, blijft achterwege indien blijkens de aanvraag voor de
      subsidievaststelling de exploitatie van de tentoonstelling geen tekort vertoont dat veroorzaakt wordt door verlies
      van of schade aan door derden ten behoeve van de tentoonstelling in bruikleen gegeven voorwerpen.
    url: https://wetten.overheid.nl/BWBR0007839/2002-01-01#Artikel6
  - number: '7'
    text: |-
      De ontvanger van de indemniteitsverklaring stelt na afloop van de tentoonstelling een financieel overzicht van
      die tentoonstelling vast en dient dat overzicht tezamen met de aanvraag voor subsidie vaststelling, bedoeld in
      [artikel 33][ref1] van het Besluit, bij de minister in.


      [ref1]: https://wetten.overheid.nl/BWBR0006759#Artikel33
    url: https://wetten.overheid.nl/BWBR0007839/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006759
        artikel: '33'
  - number: '8'
    text: |-
      Een tentoonstellings- en beveiligingsplan alsmede een overzicht van de klimaatbeheersingsvoorzieningen worden
      ingericht overeenkomstig het in [bijlage II][ref1] opgenomen formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0007839
    url: https://wetten.overheid.nl/BWBR0007839/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007839
  - number: '9'
    text: De Regeling indemniteit bruiklenen wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007839/2002-01-01#Artikel9
  - number: '10'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0007839/2002-01-01#Artikel10
  - number: '11'
    text: 'Deze regeling wordt aangehaald als: Subsidieregeling indemniteit bruiklenen.'
    url: https://wetten.overheid.nl/BWBR0007839/2002-01-01#Artikel11
