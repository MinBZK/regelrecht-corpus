---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_aanwijzing_bijzondere_medische_verrichtingen
regulatory_layer: WET
publication_date: '2025-05-16'
valid_from: '2025-07-01'
bwb_id: BWBR0035311
url: https://wetten.overheid.nl/BWBR0035311/2025-07-01
preamble:
  text: |-
    Gelet op de artikelen 2, eerste lid, 5, en 6, tweede lid, van de Wet op bijzondere medische verrichtingen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0035311/2025-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Het is verboden zonder vergunning van de Minister van Volksgezondheid, Welzijn en Sport de navolgende verrichtingen
      uit te voeren of te doen uitvoeren:
    url: https://wetten.overheid.nl/BWBR0035311/2025-07-01#Artikel1
  - number: 1.1.a
    text: |-
      orgaantransplantatie, inhoudende transplantatie van hart, nier, alvleesklier, long, lever of dunne darm, dan wel
      delen of cellen van deze organen;
    url: https://wetten.overheid.nl/BWBR0035311/2025-07-01#Artikel1
  - number: 1.1.b
    text: |-
      implantatie van kunstorganen, voor zover betrekking hebbend op de organen, genoemd onder a, en bedoeld als
      vervanging van het oorspronkelijke orgaan of een deel daarvan;
    url: https://wetten.overheid.nl/BWBR0035311/2025-07-01#Artikel1
  - number: 1.1.c
    text: |-
      autologe en allogene transplantatie van hematopoietische stamcellen uit beenmerg, perifeer bloed of
      navelstrengbloed;
    url: https://wetten.overheid.nl/BWBR0035311/2025-07-01#Artikel1
  - number: 1.1.d
    text: |-
      celtransplantatie, inhoudende het in- of aanbrengen van menselijke cellen bij patiënten om hun gezondheidstoestand
      te verbeteren, anders dan: - het in- of aanbrengen van menselijke cellen als onderdeel van orgaantransplantatie als
      bedoeld onder a;
        - autologe en allogene transplantatie van hematopoietische stamcellen uit beenmerg, perifeer bloed of
      navelstrengbloed als bedoeld onder c;
        - het in- of aanbrengen van weefsel waarvan de voor het beoogde klinisch gebruik relevante biologische
      eigenschappen, fysiologische functies of structurele eigenschappen niet zijn gewijzigd; of
        - het toepassen van menselijk bloed als zodanig;
    url: https://wetten.overheid.nl/BWBR0035311/2025-07-01#Artikel1
  - number: 1.1.e
    text: |-
      bijzondere interventies aan het hart, inhoudende hartchirurgie en alle vormen van therapeutische
      interventiecardiologie met inbegrip van de implantatie van een defibrillator;
    url: https://wetten.overheid.nl/BWBR0035311/2025-07-01#Artikel1
  - number: 1.1.f
    text: protonentherapie en andere vormen van deeltjestherapie;
    url: https://wetten.overheid.nl/BWBR0035311/2025-07-01#Artikel1
  - number: 1.1.g
    text: |-
      bijzondere neurochirurgie, inhoudende neurochirurgie, voor zover dit de chirurgische behandeling betreft van
      aandoeningen aan de hersenen, de hersenschedel, de schedelbasis, de hersenzenuwen, het ruggenmerg, de zenuwwortels
      en de omgevende vliezen, alsmede die aandoeningen die de functionaliteit beïnvloeden van hersenen, ruggenmerg of
      cauda equina, en de microchirurgische behandeling van de plexus brachialis;
    url: https://wetten.overheid.nl/BWBR0035311/2025-07-01#Artikel1
  - number: 1.1.h
    text: |-
      klinisch genetisch onderzoek en erfelijkheidsadvisering, inhoudende: - geavanceerd prenataal ultrageluidsonderzoek
      naar structurele foetale afwijkingen;
        - afname van foetaal materiaal en prenataal biochemisch, chromosoom-, en DNA-onderzoek, ten behoeve van de
      diagnostiek van aangeboren en erfelijke afwijkingen;
        - afname en onderzoek van foetaal DNA uit maternaal materiaal voor het vaststellen van het geslacht van de foetus;
        - prenataal biochemisch, chromosoom-, en DNA-onderzoek ten behoeve van de diagnostiek van aangeboren en erfelijke
      afwijkingen;
        - genetisch onderzoek voorafgaande aan de implantatie van een embryo;
        - postnataal biochemisch, chromosoom-, en DNA-onderzoek ten behoeve van de diagnostiek van aangeboren en erfelijke
      afwijkingen, van dragerschap van deze aandoeningen en van stoornissen in de geslachtelijke ontwikkeling en functie;
        - erfelijkheidsadvisering van complexe aard;
    url: https://wetten.overheid.nl/BWBR0035311/2025-07-01#Artikel1
  - number: 1.1.i
    text: in-vitrofertilisatie, voor zover dit betreft het buiten het lichaam tot stand brengen van menselijke embryo’s;
    url: https://wetten.overheid.nl/BWBR0035311/2025-07-01#Artikel1
  - number: 1.1.j
    text: neonatale intensive care met uitzondering van neonatale chirurgische zorg.
    url: https://wetten.overheid.nl/BWBR0035311/2025-07-01#Artikel1
  - number: '1.2'
    text: |-
      In afwijking van het eerste lid, aanhef, en onder d, is het niet verboden om zonder vergunning celtransplantatie
      toe te passen indien ten aanzien van de gebruikte cellen:
    url: https://wetten.overheid.nl/BWBR0035311/2025-07-01#Artikel1
  - number: 1.2.a
    text: |-
      een handelsvergunning op grond van [artikel 40, eerste lid, van de Geneesmiddelenwet][ref1] is verkregen;


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel40
    url: https://wetten.overheid.nl/BWBR0035311/2025-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '40'
  - number: 1.2.b
    text: |-
      op grond van [artikel 40, derde lid, onder d of f, van de Geneesmiddelenwet][ref1] geen handelsvergunning nodig is
      voor het in voorraad hebben, verkopen, ter hand stellen of invoeren van het geneesmiddel; of


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel40
    url: https://wetten.overheid.nl/BWBR0035311/2025-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '40'
  - number: 1.2.c
    text: |-
      goedkeuring van een bevoegde instantie als bedoeld in
      [artikel 2, tweede lid, van de Wet medisch-wetenschappelijk onderzoek][ref1] met mensen is verkregen voor een
      onderzoeksprotocol als bedoeld in artikel 2, eerste lid, van die wet, waarvan het gebruik van die cellen deel
      uitmaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel2
    url: https://wetten.overheid.nl/BWBR0035311/2025-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '2'
  - number: '2'
    text: |-
      Vergunningen die zijn verleend ingevolge de [Wet op bijzondere medische verrichtingen][ref1] en daarmee
      gelijkgestelde vergunningen of toestemmingen, die op het moment van inwerkingtreding van deze regeling geldig
      zijn voor het uitvoeren van verrichtingen als bedoeld in [artikel 1][ref2], worden gelijkgesteld met vergunningen,
      verleend ingevolge deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0008974
      [ref2]: https://wetten.overheid.nl/BWBR0035311#Artikel1
    url: https://wetten.overheid.nl/BWBR0035311/2025-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008974
      - id: ref2
        bwb_id: BWBR0035311
        artikel: '1'
  - number: '3'
    text: |-
      Het [Planningsbesluit radiotherapie 2009][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0026610
    url: https://wetten.overheid.nl/BWBR0035311/2025-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0026610
  - number: '4'
    text: |-
      Deze regeling treedt in werking op het tijdstip waarop de wet van 16 april 2014 tot wijziging van de Wet op
      bijzondere medische verrichtingen in verband met de invoering van een startmeldingsplicht voor beperkte duur voor
      het uitvoeren van verrichtingen waarvoor niet langer een vergunning op grond van deze wet is vereist (Stb. 2014,
      165), in werking treedt.
    url: https://wetten.overheid.nl/BWBR0035311/2025-07-01#Artikel4
  - number: '5'
    text: 'Deze regeling wordt aangehaald als: Regeling aanwijzing bijzondere medische verrichtingen.'
    url: https://wetten.overheid.nl/BWBR0035311/2025-07-01#Artikel5
