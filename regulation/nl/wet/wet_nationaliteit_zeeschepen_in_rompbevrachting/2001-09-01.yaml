---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_nationaliteit_zeeschepen_in_rompbevrachting
regulatory_layer: WET
publication_date: '2023-05-10'
valid_from: '2001-09-01'
bwb_id: BWBR0005681
url: https://wetten.overheid.nl/BWBR0005681/2001-09-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is met het oog op een bestendige ontwikkeling van
    de Nederlandse zeescheepvaart wettelijke bepalingen vast te stellen inzake de nationaliteit van zeeschepen in
    Nederlandse rompbevrachting die buiten Nederland in een eigenaarsregister van zeeschepen teboekstaan;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel1
  - number: 1.a
    text: |-
      zeeschepen: schepen die blijkens hun constructie uitsluitend of in hoofdzaak voor drijven in zee zijn bestemd, met
      uitzondering van:
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel1
  - number: 1.a.1°
    text: oorlogsschepen,
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel1
  - number: 1.a.2°
    text: reddingsschepen, en
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel1
  - number: 1.a.3°
    text: zeevissersschepen;
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel1
  - number: 1.b
    text: |-
      rompbevrachting: de overeenkomst, waarbij de ene partij, de rompvervrachter, zich verbindt een zeeschip zonder
      bemanning voor een bepaalde tijd ter beschikking te stellen van haar wederpartij, de rompbevrachter, zonder
      daarover nog enige zeggenschap te houden, en de rompbevrachter het schip exploiteert;
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel1
  - number: 1.c
    text: 'Onze Minister: Onze Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel1
  - number: 1.d
    text: |-
      buiten Nederland teboekstaan: buiten Nederland teboekstaan in een eigenaarsregister van zeeschepen,
      dat vergelijkbaar is met het openbaar register voor de teboekstelling van zeeschepen, genoemd in
      [artikel 193 van Boek 8 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel193
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '193'
  - number: 1.e
    text: 'notaris: een in Nederland gevestigde notaris.'
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel1
  - number: '2.1'
    text: Er is een openbaar rompbevrachtingsregister, dat door Onze Minister wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel2
  - number: '2.2'
    text: 'Het rompbevrachtingsregister bevat ten aanzien van elk daarin ingeschreven zeeschip de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel2
  - number: 2.2.a
    text: de naam die het schip voert;
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel2
  - number: 2.2.b
    text: de naam waaronder het schip buiten Nederland teboekstaat;
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel2
  - number: 2.2.c
    text: de bruto en netto tonnage van het schip volgens de door de Scheepsmetingsdienst afgegeven meetbrief;
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel2
  - number: 2.2.d
    text: 'de beschrijving van het schip, welke de volgende gegevens dient te bevatten:'
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel2
  - number: 2.2.d.1°
    text: het type en de inrichting van het schip,
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel2
  - number: 2.2.d.2°
    text: het materiaal waarvan de romp is gemaakt,
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel2
  - number: 2.2.d.3°
    text: de overige speciale kenmerken van het schip,
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel2
  - number: 2.2.d.4°
    text: het unieke scheepsidentificatienummer,
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel2
  - number: 2.2.d.5°
    text: de naam en de vestigingsplaats van de werf waar het schip is gebouwd,
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel2
  - number: 2.2.d.6°
    text: het bouwjaar en het bouwnummer,
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel2
  - number: 2.2.d.7°
    text: het aantal motoren waaruit de voortstuwingsinstallatie bestaat, en
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel2
  - number: 2.2.d.8°
    text: het type, het vermogen, de fabrikant en het fabrieksnummer van elke motor;
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel2
  - number: 2.2.e
    text: |-
      de naam en het adres van het kantoor, waar het schip buiten Nederland teboekstaat, met vermelding van de
      dagtekening en de nummering van de teboekstelling;
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel2
  - number: 2.2.f
    text: de naam en het adres van de eigenaar;
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel2
  - number: 2.2.g
    text: de naam en het adres van de rompbevrachter;
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel2
  - number: 2.2.h
    text: de dagtekening van de rompbevrachtingsovereenkomst en de tijdsduur waarvoor die overeenkomst is afgesloten.
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel2
  - number: '2.3'
    text: |-
      Desgevraagd verleent Onze Minister kosteloos inzage in het rompbevrachtingsregister, en geeft hij tegen kostprijs
      voor eensluidend gewaarmerkte uittreksels daaruit af.
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel2
  - number: '2.4'
    text: |-
      Het doel van het rompbevrachtingsregister is de goede uitvoering van de bij of krachtens deze wet vastgestelde
      regels.
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel2
  - number: '3.1'
    text: |-
      Een zeeschip dat buiten Nederland teboekstaat, kan in het rompbevrachtingsregister worden ingeschreven, indien
      wordt voldaan aan de volgende vereisten:
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel3
  - number: 3.1.a
    text: |-
      het schip is voor een tijdvak van ten minste twaalf maanden in rompbevrachting afgestaan aan een of meer
      natuurlijke personen dan wel rechtspersonen, van wie ten minste twee derde deel de nationaliteit van een van
      de Lid-Staten van de Europese Gemeenschappen of een van de overige Staten die partij zijn bij de Overeenkomst
      betreffende de Europese Economische Ruimte bezit;
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel3
  - number: 3.1.b
    text: |-
      de rompbevrachter oefent het zeescheepvaartbedrijf in Nederland uit door middel van een
      onderneming die in Nederland gevestigd is of in Nederland een nevenvestiging heeft in de zin van
      [artikel 3, eerste lid , van de Handelsregisterwet 1996][ref1], terwijl het beheer over het schip door of namens de
      rompbevrachter geheel of in hoofdzaak in Nederland wordt gevoerd;


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel3
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007893
        artikel: '3'
  - number: 3.1.c
    text: 'de rompbevrachter draagt er zorg voor dat:'
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel3
  - number: 3.1.c.1°
    text: |-
      de dagelijkse leiding van de onder *b* bedoelde vestiging berust bij een of meer natuurlijke personen die de
      nationaliteit bezitten van een van de Lid-Staten van de Europese Gemeenschappen of een van de overige Staten die
      partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte en
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel3
  - number: 3.1.c.2°
    text: |-
      deze natuurlijke persoon of personen beschikken over vertegenwoordigingsbevoegdheid inzake alle met het beheer over
      het schip verband houdende aangelegenheden betreffende het schip, de kapitein en de overige leden van de bemanning;
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel3
  - number: 3.1.d
    text: |-
      de eigenaar en de rompvervrachter - indien deze een ander is dan de eigenaar - stemmen schriftelijk in met het
      verkrijgen van de hoedanigheid van Nederlands schip;
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel3
  - number: 3.1.e
    text: |-
      de rompbevrachter aanvaardt de verantwoordelijkheid voor het schip en zijn opvarenden die voortvloeit uit de
      hoedanigheid van Nederlands schip;
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel3
  - number: 3.1.f
    text: |-
      ingevolge de wetgeving van de staat waar het schip teboekstaat zijn er geen beletselen voor het verkrijgen van
      de hoedanigheid van Nederlands schip in verband met het aangaan van een rompbevrachtingsovereenkomst met een in
      Nederland gevestigde rompbevrachter.
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel3
  - number: '3.2'
    text: |-
      Onder rechtspersonen met de nationaliteit van een van de Lid-Staten van de Europese Gemeenschappen of van een van
      de overige Staten die partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte, worden in dit
      artikel verstaan: rechtspersonen die in overeenstemming met de wetgeving van een van de Lid-Staten van de Europese
      Gemeenschappen of een van de overige Staten die partij zijn bij de Overeenkomst betreffende de Europese Economische
      Ruimte, de Nederlandse Antillen of Aruba zijn opgericht en die hun statutaire zetel, hun hoofdbestuur of hun
      hoofdvestiging binnen een van de Lid-Staten van de Europese Gemeenschappen of een van de overige Staten die partij
      zijn bij de Overeenkomst betreffende de Europese Economische Ruimte, de Nederlandse Antillen of Aruba hebben, mits:
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel3
  - number: 3.2.a
    text: |-
      hetzij aandelen, die ten minste twee derde deel van het geplaatste kapitaal vertegenwoordigen, op naam zijn
      gesteld van natuurlijke personen met de nationaliteit van een van de Lid-Staten van de Europese Gemeenschappen of
      een van de overige Staten die partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte of van
      rechtspersonen als bedoeld in de aanhef van dit lid, en tevens de meerderheid van de bestuurders de nationaliteit
      van een der Lid-Staten van de Europese Gemeenschappen bezit;
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel3
  - number: 3.2.b
    text: |-
      hetzij alle bestuurders de nationaliteit van een van de Lid-Staten van de Europese Gemeenschappen of een van de
      overige Staten die partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte bezitten.
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel3
  - number: '4.1'
    text: |-
      Bij de aanvraag tot inschrijving van een zeeschip in het rompbevrachtingsregister verschaft de rompbevrachter de
      volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel4
  - number: 4.1.a
    text: een recent authentiek afschrift van de teboekstelling van het zeeschip buiten Nederland;
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel4
  - number: 4.1.b
    text: |-
      een recent afschrift van de inschrijving in het handelsregister van de vestiging van de rompbevrachter in Nederland
      van waaruit hij het schip zal exploiteren;
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel4
  - number: 4.1.c
    text: |-
      een authentiek afschrift van de geldende statuten van de rompbevrachter indien deze rechtspersoon is, of van de
      akte van het aangaan van een vennootschap of een rederij indien de rompbevrachter een niet rechtspersoonlijkheid
      bezittende vennootschap of een rederij is, alsmede een opgave van een notaris betreffende de namen, adressen en
      nationaliteit van de bestuurders, onderscheidenlijk van de hoofdelijk aansprakelijke vennoten of van de leden van
      de rompbevrachter, dan wel indien de rompbevrachter een natuurlijk persoon is, een notariële opgave omtrent de
      naam, het adres en de nationaliteit van de rompbevrachter;
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel4
  - number: 4.1.d
    text: |-
      indien de rompbevrachter een rechtspersoon is met een in aandelen op naam verdeeld kapitaal, waarvan niet alle
      bestuurders de nationaliteit van een van de Lid-Staten van de Europese Gemeenschappen of een van de overige Staten
      die partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte bezitten, een opgave van een notaris
      betreffende de namen, adressen en nationaliteit van de aandeelhouders van de rompbevrachter;
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel4
  - number: 4.1.e
    text: |-
      een in de Nederlandse of Engelse taal gestelde schriftelijke verklaring van de rompvervrachter en de
      rompbevrachter, dat de eerstgenoemde zich verbonden heeft om het in deze verklaring omschreven zeeschip voor de
      daarin vermelde tijdsduur ter beschikking te stellen van de laatstgenoemde, zonder daarover nog enige zeggenschap
      te houden, en dat de laatstgenoemde het schip zal exploiteren;
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel4
  - number: 4.1.f
    text: |-
      een in de Nederlandse of Engelse taal gestelde schriftelijke verklaring van de eigenaar van het zeeschip, alsmede
      van de rompvervrachter - indien deze een ander is dan de eigenaar -, dat deze instemmen met het verlenen van de
      hoedanigheid van Nederlands schip aan het betrokken zeeschip;
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel4
  - number: 4.1.g
    text: |-
      een schriftelijke verklaring van de rompbevrachter waaruit blijkt dat hij de verantwoordelijkheid voor het schip
      en zijn opvarenden aanvaardt die voortvloeit uit de hoedanigheid van Nederlands schip, en dat het beheer over
      het schip door hem of door een of meer in deze verklaring genoemde anderen namens hem geheel of in hoofdzaak in
      Nederland wordt gevoerd;
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel4
  - number: 4.1.h
    text: de door de Scheepsmetingsdienst afgegeven meetbrief.
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel4
  - number: '4.2'
    text: |-
      Voorts toont de rompbevrachter ten genoegen van Onze Minister aan, dat het schip niet gerechtigd is de vlag
      te voeren van de staat waar het schip buiten Nederland teboekstaat, zolang het schip in Nederland in het
      rompbevrachtingsregister is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel4
  - number: '4.3'
    text: |-
      Onze Minister kan een verklaring omtrent de echtheid van het in het eerste lid, onder *a*, genoemde afschrift
      verlangen. Hij kan tevens een vertaling van het afschrift door een beëdigd vertaler in de Nederlandse of Engelse
      taal verlangen.
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel4
  - number: '4.4'
    text: |-
      Onze Minister kan voor de in het eerste lid, onder *e*, *f* en *g*, genoemde verklaringen nadere voorschriften
      vaststellen. Deze verklaringen dienen vergezeld te gaan van een door een notaris opgemaakte verklaring omtrent de
      identiteit en de vertegenwoordigingsbevoegdheid van de ondertekenende personen.
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel4
  - number: '4.5'
    text: |-
      Onze Minister weigert de inschrijving dan wel staat deze toe onder voorwaarden, indien de verkrijging van de
      hoedanigheid van Nederlands schip niet verenigbaar is met volkenrechtelijke verplichtingen van het Koninkrijk,
      onderscheidenlijk zonder het stellen van voorwaarden niet verenigbaar zou zijn.
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel4
  - number: '4.6'
    text: |-
      Onze Minister kan aan de inschrijving voorwaarden verbinden teneinde de voldoening van vorderingen uit de
      arbeidsovereenkomsten van de kapitein en de andere leden van de bemanning steeds gedurende ten minste één jaar
      te verzekeren.
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel4
  - number: '5.1'
    text: |-
      Door inschrijving in het rompbevrachtingsregister verkrijgt een zeeschip, dat buiten Nederland teboekstaat, de
      hoedanigheid van Nederlands schip.
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel5
  - number: '5.2'
    text: |-
      Het zeeschip verliest de hoedanigheid van Nederlands schip met ingang van de dagtekening van de doorhaling van de
      inschrijving in het rompbevrachtingsregister.
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel5
  - number: '6'
    text: |-
      Onze Minister stelt de representatieve organisaties van reders en zeevarenden, alsmede de bevoegde autoriteit
      van het kantoor, waar het schip buiten Nederland teboekstaat, onverwijld in kennis van elke inschrijving van een
      zeeschip in het rompbevrachtingsregister, en van elke wijziging of aanvulling van ingeschreven gegevens.
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel6
  - number: '7'
    text: |-
      De rompbevrachter stelt Onze Minister onverwijld schriftelijk in kennis van wijzigingen in gegevens betreffende
      de rompbevrachtingsovereenkomst, van het aangaan van enige nadere overeenkomst, alsmede van alle wijzigingen
      in de omstandigheden, welke van belang kunnen zijn in verband met de inschrijving dan wel de doorhaling van een
      inschrijving van een zeeschip in het rompbevrachtingsregister.
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel7
  - number: '8.1'
    text: 'Onze Minister haalt de inschrijving van een zeeschip in het rompbevrachtingsregister door:'
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel8
  - number: 8.1.a
    text: bij het einde van de rompbevrachtingsovereenkomst;
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel8
  - number: 8.1.b
    text: op aanvraag van de rompbevrachter;
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel8
  - number: 8.1.c
    text: |-
      indien uit gegevens overgelegd door de rompbevrachter overeenkomstig het bepaalde in [artikel 7][ref1] blijkt dat
      niet langer wordt voldaan aan de vereisten genoemd in [artikel 3][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005681#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005681#Artikel3
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005681
        artikel: '7'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005681
        artikel: '3'
        hoofdstuk: II
  - number: 8.1.d
    text: |-
      indien Onze Minister is gebleken dat één of meer van de overgelegde gegevens als bedoeld in [artikel 4][ref1]
      zodanig onvolledig of onjuist waren dat, ware dit ten tijde van de beoordeling van het verzoek om inschrijving
      bekend geweest, het verzoek zou zijn afgewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0005681#Artikel4
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005681
        artikel: '4'
        hoofdstuk: II
  - number: 8.1.e
    text: |-
      indien Onze Minister is gebleken van feiten of omstandigheden, voorgevallen onderscheidenlijk opgetreden na het
      tijdstip van indiening van de aanvraag, welke van zodanige aard zijn dat niet langer wordt voldaan aan de vereisten
      genoemd in [artikel 3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005681#Artikel3
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005681
        artikel: '3'
        hoofdstuk: II
  - number: 8.1.f
    text: |-
      indien Onze Minister is gebleken dat de rompbevrachter overeenkomsten heeft aangegaan die tot gevolg hebben dat de
      zeggenschap, onderscheidenlijk de verantwoordelijkheid van de rompbevrachter wezenlijk wordt aangetast;
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel8
  - number: 8.1.g
    text: |-
      indien de hoedanigheid van Nederlands schip niet langer verenigbaar is met volkenrechtelijke verplichtingen van het
      Koninkrijk en de onverenigbaarheid niet kan worden opgeheven door het stellen van voorwaarden.
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel8
  - number: '8.2'
    text: 'Onze Minister kan de inschrijving van een zeeschip in het rompbevrachtingsregister doorhalen:'
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel8
  - number: 8.2.a
    text: |-
      wegens overtreding van [artikel 3, tweede lid, van de Zeebrievenwet][ref1] (*Stb.* 1963, 229);


      [ref1]: https://wetten.overheid.nl/BWBR0001933#Artikel3
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001933
        artikel: '3'
  - number: 8.2.b
    text: |-
      indien zich één van de feiten voordoet, genoemd in [artikel 8, vierde lid, van de Zeebrievenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001933#Artikel8
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001933
        artikel: '8'
  - number: 8.2.c
    text: |-
      indien het schip wordt gebruikt voor het vervoer van verdovende middelen in de zin van de [Opiumwet][ref1] (*Stb.*
      1928, 167);


      [ref1]: https://wetten.overheid.nl/BWBR0001941
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001941
  - number: 8.2.d
    text: |-
      indien het schip op een zodanige wijze is gebruikt dat dientengevolge de betrekkingen van het Koninkrijk met één of
      meer andere staten ernstig worden benadeeld;
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel8
  - number: 8.2.e
    text: |-
      indien door Onze Minister op grond van [artikel 4, vijfde of zesde lid][ref1], gestelde voorwaarden niet worden
      nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0005681#Artikel4
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005681
        artikel: '4'
        hoofdstuk: II
  - number: '8.3'
    text: |-
      Onze Minister stelt de representatieve organisaties van reders en zeevarenden, alsmede de bevoegde autoriteit van
      het kantoor, waar het schip buiten Nederland teboekstaat, onverwijld in kennis van elke beschikking tot doorhaling
      van de inschrijving van een zeeschip in het rompbevrachtingsregister.
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel8
  - number: '9.1'
    text: |-
      Het[ tweede lid van artikel 4][ref1] is niet van toepassing op zeeschepen die teboekstaan in het openbaar register,
      genoemd in het [Wetboek van Koophandel][ref2] van de Nederlandse Antillen, onderscheidenlijk Aruba.


      [ref1]: https://wetten.overheid.nl/BWBR0005681#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0001838
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005681
        artikel: '4'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0001838
  - number: '9.2'
    text: |-
      Van een inschrijving in het rompbevrachtingsregister, van elke wijziging of aanvulling van ingeschreven gegevens,
      alsmede van een doorhaling van de inschrijving van een zeeschip dat teboekstaat in de Nederlandse Antillen of
      Aruba, wordt de Hoofdbewaarder der Scheepsbewijzen in de Nederlandse Antillen, onderscheidenlijk de Bewaarder der
      Scheepsbewijzen in Aruba onverwijld schriftelijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel9
  - number: '10'
    text: |-
      De rompbevrachter is terzake van iedere inschrijving alsmede iedere wijziging van de inschrijving van een zeeschip
      in het rompbevrachtingsregister een vergoeding verschuldigd ter dekking van de door de Staat gemaakte kosten. De
      hoogte van de vergoeding en de wijze waarop deze wordt geïnd worden vastgesteld door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel10
  - number: 10a.1
    text: |-
      Met het toezicht op de naleving van het bij de[ artikelen 3][ref1] en [8][ref2] bepaalde, zijn belast de bij
      besluit van Onze Minister van Verkeer en Waterstaat aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0005681#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005681#Artikel8
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0005681
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005681
        artikel: '8'
        hoofdstuk: II
  - number: 10a.2
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel10a
  - number: 10a.3
    text: |-
      De toezichthouders beschikken niet over de bevoegdheden, genoemd in de [artikelen 5:15][ref1] en
      [5:17 tot en met 5:20 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '11'
    text: |-
      Tegen een op grond van deze wet genomen besluit kan een belanghebbende beroep instellen bij het College van Beroep
      voor het bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel11
  - number: '12'
    text: |-
      Onze Minister brengt vijf jaren na het in werking treden van deze wet aan de Staten-Generaal verslag uit over de
      wijze waarop zij is toegepast.
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel12
  - number: '20.1'
    text: |-
      Deze wet treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel20
  - number: '20.2'
    text: |-
      De tekst van de [Zeebrievenwet][ref1] wordt door Onze Minister van Justitie in het *Staatsblad* geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0001933
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0001933
  - number: '21'
    text: 'Deze wet kan worden aangehaald als: Wet nationaliteit zeeschepen in rompbevrachting.'
    url: https://wetten.overheid.nl/BWBR0005681/2001-09-01#Artikel21
