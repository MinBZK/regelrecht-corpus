preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is met het oog op een bestendige ontwikkeling van
    de Nederlandse zeescheepvaart wettelijke bepalingen vast te stellen inzake de nationaliteit van zeeschepen in
    Nederlandse rompbevrachting die buiten Nederland in een eigenaarsregister van zeeschepen teboekstaan;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005681/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

      a. zeeschepen: schepen die blijkens hun constructie uitsluitend of in hoofdzaak voor drijven in zee zijn bestemd,
      met uitzondering van:

      1°. oorlogsschepen,

      2°. reddingsschepen, en

      3°. zeevissersschepen;

      b. rompbevrachting: de overeenkomst, waarbij de ene partij, de rompvervrachter, zich verbindt een zeeschip zonder
      bemanning voor een bepaalde tijd ter beschikking te stellen van haar wederpartij, de rompbevrachter, zonder
      daarover nog enige zeggenschap te houden, en de rompbevrachter het schip exploiteert;

      c. Onze Minister: Onze Minister van Verkeer en Waterstaat;

      d. buiten Nederland te boek staan: buiten Nederland te boek staan in een register soortgelijk aan de openbare
      registers, bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1];

      e. notaris: een in Nederland gevestigde notaris.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0005681/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: '2'
    text: |-
      1 Er is een openbaar rompbevrachtingsregister, dat door Onze Minister wordt gehouden.

      2 Het rompbevrachtingsregister bevat ten aanzien van elk daarin ingeschreven zeeschip de volgende gegevens:

      a. de naam die het schip voert;

      b. de naam waaronder het schip buiten Nederland teboekstaat;

      c. de bruto en netto tonnage van het schip volgens de door Onze Minister afgegeven meetbrief;

      d. de beschrijving van het schip, welke de volgende gegevens dient te bevatten:

      1°. het type en de inrichting van het schip,

      2°. het materiaal waarvan de romp is gemaakt,

      3°. de overige speciale kenmerken van het schip,

      4°. het unieke scheepsidentificatienummer,

      5°. de naam en de vestigingsplaats van de werf waar het schip is gebouwd,

      6°. het bouwjaar en het bouwnummer,

      7°. het aantal motoren waaruit de voortstuwingsinstallatie bestaat, en

      8°. het type, het vermogen, de fabrikant en het fabrieksnummer van elke motor;

      e. de naam en het adres van het kantoor, waar het schip buiten Nederland teboekstaat, met vermelding van de
      dagtekening en de nummering van de teboekstelling;

      f. de naam en het adres van de eigenaar;

      g. de naam en het adres van de rompbevrachter;

      h. de dagtekening van de rompbevrachtingsovereenkomst en de tijdsduur waarvoor die overeenkomst is afgesloten.

      3 Desgevraagd verleent Onze Minister kosteloos inzage in het rompbevrachtingsregister, en geeft hij tegen kostprijs
      voor eensluidend gewaarmerkte uittreksels daaruit af.

      4 Het doel van het rompbevrachtingsregister is de goede uitvoering van de bij of krachtens deze wet vastgestelde
      regels.
    url: https://wetten.overheid.nl/BWBR0005681/2013-01-01#Artikel2
  - number: '3'
    text: |-
      Een zeeschip dat buiten Nederland teboekstaat, kan in het rompbevrachtingsregister worden ingeschreven, indien
      wordt voldaan aan de volgende vereisten:

      a. het schip is in rompbevrachting afgestaan aan een of meer:

      1°. natuurlijke personen die de nationaliteit bezitten van een lidstaat van de Europese Unie, van een andere
      staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte, van Zwitserland, of die worden
      gelijkgesteld met EU-onderdanen ingevolge het van het Gemeenschapsrecht afgeleide recht;

      2°. vennootschappen waarop het recht van een lidstaat van de Europese Unie, van een van de landen, eilanden of
      gebieden, bedoeld in artikel 299, tweede tot en met vijfde lid en zesde lid, onder c, van het EG-Verdrag, van
      een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte, of van Zwitserland
      toepasselijk is;

      3°. natuurlijke personen of vennootschappen niet bedoeld onder 1° onderscheidenlijk 2° die aanspraak kunnen maken
      op het Europese recht van vrije vestiging ingevolge een overeenkomst tussen de Europese Unie en een derde staat;

      b. de rompbevrachter heeft in Nederland een hoofdvestiging of een nevenvestiging in de zin van de
      [Handelsregisterwet 2007][ref1];

      c. een of meer natuurlijke personen die in Nederland kantoor houden zijn namens de rompbevrachter verantwoordelijk
      voor het schip, de kapitein en de overige leden van de bemanning, alsmede voor de daarmee verband houdende
      aangelegenheden en zijn alleen of tezamen beslissingsbevoegd en beschikken over vertegenwoordigingsbevoegdheid;

      d. een of meer van de natuurlijke personen als bedoeld onder c, of, bij verhindering, een plaatsvervanger is bij
      voortduring bereikbaar en beschikt over bevoegdheden om onverwijld te kunnen handelen in situaties waarin dat
      geboden is;

      e. de eigenaar en de rompvervrachter – indien deze een ander is dan de eigenaar – stemmen schriftelijk in met het
      verkrijgen van de hoedanigheid van Nederlands schip;

      f. de rompbevrachter aanvaardt de verantwoordelijkheid voor het schip en zijn opvarenden die voortvloeit uit de
      hoedanigheid van Nederlands schip, en

      g. ingevolge de wetgeving van de staat waar het schip te boek staat, zijn er geen beletselen voor het verkrijgen
      van de hoedanigheid van Nederlands schip in verband met het aangaan van een rompbevrachtingsovereenkomst met een in
      Nederland gevestigde rompbevrachter.


      [ref1]: https://wetten.overheid.nl/BWBR0021777
    url: https://wetten.overheid.nl/BWBR0005681/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0021777
  - number: '4'
    text: |-
      1 Bij de aanvraag tot inschrijving van een zeeschip in het rompbevrachtingsregister verschaft de rompbevrachter de
      volgende gegevens:

      a. een recent authentiek afschrift van de teboekstelling van het zeeschip buiten Nederland;

      b. een recent afschrift van de inschrijving in het handelsregister van de vestiging van de rompbevrachter in
      Nederland van waaruit hij het schip zal exploiteren;

      c. een authentiek afschrift van de geldende statuten van de rompbevrachter indien deze rechtspersoon is, of van de
      akte van het aangaan van een vennootschap of een rederij indien de rompbevrachter een niet rechtspersoonlijkheid
      bezittende vennootschap of een rederij is, alsmede een opgave van een notaris betreffende de namen en adressen van
      de bestuurders, onderscheidenlijk van de hoofdelijk aansprakelijke vennoten of van de leden van de rompbevrachter,
      dan wel indien de rompbevrachter een natuurlijk persoon is, een notariële opgave omtrent de naam, het adres en de
      nationaliteit van de rompbevrachter;

      d. een opgave van de persoon of personen, bedoeld in [artikel 3, eerste lid, onderdeel c][ref1];

      e. een in de Nederlandse of Engelse taal gestelde schriftelijke verklaring van de rompvervrachter en de
      rompbevrachter, dat de eerstgenoemde zich verbonden heeft om het in deze verklaring omschreven zeeschip voor de
      daarin vermelde tijdsduur ter beschikking te stellen van de laatstgenoemde, zonder daarover nog enige zeggenschap
      te houden, en dat de laatstgenoemde het schip zal exploiteren;

      f. een in de Nederlandse of Engelse taal gestelde schriftelijke verklaring van de eigenaar van het zeeschip,
      alsmede van de rompvervrachter - indien deze een ander is dan de eigenaar -, dat deze instemmen met het verlenen
      van de hoedanigheid van Nederlands schip aan het betrokken zeeschip;

      g. een schriftelijke verklaring van de rompbevrachter waaruit blijkt dat hij de verantwoordelijkheid voor het schip
      en zijn opvarenden aanvaardt die voortvloeit uit de hoedanigheid van Nederlands schip;

      h. de door Onze Minister afgegeven meetbrief.

      2 Voorts toont de rompbevrachter ten genoegen van Onze Minister aan, dat het schip niet gerechtigd is de
      vlag te voeren van de staat waar het schip buiten Nederland teboekstaat, zolang het schip in Nederland in het
      rompbevrachtingsregister is ingeschreven.

      3 Onze Minister kan een verklaring omtrent de echtheid van het in het eerste lid, onder *a*, genoemde afschrift
      verlangen. Hij kan tevens een vertaling van het afschrift door een beëdigd vertaler in de Nederlandse of Engelse
      taal verlangen.

      4 Onze Minister kan voor de in het eerste lid, onder *e*, *f* en *g*, genoemde verklaringen nadere voorschriften
      vaststellen. Deze verklaringen dienen vergezeld te gaan van een door een notaris opgemaakte verklaring omtrent de
      identiteit en de vertegenwoordigingsbevoegdheid van de ondertekenende personen.

      5 Onze Minister weigert de inschrijving dan wel staat deze toe onder voorwaarden, indien de verkrijging van de
      hoedanigheid van Nederlands schip niet verenigbaar is met volkenrechtelijke verplichtingen van het Koninkrijk,
      onderscheidenlijk zonder het stellen van voorwaarden niet verenigbaar zou zijn.

      6 Onze Minister kan aan de inschrijving voorwaarden verbinden teneinde de voldoening van vorderingen uit de
      arbeidsovereenkomsten van de kapitein en de andere leden van de bemanning steeds gedurende ten minste één jaar
      te verzekeren.


      [ref1]: https://wetten.overheid.nl/BWBR0005681#Artikel3
    url: https://wetten.overheid.nl/BWBR0005681/2013-01-01#Artikel4
    references:
