  - number: '9'
    text: |-
      1 Het[ tweede lid van artikel 4][ref1] is niet van toepassing op zeeschepen die teboekstaan in het openbaar
      register, genoemd in het [Wetboek van Koophandel][ref2] van Aruba, Curaçao, onderscheidenlijk Sint Maarten.

      2 Van een inschrijving in het rompbevrachtingsregister, van elke wijziging of aanvulling van ingeschreven
      gegevens, alsmede van een doorhaling van de inschrijving van een zeeschip dat teboekstaat in Aruba, Curaçao of
      Sint Maarten, wordt de Bewaarder der Scheepsbewijzen in Aruba, de Hoofdbewaarder der Scheepsbewijzen in Curaçao,
      onderscheidenlijk de Hoofdbewaarder der Scheepsbewijzen in Sint Maarten onverwijld schriftelijk in kennis gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005681#Artikel4
