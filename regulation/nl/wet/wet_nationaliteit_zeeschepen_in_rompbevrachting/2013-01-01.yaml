        artikel: '3'
        hoofdstuk: II
  - number: '5'
    text: |-
      1 Door inschrijving in het rompbevrachtingsregister verkrijgt een zeeschip, dat buiten Nederland teboekstaat, de
      hoedanigheid van Nederlands schip.

      2 Het zeeschip verliest de hoedanigheid van Nederlands schip met ingang van de dagtekening van de doorhaling van de
      inschrijving in het rompbevrachtingsregister.
    url: https://wetten.overheid.nl/BWBR0005681/2013-01-01#Artikel5
  - number: '6'
    text: |-
      Onze Minister stelt de representatieve organisaties van reders en zeevarenden, alsmede de bevoegde autoriteit
      van het kantoor, waar het schip buiten Nederland teboekstaat, onverwijld in kennis van elke inschrijving van een
      zeeschip in het rompbevrachtingsregister, en van elke wijziging of aanvulling van ingeschreven gegevens.
    url: https://wetten.overheid.nl/BWBR0005681/2013-01-01#Artikel6
  - number: '7'
    text: |-
      De rompbevrachter stelt Onze Minister onverwijld schriftelijk in kennis van wijzigingen in gegevens betreffende
      de rompbevrachtingsovereenkomst, van het aangaan van enige nadere overeenkomst, alsmede van alle wijzigingen
      in de omstandigheden, welke van belang kunnen zijn in verband met de inschrijving dan wel de doorhaling van een
      inschrijving van een zeeschip in het rompbevrachtingsregister.
    url: https://wetten.overheid.nl/BWBR0005681/2013-01-01#Artikel7
  - number: '8'
    text: |-
      1 Onze Minister haalt de inschrijving van een zeeschip in het rompbevrachtingsregister door:

      a. bij het einde van de rompbevrachtingsovereenkomst;

      b. op aanvraag van de rompbevrachter;

      c. indien uit gegevens overgelegd door de rompbevrachter overeenkomstig het bepaalde in [artikel 7][ref1] blijkt
      dat niet langer wordt voldaan aan de vereisten genoemd in [artikel 3][ref2];

      d. indien Onze Minister is gebleken dat één of meer van de overgelegde gegevens als bedoeld in [artikel 4][ref3]
      zodanig onvolledig of onjuist waren dat, ware dit ten tijde van de beoordeling van het verzoek om inschrijving
      bekend geweest, het verzoek zou zijn afgewezen;

      e. indien Onze Minister is gebleken van feiten of omstandigheden, voorgevallen onderscheidenlijk opgetreden na het
      tijdstip van indiening van de aanvraag, welke van zodanige aard zijn dat niet langer wordt voldaan aan de vereisten
      genoemd in [artikel 3][ref4];

      f. indien Onze Minister is gebleken dat de rompbevrachter overeenkomsten heeft aangegaan die tot gevolg hebben dat
      de zeggenschap, onderscheidenlijk de verantwoordelijkheid van de rompbevrachter wezenlijk wordt aangetast;

      g. indien de hoedanigheid van Nederlands schip niet langer verenigbaar is met volkenrechtelijke verplichtingen van
      het Koninkrijk en de onverenigbaarheid niet kan worden opgeheven door het stellen van voorwaarden.

      2 Onze Minister kan de inschrijving van een zeeschip in het rompbevrachtingsregister doorhalen:

      a. wegens overtreding van [artikel 3, tweede lid, van de Zeebrievenwet][ref5] (*Stb.* 1963, 229);

      b. indien zich één van de feiten voordoet, genoemd in [artikel 8, vierde lid, van de Zeebrievenwet][ref6];

      c. indien het schip wordt gebruikt voor het vervoer van verdovende middelen in de zin van de [Opiumwet][ref7]
      (*Stb.* 1928, 167);

      d. indien het schip op een zodanige wijze is gebruikt dat dientengevolge de betrekkingen van het Koninkrijk met één
      of meer andere staten ernstig worden benadeeld;

      e. indien door Onze Minister op grond van [artikel 4, vijfde of zesde lid][ref8], gestelde voorwaarden niet worden
      nageleefd.

      3 Onze Minister stelt de representatieve organisaties van reders en zeevarenden, alsmede de bevoegde autoriteit van
      het kantoor, waar het schip buiten Nederland teboekstaat, onverwijld in kennis van elke beschikking tot doorhaling
      van de inschrijving van een zeeschip in het rompbevrachtingsregister.


