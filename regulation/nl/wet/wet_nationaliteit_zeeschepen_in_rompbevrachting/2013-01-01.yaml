  - number: '10'
    text: |-
      De rompbevrachter is terzake van iedere inschrijving alsmede iedere wijziging van de inschrijving van een zeeschip
      in het rompbevrachtingsregister een vergoeding verschuldigd ter dekking van de door de Staat gemaakte kosten. De
      hoogte van de vergoeding en de wijze waarop deze wordt geïnd worden vastgesteld door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005681/2013-01-01#Artikel10
  - number: 10a
    text: |-
      1 Met het toezicht op de naleving van het bij de[ artikelen 3][ref1] en [8][ref2] bepaalde, zijn belast de bij
      besluit van Onze Minister van Verkeer en Waterstaat aangewezen ambtenaren.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.

      3 De toezichthouders beschikken niet over de bevoegdheden, genoemd in de [artikelen 5:15][ref3] en
      [5:17 tot en met 5:20 van de Algemene wet bestuursrecht][ref4].


