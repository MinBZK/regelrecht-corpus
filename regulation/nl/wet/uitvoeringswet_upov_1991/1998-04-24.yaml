preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de op 19 maart 1991 te Genève tot stand gekomen herziening van het
    Internationaal Verdrag tot bescherming van kweekprodukten ingevolge artikel 91, eerste lid, van de Grondwet, de
    goedkeuring van de Staten-Generaal behoeft alvorens het Koninkrijk daaraan kan worden gebonden, en dat het uit
    hoofde van genoemd verdrag noodzakelijk is de Zaaizaad- en Plantgoedwet en de Wet op de economische delicten op
    onderdelen te wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008141/1998-04-24#ArtikelAanhef
articles:
  - number: I
    text: |-
      De op 19 maart 1991 te Genève tot stand gekomen herziening van het Internationaal Verdrag tot bescherming van
      kweekprodukten, waarvan de Franse en Engelse tekst zijn geplaatst in *Tractatenblad* 1992, 52 en de vertaling in
      het Nederlands in *Tractatenblad* 1993, 153, wordt goedgekeurd voor Nederland.
    url: https://wetten.overheid.nl/BWBR0008141/1998-04-24#ArtikelI
  - number: IV
    text: |-
      1 Deze wet is van toepassing met betrekking tot rassen, waarvoor reeds voor de datum van inwerkingtreding van deze
      wet kwekersrecht is verleend, met dien verstande dat op handelingen, als bedoeld in artikel 40, eerste lid, met
      betrekking tot materiaal van dergelijke rassen, welke plaatsvinden voor de datum van inwerkingtreding van deze wet,
      de bepalingen van de [Zaaizaad- en Plantgoedwet][ref1], zoals zij tot die datum luidden, van toepassing zijn.

      2 Artikel 40, vierde en vijfde lid, zijn niet van toepassing op geoogst materiaal of direct daaruit verkregen
      produkten, welke voor de datum van inwerkingtreding van deze wet verkregen zijn door vermeerdering van
      teeltmateriaal, waarvoor geen toestemming was verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002541
    url: https://wetten.overheid.nl/BWBR0008141/1998-04-24#ArtikelIV
    references:
      - id: ref1
        bwb_id: BWBR0002541
  - number: V
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin zij wordt
      geplaatst, met uitzondering van de [artikelen II][ref1], [III][ref2] en [IV][ref3], die in werking treden op een
      bij koninklijk besluit te bepalen tijdstip.


