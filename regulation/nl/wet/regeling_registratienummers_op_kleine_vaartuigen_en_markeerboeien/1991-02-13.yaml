preamble:
  text: |-
    Gelet op artikel 3, eerste lid, aanhef en onderdeel a, van het Reglement zee- en kustvisserij 1977 (Stb. 666);

    Gehoord het Produktschap van Vis en Visprodukten, het Visserijschap en het Bedrijfschap voor de groothandel in Vis
    en Aanverwante Produkten;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0004991/1991-02-13#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:




              *vissersvaartuig:*


              vaartuig waar de visserij mee wordt uitgeoefend en dat de vlag voert van, of geregistreerd is in een
      lidstaat van de Europese Gemeenschap;




              *markeerboei:*


              boei die bestemd is om de plaats waar een vistuig zich bevindt aan te geven;




              *registratienummer:*


              combinatie van lettertekens en nummers die volgens de regelgeving in de verschillende lidstaten van de
      Europese Gemeenschap op vissersvaartuigen moet zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0004991/1991-02-13#Artikel1
  - number: '2'
    text: |-
      1 Het is verboden kleine vaartuigen aan boord van een vissersvaartuig te houden zonder dat deze zijn voorzien van
      het registratienummer van het vissersvaartuig aan boord waarvan het vaartuig zich bevindt.

      2 Het in het eerste lid bedoelde registratienummer moet zijn geplaatst op de romp van het vaartuig aan beide kanten
      van de boeg, met dien verstande dat de afstand tussen de bovenrand van de romp en de bovenkant van het nummer niet
      meer dan 10 cm mag bedragen.

      3 Het in het eerste lid bedoelde nummer moet met wit zijn geschilderd op een constrasterende ondergrond, alsmede
      goed gevormd en duidelijk leesbaar zijn. De hoogte van elke letter of elk cijfer bedraagt tenminste 10 cm, met een
      lijndikte van tenminste 2 cm. De onderlinge afstand tussen letters en cijfers moet tenminste 2 cm zijn.
    url: https://wetten.overheid.nl/BWBR0004991/1991-02-13#Artikel2
  - number: '3'
    text: |-
      1 Het is verboden een markeerboei in het water uit te zetten of aan boord van een vissersvaartuig te houden, zonder
      dat deze is voorzien van het registratienummer van het vissersvaartuig waarmee de visserij met het vistuig waaraan
      de boei is gehecht, wordt uitgeoefend, danwel van het vissersvaartuig aan boord waarvan de boei zich bevindt.

      2 Het in het eerste lid bedoelde registratienummer moet zijn geplaatst op het deel van de boei dat, indien de boei
      in het water drijft, boven de waterspiegel uitsteekt.

      3 Het in het eerste lid bedoeld registratienummer moet met wit zijn geschilderd op een constrasterende ondergrond,
      alsmede goed gevormd en duidelijk leesbaar zijn. De hoogte van elke letter of elk cijfer bedraagt tenminste 5 cm,
      met een lijndikte van tenminste 1 cm. De onderlinge afstand tussen letters en cijfers moeten tenminste 1 cm zijn.
    url: https://wetten.overheid.nl/BWBR0004991/1991-02-13#Artikel3
  - number: '4'
    text: |-
      1 Deze regeling kan worden aangehaald als: Regeling registratienummers op kleine vaartuigen en markeerboeien.

      2 Zij treedt in werking met ingang van de dag na die van haar bekendmaking in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004991/1991-02-13#Artikel4
