preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de regelgeving met betrekking tot de pensioenen en
    sociale zekerheid van het personeel in dienst van de Koninklijke Hofhouding van het Huis van Oranje-Nassau aan te
    passen en in overeenstemming te brengen met de situatie die sedert de privatisering van het Algemeen burgerlijk
    pensioenfonds bestaat;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008328/2007-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

      a. overeenkomst: iedere overeenkomst op het terrein van pensioenen, vervroegd uittreden en sociale zekerheid van
      het personeel van de Koninklijke Hofhouding die de Stichting aangaat met het doel de uitvoering van die pensioenen,
      of uitkeringen ter zake van vervroegd uittreden of sociale zekerheid over te dragen aan een derde, of overeenkomst
      tot wijziging van een dergelijke overeenkomst;

      b. personeel van de Koninklijke Hofhouding: zij die door de Koning in dienst zijn genomen om bij de Koninklijke
      Hofhouding werkzaam te zijn, alsmede de Administrateur van het Kroondomein en het personeel, bedoeld in
      [artikel 5, derde lid, van de Wet financieel statuut van het Koninklijk Huis][ref1];

      c.

      d. Stichting: de Stichting tot verzorging van de pensioenen van het personeel van de Koninklijke Hofhouding van het
      Huis van Oranje-Nassau, opgericht te 's-Gravenhage bij notariële akte van 24 maart 1960;

      e. Stichting Pensioenfonds ABP: de Stichting Pensioenfonds ABP, bedoeld in
      [artikel 6, van de Wet Privatisering ABP][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002845#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007791#Artikel6
    url: https://wetten.overheid.nl/BWBR0008328/2007-01-01#Artikel1
    references:
