  - number: '2'
    text: |-
      1 Een overeenkomst komt slechts tot stand na instemming van Onze Ministers van Binnenlandse Zaken en van Financiën.

      2 Onze Minister van Binnenlandse Zaken brengt het aangaan van een overeenkomst alsmede het wijzigen daarvan
      onverwijld ter kennis van de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0008328/2007-01-01#Artikel2
  - number: '3'
    text: |-
      1 Voor de toepassing van de [Pensioenwet][ref1]:

      a. wordt de Stichting niet beschouwd als een ondernemingspensioenfonds;

      b. wordt de Stichting beschouwd als werkgever;

      c. worden de deelnemers aan de pensioenregeling voor het personeel van de Koninklijke Hofhouding beschouwd als
      werknemer.

      2 De uitvoeringsovereenkomst, bedoeld in de [Pensioenwet][ref2], wordt door middel van een overeenkomst tussen
      de Stichting en de Stichting Pensioenfonds ABP bij laatstgenoemde stichting neergelegd, tenzij Onze Ministers van
      Binnenlandse Zaken en van Financiën op verzoek van de Stichting anders besluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0020809
      [ref2]: https://wetten.overheid.nl/BWBR0020809
    url: https://wetten.overheid.nl/BWBR0008328/2007-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020809
      - id: ref2
        bwb_id: BWBR0020809
  - number: '7'
    text: |-
      De op 19 augustus 1960 tussen de Stichting en het Algemeen burgerlijk pensioenfonds gesloten overeenkomst,
      welke overeenkomst laatstelijk op 21 februari 1992 is gewijzigd en op 1 januari 1996 ingevolge
      [artikel 24 van de Wet Privatisering ABP][ref1] onder algemene titel is overgegaan op de Stichting Pensioenfonds
      ABP, wordt aangemerkt als een overeenkomst als bedoeld in [artikel 3, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0008328#Artikel3
    url: https://wetten.overheid.nl/BWBR0008328/2007-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0008328
        artikel: '3'
  - number: '8'
    text: |-
      Indien de werkgevers behorende tot de sector Rijk de toezegging omtrent pensioen gezamenlijk door een andere
      pensioenuitvoerder dan de Stichting Pensioenfonds ABP laten uitvoeren, wordt de uitvoering van de door de
      Stichting gedane toezegging omtrent pensioen door middel van een overeenkomst tussen de Stichting en deze andere
      pensioenuitvoerder bij laatstbedoelde pensioenuitvoerder ondergebracht, tenzij Onze Ministers van Binnenlandse
      Zaken en van Financiën op verzoek van de Stichting anders besluiten.
    url: https://wetten.overheid.nl/BWBR0008328/2007-01-01#Artikel8
  - number: '9'
    text: |-
      De Wet van 27 juli 1960, houdende maatregelen met betrekking tot de pensioenen van het personeel van de Koninklijke
      Hofhouding (*Stb*.1960, 314) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008328/2007-01-01#Artikel9
  - number: '10'
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin zij wordt
      geplaatst en werkt terug tot en met 1 januari 1996.
    url: https://wetten.overheid.nl/BWBR0008328/2007-01-01#Artikel10
  - number: '11'
    text: 'Deze wet wordt aangehaald als: Wet gevolgen privatisering ABP voor het personeel van de Koninklijke Hofhouding.'
    url: https://wetten.overheid.nl/BWBR0008328/2007-01-01#Artikel11
