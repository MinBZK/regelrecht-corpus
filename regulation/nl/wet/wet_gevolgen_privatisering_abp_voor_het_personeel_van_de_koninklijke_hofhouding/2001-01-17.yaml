$id: wet_gevolgen_privatisering_abp_voor_het_personeel_van_de_koninklijke_hofhouding
regulatory_layer: WET
publication_date: '2006-12-22'
valid_from: '2001-01-17'
bwb_id: BWBR0008328
url: https://wetten.overheid.nl/BWBR0008328/2001-01-17
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de regelgeving met betrekking tot de pensioenen en
    sociale zekerheid van het personeel in dienst van de Koninklijke Hofhouding van het Huis van Oranje-Nassau aan te
    passen en in overeenstemming te brengen met de situatie die sedert de privatisering van het Algemeen burgerlijk
    pensioenfonds bestaat;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008328/2001-01-17#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008328/2001-01-17#Artikel1
  - number: 1.a
    text: |-
      overeenkomst: iedere overeenkomst op het terrein van pensioenen, vervroegd uittreden en sociale zekerheid van het
      personeel van de Koninklijke Hofhouding die de Stichting aangaat met het doel de uitvoering van die pensioenen, of
      uitkeringen ter zake van vervroegd uittreden of sociale zekerheid over te dragen aan een derde, of overeenkomst tot
      wijziging van een dergelijke overeenkomst;
    url: https://wetten.overheid.nl/BWBR0008328/2001-01-17#Artikel1
  - number: 1.b
    text: |-
      personeel van de Koninklijke Hofhouding: zij die door de Koning in dienst zijn genomen om bij de Koninklijke
      Hofhouding werkzaam te zijn, alsmede de Administrateur van het Kroondomein en het personeel, bedoeld in
      [artikel 5, derde lid, van de Wet financieel statuut van het Koninklijk Huis][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002845#Artikel5
    url: https://wetten.overheid.nl/BWBR0008328/2001-01-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002845
        artikel: '5'
  - number: 1.c
    text: |-
      PSW: de [Pensioen- en spaarfondsenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002089
    url: https://wetten.overheid.nl/BWBR0008328/2001-01-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002089
  - number: 1.d
    text: |-
      Stichting: de Stichting tot verzorging van de pensioenen van het personeel van de Koninklijke Hofhouding van het
      Huis van Oranje-Nassau, opgericht te 's-Gravenhage bij notariële akte van 24 maart 1960;
    url: https://wetten.overheid.nl/BWBR0008328/2001-01-17#Artikel1
  - number: 1.e
    text: |-
      Stichting Pensioenfonds ABP: de Stichting Pensioenfonds ABP, bedoeld in
      [artikel 6, van de Wet Privatisering ABP][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel6
    url: https://wetten.overheid.nl/BWBR0008328/2001-01-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '6'
  - number: '2.1'
    text: Een overeenkomst komt slechts tot stand na instemming van Onze Ministers van Binnenlandse Zaken en van Financiën.
    url: https://wetten.overheid.nl/BWBR0008328/2001-01-17#Artikel2
  - number: '2.2'
    text: |-
      Onze Minister van Binnenlandse Zaken brengt het aangaan van een overeenkomst alsmede het wijzigen daarvan
      onverwijld ter kennis van de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0008328/2001-01-17#Artikel2
  - number: '3.1'
    text: 'Voor de toepassing van de PSW wordt:'
    url: https://wetten.overheid.nl/BWBR0008328/2001-01-17#Artikel3
  - number: 3.1.a
    text: de Stichting niet beschouwd als ondernemingspensioenfonds;
    url: https://wetten.overheid.nl/BWBR0008328/2001-01-17#Artikel3
  - number: 3.1.b
    text: in afwijking van artikel 1, eerste lid, onderdeel *e*, van die wet, de Stichting beschouwd als werkgever;
    url: https://wetten.overheid.nl/BWBR0008328/2001-01-17#Artikel3
  - number: 3.1.c
    text: |-
      de persoon voor wie de Stichting ouderdoms-, invaliditeits-, of nabestaandenpensioen verzorgt, beschouwd als een in
      dienst van de Stichting staande werknemer aan wie door die Stichting een toezegging omtrent pensioen is gedaan.
    url: https://wetten.overheid.nl/BWBR0008328/2001-01-17#Artikel3
  - number: '3.2'
    text: |-
      De uitvoering van de door de Stichting gedane toezegging omtrent pensioen wordt door middel van een overeenkomst
      tussen de Stichting en de Stichting Pensioenfonds ABP bij laatstgenoemde stichting neergelegd, tenzij Onze
      Ministers van Binnenlandse Zaken en van Financiën op verzoek van de Stichting anders besluiten.
    url: https://wetten.overheid.nl/BWBR0008328/2001-01-17#Artikel3
  - number: '3.3'
    text: |-
      Binnen drie maanden na het sluiten dan wel wijzigen van de overeenkomst, bedoeld in het tweede lid, zendt
      het bestuur van de Stichting Pensioenfonds ABP een door dat bestuur gewaarmerkt afschrift van deze stukken,
      respectievelijk van de wijzigingen daarin, aan de Pensioen- & Verzekeringskamer.
    url: https://wetten.overheid.nl/BWBR0008328/2001-01-17#Artikel3
  - number: '3.4'
    text: |-
      De artikelen 4, vijfde lid, en 7, eerste lid, van de PSW zijn van overeenkomstige toepassing op de overeenkomst,
      bedoeld in het tweede lid, voor zover in die overeenkomst het pensioenreglement van de Stichting Pensioenfonds ABP
      of de voor de toepassing van deze artikelleden relevante delen daarvan niet van overeenkomstige toepassing zijn
      verklaard.
    url: https://wetten.overheid.nl/BWBR0008328/2001-01-17#Artikel3
  - number: '4'
    text: |-
      De bezittingen van de Stichting Pensioenfonds ABP zijn, tezamen met de te verwachten inkomsten, blijkens de
      in artikel 10, derde lid, van de PSW, bedoelde wetenschappelijke balans toereikend ter dekking van haar uit de
      statuten en reglementen alsmede uit de overeenkomst met de Stichting voortvloeiende pensioenverplichtingen.
    url: https://wetten.overheid.nl/BWBR0008328/2001-01-17#Artikel4
  - number: '7'
    text: |-
      De op 19 augustus 1960 tussen de Stichting en het Algemeen burgerlijk pensioenfonds gesloten overeenkomst,
      welke overeenkomst laatstelijk op 21 februari 1992 is gewijzigd en op 1 januari 1996 ingevolge
      [artikel 24 van de Wet Privatisering ABP][ref1] onder algemene titel is overgegaan op de Stichting Pensioenfonds
      ABP, wordt aangemerkt als een overeenkomst als bedoeld in [artikel 3, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0008328#Artikel3
    url: https://wetten.overheid.nl/BWBR0008328/2001-01-17#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0008328
        artikel: '3'
  - number: '8'
    text: |-
      Indien de werkgevers behorende tot de sector Rijk de toezegging omtrent pensioen gezamenlijk door een andere
      pensioenuitvoerder dan de Stichting Pensioenfonds ABP laten uitvoeren, wordt de uitvoering van de door de
      Stichting gedane toezegging omtrent pensioen door middel van een overeenkomst tussen de Stichting en deze andere
      pensioenuitvoerder bij laatstbedoelde pensioenuitvoerder ondergebracht, tenzij Onze Ministers van Binnenlandse
      Zaken en van Financiën op verzoek van de Stichting anders besluiten.
    url: https://wetten.overheid.nl/BWBR0008328/2001-01-17#Artikel8
  - number: '9'
    text: |-
      De Wet van 27 juli 1960, houdende maatregelen met betrekking tot de pensioenen van het personeel van de Koninklijke
      Hofhouding (*Stb*.1960, 314) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008328/2001-01-17#Artikel9
  - number: '10'
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin zij wordt
      geplaatst en werkt terug tot en met 1 januari 1996.
    url: https://wetten.overheid.nl/BWBR0008328/2001-01-17#Artikel10
  - number: '11'
    text: 'Deze wet wordt aangehaald als: Wet gevolgen privatisering ABP voor het personeel van de Koninklijke Hofhouding.'
    url: https://wetten.overheid.nl/BWBR0008328/2001-01-17#Artikel11
