preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het omwille van de rechtshandhaving in de sociale zekerheid wenselijk
    is te komen tot een nadere vaststelling van het stelsel van administratieve sancties, van terugvordering van ten
    onrechte betaalde uitkering en van de invordering daarvan;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008015/1997-12-31#ArtikelAanhef
articles:
  - number: XVI
    text: |-
      1 In de bevoegdheid van de bedrijfsvereniging, de Sociale Verzekeringsbank en de gemeenten tot weigering van
      uitkering wegens gedragingen die hebben plaatsgevonden voor de datum van inwerkingtreding van deze wet, alsmede in
      de bevoegdheid tot terugvordering en verrekening van hetgeen voor die datum onverschuldigd is betaald, wordt geen
      wijziging gebracht.

      2 Ten aanzien van besluiten tot weigering, terugvordering of verrekening, die voor de datum van inwerkingtreding
      van deze wet zijn bekendgemaakt, blijft het recht zoals dat voor die datum gold van toepassing.
    url: https://wetten.overheid.nl/BWBR0008015/1997-12-31#ArtikelXVI
  - number: XVII
    text: |-
      1 Zonodig in afwijking van [artikel XVI][ref1], zijn de [artikelen 24][ref2], tweede lid,
      [27][ref3], en [28 van de Werkloosheidswet][ref4], zoals deze luiden na de inwerkingtreding van
      [artikel I, onderdelen B, onder 1°, E, en G][ref5], van deze wet, niet van toepassing op gedragingen, feiten en
      omstandigheden die zich voordoen voor de inwerkingtredingsdatum van deze onderdelen.

      2 In afwijking van het eerste lid zet de bedrijfsvereniging een weigering van de uitkering over de uren waarover
      het recht op uitkering ingevolge [artikel 21 Werkloosheidswet][ref6] herleeft niet voort, indien de gedragingen,
      feiten of omstandigheden die aanleiding zijn geweest voor het opleggen van de maatregel zich hebben voorgedaan voor
      de inwerkingstredingdatum van dit artikel en bovendien ter zake van arbeid verricht sinds de eerste dag waarop het
      recht op uitkering is ontstaan, is voldaan aan [artikel 52][ref7] en op grond van het derde lid van dat artikel
      geen recht op uitkering ingevolge hoofdstuk II*b* van die wet is ontstaan.


