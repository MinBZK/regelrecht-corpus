        hoofdstuk: '1'
      - id: ref4
        bwb_id: BWBR0002399
        artikel: '88'
  - number: '16'
    text: |-
      Tot 1 januari 1975 wordt de gelegenheid gegeven tot het afleggen van het staatsexamen hogereburgerschool volgens de
      op 31 juli 1968 geldende voorschriften.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel16
  - number: '17'
    text: |-
      1 De uit ’s Rijks kas bekostigde middelbare scholen voor meisjes worden met ingang van 1 augustus 1968 scholen
      voor hoger algemeen voortgezet onderwijs, als bedoeld in [afdeling I van titel II van de Wet op het voortgezet
      onderwijs](onbekend). Zij vangen op die datum aan met het eerste leerjaar.

      2 Met betrekking tot de op 1 augustus 1968 aangevangen hogere leerjaren blijven de op 31 juli 1968 geldende
      voorschriften van toepassing tot 1 augustus 1972. Voor het schooljaar 1972-1973 kan het bevoegd gezag, voor zover
      het een gemeentelijke of een bijzondere school betreft onder goedkeuring van Onze minister, alsnog een vijfde
      leerjaar volgens die voorschriften vormen.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel17
  - number: '18'
    text: |-
      Tot 1 januari 1974 wordt aan de leerlingen van de middelbare scholen voor meisjes, bedoeld in
      [artikel 17, eerste lid][ref1], alsmede aan de leerlingen van de middelbare scholen voor meisjes, die op 31
      juli 1968 ingevolge de middelbaar-onderwijswet zijn aangewezen, doch niet uit ’s Rijks kas worden bekostigd, de
      gelegenheid gegeven het eindexamen af te leggen volgens de op 31 juli 1968 geldende voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel17
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002595
        artikel: '17'
        hoofdstuk: '1'
  - number: '19'
    text: |-
      1 De gemeentelijke middelbare scholen voor meisjes, die op 31 juli 1967 niet uit ’s Rijks kas worden bekostigd,
      kunnen ten laste van de gemeente in stand worden gehouden als scholen voor hoger algemeen voortgezet onderwijs.

      2 Voor de toepassing van [afdeling I van titel II van de Wet op het voortgezet onderwijs](onbekend) worden de in
      het eerste lid bedoelde middelbare scholen voor meisjes van 1 augustus 1968 af aangemerkt als uit de openbare kas
      bekostigde scholen. De [artikelen 17, tweede lid][ref1], en [18][ref2] zijn van toepassing.

      3 Een in het eerste lid bedoelde middelbare school voor meisjes blijft bij de toepassing van
      [artikel 88 van de Wet op het voortgezet onderwijs][ref3] buiten aanmerking, zolang zij niet uit ’s Rijks kas wordt
      bekostigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002595#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel88
