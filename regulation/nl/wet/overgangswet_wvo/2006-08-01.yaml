      bedoeld in de [artikelen 45][ref1], [46][ref2] en [47][ref3], worden vervangen door een uitkering ineens.

      2 Het eerste lid is slechts van toepassing op andere vormen van voortgezet onderwijs als bedoeld in [afdeling IV
      van titel II van de Wet op het voortgezet onderwijs](onbekend).


