  - number: '26'
    text: |-
      1 De uit ’s Rijks kas bekostigde avondlycea worden met ingang van 1 augustus 1968 avondlycea, als bedoeld in
      [afdeling I van titel II van de Wet op het voortgezet onderwijs](onbekend).

      2 De uit ’s Rijks kas bekostigde avondhogereburgerscholen worden met ingang van 1 augustus 1968 ter keuze van de
      gemeenteraad of het schoolbestuur, al naar gelang het gemeentelijke of bijzondere scholen betreft, avondathenea of
      avondscholen voor hoger algemeen voortgezet onderwijs, als bedoeld in [afdeling I van titel II van de Wet op het
      voortgezet onderwijs](onbekend). Het bevoegd gezag doet van zijn beslissing voor 1 februari 1968 mededeling aan
      Onze minister.

      3 Onze minister kan op verzoek van de gemeenteraad of van het schoolbestuur, al naar gelang het een gemeentelijke
      of een bijzondere school betreft, goedkeuren, dat een avondlyceum met ingang van 1 augustus 1968 wordt omgezet
      in een scholengemeenschap, bestaande uit een avondlyceum en een avondschool voor hoger algemeen voortgezet
      onderwijs of in een avondlyceum met een afdeling voor hoger algemeen voortgezet onderwijs. Onze minister kan
      eveneens op verzoek goedkeuren, dat een avondhogereburgerschool met ingang van die datum wordt omgezet in een
      scholengemeenschap, bestaande uit een avondatheneum en een avondschool voor hoger algemeen voortgezet onderwijs of
      in een avondatheneum met een afdeling voor hoger algemeen voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel26
  - number: '27'
    text: |-
      1 De uit ’s Rijks kas bekostigde hogereburgerscholen met driejarige cursus worden met ingang van 1 augustus 1968
      scholen voor middelbaar algemeen voortgezet onderwijs, als bedoeld in [afdeling I van titel II van de Wet op het
      voortgezet onderwijs](onbekend). Zij vangen op die datum aan met het eerste leerjaar.

      2 Met betrekking tot de op 1 augustus 1968 aangevangen hogere leerjaren blijven de op 31 juli 1968 geldende
      voorschriften van toepassing tot 1 augustus 1970.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel27
  - number: '28'
    text: |-
      1 De op 31 juli 1968 voor vergoeding in aanmerking genomen stichtingskosten en inrichtingskosten van de bijzondere
      scholen, bedoeld in de [artikelen 7][ref1], [13][ref2], [17][ref3], [20][ref4] en [27][ref5], worden door de
      gemeente vergoed voor zover het betreft voorzieningen in de huisvesting ten behoeve van scholen voor voorbereidend
      wetenschappelijk onderwijs, voor hoger en middelbaar algemeen voortgezet onderwijs en voor voorbereidend
      beroepsonderwijs.

      2 De op 31 juli 1968 voor vergoeding in aanmerking genomen stichtingskosten en inrichtingskosten van gemeentelijke
      scholen als bedoeld in de [artikelen 7][ref6], [13][ref7], [17][ref8], [20][ref9] en [27][ref10], blijven vergoed
      volgens de op die datum geldende voorschriften voor zover het betreft voorzieningen in de huisvesting ten behoeve
      van andere vormen van voortgezet onderwijs als bedoeld in [afdeling IV van titel II van de Wet op het voortgezet
      onderwijs](onbekend).

      2a De op 31 juli 1968 voor vergoeding in aanmerking genomen stichtingskosten van de bijzondere scholen, bedoeld
      in de [artikelen 7][ref11], [13][ref12], [17][ref13], [20][ref14] en [27][ref15], blijven vergoed volgens de op
      die datum geldende voorschriften voor zover het betreft voorzieningen in de huisvesting ten behoeve van andere
      vormen van voortgezet onderwijs als bedoeld in [afdeling IV van titel II van de Wet op het voortgezet onderwijs]
      (onbekend).

      3 Voor de toepassing van [artikel 83 van de Wet op het voortgezet onderwijs][ref16] ten behoeve van bijzondere
      scholen, als bedoeld in de [artikelen 7][ref17], [13][ref18], [17][ref19], [20][ref20] en [27][ref21], stelt Onze
      minister de waarde vast van de op 31 december 1968 in de school aanwezige inrichting, alsmede de waarde van de
      onderdelen van deze inrichting. De aldus vastgestelde bedragen worden in mindering gebracht op de vergoeding,
      bedoeld in [artikel 83, tweede lid eerste volzin, van de Wet op het voortgezet onderwijs][ref22].


