        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '8'
  - number: '14'
    text: |-
      Tot 1 januari 1974 wordt aan de leerlingen van de hogereburgerscholen, bedoeld in [artikel 13, eerste lid][ref1],
      alsmede aan de leerlingen van de hogereburgerscholen, die op 31 juli 1968 ingevolge de middelbaar-onderwijswet zijn
      aangewezen, doch niet uit ’s Rijks kas worden bekostigd, de gelegenheid gegeven het eindexamen af te leggen volgens
      de op 31 juli 1968 geldende voorschriften. Indien de cursusduur van deze scholen met een jaar is verlengd, wordt
      die gelegenheid gegeven tot 1 januari 1975.


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel13
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002595
        artikel: '13'
        hoofdstuk: '1'
  - number: '15'
    text: |-
      1 De gemeentelijke hogereburgerscholen A en B, die op 31 juli 1967 niet uit ’s Rijks kas worden bekostigd,
      kunnen ten laste van de gemeente in stand worden gehouden als athenea of als scholen voor hoger algemeen
      voortgezet onderwijs. Op de omzetting in athenea of scholen voor hoger algemeen voortgezet onderwijs is
      [artikel 13, eerste tot en met vijfde lid][ref1], van toepassing.

      2 Voor de toepassing van [afdeling I van titel II van de Wet op het voortgezet onderwijs](onbekend) worden de in
      het eerste lid bedoelde hogereburgerscholen van 1 augustus 1968 af aangemerkt als uit de openbare kas bekostigde
      scholen. De [artikelen 13, zesde lid][ref2], en [14][ref3] zijn van toepassing.

      3 Een in het eerste lid bedoelde hogereburgerschool blijft bij de toepassing van
      [artikel 88 van de Wet op het voortgezet onderwijs][ref4] buiten aanmerking, zolang zij niet uit ’s Rijks kas wordt
      bekostigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002595#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0002595#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel88
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel15
