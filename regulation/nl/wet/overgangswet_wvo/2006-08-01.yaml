  - number: '49'
    text: |-
      1 De jaarlijkse vergoeding voor gebouwen en terreinen van scholen voor voortgezet gewoon en uitgebreid lager
      onderwijs, als bedoeld in artikel 205, eerste en vijfde lid, van de Lager-onderwijswet 1920, wordt met ingang van
      1 januari 1969 vervangen door een uitkering ineens ten laste van het Rijk, gelijkstaande met 30% van het bedrag,
      waarover de vergoeding voor het jaar 1968 werd berekend.

      2 Zolang de uitkering ineens niet heeft plaatsgevonden, is het Rijk voor elke volle maand na 31 december 1968 aan
      het bevoegd gezag verschuldigd een twaalfde van de oorspronkelijk door de gemeente betaalde vergoeding.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel49
