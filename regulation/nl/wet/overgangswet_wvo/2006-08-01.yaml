  - number: '52'
    text: |-
      Indien een avondschool voor uitgebreid lager onderwijs in het schooljaar 1967-1968 geheel of gedeeltelijk uit de
      gemeentekas wordt bekostigd en de school wordt omgezet in een school voor voortgezet onderwijs, blijft de gemeente
      ook na 31 juli 1968 tot gehele of gedeeltelijke bekostiging bevoegd tot het tijdstip, waarop de school ingevolge
      [titel III van de Wet op het voortgezet onderwijs](onbekend) uit ’s Rijks kas wordt bekostigd.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel52
  - number: '54'
    text: |-
      Met ingang van 1 augustus 1968 vervallen de Nijverheidsonderwijswet en de ter uitvoering daarvan gegeven
      voorschriften, voor zover bij deze wet niet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel54
  - number: '55'
    text: |-
      Voor de toepassing van dit hoofdstuk worden onder scholen mede verstaan de daaraan verbonden of afzonderlijke
      cursussen.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel55
  - number: '56'
    text: |-
      1 De ingevolge de Nijverheidsonderwijswet uit de openbare kas bekostigde huishoud- en landbouwhuishoudscholen - met
      uitzondering van de daaraan verbonden leraressenopleidingen -, de kappersopleidingen en de cursussen tot opleiding
      van apothekers-assistenten worden met ingang van 1 augustus 1968 onderscheidenlijk scholen en cursussen voor
      huishoud- en nijverheidsonderwijs, als bedoeld in [afdeling I van titel II van de Wet op het voortgezet onderwijs]
      (onbekend).

      2 De ingevolge de Nijverheidsonderwijswet uit de openbare kas bekostigde:

      a. scholen voor de detailhandel;

      b. ondernemersopleidingen;

      c. hotelvakscholen;

      d. slagersvakschool

      worden met ingang van 1 augustus 1968 scholen voor middenstandsonderwijs, als bedoeld in [afdeling I van titel II
      van de Wet op het voortgezet onderwijs](onbekend).

      3 De ingevolge de Nijverheidsonderwijswet uit de openbare kas bekostigde school tot opleiding van
      staffunctionarissen bij toeristische bedrijven, uitgaande van het Nederlands Wetenschappelijk Instituut voor het
      Toerisme, wordt met ingang van 1 augustus 1968 een school voor economisch en administratief onderwijs, als bedoeld
      in [afdeling I van titel II van de Wet op het voortgezet onderwijs](onbekend).

      4 De ingevolge de Nijverheidsonderwijswet uit de openbare kas bekostigde leraren- en leraressenopleidingen worden
      met ingang van 1 augustus 1968 scholen voor de opleiding van onderwijzend personeel, als bedoeld in [afdeling I van
      titel II van de Wet op het voortgezet onderwijs](onbekend).

      5 De ingevolge de Nijverheidsonderwijswet uit de openbare kas bekostigde:

      a. scholen voor maatschappelijk werk;

      b. voortgezette opleidingen van maatschappelijke werkers;

      c. bibliotheek- en documentatieschool;

      d. hogere scholen voor verplegenden;

      e. school voor de journalistiek;

      f. akademie voor expressie door woord en gebaar;

      g. scholen voor de opleiding van leiders op het terrein van jeugdvorming en volksontwikkeling;

      h. scholen voor de opleiding van gezinsverzorgsters

      worden met ingang van 1 augustus 1968 scholen voor sociaal-pedagogisch onderwijs, als bedoeld in [afdeling I van
      titel II van de Wet op het voortgezet onderwijs](onbekend).

      6 De ingevolge de Nijverheidsonderwijswet uit de openbare kas bekostigde:

      a. scholen voor kunst en kunstnijverheid, met uitzondering van de daaraan verbonden leraren- en
      leraressenopleidingen;

      b. opleidingen voor architect en stedebouwkundige;

      c. filmacademie

      worden met ingang van 1 augustus 1968 scholen voor kunstonderwijs, als bedoeld in [afdeling I van titel II van de
      Wet op het voortgezet onderwijs](onbekend).

      7 De overige ingevolge de Nijverheidsonderwijswet uit de openbare kas bekostigde scholen worden met ingang van
      1 augustus 1968 scholen voor technisch onderwijs, als bedoeld in [afdeling I van titel II van de Wet op het
      voortgezet onderwijs](onbekend), tenzij in de voorgaande leden uitdrukkelijk anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel56
  - number: '57'
    text: |-
      1 De ingevolge de Nijverheidsonderwijswet uit de openbare kas bekostigde scholen voor lager, uitgebreid lager
      en middelbaar nijverheidsonderwijs, genoemd in [artikel 56, eerste, tweede, derde, vijfde en zevende lid][ref1],
      worden met ingang van 1 augustus 1968 scholen voor onderscheidenlijk lager, middelbaar en hoger beroepsonderwijs,
      als bedoeld in [afdeling I van titel II van de Wet op het voortgezet onderwijs](onbekend).

      2 In afwijking van het eerste lid worden:

      a. de ingevolge de Nijverheidsonderwijswet uit de openbare kas bekostigde scholen voor de detailhandel,
      waaraan een opleiding voor middelbaar detailhandelsonderwijs is verbonden, met ingang van 1 augustus 1968
      scholengemeenschappen, bestaande uit een school voor lager middenstandsonderwijs en een school voor middelbaar
      middenstandsonderwijs, als bedoeld in [afdeling I van titel II van de Wet op het voortgezet onderwijs](onbekend);

      b. de ingevolge de Nijverheidsonderwijswet uit de openbare kas bekostigde scholen voor middelbaar
      detailhandelsonderwijs met ingang van 1 augustus 1968 scholen voor middelbaar middenstandsonderwijs, als bedoeld in
      [afdeling I van titel II van de Wet op het voortgezet onderwijs](onbekend);

      c. de overige ingevolge de Nijverheidsonderwijswet uit de openbare kas bekostigde scholen voor de detailhandel met
      ingang van 1 augustus 1968 scholen voor lager middenstandsonderwijs, als bedoeld in [afdeling I van titel II van de
      Wet op het voortgezet onderwijs](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel56
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0002595
        artikel: '56'
        hoofdstuk: '3'
  - number: '58'
    text: |-
      1 Voor de toepassing van de [artikelen 56][ref1] en [57][ref2] worden met de ingevolge de Nijverheidsonderwijswet
      uit de openbare kas bekostigde scholen gelijkgesteld de scholen, waarvan op grond van artikel 25 van de
      Nijverheidsonderwijswet de oprichting en instandhouding is goedgekeurd, doch waaraan het onderwijs nog niet is
      aangevangen.

      2 De in het eerste lid bedoelde scholen, waaraan op 1 september 1973 geen onderwijs wordt gegeven, kunnen daarna
      niet meer uit de openbare kas worden bekostigd, tenzij Onze minister op verzoek van het bevoegd gezag anders
      besluit.

      3 Aan de in het tweede lid bedoelde beschikking kan Onze minister voorwaarden verbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0002595#Artikel57
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002595
        artikel: '56'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0002595
        artikel: '57'
        hoofdstuk: '3'
  - number: '59'
    text: |-
      Indien de inrichting van het onderwijs van de in [artikel 56][ref1] bedoelde scholen niet voldoet aan de bij of
      krachtens de [Wet op het voortgezet onderwijs][ref2] gegeven voorschriften, kan Onze minister, voor zover het
      een rijksschool betreft, daarvan afwijken en, voor zover het een gemeentelijke of een bijzondere school betreft,
      goedkeuren, dat daarvan wordt afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0002595
        artikel: '56'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0002399
  - number: '60'
    text: |-
      De op 31 juli 1968 voor vergoeding in aanmerking genomen stichtingskosten en inrichtingskosten van de scholen,
      bedoeld in [artikel 56][ref1], worden door de gemeente vergoed voor zover het betreft voorzieningen in de
      huisvesting ten behoeve van scholen voor voorbereidend wetenschappelijk onderwijs, voor hoger en middelbaar
      algemeen voortgezet onderwijs en voor voorbereidend beroepsonderwijs. De op 31 juli 1968 voor vergoeding in
      aanmerking genomen stichtingskosten en inrichtingskosten van de scholen, bedoeld in [artikel 56][ref2], blijven
      vergoed volgens de op die datum geldende voorschriften voor zover het betreft voorzieningen in de huisvesting
      ten behoeve van andere vormen van voortgezet onderwijs als bedoeld in [afdeling IV van titel II van de Wet op het
      voortgezet onderwijs](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0002595#Artikel56
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0002595
        artikel: '56'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0002595
        artikel: '56'
        hoofdstuk: '3'
  - number: '61'
    text: |-
      1 De uit ’s Rijks kas bekostigde opleidingsscholen voor kleuterleidsters worden met ingang van 1 augustus 1968
      opleidingsscholen voor kleuterleidsters, als bedoeld in [afdeling I van titel II van de Wet op het voortgezet
      onderwijs](onbekend).

      2 De op 31 juli 1968 ingevolge artikel 95 van de Kleuteronderwijswet aangewezen, niet uit ’s Rijks kas bekostigde,
      bijzondere opleidingsscholen worden geacht met ingang van 1 augustus 1968 te zijn aangewezen op grond van
      [artikel 56 van de Wet op het voortgezet onderwijs][ref1].

      3 Indien de inrichting van het onderwijs in het tweede en de volgende leerjaren niet voldoet aan de bij of
      krachtens de [Wet op het voortgezet onderwijs][ref2] gegeven voorschriften, blijven de op 31 juli 1968 geldende
      voorschriften daarop van toepassing tot 1 augustus 1971. Voor de schooljaren 1971-1972 en 1972-1973 kan het bevoegd
      gezag, voor zover het een gemeentelijke of een bijzondere school betreft onder goedkeuring van Onze minister,
      alsnog klassen vormen, waarin onderwijs wordt gegeven volgens de op 31 juli 1968 geldende voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '56'
      - id: ref2
        bwb_id: BWBR0002399
  - number: '62'
    text: |-
      1 De gemeentelijke opleidingsscholen, die op 31 juli 1967 niet uit ’s Rijks kas worden bekostigd, kunnen ten laste
      van de gemeente in stand worden gehouden.

      2 Voor de toepassing van [afdeling I van titel II van de Wet op het voortgezet onderwijs](onbekend) worden de in
      het eerste lid bedoelde opleidingsscholen van 1 augustus 1968 af aangemerkt als uit de openbare kas bekostigde
      scholen, indien zij zijn aangewezen ingevolge artikel 92 van de Kleuteronderwijswet. Artikel 61, derde lid, is
      van toepassing.

      3 Een in het eerste lid bedoelde opleidingsschool blijft bij de toepassing van
      [artikel 88 van de Wet op het voortgezet onderwijs][ref1] buiten aanmerking, zolang zij niet uit ’s Rijks kas wordt
      bekostigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel88
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '88'
  - number: 62a
    text: |-
      Tot 1 augustus 1971 kan de gemeente aan bijzondere opleidingsscholen voor kleuterleidsters die niet door het
      Rijk worden bekostigd, een vergoeding geven voor kosten van instandhouding, indien deze ook werd toegekend in het
      schooljaar 1967-1968.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel62a
  - number: '63'
    text: |-
      Tot het einde van het schooljaar 1969-1970 kan met toestemming van Onze minister aan een opleidingsschool
      een tweejarige afdeling B verbonden zijn, die is ingericht overeenkomstig de op 31 augustus 1964 geldende
      voorschriften.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel63
  - number: '64'
    text: |-
      Tot en met het jaar 1970 blijft de gelegenheid bestaan de akte van bekwaamheid als hoofdleidster te verkrijgen
      volgens de op 31 augustus 1964 geldende voorschriften. Zij, die in 1970 bij het examen ter verkrijging van deze
      akte zijn afgewezen, worden in het jaar 1971 nogmaals in de gelegenheid gesteld de akte te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel64
  - number: '65'
    text: |-
      Tot en met het jaar 1970 blijft de gelegenheid bestaan de akte van bekwaamheid als leidster te verkrijgen volgens
      de op 31 juli 1968 geldende voorschriften. Zij, die in 1970 bij het examen ter verkrijging van deze akte zijn
      afgewezen, worden in het jaar 1971 nogmaals in de gelegenheid gesteld de akte te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel65
  - number: '66'
    text: |-
      Tot en met het jaar 1972 blijft de gelegenheid bestaan de akte van bekwaamheid als hoofdleidster te verkrijgen
      volgens de op 31 juli 1968 geldende voorschriften. Zij, die in 1972 bij het examen ter verkrijging van deze akte
      zijn afgewezen, worden in het jaar 1973 nogmaals in de gelegenheid gesteld de akte te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel66
  - number: '67'
    text: |-
      1 De vergoeding van de kosten van de opleidingsscholen, bedoeld in [artikel 61, eerste lid][ref1], geschiedt tot 1
      januari 1969 op de grondslag van de op 31 juli 1968 geldende voorschriften.

      2 De vaststelling van de uitgaven voor gemeentelijke scholen, bedoeld in
      [artikel 88 van de Wet op het voortgezet onderwijs][ref2], vindt voor het eerst plaats over het jaar 1969.


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel88
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0002595
        artikel: '61'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '88'
  - number: '68'
    text: |-
      De op 31 juli 1968 voor vergoeding in aanmerking genomen stichtingskosten worden door de gemeente vergoed voor
      zover het betreft voorzieningen in de huisvesting ten behoeve van scholen voor voorbereidend wetenschappelijk
      onderwijs, voor hoger en middelbaar algemeen voortgezet onderwijs en voor voorbereidend beroepsonderwijs. De op 31
      juli 1968 voor vergoeding in aanmerking genomen stichtingskosten blijven vergoed volgens de op die datum geldende
      voorschriften voor zover het betreft voorzieningen in de huisvesting ten behoeve van andere vormen van voortgezet
      onderwijs als bedoeld in [afdeling IV van titel II van de Wet op het voortgezet onderwijs](onbekend).
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel68
  - number: '69'
    text: |-
      Met betrekking tot de uit ’s Rijks kas bekostigde scholen, bedoeld in dit hoofdstuk, blijft
      [artikel 107, achtste lid, van de Wet op het voortgezet onderwijs][ref1] buiten toepassing, zolang het onderwijs
      niet in alle leerjaren is ingericht volgens [afdeling I van titel II van die wet](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel107
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '107'
  - number: '71'
    text: |-
      Met ingang van 1 augustus 1968 vervallen de ter uitvoering van titel IV van de Kleuteronderwijswet gegeven
      voorschriften, voor zover bij deze wet niet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel71
  - number: '72'
    text: |-
      1 Met ingang van 1 augustus 1968 vervallen de Kweekschoolwet en de ter uitvoering daarvan gegeven voorschriften,
      voor zover bij deze wet niet anders is bepaald.

      2 De uit ’s Rijks kas bekostigde kweekscholen voor onderwijzers worden met ingang van de in het eerste lid genoemde
      datum opleidingsscholen voor onderwijzers met een afdeling voor hoger algemeen voortgezet onderwijs, een en ander
      als bedoeld in [afdeling I van titel II van de Wet op het voortgezet onderwijs](onbekend).

      3 De op 31 juli 1968 ingevolge artikel 21 van de Kweekschoolwet aangewezen, niet uit ’s Rijks kas bekostigde,
      bijzondere kweekscholen worden geacht met ingang van 1 augustus 1968 te zijn aangewezen op grond van
      [artikel 56 van de Wet op het voortgezet onderwijs][ref1].

      4 Indien de inrichting van het onderwijs niet voldoet aan de bij of krachtens de
      [Wet op het voortgezet onderwijs][ref2] gegeven voorschriften, blijven de op 31 juli 1968 geldende voorschriften
      daarop van toepassing tot 1 augustus 1972. Voor de schooljaren 1972-1973 en 1973-1974 kan het bevoegd gezag, voor
      zover het een gemeentelijke of een bijzondere school betreft onder goedkeuring van Onze minister, alsnog klassen
      vormen, waarin onderwijs wordt gegeven volgens de op 31 juli 1968 geldende voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '56'
      - id: ref2
        bwb_id: BWBR0002399
  - number: '73'
    text: |-
      1 Tot 1 januari 1972 wordt de gelegenheid gegeven tot het afleggen van het eerste gedeelte van het staatsexamen
      eerste leerkring volgens de op 31 juli 1968 geldende voorschriften.

      2 Tot en met het jaar 1971 blijft de gelegenheid bestaan de akte van bekwaamheid als onderwijzer te verkrijgen
      volgens de op 31 juli 1968 geldende voorschriften. Zij, die in 1971 bij het examen ter verkrijging van deze akte
      zijn afgewezen, worden in het jaar 1972 nogmaals in de gelegenheid gesteld de akte te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel73
  - number: '74'
    text: |-
      Tot en met het jaar 1973 blijft de gelegenheid bestaan de akte van bekwaamheid als volledig bevoegd onderwijzer te
      verkrijgen volgens de op 31 juli 1968 geldende voorschriften. Zij, die in 1973 bij het examen ter verkrijging van
      deze akte zijn afgewezen, worden in het jaar 1974 nogmaals in de gelegenheid gesteld de akte te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel74
  - number: '75'
    text: |-
      1 De vergoeding van de kosten van de in [artikel 72][ref1] bedoelde opleidingsscholen geschiedt tot 1 januari
      1969 op de grondslag van de op 31 juli 1968 geldende voorschriften, waarbij 31 december 1968 als het einde van het
      lopende vijfjarige tijdvak wordt aangemerkt.

      2 De vaststelling van de uitgaven voor gemeentelijke scholen, bedoeld in
      [artikel 88 van de Wet op het voortgezet onderwijs][ref2], vindt voor het eerst plaats over het jaar 1969.


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel88
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0002595
        artikel: '72'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '88'
  - number: '76'
    text: |-
      De op 31 juli 1968 voor vergoeding in aanmerking genomen stichtingskosten worden door de gemeente vergoed voor
      zover het betreft voorzieningen in de huisvesting ten behoeve van scholen voor voorbereidend wetenschappelijk
      onderwijs, voor hoger en middelbaar algemeen voortgezet onderwijs en voor voorbereidend beroepsonderwijs. De op 31
      juli 1968 voor vergoeding in aanmerking genomen stichtingskosten blijven vergoed volgens de op die datum geldende
      voorschriften voor zover het betreft voorzieningen in de huisvesting ten behoeve van andere vormen van voortgezet
      onderwijs als bedoeld in [afdeling IV van titel II van de Wet op het voortgezet onderwijs](onbekend).
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel76
  - number: '77'
    text: |-
      1 In afwijking van [artikel 76][ref1] kan Onze minister na overleg met het bevoegd gezag en met Onze minister van
      financiën bepalen, dat de vergoeding, bedoeld in artikel 53 van de Kweekschoolwet, en de vergoeding, bedoeld in
      artikel 26 van die wet, zoals dit luidde op 31 december 1955, worden vervangen door een uitkering ineens.

      2 [Artikel 101 van de Wet op het voortgezet onderwijs][ref2] blijft buiten toepassing, voor zover het betreft
      onroerende zaken, waarvoor de vergoeding, bedoeld in het eerste lid, niet is vervangen door een uitkering ineens.

      3 Het eerste en tweede lid zijn slechts van toepassing op andere vormen van voortgezet onderwijs als bedoeld in
      [afdeling IV van titel II van de Wet op het voortgezet onderwijs](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel101
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0002595
        artikel: '76'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '101'
  - number: '78'
    text: |-
      Met betrekking tot de uit ’s Rijks kas bekostigde scholen, bedoeld in dit hoofdstuk, blijven
      [artikel 107, zevende lid][ref1], en [artikel 110 van de Wet op het voortgezet onderwijs][ref2] buiten toepassing,
      zolang het onderwijs niet in alle leerjaren is ingericht volgens [afdeling I van titel II van die wet](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel110
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '107'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '110'
  - number: '79'
    text: |-
      Met ingang van 1 augustus 1968 vervallen de voorschriften, gegeven met betrekking tot de scholen, bedoeld in
      [artikel 81][ref1], voor zover bij deze wet niet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel81
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0002595
        artikel: '81'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '80'
    text: |-
      Voor de toepassing van deze paragraaf worden onder scholen mede verstaan de daaraan verbonden of afzonderlijke
      cursussen.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel80
  - number: '81'
    text: |-
      De rijks- en van rijkswege gesubsidieerde scholen voor lager, middelbaar en hoger landbouw-, tuinbouw-, bosbouw- en
      landbouwtechnologieonderwijs worden met ingang van 1 augustus 1968 onderscheidenlijk scholen voor lager, middelbaar
      en hoger landbouwonderwijs, als bedoeld in [afdeling I van titel II van de Wet op het voortgezet onderwijs]
      (onbekend).
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel81
  - number: '82'
    text: |-
      Indien de inrichting van het onderwijs van de in [artikel 81][ref1] bedoelde scholen niet voldoet aan de bij of
      krachtens de [Wet op het voortgezet onderwijs][ref2] gegeven voorschriften, kan Onze minister, voor zover het
      een rijksschool betreft, daarvan afwijken en, voor zover het een gemeentelijke of een bijzondere school betreft,
      goedkeuren, dat daarvan wordt afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0002595
        artikel: '81'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002399
  - number: '83'
    text: |-
      De op 31 juli 1968 voor vergoeding in aanmerking genomen stichtingskosten en inrichtingskosten van de scholen,
      bedoeld in [artikel 81][ref1], worden door de gemeente vergoed voor zover het betreft voorzieningen in de
      huisvesting ten behoeve van scholen voor voorbereidend wetenschappelijk onderwijs, voor hoger en middelbaar
      algemeen voortgezet onderwijs en voor voorbereidend beroepsonderwijs. De op 31 juli 1968 voor vergoeding in
      aanmerking genomen stichtingskosten en inrichtingskosten van de scholen, bedoeld in [artikel 81][ref2], blijven
      vergoed volgens de op die datum geldende voorschriften voor zover het betreft voorzieningen in de huisvesting
      ten behoeve van andere vormen van voortgezet onderwijs als bedoeld in [afdeling IV van titel II van de Wet op het
      voortgezet onderwijs](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0002595#Artikel81
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0002595
        artikel: '81'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002595
        artikel: '81'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '84'
    text: Met ingang van 1 augustus 1968 vervalt de Interimregeling subsidiëring middenstandsonderwijs 1966.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel84
  - number: '85'
    text: Voor de toepassing van deze paragraaf worden onder scholen mede verstaan cursussen.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel85
  - number: '86'
    text: |-
      De scholen, gesubsidieerd ingevolge de Interimregeling subsidiëring middenstandsonderwijs 1966, worden met ingang
      van 1 augustus 1968 scholen voor middenstandsonderwijs, als bedoeld in [afdeling I van titel II van de Wet op het
      voortgezet onderwijs](onbekend).
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel86
  - number: '87'
    text: |-
      Indien de inrichting van het onderwijs van de in [artikel 86][ref1] bedoelde scholen niet voldoet aan de bij of
      krachtens de [Wet op het voortgezet onderwijs][ref2] gegeven voorschriften, kan Onze minister goedkeuren, dat
      daarvan wordt afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel86
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0002595
        artikel: '86'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002399
  - number: '88'
    text: |-
      Met ingang van 1 augustus 1968 vervallen de Rijksregeling subsidiëring sociaal-pedagogisch onderwijs 1964, het
      Besluit reglement C.I.O.S. en de subsidiebeschikking ten behoeve van de stichting R.-K. Centraal Instituut voor de
      Opleiding van Sportleiders, gevestigd te Sittard.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel88
  - number: '89'
    text: |-
      De ingevolge de Rijksregeling subsidiëring sociaal-pedagogisch onderwijs 1964 gesubsidieerde cursussen hogere
      sociale arbeid worden met ingang van 1 augustus 1968 cursussen voor hoger sociaal-pedagogisch onderwijs, als
      bedoeld in [afdeling I van titel II van de Wet op het voortgezet onderwijs](onbekend).
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel89
  - number: '90'
    text: |-
      De ingevolge de Rijksregeling subsidiëring sociaal-pedagogisch onderwijs 1964 gesubsidieerde Cursus voor
      Maatschappelijk Werk "Huize Bergen", scholen voor bezigheidstherapie en cursussen middelbare sociale arbeid
      worden met ingang van 1 augustus 1968 onderscheidenlijk scholen en cursussen voor middelbaar sociaal-pedagogisch
      onderwijs, als bedoeld in [afdeling I van titel II van de Wet op het voortgezet onderwijs](onbekend).
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel90
  - number: '91'
    text: |-
      De door het Rijk in stand gehouden en gesubsidieerde centrale instituten voor de opleiding van sportleiders worden
      met ingang van 1 augustus 1968 scholen voor middelbaar sociaal-pedagogisch onderwijs, als bedoeld in [afdeling I
      van titel II van de Wet op het voortgezet onderwijs](onbekend).
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel91
  - number: '92'
    text: |-
      Indien de inrichting van het onderwijs van de in de [artikelen 89 tot en met 91][ref1] bedoelde scholen of
      cursussen niet voldoet aan de bij of krachtens de [Wet op het voortgezet onderwijs][ref2] gegeven voorschriften,
      kan Onze minister, voor zover het een rijksschool of -cursus betreft, daarvan afwijken en, voor zover het een
      gemeentelijke of een bijzondere school of cursus betreft, goedkeuren, dat daarvan wordt afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel89
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0002595
        artikel: '89'
        hoofdstuk: '6'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002399
  - number: '93'
    text: |-
      De op 31 juli 1968 voor vergoeding in aanmerking genomen stichtingskosten en inrichtingskosten van de scholen
      en cursussen, bedoeld in de [artikelen 89 tot en met 91][ref1], worden door de gemeente vergoed voor zover het
      betreft voorzieningen in de huisvesting ten behoeve van scholen voor voorbereidend wetenschappelijk onderwijs,
      voor hoger en middelbaar algemeen voortgezet onderwijs en voor voorbereidend beroepsonderwijs. De op 31 juli 1968
      voor vergoeding in aanmerking genomen stichtingskosten en inrichtingskosten van de scholen en cursussen, bedoeld
      in de [artikelen 89 tot en met 91][ref2], blijven vergoed volgens de op die datum geldende voorschriften voor zover
      het betreft voorzieningen in de huisvesting ten behoeve van andere vormen van voortgezet onderwijs als bedoeld in
      [afdeling IV van titel II van de Wet op het voortgezet onderwijs](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel89
      [ref2]: https://wetten.overheid.nl/BWBR0002595#Artikel89
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0002595
        artikel: '89'
        hoofdstuk: '6'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002595
        artikel: '89'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: '94'
    text: |-
      Met ingang van 1 augustus 1968 vervallen de voorschriften, gegeven met betrekking tot de in [artikel 95][ref1]
      bedoelde scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel95
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0002595
        artikel: '95'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: '95'
    text: |-
      1 De rijks- en van rijkswege gesubsidieerde scholen voor vakonderwijs op het gebied van muziek, dans, kleinkunst en
      toneel worden met ingang van 1 augustus 1968 scholen voor kunstonderwijs, als bedoeld in [afdeling I van titel II
      van de Wet op het voortgezet onderwijs](onbekend).

      2 In afwijking van het eerste lid worden de Nederlandse Beiaardschool te Amersfoort, het Nederlands Instituut
      voor Katholieke Kerkmuziek te Utrecht, alsmede de van rijkswege gesubsidieerde opleidingen voor dansvakonderwijs,
      die niet tevens het algemeen voortgezet onderwijs verzorgen, en vakopleidingen aan muziekscholen met ingang van 1
      augustus 1968 cursussen voor kunstonderwijs, als bedoeld in [afdeling I van titel II van de Wet op het voortgezet
      onderwijs](onbekend).
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel95
  - number: '96'
    text: |-
      Indien de inrichting van het onderwijs van de in [artikel 95][ref1] bedoelde scholen of cursussen niet voldoet aan
      de bij of krachtens de [Wet op het voortgezet onderwijs][ref2] gegeven voorschriften, kan Onze minister, voor zover
      het een rijksschool of -cursus betreft, daarvan afwijken en, voor zover het een gemeentelijke of een bijzondere
      school of cursus betreft, goedkeuren, dat daarvan wordt afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel95
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0002595
        artikel: '95'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002399
  - number: '97'
    text: |-
      De vergoeding van de stichtings- en inrichtingskosten van de in [artikel 95][ref1] bedoelde scholen en cursussen
      geschiedt volgens door de gemeenteraad te stellen regelen voor zover het betreft voorzieningen in de huisvesting
      ten behoeve van scholen voor voorbereidend wetenschappelijk onderwijs, voor hoger en middelbaar algemeen voortgezet
      onderwijs en voor voorbereidend beroepsonderwijs. De vergoeding van de stichtings- en inrichtingskosten van de in
      [artikel 95][ref2] bedoelde scholen en cursussen geschiedt volgens door Onze minister te stellen regelen voor zover
      het betreft voorzieningen in de huisvesting ten behoeve van andere vormen van voortgezet onderwijs als bedoeld in
      [afdeling IV van titel II van de Wet op het voortgezet onderwijs](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel95
      [ref2]: https://wetten.overheid.nl/BWBR0002595#Artikel95
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0002595
        artikel: '95'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002595
        artikel: '95'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: '98'
    text: |-
      1 De door het Rijk op grond van artikel V van de wet van 14 februari 1963, *Stb.* 74, tot het verlenen van grotere
      vrijheid van inrichting van het onderwijs, geheel of gedeeltelijk bekostigde scholen, die ten aanzien van de duur
      van de cursus, het leerplan en de bevoegdheden van de leraren overeenkomen met scholen, als bedoeld in [afdeling
      I van titel II van de Wet op het voortgezet onderwijs](onbekend), worden met ingang van 1 augustus 1968 zodanige
      scholen.

      2 Indien de inrichting van het onderwijs in het tweede en de volgende leerjaren niet voldoet aan de bij of
      krachtens de [Wet op het voortgezet onderwijs][ref1] gegeven voorschriften, blijven de op 31 juli 1968 geldende
      voorschriften daarop van toepassing voor een tijdvak, overeenkomende met de duur van de cursus verminderd met een
      jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0002399
  - number: '99'
    text: |-
      1 Onze minister kan op verzoek van de gemeenteraad of van het schoolbestuur, al naar gelang het een gemeentelijke
      of een bijzondere school betreft, goedkeuren, dat in afwijking van de hoofdstukken 1 tot en met 7 van deze titel
      een gemeentelijke of een bijzondere school wordt omgezet in een andere school, als bedoeld in [afdeling I van titel
      II van de Wet op het voortgezet onderwijs](onbekend).

      2 Een verzoek, als bedoeld in het eerste lid, moet worden ingediend voor 1 februari 1968.

      3 Indien Onze minister de goedkeuring weigert, is [artikel 71 van de Wet op het voortgezet onderwijs][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel71
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '71'
  - number: 99a
    text: |-
      De op 31 juli 1968 geldende voorschriften ter uitvoering van de hoger-onderwijswet, de middelbaar-onderwijswet,
      de Lager-onderwijswet 1920, de Kleuteronderwijswet, de Kweekschoolwet en de besluiten ter uitvoering van de wet
      van 14 februari 1963, *Stb.* 74, kunnen gedurende de tijd waarin zij krachtens deze titel nog van kracht blijven,
      voor zover zij door Ons zijn vastgesteld, door Ons en, voor zover zij door Onze minister zijn vastgesteld, door hem
      worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel99a
  - number: '118'
    text: |-
      Op geschillen, die ingevolge de op 31 juli 1968 geldende voorschriften bij een commissie van beroep aanhangig zijn
      gemaakt, blijft de op die datum geldende regeling van toepassing.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel118
  - number: 118a
    text: |-
      1 Voor hen die met ingang van 1 augustus 1968 worden ontslagen, blijven de op 31 juli 1968 geldende voorschriften
      betreffende wachtgeld en andere uitkeringen bij ontslag ter zake van dit ontslag van kracht.

      2 Indien door het ontbreken van voorschriften als bedoeld in het eerste lid, geen aanspraak bestaat op wachtgeld
      of andere uitkeringen bij ontslag, wordt ten laste van het Rijk een ontslaguitkering toegekend volgens de
      voorschriften, bedoeld in [artikel 39, tweede lid, van de Wet op het voortgezet onderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel39
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel118a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '39'
  - number: '119'
    text: |-
      1 Onze minister kan, de Onderwijsraad gehoord, voor de jaren 1968 en 1969 scholen, als bedoeld in [afdeling I
      van titel II van de Wet op het voortgezet onderwijs](onbekend), waaraan naar zijn oordeel behoefte bestaat, voor
      bekostiging in aanmerking brengen.

      2 Al naar gelang het een gemeentelijke of een bijzondere school betreft, geschiedt de bekostiging op verzoek van de
      gemeenteraad of het schoolbestuur.

      3 Deze verzoeken worden voor 1 november 1967 bij Onze minister ingediend. Zij zijn met redenen omkleed, vermelden
      de aard en de plaats van vestiging van de school en gaan vergezeld van een prognose omtrent de te verwachten
      omvang.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel119
  - number: '120'
    text: |-
      1 Onze minister stelt voor 1 oktober 1969 het eerste plan van scholen vast, bedoeld in [hoofdstuk I van titel III
      van de Wet op het voortgezet onderwijs](onbekend). Het omvat de scholen, die in de jaren 1970, 1971 en 1972 voor
      bekostiging uit ’s Rijks kas in aanmerking zullen worden gebracht.

      2 Een verzoek om opneming in het plan, bedoeld in het eerste lid, wordt voor 1 februari 1968 bij Onze minister
      ingediend.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel120
  - number: '121'
    text: |-
      De artikelen 26 en 29, derde lid, van de Wet op het wetenschappelijk onderwijs treden in werking met ingang van 1
      augustus 1968, voor zover dit nog niet is geschied.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel121
  - number: '122'
    text: |-
      Met ingang van 1 augustus 1968 vervalt de wet van 28 juli 1924, *Stb.* 376, betreffende onthouding van
      rijkssubsidie aan na 6 oktober 1921 geopende hogereburgerscholen en gymnasia, zoals deze wet is gewijzigd bij de
      wet van 2 april 1948, *Stb.* I 127.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel122
  - number: '123'
    text: |-
      1 Met ingang van 1 augustus 1968 vervalt de Garantiewet leningen voorbereidend hoger en middelbaar onderwijs,
      kweekscholen en opleidingsscholen voor kleuterleidsters.

      2 De ingevolge artikel 1 van de in het eerste lid genoemde wet verleende garanties blijven van kracht. Garanties
      kunnen volgens de voorschriften van die wet alsnog worden verleend voor de rente en aflossing van geldleningen, die
      worden aangegaan ter vervanging van leningen, waarvan de rente en aflossing op grond van die wet waren gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel123
  - number: '124'
    text: |-
      1 Met ingang van 1 augustus 1968 vervalt de Garantiewet leningen N.O.

      2 De ingevolge artikel 1 van de in het eerste lid genoemde wet verleende garanties blijven van kracht. Garanties
      kunnen volgens de voorschriften van die wet alsnog worden verleend voor de rente en aflossing van geldleningen, die
      worden aangegaan ter vervanging van leningen, waarvan de rente en aflossing op grond van die wet waren gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel124
  - number: '125'
    text: |-
      Met ingang van 1 augustus 1968 vervallen de wet van 11 juli 1963, *Stb.* 346, en de artikelen 122, tweede lid, en
      135, eerste lid, van de hoger-onderwijswet.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel125
  - number: '126'
    text: |-
      Bij twijfel, of aangelegenheden, die betrekking hebben op een tijdvak of tijdstip, gelegen voor 1 augustus 1968,
      moeten worden behandeld volgens de oude of volgens de nieuwe bepalingen, beslist Onze minister, volgens welke
      bepalingen de behandeling geschiedt.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel126
  - number: '127'
    text: |-
      1 Deze wet kan worden aangehaald als "Overgangswet W.V.O.".

      2 Zij treedt in werking met ingang van 1 augustus 1967.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel127
  - number: '128'
    text: |-
      De gewijzigde tekst van de [Wet op het voortgezet onderwijs][ref1] wordt door Onze minister in een doorlopende
      reeks van artikelen genummerd en de verwijzingen in de [Wet op het voortgezet onderwijs][ref2] en in de
      [titels IV tot en met VI van deze wet][ref3] worden daarmee in overeenstemming gebracht. De gewijzigde tekst van de
      [Wet op het voortgezet onderwijs][ref4] en van de [titels IV tot en met VI van deze wet][ref5] wordt door de zorg
      van Onze minister van justitie opnieuw in het *Staatsblad* geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0002399
      [ref3]: https://wetten.overheid.nl/BWBR0002595
      [ref4]: https://wetten.overheid.nl/BWBR0002399
      [ref5]: https://wetten.overheid.nl/BWBR0002595
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel128
