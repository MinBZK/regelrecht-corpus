preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat ingevolge artikel 127 van de Wet op het voortgezet onderwijs het
    overgangsrecht en het tijdstip van het in werking treden van die wet bij de wet moeten worden geregeld en dat
    wijzigingen in de Wet op het voortgezet onderwijs wenselijk zijn gebleken;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze wet verstaat onder:

      "Onze minister": Onze minister van onderwijs en wetenschappen, voor het landbouwonderwijs Onze minister
      van landbouw en visserij en voor het onderwijs, dat ressorteert onder de minister van cultuur, recreatie en
      maatschappelijk werk, Onze minister van cultuur, recreatie en maatschappelijk werk;

      "het bevoegd gezag": voor

      a. een rijksschool: Onze minister;

      b. een gemeentelijke school: het college van burgemeester en wethouders, voor zover de raad niet anders bepaalt,
      en, indien de raad dit wenselijk oordeelt, met inachtneming van door hem te stellen regelen;

      c. een bijzondere school: het schoolbestuur.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel1
  - number: '4'
    text: |-
      De [Wet op het voortgezet onderwijs][ref1] treedt in werking met ingang van 1 augustus 1968.


      [ref1]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002399
  - number: '5'
    text: |-
      Met ingang van 1 augustus 1968 vervallen hoofdstuk I van titel II en hoofdstuk III van titel III van de hoger-
      onderwijswet en de ter uitvoering van die hoofdstukken gegeven voorschriften, voor zover bij deze wet niet anders
      is bepaald.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel5
  - number: '6'
    text: |-
      Voor de toepassing van dit hoofdstuk worden onder gymnasia, hogereburgerscholen, middelbare scholen voor meisjes en
      handelsdagscholen zowel zelfstandige scholen als afdelingen verstaan.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel6
  - number: '7'
    text: |-
      1 De uit ’s Rijks kas bekostigde gymnasia worden met ingang van 1 augustus 1968 gymnasia, als bedoeld in [afdeling
      I van titel II van de Wet op het voortgezet onderwijs](onbekend). Zij vangen op die datum aan met het eerste
      leerjaar.

      2 Met betrekking tot de op 1 augustus 1968 aangevangen hogere leerjaren blijven de op 31 juli 1968 geldende
      voorschriften van toepassing tot 1 augustus 1973. Voor het schooljaar 1973-1974 kan het bevoegd gezag, voor zover
      het een gemeentelijke of een bijzondere school betreft onder goedkeuring van Onze minister, alsnog een zesde
      leerjaar volgens die voorschriften vormen.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel7
  - number: '8'
    text: |-
      Tot 1 januari 1975 wordt aan de leerlingen van de gymnasia, bedoeld in [artikel 7, eerste lid][ref1], alsmede
      aan de leerlingen van de gymnasia, die op 31 juli 1968 ingevolge de hoger-onderwijswet zijn aangewezen, doch niet
      uit ’s Rijks kas worden bekostigd, de gelegenheid gegeven het eindexamen af te leggen volgens de op 31 juli 1968
      geldende voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel7
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002595
        artikel: '7'
        hoofdstuk: '1'
  - number: '9'
    text: |-
      1 De gemeentelijke gymnasia, die op 31 juli 1967 niet uit ’s Rijks kas worden bekostigd, kunnen ten laste van de
      gemeente in stand worden gehouden.

      2 Voor de toepassing van [afdeling I van titel II van de Wet op het voortgezet onderwijs](onbekend) worden de in
      het eerste lid bedoelde gymnasia van 1 augustus 1968 af aangemerkt als uit de openbare kas bekostigde gymnasia. De
      [artikelen 7, tweede lid][ref1], en [8][ref2] zijn van toepassing.

      3 Een in het eerste lid bedoeld gymnasium blijft bij de toepassing van [artikel 96][ref3] buiten aanmerking, zolang
      het niet uit ’s Rijks kas wordt bekostigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002595#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel96i
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002595
        artikel: '7'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0002595
        artikel: '8'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 96i
  - number: '10'
    text: |-
      De vergoeding ten behoeve van een gemeentelijk gymnasium, als bedoeld in [artikel 7, eerste lid][ref1],
      waarvan een of meer leerjaren tevens vormen een of meer leerjaren van een rijksatheneum, als bedoeld in
      [artikel 13, eerste lid][ref2], wordt berekend volgens door Onze minister vast te stellen regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002595#Artikel13
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002595
        artikel: '7'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0002595
        artikel: '13'
        hoofdstuk: '1'
  - number: '11'
    text: |-
      Tot 1 januari 1975 wordt de gelegenheid gegeven tot het afleggen van het staatsexamen gymnasium volgens de op 31
      juli 1968 geldende voorschriften.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel11
  - number: '12'
    text: |-
      Met ingang van 1 augustus 1968 vervallen de middelbaar-onderwijswet en de ter uitvoering daarvan gegeven
      voorschriften, voor zover bij deze wet niet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel12
  - number: '13'
    text: |-
      1 De uit ’s Rijks kas bekostigde hogereburgerscholen A en B worden met ingang van 1 augustus 1968 athenea of
      scholen voor hoger algemeen voortgezet onderwijs, ter keuze van de gemeenteraad, indien het een gemeentelijke
      school betreft, en van het bevoegd gezag, indien het een rijksschool of een bijzondere school betreft. Zij vangen
      op die datum aan met het eerste leerjaar.

      2 In afwijking van het eerste lid wordt een hogereburgerschool A, waarvan de eerste drie leerjaren niet samenvallen
      met een hogereburgerschool B noch met een gymnasium, een school voor hoger algemeen voortgezet onderwijs.

      3 Indien een hogereburgerschool B of een hogereburgerschool A en B, waarvan niet een of meer leerjaren samenvallen
      met een gymnasium, in elk van de jaren 1965, 1966 en 1967 werd bezocht door ten minste 400 leerlingen, gerekend
      naar de toestand op 16 september, kan de school worden omgezet in een scholengemeenschap, bestaande uit een
      atheneum en een school voor hoger algemeen voortgezet onderwijs dan wel in een atheneum met een afdeling voor hoger
      algemeen voortgezet onderwijs, als bedoeld in [artikel 8, eerste lid onder ][ref1].

      4 Indien een hogereburgerschool B of een hogereburgerschool A en B, waarvan een of meer leerjaren samenvallen
      met een gymnasium, tezamen met dit gymnasium in elk van de jaren 1965, 1966 en 1967 werd bezocht door ten
      minste 600 leerlingen, gerekend naar de toestand op 16 september, kan deze school tezamen met het gymnasium
      worden omgezet in een scholengemeenschap, bestaande uit een lyceum en een school voor hoger algemeen voortgezet
      onderwijs dan wel in een lyceum met een afdeling voor hoger algemeen voortgezet onderwijs, als bedoeld in
      [artikel 8, eerste lid onder ][ref2].

      5 Indien het een gemeentelijke of een bijzondere school betreft, doet het bevoegd gezag van het besluit tot
      omzetting van de hogereburgerschool, bedoeld in de vorige leden, voor 1 februari 1968 mededeling aan Onze minister.

      6 Met betrekking tot de op 1 augustus 1968 aangevangen hogere leerjaren blijven de op 31 juli 1968 geldende
      voorschriften van toepassing tot 1 augustus 1972. Voor het schooljaar 1972-1973 kan het bevoegd gezag, voor
      zover het een gemeentelijke of een bijzondere school betreft onder goedkeuring van Onze minister, alsnog een
      vijfde leerjaar volgens die voorschriften vormen. Indien de cursusduur van de hogereburgerschool met een jaar was
      verlengd, blijven de op 31 juli 1968 geldende voorschriften van toepassing tot 1 augustus 1973 en kan het bevoegd
      gezag, voor zover het een gemeentelijke of een bijzondere school betreft onder goedkeuring van Onze minister, voor
      het schooljaar 1973-1974 alsnog een zesde leerjaar volgens die voorschriften vormen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel8
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel13
    references:
      - id: ref1
