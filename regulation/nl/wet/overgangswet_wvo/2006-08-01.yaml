  - number: '20'
    text: |-
      1 De uit ’s Rijks kas bekostigde handelsdagscholen worden met ingang van 1 augustus 1968 scholen voor hoger
      algemeen voortgezet onderwijs, als bedoeld in [afdeling I van titel II van de Wet op het voortgezet onderwijs]
      (onbekend). Zij vangen op die datum aan met het eerste leerjaar.

      2 Met betrekking tot de op 1 augustus 1968 aangevangen hogere leerjaren blijven de op 31 juli 1968 geldende
      voorschriften van toepassing tot 1 augustus 1970, indien het een handelsdagschool met driejarige cursus betreft,
      en tot 1 augustus 1971, indien het een handelsdagschool met vierjarige cursus betreft. Het bevoegd gezag kan,
      indien het een handelsdagschool met driejarige cursus betreft, voor het schooljaar 1970-1971 en, indien het een
      handelsdagschool met vierjarige cursus betreft, voor het schooljaar 1971-1972 onder goedkeuring van Onze minister
      alsnog een hoogste leerjaar volgens die voorschriften vormen.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel20
  - number: '21'
    text: |-
      Tot 1 januari 1972 wordt aan de leerlingen van de handelsdagscholen met driejarige cursus, bedoeld in
      [artikel 20, eerste lid][ref1], alsmede aan de leerlingen van de handelsdagscholen met driejarige cursus, die op
      31 juli 1968 ingevolge de middelbaar-onderwijswet zijn aangewezen, doch niet uit ’s Rijks kas worden bekostigd, de
      gelegenheid gegeven het eindexamen af te leggen volgens de op 31 juli 1968 geldende voorschriften. Deze gelegenheid
      wordt tot 1 januari 1973 gegeven aan de leerlingen van de handelsdagscholen met vierjarige cursus, bedoeld in
      [artikel 20, eerste lid][ref2], alsmede aan de leerlingen van de handelsdagscholen met vierjarige cursus, die op 31
      juli 1968 ingevolge de middelbaar-onderwijswet zijn aangewezen, doch niet uit ’s Rijks kas worden bekostigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0002595#Artikel20
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel21
