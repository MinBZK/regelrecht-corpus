  - number: '45'
    text: |-
      1 Voor de kosten van stichting en eerste inrichting ten behoeve van een gemeentelijke of, voor zover die kosten
      ingevolge artikel 72 van de Lager-onderwijswet 1920 ten laste van de gemeente zijn gekomen, ten behoeve van een
      bijzondere school voor voortgezet gewoon of uitgebreid lager onderwijs, ontvangt de gemeente met ingang van 1
      januari 1969 een vergoeding ten laste van het Rijk.

      2 Ter berekening van de vergoeding stelt Onze minister het bedrag vast van de werkelijke kosten, bedoeld in het
      eerste lid, alsmede het jaar, waarin het gebouw is voltooid.

      3 De vergoeding omvat per jaar tot het tijdstip, waarop veertig jaren na het in het tweede lid bedoelde jaar zijn
      verlopen, de som, die jaarlijks nog nodig zou zijn voor rente en aflossing van een veertigjarige geldlening tot het
      vastgestelde bedrag, aangegaan in het jaar van voltooiing, waarbij de aflossing op jaarlijks gelijke bedragen is
      gesteld en de rente wordt berekend over het niet afgeloste deel van die lening tegen een rentevoet, als ingevolge
      artikel 79, vijfde lid, van de Lager-onderwijswet 1920 is bepaald voor het jaar van voltooiing.

      4 Voor de berekening van de vergoeding wordt uitbreiding van een schoolgebouw met een of meer nieuwe lokalen
      aangemerkt als stichting van een nieuw gebouw.

      5 Indien en voor zover de gebouwen en terreinen van een gemeentelijke school niet meer ten behoeve van het
      voortgezet onderwijs worden gebruikt, eindigt de vergoeding met ingang van de daaropvolgende maand.

      6 Het eerste tot en met vijfde lid zijn slechts van toepassing op andere vormen van voortgezet onderwijs als
      bedoeld in [afdeling IV van titel II van de Wet op het voortgezet onderwijs](onbekend).
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel45
  - number: '46'
    text: |-
      1 Voor de kosten van latere voorzieningen ten behoeve van een gemeentelijke of, voor zover die kosten ingevolge
      artikel 72 van de Lager-onderwijswet 1920 ten laste van de gemeente zijn gekomen, van een bijzondere school voor
      voortgezet gewoon of uitgebreid lager onderwijs ontvangt de gemeente met ingang van 1 januari 1969 een vergoeding
      ten laste van het Rijk. Als latere voorzieningen worden aangemerkt de voorzieningen, genoemd in artikel 72 van de
      Lager-onderwijswet 1920, met uitzondering van die, genoemd in [artikel 45][ref1] van deze wet.

      2 Ter berekening van de vergoeding stelt Onze minister het bedrag vast van de werkelijke kosten, bedoeld in het
      eerste lid, alsmede het jaar, waarin die voorzieningen zijn tot stand gekomen.

      3 De vergoeding omvat per jaar tot het tijdstip, waarop twintig jaren na het in het tweede lid bedoelde jaar
      zijn verlopen, de som, die jaarlijks nog nodig zou zijn voor rente en aflossing van een twintigjarige geldlening
      tot het vastgestelde bedrag, aangegaan in het jaar van totstandkoming, waarbij de aflossing op jaarlijks gelijke
      bedragen is gesteld en de rente wordt berekend over het niet afgeloste deel van die lening tegen een rentevoet, als
      ingevolge artikel 79, vijfde lid, van de Lager-onderwijswet 1920 is bepaald voor het jaar van totstandkoming.

      4 [Artikel 45, vijfde lid][ref2], is van toepassing.

      5 Het eerste en tweede lid zijn slechts van toepassing op andere vormen van voortgezet onderwijs als bedoeld in
      [afdeling IV van titel II van de Wet op het voortgezet onderwijs](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0002595#Artikel45
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel46
