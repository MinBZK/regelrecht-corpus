  - number: '23'
    text: |-
      1 De op 31 juli 1968 uit ’s Rijks kas bekostigde handelsavondscholen kunnen tot 1 augustus 1975 in stand worden
      gehouden.

      2 Op de in het eerste lid bedoelde handelsavondscholen blijven van toepassing de op 31 juli 1968 geldende
      voorschriften. Wij kunnen deze voorschriften wijzigen, voor zover zij bij algemene maatregel van bestuur zijn
      gegeven.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel23
  - number: '24'
    text: |-
      Een gymnasium en een atheneum, die met inachtneming van de [artikelen 7][ref1] en [13][ref2] ontstaan uit een
      gymnasium en een hogereburgerschool, waarvan de eerste of de eerste en de tweede leerjaren gemeenschappelijk
      zijn, worden met ingang van 1 augustus 1968 een lyceum, als bedoeld in [afdeling I van titel II van de Wet op het
      voortgezet onderwijs](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002595#Artikel13
