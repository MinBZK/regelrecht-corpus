  - number: '47'
    text: |-
      1 De jaarlijkse vergoeding, bedoeld in artikel 84 van de Lager-onderwijswet 1920, ten behoeve van scholen voor
      voortgezet gewoon en uitgebreid lager onderwijs wordt met ingang van 1 januari 1969 vervangen door een vergoeding
      ten laste van het Rijk.

      2 De vergoeding wordt vastgesteld overeenkomstig de [artikelen 45][ref1] en [46][ref2] zoals die artikelen luidden
      op 31 december 1996, met dien verstande dat slechts in aanmerking worden genomen de kosten, welke ten grondslag
      hebben gelegen aan de berekening van de jaarlijkse vergoeding, bedoeld in artikel 84 van de Lager-onderwijswet
      1920.

      3 Indien en voor zover de gebouwen en terreinen niet meer ten behoeve van het voortgezet onderwijs worden gebruikt,
      eindigt de vergoeding met ingang van de daaropvolgende maand.

      4 Een gebouw, waarin op 31 juli 1968 zowel een school voor gewoon lager onderwijs als een school voor voortgezet
      gewoon of uitgebreid lager onderwijs is gevestigd, wordt niet door het enkele feit van de omzetting van
      laatstbedoelde scholen in scholen voor voortgezet onderwijs een gebouw, als bedoeld in artikel 84 van de Lager-
      onderwijswet 1920.


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0002595#Artikel46
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel47
