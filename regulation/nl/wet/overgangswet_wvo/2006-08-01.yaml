  - number: '25'
    text: |-
      Bij de toepassing van de [artikelen 13][ref1], [17][ref2] en [20][ref3] wordt aan de desbetreffende school niet
      meer dan één school of afdeling voor hoger algemeen voortgezet onderwijs verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002595#Artikel17
