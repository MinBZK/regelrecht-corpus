  - number: '22'
    text: |-
      1 De vergoeding van de kosten van de scholen, bedoeld in de [artikelen 7, eerste lid][ref1],
      [13, eerste lid][ref2], [17, eerste lid][ref3], en [20, eerste lid][ref4], geschiedt tot 1 januari 1969 op de
      grondslag van de op 31 juli 1968 geldende voorschriften, waarbij 31 december 1968 als het einde van het lopende
      vijfjarige tijdvak wordt aangemerkt.

      2 De vaststelling van de uitgaven voor gemeentelijke scholen, bedoeld in
      [artikel 88 van de Wet op het voortgezet onderwijs][ref5], vindt voor het eerst plaats over het jaar 1969.


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel7
