  - number: '30'
    text: |-
      Met betrekking tot de uit ’s Rijks kas bekostigde scholen, bedoeld in dit hoofdstuk, blijft
      [artikel 107 van de Wet op het voortgezet onderwijs][ref1] buiten toepassing, zolang het onderwijs niet in alle
      leerjaren is ingericht volgens [afdeling I van titel II van die wet](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel107
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '107'
  - number: 30a
    text: |-
      Indien een niet uit ’s Rijks kas bekostigde avondhogereburgerschool in het schooljaar 1967-1968 geheel of
      gedeeltelijk uit de gemeentekas werd bekostigd en de school wordt omgezet in een avondschool voor voortgezet
      onderwijs, blijft de gemeente ook na 31 juli 1968 tot gehele of gedeeltelijke bekostiging bevoegd tot het tijdstip
      waarop de school ingevolge [titel III van de Wet op het voortgezet onderwijs](onbekend) uit ’s Rijks kas wordt
      bekostigd.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel30a
  - number: '31'
    text: |-
      1 De op 31 juli 1968 uit ’s Rijks kas bekostigde opleidingen voor de examens ter verkrijging van een middelbare
      akte, als bedoeld in titel VI van de middelbaar-onderwijswet, kunnen in stand worden gehouden tot een door Ons te
      bepalen tijdstip.

      2 De bekostiging van de in het eerste lid bedoelde opleidingen geschiedt onder de voorwaarden en volgens de
      regelen, die Onze minister vaststelt.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel31
  - number: '32'
    text: |-
      1 Met ingang van 1 augustus 1968 zijn de Lager-onderwijswet 1920 en de ter uitvoering daarvan gegeven
      voorschriften, tenzij bij deze wet anders is bepaald, niet meer van toepassing, voor zover zij betreffen het
      voortgezet gewoon en het uitgebreid lager onderwijs.

      2 Met ingang van 1 augustus 1973 vervalt de mogelijkheid, dat een uit de openbare kas bekostigde school voor
      basisonderwijs meer dan zes achtereenvolgende leerjaren omvat. Ten behoeve van het zevende en de hogere leerjaren
      van een school voor basisonderwijs, die voldoen aan de voorwaarden, genoemd in artikel 55*bis*, vierde lid, van de
      Lager-onderwijswet 1920, blijven tot die datum de voorschriften van die wet betreffende het voortgezet gewoon lager
      onderwijs van kracht.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel32
  - number: '33'
    text: |-
      1 De uit de openbare kas bekostigde scholen voor voortgezet gewoon lager onderwijs worden met ingang van 1 augustus
      1968 scholen voor lager algemeen voortgezet onderwijs, scholen voor lager huishoud- en nijverheidsonderwijs of
      scholen voor lager economisch en administratief onderwijs, een en ander als bedoeld in [afdeling I van titel II van
      de Wet op het voortgezet onderwijs](onbekend).

      2 De gemeenteraad of het schoolbestuur, al naar gelang het een gemeentelijke of een bijzondere school betreft,
      beslist, of zijn school een school wordt voor lager algemeen voortgezet onderwijs of een van de scholen voor
      beroepsonderwijs, genoemd in het eerste lid, en doet daarvan mededeling aan Onze minister voor 1 februari 1968.

      3 Een besluit tot omzetting van de school in een school voor lager economisch en administratief onderwijs leidt
      slechts tot bekostiging op grond van de [Wet op het voortgezet onderwijs][ref1], indien de school in elk van de
      jaren 1965, 1966 en 1967 werd bezocht door gemiddeld ten minste 150 leerlingen, gerekend naar de toestand op 16
      januari, 16 mei en 16 september.

      4 Een besluit tot omzetting van de school in een school voor lager huishoud- en nijverheidsonderwijs leidt slechts
      tot bekostiging op grond van de [Wet op het voortgezet onderwijs][ref2], indien de school in elk van de jaren 1965,
      1966 en 1967 in het tweede leerjaar werd bezocht door gemiddeld ten minste 40 meisjes, gerekend naar de toestand op
      16 januari, 16 mei en 16 september.


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002399
      - id: ref2
        bwb_id: BWBR0002399
  - number: '34'
    text: |-
      Indien de inrichting van het onderwijs van de in [artikel 33][ref1] bedoelde scholen in het tweede en de volgende
      leerjaren niet voldoet aan de bij of krachtens de [Wet op het voortgezet onderwijs][ref2] gegeven voorschriften,
      blijven de op 31 juli 1968 geldende voorschriften daarop van toepassing tot uiterlijk 1 augustus 1971.


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002595
        artikel: '33'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0002399
  - number: '35'
    text: |-
      1 De uit de openbare kas bekostigde scholen voor uitgebreid lager onderwijs worden met ingang van 1 augustus 1968
      scholen voor middelbaar algemeen voortgezet onderwijs, als bedoeld in [afdeling I van titel II van de Wet op het
      voortgezet onderwijs](onbekend).

      2 Het eerste lid is niet van toepassing op de uit de openbare kas bekostigde scholen voor uitgebreid lager
      onderwijs, waaraan in hoofdzaak handelsonderwijs wordt gegeven en waarvan de leerlingen voor 1 augustus 1967 niet
      deelnamen aan de landelijke mulo-examens. Deze scholen worden met ingang van 1 augustus 1968 scholen voor lager
      economisch en administratief onderwijs, als bedoeld in [afdeling I van titel II van de Wet op het voortgezet
      onderwijs](onbekend).

      3 Bij verschil van mening tussen het bevoegd gezag en Onze minister, of het eerste dan wel het tweede lid van
      toepassing is, beslist Onze minister, de Onderwijsraad gehoord.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel35
  - number: '36'
    text: |-
      Indien de inrichting van het onderwijs van de in [artikel 35][ref1] bedoelde scholen in het tweede en de volgende
      leerjaren niet voldoet aan de bij of krachtens de [Wet op het voortgezet onderwijs][ref2] gegeven voorschriften,
      blijven de op 31 juli 1968 geldende voorschriften daarop van toepassing tot uiterlijk 1 augustus 1971.


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002595
        artikel: '35'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0002399
  - number: '37'
    text: |-
      1 De op 31 juli 1968 nog niet geopende scholen voor voortgezet gewoon lager onderwijs, tot de stichting waarvan
      of tot medewerking aan de stichting waarvan de gemeenteraad voor 1 augustus 1967 heeft besloten of geacht wordt te
      hebben besloten, worden scholen voor lager algemeen voortgezet onderwijs, als bedoeld in [afdeling I van titel II
      van de Wet op het voortgezet onderwijs](onbekend).

      2 De op 31 juli 1968 nog niet geopende scholen voor uitgebreid lager onderwijs, tot de stichting waarvan of tot
      medewerking aan de stichting waarvan de gemeenteraad voor 1 augustus 1968 heeft besloten of geacht wordt te hebben
      besloten, worden scholen voor middelbaar algemeen voortgezet onderwijs, als bedoeld in [afdeling I van titel II van
      de Wet op het voortgezet onderwijs](onbekend).
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel37
  - number: '38'
    text: |-
      Op besluiten van de gemeenteraad betreffende de stichting van openbare scholen voor voortgezet gewoon en uitgebreid
      lager onderwijs en tot medewerking aan de stichting van overeenkomstige bijzondere scholen, genomen of geacht te
      zijn genomen voor 1 augustus 1967, blijft de Lager-onderwijswet 1920 van toepassing. Wanneer de uitvoering van een
      besluit voor 1 augustus 1973 nog niet is aangevangen, wordt dit besluit geacht niet te zijn genomen.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel38
  - number: '39'
    text: |-
      De gemeenteraad besluit na 31 juli 1967 niet tot stichting van openbare scholen voor voortgezet gewoon lager
      onderwijs of tot medewerking aan de stichting van overeenkomstige bijzondere scholen en wordt na die datum niet
      ingevolge de artikelen 19*bis*, zesde lid, of 76, eerste lid, van de Lager-onderwijswet 1920 geacht tot stichting
      of tot medewerking aan de stichting van scholen voor voortgezet gewoon lager onderwijs te hebben besloten.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel39
  - number: '40'
    text: |-
      1 Besluiten van de gemeenteraad tot stichting van openbare scholen voor uitgebreid lager onderwijs en besluiten tot
      medewerking aan de stichting van overeenkomstige bijzondere scholen, genomen of geacht te zijn genomen na 31 juli
      1967 en voor 1 augustus 1968, behoeven de goedkeuring van Onze minister.

      2 Onze minister weigert de goedkeuring, indien de stichting van de school niet in overeenstemming is met een
      evenwichtig geheel van onderwijsvoorzieningen.

      3 Indien Onze minister de goedkeuring weigert, is [artikel 71 van de Wet op het voortgezet onderwijs][ref1] van
      overeenkomstige toepassing.

      4 Op besluiten van de gemeenteraad, als bedoeld in dit artikel, blijft de Lager-onderwijswet 1920 van toepassing,
      met uitzondering van de artikelen 19*bis*, zesde lid tweede en derde volzin, 23, 23*bis* en 76, tweede en derde
      lid, en met dien verstande dat geen waarborgsom verschuldigd is. Wanneer de uitvoering van een besluit voor 1
      augustus 1973 nog niet is aangevangen, wordt dit besluit geacht niet te zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel71
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '71'
  - number: '41'
    text: |-
      1 Voor de stichtingskosten, de huren en de inrichtingskosten van openbare en bijzondere scholen, als bedoeld in de
      [artikelen 33][ref1], [35][ref2] en [37][ref3], wordt tot 1 januari 1969 geen vergoeding uit ’s Rijks kas verleend.
      De gemeenten blijven tot die datum in het genot van de uitkeringen krachtens de Financiële-Verhoudingswet 1960.

      2 Ten behoeve van de in het eerste lid bedoelde bijzondere scholen blijven de artikelen 72 tot en met 86 van
      de Lager-onderwijswet 1920 tot 1 januari 1969 van toepassing, voor zover deze betrekking hebben op uitbreiding,
      verbouwing, herstel, verandering van inrichting en op aanschaffing van schoolmeubelen of leer- en hulpmiddelen en
      met dien verstande dat geen waarborgsom verschuldigd is.

      3 Met betrekking tot besluiten van de gemeenteraad ingevolge de artikelen 75 en 76 van de Lager-onderwijswet 1920
      betreffende de in het vorige lid bedoelde voorzieningen blijven de artikelen 76, tweede lid, en 17 van die wet ook
      na 31 december 1968 van toepassing.

      4 De in het vorige lid bedoelde besluiten, dan wel de daarop in beroep genomen beslissingen worden ook na 31
      december 1968 volgens de Lager-onderwijswet 1920 uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0002595#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0002595#Artikel37
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002595
        artikel: '33'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0002595
        artikel: '35'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0002595
        artikel: '37'
        hoofdstuk: '2'
  - number: '42'
    text: |-
      1 Met betrekking tot gebouwen, terreinen en roerende zaken, die ten behoeve van bijzondere scholen voor voortgezet
      gewoon en uitgebreid lager onderwijs in bruikleen zijn gegeven of onder andere voorwaarden ter beschikking zijn
      gesteld, komen de gemeente en het schoolbestuur voor 1 januari 1969 nader overeen, op welke wijze deze gebouwen,
      terreinen en roerende zaken ter beschikking van het schoolbestuur blijven.

      2 Indien geen eigendomsoverdracht plaatsvindt, is de goedkeuring van Onze minister vereist.

      3 Indien geen overeenstemming wordt bereikt, beslist Onze minister.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel42
  - number: '43'
    text: |-
      1 Voor 1 januari 1969 betaalt de gemeente aan de besturen van de bijzondere scholen voor voortgezet gewoon en
      uitgebreid lager onderwijs de niet vervallen waarborgsommen of de niet vervallen gedeelten daarvan terug, een
      en ander met inbegrip van de geschatte waarde van de grond, bedoeld in artikel 74, tweede lid, van de Lager-
      onderwijswet 1920.

      2 Geschillen over de toepassing van dit artikel worden onderworpen aan de beslissing van gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0002595/2006-08-01#Artikel43
  - number: '44'
    text: |-
      1 Voor de exploitatiekosten van openbare en bijzondere scholen, als bedoeld in de [artikelen 33][ref1], [35][ref2]
      en [37][ref3], wordt tot 1 januari 1969 geen vergoeding uit ’s Rijks kas verleend. De gemeenten blijven tot die
      datum in het genot van de uitkeringen krachtens de Financiële-Verhoudingswet 1960. De vaststelling van de uitgaven
      voor gemeentelijke scholen, bedoeld in [artikel 88 van de Wet op het voortgezet onderwijs][ref4], vindt voor het
      eerst plaats over het jaar 1969.

      2 De vaststelling van de uitgaven van openbare scholen voor voortgezet gewoon en uitgebreid lager onderwijs en
      de vaststelling en de uitkering van de gemeentelijke vergoedingen ten behoeve van de overeenkomstige bijzondere
      scholen, betrekking hebbende op de jaren, voorafgaande aan 1 januari 1969, vinden plaats volgens de Lager-
      onderwijswet 1920, met dien verstande dat de artikelen 55*ter*, tweede lid, 101, vierde lid, en 103, derde en zesde
      lid, van die wet worden toegepast over de jaren 1963 tot en met 1968.

      3 Het tweede lid is niet van toepassing op de uitgaven en de vergoedingen, bedoeld in artikel 101*bis* van de
      Lager-onderwijswet 1920.


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0002595#Artikel35
