  - number: '12'
    text: |-
      1 De toelichting op de begroting omvat een korte omschrijving van de beleidsvoornemens die aan de begroting ten
      grondslag liggen, alsmede een toelichting op de belangrijkste posten en wijzigingen in de begroting.

      2 De toelichting omvat voorts ten minste de volgende nadere informatie:

      a. een specificatie van de begroting als bedoeld in [artikel 11][ref1]; deze specificatie geeft van elk van de op
      grond van [artikel 4, eerste lid][ref2] te onderscheiden functies een raming voor het begrotingsjaar van elk van de
      op grond van [artikel 4, derde lid][ref3] te onderscheiden rubrieken en subrubrieken, alsmede

        - het begrote exploitatiesaldo,
        - de omvang van de desbetreffende reserve aan het begin van het begrotingsjaar en
        - de begrote omvang van de desbetreffende reserve aan het eind van het begrotingsjaar;

      b. een overzicht van de heffingsverordeningen die ten grondslag liggen aan de begroting, met hun tarieven,
      heffingsgrondslagen en begrote heffingsopbrengst(en);

      c. een uiteenzetting over de financiële positie van het bedrijfslichaam, waaronder ten minste een investerings- en
      financieringsstaat is begrepen;

      d. een overzicht van de personele sterkte per 1 januari van het begrotingsjaar en van de begrote personeelskosten;

      e. een specificatie van de te verstrekken subsidies;

      f. een specificatie van de diensten door derden;

      g. een overzicht van de wijze waarop baten en lasten aan de afzonderlijke (hoofd)functies zijn toegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0009299#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0009299#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0009299#Artikel4
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel12
