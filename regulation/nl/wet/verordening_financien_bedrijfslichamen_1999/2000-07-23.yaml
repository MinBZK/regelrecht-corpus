  - number: '13'
    text: |-
      1 Het in [artikel 12, sub d][ref1] bedoelde overzicht van de personele sterkte omvat:

      a. het totale aantal personeelsleden per 1 januari van het begrotingsjaar en

      b. de sub a bedoelde totale personele sterkte omgerekend naar voltijdeenheden. Deze informatie wordt ook verstrekt
      naar de stand per 1 januari van het vorige begrotingsjaar.

      2 Het in [artikel 12, sub d][ref2] bedoelde overzicht van de begrote personeelskosten omvat het totaalbedrag dat
      met de personeelskosten is gemoeid, alsmede de afzonderlijke totaalbedragen van:

      a. salarissen;

      b. sociale-verzekeringspremies;

      c. pensioenpremie;

      d. niet in premieverband betaalde sociale lasten en overige personeelskosten van het eigen personeel.

      Deze informatie wordt ook verstrekt voor het vorige begrotingsjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0009299#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0009299#Artikel12
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel13
