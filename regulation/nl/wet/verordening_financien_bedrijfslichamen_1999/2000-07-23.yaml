  - number: '14'
    text: |-
      1 Onverminderd het bepaalde in [artikel 120, tweede lid van de wet][ref1] worden geen baten en lasten ten gunste
      onderscheidenlijk ten laste van het kalenderjaar gebracht, zonder dat de begroting door het bestuur van het
      bedrijfslichaam is vastgesteld en door de Bestuurskamer is goedgekeurd.

      2 Bij een noodzakelijk gebleken overschrijding van de in de begroting uitgetrokken bedragen van de lasten, alsmede
      voor lasten welke in de begroting niet waren voorzien, wordt een herziene begroting opgesteld.

      3 Onverminderd het bepaalde in [artikel 123 van de wet][ref2] is het bepaalde in -het tweede lid van dit artikel
      niet van toepassing indien het bedrag van de overschrijding respectievelijk van de onvoorziene lastencategorie
      niet meer dan 5% van de totale lasten van de desbetreffende hoofdfunctie beloopt, alsmede indien blijkt dat de
      overschrijding meer dan 5% is, maar daarvoor compensatie in de totale baten van de desbetreffende hoofdfunctie
      wordt gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel120
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel123
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel14
    references:
      - id: ref1
