        artikel: '123'
  - number: '15'
    text: |-
      Bijzondere transacties zoals

      a. de koop en verkoop van onroerend goed,

      b. het aangaan van geldleningen onder hypothecair verband alsmede van geldleningen voor een tijdsduur, welke verder
      strekt dan het kalenderjaar en

      c. het verstrekken van geldleningen, anders dan uit een oogpunt van normale beleggingen

      worden, voorzover deze zijn voorzien en opgenomen in de jaarlijkse begroting, daarin afzonderlijk toegelicht. In
      andere gevallen worden voor dergelijke transacties afzonderlijke aanvullende begrotingsverordeningen opgesteld.
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel15
  - number: '16'
    text: |-
      1 De jaarlijkse begroting gaat vergezeld van een meerjarenraming en toelichting daarop.

      2 De meerjarenraming en toelichting geven inzicht in de financiële consequenties van de beleidsontwikkeling voor de
      komende jaren.

      3 Uitgangspunt voor de meerjarenraming is het beleid dat ten grondslag ligt aan de bedragen, opgenomen in de
      begroting.

      4 De meerjarenraming biedt inzicht in de jaarlijkse ontwikkeling van de stand van de reserves.
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel16
  - number: '17'
    text: De financiële verslaglegging van de organisatie bestaat uit de jaarrekening en het jaarverslag.
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel17
  - number: '18'
    text: |-
      1 De jaarrekening bestaat uit:

      a. de rekening van baten en lasten en de toelichting daarop;

      b. de balans en de toelichting daarop.

      2 De jaarrekening wordt vastgesteld met inachtneming van hetgeen omtrent de financiële positie op de balansdatum
      is gebleken tussen het moment van opmaken van de jaarrekening en het tijdstip van vaststelling daarvan, voor zover
      deze aanvullende informatie onontbeerlijk is voor het in [artikel 2][ref1] bedoelde inzicht.


      [ref1]: https://wetten.overheid.nl/BWBR0009299#Artikel2
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0009299
        artikel: '2'
        paragraaf: '2'
  - number: '19'
    text: |-
      1 Het jaarverslag bevat een beknopte verantwoording van het gevoerde beleid en beheer.

      2 Het jaarverslag geeft een getrouw beeld van de toestand op de balansdatum en de gang van zaken gedurende het
      boekjaar.

      3 In het jaarverslag worden tevens mededelingen gedaan over

      a. de doeltreffendheid en doelmatigheid van het gevoerde beleid en

      b. het voor het komende en volgende jaren te voeren beleid.
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel19
  - number: '20'
    text: |-
      De rekening van baten en lasten en de toelichting geven getrouw, duidelijk en stelselmatig de omvang van alle baten
      en alle lasten, alsmede het saldo daarvan weer.
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel20
  - number: '21'
    text: |-
      1 De rekening van baten en lasten is, zoals schematisch is weergegeven in [bijlage 5][ref1], ingericht
      overeenkomstig de inrichting van de begroting, met dien verstande dat de bedoelde opstelling telkens de
      gerealiseerde bedragen voor het verslagjaar, de begrote bedragen voor het verslagjaar na eventuele, door het
      bestuur vastgestelde wijzigingen en de gerealiseerde bedragen voor het vorige verslagjaar omvat.

      2 Het besluit tot vaststelling van de jaarrekening omvat, zoals schematisch is weergegeven in [bijlage 6][ref2], de
      in het eerste lid bedoelde rekening van baten en lasten voor alleen het verslagjaar, alsmede de balans per ultimo
      van het verslagjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0009299
      [ref2]: https://wetten.overheid.nl/BWBR0009299
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0009299
      - id: ref2
        bwb_id: BWBR0009299
  - number: '22'
    text: |-
      De toelichting op de rekening van baten en lasten bevat ten minste:

      a. een specificatie van de rekening als bedoeld in [artikel 26, eerste lid][ref1]; deze specificatie geeft van
      elk van de in de begroting voor het verslagjaar onderscheiden functies het gerealiseerde bedrag van elk van de in
      diezelfde begroting onderscheiden rubrieken en subrubrieken, alsmede het exploitatiesaldo;

      b. een overzicht van de heffingsverordeningen en de begrote en gerealiseerde heffingsopbrengst(en);

      c. een toelichting per (hoofd)functie van de belangrijke afwijkingen tussen begrote en gerealiseerde baten en
      lasten;

      d. een overzicht van de personele sterkte per 1 januari en per ultimo van het verslagjaar en van de
      personeelskosten in het verslagjaar; een en ander overeenkomstig de desbetreffende toelichting op de begroting,
      aangevuld met een overzicht van de verdeling van de personele sterkte – omgerekend naar voltijdeenheden – over de
      door het bedrijfslichaam gehanteerde salarisschalen/functiegroepen;

      e. een overzicht van de in het verslagjaar en het daaraan voorafgaande jaar verstrekte subsidies waaruit blijkt wie
      of welke instanties de subsidieontvangers zijn en voor welke activiteiten welke bedragen zijn toegekend;

      f. een specificatie van de diensten door derden;

      g. een overzicht van de wijze waarop baten en lasten aan de afzonderlijke (hoofd)functies zijn toegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0009299#Artikel26
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009299
        artikel: '26'
        paragraaf: '5'
  - number: '23'
    text: |-
      1 De balans, zoals schematisch weergegeven in [bijlage 7][ref1], geeft tezamen met de toelichting daarop getrouw,
      duidelijk en stelselmatig de financiële positie en de samenstelling daarvan in actief- en passiefposten op het
      einde van het verslagjaar weer.

      2 De balans bevat ook de cijfers van het voorafgaande verslagjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0009299
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009299
  - number: '24'
    text: |-
      In de toelichting op de balans wordt vermeld tot welke belangrijke, niet uit de balans blijkende, financiële
      verplichtingen het bedrijfslichaam voor de toekomst is verbonden, zoals die welke voortvloeien uit langlopende
      overeenkomsten of bijzondere kortlopende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel24
  - number: '25'
    text: |-
      1 In de balans worden de activa onderscheiden in vaste en vlottende activa, al naar gelang zij zijn bestemd om de
      uitoefening van de werkzaamheid van het bedrijfslichaam al dan niet duurzaam te dienen.

      2 Onder de vaste activa worden afzonderlijk opgenomen de materiële en de financiële vaste activa.

      3 Onder de vlottende activa worden afzonderlijk opgenomen de voorraden, de vorderingen, de overlopende activa voor
      zover deze niet zijn begrepen in de vorderingen en de liquide middelen.
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel25
  - number: '26'
    text: |-
      1 In de toelichting op de balans worden onder de materiële vaste activa afzonderlijk opgenomen:

      a. bedrijfsgebouwen;

      b. overige aan de bedrijfsuitoefening dienstbare materiële vaste activa;

      c. overige niet aan de bedrijfsuitoefening dienstbare materiële vaste activa.

      2 In de toelichting op de balans worden onder de financiële vaste activa afzonderlijk opgenomen:

      a. langlopende leningen;

      b. effecten.

      3 In de toelichting op de balans wordt het bruto-verloop van de vaste activa gedurende het verslagjaar weergegeven
      in een sluitend overzicht van de beginstanden, van de mutaties waaronder mede begrepen afschrijvingen en
      waardeverminderingen en van de eindstanden op de balansdatum.
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel26
  - number: '27'
    text: |-
      In de toelichting op de balans worden onder de tot de vlottende activa behorende vorderingen afzonderlijk
      opgenomen:

      a. vorderingen uit hoofde van heffingen;

      b. vorderingen op stichtingen, fondsen of instellingen waarmee het bedrijfslichaam een bestendige zakelijke relatie
      heeft;

      c. overige vorderingen.
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel27
  - number: '28'
    text: |-
      1 Onder de passiva worden afzonderlijk opgenomen het eigen vermogen, de voorzieningen, de langlopende schulden en
      de vlottende passiva.

      2 Onder de vlottende passiva worden afzonderlijk opgenomen de kortlopende schulden en de overlopende passiva voor
      zover deze niet zijn begrepen in de schulden.
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel28
  - number: '29'
    text: |-
      1 Onder langlopende schulden worden verstaan de schulden met een resterende looptijd van één jaar of langer.

      2 In de toelichting op de balans worden onder de langlopende schulden afzonderlijk opgenomen:

      a. hypothecaire leningen;

      b. andere leningen.

      3 Van de in het tweede lid bedoelde leningen worden naast de omvang van de resterende schuldbedragen vermeld de
      verstrekte zekerheden, de resterende looptijden en de werkelijke rentepercentages.
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel29
  - number: '30'
    text: |-
      In de toelichting op de balans worden onder de tot de vlottende passiva behorende kortlopende schulden afzonderlijk
      opgenomen:

      a. schulden aan stichtingen, fondsen of instellingen waarmee het bedrijfslichaam een bestendige zakelijke relatie
      heeft;

      b. banksaldi;

      c. schulden ter zake van belastingen en premies sociale verzekering;

      d. schulden ter zake van pensioenen;

      e. overige schulden.
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel30
  - number: '31'
    text: |-
      1 Reserves worden in de balans onderscheiden naar:

      a. de algemene reserve en

      b. de bestemmingsreserves.

      2 De algemene reserve is de reserve van de hoofdfunctie bestuur.

      3 De overige reserves zijn bestemmingsreserves.
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel31
  - number: '32'
    text: Het eigen vermogen bestaat uit de som van de algemene reserve en de bestemmingsreserves.
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel32
  - number: '33'
    text: |-
      In de toelichting op de balans worden eventuele stille reserves of tekorten geraamd, indien:

      a. de actuele waarde van materiële vaste activa belangrijk afwijkt van de boekwaarde en

      b. de actuarieel wenselijke omvang van voorzieningen belangrijk afwijkt van de feitelijke omvang daarvan.
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel33
  - number: '34'
    text: |-
      Het eigen vermogen is maximaal gelijk aan het totaal van de lasten over het verslagjaar, met dien verstande dat
      deze norm zoveel mogelijk per hoofdfunctie wordt gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel34
  - number: '35'
    text: |-
      1 Een positief exploitatiesaldo op een (hoofd)functie wordt, voor zover deze (hoofd)functie wordt gefinancierd uit
      een bestemmingsheffing, gebracht naar de reserve van de desbetreffende (hoofd)functie.

      2 Bij een negatief exploitatiesaldo op een (hoofd)functie wordt zoveel mogelijk geput uit de desbetreffende
      reserve.

      3 De algemene reserve mag uitsluitend gemuteerd worden met

      a. het exploitatiesaldo van de hoofdfunctie ‘bestuur’,

      b. de reserve van een van de andere (hoofd)functies, voorzover deze niet is gefinancierd uit een bestemmingsheffing
      en,

      bij verordening, met

      c. de reserve van een van de andere (hoofd)functies, voor zover deze is gefinancierd uit een bestemmingsheffing.

      4 Een bestemmingsreserve mag uitsluitend worden gemuteerd met

      a. het eigen exploitatiesaldo,

      b. een gehele of gedeeltelijke overboeking naar de algemene reserve en, bij verordening, met

      c. de reserve van een andere (hoofd)functie.

      5 Rente- of dividendontvangsten op reserves worden geboekt ten gunste van de desbetreffende rekening van baten
      en lasten.
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel35
  - number: '36'
    text: |-
      1 Voorzieningen worden niet gevormd voor:

      a. bekostiging van wetenschappelijke verrichtingen, propaganda e.d.;

      b. intern-huishoudelijke doeleinden;

      c. aankoop, bouw of vergunning van onroerend goed.

      2 Voorzieningen mogen worden gevormd voor:

      a. voor fondsen, welke in het belang van de bedrijfsgenoten zijn gevormd bij door de betrokken minister
      goedgekeurde verordening;

      b. voor groot onderhoud van kantoorgebouwen.

      3 Een voorziening voor wachtgeldverplichtingen kan slechts worden gevormd, indien zich omstandigheden voordoen,
      welke binnen afzienbare tijd tot uitgaven voor wachtgeldverplichtingen kunnen leiden.
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel36
  - number: '37'
    text: |-
      1 Een afzonderlijke voorziening wordt gevormd voor een verplichting, welke voortvloeit uit de verordening
      pensioenen personeel van een bedrijfslichaam.

      2 Indien een voorziening, bedoeld in het eerste lid, betrekking heeft op een backserviceverplichting, strekt deze
      niet verder dan tot het bedrag van de verplichting aan het einde van het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel37
  - number: '38'
    text: |-
      1 In de toelichting op de balans wordt elke voorziening afzonderlijk vermeld en toegelicht.

      2 Per voorziening wordt het bruto verloop gedurende het verslagjaar in een sluitend overzicht weergegeven.

      Daaruit blijken:

      a. het saldo aan het begin van het jaar;

      b. de toevoegingen in het jaar ten laste van de rekening van baten en lasten;

      c. de vermeerderingen in het jaar door ontvangen subsidies;

      d. de vermeerderingen in het jaar door overige ontvangsten van derden;

      e. de vrijgevallen bedragen in het jaar;

      f. de aanwending in het jaar;

      g. het saldo aan het einde van het jaar.
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel38
  - number: '39'
    text: |-
      1 Rente- en dividendontvangsten op voorzieningen worden geboekt ten gunste van de rekening van baten en lasten.

      2 Eenmaal gevormde voorzieningen waaraan de verplichting of de te verwachten uitgave geheel of gedeeltelijk is
      ontvallen, worden voor zover nodig afgeboekt ten gunste van de rekening van baten en lasten.
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel39
  - number: '40'
    text: |-
      1 Externe controle van de jaarrekening en het jaarverslag wordt door het bestuur opgedragen aan een
      registeraccountant of aan een accountant-administratieconsulent met een aantekening als bedoeld in
      [artikel 36, derde lid van de Wet op de Accountants-Administratieconsulenten][ref1], niet zijnde een interne
      accountant van een bedrijfslichaam.

      2 De accountant brengt omtrent zijn onderzoek verslag uit aan het (dagelijks) bestuur.

      3 De accountant geeft de uitslag van zijn onderzoek weer in een verklaring omtrent de getrouwheid van de
      jaarrekening. De accountant stelt vast of het jaarverslag conform deze verordening is opgesteld en met de
      jaarrekening verenigbaar is. Indien er ernstige tekortkomingen in het jaarverslag aanwezig zijn, maakt hij daarvan
      melding in de verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel36
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '36'
  - number: '41'
    text: |-
      1 Bij zijn controle betrekt de accountant de naleving door het bedrijfslichaam van de Verordening financiën
      bedrijfslichamen 1999, alsmede van [de wet][ref1]. Hiervan geeft de accountant kennis in zijn verklaring.

      2 De in [artikel 40, derde lid][ref2] bedoelde accountantsverklaring wordt tegelijk met de jaarrekening -van het
      bedrijfslichaam aan de Bestuurskamer overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002058
      [ref2]: https://wetten.overheid.nl/BWBR0009299#Artikel40
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002058
      - id: ref2
        bwb_id: BWBR0009299
        artikel: '40'
        paragraaf: '6'
  - number: '42'
    text: |-
      Op gemotiveerd verzoek van het bestuur van een bedrijfslichaam kan de Bestuurskamer in bijzondere gevallen, waarin
      de nakoming van een bij deze verordening opgelegde verplichting op overwegende bezwaren stuit, of wegens andere
      bijzondere omstandigheden, aan het bedrijfslichaam ontheffing van die verplichting worden verleend. Aan deze
      ontheffing kunnen voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel42
  - number: '43'
    text: |-
      1 Er is een commissie met vertegenwoordigers van bedrijfslichamen en van het secretariaat van de Bestuurskamer,
      die de Bestuurskamer gevraagd en ongevraagd adviseert over de voorschriften en richtlijnen voor de begroting en
      jaarverslaglegging en de toepassing ervan.

      2 De leden van de commissie worden benoemd door de Bestuurskamer.
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel43
  - number: '44'
    text: |-
      De Verordening financiën bedrijfslichamen 1978 wordt ingetrokken, met dien verstande dat hij van kracht blijft voor
      de begrotingen en de rekeningen over de aan 1999 voorafgaande begrotingsjaren.
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel44
  - number: '45'
    text: Deze verordening wordt bekendgemaakt in het Verordeningenblad Bedrijfsorganisatie.
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel45
  - number: '46'
    text: |-
      Deze verordening treedt in werking met ingang van 1 januari 1999, met dien verstande dat hij voor het eerst wordt
      toegepast bij de opstelling van de begrotingen voor het jaar 1999.
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel46
  - number: '47'
    text: Deze verordening wordt aangehaald als Verordening financiën bedrijfslichamen 1999.
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel47
