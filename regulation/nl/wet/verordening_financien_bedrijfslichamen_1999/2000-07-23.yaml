  - number: '2'
    text: |-
      1 De begroting, de meerjarenraming en de jaarrekening geven volgens normen die in het maatschappelijk verkeer als
      aanvaardbaar worden beschouwd, een zodanig inzicht dat een verantwoord oordeel kan worden gevormd over het beheer
      van de financiën in het algemeen en over de grootte en samenstelling van het vermogen en van de baten en lasten in
      het bijzonder.

      2 Voorzover dat nodig is voor het in het eerste lid bedoelde inzicht, zijn de bepalingen van deze verordening van
      overeenkomstige toepassing op commissies ex [artikel 88a van de wet][ref1]; in dat geval wordt tot uitdrukking
      gebracht dat de begroting, de meerjarenraming en de jaarrekening van het bedrijfslichaam geconsolideerde financiële
      stukken zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel88a
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: 88a
  - number: '3'
    text: |-
      1 Voor de begroting, de meerjarenraming en de jaarrekening wordt het stelsel van baten en lasten gehanteerd.

      2 Boekjaren komen overeen met kalenderjaren.

      3 De indeling van de begroting, de meerjarenraming en de jaarrekening mag slechts om gegronde redenen afwijken van
      die van het voorafgaande boekjaar; in de toelichting worden de verschillen aangegeven en gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel3
  - number: '4'
    text: |-
      1 Baten en lasten worden toegerekend aan afzonderlijke (hoofd)functies. De wijze van toerekening en mate
      van detaillering naar functies worden zodanig gekozen dat een duidelijk beeld van het te voeren beleid,
      onderscheidenlijk het gevoerde beleid wordt verkregen.

      2 De in het eerste lid bedoelde toerekening dient te kunnen worden geaggregeerd tot de indeling in hoofdfuncties,
      omschreven in [bijlage 1][ref1] van deze verordening.

      3 De baten en lasten van elk van de op grond van het bepaalde in het eerste lid te onderscheiden (hoofd)functies
      worden ingedeeld in de rubrieken, vermeld in [bijlage 2][ref2] bij deze verordening. Deze worden zo ver gesplitst
      in subrubrieken als nodig is ter verkrijging van een duidelijk beeld van het te voeren, onderscheidenlijk het
      gevoerde beleid.


      [ref1]: https://wetten.overheid.nl/BWBR0009299
      [ref2]: https://wetten.overheid.nl/BWBR0009299
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009299
      - id: ref2
        bwb_id: BWBR0009299
  - number: '5'
    text: Alle baten en lasten worden geraamd, onderscheidenlijk verantwoord tot hun bruto bedrag.
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel5
  - number: '6'
    text: |-
      1 Bij de begroting, meerjarenraming en jaarrekening worden de gehanteerde grondslagen voor de bepaling van de baten
      en lasten en voor de waardering van de activa en passiva vermeld.

      2 Slechts om gegronde redenen mogen de waardering van de activa en de passiva en de bepaling van de baten en de
      lasten geschieden op andere grondslagen dan die welke in het voorafgaande boekjaar zijn toegepast. De reden van de
      verandering wordt in de toelichting uiteengezet. Tevens wordt inzicht gegeven in haar betekenis voor de financiële
      positie en voor de baten en de lasten aan de hand van aangepaste cijfers voor het desbetreffende boekjaar en het
      daaraan voorafgaande jaar.

      3 Het bestuur van een bedrijfslichaam legt het beleid inzake het beleggen van vaste en vlottende middelen
      (beleggingsbeleid) vast ten behoeve van het dagelijks bestuur, dat belast is met het beheer van het vermogen en de
      inkomsten en uitgaven.

      Het beleggingsbeleid wordt vastgelegd in een verordening.

      In de jaarrekening wordt een toelichting gegeven op het gevoerde beleggingsbeleid in relatie tot de door het
      bestuur ter zake geformuleerde uitgangspunten.
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel6
  - number: '7'
    text: |-
      1 Activa en passiva worden gewaardeerd op basis van de verkrijgings- of vervaardigingsprijs.

      2 In afwijking van het bepaalde in het eerste lid zijn voor voorraden, vorderingen, liquide middelen, schulden en
      voorzieningen andere waarderingsgrondslagen van toepassing:

      a. voorraden worden tegen de marktwaarde gewaardeerd indien de marktwaarde lager is dan de verkrijgings- of
      vervaardigingsprijs;

      b. vorderingen worden, onder aftrek van eventuele voorzieningen wegens oninbaarheid, tegen de nominale waarde
      gewaardeerd;

      c. liquide middelen worden gewaardeerd tegen de nominale waarde;

      d. schulden worden tegen de nominale waarde gewaardeerd;

      e. voorzieningen worden gewaardeerd tegen de nominale waarde of tegen de contante waarde.

      3 In afwijking van het bepaalde in het eerste lid wordt bij de waardering van de vaste activa rekening gehouden
      met een vermindering of vermeerdering van hun waarde, indien deze vermindering respectievelijk vermeerdering naar
      verwachting duurzaam is.
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel7
  - number: '8'
    text: |-
      1 Waardeverminderingen of waardevermeerderingen van activa als bedoeld in [artikel 7, tweede lid][ref1] worden
      onafhankelijk van het resultaat van het boekjaar in aanmerking genomen.

      2 Het verschil tussen verkrijgingsprijs en marktwaarde van effecten wordt in de toelichting op de balans opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0009299#Artikel7
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009299
        artikel: '7'
        paragraaf: '2'
  - number: '9'
    text: |-
      1 Bij de toepassing van de waarderings- en afschrijvingsmethoden wordt het toerekeningbeginsel in acht genomen.

      2 De methoden volgens welke de afschrijvingen zijn berekend worden in de toelichting op de balans uiteengezet.
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel9
  - number: '10'
    text: |-
      De begroting en toelichting geven getrouw, duidelijk en stelselmatig de omvang van alle begrote baten en lasten van
      het begrotingsjaar, alsmede het saldo daarvan weer.
    url: https://wetten.overheid.nl/BWBR0009299/2000-07-23#Artikel10
  - number: '11'
    text: |-
      1 De begroting geeft, zoals schematisch weergegeven in [bijlage 3][ref1], voor elk van de op grond van
      [artikel 4, eerste lid][ref2] te onderscheiden hoofdfuncties, alsmede voor alle hoofdfuncties tezamen (totaal-
      generaal) ramingen voor elk van de op grond van [artikel 4, tweede lid][ref3] te onderscheiden rubrieken,
      alsmede de ramingen van de totaalbedragen van de baten, van de totaalbedragen van de lasten voor en na interne
      overboekingen, van de exploitatiesaldi en van de omvang van de reserves per ultimo. Deze opstelling omvat telkens
      de geraamde bedragen voor het begrotingsjaar, de geraamde bedragen voor het vorige begrotingsjaar na eventuele,
      door het bestuur vastgestelde wijzigingen en de gerealiseerde bedragen voor het voorvorige begrotingsjaar.

      2 De begrotingsverordening omvat, zoals schematisch weergegeven in [bijlage 4][ref4], de in het eerste lid bedoelde
      opstelling voor alleen het desbetreffende begrotingsjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0009299
      [ref2]: https://wetten.overheid.nl/BWBR0009299#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0009299#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0009299
