    text: |-
      1 In deze verordening wordt verstaan onder:









                    a.


                    wet:


                    [Wet op de bedrijfsorganisatie][ref1];




                    b.


                    bedrijfslichaam:


                    bedrijf-, hoofdbedrijf-, product- of hoofdproductschap




                    c.


                    raad:


                    Sociaal-Economische Raad;




                    d.


                    Bestuurskamer:


                    commissie ex [artikel 19 van de wet][ref2], ingesteld bij Besluit van de raad (RE 6/1994);




                    e.


                    hoofdfunctie:


                    groep van gelijksoortige taken en activiteiten van een bedrijfslichaam zoals omschreven in
      [bijlage 1][ref3] bij deze verordening;




                    f.


                    functie:


                    onderdeel van een hoofdfunctie; als zodanig kan dat één afzonderlijke taak of activiteit zijn, dan
      wel een groep van taken of activiteiten;




                    g.


                    rubriek:


                    baten- of lastencategorie als vermeld in [bijlage 2][ref4] bij deze verordening;




                    h.


                    subrubriek:


                    onderdeel van een rubriek.






      2 Deze verordening is mede van toepassing op lichamen ter gemeenschappelijke behartiging van belangen als bedoeld
      in [artikel 109 e.v. van de wet][ref5].


