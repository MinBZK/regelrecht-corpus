  - number: '13'
    text: |-
      1 De betrokkene, bedoeld in [artikel 12b, eerste lid, van het besluit][ref1], ontvangt een tegemoetkoming, berekend
      met overeenkomstige toepassing van [artikel 12][ref2], met dien verstande dat:

      a. het maximum van de tegemoetkoming, bedoeld in [artikel 12, eerste lid][ref3], per maand € 59,35 bedraagt;

      b. het maximum van de tegemoetkoming per reisdag, bedoeld in [artikel 12, tweede lid][ref4], € 3,33 bedraagt;

      c. de tegemoetkoming per kilometer € 0,07 bedraagt.

      2 De betrokkene, bedoeld in [artikel 12b, tweede lid, van het besluit][ref5], ontvangt een tegemoetkoming, berekend
      met overeenkomstige toepassing van [artikel 12][ref6], met dien verstande dat:

      a. in de formule D € 0,20 is, voor zover de tegemoetkoming betrekking heeft op de dagen waarop de betrokkene
      blijkens een verklaring per fiets reist, of € 0,07, voor zover de tegemoetkoming betrekking heeft op de overige
      dagen;

      b. het maximale bedrag, bedoeld in [artikel 12, eerste lid][ref7], volgens de volgende formule wordt berekend:

      A/5 * × + B/5 * Y

      waarbij:

      A is het gemiddeld aantal reisdagen per week, waarop blijkens een schriftelijke verklaring de afstand per fiets
      wordt afgelegd;

      B is het gemiddeld aantal overige reisdagen per week;

      X is het maximale bedrag, genoemd in [artikel 12, eerste lid][ref8];

      Y is het maximale bedrag, genoemd in het eerste lid, onder a.

      c. het maximale bedrag, genoemd in [artikel 12, tweede lid][ref9], van toepassing is op het daadwerkelijke aantal
      reisdagen per maand, waarop de afstand per fiets is afgelegd en het maximale bedrag, genoemd in het eerste lid,
      onder b, van toepassing is op de daadwerkelijke overige reisdagen per maand..

      3 Het bevoegd gezag kan van de betrokkene, bedoeld in het tweede lid, verlangen dat deze zijn reispatroon,
      opgegeven in de in [artikel 12b, tweede lid, van het besluit][ref10] bedoelde verklaring, niet vaker dan een maal
      per kalenderjaar wijzigt.


