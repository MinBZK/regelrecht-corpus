  - number: '14'
    text: |-
      1 De tegemoetkoming in pensionkosten als bedoeld in [artikel 12ba, eerste lid, van het besluit][ref1] bedraagt
      voor de betrokkene die gewoonlijk met gezinsleden samenwoont 90% en voor de overige betrokkenen 60% van de
      betaalde pensionkosten, voor zover deze kosten niet uitgaan boven de door het bevoegde gezag redelijk geoordeelde
      pensionkosten.

      2 De vergoeding in reiskosten voor gezinsbezoek dan wel voor het bezoeken van de plaats waar betrokkene nog is
      gehuisvest is gelijk aan de kosten van het gebruik van het opebaar vervoer en wel naar het tarief van de laagste
      klasse dan wel – indien per eigen vervoer wordt gereisd – gelijk aan de vergoeding per kilometer, genoemd in
      [artikel 3, eerste volzin, van de Reisregeling binnenland][ref2].

      3 Voor de betrokkene als bedoeld in [artikel 12ba, tweede lid, van het besluit][ref3] zijn de [artikelen 11][ref4],
      [12][ref5] en [13][ref6] van overeenkomstige toepassing.


