  - number: '3'
    text: |-
      1 De betrokkene, die het transport van zijn inboedel door een transportondernemer laat verzorgen, vraagt vooraf
      offerte bij drie transporteurs en laat het transport slechts uitvoeren op de voor het rijk minst kostbare wijze.

      2 Terstond na de verhuizing zendt de betrokkene een gespecificeerde rekening, vergezeld van de in het eerste lid
      bedoeld offertes naar het bevoegde gezag ter betaling rechtstreeks aan de verhuizer.

      3 In afwijking van het gestelde in het eerste en tweede lid kan het bevoegde gezag een verhuizer aanwijzen.
    url: https://wetten.overheid.nl/BWBR0004633/2019-01-01#Artikel3
  - number: '4'
    text: |-
      De betrokkene die het transport van zijn inboedel niet door een transportondernemer laat verzorgen, maar de
      verhuizing in eigen beheer uitvoert, heeft aanspraak op vergoeding van de kosten van huur en brandstof van een
      (bestel- of vracht)auto dan wel – indien het vervoer van de inboedel anderszins plaatsvindt – op de vergoeding per
      kilometer genoemd in [artikel 2 van de Reisregeling binnenland][ref1], met dien verstande dat niet meer dan twee
      ritten naar de nieuwe woning worden vergoed. De betrokkene zendt zijn declaratie – in geval er sprake is van huur
      van een auto vergezeld van de rekening van het verhuurbedrijf – naar het bevoegde gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0005912#Artikel2
    url: https://wetten.overheid.nl/BWBR0004633/2019-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005912
        artikel: '2'
  - number: '6'
    text: |-
      1 Bij een verhuizing uit Nederland naar een plaats buiten Europa of IJsland en omgekeerd, alsmede bij een
      verhuizing overzee buiten Europa worden met betrekking tot de mee te nemen inboedel voor rijksrekening ten hoogste
      genomen de kosten van het vervoer per schip van een hoeveelheid die kan worden geladen in een 20 voets container.

      2 Onze minister kan bij een verhuizing binnen het Caribische deel van het Koninkrijk, toestaan dat het in het
      eerste lid genoemde volume wordt overschreden met de laadruimte nodig voor een motorvoertuig.
    url: https://wetten.overheid.nl/BWBR0004633/2019-01-01#Artikel6
  - number: '7'
    text: |-
      De tegemoetkoming in dubbele woonkosten, als bedoeld in [artikel 8, eerste lid, onderdeel b van het besluit][ref1],
      is gelijk aan de noodzakelijk te maken kosten, met dien verstande, dat de tegemoetkoming maximaal € 272,27 per
      maand bedraagt en over een termijn van maximaal vier maanden wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0004630#Artikel8
    url: https://wetten.overheid.nl/BWBR0004633/2019-01-01#Artikel7
    references:
