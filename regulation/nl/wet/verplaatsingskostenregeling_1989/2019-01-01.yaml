        artikel: '2'
  - number: '2'
    text: |-
      1 Indien het verlaten van een dienstwoning, bedoeld in [artikel 4 van het besluit][ref1] verband houdt met een
      ontslag uit de dienst, bestaat aanspraak op een tegemoetkoming in verhuiskosten als gold het een verhuizing binnen
      de woonplaats.

      2 Indien het mogelijk blijkt, dat de dienstwoning eerder beschikbaar komt, als de betrokkene een woning buiten de
      woonplaats betrekt, kan het bevoegde gezag in afwijking van het eerste lid bepalen, dat aanspraak bestaat op gehele
      of gedeeltelijke vergoeding van de daarmee samenhangende transportkosten.

      3 Het bevoegde gezag kan na daartoe een bedrijfsmaatschappelijk advies te hebben ingewonnen, bepalen dat het tweede
      lid van overeenkomstige toepassing is, indien de betrokkene bij het verlaten van de dienstwoning op sociale gronden
      een woning buiten de woonplaats betrekt.

      4 Het eerste, tweede en derde lid zijn van overeenkomstige toepassing voor het geval bedoeld in
      [artikel 4, derde lid van het besluit][ref2].

      5 Onverminderd het gestelde in het eerste, tweede en derde lid wordt in de gevallen bedoeld in
      [artikel 4, tweede lid van het besluit][ref3], de tegemoetkoming beperkt tot transportkosten.

      6 In de gevallen bedoeld in [artikel 6, tweede lid van het besluit ][ref4]wordt de tegemoetkoming beperkt tot
      transportkosten en de kosten als bedoeld in [artikel 9 van het besluit][ref5].

      7 De betrokkene die geen aanspraak heeft op vervoer voor rijksrekening van zijn inboedel maar uitsluitend op
      vervoer van zijn bagage heeft bij een verhuizing overzee aanspraak op ten hoogste de kosten van het vervoer per
      schip van een hoeveelheid van:

        - 1 m³ voor de betrokkene,
        - 1 m³ voor de echtgenoot, de levenspartner of de geregistreerde partner en
        - 1/2 m³ voor elk tot het gezin behorend en meeverhuizend kind.


