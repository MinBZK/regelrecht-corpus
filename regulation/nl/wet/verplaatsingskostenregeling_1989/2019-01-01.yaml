    text: |-
      1 In deze regeling wordt verstaan onder ‘besluit’: het [Verplaatsingskostenbesluit 1989][ref1].

      2 De begripsomschrijvingen in [artikel 2 van het besluit][ref2] zijn voor de toepassing van deze regeling van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004630
      [ref2]: https://wetten.overheid.nl/BWBR0004630#Artikel2
    url: https://wetten.overheid.nl/BWBR0004633/2019-01-01#Artikel1
