  - number: '15'
    text: |-
      1 De vergoeding of tegemoetkoming ingevolge het bepaalde in [artikel 14][ref1] wordt voor de eerste keer voor niet
      langer dan zes maanden verleend. Het bevoegde gezag kan deze termijn op verzoek van de betrokkene telkens voor niet
      langer dan zes maanden verlengen.

      2 Geen aanspraak op vergoeding of tegemoetkoming in reis- en/of pensionkosten bestaat indien de declaratie van
      de in een kalendermaand gemaakte kosten niet binnen drie maanden na die kalendermaand bij het bevoegd gezag is
      ingediend.

      3 Onze Minister is bevoegd om te bepalen dat de vergoedingen of tegemoetkomingen vastgesteld op basis van de
      [artikelen 11][ref2], [12][ref3] en [13][ref4] zonder declaratie worden uitbetaald.


