        artikel: '8'
  - number: '9'
    text: |-
      1 De tegemoetkoming in de kosten voor transport overzee van een auto bedraagt:

      a. 100% van de transportkosten indien de auto ten tijde van het transport niet ouder is dan 3 jaar;

      b. 50% van de transportkosten indien de auto ten tijde van het transport 3 jaar of ouder is.

      2 Geen tegemoetkoming in de kosten van transport van een auto wordt verleend, indien de auto minder dan een half
      jaar voor de datum van verplaatsing van betrokkene is gekocht.
    url: https://wetten.overheid.nl/BWBR0004633/2019-01-01#Artikel9
  - number: '10'
    text: |-
      Bij een verplaatsing uit, naar en buiten Nederland worden voor rijksrekening slechts genomen de kosten van een
      dekkende verzekering van de bagage en de inboedel tegen schade ten gevolge van of in verband met de verhuizing voor
      rijksrekening, mits bij die verzekering de verzekerde waarde binnen – naar het oordeel van de minister – redelijke
      grenzen blijft.
    url: https://wetten.overheid.nl/BWBR0004633/2019-01-01#Artikel10
  - number: '11'
    text: |-
      1 De vergoeding als bedoeld in [artikel 12, eerste lid, van het besluit][ref1] betreft zowel de kosten van openbaar
      vervoer per trein als de kosten van ander (aansluitend) openbaar vervoer dan de trein.

      2 De vergoeding, bedoeld in het eerste lid, voor zover met de trein wordt gereisd, is gelijk aan de gemaakte kosten
      van het openbaar vervoer op basis van het tarief van de tweede klasse tot ten hoogste de maximumprijs van een NS-
      jaartrajectkaart tweede klasse.

      3 De vergoeding, bedoeld in het eerste lid, voor zover met ander (aansluitend) openbaar vervoer dan de trein wordt
      gereisd, is gelijk aan de gemaakte kosten van het desbetreffende openbaar vervoer.

      4 De betrokkene die met het openbaar vervoer reist en van de woning of het pension naar de opstaphalte van het
      openbaar vervoer met eigen vervoer meer dan een kilometer reist, dan wel van de uitstaphalte van het openbaar
      vervoer naar de plaats van tewerkstelling met eigen vervoer meer dan een kilometer reist, ontvangt voor dit traject
      dan wel voor beide trajecten een tegemoetkoming, die wordt berekend overeenkomstig de tegemoetkoming op grond
      van [artikel 13, eerste lid][ref2]. In afwijking van het eerste lid komt bij de toepassing van [artikel 12][ref3]
      van het besluit het aansluitend openbaar vervoer anders dan de trein niet voor vergoeding of verstrekking van
      een vervoerbewijs in aanmerking, indien de betrokkene voor beide trajecten kiest voor de tegemoetkoming voor het
      gebruik van eigen vervoer. De keuze voor een tegemoetkoming voor eigen vervoer of voor aansluitend openbaar vervoer
      kan slechts worden gewijzigd bij wijziging van de reisroute of bij een tariefwijziging van het openbaar vervoer.


      [ref1]: https://wetten.overheid.nl/BWBR0004630#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0004633#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0004633#Artikel12
