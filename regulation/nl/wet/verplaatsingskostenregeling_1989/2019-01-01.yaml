  - number: '16'
    text: |-
      1 De aanvraag voor tegemoetkoming in verhuiskosten dient voor de datum van de verhuizing bij het bevoegde gezag te
      zijn ingediend.

      2 Zo spoedig mogelijk na de verhuizing doch in ieder geval binnen zes maanden daarna doet de betrokkene bij het
      bevoegde gezag opgave van de kosten als bedoeld in [artikel 8, eerste lid, onderdeel b, van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004630#Artikel8
