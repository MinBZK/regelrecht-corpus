        bwb_id: BWBR0004630
        artikel: '8'
  - number: '8'
    text: |-
      Het bedrag, bedoeld in [artikel 8, tweede lid, van het besluit][ref1], bedraagt € 5818,46.


      [ref1]: https://wetten.overheid.nl/BWBR0004630#Artikel8
