  - number: '12'
    text: |-
      1 De berekening van de tegemoetkoming, bedoeld in [artikel 12a, eerste lid, van het besluit][ref1], geschiedt per
      maand met behulp van de formule, genoemd in het derde lid, met een maximum van € 400,78 per maand of een evenredig
      deel daarvan bij gemiddeld minder dan 5 reisdagen per week. De in de eerste volzin genoemde berekeningswijze
      wordt slechts toegepast indien de betrokkene ten minste 128 dagen per jaar daadwerkelijk naar dezelfde plaats van
      tewerkstelling reist, dan wel een evenredig deel daarvan voor zover het recht op de tegemoetkoming in de loop van
      het kalenderjaar aanvangt, eindigt of wijzigt, of indien de ambtenaar reist op gemiddeld minder dan vijf dagen per
      week. De tegemoetkoming wordt beëindigd indien een aaneengesloten periode van meer dan zes weken niet wordt gereisd
      en wordt hervat met ingang van de eerste dag van de maand, volgend op die waarop het reizen wordt hervat.

      2 In andere gevallen dan die, genoemd in het eerste lid, tweede volzin, geschiedt de berekening van de
      tegemoetkoming, bedoeld in [artikel 12a, eerste lid van het besluit][ref2], per maand met behulp van de formule,
      genoemd in het vierde lid, met een maximum van € 22,47 per reisdag.

      3 De formule, bedoeld in het eerste lid, luidt:








                    A x 2 x B x C/5 x D





                    12







      4 De formule, bedoeld in het tweede lid, luidt:

      A × 2 × D × E

      5 In de formules, bedoeld in het derde en vierde lid lid, is:

      A: de rekenkundig op een decimaal achter de komma afgeronde enkele reisafstand tussen de woning en de plaats van
      tewerkstelling, berekend met toepassing van het zesde lid;

      B: 214, zijnde het reguliere aantal reisdagen per jaar;

      C: het rekenkundig op twee decimalen achter de komma afgeronde gemiddelde aantal reisdagen per week;

      D: € 0,20, zijnde de tegemoetkoming per kilometer;

      E: het totale aantal daadwerkelijke reisdagen per maand.

      6 De enkele reisafstand tussen de woning en de plaats van tewerkstelling wordt berekend met gebruikmaking van de
      door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties ter beschikking gestelde routeplanner. De afstand
      wordt gemeten met behulp van de postcodes van het begin- en eindpunt. Voor situaties waarin deze voorziening niet
      of niet goed voorziet, beslist het bevoegd gezag over het in aanmerking te nemen aantal kilometers.


      [ref1]: https://wetten.overheid.nl/BWBR0004630#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0004630#Artikel12a
