  - number: 1.1.d.3°
    text: |-
      een ambtenaar van politie als bedoeld in [artikel 2, onder b of c, van die wet][ref1], voor zover hij is aangesteld
      voor de uitvoering van taken op het terrein van de technische recherche, of


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
  - number: 1.1.d.4°
    text: |-
      een militair van de Koninklijke marechaussee als bedoeld in
      [artikel 141, onder c, van het Wetboek van Strafvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '1.2'
    text: |-
      Met een veroordeelde als bedoeld in het eerste lid, onder c, wordt voor de toepassing van deze wet gelijkgesteld
      een persoon die op grond van [artikel 39 van het Wetboek van Strafrecht][ref1] is ontslagen van alle
      rechtsvervolging en aan wie tevens een maatregel als voorzien in [artikel 37][ref2], [37a][ref3] juncto [37b][ref4]
      of [38][ref5], [38m][ref6] of [77s van het Wetboek van Strafrecht][ref7] is opgelegd, alsmede een persoon aan wie
      bij onherroepelijke strafbeschikking een taakstraf is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel37a
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel37b
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel38
      [ref6]: https://wetten.overheid.nl/BWBR0001854#Artikel38m
      [ref7]: https://wetten.overheid.nl/BWBR0001854#Artikel77s
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '39'
      - id: ref2
        bwb_id: BWBR0001854
