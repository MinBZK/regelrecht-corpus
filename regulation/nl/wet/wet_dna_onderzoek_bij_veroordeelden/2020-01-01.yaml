        artikel: '2'
      - id: ref3
        bwb_id: BWBR0017212
        artikel: '8'
  - number: '15'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor veroordeelden wegens
      verschillende misdrijven verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel15
  - number: '16'
    text: 'Deze wet wordt aangehaald als: Wet DNA-onderzoek bij veroordeelden.'
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel16
