        artikel: 38m
      - id: ref7
        bwb_id: BWBR0001854
        artikel: 77s
  - number: '2.1'
    text: |-
      De officier van justitie in het arrondissement waarin de rechtbank is gelegen die in eerste
      aanleg vonnis heeft gewezen, dan wel de officier van justitie die de strafbeschikking
      heeft uitgevaardigd, beveelt dat van een veroordeelde wegens een misdrijf als omschreven in
      [artikel 67, eerste lid, van het Wetboek van Strafvordering][ref1], celmateriaal zal worden afgenomen ten behoeve
      van het bepalen en verwerken van zijn DNA-profiel, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel67
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '67'
  - number: 2.1.a
    text: |-
      van deze persoon reeds een DNA-profiel is verwerkt overeenkomstig het [Wetboek van Strafvordering][ref1] of de
      Algemene verordening gegevensbescherming;


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: 2.1.b
    text: |-
      redelijkerwijs aannemelijk is dat het bepalen en verwerken van zijn DNA-profiel gelet op de aard van het misdrijf
      of de bijzondere omstandigheden waaronder het misdrijf is gepleegd niet van betekenis zal kunnen zijn voor de
      voorkoming, opsporing, vervolging en berechting van strafbare feiten van de veroordeelde.
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel2
  - number: '2.2'
    text: |-
      Indien het DNA-profiel van een persoon dat is verwerkt overeenkomstig het [Wetboek van Strafvordering][ref1],
      zou moeten worden vernietigd, blijft het niettemin verwerkt op grond van het eerste lid, aanhef, indien de
      persoon is veroordeeld wegens een misdrijf als omschreven in [artikel 67, eerste lid, van dat wetboek][ref2] en
      de officier van justitie heeft geoordeeld dat het redelijkerwijs aannemelijk is dat het verwerken van zijn DNA-
      profiel van betekenis kan zijn voor de voorkoming, opsporing, vervolging en berechting van strafbare feiten van
      de veroordeelde. Het bevel van de officier van justitie, bedoeld in het eerste lid, aanhef, blijft in dat geval
      achterwege.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel67
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001903
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '67'
  - number: '2.3'
    text: |-
      Het bevel, de tenuitvoerlegging dan wel de verdere tenuitvoerlegging van het bevel kan achterwege blijven indien
      zich naar het oordeel van de officier van justitie zwaarwegende redenen voordoen het DNA-onderzoek aan ander
      celmateriaal van de veroordeelde dan afgenomen celmateriaal te laten plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel2
  - number: '2.4'
    text: |-
      De officier van justitie die het bevel heeft gegeven, benoemt een deskundige, verbonden aan een van de bij algemene
      maatregel van bestuur aangewezen laboratoria, met de opdracht een DNA-onderzoek te verrichten en hem een met
      redenen omkleed verslag uit te brengen.
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel2
  - number: '2.5'
    text: |-
      De officier van justitie geeft de veroordeelde schriftelijk kennis van de uitslag van het DNA-onderzoek indien zijn
      DNA-profiel overeenkomt met een ander verwerkt DNA-profiel en het belang van het onderzoek dat toelaat.
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel2
  - number: '2.6'
    text: |-
      DNA-profielen worden slechts verwerkt voor de voorkoming, opsporing, vervolging en berechting van strafbare feiten
      en de vaststelling van de identiteit van een lijk. Bij of krachtens algemene maatregel van bestuur worden regels
      gesteld voor het verwerken van DNA-profielen en celmateriaal.
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel2
  - number: '2.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden over de wijze van uitvoering van het derde en vierde lid
      nadere regels gesteld.
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel2
  - number: '3.1'
    text: |-
      Het bevel, bedoeld in [artikel 2, eerste lid, aanhef][ref1], is gedagtekend en ondertekend en bevat de plaats waar
      en de datum en het tijdstip waarop het bevel ten uitvoer zal worden gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0017212#Artikel2
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0017212
        artikel: '2'
  - number: '3.2'
    text: |-
      Het bevel omschrijft het misdrijf waarvoor de betrokken persoon is veroordeeld en vermeldt de strafbeschikking of
      het vonnis of arrest waarbij de veroordeling heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel3
  - number: '3.3'
    text: |-
      Het bevel bevat voorzover mogelijk de naam, voornamen, geboortedatum, geboorteplaats en woon- of verblijfplaats van
      de veroordeelde.
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel3
  - number: '3.4'
    text: |-
      Het bevel vermeldt het rechtsmiddel dat openstaat tegen het bepalen en verwerken van het DNA-profiel van de
      veroordeelde, en de termijn waarbinnen dat rechtsmiddel kan worden aangewend.
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel3
  - number: '3.5'
    text: |-
      Het bevel wordt aan de veroordeelde betekend door uitreiking overeenkomstig
      [artikel 36e, eerste lid, onder b, tweede en derde lid, van het Wetboek van Strafvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel36e
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 36e
  - number: '4.1'
    text: |-
      Indien noodzakelijk voor de tenuitvoerlegging van het bevel, bedoeld in [artikel 2, eerste lid, aanhef][ref1], kan
      de officier van justitie de aanhouding van de veroordeelde bevelen. Het bevel tot aanhouding is schriftelijk en
      bevat de reden van aanhouding. Een afschrift van het bevel wordt de aangehouden veroordeelde onverwijld uitgereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0017212#Artikel2
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0017212
        artikel: '2'
  - number: '4.2'
    text: De aanhouding wordt verricht door een opsporingsambtenaar, die daartoe elke plaats kan betreden en doorzoeken.
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel4
  - number: '4.3'
    text: |-
      Celmateriaal wordt slechts van de aangehouden veroordeelde of de veroordeelde die zich
      meldt voor de tenuitvoerlegging van het bevel, afgenomen, nadat van hem een of meer
      vingerafdrukken overeenkomstig het [Wetboek van Strafvordering][ref1] zijn genomen en
      verwerkt en de opsporingsambtenaar zijn identiteit heeft vastgesteld op de wijze, bedoeld in
      [artikel 27a, eerste lid, eerste volzin, en tweede lid, van het Wetboek van Strafvordering][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001903
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel27a
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001903
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 27a
  - number: '4.4'
    text: |-
      Indien de veroordeelde, bedoeld in het derde lid, ontkent de persoon te zijn tegen wie het bevel is gericht, of
      indien over zijn identiteit twijfel bestaat, is de opsporingsambtenaar bevoegd hem, voor zover dat noodzakelijk
      is voor de vaststelling van zijn identiteit, aan zijn kleding te onderzoeken, alsmede voorwerpen die hij bij
      zich draagt of met zich meevoert te onderzoeken. [Artikel 55b van het Wetboek van Strafvordering][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel55b
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 55b
  - number: '4.5'
    text: |-
      Voor zover noodzakelijk voor de vaststelling van zijn identiteit, kan de aangehouden veroordeelde op bevel van
      de officier van justitie voor ten hoogste zes uren worden opgehouden, met dien verstande dat de tijd tussen
      middernacht en negen uur 's morgens niet wordt meegerekend. Het bevel tot ophouding is schriftelijk en bevat
      de reden van ophouding. Het bevel wijst de aangehouden veroordeelde, aan wie onverwijld een afschrift van het
      bevel wordt uitgereikt, zo duidelijk mogelijk aan. De officier van justitie kan ten aanzien van de opgehouden
      persoon maatregelen ter vaststelling van zijn identiteit bevelen. Als zodanige maatregelen worden aangemerkt de
      maatregelen, bedoeld in [artikel 55c, tweede lid, van het Wetboek van Strafvordering][ref1]. Indien noodzakelijk
      voor de vaststelling van de identiteit van de aangehouden veroordeelde, kan de officier van justitie schriftelijk
      bevelen dat de termijn van zes uren eenmaal met ten hoogste zes uren wordt verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel55c
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 55c
  - number: '4.6'
    text: |-
      Het bevel, bedoeld in [artikel 2, eerste lid, aanhef][ref1], wordt zo spoedig mogelijk na de aanhouding van de
      veroordeelde ten uitvoer gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0017212#Artikel2
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0017212
        artikel: '2'
  - number: '4.7'
    text: |-
      Voor de tenuitvoerlegging van het bevel mag de aangehouden veroordeelde wiens identiteit is vastgesteld, niet
      langer dan zes uren worden opgehouden, met dien verstande dat de tijd tussen middernacht en negen uur 's morgens
      niet wordt meegerekend.
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel4
  - number: '5.1'
    text: |-
      Het bevel, bedoeld in [artikel 2, eerste lid, aanhef][ref1], wordt ten uitvoer gelegd door afname
      van wangslijmvlies. Indien afname van wangslijmvlies om bijzondere geneeskundige redenen of
      vanwege het verzet van de veroordeelde onwenselijk is dan wel geen geschikt celmateriaal oplevert,
      wordt bloed afgenomen of worden haarwortels afgenomen, zo nodig met behulp van de sterke arm
      of, voorzover de veroordeelde in een inrichting of instelling, niet zijnde een accommodatie als
      bedoeld in [artikel 1:1 van de Wet verplichte geestelijke gezondheidszorg][ref2] of als bedoeld in
      __REF002___________________________________________________________________________________________________________
      ____________, verblijft, de functionaris, bedoeld in [artikel 1, onder d, van de Penitentiaire beginselenwet][ref4],
      [artikel 1, onder h, van de Beginselenwet verpleging ter beschikking gestelden][ref5] of
      [artikel 1, onder i, van de Beginselenwet justitiële jeugdinrichtingen][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0017212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0040635#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0040632#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0009709#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0008765#Artikel1
      [ref6]: https://wetten.overheid.nl/BWBR0011756#Artikel1
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0017212
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0040635
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0040632
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0009709
        artikel: '1'
      - id: ref5
