  - number: '2'
    text: |-
      1 De officier van justitie in het arrondissement waarin de rechtbank is gelegen die in
      eerste aanleg vonnis heeft gewezen, dan wel de officier van justitie die de strafbeschikking
      heeft uitgevaardigd, beveelt dat van een veroordeelde wegens een misdrijf als omschreven in
      [artikel 67, eerste lid, van het Wetboek van Strafvordering][ref1], celmateriaal zal worden afgenomen ten behoeve
      van het bepalen en verwerken van zijn DNA-profiel, tenzij:

      a. van deze persoon reeds een DNA-profiel is verwerkt overeenkomstig het [Wetboek van Strafvordering][ref2] of de
      Algemene verordening gegevensbescherming;

      b. redelijkerwijs aannemelijk is dat het bepalen en verwerken van zijn DNA-profiel gelet op de aard van het
      misdrijf of de bijzondere omstandigheden waaronder het misdrijf is gepleegd niet van betekenis zal kunnen zijn voor
      de voorkoming, opsporing, vervolging en berechting van strafbare feiten van de veroordeelde.

      2 Indien het DNA-profiel van een persoon dat is verwerkt overeenkomstig het [Wetboek van Strafvordering][ref3],
      zou moeten worden vernietigd, blijft het niettemin verwerkt op grond van het eerste lid, aanhef, indien de
      persoon is veroordeeld wegens een misdrijf als omschreven in [artikel 67, eerste lid, van dat wetboek][ref4] en
      de officier van justitie heeft geoordeeld dat het redelijkerwijs aannemelijk is dat het verwerken van zijn DNA-
      profiel van betekenis kan zijn voor de voorkoming, opsporing, vervolging en berechting van strafbare feiten van
      de veroordeelde. Het bevel van de officier van justitie, bedoeld in het eerste lid, aanhef, blijft in dat geval
      achterwege.

      3 Het bevel, de tenuitvoerlegging dan wel de verdere tenuitvoerlegging van het bevel kan achterwege blijven indien
      zich naar het oordeel van de officier van justitie zwaarwegende redenen voordoen het DNA-onderzoek aan ander
      celmateriaal van de veroordeelde dan afgenomen celmateriaal te laten plaatsvinden.

      4 De officier van justitie die het bevel heeft gegeven, benoemt een deskundige, verbonden aan een van de bij
      algemene maatregel van bestuur aangewezen laboratoria, met de opdracht een DNA-onderzoek te verrichten en hem een
      met redenen omkleed verslag uit te brengen.

      5 De officier van justitie geeft de veroordeelde schriftelijk kennis van de uitslag van het DNA-onderzoek indien
      zijn DNA-profiel overeenkomt met een ander verwerkt DNA-profiel en het belang van het onderzoek dat toelaat.

      6 DNA-profielen worden slechts verwerkt voor de voorkoming, opsporing, vervolging en berechting van strafbare
      feiten en de vaststelling van de identiteit van een lijk. Bij of krachtens algemene maatregel van bestuur worden
      regels gesteld voor het verwerken van DNA-profielen en celmateriaal.

      7 Bij of krachtens algemene maatregel van bestuur worden over de wijze van uitvoering van het derde en vierde lid
      nadere regels gesteld.


