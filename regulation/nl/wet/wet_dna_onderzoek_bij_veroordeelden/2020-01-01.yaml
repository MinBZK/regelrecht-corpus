preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is te regelen dat DNA-onderzoek plaatsvindt bij personen
    die zijn veroordeeld wegens bepaalde misdrijven, teneinde bij te dragen aan de voorkoming, opsporing, vervolging en
    berechting van strafbare feiten van deze personen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel1
  - number: 1.1.a
    text: 'DNA-onderzoek: onderzoek van celmateriaal dat slechts is gericht op het vergelijken van DNA-profielen;'
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel1
  - number: 1.1.b
    text: |-
      verwerking: hetgeen daaronder wordt verstaan in artikel 4, aanhef en onder 2, van de Algemene verordening
      gegevensbescherming;
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel1
  - number: 1.1.c
    text: |-
      veroordeelde: een persoon die al dan niet onherroepelijk is veroordeeld tot een straf als bedoeld in
      [artikel 9, eerste lid, onder a, onderdeel 1° of 3°, van het Wetboek van Strafrecht][ref1], een straf als
      bedoeld in [artikel 77h, eerste lid, onder a, van dat wetboek][ref2], voorzover het de jeugddetentie of taakstraf
      betreft, of een straf als bedoeld in [artikel 6, onder a, van het Wetboek van Militair Strafrecht][ref3] dan wel
      tot een maatregel als bedoeld in [artikel 37][ref4], [37a][ref5] juncto [37b][ref6] of [38][ref7], [38m][ref8] of
      [77s van het Wetboek van Strafrecht][ref9];


