  - number: 1.1.d.2°
    text: |-
      een ambtenaar van politie als bedoeld in [artikel 2, onder c, van die wet][ref1], voor zover hij is aangesteld voor
      de uitvoering van de politietaak;


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel1
