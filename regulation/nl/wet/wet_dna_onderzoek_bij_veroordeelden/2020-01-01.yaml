        artikel: '1'
      - id: ref6
        bwb_id: BWBR0011756
        artikel: '1'
  - number: '5.2'
    text: |-
      Het celmateriaal wordt door een arts of een verpleegkundige afgenomen. In bij algemene maatregel van bestuur te
      bepalen gevallen kan het celmateriaal worden afgenomen door een persoon die voldoet aan bij of krachtens algemene
      maatregel van bestuur te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel5
  - number: '5.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden over de wijze van uitvoering van dit artikel nadere regels
      gesteld.
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel5
  - number: '6.1'
    text: |-
      Indien de officier van justitie oordeelt dat zich zwaarwegende redenen voordoen om het DNA-onderzoek
      aan ander celmateriaal van de veroordeelde dan afgenomen celmateriaal te laten plaatsvinden, kan hij een
      opsporingsambtenaar of de functionaris, bedoeld in [artikel 1, onder d, van de Penitentiaire beginselenwet][ref1],
      [artikel 1, onder g, van de Beginselenwet verpleging ter beschikking gestelden][ref2] of
      [artikel 1, onder i, van de Beginselenwet justitiële jeugdinrichtingen][ref3], opdragen voorwerpen in beslag te
      nemen waarop vermoedelijk celmateriaal van de veroordeelde aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008765#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0011756#Artikel1
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0008765
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0011756
        artikel: '1'
  - number: '6.2'
    text: |-
      Voorzover noodzakelijk voor de inbeslagneming van voorwerpen waarop vermoedelijk celmateriaal van de veroordeelde
      aanwezig is, kan de officier van justitie de woning van de veroordeelde zonder toestemming van de bewoner
      betreden en doorzoeken. [Artikel 99, eerste lid, van het Wetboek van Strafvordering][ref1] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel99
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '99'
  - number: '6.3'
    text: |-
      Zodra voor het bepalen en verwerken van het DNA-profiel van de veroordeelde voldoende celmateriaal
      in beslag is genomen, deelt de officier van justitie dit schriftelijk aan de veroordeelde
      mee. Deze mededeling wordt aan de veroordeelde betekend door uitreiking overeenkomstig
      [artikel 36e, eerste lid, onder b, tweede en derde lid, van het Wetboek van Strafvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel36e
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 36e
  - number: '6.4'
    text: |-
      Zodra het DNA-onderzoek is verricht, doet de officier van justitie de in beslag genomen voorwerpen teruggeven aan
      degene bij wie ze in beslag zijn genomen.
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel6
  - number: '7.1'
    text: |-
      De veroordeelde kan tegen het bepalen en verwerken van zijn DNA-profiel, binnen veertien dagen na de
      dag waarop zijn celmateriaal is afgenomen onderscheidenlijk de dag waarop de mededeling, bedoeld in
      [artikel 6, derde lid][ref1], is betekend, een bezwaarschrift indienen bij de rechtbank die in eerste aanleg
      vonnis heeft gewezen, dan wel de rechtbank in het arrondissement waar tegen de strafbeschikking verzet had kunnen
      worden gedaan. De [zesde afdeling van Titel I van het Eerste Boek van het Wetboek van Strafvordering][ref2] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017212#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001903#AfdelingZesde
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017212
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0001903
        afdeling: Zesde
  - number: '7.2'
    text: Het bezwaarschrift is met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel7
  - number: '7.3'
    text: De rechtbank beslist zo spoedig mogelijk.
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel7
  - number: '7.4'
    text: |-
      Zolang tegen het bepalen en verwerken van zijn DNA-profiel een bezwaarschrift kan worden ingediend en zolang een
      ingediend bezwaarschrift niet is ingetrokken of daarop niet is beslist, wordt op basis van het celmateriaal van de
      veroordeelde geen DNA-profiel bepaald.
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel7
  - number: '7.5'
    text: |-
      Indien de rechtbank het bezwaarschrift gegrond verklaart, beveelt zij de officier van justitie ervoor zorg te
      dragen dat het celmateriaal van de veroordeelde terstond wordt vernietigd.
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel7
  - number: '8.1'
    text: |-
      Deze wet is van toepassing op personen die op het tijdstip van inwerkingtreding van deze wet reeds zijn
      veroordeeld tot een vrijheidsbenemende straf als bedoeld in [artikel 9, eerste lid, onder a, onderdeel 1°][ref1],
      of [77h, eerste lid, onder a, van het Wetboek van Strafrecht][ref2] of
      [artikel 6, onder a, van het Wetboek van Militair Strafrecht][ref3] dan wel een vrijheidsbenemende
      maatregel als bedoeld in [artikel 37][ref4], [37a][ref5] juncto [37b][ref6], [38m][ref7] of
      [77s van het Wetboek van Strafrecht][ref8], tenzij zij deze straf of maatregel op dat tijdstip hebben ondergaan
      of in verband met het misdrijf waarvoor deze straf of maatregel bij onherroepelijke veroordeling is opgelegd,
      voorlopige hechtenis hebben ondergaan waarvan de duur ten minste gelijk is aan de duur van deze straf of maatregel.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel77h
      [ref3]: https://wetten.overheid.nl/BWBR0001869#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel37
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel37a
      [ref6]: https://wetten.overheid.nl/BWBR0001854#Artikel37b
      [ref7]: https://wetten.overheid.nl/BWBR0001854#Artikel38m
      [ref8]: https://wetten.overheid.nl/BWBR0001854#Artikel77s
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel8
    references:
      - id: ref1
