  - number: '6'
    text: |-
      1 Indien de officier van justitie oordeelt dat zich zwaarwegende redenen voordoen om het DNA-onderzoek
      aan ander celmateriaal van de veroordeelde dan afgenomen celmateriaal te laten plaatsvinden, kan hij een
      opsporingsambtenaar of de functionaris, bedoeld in [artikel 1, onder d, van de Penitentiaire beginselenwet][ref1],
      [artikel 1, onder g, van de Beginselenwet verpleging ter beschikking gestelden][ref2] of
      [artikel 1, onder i, van de Beginselenwet justitiële jeugdinrichtingen][ref3], opdragen voorwerpen in beslag te
      nemen waarop vermoedelijk celmateriaal van de veroordeelde aanwezig is.

      2 Voorzover noodzakelijk voor de inbeslagneming van voorwerpen waarop vermoedelijk celmateriaal van de veroordeelde
      aanwezig is, kan de officier van justitie de woning van de veroordeelde zonder toestemming van de bewoner
      betreden en doorzoeken. [Artikel 99, eerste lid, van het Wetboek van Strafvordering][ref4] is van overeenkomstige
      toepassing.

      3 Zodra voor het bepalen en verwerken van het DNA-profiel van de veroordeelde voldoende
      celmateriaal in beslag is genomen, deelt de officier van justitie dit schriftelijk aan de
      veroordeelde mee. Deze mededeling wordt aan de veroordeelde betekend door uitreiking overeenkomstig
      [artikel 36e, eerste lid, onder b, tweede en derde lid, van het Wetboek van Strafvordering][ref5].

      4 Zodra het DNA-onderzoek is verricht, doet de officier van justitie de in beslag genomen voorwerpen teruggeven aan
      degene bij wie ze in beslag zijn genomen.


