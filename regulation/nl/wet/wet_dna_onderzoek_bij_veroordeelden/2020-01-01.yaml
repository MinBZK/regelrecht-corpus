  - number: '4'
    text: |-
      1 Indien noodzakelijk voor de tenuitvoerlegging van het bevel, bedoeld in [artikel 2, eerste lid, aanhef][ref1],
      kan de officier van justitie de aanhouding van de veroordeelde bevelen. Het bevel tot aanhouding is schriftelijk en
      bevat de reden van aanhouding. Een afschrift van het bevel wordt de aangehouden veroordeelde onverwijld uitgereikt.

      2 De aanhouding wordt verricht door een opsporingsambtenaar, die daartoe elke plaats kan betreden en doorzoeken.

      3 Celmateriaal wordt slechts van de aangehouden veroordeelde of de veroordeelde die
      zich meldt voor de tenuitvoerlegging van het bevel, afgenomen, nadat van hem een of meer
      vingerafdrukken overeenkomstig het [Wetboek van Strafvordering][ref2] zijn genomen en
      verwerkt en de opsporingsambtenaar zijn identiteit heeft vastgesteld op de wijze, bedoeld in
      [artikel 27a, eerste lid, eerste volzin, en tweede lid, van het Wetboek van Strafvordering][ref3].

      4 Indien de veroordeelde, bedoeld in het derde lid, ontkent de persoon te zijn tegen wie het bevel is gericht, of
      indien over zijn identiteit twijfel bestaat, is de opsporingsambtenaar bevoegd hem, voor zover dat noodzakelijk
      is voor de vaststelling van zijn identiteit, aan zijn kleding te onderzoeken, alsmede voorwerpen die hij bij
      zich draagt of met zich meevoert te onderzoeken. [Artikel 55b van het Wetboek van Strafvordering][ref4] is van
      overeenkomstige toepassing.

      5 Voor zover noodzakelijk voor de vaststelling van zijn identiteit, kan de aangehouden veroordeelde op bevel
      van de officier van justitie voor ten hoogste zes uren worden opgehouden, met dien verstande dat de tijd tussen
      middernacht en negen uur 's morgens niet wordt meegerekend. Het bevel tot ophouding is schriftelijk en bevat
      de reden van ophouding. Het bevel wijst de aangehouden veroordeelde, aan wie onverwijld een afschrift van het
      bevel wordt uitgereikt, zo duidelijk mogelijk aan. De officier van justitie kan ten aanzien van de opgehouden
      persoon maatregelen ter vaststelling van zijn identiteit bevelen. Als zodanige maatregelen worden aangemerkt de
      maatregelen, bedoeld in [artikel 55c, tweede lid, van het Wetboek van Strafvordering][ref5]. Indien noodzakelijk
      voor de vaststelling van de identiteit van de aangehouden veroordeelde, kan de officier van justitie schriftelijk
      bevelen dat de termijn van zes uren eenmaal met ten hoogste zes uren wordt verlengd.

      6 Het bevel, bedoeld in [artikel 2, eerste lid, aanhef][ref6], wordt zo spoedig mogelijk na de aanhouding van de
      veroordeelde ten uitvoer gelegd.

      7 Voor de tenuitvoerlegging van het bevel mag de aangehouden veroordeelde wiens identiteit is vastgesteld, niet
      langer dan zes uren worden opgehouden, met dien verstande dat de tijd tussen middernacht en negen uur 's morgens
      niet wordt meegerekend.


