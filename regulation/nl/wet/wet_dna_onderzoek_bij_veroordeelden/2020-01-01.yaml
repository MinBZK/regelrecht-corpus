  - number: '5'
    text: |-
      1 Het bevel, bedoeld in [artikel 2, eerste lid, aanhef][ref1], wordt ten uitvoer gelegd door
      afname van wangslijmvlies. Indien afname van wangslijmvlies om bijzondere geneeskundige redenen of
      vanwege het verzet van de veroordeelde onwenselijk is dan wel geen geschikt celmateriaal oplevert,
      wordt bloed afgenomen of worden haarwortels afgenomen, zo nodig met behulp van de sterke arm
      of, voorzover de veroordeelde in een inrichting of instelling, niet zijnde een accommodatie als
      bedoeld in [artikel 1:1 van de Wet verplichte geestelijke gezondheidszorg][ref2] of als bedoeld in
      __REF002___________________________________________________________________________________________________________
      ____________, verblijft, de functionaris, bedoeld in [artikel 1, onder d, van de Penitentiaire beginselenwet][ref4],
      [artikel 1, onder h, van de Beginselenwet verpleging ter beschikking gestelden][ref5] of
      [artikel 1, onder i, van de Beginselenwet justitiële jeugdinrichtingen][ref6].

      2 Het celmateriaal wordt door een arts of een verpleegkundige afgenomen. In bij algemene maatregel van bestuur te
      bepalen gevallen kan het celmateriaal worden afgenomen door een persoon die voldoet aan bij of krachtens algemene
      maatregel van bestuur te stellen eisen.

      3 Bij of krachtens algemene maatregel van bestuur worden over de wijze van uitvoering van dit artikel nadere regels
      gesteld.


