  - number: '13'
    text: |-
      DNA-profielen van veroordeelden die voor de inwerkingtreding van deze wet op grond van
      [artikel 23, eerste lid, onder a, van de Wet bescherming persoonsgegevens][ref1] zijn verwerkt, worden geacht te
      zijn verwerkt op grond van [artikel 2, eerste lid, aanhef][ref2], voorzover deze veroordeelden op het tijdstip van
      inwerkingtreding van deze wet een straf of maatregel als bedoeld in [artikel 8][ref3] ondergaan.


