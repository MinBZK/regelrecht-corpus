  - number: '8.2'
    text: |-
      Deze wet is voorts van toepassing op personen die op het tijdstip van inwerkingtreding van deze wet ingevolge
      [artikel 38c van het Wetboek van Strafrecht][ref1] of [artikel 6:6:10 van het Wetboek van Strafvordering][ref2]
      alsnog van overheidswege worden verpleegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel38c
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 38c
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '6'
  - number: '8.3'
    text: |-
      Voor de toepassing van het eerste lid wordt onder de duur van de voorlopige hechtenis begrepen de duur van de
      inverzekeringstelling.
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel8
  - number: '13'
    text: |-
      DNA-profielen van veroordeelden die voor de inwerkingtreding van deze wet op grond van
      [artikel 23, eerste lid, onder a, van de Wet bescherming persoonsgegevens][ref1] zijn verwerkt, worden geacht te
      zijn verwerkt op grond van [artikel 2, eerste lid, aanhef][ref2], voorzover deze veroordeelden op het tijdstip van
      inwerkingtreding van deze wet een straf of maatregel als bedoeld in [artikel 8][ref3] ondergaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0017212#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0017212#Artikel8
    url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#Artikel13
    references:
      - id: ref1
