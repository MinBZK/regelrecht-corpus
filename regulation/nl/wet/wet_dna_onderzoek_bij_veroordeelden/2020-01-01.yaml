preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is te regelen dat DNA-onderzoek plaatsvindt bij personen
    die zijn veroordeeld wegens bepaalde misdrijven, teneinde bij te dragen aan de voorkoming, opsporing, vervolging en
    berechting van strafbare feiten van deze personen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0017212/2020-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet wordt verstaan onder:

      a. DNA-onderzoek: onderzoek van celmateriaal dat slechts is gericht op het vergelijken van DNA-profielen;

      b. verwerking: hetgeen daaronder wordt verstaan in artikel 4, aanhef en onder 2, van de Algemene verordening
      gegevensbescherming;

      c. veroordeelde: een persoon die al dan niet onherroepelijk is veroordeeld tot een straf als bedoeld in
      [artikel 9, eerste lid, onder a, onderdeel 1° of 3°, van het Wetboek van Strafrecht][ref1], een straf als
      bedoeld in [artikel 77h, eerste lid, onder a, van dat wetboek][ref2], voorzover het de jeugddetentie of taakstraf
      betreft, of een straf als bedoeld in [artikel 6, onder a, van het Wetboek van Militair Strafrecht][ref3] dan wel
      tot een maatregel als bedoeld in [artikel 37][ref4], [37a][ref5] juncto [37b][ref6] of [38][ref7], [38m][ref8] of
      [77s van het Wetboek van Strafrecht][ref9];

      d. opsporingsambtenaar:

      1°. een ambtenaar van politie als bedoeld in [artikel 2, onder a, van de Politiewet 2012][ref10];

      2°. een ambtenaar van politie als bedoeld in [artikel 2, onder c, van die wet][ref11], voor zover hij is aangesteld
      voor de uitvoering van de politietaak;

      3°. een ambtenaar van politie als bedoeld in [artikel 2, onder b of c, van die wet][ref12], voor zover hij is
      aangesteld voor de uitvoering van taken op het terrein van de technische recherche, of

      4°. een militair van de Koninklijke marechaussee als bedoeld in
      [artikel 141, onder c, van het Wetboek van Strafvordering][ref13].

      2 Met een veroordeelde als bedoeld in het eerste lid, onder c, wordt voor de toepassing van deze wet
      gelijkgesteld een persoon die op grond van [artikel 39 van het Wetboek van Strafrecht][ref14] is ontslagen van
      alle rechtsvervolging en aan wie tevens een maatregel als voorzien in [artikel 37][ref15], [37a][ref16] juncto
      [37b][ref17] of [38][ref18], [38m][ref19] of [77s van het Wetboek van Strafrecht][ref20] is opgelegd, alsmede een
      persoon aan wie bij onherroepelijke strafbeschikking een taakstraf is opgelegd.


