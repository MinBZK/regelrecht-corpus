  - number: '3'
    text: |-
      1 Het bevel, bedoeld in [artikel 2, eerste lid, aanhef][ref1], is gedagtekend en ondertekend en bevat de plaats
      waar en de datum en het tijdstip waarop het bevel ten uitvoer zal worden gelegd.

      2 Het bevel omschrijft het misdrijf waarvoor de betrokken persoon is veroordeeld en vermeldt de strafbeschikking of
      het vonnis of arrest waarbij de veroordeling heeft plaatsgevonden.

      3 Het bevel bevat voorzover mogelijk de naam, voornamen, geboortedatum, geboorteplaats en woon- of verblijfplaats
      van de veroordeelde.

      4 Het bevel vermeldt het rechtsmiddel dat openstaat tegen het bepalen en verwerken van het DNA-profiel van de
      veroordeelde, en de termijn waarbinnen dat rechtsmiddel kan worden aangewend.

      5 Het bevel wordt aan de veroordeelde betekend door uitreiking overeenkomstig
      [artikel 36e, eerste lid, onder b, tweede en derde lid, van het Wetboek van Strafvordering][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel36e
