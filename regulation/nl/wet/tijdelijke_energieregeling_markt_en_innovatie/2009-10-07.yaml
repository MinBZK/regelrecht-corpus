  - number: '2.2'
    text: |-
      1 De Minister verstrekt op aanvraag een subsidie voor een duurzame warmtemaatregel aan:

      a. een eigenaar-bewoner van een bestaande woning, of

      b. een eigenaar-verhuurder van een bestaande woning, die een duurzame warmtemaatregel uitvoert.

      2 Op een subsidie voor een duurzame warmtemaatregel zijn niet van toepassing

        - [artikel 1.7, onderdeel b][ref1], van deze regeling en
        - de [artikelen 10, tweede lid][ref2], [11 tot en met 14][ref3], [23, onderdeel d][ref4], en
      [36 tot en met 42 van het Kaderbesluit EZ-subsidies][ref5].

      3 In afwijking van [artikel 45 tot en met 47 van het Kaderbesluit EZ-subsidies][ref6] wordt geen voorschot
      verstrekt bij een aanvraag om subsidie met een totaalbedrag van minder dan € 50.000.


