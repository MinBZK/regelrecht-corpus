  - number: '7.3'
    text: |-
      Voor subsidie komen in aanmerking de rechtstreeks aan de technische maatregelen, bedoeld in
      [artikel 7.2, onderdeel b][ref1], toe te rekenen gemaakte en betaalde kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0024452#Artikel7.2
    url: https://wetten.overheid.nl/BWBR0024452/2009-10-07#Artikel7.3
