articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *Minister:* de Minister van Economische Zaken;
        - *ondernemer in de landbouwsector:* een ondernemer die activiteiten verricht op het gebied van de productie,
      verwerking en afzet van landbouwproducten als bedoeld in bijlage 1 bij het Verdrag tot oprichting van de Europese
      Gemeenschap, met uitzondering van ondernemers in de visserij- en aquacultuursector en in de bosbouwsector;
        - *referentiekosten:* kosten voor een investering ten behoeve van een in Nederland gangbaar systeem, apparaat of
      techniek die in technisch opzicht vergelijkbaar is met een in Nederland uit te voeren project maar waarmee niet
      hetzelfde niveau van milieubescherming kan worden bereikt als met het uit te voeren project, terwijl, in geval van
      een uit te voeren project voor hernieuwbare energie, de capaciteit voor de opwekking van energie van dat project
      ten minste overeenkomt met die van de eerstbedoelde investering.
    url: https://wetten.overheid.nl/BWBR0024452/2009-10-07#Artikel1.1
  - number: '1.2'
    text: |-
      Op subsidies op grond van deze regeling zijn de bepalingen van het [Kaderbesluit EZ-subsidies][ref1] van
      overeenkomstige toepassing, met uitzondering van de [artikelen 5][ref2] en [9][ref3] en andere bepalingen voor
      zover deze in de volgende hoofdstukken buiten toepassing worden verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0024796#Artikel9
    url: https://wetten.overheid.nl/BWBR0024452/2009-10-07#Artikel1.2
    references:
      - id: ref1
