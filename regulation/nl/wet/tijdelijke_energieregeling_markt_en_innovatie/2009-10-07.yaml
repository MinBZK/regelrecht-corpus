        bwb_id: BWBR0024796
        artikel: '9'
  - number: '1.3'
    text: |-
      1 De subsidie bedraagt voor zover activiteiten vallen onder [bijlage 1][ref1], het percentage van de subsidiabele
      kosten zoals aangegeven in de bijlage, tenzij is aangegeven dat:

      a. de subsidie valt onder een de-minimis verordening,

      b. de subsidie aangemerkt wordt als steun als bedoeld in deel 6 van de algemene groepsvrijstellingsverordening of

      c. de subsidie geen steun is in de zin van artikel 87 en 88 van het EG-verdrag.

      2 Indien de hoogte van de subsidie volgt uit de bijlage en verschillende percentages van toepassing zijn, bedraagt
      de subsidie het gewogen gemiddelde van deze percentages.


      [ref1]: https://wetten.overheid.nl/BWBR0024452
    url: https://wetten.overheid.nl/BWBR0024452/2009-10-07#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0024452
  - number: '1.4'
    text: |-
      1 Het rapport van feitelijke bevindingen, bedoeld in
      [artikel 12, derde lid, van het Kaderbesluit EZ-subsidies][ref1], wordt opgesteld overeenkomstig het protocol dat
      is opgenomen in [bijlage 2][ref2].

      2 Als rapport als bedoeld in [artikel 12, vierde lid, van het Kaderbesluit EZ-subsidies][ref3], wordt aangewezen
      een afschrift van het rapport van feitelijke bevindingen van een externe accountant inzake de actueel gebruikte
      methode voor berekening van de personeelskosten en indirecte kosten dat is opgesteld in het kader van verordening
      (EG) nr. 1906/2006 van het Europees Parlement en de Raad van de Europese Unie van 18 december 2006 tot vaststelling
      van de regels voor de deelname van ondernemingen, onderzoekscentra en universiteiten aan acties op grond van
      het zevende kaderprogramma, en voor verspreiding van onderzoeksresultaten (2007–2013) (PbEU L 391) en, indien de
      subsidie-ontvanger daarover beschikt, een afschrift van de goedkeuring door de Europese Commissie van dat rapport.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0024452
      [ref3]: https://wetten.overheid.nl/BWBR0024796#Artikel12
