  - number: '2.5'
    text: De Minister verdeelt het beschikbare bedrag in de volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0024452/2009-10-07#Artikel2.5
  - number: '2.6'
    text: |-
      In aanvulling op [artikel 23 van het Kaderbesluit EZ-subsidies][ref1] beslist de Minister afwijzend op een aanvraag
      om subsidie indien:

      a. hij het onaannemelijk acht dat de aanvrager binnen zes maanden opdracht zal geven tot uitvoering van de duurzame
      warmtemaatregel;

      b. de aanvrager vóór 1 september 2008 ter zake van de duurzame warmtemaatregel waarop de aanvraag betrekking heeft,
      verplichtingen is aangegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0024452/2009-10-07#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: '2.7'
    text: |-
      De subsidie-ontvanger geeft binnen zes maanden na de datum van de beschikking tot subsidieverlening opdracht tot
      uitvoering van de duurzame warmtemaatregel.
    url: https://wetten.overheid.nl/BWBR0024452/2009-10-07#Artikel2.7
  - number: '2.8'
    text: |-
      1 Indien de subsidie-ontvanger een eigenaar-bewoner is, voltooit deze de duurzame warmtemaatregel uiterlijk twaalf
      maanden na de datum van de beschikking tot subsidieverlening.

      2 Indien de subsidie-ontvanger een eigenaar-verhuurder is, voltooit deze de duurzame warmtemaatregel uiterlijk
      achttien maanden na de datum van de beschikking tot subsidieverlening.

      3 De subsidie-ontvanger dient zijn aanvraag om subsidievaststelling in uiterlijk dertien weken na het tijdstip
      waarop de activiteiten zijn voltooid.
    url: https://wetten.overheid.nl/BWBR0024452/2009-10-07#Artikel2.8
  - number: '2.9'
    text: |-
      Een aanvraag om subsidie en een aanvraag om subsidievaststelling wordt ingediend met gebruikmaking van het
      formulier, opgenomen in [bijlage 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024452
    url: https://wetten.overheid.nl/BWBR0024452/2009-10-07#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0024452
  - number: '3.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - duurzame warmte of koude: de nettoproductie van warmte of koude uit hernieuwbare primaire energiedragers;
        - restwarmte of -koude: warmte of koude die in de huidige situatie beschikbaar is, maar niet nuttig gebruikt wordt,
      niet zijnde duurzame warmte of koude;
        - unieke kansen warmte/koudeproject: een voor Nederland nieuw planmatig geheel van activiteiten gericht op het
      in de praktijk beproeven van een systeem voor benutting van duurzame warmte of duurzame koude of restwarmte
      of restkoude, dat wordt uitgevoerd door een samenwerkingsverband, waarbij bij tenminste een van de deelnemers
      technische of beheersmatige voorzieningen worden getroffen.
    url: https://wetten.overheid.nl/BWBR0024452/2009-10-07#Artikel3.1
  - number: '3.2'
    text: |-
      1 De Minister verstrekt op aanvraag een subsidie voor een unieke kansen warmte/koudeproject dat past in een of meer
      warmte/koudethema’s en waarin:

      a. nieuwe technieken worden toegepast;

      b. nieuwe combinaties van bestaande technieken worden toegepast;

      c. nieuwe organisatievormen van warmte- en koudebenutting worden toegepast;

      d. nieuwe combinaties van aanbieders en afnemers worden gemaakt.

      2 Warmte/koudethema’s als bedoeld in het eerste lid zijn:

      a. duurzame warmte of koude uit bio-energie;

      b. aardwarmte;

      c. grootschalige zonthermische energie;

      d. benutting van duurzame warmte of koude in de gebouwde omgeving op wijkniveau of in bedrijven;

      e. benutting van restwarmte of -koude in de gebouwde omgeving op wijkniveau of in bedrijven.

      3 In het samenwerkingsverband dat een unieke kansen warmte/koudeproject uitvoert wordt actief samengewerkt en zijn
      meerdere disciplines vertegenwoordigd.
    url: https://wetten.overheid.nl/BWBR0024452/2009-10-07#Artikel3.2
  - number: '3.3'
    text: |-
      Op een subsidie voor een unieke kansen warmte/koudeproject zijn niet van toepassing de
      [artikelen 10, derde lid][ref1], [23, onderdeel g][ref2], [38, eerste lid, onderdeel b tot en met d][ref3] en
      [41 van het Kaderbesluit EZ-subsidies][ref4].


