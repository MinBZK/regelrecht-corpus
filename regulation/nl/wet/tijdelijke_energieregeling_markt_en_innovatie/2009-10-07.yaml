  - number: '6.8'
    text: |-
      1 Een aanvraag om subsidie wordt ingediend met gebruikmaking van het formulier, opgenomen in [bijlage 14][ref1].

      2 Een aanvraag om subsidievaststelling wordt ingediend met gebruikmaking van het formulier, opgenomen in
