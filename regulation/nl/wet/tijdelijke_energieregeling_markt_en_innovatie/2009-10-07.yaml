  - number: '4.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - *een EOS-demonstratieproject:* een voor Nederland nieuw, planmatig geheel van activiteiten, geheel of nagenoeg
      geheel bestemd voor het vergroten van inzicht in de geschiktheid voor toepassing in de praktijk van duurzame
      energiehuishouding, dat een technisch of economisch risico inhoudt en dat bestaat uit: – energiebesparende
      maatregelen; – maatregelen waarbij CO-emissies worden afgevangen en permanent in de ondergrond opgeslagen, of –
      maatregelen die het gebruik van hernieuwbare energiebronnen bevorderen met behulp van: • voor Nederland nieuwe
      apparaten, systemen of technieken, of • een voor Nederland nieuwe toepassing van apparaten, systemen of technieken.
    url: https://wetten.overheid.nl/BWBR0024452/2009-10-07#Artikel4.1
  - number: '4.2'
    text: |-
      1 De Minister verstrekt op aanvraag een subsidie voor een EOS-demonstratieproject dat past in een of meerdere
      energiethema’s en waarin:

      a. nieuwe technieken worden toegepast; of

      b. nieuwe combinaties van bestaande technieken worden toegepast.

      2 Energiethema’s als bedoeld in het eerste lid zijn:

      a. biomassa;

      b. nieuw gas/schoon fossiel en efficiënt gebruik van gas;

      c. energie-efficiëntie in de industriële en landbouwsector;

      d. gebouwde omgeving;

      e. opwekking en netten.
    url: https://wetten.overheid.nl/BWBR0024452/2009-10-07#Artikel4.2
  - number: '4.3'
    text: |-
