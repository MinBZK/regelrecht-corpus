    text: |-
      Het subsidieplafond voor het verlenen van subsidies op aanvragen om subsidie voor unieke kansen warmte/
      koudeproject, ontvangen in de periode van de datum van inwerkingtreding van deze regeling tot en met 1 december
      2008, 17:00 uur, bedraagt € 10.000.000.
    url: https://wetten.overheid.nl/BWBR0024452/2009-10-07#Artikel3.5
  - number: '3.6'
    text: De Minister verdeelt het beschikbare bedrag op volgorde van rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0024452/2009-10-07#Artikel3.6
  - number: '3.7'
    text: |-
      1 De Adviescommissie energiedemonstratieprojecten en energietransitie-experimenten
      adviseert de Minister over de afwijzingsgronden, bedoeld in het tweede lid en
      [artikel 23, onderdelen e, f en h van het Kaderbesluit EZ-subsidies][ref1], en de rangschikkingscriteria, bedoeld
      in het derde lid.

      2 In aanvulling op [artikel 23 van het Kaderbesluit EZ-subsidies][ref2] beslist de Minister afwijzend op een
      aanvraag om subsidie indien hij van oordeel is dat:

      a. het project onvoldoende bijdraagt aan de doelstellingen van de regeling;

      b. van de sociaal-wetenschappelijke en economische effecten van het project onvoldoende blijk wordt gegeven.

      3 De Minister rangschikt de aanvragen waarop niet afwijzend is beslist, hoger naarmate:

      a. het project technologisch en niet-technologisch innovatiever is ten opzichte van de huidige praktijk in
      Nederland;

      b. het project meer bijdraagt aan de verduurzaming van de energiehuishouding in CO reductie of PJ per jaar op
      projectniveau;

      c. het project meer herhalingspotentieel bezit, gebaseerd op kostprijsontwikkeling en marktverwachting;

      d. het samenwerkingsverband van een betere kwaliteit is en de slaagkans van het project groter is.

      4 Voor de rangschikking weegt het criterium genoemd in het derde lid, onderdeel a, dubbel ten opzichte van elk van
      de criteria, genoemd in het derde lid, onderdeel b tot en met d.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel23
