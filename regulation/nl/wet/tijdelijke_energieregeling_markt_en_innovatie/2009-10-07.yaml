  - number: '2.3'
    text: |-
      1 De hoogte van de subsidie voor zonneboilers, warmtepompen, niet zijnde lucht/waterwarmtepompen, en lucht/
      waterwarmtepompen wordt berekend door het aantal GJ of kW te bepalen volgens de methode, opgenomen in
      [bijlage 4][ref1], en dit getal te vermenigvuldigen met het bedrag, opgenomen in [bijlage 5][ref2].

      2 De hoogte van de subsidie voor zonneboilers die naast een bijdrage aan warm tapwater ook een bijdrage leveren aan
      de ruimteverwarming, wordt gebaseerd op de bijdrage aan warm tapwater.

      3 De subsidie voor een installatie voor micro-warmtekrachtkoppeling bedraagt € 4.000 per stuk.

      4 Bij subsidie aan een ondernemer waar een Europees steunkader op van toepassing is, bedraagt de subsidie niet meer
      dan is toegestaan op basis van dat steunkader.


      [ref1]: https://wetten.overheid.nl/BWBR0024452
