    text: |-
      1 De subsidie bedraagt 40 procent van de subsidiabele kosten, maar niet meer dan € 800.000 per aanvraag.

      2 Het in het eerste lid genoemde percentage wordt met 10 procentpunten verhoogd voor iedere aanvrager die een
      kleine of middelgrote onderneming in stand houdt voor zover de subsidiabele kosten worden gemaakt en betaald door
      die ondernemer.

      3 Indien de subsidie-ontvanger een ondernemer in de landbouwsector is en een kleine of middelgrote onderneming
      in stand houdt, is de verhoging, bedoeld in het tweede lid, niet van toepassing voor zover de subsidiabele kosten
      betrekking hebben op investeringen waardoor de productiecapaciteit zal toenemen.

      4 Het te verlenen subsidiebedrag, tot stand gekomen met toepassing van het eerste en tweede lid, is niet meer dan
      de maximaal toegestane investeringssteun, berekend op de voet van de Communautaire kaderregeling inzake staatssteun
      ten behoeve van het milieu (PbEG 2008, C82).

      5 Voor de berekening van de subsidiabele kosten is [artikel 1.6][ref1] van toepassing.


