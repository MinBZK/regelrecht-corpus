  - number: '1.6'
    text: |-
      1 Indien dit artikel van toepassing is verklaard zijn de
      [artikelen 11 tot en met 14 van het Kaderbesluit EZ-subsidies][ref1] niet van toepassing.

      2 Voor subsidie komen in aanmerking de extra investeringskosten die noodzakelijk zijn voor de verwezenlijking van
      de voor subsidie in aanmerking komende maatregel. Punt 80 tot en met 84 van de Communautaire kaderregeling inzake
      staatssteun ten behoeve van het milieu (PbEU 2008, C 82) worden hierbij in acht genomen.

      3 Extra investeringskosten als bedoeld in het tweede lid hebben betrekking op:

      a. kosten van verwerving of op andere titel dan verwerving in gebruik verkregen bedrijfsterreinen;

      b. kosten van verwerving, huurkoop of lease van bedrijfsgebouwen en daartoe te rekenen centrale voorzieningen;

      c. kosten van aangeschafte machines en apparatuur;

      d. kosten van verbruikte materialen en hulpmiddelen;

      e. kosten van onderhoud en inspectie, administratie en beheer, ontmanteling, onvoorziene reparaties, verplichte
      milieumonitoring en verzekeringen;

      f. kosten van geleidelijk opstarten en in gebruik nemen van het project en daartoe te rekenen productiekosten;

      g. kosten van tenaamstelling, verwerving en instandhouding van rechten van intellectuele eigendom;

      h. aan derden verschuldigde kosten.

      4 De hoogte van de subsidiabele extra investeringskosten komt overeen met de som van de per kostensoort berekende
      investeringskosten van het project verminderd met de referentiekosten, extra opbrengsten en enig ander extra
      voordeel in de periode tot vijf jaar na de ingebruikname alsmede extra besparingen die met het project gemoeid
      zijn.

      5 Onder de kostensoorten, genoemd in het tweede lid, onderdeel a tot en met d, wordt verstaan:

      a. wat betreft bedrijfsterreinen: de koopsom en overdrachtskosten met uitzondering van overdrachtsbelasting of de
      gekapitaliseerde erfpachtcanon exclusief de kosten van vestiging van de erfpacht, indien de grond van een gemeente
      of enig ander van overheidswege opgericht lichaam in erfpacht is verkregen;

      b. wat betreft bedrijfsgebouwen en daartoe te rekenen centrale voorzieningen: de koopsom en de overdrachtskosten of
      de aan derden verschuldigde bouwkosten met uitzondering van de financieringskosten en de overdrachtsbelasting;

      c. wat betreft machines en apparatuur voor zover deze na afloop van het project voor dezelfde doeleinden worden
      ingezet als beoogd met het project en blijven bijdragen aan een duurzame energiehuishouding: kosten voor de
      aanschaf ervan;

      d. wat betreft machines en apparatuur voor zover deze na afloop van het project voor andere doeleinden worden
      ingezet dan beoogd met het project of niet meer bijdragen aan een duurzame energiehuishouding: kosten voor de
      aanschaf ervan, met dien verstande dat wordt uitgegaan van de aan het project toe te rekenen afschrijvingskosten,
      berekend op basis van de historische aanschafprijzen en de door de belastingdienst geaccepteerde
      afschrijvingstermijnen, met uitzondering van mogelijkheden tot vervroegde afschrijving, of lease-termijnen, met
      uitzondering van financieringskosten, en gebaseerd op de bedrijfseconomische levensduur;

      e. wat betreft materialen en hulpmiddelen: het verbruik ervan, gebaseerd op historische aanschafprijzen.

      6 Onder de kostensoorten, genoemd in het tweede lid, onderdeel e en f, voor zover zij geactiveerd zijn op de
      fiscale balans, wordt verstaan:

      a. wat betreft onderhoud en inspectie alsmede beheer en administratie met inbegrip van de rapportages,
      bedoeld in [artikel 39 van het Kaderbesluit EZ-subsidies][ref2], en het eindverslag, bedoeld in
      [artikel 50, tweede lid, onderdeel a, van het Kaderbesluit EZ-subsidies][ref3]: kosten die rechtstreeks zijn toe te
      rekenen aan het vijfde lid, onderdeel a tot en met e;

      b. wat betreft verzekeringen: kosten die rechtstreeks zijn toe te rekenen aan het vijfde lid, onderdeel a tot en
      met d;

      c. wat betreft onvoorziene reparaties: kosten die rechtstreeks zijn toe te rekenen aan het vijfde lid, onderdeel b
      tot en met d;

      d. wat betreft monitoring: kosten die rechtstreeks zijn toe te rekenen aan voortgangscontrole op een project;

      e. wat betreft ontmanteling: kosten ervan voor zover gehele of gedeeltelijke verwijdering van een project in
      verband met milieubescherming verplicht is, te berekenen over een periode van ten hoogste 20 jaar;

      f. wat betreft het geleidelijk opstarten en in gebruik nemen van een project: kosten ervan die rechtstreeks zijn
      toe te rekenen aan capaciteitsverlies en gederfde inkomsten.

      7 Van de som van de per kostensoort berekende investeringskosten van het project verminderd met de referentiekosten
      maken de aan derden verschuldigde kosten, bedoeld in het derde lid, onderdeel h, ten hoogste 50 procent deel uit.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0024796#Artikel50
