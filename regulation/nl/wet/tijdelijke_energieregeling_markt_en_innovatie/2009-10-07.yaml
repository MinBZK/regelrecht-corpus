    text: |-
      1 Het percentage, bedoeld in [artikel 13, eerste lid, onder a, van het Kaderbesluit EZ-subsidies][ref1], bedraagt
      50%.

      2 Het uurtarief, bedoeld in [artikel 13, tweede lid][ref2], en [artikel 14 van het Kaderbesluit EZ-subsidies][ref3],
