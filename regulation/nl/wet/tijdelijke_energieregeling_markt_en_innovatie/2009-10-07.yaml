  - number: '1.7'
    text: |-
      In aanvulling op de [artikelen 22][ref1] en [23 van het Kaderbesluit EZ-subsidies][ref2] beslist de Minister
      afwijzend op een aanvraag om subsidie:

      a. indien de aanvraag niet voldoet aan de bij deze regeling gestelde regels;

      b. indien het project gericht is op:

      1°. de aanpassing aan van toepassing zijnde, of vastgestelde maar nog niet van toepassing zijnde, communautaire
      normen,

      2°. de aanpassing aan nationale normen die gelijk zijn aan of minder zware eisen stellen dan communautaire normen
      of

      3°. de aanpassing aan nationale normen bij afwezigheid van communautaire normen, indien de aanpassing heeft
      plaatsgevonden na de op de in de nationale norm vastgestelde uiterste datum.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0024452/2009-10-07#Artikel1.7
    references:
