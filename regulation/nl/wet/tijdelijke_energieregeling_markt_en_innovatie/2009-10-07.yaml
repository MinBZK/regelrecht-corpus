  - number: '7.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - *elektrisch aangedreven warmtepomp, niet zijnde een elektrisch aangedreven lucht/waterwarmtepomp:* een warmtepomp
      met een elektrisch vermogen groter dan zes kW die bestemd is als hoofd- of basisverwarming van een woning en die
      niet primair gericht is op actieve koeling of verwarming van tapwater, waarbij warmte wordt onttrokken aan de
      bodem, het grondwater of het oppervlaktewater;
        - *elektrisch aangedreven lucht/waterwarmtepomp:* een warmtepomp met een elektrisch vermogen groter dan zes kW
      die bestemd is als hoofd- of basisverwarming van een woning is en niet primair gericht is op actieve koeling of
      verwarming van tapwater, waarbij de warmtepomp warmte onttrekt aan de buitenlucht of aan de ventilatielucht van de
      woning en warmte afgeeft met behulp van een warmte-afgiftesysteem met water als distributiemedium;
        - *warmtepomp:* 1°. een elektrisch aangedreven warmtepomp, niet zijnde een elektrisch aangedreven lucht/
      waterwarmtepomp of 2°. een elektrisch aangedreven lucht/waterwarmtepomp.
    url: https://wetten.overheid.nl/BWBR0024452/2009-10-07#Artikel7.1
  - number: '7.2'
    text: |-
      1 De minister verstrekt op aanvraag een subsidie voor het treffen van technische maatregelen aan een eigenaar van
      een woning die:

      a. voor 1 september 2009 een warmtepomp bezit,

      b. technische maatregelen met betrekking tot de warmtepomp of de elektriciteitsinstallatie van de woning heeft
      getroffen die een verlaging van de capaciteit van de elektriciteitsaansluiting mogelijk maakt en die noodzakelijk
      zijn in verband met het gebruik van de warmtepomp, en

      c. een verzoek om verlaging van de capaciteit van de elektriciteitsaansluiting heeft ingediend bij de regionale
      netbeheerder.

      2 Op een subsidie als bedoeld in het eerste lid zijn niet van toepassing:

      a. [artikel 1.7, onderdeel b][ref1], van deze regeling;

      b. de [artikelen 10, tweede, derde, vijfde en zesde lid][ref2], [11 tot en met 14][ref3],
      [23, a, b, c, d, f en h][ref4], en [36 tot en met 42 van het Kaderbesluit EZ-subsidies][ref5].

      3 De subsidie wordt vastgesteld zonder voorafgaande beschikking tot subsidieverlening.


