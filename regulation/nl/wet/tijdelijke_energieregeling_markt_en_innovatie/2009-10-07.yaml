  - number: '5.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder:

      a. *haalbaarheidsstudie:* een studie waarin de technische en economische haalbaarheid wordt onderzocht van een
      of meer pakketten maatregelen die erop gericht zijn om een school of kantoor, die de aanvrager gaat bouwen of
      renoveren, te laten voldoen aan de vereisten van een unieke kansen project scholen/kantoren, daaronder begrepen de
      mogelijkheden voor strategische samenwerking;

      b. *onderwijsinstelling:* een publiek bekostigde school voor basisonderwijs of voortgezet onderwijs, als bedoeld in
      de [Wet op het primair onderwijs][ref1] respectievelijk de [Wet op het voortgezet onderwijs][ref2];

      c. *totale energieverbruik:* de som van het gebouwgebonden energieverbruik, het gebouwafhankelijke
      gebruikersenergieverbruik en het energieverbruik van gebruikersapparatuur per jaar;

      d. *NEN:* norm als bedoeld in [artikel 1.1, eerste lid, van het Bouwbesluit 2003][ref3];

      e. *unieke kansen project scholen/kantoren:* project voor energiebesparing in de nieuwbouw of renovatie
      van gebouwen waarin ten minste 70% van de bruto vloeroppervlakte, als bedoeld in NEN 2580, in gebruik
      is voor een onderwijsfunctie ten behoeve van een onderwijsinstelling of een kantoorfunctie, bedoeld in
      [artikel 1.1, derde lid, van het Bouwbesluit 2003][ref4]:

      1°. dat tenminste 1000 m2 bruto vloeroppervlakte omvat;

      2°. dat wordt uitgevoerd door een samenwerkingsverband, waarbij bij ten minste een van de deelnemers technische of
      beheersmatige voorzieningen worden getroffen;

      3°. waarbij, indien het renovatie van bestaande gebouwen met een kantoorfunctie betreft, de CO-emissie ten gevolge
      van het totale energieverbruik van en binnen het gebouw ten hoogste 53 kg CO/m2 bruto vloeroppervlakte bedraagt;

      4°. waarbij, indien het renovatie van bestaande gebouwen met een onderwijsfunctie betreft, de CO-emissie ten
      gevolge van het totale energieverbruik van en binnen het gebouw ten hoogste 25 kg CO/m2 bruto vloeroppervlakte
      bedraagt;

      5°. waarbij, indien het nieuwbouw met een kantoorfunctie betreft, de maximale energieprestatiecoëfficiënt 0,75 en
      de CO-emissie ten gevolge van het totale energieverbruik van en binnen het gebouw ten hoogste 37 kg CO/m2 bruto
      vloeroppervlakte bedraagt;

      6°. waarbij, indien het nieuwbouw met een onderwijsfunctie betreft, de maximale energieprestatiecoëfficiënt 0,90
      bedraagt en de CO-emissie ten gevolge van het totale energieverbruik van en binnen het gebouw ten hoogste 22 kg CO/
      m2 bruto vloeroppervlakte bedraagt en

      7°. waarbij, indien het renovatie van bestaande gebouwen betreft, de energieprestatie na renovatie
      energielabelklasse A bedraagt en de energie-index met ten minste 0,30 verbetert.


