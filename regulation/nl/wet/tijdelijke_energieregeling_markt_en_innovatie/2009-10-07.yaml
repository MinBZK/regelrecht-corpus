      In dit hoofdstuk wordt verstaan onder

        - *keten voor biomassa:* de productie, de verwerking en de import van in het buitenland geproduceerde biomassa die
      leidt tot de toepassing van biomassa voor energie-, transport- of chemiedoeleinden in Nederland;
        - *primaire landbouwproducent:* onderneming van de landbouwproductiesector in de zin van artikel 2, eerste lid, van
      verordening (EG) nr. 1535/2007 van de Commissie van de Europese Gemeenschappen van 20 december 2007 betreffende de
      toepassing van de artikelen 87 en 88 van het EG-Verdrag op de-minimissteun in de landbouwproductiesector;
        - *Toetsingskader voor duurzame biomassa:* het toetsingskader opgesteld door de projectgroep Duurzame productie van
      biomassa, opgenomen in [bijlage 13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024452
    url: https://wetten.overheid.nl/BWBR0024452/2009-10-07#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0024452
  - number: '6.2'
    text: |-
      1 De Minister verstrekt op aanvraag een subsidie voor activiteiten die op innovatieve wijze bijdragen aan het
      verduurzamen van ketens voor biomassa.

      2 Onder het verduurzamen van ketens voor biomassa bedoeld in het eerste lid wordt verstaan:

      a) het verduurzamen van de biomassaketen aan de hand van het Toetsingskader voor duurzame biomassa;

      b) de certificering van duurzame biomassaketens; of

      c) het tegengaan van ongewenste indirecte effecten van biomassaproductie.

      3 In aanvulling op [artikel 3, eerste lid, van het Kaderbesluit EZ-subsidies][ref1] verstrekt de Minister
      de subsidie, bedoeld in het eerste lid, tevens aan een niet in Nederland gevestigde deelnemer in een
      samenwerkingsverband waarvan de penvoerder in Nederland is gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel3
    url: https://wetten.overheid.nl/BWBR0024452/2009-10-07#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '3'
  - number: '6.3'
    text: |-
      1 De subsidie bedraagt maximaal:

      a. € 500.000 per ondernemer, niet zijnde een binnen de Europese Unie gevestigde primaire landbouwproducent;

      b. € 7.500 per binnen de Europese Unie gevestigde primaire landbouwproducent;

      c. € 1.000.000 per aanvraag.

      2 De subsidie bedraagt:

      a. 50% van de subsidiabele kosten indien de subsidie-ontvanger een ondernemer is;

      b. 75% van de subsidiabele kosten indien de subsidie-ontvanger geen ondernemer is.

      3 Voor subsidie komen in aanmerking de kosten die noodzakelijk zijn voor de verduurzaming van ketens voor biomassa.

      4 In afwijking van [artikel 11, eerste lid, van het Kaderbesluit EZ-subsidies][ref1] kiest een buiten Nederland
      gevestigde aanvrager voor de berekening van de subsidiabele kosten uit:

      a. de integrale kostensystematiek, opgenomen in [artikel 12 van het Kaderbesluit EZ-subsidies][ref2], of

      b. de loonkosten plus vaste-opslag-systematiek, opgenomen in [artikel 13 van het Kaderbesluit EZ-subsidies][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0024796#Artikel13
    url: https://wetten.overheid.nl/BWBR0024452/2009-10-07#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0024796
        artikel: '13'
  - number: '6.4'
    text: |-
      1 De subsidie voor een binnen de Europese Unie gevestigde subsidie-ontvanger, niet zijnde een primaire
      landbouwproducent, valt onder de Tijdelijke communautaire kaderregeling inzake staatssteun ter stimulering van de
      toegang tot financiering in de huidige financiële en economische crisis van 17 december 2008. Het bedrag van de
      subsidie wordt verlaagd voor zover dit nodig is op basis van deze kaderregeling.

      2 De subsidie voor een binnen de Europese Unie gevestigde primaire landbouwproducent valt onder verordening (EG)
      nr. 1535/2007 van de Commissie van de Europese Gemeenschappen van 20 december 2007 betreffende de toepassing van de
      artikelen 87 en 88 van het EG-Verdrag op de-minimissteun in de landbouwproductiesector. Het bedrag van de subsidie
      wordt verlaagd voor zover dit nodig is op basis van deze verordening.
    url: https://wetten.overheid.nl/BWBR0024452/2009-10-07#Artikel6.4
  - number: '6.5'
    text: De Minister verdeelt het beschikbare bedrag op volgorde van rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0024452/2009-10-07#Artikel6.5
  - number: '6.6'
    text: |-
      1 Indien de activiteiten betrekking hebben op vloeibare biomassa of biobrandstoffen beslist de Minister, in
      aanvulling op [artikel 23 van het Kaderbesluit EZ-subsidies][ref1], afwijzend op een aanvraag indien onvoldoende
      vertrouwen bestaat dat de vloeibare biomassa of biobrandstoffen voldoen, of na uitvoering van de activiteiten
      zullen voldoen, aan de duurzaamheidscriteria genoemd in artikel 17 van Richtlijn 2009/28/EG van het Europees
      Parlement en de Raad ter bevordering van het gebruik van energie uit hernieuwbare bronnen en houdende wijziging en
      intrekking van Richtlijnen 2001/77/EG en 2003/30/EG.

      2 De Minister rangschikt de aanvragen waarop niet afwijzend is beslist, zodanig dat een project hoger gerangschikt
      wordt naarmate het meer bijdraagt aan de doelstellingen bedoeld in [artikel 6.2][ref2]. Bij de rangschikking worden
      de volgende criteria gehanteerd:

      a. de mate waarin het project bijdraagt aan de doelstellingen bedoeld in [artikel 6.2][ref3], in relatie tot de
      totale subsidiabele kosten van het project;

      b. de mate waarin het project bijdraagt aan verduurzaming van ketens voor biomassa in de zin van
      [artikel 6.2, tweede lid][ref4], in relatie tot de resultaten van de beoordeling van de betreffende biomassaketen
      aan de hand van het Toetsingskader voor duurzame biomassa;

      c. de mate waarin het project in de praktijk navolging kan vinden en kan worden opgeschaald, waarbij ook de
      navolging en opschaling leiden tot toepassing van duurzame biomassa in Nederland.

      3 Voor de rangschikking wegen de criteria genoemd in het tweede lid even zwaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0024452#Artikel6.2
