$id: tijdelijke_energieregeling_markt_en_innovatie
regulatory_layer: WET
publication_date: '2009-12-18'
valid_from: '2009-11-20'
bwb_id: BWBR0024452
url: https://wetten.overheid.nl/BWBR0024452/2009-11-20
preamble:
  text: |-
    Gelet op artikel 3 van de Kaderwet EZ-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder: - *Minister:* de Minister van Economische Zaken;
        - *ondernemer in de landbouwsector:* een ondernemer die activiteiten verricht op het gebied van de productie,
      verwerking en afzet van landbouwproducten als bedoeld in bijlage 1 bij het Verdrag tot oprichting van de Europese
      Gemeenschap, met uitzondering van ondernemers in de visserij- en aquacultuursector en in de bosbouwsector;
        - *referentiekosten:* kosten voor een investering ten behoeve van een in Nederland gangbaar systeem, apparaat of
      techniek die in technisch opzicht vergelijkbaar is met een in Nederland uit te voeren project maar waarmee niet
      hetzelfde niveau van milieubescherming kan worden bereikt als met het uit te voeren project, terwijl, in geval van
      een uit te voeren project voor hernieuwbare energie, de capaciteit voor de opwekking van energie van dat project
      ten minste overeenkomt met die van de eerstbedoelde investering.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.1
  - number: '1.2'
    text: |-
      Op subsidies op grond van deze regeling zijn de bepalingen van het [Kaderbesluit EZ-subsidies][ref1] van
      overeenkomstige toepassing, met uitzondering van de [artikelen 5][ref2] en [9][ref3] en andere bepalingen voor
      zover deze in de volgende hoofdstukken buiten toepassing worden verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0024796
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0024796#Artikel9
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0024796
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0024796
        artikel: '9'
  - number: 1.3.1
    text: |-
      De subsidie bedraagt voor zover activiteiten vallen onder [bijlage 1][ref1], het percentage van de subsidiabele
      kosten zoals aangegeven in de bijlage, tenzij is aangegeven dat:


      [ref1]: https://wetten.overheid.nl/BWBR0024452
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0024452
  - number: 1.3.1.a
    text: de subsidie valt onder een de-minimis verordening,
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.3
  - number: 1.3.1.b
    text: de subsidie aangemerkt wordt als steun als bedoeld in deel 6 van de algemene groepsvrijstellingsverordening of
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.3
  - number: 1.3.1.c
    text: de subsidie geen steun is in de zin van artikel 87 en 88 van het EG-verdrag.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.3
  - number: 1.3.2
    text: |-
      Indien de hoogte van de subsidie volgt uit de bijlage en verschillende percentages van toepassing zijn, bedraagt de
      subsidie het gewogen gemiddelde van deze percentages.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.3
  - number: 1.4.1
    text: |-
      Het rapport van feitelijke bevindingen, bedoeld in [artikel 12, derde lid, van het Kaderbesluit EZ-subsidies][ref1],
      wordt opgesteld overeenkomstig het protocol dat is opgenomen in [bijlage 2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0024452
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.4
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0024452
  - number: 1.4.2
    text: |-
      Als rapport als bedoeld in [artikel 12, vierde lid, van het Kaderbesluit EZ-subsidies][ref1], wordt aangewezen een
      afschrift van het rapport van feitelijke bevindingen van een externe accountant inzake de actueel gebruikte methode
      voor berekening van de personeelskosten en indirecte kosten dat is opgesteld in het kader van verordening (EG) nr.
      1906/2006 van het Europees Parlement en de Raad van de Europese Unie van 18 december 2006 tot vaststelling van de
      regels voor de deelname van ondernemingen, onderzoekscentra en universiteiten aan acties op grond van het zevende
      kaderprogramma, en voor verspreiding van onderzoeksresultaten (2007–2013) (PbEU L 391) en, indien de subsidie-
      ontvanger daarover beschikt, een afschrift van de goedkeuring door de Europese Commissie van dat rapport.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel12
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.4
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '12'
  - number: 1.5.1
    text: |-
      Het percentage, bedoeld in [artikel 13, eerste lid, onder a, van het Kaderbesluit EZ-subsidies][ref1], bedraagt
      50%.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel13
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.5
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '13'
  - number: 1.5.2
    text: |-
      Het uurtarief, bedoeld in [artikel 13, tweede lid][ref1], en [artikel 14 van het Kaderbesluit EZ-subsidies][ref2],
      bedraagt € 35.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel14
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.5
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '14'
  - number: 1.6.1
    text: |-
      Indien dit artikel van toepassing is verklaard zijn de
      [artikelen 11 tot en met 14 van het Kaderbesluit EZ-subsidies][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel11
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '11'
  - number: 1.6.2
    text: |-
      Voor subsidie komen in aanmerking de extra investeringskosten die noodzakelijk zijn voor de verwezenlijking van
      de voor subsidie in aanmerking komende maatregel. Punt 80 tot en met 84 van de Communautaire kaderregeling inzake
      staatssteun ten behoeve van het milieu (PbEU 2008, C 82) worden hierbij in acht genomen.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.6
  - number: 1.6.3
    text: 'Extra investeringskosten als bedoeld in het tweede lid hebben betrekking op:'
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.6
  - number: 1.6.3.a
    text: kosten van verwerving of op andere titel dan verwerving in gebruik verkregen bedrijfsterreinen;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.6
  - number: 1.6.3.b
    text: kosten van verwerving, huurkoop of lease van bedrijfsgebouwen en daartoe te rekenen centrale voorzieningen;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.6
  - number: 1.6.3.c
    text: kosten van aangeschafte machines en apparatuur;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.6
  - number: 1.6.3.d
    text: kosten van verbruikte materialen en hulpmiddelen;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.6
  - number: 1.6.3.e
    text: |-
      kosten van onderhoud en inspectie, administratie en beheer, ontmanteling, onvoorziene reparaties, verplichte
      milieumonitoring en verzekeringen;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.6
  - number: 1.6.3.f
    text: kosten van geleidelijk opstarten en in gebruik nemen van het project en daartoe te rekenen productiekosten;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.6
  - number: 1.6.3.g
    text: kosten van tenaamstelling, verwerving en instandhouding van rechten van intellectuele eigendom;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.6
  - number: 1.6.3.h
    text: aan derden verschuldigde kosten.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.6
  - number: 1.6.4
    text: |-
      De hoogte van de subsidiabele extra investeringskosten komt overeen met de som van de per kostensoort berekende
      investeringskosten van het project verminderd met de referentiekosten, extra opbrengsten en enig ander extra
      voordeel in de periode tot vijf jaar na de ingebruikname alsmede extra besparingen die met het project gemoeid
      zijn.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.6
  - number: 1.6.5
    text: 'Onder de kostensoorten, genoemd in het tweede lid, onderdeel a tot en met d, wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.6
  - number: 1.6.5.a
    text: |-
      wat betreft bedrijfsterreinen: de koopsom en overdrachtskosten met uitzondering van overdrachtsbelasting of de
      gekapitaliseerde erfpachtcanon exclusief de kosten van vestiging van de erfpacht, indien de grond van een gemeente
      of enig ander van overheidswege opgericht lichaam in erfpacht is verkregen;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.6
  - number: 1.6.5.b
    text: |-
      wat betreft bedrijfsgebouwen en daartoe te rekenen centrale voorzieningen: de koopsom en de overdrachtskosten of de
      aan derden verschuldigde bouwkosten met uitzondering van de financieringskosten en de overdrachtsbelasting;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.6
  - number: 1.6.5.c
    text: |-
      wat betreft machines en apparatuur voor zover deze na afloop van het project voor dezelfde doeleinden worden
      ingezet als beoogd met het project en blijven bijdragen aan een duurzame energiehuishouding: kosten voor de
      aanschaf ervan;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.6
  - number: 1.6.5.d
    text: |-
      wat betreft machines en apparatuur voor zover deze na afloop van het project voor andere doeleinden worden ingezet
      dan beoogd met het project of niet meer bijdragen aan een duurzame energiehuishouding: kosten voor de aanschaf
      ervan, met dien verstande dat wordt uitgegaan van de aan het project toe te rekenen afschrijvingskosten, berekend
      op basis van de historische aanschafprijzen en de door de belastingdienst geaccepteerde afschrijvingstermijnen,
      met uitzondering van mogelijkheden tot vervroegde afschrijving, of lease-termijnen, met uitzondering van
      financieringskosten, en gebaseerd op de bedrijfseconomische levensduur;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.6
  - number: 1.6.5.e
    text: 'wat betreft materialen en hulpmiddelen: het verbruik ervan, gebaseerd op historische aanschafprijzen.'
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.6
  - number: 1.6.6
    text: |-
      Onder de kostensoorten, genoemd in het tweede lid, onderdeel e en f, voor zover zij geactiveerd zijn op de fiscale
      balans, wordt verstaan:
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.6
  - number: 1.6.6.a
    text: |-
      wat betreft onderhoud en inspectie alsmede beheer en administratie met inbegrip van de rapportages,
      bedoeld in [artikel 39 van het Kaderbesluit EZ-subsidies][ref1], en het eindverslag, bedoeld in
      [artikel 50, tweede lid, onderdeel a, van het Kaderbesluit EZ-subsidies][ref2]: kosten die rechtstreeks zijn toe te
      rekenen aan het vijfde lid, onderdeel a tot en met e;


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel50
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '39'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '50'
  - number: 1.6.6.b
    text: |-
      wat betreft verzekeringen: kosten die rechtstreeks zijn toe te rekenen aan het vijfde lid, onderdeel a tot en met
      d;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.6
  - number: 1.6.6.c
    text: |-
      wat betreft onvoorziene reparaties: kosten die rechtstreeks zijn toe te rekenen aan het vijfde lid, onderdeel b tot
      en met d;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.6
  - number: 1.6.6.d
    text: 'wat betreft monitoring: kosten die rechtstreeks zijn toe te rekenen aan voortgangscontrole op een project;'
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.6
  - number: 1.6.6.e
    text: |-
      wat betreft ontmanteling: kosten ervan voor zover gehele of gedeeltelijke verwijdering van een project in verband
      met milieubescherming verplicht is, te berekenen over een periode van ten hoogste 20 jaar;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.6
  - number: 1.6.6.f
    text: |-
      wat betreft het geleidelijk opstarten en in gebruik nemen van een project: kosten ervan die rechtstreeks zijn toe
      te rekenen aan capaciteitsverlies en gederfde inkomsten.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.6
  - number: 1.6.7
    text: |-
      Van de som van de per kostensoort berekende investeringskosten van het project verminderd met de referentiekosten
      maken de aan derden verschuldigde kosten, bedoeld in het derde lid, onderdeel h, ten hoogste 50 procent deel uit.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.6
  - number: '1.7'
    text: |-
      In aanvulling op de [artikelen 22][ref1] en [23 van het Kaderbesluit EZ-subsidies][ref2] beslist de Minister
      afwijzend op een aanvraag om subsidie:


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.7
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 1.7.a
    text: indien de aanvraag niet voldoet aan de bij deze regeling gestelde regels;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.7
  - number: 1.7.b
    text: 'indien het project gericht is op:'
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.7
  - number: 1.7.b.1°
    text: de aanpassing aan van toepassing zijnde, of vastgestelde maar nog niet van toepassing zijnde, communautaire normen,
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.7
  - number: 1.7.b.2°
    text: de aanpassing aan nationale normen die gelijk zijn aan of minder zware eisen stellen dan communautaire normen of
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.7
  - number: 1.7.b.3°
    text: |-
      de aanpassing aan nationale normen bij afwezigheid van communautaire normen, indien de aanpassing heeft
      plaatsgevonden na de op de in de nationale norm vastgestelde uiterste datum.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel1.7
  - number: 2.1.1
    text: |-
      In dit hoofdstuk wordt verstaan onder: - bestaande woning: een ruimte met een woonfunctie, die is opgeleverd en in
      gebruik genomen voor 1 januari 2008;
        - duurzame warmtemaatregel: het aanschaffen, installeren en in gebruik nemen van een of meer nieuwe dan wel niet
      eerder gebruikte in [bijlage 3][ref1] bij deze regeling genoemde technische voorzieningen in een bestaande woning;
        - installatie voor micro-warmtekrachtkoppeling: een installatie voor micro-warmtekrachtkoppeling als bedoeld in
      [bijlage 3, onderdeel 4][ref2];
        - lucht/waterwarmtepomp: een lucht/waterwarmtepomp als bedoeld in [bijlage 3, onderdeel 3][ref3];
        - warmtepomp, niet zijnde een lucht/waterwarmtepomp: een warmtepomp, niet zijnde een lucht/waterwarmtepomp als
      bedoeld in [bijlage 3, onderdeel 2][ref4];
        - zonneboiler: een zonneboiler als bedoeld in [bijlage 3, onderdeel 1][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0024452
      [ref2]: https://wetten.overheid.nl/BWBR0024452
      [ref3]: https://wetten.overheid.nl/BWBR0024452
      [ref4]: https://wetten.overheid.nl/BWBR0024452
      [ref5]: https://wetten.overheid.nl/BWBR0024452
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0024452
      - id: ref2
        bwb_id: BWBR0024452
      - id: ref3
        bwb_id: BWBR0024452
      - id: ref4
        bwb_id: BWBR0024452
      - id: ref5
        bwb_id: BWBR0024452
  - number: 2.1.2
    text: |-
      Met de voorzieningen genoemd in [bijlage 3][ref1] worden gelijkgesteld de desbetreffende voorzieningen die
      rechtmatig zijn vervaardigd of in de handel zijn gebracht in een andere lidstaat van de Europese Unie dan wel
      rechtmatig zijn vervaardigd of in de handel zijn gebracht in een staat, niet zijnde een lidstaat van de Europese
      Unie, die partij is bij een daartoe strekkend of mede daartoe strekkend Verdrag dat Nederland bindt, en die voldoen
      aan eisen die een beschermingsniveau bieden dat ten minste gelijkwaardig is aan het niveau dat met de nationale
      eisen wordt nagestreefd.


      [ref1]: https://wetten.overheid.nl/BWBR0024452
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0024452
  - number: 2.2.1
    text: 'De Minister verstrekt op aanvraag een subsidie voor een duurzame warmtemaatregel aan:'
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel2.2
  - number: 2.2.1.a
    text: een eigenaar-bewoner van een bestaande woning, of
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel2.2
  - number: 2.2.1.b
    text: een eigenaar-verhuurder van een bestaande woning, die een duurzame warmtemaatregel uitvoert.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel2.2
  - number: 2.2.2
    text: |-
      Op een subsidie voor een duurzame warmtemaatregel zijn niet van toepassing - [artikel 1.7, onderdeel b][ref1], van
      deze regeling en
        - de [artikelen 10, tweede lid][ref2], [11 tot en met 14][ref3], [23, onderdeel d][ref4], en
      [36 tot en met 42 van het Kaderbesluit EZ-subsidies][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0024452#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0024796#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0024796#Artikel23
      [ref5]: https://wetten.overheid.nl/BWBR0024796#Artikel36
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0024452
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0024796
        artikel: '11'
      - id: ref4
        bwb_id: BWBR0024796
        artikel: '23'
      - id: ref5
        bwb_id: BWBR0024796
        artikel: '36'
  - number: 2.2.3
    text: |-
      In afwijking van [artikel 45 tot en met 47 van het Kaderbesluit EZ-subsidies][ref1] wordt geen voorschot verstrekt
      bij een aanvraag om subsidie met een totaalbedrag van minder dan € 50.000.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel45
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '45'
  - number: 2.3.1
    text: |-
      De hoogte van de subsidie voor zonneboilers, warmtepompen, niet zijnde lucht/waterwarmtepompen, en lucht/
      waterwarmtepompen wordt berekend door het aantal GJ of kW te bepalen volgens de methode, opgenomen in
      [bijlage 4][ref1], en dit getal te vermenigvuldigen met het bedrag, opgenomen in [bijlage 5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024452
      [ref2]: https://wetten.overheid.nl/BWBR0024452
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0024452
      - id: ref2
        bwb_id: BWBR0024452
  - number: 2.3.2
    text: |-
      De hoogte van de subsidie voor zonneboilers die naast een bijdrage aan warm tapwater ook een bijdrage leveren aan
      de ruimteverwarming, wordt gebaseerd op de bijdrage aan warm tapwater.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel2.3
  - number: 2.3.3
    text: De subsidie voor een installatie voor micro-warmtekrachtkoppeling bedraagt € 4.000 per stuk.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel2.3
  - number: 2.3.4
    text: |-
      Bij subsidie aan een ondernemer waar een Europees steunkader op van toepassing is, bedraagt de subsidie niet meer
      dan is toegestaan op basis van dat steunkader.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel2.3
  - number: '2.5'
    text: De Minister verdeelt het beschikbare bedrag in de volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel2.5
  - number: '2.6'
    text: |-
      In aanvulling op [artikel 23 van het Kaderbesluit EZ-subsidies][ref1] beslist de Minister afwijzend op een aanvraag
      om subsidie indien:


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 2.6.a
    text: |-
      hij het onaannemelijk acht dat de aanvrager binnen zes maanden opdracht zal geven tot uitvoering van de duurzame
      warmtemaatregel;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel2.6
  - number: 2.6.b
    text: |-
      de aanvrager vóór 1 september 2008 ter zake van de duurzame warmtemaatregel waarop de aanvraag betrekking heeft,
      verplichtingen is aangegaan.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel2.6
  - number: '2.7'
    text: |-
      De subsidie-ontvanger geeft binnen zes maanden na de datum van de beschikking tot subsidieverlening opdracht tot
      uitvoering van de duurzame warmtemaatregel.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel2.7
  - number: 2.8.1
    text: |-
      Indien de subsidie-ontvanger een eigenaar-bewoner is, voltooit deze de duurzame warmtemaatregel uiterlijk twaalf
      maanden na de datum van de beschikking tot subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel2.8
  - number: 2.8.2
    text: |-
      Indien de subsidie-ontvanger een eigenaar-verhuurder is, voltooit deze de duurzame warmtemaatregel uiterlijk
      achttien maanden na de datum van de beschikking tot subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel2.8
  - number: 2.8.3
    text: |-
      De subsidie-ontvanger dient zijn aanvraag om subsidievaststelling in uiterlijk dertien weken na het tijdstip waarop
      de activiteiten zijn voltooid.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel2.8
  - number: '2.9'
    text: |-
      Een aanvraag om subsidie en een aanvraag om subsidievaststelling wordt ingediend met gebruikmaking van het
      formulier, opgenomen in [bijlage 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024452
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0024452
  - number: '3.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder: - duurzame warmte of koude: de nettoproductie van warmte of koude uit
      hernieuwbare primaire energiedragers;
        - restwarmte of -koude: warmte of koude die in de huidige situatie beschikbaar is, maar niet nuttig gebruikt wordt,
      niet zijnde duurzame warmte of koude;
        - unieke kansen warmte/koudeproject: een voor Nederland nieuw planmatig geheel van activiteiten gericht op het
      in de praktijk beproeven van een systeem voor benutting van duurzame warmte of duurzame koude of restwarmte
      of restkoude, dat wordt uitgevoerd door een samenwerkingsverband, waarbij bij tenminste een van de deelnemers
      technische of beheersmatige voorzieningen worden getroffen.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel3.1
  - number: 3.2.1
    text: |-
      De Minister verstrekt op aanvraag een subsidie voor een unieke kansen warmte/koudeproject dat past in een of meer
      warmte/koudethema’s en waarin:
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel3.2
  - number: 3.2.1.a
    text: nieuwe technieken worden toegepast;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel3.2
  - number: 3.2.1.b
    text: nieuwe combinaties van bestaande technieken worden toegepast;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel3.2
  - number: 3.2.1.c
    text: nieuwe organisatievormen van warmte- en koudebenutting worden toegepast;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel3.2
  - number: 3.2.1.d
    text: nieuwe combinaties van aanbieders en afnemers worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel3.2
  - number: 3.2.2
    text: 'Warmte/koudethema’s als bedoeld in het eerste lid zijn:'
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel3.2
  - number: 3.2.2.a
    text: duurzame warmte of koude uit bio-energie;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel3.2
  - number: 3.2.2.b
    text: aardwarmte;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel3.2
  - number: 3.2.2.c
    text: grootschalige zonthermische energie;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel3.2
  - number: 3.2.2.d
    text: benutting van duurzame warmte of koude in de gebouwde omgeving op wijkniveau of in bedrijven;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel3.2
  - number: 3.2.2.e
    text: benutting van restwarmte of -koude in de gebouwde omgeving op wijkniveau of in bedrijven.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel3.2
  - number: 3.2.3
    text: |-
      In het samenwerkingsverband dat een unieke kansen warmte/koudeproject uitvoert wordt actief samengewerkt en zijn
      meerdere disciplines vertegenwoordigd.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel3.2
  - number: '3.3'
    text: |-
      Op een subsidie voor een unieke kansen warmte/koudeproject zijn niet van toepassing de
      [artikelen 10, derde lid][ref1], [23, onderdeel g][ref2], [38, eerste lid, onderdeel b tot en met d][ref3] en
      [41 van het Kaderbesluit EZ-subsidies][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0024796#Artikel38
      [ref4]: https://wetten.overheid.nl/BWBR0024796#Artikel41
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '23'
      - id: ref3
        bwb_id: BWBR0024796
        artikel: '38'
      - id: ref4
        bwb_id: BWBR0024796
        artikel: '41'
  - number: 3.4.1
    text: De subsidie bedraagt 40 procent van de subsidiabele kosten, maar niet meer dan € 800.000 per aanvraag.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel3.4
  - number: 3.4.2
    text: |-
      Het in het eerste lid genoemde percentage wordt met 10 procentpunten verhoogd voor iedere aanvrager die een kleine
      of middelgrote onderneming in stand houdt voor zover de subsidiabele kosten worden gemaakt en betaald door die
      ondernemer.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel3.4
  - number: 3.4.3
    text: |-
      Indien de subsidie-ontvanger een ondernemer in de landbouwsector is en een kleine of middelgrote onderneming in
      stand houdt, is de verhoging, bedoeld in het tweede lid, niet van toepassing voor zover de subsidiabele kosten
      betrekking hebben op investeringen waardoor de productiecapaciteit zal toenemen.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel3.4
  - number: 3.4.4
    text: |-
      Het te verlenen subsidiebedrag, tot stand gekomen met toepassing van het eerste en tweede lid, is niet meer dan de
      maximaal toegestane investeringssteun, berekend op de voet van de Communautaire kaderregeling inzake staatssteun
      ten behoeve van het milieu (PbEG 2008, C82).
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel3.4
  - number: 3.4.5
    text: |-
      Voor de berekening van de subsidiabele kosten is [artikel 1.6][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024452#Artikel1
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0024452
        artikel: '1'
        hoofdstuk: '1'
  - number: '3.5'
    text: |-
      Het subsidieplafond voor het verlenen van subsidies op aanvragen om subsidie voor unieke kansen warmte/
      koudeproject, ontvangen in de periode van de datum van inwerkingtreding van deze regeling tot en met 1 december
      2008, 17:00 uur, bedraagt € 10.000.000.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel3.5
  - number: '3.6'
    text: De Minister verdeelt het beschikbare bedrag op volgorde van rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel3.6
  - number: 3.7.1
    text: |-
      De Adviescommissie energiedemonstratieprojecten en energietransitie-experimenten
      adviseert de Minister over de afwijzingsgronden, bedoeld in het tweede lid en
      [artikel 23, onderdelen e, f en h van het Kaderbesluit EZ-subsidies][ref1], en de rangschikkingscriteria, bedoeld
      in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 3.7.2
    text: |-
      In aanvulling op [artikel 23 van het Kaderbesluit EZ-subsidies][ref1] beslist de Minister afwijzend op een aanvraag
      om subsidie indien hij van oordeel is dat:


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 3.7.2.a
    text: het project onvoldoende bijdraagt aan de doelstellingen van de regeling;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel3.7
  - number: 3.7.2.b
    text: van de sociaal-wetenschappelijke en economische effecten van het project onvoldoende blijk wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel3.7
  - number: 3.7.3
    text: 'De Minister rangschikt de aanvragen waarop niet afwijzend is beslist, hoger naarmate:'
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel3.7
  - number: 3.7.3.a
    text: het project technologisch en niet-technologisch innovatiever is ten opzichte van de huidige praktijk in Nederland;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel3.7
  - number: 3.7.3.b
    text: |-
      het project meer bijdraagt aan de verduurzaming van de energiehuishouding in CO reductie of PJ per jaar op
      projectniveau;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel3.7
  - number: 3.7.3.c
    text: het project meer herhalingspotentieel bezit, gebaseerd op kostprijsontwikkeling en marktverwachting;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel3.7
  - number: 3.7.3.d
    text: het samenwerkingsverband van een betere kwaliteit is en de slaagkans van het project groter is.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel3.7
  - number: 3.7.4
    text: |-
      Voor de rangschikking weegt het criterium genoemd in het derde lid, onderdeel a, dubbel ten opzichte van elk van de
      criteria, genoemd in het derde lid, onderdeel b tot en met d.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel3.7
  - number: 3.8.1
    text: |-
      De subsidie-ontvanger start binnen zes maanden na de datum van de beschikking tot subsidieverlening de uitvoering
      van het unieke kansen warmte/koudeproject.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel3.8
  - number: 3.8.2
    text: De subsidie-ontvanger voltooit het project binnen drie jaar na aanvang van het project.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel3.8
  - number: 3.9.1
    text: |-
      Een aanvraag om subsidie wordt ingediend met gebruikmaking van het formulier, opgenomen in [bijlage 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024452
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0024452
  - number: 3.9.2
    text: |-
      Een aanvraag om subsidievaststelling wordt ingediend met gebruikmaking van het formulier, opgenomen in
      [bijlage 8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024452
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0024452
  - number: '4.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder: - *een EOS-demonstratieproject:* een voor Nederland nieuw, planmatig
      geheel van activiteiten, geheel of nagenoeg geheel bestemd voor het vergroten van inzicht in de geschiktheid voor
      toepassing in de praktijk van duurzame energiehuishouding, dat een technisch of economisch risico inhoudt en dat
      bestaat uit: – energiebesparende maatregelen; – maatregelen waarbij CO-emissies worden afgevangen en permanent in
      de ondergrond opgeslagen, of – maatregelen die het gebruik van hernieuwbare energiebronnen bevorderen met behulp
      van: • voor Nederland nieuwe apparaten, systemen of technieken, of • een voor Nederland nieuwe toepassing van
      apparaten, systemen of technieken.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel4.1
  - number: 4.2.1
    text: |-
      De Minister verstrekt op aanvraag een subsidie voor een EOS-demonstratieproject dat past in een of meerdere
      energiethema’s en waarin:
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel4.2
  - number: 4.2.1.a
    text: nieuwe technieken worden toegepast; of
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel4.2
  - number: 4.2.1.b
    text: nieuwe combinaties van bestaande technieken worden toegepast.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel4.2
  - number: 4.2.2
    text: 'Energiethema’s als bedoeld in het eerste lid zijn:'
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel4.2
  - number: 4.2.2.a
    text: biomassa;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel4.2
  - number: 4.2.2.b
    text: nieuw gas/schoon fossiel en efficiënt gebruik van gas;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel4.2
  - number: 4.2.2.c
    text: energie-efficiëntie in de industriële en landbouwsector;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel4.2
  - number: 4.2.2.d
    text: gebouwde omgeving;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel4.2
  - number: 4.2.2.e
    text: opwekking en netten.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel4.2
  - number: '4.3'
    text: |-
      Op een subsidie voor een EOS-demonstratieproject zijn niet van toepassing de
      [artikelen 10, derde lid][ref1], [23, onderdeel g][ref2], [38, eerste lid, onderdeel b tot en met d][ref3] en
      [41 van het Kaderbesluit EZ-subsidies][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0024796#Artikel38
      [ref4]: https://wetten.overheid.nl/BWBR0024796#Artikel41
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel4.3
