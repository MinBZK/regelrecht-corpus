  - number: 7.2.3
    text: De subsidie wordt vastgesteld zonder voorafgaande beschikking tot subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel7.2
  - number: '7.3'
    text: |-
      Voor subsidie komen in aanmerking de rechtstreeks aan de technische maatregelen, bedoeld in
      [artikel 7.2, onderdeel b][ref1], toe te rekenen gemaakte en betaalde kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0024452#Artikel7
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0024452
        artikel: '7'
        hoofdstuk: '7'
  - number: '7.4'
    text: |-
      De subsidie voor het treffen van technische maatregelen als bedoeld in [artikel 7.2, onderdeel b][ref1], bedraagt:


      [ref1]: https://wetten.overheid.nl/BWBR0024452#Artikel7
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0024452
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.4.a
    text: € 100 indien de subsidiabele kosten € 100 of minder bedragen dan wel indien de aanvrager hiervoor heeft gekozen;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel7.4
  - number: 7.4.b
    text: € 200 indien de subsidiabele kosten € 101 tot en met € 300 bedragen;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel7.4
  - number: 7.4.c
    text: € 400 indien de subsidiabele kosten meer dan € 300 bedragen.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel7.4
  - number: '7.5'
    text: De minister verdeelt het subsidieplafond op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel7.5
  - number: '7.6'
    text: |-
      Het formulier voor het indienen van een aanvraag om een subsidie is opgenomen in [bijlage 16][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024452
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel7.6
    references:
      - id: ref1
        bwb_id: BWBR0024452
  - number: '8.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder: - *aardwarmte:* aardwarmte in de zin van
      [artikel 1, onderdeel b, van de Mijnbouwwet][ref1];
        - *aardwarmteproject:* het mogelijk maken van de winning en toepassing van aardwarmte van ten minste 500 meter
      diepte door het boren van een productieput en een injectieput en het plaatsen van een pompinstallatie;
        - *geologisch onderzoek:* geologisch onderzoek, inclusief het rapport opgesteld overeenkomstig het model in
      bijlage D bij [bijlage 8.1][ref2];
        - *gerealiseerde subsidiabele kosten:* de rechtstreeks aan het aardwarmteproject toe te rekenen, door de subsidie-
      ontvanger gemaakte en betaalde subsidiabele kosten;
        - *gerealiseerd vermogen:* het uit de puttest gebleken werkelijke vermogen in MW, met een correctie op skin = 0;
        - *maximale subsidiebedrag:* het in de beschikking tot subsidieverlening vermelde maximale subsidiebedrag,
      bestaande uit 85% van de verwachte subsidiabele kosten met een maximum van € 5.950.000;
        - *niet-geologische parameters:* de niet-geologische parameters, genoemd in de tabel in hoofdstuk 1, paragraaf 1.1,
      van het geologisch onderzoek;
        - *puttest:* test van het vermogen van de putten, uitgevoerd en geïnterpreteerd overeenkomstig bijlage B bij
      [bijlage 8.2][ref3];
        - *restwaarde:* de opbrengst van het project bij de economisch meest rendabele alternatieve toepassing gedurende
      twaalf jaar;
        - *verwachte subsidiabele kosten:* de in de beschikking tot subsidieverlening vermelde subsidiabele kosten;
        - *verwacht vermogen:* het in de beschikking tot subsidieverlening vermelde verwacht vermogen in MW.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0024452
      [ref3]: https://wetten.overheid.nl/BWBR0024452
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0024452
      - id: ref3
        bwb_id: BWBR0024452
  - number: 8.2.1
    text: |-
      De minister, in overeenstemming met de Minister van Landbouw, Natuur en Voedselkwaliteit, verstrekt op aanvraag een
      subsidie aan degene die in Nederland een aardwarmteproject uitvoert.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.2
  - number: 8.2.2
    text: |-
      De subsidie wordt verstrekt onder de opschortende voorwaarde dat op het beoogde stratigrafische niveau op de
      beoogde locatie en bij de in de beschikking tot subsidieverlening vermelde niet-geologische parameters, het
      gerealiseerd vermogen lager is dan het verwacht vermogen.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.2
  - number: 8.3.1
    text: De subsidie bedraagt maximaal € 5.950.000 per project.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.3
  - number: 8.3.2
    text: |-
      Indien de bij de aanvraag om subsidie opgegeven subsidiabele kosten per MW vermogen lager zijn dan € 1.200.000
      wordt het vermogen in de beschikking tot subsidieverlening zodanig verlaagd dat de verwachte subsidiabele kosten
      per MW verwacht vermogen € 1.200.000 bedragen.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.3
  - number: 8.3.3
    text: |-
      Het subsidiebedrag wordt zodanig verminderd, dat de som van de volgende bedragen niet meer dan 95% van de
      gerealiseerde subsidiabele kosten bedraagt: - het subsidiebedrag,
        - het bedrag aan overige voor het betreffende project aan de subsidie-ontvanger verleende dan wel vastgestelde
      subsidies, en
        - het bedrag waarop de subsidie-ontvanger voor het betreffende project op grond van een private verzekering
      aanspraak kan doen.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.3
  - number: 8.4.1
    text: |-
      Indien het gerealiseerde vermogen van de eerste boring gelijk aan of meer dan de helft van het verwacht vermogen
      is, vervalt de subsidie indien de subsidie-ontvanger het aardwarmteproject staakt na de eerste boring.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.4
  - number: 8.4.2
    text: |-
      Indien het gerealiseerd vermogen van de eerste boring meer dan een derde van het verwacht vermogen is en de
      subsidie-ontvanger het aardwarmteproject voltooit, is [artikel 8.6][ref1] van toepassing of, bij een verwacht
      vermogen groter dan 5 5/6 MW en verwachte subsidiabele kosten van meer dan € 7.000.000, [artikel 8.7][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024452#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0024452#Artikel8
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0024452
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0024452
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.4.3
    text: |-
      Indien het gerealiseerd vermogen van de eerste boring meer dan een derde, maar minder dan de helft van het verwacht
      vermogen is en de subsidie-ontvanger het aardwarmteproject na de eerste boring staakt, is [artikel 8.5][ref1]
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024452#Artikel8
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0024452
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.4.4
    text: |-
      Indien het gerealiseerd vermogen van de eerste boring een derde of minder van het verwacht vermogen is, of lager
      dan 0,75 MW, is [artikel 8.5][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024452#Artikel8
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0024452
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.4.5
    text: |-
      De subsidie-ontvanger staakt het aardwarmteproject op eigen aangifte dan wel door niet binnen een jaar na
      voltooiing van de eerste boring de tweede boring te voltooien.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.4
  - number: 8.5.1
    text: |-
      De hoogte van de subsidie wordt berekend overeenkomstig de formule: subsidiebedrag = 0,85 * (a – b) In deze formule
      betekent:
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.5
  - number: '8.5.1.a:'
    text: de gerealiseerde subsidiabele kosten,
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.5
  - number: '8.5.1.b:'
    text: de restwaarde.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.5
  - number: 8.5.2
    text: De subsidie bedraagt ten hoogste 70% van het maximale subsidiebedrag.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.5
  - number: 8.5.3
    text: Indien de formule in het eerste lid een negatieve uitkomst oplevert wordt de subsidie op nul gesteld.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.5
  - number: 8.5.4
    text: |-
      De betaalde premie minus 5,95% van de tot en met de eerste boring gerealiseerde subsidiabele kosten wordt
      gerestitueerd.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.5
  - number: 8.6.1
    text: |-
      De hoogte van de subsidie wordt berekend overeenkomstig de formule: subsidiebedrag = 0,85 * a – ((b/c) * d) In deze
      formule betekent:
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.6
  - number: '8.6.1.a:'
    text: |-
      de gerealiseerde subsidiabele kosten, tot een maximum van de verwachte subsidiabele kosten, en in ieder geval niet
      meer dan € 7.000.000,
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.6
  - number: '8.6.1.b:'
    text: het gerealiseerd vermogen in MW,
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.6
  - number: '8.6.1.c:'
    text: het verwacht vermogen,
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.6
  - number: '8.6.1.d:'
    text: het maximale subsidiebedrag.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.6
  - number: 8.6.2
    text: De subsidie bedraagt ten hoogste het maximale subsidiebedrag.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.6
  - number: 8.6.3
    text: Indien de formule in het eerste lid een negatieve uitkomst oplevert wordt de subsidie op nul gesteld.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.6
  - number: 8.6.4
    text: |-
      Indien het gerealiseerd vermogen na de tweede boring lager is dan 0,75 MW wordt de hoogte van de subsidie berekend
      overeenkomstig de formule: subsidiebedrag = 0,85 * (a – b) In deze formule betekent:
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.6
  - number: 8.6.4.a
    text: de gerealiseerde subsidiabele kosten,
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.6
  - number: 8.6.4.b
    text: de restwaarde.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.6
  - number: 8.7.1
    text: |-
      De hoogte van de subsidie wordt berekend overeenkomstig de formule: subsidiebedrag = ((a/b) * c) – ((d/e) * a) In
      deze formule betekent:
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.7
  - number: '8.7.1.a:'
    text: het maximale subsidiebedrag,
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.7
  - number: '8.7.1.b:'
    text: de verwachte subsidiabele kosten,
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.7
  - number: '8.7.1.c:'
    text: de gerealiseerde subsidiabele kosten, tot een maximum van de verwachte subsidiabele kosten,
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.7
  - number: '8.7.1.d:'
    text: het gerealiseerde vermogen in MW,
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.7
  - number: '8.7.1.e:'
    text: het verwachte vermogen zoals vermeld in de beschikking.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.7
  - number: 8.7.2
    text: De subsidie bedraagt ten hoogste het maximale subsidiebedrag.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.7
  - number: 8.7.3
    text: Indien de formule in het eerste lid een negatieve uitkomst oplevert wordt de subsidie op nul gesteld.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.7
  - number: 8.7.4
    text: |-
      Indien het gerealiseerde vermogen na de tweede boring lager is dan 0,75 MW wordt de hoogte van de subsidie berekend
      overeenkomstig de formule: subsidiebedrag = (a/b) * (c – d). In deze formule betekent:
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.7
  - number: '8.7.4.a:'
    text: het maximale subsidiebedrag zoals vermeld in de beschikking,
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.7
  - number: '8.7.4.b:'
    text: de verwachte subsidiabele kosten,
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.7
  - number: '8.7.4.c:'
    text: de gemaakte subsidiabele kosten,
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.7
  - number: '8.7.4.d:'
    text: de restwaarde.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.7
  - number: 8.8.1
    text: |-
      De [artikelen 10 tot en met 14a van het Kaderbesluit EZ-subsidies][ref1] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel10
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.8
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '10'
  - number: 8.8.2
    text: |-
      Voor subsidie komen in aanmerking de ondergrondse investeringskosten, bestaande uit: - kosten boring productie-
      en injectieput;
        - kosten op- en afbouwen boorinstallatie;
        - kosten boormanagement en -toezicht;
        - kosten locatie boorgereed maken;
        - cuttings/spoeling afvoeren;
        - kosten puttest en rapportage;
        - kosten onvoorzien.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.8
  - number: 8.8.3
    text: |-
      Voor subsidie komt in aanmerking een vast bedrag van € 500.000 voor het plaatsen van een pompinstallatie of het
      dichten van de put of putten.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.8
  - number: 8.8.4
    text: |-
      Indien het verwacht vermogen 5 5/6 MW of kleiner is bedraagt het totaal van de in het tweede en derde lid genoemde
      subsidiabele kosten maximaal € 7.000.000.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.8
  - number: 8.8.5
    text: |-
      Voor zover kosten uit andere hoofde zijn of worden gesubsidieerd of gefinancierd van overheidswege komen zij niet
      in aanmerking voor subsidie.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.8
  - number: 8.8.6
    text: |-
      Bij de toepassing van [artikel 6, eerste lid, van het Kaderbesluit EZ-subsidies][ref1] blijven de subsidies op
      grond van de bepalingen hoofdstuk 2 van [bijlage 2][ref2] bij de [artikelen 2:37, eerste lid][ref3], [2:38][ref4]
      en [2:40, vierde lid van de Regeling LNV-subsidies][ref5], de Unieke kansen regeling en [hoofdstuk 3][ref6] van
      deze regeling en bijdragen van de Commissie van de Europese Gemeenschappen buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0024452
      [ref3]: https://wetten.overheid.nl/BWBR0021281#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0021281#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0021281#Artikel2
      [ref6]: https://wetten.overheid.nl/BWBR0024452#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.8
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0024452
      - id: ref3
        bwb_id: BWBR0021281
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0021281
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0021281
        artikel: '2'
      - id: ref6
        bwb_id: BWBR0024452
        hoofdstuk: '3'
  - number: 8.8.7
    text: |-
      Bijdragen van gemeenten en provincies worden aangemerkt als publieke cofinanciering, en blijven bij de toepassing
      van [artikel 6, eerste lid, van het Kaderbesluit EZ-subsidies][ref1] buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel6
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.8
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '6'
  - number: 8.9.1
    text: |-
      De minister verdeelt het beschikbare bedrag in de volgorde van binnenkomst van de aanvragen, met dien verstande
      dat indien een aanvrager niet heeft voldaan aan enig wettelijk voorschrift voor het in behandeling nemen van de
      aanvraag en met toepassing van [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad
      de aanvraag aan te vullen, de dag waarop de aanvraag voldoet aan de wettelijke voorschriften met betrekking tot de
      verdeling als datum van ontvangst geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 8.9.2
    text: Bij de beoordeling van de aanvragen wint de minister advies in van TNO.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.9
  - number: 8.10.1
    text: |-
      De termijn, bedoeld in [artikel 23, onderdeel c, van het Kaderbesluit EZ-subsidies][ref1] is twee jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.10
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 8.10.2
    text: 'De minister beslist afwijzend op een aanvraag indien:'
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.10
  - number: 8.10.2.a
    text: |-
      uit het geologisch onderzoek blijkt dat de geschatte kans op het realiseren van het verwachte vermogen kleiner is
      dan 90%;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.10
  - number: 8.10.2.b
    text: |-
      op het moment van indiening van de aanvraag om subsidie geen vergunning als bedoeld in
      [artikel 6 van de Mijnbouwwet][ref1] is afgegeven voor het betreffende gebied;


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel6
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.10
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '6'
  - number: 8.10.2.c
    text: |-
      in het projectplan niet aannemelijk is gemaakt dat het aardwarmteproject binnen twee jaar na voltooiing van de
      boringen zal leiden tot de start van toepassing van aardwarmte in Nederland;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.10
  - number: 8.10.2.d
    text: het verwacht vermogen lager is dan 2 MW.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.10
  - number: 8.11.1
    text: |-
      De subsidie-ontvanger betaalt voorafgaand aan de start van het aardwarmteproject een premie van 7% van het maximale
      subsidiebedrag.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.11
  - number: 8.11.2
    text: |-
      Bij een verwacht vermogen groter dan 5 5/6 MW en verwachte subsidiabele kosten van meer dan € 7.000.000 bedraagt de
      premie, bedoeld in het eerste lid, € 416.500.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.11
  - number: 8.12.1
    text: De subsidie-ontvanger verstrekt de resultaten van de puttest binnen vier weken na de boring van een put.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.12
  - number: 8.12.2
    text: Het geologisch onderzoek en de puttest worden uitgevoerd door een ISO 9001 gecertificeerde instelling.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.12
  - number: 8.12.3
    text: |-
      De subsidie-ontvanger maakt de resultaten van het geologisch onderzoek en de puttest binnen vier weken na
      voltooiing van het aardwarmteproject openbaar.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.12
  - number: 8.13.1
    text: |-
      De subsidie-ontvanger start binnen zes maanden na de datum van de beschikking tot subsidieverlening de uitvoering
      van het aardwarmteproject en meldt de datum van aanvang binnen twee dagen na aanvang aan de minister. De minister
      kan op voorafgaand verzoek van de subsidie-ontvanger uitstel verlenen.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.13
  - number: 8.13.2
    text: Het boorgereed maken van de locatie wordt aangemerkt als start van het aardwarmteproject.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.13
  - number: 8.14.1
    text: |-
      De subsidie-ontvanger voltooit de aardwarmteboringen uiterlijk twaalf maanden na de datum van aanvang van het
      aardwarmteproject, bedoeld in [artikel 8.13, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024452#Artikel8
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.14
    references:
      - id: ref1
        bwb_id: BWBR0024452
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.14.2
    text: |-
      De aardwarmteboringen zijn voltooid op het moment dat de productieput en de injectieput zijn geboord en de
      puttesten zijn uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.14
  - number: 8.14.3
    text: |-
      Indien de subsidie-ontvanger het aardwarmteproject staakt na de eerste boring wordt de aardwarmteboring geacht te
      zijn voltooid op het moment dat de puttest na de eerste boring is uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.14
  - number: 8.14.4
    text: |-
      De minister kan voor het vertragen, essentieel wijzigen of het stopzetten van activiteiten op voorafgaand verzoek
      van de subsidie-ontvanger ontheffing verlenen van de verplichting, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.14
  - number: '8.15'
    text: |-
      De [artikelen 45 tot en met 47 van het Kaderbesluit EZ-subsidies][ref1] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel45
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.15
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '45'
  - number: 8.16.1
    text: |-
      Een aanvraag om subsidie wordt ingediend met gebruikmaking van het formulier, opgenomen in [bijlage 8.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024452
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.16
    references:
      - id: ref1
        bwb_id: BWBR0024452
  - number: 8.16.2
    text: |-
      Een aanvraag om subsidievaststelling wordt ingediend met gebruikmaking van het formulier, opgenomen in
      [bijlage 8.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024452
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.16
    references:
      - id: ref1
        bwb_id: BWBR0024452
  - number: 8.16.3
    text: 'Geen accountantsverklaring wordt bijgevoegd indien:'
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.16
  - number: 8.16.3.a
    text: bij de aanvraag om een subsidievaststelling geen aanspraak op de subsidie wordt gemaakt; of
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.16
  - number: 8.16.3.b
    text: |-
      het subsidiebedrag waarop bij de aanvraag om een subsidievaststelling aanspraak wordt gemaakt minder dan € 125.000
      bedraagt.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel8.16
  - number: 9.1.1
    text: |-
      In dit hoofdstuk wordt verstaan onder: - *biomassa:* landbouwgewassen, organische reststromen zijnde dierlijk en
      plantaardig, landbouwreststromen, bosbouw reststromen, hout en aquatische biomassa;
        - *bioraffinage:* technologie of combinatie van technologieën waarbij biomassa op duurzame wijze wordt omgezet
      in een cascade van vermarktbare producten: voedsel, veevoer, chemicaliën, brandstof en energie op een economisch
      gezonde basis met een minimale afvalproductie;
        - *demonstratieproject bioraffinage:* een project waarbij installaties voor een bioraffinaderij aangeschaft,
      voortgebracht, geïnstalleerd, en doorontwikkeld worden tot continue bedrijfsvoering;
        - *duurzaam:* economisch bestendige reductie van het gebruik van fossiele grond- en brandstoffen met minimale
      gevolgen voor het milieu en rekening houdend met socio-economische aspecten;
        - *geavanceerde biobrandstoffen:* biobrandstoffen die door de keuze voor nieuwe grondstof-omzettingsproces-
      combinaties een hoge COeq-ketenprestatie halen met minimale inzet van biomassa en als gevolg minimale concurrentie
      met de voedingsketen. Aspecten van geavanceerde biobrandstoffen zijn: a. beter milieurendement c.q. duurzamer,
      niet ten koste van andere milieudoelen (zie duurzaamheidscriteria in het Toetsingskader duurzame biomassa); b. op
      termijn van 5–10 jaar concurrerend op kosten met huidige grondstof-proces-combinaties; c. brede toepasbaarheid in
      huidig en toekomstig wagenpark;
        - *Minister van LNV:* Minister van Landbouw, Natuur en Voedselkwaliteit;
        - *pilotproject bioraffinage:* verwerven, combineren, vormgeven of gebruiken van bestaande of niet bestaande kennis
      en vaardigheden op het gebied van bioraffinage ten behoeve van het ontwikkelen en bouwen van een prototype en het
      experimenteren hiermee;
        - *referentiekosten:* Kosten voor een investering ten behoeve van een in Nederland gangbaar systeem, apparaat
      of techniek die in technisch opzicht vergelijkbaar is met het uit te voeren pilotproject bioraffinage of
      demonstratieproject bioraffinage maar waarmee niet hetzelfde niveau van milieubescherming kan worden bereikt als
      met het uit te voeren project, bij vergelijkbare productiecapaciteit;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.1
  - number: 9.1.2
    text: |-
      Op dit hoofdstuk is [hoofdstuk 1][ref1] van deze regeling van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024452#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0024452
        hoofdstuk: '1'
  - number: 9.1.3
    text: |-
      Dit hoofdstuk berust op [artikel 2 van de Kaderwet LNV-subsidies][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009194#Artikel2
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0009194
        artikel: '2'
  - number: 9.2.1
    text: 'De Minister van LNV verstrekt op aanvraag een subsidie aan:'
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.2
  - number: 9.2.1.a
    text: 'een ondernemer voor een demonstratieproject bioraffinage dat past in een of meerdere bioraffinage thema''s waarin:'
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.2
  - number: 9.2.1.a.1°
    text: nieuwe kennis of technologie wordt ontwikkeld en/of toegepast, of
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.2
  - number: 9.2.1.a.2°
    text: nieuwe combinaties van bestaande kennis en technologieën worden toegepast;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.2
  - number: 9.2.1.b
    text: 'een ondernemer voor een pilotproject bioraffinage dat past in een of meerdere bioraffinage thema''s waarin:'
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.2
  - number: 9.2.1.b.1°
    text: nieuwe kennis of technologie wordt ontwikkeld en/of toegepast, of
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.2
  - number: 9.2.1.b.2°
    text: nieuwe combinaties van bestaande kennis en technologieën worden toegepast;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.2
  - number: 9.2.1.c
    text: een deelnemer in een samenwerkingsverband die een in sub a of b genoemd project bioraffinage uitvoert.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.2
  - number: 9.2.2
    text: 'Bioraffinage thema''s als bedoeld in het eerste lid zijn:'
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.2
  - number: 9.2.2.a
    text: bioraffinage van Nederlandse gewassen;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.2
  - number: 9.2.2.b
    text: bioraffinage van geïmporteerde biomassa rond Nederlandse havens;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.2
  - number: 9.2.2.c
    text: bioraffinage van afval- en reststromen;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.2
  - number: 9.2.2.d
    text: bioraffinage van aquatische biomassa.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.2
  - number: 9.2.3
    text: 'Geen subsidie wordt verstrekt aan:'
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.2
  - number: 9.2.3.a
    text: projecten die betrekking hebben op de productie van biomassa en teelt van aquatische biomassa;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.2
  - number: 9.2.3.b
    text: projecten die uitsluitend betrekking hebben op de productie van biobrandstoffen of energie;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.2
  - number: 9.2.3.c
    text: |-
      projecten die betrekking hebben op ontwikkeling en demonstratie van zogenaamde eerste generatie
      biobrandstoftechnologie.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.2
  - number: 9.2.4
    text: |-
      De productie van biobrandstoffen kan slechts onderdeel uitmaken van een demonstratieproject bioraffinage of een
      pilotproject bioraffinage, indien:
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.2
  - number: 9.2.4.a
    text: |-
      het project betrekking heeft op de geïntegreerde co-productie van biobrandstoffen met andere vermarktbare
      producten, zoals voedsel, veevoer, chemicaliën en energie;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.2
  - number: 9.2.4.b
    text: het biobrandstoffendeel betrekking heeft op de productie van geavanceerde biobrandstoffen.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.2
  - number: 9.3.1
    text: Een samenwerkingsverband dat een demonstratieproject bioraffinage uitvoert, bestaat alleen uit ondernemers.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.3
  - number: 9.3.2
    text: Een samenwerkingsverband dat een pilotproject bioraffinage uitvoert, bestaat uit ten minste een ondernemer.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.3
  - number: 9.3.3
    text: De penvoerder in een samenwerkingsverband dat een pilotproject bioraffinage uitvoert is een ondernemer.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.3
  - number: 9.4.1
    text: |-
      In aanvulling op [artikel 1.3, eerste lid][ref1], bedraagt de subsidie voor een pilotproject bioraffinage niet
      meer dan € 1000.000.


      [ref1]: https://wetten.overheid.nl/BWBR0024452#Artikel1
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0024452
        artikel: '1'
        hoofdstuk: '1'
  - number: 9.4.2
    text: |-
      In afwijking van [artikel 1.3][ref1] bedraagt de subsidie voor een demonstratieproject bioraffinage 35% van de
      subsidiabele kosten gemaakt door de ondernemer, maar niet meer dan € 4.000.000.


      [ref1]: https://wetten.overheid.nl/BWBR0024452#Artikel1
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0024452
        artikel: '1'
        hoofdstuk: '1'
  - number: 9.4.3
    text: |-
      Het in het tweede lid genoemde percentage wordt met 10 procentpunten verhoogd voor iedere aanvrager die een
      middelgrote onderneming in stand houdt voor zover de subsidiabele kosten worden gemaakt en betaald door die
      ondernemer.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.4
  - number: 9.4.4
    text: |-
      Het in het tweede lid genoemde percentage wordt met 20 procentpunten verhoogd voor iedere aanvrager die een kleine
      onderneming in stand houdt voor zover de subsidiabele kosten worden gemaakt en betaald door die ondernemer.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.4
  - number: 9.4.5
    text: |-
      Voor de berekening van de in het tweede lid genoemde subsidiabele kosten is [artikel 1.6][ref1] van toepassing
      met dien verstande dat onder sub c en d van het vijfde lid van [artikel 1.6][ref2] de woorden ‘duurzame
      energiehuishouding’ worden gelezen als: toename van het niveau van milieubescherming.


      [ref1]: https://wetten.overheid.nl/BWBR0024452#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0024452#Artikel1
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0024452
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0024452
        artikel: '1'
        hoofdstuk: '1'
  - number: '9.5'
    text: De Minister van LNV verdeelt het beschikbare bedrag op volgorde van rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.5
  - number: 9.6.1
    text: |-
      Op een subsidie voor een pilotproject bioraffinage is niet van toepassing
      [artikel 23, onderdelen a en g, van het Kaderbesluit EZ-subsidies][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.6
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 9.6.2
    text: |-
      Op een subsidie voor een demonstratieproject bioraffinage zijn niet van toepassing de
      [artikelen 10 derde lid][ref1], [23 onderdelen a en g][ref2], [38, eerste lid, onderdelen b tot en met d][ref3],
      en [41 van het Kaderbesluit EZ-subsidies][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0024796#Artikel38
      [ref4]: https://wetten.overheid.nl/BWBR0024796#Artikel41
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.6
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '23'
      - id: ref3
        bwb_id: BWBR0024796
        artikel: '38'
      - id: ref4
        bwb_id: BWBR0024796
        artikel: '41'
  - number: 9.7.1
    text: |-
      Er is een Adviescommissie bioraffinage, die tot taak heeft de Minister van LNV op zijn verzoek te adviseren omtrent
      aanvragen om subsidie op grond van [artikel 9.2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024452#Artikel9
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.7
    references:
      - id: ref1
        bwb_id: BWBR0024452
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.7.2
    text: De commissie bestaat uit een voorzitter en twee andere leden.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.7
  - number: 9.7.3
    text: De voorzitter en de leden worden benoemd voor een termijn van één jaar.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.7
  - number: 9.8.1
    text: |-
      De Adviescommissie bioraffinage adviseert de Minister van LNV over de afwijzingsgronden, bedoeld in het tweede lid
      en [artikel 23 b, c, d, e, f, en h van het Kaderbesluit EZ-subsidies][ref1] en de rangschikkingscriteria, bedoeld
      in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.8
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 9.8.2
    text: 'De Minister van LNV beslist afwijzend op een aanvraag voor zover hij van oordeel is dat:'
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.8
  - number: 9.8.2.a
    text: |-
      het demonstratieproject bioraffinage of het pilotproject bioraffinage onvoldoende bijdraagt aan de doelstellingen
      van de regeling;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.8
  - number: 9.8.2.b
    text: |-
      het een subsidie-ontvanger betreft die een ondernemer is tegen wie een bevel tot terugvordering uitstaat als
      bedoeld in artikel 1, zesde lid, onderdeel a, van de algemene groepsvrijstellingsverordening.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.8
  - number: 9.8.3
    text: 'De Minister van LNV rangschikt de aanvragen waarop niet afwijzend is beslist, hoger naarmate:'
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.8
  - number: 9.8.3.a
    text: |-
      het demonstratieproject bioraffinage of het pilotproject bioraffinage meer bijdraagt aan de ontwikkeling en
      demonstratie van bioraffinagefaciliteiten, die leiden tot meerdere vermarktbare producten;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.8
  - number: 9.8.3.b
    text: |-
      het demonstratieproject bioraffinage of het pilotproject bioraffinage meer bijdraagt aan een verduurzaming van de
      grondstofvoorziening voor de industrie (bijv. chemische) en de energiesector;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.8
  - number: 9.8.3.c
    text: |-
      het demonstratieproject bioraffinage of het pilotproject bioraffinage meer herhalings- en opschalingspotentieel
      bezit, gebaseerd op kostprijsontwikkeling en marktverwachting;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.8
  - number: 9.8.3.d
    text: |-
      het demonstratieproject bioraffinage of het pilotproject bioraffinage technologisch innovatiever is ten opzichte
      van de huidige nationale en internationale praktijk.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.8
  - number: 9.8.4
    text: |-
      Voor de rangschikking weegt het in het eerste lid, onderdeel a, genoemde criterium mee voor 35/100, het in het
      eerste lid, onderdeel b, genoemde criterium voor 30/100, het in het eerste lid, onderdeel c, genoemde criterium
      voor 20/100 en het in het eerste lid, onderdeel d, genoemde criterium voor 15/100. Er geldt een drempel van 60 van
      de 100 punten.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.8
  - number: 9.9.1
    text: |-
      Een aanvraag wordt niet ingediend dan nadat daarover door de Adviescommissie bioraffinage aan de aanvrager advies
      is uitgebracht op basis van een vooraanmelding.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.9
  - number: 9.9.2
    text: |-
      De Adviescommissie baseert zich op de afwijzingsgronden en rangschikkingcriteria, bedoeld in
      [artikel 9.8, leden 1, 2 en 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024452#Artikel9
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.9
    references:
      - id: ref1
        bwb_id: BWBR0024452
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.10.1
    text: |-
      De subsidieontvanger start binnen zes maanden na datum van de beschikking tot subsidieverlening met de uitvoering
      van het demonstratieproject bioraffinage of het pilotproject bioraffinage.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.10
  - number: 9.10.2
    text: |-
      De subsidieontvanger voltooit het demonstratieproject bioraffinage binnen drie jaar na aanvang van het
      demonstratieproject bioraffinage.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.10
  - number: 9.10.3
    text: |-
      De subsidieontvanger voltooit het pilotproject bioraffinage binnen drie jaar na aanvang van het pilotproject
      bioraffinage.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.10
  - number: 9.11.1
    text: |-
      De subsidieontvanger voert het demonstratieproject bioraffinage of het pilotproject bioraffinage hoofdzakelijk
      in Nederland uit, behoudens voorafgaande schriftelijke ontheffing van de Minister van LNV voor (gedeeltelijke)
      uitvoering buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.11
  - number: 9.11.2
    text: Aan een ontheffing als bedoeld in het eerste lid kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.11
  - number: '9.12'
    text: |-
      In aanvulling op de [artikelen 37][ref1] en [39, eerste lid, van het Kaderbesluit EZ-subsidies][ref2] staan aan
      de hand van het Toetsingskader voor duurzame biomassa in het projectplan en de eindrapportage ook gegevens over de
      duurzaamheid van de gebruikte biomassa in het demonstratieproject bioraffinage of in het pilotproject bioraffinage.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel39
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.12
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '37'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '39'
  - number: 9.13.1
    text: |-
      Dit hoofdstuk valt onder de verordening (EG) nr. 800/2008 van de Commissie van de Europese Gemeenschappen van
      6 augustus 2008 waarbij bepaalde categorieën steun op grond van de artikelen 87 en 88 van het Verdrag met de
      gemeenschappelijke markt verenigbaar worden verklaard (‘de algemene groepsvrijstellingsverordening’) (PbEU L214).
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.13
  - number: 9.13.2
    text: |-
      Aan de aanvrager wordt geen subsidie verstrekt indien daardoor zou worden gehandeld in strijd met de algemene
      groepsvrijstellingsverordening.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.13
  - number: 9.14.1
    text: |-
      Een vooraanmelding wordt ingediend met gebruikmaking van het formulier, opgenomen in [bijlage 9.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024452
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.14
    references:
      - id: ref1
        bwb_id: BWBR0024452
  - number: 9.14.2
    text: |-
      Een aanvraag om subsidie wordt ingediend met gebruikmaking van het formulier, opgenomen in [bijlage 9.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024452
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.14
    references:
      - id: ref1
        bwb_id: BWBR0024452
  - number: 9.14.3
    text: |-
      Een aanvraag om subsidievaststelling voor een demonstratieproject bioraffinage wordt ingediend met gebruikmaking
      van het formulier, opgenomen in [bijlage 9.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024452
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.14
    references:
      - id: ref1
        bwb_id: BWBR0024452
  - number: 9.14.4
    text: |-
      Een aanvraag om subsidievaststelling voor een pilotproject bioraffinage wordt ingediend met gebruikmaking van het
      formulier, opgenomen in [bijlage 9.4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024452
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel9.14
    references:
      - id: ref1
        bwb_id: BWBR0024452
  - number: '10.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder: - *demonstratieproject vergassing:* een project waarin vergassingstechniek
      wordt gedemonstreerd en doorontwikkeld tot een continue bedrijfsvoering, waarvan de schaalgrootte minimaal 10 MW
      en maximaal 50 MW (input thermisch) bedraagt, waarvoor zuivere biomassa, biomassa mengstromen of afvalfracties als
      brandstof dienen en waarvan het synthesegas wordt gebruikt voor warmtekracht/koppeling, toepassing in de industrie,
      opwerking tot vervangend aardgas of andere hoogwaardige energiedragers alsmede de verspreiding van de verkregen
      kennis en de vermarkting van de ontwikkelde technologie;
        - *vergassing:* een thermisch proces dat plaatsvindt bij temperaturen boven 800 °C, waarbij de brandstof met een
      hoog rendement wordt omgezet in een synthesegas dat flexibel inzetbaar is;
        - *voorbereidingsstudie:* een studie ter voorbereiding van een aanvraag voor een demonstratieproject vergassing
      waarbij de aanvrager onderzoekt of en aantoont dat de door hem ontwikkelde technologie voldoet aan de eisen die
      zijn gesteld aan een demonstratieproject vergassing.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel10.1
  - number: 10.2.1
    text: De Minister verstrekt op aanvraag een subsidie voor een voorbereidingsstudie.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel10.2
  - number: 10.2.2
    text: De Minister verstrekt op aanvraag een subsidie voor een demonstratieproject vergassing.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel10.2
  - number: 10.2.3
    text: |-
      In aanvulling op [artikel 3, eerste lid, van het Kaderbesluit EZ-subsidies][ref1] zijn het eerste en tweede lid
      ook van toepassing op niet in Nederland gevestigde deelnemers in een samenwerkingsverband waarvan de penvoerder in
      Nederland is gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel3
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel10.2
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '3'
  - number: 10.2.4
    text: Geen subsidie wordt verstrekt aan natuurlijke personen.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel10.2
  - number: '10.3'
    text: |-
      Op een subsidie voor een demonstratieproject vergassing zijn niet van toepassing de
      [artikelen 10, derde lid][ref1], en [41 van het Kaderbesluit EZ-subsidies][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel41
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '41'
  - number: 10.4.1
    text: |-
      De subsidie, bedoeld in [artikel 10.2, eerste lid][ref1], bedraagt 50 procent van de subsidiabele kosten, maar niet
      meer dan € 25 000 per project.


      [ref1]: https://wetten.overheid.nl/BWBR0024452#Artikel10
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel10.4
    references:
      - id: ref1
        bwb_id: BWBR0024452
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.4.2
    text: |-
      De subsidie, bedoeld in [artikel 10.2, derde lid][ref1], bedraagt 40 procent van de subsidiabele kosten, maar niet
      meer dan € 4 000 000 per project.


      [ref1]: https://wetten.overheid.nl/BWBR0024452#Artikel10
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel10.4
    references:
      - id: ref1
        bwb_id: BWBR0024452
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.4.3
    text: |-
      Het in het tweede lid genoemde percentage wordt met 10 procentpunten verhoogd voor iedere aanvrager die een kleine
      of middelgrote onderneming in stand houdt, voor zover de subsidiabele kosten worden gemaakt en betaald door die
      ondernemer.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel10.4
  - number: 10.4.4
    text: |-
      Voor de berekening van de subsidiabele kosten van een demonstratieproject vergassing is [artikel 1.6][ref1] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024452#Artikel1
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel10.4
    references:
      - id: ref1
        bwb_id: BWBR0024452
        artikel: '1'
        hoofdstuk: '1'
  - number: 10.5.1
    text: |-
      De Minister beslist op de aanvragen om subsidie als bedoeld in [artikel 10.2, eerste lid][ref1], in de volgorde van
      binnenkomst van de aanvragen.


      [ref1]: https://wetten.overheid.nl/BWBR0024452#Artikel10
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel10.5
    references:
      - id: ref1
        bwb_id: BWBR0024452
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.5.2
    text: |-
      De Minister beslist op de aanvragen om subsidie als bedoeld in [artikel 10.2, tweede lid][ref1], op de volgorde van
      rangschikking van de aanvragen.


      [ref1]: https://wetten.overheid.nl/BWBR0024452#Artikel10
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel10.5
    references:
      - id: ref1
        bwb_id: BWBR0024452
        artikel: '10'
        hoofdstuk: '10'
  - number: '10.6'
    text: |-
      In aanvulling op [artikel 23 van het Kaderbesluit EZ-subsidies][ref1] beslist de Minister afwijzend op een aanvraag
      voor een subsidie als bedoeld in [artikel 10.2, eerste lid][ref2], indien de aanvrager geen aantoonbare ervaring
      heeft in innovatieve vergassingstechnologie.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0024452#Artikel10
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel10.6
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0024452
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.7.1
    text: |-
      Er is een Adviescommissie demonstratieprojecten vergassing, die tot taak heeft de Minister op zijn verzoek te
      adviseren omtrent aanvragen om subsidie op grond van [artikel 10.2, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024452#Artikel10
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel10.7
    references:
      - id: ref1
        bwb_id: BWBR0024452
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.7.2
    text: De commissie bestaat uit een voorzitter en vier andere leden.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel10.7
  - number: 10.7.3
    text: De voorzitter en de leden worden benoemd voor een termijn van vier jaar.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel10.7
  - number: 10.8.1
    text: |-
      De Adviescommissie demonstratieprojecten vergassing adviseert de Minister over de afwijzingsgronden bedoeld in
      [artikel 23, onderdelen e, f en h, van het Kaderbesluit EZ-subsidies][ref1] en de rangschikking, bedoeld in het
      derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel10.8
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 10.8.2
    text: |-
      In aanvulling op [artikel 23 van het Kaderbesluit EZ-subsidies][ref1] beslist de Minister afwijzend op een aanvraag
      om subsidie als bedoeld in artikel 10, tweede lid, indien hij van oordeel is dat het project onvoldoende bijdraagt
      aan de doelstellingen van de regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel10.8
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 10.8.3
    text: |-
      De Minister rangschikt de aanvragen voor een subsidie als bedoeld in artikel 10, tweede lid, waarop niet afwijzend
      is beslist, hoger naarmate:
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel10.8
  - number: 10.8.3.a
    text: het project technologisch en niet-technologisch innovatiever is ten opzichte van de huidige praktijk in Nederland;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel10.8
  - number: 10.8.3.b
    text: |-
      het project meer bijdraagt aan de verduurzaming van de energiehuishouding in CO reductie of PJ per jaar op
      projectniveau;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel10.8
  - number: 10.8.3.c
    text: het project meer herhalingspotentieel bezit, gebaseerd op kostprijsontwikkeling en marktverwachting;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel10.8
  - number: 10.8.3.d
    text: |-
      het samenwerkingsverband van een betere kwaliteit is, de slaagkans van het project groter is en de kennisoverdracht
      een meer structureel onderdeel is van de demonstratie;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel10.8
  - number: 10.8.3.e
    text: |-
      een beter plan voorligt voor de opstartfase van de vergasser teneinde de vergassingstechnologie door te ontwikkelen
      tot een continue bedrijfsvoering van ten minste 5000 uur/jaar;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel10.8
  - number: 10.8.3.f
    text: een beter marketingplan voorligt om de vergassingstechnologie uit te rollen in Nederland.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel10.8
  - number: 10.8.4
    text: Voor de rangschikking wegen de criteria genoemd in het derde lid even zwaar.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel10.8
  - number: 10.9.1
    text: |-
      De subsidieontvanger voltooit de voorbereidingsstudie binnen zes maanden na datum van de beschikking tot
      subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel10.9
  - number: 10.9.2
    text: |-
      De subsidieontvanger start het demonstratieproject vergassing binnen zes maanden na de datum van de beschikking tot
      subsidieverlening en voltooit het uiterlijk binnen 4 jaar na de start van het project.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel10.9
  - number: 10.9.3
    text: De subsidieontvanger voert het demonstratieproject vergassing in Nederland uit.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel10.9
  - number: 10.9.4
    text: |-
      De subsidieontvanger verleent medewerking aan evaluatie van de effecten van het door hem uitgevoerde
      demonstratieproject vergassing, voor zover deze medewerking redelijkerwijs van hem verlangd kan worden.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel10.9
  - number: 10.9.5
    text: |-
      De verplichting, bedoeld in het vierde lid, geldt gedurende vijf jaar na de datum van de beschikking tot
      subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel10.9
  - number: 10.10.1
    text: |-
      Een aanvraag om subsidie wordt ingediend met gebruikmaking van het formulier, opgenomen in [bijlage 10.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024452
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel10.10
    references:
      - id: ref1
        bwb_id: BWBR0024452
  - number: 10.10.2
    text: |-
      Een aanvraag om subsidievaststelling wordt ingediend met gebruikmaking van het formulier, opgenomen in
      [bijlage 10.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024452
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel10.10
    references:
      - id: ref1
        bwb_id: BWBR0024452
  - number: '11.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder: - *demonstratie van nieuwe technieken:* op bescherming van het milieu
      gerichte activiteiten die een technisch en economisch risico inhouden, waarbij de activiteiten bestaan uit
      het bij de aanvrager treffen van energiebesparende maatregelen of maatregelen die het gebruik van hernieuwbare
      energiebronnen bevorderen met behulp van: 1°. voor Nederland nieuwe apparaten, systemen of technieken; 2°. een voor
      Nederland nieuwe toepassing van apparaten, systemen of technieken;
        - *wind-op-zeeproject:* project voor industrieel onderzoek, experimentele ontwikkeling of demonstratie van nieuwe
      technieken op het gebied van ondersteuningsconstructies of op het gebied elektriciteitsopwekking op zee door middel
      van windturbines met een vermogen van ten minste 4 MW, of een combinatie van beiden.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel11.1
  - number: '11.2'
    text: |-
      De minister verstrekt op aanvraag een subsidie aan degene die in Nederland een wind-op-zeeproject uitvoert dat: -
      geschikt is voor gebruik in windparken op zee, en
        - bijdraagt aan kostenreductie van windenergie op zee.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel11.2
  - number: 11.3.1
    text: De subsidie bedraagt maximaal € 4.500.000 per aanvraag.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel11.3
  - number: 11.3.2
    text: |-
      De subsidie voor demonstratie van nieuwe technieken bedraagt 50% van de subsidiabele kosten. Het percentage wordt
      verhoogd met 10 procentpunten voor iedere aanvrager die een middelgrote onderneming in stand houdt en met 20
      procentpunten voor iedere aanvrager die een kleine onderneming in stand houdt voor zover de subsidiabele kosten
      worden gemaakt en betaald door die ondernemer.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel11.3
  - number: 11.3.3
    text: |-
      Voor de berekening van de subsidiabele kosten met betrekking tot demonstratie van nieuwe technieken is
      [artikel 1.6][ref1] van toepassing. In afwijking van [artikel 1.6, zevende lid][ref2], maken de aan derden
      verschuldigde kosten, bedoeld in [artikel 1.6, derde lid, onderdeel h][ref3], ten hoogste 70 procent uit van de som
      van de per kostensoort berekende investeringskosten van het project verminderd met de referentiekosten.


      [ref1]: https://wetten.overheid.nl/BWBR0024452#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0024452#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0024452#Artikel1
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel11.3
    references:
      - id: ref1
        bwb_id: BWBR0024452
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0024452
        artikel: '1'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0024452
        artikel: '1'
        hoofdstuk: '1'
  - number: '11.4'
    text: De minister verdeelt het beschikbare bedrag op volgorde van rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel11.4
  - number: 11.5.1
    text: |-
      De Adviescommissie lange termijn energieonderzoek en nieuw energieonderzoek, bedoeld in
      [artikel 5 van het Besluit EOS: lange termijn][ref1], heeft tevens tot taak de minister op zijn verzoek te adviseren
      omtrent de afwijzingsgronden, bedoeld in [artikel 23, onderdeel e, g en h van het Kaderbesluit EZ-subsidies][ref2]
      en de rangschikkingscriteria, bedoeld in [artikel 11.6][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017234#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0024452#Artikel11
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel11.5
    references:
      - id: ref1
        bwb_id: BWBR0017234
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '23'
      - id: ref3
        bwb_id: BWBR0024452
        artikel: '11'
        hoofdstuk: '11'
  - number: 11.5.2
    text: |-
      De termijn, bedoeld in [artikel 23, onderdeel c, van het Kaderbesluit EZ-subsidies][ref1], is vier jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel11.5
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 11.6.1
    text: |-
      De minister rangschikt de aanvragen waarop niet afwijzend is beslist, zodanig dat een project hoger gerangschikt
      wordt naarmate het meer bijdraagt aan de criteria omtrent:
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel11.6
  - number: 11.6.1.a
    text: technologische innovatie;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel11.6
  - number: 11.6.1.b
    text: duurzaamheid;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel11.6
  - number: 11.6.1.c
    text: technologische samenwerking;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel11.6
  - number: 11.6.1.d
    text: economisch perspectief.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel11.6
  - number: 11.6.2
    text: |-
      Als criteria voor technologische innovatie, duurzaamheid, technologische samenwerking en economisch perspectief als
      bedoeld in het eerste lid worden respectievelijk vastgesteld:
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel11.6
  - number: 11.6.2.a
    text: |-
      de mate waarin wordt bijgedragen aan technologische vernieuwing of aan wezenlijk nieuwe toepassingen van
      bestaande technologieën, met name gericht op offshore windturbine ontwikkelingen en daarbij behorende
      ondersteuningsconstructies;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel11.6
  - number: 11.6.2.b
    text: |-
      de mate waarin wordt bijgedragen aan verduurzaming van de energiehuishouding, met name in Nederland, in vermeden
      PJ’s of vermeden CO-emissies in 2020 en in 2025;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel11.6
  - number: 11.6.2.c
    text: |-
      de mate van doelmatigheid en doeltreffendheid van een eventueel samenwerkingsverband en de expertise van de
      partijen die het project uitvoeren, waaronder mede verstaan de leveranciers;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel11.6
  - number: 11.6.2.d
    text: |-
      de mate waarin de projectresultaten bijdragen aan de kostprijsdaling van windenergie op zee en economische
      meerwaarde creëren in Nederland.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel11.6
  - number: 11.6.3
    text: Voor de rangschikking wegen de criteria genoemd in het eerste lid even zwaar.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel11.6
  - number: '11.7'
    text: |-
      De subsidie-ontvanger voltooit de activiteiten uiterlijk vier jaar na de datum van de beschikking tot
      subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel11.7
  - number: '11.8'
    text: 'Het formulier voor het indienen van een aanvraag voor:'
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel11.8
  - number: 11.8.a
    text: |-
      een subsidie is opgenomen in [bijlage 11.1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024452
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel11.8
    references:
      - id: ref1
        bwb_id: BWBR0024452
  - number: 11.8.b
    text: |-
      een subsidievaststelling is opgenomen in [bijlage 11.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024452
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel11.8
    references:
      - id: ref1
        bwb_id: BWBR0024452
  - number: '12.1'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel12.1
  - number: '12.2'
    text: 'Deze regeling wordt aangehaald als: Tijdelijke energieregeling markt en innovatie.'
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel12.2
