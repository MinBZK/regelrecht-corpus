  - number: 4.6.3.a
    text: het project technologisch innovatiever is ten opzichte van de huidige praktijk in Nederland;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel4.6
  - number: 4.6.3.b
    text: |-
      het project meer bijdraagt aan de verduurzaming van de energiehuishouding in absolute en relatieve CO2 reductie of
      PJ per jaar op projectniveau;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel4.6
  - number: 4.6.3.c
    text: het project meer herhalingspotentieel bezit, gebaseerd op kostprijsontwikkeling en marktverwachting;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel4.6
  - number: 4.6.3.d
    text: |-
      het samenwerkingsverband van een betere kwaliteit is, de slaagkans van het project groter is en de kennisoverdracht
      een structureler onderdeel is van de demonstratie.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel4.6
  - number: 4.6.4
    text: |-
      Voor de rangschikking weegt het criterium, genoemd in het derde lid, onderdeel a, eenmaal, en het gewogen
      gemiddelde van de criteria, genoemd in het derde lid, onderdeel b tot en met d twee maal.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel4.6
  - number: 4.7.1
    text: |-
      De subsidieontvanger start binnen zes maanden na de datum van de beschikking tot subsidieverlening de uitvoering
      van het EOS-demonstratieproject.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel4.7
  - number: 4.7.2
    text: De subsidieontvanger voltooit het project binnen drie jaar na aanvang van het EOS-demonstratieproject.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel4.7
  - number: 4.8.1
    text: |-
      Een aanvraag om subsidie wordt ingediend met gebruikmaking van het formulier, opgenomen in [bijlage 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024452
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0024452
  - number: 4.8.2
    text: |-
      Een aanvraag om subsidievaststelling wordt ingediend met gebruikmaking van het formulier, opgenomen in
      [bijlage 10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024452
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0024452
  - number: '5.1'
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel5.1
  - number: 5.1.a
    text: |-
      *haalbaarheidsstudie:* een studie waarin de technische en economische haalbaarheid wordt onderzocht van een of meer
      pakketten maatregelen die erop gericht zijn om een school of kantoor, die de aanvrager gaat bouwen of renoveren, te
      laten voldoen aan de vereisten van een unieke kansen project scholen/kantoren, daaronder begrepen de mogelijkheden
      voor strategische samenwerking;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel5.1
  - number: 5.1.b
    text: |-
      *onderwijsinstelling:* een publiek bekostigde school voor basisonderwijs of voortgezet onderwijs, als bedoeld in de
      [Wet op het primair onderwijs][ref1] respectievelijk de [Wet op het voortgezet onderwijs][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0002399
  - number: 5.1.c
    text: |-
      *totale energieverbruik:* de som van het gebouwgebonden energieverbruik, het gebouwafhankelijke
      gebruikersenergieverbruik en het energieverbruik van gebruikersapparatuur per jaar;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel5.1
  - number: 5.1.d
    text: |-
      *NEN:* norm als bedoeld in [artikel 1.1, eerste lid, van het Bouwbesluit 2003][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012727#Artikel1
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0012727
        artikel: '1'
  - number: 5.1.e
    text: |-
      *unieke kansen project scholen/kantoren:* project voor energiebesparing in de nieuwbouw of renovatie
      van gebouwen waarin ten minste 70% van de bruto vloeroppervlakte, als bedoeld in NEN 2580, in gebruik
      is voor een onderwijsfunctie ten behoeve van een onderwijsinstelling of een kantoorfunctie, bedoeld in
      [artikel 1.1, derde lid, van het Bouwbesluit 2003][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0012727#Artikel1
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0012727
        artikel: '1'
  - number: 5.1.e.1°
    text: dat tenminste 1000 m2 bruto vloeroppervlakte omvat;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel5.1
  - number: 5.1.e.2°
    text: |-
      dat wordt uitgevoerd door een samenwerkingsverband, waarbij bij ten minste een van de deelnemers technische of
      beheersmatige voorzieningen worden getroffen;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel5.1
  - number: 5.1.e.3°
    text: |-
      waarbij, indien het renovatie van bestaande gebouwen met een kantoorfunctie betreft, de CO-emissie ten gevolge van
      het totale energieverbruik van en binnen het gebouw ten hoogste 53 kg CO/m2 bruto vloeroppervlakte bedraagt;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel5.1
  - number: 5.1.e.4°
    text: |-
      waarbij, indien het renovatie van bestaande gebouwen met een onderwijsfunctie betreft, de CO-emissie ten gevolge
      van het totale energieverbruik van en binnen het gebouw ten hoogste 25 kg CO/m2 bruto vloeroppervlakte bedraagt;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel5.1
  - number: 5.1.e.5°
    text: |-
      waarbij, indien het nieuwbouw met een kantoorfunctie betreft, de maximale energieprestatiecoëfficiënt 0,75 en
      de CO-emissie ten gevolge van het totale energieverbruik van en binnen het gebouw ten hoogste 37 kg CO/m2 bruto
      vloeroppervlakte bedraagt;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel5.1
  - number: 5.1.e.6°
    text: |-
      waarbij, indien het nieuwbouw met een onderwijsfunctie betreft, de maximale energieprestatiecoëfficiënt 0,90
      bedraagt en de CO-emissie ten gevolge van het totale energieverbruik van en binnen het gebouw ten hoogste 22 kg CO/
      m2 bruto vloeroppervlakte bedraagt en
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel5.1
  - number: 5.1.e.7°
    text: |-
      waarbij, indien het renovatie van bestaande gebouwen betreft, de energieprestatie na renovatie energielabelklasse A
      bedraagt en de energie-index met ten minste 0,30 verbetert.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel5.1
  - number: 5.2.1
    text: De Minister verstrekt op aanvraag een subsidie voor een haalbaarheidsstudie.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel5.2
  - number: 5.2.2
    text: |-
      De Minister verstrekt op aanvraag aan een samenwerkingsverband een subsidie verlenen voor een unieke kansen project
      scholen/kantoren.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel5.2
  - number: '5.3'
    text: |-
      Op een subsidie voor een unieke kansen project scholen/kantoren zijn niet van toepassing
      de [artikelen 10, derde lid][ref1], [38, eerste lid, onderdeel b tot en met d][ref2], en
      [41 van het Kaderbesluit EZ-subsidies][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0024796#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0024796#Artikel41
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0024796
        artikel: '38'
      - id: ref3
        bwb_id: BWBR0024796
        artikel: '41'
  - number: 5.4.1
    text: |-
      In afwijking van [artikel 1.3][ref1] bedraagt de subsidie, bedoeld in [artikel 5.2][ref2], eerste lid, 50% van de
      projectkosten indien deze betrekking hebben op een haalbaarheidsstudie, maar niet meer dan € 15.000.


      [ref1]: https://wetten.overheid.nl/BWBR0024452#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0024452#Artikel5
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0024452
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0024452
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.4.2
    text: |-
      In afwijking van [artikel 1.3][ref1] bedraagt de subsidie, bedoeld in [artikel 5.2][ref2], tweede lid:


      [ref1]: https://wetten.overheid.nl/BWBR0024452#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0024452#Artikel5
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0024452
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0024452
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.4.2.a
    text: |-
      voor een unieke kansen project scholen/kantoren met een onderwijsfunctie: € 0,25 per jaarlijkse MJ besparing op het
      gebouwgebonden primaire energieverbruik, maar niet meer dan € 500.000;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel5.4
  - number: 5.4.2.b
    text: |-
      voor een unieke kansen project scholen/kantoren met een kantoorfunctie: € 0,15 per jaarlijkse MJ besparing op het
      gebouwgebonden primaire energieverbruik, maar niet meer dan € 500.000.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel5.4
  - number: 5.4.3
    text: De subsidie valt onder de algemene groepsvrijstellingsverordening.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel5.4
  - number: 5.5.1
    text: |-
      De Minister beslist op de aanvragen om subsidie als bedoeld in [artikel 5.2, eerste lid][ref1], in de volgorde van
      binnenkomst van de aanvragen.


      [ref1]: https://wetten.overheid.nl/BWBR0024452#Artikel5
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0024452
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.5.2
    text: |-
      De Minister beslist op de aanvragen om subsidie als bedoeld in [artikel 5.2, tweede lid][ref1], op volgorde van
      rangschikking van de aanvragen.


      [ref1]: https://wetten.overheid.nl/BWBR0024452#Artikel5
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0024452
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.6.1
    text: |-
      De adviescommissie energiedemonstratieprojecten en energietransitie-experimenten adviseert de Minister over de
      afwijzingsgronden, bedoeld in [artikel 23, onderdelen e tot en met h van het Kaderbesluit EZ-subsidies][ref1], en
      de rangschikking, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 5.6.2
    text: |-
      De Minister rangschikt de aanvragen voor een subsidie als bedoeld in [artikel 5.2, tweede lid][ref1], waarop niet
      afwijzend is beslist, hoger naarmate:


      [ref1]: https://wetten.overheid.nl/BWBR0024452#Artikel5
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0024452
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.6.2.a
    text: |-
      het project meer bijdraagt aan de CO-reductie per m2 bruto vloeroppervlakte berekend over het totale
      energieverbruik en meer gebruik maakt van duurzame energiebronnen;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel5.6
  - number: 5.6.2.b
    text: het project voor een gebouw met een onderwijsfunctie meer bijdraagt aan de verbetering van het binnenklimaat;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel5.6
  - number: 5.6.2.c
    text: |-
      het project een hoger innovatief vermogen heeft, meer duurzaamheidskwaliteiten heeft en een betere
      kwaliteitsborging heeft;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel5.6
  - number: 5.6.2.d
    text: het samenwerkingsverband van een betere kwaliteit is en de slaagkans van het project groter is;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel5.6
  - number: 5.6.2.e
    text: het project meer herhalings- en opschalingspotentieel bezit.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel5.6
  - number: 5.6.3
    text: Voor de rangschikking wegen de criteria genoemd in het tweede lid even zwaar.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel5.6
  - number: 5.7.1
    text: |-
      De subsidieontvanger voltooit de haalbaarheidsstudie binnen zes maanden na de datum van de beschikking tot
      subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel5.7
  - number: 5.7.2
    text: |-
      De subsidieontvanger start het unieke kansen project scholen/kantoren binnen zes maanden na de datum van de
      beschikking tot subsidieverlening en voltooit deze uiterlijk 36 maanden na de start van het project.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel5.7
  - number: 5.8.1
    text: |-
      Een aanvraag om subsidie wordt ingediend met gebruikmaking van het formulier, opgenomen in [bijlage 11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024452
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0024452
  - number: 5.8.2
    text: |-
      Een aanvraag om subsidievaststelling wordt ingediend met gebruikmaking van het formulier, opgenomen in
      [bijlage 12][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024452
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0024452
  - number: '6.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder - *keten voor biomassa:* de productie, de verwerking en de import van
      in het buitenland geproduceerde biomassa die leidt tot de toepassing van biomassa voor energie-, transport- of
      chemiedoeleinden in Nederland;
        - *primaire landbouwproducent:* onderneming van de landbouwproductiesector in de zin van artikel 2, eerste lid, van
      verordening (EG) nr. 1535/2007 van de Commissie van de Europese Gemeenschappen van 20 december 2007 betreffende de
      toepassing van de artikelen 87 en 88 van het EG-Verdrag op de-minimissteun in de landbouwproductiesector;
        - *Toetsingskader voor duurzame biomassa:* het toetsingskader opgesteld door de projectgroep Duurzame productie van
      biomassa, opgenomen in [bijlage 13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024452
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0024452
  - number: 6.2.1
    text: |-
      De Minister verstrekt op aanvraag een subsidie voor activiteiten die op innovatieve wijze bijdragen aan het
      verduurzamen van ketens voor biomassa.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel6.2
  - number: 6.2.2
    text: 'Onder het verduurzamen van ketens voor biomassa bedoeld in het eerste lid wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel6.2
  - number: 6.2.2.a)
    text: het verduurzamen van de biomassaketen aan de hand van het Toetsingskader voor duurzame biomassa;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel6.2
  - number: 6.2.2.b)
    text: de certificering van duurzame biomassaketens; of
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel6.2
  - number: 6.2.2.c)
    text: het tegengaan van ongewenste indirecte effecten van biomassaproductie.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel6.2
  - number: 6.2.3
    text: |-
      In aanvulling op [artikel 3, eerste lid, van het Kaderbesluit EZ-subsidies][ref1] verstrekt de Minister
      de subsidie, bedoeld in het eerste lid, tevens aan een niet in Nederland gevestigde deelnemer in een
      samenwerkingsverband waarvan de penvoerder in Nederland is gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel3
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '3'
  - number: 6.3.1
    text: 'De subsidie bedraagt maximaal:'
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel6.3
  - number: 6.3.1.a
    text: € 500.000 per ondernemer, niet zijnde een binnen de Europese Unie gevestigde primaire landbouwproducent;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel6.3
  - number: 6.3.1.b
    text: € 7.500 per binnen de Europese Unie gevestigde primaire landbouwproducent;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel6.3
  - number: 6.3.1.c
    text: € 1.000.000 per aanvraag.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel6.3
  - number: 6.3.2
    text: 'De subsidie bedraagt:'
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel6.3
  - number: 6.3.2.a
    text: 50% van de subsidiabele kosten indien de subsidie-ontvanger een ondernemer is;
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel6.3
  - number: 6.3.2.b
    text: 75% van de subsidiabele kosten indien de subsidie-ontvanger geen ondernemer is.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel6.3
  - number: 6.3.3
    text: Voor subsidie komen in aanmerking de kosten die noodzakelijk zijn voor de verduurzaming van ketens voor biomassa.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel6.3
  - number: 6.3.4
    text: |-
      In afwijking van [artikel 11, eerste lid, van het Kaderbesluit EZ-subsidies][ref1] kiest een buiten Nederland
      gevestigde aanvrager voor de berekening van de subsidiabele kosten uit:


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel11
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '11'
  - number: 6.3.4.a
    text: |-
      de integrale kostensystematiek, opgenomen in [artikel 12 van het Kaderbesluit EZ-subsidies][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel12
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '12'
  - number: 6.3.4.b
    text: |-
      de loonkosten plus vaste-opslag-systematiek, opgenomen in [artikel 13 van het Kaderbesluit EZ-subsidies][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel13
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '13'
  - number: 6.4.1
    text: |-
      De subsidie voor een binnen de Europese Unie gevestigde subsidie-ontvanger, niet zijnde een primaire
      landbouwproducent, valt onder de Tijdelijke communautaire kaderregeling inzake staatssteun ter stimulering van de
      toegang tot financiering in de huidige financiële en economische crisis van 17 december 2008. Het bedrag van de
      subsidie wordt verlaagd voor zover dit nodig is op basis van deze kaderregeling.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel6.4
  - number: 6.4.2
    text: |-
      De subsidie voor een binnen de Europese Unie gevestigde primaire landbouwproducent valt onder verordening (EG) nr.
      1535/2007 van de Commissie van de Europese Gemeenschappen van 20 december 2007 betreffende de toepassing van de
      artikelen 87 en 88 van het EG-Verdrag op de-minimissteun in de landbouwproductiesector. Het bedrag van de subsidie
      wordt verlaagd voor zover dit nodig is op basis van deze verordening.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel6.4
  - number: '6.5'
    text: De Minister verdeelt het beschikbare bedrag op volgorde van rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel6.5
  - number: 6.6.1
    text: |-
      Indien de activiteiten betrekking hebben op vloeibare biomassa of biobrandstoffen beslist de Minister, in
      aanvulling op [artikel 23 van het Kaderbesluit EZ-subsidies][ref1], afwijzend op een aanvraag indien onvoldoende
      vertrouwen bestaat dat de vloeibare biomassa of biobrandstoffen voldoen, of na uitvoering van de activiteiten
      zullen voldoen, aan de duurzaamheidscriteria genoemd in artikel 17 van Richtlijn 2009/28/EG van het Europees
      Parlement en de Raad ter bevordering van het gebruik van energie uit hernieuwbare bronnen en houdende wijziging en
      intrekking van Richtlijnen 2001/77/EG en 2003/30/EG.


      [ref1]: https://wetten.overheid.nl/BWBR0024796#Artikel23
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0024796
        artikel: '23'
  - number: 6.6.2
    text: |-
      De Minister rangschikt de aanvragen waarop niet afwijzend is beslist, zodanig dat een project hoger gerangschikt
      wordt naarmate het meer bijdraagt aan de doelstellingen bedoeld in [artikel 6.2][ref1]. Bij de rangschikking worden
      de volgende criteria gehanteerd:


      [ref1]: https://wetten.overheid.nl/BWBR0024452#Artikel6
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0024452
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.6.2.a
    text: |-
      de mate waarin het project bijdraagt aan de doelstellingen bedoeld in [artikel 6.2][ref1], in relatie tot de totale
      subsidiabele kosten van het project;


      [ref1]: https://wetten.overheid.nl/BWBR0024452#Artikel6
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0024452
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.6.2.b
    text: |-
      de mate waarin het project bijdraagt aan verduurzaming van ketens voor biomassa in de zin van
      [artikel 6.2, tweede lid][ref1], in relatie tot de resultaten van de beoordeling van de betreffende biomassaketen
      aan de hand van het Toetsingskader voor duurzame biomassa;


      [ref1]: https://wetten.overheid.nl/BWBR0024452#Artikel6
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0024452
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.6.2.c
    text: |-
      de mate waarin het project in de praktijk navolging kan vinden en kan worden opgeschaald, waarbij ook de navolging
      en opschaling leiden tot toepassing van duurzame biomassa in Nederland.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel6.6
  - number: 6.6.3
    text: Voor de rangschikking wegen de criteria genoemd in het tweede lid even zwaar.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel6.6
  - number: 6.7.1
    text: De subsidie-ontvanger voltooit de activiteiten uiterlijk op 30 juni 2013.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel6.7
  - number: 6.7.2
    text: |-
      Op verzoek van de Minister verstrekt de subsidie-ontvanger de verkregen gegevens over de duurzaamheid van
      biomassaproductie, certificering en indirecte effecten.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel6.7
  - number: 6.8.1
    text: |-
      Een aanvraag om subsidie wordt ingediend met gebruikmaking van het formulier, opgenomen in [bijlage 14][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024452
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel6.8
    references:
      - id: ref1
        bwb_id: BWBR0024452
  - number: 6.8.2
    text: |-
      Een aanvraag om subsidievaststelling wordt ingediend met gebruikmaking van het formulier, opgenomen in
      [bijlage 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024452
