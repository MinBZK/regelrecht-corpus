  - number: '7.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder: - *elektrisch aangedreven warmtepomp, niet zijnde een elektrisch aangedreven
      lucht/waterwarmtepomp:* een warmtepomp met een elektrisch vermogen groter dan zes kW die bestemd is als hoofd-
      of basisverwarming van een woning en die niet primair gericht is op actieve koeling of verwarming van tapwater,
      waarbij warmte wordt onttrokken aan de bodem, het grondwater of het oppervlaktewater;
        - *elektrisch aangedreven lucht/waterwarmtepomp:* een warmtepomp met een elektrisch vermogen groter dan zes kW
      die bestemd is als hoofd- of basisverwarming van een woning is en niet primair gericht is op actieve koeling of
      verwarming van tapwater, waarbij de warmtepomp warmte onttrekt aan de buitenlucht of aan de ventilatielucht van de
      woning en warmte afgeeft met behulp van een warmte-afgiftesysteem met water als distributiemedium;
        - *warmtepomp:* 1°. een elektrisch aangedreven warmtepomp, niet zijnde een elektrisch aangedreven lucht/
      waterwarmtepomp of 2°. een elektrisch aangedreven lucht/waterwarmtepomp.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel7.1
  - number: 7.2.1
    text: |-
      De minister verstrekt op aanvraag een subsidie voor het treffen van technische maatregelen aan een eigenaar van een
      woning die:
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel7.2
  - number: 7.2.1.a
    text: voor 1 september 2009 een warmtepomp bezit,
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel7.2
  - number: 7.2.1.b
    text: |-
      technische maatregelen met betrekking tot de warmtepomp of de elektriciteitsinstallatie van de woning heeft
      getroffen die een verlaging van de capaciteit van de elektriciteitsaansluiting mogelijk maakt en die noodzakelijk
      zijn in verband met het gebruik van de warmtepomp, en
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel7.2
  - number: 7.2.1.c
    text: |-
      een verzoek om verlaging van de capaciteit van de elektriciteitsaansluiting heeft ingediend bij de regionale
      netbeheerder.
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel7.2
  - number: 7.2.2
    text: 'Op een subsidie als bedoeld in het eerste lid zijn niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0024452/2009-11-20#Artikel7.2
  - number: 7.2.2.a
    text: |-
      [artikel 1.7, onderdeel b][ref1], van deze regeling;


