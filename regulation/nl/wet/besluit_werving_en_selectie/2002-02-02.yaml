---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_werving_en_selectie
regulatory_layer: WET
publication_date: '2017-03-28'
valid_from: '2002-02-02'
bwb_id: BWBR0003860
url: https://wetten.overheid.nl/BWBR0003860/2002-02-02
preamble:
  text: |-
    Gelet op artikel 4a van het Algemeen Rijksambtenarenreglement (Stb. 1931, 248) en artikel 3a van het
    Arbeidsovereenkomstenbesluit (Stb. 1931, 354);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0003860/2002-02-02#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

            a
            bevoegd gezag:

              het tot aanstelling bevoegde gezag of, indien de aanstelling dient te geschieden bij koninklijk
      besluit, de minister, hoofd van het betrokken ministerie, of, indien het de ambtenaar betreft als bedoeld in
      [artikel 7, eerste lid, onder a of c, van het Algemeen Rijksambtenarenreglement][ref1], de Minister, hoofd van het
      betrokken ministerie in overeenstemming met de Minister van Binnenlandse Zaken en Koninkrijksrelaties.



            b
            sollicitant:

              degene die aan het bevoegd gezag kenbaar maakt in aanmerking te willen komen voor een door dat gezag
      beschikbaar gestelde of te stellen arbeidsplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel7
    url: https://wetten.overheid.nl/BWBR0003860/2002-02-02#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '7'
  - number: '2'
    text: |-
      Dit besluit is van toepassing op het vervallen van incidentele vacatures bij de ministeries en Hoge Colleges van
      Staat met de daaronder ressorterende diensten, bedrijven of instellingen, waarbij externe werving plaatsvindt. Bij
      niet-incidentele of niet-externe werving dient de inhoud van dit besluit eveneens in acht te worden genomen.
    url: https://wetten.overheid.nl/BWBR0003860/2002-02-02#Artikel2
  - number: '3'
    text: Er wordt alleen tot bekendmaking van een vacature overgegaan indien deze werkelijk bestaat of wordt verwacht.
    url: https://wetten.overheid.nl/BWBR0003860/2002-02-02#Artikel3
  - number: '4'
    text: |-
      Voordat een vacature wordt bekendgemaakt, worden ten aanzien van die vacature vastgelegd de plaats van de functie
      in de organisatie, de hoofdbestanddelen die de inhoud van de functie bepalen en de eisen en voorwaarden, die uit de
      aard en het niveau van de te vervullen functie voortvloeien.
    url: https://wetten.overheid.nl/BWBR0003860/2002-02-02#Artikel4
  - number: '5'
    text: |-
      De selectieprocedure is functiegericht. De personen die bij de selectie zijn betrokken treden niet verder in de
      persoonlijke levenssfeer van de sollicitant dan voor het selectie-onderzoek noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0003860/2002-02-02#Artikel5
  - number: '6'
    text: |-
      Indien dit noodzakelijk is voor de functie of de arbeidsorganisatie, mogen bij de werving en selectie nadere eisen
      worden gesteld ten aanzien van de leeftijd van de sollicitant.
    url: https://wetten.overheid.nl/BWBR0003860/2002-02-02#Artikel6
  - number: '7'
    text: |-
      Bij bekendmaking van een vacature worden in ieder geval inlichtingen verschaft over de naam en de aard van de
      betreffende diensteenheid, over de omvang en de inhoud van de functie en de eisen ten aanzien van opleiding,
      ervaring, leeftijd en geslacht alsmede over de standplaats, de salariëring, eventuele bijzondere arbeidsvoorwaarden
      en de uiterlijke datum van inzending van de sollicitaties. Wanneer een psychologisch respectievelijk geneeskundig
      onderzoek deel uitmaakt van de selectieprocedure wordt dit eveneens vermeld.
    url: https://wetten.overheid.nl/BWBR0003860/2002-02-02#Artikel7
  - number: '8'
    text: |-
      Per vacature wordt een functionaris aangewezen, die inlichtingen kan verstrekken aan diegenen die nadere informatie
      wensen alvorens te solliciteren.
    url: https://wetten.overheid.nl/BWBR0003860/2002-02-02#Artikel8
  - number: '9'
    text: |-
      Schriftelijke sollicitatie vindt plaats door middel van hetzij een sollicitatiebrief, hetzij een
      solliciatieformulier.
    url: https://wetten.overheid.nl/BWBR0003860/2002-02-02#Artikel9
  - number: '10'
    text: |-
      Een sollicitatieformulier bevat alleen vragen met betrekking tot gegevens die van belang zijn in het eerste stadium
      van de selectieprocedure. Deze betreffen in het algemeen: naam, adres, geslacht, geboortedatum, nationaliteit,
      opleiding en diploma's, beroepsverleden en ervaring, gewenst salaris en opzegtermijn. Het formulier bevat
      bovendien voldoende ruimte voor het geven van een toelichting op de verstrekte gegevens en een motivering van de
      sollicitatie.
    url: https://wetten.overheid.nl/BWBR0003860/2002-02-02#Artikel10
  - number: '11'
    text: |-
      Het aantal personen dat zich tijdens de selectie bezighoudt met de behandeling van de sollicitaties, wordt beperkt
      gehouden.
    url: https://wetten.overheid.nl/BWBR0003860/2002-02-02#Artikel11
  - number: '12'
    text: |-
      Aan de sollicitant wordt onmiddellijk een bericht van ontvangst van zijn sollicitatie gezonden. Er wordt naar
      gestreeft dat de sollicitant uiterlijke veertien dagen na sluiting van de sollicitatieperiode op de hoogte is
      gebracht van de stand van zaken en de verdere gang van zaken met betrekking tot zijn sollicitatie.
    url: https://wetten.overheid.nl/BWBR0003860/2002-02-02#Artikel12
  - number: '13'
    text: |-
      Aan de sollicitant die voor een gesprek wordt uitgenodigd, worden bij die uitnodiging of eventueel in het eerste
      sollicitatiegesprek nadere gegevens verstrekt over de selectieprocedure en over andere voor hem van belang zijnde
      zaken. Daarbij wordt onder meet aangegeven of onderscheidenlijk in welke fase, bijzondere onderzoeken – zoals een
      psychologisch-, een geneeskundig-, een justitieel antecedenten- en een veiligheidsonderzoek – deel zullen uitmaken
      van de procedure.
    url: https://wetten.overheid.nl/BWBR0003860/2002-02-02#Artikel13
  - number: '14'
    text: |-
      Indien drie maanden na sluiting van de sollicitatietermijn nog geen beslissing is genomen, wordt de sollicitant
      geïnformeerd over de stand van zaken en het verdere verloop van de selectieprocedure.
    url: https://wetten.overheid.nl/BWBR0003860/2002-02-02#Artikel14
  - number: '15'
    text: |-
      Zo mogelijk wordt meer dan één persoon bij de selectie van de sollicitant betrokken. Indien een selectie-
      adviescommissie wordt ingesteld, dienen de leden daarvan bij voorkeur verschillende posities ten opzichte van de
      aan te stellen medewerker in te nemen. De bevoegdheden van deze selectie-adviescommissie worden tevoren vastgelegd.
    url: https://wetten.overheid.nl/BWBR0003860/2002-02-02#Artikel15
  - number: '16'
    text: |-
      De positie van waaruit teder lid van een selectie-adviescommissie aan een sollicitatiegesprek deelneemt, wordt de
      sollicitant van te voren, bij voorkeur schriftelijk, medegedeeld
    url: https://wetten.overheid.nl/BWBR0003860/2002-02-02#Artikel16
  - number: '17'
    text: Er worden geen sollicitatiegesprekken gevoerd met verschillende sollicitanten tezamen.
    url: https://wetten.overheid.nl/BWBR0003860/2002-02-02#Artikel17
  - number: '18'
    text: |-
      Bij de beoordeling van de mate van geschiktheid van de sollicitant, vormen de eisen en de voorwaarden die aan de
      vervulling van de vacature zijn verbonden, het uitgangspunt. Tijdens de selectieprocedure worden de gestelde eisen
      en voorwaarden niet gewijzigd.
    url: https://wetten.overheid.nl/BWBR0003860/2002-02-02#Artikel18
  - number: '19'
    text: |-
      Aan de sollicitant worden geen vragen gesteld over de beroepen van zijn familieleden, noch met betrekking tot
      andere aspecten van zijn sociale milieu Afwijking van deze regel vindt alleen plaats indien dit noodzakelijk is in
      het kader van het geneeskundig-, het psychologisch-, het justitieel antecedenten- of het veiligheidsonderzoek.
    url: https://wetten.overheid.nl/BWBR0003860/2002-02-02#Artikel19
  - number: '20'
    text: |-
      Voor zover inlichtingen over de sollicitant worden gevraagd buiten het kader van het geneeskundig-, het
      psychologisch-, het justitieel antecedenten- of het veiligheidsonderzoek, worden deze alleen ingewonnen nadat met
      de sollicitant is overeengekomen bij wie en in welke fase van de selectieprocedure. De informant wordt de inhoud
      van [artikel 21][ref1] medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003860#Artikel21
    url: https://wetten.overheid.nl/BWBR0003860/2002-02-02#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003860
        artikel: '21'
  - number: '21'
    text: |-
      De inlichtingen welke op grond van [artikel 20][ref1] worden ingewonnen staan in direct verband met de te vervullen
      functie. De sollicitant wordt – op diens verzoek – medegedeeld welke betekenis aan de verkregen inlichtingen is
      toegekend en wie deze inlichtingen verstrekt heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003860#Artikel20
    url: https://wetten.overheid.nl/BWBR0003860/2002-02-02#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003860
        artikel: '20'
  - number: '22'
    text: |-
      Gegevens van of over een sollicitant worden zonder diens toestemming niet ter beschikking gesteld noch ter
      inzage gegeven aan personen of instellingen, die niet zijn betrokken bij de selectie voor de functie waarnaar hij
      solliciteert.
    url: https://wetten.overheid.nl/BWBR0003860/2002-02-02#Artikel22
  - number: '23'
    text: |-
      Een psychologisch onderzoek wordt ingesteld als het bevoegde gezag daaraan – in verband met de aard van de
      functie of bepaalde wensen van de sollicitant – voor een verantwoorde beoordeling van de geschiktheid van de
      sollicitant behoefte heeft. Voor psychologisch onderzoek worden uitsluitend potentieel geschikt bevonden kandidaten
      voorgedragen.
    url: https://wetten.overheid.nl/BWBR0003860/2002-02-02#Artikel23
  - number: '24'
    text: |-
      Het psychologisch ondezoek vindt uitsluitend plaats door of onder verantwoordelijkheid van de psycholoog, met
      inachtneming van de daartoe gestelde regels. De sollicitant wordt tevoren schriftelijk op de hoogte gesteld van de
      gang van zaken bij het psychologisch onderzoek en van de rechten die hij in dat verband heeft.
    url: https://wetten.overheid.nl/BWBR0003860/2002-02-02#Artikel24
  - number: '25'
    text: |-
      Indien de sollicitant na kennismaking van het advies niet instemt met het doorgeven van het advies, bericht de
      psycholoog aan de opdrachtgever uitsluitend dat geen advies zal worden uitgebracht.
    url: https://wetten.overheid.nl/BWBR0003860/2002-02-02#Artikel25
  - number: '26'
    text: |-
      Elk psychologisch advies over sollicitanten wordt onmiddellijk na het nemen van de beslissing omtrent al dan niet
      in dienst nemen vernietigd of aan de psycholoog geretourneerd.
    url: https://wetten.overheid.nl/BWBR0003860/2002-02-02#Artikel26
  - number: '27'
    text: |-
      De geneeskundige keuring wordt verricht door de betreffende Bedrijfsgeneeskundige Dienst. De sollicitant wordt door
      de wervende instantie schriftelijk op de hoogte gesteld van de gang van zaken bij de geneeskundige keuring en van
      de rechten die hij in dat verband heeft
    url: https://wetten.overheid.nl/BWBR0003860/2002-02-02#Artikel27
  - number: '28'
    text: |-
      De sollicitant die is doorgedrongen tot de laatste fase van de procedure wordt desgewenst de gelegenheid geboden
      zich ter plaatse op de hoogte te stellen van de arbeidssituatie, indien dit mogelijk is.
    url: https://wetten.overheid.nl/BWBR0003860/2002-02-02#Artikel28
  - number: '29'
    text: |-
      De vergoeding van reis en verblijfkosten die de sollicitant maakt wanneer hij op uitnodiging van de dienst
      deelneemt aan de selectieprocedure en haar onderdelen, geschiedt op de voet van de bepalingen van het
      [Reisbesluit binnenland][ref1], met dien verstande dat de sollicitant voor de toepassing van dat besluit wordt
      geacht de functie met betrekking waartoe gesolliciteerd wordt reeds te bekleden. Het initiatief tot de vergoeding
      van kosten gaat uit van het ministerie of de adviesverlenende instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0005889
    url: https://wetten.overheid.nl/BWBR0003860/2002-02-02#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005889
  - number: 29a
    text: |-
      De kosten van een verklaring omtrent het gedrag als bedoeld in
      [artikel 9, zesde lid, van het Algemeen Rijksambtenarenreglement][ref1], worden door het bevoegd gezag aan de
      sollicitant vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel9
    url: https://wetten.overheid.nl/BWBR0003860/2002-02-02#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '9'
  - number: '30'
    text: |-
      De kosten die de sollicitant maakt wanneer hij inlichtingen wil verkrijgen over de resultaten van onderdelen van de
      selectieprocedure, zoals het psychologisch onderzoek en de medische aanstellingskeuring, worden niet vergoed. Voor
      het verstrekken van inlichtingen worden de sollicitant geen kosten in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0003860/2002-02-02#Artikel30
  - number: '31'
    text: |-
      Een beslissing, die leidt tot afwijzing van een sollicitant, wordt onmiddellijk aan betrokkene ter kennis gebracht
      en niet uitgesteld tot het moment dat in de vacature met zekerheid kan worden voorzien. De afwijzing wordt zo goed
      mogelijk gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0003860/2002-02-02#Artikel31
  - number: '32'
    text: Afspraken en toezeggingen met betrekking tot werkzaamheden en arbeidsvoorwaarden worden schriftelijk vastgelegd.
    url: https://wetten.overheid.nl/BWBR0003860/2002-02-02#Artikel32
  - number: '33'
    text: |-
      Dit besluit, dat met de bijbehorende toelichting zal worden gepubliceerd in de Nederlandse Staatscourant, kan
      worden aangehaald als: Besluit werving en selectie. Het treedt in werking met ingang van 1 oktober 1985.
    url: https://wetten.overheid.nl/BWBR0003860/2002-02-02#Artikel33
