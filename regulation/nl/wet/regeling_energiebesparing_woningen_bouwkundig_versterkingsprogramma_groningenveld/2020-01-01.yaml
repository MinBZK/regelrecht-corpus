  - number: '4'
    text: De subsidie bedraagt 100% van de subsidiabele kosten met een maximum van € 7.000,– per woning.
    url: https://wetten.overheid.nl/BWBR0040901/2020-01-01#Artikel4
  - number: '5.1'
    text: 'De minister beslist afwijzend op een aanvraag indien:'
    url: https://wetten.overheid.nl/BWBR0040901/2020-01-01#Artikel5
  - number: 5.1.a
    text: voor de woning reeds subsidie is verstrekt op grond van deze regeling;
    url: https://wetten.overheid.nl/BWBR0040901/2020-01-01#Artikel5
  - number: 5.1.b
    text: |-
      de aanvraag betrekking heeft op een energiebesparingsmaatregel die bestaat uit een gebruikte installatie voor de
      productie van duurzame energie; of
    url: https://wetten.overheid.nl/BWBR0040901/2020-01-01#Artikel5
  - number: 5.1.c
    text: |-
      de aanvraag niet is ingediend binnen twee jaar nadat is vastgesteld dat er sprake is van een woning als bedoeld
      in [artikel 2, eerste lid][ref1], dan wel, als binnen die twee jaar wordt begonnen met versterking van de woning,
      binnen een jaar na afronding van de versterking.


      [ref1]: https://wetten.overheid.nl/BWBR0040901#Artikel2
    url: https://wetten.overheid.nl/BWBR0040901/2020-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0040901
        artikel: '2'
  - number: '5.2'
    text: 'In afwijking van het eerste lid, onder c, beslist de minister afwijzend op een aanvraag voor een subsidie:'
    url: https://wetten.overheid.nl/BWBR0040901/2020-01-01#Artikel5
  - number: 5.2.1°
    text: |-
      als voor 1 januari 2020 is vastgesteld dat er sprake is van een woning als bedoeld in
      [artikel 2, eerste lid][ref1], en de aanvraag niet is ingediend voor 1 januari 2022, dan wel, als voor 1 januari
      2022 begonnen wordt met versterking van die woning, de aanvraag niet is ingediend binnen een jaar na afronding van
      de versterking; en


      [ref1]: https://wetten.overheid.nl/BWBR0040901#Artikel2
    url: https://wetten.overheid.nl/BWBR0040901/2020-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0040901
        artikel: '2'
  - number: 5.2.2°
    text: |-
      als de versterking van een woning als bedoeld in [artikel 2, eerste lid][ref1], is afgerond voor 28 mei 2018 en de
      aanvraag voor de subsidie niet is ingediend voor 28 mei 2020.


      [ref1]: https://wetten.overheid.nl/BWBR0040901#Artikel2
    url: https://wetten.overheid.nl/BWBR0040901/2020-01-01#Artikel5
