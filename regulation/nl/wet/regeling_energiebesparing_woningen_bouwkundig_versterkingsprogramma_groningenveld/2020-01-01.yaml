    text: |-
      In deze regeling wordt verstaan onder: - *algemene de-minimisverordening:* verordening (EU) nr. 1407/2013 van de
      Commissie van 18 december 2013 betreffende de toepassing van de artikelen 107 en 108 van het Verdrag betreffende de
      werking van de Europese Unie op de-minimissteun (PbEU 2013, L 352);
        - *lokaal energieproject:* project gericht op energiebesparing of opwekking van duurzame energie
      ten behoeve van de eigen woning, dat wordt uitgevoerd binnen een postcodegebied als bedoeld in
      [artikel 47, eerste lid, onderdeel z, van de Wet belastingen op milieugrondslag][ref1];
        - *maatwerkadviesrapport:* maatwerkadviesrapport als bedoeld in de door de Stichting Kwaliteit voor Installaties
      Nederland bindend verklaarde Nationale Beoordelingsrichtlijn 9500, deel 02, zoals vastgesteld op 31 augustus
      2011, inclusief latere wijzigingen, opgesteld door een persoon die voldoet aan de eisen van vakbekwaamheid van
      ‘EPA’-adviseur conform bijlage 2 van deze beoordelingsrichtlijn;
        - *meldcode:* code beschikbaar gesteld door de minister per type en merk installatie voor de productie van duurzame
      energie;
        - *minister:* Minister van Binnenlandse Zaken en Koninkrijksrelaties;
        - *energiebesparingsmaatregel:* maatregel als bedoeld in [artikel 3, eerste lid, onderdeel b][ref2];
        - *woning:* gebouw of gedeelte van een gebouw dat bestemd is voor bewoning met inbegrip van de bijgebouwen die
      bijdragen aan de woonbestemming.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0040901#Artikel3
