        bwb_id: BWBR0040901
        artikel: '2'
  - number: '6.1'
    text: Het subsidieplafond voor aanvragen ingediend in 2020 bedraagt € 10.000.000.
    url: https://wetten.overheid.nl/BWBR0040901/2020-01-01#Artikel6
  - number: '6.2'
    text: De minister verdeelt het subsidieplafond op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0040901/2020-01-01#Artikel6
  - number: '6.3'
    text: |-
      Vaststelling en wijziging van het subsidieplafond geschiedt door middel van publicatie in de Staatscourant. Bij die
      publicatie wordt bepaald voor welk tijdvak het subsidieplafond geldt.
    url: https://wetten.overheid.nl/BWBR0040901/2020-01-01#Artikel6
  - number: '7.1'
    text: |-
      Een energiebesparingsmaatregel of een maatwerkadviesrapport, waarvoor op grond van deze regeling een subsidie
      is verleend, wordt binnen een termijn van achttien maanden na de verlening van de subsidie aangebracht of
      geïnstalleerd en in gebruik genomen, respectievelijk opgeleverd.
    url: https://wetten.overheid.nl/BWBR0040901/2020-01-01#Artikel7
  - number: '7.2'
    text: |-
      De minister kan op verzoek van de subsidieontvanger de termijn vaststellen op zes maanden vanaf de datum van
      afronding van de versterking indien de termijn, bedoeld in het eerste lid, niet gehaald kan worden in verband met
      de datum van afronding van de versterking. Het verzoek wordt ingediend voorafgaand aan het einde van laatstbedoelde
      termijn.
    url: https://wetten.overheid.nl/BWBR0040901/2020-01-01#Artikel7
  - number: '7.3'
    text: 'Behoudens als onderdeel van de verkoop van de woning, vervreemdt de subsidieontvanger:'
    url: https://wetten.overheid.nl/BWBR0040901/2020-01-01#Artikel7
  - number: 7.3.a
    text: |-
      een energiebesparingsmaatregel waarvoor subsidie is verleend niet binnen twaalf maanden na de datum van de
      subsidievaststelling;
    url: https://wetten.overheid.nl/BWBR0040901/2020-01-01#Artikel7
  - number: 7.3.b
    text: |-
      de deelneming in een lokaal energieproject ten behoeve waarvan subsidie is verleend niet binnen vijf jaar na de
      datum van de subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0040901/2020-01-01#Artikel7
  - number: '8.1'
    text: |-
      Een aanvraag voor subsidie als bedoeld in [artikel 2][ref1], bevat ten minste:


      [ref1]: https://wetten.overheid.nl/BWBR0040901#Artikel2
    url: https://wetten.overheid.nl/BWBR0040901/2020-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0040901
        artikel: '2'
  - number: 8.1.a
    text: de naam, het post- en bezoekadres, het e-mailadres en het telefoonnummer van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0040901/2020-01-01#Artikel8
  - number: 8.1.b
    text: zijn Burgerservicenummer of het nummer waaronder de onderneming is geregistreerd bij de Kamer van Koophandel;
    url: https://wetten.overheid.nl/BWBR0040901/2020-01-01#Artikel8
  - number: 8.1.c
    text: |-
      zijn bankrekeningnummer, met overlegging van een kopie van een actueel bankafschrift of een bankpas ter verificatie
      daarvan;
    url: https://wetten.overheid.nl/BWBR0040901/2020-01-01#Artikel8
  - number: 8.1.d
    text: 'de onderbouwing van de kosten, blijkende uit:'
    url: https://wetten.overheid.nl/BWBR0040901/2020-01-01#Artikel8
  - number: 8.1.d.1°
    text: |-
      een door de aanvrager aanvaarde offerte of opdrachtbevestiging van de aannemer of leverancier met daarop vermeld de
      datum van aanvang van de werkzaamheden, respectievelijk levering van de installatie voorzien van het merk en type,
      of – indien beschikbaar – de meldcode, van maximaal twee maanden oud, respectievelijk een factuur en het daarbij
      behorende betalingsbewijs;
    url: https://wetten.overheid.nl/BWBR0040901/2020-01-01#Artikel8
  - number: 8.1.d.2°
    text: |-
      een door de aanvrager aanvaarde offerte of opdrachtbevestiging van een gecertificeerd adviseur met daarop vermeld
      de datum van oplevering van het maatwerkadviesrapport, van maximaal twee maanden oud, respectievelijk een factuur
      en het daarbij behorende betalingsbewijs;
    url: https://wetten.overheid.nl/BWBR0040901/2020-01-01#Artikel8
  - number: 8.1.e
    text: |-
      een afschrift van de besluiten tot verlening van andere subsidies in de kosten van de op grond van deze regeling te
      subsidiëren activiteiten dan wel van de aanvragen tot verlening van deze andere subsidies;
    url: https://wetten.overheid.nl/BWBR0040901/2020-01-01#Artikel8
  - number: 8.1.f
    text: |-
      een afschrift van de overeenkomst of het besluit waaruit blijkt dat de aanvraag betrekking heeft op een woning als
      bedoeld in [artikel 2, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0040901#Artikel2
    url: https://wetten.overheid.nl/BWBR0040901/2020-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0040901
        artikel: '2'
  - number: 8.1.g
    text: |-
      een opgave van de omzetbelasting die in rekening is gebracht voor de getroffen maatregelen voor zover deze
      omzetbelasting is verrekend.
    url: https://wetten.overheid.nl/BWBR0040901/2020-01-01#Artikel8
  - number: '8.2'
    text: |-
      De aanvraag door een onderneming bevat tevens een verklaring over alle andere onder de algemene de-
      minimisverordening of andere de- minimisverordeningen vallende de-minimissteun die deze onderneming gedurende de
      twee voorgaande belastingjaren en het lopende belastingjaar heeft ontvangen, als bedoeld in artikel 6, eerste lid,
      van de algemene de-minimisverordening.
    url: https://wetten.overheid.nl/BWBR0040901/2020-01-01#Artikel8
  - number: '8.3'
    text: |-
      Bij een verzoek om verlenging als bedoeld in [artikel 7, tweede lid][ref1], wordt een schriftelijke verklaring
      overgelegd van de uitvoerder van de versterking met daarin de verwachte einddatum van de afronding van de
      versterking.


      [ref1]: https://wetten.overheid.nl/BWBR0040901#Artikel7
    url: https://wetten.overheid.nl/BWBR0040901/2020-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0040901
        artikel: '7'
  - number: '9'
    text: |-
      Een subsidie die krachtens deze regeling wordt verleend, bevat, indien deze aan een onderneming wordt verstrekt,
      staatssteun en wordt gerechtvaardigd door de algemene de-minimisverordening.
    url: https://wetten.overheid.nl/BWBR0040901/2020-01-01#Artikel9
  - number: '10'
    text: |-
      Deze regeling vervalt met ingang van 31 december 2023, met dien verstande dat deze van toepassing blijft op
      subsidies die voor deze datum zijn verleend.
    url: https://wetten.overheid.nl/BWBR0040901/2020-01-01#Artikel10
  - number: '11'
    text: Deze regeling treedt in werking met ingang van 28 mei 2018.
    url: https://wetten.overheid.nl/BWBR0040901/2020-01-01#Artikel11
  - number: '12'
    text: |-
      Deze regeling wordt aangehaald als: Regeling energiebesparing woningen bouwkundig versterkingsprogramma
      Groningenveld.
    url: https://wetten.overheid.nl/BWBR0040901/2020-01-01#Artikel12
