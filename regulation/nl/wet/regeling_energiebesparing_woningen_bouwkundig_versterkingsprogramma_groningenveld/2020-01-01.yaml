  - number: '3.2'
    text: |-
      Gelet op [artikel 6, vijfde lid, onder b, van het Kaderbesluit BZK-subsidies][ref1], komen de kosten, bedoeld
      in het eerste lid, voor subsidie in aanmerking indien deze zijn gemaakt ter voldoening aan een contractuele
      verplichting die is aangegaan vóór de indiening van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0033530#Artikel6
    url: https://wetten.overheid.nl/BWBR0040901/2020-01-01#Artikel3
