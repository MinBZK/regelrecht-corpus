  - number: '29'
    text: |-
      1 Indien op hoofdspoorwegen, waar de ten hoogste toegelaten snelheid meer dan 40 kilometer per uur bedraagt, en op
      door de Minister aangewezen sporen een vast sein of ETCS-cabinesein de bestuurder opdraagt te stoppen, leggen de
      voorafgaande seinen een zodanige snelheidsvermindering op dat de bestuurder de trein voor dit sein tot stilstand
      kan brengen.

      2 Indien een vast sein de bestuurder een beperkte snelheid opdraagt, leggen de voorafgaande seinen een zodanige
      snelheidsvermindering op dat de beperkte snelheid bij dit sein bereikt kan worden.
    url: https://wetten.overheid.nl/BWBR0017707/2021-12-17#Artikel29
  - number: '30'
    text: |-
      1 De bestuurder zet een door een sein opgedragen snelheidsverlaging in, wanneer het eerste spoorvoertuig van de
      trein dit sein bereikt heeft.

      2 De bestuurder mag een door een sein toegestane snelheidsverhoging uitvoeren, nadat het laatste spoorvoertuig van
      de trein dit sein of het punt van toegestane snelheidsverhoging gepasseerd is.
    url: https://wetten.overheid.nl/BWBR0017707/2021-12-17#Artikel30
  - number: '31'
    text: |-
      1 Een door een lichtsein of een ETCS-cabinesein gegeven gebod of toestemming geldt vanaf dit sein totdat de trein
      het volgende sein heeft bereikt of tot een ander ETCS-cabinesein wordt getoond. De bestuurder neemt hierbij geboden
      of toestemmingen van specifieke snelheidsborden, zoals opgenomen in [bijlage 4][ref1], in acht.

      2 Een door lichtsein nummer 214 of bord nummer 317, zoals opgenomen in [bijlage 4][ref2], gegeven toestemming geldt
      tot aan het eerstvolgende hoofdsein.

      3 Bij gebruik van een hoofdspoorweg, met een spoorvoertuig waarvan de vergunning voor indienststelling of de
      aanvullende vergunning voor indienststelling, bedoeld in [artikel 36][ref3] respectievelijk [37a van de wet][ref4],
      dan wel het inzetcertificaat, bedoeld in [artikel 41, aanhef en onder b, van het besluit][ref5], die hoofdspoorweg
      voor dat voertuig vermeldt als te berijden met het ETCS, geldt in afwijking van het tweede lid, een in dat lid
      bedoelde toestemming tot het tijdstip waarop een ETCS-cabinesein wordt getoond indien dat tijdstip voor het
      tijdstip van het passeren van het eerstvolgende hoofdsein is gelegen.

      4 Onverminderd het tweede lid mag de bestuurder, met inachtneming van geboden of toestemmingen van specifieke
      snelheidsborden, bedoeld in het eerste lid, de snelheid direct verhogen, indien:

      a. hij overdag en bij goed zicht ziet dat het eerste hoofdsein dat hij zal voorbijrijden, toestaat om te rijden met
      een hogere snelheid dan de trein rijdt;

      b. er zich tussen de trein en dit hoofdsein geen wissels bevinden;

      c. de trein de wisselbogen in zijn geheel is gepasseerd; en

      d. het punt van toegestane snelheidsverhoging volledig is gepasseerd.

      5 Onverminderd het tweede lid mag een bestuurder de snelheid verhogen, indien hij een specifiek snelheidsbord,
      bedoeld in het eerste lid, voorbijrijdt, dat een hogere snelheid toestaat dan de trein rijdt, en het voorafgaande
      lichtsein groen licht uitstraalde.

      6 De door een ETCS-cabinesein aangegeven toegestane snelheid treedt, bij gebruik van een hoofdspoorweg met
      een spoorvoertuig als bedoeld in het derde lid, indien in de ETCS FS-modus wordt gereden, in de plaats van de
      aangegeven toegestane snelheden door de in [bijlage 4][ref6] opgenomen seinen nummers 201 tot en met 212 a/b,
      nummers 217 tot en met 219 en nummers 313 tot en met 316.

      7 De op basis van het zesde lid geldende toegestane snelheid, geldt tot het tijdstip waarop het in punt 6.10 van
      het document, genoemd in aanhangsel A van de TSI Exploitatie en verkeersleiding bedoelde signaal is getoond of een
      daarmee overkomend bericht is ontvangen en één of meer van de in het zesde lid genoemde seinen wordt gepasseerd.


