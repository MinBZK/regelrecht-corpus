      - id: ref1
        bwb_id: BWBR0017624
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0017707
  - number: '39'
    text: |-
      Tot een spoorwegemplacement behoren:

      a. alle sporen, aangeduid met een cijfer;

      b. de spoorgedeeltes van het wisselcomplex; en

      c. alle sporen die grenzen aan de sporen als bedoeld in onderdeel a en b, tot een maximale afstand van 200 meter
      voor het toeleidende sein van het bedoelde emplacement of tot de maximale afstand voor het toeleidende sein zoals
      aangegeven in de netverklaring.
    url: https://wetten.overheid.nl/BWBR0017707/2021-12-17#Artikel39
  - number: '40'
    text: |-
      Indien het veilige gebruik van de spoorweg dit vereist geeft de infrastructuurbeheerder met het bord nummer 302,
      genoemd in [bijlage 4][ref1], op het spoorwegemplacement aan dat op dit spoor niet gerangeerd kan worden of dat
      beperkingen gelden ten aanzien van het rangeren.


      [ref1]: https://wetten.overheid.nl/BWBR0017707
    url: https://wetten.overheid.nl/BWBR0017707/2021-12-17#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0017707
  - number: 40a
    text: |-
      Het profiel, bedoeld in [artikel 10, tweede lid, onderdeel a, van het besluit][ref1], is opgenomen in
      [bijlage 8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017624#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0017707
    url: https://wetten.overheid.nl/BWBR0017707/2021-12-17#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0017624
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0017707
  - number: '41'
    text: |-
      Deze regeling treedt in werking op het tijdstip waarop het [Besluit spoorverkeer][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0017624
    url: https://wetten.overheid.nl/BWBR0017707/2021-12-17#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0017624
  - number: '42'
    text: 'Deze regeling wordt aangehaald als: Regeling spoorverkeer.'
    url: https://wetten.overheid.nl/BWBR0017707/2021-12-17#Artikel42
