  - number: '36'
    text: |-
      De treindienstleider kan aan de bestuurder in ieder geval de volgende gestandaardiseerde aanwijzingen geven:

      1 Stoptonend sein (STS)

      Aanwijzing om door te rijden en voorbij het aangegeven sein dat rood licht uitstraalt:

      a. met een zodanige snelheid, die niet hoger is dan 40 kilometer per uur, te rijden dat de bestuurder in staat is
      om te kunnen stoppen binnen de afstand waarover de spoorweg is te overzien en deze vrij is;

      b. de wissels voorzichtig te berijden met een snelheid van ten hoogste 10 kilometer per uur en voor een wissel te
      stoppen, indien de wissel niet in de aangegeven stand ligt of uiterlijk beschadigd is; en

      c. rekening te houden met het niet goed functioneren van een AKI, AHOB, ADOB of AOB.

      2 Stoptonend sein met normale snelheid (STS-A)

      Aanwijzing om door te rijden en voorbij het aangegeven sein dat rood licht uitstraalt:

      a. de wissels voorzichtig te berijden met een snelheid van ten hoogste 10 kilometer per uur en voor een wissel te
      stoppen, indien de wissel niet in de aangegeven stand ligt of uiterlijk beschadigd is;

      b. rekening te houden met het niet goed functioneren van een aangegeven AKI, AHOB, ADOB of AOB;

      c. de aangegeven brug slechts te berijden, indien seinnummer 244 a of b voorbijrijden toestaat; of

      d. in andere gevallen te mogen rijden met de normale snelheid.

      3 Voorzichtig rijden (VR)

      Aanwijzing om voorzichtig te rijden met een snelheid van ten hoogste 40 kilometer per uur dan wel met een door de
      treindienstleider aangegeven lagere snelheid vanwege een door hem aangegeven reden. De bestuurder brengt de trein
      tot stilstand, indien de veiligheid dit vordert.

      4 Overwegen (OVW)

      Aanwijzing om bij nadering van de aangegeven overweg of overpad:

      a. tijdig de snelheid te verminderen tot ten hoogste 10 kilometer per uur; en

      b. herhaaldelijk een fluitsignaal te geven en te stoppen, indien de veiligheid van het wegverkeer dit vordert.

      5 Snelheid begrenzen (SB)

      Aanwijzing om de snelheid te begrenzen tot de door de treindienstleider aangegeven snelheid vanwege de toestand van
      de spoorweg.

      6 Verkeerd spoor (VS)

      Aanwijzing om de hoofdspoorweg in een andere richting te mogen berijden dan waarvoor de beveiliging is ingericht.

      7 Telefonische toestemming vragen voor vertrek (TTV)

      Aanwijzing om voor vertrek telefonisch aan de treindienstleider toestemming te vragen om te mogen vertrekken.
    url: https://wetten.overheid.nl/BWBR0017707/2021-12-17#Artikel36
  - number: '37'
    text: |-
      1 De aanwijzingen, genoemd in [artikel 36, eerste, tweede en zesde lid][ref1], zijn schriftelijke aanwijzingen van
      veiligheidsberichten als bedoeld in de TSI Exploitatie en verkeersleiding.

      2 Bij de aanwijzing Overwegen (OVW) kan de snelheid worden hernomen, indien de voorzijde van de trein de overweg of
      het overpad is gepasseerd.


