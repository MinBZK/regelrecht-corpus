  - number: '32'
    text: |-
      1 Wanneer de bestuurder in een hoofdsein, met uitzondering van een P-sein, gedoofd of onjuist licht waarneemt,
      stopt de bestuurder direct, indien:

      a. hij in het bezit is van een aanwijzing stoptonend sein als bedoeld in [artikel 36, eerste lid][ref1];

      b. het voorafgaande sein lichtsein nummer 212 a/b, zoals opgenomen in [bijlage 4][ref2], dat geel licht
      uitstraalde, was;

      c. het voorafgaande lichtsein een gedoofd sein was;

      d. het voorafgaande sein baken nummer 249a, zoals opgenomen in [bijlage 4][ref3], was; of

      e. het voorafgaande sein lichtsein nummer 214, zoals opgenomen in [bijlage 4][ref4], dat geel licht uitstraalde, of
      bord nummer 317, zoals opgenomen in [bijlage 4][ref5], was.

      In andere dan de onder a tot en met e genoemde gevallen begrenst de bestuurder de snelheid tot 40 kilometer per uur
      om op elke plaats achter dit sein waar een belemmering voor het verder rijden aanwezig is te kunnen stoppen.

      2 Indien de bestuurder in een P-sein gedoofd of onjuist licht waarneemt, begrenst hij de snelheid tot 40 kilometer
      per uur om op elke plaats achter dit sein waar een belemmering voor het verder rijden aanwezig is te kunnen
      stoppen.

      3 Indien de bestuurder in een voorsein gedoofd of onjuist licht waarneemt, dan handelt de bestuurder alsof dit sein
      overeenkomstig voorsein nummer 219 a/b, zoals opgenomen in [bijlage 4][ref6], geel licht uitstraalt.


