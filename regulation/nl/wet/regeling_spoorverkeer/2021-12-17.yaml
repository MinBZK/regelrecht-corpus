preamble:
  text: |-
    Gelet op artikelen 1, onderdeel e, 2, 9, 20, 26 en 38 van het Besluit spoorverkeer;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017707/2021-12-17#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - ADOB: automatische dubbele overwegbomen;
        - AHOB: automatische halve overwegbomen;
        - AKI: automatische knipperlichtinstallatie;
        - AOB: automatische overpadbomen;
        - besluit: [Besluit spoorverkeer][ref1];
        - ETCS: European Train Control System;
        - ETCS-cabinesein: sein, getoond op de ETCS-bestuurdersinterface, bedoeld in paragraaf 4.3 van de bijlage
      behorende bij beschikking nr. 2006/679/EG van de Commissie van de Europese Gemeenschappen van 28 maart 2006
      betreffende de technische specificaties inzake interoperabiliteit van het subsysteem ‘Besturing en Seingeving’
      van het conventionele trans-Europese spoorwegsysteem (PbEU L 284) dan wel op de bestuurdersinterface, bedoeld
      in paragraaf 4.3 van de bijlage behorende bij beschikking nr. 2006/860/EG van de Commissie van de Europese
      Gemeenschappen van 7 november 2006 betreffende de technische specificaties inzake interoperabiliteit van het
      subsysteem ‘Besturing en Seingeving’ van het trans-Europees hogesnelheidsspoorwegsysteem en tot wijziging van
      bijlage A bij Beschikking 2006/679/EG betreffende de technische specificaties inzake interoperabiliteit van het
      subsysteem ‘Besturing en Seingeving’ van het conventionele trans-Europese spoorwegsysteem (PbEU L 342);
        - hoofdsein: lichtsein dat rood licht kan uitstralen;
        - krachtvoertuig: spoorvoertuig met eigen voortbewegingsinrichting;
        - lichtsein: vast sein dat groen, geel, rood of wit licht kan uitstralen;
        - netverklaring: netverklaring als bedoeld in artikel 3, onderdeel 26, van de [richtlijn 2012/34](32012L0034)/EU
      van het Europees Parlement en de Raad van 21 november 2012 tot instelling van één Europese spoorwegruimte (PbEU
      2012, L343);
        - P-sein: hoofdsein voorzien van een onderbord met het opschrift ‘P’;
        - perronfase: opdeling van een spoor langs een perron door middel van letters;
        - rijtuig: spoorvoertuig hoofdzakelijk bestemd voor het vervoer van personen, zonder eigen
      voortbewegingsinrichting;
        - vast sein: niet verplaatsbaar sein;
        - voorsein: lichtsein dat aan een hoofdsein of bord met betekenis *stop* voorafgaat en geen rood licht kan
      uitstralen;
        - wagen: spoorvoertuig zonder eigen voortbewegingsinrichting, bestemd voor het vervoer van goederen.


      [ref1]: https://wetten.overheid.nl/BWBR0017624
