  - number: '3'
    text: |-
      In aanvulling op de TSI Exploitatie en verkeersleiding, aanhangsel B, onder B2, punt 1, vermijdt de bestuurder
      indien mogelijk het gebruik van zandstrooiers op de spoorstroomkringen die overwegen of overpaden activeren.
    url: https://wetten.overheid.nl/BWBR0017707/2021-12-17#Artikel3
  - number: '8'
    text: |-
      De noodremmingsprestaties van treinen zijn zodanig dat treinen op een dalende helling van 5 promille tot stilstand
      kunnen worden gebracht binnen de hierna genoemde maximaal toegestane remwegen:








                  Treinsnelheid


                  Maximaal toegestane remweg






                  Vmax ≤ 40 km/u


                  400 m




                  40 < Vmax ≤ 60 km/u


                  500 m




                  60 < Vmax ≤ 80 km/u


                  800 m




                  80 < Vmax ≤ 130 km/u


                  1.000 m




                  130 < Vmax ≤ 160 km/u


                  1.150 m
    url: https://wetten.overheid.nl/BWBR0017707/2021-12-17#Artikel8
  - number: '23'
    text: |-
      1 De beheerder draagt zorg voor de plaatsing en de bediening van de vaste seinen in en nabij hoofdspoorwegen.

      2 De seinen worden op een zodanige wijze bediend dat op veilige wijze van de hoofdspoorweg gebruik kan worden
      gemaakt.

      3 De beheerder, gehoord de spoorwegondernemingen en de Minister, stelt interne richtlijnen vast voor de
      veiligheidskritische handelingen van de treindienstleider bij de bediening van seinen die de handelwijze van de
      bestuurder raken.

      4 Het eerste, tweede en derde lid zijn van overeenkomstige toepassing op de bediening van ETCS-cabineseinen, met
      dien verstande dat ETCS-cabineseinen door de beheerder worden bediend door het versturen van informatie.
    url: https://wetten.overheid.nl/BWBR0017707/2021-12-17#Artikel23
  - number: '24'
    text: |-
      1 De aard, uitvoering en betekenis van de seinen anders dan ETCS-cabineseinen zijn opgenomen in [bijlage 4][ref1].

      2 In aanvulling op aanhangsel A van de TSI Exploitatie en verkeersleiding is het in de punten 5.1.6 en 5.31.2
      van het document, genoemd in dat aanhangsel, met betrekking tot het ETCS niveau 1 met seinen bepaalde van
      overeenkomstige toepassing op het ETCS niveau 2 met seinen.


      [ref1]: https://wetten.overheid.nl/BWBR0017707
    url: https://wetten.overheid.nl/BWBR0017707/2021-12-17#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0017707
  - number: 24a
    text: |-
      1 Het op afstand met behulp van radiogestuurde apparatuur besturen van tractievoertuigen vindt uitsluitend plaats
      in SH-modus indien het voertuig gebruik maakt van ETCS.

      2 Het is verboden gebruik te maken van ETCS niveau 0.

      3 Het tweede lid is niet van toepassing op spoorvoertuigen die rijden op buiten dienst gestelde gedeelten van de
      hoofdspoorwegen, genoemd in [bijlage 1, punten 16 en 18, van het Besluit aanwijzing hoofdspoorwegen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017794
    url: https://wetten.overheid.nl/BWBR0017707/2021-12-17#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0017794
  - number: '25'
    text: |-
      1 Op hoofdspoorwegen waar de ter plaatse toegestane snelheid hoger is dan 40 kilometer per uur worden in ieder
      geval:

      a. wissels;

      b. gelijkvloerse kruisingen van sporen;

      c. spooraansluitingen; en

      d. beweegbare bruggen

      beveiligd door seinen die tenminste rood licht kunnen uitstralen of door ETCS.

      2 Op sporen waar de in het eerste lid bedoelde plaatsen met een snelheid van ten hoogste 40 kilometer per uur
      worden genaderd, mag de beveiliging ook bestaan uit een daarvoor geplaatst vast sein, dat de bestuurder gebiedt
      te stoppen.

      3 De Minister kan ontheffing verlenen van het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0017707/2021-12-17#Artikel25
  - number: '26'
    text: |-
      1 Seinen worden geplaatst rechts naast of boven het spoor waarvoor zij zijn bestemd.

      2 In afwijking van het eerste lid mogen seinen links naast het spoor worden geplaatst, indien de situatie ter
      plaatse dit noodzakelijk maakt en dit geen nadelige invloed heeft op de veiligheid van het spoorverkeer.

      3 Seinen worden zodanig geplaatst of van zodanige aanduidingen voorzien, dat het voor de bestuurder duidelijk is
      welke seinen voor het door hem bereden spoor bestemd zijn.
    url: https://wetten.overheid.nl/BWBR0017707/2021-12-17#Artikel26
  - number: '27'
    text: |-
      Seinen zijn voor de bestuurder zodanig zichtbaar dat hij afhankelijk van de plaatselijk toegestane maximumsnelheid
      in staat is die tijdig waar te nemen en daarop op passende wijze te reageren.
    url: https://wetten.overheid.nl/BWBR0017707/2021-12-17#Artikel27
  - number: '28'
    text: |-
      1 Tussen een wissel en een daarvoor ingevolge [artikel 25][ref1], eerste lid, geplaatst sein bestaat een zodanig
      verband dat als dit sein voorbijrijden toestaat, het wissel niet kan worden omgelegd en de juiste stand van de
      tongen verzekerd is.

      2 Tussen een beweegbare brug en een daarvoor ingevolge [artikel 25][ref2], eerste lid, geplaatst sein bestaat een
      zodanig verband dat als dit sein voorbijrijden toestaat, de brug in de juiste stand is vastgelegd.

      3 De Minister kan ontheffing verlenen van het bepaalde in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0017707#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0017707#Artikel25
