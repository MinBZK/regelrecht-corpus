  - number: '33'
    text: |-
      1 Lichtseinen die rood licht uitstralen mogen alleen voorbijgereden worden, indien de bestuurder van de
      treindienstleider een aanwijzing stoptonend sein als bedoeld in [artikel 36, eerste lid][ref1], heeft gekregen.

      2 In afwijking van het eerste lid mag een P-sein dat rood licht uitstraalt worden voorbijgereden, indien de
      treindienstleider dit heeft toegestaan. Indien de bestuurder geen spreekverbinding met de treindienstleider tot
      stand kan brengen, dan mag dit P-sein voorbij worden gereden.

      3 Indien het P-sein, bedoeld in het tweede lid, voorbijgereden mag worden, mag de bestuurder ook daaropvolgende P-
      seinen die rood licht uitstralen voorbijrijden.

      4 Na het voorbijrijden van een P-sein dat rood licht uitstraalt is de bestuurder verplicht:

      a. met een zodanige snelheid te rijden dat hij in staat is om te kunnen stoppen binnen de afstand waarover de
      spoorweg is te overzien en deze vrij is; en

      b. rekening te houden met het niet goed functioneren van een AKI, AHOB, ADOB of AOB.

      5 De treindienstleider geeft geen toestemming tot het voorbijrijden van het P-sein dat rood licht uitstraalt,
      bedoeld in het tweede lid, indien hij op de hoogte is van gevaar achter dit sein.


