---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_spoorverkeer
regulatory_layer: WET
publication_date: '2025-12-11'
valid_from: '2026-01-01'
bwb_id: BWBR0017707
url: https://wetten.overheid.nl/BWBR0017707/2026-01-01
preamble:
  text: |-
    Gelet op artikelen 1, onderdeel e, 2, 9, 20, 26 en 38 van het Besluit spoorverkeer;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - besluit: [Besluit spoorverkeer][ref1];
        - ETCS: European Train Control System;
        - hoofdsein: lichtsein dat rood licht kan uitstralen;
        - lichtsein: vast sein dat groen, geel, rood of wit licht kan uitstralen;
        - netverklaring: netverklaring als bedoeld in artikel 3, onderdeel 26, van de [richtlijn 2012/34](32012L0034)/EU
      van het Europees Parlement en de Raad van 21 november 2012 tot instelling van één Europese spoorwegruimte (PbEU
      2012, L343);
        - P-sein: hoofdsein voorzien van een P-bord;
        - perronfase: opdeling van een spoor langs een perron door middel van letters;
        - vast sein: niet verplaatsbaar sein;
        - voorsein: lichtsein dat aan een hoofdsein of bord met betekenis *stop* voorafgaat en geen rood licht kan
      uitstralen.


      [ref1]: https://wetten.overheid.nl/BWBR0017624
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0017624
  - number: '23.1'
    text: De beheerder draagt zorg voor de plaatsing en de bediening van de vaste seinen in en nabij hoofdspoorwegen.
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel23
  - number: '23.2'
    text: |-
      De beheerder stelt de interne richtlijnen voor de veiligheidskritieke handelingen van de treindienstleider bij de
      bediening van seinen die de handelwijze van de bestuurder raken, vast na raadpleging van de spoorwegondernemingen
      en de Minister.
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel23
  - number: '23.3'
    text: |-
      Het eerste en tweede lid, zijn van overeenkomstige toepassing op de bediening van ETCS-cabineseinen, met dien
      verstande dat ETCS-cabineseinen door de beheerder worden bediend door het versturen van informatie.
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel23
  - number: '24'
    text: |-
      De aard, uitvoering en betekenis van de seinen anders dan ETCS-cabineseinen zijn opgenomen in [bijlage 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017707
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0017707
  - number: 24a.1
    text: |-
      Indien een tractievoertuig over ETCS beschikt, vindt besturing door middel van radiogestuurde apparatuur op met
      ETCS uitgeruste infrastructuur, plaats in ETCS SH-, FS-, OS-, SR- of SM-modus.
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel24a
  - number: 24a.2
    text: Het is verboden gebruik te maken van ETCS niveau 0.
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel24a
  - number: 24a.3
    text: |-
      Het tweede lid is niet van toepassing op spoorvoertuigen die rijden op buiten dienst gestelde gedeelten van de
      hoofdspoorwegen, genoemd in [bijlage 1, punten 16 en 18, van het Besluit aanwijzing hoofdspoorwegen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017794
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0017794
  - number: '25.1'
    text: 'Op hoofdspoorwegen waar de ter plaatse toegestane snelheid hoger is dan 40 kilometer per uur worden in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel25
  - number: 25.1.a
    text: wissels;
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel25
  - number: 25.1.b
    text: gelijkvloerse kruisingen van sporen;
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel25
  - number: 25.1.c
    text: spooraansluitingen; en
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel25
  - number: 25.1.d
    text: beweegbare bruggen
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel25
  - number: '25.2'
    text: |-
      Op sporen waar de in het eerste lid bedoelde plaatsen met een snelheid van ten hoogste 40 kilometer per uur
      worden genaderd, mag de beveiliging ook bestaan uit een daarvoor geplaatst vast sein, dat de bestuurder gebiedt
      te stoppen.
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel25
  - number: '25.3'
    text: De Minister kan ontheffing verlenen van het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel25
  - number: '26.1'
    text: Seinen worden geplaatst rechts naast of boven het spoor waarvoor zij zijn bestemd.
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel26
  - number: '26.2'
    text: |-
      In afwijking van het eerste lid mogen seinen links naast het spoor worden geplaatst, indien de situatie ter plaatse
      dit noodzakelijk maakt en dit geen nadelige invloed heeft op de veiligheid van het spoorverkeer.
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel26
  - number: '26.3'
    text: |-
      Seinen worden zodanig geplaatst of van zodanige aanduidingen voorzien, dat het voor de bestuurder duidelijk is
      welke seinen voor het door hem bereden spoor bestemd zijn.
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel26
  - number: '28.1'
    text: |-
      Tussen een wissel en een daarvoor ingevolge [artikel 25][ref1], eerste lid, geplaatst sein bestaat een zodanig
      verband dat als dit sein voorbijrijden toestaat, het wissel niet kan worden omgelegd en de juiste stand van de
      tongen verzekerd is.


      [ref1]: https://wetten.overheid.nl/BWBR0017707#Artikel25
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0017707
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '28.2'
    text: |-
      Tussen een beweegbare brug en een daarvoor ingevolge [artikel 25][ref1], eerste lid, geplaatst sein bestaat een
      zodanig verband dat als dit sein voorbijrijden toestaat, de brug in de juiste stand is vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0017707#Artikel25
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0017707
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '28.3'
    text: De Minister kan ontheffing verlenen van het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel28
  - number: '29.1'
    text: |-
      Indien op hoofdspoorwegen, waar de ten hoogste toegelaten snelheid meer dan 40 kilometer per uur bedraagt, en op
      door de Minister aangewezen sporen een vast sein of ETCS-cabinesein de bestuurder opdraagt te stoppen, leggen de
      voorafgaande seinen een zodanige snelheidsvermindering op dat de bestuurder de trein voor dit sein tot stilstand
      kan brengen.
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel29
  - number: '29.2'
    text: |-
      Indien op hoofdspoorwegen als bedoeld in het eerste lid, een vast sein de bestuurder een beperkte snelheid
      opdraagt, leggen de voorafgaande seinen een zodanige snelheidsvermindering op dat de beperkte snelheid bij dit sein
      bereikt kan worden.
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel29
  - number: '30.1'
    text: |-
      Een door een sein opgedragen snelheidsverlaging wordt ingezet zodra het eerste spoorvoertuig van de trein dat sein
      heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel30
  - number: '30.2'
    text: |-
      Een door een sein toegestane snelheidsverhoging mag worden uitgevoerd, nadat het laatste spoorvoertuig van de trein
      dit sein of het punt van toegestane snelheidsverhoging gepasseerd is.
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel30
  - number: '31.1'
    text: |-
      Een door een lichtsein of een ETCS-cabinesein gegeven gebod of toestemming geldt vanaf dit sein totdat de trein het
      volgende sein heeft bereikt of tot een ander ETCS-cabinesein wordt getoond. Daarbij worden geboden of toestemmingen
      van de specifieke snelheidsborden, zoals opgenomen in [bijlage 4][ref1], in acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0017707
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0017707
  - number: '31.2'
    text: |-
      Een door lichtsein nummer 214 a/b of bord nummer 317, zoals opgenomen in [bijlage 4][ref1], gegeven toestemming
      geldt tot aan het eerstvolgende hoofdsein.


      [ref1]: https://wetten.overheid.nl/BWBR0017707
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0017707
  - number: '31.3'
    text: |-
      Bij gebruik van een hoofdspoorweg geldt in afwijking van het tweede lid, een in dat lid bedoelde toestemming tot
      het tijdstip waarop een ETCS-cabinesein wordt getoond indien dat tijdstip voor het tijdstip van het passeren van
      het eerstvolgende hoofdsein is gelegen.
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel31
  - number: '31.4'
    text: 'Onverminderd het tweede lid kan bij dag en goed zicht de snelheid meteen worden verhoogd indien:'
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel31
  - number: 31.4.a
    text: |-
      het eerste hoofdsein dat wordt voorbijgereden, toestaat om te rijden met een hogere snelheid dan waarmee de trein
      rijdt;
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel31
  - number: 31.4.b
    text: er tussen dit hoofdsein en de trein geen wissels zijn;
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel31
  - number: 31.4.c
    text: de trein in zijn geheel de wisselbogen is gepasseerd; en
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel31
  - number: 31.4.d
    text: het punt van de toegestane snelheidsverhoging is gepasseerd.
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel31
  - number: '31.5'
    text: |-
      Onverminderd het tweede lid mag de snelheid worden verhoogd naar een door een specifiek snelheidsbord aangegeven
      snelheid hoger dan 40 kilometer per uur, indien het voorafgaande lichtsein groen licht uitstraalde.
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel31
  - number: '31.6'
    text: |-
      De door een ETCS-cabinesein aangegeven toegestane snelheid treedt, bij gebruik van een hoofdspoorweg met een
      spoorvoertuig als bedoeld in het derde lid, indien in de ETCS FS-modus wordt gereden, in de plaats van de
      aangegeven toegestane snelheden door de in [bijlage 4][ref1] opgenomen seinen nummers 201 tot en met 212 a/b,
      nummers 217 tot en met 219 en nummers 313 tot en met 316.


      [ref1]: https://wetten.overheid.nl/BWBR0017707
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0017707
  - number: '31.7'
    text: |-
      De op basis van het zesde lid geldende toegestane snelheid, geldt tot het tijdstip waarop het in punt 6.11.2 van
      het document, genoemd in aanhangsel A van de TSI Exploitatie en verkeersleiding bedoelde signaal is getoond of een
      daarmee overkomend bericht is ontvangen en één of meer van de in het zesde lid genoemde seinen wordt gepasseerd.
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel31
  - number: '32.1'
    text: |-
      De trein stopt zodra in een hoofdsein, met uitzondering van een P-sein, gedoofd of onjuist licht wordt waargenomen
      en:
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel32
  - number: 32.1.a
    text: er geen toestemming is om een stoptonend sein te passeren;
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel32
  - number: 32.1.b
    text: |-
      het voorafgaande sein lichtsein nummer 212 a/b, zoals opgenomen in [bijlage 4][ref1], dat geel licht uitstraalde,
      was;


      [ref1]: https://wetten.overheid.nl/BWBR0017707
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0017707
  - number: 32.1.c
    text: het voorafgaande lichtsein een gedoofd sein was;
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel32
  - number: 32.1.d
    text: |-
      het voorafgaande sein baken nummer 249a, zoals opgenomen in [bijlage 4][ref1], was; of


      [ref1]: https://wetten.overheid.nl/BWBR0017707
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0017707
  - number: 32.1.e
    text: |-
      het voorafgaande sein lichtsein nummer 214, zoals opgenomen in [bijlage 4][ref1], dat geel licht uitstraalde, of
      bord nummer 317, zoals opgenomen in [bijlage 4][ref2], was.


      [ref1]: https://wetten.overheid.nl/BWBR0017707
      [ref2]: https://wetten.overheid.nl/BWBR0017707
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0017707
      - id: ref2
        bwb_id: BWBR0017707
  - number: '32.2'
    text: |-
      Zodra in een P-sein gedoofd of onjuist licht wordt waargenomen, wordt de snelheid begrensd tot 40 kilometer per uur
      om op elke plaats achter dit sein waar een belemmering voor het verder rijden aanwezig is te kunnen stoppen.
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel32
  - number: '32.3'
    text: |-
      Indien in een voorsein gedoofd of onjuist licht wordt waargenomen, wordt gehandeld alsof dit sein overeenkomstig
      voorsein nummer 219 a/b, zoals opgenomen in [bijlage 4][ref1], geel licht uitstraalt.


      [ref1]: https://wetten.overheid.nl/BWBR0017707
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0017707
  - number: '33.1'
    text: |-
      Lichtseinen die rood licht uitstralen mogen voorbijgereden worden indien de treindienstleider toestemming heeft
      gegeven voor het passeren van een stoptonend sein.
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel33
  - number: '33.2'
    text: |-
      Een P-sein dat rood licht uitstraalt mag ook voorbijgereden worden indien geen spreekverbinding met de
      treindienstleider tot stand kan worden gebracht.
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel33
  - number: '33.3'
    text: |-
      Indien het P-sein, bedoeld in het tweede lid, voorbijgereden mag worden, mag ook daaropvolgende P-seinen die rood
      licht uitstralen voorbijgereden worden.
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel33
  - number: '33.4'
    text: 'Na het voorbijrijden van een P-sein dat rood licht uitstraalt wordt:'
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel33
  - number: 33.4.a
    text: |-
      met een zodanige snelheid gereden dat de trein in staat is om te kunnen stoppen binnen de afstand waarover de
      spoorweg is te overzien en deze vrij is; en
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel33
  - number: 33.4.b
    text: rekening gehouden met het niet goed functioneren van een overweg.
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel33
  - number: '33.5'
    text: |-
      De treindienstleider geeft geen toestemming tot het voorbijrijden van het P-sein dat rood licht uitstraalt, bedoeld
      in het tweede lid, indien hij op de hoogte is van gevaar achter dit sein.
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel33
  - number: '34'
    text: |-
      Aanwijzingen van de beheerder, bedoeld in de [artikelen 4, tweede lid][ref1], [6, tweede lid][ref2],
      [10, derde lid][ref3], [20, eerste lid, onderdeel b][ref4], en [26, eerste lid, van het besluit][ref5], gaan boven
      seinen.


      [ref1]: https://wetten.overheid.nl/BWBR0017624#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0017624#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0017624#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0017624#Artikel20
      [ref5]: https://wetten.overheid.nl/BWBR0017624#Artikel26
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0017624
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0017624
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0017624
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0017624
        artikel: '20'
      - id: ref5
        bwb_id: BWBR0017624
        artikel: '26'
  - number: '36'
    text: |-
      De TSI Exploitatie en verkeersleiding, aanhangsel C, zoals gewijzigd in 2023, is vanaf 1 september 2023 van
      toepassing op de communicatie tussen de treindienstleider en de bestuurder.
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel36
  - number: '37'
    text: |-
      Bij het gebruik van een voertuig voor weg en spoorweg wordt gebruik gemaakt van GSM-R voice communicatie, waarmee
      gecommuniceerd kan worden met de treindienstleiding.
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel37
  - number: '38'
    text: |-
      Als spoorwegemplacementen, als bedoeld in [artikel 30 van het besluit][ref1], zijn aangewezen de
      spoorwegemplacementen, opgenomen in [bijlage 6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017624#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0017707
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0017624
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0017707
  - number: '39'
    text: 'Tot een spoorwegemplacement behoren:'
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel39
  - number: 39.a
    text: alle sporen, aangeduid met een cijfer;
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel39
  - number: 39.b
    text: de spoorgedeeltes van het wisselcomplex; en
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel39
  - number: 39.c
    text: |-
      alle sporen die grenzen aan de sporen als bedoeld in onderdeel a en b, tot een maximale afstand van 200 meter
      voor het toeleidende sein van het bedoelde emplacement of tot de maximale afstand voor het toeleidende sein zoals
      aangegeven in de netverklaring.
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel39
  - number: '40'
    text: |-
      Indien het veilige gebruik van de spoorweg dit vereist geeft de infrastructuurbeheerder met het bord nummer 302,
      genoemd in [bijlage 4][ref1], op het spoorwegemplacement aan dat op dit spoor niet gerangeerd kan worden of dat
      beperkingen gelden ten aanzien van het rangeren.


      [ref1]: https://wetten.overheid.nl/BWBR0017707
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0017707
  - number: '41'
    text: |-
      Deze regeling treedt in werking op het tijdstip waarop het [Besluit spoorverkeer][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0017624
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0017624
  - number: '42'
    text: 'Deze regeling wordt aangehaald als: Regeling spoorverkeer.'
    url: https://wetten.overheid.nl/BWBR0017707/2026-01-01#Artikel42
