  - number: 1.12.2.b
    text: |-
      elke twee jaar een inspectie van de uitrusting zoals bedoeld in de [hoofdstukken 2][ref1], [3][ref2], [4][ref3],
      [5][ref4], [6][ref5], [7][ref6] en [10][ref7];


