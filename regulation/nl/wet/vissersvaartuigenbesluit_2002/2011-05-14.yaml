  - number: 1.12.3
    text: |-
      Het periodiek onderzoek is zodanig dat het zeker is dat alle onderdelen, genoemd in het tweede lid, voldoen aan de
      eisen van dit besluit, dat de uitrusting in een bevredigende toestand verkeert en dat de stabiliteitsgegevens aan
      boord onmiddellijk beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.12
  - number: 1.12.4
    text: |-
      In aanvulling op het periodiek onderzoek wordt het vissersvaartuig, met inachtneming van bij ministeriële regeling
      te bepalen tussenpozen, aan een tussentijds onderzoek onderworpen. Het tussentijds onderzoek omvat een inspectie
      van de constructie en de machine-installaties van het vissersvaartuig en is zodanig dat het zeker is dat geen
      wijzigingen zijn aangebracht waardoor de veiligheid van het vissersvaartuig of de opvarenden nadelig zou worden
      beïnvloed.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.12
  - number: 1.12.5
    text: |-
      De periodieke onderzoeken, bedoeld in het tweede lid, onderdeel b en c, en het tussentijdse onderzoek worden
      aangetekend op het certificaat van overeenstemming.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.12
  - number: 1.12.6
    text: |-
      Telkens wanneer zich een ongeval heeft voorgedaan of een onvolkomenheid aan het vissersvaartuig is ontdekt waardoor
      de veiligheid van het vissersvaartuig of de doeltreffendheid of volledigheid van de reddingsmiddelen of van de
      andere uitrusting wordt aangetast, dragen de schipper en de eigenaar van het vissersvaartuig er zorg voor dat
      de Scheepvaartinspectie en, indien de eigenaar is aangesloten bij een klassebureau, het klassebureau, zo spoedig
      mogelijk worden ingelicht. De eigenaar en de schipper dragen er vervolgens zorg voor dat een aanvullend onderzoek
      wordt ingesteld. Wanneer het vissersvaartuig zich in een haven buiten het Koninkrijk bevindt, dragen de schipper en
      de eigenaar er zorg voor dat onmiddellijk de ter plaatse bevoegde autoriteiten worden ingelicht.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.12
  - number: '1.13'
    text: |-
      De eigenaar en de schipper van het vissersvaartuig zijn verplicht aan degene die een onderzoek verricht alle
      medewerking te verlenen die deze redelijkerwijs bij de uitoefening van zijn taak kan vorderen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.13
  - number: '1.14'
    text: |-
      Nadat een onderzoek als bedoeld in [artikel 1.12][ref1] is beëindigd:


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel1
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.14
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '1'
        hoofdstuk: '1'
  - number: 1.14.1°
    text: |-
      worden de toestand van het vissersvaartuig en de uitrusting gehandhaafd in overeenstemming met het bepaalde bij of
      krachtens dit besluit, om zeker te stellen dat het vissersvaartuig in alle opzichten veilig blijft om zonder gevaar
      voor het vissersvaartuig en opvarenden naar zee te vertrekken;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.14
  - number: 1.14.2°
    text: |-
      mag, zonder voorafgaande toestemming van het Hoofd van de Scheepvaartinspectie, geen verandering in de constructie,
      machine-installaties, uitrusting en andere onderdelen van het vissersvaartuig worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.14
  - number: '1.15'
    text: |-
      Ter uitvoering van een besluit van een of meer van de instellingen van de Europese Unie alleen of gezamenlijk
      betreffende de veiligheid van in de lidstaten van de Europese Unie geregistreerde vissersvaartuigen en
      vissersvaartuigen in Europese wateren onder de jurisdictie van de lidstaten van de Europese Unie kunnen bij
      ministeriële regeling regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.15
  - number: 2.1.1
    text: |-
      De sterkte en de constructie van de romp, bovenbouwen, dekhuizen, schachten van machinekamers, toegangskappen en
      elke andere constructie en die van de scheepsuitrusting zijn ten genoegen van het Hoofd van de Scheepvaartinspectie
      voldoende bestand tegen alle voorzienbare omstandigheden waaronder het vissersvaartuig kan opereren.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.1
  - number: 2.1.2
    text: |-
      De romp van vissersvaartuigen die zijn bestemd om in ijs dienst te doen, is versterkt, rekening houdend met de te
      verwachten omstandigheden tijdens de vaart en in het werkgebied.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.1
  - number: 2.1.3
    text: |-
      Schotten, afsluitmiddelen en afsluitingen van openingen in deze schotten, evenals de methoden om deze te beproeven,
      zijn ten genoegen van het Hoofd van de Scheepvaartinspectie. Vissersvaartuigen die zijn vervaardigd van ander
      materiaal dan hout, zijn voorzien van een aanvaringsschot en ten minste van waterdichte schotten die de ruimte voor
      machines, waarin zich het hoofdvoortstuwingswerktuig bevindt, omsluiten. Deze schotten zijn opgetrokken tot aan het
      werkdek. In houten vissersvaartuigen zijn dergelijke schotten eveneens aangebracht en, voor zover zulks praktisch
      uitvoerbaar is, zijn deze schotten waterdicht.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.1
  - number: 2.1.4
    text: |-
      Pijpen die door het aanvaringsschot zijn gevoerd, zijn voorzien van doelmatige afsluiters, die boven het werkdek
      kunnen worden bediend en die tegen het aanvaringsschot in de voorpiek zijn bevestigd. In het aanvaringsschot onder
      het werkdek zijn geen deuren, mangaten, ventilatiekokers of andere openingen aangebracht.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.1
  - number: 2.1.5
    text: |-
      Indien een lange bovenbouw op het voorschip is aangebracht, is als voortzetting van het aanvaringsschot een schot,
      dicht tegen weer en wind, aangebracht tussen het werkdek en het dek boven het werkdek. Deze voortzetting van het
      aanvaringsschot boven het werkdek behoeft niet onmiddellijk te zijn geplaatst boven het aanvaringsschot, mits het
      wordt geplaatst binnen de grenzen, als bepaald in het achtste lid en het gedeelte van het dek dat de trapsgewijze
      verspringing vormt, dicht is tegen weer en wind.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.1
  - number: 2.1.6
    text: |-
      Het aantal openingen in de voortzetting van het aanvaringsschot boven het werkdek is beperkt tot het minimum dat
      verenigbaar is met de bestemming en de normale bedrijfsuitoefening van het vissersvaartuig. Dergelijke openingen
      kunnen dicht tegen weer en wind worden afgesloten.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.1
  - number: 2.1.7
    text: |-
      In vissersvaartuigen waarvan de lengte 75 m of meer bedraagt, is, voorzover dit praktisch uitvoerbaar is, tussen
      het aanvaringsschot en het achterpiekschot een waterdichte dubbele bodem aangebracht.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.1
  - number: 2.2.1
    text: |-
      Met inachtneming van het bepaalde in [artikel 2.1, derde lid][ref1], is het aantal openingen in waterdichte
      schotten beperkt tot het minimum dat verenigbaar is met de algehele inrichting en de noodzakelijke voorzieningen
      ten behoeve van de werkzaamheden op het vissersvaartuig; openingen zijn ten genoegen van het Hoofd van de
      Scheepvaartinspectie voorzien van waterdichte afsluitmiddelen. Waterdichte deuren zijn van gelijke sterkte als de
      aangrenzende constructie zonder zulke openingen.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel2
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.2.2
    text: |-
      Op vissersvaartuigen met een lengte van minder dan 45 m mogen waterdichte deuren van het draaibare type zijn, die
      ter plaatse aan beide zijden van de deur kunnen worden geopend en gesloten en die onder normale omstandigheden op
      zee gesloten blijven. Op de deur is aan beide zijden aangegeven dat deze op zee moet zijn gesloten.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.2
  - number: 2.2.3
    text: 'Op vissersvaartuigen met een lengte van 45 m en meer zijn waterdichte deuren als schuifdeuren uitgevoerd in:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.2
  - number: 2.2.3.a
    text: |-
      ruimten waar deze deuren op zee worden gebruikt en de bovenkant van de drempel onder de hoogst gelegen lastlijn
      ligt, tenzij het Hoofd van de Scheepvaartinspectie, rekening houdend met het type en de bestemming van het
      vaartuig, van oordeel is dat zulks praktisch onuitvoerbaar of niet noodzakelijk is, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.2
  - number: 2.2.3.b
    text: het lagere gedeelte van een ruimte voor machines, van waaruit een schroefastunnel kan worden bereikt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.2
  - number: 2.2.4
    text: |-
      Waterdichte schuifdeuren kunnen nog geopend en gesloten worden wanneer het vissersvaartuig een helling heeft van
      15°, ongeacht over welke zijde.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.2
  - number: 2.2.5
    text: |-
      Waterdichte schuifdeuren die met de hand of anderszins worden bediend kunnen ter plaatse van de deur aan beide
      zijden geopend en gesloten worden. Op vissersvaartuigen met een lengte van 45 m en meer kunnen deze deuren door
      middel van afstandsbediening geopend en gesloten worden vanaf een toegankelijke plaats boven het werkdek, met
      uitzondering van deuren die zijn aangebracht in ruimten voor accommodatie ten behoeve van de bemanning.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.2
  - number: 2.2.6
    text: |-
      Op alle plaatsen van waaruit afstandsbediening plaatsvindt, is een standaanwijzer aanwezig die aangeeft of een
      schuifdeur geopend dan wel gesloten is.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.2
  - number: 2.3.1
    text: |-
      Openingen waardoor water het vissersvaartuig kan binnendringen zijn voorzien van waterdichte afsluitmiddelen.
      Dekopeningen die tijdens de visvangst geopend kunnen zijn, zijn zoveel mogelijk ter plaatse van het vlak van kiel
      en stevens van het vissersvaartuig aangebracht. Het Hoofd van de Scheepvaartinspectie kan afwijkende voorzieningen
      toestaan, indien naar zijn oordeel de veiligheid van het vissersvaartuig daardoor niet vermindert.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.3
  - number: 2.3.2
    text: |-
      Luiken boven visstortopeningen op hektrawlers kunnen mechanisch worden bewogen en vanaf een plaats worden bediend
      die een onbelemmerd uitzicht biedt op de werking van deze luiken.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.3
  - number: 2.4.1
    text: |-
      Alle toegangsopeningen in schotten van gesloten bovenbouwen en in andere aan weer en wind blootgestelde
      constructies waardoor, met gevaar voor het vissersvaartuig, water zou kunnen binnendringen, zijn voorzien van
      deuren die permanent aan het schot zijn bevestigd en zijn zodanig ingeraamd en verstijfd dat het gehele samenstel,
      indien de opening daardoor gesloten is, even sterk is alsof geen opening in het schot aanwezig was. De deuren
      kunnen dicht tegen weer en wind worden afgesloten door middel van pakkingen en knevels of andere, gelijkwaardige
      middelen die permanent aan het schot of aan de deuren zelf zijn bevestigd en zijn zodanig uitgevoerd, dat de deuren
      aan beide zijden van het schot kunnen worden geopend en gesloten. Het Hoofd van de Scheepvaartinspectie kan, zonder
      de veiligheid van de bemanning te veronachtzamen, voor koel- en vrieskamers toestaan dat de deuren slechts aan
      één zijde kunnen worden geopend, mits een deugdelijk alarm wordt aangebracht om te voorkomen dat personen in die
      ruimten worden ingesloten.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.4
  - number: 2.4.2
    text: |-
      In deuropeningen die rechtstreeks toegang geven tot gedeelten van het blootgestelde dek en die gelegen zijn in
      toegangskappen, opbouwen en schachten van machinekamers, bedraagt de hoogte van drempels boven het dek ten minste
      600 mm op het werkdek en ten minste 300 mm op een opbouwdek. Wanneer de bedrijfservaringen zulks rechtvaardigen
      kan het Hoofd van de Scheepvaartinspectie toestaan dat van deze drempelhoogten wordt afgeweken, met dien verstande
      dat de drempelhoogte nimmer minder mag bedragen dan 380 mm op het werkdek en 150 mm op een opbouwdek. Ten aanzien
      van de minimum drempelhoogte van deuropeningen die rechtstreeks toegang geven tot de ruimten voor machines kan niet
      worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.4
  - number: 2.5.1
    text: |-
      De hoogte van luikhoofden boven het dek bedraagt op blootgestelde gedeelten van het werkdek ten minste 600 mm en op
      een opbouwdek ten minste 300 mm.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.5
  - number: 2.5.2
    text: |-
      Bij het bepalen van de dikte van houten luiken wordt rekening gehouden met een toeslag voor slijtage als gevolg van
      een ruwe behandeling. In ieder geval bedraagt de dikte van deze luiken ten minste 4 mm voor elke 100 mm ongesteunde
      spanwijdte met een minimum van 40 mm en bedraagt de breedte van het draagoppervlak ten minste 65 mm.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.5
  - number: 2.5.3
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de voorzieningen om houten luiken
      waterdicht af te sluiten.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.5
  - number: 2.6.1
    text: |-
      De hoogte boven het dek van luikhoofden is uitgevoerd zoals aangegeven in [artikel 2.5, eerste lid][ref1]. Wanneer
      de ervaring in de praktijk zulks rechtvaardigt kan het Hoofd van de Scheepvaartinspectie toestaan dat de hoogte
      van de luikhoofden wordt verlaagd dan wel de luikhoofden geheel worden weggelaten, mits de veiligheid van het
      vissersvaartuig daardoor niet vermindert. In dat geval worden de luikopeningen zo klein als praktisch uitvoerbaar
      gehouden en zijn de luiken blijvend bevestigd door middel van scharnieren of naar het oordeel van het Hoofd van de
      Scheepvaartinspectie gelijkwaardige middelen en kunnen ze snel gesloten en vastgezet worden.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel2
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.6.2
    text: |-
      Voor de berekening van de sterkte wordt aangenomen, dat luiken voor luikopeningen zijn onderworpen aan het gewicht
      van de lading die daarop wordt vervoerd of aan de hierna vermelde statische belasting, al naar gelang welke waarde
      groter is:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.6
  - number: 2.6.2.a
    text: 10,0 kN per m2, voor vissersvaartuigen waarvan de lengte 24 m bedraagt, of
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.6
  - number: 2.6.2.b
    text: 17,0 kN per m2, voor vissersvaartuigen waarvan de lengte 100 m of meer bedraagt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.6
  - number: 2.6.3
    text: |-
      Wanneer de luiken van staal zijn vervaardigd, is de volgens het tweede lid berekende trekspanning vermenigvuldigd
      met de factor 4,25 niet groter dan de minimum treksterkte van het staal. Bij de aangenomen belastingen bedragen de
      doorbuigingen niet meer dan 0,0028 maal de overspanning van het luik.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.6
  - number: 2.6.4
    text: |-
      Luiken van een ander materiaal dan staal zijn ten minste even sterk als stalen luiken en hun constructie is van
      een zodanige stijfheid, dat de dichtheid tegen weer en wind onder de belastingen, bepaald in het tweede lid, is
      verzekerd.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.6
  - number: 2.6.5
    text: |-
      Luiken zijn voorzien van knevels en pakkingen die de dichtheid tegen weer en wind verzekeren, of daaraan naar het
      oordeel van het Hoofd van de Scheepvaartinspectie gelijkwaardige voorzieningen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.6
  - number: 2.7.1
    text: |-
      Openingen boven voortstuwingsruimten zijn rondom versterkt en omsloten door schachten van een sterkte gelijk aan
      die van de aangrenzende bovenbouw. Toegangsopeningen in dergelijke schachten zijn voorzien van deuren die voldoen
      aan het bepaalde in [artikel 2.4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel2
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.7.2
    text: |-
      Openingen anders dan toegangsopeningen in dergelijke schachten zijn voorzien van gelijkwaardige, vast aangebrachte
      afsluitmiddelen en kunnen dicht tegen weer en wind worden afgesloten.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.7
  - number: 2.8.1
    text: |-
      Wanneer zulks voor de visserijwerkzaamheden van belang is, mogen in het dek verzonken stortranden van het schroef-,
      bajonet- of een gelijkwaardig type zijn en mogen mangaten zijn aangebracht, mits deze waterdicht gesloten kunnen
      worden en dergelijke afsluitmiddelen blijvend zijn bevestigd aan de aangrenzende constructie. Met inachtneming
      van afmetingen en plaats van de openingen alsmede de uitvoering van de afsluitmiddelen, mogen metaal op metaal
      afsluitingen zijn aangebracht mits het Hoofd van de Scheepvaartinspectie van oordeel is dat een even doelmatige
      waterdichtheid wordt verkregen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.8
  - number: 2.8.2
    text: |-
      Openingen die geen luikhoofden, openingen boven de voortstuwingsruimte, mangaten of verzonken stortranden in het
      werk- of opbouwdek zijn, worden beschermd door middel van gesloten constructies, voorzien van waterdichte deuren of
      daaraan gelijkwaardige afsluitingen. Toegangskappen zijn zo dicht als praktisch uitvoerbaar is ter hoogte van het
      vlak van kiel en stevens van het vissersvaartuig geplaatst.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.8
  - number: 2.9.1
    text: |-
      Bij vissersvaartuigen waarvan de lengte 45 m of meer bedraagt hebben de schachten van luchtkokers, geen schachten
      van luchtkokers van de voortstuwingsruimte zijnde, een hoogte van ten minste 900 mm boven het werkdek en ten
      minste 760 mm boven het opbouwdek. Bij vissersvaartuigen waarvan de lengte minder dan 45 m bedraagt, bedraagt
      de hoogte van deze schachten respectievelijk 760 mm en 450 mm. De hoogte boven het dek van luchtkokers van de
      voortstuwingsruimte is ten minste 900 mm, of hoger voorzover zulks praktisch uitvoerbaar is.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.9
  - number: 2.9.2
    text: |-
      De sterkte van schachten van luchtkokers is gelijk aan die van de aangrenzende constructie en deze luchtkokers zijn
      voorzien van afsluitmiddelen die een doeltreffende afsluiting vormen dicht tegen weer en wind. De afsluitmiddelen
      zijn blijvend bevestigd aan de luchtkoker of de aangrenzende constructie. Indien de schacht van een luchtkoker
      hoger is dan 900 mm, is deze extra gesteund.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.9
  - number: 2.9.3
    text: |-
      Bij vissersvaartuigen waarvan de lengte 45 m of meer bedraagt, behoeven de luchtkokers waarvan de schachten meer
      dan 4,5 m boven het werkdek of meer dan 2,3 m boven het opbouwdek uitsteken niet van afsluitmiddelen te zijn
      voorzien, tenzij het Hoofd van de Scheepvaartinspectie van oordeel is dat dergelijke afsluitmiddelen noodzakelijk
      zijn. Bij vissersvaartuigen waarvan de lengte minder dan 45 m bedraagt behoeven luchtkokers waarvan de schachten
      meer dan 3,4 m boven het werkdek of meer dan 1,7 m boven het opbouwdek uitsteken niet te zijn voorzien van
      afsluitmiddelen. Indien het naar het oordeel van het Hoofd van de Scheepvaartinspectie niet waarschijnlijk is dat
      water het vissersvaartuig binnendringt via de luchtkokers van de voortstuwingsruimte kunnen afsluitmiddelen aan
      deze luchtkokers vervallen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.9
  - number: 2.10.1
    text: |-
      Indien luchtpijpen van tanks en ledige ruimten boven het werkdek of boven het opbouwdek uitsteken, zijn de
      blootgestelde delen van deze pijpen van gelijke sterkte als de aangrenzende bovenbouw en in voldoende mate
      beschermd. Openingen van luchtpijpen zijn voorzien van afsluitmiddelen die blijvend zijn bevestigd aan de pijp of
      aangrenzende constructie.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.10
  - number: 2.10.2
    text: |-
      De hoogte van de opening van luchtpijpen boven het dek bedraagt op het werkdek ten minste 760 mm en op een
      opbouwdek ten minste 450 mm. Indien de hoogte van een luchtpijp een belemmering vormt voor de visserijwerkzaamheden
      aan boord, kan het Hoofd van de Scheepvaartinspectie een kleinere hoogte toestaan.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.10
  - number: 2.11.1
    text: |-
      Voorzieningen voor peilen zijn aangebracht op de vullingen van alle ruimten die gedurende de reis niet te allen
      tijde toegankelijk zijn, en op alle tanks en kofferdammen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.11
  - number: 2.11.2
    text: 'Als voorzieningen voor peilen als bedoeld in het eerste lid worden aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.11
  - number: 2.11.2.a
    text: |-
      peilinrichtingen ingericht voor aflezing op afstand, waarbij de aflezing van de diverse te peilen ruimten op een
      centrale plaats geschiedt,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.11
  - number: 2.11.2.b
    text: peilinrichtingen in de vorm van peilglazen,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.11
  - number: 2.11.2.c
    text: |-
      peilinrichtingen, geen peilglazen zijnde, ingericht voor aflezing aan of in de directe nabijheid van de te peilen
      ruimten, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.11
  - number: 2.11.2.d
    text: peilinrichtingen in de vorm van peilpijpen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.11
  - number: 2.11.3
    text: |-
      Indien een peilinrichting als bedoeld in het tweede lid, onderdeel a of c, wordt toegepast, is deze van een
      goedgekeurd type. Bij ministeriële regeling kunnen nadere regels worden gesteld voor de constructie en aanleg van
      peilinrichtingen, bedoeld in het tweede lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.11
  - number: 2.11.4
    text: |-
      Indien een peilinrichting als bedoeld in het tweede lid, onderdeel a, wordt toegepast, is de desbetreffende tank of
      ruimte tevens uitgerust met een voorziening voor de controle van het juiste vloeistofniveau.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.11
  - number: 2.11.5
    text: |-
      Het vierde lid is niet van toepassing op kleinere tanks, met inbegrip van sludge-, buffer- en lekolietanks,
      smeerolieaflooptanks, koelwater- en ketelwatertanks, alsmede vullingen van laadruimten.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.11
  - number: 2.11.6
    text: |-
      De voorzieningen voor peilen op de vullingen van laadruimten bestaan uit peilinrichtingen als bedoeld in het tweede
      lid, onderdeel a, c of d.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.11
  - number: 2.11.7
    text: |-
      Indien peilpijpen zijn aangebracht komen de uiteinden uit op een steeds toegankelijke plaats en, indien praktisch
      uitvoerbaar, boven het werkdek. De peilpijpen zijn voorzien van afsluitmiddelen die blijvend zijn bevestigd.
      Peilpijpen die niet tot boven het werkdek zijn opgetrokken zijn voorzien van zelfsluitende kranen. Indien de tanks
      brandbare vloeistoffen bevatten, wordt tevens voldaan aan het bepaalde in [artikel 4.10, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel4
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 2.11.8
    text: Onder peilpijpen zijn stootplaatjes aangebracht.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.11
  - number: 2.11.9
    text: |-
      Indien peilpijpen door laadruimten worden gevoerd, zijn zij aldaar en aan dek zodanig beschermd of zodanig sterk
      dat zij door het verschuiven van lading niet kunnen worden beschadigd.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.11
  - number: 2.11.10
    text: Indien op drinkwatertanks peilpijpen zijn aangebracht, reiken deze ten minste 15 cm boven het dek.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.11
  - number: 2.12.1
    text: |-
      Patrijspoorten in ruimten onder het werkdek en in een gesloten bovenbouw zijn aan de binnenzijde voorzien van
      scharnierende blinden die waterdicht kunnen worden gesloten.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.12
  - number: 2.12.2
    text: |-
      Het laagste punt van een patrijspoort is niet lager aangebracht dan 500 mm boven de hoogst gelegen
      indelingslastlijn.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.12
  - number: 2.12.3
    text: |-
      Patrijspoorten die minder dan 1000 mm boven de hoogst gelegen indelingslastlijn zijn aangebracht, zijn van het
      vaste type.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.12
  - number: 2.12.4
    text: |-
      Alle patrijspoorten, met inbegrip van de zich daarin bevindende ramen, vaste lichtranden en blinden, zijn ten
      genoegen van het Hoofd van de Scheepvaartinspectie. De delen die kunnen worden beschadigd door visgerei zijn
      deugdelijk beschermd.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.12
  - number: 2.12.5
    text: Voor de ramen van het stuurhuis wordt gehard veiligheidsglas of soortgelijk materiaal toegepast.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.12
  - number: 2.12.6
    text: |-
      Ten genoegen van het Hoofd van de Scheepvaartinspectie kunnen patrijspoorten en ramen zonder blinden zijn
      aangebracht in de zij- en achterschotten van dekhuizen op of boven het werkdek, indien naar zijn oordeel de
      veiligheid van het vissersvaartuig daardoor niet vermindert.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.12
  - number: 2.13.1
    text: |-
      De door het scheepsboord gaande afvoerpijpen van ruimten onder het werkdek of van ruimten in gesloten bovenbouwen
      of dekhuizen op het werkdek, voorzien van deuren die voldoen aan het bepaalde in [artikel 2.4][ref1], zijn voorzien
      van doelmatige middelen ter voorkoming van het binnendringen van water. In het algemeen is elke afzonderlijke
      uitlaatopening voorzien van een terugslagklep met een inrichting door middel waarvan de klep in gesloten toestand
      rechtstreeks vanaf een toegankelijke plaats kan worden vastgezet. Een dergelijke klep is niet voorgeschreven indien
      het Hoofd van de Scheepvaartinspectie van oordeel is dat het binnendringen van water via de opening niet zal leiden
      tot een gevaarlijke situatie en dat de dikte van de leiding voldoende is. De inrichting voor het bedienen van de
      klep is uitgerust met een voorziening die aangeeft of de klep open of gesloten is.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel2
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.13.2
    text: |-
      In bemande ruimten voor machines mogen buitenboordsinlaatopeningen en -uitlaatopeningen die van belang zijn voor de
      werking van machines ter plaatse worden bediend. De bedieningen zijn toegankelijk en zijn voorzien van inrichtingen
      die aangeven of de afsluiters open of gesloten zijn.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.13
  - number: 2.13.3
    text: |-
      Huidappendages en afsluiters zoals voorgeschreven ingevolge dit artikel zijn van staal, brons of een ander
      goedgekeurd smeedbaar materiaal vervaardigd. Alle leidingen tussen de huid en de afsluiters zijn van staal, met
      dien verstande dat het Hoofd van de Scheepvaartinspectie op vissersvaartuigen van een ander materiaal dan staal het
      gebruik van andere materialen kan toestaan in ruimten, andere dan ruimten voor machines.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.13
  - number: 2.14.1
    text: |-
      Indien ter plaatse van een kuil op aan weer en wind blootgestelde gedeelten van het werkdek een verschansing is
      aangebracht, wordt de minimum oppervlakte (A) van de waterloospoorten in m2 in elk scheepsboord voor elke kuil op
      het werkdek in relatie tot de lengte (l) en hoogte van de verschansing als volgt bepaald:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.14
  - number: 2.14.1.a
    text: A = 0.07 l, waarbij l niet groter genomen behoeft te worden dan 0.7 L;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.14
  - number: 2.14.1.b.1°
    text: |-
      indien de gemiddelde hoogte van de verschansing groter is dan 1200 mm, wordt voor elke 100 mm verschil in hoogte de
      vereiste oppervlakte van de waterloospoorten vergroot met 0,004 m2 per meter lengte van de kuil;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.14
  - number: 2.14.1.b.2°
    text: |-
      indien de gemiddelde hoogte van de verschansing kleiner is dan 900 mm, mag voor elke 100 mm verschil in hoogte de
      vereiste oppervlakte van de waterloospoorten worden verkleind met 0,004 m2 per meter lengte van de kuil.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.14
  - number: 2.14.2
    text: |-
      De oppervlakte van de waterloospoorten berekend volgens het eerste lid, wordt verhoogd indien het Hoofd van de
      Scheepvaartinspectie van oordeel is dat de zeeg van het vissersvaartuig niet voldoende is om zeker te stellen dat
      het water snel en doelmatig van het dek wordt geloosd.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.14
  - number: 2.14.3
    text: |-
      Behoudens de toestemming van het Hoofd van de Scheepvaartinspectie bedraagt de minimum oppervlakte van de
      waterloospoorten voor elke kuil op het dek van een bovenbouw ten minste de helft van de oppervlakte (A), zoals
      bepaald in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.14
  - number: 2.14.4
    text: |-
      Waterloospoorten zijn zodanig langs de verschansing aangebracht dat water snel en doelmatig van het dek kan worden
      geloosd. De onderkanten van de waterloospoorten liggen zo dicht mogelijk boven het dek.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.14
  - number: 2.14.5
    text: |-
      Lastplanken en inrichtingen waarmee vistuig wordt vastgezet, zijn zodanig aangebracht dat de werking van
      waterloospoorten niet vermindert. Lastplanken zijn zo geconstrueerd dat zij bij gebruik in de juiste stand kunnen
      worden vastgezet en de lozing van overkomend water niet belemmeren.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.14
  - number: 2.14.6
    text: |-
      Waterloospoorten die meer dan 300 mm hoog zijn, zijn door staven met een onderlinge afstand van niet meer dan
      230 mm en niet minder dan 150 mm beschermd of uitgerust met een andere passende voorziening ter bescherming. Indien
      kleppen zijn aangebracht, zijn deze van een goedgekeurd type. Indien inrichtingen voor het vastzetten van deze
      kleppen zijn aangebracht die nodig zijn voor het uitoefenen van de visserij, zijn deze vastzetinrichtingen ten
      genoegen van het Hoofd van de Scheepvaartinspectie en zijn ze vanaf een gemakkelijk bereikbare plaats eenvoudig
      te bedienen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.14
  - number: 2.14.7
    text: |-
      Bij vissersvaartuigen die zijn bestemd om te worden gebruikt in wateren waar ijsafzetting kan voorkomen, kunnen
      kleppen en voorzieningen ter bescherming van waterloospoorten gemakkelijk worden verwijderd teneinde ijsafzetting
      te beperken. De afmeting van openingen en middelen voor het verwijderen van deze voorzieningen ter bescherming zijn
      ten genoegen van het Hoofd van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.14
  - number: 2.15.1
    text: |-
      Er is voorzien in een ankergerei dat is ontworpen voor een snelle en veilige bediening en dat bestaat uit een
      ankerinrichting, ankerkettingen of ankerkabels, borginrichting en ankerlier of een andere inrichting voor het
      laten vallen en halen van het anker en het op de ankerplaats houden van het vissersvaartuig onder alle voorzienbare
      omstandigheden. Vissersvaartuigen zijn tevens voorzien van voldoende meergerei voor het veilig meren onder alle
      bedrijfsomstandigheden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.15
  - number: 2.15.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.15
  - number: 2.16.1
    text: |-
      Werkdekken zijn voorzien van een efficiënt afvoersysteem met een voldoende draineringscapaciteit om het waswater en
      de ingewanden van de vis af te voeren.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.16
  - number: 2.16.2
    text: |-
      Alle voor de visserijactiviteit nodige openingen zijn voorzien van middelen die door één persoon snel en
      doeltreffend kunnen worden afgesloten.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.16
  - number: 2.16.3
    text: |-
      Wanneer de vangst voor behandeling of verwerking op het werkdek wordt gebracht, wordt zij in een vangkamer
      geplaatst. De vangkamers voldoen aan het bepaalde in [artikel 3.11][ref1]. Er is een efficiënt afvoersysteem
      geïnstalleerd. Tevens wordt voorzien in een adequate bescherming tegen onverhoeds op het werkdek stromend water.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel3
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.16
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '3'
        hoofdstuk: '3'
  - number: 2.16.4
    text: De dekken zijn met ten minste twee afvoeropeningen uitgerust.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.16
  - number: 2.16.5
    text: De vrije hoogte in de werkruimte bedraagt overal ten minste twee meter.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.16
  - number: 2.16.6
    text: Er is een vast ventilatiesysteem aangebracht waarmee de lucht ten minste zes keer per uur wordt ververst.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.16
  - number: 2.17.1
    text: Alle vissersvaartuigen zijn aan beide zijden van de voor- en achtersteven voorzien van diepgangsmerken.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.17
  - number: 2.17.2
    text: Deze merken bevinden zich zo dicht mogelijk bij de loodlijnen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.17
  - number: 2.18.1
    text: |-
      Indien vistanks met gekoeld of diepgekoeld zeewater dan wel soortgelijke tanksystemen worden gebruikt, zijn de
      tanks uitgerust met een afzonderlijke, vast aangehechte voorziening voor het vullen en ledigen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.18
  - number: 2.18.2
    text: |-
      Indien de tanks eveneens voor het vervoer van droge lading worden gebruikt, zijn de tanks uitgerust met een
      lenssysteem en voorzien van adequate middelen om te voorkomen dat water uit het lenssysteem in de tanks terecht
      komt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.18
  - number: '2.19'
    text: |-
      De [artikelen 2.16][ref1], [2.17][ref2], [2.18][ref3] zijn slechts van toepassing op Nederlandse vissersvaartuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013342#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0013342#Artikel2
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0013342
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0013342
        artikel: '2'
        hoofdstuk: '2'
  - number: '3.1'
    text: |-
      Vissersvaartuigen zijn zo ontworpen en geconstrueerd dat aan de bepalingen van dit hoofdstuk wordt voldaan in de
      bedrijfsomstandigheden, bedoeld in [artikel 3.7][ref1]. Berekeningen van de krommen van de armen van statische
      stabiliteit zijn ten genoegen van het Hoofd van de Scheepvaartinspectie.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel3
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.2.1
    text: |-
      Vissersvaartuigen voldoen aan de volgende minimum stabiliteitscriteria, tenzij naar het oordeel van het Hoofd van
      de Scheepvaartinspectie praktijkervaringen rechtvaardigen dat van deze criteria wordt afgeweken:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.2
  - number: 3.2.1.a
    text: |-
      de dynamische weg, GZ curve genoemd, is bij een helling van 30° niet kleiner dan 0,055 m-rad en bij een helling
      van 40° of bij de helling, waarbij het vaartuig vervuld raakt, Θ genoemd, indien deze helling minder is dan
      40°, niet kleiner dan 0,09 m-rad. Bovendien is de dynamische weg bij een helling tussen de 30° en 40° of tussen
      30° en Θ, indien deze helling minder is dan 40°, niet kleiner dan 0,03 m-rad. Het vaartuig raakt vervuld (Θ)
      onder een helling waarbij openingen in de romp, bovenbouwen of dekhuizen, die niet snel waterdicht kunnen worden
      afgesloten, onder water beginnen te komen. Bij de toepassing van dit criterium behoeven kleine openingen waardoor
      binnenstromend water niet verder in het vaartuig kan binnendringen, niet als open te worden beschouwd;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.2
  - number: 3.2.1.b
    text: de arm van de statische stabiliteit, GZ genoemd, is ten minste 0,20 m bij een helling van 30° of meer;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.2
  - number: 3.2.1.c
    text: |-
      de maximale waarde van de armen van statische stabiliteit wordt bereikt bij een helling van bij voorkeur meer dan
      30° maar in geen geval bij een helling van minder dan 25°;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.2
  - number: 3.2.1.d
    text: |-
      de aanvangsmetacenterhoogte, GM genoemd, is voor enkeldek vissersvaartuigen niet minder dan 0,35 m. Aan boord
      van vissersvaartuigen met een complete bovenbouw of vissersvaartuigen met een lengte van 70 m of meer kan bij
      ministeriële regeling de metacenterhoogte worden verminderd, maar deze mag in geen geval kleiner zijn dan 0,15 m.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.2
  - number: 3.2.2
    text: |-
      Indien voorzieningen, andere dan kimkielen, zijn aangebracht teneinde het slingeren te beperken, wordt ten genoegen
      van het Hoofd van de Scheepvaartinspectie aangetoond dat in alle bedrijfsomstandigheden de stabiliteit ten minste
      zal blijven voldoen aan de criteria, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.2
  - number: 3.2.3
    text: |-
      Indien wordt voorzien in ballast om zeker te stellen dat is voldaan aan het bepaalde in het eerste lid, zijn de
      aard en de inrichting ervan ten genoegen van het Hoofd van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.2
  - number: '3.3'
    text: |-
      Luikopeningen die tijdens het uitoefenen van visserijwerkzaamheden niet gesloten zijn en die niet snel gesloten
      kunnen worden, zijn zodanig aangebracht dat bij een hellingshoek van 20° of minder geen water de visruimen kan
      binnendringen, tenzij aan het bepaalde in [artikel 3.2, eerste lid][ref1], nog steeds voldaan wordt wanneer die
      visruimen geheel of gedeeltelijk vervuld zijn geraakt.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel3
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '3'
        hoofdstuk: '3'
  - number: '3.4'
    text: |-
      Vaartuigen die worden gebruikt voor bijzondere vismethoden waarbij extra krachten van buitenaf op het
      vissersvaartuig werken tijdens de visserijwerkzaamheden, voldoen ten minste aan de stabiliteitscriteria, bedoeld in
      [artikel 3.2, eerste lid][ref1], die zo nodig bij ministeriële regeling kunnen worden uitgebreid.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel3
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '3'
        hoofdstuk: '3'
  - number: '3.5'
    text: |-
      Vissersvaartuigen zijn, overeenkomstig bij ministeriële regeling te stellen nadere regels, bestand tegen harde wind
      en slingeren in de daarmede verband houdende zeegang, waarbij rekening wordt gehouden met de weersomstandigheden
      en de toestand van de zee in de jaargetijden waarin het vaartuig dienst zal doen, het type vaartuig en het doel
      waarvoor het vaartuig wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.5
  - number: '3.6'
    text: |-
      Vissersvaartuigen zijn, ten genoegen van het Hoofd van de Scheepvaartinspectie, bestand tegen de invloed van water
      aan dek, waarbij rekening wordt gehouden met de weersomstandigheden en de toestand van de zee in de jaargetijden
      waarin het vaartuig dienst zal doen, het type vaartuig en het doel waarvoor het vaartuig wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.6
  - number: 3.7.1
    text: |-
      Het aantal en de soort bedrijfsomstandigheden waarmee rekening moet worden gehouden is ten genoegen van het Hoofd
      van de Scheepvaartinspectie en omvat ten minste:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.7
  - number: 3.7.1.a
    text: vertrek naar de visgronden met volle brandstoftanks, bevoorrading, ijs, visgerei, en dergelijke;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.7
  - number: 3.7.1.b
    text: vertrek vanaf de visgronden met volle vangst;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.7
  - number: 3.7.1.c
    text: aankomst in de thuishaven met volle vangst en 10% bevoorrading, brandstof, en dergelijke;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.7
  - number: 3.7.1.d
    text: |-
      aankomst in de thuishaven met 10% bevoorrading, brandstof en een minimum vangst die normaal 20% van de volle
      vangst bedraagt, maar kan oplopen tot 40%, mits het Hoofd van de Scheepvaartinspectie van oordeel is dat
      bedrijfsomstandigheden een dergelijke waarde rechtvaardigen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.7
  - number: 3.7.2
    text: |-
      In aanvulling op de specifieke bedrijfsomstandigheden, bedoeld in het eerste lid, wordt voldaan aan de minimum
      stabiliteitscriteria, zoals bepaald in [artikel 3.2][ref1], bij alle andere te verwachten bedrijfsomstandigheden,
      met inbegrip van die welke de laagste waarden van de stabiliteitsparameters te zien geven en zijn vervat in deze
      criteria. Tevens wordt rekening gehouden met de bijzondere omstandigheden die verband houden met een wijziging van
      het doel waarvoor het vaartuig wordt gebruikt of van het vaargebied en die van invloed zijn op de stabiliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel3
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.7.3
    text: 'Met betrekking tot de omstandigheden, bedoeld in het eerste lid, omvatten de berekeningen het volgende:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.7
  - number: 3.7.3.a
    text: toeslag voor het gewicht van de natte visnetten en takel enz. op het dek,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.7
  - number: 3.7.3.b
    text: toeslag voor ijsafzetting, indien dit wordt voorzien, in overeenstemming met het bepaalde in artikel 3.8,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.7
  - number: 3.7.3.c
    text: gelijkmatige verdeling van de vangst, tenzij dit niet praktisch is,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.7
  - number: 3.7.3.d
    text: |-
      vangst aan dek, indien dit wordt voorzien, in de bedrijfsomstandigheden, zoals aangegeven in het eerste lid,
      onderdeel b en c, en in het tweede lid,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.7
  - number: 3.7.3.e
    text: |-
      waterballast indien vervoerd hetzij in tanks die voor dit doel zijn bestemd, hetzij in andere tanks die ook voor
      het vervoer van waterballast zijn ingericht, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.7
  - number: 3.7.3.f
    text: toeslag voor het effect van het vrije vloeistofoppervlak en, indien van toepassing, voor de visvangst.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.7
  - number: 3.8.1
    text: |-
      Voor vissersvaartuigen die dienst doen in gebieden waar zich ijsafzetting kan voordoen, wordt in de
      stabiliteitsberekeningen rekening gehouden met de volgende ijstoeslag:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.8
  - number: 3.8.1.a
    text: 30 kg per vierkante meter op blootgestelde dekken en gangboorden;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.8
  - number: 3.8.1.b
    text: |-
      7,5 kg per vierkante meter op het geprojecteerde zijdelingse oppervlak aan elke zijde van het vaartuig boven de
      waterlijn;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.8
  - number: 3.8.1.c
    text: |-
      het geprojecteerde zijdelingse oppervlak van relingwerk, laadgerei, met uitzondering van de masten, en tuigage en
      het geprojecteerde zijdelingse oppervlak van andere kleine onderdelen, wordt in rekening gebracht door vergroting
      van het totale geprojecteerde ononderbroken oppervlak met 5% en het totale statische moment van dit oppervlak met
      10%.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.8
  - number: 3.8.2
    text: |-
      Vaartuigen die zijn bestemd voor het uitoefenen van de visserij in gebieden waarvan het bekend is dat er zich
      ijsafzetting voordoet, zijn:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.8
  - number: 3.8.2.a
    text: ontworpen om ijsafzetting tot een minimum te beperken, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.8
  - number: 3.8.2.b
    text: uitgerust met middelen voor het verwijderen van ijs ten genoegen van het Hoofd van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.8
  - number: 3.9.1
    text: |-
      Elk vissersvaartuig wordt na voltooiing aan een hellingproef onderworpen, waarbij het werkelijke gewicht en de
      ligging van het zwaartepunt worden bepaald voor de toestand van het lege vaartuig.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.9
  - number: 3.9.2
    text: |-
      Indien een vissersvaartuig wijzigingen heeft ondergaan die van invloed kunnen zijn op de toestand van het lege
      vaartuig en de ligging van het zwaartepunt, wordt het vaartuig, indien het Hoofd van de Scheepvaartinspectie van
      oordeel is dat dit noodzakelijk is, opnieuw aan een hellingproef onderworpen en worden de stabiliteitsgegevens
      herzien.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.9
  - number: 3.9.3
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan ontheffing verlenen van de eis van de hellingproef van een individueel
      vaartuig indien de basisstabiliteitsgegevens beschikbaar zijn van de hellingproef van een zusterschip en
      ten genoegen van het Hoofd van de Scheepvaartinspectie is aangetoond dat betrouwbare gegevens betreffende de
      stabiliteit vanuit dergelijke basisgegevens kan worden verkregen voor het vaartuig dat van de hellingproef is
      uitgezonderd.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.9
  - number: 3.9.4
    text: |-
      Voor Nederlandse vissersvaartuigen vinden de hellingproef en de vaststelling van de voorwaarden, bedoeld in het
      eerste lid, ten minste om de tien jaar plaats.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.9
  - number: 3.10.1
    text: |-
      De schipper beschikt over voldoende nauwkeurige en betrouwbare gegevens betreffende de stabiliteit om op een
      snelle en eenvoudige wijze de stabiliteit van het vaartuig onder verschillende bedrijfsomstandigheden te kunnen
      beoordelen. Deze gegevens bevatten zo nodig gerichte instructies voor de schipper die hem waarschuwen voor die
      bedrijfsomstandigheden die een ongunstige invloed kunnen hebben op de stabiliteit of de trim van het vaartuig. De
      stabiliteitsgegevens worden ter goedkeuring overgelegd aan het Hoofd van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.10
  - number: 3.10.2
    text: |-
      De goedgekeurde stabiliteitsgegevens zijn te allen tijde aan boord aanwezig en beschikbaar. Deze gegevens worden
      tijdens het periodieke onderzoek geïnspecteerd om zeker te stellen dat zij goedgekeurd zijn voor de gebruikte
      bedrijfsomstandigheden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.10
  - number: 3.10.3
    text: |-
      Indien een vaartuig wijzigingen heeft ondergaan die van invloed zijn op zijn stabiliteit, worden de gegevens
      betreffende de stabiliteit opnieuw berekend en ter goedkeuring aan het Hoofd van de Scheepvaartinspectie
      voorgelegd. Indien op grond van deze stabiliteitsberekeningen het Hoofd van de Scheepvaartinspectie van oordeel
      is dat de bestaande stabiliteitsgegevens moeten worden herzien, worden de nieuwe gegevens aan de schipper ter
      beschikking gesteld en worden de verouderde gegevens verwijderd.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.10
  - number: '3.11'
    text: |-
      De vislading wordt deugdelijk gestuwd teneinde het overgaan van de lading, waardoor een gevaarlijke vertrimming of
      slagzij van het vaartuig zou kunnen ontstaan, tegen te gaan. Indien hiertoe keeschotten worden toegepast, zijn deze
      ten genoegen van het Hoofd van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.11
  - number: '3.12'
    text: |-
      Ten genoegen van het Hoofd van de Scheepvaartinspectie is de boeghoogte toereikend om te voorkomen dat het vaartuig
      bovenmatige hoeveelheden water overkrijgt en is de boeghoogte zodanig vastgesteld dat rekening is gehouden met
      de weersomstandigheden en de toestand van de zee in de jaargetijden waarin het vaartuig dienst zal doen, het type
      vaartuig en het doel waarvoor het vaartuig wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.12
  - number: '3.13'
    text: |-
      Aan het Hoofd van de Scheepvaartinspectie wordt een zodanige maximum toelaatbare diepgang ter goedkeuring
      voorgelegd dat onder de bijbehorende bedrijfsomstandigheden wordt voldaan aan de stabiliteitscriteria van dit
      hoofdstuk en aan de betreffende voorschriften zoals bepaald in de [hoofdstukken 2][ref1] en [6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0013342#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0013342
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0013342
        hoofdstuk: '6'
  - number: '3.14'
    text: |-
      Van een vissersvaartuig waarvan de lengte 100 m of meer bedraagt en met 100 of meer opvarenden aan boord is ten
      genoegen van het Hoofd van de Scheepvaartinspectie de stabiliteit toereikend om het lek raken van enig compartiment
      te kunnen doorstaan, waarbij rekening wordt gehouden met het type vaartuig, de aard van de dienst waarvoor het
      vaartuig bestemd is en het vaargebied.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel3.14
  - number: '4.1'
    text: |-
      Dit hoofdstuk is van toepassing op vissersvaartuigen met een lengte van 45 meter of meer en op nieuwe Nederlandse
      vissersvaartuigen met een lengte van 24 meter of meer.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.1
  - number: '4.2'
    text: 'Voor de toepassing van dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.2
  - number: 4.2.1
    text: |-
      *hoofdstuurinrichting:* het werktuig, de krachtwerktuigen voor de stuurinrichting, indien aanwezig, en de
      bijbehorende inrichtingen en de middelen om het koppel op de roerkoning over te brengen, met inbegrip van de
      helmstok of het kwadrant, benodigd om de roeruitslag te bewerkstelligen met het doel het vaartuig onder normale
      bedrijfsomstandigheden te kunnen besturen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.2
  - number: 4.2.2
    text: |-
      *hulpstuurinrichting:* de uitrusting, benodigd om de roeruitslag te bewerkstelligen met het doel het vaartuig te
      kunnen besturen in het geval de hoofdstuurinrichting is uitgevallen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.2
  - number: 4.2.3
    text: '*krachtwerktuig voor de stuurinrichting:*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.2
  - number: 4.2.3.a
    text: 'bij een elektrische stuurinrichting: een elektromotor met de bijbehorende elektrische apparatuur;'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.2
  - number: 4.2.3.b
    text: |-
      bij een elektrisch-hydraulische stuurinrichting: een elektromotor met de daarbij behorende elektrische apparatuur
      en de door de motor aangedreven pomp;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.2
  - number: 4.2.3.c
    text: 'bij een ander type hydraulische stuurinrichting: een pomp en het werktuig voor de aandrijving ervan;'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.2
  - number: 4.2.4
    text: |-
      *maximum dienstsnelheid vooruit:* de hoogste snelheid waarvoor het vaartuig is ontworpen om deze op zee, bij de
      grootst toegestane diepgang in zeewater, te kunnen handhaven;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.2
  - number: 4.2.5
    text: |-
      *maximum dienstsnelheid achteruit:* de snelheid die het vaartuig naar verwachting zal kunnen bereiken bij het
      maximale ontwerp-achteruitvermogen en bij de grootst toegestane diepgang in zeewater;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.2
  - number: 4.2.6
    text: |-
      *oliestookinrichting:* de installatie, gebruikt voor de toebereiding van brandstofolie voor levering aan een
      met olie gestookte ketel, of de installatie, gebruikt voor de toebereiding van olie voor levering aan een
      verbrandingsmotor, met inbegrip van alle oliedrukpompen, filters en verhitters die olie behandelen onder een druk
      van meer dan 0,18 N/mm2;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.2
  - number: 4.2.7
    text: |-
      *normale toestand van bedrijfsvoering en leefbaarheid:* een toestand waaronder het vaartuig als geheel, de
      werktuigen, diensten, middelen van hoofd- en hulpvoortstuwing, stuurinrichting en bijbehorende apparatuur,
      hulpmiddelen voor veilige navigatie en het beperken van de gevaren van brand en vervuld raken, interne en externe
      communicatiemiddelen en seinen, voorzieningen voor ontsnapping en lieren voor hulpverleningsboten goed functioneren
      en waarbij aan de minimumeisen van comfort en leefbaarheid aan boord wordt voldaan;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.2
  - number: 4.2.8
    text: |-
      *doodschip toestand:* die toestand waarbij de hoofdvoortstuwingsinstallatie, ketels en hulpwerktuigen niet werken
      als gevolg van het ontbreken van vermogen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.2
  - number: 4.2.9
    text: |-
      *hoofdschakelbord:* een schakelbord dat rechtstreeks gevoed wordt door de elektrische hoofdkrachtbron en bestemd is
      om de elektrische energie te verdelen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.2
  - number: 4.2.10
    text: |-
      *tijdelijk onbemande machinekamers:* die ruimten waarin zich de hoofdvoortstuwingswerktuigen en bijbehorende
      installaties, alsmede alle elektrische hoofdkrachtbronnen bevinden en die niet te allen tijde bij alle
      werkzaamheden, met inbegrip van het manoeuvreren, bemand behoeven te zijn.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.2
  - number: '4.3'
    text: |-
      1 Hoofdvoortstuwingsinstallaties, bedieningssystemen, stoomleidingsystemen, brandstofsystemen, drukluchtsystemen,
      elektrische installaties, koelsystemen, hulpwerktuigen, ketels en andere drukvaten, pijpleidingen en
      pompinstallaties, stuurmachines en toebehoren, assen en koppelingen, bestemd voor de overdracht van vermogen,
      zijn ten genoegen van het Hoofd van de Scheepvaartinspectie ontworpen, geconstrueerd, beproefd, ingericht en
      onderhouden. De uitvoering en de opstelling van deze machine-installaties, met inbegrip van hefwerktuigen, lieren
      en uitrusting voor de behandeling en verwerking van vis, zijn zodanig, dat de veiligheid en de gezondheid van in de
      nabijheid aanwezige personen zoveel mogelijk is gewaarborgd. Waar nodig zijn ter beveiliging tegen bewegende delen,
      hete oppervlakken en andere gevaren, schermplaten, handgrepen of hekwerk aangebracht.

      2 Ruimten voor machines zijn zodanig ontworpen dat alle werktuigen en de daarbij behorende bedieningsinstallaties,
      alsmede alle andere onderdelen die onderhoud kunnen vereisen, veilig en gemakkelijk toegankelijk zijn. De
      betreffende ruimten kunnen voldoende worden geventileerd.

      3 a. Er zijn voorzieningen aangebracht die de goede werking van de voortstuwingsinstallatie kunnen handhaven of
      herstellen, zelfs indien één van de essentiële hulpinstallaties uitvalt. Bijzondere aandacht wordt daarbij gegeven
      aan de goede werking van: 1°. de inrichtingen die de brandstoftoevoer naar de hoofdvoortstuwingsinstallatie
      verzorgen, 2°. de normale middelen die de smeeroliedruk verzorgen, 3°. de hydraulische, pneumatische en elektrische
      middelen voor de bediening van de hoofdvoortstuwingsinstallatie, met inbegrip van de verstelbare schroeven, 4°.
      de middelen om de koelwaterdruk ten behoeve van de koelsystemen van de hoofdvoortstuwingsinstallatie te verzorgen,
      en 5°. de luchtcompressoren en de luchtvaten voor aanzet- of bedieningsdoeleinden, waarbij het Hoofd van de
      Scheepvaartinspectie een gedeeltelijke vermindering van het vermogen kan accepteren, rekening houdend met de
      algehele veiligheid, in plaats van een bedrijfstoestand onder volle belasting. b. Er zijn voorzieningen aangebracht
      met behulp waarvan de machine-installatie in werking kan worden gesteld vanuit een doodschip toestand zonder dat
      hulp van buitenaf wordt geboden.

      4 Hoofdvoortstuwingsinstallaties en alle hulpinstallaties die noodzakelijk zijn voor de voortstuwing en de
      veiligheid van het vaartuig, kunnen, zoals zij zijn geïnstalleerd, functioneren ongeacht of het vaartuig recht ligt
      dan wel een slagzij maakt tot 15° naar beide zijden onder statische omstandigheden of een slagzij tot 22,5° naar
      beide zijden onder dynamische omstandigheden, waarbij het vaartuig over beide zijden slingert en gelijktijdig een
      dynamische stampbeweging tot 7,5° over de boeg of achtersteven maakt. Het Hoofd van de Scheepvaartinspectie kan,
      rekening houdende met het type, de afmetingen en het gebruik van het vaartuig, toestaan dat van deze criteria wordt
      afgeweken.

      5 Het ontwerp, de constructie en de installatie van voortstuwingssystemen zijn zodanig, dat binnen de normale
      bedrijfsgebieden op geen enkele wijze door trillingen abnormale spanningen in deze voortstuwingssystemen worden
      veroorzaakt.

      6 Het ontwerp en de bouw van elektrische installaties zijn zodanig uitgevoerd dat: a. de diensten die nodig zijn om
      de normale toestand van bedrijfsvoering en leefbaarheid te handhaven, zijn verzekerd zonder dat behoeft te worden
      teruggevallen op de noodkrachtbron, b. de diensten die essentieel zijn voor de veiligheid tijdens verschillende
      noodtoestanden, zijn verzekerd, en c. de veiligheid van bemanning en vaartuig tegen gevaren van elektrische aard
      is gewaarborgd.

      7 Ter uitvoering van het bepaalde in de [artikelen 4.16 tot en met 4.18][ref1] kunnen bij ministeriële regeling
      nadere regels worden gesteld ten aanzien van elektrische installaties.

      8 De [artikelen 4.19 tot en met 4.24][ref2] zijn van toepassing op vissersvaartuigen met tijdelijk
      onbemande machinekamers, in aanvulling op het bepaalde in de [artikelen 4.3 tot en met 4.18][ref3] en
      [5.1 tot en met 5.44][ref4].

      9 Er zijn zodanige voorzieningen getroffen, ten genoegen van het Hoofd van de Scheepvaartinspectie, dat verzekerd
      is dat de gehele machine-installatie onder alle omstandigheden, manoeuvreren inbegrepen, op betrouwbare wijze
      functioneert. In elk geval omvatten deze voorzieningen regelmatige inspecties en ronden teneinde de voortdurende
      betrouwbare werking van de machine-installatie te verzekeren.

      10 Er is een verklaring aan boord waaruit ten genoegen van het Hoofd van de Scheepvaartinspectie blijkt dat het
      vaartuig is ingericht om met tijdelijk onbemande machinekamers te varen.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013342#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0013342#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0013342#Artikel5
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013342
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0013342
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0013342
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 4.4.1
    text: |-
      Hoofd- en hulpwerktuigen die noodzakelijk zijn voor de voortstuwing en de veiligheid van het vaartuig, zijn
      voorzien van doelmatige bedieningsmiddelen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.4
  - number: 4.4.2
    text: |-
      Verbrandingsmotoren met een cilinderdiameter groter dan 200 mm, of een krukkastvolume groter dan 0,6 m3, zijn
      voorzien van ontlastkleppen voor krukkastexplosies. Deze ontlastkleppen zijn van een goedgekeurd type en hebben een
      voldoende ontlastoppervlak.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.4
  - number: 4.4.3
    text: |-
      Indien hoofd- of hulpwerktuigen, drukvaten inbegrepen, of onderdelen van deze werktuigen aan inwendige druk
      zijn onderworpen en aan gevaarlijke overdruk kunnen worden blootgesteld, worden, waar praktisch uitvoerbaar,
      voorzieningen getroffen die tegen zulk een te hoge druk beschermen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.4
  - number: 4.4.4
    text: |-
      Alle tandwieloverbrengingen en elke as en koppeling welke gebruikt worden voor het overbrengen van vermogen
      naar werktuigen die essentieel zijn voor de voortstuwing en veiligheid van het vaartuig en van de opvarenden,
      zijn zodanig ontworpen en vervaardigd dat zij bestand zijn tegen de hoogste spanningen waaraan zij kunnen worden
      onderworpen in alle bedrijfstoestanden. Speciale aandacht wordt geschonken aan de uitvoering van de werktuigen
      waardoor zij worden aangedreven of waarvan zij een onderdeel uitmaken.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.4
  - number: 4.4.5
    text: |-
      Voortstuwingswerktuigen en, waar van toepassing, hulpwerktuigen zijn voorzien van automatisch werkende
      voorzieningen om deze uit te schakelen bij storingen, zoals het uitvallen van de smeerolietoevoer, die
      aanleiding kunnen geven tot ernstige schade, onklaar geraken of explosie. Tevens is een vooralarm aangebracht
      opdat een waarschuwingssignaal wordt gegeven alvorens de machines automatisch worden gestopt. Het Hoofd van de
      Scheepvaartinspectie kan echter voorzieningen toestaan waarmee de automatische stopinrichtingen buiten werking
      kunnen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.4
  - number: 4.5.1
    text: |-
      Er kan een zodanig voortstuwingsvermogen worden ontwikkeld dat het vaartuig onder alle in de praktijk voorkomende
      omstandigheden behoorlijk manoeuvreerbaar is.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.5
  - number: 4.5.2
    text: |-
      Ten genoegen van het Hoofd van de Scheepvaartinspectie wordt aangetoond dat de machine-installatie in staat is de
      richting van de stuwdruk van de schroef binnen redelijke tijd om te keren en hiermede binnen redelijke afstand de
      vaart uit het vaartuig te halen vanuit de maximum dienstsnelheid vooruit.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.5
  - number: 4.6.1
    text: |-
      Elke stoomketel en elke ongestookte stoomgenerator is voorzien van ten minste twee veiligheidskleppen van
      voldoende capaciteit, met dien verstande dat het Hoofd van de Scheepvaartinspectie, rekening houdende met de
      capaciteit of enige andere eigenschap van stoomketels of ongestookte stoomgenerators, kan toestaan dat slechts
      één veiligheidsklep is aangebracht, mits hij ervan overtuigd is dat in dat geval voorzien is in een afdoende
      beveiliging tegen overdruk.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.6
  - number: 4.6.2
    text: |-
      Elke met olie gestookte stoomketel die is ontworpen om niet met de hand te worden bediend, is voorzien van
      veiligheidsinrichtingen die de olietoevoer afsluiten en alarm geven in geval van laag waterpeil, storing in de
      luchttoevoer of vlamstoring.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.6
  - number: 4.6.3
    text: |-
      Het Hoofd van de Scheepvaartinspectie schenkt bijzondere aandacht aan stoomketelinstallaties, teneinde zeker te
      stellen dat voedingwatersystemen, bedieningsapparatuur en veiligheidsvoorzieningen in alle opzichten geschikt zijn
      om de veiligheid van ketels, stoomdrukvaten en stoomleidingen te garanderen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.6
  - number: '4.7'
    text: |-
      Twee onafhankelijk werkende communicatiemiddelen zijn tussen het stuurhuis en de machinekamer aangebracht,
      waarvan één een machinekamertelegraaf is, met dien verstande dat voor vaartuigen waarvan de lengte minder dan 45 m
      bedraagt en waarvan de voortstuwingswerktuigen rechtstreeks vanuit het stuurhuis worden bediend, het Hoofd van de
      Scheepvaartinspectie andere communicatiemiddelen dan een machinekamertelegraaf kan aanvaarden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.7
  - number: 4.8.1
    text: 'Indien een voortstuwingswerktuig vanuit het stuurhuis kan worden bediend:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.8
  - number: 4.8.1.a
    text: |-
      kan onder alle bedrijfsomstandigheden het manoeuvreren, de snelheid, de richting van de stuwkracht en, indien van
      toepassing, de spoed van de verstelbare schroef volledig door middel van afstandsbediening vanuit het stuurhuis
      worden geregeld;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.8
  - number: 4.8.1.b
    text: |-
      wordt de afstandsbediening, bedoeld in onderdeel a, ten genoegen van het Hoofd van de Scheepvaartinspectie
      verricht door middel van een bedieningsapparaat dat zonodig voorzien is van een inrichting die voorkomt dat de
      voortstuwingswerktuigen worden overbelast;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.8
  - number: 4.8.1.c
    text: |-
      zijn de hoofdvoortstuwingswerktuigen voorzien van een noodstopinrichting in het stuurhuis, die onafhankelijk werkt
      van het bedieningssysteem in het stuurhuis, bedoeld onder a;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.8
  - number: 4.8.1.d
    text: |-
      is de bediening zodanig uitgevoerd dat afstandsbediening van het voortstuwingswerktuig slechts op één plaats
      tegelijk kan geschieden: op elke bedieningsplaats kunnen gekoppelde onderstations worden toegestaan. Op elke
      bedieningsplaats is aangegeven welke bedieningsplaats het voortstuwingswerktuig bedient. De overschakeling van de
      bediening tussen het stuurhuis en de ruimte voor machines is slechts mogelijk in de ruimte voor machines of in de
      controlekamer. Voor vaartuigen waarvan de lengte minder dan 45 m bedraagt kan het Hoofd van de Scheepvaartinspectie
      toestaan dat de bedieningsplaats in de ruimte voor machines alleen een noodbedieningsplaats is, mits de controle-
      inrichting en bedieningsorganen in het stuurhuis doelmatig zijn;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.8
  - number: 4.8.1.e
    text: 'zijn instrumenten in het stuurhuis aangebracht die aangeven:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.8
  - number: 4.8.1.e.1°
    text: |-
      de omwentelingssnelheid en de draairichting van de schroef in het geval het vaartuig is voorzien van vaste
      schroeven,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.8
  - number: 4.8.1.e.2°
    text: |-
      de omwentelingssnelheid en de stand van de spoed in het geval het vaartuig is voorzien van verstelbare schroeven,
      en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.8
  - number: 4.8.1.e.3°
    text: |-
      het vooralarm, bedoeld in [artikel 4.4, vijfde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel4
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.8.1.f
    text: |-
      kunnen, indien een storing optreedt in een onderdeel van het afstandsbedieningsysteem, de voortstuwingswerktuigen
      ter plaatse worden bediend;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.8
  - number: 4.8.1.g
    text: |-
      is, tenzij zulks naar het oordeel van het Hoofd van de Scheepvaartinspectie praktisch niet uitvoerbaar is, het
      afstandsbedieningsysteem zodanig ontworpen, dat bij uitvallen alarm wordt gegeven en de vooraf ingestelde snelheid
      en richting van de stuwkracht worden gehandhaafd totdat de bediening op andere wijze wordt overgenomen, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.8
  - number: 4.8.1.h
    text: |-
      zijn bijzondere voorzieningen aangebracht die verhinderen dat bij automatisch starten de mogelijkheid om te starten
      uitgeput zal raken, waartoe een alarm is aangebracht dat een lage aanzetdruk aangeeft en dat is afgesteld op een
      druk waarbij aanzetten van het voortstuwingswerktuig nog mogelijk is.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.8
  - number: 4.8.2
    text: |-
      Wanneer de hoofdvoortstuwingswerktuigen en bijbehorende machine-installaties, met inbegrip van de elektrische
      hoofdkrachtbron, zijn voorzien van verschillende graden van automatische bediening of afstandsbediening en daarop
      voortdurend toezicht wordt gehouden vanuit een controlekamer, is deze controlekamer zodanig ontworpen, uitgerust
      en ingericht, dat de werking van de machine-installaties even veilig en doeltreffend is als wanneer daarop
      rechtstreeks toezicht wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.8
  - number: 4.8.3
    text: |-
      Automatische systemen voor aanzetten, regeling en bediening omvatten in het algemeen voorzieningen om de bediening
      van deze systemen met de hand over te kunnen nemen. Storing in enig gedeelte van deze systemen mag het gebruik van
      voorzieningen voor handbediening niet verhinderen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.8
  - number: 4.9.1
    text: |-
      Er zijn voorzieningen aangebracht om ongewenste overdruk te voorkomen in enig deel van systemen voor samengeperste
      lucht en in die gevallen waarin watermantels of cilinderblokken van luchtcompressoren en huizen van koelers kunnen
      worden onderworpen aan een gevaarlijke overdruk ten gevolge van lekkage naar deze delen, afkomstig van onder
      luchtdruk staande onderdelen. Doelmatige ontlastvoorzieningen zijn op deze systemen aangebracht.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.9
  - number: 4.9.2
    text: |-
      De aanzetluchtleidingen van direct omkeerbare voortstuwingsmotoren zijn voorzien van veiligheidsinrichtingen
      teneinde explosies in de aanzetluchtleidingen te voorkomen of te lokaliseren.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.9
  - number: 4.9.3
    text: |-
      Alle persleidingen van de aanzetluchtcompressoren zijn rechtstreeks aangesloten op de aanzetluchtvaten, terwijl
      alle aanzetluchtleidingen van de aanzetluchtvaten naar de hoofd- en hulpmotoren geheel gescheiden zijn van het
      persleidingsysteem van de compressoren.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.9
  - number: 4.9.4
    text: |-
      Er zijn voorzieningen getroffen om het binnendringen van olie in de systemen voor samengeperste lucht tot een
      minimum te beperken en om deze olie uit het betreffende systeem af te voeren.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.9
  - number: 4.10.1
    text: |-
      Als vloeibare brandstof mag slechts olie worden gebruikt waarvan het vlampunt niet lager is dan 60°C, welke waarde
      is verkregen door middel van een toestel voor het bepalen van het vlampunt, behalve voor noodaggregaten, waarvoor
      olie met een vlampunt dat niet lager is dan 43°C mag worden gebruikt. Het Hoofd van de Scheepvaartinspectie kan
      echter het algemeen gebruik toestaan van brandstofolie met een vlampunt dat niet lager is dan 43°C, onder zodanige
      voorzorgen als hij nodig acht en op voorwaarde dat de temperatuur in de ruimte waarin zulke brandstofolie is
      opgeslagen of wordt gebruikt, niet zal mogen stijgen tot een waarde hoger dan 10°C onder het vlampunt van de
      brandstofolie.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.10
  - number: 4.10.2
    text: |-
      Er zijn veilige en doeltreffende middelen aanwezig ter bepaling van de hoeveelheid brandstofolie in een tank.
      Indien peilpijpen zijn aangebracht komen de uiteinden daarvan uit op plaatsen waar geen gevaar voor ontsteking
      bestaat, tenzij voorzorgsmaatregelen zijn genomen zoals het aanbrengen van een doeltreffende afscherming om te
      voorkomen dat brandstofolie in aanraking komt met een ontstekingsbron in het geval olie uit de uiteinden van
      de peilpijpen vloeit. Bovendien zijn de uiteinden van de peilpijpen voorzien van een zelfsluitende kraan met
      daaronder aangebracht een zelfsluitend controlekraantje teneinde, alvorens de zelfsluitende kraan in geopende
      stand te brengen, te kunnen vaststellen dat aldaar geen brandstofolie aanwezig is. Voorzieningen zijn aangebracht
      om te waarborgen dat brandstofolie afkomstig uit het controlekraantje geen gevaar voor ontsteking oplevert.
      Peilglazen die van voldoende dikte zijn en die beschermd zijn door een metalen mantel, mogen worden toegepast,
      mits zelfsluitende kranen zijn aangebracht. Het Hoofd van de Scheepvaartinspectie kan ter vaststelling van de
      hoeveelheid brandstofolie in een tank andere middelen toestaan, mits het onklaar raken daarvan of het overvullen
      van de tanks niet tot gevolg heeft dat daardoor brandstofolie buiten de tank geraakt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.10
  - number: 4.10.3
    text: |-
      Er zijn voorzieningen getroffen ter vermijding van overdruk in een brandstofolietank of in een gedeelte van het
      brandstofoliesysteem, met inbegrip van de vulpijpen. Ontlastkleppen en lucht- of overvloeipijpen voeren af op een
      veilige manier, ten genoegen van het Hoofd van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.10
  - number: 4.10.4
    text: |-
      Iedere brandstofleiding waaruit bij beschadiging olie zou kunnen ontsnappen uit een boven de dubbele bodem
      opgestelde voorraad-, bezink- of dagtank, is direct aan de tank voorzien van een afsluiter die vanaf een veilige
      plaats buiten de betrokken ruimte waarin dergelijke tanks zijn geplaatst, kan worden gesloten in het geval dat
      in die ruimte brand uitbreekt. In het bijzondere geval van dieptanks in een schroefas- of pijpentunnel of een
      dergelijke ruimte, zijn afsluiters op deze tanks aangebracht. De afsluiting in het geval van brand mag evenwel
      worden bewerkstelligd door middel van een extra afsluiter in de pijp of pijpen buiten de tunnel of dergelijke
      ruimte. Indien zo'n extra afsluiter is aangebracht in de ruimte voor machines, kan deze afsluiter vanaf een plaats
      buiten deze ruimte worden bediend.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.10
  - number: 4.10.5
    text: |-
      Pompen die deel uitmaken van het brandstofleidingsysteem, zijn gescheiden van elk ander leidingsysteem en de
      aansluitingen op de betrokken pompen zijn voorzien van een doelmatige ontlastklep die deel uitmaakt van een
      gesloten systeem. Wanneer brandstofolietanks tevens gebruikt kunnen worden als ballasttanks, zijn doelmatige
      voorzieningen getroffen om het brandstofleidingsysteem en het ballastleidingsysteem van elkaar te scheiden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.10
  - number: 4.10.6
    text: |-
      Olietanks mogen niet zodanig zijn gelegen dat overvloeien of lekkage van vloeistof daaruit op hete oppervlakken
      een gevaar kan vormen. Er zijn voorzorgsmaatregelen genomen om te voorkomen dat olie onder druk, die uit een pomp,
      filter of voorwarmers zou kunnen ontsnappen, in aanraking komt met hete oppervlakken.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.10
  - number: 4.10.7.a
    text: |-
      Brandstofleidingen en hun afsluiters en bevestigingen zijn van staal of ander gelijkwaardig materiaal, behoudens
      dat een beperkt gebruik van flexibele leidingen kan worden toegestaan op plaatsen waar ze naar het oordeel van
      het Hoofd van de Scheepvaartinspectie noodzakelijk zijn. Dergelijke flexibele leidingen en hun eindbevestigingen
      zijn zodanig geconstrueerd dat ze van een voldoende sterkte zijn en dat ze ten genoegen van het Hoofd van de
      Scheepvaartinspectie van goedgekeurd brandbestendig materiaal zijn of dat ze zijn voorzien van een brandbestendige
      deklaag.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.10
  - number: 4.10.7.b
    text: |-
      Waar dit noodzakelijk is, zijn brandstofolie- en smeerolieleidingen, voor zover praktisch uitvoerbaar, afgeschermd
      of op andere wijze doeltreffend beveiligd teneinde olienevel of olielekkage op hete oppervlakken of in luchtinlaten
      van werktuigen te voorkomen. Het aantal koppelingen in pijpleidingen wordt tot een minimum beperkt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.10
  - number: 4.10.8
    text: |-
      Voor zover dit praktisch uitvoerbaar is, maken de brandstofolietanks deel uit van de scheepsconstructie en zijn
      buiten de ruimten voor machines van categorie A als bedoeld in [artikel 5.2, veertiende lid][ref1], gelegen.
      Wanneer brandstofolietanks, geen dubbele-bodemtanks zijnde, noodzakelijkerwijze naast of in ruimten voor machines
      van categorie A gelegen zijn, valt ten minste één van hun verticale zijden samen met de begrenzingwanden van de
      ruimte voor machines en hebben zij bij voorkeur een gemeenschappelijke begrenzingwand met dubbele-bodemtanks indien
      deze zijn aangebracht. De oppervlakte van de begrenzingwand tussen de tank en de ruimte voor machines is zo klein
      mogelijk. Wanneer dergelijke tanks gelegen zijn binnen de begrenzingwanden van ruimten voor machines van categorie
      A, mogen zij geen brandstofolie bevatten met een vlampunt dat lager is dan 60°C. Het gebruik van vrijstaande
      brandstofolietanks in brandgevaarlijke ruimten en in het bijzonder in ruimten voor machines van categorie A is
      in het algemeen niet toegestaan. Het Hoofd van de Scheepvaartinspectie kan echter de toepassing van vrijstaande
      brandstofolietanks toestaan. In dat geval zijn zij geplaatst in een lekbak van ruime afmetingen welke is voorzien
      van een afvoerleiding van voldoende afmetingen, welke naar een lekolietank leidt met voldoende capaciteit.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel5
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 4.10.9
    text: |-
      De ventilatie van ruimten voor machines is onder alle bedrijfsomstandigheden voldoende om opeenhoping van
      oliedampen te voorkomen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.10
  - number: 4.10.10
    text: |-
      De inrichtingen voor de opslag, verdeling en het gebruik van olie voor smeeroliesystemen onder druk zijn ten
      genoegen van het Hoofd van de Scheepvaartinspectie. Indien deze inrichtingen zijn aangebracht in ruimten voor
      machines van categorie A als bedoeld in [artikel 5.2, veertiende lid][ref1] en, indien praktisch uitvoerbaar, in
      andere ruimten voor machines, voldoen zij ten minste aan het eerste, derde, zesde en zevende lid en, voorzover
      dit naar het oordeel van het Hoofd van de Scheepvaartinspectie noodzakelijk is, aan het tweede en vierde lid. Het
      gebruik van kijkglazen in smeeroliesystemen is toegestaan mits door middel van een proef is aangetoond dat zij in
      voldoende mate brandbestendig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel5
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 4.10.11
    text: |-
      De inrichtingen voor de opslag, verdeling en het gebruik van ontvlambare oliën die onder druk worden toegepast in
      hydraulische systemen voor het overbrengen van vermogen en die geen oliën zijn als bedoeld in het voorgaande lid,
      alsmede van oliën die worden gebruikt in bedienings-, bekrachtigings- en verwarmingssystemen, zijn ten genoegen
      van het Hoofd van de Scheepvaartinspectie. Op plaatsen waar ontstekingsbronnen aanwezig zijn, voldoen dergelijke
      inrichtingen ten minste aan het tweede en zesde lid en ten aanzien van sterkte en constructie aan het derde en
      zevende lid.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.10
  - number: 4.10.12
    text: Voorpiektanks bevatten geen brandstofolie, smeerolie of andere ontvlambare oliën.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.10
  - number: 4.11.1
    text: |-
      Elke waterdichte afdeling die niet permanent is bestemd voor de berging van olie of water kan onder alle
      omstandigheden die in de praktijk kunnen voorkomen, ongeacht of het vaartuig recht ligt dan wel slagzij heeft,
      door een doelmatig lenssysteem worden leeggepompt. Indien nodig zijn daartoe lenskorven in de zijden aangebracht.
      Er zijn voorzieningen getroffen, opdat in een afdeling aanwezig water naar de lenskorven kan toevloeien. Onder
      voorwaarde dat de veiligheid van het vaartuig niet in het geding is, kan het Hoofd van de Scheepvaartinspectie
      toestaan dat bepaalde afdelingen niet op een lenssysteem zijn aangesloten.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.11
  - number: 4.11.2.a
    text: |-
      Er zijn ten minste twee onafhankelijk werktuiglijk aangedreven lenspompen aangebracht, waarvan er één door de
      hoofdmotor mag worden aangedreven. Een ballastpomp of andere algemene dienstpomp van voldoende capaciteit mag
      worden gebruikt als werktuiglijk gedreven lenspomp;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.11
  - number: 4.11.2.b
    text: |-
      werktuiglijk aangedreven lenspompen zijn in staat aan het water in de hoofdlensleiding een snelheid van ten
      minste 2 m/sec te geven, met dien verstande dat de hoofdlensleiding een inwendige diameter heeft van ten minste:
      d = 25 + 1,68 {L(B+D)}; waarbij: d = de inwendige diameter in millimeters en zijn L, B en D in meters uitgedrukt,
      en met dien verstande dat het Hoofd van de Scheepvaartinspectie echter kan toestaan dat als werkelijke, inwendige
      diameter van de hoofdlensleiding de dichtstbijzijnde standaardpijp middellijn wordt toegepast;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.11
  - number: 4.11.2.c
    text: |-
      elke lenspomp die overeenkomstig dit artikel is aangebracht, is voorzien van een rechtstreekse zuigpijp op
      de ruimte waarin deze is opgesteld, waarbij, indien twee of meer van dergelijke zuigpijpen in een ruimte voor
      machines aanwezig zijn, er ten minste één aan bakboordzijde en één aan stuurboordzijde van de ruimte uitmondt,
      met dien verstande dat vaartuigen met een lengte kleiner dan 75 m kunnen volstaan met slechts één lenspomp met een
      rechtstreekse zuigpijp;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.11
  - number: 4.11.2.d
    text: |-
      de inwendige diameter van de zuiglensleiding mag niet kleiner zijn dan 50 mm, met dien verstande dat de
      inrichting en afmetingen van het lenssysteem zodanig zijn dat de totale capaciteit van de pomp, zoals hierboven
      aangegeven, kan worden aangewend voor elk van de waterdichte afdelingen die zijn gelegen tussen de aanvarings-
      en achterpiekschotten.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.11
  - number: 4.11.3
    text: |-
      Ten genoegen van het Hoofd van de Scheepvaartinspectie mag een lensejecteur in samenhang met een onafhankelijk
      gedreven hoge druk zeewaterpomp worden aangebracht als vervanging van één onafhankelijk gedreven lenspomp, zoals is
      voorgeschreven in het tweede lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.11
  - number: 4.11.4
    text: |-
      Aan boord van vaartuigen waar de visverwerking kan leiden tot het verzamelen van hoeveelheden water in afgesloten
      ruimten, is voorzien in een doelmatige afvoer.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.11
  - number: 4.11.5
    text: |-
      Lensleidingen mogen niet zijn gevoerd door brandstof- of ballast- of dubbele-bodemtanks, tenzij deze leidingen zijn
      uitgevoerd met een extra wanddikte.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.11
  - number: 4.11.6
    text: |-
      De inrichting van lens- en ballastleidingen met de daarbij behorende pompen is zodanig, dat geen water rechtstreeks
      van buitenboord of uit waterballastruimten naar laadruimten en ruimten voor machines of uit de ene waterdichte
      ruimte naar een andere kan vloeien. De lensaansluiting van elke pomp die in verbinding kan worden gesteld met
      een buitenboordsopening of waterballastruimte is uitgerust met óf een terugslagklep, óf een kraan die niet
      gelijkertijd kan worden geopend hetzij naar de lensputten en naar buitenboord, hetzij naar de lensputten en de
      waterballastruimten. Verdeelkasten in lensleidingen zijn voorzien van terugslagkleppen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.11
  - number: 4.11.7
    text: |-
      De doorvoering van een lensleiding door het aanvaringsschot is voorzien van een doelmatig afsluitmiddel dat tegen
      het schot is bevestigd en dat boven het werkdek kan worden bediend. Op de plaats vanbediening is een standaanwijzer
      aangebracht die aangeeft of het afsluitmiddel geopend dan wel gesloten is. Indien het afsluitmiddel aan de
      achterzijde van het aanvaringsschot is aangebracht en bovendien onder alle bedrijfsomstandigheden gemakkelijk
      bereikbaar is, kan van de bediening boven het werkdek worden afgezien.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.11
  - number: '4.12'
    text: |-
      Bij ministeriële regeling kunnen maatregelen worden getroffen om geluidhinder in ruimten voor machines te beperken
      tot aanvaardbare niveaus.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.12
  - number: 4.13.1
    text: |-
      Elk vaartuig is voorzien van een hoofdstuurinrichting en van een hulpstuurinrichting ten genoegen van het Hoofd van
      de Scheepvaartinspectie. Deze inrichtingen zijn zodanig, dat voor zover dit mogelijk en praktisch uitvoerbaar is,
      een enkelvoudige fout in één van de inrichtingen de ander niet buiten werking stelt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.13
  - number: 4.13.2
    text: |-
      Wanneer de hoofdstuurinrichting twee of meer gelijkwaardige krachtwerktuigen omvat, behoeft geen
      hulpstuurinrichting te zijn aangebracht indien de hoofdstuurinrichting geschikt is om het roer te bewegen
      overeenkomstig het tiende lid, in het geval dat één van de krachtwerktuigen buiten bedrijf is. Elk krachtwerktuig
      wordt gevoed vanaf een afzonderlijke stroomkring.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.13
  - number: 4.13.3
    text: |-
      De stand van het roer wordt in het stuurhuis aangegeven indien het roer werktuiglijk wordt bewogen. De
      roerstandaanwijzing is onafhankelijk van het afstandsbedieningsysteem.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.13
  - number: 4.13.4
    text: |-
      Het uitvallen van de stuurinrichting wordt in het stuurhuis door middel van een hoorbaar en zichtbaar alarm
      aangegeven.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.13
  - number: 4.13.5
    text: |-
      Het in bedrijf zijn van de motoren van elektrische en elektrisch-hydraulische stuurinrichtingen wordt in
      het stuurhuis aangegeven. Elke stroomkring en elke motor is voorzien van een kortsluitbeveiliging, een
      overbelastingsalarm en een «geen-spanning»-alarm. Indien er een overbelastingsbeveiliging is aangebracht dan is
      deze niet lager ingesteld dan tweemaal de nominale stroomsterkte van de motor of stroomkring en is deze verder
      zodanig uitgevoerd dat deze bij de gebruikelijke aanloopstroom niet in werking treedt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.13
  - number: 4.13.6
    text: |-
      De hoofdstuurinrichting is voldoende sterk gebouwd en geschikt voor de besturing van het vaartuig bij maximum
      dienstsnelheid vooruit. De hoofdstuurinrichting, het roer en de roerkoning zijn zodanig ontworpen, dat zij, ook bij
      maximum snelheid achteruit of bij het manoeuvreren tijdens het vissen, niet worden beschadigd.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.13
  - number: 4.13.7
    text: |-
      Het vermogen en de uitvoering van de hoofdstuurinrichting zijn zodanig dat het roer van 35° uitslag aan een
      zijde naar 35° uitslag aan de andere zijde kan worden bewogen wanneer het vaartuig zich bij maximum toelaatbare
      diepgang, met maximum dienstsnelheid vooruit beweegt. Het roer kan onder deze omstandigheden van 35° uitslag
      aan één zijde in niet meer dan 28 seconden naar 30° uitslag aan de andere zijde worden bewogen. Zonodig dient de
      hoofdstuurinrichting werktuiglijk te kunnen worden bewogen teneinde aan deze eisen te voldoen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.13
  - number: 4.13.8
    text: |-
      Het krachtwerktuig voor de hoofdstuurinrichting wordt hetzij handmatig vanuit het stuurhuis in werking gesteld,
      hetzij automatisch in werking gesteld zodra de energievoorziening, na te zijn uitgevallen, weer is hersteld.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.13
  - number: 4.13.9
    text: |-
      De hulpstuurinrichting is voldoende sterk gebouwd en is geschikt voor de besturing van het vaartuig bij een
      snelheid, waarbij het nog manoeuvreerbaar is en is voorts ingericht om in noodgevallen snel in werking te kunnen
      worden gebracht.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.13
  - number: 4.13.10
    text: |-
      De hulpstuurinrichting is geschikt om het roer in niet meer dan 60 seconden van 15° uitslag aan een zijde
      te bewegen naar 15° uitslag aan de andere zijde, bij een snelheid vooruit welke maximaal of de helft van de
      maximum dienstsnelheid of 7 mijl per uur bedraagt, afhankelijk van welke van de twee waarden het grootst is. De
      hulpstuurinrichting kan werktuiglijk worden bewogen voorzover dit nodig is om aan deze eisen te kunnen voldoen. Ten
      aanzien van Nederlandse vissersvaartuigen geldt dat in geval van elektrische aandrijving de noodkrachtbron in staat
      is om de hulpstuurinrichting gedurende ten minste 10 minuten te bedienen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.13
  - number: 4.13.11
    text: |-
      Aan boord van een vaartuig met een lengte van 75 m of meer wordt de elektrische of elektrisch-hydraulische
      stuurinrichting bediend door ten minste twee stroomkringen, gevoed vanaf het hoofdschakelbord. De stroomkringen
      zijn over hun gehele lengte, zover als praktisch mogelijk is, van elkaar verwijderd aangebracht.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.13
  - number: '4.14'
    text: |-
      Aan boord van een vaartuig met een lengte van 75 m of meer is een alarminstallatie aangebracht die hetzij vanuit de
      machinecontrolekamer, hetzij vanaf de manoeuvreerstand in werking kan worden gesteld en die duidelijk hoorbaar is
      in de verblijven welke zijn bestemd voor de werktuigkundigen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.14
  - number: 4.15.1
    text: |-
      Koelinstallaties zijn zodanig ontworpen, geconstrueerd, beproefd en geïnstalleerd, dat rekening wordt gehouden met
      de veiligheid van de installaties en tevens met mogelijke emissies van het toegepaste koelmiddel, in hoeveelheden
      of concentraties die gevaar inhouden voor de mens of het milieu, een en ander ten genoegen van het Hoofd van de
      Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.15
  - number: 4.15.2
    text: |-
      Het toe te passen koelmiddel in koel- en vriesinstallaties is ten genoegen van het Hoofd van de
      Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.15
  - number: 4.15.3.a
    text: |-
      Koelinstallaties zijn voldoende beschermd tegen trillen, schokken, uitzetten, krimpen en soortgelijke
      omstandigheden en zijn voorzien van een automatische veiligheidsinrichting, waardoor een gevaarlijke stijging van
      de temperatuur en van de druk wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.15
  - number: 4.15.3.b
    text: |-
      Koelinstallaties waarin giftige of ontvlambare koelmiddelen worden gebruikt, zijn voorzien van afvoerinrichtingen
      die uitmonden op een plaats waar het koelmiddel geen gevaar oplevert voor het vaartuig of de opvarenden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.15
  - number: 4.15.4.a
    text: |-
      Koelmachines, met inbegrip van koelers en gastanks, die giftige koelmiddelen gebruiken, zijn ondergebracht in
      een afzonderlijke ruimte die door gasdichte schotten van aangrenzende ruimten is gescheiden. Deze ruimte is
      voorzien van een lekzoeksysteem met een aanwijsinstrument dat is aangebracht naast de ingang tot deze ruimte, een
      onafhankelijk ventilatiesysteem en een watersproei-installatie.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.15
  - number: 4.15.4.b
    text: |-
      Indien het ten gevolge van de grootte van het vaartuig praktisch niet uitvoerbaar is dat een koelinstallatie in een
      afzonderlijke ruimte wordt ondergebracht, kan de installatie worden geplaatst in de ruimte voor machines, mits de
      hoeveelheid gebruikt koelmiddel in geval van ontsnapping van de totale hoeveelheid gas geen gevaar oplevert voor
      personen in de ruimte voor machines en mits een alarm is aangebracht dat bij een lekkage in die ruimte waarschuwt
      voor een gevaarlijke gasconcentratie.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.15
  - number: 4.15.5
    text: |-
      In ruimten voor koelmachines en in koel- en vriesruimten is een alarminstallatie aangebracht die in verbinding
      staat met het stuurhuis, het controlestation of nooduitgangen, om te voorkomen dat personen opgesloten raken. Ten
      minste één uitgang van een dergelijke ruimte kan van binnenuit geopend worden. Uitgangen van de ruimten waarin
      koelinstallaties zijn ondergebracht die giftig of ontvlambaar gas gebruiken geven waar mogelijk niet rechtstreeks
      toegang tot ruimten voor accommodatie.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.15
  - number: 4.15.6
    text: |-
      Wanneer in een koelinstallatie een voor personen schadelijk koelmiddel wordt gebruikt, zijn ten minste twee
      persluchttoestellen aanwezig, die te allen tijde bereikbaar zijn in geval koelmiddel ontsnapt. Voor elke
      tot het toestel behorende luchtcilinder is ten minste een reservecilinder met samengeperste lucht aanwezig.
      Persluchttoestellen die deel uitmaken van de brandweeruitrusting van het vaartuig, kunnen hiertoe worden gebruikt,
      mits de plaatsing daarvan zodanig is dat aan beide doeleinden kan worden voldaan.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.15
  - number: 4.15.7
    text: |-
      Met betrekking tot koelinstallaties zijn aan boord duidelijk zichtbaar doelmatige richtlijnen opgehangen ten
      behoeve van een veilige bedrijfsvoering en het optreden in noodsituaties.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.15
  - number: 4.16.1.a
    text: |-
      Indien elektrische energie het enige middel vormt tot het onderhouden van de voor de voortstuwing en de veiligheid
      van het vaartuig onontbeerlijke hulpdiensten, is het vaartuig voorzien van een elektrische hoofdkrachtbron.
      Deze hoofdkrachtbron bestaat ten minste uit twee generatoraggregaten, waarbij één van de generatoren door de
      hoofdmotor mag worden aangedreven. Het Hoofd van de Scheepvaartinspectie kan andere middelen aanvaarden mits deze
      gelijkwaardige elektrische voorzieningen inhouden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.16
  - number: 4.16.1.b
    text: |-
      Het vermogen van de generatoren, bedoeld in het voorgaande lid, is zodanig dat, met uitzondering van het vermogen
      dat benodigd is voor het vissen, de verwerking en het conserveren van de vangst, de goede werking van de diensten,
      bedoeld in [artikel 4.3, zesde lid, onder a][ref1], wordt verzekerd, indien één van de generatoraggregaten buiten
      bedrijf is gekomen. Indien echter op vaartuigen met een lengte van minder dan 45 m één generator buiten bedrijf
      is gekomen, is het slechts vereist dat de goede werking van de voor de voortstuwing en veiligheid van het vaartuig
      noodzakelijke diensten wordt verzekerd.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel4
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.16.1.c
    text: |-
      De elektrische hoofdkrachtbron van het vaartuig is zodanig ingericht dat de diensten, bedoeld in
      [artikel 4.3, zesde lid, onder a][ref1], kunnen worden gehandhaafd, ongeacht het toerental en de draairichting van
      het voortstuwingswerktuig of de schroefas.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel4
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.16.1.d
    text: |-
      Indien transformatoren een essentieel onderdeel vormen van de stroomvoorziening, bedoeld in het eerste, tweede en
      derde lid, zijn deze zodanig ingericht dat dezelfde continuïteit van de stroomvoorziening verzekerd is.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.16
  - number: 4.16.2.a
    text: |-
      De hoofdverlichtingsinstallatie is zodanig ingericht dat een brand of ander ongeval in de ruimte of
      ruimten waarin de elektrische hoofdkrachtbron inclusief eventuele transformatoren is opgesteld, niet de
      noodverlichtingsinstallatie buiten werking zal stellen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.16
  - number: 4.16.2.b
    text: |-
      De noodverlichtingsinstallatie is zodanig ingericht dat een brand of ander ongeval in de ruimte of
      ruimten waarin de elektrische noodkrachtbron inclusief eventuele transformatoren is opgesteld, niet de
      hoofdverlichtingsinstallatie buiten werking zal stellen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.16
  - number: 4.16.3
    text: |-
      Ten aanzien van Nederlandse vissersvaartuigen geldt dat de navigatielichten, indien zij alleen op elektrische
      stroom werken, worden gevoed via een apart schakelbord en er adequate controlevoorzieningen voor die lichten worden
      geïnstalleerd.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.16
  - number: 4.17.1
    text: |-
      Er wordt voorzien in een onafhankelijk werkende elektrische noodkrachtbron die, ten genoegen van het Hoofd van de
      Scheepvaartinspectie, buiten de ruimten voor machines is opgesteld en die zodanig is uitgevoerd dat de werking niet
      kan worden beïnvloed door een brand of een storing van de elektrische hoofdkrachtbron.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.17
  - number: 4.17.2
    text: |-
      De elektrische noodkrachtbron is in staat om, rekening houdend met startstromen en inschakelverschijnselen van
      bepaalde verbruikers, gelijktijdig, gedurende 3 uur stroom te leveren aan:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.17
  - number: 4.17.2.a
    text: |-
      de VHF radio-installatie, bedoeld in [artikel 9.6, eerste lid, onder a en b][ref1], en, indien van toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel9
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.17
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 4.17.2.a.1°
    text: |-
      de MF radio-installatie, bedoeld in [artikel 9.8, eerste lid, onder a en b][ref1], en
      [artikel 9.9, eerste lid, onder b en c][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0013342#Artikel9
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.17
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013342
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 4.17.2.a.2°
    text: |-
      het scheepssatellietstation, bedoeld in [artikel 9.9, eerste lid, onder a][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel9
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.17
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 4.17.2.a.3°
    text: |-
      de MF/HF radio-installatie, bedoeld in [artikel 9.9, tweede lid, onder a en b][ref1], en
      [artikel 9.10, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0013342#Artikel9
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.17
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013342
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 4.17.2.b
    text: |-
      interne communicatiemiddelen, brandontdekkingsinstallaties en alarmsignaleringen die in geval van nood zijn
      vereist;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.17
  - number: 4.17.2.c
    text: 'de navigatielichten, indien deze alleen elektrisch zijn uitgevoerd, en de noodverlichting:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.17
  - number: 4.17.2.c.1°
    text: bij elke tewaterlatingplaats, zowel aan dek als buitenboord,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.17
  - number: 4.17.2.c.2°
    text: in alle dienst- en accommodatiegangen, bij alle trappen en uitgangen,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.17
  - number: 4.17.2.c.3°
    text: in ruimten waarin werktuigen of de noodkrachtbron zijn opgesteld,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.17
  - number: 4.17.2.c.4°
    text: in controlestations,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.17
  - number: 4.17.2.c.5°
    text: in visverwerkingruimten, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.17
  - number: 4.17.2.d
    text: de bediening van de noodbrandbluspomp, indien deze aanwezig is.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.17
  - number: 4.17.3
    text: De elektrische noodkrachtbron kan een generator of een accumulatorenbatterij zijn.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.17
  - number: 4.17.4.a
    text: |-
      Indien de elektrische noodkrachtbron een generator is, is deze zowel voorzien van een onafhankelijke
      brandstoftoevoer als van een doelmatig aanzetsysteem ten genoegen van het Hoofd van de Scheepvaartinspectie.
      Tenzij in een tweede onafhankelijke aanzetinrichting voor de noodgenerator is voorzien, wordt de enige bron met
      geaccumuleerde energie beveiligd tegen volledige uitputting door de automatische aanzetinrichting.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.17
  - number: 4.17.4.b
    text: |-
      Indien de elektrische noodkrachtbron een accumulatorenbatterij is, is deze in staat zonder wederoplading de
      noodbelasting op te nemen, waarbij gedurende de gehele ontlaadperiode de spanning van de accumulatorenbatterij
      binnen 12% boven of onder zijn nominale spanning blijft. Bij het uitvallen van de elektrische hoofdvoeding schakelt
      de accumulatorenbatterij automatisch op het noodschakelbord en levert ze onmiddellijk stroom aan ten minste de
      diensten, bedoeld in het tweede lid, onder b en c. Het noodschakelbord is voorzien van een hulpschakelaar waarmee
      de batterij met de hand kan worden gekoppeld in geval van het uitvallen van de automatische koppelschakelaar.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.17
  - number: 4.17.5
    text: |-
      Het noodschakelbord is zo dicht als praktisch mogelijk bij de elektrische noodkrachtbron opgesteld, in
      overeenstemming met het bepaalde in het eerste lid. Indien de elektrische noodkrachtbron een generator is, is het
      noodschakelbord in dezelfde ruimte opgesteld, tenzij de werking daardoor nadelig zou worden beïnvloed.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.17
  - number: 4.17.6
    text: |-
      Accumulatorenbatterijen die ingevolge dit artikel geplaatst zijn, met uitzondering van die voor de radiozender
      en -ontvanger in vaartuigen waarvan de lengte minder dan 45 m bedraagt, zijn in een goed geventileerde ruimte
      ondergebracht, niet zijnde de ruimte waar het noodschakelbord is opgesteld. Op een daartoe geschikte plaats op
      het hoofdschakelbord of in de machinecontrolekamer is een aanwijsinrichting aangebracht die aangeeft wanneer de
      accumulatorenbatterijen, zijnde de elektrische noodkrachtbron, in ontlading zijn. Het noodschakelbord wordt bij
      normaal bedrijf via een koppelkabel die in het hoofdschakelbord doelmatig tegen overbelasting en kortsluiting
      is beveiligd, gevoed vanaf het hoofdschakelbord en wordt automatisch ontkoppeld op het noodschakelbord
      bij het uitvallen van de elektrische hoofdvoeding. Indien het systeem is ingericht voor een bedrijf met
      terugvoedmogelijkheid, dan is de koppelkabel ook in het noodschakelbord tegen ten minste kortsluiting beveiligd.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.17
  - number: 4.17.7
    text: |-
      De noodgenerator en zijn aandrijvend werktuig, en elke noodaccumulatorenbatterij zijn zodanig ingericht en
      opgesteld dat hun goede werking bij hun nominaal vermogen is verzekerd bij recht liggend vaartuig en bij elke
      slagzijhoek tot 22,5° of bij een trimhoek voor- of achterover tot 10° of bij enige combinatie van hellinghoeken
      binnen genoemde grenzen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.17
  - number: 4.17.8
    text: |-
      Er zijn voorzieningen aangebracht voor het adequaat testen van de elektrische noodkrachtbron en de automatische
      aanzetinrichting, door de bemanning terwijl het vaartuig in bedrijf is.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.17
  - number: 4.18.1.a
    text: |-
      Onbeschermde nagelvaste metalen delen van elektrische machines of uitrustingen, die niet zijn bestemd om onder
      spanning te staan, maar ten gevolge van een defect onder spanning kunnen geraken, zijn geaard, tenzij de machines
      of uitrustingen:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.18
  - number: 4.18.1.a.1°
    text: |-
      worden gevoed met een spanning niet hoger dan 50 V gelijkspanning of 50 V wisselspanning tussen de geleiders,
      met dien verstande dat spaartransformatoren voor het verkrijgen van de genoemde wisselspanning niet mogen worden
      gebruikt;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.18
  - number: 4.18.1.a.2°
    text: |-
      worden gevoed met een spanning niet hoger dan 250 V, verkregen van een beschermingstransformator waarop slechts één
      verbruiker is aangesloten, of
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.18
  - number: 4.18.1.a.3°
    text: zijn geconstrueerd volgens het principe van dubbele isolatie.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.18
  - number: 4.18.1.b
    text: |-
      Draagbare elektrische uitrusting werkt bij een veilige spanning, waarbij onbeschermde metalen delen van dergelijke
      uitrusting die niet zijn bestemd om onder spanning te staan, maar ten gevolge van een defect onder spanning
      kunnen geraken, zijn geaard. Bij ministeriële regeling kunnen aanvullende voorzorgsmaatregelen worden geëist voor
      looplampen, gereedschap of soortgelijke apparatuur voor gebruik in besloten of uitzonderlijk vochtige ruimten waar
      bepaalde risico's in verband met de geleidbaarheid kunnen optreden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.18
  - number: 4.18.1.c
    text: |-
      Alle elektrische toestellen zijn zo geconstrueerd en geïnstalleerd dat zij geen letsel kunnen veroorzaken wanneer
      ze op de normale wijze worden behandeld of aangeraakt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.18
  - number: 4.18.2
    text: |-
      Hoofd- en noodschakelborden zijn zodanig geplaatst en ingericht, dat zij zonder gevaar voor het aanwezige personeel
      gemakkelijk toegang geven tot de apparatuur en verdere uitrusting. De zijkanten en de achterzijde en zo nodig de
      voorzijde zijn doelmatig beschermd. Aan de voorzijde van deze schakelborden zijn geen onbeschermde stroomvoerende
      delen aangebracht waarvan de spanning ten opzichte van aarde hoger is dan 50 V. Waar nodig moeten aan voor- en
      achterzijde matten of roosters van niet-elektrisch-geleidend materiaal aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.18
  - number: 4.18.3.a
    text: |-
      Het casco van een vaartuig met een lengte van 75 m of meer wordt niet gebruikt als terugleider voor kracht,
      verwarming of verlichting.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.18
  - number: 4.18.3.b
    text: |-
      Het bepaalde onder a is, onder door het Hoofd van de Scheepvaartinspectie goedgekeurde omstandigheden, niet van
      toepassing op het gebruik van:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.18
  - number: 4.18.3.b.1°
    text: kathodische beschermingen die werken met opgedrukte stroom,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.18
  - number: 4.18.3.b.2°
    text: systemen van beperkte omvang die plaatselijk zijn geaard, of
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.18
  - number: 4.18.3.b.3°
    text: |-
      inrichtingen voor controle van de isolatieweerstand mits de stroom onder de meest ongunstige omstandigheid niet
      meer bedraagt dan 30 mA.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.18
  - number: 4.18.3.c
    text: |-
      Indien het casco als terugleider wordt gebruikt, zijn alle eindgroepen, zijnde alle stroomkringen achter de laatste
      beveiliging, dubbelpolig en zijn de verbindingen met het casco op toegankelijke plaatsen tot stand gebracht,
      zodanig dat zij gemakkelijk kunnen worden gecontroleerd en losgemaakt voor het verrichten van isolatiemetingen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.18
  - number: 4.18.4.a
    text: |-
      Indien een niet-geaard primair of secundair verdeelsysteem wordt gebruikt voor kracht, verwarming of verlichting,
      is dit voorzien van een middel voor de voortdurende controle van de isolatieweerstand ten opzichte van aarde.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.18
  - number: 4.18.4.b
    text: |-
      Indien het verdeelsysteem in overeenstemming is met het bepaalde in het voorgaande lid en een voltage wordt
      toegepast dat hoger is dan 50 V gelijkspanning of 50 V wisselspanning tussen de geleiders, is dit voorzien van een
      middel voor de voortdurende controle van de isolatieweerstand ten opzichte van aarde, dat een hoorbare of zichtbare
      aanwijzing geeft in geval van een te lage isolatieweerstand.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.18
  - number: 4.18.4.c
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan toestaan dat verdeelsystemen die worden gevoed met een voltage niet hoger
      dan 250 V gelijkstroom of 250 V wisselstroom tussen de geleiders en waarop een beperkt aantal verbruikers zijn
      aangesloten, overeenstemmen met het bepaalde onder a.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.18
  - number: 4.18.5.a
    text: |-
      Behalve daar waar het Hoofd van de Scheepvaartinspectie in bijzondere omstandigheden zulks anders toestaat, zijn
      alle metalen omhulsels en afschermingen van kabels elektrisch ononderbroken en geaard.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.18
  - number: 4.18.5.b
    text: |-
      Alle elektrische kabels zijn ten minste van het brandvertragende type en op zodanige wijze aangebracht dat
      de oorspronkelijke brandvertragende eigenschappen niet worden aangetast. Indien bijzondere omstandigheden dit
      noodzakelijk maken, kan het Hoofd van de Scheepvaartinspectie het gebruik toestaan van speciale kabeltypen, zoals
      hoogfrequent kabels, die niet voldoen aan het voorafgaande.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.18
  - number: 4.18.5.c
    text: |-
      Kabels of bedradingen ten behoeve van essentiële of noodkrachtinstallaties, verlichting en interne communicatie of
      signaalinrichtingen zijn, voorzover uitvoerbaar, op zodanige wijze aangelegd dat zij niet door kombuizen, ruimten
      voor machines van categorie A als bedoeld in artikel 5.2, veertiende lid, en andere ruimten met groot brandrisico
      en wasserijen, visverwerkingruimten en andere ruimten met een hoog vochtigheidsgehalte lopen. Verbindingskabels
      tussen brandbluspompen en het noodschakelbord, die door ruimten lopen met een groot brandrisico, zijn van het
      brandwerend type. Waar mogelijk zijn al deze kabels op zodanige wijze gelegd dat buiten bedrijf raken door
      opwarming van schotten, veroorzaakt door een brand in een aangrenzende ruimte, wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.18
  - number: 4.18.5.d
    text: |-
      Indien er kabels zijn aangebracht in ruimten waar brand of een explosie kan plaats vinden naar aanleiding van een
      elektrische fout in die ruimte, zijn er ten genoegen van het Hoofd van de Scheepvaartinspectie voorzorgsmaatregelen
      tegen deze gevaren genomen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.18
  - number: 4.18.5.e
    text: |-
      Elektrische leidingen en bedrading zijn zodanig aangebracht, dat beschadiging door schavielen of anderszins wordt
      voorkomen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.18
  - number: 4.18.5.f
    text: |-
      De aansluitingen en aftakkingen van elke leiding zijn zodanig uitgevoerd, dat de oorspronkelijke elektrische,
      mechanische, brandvertragende en waar nodig brandwerende eigenschappen van de leiding behouden blijven.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.18
  - number: 4.18.5.g
    text: |-
      Leidingen die in koelruimten zijn aangebracht zijn geschikt voor gebruik bij lage temperaturen en bij een hoge
      vochtigheidsgraad.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.18
  - number: 4.18.6.a
    text: |-
      Iedere afzonderlijke stroomkring is tegen kortsluiting beveiligd. Iedere afzonderlijke stroomkring is tevens tegen
      overbelasting beveiligd, uitgezonderd de stroomkringen, bedoeld in [artikel 4.13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel4
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.18
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.18.6.b
    text: |-
      De waarde of afstelling van het overbelastingsrelais voor elke stroomkring is permanent aangegeven ter plaatse van
      het betreffende relais.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.18
  - number: 4.18.7
    text: |-
      Verlichtingsarmaturen zijn zodanig uitgevoerd, dat geen temperatuurstijging kan ontstaan, die schade aan de kabels
      en bedrading kan veroorzaken of waardoor omringend materiaal uitzonderlijk warm kan worden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.18
  - number: 4.18.8
    text: |-
      Alle stroomkringen voor verlichting en krachtaansluitingen die uitkomen in een ruimte waar gevaar voor brand of
      explosie bestaat zijn voorzien van schakelaars buiten die ruimte.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.18
  - number: 4.18.9.a
    text: |-
      Behuizingen waar accumulatorenbatterijen zijn opgesteld zijn ten genoegen van het Hoofd van de Scheepvaartinspectie
      geconstrueerd en geventileerd.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.18
  - number: 4.18.9.b
    text: |-
      Elektrisch en andere uitrusting die een ontstekingsbron kunnen vormen voor brandbare dampen zijn niet toegestaan,
      behalve als dit volgens het bepaalde in het tiende lid is toegestaan.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.18
  - number: 4.18.9.c
    text: |-
      Een accumulatorenbatterij mag niet in accommodatieruimten zijn opgesteld, tenzij hermetisch gesloten batterijen
      worden geïnstalleerd.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.18
  - number: 4.18.10
    text: |-
      In alle ruimten waar brandbare gasmengsels zich kunnen verzamelen en in elke ruimte, voornamelijk bestemd voor een
      accumulatorenbatterij, zijn geen elektrische inrichtingen aangebracht, tenzij het Hoofd van de Scheepvaartinspectie
      van oordeel is dat deze:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.18
  - number: 4.18.10.a
    text: noodzakelijk zijn vanwege bedrijfstechnische redenen,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.18
  - number: 4.18.10.b
    text: van een soort zijn die het betreffende mengsel niet kan ontsteken,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.18
  - number: 4.18.10.c
    text: geschikt zijn voor de betreffende ruimte, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.18
  - number: 4.18.10.d
    text: van een goedgekeurd, explosieveilig type zijn voor gebruik daar waar stof, dampen of gassen aanwezig kunnen zijn.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.18
  - number: 4.18.11
    text: |-
      Op alle houten masten of topmasten zijn bliksemafleiders aangebracht. Op vaartuigen die van niet-geleidende
      materialen zijn vervaardigd, zijn de bliksemafleiders door middel van geschikte geleiders verbonden met een koperen
      plaat die ruimschoots onder de waterlijn van de romp van het vaartuig is bevestigd.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.18
  - number: '4.19'
    text: '*Brandbeveiliging*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.19
  - number: 4.19.1
    text: |-
      Bijzondere aandacht wordt gegeven aan de afscherming van hogedruk brandstofleidingen. Waar praktisch uitvoerbaar
      worden lekkages van deze leidingsystemen in een doelmatige afvoertank opgevangen, die is voorzien van een
      hoogniveau-alarm.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.19
  - number: 4.19.2
    text: |-
      Wanneer brandstofdagtanks automatisch of door middel van afstandsbediening worden gevuld, wordt een inrichting
      aangebracht teneinde overlopen te voorkomen. Dit voorschrift is eveneens van toepassing op andere inrichtingen voor
      de automatische behandeling van brandbare vloeistoffen, met inbegrip van brandstofcentrifuges, die zo mogelijk zijn
      geïnstalleerd in een speciale ruimte voor centrifuges en hun voorwarmers.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.19
  - number: 4.19.3
    text: |-
      Wanneer brandstofdagtanks of bezinktanks zijn voorzien van een verwarmingsinrichting, is, indien het vlampunt van
      de brandstofolie kan worden overschreden, een hoogtemperatuuralarm aangebracht.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.19
  - number: '4.19'
    text: '*Branddetectie*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.19
  - number: 4.19.4
    text: |-
      Een goedgekeurde brandontdekkingsinstallatie, werkend volgens het principe van zelfbewaking, met inbegrip van een
      mogelijkheid voor het periodiek beproeven, is aangebracht in ruimten voor machines.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.19
  - number: 4.19.5
    text: |-
      De ontdekkingsinstallatie alarmeert zowel hoorbaar als zichtbaar in het stuurhuis en wordt in voldoende en daartoe
      geschikte ruimten gehoord en waargenomen door aan boord aanwezige personen, wanneer het vaartuig is afgemeerd.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.19
  - number: 4.19.6
    text: |-
      De brandontdekkingsinstallatie wordt bij het uitvallen van de hoofdkrachtbron automatisch gevoed door een
      noodkrachtbron.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.19
  - number: 4.19.7
    text: |-
      Inwendige verbrandingsmotoren met een vermogen van 2500 kW of meer zijn voorzien van oliemistdetectie in de
      krukkast of van temperatuurmeting van de lagers of van een gelijkwaardige voorziening.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.19
  - number: '4.19'
    text: '*Brandbestrijding*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.19
  - number: 4.19.8
    text: |-
      Er is een vast aangebrachte brandblusinstallatie die ten genoegen is van het Hoofd van de Scheepvaartinspectie en
      die voldoet aan het bepaalde in de [artikelen 5.22][ref1] en [5.40][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0013342#Artikel5
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.19
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013342
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: 4.19.9
    text: |-
      Aan boord van een vaartuig waarvan de lengte 75 m of meer bedraagt, zijn voorzieningen getroffen voor een
      onmiddellijke waterlevering uit de hoofdbrandblusleiding, hetzij:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.19
  - number: 4.19.9.a
    text: |-
      door middel van afstandbediening van één van de hoofdbrandbluspompen vanuit het stuurhuis en vanuit het
      brandcontrolestation, indien dit aanwezig is, hetzij
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.19
  - number: 4.19.9.b
    text: |-
      door middel van het voortdurend onder druk houden van de hoofdbrandblusleiding, met dien verstande dat in dat geval
      voorzieningen zijn getroffen teneinde beschadiging van de hoofdbrandblusleiding door bevriezing te voorkomen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.19
  - number: 4.19.10
    text: |-
      Het onderhoud van de brandwerendheid van de ruimten voor machines, van de plaats waar de bedieningsapparatuur
      van de brandblusinstallatie is samengebracht en van het veiligheidssysteem als bedoeld in [artikel 4.24][ref1],
      met inbegrip van ventilatie en brandstofpompen, is ten genoegen van het Hoofd van de Scheepvaartinspectie.
      Onverminderd het bepaalde in [hoofdstuk 5][ref2] kan het Hoofd van de Scheepvaartinspectie daartoe aanvullende
      brandblustoestellen, brandbestrijdingsmiddelen alsmede persluchttoestellen voorschrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013342#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.19
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0013342
        hoofdstuk: '5'
  - number: 4.20.1
    text: |-
      Vullings in ruimten voor machines zijn voorzien van een hoogniveau-alarm waarvan de goede werking binnen de normale
      toestanden van stuur- en koplast is verzekerd. Deze bilge-alarminstallatie kan daar, waar voortdurend de wacht
      wordt gehouden, een hoorbaar en zichtbaar alarmsignaal in werking stellen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.20
  - number: 4.20.2
    text: |-
      De bedieningsplaats van elke afsluiter die deel uitmaakt van een zee-inlaat, een uitlaat beneden de waterlijn of
      een bilge-ejector, is zodanig gelegen dat er voldoende tijd is om deze afsluiters te bedienen in het geval dat
      water de ruimte binnenstroomt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.20
  - number: '4.21'
    text: |-
      Aan boord van een vaartuig met een lengte van 75 m of meer is één van de twee afzonderlijke communicatiemiddelen,
      bedoeld in [artikel 4.7][ref1], een doeltreffende spreekverbinding. Een aanvullende doeltreffende spreekverbinding
      is aangebracht tussen het stuurhuis en de verblijven van de werktuigkundigen.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel4
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.22.1
    text: Er is een alarminstallatie aangebracht die elke storing die verholpen dient te worden, aangeeft.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.22
  - number: 4.22.2.a
    text: |-
      De alarminstallatie geeft in de ruimte voor machines een hoorbaar alarmsignaal en geeft elke afzonderlijke
      alarmfunctie op een doelmatige plaats zichtbaar aan. Aan boord van een vaartuig waarvan de lengte minder dan 45 m
      bedraagt, kan het Hoofd van de Scheepvaartinspectie toestaan dat de installatie elke afzonderlijke alarmfunctie
      alleen in het stuurhuis hoorbaar en zichtbaar aangeeft.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.22
  - number: 4.22.2.b
    text: |-
      Aan boord van een vaartuig waarvan de lengte 45 m of meer bedraagt, is de alarminstallatie verbonden met de
      hutten van de werktuigkundigen door middel van een keuzeschakelaar naar elke hut en met het dagverblijf van de
      werktuigkundigen, indien dit aanwezig is. Het Hoofd van de Scheepvaartinspectie kan andere voorzieningen toestaan
      die dezelfde veiligheid waarborgen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.22
  - number: 4.22.2.c
    text: |-
      Aan boord van een vaartuig waarvan de lengte 45 m of meer bedraagt, treedt een algemeen werktuigkundigenalarm en
      een alarm op de brug, bestemd voor de personen die de wacht houden, in werking indien op enige alarmfunctie geen
      acht is geslagen binnen een tijdsverloop dat ten genoegen van het Hoofd van de Scheepvaartinspectie is.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.22
  - number: 4.22.2.d
    text: |-
      Op de brug treden hoorbare en zichtbare alarmen in werking in elke situatie die handelend optreden van de
      verantwoordelijke wachtdoende persoon vereist, of die onder zijn aandacht moet worden gebracht.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.22
  - number: 4.22.2.e
    text: De alarminstallatie is, voorzover uitvoerbaar, ontworpen volgens een principe dat het optreden van fouten uitsluit.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.22
  - number: 4.22.3
    text: 'De alarminstallatie:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.22
  - number: 4.22.3.a
    text: |-
      wordt ononderbroken gevoed met een voorziening voor het automatisch overschakelen op een noodvoeding ingeval de
      normale voeding wegvalt en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.22
  - number: 4.22.3.b
    text: alarmeert in het geval een storing in de normale voeding optreedt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.22
  - number: 4.22.4.a
    text: |-
      De alarminstallatie kan tegelijkertijd meer dan één storing aangeven. Het accepteren van een alarm mag het
      doorkomen van een ander alarm niet verhinderen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.22
  - number: 4.22.4.b
    text: |-
      Acceptatie van iedere alarmtoestand op de plaatsen, bedoeld in het tweede lid, wordt aangegeven op de plaatsen
      waar de alarmtoestand werd gemeld. Een alarmtoestand blijft gehandhaafd totdat deze is geaccepteerd, terwijl de
      zichtbare aanduidingen van afzonderlijke alarmen zichtbaar blijven totdat de storing verholpen is, waarna het
      alarmsysteem automatisch terugkeert in de normale bedrijfstoestand.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.22
  - number: 4.23.1
    text: |-
      Aan boord van een vaartuig waarvan de lengte 75 m of meer bedraagt, wordt de elektrische energievoorziening als
      volgt verzorgd:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.23
  - number: 4.23.1.a
    text: |-
      indien de energievoorziening in de regel kan worden verzorgd door één generator, zijn doelmatige voorzieningen
      voor het afschakelen van niet-belangrijke elektrische gebruikers getroffen, teneinde de energielevering ten
      dienste van de noodzakelijke werktuigen bestemd voor de voortstuwing en de besturing van het vaartuig te kunnen
      waarborgen. Er zijn passende voorzieningen aanwezig voor het automatisch starten en op het hoofdnet schakelen van
      een «stand-by» generator bij het uitvallen van de te werk staande generator, waarbij deze generator van voldoende
      capaciteit is om de voortstuwing en de besturing van het schip te kunnen verzekeren door automatisch starten
      van de hiervoor belangrijke werktuigen, waar nodig met behulp van een volgorde schakeling. Ten genoegen van het
      Hoofd van de Scheepvaartinspectie kunnen voorzieningen worden aangebracht voor het op afstand starten en op het
      hoofdnet schakelen van de «stand-by» generator, alsmede voorzieningen voor het bij herhaling op afstand starten van
      belangrijke hulpwerktuigen, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.23
  - number: 4.23.1.b
    text: |-
      indien de energievoorziening in de regel wordt verzorgd door meer dan één generatoraggregaat tegelijkertijd, zijn
      voorzieningen getroffen, met inbegrip van voorzieningen voor verdeling van de belasting, waardoor bij het uitvallen
      van één van de generatoraggregaten, de overblijvende aggregaten zonder overbelasting in bedrijf blijven om de
      voortstuwing en de besturing te kunnen waarborgen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.23
  - number: 4.23.2
    text: |-
      In geval «stand-by» hulpwerktuigen worden vereist voor andere, voor de voortstuwing noodzakelijke hulpwerktuigen,
      worden automatische omschakelinrichtingen toegepast. Een automatische omschakeling wordt door middel van een alarm
      aangegeven.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.23
  - number: 4.23.3
    text: 'Automatisch regel- en alarmsystemen voldoen aan de volgende voorschriften:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.23
  - number: 4.23.3.a
    text: |-
      het regelsysteem is zodanig uitgevoerd dat de diensten die nodig zijn voor de werking van het
      hoofdvoortstuwingswerktuig en de hulpwerktuigen, door de noodzakelijke automatische voorzieningen zijn verzekerd,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.23
  - number: 4.23.3.b
    text: |-
      voorzieningen zijn getroffen om de aanzetluchtdruk op het vereiste niveau te houden wanneer verbrandingsmotoren
      voor de voortstuwing worden gebruikt,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.23
  - number: 4.23.3.c
    text: |-
      een alarmsysteem dat voldoet aan het bepaalde in [artikel 4.22][ref1] is aangebracht voor alle belangrijke drukken,
      temperaturen, vloeistofniveaus en andere van belang zijnde parameters, en


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel4
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.23
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: 4.23.3.d
    text: |-
      indien van toepassing is een centrale post ingericht met de noodzakelijke alarm- en instrumentenpanelen, welke elk
      alarm kunnen aangeven.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.23
  - number: '4.24'
    text: |-
      Een veiligheidssysteem is aangebracht teneinde te verzekeren dat een ernstige storing aan de te werk staande
      werktuigen of ketels, welke een direct gevaar oplevert, automatisch het desbetreffende gedeelte van de installatie
      zal uitschakelen, waarbij tevens een alarm wordt gegeven. Het stopzetten van de voortstuwingsinstallatie mag niet
      automatisch plaatsvinden, behalve in die gevallen welke tot ernstige schade, algeheel onklaar raken of explosie
      zouden kunnen leiden. Indien voorzieningen zijn aangebracht welke het stopzetten van het hoofdvoortstuwingswerktuig
      ongedaan kunnen maken, zijn deze voorzieningen zodanig uitgevoerd dat ongewild gebruik ervan niet mogelijk is.
      Wanneer zulk een voorziening is gebruikt, wordt dit zichtbaar aangegeven.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel4.24
  - number: '5.1'
    text: Een van de volgende methoden van bescherming tegen brand wordt toegepast in accommodaties en dienstruimten.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.1
  - number: 5.1.a
    text: |-
      *Methode IF*– het aanbrengen van scheidingsschotten van onbrandbare kwaliteit van klasse «B» of «C», in het
      algemeen zonder dat daarbij een brandontdekkingsinstallatie of een sprinklersysteem in de ruimten voor accommodatie
      en de dienstruimten is aangebracht, of:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.1
  - number: 5.1.b
    text: |-
      *Methode IIF*– het installeren van een automatische sprinkler- en brandalarminstallatie voor het ontdekken en
      blussen van brand in alle ruimten waarin brand kan ontstaan, in het algemeen zonder beperkingen ten aanzien van het
      type scheidingsschotten, of:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.1
  - number: 5.1.c
    text: |-
      *Methode IIIF*– het installeren van een automatische brandalarm- en -ontdekkingsinstallatie in alle ruimten
      waarin brand kan ontstaan, in het algemeen zonder beperkingen ten aanzien van het type scheidingsschotten, met
      dien verstande dat de oppervlakte van enige accommodatieruimte of -ruimten die door een schot van klasse «A» of
      «B» wordt begrensd, niet groter mag zijn dan 50 m2. Het Hoofd van de Scheepvaartinspectie kan voor ruimten voor
      algemeen gebruik een grotere oppervlakte toestaan.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.1
  - number: '5.2'
    text: 'Voor de toepassing van dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.2
  - number: 5.2.1
    text: |-
      *onbrandbaar materiaal:* een materiaal dat noch brandt, noch ontvlambare gassen in voldoende hoeveelheid afgeeft
      om bij verhitting tot ongeveer 750°C tot zelfontbranding over te gaan, hetgeen ten genoegen van het Hoofd van de
      Scheepvaartinspectie moet worden aangetoond door middel van een door hem aanvaarde beproevingsmethode. Elk ander
      materiaal is brandbaar materiaal;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.2
  - number: 5.2.2
    text: |-
      *een standaard brandproef:* een proef waarbij gedeelten van de betrokken schotten of dekken in een proefoven
      blootgesteld worden aan temperaturen die ongeveer overeenkomen met de standaard tijdtemperatuurkromme. De gedeelten
      van de betrokken schotten of dekken moeten een blootgestelde oppervlakte hebben van ten minste 4,65 m2 en een
      hoogte (of lengte van het dek) van 2,44 m; zij moeten zo nauwkeurig mogelijk overeenkomen met de voorgenomen
      constructie en waar nodig ten minste één naad bevatten. Met de standaard tijdtemperatuurkromme wordt bedoeld
      een gelijkmatig verlopende kromme door de volgende punten gemeten boven de aanvankelijke temperatuur in de oven:
      oorspronkelijke binnentemperatuur van de oven 20°C na 5 minuten 576°C na 10 minuten 679°C na 15 minuten 738°C na 30
      minuten 841°C na 60 minuten 945°C
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.2
  - number: 5.2.3
    text: '*schotten van klasse «A»:* schotten en dekken die aan de volgende eisen voldoen:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.2
  - number: 5.2.3.a
    text: zij moeten geconstrueerd zijn van staal of van ander gelijkwaardig materiaal,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.2
  - number: 5.2.3.b
    text: zij moeten voldoende verstijfd zijn,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.2
  - number: 5.2.3.c
    text: |-
      zij moeten tot aan het einde van de standaard brandproef van één uur de doortocht van rook en vlammen kunnen
      verhinderen, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.2
  - number: 5.2.3.d
    text: |-
      zij moeten zodanig geïsoleerd zijn met goedgekeurde onbrandbare materialen dat de gemiddelde temperatuur aan de
      niet blootgestelde zijde niet meer dan 139°C boven de begintemperatuur stijgt, noch de temperatuur op enig punt, de
      naden inbegrepen, meer dan 180°C boven de begintemperatuur stijgt binnen de onderstaand aangegeven tijd: Klasse «A-
      60» 60 minuten Klasse «A-30» 30 minuten Klasse «A-15» 15 minuten Klasse «A-0» 0 minuten
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.2
  - number: 5.2.4
    text: '*schotten van klasse «B»:* schotten, dekken, plafonds of beschietingen die aan de volgende eisen voldoen:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.2
  - number: 5.2.4.a
    text: |-
      zij moeten tot aan het einde van het eerste half uur van de standaard brandproef de doortocht van vlammen kunnen
      verhinderen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.2
  - number: 5.2.4.b
    text: |-
      zij moeten een zodanig isolerend vermogen hebben dat de gemiddelde temperatuur aan de niet blootgestelde zijde niet
      meer dan 139°C boven de begintemperatuur stijgt, noch de temperatuur op enig punt, de naden inbegrepen, meer dan
      225°C boven de begintemperatuur stijgt binnen de onderstaand aangegeven tijd: Klasse «B-15» 15 minuten Klasse «B-0»
      0 minuten
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.2
  - number: 5.2.4.c
    text: |-
      zij moeten zijn opgebouwd uit goedgekeurde, onbrandbare materialen waarbij alle materialen die gebruikt worden
      voor schotten van klasse «B» en voor het aanbrengen daarvan, onbrandbaar dienen te zijn, behoudens dat brandbare
      fineerlagen kunnen worden toegestaan onder voorwaarde dat die voldoen aan de daarop van toepassing zijnde
      voorschriften van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.2
  - number: 5.2.5
    text: |-
      *schotten van klasse «C»:* schotten en dekken welke zijn opgebouwd uit goedgekeurde onbrandbare materialen.
      Zij behoeven niet te voldoen aan eisen betreffende het doorlaten van rook en vlammen of de beperking van de
      temperatuurstijging. Brandbare fineerlagen kunnen worden toegestaan onder voorwaarde dat die voldoen aan de daarop
      van toepassing zijnde voorschriften van dit hoofdstuk;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.2
  - number: 5.2.6
    text: '*schotten van klasse «F»:* schotten, dekken, plafonds of beschietingen die aan de volgende eisen voldoen:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.2
  - number: 5.2.6.a
    text: |-
      tot aan het einde van het eerste half uur van de standaard brandproef de doortocht van vlammen kunnen verhinderen,
      en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.2
  - number: 5.2.6.b
    text: |-
      een zodanig isolerend vermogen hebben dat de gemiddelde temperatuur aan de niet blootgestelde zijde tot aan het
      einde van het eerste half uur van de standaard brandproef niet meer dan 139°C boven de begintemperatuur stijgt,
      noch de temperatuur op enig punt, de naden inbegrepen, meer dan 225°C boven de begintemperatuur stijgt. Het Hoofd
      van de Scheepvaartinspectie kan een beproeving eisen van een prototype van een schot van klasse «F», teneinde
      zekerheid te verkrijgen dat dit voldoet aan bovengenoemde eisen omtrent stijfheid, doorlaten van rook en vlammen
      en temperatuurstijging;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.2
  - number: 5.2.7
    text: |-
      *doorlopende plafonds of beschietingen van klasse« B»:* plafonds of beschietingen van klasse «B» die slechts
      eindigen bij een schot van klasse «A» of «B»;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.2
  - number: 5.2.8
    text: |-
      *staal of ander gelijkwaardig materiaal:* staal, of elk ander materiaal dat zelf of door middel van
      isolatiemateriaal een brandwerendheid heeft die gelijkwaardig is aan die van staal tot aan het einde van de
      van toepassing zijnde standaard brandproef (bijvoorbeeld een aluminiumlegering, voorzien van een doeltreffende
      isolatie);
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.2
  - number: 5.2.9
    text: |-
      *laag vlamverspreidend vermogen:* de eigenschap die aangeeft dat het aldus aangeduide oppervlak de vlamuitbreiding
      op voldoende wijze kan beperken en die ten genoegen van het Hoofd van de Scheepvaartinspectie wordt aangetoond door
      middel van de FTP-Code;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.2
  - number: 5.2.10
    text: |-
      *accommodatieruimten:* ruimten voor algemeen gebruik, gangen, toiletten, hutten, kantoren, ziekenverblijven,
      bioscopen, ontspanningsruimten, afzonderlijke pantry's zonder voorzieningen om te koken en soortgelijke ruimten;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.2
  - number: 5.2.11
    text: |-
      *ruimten voor algemeen gebruik:* die delen van de ruimten voor accommodatie die in gebruik zijn als portalen,
      eetzalen, salons, en soortgelijke permanent ingesloten ruimten;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.2
  - number: 5.2.12
    text: |-
      *dienstruimten:* ruimten die gebruikt worden voor kombuizen, pantry's met voorzieningen om te koken, kasten en
      voorraadkamers, werkplaatsen die geen deel uitmaken van de ruimten voor machines, en soortgelijke ruimten, alsmede
      de bijbehorende schachten;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.2
  - number: 5.2.13
    text: |-
      *controlestations:* ruimten waarin de radio-installatie van het vaartuig, de voornaamste navigatiemiddelen of de
      elektrische noodkrachtbron zijn ondergebracht of die waarin de uitrusting voor de brandmelding of de brandcontrole
      is samengebracht;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.2
  - number: 5.2.14
    text: '*ruimten voor machines van categorie A:* alle ruimten waarin zijn ondergebracht:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.2
  - number: 5.2.14.a
    text: verbrandingsmotoren of gasturbines, die worden gebruikt als hoofdvoortstuwingswerktuig;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.2
  - number: 5.2.14.b
    text: |-
      verbrandingsmotoren of gasturbines, andere dan die worden gebruikt als hoofdvoortstuwingswerktuig indien zodanige
      werktuigen een gezamenlijk vermogen hebben van niet minder dan 375 kW, of
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.2
  - number: 5.2.14.c
    text: met olie gestookte ketels of oliestookinrichtingen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.2
  - number: 5.2.15
    text: |-
      *ruimten voor machines:* alle ruimten voor machines van categorie A en alle andere ruimten waarin
      voortstuwingswerktuigen, ketels, oliestookinrichtingen, stoommachines, verbrandingsmotoren en gasturbines,
      generatoren, stuurinrichtingen, belangrijke elektrische werktuigen, olielaadstations, koelmachine-installaties,
      stabilisatie-inrichtingen, luchtverversings- en luchtbehandelinginstallaties zijn ondergebracht en soortgelijke
      ruimten, alsmede de bijbehorende schachten.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.2
  - number: 5.3.1
    text: |-
      De romp, de bovenbouw, structurele schotten, dekken en dekhuizen zijn van staal of ander, gelijkwaardig materiaal
      vervaardigd, tenzij anders is aangegeven in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.3
  - number: 5.3.2
    text: |-
      De isolatie van onderdelen van schotten van klasse «A» of« B», die van aluminiumlegering zijn vervaardigd, met
      uitzondering van die welke naar het oordeel van het Hoofd van de Scheepvaartinspectie niet lastdragend zijn, is
      zodanig dat de temperatuur van de metalen kern van de constructie gedurende de van toepassing zijnde brandproef te
      eniger tijd niet meer dan 200°C boven de temperatuur van de omgeving stijgt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.3
  - number: 5.3.3
    text: |-
      Bijzondere aandacht wordt geschonken aan de isolatie van onderdelen van stutten, stijlen en andere delen van de
      constructie die van aluminiumlegering zijn vervaardigd en die nodig zijn ter ondersteuning van de plaatsen voor de
      opstelling en het te water brengen van en de inscheping in de groepsreddingsmiddelen, en van schotten van klasse
      «A» en «B», teneinde zeker te stellen:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.3
  - number: 5.3.3.a
    text: |-
      dat voor dergelijke constructiedelen die de plaatsen met de groepsreddingsmiddelen en schotten van klasse «A»
      steunen, de grens voor de temperatuurstijging, genoemd in het tweede lid, aan het einde van een uur zal gelden, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.3
  - number: 5.3.3.b
    text: |-
      dat voor dergelijke constructiedelen die schotten van klasse «B» ondersteunen, de grens voor de
      temperatuurstijging, genoemd in tweede lid, aan het einde van een half uur zal gelden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.3
  - number: 5.3.4
    text: |-
      Kappen en schachten van ruimten voor machines van categorie A zijn van staal en zijn naar behoren geïsoleerd,
      terwijl de eventuele openingen daarin doelmatig zijn aangebracht en zijn voorzien van middelen om uitbreiding van
      brand tegen te gaan.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.3
  - number: 5.4.1
    text: |-
      Binnen ruimten voor accommodatie en dienstruimten zijn alle schotten van klasse «B» opgetrokken van dek tot dek
      en strekken zij zich uit tot de huid of tot andere begrenzingswanden, tenzij aan beide zijden van de schotten
      doorlopende plafonds of beschietingen van klasse «B» of beide zijn aangebracht, in welk geval het schot mag
      eindigen bij het doorlopende plafond of de doorlopende beschieting.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.4
  - number: 5.4.2
    text: |-
      *Methode IF:* alle schotten die niet ingevolge het bepaalde in dit artikel of andere artikelen van deze paragraaf
      van klasse« A» of «B» zijn, zijn ten minste schotten van klasse« C».
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.4
  - number: 5.4.3
    text: |-
      *Methode IIF:* de constructie van schotten die niet ingevolge het bepaalde in dit artikel of andere artikelen van
      deze paragraaf van klasse «A» of «B» zijn, is niet aan beperking onderworpen, behoudens in die gevallen waarin
      schotten van klasse «C» zijn vereist overeenkomstig tabel 1 in [artikel 5.7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel5
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5.4.4
    text: |-
      *Methode IIIF:* de constructie van schotten die niet ingevolge het bepaalde in dit artikel of andere artikelen van
      deze paragraaf van klasse «A» of «B» zijn, is niet aan beperkingen onderworpen. De oppervlakte van enige ruimte
      of ruimten voor accommodatie die door een doorlopend schot van klasse «A» of «B» worden begrensd, bedraagt in geen
      geval meer dan 50 m2, behoudens in die gevallen waarin schotten van klasse «C» zijn vereist overeenkomstig tabel
      1 in [artikel 5.7][ref1]. Het Hoofd van de Scheepvaartinspectie kan voor ruimten voor algemeen gebruik echter een
      grotere oppervlakte toestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel5
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5.5.1
    text: |-
      Trappen die niet meer dan twee dekken bedienen zijn ten minste op een niveau beschermd door schotten van klasse
      «B 0» en zelfsluitende deuren. Liften die niet meer dan twee dekken bedienen, zijn omsloten door schotten van
      klasse «A 0», die op beide niveaus zijn voorzien van stalen deuren. Trappen en liftschachten die meer dan twee
      dekken bedienen, zijn ten minste omsloten door schotten van klasse «A 0» en zijn beschermd door zelfsluitende
      deuren op alle niveaus.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.5
  - number: 5.5.2
    text: |-
      Het constructieve deel van alle trappen is van staal, behalve wanneer het Hoofd van de Scheepvaartinspectie het
      gebruik van ander, gelijkwaardig materiaal toestaat.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.5
  - number: 5.6.1
    text: |-
      Deuren hebben een brandwerend vermogen dat, voor zover als praktisch mogelijk is, gelijkwaardig is aan dat van
      het schot waarin zij zijn aangebracht. Deuren en deurkozijnen in schotten van klasse «A» zijn van staal. Deuren
      in schotten van klasse «B» zijn van onbrandbaar materiaal. Deuren aangebracht in begrenzingsschotten van ruimten
      voor machines van categorie A, zijn zelfsluitend en redelijk gasdicht. Het Hoofd van de Scheepvaartinspectie kan
      het gebruik van brandbare materialen toestaan in deuren die hutten scheiden van de eigen bijbehorende sanitaire
      ruimten, zoals douchecellen, indien methode IF is toegepast.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.6
  - number: 5.6.2
    text: |-
      Deuren die zelfsluitend moeten zijn, zijn niet voorzien van vastzethaken. Vastzetinrichtingen mogen evenwel worden
      toegepast indien deze zijn voorzien van op afstand bediende ontkoppelingsinrichtingen van een type dat de deur doet
      sluiten indien het systeem in het ongerede geraakt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.6
  - number: 5.6.3
    text: |-
      Ventilatieopeningen mogen zijn aangebracht in en onder deuren in schotten van gangen, met dien verstande dat
      dergelijke openingen niet mogen zijn aangebracht in en onder deuren van trapomsluitingen. De openingen in deuren
      zijn uitsluitend in de onderste helft van een deur aangebracht. Indien een dergelijke opening zich bevindt in of
      onder een deur, bedraagt de totale oppervlakte van deze opening of openingen niet meer dan 0,05 m2. Indien een
      dergelijke opening in een deur is aangebracht, is deze voorzien van een rooster van onbrandbaar materiaal.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.6
  - number: 5.6.4
    text: Waterdichte deuren behoeven niet geïsoleerd te zijn.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.6
  - number: 5.7.1
    text: |-
      Behalve aan de specifieke bepalingen voor brandwerendheid van schotten en dekken die elders in deze paragraaf
      worden voorgeschreven, voldoet de brandwerendheid van schotten en dekken ten minste aan de eisen zoals
      voorgeschreven in de onderstaande tabellen 1 en 2.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.7
  - number: 5.7.2
    text: 'Bij het gebruik van de tabellen gelden de volgende bepalingen:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.7
  - number: 5.7.2.a
    text: |-
      de tabellen 1 en 2 zijn van toepassing op onderscheidenlijk schotten en dekken die aan elkaar grenzende ruimten
      scheiden, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.7
  - number: 5.7.2.b
    text: |-
      ter bepaling van de passende normen voor de brandwerendheid die moeten worden aangelegd voor schotten en dekken
      tussen aan elkaar grenzende ruimten, zijn deze ruimten als volgt ingedeeld op grond van hun brandrisico:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.7
  - number: 5.7.2.b.1°
    text: |-
      Controlestations (1): - ruimten waarin de noodkrachtbronnen en de voorzieningen voor de noodverlichting zijn
      ondergebracht;
        - stuurhuis en kaartenkamer;
        - ruimten waarin de radio-installatie van het vaartuig is ondergebracht;
        - ruimten ten behoeve van brandblussing, stations voor brandcontrole en brandmelding;
        - controleruimte voor de voortstuwingsinstallatie, indien deze is gelegen buiten de ruimten voor machines;
        - ruimten waarin de brandalarmeringsapparatuur bijeen is gebracht.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.7
  - number: 5.7.2.b.2°
    text: 'Gangen (2): - gangen en portalen.'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.7
  - number: 5.7.2.b.3°
    text: |-
      Ruimten voor accommodatie (3): - ruimten als bedoeld in [artikel 5.2, de onderdelen 10 en 11][ref1], met
      uitzondering van gangen.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel5
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 5.7.2.b.4°
    text: |-
      Trappen (4): - binnentrappen, liften en roltrappen, die niet geheel binnen de ruimten voor machines liggen, alsmede
      de bijbehorende ingesloten ruimten. In dit verband wordt een trap die slechts op één niveau is ingesloten beschouwd
      als een deel van de ruimte waarin hij niet door een brandwerende deur is gescheiden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.7
  - number: 5.7.2.b.5°
    text: |-
      Dienstruimten die in geringe mate brandgevaarlijk zijn (5): - bergkasten en bergplaatsen die een oppervlakte hebben
      van minder dan 2 m2, droogkamers en wasserijen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.7
  - number: 5.7.2.b.6°
    text: |-
      Ruimten voor machines van categorie A (6): - ruimten als bedoeld in [artikel 5.2, onderdeel 14][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel5
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 5.7.2.b.7°
    text: |-
      Andere ruimten voor machines (7): - ruimten als bedoeld in [artikel 5.2, onderdeel 15][ref1], alsmede ruimten waar
      vis tot vismeel wordt verwerkt, doch met uitzondering van ruimten voor machines van categorie A.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel5
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 5.7.2.b.8°
    text: |-
      Laadruimten (8): - alle ruimten die gebruikt worden voor lading, met inbegrip van ladingolietanks, alsmede
      schachten en luikhoofden van zodanige ruimten.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.7
  - number: 5.7.2.b.9°
    text: |-
      Dienstruimten die in hoge mate brandgevaarlijk zijn (9): - kombuizen, pantry's die voorzien zijn van
      kooktoestellen, verfhutten, lampenhutten, bergkasten en bergplaatsen die een oppervlakte hebben van 2 m2 of meer,
      alsmede werkplaatsen die geen deel uitmaken van de ruimten voor machines.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.7
  - number: 5.7.2.b.10°
    text: |-
      Open dekken (10): - open dekruimten en gesloten wandelgangen, ruimten waar vis in rauwe staat wordt verwerkt,
      ruimten waar vis wordt schoongespoeld en soortgelijke ruimten die niet brandgevaarlijk zijn;
        - luchtruimten buiten de bovenbouwen en dekhuizen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.7
  - number: 5.7.3
    text: |-
      Doorlopende plafonds of beschietingen van klasse «B» kunnen, tezamen met de desbetreffende dekken of schotten,
      worden aanvaard als een volledige of gedeeltelijke bijdrage tot de vereiste isolatie en brandwerendheid van een
      afscheiding.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.7
  - number: 5.7.4
    text: 'Voor ruimten voor machines gelden ten aanzien van ramen en schijnlichten de volgende voorschriften:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.7
  - number: 5.7.4.a
    text: |-
      schijnlichten die kunnen worden geopend, kunnen van buiten de ruimte waarop zij zijn aangebracht worden gesloten.
      Schijnlichten waarin ramen zijn aangebracht zijn aan de buitenzijde voorzien van blinden van staal of ander
      gelijkwaardig materiaal en zijn vast aan het schijnlicht verbonden,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.7
  - number: 5.7.4.b
    text: |-
      glas of soortgelijk materiaal mag niet in begrenzingsschotten van ruimten voor machines zijn aangebracht. Dit
      sluit het gebruik van draadglas in schijnlichten en glas in controlekamers die geheel in ruimten voor machines zijn
      gelegen niet uit, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.7
  - number: 5.7.4.c
    text: schijnlichten als bedoeld onder a zijn voorzien van draadglas.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.7
  - number: 5.7.5
    text: |-
      In de buitenste begrenzingswanden die ingevolge het bepaalde in [artikel 5.3, eerste lid][ref1], van staal of ander
      gelijkwaardig materiaal zijn, mogen ramen en patrijspoorten zijn aangebracht, mits niet elders in deze paragraaf
      is voorgeschreven dat zodanige begrenzingswanden een brandwerendheid van klasse« A» hebben. Evenzo mogen deuren
      in dergelijke begrenzingswanden die geen brandwerendheid van klasse «A» behoeven te hebben, zijn vervaardigd van
      materialen die ten genoegen van het Hoofd van de Scheepvaartinspectie zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel5
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5.8.1
    text: |-
      *Methode IF* In ruimten voor accommodatie, in dienstruimten en in controlestations zijn alle beschietingen,
      afstoppingen, plafonds en het bijbehorende grondhout van onbrandbaar materiaal.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.8
  - number: 5.8.2
    text: |-
      *Methoden IIF en IIIF* In de gangen en in ingesloten ruimten voor trappen die toegang geven tot ruimten voor
      accommodatie, dienstruimten en controlestations, zijn plafonds, beschietingen, afstoppingen en het bijbehorende
      grondhout van onbrandbaar materiaal.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.8
  - number: 5.8.3
    text: '*Methoden IF, IIF en IIIF*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.8
  - number: 5.8.3.a
    text: |-
      Tenzij toegepast in laadruimten of koel- en vrieskamers in dienstruimten, zijn de isolatiematerialen onbrandbaar
      met dien verstande dat dampwerende lagen, kleefstoffen gebruikt bij isolatie, alsmede de isolatie van pijpleidingen
      van koudwatersystemen niet van onbrandbaar materiaal behoeven te zijn, doch zij worden tot het praktisch mogelijke
      minimum beperkt en het vlamverspreidend vermogen van de blootgestelde oppervlakken ervan is ten genoegen van het
      Hoofd van de Scheepvaartinspectie. In ruimten waarin olieproducten aanwezig kunnen zijn, is het oppervlak van de
      isolatie ondoordringbaar voor olie en oliedampen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.8
  - number: 5.8.3.b
    text: |-
      Indien onbrandbare schotten, beschietingen en plafonds zijn aangebracht in ruimten voor accommodatie en
      dienstruimten, mogen deze binnen deze ruimten zijn voorzien van een brandbare fineerlaag mits deze niet dikker is
      dan 2 mm, behalve in gangen, ingesloten ruimten voor trappen en controlestations, alwaar deze laag niet dikker mag
      zijn dan 1,5 mm.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.8
  - number: 5.8.3.c
    text: |-
      Luchtruimten, ingesloten achter wanden en beschietingen en tussen plafonds en dekken, zijn op passende wijze
      onderverdeeld door afstoppingen die de trek tegengaan en die niet verder dan 14 m uiteen liggen. In verticale
      richting zijn dergelijke ruimten, met inbegrip van die achter beschietingen van trappenhuizen, schachten en andere
      ruimten, op elk dek afgestopt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.8
  - number: 5.9.1.a
    text: |-
      Ventilatiekanalen zijn vervaardigd van onbrandbaar materiaal. Korte stukken van kanalen die over het algemeen niet
      langer zijn dan 2 m en waarvan de oppervlakte van de dwarsdoorsnede niet meer dan 0,02 m2 bedraagt, behoeven niet
      onbrandbaar te zijn, mits aan onderstaande voorwaarden is voldaan:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.9
  - number: 5.9.1.a.1°
    text: |-
      de kanalen zijn vervaardigd van een materiaal dat slechts in beperkte mate brandgevaarlijk is, ten genoegen van het
      Hoofd van de Scheepvaartinspectie,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.9
  - number: 5.9.1.a.2°
    text: zij mogen alleen worden gebruikt aan het eind van het ventilatiesysteem, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.9
  - number: 5.9.1.a.3°
    text: |-
      zij mogen zich, langs het kanaal gemeten, niet op minder dan 600 mm vanaf een doorvoering door een schot van klasse
      «A» of «B», doorlopende plafonds van klasse «B» daaronder begrepen, bevinden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.9
  - number: 5.9.1.b
    text: |-
      Indien ventilatiekanalen waarvan de oppervlakte van de dwarsdoorsnede meer dan 0,02 m2 bedraagt, door schotten of
      dekken van klasse« A» gaan, zijn de openingen voorzien van een stalen ommantelingskoker, tenzij de kanalen die door
      schotten of dekken gaan ter plaatse van de doorvoering door het dek of schot van staal zijn en voor dat deel van
      het kanaal voldoen aan de volgende voorschriften:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.9
  - number: 5.9.1.b.1°
    text: |-
      voor kanalen, waarvan de oppervlakte van de dwarsdoorsnede meer dan 0,02 m2 bedraagt, hebben de ommantelingskokers
      een dikte van ten minste 3 mm en een lengte van ten minste 900 mm; bij doorvoering door een schot verdient het
      aanbeveling deze lengte gelijkelijk over beide zijden van het schot te verdelen. Kanalen waarvan de oppervlakte
      van de dwarsdoorsnede meer dan 0,02 m2 bedraagt, zijn voorzien van een brandisolatie die ten minste dezelfde
      brandwerendheid heeft als het schot of dek waardoor het kanaal is gevoerd. Het Hoofd van de Scheepvaartinspectie
      kan een door hem gelijkwaardig geachte beveiliging van de doorvoering toestaan, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.9
  - number: 5.9.1.b.2°
    text: |-
      kanalen waarvan de oppervlakte van de dwarsdoorsnede meer dan 0,075 m2 bedraagt, zijn, in aanvulling op het
      bepaalde in onderdeel 1, voorzien van brandkleppen die automatisch werken, doch tevens aan beide zijden van het
      schot of dek met de hand kunnen worden gesloten. Brandkleppen zijn voorzien van een standaanwijzer die aangeeft of
      de klep geopend of gesloten is. Brandkleppen zijn echter niet vereist indien kanalen door ruimten lopen die zijn
      omsloten door schotten van klasse «A» en die niet door deze kanalen worden bediend, mits deze kanalen dezelfde
      brandwerendheid hebben als de schotten waar doorheen zij gevoerd worden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.9
  - number: 5.9.1.c
    text: |-
      Ventilatiekanalen voor ruimten voor machines van categorie «A» of voor kombuizen mogen in het algemeen niet
      door ruimten voor accommodatie, dienstruimten of controlestations lopen met dien verstande dat het Hoofd van de
      Scheepvaartinspectie evenwel kan toestaan dat deze ventilatiekanalen door de bovengenoemde ruimten lopen, mits zij
      zijn vervaardigd van staal of ander, gelijkwaardig materiaal en zodanig zijn uitgevoerd dat de brandwerendheid van
      schotten en dekken niet vermindert.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.9
  - number: 5.9.1.d
    text: |-
      Ventilatiekanalen voor ruimten voor accommodatie, dienstruimten of controlestations mogen in het algemeen niet
      door ruimten voor machines van categorie A of door kombuizen lopen met dien verstande dat het Hoofd van de
      Scheepvaartinspectie evenwel kan toestaan dat deze ventilatiekanalen door de bovengenoemde ruimten lopen, mits zij
      zijn vervaardigd van staal of ander, gelijkwaardig materiaal en zodanig zijn uitgevoerd dat de brandwerendheid van
      schotten en dekken niet vermindert.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.9
  - number: 5.9.1.e
    text: |-
      Indien ventilatiekanalen waarvan de oppervlakte van de dwarsdoorsnede meer dan 0,02 m2 bedraagt, door schotten of
      dekken van klasse« B» gaan, zijn de openingen voorzien van stalen ommantelingskokers die een lengte van ten minste
      900 mm hebben, tenzij de kanalen over dezelfde lengte ter plaatse van de doorvoering zijn vervaardigd van staal,
      waarbij deze lengte waar mogelijk gelijk over beide zijden van het schot van klasse« B» is verdeeld.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.9
  - number: 5.9.1.f
    text: |-
      Al het mogelijke wordt gedaan om te bereiken, dat in controlestations die buiten ruimten voor machines zijn
      gelegen, ventilatie, zicht en afwezigheid van rook worden gehandhaafd, zodat in geval van brand de werktuigen en
      toestellen daarin op deugdelijke wijze blijven werken en gecontroleerd kunnen worden. Er is een extra gescheiden
      systeem van luchttoevoer aangebracht, waarbij de inlaatopeningen van de beide systemen van luchttoevoer zo zijn
      gelegen, dat het gevaar dat zij gelijktijdig rook aanzuigen tot een minimum beperkt blijft. Het Hoofd van de
      Scheepvaartinspectie kan toestaan dat dergelijke eisen niet worden gesteld aan controlestations, gelegen op
      en uitgang verlenend naar een open dek, of daar waar plaatselijke afsluitmiddelen zijn aangebracht die even
      doeltreffend zijn.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.9
  - number: 5.9.1.g
    text: |-
      Indien kokers van afvoerkappen boven fornuizen door ruimten voor accommodatie of ruimten met brandbare materialen
      lopen, zijn zij geconstrueerd als schotten van klasse «A», waarbij elke afvoerkoker is uitgerust met:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.9
  - number: 5.9.1.g.1°
    text: een vetvanger die gemakkelijk kan worden verwijderd voor reiniging,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.9
  - number: 5.9.1.g.2°
    text: een brandklep in het onderste deel van de koker,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.9
  - number: 5.9.1.g.3°
    text: een inrichting die vanuit de kombuis kan worden bediend voor het stoppen van de afzuigventilator, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.9
  - number: 5.9.1.g.4°
    text: |-
      een vast aangebrachte inrichting om een brand in de koker te blussen, tenzij naar het oordeel van het Hoofd van
      de Scheepvaartinspectie het aanbrengen van een dergelijke inrichting op een vaartuig, waarvan de lengte minder dan
      75 m bedraagt, niet praktisch uitvoerbaar is.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.9
  - number: 5.9.2
    text: |-
      De hoofdin- en uitlaten van alle ventilatiesystemen kunnen worden gesloten buiten de ruimten die worden
      geventileerd. Toestellen voor mechanische ventilatie van ruimten voor accommodatie, dienstruimten, controlestations
      en ruimten voor machines kunnen vanaf een gemakkelijk bereikbare plaats buiten de ruimten die zij bedienen, worden
      gestopt. Deze plaats is zodanig gelegen dat die niet gemakkelijk onbereikbaar wordt in geval van brand in de
      ruimten die worden bediend. De inrichting waarmee de toestellen voor mechanische ventilatie van de ruimten voor
      machines kunnen worden gestopt, is geheel gescheiden van die, waarmee de ventilatie van andere ruimten kan worden
      gestopt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.9
  - number: 5.9.3
    text: Er zijn middelen aanwezig om de ringvormige ruimten rond schoorstenen vanaf een veilige plaats te kunnen sluiten.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.9
  - number: 5.9.4
    text: Ventilatiesystemen die ruimten voor machines bedienen, zijn onafhankelijk van systemen die andere ruimten bedienen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.9
  - number: 5.9.5
    text: |-
      Bergplaatsen waarin zich aanzienlijke hoeveelheden gemakkelijk ontvlambare stoffen bevinden, zijn voorzien van
      ventilatie-inrichtingen die gescheiden zijn van andere ventilatiesystemen. De ventilatie vindt plaats op hoog en
      op laag niveau. De in- en uitlaten van de ventilatoren zijn op een veilige plaats aangebracht en zijn voorzien van
      vlamkerende inrichtingen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.9
  - number: 5.10.1
    text: |-
      Elektrische verwarmingstoestellen zijn vast opgesteld en zijn zo ingericht dat het brandgevaar tot een minimum
      is beperkt. Deze toestellen mogen niet zijn voorzien van een verwarmingselement dat kleding, gordijnen of andere
      soortgelijke materialen in de directe omgeving kan doen schroeien of in brand doen geraken door de hitte van het
      element.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.10
  - number: 5.10.2
    text: |-
      Verwarming door middel van open vuur is niet toegestaan. Verwarmingskachels en andere soortgelijke apparaten
      zijn deugdelijk bevestigd en zij zijn onder, rondom en ter hoogte van de schoorsteenoploop voorzien van
      voldoende bescherming en isolatie tegen brand. Schoorsteenoplopen van kachels die vaste brandstof verstoken,
      zijn zo ingericht en ontworpen dat de kans op verstopt raken door verbrandingsproducten tot een minimum wordt
      beperkt en zijn uitgerust met een toegankelijke voorziening om schoon te maken. Kleppen om de schoorsteentrek
      te regelen hebben bij de gesloten stand nog enige doorlaat. Ruimten waarin kachels zijn geplaatst zijn voorzien
      van ventilatoren met voldoende doortocht om te kunnen voorzien in voldoende verbrandingslucht voor de kachel.
      Dergelijke ventilatoren mogen niet zijn uitgerust met een afsluitmiddel en hun opstelling is zodanig dat
      afsluitmiddelen die voldoen aan het bepaalde in [artikel 2.9][ref1] niet vereist zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel2
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.10
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '2'
        hoofdstuk: '2'
  - number: 5.10.3
    text: |-
      Toestellen met een open gasvlam, met uitzondering van kookkachels en waterverwarmers, zijn niet toegestaan. Ruimten
      waarin dergelijke kachels en waterverwarmers zijn geplaatst, zijn voorzien van voldoende ventilatie om dampen en
      mogelijke gaslekkage naar een veilige plaats af te voeren. Alle leidingen waardoor het gas vanaf het drukvat naar
      de kachel of waterverwarmer wordt geleid, zijn van staal of een ander goedgekeurd materiaal. Er zijn automatische
      veiligheidsinrichtingen voor het afsluiten van de gastoevoer aangebracht, die in werking treden bij drukverlies in
      de hoofdgasleiding of in het geval van vlamstoring bij elk toestel.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.10
  - number: 5.10.4
    text: |-
      Indien propaan of butaan wordt gebruikt voor huishoudelijke doeleinden zijn de inrichting, de opslag, de
      distributie en het gebruik van de brandstof ten genoegen van het Hoofd van de Scheepvaartinspectie en voldoen zij
      aan het bepaalde in [artikel 5.12][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel5
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.10
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5.11.1
    text: |-
      Alle blootgestelde oppervlakken in gangen en ingesloten ruimten voor trappen, alsmede oppervlakken, met inbegrip
      van het daarmee verbonden grondhout, in verborgen of ontoegankelijke plaatsen in ruimten voor accommodatie,
      dienstruimten en controlestations hebben een laag vlamverspreidend vermogen. Blootgestelde oppervlakken van
      plafonds in ruimten voor accommodatie, dienstruimten en controlestations hebben een laag vlamverspreidend vermogen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.11
  - number: 5.11.2
    text: |-
      Verven, vernissen en andere stoffen voor afwerking, die worden gebruikt op blootgestelde inwendige oppervlakken,
      zijn volgens de FTP-Code getest zodanig dat zij naar het oordeel van het Hoofd van de Scheepvaartinspectie geen
      onnodig brandgevaar opleveren, en mogen geen overmatige hoeveelheden rook of giftige gassen of dampen kunnen
      voortbrengen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.11
  - number: 5.11.3
    text: |-
      De onderste laag van dekbedekkingen in ruimten voor accommodatie, dienstruimten en controlestations is van
      goedgekeurd materiaal dat noch gemakkelijk kan ontbranden, noch aanleiding kan geven tot vergiftigings- of
      explosiegevaar bij verhoogde temperaturen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.11
  - number: 5.11.4
    text: |-
      Wanneer schotten of dekken van klasse «A» of «B» zijn doorboord voor het doorvoeren van elektrische leidingen,
      pijpen, schachten, kanalen en dergelijke, of voor het aanbrengen van uitmondingen van het ventilatiesysteem,
      verlichtingsarmaturen en soortgelijke inrichtingen, zijn er zodanige maatregelen getroffen dat de brandwerendheid
      van de schotten of dekken niet vermindert.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.11
  - number: 5.11.5.a
    text: |-
      In ruimten voor accommodatie, dienstruimten en controlestations zijn pijpen die door schotten of dekken van klasse
      «A» of «B» zijn gevoerd, van goedgekeurde materialen vervaardigd, rekening houdende met de temperatuur waaraan
      de betrokken schotten of dekken weerstand moeten kunnen bieden. Indien door het Hoofd van de Scheepvaartinspectie
      wordt toegestaan dat door ruimten voor accommodatie en dienstruimten olie of brandbare vloeistoffen worden gevoerd,
      zijn de pijpen waardoor die olie of brandbare vloeistoffen worden gevoerd van goedgekeurd materiaal vervaardigd,
      rekening houdende met het brandgevaar.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.11
  - number: 5.11.5.b
    text: |-
      Materialen die gemakkelijk onbruikbaar worden door warmte mogen niet worden gebruikt voor spuipijpen, sanitaire
      uitlaten en andere uitlaten die dicht bij de lastlijn liggen en waarvan het in het ongerede raken in geval van
      brand gevaar voor instromen van water zou meebrengen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.11
  - number: 5.11.6
    text: In cinematografische installaties wordt geen filmmateriaal op basis van cellulosenitraat gebruikt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.11
  - number: 5.11.7
    text: |-
      Afvalbakken, andere dan die worden gebruikt bij de verwerking van vis, zijn vervaardigd van onbrandbare materialen
      en mogen geen openingen in de zijkanten of bodem hebben.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.11
  - number: 5.11.8
    text: |-
      Werktuigen voor de aandrijving van brandstoftrimpompen, pompen van oliestookinrichtingen en dergelijke
      brandstofpompen zijn voorzien van inrichtingen voor afstandsbediening die zijn aangebracht buiten de desbetreffende
      ruimten, zodat bedoelde werktuigen kunnen worden stopgezet bij het uitbreken van brand in de ruimte waarin zij
      zijn opgesteld.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.11
  - number: 5.11.9
    text: Waar nodig zijn lekbakken aangebracht, teneinde te voorkomen dat olie naar de vullings kan vloeien.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.11
  - number: 5.11.10
    text: Brandbare isolatie in visruimen is door een goed afsluitende bekleding beschermd.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.11
  - number: 5.12.1
    text: |-
      Flessen die zijn bestemd voor samengeperste, vloeibaar gemaakte of onder druk opgeloste gassen zijn duidelijk
      gemarkeerd door middel van voorgeschreven kleuren voor identificatie en zijn voorzien van een duidelijk leesbare
      identificatie van de naam en chemische formule van hun inhoud. Dergelijke flessen zijn deugdelijk vastgezet.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.12
  - number: 5.12.2
    text: |-
      Flessen die ontvlambare of andere gevaarlijke gassen bevatten, alsmede flessen die als zodanig in gebruik
      zijn geweest, zijn deugdelijk geborgd en zijn opgesteld op het open dek en alle afsluiters, drukregelaars en
      op de flessen aangesloten leidingen zijn tegen beschadiging beschermd. De flessen zijn beschermd tegen grote
      veranderingen in temperatuur, direct zonlicht en opeenhoping van sneeuw. Het Hoofd van de Scheepvaartinspectie kan
      echter toestaan dat dergelijke flessen zijn opgeslagen in ruimten die voldoen aan de eisen van het derde tot en met
      vijfde lid.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.12
  - number: 5.12.3
    text: |-
      Ruimten waarin gemakkelijk ontvlambare vloeistoffen zoals vluchtige verfstoffen, paraffine, benzol en dergelijke
      en, indien toegestaan, vloeibaar gemaakt gas zijn opgeslagen, zijn uitsluitend toegankelijk vanaf het open dek.
      Drukregeltoestellen en ontlastkleppen monden binnen deze ruimten uit. Wanneer begrenzingsschotten van dergelijke
      ruimten grenzen aan andere omsloten ruimten, zijn deze schotten gasdicht uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.12
  - number: 5.12.4
    text: |-
      Elektrische bedrading en aansluitingen zijn niet toegestaan binnen ruimten die worden gebruikt voor het bergen van
      gemakkelijk ontvlambare vloeistoffen en vloeibaar gemaakte gassen, tenzij benodigd binnen die ruimten. In dat geval
      zijn de elektrische aansluitingen ten genoegen van het Hoofd van de Scheepvaartinspectie geschikt voor gebruik in
      een ontvlambare atmosfeer. Warmtebronnen mogen zich niet dicht bij dergelijke ruimten bevinden en opschriften met
      «niet roken» en «geen open vuur» zijn aangebracht op een doelmatige plaats.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.12
  - number: 5.12.5
    text: |-
      Elk soort samengeperst gas is afzonderlijk opgeslagen. Ruimten die voor opslag van dergelijke gassen worden
      gebruikt, mogen niet worden gebruikt voor het opslaan van brandbare producten, noch voor gereedschappen of
      onderdelen die geen deel uitmaken van het gasdistributiesysteem. Het Hoofd van de Scheepvaartinspectie kan echter
      met inachtneming van de kenmerkende eigenschappen, hoeveelheid en voorgenomen gebruik van dergelijke samengeperste
      gassen, verlichting van deze voorschriften toestaan.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.12
  - number: 5.13.1
    text: |-
      In en vanuit alle ruimten voor accommodatie en ruimten waarin door de bemanning onder normale omstandigheden
      dienst wordt gedaan, andere dan ruimten voor machines, zijn trappen en ladders aangebracht waarlangs het open dek
      en vervolgens de groepsreddingsmiddelen gemakkelijk kunnen worden bereikt. In het bijzonder voldoen zij aan de
      volgende bepalingen:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.13
  - number: 5.13.1.a
    text: |-
      op elk dek waarop zich ruimten voor accommodatie bevinden, zijn ten minste twee, zo ver mogelijk van elkaar
      verwijderde voorzieningen voor ontsnapping aangebracht. De normale voorzieningen voor toegang tot elke besloten
      ruimte of groep van ruimten mogen hieronder worden begrepen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.13
  - number: 5.13.1.b.1°
    text: |-
      onder het blootgestelde dek bestaat de hoofdvoorziening voor ontsnapping uit een trap, terwijl de tweede
      voorziening voor ontsnapping mag bestaan uit een schacht of trap, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.13
  - number: 5.13.1.b.2°
    text: |-
      boven het blootgestelde dek bestaan de voorzieningen voor ontsnapping uit trappen of deuren naar een open dek, dan
      wel uit een combinatie van beide;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.13
  - number: 5.13.1.c
    text: |-
      het Hoofd van de Scheepvaartinspectie kan bij wijze van uitzondering toestaan dat slechts één voorziening voor
      ontsnapping is aangebracht, indien de aard en de plaats van de ruimten en het aantal personen die in normale
      omstandigheden daarin verblijven of dienst doen, daartoe aanleiding geven;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.13
  - number: 5.13.1.d
    text: doodlopende gangen met een lengte van meer dan 7 m zijn niet toegestaan;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.13
  - number: 5.13.1.e
    text: |-
      de afmetingen van en de wijze waarop de voorzieningen voor ontsnapping zijn uitgevoerd, zijn ten genoegen van het
      Hoofd van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.13
  - number: 5.13.2
    text: |-
      In elke ruimte voor machines van categorie A zijn twee voorzieningen voor ontsnapping aangebracht, die bestaan
      uit hetzij:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.13
  - number: 5.13.2.a
    text: |-
      twee stel stalen ladders, aangebracht op een zo groot mogelijke onderlinge afstand, die leiden naar eveneens zo
      ver mogelijk van elkaar verwijderde deuren in het bovenste gedeelte van de ruimte vanwaar het open dek kan worden
      bereikt. In het algemeen geeft een van deze ladders een ononderbroken bescherming tegen brand vanaf het onderste
      gedeelte van de ruimte tot een veilige plaats buiten de ruimte. Het Hoofd van de Scheepvaartinspectie kan echter
      toestaan dat een zodanige bescherming niet wordt aangebracht, indien de inrichting en de afmetingen van de ruimte
      voor machines zodanig zijn, dat in een veilige vluchtweg uit het onderste gedeelte van deze ruimte is voorzien.
      Deze bescherming is van staal, waar nodig geïsoleerd ten genoegen van het Hoofd van de Scheepvaartinspectie en aan
      de onderzijde voorzien van een zelfsluitende stalen deur, hetzij:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.13
  - number: 5.13.2.b
    text: |-
      een stalen ladder, die leidt naar een deur in het bovenste gedeelte van de ruimte, vanwaar het open dek kan worden
      bereikt. Bovendien is in het onderste gedeelte van de ruimte, ruimschoots verwijderd van deze ladder, een stalen
      deur aangebracht, die aan beide zijden kan worden bediend en die een veilige vluchtweg biedt vanuit het onderste
      gedeelte van de ruimte naar het open dek.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.13
  - number: 5.13.3
    text: |-
      Vanuit ruimten voor machines, andere dan die van categorie A, is ten genoegen van het Hoofd van de
      Scheepvaartinspectie in veilige vluchtwegen voorzien, daarbij rekening houdend met de aard en de ligging van de
      betreffende ruimte alsmede of daarin onder normale omstandigheden personen dienst doen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.13
  - number: 5.13.4
    text: Liften worden niet beschouwd als een van de vereiste voorzieningen voor ontsnapping.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.13
  - number: 5.13.5
    text: |-
      Voorzieningen voor ontsnapping zijn op de juiste plaatsen voorzien van signaleringen die voldoen aan bij
      ministeriële regeling te stellen nadere eisen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.13
  - number: 5.14.1
    text: |-
      Op vaartuigen waar methode IIF wordt toegepast is een automatische sprinkler-, brandalarm- en
      brandontdekkingsinstallatie van een goedgekeurd type aangebracht, die voldoet aan het bepaalde in dit artikel. Deze
      installatie is op zodanige wijze aangebracht, dat ruimten voor accommodatie en dienstruimten, met uitzondering van
      ruimten die vrijwel geen brandgevaar opleveren, zoals lege ruimten en sanitaire ruimten, worden beschermd.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.14
  - number: 5.14.2.a
    text: |-
      De installatie is te allen tijde voor onmiddellijk gebruik gereed en generlei handeling van de zijde van de
      bemanning moet nodig zijn om de installatie in werking te stellen. De installatie is van het «natte pijp»-type,
      doch kleine blootgestelde delen kunnen van het «droge pijp»-type zijn, indien dit naar het oordeel van het Hoofd
      van de Scheepvaartinspectie een noodzakelijke voorzorg is. Delen van de installatie die in bedrijfstoestand kunnen
      worden blootgesteld aan temperaturen beneden het vriespunt, zijn op passende wijze tegen bevriezing beschermd. De
      installatie staat steeds onder voldoende druk en is verzekerd van een voortdurende watertoevoer, zoals vereist in
      het zesde lid, onder b.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.14
  - number: 5.14.2.b
    text: |-
      In elke sprinklersectie zijn middelen aangebracht voor het automatisch geven van zichtbare en hoorbare signalen op
      een of meer alarmpanelen, wanneer een sprinkler gaat werken. Deze alarmpanelen geven een aanwijzing in welke door
      de installatie beschermde sectie zich brand voordoet en zijn gecentraliseerd op de brug; bovendien zijn zichtbare
      en hoorbare signalen afkomstig van het alarmpaneel op een zodanige plaats buiten het stuurhuis waarneembaar, dat
      zeker is dat de brandmelding onmiddellijk door de bemanning wordt opgemerkt. Een dergelijke alarminstallatie is
      zodanig geconstrueerd, dat eventueel in de installatie optredende defecten worden aangegeven.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.14
  - number: 5.14.3.a
    text: De sprinklers zijn gegroepeerd in afzonderlijke secties, elk van niet meer dan 200.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.14
  - number: 5.14.3.b
    text: |-
      Elke sprinklersectie wordt door middel van slechts één afsluiter afgescheiden van het overige deel van de
      installatie. De afsluiter in elke sectie is gemakkelijk bereikbaar en de plaats ervan is duidelijk en duurzaam
      aangegeven. Er zijn voorzieningen getroffen teneinde te voorkomen dat de afsluiters door een onbevoegde kunnen
      worden bediend.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.14
  - number: 5.14.3.c
    text: |-
      Er is een manometer die de druk in de installatie aangeeft, aangebracht bij iedere sectieafsluiter en op een
      centrale plaats.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.14
  - number: 5.14.3.d
    text: |-
      De sprinklers zijn bestand tegen corrosie. In ruimten voor accommodatie en dienstruimten werken de sprinklers bij
      een temperatuur tussen 68°C en 79°C, behalve dat in ruimten zoals droogkamers, waar een hoge temperatuur kan worden
      verwacht, de temperatuur waarbij de sprinkler gaat werken, kan worden verhoogd tot niet meer dan 30°C boven de
      maximumtemperatuur bij het plafond.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.14
  - number: 5.14.3.e
    text: |-
      Op of bij elk alarmpaneel is duidelijk aangegeven wat de door de installatie bestreken ruimten zijn en de plaats
      van de betreffende sprinklersectie ten opzichte van de overige secties. Er zijn passende instructies voor de
      beproeving en het onderhoud aanwezig.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.14
  - number: 5.14.4
    text: |-
      De sprinklers zijn hoog in de ruimte aangebracht in een zodanig patroon dat de levering van een gemiddelde
      hoeveelheid water van niet minder dan 5 l/m2/min. wordt gehandhaafd over de nominale oppervlakte die door de
      sprinklers wordt bestreken. Het Hoofd van de Scheepvaartinspectie kan het gebruik van sprinklers toestaan die
      een andere hoeveelheid water, op de juiste wijze verdeeld, leveren en waarvan ten genoegen van genoemd hoofd is
      aangetoond dat zij niet minder doeltreffend zijn.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.14
  - number: 5.14.5.a
    text: |-
      Een druktank is aangebracht met een inhoud gelijk aan ten minste het dubbele van de hoeveelheid water zoals
      aangegeven in dit lid. De tank bevat permanent een hoeveelheid zoet water die gelijk is aan de hoeveelheid water
      die in één minuut zou worden geleverd door de pomp zoals bedoeld in het zesde lid, onder b. De inrichting voorziet
      in een zodanige handhaving van de luchtdruk in de tank dat wordt gewaarborgd dat, nadat de permanente hoeveelheid
      zoet water uit de tank is gedreven, de druk niet minder zal zijn dan de werkdruk van de sprinkler, vermeerderd met
      de statische druk van een kolom water gemeten van de bodem van de tank tot de hoogste sprinkler in het systeem. Er
      zijn passende middelen aanwezig voor de aanvulling van de onder druk staande lucht en van de zoetwatervoorraad in
      de tank. Er is een peilglas aangebracht dat het waterpeil in de tank aangeeft.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.14
  - number: 5.14.5.b
    text: Er zijn middelen aanwezig om te verhinderen dat zeewater in de tank kan stromen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.14
  - number: 5.14.6.a
    text: |-
      Er is een onafhankelijke mechanisch aangedreven pomp aanwezig, uitsluitend bestemd voor automatische voortzetting
      van de afgifte van water uit de sprinklers. De pomp treedt automatisch in werking door een drukval in het systeem
      voordat de permanente hoeveelheid zoet water in de druktank volledig is uitgeput.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.14
  - number: 5.14.6.b
    text: |-
      De pomp en het leidingstelsel zijn in staat de nodige druk ter hoogte van de hoogste sprinkler te handhaven,
      teneinde een voortdurende afgifte van water te verzekeren die voldoende is voor het gelijktijdig bestrijken van
      de maximum oppervlakte die wordt begrensd door onbrandbare schotten van klasse« A» en «B» of van een oppervlakte
      van 280 m2, waarbij de kleinste oppervlakte mag worden aangehouden, bij een hoeveelheid water per tijdseenheid als
      aangegeven in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.14
  - number: 5.14.6.c
    text: |-
      De pomp is aan de drukzijde voorzien van een proefkraan met een korte open afvoerpijp. De effectieve
      doorstroomopening van de kraan en de pijp is groot genoeg om de vereiste pompcapaciteit af te voeren bij een druk
      in het systeem, zoals die is omschreven in het vijfde lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.14
  - number: 5.14.6.d
    text: |-
      De zee-inlaat van de pomp ligt, indien mogelijk, in dezelfde ruimte als waarin de pomp is opgesteld en is zodanig
      geplaatst dat het bij het te water liggende vaartuig niet nodig is de toevoer van zeewater naar de pomp af te
      sluiten voor andere doeleinden dan inspectie of reparatie van de pomp.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.14
  - number: 5.14.7
    text: |-
      De sprinklerpomp en -tank zijn opgesteld op een redelijke afstand van ruimten voor machines van categorie A. Zij
      mogen niet zijn opgesteld in een ruimte die door het sprinklersysteem wordt beschermd.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.14
  - number: 5.14.8.a
    text: |-
      Ten minste twee krachtbronnen zijn aanwezig voor de aandrijving van de sprinklerpomp en voor de voeding van de
      automatische brandalarm- en brandontdekkingsinstallatie. Indien de pomp door een elektromotor wordt aangedreven, is
      deze aangesloten op de elektrische hoofdkrachtbron die door ten minste twee generatoren kan worden gevoed.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.14
  - number: 5.14.8.b
    text: |-
      De voedingsleidingen zijn zodanig aangelegd dat zij niet door kombuizen, ruimten voor machines en andere ingesloten
      ruimten met een hoog brandrisico lopen, behoudens voorzover het noodzakelijk is om het desbetreffende schakelbord
      te bereiken. Een van de krachtbronnen voor de brandalarm- en brandontdekkingsinstallatie is een noodkrachtbron.
      Indien een van de krachtbronnen voor de pomp een verbrandingsmotor is, voldoet de opstelling hiervan aan het
      bepaalde in het zevende lid en is tevens zo gelegen dat de luchttoevoer naar de desbetreffende motor niet wordt
      beïnvloed door een brand in een beschermde ruimte.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.14
  - number: 5.14.9
    text: |-
      De sprinklerinstallatie heeft een verbinding met de hoofdbrandblusleiding van het vaartuig door middel van een
      afsluiter met een losse klep die is voorzien van een borginrichting met slot, waardoor het terugvloeien van water
      vanuit de sprinklerinstallatie naar de hoofdbrandblusleiding wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.14
  - number: 5.14.10.a
    text: |-
      Er is een proefkraan aanwezig voor de beproeving van het automatische alarm voor elke sprinklersectie, waardoor een
      hoeveelheid water kan worden afgevoerd die gelijkwaardig is aan de werking van een sprinkler. De proefkraan voor
      elke sectie is bij de sectieafsluiter geplaatst.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.14
  - number: 5.14.10.b
    text: |-
      Er zijn middelen aanwezig voor de beproeving van de automatische werking van de pomp door de druk in het systeem
      te verminderen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.14
  - number: 5.14.10.c
    text: |-
      Er zijn schakelaars aanwezig bij een van de alarmpanelen, bedoeld in het tweede lid, onderdeel b, waarmee de
      hoorbare en zichtbare alarmen van elke sprinklersectie kunnen worden beproefd.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.14
  - number: 5.14.11
    text: |-
      Voor elke sprinklersectie bepaalt het Hoofd van de Scheepvaartinspectie het aantal reserve sprinklerkoppen dat
      aanwezig moet zijn.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.14
  - number: 5.15.1
    text: |-
      Op vaartuigen waar methode IIIF wordt toegepast, is een automatische brandalarm- en brandontdekkingsinstallatie
      van een goedgekeurd type aangebracht, die voldoet aan het bepaalde in dit artikel. Deze installatie is op
      zodanige wijze aangebracht, dat de aanwezigheid van brand in alle ruimten voor accommodatie, dienstruimten en
      controlestations met uitzondering van ruimten die vrijwel geen brandgevaar opleveren, zoals lege ruimten en
      sanitaire ruimten, kan worden ontdekt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.15
  - number: 5.15.2.a
    text: |-
      De installatie is te allen tijde voor onmiddellijk gebruik gereed en generlei handeling van de zijde van de
      bemanning moet nodig zijn om de installatie in werking te stellen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.15
  - number: 5.15.2.b
    text: |-
      In elke sectie als bedoeld in het derde lid zijn middelen aangebracht voor het automatisch geven van zichtbare
      en hoorbare alarmsignalen op een of meer alarmpanelen, wanneer een branddetector gaat werken. Deze alarmpanelen
      geven een aanwijzing in welke door de installatie beschermde sectie zich brand voordoet en zijn gecentraliseerd
      op de brug en op zodanige andere plaatsen, dat zeker is dat elk alarm van de installatie onmiddellijk door de
      bemanning wordt opgemerkt. Bovendien zijn er voorzieningen aangebracht teneinde zeker te stellen dat een hoorbaar
      alarmsignaal wordt gegeven op het dek waarop de brand is ontdekt. Een dergelijke alarminstallatie is zodanig
      geconstrueerd, dat eventueel in de installatie optredende defecten worden aangegeven.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.15
  - number: 5.15.3
    text: |-
      De branddetectors zijn gegroepeerd in afzonderlijke secties, die zich uitstrekken tot niet meer dan 50
      ruimten waarin een dergelijke installatie is aangebracht en die niet meer dan 100 detectors mogen omvatten. De
      branddetectors zijn op zodanige wijze in zones ondergebracht, dat kan worden aangegeven op welk dek zich brand
      voordoet.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.15
  - number: 5.15.4
    text: |-
      De installatie wordt in werking gesteld door een abnormale temperatuur van de lucht, door een abnormale
      rookconcentratie of door andere factoren, die een begin van brand in een te beschermen ruimte aanduiden. De
      installaties die reageren op de temperatuur van de lucht, mogen niet in werking treden bij een temperatuur van
      minder dan 54°C en treden in werking bij een temperatuur van niet meer dan 78°C, wanneer de temperatuurstijging
      tot die waarden niet meer is dan 1°C/min. Het Hoofd van de Scheepvaartinspectie kan toestaan dat in ruimten zoals
      droogkamers, waar hoge omgevingstemperaturen kunnen worden verwacht, de temperatuur waarbij de installatie in
      werking treedt, wordt verhoogd tot niet meer dan 30°C boven de maximumtemperatuur bij het plafond. Installaties
      bestaande uit rookdetectoren die reageren op een vermindering van de intensiteit van een uitgezonden lichtstraal
      treden in werking alvorens de rookdichtheid een waarde van 12,5% verduistering per meter overschrijdt, maar niet
      voordat de rookdichtheid een waarde van 2% verduistering per meter overschrijdt. Andere even doeltreffende methoden
      voor inwerkingstelling van de installatie kunnen door het Hoofd van de Scheepvaartinspectie worden aanvaard. De
      ontdekkingsinstallatie mag niet voor andere doeleinden worden gebruikt dan voor brandontdekking.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.15
  - number: 5.15.5
    text: |-
      De branddetectors zijn zodanig uitgevoerd dat zij het alarm in werking stellen door hetzij openen of sluiten van
      contacten, hetzij op een andere doelmatige wijze. Zij zijn hoog in de ruimte geplaatst en op deugdelijke wijze
      beschermd tegen stoten en mogelijke andere oorzaken van beschadiging. Zij zijn bestand tegen de inwerking van
      zeelucht. Zij zijn op een open plaats aangebracht, vrij van dekbalken en andere voorwerpen die het toestromen
      van hete gassen of rook naar het gevoelige element zouden kunnen belemmeren. Detectors die in werking treden door
      het sluiten van contacten, zijn van een type waarbij de contacten zijn afgesloten van de buitenlucht. Er zijn
      voorzieningen aanwezig om het systeem voortdurend op defecten te kunnen controleren.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.15
  - number: 5.15.6
    text: |-
      In elke ruimte waar voorzieningen van brandontdekking zijn vereist, is ten minste een detector aangebracht, met
      dien verstande dat voor elke 37 m2 dekoppervlakte tenminste een detector aanwezig is. In grote ruimten zijn de
      detectors aangebracht in een regelmatig patroon, zodat geen enkele detector meer dan 9 m van een andere detector of
      meer dan 4,5 m van een schot is verwijderd.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.15
  - number: 5.15.7
    text: |-
      Ten minste twee krachtbronnen zijn aanwezig voor de elektrische apparatuur, nodig voor het functioneren van
      de brandalarm- en brandontdekkingsinstallatie. Een van deze krachtbronnen is een noodkrachtbron. De voeding
      geschiedt door uitsluitend voor dit doel bestemde voedingsleidingen. De voedingsleidingen zijn aangesloten op een
      omschakelaar in het controlestation voor het brandontdekkingssysteem. De leidingen zijn zodanig aangelegd dat zij
      niet door kombuizen, ruimten voor machines en andere besloten ruimten met een groot brandrisico lopen, behoudens
      voorzover dergelijke leidingen nodig zijn voor brandontdekking in deze ruimte of om het betreffende schakelbord
      te bereiken.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.15
  - number: 5.15.8.a
    text: |-
      Op of bij elk alarmpaneel is de door de installatie bestreken ruimten en de ligging van de desbetreffende zone van
      het ontdekkingssysteem duidelijk aangegeven. Instructies voor de beproeving zijn aanwezig.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.15
  - number: 5.15.8.b
    text: |-
      Er zijn middelen aanwezig waarmee hete lucht of rook op detectors kan worden gericht, teneinde de goede werking
      daarvan en die van de alarmpanelen te beproeven.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.15
  - number: 5.15.9
    text: |-
      Voor elke sectie van de brandontdekkingsinstallatie is een door het Hoofd van de Scheepvaartinspectie te bepalen
      aantal reserve detectorelementen aan boord aanwezig.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.15
  - number: '5.16'
    text: |-
      Laadruimten die bestemd zijn voor ladingen die in hoge mate brandgevaarlijk zijn, zijn beschermd door een vast
      aangebrachte brandblusinstallatie met gas als blusstof of door een brandblusinstallatie die naar het oordeel van
      het Hoofd van de Scheepvaartinspectie een gelijkwaardige bescherming biedt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.16
  - number: 5.17.1
    text: Aan boord van een vaartuig zijn ten minste twee brandbluspompen aangebracht.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.17
  - number: 5.17.2
    text: |-
      Wanneer een brand in een bepaalde afdeling alle brandbluspompen buiten werking zou kunnen stellen, is een
      vervangend middel aanwezig voor het leveren van water voor het blussen van brand. Op vaartuigen waarvan de
      lengte 75 m of meer bedraagt, bestaat dit vervangend middel uit een vast opgestelde, onafhankelijk aangedreven
      noodbrandbluspomp. Deze noodbrandbluspomp is in staat tot het leveren van twee stralen water, een en ander ten
      genoegen van het Hoofd van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.17
  - number: 5.17.3.a
    text: |-
      De brandbluspompen, de noodbrandbluspomp uitgezonderd, zijn in staat voor brandblusdoeleinden een totale
      hoeveelheid water te leveren met een minimum druk van 0,25 N/mm2, met een totale capaciteit (Q) van ten minste:
      Q = [0,15 √{L(B+D)} + 2,25]2 m3 per uur waarin L, B en D in meters zijn. De vereiste totale capaciteit der
      brandbluspompen behoeft echter niet groter te zijn dan 180 m3 per uur.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.17
  - number: 5.17.3.b
    text: |-
      Elke voorgeschreven brandbluspomp, behalve de noodbrandbluspomp, heeft een capaciteit van niet minder dan 40% van
      de in onderdeel a vereiste totale capaciteit van de brandbluspompen en is in elk geval in staat om ten minste de
      in [artikel 5.19, tweede lid, onderdeel a][ref1], vereiste stralen water te leveren. Deze brandbluspompen moeten
      in staat zijn om de hoofdbrandblusleiding onder de voorgeschreven voorwaarden van water te voorzien. Wanneer
      meer dan twee pompen zijn opgesteld, moet de capaciteit van die extra pompen ten genoegen van het Hoofd van de
      Scheepvaartinspectie zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel5
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.17
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5.17.4.a
    text: |-
      Brandbluspompen zijn onafhankelijk aangedreven mechanische pompen. Sanitaire, ballast-, lens- of algemene
      dienstpompen kunnen worden aanvaard als brandbluspompen mits zij onder normale omstandigheden niet worden
      gebruikt voor het pompen van olie en, indien zij af en toe voor dit doel moeten worden gebruikt, doelmatige
      verwisselinrichtingen zijn aangebracht die ten genoegen van het Hoofd van de Scheepvaartinspectie zijn.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.17
  - number: 5.17.4.b
    text: |-
      Brandbluspompen moeten alle van ontlastkleppen zijn voorzien indien zij in staat zijn een druk te leveren die de
      druk overtreft waarvoor de brandblusleidingen, brandkranen en brandslangen zijn ontworpen. Deze ontlastkleppen
      zijn op zodanige plaats aangebracht en zijn zodanig afgesteld, dat een te hoge druk in enig deel van de
      hoofdbrandblusleiding wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.17
  - number: 5.17.4.c
    text: |-
      Mechanisch aangedreven noodbrandbluspompen moeten onafhankelijk zelfstandig aangedreven pompen zijn die zijn
      uitgerust met een eigen dieselmotor en brandstoftoevoer, die zijn opgesteld op een toegankelijke plaats buiten
      de ruimte waarin de hoofdbrandbluspompen zijn ondergebracht of worden aangedreven door een op zich zelf staande
      generator, die de noodgenerator mag zijn als bedoeld in [artikel 4.17][ref1] met een voldoende capaciteit en
      op een veilige plaats buiten de machinekamer en bij voorkeur boven het werkdek opgesteld. De werking van de
      noodbrandbluspomp moet voor ten minste drie uur verzekerd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel4
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.17
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 5.17.4.d
    text: |-
      Noodbrandbluspompen, zee-inlaatafsluiters en andere noodzakelijke afsluiters kunnen worden bediend vanaf een plaats
      die is gelegen buiten de ruimten waarin de overige brandbluspompen zijn ondergebracht. Deze plaats is zodanig dat
      het niet waarschijnlijk is dat zij in geval van brand in de bedoelde ruimten onbereikbaar wordt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.17
  - number: 5.18.1.a
    text: |-
      Indien meer dan één brandkraan is voorgeschreven om te kunnen voorzien in het aantal stralen water, zoals bedoeld
      in [artikel 5.19, tweede lid, onderdeel a][ref1], is er een hoofdbrandblusleiding aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel5
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.18
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5.18.1.b
    text: |-
      Hoofdbrandblusleidingen hebben geen andere aansluitingen dan die welke voor de brandbestrijding zijn vereist, met
      uitzondering van aansluitingen die zijn aangebracht om het dek te wassen, de ankerkettingen schoon te spuiten en de
      lensejectoren te bedienen, onder voorwaarde dat de doelmatigheid van het brandblussysteem gehandhaafd blijft.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.18
  - number: 5.18.1.c
    text: |-
      In hoofdbrandblusleidingen zijn op doelmatige plaatsen aftapkranen aangebracht om beschadiging door bevriezing
      te voorkomen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.18
  - number: 5.18.2.a
    text: |-
      De doorlaat van de hoofdbrandblusleiding en van de aftakkingen daarvan is groot genoeg voor een doelmatige
      verwerking van de maximaal voorgeschreven opbrengst van twee gelijktijdig werkende brandbluspompen. De doorlaat
      behoeft echter niet groter te zijn dan voor de verwerking van 140 m3/uur nodig is.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.18
  - number: 5.18.2.b
    text: |-
      Wanneer de onder a genoemde opbrengst, geleverd door de aldaar genoemde pompen, wordt verwerkt door straalpijpen
      als omschreven in [artikel 5.19, vijfde lid][ref1], gekoppeld aan slangen die zijn aangesloten op in elkaars
      nabijheid gelegen brandkranen, kan bij alle brandkranen ten minste een druk van 0,25 N/mm2 worden gehandhaafd.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel5
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.18
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5.19.1.a
    text: |-
      Het aantal brandslangen is gelijk aan het aantal geplaatste brandkranen, zoals voorgeschreven in het tweede
      lid. Bovendien is er een reserve brandslang aanwezig. Dit aantal omvat niet de brandslangen zoals vereist in
      de machinekamer en het ketelruim. Het Hoofd van de Scheepvaartinspectie kan een groter aantal brandslangen
      voorschrijven opdat, rekening houdende met de grootte van het vaartuig, steeds voldoende slangen beschikbaar en
      bereikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.19
  - number: 5.19.1.b
    text: |-
      Brandslangen zijn vervaardigd van goedgekeurd materiaal en zijn van voldoende lengte om met een waterstraal alle
      ruimten te kunnen bereiken waarvoor zij zijn bestemd. Deze lengte mag niet meer dan 20 m bedragen. Elke brandslang
      is voorzien van een straalpijp en de nodige koppelingen. Brandslangen worden tezamen met de benodigde onderdelen en
      gereedschappen voor gebruik gereed gehouden op opvallende plaatsen nabij de brandkranen of slangaansluitingen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.19
  - number: 5.19.2.a
    text: |-
      Het aantal en de plaats van de brandkranen is zodanig dat met ten minste twee stralen water, niet afkomstig uit
      dezelfde brandkraan, waarbij voor een van deze stralen slechts een brandslanglengte mag worden gebruikt, elk deel
      van het vaartuig dat gedurende de vaart onder normale bedrijfsomstandigheden toegankelijk is, kan worden bereikt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.19
  - number: 5.19.2.b
    text: |-
      Alle voorgeschreven brandkranen zijn voorzien van brandslangen die zijn uitgerust met straalpijpen die kunnen
      spuiten en sproeien zoals is vereist in het vijfde lid. Er is een brandkraan aangebracht bij de toegang van de
      ruimte die moet worden beveiligd.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.19
  - number: 5.19.3
    text: |-
      Hoofdbrandblusleidingen en brandkranen zijn vervaardigd van materialen die in voldoende mate hittebestendig zijn,
      tenzij deze voldoende zijn beschermd. Brandblusleidingen en brandkranen zijn zodanig geplaatst dat de brandslangen
      gemakkelijk daaraan kunnen worden gekoppeld. Aan boord van vaartuigen die lading aan dek kunnen vervoeren is
      de plaats van de brandkranen altijd gemakkelijk bereikbaar en de leidingen zijn, zoveel als praktisch mogelijk,
      zodanig aangelegd dat gevaar voor beschadiging door een dergelijke lading wordt vermeden. Tenzij bij elke
      brandkraan een bijbehorende brandslang met straalpijp aanwezig is kan elke brandslang op elke brandkraan en elke
      straalpijp op elke brandslang worden aangesloten.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.19
  - number: 5.19.4
    text: |-
      Elke aansluiting voor een brandslang is voorzien van een kraan of afsluiter waarmee een brandslang gemakkelijk en
      snel kan worden aan- of afgekoppeld terwijl de brandbluspompen in werking zijn.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.19
  - number: 5.19.5.a
    text: |-
      Straalpijpen hebben een standaard spuitopening met een diameter van 12, 16 of 19 mm, dan wel een doorlaat die hier
      nagenoeg mee overeenkomt. Het Hoofd van de Scheepvaartinspectie kan een grotere spuitopening toestaan.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.19
  - number: 5.19.5.b
    text: |-
      In ruimten voor accommodatie en dienstruimten behoeft de spuitopening van de straalpijpen niet groter te zijn dan
      12 mm.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.19
  - number: 5.19.5.c
    text: |-
      In ruimten voor machines en op open dekken is de diameter van de spuitopening van de straalpijpen zodanig dat met
      twee stralen water bij de druk, genoemd in [artikel 5.18, tweede lid, onderdeel b][ref1], met de kleinste pomp een
      zo groot mogelijke hoeveelheid water kan worden geleverd. Er behoeft echter geen straalpijp te worden gebruikt met
      een spuitopening waarvan de diameter meer dan 19 mm bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel5
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.19
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5.20.1
    text: |-
      Een brandblustoestel is van een goedgekeurd type. De inhoud van een voorgeschreven draagbaar brandblustoestel met
      vloeibare blusstof mag niet groter zijn dan 13,5 l en niet kleiner dan 9 l. Een brandblustoestel met een andere
      blusstof is ten minste even goed draagbaar als een toestel met vloeibare blusstof van 13,5 l en het blusvermogen
      is ten minste gelijkwaardig aan dat van een dergelijk toestel met een blusstof van 9 l. De gelijkwaardigheid van
      brandblustoestellen wordt bepaald door het Hoofd van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.20
  - number: 5.20.2
    text: Het aantal aan boord aanwezige reservevullingen is ten genoegen van het Hoofd van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.20
  - number: 5.20.3
    text: |-
      Brandblustoestellen die zijn gevuld met een blusstof die naar het oordeel van het Hoofd van de Scheepvaartinspectie
      hetzij uit zichzelf, hetzij onder te verwachten gebruiksomstandigheden zodanige hoeveelheden giftige gassen afgeeft
      dat dit schadelijk is voor de gezondheid, zijn aan boord niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.20
  - number: 5.20.4
    text: |-
      Brandblustoestellen worden periodiek nagezien en worden onderworpen aan de tests die door het Hoofd van de
      Scheepvaartinspectie zijn voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.20
  - number: 5.20.5
    text: |-
      In het algemeen is een van de draagbare brandblustoestellen die voor het gebruik in een bepaalde ruimte zijn
      bestemd, nabij de toegang tot die ruimte geplaatst.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.20
  - number: 5.21.1
    text: |-
      Ten genoegen van het Hoofd van de Scheepvaartinspectie zijn ten minste vijf goedgekeurde draagbare
      brandblustoestellen geplaatst in controlestations, ruimten voor accommodatie en dienstruimten.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.21
  - number: 5.21.2
    text: Het aantal aan boord aanwezige reservevullingen is ten genoegen van het Hoofd van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.21
  - number: 5.22.1.a
    text: |-
      Ten genoegen van het Hoofd van de Scheepvaartinspectie zijn ruimten waarin oliegestookte ketels of
      oliestookinrichtingen zijn opgesteld, voorzien van één van de volgende vast aangebrachte brandblusinstallaties:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.22
  - number: 5.22.1.a.1°
    text: een sproei-installatie voor water onder druk, of
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.22
  - number: 5.22.1.a.2°
    text: een installatie met verstikkend gas als blusstof, of
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.22
  - number: 5.22.1.a.3°
    text: een installatie met gas als blusstof verkregen uit een verdampende vloeistof met een lage giftigheidgraad, of
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.22
  - number: 5.22.1.a.4°
    text: een installatie voor schuim met een hoog verschuimingsgetal.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.22
  - number: 5.22.1.b
    text: |-
      Nieuwe brandblusinstallaties met halon 1211 en 1301 als blusstof zijn verboden op nieuwe en bestaande vaartuigen.
      Bij ministeriële regeling worden voorschriften gegeven met betrekking tot het testen van bestaande installaties.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.22
  - number: 5.22.1.c
    text: |-
      In ieder ketelruim is ten minste één speciaal draagbaar schuimbrandblustoestel aanwezig ten genoegen van het Hoofd
      van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.22
  - number: 5.22.1.d
    text: |-
      Ten minste twee goedgekeurde draagbare brandblustoestellen met schuim of een gelijkwaardige blusstof zijn
      aanwezig op elke stookplaats van elk ketelruim en in elke ruimte waarin een deel van de oliestookinrichting
      is ondergebracht. Ten minste een schuimbrandblustoestel met een inhoud van ten minste 135 l of een daaraan
      gelijkwaardig gesteld brandblustoestel is voorzien van op haspels aangebrachte slangen die lang genoeg zijn om
      elk deel van de ruimte te kunnen bereiken. Het Hoofd van de Scheepvaartinspectie kan, rekening houdend met de
      afmetingen en de aard van de ruimte die moet worden beschermd, vermindering toestaan van het vereiste in dit
      onderdeel.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.22
  - number: 5.22.1.e
    text: |-
      Op elke stookplaats is een bak met zand, met soda doordrenkt zaagsel of een ander goedgekeurd droog materiaal
      aanwezig in hoeveelheden die ten genoegen van het Hoofd van de Scheepvaartinspectie zijn. Een goedgekeurd draagbaar
      schuimbrandblustoestel of een gelijkwaardig brandblustoestel kan hiervoor in de plaats worden gesteld.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.22
  - number: 5.22.2
    text: |-
      Ruimten waarin verbrandingsmotoren of gasturbines zijn opgesteld die worden gebruikt hetzij als
      hoofdvoortstuwingswerktuigen, hetzij voor andere doeleinden waarbij deze werktuigen tezamen een totaal vermogen
      hebben van niet minder dan 750 kW, zijn voorzien van:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.22
  - number: 5.22.2.a
    text: één van de brandblusinstallaties als voorgeschreven in het eerste lid, onderdeel a,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.22
  - number: 5.22.2.b
    text: ten minste een speciaal draagbaar schuimbrandblustoestel ten genoegen van het Hoofd van de Scheepvaartinspectie, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.22
  - number: 5.22.2.c
    text: |-
      een voldoende aantal goedgekeurde schuimbrandblustoestellen met een inhoud van ten minste 45 l of daaraan
      gelijkwaardig gestelde brandblustoestellen om blusstof te kunnen richten op ieder deel van de brandstofsystemen,
      smeeroliedruksystemen, tandwielkasten en andere brandgevaarlijke plaatsen. Bovendien moet een voldoende aantal
      draagbare schuimbrandblustoestellen of daaraan gelijkwaardig gestelde brandblustoestellen aanwezig zijn, die zo
      zijn geplaatst dat geen enkel punt in de ruimte op een loopafstand van meer dan 10 m van een brandblustoestel is
      gelegen; er moeten echter in elke ruimte ten minste twee van deze brandblustoestellen aanwezig zijn. Voor kleinere
      ruimten kan het Hoofd van de Scheepvaartinspectie afwijking van deze eisen toestaan.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.22
  - number: 5.22.3
    text: |-
      Ruimten waarin stoomturbines of gesloten stoommachines zijn opgesteld, gebezigd hetzij als
      hoofdvoortstuwingswerktuigen, hetzij voor andere doeleinden waarbij deze werktuigen tezamen een totaal vermogen
      hebben van niet minder dan 750 kW, zijn voorzien van:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.22
  - number: 5.22.3.a
    text: |-
      een voldoende aantal schuimbrandblustoestellen met een inhoud van ten minste 45 l of daaraan gelijkwaardige
      brandblustoestellen, om blusstof te kunnen richten op ieder deel van het smeeroliedruksysteem, van de omkastingen
      van de onder druk gesmeerde delen van de turbines, machines of daarbij behorende tandwielkasten en andere
      brandgevaarlijke plaatsen. Deze brandblustoestellen zijn echter niet vereist indien in dergelijke ruimten een vast
      aangebrachte brandblusinstallatie aanwezig is als bedoeld in het eerste lid, onderdeel a, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.22
  - number: 5.22.3.b
    text: |-
      een voldoende aantal draagbare schuimbrandblustoestellen of daaraan gelijkwaardige brandblustoestellen die zo
      zijn geplaatst dat geen enkel punt in de ruimte op een loopafstand van meer dan 10 m van een brandblustoestel is
      gelegen; er moeten echter in elke ruimte ten minste twee van deze brandblustoestellen aanwezig zijn. Het bepaalde
      in dit onderdeel is niet van toepassing wanneer ingevolge het bepaalde in het tweede lid, onderdeel c, reeds
      brandblustoestellen zijn vereist.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.22
  - number: 5.22.4
    text: |-
      Indien er naar het oordeel van het Hoofd van de Scheepvaartinspectie brandgevaar aanwezig is in ruimten voor
      machines ten aanzien waarvan geen bepaalde voorschriften omtrent brandblusmiddelen zijn gegeven in het eerste,
      tweede en derde lid, zijn in of dicht bij deze ruimten een zodanig aantal brandblustoestellen of andere
      brandblusmiddelen opgesteld als door hem voldoende wordt geacht.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.22
  - number: 5.22.5
    text: |-
      Een vast aangebrachte brandblusinstallatie die niet in dit hoofdstuk wordt voorgeschreven, is ten genoegen van het
      Hoofd van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.22
  - number: 5.22.6
    text: |-
      Voor een ruimte voor machines van categorie A die op een laag niveau toegankelijk is vanuit een aangrenzende
      schroefastunnel, is, behalve een waterdichte deur aan de van deze ruimte voor machines afgekeerde zijde, een lichte
      stalen brandwerende deur aangebracht die aan beide zijden geopend kan worden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.22
  - number: 5.22.7
    text: |-
      Ten aanzien van Nederlandse vissersvaartuigen geldt dat alle machineruimten van categorie A zijn uitgerust met een
      vast aangebrachte brandblusinrichting.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.22
  - number: 5.23.1
    text: Er is ten minste een internationale walaansluiting aanwezig die voldoet aan het bepaalde in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.23
  - number: 5.23.2
    text: |-
      De standaardafmetingen van flenzen voor de internationale walaansluiting komen overeen met de onderstaande tabel:






                    Beschrijving


                    Afmeting






                    Uitwendige flensdiameter


                    178 mm




                    Inwendige flensdiameter


                    64 mm




                    Diameter van de steekcirkel der bouten


                    132 mm




                    Boutgaten


                    4 gaten van 19 mm diameter, aangebracht op onderling gelijke afstanden op de bovenstaande steekcirkel
      van de bouten, met sleuven radiaal doorgetrokken tot de omtrek




                    Flensdikte


                    ten minste 14,5 mm




                    Bouten en moeren


                    4, elk met een diameter van 16 mm en een lengte van 50 mm
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.23
  - number: 5.23.3
    text: De internationale walaansluiting is vervaardigd van materiaal, geschikt voor een werkdruk van 1,0 N/mm2.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.23
  - number: 5.23.4
    text: |-
      De flens is aan één zijde vlak. Op de andere zijde is een koppeling, passend op de brandkranen en brandslangen van
      het vaartuig, permanent aangebracht. De internationale walaansluiting wordt aan boord van het vaartuig bewaard,
      tezamen met een flenspakking geschikt voor een werkdruk van 1,0 N/mm2, alsmede met vier bouten met een diameter van
      16 mm en een lengte van 50 mm en acht sluitringen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.23
  - number: 5.23.5
    text: |-
      Er zijn voorzieningen aangebracht om een dergelijke aansluiting aan beide zijden van het vaartuig te kunnen
      gebruiken.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.23
  - number: 5.24.1
    text: |-
      Elk vaartuig is uitgerust met ten minste twee brandweeruitrustingen die ten genoegen van het Hoofd van de
      Scheepvaartinspectie zijn.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.24
  - number: 5.24.2
    text: |-
      De brandweeruitrustingen zijn zo opgeborgen, dat zij gemakkelijk bereikbaar en gereed voor gebruik zijn. Zij worden
      op ver uiteen liggende plaatsen bewaard.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.24
  - number: '5.25'
    text: |-
      Ter instructie van de bemanning wordt een brandbeveiligingsplan permanent opgehangen op daarvoor in aanmerking
      komende plaatsen. De uitvoering van dit plan is ten genoegen van het Hoofd van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.25
  - number: '5.26'
    text: Brandbestrijdingsmiddelen worden goed onderhouden en zijn te allen tijde voor onmiddellijk gebruik gereed.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.26
  - number: '5.27'
    text: |-
      Waar in deze paragraaf een speciaal toestel, apparaat, speciale blusstof of inrichting van een bepaalde aard is
      voorgeschreven kan, indien naar het oordeel van het Hoofd van de Scheepvaartinspectie een en ander niet minder
      effectief is, elk ander toestel, apparaat, andere blusstof of inrichting daarvoor in de plaats worden gesteld.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.27
  - number: 5.27a
    text: |-
      De bepalingen van deze paragraaf zijn van toepassing op vaartuigen waarvan de lengte 45 meter of meer bedraagt,
      maar minder dan 60 meter, alsmede op alle vaartuigen met een lengte van 24 meter of meer, maar minder dan 60 meter
      die dienstdoen in Nederlandse wateren of die hun vangst aan land brengen in een Nederlandse haven.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.27a
  - number: 5.28.1
    text: |-
      De romp, de bovenbouw, structurele schotten, dekken en dekhuizen zijn van onbrandbare materialen vervaardigd. Het
      Hoofd van de Scheepvaartinspectie kan een brandbare constructie toestaan mits wordt voldaan aan de van toepassing
      zijnde bepalingen van dit artikel en aan de aanvullende bepalingen van artikel 5.40, derde lid.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.28
  - number: 5.28.2.a
    text: |-
      Op vaartuigen waarvan de romp is vervaardigd van onbrandbare materialen, zijn dekken en schotten die ruimten
      voor machines van categorie A scheiden van ruimten voor accommodatie, dienstruimten en controlestations,
      van klasse« A-60» wanneer de ruimte voor machines van categorie A niet is voorzien van een vast aangebrachte
      brandblusinstallatie, en van klasse «A-30» wanneer een dergelijke installatie wel is aangebracht. Dekken
      en schotten die andere ruimten voor machines scheiden van ruimten voor accommodatie, dienstruimten en
      controlestations, zijn van klasse «A-0». Dekken en schotten die controlestations scheiden van ruimten voor
      accommodatie en dienstruimten zijn van klasse «A» en zijn geïsoleerd ten genoegen van het Hoofd van de
      Scheepvaartinspectie. Het Hoofd van de Scheepvaartinspectie kan het aanbrengen van wanden van klasse «B-15»
      toestaan voor de scheiding van ruimten zoals de hut van de schipper en de brug.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.28
  - number: 5.28.2.b
    text: |-
      Op vaartuigen waarvan de romp is vervaardigd van brandbare materialen, zijn dekken en schotten, die ruimten voor
      machines scheiden van ruimten voor accommodatie, dienstruimten en controlestations van klasse «F» of klasse «B-
      15». Bovendien verhinderen dekken en schotten die ruimten voor machines omgeven, zoveel als praktisch mogelijk
      is de doortocht van rook. Dekken en schotten die controlestations scheiden van ruimten voor accommodatie en
      dienstruimten, zijn van klasse «F».
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.28
  - number: 5.28.3.a
    text: |-
      Op vaartuigen waarvan de romp is vervaardigd van onbrandbare materialen, zijn schotten van gangen in ruimten voor
      accommodatie, dienstruimten en controlestations van klasse «B-15».
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.28
  - number: 5.28.3.b
    text: |-
      Op vaartuigen waarvan de romp is vervaardigd van brandbare materialen, zijn schotten van gangen in ruimten voor
      accommodatie, dienstruimten en controlestations van klasse «F».
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.28
  - number: 5.28.3.c
    text: |-
      Schotten van gangen als vereist in onderdeel a of b zijn opgetrokken van dek tot dek, tenzij aan beide zijden van
      het schot doorlopende plafonds met dezelfde brandwerendheid als van de gangschotten zijn aangebracht, in welk geval
      het schot mag eindigen tegen het doorlopende plafond.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.28
  - number: 5.28.4
    text: |-
      Binnentrappen in ruimten voor accommodatie, dienstruimten en controlestations zijn van staal of ander,
      gelijkwaardig materiaal. Op vaartuigen waarvan de romp is vervaardigd van brandbare materialen zijn dergelijke
      binnentrappen ondergebracht in ruimten die zijn omgeven door schotten van klasse «F». Op vaartuigen waarvan de romp
      is vervaardigd van onbrandbare materialen zijn dergelijke binnentrappen ondergebracht in ruimten die zijn omgeven
      door schotten van klasse «B-15». Indien evenwel een dergelijke binnentrap slechts twee dekken verbindt, behoeft
      deze slechts op een dek door schotten te zijn omsloten.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.28
  - number: 5.28.5
    text: |-
      Deuren en andere afsluitmiddelen in schotten en dekken als bedoeld in het tweede en derde lid, deuren welke zijn
      aangebracht in schotten die trappen omsluiten als bedoeld in het vierde lid en deuren welke zijn aangebracht
      in schachtwanden van machinekamers en ketelruimen, bezitten voorzover als praktisch mogelijk is ten minste een
      gelijkwaardige brandwerendheid als de schotten en dekken waarin zij zijn aangebracht. Deuren die toegang geven tot
      ruimten voor machines van categorie A zijn zelfsluitend.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.28
  - number: 5.28.6
    text: |-
      Liftschachten welke door ruimten voor accommodatie en dienstruimten gaan, zijn van staal of van een ander,
      gelijkwaardig materiaal vervaardigd en zijn voorzien van afsluitmiddelen waarmee de trek en de rookverspreiding
      onder controle kunnen worden gehouden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.28
  - number: 5.28.7.a
    text: |-
      Op vaartuigen waarvan de romp is vervaardigd van brandbare materialen zijn de begrenzingsschotten en dekken van
      ruimten waarin de noodkrachtbron is opgesteld en schotten en dekken tussen kombuizen, verfhutten, lampenhutten
      of bergplaatsen waarin zich belangrijke hoeveelheden licht ontvlambaar materiaal bevinden en ruimten voor
      accommodatie, dienstruimten en controlestations van klasse «F» of klasse «B-15».
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.28
  - number: 5.28.7.b
    text: |-
      Op vaartuigen waarvan de romp is vervaardigd van onbrandbare materialen zijn de schotten en dekken, bedoeld onder
      a, van klasse «A» en zijn deze ten genoegen van het Hoofd van de Scheepvaartinspectie geïsoleerd, rekening houdend
      met het brandgevaar. Het Hoofd van de Scheepvaartinspectie kan tussen een kombuis en ruimten voor accommodatie,
      dienstruimten en controlestations klasse «B-15» toestaan wanneer in de kombuis slechts elektrische fornuizen,
      elektrische warmwaterbereiders en andere elektrisch verwarmde apparaten zijn opgesteld.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.28
  - number: 5.28.7.c
    text: Licht ontvlambare producten worden in daarvoor geschikte gesloten vaten opgeslagen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.28
  - number: 5.28.8
    text: |-
      Wanneer schotten en dekken die ingevolge het bepaalde in het tweede, derde, vijfde of zevende lid van klasse «A»,
      klasse «B» of klasse «F» zijn, worden doorboord voor het doorlaten van elektrische leidingen, pijpen, schachten,
      kokers en dergelijke, worden zodanige maatregelen getroffen dat de brandwerendheid van de schotten en dekken niet
      vermindert.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.28
  - number: 5.28.9
    text: |-
      Luchtruimten ingesloten achter wanden en beschietingen tussen plafonds en dekken in de ruimten voor accommodatie,
      dienstruimten en controlestations, zijn onderverdeeld door afstoppingen welke de trek tegengaan en die niet verder
      dan 7 m uiteen liggen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.28
  - number: 5.28.10
    text: 'Voor ruimten voor machines gelden ten aanzien van ramen en schijnlichten de volgende voorschriften:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.28
  - number: 5.28.10.a
    text: |-
      schijnlichten die kunnen worden geopend, kunnen van buiten de ruimte waarop zij zijn aangebracht worden gesloten.
      Schijnlichten waarin ramen zijn aangebracht zijn aan de buitenzijde voorzien van blinden van staal of ander
      gelijkwaardig materiaal en zijn vast aan het schijnlicht verbonden,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.28
  - number: 5.28.10.b
    text: |-
      glas of soortgelijk materiaal mag niet in begrenzingsschotten van ruimten voor machines zijn aangebracht. Dit
      sluit het gebruik van draadglas in schijnlichten en glas in controlekamers die geheel in ruimten voor machines zijn
      gelegen niet uit, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.28
  - number: 5.28.10.c
    text: schijnlichten als bedoeld onder a zijn voorzien van draadglas.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.28
  - number: 5.28.11
    text: |-
      Isolatiematerialen in ruimten voor accommodatie, dienstruimten met uitzondering van proviand-, koel- en
      vrieskamers, in controlestations en in ruimten voor machines, zijn onbrandbaar. Het oppervlak van isolatiemateriaal
      dat is aangebracht aan de binnenzijde van begrenzingsschotten en -dekken van ruimten voor machines van categorie A,
      is ondoordringbaar voor olie of oliedampen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.28
  - number: 5.28.12
    text: Brandbare isolatie in visruimen is door een goed afsluitende bekleding beschermd.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.28
  - number: 5.28.13
    text: |-
      Onverminderd het bepaalde in dit artikel kan het Hoofd van de Scheepvaartinspectie toestaan dat klasse «A-0» wordt
      toegepast in plaats van klasse« B-15» of klasse «F», rekening houdend met de hoeveelheid brandbare materialen die
      gebruikt zijn in aangrenzende ruimten.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.28
  - number: 5.29.1
    text: |-
      Met uitzondering van het bepaalde in [artikel 5.30, tweede lid][ref1], zijn er middelen aanwezig voor het
      stopzetten van ventilatoren en het sluiten van hoofdin- en uitlaten van ventilatiesystemen van buiten de ruimten
      die worden geventileerd.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel5
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.29
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: 5.29.2
    text: Er zijn middelen aanwezig om de ringvormige ruimten rond schoorstenen vanaf een veilige plaats te kunnen sluiten.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.29
  - number: 5.29.3
    text: |-
      Ventilatieopeningen zijn toegestaan in en onder deuren in schotten van gangen, met dien verstande dat dergelijke
      openingen niet mogen zijn aangebracht in en onder deuren van trapomsluitingen. De openingen in deuren mogen alleen
      in de onderste helft van de deur zijn aangebracht. Indien een dergelijke opening zich bevindt in of onder een
      deur, mag de totale oppervlakte van deze opening of openingen niet meer bedragen dat 0,05 m2. Indien een dergelijke
      opening in een deur is aangebracht, is deze voorzien van een rooster van onbrandbaar materiaal.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.29
  - number: 5.29.4
    text: |-
      Ventilatiekanalen voor ruimten voor machines van categorie A of voor kombuizen mogen over het algemeen niet door
      ruimten voor accommodatie, dienstruimten of controlestations lopen. Het Hoofd van de Scheepvaartinspectie kan
      evenwel toestaan dat deze ventilatiekanalen door de bovengenoemde ruimten lopen, mits zij zijn vervaardigd van
      staal of ander, gelijkwaardig materiaal en zodanig zijn uitgevoerd dat de brandwerendheid van schotten en dekken
      niet vermindert.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.29
  - number: 5.29.5
    text: |-
      Ventilatiekanalen voor ruimten voor accommodatie, dienstruimten of controlestations mogen over het algemeen niet
      door ruimten voor machines van categorie A of door kombuizen lopen. Het Hoofd van de Scheepvaartinspectie kan
      evenwel toestaan dat deze ventilatiekanalen door de bovengenoemde ruimten lopen, mits zij zijn vervaardigd van
      staal of ander, gelijkwaardig materiaal en zodanig zijn uitgevoerd dat de brandwerendheid van schotten en dekken
      niet vermindert.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.29
  - number: 5.29.6
    text: |-
      Bergplaatsen waarin zich aanzienlijke hoeveelheden gemakkelijk ontvlambare stoffen bevinden, zijn voorzien van
      ventilatie-inrichtingen die zijn gescheiden van andere ventilatiesystemen. De ventilatie vindt plaats op hoog en op
      laag niveau in de ruimte en de in- en uitlaten van de ventilatoren zijn op een veilige plaats aangebracht en zijn
      voorzien van vlamkerende inrichtingen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.29
  - number: 5.29.7
    text: Ventilatiesystemen die ruimten voor machines bedienen, zijn onafhankelijk van systemen die andere ruimten bedienen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.29
  - number: 5.29.8
    text: |-
      Indien ventilatieschachten of -kanalen ruimten aan weerszijden van schotten en dekken van klasse «A» bedienen,
      zijn er kleppen aangebracht ter voorkoming van verspreiding van vuur en rook van de ene ruimte naar de
      andere. Met de hand bedienbare kleppen kunnen aan beide zijden van het schot of het dek geopend en gesloten
      worden. Indien de schachten of kanalen met een oppervlakte van de dwarsdoorsnede van meer dan 0,02 m2 lopen
      door schotten en dekken van klasse «A», zijn er automatisch sluitende kleppen aangebracht. Schachten die
      ruimten bedienen die slechts aan één zijde van dergelijke schotten zijn gelegen, voldoen aan het bepaalde in
      [artikel 5.9, eerste lid, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel5
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.29
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5.30.1
    text: |-
      Elektrische kachels zijn vast opgesteld en zijn zo ingericht dat het brandgevaar tot een minimum is beperkt.
      Deze toestellen mogen niet zijn voorzien van een verwarmingselement dat kleding, gordijnen of andere soortgelijke
      materialen in de directe omgeving kan verschroeien of vlam vatten door de hitte die het element uitstraalt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.30
  - number: 5.30.2
    text: |-
      Verwarming door middel van open vuur is niet toegestaan. Kachels en andere soortgelijke apparaten zijn deugdelijk
      bevestigd en zij zijn onder, rondom en ter hoogte van de schoorsteenoploop voorzien van voldoende bescherming en
      isolatie tegen brand. Schoorsteenoplopen van kachels die vaste brandstof verstoken zijn zo ingericht en ontworpen
      dat de kans op verstopt raken door verbrandingsproducten tot een minimum wordt beperkt en zijn uitgerust met een
      toegankelijke voorziening om schoon te maken. Kleppen om de schoorsteentrek te regelen hebben bij de gesloten
      stand nog enige doorlaat. Ruimten waarin kachels zijn geplaatst zijn voorzien van ventilatoren met voldoende
      doortocht om te kunnen voorzien in voldoende verbrandingslucht voor de kachel. Dergelijke ventilatoren mogen niet
      zijn uitgerust met een afsluitinrichting en hun opstelling is zodanig dat geen afsluitinrichtingen als bedoeld in
      [artikel 2.9][ref1] vereist zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel2
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.30
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '2'
        hoofdstuk: '2'
  - number: 5.30.3
    text: |-
      Toestellen met een open gasvlam, met uitzondering van fornuizen en warmwatertoestellen, zijn niet toegestaan.
      Ruimten waarin dergelijke fornuizen en warmwatertoestellen zijn geplaatst, zijn voorzien van voldoende ventilatie
      om dampen en mogelijke gaslekkage naar een veilige plaats af te voeren. Alle leidingen waardoor het gas vanaf het
      drukvat naar de kachel of waterverwarmer wordt geleid zijn van staal of een ander goedgekeurd materiaal. Er zijn
      automatische veiligheidsinrichtingen voor het afsluiten van de gastoevoer aangebracht die in werking treden bij
      drukverlies in de hoofdgasleiding of in het geval van vlamstoring bij elk toestel.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.30
  - number: 5.31.1
    text: |-
      Blootgestelde oppervlakken in ruimten voor accommodatie, dienstruimten, controlestations, gangen en ingesloten
      ruimten voor trappen, alsmede oppervlakken verborgen achter schotten, beschietingen en plafonds in bovengenoemde
      ruimten, hebben een laag vlamverspreidend vermogen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.31
  - number: 5.31.2
    text: |-
      Alle blootgestelde oppervlakken van met glas gewapende kunststof constructies binnen ruimten voor accommodatie,
      dienstruimten, controlestations, ruimten voor machines van categorie A en andere ruimten voor machines met
      eenzelfde brandgevaar, zijn voorzien van een afwerkingslaag van goedgekeurde hars die blijvende brandvertragende
      eigenschappen heeft of zijn bedekt met een goedgekeurde brandvertragende verf of zijn beschermd door onbrandbare
      materialen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.31
  - number: 5.31.3
    text: |-
      Verven, vernissen en andere stoffen voor afwerking, gebruikt op blootgestelde inwendige oppervlakken, zijn zodanig
      dat zij naar het oordeel van het Hoofd van de Scheepvaartinspectie geen onnodig brandgevaar opleveren en mogen geen
      overmatige hoeveelheden rook of giftige gassen of dampen kunnen voortbrengen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.31
  - number: 5.31.4
    text: |-
      De onderste laag van dekbedekkingen in ruimten voor accommodatie, dienstruimten en controlestations is van
      goedgekeurd materiaal dat noch gemakkelijk kan ontbranden, noch aanleiding kan geven tot vergiftigings- of
      explosiegevaar bij verhoogde temperaturen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.31
  - number: 5.31.5.a
    text: |-
      In ruimten voor accommodatie, dienstruimten en controlestations zijn pijpen die door schotten of dekken van klasse
      «A» of «B» zijn gevoerd, van goedgekeurde materialen vervaardigd, rekening houdend met de temperatuur waaraan de
      betrokken schotten of dekken weerstand moeten kunnen bieden. Indien het Hoofd van de Scheepvaartinspectie toestaat
      dat door ruimten voor accommodatie en dienstruimten olie of brandbare vloeistoffen worden gevoerd, zijn de pijpen
      waardoor die olie of brandbare vloeistoffen worden gevoerd van goedgekeurd materiaal vervaardigd, rekening houdende
      met het brandgevaar.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.31
  - number: 5.31.5.b
    text: |-
      Materialen die gemakkelijk onbruikbaar worden door warmte, mogen niet worden gebruikt voor spuipijpen, sanitaire
      uitlaten en andere uitlaten, die dicht bij de lastlijn liggen en waarvan smelten, in geval van brand, gevaar voor
      instromen van water zou meebrengen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.31
  - number: 5.31.6
    text: |-
      Alle andere afvalbakken dan die, welke worden gebruikt bij de verwerking van vis, zijn vervaardigd van onbrandbare
      materialen en hebben geen openingen in de zijkanten of bodem.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.31
  - number: 5.31.7
    text: |-
      Werktuigen voor de aandrijving van brandstoftrimpompen, pompen van oliestookinrichtingen en dergelijke
      brandstofpompen zijn voorzien van afstandsbedieningen die zijn aangebracht buiten de desbetreffende ruimten zodat
      bedoelde werktuigen kunnen worden stopgezet bij het uitbreken van brand in de ruimte waarin zij zijn opgesteld.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.31
  - number: 5.31.8
    text: Waar nodig zijn lekbakken aangebracht teneinde te voorkomen dat olie naar de vullings kan vloeien.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.31
  - number: 5.32.1
    text: |-
      Flessen die zijn bestemd voor samengeperste, vloeibaar gemaakte of onder druk opgeloste gassen zijn duidelijk
      gemarkeerd door middel van voorgeschreven kleuren ter identificatie en zijn voorzien van een duidelijk leesbare
      identificatie van de naam en chemische formule van hun inhoud. Dergelijke flessen zijn deugdelijk vastgezet.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.32
  - number: 5.32.2
    text: |-
      Flessen die ontvlambare of andere gevaarlijke gassen bevatten alsmede flessen die als zodanig in gebruik zijn
      geweest zijn deugdelijk vastgezet en opgesteld op het open dek en alle afsluiters, drukregelaars en op de flessen
      aangesloten leidingen zijn tegen beschadiging beschermd. De flessen zijn beschermd tegen grote veranderingen in
      temperatuur, direct zonlicht en opeenhoping van sneeuw. Het Hoofd van de Scheepvaartinspectie kan echter toestaan
      dat dergelijke flessen zijn opgeslagen in ruimten die voldoen aan de eisen van het derde tot en met vijfde lid.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.32
  - number: 5.32.3
    text: |-
      Ruimten waarin gemakkelijk ontvlambare vloeistoffen, zoals vluchtige verfstoffen, paraffine, benzol en dergelijke,
      en indien toegestaan vloeibaar gas zijn opgeslagen, mogen uitsluitend toegankelijk zijn vanaf het open dek.
      Drukregeltoestellen en ontlastingskleppen monden binnen deze ruimten uit. Wanneer begrenzingsschotten van
      dergelijke ruimten grenzen aan andere omsloten ruimten, zijn deze schotten gasdicht uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.32
  - number: 5.32.4
    text: |-
      Elektrische leidingen en aansluitingen zijn niet toegestaan binnen ruimten welke worden gebruikt voor het bergen
      van gemakkelijk ontvlambare vloeistoffen en vloeibaar gemaakte gassen, tenzij nodig voor het verrichten van
      werkzaamheden binnen die ruimten. In dat geval zijn de elektrische aansluitingen ten genoegen van het Hoofd van de
      Scheepvaartinspectie geschikt voor gebruik in een ontvlambare atmosfeer. Warmtebronnen mogen zich niet dicht bij
      dergelijke ruimten bevinden en opschriften met «niet roken» en «geen open vuur» zijn aangebracht op een doelmatige
      plaats.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.32
  - number: 5.32.5
    text: |-
      Elk soort samengeperst gas is afzonderlijk opgeslagen. Ruimten die voor opslag van dergelijke gassen worden
      gebruikt, mogen niet worden gebruikt voor het opslaan van brandbare producten, noch voor gereedschappen of
      onderdelen die geen deel uitmaken van het gasdistributiesysteem. Het Hoofd van de Scheepvaartinspectie kan echter
      met inachtneming van de kenmerkende eigenschappen, hoeveelheid en voorgenomen gebruik van dergelijke samengeperste
      gassen, verlichting van deze voorschriften toestaan, rekening houdend met de eigenschappen en de hoeveelheid van
      zodanige samengeperste gassen en het gebruik waarvoor deze bestemd zijn.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.32
  - number: 5.33.1
    text: |-
      In en vanuit alle ruimten voor accommodatie en ruimten waarin door de bemanning onder normale omstandigheden
      dienst wordt gedaan, andere dan ruimten voor machines, zijn trappen en ladders aangebracht waarlangs het open dek
      en vervolgens de groepsreddingsmiddelen gemakkelijk kunnen worden bereikt. In het bijzonder wordt aan de volgende
      bepalingen voldaan:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.33
  - number: 5.33.1.a
    text: |-
      op elk dek waarop zich ruimten voor accommodatie bevinden, zijn ten minste twee, zo ver mogelijk van elkaar
      verwijderde voorzieningen voor ontsnapping aangebracht. De normale voorzieningen voor toegang tot elke besloten
      ruimte of groep van ruimten mogen hieronder worden begrepen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.33
  - number: 5.33.1.b.1°
    text: |-
      onder het blootgestelde dek bestaat de hoofdvoorziening voor ontsnapping uit een trap, terwijl de tweede
      voorziening voor ontsnapping mag bestaan uit een schacht of trap, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.33
  - number: 5.33.1.b.2°
    text: |-
      boven het blootgestelde dek bestaan de voorzieningen voor ontsnapping uit trappen of deuren naar een open dek, dan
      wel uit een combinatie van beide. Indien het uit praktische overwegingen niet mogelijk is om trappen of deuren aan
      te brengen, mag één van de voorzieningen voor ontsnapping bestaan uit een luik, dat zo nodig beschermd is tegen
      ijsafzetting;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.33
  - number: 5.33.1.c
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan bij wijze van uitzondering toestaan dat slechts één voorziening voor
      ontsnapping is aangebracht indien de aard en de plaats van de ruimten en het aantal van de personen die in normale
      omstandigheden daarin verblijven of dienst doen, daartoe aanleiding geven;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.33
  - number: 5.33.1.d
    text: |-
      een doodlopende gang of een doodlopend gedeelte van een gang is bij voorkeur niet langer dan 2,5 m en in geen geval
      langer dan 5,0 m;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.33
  - number: 5.33.1.e
    text: |-
      de afmetingen van en de wijze waarop de voorzieningen voor ontsnapping zijn uitgevoerd, zijn ten genoegen van het
      Hoofd van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.33
  - number: 5.33.2
    text: |-
      In elke ruimte voor machines van categorie A zijn twee voorzieningen voor ontsnapping aangebracht die zo ver
      mogelijk van elkaar zijn verwijderd. Verticale vluchtmiddelen bestaan uit stalen trappen of ladders. Indien
      de afmetingen van de ruimten voor machines daartoe aanleiding geven, kan het Hoofd van de Scheepvaartinspectie
      toestaan dat slechts een voorziening voor ontsnapping is aangebracht. In een dergelijk geval is bijzondere aandacht
      geschonken aan deze uitgang.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.33
  - number: 5.33.3
    text: Liften worden niet beschouwd als een van de vereiste voorzieningen voor ontsnapping.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.33
  - number: 5.33.4
    text: |-
      Voorzieningen voor ontsnapping zijn op de juiste plaats voorzien van signaleringen die voldoen aan bij ministeriële
      regeling te stellen nadere regels.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.33
  - number: '5.34'
    text: |-
      Op vissersvaartuigen waar het Hoofd van de Scheepvaartinspectie op grond van het bepaalde in
      [artikel 5.28, eerste lid][ref1], een brandbare constructie heeft toegestaan of waar anders aanzienlijke
      hoeveelheden brandbaar materiaal worden gebruikt bij de constructie van ruimten voor accommodatie, dienstruimten
      en controlestations wordt speciale aandacht geschonken aan het installeren van een automatische brandalarm- en
      brandontdekkingsinstallatie in die ruimten, waarbij rekening wordt gehouden met de afmeting van die ruimten, hun
      inrichting en plaatsing betrekking hebbend op controlestations alsmede, indien van toepassing, het vlamspreidend
      vermogen van het geplaatste meubilair.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel5
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.34
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: 5.35.1
    text: 'Het minimum aantal en type brandbluspompen dat aan boord van een vaartuig is aangebracht, is als volgt:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.35
  - number: 5.35.1.a
    text: één werktuiglijke pomp die voor de aandrijving niet afhankelijk is van het hoofdwerktuig of
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.35
  - number: 5.35.1.b
    text: |-
      één werktuiglijke pomp die door het hoofdwerktuig wordt aangedreven, onder voorwaarde dat de schroefas is voorzien
      van een uitschakelbare koppeling, of van een verstelbare schroef.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.35
  - number: 5.35.2
    text: |-
      Sanitair-, ballast-, lens-, algemene dienstpompen of andere pompen mogen als brandbluspompen worden gebruikt indien
      zij voldoen aan het gestelde in dit hoofdstuk en, bij gebruik van deze pompen als brandbluspomp, de lenscapaciteit
      van het vaartuig hierdoor niet wordt beïnvloed. Brandbluspompen zijn zo aangesloten dat het niet mogelijk is
      hiermee olie of andere brandbare vloeistoffen te verpompen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.35
  - number: 5.35.3
    text: |-
      Bij centrifugaalpompen of andere op de brandblusleiding aangesloten pompen waarbij het mogelijk is dat het water
      door de pomp kan terugstromen, is in de persleiding een terugslagklep aangebracht.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.35
  - number: 5.35.4
    text: |-
      Vissersvaartuigen die niet zijn uitgerust met een werktuiglijk bediende noodbrandbluspomp en zonder een
      vast aangebrachte brandblusinstallatie in de ruimten voor machines zijn ten genoegen van het Hoofd van de
      Scheepvaartinspectie voorzien van aanvullende brandblusmiddelen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.35
  - number: 5.35.5
    text: |-
      Werktuiglijk bediende noodbrandbluspompen, indien aangebracht, zijn onafhankelijk gedreven, op zich zelf staande
      pompen die zijn uitgerust met een eigen aandrijfwerktuig en brandstoftoevoer en die zijn opgesteld op een
      toegankelijke plaats buiten de ruimte waarin de hoofdbrandbluspompen zijn ondergebracht of worden aangedreven
      door een op zich zelf staande generator, die de noodgenerator mag zijn, die van voldoende capaciteit is en op een
      veilige plaats buiten de machinekamer is opgesteld, bij voorkeur boven het werkdek.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.35
  - number: 5.35.6
    text: |-
      Voor elke noodbrandbluspomp, indien aangebracht, kunnen de pomp, zee-inlaatafsluiters en andere noodzakelijke
      afsluiters worden bediend vanaf een plaats die is gelegen buiten de ruimten waarin de hoofdbrandbluspompen zijn
      ondergebracht. Deze plaats is zodanig dat het niet waarschijnlijk is dat zij in geval van brand in de bedoelde
      ruimten onbereikbaar wordt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.35
  - number: 5.35.7
    text: |-
      De totale capaciteit (Q) van de werktuiglijk bediende hoofdbrandbluspompen is ten minste gelijk aan: Q = [0,15
      √{L(B+D)} + 2,25]2 m2 per uur, waarbij L, B en D in meters zijn uitgedrukt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.35
  - number: 5.35.8
    text: |-
      Indien twee onafhankelijk werktuiglijk bediende brandbluspompen zijn aangebracht, mag de capaciteit van elke pomp
      niet minder zijn dan 40 percent van de vereiste capaciteit volgens het bepaalde in het zevende lid of 25m2 per uur,
      waarbij voor Nederlandse vissersvaartuigen de hoogste waarde bepalend is.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.35
  - number: 5.35.9
    text: |-
      Wanneer hoofdbrandbluspompen de volgens de in het zevende lid vereiste opbrengst leveren aan de
      hoofdbrandblusleiding, brandslangen en straalpijpen mag de druk bij elke brandkraan niet minder zijn dan 0,25 N/
      mm2.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.35
  - number: 5.35.10
    text: |-
      Indien werktuiglijk aangedreven noodbrandbluspompen de maximum opbrengst leveren met de straal water volgens het
      bepaalde in [artikel 5.37, eerste lid][ref1], is de druk bij elke brandkraan ten genoegen van het Hoofd van de
      Scheepvaartinspectie.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel5
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.35
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: 5.36.1
    text: |-
      Indien meer dan één brandkraan is vereist om te voorzien in het aantal stralen water zoals bepaald in
      [artikel 5.37, eerste lid][ref1], is er een hoofdbrandblusleiding aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel5
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.36
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: 5.36.2
    text: |-
      Hoofdbrandblusleidingen en brandkranen zijn vervaardigd van materialen die in voldoende mate hittebestendig zijn,
      tenzij deze voldoende zijn beschermd.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.36
  - number: 5.36.3
    text: |-
      Indien de persdruk van de brandbluspomp de werkdruk waarvoor de hoofdbrandblusleiding is ontworpen, kan
      overschrijden, zijn er ontlastkleppen aangebracht.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.36
  - number: 5.36.4
    text: |-
      Hoofdbrandblusleidingen mogen geen andere aansluitingen hebben dan die welke voor de brandbestrijding zijn vereist,
      met uitzondering van aansluitingen die zijn aangebracht om het dek en de ankerkettingen schoon te spuiten of de
      ejector van de kettingbak te bedienen, onder voorwaarde dat de doelmatigheid van het brandblussysteem gehandhaafd
      blijft.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.36
  - number: 5.36.5
    text: |-
      In hoofdbrandblusleidingen zijn op doelmatige plaatsen aftapkranen aangebracht om beschadiging door bevriezing
      te voorkomen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.36
  - number: 5.37.1
    text: |-
      Brandkranen zijn zodanig geplaatst dat brandslangen gemakkelijk en snel kunnen worden aan- of afgekoppeld en elk
      deel van het vaartuig dat onder normale bedrijfsomstandigheden toegankelijk is met ten minste één straal water kan
      worden bereikt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.37
  - number: 5.37.2
    text: Voor de in het eerste lid genoemde waterstraal mag slechts één brandslanglengte worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.37
  - number: 5.37.3
    text: |-
      In aanvulling op het bepaalde in het eerste lid is buiten ruimten voor machines van categorie A nabij de toegang
      ten minste één brandkraan met slang en straalpijp aangebracht voor gebruik in genoemde ruimte. De straalpijp is van
      het type dat kan spuiten en sproeien.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.37
  - number: 5.37.4
    text: Bij elke voorgeschreven brandkraan is één brandslang aanwezig. Bovendien is er een reserve brandslang aanwezig.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.37
  - number: 5.37.5
    text: Een enkele brandslanglengte mag niet meer dan 20 m bedragen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.37
  - number: 5.37.6
    text: |-
      Brandslangen zijn vervaardigd van goedgekeurd materiaal. Elke brandslang is voorzien van de nodige koppelingen en
      een straalpijp die kan spuiten en sproeien.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.37
  - number: 5.37.7
    text: |-
      Met uitzondering van brandslangen die permanent zijn aangesloten op de hoofdbrandblusleiding kan elke brandslang op
      elke brandkraan en elke straalpijp op elke brandslang worden aangesloten.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.37
  - number: 5.37.8
    text: |-
      De straalpijpen, voorgeschreven in het zesde lid, zijn aangepast aan de totale opbrengst van de geïnstalleerde
      brandbluspompen. De spuitopening heeft evenwel een inwendige diameter van niet minder dan 12 mm.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.37
  - number: 5.38.1
    text: |-
      Een brandblustoestel is van een goedgekeurd type. De inhoud van een voorgeschreven draagbaar brandblustoestel met
      vloeibare blusstof mag niet groter zijn dan 13,5 l en niet kleiner dan 9 l. Een brandblustoestel met een andere
      blusstof is ten minste even goed draagbaar als een toestel met vloeibare blusstof van 13,5 l en het blusvermogen
      is ten minste gelijkwaardig aan dat van een dergelijk toestel met een blusstof van 9 l. De gelijkwaardigheid van
      brandblustoestellen wordt bepaald door het Hoofd van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.38
  - number: 5.38.2
    text: Het aantal aan boord aanwezige reservevullingen is ten genoegen van het Hoofd van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.38
  - number: 5.38.3
    text: |-
      Brandblustoestellen, gevuld met een blusstof die naar het oordeel van het Hoofd van de Scheepvaartinspectie hetzij
      uit zichzelf, hetzij onder te verwachten gebruiksomstandigheden zodanige hoeveelheden giftige gassen afgeeft dat
      dit schadelijk is voor de gezondheid, zijn aan boord niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.38
  - number: 5.38.4
    text: |-
      Brandblustoestellen worden periodiek nagezien en worden onderworpen aan de tests die door het Hoofd van de
      Scheepvaartinspectie zijn voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.38
  - number: 5.38.5
    text: |-
      Een van de draagbare brandblustoestellen die voor het gebruik in een bepaalde ruimte zijn bestemd, is nabij de
      toegang tot die ruimte geplaatst.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.38
  - number: 5.39.1
    text: |-
      Een voldoende aantal draagbare brandblustoestellen is geplaatst in controlestations, ruimten voor accommodatie en
      dienstruimten opdat ten minste een brandblustoestel met een voor de in deze ruimte te verwachten branden geschikte
      blusstof, direct beschikbaar is voor gebruik op elke plaats in deze ruimte. Het totale aantal brandblustoestellen
      voor bovengenoemde ruimten bedraagt ten minste drie.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.39
  - number: 5.39.2
    text: Het aantal aan boord aanwezige reservevullingen is ten genoegen van het Hoofd van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.39
  - number: 5.40.1.a
    text: |-
      Ten genoegen van het Hoofd van de Scheepvaartinspectie zijn ruimten waarin oliegestookte ketels,
      oliestookinrichtingen of verbrandingsmotoren of gasturbines zijn opgesteld waarbij deze werktuigen tezamen een
      totaal vermogen hebben van niet minder dan 750 kW dan wel, voor Nederlandse vissersvaartuigen, 375 kW, voorzien van
      één van de volgende vast aangebrachte brandblusinstallaties:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.40
  - number: 5.40.1.a.1°
    text: een sproei-installatie voor water onder druk,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.40
  - number: 5.40.1.a.2°
    text: een installatie met verstikkend gas als blusstof,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.40
  - number: 5.40.1.a.3°
    text: een installatie met gas als blusstof verkregen uit een verdampende vloeistof met een lage giftigheidgraad, of
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.40
  - number: 5.40.1.a.4°
    text: een installatie voor schuim met een hoog verschuimingsgetal.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.40
  - number: 5.40.1.b
    text: |-
      Nieuwe vast aangebrachte installaties met halon 1211 en 1301 als blusstof zijn niet toegestaan op nieuwe en
      bestaande vaartuigen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.40
  - number: 5.40.1.c
    text: |-
      Indien machinekamers en ketelruimen niet volkomen van elkaar zijn gescheiden of wanneer brandstofolie vanuit
      het ketelruim in de machinekamer kan vloeien, worden de betrokken machinekamers en ketelruimen als één ruimte
      beschouwd.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.40
  - number: 5.40.2
    text: |-
      De in het eerste lid, onder a, bedoelde brandblusinstallatie kan worden bediend vanaf een gemakkelijk toegankelijke
      plaats buiten dergelijke ruimten, welke zodanig is gelegen dat het niet waarschijnlijk is dat, in geval van
      brand in een te beschermen ruimte, deze plaats onbereikbaar wordt. Er zijn voorzieningen getroffen teneinde de
      energievoorziening zeker te stellen die noodzakelijk is voor het inwerking stellen van de installatie in geval van
      brand in de te beschermen ruimte.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.40
  - number: 5.40.3
    text: |-
      Op vaartuigen die geheel of gedeeltelijk zijn vervaardigd van hout of kunststof en waarin oliegestookte ketels,
      verbrandingsmotoren of gasturbines zijn opgesteld en waarvan de ruimten voor machines zijn omgeven door schotten of
      dekken van dergelijke materialen, zijn deze ruimten voorzien van een vast aangebrachte brandblusinstallatie zoals
      voorgeschreven in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.40
  - number: 5.40.4
    text: |-
      In elke ruimte voor machines van categorie A zijn ten minste twee draagbare brandblustoestellen aanwezig van een
      type dat geschikt is voor het blussen van branden waarbij brandstofolie is betrokken. Indien in dergelijke ruimten
      werktuigen zijn opgesteld met een totaal vermogen van niet minder dan 250 kW, zijn ten minste drie van dergelijke
      brandblustoestellen aanwezig. Een van de brandblustoestellen is nabij de toegang tot die ruimte geplaatst.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.40
  - number: 5.40.5
    text: |-
      Vissersvaartuigen met ruimten voor machines die niet zijn beschermd door een vast aangebrachte brandblusinstallatie
      zijn voorzien van een schuimbrandblustoestel met een inhoud van ten minste 45 liter of een daarmee gelijkwaardig
      brandblustoestel dat geschikt is voor het blussen van oliebranden. Indien deze bepaling door de afmetingen van de
      ruimten voor machines praktisch niet uitvoerbaar is, kan het Hoofd van de Scheepvaartinspectie toestaan dat een
      aanvullend aantal draagbare brandblustoestellen wordt opgesteld.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.40
  - number: 5.40.6
    text: |-
      Op Nederlandse vissersvaartuigen zijn alle ruimten voor machines van categorie A uitgerust met een vast
      aangebrachte brandblusinstallatie.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.40
  - number: '5.41'
    text: |-
      Het aantal brandweeruitrustingen en de plaats waar deze worden bewaard zijn ten genoegen van het Hoofd van de
      Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.41
  - number: '5.42'
    text: |-
      Er is een brandbeveiligingsplan dat permanent aan boord is opgehangen en dat ten genoegen van het Hoofd van de
      Scheepvaartinspectie is. In geval van kleine vaartuigen kan het Hoofd van de Scheepvaartinspectie ontheffing van
      dit voorschrift verlenen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.42
  - number: '5.43'
    text: Brandbestrijdingsmiddelen worden goed onderhouden en zijn te allen tijde voor onmiddellijk gebruik gereed.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.43
  - number: '5.44'
    text: |-
      Waar in deze paragraaf een speciaal toestel, apparaat, speciale blusstof of inrichting van een bepaalde aard is
      voorgeschreven kan, indien naar het oordeel van het Hoofd van de Scheepvaartinspectie één en ander niet minder
      effectief is, elk ander toestel, apparaat, andere blusstof of inrichting daarvoor in de plaats worden gesteld.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel5.44
  - number: 6.1.1
    text: |-
      Een reddingslijnsysteem is zodanig ontworpen dat het functioneel is voor alle situaties waarvoor het is bestemd en
      is voorzien van alle benodigde lijnen, touwen, sluitingen, oogbouten en kikkers.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.1
  - number: 6.1.2
    text: |-
      Dekopeningen die zijn voorzien van luikhoofden of drempels waarvan de hoogte minder dan 600 mm bedraagt, zijn
      uitgerust met beveiligingsmiddelen zoals scharnierende of verplaatsbare relingen of netwerk. Het Hoofd van de
      Scheepvaartinspectie kan voor kleine openingen verlichting toestaan van deze eisen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.1
  - number: 6.1.3
    text: |-
      Schijnlichten of andere, soortgelijke openingen zijn voorzien van beveiligingsstaven waarvan de onderlinge afstand
      niet meer bedraagt dan 350 mm. Het Hoofd van de Scheepvaartinspectie kan voor kleine openingen verlichting toestaan
      van deze eis.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.1
  - number: 6.1.4
    text: |-
      Het oppervlak van elk dek is zodanig ontworpen of behandeld dat de mogelijkheid van uitglijden door opvarenden
      tot een minimum is beperkt. In het bijzonder zijn dekken op plaatsen waar gewerkt wordt, zoals in ruimten voor
      machines, in kombuizen, bij lieren en op plaatsen waar vis wordt verwerkt alsmede ter plaatse van de onder- en
      bovenkant van ladders en voor deuren, voorzien van antislipoppervlakken.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.1
  - number: 6.2.1
    text: |-
      Scharnierende deksels van luiken, mangaten en andere openingen zijn beveiligd tegen per ongeluk sluiten. In het
      bijzonder zijn zware deksels op noodluiken uitgerust met contragewichten en zijn zij zodanig geconstrueerd dat zij
      zowel vanaf de binnen- als buitenzijde geopend kunnen worden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.2
  - number: 6.2.2
    text: |-
      De afmetingen van toegangsluiken en ontsnappingsluiken mogen niet kleiner zijn dan 600 bij 600 mm of een kleinere
      diameter hebben dan 600 mm.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.2
  - number: 6.2.3
    text: Waar praktisch uitvoerbaar zijn boven het dek waarin zich nooduitgangen bevinden handgrepen aangebracht.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.2
  - number: 6.3.1
    text: |-
      Alle aan weer en wind blootgestelde dekken, voorzover deze bestemd zijn om daar te werken, zijn voorzien van
      een deugdelijke verschansing of reling. De hoogte van de verschansing of van de reling is ten minste 1 m boven
      het dek. Indien deze hoogte een belemmering vormt voor de normale werkzaamheden aan boord kan het Hoofd van de
      Scheepvaartinspectie een geringere hoogte toestaan.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.3
  - number: 6.3.2
    text: |-
      De kleinste afstand, verticaal gemeten, vanaf de hoogst gelegen lastlijn tot aan het laagste punt van de bovenzijde
      van de verschansing of tot aan de rand van het werkdek indien een reling is aangebracht, garandeert, ten genoegen
      van het Hoofd van de Scheepvaartinspectie, voldoende bescherming van de bemanning tegen overkomend water, waarbij
      rekening wordt gehouden met de toestand van de zee en de weersomstandigheden waarbij het vaartuig dienst moet
      kunnen doen, alsmede met het vaargebied, het type vaartuig en de vismethode waarvoor het bestemd is.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.3
  - number: 6.3.3
    text: |-
      De hoogte van de opening onder de onderste roede van het relingwerk mag niet groter zijn dan 230 mm. De onderlinge
      afstand van de overige roeden mag niet meer dan 380 mm bedragen en de onderlinge afstand tussen scepters mag niet
      meer dan 1,50 m zijn. Op vaartuigen waar de overgang van de huidbeplating naar de dekbeplating als een rondgezette
      plaat is uitgevoerd, zijn de scepters van het relingwerk op het vlakke gedeelte van het dek geplaatst. Relingen
      mogen geen scherpe punten, randen en hoeken hebben en zijn van voldoende sterkte.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.3
  - number: 6.3.4
    text: |-
      Ten genoegen van het Hoofd van de Scheepvaartinspectie zijn er voorzieningen aangebracht zoals relingen,
      handleiders, loopbruggen of onderdeks gelegen gangen ter bescherming van de bemanning bij het gaan naar of het
      komen van hun verblijven, de ruimten voor machines en andere werkruimten. Zonodig zijn buiten alle dekhuizen en
      schachten handleiders of andere doelmatige voorzieningen aangebracht teneinde de opvarenden een veilige doorgang en
      veilig werk te garanderen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.3
  - number: 6.3.5
    text: |-
      De bovenzijde van een aflopend deel van het dek aan boord van hektrawlers is voorzien van een doelmatige
      beveiliging in de vorm van deuren, hekken of netwerk die op dezelfde hoogte zijn aangebracht als de aangrenzende
      verschansing of reling. Voor het geval tijdelijk niet is voorzien in een dergelijke beveiliging is een ketting of
      ander beveiligingsmiddel over het hellende deel aangebracht.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.3
  - number: 6.3.6
    text: |-
      Aan boord van een vaartuig zijn middelen aanwezig ter persoonlijke bescherming van de schepelingen tegen letsel dat
      uit door hen te verrichten werkzaamheden zou kunnen voortvloeien. Bij ministeriële regeling kunnen nadere regels
      worden gesteld ten aanzien van het aantal, de soort en het gebruik van de persoonlijke beschermingsmiddelen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.3
  - number: 6.4.1
    text: |-
      Met het oog op de veiligheid van de bemanning zijn, ten genoegen van het Hoofd van de Scheepvaartinspectie, trappen
      en ladders van voldoende afmetingen en sterkte aangebracht, die zijn voorzien van leuningen en antisliptreden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.4
  - number: 6.4.2
    text: |-
      Er is een valreep, loopplank of vergelijkbare voorziening aanwezig waarmee op een adequate en veilige manier aan
      boord kan worden gegaan.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.4
  - number: 6.5.1
    text: |-
      Bij ministeriële regeling wordt voorgeschreven welke medische uitrusting, bestaande uit geneesmiddelen en antidota,
      met bijbehorende controlelijsten en handleidingen, aan boord aanwezig is.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.5
  - number: 6.5.2
    text: |-
      De schipper is verplicht ervoor te zorgen dat de medische uitrusting in goede staat verkeert, wordt
      aangevuld en zo nodig wordt vernieuwd zodra dit mogelijk is, in ieder geval bij voorrang tijdens normale
      bevoorradingsprocedures. Hij kan het gebruik en het beheer van de medische uitrusting aan boord, onverminderd zijn
      eigen verantwoordelijkheid, overdragen aan een of meer schepelingen die ten minste dienen te beschikken over een
      certificaat scheepsgezondheidszorg-B.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.5
  - number: '6.6'
    text: De medische uitrusting wordt in daarvoor geschikte kisten of in daarvoor ingerichte kasten of ruimten bewaard.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.6
  - number: 6.7.1
    text: |-
      De geneesmiddelen en antidota worden gescheiden van de verplegingsartikelen bewaard. Indien zij samen in één kist
      worden bewaard, worden zij door een tussenschot gescheiden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.7
  - number: 6.7.2
    text: |-
      De morfinepreparaten die deel uitmaken van de medische uitrusting, worden bewaard in een afgesloten ruimte,
      waarvan de sleutel berust bij de schipper of bij de schepeling aan wie de schipper het gebruik en het beheer van de
      medische uitrusting heeft overgedragen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.7
  - number: 6.8.1
    text: |-
      Op de verpakking van de bestanddelen van de medische uitrusting is, voor zover mogelijk, het nummer aangebracht dat
      is vermeld in de ministeriële regeling, bedoeld in [artikel 6.5, eerste lid][ref1], en [artikel 6.12][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0013342#Artikel6
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.8
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0013342
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.8.2
    text: |-
      Op de etiketten, aanwezig op de verpakking van de middelen, zijn ten behoeve van in het buitenland te raadplegen
      deskundigen zo veel mogelijk naast de Nederlandse, de Latijnse benamingen vermeld, overeenkomstig de nomenclatuur
      van de Wereld Gezondheidsorganisatie.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.8
  - number: '6.9'
    text: De geneesmiddelen en de antidota worden geleverd door een apotheker, hetgeen blijkt uit een merk op de verpakking.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.9
  - number: 6.10.1
    text: |-
      Indien er nog andere geneesmiddelen, verplegingsartikelen en antidota aan boord aanwezig zijn dan die
      zijn voorgeschreven op grond van de ministeriële regeling, bedoeld in [artikel 6.5, eerste lid][ref1], en
      [artikel 6.12][ref2], zijn ten aanzien van deze aanvullende middelen de [artikelen 6.6 tot en met 6.9][ref3] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0013342#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0013342#Artikel6
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.10
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0013342
        artikel: '6'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0013342
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.10.2
    text: |-
      Indien er sprake is van een medisch spoedgeval waarvoor de noodzakelijke geneesmiddelen, verplegingsartikelen of
      antidota aan boord niet aanwezig zijn, is de schipper verplicht ervoor te zorgen dat deze zo spoedig mogelijk ter
      beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.10
  - number: '6.11'
    text: |-
      Ten behoeve van het gebruik van de medische uitrusting is aan boord een bijgehouden exemplaar van een bij
      ministeriële regeling aan te wijzen geneeskundig handboek.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.11
  - number: '6.12'
    text: |-
      Indien aan boord van een vaartuig gevaarlijke stoffen als bedoeld in [artikel 130 van het Schepenbesluit 1965][ref1]
      worden meegevoerd, zijn tevens bij ministeriële regeling voorgeschreven antidota en een zuurstofbeademingskoffer
      met onderhoudsset, met de daarbij behorende controlelijst en handleiding aanwezig.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel130
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.12
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '130'
  - number: '6.13'
    text: |-
      Op of nabij groepsreddingsmiddelen en de bedieningsplaatsen van de tewaterlatingmiddelen zijn instructieplaten of
      aanduidingen aangebracht die:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.13
  - number: 6.13.a
    text: |-
      het doel van de bedieningsmiddelen, de volgorde van de behandeling ervan en de ter zake dienende instructie of
      waarschuwingen aangeven,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.13
  - number: 6.13.b
    text: duidelijk zichtbaar zijn bij noodverlichting, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.13
  - number: 6.13.c
    text: voldoen aan bij ministeriële regeling te stellen nadere eisen inzake symbolen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.13
  - number: 6.14.1
    text: |-
      De bedieningsorganen van de lieren zijn op een voldoende ruime plaats aangebracht teneinde het bedienende personeel
      in staat te stellen ongehinderd te werken.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.14
  - number: 6.14.2
    text: |-
      De lieren zijn bovendien voorzien van adequate veiligheidsvoorzieningen voor noodgevallen, met inbegrip van
      noodstopvoorzieningen. Degene die de lieren bedient heeft goed zicht op de bemanningsleden die daarmee aan het werk
      zijn. Ook als de lieren worden bediend vanaf de brug heeft degene die de lieren bedient goed zicht op de werknemers
      die daarmee aan werk zijn, hetzij rechtstreeks, hetzij via enig ander geschikt hulpmiddel.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.14
  - number: 6.14.3
    text: Voor de communicatie vanaf de brug wordt gebruik gemaakt van een betrouwbaar communicatiesysteem.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.14
  - number: 6.14.4
    text: |-
      Er wordt te allen tijde goede uitkijk gehouden en de bemanning wordt gewaarschuwd voor dreigend gevaar van
      naderende zeeën gedurende de visserijwerkzaamheden of wanneer er ander werk aan dek wordt verricht.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.14
  - number: 6.14.5
    text: |-
      Ter beperking van de beweging van de massa's, met name aan boord van trawlers, zijn er voorzieningen aangebracht
      voor het blokkeren van de visborden en ter beperking van slingerbewegingen van de netkuil.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.14
  - number: 6.14.6
    text: |-
      Indien ten behoeve van de ventilatie in gesloten werkruimten een mechanische luchtverversingsinstallatie wordt
      gebruikt, is deze altijd bedrijfsklaar.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.14
  - number: 6.14.7
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het bepaalde in het eerste tot en
      met zesde lid.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.14
  - number: 6.15.1
    text: |-
      De plaats, de constructie, de geluids- en warmte-isolatie en de inrichting van de verblijfsruimten en de
      dienstruimten, voorzover aanwezig, alsmede de toegangen daartoe, bieden adequate bescherming tegen trillingen en
      geluidhinder tijdens de rustperiode van de bemanning. In de verblijven van de bemanning, voorzover aanwezig, zijn
      trillingen, geluid en de gevolgen van bewegingen en versnellingen tot een minimum beperkt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.15
  - number: 6.15.2
    text: |-
      Wanneer de constructie, de afmetingen of de bestemming van het vaartuig het mogelijk maken zijn de verblijfsruimten
      zodanig gelegen dat de gevolgen van bewegingen en versnellingen zo veel mogelijk worden beperkt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.15
  - number: 6.15.3
    text: |-
      Voorzover mogelijk worden er passende maatregelen genomen voor de bescherming van niet-rokers tegen hinder door
      tabaksrook.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.15
  - number: 6.15.4
    text: Voor voedselopslag zijn koelkasten of andere koelvoorzieningen aanwezig.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.15
  - number: 6.15.5
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het bepaalde in het eerste tot en
      met vierde lid.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel6.15
  - number: '7.1'
    text: |-
      Dit hoofdstuk is van toepassing op vissersvaartuigen met een lengte van 45 meter of meer en op nieuwe Nederlandse
      vissersvaartuigen met een lengte van 24 meter of meer.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.1
  - number: '7.2'
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.2
  - number: 7.2.1
    text: |-
      *te water laten door middel van vrij opdrijven:* de methode van te water laten van een groepsreddingsmiddel waarbij
      dit automatisch van een zinkend vaartuig wordt ontkoppeld en klaar is voor gebruik;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.2
  - number: 7.2.2
    text: |-
      *te water laten door middel van vrije val:* de methode van te water laten van een groepsreddingsmiddel waarbij dit
      met volledige bezetting en volledige uitrusting wordt ontkoppeld en vervolgens vrij in het water kan vallen zonder
      afgeremd te worden;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.2
  - number: 7.2.3
    text: |-
      *opblaasbaar reddingsmiddel:* een reddingsmiddel waarvan het drijfvermogen afhankelijk is van niet-verstijfde,
      met gas gevulde drijfkamers en dat gewoonlijk in niet-opgeblazen toestand wordt gehouden tot aan het moment van
      gebruik;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.2
  - number: 7.2.4
    text: |-
      *reddingsmiddel in opgeblazen toestand:* een reddingsmiddel waarvan het drijfvermogen afhankelijk is van niet-
      verstijfde, met gas gevulde drijfkamers en dat permanent in opgeblazen toestand en klaar voor gebruik wordt
      gehouden;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.2
  - number: 7.2.5
    text: |-
      *tewaterlatingsmiddel of -voorziening:* een middel of voorziening om een groepsreddingsmiddel of hulpverleningsboot
      vanaf de opstellingsplaats veilig te water te brengen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.2
  - number: 7.2.6
    text: |-
      *reddingsmiddelen of -voorzieningen van een nieuw ontwerp:* reddingsmiddelen of -voorzieningen die nieuwe
      eigenschappen bevatten die niet geheel vallen onder de voorschriften van dit besluit, maar die een gelijke of
      hogere norm van veiligheid bieden;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.2
  - number: 7.2.7
    text: |-
      *hulpverleningsboot:* een boot die is ontworpen om personen in nood uit het water te kunnen halen en voor het bij
      elkaar brengen van groepsreddingsmiddelen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.2
  - number: 7.2.8
    text: |-
      *lichtterugkaatsend materiaal:* materiaal dat een lichtstraal die daarop gericht wordt, in tegengestelde richting
      terugkaatst;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.2
  - number: 7.2.9
    text: |-
      *groepsreddingsmiddel:* een middel dat personen die in nood verkeren, in leven kan houden vanaf het moment dat zij
      het vaartuig verlaten.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.2
  - number: 7.3.1
    text: |-
      Behalve in een geval als bedoeld in het vijfde en zesde lid voldoen de reddingsmiddelen en -voorzieningen aan de
      voorschriften van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.3
  - number: 7.3.2
    text: 'Alvorens te worden goedgekeurd worden de reddingsmiddelen en -voorzieningen:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.3
  - number: 7.3.2.a
    text: |-
      getest om vast te stellen of zij aan het bepaalde in dit hoofdstuk voldoen, op een wijze als nader voorgeschreven
      bij ministeriële regeling, of
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.3
  - number: 7.3.2.b
    text: |-
      getest om vast te stellen of zij met goed gevolg zijn onderworpen aan tests die ten minste gelijkwaardig zijn aan
      die, bedoeld onder a.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.3
  - number: 7.3.3
    text: 'Reddingsmiddelen of -voorzieningen van een nieuw ontwerp worden slechts goedgekeurd:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.3
  - number: 7.3.3.a
    text: |-
      indien zij ten minste voldoen aan veiligheidseisen die ten minste gelijkwaardig zijn aan het bepaalde in dit
      hoofdstuk en zij zijn getest op een wijze als nader voorgeschreven bij ministeriële regeling, of
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.3
  - number: 7.3.3.b
    text: |-
      indien zij met goed gevolg zijn getest en beoordeeld volgens normen die ten minste gelijkwaardig zijn aan het
      bepaalde bij of krachtens dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.3
  - number: 7.3.4
    text: |-
      Bij ministeriële regeling wordt tevens bepaald in welke omstandigheden een verleende goedkeuring geldig blijft
      of vervalt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.3
  - number: 7.3.5
    text: |-
      Alvorens reddingsmiddelen en -voorzieningen die niet eerder zijn gekeurd, worden goedgekeurd, voldoen zij ten
      genoegen van het Hoofd van de Scheepvaartinspectie aan het bepaalde in dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.3
  - number: 7.3.6
    text: |-
      Reddingsmiddelen en -voorzieningen die ingevolge het bepaalde in dit hoofdstuk zijn voorgeschreven maar waarvoor
      geen nadere voorschriften in [paragraaf 3][ref1] zijn opgenomen, zijn ten genoegen van het Hoofd van de
      Scheepvaartinspectie.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0013342
        hoofdstuk: '7'
        paragraaf: '3'
  - number: '7.4'
    text: |-
      Bij ministeriële regeling worden voorschriften gegeven omtrent de controle van de productie van reddingsmiddelen,
      teneinde te verzekeren dat deze middelen worden vervaardigd volgens dezelfde normen als het goedgekeurde prototype.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.4
  - number: 7.5.1
    text: Elk vaartuig is voorzien van ten minste twee groepsreddingsmiddelen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.5
  - number: 7.5.2
    text: |-
      Vaartuigen met een lengte van 75 meter of meer voldoen met betrekking tot het aantal, de capaciteit en het type van
      het groepsreddingsmiddel en de hulpverleningsboot ten minste aan de volgende eisen:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.5
  - number: 7.5.2.a
    text: |-
      de vaartuigen zijn aan weerszijden voorzien van een groepsreddingsmiddel of van groepsreddingsmiddelen die
      gezamenlijk voldoende ruimte bieden voor het totaal aantal opvarenden. Indien het vaartuig voldoet aan de eisen
      betreffende waterdichte indeling, lekstabiliteit en brandbescherming zoals bepaald in [artikel 3.14][ref1] en in
      [hoofdstuk 5][ref2], en het Hoofd van de Scheepvaartinspectie van mening is dat een vermindering van het aantal
      groepsreddingsmiddelen geen invloed heeft op de veiligheid, kan hij deze vermindering toestaan mits de totale
      capaciteit van de groepsreddingsmiddelen aan elke zijde van het vaartuig voldoende is om ruimte te bieden aan ten
      minste de helft van het aantal opvarenden. Bovendien zijn dan ook reddingsvlotten aanwezig die gezamenlijk plaats
      bieden aan ten minste de helft van het aantal opvarenden;


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013342#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '3'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0013342
        hoofdstuk: '5'
  - number: 7.5.2.b
    text: |-
      zij beschikken over een hulpverleningsboot, tenzij het vaartuig is voorzien van een reddingsboot die voldoet aan de
      eisen voor een hulpverleningsboot en die na de reddingsoperatie weer terug aan boord geplaatst kan worden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.5
  - number: 7.5.3
    text: |-
      Vaartuigen waarvan de lengte minder dan 75 meter, maar 45 meter of meer bedraagt, voldoen aan de volgende
      voorschriften:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.5
  - number: 7.5.3.a
    text: |-
      aan elke zijde bevinden zich groepsreddingsmiddelen die voldoende ruimte bieden voor ten minste het totaal aantal
      opvarenden, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.5
  - number: 7.5.3.b
    text: |-
      zij beschikken over een hulpverleningsboot, tenzij het vaartuig is uitgerust met een groepsreddingsmiddel dat na
      een reddingsoperatie weer terug aan boord geplaatst kan worden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.5
  - number: 7.5.3bis
    text: 'Vaartuigen waarvan de lengte minder dan 45 meter bedraagt, zijn uitgerust met:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.5
  - number: 7.5.3bis.a
    text: |-
      groepsreddingsmiddelen die gezamenlijk voldoende ruimte bieden aan ten minste 200% van het totaal aantal
      opvarenden. Een voldoende aantal van de reddingsboten en -vlotten dat ten minste het totale aantal opvarenden kan
      opnemen, kan aan beide zijden van het vaartuig te water worden gelaten, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.5
  - number: 7.5.3bis.b
    text: |-
      een hulpverleningsboot, tenzij het Hoofd van de Scheepvaartinspectie ervan overtuigd is dat vanwege de afmetingen
      en manoeuvreerbaarheid van het vaartuig, de direct aanwezige opsporings- en reddingsfaciliteiten vanaf de wal en
      de meteorologische waarschuwingssystemen alsmede vanwege de werkzaamheden van het vaartuig in vaargebieden die niet
      zijn blootgesteld aan zwaar weer of vanwege de werkzaamheden van het vaartuig die aan een bepaald jaargetijde zijn
      gebonden, de aanwezigheid van een dergelijke boot niet noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.5
  - number: 7.5.4
    text: |-
      In plaats van te voldoen aan de eisen van het tweede lid, onder a, het derde lid, onder a, en lid 3bis, onder a,
      kunnen vaartuigen zijn voorzien van een of meerdere reddingsboten van het vrije-valtype die via het achterschip te
      water worden gelaten en voldoende capaciteit bezitten voor het totale aantal opvarenden en van reddingsvlotten van
      voldoende capaciteit voor het totale aantal opvarenden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.5
  - number: 7.5.5
    text: |-
      Het aantal reddingsboten en hulpverleningsboten waarover een vaartuig beschikt is zodanig dat bij volledige
      verlating van het vaartuig elke reddingsboot en elke hulpverleningsboot niet meer dan negen reddingsvlotten zal
      moeten bijeenbrengen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.5
  - number: 7.5.6
    text: |-
      Het groepsreddingsmiddel en de hulpverleningsboot voldoen aan het voor hun bepaalde in de
      [artikelen 7.17 tot en met 7.23][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.6.1
    text: 'Groepsreddingsmiddelen:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.6
  - number: 7.6.1.a.1
    text: zijn in geval van nood direct klaar voor gebruik,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.6
  - number: 7.6.1.a.2°
    text: |-
      kunnen snel en veilig te water worden gelatenin omstandigheden als omschreven in
      [artikel 7.32, eerste lid, onder a][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.6
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.6.1.a.3°
    text: kunnen snel terug aan boord worden gezet, indien zij ook voldoen aan de eisen voor een hulpverleningsboot;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.6
  - number: 7.6.1.b
    text: 'zijn zodanig geplaatst dat:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.6
  - number: 7.6.1.b.1°
    text: het verzamelen van opvarenden op het inschepingsdek niet wordt gehinderd,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.6
  - number: 7.6.1.b.2°
    text: hun snelle behandeling niet wordt gehinderd,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.6
  - number: 7.6.1.b.3°
    text: inscheping snel en op de juiste wijze kan plaatsvinden, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.6
  - number: 7.6.1.b.4°
    text: het gebruik van een ander groepsreddingsmiddel niet wordt gehinderd.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.6
  - number: 7.6.2
    text: |-
      Indien de afstand van het inschepingsdek tot de waterlijn bij de laagst gelegen lastlijn meer is dan 4,5 meter is
      het groepsreddingsmiddel, tenzij dit een reddingsvlot van het vrij opdrijvende type is, van het strijkbare type dat
      met volledige bezetting gestreken kan worden ofwel is voorzien van gelijkwaardige middelen voor de inscheping.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.6
  - number: 7.6.3
    text: |-
      Groepsreddingsmiddelen en tewaterlatingsvoorzieningen zijn voor onmiddellijk gebruik gereed voordat het vaartuig de
      haven verlaat en worden in die staat gehandhaafd gedurende de vaart op zee.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.6
  - number: 7.6.4.a
    text: Een groepsreddingsmiddel wordt op een door het Hoofd van de Scheepvaartinspectie goedgekeurde plaats opgesteld.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.6
  - number: 7.6.4.b
    text: Elke reddingsboot wordt bediend door een aparte set davits of door een goedgekeurd middel voor tewaterlating.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.6
  - number: 7.6.4.c
    text: |-
      Groepsreddingsmiddelen worden zo dicht mogelijk bij de accommodatie en dienstruimtes geplaatst, zodanig dat het
      mogelijk is een veilige tewaterlating, rekening houdend met de afstand tot de schroef, te waarborgen. Reddingsboten
      die langs de scheepszijden worden afgevierd, worden zo geplaatst dat zij, rekening houdend met sterk terugwijkende
      gedeelten van de romp, zoveel mogelijk langs de verticale gedeelten van het vaartuig afgevierd kunnen worden.
      Bij plaatsing op het voorschip zijn de groepsreddingsmiddelen op een beschermde plaats achter het aanvaringsschot
      gelegen en in dat geval wordt bijzondere aandacht geschonken aan de sterkte van het tewaterlatingsmiddel.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.6
  - number: 7.6.4.d
    text: |-
      De wijze voor tewaterlating en terugplaatsing van een hulpverleningsboot is van een goedgekeurd type,
      waarbij rekening gehouden wordt met het gewicht van de hulpverleningsboot met volledige uitrusting
      en met de helft van het aantal personen dat de hulpverleningsboot volgens de voorschriften in de
      [artikelen 7.23, eerste lid, onder b, 2°][ref1], en [7.23, eerste lid, onder c][ref2], mag bezetten, de grootte
      en constructie van de hulpverleningsboot en met de afstand van de plaats van stuwage tot de waterlijn bij de laagst
      gelegen lastlijn. Elke hulpverleningsboot echter, die meer dan 4,5 meter boven de waterlijn bij de laagst gelegen
      lastlijn is geplaatst, is voorzien van goedgekeurde middelen voor tewaterlating en terugplaatsing.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.6
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.6.4.e
    text: |-
      Middelen voor tewaterlating en inscheping voldoen aan het bepaalde in [artikel 7.32][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.6
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.6.4.f.1°
    text: |-
      Alle reddingsvlotten zijn voor onmiddellijk gebruik gereed en zijn zodanig geplaatst dat ze, indien het vaartuig
      zinkt, vrijkomen van hun craddle, zichzelf opblazen en loskomen van het vaartuig. Reddingsvlotten van het
      strijkbare type hoeven echter niet vrij opdrijvend te zijn.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.6
  - number: 7.6.4.f.2°
    text: Indien sjorringen worden gebruikt zijn deze voorzien van een goedgekeurd hydrostatisch ontkoppelingsmechanisme.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.6
  - number: 7.6.4.g
    text: |-
      Indien het Hoofd van de Scheepvaartinspectie van oordeel is dat het, in verband met de constructie van het vaartuig
      of de toegepaste vismethode, onredelijk of onpraktisch is om het bepaalde onder a tot en met f toe te passen, kan
      hij afwijkingen van deze voorschriften toestaan, mits het vaartuig is voorzien van even doeltreffende middelen
      voor tewaterlating en terugplaatsing. In dat geval stelt hij de IMO daarvan in kennis onder vermelding van de
      bijzonderheden van die voorziening, ter informatie van de andere leden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.6
  - number: '7.7'
    text: 'Er zijn doeltreffende voorzieningen ter inscheping in een groepsreddingsmiddel aanwezig, die omvatten:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.7
  - number: 7.7.a
    text: |-
      ten minste een ladder of een andere goedgekeurde voorziening aan elke zijde van het schip om inscheping in het
      groepsreddingsmiddel mogelijk te maken als dit in het water ligt, tenzij het Hoofd van de Scheepvaartinspectie van
      mening is dat de afstand van de plaats van inscheping tot het in het water liggende groepsreddingsmiddel zodanig is
      dat deze ladder of andere voorziening niet noodzakelijk is,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.7
  - number: 7.7.b
    text: |-
      voorzieningen voor het verlichten van de plaats van de groepsreddingsmiddelen en de middelen voor tewaterlating
      gedurende de voorbereiding en het te water laten zelf, en ook voor het verlichten van het wateroppervlak waar
      de groepsreddingsmiddelen te water worden gelaten totdat de tewaterlating is beëindigd. De voeding voor deze
      verlichting wordt geleverd door de noodkrachtbron, voorgeschreven in [artikel 4.17][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel4
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.7
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 7.7.c
    text: voorzieningen om alle personen aan boord te waarschuwen dat het schip zal worden verlaten, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.7
  - number: 7.7.d
    text: voorzieningen om lozing van water in het groepsreddingsmiddel te voorkomen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.7
  - number: 7.8.1
    text: |-
      Voor elke opvarende is een goedgekeurde reddingsgordel aan boord die voldoet aan het bepaalde in
      [artikel 7.24][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.8
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.8.2
    text: De reddingsgordels zijn zo opgeborgen dat ze gemakkelijk bereikbaar zijn. Hun bergplaats is duidelijk aangegeven.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.8
  - number: 7.9.1
    text: |-
      Aan boord van een vaartuig is voor elke persoon die is aangewezen om de hulpverleningsboot te bemannen, een
      overlevingspak van de juiste maat aanwezig dat voldoet aan het bepaalde in [artikel 7.25][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.9
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.9.2
    text: |-
      Aan boord van een vaartuig dat voldoet aan het bepaalde in [artikel 7.5, tweede en derde lid][ref1], zijn
      overlevingspakken aanwezig die voldoen aan het bepaalde in [artikel 7.25][ref2] voor alle opvarenden die geen
      toegewezen plaats hebben in:


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.9
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.9.2.a
    text: reddingsboten, of
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.9
  - number: 7.9.2.b
    text: reddingsvlotten van het strijkbare type, of
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.9
  - number: 7.9.2.c
    text: |-
      reddingsvlotten die door middel van goedgekeurde gelijkwaardige middelen in het water kunnen worden gelaten en
      waarvoor het niet noodzakelijk is via het water in het reddingsvlot te komen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.9
  - number: 7.9.3
    text: |-
      In aanvulling op het tweede lid, onder a, zijn aan boord van een vaartuig voor iedere reddingsboot ten minste drie
      overlevingspakken aanwezig die voldoen aan het bepaalde in [artikel 7.25][ref1]. Het vaartuig heeft echter naast
      de hulpmiddelen tegen warmteverlies, voorgeschreven in [artikel 7.17, achtste lid, onder 31°][ref2], hulpmiddelen
      tegen warmteverlies aan boord die voldoen aan het bepaalde in [artikel 7.26][ref3], voor de opvarenden die niet
      zijn voorzien van overlevingspakken. Deze overlevingspakken en hulpmiddelen tegen warmteverlies behoeven niet aan
      boord te zijn indien het vaartuig geheel overdekte reddingsboten heeft die gezamenlijk per zijde voldoende ruimte
      bieden aan het totaal aantal opvarenden, of indien het vaartuig beschikt over een reddingsboot van het vrije-
      valtype die voldoende ruimte biedt aan het totaal aantal opvarenden.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0013342#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.9
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.9.4
    text: |-
      Het tweede en derde lid zijn niet van toepassing op schepen die permanent werkzaam zijn in warme gebieden waar naar
      het oordeel van het Hoofd van de Scheepvaartinspectie overlevingspakken en hulpmiddelen tegen warmteverlies onnodig
      zijn.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.9
  - number: 7.9.5
    text: |-
      Een overlevingspak dat is voorgeschreven in het tweede en derde lid wordt mede in aanmerking genomen voor het
      voldoen aan het bepaalde in eerste lid.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.9
  - number: 7.10.1
    text: |-
      Vaartuigen hebben ten minste het volgende aantal reddingsboeien die voldoen aan het bepaalde in
      [artikel 7.27, eerste lid][ref1], aan boord:


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.10
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.10.1.a
    text: acht reddingsboeien voor vaartuigen waarvan de lengte 75 meter of meer bedraagt;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.10
  - number: 7.10.1.b
    text: zes reddingsboeien voor vaartuigen waarvan de lengte minder dan 75 meter, doch 45 meter of meer bedraagt;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.10
  - number: 7.10.1.c
    text: vier reddingsboeien voor vaartuigen waarvan de lengte minder dan 45 meter bedraagt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.10
  - number: 7.10.2
    text: |-
      Ten minste de helft van het totaal aantal reddingsboeien als voorgeschreven in het eerste lid is voorzien van een
      zelfontbrandend licht dat voldoet aan het bepaalde in [artikel 7.27, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.10
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.10.3
    text: |-
      Ten minste twee van de reddingsboeien met zelfontbrandend licht als voorgeschreven in het tweede lid zijn voorzien
      van een zelfwerkend rooksignaal dat voldoet aan het bepaalde in [artikel 7.27, derde lid][ref1], en deze kunnen,
      voorzover uitvoerbaar, vanaf de brug snel ontkoppeld worden.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.10
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.10.4
    text: |-
      Aan iedere zijde van het vaartuig is ten minste een reddingsboei voorzien van een drijvende reddingslijn die
      voldoet aan het bepaalde in [artikel 7.27, vierde lid][ref1], met een lengte van tenminste 30 meter of tweemaal de
      hoogte waarop de reddingsboei geplaatst is boven de laagst gelegen lastlijn van het vaartuig in het zeewater, welke
      van beide het grootste is. Deze reddingsboeien mogen niet zijn voorzien van een zelfontbrandend licht.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.10
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.10.5
    text: |-
      Reddingsboeien zijn zodanig geplaatst dat ze voor iedereen vrij toegankelijk zijn, dat zij snel overboord kunnen
      worden geworpen en dat ze niet op een of andere manier permanent zijn vastgezet.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.10
  - number: '7.11'
    text: |-
      Aan boord van elk vaartuig is een lijnwerptoestel aanwezig dat voldoet aan het bepaalde in [artikel 7.28][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.11
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.12.1
    text: |-
      Elk vaartuig is voorzien van goedgekeurde middelen voor het maken van noodsignalen die zowel overdag als
      's nachts effectief zijn. Er zijn ten minste 12 valschermsignalen aan boord die voldoen aan het bepaalde in
      [artikel 7.29][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.12
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.12.2
    text: |-
      Noodsignalen zijn van een goedgekeurd type. Zij zijn zo geplaatst dat zij gemakkelijk bereikbaar zijn en tevens is
      duidelijk aangegeven waar zij zijn geplaatst.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.12
  - number: 7.13.1
    text: |-
      Elk vaartuig is voorzien van ten minste drie VHF-portofoons. Deze voldoen ten minste aan de bij ministeriële
      regeling vastgestelde eisen. Indien een vast opgestelde VHF-portofoon is aangebracht in een groepsreddingsmiddel,
      voldoet deze aan het bij ministeriële regeling vastgestelde minimum.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.13
  - number: 7.13.1 bis
    text: |-
      Voor vaartuigen waarvan de lengte minder dan 45 meter bedraagt, mag het aantal VHF-portofoons worden teruggebracht
      tot twee, indien het Hoofd van de Scheepvaartinspectie de eis om drie van dergelijke toestellen te voeren overbodig
      acht, gezien het vaargebied van het vaartuig en het aantal personen dat dienst doet aan boord.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.13
  - number: 7.13.2
    text: |-
      Voor zenden en ontvangen geschikte VHF-portofoons die zich aan boord van bestaande vaartuigen bevinden en
      die niet voldoen aan bij ministeriële regeling vast te stellen prestatienormen kunnen door het Hoofd van de
      Scheepvaartinspectie worden toegelaten mits die apparatuur compatibel is met goedgekeurde, voor zenden en ontvangen
      geschikte VHF-portofoons.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.13
  - number: '7.14'
    text: |-
      Alle schepen zijn uitgerust met ten minste een radartransponder aan elke zijde van het schip. Deze
      radartransponders voldoen ten minste aan bij ministeriële regeling vast te stellen eisen. De plaatsing is zodanig
      dat ze snel in een groepsreddingsmiddel geplaatst kunnen worden. Als alternatief kan een radartransponder worden
      geplaatst op elk groepsreddingsmiddel. Elk vaartuig waarvan de lengte minder dan 45 meter bedraagt voert ten minste
      een radartransponder.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.14
  - number: '7.15'
    text: |-
      Reddingsvlotten, hulpverleningsboten, reddingsgordels en reddingsboeien zijn voorzien van licht weerkaatsend
      materiaal.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.15
  - number: 7.16.1
    text: |-
      *Gereedheid voor gebruik* Voordat het vaartuig de haven verlaat en gedurende de gehele reis verkeren alle
      reddingsmiddelen in goede staat en zijn ze voor onmiddellijk gebruik gereed.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.16
  - number: 7.16.2
    text: '*Onderhoud*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.16
  - number: 7.16.2.a
    text: |-
      Er zijn instructies voor het onderhoud aan boord van de reddingsmiddelen, die zijn goedgekeurd door het Hoofd van
      de Scheepvaartinspectie, en het onderhoud wordt dienovereenkomstig uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.16
  - number: 7.16.2.b
    text: |-
      In plaats van die instructies kan het Hoofd van de Scheepvaartinspectie een voor het vaartuig opgesteld
      onderhoudsprogramma toestaan.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.16
  - number: 7.16.3
    text: |-
      *Onderhoud van lopers* Lopers die bij het afvieren van de reddingsmiddelen worden gebruikt, worden met tussenpozen
      van niet meer dan 30 maanden gekeerd en worden vernieuwd wanneer ze gebreken vertonen dan wel na niet meer dan
      5 jaar.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.16
  - number: 7.16.4
    text: |-
      *Reserveonderdelen en gereedschap voor reparatie* Voor de groepsreddingsmiddelen en hun onderdelen die onderhevig
      zijn aan uitzonderlijke slijtage of aantasting en die regelmatig vervangen dienen te worden, zijn aan boord
      reserveonderdelen en gereedschap voor reparatie aanwezig.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.16
  - number: 7.16.5
    text: '*Wekelijkse inspectie* De volgende tests en inspecties worden wekelijks uitgevoerd:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.16
  - number: 7.16.5.a
    text: |-
      een visuele inspectie van alle groepsreddingsmiddelen, hulpverleningsboten en middelen voor tewaterlating, teneinde
      zeker te stellen dat deze gereed zijn voor onmiddellijk gebruik,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.16
  - number: 7.16.5.b
    text: |-
      het laten draaien van de motoren in alle reddingsboten en hulpverleningsboten in voor- en achteruitstand in totaal
      gedurende ten minste 3 minuten, mits de omgevingstemperatuur hoger is dan de minimumtemperatuur die is vereist om
      de motor te kunnen starten, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.16
  - number: 7.16.5.c
    text: het beproeven van de algemene alarminstallatie.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.16
  - number: 7.16.6
    text: |-
      *Maandelijkse inspecties* Een inspectie van de reddingsmiddelen met inbegrip van de uitrusting van de reddingsboot
      wordt maandelijks uitgevoerd, waarbij gebruik wordt gemaakt van een controlelijst teneinde zeker te stellen dat
      de middelen en de uitrusting volledig zijn en in goede staat verkeren. Een verslag van de inspectie wordt in het
      scheepsdagboek opgenomen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.16
  - number: 7.16.7
    text: |-
      *Keuring van automatisch opblaasbare reddingsvlotten, opblaasbare reddingsgordels en hulpverleningsboten in
      opgeblazen toestand*
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.16
  - number: 7.16.7.a
    text: |-
      Ieder automatisch opblaasbaar reddingsvlot en de daarbij behorende medische uitrusting en iedere automatisch
      opblaasbare reddingsgordel wordt gekeurd:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.16
  - number: 7.16.7.a.1°
    text: |-
      met tussenpozen van ten hoogste 12 maanden. In bijzondere gevallen kan het Hoofd van de Scheepvaartinspectie deze
      periode verlengen tot ten hoogste 17 maanden;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.16
  - number: 7.16.7.a.2°
    text: |-
      in Nederland bij een door het Hoofd van de Scheepvaartinspectie erkend keuringsstation en in het buitenland in een
      door de overheid aldaar erkend keuringsstation dat vanwege de fabrikant bevoegd is verklaard om deze keuringen te
      verrichten, beschikt over adequate keuringsfaciliteiten en alleen goed opgeleid personeel in dienst heeft.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.16
  - number: 7.16.7.b
    text: |-
      Alle reparaties en onderhoud aan hulpverleningsboten in opgeblazen toestand wordt uitgevoerd overeenkomstig de
      aanwijzingen van de fabrikant. Noodreparaties mogen aan boord van het vaartuig worden uitgevoerd, maar permanente
      reparaties worden uitgevoerd in een erkend keuringsstation als bedoeld onder a, 2°.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.16
  - number: 7.16.8
    text: |-
      *Periodieke keuring van hydrostatische ontkoppelingsmechanismen* Wegwerp hydrostatische ontkoppelingsmechanismen
      worden vervangen wanneer de vervaldatum is verstreken. Andere hydrostatische ontkoppelingsmechanismen worden
      gekeurd:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.16
  - number: 7.16.8.1°
    text: |-
      met tussenpozen van ten hoogste 12 maanden. In bijzondere gevallen kan het Hoofd van de Scheepvaartinspectie deze
      periode verlengen tot 17 maanden;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.16
  - number: 7.16.8.2°
    text: |-
      bij een keuringsstation dat erkend is om te keuren, beschikt over adequate keuringsfaciliteiten en alleen goed
      opgeleid personeel in dienst heeft.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.16
  - number: 7.16.9
    text: |-
      Indien het vaartuig door de wijze van vissen moeilijk kan voldoen aan het bepaalde in het zevende en achtste lid
      kan het Hoofd van de Scheepvaartinspectie deze periode verlengen tot 24 maanden, mits is aangetoond dat de middelen
      zodanig geconstrueerd en geplaatst zijn dat zij in aanvaardbare conditie blijven tot de eerstvolgende keuring.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.16
  - number: 7.17.1
    text: '*Constructie van reddingsboten*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.1.a
    text: |-
      Alle reddingsboten zijn deugdelijk gebouwd en van zodanige vorm en afmetingen dat zij in zeegang een ruime mate
      van stabiliteit en voldoende vrijboord hebben wanneer zij zijn beladen met volle bezetting en volledige uitrusting.
      Alle reddingsboten hebben een vaste romp en behouden, rechtop liggend in kalm water en beladen met volle bezetting
      en volledige uitrusting, een positieve stabiliteit wanneer er ergens beneden de waterlijn een gat is ontstaan,
      aangenomen dat daarbij geen verlies van drijfvermogen verschaffend materiaal of andere beschadiging optreedt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.1.b
    text: |-
      Alle reddingsboten zijn sterk genoeg om veilig te water gelaten te kunnen worden, beladen met volle bezetting en
      volledige uitrusting.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.1.c
    text: Rompen en vaste overkappingen zijn van brandvertragend of onbrandbaar materiaal.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.1.d
    text: |-
      Zitplaatsen worden gesitueerd op dwars- en langsdoften of als vaste zitplaatsen, die zo laag mogelijk in de
      reddingsboot zijn aangebracht en zo zijn vervaardigd dat zij het aantal personen, ieder met een gewicht van 100 kg,
      waarvoor ruimte is bestemd in overeenstemming met het bepaalde in het tweede lid, onder b, 2°, kunnen dragen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.1.e
    text: |-
      Iedere reddingsboot is sterk genoeg om de onderstaande belasting te doorstaan zonder blijvende vervorming na het
      verwijderen van de belasting:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.1.e.1°
    text: |-
      voor boten met een metalen romp: 1,25 maal de totale massa van de reddingsboot, beladen met volle bezetting en
      volledige uitrusting, of
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.1.e.2°
    text: |-
      voor andere boten: tweemaal de totale massa van de reddingsboot, beladen met volle bezetting en volledige
      uitrusting.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.1.f
    text: |-
      Iedere reddingsboot is sterk genoeg om, beladen met volle bezetting en volledige uitrusting en, waar dat van
      toepassing is, met glijspanten of stootdempers op hun plaatsen, een zijdelingse slag tegen de scheepszijde met
      een stootsnelheid van ten minste 3,5 m/s en tevens een val op het water vanaf een hoogte van ten minste 3 m te
      doorstaan.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.1.g
    text: |-
      De verticale afstand tussen het vloeroppervlak en de binnenzijde van de overkapping over 50% van dat vloeroppervlak
      is:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.1.g.1°
    text: ten minste 1,3 m voor een reddingsboot bestemd voor 9 personen of minder,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.1.g.2°
    text: ten minste 1,7 m voor een reddingsboot bestemd voor 24 personen of meer, of
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.1.g.3°
    text: |-
      ten minste de afstand vastgesteld door lineaire interpolatie tussen 1,3 en 1,7 m voor een reddingsboot bestemd voor
      meer dan 9 personen doch minder dan 24 personen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.2
    text: '*Draagvermogen van reddingsboten*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.2.a
    text: Een reddingsboot bestemd voor meer dan 150 personen is niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.2.b
    text: |-
      Het aantal personen waarvoor in een reddingsboot ruimte wordt toegestaan, is gelijk aan het kleinste van de
      volgende getallen:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.2.b.1°
    text: |-
      het aantal personen met een gemiddeld gewicht van 75 kg per persoon, allen met een reddingsgordel om, dat normaal
      zittend plaats kan nemen zonder de bediening van de voortstuwingsmiddelen of het gebruik van enig uitrustingsstuk
      te belemmeren, of
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.2.b.2°
    text: |-
      het aantal plaatsen dat wordt verkregen door een indeling van de zitplaatsen in overeenstemming met figuur 1. De
      vormen kunnen elkaar, als aangegeven, gedeeltelijk overlappen mits er voetsteunen zijn aangebracht en er voldoende
      beenruimte is en de verticale afstand tussen de boven- en onderzitplaatsen ten minste 350 mm is.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.2.c
    text: Iedere zitplaats in de reddingsboot is duidelijk aangegeven.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.3
    text: '*Toegang tot reddingsboten*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.3.a
    text: |-
      Iedere reddingsboot is zo ingericht dat het volledige aantal daarvoor bestemde personen binnen drie minuten vanaf
      het moment dat het bevel daartoe wordt gegeven, zich kan inschepen. Snelle ontscheping is eveneens mogelijk.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.3.b
    text: |-
      Reddingsboten beschikken over een inschepingsladder die aan beide zijden van de reddingsboot gebruikt kan worden om
      personen in staat te stellen vanuit het water in de reddingsboot te klimmen. De onderste trede van de ladder reikt
      tot ten minste 0,4 m beneden de waterlijn van de lege reddingsboot.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.3.c
    text: |-
      De reddingsboot is zo ingericht dat hulpbehoevende personen, zowel vanuit zee als per draagbaar, aan boord gebracht
      kunnen worden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.3.d
    text: Alle oppervlakken waarop personen kunnen lopen zijn van een antisliplaag voorzien.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.4
    text: |-
      *Drijfvermogen van reddingsboten* Alle reddingsboten hebben een eigen drijfvermogen of zijn voorzien van
      drijvend materiaal dat niet nadelig wordt beïnvloed door zeewater, olie en olieproducten, en dat voldoende is
      om de reddingsboot met volledige uitrusting drijvende te houden wanneer zij vol water staat en de zee vrij kan
      binnendringen. Bovendien is er voor het aantal personen waarvoor in de reddingsboot ruimte is bestemd, drijvend
      materiaal met een opdrijvend vermogen gelijk aan 280 N per persoon, aangebracht. Het voorgeschreven drijvend
      materiaal mag niet aan de buitenzijde van de romp van de reddingsboot zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.5
    text: |-
      *Vrijboord en stabiliteit van reddingsboten* Alle reddingsboten hebben, beladen met 50% van het aantal personen
      waarvoor in de reddingsboot ruimte is bestemd, gezeten op hun normale plaatsen aan één zijde van de reddingsboot,
      een vrijboord, gemeten vanaf de waterlijn tot aan de laagst gelegen opening waardoor de reddingsboot kan vollopen,
      van ten minste 1,5% van de lengte van de reddingsboot of 100 mm, welke van beide het grootste is.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.6
    text: '*Voortstuwing van reddingsboten*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.6.a
    text: |-
      Iedere reddingsboot wordt aangedreven door een dieselmotor. Voor een reddingsboot wordt geen motor gebruikt waarvan
      de brandstof een vlampunt van 43°C of lager heeft.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.6.b
    text: |-
      De motor is voorzien van een handmatige startinrichting of een bekrachtigde startinrichting met twee onafhankelijk
      werkende oplaadbare krachtbronnen. Voorts is de motor voorzien van alle voor het starten benodigde hulpmiddelen.
      De startinrichting van de motor en de hulpmiddelen voor het starten kunnen bij een omgevingstemperatuur van min
      15°C de motor starten binnen 2 minuten vanaf het moment waarop de handelingen daarvoor zijn begonnen, tenzij naar
      het oordeel van het Hoofd van de Scheepvaartinspectie, met inachtneming van de bijzondere reizen die het vaartuig
      met die reddingsboot voortdurend maakt, een andere temperatuur van toepassing is. De startinrichtingen mogen niet
      worden belemmerd door de motoromkasting, doften of andere obstakels.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.6.c
    text: De motor kan ook gedurende ten minste 5 minuten na de koude start, met de reddingsboot uit het water, draaien.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.6.d
    text: De motor kan ook draaien indien de reddingsboot tot aan de hartlijn van de krukas is volgelopen met water.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.6.e
    text: |-
      De inrichting van de schroefas is zodanig dat de schroef kan worden ontkoppeld van het voortstuwingswerktuig. Er
      zijn voorzieningen aangebracht waardoor het mogelijk is met de reddingsboot zowel voor- als achteruit te varen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.6.f
    text: De uitlaat van de motor is zo ingericht dat onder normaal gebruik wordt voorkomen dat water de motor binnendringt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.6.g
    text: |-
      Alle reddingsboten zijn zo ontworpen dat rekening is gehouden met de veiligheid van personen in het water, en dat
      mogelijke beschadiging van het voortstuwingssysteem door in het water drijvend materiaal wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.6.h
    text: |-
      De snelheid van een reddingsboot, beladen met volle bezetting en volledige uitrusting en met alle door de motor
      aangedreven hulpuitrusting in bedrijf, bedraagt, in kalm water en vooruit varend, ten minste 6 zeemijl per uur en,
      wanneer een 25-persoons reddingsvlot beladen met volle bezetting en volledige uitrusting of gelijkwaardige massa
      wordt gesleept, 2 zeemijl per uur. Er is voldoende brandstof, geschikt voor gebruik bij de temperaturen die in het
      vaargebied van het vaartuig te verwachten zijn, aan boord om de vol beladen reddingsboot gedurende ten minste 24
      uur met een vaart van 6 zeemijl per uur te laten varen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.6.i
    text: |-
      De motor van de reddingsboot, de overbrenging en de motoraccessoires zijn omgeven door een brandwerende omkasting
      of door geschikte voorzieningen die soortgelijke bescherming bieden. Dergelijke voorzieningen bieden tevens
      bescherming tegen onopzettelijke aanraking van hete of bewegende delen van de motor door personen en beschermen
      de motor tegen blootstelling aan weersinvloeden en zeewater. Er zijn doeltreffende maatregelen getroffen om het
      lawaai van de motor te beperken. Startaccumulatoren zijn aangebracht in omkastingen die een waterdichte ruimte
      vormen rondom de bodem en de zijden van de accumulatoren. De omkastingen hebben goed sluitende deksels waarin
      voorzieningen zijn aangebracht waardoor gassen kunnen ontsnappen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.6.j
    text: |-
      De motor van de reddingsboot en de accessoires zijn zo ontworpen dat geen elektromagnetische velden ontstaan die
      een storende invloed hebben op de radioapparatuur die in de reddingsboot wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.6.k
    text: |-
      Er zijn voorzieningen om alle accumulatoren ten behoeve van het starten van de motor, de radioapparatuur en het
      zoeklicht op te laden. De radioaccumulatoren mogen niet worden gebruikt om stroom te leveren voor het starten
      van de motor. Er zijn voorzieningen om de accumulatoren van de reddingsboot door middel van het scheepsnet op te
      laden met een voedingsspanning die niet hoger is dan 55 Volt, en die op de inschepingsplaats van de reddingsboot
      ontkoppeld kunnen worden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.6.l
    text: |-
      Er zijn waterbestendige start- en bedieningsvoorschriften van de motor voorhanden, die duidelijk waarneembaar nabij
      de bedieningsplaats van de motor zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.7
    text: '*Toebehoren van reddingsboten*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.7.a
    text: |-
      Alle reddingsboten zijn voorzien van ten minste één aftap, aangebracht bij het laagste punt in de romp, die
      automatisch opent om water uit de boot te lozen wanneer de reddingsboot niet in het water ligt, en die automatisch
      afsluit om te voorkomen dat er water binnendringt wanneer de reddingsboot in het water ligt. Om de aftap te
      kunnen afsluiten is deze voorzien van een dop of prop die met een lijn, ketting of ander geschikt middel aan
      de reddingsboot verbonden is. De aftappen zijn in de reddingsboot gemakkelijk bereikbaar en de plaats ervan is
      duidelijk aangegeven.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.7.b
    text: |-
      Alle reddingsboten beschikken over een roer en een helmstok. Indien ook een stuurrad of een ander mechanisme
      voor afstandsbesturing is aangebracht, moet een helmstok bij een storing in het stuurmechanisme het roer kunnen
      bedienen. Het roer is permanent aan de reddingsboot bevestigd. De helmstok is permanent aangebracht op of
      verbonden met de roerkoning. Indien de reddingsboot echter een mechanische afstandsbesturing heeft, mag de helmstok
      wegneembaar zijn mits deze deugdelijk is bevestigd nabij de roerkoning. Het roer en de helmstok zijn zo uitgevoerd
      dat zij niet beschadigd worden bij het gebruik van het ontkoppelingsmiddel of de schroef.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.7.c
    text: |-
      Uitgezonderd in de omgeving van roer en schroef is langs de buitenzijde van de reddingsboot een in bogen hangende
      drijvende grijplijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.7.d
    text: |-
      Reddingsboten die, indien omgeslagen, zich niet vanzelf oprichten, zijn voorzien van handgrepen aan de onderzijde
      die personen de mogelijkheid bieden om zich aan de reddingsboot vast te houden. Indien aan de onderzijde van de
      romp van een reddingsboot handgrepen zijn aangebracht, zijn deze zodanig aan de reddingsboot bevestigd dat de
      reddingsboot niet wordt beschadigd indien de handgrepen door een kracht van buiten afbreken.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.7.e
    text: |-
      Alle reddingsboten zijn uitgerust met voldoende waterdichte kasten of compartimenten om bergruimte te bieden aan
      kleine uitrustingsstukken, water en andere benodigdheden, voorgeschreven in het achtste lid. Er zijn voorzieningen
      aanwezig voor het opslaan van opgevangen regenwater.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.7.f
    text: |-
      Iedere reddingsboot die door middel van een loper of lopers te water wordt gelaten, is uitgerust met een
      ontkoppelingsmiddel dat aan de volgende eisen voldoet:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.7.f.1°
    text: het mechanisme is zo uitgevoerd dat alle haken gelijktijdig ontkoppeld worden;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.7.f.2°
    text: 'het mechanisme heeft de volgende twee ontkoppelingsmogelijkheden:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.7.f.2°.a
    text: |-
      een normale ontkoppelingsmogelijkheid die de reddingsboot kan ontkoppelen wanneer deze in het water ligt of wanneer
      de haken onbelast zijn, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.7.f.2°.b
    text: |-
      een belaste ontkoppelingsmogelijkheid die de reddingsboot kan ontkoppelen wanneer de haken belast zijn. Deze
      ontkoppeling is zo uitgevoerd dat de reddingsboot wordt ontkoppeld onder alle beladingstoestanden, reikend
      van onbelast met de reddingsboot in het water liggend tot een belasting van 1,1 keer de totale massa van de
      reddingsboot met volle bezetting en volledige uitrusting. Deze ontkoppelingsmogelijkheid is voldoende beschermd
      tegen ongewild of voortijdig gebruik;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.7.f.3°
    text: de ontkoppelingsbediening is duidelijk aangegeven in een kleur die contrasteert met die van de omgeving, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.7.f.4°
    text: |-
      het mechanisme is ontworpen met een veiligheidsfactor van 6, gebaseerd op de treksterkte van het gebruikte
      materiaal, waarbij aangenomen wordt dat de massa van de reddingsboot gelijkelijk verdeeld is over de lopers.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.7.g
    text: |-
      Iedere reddingsboot is uitgerust met een ontkoppelingsmiddel waarmee de voorvanglijn kan worden ontkoppeld wanneer
      daar kracht op staat.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.7.h
    text: |-
      Iedere reddingsboot die voorzien is van een vast opgestelde VHF-installatie met een aparte antenne beschikt over
      voorzieningen om de antenne doelmatig in de gebruiksopstelling te kunnen plaatsen en vast te zetten.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.7.i
    text: |-
      Reddingsboten die zijn bestemd om langs de zijden van het vaartuig te water te worden gelaten beschikken over de
      noodzakelijke glijspanten en stootdempers om het te water laten mogelijk te maken en schade aan de reddingsboot
      te voorkomen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.7.j
    text: |-
      Op het hoogste punt van de overkapping is een met de hand in- en uitschakelbare lamp aangebracht die bij donkere
      nacht en heldere atmosfeer over een afstand van ten minste 2 zeemijl gedurende ten minste 12 uur zichtbaar is.
      Indien de lamp een flikkerlicht geeft, bedraagt de frequentie ten minste 50 flikkeringen per minuut gedurende de
      eerste 2 van de 12 gebruiksuren.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.7.k
    text: |-
      Aan de binnenzijde van de reddingsboot is een lamp of andere lichtbron aangebracht die gedurende ten minste 12 uur
      voldoende licht geeft om daarbij aanwijzingen en instructies te kunnen lezen. Olielampen zijn voor dit doel niet
      toegestaan.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.7.l
    text: |-
      Tenzij uitdrukkelijk anders bepaald is iedere reddingsboot voorzien van doelmatige middelen om te lozen of
      automatisch zelflozend.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.7.m
    text: |-
      Iedere reddingsboot is zo ingericht dat men vanaf de besturingsplaats voldoende uitzicht vooruit, achteruit en naar
      de zijden heeft in verband met het veilig te water laten en het manoeuvreren.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.8
    text: |-
      *Uitrusting van reddingsboten* Alle uitrustingsstukken van een reddingsboot, of die nu in dit lid of elders in
      dit hoofdstuk worden voorgeschreven, met uitzondering van de bootshaken die beschikbaar moeten blijven om de
      reddingsboten af te houden, zijn in de reddingsboot vastgezet door middel van sjorringen, opgeborgen in kasten
      of compartimenten, bevestigd in beugels of soortgelijke armaturen of op andere geschikte wijze. De uitrusting is
      zo vastgezet dat zij geen belemmering vormt bij «schip verlaten». Alle uitrustingsstukken zijn zo klein mogelijk,
      zo licht mogelijk, en zijn op doeltreffende en compacte wijze verpakt. Tenzij anders bepaald bestaat de normale
      uitrusting van elke reddingsboot uit:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.8.1°
    text: |-
      voldoende drijvende riemen om in kalme zee vooruit te kunnen komen. Voor iedere riem zijn er dollen, steunen of
      gelijkwaardige voorzieningen aanwezig. De dollen of steunen zijn met lijnen of kettingen aan de boot bevestigd;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.8.2°
    text: twee bootshaken;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.8.3°
    text: een drijvend hoosvat en twee emmers;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.8.4°
    text: aanwijzingen voor het overleven op zee;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.8.5°
    text: |-
      een nachthuis met een doelmatig kompas dat lichtgevend is of voorzien is van een doelmatige verlichting. In een
      geheel overdekte reddingsboot is het nachthuis permanent aangebracht bij de besturingsplaats; in iedere andere
      reddingsboot zijn er geschikte voorzieningen om het nachthuis op te stellen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.8.6°
    text: |-
      een drijfanker van voldoende grootte met een schokbestendige sleeplijn en een kaailijn die een goede greep biedt
      in natte toestand. De sterkte van het drijfanker, de sleeplijn en de kaailijn is geschikt voor elke toestand van
      de zee;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.8.7°
    text: |-
      twee doelmatige vanglijnen met een lengte van niet minder dan tweemaal de afstand van de opstellingsplaats van de
      reddingsboot tot delaagst gelegen lastlijn van het vaartuig in zeewater of 15 m, welke van beide het grootste is.
      Eén vanglijn, bevestigd aan het ontkoppelingsmechanisme, voorgeschreven in het zevende lid, onder g, ligt aan de
      voorkant van de reddingsboot gereed en de andere ligt in de reddingsboot gereed en is stevig vastgezet bij of in de
      buurt van de boeg;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.8.8°
    text: twee bijlen, één aan ieder eind van de reddingsboot;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.8.9°
    text: |-
      waterdichte houders die samen 3 liter zoet water bevatten voor iedere persoon waarvoor in de reddingsboot ruimte is
      bestemd; hiervan mag 1 liter per persoon vervangen worden door een ontziltingsapparaat dat in 2 etmalen een gelijke
      hoeveelheid zoet water kan produceren;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.8.10°
    text: een roestvrije aker met lijn;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.8.11°
    text: een roestvrije drinkbeker met maatverdeling;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.8.12°
    text: |-
      een noodrantsoen met een voedingswaarde van ten minste 10 000 kJ voor iedere persoon waarvoor in de reddingsboot
      ruimte is bestemd; deze noodrantsoenen worden bewaard in een luchtdichte verpakking en zijn opgeborgen in een
      waterdichte houder;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.8.13°
    text: |-
      vier valschermsignalen die voldoen aan het bepaalde in [artikel 7.29][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.17.8.14°
    text: |-
      zes handstakellichten die voldoen aan het bepaalde in [artikel 7.30][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.17.8.15°
    text: |-
      twee drijvende rooksignalen die voldoen aan het bepaalde in [artikel 7.31][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.17.8.16°
    text: |-
      een waterdichte elektrische lantaarn geschikt voor het geven van morseseinen, alsmede een stel reservebatterijen en
      een reservelamp, verpakt in een waterdichte houder;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.8.17°
    text: een dagseinspiegel met gebruiksaanwijzingen voor het seinen naar vaartuigen, schepen en vliegtuigen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.8.18°
    text: |-
      een exemplaar van een door het Hoofd van de Scheepvaartinspectie vast te stellen lijst van reddingsseinen,
      afgedrukt op een waterbestendige kaart of opgeborgen in een waterdichte verpakking;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.8.19°
    text: een fluit of een gelijkwaardig middel voor het geven van geluidssignalen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.8.20°
    text: |-
      een waterdichte medicijnkist die na gebruik weer goed gesloten kan worden, met een bij ministeriële regeling vast
      te stellen inhoud, met de daarbij behorende controlelijst en handleidingen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.8.21°
    text: |-
      voor iedere persoon waarvoor in de reddingsboot ruimte is bestemd, zes doses van een middel tegen zeeziekte en een
      zak voor overgeven bij zeeziekte;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.8.22°
    text: een zakmes dat met een lijn aan de reddingsboot verbonden moet blijven;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.8.23°
    text: drie blikopeners;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.8.24°
    text: twee drijvende werplijnen van ten minste 30 m lengte, ieder voorzien van een drijvende werpring;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.8.25°
    text: een handpomp;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.8.26°
    text: een vislijn met haken;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.8.27°
    text: voldoende gereedschap voor kleinere reparaties aan de motor en de accessoires;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.8.28°
    text: een draagbaar brandblustoestel geschikt voor het blussen van oliebranden;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.8.29°
    text: |-
      een zoeklicht dat een lichtgekleurd voorwerp van 18 m breedte op 180 m afstand bij nacht gedurende in totaal 6 uur,
      waarvan ten minste 3 uur achtereen, doelmatig kan verlichten;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.8.30°
    text: |-
      een doelmatige radarreflector, tenzij een radartransponder voor groepsreddingsmiddelen in de reddingsboot is
      geplaatst;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.8.31°
    text: |-
      hulpmiddelen tegen warmteverlies die voldoen aan het bepaalde in [artikel 7.26][ref1], voldoende voor 2 personen
      of 10% van het aantal personen waarvoor in de reddingsboot ruimte is bestemd, welke van beide het grootste is;


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.17.8.32°
    text: |-
      voor vaartuigen die reizen maken waarvan aard en duur zodanig zijn dat naar het oordeel van het Hoofd van de
      Scheepvaartinspectie de onder 12° en 26° voorgeschreven uitrustingsartikelen niet noodzakelijk zijn, kan hij
      vrijstelling verlenen van die bepalingen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.9
    text: '*Merken op reddingsboten*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.9.a
    text: |-
      De afmetingen van de reddingsboot en het aantal personen waarvoor in de reddingsboot ruimte is bestemd zijn in
      duidelijke, onuitwisbare tekens daarop aangegeven.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.9.b
    text: |-
      De naam en thuishaven van het vaartuig waartoe de reddingsboot behoort zijn aan beide zijden van de voorsteven van
      de reddingsboot aangebracht in blokletters.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.17.9.c
    text: |-
      Middelen ter identificatie van het vaartuig waartoe de reddingsboot behoort en het nummer van de reddingsboot zijn
      zodanig aangebracht dat zij vanuit de lucht zichtbaar zijn.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.17
  - number: 7.18.1
    text: |-
      Behalve aan het bepaalde in [artikel 7.17][ref1] voldoen zichzelf oprichtende, gedeeltelijk overdekte reddingsboten
      mede aan het bepaalde in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.18
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.18.2
    text: '*Overkapping*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.18
  - number: 7.18.2.a
    text: |-
      Zichzelf oprichtende gedeeltelijk overdekte reddingsboten zijn voorzien van permanent aangebrachte, vaste
      overkappingen die zich uitstrekken over tenminste 20% van de lengte van de reddingsboot vanaf de voorsteven en
      tenminste 20% van de lengte van de reddingsboot vanaf het achterste gedeelte van de reddingsboot.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.18
  - number: 7.18.2.b
    text: |-
      De vaste overkappingen vormen twee schuilplaatsen. Indien de schuilplaatsen schotten hebben, zijn daarin openingen
      aangebracht van voldoende grootte om gemakkelijk toegang te bieden aan personen die een overlevingspak of warme
      kleding en een reddingsgordel dragen. De hoogte binnen de schuilplaats is voldoende om personen gemakkelijk toegang
      te bieden naar hun plaatsen in de voor- en achtersteven van de reddingsboot.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.18
  - number: 7.18.2.c
    text: |-
      De vaste overkappingen zijn voorzien van vensters of doorzichtige panelen die voldoende daglicht binnen de
      reddingsboot kunnen toelaten als de ingangen of de opvouwbare overkappingen gesloten zijn, zodat kunstlicht onnodig
      is.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.18
  - number: 7.18.2.d
    text: |-
      De vaste overkappingen hebben handgrepen die houvast bieden aan personen die zich langs de buitenkant van de
      reddingsboot verplaatsen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.18
  - number: 7.18.2.e
    text: |-
      De open gedeelten van de reddingsboot zijn uitgerust met een permanent aangebrachte opvouwbare overkapping die
      zodanig is ingericht dat:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.18
  - number: 7.18.2.e.1°
    text: deze in niet meer dan twee minuten gemakkelijk opgezet kan worden door niet meer dan twee personen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.18
  - number: 7.18.2.e.2°
    text: |-
      deze isolerend is teneinde de inzittenden te beschermen tegen warmte en kou door middel van ten minste twee lagen
      materiaal gescheiden door een luchtlaag, of door andere even doeltreffende middelen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.18
  - number: 7.18.2.f
    text: 'De overkapping die wordt gevormd door het vaste en het opvouwbare gedeelte is zo uitgevoerd dat:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.18
  - number: 7.18.2.f.1°
    text: |-
      tewaterlating en weer aan boord plaatsing kunnen worden uitgevoerd zonder dat een van de inzittenden buiten de
      overkapping behoeft te komen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.18
  - number: 7.18.2.f.2°
    text: |-
      er aan beide einden en beide zijden ingangen zijn, voorzien van doelmatige, verstelbare middelen voor afsluiting,
      die gemakkelijk en snel van binnenuit en van buitenaf de reddingsboot geopend en gesloten kunnen worden zodat
      ventilatie mogelijk is, maar die zeewater, wind en kou buitensluiten; er zijn voorzieningen om de sluitingen in
      open of gesloten toestand vast te zetten;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.18
  - number: 7.18.2.f.3°
    text: |-
      er met opvouwbare overkapping opgezet en alle ingangen gesloten te allen tijde voldoende lucht voor de inzittenden
      wordt toegelaten;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.18
  - number: 7.18.2.f.4°
    text: er middelen zijn om regenwater op te vangen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.18
  - number: 7.18.2.f.5°
    text: |-
      de buitenkant van de vaste en de opvouwbare overkapping en de binnenzijde van dat gedeelte van de reddingsboot dat
      door de opvouwbare overkapping wordt overdekt, een goed zichtbare kleur heeft. De binnenkant van de schuilplaatsen
      heeft een kleur die voor de inzittenden niet hinderlijk is;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.18
  - number: 7.18.2.f.6°
    text: het mogelijk is met de reddingsboot te roeien.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.18
  - number: 7.18.3
    text: '*Omslaan en weer oprichten*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.18
  - number: 7.18.3.a
    text: |-
      Bij iedere aangegeven zitplaats is een veiligheidsgordel aangebracht. De veiligheidsgordel is zo ontworpen dat
      een persoon met een gewicht van 100 kg vast op zijn plaats wordt gehouden wanneer de reddingsboot in omgeslagen
      toestand verkeert.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.18
  - number: 7.18.3.b
    text: |-
      De stabiliteit van de reddingsboot is zodanig dat deze zich automatisch opricht indien zij beladen is met volle
      of gedeeltelijke bezetting en volledige of gedeeltelijke uitrusting, en de personen met hun veiligheidsgordel zijn
      vastgesjord.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.18
  - number: 7.18.4
    text: '*Voortstuwing*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.18
  - number: 7.18.4.a
    text: De motor en de overbrenging kunnen vanaf de plaats van de bestuurder worden bediend.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.18
  - number: 7.18.4.b
    text: |-
      De motor en motorinstallatie kunnen blijven draaien in iedere stand tijdens het omslaan en nadat de reddingsboot
      zich weer heeft opgericht, dan wel automatisch stoppen bij het omslaan en gemakkelijk opnieuw te starten zijn
      nadat de reddingsboot zich weer heeft opgericht en het water uit de reddingsboot is geloosd. De brandstof- en
      smeersystemen zijn zodanig uitgevoerd dat geen brandstofolie en niet meer dan 250 ml smeerolie uit de motor wordt
      verloren tijdens het omslaan.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.18
  - number: 7.18.4.c
    text: |-
      Luchtgekoelde motoren zijn voorzien van een systeem om koellucht aan te zuigen uit en af te voeren naar de
      buitenlucht. Er zijn met de hand bedienbare kleppen aangebracht om koellucht aan te zuigen uit en af te voeren in
      de reddingsboot.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.18
  - number: 7.18.5
    text: '*Constructie en stootdempers*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.18
  - number: 7.18.5.a
    text: |-
      Onverminderd het bepaalde in [artikel 7.17, eerste lid, onder f][ref1], is een zichzelf oprichtende, gedeeltelijk
      overdekte reddingsboot zo gebouwd en van stootdempers voorzien dat zeker wordt gesteld dat de reddingsboot aan
      inzittenden bescherming biedt tegen schadelijke versnellingen als gevolg van een slag van de reddingsboot, beladen
      met volle bezetting en volledige uitrusting, tegen de scheepszijde met een stootsnelheid van ten minste 3,5 m/s.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.18
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.18.5.b
    text: Een zelf oprichtende, gedeeltelijk overdekte reddingsboot is automatisch zelflozend.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.18
  - number: 7.19.1
    text: |-
      Behalve aan het bepaalde in [artikel 7.17][ref1] voldoen geheel overdekte reddingsboten ook aan het bepaalde in
      dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.19
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.19.2
    text: |-
      *Overkapping* Iedere geheel overdekte reddingsboot is uitgerust met een waterdichte overkapping die de gehele
      reddingsboot overdekt. De overkapping is zo uitgevoerd dat:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.19
  - number: 7.19.2.a
    text: de inzittenden worden beschermd tegen hitte en kou;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.19
  - number: 7.19.2.b
    text: toegang tot de reddingsboot wordt geboden door luiken die waterdicht afgesloten kunnen worden;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.19
  - number: 7.19.2.c
    text: |-
      de luiken op zodanige plaatsen zijn aangebracht dat handelingen voor het te water laten en weer terugzetten van de
      boot kunnen worden uitgevoerd zonder dat daarbij een van de inzittenden de overdekte ruimte behoeft te verlaten;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.19
  - number: 7.19.2.d
    text: |-
      de toegangsluiken zowel van binnenuit als van buitenaf geopend en gesloten kunnen worden, en voorzien zijn van
      middelen om ze in open toestand vast te zetten;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.19
  - number: 7.19.2.e
    text: het mogelijk is met de reddingsboot te roeien;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.19
  - number: 7.19.2.f
    text: |-
      deze, indien de reddingsboot is gekapseisd en de luiken gesloten zijn, zonder lekkage van betekenis de gehele massa
      van de reddingsboot met volledige uitrusting en volle bezetting kan dragen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.19
  - number: 7.19.2.g
    text: |-
      aan iedere zijde vensters of doorzichtige panelen zijn aangebracht die voldoende daglicht binnen de reddingsboot
      toelaten wanneer de toegangsluiken gesloten zijn, zodat kunstlicht onnodig is;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.19
  - number: 7.19.2.h
    text: |-
      de buitenkant een goed zichtbare kleur heeft en de binnenkant een kleur heeft die voor de inzittenden niet
      hinderlijk is;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.19
  - number: 7.19.2.i
    text: |-
      handgrepen zijn aangebracht die houvast bieden aan personen die zich langs de buitenkant van de reddingsboot
      verplaatsen, en die steun geven bij in- en ontschepen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.19
  - number: 7.19.2.j
    text: |-
      personen vanaf een toegang hun zitplaatsen kunnen bereiken zonder over doften of andere obstakels te moeten
      klimmen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.19
  - number: 7.19.2.k
    text: |-
      de inzittenden beschermd zijn tegen de gevolgen van gevaarlijke atmosferische onderdruk die door de motor kan
      worden veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.19
  - number: 7.19.3
    text: '*Omslaan en weer oprichten*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.19
  - number: 7.19.3.a
    text: |-
      Er is bij iedere aangegeven zitplaats een veiligheidsgordel aangebracht. De veiligheidsgordel is zo ontworpen dat
      een persoon met een gewicht van 100 kg vast op zijn plaats wordt gehouden wanneer de reddingsboot is omgeslagen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.19
  - number: 7.19.3.b
    text: |-
      De stabiliteit van de reddingsboot is zodanig dat deze zich vanzelf opricht indien zij beladen is met de volle of
      gedeeltelijke bezetting en volledige of gedeeltelijke uitrusting, alle toegangen en openingen waterdicht afgesloten
      zijn en de personen met hun veiligheidsgordel zijn vastgezet.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.19
  - number: 7.19.3.c
    text: |-
      De reddingsboot kan de volle bezetting en de volledige uitrusting dragen wanneer de reddingsboot in de in
      [artikel 7.17, eerste lid, onder a][ref1], omschreven beschadigde toestand verkeert, en de stabiliteit is zodanig
      dat in het geval de reddingsboot omslaat zij automatisch een stand verkrijgt waarbij ontsnapping boven water voor
      de inzittenden mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.19
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.19.3.d
    text: |-
      Het ontwerp van uitlaatpijpen van de motor, luchtkanalen en andere openingen is zodanig dat water buiten de motor
      wordt gehouden wanneer de reddingsboot omslaat en zich weer opricht.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.19
  - number: 7.19.4
    text: '*Voortstuwing*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.19
  - number: 7.19.4.a
    text: De motor en de overbrenging kunnen vanaf de bestuurdersplaats worden bediend.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.19
  - number: 7.19.4.b
    text: |-
      De motor en motorinstallatie kunnen blijven draaien in iedere stand tijdens het omslaan en nadat de reddingsboot
      zich weer heeft opgericht, dan wel stoppen automatisch bij het omslaan en zijn gemakkelijk opnieuw te starten
      nadat de reddingsboot zich weer heeft opgericht. De brandstof- en smeersystemen zijn zodanig uitgevoerd dat geen
      brandstofolie en niet meer dan 250 ml smeerolie uit de motor wordt verloren tijdens het omslaan.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.19
  - number: 7.19.4.c
    text: |-
      Luchtgekoelde motoren zijn voorzien van een systeem om koellucht aan te zuigen uit en af te voeren naar de
      buitenlucht. Er zijn met de hand bedienbare kleppen aangebracht om koellucht aan te zuigen uit en af te voeren in
      de reddingsboot.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.19
  - number: 7.19.5
    text: |-
      *Constructie en stootdempers* Onverminderd het bepaalde in [artikel 7.17, eerste lid, onder f][ref1], is een geheel
      overdekte reddingsboot zo gebouwd en van stootdempers voorzien dat deze aan inzittenden bescherming biedt tegen
      schadelijke versnellingen als gevolg van een slag van de reddingsboot, beladen met volle bezetting en volledige
      uitrusting, tegen de scheepszijde met een stootsnelheid van ten minste 3,5 m/s.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.19
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.19.6
    text: |-
      *Reddingsboten die door middel van vrije val te water worden gelaten* Een vrije-val reddingsboot is zodanig
      geconstrueerd dat hij bescherming biedt tegen schadelijke versnellingen als gevolg van het te water laten, beladen
      met volle bezetting en volledige uitrusting, vanaf ten minste zijn opstelplaats boven de waterlijn tot de laagst
      gelegen lastlijn onder ongunstige trimomstandigheden tot maximaal 10° en met een minimale slagzij van 20° over
      elke zijde.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.19
  - number: 7.20.1
    text: '*Constructie van reddingsvlotten*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.1.a
    text: |-
      Een reddingsvlot is zo vervaardigd dat het in zee gedurende 30 dagen bestand is tegen blootstelling aan invloeden
      van weer en zee in alle toestanden van zeegang.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.1.b
    text: |-
      Een reddingsvlot is zo vervaardigd dat het, indien het van een hoogte van 18 m in het water wordt geworpen, het
      vlot en de uitrusting naar behoren blijven werken. Wanneer het reddingsvlot op een hoogte van meer dan 18 m boven
      de laagst gelegen lastlijn van het vaartuig in zeewater wordt geplaatst, is het van een type dat een valproef van
      ten minste die hoogte met goed gevolg heeft doorstaan.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.1.c
    text: |-
      Het drijvende reddingsvlot is bestand tegen herhaalde sprongen daarop vanaf een hoogte van ten minste 4,5 m boven
      de vloer van het vlot, zowel met als zonder opstaande overkapping.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.1.d
    text: |-
      Een reddingsvlot met toebehoren is zo vervaardigd dat het met zijn volle bezetting en volledige uitrusting en met
      een van de drijfankers uitgebracht, in kalm water met een vaart van 3 zeemijl per uur kan worden gesleept.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.1.e
    text: |-
      Het reddingsvlot heeft een overkapping die automatisch wordt opgezet wanneer het vlot te water wordt gelaten
      teneinde de inzittenden te beschermen tegen weersinvloeden. De overkapping voldoet aan de volgende eisen:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.1.e.1°
    text: |-
      zij biedt bescherming tegen hitte en koude door middel van twee lagen materiaal, gescheiden door een luchtlaag,
      of door andere, even doeltreffende middelen. Er zijn voorzieningen getroffen om het binnendringen van water in de
      luchtlaag te voorkomen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.1.e.2°
    text: de binnenkant heeft een kleur die voor de inzittenden van het reddingsvlot niet hinderlijk is;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.1.e.3°
    text: |-
      elke ingang is duidelijk aangegeven en is voorzien van doeltreffende, verstelbare afsluitingen die zeewater,
      wind en kou buitensluiten, en die gemakkelijk en snel van binnenuit en van buitenaf geopend kunnen worden zodat
      ventilatie mogelijk is. Reddingsvlotten bestemd voor meer dan 8 personen hebben ten minste twee tegenover elkaar
      gelegen ingangen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.1.e.4°
    text: zij laten te allen tijde, zelfs met afgesloten ingangen, voldoende lucht voor de inzittenden toe;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.1.e.5°
    text: zij zijn voorzien van ten minste één uitkijkopening;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.1.e.6°
    text: zij zijn voorzien van middelen voor het opvangen van regenwater;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.1.e.7°
    text: onder alle delen van de overkapping wordt voldoende hoofdruimte geboden aan de inzittenden in zittende houding.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.2
    text: '*Minimum draagvermogen en massa van reddingsvlotten*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.2.a
    text: |-
      Een reddingsvlot, geschikt voor minder dan zes personen, berekend met gebruik van het bepaalde in
      [artikel 7.21, derde lid][ref1], of [7.22, derde lid][ref2], wordt niet goedgekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.20.2.b
    text: |-
      Tenzij een reddingsvlot te water gelaten wordt door een goedgekeurd tewaterlatingsmiddel dat voldoet aan het
      bepaalde in [artikel 7.32][ref1], en zulk een reddingsvlot bovendien niet draagbaar behoeft te zijn, mag de totale
      massa van een reddingsvlot, de verpakking en de uitrusting niet meer dan 185 kg bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.20.3
    text: '*Voorzieningen voor reddingsvlotten*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.3.a
    text: Langs de binnen- en buitenzijde van het reddingsvlot zijn stevig vastgezette grijplijnen aangebracht.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.3.b
    text: |-
      Het reddingsvlot is uitgerust met een doelmatige vanglijn met een lengte van niet minder dan 15 m of van tweemaal
      de afstand vanaf de opstellingsplaats tot de laagst gelegen lastlijn van het vaartuig in zeewater, welke van beide
      het grootste is.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.4
    text: '*Strijkbare reddingsvlotten*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.4.a
    text: 'In aanvulling op de bovenstaande bepalingen voldoet een reddingsvlot van het strijkbare type aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.4.a.1°
    text: |-
      wanneer het reddingsvlot beladen is met de volle bezetting en volledige uitrusting kan het een zijdelingse slag
      tegen de scheepshuid met een stootsnelheid van ten minste 3,5 m/s en tevens een val op het water van een hoogte van
      ten minste 3 m doorstaan, zonder dat schade ontstaat waardoor de goede werking wordt aangetast, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.4.a.2°
    text: |-
      het is voorzien van middelen om het reddingsvlot langs het inschepingsdek te brengen en daar te houden gedurende
      de inscheping.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.4.b
    text: |-
      Ieder reddingsvlot van het strijkbare type is zo ingericht dat het volledige aantal personen waarvoor het vlot is
      bestemd, zich kan inschepen in niet meer dan 3 minuten vanaf het moment dat het bevel tot inscheping wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.5
    text: '*Uitrusting*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.5.a
    text: 'De standaarduitrusting van ieder reddingsvlot bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.5.a.1°
    text: een drijvende werplijn van ten minste 30 m lengte waarvan het ene uiteinde is voorzien van een drijvende werpring;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.5.a.2°
    text: |-
      een mes van een niet vouwbaar type met een heft dat blijft drijven, verbonden aan het vlot met een lijn en geborgen
      in een zak op de buitenkant van de overkapping nabij de plaats waar de vanglijn aan het reddingsvlot is bevestigd.
      Daarnaast is een reddingsvlot dat is bestemd voor 13 of meer personen voorzien van een tweede mes dat van een
      opvouwbaar type mag zijn;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.5.a.3°
    text: |-
      een drijvend hoosvat. Een reddingsvlot dat is bestemd voor 13 of meer personen is uitgerust met twee drijvende
      hoosvaten;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.5.a.4°
    text: twee sponzen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.5.a.5°
    text: |-
      twee drijfankers, ieder met een schokbestendige sleeplijn en kaailijn, waarvan er één dient als reserve en één
      blijvend aan het reddingsvlot is bevestigd en wel op een zodanige manier dat wanneer het reddingsvlot opgeblazen
      wordt of in het water ligt, het drijfanker er automatisch voor zorgt dat het reddingsvlot op de meest stabiele
      wijze met de kop op de wind komt te liggen. De sterkte van het drijfanker, de sleeplijn en de kaailijn is geschikt
      voor elke toestand van de zee. De drijfankers zijn voorzien van een lijn met aan beide zijden een wartel en zijn
      zodanig geconstrueerd dat het onwaarschijnlijk is dat zij zich tussen de tuiglijnen binnenstebuiten keren;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.5.a.6°
    text: twee drijvende peddels;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.5.a.7°
    text: drie blikopeners of drie veiligheidsmessen die voorzien zijn van een blikopener;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.5.a.8°
    text: |-
      een waterdichte medicijnkist die na gebruik weer goed gesloten kan worden, met een bij ministeriële regeling vast
      te stellen inhoud, met de daarbij behorende controlelijst en handleidingen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.5.a.9°
    text: een fluit of een gelijkwaardig middel voor het geven van geluidssignalen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.5.a.10°
    text: |-
      vier valschermsignalen die voldoen aan het bepaalde in [artikel 7.29][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.20.5.a.11°
    text: |-
      zes handstakellichten die voldoen aan het bepaalde in [artikel 7.30][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.20.5.a.12°
    text: |-
      twee drijvende rooksignalen die voldoen aan het bepaalde in [artikel 7.31][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.20.5.a.13°
    text: |-
      een waterdichte elektrische lantaarn geschikt voor het geven van morseseinen, alsmede een stel reservebatterijen en
      een reservelamp, verpakt in een waterdichte houder;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.5.a.14°
    text: een doelmatige radarreflector of radartransponder;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.5.a.15°
    text: een dagseinspiegel met gebruiksaanwijzingen voor het seinen naar vaartuigen, schepen en vliegtuigen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.5.a.16°
    text: |-
      een exemplaar van een door het Hoofd van de Scheepvaartinspectie vastgestelde lijst van reddingsseinen, afgedrukt
      op een waterbestendige kaart of opgeborgen in een waterdichte verpakking;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.5.a.17°
    text: een vislijn met haken;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.5.a.18°
    text: |-
      een noodrantsoen met een voedingswaarde van ten minste 10 000 kJ voor elk van de personen waarvoor het reddingsvlot
      is bestemd; deze noodrantsoenen worden bewaard in een luchtdichte verpakking en zijn geborgen in een waterdichte
      houder;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.5.a.19°
    text: |-
      waterdichte houders die samen 1,5 liter zoet water bevatten voor elk van de personen waarvoor het reddingsvlot
      is bestemd; hiervan mag 0,5 liter per persoon vervangen worden door een ontziltingsapparaat dat in 2 etmalen een
      gelijke hoeveelheid zoet water kan produceren;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.5.a.20°
    text: een roestvrije drinkbeker met maatverdeling;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.5.a.21°
    text: |-
      voor elk van de personen waarvoor het reddingsvlot is bestemd, zes doses van een middel tegen zeeziekte en een zak
      voor overgeven bij zeeziekte;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.5.a.22°
    text: aanwijzingen voor het overleven op zee;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.5.a.23°
    text: instructies omtrent maatregelen die onmiddellijk na inscheping in het vlot worden genomen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.5.a.24°
    text: |-
      hulpmiddelen tegen warmteverlies die voldoen aan het bepaalde in [artikel 26][ref1], voldoende voor 2 personen
      of 10% van het aantal personen waarvoor het reddingsvlot is bestemd, welke van beide het grootste is.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.20.5.b
    text: |-
      De aanduiding betreffende het bij het reddingsvlot verpakte type noodpakket, voorgeschreven in
      [artikel 7.21, zevende lid, onder c, 5°][ref1] en [7.22, zevende lid, 7°][ref2], op reddingsvlotten die
      overeenkomstig het voorgaande lid zijn uitgerust, is: «SOLAS-A-PACK» in blokletters.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.20.5.c
    text: |-
      De daartoe geschikte onderdelen van de uitrusting worden geborgen in een verpakking die, wanneer deze geen
      volledig onderdeel is van of blijvend bevestigd is aan het reddingsvlot, wordt geborgen en vastgezet binnen het
      reddingsvlot, en die ten minste 30 minuten in het water kan drijven zonder dat de inhoud wordt beschadigd.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.6
    text: '*Voorzieningen voor het vrij opdrijven van reddingsvlotten*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.6.a
    text: |-
      *Vanglijnsysteem* Het vanglijnsysteem van een reddingsvlot vormt een verbinding tussen het vaartuig en het
      reddingsvlot, en is zo ingericht dat het reddingsvlot, wanneer het ontkoppeld is en, in het geval van een
      opblaasbaar reddingsvlot, wanneer het opgeblazen is, niet door het zinkende vaartuig onder water getrokken kan
      worden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.6.b
    text: |-
      *Breekdraad* Indien in de voorziening voor vrij opdrijven een breekdraad wordt toegepast, voldoet deze aan de
      volgende eisen:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.6.b.1°
    text: hij mag niet breken bij de kracht die nodig is om de vanglijn uit de verpakking van het reddingsvlot te trekken;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.6.b.2°
    text: indien van toepassing, mag hij niet breken bij het opblazen van het reddingsvlot; en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.6.b.3°
    text: hij breekt bij een kracht van 2,2 kN ± 0,4 kN.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.6.c
    text: |-
      *Hydrostatisch ontkoppelingssysteem* Indien in de voorziening voor vrij opdrijven een hydrostatisch
      ontkoppelingssysteem wordt toegepast, voldoet dit aan de volgende eisen:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.6.c.1°
    text: |-
      het is vervaardigd uit niet op elkaar inwerkende materialen, om te voorkomen dat het systeem onklaar raakt.
      Gegalvaniseerde of op andere wijze met metaal bedekte delen mogen niet worden gebruikt als onderdelen van het
      systeem;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.6.c.2°
    text: het reddingsvlot wordt automatisch ontkoppeld op een diepte onder water van niet meer dan 4 m;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.6.c.3°
    text: |-
      het heeft afvoergaten om te voorkomen dat een opeenhoping van water in de hydrostatische ruimte ontstaat, wanneer
      de inrichting normaal is opgesteld;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.6.c.4°
    text: het is zo vervaardigd dat ontkoppeling bij overkomend water wordt voorkomen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.6.c.5°
    text: het is op de buitenkant onuitwisbaar gemerkt met type en serienummer;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.6.c.6°
    text: |-
      aan boord van een vaartuig dat voorzien is van een dergelijk systeem, is een document aanwezig waarop de datum van
      fabricage, het type en het serienummer vermeld zijn;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.6.c.7°
    text: |-
      het is zo ontworpen dat ieder onderdeel dat is verbonden met het vanglijnsysteem, een sterkte heeft die niet minder
      is dan die, vereist voor de vanglijn;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.20.6.c.8°
    text: |-
      indien het van het wegwerptype is dan zijn instructies aanwezig aangaande de vaststelling van de verloopdatum en
      middelen om deze datum op het mechanisme aan te geven.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.20
  - number: 7.21.1
    text: |-
      In aanvulling op het bepaalde in [artikel 7.20][ref1] voldoen automatisch opblaasbare reddingsvlotten tevens aan
      het bepaalde in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.21.2
    text: '*Constructie van automatisch opblaasbare reddingsvlotten*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.2.a
    text: |-
      De hoofddrijfkamer is in ten minste twee afzonderlijke compartimenten verdeeld, die ieder via een terugslagklep
      worden opgeblazen. De drijfkamers zijn zo ontworpen dat, wanneer een van de compartimenten is beschadigd of zich
      niet opblaast, de overige compartimenten die nog intact zijn, het reddingsvlot drijvend kunnen houden met positief
      vrijboord rondom en met het aantal personen waarvoor het reddingsvlot is bestemd, ieder met een massa van 75 kg en
      zittend op de normale plaats.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.2.b
    text: 'De vloer van een reddingsvlot is waterdicht en biedt voldoende bescherming tegen koude, hetzij:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.2.b.1°
    text: |-
      door middel van een of meer compartimenten die door de inzittenden opgeblazen kunnen worden of die zich automatisch
      opblazen, en door de inzittenden ontlucht en weer opgeblazen kunnen worden, hetzij
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.2.b.2°
    text: door andere, even doelmatige middelen, die niet afhankelijk zijn van opblazen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.2.c
    text: |-
      Het reddingsvlot wordt opgeblazen met een niet-giftig gas. Het opblazen wordt bij een omgevingstemperatuur tussen
      18°C en 20°C binnen 1 minuut en bij een omgevingstemperatuur van minus 30°C binnen 3 minuten voltooid. Na het
      opblazen behoudt het reddingsvlot zijn vorm, ook wanneer het beladen is met de volle bezetting en volledige
      uitrusting.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.2.d
    text: |-
      Ieder opblaasbaar compartiment kan een druk van ten minste driemaal de werkdruk doorstaan; door middel van een
      overdrukventiel of door beperkte gastoevoer wordt voorkomen dat een druk groter dan tweemaal de werkdruk, wordt
      bereikt. Er zijn voorzieningen om de luchtpomp of blaasbalg, voorgeschreven in het tiende lid, onder a, 2°, zodanig
      aan te sluiten dat de werkdruk gehandhaafd kan worden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.3
    text: |-
      *Draagvermogen van automatisch opblaasbare reddingsvlotten* Het aantal personen waarvoor een reddingsvlot wordt
      goedgekeurd, is gelijk aan het kleinste van de volgende getallen:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.3.1°
    text: |-
      het grootste gehele getal verkregen door de inhoud van de opgeblazen hoofddrijfkamers, waarbij noch de bogen noch
      de doften, indien aangebracht, mogen worden meegerekend, uitgedrukt in kubieke meters, te delen door 0,096,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.3.2°
    text: |-
      het grootste gehele getal verkregen door de oppervlakte van de vloer van het opgeblazen reddingsvlot, gemeten tot
      de binnenste rand van de drijfkamer, waarbij de doft of doften, indien aangebracht, wel mogen worden meegerekend,
      uitgedrukt in vierkante meters, te delen door 0,372, of
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.3.3°
    text: |-
      het aantal personen met een gemiddelde massa van 75 kg per persoon, allen met een reddingsgordel aan, dat
      gemakkelijk en met voldoende hoofdruimte, zittend plaats kan nemen, zonder het gebruik van enig uitrustingsstuk van
      het reddingsvlot te belemmeren.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.4
    text: '*Toegang tot automatisch opblaasbare reddingsvlotten*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.4.a
    text: |-
      Ten minste één ingang is voorzien van een in vorm blijvende inklimsteun om personen in staat te stellen vanuit zee
      in het reddingsvlot te klimmen; deze inklimsteun is zo aangebracht dat bij beschadiging van de steun aanzienlijk
      leeglopen van het reddingsvlot wordt voorkomen. Bij reddingsvlotten van het strijkbare type met meer dan een ingang
      is de inklimsteun aangebracht bij de ingang tegenover de aanhaaltalies en inschepingsvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.4.b
    text: |-
      Ingangen die niet zijn voorzien van een inklimsteun, hebben een inschepingsladder, waarvan de onderste trede ten
      minste 0,4 m beneden de waterlijn van het lege reddingsvlot kan reiken.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.4.c
    text: |-
      Aan de binnenzijde van het reddingsvlot zijn middelen aangebracht waarmee personen zichzelf vanaf de
      inschepingsladder in het reddingsvlot kunnen trekken.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.5
    text: '*Stabiliteit van automatisch opblaasbare reddingsvlotten*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.5.a
    text: |-
      Een opblaasbaar reddingsvlot is zo geconstrueerd, dat het in opgeblazen toestand en drijvend met opgezette
      overkapping, in zeegang voldoende stabiliteit bezit.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.5.b
    text: |-
      De stabiliteit van een reddingsvlot in omgekeerde toestand is zodanig dat het door één persoon zowel in zeegang als
      in kalme zee gekeerd kan worden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.5.c
    text: |-
      De stabiliteit van een reddingsvlot beladen met de volle bezetting en volledige uitrusting, is zodanig dat het in
      kalme zee gesleept kan worden met een snelheid van 3 zeemijl per uur.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.6
    text: '*Voorzieningen voor automatisch opblaasbare reddingsvlotten*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.6.a
    text: |-
      De breeksterkte van het vanglijnsysteem, de wijze van bevestiging aan het reddingsvlot inbegrepen, maar met
      uitzondering van de breekdraad, bedoeld in [artikel 7.20, zesde lid, onder b][ref1], is ten minste 10,0 kN voor
      een reddingsvlot dat is goedgekeurd voor 9 of meer personen en ten minste 7,5 kN voor een reddingsvlot dat is
      goedgekeurd voor minder dan 9 personen. Het opblaasmechanisme van een reddingsvlot kan door één persoon bediend
      worden.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.21.6.b
    text: |-
      Op het hoogste punt van de overkapping van het reddingsvlot is een met de hand in- en uitschakelbare lamp
      aangebracht, die bij donkere nacht en heldere atmosfeer over een afstand van ten minste 2 zeemijl gedurende
      ten minste 12 uur zichtbaar is. Indien die lamp een flikkerlicht geeft, bedraagt de frequentie ten minste 50
      flikkeringen per minuut gedurende de eerste 2 van de 12 gebruiksuren. De lamp wordt gevoed door een door zeewater
      geactiveerde batterij of door een droge batterij, en gaat automatisch branden wanneer het reddingsvlot wordt
      opgeblazen. De batterij is van een type dat niet door vocht of vochtigheid in het ingepakte reddingsvlot wordt
      aangetast.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.6.c
    text: |-
      Aan de binnenzijde van het reddingsvlot is een met de hand in- en uitschakelbare lamp aangebracht, die ten minste
      12 uur onafgebroken kan branden. De lamp gaat automatisch branden wanneer het reddingsvlot wordt opgeblazen, en
      geeft voldoende licht om daarbij aanwijzingen en instructies te kunnen lezen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.7
    text: '*Containers van automatisch opblaasbare reddingsvlotten*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.7.a
    text: 'Het reddingsvlot is verpakt in een container die voldoet aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.7.a.1°
    text: hij is zo vervaardigd dat hij niet bovenmatig slijt door omstandigheden die zich op zee kunnen voordoen,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.7.a.2°
    text: |-
      wanneer het reddingsvlot en de uitrusting erin verpakt zijn, heeft hij voldoende eigen drijfvermogen om de vanglijn
      naar buiten te doen trekken en het opblaasmechanisme in werking te stellen terwijl het vaartuig zinkt, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.7.a.3°
    text: hij is, voorzover uitvoerbaar, waterdicht, met uitzondering van spuigaten in de bodem van de container.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.7.b
    text: |-
      Het reddingsvlot is zodanig in de container verpakt dat, voorzover mogelijk, verzekerd is dat het reddingsvlot in
      het water recht overeind wordt opgeblazen, zodra het vrijkomt van de container.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.7.c
    text: 'Op de container is aangegeven:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.7.c.1°
    text: de naam van de fabrikant of het handelsmerk van het reddingsvlot;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.7.c.2°
    text: serienummer van het reddingsvlot;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.7.c.3°
    text: |-
      de naam van de bevoegde autoriteit die de oorspronkelijke typegoedkeuring van het reddingsvlot heeft verricht, en
      het aantal personen waarvoor het reddingsvlot is goedgekeurd;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.7.c.4°
    text: SFV of SOLAS A;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.7.c.5°
    text: het type van het bij het reddingsvlot verpakte noodpakket;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.7.c.6°
    text: de datum waarop de laatste keuring van het reddingsvlot heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.7.c.7°
    text: de lengte van de vanglijn van het reddingsvlot;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.7.c.8°
    text: |-
      de maximum hoogte boven de waterlijn behorend bij de laagst gelegen lastlijn van het vaartuig in zeewater, waarop
      het reddingsvlot opgesteld mag worden (afhankelijk van de valtesthoogte en de lengte van de vanglijn);
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.7.c.9°
    text: aanwijzingen voor het te water brengen van het reddingsvlot.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.8
    text: '*Merken op automatisch opblaasbare reddingsvlotten* Op het reddingsvlot is aangegeven:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.8.a
    text: de naam van de fabrikant of het handelsmerk;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.8.b
    text: serienummer;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.8.c
    text: jaar en maand van fabricage;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.8.d
    text: de naam van de bevoegde autoriteit die de oorspronkelijke typegoedkeuring heeft verricht;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.8.e
    text: de naam en plaats van het keuringsstation waar de laatste keuring heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.8.f
    text: |-
      het aantal personen waarvoor het is goedgekeurd, aangebracht boven iedere ingang in cijfers die ten minste 100 mm
      hoog zijn, in een kleur die contrasteert met de kleur van het materiaal van het reddingsvlot.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.9
    text: '*Strijkbare automatisch opblaasbare reddingsvlotten*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.9.a
    text: |-
      Naast het bepaalde in de voorgaande leden voldoet een reddingsvlot van het strijkbare type, wanneer het aan de
      ontkoppelingshaak of spruit hangt, tevens aan de volgende eisen:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.9.a.1°
    text: |-
      het reddingsvlot kan een belasting doorstaan van 4 maal de massa van de volle bezetting en volledige uitrusting bij
      een temperatuur van de omgeving en van het reddingsvlot zelf van 20°C ± 3°C, met alle overdrukventielen gesloten,
      en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.9.a.2°
    text: |-
      het reddingsvlot kan een belasting doorstaan van 1,1 maal de massa van de volle bezetting en volledige uitrusting
      bij een temperatuur van de omgeving en van het reddingsvlot zelf van minus 30°C, met alle overdrukventielen open.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.9.b
    text: |-
      Containers van vlotten van het strijkbare type zijn zo geborgd, dat voorkomen wordt dat de container of delen
      daarvan in zee vallen tijdens en na het opblazen en te water laten van het reddingsvlot.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.10
    text: '*Uitrusting van automatisch opblaasbare reddingsvlotten*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.10.a
    text: |-
      In aanvulling op de uitrusting, voorgeschreven in [artikel 7.20, vijfde lid][ref1], is een automatisch opblaasbaar
      reddingsvlot tevens voorzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.21.10.a.1°
    text: reparatiemateriaal om lekken in de drijfkamers te herstellen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.10.a.2°
    text: een handpomp of blaasbalg.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
  - number: 7.21.10.b
    text: |-
      De messen, voorgeschreven in [artikel 7.20, vijfde lid, onder a, 2°][ref1], zijn veiligheidsmessen.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.21
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.22.1
    text: |-
      In aanvulling op het bepaalde in [artikel 7.20][ref1] voldoen vaste reddingsvlotten tevens aan het bepaalde in
      dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.22
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.22.2
    text: '*Constructie van vaste reddingsvlotten*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.22
  - number: 7.22.2.a
    text: |-
      Het drijfvermogen van het reddingsvlot wordt geleverd door goedgekeurd zelfdrijvend materiaal dat zo dicht mogelijk
      bij de zijden van het reddingsvlot is aangebracht. Het drijvend materiaal is brandvertragend of beschermd door een
      brandvertragende laag.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.22
  - number: 7.22.2.b
    text: |-
      De bodem van het reddingsvlot voorkomt het binnendringen van water, houdt de inzittenden doeltreffend uit het water
      en beschermt hen tegen de koude.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.22
  - number: 7.22.3
    text: |-
      *Draagvermogen van vaste reddingsvlotten* Het aantal personen waarvoor een reddingsvlot wordt goedgekeurd is gelijk
      aan het kleinste van de volgende getallen:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.22
  - number: 7.22.3.a
    text: |-
      het grootste gehele getal verkregen door de inhoud van het drijfmateriaal, vermenigvuldigd met een factor 1 minus
      het soortelijk gewicht van het materiaal, uitgedrukt in kubieke meters, te delen door 0,096,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.22
  - number: 7.22.3.b
    text: |-
      het grootste gehele getal verkregen door de oppervlakte van de bodem van het reddingsvlot, uitgedrukt in vierkante
      meters, te delen door 0,372, of
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.22
  - number: 7.22.3.c
    text: |-
      het aantal personen met een gemiddelde massa van 75 kg per persoon, allen met een reddingsgordel aan, dat
      gemakkelijk en met voldoende hoofdruimte zittend plaats kan nemen, zonder het gebruik van enig uitrustingsstuk van
      het reddingsvlot te belemmeren.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.22
  - number: 7.22.4
    text: '*Toegang tot vaste reddingsvlotten*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.22
  - number: 7.22.4.a
    text: |-
      Ten minste één ingang is voorzien van een vaste inklimsteun om personen in staat te stellen vanuit zee in het
      reddingsvlot te klimmen. Bij reddingsvlotten van het strijkbare type met meer dan één ingang, is de inklimsteun
      aangebracht bij de ingang tegenover de aanhaaltalies en inschepingsvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.22
  - number: 7.22.4.b
    text: |-
      Ingangen die niet zijn voorzien van een inklimsteun, hebben een inschepingsladder, waarvan de onderste trede ten
      minste 0,4 m beneden de waterlijn van het lege reddingsvlot kan reiken.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.22
  - number: 7.22.4.c
    text: |-
      Aan de binnenzijde van het reddingsvlot zijn middelen aangebracht waarmede personen zichzelf vanaf de
      inschepingsladder in het reddingsvlot kunnen trekken.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.22
  - number: 7.22.5
    text: '*Stabiliteit van vaste reddingsvlotten*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.22
  - number: 7.22.5.a
    text: |-
      Tenzij het reddingsvlot veilig kan worden gebruikt ongeacht welke zijde boven drijft, zijn de sterkte en
      stabiliteit zodanig dat het zelfrichtend is of gemakkelijk door één persoon zowel bij zeegang als in kalme zee
      gekeerd kan worden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.22
  - number: 7.22.5.b
    text: |-
      De stabiliteit van een reddingsvlot beladen met volle bezetting en volledige uitrusting is zodanig dat het in kalme
      zee gesleept kan worden met een snelheid van 3 zeemijl per uur.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.22
  - number: 7.22.6
    text: '*Voorzieningen voor vaste reddingsvlotten*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.22
  - number: 7.22.6.a
    text: |-
      Het reddingsvlot is uitgerust met een doelmatige vanglijn. De breeksterkte van het vanglijnsysteem, de
      wijze van bevestiging aan het reddingsvlot inbegrepen, maar met uitzondering van de breekdraad, bedoeld in
      [artikel 7.20, zesde lid, onder b][ref1], is ten minste 10,0 kN voor een reddingsvlot dat is goedgekeurd voor 9 of
      meer personen en ten minste 7,5 kN voor een reddingsvlot dat is goedgekeurd voor minder dan 9 personen.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.22
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.22.6.b
    text: |-
      Op het hoogste punt van de overkapping van het reddingsvlot is een met de hand in- en uitschakelbare lamp
      aangebracht, die bij donkere nacht en heldere atmosfeer over een afstand van ten minste 2 zeemijl gedurende
      ten minste 12 uur zichtbaar is. Indien die lamp een flikkerlicht geeft, bedraagt de frequentie ten minste 50
      flikkeringen per minuut gedurende de eerste 2 van de 12 gebruiksuren. De lamp wordt gevoed door een door zeewater
      geactiveerde batterij of door een droge batterij, en gaat automatisch branden wanneer de overkapping wordt opgezet.
      De batterij is van een type dat niet door vocht of vochtigheid in het ingepakte reddingsvlot wordt aangetast.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.22
  - number: 7.22.6.c
    text: |-
      Aan de binnenzijde van het reddingsvlot is een met de hand in- en uitschakelbare lamp aangebracht, die ten minste
      12 uur onafgebroken kan branden. De lamp gaat automatisch branden wanneer de overkapping wordt opgezet, en geeft
      voldoende licht om daarbij aanwijzingen en instructies te kunnen lezen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.22
  - number: 7.22.7
    text: '*Merken op vaste reddingsvlotten* Op het reddingsvlot is aangegeven:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.22
  - number: 7.22.7.a
    text: de naam en thuishaven van het vaartuig waartoe het reddingsvlot behoort;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.22
  - number: 7.22.7.b
    text: de naam van de fabrikant of het handelsmerk;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.22
  - number: 7.22.7.c
    text: het serienummer;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.22
  - number: 7.22.7.d
    text: de naam van de bevoegde autoriteit die de oorspronkelijke typegoedkeuring heeft verricht;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.22
  - number: 7.22.7.e
    text: |-
      het aantal personen waarvoor het is goedgekeurd, aangebracht boven iedere ingang in cijfers die ten minste 100 mm
      hoog zijn, in een kleur die contrasteert met de kleur van het materiaal van het reddingsvlot;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.22
  - number: 7.22.7.f
    text: SFV of SOLAS A;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.22
  - number: 7.22.7.g
    text: het type van het bij het reddingsvlot verpakte noodpakket;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.22
  - number: 7.22.7.h
    text: de lengte van de vanglijn;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.22
  - number: 7.22.7.i
    text: |-
      de maximum hoogte boven de laagst gelegen lastlijn van het vaartuig in zeewater, waarop het reddingsvlot opgesteld
      mag worden;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.22
  - number: 7.22.7.j
    text: aanwijzingen voor het te water brengen van het reddingsvlot.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.22
  - number: 7.22.8
    text: |-
      *Strijkbare vaste reddingsvlotten* Bovendien kan een vast reddingsvlot van het strijkbare type, wanneer het aan
      de ontkoppelingshaak of spruit hangt, een belasting van 4 maal de massa van de volle bezetting en de volledige
      uitrusting doorstaan.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.22
  - number: 7.23.1
    text: '*Algemene eisen*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.1.a
    text: |-
      In aanvulling op het bepaalde in dit artikel voldoen alle hulpverleningsboten aan het bepaalde in
      [artikel 7.17, eerste tot en met zevende lid, onder d, f, g, i en l, en negende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.23.1.b
    text: |-
      Hulpverleningsboten mogen van een vaste constructie zijn of van een constructie van het opblaasbare type, of van
      een constructie waarin beide mogelijkheden gecombineerd zijn, en:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.1.b.1°
    text: |-
      hebben een lengte van ten minste 3,8 m en niet meer dan 8,5 m. Het Hoofd van de Scheepvaartinspectie kan een
      kleinere lengte accepteren, maar niet minder dan 3,3 m, wanneer als gevolg van de lengte van het vaartuig of een
      andere reden het onredelijk of onpraktisch is zo'n hulpverleningsboot te voeren;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.1.b.2°
    text: |-
      kunnen ten minste vijf personen in zittende en een persoon in liggende houding dragen of, indien de lengte minder
      dan 3,8 m bedraagt, een aantal als voorgeschreven door het Hoofd van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.1.c
    text: |-
      Het toegestane aantal personen dat een hulpverleningsboot mag dragen wordt bepaald door het Hoofd van de
      Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.1.d
    text: |-
      Hulpverleningsboten die zijn uitgevoerd als een combinatie van een vaste constructie en een constructie van
      het opblaasbare type, behoeven aan de navolgende bepalingen slechts te voldoen voorzover het Hoofd van de
      Scheepvaartinspectie dit bepaalt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.1.e
    text: |-
      Tenzij de hulpverleningsboot voldoende zeeg heeft, is de boot voorzien van een boegbedekking die zich over ten
      minste 15% van de lengte uitstrekt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.1.f
    text: |-
      Hulpverleningsboten kunnen manoeuvreren bij een snelheid tot 6 zeemijl per uur en kunnen gedurende ten minste 4 uur
      die snelheid aanhouden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.1.g
    text: |-
      Hulpverleningsboten zijn voldoende handelbaar en manoeuvreerbaar om bij zeegang personen uit het water te kunnen
      halen, reddingsvlotten bij elkaar te kunnen brengen, en het grootste type reddingsvlot dat aan boord is, beladen
      met volle bezetting en volledige uitrusting of een gelijkwaardige massa, met een vaart van ten minste 2 zeemijl per
      uur te kunnen slepen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.1.h
    text: |-
      Een hulpverleningsboot is met een binnenboord- of buitenboordmotor uitgerust. Indien een buitenboordmotor is
      toegepast, mogen het roer en de helmstok een onderdeel van de motor vormen. In afwijking van het bepaalde in
      [artikel 7.17, zesde lid, onder a][ref1], kunnen buitenboordbenzinemotoren met een goedgekeurd brandstofsysteem
      worden toegepast in hulpverleningsboten, mits de brandstoftanks op bijzondere wijze tegen brand en explosie worden
      beschermd.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.23.1.i
    text: |-
      Er zijn permanente sleepvoorzieningen in de hulpverleningsboot aangebracht en deze zijn sterk genoeg om
      reddingsvlotten bij elkaar te brengen of te slepen, als voorgeschreven onder g.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.1.j
    text: |-
      Hulpverleningsboten zijn uitgerust met een berging voor kleinere uitrustingsstukken, die dicht is tegen weer en
      wind.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.2
    text: '*Uitrusting van hulpverleningsboten*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.2.a
    text: |-
      Alle uitrustingsstukken van een hulpverleningsboot, met uitzondering van de bootshaak die beschikbaar moet blijven
      om de boot af te houden, zijn in de hulpverleningsboot vastgezet door middel van sjorringen, opgeborgen in kasten
      of compartimenten, bevestigd in beugels of soortgelijke armaturen of op andere geschikte wijze. De uitrusting is
      zo vastgezet dat zij geen belemmering vormt bij de handelingen voor het te water laten of het weer terugzetten.
      Alle uitrustingsstukken zijn zo klein mogelijk, hebben een zo gering mogelijke massa en zijn op doeltreffende en
      compacte wijze verpakt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.2.b
    text: 'De normale uitrusting van een hulpverleningsboot bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.2.b.1°
    text: |-
      voldoende drijvende riemen of peddels om in kalme zee vooruit te kunnen komen. Voor iedere riem zijn er dollen,
      steunen of gelijkwaardige voorzieningen aanwezig. De dollen of steunen zijn met lijnen of kettingen aan de boot
      bevestigd;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.2.b.2°
    text: een drijvend hoosvat;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.2.b.3°
    text: een nachthuis met een doelmatig kompas dat lichtgevend is of voorzien is van een doelmatige verlichting;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.2.b.4°
    text: een drijfanker van voldoende grootte met een schokbestendige sleeplijn van ten minste 10 m lengte en een kaailijn;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.2.b.5°
    text: |-
      een vanglijn van voldoende lengte en sterkte, bevestigd aan het ontkoppelingsmiddel, voorgeschreven in
      [artikel 7.17, zevende lid, onder g][ref1], gereedliggend aan de voorkant van de hulpverleningsboot;


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.23.2.b.6°
    text: |-
      een drijvende lijn van ten minste 50 m lengte, sterk genoeg om een reddingsvlot te slepen als voorgeschreven in het
      eerste lid, onder g;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.2.b.7°
    text: |-
      een waterdichte elektrische lantaarn geschikt voor het geven van morseseinen, alsmede een stel reservebatterijen en
      een reservelamp, verpakt in een waterdichte houder;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.2.b.8°
    text: een fluit of een gelijkwaardig middel voor het geven van geluidssignalen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.2.b.9°
    text: |-
      een waterdichte medicijnkist die na gebruik weer goed gesloten kan worden, met een bij ministeriële regeling vast
      te stellen inhoud, met de daarbij behorende controlelijst en handleidingen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.2.b.10°
    text: |-
      twee drijvende werplijnen van ten minste 30 meter lengte, waarvan het ene uiteinde is voorzien van een drijvende
      werpring;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.2.b.11°
    text: |-
      een zoeklicht dat een lichtgekleurd voorwerp van 18 m breedte op 180 m afstand bij nacht gedurende in totaal 6 uur,
      waarvan ten minste 3 uur achtereen, doelmatig kan verlichten;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.2.b.12°
    text: een doelmatige radarreflector;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.2.b.13°
    text: |-
      hulpmiddelen tegen warmteverlies die voldoen aan het bepaalde in [artikel 7.26][ref1], voldoende voor 2 personen
      of 10% van het aantal personen waarvoor in de hulpverleningsboot ruimte is bestemd, welk van beide het grootste is.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.23.2.c
    text: |-
      Behalve uit de uitrusting voorgeschreven in het tweede lid, onder b, bestaat de normale uitrusting van iedere vaste
      hulpverleningsboot uit:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.2.c.1°
    text: een bootshaak,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.2.c.2°
    text: een emmer en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.2.c.3°
    text: een mes of bijl.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.2.d
    text: |-
      Behalve uit de uitrusting voorgeschreven in het tweede lid, onder b, bestaat de normale uitrusting van iedere
      hulpverleningsboot in opgeblazen toestand uit:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.2.d.1°
    text: een drijvend veiligheidsmes;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.2.d.2°
    text: twee sponzen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.2.d.3°
    text: een doelmatige, met de hand te bedienen blaasbalg of pomp;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.2.d.4°
    text: reparatiemateriaal in een geschikte houder, voor het herstellen van lekkages;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.2.d.5°
    text: een veiligheidsbootshaak;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.3
    text: '*Aanvullende eisen voor hulpverleningsboten in opgeblazen toestand*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.3.a
    text: |-
      Het bepaalde in [artikel 7.17, eerste lid, onder c en e][ref1], is niet van toepassing op hulpverleningsboten in
      opgeblazen toestand.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.23.3.b
    text: 'Een hulpverleningsboot in opgeblazen toestand is zo vervaardigd dat, wanneer deze aan zijn spruit of haak hangt:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.3.b.1°
    text: |-
      hij voldoende sterk en stijf genoeg is om afgevierd en teruggehesen te kunnen worden met volle bezetting en
      volledige uitrusting;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.3.b.2°
    text: |-
      hij sterk genoeg is om een belasting van 4 maal de massa van de volle bezetting en volledige uitrusting te
      doorstaan, bij een temperatuur van de omgeving van 20°C ± 3°C met alle overdrukventielen gesloten, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.3.b.3°
    text: |-
      hij sterk genoeg is om een belasting van 1,1 maal de massa van de volle bezetting en volledige uitrusting te
      doorstaan, bij een temperatuur van de omgeving van minus 30°C met alle overdrukventielen open.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.3.c
    text: |-
      Hulpverleningsboten in opgeblazen toestand zijn zo vervaardigd dat ze bestand zijn tegen blootstelling aan
      invloeden van weer en zee:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.3.c.1°
    text: opgesteld op een open dek aan boord van een vaartuig op zee, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.3.c.2°
    text: gedurende 30 dagen drijvend in alle toestanden van zeegang.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.3.d
    text: |-
      In aanvulling op het bepaalde in [artikel 7.17, negende lid][ref1], zijn hulpverleningsboten in opgeblazen toestand
      gemerkt met het serienummer, de naam of het handelsmerk van de fabrikant en de datum van fabricage.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.23.3.e
    text: |-
      Het drijfvermogen van een hulpverleningsboot in opgeblazen toestand wordt geleverd hetzij door een enkel
      drijflichaam onderverdeeld in ten minste vijf verschillende compartimenten van nagenoeg dezelfde inhoud,
      hetzij door twee verschillende drijflichamen die geen van beide groter zijn dan 60% van het totale volume. De
      drijflichamen zijn zo ontworpen dat wanneer een van de compartimenten is beschadigd, de compartimenten die nog
      intact zijn, de hulpverleningsboot drijvend kunnen houden met het aantal personen waarvoor de hulpverleningsboot is
      bestemd, ieder met een massa van 75 kg en zittend op de normale plaats, met een positief vrijboord rondom de boot.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.3.f
    text: |-
      De buitenste drijflichamen van de hulpverleningsboot hebben in opgeblazen toestand een inhoud van ten minste
      0,17 m3 voor elke persoon waarvoor de hulpverleningsboot is bestemd.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.3.g
    text: |-
      Ieder drijflichaam is voorzien van een terugslagklep ten behoeve van het opblazen met de hand en van middelen om
      het drijflichaam te laten leeglopen. Tenzij het Hoofd van de Scheepvaartinspectie van oordeel is dat een dergelijk
      middel niet noodzakelijk is, is er tevens een overdrukventiel aangebracht.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.3.h
    text: |-
      Aan de onderzijde van de bodem en op kwetsbare plaatsen aan de buitenzijde van een hulpverleningsboot van het
      opblaasbare type, zijn ten genoegen van het Hoofd van de Scheepvaartinspectie schavielstrippen aangebracht.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.3.i
    text: |-
      Indien de hulpverleningsboot met een spiegelplaat is uitgerust, mag deze niet verder naar binnen zijn aangebracht
      dan 20% van de lengte over alles van de hulpverleningsboot.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.3.j
    text: |-
      Er zijn doelmatige bevestigingspunten aangebracht om de vanglijnen voor en achter, en de grijplijnen langs de
      binnenzijde en de buitenzijde van de boot aan te bevestigen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.23.3.k
    text: Een hulpverleningsboot van het opblaasbare type wordt te allen tijde in volledig opgeblazen toestand gehouden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.23
  - number: 7.24.1
    text: '*Algemene eisen voor reddingsgordels*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.24
  - number: 7.24.1.a
    text: |-
      Een reddingsgordel mag niet blijven branden of doorgaan met smelten indien hij niet langer dan 2 seconden volledig
      in vuur gehuld is geweest.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.24
  - number: 7.24.1.b
    text: 'Een reddingsgordel is zo vervaardigd dat:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.24
  - number: 7.24.1.b.1°
    text: hij, na instructie, binnen 1 minuut op de juiste wijze en zonder hulp van anderen kan worden aangedaan,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.24
  - number: 7.24.1.b.2°
    text: |-
      hij binnenstebuiten kan worden gedragen of zeer duidelijk uitsluitend op één manier kan worden aangedaan;
      voorzover mogelijk is de reddingsgordel zo vervaardigd dat hij niet op een onjuiste manier kan worden aangedaan
      of vastgemaakt,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.24
  - number: 7.24.1.b.3°
    text: hij gemakkelijk zit, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.24
  - number: 7.24.1.b.4°
    text: |-
      hij de drager in staat stelt van een hoogte van ten minste 4,5 m in het water te springen zonder letsel op te lopen
      en zonder dat daarbij de reddingsgordel losraakt of beschadigt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.24
  - number: 7.24.1.c
    text: 'Een reddingsgordel heeft voldoende drijfvermogen en stabiliteit in kalm, zoet water om:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.24
  - number: 7.24.1.c.1°
    text: |-
      de mond van een uitgeput of bewusteloos persoon ten minste 120 mm boven water te houden, met het lichaam achterover
      hellend in het water onder een hoek van niet minder dan 20 graden en niet meer dan 50 graden ten opzichte van de
      verticale positie, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.24
  - number: 7.24.1.c.2°
    text: |-
      het lichaam van een bewusteloze persoon uit iedere stand in het water zo te wentelen dat de mond in ten hoogste 5
      seconden boven water komt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.24
  - number: 7.24.1.d
    text: |-
      Een reddingsgordel heeft een drijfvermogen dat niet meer dan 5% afneemt na onderdompeling in zoet water gedurende
      24 uur.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.24
  - number: 7.24.1.e
    text: |-
      Een reddingsgordel stelt de drager in staat een korte afstand ermee te zwemmen en in een groepsreddingsmiddel te
      klimmen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.24
  - number: 7.24.1.f
    text: Een reddingsgordel is voorzien van een signaalfluit, stevig met een koord eraan bevestigd.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.24
  - number: 7.24.2
    text: |-
      *Opblaasbare reddingsgordels* Een reddingsgordel waarvan het drijfvermogen afhankelijk is van opblazen, heeft niet
      minder dan twee gescheiden compartimenten en voldoet, in aanvulling op het bepaalde in het eerste lid, tevens aan
      de volgende eisen:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.24
  - number: 7.24.2.1°
    text: |-
      hij blaast automatisch op bij onderdompeling, is voorzien van een middel waarbij het opblazen met een eenvoudige
      handeling kan geschieden, en kan met de mond worden opgeblazen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.24
  - number: 7.24.2.2°
    text: |-
      hij voldoet, ook bij verlies van drijfvermogen in een van de compartimenten, aan het bepaalde in het eerste lid,
      onder b, c en e, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.24
  - number: 7.24.2.3°
    text: hij voldoet aan het bepaalde in het eerste lid, onder d, nadat de reddingsgordel automatisch is opgeblazen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.24
  - number: 7.24.3
    text: '*Lichten voor reddingsgordels*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.24
  - number: 7.24.3.a
    text: 'Elke reddingsgordel is voorzien van een licht dat voldoet aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.24
  - number: 7.24.3.a.1°
    text: het heeft een lichtsterkte van ten minste 0,75 cd;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.24
  - number: 7.24.3.a.2°
    text: |-
      het is voorzien van een zodanige krachtbron dat een lichtsterkte van 0,75 cd kan worden geleverd gedurende een
      periode van ten minste 8 uur, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.24
  - number: 7.24.3.a.3°
    text: |-
      het is zichtbaar over een zo groot mogelijk gedeelte boven de horizon als praktisch uitvoerbaar is wanneer het
      licht bevestigd is aan de reddingsgordel.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.24
  - number: 7.24.3.b
    text: 'Indien het licht, bedoeld onder a, een flikkerlicht is, voldoet het bovendien aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.24
  - number: 7.24.3.b.1°
    text: het is voorzien van een met de hand bedienbare schakelaar,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.24
  - number: 7.24.3.b.2°
    text: het mag niet zijn uitgerust met een lens of gebogen reflector om de straal te bundelen, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.24
  - number: 7.24.3.b.3°
    text: |-
      het kan flikkerlicht geven met een frequentie van ten minste 50 flikkeringen per minuut met een doelmatige
      lichtsterkte van ten minste 0,75 cd.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.24
  - number: 7.25.1
    text: '*Algemene eisen voor overlevingspakken*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.25
  - number: 7.25.1.a
    text: 'Een overlevingspak is uit waterdicht materiaal vervaardigd en wel zodanig dat:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.25
  - number: 7.25.1.a.1°
    text: |-
      het binnen 2 minuten zonder hulp van anderen uitgepakt en aangetrokken kan worden, rekening houdend met de gedragen
      kleding en een reddingsgordel indien het overlevingspak samen met een reddingsgordel wordt gedragen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.25
  - number: 7.25.1.a.2°
    text: |-
      het niet blijft branden of doorgaat met smelten indien het niet langer dan 2 seconden volledig in vuur gehuld is
      geweest;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.25
  - number: 7.25.1.a.3°
    text: |-
      het, met uitzondering van het gezicht, het hele lichaam bedekt. De handen zijn bedekt, hetzij door handschoenen die
      een geheel vormen met het pak, hetzij door afzonderlijke handschoenen die permanent aan het pak zijn bevestigd;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.25
  - number: 7.25.1.a.4°
    text: er voorzieningen zijn om de hoeveelheid vrije lucht in de pijpen van het pak te verminderen, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.25
  - number: 7.25.1.a.5°
    text: |-
      er geen overmatige hoeveelheid water in het pak binnendringt na een sprong vanaf een hoogte van ten minste 4,5 m in
      het water.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.25
  - number: 7.25.1.b
    text: |-
      Een overlevingspak dat voldoet aan het bepaalde in [artikel 7.24][ref1] mag als een reddingsgordel beschouwd
      worden.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.25
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.25.1.c
    text: 'Een overlevingspak stelt de drager, indien deze tevens een reddingsgordel draagt, in staat om:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.25
  - number: 7.25.1.c.1°
    text: een verticaal geplaatste ladder van 5 m lengte op te klimmen en af te dalen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.25
  - number: 7.25.1.c.2°
    text: normale taken tijdens «schip verlaten» uit te voeren;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.25
  - number: 7.25.1.c.3°
    text: |-
      vanaf een hoogte van ten minste 4,5 m in het water te springen zonder dat het overlevingspak beschadigt of
      losraakt, of de drager letsel toebrengt, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.25
  - number: 7.25.1.c.4°
    text: een korte afstand door het water te zwemmen en in een groepsreddingsmiddel te klimmen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.25
  - number: 7.25.1.d
    text: |-
      Een overlevingspak dat drijfvermogen heeft en ontworpen is om zonder reddingsgordel gedragen te worden, is
      voorzien van een licht dat voldoet aan het bepaalde in [artikel 7.24, derde lid][ref1], en een signaalfluit als
      voorgeschreven in [artikel 7.24, eerste lid, onder f][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.25
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.25.1.e
    text: |-
      Indien het overlevingspak samen met een reddingsgordel moet worden gedragen, wordt de reddingsgordel over het
      overlevingspak heen gedragen. Iemand die een dergelijk overlevingspak draagt, moet de reddingsgordel zonder hulp
      kunnen aandoen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.25
  - number: 7.25.2
    text: '*Thermische eisen voor overlevingspakken*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.25
  - number: 7.25.2.a
    text: 'Een overlevingspak dat vervaardigd is van materiaal zonder isolerende werking:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.25
  - number: 7.25.2.a.1°
    text: is voorzien van een instructie dat het in combinatie met warme kleding gedragen wordt, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.25
  - number: 7.25.2.a.2°
    text: |-
      wordt zo vervaardigd dat het, indien het gedragen wordt in combinatie met warme kleding en een reddingsgordel
      als het overlevingspak bedoeld is om gedragen te worden in combinatie met een reddingsgordel, de drager voldoende
      thermische isolatie biedt, zodat de lichaamstemperatuur van de drager niet meer dan 2°C daalt na een sprong vanaf
      een hoogte van 4,5 m in het water en een daarop aansluitend verblijf van 1 uur in rustig stromend water van 5°C.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.25
  - number: 7.25.2.b
    text: |-
      Een overlevingspak dat vervaardigd is uit isolerend materiaal biedt, indien het gedragen wordt op zichzelf of in
      combinatie met een reddingsgordel als het ontworpen is om in combinatie met een reddingsgordel gedragen te worden,
      de drager een zodanige thermische isolatie dat de lichaamstemperatuur van de drager niet meer dan 2°C daalt na
      een sprong vanaf een hoogte van 4,5 m in het water en een daarop aansluitend verblijf van 6 uur in rustig stromend
      water met een temperatuur tussen 0°C en 2°C.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.25
  - number: 7.25.2.c
    text: |-
      Het overlevingspak stelt degene die het met de handen bedekt draagt, in staat om een potlood op te pakken en te
      schrijven na een verblijf van 1 uur in water van 5°C.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.25
  - number: 7.25.3
    text: |-
      *Eisen voor het drijfvermogen van overlevingspakken* Een persoon die in zoet water een overlevingspak draagt dat
      voldoet aan het bepaalde in [artikel 7.24][ref1] of een overlevingspak in combinatie met een reddingsgordel moet
      zich in niet meer dan 5 seconden kunnen keren van de stand met het gezicht naar beneden tot die met het gezicht
      naar boven.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.25
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.26.1
    text: |-
      Een hulpmiddel tegen warmteverlies is gemaakt van waterdicht materiaal dat een thermische geleiding van niet meer
      dan 0,25 W/mK heeft, en is zo vervaardigd dat het, wanneer het wordt gebruikt om een persoon te omhullen, het
      verlies aan lichaamswarmte ten gevolge van convectie of verdamping, vermindert.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.26
  - number: 7.26.2
    text: 'Een hulpmiddel tegen warmteverlies voldoet aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.26
  - number: 7.26.2.1°
    text: |-
      het bedekt het hele lichaam van een persoon die een reddingsgordel draagt, met uitzondering van het gezicht. De
      handen zijn ook bedekt, tenzij afzonderlijke handschoenen aanwezig zijn die daaraan permanent zijn bevestigd,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.26
  - number: 7.26.2.2°
    text: |-
      het kan zonder hulp van anderen worden uitgepakt en kan gemakkelijk worden aangetrokken in een groepsreddingsmiddel
      of hulpverleningsboot, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.26
  - number: 7.26.2.3°
    text: de drager kan het in het water in niet meer dan 2 minuten uittrekken, wanneer het zwemmen er door wordt belemmerd.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.26
  - number: 7.26.3
    text: Het functioneert goed bij temperaturen van – 30°C tot + 20°C.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.26
  - number: 7.27.1
    text: '*Specificaties voor reddingsboeien* Een reddingsboei voldoet aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.27
  - number: 7.27.1.1°
    text: |-
      hij heeft een uitwendige middellijn van niet meer dan 800 mm en een inwendige middellijn van niet minder dan
      400 mm;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.27
  - number: 7.27.1.2°
    text: |-
      hij is vervaardigd van zelfopdrijvend materiaal dat niet bestaat uit biezen, kurkafval, kurkkorrels of enige andere
      korrelige stof zonder samenhang, noch uit een luchtkast waarbij het drijfvermogen afhankelijk is van opblazen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.27
  - number: 7.27.1.3°
    text: hij is in staat om ten minste 14,5 kg ijzer gedurende 24 uur in zoet water te kunnen dragen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.27
  - number: 7.27.1.4°
    text: hij heeft een massa van ten minste 2,5 kg;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.27
  - number: 7.27.1.5°
    text: |-
      hij mag niet blijven branden of doorgaan met smelten indien hij niet langer dan 2 seconden volledig in vuur gehuld
      is geweest;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.27
  - number: 7.27.1.6°
    text: |-
      hij is zo vervaardigd dat een val vanaf een hoogte van 30 m in het water wordt doorstaan, zonder dat de
      gebruiksmogelijkheden of de er aan bevestigde onderdelen worden aangetast. Indien de plaats waar de boei is
      geplaatst, meer dan 30 m boven de laagst gelegen lastlijn van het vaartuig in zeewater is gelegen, kan de boei een
      val vanaf die hoogte doorstaan;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.27
  - number: 7.27.1.7°
    text: |-
      als hij bedoeld is om de inrichting voor een snelle ontkoppeling te bedienen, aangebracht voor de zelfwerkende
      rooksignalen en zelfontbrandende lichten, bedraagt de massa 4 kg of is voldoende om de inrichting voor een snelle
      ontkoppeling te bedienen, welk van de twee het grootste is;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.27
  - number: 7.27.1.8°
    text: |-
      hij is voorzien van een grijplijn die een doorsnede heeft van ten minste 9,5 mm en een lengte van ten minste 4 maal
      de uitwendige middellijn van de boei. De grijplijn is op vier, op onderling gelijke afstand liggende, punten op de
      omtrek van de boei bevestigd en wel zodanig dat vier gelijke bochten worden gevormd.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.27
  - number: 7.27.2
    text: |-
      *Zelfontbrandende lichten voor reddingsboeien* Een zelfontbrandend licht als voorgeschreven in
      [artikel 7.10, tweede lid][ref1], voldoet aan de volgende eisen:


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.27
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.27.2.1°
    text: het is zo vervaardigd, dat het niet door water kan worden gedoofd;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.27
  - number: 7.27.2.2°
    text: |-
      het kan onafgebroken in alle richtingen boven de horizon branden met een lichtsterkte van ten minste 2 cd, of
      kan flikkerlicht geven met een frequentie van ten minste 50 flikkeringen per minuut en met een doeltreffende
      lichtsterkte van ten minste 2 cd;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.27
  - number: 7.27.2.3°
    text: |-
      het is voorzien van een zodanige krachtbron dat gedurende ten minste 2 uur kan worden voldaan aan het bepaalde
      onder 2°, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.27
  - number: 7.27.2.4°
    text: het kan een valproef als bedoeld in het eerste lid, onder 6°, doorstaan.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.27
  - number: 7.27.3
    text: |-
      *Zelfwerkende rooksignalen voor reddingsboeien* Een zelfwerkend rooksignaal als voorgeschreven in
      [artikel 7.10, derde lid][ref1], voldoet aan de volgende eisen:


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.27
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.27.3.1°
    text: |-
      het kan drijvend in kalm water, gedurende ten minste 15 minuten rook van een goed zichtbare kleur met gelijkmatige
      snelheid afgeven;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.27
  - number: 7.27.3.2°
    text: het mag niet explosief ontsteken en geen vlammen afgeven gedurende de gehele periode van rookafgifte;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.27
  - number: 7.27.3.3°
    text: het mag tijdens zeegang niet vollopen met water;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.27
  - number: 7.27.3.4°
    text: het geeft tevens rook af tijdens en na een 10 seconden durende volledige onderdompeling, 100 mm diep in water, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.27
  - number: 7.27.3.5°
    text: het kan een valproef als bedoeld in het eerste lid, onder 6°, doorstaan.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.27
  - number: 7.27.4
    text: |-
      *Drijvende lijnen voor reddingsboeien* Een drijvende lijn als voorgeschreven in [artikel 7.10, vierde lid][ref1],
      voldoet aan de volgende eisen:


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.27
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.27.4.1°
    text: zij mag niet kinken;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.27
  - number: 7.27.4.2°
    text: zij heeft een doorsnede van ten minste 8 mm, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.27
  - number: 7.27.4.3°
    text: zij heeft een breeksterkte van niet minder dan 5 kN.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.27
  - number: 7.28.1
    text: 'Ieder lijnwerptoestel voldoet aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.28
  - number: 7.28.1.1°
    text: het kan een lijn met redelijke nauwkeurigheid wegschieten;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.28
  - number: 7.28.1.2°
    text: |-
      het is voorzien van ten minste vier projectielen die bij gunstige weersomstandigheden een lijn kunnen wegschieten
      over een afstand van ten minste 230 m;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.28
  - number: 7.28.1.3°
    text: het is voorzien van ten minste vier lijnen, ieder met een breeksterkte van ten minste 2 kN, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.28
  - number: 7.28.1.4°
    text: |-
      het is voorzien van beknopte gebruiksaanwijzingen of pictogrammen, die duidelijk het gebruik van het
      lijnwerptoestel aangeven.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.28
  - number: 7.28.2
    text: |-
      Het projectiel, in het geval van een door een pistool afgevuurd projectiel, of het projectiel en de lijn wanneer
      die een geheel vormen, zijn opgeborgen in een waterbestendige houder. In het geval van een door een pistool
      afgevuurd projectiel zijn de lijnen en projectielen, tezamen met de ontstekingsmiddelen bovendien opgeborgen in een
      verpakking die bescherming biedt tegen weersinvloeden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.28
  - number: 7.29.1
    text: 'Een valschermsignaal voldoet aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.29
  - number: 7.29.1.1°
    text: het is verpakt in een waterbestendige houder;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.29
  - number: 7.29.1.2°
    text: op de houder zijn korte en duidelijke aanwijzingen of pictogrammen voor het gebruik aangebracht;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.29
  - number: 7.29.1.3°
    text: het heeft een ingebouwd ontstekingsmechanisme, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.29
  - number: 7.29.1.4°
    text: |-
      het is zo ontworpen dat het voor de persoon die de houder vasthoudt, geen gevaar oplevert, wanneer het wordt
      gebruikt overeenkomstig de gebruiksaanwijzingen van de fabrikant.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.29
  - number: 7.29.2
    text: |-
      Een valschermsignaal bereikt, wanneer het loodrecht omhoog wordt afgeschoten, een hoogte van ten minste 300 m. Op
      of nabij het hoogtepunt van de baan geeft de raket een valschermsignaal af dat:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.29
  - number: 7.29.2.1°
    text: met een helder rode kleur brandt;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.29
  - number: 7.29.2.2°
    text: gelijkmatig een gemiddelde lichtsterkte van ten minste 30 000 cd afgeeft;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.29
  - number: 7.29.2.3°
    text: een brandduur heeft van ten minste 40 seconden;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.29
  - number: 7.29.2.4°
    text: een daalsnelheid heeft van niet meer dan 5 m/s, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.29
  - number: 7.29.2.5°
    text: het valscherm of de verbindingen daarmee tijdens het branden niet beschadigt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.29
  - number: 7.30.1
    text: 'Een handstakellicht voldoet aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.30
  - number: 7.30.1.1°
    text: het is verpakt in een waterbestendige houder;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.30
  - number: 7.30.1.2°
    text: op de houder zijn korte en duidelijke aanwijzingen of pictogrammen voor het gebruik aangebracht;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.30
  - number: 7.30.1.3°
    text: het heeft een zelfstandig ontstekingsmiddel, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.30
  - number: 7.30.1.4°
    text: |-
      het is zo ontworpen dat het voor de persoon die de houder moet vasthouden, geen gevaar oplevert wanneer het wordt
      gebruikt overeenkomstig de gebruiksaanwijzingen van de fabrikant.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.30
  - number: 7.30.2
    text: 'Een handstakellicht:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.30
  - number: 7.30.2.1°
    text: brandt met een helder rode kleur;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.30
  - number: 7.30.2.2°
    text: geeft gelijkmatig een gemiddelde lichtsterkte van ten minste 15 000 cd af;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.30
  - number: 7.30.2.3°
    text: heeft een brandduur van ten minste 1 minuut, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.30
  - number: 7.30.2.4°
    text: blijft branden, nadat het gedurende 10 seconden 100 mm diep in water is ondergedompeld.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.30
  - number: 7.31.1
    text: 'Een drijvend rooksignaal voldoet aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.31
  - number: 7.31.1.1°
    text: het is verpakt in een waterbestendige houder;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.31
  - number: 7.31.1.2°
    text: |-
      het mag niet explosief ontsteken wanneer het overeenkomstig de gebruiksaanwijzing van de fabrikant wordt gebruikt;
      en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.31
  - number: 7.31.1.3°
    text: op de houder zijn korte en duidelijke aanwijzingen of pictogrammen voor het gebruik aangebracht.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.31
  - number: 7.31.2
    text: 'Een drijvend rooksignaal:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.31
  - number: 7.31.2.1°
    text: |-
      geeft in kalm water drijvend, gedurende ten minste 3 minuten met een gelijkmatige snelheid rook van goed zichtbare
      kleur af;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.31
  - number: 7.31.2.2°
    text: geeft gedurende de gehele periode van rookafgifte geen vlammen af,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.31
  - number: 7.31.2.3°
    text: loopt tijdens zeegang niet vol met water; en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.31
  - number: 7.31.2.4°
    text: blijft rook afgeven indien ondergedompeld gedurende 10 seconden 100 mm diep in water.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.31
  - number: 7.32.1
    text: '*Algemene eisen*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
  - number: 7.32.1.a
    text: |-
      Ieder tewaterlatingsmiddel, met inbegrip van al het vier- en hijsgerei, is zo uitgevoerd dat het volledig
      uitgeruste groepsreddingsmiddel of de hulpverleningsboot die daarmee wordt bediend, met een kop- of stuurlast van
      10° en met een slagzij van 20° over elke zijde, veilig afgevierd kan worden:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
  - number: 7.32.1.a.1°
    text: na het inschepen met de volle bezetting, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
  - number: 7.32.1.a.2°
    text: zonder personen in het groepsreddingsmiddel of in de hulpverleningsboot.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
  - number: 7.32.1.b
    text: |-
      Een tewaterlatingsmiddel is bij het afvieren van een groepsreddingsmiddel of een hulpverleningsboot in de toestand
      omschreven in onderdeel a, onder 1° en 2°, alleen afhankelijk van zwaartekracht of opgeslagen mechanische kracht
      die onafhankelijk is van de energievoorziening van het vaartuig.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
  - number: 7.32.1.c
    text: |-
      Een tewaterlatingsmiddel is zo ingericht dat het vanaf een plaats aan dek en vanaf een plaats in het
      groepsreddingsmiddel of de hulpverleningsboot door een persoon in werking gesteld kan worden. Het
      groepsreddingsmiddel en de hulpverleningsboot zijn zichtbaar voor degene die het tewaterlatingsmiddel aan dek
      bedient.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
  - number: 7.32.1.d
    text: |-
      Ieder tewaterlatingsmiddel is zo geconstrueerd dat er een minimum aan onderhoud nodig is. Alle onderdelen die
      regelmatig onderhoud door de bemanning behoeven, zijn goed bereikbaar en gemakkelijk te onderhouden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
  - number: 7.32.1.e
    text: 'De lierremmen van het tewaterlatingsmiddel zijn sterk genoeg om:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
  - number: 7.32.1.e.1°
    text: een statische beproeving te doorstaan met een proefbelasting van ten minste 1,5 maal de maximale werkbelasting, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
  - number: 7.32.1.e.2°
    text: |-
      een dynamische beproeving te doorstaan met een proefbelasting van ten minste 1,1 maal de maximale werkbelasting bij
      de maximale afviersnelheid.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
  - number: 7.32.1.f
    text: |-
      Een tewaterlatingsmiddel met toebehoren, met uitzondering van de lierremmen, is sterk genoeg om een statische
      beproeving met een proefbelasting van ten minste 2,2 maal de maximale werkbelasting te doorstaan.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
  - number: 7.32.1.g
    text: |-
      Structurele onderdelen en alle blokken, lopers, ogen, sluitingen, bevestigingen en alle andere benodigdheden die
      in verband met het te water laten worden gebruikt, zijn ontworpen met een minimum veiligheidsfactor gebaseerd op de
      vastgestelde maximum werkbelasting en de treksterkte van het materiaal dat voor de constructie werd toegepast. Voor
      alle structurele onderdelen van davits en lieren wordt een minimum veiligheidsfactor van 4,5 en voor alle lopers,
      kettingen, sluiten en blokken wordt een minimum veiligheidsfactor van 6 toegepast.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
  - number: 7.32.1.h
    text: Ieder tewaterlatingsmiddel blijft, voor zover uitvoerbaar, ook bij ijsafzetting doeltreffend werken.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
  - number: 7.32.1.i
    text: Een tewaterlatingsmiddel voor een reddingsboot kan die reddingsboot met zijn bedieningsbemanning ophijsen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
  - number: 7.32.1.j
    text: |-
      Een tewaterlatingsmiddel is zodanig ingericht dat de inscheping in het groepsreddingsmiddel, in overeenstemming
      met het bepaalde in de [artikelen 7.20, vierde lid, onder b][ref1], en [7.17, derde lid, onder a][ref2], kan
      geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.32.2
    text: '*Tewaterlatingsmiddelen waarbij gebruik wordt gemaakt van lopers en een lier*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
  - number: 7.32.2.a
    text: Lopers van tewaterlatingsmiddelen zijn van draaivrij en corrosiebestendig staaldraad vervaardigd.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
  - number: 7.32.2.b
    text: |-
      Tenzij een doeltreffende compensatie is aangebracht, zijn de lopers bij het gebruik van een meervoudige trommellier
      zo ingericht dat zij bij het vieren met dezelfde snelheid van de trommel afwinden en dat ze bij het ophijsen
      gelijkmatig met dezelfde snelheid opwinden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
  - number: 7.32.2.c
    text: |-
      Ieder tewaterlatingsmiddel voor een hulpverleningsboot is uitgerust met een motorlier met een zodanig vermogen dat
      de hulpverleningsboot met volle bezetting en volledige uitrusting uit het water opgehesen kan worden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
  - number: 7.32.2.d
    text: |-
      Teneinde ieder groepsreddingsmiddel en iedere hulpverleningsboot weer op te kunnen hijsen, is een doeltreffende
      handbediening aanwezig. Zwengels en tandwielen van de handbediening mogen niet meedraaien met de bewegende delen
      van de lier wanneer het groepsreddingsmiddel of de hulpverleningsboot wordt afgevierd of werktuiglijk wordt
      opgehesen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
  - number: 7.32.2.e
    text: |-
      Indien davits werktuiglijk binnenboord worden gehieuwd, worden er veiligheden op aangebracht, die automatisch
      de drijfkracht uitschakelen voordat de davits de eindstand bereiken, om te vermijden dat de lopers of de davits
      overbelast worden, tenzij de motor zodanig is ontworpen dat een dergelijke overbelasting wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
  - number: 7.32.2.f
    text: |-
      De snelheid waarmee het groepsreddingsmiddel of de hulpverleningsboot te water gelaten wordt, mag niet minder
      zijn dan die verkregen volgens de formule: S = 0,4 + 0,02H, waarin S = afviersnelheid in meters per seconde en H =
      hoogte in meters vanaf de davitkop tot aan de laagst gelegen lastlijn van het vaartuig in zeewater.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
  - number: 7.32.2.g
    text: |-
      De maximale afviersnelheid bedraagt 60 m/min, met inachtneming van het ontwerp van het groepsreddingsmiddel
      of de hulpverleningsboot, de bescherming van de inzittenden tegen buitensporige krachten en de sterkte
      van de tewaterlatingsvoorzieningen, en rekening houdend met de traagheidskrachten bij een noodstop. Het
      tewaterlatingsmiddel is zodanig ingericht dat wordt verzekerd dat deze snelheid niet zal worden overschreden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
  - number: 7.32.2.h
    text: |-
      Ieder tewaterlatingsmiddel voor de hulpverleningsboot kan de hulpverleningsboot beladen met volle bezetting en
      volledige uitrusting met een snelheid van ten minste 0,3 m/s ophijsen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
  - number: 7.32.2.i
    text: |-
      Op ieder tewaterlatingsmiddel zijn remmen aangebracht die het afvieren van het groepsreddingsmiddel of de
      hulpverleningsboot kunnen stoppen en deze met volle bezetting en volledige uitrusting beladen veilig kunnen
      vasthouden; de remblokken worden waar nodig beschermd tegen water en olie.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
  - number: 7.32.2.j
    text: |-
      Met de hand bedienbare remmen zijn zo aangebracht dat de rem altijd in werking staat, tenzij de bediener daarvan,
      of een mechanisme dat door de bediener in werking wordt gesteld, de rem in de afvierstand houdt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
  - number: 7.32.3
    text: |-
      *Tewaterlating door middel van vrij opdrijven* Wanneer voor een groepsreddingsmiddel een tewaterlatingsmiddel is
      voorgeschreven, terwijl het groepsreddingsmiddel ook vrij kan opdrijven, is de desbetreffende ontkoppeling van het
      groepsreddingsmiddel op de opstellingsplaats automatisch.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
  - number: 7.32.4
    text: |-
      *Tewaterlating door middel van vrije val* Ieder tewaterlatingsmiddel voor vrije val dat gebruik maakt van een
      hellend vlak, voldoet behalve aan de van toepassing zijnde bepalingen van het eerste lid ook aan de volgende eisen:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
  - number: 7.32.4.1°
    text: |-
      het tewaterlatingsmiddel is zo ingericht dat de inzittenden van het groepsreddingsmiddel tijdens de tewaterlating
      geen buitensporige krachten ondervinden;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
  - number: 7.32.4.2°
    text: |-
      het tewaterlatingsmiddel is een vaste constructie met een hellingshoek en een lengte, die groot genoeg is om er
      verzekerd van te zijn dat het groepsreddingsmiddel voldoende vrij komt van het schip, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
  - number: 7.32.4.3°
    text: |-
      het tewaterlatingsmiddel is voldoende beschermd tegen corrosie en is zo geconstrueerd dat brandopwekkende wrijving
      of vonkvorming door stoten tijdens de tewaterlating van het groepsreddingsmiddel wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
  - number: 7.32.5
    text: |-
      *Tewaterlating en inscheping met evacuatieglijbanen* Ieder tewaterlatingsmiddel in de vorm van een
      evacuatieglijbaan voldoet, behalve aan de van toepassing zijnde bepalingen in het eerste lid, ook aan de volgende
      eisen:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
  - number: 7.32.5.1°
    text: de evacuatieglijbaan kan door een persoon bij de inschepingsplaats worden ontplooid, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
  - number: 7.32.5.2°
    text: de evacuatieglijbaan kan bij harde wind en bij zeegang worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
  - number: 7.32.6
    text: |-
      *Tewaterlatingsmiddelen voor reddingsvlotten* Ieder tewaterlatingsmiddel voor reddingsvlotten voldoet aan het
      bepaalde in het eerste en tweede lid, met uitzondering van de bepalingen die betrekking hebben op het gebruik van
      zwaartekracht om het middel naar buiten te draaien, op het inschepen op de opstellingsplaats, en het weer ophijsen
      van het beladen reddingsvlot. Het tewaterlatingsmiddel moet zo zijn ingericht dat voortijdige ontkoppeling tijdens
      het afvieren wordt voorkomen, en dat het reddingsvlot automatisch wordt ontkoppeld wanneer dit het water raakt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
  - number: 7.32.7
    text: '*Inschepingsladders*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
  - number: 7.32.7.a
    text: |-
      Er zijn handgrepen aangebracht om een veilig overstappen van het dek op de bovenste treden van de inschepingsladder
      en omgekeerd te waarborgen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
  - number: 7.32.7.b
    text: 'De treden van de inschepingsladder:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
  - number: 7.32.7.b.1°
    text: |-
      zijn vervaardigd van hardhout, zonder kwasten of andere onregelmatigheden, glad afgewerkt en vrij van scherpe
      randen en splinters, dan wel van geschikt materiaal met gelijkwaardige eigenschappen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
  - number: 7.32.7.b.2°
    text: |-
      zijn voorzien van een doeltreffend antislip oppervlak, verkregen door groeven in lengterichting of door het
      aanbrengen van een goedgekeurde antislip laag;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
  - number: 7.32.7.b.3°
    text: |-
      zijn niet minder dan 480 mm lang, 115 mm breed en 25 mm dik, waarbij een antislip oppervlak of laag niet
      meegerekend wordt, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
  - number: 7.32.7.b.4°
    text: |-
      zijn op gelijke afstanden van niet minder dan 300 mm en niet meer dan 380 mm van elkaar op zodanige wijze
      bevestigd, dat zij de horizontale stand behouden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
  - number: 7.32.7.c
    text: |-
      De zijleiders van de inschepingsladder bestaan aan elke zijde uit twee onbeklede manilla-einden met een omtrek van
      ten minste 65 mm. Elk eind bestaat uit één stuk zonder verbindingen beneden de bovenste trede. Ander materiaal kan
      worden gebruikt op voorwaarde dat de afmetingen, breeksterkte, verwering, rek- en grijpeigenschappen ten minste
      gelijkwaardig zijn aan die van manillatouwwerk. Alle touweinden zijn zo afgewerkt dat ze niet kunnen rafelen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel7.32
  - number: '8.1'
    text: |-
      De artikelen in dit hoofdstuk zijn van toepassing op nieuwe en bestaande vaartuigen met een lengte van 24 meter
      of meer.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.1
  - number: 8.2.1
    text: |-
      De algemeen-alarminstallatie kan het algemeen-alarmsignaal geven, bestaande uit zeven of meer korte stoten gevolgd
      door één lange stoot, door middel van de scheepsfluit of -sirene, en bovendien door middel van een elektrische bel,
      claxon of ander gelijkwaardig waarschuwingssysteem dat wordt gevoed door de elektrische hoofdkrachtbron van het
      vaartuig en door de elektrische noodkrachtbron als voorgeschreven in [artikel 4.17][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel4
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 8.2.2
    text: Voor elke opvarende zijn duidelijke instructies aan boord, die in geval van nood gevolgd moeten worden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.2
  - number: 8.2.3
    text: |-
      De alarmrol is op verschillende plaatsen aan boord van het vaartuig opgehangen, in het bijzonder op de brug, in de
      machinekamer en in de bemanningsverblijven, en bevat de informatie, bedoeld in het vierde tot en met negende lid.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.2
  - number: 8.2.4
    text: |-
      De alarmrol bevat bijzonderheden inzake het algemeen alarmsignaal als voorgeschreven in het eerste lid en geeft
      tevens de maatregelen aan die door de bemanning genomen moeten worden wanneer dit signaal gegeven wordt. Op de
      alarmrol wordt ook aangegeven hoe het sein «schip verlaten» wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.2
  - number: 8.2.5
    text: 'Op de alarmrol worden de taken vermeld die aan de verschillende bemanningsleden zijn opgedragen, waaronder:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.2
  - number: 8.2.5.a
    text: |-
      het sluiten van de waterdichte deuren, brandwerende deuren, afsluiters, spuigaten, zijpoorten, schijnlichten,
      patrijspoorten en overige soortgelijke openingen in het vaartuig,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.2
  - number: 8.2.5.b
    text: het uitrusten van groeps- en overige reddingsmiddelen,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.2
  - number: 8.2.5.c
    text: het gereed maken en te water laten van groepsreddingsmiddelen,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.2
  - number: 8.2.5.d
    text: het gereed maken van andere reddingsmiddelen in het algemeen,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.2
  - number: 8.2.5.e
    text: het gebruik van communicatiemiddelen, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.2
  - number: 8.2.5.f
    text: het bemannen van de brandweerploegen die aangewezen zijn om branden te bestrijden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.2
  - number: 8.2.6
    text: |-
      Voor een vaartuig waarvan de lengte minder dan 45 m bedraagt, kan het Hoofd van de Scheepvaartinspectie afwijking
      van het bepaalde in het vijfde lid toestaan, indien hij van oordeel is dat in verband met het kleine aantal
      bemanningsleden een alarmrol niet noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.2
  - number: 8.2.7
    text: |-
      Op de alarmrol staat aangegeven welke officieren zijn aangewezen om er voor te zorgen dat de reddings- en
      brandbestrijdingsmiddelen in goede staat en klaar voor onmiddellijk gebruik worden gehouden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.2
  - number: 8.2.8
    text: |-
      Op de alarmrol zijn plaatsvervangers aangegeven voor de belangrijkste personen, indien deze niet tot handelen
      in staat zouden zijn, rekening houdend met het gegeven dat verschillende noodsituaties verschillende maatregelen
      noodzakelijk maken.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.2
  - number: 8.2.9
    text: |-
      De alarmrol wordt opgemaakt voordat het vaartuig een reis onderneemt. De schipper herziet de alarmrol of hij maakt
      een nieuwe, wanneer een verandering in de samenstelling van de bemanning dit noodzakelijk maakt nadat de alarmrol
      is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.2
  - number: 8.3.1
    text: '*Appèls en oefeningen*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.1.a
    text: |-
      Ieder bemanningslid neemt ten minste eenmaal per maand deel aan een oefening «schip verlaten» en een oefening
      in het blussen van brand. Voor vaartuigen met een lengte van minder dan 45 meter kan het Hoofd van de
      Scheepvaartinspectie afwijkingen van dit vereiste toestaan, mits er ten minste eenmaal per drie maanden een
      oefening «schip verlaten» en een oefening in het blussen van brand wordt gehouden. Deze oefeningen voor de
      bemanning vinden in ieder geval plaats binnen 24 uur nadat het vaartuig een haven heeft verlaten, indien meer dan
      25% van de bemanning niet heeft deelgenomen aan dergelijke oefeningen aan boord van dat vaartuig bij de vorige
      oefening. Het Hoofd van de Scheepvaartinspectie kan voor die categorie vaartuigen waarvoor dit praktisch niet
      uitvoerbaar is een andere opzet van de oefeningen toestaan mits deze ten minste gelijkwaardig is.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.1.b
    text: 'Iedere oefening «schip verlaten» omvat:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.1.b.1°
    text: |-
      het oproepen van de bemanning naar hun verzamelplaatsen door middel van het algemeen alarmsignaal en de
      vaststelling dat zij op de hoogte zijn van het sein «schip verlaten» zoals vermeld in de alarmrol;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.1.b.2°
    text: het melden op de verzamelplaatsen en voorbereiding op de taken zoals vermeld in de alarmrol;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.1.b.3°
    text: een controle of de bemanning doelmatig gekleed is;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.1.b.4°
    text: een controle of de reddingsgordels goed zijn aangedaan;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.1.b.5°
    text: het afvieren van ten minste een reddingsboot nadat deze voor het afvieren is gereed gemaakt;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.1.b.6°
    text: het starten en laten draaien van de motor van de reddingsboot, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.1.b.7°
    text: het bedienen van de tewaterlatingsmiddelen voor de reddingsvlotten van het strijkbare type.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.1.c
    text: 'Iedere oefening in het blussen van brand omvat ten minste:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.1.c.1°
    text: het melden op de verzamelplaatsen en het voorbereiden op de taken zoals omschreven in de alarmrol;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.1.c.2°
    text: |-
      het starten van een brandbluspomp en het gebruik van ten minste de twee voorgeschreven waterstralen om aan te tonen
      dat het systeem naar behoren werkt;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.1.c.3°
    text: een controle van de brandweeruitrusting en andere persoonlijke uitrustingen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.1.c.4°
    text: een controle van de van belang zijnde communicatiemiddelen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.1.c.5°
    text: |-
      een controle van de werking van de waterdichte deuren, branddeuren, brandkleppen en de voorzieningen voor
      ontsnapping, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.1.c.6°
    text: een controle van de noodzakelijke voorzieningen om aansluitend het vaartuig te verlaten.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.1.d
    text: |-
      Bij het afvieren als voorgeschreven in onderdeel b, onder 5°, worden, voorzover uitvoerbaar, bij opeenvolgende
      oefeningen de reddingsboten afwisselend gebruikt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.1.e
    text: Voorzover uitvoerbaar worden oefeningen uitgevoerd alsof er daadwerkelijk sprake is van een noodsituatie.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.1.f
    text: |-
      Iedere reddingsboot wordt ten minste eenmaal in de drie maanden tijdens een oefening «schip verlaten» met de
      aangewezen bemanning aan boord te water gelaten, waarbij tevens met de boot wordt gevaren.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.1.g
    text: |-
      Voorzover dat redelijk en uitvoerbaar is worden hulpverleningsboten, andere dan reddingsboten die tevens dienst
      doen als hulpverleningsboten, iedere maand met hun aangewezen bemanning te water gelaten waarbij tevens met de boot
      wordt gevaren. In ieder geval geschiedt dit ten minste eenmaal in de drie maanden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.1.h
    text: |-
      Wanneer oefeningen met het te water laten van reddingsboten en hulpverleningsboten gehouden worden met een
      vaartlopend vaartuig, worden deze oefeningen in verband met de gevaren die daaraan verbonden zijn, uitsluitend
      uitgevoerd in beschutte wateren en onder toezicht van een scheepsofficier met ervaring in dergelijke oefeningen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.1.i
    text: |-
      De noodverlichting ten behoeve van het verzamelen en het «schip verlaten» wordt bij iedere oefening «schip
      verlaten» beproefd.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.1.j
    text: |-
      De oefeningen kunnen aangepast worden naar de inrichtingen en voorzieningen van het vaartuig zoals die zijn
      voorgeschreven. Indien echter deze inrichtingen en voorzieningen op vrijwillige basis aan boord zijn, worden deze
      in de oefeningen gebruikt en worden de oefeningen overeenkomstig aangepast.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.2
    text: '*Opleiding aan boord en instructies*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.2.a
    text: |-
      Opleiding aan boord van het vaartuig in het gebruik van de reddingsmiddelen, met inbegrip van de uitrusting van de
      groepsreddingsmiddelen, wordt zo snel mogelijk gegeven, maar uiterlijk 2 weken nadat een bemanningslid aan boord
      is gekomen. Wanneer echter het bemanningslid op een regelmatig aflossingsschema aan boord is geplaatst, wordt deze
      opleiding gegeven binnen 2 weken nadat hij voor het eerst aan boord is gekomen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.2.b
    text: |-
      Instructie in het gebruik van de reddingsmiddelen en het overleven op zee wordt met dezelfde tussenpozen gegeven
      als de oefeningen. Individuele instructie kan verschillende onderdelen van het reddingssysteem omvatten, maar alle
      reddingsuitrusting en -middelen worden binnen een periode van 2 maanden behandeld. Ieder bemanningslid krijgt ten
      minste instructie inzake:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.2.b.1°
    text: |-
      de behandeling en het gebruik van de automatisch opblaasbare reddingsvlotten van het vaartuig met inbegrip van
      voorzorgsmaatregelen met betrekking tot schoenen met spijkers en andere scherpe voorwerpen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.2.b.2°
    text: |-
      de problemen in verband met onderkoeling, eerste hulp bij onderkoeling en andere van belang zijnde
      eerstehulpmaatregelen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.2.b.3°
    text: het gebruik van de reddingsmiddelen bij zwaar weer en hoge zeeën.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.2.c
    text: |-
      Instructie aan boord in het gebruik van strijkbare reddingsvlotten vindt met tussenpozen van niet meer dan vier
      maanden plaats op ieder vaartuig dat met dergelijke middelen is uitgerust. Voorzover praktisch uitvoerbaar omvat
      die instructie het opblazen en te water laten van een reddingsvlot. Dit reddingsvlot kan een speciaal reddingsvlot
      zijn dat uitsluitend is bestemd voor instructiedoeleinden en geen deel uitmaakt van de reddingsmiddelen van het
      vaartuig. Een dergelijk reddingsvlot is duidelijk als zodanig gemarkeerd.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.3
    text: |-
      *Aantekeningen* De data waarop appèls worden gehouden, de bijzonderheden van oefeningen in «schip verlaten» en
      oefeningen in het blussen van brand, oefeningen met andere reddingsmiddelen en opleiding aan boord worden in
      het scheepsdagboek aangetekend. Wanneer een volledig appèl, oefening of opleiding niet op de vastgestelde tijd
      plaatsvindt, wordt dat aangetekend in het scheepsdagboek, met vermelding van de omstandigheden en de mate waarin
      het appèl, de oefening of de opleiding is gehouden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.4
    text: '*Opleidingshandboek*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.4.a
    text: |-
      In ieder bemanningsverblijf of in iedere hut voor bemanningsleden is een handboek voor opleiding voorhanden.
      Dit handboek, dat uit verschillende banden kan bestaan, bevat instructies en informatie in duidelijke
      bewoordingen en waar mogelijk geïllustreerd, ten aanzien van de aan boord geplaatste reddingsmiddelen en de beste
      overlevingsmethoden. In plaats van in dit handboek kan de informatie of enig deel daarvan ook met behulp van
      audiovisuele middelen worden verstrekt. De volgende punten dienen uitvoerig te worden toegelicht:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.4.a.1°
    text: het aandoen van reddingsgordels en overlevingspakken;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.4.a.2°
    text: het verzamelen op de daarvoor aangewezen plaatsen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.4.a.3°
    text: het inschepen in, het te water laten en het vrijkomen van de groepsreddingsmiddelen en de hulpverleningsboten;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.4.a.4°
    text: de manier waarop een groepsreddingsmiddel vanuit dat middel te water wordt gelaten;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.4.a.5°
    text: het ontkoppelen van de tewaterlatingsmiddelen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.4.a.6°
    text: |-
      de werkwijze en het gebruik van de middelen voor bescherming op de tewaterlatingsplaatsen, voorzover van
      toepassing;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.4.a.7°
    text: de verlichting van de tewaterlatingsplaatsen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.4.a.8°
    text: het gebruik van alle overlevingsuitrusting;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.4.a.9°
    text: het gebruik van alle ontdekkingsmiddelen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.4.a.10°
    text: met behulp van illustraties, het gebruik van radioapparatuur voor reddingsmiddelen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.4.a.11°
    text: het gebruik van drijfankers;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.4.a.12°
    text: het gebruik van motor en accessoires;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.4.a.13°
    text: het terughalen van groepsreddingsmiddelen en hulpverleningsboten, terugplaatsen en vastzetten daarbij inbegrepen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.4.a.14°
    text: de gevaren van blootstelling aan weer en zee en de noodzaak van warme kleding;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.4.a.15°
    text: het op de beste wijze gebruiken van de voorzieningen van de groepsreddingsmiddelen ten behoeve van overleving;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.4.a.16°
    text: |-
      de redding van drenkelingen uit zee, waarbij inbegrepen het gebruik van de reddingsuitrusting van een helikopter
      (stroppen, manden, draagbaren), reddingsboeien met broeking, overige reddingsapparatuur, gebruikt vanaf de wal, en
      het lijnwerptoestel van het vaartuig;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.4.a.17°
    text: alle andere activiteiten die de alarmrol en de instructies voor noodgevallen aangeven, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.4.a.18°
    text: aanwijzingen voor noodreparaties van de reddingsmiddelen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: 8.3.4.b
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan voor vaartuigen met een lengte van minder dan 45 meter verlichting van
      het bepaalde onder a toestaan mits er voldoende veiligheidsinformatie aan boord is.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.3
  - number: '8.4'
    text: |-
      De bemanning is voldoende geoefend in het uitoefenen van haar taken gedurende noodsituaties. Deze oefeningen zullen
      ten minste, voorzover van toepassing, bevatten:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.a
    text: verschillende noodsituaties die zich kunnen voordoen zoals aanvaringen, brand en vergaan;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.b
    text: verschillende reddingsmiddelen die gewoonlijk op een vaartuig aanwezig zijn;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.c
    text: noodzaak om zich aan de algemeen geldende regels van overleven te houden;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.d
    text: waarde van oefenen en appèls;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.e
    text: 'de noodzaak om te allen tijde voorbereid te zijn op een noodsituatie en voortdurend alert te zijn op:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.e.1°
    text: |-
      de informatie op de alarmrol, in het bijzonder: - de specifieke taken in een noodsituatie voor elke opvarende,
        - de inschepingsplaats voor elke opvarende, en
        - de signalen die aangeven dat men zich naar de inschepingsplaats dan wel het brandstation dient te begeven;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.e.2°
    text: de plaats waar de persoonlijke en de reserve reddingsgordels zich bevinden;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.e.3°
    text: de plaatsen waar men een brandalarm kan activeren;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.e.4°
    text: de mogelijkheden tot ontsnapping;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.e.5°
    text: de gevolgen van paniek;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.f
    text: |-
      maatregelen die genomen moeten worden om personen met een helikopter op te hijsen van het eigen vaartuig of uit
      een groepsreddingsmiddel;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.g
    text: 'maatregelen die genomen moeten worden indien men zich naar de inschepingsplaats dient te begeven, waaronder:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.g.1°
    text: aantrekken van geschikte kleding,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.g.2°
    text: aantrekken van een reddingsgordel, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.g.3°
    text: het verzamelen van extra bescherming, bijvoorbeeld dekens indien de tijd dit toelaat;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.h
    text: 'maatregelen die genomen moeten worden bij «schip verlaten», waaronder:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.h.1°
    text: hoe men zich vanaf het vaartuig en vanuit het water kan inschepen in een groepsreddingsmiddel, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.h.2°
    text: |-
      hoe men vanaf een hoogte in de zee moet springen met een zo gering mogelijke kans op letsel bij het in het water
      komen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.i
    text: 'maatregelen die men dient te nemen indien men zich in het water bevindt, zoals:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.i.1°
    text: |-
      hoe men overleeft in situaties van: - brand of olie op het water;
        - koude omstandigheden, en
        - wateren waarin haaien voorkomen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.i.2°
    text: hoe een gekapseisd groepsreddingsmiddel opgericht kan worden;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.j
    text: 'maatregelen die genomen dienen te worden indien men zich in een groepsreddingsmiddel bevindt, zoals:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.j.1°
    text: een groepsreddingsmiddel snel van het vaartuig vrij zien te krijgen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.j.2°
    text: bescherming tegen kou of extreme warmte;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.j.3°
    text: gebruik van een zee-anker;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.j.4°
    text: houden van een uitkijk;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.j.5°
    text: uit de zee halen van en het zorgen voor overlevenden;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.j.6°
    text: het zorg dragen dat een groepsreddingsmiddel door derden opgespoord kan worden;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.j.7°
    text: controleren en juist gebruiken van de beschikbare uitrusting van een groepsreddingsmiddel, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.j.8°
    text: het voorzover mogelijk in de buurt blijven van het vaartuig;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.k
    text: 'de belangrijkste gevaren voor overlevenden en de algemeen geldende regels voor overleven, waaronder:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.k.1°
    text: voorzorgsmaatregelen die genomen dienen te worden in koude omstandigheden;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.k.2°
    text: voorzorgsmaatregelen die genomen dienen te worden in tropische omstandigheden;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.k.3°
    text: blootstelling aan zon, wind, regen en zee;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.k.4°
    text: het belang van het dragen van geschikte kleding;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.k.5°
    text: beschermende maatregelen in een groepsreddingsmiddel;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.k.6°
    text: gevolgen van onderdompeling in het water en onderkoeling;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.k.7°
    text: het belang van het behoud van lichaamsvloeistoffen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.k.8°
    text: bescherming tegen zeeziekte;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.k.9°
    text: juist gebruik van drinkwater en voedsel;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.k.10°
    text: gevolgen van het drinken van zeewater;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.k.11°
    text: beschikbare middelen om opsporing door derden te vergroten;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.k.12°
    text: het belang van moed houden;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.l
    text: 'maatregelen die genomen dienen te worden bij het blussen van brand, zoals:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.l.1°
    text: het gebruik van brandslangen met verschillende spuitstukken;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.l.2°
    text: het gebruik van draagbare brandblussers;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.l.3°
    text: kennis hebben van de plaats van branddeuren;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 8.4.l.4°
    text: het gebruik van ademhalingsapparatuur.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel8.4
  - number: 9.1.1
    text: |-
      Tenzij anders is bepaald is dit hoofdstuk van toepassing op vissersvaartuigen met een lengte van 45 meter of meer
      en op nieuwe Nederlandse vissersvaartuigen met een lengte van 24 meter of meer.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.1
  - number: 9.1.2
    text: |-
      Niets in dit hoofdstuk staat eraan in de weg dat een vaartuig, een groepsreddingsmiddel of een persoon in nood elk
      beschikbaar middel gebruikt om aandacht te trekken, zijn positie kenbaar te maken of hulp te krijgen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.1
  - number: 9.2.1
    text: 'Voor de toepassing van dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.2
  - number: 9.2.1.a
    text: |-
      *berichtgeving van brug tot brug:* veiligheidsberichtgeving tussen vaartuigen, vanaf de plaats aan boord waar
      gewoonlijk de navigatie wordt gevoerd;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.2
  - number: 9.2.1.b
    text: |-
      *ononderbroken wacht:* de radiowacht die niet mag worden onderbroken, anders dan voor korte perioden waarin de
      ontvangst geheel of gedeeltelijk wordt onderdrukt door eigen berichtgeving of tijdens een periodieke onderhouds- of
      controlebeurt van de apparatuur;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.2
  - number: 9.2.1.c
    text: |-
      *DSC (digital selective calling):* een techniek waarbij digitale codes worden gebruikt die een radiostation in
      staat stelt verbinding tot stand te brengen en informatie uit te wisselen met een ander station, of groep van
      stations, en die voldoet aan de van toepassing zijnde aanbevelingen van het Internationale Raadgevende Comité
      inzake Radioaangelegenheden (CCIR);
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.2
  - number: 9.2.1.d
    text: |-
      *DPT (direct printing telegraphy):* een telegrafietechniek die voldoet aan de van toepassing zijnde aanbevelingen
      van het CCIR;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.2
  - number: 9.2.1.e
    text: |-
      *algemene radioberichtgeving:* het operationele en openbare verkeer per radio, anders dan de nood- en
      veiligheidsberichten;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.2
  - number: 9.2.1.f
    text: '*INMARSAT:* de Internationale Maritieme Satelliet Organisatie;'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.2
  - number: 9.2.1.g
    text: |-
      *internationaal NAVTEX systeem:* de gecoördineerde uitzending en automatische ontvangst op de frequentie van
      518 kHz van maritieme veiligheidsinformatie door toepassing van DPT, waarbij de Engelse taal wordt gebruikt;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.2
  - number: 9.2.1.h
    text: '*opsporen:* het bepalen van de positie van een schip, vaartuig, luchtvaartuig of personen in nood;'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.2
  - number: 9.2.1.i
    text: |-
      *maritieme veiligheidsinformatie:* navigatiewaarschuwingen, meteorologische waarschuwingen en verwachtingen en
      andere spoedeisende veiligheidsberichten die naar vaartuigen worden verzonden;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.2
  - number: 9.2.1.j
    text: |-
      *POSS (polar orbiting satellite service):* het COSPAS-SARSAT-satellietsysteem dat met behulp van satellieten die
      een baan om de aardse polen doorlopen, noodalarmering van satellietnoodradiobakens ontvangt, deze opnieuw uitzendt
      en daarbij hun positie opgeeft;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.2
  - number: 9.2.1.k
    text: |-
      *Radioreglement:* het Radioreglement (Trb. 1981, 78), behorende bij het op 22 december 1992 te Genève tot stand
      gekomen Statuut en Verdrag van de Internationale Unie voor Telecommunicatie (Trb. 1993, 138);
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.2
  - number: 9.2.1.l
    text: |-
      *zeegebied A1:* een gebied binnen het radiotelefoniebereik van ten minste een VHF-radiokuststation waarin een
      ononderbroken DSC-alarmering beschikbaar is;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.2
  - number: 9.2.1.m
    text: |-
      *zeegebied A2:* een gebied, met uitzondering van het zeegebied A1, binnen het radiotelefoniebereik van ten minste
      een MF-radiokuststation waarin een ononderbroken DSC-alarmering beschikbaar is;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.2
  - number: 9.2.1.n
    text: |-
      *zeegebied A3:* een gebied, met uitzondering van de zeegebieden A1 en A2, binnen het bereik van een geostationaire
      INMARSAT-satelliet waarin een ononderbroken alarmering beschikbaar is;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.2
  - number: 9.2.1.o
    text: '*zeegebied A4:* een gebied buiten de zeegebieden A1, A2 en A3.'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.2
  - number: 9.2.2
    text: |-
      Alle andere uitdrukkingen en afkortingen die in dit hoofdstuk worden gebruikt en die in het Radioreglement
      gedefinieerd staan hebben dezelfde betekenis als in dat reglement.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.2
  - number: 9.3.1
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan gedeeltelijke of voorwaardelijke ontheffing verlenen van de eisen,
      gesteld bij of krachtens de [artikelen 9.6 tot en met 9.10][ref1] en [9.14, zevende lid][ref2], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0013342#Artikel9
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013342
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.3.1.a
    text: |-
      voldaan wordt aan [artikel 9.4][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel9
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.3.1.b
    text: |-
      de algemene doelmatigheid van de dienstverlening ten behoeve van de veiligheid van alle vaartuigen niet in het
      geding komt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.3
  - number: 9.3.2
    text: 'Een ontheffing als bedoeld in het eerste lid kan uitsluitend worden verleend:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.3
  - number: 9.3.2.a
    text: |-
      indien de omstandigheden met betrekking tot de veiligheid zodanig zijn dat de volledige toepassing van de
      [artikelen 9.6 tot en met 9.10][ref1] en [9.14, zevende lid][ref2], onredelijk of onnodig is, of


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0013342#Artikel9
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013342
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.3.2.b
    text: |-
      in uitzonderlijke omstandigheden, voor een eenmalige reis buiten het zeegebied of de zeegebieden waarvoor het
      vaartuig is uitgerust.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.3
  - number: 9.3.3
    text: |-
      Zo spoedig mogelijk na 1 januari van elk jaar zendt het Hoofd van de Scheepvaartinspectie een rapport aan de IMO
      betreffende alle ontheffingen die gedurende het afgelopen kalenderjaar op grond van het eerste en tweede lid zijn
      afgegeven, met vermelding van de gronden voor die ontheffingen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.3
  - number: '9.4'
    text: 'Elk vissersvaartuig dat zich op zee bevindt is in staat om:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.4
  - number: 9.4.a
    text: |-
      noodalarmering van het vaartuig naar de wal te verzenden met ten minste twee verschillende, van
      elkaar onafhankelijke installaties, met gebruikmaking van gescheiden radiocommunicatie systemen,
      uitgezonderd in de omstandigheid, bedoeld in [artikel 9.7, eerste lid, onder a][ref1], en
      [artikel 9.9, eerste lid, onder d, 3°][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0013342#Artikel9
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013342
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.4.b
    text: noodalarmering van de wal naar het vaartuig te ontvangen,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.4
  - number: 9.4.c
    text: noodalarmering van vaartuig naar vaartuig te verzenden en te ontvangen,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.4
  - number: 9.4.d
    text: berichtgeving betreffende opsporings- en reddingscoördinatie te verzenden en te ontvangen,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.4
  - number: 9.4.e
    text: berichtgeving op locatie te verzenden en te ontvangen,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.4
  - number: 9.4.f
    text: |-
      de signalen ten behoeve van het opsporen van schepen, vissersvaartuigen, luchtvaartuigen of personen in nood te
      verzenden en, door middel van de in [artikel 10.3, zesde lid][ref1], voorgeschreven radarapparatuur, te ontvangen,


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel10
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '10'
        hoofdstuk: '10'
  - number: 9.4.g
    text: maritieme veiligheidsinformatie te verzenden en te ontvangen,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.4
  - number: 9.4.h
    text: algemene radioberichtgeving naar of van radiosystemen of netwerken aan de wal, te verzenden en te ontvangen, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.4
  - number: 9.4.i
    text: berichtgeving van brug tot brug te verzenden en te ontvangen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.4
  - number: 9.5.1
    text: |-
      Een vissersvaartuig is uitgerust met radio-installaties die in staat zijn om gedurende de hele voorgenomen reis
      te voldoen aan [artikel 9.4][ref1] en die tevens voldoen aan [artikel 9.6][ref2] en, voorzover van toepassing in
      het zeegebied of de zeegebieden waarbinnen de voorgenomen reis valt, aan de [artikelen 9.7 tot en met 9.10][ref3],
      tenzij een ontheffing is verleend als bedoeld in [artikel 9.3][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0013342#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0013342#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0013342#Artikel9
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.5
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0013342
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0013342
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0013342
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.5.2
    text: 'De radio-installatie is:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.5
  - number: 9.5.2.a
    text: |-
      zo geplaatst dat geen schadelijke invloeden van mechanische, elektrische of andere oorsprong de goede werking
      aantasten en dat de elektromagnetische compatibiliteit en de preventie van schadelijke wisselwerking met andere
      apparatuur en systemen is gewaarborgd,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.5
  - number: 9.5.2.b
    text: |-
      zo veilig als praktisch uitvoerbaar opgesteld, waarbij de operationele beschikbaarheid zo veel mogelijk is
      gewaarborgd,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.5
  - number: 9.5.2.c
    text: |-
      beschermd tegen schadelijke gevolgen van water, extreme temperaturen en andere ongunstige omstandigheden in de
      directe omgeving,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.5
  - number: 9.5.2.d
    text: |-
      voorzien van betrouwbare, blijvend aangebrachte elektrische verlichting, die onafhankelijk is van de elektrische
      hoofd- en noodkrachtbronnen, en die het bedieningspaneel van de radio-installatie voldoende kan verlichten, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.5
  - number: 9.5.2.e
    text: |-
      duidelijk voorzien van het internationaal naamsein, de identificatieaanduiding van het scheepsstation en andere
      aanduidingen ten behoeve van het gebruik van de radio-installatie.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.5
  - number: 9.5.3
    text: |-
      De bediening van de VHF-kanalen die ten behoeve van de veiligheid van de navigatie zijn voorgeschreven is op de
      brug zo dicht mogelijk gesitueerd bij de plaats waar de navigatie wordt gevoerd en waar nodig zijn voorzieningen
      getroffen om de radiocommunicatie vanaf de brugvleugels te kunnen afhandelen. Voor dit laatste mogen draagbare VHF-
      radio-installaties worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.5
  - number: '9.6'
    text: |-
      Behalve in het geval, bedoeld in [artikel 9.9, vierde lid][ref1], is elk vaartuig uitgerust met:


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel9
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.6
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.6.a
    text: 'een VHF-radio-installatie die in staat is tot het zenden en ontvangen van:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.6
  - number: 9.6.a.1°
    text: |-
      DSC op kanaal 70 (156 525 MHz), waarbij het mogelijk is om het verzenden van noodalarmering op kanaal 70 te starten
      vanaf de plaats aan boord waar gewoonlijk de navigatie wordt gevoerd, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.6
  - number: 9.6.a.2°
    text: radiotelefonie op de kanalen 6, 13 en 16 (respectievelijk 156 300 MHz, 156 650 MHz en 156 800 MHz);
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.6
  - number: 9.6.b
    text: |-
      een radio-installatie die geschikt is om continu DSC-wacht te houden op kanaal 70, al dan niet in combinatie met de
      VHF-radio-installatie, bedoeld onder a, 1°;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.6
  - number: 9.6.c
    text: 'een radartransponder, werkend in de 9 GHz band, die:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.6
  - number: 9.6.c.1°
    text: zo is geplaatst dat hij gemakkelijk kan worden bediend, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.6
  - number: 9.6.c.2°
    text: |-
      een van de in [artikel 7.14][ref1] voorgeschreven radartransponders voor de groepsreddingsmiddelen kan zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.6
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 9.6.d
    text: |-
      een ontvanger die de uitzendingen van het internationaal NAVTEX-systeem kan ontvangen indien het vaartuig reizen
      maakt in een gebied waar het internationaal NAVTEX-systeem wordt toegepast;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.6
  - number: 9.6.e
    text: |-
      een radiovoorziening voor de ontvangst van maritieme veiligheidsberichtgeving door het EGC-systeem indien het
      vaartuig is bestemd om reizen te ondernemen in een vaargebied binnen het bereik van het INMARSAT-systeem waar geen
      internationaal NAVTEX-systeem beschikbaar is. Het Hoofd van de Scheepvaartinspectie kan vaartuigen die uitsluitend
      bestemd zijn om reizen te ondernemen in gebieden waar een DPT-systeem voor maritieme veiligheidsberichtgeving
      beschikbaar is en die zijn uitgerust met apparatuur die geschikt is om van dit systeem gebruik te maken, ontheffing
      verlenen van het bepaalde in dit lid;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.6
  - number: 9.6.f
    text: |-
      met inachtneming van het bepaalde in [artikel 9.7, derde lid][ref1], een satellietnoodradiobaken dat:


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel9
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.6
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.6.f.1°
    text: |-
      noodberichten kan verzenden door ofwel gebruik te maken van het POSS in de 406 MHz-band ofwel, indien het vaartuig
      bestemd is om alleen reizen te ondernemen binnen het vaargebied waarvoor INMARSAT dekking biedt, gebruik te maken
      van het geostationaire INMARSAT-satellietsysteem werkend in de 1.6 GHz-band,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.6
  - number: 9.6.f.2°
    text: geïnstalleerd is op een gemakkelijk toegankelijke plaats,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.6
  - number: 9.6.f.3°
    text: met de hand losgemaakt kan worden en door één persoon in een groepsreddingsmiddel kan worden gedragen,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.6
  - number: 9.6.f.4°
    text: vrij kan opdrijven indien het vaartuig zinkt en automatisch wordt geactiveerd zodra het drijft, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.6
  - number: 9.6.f.5°
    text: met de hand geactiveerd kan worden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.6
  - number: 9.7.1
    text: |-
      In aanvulling op het bepaalde in [artikel 9.6][ref1] is een vaartuig dat bestemd is om uitsluitend reizen in het
      zeegebied A1 te ondernemen uitgerust met een radio-installatie die vanaf de plaats aan boord waar gewoonlijk de
      navigatie wordt gevoerd het verzenden van noodalarmering naar de wal kan starten door middel van hetzij:


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel9
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.7
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.7.1.a
    text: |-
      VHF met gebruik van DSC; hierin kan worden voorzien door installatie van het in het derde lid voorgeschreven
      noodradiobaken zodanig dat het op de plaats aan boord waar gewoonlijk de navigatie wordt gevoerd of vanaf die
      plaats op afstand kan worden bediend, of
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.7
  - number: 9.7.1.b
    text: |-
      door de POSS op de frequentie van 406 MHz; hierin kan worden voorzien door installatie van het in
      [artikel 9.6, eerste lid, onder f][ref1], voorgeschreven satelliet-noodradiobaken zodanig dat het op de plaats aan
      boord waar gewoonlijk de navigatie wordt gevoerd of vanaf die plaats op afstand kan worden bediend, of


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel9
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.7
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.7.1.c
    text: 'indien het vaartuig reizen onderneemt binnen het bereik van MF-kuststations met DSC: MF met gebruik van DSC, of'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.7
  - number: 9.7.1.d
    text: HF met gebruik van DSC, of
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.7
  - number: 9.7.1.e
    text: 'het geostationaire INMARSAT-satellietsysteem; hierin kan worden voorzien door gebruikmaking van:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.7
  - number: 9.7.1.e.1°
    text: een INMARSAT-scheepssatellietstation, of
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.7
  - number: 9.7.1.e.2°
    text: |-
      het in [artikel 9.6, onder f][ref1], voorgeschreven satelliet-noodradiobaken, zodanig geïnstalleerd dat het op de
      plaats aan boord waar gewoonlijk de navigatie wordt gevoerd of vanaf die plaats op afstand kan worden bediend.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel9
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.7
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.7.2
    text: |-
      De in [artikel 9.6, onder a][ref1], voorgeschreven VHF-radio-installatie is ook geschikt voor algemene radio
      berichtgeving met gebruik van radiotelefonie.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel9
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.7
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.7.3
    text: |-
      Vaartuigen die bestemd zijn om uitsluitend reizen in zeegebied A1 te ondernemen kunnen in plaats van een satelliet-
      noodradiobaken als voorgeschreven in [artikel 9.6, onder f][ref1], volstaan met een noodradiobaken dat:


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel9
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.7
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.7.3.a
    text: |-
      een noodalarmering kan uitzenden op VHF-kanaal 70 met gebruik van DSC en dat voorzien is van een radartransponder,
      werkend in de 9 GHz-band, teneinde te kunnen worden opgespoord,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.7
  - number: 9.7.3.b
    text: geïnstalleerd is op een gemakkelijk toegankelijke plaats,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.7
  - number: 9.7.3.c
    text: snel met de hand losgemaakt kan worden en door één persoon in een groepsreddingsmiddel kan worden gebracht,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.7
  - number: 9.7.3.d
    text: vrij kan opdrijven indien het vaartuig zinkt en automatisch wordt geactiveerd zodra het drijft, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.7
  - number: 9.7.3.e
    text: met de hand geactiveerd kan worden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.7
  - number: 9.7.4
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan nieuwe vaartuigen met een lengte van meer dan 24 meter maar minder dan
      45 meter ontheffing verlenen van [artikel 9.6, onder f][ref1], en [artikel 9.7, derde lid][ref2], mits deze zijn
      uitgerust met een VHF-radio-installatie als bepaald bij [artikel 9.6, onder a][ref3], alsmede met een aanvullende
      VHF-radio-installatie met DSC voor de verzending van noodsignalen van schip naar kust als bepaald in het eerste
      lid, onder a.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0013342#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0013342#Artikel9
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.7
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013342
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0013342
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.8.1
    text: |-
      In aanvulling op het bepaalde in [artikel 9.6][ref1] is een vaartuig dat bestemd is om reizen te ondernemen buiten
      het zeegebied A1, maar binnen het zeegebied A2, voorzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel9
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.8
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.8.1.a
    text: |-
      een MF-radio-installatie die voor nood- en veiligheidsdoeleinden geschikt is om te zenden en te ontvangen op de
      frequenties van:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.8
  - number: 9.8.1.a.1°
    text: 2187,5 kHz met gebruik van DSC en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.8
  - number: 9.8.1.a.2°
    text: 2182 kHz met gebruik van radiotelefonie;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.8
  - number: 9.8.1.b
    text: |-
      een radio-installatie die geschikt is om een permanente DSC-wacht te houden op de frequentie van 2187,5 kHz,
      afzonderlijk of gecombineerd met de installatie bedoeld onder a, 1°, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.8
  - number: 9.8.1.c
    text: |-
      een voorziening die de uitzending van noodseinen van het schip naar de wal kan starten door middel van een radio-
      installatie die niet in de MF-band uitzendt, hetzij:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.8
  - number: 9.8.1.c.1°
    text: |-
      door de POSS op de frequentie van 406 MHz; hierin kan worden voorzien door installatie van het in
      [artikel 9.6, eerste lid, onder f][ref1], voorgeschreven satellietnoodradiobaken zodanig dat het op de plaats aan
      boord waar gewoonlijk de navigatie wordt gevoerd of vanaf die plaats op afstand kan worden bediend, of


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel9
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.8
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.8.1.c.2°
    text: HF met gebruik van DSC, of
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.8
  - number: 9.8.1.c.3°
    text: |-
      het geostationaire INMARSAT-satellietsysteem. Hierin kan worden voorzien door gebruikmaking van een INMARSAT-
      scheepssatellietstation of het in artikel 9.6, onder f, voorgeschreven satellietnoodradiobaken, zodanig
      geïnstalleerd dat het op de plaats aan boord waar gewoonlijk de navigatie wordt gevoerd of vanaf die plaats op
      afstand kan worden bediend.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.8
  - number: 9.8.2
    text: |-
      Het starten van de uitzending van noodalarmering door middel van de radio-installatie, bedoeld in het eerste lid,
      onder a en c, is mogelijk vanaf de plaats aan boord waar gewoonlijk de navigatie wordt gevoerd.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.8
  - number: 9.8.3
    text: |-
      Het vaartuig is tevens in staat om algemene radioberichten uit te zenden en te ontvangen met gebruik van
      radiotelefonie of DPT door middel van:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.8
  - number: 9.8.3.a
    text: |-
      een radio-installatie werkend op frequenties in de banden tussen 1605 en 4000 kHz of tussen 4000 en 27 500 kHz.
      Hierin kan worden voorzien door deze te combineren met de radio-installatie bedoeld in artikel 9.1, onder a, of
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.8
  - number: 9.8.3.b
    text: een INMARSAT-scheepssatellietstation.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.8
  - number: 9.8.4
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan ontheffing verlenen van de eisen, bedoeld in
      [artikel 9.6, onder a, 1°, en onder b][ref1], voor vaartuigen die zijn gebouwd voor 1 februari 1997 en die
      uitsluitend bestemd zijn om reizen te ondernemen in zeegebied A2, mits deze vaartuigen, zo mogelijk, een
      ononderbroken luisterwacht houden op VHF-kanaal 16. Deze wacht wordt gehouden op de plaats aan boord waar
      gewoonlijk de navigatie wordt gevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel9
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.8
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.9.1
    text: |-
      In aanvulling op het bepaalde in [artikel 9.6][ref1] is een vaartuig dat bestemd is om reizen te ondernemen buiten
      de zeegebieden A1 en A2, maar binnen het zeegebied A3 en dat niet voldoet aan het bepaald in het tweede lid,
      voorzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel9
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.9
    references:
