        paragraaf: '2'
  - number: 13.2.2
    text: |-
      Na de inwerkingtreding van dit besluit berusten de Regeling wachtalarminstallatie en de Regeling
      wachtalarminstallatie voor de Nederlandse Antillen op [artikel 6.14, zevende lid][ref1], van dit besluit.


