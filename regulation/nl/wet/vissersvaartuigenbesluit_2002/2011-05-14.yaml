        artikel: '6'
        hoofdstuk: '6'
  - number: 13.3.1
    text: |-
      Het [Vissersvaartuigenbesluit][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0004607
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel13.3
    references:
      - id: ref1
        bwb_id: BWBR0004607
  - number: 13.3.2
    text: |-
      In afwijking van het eerste lid blijven ten aanzien van vissersvaartuigen met een lengte van minder dan 24 m de
      bepalingen van het [Vissersvaartuigenbesluit][ref1] zoals deze voor die vaartuigen golden voor de inwerkingtreding
      van dit besluit, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004607
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel13.3
    references:
      - id: ref1
        bwb_id: BWBR0004607
  - number: 13.4.1
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel13.4
  - number: 13.4.2
    text: |-
      In afwijking van het eerste lid treedt het bepaalde in [artikel 6.14, zesde lid][ref1], en
      [artikel 6.15, eerste lid, tweede volzin, en vierde lid][ref2], voor vissersvaartuigen, gebouwd voor 23 november
      1995, met ingang van 23 november 2002 in werking.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0013342#Artikel6
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel13.4
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0013342
        artikel: '6'
        hoofdstuk: '6'
  - number: '13.5'
    text: 'Dit besluit wordt aangehaald als: Vissersvaartuigenbesluit 2002.'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel13.5
