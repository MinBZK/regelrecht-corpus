        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.11.1.c
    text: |-
      op de DSC-nood- en veiligheidsfrequenties van 2187,5 kHz en 8414,5 kHz, alsmede op ten minste een van de DSC nood-
      en veiligheidsfrequenties van 4207,5 kHz, 6312 kHz, 12 577 kHz of 16 804,5 kHz, afhankelijk van het tijdstip en de
      geografische positie van het vaartuig, indien het vaartuig overeenkomstig [artikel 9.9, tweede lid, onder b][ref1],
      of [artikel 9.10, eerste lid][ref2], is uitgerust met een MF/HF-radio-installatie. Deze wacht kan worden gehouden
      door middel van een scannende ontvanger;


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0013342#Artikel9
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.11
    references:
      - id: ref1
        bwb_id: BWBR0013342
