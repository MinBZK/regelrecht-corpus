    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.9
  - number: 9.9.1.a.2°
    text: oproepen met noodprioriteiten te starten en te ontvangen,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.9
  - number: 9.9.1.a.3°
    text: |-
      een wacht te onderhouden voor noodalarmering van de wal naar het schip, met inbegrip van die berichten die gericht
      zijn op specifiek omschreven geografische gebieden, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.9
  - number: 9.9.1.a.4°
    text: algemene radioberichtgeving te verzenden en te ontvangen met gebruik van radiotelefonie of DPT;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.9
  - number: 9.9.1.b
    text: |-
      een MF-radio-installatie die geschikt is om voor nood- en veiligheidsdoeleinden te zenden en te ontvangen op de
      frequenties van:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.9
  - number: 9.9.1.b.1°
    text: 2187,5 kHz met gebruik van DSC, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.9
  - number: 9.9.1.b.2°
    text: 2182 kHz met gebruik van radiotelefonie;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.9
  - number: 9.9.1.c
    text: |-
      een radio-installatie die geschikt is om een permanente DSC-wacht te onderhouden op de frequentie van 2187,5 kHz,
      afzonderlijk of gecombineerd met de installatie, bedoeld onder b, 1°, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.9
  - number: 9.9.1.d
    text: 'een radio-installatie die geschikt is om uitzendingen van noodalarmering naar de wal te starten door middel van:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.9
  - number: 9.9.1.d.1°
    text: |-
      de POSS op de frequentie van 406 MHz; hierin kan worden voorzien door installatie van het in
      [artikel 9.6, onder f][ref1], voorgeschreven satellietnoodradiobaken zodanig dat het op de plaats aan boord waar
      gewoonlijk de navigatie wordt gevoerd of vanaf die plaats op afstand kan worden bediend, of


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel9
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.9
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.9.1.d.2°
    text: HF met gebruik van DSC, of
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.9
  - number: 9.9.1.d.3°
    text: |-
      het geostationaire INMARSAT-satellietsysteem; hierin kan worden voorzien door gebruikmaking van een INMARSAT-
      scheepssatellietstation of het in [artikel 9.6, onder f][ref1], voorgeschreven satellietnoodradiobaken, zodanig
      geïnstalleerd dat het op de plaats aan boord waar gewoonlijk de navigatie wordt gevoerd of vanaf die plaats op
