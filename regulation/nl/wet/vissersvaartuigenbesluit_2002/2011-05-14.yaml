    text: |-
      In aanvulling op het bepaalde in [artikel 9.6][ref1] voldoet een vaartuig dat bestemd is om reizen te ondernemen in
      alle zeegebieden aan het bepaalde in [artikel 9.9, tweede lid][ref2], met dien verstande dat de apparatuur, bedoeld
