  - number: 9.12.2.a
    text: 'op nieuwe vaartuigen:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.12
  - number: 9.12.2.a.1°
    text: 3 uur of
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.12
  - number: 9.12.2.a.2°
    text: |-
      1 uur, wanneer de noodkrachtbron volledig voldoet aan het bepaalde in [artikel 4.17][ref1], met inbegrip van het
      bepaalde ten aanzien van de voeding van de radio-installaties, en minimaal 6 uur dienst kan doen;


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel4
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.12
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 9.12.2.b
    text: 'op bestaande vaartuigen:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.12
  - number: 9.12.2.b.1°
    text: |-
      6 uur wanneer niet is voorzien in een noodkrachtbron of wanneer deze niet voldoet aan het bepaalde in
      [artikel 4.17][ref1], met inbegrip van het bepaalde ten aanzien van de voeding van de radio-installaties, of


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel4
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.12
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 9.12.2.b.2°
    text: |-
      3 uur wanneer de noodkrachtbron voldoet aan het bepaalde in [artikel 4.17][ref1], met inbegrip van het bepaalde ten
      aanzien van de voeding van de radio-installaties, of


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel4
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.12
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 9.12.2.b.3°
    text: |-
      1 uur wanneer de noodkrachtbron voldoet aan het bepaalde in [artikel 4.17][ref1], met inbegrip van het bepaalde ten
      aanzien van de voeding van de radio-installaties en minimaal zes uur dienst kan doen.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel4
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.12
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 9.12.3
    text: |-
      De reserve krachtbron of -bronnen zijn onafhankelijk van de voortstuwingsinstallatie en de elektrische installatie
      van het vaartuig.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.12
  - number: 9.12.4
    text: |-
      Indien naast de VHF-radio-installatie twee of meer van de andere radio-installaties als bedoeld in het tweede
      lid kunnen worden aangesloten op de reserve krachtbron of -bronnen, zijn deze krachtbron of -bronnen in staat om
      gedurende de periode, genoemd in het tweede lid, onder a of b, de VHF-radio-installatie te voeden gelijktijdig met:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.12
  - number: 9.12.4.a
    text: alle andere radio-installaties die gelijktijdig op de reserve krachtbron of -bronnen kunnen worden aangesloten, of
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.12
  - number: 9.12.4.b
    text: |-
      wanneer slechts één van de andere radio-installaties gelijktijdig met de VHF-radio-installatie kan worden
      aangesloten op de reserve krachtbron of -bronnen, de andere radio-installatie met het grootste energieverbruik.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.12
  - number: 9.12.5
    text: |-
      De reserve krachtbron of -bronnen mogen gebruikt worden om de elektrische verlichting, bedoeld in
      [artikel 9.5, tweede lid, onder d][ref1], te voeden.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel9
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.12
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.12.6
    text: 'Indien een reserve krachtbron bestaat uit een oplaadbare accumulatorenbatterij of -batterijen:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.12
  - number: 9.12.6.a
    text: |-
      is een automatische laadinrichting aangebracht die de batterijen binnen 10 uur kan opladen tot de voorgeschreven
      minimum capaciteit, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.12
  - number: 9.12.6.b
    text: |-
      wordt de capaciteit van de batterij of batterijen door middel van een geschikte methode met tussenpozen van niet
      meer dan 12 maanden gecontroleerd. Deze controle vindt plaats wanneer het vaartuig niet buitengaats is.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.12
  - number: 9.12.7
    text: 'De plaats en de installatie van accumulatorenbatterijen die als reserve krachtbron dienen, is zodanig dat:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.12
  - number: 9.12.7.a
    text: optimaal onderhoud mogelijk is,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.12
  - number: 9.12.7.b
    text: een redelijke levensduur verzekerd is,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.12
  - number: 9.12.7.c
    text: onveilige situaties worden voorkomen,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.12
  - number: 9.12.7.d
    text: |-
      de temperatuur van de accumulatorenbatterijen, ook tijdens het opladen, binnen de door de fabrikant opgegeven
      waarden blijft, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.12
  - number: 9.12.7.e
    text: |-
      de volledig opgeladen accumulatorenbatterijen onder alle weersomstandigheden de minimum benodigde capaciteit
      hebben.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.12
  - number: 9.12.8
    text: |-
      Indien een ononderbroken invoer van informatie vanuit de navigatieapparatuur of andere uitrusting in de
      voorgeschreven radio-installatie noodzakelijk is voor de goede werking van deze installatie, zijn er voorzieningen
      om de voortdurende levering van zulke informatie zeker te stellen bij het uitvallen van de hoofd- of noodkrachtbron
      van het vaartuig.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.12
  - number: 9.13.1
    text: |-
      Apparatuur als bedoeld in dit hoofdstuk is van een goedgekeurd type. Afhankelijk van het bepaalde in het tweede
      lid dient deze apparatuur te voldoen aan eisen die niet lager zijn dan welke door de Internationale Maritieme
      Organisatie geaccepteerd zijn.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.13
  - number: 9.13.2
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan ontheffing verlenen voor apparatuur die is geïnstalleerd voor de datum
      van inwerkingtreding van dit besluit met betrekking tot de technische specificaties, mits de apparatuur compatibel
      is met de apparatuur die wel aan de technische specificaties voldoet, met inachtneming van de criteria die de IMO
      nog zal vaststellen betreffende die technische specificaties.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.13
  - number: 9.14.1
    text: |-
      De apparatuur is zodanig ontworpen dat de hoofdonderdelen op eenvoudige wijze, zonder uitgebreide herkalibratie of
      afregeling, kunnen worden vervangen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.14
  - number: 9.14.2
    text: |-
      De apparatuur is zodanig vervaardigd en geïnstalleerd dat deze gemakkelijk toegankelijk is voor inspecties en
      onderhoud aan boord.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.14
  - number: 9.14.3
    text: |-
      Aan boord is voldoende informatie aanwezig voor de bediening en het onderhoud van de installaties, rekening houdend
      met de aanbevelingen van de Internationale Maritieme Organisatie.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.14
  - number: 9.14.4
    text: Aan boord zijn gereedschappen en reserveonderdelen aanwezig voor het onderhoud.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.14
  - number: 9.14.5
    text: |-
      De in dit hoofdstuk voorgeschreven apparatuur wordt zodanig onderhouden dat de in [artikel 9.4][ref1] beschreven
      functies in stand blijven en dat de apparatuur blijft voldoen aan de aanbevolen technische specificaties.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel9
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.14
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.14.6
    text: |-
      Aan boord van vaartuigen die uitsluitend reizen ondernemen in de zeegebieden A1 en A2 kan de beschikbaarheid worden
      verzekerd door dubbele apparatuur, onderhoud door een walorganisatie, elektronische onderhoudssystemen op zee of
      door een combinatie van deze methoden indien dat door het Hoofd van de Scheepvaartinspectie wordt goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.14
  - number: 9.14.7
    text: |-
      Aan boord van vaartuigen die reizen ondernemen in de zeegebieden A3 en A4 wordt de beschikbaarheid van de
      apparatuur gegarandeerd door een combinatie van ten minste twee methoden, waaronder dubbele apparatuur, onderhoud
      door een walorganisatie of elektronische onderhoudssystemen op zee. Het Hoofd van de Scheepvaartinspectie kan
      echter, rekening houdend met het type vaartuig en de wijze waarop het vaartuig gebruikt wordt, toestaan dat slechts
      één methode wordt toegepast om de beschikbaarheid van de apparatuur te waarborgen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.14
  - number: 9.14.8
    text: |-
      Alhoewel al het redelijke gedaan moet worden om de apparatuur in goed functionerende staat en conform de technische
      specificaties als beschreven in [artikel 9.4][ref1] te houden, zal in het geval de apparatuur niet kan voorzien
      in de algemene radiocommunicatie als beschreven in [artikel 9.4, onder h][ref2], het vaartuig niet onzeewaardig
      verklaard worden of zal dit niet als reden kunnen gelden om het vaartuig op te houden in een haven waar
      voorzieningen voor herstel niet direct beschikbaar zijn, indien het vaartuig wel alle nood- en veiligheidsfuncties
      uit kan voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0013342#Artikel9
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.14
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0013342
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: '9.15'
    text: |-
      Op elk vaartuig is gediplomeerd personeel aanwezig voor de uitvoering van nood- en veiligheidsradiocommunicatie.
      Dit personeel beschikt over de diploma's, voorgeschreven in het Radioreglement, en één van hen is aangewezen als
      hoofdverantwoordelijke voor de radiocommunicatie in een noodgeval.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.15
  - number: '9.16'
    text: |-
      Aan boord wordt een door het Hoofd van de Scheepvaartinspectie goedgekeurd dagboek, overeenkomstig het bepaalde
      in het Radioreglement, bijgehouden. Daarin worden ten minste alle gevallen van radiocommunicatie vermeld die
      belangrijk zijn voor de veiligheid op zee.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.16
  - number: '10.1'
    text: Tenzij uitdrukkelijk anders bepaald is dit hoofdstuk van toepassing op nieuwe en bestaande vissersvaartuigen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.1
  - number: '10.2'
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan ontheffing verlenen van de eisen, gesteld bij of krachtens dit hoofdstuk,
      indien naar zijn oordeel de aard van de reis of de afstand tot de kust zulke eisen niet rechtvaardigt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.2
  - number: 10.3.1.a
    text: 'Een vaartuig met een lengte van 24 meter of meer is uitgerust met:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.3
  - number: 10.3.1.a.1°
    text: een vast opgesteld magnetisch standaardkompas, tenzij het bepaalde onder d van toepassing is;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.3
  - number: 10.3.1.a.2°
    text: |-
      een magnetisch stuurkompas, tenzij koersinformatie, afkomstig van het kompas als bedoeld onder 1° beschikbaar en
      duidelijk afleesbaar is voor de roerganger op de plaats waar gewoonlijk wordt gestuurd;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.3
  - number: 10.3.1.a.3°
    text: |-
      een door het Hoofd van de Scheepvaartinspectie goedgekeurde voorziening voor de communicatie tussen de
      standaardkompaspositie en de plaats waar gewoonlijk wordt genavigeerd, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.3
  - number: 10.3.1.a.4°
    text: |-
      een peilinrichting voor het nemen van peilingen over een boog van de horizon van 360 graden, voor zover praktisch
      uitvoerbaar.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.3
  - number: 10.3.1.b
    text: |-
      Elk magnetisch kompas als bedoeld onder a is behoorlijk gecompenseerd en er is te allen tijde een deviatietabel of
      -kromme aanwezig.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.3
  - number: 10.3.1.c
    text: |-
      Er is een reserve magnetisch kompas aan boord dat het standaard kompas kan vervangen, tenzij het kompas als bedoeld
      onder a, 2°, of een gyrokompas aan boord geïnstalleerd is.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.3
  - number: 10.3.1.d
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan ontheffing verlenen van het vereiste van een magnetisch standaardkompas
      indien dit vereiste naar zijn oordeel onredelijk of onnodig is, gelet op de aard van de reis, de afstand tot de
      kust of het type vaartuig, mits in alle gevallen een deugdelijk stuurkompas wordt gevoerd.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.3
  - number: 10.3.2
    text: |-
      Ten aanzien van vaartuigen met een lengte van minder dan 24 meter kan worden voorgeschreven dat zij zijn uitgerust
      met een stuurkompas en een peilinrichting.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.3
  - number: 10.3.3
    text: |-
      Vaartuigen met een lengte van 45 meter of meer, gebouwd op of na 1 september 1984, beschikken over een gyrokompas
      dat voldoet aan de volgende eisen:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.3
  - number: 10.3.3.a
    text: |-
      het gyro-moederkompas of een gyro-dochterkompas is duidelijk afleesbaar voor de roerganger op de plaats waar
      gewoonlijk wordt gestuurd, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.3
  - number: 10.3.3.b
    text: |-
      vaartuigen met een lengte van 75 meter of meer beschikken bovendien over een of meer gyro-dochterkompassen, zodanig
      geplaatst dat doelmatig peilingen kunnen worden genomen over een boog van de horizon van 360 graden, voorzover
      praktisch uitvoerbaar.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.3
  - number: 10.3.4
    text: |-
      Vaartuigen met een lengte van 75 meter of meer, gebouwd voor 1 september 1984, zijn uitgerust met een gyrokompas
      dat voldoet aan het bepaalde in het derde lid.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.3
  - number: 10.3.5
    text: |-
      Vaartuigen die zijn uitgerust met een noodstuurpositie zijn voorzien van een telefoon of ander doelmatig
      communicatiemiddel om koersinformatie door te kunnen geven naar die positie. Bovendien zijn vaartuigen met een
      lengte van 45 meter of meer en gebouwd op of na 1 februari 1992 uitgerust met voorzieningen die aflezing van het
      kompas vanaf de noodstuurpositie mogelijk maken.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.3
  - number: 10.3.6
    text: |-
      Vaartuigen met een lengte van 45 meter of meer, gebouwd op of na 1 september 1984, en vaartuigen met een lengte van
      75 meter of meer, gebouwd voor 1 september 1984, zijn voorzien van een radarinstallatie die kan werken in de 9 GHz
      frequentieband. Vaartuigen met een lengte van 35 meter of meer dienen na 1 februari 1995 te zijn uitgerust met een
      radarinstallatie die kan werken in de 9 GHz frequentieband. Het Hoofd van de Scheepvaartinspectie kan vaartuigen
      met een lengte van 35 meter of meer maar minder dan 45 meter ontheffing verlenen van het bepaalde in het vijftiende
      lid, mits hun installatie volledig compatibel is met de radartransponder voor opsporings- en reddingsoperaties.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.3
  - number: 10.3.7
    text: |-
      Indien vaartuigen met een lengte van minder dan 35 meter zijn uitgerust met een radarinstallatie, is deze
      radarinstallatie van een goedgekeurd type.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.3
  - number: 10.3.8
    text: |-
      Op de brug van een vaartuig dat ingevolge het bepaalde in dit artikel is voorzien van een radarinstallatie, zijn
      voorzieningen aanwezig voor het uitzetten van de afgelezen radarwaarnemingen. Aan boord van een vaartuig waarvan
      de lengte 75 meter of meer bedraagt en dat is gebouwd op of na 1 september 1984 zijn deze voorzieningen ten minste
      even doelmatig als een reflectieplotter.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.3
  - number: 10.3.9
    text: |-
      Vaartuigen met een lengte van 75 meter of meer, gebouwd voor 25 mei 1980, en vaartuigen met een lengte van 45 meter
      of meer, gebouwd na 25 mei 1980, zijn uitgerust met een echolood.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.3
  - number: 10.3.10
    text: |-
      Vaartuigen met een lengte van minder dan 45 meter zijn uitgerust met een door het Hoofd van de Scheepvaartinspectie
      goedgekeurd middel om de diepte van het water onder het vaartuig te kunnen bepalen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.3
  - number: 10.3.11
    text: |-
      Vaartuigen met een lengte van 45 meter of meer, gebouwd op of na 1 september 1984, dienen te zijn uitgerust met een
      instrument dat vaart en afstand aangeeft.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.3
  - number: 10.3.12
    text: |-
      Vaartuigen met een lengte van 75 meter of meer, gebouwd voor 1 september 1984, en vaartuigen met een lengte van
      45 meter of meer, gebouwd op of na 1 september 1984, zijn uitgerust met een roerstandaanwijzer, een tachometer voor
      elke schroef en bovendien, indien het vaartuig is uitgerust met verstelbare schroeven of schroeven met zijdelingse
      stuwkracht, een instrument dat de spoed en de wijze van gebruik van die schroeven aangeeft. Deze instrumenten zijn
      duidelijk afleesbaar vanaf de plaats waar de navigatie wordt gevoerd.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.3
  - number: 10.3.13
    text: |-
      Uitgezonderd in de situatie, bedoeld in [artikel 1.12][ref1], zal het vaartuig niet onzeewaardig worden verklaard
      indien storingen in de instrumenten optreden en zal het vaartuig niet worden opgehouden in een haven waar niet
      direct herstelvoorzieningen aanwezig zijn, aangenomen dat al het redelijke gedaan wordt om de instrumenten, bedoeld
      in het eerste tot en met twaalfde lid, in goede werking te houden.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel1
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '1'
        hoofdstuk: '1'
  - number: 10.3.14
    text: |-
      Een vaartuig met een lengte van 75 meter of meer is voorzien van een radiorichtingzoeker. Het Hoofd van de
      Scheepvaartinspectie kan een vaartuig van deze regel ontheffing verlenen indien hij van mening is dat het
      onredelijk of onnodig is voor het vaartuig om met dit instrument te zijn uitgerust of indien het vaartuig is
      uitgerust met andere deugdelijke radionavigatieapparatuur gedurende de hele reis.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.3
  - number: 10.3.15
    text: |-
      Alle apparatuur waarmee het vaartuig is uitgerust volgens deze voorschriften is van een goedgekeurd type.
      Apparatuur die op of na 1 september 1984 aan boord van vaartuigen geïnstalleerd is, voldoet aan eisen die niet
      lager zijn dan die, gesteld door de IMO. Het Hoofd van de Scheepvaartinspectie kan ontheffing verlenen voor
      apparatuur die is geïnstalleerd voor de datum van de vaststelling van de eisen voor goedkeuring, met inachtneming
      van door de IMO vast te stellen criteria in verband met de genoemde eisen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.3
  - number: '10.4'
    text: |-
      Aan boord zijn geschikte nautische instrumenten, voldoende recente zeekaarten, zeemansgidsen, lichtenlijsten,
      berichten aan zeevarenden, getijtafels en alle andere nautische publicaties die nodig zijn voor de voorgenomen
      reis, onder goedkeuring van het Hoofd van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.4
  - number: 10.5.1
    text: |-
      Het vaartuig is uitgerust met een dagseinlamp waarvan de voeding niet alleen afhankelijk is van de hoofdvoeding van
      het vaartuig. In ieder geval is voor de voeding een draagbare batterij aanwezig.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.5
  - number: 10.5.2
    text: Vaartuigen met een lengte van 45 meter of meer zijn uitgerust met een volledig stel seinvlaggen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.5
  - number: 10.5.3
    text: |-
      Vaartuigen die op grond van het bepaalde in hoofdstuk 9 zijn uitgerust met een radio-installatie hebben het
      «Internationaal Seinboek» aan boord. Bij ministeriële regeling kan dit voorschrift ook van toepassing worden
      verklaard op andere vaartuigen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.5
  - number: 10.6.1
    text: 'Nieuwe vaartuigen met een lengte van 45 meter of meer voldoen aan de volgende voorschriften:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.6
  - number: 10.6.1.a
    text: |-
      vanaf de plaats op de navigatiebrug waar gewoonlijk de uitkijk wordt gehouden is onder alle omstandigheden van
      diepgang en trim het vrije zicht naar voren op het zeeoppervlak over een boog van 10° ter weerszijden van het vlak
      van kiel en stevens niet belemmerd over meer dan de kleinste afstand van twee scheepslengtes dan wel 500 meter,
      welk van beide het geringste is, beide gemeten vanaf de boeg;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.6
  - number: 10.6.1.b
    text: |-
      vanaf de plaats op de navigatiebrug waar gewoonlijk de uitkijk wordt gehouden bestaan over een boog van recht
      vooruit tot 90° ter weerszijden geen blinde sectoren, veroorzaakt door visgerei of andere obstakels buiten de
      navigatiebrug die groter zijn dan 10°. De som van alle blinde sectoren in dit gebied bedraagt niet meer dan 20°,
      terwijl tussen twee individuele blinde sectoren vrij uitzicht mogelijk is over een boog van ten minste 5°. Over een
      boog van recht vooruit tot 10° ter weerszijden zijn echter geen blinde sectoren groter dan 5°;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.6
  - number: 10.6.1.c
    text: |-
      de onderrand van de ramen aan de voorzijde van de navigatiebrug is zo laag mogelijk geplaatst en vormt in geen
      geval een belemmering voor het in dit lid voorgeschreven minimum uitzicht naar voren;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.6
  - number: 10.6.1.d
    text: |-
      de bovenrand van de ramen aan de voorzijde van de navigatiebrug is zodanig geplaatst dat bij een in zware zee
      stampend vaartuig vanaf de plaats op de brug waar gewoonlijk de uitkijk wordt gehouden, uitzicht naar de voorlijk
      gelegen horizon mogelijk is voor een persoon met een ooghoogte van 1,80 meter boven het brugdek. Het Hoofd van
      de Scheepvaartinspectie kan een lagere ooghoogte toestaan indien een ooghoogte van 1,80 meter niet praktisch
      uitvoerbaar is, doch in geen geval lager dan 1,60 meter;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.6
  - number: 10.6.1.e
    text: |-
      het horizontaal uitzicht vanaf de plaats op de navigatiebrug waar gewoonlijk de uitkijk wordt gehouden beslaat een
      boog van ten minste 225°, te weten van recht vooruit tot niet minder dan 22,5° verder achterwaarts dan dwars aan
      beide zijden van het vaartuig;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.6
  - number: 10.6.1.f
    text: |-
      vanaf elke brugvleugel beslaat het horizontale uitzicht een boog van ten minste 225°, te weten vanaf ten minste
      45° van recht vooruit aan de tegenovergestelde zijde via het voorschip tot recht achteruit aan de zijde van de
      betreffende brugvleugel;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.6
  - number: 10.6.1.g
    text: |-
      vanaf de plaats waar het vaartuig wordt bestuurd beslaat het horizontale uitzicht een boog van recht vooruit tot
      ten minste 60° aan weerszijden van het vaartuig;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.6
  - number: 10.6.1.h
    text: de scheepszijde is zichtbaar vanaf de brugvleugel;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.6
  - number: 10.6.1.i
    text: 'de plaatsing van de ramen in het stuurhuis voldoet aan de volgende voorschriften:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.6
  - number: 10.6.1.i.1°
    text: |-
      stijlen tussen individuele ramen zijn zo smal mogelijk en zijn geplaatst ter hoogte van enige positie waar de
      navigatie wordt gevoerd,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.6
  - number: 10.6.1.i.2°
    text: |-
      teneinde reflecties tegen te gaan zijn de ramen aan de voorzijde zodanig geplaatst dat zij aan de bovenzijde naar
      buiten hellen onder een hoek met het verticale vlak van ten minste 10° en ten hoogste 25°,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.6
  - number: 10.6.1.i.3°
    text: polariserend of gekleurd glas wordt niet toegepast, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.6
  - number: 10.6.1.i.4°
    text: |-
      onder alle weersomstandigheden verschaffen ten minste twee ramen aan de voorzijde en, afhankelijk van de inrichting
      van de brug, een extra aantal ramen een vrij uitzicht.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.6
  - number: 10.6.2
    text: |-
      Bestaande schepen voldoen zo veel als praktisch mogelijk is aan het bepaalde in het eerste lid, onder a en b, met
      dien verstande dat geen wijzigingen in de constructie of aanvullende uitrusting vereist zijn.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.6
  - number: 10.6.3
    text: |-
      Op vaartuigen die door hun bijzondere constructie niet geheel kunnen voldoen aan het bepaalde in het eerste lid
      is de navigatiebrug zodanig uitgevoerd dat het uitzicht zo veel mogelijk in overeenstemming is met het bepaalde in
      dat lid.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.6
  - number: 10.7.1
    text: |-
      Voor de toepassing van dit artikel wordt onder routeringssysteem verstaan elk systeem, bestaande uit een of meer
      routes of routeringsmaatregelen, gericht op het verminderen van gevaar voor scheepsongevallen. Het systeem omvat
      verkeersscheidingsstelsels, vaarwegen voor tweerichtingsverkeer, aanbevolen koerslijnen, gebieden die dienen te
      worden gemeden, zones voor kustverkeer, rotondes, voorzorgsgebieden en diepwaterroutes.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.7
  - number: 10.7.2
    text: Van de routeringsmaatregelen die door de IMO worden vastgesteld, wordt een passend gebruik gemaakt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.7
  - number: 10.7.3
    text: |-
      Elk vaartuig dat vaart in de buurt van de Grote Banken van Newfoundland, vaart, voorzover dit uitvoerbaar is,
      buiten de gebieden waarvan bekend is of verondersteld wordt dat zij ten gevolge van ijs gevaarlijk zijn.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.7
  - number: 10.7.4
    text: |-
      Indien ijs is gemeld op of nabij de koerslijn van het vaartuig, wordt 's nachts een matige vaart gelopen of wordt
      de koers zodanig veranderd dat deze goed vrij van het gevaarlijke gebied loopt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel10.7
  - number: 11.1.1
    text: |-
      De schipper van een vaartuig is verplicht ervoor te zorgen dat bij het ondernemen van een reis alsmede gedurende de
      reis het vaartuig niet dieper is afgeladen dan tot de hoogst gelegen lastlijn.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.1
  - number: 11.1.2
    text: |-
      Wanneer een vaartuig naar zee vertrekt is het de schipper toegestaan dieper af te laden dan op grond van het eerste
      lid is geoorloofd, en wel zo veel als overeenkomt met het gewicht aan brandstof, voorraden en drinkwater dat wordt
      verbruikt tussen de plaats van vertrek en de plaats waar het vaartuig buitengaats komt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.1
  - number: 11.2.1
    text: |-
      De schipper van een vaartuig is verplicht ervoor te zorgen dat voor het ondernemen van een reis voldoende gegevens
      aan boord zijn om hem in staat te stellen het vaartuig zodanig te beladen en te ballasten dat onaanvaardbare
      spanningen in de scheepsconstructie worden voorkomen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.2
  - number: 11.2.2
    text: |-
      De schipper van een vaartuig is verplicht ervoor te zorgen dat voor het ondernemen van een reis de nodige door het
      Hoofd van de Scheepvaartinspectie goedgekeurde gegevens aan boord zijn betreffende de stabiliteit van het vaartuig
      in onbeschadigde toestand.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.2
  - number: 11.2.3
    text: |-
      De schipper van een vaartuig is verplicht ervoor te zorgen dat tijdens de reis de stabiliteit van het vaartuig
      in alle voorkomende bedrijfsomstandigheden ten minste voldoet aan de eisen, bedoeld in [artikel 3.7][ref1], en de
      eventuele aanvullende eisen, gesteld krachtens [artikel 1.6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013342#Artikel1
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.2
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '3'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0013342
        artikel: '1'
        hoofdstuk: '1'
  - number: 11.2.4
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan voor vaartuigen van een bepaald type of van een bepaalde grootte
      ontheffing verlenen van het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.2
  - number: '11.4'
    text: |-
      De schipper van een vaartuig is verplicht ervoor te zorgen dat voor het ondernemen van een reis en gedurende de
      reis:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.4
  - number: 11.4.a
    text: |-
      alle reddingsmiddelen en -voorzieningen steeds in goede staat verkeren en voor onmiddellijk gebruik gereed zijn, en
      voor het dagelijks toezicht hierop een of meer scheepsofficieren zijn aangewezen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.4
  - number: 11.4.b
    text: |-
      de uitrusting van de reddings- en hulpverleningsboten steeds in goede staat verkeert en voor onmiddellijk gebruik
      gereed is, en in die boten geen andere zaken worden opgeborgen dan die welke tot de uitrusting behoren;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.4
  - number: 11.4.c
    text: |-
      een gediplomeerd sloepsgast is belast met het bevel over elk groepsreddingsmiddel, en voor elke reddingsboot tevens
      een plaatsvervanger is aangewezen dan wel, wanneer zulks door het Hoofd van de Scheepvaartinspectie is toegestaan,
      een persoon met ervaring in de behandeling en bediening van reddingsvlotten is belast met het bevel over elk
      reddingsvlot;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.4
  - number: 11.4.d
    text: |-
      degene die met het bevel over een groepsreddingsmiddel is belast en de plaatsvervanger beschikken over een lijst
      met namen van de hun toegewezen bemanning van het groepsreddingsmiddel en toezien dat die bemanningsleden hun taken
      kennen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.4
  - number: 11.4.e
    text: |-
      voor elke reddingsboot, voorzien van een radiotelegrafie-installatie, iemand is aangewezen die deze installatie
      kan bedienen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.4
  - number: 11.4.f
    text: |-
      voor elke reddingsboot iemand is aangewezen die de motor kan bedienen en kleine herstellingen daaraan kan
      verrichten;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.4
  - number: 11.4.g
    text: |-
      de handboeken voor opleiding ter zake van de reddingsmiddelen en -voorzieningen, bedoeld in
      [artikel 8.3, vierde lid][ref1], aan boord zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel8
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.4
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '8'
        hoofdstuk: '8'
  - number: 11.4.h
    text: |-
      de instructies voor het onderhoud van de reddingsmiddelen en -voorzieningen, bedoeld in
      [artikel 7.16, tweede lid][ref1], aan boord zijn en het onderhoud dienovereenkomstig wordt uitgevoerd;


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.4
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 11.4.i
    text: |-
      de periodieke tests, inspecties en keuringen van de reddingsmiddelen en -voorzieningen worden uitgevoerd
      overeenkomstig [artikel 7.16, vijfde tot en met achtste lid][ref1], en [artikel 9.6, onder f][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0013342#Artikel9
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.4
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013342
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 11.4.j
    text: |-
      het noodradiobaken wordt beproefd met tussenpozen van niet meer dan 12 maanden, waarbij, indien noodzakelijk, de
      batterij wordt vervangen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.4
  - number: '11.5'
    text: |-
      De schipper van een vaartuig is verplicht ervoor te zorgen dat voor het ondernemen van een reis en gedurende de
      reis wordt voldaan aan het bepaalde in [artikel 8.2, tweede tot en met achtste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel8
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.5
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '8'
        hoofdstuk: '8'
  - number: '11.6'
    text: |-
      De schipper van een vaartuig is verplicht ervoor te zorgen dat wordt voldaan aan het bepaalde in de
      [artikelen 8.3][ref1] en [8.4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013342#Artikel8
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.6
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0013342
        artikel: '8'
        hoofdstuk: '8'
  - number: '11.7'
    text: 'De schipper van een vaartuig is verplicht ervoor te zorgen dat:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.7
  - number: 11.7.a
    text: |-
      alle brandontdekkingsmiddelen en -bestrijdingsmiddelen steeds in goede staat en voor onmiddellijk gebruik gereed
      zijn;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.7
  - number: 11.7.b
    text: |-
      de brandslangen alleen worden gebruikt voor brandblusdoeleinden, voor het testen van de brandblusinrichting of bij
      oefeningen en inspecties;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.7
  - number: 11.7.c
    text: de brandslangen telkenmale na verloop van ten hoogste zes maanden worden getest;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.7
  - number: 11.7.d
    text: |-
      de periodieke controle en tests van draagbare en niet draagbare brandblustoestellen, alsmede van vast aangebrachte
      brandblusinstallaties met inbegrip van de eventueel bij deze toestellen of installaties behorende gascilinders,
      geschiedt op door het Hoofd van de Scheepvaartinspectie voor te schrijven wijze;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.7
  - number: 11.7.e
    text: |-
      de voortstuwingsruimten, andere ruimten voor machines en de kombuizen behoorlijk worden schoongehouden en worden
      vrijgehouden van olieresten, lekolie, met olie doordrenkt poetskatoen en dergelijke verontreinigingen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.7
  - number: 11.7.f
    text: |-
      voor scheepsgebruik bestemde of tot de scheepsuitrusting behorende, stoffen of onderdelen met brandgevaarlijke
      eigenschappen zeevast worden opgeborgen op een veilige plaats, verwijderd van ruimten voor machines, kombuizen en
      plaatsen waar open vuur wordt gebezigd.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.7
  - number: '11.8'
    text: 'De schipper van een vaartuig is verplicht ervoor te zorgen dat:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.8
  - number: 11.8.a
    text: |-
      de waterdichte deuren gedurende de reis zijn gesloten, tenzij deze uit hoofde van de behoeften van de dienst
      noodzakelijk geopend moeten blijven, in welk geval maatregelen worden genomen zodat zij te allen tijde onmiddellijk
      kunnen worden gesloten,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.8
  - number: 11.8.b
    text: |-
      patrijspoorten die gedurende de reis niet bereikbaar zijn, voor het vaartuig de haven of rede verlaat behoorlijk
      met hun blinden zijn gesloten,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.8
  - number: 11.8.c
    text: |-
      de deksels en kleppen van stortkokers die niet in gebruik zijn en waarvan de binnenboordsopeningen geheel of
      gedeeltelijk beneden het werkdek zijn gelegen, behoorlijk zijn gesloten, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.8
  - number: 11.8.d
    text: |-
      de waterdichte deuren en alle daarbij behorende bewegingsinrichtingen en standaanwijzers, alle afsluiters die
      moeten zijn gesloten om een afdeling waterdicht te maken, benevens alle afsluiters in dwarsscheepse overvloei-
      inrichtingen gedurende de reis geregeld, ten minste eenmaal per week, worden getest.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.8
  - number: '11.9'
    text: |-
      De schipper van een vaartuig is verplicht ervoor te zorgen dat de schepelingen bekend zijn met het gebruik van
      de beschermende uitrusting, bedoeld in [artikel 6.3, zesde lid][ref1]. Hij ziet erop toe dat deze uitrusting in
      daartoe in aanmerking komende omstandigheden wordt gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel6
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.9
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '6'
        hoofdstuk: '6'
  - number: '11.10'
    text: 'De schipper van een vaartuig is verplicht ervoor te zorgen dat:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.10
  - number: 11.10.a
    text: |-
      in vochtige ruimten geen werkzaamheden aan niet geïsoleerde delen van de elektrische installatie worden uitgevoerd,
      zolang deze onder spanning staan;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.10
  - number: 11.10.b
    text: |-
      in ruimten met ontploffingsgevaar geen werkzaamheden geschieden, waarbij vonkvorming kan optreden en dat
      werkzaamheden aan elektrische installaties met toebehoren slechts plaatsvinden, nadat het desbetreffende gedeelte
      der installatie spanningsloos is gemaakt;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.10
  - number: 11.10.c
    text: |-
      in andere dan onder a en b genoemde ruimten slechts werkzaamheden aan niet geïsoleerde of daarmee gelijk te stellen
      delen van de elektrische installatie worden uitgevoerd, zonder dat deze spanningsloos zijn gemaakt, indien hiervoor
      dringende redenen aanwezig zijn voor de veiligheid en bedrijfszekerheid van het vaartuig, mits:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.10
  - number: 11.10.c.1°
    text: alle zich in de nabijheid bevindende metalen delen doelmatig tegen aanraking zijn afgeschermd,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.10
  - number: 11.10.c.2°
    text: de metalen delen van het bij de werkzaamheden benodigde gereedschap voorzover mogelijk doelmatig zijn geïsoleerd,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.10
  - number: 11.10.c.3°
    text: zij die de werkzaamheden uitvoeren, zich op een doelmatig isolerende laag bevinden, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.10
  - number: 11.10.c.4°
    text: |-
      voorzover dit in verband met de plaats en de omstandigheden nodig is, duidelijk leesbare waarschuwingen zijn
      aangebracht om te voorkomen dat aan een niet met de werkzaamheden belaste persoon een ongeval overkomt,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.10
  - number: 11.10.d
    text: |-
      werkzaamheden in de nabijheid van ongeïsoleerde of daarmee gelijk te stellen delen van de elektrische installatie
      slechts geschieden, indien deze spanningloos zijn gemaakt, tenzij dit om bedrijfstechnische redenen niet mogelijk
      is, in welk geval alle maatregelen moeten zijn genomen die een veilig verloop van de arbeid waarborgen,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.10
  - number: 11.10.e
    text: |-
      bij voeding van het scheepsnet of een gedeelte daarvan vanaf de wal, geen spanningen, stroomsoorten en bij
      draaistroom bovendien geen frequenties en volgorden van de fasen worden gebruikt waarvoor de elektrische
      installatie aan boord niet geschikt is,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.10
  - number: 11.10.f
    text: isolatiefouten in de elektrische installatie zo spoedig mogelijk worden verholpen,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.10
  - number: 11.10.g
    text: |-
      de noodkrachtbron en de tijdelijke noodkrachtbron, indien aanwezig, en de automatische inrichtingen van de
      noodinstallatie wekelijks worden getest, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.10
  - number: 11.10.h
    text: de noodverlichting maandelijks wordt getest.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.10
  - number: 11.11.1
    text: 'De schipper van een vaartuig is met betrekking tot de stuurinrichting verplicht ervoor te zorgen dat:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.11
  - number: 11.11.1.a
    text: binnen 12 uur voor vertrek de stuurinrichting door de bemanning wordt gecontroleerd en getest op de goede werking;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.11
  - number: 11.11.1.b
    text: |-
      bij de testprocedure, bedoeld onder a, voorzover van toepassing, de werking van de volgende onderdelen is
      inbegrepen:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.11
  - number: 11.11.1.b.1°
    text: de hoofdstuurinrichting;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.11
  - number: 11.11.1.b.2°
    text: de hulpstuurinrichting;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.11
  - number: 11.11.1.b.3°
    text: de afstandsbedieningsystemen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.11
  - number: 11.11.1.b.4°
    text: de besturingsmogelijkheden op de brug;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.11
  - number: 11.11.1.b.5°
    text: de noodkrachtvoorziening;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.11
  - number: 11.11.1.b.6°
    text: de roerstandaanwijzers, vergeleken met de werkelijke stand van het roer;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.11
  - number: 11.11.1.b.7°
    text: de alarmeringen voor het uitvallen van de bekrachtiging van de afstandsbedieningsystemen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.11
  - number: 11.11.1.b.8°
    text: de alarmeringen voor het uitvallen van de krachtwerktuigen van de stuurinrichting;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.11
  - number: 11.11.1.b.9°
    text: |-
      de automatische voorzieningen waarmee een defect gedeelte van de stuurinrichting buiten bedrijf wordt gesteld en
      andere automatische uitrusting;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.11
  - number: 11.11.1.c
    text: 'bij de onder a bedoelde controles en tests tevens zijn inbegrepen:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.11
  - number: 11.11.1.c.1°
    text: het bewegen van het roer over de volle uitslag zoals vereist voor de betreffende stuurinrichting,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.11
  - number: 11.11.1.c.2°
    text: een visuele inspectie van de stuurinrichting met de daaraan verbonden systemen, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.11
  - number: 11.11.1.c.3°
    text: de werking van de communicatiemiddelen tussen de brug en de stuurmachinekamer;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.11
  - number: 11.11.1.d
    text: |-
      eenvoudige gebruiksaanwijzingen met een blokdiagram, waarop de overschakelingsprocedures zijn aangegeven voor
      de afstandsbedieningsystemen en de krachtwerktuigen voor de stuurmachine, op de brug en in de stuurmachinekamer
      permanent zijn opgehangen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.11
  - number: 11.11.1.e
    text: |-
      alle schepelingen die betrokken zijn bij de behandeling of het onderhoud van de stuurinrichting, vertrouwd zijn met
      de werking van de stuursystemen en met de procedures om van het ene systeem over te schakelen op het andere;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.11
  - number: 11.11.1.f
    text: |-
      in aanvulling op de geregelde controles en tests, bedoeld onder a, ten minste eenmaal in de drie maanden oefeningen
      plaatsvinden voor de besturing van het vaartuig in gevallen waarbij een of meer onderdelen van het stuursysteem
      zijn uitgevallen, teneinde hiermede ervaring op te doen. Bij deze oefeningen dienen te zijn inbegrepen de directe
      bediening in de stuurmachinekamer, de communicatieprocedure met de brug en, indien toepasselijk, het gebruik van
      vervangende krachtvoorzieningen, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.11
  - number: 11.11.1.g
    text: de onderdelen voor de hulpstuurinrichting voor onmiddellijk gebruik gereed zijn opgeborgen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.11
  - number: 11.11.2
    text: |-
      De schipper van een vaartuig is verplicht zorg te dragen dat in gebieden waar de navigatie bijzondere aandacht
      vergt, meer dan een krachtwerktuig van de stuurinrichting in bedrijf is, indien dergelijke werktuigen geschikt zijn
      om de stuurinrichting gelijktijdig te voeden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.11
  - number: 11.11.3
    text: |-
      De schipper van een vaartuig dat is uitgerust met een automatische stuurinrichting, is verplicht zorg te dragen
      dat:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.11
  - number: 11.11.3.a
    text: |-
      in gebieden met een grote vaardichtheid, bij beperkt zicht en in alle andere voor de navigatie gevaarlijke
      situaties, waarin gebruik wordt gemaakt van de automatische stuurinrichting, de chef van de wacht onverwijld kan
      beschikken over de diensten van een bekwame roerganger die op ieder moment de besturing moet kunnen overnemen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.11
  - number: 11.11.3.b
    text: |-
      het overschakelen van automatische besturing op handbesturing en omgekeerd, geschiedt door of onder toezicht van de
      chef van de wacht;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.11
  - number: 11.11.3.c
    text: |-
      de handbesturing wordt getest nadat gedurende een langere tijd gebruik is gemaakt van de automatische
      stuurinrichting en voordat gebieden worden binnengevaren waar de navigatie bijzondere aandacht vergt.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.11
  - number: 11.12.1
    text: |-
      De schipper van een vaartuig is verplicht ervoor te zorgen dat de fouten van elk magnetisch kompas eenmaal per
      jaar worden geverifieerd door een bevoegd persoon, tenzij deze fouten door waarnemingen op zee geregeld worden
      geverifieerd en zij binnen redelijke grenzen blijven. Bovendien is de schipper verplicht hercompensatie door een
      bevoegd persoon als boven bedoeld te doen plaatsvinden, telkenmale wanneer zich omstandigheden hebben voorgedaan
      die van invloed kunnen zijn op de gevonden fouten.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.12
  - number: 11.12.2
    text: |-
      De schipper van een vaartuig is verplicht ervoor te zorgen dat bij elk magnetisch kompas een foutentabel aanwezig
      is.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.12
  - number: '11.13'
    text: |-
      De schipper van een vaartuig is verplicht ervoor te zorgen dat op de brug de nodige gegevens beschikbaar zijn
      betreffende de manoeuvreereigenschappen en de stopweg bij voor het vaartuig karakteristieke vaarsnelheden en
      diepgangen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.13
  - number: 11.14.1
    text: |-
      De schipper van een vaartuig dat is uitgerust met een richtingzoeker, is verplicht ervoor te zorgen dat eenmaal
      per jaar de fouten van de richtingzoeker worden geverifieerd door een bevoegd persoon, tenzij deze fouten door
      waarnemingen op zee geregeld worden geverifieerd en zij binnen redelijke grenzen blijven. Bovendien is de schipper
      verplicht verificatie te doen plaatsvinden, telkenmale wanneer in de positie van enige antenne, dan wel van enige
      constructie aan dek, veranderingen zijn aangebracht die de gevonden fouten van de richtingzoeker merkbaar zouden
      kunnen beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.14
  - number: 11.14.2
    text: |-
      De schipper van een vaartuig is verplicht ervoor te zorgen dat de grafiek die de correctie aangeeft welke op
      de afgelezen peiling moetworden toegepast om de ware peiling ten opzichte van de kiellijn te verkrijgen, voor
      onmiddellijk gebruik bij de richtingzoeker aanwezig is.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.14
  - number: '11.15'
    text: |-
      De schipper van een vaartuig is verplicht luisterdienst te doen houden in overeenstemming met het bepaalde in
      [artikel 9.11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel9
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.15
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: '11.16'
    text: |-
      De schipper van een vaartuig is verplicht ervoor te zorgen dat door degenen die als chef van de wacht kunnen
      optreden, regelmatig wordt geoefend in het gebruik van de elektronische navigatiemiddelen waarmede het vaartuig
      is uitgerust.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.16
  - number: '11.17'
    text: |-
      De schipper van een vaartuig is verplicht zorg te dragen dat ten aanzien van de routering van het vaartuig het
      bepaalde in [artikel 10.7][ref1] in acht wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel10
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.17
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '10'
        hoofdstuk: '10'
  - number: '11.18'
    text: |-
      De schipper draagt er zorg voor dat de aan boord aanwezige dagboeken worden bijgehouden met inachtneming van
      hetgeen dienaangaande in dit besluit is bepaald.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.18
  - number: '11.19'
    text: 'De schipper van een vaartuig is verplicht ervoor te zorgen dat:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.19
  - number: 11.19.a
    text: |-
      de loodsladder schoon en in goede staat wordt gehouden en alleen wordt gebruikt voor het aan boord nemen of
      ontschepen van loodsen, alsmede van havenautoriteiten bij aankomst in of vertrek uit een haven;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.19
  - number: 11.19.b
    text: |-
      de loodsladder op een zodanige plaats buiten boord wordt opgehangen dat de ladder vrij hangt van spuipijpen van
      het vaartuig, dat elke trede stevig tegen de scheepshuid rust, dat deze zo ver mogelijk is verwijderd van de
      terugwijkende gedeelten van de scheepshuid en dat de loods op een veilige en gemakkelijke wijze het vaartuig
      kan betreden nadat hij niet minder dan 1,50 m en niet meer dan 9 m heeft geklommen. Indien de afstand van het
      wateroppervlak tot aan de inschepingsplaats meer dan 9 m bedraagt, dient toegang tot het vaartuig te worden
      verkregen door middel van een valreep of op een andere even veilige en gemakkelijke wijze;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.19
  - number: 11.19.c
    text: |-
      twee handleiders, stevig aan het vaartuig bevestigd, met een omtrek van niet minder dan 65 mm en een lijflijn voor
      gebruik gereed worden gehouden;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.19
  - number: 11.19.d
    text: |-
      voorzieningen aanwezig zijn teneinde de loods in staat te stellen op veilige en gemakkelijke wijze over te stappen
      vanaf het boveneinde van de loodsladder op of in het vaartuig of op de valreep of ander middel en omgekeerd. Indien
      het overstappen plaatsvindt door een opening in het hekwerk of de verschansing, dienen doelmatige handgrepen te
      zijn aangebracht. Indien het overstappen geschiedt door middel van een verschansingtrap, dient deze stevig te zijn
      bevestigd aan de verschansing of aan het platform en dienen twee rechtopstaande houvasten te zijn aangebracht bij
      de plaats van het aan boord komen of van boord gaan. De onderlinge afstand tussen deze houvasten mag niet minder
      dan 0,70 m en niet meer dan 0,80 m bedragen. Elke houvast dient aan of nabij de onderzijde, alsmede op een hoger
      gelegen punt, stevig aan het vaartuig te zijn bevestigd; de diameter dient niet minder te zijn dan 40 mm en de
      lengte dient zodanig te zijn dat de houvast ten minste 1,20 m boven de verschansing uitsteekt;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.19
  - number: 11.19.e
    text: |-
      des nachts een zodanige verlichting aanwezig is dat zowel de loodsladder buitenboord als de plaats waar de loods
      aan boord komt, voldoende verlicht zijn. Een reddingsboei, voorzien van een zelfontbrandend licht, moet ter plaatse
      voor direct gebruik bij de hand worden gehouden. Een hieuwlijn moet voor direct gebruik beschikbaar zijn;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.19
  - number: 11.19.f
    text: voorzieningen zijn getroffen om de loodsladder aan beide zijden van het vaartuig te kunnen gebruiken;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.19
  - number: 11.19.g
    text: |-
      het optuigen van de ladder en het aan boord nemen of ontschepen van een loods geschiedt onder toezicht van een
      verantwoordelijk scheepsofficier;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.19
  - number: 11.19.h
    text: |-
      indien van een mechanische loodsladder gebruik wordt gemaakt, een loodsladder aan dek in de onmiddellijke nabijheid
      voor direct gebruik beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.19
  - number: 11.21.1
    text: |-
      De eigenaar van een vaartuig is verplicht ervoor te zorgen dat de romp van het vaartuig overeenkomstig het bepaalde
      in [artikel 1.12, tweede lid, onder a][ref1], aan de buitenzijde wordt onderzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel1
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.21
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '1'
        hoofdstuk: '1'
  - number: 11.21.2
    text: |-
      De eigenaar van een vaartuig is verplicht het Hoofd van de Scheepvaartinspectie tijdig in kennis te stellen van
      het voornemen tot een onderzoek van de romp aan de buitenzijde en van herstellingen aan het vaartuig of aan de
      werktuigen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.21
  - number: '11.22'
    text: |-
      De eigenaar van een vaartuig is verplicht aan de schipper de middelen te verschaffen die deze behoeft teneinde te
      kunnen voldoen aan het bepaalde in dit besluit.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.22
  - number: 11.23.1
    text: |-
      De eigenaar van een vaartuig is verplicht ervoor te zorgen dat de veiligheid en gezondheid van de bemanning niet in
      gevaar wordt gebracht, in het bijzonder door voorzienbare weersomstandigheden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.23
  - number: 11.23.2
    text: |-
      De eigenaar van een vaartuig is verplicht te zorgen voor het technische onderhoud, zodat de constructie, inrichting
      en uitrusting van het vaartuig aan de voorschriften van dit besluit voldoen en blijven voldoen. De eigenaar ziet
      er op toe dat geconstateerde gebreken die de veiligheid en gezondheid van de bemanning in gevaar kunnen brengen, zo
      snel mogelijk worden verholpen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.23
  - number: 11.23.3
    text: |-
      De in het eerste en tweede lid genoemde verplichtingen van de eigenaar laten de verplichtingen van de schipper
      onverlet.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.23
  - number: 11.24.1
    text: |-
      De eigenaar van een vissersvaartuig stelt het Hoofd van de Scheepvaartinspectie ervan op de hoogte indien het
      vaartuig wordt uitgerust met niet in dit besluit voorgeschreven reddingsmiddelen, veiligheidsmiddelen, hulpmiddelen
      voor plaatsbepaling en ter voorkoming van aanvaring en radio-inrichtingen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.24
  - number: 11.24.2
    text: |-
      Voorzover het middelen of inrichtingen betreft die in dit besluit met name worden genoemd, voldoen zij aan alle
      daarvoor in dit besluit omschreven eisen en verkeren zij in deugdelijke toestand. Voorzover zij niet met name
      worden genoemd in dit besluit, dienen zij naar het oordeel van het Hoofd van de Scheepvaartinspectie voor het doel
      geschikt te zijn en in deugdelijke staat te verkeren.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel11.24
  - number: '12.1'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de veiligheid van vissersvaartuigen met een lengte van
      minder dan 24 meter.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel12.1
  - number: '13.1'
    text: |-
      Overtreding van de [artikelen 11.4][ref1], [11.6][ref2], [11.7][ref3], [11.8][ref4], [11.21][ref5], [11.22][ref6],
      [11.23][ref7] en [11.24][ref8] is een strafbaar feit.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0013342#Artikel11
