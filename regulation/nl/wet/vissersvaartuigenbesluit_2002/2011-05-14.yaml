        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.11.1.d
    text: |-
      voor satelliet wal-vaartuig noodberichten, indien het vaartuig, overeenkomstig artikel 9, eerste lid, onder a, is
      uitgerust met een INMARSAT-scheepssatellietstation.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.11
  - number: 9.11.2
    text: |-
      Buitengaats wordt een radiowacht gehouden op de frequenties waarop die informatie wordt uitgezonden in het
      zeegebied waar het schip zich bevindt, om de voor het vaartuig van belang zijnde uitzendingen van maritieme
      veiligheidsinformatie te kunnen ontvangen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.11
  - number: 9.12.1
    text: |-
      Buitengaats is altijd een elektrische krachtbron beschikbaar van voldoende vermogen om de radio-installaties te
      doen werken en de aanwezige batterijen gebruikt voor de reserve krachtbron of -bronnen ten behoeve van de radio-
      installaties op te laden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.12
  - number: 9.12.2
    text: |-
      Aan boord van een vaartuig zijn een of meer reserve krachtbronnen aanwezig om de radio-installaties te voeden,
      teneinde de nood- en veiligheidsberichten te kunnen afhandelen in het geval dat de hoofd- en noodkrachtbronnen
      uitvallen. De reserve krachtbron of krachtbronnen zijn in staat tot het gelijktijdig voeden van de VHF-installatie,
      bedoeld in [artikel 9.6, onder a][ref1], en, al naar gelang het zeegebied of de zeegebieden waarvoor het vaartuig
      is uitgerust, ofwel de MF-radio-installatie, bedoeld in [artikel 9.8, eerste lid, onder a][ref2], de MF/HF-
      radio-installatie bedoeld in [artikel 9.9, tweede lid, onder a][ref3], of [artikel 9.10, eerste lid][ref4],
      ofwel het INMARSAT-scheepssatellietstation, bedoeld in artikel 9, eerste lid, onder a, en elk van de aanvullende
      voorzieningen, bedoeld in de [artikelen 9.4][ref5], [9.5][ref6] en [9.8][ref7], gedurende ten minste de volgende
      periode:


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0013342#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0013342#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0013342#Artikel9
