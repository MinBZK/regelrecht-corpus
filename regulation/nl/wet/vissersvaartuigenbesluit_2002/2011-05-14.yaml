  - number: 1.12.2.c
    text: |-
      een jaarlijkse inspectie van de medische uitrusting aan boord, met de daarbij behorende controlelijsten en
      handleidingen, bedoeld in de [artikelen 6.5][ref1], [6.11][ref2] en [6.12][ref3], van de medicijnkisten aan
      boord van reddingsboten en hulpverleningsboten, bedoeld in [artikel 7.17, achtste lid, onder 20°][ref4],
      onderscheidenlijk [artikel 7.23, tweede lid, onder 9°][ref5], de radio-installaties, met inbegrip van de
      radio-installaties die in de groepsreddingsmiddelen worden gebruikt, en de radiorichtingzoeker, bedoeld in de
      [hoofdstukken 7][ref6], [9][ref7] en [10][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0013342#Artikel6
