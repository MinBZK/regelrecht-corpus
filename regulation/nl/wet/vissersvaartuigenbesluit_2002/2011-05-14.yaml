      de [artikelen 6.5, eerste lid][ref1], [6.11][ref2] en [6.14][ref3] en de [artikelen 7.17, achtste lid, 20°][ref4],
      [7.20, vijfde lid, onderdeel a, 8°][ref5] en [7.23, tweede lid, onderdeel b, 9°][ref6], van dit besluit.


