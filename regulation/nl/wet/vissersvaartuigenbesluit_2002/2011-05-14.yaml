  - number: 13.2.1
    text: |-
      Na de inwerkingtreding van dit besluit berust de Regeling signalering reddingmiddelen en vluchtwegen aan boord van
      vissersvaartuigen op [artikel 5.13, vijfde lid][ref1], van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel5
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel13.2
    references:
