  - number: 13.2.4
    text: |-
      Na de inwerkingtreding van dit besluit berust de Regeling geluidsniveaus aan boord van vissersvaartuigen op
      [artikel 6.15, vijfde lid][ref1], van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel6
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel13.2
    references:
