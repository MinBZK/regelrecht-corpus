        hoofdstuk: '1'
  - number: 1.12.2
    text: 'Een vissersvaartuig wordt onderworpen aan een periodiek onderzoek, dat bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.12
  - number: 1.12.2.a
    text: |-
      elke vier jaar een inspectie van de constructie, met inbegrip van de buitenzijde van de romp, en de machine-
      installaties zoals bedoeld in de [hoofdstukken 2][ref1], [3][ref2], [4][ref3], [5][ref4] en [6][ref5], met
      dien verstande dat overeenkomstig [artikel 1.10, eerste lid][ref6], de periode van vier jaar met een jaar kan
      worden verlengd, onder de voorwaarde dat het vissersvaartuig inwendig en uitwendig wordt onderzocht, voorzover dit
      redelijk en praktisch uitvoerbaar is;


