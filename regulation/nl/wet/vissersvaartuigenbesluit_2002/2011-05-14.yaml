    text: |-
      bovendien: de mogelijkheid om algemene radioberichtgeving te verzenden en te ontvangen met gebruik van
      radiotelefonie of DPT door middel van een MF/HF-radio-installatie werkend op de werkfrequenties in de banden tussen
      1605 en 4000 kHz en tussen 4000 en 27 500 kHz. Deze voorziening kan worden gecombineerd met de radio-installatie,
      bedoeld onder a.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.9
  - number: 9.9.3
    text: |-
      De uitzending van noodalarmering door middel van de radio-installaties, bedoeld in het eerste lid, onder a, b en
      d, en in het tweede lid, onder a en c, kan worden gestart vanaf de plaats aan boord waar gewoonlijk de navigatie
      wordt gevoerd.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.9
  - number: 9.9.4
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan ontheffing verlenen van de eisen, bedoeld in
      [artikel 9.6, onder a, 1°, en onder b][ref1], voor vaartuigen die zijn gebouwd voor 1 februari 1997 en die
      uitsluitend bestemd zijn om reizen te ondernemen in de zeegebieden A2 en A3, mits deze vaartuigen een permanente
      luisterwacht houden op VHF-kanaal 16 op de plaats aan boord waar gewoonlijk de navigatie wordt gevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel9
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.9
    references:
