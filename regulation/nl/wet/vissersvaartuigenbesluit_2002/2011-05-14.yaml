  - number: 9.9.2
    text: |-
      In aanvulling op [artikel 9.6][ref1] is elk vaartuig dat bestemd is om reizen te ondernemen buiten de zeegebieden
      A1 en A2, maar binnen het zeegebied A3 en dat niet voldoet aan het bepaalde in het eerste lid, voorzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel9
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.9
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.9.2.a
    text: |-
      een MF/HF-radio-installatie die voor nood- en veiligheidsdoeleinden kan zenden en ontvangen op alle nood- en
      veiligheidsfrequenties in de banden tussen 1605 en 4000 kHz en tussen 4000 en 27 500 kHz door middel van:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.9
