---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: vissersvaartuigenbesluit_2002
regulatory_layer: WET
publication_date: '2011-05-13'
valid_from: '2011-05-14'
bwb_id: BWBR0013342
url: https://wetten.overheid.nl/BWBR0013342/2011-05-14
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 20 september 2001, nr. DGG/J-01/003872,
    Directoraat-Generaal Goederenvervoer, Stafafdeling Wetgeving, bestuurlijke en juridische zaken;

    Gelet op richtlijn nr. 92/29/EEG van de Raad van de Europese Gemeenschappen van 31 maart 1992 betreffende de
    minimumvoorschriften inzake veiligheid en gezondheid ter bevordering van een betere medische hulpverlening
    aan boord van schepen (PbEG L 113), richtlijn nr. 93/103/EG van de Raad van de Europese Gemeenschappen van
    23 november 1993 betreffende de minimumvoorschriften inzake veiligheid en gezondheid bij het werk aan boord van
    vissersvaartuigen (PbEG L 307), richtlijn nr. 97/70/EG van de Raad van de Europese Unie van 11 december 1997
    betreffende de invoering van een geharmoniseerde veiligheidsregeling voor vissersvaartuigen waarvan de lengte 24 m
    of meer bedraagt (PbEG 1998, L 34) en richtlijn nr. 1999/19/EG van de Commissie van de Europese Gemeenschappen
    van 18 maart 1999 (PbEG L 83) tot wijziging van Richtlijn 97/70/EG van de Raad betreffende de invoering van een
    geharmoniseerde veiligheidsregeling voor vissersvaartuigen waarvan de lengte 24 m of meer bedraagt, alsmede op de
    artikelen 3, 3a, 5 en 9 van de Schepenwet;

    De Raad van State van het Koninkrijk gehoord (advies van 7 december 2001, nr. W09.01.0493/V/K);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 4 januari 2002, nr. DGG/J-01/008960,
    Directoraat-Generaal Goederenvervoer, Stafafdeling Wetgeving, bestuurlijke en juridische Zaken;

    De bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt, tenzij anders is bepaald, verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.1
  - number: 1.1.a
    text: |-
      *wet*: de [Schepenwet][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0001876
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0001876
  - number: 1.1.b
    text: '*Onze Minister:* Onze Minister van Infrastructuur en Milieu;'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.1
  - number: 1.1.c
    text: |-
      *Nederlands vissersvaartuig:* een vissersvaartuig dat ingevolge
      [artikel 1, tweede lid, van de Uitvoeringswet Visserijverdrag 1967][ref1] als Nederlands geldt;


      [ref1]: https://wetten.overheid.nl/BWBR0002897#Artikel1
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0002897
        artikel: '1'
  - number: 1.1.d
    text: |-
      *vissersvaartuig*: een vissersvaartuig als bedoeld in [artikel 1, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel1
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0001876
        artikel: '1'
  - number: 1.1.e
    text: '*nieuw vissersvaartuig*: een vissersvaartuig waarvoor'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.1
  - number: 1.1.e.1°
    text: op of na 1 januari 1999 het bouwcontract of het contract voor een ingrijpende verbouwing wordt gegund, of
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.1
  - number: 1.1.e.2°
    text: |-
      het bouwcontract of het contract voor een ingrijpende verbouwing is gegund voor 1 januari 1999 en dat drie jaar of
      meer na deze datum wordt opgeleverd, of
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.1
  - number: 1.1.e.3°
    text: |-
      bij gebreke van een bouwcontract, op of na 1 januari 1999: - de kiel wordt gelegd, of
        - een aanvang wordt gemaakt met de bouw van een als zodanig herkenbaar specifiek type vissersvaartuig, of
        - een aanvang wordt gemaakt met de samenbouw die ten minste 50 ton of 1% van de geschatte massa van alle
      constructiemateriaal omvat, waarbij de kleinste van de twee hoeveelheden bepalend is;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.1
  - number: 1.1.f
    text: '*bestaand vissersvaartuig*: een vissersvaartuig dat geen nieuw vissersvaartuig is;'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.1
  - number: 1.1.g
    text: |-
      *lengte of L*: tenzij anders bepaald, 96% van de totale lengte op een waterlijn op 85% van de kleinste holte
      gemeten vanaf de kiellijn, of de lengte van de voorzijde van de voorsteven tot de hartlijn van de roerkoning op die
      waterlijn, indien deze lengte groter is. Bij vissersvaartuigen die met stuurlast ontworpen zijn, moet de waterlijn
      waarop deze lengte gemeten wordt, evenwijdig aan de ontwerplastlijn worden genomen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.1
  - number: 1.1.h
    text: |-
      *breedte of B:*de grootste breedte van het vaartuig, uitgedrukt in meters, midscheeps gemeten op de buitenkant van
      de spanten bij een vaartuig met een metalen huid en op de buitenkant van de huid bij een vaartuig met een huid van
      een ander materiaal;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.1
  - number: 1.1.i
    text: '*holte:*'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.1
  - number: 1.1.i.1°
    text: |-
      de verticale afstand, uitgedrukt in meters, gemeten vanaf de kiellijn tot de bovenkant van de balken van het
      werkdek in de zijde,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.1
  - number: 1.1.i.2°
    text: |-
      bij vaartuigen waar de overgang van de huidbeplating naar de dekbeplating als een rondgezette plaat is uitgevoerd,
      wordt de holte gemeten tot het snijpunt van de doorgestrookte onderzijde van de dekbeplating en de binnenzijde van
      de huidbeplating,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.1
  - number: 1.1.i.3°
    text: |-
      indien het werkdek verspringt en het verhoogde gedeelte zich uitstrekt voorbij het punt waar de holte moet worden
      bepaald, wordt de holte gemeten tot een lijn die vanaf het lage gedeelte van het dek, evenwijdig aan het verhoogde
      gedeelte wordt doorgetrokken;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.1
  - number: 1.1.j
    text: '*holte D:* de holte midscheeps gemeten;'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.1
  - number: 1.1.k
    text: '*hoogst gelegen lastlijn:* de lastlijn behorende bij de maximum toelaatbare diepgang tijdens de reis;'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.1
  - number: 1.1.l
    text: |-
      *werkdek:* in het algemeen het doorlopende blootgestelde dek van waar de visserij wordt uitgeoefend, maar bij
      vaartuigen met twee of meer doorlopende dekken kan het Hoofd van de Scheepvaartinspectie toestaan dat een lager dek
      als werkdek wordt aangemerkt mits dit dek is gelegen boven de hoogst gelegen lastlijn;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.1
  - number: 1.1.m
    text: |-
      *bovenbouw:* de overdekte constructie op het werkdek, die zich van boord tot boord uitstrekt of waarvan de afstand
      van de zijbeplating tot elk boord niet groter is dan 4% van de breedte;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.1
  - number: 1.1.n
    text: '*gesloten bovenbouw:* een bovenbouw waarvan:'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.1
  - number: 1.1.n.1°
    text: de eindschotten voldoende sterk zijn,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.1
  - number: 1.1.n.2°
    text: |-
      de eventuele toegangsopeningen in de eindschotten zijn voorzien van vast aangebrachte deuren die dicht zijn tegen
      weer en wind en van gelijke sterkte als het schot, alsof daarin geen opening aanwezig was, en die aan beide zijden
      kunnen worden geopend en gesloten,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.1
  - number: 1.1.n.3°
    text: |-
      alle openingen in de zijden, alsmede alle overige openingen in de eindschotten die zijn voorzien van doeltreffende
      middelen om deze openingen dicht tegen weer en wind te kunnen afsluiten, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.1
  - number: 1.1.n.4°
    text: |-
      afzonderlijke toegangen voor de bemanning naar de binnen een brughuis of een kampanje gelegen voortstuwingsruimten
      en andere werkruimten te allen tijde kunnen worden gebruikt wanneer de openingen in de schotten zijn gesloten;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.1
  - number: 1.1.o
    text: |-
      *opbouwdek:*het doorlopende dek of dekgedeelte dat de bovenkant van een bovenbouw, dekhuis of andere opbouw
      vormt en dat ten minste 1,80 m boven het werkdek ligt. In gevallen waarin de hoogte minder is dan 1,80 m wordt de
      bovenkant van zulk een bovenbouw, dekhuis of andere opbouw gelijkgesteld met het werkdek;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.1
  - number: 1.1.p
    text: |-
      *hoogte van een bovenbouw, dekhuis of andere opbouw:* de kleinste verticale hoogte, gemeten in de zijde vanaf de
      bovenkant van de balken van het opbouwdek tot de bovenkant van de balken van het werkdek;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.1
  - number: 1.1.q
    text: |-
      *dicht tegen weer en wind:*zodanig dicht dat onder alle omstandigheden die zich op zee kunnen voordoen, geen water
      in het vaartuig kan binnendringen;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.1
  - number: 1.1.r
    text: |-
      *waterdicht:* het vermogen van de constructie om het doorlaten van water in enige richting te voorkomen bij een
      waterdruk waartegen de omgevende constructie volgens het ontwerp bestand is;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.1
  - number: 1.1.s
    text: |-
      *aanvaringsschot:* een waterdicht schot dat in het voorste deel van het vissersvaartuig tot het werkdek is
      opgetrokken en dat voldoet aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.1
  - number: 1.1.s.1°
    text: |-
      het schot is zodanig geplaatst dat de afstand tot de voorloodlijn: - niet kleiner is dan 0,05 L en niet groter is
      dan 0,08 L, bij vaartuigen waarvan de lengte 45 m of meer bedraagt;
        - niet kleiner is dan 0,05 L en niet groter is dan 0,05 L, vermeerderd met 1,35 m, bij vaartuigen waarvan de lengte
      minder dan 45 m bedraagt;
        - in geen geval kleiner is dan 2 m;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.1
  - number: 1.1.s.2°
    text: |-
      ingeval enig deel van het onderwatergedeelte zich uitstrekt tot voor de voorloodlijn, met inbegrip van een
      bulbsteven, wordt de afstand, bedoeld onder 1°, gemeten vanaf een punt halverwege het deel dat zich voor de
      voorloodlijn uitstrekt of vanaf een punt dat 0,015 L voor de voorloodlijn ligt, al naar gelang welke afstand
      kleiner is;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.1
  - number: 1.1.s.3°
    text: |-
      indien het aanvaringsschot is voorzien van trapsgewijze sprongen of nissen, vallen deze binnen de beperkingen,
      bedoeld onder 1°;
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.1
  - number: 1.1.t
    text: |-
      *klassebureau:* een natuurlijke persoon of rechtspersoon, aangewezen krachtens
      [artikel 6, tweede lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel6
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0001876
        artikel: '6'
  - number: 1.1.u
    text: '*IMO:* de Internationale Maritieme Organisatie van de Verenigde Naties;'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.1
  - number: 1.1.v
    text: '*schipper:* de kapitein of gezagvoerder van een vaartuig of degene die deze vervangt.'
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.1
  - number: 1.2.1
    text: |-
      Dit besluit is, met uitzondering van de [artikelen 1.15][ref1] en [12.1][ref2], van toepassing op nieuwe en, voor
      zover uitdrukkelijk bepaald, bestaande vissersvaartuigen die zijn uitgerust of met commercieel oogmerk gebruikt
      worden voor het vangen van vis of andere levende rijkdommen van de zee, en waarvan de lengte 24 meter of meer
      bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0013342#Artikel12
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0013342
        artikel: '12'
        hoofdstuk: '12'
  - number: 1.2.2
    text: |-
      De normen voor het ontwerp, de bouw en het onderhoud van de romp, de hoofdmachines en hulpwerktuigen, alsmede
      de elektrische en automatische systemen van een vissersvaartuig zijn de voorschriften die op dat vaartuig van
      toepassing waren ten tijde van de bouw.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.2
  - number: 1.2.3
    text: Dit besluit is niet van toepassing op pleziervaartuigen die niet-commerciële visserij beoefenen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.2
  - number: '1.3'
    text: |-
      Bij ministeriële regeling kan het aanbrengen van andere onderdelen, materialen, voorzieningen of apparatuur dan
      die, welke in dit besluit wordt voorgeschreven, aan boord van een vissersvaartuig worden toegestaan mits deze
      onderdelen, materialen, voorzieningen of apparatuur ten minste even doelmatig zijn als die welke in dit besluit
      worden voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.3
  - number: '1.4'
    text: |-
      Waar in dit besluit wordt voorgeschreven dat een constructie, een uitrustingsstuk, een gebruikt materiaal of een
      andere toepassing goedgekeurd dan wel van een goedgekeurd type dient te zijn, wordt daar onder verstaan dat die
      constructie, dat uitrustingsstuk, het gebruikte materiaal of die andere toepassing is goedgekeurd door het Hoofd
      van de Scheepvaartinspectie dan wel is goedgekeurd volgens bij ministeriële regeling te stellen regels.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.4
  - number: '1.5'
    text: |-
      Met een goedkeuring door het Hoofd van de Scheepvaartinspectie wordt gelijkgesteld een verklaring van goedkeuring,
      afgegeven door de bevoegde autoriteit van een lidstaat van de Europese Unie dan wel van een staat die partij is bij
      de Overeenkomst inzake de Europese Economische Ruimte, mits die verklaring is afgegeven op basis van onderzoekingen
      die aan ten minste gelijkwaardige voorschriften voldoen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.5
  - number: 1.6.1
    text: |-
      Bij ministeriële regeling kunnen bijzondere veiligheidsvoorschriften worden vastgesteld voor vissersvaartuigen die
      dienst doen in bij die ministeriële regeling vastgestelde vaargebieden.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.6
  - number: 1.6.2
    text: |-
      Bij de vaststelling van de vaargebieden, bedoeld in het eerste lid, wordt rekening gehouden met lokale
      omstandigheden, zoals de aard en de klimatologische omstandigheden van de wateren waarin die vaartuigen dienst
      doen, met de lengte van hun reizen of met hun bijzondere kenmerken, zoals het gebruikte constructiemateriaal.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.6
  - number: 1.7.1
    text: |-
      Onze Minister wijst instanties aan waarvan de regels kunnen gelden als eisen als bedoeld in
      [artikel 3a, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel3a
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.7
    references:
      - id: ref1
        bwb_id: BWBR0001876
        artikel: 3a
  - number: 1.7.2
    text: |-
      Voordat een eerste onderzoek als bedoeld in [artikel 1.12, eerste lid][ref1], plaatsvindt, kiest de eigenaar of
      de bouwer van een vissersvaartuig voor de regels van een ingevolge het eerste lid aangewezen instantie of voor de
      regels die door de Scheepvaartinspectie worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel1
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.7
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '1'
        hoofdstuk: '1'
  - number: 1.7.3
    text: |-
      Bij onderzoeken als bedoeld in [artikel 1.12][ref1] voldoet een vissersvaartuig met betrekking tot het ontwerp,
      de bouw en het onderhoud van de romp, de hoofdmachines en hulpwerktuigen alsmede de elektrische en automatische
      systemen, aan de regels van een ingevolge het eerste lid aangewezen instantie, of aan de regels die door de
      Scheepvaartinspectie worden gebruikt, voor zover deze regels niet in strijd zijn met het bepaalde bij of krachtens
      dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel1
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.7
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '1'
        hoofdstuk: '1'
  - number: 1.7a.1
    text: |-
      Onze Minister wijst de natuurlijke personen en rechtspersonen aan die zijn belast met de door hem aan te geven, in
      het kader van de onderzoeken, bedoeld in [artikel 1.12][ref1], te verrichten taken.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel1
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.7a
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '1'
        hoofdstuk: '1'
  - number: 1.7a.2
    text: |-
      Een ingevolge het eerste lid aangewezen natuurlijke persoon of rechtspersoon is, indien bij een onderzoek gebreken
      aan het vissersvaartuig of zijn uitrusting worden geconstateerd, bevoegd om herstel van deze gebreken te vorderen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.7a
  - number: 1.7a.3
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze waarop de ingevolge het eerste
      lid aangewezen natuurlijke personen of rechtspersonen hun taken uitoefenen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.7a
  - number: 1.8.1
    text: |-
      Een vissersvaartuig is voorzien van een certificaat van overeenstemming volgens het model, opgenomen in de bijlage
      bij dit besluit. Op verzoek kan het certificaat ook in de Engelse taal worden afgegeven.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.8
  - number: 1.8.2
    text: |-
      Een certificaat van overeenstemming wordt afgegeven indien uit een eerste onderzoek als bedoeld in
      [artikel 1.12, eerste lid][ref1], is gebleken dat het vissersvaartuig aan de voorschriften van dit besluit voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel1
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.8
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '1'
        hoofdstuk: '1'
  - number: 1.8.3
    text: |-
      Een certificaat van overeenstemming wordt telkens vernieuwd indien uit een periodiek onderzoek als bedoeld in
      [artikel 1.12, tweede lid, onderdeel a][ref1], is gebleken dat het vissersvaartuig aan de voorschriften van dit
      besluit voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel1
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.8
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '1'
        hoofdstuk: '1'
  - number: 1.8.4
    text: |-
      Het certificaat van overeenstemming gaat vergezeld van een inventaris van uitrusting volgens het model, opgenomen
      in de bijlage bij dit besluit.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.8
  - number: '1.9'
    text: |-
      Een certificaat van vrijstelling wordt afgegeven naast een certificaat van overeenstemming indien voor een
      vissersvaartuig op grond van een vrijstellingsregeling krachtens [artikel 5, eerste lid, van de Schepenwet][ref1]
      afwijking is toegestaan van enig voorschrift, gesteld bij of krachtens dit besluit. Het certificaat komt overeen
      met het model, opgenomen in de bijlage bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel5
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.9
    references:
      - id: ref1
        bwb_id: BWBR0001876
        artikel: '5'
  - number: 1.10.1
    text: |-
      Een certificaat van overeenstemming heeft een geldigheidsduur van ten hoogste vier jaar en kan slechts
      voor de tijd van ten hoogste een jaar worden verlengd na een periodiek onderzoek als bedoeld in
      [artikel 1.12, tweede lid, onderdeel a][ref1], onverminderd het bepaalde in het derde en vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel1
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.10
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '1'
        hoofdstuk: '1'
  - number: 1.10.2
    text: |-
      De geldigheidsduur van het certificaat van vrijstelling overschrijdt de geldigheidsduur van het certificaat van
      overeenstemming niet.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.10
  - number: 1.10.3
    text: |-
      Indien een vissersvaartuig zich ten tijde van het aflopen van de geldigheidsduur van het certificaat van
      overeenstemming buiten de grenzen van het Koninkrijk bevindt, kan de geldigheidsduur van genoemd certificaat door
      het Hoofd van de Scheepvaartinspectie worden verlengd met een tijdsduur van ten hoogste vijf maanden, teneinde het
      vissersvaartuig in staat te stellen zijn reis te voltooien naar een haven waar het aan een periodiek onderzoek zal
      worden onderworpen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.10
  - number: 1.10.4
    text: |-
      Een vissersvaartuig ten behoeve waarvan een verlenging als bedoeld in het derde lid is verleend, mag, nadat het in
      de haven waar het aan het onderzoek zal worden onderworpen is aangekomen, niet krachtens een dergelijke verlenging
      die haven verlaten zonder een nieuw certificaat van overeenstemming te hebben verkregen.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.10
  - number: 1.10.5
    text: |-
      In andere gevallen dan bedoeld in het derde lid kan het Hoofd van de Scheepvaartinspectie de geldigheidsduur van
      het certificaat verlengen voor de tijd van ten hoogste een maand, aanvangende op de op het certificaat vermelde
      vervaldatum.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.10
  - number: 1.10.6
    text: |-
      In het geval de geldigheidsduur van het certificaat van overeenstemming overeenkomstig het derde of vijfde lid
      wordt verlengd, wordt de periode tussen de onderzoeken dienovereenkomstig verlengd.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.10
  - number: 1.11.1
    text: |-
      Voor het verkrijgen van een certificaat dient de eigenaar of de bouwer van het vissersvaartuig een aanvraag in bij
      het Hoofd van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.11
  - number: 1.11.2
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld betreffende de aanvraag van een certificaat en de
      daarbij over te leggen tekeningen en gegevens van het vissersvaartuig.
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.11
  - number: 1.12.1
    text: |-
      Een vissersvaartuig wordt onderworpen aan een eerste onderzoek voordat het in dienst wordt gesteld of voordat
      het certificaat van overeenstemming, bedoeld in [artikel 1.8][ref1], voor het eerst wordt afgegeven. Het eerste
      onderzoek omvat een volledig onderzoek van de constructie, de stabiliteit, de machine-installaties, de algemene
      inrichting, het materiaal, met inbegrip van de romp van het vissersvaartuig aan de buitenzijde en het in- en
      uitwendige van de ketels en de uitrusting, voorzover het vissersvaartuig valt onder de voorschriften van dit
      besluit. Het onderzoek is zodanig dat het zeker is dat de algemene inrichting, het materiaal en de verbanddelen
      van de constructie, ketels en andere drukvaten met toebehoren, hoofd- en hulpwerktuigen, elektrische installaties,
      radio-installaties, met inbegrip van de radio-installaties die in de groepsreddingsmiddelen worden gebruikt,
      brandbescherming, brandveiligheidssystemen en brandveiligheidsmiddelen, reddingsmiddelen en reddingsvoorzieningen,
      hulpmiddelen bij de navigatie, nautische publicaties en andere uitrusting ten volle voldoen aan de eisen van dit
      besluit. Het onderzoek is tevens zodanig dat de technische uitvoering van alle delen van het vissersvaartuig en
      zijn uitrusting in alle opzichten bevredigend is en dat het vissersvaartuig is voorzien van lichten, middelen
      voor het geven van geluidsseinen en noodseinen zoals vereist krachtens de in het Europese deel van Nederland,
      in Aruba, in Curaçao, in Sint Maarten, onderscheidenlijk in de openbare lichamen Bonaire, Sint Eustatius en Saba
      geldende voorschriften die strekken ter uitvoering van de Internationale Bepalingen ter voorkoming van aanvaringen
      op zee, 1972, bedoeld in artikel 1 van het op 20 oktober 1972 te Londen tot stand gekomen Verdrag inzake de
      Internationale Bepalingen ter voorkoming van aanvaringen op zee, 1972 (Trb. 1972, 51). In het geval loodsladders
      worden meegevoerd, worden deze eveneens onderzocht teneinde zeker te stellen dat zij deugdelijk zijn en voldoen
      aan het daaromtrent bepaalde in de vorenbedoelde voorschriften van de Internationale Bepalingen ter voorkoming van
      aanvaringen op zee, 1972.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel1
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel1.12
    references:
