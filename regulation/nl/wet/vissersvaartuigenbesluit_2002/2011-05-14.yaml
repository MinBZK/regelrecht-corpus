    text: DSC,
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.9
  - number: 9.9.2.a.2°
    text: radiotelefonie, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.9
  - number: 9.9.2.a.3°
    text: DPT, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.9
  - number: 9.9.2.b
    text: |-
      apparatuur geschikt om DSC-wacht te houden op de frequenties van 2187,5 kHz, 8414,5 kHz en ten minste een van de
      DSC nood- en veiligheidsfrequenties van 4207,5 kHz, 6312 kHz, 12 577 kHz of 16 804,5 kHz; het is te allen tijde
      mogelijk om een van deze nood- en veiligheidsfrequenties te kiezen. Deze apparatuur kan afzonderlijk zijn of
      gecombineerd met de apparatuur, bedoeld onder a, en
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.9
  - number: 9.9.2.c
    text: |-
      een voorziening die de uitzending van noodseinen vanaf het schip naar de wal kan starten door middel van een radio-
      installatie die niet in de HF-band uitzendt:
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.9
  - number: 9.9.2.c.1°
    text: |-
      de POSS op de frequentie van 406 MHz; hierin kan worden voorzien door installatie van het in artikel 9.6, onder f,
      voorgeschreven satellietnoodradiobaken zodanig dat het op de plaats aan boord waar gewoonlijk de navigatie wordt
      gevoerd of vanaf die plaats op afstand kan worden bediend, of
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.9
  - number: 9.9.2.c.2°
    text: |-
      het geostationaire INMARSAT-satellietsysteem; hierin kan worden voorzien door gebruikmaking van een INMARSAT-
      scheepssatellietstation of het in [artikel 9.6, onder f][ref1], voorgeschreven satellietnoodradiobaken, zodanig
      geïnstalleerd dat het op de plaats aan boord waar gewoonlijk de navigatie wordt gevoerd of vanaf die plaats op
      afstand kan worden bediend;


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel9
    url: https://wetten.overheid.nl/BWBR0013342/2011-05-14#Artikel9.9
