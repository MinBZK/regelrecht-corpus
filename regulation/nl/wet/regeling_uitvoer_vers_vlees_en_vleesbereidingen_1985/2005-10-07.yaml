$id: regeling_uitvoer_vers_vlees_en_vleesbereidingen_1985
regulatory_layer: WET
publication_date: '2005-12-23'
valid_from: '2005-10-07'
bwb_id: BWBR0003737
url: https://wetten.overheid.nl/BWBR0003737/2005-10-07
preamble:
  text: |-
    Overwegende dat uitvoering dient te worden gegeven aan de Richtlijn van de Raad van de Europese Economische
    Gemeenschap van 26 juni 1964, inzake gezondheidsvraagstukken op het gebied van het intracommunautaire
    handelsverkeer in vers vlees, no. 64/433/EEG (PbEG L 121), zoals deze is gewijzigd bij Richtlijn van de Raad van 7
    februari 1983, no. 83/90/EEG (PbEG L 59);

    Gezien de Richtlijn van de Raad van de Europese Gemeenschappen van 12 december 1972, inzake veterinairrechtelijke
    vraagstukken op het gebied van het intracommunautaire handelsverkeer in vers vlees, no. 72/461/EEG (PbEG L 302);

    Gelet op de artikelen 68 en 70, tweede lid, van de Veewet (Stb. 1920, 153);

    Gehoord het Landbouwschap, het Produktschap voor Vee en Vlees en de Centrale Organisatie voor de Vleesgroothandel;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:


              [richtlijn 64/433/EEG](31964L0433):

              richtlijn van de Raad van de Europese Gemeenschappen betreffende de gezondheidsvoorschriften voor de
      produktie en het in de handel brengen van vers vlees (PbEG 1964, L 121);




              *richtlijn 72/461/EEG:*


              richtlijn van de Raad van de Europese Gemeenschappen van 12 december 1972 inzake veterinairrechtelijke
      vraagstukken op het gebied van het intracommunautaire handelsverkeer in vers vlees (PbEG L 302);




              *richtlijn 77/96/EEG:*


              richtlijn van de Raad van de Europese Gemeenschappen van 21 december 1976, inzake het opsporen van
      trichinen bij de invoer van vers vlees van varkens, huisdieren, uit derde landen (PbEG 1977, L 26);




              [richtlijn 77/99/EEG](31977L0099):

              richtlijn van de Raad van de Europese Gemeenschappen betreffende de gezondheidsvoorschriften voor de
      produktie en het in de handel brengen van vleesprodukten en bepaalde andere produkten van dierlijke oorsprong (PbEG
      1977, L 26);




              *richtlijn 2001/89/EG:*


              richtlijn van de Raad van 23 oktober 2001 betreffende maatregelen van de Gemeenschap ter bestrijding van
      klassieke varkenspest (PbEG L 316/5).




              [richtlijn 88/657/EEG](31988L0657):

              richtlijn van de Raad van de Europese Gemeenschappen van 14 december 1988 tot vaststelling van de eisen
      voor de produktie van en het handelsverkeer in gehakt, vlees in stukken van minder dan 100 gram en vleesbereidingen
      en tot wijziging van de [richtlijnen 64/433/EEG](31964L0433), [71/118/EEG](31971L0118) en [72/462/EEG](31972L0462)
      (PbEG, L 382);




              [richtlijn 89/662/EEG](31989L0662):

              richtlijn van de Raad van de Europese Gemeenschappen van 11 december 1989 inzake veterinaire controles
      in het intracommunautaire handelsverkeer in het vooruitzicht van de totstandbrenging van de interne markt (PbEG
      L 395);




              *richtlijn 91/495/EEG:*


              richtlijn van de Raad van de Europese Gemeenschappen van 27 november 1990, inzake gezondheidsvoorschriften
      en veterinairrechtelijke voorschriften voor de produktie en het in de handel brengen van konijnevlees en vlees van
      gekweekt wild (PbEG L 268);




              [richtlijn 97/78/EG](31997L0078):

              [richtlijn nr. 97/78/EG](31997L0078) van de Raad van de Europese Unie van 18 december 1997 tot vaststelling
      van de beginselen voor de organisatie van de veterinaire controles voor producten uit derde landen in de
      Gemeenschap worden binnengebracht (PbEG 1998, L 24).



            beschikking 2001/471/EG:

              beschikking 2001/471/EG van de Commissie van de Europese Gemeenschappen van 8 juni 2001 tot vaststelling
      van voorschriften voor het regelmatig doen controleren van de algemene hygiëne door de exploitanten in inrichtingen
      overeenkomstig [richtlijn 64/433/EEG](31964L0433) betreffende de gezondheidsvoorschriften voor de productie en het
      in de handel brengen van vers vlees en [richtlijn 71/118/EEG](31971L0118) inzake gezondheidsvraagstukken op het
      gebied van de productie en het in de handel brengen van vers vlees van pluimvee (PbEG L 165);




              *verordening 999/2001/EG:*


              [verordening nr. 999/2001/EG](32001R0999) van het Europees Parlement en de Raad van 22 mei 2001, houdende
      vaststelling van voorschriften inzake preventie, bestrijding en uitroeiing van bepaalde overdraagbare spongiforme
      encefalopathieën;




              *verordening 136/2004/EG:*


              [verordening (EG) nr. 136/2004](32004R0136) van de Commissie van de Europese Gemeenschappen van 22 januari
      2004 tot vaststelling van procedures voor de veterinaire controles in de grensinspectieposten van de Gemeenschap
      bij het binnenbrengen van producten uit derde landen (PbEU L 21);




              *Minister:*


              Minister van Landbouw, Natuurbeheer en Visserij;




              *VWA:*


              de Voedsel en Waren Autoriteit, ingesteld bij besluit van de Minister van Volksgezondheid, Welzijn en Sport
      van 8 juli 2002 (Stcrt. 127);




              *ambtenaar:*


              ambtenaar als bedoeld in [artikel 114, tweede lid, van de Gezondheids- en welzijnswet voor dieren][ref1];.



            officiële dierenarts:

              door de bevoegde centrale autoriteit van het land van verzending aangewezen dierenarts;



            vee:

              runderen, varkens, schapen, geiten en eenhoevige dieren, voor zover de dieren als huisdieren worden
      gehouden;



            kalf:

              rund met een geslacht gewicht van ten hoogste 175 kg, dat nog geen vaste tanden heeft;



            nuchter kalf:

              rund met een gewicht beneden 60 kg, onderscheidenlijk een geslacht gewicht beneden 35 kg;



            vers vlees:

              alle voor menselijke consumptie geschikte delen van vee, ook vacuüm of in gecontroleerde atmosfeer verpakt,
      die, buiten de koudebehandeling, geen behandeling ter bevordering van de houdbaarheid hebben ondergaan;



            separatorvlees:

              vlees dat machinaal is afgescheiden van beenderen met daaraan vastzittend vlees, met uitzondering van
      kopbeenderen, poten onder het voorkniegewricht, respectievelijk het spronggewicht, alsmede varkensstaarten, bestemd
      voor de verwerking tot vleesprodukten als bedoeld in artikel 2, onderdeel a, van [richtlijn 77/99/EEG](31977L0099);



            gehakt:

              vlees als bedoeld in artikel 2, onderdeel 2, subonderdeel a, van [richtlijn 88/657/EEG](31988L0657), niet
      zijnde een produkt dat een van de behandelingen heeft ondergaan, genoemd in artikel 2, onderdeel f, van [richtlijn
      77/99/EEG](31977L0099) en dat niet meer de kenmerken van vers vlees heeft;



            vlees in stukken van minder dan 100 gram:

              vlees als bedoeld in artikel 2, subonderdeel b, van [richtlijn 88/657/EEG](31988L0657), niet zijnde een
      produkt dat een van de behandelingen heeft, ondergaan, genoemd in artikel 2, onderdeel f, van [richtlijn 77/99/EEG]
      (31977L0099) en dat niet meer de kenmerken van vers vlees heeft;



            vleesbereidingen:

              bereidingen van vlees als bedoeld in artikel 2, onderdeel 2, subonderdeel c, van [richtlijn 88/657/EEG]
      (31988L0657), niet zijnde een produkt dat een van de behandelingen heeft ondergaan, genoemd in artikel 2, onderdeel
      f, van [richtlijn 77/99/EEG](31977L0099) en dat niet meer de kenmerken van vers vlees heeft;




              *gekweekt wild:*


              niet als huisdier beschouwde landzoogdieren, niet zijnde konijnen of hazen, die niet worden vermeld
      in artikel 1, eerste lid, van [richtlijn 64/433/EEG](31964L0433) en die worden gehouden als huisdieren. Niet-
      gedomesticeerde zoogdieren die leven op een afgesloten gebied onder soortgelijke omstandigheden ten aanzien van
      vrijheid als wild worden evenwel niet als gekweekt wild beschouwd;




              *vlees van gekweekt wild:*


              alle voor menselijke consumptie geschikte delen van gekweekt wild;



            karkas:

              uitgebloed geheel slachtdier als bedoeld in artikel 2, onderdeel d, van [richtlijn 64/433/EEG](31964L0433);



            slachtafval:

              vers vlees dat geen deel uitmaakt van een karkas, ook indien het op natuurlijke wijze met het karkas
      verbonden blijft;



            onmiddellijke verpakking:

              het beschermen van vers vlees door middel van een eerste omhulsel dat, of een eerste transportverpakking
      die, rechtstreeks in contact komt met het betrokken verse vlees, alsmede het eerste omhulsel of de eerste
      transportverpakking zelf;



            eindverpakking:

              het plaatsen van vers vlees in onmiddellijke verpakking in een tweede transportverpakking, alsmede de
      transportverpakking zelf;



            werkplaats:

              uitsnijderij of inrichting voor de produktie van gehakt of vlees in stukken van minder dan 100 gram,
      onderscheidenlijk werkplaats voor vleesbereidingen;



            zelfstandige produktie-eenheid:

              werkplaats die zich noch in de lokalen noch in een bijgebouw van een overeenkomstig [richtlijn 64/433/EEG]
      (31964L0433) of 77/99/EEG erkende inrichting bevindt;




              *herverpakkingscentrum:*


              werkplaats of opslagplaats waar vlees, voorzien van een onmiddellijke verpakking en bestemd te worden
      uitgevoerd naar een lid-staat of Noorwegen, opnieuw wordt bijeengebracht of herverpakt;



            partij:

              eenzelfde hoeveelheid vlees van dezelfde aard waarvoor – voor zover voorgeschreven - eenzelfde veterinair
      certificaat of document geldt, die met hetzelfde vervoermiddel wordt vervoerd van één inrichting naar eenzelfde
      plaats van bestemming;



            lid-staat:

              lid-staat van de Europese Unie, niet zijnde Nederland;



            derde land:

              land, niet zijnde Nederland en niet zijnde een lid-staat,




              [richtlijn 64/432/EEG](31964L0432):

              [richtlijn nr. 64/432/EEG](31964L0432) van de Raad van Europese Gemeenschappen van 26 juni 1964, inzake
      veterinairrechtelijke vraagstukken op het gebied het intracommunautaire handelsverkeer in runderen en varkens (PbEG
      L121);




              [verordening 1760/2000](32000R1760):

              [verordening (EG) nr. 1760/2000](32000R1760) van het Europees Parlement en de Raad van de Europese Unie van
      17 juli 2000 (PbEG L 204) tot vaststelling van een identificatie- en registratieregeling voor runderen en inzake
      de etikettering van rundvlees en rundvleesproducten en tot intrekking van [Verordening (EG) nr. 820/97](31997R0820)
      van de Raad van de Europese Unie;



            e. I&R-systeem rund:

              gecomputeriseerd gegevensbestand als bedoeld in artikel 5 van [verordening 1760/2000](32000R1760);




              [verordening 1829/2003](32003R1829):

              verordening (EG) nr. 1829/2003 van het Europees Parlement en de Raad van de Europese Unie van 22 september
      2003 inzake genetisch gemodificeerde levensmiddelen en diervoeders (PbEU L 268);




              [verordening 1830/2003](32003R1830):

              verordening (EG) nr. 1830/2003 van het Europees Parlement en de Raad van de Europese Unie van 22 september
      2003 betreffende de traceerbaarheid van genetisch gemodificeerde organismen en de traceerbaarheid van met genetisch
      gemodificeerde organismen geproduceerde levensmiddelen en diervoeders en tot wijziging van [Richtlijn 2001/18/EG]
      (32001L0018) (PbEU L 268).


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel114
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '114'
  - number: '2.1'
    text: |-
      De eisen, bedoeld in [artikel 68, eerste lid, van de Veewet][ref1] (Stb. 1920, 153) zijn voor wat betreft in
      Nederland verkregen vers vlees in de vorm van hele geslachte dieren, halve geslachte dieren, halve geslachte dieren
      die in ten hoogste drie stukken zijn verdeeld, en vierendelen de volgende:


      [ref1]: https://wetten.overheid.nl/BWBR0001900#Artikel68
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001900
        artikel: '68'
  - number: 2.1.a
    text: |-
      het vlees moet afkomstig zijn van vee, dat is geslacht in een krachtens [artikel 9][ref1] erkend slachthuis;


      [ref1]: https://wetten.overheid.nl/BWBR0003737#Artikel9
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003737
        artikel: '9'
        hoofdstuk: IV
  - number: 2.1.b
    text: |-
      het vlees moet afkomstig zijn van vee, dat overeenkomstig artikel 3, eerste lid, onderdeel A, sub b, van [richtlijn
      64/433/EEG](31964L0433) is gekeurd en op grond van die keuring geschikt is bevonden om te worden geslacht voor
      uitvoer;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.1.c
    text: |-
      het vlees moet zijn behandeld overeenkomstig artikel 3, eerste lid, onderdeel A, sub c, van [richtlijn 64/433/
      EEG](31964L0433);
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.1.d
    text: |-
      het vlees moet zijn onderworpen aan een keuring na het slachten, overeenkomstig artikel 3, eerste lid, onderdeel
      A, sub d, van [richtlijn 64/433/EEG](31964L0433) en moet op grond van die keuring niet ongeschikt voor menselijke
      consumptie zijn bevonden of gevaarlijk voor de gezondheid van de mens;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.1.e
    text: |-
      het vlees is opgeslagen overeenkomstig artikel 3, eerste lid, onderdeel A, sub f, van [richtlijn 64/433/EEG]
      (31964L0433);
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.1.f
    text: |-
      het vlees moet worden vervoerd overeenkomstig hoofdstuk XV van bijlage I van [richtlijn 64/433/EEG](31964L0433),
      met dien verstande dat voor zover het betreft gehakt, vlees in stukken van minder dan 100 gram of vleesbereidingen
      het vervoer moet geschieden met inachtneming van het bepaalde in hoofdstuk VIII van bijlage I van [richtlijn
      88/657/EEG](31988L0657);
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.1.g
    text: het vlees mag niet afkomstig zijn van
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.1.g.1
    text: mannelijke varkens bestemd voor de fok;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.1.g.2
    text: cryptorchiede en hermafrodiete varkens;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.1.g.3
    text: |-
      niet gecastreerde mannelijke varkens met een geslacht gewicht hoger dan 80 kg, tenzij het slachthuis ten genoegen
      van de Minister kan aantonen dat karkassen met een uitgesproken seksuele geur kunnen worden opgespoord;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.1.g.4
    text: |-
      varkens, welke niet vergezeld gaan van de verklaring, bedoeld in
      [artikel 2 van de Regeling bedrijfscontrole dierziekten 1993][ref1], tenzij het betreft varkens als bedoeld in
      [artikel 5 van die regeling][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0006100#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006100#Artikel5
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006100
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006100
        artikel: '5'
  - number: 2.1.h
    text: |-
      voor zover het vlees afkomstig is van varkens of paarden, heeft het vlees, indien het niet overeenkomstig
      [richtlijn 77/96/EEG](31977L0096) op trichinen is onderzocht, een koudebehandeling ondergaan overeenkomstig die
      richtlijn;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.1.i
    text: |-
      het vlees mag niet afkomstig zijn van dieren waaraan blijkens een onderzoek van hun uitscheidingsprodukten,
      lichaamsvloeistoffen of weefselstoffen met hormonale of anti-hormonale werking zijn toegediend. Het onderzoek
      moet voldoen aan de criteria zoals vermeld in de bijlage bij de beschikking van de Commissie van de Europese
      Gemeenschappen van 14 juli 1987 tot vaststelling van de methoden voor het opsporen van residuen van stoffen met
      hormonale werking en van stoffen met thyreostatische werking (87/410/EEG, Pb.EG L 223) en geschiedt door het
      laboratorium van de VWA . Steekproefsgewijs vindt onderzoek naar de aanwezigheid van:
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.1.i.1º
    text: stilbenen, stilbeenderivaten, zouten en esters daarvan;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.1.i.2º
    text: thyreostatica;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.1.i.3º
    text: |-
      andere stoffen met oestrogene, androgene of gestagene werking, plaats bij runderen, varkens, schapen, geiten
      en eenhoevige dieren met ten minste de in [bijlage I][ref1] aangegeven frequentie en overeenkomstig de in
      [bijlage II][ref2] beschreven methoden.


      [ref1]: https://wetten.overheid.nl/BWBR0003737
      [ref2]: https://wetten.overheid.nl/BWBR0003737
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003737
      - id: ref2
        bwb_id: BWBR0003737
  - number: 2.1.j
    text: |-
      het vlees mag niet afkomstig zijn van dieren waarin een grotere hoeveelheid van een of meer diergeneesmiddelen
      dan wel bestanddelen of omzettingsprodukten daarvan aanwezig blijkt te zijn dan krachtens de
      [Diergeneesmiddelenwet][ref1] (Stb. 1985, 410) is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003818
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003818
  - number: 2.1.k
    text: |-
      het vlees mag niet afkomstig zijn van dieren waaraan blijkens een onderzoek van de nieren antibiotica zijn
      toegediend noch mag het vlees blijkens een onderzoek op residuen meer werkzame stoffen van bestrijdingsmiddelen,
      daaronder begrepen eventuele giftige omzettingsprodukten (metabolieten), bevatten dan op grond van de Beschikking
      Residuen van Bestrijdingsmiddelen (Stcrt. 1984, 54) toelaatbaar is; het bedoelde onderzoek op antibiotica dient bij
      ten minste 0,5% van de geslachte dieren plaats te vinden en geschiedt volgens de methode, beschreven in bijlage I
      van het Onderzoekingsregulatief (Stcrt. 1957, 55);
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.1.l
    text: |-
      het vlees is niet afkomstig van dieren waarin blijkens onderzoek overeenkomstig artikel 3 van het
      Onderzoekingsregulatief 1994 chlooramphenicol aanwezig is;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.1.m
    text: |-
      het vlees mag niet afkomstig zijn van dieren waarvan in de urine blijkens onderzoek 3 of meer ppb clenbuterol,
      daaronder begrepen eventuele omzettingsprodukten, is aangetoond. Het onderzoek geschiedt met een gaschromatografie-
      massaspectrometrie, die voldoende gevoelig, nauwkeurig en specifiek is en bovendien een reproduceerbaar resultaat
      geeft. Het onderzoek wordt uitgevoerd door het laboratorium van de VWA. Steekproefsgewijs vindt onderzoek naar de
      aanwezigheid van (residuen van) clenbuterol plaats bij 100 runderen ouder dan 1 jaar, 0,1% van de runderen jonger
      dan 1 jaar en 100 varkens die jaarlijks ter keuring worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.1.n
    text: |-
      het vlees mag niet afkomstig zijn van varkens waarvan bij de keuring van de nier in totaal 10 ppb of meer carbadox
      (uitgedrukt in desoxycarbadox) of desoxycarbadox wordt aangetoond. Het onderzoek wordt uitgevoerd door het
      laboratorium van de VWA. Het onderzoek geschiedt volgens het volgende onderzoeksmodel:
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.1.n.a
    text: |-
      een vooronderzoek met een HPLC/UV detectiemethode (hogedruk vloeistof chromatografie met een ultra-violet detectie
      bij een vaste golflengte), die, indien 10 ppb of meer desoxycarbadox wordt aangetoond, wordt bevestigd met:
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.1.n.b
    text: |-
      een bevestigingsonderzoek met een HPLC/DAD-methode (hogedruk vloeistof chromatografie met diode-arraydetectie
      waarbij het volledig ultraviolet spectrum wordt gemeten).
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.1.o
    text: |-
      het vlees mag niet afkomstig zijn van dieren waarvan bij de keuring in het vlees 100 ppb of meer sulfadimidine,
      sulfadimethoxine, sulfadiazine, sulfadoxine of dapson wordt aangetoond. Het onderzoek geschiedt door het
      laboratorium van de VWA. Het onderzoek geschiedt volgens het volgende onderzoeksmodel:
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.1.o.a
    text: |-
      een vooronderzoek met een HPTLC-methode (dunne laag chromatografie methode), die, indien 100 ppb of meer residue
      wordt aangetoond, wordt bevestigd met:
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.1.o.b
    text: |-
      een bevestigingsonderzoek met een HPLC/DAD-methode (hogedruk vloeistof chromatografie met diode-array-detectie
      waarbij het volledig ultraviolet spectrum wordt gemeten).
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.1.p
    text: |-
      het vlees mag niet afkomstig zijn van dieren waarvan bij de keuring in de nier 100 ppb of meer acepromazine,
      chloorpromazine, propionyl-promazine, azaperon of xylazin wordt aangetoond. Het onderzoek wordt uitgevoerd door het
      laboratorium van de VWA. Het onderzoek geschiedt volgens het volgende onderzoeksmodel:
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.1.p.a
    text: |-
      een vooronderzoek met een HPLC/UV detectiemethode (hogedruk vloeistof chromatografie met een ultra-violet detectie
      bij een vaste golflengte), die, indien 100 ppb of meer residu wordt aangetoond, wordt bevestigd met:
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.1.p.b
    text: |-
      een bevestigingsonderzoek met een HPLC/DAD-methode (hogedruk vloeistof chromatografie met diode-array-detectie
      waarbij het volledig ultraviolet spectrum wordt gemeten).
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.1.q
    text: |-
      het vlees mag niet afkomstig zijn van dieren waarvan bij de keuring in de nier 100 ppb of meer carazolol wordt
      aangetoond. Het onderzoek wordt uitgevoerd door het laboratorium van de VWA. Het onderzoek geschiedt volgens het
      volgende onderzoeksmodel:
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.1.q.a
    text: |-
      een vooronderzoek met een HPLC/Fluorescentie detectiemethode (hogedruk vloeistof chromatografie met een
      fluorescentiedetectie) die, indien 100 ppb of meer residu wordt aangetoond, wordt bevestigd met:
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.1.q.b
    text: |-
      een bevestigingsonderzoek met een HPLC/DAD-methode (hogedruk vloeistof chromatografie met diode-array-detectie
      waarbij het volledig ultraviolet spectrum wordt gemeten).
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.1.r
    text: |-
      het vlees mag niet afkomstig zijn van dieren waarvan bij de keuring in het vlees de aanwezigheid van furazolidon
      wordt aangetoond. Het onderzoek geschiedt door het laboratorium van de VWA. Het onderzoek geschiedt volgens het
      volgende onderzoeksmodel:
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.1.r.a
    text: |-
      een vooronderzoek met een CFLC-methode (Continuous Flow Liquid Chromatografy), die, indien 5 ppb of meer residu
      wordt aangetoond, wordt bevestigd met:
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.1.r.b
    text: |-
      een bevestigingsonderzoek met een HPLC/UV-methode (hogedruk vloeistof chromatografie met ultraviolet detec bij een
      vaste golflengte).
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.1.s
    text: |-
      het vlees mag niet afkomstig zijn van dieren waarin bij de keuring stoffen worden aangetoond waarvan de toediening
      bij of krachtens een wettelijk voorschrift is verboden. Het onderzoek geschiedt door het laboratorium van de
      VWA. Het onderzoek geschiedt met methoden die voldoende gevoelig, nauwkeurig en specifiek zijn en bovendien een
      reproduceerbaar resultaat geven en geschiedt voor zover het arsenicum, cadmium, lood en kwik betreft volgens
      de technieken beschreven in de beschikking van de Commissie van 26 september 1990 tot vaststelling van de
      referentiemethoden voor het opsporen van residuen van zware metalen en arsenicum (Pb EG L 286), zoals deze is of
      zal zijn;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.1.t
    text: |-
      het vlees mag niet afkomstig zijn van dieren behorende tot een groep aangevoerd van één bedrijf waarvan op grond
      van een steekproefsgewijs onderzoek moet worden aangenomen dat het vlees van de dieren meer werkzame stoffen
      van bestrijdingsmiddelen, daaronder begrepen eventuele giftige omzettingsprodukten (metabolieten), bevat, dan
      op grond van de Beschikking Residuen van Bestrijdingsmiddelen toelaatbaar is, noch mag het vlees afkomstig zijn
      van kalveren, behorende tot een groep aangevoerd van één mestbedrijf, waarvan op grond van een steekproefsgewijs
      onderzoek van de urine of van weefsel moet worden aangenomen dat aan een of meer dieren van die groep stoffen met
      hormonale of antihormonale werking zijn toegediend;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.1.u
    text: |-
      het vlees mag niet afkomstig zijn van dieren waarin blijkens onderzoek van skeletspiervlees de gezamenlijke
      radioactiviteit van Caesium 134 en 137 in skeletspiervlees de waarden van 600 Bq per kg overschrijdt;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.1.v
    text: |-
      het vlees moet afkomstig zijn van runderen die overeenkomstig [verordening 1760/2000](32000R1760) zijn
      geïdentificeerd en geregistreerd dan wel van runderen die ingevolge [artikel 10, zevende lid][ref1], van deze
      regeling voor de slachting zijn toegelaten;


      [ref1]: https://wetten.overheid.nl/BWBR0003737#Artikel10
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003737
        artikel: '10'
        hoofdstuk: V
  - number: 2.1.w
    text: |-
      voor zover dit niet reeds voortvloeit uit de voorgaande onderdelen, - mag het niet betreffen vlees dat
      overeenkomstig artikel 5, eerste lid, van [richtlijn 64/433/EEG](31964L0433) voor menselijke consumptie ongeschikt
      moet worden verklaard;
        - mag het vlees niet afkomstig zijn van dieren, waarvan op grond van bevindingen bij de keuring door de officiële
      dierenarts de aanwezigheid van residuen wordt vermoed. Indien dit vermoeden bestaat moeten de desbetreffende dieren
      of het vlees daarvan op residuen worden onderzocht overeenkomstig artikel 8 van [richtlijn 64/433/EEG](31964L0433).
      Indien in het onderzochte vlees sporen van residuen voorkomen in hoeveelheden die de toegestane toleranties
      overschrijden, moet dit vlees voor menselijke consumptie ongeschikt worden verklaard;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.1.x
    text: |-
      voorzover het vlees afkomstig is van runderen, schapen of geiten; - betreft het geen separatorvlees afkomstig van
      beenderen als bedoeld in bijlage XI, hoofdstuk A, punt 3, van [verordening 999/2001/EG](32001R0999);
        - betreft het uitsluitend vlees van dieren die de in bijlage XI, hoofdstuk A, punt 4, van [verordening 999/2001/EG]
      (32001R0999) bedoelde vernietiging van het weefsel van het centrale zenuwstelsel niet hebben ondergaan;
        - betreft het uitsluitend vlees van dieren waarbij het gespecificeerd risicomateriaal als bedoeld in bijlage
      XI, hoofdstuk A, punt 1, onder a, van [verordening 999/2001/EG](32001R0999), voorzover van toepassing, is
      verwijderd, met dien verstande dat bij vlees van na 31 maart 2002 geslachte runderen, de wervelkolom, inclusief
      achterwortelganglia, niet behoeft te worden verwijderd, mits het vlees uitsluitend wordt vervoerd naar een lidstaat
      en is voldaan aan bijlage XI, hoofdstuk A, punt 14, onder a en b, van [verordening 999/2001/EG](32001R0999);
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.1.y
    text: |-
      het vlees mag niet afkomstig zijn van runderen, bedoeld in bijlage III, hoofdstuk A, onderdeel I, punt 2.1 en
      2.2, van [verordening 999/2001/EG](32001R0999), indien de desbetreffende runderen niet overeenkomstig bijlage
      III, hoofdstuk A, onderdeel I, punt 2.1 en punt 2.2, van [verordening 999/2001/EG](32001R0999) met de snelle test,
      bedoeld in bijlage X, hoofdstuk C, punt 4, van [verordening 999/2001/EG](32001R0999) op BSE zijn getest en waarvan
      de uitslag van de test niet negatief is;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.1.z
    text: |-
      inzoverre in afwijking van onderdeel x, aanhef en derde gedachtenstreepje, behoeft in vlees van runderen ouder
      dan 12 maanden, die vóór 1 april 2002 zijn geslacht, de wervelkolom, inclusief achterwortelganglia, niet te worden
      verwijderd, met dien verstande dat indien dat vlees afkomstig is van runderen die na 11 april 2001 zijn geslacht,
      het vlees uitsluitend wordt vervoerd naar een lidstaat;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.1.aa
    text: 'is voldaan aan:'
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.1.aa.1°
    text: |-
      de artikelen 4, eerste, tweede en zesde lid, 8, eerste lid, 9, eerste en derde lid, en 13 van [verordening
      1829/2003](32003R1829);
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.1.aa.2°
    text: |-
      de artikelen 4, eerste, tweede, vierde en zesde lid, en 5, eerste en tweede lid, van [verordening 1830/2003]
      (32003R1830);
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.1.ab
    text: |-
      het vlees mag niet afkomstig zijn van schapen of geiten, bedoeld in bijlage III, hoofdstuk A, onderdeel II, punt
      2, van [verordening 999/2001/EG](32001R0999), die overeenkomstig bijlage III, hoofdstuk A, onderdeel II, punt 2,
      van [verordening 999/2001/EG](32001R0999) op TSE zijn getest met de snelle test, bedoeld in bijlage X, hoofdstuk C,
      punt 4, van [verordening 999/2001/EG](32001R0999), indien de uitslag van die test niet negatief is.
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: '2.5'
    text: |-
      Onverminderd het eerste en tweede lid heeft vers vlees van runderen of varkens, bestemd voor Finland en Zweden,
      in de krachtens [artikel 9][ref1] erkende inrichting van oorsprong een steekproefsgewijze microbiologische test
      ondergaan overeenkomstig de door de Raad van de Europese Unie krachtens artikel 5, derde lid, onderdeel a, van
      [richtlijn 64/433/EEG](31964L0433) vastgestelde bepalingen, waarbij de afwezigheid van salmonella in dat vlees
      is aangetoond.


      [ref1]: https://wetten.overheid.nl/BWBR0003737#Artikel9
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003737
        artikel: '9'
        hoofdstuk: IV
  - number: '2.6'
    text: 'Het vijfde lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.6.a
    text: |-
      vers vlees dat is bestemd in de inrichting van bestemming te worden gepasteuriseerd of gesteriliseerd, dan wel een
      gelijkwaardige behandeling te ondergaan, met dien verstande dat tot en met 31 december 1997 de eisen, opgenomen
      in het door de Commissie van de Europese Gemeenschappen op grond van artikel 5, vierde lid, van [richtlijn 64/433/
      EEG](31964L0433) goedgekeurde operationele programma van Finland, onderscheidenlijk Zweden inzake salmonella, van
      toepassing zijn;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: 2.6.b
    text: |-
      vers vlees dat afkomstig is uit een inrichting waarvoor een programma geldt dat door de Raad van de Europese
      Unie, dan wel door de Commissie van de Europese Gemeenschappen op grond van artikel 5, derde lid, onderdeel c,
      van [richtlijn 64/433/EEG](31964L0433) is erkend als gelijkwaardig aan het onderscheiden programma, bedoeld in
      onderdeel a.
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel2
  - number: '3'
    text: |-
      De eisen, bedoeld in [artikel 68, eerste lid, van de Veewet][ref1] zijn voor vers vlees van in Nederland geslachte
      dieren in kleinere delen dan bedoeld in de [aanhef van het eerste lid van artikel 2][ref2] de volgende:


      [ref1]: https://wetten.overheid.nl/BWBR0001900#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0003737#Artikel2
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001900
        artikel: '68'
      - id: ref2
        bwb_id: BWBR0003737
        artikel: '2'
        hoofdstuk: II
  - number: 3.a
    text: |-
      het vlees moet zijn uitgesneden of uitgebeend dan wel van een onmiddellijke verpakking zijn voorzien in een
      overeenkomstig [artikel 9][ref1] erkende uitsnijderij;


      [ref1]: https://wetten.overheid.nl/BWBR0003737#Artikel9
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003737
        artikel: '9'
        hoofdstuk: IV
  - number: 3.b
    text: |-
      het vlees moet zijn gesneden uit vlees ten aanzien waarvan is voldaan aan het bepaalde in [artikel 2][ref1], met
      dien verstande dat, indien het vlees


      [ref1]: https://wetten.overheid.nl/BWBR0003737#Artikel2
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003737
        artikel: '2'
        hoofdstuk: II
  - number: 3.b.1
    text: |-
      met inachtneming van het bepaalde in nummer 46, onderdeel d, van hoofdstuk IX van bijlage I van [richtlijn 64/433/
      EEG](31964L0433) warm wordt uitgesneden dan wel
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel3
  - number: 3.b.2
    text: |-
      indien het rund- of varkensvlees betreft, in afwijking van het bepaalde in nummer 46, onderdeel d, van hoofdstuk
      IX van bijlage I van [richtlijn 64/433/EEG](31964L0433) wordt uitgesneden onder de voorwaarden, vastgesteld in de
      bijlage van Beschikking 87/260/EEG van de Commissie van de Europese Gemeenschappen van 28 april 1987, waarbij aan
      Nederland een afwijking wordt toegestaan en de gelijkwaardige gezondheidsvoorwaarden worden vastgesteld die in acht
      moeten worden genomen bij het uitsnijden van vers vlees (PbEG L 123),
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel3
  - number: 3.c
    text: |-
      behoudens het geval, bedoeld in onderdeel b, sub 2, moet het vlees zijn uitgesneden of uitgebeend dan wel van
      een onmiddellijke verpakking zijn voorzien en verkregen overeenkomstig hoofdstuk IX van bijlage I van [richtlijn
      64/433/EEG](31964L0433);
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel3
  - number: 3.d
    text: |-
      het vlees moet zijn opgeslagen overeenkomstig artikel 3, eerste lid, onderdeel B, sub c, van [richtlijn 64/433/
      EEG](31964L0433);
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel3
  - number: 3.e
    text: |-
      het vlees moet zijn gekeurd door een officiële dierenarts, overeenkomstig het bepaalde in artikel 3, eerste lid,
      onderdeel B, sub d, van [richtlijn 64/433/EEG](31964L0433);
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel3
  - number: 3.f
    text: |-
      het vlees moet op bevredigende hygiënische wijze worden behandeld overeenkomstig de hoofdstukken V en VII van
      bijlage I van [richtlijn 64/433/EEG](31964L0433) en moet ter zake van de onmiddellijke en eindverpakking voldoen
      aan hoofdstuk XII van bijlage I van die richtlijn;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel3
  - number: 3.g
    text: |-
      terzake van slachtafvallen moet zijn voldaan aan het bepaalde in artikel 3, eerste lid, onderdeel C, van [richtlijn
      64/433/EEG](31964L0433);
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel3
  - number: 3.h
    text: |-
      terzake van vers vlees dat overeenkomstig [richtlijn 64/433/EEG](31964L0433) in een op grond van [artikel 9][ref1]
      erkend koel- of vrieshuis is opgeslagen en nadien geen andere behandeling dan voor opslag heeft ondergaan, moet
      worden voldaan aan het bepaalde in artikel 3, onderdeel D, eerste alinea, sub a, en tweede alinea, van [richtlijn
      64/433/EEG](31964L0433);


      [ref1]: https://wetten.overheid.nl/BWBR0003737#Artikel9
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003737
        artikel: '9'
        hoofdstuk: IV
  - number: 3.i
    text: |-
      vers vlees en slachtafvallen als bedoeld in artikel 6, eerste lid, onderdeel d, van [richtlijn 64/433/EEG]
      (31964L0433), moeten, na verwijdering van de voor consumptie ongeschikte delen, een koudebehandeling ondergaan.
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel3
  - number: 3.j
    text: 'het vlees onderscheidenlijk de vlees bereidingen mag onderscheidenlijk mogen niet zijn:'
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel3
  - number: 3.j.1
    text: separatorvlees, tenzij dit vlees een warmtebehandeling overeenkomstig [richtlijn 77/99/EEg](31977L0099) ondergaat;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel3
  - number: 3.j.2
    text: gehakt of vlees in stukken van minder dan 100 gram, van eenhoevigen;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel3
  - number: 3.j.3
    text: gehakt dat slachtafvallen bevat;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel3
  - number: 3.j.4
    text: van of met separatorvlees verkregen gehakt, vlees in stukken van minder dan 100 gram en vleesbereidingen.
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel3
  - number: 3.j.5
    text: |-
      voorzover het vlees afkomstig is van runderen, schapen of geiten; - separatorvlees afkomstig van beenderen als
      bedoeld in bijlage XI, hoofdstuk A, punt 3, van [verordening 999/2001/EG](32001R0999);
        - vlees van dieren die de in bijlage XI, hoofdstuk A, punt 4, van [verordening 999/2001/EG](32001R0999) bedoelde
      vernietiging van het weefsel van het centrale zenuwstelsel hebben ondergaan;
        - vlees van dieren waarbij het gespecificeerd risicomateriaal als bedoeld in bijlage XI, hoofdstuk A, punt 1,
      onder a, van [verordening 999/2001/EG](32001R0999), voorzover van toepassing, niet overeenkomstig bijlage XI,
      hoofdstuk A, punt 5, 10 en 11, van [verordening 999/2001/EG](32001R0999) is verwijderd met dien verstande dat bij
      vlees van vóór 12 april 2001 uitgesneden of uitgebeende runderen ouder dan twaalf maanden de wervelkolom, inclusief
      achterwortelganglia, met uitzondering van de staartwervels, niet behoeft te worden verwijderd;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel3
  - number: 3.k
    text: |-
      het vlees moet zijn vervoerd overeenkomstig hoofdstuk XV van bijlage I van [richtlijn 64/433/EEG](31964L0433), met
      dien verstande dat voor zover het betreft gehakt, vlees in stukken van minder dan 100 gram of vleesbereidingen, het
      vervoer moet geschieden met inachtneming van het bepaalde in hoofdstuk VIII van bijlage I van [richtlijn 88/657/
      EEG](31988L0657);
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel3
  - number: 3.l
    text: 'voor zover het betreft gehakt, vlees in stukken van minder dan 100 gram en vleesbereidingen, dient:'
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel3
  - number: 3.l.1
    text: het vlees te voldoen aan het bepaalde in de onderdelen a tot en met k;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel3
  - number: 3.l.2
    text: |-
      de bereiding plaats te vinden in een overeenkomstig [artikel 9, vierde lid][ref1], erkende werkplaats;


      [ref1]: https://wetten.overheid.nl/BWBR0003737#Artikel9
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003737
        artikel: '9'
        hoofdstuk: IV
  - number: 3.l.3
    text: |-
      op de verpakking het keurmerk voor te komen overeenkomstig hoofdstuk VII van bijlage I van [richtlijn 88/657/EEG]
      (31988L0657);
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel3
  - number: 3.l.4
    text: |-
      op de verpakking voor controledoeleinden, zichtbaar en leesbaar, naast de in [richtlijn 79/112/EEG](31979L0112)
      voorgeschreven gegevens de volgende gegevens te zijn vermeld: - de diersoort of de diersoorten waarvan het vlees
      afkomstig is en, in geval van een mengsel, het percentage van elke soort, voor zover dat niet duidelijk blijkt uit
      de verkoopbenaming van het produkt;
        - de datum van de bereiding;
        - de vermelding ‘vetpercentage lager dan …’;
        - de vermelding ‘verhouding collageen/vleeseiwit minder dan …’;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel3
  - number: 3.l.5
    text: |-
      onverminderd de subonderdelen 3 en 4, bij vlees dat is verpakt in handelsporties die bestemd zijn voor
      rechtstreekse verkoop aan de verbruiker op de verpakking zelf of op een op de verpakking bevestigd etiket een
      reproduktie van het in subonderdeel 3 voorgeschreven keurmerk voor te komen. Daarin moet het erkenningsnummer van
      de betrokken inrichting staan. De in [richtlijnen 64/433/EEG](31964L0433) en [77/99/EEG](31977L0099) voorgeschreven
      afmetingen gelden niet voor de reproduktie van het keurmerk, op voorwaarde dat de verplichte vermeldingen leesbaar
      blijven;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel3
  - number: 3.m
    text: 'voor zover het betreft gehakt dient onverminderd het bepaalde in onderdeel l:'
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel3
  - number: 3.m.1
    text: |-
      de bereiding, verpakking en opslag plaats te vinden overeenkomstig hoofdstuk III van bijlage I van [richtlijn
      88/657/EEG](31988L0657);
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel3
  - number: 3.m.2
    text: |-
      de benaming ‘gehakt van mager vlees’ of ‘gehakt’, eventueel verbonden met de naam van de diersoort waarvan het
      vlees afkomstig is, slechts gebruikt te worden voor produkten die bestemd zijn voor de eindverbruiker welke voldoen
      aan de eisen van bijlage II, punt I, van [richtlijn 88/657/EEG](31988L0657);
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel3
  - number: 3.m.3
    text: |-
      voor zover het vlees bestemd is voor een lidstaat of Noorwegen voldaan te zijn aan het bepaalde in artikel 3,
      tweede lid, aanhef, en onderdelen a tot en met d, van [richtlijn 88/657/EEG](31988L0657);
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel3
  - number: 3.n
    text: 'voor zover het betreft vlees in stukken van minder dan 100 gram dient onverminderd het bepaalde in onderdeel I:'
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel3
  - number: 3.n.1
    text: |-
      de bereiding, verpakking en opslag plaats te vinden overeenkomstig hoofdstuk II van bijlage I van [richtlijn
      88/657/EEG](31988L0657);
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel3
  - number: 3.n.2
    text: |-
      voor zover het vlees bestemd is voor een lidstaat of Noorwegen voldaan te zijn aan het bepaalde in artikel 3,
      tweede lid, aanhef, en onderdelen a tot en met d, van [richtlijn 88/657/EEG](31988L0657);
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel3
  - number: 3.o
    text: 'voor zover het betreft vleesbereidingen dient onverminderd het bepaalde in onderdeel l:'
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel3
  - number: 3.o.1
    text: |-
      de bereiding, verpakking en opslag plaats te vinden overeenkomstig hoofdstuk IV van bijlage I van [richtlijn
      88/657/EEG](31988L0657);
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel3
  - number: 3.o.2
    text: |-
      voor zover de vleesbereidingen gehakt of vlees in stukken van minder dan 100 gram bevatten en bestemd zijn voor een
      lidstaat of Noorwegen voldaan te zijn aan het bepaalde in artikel 3, tweede lid, aanhef, en onderdelen a tot en met
      e, van [richtlijn 88/657/EEG](31988L0657);
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel3
  - number: 3.p
    text: |-
      voor zover het vlees betreft dat in een op grond van [artikel 9][ref1] erkend herverpakkingscentrum, nadat de
      eindverpakking is verwijderd, opnieuw van een eindverpakking is voorzien, is voldaan aan artikel 3, eerste lid,
      onderdelen A tot en met D, van [richtlijn 64/433/EEG](31964L0433);


      [ref1]: https://wetten.overheid.nl/BWBR0003737#Artikel9
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003737
        artikel: '9'
        hoofdstuk: IV
  - number: 3.q
    text: voor zover van toepassing wordt voldaan aan [verordening 999/2001/EG](32001R0999);
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel3
  - number: 3.r
    text: 'is voldaan aan:'
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel3
  - number: 3.r.1°
    text: |-
      de artikelen 4, eerste, tweede en zesde lid, 8, eerste lid, 9, eerste en derde lid, en 13 van [verordening
      1829/2003](32003R1829);
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel3
  - number: 3.r.2°
    text: |-
      de artikelen 4, eerste, tweede, vierde en zesde lid, en 5, eerste en tweede lid, van [verordening 1830/2003]
      (32003R1830).
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel3
  - number: '4'
    text: |-
      Onverminderd het bepaalde in hoofdstuk V van bijlage 1 van [richtlijn 64/433/EEG](31964L0433) moet bij het slachten
      en uitsnijden alsmede bij de verdere behandeling van het vlees het volgende in acht worden genomen:
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel4
  - number: 4.a
    text: |-
      personeel, dat slacht of bij het slachten behulpzaam is moet deze werkzamheden uitoefenen in een overall van een
      andere kleur dan wit; personeel, dat vlees be- of verwerkt dan wel verlaadt of daarbij behulpzaam is, moet deze
      werkzaamheden uitoefenen in een witte overall of witte jas; wordt over de overall of jas een schort gedragen dat
      dient dit schort van plastic of ander gemakkelijk te reinigen materiaal en van lichte kleur te zijn;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel4
  - number: 4.b
    text: |-
      het onder a bedoelde personeel mag, behalve in verband met zijn werkzaamheden, de inrichting niet in zijn
      werkkleding verlaten.
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel4
  - number: '5'
    text: |-
      Onverminderd het bepaalde in hoofdstuk VII van bijlage I van [richtlijn 64/433/EEG](31964L0433) moet bij het
      slachten het volgende in acht worden genomen:
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel5
  - number: 5.a
    text: |-
      behalve bij varkens, nuchtere kalveren, schapen en geiten moet van alle geslachte dieren de kop van de romp worden
      gescheiden, tenzij de ambtenaar dit niet wenselijk acht;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel5
  - number: 5.b
    text: |-
      melkgevende of kennelijk ziekelijk veranderde uiers moeten zonder voorafgaande verwijdering van de spenen terstond
      na het onthuiden onderscheidenlijk ontharen van de dieren worden gescheiden en in afwachting van de keuring zodanig
      worden opgehangen, dat bezoedeling van het andere vlees niet mogelijk is;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel5
  - number: 5.c
    text: |-
      tongen van runderen worden verzameld overeenkomstig bijlage XI, Hoofdstuk A, punt 6, van [verordening 999/2001/
      EG](32001R0999);
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel5
  - number: 5.d
    text: |-
      kopvlees van runderen ouder dan 12 maanden wordt verzameld overeenkomstig bijlage XI, Hoofdstuk A, punt 7, 9 en 10,
      onderdeel c, van [verordening 999/2001/EG](32001R0999);
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel5
  - number: 5.e
    text: |-
      de Minister is de bevoegde autoriteit tot het verlenen van een erkenning als bedoeld in bijlage XI, hoofdstuk A,
      punt 7 en punt 10, van [verordening 999/2001/EG](32001R0999), welke erkenning wordt aangevraagd bij de VWA.
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel5
  - number: '7.1'
    text: |-
      De eisen, bedoeld in [artikel 68, eerste lid, van de Veewet][ref1], zijn voor wat betreft uit het buitenland
      ingevoerd vlees, dat ter keuring voor uitvoer wordt aangeboden, de volgende:


      [ref1]: https://wetten.overheid.nl/BWBR0001900#Artikel68
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001900
        artikel: '68'
  - number: 7.1.a
    text: het mag geen tekenen van bederf of andere ondeugdelijkheid vertonen;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel7
  - number: 7.1.b
    text: |-
      het moet, voor zover het is ingevoerd uit een ander land dan een lid-staat of Noorwegen, zijn voorzien van één van
      de merken, omschreven in het tweede lid;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel7
  - number: 7.1.c
    text: het moet vergezeld zijn van de documenten onderscheidenlijk het document, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel7
  - number: 7.1.d
    text: |-
      in geval van uitvoer naar meer dan één bestemming moet zijn voldaan aan het bepaalde in artikel 3, tweede lid,
      eerste alinea, van [richtlijn 89/662/EEG](31989L0662).
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel7
  - number: '7.2'
    text: |-
      Het merk, bedoeld in het eerste lid, is het keurmerk, bedoeld in artikel 5, tweede lid, onderdeel f, van het
      koninklijk besluit van 4 maart 1985, houdende regelen met betrekking tot de invoer van vlees uit andere landen dan
      de Lid-Staten van de Europese Gemeenschappen (Stb. 174).
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel7
  - number: '7.3'
    text: 'De documenten onderscheidenlijk het document, bedoeld in het eerste lid, onderdeel c, zijn onderscheidenlijk is:'
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel7
  - number: 7.3.a
    text: voor zover het vlees afkomstig is uit een lid-staat of Noorwegen
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel7
  - number: 7.3.a.1
    text: |-
      een begeleidend handelsdocument als bedoeld in artikel 3, eerste lid, onderdeel A, subonderdeel f, van [richtlijn
      64/433/EEG](31964L0433), met dien verstande dat ook overigens aan dat artikel moet zijn voldaan;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel7
  - number: 7.3.a.2
    text: |-
      een keuringscertificaat overeenkomstig hoofdstuk XIII van bijlage I [richtlijn 64/433/EEG](31964L0433),
      indien het betreft vlees afkomstig uit een slachthuis dat is gelegen in een gebied of een zone waarvoor om
      veterinairrechtelijke redenen beperkingen gelden, dan wel vlees dat voor een lidstaat of Noorwegen is bestemd
      na doorvoer via een derde land, niet zijnde Noorwegen, in een met een loodje verzegelde vrachtwagen, met dien
      verstande dat in afwijking van het voorgaande, voor zover het betreft gehakt, stukken vlees van minder dan 100 gram
      en vleesbereidingen, als document bedoeld in het eerste lid, onderdeel c, wordt vereist het certificaat, bedoeld
      in hoofdstuk XIII van bijlage I van [richtlijn 64/433/EEG](31964L0433), waarop naar gelang de gebruikte vleessoort
      op het certificaat de volgende vermelding moet voorkomen: Ondergetekende, officiële dierenarts, verklaart dat
      het gehakt, het vlees in stukken van minder dan 100 gram en de vleesbereidingen als hierboven vermeld, zijn
      verkregen onder de produktie- en controlevoorwaarden van [richtlijn 88/657/EEG](31988L0657) tot vaststelling
      van de eisen voor de produktie van en het handelsverkeer in gehakt, vlees in stukken van minder dan 100 gram en
      vleesbereidingen en tot wijziging van de [Richtlijnen 64/433/EEG](31964L0433), [71/118/EEG](31971L0118) en [72/462/
      EEG](31972L0462)’.
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel7
  - number: 7.3.b
    text: |-
      voor zover een uit een ander land afkomstige partij vlees is bestemd voor een lidstaat, het Gemeenschappelijk
      veterinair document van binnenkomst, bedoeld in [verordening 136/2004/EG](32004R0136), en een gewaarmerkt afschrift
      als bedoeld in artikel 7, vierde lid, van [richtlijn 97/78/EG](31997L0078);
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel7
  - number: 7.3.c
    text: |-
      voor zover uit een derde land afkomstige partij vlees is bestemd voor een ander derde land, het Gemeenschappelijk
      veterinair document van binnenkomst, bedoeld in [verordening 136/2004/EG](32004R0136), waarin is aangegeven langs
      welke grensinspectiepost, bedoeld in artikel 2, tweede lid, onderdeel g, van [richtlijn 97/78/EG](31997L0078) de
      partij producten de Europese Gemeenschap verlaat.
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel7
  - number: '7.4'
    text: |-
      Onverminderd het derde lid, onderdeel b, en het vierde lid voldoen documenten, bedoeld in
      het derde lid, onderdeel b, in geval van splitsing van een voor een lidstaat bestemde partij
      vlees, op het moment dat de partij een douane-entrepot of een vrij entrepot, bedoeld in
      [artikel 2.23a, tweede lid, van de Regeling keuring en handel dierlijke producten][ref1], verlaat aan artikel 1,
      zesde lid, van beschikking 2000/571/EG.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel2
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006727
        artikel: '2'
  - number: '8'
    text: |-
      Onverminderd het bepaalde in [artikel 7][ref1] moet ten aanzien van ingevoerd vlees, niet in Nederland
      is uitgesneden, het bepaalde in [artikel 3, onderdelen a, c tot en met i, en k][ref2], alsmede het
      bepaalde in [artikel 4][ref3], in acht zijn genomen, terwijl bovendien, voor zover het uitgesneden
      vlees gehakt betreft, vlees in stukken van minder dan 100 gram of vleesbereidingen, het bepaalde in
      [artikel 3, onderdeel l tot en met o][ref4], in acht is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003737#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003737#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003737#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0003737#Artikel3
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003737
        artikel: '7'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003737
        artikel: '3'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003737
        artikel: '4'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0003737
        artikel: '3'
        hoofdstuk: II
  - number: '9.1'
    text: 'De Minister erkent een slachthuis slechts, indien:'
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel9
  - number: 9.1.a
    text: is voldaan aan
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel9
  - number: 9.1.a.1
    text: |-
      de algemene voorwaarden voor de erkenning van inrichtingen van hoofdstuk I van bijlage I van [richtlijn 64/433/EEG]
      (31964L0433) met dien verstande, dat aan de VWA de volgende voorzieningen om niet ter beschikking dienen te worden
      gesteld: '- 1 afsluitbare ruimte met een afsluitbare kast, een bureau, stoelen en een telefoon;'
        - 1 kleedruimt met was- en douchegelegenheid en toilet;
        - en indien tijdens het slachtproces gewoonlijk meer dan 4 keurmeesters werkzaam zijn, 1 verblijfruimte ingericht
      met stoelen, tafels, comfoor en aanrecht, en
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel9
  - number: 9.1.a.2
    text: |-
      de bijzondere voorwaarden gesteld in hoofdstuk II van bijlage I van [richtlijn 64/433/EEG](31964L0433) met dien
      verstande, dat aan de VWA de volgende voorzieningen om niet ter beschikking dienen te worden gesteld indien het
      onderzoek op trichinen in het slachthuis plaatsvindt: een ruimte met een aanrecht, spoelbakken, een werktafel, een
      zuurkast, een kast, stoelen en elektrische aansluitingen;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel9
  - number: 9.1.b
    text: |-
      is gewaarborgd dat overigens de voorschriften van bijlage I van [richtlijn 64/433/EEG](31964L0433), voor zover van
      toepassing, worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel9
  - number: '9.2'
    text: 'De Minister erkent een uitsnijderij slechts, indien:'
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel9
  - number: 9.2.a
    text: is voldaan aan
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel9
  - number: 9.2.a.1
    text: |-
      de algemene voorwaarden voor erkenning van inrichtingen van hoofdstuk I van bijlage I van [richtlijn 64/433/EEG]
      (31964L0433) met dien verstande, dat aan de VWA de volgende voorzieningen om niet ter beschikking dienen te worden
      gesteld: '- indien gewoonlijk 2 uur of meer per dag toezicht wordt uitgeoefend, 1 afsluitbare ruimte die tevens als'
      een kleedruimte dient, een afsluitbare kast, een tafel, stoelen en een telefoon;
        - indien gewoonlijk minder dan 2 uur per dag toezicht wordt uitgeoefend 1 afsluitbare kast en een telefoon; en
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel9
  - number: 9.2.a.2
    text: de bijzondere voorwaarden gesteld in hoofdstuk III van bijlage I van [richtlijn 64/433/EEG](31964L0433);
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel9
  - number: 9.2.b
    text: |-
      is gewaarborgd dat overigens de voorschriften van bijlage I van [richtlijn 64/433/EEG](31964L0433), voor zover van
      toepassing, worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel9
  - number: '9.3'
    text: 'De Minister erkent een koel- of vrieshuis slechts, indien:'
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel9
  - number: 9.3.a
    text: is voldaan aan
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel9
  - number: 9.3.a.1
    text: |-
      de algemene voorwaarden voor erkenning van inrichtingen van hoofdstuk I van bijlage I van [richtlijn 64/433/EEG]
      (31964L0433) met dien verstande, dat daar waar: - gewoonlijk 2 uur of meer per dag toezicht wordt uitgeoefend, 1
      afsluitbare ruimte die tevens als een kleedruimte dient, een afsluitbare kast, een tafel, stoelen en een telefoon;
        - gewoonlijk minder dan 2 uur per dag toezicht wordt uitgeoefend 1 afsluitbare kast en een telefoon; en
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel9
  - number: 9.3.a.2
    text: de bijzondere voorwaarden gesteld in hoofdstuk IV van bijlage I van [richtlijn 64/433/EEG](31964L0433);
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel9
  - number: 9.3.b
    text: |-
      is gewaarborgd dat overigens de voorschriften van bijlage I van [richtlijn 64/433/EEG](31964L0433), voor zover van
      toepassing, worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel9
  - number: '9.4'
    text: 'De Minister erkent een werkplaats, ongeacht of het zelfstandige produktie-eenheid betreft, slechts, indien:'
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel9
  - number: 9.4.a
    text: |-
      voor zover het betreft de produktie van gehakt of vlees in stukken van minder dan 100 gram, voldaan is aan de
      voorwaarden van hoofdstuk I van bijlage I van [richtlijn 88/657/EEG](31988L0657);
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel9
  - number: 9.4.b
    text: |-
      voor zover het betreft de produktie van vleesbereidingen, is voldaan aan de voorwaarden van hoofdstuk I van bijlage
      A van [richtlijn 77/99/EEG](31977L0099);
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel9
  - number: 9.4.c
    text: |-
      is gewaarborgd dat overigens de voorschriften van hoofdstuk I van bijlage I van [richtlijn 88/657/EEG](31988L0657)
      onderscheidenlijk de voorschriften van hoofdstuk I van bijlage A van [richtlijn 77/99/EEG](31977L0099), worden
      nageleefd.
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel9
  - number: '9.5'
    text: De Minister erkent een herverpakkingscentrum slechts, indien
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel9
  - number: 9.5.a
    text: |-
      is voldaan aan de algemene voorwaarden voor de erkenning van inrichtingen van hoofdstuk I van bijlage I van
      [richtlijn 64/433/EEG](31964L0433), en
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel9
  - number: 9.5.b
    text: |-
      is gewaarborgd dat overigens de voorschriften van [bijlage I][ref1], voor zover van toepassing, worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0003737
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003737
  - number: '9.6'
    text: |-
      Onverminderd het bepaalde in de voorgaande leden wordt een slachthuis, uitsnijderij, koel- of vrieshuis, werkplaats
      of herverpakkingscentrum slechts erkend indien:
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel9
  - number: 9.6.b
    text: |-
      de exploitant van de inrichting, de eigenaar of diens vertegenwoordiger een opleidingsprogramma voor het personeel
      opzet, overeenkomstig artikel 10, derde lid, van [richtlijn 64/433/EEG](31964L0433);
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel9
  - number: 9.6.c
    text: |-
      in de werk- en opslagruimten op een voor ieder goed zichtbare plaats een goed leesbare instructie aanwezig is,
      waarin is aangegeven welke hygiënische eisen bij de werkzaamheden in acht moeten worden genomen;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel9
  - number: 9.6.d
    text: |-
      de officiële dierenarts en zijn assistenten, met inachtneming van het bepaalde in artikel 9 en 10, vierde lid,
      van [richtlijn 64/433/EEG](31964L0433), te allen tijde vrije toegang hebben tot alle delen van de desbetreffende
      inrichting, ten einde erop toe te zien dat het bepaalde in deze regeling wordt nageleefd, en, in geval van twijfel
      over de herkomst van het vlees of van de geslachte dieren, tot de boekhoudkundige documenten aan de hand waarvan
      zij het bedrijf van oorsprong van het geslachte dier kunnen opsporen.
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel9
  - number: '9.7'
    text: |-
      Een inrichting die is erkend op grond van het eerste of tweede lid, of op grond van
      [artikel 4.16 van de Regeling keuring en handel dierlijke produkten][ref1] kan tevens worden erkend voor het
      slachten van gekweekt wild onderscheidenlijk voor het uitsnijden van het vlees daarvan, mits wordt voldaan aan
      artikel 14, eerste lid, van [richtlijn 91/495/EEG](31991L0495).


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel4
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006727
        artikel: '4'
  - number: '9.8'
    text: |-
      De erkende slachthuizen, uitsnijderijen, koel- en vrieshuizen en werkplaatsen ontvangen een veterinair
      toelatingsnummer, hetwelk wordt opgenomen in het in [artikel 12, eerste lid][ref1], onderscheidenlijk
      [artikel 12a, derde lid, onderdelen h en i][ref2], bedoelde merk.


      [ref1]: https://wetten.overheid.nl/BWBR0003737#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0003737#Artikel12a
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003737
        artikel: '12'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0003737
        artikel: 12a
        hoofdstuk: VI
  - number: '9.9'
    text: |-
      Indien de officiële dierenarts constateert dat de hygiënische voorschriften niet worden nageleefd of een
      belemmering van de adequate keuring constateert, kan hij de maatregelen nemen, bedoeld in hoofdstuk VIII, punt 41F,
      van bijlage I van [richtlijn 64/433/EEG](31964L0433).
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel9
  - number: '9.10'
    text: |-
      De Minister schort de erkenning van een slachthuis, uitsnijderij, koel- of vrieshuis, werkplaats of
      herverpakkingscentrum met onmiddellijke ingang tijdelijk op, indien de maatregelen, bedoeld in het negende lid,
      onvoldoende zijn gebleken om de tekortkomingen te verhelpen of indien niet wordt voldaan aan de voorschriften,
      bedoeld in de hoofdstukken II tot en met VI van bijlage I van [richtlijn 64/433/EEG](31964L0433).
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel9
  - number: '9.11'
    text: |-
      De Minister trekt de erkenning van een slachthuis, uitsnijderij, koel- of vrieshuis, werkplaats of
      herverpakkingscentrum in, indien:
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel9
  - number: 9.11.a
    text: |-
      het slachthuis, de uitsnijderij, het koel- of vrieshuis, de werkplaats of het herverpakkingscentrum niet voldoet
      aan de voorschriften, bedoeld in de hoofdstukken II tot en met VI van bijlage I van [richtlijn 64/433/EEG]
      (31964L0433), terwijl de exploitant in de gelegenheid is gesteld binnen een bepaalde termijn alsnog aan de eisen te
      voldoen en deze termijn inmiddels is verstreken, dan wel
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel9
  - number: 9.11.b
    text: |-
      na afloop van de schorsing, bedoeld in het tiende lid, blijkt dat het slachthuis, de uitsnijderij, het koel-
      of vrieshuis, de werkplaats of het herverpakkingscentrum nog steeds niet voldoet aan de eisen, bedoeld in de
      hoofdstukken II tot en met VI van bijlage I van [richtlijn 64/433/EEG](31964L0433).
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel9
  - number: 9a.1
    text: |-
      De exploitant, de eigenaar of diens vertegenwoordiger van een op grond van artikel 9 erkend slachthuis, erkende
      uitsnijderij, erkend koel- of vrieshuis, erkende werkplaats of herverpakkinscentrum  verricht de controles,
      bedoeld in artikel 10, tweede lid, van [richtlijn 64/433/EEG](31964L0433), en is desverzocht in staat de officiële
      dierenarts of de veterinaire deskundigen van de Commissie in kennis te stellen van aard, frequentie en resultaat
      van de verrichte controles, alsmede, zo nodig, van de naam van het controlelaboratorium, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel9a
  - number: 9a.1.a
    text: |-
      de exploitant, de eigenaar of diens vertegenwoordiger van een erkend slachthuis, een erkende uitsnijderij of een
      erkend koel- of vrieshuis de algemene hygiëne bij de productie, bedoeld in artikel 10, tweede lid, van [richtlijn
      64/433/EEG](31964L0433), controleert door het uitwerken en toepassen van een permanente procedure overeenkomstig
      artikel 1 van beschikking 2001/471/EG;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel9a
  - number: 9a.1.b
    text: |-
      de exploitant, de eigenaar of diens vertegenwoordiger van een erkend slachthuis of een erkende uitsnijderij de
      microbiologische controles, bedoeld in artikel 10, tweede lid, van [richtlijn 64/433/EEG](31964L0433), uitvoert,
      voorzover van toepassing, overeenkomstig de procedure beschreven in de bijlage bij beschikking 2001/471/EG, dan
      wel overeenkomstig een door de Minister van Landbouw, Natuurbeheer en Visserij en de Minister van Volksgezondheid,
      Welzijn en Sport goedgekeurde procedure, die tenminste gelijkwaardig is aan de in de bijlage bij beschikking
      2001/471/EG beschreven procedure.
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel9a
  - number: 9a.2
    text: |-
      Voor de toepassing van artikel 1, tweede lid, van beschikking 2001/471/EG kan de exploitant, eigenaar of
      vertegenwoordiger gebruik maken van de aanvulling op de hygiënecode voor slachterijen en uitsnijderijen van de
      Productschappen voor Vee, Vlees en Eieren van 17 mei 2002 met de titel 'Uitvoering van de Beschikking 2001/471/EG
      voor slachterijen, uitsnijderijen en koel- en vrieshuizen in de roodvleessector (rund, kalf, varken, paard, schaap
      en geit)'.
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel9a
  - number: '10.1'
    text: |-
      Hij, die voornemens is vee voor uitvoer te slachten of voor uitvoer bestemd vlees uit te snijden, dient de VWA
      de werkdag tevoren tussen 8.15 uur en 17.00 uur te waarschuwen en de door de ambtenaar verlangde medewerking te
      verlenen of te doen verlenen. Met slachten, onderscheidenlijk uitsnijden, mag niet worden begonnen voordat de
      ambtenaar aanwezig is.
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel10
  - number: '10.2'
    text: |-
      De keuring, bedoeld in het eerste lid, geschiedt van maandag tot en met vrijdag, met uitzondering van officieel
      erkende feestdagen en Goede Vrijdag, tussen 6 en 18 uur. De ambtenaar is in bijzondere gevallen bevoegd van het
      vorenstaande af te wijken.
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel10
  - number: '10.3'
    text: |-
      Hij, die voornemens is runderen voor uitvoer te slachten, controleert voordat de keuring, bedoeld in
      het eerste lid, plaatsvindt, overeenkomstig een door de minister goedgekeurd protocol, of de runderen
      overeenkomstig [verordening 1760/2000](32000R1760) zijn geïdentificeerd en geregistreerd, hetgeen
      voor uit Nederland afkomstige runderen betekent dat zij overeenkomstig het bij of krachtens het
      [Besluit identificatie en registratie van dieren][ref1] bepaalde geïdentificeerd zijn met twee bij het rund
      behorende identieke oormerken en dat van de runderen de gegevens, bedoeld in artikel 14, derde lid, onder C,
      onderdeel 1, van [richtlijn 64/432/EEG](31964L0432), volledig in het I&R-systeem rund zijn vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0009019
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009019
  - number: '10.4'
    text: |-
      Indien de ambtenaar redenen heeft om aan te nemen dat de in het derde lid bedoelde controle niet, niet volledig of
      niet overeenkomstig het protocol wordt uitgevoerd, kan hij de maatregelen nemen, bedoeld in hoofdstuk VIII, punt
      41F, van bijlage I van [richtlijn 64/433/EEG](31964L0433).
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel10
  - number: '10.5'
    text: |-
      Indien bij de in het derde lid bedoelde controle blijkt dat runderen niet overeenkomstig [verordening 1760/2000]
      (32000R1760) zijn geïdentificeerd en geregistreerd, wordt hiervan terstond melding gedaan aan de ambtenaar.
      Betrokken runderen worden ten genoegen van de ambtenaar afgezonderd gehouden van de overige runderen in
      het slachthuis. Ten aanzien van deze runderen kan op kosten van de aanbieder een onderzoek plaatsvinden als
      bedoeld in artikelen 2, eerste lid, 3, eerste lid, onderdeel a en b, 6, eerste lid en 14b, eerste lid van het
      Onderzoekingsregulatief 1994.
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel10
  - number: '10.6'
    text: |-
      Runderen waarvan het vlees bestemd is te worden uitgevoerd, worden voor de slachting slechts toegelaten indien
      bij de in het derde lid bedoelde controle is gebleken dat de runderen overeenkomstig [verordening 1760/2000]
      (32000R1760) zijn geïdentificeerd en geregistreerd.
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel10
  - number: '10.7'
    text: |-
      In zoverre in afwijking van het zesde lid, kunnen de in het vijfde lid bedoelde runderen voor de slachting worden
      toegelaten indien:
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel10
  - number: 10.7.a
    text: |-
      voorzover het runderen betreft die zijn geïdentificeerd met één oormerk, bij de in het eerste lid bedoelde keuring
      is gebleken dat dit oormerk bij het rund behoort en dat van deze runderen de gegevens, bedoeld in artikel 14, derde
      lid, onder C, onderdeel 1, van [richtlijn 64/432/EEG](31964L0432), juist en volledig in het I&R-systeem rund zijn
      vermeld;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel10
  - number: 10.7.b
    text: |-
      voorzover het runderen betreft die zijn geïdentificeerd met één of twee oormerken en waarvan uitsluitend de
      gegevens, bedoeld in artikel 14, derde lid, onder C, onderdeel 1, derde en vierde gedachtestreepje van [richtlijn
      64/432/EEG](31964L0432), niet, niet juist of niet volledig in het I&R-systeem rund zijn vermeld, bij de in het
      eerste lid bedoelde keuring is gebleken dat dit onderscheidenlijk deze oormerken bij het rund behoren en nadat deze
      gegevens alsnog op kosten van de aanbieder in het I&R-systeem rund zijn vermeld;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel10
  - number: 10.7.c
    text: |-
      voorzover het na 1 januari 1998 geboren runderen betreft die zijn geidentificeerd met één of twee oormerken en
      waarvan uitsluitend de gegevens, bedoeld in artikel 14, derde lid, onder C, onderdeel 1, vijfde gedachtestreepje
      van [richtlijn 64/432/EEG](31964L0432), niet, niet juist of niet volledig in het I&R-systeem rund zijn vermeld, bij
      de in het eerste lid bedoelde keuring is gebleken dat dit onderscheidenlijk deze oormerken bij het rund behoren en
      ten aanzien van deze runderen een onderzoek als bedoeld in artikel 14b van het Onderzoekingsregulatief 1994 heeft
      plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel10
  - number: 10.7.d
    text: |-
      voorzover het runderen betreft die zijn geïdentificeerd met één of twee oormerken en waarvan uitsluitend de
      gegevens, bedoeld in artikel 14, derde lid, onder C, onderdeel 1, zevende gedachtestreepje van [richtlijn 64/432/
      EEG](31964L0432), niet juist of niet volledig in het I&R-systeem rund zijn vermeld, bij de in het eerste lid
      bedoelde keuring is gebleken dat dit onderscheidenlijk deze oormerken bij het rund behoren, tenzij deze gebreken
      dusdanig van aard zijn dat de ambtenaar niet in staat is de herkomst van het rund vast te stellen in welk geval
      een onderzoek plaatsvindt als bedoeld in artikelen 2, eerste lid, 3, eerste lid, onderdeel a en b, 6, eerste lid en
      14b, eerste lid van het Onderzoekingsregulatief 1994.
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel10
  - number: '10.8'
    text: |-
      Onverminderd het zesde en zevende lid worden kalveren waarvan het vlees bestemd is te worden uitgevoerd, voor
      slachting slechts toegelaten, indien bij de aanbieding ter slachting voor iedere groep van kalveren die van één
      mestbedrijf is aangevoerd een verklaring wordt overgelegd met betrekking tot het aantal dieren dat van die groep
      deel uitmaakt, onder vermelding van de naam en het adres van het bedrijf van herkomst, alsmede een lijst van
      nummers van de merken van alle dieren die van die groep deel uitmaken.
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel10
  - number: '11.1'
    text: |-
      Het merk, bedoeld in [artikel 68, eerste lid, van de Veewet][ref1] is voor vlees afkomstig van in Nederland
      geslacht vee het overeenkomstig het bepaalde in hoofdstuk XI van bijlage I van [richtlijn 64/433/EEG](31964L0433),
      na de keuring na het slachten, bedoeld in [artikel 2, eerste lid, onderdeel d][ref2], aangebrachte merk met dien
      verstande, dat het merk voor vlees als bedoeld in artikel 2, eerste lid, onderdeel g, van deze regeling het merk
      is overeenkomstig het bepaalde in de beschikking van de Commissie van de Europese Gemeenschappen van 3 juli 1984
      tot vaststelling van het speciale merk voor vers vlees als bedoeld in artikel 5, sub a, van [richtlijn 64/433/
      EEG](31964L0433) van de Raad, nr. 84/371/EEG (PbEG L 196), alsmede met dien verstande dat het merk voor gehakt,
      vlees in stukken van minder dan 100 gram en vleesbereidingen, bereid in erkende werkplaatsen, het overeenkomstig
      hoofdstuk VII van bijlage I van [richtlijn 88/657/EEG](31988L0657) aangebrachte merk is.


      [ref1]: https://wetten.overheid.nl/BWBR0001900#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0003737#Artikel2
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001900
        artikel: '68'
      - id: ref2
        bwb_id: BWBR0003737
        artikel: '2'
        hoofdstuk: II
  - number: '11.2'
    text: |-
      Het merk, bedoeld in [artikel 68, eerste lid, van de Veewet][ref1], is voor vlees ingevoerd uit een lid-staat
      of Noorwegen het door die staat overeenkomstig het bepaalde in hoofdstuk XI van bijlage I van [richtlijn 64/433/
      EEG](31964L0433) aangebrachte merk dan wel het overeenkomstig het bepaalde in de beschikking van de Commissie
      van de Europese Gemeenschappen van 3 juli 1984 tot vaststelling van het speciale merk voor vers vlees als bedoeld
      in artikel 5, sub a, van [richtlijn 64/433/EEG](31964L0433) van de Raad, nr. 84/371/EEG, aangebrachte merk, met
      dien verstande dat, wanneer het vlees ten gevolge van het uitsnijden het betreffende merk niet meer draagt, het
      vlees moet zijn gemerkt met een van de in het eerste lid bedoelde merken, alsmede met dien verstande dat het merk
      voor gehakt, vlees in stukken van minder dan 100 gram en vleesbereidingen, bereid in erkende werkplaatsen, het
      overeenkomstig hoofdstuk VII van bijlage I van [richtlijn 88/657/EEG](31988L0657) aangebrachte merk is.


      [ref1]: https://wetten.overheid.nl/BWBR0001900#Artikel68
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001900
        artikel: '68'
  - number: '11.3'
    text: |-
      Het merk, bedoeld in [artikel 68, eerste lid, van de Veewet][ref1], is voor vlees ingevoerd uit een derde
      land, niet zijnde Noorwegen, het merk, bedoeld in [artikel 7, tweede lid][ref2], met dien verstande dat op
      het vlees, wanneer dat ten gevolge van het uitsnijden dat merk niet meer draagt, een merk als bedoeld in
      [artikel 7, tweede lid][ref3], waarop de datum, de maand en het jaar van het uitsnijden zijn vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001900#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0003737#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003737#Artikel7
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001900
        artikel: '68'
      - id: ref2
        bwb_id: BWBR0003737
        artikel: '7'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0003737
        artikel: '7'
        hoofdstuk: III
  - number: '11.4'
    text: |-
      De in het eerste en tweede lid bedoelde merken worden slechts aangebracht op vlees, ten aanzien waarvan is voldaan
      aan het bepaalde bij deze regeling.
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel11
  - number: 11a.1
    text: |-
      Vers vlees afkomstig van varkens wordt voorzien van het in artikel 6, eerste lid, onderdeel b, van [richtlijn
      64/433/EEG](31964L0433) bedoelde merk, tenzij naar het oordeel van de ambtenaar redelijkerwijs kan worden
      aangenomen dat het vlees niet afkomstig is van cryptorchide, hermafrodiete of niet-gecastreerde mannelijke varkens.
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel11a
  - number: 11a.2
    text: |-
      Wanneer vers vlees ten gevolge van het uitsnijden geen merk meer draagt wordt het vlees voorzien van het in artikel
      6, eerste lid, onderdeel b, van [richtlijn 64/433/EEG](31964L0433) bedoelde merk, tenzij naar het oordeel van de
      ambtenaar redelijkerwijs kan worden aangenomen dat het vlees niet afkomstig is van cryptorchide, hermafrodiete of
      niet-gecastreerde mannelijke varkens.
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel11a
  - number: '12.1'
    text: |-
      De in [artikel 11, eerste en tweede lid][ref1], bedoelde merken zijn bij uitvoer naar een lid-staat of Noorwegen
      van vlees, afkomstig van in Nederland geslacht vee, dan wel van vlees, ingevoerd uit een lid-staat of Noorwegen,
      slechts geldig, indien op grond van de regelgeving van de Europese Gemeenschap of de Toezichthoudende Autoriteit
      van de Europese Vrijhandelsassociatie geen verbod geldt om het vlees of de vleesbereidingen uit te voeren en,
      indien de desbetreffende zending gedurende het vervoer vergezeld gaat van het keuringscertificaat onderscheidenlijk
      het handelsdocument, bedoeld in [artikel 7, derde lid, onderdeel a][ref2], overeenkomstig het bepaalde in dat
      artikellid, met dien verstande dat, voor zover het betreft gehakt, vlees in stukken van minder dan 100 gram en
      vleesbereidingen, op dit certificaat, naar gelang van de gebruikte vleessoort, de volgende vermelding voorkomt:
      ‘Ondergetekende, officiële dierenarts, verklaart dat het gehakt, het vlees in stukken van minder dan 100 gram en
      de vleesbereidingen als hierboven vermeld, zijn verkregen onder de produktie- en controlevoorwaarden van [richtlijn
      88/657/EEG](31988L0657) tot vaststelling van de eisen voor de produktie van en het handelsverkeer in gehakt,
      vlees in stukken van minder dan 100 gram en vleesbereidingen en tot wijziging van de [Richtlijnen 64/433/EEG]
      (31964L0433), [71/118/EEG](31971L0118) en [72/462/EEG](31972L0462)’.


      [ref1]: https://wetten.overheid.nl/BWBR0003737#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003737#Artikel7
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003737
        artikel: '11'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0003737
        artikel: '7'
        hoofdstuk: III
  - number: '12.2'
    text: |-
      Het in [artikel 11, derde lid][ref1], bedoelde merk is bij uitvoer van vlees afkomstig uit een derde land slechts
      geldig indien:


      [ref1]: https://wetten.overheid.nl/BWBR0003737#Artikel11
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003737
        artikel: '11'
        hoofdstuk: V
  - number: 12.2.a
    text: |-
      voor zover het vlees bestemd is voor uitvoer naar een lidstaat, de desbetreffende partij vergezeld gaat van de
      documenten, bedoeld in [artikel 7, derde lid, onderdeel b, eerste gedachtenstreepje][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003737#Artikel7
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003737
        artikel: '7'
        hoofdstuk: III
  - number: 12.2.b
    text: 'voor zover het vlees is bestemd voor uitvoer naar een derde land, de partij:'
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12
  - number: 12.2.b.1º
    text: |-
      vergezeld gaat van het document, bedoeld in [artikel 7, derde lid, onderdeel c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003737#Artikel7
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003737
        artikel: '7'
        hoofdstuk: III
  - number: 12.2.b.2º
    text: voldoet aan artikel 11 van [richtlijn 97/78/EG](31997L0078), en
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12
  - number: 12.2.b.3º
    text: voldoet aan artikel 3, tweede lid, tweede alinea, van [richtlijn 89/662/EEG](31989L0662).
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12
  - number: '12.3'
    text: |-
      De documenten, bedoeld in het tweede lid, moeten door de ambtenaar zijn voorzien van een aantekening waaruit
      blijkt, dat het verse vlees door hem is geïdentificeerd en bij de keuring voor uitvoer geen tekenen van bederf of
      andere ondeugdelijkheid vertoonde en moet, voor zover een ingevoerde partij slechts gedeeltelijk wordt uitgevoerd,
      door hem tevens zijn voorzien van een aantekening omtrent de hoeveelheid vers vlees die wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12
  - number: '12.4'
    text: |-
      Tot afgifte van een certificaat onderscheidenlijk een handelsdocument als bedoeld in het eerste lid en tot
      het plaatsen van aantekeningen als bedoeld in het derde lid wordt slechts overgegaan, indien de voor uitvoer
      bestemde zending vers vlees vergezeld gaat van een op de zending betrekking hebbend, door de aanvrager ingevuld
      en ondertekend daartoe beschikbaar gesteld aanvraagformulier. Indien een zending vlees naar een ander bedrijf
      wordt vervoerd, waar deze zending geheel of gedeeltelijk na eventuele be- of verwerking zal worden aangeboden voor
      uitvoercertificering, wordt tot afgifte van een certificaat onderscheidenlijk een handelsdocument als bedoeld in
      het eerste lid en tot het plaatsen van aantekeningen als bedoeld in het derde lid, bovendien slechts overgegaan,
      indien bij aankomst op het bedrijf aan de ambtenaar een op de zending betrekking hebbend geleidebiljet wordt
      overgelegd, dat is afgegeven door de ambtenaar op het bedrijf vanwaar de zending vlees is verzonden.
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12
  - number: '12.5'
    text: |-
      Indien een zending vlees in Nederland in een overeenkomstig [artikel 9][ref1] erkend koel- of vrieshuis is
      opgeslagen, is op de bescheiden waarvan die zending ingevolge het eerste lid vergezeld gaat, het toelatingsnummer,
      bedoeld in [artikel 9, zevende lid][ref2], vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003737#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003737#Artikel9
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003737
        artikel: '9'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0003737
        artikel: '9'
        hoofdstuk: IV
  - number: 12a.1
    text: |-
      Als bewijsstuk, bedoeld in [artikel 68 van de Veewet][ref1] wordt voor vlees van gekweekt wild, tevens zijnde vee
      in de zin van [artikel 66, onderdeel a, van de Veewet][ref2] aangewezen het gezondheidscertificaat, bedoeld in
      bijlage IV van [richtlijn 91/495/EEG](31991L0495).


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0001900#Artikel66
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0006727
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0001900
        artikel: '66'
  - number: 12a.2
    text: |-
      Het vervoer van vlees van gekweekt wild, niet zijnde gekweekt wild als bedoeld in het eerste lid, van enige
      plaats in Nederland naar het grondgebied van en bestemd voor een ander land is slechts toegestaan indien het vlees
      vergezeld gaat van het gezondheidscertificaat, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12a
  - number: 12a.3
    text: 'Een gezondheidscertificaat als bedoeld in het eerste lid wordt slechts afgegeven indien:'
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12a
  - number: 12a.3.a
    text: |-
      het vlees afkomstig is van gekweekt wild dat is geslacht in een erkend slachthuis als bedoeld in
      [artikel 9, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003737#Artikel9
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0003737
        artikel: '9'
        hoofdstuk: IV
  - number: 12a.3.b
    text: |-
      het vlees is uitgesneden of uitgebeend in een overeenkomstig [artikel 9, tweede lid][ref1], erkende uitsnijderij;


      [ref1]: https://wetten.overheid.nl/BWBR0003737#Artikel9
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0003737
        artikel: '9'
        hoofdstuk: IV
  - number: 12a.3.c
    text: |-
      is voldaan aan, voor zover van toepassing: - de eisen, bedoeld in
      [artikel 2, eerste lid, onderdelen b tot en met f en w, tweede gedachtenstreepje][ref1];
        - [artikel 2, tweede lid][ref2], met inachtneming van [artikel 2, derde lid][ref3], en
        - [artikel 3, b tot en met h, en k][ref4]; met uitzondering van de in die artikelen opgenomen eisen ter zake van
      gehakt, stukken vlees van minder dan 100 gram en vleesbereidingen, en met dien verstande dat;
        - in de vorenbedoelde artikelen voor ‘vee’ gelezen wordt ‘gekweekt wild’ en voor ‘vers vlees’ gelezen wordt
      ‘vlees’;
        - in de vorenbedoelde artikelen voor een landbouwhuisdier dat wordt genoemd, of waarnaar wordt verwezen, wordt
      gelezen de daarmee corresponderende, niet-gedomesticeerde diersoort, die als huisdier is gehouden;


      [ref1]: https://wetten.overheid.nl/BWBR0003737#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003737#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003737#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0003737#Artikel3
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0003737
        artikel: '2'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003737
        artikel: '2'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003737
        artikel: '2'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0003737
        artikel: '3'
        hoofdstuk: II
  - number: 12a.3.d
    text: |-
      de dieren waarvan het vlees afkomstig is, op andere tijdstippen worden geslacht dan runderen, varkens, schapen
      en geiten;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12a
  - number: 12a.3.e
    text: ter zake van het vlees geen beperkingen gelden naar aanleiding van een veterinaire keuring;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12a
  - number: 12a.3.f
    text: |-
      voor zover het betreft vlees van gekweekte everzwijnen of van andere voor besmetting met trichinen vatbare
      diersoorten, dit vlees is onderzocht met behulp van een digestiemethode overeenkomstig [richtlijn 77/96/EEG]
      (31977L0096);
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12a
  - number: 12a.3.g
    text: |-
      het niet betreft vlees dat afkomstig is van dieren die zijn besmet met trichinen, of vlees dat overeenkomstig
      artikel 5, eerste lid, onderdeel b tot en met k, van [richtlijn 64/433/EEG](31964L0433) voor menselijke consumptie
      ongeschikt moet worden verklaard;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12a
  - number: 12a.3.h
    text: |-
      het vlees is gemerkt met het keurmerk, bedoeld in hoofdstuk XI van bijlage I van [richtlijn 64/433/EEG]
      (31964L0433);
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12a
  - number: 12a.3.i
    text: |-
      het niet betreft vlees van gekweekt wild dat is ingevoerd uit een derde land, niet zijnde Noorwegen. Dit vlees
      wordt gemerkt met het keurmerk, bedoeld in onderdeel j, waarin de letters ‘EEG’ zijn vervangen door: ‘GOEDGEKEURD’;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12a
  - number: 12a.3.j
    text: |-
      is voldaan aan de eisen van de [artikelen 4][ref1], [5][ref2] en [6][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0003737#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003737#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0003737#Artikel6
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0003737
        artikel: '4'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003737
        artikel: '5'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003737
        artikel: '6'
        hoofdstuk: II
  - number: 12a.3.k
    text: voor zover het separatorvlees van gekweekt wild betreft, het is bestemd voor een derde land.
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12a
  - number: 12a.4
    text: |-
      Ten aanzien van de in het derde lid bedoelde afgifte van een gezondheidscertificaat zijn
      [artikel 10, eerste en tweede lid][ref1], en [artikel 12, vierde lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003737#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003737#Artikel12
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0003737
        artikel: '10'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0003737
        artikel: '12'
        hoofdstuk: V
  - number: 12a.5
    text: |-
      Indien het gekweekte wild niet kan worden vervoerd zonder risico's voor de begeleiders of in verband met het
      welzijn van de dieren kan de Minister, in afwijking in zoverre van de voorgaande leden, toestaan dat dat wild wordt
      geslacht op de plaats van oorsprong, onder de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12a
  - number: 12a.5.a
    text: er wordt voldaan aan de eisen van het derde lid, onderdeel e;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12a
  - number: 12a.5.b
    text: |-
      de eigenaar van de dieren dient een daartoe strekkend verzoek in bij de VWA, onder opgave van het aantal dieren, de
      plaats en de datum waarop de dieren worden geslacht;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12a
  - number: 12a.5.c
    text: |-
      het bedrijf beschikt over een verzamelcentrum voor het gekweekte wild waar het mogelijk is een keuring vóór het
      slachten van de te slachten groep te verrichten;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12a
  - number: 12a.5.d
    text: het bedrijf beschikt over een passende ruimte voor het bedwelmen, het steken en het uitbloeden van de dieren;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12a
  - number: 12a.5.e
    text: |-
      het doden door steken en uitbloeden wordt voorafgegaan door verdoving, overeenkomstig de richtlijn van de Raad
      van de Europese Gemeenschappen van 18 november 1974, nr. 74/577/EEG, betreffende de verdoving van dieren vóór het
      slachten (PbEG L 316); de Minister kan in bijzondere gevallen doden door middel van de kogel toestaan;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12a
  - number: 12a.5.f
    text: |-
      de gedode en uitgebloede dieren worden, onder bevredigende hygiënische omstandigheden, in hangende positie vervoerd
      naar een overeenkomstig artikel 9 erkend slachthuis en zulks zo spoedig mogelijk na het slachten. Wanneer het wild
      dat is gedood op de plaats waar het werd gekweekt, niet binnen een uur naar een overeenkomstig [artikel 9][ref1]
      erkend slachthuis kan worden gebracht, wordt het vervoerd in een container of vervoermiddel waarin een temperatuur
      heerst tussen 0 °C en 4 °C. Het verwijderen van de ingewanden vindt ten laatste drie uur na het bedwelmen
      onderscheidenlijk na het doden door middel van de kogel plaats;


      [ref1]: https://wetten.overheid.nl/BWBR0003737#Artikel9
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0003737
        artikel: '9'
        hoofdstuk: IV
  - number: 12a.5.g
    text: |-
      bij het vervoer naar het slachthuis gaan de dieren vergezeld van een verklaring van de officiële dierenarts waaruit
      blijkt dat de keuring voor het slachten een gunstig resultaat heeft opgeleverd, dat het leegbloeden op correcte
      wijze is geschied en waarin het uur waarop het slachten heeft plaatsgevonden wordt vermeld; deze verklaring stemt
      overeen met het model, bedoeld in bijlage III van [richtlijn 91/495/EEG](31991L0495).
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12a
  - number: 12b.1
    text: |-
      Als bewijsstuk, onderscheidenlijk bewijsstukken, bedoeld in [artikel 68 van de Veewet][ref1], wordt,
      onderscheidenlijk worden voor vlees van gekweekt wild als bedoeld in [artikel 12a, eerste lid][ref2], dat uit het
      buitenland is ingevoerd en ter keuring voor uitvoer wordt aangeboden, aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0001900#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0003737#Artikel12a
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0001900
        artikel: '68'
      - id: ref2
        bwb_id: BWBR0003737
        artikel: 12a
        hoofdstuk: VI
  - number: 12b.1.a
    text: |-
      voor zover het vlees afkomstig is uit een lid-staat of Noorwegen en is bestemd voor een andere lid-staat of
      Noorwegen, het gezondheidscertificaat, bedoeld in bijlage IV van [richtlijn 91/495/EEG](31991L0495);
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12b
  - number: 12b.1.b
    text: |-
      voor zover het vlees afkomstig is uit een derde land en is bestemd voor een lidstaat, het Gemeenschappelijk
      veterinair document van binnenkomst, bedoeld in [verordening 136/2004/EG](32004R0136), en een gewaarmerkt afschrift
      als bedoeld in artikel 7, vierde lid, van [richtlijn 97/78/EG](31997L0078);
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12b
  - number: 12b.1.c
    text: |-
      voor zover uit een derde land afkomstige partij vlees, is bestemd voor een ander derde land, het Gemeenschappelijk
      veterinair document van binnenkomst, bedoeld in [verordening 136/2004/EG](32004R0136), waarin is aangegeven langs
      welke grensinspectiepost, bedoeld in artikel 2, tweede lid, onderdeel g, van [richtlijn 97/78/EG](31997L0078), de
      partij producten de Europese Gemeenschap verlaat.
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12b
  - number: 12b.2
    text: |-
      Het vervoer van vlees van gekweekt wild als bedoeld in [artikel 12a, tweede lid][ref1], dat uit het buitenland
      is ingevoerd en ter keuring wordt aangeboden met het oog op het vervoer in het kader van de uitvoer, van enige
      plaats in Nederland naar het grondgebied van en bestemd voor een ander land is slechts toegestaan, indien het vlees
      vergezeld gaat van:


      [ref1]: https://wetten.overheid.nl/BWBR0003737#Artikel12a
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0003737
        artikel: 12a
        hoofdstuk: VI
  - number: 12b.2.a
    text: |-
      voor zover het vlees afkomstig is uit een lid-staat of Noorwegen en is bestemd voor een andere lid-staat of
      Noorwegen, het certificaat, bedoeld in het eerste lid, onderdeel a;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12b
  - number: 12b.2.b
    text: |-
      voor zover het vlees afkomstig is uit een derde land en is bestemd voor een lid-staat, de onderscheiden documenten,
      bedoeld in het eerste lid, onderdeel b, dan wel,
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12b
  - number: 12b.2.c
    text: |-
      voor zover het vlees afkomstig is uit een derde land en is bestemd voor een ander derde land, het document, bedoeld
      in het eerste lid, onderdeel d.
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12b
  - number: 12c.1
    text: |-
      De documenten, bedoeld in [artikel 12b, eerste en tweede lid][ref1], zijn slechts geldig, onderscheidenlijk worden
      slechts afgegeven indien:


      [ref1]: https://wetten.overheid.nl/BWBR0003737#Artikel12b
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0003737
        artikel: 12b
        hoofdstuk: VI
  - number: 12c.1.a
    text: het vlees geen tekenen van bederf of andere ondeugdelijkheden vertoont;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12c
  - number: 12c.1.b
    text: is voldaan aan, voor zover van toepassing, artikel 3, tweede lid, van [richtlijn 89/662/EEG](31989L0662);
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12c
  - number: 12c.1.c
    text: |-
      voor zover het vlees afkomstig is uit en bestemd is voor een derde land, is voldaan aan artikel 11 van de
      [richtlijn 97/78/EG](31997L0078).;
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12c
  - number: 12c.1.d
    text: |-
      op grond van de regelgeving van de Europese Gemeenschap of de Toezichthoudende Autoriteit van de Europese
      Vrijhandelsassociatie geen verbod geldt om het vlees, voor zover het is bestemd voor een lid-staat of Noorwegen,
      van enige plaats in Nederland naar het grondgebied van die staat te vervoeren.
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12c
  - number: 12c.2
    text: |-
      De documenten, bedoeld in
      [artikel 12b, eerste lid, onderdelen c tot en met f, en tweede lid, onderdelen c tot en met f][ref1], worden door
      de rijkskeurmeester voorzien van een aantekening waaruit blijkt, dat het vlees door hem is geïdentificeerd en
      bij de keuring voor uitvoer geen tekenen van bederf of andere ondeugdelijkheid vertoont en wordt, voor zover een
      ingevoerde partij slechts gedeeltelijk wordt uitgevoerd, door hem tevens voorzien van een aantekening omtrent de
      hoeveelheid vlees die wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003737#Artikel12b
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0003737
        artikel: 12b
        hoofdstuk: VI
  - number: 12c.3
    text: |-
      Met betrekking tot het plaatsen van aantekeningen als bedoeld in het tweede lid is [artikel 12, vierde lid][ref1],
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003737#Artikel12
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0003737
        artikel: '12'
        hoofdstuk: V
  - number: 12d.1
    text: |-
      De [artikelen 7, derde lid, onderdelen b en c][ref1], [12, tweede lid][ref2], en [12c, eerste lid][ref3], zijn
      met inachtneming van artikel 8 van [verordening 136/2004/EG](32004R0136), niet van toepassing op vlees als
      bedoeld in artikel 16, eerste lid, van [richtlijn 97/78/EG](31997L0078), met dien verstande dat onder commerciële
      monsters, bedoeld in artikel 16, eerste lid, onderdeel e, van [richtlijn 97/78/EG](31997L0078) wordt verstaan
      handelsmonsters, bedoeld in [artikel 1.1 eerste lid, van de Regeling keuring en handel dierlijke producten][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003737#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003737#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0003737#Artikel12c
      [ref4]: https://wetten.overheid.nl/BWBR0006727#Artikel1
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12d
    references:
      - id: ref1
        bwb_id: BWBR0003737
        artikel: '7'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003737
        artikel: '12'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0003737
        artikel: 12c
        hoofdstuk: VI
      - id: ref4
        bwb_id: BWBR0006727
        artikel: '1'
  - number: 12d.2
    text: |-
      Voor zover in bepalingen van deze regeling wordt verwezen naar het eerste lid van artikel 3 van [richtlijn 64/433/
      EEG](31964L0433), dan wel een of meer onderdelen van dat artikellid van toepassing worden verklaard, zijn de
      desbetreffende bepalingen met inachtneming van artikel 8 van [verordening 136/2004/EG](32004R0136), niet van
      toepassing in de gevallen, bedoeld in artikel 3, tweede lid, van [richtlijn 64/433/EEG](31964L0433).
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel12d
  - number: '13.1'
    text: De Regeling uitvoer vers vlees 1974 (Stcrt. 1973, 247) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel13
  - number: '13.2'
    text: |-
      Erkenningen verleend op grond van de in het vorige lid genoemde regeling worden, voor zover zij op het tijdstip van
      inwerkingtreding van onderhavige regeling nog van kracht zijn, geacht te zijn verleend op grond van deze regeling.
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel13
  - number: 13a.1
    text: |-
      Een wijziging van een of meer onderdelen van de in deze regeling genoemde richtlijnen treedt voor de toepassing van
      de artikelen uit deze regeling, waarin naar die onderdelen wordt verwezen, in werking met ingang van de dag waarop
      aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel13a
  - number: 13a.2
    text: De Minister doet van een wijzigingsrichtlijn als bedoeld in het eerste lid mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel13a
  - number: 13b
    text: |-
      De Minister kan ontheffing verlenen van het bepaalde in deze regeling. Aan een ontheffing kunnen voorschriften
      worden verbonden. Een ontheffing kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel13b
  - number: 13c
    text: 'Deze regeling is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel13c
  - number: 13c.a
    text: |-
      gehakt, vlees in stukken van minder dan 100 gram en vleesbereidingen als bedoeld in [Richtlijn nr. 88/657/EEG]
      (31988L0657) van de Raad van de Europese Gemeenschappen van 14 december 1988 tot vaststelling van de eisen voor de
      produktie van en het handelsverkeer in gehakt, vlees in stukken van minder dan 100 gram en vleesbereidingen en tot
      wijziging van de [Richtlijnen 64/433/EEG](31964L0433), [71/118/EEG](31971L0118) en [72/462/EEG](31972L0462) (PbEG L
      382), en
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel13c
  - number: 13c.b
    text: |-
      gehakt vlees en vleesbereidingen als bedoeld in [Richtlijn nr. 94/65/EG](31994L0065) van de Raad van
      de Europese Unie van 14 december 1994 tot vaststelling van voorschriften voor de produktie en het in de
      handel brengen van gehakt vlees en vleesbereidingen (PbEG L 368), niet zijnde gehakt vlees als bedoeld in
      [artikel 9.15, tweede lid, van de Regeling keuring en handel dierlijke produkten][ref1] en met inachtneming van,
      voor zover van toepassing, [artikel 9.15, vierde lid][ref2], van laatstgenoemde regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0006727#Artikel9
