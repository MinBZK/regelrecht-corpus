  - number: '14.1'
    text: |-
      Deze regeling wordt in de Nederlandse Staatscourant bekendgemaakt en treedt in werking met ingang van 1 januari
      1985.
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel14
  - number: '14.2'
    text: 'Deze regeling kan worden aangehaald als: Regeling uitvoer vers vlees en vleesbereidingen 1985.'
    url: https://wetten.overheid.nl/BWBR0003737/2005-10-07#Artikel14
