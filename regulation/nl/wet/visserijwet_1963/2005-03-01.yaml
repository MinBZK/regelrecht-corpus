valid_from: '2005-03-01'
bwb_id: BWBR0002416
url: https://wetten.overheid.nl/BWBR0002416/2005-03-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de wetgeving op het gebied van de visserij aan te
    passen aan de gewijzigde omstandigheden;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Voor het bepaalde bij of krachtens deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel1
  - number: 1.1.a
    text: '"Onze Minister": Onze Minister van Landbouw, Natuurbeheer en Visserij;'
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel1
  - number: 1.1.b
    text: |-
      "De Kamer": de Kamer voor de Binnenvisserij bedoeld in [artikel 45][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel45
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '45'
        hoofdstuk: V
        paragraaf: '2'
        afdeling: II
  - number: 1.1.c
    text: |-
      "de rechthebbende op het visrecht": de gerechtigde tot vissen uit welken hoofde ook, behalve de houder
      van een vergunning, als bedoeld in [artikel 7, tweede lid][ref1], of van een vergunning, als bedoeld in
      [artikel 21, tweede lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002416#Artikel21
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '7'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002416
        artikel: '21'
        hoofdstuk: V
        paragraaf: '4'
        afdeling: I
  - number: 1.1.d
    text: |-
      "bedrijfslichamen": lichamen als bedoeld in [artikel 66, vierde lid, van de Wet op de bedrijfsorganisatie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel66
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '66'
  - number: '1.2'
    text: 'Voor het bepaalde bij of krachtens deze wet wordt verstaan onder "vis":'
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel1
  - number: 1.2.a
    text: vissen van de door Onze Minister aangewezen soorten en delen van deze vissen;
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel1
  - number: 1.2.b
    text: |-
      schaal- en schelpdieren van de door Onze Minister aangewezen soorten, delen van deze dieren, alsmede zeesterren en
      zee- of koraalmos;
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel1
  - number: 1.2.c
    text: kuit en broed van de onder *a* bedoelde vissen;
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel1
  - number: 1.2.d
    text: broed en zaad van de onder *b* bedoelde schaal- en schelpdieren.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel1
  - number: '1.3'
    text: 'Voor het bepaalde bij of krachtens deze wet wordt verstaan onder "vissen":'
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel1
  - number: 1.3.a
    text: |-
      het te water brengen, te water hebben, lichten of ophalen van vistuigen alsmede het op enigerlei andere wijze pogen
      om vis uit het water te bemachtigen;
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel1
  - number: 1.3.b
    text: het uitzetten en uitzaaien van vis als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel1
  - number: '1.4'
    text: 'Voor het bepaalde bij of krachtens deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel1
  - number: 1.4.a
    text: |-
      "visserijzone": de zone ingesteld krachtens de [Machtigingswet instelling visserijzone][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003110
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003110
  - number: 1.4.b
    text: |-
      "zeevisserij": het vissen in zee, met inbegrip van het vissen in de visserijzone en in daaraangrenzende, bij
      algemene maatregel van bestuur als zeegebied aangewezen wateren;
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel1
  - number: 1.4.c
    text: '"kustvisserij": het vissen in de bij algemene maatregel van bestuur als kustwater aangewezen wateren;'
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel1
  - number: 1.4.d
    text: '"binnenvisserij": het vissen in de overige wateren van Nederland.'
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel1
  - number: '1.5'
    text: |-
      Voor het bepaalde bij of krachtens deze wet wordt verstaan onder: "hengel": het vistuig bestaande uit een roede -
      al dan niet voorzien van een opwindmechanisme - een lijn of snoer - al dan niet voorzien van één of meer dobbers -
      en ten hoogste drie een-, twee- of drietandige haken. "spieringtuig": het vistuig bestaande uit een roede - al dan
      niet voorzien van een opwindmechanisme - een lijn of snoer - al dan niet voorzien van één of meer dobbers - en ten
      hoogste twaalf al dan niet aan zijlijnen van ten hoogste tien centimeter bevestigde ééntandige haken, waarvan de
      bekopening ten hoogste acht millimeter bedraagt, voorzien van daartoe door Onze Minister aangewezen aas. "peur":
      het vistuig, bestaande uit een al dan niet aan een roede verbonden lijn of snoer zonder haak of haken waaraan een
      hoeveelheid wormen is bevestigd.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel1
  - number: '1.6'
    text: |-
      De in het tweede en vijfde lid bedoelde aanwijzingen geschieden bij in de *Staatscourant* bekend te maken
      ministeriële regelingen.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel1
  - number: '2.1'
    text: |-
      Tot uitvoering van het bepaalde krachtens de [artikelen 3][ref1], [4][ref2], [5][ref3], [9][ref4] en [16][ref5],
      kan bij of krachtens algemene maatregel van bestuur de medewerking worden gevorderd van het bestuur van een
      bedrijfslichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0002416#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0002416#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0002416#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0002416#Artikel16
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: 3a
        hoofdstuk: IIA
      - id: ref2
        bwb_id: BWBR0002416
        artikel: '4'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0002416
        artikel: '5'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0002416
        artikel: '9'
        hoofdstuk: IV
      - id: ref5
        bwb_id: BWBR0002416
        artikel: '16'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: I
  - number: '2.2'
    text: |-
      Indien de van het bestuur van een bedrijfslichaam gevorderde medewerking bestaat in het stellen van nadere regelen
      bij verordening, behoeft zodanige verordening de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel2
  - number: '2.3'
    text: |-
      Krachtens een verordening van een bedrijfslichaam genomen besluiten behoeven, voorzover dit bij of krachtens de
      maatregel als bedoeld in het eerste lid is bepaald, de goedkeuring van de daarbij aangewezen autoriteit.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel2
  - number: '2.4'
    text: |-
      Een verordening, als bedoeld in het tweede lid, is verbindend voor een ieder voor zover daaruit niet het tegendeel
      blijkt.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel2
  - number: '2.5'
    text: |-
      Indien de gevorderde medewerking bestaat in het nemen van besluiten zonder algemene gelding, kunnen deze besluiten
      ten aanzien van een ieder worden genomen.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel2
  - number: 2a.1
    text: |-
      Het is verboden vis van een kleinere afmeting dan bij of krachtens algemene maatregel van bestuur voor die vissoort
      bepaald, voorhanden of in voorraad te hebben, aan te voeren, te vervoeren, te koop aan te bieden, te vervreemden,
      af te leveren, te bewerken of te verwerken.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel2a
  - number: 2a.2
    text: |-
      Het is verboden vis gedurende een bij of krachtens algemene maatregel van bestuur te bepalen tijdvak, dat voor
      verschillende vissoorten verschillend kan worden vastgesteld, voorhanden of in voorraad te hebben, aan te voeren,
      te vervoeren, te koop aan te bieden, te vervreemden, af te leveren, te bewerken of te verwerken.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel2a
  - number: 2a.4
    text: |-
      Het bepaalde bij het eerste en het tweede lid vindt geen toepassing in de bij of krachtens de aldaar bedoelde
      algemene maatregelen van bestuur te bepalen gevallen.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel2a
  - number: 2b.1
    text: |-
      Onze Minister is bevoegd ter voorkoming of bestrijding van ziekte onder de vis, regelen te stellen ten aanzien
      van het uitoefenen van de visserij zomede ten aanzien van het kweken, voorhanden en in voorraad hebben, aanvoeren,
      invoeren, vervoeren, te koop aanbieden, vervreemden, afleveren, bewerken en verwerken van vis.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel2b
  - number: 2b.3
    text: |-
      Voor de toepassing van het eerste lid wordt onder vis mede begrepen de vissen, schaal- en schelpdieren van andere
      dan de overeenkomstig het bepaalde in [artikel 1, tweede lid][ref1], aangewezen soorten.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel1
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 2c.1
    text: Het is verboden vis te bedwelmen, te verwonden of te doden met bij ministeriële regeling aan te wijzen middelen.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel2c
  - number: 2c.2
    text: |-
      Bij algemene maatregel van bestuur kunnen regelen worden gesteld in het belang van het welzijn van de dieren die
      als aas bij het vissen worden gebruikt. Deze regelen kunnen een verbod van het gebruik van dieren als aas bevatten.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel2c
  - number: 2c.3
    text: |-
      Onze Minister kan ontheffing verlenen van het in het eerste lid dan wel een krachtens het tweede lid gestelde
      verbod. Deze ontheffing kan onder beperkingen worden verleend. Hij kan aan zodanige ontheffing voorschriften
      verbinden.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel2c
  - number: '3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regelen gesteld betreffende het registreren van en het
      voeren van lettertekens en nummers door vissersvaartuigen, welke bedrijfsmatig worden gebruikt voor de zeevisserij,
      de kustvisserij, de visserij op het IJsselmeer en andere bij die algemene maatregel van bestuur aan te wijzen
      wateren.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel3
  - number: 3a.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter uitvoering van op grond van internationale
      overeenkomsten of van besluiten van volkenrechtelijke organisaties opgelegde verplichtingen of verleende
      bevoegdheden regelen worden gesteld in het belang van de visserij.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel3a
  - number: 3a.2
    text: |-
      Bij of krachtens een algemene maatregel van bestuur, als bedoeld in het eerste lid, kunnen mede voorschriften
      worden gegeven in het belang van de naleving van de aldaar bedoelde regelen.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel3a
  - number: 3a.3
    text: |-
      De in het tweede lid bedoelde voorschriften kunnen mede inhouden het opleggen van een verplichting aan hen die vis
      van een aanvoerder betrekken en hen, die hun bemiddeling verlenen bij het veilen van vis tot het voeren van een
      administratie en tot het doen van opgave aan een bij die voorschriften aangewezen autoriteit van de hoeveelheden
      vis door hen van een aanvoerder betrokken onderscheidenlijk aan hen ter veiling aangeboden.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel3a
  - number: 3a.4
    text: |-
      De voordracht tot vaststelling, wijziging of intrekking van een algemene maatregel van bestuur, als bedoeld
      in het eerste lid, wordt Ons niet gedaan, dan nadat Onze Minister met de daarbij in belangrijke mate betrokken
      bedrijfslichamen overleg heeft gepleegd.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel3a
  - number: '4.1'
    text: |-
      In het belang van de visserij in de wateren, bedoeld in [artikel 1, vierde lid, onder b][ref1], kunnen bij of
      krachtens algemene maatregel van bestuur regelen worden gesteld, die kunnen strekken tot instandhouding dan wel
      uitbreiding van de visvoorraden in die wateren onderscheidenlijk tot een beperking van de vangstcapaciteit. Bij het
      stellen van zodanige regelen kan mede rekening worden gehouden met de belangen van de natuurbescherming.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel1
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: '4.2'
    text: |-
      Bij of krachtens een algemene maatregel van bestuur, als bedoeld in het eerste lid, kunnen mede voorschriften
      worden gegeven in het belang van de naleving van de aldaar bedoelde regelen.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel4
  - number: '4.3'
    text: |-
      De in het tweede lid bedoelde voorschriften kunnen mede inhouden het opleggen van een verplichting aan hen, die
      vis van een aanvoerder betrekken en hen, die hun bemiddeling verlenen bij het veilen van vis tot het voeren van een
      administratie en tot het doen van opgave aan een bij die voorschriften aangewezen autoriteit van de hoeveelheden
      vis door hen van een aanvoerder betrokken onderscheidenlijk aan hen ter veiling aangeboden.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel4
  - number: '4.4'
    text: |-
      De voordracht tot vaststelling, wijziging of intrekking van een algemene maatregel van bestuur, als bedoeld
      in het eerste lid, wordt Ons niet gedaan, dan nadat Onze Minister met de daarbij in belangrijke mate betrokken
      bedrijfslichamen overleg heeft gepleegd.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel4
  - number: '4.5'
    text: |-
      Een krachtens het eerste lid vastgestelde maatregel wordt, indien deze regelen stelt met betrekking tot beperking
      van de vangstcapaciteit, aan beide Kamers der Staten-Generaal overgelegd. De maatregel kan nadat 30 dagen na
      de overlegging zijn verstreken in werking treden, tenzij binnen die termijn door ten minste een vijfde van het
      grondwettelijk aantal leden van één der Kamers de wens te kennen wordt gegeven dat het in de maatregel te regelen
      onderwerp bij de wet zal worden geregeld. Indien zodanige wens te kennen is gegeven, dienen Wij zo spoedig mogelijk
      een desbetreffend wetsvoorstel in.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel4
  - number: '4.6'
    text: |-
      Onze Minister kan, indien hij overweegt een voordracht te doen tot vaststelling, wijziging of intrekking van een
      maatregel als bedoeld in het vijfde lid en naar zijn oordeel de goede werking van de desbetreffende maatregel
      een onmiddellijke voorziening eist, overeenkomstig de in overweging zijnde maatregel regelen stellen, en in
      het bestaande besluit vervatte regelen buiten werking stellen. Het tweede en derde lid zijn van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel4
  - number: '4.7'
    text: |-
      Een regeling getroffen op grond van het zesde lid blijft, behoudens eerdere intrekking, van kracht totdat de in
      het vijfde lid bedoelde maatregel in werking treedt, doch uiterlijk tot acht maanden na de inwerkingtreding van de
      regeling. In het geval dat ingevolge het bepaalde in het vijfde lid, het in de maatregel te regelen onderwerp bij
      de wet wordt geregeld, blijft de regeling van kracht totdat de wet in werking treedt danwel totdat het voorstel van
      wet wordt ingetrokken of een van beide kamers tot niet-aanneming daarvan besluit.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel4
  - number: '5.1'
    text: |-
      Het is verboden met vreemde vissersvaartuigen de visserij uit te oefenen in de wateren, gelegen binnen de
      visserijzone.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel5
  - number: '5.2'
    text: |-
      Het verbod geldt niet indien en voor zover zulks bij algemene maatregel van bestuur wordt bepaald dan wel uit
      internationale overeenkomsten of besluiten van volkenrechtelijke organisaties voortvloeit.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel5
  - number: '7.1'
    text: |-
      Het is verboden in een water, als bedoeld in [artikel 1, vierde lid, onder ][ref1], te vissen voor zover een ander
      rechthebbende is op het visrecht van dat water.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel1
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: '7.2'
    text: 'Het verbod van het eerste lid geldt niet:'
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel7
  - number: 7.2.a
    text: |-
      voor hem, die voorzien is van een schriftelijke vergunning van de rechthebbende, geldende voor de visserij, welke
      wordt uitgeoefend;
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel7
  - number: 7.2.b
    text: |-
      voor hem, die de rechthebbende op het visrecht of de houder der vergunning behulpzaam is bij het vissen met een
      vistuig, dat niet door één persoon kan worden bediend;
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel7
  - number: 7.2.c
    text: |-
      indien en voor zover het Rijk de rechthebbende op het visrecht is, behoudens in de gevallen bij algemene maatregel
      van bestuur bepaald;
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel7
  - number: 7.2.d
    text: voor hem, die vist met ten hoogste twee hengels.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel7
  - number: '8.1'
    text: |-
      Voor de geldigheid van een vergunning, als bedoeld in [artikel 7][ref1], is vereist, dat deze in duidelijk leesbaar
      en niet door vegen uit te wissen schrift ten minste vermeldt: de naam, de voorletters en de woonplaats van de
      rechthebbende op het visrecht en van de houder, de geboortedatum van de houder, de omschrijving van het water en de
      visserij, waarvoor zij geldt, de dagtekening en de geldigheidsduur.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel7
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '7'
        hoofdstuk: IV
  - number: '8.2'
    text: |-
      De geldigheidsduur van een vergunning eindigt in ieder geval na verloop van drie jaren na de dagtekening der
      vergunning.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel8
  - number: '9.1'
    text: |-
      In het belang van de visserij in de wateren, bedoeld in [artikel 1, vierde lid, onder ][ref1], kunnen bij of
      krachtens algemene maatregel van bestuur regelen worden gesteld, die kunnen strekken tot instandhouding dan wel
      uitbreiding van de visvoorraden in die wateren onderscheidenlijk tot een beperking van de vangstcapaciteit.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel1
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: '9.2'
    text: |-
      Bij het stellen van regelen als bedoeld in het eerste lid, wordt mede rekening gehouden met de belangen van de
      natuurbescherming.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel9
  - number: '9.3'
    text: |-
      Bij of krachtens een algemene maatregel van bestuur, als bedoeld in het eerste lid, kunnen mede voorschriften
      worden gegeven in het belang van de naleving van de aldaar bedoelde regelen.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel9
  - number: '9.4'
    text: |-
      De in het derde lid bedoelde voorschriften kunnen mede inhouden het opleggen van een verplichting aan hen, die vis
      van een aanvoerder betrekken en hen, die hun bemiddeling verlenen bij het veilen van vis tot het voeren van een
      administratie en tot het doen van opgave aan een bij die voorschriften aangewezen autoriteit van de hoeveelheden
      vis door hen van een aanvoerder betrokken onderscheidenlijk aan hen ter veiling aangeboden.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel9
  - number: '9.5'
    text: |-
      De voordracht tot vaststelling, wijziging of intrekking van een algemene maatregel van bestuur, als bedoeld
      in het eerste lid, wordt Ons niet gedaan, dan nadat Onze Minister met de daarbij in belangrijke mate betrokken
      bedrijfslichamen, zomede met naar het oordeel van Onze Minister daarvoor in aanmerking komende organisaties van
      sportvissers overleg heeft gepleegd.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel9
  - number: '9.6'
    text: |-
      Een krachtens het eerste lid vastgestelde maatregel wordt, indien deze regelen stelt met betrekking tot beperking
      van de vangstcapaciteit, aan beide Kamers der Staten-Generaal overgelegd. De maatregel kan nadat 30 dagen na
      de overlegging zijn verstreken in werking treden, tenzij binnen die termijn door ten minste een vijfde van het
      grondwettelijk aantal leden van één der Kamers de wens te kennen wordt gegeven dat het in de maatregel te regelen
      onderwerp bij de wet zal worden geregeld. Indien zodanige wens te kennen is gegeven, dienen Wij zo spoedig mogelijk
      een desbetreffend wetsvoorstel in.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel9
  - number: '9.7'
    text: |-
      Onze Minister kan, indien hij overweegt een voordracht te doen tot vaststelling, wijziging of intrekking van een
      maatregel als bedoeld in het vijfde lid en naar zijn oordeel de goede werking van de desbetreffende maatregel
      een onmiddellijke voorziening eist, overeenkomstig de in overweging zijnde maatregel regelen stellen, en in
      het bestaande besluit vervatte regelen buiten werking stellen. Het tweede en derde lid zijn van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel9
  - number: '9.8'
    text: |-
      Een regeling getroffen op grond van het zesde lid blijft, behoudens eerdere intrekking, van kracht totdat de in
      het vijfde lid bedoelde maatregel in werking treedt, doch uiterlijk tot acht maanden na de inwerkingtreding van de
      regeling. In het geval dat ingevolge het bepaalde in het vijfde lid, het in de maatregel te regelen onderwerp bij
      de wet wordt geregeld, blijft de regeling van kracht totdat de wet in werking treedt danwel totdat het voorstel van
      wet wordt ingetrokken of een van beide kamers tot niet-aanneming daarvan besluit.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel9
  - number: '10.1'
    text: Het is verboden de binnenvisserij uit te oefenen zonder een geldige akte te kunnen tonen.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel10
  - number: '10.2'
    text: 'Op de voet van het bepaalde in de volgende leden worden de navolgende akten uitgereikt:'
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel10
  - number: 10.2.a
    text: sportvisakten, welke geldig zijn tot het vissen hetzij met ten hoogste twee hengels, hetzij met één peur;
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel10
  - number: 10.2.b
    text: |-
      grote visakten, welke geldig zijn tot het vissen met alle vistuigen, voorzover het gebruik daarvan niet krachtens
      deze wet is verboden.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel10
  - number: '10.3'
    text: |-
      Geen akte wordt uitgereikt aan hem, wie ingevolge [artikel 57][ref1] de bevoegdheid om krachtens een akte te vissen
      is ontzegd, zolang de ontzegging duurt.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel57
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '57'
        hoofdstuk: VI
  - number: '10.4'
    text: |-
      De akten worden uitgegeven door de Organisatie ter verbetering van de binnenvisserij en zijn geldig voor de duur
      van één kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel10
  - number: '10.5'
    text: |-
      De akten worden uitgereikt tegen betaling van een geldsom waarvan de hoogte jaarlijks door Onze Minister wordt
      vastgesteld. Deze geldsom omvat een bijdrage ter verbetering van de binnenvisserij en een bijdrage verband houdende
      met de kosten van de uitgifte van de akten. De hoogte van de geldsom kan verschillend worden vastgesteld naar
      gelang de onderscheiden akten.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel10
  - number: '10.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld verband houdende met de
      vaststelling en uitreiking van de akten alsmede met de besteding van de ontvangen bijdragen of een deel daarvan.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel10
  - number: '10.7'
    text: 'Het verbod van het eerste lid geldt niet:'
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel10
  - number: 10.7.a
    text: |-
      voorzover het betreft het vissen met niet meer dan één hengel geaasd met door Onze Minister aangewezen aas door
      personen, die de leeftijd van vijftien jaren nog niet hebben bereikt;
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel10
  - number: 10.7.b
    text: |-
      voor hem, die bij ziekte van de houder van een grote visakte deze vervangt, mits hij de akte van de houder bij
      zich heeft;
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel10
  - number: 10.7.c
    text: |-
      voor hem, die in dienst van de houder van een grote visakte de visserij uitoefent in gezelschap van de houder of
      diens plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel10
  - number: '10.8'
    text: |-
      De in het vorige lid onder *b* bedoelde vrijstelling geldt niet voor hem, wie ingevolge [artikel 57][ref1] de
      bevoegdheid om krachtens een akte te vissen is ontzegd, voor de duur der ontzegging.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel57
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '57'
        hoofdstuk: VI
  - number: '10.9'
    text: |-
      Het verbod van het eerste lid geldt niet voor het vissen in een binnen een afgesloten erf gelegen viswater, dat
      geen voor het doorlaten van vis geschikte verbinding met andere wateren bezit.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel10
  - number: '10.10'
    text: |-
      Onze Minister kan van het verbod van het eerste lid ontheffing verlenen voor het vissen in een viskwekerij en voor
      wetenschappelijke doeleinden. De ontheffing kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel10
  - number: '10.11'
    text: |-
      In het geval de Organisatie ter verbetering van de binnenvisserij geen of geen behoorlijke uitvoering geeft aan
      haar taak, bedoeld in het vierde lid, kan Onze Minister in die uitvoering voorzien.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel10
  - number: '16.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van het vissen in de wateren, bedoeld in
      [artikel 1, vierde lid, onderdeel d][ref1], regelen worden gesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel1
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 16.1.a
    text: in het belang van de visserij in die wateren, de doelmatigheid daaronder begrepen, of
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel16
  - number: 16.1.b
    text: |-
      ter voorkoming van schade voor de volksgezondheid bij consumptie van de in die wateren voorkomende vis als gevolg
      van het gebruik van bepaalde vang- of lokmethoden.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel16
  - number: '16.2'
    text: 'Bij het stellen van regelen als bedoeld in het eerste lid wordt mede rekening gehouden met:'
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel16
  - number: 16.2.a
    text: de belangen van de natuurbescherming, en
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel16
  - number: 16.2.b
    text: |-
      de invloed van het gebruik van bepaalde vang- of lokmethoden op het welzijn van de in de in het eerste lid bedoelde
      wateren voorkomende vis.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel16
  - number: '16.3'
    text: |-
      Bij of krachtens een maatregel als bedoeld in het eerste lid kunnen mede voorschriften worden gegeven in het belang
      van de naleving van de aldaar bedoelde regelen.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel16
  - number: '17.1'
    text: |-
      Het is verboden zonder vergunning van Onze Minister vissen van andere dan de
      krachtens [artikel 1, tweede lid][ref1], aangewezen soorten uit te zetten in de in
      [artikel 1, vierde lid, onderdeel d][ref2], bedoelde wateren, met uitzondering van de wateren, bedoeld in
      [artikel 10, negende lid][ref3]. Bij een beslissing omtrent het verlenen van een vergunning wordt rekening gehouden
      met de belangen van de natuurbescherming en met het welzijn van vissen.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002416#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002416#Artikel10
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002416
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0002416
        artikel: '10'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: I
  - number: '17.2'
    text: |-
      Onze Minister kan aan een vergunning als bedoeld in het eerste lid voorschriften verbinden. De vergunning kan onder
      beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel17
  - number: '17.3'
    text: |-
      Het is verboden in een water, op het visrecht waarvan een ander de rechthebbende is, vis uit te zetten, zonder in
      het bezit te zijn van een vergunning van de rechthebbende. Voor de toepassing van dit lid worden onder vis mede
      begrepen vissen van andere dan de overeenkomstig het bepaalde in [artikel 1, tweede lid][ref1], aangewezen soorten.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel1
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: '17.4'
    text: |-
      Voor de geldigheid van een vergunning als bedoeld in het derde lid is vereist dat deze in duidelijk leesbaar en
      niet uit te wissen schrift ten minste vermeldt: de naam, de voorletters en de woonplaats van de rechthebbende
      op het visrecht en van de houder, de geboortedatum van de houder, de omschrijving van het water en de vissoort
      waarvoor zij geldt en de dagtekening.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel17
  - number: '21.1'
    text: |-
      Het is verboden in een water, als bedoeld in [artikel 1, vierde lid, onder ][ref1], te vissen voorzover een ander
      rechthebbende is op het visrecht van dat water.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel1
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: '21.2'
    text: 'Het verbod in het eerste lid geldt niet:'
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel21
  - number: 21.2.a
    text: |-
      voor hem, die voorzien is van een schriftelijke vergunning van de rechthebbende, geldende voor de visserij, welke
      wordt uitgeoefend;
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel21
  - number: 21.2.b
    text: |-
      voor hem die de rechthebbende op het visrecht of de houder van de vergunning behulpzaam is bij het vissen met een
      vistuig, dat niet door één persoon kan worden bediend;
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel21
  - number: 21.2.c
    text: |-
      voor het vissen met niet meer dan één hengel, geaasd met door Onze Minister ingevolge
      [artikel 10, zevende lid, onder ][ref1], aangewezen aas, in openbare vaarwateren voor zover deze niet in het belang
      van een doelmatige bevissing bij ministeriële regeling zijn uitgezonderd, zomede in andere wateren, voor zover deze
      op verzoek van de eigenaren van de grond daaronder bij ministeriële regeling zijn aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel10
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '10'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: I
  - number: 21.2.d
    text: |-
      voor het vissen in een viswater, als bedoeld in [artikel 10, negende lid][ref1], dan wel in een viskwekerij, ten
      aanzien waarvan een ontheffing is verleend, als bedoeld in het tiende lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel10
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '10'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: I
  - number: '22.1'
    text: |-
      Vergunningen, als bedoeld in [artikel 21][ref1], mogen slechts worden verleend met toestemming van de Kamer.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel21
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '21'
        hoofdstuk: V
        paragraaf: '4'
        afdeling: I
  - number: '22.2'
    text: |-
      Indien een doelmatig bevissen van het water, waarop de aanvrage tot het verkrijgen van toestemming betrekking
      heeft, dan wel van het complex van wateren, waartoe dat water behoort, door de voorgenomen uitreiking van
      vergunningen zou worden belemmerd, wijst de Kamer de aanvrage af, dan wel verbindt zij aan de toestemming
      voorschriften, met dien verstande dat deze voorschriften slechts kunnen betreffen het aantal vergunningen, dat ten
      hoogste mag worden uitgereikt, de aard van het vistuig, voor het gebruik waarvan uitsluitend vergunning mag worden
      verleend en de geldigheidsduur der vergunningen.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel22
  - number: '22.3'
    text: |-
      De Kamer kan aan de toestemming voorschriften verbinden ter verzekering van de bij de voorgenomen uitreiking
      betrokken belangen van derden.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel22
  - number: '22.4'
    text: De Kamer kan de geldigheid van de toestemming tot een door haar te bepalen tijdvak beperken.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel22
  - number: '22.5'
    text: |-
      De Kamer kan aan de toestemming voorschriften verbinden betreffende de voor het genot der vergunningen ten hoogste
      te berekenen vergoedingen.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel22
  - number: '22.6'
    text: 'Het bepaalde in het eerste lid vindt geen toepassing ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel22
  - number: 22.6.a
    text: het verlenen van vergunningen voor het vissen met ten hoogste twee hengels;
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel22
  - number: 22.6.b
    text: |-
      het verlenen van vergunningen voor het vissen in het IJsselmeer en andere bij ministeriële regeling aan te wijzen
      wateren of complexen van wateren;
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel22
  - number: 22.6.c
    text: |-
      het verlenen van vergunningen door een op grond van [artikel 35][ref1] door Onze Minister aangewezen openbaar
      lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel35
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '35'
        hoofdstuk: V
        paragraaf: '5'
        afdeling: I
  - number: '23.1'
    text: 'Voor de geldigheid van een vergunning is vereist:'
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel23
  - number: 23.1.a
    text: |-
      dat deze in duidelijk leesbaar en niet uit te wissen schrift ten minste vermeldt: de naam, de voorletters en de
      woonplaats van de rechthebbende op het visrecht en van de houder, de geboortedatum van de houder, de omschrijving
      van het water en de visserij waarvoor zij geldt, de dagtekening, de geldigheidsduur en de voor het genot der
      vergunning berekende vergoeding;
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel23
  - number: 23.1.b
    text: dat het stuk, waarop de vergunning is gesteld, door of vanwege de Kamer is gewaarmerkt.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel23
  - number: '23.2'
    text: 'Het bepaalde in het eerste lid, aanhef en onder *b*, geldt niet:'
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel23
  - number: 23.2.a
    text: |-
      voor vergunningen, welke ingevolge het bepaalde in [artikel 22, zesde lid][ref1], zonder toestemming van de Kamer
      mogen worden verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel22
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '22'
        hoofdstuk: V
        paragraaf: '4'
        afdeling: I
  - number: 23.2.b
    text: voor vergunningen uitgereikt door openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel23
  - number: '23.3'
    text: 'De waarmerking, bedoeld in het eerste lid, wordt slechts geweigerd:'
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel23
  - number: 23.3.a
    text: |-
      indien geen toestemming tot uitreiking der vergunning is verleend dan wel het tijdvak tot hetwelk de geldigheid van
      de toestemming is beperkt, is verstreken;
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel23
  - number: 23.3.b
    text: indien het verlenen van de vergunning in strijd is met de aan de toestemming verbonden voorschriften;
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel23
  - number: 23.3.c
    text: |-
      indien een of meer der in het eerste lid, onder *a*, bedoelde gegevens, met uitzondering van de gegevens
      betreffende de houder en de dagtekening der vergunning, ontbreken.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel23
  - number: '23.4'
    text: |-
      De geldigheidsduur van een vergunning eindigt in ieder geval na verloop van drie jaren na de dagtekening der
      vergunning.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel23
  - number: '24'
    text: |-
      De bepalingen van deze paragraaf gelden niet voor de visserij in het IJsselmeer, in wateren als bedoeld in
      [artikel 21, tweede lid, onderdeel ][ref1] en in andere bij ministeriële regeling aan te wijzen wateren of
      complexen van wateren.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel21
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '21'
        hoofdstuk: V
        paragraaf: '4'
        afdeling: I
  - number: '25.1'
    text: |-
      Elke overeenkomst van huur en verhuur van visrecht van enig water, zomede elke overeenkomst tot wijziging of
      aanvulling van zodanige overeenkomst, moet schriftelijk worden aangegaan.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel25
  - number: '25.2'
    text: |-
      Indien de overeenkomst niet schriftelijk is aangegaan, kan de meest gerede partij bij de kantonrechter van de
      rechtbank van het arrondissement waarin het viswater of het grootste gedeelte daarvan gelegen is, de schriftelijke
      vastlegging daarvan vorderen.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel25
  - number: '25.3'
    text: Tegen het vonnis van de kantonrechter staat geen hogere voorziening open.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel25
  - number: '25.4'
    text: |-
      De griffier van de rechtbank zendt binnen veertien dagen na de uitspraak, waarbij de overeenkomst schriftelijk is
      vastgelegd, drie gewaarmerkte afschriften van het vonnis aan de Kamer.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel25
  - number: '26.1'
    text: |-
      Overeenkomsten, als bedoeld in het vorige artikel, met inbegrip van die, welke ingevolge het bepaalde in het tweede
      lid van dat artikel schriftelijk zijn vastgelegd, behoeven de goedkeuring van de Kamer.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel26
  - number: '26.2'
    text: |-
      Het bepaalde in het vorige lid geldt niet voor overeenkomsten, welke zijn aangegaan door een op grond van
      [artikel 35][ref1] door Onze Minister aangewezen openbaar lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel35
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '35'
        hoofdstuk: V
        paragraaf: '5'
        afdeling: I
  - number: '27'
    text: |-
      Het is de huurder van visrecht verboden de visserij uit te oefenen in het water, waarvan hij visrecht heeft
      gehuurd, zonder te zijn voorzien van een schriftelijke overeenkomst van huur en verhuur van dat visrecht welke in
      de gevallen, waarin ingevolge deze wet de goedkeuring is vereist, door de Kamer is goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel27
  - number: '28.1'
    text: De overeenkomst van huur en verhuur van visrecht geldt voor de tijd van zes jaren.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel28
  - number: '28.2'
    text: |-
      Een huurovereenkomst kan in bijzondere omstandigheden voor een langere of kortere duur worden aangegaan, mits een
      bepaalde datum van beëindiging is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel28
  - number: '29.1'
    text: 'De Kamer keurt de overeenkomst van huur en verhuur van visrecht goed, tenzij:'
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel29
  - number: 29.1.a
    text: |-
      een doelmatig bevissen van het water, waarop de overeenkomst betrekking heeft, dan wel van het complex van wateren,
      waartoe dat water behoort, door de overeenkomst zou worden belemmerd;
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel29
  - number: 29.1.b
    text: |-
      de overeenkomst in strijd is met het bepaalde bij een ministeriële regeling, als bedoeld in [artikel 35][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel35
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '35'
        hoofdstuk: V
        paragraaf: '5'
        afdeling: I
  - number: 29.1.c
    text: de prestaties, waartoe partijen zich hebben verbonden kennelijk onevenredig zijn;
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel29
  - number: 29.1.d
    text: |-
      de overeenkomst is aangegaan voor onbepaalde tijd dan wel is aangegaan voor een langere of kortere duur dan 6 jaren
      zonder dat bijzondere omstandigheden zulks rechtvaardigen.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel29
  - number: '29.2'
    text: |-
      De Kamer kan aan een goedkeuring voorschriften verbinden ter verzekering van de bij de uitoefening van het visrecht
      betrokken belangen van derden.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel29
  - number: '29.3'
    text: |-
      Voor de geldigheid van bepalingen, welke in strijd met de wet zijn, kan op de goedkeuring van de overeenkomst door
      de Kamer geen beroep worden gedaan.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel29
  - number: '29.4'
    text: |-
      Het in de voorgaande leden bepaalde vindt overeenkomstige toepassing ten aanzien van de overeenkomst tot wijziging
      of aanvulling van een overeenkomst van huur en verhuur van visrecht.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel29
  - number: '30.1'
    text: |-
      Indien de Kamer haar goedkeuring aan een overeenkomst van huur en verhuur van visrecht of aan een overeenkomst tot
      wijziging of aanvulling van zodanige overeenkomst zou moeten onthouden, wijzigt zij de overeenkomst op het punt
      of de punten, welke in verband met het bepaalde in [artikel 29, eerste lid][ref1], de goedkeuring verhinderen of
      verklaart zij haar nietig. Uit een door de Kamer op de overeenkomst geplaatste aantekening moet blijken, dat de
      overeenkomst door de Kamer is gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel29
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '29'
        hoofdstuk: V
        paragraaf: '5'
        afdeling: I
  - number: '30.2'
    text: |-
      De door de Kamer gewijzigde overeenkomst geldt als een tussen partijen aangegane en goedgekeurde overeenkomst. In
      geval van wijziging alsmede in geval van nietigverklaring regelt de Kamer zo nodig de gevolgen.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel30
  - number: '31.1'
    text: |-
      Zij die voornemens zijn met elkaar een overeenkomst van huur en verhuur van visrecht dan wel een overeenkomst
      tot wijziging of aanvulling van zodanige overeenkomst aan te gaan, zijn bevoegd een ontwerp-overeenkomst ter
      goedkeuring aan de Kamer in te zenden.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel31
  - number: '31.2'
    text: |-
      De Kamer beoordeelt de ontwerp-overeenkomst met toepassing van [artikel 29, eerste lid][ref1]; zij kan haar
      goedkeuring afhankelijk stellen van wijzigingen, welke zij in verband met het bepaalde in dat artikel nodig
      oordeelt.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel29
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '29'
        hoofdstuk: V
        paragraaf: '5'
        afdeling: I
  - number: '31.3'
    text: |-
      Indien binnen twee maanden, nadat de Kamer een ontwerp-overeenkomst heeft goedgekeurd, een overeenkomst wordt
      ingezonden, welke gelijk is aan de ontwerp-overeenkomst, zoals deze werd goedgekeurd, is de Kamer tot goedkeuring
      gehouden.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel31
  - number: '31.4'
    text: |-
      Op het verzoek tot goedkeuring van het ontwerp van een overeenkomst van huur en verhuur van visrecht kan niet meer
      worden beslist nadat de daarin als huurder genoemde persoon als zodanig op het viswater is toegelaten.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel31
  - number: '32.1'
    text: |-
      Het is verboden in verband met een overeenkomst van huur en verhuur van visrecht enig ander voordeel te bedingen of
      aan te nemen dan in de door de Kamer goedgekeurde overeenkomst is opgenomen.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel32
  - number: '32.2'
    text: |-
      Indien enig ander voordeel is aangenomen dan in de door de Kamer goedgekeurde overeenkomst is opgenomen, behoudt de
      goedgekeurde overeenkomst haar rechtskracht.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel32
  - number: '33.1'
    text: |-
      Een overeenkomst van huur en verhuur van visrecht, voor zover aangegaan voor een periode van zes jaren, wordt van
      rechtswege verlengd voor een gelijke periode, tenzij:
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel33
  - number: 33.1.a
    text: |-
      de verhuurder uiterlijk acht maanden voor het eind van de lopende overeenkomst aan de huurder een nieuwe
      overeenkomst van huur en verhuur van visrecht heeft aangeboden of aan hem schriftelijk te kennen heeft gegeven de
      overeenkomst van huur en verhuur van het visrecht niet te willen voortzetten, of
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel33
  - number: 33.1.b
    text: |-
      de huurder, indien door de verhuurder geen toepassing is gegeven aan onderdeel a, voor het einde van de lopende
      overeenkomst aan de verhuurder schriftelijk te kennen heeft gegeven de overeenkomst van huur en verhuur van het
      visrecht niet te willen voortzetten.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel33
  - number: '33.2'
    text: |-
      Tenzij de overeenkomst van huur en verhuur van het visrecht is aangegaan voor een jaar of een periode korter dan
      een jaar, kan de huurder de Kamer verzoeken de lopende overeenkomst te verlengen:
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel33
  - number: 33.2.a
    text: indien de verhuurder hem een nieuwe overeenkomst heeft aangeboden waarmee hij zich niet kan verenigen;
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel33
  - number: 33.2.b
    text: indien de verhuurder hem te kennen heeft gegeven de overeenkomst niet te willen voortzetten, of
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel33
  - number: 33.2.c
    text: in het geval die overeenkomst is aangegaan voor een andere tijdsduur dan zes jaren.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel33
  - number: '33.3'
    text: |-
      Een verzoek als bedoeld in het tweede lid kan worden beperkt tot een gedeelte van het visrecht, waarop de
      overeenkomst betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel33
  - number: '33.4'
    text: De Kamer beslist naar billijkheid, evenwel met inachtneming van het bepaalde in de volgende leden.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel33
  - number: '33.5'
    text: |-
      De Kamer wijst het verzoek in ieder geval af indien de verhuurder de overeenkomst niet wil voortzetten wegens de
      omstandigheid dat de huurder voor het einde van de lopende overeenkomst de leeftijd van vijfenzestig jaar heeft
      bereikt of zal bereiken.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel33
  - number: '33.6'
    text: |-
      Indien een doelmatige bevissing van het water, waarop de overeenkomst betrekking heeft dan wel van het complex van
      wateren, waartoe dat water behoort, door de toewijzing van het verzoek zou worden belemmerd, wijst de Kamer het
      verzoek af dan wel beperkt zij de verlenging tot een gedeelte van het visrecht.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel33
  - number: '33.7'
    text: |-
      Indien en voor zover de Kamer het verzoek toewijst, stelt zij de duur vast voor welke de verlenging zal gelden en
      welke ten hoogste zes jaren zal bedragen.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel33
  - number: '33.8'
    text: |-
      Ingeval de verlenging tot een gedeelte van het visrecht wordt beperkt, stelt de Kamer de prestatie van de huurder
      vast.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel33
  - number: '33.9'
    text: |-
      Indien de Kamer een niet overeenkomstig het bepaalde in het derde lid beperkt verzoek tot verlenging toewijst, kan
      zij, indien daartoe naar haar oordeel aanleiding bestaat, de prestatie van de huurder herzien.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel33
  - number: '33.10'
    text: |-
      Indien de Kamer het verzoek geheel of onder beperkingen toewijst, kan zij de overeenkomst wijzigen
      of aan haar besluit voorschriften verbinden ter verzekering van de belangen van de verhuurder
      of van de bij de uitoefening van het visrecht betrokken visserijbelangen van derden. Alsdan is
      [artikel 30, eerste lid, tweede volzin, en tweede lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel30
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '30'
        hoofdstuk: V
        paragraaf: '5'
        afdeling: I
  - number: '34'
    text: |-
      Na het overlijden van de huurder loopt de overeenkomst met de gezamenlijke erfgenamen door tot het einde van
      het eerstvolgende huurjaar, behoudens eerdere beëindiging uit anderen hoofde. Is de nalatenschap ingevolge
      [artikel 13 van Boek 4 van het Burgerlijk Wetboek][ref1] verdeeld, dan loopt de overeenkomst gedurende de in de
      eerste zin bedoelde termijn met de echtgenoot of geregistreerde partner van de erflater door.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel13
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '13'
  - number: '35'
    text: |-
      Indien binnen enig gebied de versnippering van de eigendom van de grond onder het viswater of van het visrecht een
      doelmatig bevissen van het water belemmert, kan Onze Minister, de Kamer gehoord, bij regeling bepalen, dat verhuur
      van het visrecht op dat water uitsluitend kan geschieden aan en vervolgens door een openbaar lichaam, door Onze
      Minister aangewezen in overeenstemming met dat lichaam.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel35
  - number: '36.1'
    text: |-
      De bepalingen van deze paragraaf vinden overeenkomstige toepassing op overeenkomsten, waardoor of krachtens welke
      tegen een prestatie ineens of in termijnen beperkte genotsrechten voor 25 jaar of korter dan wel voor onbepaalde
      tijd op de grond onder het viswater worden gevestigd. In geval van beperkte genotsrechten voor onbepaalde tijd
      blijft de overeenkomstige toepassing van bepalingen van deze paragraaf beperkt tot 25 jaar na de vestiging.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel36
  - number: '36.2'
    text: |-
      De bepalingen, die voor het beperkte genotsrecht gelden vinden slechts toepassing voor zover zij niet in strijd
      zijn met bepalingen van deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel36
  - number: '38.1'
    text: Er is een Organisatie ter verbetering van de binnenvisserij.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel38
  - number: '38.2'
    text: De organisatie heeft haar zetel te 's-Gravenhage. Zij is rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel38
  - number: '38.3'
    text: |-
      De organisatie heeft tot doel de binnenvisserij te bevorderen. Zij tracht dit doel te bereiken door het treffen,
      financieren of medefinancieren van maatregelen, waaronder voorlichtingsmaatregelen, ter verbetering van de
      visstand, het welzijn van vissen, het aquatisch ecosysteem en het viswater, dan wel van andere maatregelen die de
      uitoefening van de binnenvisserij kunnen bevorderen.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel38
  - number: '39.1'
    text: Het bestuur der organisatie bestaat uit negen leden. De leden worden door Onze Minister benoemd.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel39
  - number: '39.2'
    text: |-
      Onze Minister benoemt vier bestuursleden op voordracht van de door hem aangewezen organisaties van sportvissers en
      twee op voordracht van de door hem aangewezen organisaties van beroepsvissers.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel39
  - number: '39.3'
    text: |-
      Onze Minister bepaalt het aantal bestuursleden, waarvoor elke door hem aangewezen organisatie voordrachten kan
      indienen.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel39
  - number: '39.4'
    text: |-
      De voorzitter en de ondervoorzitter worden door Onze Minister benoemd uit de niet op voordracht van de organisaties
      benoemde bestuursleden.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel39
  - number: '39.5'
    text: De bestuursleden treden om de vijf jaren tegelijk af en kunnen terstond opnieuw worden benoemd.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel39
  - number: '39.6'
    text: |-
      Onverminderd hetgeen elders is bepaald, kunnen de bestuursleden te allen tijde hetzij op eigen verzoek, hetzij op
      verzoek van de organisatie, welke hen heeft voorgedragen, door Onze Minister worden ontslagen.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel39
  - number: '39.7'
    text: |-
      Bij het bereiken van de ouderdom van zeventig jaren wordt aan de bestuursleden door Onze Minister ontslag verleend
      met ingang van de eerstvolgende maand.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel39
  - number: '39.8'
    text: De bestuursleden kunnen een vergoeding genieten volgens regelen, door Onze Minister te stellen.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel39
  - number: '41'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regelen vastgesteld betreffende de inrichting van de
      organisatie, de dagelijkse leiding van de organisatie, zijn vertegenwoordiging in en buiten rechte, de werkwijze
      van het bestuur, het ontslag van de bestuursleden en de voorziening in tussentijdse vacatures in het bestuur.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel41
  - number: '42.1'
    text: |-
      Het personeel dat de organisatie voor de vervulling van haar taak behoeft, wordt door de organisatie in dienst
      genomen op arbeidsovereenkomst naar burgerlijk recht.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel42
  - number: '42.2'
    text: |-
      Het bestuur stelt regelen omtrent de voorwaarden, waaronder de indienstneming geschiedt. Deze regelen behoeven de
      goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel42
  - number: '43.1'
    text: Het boekjaar van de organisatie vangt aan op 1 januari en eindigt op 31 december daaraanvolgend.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel43
  - number: '43.2'
    text: |-
      Jaarlijks voor 1 oktober dient het bestuur bij Onze Minister een begroting van lasten en baten voor het volgende
      jaar ter goedkeuring in.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel43
  - number: '43.3'
    text: |-
      Heeft Onze Minister de begroting niet goedgekeurd vóór de aanvang van het boekjaar, waarvoor zij moet dienen, dan
      is het bestuur bevoegd tot het innen van inkomsten en het doen van uitgaven in de begroting voorzien, voorzover
      Onze Minister daartegen geen bezwaren heeft kenbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel43
  - number: '43.4'
    text: |-
      Onze Minister is bevoegd de begroting vast te stellen, indien daaromtrent met het bestuur geen overeenstemming
      wordt verkregen.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel43
  - number: '44'
    text: |-
      Jaarlijks voor 1 juli dient het bestuur bij Onze Minister een financieel verslag over het afgelopen boekjaar ter
      goedkeuring in met de daarbij behorende balans en verlies- en winstrekening. De goedkeuring van Onze Minister van
      de ingediende stukken strekt het bestuur tot decharge.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel44
  - number: '45'
    text: Er is een Kamer voor de Binnenvisserij. De Kamer heeft haar zetel te 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel45
  - number: '46.1'
    text: |-
      De Kamer bestaat uit een voorzitter en ten minste zes en ten hoogste negen leden. Zij wordt bijgestaan door een
      secretaris.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel46
  - number: '46.2'
    text: Er kunnen een plaatsvervangende voorzitter en een of meer plaatsvervangende secretarissen worden benoemd.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel46
  - number: '46.3'
    text: |-
      Bij verhindering of ontstentenis van de voorzitter en van de plaatsvervangende voorzitter treedt het oudste lid als
      waarnemend voorzitter op.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel46
  - number: '47.1'
    text: |-
      Wij benoemen en ontslaan de voorzitter, de plaatsvervangende voorzitter, de leden, de secretaris alsmede de
      plaatsvervangende secretarissen.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel47
  - number: '47.2'
    text: |-
      Van de leden wordt een derde benoemd op voordracht van de door Ons aangewezen organisaties van beroepsvissers en
      een derde op voordracht van de door Ons aangewezen organisaties van sportvissers. De overige leden worden benoemd
      op voordracht van de door Ons aangewezen organisaties, welke geacht kunnen worden de eigenaren van en de beperkt
      gerechtigden op de grond onder het viswater te vertegenwoordigen. De voordrachten bevatten een dubbeltal voor ieder
      te benoemen lid.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel47
  - number: '47.3'
    text: Wij bepalen het aantal leden, waarvoor elke door Ons aangewezen organisatie voordrachten kan indienen.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel47
  - number: '47.4'
    text: |-
      De leden worden benoemd voor de tijd van vijf jaren. Zij zijn bij hun aftreden weer benoembaar. Op eigen verzoek
      kunnen zij door Ons worden ontslagen.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel47
  - number: '47.5'
    text: De in het eerste lid bedoelde personen worden voor de aanvang hunner bediening beëdigd.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel47
  - number: '47.6'
    text: |-
      Bij het bereiken van de ouderdom van zeventig jaren wordt aan de voorzitter, de plaatsvervangende voorzitter en de
      leden ontslag verleend met ingang van de eerstvolgende maand.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel47
  - number: '48.1'
    text: 'Voor benoeming tot secretaris of plaatsvervangende secretaris komt in aanmerking degene:'
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel48
  - number: 48.1.a
    text: |-
      aan wie door een universiteit dan wel de Open Universiteit waarop de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] betrekking heeft, de graad Bachelor op het gebied
      van het recht en tevens de graad Master op het gebied van het recht is verleend, of


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 48.1.b
    text: |-
      die aan een universiteit dan wel de Open Universiteit waarop de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] betrekking heeft, het doctoraat in de
      rechtsgeleerdheid of het recht om de titel meester te voeren heeft verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: '48.2'
    text: |-
      De graden, het doctoraat of het recht, bedoeld in het eerste lid, moeten zijn verkregen op grond van het
      afleggen van een examen aan een opleiding in het wetenschappelijk onderwijs in het Nederlands burgerlijk recht,
      handelsrecht, staatsrecht en strafrecht.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel48
  - number: 48.2a
    text: |-
      Bij algemene maatregel van bestuur kunnen graden, verleend door een universiteit, de Open Universiteit of
      een hogeschool als bedoeld in de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], of daaraan
      gelijkwaardige getuigschriften worden aangewezen die voor de toepasselijkheid van het eerste lid, onderdeel a,
      gelijk worden gesteld aan de in dat onderdeel bedoelde graad Bachelor op het gebied van het recht. In die algemene
      maatregel van bestuur kan tevens worden bepaald dat van de exameneisen ten aanzien van bepaalde rechtsgebieden,
      genoemd in het tweede lid, kan worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: '49.1'
    text: |-
      Onverminderd hetgeen elders is bepaald, worden de voorzitter, de plaatsvervangende voorzitter, de leden, de
      secretaris en de plaatsvervangende secretarissen ontslagen:
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel49
  - number: 49.1.a
    text: bij gebleken ongeschiktheid door ouderdom, door aanhoudende lichaamsziekte of tengevolge van zielsziekte;
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel49
  - number: 49.1.b
    text: wanneer zij onder curatele zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel49
  - number: '49.2'
    text: 'Onverminderd hetgeen elders is bepaald, kunnen de in het vorige lid genoemde personen worden ontslagen:'
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel49
  - number: 49.2.a
    text: |-
      bij overtreding van het bepaalde in de [artikelen 50][ref1] en [51][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0002416#Artikel51
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '50'
        hoofdstuk: V
        paragraaf: '2'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002416
        artikel: '51'
        hoofdstuk: V
        paragraaf: '2'
        afdeling: II
  - number: 49.2.b
    text: |-
      wanneer zij in staat van faillissement zijn verklaard ten aanzien van hen de schuldsaneringsregeling natuurlijke
      personen van toepassing is verklaard, zij, surséance van betaling hebben verkregen of wegens schulden zijn
      gegijzeld.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel49
  - number: '49.3'
    text: |-
      Wanneer zich een van de omstandigheden voordoet, als bedoeld in het tweede lid, zijn Onze Minister van Justitie
      en Onze Minister bevoegd de betrokkene in de uitoefening van zijn ambt terstond te schorsen; de schorsing mag
      een termijn van drie maanden niet overschrijden. Op deze termijn is de [Algemene termijnenwet][ref1] niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0002448
  - number: '49.4'
    text: |-
      Wanneer tijdens de in het vierde lid bedoelde schorsing het besluit tot ontslag wordt genomen, blijft de schorsing
      van kracht tot het tijdstip, waarop het ontslag ingaat.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel49
  - number: '50.1'
    text: |-
      De in [artikel 49][ref1] bedoelde personen zijn verplicht het geheim te bewaren omtrent hetgeen hun als zodanig
      bekend wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel49
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '49'
        hoofdstuk: V
        paragraaf: '2'
        afdeling: II
  - number: '50.2'
    text: |-
      Zij mogen zich noch direct noch indirect in enig bijzonder onderhoud of gesprek inlaten met partijen of derzelver
      raadslieden, noch enige bijzondere onderrichting, memorie of schrifturen aannemen over enige aangelegenheid, welke
      aanhangig is of waarvan zij weten of vermoeden, dat deze aanhangig zal worden bij de Kamer.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel50
  - number: '50.3'
    text: Zij mogen niet deelnemen aan de behandeling van zaken, waarbij zij in enig opzicht betrokken zijn.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel50
  - number: '51'
    text: |-
      Het is aan de in [artikel 49][ref1] bedoelde personen verboden zich te belasten met de consultatie omtrent en de
      verdediging van zaken, welke bij de Kamer of bij Ons aanhangig zijn, of waarvan zij weten of vermoeden, dat deze
      bij de Kamer of bij Ons aanhangig zullen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel49
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '49'
        hoofdstuk: V
        paragraaf: '2'
        afdeling: II
  - number: '52.1'
    text: 'De Kamer heeft:'
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel52
  - number: 52.1.a
    text: een enkelvoudige afdeling, welker werkzaamheden verricht worden door de voorzitter;
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel52
  - number: 52.1.b
    text: |-
      meervoudige afdelingen, welke zodanig zijn samengesteld, dat noch het belang der beroepsvissers, noch dat der
      sportvissers, noch dat der eigenaren overheerst.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel52
  - number: '52.2'
    text: |-
      Bij algemene maatregel van bestuur worden de inrichting van de Kamer, de beëdiging van de voorzitter, de
      plaatsvervangende voorzitter, de leden, de secretaris en de plaatsvervangende secretarissen, alsmede de
      samenstelling en de werkwijze van de afdelingen van de Kamer nader geregeld. Bij die maatregel wordt mede bepaald
      welke zaken door de enkelvoudige afdeling, onderscheidenlijk door de meervoudige afdelingen worden behandeld.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel52
  - number: '53.1'
    text: |-
      De voorzitter en de secretaris genieten een bezoldiging, welke bij algemene maatregel van bestuur wordt
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel53
  - number: '53.2'
    text: |-
      De plaatsvervangende voorzitter, de leden en de plaatsvervangende secretarissen genieten een vergoeding voor reis-
      en verblijfkosten en verdere vergoedingen volgens bij algemene maatregel van bestuur te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel53
  - number: '54'
    text: Bij ministeriële regeling wordt voor de werkzaamheden van de Kamer een tarief vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel54
  - number: '55.1'
    text: |-
      Ieder, die de visserij uitoefent of pleegt uit te oefenen, is verplicht op eerste vordering van een
      opsporingsambtenaar:
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel55
  - number: 55.1.a
    text: deze ambtenaar in de gelegenheid te stellen zijn vaartuig te betreden;
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel55
  - number: 55.1.b
    text: |-
      ter inzage af te geven de op grond van het bepaalde bij of krachtens deze wet voor de uitoefening van de visserij
      vereiste akten, vergunningen, huurovereenkomsten en andere bescheiden, waarvan inzage naar het redelijk oordeel van
      deze ambtenaar voor de vervulling van zijn taak nodig is;
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel55
  - number: 55.1.c
    text: uitstaand vistuig te lichten;
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel55
  - number: 55.1.d
    text: gesloten viskaren te openen;
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel55
  - number: 55.1.e
    text: anderszins de medewerking te verlenen, welke deze ambtenaar voor de vervulling van zijn taak behoeft.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel55
  - number: '55.2'
    text: |-
      Overtreding van het bij het vorige lid bepaalde wordt gestraft met hechtenis van ten hoogste een maand of geldboete
      van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel55
  - number: '55.3'
    text: De feiten strafbaar gesteld bij dit artikel worden als overtreding beschouwd.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel55
  - number: '56.1'
    text: |-
      Overtreding van het bepaalde bij of krachtens de [artikelen 2a, eerste en tweede lid][ref1],
      [2b, eerste lid][ref2], [2c, eerste, tweede en derde lid][ref3], [7, eerste lid][ref4], [10, eerste lid][ref5],
      en [16, eerste en derde lid][ref6], alsmede overtreding van het bepaalde bij of krachtens
      [artikel 21, eerste lid][ref7], indien wordt gevist met één of meer hengels, dan wel van voorschriften,
      verbonden aan op grond van het bepaalde bij of krachtens die artikelen verleende vergunningen, vrijstellingen, of
      ontheffingen, wordt gestraft met een hechtenis van ten hoogste drie maanden of geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0002416#Artikel2b
      [ref3]: https://wetten.overheid.nl/BWBR0002416#Artikel2c
      [ref4]: https://wetten.overheid.nl/BWBR0002416#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0002416#Artikel10
      [ref6]: https://wetten.overheid.nl/BWBR0002416#Artikel16
      [ref7]: https://wetten.overheid.nl/BWBR0002416#Artikel21
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: 2a
        hoofdstuk: I
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002416
        artikel: 2b
        hoofdstuk: I
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0002416
        artikel: 2c
        hoofdstuk: I
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0002416
        artikel: '7'
        hoofdstuk: IV
      - id: ref5
        bwb_id: BWBR0002416
        artikel: '10'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: I
      - id: ref6
        bwb_id: BWBR0002416
        artikel: '16'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: I
      - id: ref7
        bwb_id: BWBR0002416
        artikel: '21'
        hoofdstuk: V
        paragraaf: '4'
        afdeling: I
  - number: '56.2'
    text: |-
      Overtreding van het bepaalde bij of krachtens de [artikelen 17][ref1], [22, eerste lid][ref2], [27][ref3]
      en [32, eerste lid][ref4], dan wel van de voorschriften, bedoeld in de [artikelen 10, tiende lid][ref5],
      [17, tweede lid][ref6], [22, tweede, derde en vijfde lid][ref7], [29, tweede lid][ref8], en [33, tiende lid][ref9]
      wordt gestraft met hechtenis van ten hoogste een week of geldboete van de eerste categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002416#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0002416#Artikel27
      [ref4]: https://wetten.overheid.nl/BWBR0002416#Artikel32
      [ref5]: https://wetten.overheid.nl/BWBR0002416#Artikel10
      [ref6]: https://wetten.overheid.nl/BWBR0002416#Artikel17
      [ref7]: https://wetten.overheid.nl/BWBR0002416#Artikel22
      [ref8]: https://wetten.overheid.nl/BWBR0002416#Artikel29
      [ref9]: https://wetten.overheid.nl/BWBR0002416#Artikel33
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '17'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002416
        artikel: '22'
        hoofdstuk: V
        paragraaf: '4'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002416
        artikel: '27'
        hoofdstuk: V
        paragraaf: '5'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0002416
        artikel: '32'
        hoofdstuk: V
        paragraaf: '5'
        afdeling: I
      - id: ref5
        bwb_id: BWBR0002416
        artikel: '10'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: I
      - id: ref6
        bwb_id: BWBR0002416
        artikel: '17'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: I
      - id: ref7
        bwb_id: BWBR0002416
        artikel: '22'
        hoofdstuk: V
        paragraaf: '4'
        afdeling: I
      - id: ref8
        bwb_id: BWBR0002416
        artikel: '29'
        hoofdstuk: V
        paragraaf: '5'
        afdeling: I
      - id: ref9
        bwb_id: BWBR0002416
        artikel: '33'
        hoofdstuk: V
        paragraaf: '5'
        afdeling: I
  - number: '56.3'
    text: |-
      Overtreding van het bepaalde bij of krachtens [artikel 21, eerste lid][ref1], dan wel van voorschriften, verbonden
      aan op grond van het bepaalde bij of krachtens dat artikel verleende vergunningen of ontheffingen, wordt, indien
      wordt gevist anders dan met één of meer hengels, gestraft met een hechtenis van ten hoogste drie maanden of
      geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel21
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '21'
        hoofdstuk: V
        paragraaf: '4'
        afdeling: I
  - number: '56.4'
    text: De in dit artikel strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel56
  - number: '57.1'
    text: |-
      Bij veroordeling wegens overtreding van het bepaalde bij of krachtens de [artikelen 2][ref1], [2][ref2],
      [7, eerste lid][ref3], [9, eerste en derde lid][ref4], [16, eerste en derde lid][ref5], en [21, eerste lid][ref6],
      kan aan de veroordeelde de bevoegdheid om krachtens een akte te vissen voor ten hoogste drie jaren worden ontzegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0002416#Artikel2c
      [ref3]: https://wetten.overheid.nl/BWBR0002416#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0002416#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0002416#Artikel16
      [ref6]: https://wetten.overheid.nl/BWBR0002416#Artikel21
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: 2a
        hoofdstuk: I
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002416
        artikel: 2c
        hoofdstuk: I
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0002416
        artikel: '7'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0002416
        artikel: '9'
        hoofdstuk: IV
      - id: ref5
        bwb_id: BWBR0002416
        artikel: '16'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: I
      - id: ref6
        bwb_id: BWBR0002416
        artikel: '21'
        hoofdstuk: V
        paragraaf: '4'
        afdeling: I
  - number: '57.2'
    text: |-
      Bij toepassing van het eerste lid gaat de geldigheid van de akte, aan de veroordeelde afgegeven, verloren, zodra
      het vonnis voor tenuitvoerlegging vatbaar is geworden. De betrokken officier van justitie doet daarvan onmiddellijk
      mededeling aan Onze Minister, die daarvan afkondiging doet in de *Staatscourant* en in het *Algemeen Politieblad*.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel57
  - number: '58'
    text: De Nederlandse strafwet is mede van toepassing op een ieder die zich buiten Nederland,
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel58
  - number: 58.a
    text: |-
      binnen de visserijzone schuldig maakt aan de krachtens de [artikelen 3a][ref1], [4][ref2] en [5][ref3] strafbaar
      gestelde gedragingen;


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0002416#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0002416#Artikel5
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: 3a
        hoofdstuk: IIA
      - id: ref2
        bwb_id: BWBR0002416
        artikel: '4'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0002416
        artikel: '5'
        hoofdstuk: III
  - number: 58.b
    text: |-
      buiten de visserijzone schuldig maakt aan de krachtens [artikel 3a][ref1] strafbaar gestelde gedragingen, voorzover
      het betreft de overtreding van regelen gesteld ter uitvoering van besluiten van een regionale visserijorganisatie
      houdende beheers- en instandhoudingsmaatregelen genomen op grond van de op 4 augustus 1995 te New York tot
      stand gekomen Overeenkomst over de toepassing van de bepalingen van het Verdrag van de Verenigde naties inzake
      het recht van de zee van 10 december 1982 die betrekking hebben op de instandhouding en het beheer van de
      grensoverschrijdende en over grote afstanden trekkende visbestanden.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel3a
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: 3a
        hoofdstuk: IIA
  - number: '59'
    text: |-
      Met het opsporen van de feiten, strafbaar gesteld bij de [artikelen 55, tweede lid][ref1], [56][ref2] en
      [61, derde lid][ref3], zijn, behalve de bij [artikel 141 van het Wetboek van Strafvordering][ref4] aangewezen
      personen, belast de ambtenaren van de rijksbelastingdienst, bevoegd inzake douane en de door Onze Minister
      aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0002416#Artikel56
      [ref3]: https://wetten.overheid.nl/BWBR0002416#Artikel61
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '55'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0002416
        artikel: '56'
        hoofdstuk: VI
      - id: ref3
        bwb_id: BWBR0002416
        artikel: '61'
        hoofdstuk: VI
      - id: ref4
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '60'
    text: |-
      De in [artikel 59][ref1] bedoelde ambtenaren hebben toegang tot elke plaats, voor zover dat redelijkerwijs voor de
      vervulling van hun taak nodig is. Zo nodig verschaffen zij zich de toegang met behulp van de sterke arm.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel59
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '59'
        hoofdstuk: VI
  - number: '61.1'
    text: |-
      De opsporingsambtenaren zijn ter vervulling van hun taak bevoegd te vorderen, dat bestuurders van vervoermiddelen,
      met uitzondering van openbare vervoermiddelen, deze doen stilhouden en onderzoek toestaan van de vervoermiddelen
      en van de zich daarin bevindende voorwerpen. Zij kunnen tevens vorderen, dat de bestuurders overeenkomstig hun
      aanwijzingen ter zake medewerking verlenen.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel61
  - number: '61.2'
    text: |-
      Onze Minister is bevoegd na overleg met Onze Minister van Justitie regelen te stellen omtrent de wijze, waarop
      vorderingen tot het doen stilhouden, als bedoeld in het vorige lid, worden gedaan.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel61
  - number: '61.3'
    text: |-
      Het opzettelijk niet voldoen aan een vordering, als bedoeld in het eerste lid, wordt gestraft met hechtenis van ten
      hoogste een maand of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel61
  - number: '61.4'
    text: Het feit strafbaar gesteld bij dit artikel wordt als overtreding beschouwd.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel61
  - number: '62'
    text: |-
      Ook buiten het geval van ontdekking op heterdaad kunnen de opsporingsambtenaren voor inbeslagneming vatbare
      voorwerpen op elke plaats in beslag nemen, zomede ter inbeslagneming hun uitlevering vorderen.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel62
  - number: '63.1'
    text: Ieder beding, waarbij visrecht van de eigendom van de grond onder het water wordt afgescheiden, is nietig.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel63
  - number: '63.2'
    text: |-
      Waar bij het in werking treden van deze wet visrecht op wateren van anderen bestaat, kan het door dezen worden
      afgekocht, al ware het tegendeel uitdrukkelijk bedongen.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel63
  - number: '63.3'
    text: Onze Minister is tot de in het tweede lid bedoelde afkoop bevoegd.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel63
  - number: '63.4'
    text: |-
      Bij geschil over de afkoopprijs wordt deze door de rechtbank van het arrondissement, waarin de wateren zijn
      gelegen, na verhoor van deskundigen bepaald.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel63
  - number: '66'
    text: |-
      De rechten en verplichtingen, voortspruitende uit overeenkomsten van huur en verhuur van visrecht, welke van kracht
      zijn op het tijdstip, waarop deze wet in werking treedt, worden te rekenen van dat tijdstip, doch alleen voor het
      vervolg, beheerst door de bepalingen van deze wet.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel66
  - number: '68'
    text: |-
      Overeenkomsten van huur en verhuur van visrecht voor bepaalde tijd, welke op 1 februari 1955 van kracht waren en
      welke bij het in werking treden van deze wet nog van kracht zijn, gelden voor de duur waarvoor zij zijn aangegaan
      of verlengd.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel68
  - number: '70'
    text: |-
      De gevolgen, welke het overlijden van de huurder ten aanzien van de overeenkomst van huur en verhuur van visrecht
      heeft, worden geregeld door het recht, geldende ten tijde van het overlijden.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel70
  - number: '74.1'
    text: |-
      Bij algemene maatregel van bestuur worden bedragen vastgesteld welke verschuldigd zijn ter zake van het ingevolge
      deze wet uitreiken van bescheiden, andere dan die bedoeld in de [artikelen 6][ref1] en [10][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002416#Artikel10
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '6'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002416
        artikel: '10'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: I
  - number: '74.2'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald dat leges ter zake van bemoeiingen met het ingevolge deze
      wet aanvragen of uitreiken van het in [artikel 6][ref1] bedoelde consent niet hoger mogen zijn dan het daarbij
      vastgestelde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel6
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '6'
        hoofdstuk: IV
  - number: '75'
    text: 'Ingetrokken worden:'
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel75
  - number: 75.a
    text: de Visserijwet (*Stb.* 1931, 410);
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel75
  - number: 75.b
    text: de Wet van 14 juli 1954 (*Stb.* 369);
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel75
  - number: 75.c
    text: de Wet bijdragen verbetering binnenvisserij (*Stb.* 1952, 159);
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel75
  - number: 75.d
    text: de Wet op de maaswijdte van zeevisnetten (*Stb.* 1954, 250);
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel75
  - number: 75.e
    text: de Haringwet 1927 (*Stb.* 387).
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel75
  - number: '79'
    text: |-
      Deze wet treedt in werking op een nader door Ons te bepalen tijdstip. Zij kan worden aangehaald als: "Visserijwet",
      met vermelding van het jaartal van het *Staatsblad*, waarin zij is geplaatst.
    url: https://wetten.overheid.nl/BWBR0002416/2005-03-01#Artikel79
