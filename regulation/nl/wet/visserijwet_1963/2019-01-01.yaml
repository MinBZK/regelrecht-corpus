  - number: '56.3'
    text: De in dit artikel strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0002416/2019-01-01#Artikel56
  - number: '58'
    text: De Nederlandse strafwet is mede van toepassing op een ieder die zich buiten Nederland,
    url: https://wetten.overheid.nl/BWBR0002416/2019-01-01#Artikel58
  - number: 58.a
    text: |-
      binnen de visserijzone schuldig maakt aan de krachtens de [artikelen 3a][ref1], [4][ref2] en [5][ref3] strafbaar
      gestelde gedragingen;


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0002416#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0002416#Artikel5
    url: https://wetten.overheid.nl/BWBR0002416/2019-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: 3a
        hoofdstuk: IIA
      - id: ref2
        bwb_id: BWBR0002416
        artikel: '4'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0002416
        artikel: '5'
        hoofdstuk: III
  - number: 58.b
    text: |-
      buiten de visserijzone schuldig maakt aan de krachtens [artikel 3a][ref1] strafbaar gestelde gedragingen, voorzover
      het betreft de overtreding van regelen gesteld ter uitvoering van besluiten van een regionale visserijorganisatie
      houdende beheers- en instandhoudingsmaatregelen genomen op grond van de op 4 augustus 1995 te New York tot
      stand gekomen Overeenkomst over de toepassing van de bepalingen van het Verdrag van de Verenigde naties inzake
      het recht van de zee van 10 december 1982 die betrekking hebben op de instandhouding en het beheer van de
      grensoverschrijdende en over grote afstanden trekkende visbestanden.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel3a
    url: https://wetten.overheid.nl/BWBR0002416/2019-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: 3a
        hoofdstuk: IIA
  - number: '59'
    text: |-
      Met het opsporen van de feiten, strafbaar gesteld bij de [artikelen 55, tweede lid][ref1], [56][ref2] en
      [61, derde lid][ref3], zijn, behalve de bij [artikel 141 van het Wetboek van Strafvordering][ref4] aangewezen
      personen, belast de ambtenaren van de rijksbelastingdienst, bevoegd inzake douane en de door Onze Minister
      aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0002416#Artikel56
      [ref3]: https://wetten.overheid.nl/BWBR0002416#Artikel61
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0002416/2019-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '55'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0002416
        artikel: '56'
        hoofdstuk: VI
      - id: ref3
        bwb_id: BWBR0002416
        artikel: '61'
        hoofdstuk: VI
      - id: ref4
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '60'
    text: |-
      De in [artikel 59][ref1] bedoelde ambtenaren hebben toegang tot elke plaats, voor zover dat redelijkerwijs voor de
      vervulling van hun taak nodig is. Zo nodig verschaffen zij zich de toegang met behulp van de sterke arm.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel59
    url: https://wetten.overheid.nl/BWBR0002416/2019-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '59'
        hoofdstuk: VI
  - number: '61.1'
    text: |-
      De opsporingsambtenaren zijn ter vervulling van hun taak bevoegd te vorderen, dat bestuurders van vervoermiddelen,
      met uitzondering van openbare vervoermiddelen, deze doen stilhouden en onderzoek toestaan van de vervoermiddelen
      en van de zich daarin bevindende voorwerpen. Zij kunnen tevens vorderen, dat de bestuurders overeenkomstig hun
      aanwijzingen ter zake medewerking verlenen.
    url: https://wetten.overheid.nl/BWBR0002416/2019-01-01#Artikel61
  - number: '61.2'
    text: |-
      Onze Minister is bevoegd na overleg met Onze Minister van Justitie regelen te stellen omtrent de wijze, waarop
      vorderingen tot het doen stilhouden, als bedoeld in het vorige lid, worden gedaan.
    url: https://wetten.overheid.nl/BWBR0002416/2019-01-01#Artikel61
  - number: '61.3'
    text: |-
      Het opzettelijk niet voldoen aan een vordering, als bedoeld in het eerste lid, wordt gestraft met hechtenis van ten
      hoogste een maand of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0002416/2019-01-01#Artikel61
  - number: '61.4'
    text: Het feit strafbaar gesteld bij dit artikel wordt als overtreding beschouwd.
    url: https://wetten.overheid.nl/BWBR0002416/2019-01-01#Artikel61
  - number: '62'
    text: |-
      Ook buiten het geval van ontdekking op heterdaad kunnen de opsporingsambtenaren voor inbeslagneming vatbare
      voorwerpen op elke plaats in beslag nemen, zomede ter inbeslagneming hun uitlevering vorderen.
    url: https://wetten.overheid.nl/BWBR0002416/2019-01-01#Artikel62
  - number: '63.1'
    text: Ieder beding, waarbij visrecht van de eigendom van de grond onder het water wordt afgescheiden, is nietig.
    url: https://wetten.overheid.nl/BWBR0002416/2019-01-01#Artikel63
  - number: '63.2'
    text: |-
      Waar bij het in werking treden van deze wet visrecht op wateren van anderen bestaat, kan het door dezen worden
      afgekocht, al ware het tegendeel uitdrukkelijk bedongen.
    url: https://wetten.overheid.nl/BWBR0002416/2019-01-01#Artikel63
  - number: '63.3'
    text: Onze Minister is tot de in het tweede lid bedoelde afkoop bevoegd.
    url: https://wetten.overheid.nl/BWBR0002416/2019-01-01#Artikel63
  - number: '63.4'
    text: |-
      Bij geschil over de afkoopprijs wordt deze door de rechtbank van het arrondissement, waarin de wateren zijn
      gelegen, na verhoor van deskundigen bepaald.
    url: https://wetten.overheid.nl/BWBR0002416/2019-01-01#Artikel63
  - number: '66'
    text: |-
      De rechten en verplichtingen, voortspruitende uit overeenkomsten van huur en verhuur van visrecht, welke van kracht
      zijn op het tijdstip, waarop deze wet in werking treedt, worden te rekenen van dat tijdstip, doch alleen voor het
      vervolg, beheerst door de bepalingen van deze wet.
    url: https://wetten.overheid.nl/BWBR0002416/2019-01-01#Artikel66
  - number: '68'
    text: |-
      Overeenkomsten van huur en verhuur van visrecht voor bepaalde tijd, welke op 1 februari 1955 van kracht waren en
      welke bij het in werking treden van deze wet nog van kracht zijn, gelden voor de duur waarvoor zij zijn aangegaan
      of verlengd.
    url: https://wetten.overheid.nl/BWBR0002416/2019-01-01#Artikel68
  - number: '70'
    text: |-
      De gevolgen, welke het overlijden van de huurder ten aanzien van de overeenkomst van huur en verhuur van visrecht
      heeft, worden geregeld door het recht, geldende ten tijde van het overlijden.
    url: https://wetten.overheid.nl/BWBR0002416/2019-01-01#Artikel70
  - number: '74.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden bedragen vastgesteld welke verschuldigd zijn ter zake
      van het ingevolge deze wet uitreiken van bescheiden, alsmede ter zake van de krachtens de [artikelen 3a][ref1],
      [4][ref2], [5][ref3], [9][ref4] of [16][ref5] voorgeschreven controles, verrichtingen of onderzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0002416#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0002416#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0002416#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0002416#Artikel16
    url: https://wetten.overheid.nl/BWBR0002416/2019-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: 3a
        hoofdstuk: IIA
      - id: ref2
        bwb_id: BWBR0002416
        artikel: '4'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0002416
        artikel: '5'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0002416
        artikel: '9'
        hoofdstuk: IV
      - id: ref5
        bwb_id: BWBR0002416
        artikel: '16'
        hoofdstuk: V
        paragraaf: '3'
        afdeling: I
  - number: '74.2'
    text: |-
      De in het eerste lid bedoelde bedragen worden zodanig vastgesteld dat de geraamde baten niet uitgaan boven de
      geraamde kosten die in een rechtstreeks verband staan met de werkzaamheden waarvoor het tarief wordt opgelegd,
      onverminderd de daaromtrent bij een communautaire maatregel vastgestelde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0002416/2019-01-01#Artikel74
  - number: '75.1'
    text: |-
      De zorg voor de archiefbescheiden van de bij de
      [wet van 6 september 2006 tot wijziging van de Visserijwet 1963][ref1] (Stb. 2006, 476) opgeheven Organisatie ter
      verbetering van de binnenvisserij ligt bij Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0020263
    url: https://wetten.overheid.nl/BWBR0002416/2019-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0020263
  - number: '75.2'
    text: |-
      De archiefbescheiden kunnen, voor zover zij niet zijn overgebracht naar een rijksarchiefbewaarplaats, tijdelijk ter
      beschikking worden gesteld aan een door Onze Minister aan te wijzen rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0002416/2019-01-01#Artikel75
  - number: '75.3'
    text: |-
      Onze Minister stelt vast voor welk tijdvak de in het tweede lid bedoelde archiefbescheiden aan de rechtspersoon ter
      beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002416/2019-01-01#Artikel75
  - number: '75.4'
    text: |-
      De rechtspersoon rapporteert jaarlijks aan Onze Minister over het beheer van de ter beschikking gestelde
      archiefbescheiden. Het in de artikelen [25a][ref1] en [25b van de Archiefwet 1995][ref2] bedoelde toezicht op het
      beheer blijft op de krachtens het tweede lid ter beschikking gestelde archiefbescheiden van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel25b
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel25a
    url: https://wetten.overheid.nl/BWBR0002416/2019-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: 25b
      - id: ref2
        bwb_id: BWBR0007376
        artikel: 25a
  - number: '75.5'
    text: |-
      Onze Minister is te allen tijde bevoegd inzage te nemen van de terbeschikkinggestelde archiefbescheiden dan wel
      daarvan of daaruit reproducties, afschriften of uittreksels te vorderen.
    url: https://wetten.overheid.nl/BWBR0002416/2019-01-01#Artikel75
  - number: '75.6'
    text: |-
      De kosten van het beheer van de krachtens het tweede lid ter beschikking gestelde archiefbescheiden komen ten laste
      van de in dat lid bedoelde rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0002416/2019-01-01#Artikel75
  - number: '75.7'
    text: |-
      De overbrenging van de in de in het eerste lid bedoelde archiefbescheiden naar een rijksarchiefbewaarplaats
      geschiedt door Onze Minister met inachtneming van de [artikelen 12][ref1] en [13 van de Archiefwet 1995][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel13
    url: https://wetten.overheid.nl/BWBR0002416/2019-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0007376
        artikel: '13'
  - number: '79'
    text: |-
      Deze wet treedt in werking op een nader door Ons te bepalen tijdstip. Zij kan worden aangehaald als: "Visserijwet",
      met vermelding van het jaartal van het *Staatsblad*, waarin zij is geplaatst.
    url: https://wetten.overheid.nl/BWBR0002416/2019-01-01#Artikel79
