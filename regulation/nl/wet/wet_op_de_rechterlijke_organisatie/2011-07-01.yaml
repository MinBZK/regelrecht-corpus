  - number: '56'
    text: |-
      Het bestuur van de rechtbank te Haarlem vormt voor het behandelen en beslissen van zaken als bedoeld in
      [artikel 8:2, tweede en derde lid, van de Algemene douanewet][ref1], enkelvoudige en meervoudige kamers onder de
      benaming van douanekamers. Het bestuur bepaalt de bezetting van deze kamers.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel82
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel56
