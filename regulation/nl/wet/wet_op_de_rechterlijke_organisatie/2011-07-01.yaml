  - number: 13d
    text: |-
      Een vordering bij de Hoge Raad als bedoeld in [artikel 13a][ref1] of [13c][ref2] wordt behandeld door een bij het
      reglement van orde daartoe aangewezen kamer, die zitting houdt met drie leden.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel13a
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel13c
