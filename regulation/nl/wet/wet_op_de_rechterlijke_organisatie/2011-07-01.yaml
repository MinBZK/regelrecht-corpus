  - number: '107'
    text: |-
      1 In geval van ongeschiktheid anders dan wegens ziekte kan Onze Minister een of meer leden van de Raad voordragen
      voor ontslag als lid van de Raad. In geval van een ernstig vermoeden voor het bestaan van ongeschiktheid anders dan
      wegens ziekte, kan Onze Minister een of meer leden van de Raad voordragen voor schorsing als lid van de Raad.

      2 De schorsing of het ontslag geschiedt bij koninklijk besluit.

      3 Indien alle leden van de Raad zijn geschorst of ontslagen, kan Onze Minister bij de Raad een of meer tijdelijke
      bewindvoerders aanstellen. [Artikel 84, zesde lid][ref1], is van overeenkomstige toepassing. Bij de aanstelling
      wordt een termijn bepaald voor de bewindvoering.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel84
