  - number: '76'
    text: |-
      1 De Hoge Raad neemt in eerste instantie, tevens in hoogste ressort, kennis van de ambtsmisdrijven en
      ambtsovertredingen begaan door de leden van de Staten-Generaal, de ministers en de staatssecretarissen.

      2 Onder ambtsmisdrijven en ambtsovertredingen worden hier begrepen strafbare feiten begaan onder een der
      verzwarende omstandigheden omschreven in [artikel 44 van het Wetboek van Strafrecht][ref1].

      3 In de gedingen, bedoeld in het eerste en tweede lid, is de Hoge Raad tevens bevoegd kennis te nemen van de
      vordering tot vergoeding van kosten en schaden ten behoeve van de benadeelde partij.

      4 In de gedingen, bedoeld in het eerste en tweede lid, oordeelt de Hoge Raad met een aantal van tien raadsheren.
      Bij het staken der stemmen wordt een uitspraak ten voordele van de verdachte gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel44
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel76
