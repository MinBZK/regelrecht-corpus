    text: De Raad verstrekt desgevraagd aan Onze Minister de voor de uitoefening van zijn taak benodigde inlichtingen.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel105
  - number: '106'
    text: |-
      1 Een beslissing van de Raad ter uitvoering van de in [artikel 91][ref1] genoemde taken of een beslissing van de
      Raad als bedoeld in artikel 46a of [62a][ref2], kan op voordracht van Onze Minister bij koninklijk besluit worden
      vernietigd indien de beslissing kennelijk in strijd is met het recht of het belang van een goede bedrijfsvoering
      van de rechterlijke organisatie.

      2 De [artikelen 8:4, onderdeel a][ref3], [10:36][ref4], [10:37][ref5] en
      [10:38 tot en met 10:45 van de Algemene wet bestuursrecht][ref6] zijn van overeenkomstige toepassing.


