  - number: '79'
    text: |-
      1 De Hoge Raad vernietigt handelingen, arresten, vonnissen en beschikkingen:

      a. wegens verzuim van vormen voorzover de niet-inachtneming daarvan uitdrukkelijk met nietigheid is bedreigd of
      zodanige nietigheid voortvloeit uit de aard van de niet in acht genomen vorm;

      b. wegens schending van het recht met uitzondering van het recht van vreemde staten.

      2 Feiten waaruit het gelden of niet gelden van een regel van gewoonterecht wordt afgeleid, worden voorzover zij
      bewijs behoeven, alleen op grond van de bestreden beslissing als vaststaande aangenomen.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel79
  - number: '80'
    text: |-
      1 Tegen een vonnis of een beschikking van een kantonrechter in een burgerlijke zaak waartegen geen hoger beroep kan
      of kon worden ingesteld, kan een partij slechts beroep in cassatie instellen wegens:

      a. het niet inhouden van de gronden waarop het vonnis of de beschikking berust;

      b. het niet in het openbaar gedaan zijn van het vonnis of, voorzover rechtens vereist, de beschikking;

      c. onbevoegdheid; of

      d. overschrijding van rechtsmacht.

      2 Een vonnis van een kantonrechter in een strafzaak kan, afgezien van het geval van cassatie «in het belang der
      wet», wegens geen ander verzuim van vormen worden vernietigd dan wegens:

      a. het niet inhouden van het ten laste gelegde dan wel, in geval van een bewezenverklaring, het ten laste gelegde
      alsmede de gronden waarop het vonnis berust;

      b. het niet beslissen op de grondslag van de tenlastelegging;

      c. het niet geven van de beslissing, bedoeld in [artikel 358, derde lid, van het Wetboek van Strafvordering][ref1],
      dan wel het niet geven van de redenen voor deze beslissing; of

      d. het niet in het openbaar gewezen zijn van het vonnis.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel358
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '358'
  - number: '81'
    text: |-
      Indien de Hoge Raad oordeelt dat een aangevoerde klacht niet tot cassatie kan leiden en niet noopt tot
      beantwoording van rechtsvragen in het belang van de rechtseenheid of de rechtsontwikkeling, kan hij zich bij de
      vermelding van de gronden van zijn beslissing beperken tot dit oordeel.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel81
  - number: '82'
    text: |-
      1 De Hoge Raad is belast met de beëdiging van functionarissen ten aanzien van wie zulks bij of krachtens de wet
      is bepaald.

      2 De in het eerste lid bedoelde taak wordt uitgeoefend door de president van de Hoge Raad. De beëdiging geschiedt
      op vordering van de procureur-generaal.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel82
  - number: '83'
    text: |-
      De rechtbanken, de gerechtshoven en de presidenten geven inlichtingen wanneer die door de Hoge Raad voor de
      behandeling van een zaak noodzakelijk worden geacht.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel83
  - number: '84'
    text: |-
      1 Er is een Raad voor de rechtspraak.

      2 De Raad bestaat uit ten minste drie en ten hoogste vijf leden. Bij algemene maatregel van bestuur wordt het
      aantal leden vastgesteld.

      3 De leden van de Raad worden bij koninklijk besluit op voordracht van Onze Minister benoemd voor een periode van
      zes jaar. Zij kunnen eenmaal worden herbenoemd voor een periode van drie jaar.

      4 Indien de Raad bestaat uit drie of vier leden onderscheidenlijk uit vijf leden, zijn twee leden onderscheidenlijk
      drie leden rechterlijke ambtenaren met rechtspraak belast dan wel met rechtspraak belaste leden van de Centrale
      Raad van Beroep of het College van Beroep voor het bedrijfsleven, die hun rechtsprekend ambt op basis van een
      aanstelling als bedoeld in [artikel 5f, eerste lid, van de Wet rechtspositie rechterlijke ambtenaren][ref1]
      vervullen. De overige leden van de Raad zijn geen rechterlijke ambtenaren met rechtspraak belast, dan wel met
      rechtspraak belaste leden van de Centrale Raad van Beroep of het College van Beroep voor het bedrijfsleven.

      5 Een van de rechterlijke leden wordt bij koninklijk besluit op voordracht van Onze Minister tot voorzitter van de
      Raad benoemd.

      6 De leden kunnen niet tevens zijn:

      a. lid van het bestuur van een gerecht;

      b. lid van de Staten-Generaal;

      c. minister of staatssecretaris;

      d. vice-president of lid van de Raad van State;

      e. president of lid van de Algemene Rekenkamer;

      f. Nationale ombudsman of substituut-ombudsman;

      g. ambtenaar bij een ministerie, alsmede de daaronder ressorterende instellingen, diensten en bedrijven;

      h. rechterlijk ambtenaar, als bedoeld in [artikel 1, onderdeel b, onder 1° en 4° tot en met 9°][ref2];

      i. lid van het College van Afgevaardigden, bedoeld in [artikel 90][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel5f
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0001830#Artikel90
