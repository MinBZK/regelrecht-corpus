  - number: '89'
    text: |-
      1 Te zijner ondersteuning beschikt de Raad over een bureau.

      2 Ten aanzien van de tot het bureau behorende ambtenaren worden de in de [Ambtenarenwet][ref1] aan het bevoegd
      gezag toegekende bevoegdheden uitgeoefend door de Raad.

      3 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de uitoefening van
      rechtspositionele bevoegdheden door de Raad ten aanzien van de tot het bureau behorende ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001947
