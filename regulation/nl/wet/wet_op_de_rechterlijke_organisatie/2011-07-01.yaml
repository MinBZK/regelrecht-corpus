  - number: '100'
    text: |-
      Met inachtneming van de regels, bedoeld in [artikel 97, eerste lid][ref1], kent Onze Minister jaarlijks aan de
      Raad een budget toe ten laste van de rijksbegroting ten behoeve van de activiteiten van de Raad en de gerechten
      gezamenlijk. Aan de toekenning kan Onze Minister voorschriften verbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel97
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel100
