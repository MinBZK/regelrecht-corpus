  - number: '26'
    text: |-
      1 Het bestuur stelt een regeling vast voor de behandeling van klachten.

      2 De regeling of een wijziging daarvan behoeft de instemming van de Raad. De
      [artikelen 10:28 tot en met 10:31 van de Algemene wet bestuursrecht][ref1] zijn van overeenkomstige toepassing.

      3 De instemming kan slechts worden onthouden wegens strijd met het recht of het belang van een goede
      bedrijfsvoering van het gerecht.

      4 Klachten zijn niet mogelijk ten aanzien van gedragingen waartegen ingevolge een wettelijk geregelde voorziening
      een procedure bij een rechterlijke instantie openstaat of heeft opengestaan, dan wel beroep openstaat of heeft
      opengestaan tegen een uitspraak die in een zodanige procedure is gedaan. Klachten kunnen evenmin een rechterlijke
      beslissing betreffen.

      5 De regeling wordt gepubliceerd in de Staatscourant.

      6 [Afdeling 9.1.2 van de Algemene wet bestuursrecht][ref2] is van overeenkomstige toepassing.

      7 Ten aanzien van de bij het gerecht werkzame gerechtsambtenaren, buitengriffiers, gerechtsauditeurs en
      rechterlijke ambtenaren in opleiding zijn [titel 9.2 van de Algemene wet bestuursrecht][ref3] alsmede
      [artikel 1a, vierde lid][ref4], en [hoofdstuk III van de Wet Nationale ombudsman][ref5] van overeenkomstige
      toepassing, met dien verstande dat voor de overeenkomstige toepassing hiervan als bestuursorgaan wordt aangemerkt
      het bestuur van het gerecht waar de betrokken gerechtsambtenaar, buitengriffier, gerechtsauditeur of rechterlijk
      ambtenaar in opleiding werkzaam is.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1028
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling9.1.2
      [ref3]: https://wetten.overheid.nl/BWBR0005537
      [ref4]: https://wetten.overheid.nl/BWBR0003372#Artikel1a
      [ref5]: https://wetten.overheid.nl/BWBR0003372#HoofdstukIII
