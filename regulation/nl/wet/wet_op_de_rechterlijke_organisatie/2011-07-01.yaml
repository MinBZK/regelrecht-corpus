        artikel: '47'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '3'
  - number: '52'
    text: |-
      1 Het bestuur vormt voor het behandelen en beslissen van zaken betreffende economische delicten enkelvoudige en
      meervoudige kamers onder de benaming van economische kamers. Het bestuur bepaalt de bezetting van deze kamers.

      2 Degene die zitting heeft in een enkelvoudige economische kamer draagt de titel van economische politierechter.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel52
  - number: '53'
    text: |-
      1 Het bestuur vormt voor het behandelen en beslissen van kinderzaken enkelvoudige kamers en bepaalt de bezetting
      daarvan.

      2 Degene die zitting heeft in een enkelvoudige kamer voor kinderzaken draagt de titel van kinderrechter.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel53
  - number: '54'
    text: |-
      1 Het bestuur van de rechtbank te 's-Gravenhage vormt voor het behandelen en beslissen van zaken op grond van de
      [Militaire Ambtenarenwet 1931][ref1] enkelvoudige en meervoudige kamers en bepaalt de bezetting daarvan.

      2 Degene die zitting heeft in een enkelvoudige kamer als bedoeld in het eerste lid draagt de titel van militaire
      ambtenarenrechter.

      3 Een meervoudige kamer bestaat uit twee rechterlijke ambtenaren met rechtspraak belast en een militair lid,
      dat bij voorkeur afkomstig is uit het krijgsmachtdeel waartoe degene die beroep heeft ingesteld behoort of
      behoorde. Op het militaire lid zijn de [artikelen 7, derde lid][ref2], [12][ref3] en [13 tot en met 13g][ref4] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001952
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0001830#Artikel12
