      [artikel 78, eerste en tweede lid, van de Zaaizaad- en plantgoedwet 2005][ref1], enkelvoudige en meervoudige kamers
      onder de benaming van kamers voor het kwekersrecht. Het bestuur bepaalt de bezetting van deze kamers.

      2 Een meervoudige kamer bestaat uit twee rechterlijke ambtenaren met rechtspraak belast en een persoon, niet zijnde
