  - number: '27'
    text: De president vertegenwoordigt het gerecht.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel27
  - number: '28'
    text: |-
      Een sectorvergadering of de gerechtsvergadering kan het bestuur gevraagd of ongevraagd adviseren over de uitvoering
      van de in [artikel 23, derde lid][ref1], genoemde taak.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel23
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: '29'
    text: |-
      1 Met inachtneming van de regels, bedoeld in [artikel 97, eerste lid][ref1], kent de Raad jaarlijks aan elk gerecht
      een algemeen budget toe ten laste van de rijksbegroting. De Raad kan aan de toekenning van het budget voorschriften
      verbinden.

      2 In aanvulling op het algemene budget kan de Raad een gerecht financiële middelen verstrekken voor specifiek
      omschreven activiteiten die gericht zijn op verbetering van de organisatie of de werkwijze van de gerechten of het
      desbetreffende gerecht. De tweede volzin van het eerste lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel97
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '97'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '6'
  - number: '30'
    text: |-
      De Raad deelt aan elk gerecht zo spoedig mogelijk na de mededeling, bedoeld in [artikel 101][ref1] mede welk
      budget, met inbegrip van de daaraan te verbinden voorschriften, voor het komende begrotingsjaar voorlopig kan
      worden verwacht. Hij deelt daarbij tevens mede op welke wijze het geraamde budget is berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel101
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '101'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '6'
  - number: '31'
    text: |-
      1 Het bestuur stelt jaarlijks een jaarplan voor het gerecht vast. Het plan bevat:

      a. een omschrijving van de voorgenomen activiteiten ter uitvoering van de in [artikel 23, eerste lid][ref1],
      genoemde taken voor het jaar volgend op het jaar waarin het plan is vastgesteld;

      b. een begroting voor het komende begrotingsjaar;

      c. een meerjarenraming voor ten minste vier op het begrotingsjaar volgende jaren.

      2 In afwijking van [artikel 17, tweede lid][ref2], stelt het bestuur het jaarplan vast met meerderheid van stemmen,
      waaronder de stem van de president.

      3 De Raad kan omtrent de inrichting van het plan algemene aanwijzingen geven.

      4 Het bestuur zendt het plan voor een door de Raad te bepalen tijdstip aan de Raad.

      5 Binnen het bestuur ziet de president toe op de uitvoering van het jaarplan.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel17
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0001830
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
  - number: '32'
    text: |-
      1 Het bestuur stelt de begroting van het gerecht als onderdeel van het jaarplan vast in overeenstemming met het
      door de Raad geraamde budget, bedoeld in [artikel 30][ref1].

      2 De begroting van het gerecht behoeft de instemming van de Raad. De
      [artikelen 10:28 tot en met 10:30 van de Algemene wet bestuursrecht][ref2] zijn van overeenkomstige toepassing.

      3 De instemming kan slechts worden onthouden wegens strijd met het recht of het belang van een goede
      bedrijfsvoering van het gerecht.

      4 De Raad beslist binnen acht weken na ontvangst van de begroting van het gerecht. De instemming wordt geacht te
      zijn verleend indien binnen deze termijn geen beslissing van de Raad is ontvangen.

      5 In gevallen van dringende spoed kan het bestuur een uitgave doen voordat de desbetreffende begroting de
      instemming van de Raad heeft verkregen. De Raad wordt daarvan terstond in kennis gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel1028
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel32
