        paragraaf: '3'
        afdeling: '6'
  - number: '103'
    text: |-
      1 Onze Minister maakt aan de Raad zo spoedig mogelijk na de vaststelling van de begroting van het Ministerie
      van Veiligheid en Justitie bekend, welk budget hij toekent aan de Raad en de gerechten gezamenlijk. Indien het
      budget afwijkt van het geraamde budget, bedoeld in [artikel 101][ref1], is de tweede volzin van dat artikel van
      overeenkomstige toepassing.

      2 Indien het budget afwijkt van het geraamde budget, bedoeld in [artikel 101][ref2], wijzigt de Raad de begroting.

      3 Beslissingen tot andere wijzigingen van de begroting kunnen tot uiterlijk het eind van het desbetreffende
      begrotingsjaar worden genomen.

      4 De Raad doet de noodzakelijke uitgaven binnen de grenzen van de vastgestelde of gewijzigde begroting.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel101
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel103
