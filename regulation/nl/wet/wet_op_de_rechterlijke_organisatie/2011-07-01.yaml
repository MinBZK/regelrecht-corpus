  - number: '19'
    text: |-
      1 Het bestuur stelt bij reglement in ieder geval nadere regels vast met betrekking tot zijn werkwijze,
      besluitvorming en taakverdeling, de organisatiestructuur, de machtiging, bedoeld in [artikel 18][ref1],
      de vervanging van zijn leden in geval van ziekte of andere verhindering, de indeling in kamers, bedoeld in
      [artikel 6, eerste lid][ref2], de verdeling van zaken over de sectoren, bedoeld in [artikel 20, tweede lid][ref3],
      alsmede de verdeling van zaken over de hoofdplaats en nevenvestigings- en nevenzittingsplaatsen.

      2 Het reglement behoeft de instemming van de Raad. De
      [artikelen 10:28 tot en met 10:31 van de Algemene wet bestuursrecht][ref4] zijn van overeenkomstige toepassing.

      3 De instemming kan slechts worden onthouden wegens strijd met het recht of het belang van een goede
      bedrijfsvoering van het gerecht.

      4 Het reglement wordt gepubliceerd in de Staatscourant.


