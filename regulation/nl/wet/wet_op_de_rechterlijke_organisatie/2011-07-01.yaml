        afdeling: '2'
  - number: '34'
    text: |-
      1 Indien de begroting niet de instemming van de Raad heeft verkregen, behoeft het bestuur tot het doen van uitgaven
      steeds de instemming van de Raad.

      2 Een verzoek van het bestuur om instemming kan door de Raad slechts worden afgewezen
      wegens strijd met het recht of het belang van een goede bedrijfsvoering van het gerecht. De
      [artikelen 10:28 tot en met 10:30 van de Algemene wet bestuursrecht][ref1] zijn van overeenkomstige toepassing.

      3 De Raad beslist op het verzoek binnen acht weken na ontvangst van het verzoek. De instemming wordt geacht te zijn
      verleend indien binnen deze termijn geen beslissing van de Raad is ontvangen.

      4 De Raad kan aan de instemming voorschriften verbinden.

      5 De Raad kan bepalen voor welke posten en tot welk bedrag het bestuur geen instemming behoeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1028
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 10:28
  - number: '35'
    text: |-
      1 Het bestuur dient jaarlijks voor een door de Raad te bepalen tijdstip bij de Raad een verslag in.

      2 Het verslag bestaat uit de jaarrekening met bijbehorende begroting, de daarin aangebrachte wijzigingen, het
      jaarverslag en overige financiële gegevens.

      3 In de jaarrekening wordt rekening en verantwoording afgelegd van het financiële beheer van het gerecht over het
      voorafgaande begrotingsjaar.

      4 De jaarrekening behoeft de instemming van de Raad. De instemming kan slechts worden onthouden wegens strijd met
      het recht. De [artikelen 10:28 tot en met 10:31 van de Algemene wet bestuursrecht][ref1] zijn van overeenkomstige
      toepassing.

      5 In het jaarverslag wordt vermeld op welke wijze de werkzaamheden ten behoeve waarvan het budget ten laste van
      de rijksbegroting is verleend, zijn uitgevoerd. Daarbij wordt aangegeven op welke wijze deze werkzaamheden zich
      verhouden tot het plan zoals dit overeenkomstig [artikel 31][ref2] voor het desbetreffende jaar is vastgesteld en
      tot de in het desbetreffende jaar geldende financieringsregels, bedoeld in [artikel 97, eerste lid][ref3].

      6 Het verslag omvat een verklaring omtrent de getrouwheid en de rechtmatigheid, afgegeven door een door het bestuur
      aangewezen accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref4]. De
      accountant voegt bij de verklaring een rapport naar aanleiding van de controle op het financiële beheer. Bij de
      aanwijzing van de accountant wordt bedongen dat aan de Raad op diens verzoek inzicht wordt geboden in de controle-
      rapporten van de accountant.

      7 De Raad kan een aanwijzing vaststellen inzake de reikwijdte en de intensiteit van de accountantscontrole. Deze
      aanwijzing is in overeenstemming met de aanwijzing, bedoeld in [artikel 104, zesde lid][ref5].

      8 In afwijking van [artikel 17, tweede lid][ref6], stelt het bestuur het jaarverslag vast met meerderheid van
      stemmen, waaronder de stem van de president.

      9 De Raad kan omtrent de inrichting van het verslag algemene aanwijzingen geven.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1028
