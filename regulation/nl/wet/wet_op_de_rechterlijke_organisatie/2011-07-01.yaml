  - number: '38'
    text: |-
      1 In geval van ongeschiktheid anders dan wegens ziekte kan de Raad Onze Minister voorstellen om een of meer leden
      van het bestuur voor te dragen voor ontslag als lid van het bestuur. In geval van een ernstig vermoeden voor het
      bestaan van ongeschiktheid anders dan wegens ziekte, kan de Raad Onze Minister voorstellen om een of meer leden van
      het bestuur voor te dragen voor schorsing als lid van het bestuur.

      2 De schorsing of het ontslag geschiedt bij koninklijk besluit op voordracht van Onze Minister.

      3 Indien alle leden van het bestuur zijn geschorst of ontslagen, kan de Raad bij het desbetreffende gerecht
      een of meer tijdelijke bewindvoerders aanstellen. [Artikel 15, zevende tot en met tiende lid][ref1], is van
      overeenkomstige toepassing. Bij de aanstelling wordt een termijn bepaald voor de bewindvoering.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel15
