      - id: ref1
        bwb_id: BWBR0023746
        artikel: 8:2
  - number: '58'
    text: |-
      1 Rechterlijke ambtenaren met rechtspraak belast, werkzaam bij de gerechtshoven zijn:

      a. senior raadsheren;

      b. raadsheren;

      c. raadsheren-plaatsvervangers.

      2 De rechterlijke ambtenaren met rechtspraak belast in een gerechtshof zijn van rechtswege raadsheer-
      plaatsvervanger in de overige gerechtshoven.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel58
  - number: '59'
    text: |-
      1 Het gerechtshof is gevestigd in de hoofdplaats van het ressort.

      2 Bij algemene maatregel van bestuur kunnen nevenzittingsplaatsen worden aangewezen. Tevens kunnen bij
      algemene maatregel van bestuur regels worden gesteld voor de verdeling van zaken over de hoofdplaats en de
      nevenzittingsplaatsen.

      3 De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is voorgelegd.

      4 Het bestuur verdeelt de zaken over de hoofdplaats en de nevenzittingsplaatsen, met inachtneming van de regels,
      bedoeld in het tweede lid.

      5 De rechterlijke ambtenaren met rechtspraak belast, de niet-rechterlijke leden van een meervoudige kamer,
      de gerechtsambtenaren, de senior-gerechtsauditeurs en gerechtsauditeurs en de buitengriffiers kunnen in de
      nevenzittingsplaatsen alle werkzaamheden, ook buiten de terechtzitting, verrichten waartoe zij in de hoofdplaats
      bevoegd zijn.

      6 De griffie van de hoofdplaats is voor de zaken die in de nevenzittingsplaatsen worden behandeld, mede daar
      gevestigd.

      7 Stukken en zaken kunnen worden ingediend en gedeponeerd bij de griffie in de plaats waar de zaak wordt behandeld,
      met dien verstande dat in nevenzittingsplaatsen geen zaken kunnen worden gedeponeerd. Het bestuur kan in het
      bestuursreglement bepalen dat in een nevenzittingsplaats geen stukken kunnen worden ingediend.

      8 Onze Minister kan, na overleg met het bestuur van het gerechtshof, bepalen dat in een zaak de terechtzitting zal
      worden gehouden op een door hem aan te wijzen locatie in de hoofdplaats van het ressort, buiten de hoofdplaats van
      het ressort of buiten het ressort, indien dit noodzakelijk is in verband met de veiligheid van personen.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel59
  - number: '60'
    text: |-
      1 De gerechtshoven oordelen in hoger beroep over de daarvoor vatbare vonnissen, beschikkingen en uitspraken in
      burgerlijke zaken, strafzaken en belastingzaken van de rechtbanken in hun ressort.

      2 Het eerste lid is van overeenkomstige toepassing op het aan hoger beroep onderworpen deel van het vonnis van een
      rechtbank in een strafzaak dat betrekking heeft op de vordering van de benadeelde partij indien de vordering meer
      dan € 1 750 bedraagt.

      3 Het bestuur van het gerechtshof kan uit de bij het gerecht werkzame rechterlijke ambtenaren met rechtspraak
      belast raadsheren-commissarissen aanwijzen, belast met de behandeling van strafzaken.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel60
  - number: '61'
    text: |-
      De gerechtshoven nemen in eerste aanleg, tevens in hoogste ressort, kennis van jurisdictiegeschillen
      tussen rechtbanken binnen hun rechtsgebied, met uitzondering van geschillen als bedoeld in
      [artikel 8:9 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel89
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 8:9
  - number: '62'
    text: |-
      1 De gerechtshoven nemen in eerste aanleg, tevens in hoogste ressort, kennis van de voor hoger beroep vatbare
      burgerlijke zaken waarin partijen zijn overeengekomen deze bij de aanvang van het geding bij wege van prorogatie
      aanhangig te maken bij het gerechtshof dat in hoger beroep bevoegd zou zijn.

      2 Het eerste lid is niet van toepassing op zaken die niet ter vrije bepaling van partijen staan.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel62
  - number: 62b
    text: |-
      Indien een voortdurend gebrek aan voldoende zittingscapaciteit daartoe noodzaakt, kan bij algemene maatregel
      van bestuur voor de duur van ten hoogste twee jaar een ander dan het overeenkomstig [artikel 60][ref1] bevoegde
      gerechtshof worden aangewezen als het bevoegde gerechtshof voor zaken die behoren tot een bij die maatregel
      aangewezen categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel60
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel62b
