  - number: '121'
    text: |-
      De procureur-generaal bij de Hoge Raad waakt in het bijzonder voor de handhaving en uitvoering van wettelijke
      voorschriften bij de Hoge Raad, de gerechtshoven en de rechtbanken.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel121
  - number: '122'
    text: |-
      1 Indien naar het oordeel van de procureur-generaal bij de Hoge Raad het openbaar ministerie bij de uitoefening
      van zijn taak de wettelijke voorschriften niet naar behoren handhaaft of uitvoert, kan hij Onze Minister daarvan in
      kennis stellen.

      2 Op verzoek van de procureur-generaal worden hem vanwege het College van procureurs-generaal de inlichtingen
      verstrekt die hij nodig acht en worden hem de desbetreffende stukken overgelegd.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel122
  - number: '123'
    text: |-
      Het College van procureurs-generaal verleent de procureur-generaal bij de Hoge Raad de bijstand van het openbaar
      ministerie, die deze ter uitvoering van de aan hem opgedragen taken verlangt.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel123
  - number: '124'
    text: |-
      Het openbaar ministerie is belast met de strafrechtelijke handhaving van de rechtsorde en met andere bij de wet
      vastgestelde taken.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel124
  - number: '125'
    text: |-
      De taken en bevoegdheden van het openbaar ministerie worden, op de wijze bij of krachtens de wet bepaald,
      uitgeoefend door:

      a. het College van procureurs-generaal; en

      b. rechterlijke ambtenaren, bedoeld in [artikel 1, onderdeel b, onder 6° en 7°][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel1
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '1'
        hoofdstuk: '1'
  - number: 125a
    text: |-
      1 Indien bij of krachtens een wet een bevoegdheid wordt toegekend aan de officier van
      justitie, kan deze bevoegdheid worden uitgeoefend door de rechterlijke ambtenaren, bedoeld in
      [artikel 1, onderdeel b, onder 7°][ref1], van de wet, tenzij de regeling waarop de bevoegdheid steunt of de aard
      van de bevoegdheid zich daartegen verzet.

      2 Indien bij of krachtens een wet een bevoegdheid wordt toegekend aan de advocaat-generaal, kan deze bevoegdheid
      worden uitgeoefend door de rechterlijke ambtenaren, bedoeld in [artikel 1, onderdeel b, onder 6°][ref2], tenzij de
      regeling waarop de bevoegdheid steunt of de aard van de bevoegdheid zich daartegen verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel1
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel125a
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0001830
        artikel: '1'
        hoofdstuk: '1'
  - number: '126'
    text: |-
      1 De uitoefening van een of meer bevoegdheden van de hoofdofficier, de fungerend hoofdofficier, de plaatsvervangend
      hoofdofficier, de senior officier van justitie A, de senior officier van justitie, de officier van justitie,
      de substituut-officier van justitie, de officier enkelvoudige zittingen, de hoofdadvocaat-generaal, de
      plaatsvervangend hoofdadvocaat-generaal, de senior advocaat-generaal en de advocaat-generaal kan worden opgedragen
      aan een andere bij het parket werkzame ambtenaar voor zover het hoofd van het parket daarmee heeft ingestemd.

      2 De opgedragen bevoegdheid wordt in naam en onder verantwoordelijkheid van de rechterlijk ambtenaar, bedoeld in
      het eerste lid, uitgeoefend.

      3 De uitoefening van een bevoegdheid als bedoeld in het eerste lid, kan niet aan een andere bij het parket
      werkzame ambtenaar worden opgedragen indien de regeling waarop de bevoegdheid steunt of de aard van de bevoegdheid
      zich daartegen verzet. Daarvan is in elk geval sprake voor zover het gaat om het optreden ter terechtzitting in
      strafzaken en de toepassing van de dwangmiddelen als bedoeld in [Titel IV van het Eerste Boek van het Wetboek van
      Strafvordering](onbekend).

      4 Bij algemene maatregel van bestuur worden omtrent de toepassing van dit artikel nadere regels gesteld.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel126
  - number: '127'
    text: |-
      Onze Minister kan algemene en bijzondere aanwijzingen geven betreffende de uitoefening van de taken en bevoegdheden
      van het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel127
  - number: '128'
    text: |-
      1 Onze Minister stelt het College van procureurs-generaal in de gelegenheid zijn zienswijze kenbaar te maken
      voordat hij in een concreet geval een aanwijzing geeft inzake de opsporing of vervolging van strafbare feiten.

      2 Onze Minister deelt het College de voorgenomen aanwijzing en de motivering daarvan schriftelijk mede. Onze
      Minister kan het College voor het kenbaar maken van zijn zienswijze een termijn stellen. De zienswijze van het
      College wordt schriftelijk en gemotiveerd gegeven.

      3 Een aanwijzing als bedoeld in het eerste lid, wordt schriftelijk en gemotiveerd gegeven.

      4 Slechts indien de aanwijzing in verband met de vereiste spoed niet schriftelijk kan worden gegeven, kan zij
      mondeling worden gegeven. In dat geval wordt zij zo spoedig mogelijk doch in elk geval binnen een week daarna op
      schrift gesteld. Het voorgaande is van overeenkomstige toepassing op het mededelen van een voorgenomen aanwijzing
      door Onze Minister en voor het geven van de zienswijze door het College.

      5 De in het eerste lid bedoelde aanwijzing wordt, tezamen met de voorgenomen aanwijzing en de zienswijze van het
      College, door de officier van justitie bij de processtukken gevoegd. Voor zover het belang van de staat zich naar
      het oordeel van Onze Minister daartegen verzet, blijft voeging bij de processtukken achterwege, met dien verstande
      dat in dat geval bij de processtukken een verklaring wordt gevoegd waaruit blijkt dat een aanwijzing is gegeven.

      6 Indien het betreft een aanwijzing tot het niet of niet verder opsporen of vervolgen, stelt Onze Minister de
      beide Kamers der Staten-Generaal zo spoedig mogelijk in kennis van de aanwijzing, de voorgenomen aanwijzing en
      de zienswijze van het College, voor zover het verstrekken van de desbetreffende stukken niet in strijd is met het
      belang van de staat.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel128
  - number: '129'
    text: |-
      1 Het College verstrekt Onze Minister de inlichtingen die deze nodig heeft.

      2 De leden van het openbaar ministerie verstrekken het College de inlichtingen die het College nodig heeft.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel129
  - number: '130'
    text: |-
      1 Er is een College van procureurs-generaal.

      2 Het College staat aan het hoofd van het openbaar ministerie.

      3 Het College bestaat uit een bij algemene maatregel van bestuur te bepalen aantal van ten minste drie en
      ten hoogste vijf procureurs-generaal. Bij koninklijk besluit op voordracht van Onze Minister wordt een van de
      procureurs-generaal benoemd tot voorzitter van het College voor een periode van ten hoogste drie jaar. Hij kan
      eenmaal worden herbenoemd. De voorzitter ontvangt in verband met het verrichten van werkzaamheden als voorzitter
      een toelage op het salaris dat hij als procureur-generaal geniet, volgens bij algemene maatregel van bestuur te
      stellen regels. Toekenning van de toelage geschiedt door Onze Minister.

      4 Het College kan algemene en bijzondere aanwijzingen geven betreffende de uitoefening van de taken en bevoegdheden
      van het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel130
  - number: '131'
    text: |-
      1 Het College van procureurs-generaal kan geen beslissingen nemen indien niet ten minste drie leden aanwezig zijn.

      2 Het College neemt beslissingen bij meerderheid van stemmen.

      3 Indien de stemmen staken, geeft de stem van de voorzitter de doorslag.

      4 Bij reglement stelt het College nadere regels met betrekking tot zijn werkwijze en besluitvorming. Het reglement
      en wijzigingen daarvan behoeven de goedkeuring van Onze Minister. Het reglement of een wijziging daarvan wordt na
      de goedkeuring gepubliceerd in de Staatscourant.

      5 In het reglement wordt in ieder geval geregeld in welke gevallen de voorzitter een voorgenomen
      beslissing aan Onze Minister voorlegt, daaronder zijn in ieder geval begrepen de beslissingen bedoeld in
      [artikel 140a van het Wetboek van Strafvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel140a
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 140a
  - number: '132'
    text: |-
      1 Het College van procureurs-generaal verdeelt de werkzaamheden onder de procureurs-generaal.

      2 Onze Minister kan bepaalde werkzaamheden opdragen aan de voorzitter van het College.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel132
  - number: '133'
    text: |-
      1 Het College van procureurs-generaal kan een procureur-generaal machtigen een of meer van zijn bevoegdheden uit te
      oefenen, tenzij de regeling waarop de bevoegdheid steunt of de aard van de bevoegdheid zich daartegen verzet.

      2 De uitoefening van een bevoegdheid door een procureur-generaal overeenkomstig het eerste lid geschiedt in naam en
      onder verantwoordelijkheid van het College.

      3 Het College kan ten aanzien van de uitoefening van de bevoegdheid algemene en bijzondere aanwijzingen geven.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel133
  - number: '134'
    text: |-
      1 Het openbaar ministerie bestaat uit:

      a. het parket-generaal;

      b. de arrondissementsparketten;

      c. het landelijk parket;

      d. het functioneel parket;

      e. de ressortsparketten.

      2 De arrondissementsparketten en de ressortsparketten zijn gevestigd in de hoofdplaatsen van de rechtbanken
      respectievelijk van de gerechtshoven.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel134
  - number: '135'
    text: |-
      1 Bij het parket-generaal zijn werkzaam:

      a. de procureurs-generaal die het College vormen;

      b. andere ambtenaren.

      2 Bij het parket-generaal kunnen hoofdadvocaten-generaal, plaatsvervangende hoofdadvocaten-generaal, senior
      advocaten-generaal, advocaten-generaal, plaatsvervangende advocaten-generaal, hoofdofficieren, fungerend
      hoofdofficieren, plaatsvervangende hoofdofficieren, senior officieren van justitie A, senior officieren van
      justitie, officieren van justitie, substituut-officieren van justitie, plaatsvervangende officieren van justitie,
      officieren enkelvoudige zittingen en plaatsvervangende officieren enkelvoudige zittingen werkzaam zijn.

      3 Een in het tweede lid bedoelde hoofdadvocaat-generaal, plaatsvervangend hoofdadvocaat-generaal, senior advocaat-
      generaal of advocaat-generaal is van rechtswege plaatsvervangend advocaat-generaal bij de ressortsparketten.

      4 Een in het tweede lid bedoelde hoofdofficier, fungerend hoofdofficier, plaatsvervangend hoofdofficier, senior
      officier van justitie A, senior officier van justitie, officier van justitie of substituut-officier van justitie
      onderscheidenlijk officier enkelvoudige zittingen is van rechtswege plaatsvervangend officier van justitie
      onderscheidenlijk plaatsvervangend officier enkelvoudige zittingen bij de arrondissementsparketten, het functioneel
      parket en het landelijk parket.

      5 Aan het hoofd van het parket-generaal staat het College.

      6 De procureurs-generaal zijn van rechtswege plaatsvervangend advocaat-generaal bij de ressortsparketten,
      plaatsvervangend officier van justitie bij de arrondissementsparketten, plaatsvervangend officier van justitie bij
      het landelijk parket en plaatsvervangend officier van justitie bij het functioneel parket.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel135
  - number: '136'
    text: |-
      1 Bij een arrondissementsparket zijn werkzaam:

      a. een hoofdofficier;

      b. officieren van justitie;

      c. plaatsvervangende officieren van justitie;

      d. officieren enkelvoudige zittingen;

      e. plaatsvervangende officieren enkelvoudige zittingen;

      f. andere ambtenaren.

      2 Bij een arrondissementsparket kunnen werkzaam zijn:

      a. een fungerend hoofdofficier;

      b. een plaatsvervangend hoofdofficier;

      c. senior officieren van justitie A;

      d. senior officieren van justitie;

      e. substituut-officieren van justitie;

      f. rechterlijke ambtenaren in opleiding.

      3 Aan het hoofd van een arrondissementsparket staat de hoofdofficier met de titel hoofd van het
      arrondissementsparket. Hij kan algemene en bijzondere aanwijzingen geven aan de bij zijn parket werkzame ambtenaren
      betreffende de uitoefening van de taken en bevoegdheden van het parket.

      4 Indien in het arrondissement twee politieregio’s gelegen zijn, is bij het arrondissementsparket een fungerend
      hoofdofficier werkzaam. Bij de overige arrondissementsparketten is een plaatsvervangend hoofdofficier werkzaam. In
      geval van afwezigheid, belet of ontstentenis van het hoofd van het arrondissementsparket wordt hij vervangen door
      de fungerend onderscheidenlijk door de plaatsvervangend hoofdofficier.

      5 De hoofdofficieren, fungerend hoofdofficieren, plaatsvervangend hoofdofficieren, senior officieren van justitie
      A, senior officieren van justitie, officieren van justitie, substituut-officieren van justitie onderscheidenlijk
      officieren enkelvoudige zittingen zijn van rechtswege plaatsvervangend officier van justitie onderscheidenlijk
      plaatsvervangend officier enkelvoudige zittingen bij de overige arrondissementsparketten, bij het landelijk parket,
      bij het functioneel parket en bij het parket-generaal.

      6 De officier enkelvoudige zittingen en de plaatsvervangende officier enkelvoudige zittingen hebben de bevoegdheden
      en verplichtingen die bij of krachtens de wet aan de officier van justitie worden toegekend, met uitzondering van
      de bevoegdheid om op te treden ter terechtzitting van een meervoudige kamer van de rechtbank.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel136
