  - number: '97'
    text: |-
      1 Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de financiering van de rechtspraak.
      Daartoe behoren in elk geval regels betreffende:

      a. de objectieve meting van de werklast bij de gerechten;

      b. de vergoeding van de gerechtskosten;

      c. de voorschriften die aan de financiering kunnen worden verbonden in verband met de activiteiten van de gerechten
      en de daaraan verbonden werklast;

      d. de wijze waarop bij de financiering rekening kan worden gehouden met de naleving van de in onderdeel c bedoelde
      voorschriften in de voorafgaande periode;

      e. het door de Raad en de gerechten toe te passen begrotingsstelsel.

      2 Voordat een voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt
      gedaan, stelt Onze Minister de Raad in de gelegenheid schriftelijk zijn zienswijze kenbaar te maken. In de nota
      van toelichting bij de algemene maatregel van bestuur wordt aangegeven in hoeverre en op welke gronden van de
      zienswijze van de Raad is afgeweken.

      3 De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is voorgelegd.

      4 In het verslag, bedoeld in [artikel 104, eerste lid][ref1], besteedt de Raad aandacht aan de wijze waarop
      de algemene maatregel van bestuur is toegepast. Daarbij geeft de Raad aan op welke wijze de toepassing van de
      regeling zich verhoudt tot de kwaliteit van de taakuitvoering door de gerechten en doet hij zo nodig voorstellen
      tot wijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel104
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '104'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '6'
  - number: '98'
    text: |-
      1 Met inachtneming van de regels, bedoeld in [artikel 97, eerste lid][ref1], stelt de Raad jaarlijks,
      voorafgaand aan het desbetreffende begrotingsjaar, een voorstel vast voor een begroting van de Raad en de
      gerechten gezamenlijk, met inbegrip van de aan het toe te kennen budget te verbinden voorschriften, alsmede een
      meerjarenraming voor ten minste vier op het begrotingsjaar volgende jaren.

      2 Alvorens de Raad het begrotingsvoorstel en de meerjarenraming vaststelt, voert de Raad overleg met de gerechten.

      3 De Raad zendt het begrotingsvoorstel en de meerjarenraming voor een door Onze Minister te bepalen tijdstip aan
      Onze Minister.

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de voorbereiding
      en de inrichting van het begrotingsvoorstel en de meerjarenraming, met inbegrip van de daarbij behorende
      toelichting en bijlagen.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel97
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '97'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '6'
  - number: '99'
    text: |-
      1 De ontwerp-begroting, bedoeld in [artikel 12, eerste lid, van de Comptabiliteitswet 2001][ref1], wordt door
      Onze Minister opgesteld in overeenstemming met het begrotingsvoorstel van de Raad, tenzij zich het geval voordoet,
      bedoeld in het derde lid.

      2 Indien Onze Minister zich met het oog op een rechtmatig en doelmatig beheer van 's Rijks gelden niet kan
      verenigen met het begrotingsvoorstel van de Raad of een onderdeel daarvan, deelt hij dit mede aan de Raad en voert
      hij hierover met de Raad overleg.

      3 Indien het in het tweede lid bedoelde overleg niet tot overeenstemming leidt en Onze Minister overwegende
      bezwaren houdt, wordt het begrotingsvoorstel van de Raad of het desbetreffende onderdeel daarvan in gewijzigde vorm
      opgenomen in de ontwerp-begroting, bedoeld in [artikel 12, eerste lid, van de Comptabiliteitswet 2001][ref2].

      4 In de toelichting op het voorstel van wet geeft Onze Minister aan welke voorschriften hij voornemens is aan
      het krachtens [artikel 100][ref3] toe te kennen budget te verbinden. Het eerste tot en met het derde lid zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0001830#Artikel100
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel99
