  - number: '49'
    text: |-
      Het bestuur van de rechtbank te Arnhem vormt binnen de sector kanton een enkelvoudige kamer voor het behandelen en
      beslissen van militaire kantonzaken en bepaalt de bezetting daarvan. Degene die zitting heeft in deze kamer draagt
      de titel van militaire kantonrechter.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel49
  - number: '50'
    text: |-
      1 Het bestuur vormt voor het behandelen en beslissen van zaken waarvoor in verband met onverwijlde spoed een
      voorziening wordt gevraagd enkelvoudige kamers en bepaalt de bezetting daarvan. Deze kamers kunnen ook andere bij
      de wet aan hen toebedeelde zaken behandelen en beslissen.

      2 Degene die zitting heeft in een enkelvoudige kamer als bedoeld in het eerste lid draagt de titel van
      voorzieningenrechter.

      3 In kort geding als bedoeld in het [Wetboek van Burgerlijke Rechtsvordering][ref1] draagt de voorzieningenrechter
      ter terechtzitting de aanspreektitel van president in kort geding.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '51'
    text: |-
      1 Het bestuur vormt voor het behandelen en beslissen van strafzaken in eerste aanleg, niet zijnde kantonzaken als
      bedoeld in [artikel 47, eerste lid][ref1], enkelvoudige kamers. Het bestuur bepaalt de bezetting van deze kamers.

      2 Degene die zitting heeft in een enkelvoudige kamer als bedoeld in het eerste lid draagt de titel van
      politierechter.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel47
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel51
