      het Ministerie van Veiligheid en Justitie, tenzij bij of krachtens de wet is bepaald dat een andere minister dan
      Onze Minister de rechtshandeling verricht.

      2 De [artikelen 32, vierde lid][ref2], en [39 van de Comptabiliteitswet 2001][ref3] zijn van overeenkomstige
