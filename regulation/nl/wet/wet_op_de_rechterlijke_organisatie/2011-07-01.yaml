  - number: '2'
    text: |-
      De tot de rechterlijke macht behorende gerechten zijn:

      a. de rechtbanken;

      b. de gerechtshoven; en

      c. de Hoge Raad.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel2
  - number: '3'
    text: |-
      De [afdelingen 2][ref1] en [6][ref2] zijn niet van toepassing op de Hoge Raad.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Hoofdstuk2
