  - number: 48b
    text: |-
      1 Het in de [artikelen 46c][ref1], [46d][ref2], [46e][ref3], [46f][ref4],
      [46i, met uitzondering van het eerste lid onder c][ref5], [46j][ref6], [46l, eerste en derde lid][ref7],
      [46m][ref8], [46o][ref9] en [46p, van de Wet rechtspositie rechterlijk ambtenaren][ref10] bepaalde is van
      overeenkomstige toepassing ten aanzien van de deskundige leden van de pachtkamers en hun plaatsvervangers,
      met dien verstande dat voor de overeenkomstige toepassing van [artikel 46j][ref11] onderscheidenlijk
      [46o, tweede lid][ref12], onder functionele autoriteit wordt verstaan: bestuur onderscheidenlijk president van
      het gerecht.

      2 Zij genieten vergoeding voor hun reis- en verblijfkosten en verdere vergoeding volgens bij algemene maatregel van
      bestuur vast te stellen regels.

      3 Bij algemene maatregel van bestuur worden voorschriften gegeven ter uitvoering van dit artikel en van
      [artikel 48a][ref13].


