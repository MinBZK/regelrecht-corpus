        afdeling: '1'
  - number: '116'
    text: De procureur-generaal geeft leiding aan het parket bij de Hoge Raad.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel116
  - number: '117'
    text: |-
      In geval van afwezigheid, belet of ontstentenis wordt de procureur-generaal vervangen door de plaatsvervangend
      procureur-generaal en, bij afwezigheid, belet of ontstentenis ook van deze, door de advocaat-generaal oudste in
      rang.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel117
  - number: '118'
    text: |-
      Onze Minister kan de plaatsvervangend procureur-generaal of een advocaat-generaal belasten met de waarneming van
      het ambt van procureur-generaal.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel118
  - number: '119'
    text: |-
      1 Onze Minister kan, op aanbeveling van de procureur-generaal, als plaatsvervangend advocaat-
      generaal bij de Hoge Raad een rechterlijk ambtenaar, die bij een rechtbank, een gerechtshof
      of een tot het openbaar ministerie behorend parket werkzaam is in een ambt als bedoeld in
      [artikel 2, eerste tot en met derde lid, van de Wet rechtspositie rechterlijke ambtenaren][ref1], aanwijzen.
      De aanwijzing geschiedt voor een daarbij te bepalen termijn. De [artikelen 46c, eerste lid][ref2],
      [46d, eerste lid, onderdeel d][ref3], en [46e van de Wet rechtspositie rechterlijke ambtenaren][ref4] zijn op de
      plaatsvervangend advocaat-generaal van overeenkomstige toepassing.

      2 Aanwijzing van een bij een rechtbank of een gerechtshof werkzame rechterlijk ambtenaar tot plaatsvervangend
      advocaat-generaal geschiedt slechts met diens toestemming.

      3 Plaatsvervangende advocaten-generaal nemen, op de voet van een advocaat-generaal, conclusies voor zover zij
      daartoe door de procureur-generaal worden opgeroepen. Zij nemen in zodanig geval, wanneer de Hoge Raad ten
      principale recht doet, de taken en bevoegdheden van het openbaar ministerie, bedoeld in [artikel 125][ref5], waar.

      4 De president van de Hoge Raad kan, op aanbeveling van de procureur-generaal, een vice-president van, een
      raadsheer in of een raadsheer in buitengewone dienst bij de Hoge Raad, indien hij daarmee instemt, belasten met de
      waarneming van het ambt van advocaat-generaal bij de Hoge Raad.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46c
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel46d
      [ref4]: https://wetten.overheid.nl/BWBR0008365#Artikel46e
      [ref5]: https://wetten.overheid.nl/BWBR0001830#Artikel125
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel119
