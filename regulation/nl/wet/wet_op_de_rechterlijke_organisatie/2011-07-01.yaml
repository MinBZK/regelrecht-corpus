  - number: '17'
    text: |-
      1 Het bestuur kan slechts beslissingen nemen indien ten minste de helft van het aantal leden aanwezig is.

      2 Het bestuur beslist bij meerderheid van stemmen.

      3 Indien de stemmen staken, geeft de stem van de president de doorslag.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel17
  - number: '18'
    text: |-
      Het bestuur kan een of meer leden van het bestuur machtigen een of meer van zijn bevoegdheden uit te oefenen.
      [Afdeling 10.1.1 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.1.1
