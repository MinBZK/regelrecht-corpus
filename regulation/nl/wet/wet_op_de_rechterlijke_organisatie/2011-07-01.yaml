  - number: 48a
    text: |-
      1 De deskundige leden van de pachtkamers van de rechtbanken, bedoeld in [artikel 48, derde lid][ref1], van deze wet
      en hun plaatsvervangers worden benoemd bij koninklijk besluit op voordracht van Onze Minister, gehoord Gedeputeerde
      Staten. Zij worden genoemd lid, onderscheidenlijk plaatsvervangend lid van de pachtkamer.

      2 Om te kunnen worden benoemd tot lid of plaatsvervangend lid van een pachtkamer moet men Nederlander zijn.

      3 De deskundige leden en de plaatsvervangende leden van de pachtkamers worden voor de tijd van vijf jaren benoemd.
      Zij zijn bij hun aftreden weer benoembaar. Zij worden op eigen verzoek bij koninklijk besluit ontslagen.

      4 Bij de benoeming van de deskundige leden en van de plaatsvervangende leden dragen Wij zorg, dat in de pachtkamer
      noch het belang der pachters, noch het belang van de verpachters overheerst.

      5 De deskundige leden leggen alvorens zij met hun werkzaamheden aanvangen de eed of belofte af volgens het
      formulier zoals dat is vastgesteld in de [tweede bijlage][ref2] bij deze wet. Bij algemene maatregel van bestuur
      worden regels gesteld over hun beëdiging.

      6 Met ingang van de eerste dag van de maand volgende op die waarin een deskundig lid of een plaatsvervangend
      lid van de pachtkamer de leeftijd van zeventig jaren heeft bereikt, wordt aan hem bij koninklijk besluit ontslag
      verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0001830
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel48a
