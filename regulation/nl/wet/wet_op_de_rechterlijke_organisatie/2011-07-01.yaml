  - number: '78'
    text: |-
      1 De Hoge Raad neemt kennis van het beroep in cassatie tegen de handelingen, arresten, vonnissen en beschikkingen
      van de gerechtshoven en de rechtbanken, ingesteld hetzij door een partij, hetzij «in het belang der wet» door de
      procureur-generaal bij de Hoge Raad.

      2 Het eerste lid is niet van toepassing op de handelingen en uitspraken van de rechtbanken in zaken waarvan zij als
      administratieve rechter kennis nemen.

      3 Het eerste lid is voorts niet van toepassing ten aanzien van de handelingen en beslissingen
      van de rechtbanken en van het gerechtshof te Leeuwarden in zaken met betrekking tot de
      [Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref1] en in zaken betreffende bestuurlijke boeten
      opgelegd op grond van [artikel 154b van de Gemeentewet][ref2], met dien verstande dat de Hoge Raad wel kennis neemt
      van de eis tot «cassatie in het belang der wet» door de procureur-generaal.

      4 De Hoge Raad neemt kennis van het beroep in cassatie tegen uitspraken van de administratieve rechter voorzover
      dit bij wet is bepaald.

      5 Een partij kan geen beroep in cassatie instellen indien voor haar een ander gewoon rechtsmiddel openstaat of
      heeft opengestaan.

      6 Cassatie «in het belang der wet» kan niet worden ingesteld indien voor partijen een gewoon rechtsmiddel openstaat
      en brengt geen nadeel toe aan de rechten door partijen verkregen


      [ref1]: https://wetten.overheid.nl/BWBR0004581
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel154b
