  - number: '108'
    text: |-
      1 Tegen een besluit op grond van [artikel 107, eerste en tweede lid][ref1], kan een belanghebbende beroep instellen
      bij de Hoge Raad.

      2 De Hoge Raad beoordeelt of de Kroon in redelijkheid tot het oordeel heeft kunnen komen dat sprake is van
      ongeschiktheid anders dan wegens ziekte, onderscheidenlijk een ernstig vermoeden voor het bestaan daarvan, alsmede
      of Onze Minister bij zijn voordracht in strijd met [artikel 109][ref2] heeft gehandeld.

      3 Op het beroep is [hoofdstuk 8 van de Algemene wet bestuursrecht][ref3], met uitzondering van
      [afdeling 8.1.1][ref4] en de [artikelen 8:10,][ref5][8:11][ref6], [8:13][ref7] en [8:86][ref8], van overeenkomstige
      toepassing.


