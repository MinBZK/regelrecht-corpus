        artikel: 10:28
  - number: '33'
    text: |-
      1 De Raad maakt aan elk gerecht zo spoedig mogelijk na de vaststelling van de begroting van het Ministerie van
      Veiligheid en Justitie bekend, welk budget hij aan het gerecht toekent. Indien het budget afwijkt van het geraamde
      budget, bedoeld in [artikel 30][ref1] is de tweede volzin van dat artikel van overeenkomstige toepassing.

      2 Indien het budget afwijkt van het geraamde budget, bedoeld in [artikel 30][ref2], wijzigt het bestuur de
      begroting van het gerecht.

      3 Beslissingen tot andere wijzigingen van de begroting kunnen uiterlijk tot het eind van het desbetreffende
      begrotingsjaar worden genomen.

      4 De Raad wordt van de wijzigingen, bedoeld in het tweede en derde lid, terstond in kennis gesteld.

      5 Het bestuur doet de noodzakelijke uitgaven binnen de grenzen van de vastgestelde of gewijzigde begroting.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel30
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel33
