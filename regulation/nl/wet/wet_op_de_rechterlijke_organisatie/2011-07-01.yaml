  - number: 13e
    text: |-
      1 De Hoge Raad kan het betrokken gerechtsbestuur, degene op wiens gedraging het onderzoek betrekking heeft, de
      verzoeker en anderen verzoeken hem schriftelijk of mondeling inlichtingen te verstrekken.

      2 Het onderzoek geschiedt in raadkamer. De Hoge Raad kan, hetzij ambtshalve hetzij op verzoek van de procureur-
      generaal, het betrokken gerechtsbestuur, degene op wiens gedraging het onderzoek betrekking heeft of de verzoeker,
      getuigen horen.

      3 De Hoge Raad stelt het betrokken gerechtsbestuur en degene op wiens gedraging het onderzoek betrekking heeft, in
      de gelegenheid omtrent een aanhangige vordering zijn zienswijze schriftelijk of mondeling te doen blijken.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel13e
  - number: 13f
    text: |-
      1 De Hoge Raad beoordeelt of degene op wiens gedraging het onderzoek betrekking heeft, zich in de onderzochte
      aangelegenheid al dan niet behoorlijk heeft gedragen. De Hoge Raad kan tevens beoordelen of het betrokken
      gerechtsbestuur zich al dan niet behoorlijk heeft gedragen.

      2 De Hoge Raad neemt een schriftelijke en met redenen omklede beslissing.

      3 Een afschrift van de beslissing wordt gezonden aan de verzoeker, aan de rechterlijk ambtenaar op wiens gedraging
      het onderzoek betrekking had, en aan het betrokken gerechtsbestuur dan wel, indien het onderzoek betrekking had op
      een gedraging van een bij de Hoge Raad werkzame rechterlijk ambtenaar met rechtspraak belast, de president van de
      Hoge Raad.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel13f
  - number: 13g
    text: |-
      1 De procureur-generaal bij en de president van de Hoge Raad stellen jaarlijks een verslag op van de overeenkomstig
      de [artikelen 13a tot en met 13f][ref1] verrichte werkzaamheden.

      2 De procureur-generaal draagt er zorg voor dat het verslag openbaar wordt gemaakt en algemeen verkrijgbaar wordt
      gesteld. [Artikel 10 van de Wet openbaarheid van bestuur][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel13a
      [ref2]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel13g
