        artikel: 5c
  - number: '48'
    text: |-
      1 Het bestuur van de rechtbank vormt binnen de sector kanton enkelvoudige kamers en bepaalt de bezetting daarvan.
      Degene die zitting heeft in de enkelvoudige kamer draagt de titel van kantonrechter dan wel kantonrechter-
      plaatsvervanger.

      2 In afwijking van [artikel 47, eerste lid][ref1], vormt het bestuur van de rechtbank binnen de sector kanton
      meervoudige kamers onder de benaming van pachtkamers en bepaalt de bezetting daarvan.

      3 Een pachtkamer wordt bezet door twee personen, niet zijnde rechterlijk ambtenaar, als deskundige
      leden en een kantonrechter. Op de deskundige leden zijn de [artikelen 7, derde lid][ref2], [12][ref3] en
      [13 tot en met 13g][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel47
