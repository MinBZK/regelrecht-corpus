        artikel: '97'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '6'
  - number: '101'
    text: |-
      Onze Minister deelt zo spoedig mogelijk na de aanhangigmaking van het voorstel van wet tot vaststelling van de
      begroting van het Ministerie van Veiligheid en Justitie bij de Afdeling advisering van de Raad van State, aan de
      Raad mede welk budget, met inbegrip van de daaraan te verbinden voorschriften, voor het komende begrotingsjaar
      voorlopig kan worden verwacht. Hij deelt daarbij mede op welke wijze het geraamde budget is berekend.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel101
  - number: '102'
    text: |-
      1 De Raad stelt jaarlijks een jaarplan vast voor de Raad en de gerechten gezamenlijk. Het plan omvat:

      a. een omschrijving van de voorgenomen activiteiten ter uitvoering van de in [artikel 91][ref1] genoemde taken voor
      het jaar volgend op het jaar waarin het plan is vastgesteld;

      b. een begroting voor het komende begrotingsjaar.

      2 De Raad stelt de begroting vast in overeenstemming met het geraamde budget, bedoeld in [artikel 101][ref2].

      3 De Raad zendt het jaarplan voor een door Onze Minister te bepalen tijdstip aan Onze Minister. Onze Minister zendt
      het jaarplan onverwijld aan de beide kamers der Staten-Generaal.

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de inrichting van
      het jaarplan.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel101
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel102
    references:
