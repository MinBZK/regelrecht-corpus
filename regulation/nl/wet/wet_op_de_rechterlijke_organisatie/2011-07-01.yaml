      1 Het bestuur van het gerechtshof te Arnhem vormt voor het behandelen en beslissen van zaken waarin door de
      militaire kamer van de rechtbank te Arnhem vonnis is gewezen een meervoudige kamer onder de benaming van militaire
      kamer. Het bestuur bepaalt de bezetting van deze kamer.

      2 De militaire kamer bestaat uit twee rechterlijke ambtenaren met rechtspraak belast en een militair lid, dat bij
      voorkeur behoort tot het krijgsmachtdeel waartoe de verdachte behoort of behoorde. Bij de behandeling van een zaak
      tegen verdachten van verschillende krijgsmachtdelen bepaalt de voorzitter van de kamer uit welk krijgsmachtdeel
      het militaire lid afkomstig is. Op het militaire lid zijn de [artikelen 7, derde lid][ref1], [12][ref2] en
      [13 tot en met 13g][ref3] van overeenkomstige toepassing.

      3 De militaire kamer oordeelt ook over het beklag over niet vervolging in militaire zaken als bedoeld in
      [artikel 12 van het Wetboek van Strafvordering][ref4].


