  - number: '90'
    text: |-
      1 Er is een College van afgevaardigden.

      2 Het College bestaat uit vertegenwoordigers van de gerechten, de Centrale Raad van Beroep en het College
      van Beroep voor het bedrijfsleven. Bij algemene maatregel van bestuur worden nadere regels gesteld omtrent de
      samenstelling en inrichting van het College en de afvaardiging van de leden.

      3 Het College heeft tot taak de Raad gevraagd of ongevraagd te adviseren omtrent de uitvoering van zijn taken.

      4 De Raad verstrekt desgevraagd aan het College de voor de uitoefening van zijn taak benodigde inlichtingen.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel90
  - number: '91'
    text: |-
      1 De Raad is belast met:

      a. de voorbereiding van de begroting voor de Raad en de gerechten gezamenlijk;

      b. de toekenning van budgetten ten laste van de rijksbegroting aan de gerechten;

      c. de ondersteuning van de bedrijfsvoering bij de gerechten;

      d. het toezicht op de uitvoering van de begroting door de gerechten;

      e. het toezicht op de bedrijfsvoering bij de gerechten;

      f. landelijke activiteiten op het gebied van werving, selectie, aanstelling, benoeming en opleiding van het
      personeel bij de gerechten.

      2 Ter uitvoering van de in het eerste lid, onder c en e, genoemde taken is de zorg van de Raad in het bijzonder
      gericht op:

      a. automatisering en bestuurlijke informatievoorziening;

      b. huisvesting en beveiliging;

      c. de kwaliteit van de bestuurlijke en organisatorische werkwijze van de gerechten;

      d. personeelsaangelegenheden;

      e. overige materiële voorzieningen.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel91
  - number: '92'
    text: |-
      1 De Raad kan ter uitvoering van de in [artikel 91][ref1] genoemde taken algemene aanwijzingen geven aan de
      besturen van de gerechten voorzover dit noodzakelijk is met het oog op een goede bedrijfsvoering van de gerechten.

      2 Alvorens een aanwijzing te geven stelt de Raad het College van afgevaardigden in de gelegenheid zijn zienswijze
      kenbaar te maken. In de motivering van de aanwijzing geeft de Raad aan op welke wijze hij de zienswijze van het
      College in zijn beoordeling heeft betrokken.

      3 Een aanwijzing wordt gepubliceerd in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel91
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel92
