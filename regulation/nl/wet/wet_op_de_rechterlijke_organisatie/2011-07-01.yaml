  - number: 13c
    text: |-
      Onverminderd [artikel 13a, eerste lid][ref1], kan de procureur-generaal ook ambtshalve bij de Hoge Raad een
      vordering instellen tot het doen van een onderzoek naar de wijze waarop een rechterlijk ambtenaar met rechtspraak
      belast zich in de uitoefening van zijn functie heeft gedragen. [Artikel 13b, tweede en derde lid][ref2], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel13a
