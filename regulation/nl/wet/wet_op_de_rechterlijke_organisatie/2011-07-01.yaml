      1 Het bestuur van het gerechtshof te Arnhem vormt een meervoudige kamer die is belast met het
      behandelen en beslissen van zaken in beroep als bedoeld in de [artikelen 502][ref1], [509v][ref2] en
      [509ff van het Wetboek van Strafvordering][ref3]. Het bestuur bepaalt de bezetting van deze kamer.

      2 Deze kamer is voorts belast met het verstrekken van adviezen ingevolge
      [artikel 43, derde lid, van de Wet overdracht tenuitvoerlegging strafvonnissen][ref4].

      3 Deze kamer wordt voor de beslissing in zaken in beroep als bedoeld in de [artikelen 502][ref5], [509v][ref6] en
      [509ff van het Wetboek van Strafvordering][ref7] aangevuld met twee personen, niet zijnde rechterlijk ambtenaar,
      als deskundige leden. In de overige zaken kan de voorzitter van de kamer deze leden toevoegen. Op de deskundige
      leden zijn de [artikelen 7, derde lid][ref8], [12][ref9] en [13 tot en met 13g][ref10] van deze wet en de
      [artikelen 46c][ref11], [46d][ref12], [46f][ref13], [46i, met uitzondering van het eerste lid, onderdeel c][ref14],
      [46j][ref15], [46l, eerste en derde lid][ref16], [46m][ref17], [46o][ref18] en
      [46p van de Wet rechtspositie rechterlijke ambtenaren][ref19] van overeenkomstige toepassing, met dien verstande
      dat voor de overeenkomstige toepassing van [artikel 46j][ref20] onderscheidenlijk [artikel 46o, tweede lid][ref21],
      onder functionele autoriteit wordt verstaan: bestuur onderscheidenlijk president van het gerecht.

      4 De deskundige leden worden bij koninklijk besluit benoemd voor een periode van vijf jaar. Er kunnen ook
      plaatsvervangers worden benoemd.

      5 De deskundige leden leggen alvorens zij met hun werkzaamheden aanvangen de eed of belofte af volgens het
      formulier zoals dat is vastgesteld in de [tweede bijlage][ref22] bij deze wet. Bij algemene maatregel van bestuur
      worden regels gesteld over hun beëdiging.

      6 Bij algemene maatregel van bestuur worden regels gesteld over het kostuum, de afwezigheid, de afwisseling, de
      vergoeding voor reis- en verblijfskosten en nadere vergoeding van de deskundige leden en hun plaatsvervangers.


