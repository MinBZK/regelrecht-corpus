  - number: '72'
    text: |-
      1 De Hoge Raad bestaat uit een president, ten hoogste zeven vice-presidenten, ten hoogste dertig raadsheren en ten
      hoogste vijftien raadsheren in buitengewone dienst.

      2 De raadsheren in buitengewone dienst verrichten, als raadsheer, werkzaamheden voorzover zij daartoe door de
      president worden opgeroepen.

      3 Bij de Hoge Raad is een griffier werkzaam.

      4 Bij de Hoge Raad kunnen gerechtsauditeurs en een substituut-griffier werkzaam zijn.

      5 Voor de toepassing van het eerste lid worden de president van, de vice-presidenten van en de raadsheren in de
      Hoge Raad aan wie buitengewoon verlof zonder behoud van bezoldiging is verleend, voor de duur van dat verlof en
      gedurende ten hoogste een jaar daarna buiten beschouwing gelaten.

      6 Voor de toepassing van het eerste lid worden rechterlijke ambtenaren die zijn aangesteld voor een minder dan
      volledige arbeidsduur, geteld overeenkomstig de breuk die hun arbeidsduur aangeeft.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel72
  - number: '73'
    text: |-
      1 In geval van ziekte of andere verhindering wordt de president vervangen door een vice-president.

      2 In geval van ziekte of andere verhindering van de griffier wordt hij, bij gebreke van een substituut-griffier,
      vervangen door een waarnemend griffier.

      3 De waarnemend griffiers worden door Onze Minister benoemd op aanbeveling van de Hoge Raad. Alvorens voor de
      eerste keer door de president van de Hoge Raad te worden opgeroepen leggen zij de eed of belofte af. Bij of
      krachtens algemene maatregel van bestuur wordt het formulier voor de eed of belofte vastgesteld en worden regels
      gesteld over de beëdiging. Aan een waarnemend griffier wordt volgens bij of krachtens algemene maatregel van
      bestuur te stellen regels door Onze Minister een vergoeding toegekend.

      4 Een waarnemend griffier wordt op eigen verzoek door Onze Minister ontslagen. Onze Minister stelt de president van
      de Hoge Raad hiervan op de hoogte.

      5 Onze Minister kan een waarnemend griffier ontslaan:

      a. indien hij gedurende een periode van ten minste drie jaar geen griffierswerkzaamheden heeft verricht;

      b. op grond van ongeschiktheid anders dan wegens ziekte; of

      c. wegens het doen of nalaten van iets wat een persoon, werkzaam ten behoeve van de Hoge Raad, behoort na te laten
      of te doen.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel73
  - number: '74'
    text: De Hoge Raad geeft advies of inlichtingen wanneer dat vanwege de regering wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel74
  - number: '75'
    text: |-
      1 De Hoge Raad vormt, op voorstel van de president, een of meer meervoudige kamers en, voor de gevallen waarin de
      wet dat voorschrijft, een of meer enkelvoudige kamers en bepaalt de bezetting daarvan.

      2 Bij de Hoge Raad worden zaken, behoudens bij de wet bepaalde uitzonderingen, behandeld en beslist door vijf leden
      van een meervoudige kamer, van wie een als voorzitter optreedt.

      3 De voorzitter van een meervoudige kamer kan bepalen dat een zaak die daarvoor naar zijn oordeel geschikt is,
      wordt behandeld en beslist door drie leden van die kamer. Indien de zaak naar het oordeel van een van deze leden
      ongeschikt is voor behandeling en beslissing door drie leden, wordt de behandeling voortgezet door vijf leden.

      4 De Hoge Raad stelt, op voorstel van de president, een reglement van inwendige dienst vast. In dit reglement wordt
      de indeling in kamers vastgelegd.

      5 Het reglement wordt gepubliceerd in de Staatscourant.

      6 De Hoge Raad stelt een regeling vast voor de behandeling van klachten.
      [Artikel 26, vierde tot en met zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel26
