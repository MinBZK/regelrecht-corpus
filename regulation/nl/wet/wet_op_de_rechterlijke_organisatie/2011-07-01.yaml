      1 Het bestuur verstrekt desgevraagd aan de Raad de voor de uitoefening van zijn taak benodigde inlichtingen.

      2 De Raad kan omtrent de verstrekking van inlichtingen algemene aanwijzingen geven voorzover de gevraagde
      inlichtingen betrekking hebben op beslissingen en handelingen ter uitvoering van de taken, genoemd in
