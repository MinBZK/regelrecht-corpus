      1 Bij een ressortsparket zijn werkzaam:

      a. een hoofdadvocaat-generaal;

      b. een plaatsvervangend hoofdadvocaat-generaal;

      c. advocaten-generaal;

      d. plaatsvervangende advocaten-generaal;

      e. andere ambtenaren.

      2 Bij een ressortsparket kunnen senior advocaten-generaal werkzaam zijn.

      3 Aan het hoofd van een ressortsparket staat een hoofdadvocaat-generaal met de titel hoofd van het ressortsparket.
      Hij kan algemene en bijzondere aanwijzingen geven aan de bij zijn parket werkzame ambtenaren betreffende de
      uitoefening van de taken en bevoegdheden van het parket. In geval van afwezigheid, belet of ontstentenis van het
      hoofd van het ressortsparket wordt hij vervangen door de plaatsvervangend hoofdadvocaat-generaal.

      4 De hoofdadvocaten-generaal, plaatsvervangende hoofdadvocaten-generaal, senior advocaten-generaal en advocaten-
      generaal zijn van rechtswege plaatsvervangend advocaat-generaal bij de overige ressortsparketten en bij het parket-
      generaal.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel138
