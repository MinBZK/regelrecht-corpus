  - number: '20'
    text: |-
      1 Het bestuur stelt binnen het gerecht ten hoogste vier organisatorische eenheden in onder de benaming sectoren.

      2 Binnen een sector als bedoeld in het eerste lid worden in de enkelvoudige en meervoudige kamers de soorten zaken
      behandeld en beslist die door het bestuur aan die sector zijn opgedragen.

      3 Met uitzondering van de raadsheren-plaatsvervangers en rechters-plaatsvervangers,
      die hun ambt niet vervullen op basis van een aanwijzing als bedoeld in
      [artikel 5f, derde lid, van de Wet rechtspositie rechterlijke ambtenaren][ref1], vormen de binnen een sector
      werkzame rechterlijke ambtenaren, rechterlijke ambtenaren in opleiding en gerechtsambtenaren tezamen de
      sectorvergadering.

      4 De raadsheren-plaatsvervangers en rechters-plaatsvervangers die ingevolge het derde lid niet van de
      sectorvergadering deel uitmaken, kunnen daar op uitnodiging aan deelnemen.

      5 Gerechtsambtenaren nemen niet deel aan een stemming over de juridische kwaliteit en uniforme rechtstoepassing,
      bedoeld in [artikel 23, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel5f
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel23
