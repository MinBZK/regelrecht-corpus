  - number: 96a
    text: |-
      De Raad stelt een regeling vast voor de behandeling van klachten. [Artikel 26, vierde tot en met zesde lid][ref1],
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel26
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel96a
