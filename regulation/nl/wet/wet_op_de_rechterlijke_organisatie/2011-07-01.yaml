  - number: '94'
    text: |-
      De Raad heeft tot taak ondersteuning te bieden aan activiteiten van de gerechten die gericht zijn op uniforme
      rechtstoepassing en bevordering van de juridische kwaliteit.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel94
  - number: '95'
    text: |-
      1 De Raad heeft tot taak regering en Staten-Generaal te adviseren omtrent algemeen verbindende voorschriften en
      te voeren beleid van het Rijk op het terrein van de rechtspleging. De adviezen van de Raad worden vastgesteld na
      overleg met de gerechten.

      2 [Hoofdstuk 4 van de Kaderwet adviescolleges][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0008159
        hoofdstuk: '4'
  - number: '96'
    text: |-
      1 Bij de uitvoering van de taken, bedoeld in de [artikelen 94][ref1] en [95][ref2], treedt de Raad niet in de
      procesrechtelijke behandeling van, de inhoudelijke beoordeling van alsmede de beslissing in een concrete zaak.

      2 Bij de uitvoering van de overige taken en bevoegdheden, toegedeeld bij of krachtens deze wet, is het eerste lid
      van overeenkomstige toepassing met dien verstande dat de Raad ook niet treedt in de procesrechtelijke behandeling
      van, de inhoudelijke beoordeling van alsmede de beslissing in categorieën van zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel94
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel95
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel96
