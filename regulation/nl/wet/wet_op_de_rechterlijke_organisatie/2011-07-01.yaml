  - number: '86'
    text: |-
      1 De rechterlijke leden van de Raad ontvangen in verband met het verrichten van de werkzaamheden als lid van de
      Raad een toelage op het salaris dat zij als rechterlijk ambtenaar, lid van de Centrale Raad van Beroep of lid
      van het College van Beroep voor het bedrijfsleven genieten. Het bedrag van de toelage is gelijk aan het verschil
      tussen dat salaris en de bij algemene maatregel van bestuur voor de functie van rechterlijk lid van de Raad vast
      te stellen salarishoogte. Toekenning van de toelage geschiedt door de Raad voor de rechtspraak uitgezonderd het
      betrokken lid.

      2 Een lid van de Raad wordt bij koninklijk besluit op voordracht van Onze Minister ontslagen bij de aanvaarding van
      een ambt dat of een betrekking die volgens [artikel 84][ref1] onverenigbaar is met het lidmaatschap van de Raad.
      Een niet-rechterlijk lid van de Raad wordt tevens als lid van de Raad bij koninklijk besluit op voordracht van
      Onze Minister ontslagen indien hij wordt benoemd als rechterlijk ambtenaar met rechtspraak belast, met rechtspraak
      belast lid van de Centrale Raad van Beroep of met rechtspraak belast lid van het College van Beroep voor het
      bedrijfsleven.

      3 Een rechterlijk lid van de Raad wordt bij koninklijk besluit op voordracht van Onze Minister ontslagen
      onderscheidenlijk geschorst als lid van de Raad indien hij als rechterlijk ambtenaar met rechtspraak
      belast dan wel met rechtspraak belast lid van de Centrale Raad van Beroep of het College van Beroep
      voor het bedrijfsleven wordt ontslagen onderscheidenlijk geschorst, tenzij dat ontslag of die schorsing
      alleen een rechtsprekend ambt betreft dat hij niet op basis van een aanstelling als bedoeld in
      [artikel 5f, eerste lid, van de Wet rechtspositie rechterlijke ambtenaren][ref2] vervult.

      4 Een rechterlijk lid van de Raad wordt op eigen verzoek bij koninklijk besluit op voordracht van Onze Minister
      ontslagen.

      5 Een niet-rechterlijk lid van de Raad wordt disciplinair gestraft, geschorst en ontslagen bij koninklijk besluit
      op voordracht van Onze Minister.

      6 Ten aanzien van een niet-rechterlijk lid van de Raad worden de in de [Ambtenarenwet][ref3] aan het bevoegd
      gezag toegekende bevoegdheden uitgeoefend door de Raad, uitgezonderd het niet-rechterlijk lid van de Raad. Bij of
      krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de uitoefening van rechtspositionele
      bevoegdheden ten aanzien van een niet-rechterlijk lid door de Raad uitgezonderd het niet-rechterlijk lid.

      7 Ten aanzien van een rechterlijk lid van de Raad worden de in de [artikelen 7][ref4], [17][ref5], [18][ref6],
      [18a][ref7], [40][ref8], [45][ref9] en [46 van de Wet rechtspositie rechterlijke ambtenaren][ref10] aan het
      gerechtsbestuur toegekende bevoegdheden uitgeoefend door de Raad uitgezonderd het rechterlijk lid. Bij of
      krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de uitoefening van rechtspositionele
      bevoegdheden ten aanzien van een rechterlijk lid door de Raad uitgezonderd het rechterlijk lid.

      8 Bij algemene maatregel van bestuur worden nadere regels gesteld over de rechtspositie van de leden van de Raad,
      waaronder in ieder geval regels betreffende de in het eerste lid bedoelde toelage van de rechterlijke leden alsmede
      het salaris van een niet-rechterlijk lid.


