  - number: '55'
    text: |-
      1 Het bestuur van de rechtbank te Arnhem vormt voor het behandelen en beslissen van zaken als bedoeld in
      [artikel 2 van de Wet militaire strafrechtspraak][ref1], enkelvoudige en meervoudige kamers onder de benaming van
      militaire kamers. Het bestuur bepaalt de bezetting van deze kamers.

      2 Een meervoudige kamer bestaat uit twee rechterlijke ambtenaren met rechtspraak belast en een militair lid, dat
      bij voorkeur afkomstig is uit het krijgsmachtdeel waartoe de verdachte behoort of behoorde. Bij de behandeling
      van een zaak tegen verdachten van verschillende krijgsmachtdelen bepaalt de voorzitter van de kamer uit welk
      krijgsmachtdeel het militaire lid afkomstig is. Op het militaire lid zijn de [artikelen 7, derde lid][ref2],
      [12][ref3] en [13 tot en met 13g][ref4] van overeenkomstige toepassing.

      3 Degene die zitting heeft in een enkelvoudige militaire kamer draagt de titel van militaire politierechter.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel7
