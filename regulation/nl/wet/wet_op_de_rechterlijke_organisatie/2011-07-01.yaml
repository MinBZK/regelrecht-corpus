  - number: '77'
    text: |-
      1 De Hoge Raad neemt in eerste aanleg, tevens in hoogste ressort, kennis van jurisdictiegeschillen tussen:

      a. rechtbanken, tenzij [artikel 61][ref1] van toepassing is;

      b. gerechtshoven;

      c. een gerechtshof en een rechtbank;

      d. een tot de rechterlijke macht behorend gerecht en een niet tot de rechterlijke macht behorend gerecht;

      e. administratieve rechters, tenzij een andere administratieve rechter daartoe bevoegd is.

      2 Indien het jurisdictiegeschil is gerezen tussen de Hoge Raad en een ander in het eerste lid genoemd gerecht,
      wordt de Hoge Raad ter beslissing daarvan zoveel mogelijk samengesteld uit raadsheren die van de zaak nog geen
      kennis genomen hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel61
