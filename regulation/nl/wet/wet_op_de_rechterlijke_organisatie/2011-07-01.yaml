        afdeling: '2'
  - number: '8'
    text: |-
      Raadsheren-plaatsvervangers en rechters-plaatsvervangers kunnen door het bestuur worden opgeroepen voor de
      behandeling en beslissing van zaken.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel8
  - number: '9'
    text: |-
      De Raad kan in overeenstemming met de bij een gerechtshof of rechtbank werkzame rechterlijk ambtenaar en het
      bestuur van het gerecht waar hij werkzaam is, die rechterlijk ambtenaar belasten met de waarneming van een ander
      rechterlijk ambt bij een ander gerechtshof of andere rechtbank.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel9
  - number: '10'
    text: |-
      1 In de hoofdplaats en de nevenvestigingsplaats is de griffie alle werkdagen gedurende ten minste zes uren per
      dag geopend.

      2 In de nevenzittingsplaats is de griffie niet alle werkdagen, of minder dan zes uren per dag, geopend.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel10
  - number: '11'
    text: Bij algemene maatregel van bestuur worden regels gesteld omtrent de orde van dienst binnen de gerechten.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel11
  - number: '12'
    text: |-
      De rechterlijke ambtenaren met rechtspraak belast, de senior-gerechtsauditeurs en gerechtsauditeurs, de
      rechterlijke ambtenaren in opleiding en de griffier en substituut-griffier van de Hoge Raad mogen zich niet op
      enige wijze inlaten met partijen of hun advocaten of gemachtigden over enige voor hen aanhangige geschillen of
      geschillen waarvan zij weten of vermoeden dat die voor hen aanhangig zullen worden.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel12
  - number: '13'
    text: |-
      De rechterlijke ambtenaren met rechtspraak belast, de senior-gerechtsauditeurs en gerechtsauditeurs, de
      rechterlijke ambtenaren in opleiding, de griffier, substituut-griffier en waarnemend griffiers van de Hoge Raad,
      gerechtsambtenaren en buitengriffiers, bedoeld in [artikel 14, vierde lid][ref1], zijn verplicht tot geheimhouding
      van de gegevens waarover zij bij de uitoefening van hun ambt de beschikking krijgen en waarvan zij het
      vertrouwelijke karakter kennen of redelijkerwijs moeten vermoeden, behoudens voorzover enig wettelijk voorschrift
      hen tot mededeling verplicht of uit hun ambt de noodzaak tot mededeling voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel14
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel13
