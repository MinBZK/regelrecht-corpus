  - number: '85'
    text: |-
      1 Voorafgaand aan de voordracht, bedoeld in [artikel 84, derde lid][ref1], stelt Onze Minister in overeenstemming
      met de Raad een lijst vast van maximaal zes personen die voor de vervulling van de desbetreffende vacature in
      aanmerking lijken te komen.

      2 De lijst wordt ter beschikking gesteld aan een commissie van aanbeveling. Deze bestaat uit een president van
      een gerecht, een vertegenwoordiger van de Nederlandse Vereniging voor Rechtspraak, een lid van het College van
      afgevaardigden, een directeur bedrijfsvoering van een gerecht en een door Onze Minister aangewezen persoon. De
      president is voorzitter.

      3 De commissie stelt uit de lijst een aanbeveling op van maximaal drie personen. Zij zendt deze uiterlijk acht
      weken na vaststelling van de lijst aan Onze Minister.

      4 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de procedure, bedoeld in dit
      artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel84
