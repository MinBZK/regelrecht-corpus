    text: |-
      1 De sectorvoorzitter is belast met de dagelijkse leiding van de sector.

      2 De sectorvoorzitter is voorzitter van de sectorvergadering.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel21
  - number: '22'
    text: |-
      1 Met uitzondering van de raadsheren-plaatsvervangers en rechters-plaatsvervangers,
      die hun ambt niet vervullen op basis van een aanwijzing als bedoeld in
      [artikel 5f, derde lid, van de Wet rechtspositie rechterlijke ambtenaren][ref1], vormen de bij een gerecht werkzame
      rechterlijke ambtenaren met rechtspraak belast, de senior-gerechtsauditeurs en gerechtsauditeurs, die tevens
      raadsheer-plaatsvervanger of rechter-plaatsvervanger zijn, en de rechterlijke ambtenaren in opleiding tezamen de
      gerechtsvergadering.

      2 De president is voorzitter van de gerechtsvergadering.

      3 De bij het gerecht werkzame gerechtsambtenaren, senior-gerechtsauditeurs, gerechtsauditeurs, die niet
      tevens raadsheer-plaatsvervanger of rechter-plaatsvervanger zijn, en de raadsheren-plaatsvervangers
      en rechters-plaatsvervangers, die hun ambt niet vervullen op basis van een aanwijzing als bedoeld in
      [artikel 5f, derde lid, van de Wet rechtspositie rechterlijke ambtenaren][ref2], kunnen op uitnodiging deelnemen
      aan de gerechtsvergadering.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel5f
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel5f
