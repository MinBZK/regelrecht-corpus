  - number: '63'
    text: |-
      1 Het bestuur vormt voor het behandelen en beslissen van zaken waarvoor in verband met onverwijlde spoed een
      voorziening wordt gevraagd enkelvoudige kamers en bepaalt de bezetting daarvan. Deze kamers kunnen ook andere bij
      de wet aan hen toebedeelde zaken behandelen en beslissen.

      2 Degene die zitting heeft in een enkelvoudige kamer als bedoeld in het eerste lid draagt de titel van
      voorzieningenrechter.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel63
  - number: '64'
    text: |-
      Het bestuur vormt voor het behandelen en beslissen van zaken waarin door de economische kamers van de rechtbanken
      vonnis is gewezen dan wel een bevel of een beschikking is gegeven, enkelvoudige en meervoudige kamers onder de
      benaming van economische kamers. Het bestuur bepaalt de bezetting van deze kamers.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel64
  - number: '65'
    text: |-
      Het bestuur van het gerechtshof te Amsterdam vormt voor het behandelen en beslissen in hoger beroep van zaken
      waarin door de douanekamers van de rechtbank te Haarlem uitspraak is gedaan enkelvoudige en meervoudige kamers
      onder de benaming van douanekamers. Het bestuur bepaalt de bezetting van deze kamers.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel65
  - number: '66'
    text: |-
      1 Het bestuur van het gerechtshof te Amsterdam vormt voor het behandelen en beslissen van zaken
      als bedoeld in [Boek 2 van het Burgerlijk Wetboek][ref1], de [artikelen 173][ref2], [217][ref3]
      en [218 van de Pensioenwet][ref4], [artikel 5 van de Wet op de Europese ondernemingsraden][ref5],
      [artikel 26 van de Wet op de ondernemingsraden][ref6], [artikel 36 van de Wet medezeggenschap op scholen][ref7]
      en de [artikelen 997][ref8] en [1000 van het Wetboek van Burgerlijke Rechtsvordering][ref9] een meervoudige kamer
      onder de benaming van ondernemingskamer en bepaalt de bezetting daarvan.

      2 De ondernemingskamer bestaat uit drie rechterlijke ambtenaren met rechtspraak belast en twee personen, niet
      zijnde rechterlijk ambtenaar, als deskundige leden. Op de deskundige leden zijn de [artikelen 7, derde lid][ref10],
      [12][ref11] en [13 tot en met 13g][ref12] van deze wet en de [artikelen 46c][ref13], [46d][ref14], [46f][ref15],
      [46i, met uitzondering van het eerste lid, onderdeel c][ref16], [46j][ref17], [46l, eerste en derde lid][ref18],
      [46m][ref19], [46o][ref20] en [46p van de Wet rechtspositie rechterlijke ambtenaren][ref21] van overeenkomstige
      toepassing, met dien verstande dat voor de overeenkomstige toepassing van [artikel 46j][ref22] onderscheidenlijk
      [artikel 46o, tweede lid][ref23], onder functionele autoriteit wordt verstaan: bestuur onderscheidenlijk president
      van het gerecht.

      3 Het bestuur van het gerechtshof te 's-Gravenhage vormt voor het behandelen en beslissen van zaken als bedoeld in
      [artikel 46d, onderdeel i, van de Wet op de ondernemingsraden][ref24] een meervoudige kamer en bepaalt de bezetting
      daarvan. Het tweede lid is van overeenkomstige toepassing.

      4 De deskundige leden worden bij koninklijk besluit benoemd voor een periode van vijf jaar. Er kunnen ook
      plaatsvervangers worden benoemd.

      5 De deskundige leden leggen alvorens zij met hun werkzaamheden aanvangen de eed of belofte af volgens het
      formulier zoals dat is vastgesteld in de [tweede bijlage][ref25] bij deze wet. Bij algemene maatregel van bestuur
      worden regels gesteld over hun beëdiging.

      6 Bij algemene maatregel van bestuur worden regels gesteld over het kostuum, de afwezigheid, de afwisseling, de
      vergoeding voor reis- en verblijfskosten en nadere vergoeding van de deskundige leden en hun plaatsvervangers.


