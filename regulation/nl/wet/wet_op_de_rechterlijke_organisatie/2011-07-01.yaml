    text: |-
      1 In afwijking van [artikel 32, eerste lid, van de Comptabiliteitswet 2001][ref1], verricht het bestuur namens
      de Staat privaatrechtelijke rechtshandelingen voorzover die voortvloeien uit het door hem beheerde deel van de
      begroting van het Ministerie van Veiligheid en Justitie, tenzij bij of krachtens de wet is bepaald dat een andere
      minister dan Onze Minister de rechtshandeling verricht.

      2 De [artikelen 32, vierde lid][ref2], en [39 van de Comptabiliteitswet 2001][ref3] zijn van overeenkomstige
      toepassing.


