  - number: '40'
    text: |-
      1 Rechterlijke ambtenaren met rechtspraak belast, werkzaam bij de rechtbanken zijn:

      a. senior rechters A;

      b. senior rechters;

      c. rechters;

      d. rechters-plaatsvervangers.

      2 De rechterlijke ambtenaren met rechtspraak belast in een rechtbank zijn van rechtswege rechter-plaatsvervanger in
      de overige rechtbanken.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel40
  - number: '41'
    text: |-
      1 De rechtbank is gevestigd in de hoofdplaats van het arrondissement.

      2 De nevenvestigingsplaatsen van de rechtbank zijn vermeld in de bij deze wet behorende bijlage. Bij algemene
      maatregel van bestuur kunnen nevenzittingsplaatsen worden aangewezen. Tevens kunnen bij algemene maatregel
      van bestuur regels worden gesteld voor de verdeling van zaken over de hoofdplaats en de nevenvestigings- en
      nevenzittingsplaatsen.

      3 De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is voorgelegd.

      4 Het bestuur verdeelt de zaken over de hoofdplaats en de nevenvestigings- en nevenzittingsplaatsen, met
      inachtneming van de regels, bedoeld in het tweede lid.

      5 De rechterlijke ambtenaren met rechtspraak belast, de niet-rechterlijke leden van een meervoudige kamer, de
      gerechtsambtenaren, de rechterlijke ambtenaren in opleiding, de senior-gerechtsauditeurs en gerechtsauditeurs
      en de buitengriffiers kunnen in de nevenvestigings- en nevenzittingsplaatsen alle werkzaamheden, ook buiten de
      terechtzitting, verrichten waartoe zij in de hoofdplaats bevoegd zijn.

      6 De griffie van de hoofdplaats is voor de zaken die in de nevenvestigings- en nevenzittingsplaatsen worden
      behandeld, mede daar gevestigd.

      7 Stukken en zaken kunnen worden ingediend en gedeponeerd bij de griffie in de plaats waar de zaak wordt behandeld,
      met dien verstande dat in nevenzittingsplaatsen geen zaken kunnen worden gedeponeerd. Het bestuur kan in het
      bestuursreglement bepalen dat in een nevenzittingsplaats geen stukken kunnen worden ingediend.

      8 Onze Minister kan, na overleg met het bestuur van de rechtbank, bepalen dat in een zaak de terechtzitting
      zal worden gehouden op een door hem aan te wijzen locatie in de hoofdplaats van het arrondissement, buiten de
      hoofdplaats van het arrondissement of buiten het arrondissement, indien dit noodzakelijk is in verband met de
      veiligheid van personen.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel41
  - number: '42'
    text: |-
      De rechtbanken nemen in eerste aanleg kennis van alle burgerlijke zaken, behoudens bij de wet bepaalde
      uitzonderingen.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel42
  - number: '43'
    text: |-
      De rechtbanken nemen in eerste aanleg kennis van de bestuursrechtelijke zaken waarvan de kennisneming bij de wet
      aan hen is opgedragen.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel43
  - number: '44'
    text: |-
      De rechtbanken nemen in eerste aanleg kennis van de belastingzaken waarvan de kennisneming bij de wet aan hen is
      opgedragen.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel44
  - number: '45'
    text: |-
      1 De rechtbanken nemen in eerste aanleg kennis van alle strafzaken, behoudens bij de wet bepaalde uitzonderingen.

      2 De rechtbanken nemen ook kennis van de vordering tot vergoeding van kosten en schaden ten behoeve van de
      benadeelde partij in strafzaken.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel45
  - number: '46'
    text: |-
      Het bestuur van de rechtbank wijst uit de bij het gerecht werkzame rechterlijke ambtenaren met rechtspraak belast
      rechters-commissarissen aan, belast met de behandeling van strafzaken.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel46
  - number: '47'
    text: |-
      1 Er is een sector kanton waarbinnen in enkelvoudige kamers kantonzaken worden behandeld en beslist.

      2 De sector kanton verricht zijn taken in de arrondissementshoofdplaats alsmede in de nevenvestigingsplaatsen die
      zijn vermeld in de bijlage, bedoeld in [artikel 41, tweede lid][ref1], en in de nevenzittingsplaatsen die krachtens
      [artikel 41, tweede lid][ref2], zijn aangewezen.

      3 Het bestuur hoort de sectorvergadering van de sector kanton over:

      a. het opmaken van een lijst van aanbeveling voor een opengevallen plaats binnen de sector kanton als bedoeld in
      [artikel 5c, eerste lid, van de Wet rechtspositie rechterlijke ambtenaren][ref3];

      b. het houden van zittingen door de sector kanton in nevenzittingsplaatsen;

      c. de verdeling van kantonzaken over de hoofdplaats en nevenvestigings- en nevenzittingsplaatsen.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel5c
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel47
