  - number: '14'
    text: |-
      1 Bij een gerecht zijn werkzaam:

      a. rechterlijke ambtenaren met rechtspraak belast, en

      b. gerechtsambtenaren.

      2 Bij een gerecht kunnen senior-gerechtsauditeurs, gerechtsauditeurs en rechterlijke ambtenaren in opleiding
      werkzaam zijn.

      3 De daartoe door het bestuur van een gerecht aangewezen gerechtsambtenaren, rechterlijke ambtenaren in
      opleiding, senior-gerechtsauditeurs en gerechtsauditeurs verrichten de werkzaamheden die bij of krachtens de wet
      aan de griffier zijn opgedragen. Zij zijn bevoegd deze werkzaamheden ook voor andere gerechten uit te voeren. De
      aanwijzing geschiedt schriftelijk.

      4 Het bestuur van een gerecht kan personen, niet zijnde rechterlijk ambtenaar met rechtspraak belast,
      gerechtsambtenaar, rechterlijk ambtenaar in opleiding, senior-gerechtsauditeur of gerechtsauditeur, benoemen
      tot buitengriffier. Zij kunnen in die hoedanigheid door het bestuur worden opgeroepen voor het verrichten van
      werkzaamheden die bij of krachtens de wet aan de griffier zijn opgedragen. Het derde lid, tweede volzin, is van
      overeenkomstige toepassing. Alvorens voor de eerste keer te worden opgeroepen leggen zij de eed of belofte af. Bij
      of krachtens algemene maatregel van bestuur wordt het formulier voor de eed of belofte vastgesteld en worden regels
      gesteld over de beëdiging. Aan de buitengriffiers wordt volgens bij of krachtens algemene maatregel van bestuur te
      stellen regels door het gerechtsbestuur een vergoeding toegekend.

      5 Een buitengriffier wordt op eigen verzoek door het bestuur van het gerecht ontslagen.

      6 Het bestuur van het gerecht kan een buitengriffier ontslaan:

      a. indien hij gedurende een periode van ten minste drie jaar geen griffierswerkzaamheden heeft verricht;

      b. op grond van ongeschiktheid anders dan wegens ziekte; of

      c. wegens het doen of nalaten van hetgeen een persoon, werkzaam ten behoeve van een gerecht, behoort na te laten of
      te doen.

      7 Indien een gerechtsambtenaar, rechterlijk ambtenaar in opleiding, senior-gerechtsauditeur, gerechtsauditeur of
      buitengriffier griffierswerkzaamheden verricht ter ondersteuning van een rechterlijk ambtenaar met rechtspraak
      belast of een deskundig lid, is hij verplicht te voldoen aan de aanwijzingen van die rechterlijk ambtenaar of dat
      deskundig lid.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel14
  - number: 14a
    text: |-
      1 Degene die een klacht heeft over de wijze waarop een rechterlijk ambtenaar met rechtspraak belast zich in de
      uitoefening van zijn functie jegens hem heeft gedragen, kan, tenzij de klacht een rechterlijke beslissing betreft,
      de procureur-generaal bij de Hoge Raad verzoeken een vordering in te stellen bij de Hoge Raad tot het doen van een
      onderzoek naar die gedraging.

      2 Het verzoekschrift dient de naam en het adres van de verzoeker te bevatten; de bedoelde gedraging en de daartegen
      gerezen klacht moeten er zo duidelijk mogelijk in worden beschreven.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel14a
  - number: 14b
    text: |-
      1 De procureur-generaal voldoet aan het verzoek tenzij:

      a. niet is voldaan aan de vereisten, vermeld in [artikel 14a, tweede lid][ref1];

      b. reeds aanstonds blijkt dat het verzoekschrift onredelijk lange tijd na het ontstaan van de klacht is ingediend
      of geen genoegzame gronden inhoudt om het instellen van een onderzoek te vorderen;

      c. een verzoekschrift van de verzoeker, dezelfde gedraging betreffende, in behandeling is of - behoudens indien een
      nieuw feit of een nieuwe omstandigheid, dezelfde gedraging betreffende, is bekend geworden en zulks tot een ander
      oordeel zou hebben kunnen leiden - is afgedaan;

      d. voor de verzoeker met betrekking tot de klacht een voorziening bij een rechterlijke instantie openstaat of heeft
      opengestaan en hij daarvan geen gebruik heeft gemaakt, dan wel ten aanzien van die klacht een uitspraak van een
      rechterlijke instantie is gedaan waartegen geen rechtsmiddel openstaat;

      e. door de procureur-generaal een vordering als bedoeld in [artikel 46o][ref2]
      juncto [artikel 46d, tweede lid][ref3], [46f][ref4], [46g][ref5], [46l][ref6] of
      [46m van de Wet rechtspositie rechterlijke ambtenaren][ref7], is of zal worden ingesteld;

      f. de verzoeker overeenkomstig de regeling, bedoeld in [artikel 26, eerste lid][ref8], van de Wet op de
      rechterlijke organisatie, een klacht kan of had kunnen indienen.

      2 De procureur-generaal stelt de verzoeker en de ambtenaar op wiens gedraging het verzoekschrift betrekking heeft
      in de gelegenheid hem inlichtingen te verstrekken. Hij hoort de in de eerste volzin bedoelde personen, wanneer
      dezen dit verzoeken.

      3 De procureur-generaal stelt de verzoeker en de ambtenaar op wiens gedraging het verzoekschrift betrekking
      heeft op de hoogte van de uitkomsten van het vooronderzoek. Staat naar het oordeel van de procureur-generaal met
      betrekking tot de klacht een voorziening bij een rechterlijke instantie open, dan geeft hij daarvan kennis aan
      de verzoeker.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel14a
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46o
