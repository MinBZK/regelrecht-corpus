  - number: '87'
    text: |-
      1 Indien de Raad bestaat uit drie leden, kan hij alleen beslissingen nemen indien ten minste twee leden aanwezig
      zijn. Indien de Raad bestaat uit vier of vijf leden, kan hij alleen beslissingen nemen indien ten minste drie leden
      aanwezig zijn.

      2 De Raad beslist bij meerderheid van stemmen.

      3 Indien de stemmen staken, geeft de stem van de voorzitter de doorslag.

      4 De Raad stelt bij reglement nadere regels vast met betrekking tot zijn werkwijze en besluitvorming. Het reglement
      wordt aan Onze Minister gezonden en gepubliceerd in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel87
  - number: '88'
    text: |-
      De Raad kan een of meer leden machtigen een of meer van zijn bevoegdheden uit te oefenen.
      [Afdeling 10.1.1 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.1.1
