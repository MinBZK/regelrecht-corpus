preamble:
  text: |-
    Wij WILLEM, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, Groot-Hertog van Luxemburg, enz.,
    enz., enz.

    Allen die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat, volgens art. 163 van de grondwet, moet worden ingevoerd "een algemeen
    wetboek van burgerlijk regt, van koophandel, van lijfstraffelijk regt, van de zamenstelling der regterlijke magt en
    van de manier van procederen;"

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal,

    Hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze, te arresteren de navolgende Wet op de
    zamenstelling der Regterlijke Magt en het beleid der Justitie voor het Koninkrijk der Nederlanden.
  url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. gerechten: de gerechten, genoemd in [artikel 2][ref1];

      b. rechterlijke ambtenaren:

      1°. de president van, de vice-presidenten van, de raadsheren in en de raadsheren in buitengewone dienst bij de
      Hoge Raad;

      2°. de senior raadsheren, de raadsheren en de raadsheren-plaatsvervangers in de gerechtshoven;

      3°. de senior rechters A, de senior rechters, de rechters en de rechters-plaatsvervangers in de rechtbanken;

      4°. de procureur-generaal, de plaatsvervangend procureur-generaal, de advocaten-generaal en de advocaten-generaal
      in buitengewone dienst bij de Hoge Raad;

      5°. de procureurs-generaal die het College van procureurs-generaal, bedoeld in [artikel 130][ref2], vormen;

      6°. de hoofdadvocaten-generaal, de plaatsvervangende hoofdadvocaten-generaal, de senior advocaten-generaal, de
      advocaten-generaal en de plaatsvervangende advocaten-generaal bij de ressortsparketten en het parket-generaal;

      7°. de hoofdofficieren, de fungerende hoofdofficieren, de plaatsvervangende hoofdofficieren, de senior
      officieren van justitie A, de senior officieren van justitie, de officieren van justitie, de substituut-
      officieren van justitie, de plaatsvervangende officieren van justitie, de officieren enkelvoudige zittingen en
      de plaatsvervangende officieren enkelvoudige zittingen bij de arrondissementsparketten, het landelijk parket, het
      functioneel parket en het parket-generaal;

      8°. de senior-gerechtsauditeurs en gerechtsauditeurs bij de gerechten;

      9°. de griffier en de substituut-griffier van de Hoge Raad;

      c. rechterlijke ambtenaren met rechtspraak belast: de rechterlijke ambtenaren, genoemd in onderdeel b, onder 1° tot
      en met 3°;

      d. gerechtsambtenaren: burgerlijke rijksambtenaren op basis van een aanstelling werkzaam bij een gerecht;

      e. Hoge Raad: Hoge Raad der Nederlanden;

      f. Onze Minister: Onze Minister van Veiligheid en Justitie;

      g. de Raad: de Raad voor de rechtspraak, bedoeld in [artikel 84][ref3];

      h. zittingscapaciteit: beschikbare zittingsruimte, beschikbare capaciteit aan rechterlijke ambtenaren met
      rechtspraak belast of beschikbare capaciteit aan gerechtsambtenaren benodigd voor de behandeling van zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel130
