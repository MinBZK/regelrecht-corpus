  - number: 14c
    text: |-
      De vordering van de procureur-generaal tot het instellen van een onderzoek naar de in het verzoekschrift bedoelde
      gedraging wordt behandeld door een voor de behandeling van deze vorderingen bij het reglement van orde aangewezen
      Kamer, die zitting houdt met drie leden.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel14c
  - number: 14d
    text: |-
      1 De Hoge Raad stelt de verzoeker en de ambtenaar op wiens gedraging het verzoekschrift betrekking heeft in de
      gelegenheid naar aanleiding van de vordering van de procureur-generaal, al dan niet in elkaars tegenwoordigheid, te
      worden gehoord.

      2 Het onderzoek geschiedt in raadkamer. Het college kan, hetzij op verzoek van de procureur-generaal, hetzij op
      verzoek van een der in het eerste lid bedoelde personen, hetzij ambtshalve getuigen horen.

      3 De Hoge Raad stelt het bestuur van het gerechtshof onderscheidenlijk de rechtbank in de gelegenheid omtrent een
      aanhangige klacht schriftelijk of mondeling inlichtingen te verstrekken en van zijn gevoelen daaromtrent te doen
      blijk geven, indien de klacht is gericht tegen een rechterlijk ambtenaar met rechtspraak belast, werkzaam bij dat
      gerechtshof onderscheidenlijk die rechtbank.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel14d
  - number: 14e
    text: |-
      1 De Hoge Raad beslist bij een arrest, waarin hij zijn bevindingen met betrekking tot de in het verzoekschrift
      genoemde bezwaren opneemt en zijn oordeel uitspreekt over de gegrondheid daarvan.

      2 Een afschrift van het arrest wordt gezonden aan de verzoeker en aan de ambtenaar op wiens gedraging het
      verzoekschrift betrekking heeft. De Hoge Raad zendt een afschrift van het arrest aan het bestuur van het betrokken
      gerecht dan wel, indien de klacht gericht is tegen een rechterlijk ambtenaar met rechtspraak belast, werkzaam bij
      de Hoge Raad, aan de president van de Hoge Raad.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel14e
  - number: '15'
    text: |-
      1 Bij elk gerecht is een bestuur, dat bestaat uit een voorzitter, de sectorvoorzitters en een niet-rechterlijk lid.

      2 De voorzitter van het bestuur en de sectorvoorzitters zijn rechterlijke ambtenaren met
      rechtspraak belast die hun rechtsprekend ambt op basis van een aanstelling als bedoeld in
      [artikel 5f, eerste lid, van de Wet rechtspositie rechterlijke ambtenaren][ref1] vervullen.

      3 De voorzitter van het bestuur draagt de titel van president.

      4 Het niet-rechterlijk lid is een gerechtsambtenaar en draagt de titel van directeur bedrijfsvoering.

      5 De bestuursleden worden bij koninklijk besluit op voordracht van Onze Minister benoemd voor een periode van zes
      jaar. Zij kunnen worden herbenoemd.

      6 Voor de benoeming van een bestuurslid stelt de Raad een aanbeveling op. Voordat de Raad een aanbeveling opstelt,
      hoort hij het bestuur van het desbetreffende gerecht. Het bestuur stelt de Raad daarbij tevens op de hoogte van de
      zienswijze van de ondernemingsraad.

      7 Een lid van het bestuur kan niet tevens zijn lid van de Raad dan wel lid van het bestuur van een ander gerecht.

      8 Een lid van het bestuur kan niet tevens zijn:

      a. lid van de Staten-Generaal;

      b. minister;

      c. staatssecretaris;

      d. vice-president of lid van de Raad van State;

      e. president of lid van de Algemene Rekenkamer;

      f. Nationale ombudsman of substituut-ombudsman;

      g. advocaat of notaris, dan wel anderszins van het verlenen van rechtskundige bijstand het beroep maken;

      h. ambtenaar bij een ministerie, alsmede de daaronder ressorterende instellingen, diensten en bedrijven.

      9 De voorzitter van het bestuur en de sectorvoorzitters kunnen niet tevens rechterlijk ambtenaar, genoemd in
      [artikel 1, onderdeel b, onder 1° en 4° tot en met 9°][ref2], zijn.

      10 De directeur bedrijfsvoering kan niet tevens rechterlijk ambtenaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel5f
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel1
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel15
