  - number: '25'
    text: |-
      1 Ten aanzien van de gerechtsambtenaren worden de in de [Ambtenarenwet][ref1] aan het bevoegd gezag toegekende
      bevoegdheden uitgeoefend door het bestuur, met dien verstande dat deze bevoegdheden ten aanzien van de directeur
      bedrijfsvoering worden uitgeoefend door het bestuur uitgezonderd de directeur bedrijfsvoering.

      2 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de uitoefening van
      rechtspositionele bevoegdheden ten aanzien van de gerechtsambtenaren door het bestuur onderscheidenlijk het bestuur
      uitgezonderd de directeur bedrijfsvoering en door de Raad voor de rechtspraak.

      3 Ten aanzien van de rechterlijk ambtenaar, die tevens voorzitter van het bestuur of sectorvoorzitter is, worden
      de bij en krachtens de [Wet rechtspositie rechterlijke ambtenaren][ref2] aan het bestuur toegekende bevoegdheden
      uitgeoefend door het bestuur uitgezonderd die rechterlijk ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0001947
      [ref2]: https://wetten.overheid.nl/BWBR0008365
