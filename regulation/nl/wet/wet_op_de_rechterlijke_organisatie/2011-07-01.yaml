  - number: '104'
    text: |-
      1 De Raad dient jaarlijks voor een door Onze Minister te bepalen tijdstip bij Onze Minister een verslag in. Onze
      Minister zendt het verslag onverwijld aan de beide kamers der Staten-Generaal.

      2 Het verslag bestaat uit de jaarrekening met bijbehorende begroting, de daarin aangebrachte wijzigingen, het
      jaarverslag en overige financiële gegevens.

      3 In de jaarrekening wordt rekening en verantwoording afgelegd van het financiële beheer van de Raad en de
      gerechten gezamenlijk over het voorafgaande begrotingsjaar.

      4 In het jaarverslag wordt vermeld op welke wijze de werkzaamheden ten behoeve waarvan het budget ten laste van
      de rijksbegroting is verleend, zijn uitgevoerd. Daarbij wordt aangegeven op welke wijze deze werkzaamheden zich
      verhouden tot het plan zoals dit overeenkomstig [artikel 102][ref1] voor het desbetreffende jaar is vastgesteld, de
      plannen, bedoeld in [artikel 31, eerste lid][ref2], en de verslagen, bedoeld in [artikel 35, eerste lid][ref3].

      5 Het verslag omvat een verklaring omtrent de getrouwheid en de rechtmatigheid, afgegeven door een door de Raad
      aangewezen accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref4]. De
      accountant voegt bij de verklaring een rapport naar aanleiding van de controle op het financiële beheer. Bij de
      aanwijzing van de accountant wordt bedongen dat aan Onze Minister op diens verzoek inzicht wordt geboden in de
      controle-rapporten van de accountant.

      6 Onze Minister kan een aanwijzing vaststellen inzake de reikwijdte en de intensiteit van de accountantscontrole.

      7 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de inrichting van het
      verslag.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel102
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0001830#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel393
