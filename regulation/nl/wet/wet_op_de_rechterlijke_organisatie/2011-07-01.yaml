  - number: '4'
    text: |-
      1 Tenzij bij de wet anders is bepaald, zijn, op straffe van nietigheid, de zittingen openbaar.

      2 Om gewichtige redenen kan het onderzoek ter zitting geheel of gedeeltelijk plaatsvinden met gesloten deuren. In
      het proces-verbaal van de zitting worden de redenen vermeld.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel4
  - number: '5'
    text: |-
      1 Op straffe van nietigheid geschiedt de uitspraak van vonnissen en arresten in burgerlijke zaken en strafzaken in
      het openbaar en bevatten deze beslissingen de gronden waarop zij berusten.

      2 Op straffe van nietigheid worden de beschikkingen, vonnissen en arresten in burgerlijke zaken en strafzaken
      gewezen en de uitspraken in bestuursrechtelijke zaken gedaan met het in deze wet bepaalde aantal rechterlijke
      ambtenaren met rechtspraak belast.

      3 Indien bij de wet is bepaald dat ook anderen dan rechterlijke ambtenaren deel uitmaken van een meervoudige kamer,
      zijn de beslissingen van de desbetreffende meervoudige kamer tevens nietig, indien deze beslissingen niet zijn
      genomen met het in deze wet bepaalde aantal personen, niet zijnde rechterlijk ambtenaar.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel5
  - number: '6'
    text: |-
      1 Het bestuur van een gerecht vormt voor het behandelen en beslissen van zaken en het beëdigen van de daartoe bij
      de wet aangewezen functionarissen enkelvoudige en meervoudige kamers en bepaalt de bezetting daarvan.

      2 Tenzij in deze wet anders is bepaald, bestaan de meervoudige kamers uit drie rechterlijke ambtenaren met
      rechtspraak belast, van wie een als voorzitter optreedt. Indien ook anderen dan rechterlijke ambtenaren deel
      uitmaken van een meervoudige kamer, treedt een rechterlijk ambtenaar met rechtspraak belast op als voorzitter.

      3 Het bestuur kan bepalen dat in een zaak in verband met de veiligheid van personen dan wel indien de zitting
      langer dan een dag zal duren, een of meer rechterlijke ambtenaren met rechtspraak belast zich met het oog op
      mogelijke vervanging van een van de leden van een meervoudige kamer gereed houden. Deze rechterlijke ambtenaren
      zijn bij de behandeling ter terechtzitting van die zaak aanwezig, maar nemen aan het onderzoek in en de
      beraadslaging en beslissing over die zaak niet deel, tenzij zij op verzoek van de voorzitter van de meervoudige
      kamer in de plaats treden van een van de afwezige leden.

      4 Dit artikel is niet van toepassing op de Hoge Raad.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel6
  - number: '7'
    text: |-
      1 De voorzitter van de meervoudige kamer doet in raadkamer hoofdelijk omvraag. De voorzitter geeft als laatste
      zijn oordeel.

      2 Ieder lid is verplicht aan de besluitvorming deel te nemen.

      3 De rechterlijke ambtenaren met rechtspraak belast, de senior-gerechtsauditeurs en gerechtsauditeurs, de
      rechterlijke ambtenaren in opleiding, de griffier, substituut-griffier en waarnemend griffiers van de Hoge Raad,
      gerechtsambtenaren en buitengriffiers, bedoeld in [artikel 14, vierde lid][ref1], zijn tot geheimhouding verplicht
      van hetgeen in de raadkamer over aanhangige zaken is geuit.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel14
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel7
    references:
