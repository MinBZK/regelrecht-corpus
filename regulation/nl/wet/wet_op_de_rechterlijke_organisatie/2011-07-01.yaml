  - number: '109'
    text: |-
      Bij de uitvoering van de bevoegdheden, toegedeeld bij of krachtens deze wet, treedt Onze Minister niet in de
      procesrechtelijke behandeling van, de inhoudelijke beoordeling van alsmede de beslissing in een concrete zaak of in
      categorieën van zaken.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel109
  - number: '111'
    text: |-
      1 Er is een parket bij de Hoge Raad, aan het hoofd waarvan de procureur-generaal bij de Hoge Raad staat.

      2 De procureur-generaal bij de Hoge Raad is belast met:

      a. de vervolging van ambtsmisdrijven en ambtsovertredingen begaan door de leden van de Staten-Generaal, de
      ministers en de staatssecretarissen;

      b. het nemen van aan de Hoge Raad uit te brengen conclusies in de bij de wet bepaalde gevallen;

      c. de instelling van cassatie «in het belang der wet»;

      d. de instelling van vorderingen tot het door de Hoge Raad nemen van beslissingen als bedoeld in
      [hoofdstuk 6A van de Wet rechtspositie rechterlijke ambtenaren][ref1].

      3 In de gevallen waarin de Hoge Raad ten principale recht doet, neemt de procureur-generaal bij de Hoge Raad de
      taken en bevoegdheden van het openbaar ministerie, bedoeld in [artikel 125][ref2], waar.

      4 Bij de wet kan de procureur-generaal bij de Hoge Raad ook met andere taken worden belast.

      5 De bevoegdheden van de procureur-generaal kunnen, tenzij de aard van de bevoegdheden zich daartegen verzet, mede
      worden uitgeoefend door de plaatsvervangend procureur-generaal en door advocaten-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Hoofdstuk6A
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel125
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0008365
        hoofdstuk: 6A
      - id: ref2
        bwb_id: BWBR0001830
        artikel: '125'
        hoofdstuk: '4'
        afdeling: '1'
  - number: '113'
    text: |-
      1 Het parket bij de Hoge Raad bestaat uit een procureur-generaal, een plaatsvervangend procureur-generaal, ten
      hoogste tweeëntwintig advocaten-generaal en ten hoogste elf advocaten-generaal in buitengewone dienst.

      2 De advocaten-generaal in buitengewone dienst nemen, als advocaat-generaal, conclusies voorzover zij daartoe door
      de procureur-generaal worden opgeroepen. Zij nemen in zodanig geval, wanneer de Hoge Raad ten principale recht
      doet, de taken en bevoegdheden van het openbaar ministerie, bedoeld in [artikel 125][ref1], waar.

      3 Voor de toepassing van het eerste lid worden de procureur-generaal, de plaatsvervangend procureur-generaal, en de
      advocaten-generaal bij de Hoge Raad aan wie buitengewoon verlof zonder behoud van bezoldiging is verleend, voor de
      duur van dat verlof en gedurende ten hoogste een jaar daarna buiten beschouwing gelaten.

      4 Voor de toepassing van het eerste lid worden rechterlijke ambtenaren die zijn aangesteld voor een minder dan
      volledige arbeidsduur, geteld overeenkomstig de breuk die hun arbeidsduur aangeeft.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel125
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel113
