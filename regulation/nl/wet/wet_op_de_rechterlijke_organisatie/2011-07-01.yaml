  - number: '16'
    text: |-
      1 De voorzitter onderscheidenlijk de sectorvoorzitter ontvangt in verband met het verrichten van de werkzaamheden
      als voorzitter onderscheidenlijk sectorvoorzitter een toelage op het salaris dat hij als rechterlijk ambtenaar
      geniet. Na het verstrijken van een benoemingsduur van ten minste zes aaneengesloten jaren ontvangt de voorzitter
      onderscheidenlijk de sectorvoorzitter, met ingang van de datum waarop hij zijn werkzaamheden als zodanig beëindigt,
      gedurende drie jaren een toelage op het salaris dat hij als rechterlijk ambtenaar geniet. Het bedrag van de
      toelage is gelijk aan het verschil tussen dat salaris en de bij algemene maatregel van bestuur voor de functie van
      voorzitter onderscheidenlijk sectorvoorzitter vast te stellen salarishoogte. Toekenning van de toelage geschiedt
      door het bestuur uitgezonderd de betrokken voorzitter onderscheidenlijk sectorvoorzitter.

      2 Een lid van het bestuur wordt bij koninklijk besluit op voordracht van Onze Minister ontslagen bij de aanvaarding
      van een ambt dat of een betrekking die ingevolge [artikel 15][ref1] onverenigbaar is met het zijn van lid van het
      bestuur van het gerecht.

      3 De voorzitter en de sectorvoorzitter worden bij koninklijk besluit op voordracht van Onze Minister
      ontslagen onderscheidenlijk geschorst als lid van het bestuur indien zij als rechterlijk ambtenaar met
      rechtspraak belast worden ontslagen onderscheidenlijk geschorst, tenzij dat ontslag of die schorsing
      alleen een rechtsprekend ambt betreft dat zij niet vervullen op basis van een aanstelling als bedoeld in
      [artikel 5f, eerste lid, van de Wet rechtspositie rechterlijke ambtenaren][ref2].

      4 De voorzitter en de sectorvoorzitter worden op eigen verzoek bij koninklijk besluit op voordracht van Onze
      Minister ontslagen.

      5 De directeur bedrijfsvoering wordt disciplinair gestraft, geschorst en ontslagen bij koninklijk besluit op
      voordracht van Onze Minister. Onze Minister doet zijn voordracht op voorstel van de Raad.

      6 Bij algemene maatregel van bestuur worden nadere regels gesteld over de rechtspositie van de bestuursleden,
      waaronder in ieder geval regels betreffende de in het eerste lid bedoelde toelage van de voorzitter en de
      sectorvoorzitter alsmede het salaris van de directeur bedrijfsvoering.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel5f
