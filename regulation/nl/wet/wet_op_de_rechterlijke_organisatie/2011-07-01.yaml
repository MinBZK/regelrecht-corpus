  - number: '120'
    text: |-
      1 De [artikelen 12][ref1], [13][ref2] en [74][ref3] zijn op de in [artikel 113][ref4] genoemde rechterlijke
      ambtenaren van overeenkomstige toepassing.

      2 Voor de uitvoering van de taken, bedoeld in [artikel 111, tweede lid][ref5], is [artikel 83][ref6] van
      overeenkomstige toepassing op de procureur-generaal bij de Hoge Raad.

      3 De procureur-generaal bij de Hoge Raad stelt, gehoord de overige leden van het parket bij de Hoge Raad,
      een regeling vast voor de behandeling van klachten. [Artikel 26, vierde tot en met zesde lid][ref7], is van
      overeenkomstige toepassing.

      4 De [artikelen 13a tot en met 13g][ref8] zijn van overeenkomstige toepassing ten aanzien van de in
      [artikel 111][ref9] bedoelde rechterlijke ambtenaren, met dien verstande dat:

      a. de in de [artikelen 13a tot en met 13g][ref10] aan de procureur-generaal toegekende bevoegdheden en
      verplichtingen worden uitgeoefend door de plaatsvervangend procureur-generaal, indien een gedraging van de
      procureur-generaal in het geding is;

      b. voor de overeenkomstige toepasselijkheid van [artikel 13b, eerste lid, onderdelen b en c][ref11], onder
      «[artikel 26][ref12] of [75][ref13]» wordt verstaan: [artikel 120, derde lid][ref14],; en

      c. een afschrift van de beschikking, bedoeld in [artikel 13f, derde lid][ref15], wordt gezonden aan de verzoeker,
      aan de bij het parket bij de Hoge Raad werkzame rechterlijk ambtenaar op wiens gedraging het onderzoek betrekking
      had, en aan de procureur-generaal bij de Hoge Raad.


