  - number: '93'
    text: |-
      1 Onze Minister kan algemene aanwijzingen geven betreffende de uitvoering van de in [artikel 91][ref1] genoemde
      taken door de Raad voorzover dit noodzakelijk is met het oog op een goede bedrijfsvoering van de rechterlijke
      organisatie.

      2 Alvorens een aanwijzing te geven als bedoeld in het eerste lid, stelt Onze Minister de Raad in de gelegenheid
      schriftelijk zijn zienswijze kenbaar te maken.

      3 Onze Minister deelt de Raad de voorgenomen aanwijzing en de motivering daarvan schriftelijk mede. Onze Minister
      kan de Raad voor het kenbaar maken van zijn zienswijze een termijn stellen. De zienswijze van de Raad wordt
      schriftelijk en gemotiveerd gegeven.

      4 Indien de zienswijze van de Raad luidt dat de aanwijzing in strijd zal zijn met [artikel 109][ref2], wordt de
      aanwijzing niet gegeven.

      5 De aanwijzing wordt gepubliceerd in de Staatscourant.

      6 [Artikel 8:2, onderdelen a en b, van de Algemene wet bestuursrecht][ref3] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel109
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel82
