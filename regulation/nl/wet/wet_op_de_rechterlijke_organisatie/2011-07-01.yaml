  - number: '37'
    text: |-
      Een beslissing van het bestuur ter uitvoering van de in [artikel 23, eerste lid][ref1], genoemde
      taken kan door de Raad worden vernietigd indien de beslissing kennelijk in strijd is met het recht of
      het belang van een goede bedrijfsvoering van het gerecht. De [artikelen 10:36][ref2], [10:37][ref3],
      [10:38 tot en met 10:45 van de Algemene wet bestuursrecht][ref4] zijn van overeenkomstige toepassing.


