  - number: 13a
    text: |-
      1 Degene die een klacht heeft over de wijze waarop een rechterlijk ambtenaar met rechtspraak belast zich in de
      uitoefening van zijn functie jegens hem heeft gedragen, kan, tenzij de klacht een rechterlijke beslissing betreft,
      de procureur-generaal bij de Hoge Raad schriftelijk verzoeken een vordering bij de Hoge Raad in te stellen tot het
      doen van een onderzoek naar de gedraging.

      2 Het verzoekschrift wordt ondertekend en bevat de naam en het adres van de verzoeker en een zo duidelijk mogelijke
      beschrijving van de bedoelde gedraging en de daartegen gerezen klacht.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel13a
  - number: 13b
    text: |-
      1 De procureur-generaal is niet verplicht aan het verzoek, bedoeld in [artikel 13a][ref1], te voldoen, indien:

      a. het verzoekschrift niet voldoet aan [artikel 13a, tweede lid][ref2];

      b. de verzoeker overeenkomstig [artikel 26][ref3] of [75][ref4] een klacht over de gedraging kan of had kunnen
      indienen;

      c. overeenkomstig [artikel 26][ref5] of [75][ref6] een klacht over de gedraging is ingediend, deze klacht
      is behandeld en de verzoeker redelijkerwijs onvoldoende belang heeft bij een onderzoek als bedoeld in
      [artikel 13a][ref7];

      d. reeds aanstonds blijkt dat het verzoekschrift onredelijk lange tijd na het ontstaan van de klacht is ingediend;

      e. een verzoekschrift van de verzoeker, dezelfde gedraging betreffende, in behandeling is of – behoudens indien een
      nieuw feit of een nieuwe omstandigheid, dezelfde gedraging betreffende, is bekend geworden en zulks tot een ander
      oordeel zou hebben kunnen leiden – is afgedaan;

      f. voor de verzoeker met betrekking tot de klacht een voorziening bij een rechterlijke instantie openstaat of heeft
      opengestaan en hij daarvan geen gebruik heeft gemaakt, dan wel ten aanzien van die klacht een uitspraak van een
      rechterlijke instantie is gedaan waartegen geen rechtsmiddel openstaat;

      g. door de procureur-generaal een vordering als bedoeld in [artikel 46o][ref8]
      juncto [artikel 46d, tweede lid][ref9], [46f][ref10], [46l][ref11] of
      [46m van de Wet rechtspositie rechterlijke ambtenaren][ref12] is of zal worden ingesteld.

      2 De procureur-generaal stelt de verzoeker, de rechterlijk ambtenaar op wiens gedraging het verzoekschrift
      betrekking heeft en het betrokken gerechtsbestuur onderscheidenlijk de president van de Hoge Raad in de gelegenheid
      hem mondeling of schriftelijk inlichtingen te verstrekken. Hij kan ook anderen daartoe in de gelegenheid stellen.

      3 De procureur-generaal stelt de verzoeker, de rechterlijk ambtenaar op wiens gedraging het verzoekschrift
      betrekking heeft en het betrokken gerechtsbestuur onderscheidenlijk de president van de Hoge Raad op de hoogte
      van de uitkomst van het vooronderzoek. Zo nodig vermeldt de procureur-generaal daarbij of naar zijn oordeel met
      betrekking tot de klacht een voorziening bij een rechterlijke instantie openstaat.

      4 Indien de procureur-generaal op grond van het eerste lid, onderdeel b, geen toepassing geeft aan het verzoek,
      zendt hij het verzoekschrift door aan het betrokken gerechtsbestuur onderscheidenlijk de Hoge Raad.


