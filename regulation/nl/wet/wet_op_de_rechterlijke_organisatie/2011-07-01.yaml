  - number: '23'
    text: |-
      1 Het bestuur is belast met de algemene leiding, de organisatie en de bedrijfsvoering van het gerecht. In het
      bijzonder draagt het bestuur zorg voor:

      a. automatisering en bestuurlijke informatievoorziening;

      b. de voorbereiding, vaststelling en uitvoering van de begroting;

      c. huisvesting en beveiliging;

      d. de kwaliteit van de bestuurlijke en organisatorische werkwijze van het gerecht;

      e. personeelsaangelegenheden;

      f. overige materiële voorzieningen.

      2 Bij de uitvoering van de taken, bedoeld in het eerste lid, treedt het bestuur niet in de procesrechtelijke
      behandeling van, de inhoudelijke beoordeling van alsmede de beslissing in een concrete zaak of in categorieën van
      zaken.

      3 Het bestuur heeft voorts tot taak binnen het gerecht de juridische kwaliteit en de uniforme rechtstoepassing te
      bevorderen. Het voert daarover overleg met een sectorvergadering of de gerechtsvergadering. Bij de uitvoering van
      deze taak treedt het bestuur niet in de procesrechtelijke behandeling van, de inhoudelijke beoordeling van alsmede
      de beslissing in een concrete zaak.

      4 De bestuursleden geven elkaar inlichtingen die voor de uitvoering van de taken, bedoeld in het eerste en derde
      lid, noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0001830/2011-07-01#Artikel23
  - number: '24'
    text: |-
      1 Het bestuur kan ter uitvoering van zijn taken, genoemd in [artikel 23, eerste lid][ref1], alle bij het gerecht
      werkzame ambtenaren algemene en bijzondere aanwijzingen geven.

      2 Bij het geven van aanwijzingen treedt het bestuur niet in de procesrechtelijke behandeling van, de inhoudelijke
      beoordeling van alsmede de beslissing in een concrete zaak of in categorieën van zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel23
