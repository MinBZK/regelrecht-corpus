preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is voor de toepassing van artikel 3, eerste lid, onder
    a, van de Ziekenfondswet uitkeringstijdvakken ingevolge de Werkloosheidswet samen te tellen, de overgang van een
    particuliere ziektekostenverzekering naar de ziekenfondsverzekering in administratief opzicht te vergemakkelijken
    en de nominale ziekenfondspremie voor personen jonger dan 18 jaar af te schaffen;

    Zo is het dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0012700/2002-01-01#ArtikelAanhef
articles:
  - number: IX (Overgangsbepaling)
    text: |-
      De voorwaarde genoemd in [artikel 3e, eerste lid, onderdeel b, van de Ziekenfondswet][ref1] geldt
      niet voor degene die op de dag van de inwerkingtreding van onderdeel E een periodieke uitkering
      of verstrekking op grond van een rechtstreeks uit het familierecht voortvloeiende verplichting
      ontvangt, tenzij deze uitkering of verstrekking wordt ontvangen van bloed- of aanverwanten in de
      rechte lijn of in de tweede graad van de zijlijn, of bij wijze van pensioenverevening ingevolge de
      __REF001___________________________________________________________________________________________________________
      __________________________________________________________________________________________ (Stb. 1994, 342)
      een pensioen ontvangt, en wiens inkomen bedoeld in [artikel 2.18 van de Wet inkomstenbelasting 2001][ref3],
      niet meer bedraagt dan het tot een jaarbedrag herleide minimumloon per maand, bedoeld in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3e
