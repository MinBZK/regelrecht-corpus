$id: wet_op_de_pensioen_en_uitkeringsraad
regulatory_layer: WET
publication_date: '2010-05-20'
valid_from: '2000-02-18'
bwb_id: BWBR0004806
url: https://wetten.overheid.nl/BWBR0004806/2000-02-18
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het gewenst is nieuwe regelen te stellen met betrekking tot de
    organisatie van de toepassing en de uitvoering van de wetten, waarin wordt voorzien in het toekennen van
    buitengewone pensioenen aan deelnemers aan het verzet en zeelieden-oorlogsslachtoffers en van uitkeringen aan
    oorlogsgetroffenen, daartoe een zelfstandig orgaan in te stellen en in verband daarmee enige andere wetten te
    wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel1
  - number: 1.1.a
    text: 'Onze minister: Onze Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel1
  - number: 1.1.b
    text: |-
      de Raad: de Pensioen- en Uitkeringsraad, bedoeld in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004806#Artikel2
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004806
        artikel: '2'
        paragraaf: '1'
  - number: 1.1.c
    text: |-
      een Kamer: een Kamer als bedoeld in [artikel 11][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004806#Artikel11
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004806
        artikel: '11'
        paragraaf: '2'
  - number: 1.1.d
    text: |-
      het bureau: het bureau, bedoeld in [artikel 14][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004806#Artikel14
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004806
        artikel: '14'
        paragraaf: '2'
  - number: '1.2'
    text: |-
      Onder "toepassing" onderscheidenlijk "uitvoering" van de in [artikel 3, onder a][ref1], genoemde wetten wordt
      verstaan het nemen van beschikkingen op aanvragen op grond van die wetten onderscheidenlijk het voorbereiden en
      uitwerken van die beschikkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004806#Artikel3
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004806
        artikel: '3'
        paragraaf: '1'
  - number: '2.1'
    text: Er is een Raad, die rechtspersoonlijkheid bezit, genaamd de Pensioen- en Uitkeringsraad.
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel2
  - number: '2.2'
    text: De Raad heeft zijn zetel ter plaatse door Onze minister te bepalen.
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel2
  - number: '3'
    text: 'De Raad is belast met:'
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel3
  - number: 3.a
    text: |-
      de toepassing en de uitvoering van de [Wet buitengewoon pensioen 1940–1945][ref1],
      de [Wet buitengewoon pensioen zeelieden-oorlogsslachtoffers][ref2], de
      [Wet buitengewoon pensioen Indisch verzet][ref3], de [Wet uitkeringen vervolgingsslachtoffers 1940–1945][ref4] en
      de [Wet uitkeringen burger-oorlogsslachtoffers 1940–1945][ref5], en


      [ref1]: https://wetten.overheid.nl/BWBR0002032
      [ref2]: https://wetten.overheid.nl/BWBR0002035
      [ref3]: https://wetten.overheid.nl/BWBR0003968
      [ref4]: https://wetten.overheid.nl/BWBR0002844
      [ref5]: https://wetten.overheid.nl/BWBR0003664
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002032
      - id: ref2
        bwb_id: BWBR0002035
      - id: ref3
        bwb_id: BWBR0003968
      - id: ref4
        bwb_id: BWBR0002844
      - id: ref5
        bwb_id: BWBR0003664
  - number: 3.b
    text: andere, bij algemene maatregel van bestuur opgedragen taken, die verband houden met de onder a genoemde taken.
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel3
  - number: '4'
    text: De organen van de Raad zijn het bestuur, de Kamers en de direkteur.
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel4
  - number: '5.1'
    text: 'Het bestuur van de Raad wordt gevormd door:'
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel5
  - number: 5.1.a
    text: een voorzitter, tevens lid;
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel5
  - number: 5.1.b
    text: de voorzitters van elk der Kamers als leden;
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel5
  - number: 5.1.c
    text: twee andere bestuursleden.
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel5
  - number: '5.2'
    text: |-
      De voorzitter en de leden van het bestuur, bedoeld in het eerste lid, onder *c*, worden, op voordracht van Onze
      minister, bij koninklijk besluit benoemd, geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel5
  - number: '5.3'
    text: De voorzitter en de leden, bedoeld in het eerste lid, onder *c*, worden benoemd voor een periode van vier jaren.
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel5
  - number: '6'
    text: |-
      Het bestuur wijst uit zijn midden een plaatsvervangend voorzitter aan en kan, eveneens uit zijn midden, een tweede
      plaatsvervangend voorzitter aanwijzen.
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel6
  - number: '7.1'
    text: |-
      Het bestuur mag alleen beraadslagen en besluiten indien meer dan de helft van het aantal zitting hebbende leden
      aanwezig is. Wanneer het vereiste aantal leden niet aanwezig is wordt op de gebruikelijke wijze een nieuwe
      vergadering uitgeschreven voor een tijdstip, dat ten minste zeven dagen later is gelegen. In die vergadering
      beraadslaagt en besluit het bestuur ongeacht het aantal aanwezige leden.
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel7
  - number: '7.2'
    text: |-
      De vergaderingen van het bestuur zijn openbaar, behoudens nader te bepalen uitzonderingen. Het bestuur stelt
      daartoe regels vast die de goedkeuring van Onze minister behoeven.
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel7
  - number: '8.1'
    text: |-
      Het bestuur is belast met alle taken van de Raad, die niet bij of krachtens de wet aan andere organen zijn
      opgedragen.
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel8
  - number: '8.2'
    text: |-
      Het bestuur draagt zorg voor een goede uitvoering van deze wet en beschikt daartoe over alle bevoegdheden, die niet
      bij of krachtens de wet aan anderen zijn opgedragen.
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel8
  - number: '9'
    text: |-
      Het bestuur stelt regels met betrekking tot de werkwijze van de organen van de Raad en van het bureau. Deze regels
      behoeven de instemming van Onze minister.
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel9
  - number: '10'
    text: |-
      De voorzitter van het bestuur vertegenwoordigt de Raad in en buiten rechte, behoudens in de gevallen, bedoeld in
      [artikel 12, eerste lid, onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004806#Artikel12
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004806
        artikel: '12'
        paragraaf: '2'
  - number: '11.1'
    text: |-
      De Raad kent drie Kamers, belast met de in [artikel 12, eerste lid][ref1] genoemde taken
      ter zake van onderscheidenlijk de [Wet uitkeringen vervolgingsslachtoffers 1940-1945][ref2],
      met de [Wet uitkeringen burger-oorlogsslachtoffers 1940-1945][ref3] en met de
      [Wet buitengewoon pensioen 1940-1945][ref4], de [Wet buitengewoon pensioen zeelieden-oorlogsslachtoffers][ref5] en
      de [Wet buitengewoon pensioen Indisch verzet][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0004806#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002844
      [ref3]: https://wetten.overheid.nl/BWBR0003664
      [ref4]: https://wetten.overheid.nl/BWBR0002032
      [ref5]: https://wetten.overheid.nl/BWBR0002035
      [ref6]: https://wetten.overheid.nl/BWBR0003968
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004806
        artikel: '12'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002844
      - id: ref3
        bwb_id: BWBR0003664
      - id: ref4
        bwb_id: BWBR0002032
      - id: ref5
        bwb_id: BWBR0002035
      - id: ref6
        bwb_id: BWBR0003968
  - number: '11.2'
    text: De omvang en samenstelling van elk der Kamers worden bij algemene maatregel van bestuur geregeld.
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel11
  - number: '11.3'
    text: |-
      De voorzitters van elk der Kamers worden, op voordracht van Onze minister, bij koninklijk besluit benoemd,
      geschorst en ontslagen. Benoeming geschiedt steeds voor een periode van vier jaren.
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel11
  - number: '11.4'
    text: |-
      De leden en plaatsvervangende leden van elk der Kamers worden benoemd, geschorst en ontslagen door Onze minister.
      Benoeming geschiedt, gehoord de in [artikel 27][ref1] bedoelde organisaties en instellingen, steeds voor een
      periode van vier jaren, met dien verstande dat elke twee jaar de helft van het aantal leden aftreedt overeenkomstig
      een door de desbetreffende Kamer vast te stellen rooster. De zittingsduur van het lid, dat is benoemd op een
      tussentijds opengevallen plaats, is gelijk aan de duur van de resterende zittingsperiode van het lid, in wiens
      plaats dit lid is benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0004806#Artikel27
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004806
        artikel: '27'
        paragraaf: '5'
  - number: '12.1'
    text: 'Elk der Kamers is, binnen haar taakgebied, belast met:'
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel12
  - number: 12.1.a
    text: het vaststellen van beleidsregels met betrekking tot de wetstoepassing;
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel12
  - number: 12.1.b
    text: |-
      het, met inachtneming van de in [artikel 9][ref1] bedoelde regels, nemen van beschikkingen ter zake van
      pensioenen, erkenningen, uitkeringen, vergoedingen en tegemoetkomingen als bedoeld bij of krachtens één der in
      [artikel 3, onder a][ref2], genoemde wetten;


      [ref1]: https://wetten.overheid.nl/BWBR0004806#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004806#Artikel3
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004806
        artikel: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004806
        artikel: '3'
        paragraaf: '1'
  - number: 12.1.c
    text: het voeren van het verweer in beroepsprocedures met betrekking tot de onder *b* bedoelde beschikkingen;
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel12
  - number: 12.1.d
    text: het ten behoeve van de besluitvorming van het bestuur ontwikkelen van de in het tweede lid bedoelde regels.
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel12
  - number: '12.2'
    text: |-
      Van de bevoegdheid tot het nemen van beschikkingen als bedoeld in het eerste lid, onder *b*, kan mandaat worden
      verleend aan de directeur. Het bestuur stelt hieromtrent, in overeenstemming met de desbetreffende Kamer, regels.
      Deze regels behoeven de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel12
  - number: '13'
    text: |-
      Het bestuur stelt regels met betrekking tot de vergoeding, die kan worden toegekend aan de voorzitter en de
      overige leden van het bestuur en aan de leden en de plaatsvervangende leden van de Kamers. Deze regels behoeven de
      goedkeuring van Onze minister.
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel13
  - number: '14.1'
    text: |-
      Aan de Raad is ter ondersteuning van zijn werkzaamheden een bureau verbonden, aan het hoofd waarvan een direkteur
      is gesteld.
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel14
  - number: '14.2'
    text: |-
      De direkteur van het bureau is tevens algemeen secretaris van het bestuur van de Raad en van elk der Kamers. Hij
      kan, in overeenstemming met de desbetreffende voorzitter, een andere medewerker van het bureau aanwijzen die in
      zijn plaats de functie van secretaris van het bestuur of één der Kamers vervult.
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel14
  - number: '15.1'
    text: |-
      Het bestuur benoemt, schorst en ontslaat de direkteur van het bureau. De overige medewerkers van het bureau worden
      benoemd, beoordeeld, geschorst en ontslagen door de direkteur.
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel15
  - number: '15.2'
    text: |-
      De bezoldiging en de verdere rechtspositie van de direkteur en de overige medewerkers van het bureau zijn
      overeenkomstig de regels, zoals die gelden voor degenen die door het Rijk zijn aangesteld om in burgerlijke
      openbare dienst werkzaam te zijn met dien verstande dat, waar in deze regels een bevoegdheid is toegekend aan een
      andere minister dan Onze Minister van Binnenlandse Zaken, deze bevoegdheid wordt uitgeoefend door het bestuur. Bij
      algemene maatregel van bestuur kunnen zonodig van de in de vorige volzin bedoelde regels afwijkende regels worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel15
  - number: '16'
    text: |-
      Indien het bestuur besluit werkzaamheden, die de uitvoering van deze wet of een der in [artikel 3, onder a][ref1],
      genoemde wetten betreffen, door derden te laten uitvoeren behoeft dat besluit de instemming van Onze minister.


      [ref1]: https://wetten.overheid.nl/BWBR0004806#Artikel3
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004806
        artikel: '3'
        paragraaf: '1'
  - number: '17'
    text: |-
      Onze minister is belast met het toezicht op de uitvoering van de in [artikel 3, onder a][ref1], genoemde wetten,
      de taken, bedoeld in [artikel 3, onder b][ref2], en deze wet. Hij belast door hem aan te wijzen personen met de
      uitoefening daarvan. Een van dezen dan wel een door hem aan te wijzen plaatsvervanger is in elk geval gerechtigd
      tot het bijwonen van de vergaderingen van het bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0004806#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004806#Artikel3
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004806
        artikel: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004806
        artikel: '3'
        paragraaf: '1'
  - number: '18'
    text: |-
      De Raad brengt, volgens door Onze minister te stellen regels en behoudens bij die regels te bepalen uitzonderingen,
      de besluiten welke hij neemt, ter kennis van Onze minister. Ook overigens verstrekt de Raad aan Onze minister alle
      gevraagde inlichtingen over zijn beleid en over de bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel18
  - number: '19'
    text: |-
      Onze minister kan de Raad aanwijzingen van algemene aard geven met betrekking tot de uitvoering van de in
      [artikel 3, onder a][ref1], genoemde wetten.


      [ref1]: https://wetten.overheid.nl/BWBR0004806#Artikel3
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004806
        artikel: '3'
        paragraaf: '1'
  - number: '20.1'
    text: |-
      Onze minister kan, indien hij daartoe aanleiding aanwezig acht, van de Raad inzage of overlegging vorderen
      van de bescheiden, die tot enige beschikking van de Raad met betrekking tot de toepassing van een der in
      [artikel 3, onder a][ref1], genoemde wetten hebben geleid. Desgevraagd verstrekt de Raad Onze minister schriftelijk
      inlichtingen omtrent de achtergronden, die tot zodanige beschikking hebben geleid.


      [ref1]: https://wetten.overheid.nl/BWBR0004806#Artikel3
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004806
        artikel: '3'
        paragraaf: '1'
  - number: '20.2'
    text: |-
      Onze minister voert, indien hij daartoe aanleiding aanwezig acht, ter zake overleg met de Raad. Indien dit overleg
      niet tot overeenstemming leidt, besluit de Raad of de oorspronkelijke beschikking blijft gehandhaafd dan wel wordt
      herzien. Van dit besluit doet de Raad terstond, met redenen omkleed, mededeling aan Onze minister.
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel20
  - number: '21'
    text: |-
      De Raad zendt vóór 1 juli van elk jaar een verslag omtrent zijn werkzaamheden in het laatst verstreken kalenderjaar
      aan Onze minister. Deze zendt het aan de Staten-Generaal en stelt het algemeen verkrijgbaar.
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel21
  - number: '22.1'
    text: |-
      Het bestuur stelt de begroting en de rekening van de Raad vast met betrekking tot de in [artikel 3, onder a][ref1],
      genoemde wetten, de taken, bedoeld in [artikel 3, onder b][ref2], en deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0004806#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004806#Artikel3
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004806
        artikel: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004806
        artikel: '3'
        paragraaf: '1'
  - number: '22.2'
    text: |-
      Tegelijk met de begroting stelt het bestuur een meerjarenraming vast waarin voor de komende vier jaar ten aanzien
      van de in [artikel 3, onder a][ref1], genoemde wetten, de taken, bedoeld in [artikel 3, onder b][ref2], en deze wet
      de daarmee gemoeide kosten worden aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0004806#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004806#Artikel3
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004806
        artikel: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004806
        artikel: '3'
        paragraaf: '1'
  - number: '22.3'
    text: |-
      De begroting en meerjarenraming worden ingediend voor 1 maart van het jaar voorafgaand aan het jaar waarop de
      begroting betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel22
  - number: '22.4'
    text: De begroting en meerjarenraming behoeven de goedkeuring van Onze minister.
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel22
  - number: '22.5'
    text: Het boekjaar van de Raad loopt van 1 januari tot en met 31 december.
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel22
  - number: '23.1'
    text: |-
      De kosten van de pensioenen, uitkeringen, vergoedingen en tegemoetkomingen die worden verstrekt op grond van de in
      [artikel 3, onder a][ref1], genoemde wetten komen ten laste van het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0004806#Artikel3
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004806
        artikel: '3'
        paragraaf: '1'
  - number: '23.2'
    text: |-
      De kosten, gemoeid met de uitvoering van de taken, bedoeld in [artikel 3, onder b][ref1], en deze wet, komen ten
      laste van 's Rijks kas, overeenkomstig bij of krachtens algemene maatregel van bestuur te stellen regels en voor
      zover zij het totaal der goedgekeurde begroting, bedoeld in [artikel 22, vierde lid][ref2], niet overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0004806#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004806#Artikel22
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004806
        artikel: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004806
        artikel: '22'
        paragraaf: '4'
  - number: '24.1'
    text: |-
      Het bestuur zendt binnen drie maanden na het verstrijken van een boekjaar de rekening
      over dat boekjaar, voorzien van een verklaring van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1], aan Onze minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '24.2'
    text: Het bestuur stelt de in het eerste lid bedoelde stukken algemeen verkrijgbaar.
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel24
  - number: '24.3'
    text: |-
      De accountant, die de in het eerste lid bedoelde verklaring afgeeft, rapporteert binnen drie maanden na afloop van
      het boekjaar aan Onze minister omtrent de toepassing en uitvoering van de in [artikel 3, onder a][ref1], genoemde
      wetten, de uitvoering van de taken, bedoeld in [artikel 3, onder b][ref2], en de naleving van het bij of krachtens
      deze wet bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0004806#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004806#Artikel3
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004806
        artikel: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004806
        artikel: '3'
        paragraaf: '1'
  - number: '24.4'
    text: |-
      Onze minister kan regels stellen omtrent de in de rekening te verwerken gegevens, de wijze van verantwoording door
      de Raad en de controle door de accountant.
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel24
  - number: '24.5'
    text: |-
      De Raad en de in het derde lid bedoelde accountant werken mee aan de door de accountantsdienst van het Ministerie
      van Volksgezondheid, Welzijn en Sport in te stellen onderzoeken, die noodzakelijk zijn voor de uitvoering van de
      taak van die dienst.
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel24
  - number: '25'
    text: |-
      De Raad verstrekt desgevraagd aan Onze minister de door deze verlangde financiële en daarmee samenhangende
      gegevens.
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel25
  - number: '27'
    text: |-
      Het bestuur pleegt periodiek, doch ten minste eenmaal per jaar, overleg met de besturen van de organisaties en
      instellingen welke regelmatig zijn betrokken bij de uitvoering van deze wet en de in [artikel 3, onder a][ref1],
      genoemde wetten.


      [ref1]: https://wetten.overheid.nl/BWBR0004806#Artikel3
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0004806
        artikel: '3'
        paragraaf: '1'
  - number: '36.1'
    text: |-
      In afwijking van [artikel 11, tweede, derde en vierde lid][ref1], zijn de voorzitters, de leden en de
      plaatsvervangende leden van de Kamers dezelfden als de voorzitters, de leden en de plaatsvervangende leden
      van onderscheidenlijk de Uitkeringsraad, de Raad uitkeringen burger-oorlogsslachtoffers en de Buitengewone
      Pensioenraad, die als zodanig waren benoemd op de dag voor de datum van inwerkingtreding van deze wet. Deze
      bepaling blijft van kracht tot de maatregel, bedoeld in [artikel 11, tweede lid][ref2], tot stand zal zijn gekomen,
      doch uiterlijk tot 1 januari 1992.


      [ref1]: https://wetten.overheid.nl/BWBR0004806#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0004806#Artikel11
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0004806
        artikel: '11'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004806
        artikel: '11'
        paragraaf: '2'
  - number: '36.2'
    text: |-
      In zoverre de in het eerste lid bedoelde leden en plaatsvervangende leden zullen worden herbenoemd geschiedt dat,
      in afwijking van [artikel 11, vierde lid][ref1], bij koninklijk besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0004806#Artikel11
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0004806
        artikel: '11'
        paragraaf: '2'
  - number: '46'
    text: |-
      Onze minister zendt zo spoedig mogelijk na 1 juli 2001 en vervolgens telkens na vier jaar aan de Staten-Generaal
      een verslag over de doeltreffendheid en doelmatigheid van het functioneren van de Raad.
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel46
  - number: '48'
    text: |-
      Deze wet treedt in werking met ingang van de eerste dag van de maand, volgend op de datum van uitgifte van het
      *Staatsblad* waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel48
  - number: '49'
    text: Deze wet kan worden aangehaald als Wet op de Pensioen- en Uitkeringsraad.
    url: https://wetten.overheid.nl/BWBR0004806/2000-02-18#Artikel49
