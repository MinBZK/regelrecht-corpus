$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.2/schema.json
$id: besluit_buitengewoon_opsporingsambtenaren_dienst_vervoer_ondersteuning_2009
regulatory_layer: WET
publication_date: '2009-02-10'
valid_from: '2013-08-20'
bwb_id: BWBR0025281
url: https://wetten.overheid.nl/BWBR0025281/2013-08-20
preamble:
  text: |-
    Overwegende dat het voor de goede uitoefening van de taken waarmee de Dienst Vervoer & Ondersteuning is belast,
    noodzakelijk is dat medewerkers van voornoemde dienst over opsporingsbevoegdheid beschikken, bevoegd zijn geweld te
    gebruiken, de veiligheidsfouillering toe te passen en bewapend te zijn;

    Gelet op artikel 142, eerste lid, onder b, en derde lid, van het Wetboek van Strafvordering, artikel 8,
    eerste, derde en zevende lid, van de Politiewet 1993, artikel 3a, derde lid, van de Wet wapens en munitie, de
    Ambtsinstructie voor de politie, de Koninklijke marechaussee en de buitengewoon opsporingsambtenaar en het Besluit
    buitengewoon opsporingsambtenaar;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0025281/2013-08-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. *buitengewoon opsporingsambtenaar:* de buitengewoon opsporingsambtenaar, bedoeld in [artikel 2][ref1];

      b. *DV&O:* de Dienst Vervoer en Ondersteuning van het Ministerie van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0025281#Artikel2
    url: https://wetten.overheid.nl/BWBR0025281/2013-08-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0025281
        artikel: '2'
  - number: '2'
    text: |-
      De personen die werkzaam zijn bij DV&O,

      a. in de functie van risico-adviseur;

      b. in de functie van transportbegeleider;

      c. bij de Landelijke Bijzondere Bijstandverlening (LBB);

      d. bij het Bijzonder Ondersteuningsteam (BOT);

      e. bij de Tijdelijke Executieve Ondersteuning (TEO);

      zijn aangewezen als buitengewoon opsporingsambtenaar.
    url: https://wetten.overheid.nl/BWBR0025281/2013-08-20#Artikel2
  - number: '3'
    text: |-
      1 De in [artikel 2][ref1] bedoelde ambtenaren zijn bevoegd tot het opsporen van de strafbare feiten genoemd in
      domein VI Generieke Opsporing, van [bijlage A-I van de Circulaire Buitengewoon opsporingsambtenaar][ref2], voor
      zover noodzakelijk voor een goede vervulling van de aan de functie gerelateerde taken.

      2 De opsporingsbevoegdheid, bedoeld in het eerste lid, geldt voor het grondgebied van Nederland, voor zover
      noodzakelijk voor een goede vervulling van de aan de functie gerelateerde taken.

      3 De buitengewoon opsporingsambtenaar vermeldt in zijn processen-verbaal en schriftelijke verslagleggingen het
      domein waarin hij is aangesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0025281#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0027483
    url: https://wetten.overheid.nl/BWBR0025281/2013-08-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0025281
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0027483
  - number: '4'
    text: |-
      De buitengewoon opsporingsambtenaar is bevoegd de in [artikel 7, eerste en derde lid, van de Politiewet 2012][ref1]
      genoemde bevoegdheden uit te oefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel7
    url: https://wetten.overheid.nl/BWBR0025281/2013-08-20#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '7'
  - number: '5'
    text: |-
      1 De buitengewoon opsporingsambtenaar kan gedurende de uitoefening van zijn taak als buitengewoon
      opsporingsambtenaar zijn uitgerust met:

      a. handboeien van een door de Ministers van Justitie en van Binnenlandse Zaken en Koninkrijksrelaties goedgekeurd
      merk en type;

      b. een korte wapenstok van een door de Ministers van Justitie en van Binnenlandse Zaken en Koninkrijksrelaties
      goedgekeurd merk en type;

      c. pepperspray van een door de Ministers van Justitie en van Binnenlandse Zaken en Koninkrijksrelaties goedgekeurd
      merk en type

      d. een semi-automatisch pistool van het merk Walther, type P5, kaliber 9 millimeter maal 19 millimeter.

      2 De buitengewoon opsporingsambtenaar, met uitzondering van de personen die werkzaam zijn bij de TEO, kan gedurende
      de uitoefening van zijn taak als buitengewoon opsporingsambtenaar tevens zijn uitgerust met een semi-automatisch
      machinepistool van het merk Heckler & Koch, type MP5 A2 (met vaste kolf: niet automatisch) en type MP5 A3 (met
      inschuifbare kolf: niet automatisch) kaliber 9 millimeter maal 19 millimeter.

      3 De buitengewoon opsporingsambtenaar, werkzaam bij de LBB, kan gedurende de uitoefening van zijn taak als
      buitengewoon opsporingsambtenaar bovendien zijn uitgerust met CS-traangasgranaten en traangasverspreidende middelen
      van een door de Ministers van Justitie en van Binnenlandse Zaken en Koninkrijksrelaties goedgekeurd merk en type.
    url: https://wetten.overheid.nl/BWBR0025281/2013-08-20#Artikel5
  - number: '6'
    text: Op grond van dit besluit kunnen maximaal 1.000 personen worden beëdigd als buitengewoon opsporingsambtenaar.
    url: https://wetten.overheid.nl/BWBR0025281/2013-08-20#Artikel6
  - number: '7'
    text: |-
      1 Als toezichthouder van de buitengewoon opsporingsambtenaar is aangewezen de hoofdofficier van justitie bij het
      Landelijk Parket.

      2 Als direct toezichthouder van de buitengewoon opsporingsambtenaar is aangewezen de korpschef, bedoeld in
      [artikel 27 van de Politiewet 2012][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel27
    url: https://wetten.overheid.nl/BWBR0025281/2013-08-20#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '27'
  - number: '8'
    text: |-
      De directeur van DV&O brengt jaarlijks met betrekking tot de bij de dienst werkzame buitengewoon
      opsporingsambtenaren aan de Minister van Justitie verslag uit over:

      a. het aantal buitengewoon opsporingsambtenaren binnen de dienst;

      b. de door die buitengewoon opsporingsambtenaren verrichte activiteiten;

      c. de stand van zaken met betrekking tot de opleiding van de buitengewoon opsporingsambtenaren, waarin in ieder
      geval wordt aangegeven hoeveel personen in het verslagjaar zijn aangemeld voor het examen van de Citogroep en
      hoeveel personen in het verslagjaar voor dat examen zijn geslaagd;

      d. de stand van zaken met betrekking tot de training en de bekwaamheid in de omgang met de geweldsbevoegdheden en
      de geweldsmiddelen van die buitengewoon opsporingsambtenaren.
    url: https://wetten.overheid.nl/BWBR0025281/2013-08-20#Artikel8
  - number: '9'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na dagtekening van de Staatscourant waarin het wordt
      geplaatst en vervalt 5 jaar na de datum van inwerkingtreding.
    url: https://wetten.overheid.nl/BWBR0025281/2013-08-20#Artikel9
  - number: '10'
    text: 'Dit besluit wordt aangehaald als: Besluit buitengewoon opsporingsambtenaren Dienst Vervoer & Ondersteuning 2009.'
    url: https://wetten.overheid.nl/BWBR0025281/2013-08-20#Artikel10
