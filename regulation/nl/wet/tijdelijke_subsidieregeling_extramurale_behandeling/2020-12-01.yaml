  - number: 1.2.1
    text: |-
      Het Zorginstituut kan aan een Wlz-uitvoerder die op grond van [artikel 4.2.4, tweede lid, van de wet][ref1] is
      aangewezen als zorgkantoor, een subsidie verstrekken voor het aan verzekerden doen verlenen van behandeling en
      vervoer in de regio of regio's waarvoor de Wlz-uitvoerder als zorgkantoor is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel4
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0035917
        artikel: '4'
  - number: 1.2.2
    text: 'Voor subsidie komt uitsluitend in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel1.2
  - number: 1.2.2.a
    text: 'behandeling van:'
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel1.2
  - number: 1.2.2.a.1°
    text: verzekerden met een somatische aandoening;
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel1.2
  - number: 1.2.2.a.2°
    text: verzekerden met een psychogeriatrische aandoening;
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel1.2
  - number: 1.2.2.a.3°
    text: verzekerden met een lichamelijke beperking;
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel1.2
  - number: 1.2.2.a.4°
    text: meerderjarige verzekerden met een verstandelijke beperking;
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel1.2
  - number: 1.2.2.b
    text: vervoer naar en van de locatie waar de verzekerde gedurende een dagdeel de behandeling ontvangt.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel1.2
  - number: 1.2.3
    text: |-
      Voor subsidie komt voorts slechts in aanmerking behandeling door een organisatorisch verband dat op 31 december
      2019 beschikte over een toelating in de zin van de [Wet toelating zorginstellingen][ref1] ten behoeve van het
      verlenen van behandeling.


      [ref1]: https://wetten.overheid.nl/BWBR0018906
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0018906
  - number: 1.2.4
    text: |-
