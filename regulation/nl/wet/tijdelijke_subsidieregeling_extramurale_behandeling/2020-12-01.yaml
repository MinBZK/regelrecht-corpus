  - number: 1.2.6
    text: |-
      Het Zorginstituut kan aan een Wlz-uitvoerder die op grond van [artikel 4.2.4, tweede lid, van de wet][ref1] is
      aangewezen als zorgkantoor, een subsidie verstrekken voor de kosten van de in het tweede tot en met vierde lid
      genoemde subsidiabele prestaties die in de periode van 1 maart 2020 tot en met 30 juni 2020 als gevolg van de
      maatregelen in verband met Covid-19 niet zijn geleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel4
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0035917
        artikel: '4'
  - number: 1.3.1
    text: |-
      De volgende prestaties komen alleen voor subsidie in aanmerking voor zover de verzekerde daar blijkens een oordeel
      van het CIZ bij wijze van individuele behandeling voor in aanmerking komt: - Behandeling sglvg traject;
        - Behandeling sglvg deeltijd;
        - Behandeling gedragswetenschapper;
        - Behandeling paramedisch.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel1.3
  - number: 1.3.2
    text: |-
      In afwijking van het eerste lid is geen oordeel van het CIZ vereist voor de prestatie Behandeling
      gedragswetenschapper, voor zover het betreft functionele diagnostiek op verzoek van:
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel1.3
  - number: 1.3.2.a
    text: een specialist ouderengeneeskunde of een arts voor verstandelijk gehandicapten, of
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel1.3
  - number: 1.3.2.b
    text: |-
      een huisarts of een medisch specialist, voor zover de diagnostiek nodig is in het kader van de behandeling van niet
      aangeboren hersenletsel.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel1.3
  - number: 1.3.3
    text: |-
      De volgende prestaties komen alleen voor subsidie in aanmerking voor zover de verzekerde daar blijkens een oordeel
      van het CIZ bij wijze van individuele behandeling voor in aanmerking komt en de verzekerde ouder is dan 18 jaar en
      niet ouder is dan 23: - Behandeling lvg;
        - Behandeling IOG lvg.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel1.3
  - number: 1.3.4
    text: |-
      De volgende prestaties komen alleen voor subsidie in aanmerking voor zover de verzekerde daar blijkens een oordeel
      van het CIZ bij wijze van behandeling in groepsverband voor in aanmerking komt: - Dagbehandeling ouderen som en pg;
        - Dagbehandeling VG emg;
        - Dagbehandeling LG licht;
        - Dagbehandeling LG midden;
        - Dagbehandeling LG zwaar.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel1.3
  - number: 1.4.1
    text: |-
      De volgende prestaties komen alleen voor subsidie in aanmerking indien het vervoer blijkens een oordeel
      van het CIZ medisch noodzakelijk is en indien sprake is van een combinatie met de prestaties, genoemd in
      [artikel 1.3, vierde lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0036018#Artikel1
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel1.4
    references:
      - id: ref1
        bwb_id: BWBR0036018
        artikel: '1'
        hoofdstuk: '1'
