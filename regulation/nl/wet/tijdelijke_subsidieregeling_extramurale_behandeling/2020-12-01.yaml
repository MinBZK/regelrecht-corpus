articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder: - *accountant:* accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1];
        - *behandeling:* behandeling als bedoeld in [artikel 3.1.1, eerste lid, onderdeel c, van de wet][ref2], die niet in
      combinatie met verblijf wordt verleend;
        - *oordeel van het CIZ:* besluit als bedoeld in [artikel 5.2.1 van het Besluit langdurige zorg][ref3];
        - *minister:* minister van Volksgezondheid, Welzijn en Sport;
        - *prestatie:* prestatie, bedoeld in [artikel 1.2, vierde lid][ref4];
        - *vervoer:* vervoer naar een locatie waar de verzekerde behandeling ontvangt;
        - *verzekerde:* persoon die overeenkomstig de wet is verzekerd;
        - *wet:* [Wet langdurige zorg][ref5];
        - *Covid-19:* de ziekte veroorzaakt door coronavirus-SARS-CoV-2.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref2]: https://wetten.overheid.nl/BWBR0035917#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0035948#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0036018#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0035917
