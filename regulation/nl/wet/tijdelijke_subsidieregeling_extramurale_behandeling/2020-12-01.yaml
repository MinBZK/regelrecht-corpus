    text: Vervoer dagbehandeling V&V;
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel1.4
  - number: 1.4.1.–
    text: Vervoer dagbehandeling GHZ categorie 1;
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel1.4
  - number: 1.4.1.–
    text: Vervoer dagbehandeling GHZ categorie 2;
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel1.4
  - number: 1.4.1.–
    text: Vervoer dagbehandeling GHZ categorie 3;
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel1.4
  - number: 1.4.1.−
    text: Vervoer dagbehandeling GHZ categorie 4;
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel1.4
  - number: 1.4.1.−
    text: Vervoer dagbehandeling GHZ categorie 5.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel1.4
  - number: 1.4.2
    text: |-
      De prestatie Reiskosten zorgverlener komt alleen voor subsidie in aanmerking als verzekerde beschikt over een
      oordeel van het CIZ waaruit blijkt dat hij in aanmerking komt voor individuele behandeling.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel1.4
  - number: 1.4.3
    text: |-
      In afwijking van het tweede lid komt de prestatie Reiskosten zorgverlener in geval van een prestatie als bedoeld in
      [artikel 1.3, tweede lid][ref1], ook voor subsidie in aanmerking als verzekerde niet beschikt over een oordeel van
      het CIZ.


      [ref1]: https://wetten.overheid.nl/BWBR0036018#Artikel1
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel1.4
    references:
      - id: ref1
        bwb_id: BWBR0036018
        artikel: '1'
        hoofdstuk: '1'
  - number: 1.5.1
    text: De subsidie wordt per kalenderjaar verstrekt.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel1.5
  - number: 1.5.2
    text: |-
      Dit artikel is niet van toepassing op de verstrekking van de subsidie bedoeld in [artikel 1.2, zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036018#Artikel1
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel1.5
    references:
      - id: ref1
        bwb_id: BWBR0036018
        artikel: '1'
        hoofdstuk: '1'
  - number: '1.6'
    text: Het bedrag van de subsidie dat voor het jaar 2021 ten hoogste wordt verleend aan de Wlz-uitvoerder is € 0,00.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel1.6
  - number: 1.7.1
    text: |-
      De [hoofdstukken 2 tot en met 6][ref1] zijn niet van toepassing op de verstrekking van de subsidie bedoeld in
      [artikel 1.2, zesde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0036018#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0036018#Artikel1
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel1.7
    references:
      - id: ref1
        bwb_id: BWBR0036018
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0036018
        artikel: '1'
        hoofdstuk: '1'
  - number: 2.1.1
    text: De subsidie wordt op aanvraag verstrekt.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel2.1
  - number: 2.1.2
    text: |-
      Een aanvraag tot verlening van de subsidie wordt ontvangen uiterlijk vier weken voor de aanvang van het jaar
      waarvoor de subsidie wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel2.1
  - number: 2.2.1
    text: Voor een aanvraag tot verlening van de subsidie wordt een door het Zorginstituut vastgesteld formulier gebruikt.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel2.2
  - number: 2.2.2
    text: Het aanvraagformulier wordt ondertekend door een persoon die bevoegd is de aanvrager te vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel2.2
  - number: '3.1'
    text: Het Zorginstituut besluit binnen vier weken na ontvangst van de aanvraag over de verlening van de subsidie.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel3.1
  - number: '3.2'
    text: |-
      Het Zorginstituut vermeldt in het besluit tot verlening van de subsidie in ieder geval het maximumbedrag dat aan
      subsidie wordt verleend.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel3.2
  - number: 4.1.1
    text: Het Zorginstituut kan na ontvangst van de aanvraag tot verlening ambtshalve voorschotten verstrekken.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel4.1
  - number: 4.1.2
    text: |-
      Het Zorginstituut verleent bij het besluit tot verlening van de subsidie ambtshalve tevens voorschotten op het
      maximumbedrag van de verleende subsidie.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel4.1
  - number: 4.1.3
    text: De voorschotten worden maandelijks verstrekt.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel4.1
  - number: 4.1.4
    text: De voorschotten worden betaald aan het CAK.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel4.1
  - number: '4.2'
    text: 'De subsidieontvanger zorgt ervoor dat:'
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel4.2
  - number: 4.2.a
    text: de doelstellingen van de gesubsidieerde activiteiten op doelmatige wijze worden nagestreefd,
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel4.2
  - number: 4.2.b
    text: de uitvoering van de gesubsidieerde activiteiten op verantwoorde wijze wordt bestuurd en
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel4.2
  - number: 4.2.c
    text: de voor de uitvoering van de gesubsidieerde activiteiten benodigde middelen op verantwoorde wijze worden beheerd.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel4.2
  - number: 4.3.1
    text: 'De subsidieontvanger houdt een zodanig ingerichte administratie bij dat daarin altijd kan worden nagegaan:'
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel4.3
  - number: 4.3.1.a
    text: de betalingen van de subsidieontvanger voor verrichte prestaties;
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel4.3
  - number: 4.3.1.b
    text: het aantal verrichte prestaties;
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel4.3
  - number: 4.3.1.c
    text: de voor de vaststelling van de subsidie van belang zijnde rechten en verplichtingen.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel4.3
  - number: 4.3.2
    text: De administratie wordt op overzichtelijke, controleerbare en doelmatige wijze ingericht.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel4.3
  - number: 4.3.3
    text: De administratie en de daartoe behorende bescheiden worden gedurende tien jaren bewaard.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel4.3
  - number: 4.4.1
    text: 'De subsidieontvanger meldt meteen aan het Zorginstituut als:'
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel4.4
  - number: 4.4.1.a
    text: |-
      het tijdens de periode waarvoor de subsidie is verleend aannemelijk is geworden dat de activiteiten waarvoor de
      subsidie is verleend niet, niet tijdig of niet geheel zullen worden verricht,
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel4.4
  - number: 4.4.1.b
    text: het aannemelijk is geworden dat niet of niet geheel aan de subsidieverplichtingen zal worden voldaan of
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel4.4
  - number: 4.4.1.c
    text: |-
      zich andere omstandigheden voordoen of zullen voordoen die van belang kunnen zijn voor een beslissing tot
      wijziging, intrekking of vaststelling van de subsidie.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel4.4
  - number: 4.4.2
    text: |-
      De melding wordt schriftelijk gedaan. De melding wordt voorzien van een toelichting. Bij de melding worden de
      relevante stukken overgelegd.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel4.4
  - number: 4.5.1
    text: |-
      De subsidieontvanger werkt, onder meer door het verschaffen van de daartoe benodigde inlichtingen, gegevens en
      bescheiden, mee aan door of namens het Zorginstituut ingesteld onderzoek dat erop is gericht het Zorginstituut
      inlichtingen te verschaffen die van belang zijn voor het nemen van een besluit over het verstrekken van de
      subsidie.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel4.5
  - number: 4.5.2
    text: |-
      De subsidieontvanger werkt, onder meer door het verschaffen van de daartoe benodigde inlichtingen, gegevens en
      bescheiden, mee aan door of namens de minister ingesteld onderzoek dat erop is gericht de minister inlichtingen te
      verschaffen voor de ontwikkeling van het beleid van de minister.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel4.5
  - number: 4.5.3
    text: |-
      De subsidieontvanger verplicht zijn accountant alsmede degenen die hij de behandeling en het vervoer doet verlenen
      tot medewerking aan het onderzoek.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel4.5
  - number: '4.6'
    text: |-
      Het Zorginstituut kan bij de verlening van de subsidie verplichtingen opleggen als bedoeld in
      [artikel 4:38 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '4.7'
    text: |-
      De subsidieontvanger doet binnen twee weken na afloop van elke maand aan het Zorginstituut een opgave van het
      bedrag dat het CAK namens de subsidieontvanger in de afgelopen maand heeft betaald voor prestaties die zijn
      verricht in de daaraan voorafgaande maanden van het jaar 2020.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel4.7
  - number: 6.1.1
    text: |-
      De subsidieontvanger dient binnen tweeëntwintig weken na afloop van het jaar waarvoor de subsidie is verleend een
      aanvraag in tot vaststelling van de subsidie.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel6.1
  - number: 6.1.2
    text: Het Zorginstituut kan ontheffing verlenen van de termijn, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel6.1
  - number: 6.2.1
    text: Voor een aanvraag tot vaststelling van de subsidie wordt een door het Zorginstituut vastgesteld formulier gebruikt.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel6.2
  - number: 6.2.2
    text: Het aanvraagformulier wordt ondertekend door een persoon die bevoegd is de aanvrager te vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel6.2
  - number: 6.3.1
    text: |-
      De subsidieontvanger doet in de aanvraag tot vaststelling van de subsidie per prestatie opgave van de som van het
      aantal prestaties die de subsidieontvanger in het jaar waarvoor de subsidie is verstrekt heeft doen verlenen in
      alle regio's waarvoor de subsidieontvanger als zorgkantoor is aangewezen.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel6.3
  - number: 6.3.2
    text: |-
      De subsidieontvanger toont in de aanvraag tot vaststelling van de subsidie aan dat voldaan is aan de verplichtingen
      die verbonden zijn aan de verleende subsidie.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel6.3
  - number: '6.4'
    text: |-
      De aanvraag tot vaststelling gaat vergezeld van een assurancerapport van een accountant die is opgesteld
      overeenkomstig een door het Zorginstituut vastgesteld model met inachtneming van een door het Zorginstituut
      vastgesteld protocol.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel6.4
  - number: 6.5.1
    text: |-
      De subsidie wordt per prestatie vastgesteld op het aantal prestaties dat de subsidieontvanger in het jaar waarvoor
      de subsidie is verstrekt heeft doen verlenen in alle regio's waarvoor de subsidieontvanger als zorgkantoor is
      aangewezen vermenigvuldigd met in 2020: - € 28,31 contact voor Reiskosten zorgverlener;
        - € 122,40 per uur voor Behandeling lvg;
        - € 122,40 per uur voor Behandeling sglvg traject;
        - € 122,40 per uur voor Behandeling sglvg deeltijd;
        - € 120,60 per uur voor Behandeling gedragswetenschapper;
        - € 85,80 per uur voor Behandeling paramedisch;
        - € 110,40 per uur voor Behandeling IOG lvg;
        - € 70,04 per dagdeel voor Dagbehandeling ouderen som en pg;
        - € 89,29 per dagdeel voor Dagbehandeling ouderen som en pg in de vorm van Gespecialiseerde dagbehandeling
      Huntington;
        - € 104,10 per dagdeel voor Dagbehandeling VG emg volwassenen;
        - € 75,26 per dagdeel voor Dagbehandeling LG licht;
        - € 82,09 per dagdeel voor Dagbehandeling LG midden;
        - € 86,29 per dagdeel voor Dagbehandeling LG zwaar;
        - € 7,01 per dag voor Vervoer dagbehandeling V&V;
        - € 11,42 per dag voor Vervoer dagbehandeling GHZ categorie 1;
        - € 16,13 per dag voor Vervoer dagbehandeling GHZ categorie 2;
        - € 25,56 per dag voor Vervoer dagbehandeling GHZ categorie 3;
        - € 43,92 per dag voor Vervoer dagbehandeling GHZ categorie 4;
        - € 63,03 per dag voor Vervoer dagbehandeling GHZ categorie 5.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel6.5
  - number: 6.5.2
    text: |-
      Indien het bedrag, bedoeld in het eerste lid, lager is dan het maximumbedrag van de verleende subsidie, wordt de
      subsidie vastgesteld op het bedrag, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel6.5
  - number: 6.5.3
    text: |-
      Indien voor een of meer subsidieontvangers de subsidie op grond van het tweede lid wordt vastgesteld, verhoogt het
      Zorginstituut ambtshalve met de som van het verschil tussen de in dat lid bedoelde bedragen de subsidies die zijn
      verleend aan de subsidieontvangers waarvoor het bedrag, bedoeld in het eerste lid, hoger is dan het maximumbedrag
      van de verleende subsidie. De verdeling van deze middelen geschiedt naar rato van de overschrijding van het
      maximumbedrag van de verleende subsidie, met dien verstande dat de subsidie niet meer bedraagt dan het bedrag,
      bedoeld in het eerste lid. De subsidie wordt vastgesteld op het aldus verhoogde bedrag van de verleende subsidie.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel6.5
  - number: 6.5.4
    text: |-
      Indien voor geen van de subsidieontvangers de subsidie op grond van het tweede lid wordt vastgesteld, wordt de
      subsidie vastgesteld op het maximumbedrag van de verleende subsidie.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel6.5
  - number: '6.6'
    text: |-
      Binnen tweeëntwintig weken na ontvangst van de aanvraag tot vaststelling van de subsidie neemt het Zorginstituut
      een besluit op de aanvraag.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel6.6
  - number: 6a.1.1
    text: |-
      Het subsidieplafond voor de verstrekking van subsidies bedoeld in [artikel 1.2, zesde lid][ref1], bedraagt
      € 18.000.000.


      [ref1]: https://wetten.overheid.nl/BWBR0036018#Artikel1
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel6a.1
    references:
      - id: ref1
        bwb_id: BWBR0036018
        artikel: '1'
        hoofdstuk: '1'
  - number: 6a.1.2
    text: |-
      Het bedrag van het subsidieplafond, bedoeld in het eerste lid, wordt evenredig verdeeld over alle
      subsidieaanvragers die in aanmerking komen voor subsidie.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel6a.1
  - number: 6a.2.1
    text: |-
      De subsidie voor de in [artikel 1.2, zesde lid][ref1] genoemde subsidiabele prestaties wordt berekend
      overeenkomstig de volgende formule: ((X/29 x A) - B) x 83% waarbij wordt verstaan onder: A: de in euro’s
      uitgedrukte declaratie door de zorgaanbieder voor werkelijk geleverde zorg in februari is; B: de in euro’s
      uitgedrukte daadwerkelijke geleverde zorg door de zorgaanbieder in de in [artikel 1.2, zesde lid][ref2] genoemde
      periode; X: het aantal dagen van de in [artikel 1.2, zesde lid][ref3] genoemde periode met een maximum van 122
      dagen.


      [ref1]: https://wetten.overheid.nl/BWBR0036018#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0036018#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0036018#Artikel1
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel6a.2
    references:
      - id: ref1
        bwb_id: BWBR0036018
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0036018
        artikel: '1'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0036018
        artikel: '1'
        hoofdstuk: '1'
  - number: 6a.3.1
    text: De subsidie wordt op aanvraag verstrekt.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel6a.3
  - number: 6a.3.2
    text: De aanvraag van de subsidie wordt uiterlijk 1 juli 2021 ontvangen.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel6a.3
  - number: 6a.3.3
    text: Een aanvraag na de datum, bedoeld in het tweede lid, wordt afgewezen.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel6a.3
  - number: 6a.3.4
    text: |-
      De aanvrager doet in de aanvraag van de subsidie bedoeld in [artikel 1.2, zesde lid][ref1], opgave van:


      [ref1]: https://wetten.overheid.nl/BWBR0036018#Artikel1
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel6a.3
    references:
      - id: ref1
        bwb_id: BWBR0036018
        artikel: '1'
        hoofdstuk: '1'
  - number: 6a.3.4.a
    text: de in euro’s uitgedrukte declaratie door de zorgaanbieder voor daadwerkelijk geleverde zorg in februari.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel6a.3
  - number: 6a.3.4.b
    text: |-
      de in euro’s uitgedrukte daadwerkelijke geleverde zorg door de zorgaanbieder in de periode van 1 maart 2020 tot en
      met 30 juni 2020.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel6a.3
  - number: 6a.3.5
    text: Voor een aanvraag van de subsidie wordt een door het Zorginstituut vastgesteld formulier gebruikt.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel6a.3
  - number: 6a.3.6
    text: Het aanvraagformulier wordt ondertekend door een persoon die bevoegd is de aanvrager te vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel6a.3
  - number: 6a.3.7
    text: |-
      De aanvraag gaat vergezeld van een assurancerapport van een accountant die is opgesteld overeenkomstig een door het
      Zorginstituut vastgesteld model met inachtneming van een door het Zorginstituut vastgesteld protocol.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel6a.3
  - number: 6a.3.8
    text: De subsidie wordt vastgesteld zonder voorafgaande beschikking tot subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel6a.3
  - number: '7.1'
    text: |-
      Deze regeling vervalt met ingang van 1 januari 2022, met dien verstande dat deze regeling van toepassing blijft op
      subsidies die op grond van deze regeling zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel7.1
  - number: '7.2'
    text: Deze regeling treedt in werking met ingang van 1 januari 2015.
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel7.2
  - number: '7.3'
    text: 'Deze regeling wordt aangehaald als: Tijdelijke subsidieregeling extramurale behandeling.'
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel7.3
