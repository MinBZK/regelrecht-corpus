  - number: 1.2.5
    text: |-
      Behandeling waarop de verzekerde recht heeft uit hoofde van de wet of een zorgverzekering als bedoeld in
      de[ Zorgverzekeringswet][ref1] of die bekostigd kan worden uit hoofde van enig ander wettelijk voorschrift,
      komt niet voor subsidie in aanmerking tenzij het gaat om een verzekerde wiens gelijkstelling berust op
      grond van [artikel 11.1.1, derde lid, van de wet][ref2], nadat de geldigheidsduur van zijn op grond van de
      [Algemene Wet Bijzondere Ziektekosten][ref3] afgegeven indicatiebesluit is verlopen.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0035917#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0036018/2020-12-01#Artikel1.2
    references:
