        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007625
  - number: VIIIb
    text: |-
      Onze Minister van Onderwijs, Cultuur en Wetenschap kan voorafgaande aan het tijdstip van inwerkingtreding van
      [artikel II, onderdeel A][ref1], een school als bedoeld in [artikel 1 van de Wet op de expertisecentra][ref2] waar
      voortgezet speciaal onderwijs wordt verzorgd aanwijzen overeenkomstig artikel II, onderdeel A. Die aanwijzing heeft
      geen betrekking op de periode voorafgaande aan dat tijdstip, en geldt met ingang van dat tijdstip als aanwijzing op
      grond van [artikel 59a van de Wet op het voortgezet onderwijs][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0032212#ArtikelII
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel59a
