  - number: VIIIa.2
    text: |-
      Het bevoegd gezag van een regionaal opleidingencentrum als bedoeld in de [Wet educatie en beroepsonderwijs][ref1]
      kan in afwijking van [artikel 8.1.1 van de Wet educatie en beroepsonderwijs][ref2], in gevallen als geregeld in en
      met inachtneming van het eerste en derde lid, ook tot examenvoorzieningen van de instelling toelaten zij die niet
      als examendeelnemer aan de instelling worden ingeschreven maar zijn ingeschreven als leerling aan een school als
      bedoeld in [artikel 1 van de Wet op de expertisecentra][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel1
