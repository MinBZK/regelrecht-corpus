preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het met het oog op de verbetering van de kwaliteit van het speciaal en
    voortgezet speciaal onderwijs wenselijk is onder meer de opzet en inhoud van het voortgezet speciaal onderwijs aan
    te passen;

    dat het daarvoor noodzakelijk is wijzigingen aan te brengen in de Wet op de expertisecentra, de Wet op het
    voortgezet onderwijs, de Wet educatie en beroepsonderwijs, de Wet referentieniveaus Nederlandse taal en rekenen en
    de Leerplichtwet 1969;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0032212/2013-08-01#ArtikelAanhef
articles:
  - number: VIIIa.1
    text: |-
      Tot aan het tijdstip van inwerkingtreding van [artikel I, onderdeel F][ref1], [artikel 14b][ref2],
      kan het bevoegd gezag van een school als bedoeld in [artikel 1 van de Wet op de expertisecentra][ref3]
      leerlingen van 16 jaar en ouder voor wie, in het kader van het onderwijs een deel van het
      schoolplan op grond van [artikel 24 van de Wet op de expertisecentra][ref4] wordt uitgevoerd
      aan een regionaal opleidingencentrum als bedoeld in de [Wet educatie en beroepsonderwijs][ref5],
      in verbinding met een opleiding voortgezet algemeen volwassenenonderwijs als bedoeld in
      [artikel 7.3.1, eerste lid, onder a, van de Wet educatie en beroepsonderwijs][ref6], in de gelegenheid stellen deel
      te nemen aan een examen van een opleiding voortgezet algemeen volwassenenonderwijs van het betreffende regionaal
      opleidingencentrum. Wat betreft leerlingen van 18 jaar en ouder, kan de eerste volzin enkel worden toegepast voor
      leerlingen die ononderbroken in het speciaal of voortgezet speciaal onderwijs ingeschreven zijn geweest.


