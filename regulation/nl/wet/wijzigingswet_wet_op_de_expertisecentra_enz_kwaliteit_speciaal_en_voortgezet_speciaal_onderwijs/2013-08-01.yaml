  - number: VIIIa.3
    text: |-
      Toepassing van het eerste lid berust op een overeenkomst, gesloten tussen het bevoegd gezag van de school, bedoeld
      in [artikel 1 van de Wet op de expertisecentra][ref1], en het bevoegd gezag van een regionaal opleidingencentrum
      als bedoeld in de [Wet educatie en beroepsonderwijs][ref2]. De overeenkomst omvat in elk geval welke begeleiding
      door de school aan de leerlingen wordt verzorgd ten behoeve van de deelname aan de examens.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0032212/2013-08-01#ArtikelVIIIa
