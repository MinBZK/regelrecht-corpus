  - number: VIIIa
    text: |-
      1 Tot aan het tijdstip van inwerkingtreding van [artikel I, onderdeel F][ref1], [artikel 14b][ref2],
      kan het bevoegd gezag van een school als bedoeld in [artikel 1 van de Wet op de expertisecentra][ref3]
      leerlingen van 16 jaar en ouder voor wie, in het kader van het onderwijs een deel van het
      schoolplan op grond van [artikel 24 van de Wet op de expertisecentra][ref4] wordt uitgevoerd
      aan een regionaal opleidingencentrum als bedoeld in de [Wet educatie en beroepsonderwijs][ref5],
      in verbinding met een opleiding voortgezet algemeen volwassenenonderwijs als bedoeld in
      [artikel 7.3.1, eerste lid, onder a, van de Wet educatie en beroepsonderwijs][ref6], in de gelegenheid stellen deel
      te nemen aan een examen van een opleiding voortgezet algemeen volwassenenonderwijs van het betreffende regionaal
      opleidingencentrum. Wat betreft leerlingen van 18 jaar en ouder, kan de eerste volzin enkel worden toegepast voor
      leerlingen die ononderbroken in het speciaal of voortgezet speciaal onderwijs ingeschreven zijn geweest.

      2 Het bevoegd gezag van een regionaal opleidingencentrum als bedoeld in de [Wet educatie en beroepsonderwijs][ref7]
      kan in afwijking van [artikel 8.1.1 van de Wet educatie en beroepsonderwijs][ref8], in gevallen als geregeld in en
      met inachtneming van het eerste en derde lid, ook tot examenvoorzieningen van de instelling toelaten zij die niet
      als examendeelnemer aan de instelling worden ingeschreven maar zijn ingeschreven als leerling aan een school als
      bedoeld in [artikel 1 van de Wet op de expertisecentra][ref9].

      3 Toepassing van het eerste lid berust op een overeenkomst, gesloten tussen het bevoegd gezag van de school,
      bedoeld in [artikel 1 van de Wet op de expertisecentra][ref10], en het bevoegd gezag van een regionaal
      opleidingencentrum als bedoeld in de [Wet educatie en beroepsonderwijs][ref11]. De overeenkomst omvat in elk geval
      welke begeleiding door de school aan de leerlingen wordt verzorgd ten behoeve van de deelname aan de examens.


