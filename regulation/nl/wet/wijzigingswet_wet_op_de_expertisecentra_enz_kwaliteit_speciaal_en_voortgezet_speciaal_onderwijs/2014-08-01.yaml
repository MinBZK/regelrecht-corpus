  - number: IX
    text: |-
      Deze wet treedt in werking met ingang van een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      artikelen of onderdelen daarvan alsmede voor het speciaal onderwijs en voortgezet speciaal onderwijs verschillend
      kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0032212/2014-08-01#ArtikelIX
