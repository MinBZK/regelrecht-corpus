preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het met het oog op de verbetering van de kwaliteit van het speciaal en
    voortgezet speciaal onderwijs wenselijk is onder meer de opzet en inhoud van het voortgezet speciaal onderwijs aan
    te passen;

    dat het daarvoor noodzakelijk is wijzigingen aan te brengen in de Wet op de expertisecentra, de Wet op het
    voortgezet onderwijs, de Wet educatie en beroepsonderwijs, de Wet referentieniveaus Nederlandse taal en rekenen en
    de Leerplichtwet 1969;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0032212/2014-08-01#ArtikelAanhef
articles:
  - number: VII
    text: |-
      1 [Artikel 6f van de Wet op het voortgezet onderwijs][ref1] is niet van overeenkomstige toepassing ten
      aanzien van leerlingen in het voortgezet speciaal onderwijs die vóór het tijdstip van inwerkingtreding van
      [artikel I, onderdeel F][ref2], [artikel 14a][ref3], zijn ingestroomd in het voortgezet speciaal onderwijs.

      2 [Artikel 6f van de Wet op het voortgezet onderwijs][ref4] is niet van overeenkomstige toepassing ten aanzien van
      leerlingen die ingevolge [artikel I, onderdeel DD][ref5], [artikel 173a, vijfde lid][ref6], het speciaal onderwijs
      hebben verlaten en aansluitend zijn ingestroomd in het voortgezet speciaal onderwijs.


