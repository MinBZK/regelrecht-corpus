        artikel: 10b
      - id: ref2
        bwb_id: BWBR0009684
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0009684
  - number: 11a
    text: |-
      1 Een krachtens [artikel 11, eerste of derde lid][ref1], gegeven last of gesteld verbod wordt, al dan niet op
      verzoek van de rechthebbende, opgeheven onderscheidenlijk ingetrokken zodra een wijziging van de omstandigheden dat
      mogelijk maakt.

      2 Van een besluit, genomen krachtens [artikel 10b, vijfde lid][ref2], en
      [artikel 11, eerste, tweede of derde lid][ref3], of krachtens het eerste lid, wordt mededeling gedaan aan de
      inspecteur en aan burgemeester en wethouders.

      3 Een besluit krachtens het eerste lid treedt eerst in werking zodra het onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0002660#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002660#Artikel10b
      [ref3]: https://wetten.overheid.nl/BWBR0002660#Artikel11
