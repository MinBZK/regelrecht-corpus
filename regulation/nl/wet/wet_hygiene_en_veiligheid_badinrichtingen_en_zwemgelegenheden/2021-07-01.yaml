  - number: 10ca
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de voorlichting van het
      publiek omtrent zwemwater die gedeputeerde staten op een passende wijze in de nabijheid van een zwemwater en via
      media en technologieën verstrekken, gedurende het badseizoen.

      2 Het bevoegd bestuursorgaan en gedeputeerde staten verschaffen aan Onze Minister en Onze Minister van Verkeer en
      Waterstaat de bij of krachtens algemene maatregel van bestuur bepaalde inlichtingen en gegevens.
    url: https://wetten.overheid.nl/BWBR0002660/2021-07-01#Artikel10ca
  - number: 10d
    text: |-
      1 Gedeputeerde staten stellen jaarlijks een onderzoek in naar de veiligheid bij het zwemmen op de op grond van
      [artikel 10b, tweede lid][ref1], aangewezen locaties voor zover het geen badinrichtingen zijn. Voor zover de
      uitkomsten van dit onderzoek niet leiden tot toepassing van [artikel 11][ref2], dragen gedeputeerde staten er zorg
      voor dat het publiek door middel van voorzieningen ter plaatse omtrent de veiligheid wordt ingelicht.

      2 Bij of krachtens algemene maatregel van bestuur kunnen terzake nadere regelen worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002660#Artikel10b
      [ref2]: https://wetten.overheid.nl/BWBR0002660#Artikel11
    url: https://wetten.overheid.nl/BWBR0002660/2021-07-01#Artikel10d
    references:
      - id: ref1
        bwb_id: BWBR0002660
        artikel: 10b
      - id: ref2
        bwb_id: BWBR0002660
        artikel: '11'
  - number: 10e
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent het monitoren van zwemwater door het
      bevoegd bestuursorgaan en wordt bepaald op welke parameters de monitoring betrekking heeft welke parameters slechts
      betrekking mogen hebben op de factoren die de gezondheid van de zwemmer kunnen betreffen en op afval.
    url: https://wetten.overheid.nl/BWBR0002660/2021-07-01#Artikel10e
  - number: 10f
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent:

      a. het zwemwaterprofiel dat het bevoegd bestuursorgaan met een in die maatregel te bepalen frequentie opstelt
      waarin de kenmerken van het zwemwater en de omgeving worden opgenomen die de hoedanigheid van het zwemwater kunnen
      beïnvloeden,

      b. de beoordeling van de hoedanigheid van het zwemwater die het bevoegd bestuursorgaan na afloop van het badseizoen
      uitvoert aan de hand van de resultaten van het in [artikel 10e][ref1] bedoelde onderzoek,

      c. de maatregelen die het bevoegd bestuursorgaan neemt opdat het zwemwater op locaties waar geen toepassing is
      gegeven aan [artikel 11, tweede lid][ref2], voldoet aan de in artikel 5, derde lid, van de zwemwaterrichtlijn
      gestelde eisen, en

      d. de voorwaarden waaronder een zwemwater gedurende maximaal vijf jaar in de klasse slecht wordt ingedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002660#Artikel10e
      [ref2]: https://wetten.overheid.nl/BWBR0002660#Artikel11
    url: https://wetten.overheid.nl/BWBR0002660/2021-07-01#Artikel10f
