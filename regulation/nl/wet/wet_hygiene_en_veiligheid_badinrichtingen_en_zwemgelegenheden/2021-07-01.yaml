        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002660
        artikel: '4'
  - number: '7'
    text: |-
      1 Gedeputeerde staten kunnen met betrekking tot een in hun provincie gelegen badinrichting in het belang van de
      hygiëne en de veiligheid van de bezoekers nadere voorschriften geven.

      2 Bij een besluit krachtens het eerste lid wordt een termijn gesteld, bij het verstrijken waarvan de voorschriften
      gaan gelden. De termijn gaat eerst in zodra het besluit onherroepelijk is geworden.

      3 Alvorens aan het eerste lid toepassing te geven horen gedeputeerde staten de houder van de badinrichting en
      burgemeester en wethouders.

      4 Van het besluit wordt mededeling gedaan aan burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0002660/2021-07-01#Artikel7
  - number: '10'
    text: |-
      1 Degene die voornemens is een badinrichting op te richten, te wijzigen of uit te breiden, geeft van dat voornemen
      kennis aan gedeputeerde staten.

      2 Gedeputeerde staten doen van de kennisgeving mededeling aan burgemeester en wethouders.

      3 Onze Minister kan terzake nadere regelen stellen.
    url: https://wetten.overheid.nl/BWBR0002660/2021-07-01#Artikel10
  - number: 10a
    text: |-
      1 De houder van een badinrichting is verplicht de hoedanigheid van het zwem- en badwater regelmatig te onderzoeken.

      2 Bij of krachtens algemene maatregel van bestuur kunnen terzake van het onderzoek, bedoeld in het eerste lid,
      nadere regelen worden gesteld.

      3 De uitkomsten van het onderzoek, bedoeld in het eerste lid, worden ter kennis gebracht van bij algemene maatregel
      van bestuur aangewezen organen en aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0002660/2021-07-01#Artikel10a
  - number: 10b
    text: |-
      1 Gedeputeerde staten maken jaarlijks aan Onze Minister en aan Onze Minister van Verkeer en Waterstaat de locaties
      bekend waar naar hun oordeel door een groot aantal personen wordt gezwommen. Zij nemen daarbij in aanmerking de
      ontwikkelingen met betrekking tot het aantal personen, de infrastructuur of faciliteiten en de ter bevordering van
      het zwemmen getroffen maatregelen.

      2 Gedeputeerde staten wijzen jaarlijks na overleg met het bevoegd bestuursorgaan de op basis van het
      eerste lid aangemerkte locaties aan, indien daarvan de functie van zwemwater in de plannen, bedoeld in de
      [artikelen 4.1][ref1], [4.4][ref2] en [4.6 van de Waterwet][ref3] is vastgelegd, en stellen Onze in het eerste lid
      genoemde Ministers daarvan op de hoogte.

      3 Een op basis van het eerste lid aangemerkte locatie wordt evenwel niet aangewezen, indien gedurende vijf
      achtereenvolgende jaren de locatie in de klasse slecht is ingedeeld.

      4 Gedeputeerde staten zijn bevoegd om in bij algemene maatregel van bestuur te regelen gevallen een
      op basis van het eerste lid aangemerkte locatie niet aan te wijzen indien toepassing is gegeven aan
      [artikel 11, tweede lid][ref4].

      5 Indien een op basis van het eerste lid aangemerkte locatie niet wordt aangewezen, gelasten gedeputeerde staten
      de houder van een badinrichting deze te sluiten, dan wel indien het niet een badinrichting betreft, stellen zij een
      zwemverbod in of brengen een negatief zwemadvies uit.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel4.1
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel4.4
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel4.6
      [ref4]: https://wetten.overheid.nl/BWBR0002660#Artikel11
    url: https://wetten.overheid.nl/BWBR0002660/2021-07-01#Artikel10b
