  - number: '22'
    text: |-
      De burgemeester is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van een krachtens
      [artikel 11, eerste lid][ref1], gegeven last.


      [ref1]: https://wetten.overheid.nl/BWBR0002660#Artikel11
