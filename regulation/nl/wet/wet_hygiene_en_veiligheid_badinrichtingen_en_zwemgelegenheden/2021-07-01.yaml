    text: |-
      De voordracht voor een algemene maatregel van bestuur krachtens [artikel 1, derde lid][ref1], [10b][ref2],
      [10d][ref3], [10e][ref4], [10f][ref5] en [11, vierde lid][ref6], wordt Ons gedaan door Onze Minister en Onze
      Minister van Verkeer en Waterstaat.


