  - number: '2'
    text: |-
      Het is de houder van een badinrichting verboden gelegenheid tot zwemmen of baden in die inrichting te geven, indien
      niet is voldaan aan de met betrekking tot die inrichting krachtens de [artikelen 3][ref1], [4][ref2] en [7][ref3]
      geldende voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0002660#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002660#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0002660#Artikel7
    url: https://wetten.overheid.nl/BWBR0002660/2021-07-01#Artikel2
    references:
      - id: ref1
