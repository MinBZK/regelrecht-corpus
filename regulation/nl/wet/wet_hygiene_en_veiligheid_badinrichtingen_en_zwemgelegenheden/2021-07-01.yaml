  - number: '23'
    text: |-
      1 Een gedraging in strijd met het verbod, gesteld bij [artikel 2][ref1], of met een last, gegeven krachtens
      [artikel 10b, vijfde lid,][ref2] en [artikel 11, eerste, tweede of derde lid][ref3], wordt gestraft met hechtenis
      van ten hoogste zes maanden of geldboete van de derde categorie.

      2 Een gedraging in strijd met een voorschrift, gegeven bij of krachtens [artikel 5, derde lid][ref4],
      [10, eerste lid of tweede lid][ref5], of [10a][ref6], wordt gestraft met hechtenis van ten hoogste twee maanden of
      geldboete van de tweede categorie.

      3 Een gedraging in strijd met een verbod, gesteld krachtens [artikel 11][ref7], wordt gestraft met een geldboete
      van de tweede categorie.

      4 De in de voorgaande leden strafbaar gestelde feiten zijn overtredingen.


