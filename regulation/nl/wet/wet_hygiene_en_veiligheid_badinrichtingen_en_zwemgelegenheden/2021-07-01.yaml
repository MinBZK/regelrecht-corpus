  - number: '15'
    text: |-
      1 Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren.

      2 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet binnen een provincie of gemeente
      zijn tevens belast de bij besluit van gedeputeerde staten onderscheidenlijk burgemeester en wethouders aangewezen
      ambtenaren.

      3 Met de opsporing van de bij deze wet strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref1], belast de daartoe aangewezen buitengewone
      opsporingsambtenaren. Deze ambtenaren zijn tevens belast met de opsporing van de feiten, strafbaar gesteld in de
      [artikelen 179][ref2] tot en met [182][ref3] en [184 van het Wetboek van Strafrecht][ref4], voor zover deze feiten
      betrekking hebben op een bevel, vordering of handeling, gedaan of ondernomen door henzelf.

      4 Van een besluit als bedoeld in een der voorgaande leden, wordt mededeling gedaan door plaatsing in de
      *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel182
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0002660/2021-07-01#Artikel15
