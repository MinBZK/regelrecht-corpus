        artikel: '11'
  - number: '11'
    text: |-
      1 Indien de omstandigheden met betrekking tot een badinrichting of een andere plaats die wordt gebruikt voor het
      zwemmen, daartoe uit oogpunt van hygiëne of veiligheid van de bezoekers aanleiding geven, kunnen gedeputeerde
      staten de houder van de badinrichting gelasten deze te sluiten, onderscheidenlijk een zwemverbod instellen of een
      negatief zwemadvies uitbrengen.

      2 Gedeputeerde staten gelasten de houder van een badinrichting in oppervlaktewater deze te sluiten, respectievelijk
      stellen een zwemverbod in of brengen een negatief zwemadvies uit voor een andere locatie, indien de maatregelen
      teneinde te voldoen aan de klasse aanvaardbaar niet uitvoerbaar of onevenredig kostbaar zijn.

      3 Ingeval voor de gezondheid of de veiligheid van de bezoekers onmiddellijk gevaar dreigt, kan de bevoegdheid,
      bedoeld in het eerste lid, worden uitgeoefend door Onze commissaris in de provincie.

      4 Met betrekking tot de op grond van [artikel 10b, tweede lid][ref1], aangewezen locaties wordt bij algemene
      maatregel van bestuur bepaald dat binnen een daarbij te stellen termijn aan het eerste lid toepassing moet
      worden gegeven indien niet wordt voldaan aan bij die maatregel gestelde eisen betreffende de hoedanigheid van het
      zwemwater.

      5 Indien vanwege het gevaar voor de verspreiding van een infectieziekte als bedoeld in
      [artikel 2 van de Infectieziektenwet][ref2] een besluit krachtens het eerste of derde lid wordt overwogen, wordt
      voorafgaande aan dat besluit het advies ingewonnen van de desbetreffende directeur als bedoeld in [die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002660#Artikel10b
      [ref2]: https://wetten.overheid.nl/BWBR0009684#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0009684
    url: https://wetten.overheid.nl/BWBR0002660/2021-07-01#Artikel11
    references:
      - id: ref1
