        bwb_id: BWBR0002660
        artikel: '7'
  - number: '3'
    text: |-
      1 In het belang van de hygiëne kunnen bij algemene maatregel van bestuur met betrekking tot badinrichtingen
      voorschriften worden gegeven betreffende:

      a. de hoedanigheid en de behandeling van het zwem- en badwater;

      b. het aantal en de inrichting van douches en toiletten;

      c. de voorziening met drink- en waswater en de afvoer van afvalwater;

      d. de te bezigen materialen;

      e. het treffen van voorzieningen ten behoeve van de reinheid;

      f. de gelegenheid tot het bergen van kleding;

      g. het aantal gelijktijdig toe te laten bezoekers;

      h. het toezicht,

      i. preventieve maatregelen ter bescherming van de gezondheid.

      2 De voorschriften, bedoeld in het eerste lid, bevatten slechts hetgeen naar Ons oordeel uit het oogpunt van
      hygiëne strikt noodzakelijk is.

      3 De voorschriften, bedoeld in het eerste lid, onder a, gelden niet met betrekking tot de badinrichtingen behorend
      tot de op grond van [artikel 10b, tweede lid][ref1], aangewezen locaties.


      [ref1]: https://wetten.overheid.nl/BWBR0002660#Artikel10b
    url: https://wetten.overheid.nl/BWBR0002660/2021-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002660
        artikel: 10b
  - number: '4'
    text: |-
      1 In het belang van de veiligheid van de bezoekers kunnen bij algemene maatregel van bestuur met betrekking tot
      badinrichtingen voorschriften worden gegeven betreffende:

      a. het treffen van technische voorzieningen;

      b. de voorzieningen met betrekking tot het zich te water begeven;

      c. het in het zwem- en badwater aanbrengen van een aanduiding der waterdiepten;

      d. de te bezigen materialen;

      e. het treffen van voorzieningen ten behoeve van eerste hulp bij ongelukken;

      f. het aantal gelijktijdig toe te laten bezoekers;

      g. het toezicht.

      2 De voorschriften, bedoeld in het eerste lid, bevatten slechts hetgeen naar Ons oordeel uit het oogpunt van
      veiligheid strikt noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0002660/2021-07-01#Artikel4
  - number: '5'
    text: |-
      1 In bijzondere gevallen kunnen gedeputeerde staten, op verzoek van de houder van een badinrichting, ontheffing
      verlenen van krachtens de [artikelen 3][ref1] en [4][ref2] gegeven voorschriften.

      2 Een besluit, ontheffing betreffende, treedt eerst in werking zodra het onherroepelijk is geworden.

      3 Een ontheffing kan onder beperkingen worden verleend. Aan een ontheffing kunnen voorschriften worden verbonden.

      4 Alvorens een besluit te nemen horen gedeputeerde staten burgemeester en wethouders.

      5 Op een verzoek als bedoeld in het eerste lid, wordt binnen acht weken na ontvangst van het verzoek beslist. Van
      het besluit wordt mededeling gedaan aan burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0002660#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002660#Artikel4
    url: https://wetten.overheid.nl/BWBR0002660/2021-07-01#Artikel5
    references:
