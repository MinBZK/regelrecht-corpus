preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is bij de wet regelen te stellen met betrekking tot de
    hygiëne en de veiligheid in zweminrichtingen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002660/2021-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:

      *badinrichting:* een voor het publiek of voor personen, behorende tot bij algemene maatregel van bestuur aangewezen
      categorieën, toegankelijke plaats, welke is ingericht om te worden gebruikt voor het zwemmen of baden, tezamen met
      de daarbij behorende terreinen, gebouwen, getimmerten en uitrustingen;

      *badseizoen:* tijdvak als bedoeld in artikel 2 van de zwemwaterrichtlijn;

      *bevoegd bestuursorgaan:* bestuursorgaan dat bevoegd is een vergunning krachtens de [artikelen 6.2][ref1] en
      [6.3 van de Waterwet][ref2] te verlenen;

      *inspecteur:* als zodanig bij besluit van Onze Minister aangewezen ambtenaar;

      *locatie:* plaats als bedoeld in artikel 1, derde lid, van de zwemwaterrichtlijn;

      *Onze Minister:* Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

      *zwemwaterprofiel:* zwemwaterprofiel als bedoeld in artikel 6 van de zwemwaterrichtlijn;

      *zwemwaterrichtlijn:* richtlijn 2006/7/EG van het Europees Parlement en de Raad van de Europese Unie van
      15 februari 2006 betreffende het beheer van de zwemwaterkwaliteit en tot intrekking van Richtlijn 76/160/EEG (PbEU
      L 64).

      2 Bij ministeriële regeling worden de aanvang en het einde van het badseizoen vastgesteld en kunnen andere
      tijdstippen en termijnen die bij de toepassing van deze wet regeling behoeven worden vastgesteld.

      3 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de indeling
      van het zwemwater in de klassen slecht, aanvaardbaar, goed of uitstekend zoals bedoeld in artikel 5 van de
      zwemwaterrichtlijn.

      4 De bevoegdheid tot het stellen van regels op grond van de artikelen 1, tweede en derde lid,
      [10b, vierde lid][ref3], [10ca][ref4], [10e][ref5], [10f][ref6] en [11, vierde lid][ref7], kan slechts worden
      aangewend voor zover zulks noodzakelijk is ter implementatie van EG-richtlijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6.2
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6.3
