  - number: 10c
    text: |-
      1 Op de voorbereiding van een aanwijzing als bedoeld in [artikel 10b, tweede lid][ref1], is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van toepassing. Zienswijzen kunnen naar voren worden
      gebracht door de ingezetenen van de desbetreffende provincie en overige belanghebbenden.

      2 Indien de aanwijzing, bedoeld in [artikel 10b, tweede lid][ref3], betrekking heeft op grensvormende of
      grensoverschrijdende wateren, worden de ten aanzien van die wateren bevoegde Duitse of Belgische autoriteiten
      geraadpleegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002660#Artikel10b
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref3]: https://wetten.overheid.nl/BWBR0002660#Artikel10b
