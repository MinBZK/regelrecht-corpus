preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het ter implementatie van richtlijn 2014/45/EU noodzakelijk is een
    periodieke technische controle voor bepaalde landbouw- en bosbouwtrekkers en in verband daarmee een registratie-
    en kentekenplicht voor alle landbouw- en bosbouwtrekkers in te voeren alsmede dat het wenselijk is die registratie-
    en kentekenplicht ook in te voeren voor motorrijtuigen met beperkte snelheid, mobiele machines en aanhangwagens die
    uitsluitend bestemd zijn om daardoor te worden voortbewogen en daarnaast geen nieuwe motorrijtuigen met beperkte
    snelheid meer tot het verkeer toe te laten, om mede uitvoering te geven aan richtlijn 2014/47/EU en verordeningen
    (EU) nr. 167/2013 en (EU) 2016/1628, de verkeersveiligheid te verhogen en snelheidsverhoging en centrale ontheffing
    mogelijk te maken;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0043651/2025-01-01#ArtikelAanhef
articles:
  - number: VIIIa
    text: |-
      Onze Minister van Infrastructuur en Waterstaat zendt binnen drie jaar na de inwerkingtreding van deze wet aan de
      Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk, waarbij in het
      bijzonder aandacht besteed wordt aan de nalevingskosten.
    url: https://wetten.overheid.nl/BWBR0043651/2025-01-01#ArtikelVIIIa
  - number: IX
    text: |-
      1 Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.

      2 De [artikelen II][ref1], [V][ref2] en [VII][ref3] vervallen met ingang van een bij koninklijk besluit te bepalen
      tijdstip.

      3 [Artikel III][ref4] vervalt met ingang van 1 januari 2025.


