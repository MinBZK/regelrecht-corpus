        artikel: 4:76
  - number: '31'
    text: |-
      Voor het activiteitenplan en de begroting, bedoeld in [artikel 4:61 van de Algemene wet bestuursrecht][ref1], wordt
      een door de Minister vastgesteld formulier gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel461
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:61
  - number: '32'
    text: |-
      1 Een instellingssubsidie bestaat uit een door de minister te bepalen bedrag voor overeenkomstig een door de
      minister goedgekeurd activiteitenplan uitgevoerde activiteiten.

      2 Indien de activiteiten bestaan uit meetbare prestatie-eenheden kan de minister normbedragen vaststellen voor
      deze eenheden.
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel32
  - number: '33'
    text: |-
      De minister geeft een beschikking op een aanvraag van een instellingssubsidie binnen dertien weken na ontvangst van
      de aanvraag.
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel33
  - number: '34'
    text: |-
      1 De minister verstrekt de volgende voorschotten op een verleende instellingssubsidie: in januari 8%, februari 8%,
      maart 8%, april 7%, mei 16%, juni 7%, juli 8%, augustus 8%, september 7%, oktober 8%, november 8% en december 7%
      van het voor het desbetreffende jaar verleende subsidiebedrag.

      2 De minister kan van het gestelde in het eerste lid op verzoek van de subsidieontvanger
      afwijken en in het geval dat een aanvraag om instellingssubsidie later wordt ingediend dan in
      [artikel 4:60 van de Algemene wet bestuursrecht][ref1] is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel460
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:60
  - number: '35'
    text: |-
      De ontvanger van een instellingssubsidie zorgt ervoor dat:

      a. de doeleinden gesteld in het activiteitenplan op doelmatige wijze worden nagestreefd;

      b. de werkzaamheden op een zodanige manier worden geregeld dat een goed beleid en beheer worden gevoerd.
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel35
  - number: '36'
    text: |-
      De ontvanger van een instellingssubsidie doet zo spoedig mogelijk schriftelijk mededeling aan de minister van
      omstandigheden die van belang kunnen zijn voor een beslissing tot wijziging, intrekking of vaststelling van de
      subsidie. Daarbij worden de relevante stukken overgelegd.
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel36
  - number: '37'
    text: |-
      1 De privaatrechtelijke rechtspersoon die een instellingssubsidie ontvangt, verzekert haar roerende en
      onroerende zaken op afdoende wijze tegen het risico van diefstal en brand alsmede tegen het risico van wettelijke
      aansprakelijkheid tegenover derden.

      2 De ontvanger van een instellingssubsidie verzekert voor vrijwilligers die werkzaamheden verrichten in het kader
      van de gesubsidieerde activiteiten, hun wettelijke aansprakelijkheid.

      3 De minister kan op aanvraag ontheffing verlenen van het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel37
  - number: '38'
    text: |-
      1 Indien een gesubsidieerde activiteit leidt tot een publicatie, kan de minister bepalen dat de ontvanger van een
      instellingssubsidie er zorg voor draagt dat bij de publicatie wordt aangegeven wie de uitvoerder en subsidiënt van
      het project zijn geweest.

      2 Indien een instellingssubsidie gericht is of mede gericht is op de totstandkoming van een werk als bedoeld in
      [artikel 10, onder 1°, van de Auteurswet][ref1], draagt de subsidieontvanger er zorg voor auteursrechthebbende te
      zijn ter zake van dat werk.

      3 De ontvanger van een instellingssubsidie vrijwaart de Staat der Nederlanden voor aanspraken van derden ter zake
      van alle schade die zij lijden ten gevolge van de door of vanwege de subsidieontvanger verrichte publicaties.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel10
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '10'
  - number: '39'
    text: |-
      De minister kan bij de verlening van een instellingssubsidie verplichtingen opleggen die strekken tot
      verwezenlijking van het doel van de subsidie.
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel39
  - number: '40'
    text: |-
      De ontvanger van een instellingssubsidie die aan derden goederen ter beschikking stelt of voor derden diensten
      verricht, brengt daarvoor een vergoeding in rekening die ten minste kostendekkend is, tenzij het derden betreft
      voor wie de gesubsidieerde activiteiten bestemd zijn.
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel40
  - number: '41'
    text: |-
      De ontvanger van een instellingssubsidie werkt mee aan door of namens de minister ingestelde onderzoekingen die
      erop zijn gericht de minister inlichtingen te verschaffen ten behoeve van de ontwikkeling van het beleid.
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel41
  - number: '42'
    text: |-
      1 In afwijking van [artikel 4:74, eerste lid, van de Algemene wet bestuursrecht][ref1] dient de ontvanger van een
      instellingssubsidie binnen vier maanden na afloop van het boekjaar een aanvraag tot vaststelling van de subsidie
      in.

      2 Voor het financieel verslag en het activiteitenverslag als bedoeld in
      [artikel 4:75 van de Algemene wet bestuursrecht][ref2] wordt een door de Minister vastgesteld formulier gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel474
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel475
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:74
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:75
  - number: '43'
    text: |-
      1 Het financieel verslag of, indien de ontvanger van een instellingssubsidie verplicht is tot het
      opstellen van een jaarrekening als bedoeld in [artikel 361 van Boek 2 van het Burgerlijk Wetboek][ref1],
      de jaarrekening gaat vergezeld van een verklaring van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2] overeenkomstig een door de Minister
      vastgestelde modelaccountantsverklaring.

      2 Het financieel verslag of de jaarrekening gaat vergezeld van een rapportage omtrent de naleving van de
      subsidiebepalingen door de subsidieontvanger, opgesteld door een accountant overeenkomstig een door de Minister
      vastgesteld controleprotocol.

      3 De ontvanger van een instellingssubsidie draagt er zorg voor dat de accountant meewerkt aan door of namens de
      departementale auditdienst in te stellen onderzoeken naar de door de accountant verrichte werkzaamheden.

      4 Het eerste en tweede lid zijn niet van toepassing indien de verleende instellingssubsidie minder dan € 125.000
      bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel361
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '361'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '44'
    text: |-
      Binnen vijf maanden na ontvangst van de aanvraag, bedoeld in [artikel 43][ref1], geeft de minister een beschikking
      tot vaststelling van de subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0019947#Artikel43
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0019947
        artikel: '43'
        hoofdstuk: III
        paragraaf: '5'
  - number: '45'
    text: |-
      1 In de gevallen, bedoeld in [artikel 4:41, tweede lid, van de Algemene wet bestuursrecht][ref1], kan de minister
      een door hem te bepalen vergoeding opleggen.

      2 Bij de bepaling van de hoogte van de vergoeding wordt uitgegaan van de waarde van de goederen en andere
      vermogensbestanddelen, waaronder de egalisatiereserve, op het tijdstip waarop de vergoeding verschuldigd wordt,
      met dien verstande dat in geval van ontvangst van schadevergoeding voor verlies of beschadiging van zaken, wordt
      uitgegaan van het bedrag dat als schadevergoeding door de instelling wordt ontvangen. Indien het onroerende zaken
      betreft, geschiedt de waardebepaling door één of drie onafhankelijke deskundigen.

      3 Het eerste lid is niet van toepassing, indien de activiteiten van de subsidieontvanger door een derde worden
      voortgezet en de activa en passiva met toestemming van de minister tegen boekwaarde aan die derde worden
      overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel441
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:41
  - number: '46'
    text: |-
      De minister kan indien bijzondere omstandigheden daartoe aanleiding geven, artikelen buiten toepassing laten of
      daarvan afwijken.
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel46
  - number: '47'
    text: |-
      De door subsidieontvangers op grond van [artikel 7 van de Subsidieregeling welzijnsbeleid][ref1] en
      [artikel 9 van de Subsidieregeling volksgezondheid][ref2] opgebouwde reservering, wordt na inwerkingtreding van
      deze regeling toegevoegd aan de egalisatiereserve.


      [ref1]: https://wetten.overheid.nl/BWBR0007807#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0009812#Artikel9
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0007807
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0009812
        artikel: '9'
  - number: '48'
    text: |-
      1 De [Subsidieregeling volksgezondheid][ref1] en de [Subsidieregeling welzijnsbeleid][ref2] worden ingetrokken.

      2 Op subsidies die voor de inwerkingtreding van deze regeling zijn verleend of vastgesteld en op aanvragen
      voor een instellingssubsidie voor 2006 waarop voor 1 juli 2006 nog geen besluit is genomen, blijven de
      [Subsidieregeling volksgezondheid][ref3] en de [Subsidieregeling welzijnsbeleid][ref4] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009812
      [ref2]: https://wetten.overheid.nl/BWBR0007807
      [ref3]: https://wetten.overheid.nl/BWBR0009812
      [ref4]: https://wetten.overheid.nl/BWBR0007807
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0009812
      - id: ref2
        bwb_id: BWBR0007807
      - id: ref3
        bwb_id: BWBR0009812
      - id: ref4
        bwb_id: BWBR0007807
  - number: '49'
    text: Deze regeling treedt in werking op 1 juli 2006.
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel49
  - number: '50'
    text: 'Deze regeling wordt aangehaald als: Subsidieregeling VWS-subsidies.'
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel50
