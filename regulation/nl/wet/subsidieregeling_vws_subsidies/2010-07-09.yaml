  - number: '10'
    text: De minister kan projectsubsidies verlenen die zich uitstrekken over meer dan een kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel10
  - number: '11'
    text: |-
      1 Een projectsubsidie bestaat uit het verschil tussen de met de gesubsidieerde activiteiten samenhangende
      werkelijke lasten en de met de gesubsidieerde activiteiten samenhangende werkelijke baten. De subsidie bedraagt
      niet meer dan het bij de subsidieverlening bepaalde maximum.

      2 Een projectsubsidie als bedoeld in [artikel 9, tweede lid][ref1], bestaat uit een bij de subsidievaststelling te
      bepalen bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0019947#Artikel9
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0019947
        artikel: '9'
        hoofdstuk: II
        paragraaf: '1'
  - number: '12'
    text: |-
      Een projectsubsidie kan worden aangevraagd door een privaatrechtelijke rechtspersoon met volledige
      rechtsbevoegdheid, een publiekrechtelijke rechtspersoon of een natuurlijke persoon.
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel12
  - number: '13'
    text: |-
      1 Een aanvraag voor een projectsubsidie wordt ingediend voor de aanvang van de periode waarvoor subsidie wordt
      gevraagd.

      2 De minister kan bepalen dat aanvragen voor een projectsubsidie op bepaalde terreinen vóór een of meer bepaalde
      door hem vastgestelde data worden ingediend.
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel13
  - number: '14'
    text: |-
      1 De aanvraag van een projectsubsidie wordt onderbouwd met een projectplan en een begroting. Voor het projectplan
      en de begroting wordt een door de Minister vastgesteld formulier gebruikt.

      2 Indien de aanvrager van een projectsubsidie een privaatrechtelijke rechtspersoon is, kan de minister hem
      verplichten een volledig en recent overzicht van zijn financiële toestand over te leggen.

      3 In het projectplan worden de aard en de omvang van de voorgenomen activiteiten beschreven. Daarbij wordt
      aangegeven welke doelstelling de aanvrager met de activiteiten nastreeft en op welke wijze die zullen worden
      uitgevoerd.

      4 De begroting geeft inzicht in de baten en lasten van de activiteiten zoals opgenomen in het projectplan. De
      begroting is voorzien van een postgewijze toelichting. Baten en lasten die door middel van interne doorberekingen
      worden toegerekend, worden bepaald op bedrijfseconomische en maatschappelijk aanvaardbare grondslagen. Voor zover
      hierin lasten zijn begrepen van materiële vaste activa, worden deze lasten op basis van aanschaffingsprijzen van
      die activa berekend.

      5 Voor zover de aanvrager voor dezelfde begrote lasten tevens subsidie of een andere financiële bijdrage heeft
      aangevraagd bij een of meer andere bestuursorganen, doet hij daarvan mededeling in de aanvraag, onder vermelding
      van de stand van zaken met betrekking tot de beoordeling van die aanvraag of aanvragen.

      6 Indien de aanvraag wordt ingediend door een privaatrechtelijke rechtspersoon wordt de aanvraag ondertekend door
      degene die op grond van de statuten bevoegd is de rechtspersoon te vertegenwoordigen, of door een persoon die
      daartoe gevolmachtigd is.
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel14
  - number: '15'
    text: |-
      De minister geeft een beschikking op een aanvraag van een projectsubsidie binnen dertien weken na ontvangst van
      de aanvraag.
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel15
  - number: '16'
    text: |-
      1 De minister kan op een verleende projectsubsidie voorschotten verlenen.

      2 Voorschotten worden gelijkmatig over het aantal maanden verstrekt, waarvoor de subsidie is aangevraagd. Gedurende
      het project bedragen de voorschotten in totaal niet meer dan 90% van het bedrag van de verleende projectsubsidie.

      3 Uiterlijk vier maanden na ontvangst van de volledige aanvraag voor de subsidievaststelling worden de voorschotten
      verhoogd tot het bedrag van de subsidiedeclaratie voor zover het bedrag van de subsidiedeclaratie niet hoger is dan
      het bedrag van de verleende projectsubsidie.

      4 De minister kan, indien hierom in de aanvraag wordt verzocht, afwijken van het bepaalde in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel16
  - number: '17'
    text: |-
      De ontvanger van een projectsubsidie zorgt ervoor dat:

      a. de doeleinden, gesteld in het projectplan op doelmatige wijze worden nagestreefd en

      b. de werkzaamheden op een zodanige manier worden geregeld dat een goed beleid en beheer worden gevoerd.
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel17
  - number: '18'
    text: |-
      De ontvanger van een projectsubsidie zorgt er voor dat:

      a. de administratie op overzichtelijke en doelmatige wijze wordt gevoerd en

      b. dat te allen tijde de voor de vaststelling van de subsidie van belang zijnde baten en lasten kunnen worden
      nagegaan.
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel18
  - number: '19'
    text: |-
      De ontvanger van een projectsubsidie doet zo spoedig mogelijk schriftelijk mededeling aan de minister van
      omstandigheden die van belang kunnen zijn voor een beslissing tot wijziging, intrekking of vaststelling van de
      subsidie. Daarbij worden de relevante stukken overgelegd.
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel19
  - number: '20'
    text: |-
      1 De ontvanger van een projectsubsidie stelt na afloop van de periode waarvoor subsidie is verleend een
      projectverslag vast dat inzicht geeft in de aard, duur en omvang van de in het kader van de subsidiëring verrichte
      activiteiten. In het projectverslag worden de verrichte activiteiten met de in projectplan voorgenomen activiteiten
      vergeleken.

      2 Bij projectsubsidies als bedoeld in [artikel 9, tweede lid][ref1], legt de subsidieontvanger na afloop van
      de periode waarvoor subsidie was verstrekt, een verklaring over waaruit kan worden afgeleid dat de activiteiten
      waarvoor subsidie was verstrekt, zijn uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0019947#Artikel9
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0019947
        artikel: '9'
        hoofdstuk: II
        paragraaf: '1'
  - number: '21'
    text: |-
      1 Indien een gesubsidieerde activiteit leidt tot een publicatie, kan de minister bepalen dat de ontvanger van een
      projectsubsidie er zorg voor draagt dat bij de publicatie wordt aangegeven wie de uitvoerder en subsidiënt van het
      project zijn geweest.

      2 Indien een projectsubsidie gericht is of mede gericht is op de totstandkoming van een werk als bedoeld in
      [artikel 10, onder 1°, van de Auteurswet][ref1], draagt de subsidieontvanger er zorg voor auteursrechthebbende te
      zijn ter zake van dat werk.

      3 De ontvanger van een projectsubsidie vrijwaart de Staat der Nederlanden voor aanspraken van derden ter zake van
      alle schade die zij lijden ten gevolge van de door of vanwege de subsidieontvanger verrichte publicaties.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel10
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '10'
  - number: '22'
    text: |-
      De ontvanger van een projectsubsidie die aan derden goederen ter beschikking stelt of voor derden diensten
      verricht, brengt daarvoor een vergoeding in rekening die ten minste kostendekkend is, tenzij het derden betreft
      voor wie de gesubsidieerde activiteiten bestemd zijn.
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel22
  - number: '23'
    text: |-
      De ontvanger van een projectsubsidie werkt mee aan door of namens de minister ingestelde onderzoekingen die erop
      zijn gericht de minister inlichtingen te verschaffen ten behoeve van de ontwikkeling van het beleid.
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel23
  - number: '24'
    text: |-
      De minister kan bij de verlening van een projectsubsidie verplichtingen opleggen die strekken tot verwezenlijking
      van het doel van de subsidie.
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel24
  - number: '25'
    text: |-
      1 Binnen vier maanden na afloop van de periode waarvoor subsidie is verleend, dient de subsidieontvanger een
      aanvraag in voor de subsidievaststelling.

      2 De aanvraag voor de subsidievaststelling gaat vergezeld van:

      a. het projectverslag, bedoeld in [artikel 20, eerste lid][ref1], en

      b. een subsidiedeclaratie.

      3 Voor het projectverslag en de subsidiedeclaratie wordt een door de Minister vastgesteld formulier gebruikt.

      4 Indien de aanvraag wordt ingediend door een privaatrechtelijke rechtspersoon, wordt de aanvraag ondertekend
      door degene die op grond van de statuten bevoegd is de rechtspersoon te vertegenwoordigen, of door een persoon die
      daartoe gevolmachtigd is.

      5 De minister kan ontheffing verlenen van de in het eerste lid genoemde aanvraagtermijn.


      [ref1]: https://wetten.overheid.nl/BWBR0019947#Artikel20
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0019947
        artikel: '20'
        hoofdstuk: II
        paragraaf: '5'
  - number: '26'
    text: |-
      De subsidiedeclaratie geeft een zodanig inzicht dat een verantwoord oordeel kan worden gevormd omtrent de
      aanwending en de besteding van de subsidie door de subsidieontvanger en geeft de nodige informatie om de subsidie
      vast te stellen. De subsidiedeclaratie sluit aan op de indeling van de bij de subsidieaanvraag ingediende
      begroting. Belangrijke verschillen tussen declaratie en begroting worden toegelicht.
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel26
  - number: '27'
    text: |-
      1 De subsidiedeclaratie is voorzien van een verklaring van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1], overeenkomstig een door de Minister
      vastgestelde modelaccountantsverklaring.

      2 De subsidiedeclaratie gaat vergezeld van een rapportage omtrent de naleving van de subsidiebepalingen door de
      subsidieontvanger, opgesteld door de accountant overeenkomstig een door de Minister vastgesteld controleprotocol.

      3 De subsidieontvanger draagt er zorg voor dat de accountant meewerkt aan door of namens de departementale
      auditdienst in te stellen onderzoeken naar de door de accountant verrichte (controle)werkzaamheden.

      4 Het eerste en tweede lid zijn niet van toepassing indien de verleende projectsubsidie minder dan € 125.000
      bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '28'
    text: |-
      Binnen vier maanden na ontvangst van de aanvraag, bedoeld in [artikel 25][ref1], geeft de minister een beschikking
      tot vaststelling.


      [ref1]: https://wetten.overheid.nl/BWBR0019947#Artikel25
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0019947
        artikel: '25'
        hoofdstuk: II
        paragraaf: '6'
  - number: '29'
    text: Instellingssubsidies worden verleend voor de periode van één boekjaar.
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel29
  - number: '30'
    text: |-
      1 [Afdeling 4.2.8. van de Algemene wet bestuursrecht][ref1] is, met uitzondering van
      [artikel 4:64, eerste lid, onder a][ref2], van toepassing op instellingssubsidies.

      2 De minister kan vrijstelling of ontheffing verlenen van de in
      [artikel 4:60 van de Algemene wet bestuursrecht][ref3] gestelde termijn voor indiening van de subsidieaanvraag.

      3 De ontvanger van een instellingssubsidie vormt een egalisatiereserve, tenzij sprake is van een subsidie als
      bedoel in [artikel 32, tweede lid][ref4]. Bij de subsidieverlening kan de omvang van de egalisatiereserve in
      aanmerking worden genomen. In afwijking van [artikel 4:72, tweede lid, Algemene wet bestuursrecht][ref5] wordt
      het aan de egalisatiereserve toe te voegen dan wel te onttrekken bedrag berekend door het totaal van de met de
      gesubsidieerde activiteiten samenhangende baten, waaronder de vastgestelde instellingssubsidie en de gerealiseerde
      overige baten, te verminderen met de lasten van de gesubsidieerde activiteiten. Deze uitkomst wordt vervolgens
      toegerekend naar rato van de vastgestelde instellingssubsidie en de in de ingediende begroting vermelde, met de
      gesubsidieerde activiteiten samenhangende overige baten.

      4 Indien de subsidieontvanger zijn inkomsten in overwegende mate ontleent aan de instellingssubsidie, is
      [artikel 4:76 van de Algemene wet bestuursrecht][ref6] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.2.8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel464
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel460
      [ref4]: https://wetten.overheid.nl/BWBR0019947#Artikel32
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel472
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel476
