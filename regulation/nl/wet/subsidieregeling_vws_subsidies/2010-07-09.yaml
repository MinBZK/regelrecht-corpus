  - number: '8'
    text: Een besluit tot vaststelling van een subsidieplafond wordt in de Staatscourant bekendgemaaktt.
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel8
  - number: '9'
    text: |-
      1 Projectsubsidies van € 20.000 of meer worden verstrekt met toepassing van de [artikelen 10 tot en met 28][ref1].

      2 Projectsubsidies van minder dan € 20.000 kunnen zonder voorafgaande subsidieverlening worden vastgesteld.
      De [artikelen 11, eerste lid][ref2], [16][ref3] ,[18][ref4], [19][ref5], [20, eerste lid][ref6], en
      [25 tot en met 28][ref7] zijn niet van toepassing.


