preamble:
  text: |-
    Gelet op artikel 10 van de Welzijnswet 1994 en artikel 3 van de Kaderwet Volksgezondheidssubsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. minister: de Minister van Volksgezondheid, Welzijn en Sport;

      b. instelling: een privaatrechtelijke rechtspersoon met volledige rechtsbevoegdheid, dan wel een rechtspersoon
      krachtens publiekrecht ingesteld;

      c. instellingssubsidie: een per boekjaar verstrekte subsidie in de kosten van structurele activiteiten van een
      instelling;

      d. projectsubsidie: subsidie met een incidenteel karakter in de kosten van de activiteiten opgenomen in het
      projectplan, bedoeld in [artikel 14, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019947#Artikel14
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019947
        artikel: '14'
        hoofdstuk: II
        paragraaf: '3'
  - number: '2'
    text: |-
      Deze regeling is van toepassing op alle subsidieverstrekkingen door de minister op het terrein van de
      gezondheidsbevordering, de gezondheidsbescherming, de gezondheidszorg, de maatschappelijke zorg en de sport, tenzij
      daarvoor in een ministeriële regeling andere regels zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel2
  - number: '3'
    text: |-
      Een subsidie ten laste van een begroting die nog niet is vastgesteld, wordt verleend onder de voorwaarde, bedoeld
      in [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel434
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:34
  - number: '4'
    text: |-
      1 Subsidie wordt slechts verstrekt indien:

      a. naar het oordeel van de minister mag worden verwacht dat de met de subsidiëring beoogde doeleinden zullen worden
      bereikt;

      b. de aanvrager naar het oordeel van de minister de behoefte aan subsidie heeft aangetoond;

      c. de aanvrager aannemelijk heeft gemaakt dat de financiële middelen met inbegrip van subsidie voldoende zullen
      zijn om de voorgenomen activiteiten uit te voeren.

      2 Het eerste lid, onder b en c, is niet van toepassing op rechtspersonen krachtens publiekrecht ingesteld.
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel4
  - number: '5'
    text: |-
      1 De minister maakt de hoofdlijnen van zijn subsidiebeleid bekend aan de Tweede Kamer der Staten-Generaal.

      2 Bij tussentijdse wijziging van de hoofdlijnen van het subsidiebeleid doet de minister daarvan mededeling aan de
      Tweede Kamer der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel5
  - number: '6'
    text: |-
      Subsidies worden slechts verstrekt voor zover de minister van oordeel is dat de verstrekking past in het bekend
      gemaakte beleid.
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel6
  - number: '7'
    text: |-
      1 De minister kan subsidieplafonds vaststellen voor het verstrekken van instellings- en projectsubsidies.

      2 Ten aanzien van instellingssubsidies geeft de minister bij de verdeling van het beschikbare bedrag die aanvragen
      voorrang waarvan de inwilliging in vergelijking met andere aanvragen naar verwachting van meer belang is voor het
      beleid en meer zal bijdragen aan de verwezenlijking van het doel van de subsidie.

      3 Ten aanzien van projectsubsidies wordt het beschikbare bedrag verdeeld in volgorde
      van ontvangst van de aanvragen, met dien verstande dat wanneer de aanvrager krachtens
      [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad de aanvraag aan te vullen, de dag
      waarop de aangevulde aanvraag is ontvangen, met betrekking tot de verdeling als de datum van ontvangst geldt.

      4 Indien met het oog op de onderlinge afweging van aanvragen overeenkomstig [artikel 13, tweede lid][ref2], is
      bepaald dat op aanvragen wordt beslist na een of meer bepaalde data in een kalenderjaar, geeft de minister bij
      de verdeling van het beschikbare bedrag die aanvragen voorrang waarvan de inwilliging in vergelijking met andere
      aanvragen naar verwachting van meer belang is voor het beleid en meer zal bijdragen aan de verwezenlijking van het
      doel van de subsidie.

      5 De minister kan tegelijk met het vaststellen van het subsidieplafond bepalen dat het ingevolge het
      subsidieplafond beschikbare bedrag op een wijze wordt verdeeld die afwijkt van het tweede, derde of vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0019947#Artikel13
    url: https://wetten.overheid.nl/BWBR0019947/2010-07-09#Artikel7
