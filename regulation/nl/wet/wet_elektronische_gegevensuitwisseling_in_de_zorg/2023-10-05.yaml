preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo, Wij in overweging genomen hebben, dat het goed en tijdig delen en benaderen van gegevens een belangrijke
    randvoorwaarde is voor goede kwaliteit van zorg; dat met het gebruik maken van een elektronische infrastructuur het
    delen en benaderen van gegevens beter en sneller gaat en het daarom wenselijk is dit in de zorg te bevorderen; dat
    het daarbij wenselijk is gegevensuitwisselingen aan te wijzen waarbij gegevens via een elektronische infrastructuur
    tussen zorgverleners worden gedeeld of benaderd en waarbij gegevens met cliënten kunnen worden gedeeld; dat het
    daarnaast wenselijk kan zijn regels te stellen over de wijze waarop via een elektronische infrastructuur wordt
    uitgewisseld; dat het ook wenselijk is eisen te kunnen stellen aan informatietechnologieproducten of -diensten,
    zodat geborgd is dat in de aangewezen gegevensuitwisseling het delen en benaderen van gegevens plaatsvindt
    op interoperabele wijze; dat het daarbij met het oog op de bescherming van de gezondheid van personen en de
    volksgezondheid gerechtvaardigd is het vrij verkeer van goederen en diensten te beperken door middel van de
    introductie van een verplicht systeem van certificering; dat het verder wenselijk is eisen te stellen aan
    informatietechnologieproducten en -diensten en zorginformatiesystemen, zodat de inwisselbaarheid en daarmee de
    marktwerking van deze producten, diensten en systemen wordt verbeterd;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *aangewezen gegevensuitwisseling:*
      gegevensuitwisseling die is aangewezen op grond van [artikel 1.4, eerste lid][ref1];
        - *benaderen:* het indirect verkrijgen van gegevens uit een ander informatiesysteem van een andere zorgaanbieder
      met behulp van software, webpagina’s of via een netwerk verbonden apparaten;
        - *certificaat:* certificaat als bedoeld in [artikel 3.1, onderdeel b][ref2];
        - *certificerende instelling:* instelling als bedoeld in [artikel 3.2, eerste lid][ref3];
        - *cliënt:* cliënt als bedoeld in [artikel 1, eerste lid, van de Wet kwaliteit, klachten en geschillen zorg][ref4];
        - *informatietechnologieproduct of -dienst:* software, hardware of dienst, die door de aanbieder bestemd is te
      worden gebruikt voor het uitwisselen van gegevens bij een aangewezen gegevensuitwisseling;
        - *norm:* 1°. NEN, zijnde een door de Stichting Nederlands Normalisatie-instituut uitgegeven norm; 2°. NEN-EN,
      zijnde een NEN als bedoeld onder 1° die door het Europees Comité voor Normalisatie is vastgesteld; 3°. NEN-EN-ISO,
      zijnde een NEN-EN als bedoeld onder 2° die door de International Organization for Standardization is vastgesteld;
      4°. NEN-EN-IEC, zijnde een NEN-EN als bedoeld onder 2° die door de International Electrotechnical Commission is
      vastgesteld; 5°. NEN-EN-ISO/IEC, zijnde een NEN-EN als bedoeld onder 2° die door de International Organization for
      Standardization en de International Electrotechnical Commission is vastgesteld; of 6°. NEN-ISO, zijnde een NEN als
      bedoeld onder 1° die door de International Organization for Standardization is vastgesteld;
        - *Onze Minister:* Onze Minister voor Medische Zorg;
        - *persoonlijke gezondheidsomgeving:* een app of website waarmee een cliënt onder meer kopieën van gegevens over
      zijn gezondheid kan verzamelen, beheren of delen;
        - *Raad voor Accreditatie:* de Stichting Raad voor Accreditatie, genoemd in
      [artikel 2, eerste lid, van de Wet aanwijzing nationale accreditatie-instantie][ref5];
        - *uitwisselen:* delen of benaderen;
        - *zorg:* zorg als bedoeld in
      [artikel 1, eerste, tweede en derde lid, van de Wet kwaliteit, klachten en geschillen zorg][ref6];
        - *zorgaanbieder:* zorgaanbieder als bedoeld in
      [artikel 1, eerste en achtste lid, van de Wet kwaliteit, klachten en geschillen zorg][ref7];
        - *zorginformatiesysteem:* zorginformatiesysteem als bedoeld in
      [artikel 1, onderdeel m, van de Wet aanvullende bepalingen verwerking persoonsgegevens in de zorg][ref8];
        - *zorgverlener:* zorgverlener als bedoeld in
      [artikel 1, eerste lid, van de Wet kwaliteit, klachten en geschillen zorg][ref9].


