  - number: 1.2.1
    text: |-
      Om goede zorg als bedoeld in [artikel 2 van de Wet kwaliteit, klachten en geschillen zorg][ref1] te kunnen
      verlenen worden onverminderd [artikel 3 van die wet][ref2] bij of krachtens deze wet voorschriften gesteld die
      randvoorwaardelijk zijn voor het verlenen van goede zorg, voor zover het gaat om het uitwisselen van gegevens over
      een cliënt tussen zorgverleners en het delen van gegevens over een cliënt tussen zorgverleners en cliënten.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037173#Artikel3
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0037173
        artikel: '3'
  - number: 1.2.2
    text: |-
      Om de marktwerking van informatietechnologieproducten en -diensten en zorginformatiesystemen te verbeteren, kunnen
      bij of krachtens deze wet voorschriften worden gesteld.
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel1.2
  - number: 1.3.1
    text: |-
      Onze Minister zendt aan de Tweede Kamer der Staten-Generaal een lijst met gegevensuitwisselingen die aangewezen
      kunnen worden op grond van [artikel 1.4, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0048095#Artikel1
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0048095
        artikel: '1'
        paragraaf: '1'
  - number: 1.3.2
    text: 'Bij de lijst wordt voor elke gegevensuitwisseling aangegeven wat naar verwachting:'
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel1.3
  - number: 1.3.2.a
    text: de toegevoegde waarde is voor de zorg van de aanwijzing;
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel1.3
  - number: 1.3.2.b
    text: de realiseerbaarheid is voor de zorg; en
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel1.3
  - number: 1.3.2.c
    text: het draagvlak in de zorg is.
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel1.3
  - number: 1.4.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voor het doel, bedoeld in [artikel 1.2, eerste lid][ref1],
      gegevensuitwisselingen aangewezen waarvoor de verplichtingen bij of krachtens deze wet gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0048095#Artikel1
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel1.4
    references:
      - id: ref1
        bwb_id: BWBR0048095
        artikel: '1'
        paragraaf: '1'
  - number: 1.4.2
    text: |-
      Een gegevensuitwisseling wordt alleen aangewezen als de gegevens op het volledige traject tussen zender en
      ontvanger zijn beveiligd en worden uitgewisseld op grond van:
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel1.4
  - number: 1.4.2.a
    text: |-
      een kwaliteitsstandaard als bedoeld in
      [artikel 1, eerste lid, van de Wet kwaliteit, klachten en geschillen zorg][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel1
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel1.4
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: '1'
  - number: 1.4.2.b
    text: |-
      wet- of regelgeving waarin is opgenomen welke gegevens noodzakelijk zijn voor het verlenen van goede zorg of met
      het oog daarop.
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel1.4
  - number: 1.4.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor het doel, bedoeld in [artikel 1.2, eerste lid][ref1],
      eisen worden gesteld die er toe leiden dat het uitwisselen van gegevens tussen zorgverleners bij een aangewezen
      gegevensuitwisseling plaatsvindt:


      [ref1]: https://wetten.overheid.nl/BWBR0048095#Artikel1
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel1.4
    references:
      - id: ref1
        bwb_id: BWBR0048095
        artikel: '1'
        paragraaf: '1'
  - number: 1.4.3.a
    text: op een functionele, technische of organisatorische wijze; of
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel1.4
  - number: 1.4.3.b
    text: |-
      op interoperabele wijze, volgens de voor die aangewezen gegevensuitwisseling aangewezen norm met dien verstande
      dat de norm alleen aangewezen kan worden als in de norm eisen zijn gesteld aan de te gebruiken koppelvlakken, die
      voldoen aan een door Onze Minister geborgde API-strategie die gebaseerd is op open en waar mogelijk internationale
      standaarden en er voor zorgdragen dat de gegevens die onderdeel uitmaken van de aangewezen gegevensuitwisseling op
      een gestandaardiseerde manier worden ontsloten tussen applicaties.
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel1.4
  - number: 1.4.4
    text: |-
      Als toepassing is gegeven aan het derde lid, onderdeel b, wordt bij algemene maatregel van bestuur bepaald
      voor welk deel van in de norm gestelde eisen informatietechnologieproducten of -diensten voorzien zijn van een
      certificaat.
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel1.4
  - number: 1.4.5
    text: |-
      De eisen mogen er niet toe leiden dat het uitwisselen van gegevens slechts
      kan plaatsvinden via een elektronisch uitwisselingssysteem als bedoeld in
      [artikel 1, onderdeel j, van de Wet aanvullende bepalingen verwerking persoonsgegevens in de zorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023864#Artikel1
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel1.4
    references:
      - id: ref1
        bwb_id: BWBR0023864
        artikel: '1'
  - number: 1.4.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor het doel, bedoeld in [artikel 1.2, eerste lid][ref1],
      eisen worden gesteld die er toe leiden dat bij een aangewezen gegevensuitwisseling door de zorgverlener op een
      veilige en betrouwbare wijze gegevens met een persoonlijke gezondheidsomgeving worden gedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0048095#Artikel1
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel1.4
    references:
      - id: ref1
        bwb_id: BWBR0048095
        artikel: '1'
        paragraaf: '1'
  - number: 1.5.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen eisen worden gesteld aan informatietechnologieproducten of
      -diensten of, voor zover geen informatietechnologieproduct of -dienst, zorginformatiesystemen die er toe leiden
      dat het voor een zorgaanbieder mogelijk is om gebruik te maken van andere, gelijksoortige systemen, producten of
      diensten.
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel1.5
  - number: 1.5.2
    text: De eisen kunnen zien op de realisering van dataportabiliteit.
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel1.5
  - number: 1.6.1
    text: |-
      Deze wet is niet van toepassing op inrichtingen als bedoeld in
      [artikel 1, onderdeel b, van de Penitentiaire beginselenwet][ref1], inrichtingen als bedoeld in
      [artikel 1, onderdeel b, van de Beginselenwet justitiële jeugdinrichtingen ][ref2] en instellingen
      voor de verpleging van ter beschikking gestelden als bedoeld in de [artikelen 3.1, eerste lid][ref3], en
      [3.3, eerste lid, van de Wet forensische zorg][ref4], tenzij bij algemene maatregel van bestuur anders wordt
      bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0011756#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0040634#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0040634#Artikel3
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0011756
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0040634
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0040634
        artikel: '3'
  - number: 1.6.2
    text: |-
      Bij algemene maatregel van bestuur kan, voor zover er sprake is van zorg die wordt verleend door een private
      instelling voor forensische zorg als bedoeld in [artikel 3.2, eerste lid, van de Wet forensische zorg][ref1],
      worden afgeweken van deze wet voor zover dat met het oog op het karakter van de forensische zorg noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0040634#Artikel3
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0040634
        artikel: '3'
  - number: 1.6.3
    text: |-
      Bij algemene maatregel van bestuur kan voor zover er sprake is van militaire gezondheidszorg als bedoeld in
      [artikel 1, eerste lid, onderdeel e, van de Wet ambtenaren defensie][ref1] worden afgeweken van deze wet als dat
      met het oog op operationele omstandigheden voor de inzet of het ter beschikking stellen van de krijgsmacht ter
      uitvoering van de in [artikel 97 van de Grondwet][ref2] omschreven taken noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001840#Artikel97
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0001952
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001840
        artikel: '97'
  - number: '1.7'
    text: |-
      De verplichtingen die bij of krachtens deze wet gelden omvatten in ieder geval niet de verplichting tot het
      uitwisselen van gegevens.
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel1.7
  - number: 2.1.1
    text: |-
      Een zorgaanbieder ziet er op toe dat in een aangewezen gegevensuitwisseling bij het uitwisselen van gegevens door
      onder hem ressorterende zorgverleners ten minste gebruik wordt gemaakt van een elektronische infrastructuur.
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel2.1
  - number: 2.1.2
    text: |-
      De zorgaanbieder ziet er op toe dat als op grond van in [artikel 1.4, derde lid][ref1], eisen zijn
      gesteld, de onder hem ressorterende zorgverlener hieraan voldoet, tenzij het eisen betreffen die zien op
      informatietechnologieproducten of -diensten.


      [ref1]: https://wetten.overheid.nl/BWBR0048095#Artikel1
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0048095
        artikel: '1'
        paragraaf: '1'
  - number: 2.1.3
    text: |-
      De zorgaanbieder ziet er op toe dat als op grond van [artikel 1.4, vierde lid][ref1], is bepaald dat een
      informatietechnologieproduct of -dienst voorzien is van een certificaat, de onder hem ressorterende zorgverlener
      slechts gebruik maakt van een informatietechnologieproduct of -dienst dat of die voorzien is van een certificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0048095#Artikel1
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0048095
        artikel: '1'
        paragraaf: '1'
  - number: 2.1.4
    text: |-
      [Artikel 1, zesde en zevende lid, van de Wet kwaliteit, klachten en geschillen zorg][ref1] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel1
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: '1'
  - number: 2.1.5
    text: 'Zorgverleners die onder een zorgaanbieder ressorteren zijn in ieder geval zorgverleners:'
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel2.1
  - number: 2.1.5.a
    text: die een privaatrechtelijke of publiekrechtelijke dienstbetrekking hebben met de zorgaanbieder;
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel2.1
  - number: 2.1.5.b
    text: |-
      met wie de zorgaanbieder een schriftelijke overeenkomst als bedoeld in
      [artikel 4, eerste lid, onderdeel b, Wet kwaliteit, klachten en geschillen zorg][ref1] heeft gesloten om zorg te
      doen verlenen; en


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel4
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: '4'
  - number: 2.1.5.c
    text: |-
      die ressorteren onder een opdrachtnemer met wie de zorgaanbieder een schriftelijke overeenkomst als bedoeld in
      [artikel 4, eerste lid, onderdeel b, Wet kwaliteit, klachten en geschillen zorg][ref1] heeft afgesloten om zorg te
      doen verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel4
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: '4'
  - number: 2.2.1
    text: |-
      De zorgaanbieder ziet erop toe dat, als bij of krachtens [artikel 1.4, zesde lid][ref1], eisen zijn gesteld, de
      onder hem ressorterende zorgverlener bij het delen van gegevens met een persoonlijke gezondheidsomgeving voldoet
      aan die eisen, tenzij het eisen betreffen die zien op persoonlijke gezondheidsomgevingen.


      [ref1]: https://wetten.overheid.nl/BWBR0048095#Artikel1
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0048095
        artikel: '1'
        paragraaf: '1'
  - number: 2.2.2
    text: |-
      [Artikel 1, zesde en zevende lid, van de Wet kwaliteit, klachten en geschillen zorg][ref1] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel1
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: '1'
  - number: '3.1'
    text: |-
      Een informatietechnologieproduct of -dienst waarvoor op grond van [artikel 1.4, vierde lid][ref1], is bepaald dat
      deze voorzien is van een certificaat:


      [ref1]: https://wetten.overheid.nl/BWBR0048095#Artikel1
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0048095
        artikel: '1'
        paragraaf: '1'
  - number: 3.1.a
    text: |-
      voldoet aan de eisen die hieraan zijn gesteld op grond van [artikel 1.4, derde lid, onderdeel b][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0048095#Artikel1
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0048095
        artikel: '1'
        paragraaf: '1'
  - number: 3.1.b
    text: |-
      is voorzien van een certificaat waaruit blijkt dat het informatietechnologieproduct of de -dienst voldoet aan die
      eisen.
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel3.1
  - number: 3.2.1
    text: Een certificaat wordt op aanvraag verstrekt door een door Onze Minister aangewezen instelling.
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel3.2
  - number: 3.2.2
    text: 'Onze Minister kan:'
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel3.2
  - number: 3.2.2.a
    text: de aanwijzing wijzigen, weigeren, schorsen of intrekken;
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel3.2
  - number: 3.2.2.b
    text: aan de aanwijzing, schorsing of intrekking voorschriften verbinden;
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel3.2
  - number: 3.2.2.c
    text: aan de aanwijzing of de schorsing een termijn verbinden.
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel3.2
  - number: 3.2.3
    text: |-
      Onze Minister wijst een instelling alleen aan als deze beschikt over een accreditatie van de Stichting Raad voor
      Accreditatie waaruit blijkt dat de instelling in staat is te voldoen aan de eisen die:
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel3.2
  - number: 3.2.3.a
    text: |-
      zijn opgenomen in NEN-EN-ISO/IEC 17065:2012 die door de International Organization for Standardization en de
      International Electrotechnical Commission is vastgesteld; en
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel3.2
  - number: 3.2.3.b
    text: |-
      op grond van [artikel 3.3, eerste lid, onderdeel a][ref1], gesteld worden aan het verkrijgen van een aanwijzing.


      [ref1]: https://wetten.overheid.nl/BWBR0048095#Artikel3
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0048095
        artikel: '3'
        paragraaf: '3'
  - number: 3.2.4
    text: |-
      Met accreditatie wordt gelijkgesteld een accreditatie afgegeven door een daartoe bevoegde instelling in een andere
      lidstaat van de Europese Unie dan wel in een staat, niet zijnde een lidstaat van de Europese Unie, die partij is
      bij een daartoe strekkend of mede daartoe strekkend verdrag dat Nederland bindt, op basis van onderzoekingen of
      documenten die een beschermingsniveau bieden dat ten minste gelijkwaardig is aan het beschermingsniveau dat met de
      nationale accreditatie wordt geboden.
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel3.2
  - number: 3.2.5
    text: 'In afwijking van het derde lid kan:'
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel3.2
  - number: 3.2.5.a
    text: |-
      een instelling een voorlopige aanwijzing krijgen voor ten hoogste een jaar als zij een aanvraag voor een
      accreditatie heeft ingediend bij de Raad voor Accreditatie en de Raad de aanvraag heeft bevestigd en als volledig
      heeft beoordeeld; of
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel3.2
  - number: 3.2.5.b
    text: |-
      als de continuïteit van het uitwisselen van gegevens in een aangewezen gegevensuitwisseling dit vereist, bij
      ministeriële regeling tijdelijk worden bepaald dat van een instelling geen accreditatie wordt vereist om aan te
      tonen dat voldaan wordt aan de op grond van [artikel 3.3, eerste lid, onderdeel a][ref1], gestelde criteria.


      [ref1]: https://wetten.overheid.nl/BWBR0048095#Artikel3
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0048095
        artikel: '3'
        paragraaf: '3'
  - number: 3.2.6
    text: |-
      De [Kaderwet zelfstandige bestuursorganen][ref1] is niet van toepassing op een certificerende instelling die op
      grond van het eerste lid is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0020495
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0020495
  - number: 3.2.7
    text: |-
      Als de continuïteit van het uitwisselen van gegevens in een aangewezen gegevensuitwisseling dit vereist,
      kan in afwijking van het eerste lid een certificaat op aanvraag worden verstrekt door Onze Minister. De
      [artikelen 3.3][ref1], [3.5][ref2] en [3.6][ref3] zijn in dat geval van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0048095#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0048095#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0048095#Artikel3
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0048095
        artikel: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0048095
        artikel: '3'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0048095
        artikel: '3'
        paragraaf: '3'
  - number: 3.3.1
    text: 'Bij algemene maatregel van bestuur kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel3.3
  - number: 3.3.1.a
    text: |-
      het indienen van een aanvraag van de instelling voor een aanwijzing als bedoeld in [artikel 3.2, eerste lid][ref1],
      de gegevens die bij een aanvraag moeten worden verstrekt, het verlenen, wijzigen, weigeren, schorsen of intrekken
      van een aanwijzing, de voorschriften die aan een aanwijzing kunnen worden verbonden en de termijn waarvoor een
      aanwijzing kan worden verleend of geschorst;


      [ref1]: https://wetten.overheid.nl/BWBR0048095#Artikel3
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0048095
        artikel: '3'
        paragraaf: '3'
  - number: 3.3.1.b
    text: het verstrekken, weigeren, schorsen of intrekken van een certificaat door een certificerende instelling; of
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel3.3
  - number: 3.3.1.c
    text: |-
      het doen van een mededeling aan Onze Minister van een intrekking of een schorsing van een certificaat of
      accreditatie als bedoeld in [artikel 3.6, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0048095#Artikel3
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0048095
        artikel: '3'
        paragraaf: '3'
  - number: 3.3.2
    text: Bij ministeriele regeling kunnen nadere regels worden gesteld met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel3.3
  - number: 3.4.1
    text: |-
      In het geval Onze Minister de aanvraag behandelt en overige taken uitvoert ten aanzien van certificering kunnen bij
      algemene maatregel van bestuur regels worden gesteld met betrekking tot vergoeding van de kosten voor:
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel3.4
  - number: 3.4.1.a
    text: afgifte van een certificaat; of
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel3.4
  - number: 3.4.1.b
    text: onderzoek of nog steeds wordt voldaan aan de voorwaarden voor de afgifte van een certificaat.
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel3.4
  - number: 3.4.2
    text: Bij ministeriele regeling kunnen nadere regels worden gesteld met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel3.4
  - number: 3.5.1
    text: |-
      Een certificerende instelling verstrekt op aanvraag een certificaat als de aanvrager aantoont dat het
      informatietechnologieproduct of de -dienst voldoet aan de eisen die aan dat informatietechnologieproduct of die
      -dienst zijn gesteld op grond van [artikel 1.4, derde lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0048095#Artikel1
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0048095
        artikel: '1'
        paragraaf: '1'
  - number: 3.5.2
    text: |-
      Van een certificerende instelling waarvan de aanwijzing, bedoeld in [artikel 3.2, eerste lid][ref1], is
      ingetrokken, zijn de afgegeven certificaten twaalf maanden geldig na de datum van intrekking van de aanwijzing.


      [ref1]: https://wetten.overheid.nl/BWBR0048095#Artikel3
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0048095
        artikel: '3'
        paragraaf: '3'
  - number: 3.6.1
    text: |-
      Een certificerende instelling kan een certificaat schorsen of intrekken als het informatietechnologieproduct of de
      -dienst niet langer voldoet aan de eisen die aan dat informatietechnologieproduct of die -dienst gesteld zijn op
      grond van [artikel 1.4, derde lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0048095#Artikel1
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0048095
        artikel: '1'
        paragraaf: '1'
  - number: 3.6.2
    text: Als een certificaat is geschorst of ingetrokken wordt hiervan onverwijld mededeling gedaan aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel3.6
  - number: 3.6.3
    text: |-
      Het gebruik van een informatietechnologieproduct of -dienst waarvan het certificaat is geschorst of ingetrokken kan
      voor de duur van zes maanden worden voortgezet.
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel3.6
  - number: 3.6.4
    text: |-
      Onze Minister kan toestaan dat het gebruik van een informatietechnologieproduct of -dienst waarvan het certificaat
      is geschorst of ingetrokken langer dan zes maanden wordt voortgezet, wanneer dit voor de continuïteit van het
      uitwisselen van gegevens noodzakelijk is. Aan deze verlenging kunnen voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel3.6
  - number: 4.1.1
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de door Onze Minister
      aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel4.1
  - number: 4.1.2
    text: |-
      De in het eerste lid bedoelde ambtenaren zijn bevoegd, met medeneming van de benodigde apparatuur, een woning
      binnen te treden zonder toestemming van de bewoner, voor zover de woning deel uitmaakt van een bouwkundige
      voorziening voor het verlenen van zorg.
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel4.1
  - number: 4.1.3
    text: |-
      De in het eerste lid bedoelde ambtenaren zijn, voor zover dat voor de vervulling van hun taak noodzakelijk is
      bevoegd tot inzage in gegevens, waaronder gegevens over de gezondheid, het maken van kopieën daarvan en als
      dat niet ter plaatse kan geschieden, de gegevens voor dat doel voor korte tijd mee te nemen tegen een door hen
      af te geven schriftelijk bewijs, en het vorderen van inlichtingen ter zake bij de betrokken zorgaanbieder of
      zorgverlener.
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel4.1
  - number: 4.1.4
    text: |-
      Voor zover de desbetreffende zorgaanbieder of zorgverlener uit hoofde van ambt, beroep of
      overeenkomst tot geheimhouding van gegevens verplicht is, kan hij deze verplichting, in afwijking van
      [artikel 5:20, tweede lid, van de Algemene wet bestuursrecht][ref1], niet inroepen tegenover de in het eerste
      lid bedoelde ambtenaren. Op de in het eerste lid bedoelde ambtenaren rust dezelfde geheimhoudingsplicht als op de
      desbetreffende zorgaanbieder of zorgverlener.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 4.2.1
    text: |-
      Als Onze Minister van oordeel is dat het bepaalde in de [artikelen 2.1][ref1] en [2.2][ref2] niet wordt nageleefd,
      kan hij de zorgaanbieder een schriftelijke aanwijzing geven.


      [ref1]: https://wetten.overheid.nl/BWBR0048095#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0048095#Artikel2
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0048095
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0048095
        artikel: '2'
        paragraaf: '2'
  - number: 4.2.2
    text: |-
      In de aanwijzing geeft Onze Minister met redenen omkleed aan op welke punten het bepaalde in de
      [artikelen 2.1][ref1] en [2.2][ref2] niet wordt nageleefd, en de in verband daarmee te nemen maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0048095#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0048095#Artikel2
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0048095
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0048095
        artikel: '2'
        paragraaf: '2'
  - number: 4.2.3
    text: Een aanwijzing bevat de termijn waarbinnen de zorgaanbieder er aan moet voldoen.
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel4.2
  - number: 4.2.4
    text: 'Onze Minister is bevoegd tot toepassing van bestuursdwang ter handhaving van:'
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel4.2
  - number: 4.2.4.a
    text: |-
      het bepaalde in de [artikelen 2.1][ref1] en [2.2][ref2]; of


      [ref1]: https://wetten.overheid.nl/BWBR0048095#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0048095#Artikel2
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0048095
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0048095
        artikel: '2'
        paragraaf: '2'
  - number: 4.2.4.b
    text: de op grond van het eerste lid gegeven aanwijzing.
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel4.2
  - number: 4.2.5
    text: 'Onze Minister is bevoegd een last onder dwangsom op te leggen aan:'
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel4.2
  - number: 4.2.5.a
    text: |-
      de zorgaanbieder die het bepaalde in de [artikelen 2.1][ref1] en [2.2][ref2] niet naleeft; of


      [ref1]: https://wetten.overheid.nl/BWBR0048095#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0048095#Artikel2
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0048095
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0048095
        artikel: '2'
        paragraaf: '2'
  - number: 4.2.5.b
    text: |-
      de zorgaanbieder of de zorgverlener die geen medewerking verleent aan het bepaalde, bedoeld in
      [artikel 4.1, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0048095#Artikel4
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0048095
        artikel: '4'
        paragraaf: '4'
  - number: '4.3'
    text: |-
      Onze Minister kan degene die een informatietechnologieproduct of -dienst aanbiedt aan een zorgaanbieder of een
      informatietechnologieproduct of -dienst ondersteunt die in strijd met [artikel 3.1][ref1] niet voorzien is van een
      certificaat, een bestuurlijke boete opleggen van ten hoogste het bedrag van de geldboete van de zesde categorie
      van [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2] of, als dat meer is, ten hoogste 10% van de
      omzet van de onderneming, onderscheidenlijk, als de overtreding door een ondernemersvereniging is begaan, van de
      gezamenlijke omzet van de ondernemingen die van de vereniging deel uitmaken, in het boekjaar voorafgaande aan de
      beschikking waarin de bestuurlijke boete wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0048095#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0048095
        artikel: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 5.1.1
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over de verwerking van informatie die noodzakelijk
      is voor de uitvoering van de wettelijke taken of beleidsvorming.
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel5.1
  - number: 5.1.2
    text: Bij ministeriele regeling kunnen nadere regels worden gesteld met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel5.1
  - number: '6.1'
    text: |-
      De voordracht voor een algemene maatregel van bestuur op grond van [artikel 1.4][ref1] wordt niet eerder gedaan
      dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd. Als een van de kamers der
      Staten-Generaal besluit niet in te stemmen met het ontwerp, wordt er geen voordracht gedaan en kan niet eerder dan
      zes weken na het besluit van die kamer der Staten-Generaal een nieuw ontwerp aan beide kamers der Staten-Generaal
      worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0048095#Artikel1
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0048095
        artikel: '1'
        paragraaf: '1'
  - number: '6.2'
    text: |-
      Als aan een aangewezen gegevensuitwisseling geen eisen zijn gesteld als bedoeld in
      [artikel 1.4, derde lid, onderdeel b][ref1], zendt Onze Minister jaarlijks aan de Staten-Generaal zijn bevindingen
      over de voortgang om deze eisen te gaan stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0048095#Artikel1
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0048095
        artikel: '1'
        paragraaf: '1'
  - number: '9.1'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel9.1
  - number: '9.2'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel9.2
  - number: '9.3'
    text: 'Deze wet wordt aangehaald als: Wet elektronische gegevensuitwisseling in de zorg.'
    url: https://wetten.overheid.nl/BWBR0048095/2023-10-05#Artikel9.3
