  - number: '7'
    text: |-
      Indien een besluit van de Bestuurskamer niet unaniem is, wordt dat besluit genomen bij meerderheid van stemmen,
      waarbij binnen elk der geledingen de stemverhoudingen gelden zoals die voortvloeien uit de ledentallen in de Raad.
      Bij besluiten als bedoeld in de [artikelen 4][ref1], [5][ref2] en [6][ref3] is het stemrecht voorbehouden aan de
      leden en plaatsvervangers uit het midden van de Raad.


      [ref1]: https://wetten.overheid.nl/BWBR0024271#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0024271#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0024271#Artikel6
