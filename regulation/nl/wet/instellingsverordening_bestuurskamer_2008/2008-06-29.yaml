  - number: '8'
    text: |-
      1 Er is een Toezichtkamer, zijnde een subcommissie van de Bestuurskamer.

      2 De Toezichtkamer bestaat uit drie leden uit het midden van de Raad die tevens deel uitmaken van de onafhankelijke
      geleding van de Bestuurskamer.

      3 De leden van de Toezichtkamer worden door de Bestuurskamer benoemd voor de duur van de zittingsperiode van de
      Raad. Zij kunnen terstond opnieuw worden benoemd.

      4 De Bestuurskamer benoemt één van de in het derde lid genoemde leden tot voorzitter van de Toezichtkamer.

      5 De Toezichtkamer stelt jaarlijks vóór 1 april een verslag op omtrent haar bevindingen bij de uitoefening van haar
      taken en bevoegdheden in het afgelopen kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0024271/2008-06-29#Artikel8
