articles:
  - number: '1'
    text: 'In deze verordening wordt verstaan onder Raad: Sociaal-Economische Raad.'
    url: https://wetten.overheid.nl/BWBR0024271/2008-06-29#Artikel1
  - number: '2'
    text: |-
      1 Er is een Bestuurskamer.

      2 De leden van de Bestuurskamer worden door de Raad uit zijn midden benoemd voor de duur van de zittingsperiode van
      de Raad. Zij kunnen terstond opnieuw worden benoemd.

      3 De Bestuurskamer bestaat uit vijftien leden. De samenstelling vindt zodanig plaats dat deze een afspiegeling
      vormt van de samenstelling van de Raad.

      4 Voor elk lid kan tevens een plaatsvervanger worden benoemd, al dan niet uit het midden van de Raad.

      5 De Raad benoemt de voorzitter van de Bestuurskamer uit de onafhankelijke geleding van de Raad.
    url: https://wetten.overheid.nl/BWBR0024271/2008-06-29#Artikel2
  - number: '3'
    text: |-
      1 De Bestuurskamer wordt belast met de voorbereiding van door de Raad uit te brengen adviezen die de taken van de
      Raad als bestuursorgaan betreffen.

      2 De Bestuurskamer is gemachtigd namens de Raad van advies te dienen over onderwerpen samenhangend met het
      [tweede hoofdstuk van de Wet op de bedrijfsorganisatie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002058#HoofdstukTweede
