---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_toezicht_beleggingsinstellingen_en_administrateurs_bes
regulatory_layer: WET
publication_date: '2011-12-20'
valid_from: '2010-10-10'
bwb_id: BWBR0028553
url: https://wetten.overheid.nl/BWBR0028553/2010-10-10
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel1
  - number: 1.a
    text: |-
      *beleggingsmaatschappij:* een rechtspersoon die gelden of andere goederen ter collectieve belegging vraagt of heeft
      verkregen teneinde de deelnemers in de opbrengst van de beleggingen te doen delen;
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel1
  - number: 1.b
    text: |-
      *beleggingsfonds:* een niet in een rechtspersoon ondergebracht vermogen waarin ter collectieve belegging gevraagde
      of verkregen gelden of andere goederen zijn of worden opgenomen teneinde de deelnemers in de opbrengst van de
      beleggingen te doen delen;
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel1
  - number: 1.c
    text: '*beleggingsinstelling:* beleggingsmaatschappij of beleggingsfonds;'
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel1
  - number: 1.d
    text: '*deelnemer:* de aandeelhouder in een beleggingsmaatschappij dan wel de deelgerechtigde in een beleggingsfonds;'
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel1
  - number: 1.e
    text: |-
      *beheerder:* de beleggingsmaatschappij respectievelijk degene die geheel of ten dele belast is met het beheer van
      het beleggingsfonds;
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel1
  - number: 1.f
    text: '*bewaarder:* degene die belast is met de bewaring van de activa van de beleggingsinstelling;'
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel1
  - number: 1.g
    text: |-
      *administratieve diensten:* het al dan niet tegen vergoeding verlenen van diensten ten behoeve van
      beleggingsinstellingen, waaronder in ieder geval wordt begrepen:
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel1
  - number: 1.g.1
    text: |-
      het voeren van het bestuur van beleggingsinstellingen, waaronder in ieder geval, het beschikbaar stellen van
      natuurlijke personen of rechtspersonen als directeur, vertegenwoordiger of andere leidinggevende functionaris van
      een beleggingsinstelling die onder meer belast zijn met het nemen van beslissingen;
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel1
  - number: 1.g.2
    text: |-
      het administreren, waaronder in ieder geval, het voeren van boekhouding alsmede het verkrijgen, vastleggen,
      verwerken en verstrekken van informatie ten behoeve van het besturen of doen functioneren van een
      beleggingsinstelling;
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel1
  - number: 1.g.3
    text: het verlenen van domicilie en kantoorfaciliteiten ten behoeve van beleggings-instellingen;
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel1
  - number: 1.h
    text: '*administrateur:* een rechtspersoon die het verrichten van administratieve diensten ten doel heeft;'
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel1
  - number: 1.i
    text: '*Autoriteit Financiële Markten:* Stichting Autoriteit Financiële Markten;'
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel1
  - number: 1.j
    text: '*gerecht:* Gerecht in eerste aanleg van Bonaire, Sint Eustatius en Saba;'
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel1
  - number: 1.k
    text: '*Onze Minister:* Onze Minister van Financiën;'
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel1
  - number: 1.l
    text: '*openbaar lichaam:* het openbaar lichaam Bonaire, Sint Eustatius of Saba.'
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel1
  - number: '2'
    text: |-
      De bepalingen van deze wet en de daarop berustende bepalingen ten aanzien van een beleggingsinstelling die een
      beleggingsfonds is, zijn gericht tot de beheerder.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel2
  - number: '3'
    text: |-
      Het is een ieder verboden in of vanuit een openbaar lichaam, gelden of andere goederen ter deelneming in een
      beleggingsinstelling waaraan geen vergunning is verleend door de Autoriteit Financiële Markten, te vragen of te
      verkrijgen dan wel rechten van deelneming in een dergelijke beleggingsinstelling aan te bieden. Het verbod in het
      eerste lid is niet van toepassing op de aanbieding van rechten van deelneming door natuurlijke personen anders dan
      in de uitoefening van hun beroep of bedrijf.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel3
  - number: '4.1'
    text: |-
      De Autoriteit Financiële Markten verleent een beleggingsinstelling op verzoek een vergunning, indien de aanvrager
      aantoont dat de beleggingsinstelling en de bewaarder, indien aan de beleggingsinstelling verbonden, voldoen aan bij
      ministeriële regeling te stellen eisen met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel4
  - number: 4.1.a
    text: deskundigheid en integriteit;
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel4
  - number: 4.1.b
    text: financiële waarborgen;
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel4
  - number: 4.1.c
    text: bedrijfsvoering; en
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel4
  - number: 4.1.d
    text: aan de deelnemers in de beleggingsinstelling en aan het publiek te verstrekken informatie.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel4
  - number: '4.2'
    text: 'Indien een vergunning voor een beleggingsfonds wordt gevraagd, dient de aanvrager bovendien aan te tonen dat:'
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel4
  - number: 4.2.a
    text: de beheerder een rechtspersoon met volledige rechtsbevoegdheid is;
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel4
  - number: 4.2.b
    text: de activa van het beleggingsfonds in bewaring worden gegeven bij een van de beheerder onafhankelijke bewaarder; en
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel4
  - number: 4.2.c
    text: |-
      de activa van het beleggingsfonds worden afgescheiden van het vermogen van de beheerder, van de bewaarder alsmede
      van elke natuurlijke persoon of andere rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel4
  - number: '4.3'
    text: |-
      De Autoriteit Financiële Markten neemt een beslissing omtrent het verzoek tot vergunning binnen 60 dagen na
      ontvangst van de volledige aanvraag en deelt deze bij aangetekende brief mede.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel4
  - number: '4.4'
    text: |-
      De Autoriteit Financiële Markten kan aan een aanvrager een vergunning verlenen indien de aanvrager aantoont dat
      redelijkerwijs niet volledig kan worden voldaan aan eisen gesteld bij of krachtens het eerste en tweede lid, en hij
      tevens aantoont dat de doeleinden die deze wet beoogt te bereiken anderszins voldoende bereikt zijn.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel4
  - number: '5'
    text: |-
      Aan een vergunning kunnen te allen tijde beperkingen worden gesteld en voorschriften worden verbonden met het oog
      op een adequate werking van de financiële markten en de positie van de beleggers op die markten, indien feiten en
      omstandigheden die betrekking hebben op degene voor wie de vergunning geldt dit vereisen.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel5
  - number: '6'
    text: |-
      Als bewaarder mag slechts optreden een rechtspersoon die in belangrijke mate zijn bedrijf maakt van het bewaren en
      administreren van beleggingsobjecten ten behoeve van derden.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel6
  - number: '7'
    text: |-
      Indien de Autoriteit Financiële Markten van oordeel is dat van de in een openbaar lichaam gevoerde of te voeren
      naam van de beleggingsinstelling gevaar voor verwarring is te duchten, verlangt zij van de beleggingsinstelling een
      verklarende vermelding aan de naam toe te voegen.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel7
  - number: '8.1'
    text: |-
      Iedere beleggingsinstelling is verplicht jaarlijks binnen een bij ministeriële regeling te bepalen termijn
      een jaarrekening, ten minste bevattend een balans en een verlies- en winstrekening, met bijbehorende
      toelichting over het afgelopen boekjaar in een bij ministeriële regeling vast te stellen vorm bij de Autoriteit
      Financiële Markten in te dienen. Hierbij dient ook een verklaring van de externe deskundige als bedoeld in
      [artikel 121 van Boek 2 van het Burgerlijk Wetboek BES][ref1] en de directiebrieven te zijn gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel121
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '121'
  - number: '8.2'
    text: |-
      Iedere beleggingsinstelling is verplicht bij de Autoriteit Financiële Markten periodiek binnen de daartoe
      vastgestelde termijnen rapportagestaten nopens haar bedrijf in te dienen.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel8
  - number: '8.3'
    text: |-
      De vorm waarin de in het tweede lid bedoelde staten worden opgemaakt, de achtereenvolgende tijdstippen waarop
      zij betrekking hebben, en de termijnen binnen welke zij moeten worden ingediend, worden bij ministeriële regeling
      bepaald.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel8
  - number: '8.4'
    text: |-
      Indien de Autoriteit Financiële Markten zulks in het belang van een doelmatig toezicht nodig acht, kan zij een
      beleggingsinstelling opdragen:
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel8
  - number: 8.4.a)
    text: |-
      staten als bedoeld in het tweede lid, bij haar in te dienen die betrekking hebben op tijdstippen met een kortere
      tussenpoos of op kortere termijnen dan ingevolge het tweede lid is bepaald;
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel8
  - number: 8.4.b)
    text: |-
      een verklaring van een externe deskundige als bedoeld in
      [artikel 121 van Boek 2 van het Burgerlijk Wetboek BES][ref1] over te leggen nopens de in het tweede lid bedoelde
      staten.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel121
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '121'
  - number: '8.5'
    text: |-
      Het is de beleggingsinstelling waaraan een vergunning is verleend, verboden haar statuten of reglementen te
      wijzigen zonder voorafgaande toestemming van de Autoriteit Financiële Markten.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel8
  - number: '8.6'
    text: |-
      Een wijziging van de statuten of reglementen, in strijd met het verbod bedoeld in het vijfde lid, is nietig. Op
      verzoek van de Autoriteit Financiële Markten benoemt het gerecht een bewindvoerder met de macht om de gevolgen van
      de nietige handeling ongedaan te maken.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel8
  - number: '8.7'
    text: |-
      Bij het ongedaan maken van de nietige handeling dient de bewindvoerder mede te handelen in het belang van de
      deelnemers in de beleggingsinstelling.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel8
  - number: '9.1'
    text: |-
      Een beleggingsinstelling waaraan een vergunning is verleend, en de bewaarder, indien aan de instelling verbonden,
      zijn verplicht zich te houden aan bij ministeriële regeling te stellen voorschriften met betrekking tot
      deskundigheid, integriteit, financiële waarborgen, bedrijfsvoering en informatieverschaffing.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel9
  - number: '9.2'
    text: |-
      Het is de beleggingsinstelling verboden zonder voorafgaande toestemming van de Autoriteit Financiële Markten
      personen die het dagelijks beleid van de beleggingsinstelling bepalen en, indien aanwezig, de leden van de Raad van
      Commissarissen te benoemen.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel9
  - number: '9.3'
    text: |-
      De Autoriteit Financiële Markten kan op verzoek van de beleggingsinstelling bepalen, dat zij of de bewaarder,
      indien aan de instelling verbonden, niet behoeft te voldoen aan alle in het eerste lid bedoelde regels indien
      zij aantoont dat daaraan redelijkerwijs niet volledig kan worden voldaan en dat de doeleinden die deze wet beoogt
      te bereiken anderszins voldoende bereikt zijn. De Autoriteit Financiële Markten kan een beschikking als hiervoor
      bedoeld wijzigen of intrekken indien naar zijn oordeel de omstandigheden waaronder de beschikking is gegeven
      zodanig zijn gewijzigd dat de doeleinden die deze wet beoogt te bereiken niet langer worden bereikt.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel9
  - number: '9.4'
    text: |-
      De externe deskundige als bedoeld in [artikel 121 van Boek 2 van het Burgerlijk Wetboek BES][ref1], die op
      grond van de regels, bedoeld in het eerste lid, de jaarrekening van een beleggingsinstelling van een verklaring
      moet voorzien, meldt de Autoriteit Financiële Markten zo spoedig mogelijk elke omstandigheid waarvan hij bij de
      uitvoering van zijn desbetreffende werkzaamheden kennis heeft gekregen en die:


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel121
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '121'
  - number: 9.4.a)
    text: in strijd is met de eisen die voor het verkrijgen van de vergunning zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel9
  - number: 9.4.b)
    text: in strijd is met de bij of krachtens deze wet opgelegde verplichtingen;
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel9
  - number: 9.4.c)
    text: het voortbestaan van de beleggingsinstelling bedreigt; of
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel9
  - number: 9.4.d)
    text: de afgifte van een goedkeurende verklaring omtrent de getrouwheid in gevaar zou kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel9
  - number: '9.4'
    text: |-
      De externe deskundige als bedoeld in [artikel 121 van Boek 2 van het Burgerlijk Wetboek BES][ref1] bedoeld
      in het vierde lid zendt onverwijld aan de Autoriteit Financiële Markten een afschrift van het verslag als
      bedoeld in artikel 121, vijfde lid, van Boek 2 van het Burgerlijk Wetboek BES, van de directiebrieven en van
      de correspondentie die rechtstreeks betrekking heeft op de verklaring als bedoeld in artikel 121 van Boek 2 van
      het Burgerlijk Wetboek BES bij de jaarrekening respectievelijk van enige periodiek bij de Autoriteit Financiële
      Markten in te dienen staten, indien en voor zover de Autoriteit Financiële Markten bij deze staten een verklaring
      als bedoeld in artikel 121 van Boek 2 van het Burgerlijk Wetboek BES nodig acht. Indien de Autoriteit Financiële
      Markten zulks noodzakelijk acht geeft de externe deskundige als bedoeld in artikel 121 van Boek 2 van het
      Burgerlijk Wetboek BES de Autoriteit Financiële Markten een mondelinge toelichting op de jaarrekening en deze
      stukken.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel121
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '121'
  - number: '9.6'
    text: |-
      Op de externe deskundige als bedoeld in [artikel 121 van Boek 2 van het Burgerlijk Wetboek BES][ref1], bedoeld
      in het vierde lid, die naast zijn werkzaamheden voor de beleggingsinstelling ook werkzaamheden uitvoert voor een
      andere onderneming of instelling, is de meldingsplicht, bedoeld in het vierde lid, van overeenkomstige toepassing
      indien de beleggingsinstelling dochtermaatschappij is van die andere onderneming of instelling, dan wel indien die
      andere onderneming of instelling dochtermaatschappij is van de beleggingsinstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel121
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '121'
  - number: '9.7'
    text: |-
      De externe deskundige als bedoeld in [artikel 121 van Boek 2 van het Burgerlijk Wetboek BES][ref1] die op grond van
      het vierde of zesde lid tot een melding aan de Autoriteit Financiële Markten is overgegaan, is niet aansprakelijk
      voor schade die een derde dientengevolge lijdt, tenzij aannemelijk wordt gemaakt dat, gelet op alle feiten en
      omstandigheden, in redelijkheid niet tot melding had mogen worden overgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel121
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '121'
  - number: '10.1'
    text: |-
      De Autoriteit Financiële Markten kan ontheffing verlenen van het in [artikel 3][ref1] vervatte verbod.


      [ref1]: https://wetten.overheid.nl/BWBR0028553#Artikel3
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0028553
        artikel: '3'
        hoofdstuk: III
        paragraaf: '1'
  - number: '10.2'
    text: |-
      Aan een ontheffing als bedoeld in het eerste lid kunnen beperkingen worden gesteld en voorschriften worden
      verbonden met het oog op een adequate werking van de financiële markten en de positie van de beleggers op die
      markten. De beperkingen kunnen uitsluitend worden gesteld ten aanzien van de reikwijdte van de ontheffing.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel10
  - number: 10a.1
    text: |-
      Onze Minister kan ten aanzien van beleggingsinstellingen, gevestigd in een ander deel van het Koninkrijk of een
      andere Staat, vrijstelling verlenen van de bij of krachtens dit hoofdstuk gestelde regels, indien de belangen die
      deze wet beoogt te beschermen, in voldoende mate gewaarborgd worden door het toezicht dat in dat andere deel van
      het Koninkrijk, onderscheidenlijk die andere Staat, ten aanzien van beleggingsinstellingen wordt uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel10a
  - number: 10a.2
    text: Aan de vrijstelling kunnen voorschriften worden verbonden en beperkingen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel10a
  - number: '11'
    text: 'De Autoriteit Financiële Markten kan een vergunning slechts intrekken:'
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel11
  - number: 11.a)
    text: op verzoek van de houder;
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel11
  - number: 11.b)
    text: |-
      indien de gegevens of bescheiden die zijn verstrekt ter verkrijging van de vergunning zodanig onjuist of onvolledig
      blijken dat op het verzoek een andere beslissing zou zijn genomen als bij de beoordeling van het verzoek de juiste
      omstandigheden volledig bekend waren geweest;
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel11
  - number: 11.c)
    text: |-
      indien zich omstandigheden voordoen of feiten bekend worden op grond waarvan zo zij voor het tijdstip waarop de
      vergunning werd verleend zich hadden voorgedaan, of bekend waren geweest, de vergunning zou zijn geweigerd;
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel11
  - number: 11.d)
    text: |-
      indien de vergunninghouder of de aan de beleggingsinstelling verbonden bewaarder kennelijk de in [artikel 3][ref1]
      bedoelde werkzaamheden niet meer uitvoert;


      [ref1]: https://wetten.overheid.nl/BWBR0028553#Artikel3
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028553
        artikel: '3'
        hoofdstuk: III
        paragraaf: '1'
  - number: 11.e)
    text: |-
      indien de beleggingsinstelling of de daaraan verbonden bewaarder niet meer voldoet aan de bij of krachtens deze wet
      gestelde eisen, regels, beperkingen of gegeven voorschriften of andere wettelijke verplichtingen;
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel11
  - number: 11.f)
    text: |-
      indien de beleggingsinstelling of de daaraan verbonden bewaarder niet of niet genoegzaam uitvoering heeft gegeven
      aan een aanwijzing of een aanzegging van de Autoriteit Financiële Markten als bedoeld in [artikel 33][ref1]
      respectievelijk [artikel 34][ref2] of


      [ref1]: https://wetten.overheid.nl/BWBR0028553#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0028553#Artikel34
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028553
        artikel: '33'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0028553
        artikel: '34'
        hoofdstuk: VIII
  - number: 11.g)
    text: |-
      indien de beleggingsinstelling niet binnen een door de Autoriteit Financiële Markten vast te stellen termijn met
      haar bedrijf daadwerkelijk een aanvang heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel11
  - number: '12.1'
    text: |-
      Een beleggingsmaatschappij waarvan de vergunning is ingetrokken wordt op verzoek van de Autoriteit Financiële
      Markten door het gerecht ontbonden. Het gerecht wijst één of meer vereffenaars aan.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel12
  - number: '12.2'
    text: |-
      Het vermogen van een beleggingsfonds waarvan de vergunning is ingetrokken moet worden vereffend binnen een door de
      Autoriteit Financiële Markten te bepalen termijn. Het gerecht wijst op verzoek van de Autoriteit Financiële Markten
      één of meer vereffenaars aan.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel12
  - number: '12.3'
    text: |-
      De Autoriteit Financiële Markten kan ten aanzien van het beleggingsfonds waaraan op grond van [artikel 4][ref1]
      een vergunning is verleend ontheffing verlenen van het bepaalde in het tweede lid, indien de werkzaamheden van
      het fonds worden voortgezet in een besloten kring. Aan een ontheffing kunnen in het belang van de deelnemers
      beperkingen worden gesteld en voorschriften worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0028553#Artikel4
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028553
        artikel: '4'
        hoofdstuk: III
        paragraaf: '2'
  - number: '12.4'
    text: |-
      De Autoriteit Financiële Markten brengt onverwijld verslag uit aan Onze Minister omtrent een beleggingsinstelling
      van welke de vergunning is ingetrokken.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel12
  - number: '13'
    text: |-
      Indien een beleggingsinstelling de inkoop van haar rechten van deelneming opschort, stelt zij de Autoriteit
      Financiële Markten onverwijld daarvan op de hoogte.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel13
  - number: '14'
    text: |-
      Het is een ieder verboden in of vanuit een openbaar lichaam het bedrijf van administrateur uit te oefenen zonder
      voorafgaande vergunning van de Autoriteit Financiële Markten.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel14
  - number: '15.1'
    text: |-
      De Autoriteit Financiële Markten verleent een administrateur op verzoek een vergunning, indien de aanvrager
      aantoont te voldoen aan bij ministeriële regeling te stellen eisen met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel15
  - number: 15.1.a)
    text: deskundigheid en integriteit; en
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel15
  - number: 15.1.b)
    text: bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel15
  - number: '15.2'
    text: |-
      De Autoriteit Financiële Markten verleent vergunning bij aangetekende brief binnen 60 dagen na ontvangst van een
      volledige aanvraag.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel15
  - number: '15.3'
    text: |-
      De Autoriteit Financiële Markten kan een aanvrager een vergunning verlenen indien de aanvrager aantoont dat
      redelijkerwijs niet volledig kan worden voldaan aan eisen gesteld bij of krachtens het eerste lid, en hij tevens
      aantoont dat de doeleinden die deze wet beoogt te bereiken anderszins voldoende bereikt zijn.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel15
  - number: '16'
    text: |-
      Aan de vergunning kunnen te allen tijde beperkingen worden gesteld en voorschriften worden verbonden met het oog
      op een adequate werking van de financiële markten en de positie van de beleggers op die markten, indien feiten en
      omstandigheden die betrekking hebben op degene voor wie de vergunning geldt dit vereist.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel16
  - number: '17.1'
    text: |-
      Iedere administrateur is verplicht jaarlijks binnen een bij ministeriële regeling te bepalen termijn een
      jaarrekening, ten minste bevattende een balans en een verlies- en winstrekening, met bijbehorende toelichting
      over het afgelopen boekjaar in een bij ministeriële regeling vast te stellen vorm bij de Autoriteit
      Financiële Markten in te dienen. Hierbij dient ook een verklaring van de externe deskundige als bedoeld in
      [artikel 121 van Boek 2 van het Burgerlijk Wetboek BES][ref1] en de directiebrieven te zijn gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel121
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '121'
  - number: '17.2'
    text: |-
      Iedere administrateur is verplicht bij de Autoriteit Financiële Markten periodiek binnen de daartoe vastgestelde
      termijnen een schriftelijk compliance rapport nopens haar bedrijf in te dienen.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel17
  - number: '17.3'
    text: |-
      De vorm waarin het in het tweede lid bedoelde rapport wordt opgemaakt, de achtereenvolgende tijdstippen waarop het
      betrekking heeft, en de termijnen binnen welke het moet worden ingediend, worden bij ministeriële regeling bepaald.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel17
  - number: '17.4'
    text: |-
      Indien de Autoriteit Financiële Markten zulks in het belang van een doelmatig toezicht nodig acht, kan zij
      een administrateur opdragen het schriftelijke rapport als bedoeld in het tweede lid, bij haar in te dienen op
      tijdstippen met een kortere tussenpoos of op kortere termijnen dan ingevolge het tweede lid is bepaald.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel17
  - number: '17.5'
    text: |-
      Het is een administrateur waaraan een vergunning is verleend, verboden zijn statuten of reglementen te wijzigen
      zonder voorafgaande toestemming van de Autoriteit Financiële Markten.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel17
  - number: '17.6'
    text: |-
      Een wijziging van de statuten of reglementen, als bedoeld in het vijfde lid, is nietig. Op verzoek van de
      Autoriteit Financiële Markten benoemt het gerecht een bewindvoerder met de macht om de gevolgen van de nietige
      handeling ongedaan te maken.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel17
  - number: '17.7'
    text: |-
      Bij het ongedaan maken van de nietige handeling dient de bewindvoerder mede te handelen in het belang van de
      belanghebbenden.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel17
  - number: '18.1'
    text: |-
      Een administrateur waaraan een vergunning is verleend, is verplicht zich te blijven houden aan bij ministeriële
      regeling te stellen voorschriften met betrekking tot deskundigheid, integriteit en bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel18
  - number: '18.2'
    text: |-
      Het is de administrateur verboden zonder voorafgaande toestemming van de Autoriteit Financiële Markten personen
      die het dagelijks beleid van de administrateur bepalen en indien aanwezig de leden van de Raad van Commissarissen
      te benoemen.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel18
  - number: '18.3'
    text: |-
      De Autoriteit Financiële Markten kan op verzoek van de administrateur bepalen, dat de administrateur niet behoeft
      te voldoen aan alle in het eerste lid bedoelde regels indien hij aantoont dat daaraan redelijkerwijs niet volledig
      kan worden voldaan en dat de doeleinden die deze wet beoogt te bereiken anderszins voldoende bereikt zijn. De
      Autoriteit Financiële Markten kan een beschikking als hiervoor bedoeld wijzigen of intrekken indien naar zijn
      oordeel de omstandigheden waaronder de beschikking is gegeven zodanig zijn gewijzigd dat de doeleinden die deze wet
      beoogt te bereiken niet langer worden bereikt.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel18
  - number: '18.4'
    text: |-
      De externe deskundige als bedoeld in [artikel 121 van Boek 2 van het Burgerlijk Wetboek BES][ref1], die op grond
      van de regels, bedoeld in het eerste lid, de jaarrekening van een administrateur van een verklaring moet voorzien,
      meldt de Autoriteit Financiële Markten zo spoedig mogelijk elke omstandigheid waarvan hij bij de uitvoering van
      zijn desbetreffende werkzaamheden kennis heeft gekregen en die:


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel121
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '121'
  - number: 18.4.a)
    text: in strijd is met de eisen die voor het verkrijgen van de vergunning zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel18
  - number: 18.4.b)
    text: in strijd is met de bij of krachtens deze wet opgelegde verplichtingen;
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel18
  - number: 18.4.c)
    text: het voortbestaan van de administrateur bedreigt; of
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel18
  - number: 18.4.d)
    text: de afgifte van een goedkeurende verklaring omtrent de getrouwheid in gevaar zou kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel18
  - number: '18.5'
    text: |-
      De externe deskundige als bedoeld in [artikel 121 van Boek 2 van het Burgerlijk Wetboek BES][ref1] bedoeld
      in het vierde lid zendt onverwijld aan de Autoriteit Financiële Markten een afschrift van het verslag als
      bedoeld in artikel 121, vijfde lid, van Boek 2 van het Burgerlijk Wetboek BES, van de directiebrieven en van
      de correspondentie die rechtstreeks betrekking heeft op de verklaring als bedoeld in artikel 121 van Boek 2 van
      het Burgerlijk Wetboek BES bij de jaarrekening respectievelijk van enige periodiek bij de Autoriteit Financiële
      Markten in te dienen staten, indien en voor zover de Autoriteit Financiële Markten bij deze staten een verklaring
      als bedoeld in artikel 121 van Boek 2 van het Burgerlijk Wetboek BES nodig acht. Indien de Autoriteit Financiële
      Markten zulks noodzakelijk acht geeft de externe deskundige als bedoeld in artikel 121 van Boek 2 van het
      Burgerlijk Wetboek BES de Autoriteit Financiële Markten een mondelinge toelichting op de jaarrekening en deze
      stukken.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel121
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '121'
  - number: '18.6'
    text: |-
      Op de externe deskundige als bedoeld in [artikel 121 van Boek 2 van het Burgerlijk Wetboek BES][ref1], bedoeld
      in het vierde lid, die naast zijn werkzaamheden voor de administrateur ook werkzaamheden uitvoert voor een
      andere onderneming of instelling, is de meldingsplicht, bedoeld in het vierde lid, van overeenkomstige toepassing
      indien de administrateur dochtermaatschappij is van de andere onderneming of instelling, dan wel indien de andere
      onderneming of instelling dochtermaatschappij is van de administrateur.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel121
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '121'
  - number: '18.7'
    text: |-
      De externe deskundige als bedoeld in [artikel 121 van Boek 2 van het Burgerlijk Wetboek BES][ref1] die op grond
      van het vierde of zesde tot een melding aan de Autoriteit Financiële Markten is overgegaan, is niet aansprakelijk
      voor schade die een derde dientengevolge lijdt, tenzij aannemelijk wordt gemaakt dat, gelet op alle feiten en
      omstandigheden, in redelijkheid niet tot melding had mogen worden overgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel121
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '121'
  - number: '19'
    text: |-
      Een administrateur dient te allen tijde te bewaken dat binnen de beleggingsinstellingen waarvoor hij
      administratieve diensten verricht, voldoende deskundigheid aanwezig is en dat de bestuurders die de
      beleggingsinstellingen vertegenwoordigen of het beleid van de beleggingsinstellingen bepalen, alsmede anderen
      die het beleid mede bepalen, integer zijn conform de krachtens [artikel 18][ref1] gestelde voorschriften. De
      administrateur dient tevens er voor zorg te dragen dat in redelijkheid de beleggingsinstellingen waarvoor zij
      administratieve diensten verrichten niet in overtreding zijn van de op hen rustende wettelijke verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028553#Artikel18
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0028553
        artikel: '18'
        hoofdstuk: IV
        paragraaf: '3'
  - number: '20'
    text: |-
      Een administrateur stelt de Autoriteit Financiële Markten onmiddellijk op de hoogte indien zij van oordeel is of
      reden heeft om aan te nemen dat een beleggingsinstelling waarvoor hij administratieve diensten verricht:
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel20
  - number: 20.a)
    text: niet in staat is of zal zijn aan haar verplichtingen te voldoen;
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel20
  - number: 20.b)
    text: |-
      voorschriften krachtens deze wet of andere wet- en regelgevingen die van toepassing zijn op de
      beleggingsinstellingen niet naleeft; of
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel20
  - number: 20.c)
    text: |-
      haar bedrijf uitoefent op een manier dat schade toebrengt of kan toebrengen aan de belangen van haar deelnemers of
      andere deelgerechtigden.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel20
  - number: '21.1'
    text: |-
      De Autoriteit Financiële Markten kan ontheffing verlenen van het in [artikel 14][ref1] vervatte verbod.


      [ref1]: https://wetten.overheid.nl/BWBR0028553#Artikel14
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0028553
        artikel: '14'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '21.2'
    text: |-
      Aan een ontheffing als bedoeld in het eerste lid kunnen beperkingen worden gesteld en voorschriften worden
      verbonden met het oog op een adequate werking van de financiële markten en de positie van de beleggers op die
      markten. De beperkingen kunnen uitsluitend worden gesteld ten aanzien van de reikwijdte van de ontheffing.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel21
  - number: 21a.1
    text: |-
      Onze Minister kan administrateurs, gevestigd in een ander deel van het Koninkrijk of een andere Staat, vrijstelling
      verlenen van de bij of krachtens dit hoofdstuk gestelde regels, indien de belangen die deze wet beoogt te
      beschermen, in voldoende mate gewaarborgd worden door het toezicht dat in dat andere deel van het Koninkrijk,
      onderscheidenlijk die andere Staat, op die administrateurs wordt uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel21a
  - number: 21a.2
    text: Aan de vrijstelling kunnen voorschriften worden verbonden en beperkingen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel21a
  - number: '22.1'
    text: 'De Autoriteit Financiële Markten kan een vergunning slechts intrekken:'
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel22
  - number: 22.1.a)
    text: op verzoek van de houder;
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel22
  - number: 22.1.b)
    text: |-
      indien de gegevens of bescheiden die zijn verstrekt ter verkrijging van de vergunning zodanig onjuist of onvolledig
      blijken dat op het verzoek een andere beslissing zou zijn genomen als bij de beoordeling van het verzoek de juiste
      omstandigheden volledig bekend waren geweest;
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel22
  - number: 22.1.c)
    text: |-
      indien zich omstandigheden voordoen of feiten bekend worden op grond waarvan zo zij voor het tijdstip waarop de
      vergunning werd verleend zich hadden voorgedaan, of bekend waren geweest, de vergunning zou zijn geweigerd;
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel22
  - number: 22.1.d)
    text: |-
      indien de administrateur kennelijk niet meer voldoet aan de in [artikel 1 onder h][ref1] gegeven definitie;


      [ref1]: https://wetten.overheid.nl/BWBR0028553#Artikel1
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0028553
        artikel: '1'
        hoofdstuk: I
  - number: 22.1.e)
    text: |-
      indien de administrateur niet meer voldoet aan de bij of krachtens deze wet gestelde eisen, regels, beperkingen of
      gegeven voorschriften of andere wettelijke verplichtingen;
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel22
  - number: 22.1.f)
    text: |-
      indien de administrateur niet of niet genoegzaam uitvoering heeft gegeven aan een aanwijzing of een aanzegging van
      de Autoriteit Financiële Markten als bedoeld in [artikel 33][ref1] respectievelijk [artikel 34][ref2]; of


      [ref1]: https://wetten.overheid.nl/BWBR0028553#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0028553#Artikel34
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0028553
        artikel: '33'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0028553
        artikel: '34'
        hoofdstuk: VIII
  - number: 22.1.g)
    text: |-
      indien de administrateur niet binnen een door de Autoriteit Financiële Markten vast te stellen termijn met zijn
      bedrijf daadwerkelijk een aanvang heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel22
  - number: '22.2'
    text: De intrekking wordt door de Autoriteit Financiële Markten bij deurwaardersexploot aan de betrokkene betekend.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel22
  - number: '23.1'
    text: |-
      Een administrateur waarvan de vergunning is ingetrokken wordt op verzoek van de Autoriteit Financiële Markten door
      het gerecht ontbonden. Het gerecht wijst één of meer vereffenaars aan.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel23
  - number: '23.2'
    text: |-
      De Autoriteit Financiële Markten brengt desgevraagd verslag uit aan Onze Minister omtrent een administrateur van
      welke de vergunning is ingetrokken.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel23
  - number: '24.1'
    text: |-
      De Autoriteit Financiële Markten houdt een register voor beleggingsinstellingen en administrateurs, waarvan de
      inrichting in twee hoofdafdelingen als volgt is vastgesteld: - Afdeling I – Beleggingsinstellingen
        - Afdeling II – Administrateurs De Autoriteit Financiële Markten kan de hoofdafdelingen onderverdelen in
      onderafdelingen voor de door de Autoriteit Financiële Markten te onderscheiden categorieën beleggingsinstellingen
      en administrateurs. Een beleggingsinstelling of administrateur waarvan krachtens [artikel 3][ref1], respectievelijk
      [artikel 14][ref2] een vergunning is verleend, wordt door de Autoriteit Financiële Markten per gelijke datum als
      waarop de vergunning is verleend, door de Autoriteit Financiële Markten ingeschreven in het register. Inschrijving
      in meer dan in hoofdafdeling onderscheidenlijk onderafdeling vindt niet plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0028553#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028553#Artikel14
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0028553
        artikel: '3'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028553
        artikel: '14'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '24.2'
    text: |-
      De inschrijving van een beleggingsinstelling of administrateur waarvan de vergunning is ingetrokken wordt
      doorgehaald.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel24
  - number: '24.3'
    text: |-
      De inschrijving van een beleggingsinstelling of administrateur alsmede de doorhaling worden binnen twee weken na de
      dag, waarop zij heeft plaatsgehad, medegedeeld in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel24
  - number: '24.4'
    text: |-
      De Autoriteit Financiële Markten kan bepalen dat de in het derde lid bedoelde mededeling van een doorhaling tot een
      nader door haar te bepalen tijdstip wordt aangehouden indien openbaarmaking ernstige schade aan de belangen van de
      deelnemers of belanghebbenden zou kunnen toebrengen.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel24
  - number: '24.5'
    text: |-
      In de maand januari van elk jaar wordt een lijst van de ingeschreven beleggingsinstellingen en administrateurs naar
      de stand per 31 december van het voorafgaande jaar in de Staatscourant geplaatst.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel24
  - number: '24.6'
    text: De Autoriteit Financiële Markten houdt een afschrift van het register voor een ieder kosteloos ter inzage.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel24
  - number: '25.1'
    text: |-
      Het is aan een ieder die uit hoofde van de toepassing van deze wet of krachtens deze wet genomen besluiten enige
      taak vervult, verboden van gegevens of inlichtingen, ingevolge deze wet verstrekt of van een instantie als bedoeld
      in [artikel 28][ref1], ontvangen, of van gegevens of inlichtingen, bij het onderzoek van boeken, bescheiden of
      andere informatiedragers, verkregen, verder of anders gebruik te maken of daaraan verder of anders bekendheid te
      geven dan voor de uitoefening van zijn taak of door deze wet wordt geëist.


      [ref1]: https://wetten.overheid.nl/BWBR0028553#Artikel28
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0028553
        artikel: '28'
        hoofdstuk: VI
  - number: '25.2'
    text: |-
      In afwijking van het bepaalde in het eerste lid is de Autoriteit Financiële Markten bevoegd ter handhaving van een
      gezonde financiële sector aangifte te doen van een vermoeden van een strafbaar feit. In de gevallen waarin door de
      Autoriteit Financiële Markten aangifte is gedaan, dan wel in de gevallen waarin de Autoriteit Financiële Markten
      wordt geroepen om als getuige of deskundige op te treden, is de Autoriteit Financiële Markten bevoegd in het kader
      van de opsporing, het gerechtelijk vooronderzoek of de behandeling ter terechtzitting, inlichtingen te verschaffen.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel25
  - number: '26'
    text: |-
      Met het oog op een adequate werking van de financiële markten en de positie van de beleggers op die markten, kan de
      Autoriteit Financiële Markten, voor zover nodig in afwijking van [artikel 25][ref1], ter openbare kennis brengen:


      [ref1]: https://wetten.overheid.nl/BWBR0028553#Artikel25
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0028553
        artikel: '25'
        hoofdstuk: VI
  - number: 26.a
    text: |-
      zijn weigering om een aangevraagde vergunning te verlenen wanneer deze weigering niet meer in beroep kan worden
      getroffen; of
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel26
  - number: 26.b
    text: |-
      het feit dat een beleggingsinstelling of administrateur die naar haar oordeel onder het verbod van
      [artikel 3][ref1], respectievelijk [artikel 14][ref2] valt, niet over een vergunning beschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0028553#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028553#Artikel14
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0028553
        artikel: '3'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028553
        artikel: '14'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '27'
    text: |-
      De Autoriteit Financiële Markten kan, in afwijking van [artikel 25][ref1], periodiek met gebruikmaking van gegevens
      of inlichtingen verkregen bij de vervulling van de haar ingevolge deze wet opgedragen taak mededeling doen van
      de voornaamste gegevens, mits deze niet worden herleid tot afzonderlijke beleggingsinstellingen of afzonderlijke
      administrateurs. Met schriftelijke toestemming van de beleggingsinstelling of de administrateur die het aangaat,
      worden gegevens met betrekking tot afzonderlijke beleggingsinstellingen of administrateurs wel gepubliceerd.


      [ref1]: https://wetten.overheid.nl/BWBR0028553#Artikel25
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0028553
        artikel: '25'
        hoofdstuk: VI
  - number: '28'
    text: |-
      De Autoriteit Financiële Markten is, in afwijking van [artikel 25][ref1], bevoegd om gegevens of inlichtingen
      verkregen bij de vervulling van de haar ingevolge deze wet opgedragen taak, te verstrekken aan het bevoegd gezag
      dat in de openbare lichamen, andere delen van het Koninkrijk of in andere Staten is belast met het toezicht op
      financiële markten of op natuurlijke personen en rechtspersonen die op die markten werkzaam zijn, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0028553#Artikel25
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0028553
        artikel: '25'
        hoofdstuk: VI
  - number: 28.a
    text: het doel waarvoor de gegevens of inlichtingen zullen worden gebruikt onvoldoende bepaald is;
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel28
  - number: 28.b
    text: |-
      het beoogde gebruik van de gegevens of inlichtingen niet past in het kader van het toezicht op financiële markten
      of op natuurlijke personen en rechtspersonen die op die markten werkzaam zijn;
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel28
  - number: 28.c
    text: |-
      de verstrekking van de gegevens of inlichtingen zich niet zou verdragen met de wet of de openbare orde
      onderscheidenlijk betrekking hebben op individuele beleggers;
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel28
  - number: 28.d
    text: de geheimhouding van de gegevens of inlichtingen niet in voldoende mate is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel28
  - number: 28.e
    text: |-
      de verstrekking van de gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen komen met de belangen die
      deze wet beoogt te beschermen; of
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel28
  - number: 28.f
    text: |-
      onvoldoende is gewaarborgd dat de gegevens of inlichtingen niet zullen worden gebruikt voor een ander doel dan
      waarvoor deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel28
  - number: '29'
    text: |-
      De Autoriteit Financiële Markten is bevoegd, in het kader van toezicht uitoefening onderzoeken van buitenlandse
      instanties die met het toezicht op beleggingsinstellingen of administrateurs zijn belast, toe te laten bij in de
      openbare lichamen gevestigde beleggingsinstellingen of administrateurs die onder geconsolideerd toezicht staan
      van genoemde toezichthouders. De Autoriteit Financiële Markten zal in voorkomend geval tevoren voorwaarden stellen
      aan onderscheidenlijk aanwijzingen geven voor de uitvoering van deze toezichtwerkzaamheden. De functionarissen
      van de buitenlandse instanties die met het toezicht op beleggingsinstellingen of administrateurs zijn belast, zijn
      gehouden de aanwijzingen van de Autoriteit Financiële Markten stipt te volgen.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel29
  - number: '30'
    text: |-
      De Autoriteit Financiële Markten kan bepalen dat een vergunning op grond van deze wet wordt geweigerd of
      ingetrokken, of dat aan de vergunning beperkingen worden gesteld en voorschriften worden verbonden, dan wel dat de
      eerder gestelde beperkingen en gegeven voorschriften worden gewijzigd, indien:
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel30
  - number: 30.a)
    text: |-
      de beleggingsinstelling of haar beheerder of de administrateur zijn zetel heeft in een Staat, waar in de
      openbare lichamen gevestigde financiële instellingen niet worden toegelaten of aan onredelijke beperkingen worden
      onderworpen; of
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel30
  - number: 30.b)
    text: |-
      een natuurlijke persoon of rechtspersoon met de nationaliteit van een onder a bedoelde Staat rechtstreeks of
      middellijk overwegende zeggenschap kan uitoefenen in de beleggingsinstelling of de administrateur.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel30
  - number: '31'
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel31
  - number: '32.1'
    text: |-
      De aanvrager van een besluit op grond van deze wet is voor het in behandeling nemen van de aanvraag een vergoeding
      verschuldigd van de met de behandeling van de aanvraag verband houdende kosten.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel32
  - number: '32.2'
    text: Bij ministeriële regeling worden de tarieven vastgesteld ter vergoeding van de in het eerste lid bedoelde kosten.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel32
  - number: '32.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de doorberekening van
      kosten, verband houdend met de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel32
  - number: '33'
    text: |-
      Indien de beleggingsinstelling waaraan een vergunning is verleend of de bewaarder, indien aan de
      beleggingsinstelling verbonden, respectievelijk de administrateur niet blijkt te voldoen aan de bij en krachtens
      deze wet gestelde eisen, regels, beperkingen of gegeven voorschriften, kan de Autoriteit Financiële Markten aan de
      beleggingsinstelling instelling of de bewaarder respectievelijk de administrateur een aanwijzing geven om binnen
      een door haar te stellen termijn daaraan alsnog te voldoen.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel33
  - number: '34.1'
    text: |-
      Indien bijzondere gebeurtenissen een adequate functionering van de beleggingsinstelling of de bewaarder
      respectievelijk de administrateur in gevaar brengen en naar het oordeel van de Autoriteit Financiële Markten
      versterking van de organen van de beleggingsinstelling of de bewaarder respectievelijk de administrateur wenselijk
      maken, kan de Autoriteit Financiële Markten schriftelijk aanzeggen dat vanaf een bepaald tijdstip alle of bepaalde
      organen van de beleggingsinstelling of van de bewaarder respectievelijk de administrateur hun bevoegdheden slechts
      mogen uitoefenen na goedkeuring door één of meer door de Autoriteit Financiële Markten aangewezen personen en met
      inachtneming van de opdrachten van deze personen.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel34
  - number: '34.2'
    text: |-
      Indien de Autoriteit Financiële Markten meent dat de bijzondere gebeurtenissen onverwijld ingrijpen noodzakelijk
      maakt kan zij in afwijking van het bepaalde in het eerste lid onmiddellijk aan de beleggingsinstelling of de
      bewaarder respectievelijk de administrateur een met redenen omklede aanzegging doen die terstond van kracht wordt.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel34
  - number: '34.3'
    text: 'Met betrekking tot de in het eerste en tweede lid bedoelde aanzegging is het volgende van toepassing:'
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel34
  - number: 34.3.a)
    text: |-
      de organen zijn verplicht de door de Autoriteit Financiële Markten aangewezen personen alle medewerking te
      verlenen;
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel34
  - number: 34.3.b)
    text: de Autoriteit Financiële Markten kan de organen toestaan bepaalde handelingen zonder toestemming te verrichten;
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel34
  - number: 34.3.c)
    text: de Autoriteit Financiële Markten kan de aangewezen personen te allen tijde door andere vervangen;
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel34
  - number: 34.3.d)
    text: |-
      voor schade ten gevolge van handelingen welke zijn verricht in strijd met een aanzegging als bedoeld in het eerste
      lid zijn degenen, die deze handelingen als orgaan van de beleggingsinstelling of van de bewaarder respectievelijk
      de administrateur verrichten, persoonlijk aansprakelijk tegenover de beleggingsinstelling of de bewaarder
      respectievelijk de administrateur. De beleggingsinstelling of de bewaarder respectievelijk de administrateur kan
      de ongeldigheid van deze handelingen inroepen, indien de wederpartij wist, dat de vereiste goedkeuring ontbrak of
      daarvan niet onkundig kon zijn; en
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel34
  - number: 34.3.e)
    text: |-
      de aanzegging blijft van kracht totdat de in het eerste lid bedoelde omstandigheden niet langer aanwezig zijn, doch
      voor ten hoogste twee jaar.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel34
  - number: '35.1'
    text: |-
      De Autoriteit Financiële Markten kan degene die niet of niet tijdig voldoet aan zijn uit deze wet voortvloeiende
      verplichtingen, een boete opleggen.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel35
  - number: '35.2'
    text: |-
      De hoogte van de boete voor de verscheidene overtredingen wordt bepaald bij algemene maatregel van bestuur, met
      dien verstande dat de boete voor een afzonderlijke overtreding ten hoogste USD 25.000 bedraagt.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel35
  - number: '35.3'
    text: |-
      Alvorens over te gaan tot oplegging van een boete stelt de Autoriteit Financiële Markten betrokkene schriftelijk
      op de hoogte van het voornemen hem een boete op te leggen, onder vermelding van de gronden waarop dat voornemen
      berust.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel35
  - number: '36.1'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de daartoe bij besluit van
      de Autoriteit Financiële Markten aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel36
  - number: '36.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel36
  - number: '36.3'
    text: |-
      [Titel 5.2 van de Algemene wet bestuursrecht][ref1] is van toepassing, met uitzondering van de
      [artikelen 5:18][ref2] en [5:19][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '37.1'
    text: |-
      Met de opsporing van de in deze wet strafbaar gestelde feiten zijn, naast de in
      [artikel 184 van het Wetboek van Strafvordering BES][ref1] bedoelde ambtenaren, belast de daartoe bij besluit van
      Onze Minister van Justitie in overeenstemming met Onze Minister aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel184
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '184'
  - number: '37.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel37
  - number: '38.1'
    text: |-
      Handelen in strijd met [artikel 3, eerste lid][ref1]; [artikel 6][ref2]; [artikel 8, eerste lid][ref3];
      artikel 8, tweede lid; artikel 8, vijfde lid; [artikel 9, eerste lid][ref4]; artikel 9, tweede lid; artikel
      9, vijfde lid; [artikel 14][ref5]; [artikel 17, eerste lid][ref6]; artikel 17, tweede lid; artikel 17, vijfde
      lid; [artikel 18, eerste lid][ref7]; artikel 18, tweede lid; artikel 18, vijfde lid; [artikel 20][ref8]; of
      [artikel 25, eerste lid][ref9], wordt gestraft met een hechtenis van ten hoogste een jaar en een geldboete van de
      vijfde categorie, dan wel met één van deze straffen.


      [ref1]: https://wetten.overheid.nl/BWBR0028553#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028553#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0028553#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0028553#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0028553#Artikel14
      [ref6]: https://wetten.overheid.nl/BWBR0028553#Artikel17
      [ref7]: https://wetten.overheid.nl/BWBR0028553#Artikel18
      [ref8]: https://wetten.overheid.nl/BWBR0028553#Artikel20
      [ref9]: https://wetten.overheid.nl/BWBR0028553#Artikel25
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0028553
        artikel: '3'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028553
        artikel: '6'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0028553
        artikel: '8'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0028553
        artikel: '9'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0028553
        artikel: '14'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref6
        bwb_id: BWBR0028553
        artikel: '17'
        hoofdstuk: IV
        paragraaf: '3'
      - id: ref7
        bwb_id: BWBR0028553
        artikel: '18'
        hoofdstuk: IV
        paragraaf: '3'
      - id: ref8
        bwb_id: BWBR0028553
        artikel: '20'
        hoofdstuk: IV
        paragraaf: '3'
      - id: ref9
        bwb_id: BWBR0028553
        artikel: '25'
        hoofdstuk: VI
  - number: '38.2'
    text: |-
      Opzettelijk handelen in strijd met de voorschriften bedoeld in het eerste lid, wordt gestraft met een
      gevangenisstraf van ten hoogste vier jaar en een geldboete van de vijfde categorie, dan wel met één van deze
      straffen.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel38
  - number: '38.3'
    text: |-
      De in het eerste lid strafbaar gestelde feiten zijn overtredingen. De in het tweede lid strafbaar gestelde feiten
      zijn misdrijven.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel38
  - number: '39.1'
    text: |-
      De Autoriteit Financiële Markten stelt jaarlijks een begroting, een jaarrekening en een jaarverslag op
      terzake van de haar op grond van deze wet opgedragen taken en de daaruit voortvloeiende werkzaamheden. De
      [artikelen 1:30 tot en met 1:33][ref1], [1:35 en 1:36 van de Wet op het financieel toezicht][ref2] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '1'
  - number: '39.2'
    text: Tegen besluiten van Onze Minister inzake instemming met de begroting of de jaarrekening staat geen beroep open.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel39
  - number: '40'
    text: |-
      De Autoriteit Financiële Markten verstrekt Onze Minister desgevraagd de gegevens of inlichtingen die deze behoeft
      om zich over de uitvoering van deze wet in de praktijk of over de uitvoerbaarheid van beleidsvoornemens of
      voorgenomen wettelijke voorschriften een oordeel te vormen.
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel40
  - number: '41'
    text: 'Deze wet wordt aangehaald als: Wet toezicht beleggingsinstellingen en administrateurs BES.'
    url: https://wetten.overheid.nl/BWBR0028553/2010-10-10#Artikel41
