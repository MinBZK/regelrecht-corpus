articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. besluit: [Besluit Gedragstoezicht financiële ondernemingen Wft][ref1];

      b. PE-onderwijsprogramma: onderwijsprogramma voor permanente educatie;

      c. PE-toets: toets voor permanente educatie;

      d. PE-instituut: instituut dat als zodanig is erkend tot het afnemen van PE-onderwijsprogramma’s waarmee de
      vakbekwaamheid wordt aangetoond;

      e. PE-toetstermen: criteria waaraan de vakbekwaamheid van een persoon wordt getoetst om te kunnen vaststellen of
      deze voldoet aan de toetstermen voor permanente educatie;

      f. CDFD: College Deskundigheid Financiële Dienstverlening, zoals ingesteld bij
      [Instellingsbesluit College Deskundigheid Financiële Dienstverlening][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020421
      [ref2]: https://wetten.overheid.nl/BWBR0019653
