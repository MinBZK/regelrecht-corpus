        artikel: '5'
  - number: '4'
    text: |-
      1 Het PE-instituut beschikt over:

      a. aantoonbare en actuele ervaring met het op zorgvuldige en betrouwbare wijze vervaardigen en verzorgen van
      cursussen en het beoordelen van individuele kandidaten;

      b. gekwalificeerde docenten in inhoudelijk, onderwijskundig en toetstechnisch opzicht en maakt daar bij de
      uitvoering van PE-onderwijsprogramma’s ook uitsluitend gebruik van;

      c. een registratie waaruit de vakbekwaamheid van de docenten voor een PE-onderwijsprogramma blijkt;

      d. een evaluatiesysteem voor het afgenomen PE-onderwijsprogramma;

      e. een adequaat kwaliteitsborgingssysteem.

      2 Het PE-instituut biedt een PE-onderwijsprogramma meerdere malen in Nederland aan waarbij kandidaten die
      beschikken over het betreffende diploma, bedoeld in [artikel 6 van het besluit][ref1], worden toegelaten.

      3 Het PE-instituut stemt in met een door het CDFD te organiseren controle.

      4 Het PE-instituut verzorgt het PE-onderwijsprogramma met een toetsend element dat alle PE-toetstermen voor de
      betreffende module afdekt en levert daarbij tevens cursusmateriaal dat als naslagwerk kan dienen voor kandidaten.

      5 Het PE-instituut legt een nieuw ontwikkeld PE-onderwijsprogramma ter beoordeling voor aan Onze Minister.

      6 Het PE-instituut draagt zorg voor een vakinhoudelijk juiste en objectieve beoordeling van de afgenomen PE-
      onderwijsprogramma’s.

      7 Het PE-instituut neemt de maatregelen die redelijkerwijs nodig zijn om te bevorderen dat PE-onderwijsprogramma’s
      op een correcte en eerlijke wijze worden afgelegd en draagt zorg voor een vakinhoudelijke juiste en objectieve
      beoordeling van kandidaten.

      8 Het aantal kandidaten per PE-onderwijsprogramma bedraagt maximaal 25 personen.

      9 Een PE-instituut beschikt over en handelt in overeenstemming met een PE-reglement waarin ten minste de volgende
      onderwerpen met betrekking tot het PE-onderwijsprogramma adequaat zijn geregeld:

      a. wijze van aanmelding van de kandidaten;

      b. aantal malen per jaar dat gelegenheid wordt gegeven tot het volgen van een PE-onderwijsprogramma;

      c. wijze van kennisgeving van plaats, datum en tijdstip van de start- en eindtijden van het PE-onderwijsprogramma;

      d. opbouw, verschillende interactieve onderwijsvormen en uitvoering van PE-onderwijsprogramma’s gericht op
      actieve participatie van de kandidaten en de wijze van beoordelen van kandidaten ten aanzien van hun inhoudelijke
      vakbekwaamheid betreffende de PE-toetstermen;

      e. vaststelling van de identiteit van kandidaten en docenten;

      f. vaststelling van de presentie van de kandidaten;

      g. vaststelling van de rechten en plichten van de kandidaten;

      h. maatregelen om fraude te voorkomen;

      i. bewaartermijnen voor de gegevens van afgelegde PE-onderwijsprogramma’s wat betreft inhoud en de evaluatie,
      gegevens van docenten en gegevens van kandidaten;

      j. interne klachtenprocedure.


