  - number: '5'
    text: |-
      1 Een PE-instituut verstrekt aan Onze Minister twee maanden na de periode, bedoeld in
      [artikel 7 van het besluit][ref1], een opgave van het aantal afgenomen PE-onderwijsprogramma’s, de geanonimiseerde
      klachten over de PE-onderwijsprogramma’s, de slagingspercentages die zijn geregistreerd door het PE-instituut en
      een analyse daarvan.

      2 Een PE-instituut verstrekt aan Onze Minister op diens verzoek de gegevens die Onze Minister nodig acht om te
      bepalen of wordt voldaan aan [artikel 4][ref2].


