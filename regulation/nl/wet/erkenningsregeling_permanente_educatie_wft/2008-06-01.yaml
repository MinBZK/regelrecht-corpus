    text: |-
      1 Een kandidaat die een PE-onderwijsprogramma met goed gevolg heeft afgelegd en beschikt
      over een certificaat afgegeven door een door Onze Minister erkend PE-instituut, voldoet aan
      [artikel 7, eerste en tweede lid, van het besluit][ref1].

      2 Een kandidaat die een PE-toets met goed gevolg heeft afgelegd en beschikt over een certificaat afgegeven door een
      door Onze Minister erkend exameninstituut als bedoeld in [artikel 9, eerste lid, van het besluit][ref2], voldoet
      aan [artikel 7, eerste en tweede lid, van het besluit][ref3].


