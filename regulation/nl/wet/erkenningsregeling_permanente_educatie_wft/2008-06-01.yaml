---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: erkenningsregeling_permanente_educatie_wft
regulatory_layer: WET
publication_date: '2009-12-10'
valid_from: '2008-06-01'
bwb_id: BWBR0023907
url: https://wetten.overheid.nl/BWBR0023907/2008-06-01
preamble:
  text: |-
    Gelet op artikel 8, tweede lid, van het Besluit Gedragstoezicht financiële ondernemingen Wft;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#Artikel1
  - number: 1.a
    text: |-
      besluit: [Besluit Gedragstoezicht financiële ondernemingen Wft][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020421
    url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020421
  - number: 1.b
    text: 'PE-onderwijsprogramma: onderwijsprogramma voor permanente educatie;'
    url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#Artikel1
  - number: 1.c
    text: 'PE-toets: toets voor permanente educatie;'
    url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#Artikel1
  - number: 1.d
    text: |-
      PE-instituut: instituut dat als zodanig is erkend tot het afnemen van PE-onderwijsprogramma’s waarmee de
      vakbekwaamheid wordt aangetoond;
    url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#Artikel1
  - number: 1.e
    text: |-
      PE-toetstermen: criteria waaraan de vakbekwaamheid van een persoon wordt getoetst om te kunnen vaststellen of deze
      voldoet aan de toetstermen voor permanente educatie;
    url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#Artikel1
  - number: 1.f
    text: |-
      CDFD: College Deskundigheid Financiële Dienstverlening, zoals ingesteld bij
      [Instellingsbesluit College Deskundigheid Financiële Dienstverlening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019653
    url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019653
  - number: '2.1'
    text: |-
      Een kandidaat die een PE-onderwijsprogramma met goed gevolg heeft afgelegd en beschikt
      over een certificaat afgegeven door een door Onze Minister erkend PE-instituut, voldoet aan
      [artikel 7, eerste en tweede lid, van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel7
    url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '7'
  - number: '2.2'
    text: |-
      Een kandidaat die een PE-toets met goed gevolg heeft afgelegd en beschikt over een certificaat afgegeven door een
      door Onze Minister erkend exameninstituut als bedoeld in [artikel 9, eerste lid, van het besluit][ref1], voldoet
      aan [artikel 7, eerste en tweede lid, van het besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0020421#Artikel7
    url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0020421
        artikel: '7'
  - number: '3.2'
    text: Onze Minister kan aan een erkenning voorschriften en voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#Artikel3
  - number: '3.3'
    text: 'Onze Minister kan een erkenning intrekken:'
    url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#Artikel3
  - number: 3.3.a
    text: op verzoek van het erkende PE-instituut;
    url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#Artikel3
  - number: 3.3.b
    text: indien het PE-instituut niet voldoet aan een voorschrift of voorwaarde verbonden aan de erkenning; of
    url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#Artikel3
  - number: 3.3.c
    text: |-
      indien het PE-instituut niet langer voldoet aan [artikel 4][ref1] of niet voldoet aan [artikel 5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023907#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0023907#Artikel5
    url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0023907
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0023907
        artikel: '5'
  - number: '4.1'
    text: 'Het PE-instituut beschikt over:'
    url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#Artikel4
  - number: 4.1.a
    text: |-
      aantoonbare en actuele ervaring met het op zorgvuldige en betrouwbare wijze vervaardigen en verzorgen van cursussen
      en het beoordelen van individuele kandidaten;
    url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#Artikel4
  - number: 4.1.b
    text: |-
      gekwalificeerde docenten in inhoudelijk, onderwijskundig en toetstechnisch opzicht en maakt daar bij de uitvoering
      van PE-onderwijsprogramma’s ook uitsluitend gebruik van;
    url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#Artikel4
  - number: 4.1.c
    text: een registratie waaruit de vakbekwaamheid van de docenten voor een PE-onderwijsprogramma blijkt;
    url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#Artikel4
  - number: 4.1.d
    text: een evaluatiesysteem voor het afgenomen PE-onderwijsprogramma;
    url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#Artikel4
  - number: 4.1.e
    text: een adequaat kwaliteitsborgingssysteem.
    url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#Artikel4
  - number: '4.2'
    text: |-
      Het PE-instituut biedt een PE-onderwijsprogramma meerdere malen in Nederland aan waarbij kandidaten die beschikken
      over het betreffende diploma, bedoeld in [artikel 6 van het besluit][ref1], worden toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel6
    url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '6'
  - number: '4.3'
    text: Het PE-instituut stemt in met een door het CDFD te organiseren controle.
    url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#Artikel4
  - number: '4.4'
    text: |-
      Het PE-instituut verzorgt het PE-onderwijsprogramma met een toetsend element dat alle PE-toetstermen voor de
      betreffende module afdekt en levert daarbij tevens cursusmateriaal dat als naslagwerk kan dienen voor kandidaten.
    url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#Artikel4
  - number: '4.5'
    text: Het PE-instituut legt een nieuw ontwikkeld PE-onderwijsprogramma ter beoordeling voor aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#Artikel4
  - number: '4.6'
    text: |-
      Het PE-instituut draagt zorg voor een vakinhoudelijk juiste en objectieve beoordeling van de afgenomen PE-
      onderwijsprogramma’s.
    url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#Artikel4
  - number: '4.7'
    text: |-
      Het PE-instituut neemt de maatregelen die redelijkerwijs nodig zijn om te bevorderen dat PE-onderwijsprogramma’s
      op een correcte en eerlijke wijze worden afgelegd en draagt zorg voor een vakinhoudelijke juiste en objectieve
      beoordeling van kandidaten.
    url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#Artikel4
  - number: '4.8'
    text: Het aantal kandidaten per PE-onderwijsprogramma bedraagt maximaal 25 personen.
    url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#Artikel4
  - number: '4.9'
    text: |-
      Een PE-instituut beschikt over en handelt in overeenstemming met een PE-reglement waarin ten minste de volgende
      onderwerpen met betrekking tot het PE-onderwijsprogramma adequaat zijn geregeld:
    url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#Artikel4
  - number: 4.9.a
    text: wijze van aanmelding van de kandidaten;
    url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#Artikel4
  - number: 4.9.b
    text: aantal malen per jaar dat gelegenheid wordt gegeven tot het volgen van een PE-onderwijsprogramma;
    url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#Artikel4
  - number: 4.9.c
    text: wijze van kennisgeving van plaats, datum en tijdstip van de start- en eindtijden van het PE-onderwijsprogramma;
    url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#Artikel4
  - number: 4.9.d
    text: |-
      opbouw, verschillende interactieve onderwijsvormen en uitvoering van PE-onderwijsprogramma’s gericht op actieve
      participatie van de kandidaten en de wijze van beoordelen van kandidaten ten aanzien van hun inhoudelijke
      vakbekwaamheid betreffende de PE-toetstermen;
    url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#Artikel4
  - number: 4.9.e
    text: vaststelling van de identiteit van kandidaten en docenten;
    url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#Artikel4
  - number: 4.9.f
    text: vaststelling van de presentie van de kandidaten;
    url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#Artikel4
  - number: 4.9.g
    text: vaststelling van de rechten en plichten van de kandidaten;
    url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#Artikel4
  - number: 4.9.h
    text: maatregelen om fraude te voorkomen;
    url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#Artikel4
  - number: 4.9.i
    text: |-
      bewaartermijnen voor de gegevens van afgelegde PE-onderwijsprogramma’s wat betreft inhoud en de evaluatie, gegevens
      van docenten en gegevens van kandidaten;
    url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#Artikel4
  - number: 4.9.j
    text: interne klachtenprocedure.
    url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#Artikel4
  - number: '5.1'
    text: |-
      Een PE-instituut verstrekt aan Onze Minister twee maanden na de periode, bedoeld in
      [artikel 7 van het besluit][ref1], een opgave van het aantal afgenomen PE-onderwijsprogramma’s, de geanonimiseerde
      klachten over de PE-onderwijsprogramma’s, de slagingspercentages die zijn geregistreerd door het PE-instituut en
      een analyse daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0020421#Artikel7
    url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020421
        artikel: '7'
  - number: '5.2'
    text: |-
      Een PE-instituut verstrekt aan Onze Minister op diens verzoek de gegevens die Onze Minister nodig acht om te
      bepalen of wordt voldaan aan [artikel 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023907#Artikel4
    url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0023907
        artikel: '4'
  - number: '6'
    text: Deze regeling treedt in werking met ingang van 1 juni 2008.
    url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#Artikel6
  - number: '7'
    text: 'Deze regeling wordt aangehaald als: Erkenningsregeling permanente educatie Wft.'
    url: https://wetten.overheid.nl/BWBR0023907/2008-06-01#Artikel7
