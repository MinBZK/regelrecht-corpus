  - number: '3'
    text: |-
      1

      Onze Minister besluit tot erkenning tot PE-instituut op schriftelijke aanvraag, indien de aanvrager heeft
      aangetoond te kunnen voldoen aan al de gestelde voorwaarden genoemd in [artikel 4][ref1], voorzover het in die
      leden bepaalde op de aanvrager van toepassing is.

      2 Onze Minister kan aan een erkenning voorschriften en voorwaarden verbinden.

      3 Onze Minister kan een erkenning intrekken:

      a. op verzoek van het erkende PE-instituut;

      b. indien het PE-instituut niet voldoet aan een voorschrift of voorwaarde verbonden aan de erkenning; of

      c. indien het PE-instituut niet langer voldoet aan [artikel 4][ref2] of niet voldoet aan [artikel 5][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0023907#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0023907#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0023907#Artikel5
