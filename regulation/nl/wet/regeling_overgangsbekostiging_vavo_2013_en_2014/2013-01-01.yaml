preamble:
  text: |-
    Gelet op artikel VI van de Wet tot wijziging van onder meer de Wet educatie en beroepsonderwijs inzake voortgezet
    algemeen volwassenenonderwijs en overige educatie van 13 september 2012, gepubliceerd in Stb. 2012, 450, van
    9 oktober 2012;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0032257/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *Minister:* de Minister van Onderwijs, Cultuur en Wetenschap;

      b. *Wet:* de [Wet educatie en beroepsonderwijs][ref1];

      c. *Instelling:* een regionaal opleidingencentrum als bedoeld in [artikel 1.3.1 van de Wet][ref2];

      d. *vavo:* een of meerdere opleidingen voortgezet algemeen volwassenenonderwijs als bedoeld in
      [artikel 7.3.1, eerste lid, onder a, van de Wet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1.3.1
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7.3.1
    url: https://wetten.overheid.nl/BWBR0032257/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007625
      - id: ref2
        bwb_id: BWBR0007625
        artikel: 1.3.1
