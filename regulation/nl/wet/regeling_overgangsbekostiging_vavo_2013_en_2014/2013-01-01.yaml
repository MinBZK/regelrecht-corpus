        bwb_id: BWBR0007625
        artikel: 7.3.1
  - number: '2'
    text: |-
      Indien een instelling op 1 augustus 2012 een of meer opleidingen vavo verzorgde op grond van een overeenkomst
      als bedoeld in [artikel 2.3.4 van de Wet][ref1] zoals luidend op die datum wordt de rijksbijdrage voor
      het vavo, voor de jaren 2013 en 2014, voor die instelling berekend op grond van de formule als bedoeld in
      [artikel VI, eerste lid, van de Wet van 13 september 2012][ref2], gepubliceerd in Stb. 2012, 450


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2.3.4
      [ref2]: https://wetten.overheid.nl/BWBR0032074#ArtikelVI
    url: https://wetten.overheid.nl/BWBR0032257/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 2.3.4
      - id: ref2
        bwb_id: BWBR0032074
        artikel: VI
  - number: '3'
    text: |-
      Voor de rijksbijdrage voor het vavo, waarop de in [artikel 1.3.1 van de Wet][ref1] bedoelde aanspraak betrekking
      heeft, wordt in de overgangsjaren 2013 en 2014 een bedrag beschikbaar gesteld van € 58.321.000 per jaar. Dit bedrag
      kan worden bijgesteld als gevolg van uit de rijksbegroting voortvloeiende maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1.3.1
    url: https://wetten.overheid.nl/BWBR0032257/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 1.3.1
  - number: '4'
    text: |-
      1 De instellingsbudgetten, berekend op grond van de formule genoemd in
      [artikel VI, eerste lid, van de Wet van 13 september 2012][ref1], gepubliceerd in Stb. 2012, 450, worden voor de
      jaren 2013 en 2014 vastgesteld zoals vermeld in de bijlage behorende bij deze regeling.

      2 De instellingsbudgetten, als bedoeld in het eerste lid, kunnen worden bijgesteld als gevolg van uit de
      rijksbegroting voortvloeiende maatregelen, als bedoeld in [artikel 3][ref2]. De bijgestelde instellingsbudgetten
      worden gepubliceerd in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0032074#ArtikelVI
      [ref2]: https://wetten.overheid.nl/BWBR0032257#Artikel3
    url: https://wetten.overheid.nl/BWBR0032257/2013-01-01#Artikel4
    references:
