        artikel: VI
      - id: ref2
        bwb_id: BWBR0032257
        artikel: '3'
  - number: '5'
    text: |-
      Een instelling die in de jaren 2013 en 2014 een rijksbijdrage voor het vavo ontvangt op grond van deze regeling
      neemt in acht hetgeen bij of krachtens de [Wet][ref1] is bepaald ten aanzien van de begroting, verslaglegging en
      gegevensverstrekking, bedoeld in [hoofdstuk 2, titel 5, paragraaf 1a van de Wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Paragraaf1a
    url: https://wetten.overheid.nl/BWBR0032257/2013-01-01#Artikel5
