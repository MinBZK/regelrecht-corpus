        artikel: '4'
  - number: '6'
    text: |-
      1 Indien een besmetting met de in de Bijlage bedoelde schadelijke micro- organismen bij een koppel kalkoenen is
      vastgesteld dient, onverminderd enig ander wettelijk voorschrift, de ondernemer die een kalkoenbedrijf uitoefent,
      op wiens bedrijf het betreffende koppel zich bevindt, onmiddellijk na het ontruimen van de stal waarin hij dat
      koppel heeft gehouden, de betreffende stal grondig te reinigen en te ontsmetten.

      2 Indien de in het vorige lid bedoelde besmetting is vastgesteld bij een koppel kalkoenen dat zich op een
      opfokbedrijf, fokbedrijf of vermeerderingsbedrijf bevindt kan de Voorzitter de betreffende ondernemer verplichten
      het besmette koppel kalkoenen te ruimen of te behandelen. Het Bestuur stelt bij besluit vast onder welke
      voorwaarden een koppel kalkoenen geruimd of behandeld kan worden.

      3 Na het reinigen en ontsmetten, als bedoeld in het eerste lid, laat de ondernemer die een opfokbedrijf, fokbedrijf
      of vermeerderingsbedrijf uitoefent een onderzoek op de aanwezigheid in de stal van de in de Bijlage onderdeel a.
      bedoelde schadelijke microorganismen uitvoeren door een erkende instantie.

      4 Indien uit het onderzoek op de aanwezigheid van de in de Bijlage onderdeel a. bedoelde schadelijke micro-
      organismen, bedoeld in het derde lid, blijkt dat de betreffende stal niet vrij is van deze schadelijke micro-
      organismen, laat de ondernemer die een opfokbedrijf, fokbedrijf of vermeerderingsbedrijf uitoefent de stal reinigen
      en ontsmetten. Een nieuw koppel mag pas worden geplaatst wanneer geen van de in de Bijlage onderdeel a. bedoelde
      schadelijke micro-organismen wordt aangetoond.

      5 In afwijking van het eerste lid dient de ondernemer die een kalkoenkuikenbroederij uitoefent, na vaststelling
      van een besmetting in de kalkoenkuikenbroederij met de in de Bijlage onderdeel a. bedoelde schadelijke micro-
      organismen, de door het Bestuur bij besluit vastgestelde maatregelen te nemen.

      6 De erkende instantie, bedoeld in het derde lid, wordt aangewezen door de Voorzitter en werkt volgens een door het
      Bestuur goedgekeurd protocol.
    url: https://wetten.overheid.nl/BWBR0011073/2009-01-18#Artikel6
  - number: '7'
    text: |-
      1 Het Bestuur wijst een of meerdere instantie(s) aan die wordt belast met de controle op naleving van het bepaalde
      bij of krachtens deze verordening. Bij het uitoefenen van de controle houdt de aangewezen instantie(s) zich aan de
      bepalingen van het protocol dat is vastgesteld door het Bestuur van het Productschap.

      2 Indien een ondernemer het bepaalde bij of krachtens deze verordening heeft overtreden dan zal de in het eerste
      lid bedoelde instantie(s) de AID hiervan op hoogte stellen.
    url: https://wetten.overheid.nl/BWBR0011073/2009-01-18#Artikel7
  - number: '8'
    text: |-
      Ondernemers zijn verplicht:

      a. aan controleurs van de in [artikel 7][ref1] bedoelde instantie(s) al die gegevens te verstrekken of te doen
      verstrekken, die naar hun oordeel nodig zijn voor de vervulling van hun taak;

      b. aan controleurs van de in [artikel 7][ref2] bedoelde instantie(s) inzage te geven of te doen geven van die
      boeken en bescheiden, die naar hun oordeel nodig zijn voor de vervulling van hun taak;

      c. aan controleurs van de in [artikel 7][ref3] bedoelde instantie(s) te allen tijde toegang te geven of te doen
      geven tot hun bedrijfsruimten en tot die plaatsen of vervoermiddelen, waar of waarin voorraden, die tot het bedrijf
      van de ondernemer behoren, zijn opgeslagen of worden vervoerd;

      d. te gedogen dat controleurs van de in [artikel 7][ref4] bedoelde instantie(s) monsters nemen uit de voorraden
      van het bedrijf van de ondernemer, ongeacht de plaats waar of waarin zich die voorraden bevinden, en alsdan de
      gevorderde medewerking overeenkomstig de aanwijzingen en onder toezicht van die controleurs te verlenen;

      e. aan controleurs van de in [artikel 7][ref5] bedoelde instantie(s) voor het overige alle medewerking te verlenen
      ter vervulling van hun taak.


