  - number: '11'
    text: |-
      1 De Voorzitter is bevoegd, op aanvraag, ontheffing te verlenen van het bepaalde bij of krachtens deze verordening
      en aan zodanige ontheffing voorschriften te verbinden, alsmede deze onder beperkingen te verlenen.

      2 Het Bestuur kan vrijstelling verlenen aan ondernemers danwel aan een groep van te onderscheiden categorieën
      ondernemers en aan een zodanige vrijstelling beperkingen en/of voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0011073/2009-01-18#Artikel11
  - number: '12'
    text: |-
      1 Deze verordening kan worden aangehaald als "Verordening hygiënevoorschriften kalkoenhouderij 1999".

      2 Deze verordening treedt, met uitzondering van [artikel 4, tweede lid][ref1], in werking met ingang van de dag na
      die van haar afkondiging in het Verordeningenblad Bedrijfsorganisatie.

      3 Het Bestuur stelt bij besluit het tijdstip vast waarop [artikel 4, tweede lid][ref2], in werking treden. Het
