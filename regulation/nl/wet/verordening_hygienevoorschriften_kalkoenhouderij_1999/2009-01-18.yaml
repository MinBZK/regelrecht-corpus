preamble:
  text: |-
    gelet op de artikelen 93, eerste lid, 95 en 102 van de Wet op de Bedrijfsorganisatie, en de artikelen 5, 6, 7 en 8
    van de Instellingsverordening Produktschap Pluimvee en Eieren,

    op 13 januari 1999 vastgesteld de navolgende

    VERORDENING
  url: https://wetten.overheid.nl/BWBR0011073/2009-01-18#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze verordening en de daarop berustende bepalingen wordt verstaan onder:










                  1.


                  productschap


                  :


                  Productschap Pluimvee en Eieren;




                  2.


                  Bestuur


                  :


                  het Bestuur van het Productschap;




                  3.


                  Voorzitter


                  :


                  de Voorzitter van het Productschap;




                  4.


                  ondernemer


                  :


                  een natuurlijk persoon of rechtspersoon, die een kalkoenbedrijf of een kalkoenkuikenbroederij
      uitoefent;




                  5.


                  kalkoenbedrijf


                  :


                  inrichting die wordt gebruikt voor het (op)fokken en/of het houden van fokkalkoenen en/of
      vleeskalkoenen;




                  6.


                  fokbedrijf


                  :


                  inrichting die zich toelegt op de productie van broedeieren, bestemd voor de productie van
      fokkalkoenen;




                  7.


                  vermeerderingsbedrijf


                  :


                  inrichting die zich toelegt op de productie van broedeieren, bestemd voor de productie van
      vleeskalkoenen;




                  8.


                  opfokbedrijf


                  :


                  een inrichting die zich toelegt op het opfokken van fokkalkoenen tot het voortplantingsstadium;




                  9.


                  kalkoenkuikenbroederij


                  :


                  inrichting die wordt gebruikt voor het inleggen en uitbroeden van broedeieren onderscheidenlijk
      inrichting waarin één of meerdere vorengenoemde handelingen worden verricht;




                  10.


                  vleeskalkoenbedrijf


                  :


                  inrichting die wordt gebruikt voor het houden van vleeskalkoenen;




                  11.


                  kalkoenen


                  :


                  kalkoenen, die worden opgefokt of gehouden voor de productie van broedeieren of vlees;




                  12.


                  broedeieren


                  :


                  eieren afkomstig van kalkoenen, bestemd om te worden bebroed;




                  13.


                  eendagskuikens


                  :


                  kalkoenen die nog géén 72 uur oud zijn;




                  14.


                  fokkalkoenen


                  :


                  kalkoenen van 72 uur en ouder, bestemd voor de productie van broedeieren;




                  15.


                  vleeskalkoenen


                  :


                  kalkoenen van 72 uur en ouder, die worden gehouden voor de productie van vlees;




                  16.


                  koppel


                  :


                  alle kalkoenen met dezelfde gezondheidsstatus die in dezelfde stal of binnen dezelfde uitloopruimte
      worden geplaatst of gehouden en die een epidemiologische eenheid vormen;




                  17.


                  open drinkwatersysteem


                  :


                  drinkwatersysteem waarbij vlotterbakken of voorraadtanken, die geen goed sluitende deksel hebben,
      worden gebruikt en/of andere open verbindingen zijn;




                  18.


                  bedrijfsgebouw


                  :


                  het gebouw waarin kalkoenen worden gehouden en/of broedeieren zijn ingelegd en de tot het gebouw
      behorende voorruimte en lokalen;




                  19.


                  ronde


                  :


                  de periode van opzet van eendagskuikens tot overplaatsing van de kalkoenen of de periode van
      overplaatsing van de kalkoenen tot aflevering van de kalkoenen of de periode van opzet tot aflevering wanneer de
      kalkoenen in dezelfde stal verblijven.
    url: https://wetten.overheid.nl/BWBR0011073/2009-01-18#Artikel1
  - number: '2'
    text: |-
      1 Ondernemers zijn, onverminderd enig ander wettelijk voorschrift, verplicht:

      a. binnen de bedrijfsgebouwen geen huisdieren, landbouwhuisdieren en ander pluimvee, sier- en nutsgevogelte toe
      te laten;

      b. indien ander pluimvee, sier- of nutsgevogelte wordt gehouden op het perceel waarop het kalkoenbedrijf of de
      kalkoenkuikenbroederij wordt uitgeoefend, deze dieren achter een afscheiding of in een volière te houden, waardoor
      deze dieren niet bij de kalkoenenstallen kunnen komen en de verzorging van deze dieren strikt gescheiden te houden
      van de kalkoenen;

      c. de bedrijfsgebouwen zodanig in te richten dat vogels het bedrijfsgebouw niet binnen kunnen komen;

      d. alleen bezoekers toegang tot de bedrijfsgebouwen te verschaffen, als dit voor de bedrijfsvoering strikt
      noodzakelijk is en indien zij handelen overeenkomstig de voorwaarden van de persoonlijke en bedrijfshygiëne;

      e. er op toe te zien dat alle op het bedrijf aanwezige personen de persoonlijke en bedrijfshygiëne volledig in
      acht nemen;

      f. er op toe te zien dat alle personen die het bedrijf willen betreden, vóór het betreden van het schone deel van
      het bedrijfsgebouw schone bedrijfskleding aantrekken;

      g. er voor zorg te dragen dat per bedrijf in minstens één van de bedrijfsgebouwen een handenwasgelegenheid aanwezig
      is, waarin zich ten minste een wasbak met afvoer, water, zeep en een handdoek bevindt;

      h. per opfokbedrijf, vermeerderingsbedrijf en kalkoenkuikenbroederij een douche aanwezig is;

      i. er voor zorg te dragen dat de faciliteiten voor persoonlijke hygiëne in een goed functionerende staat zijn;

      j. er op toe te zien dat, voordat de stal en/of broederij wordt betreden, de handen worden gewassen en, in het
      geval van een opfokbedrijf, vermeerderingsbedrijf of kalkoenkuikenbroederij, wordt gedoucht;

      k. een ongediertebestrijdingsplan op te stellen en volgens het plan te werken, tenzij gewerkt wordt met een
      professionele ongediertebestrijdingsinstantie die minimaal elke twee maanden op het bedrijf langskomt om eventueel
      aanwezig ongedierte te bestrijden;

      l. alle acties met betrekking tot wering, signalering en bestrijding van ongedierte vast te leggen in, indien van
      toepassing, het ongediertebestrijdingsplan en te intensiveren bij een toename van dit ongedierte;

      m. drinkwater van een eigen bron in combinatie met een gesloten drinkwatersysteem, drinkwater van een eigen bron en
      drinkwater van het openbare waterleidingnet in combinatie met een open drinkwatersysteem jaarlijks door een erkende
      instantie, welke door de Voorzitter is aangewezen en werkt volgens een door het Bestuur vastgesteld protocol,
      te laten onderzoeken en de onderzoeksresultaten twee jaar te bewaren. Het Bestuur kan bij besluit nadere regels
      stellen ten aanzien van het vorenbedoeld onderzoek. Wanneer de uitslag van het drinkwateronderzoek niet voldoet
      aan een door het Bestuur vastgestelde norm dan dient de ondernemer de door het Bestuur vastgestelde maatregelen
      te nemen;

      n. indien gebruik wordt gemaakt van drinkwater van het openbare waterleidingnet in combinatie met een gesloten
      drinkwatersysteem, aan te tonen dat het drinkwatersysteem tijdens elke leegstandperiode wordt gereinigd en ontsmet;

      o. indien gebruik wordt gemaakt van drinkwater van het openbare waterleidingnet in combinatie met een gesloten
      drinkwatersysteem en een drinkwateronderzoek is uitgevoerd overeenkomstig het bepaalde in onderdeel m, vervalt de
      verplichting tot reiniging en ontsmetting als bedoeld in onderdeel n, mits de uitslag van het drinkwateronderzoek
      voldoet aan de door het Bestuur vastgestelde norm;

      p. wanneer zij een kalkoenkuikenbroederij uitoefenen, de kalkoenkuikenbroederij zo in te richten dat geen
      kruisbesmetting van de in de Bijlage onderdeel a bedoelde schadelijke micro-organismen kan ontstaan.

      2 Ondernemers zijn, onverminderd enig ander wettelijk voorschrift, voorts verplicht:

      a. het perceel waarop het kalkoenbedrijf wordt uitgeoefend zodanig in te richten dat de perceelgrenzen herkenbaar
      zijn en dat voor bezoekers duidelijk is waar zij zich moeten melden;

      b. de bedrijfsgebouwen en de inventaris schoon te houden en het perceel waarop het pluimveebedrijf of de
      kuikenbroederij wordt uitgeoefend en met name de directe omgeving van de stallen schoon te maken en op te ruimen,
      zodat geen ongedierte aangetrokken wordt;

      c. de bedrijfsgebouwen zodanig in te richten, dat ongehinderde toegang door derden tot de stallen niet mogelijk is;

      d. in iedere stal een voorruimte aanwezig te hebben die volledig afgescheiden is van de ruimte waarin de kalkoenen
      gehouden worden;

      e. bij iedere stal en/of broederij een fysieke scheiding aan te brengen in een bufferdeel en een schoon deel en op
      de scheiding van het bufferdeel en het schone deel van schoeisel te wisselen;

      f. er voor zorg te dragen dat in het schone deel van de stal voldoende schoeisel aanwezig is;

      g. indien op een kalkoenbedrijf meerdere leeftijdsgroepen kalkoenen aanwezig zijn, ervoor zorg te dragen dat
      per leeftijdsgroep in het bufferdeel van de stal schone bedrijfskleding aanwezig is en erop toe te zien dat alle
      personen die de betreffende stal willen betreden, vóór het betreden van het schone deel van de stal de schone
      bedrijfskleding aantrekken;

      h. er voor zorg te dragen dat de loop- en/of rijroutes van en naar de bedrijfsgebouwen verhard zijn, zodanig dat
      deze deugdelijk gereinigd kunnen worden;

      i. er voor zorg te dragen dat er een deugdelijke afwatering ten opzichte van de stallen op het perceel aanwezig is;

      j. voedersilo's op een verharde ondergrond te plaatsen, schoon te houden, van buiten de stallen te vullen en,
      indien meerdere voedersilo’s op het bedrijf aanwezig zijn, te voorzien van een bedrijfs-uniek nummer;

      k. gebruik te maken van een bedrijfs-eigen stofzak bij het lossen van het voer;

      l. voeders, aanwezig bodem- en neststrooisel en verpakkingsmateriaal zodanig op te slaan dat deze schoon, droog en
      schimmelvrij blijven;

      m. voeder dat na de ontruiming van een stal nog aanwezig is in het voedersysteem buiten de silo af te voeren,
      zodanig dat het niet meer in contact kan komen met de kalkoenen.

      3 Ondernemers die een kalkoenbedrijf uitoefenen zijn verplicht zich jaarlijks ten minste één maal op eigen kosten
      te laten controleren op de naleving van het bepaalde bij of krachtens deze verordening door een door de voorzitter
      erkende controle-instantie.

      4 Ondernemers die een kalkoenkuikenbroederij uitoefenen zijn verplicht zich iedere drie maanden op eigen kosten
      te laten controleren op de naleving van het bepaalde bij of krachtens deze verordening door een door de voorzitter
      erkende controle-instantie.

      5 Het bestuur stelt bij besluit de erkenningsvoorwaarden vast waaraan een controle-instantie, zoals bedoeld
      in de voorgaande twee leden, ten minste dient te voldoen. Deze voorwaarden strekken tot waarborging van de
      onafhankelijkheid en de expertise van de controle-instanties.

      6 Het besluit zoals bedoeld in het voorgaande lid wordt gepubliceerd in het Verordeningenblad Bedrijfsorganisatie.
    url: https://wetten.overheid.nl/BWBR0011073/2009-01-18#Artikel2
  - number: 2a
    text: |-
      1 Controle-instanties zoals bedoeld in [artikel 2, derde, vierde en vijfde lid][ref1], kunnen op aanvraag worden
      erkend door de voorzitter.

      2 De erkenning kan tijdelijk en onder voorwaarden worden verleend. De erkenning kan worden ingetrokken indien
      blijkt dat niet meer aan de voorwaarden wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011073#Artikel2
