  - number: '3'
    text: |-
      1 Iedere ondernemer die een kalkoenbedrijf uitoefent is, onverminderd enig ander wettelijk voorschrift, verplicht
      onmiddellijk na het ontruimen van een stal waarin hij een koppel kalkoenen heeft gehouden, de in die stal aanwezige
      mest en strooisel te verwijderen en na afvoer van de mest en strooisel de betreffende stal grondig te reinigen en
      te ontsmetten.

      2 De ondernemer die een kalkoenbedrijf uitoefent laat na het reinigen en ontsmetten, als bedoeld in het eerste
      lid, een maal per kalenderjaar in de stallen waar eendagskuikens zijn opgezet een hygiëneonderzoek door een erkende
      instantie uitvoeren, op de wijze als omschreven in een door het bestuur vast te stellen besluit.

      3 De ondernemer die een fokbedrijf of vermeerderingsbedrijf uitoefent laat na het reinigen en ontsmetten, als
      bedoeld in het eerste lid, een maal per kalenderjaar een hygiëneonderzoek door een erkende instantie uitvoeren op
      de wijze als omschreven in een door het bestuur vast te stellen besluit.

      4 Iedere ondernemer die een kalkoenkuikenbroederij uitoefent is, onverminderd enig ander wettelijk voorschrift,
      verplicht onmiddellijk na de aflevering van de eendagskuikens, de gebruikte lokalen te reinigen en ontsmetten.

      5 Iedere ondernemer die een kalkoenkuikenbroederij uitoefent is verplicht een hygiëne-onderzoek te laten uitvoeren
      door een erkende instantie, volgens een door het Bestuur vastgesteld programma, waarbij het onder door het Bestuur
      vast te stellen voorwaarden is toegestaan dat de ondernemer die een kalkoenkuikenbroederij uitoefent zelf een
      deel van het vorengenoemde programma uitvoert. De uitslag van dit onderzoek dient te voldoen aan de norm voor de
      betreffende kalkoenkuikenbroederij. De hiervoor bedoelde normen zullen door het Bestuur worden vastgesteld.

      6 De erkende instantie, bedoeld in het tweede en vijfde lid, wordt aangewezen door de Voorzitter en werkt volgens
      een door het Bestuur goedgekeurd protocol.

      7 Iedere ondernemer is verplicht de uitslag van het hygiëne-onderzoek, bedoeld in het tweede en vijfde lid, twee
      jaar te bewaren.
    url: https://wetten.overheid.nl/BWBR0011073/2009-01-18#Artikel3
  - number: '4'
    text: |-
      1 Iedere ondernemer is verplicht elk koppel kalkoenen te laten onderzoeken op de aanwezigheid van de in de Bijlage,
      onderdeel a., bedoelde schadelijke micro-organismen.

      2

      3 Het in het eerste en tweede lid bedoelde onderzoek geschiedt door middel van het nemen van monsters. De monsters
      dienen te worden genomen door een erkende instantie, die wordt aangewezen door de Voorzitter en werkt volgens een
      door het Bestuur goedgekeurd protocol.

      4 In afwijking van het derde lid is het de ondernemer die een vleeskalkoenbedrijf, kalkoenkuikenbroederij,
      opfokbedrijf of vermeerderingsbedrijf uitoefent toegestaan zelf monsters te nemen of te laten nemen, indien geborgd
      wordt dat deze monstername op correcte wijze wordt uitgevoerd. Het Bestuur stelt de eisen vast waaraan de in de
      vorige zin bedoelde borgingssystematiek moet voldoen.

      5 Het Bestuur kan regels stellen omtrent de wijze van bemonstering en het tijdstip waarop de bemonstering dient
      plaats te vinden.

      6 De monsters dienen te worden onderzocht door een erkend laboratorium, dat wordt aangewezen door de Voorzitter, op
      basis van door het Bestuur vast te stellen erkenningsvoorwaarden.

      7 Iedere ondernemer is verplicht de uitslag van het onderzoek, bedoeld in het eerste en tweede lid, twee jaar te
      bewaren.
    url: https://wetten.overheid.nl/BWBR0011073/2009-01-18#Artikel4
  - number: '5'
    text: |-
      1 Iedere ondernemer is verplicht de informatie, die is verkregen door middel van het onderzoek, bedoeld in het
      [eerste en tweede lid van artikel 4][ref1], door te geven aan de afnemer en/of de leverancier van het koppel
      kalkoenen of de broedeieren.

      2 Iedere ondernemer, die een vleeskalkoenbedrijf en/of een kalkoenkuikenbroederij uitoefent, is verplicht de in het
      eerste lid bedoelde informatie door te geven aan het Productschap.


      [ref1]: https://wetten.overheid.nl/BWBR0011073#Artikel4
    url: https://wetten.overheid.nl/BWBR0011073/2009-01-18#Artikel5
