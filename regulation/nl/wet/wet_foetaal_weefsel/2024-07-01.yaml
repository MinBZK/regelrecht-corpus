        artikel: '12'
  - number: '13.2'
    text: |-
      Met hechtenis van ten hoogste zes maanden of geldboete van de vierde categorie wordt gestraft degene die handelt in
      strijd met het bepaalde bij of krachtens de [artikelen 5][ref1], [7][ref2] en [11][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0012983#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0012983#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0012983#Artikel11
    url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0012983
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0012983
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0012983
        artikel: '11'
  - number: '13.3'
    text: |-
      De in het eerste lid strafbaar gestelde feiten zijn misdrijven; de in het tweede lid strafbaar gestelde feiten
      zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#Artikel13
  - number: '15'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#Artikel15
  - number: '16'
    text: 'Deze wet wordt aangehaald als: Wet foetaal weefsel.'
    url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#Artikel16
