$id: wet_foetaal_weefsel
regulatory_layer: WET
publication_date: '2024-03-27'
valid_from: '2024-07-01'
bwb_id: BWBR0012983
url: https://wetten.overheid.nl/BWBR0012983/2024-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen te stellen omtrent de voorwaarden waaronder
    terbeschikkingstelling en gebruik van foetaal weefsel toelaatbaar is;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#Artikel1
  - number: 1.1.b
    text: 'menselijke vrucht: resultaat van de samensmelting van menselijke geslachtscellen;'
    url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#Artikel1
  - number: 1.1.c
    text: |-
      foetaal weefsel: bestanddelen die deel uitmaken van een na een zwangerschapsduur van minder dan vierentwintig weken
      levenloos ter wereld gekomen dan wel binnen vierentwintig uur na de geboorte overleden menselijke vrucht of van
      delen daarvan;
    url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#Artikel1
  - number: 1.1.d
    text: 'vrouw: de vrouw uit wie de menselijke vrucht ter wereld is gekomen.'
    url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#Artikel1
  - number: '1.2'
    text: |-
      Deze wet is niet van toepassing op het bewaren en gebruiken van foetaal weefsel voor pathologisch-anatomisch
      onderzoek ten behoeve van de vrouw.
    url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#Artikel1
  - number: '2.1'
    text: 'Het bewaren en gebruiken van foetaal weefsel is slechts toegestaan ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#Artikel2
  - number: 2.1.a
    text: |-
      geneeskundige doeleinden, medisch- of biologisch-wetenschappelijk onderzoek of medisch- of biologisch-
      wetenschappelijk onderwijs, of
    url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#Artikel2
  - number: 2.1.b
    text: |-
      de opsporing en vervolging van een misdrijf als bedoeld in de [artikelen 241][ref1], [243][ref2] en
      [245 tot en met 250 van het Wetboek van Strafrecht][ref3], dat vermoedelijk heeft geleid tot de zwangerschap
      waarvan het foetaal weefsel afkomstig is.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel241
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel243
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel241
    url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '241'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '243'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '241'
  - number: '2.2'
    text: |-
      Gebruik van foetaal weefsel is niet toegestaan voor geneeskundige behandeling van door de vrouw aangewezen
      personen.
    url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#Artikel2
  - number: '3.1'
    text: |-
      Voor het bewaren en gebruiken van foetaal weefsel is de toestemming vereist van de vrouw. De toestemming wordt
      vooraf verleend bij een verklaring die ten minste eigenhandig is gedagtekend en ondertekend.
    url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#Artikel3
  - number: '3.2'
    text: |-
      Is de vrouw minderjarig en heeft zij de leeftijd van twaalf maar die van zestien jaar nog niet bereikt, dan is mede
      toestemming vereist van degenen die het gezag over haar uitoefenen.
    url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#Artikel3
  - number: '3.3'
    text: |-
      Is zij twaalf jaar of ouder en niet in staat tot een redelijke waardering van haar belangen ter zake, dan is
      toestemming vereist van degenen die het gezag over haar uitoefenen dan wel indien zij meerderjarig is, van de
      wettelijke vertegenwoordiger of, indien deze ontbreekt, van haar echtgenoot, geregistreerde partner of andere
      levensgezel.
    url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#Artikel3
  - number: '3.4'
    text: |-
      Het bewaren en gebruiken van het foetaal weefsel vindt geen doorgang indien daartegen bezwaar is gemaakt door de
      echtgenoot, geregistreerde partner of andere levensgezel. Indien blijkt dat degene van wie de zaadcellen afkomstig
      zijn, een ander is dan de echtgenoot, geregistreerde partner of andere levensgezel van de vrouw, vindt bewaring of
      gebruik van het foetaal weefsel geen doorgang indien hij dat verzoekt.
    url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#Artikel3
  - number: '4.1'
    text: |-
      Alvorens toestemming wordt gevraagd, wordt de persoon wiens toestemming is vereist, ingelicht over de aard en het
      doel van het voorgenomen gebruik van het foetaal weefsel.
    url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#Artikel4
  - number: '4.2'
    text: |-
      Het geven van de inlichtingen en het vragen van de toestemming geschiedt door de zorg van de behandelend arts en
      niet voordat vaststaat dat het foetaal weefsel ter beschikking zal komen. De behandelend arts, die niet bij de
      uitvoering van het beoogde gebruik van het foetaal weefsel mag zijn betrokken, draagt er tevens zorg voor dat de
      inlichtingen worden verstrekt op een wijze die waarborgt dat de vrouw in vrijheid kan beslissen.
    url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#Artikel4
  - number: '4.3'
    text: |-
      De inlichtingen worden op een zodanige wijze verstrekt dat redelijkerwijs zeker is dat degenen wier toestemming
      is vereist, deze naar haar inhoud hebben begrepen. In het geval, bedoeld in [artikel 3, derde lid][ref1], wordt de
      vrouw ingelicht op een wijze die past bij haar bevattingsvermogen.


      [ref1]: https://wetten.overheid.nl/BWBR0012983#Artikel3
    url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012983
        artikel: '3'
  - number: '4.4'
    text: |-
      De inlichtingen omvatten in ieder geval de informatie, bedoeld in de bijlage bij richtlijn 2004/23/EG van het
      Europees Parlement en de Raad van 31 maart 2004 tot vaststelling van kwaliteits- en veiligheidsnormen voor het
      doneren, verkrijgen, testen, bewerken, bewaren en distribueren van menselijke weefsels en cellen (PbEU L 102).
    url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#Artikel4
  - number: '4.5'
    text: |-
      Een wijziging van de in het vierde lid genoemde richtlijn gaat voor de toepassing van dit artikel gelden met ingang
      van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#Artikel4
  - number: '5.1'
    text: |-
      Door de zorg van de instelling waar foetaal weefsel ter beschikking komt, wordt van de verleende toestemming en een
      gemaakt bezwaar aantekening gemaakt in het dossier van de vrouw.
    url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#Artikel5
  - number: '5.2'
    text: |-
      De vrouw, dan wel degene die in haar plaats toestemming heeft gegeven, kan de toestemming te allen tijde, zonder
      opgaaf van redenen, intrekken met dien verstande dat de intrekking geen gevolgen heeft voor zover het foetaal
      weefsel reeds is gebruikt. Het eerste lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#Artikel5
  - number: '5.3'
    text: |-
      Is de toestemming geweigerd, dan wordt het desbetreffende foetaal weefsel niet langer bewaard. Hetzelfde geldt
      indien de toestemming wordt ingetrokken, bezwaar is gemaakt of een verzoek is gedaan als bedoeld in de tweede
      volzin van [artikel 3, vierde lid][ref1], tenzij het foetaal weefsel niet meer kan worden herleid tot degene die
      het ter beschikking heeft gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0012983#Artikel3
    url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012983
        artikel: '3'
  - number: '6.1'
    text: |-
      Een instelling waar foetaal weefsel ter beschikking komt, stelt een reglement vast betreffende de wijze waarop in
      de instelling toepassing wordt gegeven aan deze wet. Het reglement heeft in ieder geval betrekking op de volgende
      onderwerpen:
    url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#Artikel6
  - number: 6.1.a
    text: de keuze van de vrouwen aan wie toestemming voor het gebruik van foetaal weefsel wordt gevraagd;
    url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#Artikel6
  - number: 6.1.b
    text: de wijze waarop de noodzakelijke inlichtingen worden gegeven en de toestemming wordt gevraagd;
    url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#Artikel6
  - number: 6.1.c
    text: de wijze waarop en de voorwaarden waaronder het foetaal weefsel aan de gebruiker ter beschikking wordt gesteld;
    url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#Artikel6
  - number: 6.1.d
    text: de openbare verslaglegging over toepassing van de onderdelen a, b en c.
    url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#Artikel6
  - number: '6.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de inhoud van het in
      het eerste lid bedoelde reglement. Een krachtens de eerste volzin vast te stellen algemene maatregel van bestuur
      treedt niet eerder in werking dan acht weken na de datum van uitgifte van het Staatsblad waarin hij is geplaatst.
      Van de plaatsing wordt onverwijld mededeling gedaan aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#Artikel6
  - number: '7.1'
    text: |-
      Foetaal weefsel wordt, tenzij dat in verband met de aard van het voorgenomen gebruik noodzakelijk is, niet zodanig
      bewaard dat het herleid kan worden tot de vrouw of haar echtgenoot, geregistreerde partner of andere levensgezel.
      Indien de echtgenoot, geregistreerde partner of andere levensgezel niet in de gelegenheid is gesteld gebruik te
      maken van de in [artikel 3, vierde lid][ref1], bedoelde bevoegdheid, wordt het foetaal weefsel zodanig bewaard
      dat het niet tot de vrouw of haar echtgenoot, geregistreerde partner of andere levensgezel herleidbaar is. Blijkt
      dat degene van wie de zaadcellen afkomstig zijn, een ander is dan de echtgenoot, geregistreerde partner of andere
      levensgezel van de vrouw, dan wordt het foetaal weefsel op zijn verzoek zodanig bewaard dat het niet tot hem
      herleidbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0012983#Artikel3
    url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0012983
        artikel: '3'
  - number: '7.2'
    text: |-
      Een instelling of persoon die in de uitoefening van een geneeskundig beroep of bedrijf foetaal weefsel voorhanden
      heeft, stelt een reglement vast betreffende de wijze waarop en de termijn gedurende welke foetaal weefsel wordt
      bewaard.
    url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#Artikel7
  - number: '7.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld betreffende de inhoud en wijze van
      totstandkoming van het in het tweede lid bedoelde reglement.
    url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#Artikel7
  - number: 7a
    text: |-
      In de gevallen, bedoeld in [artikel 2, eerste lid, onderdeel b][ref1], zijn de
      [artikelen 3, tweede tot en met vierde lid][ref2], en [7, eerste lid][ref3], van deze wet, en
      [artikel 28 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref4], niet van toepassing, met dien
      verstande dat foetaal weefsel dat afkomstig is van een vrouw die de leeftijd van zestien jaar nog niet heeft
      bereikt of een vrouw die niet in staat is tot een redelijke waardering van haar belangen te komen of overleden is,
      in afwijking van artikel 3, eerste lid, zonder haar toestemming kan worden gebruikt en bewaard indien vermoed wordt
      dat zij voorwerp is van een misdrijf als bedoeld in artikel 2, eerste lid, onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0012983#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012983#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0012983#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0040940#Artikel28
    url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0012983
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0012983
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0012983
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0040940
        artikel: '28'
  - number: '8'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de ambtenaren van de
      Inspectie gezondheidszorg en jeugd.
    url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#Artikel8
  - number: '9'
    text: |-
      Het is verboden een vergoeding te geven of te ontvangen voor het ter beschikking stellen van foetaal weefsel voor
      bewaring of gebruik.
    url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#Artikel9
  - number: '10'
    text: |-
      Het is verboden geslachtscellen en andere bestanddelen afkomstig van een menselijke vrucht te bewaren en te
      gebruiken voor voortplantingsdoeleinden en niet-geneeskundige doeleinden.
    url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#Artikel10
  - number: '11'
    text: |-
      Het is verboden uit foetaal weefsel in kweek gebrachte cellen te gebruiken voor andere doeleinden dan geneeskundige
      doeleinden, medisch- en biologisch-wetenschappelijk onderzoek of medisch- en biologisch-wetenschappelijk onderwijs.
    url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#Artikel11
  - number: '12'
    text: |-
      Het is verboden met het oog op het voorgenomen gebruik van foetaal weefsel bestanddelen uit een ter wereld gekomen
      nog in leven zijnde menselijke vrucht te verwijderen.
    url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#Artikel12
  - number: '13.1'
    text: |-
      Met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie wordt gestraft degene die
      opzettelijk in strijd handelt met het bepaalde bij of krachtens de [artikelen 2][ref1], [3][ref2], [4][ref3],
      [6][ref4], [9][ref5], [10][ref6] en [12][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0012983#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012983#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0012983#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0012983#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0012983#Artikel9
      [ref6]: https://wetten.overheid.nl/BWBR0012983#Artikel10
      [ref7]: https://wetten.overheid.nl/BWBR0012983#Artikel12
    url: https://wetten.overheid.nl/BWBR0012983/2024-07-01#Artikel13
