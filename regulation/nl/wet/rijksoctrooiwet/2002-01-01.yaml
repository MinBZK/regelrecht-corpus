$id: rijksoctrooiwet
regulatory_layer: WET
publication_date: '2004-11-18'
valid_from: '2002-01-01'
bwb_id: BWBR0001879
url: https://wetten.overheid.nl/BWBR0001879/2002-01-01
preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of hooren lezen, saluut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het wenschelijk is het octrooirecht voor uitvindingen voor het Rijk in
    Europa en voor de koloniën en bezittingen in andere werelddeelen te regelen:

    Zoo is het, dat Wij den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze Rijkswet en de daarop berustende bepalingen wordt verstaan onder: *Europees Octrooiverdrag*: het op 5
      oktober 1973 te München tot stand gekomen Verdrag inzake de verlening van Europese octrooien (*Trb.* 1975, 108 en
      1976, 101); *Europees octrooi*: een krachtens het Europees Octrooiverdrag verleend octrooi, voor zover dat voor
      het Koninkrijk is verleend; *Samenwerkingsverdrag*: het op 19 juni 1970 te Washington tot stand gekomen Verdrag tot
      samenwerking inzake octrooien (*Trb.* 1973, 20); *internationale aanvrage*: een ingevolge het Samenwerkingsverdrag
      ingediende aanvrage, waarin het Koninkrijk is aangewezen en waaruit blijkt dat de aanvrager voor het Koninkrijk een
      overeenkomstig deze Rijkswet verleend octrooi wenst te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel1
  - number: '1.2'
    text: Op besluiten en andere handelingen krachtens deze wet is de Algemene wet bestuursrecht niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel1
  - number: 1A
    text: |-
      Aan hem, die een nieuw voortbrengsel of een nieuwe werkwijze heeft uitgevonden, wordt op zijn aanvrage octrooi
      verleend.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel1A
  - number: '2.1'
    text: |-
      Voortbrengselen of werkwijzen worden alleen dan niet als nieuw aangemerkt, wanneer zij reeds deel uitmaken van de
      stand van de techniek.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel2
  - number: '2.2'
    text: |-
      De stand van de techniek wordt gevormd door al hetgeen vóór de dag van indiening van de aanvrage door een
      beschrijving of op enige andere wijze openbaar toegankelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel2
  - number: '2.3'
    text: |-
      Tot de stand van de techniek behoort tevens de inhoud van eerder ingediende octrooiaanvragen, die op of na
      de in het tweede lid bedoelde dag overeenkomstig [artikel 22C][ref1] ter inzage worden gelegd of, indien die
      terinzagelegging nog niet had plaatsgevonden, overeenkomstig [artikel 25][ref2] worden openbaar gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22C
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel25
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22C
        hoofdstuk: II
        afdeling: II
      - id: ref2
        bwb_id: BWBR0001879
        artikel: '25'
        hoofdstuk: II
        afdeling: II
  - number: '2.4'
    text: |-
      Tot de stand van de techniek behoort voorts de inhoud van Europese octrooiaanvragen als bedoeld in het [Europees
      Octrooiverdrag](onbekend) en van internationale aanvragen als bedoeld in [artikel 158, eerste en tweede lid,
      van dat Verdrag](onbekend), waarvan de datum van indiening, die geldt voor de toepassing van [artikel 54, tweede
      en derde lid, van dat Verdrag](onbekend), ligt vóór de in het tweede lid bedoelde dag, en die op of na die dag
      zijn gepubliceerd op grond van [artikel 93 van dat Verdrag](onbekend) onderscheidenlijk van artikel 21 van het
      Samenwerkingsverdrag, mits het Koninkrijk in de gepubliceerde aanvrage is aangewezen.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel2
  - number: '2.5'
    text: |-
      Voor de toepassing van dit artikel blijft buiten beschouwing al hetgeen binnen zes maanden vóór de dag van
      indiening van een octrooiaanvrage openbaar toegankelijk is geworden als direkt of indirekt gevolg van hetzij
      een kennelijk misbruik ten opzichte van de aanvrager of diens rechtsvoorganger, hetzij de omstandigheid, dat de
      aanvrager of diens rechtsvoorganger op een van overheidswege gehouden of erkende internationale tentoonstelling in
      de zin van het Verdrag inzake Internationale Tentoonstellingen, ondertekend te Parijs op 22 november 1928, zoals
      dat is gewijzigd, laatstelijk bij Protocol van 30 november 1972 (*Trb.* 1973, 100), het betrokken voortbrengsel
      heeft tentoongesteld of de betrokken werkwijze aanschouwelijk heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel2
  - number: '2.6'
    text: |-
      De erkenning van overheidswege van tentoonstellingen in Nederland geschiedt door Onze Minister van Economische
      Zaken en die van tentoonstellingen in de Nederlandse Antillen of Aruba door de Regering van het betrokken land.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel2
  - number: 2A.1
    text: |-
      Datgene waarvoor octrooi wordt aangevraagd, wordt geacht te zijn uitgevonden, wanneer het vóór de dag van indiening
      voor een deskundige, gegeven de stand van de techniek, niet voor de hand lag.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel2A
  - number: 2A.2
    text: |-
      Voor de toepassing van dit artikel wordt de inhoud van de in [artikel 2, derde en vierde lid][ref1], bedoelde
      octrooiaanvragen buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel2
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel2A
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '2'
        hoofdstuk: I
  - number: '3.1'
    text: |-
      Een uitvinding is slechts vatbaar voor octrooi, wanneer zij strekt tot verkrijging van enige uitkomst op welk
      gebied van de nijverheid ook, daaronder begrepen de landbouw.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel3
  - number: '3.2'
    text: |-
      Niettemin wordt geen octrooi verleend voor planten- of dierenrassen, alsmede voor werkwijzen van wezenlijk
      biologische aard voor de voortbrenging van planten of dieren, met uitzondering van microbiologische werkwijzen en
      hierdoor verkregen voortbrengselen.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel3
  - number: '5'
    text: |-
      Geen octrooi wordt verleend voor voortbrengselen of werkwijzen, waarvan het openbaar worden strijdig zou zijn met
      de openbare orde of de goede zeden.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel5
  - number: 5A
    text: |-
      Elke aanvrage om octrooi mag slechts op een enkele uitvinding betrekking hebben of op een groep van uitvindingen,
      die zodanig onderling verbonden zijn, dat zij op een enkele algemene uitvindingsgedachte berusten. Nadere
      voorschriften dienaangaande kunnen bij algemene maatregel van Rijksbestuur worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel5A
  - number: '6'
    text: |-
      Onverminderd de [artikelen 9][ref1], [10][ref2] en [11][ref3], wordt de aanvrager als uitvinder beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel11
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '9'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0001879
        artikel: '10'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0001879
        artikel: '11'
        hoofdstuk: I
  - number: '7.1'
    text: |-
      Hij, die in een der landen, aangesloten bij de Internationale Unie tot bescherming van de industriële eigendom,
      overeenkomstig de in dat land geldende wetten, of hij, die, overeenkomstig de tussen twee of meer der voornoemde
      landen gesloten verdragen, octrooi of een gebruikscertificaat dan wel bescherming van een gebruiksmodel heeft
      aangevraagd, geniet gedurende een termijn van twaalf maanden na de dag dier aanvrage binnen het Koninkrijk
      een recht van voorrang ter verkrijging van octrooi voor datgene, waarvoor door hem de in de aanhef bedoelde
      bescherming werd aangevraagd. Het voorgaande vindt overeenkomstige toepassing ten aanzien van hem, die een
      uitvinderscertificaat heeft aangevraagd, indien de betrokken wetgeving de keus laat tussen verkrijging van zodanig
      certificaat of een octrooi.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel7
  - number: '7.2'
    text: |-
      Onder aanvrage in de zin van het eerste lid wordt iedere aanvrage verstaan, waarvan de datum van indiening kan
      worden vastgesteld, ongeacht het verdere lot van die aanvrage.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel7
  - number: '7.3'
    text: |-
      Indien de rechthebbende meer aanvragen voor hetzelfde onderwerp heeft ingediend, komt voor het recht van voorrang
      slechts de eerst ingediende in aanmerking. Niettemin kan het recht van voorrang ook berusten op een later
      ingediende aanvrage ter verkrijging van bescherming in hetzelfde land, mits de eerst ingediende aanvrage vóór
      de indiening van de latere aanvrage is ingetrokken, vervallen of afgewezen zonder ter kennis van het publiek te
      zijn gebracht en zonder rechten te hebben laten bestaan en mits zij nog niet als grondslag heeft gediend voor de
      inroeping van een recht van voorrang. Indien een recht van voorrang berustend op een later ingediende aanvrage is
      ingeroepen, zal de eerst ingediende aanvrage niet meer als grondslag kunnen dienen voor de inroeping van een recht
      van voorrang.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel7
  - number: '7.4'
    text: |-
      De voorrang heeft voor de toepassing van de [artikelen 2, tweede, derde en vierde lid][ref1], en [2A][ref2] ten
      gevolge, dat de aanvrage waarvoor dit recht bestaat, wordt geacht te zijn ingediend op de dag van indiening van de
      aanvrage, waarop het recht van voorrang berust.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel2A
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0001879
        artikel: 2A
        hoofdstuk: I
  - number: '7.5'
    text: |-
      De voorrang kan niet worden geweigerd op grond van het feit, dat de aanvrager beroep doet op meer dan één recht
      van voorrang, zelfs niet wanneer de rechten van voorrang uit verschillende landen afkomstig zijn. Evenmin kan de
      voorrang worden geweigerd op grond van het feit dat datgene, waarvoor octrooi wordt gevraagd, elementen bevat,
      waarvoor in de conclusies van de aanvrage in het land van oorsprong geen rechten werden verlangd, mits de tot
      deze laatste aanvrage behorende stukken het betrokken voortbrengsel of de betrokken werkwijze voldoende nauwkeurig
      aangeven.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel7
  - number: '7.6'
    text: |-
      Hij, die van het recht van voorrang wil gebruik maken, moet daarop schriftelijk beroep doen bij de indiening van
      de aanvrage of binnen drie maanden daarna, onder vermelding van de datum van indiening van de aanvrage, waarop hij
      zich beroept, en van het land, waarin of waarvoor deze werd ingediend; binnen zestien maanden na indiening van de
      aanvrage, waarop hij zich beroept, moet hij het nummer opgeven van die aanvrage. Ten slotte moet hij de door de
      Octrooiraad vast te stellen bewijzen overleggen voor een door die Raad te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel7
  - number: '7.7'
    text: |-
      Het recht van voorrang vervalt, wanneer daarop niet bij de aanvrage of binnen drie maanden daarna beroep is gedaan,
      alsmede, wanneer de daarvoor gevorderde bewijzen niet vóór het daarvoor gestelde tijdstip worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel7
  - number: 8A.1
    text: |-
      De aanvrager kan zijn reeds ingediende aanvrage splitsen door voor een gedeelte van de inhoud daarvan
      een afzonderlijke aanvrage in te dienen. Deze aanvrage wordt, behalve voor wat de toepassing van de
      [artikelen 22, eerste lid][ref1], [22A, zesde lid][ref2], en [22C, derde lid][ref3], betreft, geacht te zijn
      ingediend op de dag van indiening van de oorspronkelijke aanvrage.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel22A
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel22C
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel8A
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '22'
        hoofdstuk: II
        afdeling: II
      - id: ref2
        bwb_id: BWBR0001879
        artikel: 22A
        hoofdstuk: II
        afdeling: II
      - id: ref3
        bwb_id: BWBR0001879
        artikel: 22C
        hoofdstuk: II
        afdeling: II
  - number: 8A.2
    text: |-
      Splitsing van een aanvrage als gevolg van een beslissing van een afdeling van de Octrooiraad, dat de aanvrage in
      strijd is met het bij of krachtens [artikel 5A][ref1] bepaalde, moet geschieden binnen drie maanden, nadat zodanige
      beslissing onherroepelijk is geworden. Splitsing van de aanvrage op eigen initiatief van de aanvrager is mogelijk
      tot uiterlijk zes maanden na de indiening van een verzoekschrift als bedoeld in [artikel 22J][ref2], en daarna met
      schriftelijke toestemming van de Octrooiraad.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel5A
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel22J
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel8A
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 5A
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0001879
        artikel: 22J
        hoofdstuk: II
        afdeling: II
  - number: '9'
    text: |-
      De aanvrager heeft geen aanspraak op octrooi, voor zover de inhoud zijner aanvrage aan hetgeen reeds door een
      ander vervaardigd of toegepast werd of wel aan beschrijvingen, tekeningen of modellen van een ander, zonder
      diens toestemming, ontleend is. Deze laatste behoudt, voor zoveel hetgeen ontleend werd voor octrooi vatbaar is,
      zijn aanspraak op octrooi. Voor de toepassing van [artikel 2, derde en vierde lid][ref1], op het onderwerp van
      een aanvrage, ingediend door degene aan wie ontleend is, blijft de door de ontlener ingediende aanvrage buiten
      beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel2
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '2'
        hoofdstuk: I
  - number: '10.1'
    text: |-
      Ingeval het voortbrengsel of de werkwijze, waarvoor octrooi wordt aangevraagd, is uitgevonden door iemand, die
      in dienst van een ander een betrekking bekleedt, welker aard medebrengt, dat hij zijn bijzondere kennis aanwende
      tot het doen van uitvindingen van dezelfde soort als die, waarop de octrooiaanvrage betrekking heeft, heeft de
      werkgever aanspraak op octrooi. Voor de toepassing van [artikel 2, derde en vierde lid](onbekend), op het onderwerp
      van een aanvrage, ingediend door de in de vorige volzin bedoelde werkgever, blijft een door de niet-gerechtigde
      ingediende aanvrage buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel10
  - number: '10.2'
    text: |-
      Ingeval de uitvinder niet geacht kan worden in het door hem genoten loon of in een bijzondere door hem te ontvangen
      uitkering vergoeding te vinden voor het gemis aan octrooi, is de werkgever verplicht, hem een in verband met het
      geldelijk belang der uitvinding en met de omstandigheden, waaronder zij plaats had, billijk bedrag toe te leggen.
      Indien de werkgever en de uitvinder omtrent dat bedrag niet tot overeenstemming kunnen komen, kunnen zij zich
      schriftelijk wenden tot de Octrooiraad met het verzoek, dat het bedrag door deze worde vastgesteld. De Octrooiraad
      voldoet aan dat verzoek. Aan zijn met redenen omklede beslissing zijn partijen gehouden. Maken de werkgever en de
      uitvinder niet van deze bevoegdheid gebruik, dan is [artikel 56][ref1] van toepassing. Elk vorderingsrecht van de
      uitvinder krachtens deze bepaling vervalt na verloop van drie jaren sedert de dagtekening van het octrooi.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel56
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '56'
        hoofdstuk: V
  - number: '10.3'
    text: Elk beding, waarbij van het in het vorige lid bepaalde wordt afgeweken, is nietig.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel10
  - number: '11'
    text: |-
      Indien een voortbrengsel of een werkwijze is uitgevonden door verscheidene personen, die volgens een afspraak
      tezamen hebben gewerkt, hebben zij gezamenlijk aanspraak op octrooi.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel11
  - number: 12A.1
    text: |-
      Hij die de uitvinding heeft gedaan, waarvoor octrooi is gevraagd, doch op grond van [artikel 10, eerste lid][ref1],
      of op grond van een overeenkomst, gesloten met de aanvrager of diens rechtsvoorgangers, geen aanspraak op octrooi
      kan doen gelden, heeft het recht in het octrooi als de uitvinder te worden vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel10
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel12A
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '10'
        hoofdstuk: I
  - number: 12A.2
    text: Elk beding, waarbij van het vorige lid wordt afgeweken, is nietig.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel12A
  - number: '13'
    text: De aanvragen om octrooi worden gericht tot, en octrooi wordt verleend door de Octrooiraad.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel13
  - number: '14.1'
    text: |-
      Er is in Nederland een Bureau voor de industriële eigendom. Het Bureau is een instelling van Nederland. Het dient,
      voor zoveel de octrooien betreft, voor het Koninkrijk als centrale bewaarplaats, als bedoeld in artikel 12 van het
      Unieverdrag tot bescherming van de industriële eigendom (*Stb.* 1948, I 539). De Octrooiraad maakt deel uit van
      het Bureau.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel14
  - number: '14.2'
    text: 'De Octrooiraad wordt verdeeld in:'
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel14
  - number: 14.2.a
    text: een centrale afdeling;
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel14
  - number: 14.2.b
    text: aanvraagafdelingen;
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel14
  - number: 14.2.c
    text: afdelingen van beroep;
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel14
  - number: 14.2.d
    text: bijzondere afdelingen.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel14
  - number: '14.3'
    text: |-
      De voorzitter, een of meer ondervoorzitters en de andere leden van de Raad worden door Ons benoemd en ontslagen.
      Alvorens hun ambt te aanvaarden legt de Voorzitter in Onze handen, en leggen de leden in handen van de Voorzitter
      een belofte af, van welke de inhoud bij algemene maatregel van bestuur wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel14
  - number: '14.4'
    text: De Voorzitter van de Octrooiraad is tevens Directeur van het Bureau.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel14
  - number: '14.5'
    text: |-
      Waar in deze Rijkswet wordt gesproken van het Bureau voor de industriële eigendom, wordt daarmede, tenzij anders
      blijkt, bedoeld het bij het eerste lid ingestelde Bureau.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel14
  - number: '15.1'
    text: |-
      De verdere inrichting en de wijze van werken van de Octrooiraad worden met inachtneming van de bepalingen van dit
      hoofdstuk bij algemene maatregel van bestuur geregeld.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel15
  - number: '15.2'
    text: 'In de in het vorige lid bedoelde algemene maatregel worden onder andere geregeld:'
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel15
  - number: 15.2.a
    text: het aantal ondervoorzitters en leden van de Octrooiraad;
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel15
  - number: 15.2.b
    text: |-
      de wijze van samenstelling en de bevoegdheid der afdelingen om werkzaamheden te verrichten, aan de Octrooiraad
      opgedragen;
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel15
  - number: 15.2.c
    text: de wijze van vervanging van de Voorzitter;
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel15
  - number: 15.2.d
    text: |-
      de wijze, waarop aanvragers, opposanten en andere belanghebbenden, zomede getuigen en deskundigen ter uitvoering
      van deze Rijkswet zullen worden opgeroepen en gehoord, en de aan deze beide laatste categorieën van personen toe te
      kennen geldelijke vergoeding;
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel15
  - number: 15.2.e
    text: |-
      ingevolge deze Rijkswet te houden registers en de wijze, waarop andere stukken dan aanvragen om octrooi in die
      registers zullen worden ingeschreven;
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel15
  - number: 15.2.f
    text: |-
      de eisen, waaraan andere stukken dan aanvragen om octrooi, welke krachtens deze Rijkswet in registers zijn in te
      schrijven hebben te voldoen;
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel15
  - number: 15.2.h
    text: de wijze, waarop van registers van de Octrooiraad door het publiek kennis kan worden genomen;
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel15
  - number: 15.2.i
    text: |-
      de tijdstippen, waarop het Bureau voor de industriële eigendom ten dienste van de uitvoering van deze Rijkswet voor
      het publiek zal zijn opengesteld.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel15
  - number: '15.3'
    text: 'Bij algemene maatregel van Rijksbestuur worden de bedragen bepaald, verschuldigd:'
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel15
  - number: 15.3.a
    text: voor de inschrijving van andere stukken dan aanvragen om octrooi;
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel15
  - number: 15.3.b
    text: voor de afgifte van afschriften of uittreksels uit de registers van de Octrooiraad;
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel15
  - number: 15.3.c
    text: voor de afgifte van een bewijs van voorrang;
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel15
  - number: 15.3.d
    text: bij verlenging van krachtens deze Rijkswet gestelde termijnen;
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel15
  - number: 15.3.e
    text: |-
      voor de afgifte van afschriften, als bedoeld in [artikel 29, onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel29
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '29'
        hoofdstuk: II
        afdeling: II
  - number: '16'
    text: |-
      De rangorde der rechten, die voortvloeien uit de inschrijving in registers van de Octrooiraad van andere stukken
      dan aanvragen om octrooi, wordt bepaald door de datum, waarop zodanig stuk bij de Octrooiraad ter inschrijving
      is ingekomen.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel16
  - number: '17.1'
    text: |-
      De Octrooiraad is bevoegd inschrijving in een register van een stuk, mits geen aanvrage om octrooi, te weigeren,
      doch alleen dan wanneer het niet voldoet aan de eisen, door of krachtens deze Rijkswet voor een stuk van die soort
      gesteld, wanneer het niet duidelijk aangeeft het octrooi, waarop het betrekking heeft, of wanneer een voorwaarde,
      door deze Rijkswet voor de inschrijving gesteld, niet is vervuld.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel17
  - number: '17.2'
    text: De gronden van de weigering worden aan hem, die de inschrijving verlangt, schriftelijk medegedeeld.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel17
  - number: '17.3'
    text: |-
      Deze kan omtrent die weigering op de bij [artikel 55][ref1] bepaalde wijze de beslissing van de rechter inroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel55
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '55'
        hoofdstuk: V
  - number: '17.4'
    text: |-
      Hij, die zich door de inschrijving in een register van een stuk, mits geen aanvrage om octrooi, bezwaard acht,
      is bevoegd op de in [artikel 55][ref1] omschreven wijze aan de rechter te verzoeken die inschrijving krachteloos
      te verklaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel55
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '55'
        hoofdstuk: V
  - number: 17A.1
    text: |-
      Indien de aanvrager of de octrooihouder dan wel de houder van een Europees octrooi, ondanks het betrachten van
      alle in de gegeven omstandigheden geboden zorgvuldigheid, niet in staat is geweest een termijn ten opzichte van het
      Bureau voor de industriële eigendom, de Octrooiraad of het bureau bedoeld in [artikel 58][ref1] in acht te nemen,
      wordt op zijn verzoek de vorige toestand hersteld, indien het niet in acht nemen van de termijn ingevolge deze
      Rijkswet rechtstreeks heeft geleid tot het verlies van enig recht of rechtsmiddel.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel58
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel17A
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '58'
        hoofdstuk: VI
  - number: 17A.2
    text: |-
      Het eerste lid is niet van toepassing op het niet indienen van de octrooiaanvrage binnen de in
      [artikel 7, eerste lid][ref1], bedoelde termijn en op het niet in acht nemen van de hierna in het derde lid
      bedoelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel7
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel17A
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '7'
        hoofdstuk: I
  - number: 17A.3
    text: |-
      Het verzoek moet zo spoedig mogelijk, doch uiterlijk binnen een jaar na afloop van de niet in acht genomen termijn,
      schriftelijk bij de Octrooiraad worden ingediend. Gelijktijdig met het verzoek moet de verzuimde handeling alsnog
      worden verricht. Het verzoekschrift moet met redenen zijn omkleed en door de verzoeker of diens schriftelijk
      gemachtigde zijn ondertekend. Indien de verzoeker niet in het Koninkrijk of indien het een Europees octrooi betreft
      binnen Nederland woont, is hij verplicht in Nederland domicilie te kiezen bij een gemachtigde. Bij de indiening van
      het verzoekschrift moet een bij algemene maatregel van Rijksbestuur te bepalen bedrag worden betaald.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel17A
  - number: 17A.4
    text: |-
      Over het verzoek beslist een daartoe samen te stellen bijzondere afdeling van de Octrooiraad, de verzoeker gehoord,
      althans behoorlijk opgeroepen. De beslissing is met redenen omkleed en wordt onverwijld door de Octrooiraad aan de
      verzoeker schriftelijk medegedeeld. Ten aanzien van zodanige beslissing is [artikel 24A][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel24A
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel17A
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 24A
        hoofdstuk: II
        afdeling: II
  - number: 17A.5
    text: |-
      De Octrooiraad tekent het herstel in de openbare registers aan en geeft daarvan kennis in het in [artikel 25][ref1]
      bedoelde blad, indien van het gevolg van het niet in acht nemen van de termijn eveneens kennis was gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel25
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel17A
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '25'
        hoofdstuk: II
        afdeling: II
  - number: 17A.6
    text: |-
      Degene, die in het tijdvak, gelegen tussen het verlies van het recht of rechtsmiddel en het herstel in de vorige
      toestand, begonnen is met de vervaardiging of toepassing binnen het Koninkrijk of, indien het een Europees octrooi
      betreft, binnen Nederland, in of voor zijn bedrijf van datgene, waarvoor tengevolge van het herstel octrooi is
      verleend of in stand is gebleven, dan wel een begin van uitvoering heeft gegeven aan zijn voornemen daartoe, blijft
      niettegenstaande het octrooi bevoegd de in [artikel 30, eerste lid][ref1], bedoelde handelingen te verrichten.
      [Artikel 32, tweede en vijfde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel32
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel17A
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '30'
        hoofdstuk: III
        afdeling: I
      - id: ref2
        bwb_id: BWBR0001879
        artikel: '32'
        hoofdstuk: III
        afdeling: I
  - number: '18.1'
    text: |-
      De Octrooiraad en zijn afdelingen zijn bevoegd getuigen en deskundigen te horen. Ieder, die als getuige is
      opgeroepen en in Nederland woonachtig is, is verplicht aan die oproeping gevolg te geven, in handen van de
      Voorzitter van de Octrooiraad of van de afdeling de eed of de belofte af te leggen, dat hij de gehele waarheid
      en niets dan de waarheid zal zeggen, en getuigenis af te leggen, behoudens verschoning in de gevallen, bedoeld
      in [artikel 191, tweede en vierde lid, van het Nederlandse Wetboek van Burgerlijke Rechtsvordering][ref1].
      De deskundigen zijn verplicht hun taak onpartijdig en naar beste weten te verrichten. De Octrooiraad en zijn
      afdelingen kunnen hun de verplichting tot geheimhouding opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel191
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '191'
  - number: '18.2'
    text: |-
      De Octrooiraad en zijn afdelingen zijn verder bevoegd de verschijning van belanghebbenden, die in Nederland
      woonachtig zijn, in persoon te gelasten.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel18
  - number: '18.3'
    text: |-
      Als centrale instantie, belast met het ontvangen van rogatoire commissies van het Europees Octrooibureau, bedoeld
      in regel 99 van het bij het Europees Octrooiverdrag behorende Uitvoeringsreglement, wordt voor Nederland aangewezen
      de Voorzitter van de Octrooiraad.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel18
  - number: '18.4'
    text: |-
      Als instanties, bevoegd tot de uitvoering van de in het derde lid bedoelde rogatoire commissies, worden aangewezen
      de Octrooiraad en zijn afdelingen. Het eerste en tweede lid zijn bij die uitvoering van toepassing.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel18
  - number: 18A
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften vastgesteld betreffende de toelating als gemachtigde
      bij de Octrooiraad, alsmede voorschriften inzake de uitoefening van het beroep van gemachtigde en het
      toezicht op de wijze van uitoefening van dat beroep. Daarbij kan de met toezicht belaste colleges de
      bevoegdheid worden verleend getuigen en deskundigen op te roepen en te horen en in Nederland woonachtige
      getuigen de verplichting worden opgelegd om te verschijnen, de daarbij omschreven eed of belofte af
      te leggen en getuigenis af te leggen, behoudens het recht van verschoning op de gronden vermeld in de
      [artikelen 217-219 van het Nederlandse Wetboek van Strafvordering][ref1]. Voorts worden voor deze gevallen
      voorschriften gegeven betreffende de oproeping van de getuigen en deskundigen en hun verhoor.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel217
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel18A
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '217'
  - number: '19'
    text: |-
      Alle stukken, gericht tot en uitgaande van de Octrooiraad, zijn vrij van zegel en van de formaliteit van
      registratie.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel19
  - number: 19A
    text: |-
      Indien het Bureau voor de industriële eigendom gedurende de laatste dag van enige ingevolge deze Rijkswet door of
      jegens de Octrooiraad in acht te nemen termijn is gesloten, wordt die termijn voor de toepassing van deze Rijkswet
      verlengd tot het einde van de eerstvolgende dag, waarop het Bureau wederom is geopend.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel19A
  - number: 19B.1
    text: |-
      De Octrooiraad treedt op als ontvangend bureau in de zin van artikel 2, onder (xv), van het Samenwerkingsverdrag en
      verricht zijn werkzaamheden uit dien hoofde met inachtneming van de bepalingen van dat Verdrag.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel19B
  - number: 19B.2
    text: |-
      Bij algemene maatregel van Rijksbestuur worden het bedrag en de vervaldatum vastgesteld van de toezendingstaks,
      bedoeld in Regel 14.1 van het bij het Samenwerkingsverdrag behorende Reglement, en het bedrag van de taks bedoeld
      in Regel 20.9 van dat Reglement. Bij algemene maatregel van bestuur kunnen voorts verdere regelen worden gesteld
      ten aanzien van onderwerpen waarover het ontvangend bureau ingevolge genoemd Reglement bevoegd is voorschriften
      te geven.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel19B
  - number: 19C
    text: |-
      De Octrooiraad treedt op als aangewezen bureau in de zin van artikel 2, onder (xiii), van het Samenwerkingsverdrag,
      indien de aanvrager ingevolge Hoofdstuk I van dat Verdrag het Koninkrijk heeft aangewezen en uit de aanvrage
      blijkt, dat hij voor het Koninkrijk een overeenkomstig deze Rijkswet verleend octrooi wenst te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel19C
  - number: 19D
    text: |-
      De Octrooiraad treedt op als gekozen bureau in de zin van artikel 2, onder (xiv), van het Samenwerkingsverdrag,
      indien het Koninkrijk door de aanvrager ingevolge Hoofdstuk II van dat Verdrag is gekozen en de Octrooiraad tevens
      als aangewezen bureau als bedoeld in [artikel 19C][ref1] optreedt.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel19C
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel19D
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 19C
        hoofdstuk: II
        afdeling: I
  - number: '20.1'
    text: |-
      De aanvrage om octrooi moet vergezeld zijn van een beschrijving van de uitvinding en evenals deze beschrijving in
      de Nederlandse taal zijn gesteld. De Octrooiraad kan op grond van bijzondere omstandigheden voor een door hem te
      bepalen termijn ontheffing verlenen van het voorschrift, dat de aanvrage en de beschrijving in de Nederlandse taal
      moeten zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel20
  - number: '20.2'
    text: |-
      Indien niet aan deze voorschriften is voldaan, worden de ingediende bescheiden niet als een aanvrage om octrooi
      beschouwd.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel20
  - number: '21'
    text: |-
      Bij de aanvrage is een bewijs over te leggen, dat een bedrag, waarvan de hoegrootheid nader bij algemene maatregel
      van Rijksbestuur wordt vastgesteld, bij het Bureau voor de industriële eigendom is gestort.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel21
  - number: 21A
    text: |-
      Eerst bij inzending van het bewijs, dat een bedrag, dat ingevolge deze Rijkswet of het [octrooireglement][ref1]
      geëist wordt, is gestort, worden de aanvrage en de andere stukken, waarvoor het bedrag verschuldigd is, geacht te
      zijn ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0001908
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel21A
    references:
      - id: ref1
        bwb_id: BWBR0001908
  - number: '22.1'
    text: |-
      Op de aanvrage wordt de datum, waarop zij bij de Octrooiraad is ingediend, alsmede een volgnummer vermeld.
      Onverwijld wordt de aanvrager een ontvangstbewijs verstrekt, vermeldende die datum en dat nummer.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22
  - number: '22.2'
    text: |-
      De aanvragen worden, in de volgorde waarin zij genummerd zijn en met aanhaling van het nummer, in een register
      ingeschreven.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22
  - number: 22A.1
    text: 'De aanvrage om octrooi moet:'
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22A
  - number: 22A.1.a
    text: de naam en de woonplaats van de aanvrager vermelden;
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22A
  - number: 22A.1.b
    text: |-
      de naam en de woonplaats vermelden van degene, die de uitvinding heeft gedaan, tenzij deze heeft verklaard op
      vermelding als uitvinder in het octrooi geen prijs te stellen;
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22A
  - number: 22A.1.c
    text: door de aanvrager of zijn schriftelijk gemachtigde zijn ondertekend;
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22A
  - number: 22A.1.d
    text: een korte aanduiding bevatten van datgene, waarop de uitvinding betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22A
  - number: 22A.1.e
    text: |-
      vergezeld zijn van een beschrijving van de uitvinding, die aan het slot in een of meer conclusies een omschrijving
      geeft van datgene, waarvoor uitsluitend recht wordt verlangd;
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22A
  - number: 22A.1.f
    text: vergezeld zijn van een uittreksel.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22A
  - number: 22A.2
    text: |-
      Het uittreksel is alleen bedoeld als technische informatie; het kan in het bijzonder niet dienen voor de
      uitlegging van de omvang van de gevraagde bescherming en voor de toepassing van [artikel 2, derde lid][ref1], en
      [artikel 51, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel51
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22A
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0001879
        artikel: '51'
        hoofdstuk: IV
  - number: 22A.3
    text: |-
      De aanvrage moet voorts, evenals de beschrijving van de uitvinding, tekeningen en het uittreksel, voldoen aan de
      overige, bij algemene maatregel van bestuur te stellen, vormvoorschriften.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22A
  - number: 22A.4
    text: |-
      Ter zake van de aanvrage moet voorts een bij algemene maatregel van Rijksbestuur te bepalen bedrag worden
      betaald voor iedere bladzijde van de beschrijving, tekeningen en het uittreksel, zoals deze met inachtneming
      van de in het eerste en derde lid bedoelde voorschriften zijn ingericht. Dit bedrag wordt, tenzij
      [artikel 22C, tweede of derde lid][ref1], toepassing vindt, teruggegeven na intrekking van de aanvrage uiterlijk
      een maand voor afloop van de in het eerste lid van dat artikel bedoelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22C
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22A
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22C
        hoofdstuk: II
        afdeling: II
  - number: 22A.5
    text: |-
      Indien de aanvrager niet in het Koninkrijk woont, is hij verplicht in Nederland domicilie te kiezen bij een
      gemachtigde, welke keuze, behoudens schriftelijk ter kennis van de Octrooiraad te brengen wijziging van het
      gekozen domicilie, wordt geacht van kracht te blijven ook na de verlening van het octrooi. Heeft die wijziging van
      domiciliekeuze plaats na de verlening van het octrooi, dan behoeft degene, bij wie domicilie gekozen wordt, geen
      gemachtigde te zijn.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22A
  - number: 22A.6
    text: |-
      Indien bij de indiening van de aanvrage niet is voldaan aan het bij of krachtens dit artikel bepaalde, geeft de
      Octrooiraad hiervan binnen een maand kennis aan de aanvrager, onder opgave van de voorschriften waaraan niet is
      voldaan. De aanvrage vervalt, indien na verloop van vijf maanden na de indiening niet alsnog, zonder enige verder
      gaande wijziging, aan de opgegeven voorschriften is voldaan.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22A
  - number: 22B.1
    text: |-
      De beschrijving van de uitvinding moet duidelijk en volledig zijn; de aan het slot daarvan gegeven omschrijving
      moet nauwkeurig zijn. De beschrijving moet zo nodig van daarmede overeenstemmende tekeningen vergezeld zijn,
      desverlangd door modellen, monsters en proefnemingen worden toegelicht, en overigens van zodanige aard zijn, dat de
      uitvinding daaruit door een deskundige kan worden begrepen en aan de hand van die beschrijving toegepast.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22B
  - number: 22B.2
    text: |-
      In het geval dat een uitvinding betreffende een microbiologische werkwijze of een door een dergelijke werkwijze
      verkregen voortbrengsel het gebruik omvat van een micro-organisme dat niet openbaar toegankelijk is en dat niet
      zodanig kan worden beschreven dat de uitvinding door een deskundige kan worden toegepast, wordt de beschrijving,
      voor zover deze dat micro-organisme betreft, nochtans aangemerkt van zodanige aard te zijn dat de uitvinding door
      een deskundige aan de hand daarvan kan worden toegepast, indien een cultuur van het micro-organisme uiterlijk op
      de dag van indiening van de aanvrage is gedeponeerd bij een bij of krachtens algemene maatregel van bestuur aan
      te wijzen instelling en indien voorts voldaan is aan bij algemene maatregel van bestuur te stellen voorschriften
      inzake identificatie en beschikbaarheid van het micro-organisme.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22B
  - number: 22B.3
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere vormvoorschriften en nadere voorschriften voor de inrichting van
      de beschrijving en tekeningen worden gegeven.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22B
  - number: 22C.1
    text: |-
      Zo spoedig mogelijk na verloop van achttien maanden na de indiening of, indien het een aanvrage betreft waarvoor
      een beroep is gedaan op een of meer rechten van voorrang, na de eerste datum van voorrang geeft de Octrooiraad
      van de aanvrage kennis in het in [artikel 25][ref1] bedoelde blad en legt hij de aanvrage met de beschrijving,
      tekeningen en het uittreksel ter inzage bij het Bureau voor de industriële eigendom.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel25
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22C
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '25'
        hoofdstuk: II
        afdeling: II
  - number: 22C.2
    text: |-
      Indien de aanvrager schriftelijk daarom verzoekt, geschieden de in het eerste lid bedoelde handelingen zo spoedig
      mogelijk na dat verzoek.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22C
  - number: 22C.3
    text: |-
      Ten aanzien van een nieuwe aanvrage als bedoeld in [artikel 8A][ref1] geschieden de in het eerste lid bedoelde
      handelingen zo spoedig mogelijk na de indiening dier aanvrage, doch niet eerder dan ten aanzien van de
      oorspronkelijke aanvrage.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel8A
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22C
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 8A
        hoofdstuk: I
  - number: 22C.4
    text: |-
      Dit artikel vindt geen toepassing, indien de Octrooiraad van oordeel is, dat het openbaar worden van het
      voortbrengsel of de werkwijze, waarvoor octrooi is gevraagd, strijdig zou zijn met de openbare orde of de goede
      zeden.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22C
  - number: 22D.1
    text: |-
      Ter zake van een aanvrage moet, zolang daarop geen octrooi is verleend, twee jaar na de indiening op de laatste dag
      der maand waarin deze heeft plaatsgevonden of ingevolge [artikel 8A][ref1] geacht wordt te hebben plaatsgevonden
      en verder elk volgend jaar op die dag een bij algemene maatregel van Rijksbestuur te bepalen bedrag bij het Bureau
      voor de industriële eigendom worden betaald. Voor een aanvrage ingediend ingevolge [artikel 8A][ref2] wordt de
      eerste betaling eerst verschuldigd na het tijdstip van werkelijke indiening. Bij betaling na de vervaldag zijn
      verhogingen verschuldigd, waarvan de hoegrootheid nader bij algemene maatregel van Rijksbestuur wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel8A
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel8A
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22D
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 8A
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0001879
        artikel: 8A
        hoofdstuk: I
  - number: 22D.2
    text: |-
      De aanvrage dan wel een inmiddels daarop verleend octrooi vervalt, wanneer de in het eerste lid bedoelde bedragen
      niet binnen zes maanden na de vervaldag zijn betaald. Betaling niet meer dan zes maanden vóór de vervaldag
      is toegelaten. De Octrooiraad tekent het verval in de openbare registers aan, geeft daarvan kennis in het
      in [artikel 25][ref1] bedoelde blad en stelt een derde, die een nog niet afgehandeld verzoek als bedoeld in
      [artikel 22I, tweede of tiende lid][ref2], of [artikel 22J, eerste lid][ref3], heeft gedaan, van het verval op
      de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel22I
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel22J
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22D
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '25'
        hoofdstuk: II
        afdeling: II
      - id: ref2
        bwb_id: BWBR0001879
        artikel: 22I
        hoofdstuk: II
        afdeling: II
      - id: ref3
        bwb_id: BWBR0001879
        artikel: 22J
        hoofdstuk: II
        afdeling: II
  - number: 22D.3
    text: |-
      Indien op de vervaldag niet is betaald, herinnert de Octrooiraad de aanvrager binnen veertien dagen schriftelijk
      aan de betaling. Indien drie maanden na de vervaldag niet is betaald, zendt de Octrooiraad een afschrift van deze
      herinneringsbrief aan allen, die blijkens in de openbare registers ingeschreven stukken ter zake van de aanvrage
      rechten hebben verkregen of rechtsvorderingen hebben ingesteld. Op het ontbreken van de herinneringsbrief kan in
      rechte geen beroep worden gedaan.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22D
  - number: 22E.1
    text: 'De intrekking van een ter inzage gelegde of openbaar gemaakte aanvrage heeft tegenover derden geen gevolg:'
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22E
  - number: 22E.1.a
    text: |-
      zolang geen vier maanden na de terinzagelegging onderscheidenlijk de openbaarmaking van de aanvrage zijn
      verstreken;
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22E
  - number: 22E.1.b
    text: |-
      zolang niet onherroepelijk is beslist op een krachtens [artikel 22G][ref1] ingediend verzoekschrift
      onderscheidenlijk een krachtens [artikel 25][ref2] ingediend en op [artikel 9][ref3], [10][ref4] of [11][ref5]
      gegrond bezwaarschrift;


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22G
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0001879#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0001879#Artikel11
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22E
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22G
        hoofdstuk: II
        afdeling: II
      - id: ref2
        bwb_id: BWBR0001879
        artikel: '25'
        hoofdstuk: II
        afdeling: II
      - id: ref3
        bwb_id: BWBR0001879
        artikel: '9'
        hoofdstuk: I
      - id: ref4
        bwb_id: BWBR0001879
        artikel: '10'
        hoofdstuk: I
      - id: ref5
        bwb_id: BWBR0001879
        artikel: '11'
        hoofdstuk: I
  - number: 22E.1.c
    text: |-
      zolang niet onherroepelijk is beslist op rechtsvorderingen ter zake van de aanvrage, die blijkens in de openbare
      registers van de Octrooiraad ingeschreven stukken zijn ingesteld.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22E
  - number: 22E.2
    text: |-
      Wanneer krachtens een onherroepelijke beslissing als bedoeld in het eerste lid, onder *b* of *c,* de aanspraak op
      octrooi toekomt of mede toekomt aan een ander dan de aanvrager, wordt de intrekking geacht niet te zijn geschied.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22E
  - number: 22E.3
    text: |-
      De Octrooiraad tekent een intrekking in de openbare registers aan en geeft daarvan kennis in het in
      [artikel 25][ref1] bedoelde blad, zodra die intrekking tegenover derden gevolg heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel25
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22E
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '25'
        hoofdstuk: II
        afdeling: II
  - number: 22F.1
    text: |-
      Een ieder kan aan de Octrooiraad schriftelijk mededeling doen van gegevens betreffende een ter inzage gelegde
      aanvrage. De Octrooiraad deelt deze gegevens mede aan de aanvrager, voor zover zij niet van deze afkomstig zijn.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22F
  - number: 22F.2
    text: |-
      Indien de in [artikel 22A, eerste lid, onder ][ref1], bedoelde vermelding van de uitvinder onjuist is, of door een
      ander dan de uitvinder is verklaard dat op vermelding als uitvinder in het octrooi geen prijs wordt gesteld, kunnen
      de aanvrager en de uitvinder gezamenlijk de Octrooiraad schriftelijk verzoeken ter zake de nodige verbeteringen
      aan te brengen. Het verzoek kan gedaan worden uiterlijk totdat de in [artikel 25, eerste lid][ref2], gestelde
      voorwaarden voor openbaarmaking zijn vervuld en dient in voorkomend geval vergezeld te zijn van de schriftelijke
      toestemming van de ten onrechte als uitvinder aangemerkte persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22A
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel25
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22F
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22A
        hoofdstuk: II
        afdeling: II
      - id: ref2
        bwb_id: BWBR0001879
        artikel: '25'
        hoofdstuk: II
        afdeling: II
  - number: 22G.1
    text: |-
      Een rechtstreeks belanghebbende als bedoeld in [artikel 9][ref1], [10][ref2] of [11][ref3] kan na de
      terinzagelegging van de aanvrage, doch uiterlijk vier maanden na de kennisgeving in het in [artikel 25][ref4]
      bedoelde blad van een verzoek als bedoeld in [artikel 22J][ref5], op grond van eerstgenoemde artikelen schriftelijk
      aan de Octrooiraad verzoeken te bepalen, dat de aanspraak op octrooi geheel of gedeeltelijk aan hem of mede aan hem
      toekomt. Bij het indienen van een daartoe strekkend verzoekschrift moet een bij algemene maatregel van Rijksbestuur
      te bepalen bedrag worden betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0001879#Artikel25
      [ref5]: https://wetten.overheid.nl/BWBR0001879#Artikel22J
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22G
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '9'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0001879
        artikel: '10'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0001879
        artikel: '11'
        hoofdstuk: I
      - id: ref4
        bwb_id: BWBR0001879
        artikel: '25'
        hoofdstuk: II
        afdeling: II
      - id: ref5
        bwb_id: BWBR0001879
        artikel: 22J
        hoofdstuk: II
        afdeling: II
  - number: 22G.2
    text: |-
      Een verzoekschrift als bedoeld in het eerste lid is met redenen omkleed en door de verzoeker of zijn schriftelijk
      gemachtigde ondertekend. Indien de verzoeker niet in het Koninkrijk woont, is hij verplicht in Nederland domicilie
      te kiezen bij een gemachtigde.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22G
  - number: 22G.3
    text: |-
      Nadat een verzoekschrift als bedoeld in het eerste lid is ingediend, kan de aanvrager de betrokken
      aanvrage niet overeenkomstig [artikel 8A, eerste lid][ref1], splitsen, wordt de termijn bedoeld in
      [artikel 8A, tweede lid, eerste volzin][ref2], voor zover nodig geschorst en wordt de behandeling ingevolge de
      [artikelen 23-24A ][ref3]van de aanvrage opgeschort, totdat de beslissing op het verzoekschrift onherroepelijk
      is geworden. Na indiening van het verzoekschrift stelt de Octrooiraad onverwijld een uit drie leden bestaande
      bijzondere afdeling samen, die het verzoekschrift in behandeling neemt. De afdeling beslist na de aanvrager en de
      verzoeker te hebben gehoord, althans behoorlijk te hebben opgeroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel8A
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel8A
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel23
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22G
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 8A
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0001879
        artikel: 8A
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0001879
        artikel: '23'
        hoofdstuk: II
        afdeling: II
  - number: 22G.4
    text: |-
      Een krachtens het derde lid te nemen beslissing is met redenen omkleed en wordt onverwijld door de Octrooiraad aan
      de aanvrager en de verzoeker schriftelijk medegedeeld. Ten aanzien van zodanige beslissing is [artikel 27][ref1]
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel27
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22G
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '27'
        hoofdstuk: II
        afdeling: II
  - number: 22G.5
    text: |-
      Indien is beslist, dat de aanspraak op octrooi aan de verzoeker of mede aan de verzoeker toekomt, treedt deze in
      zoverre in de plaats van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22G
  - number: 22H.1
    text: |-
      Indien een belanghebbende schriftelijk daarom verzoekt, kan de Octrooiraad onverwijld een voorlopig getuigenverhoor
      bevelen omtrent feiten, die van belang kunnen zijn voor een door die raad ten aanzien van een ter inzage gelegde
      aanvrage te nemen beslissing. Bij het indienen van een daartoe strekkend verzoekschrift moet een bij algemene
      maatregel van Rijksbestuur te bepalen bedrag worden betaald.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22H
  - number: 22H.2
    text: |-
      [Artikel 22G, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22G
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22H
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22G
        hoofdstuk: II
        afdeling: II
  - number: 22H.3
    text: |-
      Het verhoor vindt plaats door een bijzondere afdeling van de Octrooiraad. De verzoeker en, indien het verzoek
      is gedaan door een ander dan de aanvrager, deze aanvrager worden in de gelegenheid gesteld bij dat verhoor
      tegenwoordig te zijn.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22H
  - number: 22I.1
    text: |-
      Indien de aanvrager daarom schriftelijk verzoekt, stelt de Octrooiraad een onderzoek in naar de stand van de
      techniek betreffende hetgeen met inachtneming van het bij of krachtens [artikel 5A][ref1] bepaalde aangemerkt moet
      worden als het onderwerp van de aanvrage. Hierbij wordt rekening gehouden met de gevraagde uitsluitende rechten
      in de volgorde, waarin deze in de aanvrage voorkomen, en met de in die rechten door de aanvrager aangebrachte
      wijzigingen, voor zover deze de inhoud van de aanvrage niet wezenlijk veranderen. De Octrooiraad kan een dergelijk
      onderzoek achterwege laten, indien dit wegens onduidelijkheid van de aanvrage niet uitvoerbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel5A
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22I
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 5A
        hoofdstuk: I
  - number: 22I.2
    text: |-
      Na de terinzagelegging van de aanvrage kan ook een ander schriftelijk verzoeken een dergelijk onderzoek in
      te stellen. Het bepaalde in het eerste lid is op dit onderzoek van toepassing. Echter kan bij het onderzoek
      desgevraagd worden afgeweken van de volgorde, waarin de uitsluitende rechten in de aanvrage voorkomen. De
      verzoeker kan onder overlegging van een exploit als bedoeld in [artikel 43A, derde lid][ref1], verlangen, dat dit
      onderzoek in de eerste plaats gericht wordt op het gedeelte van de octrooiaanvrage, dat in het exploit nauwkeurig
      is aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel43A
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22I
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 43A
        hoofdstuk: III
        afdeling: III
  - number: 22I.3
    text: |-
      Op schriftelijk verzoek van de aanvrager doet de Octrooiraad de aanvrage onderwerpen aan een nieuwheidsonderzoek
      van internationaal type als bedoeld in artikel 15, vijfde lid, onder *a),* van het Samenwerkingsverdrag. Zulk een
      nieuwheidsonderzoek wordt aangemerkt als een in het eerste lid bedoeld onderzoek naar de stand van de techniek.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22I
  - number: 22I.4
    text: |-
      Bij de indiening van een verzoekschrift als bedoeld in het eerste, tweede of derde lid, moet een bij algemene
      maatregel van Rijksbestuur te bepalen bedrag worden betaald. Bij algemene maatregel van Rijksbestuur kan worden
      bepaald in welke gevallen geen bedrag verschuldigd is of betaalde bedragen worden teruggegeven.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22I
  - number: 22I.5
    text: |-
      Een verzoekschrift als bedoeld in het eerste, tweede of derde lid is door de verzoeker of zijn schriftelijk
      gemachtigde ondertekend. Indien de verzoeker niet in het Koninkrijk woont, is hij verplicht in Nederland domicilie
      te kiezen bij een gemachtigde.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22I
  - number: 22I.6
    text: |-
      De Octrooiraad geeft van een verzoekschrift als bedoeld in het tweede lid kennis aan de aanvrager. De raad geeft,
      indien of zodra de aanvrage ter inzage is gelegd, van een verzoekschrift als bedoeld in het eerste, tweede of derde
      lid kennis in het in [artikel 25][ref1] bedoelde blad.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel25
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22I
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '25'
        hoofdstuk: II
        afdeling: II
  - number: 22I.7
    text: |-
      De aanvrager is verplicht op verzoek van de Octrooiraad binnen een door deze te stellen termijn een opgave te doen
      van de dagen waarop en de landen waarin door hem een octrooiaanvrage voor dezelfde uitvinding werd ingediend, de
      Octrooiraad schriftelijk te machtigen in deze landen omtrent die aanvragen inlichtingen in te winnen en de bezwaren
      mede te delen welke, voor zover hem bekend, in die landen tegen zijn aanvrage zijn gerezen.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22I
  - number: 22I.8
    text: |-
      De Octrooiraad kan ten behoeve van het onderzoek naar de stand van de techniek het advies inwinnen van het Europees
      Octrooibureau, bedoeld in het Europees Octrooiverdrag.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22I
  - number: 22I.9
    text: |-
      De Octrooiraad deelt de aanvrager en, in het geval bedoeld in het tweede lid, eveneens degene die het
      desbetreffende verzoek heeft gedaan, schriftelijk het resultaat van het onderzoek naar de stand van de techniek
      mede of, zo dit onderzoek niet is ingesteld, de reden hiervan. Hierbij kan de Octrooiraad tevens wijzen op bezwaren
      te ontlenen aan de bepalingen van deze Rijkswet, die tegen verlening van octrooi op de aanvrage gemaakt zouden
      kunnen worden. De raad geeft, indien of zodra de aanvrage ter inzage is gelegd, van deze mededeling kennis in
      het in [artikel 25][ref1] bedoelde blad. Mocht de aanvrage na indiening van een verzoek als bedoeld in het tweede
      lid en vóór de mededeling betreffende het onderzoek worden ingetrokken, dan geeft de raad de verzoeker hiervan
      schriftelijk kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel25
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22I
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '25'
        hoofdstuk: II
        afdeling: II
  - number: 22I.10
    text: |-
      Indien de aanvrager of, na terinzagelegging van de aanvrage, een ander schriftelijk daarom verzoekt, zet de
      Octrooiraad het onderzoek voort over enig gedeelte van de aanvrage, ten aanzien waarvan het onderzoek in verband
      met het bij of krachtens [artikel 5A][ref1] bepaalde niet heeft plaats gehad of onvolledig is geweest. Bij het
      indienen van het verzoekschrift moet een bij algemene maatregel van Rijksbestuur te bepalen bedrag worden betaald.
      Het vierde lid, tweede volzin, en het vijfde, zesde, zevende, achtste en negende lid zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel5A
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22I
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 5A
        hoofdstuk: I
  - number: 22J.1
    text: |-
      Na de mededeling betreffende het onderzoek, bedoeld in [artikel 22I, negende lid][ref1], kan de aanvrager of
      een ander schriftelijk aan de Octrooiraad verzoeken een beslissing te nemen omtrent de verlening van octrooi
      op de aanvrage. Bij het indienen van een daartoe strekkend verzoekschrift moet een bij algemene maatregel van
      Rijksbestuur te bepalen bedrag worden betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22I
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22J
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22I
        hoofdstuk: II
        afdeling: II
  - number: 22J.2
    text: |-
      [Artikel 22I, vijfde en zesde lid][ref1], is van overeenkomstige toepassing. Indien het verzoek door een ander dan
      de aanvrager is gedaan en de aanvrage na indiening van dat verzoek en vóór het besluit van de aanvraagafdeling,
      bedoeld in [artikel 24][ref2], wordt ingetrokken, geeft de raad de verzoeker hiervan schriftelijk kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22I
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel24
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22J
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22I
        hoofdstuk: II
        afdeling: II
      - id: ref2
        bwb_id: BWBR0001879
        artikel: '24'
        hoofdstuk: II
        afdeling: II
  - number: 22K.1
    text: |-
      Een aanvrage vervalt, indien niet binnen één jaar na de inwerkingtreding van de [Rijksoctrooiwet 1995][ref1] een
      verzoekschrift als bedoeld in [artikel 22J][ref2] is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0007118
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel22J
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22K
    references:
      - id: ref1
        bwb_id: BWBR0007118
      - id: ref2
        bwb_id: BWBR0001879
        artikel: 22J
        hoofdstuk: II
        afdeling: II
  - number: 22K.2
    text: |-
      Ingeval ten aanzien van een aanvrage vóór het verstrijken van de in het eerste lid bedoelde termijn een verzoek
      om instelling of voortzetting van een onderzoek als bedoeld in [artikel 22I, eerste, tweede of tiende lid][ref1],
      is gedaan, doch van de in het negende lid van dat artikel bedoelde mededeling betreffende het onderzoek niet
      ten minste vier maanden vóór dat verstrijken kennis is gegeven in het in [artikel 25][ref2] bedoelde blad, wordt
      de in het eerste lid bedoelde termijn verlengd tot vier maanden na de kennisgeving in het in [artikel 25][ref3]
      bedoelde blad van die mededeling. Voor de in [afdeling III van dit hoofdstuk][ref4] bedoelde aanvragen is in
      de genoemde gevallen een verlenging van vier maanden na de dagtekening van de mededeling inzake het onderzoek,
      onderscheidenlijk het aanvullende onderzoek, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22I
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0001879#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22K
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22I
        hoofdstuk: II
        afdeling: II
      - id: ref2
        bwb_id: BWBR0001879
        artikel: '25'
        hoofdstuk: II
        afdeling: II
      - id: ref3
        bwb_id: BWBR0001879
        artikel: '25'
        hoofdstuk: II
        afdeling: II
      - id: ref4
        bwb_id: BWBR0001879
        hoofdstuk: II
        afdeling: III
  - number: 22K.3
    text: |-
      Een nieuwe aanvrage als bedoeld in [artikel 8A][ref1], die ten minste één maand vóór het verstrijken van de
      krachtens het eerste of tweede lid voor de oorspronkelijke aanvrage geldende termijn wordt ingediend, vervalt,
      indien niet binnen laatstbedoelde termijn een verzoekschrift als bedoeld in [artikel 22J][ref2] is ingediend, met
      dien verstande dat het tweede lid van overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel8A
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel22J
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22K
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 8A
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0001879
        artikel: 22J
        hoofdstuk: II
        afdeling: II
  - number: 22K.4
    text: |-
      Een nieuwe aanvrage als bedoeld in [artikel 8A][ref1], die minder dan één maand vóór het verstrijken dan wel na
      het verstrijken van de krachtens het eerste of tweede lid voor de oorspronkelijke aanvrage geldende termijn wordt
      ingediend, vervalt, indien niet binnen één maand na de indiening een verzoek om instelling van een onderzoek
      als bedoeld in [artikel 22I, eerste of tweede lid][ref2] , is gedaan en vervolgens niet binnen vier maanden na
      de kennisgeving in het in [artikel 25][ref3] bedoelde blad van de in [artikel 22I, negende lid][ref4], bedoelde
      mededeling betreffende het onderzoek een verzoekschrift als bedoeld in [artikel 22J][ref5] is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel8A
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel22I
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0001879#Artikel22I
      [ref5]: https://wetten.overheid.nl/BWBR0001879#Artikel22J
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22K
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 8A
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0001879
        artikel: 22I
        hoofdstuk: II
        afdeling: II
      - id: ref3
        bwb_id: BWBR0001879
        artikel: '25'
        hoofdstuk: II
        afdeling: II
      - id: ref4
        bwb_id: BWBR0001879
        artikel: 22I
        hoofdstuk: II
        afdeling: II
      - id: ref5
        bwb_id: BWBR0001879
        artikel: 22J
        hoofdstuk: II
        afdeling: II
  - number: 22K.5
    text: |-
      De Octrooiraad tekent het verval in de openbare registers aan en geeft daarvan kennis in het in [artikel 25][ref1]
      bedoelde blad.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel25
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel22K
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '25'
        hoofdstuk: II
        afdeling: II
  - number: '23.1'
    text: |-
      Nadat een verzoekschrift als bedoeld in [artikel 22J][ref1] is ingediend, bereidt de Octrooiraad de in het derde
      lid bedoelde behandeling van de aanvrage voor. [Artikel 22I, zevende en achtste lid][ref2], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22J
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel22I
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22J
        hoofdstuk: II
        afdeling: II
      - id: ref2
        bwb_id: BWBR0001879
        artikel: 22I
        hoofdstuk: II
        afdeling: II
  - number: '23.2'
    text: |-
      Is de Octrooiraad van oordeel, dat een aanvrage niet aan de wettelijk gestelde eisen voldoet, dan geeft hij de
      aanvrager daarvan kennis onder mededeling van de bestaande bezwaren en stelt hem in de gelegenheid tot opheffing
      daarvan, hetzij door zich schriftelijk binnen een behoorlijke termijn tegen de aangevoerde bezwaren te verweren,
      hetzij door aanvulling of verbetering van de oorspronkelijke aanvrage.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel23
  - number: '23.3'
    text: |-
      Na voltooiing van de in het eerste lid bedoelde voorbereiding stelt de Octrooiraad de aanvrage met de daarop
      betrekking hebbende stukken in handen van een door hem samen te stellen aanvraagafdeling, die de aanvrage in
      behandeling neemt.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel23
  - number: '23.4'
    text: |-
      Nadat de aanvrager door de aanvraagafdeling is gehoord, althans behoorlijk is opgeroepen, en hem zo nodig
      behoorlijk gelegenheid is gegeven haar bezwaren op te heffen, geeft zij haar beslissing zo spoedig mogelijk.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel23
  - number: '23.5'
    text: |-
      Alvorens omtrent de al of niet-openbaarmaking van de aanvrage te beslissen kan de aanvraagafdeling aan de
      Octrooiraad verzoeken een nader onderzoek als bedoeld in [artikel 22I, eerste lid][ref1], in te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22I
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22I
        hoofdstuk: II
        afdeling: II
  - number: '23.6'
    text: |-
      Indien de aanvrage in strijd is met het bij of krachtens [artikel 5A][ref1] bepaalde, wordt dit vastgesteld in een
      beslissing van de afdeling. Op verzoek van de aanvrager geschiedt dit zo spoedig mogelijk. Daartoe kan de aanvrage,
      op verzoek van de aanvrager, nog tijdens de voorbereiding in handen van een aanvraagafdeling worden gesteld. Het
      vierde lid en [artikel 24, tweede lid][ref2], zijn van overeenkomstige toepassing. Hangende de beslissing wordt
      voor het overige de behandeling van de aanvrage geschorst op verzoek van de aanvrager of indien de aanvraagafdeling
      zulks dienstig oordeelt.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel5A
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel24
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 5A
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0001879
        artikel: '24'
        hoofdstuk: II
        afdeling: II
  - number: '24.1'
    text: |-
      Indien de aanvraagafdeling van oordeel is, dat de aanvrage niet voor gehele of gedeeltelijke octrooiverlening
      in aanmerking komt, besluit zij tot niet-openbaarmaking. In het tegenovergestelde geval besluit zij tot
      openbaarmaking.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel24
  - number: '24.2'
    text: |-
      Van het besluit van de aanvraagafdeling wordt de aanvrager onverwijld kennis gegeven, onder opgave, bij niet geheel
      openbaarmaking, van de gronden waarop het besluit steunt. Indien een ander dan de aanvrager een verzoek als bedoeld
      in [artikel 22J, eerste lid][ref1], heeft ingediend, wordt ook aan hem van het besluit van de aanvraagafdeling
      onverwijld kennis gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22J
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22J
        hoofdstuk: II
        afdeling: II
  - number: 24A.1
    text: |-
      Binnen drie maanden na de eindbeslissing kan de aanvrager in beroep komen bij de Octrooiraad, door indiening van
      een met redenen omklede memorie van grieven.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel24A
  - number: 24A.2
    text: |-
      Indien een beslissing als bedoeld in [artikel 23, zesde lid][ref1], wordt genomen, voordat de eindbeslissing wordt
      genomen, kan de aanvrager van eerstbedoelde beslissing slechts afzonderlijk en wel binnen drie maanden in beroep
      komen.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel23
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel24A
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '23'
        hoofdstuk: II
        afdeling: II
  - number: 24A.3
    text: |-
      Over het beroep beslist een afdeling van beroep van de Octrooiraad, de aanvrager gehoord, althans behoorlijk
      opgeroepen. Alvorens te beslissen kan de afdeling van beroep aan de Octrooiraad verzoeken een nader onderzoek als
      bedoeld in [artikel 22I, eerste lid][ref1], in te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22I
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel24A
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22I
        hoofdstuk: II
        afdeling: II
  - number: 24A.4
    text: |-
      De leden, die betrokken zijn geweest bij het onderzoek inzake de aanvrage bedoeld in
      [artikel 22I, eerste lid][ref1], of bij de in [artikel 23, eerste lid][ref2], bedoelde voorbereiding van de
      behandeling van de aanvrage dan wel deel hebben uitgemaakt van de aanvraagafdeling, mogen geen deel uitmaken van de
      in het vorige lid bedoelde afdeling van beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22I
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel23
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel24A
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22I
        hoofdstuk: II
        afdeling: II
      - id: ref2
        bwb_id: BWBR0001879
        artikel: '23'
        hoofdstuk: II
        afdeling: II
  - number: 24A.5
    text: |-
      Van een besluit van een afdeling van beroep wordt de aanvrager onverwijld kennis gegeven onder opgave van de
      gronden waarop het besluit steunt.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel24A
  - number: '25.1'
    text: |-
      De Octrooiraad maakt een aanvrage openbaar, indien geen beroep meer openstaat of de aanvrager van zijn recht
      van beroep afstand heeft gedaan en zodra door de aanvrager een bewijs is overgelegd, dat een bedrag, waarvan de
      hoegrootheid nader bij algemene maatregel van Rijksbestuur wordt vastgesteld, bij het Bureau voor de industriële
      eigendom is gestort, door vermelding van de daartoe strekkende besluiten in een door dat Bureau uit te geven
      blad. Binnen veertien dagen na de verschijning van dit blad doet de raad van de openbaarmaking van de aanvrage
      onder doorlopend nummer aantekening in een daartoe bestemd openbaar register. De aanvrage wordt geacht te
      zijn ingetrokken, indien het bewijs van storting niet is overgelegd, na een besluit tot openbaarmaking van een
      aanvraagafdeling, op de dag dat het besluit in gewijsde gaat, of na een dergelijk besluit van een afdeling van
      beroep, binnen één maand na dat besluit.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel25
  - number: '25.2'
    text: |-
      Tegelijk met de verschijning van het blad, waarin het besluit tot openbaarmaking is vermeld, geeft de Octrooiraad
      de bij de aanvrage behorende beschrijving en tekeningen uit in de vorm waarin tot openbaarmaking is besloten.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel25
  - number: '25.3'
    text: |-
      Binnen een termijn van vier maanden na de dagtekening van het in het eerste lid bedoelde blad kan door een ieder
      tegen de verlening van het aangevraagde octrooi bezwaar worden gemaakt door inzending bij de Octrooiraad van een
      met redenen omkleed bezwaarschrift, dat duidelijk naam en woonplaats van hem, door wie bezwaar wordt gemaakt, moet
      vermelden, en door deze of diens schriftelijk gemachtigde ondertekend moet zijn. De gemachtigde vertegenwoordigt de
      opposant voor de gehele behandeling van het bezwaarschrift, behoudens vervanging of herroeping. Indien de opposant
      niet in het Koninkrijk woont, is hij verplicht in Nederland domicilie te kiezen bij een gemachtigde. De bezwaren
      moeten gegrond zijn op de bepalingen dezer Rijkswet en kunnen, voor zover zij een rechtstreeks belanghebbende als
      bedoeld in [artikel 9][ref1], [10][ref2] en [11][ref3] betreffen, slechts door deze worden ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel11
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '9'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0001879
        artikel: '10'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0001879
        artikel: '11'
        hoofdstuk: I
  - number: '25.4'
    text: |-
      Hij die ingevolge [artikel 12A][ref1] het recht heeft in het octrooi als de uitvinder te worden vermeld, kan de
      Octrooiraad schriftelijk verzoeken, hetzij dat hij in het te verlenen octrooi als de uitvinder wordt vermeld,
      hetzij dat de in de openbaar gemaakte aanvrage opgenomen vermelding van een persoon als de uitvinder wordt
      verbeterd of weggelaten in het te verlenen octrooi. Het vorige lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel12A
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 12A
        hoofdstuk: I
  - number: '26.1'
    text: |-
      Zijn bezwaar- of verzoekschriften als bedoeld in [artikel 25][ref1] of [32][ref2] ingekomen, dan worden deze
      gesteld in handen van de aanvraagafdeling, die over de openbaarmaking heeft geoordeeld. De aanvraagafdeling
      wordt tot drie leden aangevuld, indien zij uit één lid bestond. Deze afdeling beslist na afloop van de in
      [artikel 25, derde lid][ref3], bedoelde termijn en na aanvrager, opposanten en verzoekers gehoord of althans
      behoorlijk opgeroepen te hebben, omtrent de gehele of gedeeltelijke verlening van het octrooi en over de verzoeken.
      Indien in een verzoekschrift, als bedoeld in [artikel 25, vierde lid][ref4], wordt verzocht de in de openbaar
      gemaakte aanvrage opgenomen vermelding van een persoon als de uitvinder in het te verlenen octrooi te verbeteren of
      weg te laten, beslist de aanvraagafdeling niet dan na ook degene, die als de uitvinder is vermeld, gehoord, althans
      behoorlijk opgeroepen te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0001879#Artikel25
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '25'
        hoofdstuk: II
        afdeling: II
      - id: ref2
        bwb_id: BWBR0001879
        artikel: '32'
        hoofdstuk: III
        afdeling: I
      - id: ref3
        bwb_id: BWBR0001879
        artikel: '25'
        hoofdstuk: II
        afdeling: II
      - id: ref4
        bwb_id: BWBR0001879
        artikel: '25'
        hoofdstuk: II
        afdeling: II
  - number: '26.2'
    text: |-
      Indien tegen de verlening van een octrooi bezwaar is gemaakt op grond, dat de opposant aanspraak heeft op
      octrooi overeenkomstig [artikel 9][ref1] of [artikel 10][ref2], of aanspraak heeft op een aandeel in het octrooi
      overeenkomstig [artikel 11][ref3], hetzij voor de gehele inhoud der oorspronkelijke aanvrage, hetzij voor zodanig
      deel als vatbaar is voor een zelfstandig octrooi, kan de afdeling treden in een onderzoek van dat bezwaar; bevindt
      zij dit gegrond, zo verleent zij het aangevraagde octrooi geheel of gedeeltelijk aan de opposant, of kent zij
      hem het aandeel in het octrooi toe, waarop hij aanspraak heeft, een en ander voor zover de opposant het verlangen
      daartoe vóór de beslissing aan de Octrooiraad heeft kenbaar gemaakt. Deze beslissing staat een vordering krachtens
      [artikel 53][ref4] niet in de weg.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0001879#Artikel53
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '9'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0001879
        artikel: '10'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0001879
        artikel: '11'
        hoofdstuk: I
      - id: ref4
        bwb_id: BWBR0001879
        artikel: '53'
        hoofdstuk: IV
  - number: '26.3'
    text: |-
      Het door de afdeling genomen besluit, dat met redenen moet zijn omkleed, wordt onverwijld aan de aanvrager, de
      opposanten en de verzoekers schriftelijk medegedeeld.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel26
  - number: '26.4'
    text: |-
      Zijn in de in [artikel 25, derde lid][ref1], bedoelde termijn geen bezwaar- of verzoekschriften als bedoeld in
      [artikel 25][ref2] of [32][ref3] ingekomen, dan wordt het octrooi geacht te zijn verleend in de vorm, waarin de
      aanvrage is openbaar gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel32
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '25'
        hoofdstuk: II
        afdeling: II
      - id: ref2
        bwb_id: BWBR0001879
        artikel: '25'
        hoofdstuk: II
        afdeling: II
      - id: ref3
        bwb_id: BWBR0001879
        artikel: '32'
        hoofdstuk: III
        afdeling: I
  - number: '27.1'
    text: |-
      Binnen drie maanden na de eindbeslissing kunnen de aanvrager, de opposanten, de verzoekers en degene, die als de
      uitvinder in de openbaar gemaakte aanvrage vermeld is, in beroep komen door indiening bij de Octrooiraad van een
      met redenen omklede en door hen of hun schriftelijk gemachtigde ondertekende memorie van grieven.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel27
  - number: '27.2'
    text: |-
      Over het beroep beslist, de aanvrager, de opposanten, de verzoekers en degene, die als de uitvinder in de openbaar
      gemaakte aanvrage vermeld is, gehoord, althans behoorlijk opgeroepen, een afdeling van beroep van de Octrooiraad.
      Omtrent de samenstelling en het besluit dier afdeling geldt hetgeen in [artikel 24A][ref1] is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel24A
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 24A
        hoofdstuk: II
        afdeling: II
  - number: '28.1'
    text: |-
      Het octrooi, verleend op een openbaar gemaakte aanvrage, verkrijgt als dagtekening en begint, onverminderd het
      bepaalde bij [artikel 44][ref1], te werken de dag na die, waarop de in [artikel 25, derde lid][ref2], bedoelde
      termijn is verlopen, zonder dat bezwaar- of verzoekschriften zijn ingediend, of, zo die wel zijn ingediend, de
      dag na die, waarop de in [artikel 27][ref3] bedoelde termijn is verlopen, zonder dat beroep is ingesteld, van het
      instellen van beroep door alle daartoe bevoegden is afstand gedaan of wel na ingesteld beroep de dag na die, waarop
      het octrooi door een afdeling van beroep is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel27
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '44'
        hoofdstuk: III
        afdeling: III
      - id: ref2
        bwb_id: BWBR0001879
        artikel: '25'
        hoofdstuk: II
        afdeling: II
      - id: ref3
        bwb_id: BWBR0001879
        artikel: '27'
        hoofdstuk: II
        afdeling: II
  - number: '28.2'
    text: |-
      Binnen veertien dagen na die dag doet de Octrooiraad van de verlening van het octrooi aantekening in het in
      [artikel 25, eerste lid][ref1], bedoelde register en maakt hij daarvan zodra mogelijk melding in het in die
      bepaling bedoelde blad. Tegelijk met de verschijning van het blad geeft de raad de bij de aanvrage behorende
      beschrijving en tekeningen in de vorm, waarin daarop octrooi is verleend, bij wege van octrooischrift uit.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel25
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '25'
        hoofdstuk: II
        afdeling: II
  - number: '28.3'
    text: |-
      Binnen veertien dagen na de dagtekening van het in het vorige lid bedoelde blad wordt door de Octrooiraad aan hem,
      wie octrooi is verleend, een bewijs van zijn recht verstrekt.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel28
  - number: '28.4'
    text: |-
      Van de afwijzing van een aanvrage doet de Octrooiraad, nadat daartegen geen beroep meer openstaat of wel tot
      afwijzing door de raad na ingesteld beroep is besloten, eveneens binnen veertien dagen aantekening in het in
      [artikel 25, eerste lid][ref1], bedoelde register en maakt de raad zodra mogelijk melding in het in die bepaling
      bedoelde blad.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel25
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '25'
        hoofdstuk: II
        afdeling: II
  - number: 28A.1
    text: |-
      Na de terinzagelegging van de aanvrage of, indien deze eerder plaatsvindt, na de openbaarmaking overeenkomstig
      [artikel 25][ref1] van de aanvrage kan een ieder desverlangd kennis nemen van alle op de aanvrage of het daarop
      verleende octrooi betrekking hebbende stukken die de Octrooiraad hebben bereikt of die de raad aan de aanvrager of
      aan derden heeft doen uitgaan in het kader van de bepalingen van deze Rijkswet.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel25
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel28A
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '25'
        hoofdstuk: II
        afdeling: II
  - number: 28A.2
    text: |-
      Van stukken als in het eerste lid bedoeld, die betrekking hebben op een aanvrage die nog niet ter inzage is
      gelegd, kan alleen met toestemming van de aanvrager kennis worden genomen. Zonder toestemming van de aanvrager
      kan daarvan nochtans kennis worden genomen, indien de betrokkene aantoont dat de aanvrager zich tegenover
      hem heeft beroepen op zijn aanvrage. Het in de vorige volzinnen bepaalde geldt niet ten aanzien van de in
      [afdeling III van dit hoofdstuk][ref1] bedoelde octrooiaanvragen.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel28A
    references:
      - id: ref1
        bwb_id: BWBR0001879
        hoofdstuk: II
        afdeling: III
  - number: 28A.3
    text: |-
      Geen kennis kan worden genomen van de verklaring, bedoeld in [artikel 22A, eerste lid, onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22A
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel28A
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22A
        hoofdstuk: II
        afdeling: II
  - number: '29'
    text: |-
      Nadere voorschriften ter uitvoering van de bepalingen van deze en de volgende afdelingen worden bij algemene
      maatregel van bestuur vastgesteld; bij die maatregel worden onder andere geregeld:
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29
  - number: 29.a
    text: de eisen, waaraan de aanvragen en de daarbij te voegen stukken hebben te voldoen;
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29
  - number: 29.c
    text: |-
      de wijze, waarop de aanvragen krachtens [artikel 22][ref1] in de registers van de Octrooiraad zullen worden
      ingeschreven;


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '22'
        hoofdstuk: II
        afdeling: II
  - number: 29.d
    text: |-
      de naam, de vorm en de wijze van uitgifte van het in [artikel 25][ref1] bedoelde blad;


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel25
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '25'
        hoofdstuk: II
        afdeling: II
  - number: 29.e
    text: |-
      de kennisgeving van de aanvrage en de terinzagelegging daarvan met bijbehorende bescheiden krachtens
      [artikel 22C][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22C
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22C
        hoofdstuk: II
        afdeling: II
  - number: 29.f
    text: |-
      de vorm der in deze Rijkswet bedoelde verzoekschriften, bezwaarschriften en memories van grieven, de wijze, waarop
      de belanghebbenden met deze in kennis worden gesteld, en de vorm van het in [artikel 28, derde lid][ref1], bedoelde
      bewijs;


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel28
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '28'
        hoofdstuk: II
        afdeling: II
  - number: 29.h
    text: |-
      in welke gevallen van de indiening of de terinzagelegging van andere bescheiden dan de aanvragen aantekening
      geschiedt in de openbare registers van de Octrooiraad;
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29
  - number: 29.i
    text: van welke bij de aanvrage ter inzage gelegde bescheiden afschriften algemeen verkrijgbaar worden gesteld.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29
  - number: 29A.1
    text: |-
      Indien de Octrooiraad van oordeel is, dat het geheim blijven van de inhoud van een octrooiaanvrage in het belang
      van de verdediging van het Koninkrijk of zijn bondgenoten kan zijn, geeft hij hiervan zo spoedig mogelijk, doch
      uiterlijk vijf maanden na de indiening der aanvrage kennis aan de aanvrager. Onze Minister van Defensie kan
      ten aanzien van de beoordeling van de vraag, of zodanig belang aanwezig kan zijn, aanwijzingen geven aan de
      Octrooiraad.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29A
  - number: 29A.2
    text: |-
      Tegelijk met de kennisgeving zendt de Octrooiraad afschrift van die kennisgeving en van de tot de aanvrage
      behorende beschrijving en tekeningen aan Onze genoemde Minister.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29A
  - number: 29A.3
    text: Ingeval het eerste lid toepassing vindt, worden de terinzagelegging en openbaarmaking van de aanvrage opgeschort.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29A
  - number: 29B.1
    text: |-
      Binnen acht maanden na de indiening van een octrooiaanvrage als bedoeld in [artikel 29A][ref1] deelt Onze Minister
      van Defensie aan de Octrooiraad mede, of de inhoud van de aanvrage in het belang van de verdediging van het
      Koninkrijk of zijn bondgenoten geheim moet blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel29A
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29B
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 29A
        hoofdstuk: II
        afdeling: III
  - number: 29B.2
    text: |-
      Een mededeling krachtens het eerste lid in bevestigende zin heeft tot gevolg, dat terinzagelegging en
      openbaarmaking van de aanvrage blijven opgeschort tot drie jaren na die mededeling. Een mededeling in ontkennende
      zin heeft tot gevolg, dat de opschorting eindigt. Het uitblijven van enige mededeling wordt met een mededeling in
      ontkennende zin gelijk gesteld.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29B
  - number: 29B.3
    text: |-
      Onze genoemde Minister kan de termijn van opschorting binnen zes maanden vóór het verstrijken daarvan telkenmale
      met drie jaren verlengen door aan de Octrooiraad mede te delen, dat de inhoud der aanvrage in het belang van de
      verdediging van het Koninkrijk of zijn bondgenoten geheim moet blijven.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29B
  - number: 29B.4
    text: |-
      Onze genoemde Minister kan te allen tijde aan de Octrooiraad mededelen, dat de inhoud van de aanvrage niet langer
      geheim behoeft te blijven. Zodanige mededeling heeft tot gevolg, dat de opschorting eindigt.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29B
  - number: 29B.5
    text: |-
      Van een mededeling krachtens het eerste, derde of vierde lid geeft de Octrooiraad onverwijld kennis aan de
      aanvrager. Hij stelt deze eveneens onverwijld in kennis van het uitblijven van een mededeling als bedoeld in het
      eerste of derde lid.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29B
  - number: 29B.6
    text: |-
      Zolang de opschorting niet is geëindigd, zendt de Octrooiraad op verzoek van Onze genoemde Minister aan deze
      afschrift van alle terzake tussen die Raad en de aanvrager gewisselde stukken.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29B
  - number: 29B.7
    text: |-
      Indien de opschorting eindigt, geschieden niettemin de terinzagelegging en openbaarmaking van de aanvrage, tenzij
      op verzoek van de aanvrager, niet voordat drie maanden zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29B
  - number: 29C.1
    text: |-
      De Staat verleent degene, ten aanzien van wiens octrooiaanvrage [artikel 29A][ref1] of [artikel 29G][ref2]
      is toegepast, op zijn verzoek vergoeding van schade, die hij door toepassing van de [artikelen 29A][ref3] en
      [29B][ref4] dan wel van [artikel 29G][ref5] heeft geleden.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel29A
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel29G
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel29A
      [ref4]: https://wetten.overheid.nl/BWBR0001879#Artikel29B
      [ref5]: https://wetten.overheid.nl/BWBR0001879#Artikel29G
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29C
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 29A
        hoofdstuk: II
        afdeling: III
      - id: ref2
        bwb_id: BWBR0001879
        artikel: 29G
        hoofdstuk: II
        afdeling: III
      - id: ref3
        bwb_id: BWBR0001879
        artikel: 29A
        hoofdstuk: II
        afdeling: III
      - id: ref4
        bwb_id: BWBR0001879
        artikel: 29B
        hoofdstuk: II
        afdeling: III
      - id: ref5
        bwb_id: BWBR0001879
        artikel: 29G
        hoofdstuk: II
        afdeling: III
  - number: 29C.2
    text: |-
      Het bedrag der schadeloosstelling wordt vastgesteld na het eindigen van de opschorting. Ingeval echter verlenging
      van de termijn van opschorting krachtens [artikel 29B, derde lid][ref1], heeft plaatsgevonden, wordt het bedrag
      der schadeloosstelling op verzoek van de aanvrager vastgesteld in gedeelten, waarvan het eerste betrekking heeft
      op de tijdsruimte vóór de aanvang van de eerste verlenging, de volgende op de tijdsruimte tussen twee opeenvolgende
      verlengingen en het laatste op de tijdsruimte vanaf de aanvang van de laatste verlenging tot het eindigen van de
      opschorting; de vaststelling geschiedt dan telkens na het verstrijken van de betrokken tijdsruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel29B
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29C
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 29B
        hoofdstuk: II
        afdeling: III
  - number: 29C.3
    text: |-
      De vaststelling geschiedt zo mogelijk door Onze Minister van Defensie en de aanvrager in onderling overleg. Indien
      binnen zes maanden na het einde van de tijdsruimte, waarvoor de vergoeding moet gelden, geen overeenstemming is
      bereikt, is [artikel 34, negende lid][ref1], met uitzondering van het omtrent het stellen van zekerheid bepaalde,
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel34
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29C
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '34'
        hoofdstuk: III
        afdeling: I
  - number: 29D.1
    text: |-
      Indien een aanvrager verzoekt de inhoud van een octrooiaanvrage geheim te houden in het belang van de verdediging
      van een andere staat, dan wel de regering van die staat zodanig verzoek doet, zendt de Octrooiraad, mits de
      aanvrager schriftelijk heeft verklaard afstand te doen van alle vergoeding van schade, die hij door toepassing
      van dit artikel zou kunnen lijden, onverwijld afschrift van dat verzoek en van de tot de aanvrage behorende
      beschrijving en tekeningen, alsmede van bedoelde afstandsverklaring, aan Onze Minister van Defensie. In dat geval
      worden de terinzagelegging en openbaarmaking van de aanvrage opgeschort. Ingeval een afstandsverklaring ontbreekt,
      stelt de Octrooiraad Onze genoemde Minister onverwijld van een en ander in kennis.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29D
  - number: 29D.2
    text: |-
      Binnen drie maanden na de indiening van het verzoek kan Onze genoemde Minister, mits hem is gebleken, dat aan
      de aanvrager ook door de betrokken staat geheimhouding is opgelegd en dat deze van die staat toestemming heeft
      verkregen een aanvrage onder geheimhouding in te dienen, aan de Octrooiraad mededelen, dat de inhoud der aanvrage
      in het belang van de verdediging van die staat geheim moet blijven.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29D
  - number: 29D.3
    text: |-
      Een mededeling krachtens het tweede lid heeft tot gevolg, dat terinzagelegging en openbaarmaking van de aanvrage
      blijven opgeschort, totdat Onze genoemde Minister de Octrooiraad mededeelt, dat de inhoud der aanvrage niet
      langer geheim behoeft te blijven. Het uitblijven van eerstbedoelde mededeling heeft tot gevolg, dat de opschorting
      eindigt.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29D
  - number: 29D.4
    text: |-
      [Artikel 29B, zesde en zevende lid][ref1], zijn ten aanzien van een aanvrage als in het eerste lid bedoeld van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel29B
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29D
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 29B
        hoofdstuk: II
        afdeling: III
  - number: 29E.1
    text: |-
      Ingeval Onze Minister van Defensie van oordeel is, dat het belang van de verdediging van het Koninkrijk vordert,
      dat de Staat datgene, waarvoor octrooi wordt aangevraagd in een aanvrage, waarop [artikel 29A][ref1], [29B][ref2]
      of [29D][ref3] is toegepast, gebruikt, toepast dan wel doet gebruiken of toepassen, kan hij daartoe overgaan na
      een desbetreffende mededeling aan de aanvrager. In deze mededeling worden de handelingen, die de Staat moet kunnen
      verrichten of doen verrichten, nauwkeurig omschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel29A
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel29B
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel29D
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29E
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 29A
        hoofdstuk: II
        afdeling: III
      - id: ref2
        bwb_id: BWBR0001879
        artikel: 29B
        hoofdstuk: II
        afdeling: III
      - id: ref3
        bwb_id: BWBR0001879
        artikel: 29D
        hoofdstuk: II
        afdeling: III
  - number: 29E.2
    text: De Staat betaalt de aanvrager een vergoeding voor het gebruik of de toepassing krachtens het eerste lid.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29E
  - number: 29E.3
    text: |-
      Het bedrag van deze vergoeding wordt zo mogelijk door Onze genoemde Minister en de aanvrager in onderling overleg
      vastgesteld. Indien binnen zes maanden na de in het eerste lid bedoelde mededeling geen overeenstemming is bereikt,
      is [artikel 34, negende lid][ref1], met uitzondering van het omtrent het stellen van zekerheid bepaalde, van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel34
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29E
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '34'
        hoofdstuk: III
        afdeling: I
  - number: 29F
    text: |-
      Indien de Staat zelf houder van een octrooiaanvrage is en Onze Minister van Defensie aan de Octrooiraad mededeelt,
      dat de inhoud daarvan in het belang van de verdediging van het Koninkrijk of zijn bondgenoten geheim moet blijven,
      worden de terinzagelegging en openbaarmaking der aanvrage opgeschort, totdat Onze genoemde Minister aan de
      Octrooiraad mededeelt, dat de inhoud der aanvrage niet langer geheim behoeft te blijven.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29F
  - number: 29G.1
    text: |-
      Een Europese octrooiaanvrage, waarvan de inhoud - naar de aanvrager weet of redelijkerwijs moet vermoeden - in het
      belang van de verdediging van het Koninkrijk of zijn bondgenoten geheim moet blijven, moet worden ingediend bij
      de Octrooiraad.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29G
  - number: 29G.2
    text: |-
      De Octrooiraad zendt onverwijld afschrift van de tot de aanvrage behorende beschrijving en tekeningen aan Onze
      Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29G
  - number: 29G.3
    text: |-
      Uiterlijk drie weken voor het verstrijken van de termijn, bedoeld in [artikel 77, derde lid, van het Europees
      Octrooiverdrag](onbekend), deelt Onze genoemde Minister aan de Octrooiraad mede, of de inhoud van de aanvrage in
      het belang van de verdediging van het Koninkrijk of zijn bondgenoten geheim moet blijven.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29G
  - number: 29G.4
    text: |-
      Indien een mededeling krachtens het derde lid in ontkennende zin is gedaan of indien een mededeling is uitgebleven
      zendt de Octrooiraad de Europese octrooiaanvrage, met inachtneming van de in artikel 77, derde lid, van het
      Europees Octrooiverdrag bedoelde termijn, door aan het Europees Octrooibureau, bedoeld in dat Verdrag.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29G
  - number: 29G.5
    text: |-
      De Octrooiraad geeft van enige mededeling krachtens het derde lid of van het uitblijven daarvan onverwijld kennis
      aan de aanvrager.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29G
  - number: 29H.1
    text: |-
      Een Europese octrooiaanvrage, die voldoet aan het bepaalde in artikel 80 van het Europees Octrooiverdrag en op
      grond van [artikel 77, vijfde lid](onbekend), of [artikel 162, vierde lid, van dat Verdrag](onbekend) wordt geacht
      te zijn ingetrokken en die, als bijlage bij een regelmatig verzoek tot omzetting in een aanvrage om octrooi in
      het Koninkrijk, bij de Octrooiraad is binnengekomen, hierna te noemen omgezette aanvrage, geldt als een tot die
      raad gerichte en bij die raad ingediende aanvrage om octrooi als bedoeld in [artikel 1A][ref1]. Een verzoek tot
      omzetting is regelmatig als het met inachtneming van de bepalingen van het [Achtste Deel, hoofdstuk I, van het
      Europees Octrooiverdrag](onbekend) tijdig gedaan en aan de Octrooiraad doorgezonden is.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel1A
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29H
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 1A
        hoofdstuk: I
  - number: 29H.2
    text: |-
      De omgezette aanvrage wordt geacht bij de Octrooiraad te zijn ingediend op de datum van indiening, die zij
      ingevolge [artikel 80 van het Europees Octrooiverdrag](onbekend) met inachtneming van de [artikelen 61](onbekend)
      of [76 van dat Verdrag](onbekend) bezit.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29H
  - number: 29I.1
    text: |-
      De [artikelen 20][ref1], [21A][ref2], [22, eerste lid, eerste volzin][ref3], en [22A, zesde lid][ref4], zijn op de
      omgezette aanvrage niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel21A
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0001879#Artikel22A
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29I
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '20'
        hoofdstuk: II
        afdeling: II
      - id: ref2
        bwb_id: BWBR0001879
        artikel: 21A
        hoofdstuk: II
        afdeling: II
      - id: ref3
        bwb_id: BWBR0001879
        artikel: '22'
        hoofdstuk: II
        afdeling: II
      - id: ref4
        bwb_id: BWBR0001879
        artikel: 22A
        hoofdstuk: II
        afdeling: II
  - number: 29I.2
    text: |-
      Op de omgezette aanvrage wordt de datum, waarop zij bij de Octrooiraad is binnengekomen, alsmede een volgnummer
      vermeld.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29I
  - number: 29I.3
    text: |-
      Voor de omgezette aanvrage moet het in [artikel 21][ref1] bedoelde bewijs van betaling worden overgelegd binnen een
      termijn van drie maanden na de in het tweede lid bedoelde datum van binnenkomst. Indien de Europese octrooiaanvrage
      niet in het Nederlands is ingediend moet binnen dezelfde termijn een vertaling in het Nederlands van de
      oorspronkelijke stukken van die aanvrage worden overgelegd. De vertaling maakt deel uit van de omgezette aanvrage;
      zij moet op verzoek van de Octrooiraad binnen een door die Raad te stellen termijn worden gewaarmerkt. De aanvrage
      vervalt, indien niet tijdig is voldaan aan het in dit lid bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel21
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29I
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '21'
        hoofdstuk: II
        afdeling: II
  - number: 29I.4
    text: |-
      Op de omgezette aanvrage zijn de bij of krachtens [artikel 22A][ref1] gestelde vormvoorschriften niet van
      toepassing indien en voor zover zij afwijken van of een aanvulling betekenen op het bij of krachtens het Europees
      Octrooiverdrag bepaalde; in dat geval zijn laatstbedoelde bepalingen op de omgezette aanvrage van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22A
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29I
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22A
        hoofdstuk: II
        afdeling: II
  - number: 29I.5
    text: |-
      Zodra de aanvrager heeft voldaan aan het in het derde lid bepaalde gaat de Octrooiraad, met inachtneming van de
      inhoud van het vierde lid, na of de aanvrage voldoet aan het bij of krachtens [artikel 22A][ref1] bepaalde en
      geeft, indien dat niet het geval is, hiervan zo spoedig mogelijk kennis aan de aanvrager, onder opgave van de
      voorschriften waaraan niet is voldaan. De aanvrage vervalt indien niet binnen vier maanden na dagtekening van deze
      kennisgeving alsnog, zonder enige verdergaande wijziging, aan de opgegeven voorschriften is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22A
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29I
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22A
        hoofdstuk: II
        afdeling: II
  - number: 29I.6
    text: |-
      De in [artikel 22C][ref1] bedoelde kennisgeving en terinzagelegging geschieden zo spoedig mogelijk, doch niet
      eerder dan nadat is vastgesteld, dat aan het bij of krachtens [artikel 22A][ref2] bepaalde is voldaan of een
      verzuim op dit punt tijdig is hersteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22C
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel22A
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29I
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22C
        hoofdstuk: II
        afdeling: II
      - id: ref2
        bwb_id: BWBR0001879
        artikel: 22A
        hoofdstuk: II
        afdeling: II
  - number: 29I.7
    text: |-
      De in [artikel 22D, eerste lid][ref1], bedoelde bedragen welke vervallen voor afloop van vier maanden na de datum
      van binnenkomst van de omgezette aanvrage, behoeven niet te worden betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22D
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29I
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22D
        hoofdstuk: II
        afdeling: II
  - number: 29J.1
    text: |-
      Een internationale aanvrage, die een dagtekening van internationaal depot als bedoeld in artikel 11 van het
      Samenwerkingsverdrag heeft verkregen en de Octrooiraad heeft bereikt op de wijze en binnen de termijn als is
      aangegeven in [artikel 22][ref1] of, in voorkomend geval, artikel 39 van het Samenwerkingsverdrag, geldt als een
      tot die raad gerichte en bij die raad ingediende aanvrage om octrooi als bedoeld in [artikel 1A][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel1A
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29J
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '22'
        hoofdstuk: II
        afdeling: II
      - id: ref2
        bwb_id: BWBR0001879
        artikel: 1A
        hoofdstuk: I
  - number: 29J.2
    text: |-
      Een aanvrage als in het eerste lid bedoeld wordt geacht bij de Octrooiraad te zijn ingediend op de dag, aangewezen
      door de dagtekening van het internationale depot als bedoeld in artikel 11 van het Samenwerkingsverdrag.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29J
  - number: 29K.1
    text: |-
      De [artikelen 20][ref1], [21A][ref2], [22, eerste lid, eerste volzin][ref3], en [22A, zesde lid][ref4], zijn op de
      internationale aanvrage niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel21A
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0001879#Artikel22A
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29K
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '20'
        hoofdstuk: II
        afdeling: II
      - id: ref2
        bwb_id: BWBR0001879
        artikel: 21A
        hoofdstuk: II
        afdeling: II
      - id: ref3
        bwb_id: BWBR0001879
        artikel: '22'
        hoofdstuk: II
        afdeling: II
      - id: ref4
        bwb_id: BWBR0001879
        artikel: 22A
        hoofdstuk: II
        afdeling: II
  - number: 29K.2
    text: |-
      Op de internationale aanvrage wordt de datum, waarop de in de artikelen 20 en 22 of 39 van het Samenwerkingsverdrag
      bedoelde stukken bij de Octrooiraad zijn binnengekomen, alsmede een volgnummer vermeld.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29K
  - number: 29K.3
    text: |-
      Voor de internationale aanvrage moet het in [artikel 21][ref1] bedoelde bewijs van betaling worden overgelegd
      binnen de termijn bedoeld in [artikel 22, eerste en tweede lid][ref2], of, in voorkomend geval, artikel 39,
      eerste lid, van het Samenwerkingsverdrag. Binnen dezelfde termijn moet een vertaling in het Nederlands van die
      aanvrage worden overgelegd. De vertaling maakt deel uit van de internationale aanvrage; zij moet op verzoek van de
      Octrooiraad binnen een door die Raad te stellen termijn worden gewaarmerkt. De aanvrage vervalt, indien niet tijdig
      aan het in dit lid bepaalde is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel22
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29K
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '21'
        hoofdstuk: II
        afdeling: II
      - id: ref2
        bwb_id: BWBR0001879
        artikel: '22'
        hoofdstuk: II
        afdeling: II
  - number: 29K.4
    text: |-
      De Octrooiraad gaat zo spoedig mogelijk na, tenzij hem is gebleken dat de aanvrage reeds is komen te vervallen
      uit hoofde van artikel 24 of 39, tweede lid, van het Samenwerkingsverdrag, of is voldaan aan het bij of krachtens
      [artikel 22A, vierde en vijfde lid][ref1], bepaalde. Indien hieraan niet is voldaan geeft hij hiervan zo spoedig
      mogelijk kennis aan de aanvrager, onder opgave van de voorschriften waaraan niet is voldaan. De aanvrage vervalt,
      indien niet binnen vier maanden na dagtekening van deze kennisgeving alsnog aan de opgegeven voorschriften is
      voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22A
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29K
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22A
        hoofdstuk: II
        afdeling: II
  - number: 29K.5
    text: |-
      De in [artikel 22C][ref1] bedoelde kennisgeving en terinzagelegging geschieden zo spoedig mogelijk, doch niet
      eerder dan nadat is vastgesteld dat aan het bij of krachtens [artikel 22A, vierde en vijfde lid][ref2], bepaalde is
      voldaan of een verzuim op dit punt tijdig is hersteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22C
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel22A
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29K
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22C
        hoofdstuk: II
        afdeling: II
      - id: ref2
        bwb_id: BWBR0001879
        artikel: 22A
        hoofdstuk: II
        afdeling: II
  - number: 29K.6
    text: |-
      Indien een in [artikel 22I, eerste, tweede of tiende lid][ref1], bedoeld verzoek wordt gedaan, zal het door de
      Octrooiraad in te stellen onderzoek als aanvulling dienen op het in artikel 18 van het Samenwerkingsverdrag bedoelde
      verslag. Bij algemene maatregel van Rijksbestuur kan worden bepaald wanneer en in hoeverre zulk een aanvullend
      onderzoek achterwege blijft, alsmede wanneer en in hoeverre het in [artikel 22I, vierde of tiende lid][ref2],
      bedoelde bedrag wordt verminderd. De in[ artikel 22I, negende lid][ref3], bedoelde mededeling noemt in voorkomend
      geval de hoogte van het terug te betalen bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22I
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel22I
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel22I
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29K
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22I
        hoofdstuk: II
        afdeling: II
      - id: ref2
        bwb_id: BWBR0001879
        artikel: 22I
        hoofdstuk: II
        afdeling: II
      - id: ref3
        bwb_id: BWBR0001879
        artikel: 22I
        hoofdstuk: II
        afdeling: II
  - number: 29L.1
    text: |-
      Beslissingen, die de Octrooiraad als aangewezen bureau uit hoofde van artikel 25, tweede lid, van het
      Samenwerkingsverdrag moet treffen, worden genomen door een bijzondere afdeling van de Octrooiraad nadat deze de
      aanvrager heeft gehoord, althans behoorlijk heeft opgeroepen.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29L
  - number: 29L.2
    text: |-
      De in het eerste lid bedoelde beslissingen zijn met redenen omkleed en worden onverwijld door de Octrooiraad aan de
      aanvrager medegedeeld. Ten aanzien van deze beslissingen is [artikel 24A][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel24A
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29L
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 24A
        hoofdstuk: II
        afdeling: II
  - number: 29L.3
    text: |-
      Indien is beslist, dat de dagtekening van het internationale depot ten onrechte is geweigerd of de aanvrage ten
      onrechte als ingetrokken is beschouwd, geldt de aanvrage als een uit hoofde van deze Rijkswet ingediende aanvrage.
      De [artikelen 29J][ref1] en [29K][ref2] zijn op een zodanige aanvrage niet van toepassing. De aanvrage wordt
      geacht bij de Octrooiraad te zijn ingediend op de dag, aangewezen door de dagtekening van het internationale depot,
      die had moeten worden toegekend of is toegekend; voor de toepassing van de [artikelen 22, eerste lid][ref3], en
      [22A, zesde lid][ref4], wordt echter in aanmerking genomen de dag, waarop de in artikel 25, eerste en tweede lid,
      van het Samenwerkingsverdrag bedoelde stukken zijn ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel29J
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel29K
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0001879#Artikel22A
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29L
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 29J
        hoofdstuk: II
        afdeling: V
      - id: ref2
        bwb_id: BWBR0001879
        artikel: 29K
        hoofdstuk: II
        afdeling: V
      - id: ref3
        bwb_id: BWBR0001879
        artikel: '22'
        hoofdstuk: II
        afdeling: II
      - id: ref4
        bwb_id: BWBR0001879
        artikel: 22A
        hoofdstuk: II
        afdeling: II
  - number: 29M.1
    text: |-
      Met inachtneming van het in deze Rijkswet bepaalde hebben Europese octrooien vanaf de dag, dat overeenkomstig
      [artikel 97, vierde lid, van het Europees Octrooiverdrag](onbekend) de vermelding van de verlening is gepubliceerd,
      in Nederland dezelfde rechtsgevolgen en zijn zij aan hetzelfde recht onderworpen als de overeenkomstig deze
      Rijkswet verleende octrooien.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29M
  - number: 29M.2
    text: |-
      Voor de toepassing van de [artikelen 32, eerste lid][ref1], [34, vierde lid][ref2], [47][ref3] en [52][ref4] op
      Europese octrooien wordt als dag van indiening aangemerkt de datum van indiening, die de Europese octrooiaanvrage,
      die tot het betrokken Europees octrooi heeft geleid, ingevolge [artikel 80 van het Europees Octrooiverdrag]
      (onbekend) met inachtneming van de [artikelen 61](onbekend) of [76 van dat Verdrag](onbekend) bezit.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel47
      [ref4]: https://wetten.overheid.nl/BWBR0001879#Artikel52
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29M
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '32'
        hoofdstuk: III
        afdeling: I
      - id: ref2
        bwb_id: BWBR0001879
        artikel: '34'
        hoofdstuk: III
        afdeling: I
      - id: ref3
        bwb_id: BWBR0001879
        artikel: '47'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0001879
        artikel: '52'
        hoofdstuk: IV
  - number: 29N.1
    text: |-
      De Octrooiraad doet van de overeenkomstig [artikel 97, vierde lid, van het Europees Octrooiverdrag](onbekend)
      bedoelde publikatie van de vermelding dat een Europees octrooi is verleend onverwijld aantekening in het in
      [artikel 25, eerste lid][ref1], bedoelde register en maakt daarvan melding in het in die bepaling bedoelde blad.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel25
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29N
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '25'
        hoofdstuk: II
        afdeling: II
  - number: 29N.2
    text: |-
      De Octrooiraad doet in het in het vorige lid bedoelde register onverwijld aantekening van het instellen van
      oppositie tegen een Europees octrooi, met vermelding van de datum waarop dit geschiedde, en van beslissingen van
      het Europees Octrooibureau ter zake van een oppositie. Hij maakt daarvan melding in het in het vorige lid bedoelde
      blad.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29N
  - number: 29O
    text: |-
      De houder van een Europees octrooi, die niet in Nederland woont, is verplicht hier te lande domicilie te
      kiezen en daarvan schriftelijk mededeling te doen aan de Octrooiraad, welke keuze van kracht blijft, behoudens
      schriftelijk ter kennis van de Octrooiraad te brengen wijziging van het gekozen domicilie. Indien ten tijde
      van de in [artikel 29N, eerste lid][ref1], bedoelde aantekening in het openbare register niet aan de hiervoren
      omschreven verplichting is voldaan, geeft de Octrooiraad hiervan binnen veertien dagen kennis aan de octrooihouder
      onder vermelding van de datum waarop deze aantekening is gedaan. Het octrooi vervalt indien na verloop van
      drie maanden na deze datum niet alsnog aan de in de eerste volzin omschreven verplichting is voldaan. De
      Octrooiraad doet van dit verval aantekening in het eerder bedoelde register en maakt daarvan melding in het in
      [artikel 25, eerste lid][ref2], bedoelde blad.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel29N
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel25
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29O
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 29N
        hoofdstuk: IIA
      - id: ref2
        bwb_id: BWBR0001879
        artikel: '25'
        hoofdstuk: II
        afdeling: II
  - number: 29P.1
    text: |-
      Degene aan wie een Europees octrooi is verleend moet binnen een bij algemene maatregel van bestuur te bepalen
      termijn aan de Octrooiraad een vertaling in het Nederlands van de tekst van het octrooischrift doen toekomen.
      Tevens dient een bedrag te worden betaald, waarvan de hoegrootheid en de termijn, waarbinnen betaling moet
      geschieden, bij algemene maatregel van bestuur worden bepaald. De vertaling moet zijn gewaarmerkt door een
      octrooigemachtigde, die als zodanig is toegelaten op de voet van [artikel 18A][ref1]. De vertaling en de
      waarmerking daarvan moeten voldoen aan bij algemene maatregel van bestuur te stellen vormvoorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel18A
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29P
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 18A
        hoofdstuk: II
        afdeling: I
  - number: 29P.2
    text: |-
      Indien bij ontvangst binnen de in het eerste lid bedoelde termijn naar het oordeel van de Octrooiraad niet is
      voldaan aan de in de laatste volzin van dat lid bedoelde vormvoorschriften, geeft hij hiervan onverwijld kennis
      aan de octrooihouder onder opgave van de voorschriften waaraan niet is voldaan en van de termijn waarbinnen de
      geconstateerde gebreken kunnen worden opgeheven.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29P
  - number: 29P.3
    text: |-
      Onverwijld na ontvangst in behoorlijke vorm van de vertaling doet de Octrooiraad daarvan aantekening in het in
      [artikel 25, eerste lid][ref1], bedoelde register en maakt daarvan melding in het in dat lid bedoelde blad.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel25
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29P
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '25'
        hoofdstuk: II
        afdeling: II
  - number: 29P.4
    text: |-
      Het Europees octrooi wordt geacht van de aanvang af niet de in [artikel 29M][ref1] bedoelde rechtsgevolgen te
      hebben gehad, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel29M
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29P
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 29M
        hoofdstuk: IIA
  - number: 29P.4.a
    text: |-
      binnen de in het eerste lid bedoelde termijnen de vertaling niet door de Octrooiraad is ontvangen onderscheidenlijk
      het krachtens dat lid verschuldigde bedrag niet is betaald, of
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29P
  - number: 29P.4.b
    text: binnen de in het tweede lid bedoelde termijn niet alsnog aan de opgegeven voorschriften is voldaan.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29P
  - number: 29P.5
    text: |-
      Indien het Europees octrooi ingevolge het vierde lid wordt geacht van de aanvang af niet de in [artikel 29M][ref1]
      bedoelde rechtsgevolgen te hebben gehad, doet de Octrooiraad onverwijld daarvan aantekening in het in het derde lid
      bedoelde register en maakt daarvan melding in het in dat lid bedoelde blad.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel29M
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29P
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 29M
        hoofdstuk: IIA
  - number: 29P.6
    text: |-
      De vorige leden vinden overeenkomstige toepassing, indien in het Europees octrooi tijdens de oppositieprocedure
      wijziging is gekomen.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29P
  - number: 29P.7
    text: |-
      De octrooihouder kan te allen tijde de Octrooiraad een verbeterde vertaling doen toekomen onder betaling van een
      bedrag, waarvan de hoegrootheid bij algemene maatregel van bestuur wordt bepaald. Het eerste lid, derde en vierde
      volzin, het tweede en het derde lid vinden overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29P
  - number: 29P.8
    text: |-
      [Artikel 28A, eerste lid][ref1], is van overeenkomstige toepassing op stukken betreffende het Europees octrooi.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel28A
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel29P
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 28A
        hoofdstuk: II
        afdeling: II
  - number: '30.1'
    text: |-
      Een octrooi geeft de octrooihouder behoudens de bepalingen der [artikelen 31-34B][ref1] het uitsluitend recht:


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel31
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '31'
        hoofdstuk: III
        afdeling: I
  - number: 30.1.a
    text: |-
      het geoctrooieerde voortbrengsel in of voor zijn bedrijf te vervaardigen, te gebruiken, in het verkeer te brengen
      of verder te verkopen, te verhuren, af te leveren of anderszins te verhandelen, dan wel voor een of ander aan te
      bieden, in te voeren of in voorraad te hebben;
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel30
  - number: 30.1.b
    text: |-
      de geoctrooieerde werkwijze in of voor zijn bedrijf toe te passen of het voortbrengsel, dat rechtstreeks
      verkregen is door toepassing van die werkwijze, behalve voor zover het een voortbrengsel betreft dat ingevolge
      [artikel 3, tweede lid][ref1], van octrooiverlening is uitgesloten, in of voor zijn bedrijf te gebruiken, in het
      verkeer te brengen of verder te verkopen, te verhuren, af te leveren of anderszins te verhandelen, dan wel voor een
      of ander aan te bieden, in te voeren of in voorraad te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel3
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '3'
        hoofdstuk: I
  - number: '30.2'
    text: |-
      Het uitsluitend recht wordt bepaald door de inhoud van de conclusies van het octrooischrift, waarbij de
      beschrijving en de tekeningen dienen tot uitleg van die conclusies.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel30
  - number: '30.3'
    text: |-
      Het uitsluitend recht strekt zich niet uit over handelingen, uitsluitend dienende tot onderzoek van het
      geoctrooieerde, daaronder begrepen het door toepassing van de geoctrooieerde werkwijze rechtstreeks verkregen
      voortbrengsel.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel30
  - number: '30.4'
    text: |-
      Is een voortbrengsel, als in het eerste lid, onder *a* of *b,* bedoeld, in het Koninkrijk of, indien het een
      Europees octrooi betreft, in Nederland rechtmatig in het verkeer gebracht, dan handelt de verkrijger of latere
      houder niet in strijd met het octrooi, door dit voortbrengsel in of voor zijn bedrijf te gebruiken, te verkopen,
      te verhuren, af te leveren of anderszins te verhandelen, dan wel voor een of ander aan te bieden, in te voeren of
      in voorraad te hebben. Een voortbrengsel, als in het eerste lid, onder *a* of *b,* bedoeld, dat voor de dag van
      openbaarmaking overeenkomstig [artikel 25][ref1] van de aanvrage, welke tot het octrooi heeft geleid, of, indien
      het een Europees octrooi betreft, voor de dag, waarop overeenkomstig [artikel 97, vierde lid, van het Europees
      Octrooiverdrag ](onbekend)de vermelding van de verlening van het Europees octrooi is gepubliceerd, in een bedrijf
      is vervaardigd, mag niettegenstaande het octrooi ten dienste van dat bedrijf worden gebruikt of blijven gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel25
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '25'
        hoofdstuk: II
        afdeling: II
  - number: 30A.1
    text: |-
      Een Europees octrooi wordt geacht van de aanvang af geheel of gedeeltelijk niet de in de [artikelen 30][ref1],
      [43B][ref2] en [44A][ref3] bedoelde rechtsgevolgen te hebben gehad naar gelang het octrooi geheel of gedeeltelijk
      is herroepen tijdens een oppositieprocedure.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel43B
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel44A
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel30A
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '30'
        hoofdstuk: III
        afdeling: I
      - id: ref2
        bwb_id: BWBR0001879
        artikel: 43B
        hoofdstuk: III
        afdeling: III
      - id: ref3
        bwb_id: BWBR0001879
        artikel: 44A
        hoofdstuk: III
        afdeling: III
  - number: 30A.2
    text: 'De terugwerkende kracht van de herroeping heeft geen invloed op:'
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel30A
  - number: 30A.2.a
    text: |-
      een beslissing ter zake van handelingen in strijd met het in [artikel 30][ref1] bedoelde uitsluitend recht van de
      octrooihouder of van handelingen als bedoeld in [de artikelen 43B][ref2] en [44A][ref3], die voor de herroeping in
      kracht van gewijsde is gegaan en ten uitvoer is gelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel43B
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel44A
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel30A
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '30'
        hoofdstuk: III
        afdeling: I
      - id: ref2
        bwb_id: BWBR0001879
        artikel: 43B
        hoofdstuk: III
        afdeling: III
      - id: ref3
        bwb_id: BWBR0001879
        artikel: 44A
        hoofdstuk: III
        afdeling: III
  - number: 30A.2.b
    text: |-
      een voor de herroeping gesloten overeenkomst, voor zover deze voor de herroeping is uitgevoerd; uit
      billijkheidsoverwegingen kan echter terugbetaling worden geëist van op grond van deze overeenkomst betaalde
      bedragen, en wel in de mate als door de omstandigheden gerechtvaardigd is.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel30A
  - number: 30A.3
    text: |-
      Voor de toepassing van het tweede lid, onder *b*, wordt onder het sluiten van een overeenkomst mede verstaan het
      ontstaan van een licentie op een andere in [artikel 33, tweede lid][ref1], [34A][ref2] of [34B][ref3] aangegeven
      wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel34A
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel34B
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel30A
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '33'
        hoofdstuk: III
        afdeling: I
      - id: ref2
        bwb_id: BWBR0001879
        artikel: 34A
        hoofdstuk: III
        afdeling: I
      - id: ref3
        bwb_id: BWBR0001879
        artikel: 34B
        hoofdstuk: III
        afdeling: I
  - number: '31'
    text: 'Het uitsluitend recht van de octrooihouder strekt zich niet uit tot:'
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel31
  - number: 31.a
    text: |-
      het gebruik, aan boord van schepen van andere landen, van datgene, wat het voorwerp van zijn octrooi uitmaakt,
      in het schip zelve, in de machines, het scheepswant, de tuigage en andere bijbehorende zaken, wanneer die
      schepen tijdelijk of bij toeval in de wateren van het Koninkrijk verblijven, onder voorbehoud dat bedoeld gebruik
      uitsluitend zal zijn ten behoeve van het schip;
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel31
  - number: 31.b
    text: |-
      het gebruik van datgene, wat het voorwerp van zijn octrooi uitmaakt, in de constructie of werking van voor de
      voortbeweging in de lucht of te land dienende machines van andere landen, of van het toebehoren der machines,
      wanneer deze tijdelijk of bij toeval in het Koninkrijk verblijven;
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel31
  - number: 31.c
    text: |-
      handelingen vermeld in artikel 27 van het op 7 december 1944 te Chicago tot stand gekomen Verdrag inzake de
      internationale burgerlijke luchtvaart (*Stb.* 1947, H 165), mits deze handelingen betrekking hebben op een
      luchtvaartuig van een onder *c* van dat artikel bedoelde andere staat dan het Koninkrijk.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel31
  - number: '32.1'
    text: |-
      Hij, die datgene waarvoor door een ander octrooi is gevraagd, binnen het Koninkrijk of, indien het een Europees
      octrooi betreft, in Nederland reeds in of voor zijn bedrijf vervaardigde of toepaste of aan zijn voornemen
      tot zodanige vervaardiging of toepassing een begin van uitvoering had gegeven op de dag van indiening van die
      aanvrage of, indien de aanvrager een recht van voorrang geniet ingevolge [artikel 7, eerste lid][ref1], dan
      wel ingevolge [artikel 87 van het Europees Octrooiverdrag](onbekend), op de dag van indiening van de aanvrage,
      waarop het recht van voorrang berust, blijft niettegenstaande het octrooi, als voorgebruiker bevoegd de in
      [artikel 30, eerste lid][ref2], bedoelde handelingen te verrichten, tenzij hij zijn wetenschap ontleend heeft aan
      hetgeen reeds door de octrooiaanvrager vervaardigd of toegepast werd, of wel aan beschrijvingen, tekeningen of
      modellen van de octrooiaanvrager.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel30
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '7'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0001879
        artikel: '30'
        hoofdstuk: III
        afdeling: I
  - number: '32.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van dat deel van het aan Nederland, de Nederlandse
      Antillen of Aruba grenzende - of, indien het een Europees octrooi betreft, van het aan Nederland grenzende
        - continentaal plat, waarop het Koninkrijk soevereine rechten heeft, doch uitsluitend voor wat betreft
      handelingen, gericht op en verricht tijdens het onderzoek naar de aanwezigheid van natuurlijke rijkdommen als in
      [artikel 44B][ref1] bedoeld of het winnen daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel44B
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 44B
        hoofdstuk: III
        afdeling: III
  - number: '32.3'
    text: |-
      Binnen de in [artikel 25, derde lid][ref1], bedoelde termijn of, indien het een Europees octrooi betreft, binnen
      de in [artikel 99, eerste lid, van het Europees Octrooiverdrag](onbekend) bedoelde termijn kan degene, die meent
      voorgebruiker te zijn, de Octrooiraad verzoeken omtrent de feitelijke handelingen, op grond waarvan hem de in
      het eerste lid bedoelde bevoegdheid zou toekomen, een verklaring te verstrekken. Indien de bedoelde handelingen
      ten genoegen van de Octrooiraad zijn aangetoond, verstrekt de Raad hem die verklaring. Hierdoor staan de daarin
      vermelde feitelijke handelingen vast, tenzij het tegendeel bewezen wordt. Van het verstrekken van zodanige
      verklaring wordt in de openbare registers van de Octrooiraad aantekening gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel25
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '25'
        hoofdstuk: II
        afdeling: II
  - number: '32.4'
    text: |-
      Een verzoek tot verkrijging van een verklaring, als in het vorig lid bedoeld, moet met redenen zijn omkleed,
      duidelijk naam en woonplaats van de verzoeker vermelden en door deze of diens schriftelijk gemachtigde ondertekend
      zijn. De gemachtigde, die voldoen moet aan de voorwaarden, bij algemene maatregel van bestuur voor de toelating als
      zodanig te stellen, vertegenwoordigt de verzoeker voor de gehele behandeling van het verzoek behoudens vervanging
      of herroeping. Indien de verzoeker niet in het Koninkrijk woont, is hij verplicht in Nederland domicilie te kiezen
      bij een gemachtigde.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel32
  - number: '32.5'
    text: Het recht in het eerste lid bedoeld gaat alleen met het bedrijf op anderen over.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel32
  - number: '33.1'
    text: |-
      Door een licentie wordt van de octrooihouder de bevoegdheid verkregen, handelingen te verrichten, die volgens
      [artikel 30][ref1] aan anderen dan hem niet vrijstaan. Die bevoegdheid strekt zich uit tot alle in bedoeld artikel
      vermelde handelingen en geldt voor de gehele duur van het octrooi, tenzij bij de verlening der licentie een minder
      omvangrijk recht is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel30
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '30'
        hoofdstuk: III
        afdeling: I
  - number: '33.2'
    text: |-
      Een licentie ontstaat door een overeenkomst, door een aanvaarde uiterste wilsbeschikking of, overeenkomstig
      [artikel 34][ref1], door een besluit van Onze Minister van Economische Zaken of van de Octrooiraad. De door een
      overeenkomst of aanvaarde wilsbeschikking ontstane licentie is tegenover derden geldig, nadat de titel in de
      openbare registers van de Octrooiraad is ingeschreven. Voor de inschrijving is een bij algemene maatregel van
      Rijksbestuur vast te stellen bedrag verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel34
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '34'
        hoofdstuk: III
        afdeling: I
  - number: '33.3'
    text: |-
      Zo het recht op een vergoeding voor een licentie ingevolge de bepalingen van [artikel 51, achtste lid][ref1], of
      [artikel 53, vierde lid][ref2], op een ander overgaat, wordt door de nieuwe rechthebbenden aanspraak verkregen
      op een deel van de in het geheel voor de licentie betaalde en te betalen vergoeding in verhouding tot de tijd,
      gedurende welke de licentie in normale omstandigheden nog van kracht moet blijven. Is hetgeen de licentiehouder
      nog moet betalen niet voldoende om de nieuwe rechthebbende te verschaffen wat hem toekomt, dan heeft deze voor het
      ontbrekende verhaal op de vroegere.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel53
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '51'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0001879
        artikel: '53'
        hoofdstuk: IV
  - number: '34.1'
    text: |-
      Onze Minister van Economische Zaken kan, indien het algemeen belang dit naar zijn oordeel vordert, van een octrooi
      een licentie van een door hem nauwkeurig omschreven inhoud aan een door hem aangewezen persoon verlenen. Alvorens
      zijn besluit te nemen onderzoekt Onze Minister, tenzij de te dezen vereiste spoed zich daartegen verzet, of de
      octrooihouder bereid is de licentie onder redelijke voorwaarden vrijwillig te verlenen. Hij stelt daartoe de
      octrooihouder in de gelegenheid schriftelijk en, zo deze dit verzoekt, ook mondeling van zijn gevoelen te doen
      blijken. Het besluit vermeldt de gronden waarop het berust en wordt aan de octrooihouder bij aangetekende brief
      toegezonden. Bij zijn besluit kan Onze Minister de verkrijger van de licentie het stellen van zekerheid binnen
      een bepaalde termijn opleggen. Tegen het besluit staat voor de octrooihouder binnen een maand na de verzending
      beroep op Ons open. Het beroep heeft schorsende werking, tenzij het besluit van Onze Minister op grond van de te
      dezen vereiste spoed anders bepaalt; wordt in laatstbedoeld geval het besluit in beroep geheel of gedeeltelijk
      vernietigd, dan worden daarbij tevens de gevolgen geregeld.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel34
  - number: '34.2'
    text: |-
      Indien noch de octrooihouder, noch een ander krachtens een hem verleende licentie na verloop van drie jaren
      na de dagtekening van het octrooi in het Koninkrijk of in een andere, bij algemene maatregel van Rijksbestuur
      aangewezen staat in werking heeft een inrichting van nijverheid, waarin te goeder trouw in voldoende mate het
      betrokken voortbrengsel wordt vervaardigd of de betrokken werkwijze wordt toegepast, is de octrooihouder verplicht
      de voor het in werking hebben van zodanige inrichting nodige licentie te verlenen, tenzij geldige redenen voor
      het ontbreken van zodanige inrichting blijken te bestaan. Voor de houder van een Europees octrooi ontstaat deze
      verplichting, indien niet na verloop van drie jaren na de dag, dat overeenkomstig [artikel 97, vierde lid, van het
      Europees Octrooiverdrag](onbekend) de vermelding van de verlening van het Europees octrooi is gepubliceerd, een
      inrichting van nijverheid als hiervoor bedoeld in werking is in Nederland of in een andere, bij algemene maatregel
      van Rijksbestuur aangewezen staat.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel34
  - number: '34.3'
    text: |-
      Het tweede lid is niet van toepassing, indien de octrooihouder of een ander krachtens een hem verleende licentie
      in dat deel van het aan Nederland, de Nederlandse Antillen of Aruba grenzende - of, indien het een Europees octrooi
      betreft, van het aan Nederland grenzende - continentaal plat, waarop het Koninkrijk soevereine rechten heeft, in
      werking heeft een inrichting van nijverheid, waarin te goeder trouw in voldoende mate handelingen als in dat lid
      bedoeld worden verricht, mits die handelingen zijn gericht op en worden verricht tijdens het onderzoek naar de
      aanwezigheid van natuurlijke rijkdommen als in [artikel 44B][ref1] bedoeld of het winnen daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel44B
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 44B
        hoofdstuk: III
        afdeling: III
  - number: '34.4'
    text: |-
      De octrooihouder is te allen tijde verplicht de licentie te verlenen welke nodig mocht zijn voor de toepassing
      van een octrooi verleend op een aanvrage met een gelijke of latere dag van indiening of, indien voor de aanvrage
      een recht van voorrang bestaat, voorrangsdatum; de octrooihouder is evenwel tot verlening van een licentie
      welke nodig mocht zijn voor de toepassing van een Europees octrooi eerst verplicht nadat de voor het instellen
      van oppositie tegen het Europees octrooi gestelde termijn is verstreken of een ingestelde oppositieprocedure
      is afgesloten. Een zodanige licentie strekt zich niet verder uit dan noodzakelijk is voor de toepassing van het
      octrooi van verkrijger. Deze is verplicht aan de houder van het andere octrooi wederkerig licentie van zijn octrooi
      te verlenen.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel34
  - number: '34.5'
    text: |-
      De licentie bedoeld in het tweede of vierde lid wordt op verzoek van de belanghebbende door de Octrooiraad
      verleend, zo dit college meent, dat aan de verplichting tot het verlenen daarvan niet is voldaan. Het verzoek
      tot het verlenen van een licentie als bedoeld in de eerste volzin van het vierde lid kan ook worden gedaan door
      de houder van een ingevolge [artikel 25, eerste lid][ref1], openbaar gemaakte octrooiaanvrage, of door de houder
      van een Europees octrooi, voordat de voor het instellen van oppositie tegen het Europees octrooi gestelde termijn
      is verstreken of een ingestelde oppositieprocedure is afgesloten. De houder van het octrooi, waarvan licentie
      wordt verzocht, kan het verzoek tot het wederkerig verlenen van een licentie als bedoeld in de laatste volzin van
      het vierde lid reeds indienen vanaf het ogenblik, waarop het verzoek tot het verlenen van een licentie van zijn
      eigen octrooi is gedaan. Op deze verzoeken is het bepaalde in [artikel 32, vierde lid][ref2], van overeenkomstige
      toepassing. Zij worden in de openbare registers van de Octrooiraad ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel32
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '25'
        hoofdstuk: II
        afdeling: II
      - id: ref2
        bwb_id: BWBR0001879
        artikel: '32'
        hoofdstuk: III
        afdeling: I
  - number: '34.6'
    text: |-
      Een verzoek als bedoeld in het voorgaande lid wordt in eerste instantie behandeld door een bijzondere afdeling.
      Deze afdeling beslist na partijen te hebben gehoord, althans behoorlijk te hebben opgeroepen. Indien het verzoek
      tot het verlenen van een licentie als bedoeld in de eerste volzin van het vierde lid overeenkomstig de tweede
      volzin van het vijfde lid is ingediend en tevens tegen de betrokken aanvrage een bezwaar- of verzoekschrift
      als bedoeld in [artikel 25][ref1] of [32 ][ref2]of tegen het betrokken Europees octrooi een verzoekschrift
      als bedoeld in [artikel 32][ref3] is ingekomen, zal de behandeling van het verzoek en van de genoemde bezwaar-
      of verzoekschriften en van een verzoek tot het wederkerig verlenen van een licentie als bedoeld in de laatste
      volzin van het vierde lid, voor zover mogelijk in verband met het tijdstip van indiening van bedoelde verzoeken,
      gezamenlijk plaatsvinden door de bijzondere afdeling. Een op grond van de eerste volzin van het vierde lid
      verzochte licentie kan niet worden verleend alvorens op de aanvrage van de verzoeker octrooi is verleend; indien
      de licentie nodig mocht zijn voor de toepassing van een Europees octrooi kan zij niet worden verleend alvorens
      de voor het instellen van oppositie tegen het Europees octrooi gestelde termijn is verstreken of een ingestelde
      oppositieprocedure is afgesloten. [Artikel 27][ref4] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel32
      [ref4]: https://wetten.overheid.nl/BWBR0001879#Artikel27
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '25'
        hoofdstuk: II
        afdeling: II
      - id: ref2
        bwb_id: BWBR0001879
        artikel: '32'
        hoofdstuk: III
        afdeling: I
      - id: ref3
        bwb_id: BWBR0001879
        artikel: '32'
        hoofdstuk: III
        afdeling: I
      - id: ref4
        bwb_id: BWBR0001879
        artikel: '27'
        hoofdstuk: II
        afdeling: II
  - number: '34.7'
    text: |-
      In het met redenen omklede besluit van de Octrooiraad wordt de verleende licentie nauwkeurig omschreven, bij welke
      omschrijving van hetgeen gevraagd wordt kan worden afgeweken. Bij zijn besluit kan de Octrooiraad de verkrijger
      van de licentie het stellen van zekerheid binnen een bepaalde termijn opleggen. Een op grond van het tweede lid
      verleende licentie zal niet-uitsluitend zijn en zal niet kunnen worden overgedragen, zelfs niet door middel van
      de verlening van onder-licenties, dan te zamen met het gedeelte van de onderneming, waarin deze licentie wordt
      uitgeoefend. Een op grond van het vierde lid, eerste of derde volzin, verleende licentie vervalt niet doordat het
      octrooi, ten behoeve waarvan de licentie is verleend, als gevolg van het verstrijken van de in [artikel 47][ref1]
      bedoelde termijn is geëindigd, dan wel doordat het octrooi geheel of gedeeltelijk is nietig verklaard of met goed
      gevolg is opgeëist. Een op grond van het vierde lid, laatste volzin, ten behoeve van een Europees octrooi verleende
      wederkerige licentie vervalt niet doordat dit octrooi is herroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel47
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '47'
        hoofdstuk: IV
  - number: '34.8'
    text: |-
      Een besluit als bedoeld in het eerste of zevende lid wordt op verzoek van de verkrijger in de openbare registers
      van de Octrooiraad ingeschreven. Is het stellen van zekerheid opgelegd, dan heeft de inschrijving niet plaats,
      voordat aan die verplichting is voldaan. Voor de inschrijving is een bedrag, waarvan de hoegrootheid nader bij
      algemene maatregel van Rijksbestuur wordt vastgesteld, verschuldigd. De licentie werkt eerst na die inschrijving,
      maar dan ook tegenover hen, die na de inschrijving van het in het vijfde lid bedoelde verzoek rechten op het
      octrooi hebben verkregen. Echter werkt een ingeschreven licentie, die op grond van het in het vierde lid bepaalde
      is verleend, terug tot de dag waarop het verzoek is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel34
  - number: '34.9'
    text: |-
      Nadat een licentie ingevolge de voorgaande leden is verleend, kunnen partijen zich schriftelijk wenden tot de
      Octrooiraad met het verzoek, dat door deze het bedrag van de aan de octrooihouder te betalen vergoeding wordt
      vastgesteld. De Octrooiraad voldoet aan dat verzoek. Aan zijn beslissing zijn partijen gehouden. Wenden partijen
      zich niet met zulk een verzoek tot de Octrooiraad en kunnen zij omtrent het bedrag der vergoeding niet tot
      overeenstemming komen, dan wordt de vergoeding op vordering van de meest gerede partij door de rechter bepaald, die
      de verkrijger der licentie het stellen van zekerheid binnen een bepaalde termijn kan opleggen, dan wel de op grond
      van het eerste of zevende lid bepaalde zekerheid kan bevestigen of wijzigen.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel34
  - number: 34A.1
    text: |-
      Wij kunnen, indien het belang van de verdediging van het Koninkrijk dit naar Ons oordeel vordert, op
      gemeenschappelijke voordracht van Onze Minister, wie het rechtstreeks aangaat, en van Onze Minister van Economische
      Zaken bepalen, dat de Staat bevoegd is in Ons besluit nauwkeurig te omschrijven handelingen, waartoe de houder van
      een door Ons aan te wijzen octrooi ingevolge [artikel 30][ref1] uitsluitend gerechtigd is, zelf te verrichten of
      door anderen te doen verrichten. Deze bevoegdheid geldt voor de gehele duur van het octrooi, tenzij in Ons besluit
      een kortere duur is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel30
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel34A
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '30'
        hoofdstuk: III
        afdeling: I
  - number: 34A.2
    text: |-
      Na het van kracht worden van Ons besluit zal Onze Minister, wie het rechtstreeks aangaat, zich met de octrooihouder
      verstaan omtrent de door de Staat aan deze te betalen vergoeding. Indien Onze Minister hierover niet binnen
      zes maanden na het van kracht worden van Ons besluit met de octrooihouder tot overeenstemming is gekomen,
      is [artikel 34, negende lid][ref1], met uitzondering van het omtrent het stellen van zekerheid bepaalde, van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel34
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel34A
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '34'
        hoofdstuk: III
        afdeling: I
  - number: 34B.1
    text: |-
      Onverminderd [artikel 33, tweede lid, eerste volzin][ref1], ontstaat een licentie door:


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel33
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel34B
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '33'
        hoofdstuk: III
        afdeling: I
  - number: 34B.1.a
    text: |-
      een uitspraak van de Arbitrage-Commissie, als bedoeld in [artikel 20][ref1] van het Verdrag tot oprichting van de
      Europese Gemeenschap voor Atoomenergie (Euratom) (*Trb.* 1957, 92);


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel20
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel34B
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '20'
        hoofdstuk: II
        afdeling: II
  - number: 34B.1.b
    text: |-
      een besluit van de Octrooiraad ter uitvoering van [artikel 21][ref1] van genoemd verdrag.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel21
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel34B
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '21'
        hoofdstuk: II
        afdeling: II
  - number: 34B.2
    text: |-
      Ten aanzien van een licentie, ontstaan door een eindbeslissing als bedoeld in het eerste lid, onder *a*, is
      [artikel 33, tweede lid, tweede en derde volzin][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel33
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel34B
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '33'
        hoofdstuk: III
        afdeling: I
  - number: 34B.3
    text: |-
      Ten aanzien van een besluit als bedoeld in het eerste lid, onder *b*, is
      [artikel 34, vijfde lid, eerste, vierde en vijfde volzin, zesde lid][ref1], eerste, tweede en laatste volzin,
      zevende en achtste lid, eerste, tweede en derde volzin, van overeenkomstige toepassing. Ten aanzien van een door
      zodanig besluit ontstane licentie is [artikel 34, achtste lid, vierde volzin, en negende lid][ref2], laatste
      volzin, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel34
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel34B
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '34'
        hoofdstuk: III
        afdeling: I
      - id: ref2
        bwb_id: BWBR0001879
        artikel: '34'
        hoofdstuk: III
        afdeling: I
  - number: 34B.4
    text: Een licentie als bedoeld in het eerste lid geldt niet voor de Nederlandse Antillen en Aruba.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel34B
  - number: '35.1'
    text: |-
      Ter zake van een octrooi moet elk jaar op de laatste dag van de maand, waarin de aanvrage die tot octrooi heeft
      geleid is ingediend, of ingevolge [artikel 8A][ref1] geacht wordt te zijn ingediend, een bedrag worden betaald,
      waarvan de hoegrootheid bij algemene maatregel van Rijksbestuur wordt bepaald. Vindt verlening van octrooi plaats
      in dezelfde maand als die van de indiening van de aanvrage, die tot het octrooi heeft geleid, dan kan het voor de
      eerste maal verschuldigde bedrag worden betaald op de laatste dag van de daarop volgende maand.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel8A
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 8A
        hoofdstuk: I
  - number: '35.2'
    text: |-
      Ter zake van een Europees octrooi moet elk jaar, doch eerst na afloop van het in [artikel 86, vierde lid, van het
      Europees Octrooiverdrag](onbekend) bedoeld jaar, een bedrag als in het eerste lid bedoeld worden betaald en wel
      op de laatste dag van de maand, waarin de datum van indiening valt, die de Europese octrooiaanvrage, die tot het
      octrooi heeft geleid, ingevolge [artikel 80 van het Europees Octrooiverdrag](onbekend) met inachtneming van de
      [artikelen 61](onbekend) of [76 van dat Verdrag](onbekend) bezit. Indien het voor de eerste maal verschuldigde
      bedrag zou moeten worden betaald binnen een termijn van twee maanden na de dag waarop overeenkomstig [artikel 97,
      vierde lid, van het Europees Octrooiverdrag](onbekend) de vermelding van de verlening van het Europees octrooi is
      gepubliceerd, kan dit bedrag nog worden betaald op de laatste dag van de maand waarin deze termijn eindigt.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel35
  - number: '35.3'
    text: Deze betalingen geschieden bij het Bureau voor de industriële eigendom. Betaling vóór de vervaldag is toegelaten.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel35
  - number: '35.4'
    text: |-
      Bij betaling na de vervaldag zijn verhogingen verschuldigd, waarvan de hoegrootheid nader bij algemene maatregel
      van Rijksbestuur wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel35
  - number: '37.1'
    text: |-
      Het octrooi en de aanspraak op octrooi ingevolge hoofdstuk I van deze Rijkswet zijn zowel voor wat betreft het
      volle recht als voor wat betreft een aandeel daarin vatbaar voor overdracht of andere overgang.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel37
  - number: '37.2'
    text: |-
      De overdracht en andere overgang van het octrooi of van het recht, voortvloeiende uit de octrooiaanvrage, kunnen
      worden ingeschreven in de openbare registers van de Octrooiraad. Voor de inschrijving is een bij algemene maatregel
      van Rijksbestuur vast te stellen bedrag verschuldigd.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel37
  - number: '38.1'
    text: |-
      De levering, vereist voor de overdracht van het octrooi of het recht, voortvloeiende uit een octrooiaanvrage,
      geschiedt bij een akte, houdende de verklaring van de rechthebbende, dat hij het octrooi of het recht,
      voortvloeiende uit de octrooiaanvrage, aan de verkrijger overdraagt, en van deze, dat hij deze overdracht aanneemt.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel38
  - number: '38.2'
    text: |-
      Elk voorbehoud, de overdracht betreffende, moet in de akte omschreven zijn; bij gebreke daarvan geldt de overdracht
      voor onbeperkt.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel38
  - number: '38.3'
    text: |-
      De overdracht werkt tegenover derden eerst wanneer de akte in het daarvoor bestemde register van de Octrooiraad is
      ingeschreven. Tot het doen verrichten van deze inschrijving zijn beide partijen gelijkelijk bevoegd.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel38
  - number: '38.4'
    text: Artikel 3.4.2.3b van het Nederlandse Burgerlijk Wetboek is van toepassing.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel38
  - number: '39.1'
    text: |-
      Indien het octrooi aan verscheidene personen gezamenlijk toekomt, wordt hun onderlinge verhouding beheerst door
      hetgeen tussen hen bij overeenkomst is bepaald.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel39
  - number: '39.2'
    text: |-
      Zo er geen overeenkomst is of zo in de overeenkomst niet anders is bepaald, heeft ieder rechthebbende de
      bevoegdheid de in [artikel 30][ref1] genoemde handelingen te verrichten en tegen zulke handelingen alsmede
      handelingen als bedoeld in [artikel 44A, eerste en tweede lid][ref2], die onbevoegdelijk zijn verricht,
      ingevolge de [artikelen 43-45][ref3] op te treden, doch kan een licentie of toestemming als bedoeld in
      [artikel 44A, tweede lid][ref4], door de rechthebbenden slechts met gemeen goedvinden verleend worden.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel44A
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel43
      [ref4]: https://wetten.overheid.nl/BWBR0001879#Artikel44A
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '30'
        hoofdstuk: III
        afdeling: I
      - id: ref2
        bwb_id: BWBR0001879
        artikel: 44A
        hoofdstuk: III
        afdeling: III
      - id: ref3
        bwb_id: BWBR0001879
        artikel: '43'
        hoofdstuk: III
        afdeling: III
      - id: ref4
        bwb_id: BWBR0001879
        artikel: 44A
        hoofdstuk: III
        afdeling: III
  - number: '39.3'
    text: |-
      Voor de betaling van de in [artikel 35][ref1] genoemde bedragen zijn de rechthebbenden hoofdelijk verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel35
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '35'
        hoofdstuk: III
        afdeling: I
  - number: '40.1'
    text: |-
      Pandrecht op een octrooi wordt gevestigd bij een akte en werkt tegenover derden eerst wanneer de akte in de
      openbare registers van de Octrooiraad is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel40
  - number: '40.2'
    text: |-
      De pandhouder is verplicht, in een door hem ondertekende verklaring, bij de Octrooiraad ter inschrijving in
      te zenden, woonplaats te kiezen te 's-Gravenhage. Indien die keuze niet gedaan is, geldt het Bureau voor de
      industriële eigendom als gekozen woonplaats.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel40
  - number: '40.3'
    text: |-
      Bedingen der pandakte, betreffende na inschrijving te verlenen licenties, gelden van het ogenblik af, dat zij in
      de openbare registers van de Octrooiraad zijn aangetekend, ook tegenover derden. Bedingen, betreffende vergoedingen
      voor licenties, die op het ogenblik der inschrijving reeds waren verleend, gelden tegenover de houder der licentie
      na aanzegging aan deze bij deurwaardersexploit.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel40
  - number: '40.4'
    text: |-
      Akten, waaruit blijkt, dat het pandrecht heeft opgehouden te bestaan of krachteloos is geworden, worden in de
      openbare registers van de Octrooiraad ingeschreven.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel40
  - number: '41.1'
    text: |-
      Het beslag op een octrooi wordt gelegd en het proces-verbaal van inbeslagneming wordt in de openbare
      registers van de Octrooiraad ingeschreven met overeenkomstige toepassing van de bepalingen van het Nederlandse
      [Wetboek van Burgerlijke Rechtsvordering][ref1] betreffende executoriaal en conservatoir beslag op onroerende
      zaken, met dien verstande dat in het proces-verbaal van inbeslagneming in plaats van de aard en de ligging van de
      onroerende zaak een aanduiding van het octrooi wordt opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '41.2'
    text: |-
      Een vervreemding, bezwaring, onderbewindstelling of verlening van een licentie, tot stand gekomen na de
      inschrijving van het proces-verbaal, kan tegen de beslaglegger niet worden ingeroepen.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel41
  - number: '41.3'
    text: |-
      De vóór de inschrijving van het proces-verbaal nog niet betaalde licentievergoedingen vallen mede
      onder een op het octrooi gelegd beslag, nadat het ingeschreven beslag aan de houder der licentie is
      betekend. Deze vergoedingen moeten worden betaald aan de notaris voor wie de executie zal plaatsvinden,
      mits dit bij de betekening uitdrukkelijk aan de licentiehouder is medegedeeld, en behoudens de rechten
      van derden die de executant moet eerbiedigen. Hetgeen aan de notaris wordt betaald, wordt tot de in
      [artikel 42, tweede lid][ref1], bedoelde opbrengst gerekend. De [artikelen 475i][ref2], [476][ref3] en
      [478 van het Nederlandse Wetboek van Burgerlijke Rechtsvordering][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475i
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel476
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel478
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '42'
        hoofdstuk: III
        afdeling: II
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475i
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '476'
      - id: ref4
        bwb_id: BWBR0001827
        artikel: '478'
  - number: '41.4'
    text: 'De inschrijving van het proces-verbaal van inbeslagneming kan worden doorgehaald:'
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel41
  - number: 41.4.a
    text: |-
      krachtens een schriftelijke ter inschrijving aangeboden verklaring van de deurwaarder dat hij in opdracht van de
      beslaglegger het beslag opheft of dat het beslag is vervallen;
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel41
  - number: 41.4.b
    text: |-
      krachtens een ter inschrijving aangeboden rechterlijke uitspraak die tot opheffing van het beslag strekt of het
      verval van het beslag vaststelt of meebrengt.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel41
  - number: '41.5'
    text: |-
      De [artikelen 504][ref1], [507][ref2], [538 tot en met 540][ref3], [726, tweede lid][ref4], en
      [727 van het Nederlandse Wetboek van Burgerlijke Rechtsvordering][ref5] zijn in geval van beslag op een octrooi van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel504a
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel507a
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel538
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel726
      [ref5]: https://wetten.overheid.nl/BWBR0001827#Artikel727
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 504a
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 507a
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '538'
      - id: ref4
        bwb_id: BWBR0001827
        artikel: '726'
      - id: ref5
        bwb_id: BWBR0001827
        artikel: '727'
  - number: '42.1'
    text: |-
      De verkoop van een octrooi door een pandhouder of een beslaglegger tot verhaal van een vordering
      geschiedt in het openbaar ten overstaan van een bevoegde notaris. De [artikelen 508][ref1],
      [509][ref2], [513, eerste lid][ref3], [514, tweede en derde lid][ref4], [515 tot en met 519][ref5], en
      [521 tot en met 529 van het Nederlandse Wetboek van Burgerlijke Rechtsvordering][ref6] zijn van overeenkomstige
      toepassing met dien verstande dat hetgeen daar ten aanzien van hypotheken en hypotheekhouders is voorgeschreven
      geldt voor de op het octrooi rustende pandrechten en de pandhouders.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel508
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel509
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel513
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel514
      [ref5]: https://wetten.overheid.nl/BWBR0001827#Artikel515
      [ref6]: https://wetten.overheid.nl/BWBR0001827#Artikel521
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '508'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '509'
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '513'
      - id: ref4
        bwb_id: BWBR0001827
        artikel: '514'
      - id: ref5
        bwb_id: BWBR0001827
        artikel: '515'
      - id: ref6
        bwb_id: BWBR0001827
        artikel: '521'
  - number: '42.2'
    text: |-
      De verdeling van de opbrengst geschiedt met overeenkomstige toepassing van de
      [artikelen 551 tot en met 552 van het Nederlandse Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel551
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '551'
  - number: '43.1'
    text: |-
      De octrooihouder kan zijn octrooi handhaven jegens een ieder die, zonder daartoe gerechtigd te zijn, een der in
      [artikel 30, eerste lid][ref1], genoemde handelingen verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel30
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '30'
        hoofdstuk: III
        afdeling: I
  - number: '43.2'
    text: |-
      Schadevergoeding kan slechts worden gevorderd van hem, die de handelingen desbewust verricht. Men wordt in elk
      geval geacht desbewust te hebben gehandeld, indien de inbreuk gepleegd is na verloop van 30 dagen, nadat men bij
      deurwaardersexploit op de strijd tussen de handelingen en het octrooi is gewezen.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel43
  - number: '43.3'
    text: |-
      In plaats van schadevergoeding kan worden gevorderd, dat de gedaagde veroordeeld wordt de door de inbreuk genoten
      winst af te dragen en dienaangaande rekening en verantwoording af te leggen; indien de rechter evenwel van oordeel
      is, dat de omstandigheden van het geval tot zulk een veroordeling geen aanleiding geven, zal hij de gedaagde tot
      schadevergoeding kunnen veroordelen.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel43
  - number: '43.4'
    text: |-
      De octrooihouder kan de vorderingen tot schadevergoeding of het afdragen van winst ook of mede namens
      licentienemers of pandhouders instellen, onverminderd de bevoegdheid van deze laatsten in een al of niet namens
      hen of mede namens hen door de octrooihouder aldus ingestelde vordering tussen te komen om rechtstreeks de door
      hen geleden schade vergoed te krijgen of zich een evenredig deel van de door de gedaagde af te dragen winst te
      doen toewijzen. Een zelfstandige vordering kunnen licentienemers en pandhouders slechts instellen, en exploiten als
      bedoeld in het tweede lid met het oog daarop doen uitbrengen, als zij de bevoegdheid daartoe van de octrooihouder
      hebben bedongen.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel43
  - number: '43.5'
    text: |-
      Indien een rechtsvordering wordt ingesteld tot handhaving van een octrooi voor een werkwijze tot vervaardiging
      van een nieuw voortbrengsel, dan wordt vermoed, dat het betrokken voortbrengsel volgens de geoctrooieerde
      werkwijze is vervaardigd, tenzij door de gedaagde het tegendeel aannemelijk wordt gemaakt. Bij de beoordeling van
      de vraag of een voortbrengsel nieuw is blijft de inhoud van in [artikel 2, derde en vierde lid][ref1], bedoelde
      octrooiaanvragen buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel2
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '2'
        hoofdstuk: I
  - number: 43A.1
    text: |-
      Behoudens het bepaalde in het vierde lid, kan de octrooihouder een redelijke vergoeding vorderen van hem, die
      in het tijdvak, gelegen tussen de terinzagelegging overeenkomstig artikel 22C van de aanvrage die tot octrooi
      heeft geleid en de in [artikel 25][ref1] bedoelde openbaarmaking van die aanvrage of van een daaruit ingevolge
      [artikel 8A][ref2] afgesplitste aanvrage, handelingen heeft verricht als vermeld in [artikel 30, eerste lid][ref3],
      voor zover de octrooihouder daarvoor uitsluitende rechten heeft verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel8A
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel30
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel43A
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '25'
        hoofdstuk: II
        afdeling: II
      - id: ref2
        bwb_id: BWBR0001879
        artikel: 8A
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0001879
        artikel: '30'
        hoofdstuk: III
        afdeling: I
  - number: 43A.2
    text: |-
      Behoudens het bepaalde in het vierde lid, kan de octrooihouder eveneens een redelijke vergoeding vorderen van
      hem, die na de in het eerste lid bedoelde openbaarmaking handelingen als in dat lid bedoeld heeft verricht met
      voortbrengselen, die gedurende het aldaar genoemde tijdvak in het verkeer zijn gebracht. De octrooihouder kan een
      zelfde vergoeding vorderen van hem, die na de openbaarmaking ten dienste van zijn bedrijf voortbrengselen, als
      bedoeld in [artikel 30, eerste lid, onder ][ref1], heeft gebruikt die in het in het eerste lid genoemde tijdvak in
      zijn bedrijf zijn vervaardigd.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel30
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel43A
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '30'
        hoofdstuk: III
        afdeling: I
  - number: 43A.3
    text: |-
      De in het eerste en tweede lid bedoelde vergoeding is alleen verschuldigd voor handelingen die zijn verricht
      na verloop van dertig dagen, nadat de betrokkene bij deurwaardersexploit, waarin nauwkeurig is aangegeven welk
      gedeelte van de octrooiaanvrage op die handelingen betrekking heeft, is gewezen op het krachtens dit artikel aan de
      octrooihouder toekomende recht.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel43A
  - number: 43A.4
    text: |-
      Het krachtens dit artikel aan de octrooihouder toekomende recht strekt zich niet uit over handelingen verricht
      door een daartoe krachtens [artikel 32][ref1] of krachtens overeenkomst gerechtigde, alsmede handelingen
      met voortbrengselen, die hetzij vóór de terinzagelegging van de betrokken aanvrage om octrooi overeenkomstig
      [artikel 22C][ref2] in het verkeer zijn gebracht, hetzij nadien door de aanvrager om octrooi of een gerechtigde als
      hiervoor bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel22C
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel43A
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '32'
        hoofdstuk: III
        afdeling: I
      - id: ref2
        bwb_id: BWBR0001879
        artikel: 22C
        hoofdstuk: II
        afdeling: II
  - number: 43B.1
    text: |-
      De houder van een Europees octrooi kan, behoudens het bepaalde in het vierde lid, een redelijke vergoeding
      vorderen van hem, die in het tijdvak, gelegen tussen de publikatie overeenkomstig [artikel 93 van het Europees
      Octrooiverdrag](onbekend) van de aanvrage die tot octrooi heeft geleid en de in [artikel 97, vierde lid van
      dat Verdrag](onbekend), bedoelde publikatie van de vermelding van de verlening van het Europees octrooi op die
      aanvrage of op een daaruit ingevolge artikel 76 van dit Verdrag afgesplitste aanvrage, handelingen heeft verricht
      als vermeld in [artikel 30, eerste lid][ref1], voor zover de octrooihouder daarvoor uitsluitende rechten heeft
      verkregen en de handelingen worden bestreken door de laatstelijk ingediende gepubliceerde conclusies.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel30
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel43B
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '30'
        hoofdstuk: III
        afdeling: I
  - number: 43B.2
    text: |-
      Behoudens het bepaalde in het vierde lid, kan de houder van een Europees octrooi eveneens een redelijke
      vergoeding vorderen van hem, die na de in het eerste lid bedoelde publikatie van de vermelding van de
      verlening van het Europees octrooi handelingen als in dat lid bedoeld heeft verricht met voortbrengselen, die
      gedurende het aldaar genoemde tijdvak in het verkeer zijn gebracht. De octrooihouder kan een zelfde vergoeding
      vorderen van hem, die na bedoelde publikatie ten dienste van zijn bedrijf voortbrengselen als bedoeld in
      [artikel 30, eerste lid, onder ][ref1], heeft gebruikt die in het in het eerste lid genoemde tijdvak in zijn
      bedrijf zijn vervaardigd.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel30
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel43B
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '30'
        hoofdstuk: III
        afdeling: I
  - number: 43B.3
    text: |-
      De in het eerste en tweede lid bedoelde vergoeding is alleen verschuldigd voor handelingen, die zijn verricht na
      verloop van dertig dagen, nadat de betrokkene bij deurwaardersexploit is gewezen op het krachtens dit artikel aan
      de octrooihouder toekomende recht. Bij dit deurwaardersexploit, waarin nauwkeurig is aangegeven welk gedeelte van
      de octrooiaanvrage op die handelingen betrekking heeft, moet zijn betekend een vertaling in het Nederlands van
      de conclusies zoals vervat in de publikatie van de Europese octrooiaanvrage overeenkomstig [artikel 93 van het
      Europees Octrooiverdrag](onbekend). Indien een Nederlandse vertaling als hiervorenbedoeld reeds voor het uitbrengen
      van het deurwaardersexploit bij het Bureau voor de industriële eigendom ter inzage is gelegd en daarvan door dit
      Bureau is kennisgegeven in het in [artikel 25, eerste lid][ref1], bedoelde blad, kan de betekening van de vertaling
      achterwege blijven, mits in het exploit melding wordt gemaakt van het feit van die terinzagelegging.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel25
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel43B
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '25'
        hoofdstuk: II
        afdeling: II
  - number: 43B.4
    text: |-
      Het krachtens dit artikel aan de octrooihouder toekomende recht strekt zich niet uit over handelingen verricht
      door een daartoe krachtens [artikel 32][ref1] of krachtens overeenkomst gerechtigde, alsmede handelingen met
      voortbrengselen, die hetzij voor de in het eerste lid bedoelde publikatie van de aanvrage overeenkomstig [artikel
      93 van het Europees Octrooiverdrag](onbekend) in het verkeer zijn gebracht, hetzij nadien door de aanvrager om
      octrooi of een gerechtigde als hiervoor bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel32
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel43B
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '32'
        hoofdstuk: III
        afdeling: I
  - number: 43B.5
    text: |-
      De Octrooiraad gaat zo spoedig mogelijk over tot de in het derde lid bedoelde terinzagelegging en bekendmaking van
      vertalingen die de Raad hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel43B
  - number: '44.1'
    text: |-
      Een vordering tot verkrijging van schadevergoeding of tot het afdragen van door de inbreuk genoten
      winst, als in [artikel 43][ref1] bedoeld, kan ook worden gegrond op handelingen, verricht vóór de in
      [artikel 28, eerste lid][ref2], bedoelde dagtekening van het octrooi, doch na de openbaarmaking overeenkomstig
      [artikel 25][ref3] van de aanvrage, welke tot het octrooi heeft geleid.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel25
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '43'
        hoofdstuk: III
        afdeling: III
      - id: ref2
        bwb_id: BWBR0001879
        artikel: '28'
        hoofdstuk: II
        afdeling: II
      - id: ref3
        bwb_id: BWBR0001879
        artikel: '25'
        hoofdstuk: II
        afdeling: II
  - number: '44.2'
    text: |-
      Een exploit, als in [het tweede lid van artikel 43][ref1] bedoeld, kan worden uitgebracht ten verzoeke van hem,
      wiens aanvrage om octrooi overeenkomstig [artikel 25][ref2] is openbaar gemaakt, doch op wiens aanvrage nog niet
      definitief is beschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel25
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '43'
        hoofdstuk: III
        afdeling: III
      - id: ref2
        bwb_id: BWBR0001879
        artikel: '25'
        hoofdstuk: II
        afdeling: II
  - number: 44A.1
    text: |-
      De octrooihouder kan dezelfde vorderingen als hem ten dienste staan bij de handhaving van zijn octrooi instellen
      tegen iedere derde, die, in het Koninkrijk of, als het een Europees octrooi betreft, in Nederland, in of voor
      zijn bedrijf middelen betreffende een wezenlijk bestanddeel van de uitvinding aan anderen dan hen, die krachtens
      de [artikelen 32-34B][ref1] tot toepassing van de geoctrooieerde uitvinding bevoegd zijn, aanbiedt of levert voor
      de toepassing van de geoctrooieerde uitvinding in het Koninkrijk of, indien het een Europees octrooi betreft, in
      Nederland, een en ander mits die derde weet dan wel het gezien de omstandigheden duidelijk is, dat die middelen
      voor die toepassing geschikt en bestemd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel32
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel44A
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '32'
        hoofdstuk: III
        afdeling: I
  - number: 44A.2
    text: |-
      Het eerste lid geldt niet, indien het aanbieden of leveren geschiedt met toestemming van de octrooihouder. Dat
      lid geldt evenmin, indien de geleverde of aangeboden middelen algemeen in de handel verkrijgbare produkten zijn,
      tenzij de derde degene aan wie hij levert aanzet tot het verrichten van in [artikel 30, eerste lid][ref1], vermelde
      handelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel30
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel44A
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '30'
        hoofdstuk: III
        afdeling: I
  - number: 44A.3
    text: |-
      [Artikel 43, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel43
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel44A
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '43'
        hoofdstuk: III
        afdeling: III
  - number: 44B.1
    text: |-
      De rechten en verplichtingen, voortvloeiende uit de [artikelen 30-44A][ref1], gelden mede in, op en boven dat
      deel van het aan Nederland, de Nederlandse Antillen of Aruba grenzende - of, indien het een Europees octrooi
      betreft, van het aan Nederland grenzende - continentaal plat, waarop het Koninkrijk soevereine rechten heeft, doch
      uitsluitend voor wat betreft handelingen, gericht op en verricht tijdens het onderzoek naar de aanwezigheid van
      natuurlijke rijkdommen of het winnen daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel30
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel44B
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '30'
        hoofdstuk: III
        afdeling: I
  - number: 44B.2
    text: |-
      Voor de toepassing van het eerste lid wordt onder natuurlijke rijkdommen verstaan: de minerale en andere niet-
      levende rijkdommen van de zeebedding en de ondergrond, alsmede levende organismen die tot de sedentaire soort
      behoren, dat wil zeggen organismen die ten tijde dat ze geoogst kunnen worden, hetzij zich onbeweeglijk op of onder
      de zeebedding bevinden, hetzij zich niet kunnen verplaatsen dan in voortdurend fysiek contact met de zeebedding of
      de ondergrond.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel44B
  - number: '45.1'
    text: |-
      Hij, die opzettelijk inbreuk maakt op het recht van de octrooihouder door het verrichten van een der in
      [artikel 30, eerste lid][ref1], genoemde handelingen, wordt gestraft met gevangenisstraf van ten hoogste drie
      maanden of geldboete van ten hoogste € 675, dan wel indien de geldboete wordt opgelegd door de strafrechter in de
      Nederlandse Antillen of Aruba, een geldboete van ten hoogste ANG 1500, onderscheidenlijk AWG 1500.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel30
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '30'
        hoofdstuk: III
        afdeling: I
  - number: '45.2'
    text: |-
      Indien tijdens het plegen van het strafbaar feit nog geen vijf jaren zijn verlopen sedert een vroegere veroordeling
      van de schuldige wegens gelijk feit onherroepelijk is geworden, worden de in het vorige lid vermelde maxima
      verdubbeld.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel45
  - number: '45.3'
    text: Bij veroordeling kan door de rechter de openbaarmaking zijner uitspraak worden gelast.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel45
  - number: '45.4'
    text: |-
      Indien voorwerpen zijn verbeurd verklaard, kunnen de rechthebbenden op het octrooi, indien zij zich binnen
      acht dagen, nadat het vonnis in kracht van gewijsde is gegaan, daartoe ter griffie aanmelden, vorderen, dat die
      voorwerpen hun worden afgegeven.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel45
  - number: '45.5'
    text: De strafbare feiten, in dit artikel bedoeld, worden beschouwd als misdrijven.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel45
  - number: '46.1'
    text: |-
      Hij, die woorden of tekens in verband met enig goed aldus gebruikt, dat in strijd met de waarheid, de indruk
      kan worden gevestigd, hetzij alsof voor dat goed een bescherming is verleend of aangevraagd, hetzij alsof een
      bescherming ingevolge deze Rijkswet is verleend of aangevraagd, wordt gestraft met hechtenis van ten hoogste drie
      maanden, of geldboete van ten hoogste € 675, dan wel indien de geldboete wordt opgelegd door de strafrechter in de
      Nederlandse Antillen of Aruba, een geldboete van ten hoogste ANG 1500, onderscheidenlijk AWG 1500.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel46
  - number: '46.2'
    text: |-
      Hij, die enig goed, in verband waarmede woorden of tekens aldus zijn gebruikt, dat in strijd met de waarheid, de
      indruk kan worden gevestigd, hetzij alsof voor dat goed een bescherming is verleend of aangevraagd, hetzij alsof
      een bescherming ingevolge deze Rijkswet is verleend of aangevraagd, verkoopt, te koop aanbiedt, aflevert, ten
      verkoop in voorraad heeft of binnen het Koninkrijk invoert, wordt gestraft met dezelfde straffen, als in het vorig
      lid zijn bepaald.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel46
  - number: '46.3'
    text: |-
      De in dit artikel strafbaar gestelde feiten worden beschouwd als overtredingen.
      [Artikel 45, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel45
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '45'
        hoofdstuk: III
        afdeling: III
  - number: '47'
    text: |-
      Het octrooi blijft behoudens het bepaalde in de navolgende artikelen van kracht tot het verstrijken van een termijn
      van twintig jaren te rekenen van de dag van indiening van de aanvrage die tot het octrooi heeft geleid.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel47
  - number: '48.1'
    text: Een octrooi vervalt wanneer de octrooihouder afstand doet.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel48
  - number: '48.2'
    text: |-
      De afstand geschiedt bij een akte, in de openbare registers van de Octrooiraad ingeschreven en in het in
      [artikel 25][ref1] bedoelde blad vermeld. De inschrijving geschiedt niet zolang er personen zijn, die krachtens in
      die registers ingeschreven stukken rechten op het octrooi of licenties hebben verkregen of rechtsvorderingen het
      octrooi betreffende hebben ingesteld, en deze personen tot de afstand geen toestemming hebben verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel25
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '25'
        hoofdstuk: II
        afdeling: II
  - number: '49.1'
    text: |-
      Een octrooi vervalt van rechtswege, wanneer de in [artikel 35][ref1] genoemde bedragen niet binnen zes
      kalendermaanden na de daar genoemde vervaldag zijn betaald. Van dit vervallen wordt in de openbare registers van de
      Octrooiraad aantekening gedaan en in het in [artikel 25][ref2] bedoelde blad melding gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel25
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '35'
        hoofdstuk: III
        afdeling: I
      - id: ref2
        bwb_id: BWBR0001879
        artikel: '25'
        hoofdstuk: II
        afdeling: II
  - number: '49.2'
    text: |-
      [Artikel 22D, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22D
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22D
        hoofdstuk: II
        afdeling: II
  - number: '51.1'
    text: 'Een octrooi wordt nietig verklaard voor zover:'
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel51
  - number: 51.1.a
    text: |-
      het octrooi ingevolge de [artikelen 1A][ref1], [2][ref2], [2A][ref3], [3][ref4] of [5][ref5] dan wel, indien
      het een Europees octrooi betreft, ingevolge de [artikelen 52-57 van het Europees Octrooiverdrag](onbekend) niet had
      behoren te worden verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel1A
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel2A
      [ref4]: https://wetten.overheid.nl/BWBR0001879#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0001879#Artikel5
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 1A
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0001879
        artikel: '2'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0001879
        artikel: 2A
        hoofdstuk: I
      - id: ref4
        bwb_id: BWBR0001879
        artikel: '3'
        hoofdstuk: I
      - id: ref5
        bwb_id: BWBR0001879
        artikel: '5'
        hoofdstuk: I
  - number: 51.1.b
    text: |-
      het octrooischrift niet een beschrijving bevat van de uitvinding, die, in voorkomend geval met toepassing van
      [artikel 22B, tweede lid][ref1], zodanig duidelijk en volledig is dat een deskundige deze uitvinding kan toepassen;


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22B
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22B
        hoofdstuk: II
        afdeling: II
  - number: 51.1.c
    text: |-
      het onderwerp van het octrooi niet wordt gedekt door de inhoud van de ingediende aanvrage, of door de inhoud van de
      oorspronkelijke aanvrage indien het octrooi is verleend op een afgesplitste aanvrage dan wel op een nieuwe Europese
      octrooiaanvrage die is ingediend overeenkomstig [artikel 61 van het Europees Octrooiverdrag;](onbekend)
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel51
  - number: 51.1.d
    text: na openbaarmaking of na octrooiverlening uitbreiding van de beschermingsomvang is opgetreden, of
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel51
  - number: 51.1.e
    text: |-
      de houder van het octrooi geen aanspraak daarop had hetzij krachtens de bepalingen van hoofdstuk I van deze
      Rijkswet hetzij, indien het een Europees octrooi betreft, krachtens [artikel 60, eerste lid, van het Europees
      Octrooiverdrag](onbekend).
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel51
  - number: '51.2'
    text: |-
      Voor de toepassing van het eerste lid, onder *a*, wordt onder de stand van de techniek, bedoeld in [artikel 54,
      derde lid, van het Europees Octrooiverdrag](onbekend), mede begrepen de inhoud van uit hoofde van deze Rijkswet
      ingediende octrooiaanvragen, waarvan de dag van indiening voor de datum van indiening van de desbetreffende
      Europese octrooiaanvrage, die voor de toepassing van dat lid geldt, ligt, en die eerst op of na die datum
      overeenkomstig [artikel 22C][ref1] ter inzage zijn gelegd of, indien die terinzagelegging nog niet heeft
      plaatsgevonden, overeenkomstig [artikel 25][ref2] zijn openbaar gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22C
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel25
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22C
        hoofdstuk: II
        afdeling: II
      - id: ref2
        bwb_id: BWBR0001879
        artikel: '25'
        hoofdstuk: II
        afdeling: II
  - number: '51.3'
    text: |-
      De rechtsvordering tot nietigverklaring komt in de onder *a*-*d* genoemde gevallen toe aan een ieder en in het
      onder *e* genoemde geval aan degene, die krachtens de in dat onderdeel genoemde bepalingen aanspraak op het
      octrooi heeft. Indien laatstgenoemde zelf een octrooi voor de desbetreffende uitvinding heeft verkregen, komt de
      rechtsvordering tot nietigverklaring ook toe aan licentiehouders en pandhouders.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel51
  - number: '51.4'
    text: |-
      De dagvaarding moet binnen acht dagen na haar dagtekening in de openbare registers van de Octrooiraad worden
      ingeschreven. Bij gebreke van tijdige inschrijving is de eiser verplicht de schade te vergoeden, geleden door hen,
      die te goeder trouw na die termijn en vóór de inschrijving rechten, waarop de nietigverklaring invloed uitoefent,
      hebben verkregen.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel51
  - number: '51.5'
    text: |-
      Een octrooi wordt geacht van de aanvang af geheel of gedeeltelijk niet de in de [artikelen 30][ref1], [43A][ref2],
      [43B][ref3] en [44A][ref4] bedoelde rechtsgevolgen te hebben gehad naar gelang het octrooi geheel of gedeeltelijk
      is nietig verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel43A
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel43B
      [ref4]: https://wetten.overheid.nl/BWBR0001879#Artikel44A
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '30'
        hoofdstuk: III
        afdeling: I
      - id: ref2
        bwb_id: BWBR0001879
        artikel: 43A
        hoofdstuk: III
        afdeling: III
      - id: ref3
        bwb_id: BWBR0001879
        artikel: 43B
        hoofdstuk: III
        afdeling: III
      - id: ref4
        bwb_id: BWBR0001879
        artikel: 44A
        hoofdstuk: III
        afdeling: III
  - number: '51.6'
    text: 'De terugwerkende kracht van de nietigheid heeft geen invloed op:'
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel51
  - number: 51.6.a
    text: |-
      een beslissing ter zake van handelingen in strijd met het in [artikel 30][ref1] bedoelde uitsluitend recht van de
      octrooihouder of van handelingen als bedoeld in de [artikelen 43A][ref2], [43B][ref3] en [44A][ref4], die voor de
      nietigverklaring in kracht van gewijsde is gegaan en ten uitvoer is gelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel43A
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel43B
      [ref4]: https://wetten.overheid.nl/BWBR0001879#Artikel44A
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '30'
        hoofdstuk: III
        afdeling: I
      - id: ref2
        bwb_id: BWBR0001879
        artikel: 43A
        hoofdstuk: III
        afdeling: III
      - id: ref3
        bwb_id: BWBR0001879
        artikel: 43B
        hoofdstuk: III
        afdeling: III
      - id: ref4
        bwb_id: BWBR0001879
        artikel: 44A
        hoofdstuk: III
        afdeling: III
  - number: 51.6.b
    text: |-
      een voor de nietigverklaring gesloten overeenkomst, voor zover deze voor de nietigverklaring is uitgevoerd;
      uit billijkheidsoverwegingen kan echter terugbetaling worden geëist van op grond van deze overeenkomst betaalde
      bedragen, en wel in de mate als door de omstandigheden gerechtvaardigd is.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel51
  - number: '51.7'
    text: |-
      Voor de toepassing van het in het zesde lid, onder *b*, bepaalde wordt onder het sluiten van een overeenkomst mede
      verstaan het ontstaan van een licentie op een andere in [artikel 33, tweede lid][ref1], [34A][ref2] of [34B][ref3]
      aangegeven wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel34A
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel34B
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '33'
        hoofdstuk: III
        afdeling: I
      - id: ref2
        bwb_id: BWBR0001879
        artikel: 34A
        hoofdstuk: III
        afdeling: I
      - id: ref3
        bwb_id: BWBR0001879
        artikel: 34B
        hoofdstuk: III
        afdeling: I
  - number: '51.8'
    text: |-
      Ingeval een octrooi wordt nietig verklaard op grond van het eerste lid, onder *e*, en degene, die krachtens de
      in dat onderdeel genoemde bepalingen aanspraak op het octrooi heeft, zelf een octrooi voor de desbetreffende
      uitvinding heeft verkregen, worden licenties, die te goeder trouw van het nietigverklaarde octrooi waren verkregen
      vóór de inschrijving der dagvaarding, geldig tegenover het bestaande octrooi, doch verkrijgt de houder daarvan
      overeenkomstig [artikel 33, derde lid][ref1], recht op de voor de licenties verschuldigde vergoeding. De houder
      van het nietigverklaarde octrooi, die bij zijn aanvrage te goeder trouw was of die het octrooi vóór de inschrijving
      der dagvaarding te goeder trouw van een vroegere houder verkreeg, blijft in dat geval ten aanzien van het bestaande
      octrooi bevoegd tot toepassing van de uitvinding op de voet als omschreven in [artikel 32][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel32
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '33'
        hoofdstuk: III
        afdeling: I
      - id: ref2
        bwb_id: BWBR0001879
        artikel: '32'
        hoofdstuk: III
        afdeling: I
  - number: '51.9'
    text: |-
      Zodra een eindbeslissing aangaande een vordering tot nietigverklaring in kracht van gewijsde is gegaan of wel
      de instantie is vervallen, wordt daarvan op verzoek van de meest gerede partij in de openbare registers van de
      Octrooiraad aantekening gedaan. Van een in kracht van gewijsde gegane nietigverklaring wordt melding gemaakt in het
      in [artikel 25][ref1] bedoelde blad.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel25
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '25'
        hoofdstuk: II
        afdeling: II
  - number: '52.1'
    text: |-
      Voor zover een uit hoofde van deze Rijkswet verleend octrooi betrekking heeft op een uitvinding, waarvoor aan
      dezelfde uitvinder of zijn rechtverkrijgende een Europees octrooi is verleend, terwijl de dag van indiening of
      in voorkomend geval de voorrangsdatum van de onderscheidene aanvragen om octrooi dezelfde is, heeft eerstbedoeld
      octrooi, voor zover het dezelfde uitvinding beschermt als het Europees octrooi, in Nederland niet meer de in
      [artikel 30][ref1], [43A][ref2] en [44A][ref3] bedoelde rechtsgevolgen vanaf de dag waarop:


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel43A
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel44A
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '30'
        hoofdstuk: III
        afdeling: I
      - id: ref2
        bwb_id: BWBR0001879
        artikel: 43A
        hoofdstuk: III
        afdeling: III
      - id: ref3
        bwb_id: BWBR0001879
        artikel: 44A
        hoofdstuk: III
        afdeling: III
  - number: 52.1.a
    text: |-
      de voor het instellen van oppositie tegen het Europees octrooi vastgestelde termijn is verstreken zonder dat
      oppositie is ingesteld,
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel52
  - number: 52.1.b
    text: de oppositieprocedure is afgesloten, waarbij het Europees octrooi in stand is gebleven, of
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel52
  - number: 52.1.c
    text: |-
      het octrooi uit hoofde van deze Rijkswet is verleend, indien deze dag ligt na die onder *a* of *b* bedoeld, al naar
      het geval.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel52
  - number: '52.2'
    text: |-
      Het tenietgaan, op welke wijze ook, van het Europees octrooi op een later tijdstip laat het bepaalde in het vorige
      lid onverlet.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel52
  - number: '52.3'
    text: |-
      Vorderingen ter vaststelling van een in het eerste lid bedoeld verlies van rechtsgevolg kunnen door een ieder
      worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel52
  - number: '52.4'
    text: |-
      [Artikel 51, vierde lid, achtste lid, eerste volzin, en negende lid][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel51
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '51'
        hoofdstuk: IV
  - number: '53.1'
    text: |-
      Een octrooi kan geheel, gedeeltelijk of voor wat betreft een aandeel daarin worden opgeëist door degene die
      krachtens de [artikelen 9][ref1], [10][ref2] of [11][ref3] dan wel, indien het een Europees octrooi betreft,
      krachtens [artikel 60, eerste lid, van het Europees Octrooiverdrag](onbekend) aanspraak of mede aanspraak heeft op
      dat octrooi.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel11
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '9'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0001879
        artikel: '10'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0001879
        artikel: '11'
        hoofdstuk: I
  - number: '53.2'
    text: De dagvaarding moet in de openbare registers van de Octrooiraad worden ingeschreven.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel53
  - number: '53.3'
    text: |-
      De octrooihouder, die bij zijn aanvrage te goeder trouw was, of die het octrooi vóór de inschrijving der
      dagvaarding te goeder trouw van een vroegere houder verkreeg, blijft ten aanzien van de nieuwe octrooihouder
      bevoegd tot toepassing der uitvinding op de voet als omschreven in [artikel 32][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel32
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '32'
        hoofdstuk: III
        afdeling: I
  - number: '53.4'
    text: |-
      Te goeder trouw vóór de inschrijving verkregen licenties blijven geldig tegenover de nieuwe octrooihouder, die
      overeenkomstig de bepaling van [artikel 33, derde lid][ref1], recht verkrijgt op de voor de licenties verschuldigde
      vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel33
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '33'
        hoofdstuk: III
        afdeling: I
  - number: '53.5'
    text: |-
      De bepalingen van het derde en het vierde lid zijn niet van kracht ingeval hij, die het octrooi met goed gevolg
      heeft opgeëist, reeds door zelf octrooi aan te vragen of door indiening van een bezwaarschrift zijn aanspraken
      had doen gelden, en de dagvaarding, waarbij de vordering tot opeising werd ingesteld, binnen drie maanden na de
      verlening van het octrooi of, indien het een Europees octrooi betreft, na de publikatie overeenkomstig [artikel 97,
      vierde lid, van het Europees Octrooiverdrag](onbekend) van de vermelding van de verlening van het Europees octrooi
      in de openbare registers van de Octrooiraad was ingeschreven.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel53
  - number: '53.6'
    text: |-
      Pandrechten, door een vroegere octrooihouder gevestigd, zijn alleen geldig tegenover de nieuwe octrooihouder,
      indien zij te goeder trouw zijn verkregen en vóór de inschrijving der dagvaarding gevestigd. Zij zijn nimmer
      tegenover deze geldig in het geval, bedoeld in het vorige lid.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel53
  - number: '53.7'
    text: |-
      De vordering in dit artikel vermeld verjaart, wanneer vijf jaren zijn verstreken na de dagtekening van het octrooi
      of, indien het een Europees octrooi betreft, na de datum, waarop overeenkomstig artikel 97, vierde lid, van het
      Europees Octrooiverdrag de vermelding van de verlening van het Europees octrooi is gepubliceerd; nochtans kan hij,
      die bij het verkrijgen van het octrooi wist of had moeten weten, dat hij of de persoon, die het hem overdroeg, geen
      aanspraak had op het octrooi, zich niet op deze verjaring beroepen. Artikel 2006 van het Burgerlijk Wetboek van de
      Nederlandse Antillen is op deze verjaring niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel53
  - number: '53.8'
    text: |-
      Zodra een eindbeslissing aangaande een vordering tot opeising in kracht van gewijsde is gegaan of wel de instantie
      is vervallen, wordt daarvan op verzoek van de meest gerede partij in de openbare registers van de Octrooiraad
      aantekening gedaan.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel53
  - number: '54.1'
    text: |-
      Voor alle vorderingen tot nietigverklaring, vaststelling van een verlies van rechtsgevolg of opeising van
      octrooien, bedoeld in onderscheidenlijk de [artikelen 51][ref1], [52][ref2] en [53][ref3], voor alle vorderingen
      tot opeising van Europese octrooiaanvragen, alsmede voor alle vorderingen tot vaststelling van een vergoeding,
      als in [artikel 34, negende lid][ref4], [34A, tweede lid][ref5], of [34B, derde lid][ref6], bedoeld, is in eerste
      aanleg uitsluitend bevoegd de arrondissements-rechtbank te 's-Gravenhage.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel53
      [ref4]: https://wetten.overheid.nl/BWBR0001879#Artikel34
      [ref5]: https://wetten.overheid.nl/BWBR0001879#Artikel34A
      [ref6]: https://wetten.overheid.nl/BWBR0001879#Artikel34B
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '51'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0001879
        artikel: '52'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0001879
        artikel: '53'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0001879
        artikel: '34'
        hoofdstuk: III
        afdeling: I
      - id: ref5
        bwb_id: BWBR0001879
        artikel: 34A
        hoofdstuk: III
        afdeling: I
      - id: ref6
        bwb_id: BWBR0001879
        artikel: 34B
        hoofdstuk: III
        afdeling: I
  - number: '54.2'
    text: |-
      De arrondissementsrechtbank te 's-Gravenhage en de president van die rechtbank in kort geding zijn in eerste
      aanleg in Nederland uitsluitend bevoegd voor alle vorderingen als bedoeld in de [artikelen 43][ref1], [43A][ref2],
      [43B][ref3] en [44A][ref4], alsmede voor alle vorderingen welke worden ingesteld door een ander dan de
      octrooihouder ten einde te doen vaststellen dat bepaalde door hem verrichte handelingen niet strijdig zijn met
      een octrooi.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel43A
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel43B
      [ref4]: https://wetten.overheid.nl/BWBR0001879#Artikel44A
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '43'
        hoofdstuk: III
        afdeling: III
      - id: ref2
        bwb_id: BWBR0001879
        artikel: 43A
        hoofdstuk: III
        afdeling: III
      - id: ref3
        bwb_id: BWBR0001879
        artikel: 43B
        hoofdstuk: III
        afdeling: III
      - id: ref4
        bwb_id: BWBR0001879
        artikel: 44A
        hoofdstuk: III
        afdeling: III
  - number: '54.3'
    text: |-
      Bij de behandeling ter terechtzitting van geschillen bedoeld in het eerste en tweede lid mogen octrooigemachtigden
      het woord voeren onverminderd de verantwoordelijkheid van de procureur.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel54
  - number: '54.4'
    text: Overigens gelden de gewone in Nederland van kracht zijnde voorschriften betreffende de rechtspraak.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel54
  - number: '55.1'
    text: |-
      Hij, die de inschrijving in een register van een stuk, mits geen aanvrage om octrooi, aan de Octrooiraad heeft
      verzocht, kan zich, ingeval de inschrijving wordt geweigerd, bij verzoekschrift wenden tot de in het vorige artikel
      bedoelde rechtbank. Hetzelfde kan doen hij, die zich door de inschrijving in een register van een stuk, mits geen
      aanvrage om octrooi, bezwaard acht.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel55
  - number: '55.2'
    text: |-
      De rechtbank kan, na verhoor van de verzoeker, van de Voorzitter van de Octrooiraad of diens gemachtigde, en, zo
      zij het nodig acht, van andere belanghebbenden, gelasten dat de inschrijving alsnog geschiede, of in het tweede
      geval de inschrijving geheel of ten dele krachteloos verklaren, van welke verklaring in het register melding moet
      worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel55
  - number: '55.3'
    text: |-
      Het bevelschrift, waarbij de oproeping wordt gelast, wordt door de griffier bij aangetekende brief ter kennis van
      de door de rechter aangewezen personen gebracht. De opgeroepenen kunnen zich door een bijzonder gemachtigde doen
      vertegenwoordigen, doch de rechter kan verschijning in persoon gelasten. Van het gevoelen van ieder der verschenen
      personen wordt in het proces-verbaal melding gemaakt. Bij niet verschijning, zelfs van alle opgeroepenen, kan de
      rechter zonder verhoor beslissen.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel55
  - number: '55.4'
    text: |-
      De verzoeker, de Voorzitter van de Octrooiraad en de opgeroepen belanghebbenden kunnen in hoger beroep komen binnen
      veertien dagen na de dagtekening der beschikking. Dat beroep kan onmiddellijk worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel55
  - number: '56.1'
    text: |-
      Van alle andere geschillen dan in de beide voorgaande artikelen bedoeld wordt kennis genomen door de rechter die
      daartoe volgens de algemene regeling der rechtspraak bevoegd is.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel56
  - number: '56.2'
    text: |-
      Rechtsvorderingen, die gegrond zijn op de bepaling van [artikel 10, tweede lid][ref1], worden geacht te zijn
      rechtsvorderingen betrekkelijk tot een arbeidsovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel10
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '10'
        hoofdstuk: I
  - number: '56.3'
    text: |-
      Indien de rechter meent, dat op de beslissing van een geschil van invloed kan zijn een rechtsvordering, die op
      grond van [artikel 51][ref1], [52][ref2] of 53 is of zou kunnen worden ingesteld, kan hij de behandeling van het
      aanhangige geschil met of zonder tijdsbepaling schorsen. Gelijke bevoegdheid bezit hij, indien op de beslissing
      inzake zulk een rechtsvordering een uit anderen hoofde ingestelde rechtsvordering van invloed kan zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel52
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '51'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0001879
        artikel: '52'
        hoofdstuk: IV
  - number: '56.4'
    text: |-
      De rechter kan de behandeling van een geschil ter zake van een Europees octrooi met of zonder tijdsbepaling
      schorsen, indien bij het Europees Octrooibureau tegen dat octrooi oppositie is ingesteld ingevolge [artikel 99 van
      het Europees Octrooiverdrag](onbekend).
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel56
  - number: '57.1'
    text: |-
      De Octrooiraad is verplicht de rechter alle inlichtingen en technische adviezen te verstrekken, die deze tot
      beslissing van aan zijn oordeel onderworpen rechtsvorderingen in zake octrooien mocht verlangen.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel57
  - number: '57.2'
    text: |-
      De door de Octrooiraad ingevolge het vorige lid verstrekte adviezen hebben gelijke waarde als die van deskundigen,
      als in de [artikelen 221 tot en met 225 van het Nederlandse Wetboek van Burgerlijke Rechtsvordering][ref1] bedoeld,
      in Nederland hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel221
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '221'
  - number: 57A
    text: |-
      Van alle rechterlijke uitspraken in zake octrooirecht wordt door de griffier van het gerecht, door hetwelk die
      uitspraak werd gedaan, binnen één maand kosteloos een los afschrift gezonden aan de Octrooiraad, en, indien het een
      Europees octrooi betreft, aan het Europees Octrooibureau, bedoeld in het [Europees Octrooiverdrag](onbekend).
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel57A
  - number: '58'
    text: |-
      In de Nederlandse Antillen en in Aruba kan een Bureau voor de industriële eigendom worden ingesteld. Deze bureaus
      zijn instellingen van die landen.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel58
  - number: '59.1'
    text: |-
      De aanvragen om octrooi van inwonenden van de Nederlandse Antillen of Aruba kunnen worden ingediend bij het aldaar
      ingestelde Bureau voor de industriële eigendom.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel59
  - number: '59.2'
    text: Het tijdstip van indiening bij het betrokken Bureau geldt als tijdstip van indiening bij de Octrooiraad.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel59
  - number: '59.3'
    text: |-
      [Artikel 21][ref1] is van toepassing met dien verstande, dat het ingevolge dit artikel verschuldigde bedrag zal
      worden gestort bij het betrokken Bureau.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel21
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '21'
        hoofdstuk: II
        afdeling: II
  - number: '60'
    text: |-
      Door het betrokken Bureau wordt [artikel 22][ref1] toegepast, met dien verstande, dat op de aanvrage als tijdstip
      van indiening de datum, waarop zij bij het betrokken Bureau is binnengekomen, wordt vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '22'
        hoofdstuk: II
        afdeling: II
  - number: '61.1'
    text: |-
      Het betrokken Bureau doet de aanvrage met bijbehorende beschrijving, tekeningen en modellen, onder bijvoeging van
      een afschrift van het afgegeven ontvangbewijs, onverwijld na de inschrijving aan de Octrooiraad toekomen, tenzij
      het meent, dat een dier stukken niet voldoet aan de formele vereisten, welke daaraan bij wettelijk voorschrift
      zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel61
  - number: '61.2'
    text: |-
      In dit geval wordt van de vermeende gebreken der aanvrage door het betrokken Bureau aan de aanvrager schriftelijk
      kennis gegeven, met uitnodiging om binnen een bepaalde termijn voor de nodige verbetering of aanvulling zorg te
      dragen. Na het verstrijken van die termijn worden, onverschillig of aan bovenvermelde uitnodiging is voldaan, de
      door de aanvrager ingezonden stukken benevens een afschrift van het hem afgegeven ontvangbewijs door het betrokken
      Bureau onverwijld aan de Octrooiraad toegezonden.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel61
  - number: '62'
    text: |-
      Nadat de aanvrage door de Octrooiraad is ontvangen, wordt deze in een register onder doorlopend nummer
      ingeschreven.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel62
  - number: '63.1'
    text: |-
      Inwonenden van de Nederlandse Antillen of Aruba kunnen in deze Rijkswet bedoelde verzoekschriften, bezwaarschriften
      en memories van grieven indienen bij het aldaar ingestelde Bureau voor de industriële eigendom.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel63
  - number: '63.2'
    text: |-
      Het Bureau geeft onverwijld van het inkomen van een verzoekschrift, bezwaarschrift of memorie van grieven
      telegrafisch kennis aan de Octrooiraad en doet die raad het ingekomen stuk toekomen.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel63
  - number: '69.1'
    text: Deze Rijkswet is verbindend voor het gehele Koninkrijk.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel69
  - number: '69.2'
    text: Zij kan worden aangehaald als "Rijksoctrooiwet".
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel69
  - number: '71'
    text: |-
      In Nederland kan bij de wet en in de Nederlandse Antillen en Aruba kan bij landsverordening worden verklaard, dat
      de in deze Rijkswet vervatte onderlinge regeling dient te worden beëindigd. Met ingang van het derde kalenderjaar
      na dat van afkondiging van zodanige wet of landsverordening verkrijgt deze Rijkswet in Nederland de staat van wet
      en in de Nederlandse Antillen en Aruba de staat van landsverordening.
    url: https://wetten.overheid.nl/BWBR0001879/2002-01-01#Artikel71
