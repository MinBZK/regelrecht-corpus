        artikel: 10b
      - id: ref4
        bwb_id: BWBR0002399
        artikel: 10d
  - number: 2.2.d
    text: |-
      de soorten opleidingen, bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen a tot en met e, van de Wet educatie en beroepsonderwijs][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0027679/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 2.2.e
    text: |-
      de opleidingen Nederlandse taal en rekenen, bedoeld in
      [artikel 7.3.1, eerste lid, onder b, van de Wet educatie en beroepsonderwijs][ref1], met dien verstande dat
      daarvoor twee referentieniveaus Nederlandse taal en twee referentieniveaus rekenen worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0027679/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: '2.3'
    text: |-
      Referentieniveaus Nederlandse taal kunnen worden vastgesteld voor de opleidingen Nederlands als tweede taal,
      bedoeld in [artikel 7.3.1, eerste lid, onder c, d en e, van de Wet educatie en beroepsonderwijs][ref1], met dien
      verstande dat voor elke opleiding verschillende referentieniveaus kunnen worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0027679/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: '8.1'
    text: |-
      Van de eindtermen die voor het tijdstip van inwerkingtreding van [artikel 6, onderdeel A][ref1], zijn vastgesteld
      op grond van [artikel 7.2.4 van de Wet educatie en beroepsonderwijs][ref2] voor beroepsopleidingen met de
      verzorging waarvan instellingen een aanvang maken op of na het tijdstip van inwerkingtreding van artikel 6,
      onderdeel A, wordt geacht deel uit te maken een deelkwalificatie Nederlandse taal en rekenen, omvattende het voor
      de desbetreffende soort opleiding vastgestelde referentieniveau Nederlandse taal en het referentieniveau rekenen,
      bedoeld in [artikel 2, tweede lid, aanhef en onderdeel d][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0027679#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0027679#Artikel2
    url: https://wetten.overheid.nl/BWBR0027679/2013-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0027679
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0027679
        artikel: '2'
  - number: '8.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de eindtermen die na het tijdstip van inwerkingtreding
      van [artikel 6, onderdeel A][ref1], worden vastgesteld voor beroepsopleidingen met de verzorging waarvan
      instellingen een aanvang maken na het tijdstip van inwerkingtreding van artikel 6, onderdeel A, voor
      zover het voorstel van het desbetreffende kenniscentrum beroepsonderwijs bedrijfsleven, bedoeld in
      [artikel 7.2.4, derde lid, van de Wet educatie en beroepsonderwijs][ref2] is gedaan voor het tijdstip van
      inwerkingtreding van artikel 6, onderdeel A.


      [ref1]: https://wetten.overheid.nl/BWBR0027679#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0027679/2013-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0027679
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
  - number: '8.3'
    text: |-
      De deelkwalificatie Nederlandse taal en rekenen, bedoeld in het eerste lid, treedt in de plaats van de eisen aan de
      beheersing van de Nederlandse taal en het rekenen die elders in de desbetreffende eindtermen zijn opgenomen, tenzij
      het betreft eisen die specifiek met het oog op de beroepsuitoefening zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0027679/2013-01-01#Artikel8
  - number: '8.4'
    text: |-
      Indien de algemene maatregel van bestuur, bedoeld in
      [artikel 7.4.3a, eerste lid, van de Wet educatie en beroepsonderwijs][ref1], later in werking
      treedt dan dit artikel, wordt bij ministeriële regeling bepaald hoe de door een deelnemer
      behaalde resultaten bij de deelkwalificatie Nederlandse taal en rekenen meetellen voor het met
      gunstig gevolg afleggen van het examen van de beroepsopleiding, indien nodig in afwijking van
      [artikel 7.4.2, derde lid, van de Wet educatie en beroepsonderwijs][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0027679/2013-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
  - number: '8.5'
    text: |-
      Het bevoegd gezag stelt deelnemers die voor de inwerkingtreding van [artikel 6, onderdeel A][ref1], zijn
      gestart met een meerjarige beroepsopleiding in de gelegenheid hun opleiding binnen een redelijke tijd
      te voltooien onder de op de dag voor de inwerkingtreding van artikel 6, onderdeel A, bij of krachtens de
      [Wet educatie en beroepsonderwijs][ref2] vastgestelde voorschriften. Deze deelnemers ontvangen na het met goed
      gevolg voltooien van de opleiding een diploma overeenkomstig de op de dag voor de inwerkingtreding van artikel 6,
      onderdeel A, geldende voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0027679#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0027679/2013-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0027679
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0007625
  - number: '9'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan alsmede voor de verschillende onderwijssectoren, schoolsoorten,
      leerwegen of onderdelen van leerwegen binnen het voortgezet onderwijs of soorten beroepsopleidingen verschillend
      kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0027679/2013-01-01#Artikel9
  - number: '10'
    text: 'Deze wet wordt aangehaald als: Wet referentieniveaus Nederlandse taal en rekenen.'
    url: https://wetten.overheid.nl/BWBR0027679/2013-01-01#Artikel10
