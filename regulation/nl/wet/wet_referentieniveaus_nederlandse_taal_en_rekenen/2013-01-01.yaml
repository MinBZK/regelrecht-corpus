preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat taal- en rekenvaardigheden een sleutelrol vervullen in de
    onderwijsloopbaan van leerlingen en van groot belang zijn voor het maatschappelijk en in voorkomende gevallen
    beroepsmatig functioneren van leerlingen;

    dat het wenselijk is te komen tot versterking van de taal- en rekenvaardigheden van leerlingen en tot een betere
    aansluiting tussen het taal- en rekenonderwijs van de verschillende sectoren in het onderwijs, in het belang van
    een doorlopende leerlijn van leerlingen;

    dat het in verband daarmee wenselijk is voor deze vaardigheden beheersingsniveaus vast te stellen;

    dat deze niveaus vanwege hun sectoroverstijgende betekenis een grondslag dienen te krijgen in een
    sectoroverstijgende wet;

    dat de doorwerking van de niveaus naar de afzonderlijke onderwijssectoren tevens noodzaakt tot aanpassing van de
    Wet op het primair onderwijs, de Wet op de expertisecentra, de Wet op het voortgezet onderwijs en de Wet educatie
    en beroepsonderwijs;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0027679/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *referentieniveau Nederlandse taal:* niveau
      van beheersing van de Nederlandse taal, uitgedrukt in kennis, inzicht en vaardigheden die van belang zijn voor de
      doorstroming naar het vervolgonderwijs en het maatschappelijk en in voorkomende gevallen beroepsmatig functioneren,
      waarmee de beheersing van de Nederlandse taal door leerlingen aan het einde van een onderwijssoort kan worden
      vergeleken, en
        - *referentieniveau rekenen:* niveau van beheersing van het rekenen, uitgedrukt in kennis, inzicht en vaardigheden
      die van belang zijn voor de doorstroming naar het vervolgonderwijs en het maatschappelijk en in voorkomende
      gevallen beroepsmatig functioneren, waarmee de beheersing van het rekenen door leerlingen aan het einde van een
      onderwijssoort kan worden vergeleken.
    url: https://wetten.overheid.nl/BWBR0027679/2013-01-01#Artikel1
  - number: '2.1'
    text: |-
      Bij algemene maatregel van bestuur wordt een samenhangend geheel van referentieniveaus Nederlandse taal en
      referentieniveaus rekenen vastgesteld.
    url: https://wetten.overheid.nl/BWBR0027679/2013-01-01#Artikel2
  - number: '2.2'
    text: 'Referentieniveaus Nederlandse taal en referentieniveaus rekenen worden vastgesteld voor:'
    url: https://wetten.overheid.nl/BWBR0027679/2013-01-01#Artikel2
  - number: 2.2.a
    text: |-
      het basisonderwijs, bedoeld in de [Wet op het primair onderwijs][ref1], met dien verstande dat daarvoor twee
      referentieniveaus Nederlandse taal en twee referentieniveaus rekenen worden vastgesteld,


      [ref1]: https://wetten.overheid.nl/BWBR0003420
    url: https://wetten.overheid.nl/BWBR0027679/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003420
  - number: 2.2.b
    text: |-
      het speciaal onderwijs, bedoeld in de [Wet op de expertisecentra][ref1], met dien verstande dat daarvoor twee
      referentieniveaus Nederlandse taal en twee referentieniveaus rekenen worden vastgesteld,


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0027679/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: 2.2.c
    text: |-
      de schoolsoorten, bedoeld in [artikel 5, onderdelen a tot en met d, van de Wet op het voortgezet onderwijs][ref1],
      met dien verstande dat verschillende referentieniveaus kunnen worden vastgesteld voor en binnen de leerwegen,
      bedoeld in de [artikelen 10][ref2], [10b][ref3] en [10d van die wet][ref4],


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
    url: https://wetten.overheid.nl/BWBR0027679/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '5'
