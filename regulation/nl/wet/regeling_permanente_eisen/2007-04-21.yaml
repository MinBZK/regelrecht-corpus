    text: |-
      De spiegels van bedrijfsauto's moeten zodanig zijn geplaatst dat de bestuurder in normale rijhouding de vereiste
      gezichtsvelden, zoals bepaald in de [artikelen 2.9.13 tot en met 2.9.16][ref1] kan overzien.


      [ref1]: https://wetten.overheid.nl/BWBR0009581#Artikel2.9.13
