  - number: 3.4.9
    text: |-
      1 Met de certificaten van goedkeuring als bedoeld in deze paragraaf worden gelijkgesteld verklaringen van
      goedkeuring afgegeven door een onafhankelijk keuringsinstelling in een andere lidstaat van de Europese Unie dan
      wel een staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij een daartoe strekkend of mede
      daartoe strekkend verdrag dat Nederland bindt, welke verklaringen zijn afgegeven op basis van onderzoekingen die
      een beschermingsniveau bieden dat ten minste gelijkwaardig is aan het niveau dat met de nationale onderzoekingen
      wordt nagestreefd.

      2 Met een bromfietsrollentestbank als bedoeld in deze paragraaf wordt gelijkgesteld een bromfietsrollentestbank
      die rechtmatig is vervaardigd of in de handel is gebracht in een andere lidstaat van de Europese Unie dan
      wel rechtmatig is vervaardigd in een staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij
      een daartoe strekkend of mede daartoe strekkend verdrag dat Nederland bindt, en die voldoen aan eisen die
      een beschermingsniveau bieden dat ten minste gelijkwaardig is aan het niveau dat met de nationale eisen wordt
      nagestreefd.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel3.4.9
  - number: 3.4.9a
    text: |-
      1 Een bromfietsrollentestbank is voorzien van de volgende controle-inrichtingen:

      a. een testaansluiting, en

      b. een inrichting waarmee automatisch voorafgaande aan een meting dan wel handmatig door de gebruiker een snelheid
      wordt gesimuleerd.

      2 Met de in het eerste lid, onderdeel b, bedoelde inrichting wordt de juiste werking van de bromfietsrollentestbank
      gecontroleerd. Tijdens deze controle worden alle circuits gecontroleerd, die invloed kunnen hebben op de
      nauwkeurigheid van de aanwijzing.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel3.4.9a
  - number: 3.4.9b
    text: |-
      De maximale fout bedraagt bij een snelheid:

      a. die niet groter is dan 50 km/h: 5 km/h;

      b. die groter is dan 50 km/h: 10%.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel3.4.9b
  - number: 3.4.9c
    text: Een bromfietsrollentestbank simuleert een weerstand die overeenkomt met de wegweerstand.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel3.4.9c
  - number: 3.4.9d
    text: |-
      De maximale fout in de meting van de omtreksnelheid van de rollen bedraagt één tiende van de maximale fout bedoeld
      in [artikel 3.4.9b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009581#Artikel3.4.9b
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel3.4.9d
    references:
      - id: ref1
        bwb_id: BWBR0009581
        artikel: 3.4.9b
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3.4.9e
    text: |-
      De maximale fout in de resulterende meetwaarde bedraagt 2,5% van de aangewezen waarde indien deze uitsluitend
      veroorzaakt wordt door dynamische effecten in de meetsignalen.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel3.4.9e
  - number: 3.4.9f
    text: |-
      1 Een bromfietsrollentestbank is voorzien van een digitale aanwijzing.

      2 Een bromfietsrollentestbank mag zijn voorzien van:

      a. een analoge aanwijzing in combinatie met een digitale aanwijzing, en

      b. een afdrukinrichting.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel3.4.9f
  - number: 3.4.9g
    text: |-
      Een bromfietsrollentestbank is van een zodanige constructie, dat op een veilige manier metingen kunnen worden
      verricht aan voertuigen waarvoor de bromfietsrollentestbank op grond van het aanwijsbereik is bestemd.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel3.4.9g
  - number: 3.4.9h
    text: Het oppervlak van de rollen is zodanig dat in de diameter niet meer dan 0,5% varieert.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel3.4.9h
  - number: 3.4.9i
    text: |-
      Een bromfietsrollentestbank stelt ten minste de volgende waarden vast:

      a. tijdens de test de momentele waarde van de snelheid, en

      b. na correcte uitvoering van de test de resulterende meetwaarde.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel3.4.9i
  - number: 3.4.9j
    text: Dynamische effecten zijn op een juiste wijze in de resulterende meetwaarde verwerkt.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel3.4.9j
  - number: 3.4.9k
    text: |-
      De afmetingen van de cijfers alsmede de helderheid en het contrast van de weergave van een digitale aanwijzing zijn
      zodanig, dat ook onder minder gunstige omstandigheden de aflezing op gemakkelijke wijze mogelijk is.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel3.4.9k
  - number: 3.4.9l
    text: |-
      Een gepresenteerde resulterende meetwaarde heeft betrekking op de hoogste waarde van het gemiddelde over minimaal 2
      seconden waarbij het voertuig zijn maximale prestatie levert.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel3.4.9l
  - number: 3.4.9m
    text: |-
      1 Indien een bromfietsrollentestbank is voorzien van een interne of externe afdrukinrichting worden tenminste de
      volgende gegevens vastgelegd:

      a. de datum en het tijdstip van de metingen aan het desbetreffende voertuig;

      b. de ingevoerde informatie betreffende de identificatie van het voertuig bestaande uit het kenteken of de
      meldcode, en

      c. de resulterende meetwaarde.

      2 Andere informatie dan bedoeld in het eerste lid mag worden geregistreerd voor zover deze niet leidt tot
      misleiding of misvatting.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel3.4.9m
  - number: 3.4.9n
    text: |-
      Indien een bromfietsrollentestbank bedoeld is voor installatie in de vloer, wordt een verzegeling aangebracht
      tussen de bromfietsrollentestbank en zijn fundering.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel3.4.9n
  - number: 3.4.9o
    text: |-
      In de handleiding behorende bij een bromfietsrollentestbank is opgenomen:

      a. een korte en overzichtelijke procedure voor het gebruik van het meetmiddel bij de uitvoering van de controle van
      een voertuig, waaronder in elk geval wordt verstaan een stroomschema;

      b. de uit te voeren controles voorafgaande aan of tijdens de metingen;

      c. de betekenis van een controleresultaat;

      d. een beschrijving van eventueel door het instrument gegeven meldingen, en

      e. de informatie benodigd voor een juiste interpretatie van het meetresultaat.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel3.4.9o
  - number: 3.4.9p
    text: |-
      Bij het gebruik van de bromfietsrollentestbank om de maximum constructiesnelheid te meten:

      a. wordt, bij in werking zijnde motor bij die versnelling waarbij de hoogste snelheid wordt bereikt, de gastoevoer
      zover geopend dat de bromfietsrollentestbank een maximale waarde aangeeft;

      b. wordt de motor van de bromfiets voldoende gekoeld;

      c. is de bromfietsrollentestbank goedgekeurd voor het testen van een bromfiets met het aantal aangedreven wielen
      dat overeenkomt met het aantal aangedreven wielen van het te testen voertuig, en

      d. wordt de meting uitgevoerd conform de bij de desbetreffende bromfietsrollentestbank behorende handleiding,
      mits de door de fabrikant in de handleiding opgenomen aanwijzingen niet strijdig zijn met de in deze en de vorige
      paragraaf opgenomen technische eisen en gebruikseisen. De handleiding vermeldt in ieder geval:

      1°. of de bromfiets bij gebruik van de bromfietsrollentestbank moet worden belast en zo ja, met hoeveel kilogram,
      en

      2°. welke invloed de bandenspanning heeft op de meting.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel3.4.9p
  - number: 3.4.10
    text: |-
      Het geluidsniveau moet worden gemeten met gebruikmaking van de in [artikel 3.4.11][ref1] genoemde meetapparatuur,
      waarbij de in [artikel 3.4.12][ref2] bedoelde meetcondities in acht moeten worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0009581#Artikel3.4.11
      [ref2]: https://wetten.overheid.nl/BWBR0009581#Artikel3.4.12
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel3.4.10
    references:
      - id: ref1
        bwb_id: BWBR0009581
        artikel: 3.4.11
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0009581
        artikel: 3.4.12
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: 3.4.11
    text: |-
      1 De geluidsniveaumeter moet ten minste voldoen aan het bepaalde in Publicatie nr. 651, eerste editie 1979,
      Geluidsniveaumeters, van de Internationale Electrotechnische Commissie (IEC) voor geluidsniveaumeters met de
      nauwkeurigheidsklasse Type 1.

      2 De calibratiegeluidsbron moet ten minste voldoen aan het bepaalde in Publicatie nr. 942, eerste editie 1988, van
      de IEC voor calibratiegeluidsbronnen met de nauwkeurigheidsklasse 1.

      3 De geluidsniveaumeter en de calibratiegeluidsbron moeten jaarlijks gecalibreerd en getoetst worden aan de eisen
      bedoeld in het eerste respectievelijk het tweede lid. Hiervan moeten verklaringen aanwezig zijn, afgegeven door NMI
      IJkwezen BV of door een door de minister gemachtigde instelling.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel3.4.11
  - number: 3.4.11a
    text: |-
      1 Voor de meting van het geluidsniveau van bromfietsen als bedoeld in
      [artikel 5.6.11, vierde lid, van het Voertuigreglement][ref1], moet de toerenteller een nauwkeurigheid hebben van
      ten minste 3%.

      2 Bij de toerenteller moet een verklaring aanwezig zijn ten aanzien van de nauwkeurigheid, welke niet ouder mag
      zijn dan twee jaar, en is afgegeven door NMI IJkwezen BV of door een door de Minister van Verkeer en Waterstaat
      gemachtigde instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.6.11
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel3.4.11a
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: 5.6.11
  - number: 3.4.12
    text: |-
      1 De meting vindt plaats in de open lucht.

      2 Het proefterrein mag niet blootstaan aan sterke akoestische storingen. Hieraan wordt voldaan indien het oppervlak
      van het terrein bestaat uit beton, asfalt, tegels of een vergelijkbaar hard materiaal.

      3 Voor de meting van het geluidsniveau van bromfietsen:

      a. als bedoeld in [artikel 5.6.11, vijfde lid, van het Voertuigreglement][ref1], mogen zich binnen een straal
      van 2,00 m van de microfoon van de geluidsniveaumeter, zoals weergegeven in figuur 5, geen personen of voorwerpen
      bevinden die niet noodzakelijk zijn voor de meting, waarbij de bromfiets op zodanige wijze wordt geplaatst dat de
      microfoon zich op ten minste 1,00 m afstand van eventueel aanwezige trottoirbanden bevindt;

      b. als bedoeld in [artikel 5.6.11, vierde lid, van het Voertuigreglement][ref2], moet het proefterrein minimaal de
      afmetingen van een rechthoek hebben, waarvan de zijden zich op ten minste 3,00 m afstand van de bromfiets bevinden,
      met uitzondering van het stuur van de bromfiets, zoals weergegeven in figuur 5a, waarbij geldt dat zich binnen deze
      rechthoek geen personen of voorwerpen mogen bevinden die niet noodzakelijk zijn voor de meting en de bromfiets op
      zodanige wijze binnen de rechthoek wordt geplaatst dat de microfoon zich op ten minste 1,00 m afstand van eventueel
      aanwezige trottoirbanden bevindt.

      4 De waarden die door de geluidsniveaumeter voor het omgevingsgeluid en de wind worden aangegeven moeten ten minste
      10 dB(A) beneden het gestelde maximum geluidsniveau zijn gelegen. Dit wordt gecontroleerd door vaststelling van het
      achtergrondgeluidsniveau voor en na de meting. De microfoon van de geluidsniveaumeter mag van een passende windkap
      worden voorzien, mits rekening wordt gehouden met de invloed daarvan op de gevoeligheid van de microfoon.

      5 Voor aanvang van de meting moet de motor van de bromfiets op bedrijfstemperatuur worden gebracht.

      6 De meting vindt plaats bij een stilstaande bromfiets.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.6.11
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5.6.11
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel3.4.12
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: 5.6.11
      - id: ref2
        bwb_id: BWBR0006746
        artikel: 5.6.11
  - number: 3.4.13
    text: |-
      De meting van het geluidsniveau wordt uitgevoerd aan de hand van de onderstaande wijze van keuren:

      a. voor aanvang van de meting wordt de geluidsniveaumeter ingesteld op de tijdweging "F" (voorheen aangeduid met
      "Fast") en de frequentieweging "A", bedoeld in de in [artikel 3.4.11, eerste lid][ref1], genoemde IEC publicatie;

      b. de motor is op bedrijfstemperatuur indien deze ongeveer vijftien minuten onder normale bedrijfsomstandigheden
      heeft gefunctioneerd;

      c. indien het niet mogelijk is de overbrenging te ontkoppelen, moet het aangedreven wiel vrij kunnen draaien.

      d. aan het begin en einde van iedere serie metingen moet de geluidsniveaumeter gecalibreerd worden
      volgens de aanwijzingen van de fabrikant met behulp van een calibratiegeluidsbron, welke voldoet aan
      [artikel 3.4.11, tweede lid en derde lid][ref2];

      e. de afwijking tussen het geluidsdrukniveau van de calibratiegeluidsbron en de aanwijzing van de
      geluidsniveaumeter mag niet groter zijn dan 1dB(A). Indien deze waarde bij de aanvangscontrole wordt overschreden
      moet de geluidsniveaumeter zodanig gejusteerd worden dat wel aan deze eis wordt voldaan. Als aan het einde van de
      serie metingen wordt geconstateerd dat deze afwijking groter is dan 1 dB(A), is de serie metingen ongeldig;

      f. voor bromfietsen als bedoeld in [artikel 5.6.11, vijfde lid, van het Voertuigreglement][ref3]: de microfoon van
      de geluidsniveaumeter wordt gericht naar de uitlaatmonding op niet minder dan 0,50 m afstand van het hart van de
      uitlaatmonding, waarbij een afwijking van 50 mm is toegestaan, in een vlak nagenoeg loodrecht op de richting van de
      gasstroom, op nagenoeg dezelfde hoogte boven het wegdek als de uitlaatmonding; indien deze hoogte minder dan 0,20 m
      is, wordt de microfoon op een hoogte van 0,20 m boven het wegdek gehouden;

      g. voor bromfietsen als bedoeld in [artikel 5.6.11, vierde lid, van het Voertuigreglement][ref4]: de microfoon van
      de geluidsniveaumeter moet in de volgende positie worden geplaatst, zoals weergegeven in figuur 5b:

      1°. ter hoogte van de uitlaatmonding, doch in ieder geval ten minste 0,20 m boven het wegdek;

      2°. het membraan van de microfoon is naar de uitlaatmonding gericht en bevindt zich op een afstand van 0,50 m,
      waarbij een afwijking van 50 mm is toegestaan;

      3°. de hoofdgevoeligheidsas van de microfoon loopt evenwijdig aan het wegdek en vormt een hoek van niet minder dan
      35° en niet meer dan 55° met het loodrechte vlak waarin de emissierichting van de uitlaatgassen ligt, waarbij de
      microfoon zo is geplaatst dat de afstand tussen de microfoon en de bromfiets het grootst is;

      4°. indien het uitlaatsysteem meerdere uitmondingen heeft, aangesloten op eenzelfde geluiddemper waarvan de
      middelpunten niet meer dan 0,30 m van elkaar zijn verwijderd, is de microfoon gericht op de uitmonding die zich
      het dichtst bij de omtrek van de bromfiets of zich het hoogst boven het wegdek bevindt, met dien verstande dat
      indien de middelpunten van de uitmondingen meer dan 0,30 m van elkaar zijn verwijderd, bij iedere uitmonding een
      afzonderlijke meting wordt verricht, waarbij alleen de hoogst gemeten waarde wordt aangehouden;

      h. voor bromfietsen als bedoeld in [artikel 5.6.11, vijfde lid van het Voertuigreglement][ref5]:

      1°. tijdens de meting wordt de gastoevoer geheel geopend, waarbij het toerental van de motor de maximum waarde moet
      bereiken, en snel gesloten;

      2°. de meting wordt zodanig verricht dat de tijd tussen het begin van het openen van de gastoevoer en het begin van
      het sluiten daarvan ten minste 2 seconden bedraagt. De geluidsmeting omvat ook de gehele duur van de vermindering
      van het toerental, tot het stationaire toerental weer is bereikt;

      i. voor bromfietsen als bedoeld in [artikel 5.6.11, vierde lid, van het Voertuigreglement][ref6]:

      1°. het toerental van de motor wordt op de waarde gebracht die op het kentekenbewijs dan wel in het
      kentekenregister voor de desbetreffende bromfiets is vermeld;

      2°. na het bereiken van de in onderdeel 1° bedoelde waarde, wordt de gastoevoer snel gesloten. De geluidsmeting
      omvat ook de gehele duur van de vermindering van het toerental, tot het stationaire toerental weer is bereikt;

      j. er wordt per meetpunt ten minste een serie van drie metingen verricht, waarbij:

      1°. de hoogste waarde die de geluidsniveaumeter heeft aangegeven, als meetwaarde per meting geldt;

      2°. de meetwaarde per meting op de meest nabijgelegen hele decibel wordt afgerond;

      3°. alleen meetwaarden die bij drie opeenvolgende metingen worden verkregen en onderling niet meer dan 2 dB(A)
      verschillen, mogen worden aangehouden;

      4°. als meetresultaat de hoogste van deze drie meetwaarden geldt.


