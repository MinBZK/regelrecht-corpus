  - number: 2.10.1
    text: Zijmarkeringslichten moeten zijn aangebracht aan elke zijkant van het voertuig.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.10.1
  - number: 2.10.2
    text: |-
      1 Zijmarkeringslichten moeten op de volgende wijze zijn geplaatst:

        - indien het voertuig langer is dan 6,00 m moet ten minste één zijmarkeringslicht zich in het middelste derde
      gedeelte van het voertuig bevinden;
        - de onderlinge afstand tussen de zijmarkeringslichten mag niet meer dan 3,00 m bedragen, tenzij dat in verband
      met de constructie van het voertuig niet mogelijk is, in welk geval deze afstand meer dan 3,00 m doch niet meer dan
      4,00 m mag bedragen;
        - de afstand van het meest naar voren gelegen zijmarkeringslicht tot de uiterste voorzijde van het voertuig mag
      niet meer dan 3,00 m bedragen, tenzij dat in verband met de constructie van het voertuig niet mogelijk is, in welk
      geval deze afstand meer dan 3,00 m doch niet meer dan 4,00 m mag bedragen.
        - de afstand van het meest naar achteren gelegen zijmarkeringslicht tot de uiterste achterzijde van het voertuig
      mag niet meer dan 1,00 m bedragen.

      2 Indien het voertuig niet langer is dan 6,00 m, dan wel in het kentekenregister of op het kentekenbewijs wordt
      aangeduid als kaal chassis, mag zich, bij verdeling van de lengte van het voertuig in drie gelijke delen, één
      zijmarkeringslicht op het voorste derde gedeelte en één zijmarkeringslicht op het achterste derde gedeelte van de
      lengte van het voertuig bevinden.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.10.2
  - number: 2.10.3
    text: |-
      Zijmarkeringslichten moeten zijn aangebracht op een hoogte van niet minder dan 0,25 m doch niet meer dan
      1,50 m boven het wegdek. Indien dat in verband met de constructie van het voertuig niet mogelijk is, mogen de
      zijmarkeringslichten zijn aangebracht op een hoogte van meer dan 1,50 m doch niet meer dan 2,10 m boven het wegdek.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.10.3
  - number: 2.10.4
    text: |-
      De in deze paragraaf gestelde eisen worden getoetst

        - door middel van visuele controle;
        - in geval van twijfel te meten met een meetmiddel van voldoende bereik.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.10.4
  - number: 2.10.5
    text: Niet-driehoekige ambergele retroreflectoren moeten zijn aangebracht aan elke zijkant van het voertuig.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.10.5
  - number: 2.10.6
    text: |-
      Niet-driehoekige ambergele retroreflectoren moeten op de volgende wijze zijn geplaatst:

        - indien het voertuig langer is dan 6,00 m moet ten minste één retroreflector zich in het middelste derde gedeelte
      van het voertuig bevinden;
        - de onderlinge afstand tussen de retroreflectoren mag niet meer dan 3,00 m bedragen, tenzij dat in verband met de
      constructie van het voertuig niet mogelijk is, in welk geval deze afstand meer dan 3,00 m doch niet meer dan 4,00 m
      mag bedragen;
        - de afstand van de meest naar voren gelegen retroreflector tot de uiterste voorzijde van het voertuig mag niet
      meer dan 3,00 m bedragen, tenzij dat in verband met de constructie van het voertuig niet mogelijk is, in welk geval
      deze afstand meer dan 3,00 m doch niet meer dan 4,00 m mag bedragen.
        - de afstand van de meest naar achteren gelegen retroreflector tot de uiterste achterzijde van het voertuig mag
      niet meer dan 1,00 m bedragen.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.10.6
  - number: 2.10.7
    text: |-
      Niet-driehoekige ambergele retroreflectoren moeten zijn aangebracht op een hoogte van niet minder dan 0,25 m doch
      niet meer dan 1,50 m boven het wegdek.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.10.7
  - number: 2.10.8
    text: |-
      De in deze afdeling gestelde eisen worden getoetst:

        - door middel van visuele controle, en
        - door in geval van twijfel te meten met een meetmiddel van voldoende bereik.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.10.8
  - number: 2.10.9
    text: |-
      De volgende voertuigen behoeven niet te zijn voorzien van een markering aan de achterzijde:

        - kraanwagens: voertuigen, uitgerust met een hijsinstallatie, die uitsluitend in verband met deze hijsinstallatie
      kunnen worden gebruikt;
        - ladderwagens: voertuigen, uitgerust met één of meer, al dan niet uitschuifbare, ladderconstructies, die
      uitsluitend in verband met deze ladderconstructies kunnen worden gebruikt;
        - hoogwerkers met bak achter het voertuig: voertuigen, uitgerust met een hefbare werkvloer of werkbak, die bestemd
      zijn voor het verrichten van werkzaamheden aan hoge objecten en waarvan de werkvloer of werkbak zich in niet
      geheven stand op geringe hoogte boven het wegdek achter de achterzijde van het voertuig bevindt;
        - haspelwagens: voertuigen, ingericht voor het vervoer van op haspels opgerolde kabels of slangen;
        - voertuigen, ingericht voor het vervoeren, laden en lossen van afzetbakken, die bestemd zijn voor het transport
      van (huis)vuil en die door middel van een ketting worden op- en afgezet;
        - betonpompen: voertuigen, uitgerust met een pompinstallatie en een bijbehorend buizenstelsel waardoor vloeibaar
      beton wordt gepompt;
        - teersproeiers: voertuigen, uitgerust met een installatie waarmee bitumeuze vloeistof op het wegdek kan worden
      gesproeid;
        - cartransporters: voertuigen, ingericht voor het vervoer van één of meer voertuigen;
        - boottrailers: voertuigen, ingericht voor het vervoer van één of meer boten;
        - voertuigen, ingericht voor het ophalen van huisvuil en ander afval en die hoofdzakelijk aan de achterzijde worden
      geladen en gelost;
        - diepladers: aanhangwagens, ingericht voor het vervoer van ondeelbare lading en waarvan de laadvloer zich bevindt
      op niet meer dan 0,15 m boven het hart van de assen;
        - semi-diepladers: voertuigen, waarvan de uiterste achterzijde van de laadvloer zich op niet meer dan 0,55 m boven
      het wegdek bevindt;
        - bedrijfsauto's, ingericht voor het vervoer van in de lengte ondeelbare lading en voorzien van een draaischamel;
        - dolly's:
        - kale chassis: voertuigen zonder carrosserie-opbouw waarvan het gedeelte achter de bestuurdersplaats of
      bestuurderscabine, slechts bestaat uit het chassis waarop de carrosserie-opbouw alsnog moet worden aangebracht;
        - voertuigen, ingericht voor het vervoeren, laden en lossen van wissellaadbakken en die aan de achterzijde zijn
      voorzien van een wegklapbare laadklep.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.10.9
  - number: 2.10.10
    text: De in deze paragraaf gestelde eisen worden getoetst door middel van visuele controle.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.10.10
  - number: 2.10.11
    text: |-
      De bevestiging van de verlichtingsarmaturen genoemd in [hoofdstuk 5 van het Voertuigreglement][ref1] moet voldoen
      aan de eisen ten aanzien van corrosie bedoeld in [titel 2][ref2] van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0009581#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.10.11
    references:
      - id: ref1
        bwb_id: BWBR0006746
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0009581
        hoofdstuk: '2'
  - number: 2.10.12
    text: |-
      1 De glazen van de verlichtingsarmaturen mogen niet zijn bespoten, geverfd of beplakt.

      2 De glazen van de verlichtingsarmaturen aan de achterzijde van het voertuig, met uitzondering van de
      achteruitrijlichten, mogen geen barsten of gaten vertonen waardoor wit licht naar achteren kan worden gestraald.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.10.12
  - number: 2.10.13
    text: De in deze paragraaf gestelde eisen worden getoetst door middel van visuele controle.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.10.13
  - number: 2.10.14
    text: |-
      1 Het voor het dimlicht bestemde deel van de koplampreflector mag:

        - geen roestvorming vertonen;
        - voor niet meer dan 25% op andere wijze zijn aangetast.

      2 Het eerste lid is niet van toepassing op het horizontale gedeelte van de reflector.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.10.14
  - number: 2.10.15
    text: De in deze paragraaf gestelde eisen worden getoetst door middel van visuele controle.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.10.15
  - number: 2.10.16
    text: |-
      1 Lijn- en contourmarkering dienen op de volgende wijze te zijn geïnstalleerd:

        - de markering mag ononderbroken of onderbroken worden aangebracht, in geval van onderbroken markering mag de
      afstand tussen de afzonderlijke delen niet groter zijn dan 50% van de lengte van het kortste deel;
        - de afstand tussen de markering aan de achterzijde van het voertuig en de verplichte remlichten moet minimaal 200
      mm bedragen.

      2 Lijnmarkering dient voorts:

        - parallel of zo veel mogelijk parallel aan het wegdek te worden aangebracht en ten minste 80% van de totale lengte
      of breedte van het voertuig weer te geven;
        - op een hoogte van minimaal 250 mm en maximaal 1500 mm boven het wegdek te zijn aangebracht, dan wel, indien dit
      in verband met de constructie van het voertuig niet anders mogelijk is, maximaal 2100 mm boven het wegdek te zijn
      aangebracht.

      3 Contourmarkering dient voorts: a. zoveel mogelijk de totale omtrek van het voertuig weer te geven; d. waar het
      betreft de onderste lijn van de markering op een hoogte van minimaal 250 mm en maximaal 1500 mm boven het wegdek te
      zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.10.16
  - number: 2.10.17
    text: |-
      Het goedkeuringsmerk voor het markeringsmateriaal dient onuitwisbaar te zijn en te zijn vormgegeven overeenkomstig
      het voorbeeld in figuur 31-a.

      Waarbij de volgende codes de daarbij vermelde betekenis hebben:

      104 R: aanduiding goedkeuring volgens ECE-Reglement nr. 104; 0001148: variabel typegoedkeuringsnummer;

      1: variabele aanduiding van het land dat goedkeuring heeft verleend ("4" is Nederland);

      C: classificatie van het gebruikte materiaal, waarbij klasse C staat voor goedgekeurd lijn- en
      contourmarkeringsmateriaal en klasse D en E staan voor goedgekeurd retroreflecterend materiaal dat gebruikt wordt
      voor de letters en afbeeldingen binnen de contourmarkering.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.10.17
  - number: 2.10.18
    text: De in deze paragraaf gestelde eisen worden getoetst door middel van visuele controle.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.10.18
  - number: 2.10.19
    text: |-
      Dimlichten met gasontladingslichtbronnen zijn voorzien van een koplampreinigingsinstallatie waarmee het gehele of
      een deel van het lichtdoorlatende gedeelte van de koplamp wordt gereinigd.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.10.19
  - number: 2.10.20
    text: |-
      Bij dimlichten met gasontladingslichtbronnen blijven de gasontladingslichtbronnen ingeschakeld wanneer het groot
      licht brandt.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.10.20
  - number: 2.10.21
    text: |-
      1 Dimlichten met gasontladingslichtbronnen zijn voorzien van een niveauregeling, welke de verticale helling van de
      lichtbundel automatisch aanpast aan de belading van het voertuig.

      2 Het bepaalde in het eerste lid is niet van toepassing op voertuigen waarbij de verticale helling van de
      lichtbundel niet wordt beïnvloed door de belading van het voertuig.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.10.21
  - number: 2.11.1
    text: |-
      De bevestiging van de koppeling genoemd in [hoofdstuk 5 van het Voertuigreglement][ref1] moet ten aanzien van
      corrosie voldoen aan [titel 2][ref2] van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0009581#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.11.1
    references:
      - id: ref1
        bwb_id: BWBR0006746
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0009581
        hoofdstuk: '2'
  - number: 2.11.2
    text: |-
      Indien de bedrijfsauto is voorzien van een schotelkoppeling met een verticaal beweegbare pen, mag:

        - de onvlakheid van de schotel niet meer dan 2,5 mm bedragen;
        - de diepte van groeven langer dan 100 mm niet meer dan 2,5 mm bedragen.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.11.2
  - number: 2.11.3
    text: |-
      1 Indien de oplegger is voorzien van een koppelingspen zoals weergegeven in figuur 32, moet de koppelingspen
      respectievelijk de koppelingsplaat voldoen aan de volgende eisen:

        - de inwendige diameter van de koppelingspen mag niet meer dan 112 mm bedragen;
        - binnen een cirkel met een straal van 0,26 m gemeten vanuit het hart van de koppelingspen mag: 1°. de onvlakheid
      van de koppelingsplaat niet meer dan 2,5 mm bedragen, zoals weergegeven in de figuren 33 en 34; 2°. in de
      koppelingsplaat geen deuk voorkomen; 3°. de diepte van groeven in de koppelingsplaat langer dan 100 mm niet meer
      dan 2,5 mm bedragen.

      2 Het eerste lid geldt niet voor de van fabriekswege aangebrachte gaten zoals ontwateringsgaten.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.11.3
  - number: 2.11.4
    text: |-
      Indien de bedrijfsauto is voorzien van een haakkoppeling zoals weergegeven in figuur 35:

        - moet deze zijn voorzien van een goed werkende sluit- en borginrichting;
        - mag de lengte van de inhaakruimte niet meer dan 49 mm bedragen.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.11.4
  - number: 2.11.5
    text: |-
      Indien de aanhangwagen is voorzien van een trekoog welke is bestemd voor een haakkoppeling als genoemd in
      [artikel 2.11.4][ref1], moet de diameter van het trekoog ten minste 38 mm bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0009581#Artikel2.11.4
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.11.5
    references:
      - id: ref1
        bwb_id: BWBR0009581
        artikel: 2.11.4
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.11.6
    text: |-
      1 Indien een oplegger met een toegestane maximum massa van meer dan 6000 kg of met een maximum last onder de
      koppeling van meer dan 3000 kg is voorzien van een 2 inch koppelingspen en indien een oplegger is voorzien
      van een 3,5 inch koppelingspen mag binnen een cirkel met een straal van 0,45 m gemeten vanuit het hart van de
      koppelingspen:

        - de onvlakheid van de koppelingsplaat niet meer dan 3,5 mm bedragen, zoals weergegeven in de figuren 36, 37 en 38;
        - de diepte van groeven in de koppelingsplaat langer dan 100 mm niet meer dan 2,5 mm bedragen;
        - in elk kwadrant van de koppelingsplaat, links en rechts achter de koppelingspen, een deuk voorkomen van 5000 mm2
      ongeacht de diepte, onverminderd onderdeel f, zoals weergegeven in figuur 39;
        - in elk kwadrant van de koppelingsplaat, links en rechts voor de koppelingspen, dat is begrensd tot 0,30 m gemeten
      vanaf de hartlijn van de koppelingspen, een deuk voorkomen van 5000 mm2 ongeacht de diepte, onverminderd onderdeel
      f, zoals weergegeven in figuur 39;
        - in het gedeelte aan de voorzijde van de koppelingsplaat, op een afstand van meer dan 0,30 m gemeten vanaf de
      hartlijn van de koppelingspen, een deuk voorkomen met een diepte van maximaal 7,5 mm, ongeacht de grootte, zoals
      weergegeven in figuur 39;
        - in de gedeelten gelegen aan de uiterste linker- en rechterzijde van de koppelingsplaat, met elk een afmeting van
      100 mm in breedterichting en 200 mm in lengterichting, geen deuk voorkomen, zoals weergegeven in figuur 39.

      2 Het eerste lid geldt niet voor de van fabriekswege aangebrachte gaten zoals ontwateringsgaten.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.11.6
  - number: 2.11.7
    text: |-
      1 Indien een oplegger met een toegestane maximum massa van niet meer dan 6000 kg of met een maximum last onder de
      koppeling van niet meer dan 3000 kg is voorzien van een 2 inch koppelingspen mag binnen een cirkel met een straal
      van 0,30 m gemeten vanuit het hart van de koppelingspen:

        - de onvlakheid van de koppelingsplaat niet meer dan 3,5 mm bedragen, zoals weergegeven in de figuren 40, 41 en 42;
        - de diepte van groeven in de koppelingsplaat langer dan 100 mm niet meer dan 2,5 mm bedragen;
        - in elk kwadrant van de koppelingsplaat een deuk voorkomen van 5000 mm2 ongeacht de diepte, onverminderd onderdeel
      d, zoals weergegeven in figuur 43;
        - in de gedeelten gelegen aan de uiterste linker- en rechterzijde van de koppelingsplaat, met elk een afmeting van
      100 mm in breedterichting en 200 mm in lengterichting, geen deuk voorkomen, zoals weergegeven in figuur 43.

      2 Het eerste lid geldt niet voor de van fabriekswege aangebrachte gaten zoals ontwateringsgaten.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.11.7
  - number: 2.11.8
    text: |-
      De in deze titel gestelde eisen worden getoetst:

        - door middel van visuele controle, en
        - door in geval van twijfel te meten met een meetmiddel van voldoende bereik.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.11.8
  - number: 3.1.1
    text: |-
      Dit hoofdstuk is van toepassing op:

      a. motorfietsen,

      b. driewielige motorrijtuigen met een massa van het ledig voertuig van niet meer dan 400 kg,

      c. bromfietsen,

      d. motorrijtuigen met beperkte snelheid,

      e. landbouw- of bosbouwtrekkers,

      f. fietsen,

      g. gehandicaptenvoertuigen,

      h. aanhangwagens met een toegestane maximum massa van niet meer dan 3500 kg achter personenauto's, bedrijfsauto's
      en driewielige motorrijtuigen,

      i. aanhangwagens achter landbouwtrekkers en achter motorrijtuigen met beperkte snelheid,

      j. aanhangwagens achter fietsen op twee wielen, alsmede

      k. wagens.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel3.1.1
  - number: 3.2.1
    text: |-
      Het geluidsniveau moet worden gemeten met gebruikmaking van de in de [artikelen 3.2.2][ref1] en [3.2.3][ref2]
      genoemde meetapparatuur, waarbij de in [artikel 3.2.4][ref3] bedoelde meetcondities in acht moeten worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0009581#Artikel3.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0009581#Artikel3.2.3
      [ref3]: https://wetten.overheid.nl/BWBR0009581#Artikel3.2.4
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel3.2.1
    references:
      - id: ref1
        bwb_id: BWBR0009581
        artikel: 3.2.2
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009581
        artikel: 3.2.3
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0009581
        artikel: 3.2.4
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.2.2
    text: |-
      1 De geluidsniveaumeter moet ten minste voldoen aan het bepaalde in Publicatie nr. 651, eerste editie 1979,
      Geluidsniveaumeters, van de Internationale Electrotechnische Commissie (IEC) voor geluidsniveaumeters met de
      nauwkeurigheidsklasse Type 1.

      2 De calibratiegeluidsbron moet ten minste voldoen aan het bepaalde in Publicatie nr. 942, eerste editie 1988, van
      de IEC voor calibratiegeluidsbronnen met de nauwkeurigheidsklasse 1.

      3 De geluidsniveaumeter en de calibratiegeluidsbron moeten jaarlijks gecalibreerd en getoetst worden aan de eisen
      bedoeld in het eerste respectievelijk het tweede lid. Hiervan moeten verklaringen aanwezig zijn, afgegeven door NMI
      IJkwezen BV of door een door de minister gemachtigde instelling.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel3.2.2
  - number: 3.2.3
    text: |-
      1 De toerenteller moet een nauwkeurigheid hebben van ten minste 3%.

      2 Bij de toerenteller moet een verklaring aanwezig zijn ten aanzien van de nauwkeurigheid, welke niet ouder mag
      zijn dan twee jaar, afgegeven door NMI IJkwezen BV of door een door de minister gemachtigde instelling.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel3.2.3
  - number: 3.2.4
    text: |-
      1 De meting vindt plaats in de open lucht.

      2 Het proefterrein mag niet blootstaan aan sterke akoestische storingen. Hieraan wordt voldaan indien het oppervlak
      van het terrein bestaat uit beton, asfalt, tegels of een vergelijkbaar hard materiaal.

      3 Het proefterrein moet minimaal de afmetingen van een rechthoek hebben, waarvan de zijden zich op ten minste 3,00
      m afstand van de motorfiets bevinden, met uitzondering van het stuur van de motorfiets, zoals weergegeven in figuur
      1. Binnen deze rechthoek mogen zich geen personen of voorwerpen bevinden die niet noodzakelijk zijn voor de meting.
      De motorfiets wordt op zodanige wijze binnen de rechthoek geplaatst dat de microfoon zich op ten minste 1,00 m
      afstand van eventueel aanwezige trottoirbanden bevindt.

      4 De waarden die door de geluidsniveaumeter voor het omgevingsgeluid en de wind worden aangegeven, moeten ten
      minste 10 dB(A) beneden het geluidsniveau zijn gelegen dat in het kentekenregister wordt vermeld. Dit wordt
      gecontroleerd door vaststelling van het achtergrondgeluidsniveau voor en na de meting. De microfoon van de
      geluidsniveaumeter mag van een passende windkap worden voorzien, mits rekening wordt gehouden met de invloed
      daarvan op de gevoeligheid van de microfoon.

      5 Voor aanvang van de meting moet de motor van de motorfiets op bedrijfstemperatuur worden gebracht.

      6 De meting vindt plaats bij een stilstaande motorfiets.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel3.2.4
  - number: 3.2.5
    text: |-
      De meting van het geluidsniveau wordt uitgevoerd aan de hand van de onderstaande wijze van keuren:

        - voor aanvang van de meting wordt de geluidsniveaumeter ingesteld op de tijdweging "F" (voorheen aangeduid met
      "Fast") en de frequentieweging "A", bedoeld in de in artikel 3.2.2, eerste lid, genoemde IEC publicatie;
        - de motor is op bedrijfstemperatuur indien deze ongeveer vijftien minuten onder normale bedrijfsomstandigheden
      heeft gefunctioneerd;
        - indien het niet mogelijk is de overbrenging te ontkoppelen, moet het aangedreven wiel vrij kunnen draaien;
        - aan het begin en einde van iedere serie metingen moet de geluidsniveaumeter gecalibreerd worden volgens de
      aanwijzingen van de fabrikant met behulp van een calibratiegeluidsbron, welke voldoet aan artikel 3.2.2, tweede en
      derde lid;
        - de afwijking tussen het geluidsdrukniveau van de calibratiegeluidsbron en de aanwijzing van de geluidsniveaumeter
      mag niet groter zijn dan 1 dB(A). Indien deze waarde bij de aanvangscontrole wordt overschreden moet de
      geluidsniveaumeter zodanig gejusteerd worden dat wel aan deze eis wordt voldaan. Als aan het einde van de serie
      metingen wordt geconstateerd dat deze afwijking groter is dan 1 dB(A), is de serie metingen ongeldig;
        - de microfoon van de geluidsniveaumeter moet in de volgende positie worden geplaatst, zoals weergegeven in figuur
      2: 1°. ter hoogte van de uitlaatmonding, in ieder geval ten minste 0,20 m boven het wegdek; 2°. het membraan van de
      microfoon is naar de uitlaatmonding gericht en bevindt zich op een afstand van 0,50 m (waarbij een afwijking van 50
      mm is toegestaan); 3°. de hoofdgevoeligheidsas van de microfoon loopt evenwijdig aan het wegdek en vormt een hoek
      van niet minder dan 35° en niet meer dan 55° met het loodrechte vlak waarin de emissierichting van de uitlaatgassen
      ligt; de microfoon is zo geplaatst dat de afstand tussen de microfoon en de motorfiets het grootst is; 4°. indien
      het uitlaatsysteem meerdere uitmondingen heeft, aangesloten op eenzelfde geluiddemper waarvan de middelpunten niet
      meer dan 0,30 m van elkaar zijn verwijderd, is de microfoon gericht op de uitmonding die zich het dichtst bij de
      omtrek van de motorfiets of zich het hoogst boven het wegdek bevindt. Indien de middelpunten van de uitmondingen
      meer dan 0,30 m van elkaar zijn verwijderd, wordt bij iedere uitmonding een afzonderlijke meting verricht, waarbij
      alleen de hoogst gemeten waarde wordt aangehouden;
        - het toerental van de motor wordt op de waarde gebracht die in het kentekenregister voor de betreffende
      motorfiets is vermeld indien in het kentekenregister een dB(A)waarde en een toerental zijn vermeld. Indien in het
      kentekenregister geen dB(A)waarde is vermeld, maar wel het toerental waarbij het maximumvermogen van de betreffende
      motorfiets wordt bereikt (toerental n), is vermeld, dan wordt de waarde vastgesteld op: - 3/4 n, indien toerental n
      lager dan of gelijk is aan 5000 omwentelingen/minuut; en
        - ½ n, indien toerental n hoger is dan 5000 omwentelingen/minuut. In de overige gevallen wordt de waarde
      vastgesteld volgens onderstaande tabel: Bouwjaar voor 1960: 2-takt: 2250 omwentelingen/minuut; 4-takt: 2000
      omwentelingen/minuut. Bouwjaar vanaf 1960: 2-takt: 4500 omwentelingen/minuut; 4-takt: 4000 omwentelingen/minuut.
        - na het bereiken van de in onderdeel g vermelde waarde wordt de gashandel snel losgelaten. De tijdsduur van de
      meting van het geluidsniveau omvat de periode, waarin het toerental constant wordt gehouden, en de gehele duur van
      de vermindering van het toerental tot het stationaire toerental weer is bereikt;
        - er wordt per meetpunt ten minste een serie van drie metingen verricht, waarbij: 1°. de hoogste waarde die de
      geluidsniveaumeter heeft aangegeven, als meetwaarde per meting geldt; 2°. de meetwaarde per meting op de meest
      nabijgelegen hele decibel wordt afgerond; 3°. alleen meetwaarden die bij drie opeenvolgende metingen worden
      verkregen en onderling niet meer dan 2 dB(A) verschillen, mogen worden aangehouden; 4°. als meetresultaat de
      hoogste van deze drie meetwaarden geldt.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel3.2.5
  - number: 3.2.6
    text: |-
      1 Motorfietsen mogen niet zijn voorzien van banden met de vermelding "NOT FOR HIGHWAY USE" of van banden waarop de
      letters "NHS" (Not for Highway Service) achter de maataanduiding zijn vermeld.

      2 Indien het voorwiel is voorzien van een radiaalband, mag het achterwiel niet zijn voorzien van een diagonaalband.

      3 Banden waarop de draairichting door middel van een pijl is aangegeven, moeten dienovereenkomstig zijn
      aangebracht.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel3.2.6
  - number: 3.3.1
    text: |-
      Driewielige motorrijtuigen met een massa van het ledig voertuig van niet meer dan 400 kg moeten voldoen aan de in
      hoofdstuk 2 ten aanzien van driewielige motorrijtuigen opgenomen eisen.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel3.3.1
  - number: 3.4.6a
    text: |-
      1 In deze paragraaf wordt verstaan onder:

      a. bromfietsrollentestbank: meetmiddel waarmee de maximum constructiesnelheid van een bromfiets kan worden
      onderzocht door het meten van de omtreksnelheid van de rollen terwijl de rollen een weerstand opwekken
      overeenkomend met de weerstand die het voertuig op de weg zou ondervinden;

      b. bromfiets: voertuig als bedoeld in [artikel 1, eerste lid, onderdeel e, van de Wegenverkeerswet 1994][ref1];

      c. gemiddelde waarde: rekenkundig gemiddelde van op vaste tijdsafstanden bepaalde momentele waarden, in aantal
      voldoende voor de bepaling van het werkelijke gemiddelde;

      d. resulterende meetwaarde: de door de bromfietsrollentestbank aangewezen of afgedrukte waarde die als uiteindelijk
      resultaat van de test wordt gepresenteerd;

      e. rotatieperiode: tijdsperiode overeenkomend met een omwenteling van een voertuigwiel met een voor de
      desbetreffende bromfietsrollentestbank relevante afmeting;

      f. wegweerstand: de sommatie van de bij een bepaalde snelheid optredende rolweerstand en luchtweerstand onder de
      condities als beschreven in Bijlage I van de [Richtlijn 95/1/EG](31995L0001);

      g. luchtweerstand: weerstand ten gevolge van de bij een bepaalde snelheid door de lucht opgewekte kracht op een
      voertuig met bestuurder;

      h. rolweerstand: weerstand ten gevolge van het rollen van een voertuigwiel over de weg.

      2 Onder de volgende begrippen wordt in deze paragraaf verstaan hetgeen hieronder wordt verstaan in de
      [Voorschriften meetmiddelen 1997][ref2]:

      a. testaansluiting;

      b. primair meetsignaal;

      c. fout;

      d. maximale fout;

      e. digitale aanwijzing;

      f. analoge aanwijzing;

      g. aanwijsbereik;

      h. eerste keuring;

      i. certificaat van eerste keuring;

      j. herkeuring;

      k. certificaat van herkeuring;

      l. typekeuring;

      m. typekeuringscertificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009237
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel3.4.6a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0009237
  - number: 3.4.7
    text: |-
      De maximum constructiesnelheid wordt gemeten met behulp van een bromfietsrollentestbank die voldoet aan de in deze
      paragraaf gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel3.4.7
  - number: 3.4.8
    text: |-
      1 Een bromfietsrollentestbank is typegoedgekeurd aan de hand van de in de [artikelen 1.11 tot en met 1.14][ref1]
      en [1.17 tot en met 1.19, van de Voorschriften meetmiddelen 1997][ref2], opgenomen algemene eisen, met dien
      verstande dat het stoorniveau van de elektromagnetische instraling, bedoeld in [artikel 1.18, onderdeel a][ref3],
      drie bedraagt, en de in deze paragraaf opgenomen specifieke eisen, ten bewijze waarvan door NMi Certin B.V een
      typekeuringscertificaat wordt afgegeven.

      2 De bromfietsrollentestbank ondergaat een eerste keuring en na verloop van de in
      [artikel 1.8 van de Voorschriften meetmiddelen 1997][ref4] genoemde termijn een herkeuring, ten bewijze waarvan
      door NMi Certin B.V. een certificaat van eerste keuring respectievelijk van herkeuring wordt afgegeven.

      3 Op het certificaat van eerste keuring, het certificaat van herkeuring en het typekeuringscertificaat is
      [hoofdstuk 1, paragrafen 2.2][ref5] en [2.3, van de Voorschriften meetmiddelen 1997][ref6] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Artikel1.11
      [ref2]: https://wetten.overheid.nl/BWBR0009237#Artikel1.17
      [ref3]: https://wetten.overheid.nl/BWBR0009237#Artikel1.18
      [ref4]: https://wetten.overheid.nl/BWBR0009237#Artikel1.8
      [ref5]: https://wetten.overheid.nl/BWBR0009237#Paragraaf2.2
      [ref6]: https://wetten.overheid.nl/BWBR0009237#Paragraaf2.3
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel3.4.8
