  - number: 3.10.1
    text: |-
      1 Zijmarkeringslichten moeten zijn aangebracht aan elke zijkant van het voertuig.

      2 Zijmarkeringslichten moeten in de lengterichting van het voertuig als volgt zijn aangebracht:

        - ten minste één zijmarkeringslicht moet zich in het middelste derde gedeelte van het voertuig bevinden;
        - de onderlinge afstand tussen de zijmarkeringslichten mag niet meer dan 3,00 m bedragen, tenzij dat door de
      constructie van het voertuig niet mogelijk is, in welk geval deze afstand meer dan 3,00 m doch niet meer dan 4,00 m
      mag bedragen;
        - de afstand van het meest naar voren gelegen zijmarkeringslicht tot de uiterste voorzijde van het voertuig mag
      niet meer dan 3,00 m bedragen;
        - de afstand van het meest naar achter gelegen zijmarkeringslicht tot de uiterste achterzijde van het voertuig mag
      niet meer dan 1,00 m bedragen.

      3 Zijmarkeringslichten moeten zijn aangebracht op een hoogte van niet minder dan 0,35 m en niet meer dan 1,50 m
      boven het wegdek. Indien het door de constructie van het voertuig niet mogelijk is de zijmarkeringslichten aan te
      brengen op een hoogte van niet meer dan 1,50 m boven het wegdek, mogen zij op een hoogte van meer dan 1,50 m doch
      niet meer dan 2,10 m boven het wegdek zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel3.10.1
