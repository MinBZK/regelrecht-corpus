  - number: 2.9.16
    text: |-
      1 De aan de passagierszijde gemonteerde breedtespiegel van de bedrijfsauto die in gebruik is genomen voor
      26 januari 2008 moet zodanig zijn geplaatst dat de bestuurder hiermee het gezichtsveld op grondniveau kan overzien,
      zoals weergegeven in figuur 23, waarbij de bestuurder:

      a. een punt op het wegdek, gelegen op 3,00 m achter de oogpunten van de bestuurder en 2,50 m naast het verlengde
      van de rechterzijkant van het voertuig kan zien,

      b. een punt op het wegdek, gelegen op 15,00 m achter de oogpunten van de bestuurder en 12,50 m naast het verlengde
      van de rechterzijkant van het voertuig kan zien,

      c. een punt op het wegdek, gelegen op 4,00 m achter de oogpunten van de bestuurder en op de projectie van de
      rechterzijkant van het voertuig of het verlengde van deze projectie kan zien,

      d. een punt op het wegdek, gelegen op 25,00 m achter de oogpunten van de bestuurder en in het verlengde van de
      rechterzijkant van het voertuig kan zien, en

      e. tevens recht naar achteren kan kijken.

      2 De aan de passagierszijde gemonteerde breedtespiegel van de bedrijfsauto die in gebruik is genomen na 25 januari
      2008 moet zodanig zijn geplaatst dat de bestuurder hiermee het gezichtsveld op grondniveau kan overzien, zoals
      weergegeven in figuur 23-1, waarbij de bestuurder:

      a. een punt op het wegdek, gelegen op 1,50 m achter de oogpunten van de bestuurder en 4,50 m naast het verlengde
      van de rechterzijkant van het voertuig kan zien,

      b. een punt op het wegdek, gelegen op 10,00 m achter de oogpunten van de bestuurder en 15,00 m naast het verlengde
      van de rechterzijkant van het voertuig kan zien,

      c. een punt op het wegdek, gelegen op 25,00 m achter de oogpunten van de bestuurder en 15,00 m naast het verlengde
      van de rechterzijkant van het voertuig kan zien,

      d. een punt op het wegdek, gelegen op 25,00 m achter de oogpunten van de bestuurder en op het verlengde van de
      projectie van de rechterzijkant van het voertuig kan zien, en

      e. tevens recht naar achteren kan kijken.

      3 De aan de bestuurderszijde gemonteerde breedtespiegel van de bedrijfsauto die in gebruik is genomen na 25 januari
      2008 moet zodanig zijn geplaatst dat de bestuurder hiermee het gezichtsveld op grondniveau kan overzien, zoals
      weergegeven in figuur 23-1, waarbij de bestuurder:

      a. een punt op het wegdek, gelegen op 1,50 m achter de oogpunten van de bestuurder en 4,50 m naast het verlengde
      van de linkerzijkant van het voertuig kan zien,

      b. een punt op het wegdek, gelegen op 10,00 m achter de oogpunten van de bestuurder en 15,00 m naast het verlengde
      van de linkerzijkant van het voertuig kan zien,

      c. een punt op het wegdek, gelegen op 25,00 m achter de oogpunten van de bestuurder en 15,00 m naast het verlengde
      van de linkerzijkant van het voertuig kan zien,

      d. een punt op het wegdek, gelegen op 25,00 m achter de oogpunten van de bestuurder en op het verlengde van de
      projectie van de linkerzijkant van het voertuig kan zien, en

      e. tevens recht naar achteren kan kijken.
