        afdeling: '1'
  - number: 2.2.14
    text: |-
      1 In deze paragraaf wordt onder roestschade verstaan: door corrosie over de gehele dikte verdwenen materiaal.

      2 Roestschade wordt per onderdeel of per bevestiging van een onderdeel uitgedrukt in de schade-eenheid "E".
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.2.14
  - number: 2.2.15
    text: |-
      1 De in [bijlage 3][ref1] genoemde onderdelen en bevestigingen van onderdelen van motorrijtuigen die niet zijn
      voorzien van een zelfdragende carrosserie en aanhangwagens met een toegestane maximum massa van meer dan 3500 kg
      mogen per onderdeel dan wel per bevestiging van een onderdeel niet meer roestschade hebben dan 2E.

      2 Veerschotels mogen niet zijn doorgeroest.


      [ref1]: https://wetten.overheid.nl/BWBR0009581
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.2.15
