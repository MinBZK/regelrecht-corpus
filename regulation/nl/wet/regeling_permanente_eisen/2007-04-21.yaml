  - number: 2.5.1
    text: |-
      De bevestiging van de assen moet voldoen aan de eisen ten aanzien van corrosie bedoeld in [titel 2][ref1] van dit
      hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0009581#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.5.1
    references:
      - id: ref1
        bwb_id: BWBR0009581
        hoofdstuk: '2'
  - number: 2.5.2
    text: |-
      1 Fuseepennen, - lageringen en - bussen mogen, naast eventuele oorspronkelijke speling, door slijtageverschijnselen
      niet meer speling hebben dan:

        - in radiale richting, zoals weergegeven in figuur 6: - 1,5 mm in het bovenste of onderste draaipunt, en - 2,0 mm
      in het bovenste en onderste draaipunt tezamen;
        - in axiale richting, zoals weergegeven in figuur 6: 1,0 mm.

      2 De in het eerste lid genoemde oorspronkelijke speling wordt met behulp van het werkplaatshandboek of soortgelijke
      informatie vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.5.2
  - number: 2.5.3
    text: |-
      1 Fuseekogels mogen, naast eventuele oorspronkelijke speling, door slijtageverschijnselen niet meer speling hebben
      dan:

        - 1,0 mm, in radiale richting, zoals weergegeven in figuur 7;
        - 1,0 mm, in axiale richting, zoals weergegeven in figuur 7.

      2 De in het eerste lid genoemde oorspronkelijke speling die het gevolg is van indrukking van het veerelement in de
      kogel, wordt vastgesteld:

        - met behulp van het werkplaatshandboek of soortgelijke informatie, dan wel
        - door middel van indrukking van een nieuwe kogel.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.5.3
  - number: 2.5.4
    text: |-
      1 De draaipunten in de wielophanging anders dan bedoeld in de [artikelen 2.5.2][ref1] en [2.5.3][ref2], met
      uitzondering van kogelgewrichten, mogen:

        - in de richting van de belasting door slijtageverschijnselen niet meer speling hebben dan 1,0 mm, waarbij de
      elasticiteit van het rubber buiten beschouwing wordt gelaten;
        - ten gevolge van de zijdelingse verplaatsing geen kontaktplekken vertonen.

      2 Het eerste lid geldt niet voor het bovenste draaipunt van het Mc Pherson-wielophangingsysteem.

      3 Indien het draaipunt een kogelgewricht betreft, mag deze door slijtageverschijnselen niet meer speling hebben
      dan:

        - 1,0 mm, in radiale richting;
        - 1,0 mm, in axiale richting.


      [ref1]: https://wetten.overheid.nl/BWBR0009581#Artikel2.5.2
      [ref2]: https://wetten.overheid.nl/BWBR0009581#Artikel2.5.3
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.5.4
