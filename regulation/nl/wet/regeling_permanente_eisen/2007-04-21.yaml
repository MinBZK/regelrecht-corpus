  - number: 2.3.11
    text: |-
      1 De hoeveelheid roet, uitgedrukt in de absorptiecoëfficiënt (k-waarde), van de uitlaatgassen van personenauto’s
      en bedrijfsauto’s met een verbrandingsmotor met compressie-ontsteking, bepaald volgens de in [artikel 2.3.12][ref1]
      omschreven meting, mag de:

      a. 3.0 m-1 voor een motor met drukvulling niet overschrijden indien het voertuig in gebruik is genomen na
      31 december 1979, doch voor 1 juli 2008, tenzij in het kentekenregister een hogere absorptiecoëfficiënt is vermeld;

      b. 2.5 m-1 voor een motor met natuurlijke aanzuiging niet overschrijden indien het voertuig in gebruik is genomen
      na 31 december 1979, doch voor 1 juli 2008, tenzij in het kentekenregister een hogere absorptiecoëfficiënt is
      vermeld; of

      c. 1.5 m-1 niet overschrijden indien het voertuig in gebruik is genomen na 30 juni 2008, tenzij in het
      kentekenregister een hogere absorptiecoëfficiënt is vermeld.

      2 Om de in het eerste lid bedoelde maximum hoeveelheid roet te bepalen moeten bij de in [artikel 2.3.12][ref2]
      bedoelde meting de volgende gegevens worden gehanteerd:

      a. het minimum en maximum stationair toerental. Indien het verschil tussen het aangegeven minimum en maximum
      toerental te klein is, mag ten behoeve van het invoeren in de roetmeter het minimum en maximum stationair toerental
      zodanig worden verlaagd respectievelijk verhoogd dat het verschil tussen beide maximaal 200 omw/min bedraagt,

      b. het minimum en maximum afregeltoerental, en

      c. de motorolietemperatuur, zijnde de minimumwaarde en de testwaarde.

      3 Indien in het kentekenregister met betrekking tot het te keuren motorrijtuig één of meer gegevens als bedoeld in
      het tweede lid niet voorkomen, wordt voor het desbetreffende gegeven de volgende waarde aangehouden:

      a. stationair toerental: het werkelijke stationair toerental, waarbij ten behoeve van het invoeren in de roetmeter
      moet worden aangehouden als:

      1°. minimum: 500 omw/min, en

      2°. maximum: 1000 omw/min;

      b. afregeltoerental: het werkelijke afregeltoerental, waarbij ten behoeve van het invoeren in de roetmeter moet
      worden aangehouden als:

      1°. minimum: het werkelijke afregeltoerental minus 5%, en

      2°. maximum: het werkelijke afregeltoerental plus 5%;

      c. minimum motorolietemperatuur: 60° C.

      4 De in [artikel 2.3.12][ref3] omschreven meting kan achterwege blijven indien de personenauto of de bedrijfsauto
      is uitgerust met een comprex-lader.


      [ref1]: https://wetten.overheid.nl/BWBR0009581#Artikel2.3.12
      [ref2]: https://wetten.overheid.nl/BWBR0009581#Artikel2.3.12
      [ref3]: https://wetten.overheid.nl/BWBR0009581#Artikel2.3.12
