        artikel: 5.2.11
      - id: ref2
        bwb_id: BWBR0006746
        artikel: 5.3.11
  - number: 2.3.9
    text: |-
      1 Personenauto's met een verbrandingsmotor met elektrische ontsteking, die in gebruik zijn genomen na 31 december
      1995, moeten zijn voorzien van een goedwerkend emissiebestrijdingssysteem dat bestaat uit een katalysator en een
      lambdasonde.

      2 Personenauto's die in gebruik zijn genomen na 31 december 1992 doch voor 1 januari 1996, moeten zijn voorzien
      van een goedwerkend emissiebestrijdingssysteem dat bestaat uit een katalysator en een lambdasonde, indien deze van
      fabriekswege is gemonteerd, hetgeen onder andere kan blijken uit de toevoeging U9 of E2 aan de typeaanduiding op
      het voor het voertuig afgegeven kentekenbewijs. Deze eis geldt niet voor personenauto's, in gebruik genomen voor 1
      januari 1994, die zijn voorzien van een LPG-installatie en waarvan het voor het voertuig afgegeven kentekenbewijs
      niet de toevoeging U9 of E2 bij de typeaanduiding vermeldt.

      3 Bedrijfsauto's met een toegestane maximum massa van niet meer dan 3500 kg, die zijn voorzien van een
      verbrandingsmotor met elektrische ontsteking en die in gebruik zijn genomen na 31 december 1997, moeten zijn
      voorzien van een goedwerkend emissiebestrijdingssysteem dat bestaat uit een katalysator en een lambdasonde.

      4 Bedrijfsauto's met een toegestane maximum massa van niet meer dan 3500 kg en met een verbrandingsmotor met
      elektrische ontsteking die in gebruik zijn genomen na 31 december 1994 doch vóór 1 januari 1998, moeten zijn
      voorzien van een goed werkend emissiebestrijdingssysteem dat bestaat uit een katalysator en een lambdasonde indien
      deze van fabriekswege zijn gemonteerd.

      5 De beoordeling van het bepaalde in het eerste tot en met vierde lid vindt plaats door visuele controle terwijl
      het voertuig zich boven een inspectieput of op een hefinrichting bevindt.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.3.9
  - number: 2.3.10
    text: |-
      1 De goede werking van het emissiebestrijdingssysteem van de in [artikel 2.3.9][ref1] bedoelde motorrijtuigen
      wordt gecontroleerd door meting van de lambdawaarde en het koolmonoxidegehalte van de uitlaatgassen bij verhoogd
      toerental en door meting van het koolmonoxidegehalte bij stationair draaiende motor.

      2 Indien de in [artikel 2.3.9][ref2] bedoelde motorrijtuigen zijn voorzien van een LPG-installatie moet de in het
      eerste lid bedoelde meting bij verhoogd toerental worden uitgevoerd indien:

      a) het een personenauto betreft die in gebruik is genomen na 31 december 1997;

      b) het een personenauto betreft die in gebruik is genomen na 31 december 1992 doch vóór 1 januari 1998 waarvan op
      het kentekenbewijs de vermelding "G3" is vermeld; of

      c) het een bedrijfsauto met een toegestane maximum massa van niet meer dan 3500 kg betreft die in gebruik is
      genomen na 31 december 1997.

      3 Vóór elke meting wordt gecontroleerd of de motor en het emissiebestrijdingssysteem op bedrijfstemperatuur zijn.
      Hieraan wordt voldaan indien de motor gedurende 3 minuten op een toerental van ongeveer 3000 omw/min heeft gedraaid
      en:

        - een proefrit heeft plaatsgevonden, of
        - de motorolietemperatuur minimaal 80°C bedraagt.

      De motorolietemperatuur moet worden gecontroleerd met behulp van een olietemperatuurmeter die is voorzien van een
      geldig certificaat van eerste keuring dan wel van herkeuring.

      4 De uitlaatgassen van de in [artikel 2.3.9][ref3] bedoelde motorrijtuigen mogen bij een verhoogd toerental gelegen
      tussen de 2500 omw/min en 3200 omw/min:

      a. niet meer dan 0,3 vol % koolmonoxide bevatten indien het voertuig in gebruik is genomen voor 1 juli 2002,
      waarbij de lambdawaarde moet liggen tussen 0.97 en 1.03;

      b. niet meer dan 0,2% koolmonoxide bevatten indien het voertuig in gebruik is genomen na 30 juni 2002, waarbij de
      lambdawaarde moet liggen tussen 0.97 en 1.03.

      5 Indien binnen het toerentalbereik zoals vermeld in het vierde lid de betrokken waarden niet worden bereikt, moet
      de meting worden herhaald bij een verhoogd toerental vanaf 2000 omw/min tot 3200 omw/min waarbij de controle op
      het koolmonoxidegehalte en de lambdawaarde bij elke stap van ongeveer 100 omw/min moet worden uitgevoerd totdat de
      betrokken waarden zijn bereikt. Hierbij mogen alle elektrische stroomverbruikers zijn ingeschakeld.

      6 In afwijking van het vierde en het vijfde lid mogen voor de door de Directeur van de Dienst Wegverkeer aangewezen
      typen motorrijtuigen of motorrijtuigen die zijn voorzien van een bepaalde LPG-installatie, de bijbehorende
      door de Directeur vastgestelde waarden en condities worden gehanteerd. De per type motorrijtuig in de lijst
      met voertuigspecifieke gegevens aangegeven maximale koolmonoxidegehaltes (CO %) en lambdawaarden zijn niet van
      toepassing op motorrijtuigen voorzien van een LPG-installatie.

      7 De uitlaatgassen van de in [artikel 2.3.9][ref4] bedoelde motorrijtuigen mogen, waarbij de meting zich tot één
      uitmonding beperkt indien het uitlaatsysteem meer dan één uitmonding heeft, bij een stationair toerental:

      a. niet meer dan 0,5% vol koolmonoxide bevatten indien het voertuig in gebruik is genomen voor 1 juli 2002;

      b. niet meer dan 0,3% vol koolmonoxide bevatten indien het voertuig in gebruik is genomen na 30 juni 2002; of

      c. niet meer koolmonoxide bevatten dan vermeld op het op het voertuig aangebrachte symbool, bedoeld in de
      [artikelen 5.2.11, achtste lid][ref5], en [artikel 5.3.11, zevende lid, van het Voertuigreglement][ref6].

      8 Bij het vaststellen van de lambdawaarde mag het derde cijfer achter de komma buiten beschouwing worden gelaten.
      Bij het vaststellen van het koolmonoxidegehalte bij verhoogd toerental mag het tweede cijfer achter de komma buiten
      beschouwing worden gelaten.

      9 De in het eerste lid bedoelde meting blijft achterwege indien het personenauto's of bedrijfsauto's betreft die
      zijn voorzien van een rotatiemotor of een CNG-installatie.


      [ref1]: https://wetten.overheid.nl/BWBR0009581#Artikel2.3.9
      [ref2]: https://wetten.overheid.nl/BWBR0009581#Artikel2.3.9
      [ref3]: https://wetten.overheid.nl/BWBR0009581#Artikel2.3.9
      [ref4]: https://wetten.overheid.nl/BWBR0009581#Artikel2.3.9
      [ref5]: https://wetten.overheid.nl/BWBR0006746#Artikel5.2.11
      [ref6]: https://wetten.overheid.nl/BWBR0006746#Artikel5.3.11
