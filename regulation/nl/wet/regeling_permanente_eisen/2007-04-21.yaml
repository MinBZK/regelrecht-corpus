    text: |-
      1 De rechterbuitenspiegel van de bedrijfsauto die in gebruik is genomen na 25 januari 2008 en is bestemd voor het
      vervoer van meer dan acht personen, de bestuurder daaronder niet begrepen, of de bedrijfsauto met een toegestane
      maximummassa van meer dan 3500 kg die in gebruik is genomen na 25 januari 2008 en is bestemd voor het vervoer van
      goederen, moet zodanig zijn geplaatst dat de bestuurder hiermee het gezichtsveld op grondniveau kan overzien, zoals
      weergegeven in figuur 18b, waarbij de bestuurder:

      a. een punt op het wegdek, gelegen op 30,00 m achter de oogpunten van de bestuurder en 5,00 m naast het verlengde
      van de rechterzijde van het voertuig kan zien,

      b. een punt op het wegdek, gelegen op 4,00 m achter de oogpunten van de bestuurder en 1,00 m naast het verlengde
      van de rechterzijde van het voertuig kan zien,

      c. een deel van de rechterzijde van het voertuig kan zien,

      d. de horizon kan zien, en

      e. tevens recht naar achteren kan kijken.

      2 De rechterbuitenspiegel van de bedrijfsauto met een toegestane maximummassa van niet meer dan 3500 kg die in
      gebruik is genomen na 25 januari 2011 en is bestemd voor het vervoer van goederen, is zodanig geplaatst dat de
      bestuurder hiermee het gezichtsveld op grondniveau kan overzien, zoals weergegeven in figuur 18a, waarbij de
      bestuurder:

      a. een punt op het wegdek, gelegen op 20,00 m achter de oogpunten van de bestuurder en 4,00 m naast het verlengde
      van de rechterzijde van het voertuig kan zien,

      b. een punt op het wegdek, gelegen op 4,00 m achter de oogpunten van de bestuurder en 1,00 m naast het verlengde
      van de rechterzijde van het voertuig kan zien,

      c. en een deel van de rechterzijde van het voertuig kan zien,

      d. de horizon kan zien, en

      e. tevens recht naar achteren kan kijken.

      3 De rechterbuitenspiegel van de bedrijfsauto met een toegestane maximummassa van niet meer dan 2000 kg die in
      gebruik is genomen na 30 september 1988 doch voor 26 januari 2011 en is bestemd voor het vervoer van goederen moet
      zodanig zijn geplaatst dat de bestuurder hiermee het gezichtsveld op grondniveau kan overzien, zoals weergegeven in
      figuur 19, waarbij de bestuurder:

      a. een punt op het wegdek, gelegen op 20,00 m achter de oogpunten van de bestuurder en 4,00 m naast het verlengde
      van de rechterzijde van het voertuig kan zien,

      b. een deel van de rechterzijde van het voertuig kan zien,

      c. de horizon kan zien, en

      d. tevens recht naar achteren kan kijken.

      4. De rechterbuitenspiegel van de bedrijfsauto met een toegestane maximummassa van niet meer dan 2000 kg die in
      gebruik is genomen vóór 1 oktober 1988 en is bestemd voor het vervoer van goederen en moet zodanig zijn geplaatst
      dat de bestuurder hiermee het gezichtsveld op grondniveau kan overzien, zoals weergegeven in figuur 20, waarbij
      de bestuurder:

      a. een punt op het wegdek, gelegen op 30,00 m achter de oogpunten van de bestuurder en 3,50 m naast het verlengde
      van de rechterzijde van het voertuig kan zien,

      b. een deel van de rechterzijde van het voertuig kan zien,

      c. de horizon kan zien, en

      d. tevens recht naar achteren kan kijken.

      5. De rechterbuitenspiegel van de bedrijfsauto die in gebruik is genomen voor 26 januari 2008 en is bestemd
      voor het vervoer van meer dan acht personen, de bestuurder daaronder niet begrepen, of de bedrijfsauto met een
      toegestane maximummassa van meer dan 3500 kg die in gebruik is genomen voor 26 januari 2008 en is bestemd voor het
      vervoer van goederen en de rechterbuitenspiegel van de bedrijfsauto met een toegestane maximummassa van meer dan
      2000 kg maar niet meer dan 3500 kg die in gebruik is genomen voor 26 januari 2011 en is bestemd voor het vervoer
      van goederen is zodanig geplaatst dat de bestuurder hiermee het gezichtsveld op grondniveau kan overzien, zoals
      weergegeven in figuur 21, waarbij de bestuurder:

      a. een punt op het wegdek, gelegen op 4,00 m achter de oogpunten van de bestuurder en 0,75 m naast het verlengde
      van de rechterzijkant van het voertuig kan zien,

      b. een punt op het wegdek, gelegen op 30,00 m achter de oogpunten van de bestuurder en 3,50 m naast het verlengde
      van de rechterzijkant van het voertuig kan zien,

      c. een deel van de rechterzijde van het voertuig kan zien,

      d. de horizon kan zien, en

      e. tevens recht naar achteren kan kijken.
