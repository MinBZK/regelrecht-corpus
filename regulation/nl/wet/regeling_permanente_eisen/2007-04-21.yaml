  - number: 2.8.26
    text: |-
      Indien een bedrijfsauto met een toegestane maximum massa van meer dan 3500 kg is voorzien van een gecombineerd
      remsysteem, moet de vaststelling van de remvertraging van de bedrijfsrem en de extrapolatie plaatsvinden
