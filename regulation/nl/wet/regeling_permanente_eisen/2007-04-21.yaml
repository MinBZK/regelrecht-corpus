        artikel: 2.8.48
        hoofdstuk: '2'
        paragraaf: '7'
        afdeling: '2'
  - number: 2.8.50
    text: |-
      1 De extrapolatiedruk wordt gesteld op:

        - 6,5 bar indien het een aanhangwagen, betreft in gebruik genomen na 31 december 1997,
        - 6 bar indien het een aanhangwagen betreft in gebruik genomen voor 1 januari 1998, of
        - 4,5 bar indien het een aanhangwagen betreft met een éénleidingremsysteem dan wel een gecombineerd één- en
      tweeleidingremsysteem.

      2 Indien blijkt dat de druk in de remcilinders wordt begrensd, doordat een ventiel of een remkrachtregelaar bij de
      toegestane maximummassa onder een as de ingestuurde druk reduceert, is de extrapolatiedruk gelijk aan de begrensde
      druk.

      3 Bij de extrapolatie wordt de rolweerstand meegerekend.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.50
  - number: 2.8.51
    text: |-
      1 Voor de toepassing van dit artikel wordt verstaan onder:

        - a = geëxtrapoleerde remvertraging;
        - F = som van de remkrachten aan de wielen per as "n";
        - M= maximale massa onder de assen;
        - P = extrapolatiedruk;
        - P = ingestuurde remcilinderdruk van as "n";
        - 0,4 = aanspreekdruk, tenzij door meting anders bepaald.

      2 Van een aanhangwagen met een toegestane maximum massa van meer dan 3500 kg moet de vaststelling van de
      remvertraging van de bedrijfsrem en de extrapolatie plaatsvinden:

        - volgens de volgende formule:
        - met ingang van 1 januari 1996 door een nieuwe remproef en een nieuwe berekening volgens de in onderdeel a
      genoemde formule, indien de drukfactor van een as groter is dan 3, waarbij de betreffende as moet worden belast
      door op het voertuig een last te plaatsen of door middel van spanbanden of spankettingen de belasting op die as te
      vergroten, tenzij de berekende remvertraging groter dan of gelijk is aan de minimaal vereiste remvertraging, bij
      herberekening met een drukfactor 3.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.51
  - number: 2.8.52
    text: |-
      1 De beoordeling van het uitbreken als gevolg van het verschil in remwerking tussen de wielen van elke as
      respectievelijk als gevolg van overberemming van de achterste as of het achterste asstel geschiedt door beproeving
      van het voertuig op de weg of door beproeving op een platenremtestbank of een rollenremtestbank aan de hand van de
      [artikelen 2.8.53 tot en met 2.8.59][ref1].

      2 Indien de beoordeling van de remvertraging plaatsvindt:

        - door een beproeving op de weg met behulp van een zelfregistrerende remvertragingsmeter moet ook de beoordeling
      van het uitbreken op de weg plaats vinden;
        - door een beproeving op een remtestinrichting moet onverminderd [artikel 2.8.55, tweede lid][ref2], ook de
      beoordeling van het uitbreken plaats vinden op een remtestinrichting.

      3 Het eerste lid geldt niet voor aanhangwagens met betrekking tot overberemming.


      [ref1]: https://wetten.overheid.nl/BWBR0009581#Artikel2.8.53
      [ref2]: https://wetten.overheid.nl/BWBR0009581#Artikel2.8.55
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.52
    references:
      - id: ref1
        bwb_id: BWBR0009581
        artikel: 2.8.53
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0009581
        artikel: 2.8.55
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '3'
  - number: 2.8.53
    text: |-
      Bij de beoordeling van het uitbreken moet bij een beproeving op de weg een beremming worden uitgevoerd waarbij:

        - in geval van een personenauto moet worden geremd tot de hoogst bereikbare remvertraging met een maximum van 8 m/
      s2 met een pedaalkracht van niet meer dan 500 N;
        - in geval van een bedrijfsauto of aanhangwagen moet worden geremd tot de minimaal vereiste remvertraging zoals
      voor de betreffende voertuigcategorie is vermeld in [hoofdstuk 5 van het Voertuigreglement][ref1];
        - in geval van een driewielig motorrijtuig moet worden geremd tot de hoogst bereikbare remvertraging.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.53
    references:
      - id: ref1
        bwb_id: BWBR0006746
        hoofdstuk: '5'
  - number: 2.8.54
    text: |-
      Indien bij de beoordeling van het verschil in remwerking gebruik wordt gemaakt van een remtestinrichting moeten de
      [artikelen 2.8.55][ref1] en [2.8.56][ref2] in acht worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0009581#Artikel2.8.55
      [ref2]: https://wetten.overheid.nl/BWBR0009581#Artikel2.8.56
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.54
    references:
      - id: ref1
        bwb_id: BWBR0009581
        artikel: 2.8.55
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0009581
        artikel: 2.8.56
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '3'
  - number: 2.8.55
    text: |-
      1 Indien gebruik wordt gemaakt wordt van een rollenremtestbank mag het verschil in remwerking tussen de wielen op
      een as niet meer bedragen dan 30% van de hoogst gemeten remkracht (bovenwaarde) waarbij de wielen niet blokkeren.

      2 Het verschil in remkracht tussen de wielen van een bestuurde as van een bedrijfsauto met een toegestane maximum
      massa van meer dan 3500 kg mag niet meer bedragen dan 20% van de hoogst gemeten remkracht.

      3 Indien het verschil in remkracht tussen de wielen van een bestuurde as van een personenauto, een bedrijfsauto met
      een toegestane maximum massa van niet meer dan 3500 kg of een driewielig motorrijtuig, tussen de 20% en 30% van de
      hoogst gemeten remkracht bedraagt, moet door middel van een remproef op de weg worden bepaald of dit verschil leidt
      tot uitbreken; het gebruik van een remvertragingsmeter is niet noodzakelijk.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.55
  - number: 2.8.56
    text: "Indien gebruik gemaakt wordt van een platenremtestbank:\n\n- moet de snelheid bij aanvang van de remproef ongeveer 10 km/h bedragen;\n- kunnen de resultaten van de remproeven worden gebruikt die zijn uitgevoerd bij de procedure voor de beoordeling\nvan de bedrijfsremvertraging;\n- moet de remproef op iedere as ten minste tweemaal worden uitgevoerd;\n- moet de beoordeling van de resultaten geschieden aan de hand van de bij dit artikel behorende tabel 2, waarin de\ngenoemde percentages zijn gerelateerd aan de hoogst gemeten remkracht.\n\nTabel 2 Verschil in remwerking links en rechts op platenremtestbank.\n\n\n\n\n\n\n\n\n\n\n\n\n            \uFEFF Resultaten van twee maat- gevende remproeven. VERSCHIL LINKS EN RECHTS\n\n\n            \uFEFFextra remproef nodig op de platenbank\n\n\n            \uFEFFresultaat extra remproef\n\n\n            \uFEFFCONCLUSIE\n\n\n\n\n            voorste as\n\n\n            \uFEFFVerschil beide proeven < 20%\n\n\n            -\n\n\n            -\n\n\n            TOEGESTAAN\n\n\n\n\n            \uFEFF verschil ene proef < 20%, andere proef tussen 20 en 30%\n\n\n            ja\n\n\n            \uFEFF verschil proef > 30%\n\n\n            NIET TOEGESTAAN\n\n\n\n\n            verschil proef < 20%\n\n\n            TOEGESTAAN\n\n\n\n\n            verschil proef tussen 20 en 30%\n\n\n            \uFEFFgeen direkte beslissing, remproef op de weg houden.\n\n\n\n\n            \uFEFF verschil ene proef < 20%, andere proef tussen 20 en 30%\n\n\n            -\n\n\n            -\n\n\n            NIET TOEGESTAAN\n\n\n\n\n            \uFEFFverschil beide proeven tussen 20 en 30%\n\n\n            -\n\n\n            -\n\n\n            \uFEFFgeen direkte beslissing, remproef op de weg houden.\n\n\n\n\n            Achterste as\n            of het achterse asstel\n\n\n            Verschil beide proeven < 30%\n\n\n            -\n\n\n            -\n\n\n            TOEGESTAAN\n\n\n\n\n            verschil ene proef < 30%, andere proef > 30%\n\n\n            ja\n\n\n            verschil proef > 40 %\n\n\n            NIET TOEGESTAAN\n\n\n\n\n            verschil proef < 30 %\n\n\n            TOEGESTAAN\n\n\n\n\n            verschil proef tussen 30 en 40 %\n\n\n            \uFEFFgeen direkte beslissing, remproef op de weg houden.\n\n\n\n\n            Verschil beide proeven > 30 %\n\n\n            -\n\n\n            -\n\n\n            NIET TOEGESTAAN"
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.56
  - number: 2.8.57
    text: |-
      Indien bij de beoordeling van de overberemming van de achterste as of het achterste asstel van een personenauto
      of een bedrijfsauto met een toegestane maximum massa van niet meer dan 3500 kg gebruik gemaakt wordt van een
      remtestinrichting moeten de [artikelen 2.8.58 tot en met 2.8.60][ref1] in acht worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0009581#Artikel2.8.58
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.57
    references:
      - id: ref1
        bwb_id: BWBR0009581
        artikel: 2.8.58
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '3'
  - number: 2.8.58
    text: |-
      1 Indien gebruik wordt gemaakt van een rollenremtestbank, moet:

        - voor de voorste as en de achterste as of het achterste asstel de pedaalkracht worden bepaald even voor het moment
      van blokkeren van één of meer wielen;
        - de laagst vastgestelde pedaalkracht worden gebruikt om de remkrachten te bepalen die optreden bij deze
      pedaalkracht op de voorste as en op de achterste as of het achterste asstel;
        - de door de achterste as of het achterste asstel opgebrachte remkracht lager zijn dan het volgende percentage:
      1°. 30% indien de motor zich voorin bevindt en voorwielaandrijving aanwezig is; 2°. 40% indien de motor
      zich voorin bevindt en achterwielaandrijving aanwezig is; 3°. 50% indien de motor zich achterin bevindt en
      achterwielaandrijving aanwezig is.

      2 Een remproef op de weg vindt als nader onderzoek plaats, indien uit de berekening met de bij de remtest verkregen
      waarden blijkt dat het percentage van de remkracht die wordt opgebracht door de achterste as beneden de aangegeven
      waarde zoals vermeld in het eerste lid, onderdeel c, ligt; het gebruik van een remvertragingsmeter is niet
      noodzakelijk.

      3 Bij een personenauto of een bedrijfsauto met een toegestane maximum massa van niet meer dan 3500 kg, waarvan
      de motor en de aandrijving niet onder onderdeel c, van het eerste lid, vallen, wordt eveneens een remproef op
      de weg gehouden, zoals bepaald in [paragraaf 1][ref1] van deze afdeling, echter zonder gebruik te maken van een
      remvertragingsmeter.


      [ref1]: https://wetten.overheid.nl/BWBR0009581#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.58
    references:
      - id: ref1
        bwb_id: BWBR0009581
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '3'
  - number: 2.8.59
    text: |-
      1 Indien gebruik wordt gemaakt van een vier-plaats remtestbank, moet:

        - de snelheid bij de aanvang van de proef ongeveer 10 km/h bedragen, waarbij de remkrachten van de voorste as en de
      achterste as of het achterste asstel worden bepaald;
        - de door de achterste as of het achterste asstel opgebrachte remkracht lager zijn dan het volgende percentage:
      1°. 30% indien de motor zich voorin bevindt en voorwielaandrijving aanwezig is; 2°. 40% indien de motor
      zich voorin bevindt en achterwielaandrijving aanwezig is; 3°. 50% indien de motor zich achterin bevindt en
      achterwielaandrijving aanwezig is.

      2 Een remproef op de weg vindt als nader onderzoek plaats, indien uit de berekening met de bij de remtest verkregen
      waarden blijkt dat het percentage van de remkracht die wordt opgebracht door de achterste as beneden de aangegeven
      waarde zoals vermeld in het eerste lid, onderdeel b, ligt; het gebruik van een remvertragingsmeter is niet
      noodzakelijk.

      3 Bij een personenauto of een bedrijfsauto met een toegestane maximum massa van niet meer dan 3500 kg waarvan
      de motor en de aandrijving niet onder onderdeel b, van het eerste lid, vallen, wordt eveneens een remproef
      op de weg gehouden, zoals bepaald in paragraaf 1 van deze afdeling, echter zonder gebruik te maken van een
      remvertragingsmeter.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.59
  - number: 2.8.60
    text: |-
      In afwijking van [artikel 2.8.52, tweede lid][ref1], mag de beoordeling van het uitbreken als gevolg van
      overberemming van de achteras of asstel niet plaatsvinden op een twee-plaatsremtestbank; de beoordeling moet worden
      uitgevoerd door middel van een remproef op de weg zoals bepaald in [paragraaf 1][ref2] van deze afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009581#Artikel2.8.52
      [ref2]: https://wetten.overheid.nl/BWBR0009581#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.60
