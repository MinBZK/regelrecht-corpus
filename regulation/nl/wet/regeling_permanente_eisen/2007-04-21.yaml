  - number: 2.5.5
    text: |-
      1 De speling van wiellagers of hun opsluiting mag niet zodanig zijn dat de bewegingsmogelijkheid meer bedraagt dan
      0,5% van de afstand van de hartlijn van de as of astap tot het meetpunt, zoals weergegeven in figuur 8.

      2 Bij voertuigen met vrijdragende achterassen mag de axiale bewegingsmogelijkheid, zoals weergegeven in figuur 9,
      niet meer bedragen dan 0,5 mm, tenzij voor de betreffende constructie hogere waarden zijn toegestaan die worden
      vastgesteld met behulp van het werkplaatshandboek of soortgelijke informatie.

      3 In geval van assen met opsluiting in het differentieel is de in het tweede lid genoemde waarde 1,5 mm.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.5.5
