        - bij de remtest moet de remwerking langzaam worden opgevoerd en op het moment van aflezen worden vastgehouden;
        - de maximale remkracht wordt bereikt wanneer: 1(. de maximale remcilinderdruk wordt ingestuurd, 2(. één of meer
      wielen van het voertuig blokkeren, of 3(. de rollenremtestbank afslaat.

      2 Indien de remkracht op één wiel tussen twee waarden schommelt of de remkrachten op beide wielen tussen twee
      waarden schommelen, moeten per wiel de minimale en maximale remkracht worden gemiddeld en wordt dit gemiddelde
      gebruikt als remkracht voor dat wiel.


      [ref1]: https://wetten.overheid.nl/BWBR0009581#Artikel2.8.48
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.49
    references:
