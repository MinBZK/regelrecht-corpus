      1 De trottoirspiegel van de bedrijfsauto die in gebruik is genomen voor 26 januari 2008 moet zodanig zijn geplaatst
      dat de bestuurder hiermee het gezichtsveld op grondniveau kan overzien zoals weergegeven in figuur 22.

      2 De trottoirspiegel van de bedrijfsauto die in gebruik is genomen na 25 januari 2008 moet zodanig zijn geplaatst
      dat de bestuurder hiermee het gezichtsveld op grondniveau kan overzien zoals weergegeven in figuur 22a.

      3 Indien het verticale dwarsvlak door de voorste zijde van de bumper op minder dan 1,00 m is gelegen van de
      oogpunten van de bestuurder mag het gezichtveld van de trottoirspiegel worden beperkt tot dat dwarsvlak zoals
      weergegeven in figuur 22b.
