  - number: 2.3.8
    text: |-
      Het koolmonoxidegehalte van de uitlaatgassen van de in [artikel 5.2.11, zevende lid][ref1], en
      [artikel 5.3.11, zesde lid, van het Voertuigreglement][ref2] bedoelde personenauto's en bedrijfsauto's, met
      een verbrandingsmotor met elektrische ontsteking, mag het in het boekwerk "APK-milieukeuringseisen" voor het
      desbetreffende type motorrijtuig aangewezen gehalte bij het bij die aanwijzing aangegeven stationaire toerental
      niet overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.2.11
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5.3.11
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.3.8
