  - number: 2.6.1
    text: |-
      1 Indien van een bedrijfsauto of een aanhangwagen die na 31 december 1997 in gebruik is genomen de afzonderlijke
      maximum last per as in het kentekenregister is vermeld, moet per as de volgende procedure worden gevolgd:

      a. de in het kentekenregister vermelde maximum last per as wordt gedeeld door het aantal banden op die as;

      b. aan de hand van [bijlage 4][ref1] wordt bepaald welke loadindex behoort bij de onder a gevonden maximum last
      per band;

      c. de loadindex van elke band op die as mag niet lager zijn dan de onder b gevonden loadindex.

      2 Indien op de band een groep is gevormd met twee load-indices achter elkaar, geldt, met betrekking tot het
      bepaalde in het eerste lid, onder a, in het geval van enkele montage de eerst vermelde load-index en in het geval
      van dubbele montage de tweede load-index.

      3 De in het eerste lid, onder a, gevonden waarde wordt:

      a. met 4% verminderd indien het betreft een aanhangwagen uitgerust met dubbel gemonteerde personenautobanden;

      b. met 10% verminderd indien het betreft:

      1°. een aanhangwagen die bestemd is voor recreatieve doeleinden;

      2°. een middenasaanhangwagen of een oplegger met een toegestane maximum last onder de as of assen van niet meer dan
      3.500 kg en uitgerust met enkelvoudig gemonteerde personenautobanden;

      3°. een vuilniswagen;

      4°. een reinigingswagen;

      5°. een straatveegwagen;

      6°. een sproeiwagen,

      voorzover deze inrichtingsomschrijvingen zijn vermeld op het kentekenbewijs of in het kentekenregister;

      c. met 15% verminderd indien het een bus betreft, ingericht mede om staande passagiers te vervoeren en met een
      toegestane maximum massa van meer dan 5.000 kg.

      4 De in het eerste lid onder a gevonden waarde kan worden verminderd met een percentage overeenkomstig het gestelde
      in [bijlage 5][ref2],

      a. indien onder ‘bijzonderheden’ in het kentekenregister of op het kentekenbewijs een maximum snelheid is
      aangegeven, of

      b. bij een snelheid van 100 km/h, indien het een aanhangwagen betreft met een toegestane maximum massa van meer dan
      750 kg.


      [ref1]: https://wetten.overheid.nl/BWBR0009581
      [ref2]: https://wetten.overheid.nl/BWBR0009581
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.6.1
    references:
