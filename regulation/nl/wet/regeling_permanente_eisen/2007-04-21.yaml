        artikel: 2.9.23
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '4'
  - number: 2.9.30
    text: |-
      1 De in deze afdeling gestelde eisen worden getoetst:

        - door middel van visuele controle, en
        - door in geval van twijfel te meten met een meetmiddel van voldoende bereik, waarbij het volgende in acht moet
      worden genomen: 1°. het voertuig is op een horizontaal of nagenoeg horizontaal en vlak wegdek geplaatst; 2°.
      alle wielen zijn in de stand van rechtuitrijden geplaatst; 3°. de banden zijn op de juiste spanning; 4°. indien
      het een oplegger of middenasaanhangwagen betreft is deze op zodanige wijze op steunen geplaatst dat de laadvloer
      horizontaal is dan wel overeenkomt met de normale rijstand.

      2 Bij de bepaling van de maximale onderbreking, als bedoeld in [artikel 2.9.28][ref1], wordt een extra onderbreking
      ten gevolge van het uitschuiven van het voertuig buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0009581#Artikel2.9.28
