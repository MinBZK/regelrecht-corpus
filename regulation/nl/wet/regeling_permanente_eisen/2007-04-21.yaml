  - number: 2.9.1
    text: |-
      De bevestiging van de onderdelen van de carrosserie genoemd in [hoofdstuk 5 van het Voertuigreglement][ref1] moeten
      voldoen aan de eisen ten aanzien van corrosie bedoeld in [titel 2][ref2] van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0009581#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.9.1
    references:
      - id: ref1
        bwb_id: BWBR0006746
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0009581
        hoofdstuk: '2'
  - number: 2.9.2
    text: |-
      Voorruiten van personenauto's, bedrijfsauto's met een toegestane maximum massa van niet meer dan 3500 kg
      alsmede driewielige motorrijtuigen met een toegestane maximum massa van niet meer dan 3500 kg mogen in de
      [artikel 2.9.3][ref1] aangegeven vlakken niet meer beschadigd of verkleurd zijn dan zoals bepaald in de
      [artikelen 2.9.4][ref2] en [2.9.5][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009581#Artikel2.9.3
      [ref2]: https://wetten.overheid.nl/BWBR0009581#Artikel2.9.4
      [ref3]: https://wetten.overheid.nl/BWBR0009581#Artikel2.9.5
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.9.2
    references:
      - id: ref1
        bwb_id: BWBR0009581
        artikel: 2.9.3
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0009581
        artikel: 2.9.4
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0009581
        artikel: 2.9.5
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
  - number: 2.9.3
    text: |-
      1 De voorruit wordt verdeeld in de volgende drie denkbeeldige vlakken, zoals weergegeven in figuur 13:

        - het vlak voor het directe gezichtsveld van de bestuurder: dit is het gedeelte van de voorruit dat zich voor de
      bestuurderszitplaats bevindt, ter grootte van een op de voorruit te projecteren vlak met een horizontale zijde van
      0,30 m en een verticale zijde van 0,20 m;
        - het vlak voor het indirecte gezichtsveld van de bestuurder, hetgeen als volgt wordt gevormd: het directe
      gezichtsveld wordt ten opzichte van het midden van de voorruit gespiegeld naar het rechter voorruitgedeelte. Het
      hierdoor gevonden vlak en de tussenruimte naar het directe gezichtsveld vormt het indirecte gezichtsveld;
        - het randvlak: dit is het nog resterende deel van de voorruit.

      2 Het middelpunt van het in het eerste lid, onder a, geprojecteerde vlak moet samenvallen met het snijpunt van:

        - de verticale lijn, denkbeeldig getrokken op de voorruit, vanuit de zitpositie van de bestuurder, door het hart
      van het stuur, en
        - de door het middelpunt van het ruitewisserblad beschreven baan op de voorruit of bij een centrale ruitewisser de
      horizontale raaklijn aan de genoemde beschreven baan, zoals weergegeven in figuur 14.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.9.3
  - number: 2.9.4
    text: |-
      1 In het vlak voor het directe gezichtsveld mogen, in afwijking van [artikel 2.9.5][ref1], de volgende
      beschadigingen of verkleuringen aanwezig zijn:

        - enkelvoudige scheuren, ongeacht de lengte;
        - oppervlakkige krassen waarvan de breedte niet meer dan 5 mm bedraagt;
        - beschadigingen of verkleuringen waarvan de afmetingen zodanig zijn, dat een denkbeeldig getrokken cirkel om de
      gehele beschadiging of verkleuring heen een diameter heeft van niet meer dan 20 mm.

      2 In het vlak voor het indirecte gezichtsveld mogen, in afwijking van [artikel 2.9.5][ref2], de volgende
      beschadigingen of verkleuringen aanwezig zijn:

        - enkelvoudige scheuren, ongeacht de lengte;
        - oppervlakkige krassen waarvan de breedte niet meer dan 5 mm bedraagt;
        - beschadigingen of verkleuringen waarvan de afmetingen zodanig zijn, dat een denkbeeldig getrokken cirkel om de
      gehele beschadiging of verkleuring heen een diameter heeft van niet meer dan 50 mm.

      3 Onder de in het eerste en tweede lid genoemde enkelvoudige scheuren worden scheuren verstaan die in de
      gezichtsvelden geen vertakkingen vertonen tussen begin- en eindpunt, zoals weergegeven in figuur 15.

      4 In het randvlak mogen beschadigingen of verkleuringen aanwezig zijn.

      5 Indien een beschadiging of verkleuring doorloopt in de verschillende te beoordelen vlakken van de ruit, dan
      moet alleen dat deel van de beschadiging of verkleuring in ogenschouw worden genomen dat in het te beoordelen vlak
      aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0009581#Artikel2.9.5
      [ref2]: https://wetten.overheid.nl/BWBR0009581#Artikel2.9.5
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.9.4
    references:
      - id: ref1
        bwb_id: BWBR0009581
        artikel: 2.9.5
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0009581
        artikel: 2.9.5
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
  - number: 2.9.5
    text: |-
      De voorruit mag meerdere luchtbellen, beschadigingen of verkleuringen vertonen die ten aanzien van de afmetingen
      ieder afzonderlijk voldoen aan [artikel 2.9.4][ref1], mits het uitzicht van de bestuurder daardoor niet wordt
      belemmerd.


      [ref1]: https://wetten.overheid.nl/BWBR0009581#Artikel2.9.4
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.9.5
    references:
      - id: ref1
        bwb_id: BWBR0009581
        artikel: 2.9.4
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
  - number: 2.9.6
    text: |-
      De in deze paragraaf gestelde eisen worden getoetst:

        - door middel van visuele controle;
        - door in geval van twijfel te meten met een meetmiddel van voldoende bereik.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.9.6
  - number: 2.9.7
    text: |-
      Voorruiten van bedrijfsauto's met een toegestane maximum massa van meer dan 3500 kg mogen in de
      [artikel 2.9.8][ref1] aangegeven vlakken niet meer beschadigd of verkleurd zijn dan zoals bepaald in de
      [artikelen 2.9.9][ref2] en [2.9.10][ref3].


