  - number: 2.2.16
    text: |-
      Voor de bepaling van de mate van roestschade in schade-eenheden "E" moet de volgende procedure worden gevolgd:

        - de roestschade-omvang wordt per onderdeel of per bevestiging van een onderdeel in procenten bepaald volgens het
      van toepassing zijnde beoordelingsprincipe;
        - aan de hand van [bijlage 3][ref1] wordt de te hanteren roestschadegradatie bij maximaal functieverlies van het
      beschadigde onderdeel of de beschadigde bevestiging van een onderdeel bepaald;
        - het onder a bepaalde percentage roestschade wordt vermenigvuldigd met de onder b bepaalde roestschadegradatie.


      [ref1]: https://wetten.overheid.nl/BWBR0009581
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.2.16
    references:
      - id: ref1
        bwb_id: BWBR0009581
  - number: 2.2.17
    text: |-
      1 De bepaling van de roestschade-omvang van langs- en dwarsliggers geschiedt aan de hand van de volgende
      beoordelingsprincipes, waarbij het hoogste percentage maatgevend is:

        - de verhouding uitgedrukt in procenten tussen het beschadigde deel van de omtrek en de gehele omtrek van de
      dwarsdoorsnede, een eventuele versterking in de langs- of dwarsligger daarbij inbegrepen. Bij de berekening van de
      omtrek van de dwarsdoorsnede worden de bevestigingsflenzen niet meegerekend, en
        - de verhouding uitgedrukt in procenten tussen de lengte van de schade en de werkelijke lengte van de langs-
      of dwarsligger tussen de draagpunten, zoals weergegeven in figuur 3, of zoals bij het betreffende onderdeel in
      [bijlage 3][ref1] is omschreven. Bij de bepaling van de roestschade worden de bevestigingsflenzen meegerekend.

      2 Indien een plaatdeel samen met een voorgevormd profiel een koker vormt, wordt het geheel beoordeeld als een
      langs- of dwarsligger.


      [ref1]: https://wetten.overheid.nl/BWBR0009581
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.2.17
    references:
      - id: ref1
        bwb_id: BWBR0009581
  - number: 2.2.18
    text: |-
      1 De bepaling van de roestschade-omvang van plaatdelen geschiedt aan de hand van de volgende beoordelingsprincipes,
      waarbij het hoogste percentage maatgevend is:

        - de verhouding uitgedrukt in procenten tussen het beschadigde oppervlak en het gehele oppervlak, en
        - de verhouding uitgedrukt in procenten tussen de lengte van de schade aan de randen en de totale randlengte.

      2 Indien een gedeelte van een plaatdeel tevens deel uitmaakt van een langs- of dwarsligger (koker), moet dit
      gedeelte worden meegerekend voor de bepaling van het oppervlak dan wel de randlengte.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.2.18
  - number: 2.2.19
    text: |-
      1 De roestschade-omvang van de bevestiging van onderdelen, met uitzondering van de bevestiging van plaatdelen,
      wordt bepaald door een schatting te maken omtrent de afname in procenten van de sterkte van de bevestiging van het
      ene onderdeel aan het andere in het gebied dat wordt omsloten door een denkbeeldige lijn, gelegen op een afstand
      van 100 mm rondom de bevestiging.

      2

      De roestschade in het gebied buiten de denkbeeldige lijn wordt buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.2.19
  - number: 2.2.20
    text: |-
      De beoordeling van roestschade vindt plaats:

        - door visuele controle terwijl het voertuig zich boven een inspectieput of op een hefinrichting bevindt, en
        - in geval van twijfel: 1°. door gebruik te maken van een hamertje met een bolle of afgeronde kop; 2°. door middel
      van meten met een meetmiddel van voldoende bereik.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.2.20
  - number: 2.2.21
    text: |-
      Een roestschadereparatie moet zodanig zijn uitgevoerd dat het onderdeel, de bevestiging van het onderdeel of de
      sectie van de bodemplaat zijn oorspronkelijke functie weer kan vervullen.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.2.21
  - number: 2.2.22
    text: |-
      1 Voor alle onderdelen, bevestigingen van onderdelen of secties van de bodemplaat waarvoor een roestschadegradatie
      is gegeven, geldt dat:

        - reparaties met pasklare gedeelten, waarbij elk deel deugdelijk aan het oorspronkelijke materiaal is gelast,
      toegestaan zijn;
        - vervanging van delen is toegestaan mits deugdelijk gelast dan wel bevestigd met bouten indien de oorspronkelijke
      bevestiging heeft plaatsgevonden door middel van bouten of klinknagels;
        - een reparatie die niet volgens onderdeel a of b is uitgevoerd, als roestschade wordt aangemerkt en beoordeeld,
      waarbij de grootte van de reparatie wordt gezien als de grootte van de roestschade, tenzij anders wordt aangetoond;
        - roestschade van niet meer dan 2E, al dan niet in combinatie met een reparatie volgens onderdeel a, mag zijn
      hersteld.

      2 Onder deugdelijk gelast zoals bedoeld in het eerste lid wordt verstaan:

        - kettinglassen welke ten minste 50% van de omtrek van het te lassen gedeelte bestrijken en goed zijn verdeeld over
      die omtrek, of
        - proplassen (gatlassen) met ten minste een diameter van 4 mm en een onderlinge afstand van niet meer dan 20 mm.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.2.22
  - number: 2.2.23
    text: |-
      1 Indien een veerschotel doorgeroest, of als gevolg van roestschade gescheurd is:

        - mag deze niet zijn gerepareerd;
        - mag deze separaat van de veerpoot als onderdeel van het veersysteem zijn vervangen.

      2 Indien een wielgeleidingselement doorgeroest is, mag deze niet zijn gerepareerd.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.2.23
  - number: 2.2.24
    text: |-
      De langs- en dwarsliggers die deel uitmaken van het chassisraam, bedoeld in [paragraaf 1 van afdeling 2][ref1],
      mogen niet zijn gerepareerd met plaatdelen welke over de roestschade zijn aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0009581#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.2.24
    references:
      - id: ref1
        bwb_id: BWBR0009581
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
  - number: 2.2.25
    text: |-
      De beoordeling van de roestschadereparatie vindt plaats:

        - door visuele controle terwijl het voertuig zich boven een inspectieput of op een hefinrichting bevindt, en
        - in geval van twijfel door middel van meten met een meetmiddel van voldoende bereik.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.2.25
  - number: 2.3.1
    text: |-
      De bevestiging van de onderdelen van het brandstofsysteem en de motor genoemd in
      [hoofdstuk 5 van het Voertuigreglement][ref1] moet voldoen aan de eisen ten aanzien van corrosie bedoeld in
      [titel 2][ref2] van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0009581#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.3.1
    references:
      - id: ref1
        bwb_id: BWBR0006746
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0009581
        hoofdstuk: '2'
  - number: 2.3.2
    text: |-
      1 De in deze paragraaf gestelde eisen ten aanzien van de geluidsniveaumeting gelden alleen voor personenauto"s.

      2 Deze eisen worden niet getoetst tijdens de periodieke keuring ten behoeve van de afgifte van een keuringsbewijs.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.3.2
  - number: 2.3.3
    text: |-
      Het geluidsniveau moet worden gemeten met gebruikmaking van de in de [artikelen 2.3.4][ref1] en [2.3.5][ref2]
      genoemde meetapparatuur, waarbij de in [artikel 2.3.6][ref3] bedoelde meetcondities in acht moeten worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0009581#Artikel2.3.4
      [ref2]: https://wetten.overheid.nl/BWBR0009581#Artikel2.3.5
      [ref3]: https://wetten.overheid.nl/BWBR0009581#Artikel2.3.6
