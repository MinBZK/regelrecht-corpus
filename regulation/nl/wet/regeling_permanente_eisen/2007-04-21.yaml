  - number: 2.2.2
    text: |-
      1 In deze afdeling wordt verstaan onder roestschade:

      door corrosie over de gehele dikte verdwenen materiaal.

      2

      Roestschade wordt per onderdeel, per bevestiging van een onderdeel of per sectie van de bodemplaat uitgedrukt in de
      schade-eenheid "E".
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.2.2
  - number: 2.2.3
    text: |-
      1 De in [bijlage 1][ref1] genoemde onderdelen en bevestigingen van onderdelen van motorrijtuigen met een
      zelfdragende carrosserie mogen per onderdeel, per bevestiging van een onderdeel, of per sectie van een bodemplaat
      niet meer roestschade hebben dan 2E.

      2 Veerschotels mogen niet zijn doorgeroest.


      [ref1]: https://wetten.overheid.nl/BWBR0009581
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0009581
  - number: 2.2.4
    text: |-
      Voor de bepaling van de mate van roestschade in schade-eenheden "E" moet de volgende procedure worden gevolgd:

        - de roestschade-omvang wordt per onderdeel, per bevestiging van een onderdeel of per sectie van de bodemplaat in
      procenten bepaald volgens het van toepassing zijnde beoordelingsprincipe zoals vermeld in [paragraaf 2][ref1] van
      deze afdeling;
        - aan de hand van [bijlage 1][ref2] wordt de te hanteren roestschadegradatie bij maximaal functieverlies van het
      beschadigde onderdeel, de beschadigde bevestiging van een onderdeel dan wel de beschadigde sectie van de bodemplaat
      bepaald;
        - het onder a bepaalde percentage roestschade wordt vermenigvuldigd met de onder b bepaalde roestschadegradatie.


      [ref1]: https://wetten.overheid.nl/BWBR0009581#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0009581
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.2.4
    references:
      - id: ref1
        bwb_id: BWBR0009581
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0009581
  - number: 2.2.5
    text: |-
      1 De bepaling van de roestschade-omvang van langs- en dwarsliggers geschiedt aan de hand van de volgende
      beoordelingsprincipes, waarbij het hoogste percentage maatgevend is: a. de verhouding uitgedrukt in procenten
      tussen het beschadigde deel van de omtrek en de gehele omtrek van de dwarsdoorsnede, een eventuele versterking
      in de langs- of dwarsligger daarbij inbegrepen. Bij de berekening van de omtrek van de dwarsdoorsnede worden de
      bevestigingsflenzen niet meegerekend, en b. de verhouding uitgedrukt in procenten tussen de lengte van de schade
      en de werkelijke lengte van de langs- of dwarsligger tussen de draagpunten, zoals weergegeven in figuur 1, of
      zoals bij het betreffende onderdeel in bijlage 1 is omschreven. Bij de bepaling van de roestschade worden de
      bevestigingsflenzen meegerekend.

      2 Indien een plaatdeel samen met een voorgevormd profiel een koker vormt, wordt het geheel beoordeeld als een
      langs- of dwarsligger.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.2.5
  - number: 2.2.6
    text: |-
      1 Voor de bepaling van de roestschade-omvang van de bodemplaat van de personenruimte wordt de bodemplaat in secties
      verdeeld, zoals weergegeven in figuur 2, waarna elke sectie afzonderlijk wordt beoordeeld.

      2 De secties worden gevormd door de volgende sectielijnen:

        - **Sectielijn 1**: de middenkoker of de lengtehartlijn.
        - **Sectielijn 2**: de dwarsligger ter plaatse van de voorzijde van de voorste zitplaatsen of indien ter plaatse
      geen dwarsligger aanwezig is de voorzijde van de voorste zitplaatsen in de achterste gebruiksstand.
        - **Sectielijn 3**: elke voorzijde van de achter de voorste zitplaatsen (achter elkaar) gelegen zitplaatsen in de
      achterste gebruiksstand.
        - **Sectielijn 4**: het einde van de bodemplaat onder de personenruimte.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.2.6
  - number: 2.2.7
    text: |-
      1 De bepaling van de roestschade-omvang van de bodemplaat van de personenruimte geschiedt aan de hand van de
      volgende beoordelingsprincipes, waarbij het hoogste percentage maatgevend is:

        - de verhouding uitgedrukt in procenten tussen het beschadigde oppervlak van de sectie en het gehele oppervlak van
      de sectie, en
        - de verhouding tussen de lengte van de schade aan de randen van de sectie en de totale randlengte van de sectie.

      2 Roestschade die doorloopt in verschillende secties moet worden beoordeeld als schade die aanwezig is in de
      grootste van de betrokken secties.

      3 Bij dubbele bodemplaten wordt de bovenste plaat beoordeeld zoals is aangegeven in het eerste lid; de onderste
      plaat wordt beoordeeld als één grote sectie.

      4 Indien een gedeelte van de bodemplaat tevens deel uitmaakt van een langs- of dwarsligger (koker), moet dit
      gedeelte worden meegerekend voor de bepaling van het oppervlak dan wel de randlengte.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.2.7
  - number: 2.2.8
    text: |-
      De bepaling van de roestschade-omvang van wielkasten geschiedt aan de hand van de volgende beoordelingsprincipes,
      waarbij het hoogste percentage maatgevend is:

        - de verhouding uitgedrukt in procenten tussen het beschadigde oppervlak en het gehele oppervlak, en
        - de verhouding tussen de totale lengte van de schade aan de randen en de totale randlengte, en
        - de verhouding tussen de lengte van de schade per zijde van de wielkast en de bevestigingslengte van die zijde aan
      een ander onderdeel.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.2.8
  - number: 2.2.9
    text: |-
      1 De bepaling van de roestschade-omvang van plaatdelen, met uitzondering van de bodemplaat en de wielkasten,
      geschiedt aan de hand van de volgende beoordelingsprincipes waarbij het hoogste percentage maatgevend is:

        - de verhouding uitgedrukt in procenten tussen het beschadigde oppervlak en het gehele oppervlak, en
        - de verhouding tussen de lengte van de schade aan de randen en de totale randlengte.

      2 Indien een gedeelte van een plaatdeel tevens deel uitmaakt van een langs- of dwarsligger (koker), moet dit
      gedeelte worden meegerekend voor de bepaling van het oppervlak dan wel de randlengte.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.2.9
  - number: 2.2.10
    text: |-
      1 De roestschade-omvang van de bevestiging van onderdelen, met uitzondering van de bevestiging van plaatdelen
      en wielkasten, wordt bepaald door een schatting te maken omtrent de afname in procenten van de sterkte van de
      bevestiging van het ene onderdeel aan het andere, in het gebied dat wordt omsloten door een denkbeeldige lijn
      gelegen op een afstand van 100 mm rondom de bevestiging.

      2 De roestschade in het gebied buiten de denkbeeldige lijn wordt buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.2.10
  - number: 2.2.11
    text: |-
      De beoordeling van roestschade vindt plaats:

        - door visuele controle terwijl het voertuig zich boven een inspectieput of op een hefinrichting bevindt, en
        - in geval van twijfel: 1°. door gebruik te maken van een hamertje met een bolle of afgeronde kop; 2°. door middel
      van meten met een meetmiddel van voldoende bereik.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.2.11
  - number: 2.2.12
    text: |-
      1 In deze paragraaf wordt onder roestschade verstaan: gedeeltelijk door corrosie verdwenen materiaal.

      2 Roestschade in het chassisraam wordt per langs- of dwarsligger dan wel per profiel uitgedrukt in procenten.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.2.12
  - number: 2.2.13
    text: |-
      1 De langs- en dwarsliggers van het chassisraam en alle profielen die deel uitmaken van de ondersteuning van de
      draaikrans of opleggerkoppeling dan wel koppelingsplaat mogen, per langs- of dwarsligger dan wel per profiel, niet
      meer roestschade hebben dan het percentage vermeld in [bijlage 2][ref1].

      2 De beoordeling van de roestschadeomvang van de langs- en dwarsliggers van het chassisraam geschiedt aan de hand
      van de lengte van de langs- en dwarsliggers tussen de draagpunten.

      3 In afwijking van het bepaalde in het eerste lid moeten langs- en dwarsliggers van het chassisraam die uitsluitend
      voor de ondersteuning van de laadvloer zijn aangebracht, als hulplangs- of hulpdwarsbalk worden aangemerkt waarop
      [paragraaf 2][ref2] van deze afdeling van toepassing is.

      4 In afwijking van het bepaalde in het eerste lid is op langs- en dwarsliggers van het chassisraam, die zijn
      vervaardigd uit plaatmateriaal, waarvan de dikte maximaal 2 mm bedraagt, [paragraaf 2][ref3] van deze afdeling
      van toepassing.

      5 Op een gedeeltelijk zelfdragende carrosserie in combinatie met een chassisraam zijn voor het zelfdragende deel de
      eisen van [afdeling 1][ref4] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009581
      [ref2]: https://wetten.overheid.nl/BWBR0009581#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0009581#Hoofdstuk2
      [ref4]: https://wetten.overheid.nl/BWBR0009581#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.2.13
    references:
