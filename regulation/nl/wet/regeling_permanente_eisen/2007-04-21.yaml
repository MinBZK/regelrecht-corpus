  - number: 2.8.61
    text: |-
      De beoordeling van de overberemming van de achterste as of het achterste asstel van een driewielig motorrijtuig
      moet plaatsvinden door middel van een remproef op de weg zoals bepaald in [paragraaf 1][ref1] van deze afdeling;
      het gebruik van een remvertragingsmeter is niet noodzakelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0009581#Hoofdstuk2
