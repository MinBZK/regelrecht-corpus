preamble:
  text: |-
    Gelet op hoofdstuk 5 van het Voertuigreglement;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
             boekwerk "APK-milieukeuringseisen":

              de editie van het door de minister vastgestelde boekwerk "APK-milieukeuringseisen", die geldig is op het
      moment van de keuring;



            b
             Mc Pherson-wielophangingsysteem:

              een wielgeleidend systeem waarin elementen van de sturing, vering en schokdemping zijn gecombineerd.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel1
  - number: 2.1.1
    text: |-
      Dit hoofdstuk is van toepassing op:

        - personenauto's,
        - bedrijfsauto's,
        - driewielige motorrijtuigen met een massa van het ledig voertuig van meer dan 400 kg, alsmede
        - aanhangwagens met een toegestane maximum massa van meer dan 3500 kg.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.1.1
  - number: 2.2.1
    text: |-
      Onderdelen als bedoeld in [hoofdstuk 5 van het Voertuigreglement][ref1], alsmede de bevestiging van onderdelen van
      personenauto's, bedrijfsauto's, driewielige motorrijtuigen met een massa van het ledig voertuig van meer dan 400 kg
      en aanhangwagens met een toegestane maximum massa van meer dan 3500 kg moeten voor wat betreft corrosie voldoen aan
      de in [afdeling 1][ref2], [2][ref3] en [3][ref4] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0009581#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0009581#Hoofdstuk2
      [ref4]: https://wetten.overheid.nl/BWBR0009581#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.2.1
