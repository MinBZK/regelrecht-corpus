    text: |-
      Indien de controle van de remvertraging van de parkeerrem van een bedrijfsauto met een toegestane maximum massa
      van meer dan 3500 kg plaats vindt door middel van een beproeving van het voertuig op een rollenremtestbank, moet
      de bij de remproef behaalde remvertraging worden berekend door de remkrachten aan de wielen te delen door de op het
      kentekenbewijs vermelde massa van het ledig voertuig, vermeerderd met 100 kg.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.40
  - number: 2.8.41
    text: |-
      De bedrijfsrem van de aanhangwagen moet regelbaar en onafhankelijk van het trekkende motorrijtuig kunnen worden
      bediend; dit geschiedt door middel van de strekrem die de volledige druk van de bedrijfsrem kan doorsturen of
      met behulp van een inrichting waarmee vanuit het trekkende motorrijtuig door middel van de bedrijfsrem van de
      aanhangwagen het samenstel van voertuigen kan worden afgeremd, waarbij het functioneren van de bedrijfsrem van het
      samenstel niet mag worden beïnvloed.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.41
  - number: 2.8.42
    text: |-
      1 De gewichtsverhouding tussen het trekkende motorrijtuig en de aanhangwagen mag niet extreem groot zijn.

      2 De ingestuurde druk en de druk in de remcilinders van de aanhangwagen moeten in de cabine van het trekkende
      motorrijtuig kunnen worden afgelezen.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.42
  - number: 2.8.43
    text: |-
      Indien de remvertraging van een aanhangwagen met een toegestane maximum massa van meer dan 3500 kg en die voorzien
      is van een drukluchtremsysteem wordt gecontroleerd door middel van een beproeving van het voertuig op de weg met
      behulp van een zelfregistrerende remvertragingsmeter waarbij extrapolatie wordt toegepast, moet:

        - de remvertraging worden bepaald door het opvoeren van de met de strekrem of de inrichting ingestuurde druk de
      blokkeergrens van één of meer wielen van de aanhangwagen, waarna met een iets lagere druk de remvertraging wordt
      geregistreerd en de druk in de remcilinders wordt gemeten;
        - het gemiddelde van de geregistreerde remvertraging gedurende twee seconden worden genomen, waarbij pieken niet
      mogen worden meegeteld.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.43
  - number: 2.8.44
    text: |-
      1 De extrapolatiedruk wordt gesteld op:

        - 6,5 bar indien het een aanhangwagen, betreft in gebruik genomen na 31 december 1997,
        - 6 bar indien het een aanhangwagen betreft in gebruik genomen vóór 1 januari 1998, of
        - 4,5 bar indien het een aanhangwagen betreft met een éénleiding remsysteem dan wel een gecombineerd één- en
      tweeleidingremsysteem.

      2 Indien de druk in de remcilinders wordt begrensd, doordat een ventiel of een remkrachtregelaar bij de toegestane
      maximum massa onder een as de ingestuurde druk reduceert, is de extrapolatiedruk gelijk aan de begrensde druk.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.44
  - number: 2.8.45
    text: |-
      1 Voor de toepassing van dit artikel wordt verstaan onder:

        - a = geëxtrapoleerde remvertraging;
        - a = gemiddelde remvertraging van de combinatie;
        - M= totale massa van de combinatie die met de aanhangwagen is afgeremd;
        - M= maximale massa onder de assen van de aanhangwagen;
        - P = extrapolatiedruk;
        - P = ingestuurde remcilinderdruk;
        - 0,4 = aanspreekdruk, tenzij door meting anders bepaald;
        - 0,15 = aangenomen rolweerstand trekkend motorrijtuig;
        - a = remvertraging "lege" aanhangwagen;
        - M = massa onder de assen van de "lege" aanhangwagen

      2 Van een aanhangwagen met een toegestane maximum massa van meer dan 3500 kg moet de vaststelling van de
      remvertraging van de bedrijfsrem en de extrapolatie plaatsvinden:

        - indien het voertuig is voorzien van een remsysteem zonder automatische lastafhankelijke regelaar dan wel met een
      automatische lastafhankelijke regelaar voor alle assen, volgens de volgende formule:
        - 1°. met ingang van 1 januari 1996 door een nieuwe remproef en een nieuwe berekening met een lichter trekkend
      motorrijtuig dan wel een geheel of gedeeltelijk belaste aanhangwagen, volgens de in onderdeel a genoemde formule,
      indien de drukfactor groter is dan 3 of de gemiddelde remvertraging van het samenstel van trekkend motorrijtuig
      en aanhangwagen minder bedraagt dan 1,5 m/sec2; indien de aanhangwagen geheel of gedeeltelijk wordt belast, moet
      de totale massa van het samenstel (M) en van de aanhangwagen (M) door middel van weging worden vastgesteld. Indien
      de massa van de extra aangebrachte belasting exact bekend is, mag weging van de aanhangwagen achterwege blijven;
      Indien de drukfactor, bedoeld in 1°, wordt gesteld op 3, hoeft de aanhangwagen niet te worden belast als daarbij
      blijkt dat de berekende remvertraging groter dan of gelijk is aan de minimaal vereiste remvertraging.
        - indien het voertuig is voorzien van een remsysteem met automatische lastafhankelijke regelaar voor een deel
      van de assen dan wel van een remsysteem met meerdere automatische lastafhankelijke regelaars, volgens de volgende
      formule:
