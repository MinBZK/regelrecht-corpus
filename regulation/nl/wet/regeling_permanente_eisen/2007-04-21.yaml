  - number: 2.3.4
    text: |-
      1 De geluidsniveaumeter moet ten minste voldoen aan het bepaalde in Publicatie nr. 651, eerste editie 1979,
      Geluidsniveaumeters, van de Internationale Electrotechnische Commissie (IEC) voor geluidsniveaumeters met de
      nauwkeurigheidsklasse Type 1.

      2 De calibratiegeluidsbron moet ten minste voldoen aan het bepaalde in Publicatie nr. 942, eerste editie 1988, van
      de IEC voor calibratiegeluidsbronnen met de nauwkeurigheidsklasse 1.

      3 De geluidsniveaumeter en de calibratiegeluidsbron moeten jaarlijks gecalibreerd en getoetst worden aan de eisen
      bedoeld in het eerste respectievelijk het tweede lid. Hiervan moeten verklaringen aanwezig zijn, afgegeven door NMI
      IJkwezen BV of door een door de minister gemachtigde instelling, waaruit blijkt dat zij aan de eisen voldoen.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.3.4
  - number: 2.3.5
    text: |-
      1 De toerenteller moet een nauwkeurigheid hebben van ten minste 3%.

      2 Bij de toerenteller moet een verklaring aanwezig zijn ten aanzien van de nauwkeurigheid, welke niet ouder mag
      zijn dan twee jaar, afgegeven door NMI IJkwezen BV of door een door de minister gemachtigde instelling.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.3.5
  - number: 2.3.6
    text: |-
      1 De meting vindt plaats in de open lucht.

      2 Het proefterrein mag niet blootstaan aan sterke akoestische storingen. Hieraan wordt voldaan indien het oppervlak
      van het terrein bestaat uit beton, asfalt, tegels of een vergelijkbaar hard materiaal.

      3 Het proefterrein moet minimaal de afmetingen van een rechthoek hebben, waarvan de zijden zich op ten minste
      3,00 m afstand van de personenauto bevinden, zoals weergegeven in figuur 4. Binnen deze rechthoek mogen zich
      geen personen of voorwerpen bevinden die niet noodzakelijk zijn voor de meting. De personenauto wordt op zodanige
      wijze binnen de rechthoek geplaatst dat de microfoon zich op ten minste 1,00 m afstand van eventueel aanwezige
      trottoirbanden bevindt.

      4 De waarden die door de geluidsniveaumeter voor het omgevingsgeluid en de wind worden aangegeven, moeten ten
      minste 10 dB (A) beneden het geluidsniveau zijn gelegen dat in het kentekenregister wordt vermeld. Dit wordt
      gecontroleerd door vaststelling van het achtergrondgeluidsniveau voor en na de meting. De microfoon van de
      geluidsniveaumeter mag van een passende windkap worden voorzien, mits rekening wordt gehouden met de invloed
      daarvan op de gevoeligheid van de microfoon.

      5 Voor aanvang van de meting moet de motor van de personenauto op bedrijfstemperatuur worden gebracht.

      6 De meting vindt plaats bij een stilstaande personenauto.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.3.6
  - number: 2.3.7
    text: |-
      De meting van het geluidsniveau wordt uitgevoerd aan de hand van de onderstaande wijze van keuren:

        - voor de aanvang van de meting wordt de geluidsniveaumeter ingesteld op de tijdweging "F" (voorheen aangeduid met
      "Fast") en de frequentieweging "A" bedoeld in [artikel 2.3.4, eerste lid][ref1], genoemde IEC publicatie;
        - de motor is op bedrijfstemperatuur indien deze ongeveer vijftien minuten onder normale bedrijfsomstandigheden
      heeft gefunctioneerd;
        - aan het begin en einde van iedere serie metingen moet de geluidsniveaumeter gecalibreerd worden
      volgens de aanwijzingen van de fabrikant met behulp van een calibratiegeluidsbron, welke voldoet aan
      [artikel 2.3.4, tweede en derde lid][ref2];
        - de afwijking tussen het geluidsdrukniveau van de calibratiegeluidsbron en de aanwijzing van de geluidsniveaumeter
      mag niet groter zijn dan 1 dB(A). Indien deze waarde bij de aanvangscontrole wordt overschreden moet de
      geluidsniveaumeter zodanig gejusteerd worden dat wel aan deze eis wordt voldaan. Als aan het einde van de serie
      metingen wordt geconstateerd dat deze afwijking groter is dan 1 dB(A), is de serie metingen ongeldig;
        - de microfoon van de geluidsniveaumeter moet in de volgende positie worden geplaatst, zoals weergegeven in figuur
      5: 1°. ter hoogte van de uitlaatmonding, in ieder geval ten minste 0,20 m boven het wegdek; 2°. het membraan van de
      microfoon is naar de uitlaatmonding gericht en bevindt zich op een afstand van 0,50 m (waarbij een afwijking van 50
      mm is toegestaan); 3°. de hoofdgevoeligheidsas van de microfoon loopt evenwijdig aan het wegdek en vormt een hoek
      van niet minder dan 35° en niet meer dan 55° met het loodrechte vlak waarin de emissierichting van de uitlaatgassen
      ligt; de microfoon is zo geplaatst dat de afstand tussen de microfoon en de personenauto het grootst is; 4°.
      indien het uitlaatsysteem meerdere uitmondingen heeft, die zijn aangesloten op eenzelfde geluidsdemper, waarvan de
      middelpunten niet meer dan 0,30 m van elkaar zijn verwijderd, is de microfoon gericht op de uitmonding die zich het
      dichtst bij de omtrek van de personenauto of zich het hoogst boven het wegdek bevindt. Indien de middelpunten van
      de uitmondingen meer dan 0,30 m van elkaar zijn verwijderd, wordt bij iedere uitmonding een afzonderlijke meting
      verricht, waarbij alleen de hoogst gemeten waarde wordt aangehouden;
        - het toerental van de motor wordt op de waarde gebracht die in het kentekenregister voor de betreffende
      personenauto is vermeld;
        - na het bereiken van de in onderdeel f vermelde waarde wordt het gaspedaal snel losgelaten. De tijdsduur van de
      meting van het geluidsniveau omvat de periode, waarin het toerental constant wordt gehouden, en de gehele duur van
      de vermindering van het toerental tot het stationaire toerental weer is bereikt;
        - er wordt per meetpunt ten minste een serie van drie metingen verricht, waarbij: 1°. de hoogste waarde die de
      geluidsniveaumeter heeft aangegeven, als meetwaarde per meting geldt; 2°. de meetwaarde per meting op de meest
      nabijgelegen hele decibel wordt afgerond; 3°. alleen meetwaarden die bij drie opeenvolgende metingen worden
      verkregen en onderling niet meer dan 2 dB(A) verschillen, mogen worden aangehouden; 4°. als meetresultaat de
      hoogste van deze drie meetwaarden geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0009581#Artikel2.3.4
      [ref2]: https://wetten.overheid.nl/BWBR0009581#Artikel2.3.4
