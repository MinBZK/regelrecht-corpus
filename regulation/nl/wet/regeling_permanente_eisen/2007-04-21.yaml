  - number: 2.4.1
    text: |-
      De bevestiging van de onderdelen van de aandrijving genoemd in [hoofdstuk 5 van het Voertuigreglement][ref1] moet
      voldoen aan de eisen ten aanzien van corrosie bedoeld in [titel 2][ref2] van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0009581#Hoofdstuk2
