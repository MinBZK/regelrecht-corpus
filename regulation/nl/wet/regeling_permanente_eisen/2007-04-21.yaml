  - number: 2.9.25a
    text: |-
      1 - De onderrand van de zijdelingse afscherming bevindt zich op niet meer dan 0,55 m boven het wegdek, en
        - de bovenrand reikt ten minste tot 0,35 m onder de bovenbouw of tot de hoogte van de laadvloer, dan wel reikt tot
      0,95 m boven het wegdek. Indien het een voertuig betreft met een verwisselbare opbouw mag de bovenzijde lager zijn
      gelegen dan 0,95 m.

      2 De zijdelingse afscherming kan onder meer worden gevormd door permanent aanwezige carrosseriedelen,
      randprofielen, wielafschermingen, accubakken, lucht- of brandstofreservoirs en gereedschapskisten, dan wel door
      afzonderlijk aangebrachte vormvaste delen.

      3 De vormvaste delen als bedoeld in het tweede lid moeten een doorlopend vlak oppervlak hebben of zijn opgebouwd
      uit één of meerdere horizontaal gemonteerde profielen die onderling niet meer dan 0,30 m uit elkaar liggen en die
      een hoogte hebben van tenminste:

        - 50 mm, indien het een bedrijfsauto betreft met een toegestane maximum massa van niet meer dan 12.000 kg of indien
      het een aanhangwagen, met uitzondering van een middenasaanhangwagen, betreft met een toegestane maximum massa van
      niet meer dan 10.000 kg;
        - 0,1 m, indien het een bedrijfsauto betreft met een toegestane maximum massa van meer dan 12.000 kg of indien het
      een aanhangwagen, met uitzondering van een middenasaanhangwagen, betreft met een toegestane maximum massa van meer
      dan 10.000 kg.

      4 In afwijking van het bepaalde in het derde lid mogen voertuigen met een wisselbare opbouw zijn voorzien van een
      zijdelingse afscherming die bestaat uit één profiel met een hoogte van ten minste:

        - 50 mm, indien het een bedrijfsauto betreft met een toegestane maximum massa van niet meer dan 12.000 kg of indien
      het een aanhangwagen, met uitzondering van een middenasaanhangwagen, betreft met een toegestane maximum massa van
      niet meer dan 10.000 kg;
        - 0,1 m, indien het een bedrijfsauto betreft met een toegestane maximum massa van meer dan 12.000 kg of indien het
      een aanhangwagen, met uitzondering van een middenasaanhangwagen, betreft met een toegestane maximum massa van meer
      dan 10.000 kg.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.9.25a
  - number: 2.9.25b
    text: |-
      1 De zijdelingse afscherming, als bedoeld in [artikel 2.9.25, eerste lid, onderdeel b][ref1], kan onder meer
      worden gevormd door permanent aanwezige carrosseriedelen, randprofielen, wielafschermingen, accubakken, lucht-
      of brandstofreservoirs en gereedschapskisten, dan wel door afzonderlijk aangebrachte vormvaste profielen met een
      hoogte van ten minste 30 mm.

      2 De onderrand bevindt zich niet meer dan 1,30 m boven het wegdek.


      [ref1]: https://wetten.overheid.nl/BWBR0009581#Artikel2.9.25
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.9.25b
    references:
      - id: ref1
        bwb_id: BWBR0009581
        artikel: 2.9.25
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '4'
  - number: 2.9.26
    text: |-
      1 Voertuigen in gebruik genomen vóór 1 januari 1998 moeten binnen de in [artikel 2.9.24][ref1] genoemde vlakken
      aan elke zijkant zijn voorzien van een zijdelingse afscherming, overeenkomstig het tweede lid, waarvan de onderrand
      zich niet meer dan 1,30 m boven het wegdek mag bevinden.

      2 De zijdelingse afscherming kan ondermeer worden gevormd door permanent aanwezige carrosseriedelen, randprofielen,
      wielafschermingen, accubakken, lucht- of brandstofreservoirs en gereedschapskisten, dan wel door afzonderlijk
      aangebrachte vormvaste profielen met een hoogte van ten minste van 30 mm.


      [ref1]: https://wetten.overheid.nl/BWBR0009581#Artikel2.9.24
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.9.26
    references:
      - id: ref1
        bwb_id: BWBR0009581
        artikel: 2.9.24
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '4'
  - number: 2.9.27
    text: |-
      1 De in [artikel 2.9.25][ref1] en [artikel 2.9.26][ref2] bedoelde zijdelingse afscherming moet deugdelijk zijn
      bevestigd.

      2 De zijdelingse afscherming moet aanwezig zijn op een afstand van niet meer dan 0,12 m binnenwaarts ten opzichte
      van het breedste punt van het voertuig. Indien het voertuig na het breedste punt in breedte afneemt, moet de
      afstand van 0,12 m worden gemeten vanaf het verticale raakvlak door het breedste punt en enig raakpunt met een
      daarachter gelegen voertuigdeel, zoals weergegeven in figuur 31.


      [ref1]: https://wetten.overheid.nl/BWBR0009581#Artikel2.9.25
      [ref2]: https://wetten.overheid.nl/BWBR0009581#Artikel2.9.26
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.9.27
    references:
