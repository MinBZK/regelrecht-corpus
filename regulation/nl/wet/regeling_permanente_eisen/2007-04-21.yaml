    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.27
  - number: 2.8.28
    text: |-
      Indien de controle van de remvertraging van de parkeerrem van een bedrijfsauto met een toegestane maximum massa
      van meer dan 3500 kg plaats vindt door middel van een beproeving van het voertuig op de weg met behulp van een
      zelfregistrerende remvertragingsmeter, moet het voertuig aan het einde van de remproef geheel of nagenoeg geheel
      stilstaan.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.28
  - number: 2.8.29
    text: Bij de categorie voertuigen bedoeld in deze paragraaf wordt de rolweerstand bij de extrapolatie meegerekend.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.29
  - number: 2.8.30
    text: |-
      Indien de controle van de remvertraging van de bedrijfsrem van een bedrijfsauto met een toegestane maximum
      massa van meer dan 3500 kg plaats vindt door middel van een beproeving van het voertuig op een rollenremtestbank
      waarbij de belasting van het voertuig door middel van spanbanden of spankettingen zodanig wordt gesimuleerd dat de
      ingestuurde remcilinderdruk de drukfactor bereikt, bedoeld in [artikel 2.8.33, derde lid][ref1],

        - moeten, nadat de gesimuleerde belasting is aangebracht, per as de maximale remkrachten aan de wielen worden
      vastgesteld;
        - moet de bij de remproef behaalde remvertraging worden berekend door de remkrachten bij elkaar op te tellen en
      vervolgens te delen door de op het kentekenbewijs vermelde toegestane maximum massa van het voertuig.


      [ref1]: https://wetten.overheid.nl/BWBR0009581#Artikel2.8.33
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.30
    references:
