  - number: 2.8.35
    text: |-
      Indien een bedrijfsauto met een toegestane maximum massa van meer dan 3500 kg is voorzien van een hydraulisch
      remsysteem dan wel van een mechanisch remsysteem, moet de vaststelling van de remvertraging van de bedrijfsrem en
      de extrapolatie plaatsvinden overeenkomstig [artikel 2.8.36][ref1] waarbij wordt verstaan onder:

        - A1: niet bekrachtigd hydraulisch en mechanisch remsysteem;
        - A2: niet bekrachtigd hydraulisch remsysteem met automatische lastafhankelijke regelaar, of een andere vorm van
      remdrukbegrenzing;
        - B1: bekrachtigd hydraulisch remsysteem;
        - B2: bekrachtigd hydraulisch remsysteem met automatische lastafhankelijke regelaar, of een andere vorm van
      remdrukbegrenzing;
        - C1: druklucht bediend hydraulisch remsysteem;
        - C2: druklucht bediend hydraulisch remsysteem met automatische lastafhankelijke regelaar, of een andere vorm van
      remdrukbegrenzing.


