        bwb_id: BWBR0009581
        artikel: 2.9.25
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0009581
        artikel: 2.9.26
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '4'
  - number: 2.9.28
    text: |-
      De in [artikel 2.9.25][ref1] en [artikel 2.9.26][ref2] bedoelde zijdelingse afscherming mag zijn onderbroken,
      echter de onderbreking mag, gemeten in lengterichting:

        - niet groter zijn dan 25 mm, indien het voertuig na 31 december 1997 in gebruik is genomen, of niet groter zijn dan
      0,30 m indien de afscherming is aangebracht binnen het in [artikel 2.9.24, eerste lid, onderdeel a, sub 2][ref3],
      en de onderdelen b en c, genoemde vlak. In afwijking hiervan is een onderbreking van maximaal 100 mm ter plaatse
      van de steunpoten, en maximaal 50 mm ter plaatse van het vulopening van het brandstofreservoir toegestaan;
        - niet groter zijn dan 0,30 m, indien het voertuig vóór 1 januari 1998 in gebruik is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0009581#Artikel2.9.25
      [ref2]: https://wetten.overheid.nl/BWBR0009581#Artikel2.9.26
      [ref3]: https://wetten.overheid.nl/BWBR0009581#Artikel2.9.24
