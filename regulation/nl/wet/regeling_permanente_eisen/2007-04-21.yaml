        bwb_id: BWBR0009581
        artikel: 2.8.33
        hoofdstuk: '2'
        paragraaf: '5'
        afdeling: '2'
  - number: 2.8.31
    text: |-
      1 Bij de vaststelling van de maximale remkrachten zoals bedoeld in [artikel 2.8.30, onderdeel a][ref1], moet het
      volgende in acht worden genomen:

        - de pedaalkracht respectievelijk de remdruk hoeft niet bij alle assen gelijk te zijn;
        - bij de remtest moet het rempedaal langzaam worden ingetrapt en op het moment van aflezen worden vastgehouden;
        - de maximale remkracht wordt bereikt wanneer: 1°. een pedaalkracht van 700 N wordt uitgeoefend, 2°. één of meer
      wielen van het voertuig blokkeren, of 3°. de rollenremtestbank afslaat.

      2 Indien de remkracht op één wiel tussen twee waarden schommelt of de remkrachten op beide wielen van een as tussen
      twee waarden schommelen, moeten per wiel de minimale en maximale remkracht worden gemiddeld en wordt dit gemiddelde
      gebruikt als remkracht voor dat wiel.


      [ref1]: https://wetten.overheid.nl/BWBR0009581#Artikel2.8.30
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.31
    references:
