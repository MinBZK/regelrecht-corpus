  - number: 2.8.1
    text: |-
      De bevestiging van de onderdelen van de reminrichting genoemd in [hoofdstuk 5 van het Voertuigreglement][ref1] moet
      voldoen aan de eisen ten aanzien van corrosie bedoeld in [titel 2][ref2] van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0009581#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.1
    references:
      - id: ref1
        bwb_id: BWBR0006746
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0009581
        hoofdstuk: '2'
  - number: 2.8.2
    text: |-
      Een remleiding mag niet zodanig door corrosie zijn aangetast dat deze na verwijdering van de corrosie van het
      oppervlak nog zogenaamde putcorrosie vertoont, zoals weergegeven in figuur 12.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.2
  - number: 2.8.3
    text: |-
      1 Een remschijf mag niet zodanig door corrosie zijn aangetast dat per kant de breedte van het effectieve gedeelte
      minder bedraagt dan 50% van de maximum breedte van het remblok.

      2 Onder het in het eerste lid bedoelde effectief gedeelte wordt verstaan: een nagenoeg glad oppervlak, zonder
      blijvende corrosievorming ("glimmend" gedeelte).
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.3
  - number: 2.8.4
    text: |-
      Remslangen mogen:

        - geen scherpe knikken of sterke tordering vertonen;
        - in hydraulische remsystemen geen door de druk veroorzaakte vervormingen vertonen die opzwellen ten gevolge van
      het bedienen van het remsysteem met een pedaalkracht van 700 N gedurende ongeveer 30 seconden.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.4
  - number: 2.8.5
    text: |-
      Kunststofremleidingen van bedrijfsauto's mogen zich niet bevinden op:

        - een afstand van minder dan 0,10 m van het uitlaatsysteem van de motor, tenzij ter plaatse een doeltreffend
      hitteschild is aangebracht;
        - een plaats waarop de stroom van de uitlaatgassen direct is gericht.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.5
  - number: 2.8.6
    text: |-
      1 De in deze afdeling gestelde eisen worden beoordeeld door middel van visuele controle, terwijl het voertuig zich
      boven een inspectieput of op een hefinrichting bevindt.

      2 Bij de controle van [artikel 2.8.4, onderdeel b][ref1], moet het rempedaal worden ingetrapt totdat een kracht
      van 700 N op het pedaal wordt uitgeoefend. Deze kracht moet gedurende ongeveer 30 seconden worden uitgeoefend
      waarbij het pedaal niet op de aanslag mag komen. Indien een rembekrachtiger aanwezig is, moet de controle worden
      uitgevoerd met draaiende motor. Indien een remhandel aanwezig is, moet de controle worden uitgevoerd met de
      maximale handkracht.


      [ref1]: https://wetten.overheid.nl/BWBR0009581#Artikel2.8.4
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.6
    references:
      - id: ref1
        bwb_id: BWBR0009581
        artikel: 2.8.4
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
  - number: 2.8.7
    text: De in deze afdeling gestelde eisen gelden niet voor driewielige motorrijtuigen.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.7
  - number: 2.8.8
    text: |-
      1 De controle van de remvertraging van personenauto's, bedrijfsauto's en aanhangwagens moet plaatsvinden door
      middel van een beproeving op de weg met behulp van een zelfregistrerende remvertragingsmeter dan wel door middel
      van een beproeving van het voertuig op een platenremtestbank of een rollenremtestbank.

      2 Bij bedrijfsauto's met een toegestane maximum massa van meer dan 3500 kg alsmede aanhangwagens met een
      toegestane maximum massa van meer dan 3500 kg moet aan de hand van de vermelde gegevens en formules in
      [paragraaf 4 tot en met 7][ref1] worden bepaald of door middel van extrapolatie kan worden gecontroleerd of het
      voertuig ook in maximale belaste toestand aan de voorgeschreven remvertraging zou kunnen voldoen.

      3 Met ingang van 1 januari 1996 moet tijdens de periodieke keuring ten behoeve van de afgifte van een
      keuringsbewijs, in afwijking van het eerste en tweede lid, bij bedrijfsauto's met een toegestane maximum massa van
      meer dan 3500 kg alsmede bij aanhangwagens met een toegestane maximum massa van meer dan 3500 kg de controle van de
      remvertraging plaatsvinden door middel van de in [paragraaf 5][ref2] respectievelijk [paragraaf 7][ref3] omschreven
      beproeving van het voertuig op een rollenremtestbank.

      4 Het bepaalde in het derde lid is niet van toepassing op:

        - voertuigen die breder zijn dan 2,60 m;
        - voertuigen met een zo kleine wieldiameter dat beproeving in de praktijk niet mogelijk is;
        - bedrijfsauto's met een toegestane maximum massa van meer dan 3500 kg die zijn voorzien van een permanente, niet
      automatische of met de hand uitschakelbare aandrijving op meer dan één as;
        - aanhangwagens met een toegestane maximummassa van meer dan 3500 kg met één of meerdere achter elkaar gelegen
      aslijnen, als bedoeld in [artikel 3.7.9. tweede lid, onder e, van het Voertuigreglement][ref4].

      5 De banden van het voertuig moeten op de juiste spanning zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009581#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0009581#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0009581#Hoofdstuk2
      [ref4]: https://wetten.overheid.nl/BWBR0006746#Artikel3.7.9
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.8
