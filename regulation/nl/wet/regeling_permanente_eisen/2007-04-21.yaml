  - number: 2.8.32
    text: |-
      Bij de controle van de remvertraging van de bedrijfsrem van een bedrijfsauto met een toegestane maximum massa van
      meer dan 3500 kg door middel van een beproeving van het voertuig op een rollenremtestbank zonder dat de belasting
      van het voertuig wordt gesimuleerd, wordt verstaan onder:

        - hoogst bereikbare remvertraging: 1°. de remvertraging die wordt gemeten bij een pedaalkracht van 700 N, 2°. de
      remvertraging die wordt vastgesteld bij een remproef waarbij de rollenremtestbank afslaat, of 3°. de remvertraging
      die wordt vastgesteld bij een remproef waarbij iets minder ingestuurde druk dan wel pedaalkracht wordt gebruikt dan
      nodig is om de blokkeergrens van één of meer wielen van de as op de rollenremtestbank te bereiken;
        - extrapolatiedruk (Pex): gegarandeerde druk in de remcilinder van iedere as waarbij de as maximaal is beladen en
      met het voertuig een volle beremming wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.32
  - number: 2.8.33
    text: |-
      1 De extrapolatiedruk wordt gesteld op 6 bar, tenzij:

        - blijkt dat de druk in de remcilinders van een as wordt begrensd doordat een ventiel of een remkrachtregelaar bij
      de toegestane maximum massa onder een as de ingestuurde druk reduceert, is de extrapolatiedruk voor die as gelijk
      aan de begrensde druk;
        - door middel van documentatie van de voertuigfabrikant of, indien het voertuig is uitgerust met een automatische
      lastafhankelijke remkrachtregelaaar, door middel van de gegevens op de ALR-plaat, wordt aangetoond dat de
      gegarandeerde druk in de remcilinders hoger ligt dan 6 bar. In dat geval mag deze hogere druk als extrapolatiedruk
      worden gebruikt.

      2 Voordat tot extrapolatie wordt overgegaan, moet voor iedere as worden vastgesteld:

        - de maximale remkrachten aan de wielen met de bijbehorende pedaalkrachten, of
        - bij drukluchtremsystemen de benodigde druk in de remcilinder om de maximale remkrachten aan de wielen te
      bereiken.

      3 Met ingang van 1 januari 1996 moet, indien voor de extrapolatie gebruik wordt gemaakt van een formule waarin
      de drukfactor








                    P - 0,4





                    P - 0,4







      voorkomt, deze drukfactor kleiner of gelijk zijn aan 3.

      4 Indien de in het derde lid genoemde drukfactor van een as groter is dan 3: a. moet de betreffende as worden
      belast door op het voertuig een last te plaatsen, of b. door de belasting op die as te vergroten door middel van
      spanbanden of spankettingen, waarna opnieuw de remkrachten van de betreffende as moeten worden bepaald, tenzij de
      berekende remvertraging groter dan of gelijk is aan de minimaal vereiste remvertraging, bij herberekening met een
      drukfactor 3.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.33
  - number: 2.8.34
    text: |-
      1 Bij de vaststelling van de maximale remkrachten zoals bedoeld in [artikel 2.8.33, tweede lid, onderdeel a][ref1],
      moet het volgende in acht worden genomen:

        - de pedaalkracht respectievelijk de remdruk hoeft niet bij alle assen gelijk te zijn;
        - bij de remtest moet het rempedaal langzaam worden ingetrapt en op het moment van aflezen worden vastgehouden;
        - de maximale remkracht wordt bereikt wanneer: 1°. een pedaalkracht van 700 N wordt uitgeoefend, 2°. één of meer
      wielen van het voertuig blokkeren, of 3°. de rollenremtestbank afslaat.

      2 Indien de remkracht op één wiel tussen twee waarden schommelt of de remkrachten op beide wielen tussen twee
      waarden schommelen, moeten per wiel de minimale en maximale remkracht worden gemiddeld en wordt dit gemiddelde
      gebruikt als remkracht voor dat wiel.


