  - number: 2.3.12
    text: |-
      1 In de roetmeter moeten voor het desbetreffende type motorrijtuig de volgende waarden, zoals bedoeld in
      [artikel 2.3.11][ref1], worden ingevoerd:

      a. de maximum absorptiecoëfficiënt,

      b. het minimum en maximum stationair toerental,

      c. het minimum en maximum afregeltoerental, en

      d. de motorolietemperatuur, zijnde de minimumwaarde of de testwaarde.

      Tevens moet de soort meetsonde, die in de handleiding van de roetmeter wordt voorgeschreven, worden ingevoerd.

      2 De in het eerste lid bedoelde gegevens mogen handmatig worden ingevoerd of mogen worden ingelezen vanuit een
      geautomatiseerd bestand.

      3 Nadat de gegevens volgens het eerste lid zijn ingevoerd, wordt met de daadwerkelijke meting begonnen waarbij:

      a. de door de roetmeter aangegeven meetprocedure moet worden gevolgd, en

      b. moet worden voldaan aan het gestelde in het vierde tot en met negende lid.

      4 Als het stationair toerental niet binnen de opgegeven grenzen valt, moet worden nagegaan of de motorcode van
      de gemonteerde motor overeenkomt met het gegeven in het kentekenregister. Indien de motorcode overeenkomt met het
      gegeven in het kentekenregister moet het stationair toerental worden afgesteld. Als hiervoor speciaal gereedschap
      nodig is, of als de verstelling kan leiden tot ontregeling van het motormanagement, moet de meting worden beëindigd
      en mag het voertuig niet worden goedgekeurd. Indien geen gegevens van de gemonteerde motor in het kentekenregister
      voorkomen, moet worden gehandeld overeenkomstig [artikel 2.3.11, derde lid][ref2].

      5 Indien het afregeltoerental niet binnen de opgegeven grenzen valt en de motorcode van de gemonteerde motor
      overeenkomt met het gegeven in het kentekenregister, moet de meting worden beëindigd en mag het voertuig niet
      worden goedgekeurd. Indien geen gegevens van de gemonteerde motor in het kentekenregister voorkomen moet worden
      gehandeld overeenkomstig [artikel 2.3.11, derde lid][ref3].

      6 Bij elke meting moet het gaspedaal snel en zonder onderbreking binnen één seconde tot aan de aanslag worden
      ingedrukt.

      7 Indien de personenauto of bedrijfsauto met een toegestane maximum massa van niet meer dan 3500 kg is uitgerust
      met een volautomatische versnellingsbak:

      a. wordt de motorolie op temperatuur gebracht door stationair draaien van de motor, of door middel van een rit,

      b. heeft de motorolie bij de roetmeting minimaal de in het kentekenregister aangegeven temperatuur, en

      c. vinden per test niet meer dan zes metingen plaats.

      8 Indien door de roetmeter wordt aangegeven dat de motorolietemperatuur te laag is, mag de meting worden uitgevoerd
      met uitgeschakelde beveiliging. Indien de temperatuuropnemer niet in de motor is ingebracht omdat duidelijk is
      dat de motorolie op de vereiste temperatuur is, mag eveneens met uitgeschakelde beveiliging de meting worden
      uitgevoerd.

      9 Indien de meting wordt uitgevoerd met een lagere motorolietemperatuur dan de motorolietemperatuur volgens de
      testwaarde en blijkt dat de maximum absorptiecoëfficiënt wordt overschreden, moet de meting worden herhaald zodra
      de motorolie de temperatuur volgens de testwaarde heeft bereikt.

      10 Op de afdruk van de afdrukinrichting van de roetmeter moet het kenteken of identificatienummer worden vermeld,
      voorzover dit niet reeds automatisch op de afdruk wordt geprint.


