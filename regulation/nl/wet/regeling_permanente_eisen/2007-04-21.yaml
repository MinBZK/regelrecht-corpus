  - number: 2.7.2
    text: |-
      1 Het flexibele materiaal van de koppeling mag niet voor 50% of meer, over iedere volledige doorsnede (in één
      vlak), door scheurvorming of door het loslaten van de vulcanisatie zijn beschadigd, zoals weergegeven in figuur 10.

      2 Het eerste lid geldt niet voor aanhangwagens met een toegestane maximum massa van meer dan 3500 kg.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.7.2
  - number: 2.7.3
    text: |-
      1 Stuurkogels en de overige stuurverbindingen in het stangenstelsel mogen, naast eventuele oorspronkelijke speling,
      door slijtageverschijnselen niet meer speling hebben dan:

        - 1,0 mm, in radiale richting, zoals weergegeven in figuur 11;
        - 1,0 mm, in axiale richting, zoals weergegeven in figuur 11.

      2 De in het eerste lid genoemde oorspronkelijke speling van de stuurkogel die het gevolg is van de indrukking van
      het veerelement in de kogel, wordt vastgesteld:

        - met behulp van het werkplaatshandboek of soortgelijke informatie, dan wel
        - door middel van indrukking van een nieuwe kogel.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.7.3
  - number: 2.7.4
    text: |-
