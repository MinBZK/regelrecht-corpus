  - number: 2.8.18
    text: |-
      Indien de controle van de remvertraging van de parkeerrem van een personenauto of een bedrijfsauto met een
      toegestane maximum massa van niet meer dan 3500 kg plaats vindt door middel van een beproeving van het voertuig op
      een rollenremtestbank, moet de bij de remproef behaalde remvertraging worden berekend door de remkrachten aan de
      wielen te delen door de op het kentekenbewijs vermelde massa van het ledig voertuig, vermeerderd met 100 kg.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.18
  - number: 2.8.19
    text: |-
      Bij de controle van de remvertraging van de bedrijfsrem van een bedrijfsauto met een toegestane maximum massa van
      meer dan 3500 kg door middel van een beproeving van het voertuig op de weg met behulp van een zelfregistrerende
      remvertragingsmeter wordt verstaan onder:

        - hoogst bereikbare remvertraging: de remvertraging die wordt vastgesteld bij een remproef waarbij iets minder
      ingestuurde druk dan wel pedaalkracht wordt gebruikt dan nodig is om de blokkeergrens van één of meer wielen van
      het voertuig te bereiken;
        - extrapolatiedruk (Pex): de gegarandeerde druk in de remcilinder van een as wanneer het voertuig maximaal is
      belast en met dit voertuig een volle beremming wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.19
  - number: 2.8.20
    text: |-
      1 Bij de beproeving van de bedrijfsrem moet een vertraging worden gemeten die ten minste gelijk is aan de in het
      [Voertuigreglement][ref1] voor de betreffende bedrijfsauto genoemde minimaal vereiste remvertraging.

      2 Bij de categorie voertuigen bedoeld in deze paragraaf wordt de rolweerstand bij de extrapolatie meegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0006746
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.20
    references:
      - id: ref1
        bwb_id: BWBR0006746
  - number: 2.8.21
    text: |-
      1 De extrapolatiedruk wordt gesteld op 6 bar, tenzij:

        - de druk in de remcilinders van een as wordt begrensd, doordat een ventiel of een remkrachtregelaar bij de
      toegestane maximum massa onder een as de ingestuurde druk reduceert, in welk geval de extrapolatiedruk voor die as
      gelijk is aan de begrensde druk;
        - door middel van documentatie van de voertuigfabrikant of, indien het voertuig is uitgerust met een automatische
      lastafhankelijke remkrachtregelaaar, door middel van de gegevens op de ALR-plaat, wordt aangetoond dat de
      gegarandeerde druk in de remcilinders hoger ligt dan 6 bar. In dat geval mag deze hogere druk als extrapolatiedruk
      worden gebruikt.

      2 Met ingang van 1 januari 1996 moet, indien voor de extrapolatie gebruik wordt gemaakt van een formule waarin
      de drukfactor








                    P - 0,4





                    P - 0,4







      voorkomt, deze drukfactor kleiner of gelijk zijn aan 3.

      3 Indien de in het tweede lid genoemde drukfactor groter is dan 3, wordt het voertuig geheel of gedeeltelijk belast
      en gewogen, tenzij:

        - de massa van de extra aangebrachte belasting exact bekend is, waarna een nieuw remproef wordt uitgevoerd, of
        - de berekende remvertraging groter dan of gelijk is aan de minimaal vereiste remvertraging, bij herberekening met
      een drukfactor 3.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.21
  - number: 2.8.22
    text: |-
      Indien een bedrijfsauto met een toegestane maximum massa van meer dan 3500 kg is voorzien van een hydraulisch
      remsysteem dan wel van een mechanisch remsysteem, moet de vaststelling van de remvertraging van de bedrijfsrem en
      de extrapolatie plaatsvinden overeenkomstig [artikel 2.8.23][ref1] waarbij wordt verstaan onder:

        - A1: niet bekrachtigd hydraulisch en mechanisch remsysteem;
        - A2: niet bekrachtigd hydraulisch remsysteem met automatische lastafhankelijke regelaar, of een andere vorm van
      remdrukbegrenzing;
        - B1: bekrachtigd hydraulisch remsysteem;
        - B2: bekrachtigd hydraulisch remsysteem met automatische lastafhankelijke regelaar, of een andere vorm van
      remdrukbegrenzing;
        - C1: druklucht bediend hydraulisch remsysteem;
        - C2: druklucht bediend hydraulisch remsysteem met automatische lastafhankelijke regelaar, of een andere vorm van
      remdrukbegrenzing.


      [ref1]: https://wetten.overheid.nl/BWBR0009581#Artikel2.8.23
