  - number: 2.6.2
    text: |-
      De onderdelen van het veersysteem en de bevestiging daarvan genoemd in hoofdstuk 5 van het Voertuigreglement moeten
      voldoen aan de eisen ten aanzien van corrosie bedoeld in titel 2 van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.6.2
  - number: 2.7.1
    text: |-
      De bevestiging van de onderdelen van de stuurinrichting genoemd in [hoofdstuk 5 van het Voertuigreglement][ref1]
      moet voldoen aan de eisen ten aanzien van corrosie bedoeld in [titel 2][ref2] van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0009581#Hoofdstuk2
