  - number: 2.9.29
    text: |-
      Indien het voertuig aan beide zijden is voorzien van een afzonderlijk doorlopend spatbord over alle wielen van het
      samenstel van assen, is ter plaatse van het samenstel voldaan aan de [artikelen 2.9.23 tot en met 2.9.28][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009581#Artikel2.9.23
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.9.29
    references:
      - id: ref1
