  - number: '4.1'
    text: |-
      De linker- en rechterbuitenspiegel moeten zo zijn geplaatst dat de bestuurder in normale rijhouding het vereiste
      gezichtsveld heeft.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel4.1
  - number: '4.2'
    text: |-
      De linkerbuitenspiegel van het motorrijtuig, met uitzondering van een motorfiets, moet zodanig zijn geplaatst dat
      de bestuurder hiermee het gezichtsveld op grondniveau kan overzien, zoals weergegeven in figuur 1 of 2, waarbij
      de bestuurder:

        - een punt op het wegdek, gelegen op 10,00 m achter de oogpunten van de bestuurder en 2,50 m naast het meest links
      gelegen punt van de lading of aanhangwagen, en
        - een deel van de linkerzijde van de lading of aanhangwagen, en
        - de horizon kan zien, en hij tevens recht naar achteren kan kijken.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel4.2
  - number: '4.3'
    text: |-
      De rechterbuitenspiegel van een personenauto of een bedrijfsauto bestemd voor het vervoer van goederen, die na 30
      september 1988 in gebruik is genomen, met een toegestane maximum massa van niet meer dan 2000 kg, moet zodanig zijn
      geplaatst dat de bestuurder hiermee het gezichtsveld op grondniveau kan overzien, zoals weergegeven in figuur 3 of
      4, waarbij de bestuurder:

        - een punt op het wegdek, gelegen op 20,00 m achter de oogpunten van de bestuurder en 4,00 m naast het meest rechts
      gelegen punt van de lading of aanhangwagen, en
        - een deel van de rechterzijde van de lading of aanhangwagen, en
        - de horizon kan zien, en hij tevens recht naar achteren kan kijken.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel4.3
  - number: '4.4'
    text: |-
      De rechterbuitenspiegel van een personenauto of bedrijfsauto bestemd voor het vervoer van goederen, die vóór 1
      oktober 1988 in gebruik is genomen, met een toegestane maximum massa van niet meer dan 2000 kg, moet zodanig zijn
      geplaatst dat de bestuurder hiermee een gezichtsveld op grondniveau kan overzien, zoals weergegeven in figuur 5 of
      6, waarbij de bestuurder:

        - een punt op het wegdek, gelegen op 30,00 m achter de oogpunten van de bestuurder en 3,50 m naast het meest rechts
      gelegen punt van de lading of aanhangwagen, en
        - een deel van de rechterzijde van de lading of aanhangwagen, en,
        - de horizon kan zien, en hij tevens recht naar achteren kan kijken.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel4.4
  - number: '4.5'
    text: |-
      De rechterbuitenspiegel van een bedrijfsauto bestemd voor het vervoer van meer dan acht personen, de bestuurder
      daaronder niet begrepen, en van een bedrijfsauto bestemd voor het vervoer van goederen, met een toegestane maximum
      massa van meer dan 2000 kg, moet zodanig zijn geplaatst dat de bestuurder hiermee het gezichtsveld op grondniveau
      kan overzien, zoals weergegeven in figuur 7 of 8, waarbij de bestuurder:

        - een punt op het wegdek, gelegen op 4,00 m achter de oogpunten van de bestuurder en 0,75 m naast het meest rechts
      gelegen punt van de lading of aanhangwagen, en
        - een punt op het wegdek, gelegen op 30,00 m achter de oogpunten van de bestuurder en 3,50 m naast het meest rechts
      gelegen punt van de lading of aanhangwagen, en
        - een deel van de rechterzijde van de lading of aanhangwagen, en
        - de horizon kan zien, en hij tevens recht naar achteren kan kijken.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel4.5
  - number: '4.6'
    text: |-
      De markering van in de lengte uitstekende lading moet bestaan uit:

        - een vierkant bord van ten minste 0,42 m bij 0,42 m, voorzien van parallel lopende diagonale strepen die
      afwisselend wit en fluorescerend of retroreflecterend rood zijn, en een breedte hebben van niet minder dan 0,07 m
      en niet meer dan 0,10 m, en
        - een rood licht, indien de lading bij nacht wordt vervoerd.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel4.6
  - number: '4.7'
    text: |-
      1 Het bord bedoeld in artikel 4.6 wordt aangebracht in een verticaal vlak loodrecht op de lengte-as van het
      voertuig, waarbij de afstand van het wegdek tot de onderzijde van het bord niet minder dan 0,35 m, en tot de
      bovenzijde niet meer dan 1,70 m bedraagt.

      2 Het rode licht, bedoeld in artikel 4.6 wordt aangebracht aan de achterzijde van de uitstekende lading.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel4.7
  - number: '4.8'
    text: |-
      De markering van in de breedte uitstekende lading moet bestaan uit:

        - een vierkant bord van ten minste 0,42 m bij 0,42 m, of een rechthoekig bord van ten minste 0,28 m bij 0,56 m
      of 0,14 m bij 0,80 m, voorzien van parallel lopende diagonale strepen die afwisselend wit en fluorescerend of
      retroreflecterend rood zijn, en een breedte hebben van niet minder dan 0,07 m en niet meer dan 0,10 m, en
        - een wit en een rood licht, indien de lading bij nacht wordt vervoerd.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel4.8
  - number: '4.9'
    text: |-
      1 Het bord bedoeld in artikel 4.8 wordt aangebracht in een verticaal vlak loodrecht op de lengte-as van het
      voertuig, waarbij de afstand van het wegdek tot de onderzijde van het bord niet minder dan 0,35 m, en tot de
      bovenzijde niet meer dan 1,70 m bedraagt, zoals weergegeven in figuur 9.

      2 Het bord wordt aan de voor- en achterzijde van de in de breedte uitstekende lading aangebracht, zodanig dat
      zoveel mogelijk de grootste breedte wordt aangegeven, zonder dat het bord de breedte vergroot.

      3 Het witte en het rode licht, bedoeld in artikel 4.8 worden zodanig aan de voorzijde onderscheidenlijk achterzijde
      van het voertuig of de lading aangebracht, dat zij zoveel mogelijk de grootste breedte van de lading aangeven
      waarbij de afstand tot de lichten gemeten vanaf het breedste punt van de lading naar binnen toe niet meer dan 0,10
      m bedraagt.

      4 Het witte en het rode licht moeten duidelijk zichtbaar zijn voor het tegemoetkomende respectievelijk
      achteropkomende verkeer.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel4.9
  - number: '4.10'
    text: |-
      Achterlichten van fietsen en aanhangwagens achter fietsen moeten zijn voorzien van een goedkeuringsmerk dat is
      samengesteld uit de aanduiding NL, omlijnd door een cirkel, en een volgnummer voorafgegaan door een letter.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel4.10
  - number: '5.1'
    text: |-
      De regeling van de Minister van Verkeer en Waterstaat van 14 november 1994, nr. R 185867, houdende permanente eisen
      voor voertuigen (Supplement bij Stcrt. 231), wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel5.1
  - number: '5.2'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel5.2
  - number: '5.3'
    text: 'Deze regeling wordt aangehaald als: Regeling permanente eisen.'
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel5.3
