  - number: 2.9.16b
    text: |-
      De gezichtsveldverbeterende voorziening is zodanig geplaatst dat de bestuurder hiermee, eventueel in combinatie met
      andere spiegels, het gezichtsveld kan overzien zoals weergegeven in figuur 23a, waarbij de bestuurder zicht heeft
      op:

      a. een punt op het wegdek, gelegen op 1,50 m achter de oogpunten van de bestuurder en op de projectie van de
      rechterzijkant of het verlengde daarvan van het voertuig,

      b. een punt op het wegdek, gelegen op 1,50 m achter de oogpunten van de bestuurder en op 4,50 m naast de
      rechterzijkant of het verlengde daarvan van het voertuig,

      c. een punt op het wegdek, gelegen op 10,00 m achter de oogpunten van de bestuurder en op 15,00 m naast de
      rechterzijkant of het verlengde daarvan van het voertuig,

      d. een punt op het wegdek, gelegen op 25,00 m achter de oogpunten van de bestuurder en op de projectie van het
      verlengde van de rechterzijkant van het voertuig, en

      e. een punt op het wegdek, gelegen op 25,00 m achter de oogpunten van de bestuurder en op 15,00 m naast het
      verlengde van de rechterzijkant van het voertuig.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.9.16b
  - number: 2.9.16c
    text: |-
      1 De gezichtsveldverbeterende voorziening is:

        - deugdelijk bevestigd,
        - steekt niet verder buiten het voertuig uit dan noodzakelijk is om de in artikel 2.9.16.b. voorgeschreven
      gezichtsvelden te verkrijgen,
        - belemmert het rechtstreekse zicht van de bestuurder zo min mogelijk en
        - steekt niet verder dan 250 mm uit, gemeten vanaf het breedste punt van het voertuig zonder de spiegels of
      gezichtsveldverbeterende voorzieningen, indien de onderrand van de gezichtsveldverbeterende voorziening zich op een
      hoogte van minder dan 2 m boven het wegdek bevindt.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.9.16c
  - number: 2.9.16d
    text: |-
      1 De gezichtsveldverbeterende voorziening bestaat uit een spiegel of een camera/beeldscherm-systeem.

      2 Een spiegel voldoet aan de volgende aanvullende eisen:

        - hij is verstelbaar,
        - het spiegeloppervlak is vlak of bolrond, en
        - het proces van scannen en weergeven duurt niet langer dan 2 seconden, in het geval dat de spiegel uitsluitend het
      voorgeschreven gezichtsveld kan weergeven via het scannen ervan.

      3 Een camera/beeldscherm-systeem voldoet aan de volgende aanvullende eisen:

        - het is zonder gereedschap te verstellen in het geval dat het systeem verstelbaar is, en
        - het beeldscherm biedt bij normale gebruiksomstandigheden voldoende contrast en de helderheid kan handmatig aan de
      omgevingsomstandigheden worden aangepast of wordt automatisch hieraan aangepast.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.9.16d
  - number: 2.9.16e
    text: |-
      De vooruitkijkspiegel of het camera-monitorsysteem van de bedrijfsauto die in gebruik is genomen na 25 januari 2008
      moet zodanig zijn geplaatst dat de bestuurder hiermee het gezichtsveld kan overzien zoals weergegeven in figuur 24,
      waarbij de bestuurder zicht heeft op:

      a. een 2,00 m lang voor de uiterste voorzijde van het voertuig gelegen vlak dat begrensd wordt door de projectie of
      het verlengde van de projectie van de linker- en rechterzijkant van het voertuig,

      b. een daarop aansluitende kwartcirkel met een straal van 2,00 m waarvan het middelpunt is gelegen op de projectie
      of het verlengde van de projecties van de voorzijde en de rechterzijkant van het voertuig.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.9.16e
  - number: 2.9.16f
    text: |-
      Het beeldscherm van het camera-monitorsysteem moet dusdanig zijn gemonteerd dat de kijkrichting voor het
      beeldscherm ongeveer overeenkomt met die voor de linker- of de rechterbuitenspiegel.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.9.16f
  - number: 2.9.17
    text: De in deze afdeling gestelde eisen worden getoetst door middel van visuele controle.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.9.17
  - number: 2.9.18
    text: |-
      Bedrijfsauto's in gebruik genomen na 31 december 1974 en aanhangwagens in gebruik genomen na 31 december 1974
      met een toegestane maximum massa van meer dan 3500 kg moeten ten aanzien van de wielafscherming voldoen aan de
      [artikelen 2.9.19 tot en met 2.9.22][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009581#Artikel2.9.19
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.9.18
    references:
      - id: ref1
        bwb_id: BWBR0009581
        artikel: 2.9.19
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '4'
  - number: 2.9.19
    text: |-
      De wielafscherming moet het gehele horizontale projectievlak boven ieder wiel afdekken. De wielen, inclusief alle
      bevestigingsmiddelen en naven, mogen in de breedterichting niet meer dan 30 mm buiten deze afscherming uitsteken,
      zoals weergegeven in figuur 24.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.9.19
  - number: 2.9.20
    text: |-
      1 De wielen van de achterste as moeten aan de achterzijde zijn voorzien van een wielafscherming die niet mag
      eindigen boven een denkbeeldig horizontaal vlak gelegen op 0,15 m boven het middelpunt van de wielen en op niet
      meer dan 0,30 m achter het wiel. Bovendien moet het achterste gedeelte minimaal reiken tot de denkbeeldige lijn die
      een hoek van 45° vormt met het wegdek, zoals weergegeven in figuur 25.

      2 Indien de achterste wielen zijn bestuurd of gestuurd is de maat van 0,30 m niet van toepassing, zoals weergegeven
      in figuur 25.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.9.20
  - number: 2.9.21
    text: |-
      1 De wielafscherming moet:

        - vormvast zijn, en
        - deugdelijk zijn bevestigd.

      2 In afwijking van het bepaalde in het eerste lid, onderdeel a, is, indien het een voertuig betreft in gebruik
      genomen vóór 1 januari 1995, een permanent aangebracht roldoek toegestaan.

      3 Aan het bepaalde in het eerste lid wordt voldaan indien de wielafscherming bestaat uit een constructie
      van scharnierende of verschuifbare delen dan wel gevormd wordt door een demontabele afscherming waarvoor een
      opbergruimte op het voertuig aanwezig is.

      4 Een eventuele spatlap aan de achterzijde van het wiel is als wielafscherming toegestaan, mits deze vormvast is of
      voldoende ondersteund.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.9.21
  - number: 2.9.22
    text: Delen van de permanente opbouw kunnen als deel van de wielafscherming dienen.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.9.22
  - number: 2.9.23
    text: |-
      Bedrijfsauto's in gebruik genomen na 31 december 1969 en aanhangwagens in gebruik genomen na 31 december 1969
      moeten ten aanzien van de zijdelingse afscherming voldoen aan de [artikelen 2.9.24 tot en met 2.9.29][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009581#Artikel2.9.24
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.9.23
    references:
      - id: ref1
        bwb_id: BWBR0009581
        artikel: 2.9.24
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '4'
  - number: 2.9.24
    text: |-
      1 - Aan weerszijden van het voertuig moeten de volgende gebieden zijn beveiligd: 1°. het verticale dwarsvlak dat
      bij een bedrijfsauto op 0,30 m achter de cabine begint, zoals weergegeven in figuur 26, of in het geval van een
      bestuurd of gestuurd wiel op niet meer dan 0,50 m achter dit wiel, en het verticale dwarsvlak dat op 0,30 m vóór
      het voorste achterwiel, of in het geval van een bestuurd of gestuurd wiel, op 0,50 m vóór dit wiel eindigt; 2°. het
      verticale dwarsvlak dat bij een middenasaanhangwagen op 2,50 m achter de hart-koppeling begint: indien binnen deze
      maat de bovenbouw nog niet is bereikt, begint het dwarsvlak aan de voorzijde van de bovenbouw, zoals weergegeven in
      figuur 27, en het verticale dwarsvlak dat op 0,30 m vóór het voorste achterwiel, of in het geval van een bestuurd
      of gestuurd wiel, op 0,50 m vóór dit wiel eindigt; 3°. het verticale dwarsvlak dat bij een aanhangwagen, niet
      zijnde een een oplegger of middenasaanhangwagen, op 0,30 m achter het achterste voorwiel begint, of in het geval
      van een bestuurd of gestuurd wiel op niet meer dan 0,50 m achter dit wiel, en het verticale dwarsvlak dat op 0,30
      m vóór het voorste achterwiel, of in het geval van een bestuurd of gestuurd wiel, op 0,50 m vóór dit wiel eindigt;
      4°. het verticale dwarsvlak dat bij een oplegger op ten hoogste 0,25 m achter het hart van de opleggersteunen
      begint met een maximum van 2,75 m achter het hart van de koppelingspen, zoals weergegeven in figuur 28, en het
      verticale dwarsvlak dat op 0,30 m voor het voorste achterwiel eindigt of in het geval van een bestuurd of gestuurd
      wiel op 0,50 m vóór dit wiel;
        - indien het voertuig is voorzien van een samenstel van assen, het gebied gelegen tussen het verticale dwarsvlak
      dat raakt aan de achterzijde van het wiel en het vertikale dwarsvlak dat raakt aan de voorzijde van het daarop
      volgende wiel en indien de afstand tussen beide verticale dwarsvlakken meer bedraagt dan 0,50 m, zoals weergegeven
      in figuur 29;
        - het gebied gelegen tussen het verticale dwarsvlak dat begint op 0,30 m achter het achterste achterwiel van het
      voertuig, of in het geval van een bestuurd of gestuurd wiel op 0,50 m achter dit wiel en in het verticale dwarsvlak
      dat eindigt aan de achterzijde van het voertuig, zoals weergegeven in figuur 30.

      2 Het bepaalde in het eerste lid, onderdeel c, geldt niet voor bedrijfsauto's en aanhangwagens met een toegestane
      maximum massa van niet meer dan 3500 kg.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.9.24
  - number: 2.9.25
    text: |-
      1 - Bedrijfsauto's voorzien van niet meer dan drie assen en aanhangwagens, in gebruik
      genomen na 31 december 1997, met uitzondering van middenasaanhangwagens, zijn binnen de in
      [artikel 2.9.24 eerste lid, onderdeel a, onder 1, 3 en 4][ref1], genoemde gebieden aan beide zijden voorzien van
      een zijdelingse afscherming, overeenkomstig [artikel 2.9.25a][ref2].
        - Bedrijfsauto's voorzien van niet meer dan drie assen en aanhangwagens, in gebruik genomen na 31 december 1997,
      zijn binnen de in [artikel 2.9.24, eerste lid, onderdeel a, onder 2 en de onderdelen b en c][ref3] genoemde
      gebieden aan beide zijden voorzien van een zijdelingse afscherming, overeenkomstig [artikel 2.9.25b][ref4].

      2 Bedrijfsauto's voorzien van meer dan drie assen, in gebruik genomen na 31 mei 1997, zijn binnen de in
      [artikel 2.9.24, eerste lid][ref5],

        - onderdeel a, onder 1, en onderdeel b genoemde gebieden, aan beide zijden voorzien van een zijdelingse
      afscherming, overeenkomstig: 1°. [artikel 2.9.25a][ref6], indien de afstand tussen het verticale dwarsvlak dat
      raakt aan de achterzijde van een wiel en het verticale dwarsvlak dat raakt aan de voorzijde van het daarop volgende
      wiel meer bedraagt dan: A. 0,75 m tussen starre assen; B. 0,85 m tussen een starre as en een gestuurde of bestuurde
      as; C. 1 m tussen twee gestuurde of bestuurde assen; 2°. [artikel 2.9.25b][ref7], indien de afstand tussen het
      verticale dwarsvlak dat raakt aan de achterzijde van een wiel en het verticale dwarsvlak dat raakt aan de voorzijde
      van het daarop volgende wiel meer bedraagt dan 0,50 m doch niet meer dan: 0,75 m tussen starre assen; 0,85 m tussen
      een starre as en een gestuurde of bestuurde as; 1,00 m. tussen twee gestuurde of bestuurde assen.
        - onderdeel c genoemde gebieden, aan beide zijden voorzien van een zijdelingse afscherming, overeenkomstig
      [artikel 2.9.25b][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0009581#Artikel2.9.24
