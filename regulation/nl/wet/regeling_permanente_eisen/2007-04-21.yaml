    text: |-
      1 De linkerbuitenspiegel van de bedrijfsauto met een toegestane maximummassa van meer dan 3500 kg die in gebruik is
      genomen voor 26 januari 2008, of van de bedrijfsauto met een toegestane maximummassa van niet meer dan 3500 kg die
      in gebruik is genomen voor 26 januari 2011 moet zodanig zijn geplaatst dat de bestuurder hiermee het gezichtsveld
      op grondniveau kan overzien, zoals weergegeven in figuur 18, waarbij de bestuurder:

      a. een punt op het wegdek, gelegen op 10,00 m achter de oogpunten van de bestuurder en 2,50 m naast het verlengde
      van de linkerzijde van het voertuig kan zien,

      b. een deel van de linkerzijde van het voertuig kan zien,

      c. de horizon kan zien, en

      d. tevens recht naar achteren kan kijken.

      2 De linkerbuitenspiegel van de bedrijfsauto met een toegestane maximummassa van niet meer dan 3500 kg die in
      gebruik is genomen na 25 januari 2011, met uitzondering van bussen, is zodanig geplaatst dat de bestuurder hiermee
      het gezichtsveld op grondniveau kan overzien, zoals weergegeven in figuur 18a, waarbij de bestuurder:

      a. een punt op het wegdek, gelegen op 20,00 m achter de oogpunten van de bestuurder en 4,00 m naast het verlengde
      van de linkerzijde van het voertuig kan zien,

      b. een punt op het wegdek, gelegen op 4,00 m achter de oogpunten van de bestuurder en 1,00 m naast het verlengde
      van de linkerzijde van het voertuig kan zien,

      c. en een deel van de linkerzijde van het voertuig kan zien,

      d. de horizon kan zien, en

      e. tevens recht naar achteren kan kijken.

      3 De linkerbuitenspiegel van de bedrijfsauto met een toegestane maximummassa van meer dan 3500 kg die in gebruik is
      genomen na 25 januari 2008 en van de bus met een toegestane maximummassa van niet meer dan 3.500 kg die in gebruik
      is genomen na 25 januari 2011 is zodanig geplaatst dat de bestuurder hiermee het gezichtsveld op grondniveau kan
      overzien, zoals weergeven in figuur 18b, waarbij de bestuurder:

      a. een punt op het wegdek, gelegen op 30,00 m achter de oogpunten van de bestuurder en 5,00 m naast het verlengde
      van de linkerzijde van het voertuig kan zien,

      b. een punt op het wegdek, gelegen op 4,00 m achter de oogpunten van de bestuurder en 1,00 m naast het verlengde
      van de linkerzijde van het voertuig kan zien,

      c. een deel van de linkerzijde van het voertuig kan zien,

      d. de horizon kan zien, en

      e. tevens recht naar achteren kan kijken.
