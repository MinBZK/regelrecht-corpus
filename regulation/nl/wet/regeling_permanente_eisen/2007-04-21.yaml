  - number: 2.9.8
    text: |-
      1 De voorruit wordt verdeeld in de volgende drie denkbeeldige vlakken:

        - het vlak voor het directe gezichtsveld van de bestuurder: dit is het gedeelte van de voorruit dat zich voor de
      bestuurderszitplaats bevindt, ter grootte van een op de voorruit te projecteren vlak met een horizontale zijde van
      0,40 m en een verticale zijde van 0,40 m, zoals weergegeven in figuur 16;
        - het vlak voor het indirecte gezichtsveld van de bestuurder, hetgeen als volgt wordt gevormd: het directe
      gezichtsveld wordt ten opzichte van het midden van de voorruit gespiegeld naar het rechter voorruitgedeelte: het
      hierdoor gevonden vlak en de tussenruimte naar het directe gezichtsveld vormt het indirecte gezichtsveld;
        - het randvlak: dit is het nog resterende deel van de voorruit.

      2 Het middelpunt van het in het eerste lid, onder a, geprojecteerde vlak moet samenvallen met het snijpunt van:

        - de verticale lijn, denkbeeldig getrokken op de voorruit, vanuit de zitpositie van de bestuurder, door het hart
      van het stuur, en
        - de horizontale lijn op 0,65 m boven het laagste punt van de zitting van de onbelaste bestuurdersstoel in de
      achterste en onderste gebruiksstand, waarbij moet worden uitgegaan van de meest gebruikelijke zitpositie voor een
      bestuurder van gemiddelde lengte, indien de onderste gebruiksstand lager uitkomt dan voor het besturen noodzakelijk
      is.

      **A is gelijk aan B**

      **H=geprojecteerde hoogte op de voorruit**

      Figuur 16 Voorruit
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.9.8
  - number: 2.9.9
    text: |-
      1 In het vlak voor het directe gezichtsveld mogen, in afwijking van [artikel 2.9.10][ref1], de volgende
      beschadigingen of verkleuringen aanwezig zijn:

        - enkelvoudige scheuren, ongeacht de lengte;
        - oppervlakkige krassen waarvan de breedte niet meer dan 8 mm bedraagt;
        - beschadigingen of verkleuringen waarvan de afmetingen zodanig zijn, dat een denkbeeldig getrokken cirkel om de
      gehele beschadiging of verkleuring heen een diameter heeft van niet meer dan 30 mm.

      2 In het vlak voor het indirecte gezichtsveld mogen, in afwijking van [artikel 2.9.10][ref2], de volgende
      beschadigingen of verkleuringen aanwezig zijn:

        - enkelvoudige scheuren, ongeacht de lengte;
        - oppervlakkige krassen waarvan de breedte niet meer dan 8 mm bedraagt;
        - beschadigingen of verkleuringen waarvan de afmetingen zodanig zijn, dat een denkbeeldig getrokken cirkel om de
      gehele beschadiging of verkleuring heen een diameter heeft van niet meer dan 100 mm.

      3 Onder de in het eerste en tweede lid genoemde enkelvoudige scheuren worden scheuren verstaan die in de
      gezichtsvelden geen vertakkingen vertonen tussen begin- en eindpunt, zoals weergegeven in figuur 17.

      4 In het randvlak mogen beschadigingen of verkleuringen aanwezig zijn.

      5 Indien een beschadiging of verkleuring doorloopt in de verschillende te beoordelen vlakken van de ruit, dan
      moet alleen dat deel van de beschadiging of verkleuring in ogenschouw worden genomen dat in het te beoordelen vlak
      aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0009581#Artikel2.9.10
