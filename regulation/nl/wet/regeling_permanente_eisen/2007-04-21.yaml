  - number: 2.8.9
    text: |-
      1 De bij de vaststelling van de remvertraging uitgeoefende pedaalkrachten en remkrachten worden uitgedrukt in
      Newton (N).

      2 [Artikel 2.8.8, vijfde lid][ref1], wordt getoetst:

        - door middel van visuele controle;
        - door in geval van twijfel de bandenspanningsmeter te gebruiken.


