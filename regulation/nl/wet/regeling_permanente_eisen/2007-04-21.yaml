  - number: 2.8.10
    text: |-
      Indien de controle van de remvertraging van de bedrijfsrem van een personenauto of een bedrijfsauto met een
      toegestane maximum massa van niet meer dan 3500 kg plaats vindt door middel van een beproeving van het voertuig
      op de weg met behulp van een zelfregistrerende remvertragingsmeter, moet de kracht die na het intrappen van het
      rempedaal daarop wordt uitgeoefend nagenoeg constant worden gehouden.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.10
  - number: 2.8.11
    text: |-
      Bij gebruik van een mechanische zelfregistrerende remvertragingsmeter moet de bij de remproef behaalde
      remvertraging met behulp van de daarbij vervaardigde kaart als volgt worden vastgesteld:

        - het hoogste punt van de remvertragingskromme wordt gemarkeerd waarbij de eventueel aanwezige hobbel aan het eind
      van de kromme buiten beschouwing wordt gelaten;
        - vanuit het punt genoemd in onderdeel a wordt een loodlijn op de pedaalkrachtlijn neergelaten;
        - de pedaalkrachtlijn wordt naar links gevolgd tot waar deze lijn een knik vertoont;
        - vanuit het punt genoemd in onderdeel c wordt een loodlijn getrokken naar de remvertragingskromme;
        - het snijpunt van de loodlijn en de remvertragingskromme genoemd in onderdeel d wordt gemarkeerd;
        - de remvertraging wordt bepaald door het gemiddelde te nemen van de onder a en e bepaalde remvertragingen.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.11
  - number: 2.8.12
    text: |-
      Bij gebruik van een elektronische, zelfregistrerende remvertragingsmeter moet de bij de remproef behaalde
      remvertraging als volgt worden vastgesteld:

        - indien door de remvertragingsmeter een resulterende of gemiddelde waarde wordt aangegeven, geldt deze waarde als
      de minimaal behaalde remvertraging;
        - indien de remvertraging niet volgens onderdeel a kan worden vastgesteld, geldt de remvertraging die met behulp
      van de meetwaardentabel op de registratiestrook wordt vastgesteld, door het gemiddelde te nemen van alle gemeten
      remvertragingen, die gelijk of groter zijn aan de minimaal vereiste remvertraging en gedurende minimaal een halve
      seconde zijn gemeten;
        - indien de remvertraging niet volgens onderdeel a of b kan worden vastgesteld, geldt de remvertraging die met
      behulp van de grafiek op de registratiestrook als volgt is vastgesteld: 1°. indien op het moment dat het voertuig
      nagenoeg stilstond geen plotselinge stijging van de remvertraging is waar te nemen, is de hoogst behaalde waarde
      van remvertraging bepalend; 2°. indien op het moment dat het voertuig nagenoeg stilstond een plotselinge stijging
      van de remvertraging is waar te nemen, is de behaalde remvertraging vlak vóór deze stijging bepalend.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.12
  - number: 2.8.13
    text: |-
      Indien de controle van de remvertraging van de parkeerrem van een personenauto of een bedrijfsauto met een
      toegestane maximum massa van niet meer dan 3500 kg plaats vindt door middel van een beproeving van het voertuig op
      de weg met behulp van een zelfregistrerende remvertragingsmeter, moet het voertuig aan het einde van de remproef
      geheel of nagenoeg geheel stilstaan.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.13
  - number: 2.8.14
    text: |-
      Indien de controle van de remvertraging van de bedrijfsrem van een personenauto of een bedrijfsauto met een
      toegestane maximum massa van niet meer dan 3500 kg plaats vindt door middel van een beproeving van het voertuig op
      een platenremtestbank, moet:

        - gebruik worden gemaakt van een pedaalkrachtmeter waarbij het mogelijk is om, door middel van de arreteerstand, na
      afloop van de remproef de daarbij gebruikte pedaalkracht af te lezen;
        - de snelheid bij de aanvang van de remproef ongeveer 10 km/h bedragen;
        - de remproef op iedere as twee maal worden uitgevoerd. Indien de met deze proeven behaalde remkrachten aan de
      wielen per as nagenoeg gelijk zijn, mede gelet op de gebruikte pedaalkracht, worden deze gebruikt voor het bepalen
      van de remvertraging. Indien de met deze proeven behaalde remkrachten aan de wielen per as niet nagenoeg gelijk
      zijn, moet per as een derde remproef worden uitgevoerd. De behaalde remkrachten aan de wielen van deze laatste
      proef en van de voorgaande proef die de behaalde remkrachten aan de wielen het dichtst benadert, worden gebruikt
      voor het bepalen van de remvertraging;
        - de bij de remproef behaalde remvertraging worden berekend door de remkrachten, die op de hiervoor beschreven
      wijze zijn verkregen uit twee remproeven per as, bij elkaar op te tellen en te delen door twee maal de op het
      kentekenbewijs vermelde massa van het ledig voertuig, vermeerderd met 100 kg.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.14
  - number: 2.8.15
    text: |-
      Indien de controle van de remvertraging van de parkeerrem van een personenauto of een bedrijfsauto met een
      toegestane maximum massa van niet meer dan 3500 kg plaats vindt door middel van een beproeving van het voertuig op
      een platenremtestbank, moet:

        - de snelheid bij de aanvang van de remproef ongeveer 10 km/h bedragen;
        - het voertuig aan het einde van de remproef geheel of nagenoeg geheel stilstaan;
        - de bij de remproef behaalde remvertraging worden berekend door de remkrachten aan de wielen te delen door de op
      het kentekenbewijs vermelde massa van het ledig voertuig, vermeerderd met 100 kg.
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.15
  - number: 2.8.16
    text: "Indien de controle van de remvertraging van de bedrijfsrem van een personenauto of een bedrijfsauto met een\ntoegestane maximum massa van niet meer dan 3500 kg plaats vindt door middel van een beproeving van het voertuig op\neen rollenremtestbank,\n\n- moeten per as de maximale remkrachten aan de wielen met de bijbehorende pedaalkrachten worden vastgesteld;\n- moeten de remkrachten van de voorste as en de achterste as of het achterste asstel bij elkaar worden opgeteld\nen vervolgens worden gedeeld door de op het kentekenbewijs vermelde massa van het ledig voertuig, vermeerderd met\n100 kg waarna de uitkomst met een factor 10 wordt vermenigvuldigd en het resultaat wordt gelezen als procenten\n\"relatieve beremming\";\n- moet, met behulp van de gevonden waarden \"relatieve beremming\" en \"pedaalkracht op de voorste as\", aan de hand\nvan de bij dit artikel behorende tabel 1 worden beoordeeld of de remwerking voldoende is;\n- moet, indien de gevonden waarden niet leiden tot een directe beslissing, een remproef op de weg plaatsvinden.\n\nTabel 1\n\n\n\n\n\n\n\n\n\n\n\n\n\n            REMTEST \uFEFFOP EEN ROLLENREMTESTBANK\n\n\n\n\n            \uFEFFREMWERKING VOLDOET\n\n\n            \uFEFFREMWERKING VOLDOET NIET\n\n\n            \uFEFFNader Onderzoek\n\n\n\n\n            \uFEFFrelatieve beremming\n\n\n            \uFEFFpedaalkracht op voorste as\n\n\n            \uFEFFrelatieve beremming\n\n\n            \uFEFFpedaalkracht op voorste as\n\n\n            \uFEFFremproef op de weg bij waarden, niet leidend tot directe beslissing\n\n\n\n\n            \uFEFFPersonenauto's, in gebruik genomen na 30-06-1967\n\n\n            \uFEFF  ≥ 40% en\n\n\n            ≤ 400 N\n\n\n            ≥ 52% en\n\n\n            \uFEFF ≤ 500 N\n\n\n            ja\n\n\n\n\n            < 52% en\n\n\n            > 500 N\n\n\n\n\n            \uFEFFBedrijfsauto's,  in gebruik genomen na 30-06-1967 en bestemd voor goederen\n\n\n            \uFEFF≥ 40% en\n\n\n            ≤ 700 N\n\n\n            \uFEFF< 40% en\n\n\n            > 700 N\n\n\n            ja\n\n\n\n\n            \uFEFFBussen,  in gebruik genomen na 30-06-1967\n\n\n            ≥ 45% en\n\n\n            ≤ 700 N\n\n\n            \uFEFF< 45% en\n\n\n            > 700 N\n\n\n            ja\n\n\n\n\n            \uFEFFPersonenauto's, in gebruik genomen voor 01-07-1967\n\n\n            \uFEFF≥ 38%\n\n\n            \uFEFFniet van toepassing\n\n\n            \uFEFF< 38%\n\n\n            \uFEFFniet van toepassing\n\n\n            \uFEFFniet van toepassing\n\n\n\n\n            \uFEFFBedrijfsauto's, in gebruik genomen voor 01-07-1967\n\n\n            \uFEFF≥ 38%\n\n\n            \uFEFFniet van toepassing\n\n\n            \uFEFF< 38%\n\n\n            \uFEFFniet van toepassing\n\n\n            \uFEFFniet van toepassing"
    url: https://wetten.overheid.nl/BWBR0009581/2007-04-21#Artikel2.8.16
  - number: 2.8.17
    text: |-
      1 Bij de vaststelling van de maximale remkrachten zoals bedoeld in [artikel 2.8.16, onderdeel a][ref1], moet het
      volgende in acht worden genomen:

        - de pedaalkracht die bij de voorste as wordt gebruikt, hoeft niet dezelfde te zijn als die bij de achterste as of
      het achterste asstel;
        - bij de remtest wordt het rempedaal langzaam ingetrapt en op het moment van aflezen vastgehouden;

      1°. in een personenauto een pedaalkracht van 500 N wordt uitgeoefend,

      2°. in een bedrijfsauto een pedaalkracht van 700 N wordt uitgeoefend,

      3°. één of meer wielen van het voertuig blokkeren, of

      4°. de rollenremtestbank afslaat.

      2 Indien de remkracht op één wiel tussen twee waarden schommelt of de remkrachten op beide wielen tussen twee
      waarden schommelen, worden per wiel de minimale en maximale remkracht gemiddeld en wordt dit gemiddelde gebruikt
      als remkracht voor dat wiel.

      3 Bij de beoordeling van [artikel 2.8.16, onderdeel d][ref2], moet het volgende in acht worden genomen:

        - bij de remproef op de weg wordt van een geschikte remvertragingsmeter gebruik gemaakt, indien deze aanwezig is;
        - de remvertraging met de bijbehorende pedaalkracht wordt beoordeeld even voor het moment van blokkeren van één of
      meer wielen van het voertuig.


      [ref1]: https://wetten.overheid.nl/BWBR0009581#Artikel2.8.16
      [ref2]: https://wetten.overheid.nl/BWBR0009581#Artikel2.8.16
