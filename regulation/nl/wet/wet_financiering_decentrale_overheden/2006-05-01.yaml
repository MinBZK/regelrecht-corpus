preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het op grond van veranderde omstandigheden en nieuwe inzichten ten
    aanzien van het financieringsbeleid van openbare lichamen wenselijk is nieuwe regels vast te stellen ter herziening
    van de Wet financiering lagere overheid;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel1
  - number: 1.a
    text: 'openbare lichamen:'
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel1
  - number: 1.a.1°
    text: provincies;
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel1
  - number: 1.a.2°
    text: gemeenten;
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel1
  - number: 1.a.3°
    text: waterschappen;
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel1
  - number: 1.a.4°
    text: |-
      de regio's bedoeld in [artikel 21, eerste lid, van de Politiewet 1993][ref1], alsmede de krachtens
      [artikel 47a, eerste lid, van die wet][ref2] ingestelde rechtspersonen;


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel47a
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0006299
        artikel: 47a
  - number: 1.a.5°
    text: |-
      lichamen, ingesteld met toepassing van de [Wet gemeenschappelijke regelingen][ref1], die bevoegd zijn tot het
      aangaan, garanderen en verstrekken van geldleningen;


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: 1.a.6°
    text: door Onze Ministers aan te wijzen andere bij wet ingestelde lichamen en organen;
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel1
  - number: 1.b
    text: |-
      rentetypische looptijd: het tijdsinterval gedurende de looptijd van een geldlening, waarin op basis van de
      leningvoorwaarden van de geldlening sprake is van een door de verstrekker van de geldlening niet beïnvloedbare
      constante rentevergoeding;
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel1
  - number: 1.c
    text: |-
      financiële derivaten: financiële instrumenten belichaamd in contracten waarin de voorwaarden zijn vastgelegd
      waartegen een transactie op een bepaald moment zal of kan plaatsvinden en waarvan de waarde afhankelijk is van één
      of meer onderliggende activa, referentieprijzen of indices;
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel1
  - number: 1.d
    text: 'vaste schuld: het gezamenlijk bedrag van:'
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel1
  - number: 1.d.1°
    text: de schuld uit hoofde van geldleningen met een oorspronkelijke rentetypische looptijd van één jaar of langer, en
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel1
  - number: 1.d.2°
    text: de voor een termijn van één jaar of langer ontvangen waarborgsommen;
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel1
  - number: 1.e
    text: 'netto-vlottende schuld: het gezamenlijk bedrag van:'
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel1
  - number: 1.e.1°
    text: de opgenomen gelden met een oorspronkelijke rentetypische looptijd van korter dan één jaar;
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel1
  - number: 1.e.2°
    text: de schuld in rekening-courant;
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel1
  - number: 1.e.3°
    text: de voor een termijn van korter dan één jaar ter bewaring in de kas gestorte gelden van derden, en
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel1
  - number: 1.e.4°
    text: 'overige geldleningen die geen onderdeel uitmaken van de vaste schuld; verminderd met het gezamenlijk bedrag van:'
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel1
  - number: 1.e.5°
    text: de contante gelden in kas;
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel1
  - number: 1.e.6°
    text: de tegoeden in rekening-courant, en
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel1
  - number: 1.e.7°
    text: de overige uitstaande gelden met een rentetypische looptijd van korter dan één jaar;
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel1
  - number: 1.f
    text: |-
      gemiddelde netto-vlottende schuld per kwartaal: het gemiddelde van de netto-vlottende schuld op de eerste dag van
      iedere maand in het desbetreffende kwartaal;
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel1
  - number: 1.g
    text: |-
      kasgeldlimiet: een bedrag ter grootte van een percentage van het totaal van de jaarbegroting van het openbare
      lichaam bij aanvang van het jaar;
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel1
  - number: 1.h
    text: |-
      renterisico op de vaste schuld: mate waarin het saldo van rentelasten en rentebaten van een openbaar lichaam
      verandert door wijzigingen in het rentepercentage op leningen en uitzettingen met een oorspronkelijke rentetypische
      looptijd van één jaar of langer;
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel1
  - number: 1.i
    text: |-
      de renterisiconorm: een bedrag ter grootte van een percentage van het totaal van de vaste schuld van het openbare
      lichaam bij aanvang van het jaar;
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel1
  - number: 1.j
    text: |-
      3%-norm voor het EMU-saldo van de overheid: de referentiewaarde voor het vorderingensaldo van de overheid zoals
      vastgelegd in artikel 104C en Protocol nr. 5 van het Verdrag betreffende de Europese Unie;
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel1
  - number: 1.k
    text: |-
      toezichthouder: het bestuursorgaan dat op grond van enige wettelijke bepaling is belast met het toezicht op de
      begroting van een openbaar lichaam;
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel1
  - number: 1.l
    text: 'Onze Ministers:'
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel1
  - number: 1.l.1°
    text: |-
      Onze Minister van Financiën en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties indien het de in
      onderdeel a, onder 1°, 2°, 4° en 6° bedoelde lichamen en organen betreft;
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel1
  - number: 1.l.2°
    text: |-
      Onze Minister van Financiën en Onze Minister van Verkeer en Waterstaat indien het de in onderdeel a, onder 3°,
      bedoelde lichamen betreft;
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel1
  - number: 1.l.3°
    text: |-
      Onze Minister van Financiën en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties indien het de in
      onderdeel a, onder 5°, bedoelde lichamen en organen betreft alsmede Onze Minister van Verkeer en Waterstaat voor
      zover aan de in onderdeel a, onder 5°, bedoelde lichamen en organen waterschappen deelnemen.
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel1
  - number: '2.1'
    text: |-
      Openbare lichamen gaan leningen aan, zetten middelen uit of verlenen garanties uitsluitend ten behoeve van de
      uitoefening van de publieke taak.
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel2
  - number: '2.2'
    text: |-
      Openbare lichamen kunnen derivaten hanteren of, in afwijking van het eerste lid, middelen uitzetten anders dan
      ten behoeve van de publieke taak, indien deze uitzettingen of derivaten een prudent karakter hebben en niet zijn
      gericht op het genereren van inkomen door het lopen van overmatig risico. Terzake van de uitvoering van dit lid
      worden bij ministeriële regeling nadere regels gesteld.
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel2
  - number: '2.3'
    text: |-
      Openbare lichamen kunnen geldleningen slechts aangaan en verstrekken, dan wel de nakoming van uit geldleningen
      voortvloeiende verplichtingen ten aanzien van de betaling van rente en aflossing slechts garanderen, indien de
      geldleningen voldoen aan de daarvoor bij algemene maatregel van bestuur te stellen regels.
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel2
  - number: '3.1'
    text: |-
      Onze Ministers stellen bij ministeriële regeling een percentage voor de berekening van de kasgeldlimiet vast. Onze
      Ministers zenden eens per drie jaar aan de Staten-Generaal een verslag houdende overwegingen met betrekking tot de
      hoogte van het percentage, bedoeld in de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel3
  - number: '3.2'
    text: Voor de kasgeldlimiet geldt een minimumbedrag van € 300 000.
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel3
  - number: '3.3'
    text: |-
      Onze Ministers kunnen bij ministeriële regeling een hoger minimumbedrag vaststellen dan het in het tweede lid
      genoemde bedrag.
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel3
  - number: '3.4'
    text: |-
      Het op basis van het eerste lid vast te stellen percentage voor de kasgeldlimiet en het op basis van het derde lid
      vast te stellen minimumbedrag kunnen verschillend zijn voor de verschillende categorieën openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel3
  - number: '4.1'
    text: De gemiddelde netto-vlottende schuld per kwartaal van een openbaar lichaam overschrijdt de kasgeldlimiet niet.
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel4
  - number: '4.2'
    text: |-
      Indien een openbaar lichaam twee kwartalen achtereen niet aan het eerste lid heeft voldaan, geeft de toezichthouder
      het openbare lichaam een aanwijzing om hieraan alsnog te voldoen.
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel4
  - number: '4.3'
    text: |-
      Indien uit de eerstvolgende kwartaalrapportage van het openbare lichaam na de aanwijzing van de toezichthouder
      blijkt dat nog steeds niet wordt voldaan aan het eerste lid, legt het openbare lichaam een plan om aan het
      eerste lid te voldoen ter goedkeuring voor aan de toezichthouder. Zolang dit plan niet is goedgekeurd dan wel
      indien blijkt dat het plan niet ten uitvoer wordt gelegd, kan de toezichthouder bepalen dat voor het aangaan van
      nieuwe geldleningen met een oorspronkelijke rentetypische looptijd korter dan één jaar voorafgaande toestemming
      van de toezichthouder is vereist, en kan de toezichthouder een maximum vaststellen voor de schuld in rekening-
      courant van het openbare lichaam. Dit plafond wordt vastgesteld met inachtneming van de op dat moment bestaande
      betalingsverplichtingen van het openbare lichaam.
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel4
  - number: '4.4'
    text: |-
      Het voorafgaand toezicht, bedoeld in het derde lid, vervalt zodra het in het derde lid bedoelde plan naar het
      oordeel van de toezichthouder voldoende ten uitvoer wordt gelegd.
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel4
  - number: '4.5'
    text: |-
      De toezichthouder kan bij incidentele wijzigingen in het inkomsten- en uitgavenpatroon ontheffing verlenen van
      de in het eerste lid genoemde verplichting voor een periode van maximaal twee kwartalen. Aan de ontheffing kunnen
      voorschriften worden verbonden en beperkingen gesteld.
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel4
  - number: '5.1'
    text: |-
      Onze Ministers stellen bij ministeriële regeling een percentage voor de berekening van de renterisiconorm en een
      minimumbedrag voor de renterisiconorm vast, alsmede regels ten aanzien van de bepaling van het renterisico op de
      vaste schuld.
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel5
  - number: '5.2'
    text: |-
      Het op basis van het eerste lid vast te stellen percentage voor de renterisiconorm en minimumbedrag kunnen
      verschillend zijn voor de verschillende categorieën openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel5
  - number: '6.1'
    text: Het renterisico op de vaste schuld van een openbaar lichaam overschrijdt de renterisiconorm niet.
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel6
  - number: '6.2'
    text: |-
      De toezichthouder geeft, indien door een openbaar lichaam niet wordt voldaan aan het eerste lid, het openbare
      lichaam een aanwijzing om maatregelen te nemen ten einde het renterisico op de vaste schuld te verminderen.
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel6
  - number: '6.3'
    text: |-
      Indien het openbare lichaam geen gehoor geeft aan de aanwijzing van de toezichthouder, bedoeld in het tweede lid,
      legt het openbare lichaam een plan om aan het eerste lid te voldoen ter goedkeuring voor aan de toezichthouder.
      Zolang dit plan niet is goedgekeurd dan wel indien blijkt dat het plan niet ten uitvoer wordt gelegd, kan de
      toezichthouder bepalen dat voor het aangaan van vaste schuld voorafgaande toestemming van de toezichthouder is
      vereist.
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel6
  - number: '6.4'
    text: |-
      Het voorafgaand toezicht, bedoeld in het derde lid, vervalt zodra het in het derde lid bedoelde plan naar het
      oordeel van de toezichthouder voldoende ten uitvoer wordt gelegd.
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel6
  - number: '6.5'
    text: |-
      De toezichthouder kan ontheffing verlenen van de in het eerste lid genoemde verplichting. Aan de ontheffing kunnen
      voorschriften worden verbonden en beperkingen gesteld.
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel6
  - number: '7.1'
    text: |-
      Indien een dreigende overschrijding van de 3%-norm voor het EMU-saldo van de overheid door een ongewenste
      ontwikkeling van het EMU-saldo van de openbare lichamen wordt veroorzaakt, kunnen bij of krachtens algemene
      maatregel van bestuur regels worden gesteld ter beheersing van het EMU-saldo van de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel7
  - number: '7.2'
    text: |-
      Een krachtens het eerste lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan vier
      weken na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel7
  - number: '8.1'
    text: |-
      Onze Ministers stellen bij ministeriële regeling regels ten aanzien van de berekening en de verstrekking door de
      openbare lichamen van gegevens, welke nodig zijn voor het toezicht op de naleving van het bepaalde bij of krachtens
      deze wet.
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel8
  - number: '8.2'
    text: 'De gegevens hebben slechts betrekking op:'
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel8
  - number: 8.2.a
    text: liquiditeits- en schuldpositie;
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel8
  - number: 8.2.b
    text: ontvangen waarborgsommen;
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel8
  - number: 8.2.c
    text: de kasgeldlimiet;
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel8
  - number: 8.2.d
    text: het renterisico op de vaste schuld;
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel8
  - number: 8.2.e
    text: de renterisiconorm;
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel8
  - number: 8.2.f
    text: aangegane geldleningen;
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel8
  - number: 8.2.g
    text: uitzettingen;
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel8
  - number: 8.2.h
    text: verleende garanties met betrekking tot de nakoming van uit geldleningen voortvloeiende verplichtingen; of
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel8
  - number: 8.2.i
    text: het EMU-saldo van de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel8
  - number: '9'
    text: |-
      Onze Ministers zenden binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over
      de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel9
  - number: '13'
    text: De Wet financiering lagere overheid wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel13
  - number: '14'
    text: |-
      Onze Ministers kunnen gedurende een door hen te bepalen termijn en onder door hen te stellen voorwaarden aan
      openbare lichamen ontheffing verlenen van [artikel 2, eerste en tweede lid][ref1], in verband met een zorgvuldige
      beëindiging van op het tijdstip van inwerkingtreding van deze wet bestaande aanspraken en verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0011987#Artikel2
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0011987
        artikel: '2'
  - number: '15'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel15
  - number: '16'
    text: 'Deze wet wordt aangehaald als: Wet financiering decentrale overheden.'
    url: https://wetten.overheid.nl/BWBR0011987/2006-05-01#Artikel16
