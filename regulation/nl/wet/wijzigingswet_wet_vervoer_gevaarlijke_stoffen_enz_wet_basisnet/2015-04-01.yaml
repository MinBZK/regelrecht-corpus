preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om, ter bevordering van sturing op het risico vanwege
    het vervoer van gevaarlijke stoffen over wegen, hoofdspoorwegen en binnenwateren, in de Wet vervoer gevaarlijke
    stoffen regels op te nemen voor risicobegrenzing en de routeringsbevoegdheden te herzien;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0033712/2015-04-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      1 Provinciale staten dragen er zorg voor dat een krachtens
      [artikel 16 van de Wet vervoer gevaarlijke stoffen][ref1], zoals dat luidde voor inwerkingtreding van deze wet,
      vastgesteld provinciaal netwerk uiterlijk een jaar na inwerkingtreding van deze wet in overeenstemming is met
      [artikel I, onderdeel C][ref2], artikel 23, van deze wet.

      2 De gemeenteraad draagt er zorg voor dat een krachtens [artikel 18 van de Wet vervoer gevaarlijke stoffen][ref3],
      zoals dat luidde voor inwerkingtreding van deze wet, vastgesteld routeringsbesluit uiterlijk twee jaar na
      inwerkingtreding van deze wet in overeenstemming is met [artikel I, onderdeel C][ref4], artikel 24, van deze wet.

      3 Een krachtens [artikel 16 van de Wet vervoer gevaarlijke stoffen][ref5], zoals dat luidde voor inwerkingtreding
      van deze wet, vastgesteld provinciaal netwerk wordt gelijkgesteld met een provinciaal netwerk als bedoeld in
      [artikel I, onderdeel C][ref6], artikel 23, van deze wet, voor zover dat netwerk met dat artikel in overeenstemming
      is.

      4 Een krachtens [artikel 18 van de Wet vervoer gevaarlijke stoffen][ref7], zoals dat luidde voor
      inwerkingtreding van deze wet, vastgesteld routeringsbesluit wordt gelijkgesteld met een besluit als bedoeld in
      [artikel I, onderdeel C][ref8], artikel 24, van deze wet, voor zover dat besluit met dat artikel in overeenstemming
      is.

      5 Een krachtens [artikel 22 van de Wet vervoer gevaarlijke stoffen][ref9], zoals dat luidde voor
      inwerkingtreding van deze wet, verleende ontheffing wordt gelijkgesteld met een ontheffing als bedoeld in
      [artikel I, onderdeel C][ref10], artikel 29 van deze wet.


