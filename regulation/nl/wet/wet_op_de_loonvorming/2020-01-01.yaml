---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_de_loonvorming
regulatory_layer: WET
publication_date: '2017-03-28'
valid_from: '2020-01-01'
bwb_id: BWBR0002698
url: https://wetten.overheid.nl/BWBR0002698/2020-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de voorschriften van de derde titel van het
    Buitengewoon Besluit Arbeidsverhoudingen 1945 (Stb. 1963, 271) door andere regelen met betrekking tot de
    totstandkoming van lonen en andere arbeidsvoorwaarden te vervangen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#Artikel1
  - number: 1.a
    text: '*Onze Minister:* Onze Minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#Artikel1
  - number: 1.b
    text: 'werknemer:'
    url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#Artikel1
  - number: 1.b.1°
    text: degene die in dienst van een ander arbeid verricht;
    url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#Artikel1
  - number: 1.b.2°
    text: |-
      degene die in de zelfstandige uitoefening van een bedrijf of beroep persoonlijk arbeid voor een ander verricht
        - tenzij hij zodanige arbeid in de regel voor meer dan twee anderen verricht of zich daarbij door meer dan twee
      personen, niet zijnde zijn echtgenoot of geregistreerde partner of een bij hem inwonend bloed- of aanverwant of
      pleegkind, laat bijstaan, dan wel deze arbeid voor hem slechts een bijkomstige werkzaamheid is;
    url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#Artikel1
  - number: 1.Abusievelijk
    text: |-
      c. *werkgever:* de natuurlijke persoon of rechtspersoon in wiens dienst dan wel voor wie de onder *b,*
      onderscheidenlijk sub 1° en sub 2°, bedoelde werknemer arbeid verricht;
    url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#Artikel1
  - number: 1.d
    text: '*arbeidsverhouding:* de rechtsbetrekking tussen een werknemer en diens werkgever;'
    url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#Artikel1
  - number: 1.e
    text: '*loon:* arbeidsvoorwaarde, regelende de vergoeding van de werkgever aan de werknemer ter zake van diens arbeid.'
    url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#Artikel1
  - number: '2.1'
    text: 'Deze wet is niet van toepassing op de arbeidsverhouding van:'
    url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#Artikel2
  - number: 2.1.a
    text: |-
      personen op wie [artikel 3 van de Ambtenarenwet 2017][ref1] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel3
    url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '3'
  - number: 2.1.b
    text: personen die een geestelijk ambt bekleden.
    url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#Artikel2
  - number: '2.2'
    text: |-
      Deze wet is voorts niet van toepassing op arbeidsverhoudingen, behorende tot een bij algemene maatregel van bestuur
      daartoe aangewezen categorie.
    url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#Artikel2
  - number: '2.3'
    text: |-
      In afwijking van het eerste lid is deze wet van toepassing op de dienstbetrekking, bedoeld in de
      [Wet sociale werkvoorziening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008903
    url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008903
  - number: '4.1'
    text: |-
      Van het sluiten, wijzigen of opzeggen van een collectieve arbeidsovereenkomst, doen partijen mededeling aan Onze
      Minister. Daarbij wordt de tekst van de gesloten overeenkomst dan wel van de gewijzigde bepalingen daarvan alsmede
      een toelichting daarop overgelegd.
    url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#Artikel4
  - number: '4.2'
    text: |-
      Onze Minister stelt zo spoedig mogelijk na ontvangst van de mededeling en de bescheiden bedoeld in het eerste lid
      partijen hiervan in kennis.
    url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#Artikel4
  - number: '4.3'
    text: |-
      Een collectieve arbeidsovereenkomst of wijziging daarvan kan eerst in werking treden met ingang van de dag volgende
      op die waarop Onze Minister de in het tweede lid bedoelde kennisgeving heeft verzonden.
    url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#Artikel4
  - number: '5.1'
    text: |-
      Onze Minister kan, op gezamenlijk verzoek van een of meer werkgevers of verenigingen met
      volledige rechtsbevoegdheid van werkgevers enerzijds en een of meer verenigingen met volledige
      rechtsbevoegdheid van werknemers anderzijds, voor een bij zijn besluit te bepalen tijdvak van ten
      hoogste twee jaar te hunnen aanzien regelingen vaststellen van dezelfde inhoud als een collectieve
      arbeidsovereenkomst. Deze regelingen kunnen echter geen bepalingen behelzen als bedoeld in
      __REF000___________________________________________________________________________________________________________
      ____________________________________ (*Stb.* 1937, 801).


      [ref1]: https://wetten.overheid.nl/BWBR0001987#Artikel2
    url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001987
        artikel: '2'
  - number: '5.2'
    text: |-
      Alvorens aan het eerste lid toepassing te geven stelt Onze Minister organisaties van werkgevers en van werknemers,
      welke naar zijn oordeel op centraal niveau hiervoor in aanmerking komen, in de gelegenheid hem hun zienswijze ter
      zake kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#Artikel5
  - number: '5.3'
    text: |-
      Onze Minister wijst een verzoek als bedoeld in het eerste lid niet af zonder de verzoekers in de gelegenheid te
      hebben gesteld hem hun bedenkingen daartegen kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#Artikel5
  - number: '5.4'
    text: |-
      Regelingen, vastgesteld krachtens het eerste lid, hebben dezelfde rechtskracht als een tussen verzoekers geldende
      collectieve arbeidsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#Artikel5
  - number: '6.1'
    text: |-
      Onze Minister kan regelingen van dezelfde inhoud als een collectieve arbeidsovereenkomst, voor een bij zijn
      besluit te bepalen tijdvak van ten hoogste twee jaar, eveneens vaststellen met betrekking tot arbeidsverhoudingen,
      behorende tot een bij zijn besluit daartoe aangewezen categorie. [Artikel 5, eerste lid, tweede volzin][ref1], is
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002698#Artikel5
    url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002698
        artikel: '5'
        paragraaf: '3'
  - number: '6.2'
    text: |-
      Toepassing van het eerste lid kan uitsluitend geschieden op verzoek van de Stichting van de Arbeid dan wel op
      verzoek van al dan niet in de Stichting van de Arbeid vertegenwoordigde centrale organisaties van werkgevers of
      van werknemers, van een werkgever, van een vereniging met volledige rechtsbevoegdheid van werkgevers of van een
      zodanige vereniging van werknemers. Vaststelling kan slechts geschieden nadat niet in de Stichting van de Arbeid
      vertegenwoordigde organisaties van werkgevers en van werknemers, welke naar het oordeel van Onze Minister op
      centraal niveau hiervoor in aanmerking komen, in de gelegenheid zijn gesteld hem hun zienswijze ter zake kenbaar
      te maken. Vaststelling anders dan op verzoek van de Stichting van de Arbeid kan daarenboven slechts geschieden met
      haar instemming. Indien een verzoek als bedoeld in de eerste volzin is gedaan door een centrale organisatie van
      werkgevers of van werknemers, blijft de tweede volzin ten aanzien van de verzoeker buiten toepassing.
    url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#Artikel6
  - number: '6.3'
    text: |-
      Van de indiening van een verzoek als bedoeld in het tweede lid doet Onze Minister mededeling in de *Staatscourant.*
      Daarbij bepaalt hij een termijn, binnen welke hem bedenkingen tegen de gevraagde toepassing van het eerste lid
      schriftelijk kunnen worden kenbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#Artikel6
  - number: '6.4'
    text: |-
      Onze Minister wijst een verzoek als bedoeld in het tweede lid niet af zonder de verzoeker in de gelegenheid te
      hebben gesteld hem zijn bedenkingen daartegen kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#Artikel6
  - number: '6.5'
    text: |-
      Regelingen, vastgesteld krachtens het eerste lid, hebben dezelfde rechtskracht als krachtens
      __REF000___________________________________________________________________________________________________________
      _______________________ algemeen verbindend verklaarde bepalingen van zodanige overeenkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0001987#Artikel2
    url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001987
        artikel: '2'
  - number: '10.1'
    text: |-
      Onze Minister kan, indien naar zijn oordeel een zich plotseling voordoende noodsituatie van de nationale economie,
      veroorzaakt door één of meer schoksgewijze optredende externe factoren, het nemen van maatregelen ten aanzien van
      het peil van de loonkosten vereist, algemene regelen vaststellen betreffende lonen en andere op geld waardeerbare
      arbeidsvoorwaarden.
    url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#Artikel10
  - number: '10.2'
    text: |-
      Een regeling op grond van het eerste lid dient gepaard te gaan met de aankondiging van andere maatregelen welke
      in verband met het zich voordoen van de aldaar bedoelde noodsituatie vereist zijn. Voorts dient, indien een
      regeling op grond van het eerste lid wordt vastgesteld, voorzien te worden in een adequate bescherming van de
      levensstandaard van de werknemers.
    url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#Artikel10
  - number: '10.3'
    text: |-
      Het tijdvak waarvoor een krachtens het eerste lid genomen besluit geldt omvat een bij het besluit vast te stellen
      periode die niet langer is dan zes maanden. Deze periode kan één maal worden verlengd met een termijn van ten
      hoogste zes maanden.
    url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#Artikel10
  - number: '10.4'
    text: |-
      Onze Minister kan vrijstelling, of, op verzoek, ontheffing verlenen van de krachtens het eerste lid gestelde
      regelen. Een vrijstelling of ontheffing kan onder beperkingen worden verleend en daaraan kunnen voorschriften
      worden verbonden.
    url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#Artikel10
  - number: '10.5'
    text: |-
      Het is de werkgever verboden te handelen in strijd met krachtens het eerste en vierde lid gestelde regelen en
      voorschriften.
    url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#Artikel10
  - number: '11'
    text: |-
      Elk beding tussen een werkgever en een werknemer alsmede elke bepaling in een collectieve arbeidsovereenkomst
      strijdig met de krachtens [artikel 10, eerste lid][ref1], gestelde regelen, is nietig, behoudens voor zover
      vrijstelling of ontheffing is verleend. In plaats van zodanig beding of zodanige bepaling gelden die regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002698#Artikel10
    url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002698
        artikel: '10'
        paragraaf: '5'
  - number: '12.1'
    text: |-
      Alvorens aan [artikel 10, eerste lid][ref1], onderscheidenlijk [artikel 10, vierde lid][ref2], voorzover
      vrijstelling betreffende, toepassing te geven voert Onze Minister terzake overleg met de Stichting van de Arbeid,
      alsmede met niet in de Stichting van de Arbeid vertegenwoordigde organisaties van werkgevers en van werknemers,
      welke naar zijn oordeel op centraal niveau hiervoor in aanmerking komen.


      [ref1]: https://wetten.overheid.nl/BWBR0002698#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002698#Artikel10
    url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002698
        artikel: '10'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0002698
        artikel: '10'
        paragraaf: '5'
  - number: '12.2'
    text: |-
      In geval het in het eerste lid bedoelde overleg niet heeft plaatsgevonden binnen een week nadat een uitnodiging
      daartoe door Onze Minister is gedaan, geldt het aldaar bepaalde niet, met dien verstande dat Onze Minister in
      dat geval na het vaststellen van een regeling zo spoedig mogelijk alsnog, op de voet van het in dat lid bepaalde,
      overgaat tot het voeren van overleg over het al dan niet handhaven of wijzigen van de regeling.
    url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#Artikel12
  - number: '12.3'
    text: |-
      Indien een regeling op grond van [artikel 10, eerste lid][ref1], wordt voorbereid, wordt, nadat het in het eerste
      lid bedoelde overleg heeft plaatsgevonden dan wel de in het tweede lid bedoelde termijn van een week is verstreken,
      de zakelijke inhoud daarvan schriftelijk medegedeeld aan de beide Kamers der Staten-Generaal. De regeling wordt
      niet eerder vastgesteld dan nadat een week is verstreken na die mededeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002698#Artikel10
    url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002698
        artikel: '10'
        paragraaf: '5'
  - number: '12.4'
    text: |-
      Het bepaalde in de voorafgaande leden is van overeenkomstige toepassing ten aanzien van een verlenging als bedoeld
      in [artikel 10, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002698#Artikel10
    url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002698
        artikel: '10'
        paragraaf: '5'
  - number: '14'
    text: |-
      Onze Minister kan regelen stellen, inhoudende op welke wijze een mededeling als bedoeld in
      [artikel 4, eerste lid][ref1], dan wel een verzoek als bedoeld in [artikel 5, eerste lid][ref2], of
      [6, tweede lid][ref3], moet worden ingediend en welke gegevens daarbij moeten worden verstrekt, waarbij kan worden
      bepaald dat dit, in afwijking van [artikel 2:14, eerste lid, van de Algemene wet bestuursrecht][ref4], uitsluitend
      langs elektronische weg kan geschieden, tenzij naar het oordeel van Onze Minister sprake is van omstandigheden die
      zich daartegen verzetten.


      [ref1]: https://wetten.overheid.nl/BWBR0002698#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002698#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0002698#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002698
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002698
        artikel: '5'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0002698
        artikel: '6'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '2'
  - number: '15.1'
    text: |-
      Onze Minister wijst ambtenaren aan, belast met het inwinnen van gegevens omtrent de algemene ontwikkeling van lonen
      en andere op geld waardeerbare arbeidsvoorwaarden.
    url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#Artikel15
  - number: '15.2'
    text: |-
      De [artikelen 5:13][ref1], [5:16][ref2], [5:17][ref3] en [5:20 van de Algemene wet bestuursrecht][ref4] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '16'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#Artikel16
  - number: '17.1'
    text: |-
      Indien Onze Minister heeft vastgesteld dat de Stichting van de Arbeid heeft opgehouden te bestaan of de haar
      krachtens deze wet toekomende taak te vervullen, treden voor de toepassing van de [artikelen 5, tweede lid][ref1],
      [6, tweede lid][ref2], en [12, eerste lid][ref3], in haar plaats de door Ons aangewezen centrale organisaties van
      werkgevers en van werknemers. Voor aanwijzing komen slechts in aanmerking de naar Ons oordeel algemeen erkende
      centrale representatieve organisaties van werkgevers en van werknemers.


      [ref1]: https://wetten.overheid.nl/BWBR0002698#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002698#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0002698#Artikel12
    url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002698
        artikel: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002698
        artikel: '6'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0002698
        artikel: '12'
        paragraaf: '5'
  - number: '17.2'
    text: |-
      In het geval, bedoeld in het eerste lid, kan Onze Minister slechts overgaan tot toepassing van
      [artikel 6, eerste lid][ref1], na de krachtens het eerste lid aangewezen organisaties in de gelegenheid te hebben
      gesteld hem hun zienswijze ter zake kenbaar te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0002698#Artikel6
    url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002698
        artikel: '6'
        paragraaf: '3'
  - number: '19'
    text: |-
      Van een besluit als bedoeld in [artikel 5, eerste lid][ref1], [6, eerste lid][ref2],
      [10, eerste of vierde lid][ref3], voor zover het de vrijstelling betreft, [14][ref4], [15][ref5], [16][ref6] of
      [17, eerste lid][ref7], wordt mededeling gedaan door plaatsing in de *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0002698#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002698#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0002698#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0002698#Artikel14
      [ref5]: https://wetten.overheid.nl/BWBR0002698#Artikel15
      [ref6]: https://wetten.overheid.nl/BWBR0002698#Artikel16
      [ref7]: https://wetten.overheid.nl/BWBR0002698#Artikel17
    url: https://wetten.overheid.nl/BWBR0002698/2020-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002698
        artikel: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002698
        artikel: '6'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0002698
        artikel: '10'
        paragraaf: '5'
      - id: ref4
        bwb_id: BWBR0002698
        artikel: '14'
        paragraaf: '6'
      - id: ref5
        bwb_id: BWBR0002698
        artikel: '15'
        paragraaf: '6'
      - id: ref6
        bwb_id: BWBR0002698
        artikel: '16'
        paragraaf: '6'
      - id: ref7
        bwb_id: BWBR0002698
        artikel: '17'
        paragraaf: '6'
  - number: '20.1'
    text: |-
      Onverminderd het in de [artikelen 131][ref1] en [241 van Boek 2 (Rechtspersonen) van het Burgerlijk Wetboek][ref2]
      bepaalde, worden burgerlijke rechtsvorderingen van werkgevers of werknemers welke voortvloeien uit niet-naleving
      van het bij of krachtens deze wet bepaalde, geacht betrekkelijk te zijn tot een arbeidsovereenkomst.


