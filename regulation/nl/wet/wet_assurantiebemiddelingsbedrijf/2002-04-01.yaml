---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_assurantiebemiddelingsbedrijf
regulatory_layer: WET
publication_date: '2005-07-05'
valid_from: '2002-04-01'
bwb_id: BWBR0004993
url: https://wetten.overheid.nl/BWBR0004993/2002-04-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Wet Assurantiebemiddeling uit het oogpunt van
    vereenvoudiging te vervangen door een nieuwe regeling;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel1
  - number: 1.a
    text: 'verzekeraar: ieder die voor eigen rekening het verzekeringsbedrijf uitoefent;'
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel1
  - number: 1.b
    text: |-
      tussenpersoon: ieder die, anders dan uit hoofde van een arbeidsovereenkomst, bemiddeling verleent bij het sluiten
      van een verzekering;
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel1
  - number: 1.c
    text: |-
      sub-agent: de tussenpersoon die voor een andere tussenpersoon zijn bemiddeling verleent bij het sluiten van een
      verzekering;
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel1
  - number: 1.d
    text: |-
      gevolmachtigd agent: ieder die als gevolmachtigd vertegenwoordiger van een verzekeraar voor diens rekening het
      verzekeringsbedrijf uitoefent;
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel1
  - number: 1.e
    text: |-
      richtlijn: de richtlijn van de Raad van de Europese Gemeenschappen van 13 december 1976, houdende maatregelen
      ter bevordering van de daadwerkelijke uitoefening van het recht van vestiging en het vrij verrichten van diensten
      voor de werkzaamheden van verzekeringsagent en assurantiemakelaar (ex groep 630 CITI) en houdende met name
      overgangsmaatregelen voor deze werkzaamheden (*PbEG* L 26 van 31 januari 1977);
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel1
  - number: 1.f
    text: 'Onze Ministers: Onze Ministers van Financiën en van Economische Zaken;'
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel1
  - number: 1.g
    text: 'de Raad: de Sociaal-Economische Raad.'
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel1
  - number: '2.1'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat, en zonodig onder welke voorwaarden, deze wet geheel of
      gedeeltelijk niet van toepassing is op de bemiddeling in bij dit besluit aan te wijzen vormen van verzekering.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel2
  - number: '2.2'
    text: |-
      De voordracht voor een algemene maatregel van bestuur als bedoeld in het eerste lid wordt niet gedaan dan nadat het
      ontwerp in de *Staatscourant* is bekendgemaakt en aan een ieder de gelegenheid is geboden om binnen 30 dagen na de
      dag waarop de bekendmaking is geschied, wensen en bezwaren ter kennis van Onze Minister van Financiën te brengen.
      Gelijktijdig met de bekendmaking wordt het ontwerp aan de beide kamers der Staten-Generaal overgelegd.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel2
  - number: '3.1'
    text: |-
      Het is verboden als tussenpersoon op te treden zonder te zijn ingeschreven in het register van tussenpersonen dat
      door de Raad wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel3
  - number: '3.2'
    text: |-
      Het verbod, bedoeld in het eerste lid, is niet van toepassing op de curator in het faillissement van een
      tussenpersoon. De curator doet terstond mededeling aan de Raad van het tijdstip van de aanvaarding en van de
      beëindiging van zijn functie.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel3
  - number: '3.3'
    text: |-
      De Raad deelt op verzoek mee of een bepaalde persoon in het register is ingeschreven als tussenpersoon, alsmede of
      deze een feitelijk leider als bedoeld in [artikel 4, vierde lid][ref1], heeft aangewezen. In dat geval wordt tevens
      de naam van de feitelijk leider medegedeeld. Voor het verstrekken van informatie uit het register kan de Raad een
      kostenvergoeding vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0004993#Artikel4
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004993
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
  - number: '3.4'
    text: |-
      Zo spoedig mogelijk na afloop van elk kalenderjaar doet de Raad mededeling van de namen van de
      tussenpersonen die op 31 december van dat jaar in het register stonden ingeschreven, door opname van deze
      gegevens in een door de zorg van de Raad tegen vergoeding van de kosten algemeen verkrijgbaar te stellen
      lijst. De Raad vermeldt daarbij tenminste het nummer van de inschrijving alsmede aan welke van de in
      [artikel 4, eerste lid, onderdelen a en b][ref1], bedoelde vakbekwaamheidseisen de tussenpersoon of de feitelijk
      leider voldoet. Gelijktijdig doet de Raad mededeling van de in dat jaar doorgehaalde inschrijvingen. Tussentijds
      kan de Raad mededeling doen van wijzigingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004993#Artikel4
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004993
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
  - number: '4.1'
    text: 'Inschrijving in het register geschiedt indien de aanvrager voldoet aan bij algemene maatregel van bestuur:'
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel4
  - number: 4.1.a
    text: ten aanzien van het diploma Assurantiebemiddeling A te stellen vakbekwaamheidseisen, of
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel4
  - number: 4.1.b
    text: ten aanzien van het diploma Assurantiebemiddeling B te stellen vakbekwaamheidseisen.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel4
  - number: '4.2'
    text: 'Als voorwaarden voor de inschrijving gelden voorts dat:'
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel4
  - number: 4.2.a
    text: er geen vrees bestaat dat de aanvrager als tussenpersoon het aanzien van de stand der tussenpersonen zal schaden;
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel4
  - number: 4.2.b
    text: |-
      de aanvrager niet in staat van faillissement verkeert en dat ten aanzien van hem de schuldsaneringsregeling
      natuurlijke personen niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel4
  - number: '4.3'
    text: |-
      Indien de aanvrager een natuurlijk persoon is, dient deze bovendien meerderjarig te zijn of handlichting te hebben
      verkregen en niet onder curatele te zijn gesteld of wegens onderbewindstelling het vrije beheer over zijn goederen
      te hebben verloren.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel4
  - number: '4.4'
    text: |-
      Indien de aanvrager niet zelf de feitelijke leiding over een of meer vestigingen van zijn
      assurantiebemiddelingsbedrijf zal uitoefenen, gelden te zijnen aanzien de vereisten van het tweede en derde lid.
      Als voorwaarde voor zijn inschrijving geldt voorts dat de natuurlijke personen die blijkens de opgave van de
      aanvrager met bedoelde feitelijke leiding zullen zijn belast, voldoen aan de vereisten van het eerste lid, het
      tweede lid, onderdeel *a,* en het derde lid. Deze personen zullen niet tevens belast mogen zijn met de feitelijke
      leiding over het assurantiebemiddelingsbedrijf van een andere tussenpersoon, tenzij dit bedrijf deel uitmaakt van
      dezelfde groep waartoe ook het bedrijf van de aanvrager behoort.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel4
  - number: '4.5'
    text: |-
      De aanvrager dient ten genoegen van de Raad aannemelijk te maken dat hijzelf of de door hem opgegeven natuurlijke
      personen de feitelijke leiding zullen uitoefenen.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel4
  - number: '4.6'
    text: |-
      De Raad vermeldt in het register bij de inschrijving van een tussenpersoon de namen van degenen die door de
      tussenpersoon zijn belast met de feitelijke leiding.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel4
  - number: '4.7'
    text: |-
      De Raad vermeldt in het register aan welke in het eerste lid, onderdelen *a* en *b,* bedoelde vakbekwaamheidseisen
      de tussenpersoon of de feitelijk leider voldoet.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel4
  - number: '4.8'
    text: |-
      In de algemene maatregelen van bestuur, bedoeld in het eerste lid, wordt, onverminderd het bepaalde in het negende
      lid, bepaald op welke wijze van het voldoen aan de vakbekwaamheidseisen kan blijken. Voorts is de Raad bevoegd te
      verklaren dat de aanvrager voldoet aan deze eisen. De Raad stelt regels krachtens welke de afgifte van zodanige
      verklaring zal plaatsvinden en stelt het bedrag vast, dat verschuldigd is voor het verkrijgen van deze verklaring.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel4
  - number: '4.9'
    text: |-
      Indien de richtlijn op de aanvrager van toepassing is, wordt aan het bewijs dat wordt voldaan aan
      de eisen, bedoeld in het eerste lid, gelijkgesteld het overleggen van de verklaring als bedoeld in
      artikel 9 van de richtlijn. Indien de aanvrager blijkens de verklaring voldoet aan de eisen, bedoeld in
      [artikel 5, tweede lid, tweede gedachtenstreep][ref1], alsmede aan de overige voorwaarden bedoeld in de artikelen
      4, 7 en 8 van de richtlijn, vermeldt de Raad in het register dat de aanvrager voldoet aan de in het eerste lid,
      onderdeel *a,* bedoelde vakbekwaamheidseisen. Indien de aanvrager blijkens de verklaring alleen voldoet aan de
      voorwaarden, bedoeld in de artikelen 4, 7 en 8 van de richtlijn, vermeldt de Raad in het register dat de aanvrager
      voldoet aan de in het eerste lid, onderdeel *b,* bedoelde vakbekwaamheidseisen.


      [ref1]: https://wetten.overheid.nl/BWBR0004993#Artikel5
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004993
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: '4.10'
    text: |-
      Indien de aanvrager blijkens de in het negende lid bedoelde verklaring voldoet aan de voorwaarden, bedoeld in
      de artikelen 6 en 7 van de richtlijn, vermeldt de Raad in het register dat de aanvrager voldoet aan de in het
      eerste lid, onderdeel *b,* bedoelde vakbekwaamheidseisen. Degene die op grond van dit lid in het register wordt
      ingeschreven, mag alleen als sub-agent werkzaam zijn. In het register en op het bewijs van inschrijving, bedoeld
      in [artikel 6, tweede lid][ref1], vermeldt de Raad in dat geval dat de betrokkene alleen als sub-agent werkzaam
      mag zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004993#Artikel6
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004993
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
  - number: '5.1'
    text: |-
      Op een daartoe strekkend verzoek kan de Raad, in het belang van het bedrijf van een tussenpersoon, ontheffing
      verlenen van de in [artikel 4, eerste lid][ref1], bedoelde vakbekwaamheidseisen, aan hetzij:


      [ref1]: https://wetten.overheid.nl/BWBR0004993#Artikel4
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004993
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
  - number: 5.1.a
    text: |-
      een der personen die met een overleden tussenpersoon tot het tijdstip van diens overlijden een duurzame
      gemeenschappelijke huishouding hebben gehad;
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel5
  - number: 5.1.b
    text: een der niet tot de huishouding behorende kinderen van een overleden tussenpersoon;
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel5
  - number: 5.1.c
    text: de vereffenaar van een in liquidatie getreden tussenpersoon;
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel5
  - number: 5.1.d
    text: de curator van een onder curatele gestelde tussenpersoon.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel5
  - number: '5.2'
    text: |-
      De in het eerste lid bedoelde ontheffing wordt met terugwerkende kracht verleend tot de datum van overlijden, van
      aanvang van de vereffening of van de ondercuratelestelling. De ontheffing geldt voor ten hoogste een jaar en kan
      ten hoogste tweemaal met een jaar worden verlengd.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel5
  - number: '5.3'
    text: |-
      Bij de inschrijving in het register van degene aan wie een ontheffing als bedoeld in het eerste lid is verleend,
      wordt aangetekend:
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel5
  - number: 5.3.a
    text: de grond van de ontheffing;
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel5
  - number: 5.3.b
    text: de termijn gedurende welke de ontheffing geldt;
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel5
  - number: 5.3.c
    text: de naam van de in het eerste lid bedoelde tussenpersoon.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel5
  - number: '6.1'
    text: |-
      De Raad stelt het bedrag vast dat aan hem moet worden voldaan ter zake van de behandeling van een verzoek om
      inschrijving. De Raad neemt een verzoek in behandeling nadat het bedrag is voldaan.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel6
  - number: '6.2'
    text: |-
      Diegene, op wiens verzoek gunstig is beslist, ontvangt van de Raad zo spoedig mogelijk een bewijs van inschrijving,
      vermeldende de naam van de tussenpersoon of de feitelijk leider, de datum en het nummer van de inschrijving alsmede
      aan welke van de in [artikel 4, eerste lid, onderdelen ][ref1] bedoelde vakbekwaamheidseisen, de tussenpersoon of
      de feitelijk leider voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0004993#Artikel4
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004993
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
  - number: '7.1'
    text: |-
      Iedere in het register ingeschreven tussenpersoon deelt wijzigingen in de bij de aanvraag tot inschrijving vermelde
      gegevens, onverwijld schriftelijk aan de Raad mee.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel7
  - number: '7.2'
    text: Voor zover deze wijzigingen betrekking hebben op gegevens opgenomen in het register brengt de Raad deze hierin aan.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel7
  - number: '7.3'
    text: |-
      De Raad verstrekt, tegen een door hem te bepalen vergoeding, aan de tussenpersoon op diens verzoek een nieuw bewijs
      van inschrijving.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel7
  - number: '8.1'
    text: 'In het register wordt doorgehaald de inschrijving van de tussenpersoon die:'
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel8
  - number: 8.1.a
    text: daarom verzoekt;
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel8
  - number: 8.1.b
    text: is overleden;
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel8
  - number: 8.1.c
    text: |-
      in staat van faillissement verkeert of ten aanzien van wie de schuldsaneringsregeling natuurlijke personen van
      toepassing is verklaard;
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel8
  - number: 8.1.d
    text: in liquidatie is getreden;
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel8
  - number: 8.1.e
    text: onder curatele is gesteld of van wie de handlichting is ingetrokken;
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel8
  - number: 8.1.f
    text: |-
      het bedrag, verschuldigd ingevolge [artikel 27, tweede lid][ref1], niet heeft voldaan, na door de Raad in gebreke
      te zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004993#Artikel27
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004993
        artikel: '27'
        hoofdstuk: IV
  - number: '8.2'
    text: 'In het register wordt voorts doorgehaald de inschrijving van de tussenpersoon die:'
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel8
  - number: 8.2.a
    text: |-
      naar het oordeel van de Raad in ernstige mate handelt in strijd met het belang van een of meer verzekeraars,
      verzekeringnemers, verzekerden of gerechtigden op uitkering of anderszins niet meer voldoet aan de in
      [artikel 4, tweede lid, onderdeel ][ref1] gestelde eis;


      [ref1]: https://wetten.overheid.nl/BWBR0004993#Artikel4
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004993
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
  - number: 8.2.b
    text: |-
      de feitelijke leiding over een of meer vestigingen van het assurantiebemiddelingsbedrijf
      laat uitoefenen door natuurlijke personen die niet voldoen aan de vereisten, genoemd in
      [artikel 4, vierde lid, tweede en laatste volzin][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004993#Artikel4
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004993
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
  - number: 8.2.c
    text: |-
      niet meer in het bezit is van de ontheffing, bedoeld in [artikel 5, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004993#Artikel5
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004993
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: 8.2.d
    text: |-
      naar het oordeel van de Raad ernstig in gebreke blijft aan de in [artikel 28, eerste, tweede en derde lid][ref1],
      bedoelde verplichtingen te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0004993#Artikel28
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004993
        artikel: '28'
        hoofdstuk: IV
  - number: '8.3'
    text: |-
      De Raad is bevoegd op grond van bijzondere omstandigheden de doorhaling, bedoeld in het tweede lid, onderdelen *a,
      b* en *d,* op door hem te stellen voorwaarden, gedurende een door hem te bepalen tijd, op te schorten. De Raad kan
      de termijn van opschorting verlengen, zo hij gegronde redenen daartoe aanwezig acht. Van deze opschorting stelt de
      Raad aantekening in het register onder vermelding van de termijn van opschorting.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel8
  - number: '9'
    text: |-
      De werking van het besluit tot doorhaling van de inschrijving op grond van [artikel 8, tweede lid][ref1], wordt
      opgeschort totdat de beroepstermijn is verstreken of, indien beroep is ingesteld, totdat op het beroep is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0004993#Artikel8
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004993
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
  - number: '10.1'
    text: |-
      De verzekeraar die door een tussenpersoon voor de eerste maal wordt benaderd met een voorstel tot het sluiten van
      een verzekering gaat slechts tot behandeling van dat voorstel over indien hij zich ervan heeft vergewist dat de
      tussenpersoon is ingeschreven in het register, bedoeld in [artikel 3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004993#Artikel3
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004993
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '10.2'
    text: |-
      De verzekeraar gaat één maal per jaar na of de tussenpersoon, door wiens bemiddeling hij een verzekering heeft
      gesloten die nog niet is beëindigd, nog in het register, bedoeld in [artikel 3, eerste lid][ref1], is ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0004993#Artikel3
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004993
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '10.3'
    text: |-
      Indien uit de in het tweede lid bedoelde controle blijkt dat een tussenpersoon niet meer in het register is
      ingeschreven, gaat de verzekeraar niet meer over tot het in behandeling nemen van diens voorstellen tot het sluiten
      van verzekeringen.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel10
  - number: '10.4'
    text: |-
      Het tweede en derde lid zijn niet van toepassing ten aanzien van de faillissementscurator van een tussenpersoon.
      Deze verstrekt aan de verzekeraar een bewijsstuk waaruit zijn aanstelling als curator blijkt.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel10
  - number: '11.1'
    text: |-
      De tussenpersoon die tevens gevolmachtigde agent is vermeldt dit op zijn briefpapier. Hij vermeldt daarbij de naam
      van de verzekeraars die hem volmacht hebben verleend.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel11
  - number: '11.2'
    text: |-
      Het bepaalde in het eerste lid is van overeenkomstige toepassing indien de tussenpersoon en de gevolmachtigde agent
      niet in dezelfde natuurlijke of rechtspersoon zijn verenigd doch onder dezelfde leiding staan.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel11
  - number: '12'
    text: |-
      Een verzekeringsovereenkomst die of door bemiddeling van een tussenpersoon tot stand is gekomen of naar een
      tussenpersoon is overgeboekt behoort in de relatie tot de betrokken verzekeraar tot de portefeuille van die
      tussenpersoon zolang die verzekering daaruit niet is overgeboekt.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel12
  - number: '14.1'
    text: |-
      Tenzij anders wordt overeengekomen of de tussenpersoon zich bij de verzekeringsovereenkomst tegenover de
      verzekeraar tot betaling van premie en kosten als eigen schuld heeft verbonden, verzorgt de tussenpersoon voor de
      verzekeraar het incasso der premies. Ter zake van dit premie-incasso is hij jegens de verzekeraar te allen tijde
      rekening en verantwoording schuldig.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel14
  - number: '14.2'
    text: |-
      Tenzij tussen een verzekeraar en een tussenpersoon anders is overeengekomen kan de verzekeraar de tussenpersoon van
      het premie-incasso ontheffen, indien:
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel14
  - number: 14.2.a
    text: de inschrijving van de tussenpersoon is doorgehaald;
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel14
  - number: 14.2.b
    text: de tussenpersoon het premie-incasso in ernstige mate verwaarloost;
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel14
  - number: 14.2.c
    text: de tussenpersoon in gebreke blijft namens de verzekeraar door hem geïnde premies tijdig aan deze af te dragen;
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel14
  - number: 14.2.d
    text: |-
      de tussenpersoon zich schuldig heeft gemaakt aan handelingen, die de vrees wettigen dat hij niet zal voldoen aan
      zijn uit het premie-incasso voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel14
  - number: '14.3'
    text: |-
      In de gevallen waarin in verband met het bepaalde in het tweede lid het premie-incasso door een tussenpersoon
      eindigt, wordt dit door de verzekeraar overgenomen.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel14
  - number: '17.1'
    text: |-
      De verzekeraar kan slechts met toestemming van de tussenpersoon of diens rechtverkrijgenden een deel of het geheel
      van diens portefeuille overboeken naar de portefeuille van een andere tussenpersoon.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel17
  - number: '17.2'
    text: |-
      In afwijking van het bepaalde in het eerste lid boekt de verzekeraar op schriftelijk verzoek van een
      verzekeringnemer diens verzekering uit de portefeuille van een tussenpersoon over naar die van een andere
      tussenpersoon, tenzij de verzekeraar gegronde bezwaren heeft tegen die tussenpersoon.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel17
  - number: '17.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op het door een verzekeraar in eigen beheer nemen van
      een verzekeringsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel17
  - number: '17.4'
    text: |-
      De verzekeraar verleent op schriftelijk verzoek van een tussenpersoon zijn medewerking aan de gehele of
      gedeeltelijke overdracht van de portefeuille van die tussenpersoon aan een andere tussenpersoon, tenzij de
      verzekeraar gegronde bezwaren heeft tegen die tussenpersoon.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel17
  - number: '18'
    text: |-
      Het bepaalde in de [artikelen 10][ref1], [12][ref2], [14][ref3] en [17][ref4], met betrekking tot de verhouding
      tussen de verzekeraar en de tussenpersoon geldt op overeenkomstige wijze voor de verhouding tussen de tussenpersoon
      en de sub-agent.


      [ref1]: https://wetten.overheid.nl/BWBR0004993#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0004993#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0004993#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0004993#Artikel17
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004993
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004993
        artikel: '12'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004993
        artikel: '14'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0004993
        artikel: '17'
        hoofdstuk: II
        paragraaf: '2'
  - number: '19.1'
    text: |-
      Daar, waar in deze wet, behoudens in artikel 1 en in dit hoofdstuk, de term verzekeraar wordt gebruikt, wordt
      daaronder mede verstaan de gevolmachtigde agent.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel19
  - number: '19.2'
    text: |-
      Het bepaalde in dit hoofdstuk met betrekking tot gevolmachtigde agenten is mede van toepassing op agenten,
      aan wie door een gevolmachtigd agent een ondervolmacht is afgegeven. Ten aanzien van de inschrijving van
      ondergevolmachtigde agenten in het in [artikel 20][ref1] bedoelde register, geldt dat voor de toepassing van
      [artikel 21, eerste lid, aanhef en onderdeel ][ref2], onder volmacht moet worden verstaan ondervolmacht.


      [ref1]: https://wetten.overheid.nl/BWBR0004993#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0004993#Artikel21
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004993
        artikel: '20'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004993
        artikel: '21'
        hoofdstuk: III
  - number: '19.3'
    text: |-
      In afwijking van het bepaalde in het eerste lid treedt de gevolmachtigde agent in zijn kwaliteit van verlener van
      ondervolmachten voor de toepassing van dit hoofdstuk op als verzekeraar.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel19
  - number: '20.1'
    text: |-
      Het is verboden als gevolmachtigde agent van een verzekeraar op te treden tenzij men als zodanig is ingeschreven in
      het register van gevolmachtigde agenten, dat door de Raad wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel20
  - number: '20.2'
    text: |-
      Het register van gevolmachtigde agenten is openbaar. De Raad verstrekt op verzoek informatie uit het register. Voor
      het verstrekken van informatie uit het register kan de Raad een kostenvergoeding vaststellen.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel20
  - number: '20.3'
    text: |-
      Van de inschrijving van de naam van een gevolmachtigde agent, alsmede van de naam van de verzekeraar, voor wie zijn
      volmacht geldt, wordt door de Raad onverwijld in de *Staatscourant* mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel20
  - number: '21.1'
    text: |-
      Inschrijving in het in [artikel 20][ref1] bedoelde register geschiedt niet dan nadat een door de verzekeraar voor
      gelijkluidend afschrift getekend exemplaar van de verleende volmacht bij de Raad is gedeponeerd en nadat de Raad
      heeft geconstateerd dat:


      [ref1]: https://wetten.overheid.nl/BWBR0004993#Artikel20
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004993
        artikel: '20'
        hoofdstuk: III
  - number: 21.1.a
    text: de volmacht is opgemaakt overeenkomstig een door Onze Minister van Financiën vast te stellen model;
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel21
  - number: 21.1.b
    text: |-
      de gevolmachtigde agent voldoet aan de in [artikel 4, eerste lid, onderdeel ][ref1], bedoelde vakbekwaamheidseisen
      en aan bij algemene maatregel van bestuur vast te stellen eisen ter waarborging van een vakkundige uitoefening van
      het verzekeringsbedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0004993#Artikel4
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004993
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
  - number: '21.2'
    text: 'Als voorwaarde voor de inschrijving geldt voorts dat:'
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel21
  - number: 21.2.a
    text: |-
      geen vrees bestaat dat de aanvrager als gevolmachtigde agent het aanzien van de stand der gevolmachtigde agenten
      zal schaden;
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel21
  - number: 21.2.b
    text: |-
      de aanvrager niet in staat van faillissement verkeert en dat ten aanzien van hem de schuldsaneringsregeling niet
      van toepassing is.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel21
  - number: '21.3'
    text: |-
      Indien de aanvrager een natuurlijk persoon is, dient hij bovendien meerderjarig te zijn of handlichting te hebben
      verkregen en niet onder curatele te zijn gesteld of wegens onderbewindstelling het vrije beheer over zijn goederen
      te hebben verloren.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel21
  - number: '21.4'
    text: |-
      Indien de aanvrager niet zelf de feitelijke leiding over een of meer vestigingen van zijn gevolmachtigdenbedrijf
      zal uitoefenen, gelden te zijnen aanzien de vereisten van het tweede en derde lid. Als voorwaarde voor zijn
      inschrijving geldt voorts dat de natuurlijke personen die blijkens de opgave van de aanvrager met bedoelde
      feitelijke leiding zullen zijn belast, voldoen aan de vereisten van het eerste lid, onderdeel *b*, het tweede lid,
      onderdeel *a* en het derde lid. Deze personen zullen niet tevens belast mogen zijn met de feitelijke leiding over
      het gevolmachtigdenbedrijf van een andere gevolmachtigde agent, tenzij dit bedrijf deel uitmaakt van dezelfde groep
      waartoe ook het bedrijf van de aanvrager behoort.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel21
  - number: '21.5'
    text: |-
      De aanvrager dient ten genoegen van de Raad aannemelijk te maken dat hijzelf of de door hem opgegeven natuurlijke
      personen de feitelijke leiding zullen uitoefenen.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel21
  - number: '21.6'
    text: |-
      De Raad vermeldt in het register bij de inschrijving van een gevolmachtigde agent de namen van degenen die door de
      gevolmachtigde agent zijn belast met de feitelijke leiding.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel21
  - number: '21.7'
    text: |-
      In de algemene maatregel van bestuur, bedoeld in het eerste lid, onderdeel *b*, wordt bepaald op welke wijze van
      het voldoen aan de eisen ter waarborging van een vakkundige uitoefening van het verzekeringsbedrijf kan blijken.
      Voorts is de Raad bevoegd te verklaren dat de aanvrager voldoet aan deze eisen. De Raad stelt regels krachtens
      welke de afgifte van zodanige verklaring zal plaatsvinden en stelt het bedrag vast, dat verschuldigd is voor het
      verkrijgen van deze verklaring.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel21
  - number: '21.8'
    text: |-
      Van zijn beslissing op een verzoek tot inschrijving in het register doet de Raad onverwijld mededeling aan de
      verzekeraar.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel21
  - number: '21.9'
    text: |-
      Indien door de Raad op een verzoek tot inschrijving gunstig is beslist, zendt de Raad aan de gevolmachtigde agent
      een bewijs van inschrijving, vermeldende de naam van de gevolmachtigde agent, de naam van de verzekeraar voor wie
      zijn volmacht geldt, het nummer, waaronder hij is ingeschreven, zomede de datum van inschrijving. Het bewijs van
      inschrijving wordt niet verstrekt aan degene, die aan zijn verplichtingen, voortvloeiende uit het tiende lid van
      dit artikel, niet heeft voldaan.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel21
  - number: '21.10'
    text: |-
      De Raad stelt het bedrag vast, dat door de gevolmachtigde agent aan hem moet worden voldaan ter verkrijging van het
      in het negende lid bedoelde bewijs van inschrijving.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel21
  - number: '21.11'
    text: |-
      Indien de richtlijn op de aanvrager van toepassing is en de aanvrager blijkens een verklaring als bedoeld in
      artikel 9 van de richtlijn voldoet aan de artikelen 4, 5, tweede lid, eerste gedachtestreep, 7 en 8 van de
      richtlijn, wordt het overleggen van die verklaring gelijkgesteld aan het bewijs dat wordt voldaan aan de eisen,
      bedoeld in het eerste lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel21
  - number: 21a.1
    text: |-
      Op een daartoe strekkend verzoek kan de Raad, in het belang van het bedrijf van een gevolmachtigde
      agent en na raadpleging van de volmachtgevende verzekeraar, ontheffing verlenen van de in
      [artikel 21, eerste lid, onderdeel ][ref1], bedoelde eisen, aan hetzij:


      [ref1]: https://wetten.overheid.nl/BWBR0004993#Artikel21
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0004993
        artikel: '21'
        hoofdstuk: III
  - number: 21a.1.a
    text: |-
      een der personen die met een overleden gevolmachtigde agent tot het tijdstip van diens overlijden een duurzame
      gemeenschappelijke huishouding hebben gehad;
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel21a
  - number: 21a.1.b
    text: een der niet tot de huishouding behorende kinderen van een overleden gevolmachtigde agent;
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel21a
  - number: 21a.1.c
    text: de vereffenaar van een in liquidatie getreden gevolmachtigde agent;
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel21a
  - number: 21a.1.d
    text: de curator van een onder curatele gestelde gevolmachtigde agent.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel21a
  - number: 21a.2
    text: |-
      De in het eerste lid bedoelde ontheffing wordt met terugwerkende kracht verleend tot de datum van overlijden,
      aanvang van de vereffening of de ondercuratelestelling. De ontheffing geldt voor ten hoogste een jaar en kan ten
      hoogste tweemaal met een jaar worden verlengd.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel21a
  - number: 21a.3
    text: |-
      Bij de inschrijving in het in [artikel 20][ref1] bedoelde register van degene aan wie een ontheffing als bedoeld in
      het eerste lid is verleend, wordt aangetekend:


      [ref1]: https://wetten.overheid.nl/BWBR0004993#Artikel20
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0004993
        artikel: '20'
        hoofdstuk: III
  - number: 21a.3.a
    text: de grond van de ontheffing;
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel21a
  - number: 21a.3.b
    text: de termijn gedurende welke de ontheffing geldt;
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel21a
  - number: 21a.3.c
    text: de naam van de in het eerste lid bedoelde gevolmachtigde agent.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel21a
  - number: 21b.1
    text: |-
      Iedere in het in [artikel 20][ref1] bedoelde register ingeschreven gevolmachtigde agent deelt wijzigingen in de bij
      de aanvraag tot inschrijving vermelde gegevens onverwijld schriftelijk aan de Raad mee.


      [ref1]: https://wetten.overheid.nl/BWBR0004993#Artikel20
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel21b
    references:
      - id: ref1
        bwb_id: BWBR0004993
        artikel: '20'
        hoofdstuk: III
  - number: 21b.2
    text: Voor zover deze wijzigingen betrekking hebben op gegevens opgenomen in het register brengt de Raad deze hierin aan.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel21b
  - number: 21b.3
    text: |-
      De Raad verstrekt, tegen een door hem te bepalen vergoeding, aan de gevolmachtigde agent op diens verzoek een nieuw
      bewijs van inschrijving.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel21b
  - number: '22.1'
    text: Een volmacht kan door de verzekeraar worden beperkt.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel22
  - number: '22.2'
    text: |-
      Een ondervolmacht kan zowel door de verzekeraar als door diens gevolmachtigde, zolang de volmacht van de
      gevolmachtigde van kracht is, worden beperkt. De ondergevolmachtigde geldt jegens de verzekeraar niet als derde.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel22
  - number: '22.3'
    text: Beperkingen van de volmacht kunnen niet aan derden worden tegengeworpen.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel22
  - number: '23.1'
    text: |-
      In het register, bedoeld in [artikel 20][ref1], wordt doorgehaald de inschrijving van de gevolmachtigde agent:


      [ref1]: https://wetten.overheid.nl/BWBR0004993#Artikel20
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004993
        artikel: '20'
        hoofdstuk: III
  - number: 23.1.a
    text: die daarom verzoekt;
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel23
  - number: 23.1.b
    text: wiens volmachten zijn beëindigd;
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel23
  - number: 23.1.c
    text: die is overleden;
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel23
  - number: 23.1.d
    text: |-
      die in staat van faillissement verkeert of ten aanzien van wie de schuldsaneringsregeling natuurlijke personen van
      toepassing is verklaard;
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel23
  - number: 23.1.e
    text: die in liquidatie is getreden;
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel23
  - number: 23.1.f
    text: die onder curatele is gesteld of van wie de handlichting is ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel23
  - number: '23.2'
    text: 'In het register wordt voorts doorgehaald de inschrijving van de gevolmachtigde agent die:'
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel23
  - number: 23.2.a
    text: |-
      naar het oordeel van de Raad in ernstige mate handelt in strijd met het belang van een of meer verzekeraars,
      verzekeringnemers, verzekerden of gerechtigden op uitkering of anderszins niet meer voldoet aan de in
      [artikel 21, tweede lid, onderdeel ][ref1], gestelde eis;


      [ref1]: https://wetten.overheid.nl/BWBR0004993#Artikel21
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004993
        artikel: '21'
        hoofdstuk: III
  - number: 23.2.b
    text: |-
      de feitelijke leiding over een of meer vestigingen van het gevolmachtigdenbedrijf laat uitoefenen door natuurlijke
      personen die niet voldoen aan de vereisten, genoemd in [artikel 21, vierde lid][ref1], tweede en laatste volzin;


      [ref1]: https://wetten.overheid.nl/BWBR0004993#Artikel21
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004993
        artikel: '21'
        hoofdstuk: III
  - number: 23.2.c
    text: |-
      niet meer in het bezit is van de ontheffing, bedoeld in [artikel 21][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004993#Artikel21a
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004993
        artikel: 21a
        hoofdstuk: III
  - number: 23.2.d
    text: |-
      naar het oordeel van de Raad ernstig in gebreke blijft aan de in [artikel 28, eerste tot en met derde lid][ref1],
      bedoelde verplichtingen te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0004993#Artikel28
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004993
        artikel: '28'
        hoofdstuk: IV
  - number: '23.3'
    text: |-
      De Raad is bevoegd op grond van bijzondere omstandigheden de doorhaling, bedoeld in het tweede lid, onderdelen *a*,
      *b* en *d*, op door hem te stellen voorwaarden, gedurende een door hem te bepalen tijd, op te schorten. De Raad kan
      de termijn van opschorting verlengen, zo hij gegronde redenen daartoe aanwezig acht. Van deze opschorting stelt de
      Raad aantekening in het register onder vermelding van de termijn van opschorting.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel23
  - number: '23.4'
    text: |-
      De werking van het besluit tot doorhaling op grond van het tweede lid, wordt opgeschort totdat de beroepstermijn is
      verstreken of, indien beroep is ingesteld, totdat op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel23
  - number: '23.5'
    text: |-
      De Raad maakt de doorhaling onverwijld bekend aan de gevolmachtigde agent en aan de verzekeraar(s) door toezending
      van een afschrift. Tevens wordt hiervan mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel23
  - number: '24.1'
    text: |-
      De beëindiging van een volmacht gaat, onverminderd de overige vereisten bij de wet gesteld, niet eerder in dan op
      het tijdstip, waarop de verzekeraar of de gevolmachtigde agent aan de Raad per aangetekende brief mededeling heeft
      gedaan van die beëindiging.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel24
  - number: '24.2'
    text: |-
      Door de Raad worden de namen van hen, wier volmacht is geëindigd, voor wat betreft de betrokken volmacht,
      doorgehaald in het register, bedoeld in [artikel 20][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004993#Artikel20
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004993
        artikel: '20'
        hoofdstuk: III
  - number: '24.3'
    text: |-
      In de gevallen, waarin de naam van een gevolmachtigde agent, al dan niet na herroeping van zijn volmacht, in
      het register is doorgehaald, kan de verzekeraar de agent, wiens volmacht is vervallen, ongeacht de bepalingen
      dezer wet, belasten met het beheer en de afwikkeling van de door hem gevormde verzekeringsportefeuille. Aan
      de verzekeraar blijft echter het recht voorbehouden op andere wijze in het beheer en de afwikkeling van die
      portefeuille te voorzien.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel24
  - number: '25'
    text: |-
      De gevolmachtigde agent heeft jegens de verzekeraar recht op een beloning voor de door hem voor rekening van de
      verzekeraar verrichte werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel25
  - number: '27.1'
    text: |-
      De kosten van de Raad in verband met de uitvoering van deze wet worden, tenzij anders is bepaald, voor de helft
      gedragen door tussenpersonen en voor de helft door verzekeraars.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel27
  - number: '27.2'
    text: De Raad stelt jaarlijks voor elke betrokkene diens bijdrage in de kosten vast.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel27
  - number: '28.1'
    text: |-
      Iedere verzekeraar en tussenpersoon verstrekt aan de Raad binnen de door deze laatste te bepalen termijn de
      inlichtingen die deze voor de vervulling van de hem bij of krachtens deze wet opgelegde taak mocht verlangen.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel28
  - number: '28.2'
    text: |-
      Verzekeraars en tussenpersonen zijn verplicht op eerste verzoek van de Raad of van personen, door deze daartoe
      gemachtigd, inzage te verstrekken van alle tot hun administratie behorende boeken, zakelijke bescheiden of andere
      informatiedragers waarvan de Raad de inzage wenselijk oordeelt voor de controle op de juiste naleving van de
      bepalingen van deze wet.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel28
  - number: '28.3'
    text: |-
      Indien de boeken, zakelijke bescheiden of andere informatiedragers van een verzekeraar of tussenpersoon zich buiten
      Nederland bevinden, geschiedt de inzage volgens nader door Onze Ministers te stellen regels.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel28
  - number: '28.4'
    text: |-
      Van gegevens die op grond van deze wet door verzekeraars en tussenpersonen moeten worden verstrekt aan de Raad,
      mag, voor zover deze gegevens betrekking hebben op zaken- en bedrijfsgeheimen, uitsluitend door het secretariaat
      van de Raad kennis worden genomen.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel28
  - number: '29.1'
    text: |-
      De Raad verstrekt aan een belanghebbende op diens verzoek een verklaring waaruit blijkt dat deze in Nederland
      werkzaamheden heeft uitgeoefend als in de richtlijn bedoeld en voorts voldoet aan de in de richtlijn gestelde eisen
      betreffende de duur en de aard van de betrokken werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel29
  - number: '29.2'
    text: |-
      De Raad stelt het bedrag vast dat aan hem moet worden voldaan ter verkrijging van de in het eerste lid bedoelde
      verklaring.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel29
  - number: '31'
    text: |-
      Over een voornemen tot vaststelling, wijziging of intrekking van algemeen verbindende voorschriften op grond van
      deze wet kunnen Onze Ministers het advies van de Raad vragen. In dat geval is de Raad verplicht dit advies uit
      te brengen.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel31
  - number: '32'
    text: |-
      Tegen een op grond van deze wet genomen besluit, met uitzondering van een besluit van Onze Minister van
      Financiën tot afgifte van een bewijs dat de aanvrager voldoet aan de in [artikel 4, eerste lid][ref1], dan wel
      [artikel 21, eerste lid, onderdeel b][ref2] bedoelde vakbekwaamheidseisen, kan een belanghebbende beroep instellen
      bij het College van Beroep voor het bedrijfsleven.


      [ref1]: https://wetten.overheid.nl/BWBR0004993#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004993#Artikel21
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004993
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004993
        artikel: '21'
        hoofdstuk: III
  - number: '33.1'
    text: |-
      Met het voldoen aan de vakbekwaamheidseisen, bedoeld in [artikel 4, eerste lid, onderdeel ][ref1] wordt
      gelijkgesteld het voldoen aan de vakbekwaamheidseisen die golden voor de inschrijving in het register A
      onderscheidenlijk B bedoeld in de Wet Assurantiebemiddeling (*Stb.* 1952, 34).


      [ref1]: https://wetten.overheid.nl/BWBR0004993#Artikel4
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0004993
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
  - number: '33.2'
    text: |-
      De Raad brengt de namen van de tussenpersonen die op het tijdstip van inwerkingtreding van deze wet zijn
      ingeschreven in de registers A en B als bedoeld in de Wet Assurantiebemiddeling over naar het in [artikel 3][ref1]
      bedoelde register.


      [ref1]: https://wetten.overheid.nl/BWBR0004993#Artikel3
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0004993
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '33.3'
    text: |-
      Op een verzoek tot inschrijving in een der registers A en B, gedaan voor het tijdstip van inwerkingtreding van deze
      wet, beslist de Raad met toepassing van de Wet Assurantiebemiddeling. Degene op wiens verzoek gunstig is beslist,
      wordt ingeschreven in het in [artikel 3][ref1] bedoelde register.


      [ref1]: https://wetten.overheid.nl/BWBR0004993#Artikel3
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0004993
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '34.1'
    text: |-
      De Raad houdt het register C, bedoeld in artikel 4, eerste lid, van de Wet Assurantiebemiddeling, tot 4 jaren
      na het tijdstip van inwerkingtreding van deze wet ten behoeve van de tussenpersonen die op dit tijdstip in het
      register zijn ingeschreven, alsmede ten behoeve van degenen die op voornoemd tijdstip zijn ingeschreven in het
      register D en nadien op grond van het bepaalde in het vierde lid recht hebben op inschrijving in het register
      C. Ten aanzien van de in de registers C en D ingeschreven tussenpersonen zijn de bepalingen van deze wet van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel34
  - number: '34.2'
    text: |-
      Op een verzoek tot inschrijving in het register C, gedaan voor het tijdstip van inwerkingtreding van deze wet,
      beslist de Raad met toepassing van de Wet Assurantiebemiddeling.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel34
  - number: '34.3'
    text: |-
      De Raad houdt het register D, bedoeld in artikel 4, eerste lid, van de Wet Assurantiebemiddeling, tot 15 maanden
      na het tijdstip van inwerkingtreding van deze wet ten behoeve van de tussenpersonen die op genoemd tijdstip zijn
      ingeschreven in het register D, dan wel nadien daarin worden ingeschreven op grond van een voor dit tijdstip bij de
      Raad ingediend verzoek.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel34
  - number: '34.4'
    text: |-
      De Raad brengt de namen van de in het derde lid bedoelde tussenpersonen over naar het in het eerste lid
      bedoelde register C zodra de betrokkenen voldoen aan de eisen ter waarborging van een vakkundige uitoefening
      van het assurantiebemiddelingsbedrijf, bedoeld in artikel 10, eerste lid, tweede en laatste volzin, van de Wet
      Assurantiebemiddeling.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel34
  - number: '34.5'
    text: |-
      Ten aanzien van de in het derde lid bedoelde tussenpersonen blijven, zolang zij in het register D zijn
      ingeschreven, de artikelen 8, vierde lid, en 13, tweede en derde lid, van de Wet Assurantiebemiddeling van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel34
  - number: '34.6'
    text: |-
      De Raad haalt de inschrijvingen in het register C door van de tussenpersonen die 15 maanden na het tijdstip van
      inwerkingtreding van deze wet niet hebben voldaan aan de eisen ter waarborging van een vakkundige uitoefening
      van het assurantiebemiddelingsbedrijf, bedoeld in artikel 10, eerste lid, tweede en laatste volzin, van de Wet
      Assurantiebemiddeling. [Artikel 8, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004993#Artikel8
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0004993
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
  - number: '34.7'
    text: |-
      De Raad brengt de namen van de tussenpersonen die op het tijdstip van inwerkingtreding van deze wet zijn
      ingeschreven in het register C, dan wel nadien ingevolge het vierde lid daarin worden ingeschreven over naar het in
      [artikel 3][ref1] bedoelde register zodra de betrokkenen voldoen aan de in [artikel 4, eerste lid][ref2], bedoelde
      vakbekwaamheidseisen.


      [ref1]: https://wetten.overheid.nl/BWBR0004993#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004993#Artikel4
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0004993
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004993
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
  - number: '35'
    text: |-
      Een dispensatie als bedoeld in artikel 15, tweede lid, van de Wet Assurantiebemiddeling, blijft tot twaalf maanden
      na het tijdstip van inwerkingtreding van deze wet van kracht.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel35
  - number: '36'
    text: |-
      De Raad geeft op een verzoek, gedaan binnen 4 jaren na het tijdstip van inwerkingtreding van deze wet, een
      verklaring af dat aan de vakbekwaamheidseisen van [artikel 4, eerste lid, onderdeel ][ref1] is voldaan aan degene
      die op het tijdstip waarop ingevolge [artikel 34, eerste lid][ref2], het register C wordt opgeheven:


      [ref1]: https://wetten.overheid.nl/BWBR0004993#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004993#Artikel34
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0004993
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004993
        artikel: '34'
        hoofdstuk: VII
  - number: 36.a
    text: ten minste 50 jaren oud is;
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel36
  - number: 36.b
    text: |-
      onmiddellijk voorafgaand aan het tijdstip van opheffing van het register C ten minste 10 jaren onafgebroken in
      het register C ingeschreven is geweest of de feitelijke leiding in de zin van artikel 5, vijfde lid, van de Wet
      Assurantiebemiddeling heeft uitgeoefend;
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel36
  - number: 36.c
    text: |-
      gedurende de onder *b* genoemde termijn het assurantiebemiddelingsbedrijf als hoofdactiviteit heeft uitgeoefend
      of als feitelijk leider heeft gefungeerd bij een rechtsvorm die als hoofdactiviteit de assurantiebemiddeling
      uitoefent;
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel36
  - number: 36.d
    text: |-
      ten minste 10 jaren voldoet aan de eisen ter waarborging van een vakkundige uitoefening van het
      assurantiebemiddelingsbedrijf, bedoeld in artikel 10, eerste lid, van de Wet Assurantiebemiddeling; en
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel36
  - number: 36.e
    text: 'regelmatig aangelegenheden heeft behandeld betreffende:'
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel36
  - number: 36.e.1
    text: |-
      levensverzekeringen, anders dan verzekeringen tot het doen van uitkeringen in natura in verband met het overlijden
      van de mens;
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel36
  - number: 36.e.2
    text: brandverzekeringen en verzekeringen ter zake van bedrijfsschade; en
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel36
  - number: 36.e.3
    text: variaverzekeringen.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel36
  - number: '41'
    text: De Wet Assurantiebemiddeling (*Stb.* 1952, 34) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel41
  - number: '42'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel42
  - number: '43'
    text: Deze wet kan worden aangehaald als Wet assurantiebemiddelingsbedrijf.
    url: https://wetten.overheid.nl/BWBR0004993/2002-04-01#Artikel43
