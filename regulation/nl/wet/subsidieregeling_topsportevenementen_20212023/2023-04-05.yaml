---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: subsidieregeling_topsportevenementen_20212023
regulatory_layer: WET
publication_date: '2021-01-18'
valid_from: '2023-04-05'
bwb_id: BWBR0044720
url: https://wetten.overheid.nl/BWBR0044720/2023-04-05
preamble:
  text: |-
    Gelet op de artikelen 3 en 5 van de Kaderwet VWS-subsidies en artikel 1.3 van de Kaderregeling subsidies OCW, SZW
    en VWS;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *topsportevenement:* samenhangend geheel van wedstrijden in een bepaalde
      periode in een tak of takken van sport die kan of kunnen bijdragen aan het nationale topsportbeleid;
        - *evenementenorganisator:* privaatrechtelijke rechtspersoon die verantwoordelijk is voor het organiseren van
      topsportevenementen;
        - *nationale sportbond:* een landelijke sportorganisatie die: a. de belangen van de aangesloten sporters dan wel
      sportverenigingen behartigt; b. zich verder onder andere bezighoudt met het opleiden van trainers en coaches,
      talentontwikkeling, het organiseren van de nationale competities en wedstrijden, deelname aan internationale
      wedstrijden, en – voor zover van toepassing – uitzendingen naar multisportevenementen; en c. is erkend als
      vertegenwoordiger van zijn tak van sport en in principe is aangesloten bij NOC*NSF en de Internationale Federatie
      van de betreffende tak van sport.
        - *minister:* Minister voor Medische Zorg;
        - *dienst van algemeen economisch belang:* dienst als bedoeld in artikel 106, tweede lid, van het Verdrag
      betreffende de werking van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel1
  - number: '2.1'
    text: |-
      De minister kan aan een nationale sportbond of een evenementenorganisator subsidie verstrekken voor de organisatie
      van een topsportevenement als bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel2
  - number: '2.2'
    text: De minister verstrekt subsidie voor ten hoogste één topsportevenement per tak van sport, eens per drie jaar.
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel2
  - number: '2.3'
    text: |-
      In afwijking van het tweede lid kan de minister vaker dan eens per drie jaar subsidie verstrekken in geval van een
      Olympisch dan wel een Paralympisch kwalificatietoernooi waarbij deelnemers zich direct kunnen kwalificeren voor
      Olympische Spelen.
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel2
  - number: '2.4'
    text: 'Een topsportevenement dat voor subsidie in aanmerking komt:'
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel2
  - number: 2.4.a
    text: is internationaal van aard;
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel2
  - number: 2.4.b
    text: wordt hoofdzakelijk in Nederland georganiseerd;
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel2
  - number: 2.4.c
    text: wordt niet jaarlijks in Nederland georganiseerd;
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel2
  - number: 2.4.d
    text: 'is gericht op:'
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel2
  - number: 2.4.d.1°
    text: |-
      talenten: sporters met of zonder beperking die behoren tot de oudste leeftijdscategorie waarvoor een internationaal
      jeugd topsportevenement wordt georganiseerd, zoals een Europees Kampioenschap of Wereld Kampioenschap; of
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel2
  - number: 2.4.d.2°
    text: |-
      senioren: sporters met of zonder beperking die op dat moment Nederland op Europees of mondiaal topniveau
      vertegenwoordigen; en
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel2
  - number: 2.4.e
    text: 'is een topsportevenement:'
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel2
  - number: 2.4.e.1°
    text: |-
      dat een tak van sport betreft opgenomen in de lijst topsport- en internationale wedstrijdsportdisciplines
      gehanteerd door NOC*NSF; of
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel2
  - number: 2.4.e.2°
    text: dat bijdraagt aan de ontwikkeling van een nieuwe tak van sport of nieuwe vormen van een bestaande tak van sport.
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel2
  - number: '2.5'
    text: |-
      De activiteit, bedoeld in het eerste lid, kan worden aangewezen als dienst van algemeen economisch belang als
      bedoeld in artikel 106, tweede lid, van het Verdrag betreffende de werking van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel2
  - number: '3.1'
    text: 'Een topsportevenement:'
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel3
  - number: 3.1.a
    text: 'heeft maatschappelijk meerwaarde, die is gelegen in:'
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel3
  - number: 3.1.a.1°
    text: |-
      het bieden van optimale omstandigheden voor deelnemers zodat zij kunnen inspireren door eerlijk, integer en
      zichtbaar te presteren;
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel3
  - number: 3.1.a.2°
    text: het efficiënt en effectief organiseren;
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel3
  - number: 3.1.a.3°
    text: het vergroten van het bereik voor diverse doelgroepen;
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel3
  - number: 3.1.a.4°
    text: zo duurzaam en klimaatneutraal mogelijk organiseren;
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel3
  - number: 3.1.a.5°
    text: inclusief en toegankelijk zijn; en
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel3
  - number: 3.1.a.6°
    text: het aandacht hebben voor de gezondheid en veiligheid van deelnemers, medewerkers en toeschouwers.
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel3
  - number: 3.1.b
    text: |-
      wordt georganiseerd in afstemming en samenhang met in ieder geval de desbetreffende nationale sportbond en
      gemeenten of provincies.
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel3
  - number: '3.2'
    text: 'De subsidieverlening wordt geweigerd indien het gaat om:'
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel3
  - number: 3.2.a
    text: een topsportevenement waarvan bekend is dat het de eerste uit een jaarlijkse reeks is;
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel3
  - number: 3.2.b
    text: |-
      een topsportevenement waarvan de eigendomsrechten niet liggen bij een internationale sportfederatie die is erkend
      door het Internationaal Olympisch Comité, het Internationaal Paralympisch Comité of de Global Association of
      International Sports Federations; of
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel3
  - number: 3.2.c
    text: een topsportevenement waarop geen Nederlands team of Nederlandse individuele deelnemers in actie komen.
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel3
  - number: '3.3'
    text: |-
      Indien een activiteit is aangewezen als dienst van algemeen economisch belang ingevolge
      [artikel 2, vijfde lid][ref1], wordt subsidie uitsluitend verstrekt als de aanvrager met de Staat een overeenkomst
      sluit waarbij de Staat de aanvrager belast met en de aanvrager zich verplicht tot het verrichten van de dienst van
      algemeen economisch belang.


      [ref1]: https://wetten.overheid.nl/BWBR0044720#Artikel2
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0044720
        artikel: '2'
  - number: '4.1'
    text: Voor subsidieverlening op grond van deze regeling is jaarlijks een bedrag van € 8 miljoen beschikbaar.
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel4
  - number: '4.2'
    text: |-
      In afwijking van het eerste lid is voor subsidieverlening op grond van deze regeling in 2023 een bedrag van
      € 4 miljoen beschikbaar.
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel4
  - number: '4.3'
    text: |-
      De minister verdeelt het ingevolge het subsidieplafond beschikbare bedrag op volgorde
      van binnenkomst van de aanvragen, met dien verstande dat wanneer de aanvrager krachtens
      [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad de aanvraag aan te vullen, de dag
      waarop de aanvraag is aangevuld, met betrekking tot de verdeling, als datum van ontvangst geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '5'
    text: 'De volgende kosten komen in ieder geval niet voor subsidie in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel5
  - number: 5.a
    text: start- en prijzengeld;
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel5
  - number: 5.b
    text: kosten voor sponsoring; en
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel5
  - number: 5.c
    text: kosten voor hospitality.
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel5
  - number: '6.1'
    text: |-
      De subsidie bedraagt ten hoogste 25% van de totale subsidiabele kosten voor de organisatie van het
      topsportevenement, tot ten hoogste € 2,5 miljoen.
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel6
  - number: '6.2'
    text: |-
      In afwijking van het eerste lid bedraagt de subsidie ten hoogste 50% van de totale subsidiabele kosten, voor de
      organisatie van het topsportevenement, tot ten hoogste € 2,5 miljoen, als het topsportevenement is gericht op
      deelnemers met een beperking of op talenten, bedoeld in [artikel 2, vierde lid, onder d, subonderdeel 1°][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044720#Artikel2
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0044720
        artikel: '2'
  - number: '6.3'
    text: |-
      In afwijking van het eerste lid bedraagt de subsidie ten hoogste 50% van de totale subsidiabele kosten, voor de
      organisatie van het topsportevenement, tot ten hoogste € 2,5 miljoen, als sprake is van maatregelen en tijdelijke
      aanpassingen van accommodaties als gevolg van overheidsmaatregelen ter bestrijding van COVID-19.
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel6
  - number: '7'
    text: Een aanvraag wordt maximaal zesendertig maanden vóór de aanvang van het topsportevenement ontvangen.
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel7
  - number: '8.1'
    text: Voor de aanvraag wordt een door de minister vastgesteld formulier gebruikt.
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel8
  - number: '8.2'
    text: |-
      In aanvulling op [artikel 3.3][ref1] en [3.4 van de Kaderregeling subsidies OCW, SZW en VWS][ref2] gaat de
      aanvrager in een vragenlijst nader in op:


      [ref1]: https://wetten.overheid.nl/BWBR0037603#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037603#Artikel3
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0037603
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0037603
        artikel: '3'
  - number: 8.2.a
    text: hoe het evenement past in het nationale topsportbeleid van het Ministerie van VWS of de nationale sportbond;
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel8
  - number: 8.2.b
    text: |-
      de maatschappelijke meerwaarde van het evenement, waarbij wordt ingegaan op de onderdelen, bedoeld in
      [artikel 3, eerste lid, onder a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0044720#Artikel3
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0044720
        artikel: '3'
  - number: 8.2.c
    text: |-
      de meerwaarde van het aangevraagde subsidiebedrag voor het evenement; en indien van toepassing, beoogde maatregelen
      en tijdelijke aanpassingen van accommodaties, bedoeld in [artikel 6, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044720#Artikel6
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0044720
        artikel: '6'
  - number: '8.3'
    text: |-
      In aanvulling op [artikel 3.5 van de Kaderregeling subsidies OCW, SZW en VWS][ref1] gaat de begroting tevens
      vergezeld van:


      [ref1]: https://wetten.overheid.nl/BWBR0037603#Artikel3
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0037603
        artikel: '3'
  - number: 8.3.a
    text: 'een businesscase, bestaande uit:'
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel8
  - number: 8.3.a.1°
    text: |-
      een risicoanalyse en een gedegen haalbaarheidsonderzoek van een onafhankelijke instantie, als het aangevraagde
      bedrag meer dan € 1.000.000 bedraagt; of
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel8
  - number: 8.3.a.2°
    text: |-
      een verklaring van een onafhankelijk persoon of instantie omtrent de haalbaarheid van het evenement van een
      onafhankelijke instantie, als het aangevraagde bedrag minder dan € 1.000.000 bedraagt;
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel8
  - number: 8.3.b
    text: een overzicht van kosten van eerdere edities van het topsportevenement, indien beschikbaar;
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel8
  - number: 8.3.c
    text: |-
      een steunverklaring van de bij het evenement betrokken partijen, waaronder de gemeente of provincie en indien van
      toepassing de nationale sportbond; en
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel8
  - number: 8.3.d
    text: |-
      indien subsidie wordt verstrekt overeenkomstig [artikel 2, vijfde lid][ref1], overlegt de aanvrager, naar
      aanleiding van de beoordeling van de aanvraag, op verzoek van de minister een door de aanvrager ondertekende
      overeenkomst als bedoeld in [artikel 3, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0044720#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0044720#Artikel3
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0044720
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0044720
        artikel: '3'
  - number: '9'
    text: |-
      De subsidieontvanger is bij de organisatie van een topsportevenement waarvoor subsidie wordt verleend
      verantwoordelijk voor:
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel9
  - number: 9.a
    text: |-
      het naleven van de World Anti Doping Code en het Nationaal Doping Reglement en het mogelijk maken van het
      houden van dopingcontroles, waaronder in ieder geval het realiseren van de toegang voor dopingcontroleurs, een
      dopingcontrolestation en voldoende chaperonnes voor toezicht op de deelnemers;
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel9
  - number: 9.b
    text: adequate, acute sportmedische zorg voor deelnemers, medewerkers en toeschouwers;
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel9
  - number: 9.c
    text: |-
      de toegang van de accommodaties van het topsportevenement voor mensen met een lichamelijke of visuele beperking,
      doven en slechthorenden.
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel9
  - number: '11'
    text: |-
      De minister kan een of meer bepalingen van deze regeling buiten toepassing laten of daarvan afwijken voor
      zover toepassing gelet op het belang dat de desbetreffende bepaling beoogt te beschermen, zal leiden tot een
      onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel11
  - number: '12.1'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel12
  - number: '12.2'
    text: Deze regeling vervalt met ingang van 1 januari 2024.
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel12
  - number: '13'
    text: 'Deze regeling wordt aangehaald als: Subsidieregeling topsportevenementen 2021–2023.'
    url: https://wetten.overheid.nl/BWBR0044720/2023-04-05#Artikel13
