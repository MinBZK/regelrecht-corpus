$id: subsidieregeling_indemniteit_bruiklenen_2008
regulatory_layer: WET
publication_date: '2015-11-03'
valid_from: '2010-07-01'
bwb_id: BWBR0024244
url: https://wetten.overheid.nl/BWBR0024244/2010-07-01
preamble:
  text: |-
    Gelet op de artikelen 2, 5, 5b, eerste en tweede lid, 7, derde en zesde lid, 8, 9, 10, 32, eerste lid, 33, 48 en 49
    Bekostigingsbesluit Cultuuruitingen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0024244/2010-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0024244/2010-07-01#Artikel1
  - number: 1.a
    text: 'Minister: Minister van Onderwijs, Cultuur en Wetenschap;'
    url: https://wetten.overheid.nl/BWBR0024244/2010-07-01#Artikel1
  - number: 1.b
    text: |-
      instelling: openbaar toegankelijke instelling die gespecialiseerd is in het beheren van museale collecties, het
      organiseren van tentoonstellingen, of het tentoonstellen van langdurig in bruikleen gegeven voorwerpen;
    url: https://wetten.overheid.nl/BWBR0024244/2010-07-01#Artikel1
  - number: 1.c
    text: |-
      voorwerp: voorwerp van cultuurhistorische betekenis met de daarbij behorende verpakking, lijst, raam, kader, sokkel
      en dergelijke, afkomstig uit een buitenlandse collectie of uit een privécollectie;
    url: https://wetten.overheid.nl/BWBR0024244/2010-07-01#Artikel1
  - number: 1.d
    text: |-
      tentoonstelling: tijdelijke tentoonstelling in Nederland, georganiseerd door een instelling, die naar het oordeel
      van de Minister van uitzonderlijk belang is door een:
    url: https://wetten.overheid.nl/BWBR0024244/2010-07-01#Artikel1
  - number: 1.d.1°
    text: belangrijke visie te bieden op periodes, kwesties, personen of producten van cultuurhistorische betekenis;
    url: https://wetten.overheid.nl/BWBR0024244/2010-07-01#Artikel1
  - number: 1.d.2°
    text: overtuigende waardering op te willen wekken voor de onder 1° bedoelde zaken of personen; en
    url: https://wetten.overheid.nl/BWBR0024244/2010-07-01#Artikel1
  - number: 1.d.3°
    text: |-
      omvangrijke compilatie te bieden van belangrijke objecten in een samenhang die in het algemeen niet in Nederland te
      zien is;
    url: https://wetten.overheid.nl/BWBR0024244/2010-07-01#Artikel1
  - number: 1.e
    text: |-
      langdurige bruikleen: gedurende tenminste een jaar en ten hoogste vijf jaar in bruikleen geven van een voorwerp aan
      een instelling dat naar het oordeel van de Minister van uitzonderlijk belang is;
    url: https://wetten.overheid.nl/BWBR0024244/2010-07-01#Artikel1
  - number: 1.f
    text: |-
      indemniteitsverklaring: beschikking waarbij een voorwaardelijke aanspraak op financiële middelen als bedoeld in
      [artikel 2][ref1] wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0024244#Artikel2
    url: https://wetten.overheid.nl/BWBR0024244/2010-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0024244
        artikel: '2'
        paragraaf: '2'
  - number: 1a
    text: |-
      Deze regeling berust op [artikel 4 van het Besluit op het specifiek cultuurbeleid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027600#Artikel4
    url: https://wetten.overheid.nl/BWBR0024244/2010-07-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0027600
        artikel: '4'
  - number: '2.1'
    text: |-
      De Minister kan mede namens de Minister van Financiën aan een instelling ten behoeve van een tentoonstelling of van
      een langdurige bruikleen een aanspraak op financiële middelen verlenen onder de opschortende voorwaarde van verlies
      van of schade aan de door derden in bruikleen afgestane voorwerpen.
    url: https://wetten.overheid.nl/BWBR0024244/2010-07-01#Artikel2
  - number: '2.2'
    text: 'De aanspraak wordt verleend in geval van:'
    url: https://wetten.overheid.nl/BWBR0024244/2010-07-01#Artikel2
  - number: 2.2.a
    text: 'een tentoonstelling: voor zover de exploitatie van die tentoonstelling een tekort vertoond; of'
    url: https://wetten.overheid.nl/BWBR0024244/2010-07-01#Artikel2
  - number: 2.2.b
    text: 'een langdurige bruikleen: voor zover een door die instelling verschuldigde eigen bijdrage wordt overschreden.'
    url: https://wetten.overheid.nl/BWBR0024244/2010-07-01#Artikel2
  - number: '2.3'
    text: |-
      Het totaal van de aanspraken op financiële middelen in een begrotingsjaar op grond van indemniteitsverklaringen
      gaat op enig moment het bedrag van € 300.000.000 niet te boven.
    url: https://wetten.overheid.nl/BWBR0024244/2010-07-01#Artikel2
  - number: '2.4'
    text: |-
      Van het bedrag, bedoeld in het derde lid, kan in een begrotingsjaar ten hoogste op enig moment tien procent worden
      bestemd voor langdurige bruikleen.
    url: https://wetten.overheid.nl/BWBR0024244/2010-07-01#Artikel2
  - number: '3.1'
    text: |-
      Een indemniteitsverklaring wordt slechts verleend indien een instelling naar het oordeel van de Minister,
      mede namens de Minister van Financiën, heeft aangetoond dat die indemniteitsverklaring een besparing op de
      verzekeringskosten van de desbetreffende tentoonstelling of van de desbetreffende langdurige bruikleen ten gevolge
      heeft.
    url: https://wetten.overheid.nl/BWBR0024244/2010-07-01#Artikel3
  - number: '3.2'
    text: |-
      Een indemniteitsverklaring wordt voorts slechts verleend indien er naar het oordeel van de Minister, mede namens de
      Minister van Financiën, een acceptabele verhouding aanwezig is tussen enerzijds het belang van de tentoonstelling
      of van de langdurige bruikleen en de besparing als, bedoeld in het eerste lid, en anderzijds het door de staat te
      aanvaarden risico.
    url: https://wetten.overheid.nl/BWBR0024244/2010-07-01#Artikel3
  - number: '3.3'
    text: |-
      De voorwaarden die gelden voor de verzekering in verband waarmee de indemniteitsverklaring wordt verleend, zijn van
      overeenkomstige toepassing op de indemniteitsverklaring.
    url: https://wetten.overheid.nl/BWBR0024244/2010-07-01#Artikel3
  - number: '4.1'
    text: |-
      De aanvraag voor subsidie wordt uiterlijk dertien weken voor aanvang van de activiteiten
      ingediend en gaat vergezeld van ten minste een verzekeringsofferte. Tevens is
      [artikel 5.3, eerste tot en met vierde lid, van de Regeling op het specifiek cultuurbeleid][ref1] van
      overeenkomstige toepassing op de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel5
    url: https://wetten.overheid.nl/BWBR0024244/2010-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0027597
        artikel: '5'
  - number: '4.2'
    text: |-
      Een aanvraag die verschillende voorwerpen betreft, gaat tevens vergezeld van een lijst van in bruikleen te
      ontvangen voorwerpen.
    url: https://wetten.overheid.nl/BWBR0024244/2010-07-01#Artikel4
  - number: '4.3'
    text: In geval van een aanvraag voor een tentoonstelling wordt tevens een tentoonstellingsplan overgelegd.
    url: https://wetten.overheid.nl/BWBR0024244/2010-07-01#Artikel4
  - number: '4.4'
    text: |-
      Bij de beoordeling van een aanvraag en de voorbereiding van de verlening van een indemniteitsverklaring kan de
      Minister de aanvrager verzoeken om inlichtingen te verschaffen over de beveiliging en veiligheid van de instelling
      en de voorwerpen waarop de aanvraag betrekking heeft, en om hem de veiligheidsvoorzieningen op de locatie te tonen,
      een en ander als bedoeld in de bijlage bij deze regeling.
    url: https://wetten.overheid.nl/BWBR0024244/2010-07-01#Artikel4
  - number: '5.1'
    text: Op de aanvragen wordt beslist in de volgorde waarin zij door de Minister zijn ontvangen.
    url: https://wetten.overheid.nl/BWBR0024244/2010-07-01#Artikel5
  - number: '5.2'
    text: De minister beslist binnen dertien weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0024244/2010-07-01#Artikel5
  - number: '6'
    text: |-
      Een indemniteitsverklaring vervalt, indien de instelling waaraan die verklaring is verleend , niet binnen vier
      maanden na het einde van de desbetreffende tentoonstelling of langdurige bruikleen aan de Minister heeft bericht,
      dat zich naar haar oordeel verlies van of schade aan voorwerpen, waarop de indemniteitsverklaring betrekking heeft,
      heeft voorgedaan.
    url: https://wetten.overheid.nl/BWBR0024244/2010-07-01#Artikel6
  - number: '7.1'
    text: |-
      De verplichtingen, bedoeld in [artikel 5.7, eerste lid, van de Regeling op het specifiek cultuurbeleid][ref1], zijn
      van overeenkomstige toepassing op een ontvanger van subsidie krachtens deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel5
    url: https://wetten.overheid.nl/BWBR0024244/2010-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0027597
        artikel: '5'
  - number: '7.2'
    text: |-
      Onverminderd de verplichtingen, bedoeld in het eerste lid, zijn voor de instelling waaraan een
      indemniteitsverklaring wordt verleend, aan die verlening de verplichtingen verbonden die met het oog op veiligheid
      van tentoon te stellen voorwerpen zijn opgenomen in de bijlage die bij deze regeling hoort.
    url: https://wetten.overheid.nl/BWBR0024244/2010-07-01#Artikel7
  - number: '8'
    text: |-
      Indien zich in de periode waarvoor een indemniteitsverklaring geldt, verlies van of schade aan voorwerpen waarop
      de indemniteitsverklaring betrekking heeft, voordoet, zendt de subsidieontvanger aan de Minister naast een
      activiteitenverslag, waarop [artikel 2.25 van de Regeling op het specifiek cultuurbeleid][ref1] van overeenkomstige
      toepassing is, een overzicht met de berekening van de geleden schade.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel2
    url: https://wetten.overheid.nl/BWBR0024244/2010-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0027597
        artikel: '2'
  - number: '9'
    text: |-
      De [Subsidieregeling indemniteit bruiklenen 2005][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0017308
    url: https://wetten.overheid.nl/BWBR0024244/2010-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0017308
  - number: '10.1'
    text: |-
      Indemniteitsverklaringen verleend op basis van de [Subsidieregeling indemniteit bruiklenen 2005][ref1], die niet
      vervallen zijn, gelden als indemniteitsverklaringen als bedoeld in [artikel 2][ref2] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0017308
      [ref2]: https://wetten.overheid.nl/BWBR0024244#Artikel2
    url: https://wetten.overheid.nl/BWBR0024244/2010-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0017308
      - id: ref2
        bwb_id: BWBR0024244
        artikel: '2'
        paragraaf: '2'
  - number: '10.2'
    text: |-
      een aanvraag voor een indemniteitsverklaring gedaan op basis van de
      [Subsidieregeling indemniteit bruiklenen 2005][ref1], waarop nog niet is beslist, wordt behandeld als een aanvraag
      op basis van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0017308
    url: https://wetten.overheid.nl/BWBR0024244/2010-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0017308
  - number: '10.3'
    text: |-
      [Artikel 2, vijfde lid][ref1], vervalt met ingang van 1 juni 2010.


      [ref1]: https://wetten.overheid.nl/BWBR0024244#Artikel2
    url: https://wetten.overheid.nl/BWBR0024244/2010-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0024244
        artikel: '2'
        paragraaf: '2'
  - number: '11'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na dagtekening van de Staatscourant waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0024244/2010-07-01#Artikel11
  - number: '12'
    text: 'Deze regeling wordt aangehaald als: Subsidieregeling indemniteit bruiklenen 2008.'
    url: https://wetten.overheid.nl/BWBR0024244/2010-07-01#Artikel12
