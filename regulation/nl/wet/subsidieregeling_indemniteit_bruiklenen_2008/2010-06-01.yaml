    Bekostigingsbesluit Cultuuruitingen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0024244/2010-06-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. Minister: Minister van Onderwijs, Cultuur en Wetenschap;

      b. besluit: [Bekostigingsbesluit cultuuruitingen][ref1];

      c. instelling: openbaar toegankelijke instelling die gespecialiseerd is in het beheren van museale collecties, het
      organiseren van tentoonstellingen, of het tentoonstellen van langdurig in bruikleen gegeven voorwerpen;

      d. voorwerp: voorwerp van cultuurhistorische betekenis met de daarbij behorende verpakking, lijst, raam, kader,
      sokkel en dergelijke, afkomstig uit een buitenlandse collectie of uit een privécollectie;

      e. tentoonstelling: tijdelijke tentoonstelling in Nederland, georganiseerd door een instelling, die naar het
      oordeel van de Minister van uitzonderlijk belang is door een:

      1°. belangrijke visie te bieden op periodes, kwesties, personen of producten van cultuurhistorische betekenis;

      2°. overtuigende waardering op te willen wekken voor de onder 1° bedoelde zaken of personen; en

      3°. omvangrijke compilatie te bieden van belangrijke objecten in een samenhang die in het algemeen niet in
      Nederland te zien is;

      f. langdurige bruikleen: gedurende tenminste een jaar en ten hoogste vijf jaar in bruikleen geven van een voorwerp
      aan een instelling dat naar het oordeel van de Minister van uitzonderlijk belang is;

      g. indemniteitsverklaring: beschikking waarbij een voorwaardelijke aanspraak op financiële middelen als bedoeld in
      [artikel 2][ref2] wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006759
      [ref2]: https://wetten.overheid.nl/BWBR0024244#Artikel2
    url: https://wetten.overheid.nl/BWBR0024244/2010-06-01#Artikel1
