        artikel: '2'
        paragraaf: '2'
  - number: '2'
    text: |-
      1 De Minister kan mede namens de Minister van Financiën aan een instelling ten behoeve van een tentoonstelling of
      van een langdurige bruikleen een aanspraak op financiële middelen verlenen onder de opschortende voorwaarde van
      verlies van of schade aan de door derden in bruikleen afgestane voorwerpen.

      2 De aanspraak wordt verleend in geval van:

      a. een tentoonstelling: voor zover de exploitatie van die tentoonstelling een tekort vertoond; of

      b. een langdurige bruikleen: voor zover een door die instelling verschuldigde eigen bijdrage wordt overschreden.

      3 Het totaal van de aanspraken op financiële middelen in een begrotingsjaar op grond van indemniteitsverklaringen
      gaat op enig moment het bedrag van € 300.000.000 niet te boven.

      4 Van het bedrag, bedoeld in het derde lid, kan in een begrotingsjaar ten hoogste op enig moment tien procent
      worden bestemd voor langdurige bruikleen.
    url: https://wetten.overheid.nl/BWBR0024244/2010-06-01#Artikel2
  - number: '3'
    text: |-
      1 Een indemniteitsverklaring wordt slechts verleend indien een instelling naar het oordeel van de Minister,
      mede namens de Minister van Financiën, heeft aangetoond dat die indemniteitsverklaring een besparing op de
      verzekeringskosten van de desbetreffende tentoonstelling of van de desbetreffende langdurige bruikleen ten gevolge
      heeft.

      2 Een indemniteitsverklaring wordt voorts slechts verleend indien er naar het oordeel van de Minister, mede
      namens de Minister van Financiën, een acceptabele verhouding aanwezig is tussen enerzijds het belang van de
      tentoonstelling of van de langdurige bruikleen en de besparing als, bedoeld in het eerste lid, en anderzijds het
      door de staat te aanvaarden risico.

      3 De voorwaarden die gelden voor de verzekering in verband waarmee de indemniteitsverklaring wordt verleend, zijn
      van overeenkomstige toepassing op de indemniteitsverklaring.
    url: https://wetten.overheid.nl/BWBR0024244/2010-06-01#Artikel3
  - number: '4'
    text: |-
      1 De aanvraag voor een indemniteitsverklaring gaat, onverminderd [artikel 7, derde en zesde lid][ref1],
      [artikel 8, eerste, tweede en vierde lid][ref2], en [artikel 9 van het besluit][ref3], vergezeld van ten minste
      één verzekeringsofferte.

      2 Een aanvraag die verschillende voorwerpen betreft, gaat tevens vergezeld van een lijst van in bruikleen te
      ontvangen voorwerpen.

      3 In geval van een aanvraag voor een tentoonstelling wordt tevens een tentoonstellingsplan overgelegd.

      4 Bij de beoordeling van een aanvraag en de voorbereiding van de verlening van een indemniteitsverklaring kan de
      Minister de aanvrager verzoeken om inlichtingen te verschaffen over de beveiliging en veiligheid van de instelling
      en de voorwerpen waarop de aanvraag betrekking heeft, en om hem de veiligheidsvoorzieningen op de locatie te tonen,
      een en ander als bedoeld in de bijlage bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0006759#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006759#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0006759#Artikel9
    url: https://wetten.overheid.nl/BWBR0024244/2010-06-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006759
        artikel: '7'
      - id: ref2
