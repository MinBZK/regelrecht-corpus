  - number: '10'
    text: |-
      1 Indemniteitsverklaringen verleend op basis van de [Subsidieregeling indemniteit bruiklenen 2005][ref1], die niet
      vervallen zijn, gelden als indemniteitsverklaringen als bedoeld in [artikel 2][ref2] van deze regeling.

      2 een aanvraag voor een indemniteitsverklaring gedaan op basis van de
      [Subsidieregeling indemniteit bruiklenen 2005][ref3], waarop nog niet is beslist, wordt behandeld als een aanvraag
      op basis van deze regeling.

      3 [Artikel 2, vijfde lid][ref4], vervalt met ingang van 1 juni 2010.


