        artikel: '9'
  - number: '5'
    text: Op de aanvragen wordt beslist in de volgorde waarin zij door de Minister zijn ontvangen.
    url: https://wetten.overheid.nl/BWBR0024244/2010-06-01#Artikel5
  - number: '6'
    text: |-
      Een indemniteitsverklaring vervalt, indien de instelling waaraan die verklaring is verleend , niet binnen vier
      maanden na het einde van de desbetreffende tentoonstelling of langdurige bruikleen aan de Minister heeft bericht,
      dat zich naar haar oordeel verlies van of schade aan voorwerpen, waarop de indemniteitsverklaring betrekking heeft,
      heeft voorgedaan.
    url: https://wetten.overheid.nl/BWBR0024244/2010-06-01#Artikel6
  - number: '7'
    text: |-
      Onverminderd de verplichtingen, bedoeld in [Hoofdstuk IV van het besluit][ref1], zijn voor de instelling waaraan
      een indemniteitsverklaring wordt verleend, aan die verlening de verplichtingen verbonden die met het oog op
      veiligheid van tentoon te stellen voorwerpen zijn opgenomen in de bijlage die bij deze regeling hoort.


      [ref1]: https://wetten.overheid.nl/BWBR0006759#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0024244/2010-06-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006759
        hoofdstuk: IV
  - number: '8'
    text: |-
      Indien zich in de periode waarvoor een indemniteitsverklaring geldt, verlies van of schade aan voorwerpen waarop
      de indemniteitsverklaring betrekking heeft, voordoet, zendt de subsidieontvanger aan de Minister naast een
      activiteitenverslag, als bedoeld in [artikel 33, onder a, van het besluit][ref1], een overzicht met de berekening
      van de geleden schade.


      [ref1]: https://wetten.overheid.nl/BWBR0006759#Artikel33
    url: https://wetten.overheid.nl/BWBR0024244/2010-06-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006759
        artikel: '33'
  - number: '9'
    text: |-
      De [Subsidieregeling indemniteit bruiklenen 2005][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0017308
    url: https://wetten.overheid.nl/BWBR0024244/2010-06-01#Artikel9
    references:
