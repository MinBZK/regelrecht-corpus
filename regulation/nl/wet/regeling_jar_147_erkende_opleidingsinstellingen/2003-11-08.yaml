---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.2/schema.json
$id: regeling_jar_147_erkende_opleidingsinstellingen
regulatory_layer: WET
publication_date: '2008-11-10'
valid_from: '2003-11-08'
bwb_id: BWBR0012920
url: https://wetten.overheid.nl/BWBR0012920/2003-11-08
preamble:
  text: |-
    Gelet op artikel 13, eerste lid, van het Besluit bewijzen van bevoegdheid voor de luchtvaart;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012920/2003-11-08#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            MTOA:

              Maintenance Training Organisation Approval als bedoeld in JAR 147, zoals vastgesteld door de JAA.
    url: https://wetten.overheid.nl/BWBR0012920/2003-11-08#Artikel1
  - number: '2'
    text: |-
      1 De minister zal een aanvraag voor een MTOA, van een JAA-persoon in behandeling nemen wanneer de aanvrager kan
      voldoen aan de eisen van JAR-147.

      2 De minister zal een aanvraag voor een MTOA, van een niet JAA-persoon in behandeling nemen wanneer:

      a. de aanvrager heeft aangetoond dat er een noodzaak is om in een niet-JAA-land personen op te leiden door de
      houder van een MTOA,

      b. de aanvraag schriftelijk wordt ondersteund door de JAA en

      c. de aanvrager kan voldoen aan de eisen van JAR-147.
    url: https://wetten.overheid.nl/BWBR0012920/2003-11-08#Artikel2
  - number: '3'
    text: |-
      1 Degene, die een aanvraag voor een MTOA heeft ingediend, wordt erkend wanneer hij aantoont, dat hij:

      a. aan JAR 147 gedateerd 1 juli 2002, zoals vastgesteld door de JAA voldoet en

      b. in Nederland is gevestigd, of aan [artikel 2, tweede lid, onder a en b][ref1] voldoet.

      2 De aanvraag wordt ingediend door de functionaris van de opleidingsorganisatie, die de eindverantwoordelijkheid
      draagt ten aanzien van het door de opleidingsorganisatie gevoerde beleid.

      3 De aanvraag wordt ingediend door middel van volledig ingevulde en ondertekende formulieren, waarvan de exemplaren
      kosteloos bij de minister zijn te verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0012920#Artikel2
    url: https://wetten.overheid.nl/BWBR0012920/2003-11-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012920
        artikel: '2'
  - number: '4'
    text: |-
      Bij de aanvraag voor een MTOA verstrekt de aanvrager de volgende gegevens:

      a. een korte levensbeschrijving van de functionarissen bedoeld in JAR-147.35(a) en (d), waarin in ieder geval
      opleiding, ervaring en vroegere functies zijn opgenomen;

      b. een exemplaar van het handboek zoals bedoeld in JAR-147.65;

      c. een exemplaar van het te gebruiken model van het certificaat voor de met goed gevolg afgelegde opleiding en
      examen;

      d. een uittreksel, niet ouder dan drie maanden, uit het register van de Kamer van Koophandel en Fabrieken;

      e. een zelfevaluatie, waarin de aanvrager per van toepassing zijnde bepaling van JAR 147 aantoont hoe daaraan wordt
      voldaan, en waar dit in het handboek staat beschreven.
    url: https://wetten.overheid.nl/BWBR0012920/2003-11-08#Artikel4
  - number: '5'
    text: |-
      1 Van de MTOA wordt een bewijs afgegeven, dat meldt tot welke datum de MTOA geldig is en op welke opleidingen de
      MTOA betrekking heeft.

      2 Een MTOA wordt verleend voor ten hoogste twee jaar.

      3 Het model van het bewijs van erkenning is overeenkomstig de bij deze regeling behorende bijlage.
    url: https://wetten.overheid.nl/BWBR0012920/2003-11-08#Artikel5
    machine_readable:
      execution:
        output:
          - name: mtoa_geldig_tot
            type: date
          - name: mtoa_duur_jaar
            type: number
        parameters:
          - name: mtoa_afgifte_datum
            type: date
        actions:
          - output: mtoa_duur_jaar
            value: 2
          - output: mtoa_geldig_tot
            value:
              operation: DATE_ADD
              date: $mtoa_afgifte_datum
              years: $mtoa_duur_jaar
  - number: '6'
    text: |-
      1 Ten aanzien van verlenging van een MTOA zijn de [artikelen 3][ref1] en [4][ref2] van overeenkomstige toepassing,
      met dien verstande dat kan worden volstaan met aan te geven, welke veranderingen zich hebben voorgedaan ten aanzien
      van de gegevens, die voor de laatst verleende erkenning zijn ingediend.

      2 Teneinde de erkenning tijdig te kunnen verlengen, moet de aanvraag hiertoe uiterlijk acht weken, doch niet eerder
      dan twaalf weken voor het tijdstip van verstrijken van de geldigheidsduur.


      [ref1]: https://wetten.overheid.nl/BWBR0012920#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012920#Artikel4
    url: https://wetten.overheid.nl/BWBR0012920/2003-11-08#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012920
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0012920
        artikel: '4'
    machine_readable:
      execution:
        output:
          - name: verlenging_aanvraag_vroegste_datum
            type: date
          - name: verlenging_aanvraag_laatste_datum
            type: date
        parameters:
          - name: mtoa_geldig_tot
            type: date
        actions:
          - output: verlenging_aanvraag_vroegste_datum
            value:
              operation: DATE_ADD
              date: $mtoa_geldig_tot
              weeks: -12
          - output: verlenging_aanvraag_laatste_datum
            value:
              operation: DATE_ADD
              date: $mtoa_geldig_tot
              weeks: -8
  - number: '7'
    text: |-
      1 Een MTOA wordt gewijzigd, nadat de houder heeft aangetoond, dat ook na de wijziging aan de voor de verkrijging
      van een MTOA gestelde voorwaarden wordt voldaan.

      2 De [artikelen 3][ref1] en [4][ref2] zijn van overeenkomstige toepassing, met dien verstande dat kan worden
      volstaan met de gegevens, die voor de aangevraagde wijziging relevant zijn.

      3 Bij wijziging wordt zo nodig een nieuw bewijs van erkenning afgegeven.

      4 Een aanvraag om wijziging wordt uiterlijk vier weken voor de gewenste datum van wijziging ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0012920#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012920#Artikel4
    url: https://wetten.overheid.nl/BWBR0012920/2003-11-08#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0012920
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0012920
        artikel: '4'
    machine_readable:
      execution:
        output:
          - name: wijziging_aanvraag_laatste_datum
            type: date
        parameters:
          - name: gewenste_wijziging_datum
            type: date
        actions:
          - output: wijziging_aanvraag_laatste_datum
            value:
              operation: DATE_ADD
              date: $gewenste_wijziging_datum
              weeks: -4
  - number: '8'
    text: |-
      1 De gehele of gedeeltelijke intrekking van de MTOA door de minister wordt 28 dagen vooraf bij aangetekende brief
      met opgave van redenen aan de houder medegedeeld.

      2 Met ingang van het tijdstip waarop de intrekking van kracht wordt, mag de houder geen certificaten voor de met
      goed gevolg afgelegde opleiding en examen meer worden afgegeven voor zover door de intrekking getroffen.

      3 De houder van de MTOA is verplicht het bewijs van erkenning zo spoedig mogelijk aan de minister te zenden.

      4 De minister neemt het bewijs van erkenning in dan wel geeft, in geval van gedeeltelijke intrekking, een nieuw
      bewijs van erkenning af.
    url: https://wetten.overheid.nl/BWBR0012920/2003-11-08#Artikel8
    machine_readable:
      execution:
        output:
          - name: intrekking_mededeling_datum
            type: date
          - name: certificaat_geldigheid_einde
            type: boolean
        parameters:
          - name: intrekking_datum
            type: date
        actions:
          - output: intrekking_mededeling_datum
            value:
              operation: DATE_ADD
              date: $intrekking_datum
              weeks: -4
          - output: certificaat_geldigheid_einde
            value: false
  - number: '9'
    text: |-
      1 De houder van een MTOA zal voorgenomen wijzigingen van zijn organisatie zoals gesteld in JAR 147.75 vooraf aan de
      minister voorleggen, zodat deze het blijven voldoen aan JAR 147 kan vaststellen.

      2 De minister kan voorwaarden stellen aan het functioneren van de houder van een MTOA tot de gemelde wijziging
      is goedgekeurd.

      3 Wanner wijzigingen niet vooraf aan de minister worden voorgelegd kan de minister besluiten de erkenning in te
      trekken met terugwerkende kracht tot het moment van invoering van de wijziging.

         4 De houder van een MTOA informeert bij wijziging van het handboek van de onderhoudsorganisatie zoals gesteld in
         JAR 147.65 de minister.
    url: https://wetten.overheid.nl/BWBR0012920/2003-11-08#Artikel9
    machine_readable:
      execution:
        output:
          - name: wijziging_voorgelegd
            type: boolean
          - name: voorwaarden_gesteld
            type: boolean
        parameters:
          - name: organisatie_wijziging_voorgelegd
            type: boolean
          - name: minister_toestemming
            type: boolean
        actions:
          - output: wijziging_voorgelegd
            value: $organisatie_wijziging_voorgelegd
          - output: voorwaarden_gesteld
            value:
              operation: NOT
              value:
                operation: EQUALS
                subject: $minister_toestemming
                value: true
  - number: '10'
    text: |-
      1 De houder van een MTOA is, voor zover opgenomen in zijn erkenning, bevoegd tot:

      a. het geven van de opleidingen en het afnemen van de examens waarvoor hij erkend is, op de locaties die in de
      erkenning zijn genoemd;

      b. het onder zijn verantwoordelijkheid uitbesteden van theoretische basis training, type training en gerelateerde
      examens;

       c. de afgifte van certificaten ten aanzien van het bepaalde onder a en b.
    url: https://wetten.overheid.nl/BWBR0012920/2003-11-08#Artikel10
    machine_readable:
      execution:
        output:
          - name: bevoegdheid_opleidingen
            type: boolean
          - name: bevoegdheid_examens
            type: boolean
        parameters:
          - name: erkenning_oplocaties
            type: array
          - name: uitbesteding_toegestaan
            type: boolean
        actions:
          - output: bevoegdheid_opleidingen
            value:
              operation: NOT
              value:
                operation: EQUALS
                subject: $erkenning_oplocaties
                value: ""
          - output: bevoegdheid_examens
            value: $uitbesteding_toegestaan
  - number: '11'
    text: |-
      1 De houder van een MTOA is verplicht:

      a. het in [artikel 4, onder b][ref1], bedoelde handboek te gebruiken en actueel te houden;

      b. zeker te stellen dat, voorafgaande aan de afgifte van het document, bedoeld in het eerste lid onder c, de
      vereiste theoretische en praktische kennis bij de ontvanger van het certificaat aanwezig is.

      2 De houder van een MTOA gebruikt een archiveringssysteem waarin de kwalificatie- en ervaringsgegevens van alle
      instructeurs, leraren en examinatoren worden bewaard volgens de eisen van JAR-147.40.

       3 De houder van een MTOA bewaart alle opleidingsgegevens, examen resultaten en beoordeling staten voor tenminste 5
        jaar na beëindiging van het opleidingstraject van de betreffende leerling.


         [ref1]: https://wetten.overheid.nl/BWBR0012920#Artikel4
    url: https://wetten.overheid.nl/BWBR0012920/2003-11-08#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0012920
        artikel: '4'
    machine_readable:
      execution:
        output:
          - name: archiveringsplicht_5jaar
            type: boolean
        parameters:
          - name: opleidingstraject_beindigd
            type: date
          - name: gegevens_bewaard
            type: boolean
        actions:
          - output: archiveringsplicht_5jaar
            value:
              operation: AND
              conditions:
                - operation: EQUALS
                  subject: $gegevens_bewaard
                  value: true
                - operation: GREATER_THAN
                  subject: $opleidingstraject_beindigd
                  value: "1970-01-01"
  - number: '12'
    text: |-
      De minister publiceert periodiek de volgende gegevens van de houders van een MTOA:

      a. hun naam;

      b. hun vestigingsplaats(en);

      c. omschrijving van de opleidingen/trainingen, waarvoor de houder van een MTOA is erkend.
    url: https://wetten.overheid.nl/BWBR0012920/2003-11-08#Artikel12
  - number: '13'
    text: Deze regeling treedt in werking met ingang van 1 november 2001 en werkt terug tot en met 1 oktober 2001.
    url: https://wetten.overheid.nl/BWBR0012920/2003-11-08#Artikel13
  - number: '14'
    text: 'Deze regeling wordt aangehaald als: Regeling JAR-147 erkende opleidingsinstellingen.'
    url: https://wetten.overheid.nl/BWBR0012920/2003-11-08#Artikel14
