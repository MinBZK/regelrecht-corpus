  - number: 35c.4
    text: |-
      De ondernemer legt een voorgenomen besluit als bedoeld in [artikel 27, eerste lid, onderdeel b][ref1],
      voor zover het betreft een arbeids- en rusttijdenregeling, en onderdeel d, schriftelijk aan de
      personeelsvertegenwoordiging voor. Hij verstrekt daarbij een overzicht van de beweegredenen voor het besluit,
      alsmede van de gevolgen die het besluit naar te verwachten valt voor de in de onderneming werkzame personen
      zal hebben. De personeelsvertegenwoordiging beslist niet dan nadat over de betrokken aangelegenheid ten
      minste éénmaal met de ondernemer overleg is gepleegd. Na het overleg deelt de personeelsvertegenwoordiging
      zo spoedig mogelijk schriftelijk en met redenen omkleed zijn beslissing aan de ondernemer mee. Na de
      beslissing van de personeelsvertegenwoordiging deelt de ondernemer zo spoedig mogelijk schriftelijk aan de
      personeelsvertegenwoordiging mee welk besluit hij heeft genomen en met ingang van welke datum hij dat besluit zal
      uitvoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel27
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '27'
        hoofdstuk: IVA
  - number: 35c.5
    text: |-
      De personeelsvertegenwoordiging kan met toestemming van de ondernemer commissies instellen of deskundigen
      uitnodigen. Ten aanzien van het uitnodigen van deskundigen is toestemming niet vereist, wanneer de deskundige geen
      kosten in rekening brengt of wanneer de kosten door de personeelsvertegenwoordiging bestreden worden uit een bedrag
      als bedoeld in [artikel 22, derde lid][ref1]. Heeft de ondernemer toestemming gegeven voor het raadplegen van een
      deskundige, dan komen de kosten daarvan te zijnen laste.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel22
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '22'
        hoofdstuk: III
  - number: 35c.6
    text: |-
      Inlichtingen en gegevens bestemd voor de personeelsvertegenwoordiging, die volgens [artikel 31, eerste lid][ref1],
      schriftelijk moeten worden verstrekt, mogen door de ondernemer ook mondeling worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel31
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '31'
        hoofdstuk: IVB
  - number: 35d.1
    text: |-
      De ondernemer die een onderneming in stand houdt waarin in de regel minder dan 10 personen werkzaam zijn
      en waarvoor geen ondernemingsraad is ingesteld, kan een personeelsvertegenwoordiging, als bedoeld in
      [artikel 35c, eerste lid][ref1], instellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel35c
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel35d
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: 35c
        hoofdstuk: VA
  - number: 35d.2
    text: |-
