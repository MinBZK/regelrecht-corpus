        artikel: 35c
        hoofdstuk: VA
  - number: '36.1'
    text: |-
      Iedere belanghebbende kan de kantonrechter verzoeken te bepalen dat de ondernemer of de ondernemingsraad gevolg
      dient te geven aan hetgeen bij of krachtens deze wet is bepaald omtrent het instellen of in stand houden van
      een ondernemingsraad, het vaststellen van een voorlopig of een definitief reglement van de ondernemingsraad, de
      kandidaatstelling voor en de verkiezing van de leden van de ondernemingsraad, alsmede omtrent het bekend maken
      van agenda’s en verslagen van vergaderingen, een en ander voor zover dit van de ondernemer of de ondernemingsraad
      afhangt.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel36
  - number: '36.2'
    text: |-
      De ondernemingsraad en de ondernemer kunnen de kantonrechter verzoeken te bepalen dat de ondernemer,
      onderscheidenlijk de ondernemingsraad gevolg dient te geven aan hetgeen overigens bij of krachtens deze wet is
      bepaald, een en ander voor zover dit van de ondernemer onderscheidenlijk de ondernemingsraad afhangt.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel36
  - number: '36.3'
    text: |-
      Een verzoekschrift aan de kantonrechter met betrekking tot de naleving van [artikel 25][ref1] ten aanzien van een
      besluit als in dat artikel bedoeld, wordt niet ontvankelijk verklaard, indien blijkt dat de ondernemingsraad voor
      of na de indiening van het verzoekschrift tegen dat besluit beroep heeft ingesteld bij de ondernemingskamer van het
      gerechtshof Amsterdam.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel25
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '25'
        hoofdstuk: IVA
  - number: '36.4'
    text: |-
      Een verzoek aan de kantonrechter op grond van [artikel 27, vierde en zesde lid][ref1] is niet ontvankelijk indien
      met betrekking tot dezelfde aangelegenheid een eis is gesteld als bedoeld in de [Arbeidsomstandighedenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0010346
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '27'
        hoofdstuk: IVA
      - id: ref2
        bwb_id: BWBR0010346
  - number: '36.5'
    text: |-
      De kantonrechter kan in zijn uitspraak aan de ondernemer, onderscheidenlijk de ondernemingsraad de verplichting
      opleggen om bepaalde handelingen te verrichten of na te laten. Het is de ondernemer verboden een zodanige
      verplichting niet na te komen. Wanneer de ondernemingsraad een zodanige verplichting niet nakomt, kan de
      kantonrechter de ondernemingsraad ontbinden, onder oplegging van de verplichting aan die raad tot het doen
      verkiezen van een nieuwe ondernemingsraad. Blijft de ondernemingsraad in gebreke, dan kan de kantonrechter de
      ondernemer machtigen een nieuwe ondernemingsraad te doen verkiezen.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel36
  - number: '36.6'
    text: |-
      De voorgaande leden zijn van overeenkomstige toepassing ten aanzien van de naleving van hetgeen bij of krachtens
      deze wet is bepaald met betrekking tot een centrale ondernemingsraad en een groepsondernemingsraad.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel36
  - number: 36a
    text: |-
      Iedere in de onderneming werkzame persoon, met uitzondering van een persoon als bedoeld in
      [artikel 35b, zesde lid][ref1], alsmede een vereniging van werknemers, die één of meer in de onderneming werkzame
      personen onder haar leden telt, die krachtens haar statuten ten doel heeft de belangen van haar leden als
      werknemers te behartigen en als zodanig in de betrokken onderneming of bedrijfstak werkzaam is en voorts tenminste
      twee jaar in het bezit is van volledige rechtsbevoegdheid, kan de kantonrechter verzoeken te bepalen dat de
      ondernemer gevolg dient te geven aan [artikel 35b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel35b
      [ref2]: https://wetten.overheid.nl/BWBR0002747#Artikel35b
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: 35b
        hoofdstuk: VA
      - id: ref2
        bwb_id: BWBR0002747
        artikel: 35b
        hoofdstuk: VA
  - number: '37.1'
    text: |-
      Voor groepen van ondernemingen worden door de Raad, ter behandeling van aangelegenheden betreffende de
      ondernemingsraden, de centrale ondernemingsraden, de groepsondernemingsraden van deze ondernemingen, de
      personeelsvertegenwoordiging en de vergadering als bedoeld in [artikel 35b][ref1], commissies ingesteld,
      bedrijfscommissies genaamd.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel35b
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: 35b
        hoofdstuk: VA
  - number: '37.2'
    text: |-
      Een bedrijfscommissie bestaat uit een door de Raad na overleg met de in [artikel 38][ref1] bedoelde organisaties
      van ondernemers en van werknemers te bepalen even aantal leden, ten minste zes bedragende, en een gelijk aantal
      plaatsvervangende leden.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel38
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '38'
        hoofdstuk: VII
  - number: '38.1'
    text: |-
      De leden en de plaatsvervangende leden van een bedrijfscommissie worden voor de helft benoemd door de door de Raad
      daartoe aangewezen representatieve organisatie of organisaties van ondernemers en voor de helft door de door de
      Raad daartoe aangewezen representatieve organisatie of organisaties van werknemers.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel38
  - number: '38.2'
    text: De Raad bepaalt het aantal leden en plaatsvervangende leden dat elke aangewezen organisatie kan benoemen.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel38
  - number: '39.1'
    text: |-
      De Raad stelt bij verordening nadere regelen omtrent de samenstelling en de werkwijze van de bedrijfscommissies.
      Daarbij wordt aan deze commissies de bevoegdheid verleend commissies, al dan niet uit haar midden, in te stellen.
      De bedrijfscommissie kan de aldus ingestelde commissies machtigen haar bevoegdheden uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel39
  - number: '39.2'
    text: |-
      De Raad stelt voorts regelen omtrent het voorzitterschap van de bedrijfscommissies. Daarbij wordt aan deze
      commissies de bevoegdheid toegekend, een voorzitter buiten de leden der commissie te kiezen, al dan niet met
      stemrecht.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel39
  - number: '40.1'
    text: |-
      Iedere bedrijfscommissie brengt jaarlijks aan Onze Minister en aan de Raad verslag uit van haar werkzaamheden in
      het afgelopen kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel40
  - number: '40.2'
    text: Onze Minister kan regelen stellen ten aanzien van de verslaggeving.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel40
  - number: '41.1'
    text: |-
      De kosten van een bedrijfscommissie worden, voor zover daarin niet op andere wijze wordt voorzien, door de in
      [artikel 38][ref1] bedoelde organisaties van ondernemers en werknemers gedragen, naar evenredigheid van het aantal
      leden dat zij benoemen.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel38
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '38'
        hoofdstuk: VII
  - number: '41.2'
    text: |-
      Wanneer een organisatie in gebreke blijft binnen de termijn, door de bedrijfscommissie gesteld, haar bijdrage
      in de kosten van de bedrijfscommissie te voldoen, kan de Raad de aanwijzing van die organisatie intrekken,
      onverminderd de aansprakelijkheid van de organisatie tot het betalen van haar aandeel in de reeds gemaakte kosten.
      Door de intrekking vervalt het lidmaatschap van de bedrijfscommissie van de door die organisatie benoemde leden
      en plaatsvervangende leden, te rekenen van het tijdstip waarop het besluit van de Raad bij de bedrijfscommissie
      inkomt.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel41
  - number: '42'
    text: |-
      Ten aanzien van de voorzitters, de leden en de plaatsvervangende leden van de bedrijfscommissies,
      alsmede ten aanzien van de personen die met het secretariaat van een bedrijfscommissie zijn belast, is
      [artikel 20, eerste en zesde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel20
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '20'
        hoofdstuk: III
  - number: '46.1'
    text: |-
      Indien voor de behandeling van aangelegenheden betreffende een ondernemingsraad, een centrale ondernemingsraad, een
      groepsondernemingsraad, een personeelsvertegenwoordiging of een vergadering als bedoeld in [artikel 35b][ref1] meer
      dan één bedrijfscommissie bevoegd zou zijn, wijst de Raad de commissie aan die voor de behandeling van de betrokken
      aangelegenheden als de krachtens deze wet bevoegde commissie zal optreden.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel35b
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: 35b
        hoofdstuk: VA
  - number: '46.2'
    text: |-
      Indien een ondernemer of een aantal in een groep verbonden ondernemers meerdere ondernemingen in stand
      houdt waarvoor meer dan één bedrijfscommissie bevoegd zou zijn, kan de Raad voor die ondernemingen een
      afzonderlijke bedrijfscommissie instellen dan wel de commissie aanwijzen die voor de behandeling van de
      aangelegenheden betreffende de ondernemingsraden, personeelsvertegenwoordigingen en vergaderingen als bedoeld
      in[ artikel 35b][ref1] van deze ondernemingen als de krachtens deze wet bevoegde commissie optreedt.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel35b
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: 35b
        hoofdstuk: VA
  - number: 46a
    text: |-
      Onverminderd hetgeen hem is toebedeeld in deze wet en de daarop berustende bepalingen, heeft de Raad tot taak de
      medezeggenschap in ondernemingen te bevorderen.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel46a
  - number: 46d
    text: |-
      Ten aanzien van een onderneming, waarin uitsluitend of nagenoeg uitsluitend krachtens publiekrechtelijke
      aanstelling arbeid wordt verricht, gelden de volgende bijzondere bepalingen:
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel46d
  - number: 46d.a
    text: Voor de toepassing van deze wet wordt als bestuurder in de zin van deze wet niet aangemerkt
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel46d
  - number: 46d.a.1°
    text: 'bij een ministerie: de minister of een staatssecretaris;'
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel46d
  - number: 46d.a.2°
    text: 'bij een provincie: de commissaris van de Koning, een lid van gedeputeerde staten of een lid van provinciale staten;'
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel46d
  - number: 46d.a.3°
    text: |-
      bij een gemeente: de burgemeester, een lid van het college van burgemeester en wethouders of een lid van de
      gemeenteraad;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel46d
  - number: 46d.a.4°
    text: |-
      bij een waterschap: de voorzitter, een lid van het dagelijks bestuur van een waterschap of een lid van het algemeen
      bestuur;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel46d
  - number: 46d.a.5°
    text: 'bij de Kamers der Staten-Generaal: de voorzitter van de Kamer of een lid;'
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel46d
  - number: 46d.a.6°
    text: 'bij de Raad van State: de vice-president of een lid;'
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel46d
  - number: 46d.a.7°
    text: 'bij de Algemene Rekenkamer: de president of een lid van de Algemene Rekenkamer;'
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel46d
  - number: 46d.a.8°
    text: 'bij de Nationale ombudsman: de Nationale ombudsman of een substituut-ombudsman.'
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel46d
  - number: 46d.b
    text: |-
      Voor de toepassing van [artikel 23, tweede lid][ref1], zijn onder de aangelegenheden de onderneming betreffende
      niet begrepen de publiekrechtelijke vaststelling van taken van publiekrechtelijke lichamen en onderdelen daarvan,
      noch het beleid ten aanzien van en de uitvoering van die taken, behoudens voor zover het betreft de gevolgen
      daarvan voor de werkzaamheden van de in de onderneming werkzame personen.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel23
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel46d
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '23'
        hoofdstuk: IV
  - number: 46d.c
    text: |-
      Voor de toepassing van onderdeel b bij de rechtbanken, de gerechtshoven, de Centrale Raad van Beroep en
      het College van Beroep voor het bedrijfsleven, zijn onder de aangelegenheden de onderneming betreffende
      tevens niet begrepen het beleid ten aanzien van en de uitvoering van de rechterlijke taken als bedoeld in
      [artikel 23, tweede en derde lid, van de Wet op de rechterlijke organisatie][ref1], behoudens voorzover het de
      gevolgen daarvan betreft voor de werkzaamheden van de in de onderneming werkzame personen.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel23
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel46d
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '23'
  - number: 46d.d
    text: |-
      De in de artikelen [5][ref1], [8, tweede en derde lid][ref2], [37][ref3], [38][ref4], [39][ref5] en
      [41, tweede lid][ref6], van deze wet aan de Raad toegekende bevoegdheden worden uitgeoefend door de Minister van
      Binnenlandse Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002747#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002747#Artikel37
      [ref4]: https://wetten.overheid.nl/BWBR0002747#Artikel38
      [ref5]: https://wetten.overheid.nl/BWBR0002747#Artikel39
      [ref6]: https://wetten.overheid.nl/BWBR0002747#Artikel41
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel46d
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002747
        artikel: '8'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0002747
        artikel: '37'
        hoofdstuk: VII
      - id: ref4
        bwb_id: BWBR0002747
        artikel: '38'
        hoofdstuk: VII
      - id: ref5
        bwb_id: BWBR0002747
        artikel: '39'
        hoofdstuk: VII
      - id: ref6
        bwb_id: BWBR0002747
        artikel: '41'
        hoofdstuk: VII
  - number: 46d.e
    text: |-
      Voor de toepassing van [artikel 38, eerste lid][ref1], kunnen behalve een representatieve organisatie of
      organisaties van ondernemers ook een of meerdere ministers aangewezen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel38
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel46d
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '38'
        hoofdstuk: VII
  - number: 46d.f
    text: |-
      De verordenende bevoegdheid van de Raad, met uitzondering van de bevoegdheid genoemd in [artikel 46a][ref1], strekt
      zich niet uit tot ondernemingen waarin uitsluitend of nagenoeg uitsluitend krachtens publiekrechtelijke aanstelling
      arbeid wordt verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel46a
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel46d
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: 46a
        hoofdstuk: VIIA
  - number: 46d.g
    text: |-
      Indien op grond van het bepaalde in onderdeel d de Minister van Binnenlandse Zaken een bedrijfscommissie heeft
      ingesteld, dient deze onverminderd het bepaalde in [artikel 40, eerste lid][ref1], aan de Minister van Binnenlandse
      Zaken verslag uit te brengen. De Minister van Binnenlandse Zaken doet dit verslag toekomen aan de betrokken
      werkgevers of verenigingen van werkgevers en de centrales van overheidspersoneel, verenigd in de Raad voor het
      Overheidspersoneelsbeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel40
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel46d
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '40'
        hoofdstuk: VII
  - number: 46d.h
    text: |-
      Voor het behandelen en beslissen van verzoekschriften als bedoeld in [artikelen 27][ref1] en [36][ref2], ter zake
      van een rechtbank, is bevoegd de kantonrechter werkzaam bij de volgende rechtbank:


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0002747#Artikel36
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel46d
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '27'
        hoofdstuk: IVA
      - id: ref2
        bwb_id: BWBR0002747
        artikel: '36'
        hoofdstuk: VI
  - number: 46d.h.1°
    text: 'terzake van de rechtbank Amsterdam: de rechtbank Noord-Holland;'
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel46d
  - number: 46d.h.2°
    text: 'terzake van de rechtbank Den Haag: de rechtbank Rotterdam;'
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel46d
  - number: 46d.h.3°
    text: 'ter zake van de rechtbank Gelderland: de rechtbank Overijssel;'
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel46d
  - number: 46d.h.4°
    text: 'terzake van de rechtbank Limburg: de rechtbank Oost-Brabant;'
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel46d
  - number: 46d.h.5°
    text: 'terzake van de rechtbank Midden-Nederland: de rechtbank Noord-Nederland'
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel46d
  - number: 46d.h.6°
    text: 'terzake van de rechtbank Noord-Holland: de rechtbank Amsterdam;'
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel46d
  - number: 46d.h.7°
    text: 'ter zake van de rechtbank Noord-Nederland: de rechtbank Midden-Nederland;'
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel46d
  - number: 46d.h.8°
    text: 'terzake van de rechtbank Oost-Brabant: de rechtbank Zeeland-West-Brabant;'
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel46d
  - number: 46d.h.9°
    text: 'ter zake van de rechtbank Overijssel: de rechtbank Gelderland;'
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel46d
  - number: 46d.h.10°
    text: 'terzake van de rechtbank Rotterdam: de rechtbank Den Haag;'
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel46d
  - number: 46d.h.11°
    text: 'terzake van de rechtbank Zeeland-West-Brabant: de rechtbank Limburg.'
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel46d
  - number: 46d.i
    text: |-
      Een beroep als bedoeld in [artikel 26, eerste lid][ref1], ter zake van het gerechtshof Amsterdam, wordt ingesteld
      bij het gerechtshof Den Haag.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel26
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel46d
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '26'
        hoofdstuk: IVA
  - number: 46e.1
    text: |-
      De in [artikel 46d][ref1] aan de Minister van Binnenlandse Zaken toegekende bevoegdheden worden uitgeoefend na
      overleg met de betrokken werkgevers of verenigingen van werkgevers en de centrales van overheidspersoneel, verenigd
      in de Raad voor het Overheidspersoneelsbeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel46d
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel46e
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: 46d
        hoofdstuk: VII_B
  - number: 46e.2
    text: |-
      In het in het eerste lid bedoelde overleg hebben de centrales van overheidspersoneel evenveel stemmen als de
      betrokken werkgevers of verenigingen van werkgevers.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel46e
  - number: 46e.3
    text: |-
      Voor een besluit als bedoeld in de [artikelen 8, tweede en derde lid][ref1] en [39][ref2] van deze Wet behoeft Onze
      Minister van Binnenlandse Zaken de instemming van twee derde van de deelnemers aan het in het eerste lid bedoelde
      overleg. Voor een besluit als bedoeld in de [artikelen 5][ref3], [37][ref4], [38][ref5] en [41, tweede lid][ref6],
      van deze Wet behoeft Onze Minister van Binnenlandse Zaken de instemming van de meerderheid van de deelnemers aan
      het in het eerste lid bedoelde overleg.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002747#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0002747#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0002747#Artikel37
      [ref5]: https://wetten.overheid.nl/BWBR0002747#Artikel38
      [ref6]: https://wetten.overheid.nl/BWBR0002747#Artikel41
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel46e
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '8'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002747
        artikel: '39'
        hoofdstuk: VII
      - id: ref3
        bwb_id: BWBR0002747
        artikel: '5'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0002747
        artikel: '37'
        hoofdstuk: VII
      - id: ref5
        bwb_id: BWBR0002747
        artikel: '38'
        hoofdstuk: VII
      - id: ref6
        bwb_id: BWBR0002747
        artikel: '41'
        hoofdstuk: VII
  - number: '47'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regelen worden gesteld ter bevordering van een goede
      uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel47
  - number: '48.1'
    text: |-
      De ondernemer op wie de verplichting tot het instellen van een ondernemingsraad rust, treft bij voorlopig
      reglement, voor zover nodig, de voorzieningen die tot de bevoegdheid van de ondernemingsraad behoren, totdat
      de ondernemingsraad zelf die bevoegdheid uitoefent. De vereniging of verenigingen van werknemers, bedoeld in
      [artikel 9, tweede lid, onder a][ref1], worden over het voorlopige reglement gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel9
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '9'
        hoofdstuk: III
  - number: '48.2'
    text: |-
      Ten aanzien van het voorlopige reglement is [artikel 8, eerste lid, eerste en tweede volzin en tweede lid][ref1],
      van overeenkomstige toepassing. Het voorlopige reglement vervalt op het tijdstip waarop de ondernemingsraad het in
      [artikel 8][ref2] bedoelde reglement heeft vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002747#Artikel8
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '8'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002747
        artikel: '8'
        hoofdstuk: III
  - number: '48.3'
    text: |-
      De voorgaande leden zijn van overeenkomstige toepassing ten aanzien van de ondernemer of de ondernemers die een
      centrale ondernemingsraad of een groepsondernemingsraad hebben ingesteld.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel48
  - number: '49.1'
    text: |-
      De ondernemer op wie de verplichting tot het instellen van een of meer ondernemingsraden rust, alsmede de betrokken
      ondernemingsraden, verstrekken desgevraagd aan een daartoe door Onze Minister aangewezen onder hem ressorterende
      ambtenaar inlichtingen omtrent het instellen en het functioneren van deze ondernemingsraden.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel49
  - number: '49.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van de ondernemer of de ondernemers die een centrale
      ondernemingsraad of een groepsondernemingsraad hebben ingesteld, alsmede ten aanzien van die raden.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel49
  - number: '50'
    text: |-
      Voor de jaren 2006 en 2007 wordt in [artikel 25, eerste lid, onderdeel m][ref1], voor «artikel 40, aanhef en eerste
      lid, onderdeel b» gelezen: artikel 122d, tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel25
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '25'
        hoofdstuk: IVA
  - number: '51'
    text: |-
      De bedrijfscommissies, door de Raad ingesteld krachtens de Wet op de Ondernemingsraden (*Stb.* 1950, K 174), worden
      geacht door de Raad te zijn ingesteld krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel51
  - number: '53.1'
    text: |-
      Deze wet is niet van toepassing op de in de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1]
      bedoelde openbare academische ziekenhuizen, Koninklijke Nederlandse Akademie van Wetenschappen en Koninklijke
      Bibliotheek noch op de Nederlandse organisatie voor wetenschappelijk onderzoek. De wet stelt regels
      omtrent het besluit van het bestuur van een bekostigde instelling voor hoger onderwijs als bedoeld in
      [artikel 1.2, onderdeel a, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2] of deze wet met
      uitzondering van [Hoofdstuk VII B][ref3] al dan niet van toepassing is op die instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002747#HoofdstukVII_B
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0005682
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0002747
        hoofdstuk: VII_B
  - number: '53.2'
    text: |-
      Bij algemene maatregel van bestuur kan op voordracht van de Minister van Onderwijs, Cultuur en Wetenschap worden
      bepaald dat de in de eerste volzin van het eerste lid opgenomen uitzondering niet geldt voor één of meer van
      bedoelde instellingen. Daarbij kan tevens worden bepaald dat [Hoofdstuk VII B][ref1] van deze wet niet van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#HoofdstukVII_B
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0002747
        hoofdstuk: VII_B
  - number: '53.3'
    text: |-
      [Hoofdstuk VII B][ref1] is niet van toepassing op openbare instellingen als bedoeld in de
      [Wet educatie en beroepsonderwijs][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002747#HoofdstukVII_B
      [ref2]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0002747
        hoofdstuk: VII_B
      - id: ref2
        bwb_id: BWBR0007625
  - number: 53a
    text: |-
      Deze wet is niet van toepassing op het Ministerie van Defensie en de daaronder ressorterende diensten, bedrijven
      of instellingen.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel53a
  - number: 53b
    text: Deze wet is niet van toepassing op de rechterlijke ambtenaren werkzaam bij de Hoge Raad.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel53b
  - number: 53c
    text: 'Deze wet is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel53c
  - number: 53c.a
    text: de leden van de Raad van State;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel53c
  - number: 53c.b
    text: de leden van de Algemene Rekenkamer;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel53c
  - number: 53c.c
    text: de Nationale ombudsman en de substituut-ombudsmannen.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel53c
  - number: '54.1'
    text: Deze wet kan worden aangehaald als Wet op de ondernemingsraden.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel54
  - number: '54.2'
    text: Zij treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel54
