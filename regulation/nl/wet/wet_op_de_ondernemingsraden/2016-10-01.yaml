  - number: 35d.3
    text: |-
      [Artikel 35c, vierde lid][ref1], is van overeenkomstige toepassing, en het vijfde en zesde lid zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel35c
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel35d
    references:
