---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_de_ondernemingsraden
regulatory_layer: WET
publication_date: '2016-07-21'
valid_from: '2016-10-01'
bwb_id: BWBR0002747
url: https://wetten.overheid.nl/BWBR0002747/2016-10-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe regelen te stellen omtrent de medezeggenschap
    van de werknemers in de onderneming door middel van ondernemingsraden;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel1
  - number: 1.1.b
    text: |-
      Raad: De Sociaal-Economische Raad, bedoeld in de [Wet op de Sociaal-Economische Raad][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002058
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002058
  - number: 1.1.c
    text: |-
      onderneming: elk in de maatschappij als zelfstandige eenheid optredend organisatorisch verband waarin krachtens
      arbeidsovereenkomst of krachtens publiekrechtelijke aanstelling arbeid wordt verricht;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel1
  - number: 1.1.d
    text: 'ondernemer: de natuurlijke persoon of de rechtspersoon die een onderneming in stand houdt;'
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel1
  - number: 1.1.e
    text: |-
      bestuurder: hij die alleen dan wel te zamen met anderen in een onderneming rechtstreeks de hoogste zeggenschap
      uitoefent bij de leiding van de arbeid;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel1
  - number: 1.1.f
    text: |-
      bedrijfscommissie: de bevoegde bedrijfscommissie, bedoeld in de [artikelen 37][ref1] en [46][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0002747#Artikel46
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '37'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0002747
        artikel: '46'
        hoofdstuk: VII
  - number: '1.2'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt onder in de onderneming werkzame personen
      verstaan: degenen die in de onderneming werkzaam zijn krachtens een publiekrechtelijke aanstelling bij dan wel
      krachtens een arbeidsovereenkomst met de ondernemer die de onderneming in stand houdt. Personen die in meer dan één
      onderneming van dezelfde ondernemer werkzaam zijn, worden geacht uitsluitend werkzaam te zijn in die onderneming
      van waaruit hun werkzaamheden worden geleid.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel1
  - number: '1.3'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt onder in de onderneming werkzame personen mede
      verstaan:
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel1
  - number: 1.3.a
    text: |-
      degenen die in het kader van werkzaamheden van de onderneming daarin ten minste 24 maanden werkzaam zijn krachtens
      een uitzendovereenkomst als bedoeld in [artikel 690 van Titel 7.10 van het Burgerlijk Wetboek][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel690
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '690'
  - number: 1.3.b
    text: |-
      degenen die krachtens een publiekrechtelijke aanstelling bij dan wel krachtens arbeidsovereenkomst met de
      ondernemer werkzaam zijn in een door een andere ondernemer in stand gehouden onderneming.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel1
  - number: '1.4'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde worden de bestuurder of de bestuurders van een
      onderneming geacht niet te behoren tot de in de onderneming werkzame personen.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel1
  - number: '2.1'
    text: |-
      De ondernemer die een onderneming in stand houdt waarin in de regel ten minste 50 personen werkzaam zijn, is in
      het belang van het goed functioneren van die onderneming in al haar doelstellingen verplicht om ten behoeve van het
      overleg met en de vertegenwoordiging van de in de onderneming werkzame personen een ondernemingsraad in te stellen
      en jegens deze raad de voorschriften, gesteld bij of krachtens deze wet, na te leven.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel2
  - number: '2.2'
    text: |-
      Indien in een onderneming na de instelling van een ondernemingsraad niet langer in de regel ten minste 50
      personen werkzaam zijn, houdt de ondernemingsraad van rechtswege op te bestaan bij het eindigen van de lopende
      zittingsperiode van die raad, tenzij de ondernemer toepassing geeft aan [artikel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel5a
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: 5a
        hoofdstuk: II
  - number: '3.1'
    text: |-
      De ondernemer die twee of meer ondernemingen in stand houdt waarin tezamen in de regel ten minste 50 personen
      werkzaam zijn stelt voor alle of voor een aantal van die ondernemingen tezamen een gemeenschappelijke
      ondernemingsraad in indien dit bevorderlijk is voor een goede toepassing van deze wet in de betrokken
      ondernemingen.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel3
  - number: '3.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van in een groep verbonden ondernemers, die twee of
      meer ondernemingen in stand houden, waarin tezamen in de regel ten minste 50 personen werkzaam zijn. De betrokken
      ondernemers wijzen een tot hun groep behorende ondernemer aan, die voor de toepassing van deze wet namens hen als
      ondernemer optreedt ten opzichte van de gemeenschappelijke ondernemingsraad.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel3
  - number: '3.3'
    text: |-
      De ondernemingen waarvoor een gemeenschappelijke ondernemingsraad is ingesteld, worden beschouwd als één
      onderneming in de zin van deze wet.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel3
  - number: '4.1'
    text: |-
      De ondernemer die een onderneming in stand houdt waarin in de regel ten minste 50 personen werkzaam zijn stelt voor
      een onderdeel van die onderneming een afzonderlijke ondernemingsraad in indien dit bevorderlijk is voor een goede
      toepassing van deze wet in de onderneming.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel4
  - number: '4.2'
    text: |-
      Het onderdeel waarvoor een afzonderlijke ondernemingsraad is ingesteld, wordt beschouwd als een onderneming in de
      zin van deze wet.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel4
  - number: '5.1'
    text: |-
      De Raad kan, indien bijzondere omstandigheden een goede toepassing van deze wet in de betrokken onderneming in
      de weg staan, aan een ondernemer op diens verzoek ten aanzien van een door hem in stand gehouden onderneming
      schriftelijk voor ten hoogste vijf jaren ontheffing verlenen van de verplichting tot het instellen van een
      ondernemingsraad. De Raad kan een dergelijke ontheffing uitsluitend verlenen indien voor wat betreft de informatie
      aan en de raadpleging van werknemers over de in het zesde lid genoemde onderwerpen door de ondernemer voorzieningen
      zijn getroffen om te waarborgen dat wordt voldaan aan het zevende en achtste lid.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel5
  - number: '5.2'
    text: |-
      De Raad stelt de verenigingen van werknemers, bedoeld in [artikel 9, tweede lid, onder a][ref1], in de gelegenheid
      over het verzoek om ontheffing te worden gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel9
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '9'
        hoofdstuk: III
  - number: '5.3'
    text: Aan een ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel5
  - number: '5.4'
    text: |-
      Zolang op een verzoek om ontheffing niet onherroepelijk is beslist, geldt de in [artikel 2, eerste lid][ref1],
      bedoelde verplichting niet.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel2
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '2'
        hoofdstuk: II
  - number: '5.5'
    text: 'In dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel5
  - number: 5.5.a
    text: |-
      informatie: het verstrekken van gegevens door de ondernemer aan de werknemers opdat zij kennis kunnen nemen van het
      onderwerp en het kunnen bestuderen;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel5
  - number: 5.5.b
    text: 'raadpleging: de gedachtewisseling en de totstandbrenging van een dialoog tussen de werknemers en de ondernemer.'
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel5
  - number: '5.6'
    text: 'Informatie en raadpleging behelzen:'
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel5
  - number: 5.6.a
    text: |-
      informatie over de recente en de waarschijnlijke ontwikkeling van de activiteiten en de economische situatie van
      de onderneming;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel5
  - number: 5.6.b
    text: |-
      informatie en raadpleging over de situatie, de structuur en de waarschijnlijke ontwikkeling van de werkgelegenheid
      binnen de onderneming, alsmede over eventuele geplande anticiperende maatregelen met name in geval van bedreiging
      van de werkgelegenheid;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel5
  - number: 5.6.c
    text: |-
      informatie en raadpleging over beslissingen die ingrijpende veranderingen voor de arbeidsorganisatie of de
      arbeidsovereenkomsten kunnen meebrengen.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel5
  - number: '5.7'
    text: |-
      Het tijdstip en de wijze van informatieverstrekking alsmede de inhoud van de informatie moeten zodanig zijn dat de
      werknemers de informatie adequaat kunnen bestuderen en zo nodig de raadpleging kunnen voorbereiden.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel5
  - number: '5.8'
    text: 'Raadpleging geschiedt:'
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel5
  - number: 5.8.a
    text: op een tijdstip, met middelen en met een inhoud die passend zijn;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel5
  - number: 5.8.b
    text: op het relevante niveau van directie en vertegenwoordiging, afhankelijk van het te bespreken onderwerp;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel5
  - number: 5.8.c
    text: op basis van de door de ondernemer te verstrekken informatie en van het advies dat de werknemers kunnen uitbrengen;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel5
  - number: 5.8.d
    text: |-
      op zodanige wijze dat de werknemers met de ondernemer kunnen samenkomen en een met redenen omkleed antwoord op hun
      advies kunnen krijgen;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel5
  - number: 5.8.e
    text: |-
      met het doel een akkoord te bereiken over de in het zesde lid, onder c, bedoelde beslissingen, die onder de
      bevoegdheden van de ondernemer vallen.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel5
  - number: 5a.1
    text: |-
      Het bij of krachtens deze wet bepaalde is mede van toepassing wanneer een ondernemer op grond van een collectieve
      arbeidsovereenkomst of een regeling van arbeidsvoorwaarden vastgesteld door een publiekrechtelijk orgaan verplicht
      is voor een door hem in stand gehouden onderneming een ondernemingsraad in te stellen. Wanneer de collectieve
      arbeidsovereenkomst of een regeling van arbeidsvoorwaarden vastgesteld door een publiekrechtelijk orgaan de
      ondernemer niet langer verplicht tot het instellen van de ondernemingsraad, houdt deze van rechtswege op te bestaan
      bij het eindigen van de lopende zittingsperiode van die raad, tenzij de ondernemer toepassing geeft aan het tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel5a
  - number: 5a.2
    text: |-
      De ondernemer kan voor een door hem in stand gehouden onderneming, ten aanzien waarvan niet of niet langer een
      verplichting bestaat tot het instellen van een ondernemingsraad, besluiten vrijwillig een ondernemingsraad in te
      stellen of in stand te houden. Het bij of krachtens deze wet bepaalde is van toepassing, zodra de ondernemer dat
      besluit schriftelijk heeft meegedeeld aan de bedrijfscommissie. De ondernemer kan deze ondernemingsraad op grond
      van een belangrijke wijziging van de omstandigheden opheffen bij het eindigen van de lopende zittingsperiode
      van die raad. De ondernemer deelt zijn besluit tot opheffing van de ondernemingsraad schriftelijk mee aan de
      bedrijfscommissie.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel5a
  - number: '6.1'
    text: |-
      Een ondernemingsraad bestaat uit leden die door de in de onderneming werkzame personen rechtstreeks uit hun
      midden worden gekozen. Hun aantal bedraagt in een onderneming met minder dan 50 personen 3 leden; met 50 tot 100
      personen 5 leden; met 100 tot 200 personen 7 leden; met 200 tot 400 personen 9 leden; met 400 tot 600 personen
      11 leden; met 600 tot 1000 personen 13 leden; met 1000 tot 2000 personen 15 leden; en zo vervolgens bij elk
      volgend duizendtal personen 2 leden meer, tot ten hoogste 25 leden. De ondernemingsraad kan met toestemming van de
      ondernemer in zijn reglement zowel een afwijkend aantal leden vaststellen, als bepalen dat voor een of meer leden
      van de ondernemingsraad een plaatsvervanger wordt gekozen. Een plaatsvervangend ondernemingsraadslid heeft dezelfde
      rechten en verplichtingen als het lid dat hij vervangt.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel6
  - number: '6.2'
    text: Kiesgerechtigd zijn de personen die gedurende ten minste 6 maanden in de onderneming werkzaam zijn geweest.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel6
  - number: '6.3'
    text: |-
      Verkiesbaar tot lid van de ondernemingsraad zijn de personen die gedurende ten minste een jaar in de onderneming
      werkzaam zijn geweest.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel6
  - number: '6.4'
    text: |-
      De ondernemer en de ondernemingsraad kunnen, indien dit bevorderlijk is voor een goede toepassing van deze wet in
      de onderneming, gezamenlijk een of meer groepen van personen die anders dan op grond van een arbeidsovereenkomst
      met de ondernemer, dan wel krachtens publiekrechtelijke aanstelling regelmatig in de onderneming arbeid
      verrichten, aanmerken als in de onderneming werkzame personen, dan wel een of meer groepen van die personen niet
      langer aanmerken als in de onderneming werkzame personen. Komen de ondernemer en de ondernemingsraad niet tot
      overeenstemming, dan kan ieder van hen een beslissing van de kantonrechter vragen.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel6
  - number: '6.5'
    text: |-
      De ondernemingsraad kan in zijn reglement afwijken van hetgeen in het tweede en derde lid van dit artikel ten
      aanzien van de diensttijd is bepaald indien dit bevorderlijk is voor een goede toepassing van deze wet in de
      onderneming.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel6
  - number: '6.6'
    text: |-
      Tijdens een zittingsperiode van de ondernemingsraad kan geen wijziging worden gebracht in het aantal leden van de
      raad op grond van vermeerdering of vermindering van het aantal in de onderneming werkzame personen.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel6
  - number: '7'
    text: |-
      De ondernemingsraad kiest uit zijn midden een voorzitter en een of meer plaatsvervangende voorzitters. De
      voorzitter, of bij diens verhindering een plaatsvervangende voorzitter, vertegenwoordigt de ondernemingsraad in
      rechte.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel7
  - number: '8.1'
    text: |-
      De ondernemingsraad maakt een reglement waarin de onderwerpen worden geregeld die bij of krachtens deze wet ter
      regeling aan de ondernemingsraad zijn opgedragen of overgelaten. Het reglement bevat geen bepalingen die in strijd
      zijn met de wet of die een goede toepassing van deze wet in de weg staan. Alvorens het reglement vast te stellen,
      stelt de ondernemingsraad de ondernemer in de gelegenheid zijn standpunt kenbaar te maken. De ondernemingsraad
      verstrekt onverwijld een exemplaar van het vastgestelde reglement aan de ondernemer.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel8
  - number: '8.2'
    text: |-
      De Raad kan ten aanzien van de inhoud van het reglement bij verordening nadere regelen stellen voor alle of een
      groep van ondernemingen. In het laatste geval wordt de betrokken bedrijfscommissie gehoord. Een verordening van
      de Raad behoeft de goedkeuring van Onze Minister. Een goedgekeurde verordening wordt in de *Staatscourant* bekend
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel8
  - number: '8.3'
    text: |-
      Indien de Raad een verordening als bedoeld in het tweede lid vaststelt, brengen de betrokken ondernemingsraden
      binnen een jaar na de bekendmaking van de goedgekeurde verordening in de *Staatscourant*, de bepalingen in hun
      reglement die in strijd zijn met deze verordening daarmee in overeenstemming.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel8
  - number: '9.1'
    text: |-
      De verkiezing van leden van de ondernemingsraad geschiedt bij geheime schriftelijke stemming en aan de hand van een
      of meer kandidatenlijsten.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel9
  - number: '9.2'
    text: 'Een kandidatenlijst kan worden ingediend door:'
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel9
  - number: 9.2.a
    text: |-
      een vereniging van werknemers, die in de onderneming werkzame kiesgerechtigde personen onder haar leden telt,
      krachtens haar statuten ten doel heeft de belangen van haar leden als werknemers te behartigen en als zodanig in
      de betrokken onderneming of bedrijfstak werkzaam is en voorts ten minste twee jaar in het bezit is van volledige
      rechtsbevoegdheid, mits zij met haar leden in de onderneming over de samenstelling van de kandidatenlijst overleg
      heeft gepleegd. Ten aanzien van een vereniging die krachtens haar statuten geacht kan worden een voortzetting
      te zijn van een of meer andere verenigingen met volledige rechtsbevoegdheid van werknemers, wordt de duur van de
      volledige rechtsbevoegdheid van die vereniging of verenigingen voor de vaststelling van de tijdsduur van twee jaar
      mede in aanmerking genomen;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel9
  - number: 9.2.b
    text: |-
      iedere in de onderneming werkzame kiesgerechtigde persoon of groep van personen, niet zijnde lid van een vereniging
      als bedoeld onder a welke een kandidatenlijst heeft ingediend.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel9
  - number: '9.3'
    text: |-
      De ondernemingsraad kan in zijn reglement bepalen, dat voor bepaalde groepen van in de onderneming werkzame
      personen, dan wel voor bepaalde onderdelen van de onderneming afzonderlijke kandidatenlijsten worden ingediend,
      ten einde als grondslag te dienen voor de verkiezing door de betrokken personen of onderdelen van een tevens in het
      reglement te bepalen aantal leden van de ondernemingsraad. Indien de ondernemingsraad van deze bevoegdheid gebruik
      heeft gemaakt, gelden de in het tweede lid ten aanzien van het indienen van kandidatenlijsten gestelde eisen voor
      iedere aangewezen groep of ieder aangewezen onderdeel afzonderlijk.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel9
  - number: '9.4'
    text: |-
      De ondernemingsraad treft, indien dit bevorderlijk is voor een goede toepassing van deze wet in de onderneming,
      voorzieningen in zijn reglement opdat de verschillende groepen van de in de onderneming werkzame personen zoveel
      mogelijk in de ondernemingsraad vertegenwoordigd kunnen zijn.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel9
  - number: '10'
    text: |-
      De ondernemingsraad stelt in zijn reglement nadere regelen betreffende de kandidaatstelling, de inrichting van
      de verkiezingen en de vaststelling van de uitslag daarvan, alsmede betreffende de vervulling van tussentijdse
      vacatures in de ondernemingsraad.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel10
  - number: '11.1'
    text: |-
      De ondernemingsraad draagt er zorg voor, dat de uitslag van de verkiezingen bekend wordt gemaakt aan de ondernemer,
      aan de in de onderneming werkzame personen, alsmede aan degenen die kandidatenlijsten hebben ingediend.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel11
  - number: '11.2'
    text: |-
      Hij draagt er zorg voor, dat de namen en de functies in de onderneming van de leden van de ondernemingsraad
      blijvend worden vermeld op een plaats die vrij toegankelijk is voor alle in de onderneming werkzame personen, op
      zodanige wijze dat daarvan gemakkelijk kennis kan worden genomen.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel11
  - number: '12.1'
    text: De leden van de ondernemingsraad treden om de drie jaren tegelijk af. Zij zijn terstond herkiesbaar.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel12
  - number: '12.2'
    text: |-
      De ondernemingsraad kan, in afwijking van het eerste lid, in zijn reglement bepalen, dat de leden om de twee jaren
      of om de vier jaren tegelijk aftreden, dan wel om de twee jaren voor de helft aftreden. De ondernemingsraad kan
      voorts beperkingen vaststellen ten aanzien van de herkiesbaarheid.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel12
  - number: '12.3'
    text: |-
      Wanneer een lid van de ondernemingsraad ophoudt in de onderneming werkzaam te zijn, eindigt van rechtswege zijn
      lidmaatschap van de ondernemingsraad.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel12
  - number: '12.4'
    text: |-
      De leden van de ondernemingsraad kunnen te allen tijde als zodanig ontslag nemen. Zij geven daarvan schriftelijk
      kennis aan de voorzitter en aan de ondernemer.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel12
  - number: '12.5'
    text: |-
      Hij die optreedt ter vervulling van een tussentijds opengevallen plaats, treedt af op het tijdstip waarop degene in
      wiens plaats hij komt had moeten aftreden.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel12
  - number: '13.1'
    text: |-
      Op verzoek van de ondernemer of van de ondernemingsraad kan de kantonrechter voor een door hem te bepalen termijn
      een lid van de ondernemingsraad uitsluiten van alle of bepaalde werkzaamheden van de ondernemingsraad. Het verzoek
      kan uitsluitend worden gedaan, door de ondernemer op grond van het feit dat het betrokken ondernemingsraadlid het
      overleg van de ondernemingsraad met de ondernemer ernstig belemmert, en door de ondernemingsraad op grond van het
      feit dat de betrokkene de werkzaamheden van de ondernemingsraad ernstig belemmert.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel13
  - number: '13.2'
    text: |-
      Alvorens een verzoek in te dienen stelt de verzoeker de betrokkene in de gelegenheid over het verzoek te worden
      gehoord. De ondernemer en de ondernemingsraad stellen elkaar in kennis van een overeenkomstig het eerste lid
      ingediend verzoek.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel13
  - number: '14.1'
    text: De ondernemingsraad regelt in zijn reglement zijn werkwijze.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel14
  - number: '14.2'
    text: 'Het reglement bevat in ieder geval voorschriften omtrent:'
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel14
  - number: 14.2.a
    text: de gevallen waarin de ondernemingsraad ten behoeve van de uitoefening van zijn taak bijeenkomt;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel14
  - number: 14.2.b
    text: de wijze van bijeenroeping van de ondernemingsraad;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel14
  - number: 14.2.c
    text: het aantal leden dat aanwezig moet zijn om een vergadering te kunnen houden;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel14
  - number: 14.2.d
    text: de uitoefening van het stemrecht in de vergaderingen;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel14
  - number: 14.2.e
    text: de voorziening in het secretariaat;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel14
  - number: 14.2.f
    text: |-
      het opmaken en het bekendmaken aan de ondernemer, de leden van de ondernemingsraad en aan de andere in de
      onderneming werkzame personen van de agenda van de vergaderingen van de ondernemingsraad;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel14
  - number: 14.2.g
    text: |-
      het tijdstip waarop de ondernemer, de leden van de ondernemingsraad en de andere in de onderneming werkzame
      personen uiterlijk in kennis dienen te worden gesteld van de agenda, welk tijdstip niet later kan worden gesteld
      dan 7 dagen vóór de vergadering, behoudens in spoedeisende gevallen;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel14
  - number: 14.2.h
    text: |-
      het opmaken en het bekendmaken aan de ondernemer, de leden van de ondernemingsraad en aan de andere in de
      onderneming werkzame personen van de verslagen van de vergaderingen van de ondernemingsraad en van het jaarverslag
      van de ondernemingsraad.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel14
  - number: '15.1'
    text: |-
      De ondernemingsraad kan de commissies instellen die hij voor de vervulling van zijn taak redelijkerwijze nodig
      heeft. De ondernemingsraad legt zijn voornemen om een commissie in te stellen schriftelijk voor aan de ondernemer,
      met vermelding van de taak, samenstelling, bevoegdheden en werkwijze van de door hem in te stellen commissie. Bij
      bezwaar van de ondernemer kan de ondernemingsraad een beslissing van de kantonrechter vragen.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel15
  - number: '15.2'
    text: |-
      De ondernemingsraad kan met inachtneming van het eerste lid vaste commissies instellen voor de behandeling van
      door hem aangewezen onderwerpen. De ondernemingsraad kan in het instellingsbesluit van een vaste commissie zijn
      rechten en bevoegdheden ten aanzien van deze onderwerpen, met uitzondering van de bevoegdheid tot het voeren van
      rechtsgedingen, geheel of gedeeltelijk aan de betrokken commissie overdragen. In een vaste commissie kunnen naast
      een meerderheid van leden van de ondernemingsraad ook andere in de onderneming werkzame personen zitting hebben.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel15
  - number: '15.3'
    text: |-
      De ondernemingsraad kan met inachtneming van het eerste lid voor onderdelen van de onderneming onderdeelcommissies
      instellen voor de behandeling van de aangelegenheden van die onderdelen. De ondernemingsraad kan in het
      instellingsbesluit van een onderdeelcommissie aan deze commissie de bevoegdheid toekennen tot het plegen van
      overleg met degene die de leiding heeft van het betrokken onderdeel. In dat geval gaan de rechten en bevoegdheden
      van de ondernemingsraad ten aanzien van de aangelegenheden van het onderdeel, met uitzondering van de bevoegdheid
      tot het voeren van rechtsgedingen, over naar de onderdeelcommissie, tenzij de ondernemingsraad besluit een bepaalde
      aangelegenheid zelf te behandelen. In een onderdeelcommissie kunnen naast een of meer leden van de ondernemingsraad
      uitsluitend in het betrokken onderdeel werkzame personen zitting hebben.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel15
  - number: '15.4'
    text: |-
      De ondernemingsraad kan met inachtneming van het eerste lid voorbereidingscommissies instellen ter voorbereiding
      van door de ondernemingsraad te behandelen onderwerpen. Een voorbereidingscommissie kan geen rechten of
      bevoegdheden van de ondernemingsraad uitoefenen. Een voorbereidingscommissie kan slechts voor een bepaalde, door
      de ondernemingsraad in het instellingsbesluit te vermelden, tijd worden ingesteld. In een voorbereidingscommissie
      kunnen naast een of meer leden van de ondernemingsraad ook andere in de onderneming werkzame personen zitting
      hebben.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel15
  - number: '15.5'
    text: |-
      Ten aanzien van de leden van door de ondernemingsraad ingestelde commissies, die geen lid zijn van de
      ondernemingsraad, is [artikel 13][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel13
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '13'
        hoofdstuk: III
  - number: '16.1'
    text: |-
      De ondernemingsraad kan een of meer deskundigen uitnodigen tot het bijwonen van een vergadering van die raad, met
      het oog op de behandeling van een bepaald onderwerp. Hij kan een zodanige uitnodiging ook doen aan een of meer
      bestuurders van de onderneming, dan wel aan een of meer personen als bedoeld in [artikel 24, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel24
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '24'
        hoofdstuk: IV
  - number: '16.2'
    text: |-
      De leden van de ondernemingsraad kunnen in de vergadering aan de in het eerste lid bedoelde personen inlichtingen
      en adviezen vragen.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel16
  - number: '16.3'
    text: Een deskundige kan eveneens worden uitgenodigd een schriftelijk advies uit te brengen.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel16
  - number: '16.4'
    text: De voorgaande leden zijn van overeenkomstige toepassing ten aanzien van de commissies van de ondernemingsraad.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel16
  - number: '17.1'
    text: |-
      De ondernemer is verplicht de ondernemingsraad, de commissies van die raad, en, indien de ondernemer aan de
      ondernemingsraad een secretaris heeft toegevoegd, de secretaris van die raad het gebruik toe te staan van de
      voorzieningen waarover hij als zodanig kan beschikken en die de ondernemingsraad, de commissies en de secretaris
      van die raad voor de vervulling van hun taak redelijkerwijze nodig hebben. De ondernemer stelt de ondernemingsraad
      en de commissies van die raad in staat de in de onderneming werkzame personen te raadplegen en stelt deze personen
      in de gelegenheid hieraan hun medewerking te verlenen, een en ander voor zover dat redelijkerwijs noodzakelijk is
      voor de vervulling van de taak van de raad en de commissies.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel17
  - number: '17.2'
    text: De ondernemingsraad en de commissies van die raad vergaderen zoveel mogelijk tijdens de normale arbeidstijd.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel17
  - number: '17.3'
    text: |-
      De leden van de ondernemingsraad en de leden van de commissies van die raad behouden voor de tijd gedurende welke
      zij ten gevolge van het bijwonen van een vergadering van de ondernemingsraad of van een commissie van die raad niet
      de bedongen arbeid hebben verricht, hun aanspraak op loon dan wel bezoldiging.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel17
  - number: '18.1'
    text: |-
      De ondernemer is verplicht de leden van de ondernemingsraad en de leden van de commissies van die raad, gedurende
      een door de ondernemer en de ondernemingsraad gezamenlijk vast te stellen aantal uren per jaar, in werktijd en met
      behoud van loon dan wel bezoldiging de gelegenheid te bieden voor onderling beraad en overleg met andere personen
      over aangelegenheden waarbij zij in de uitoefening van hun taak zijn betrokken, alsmede voor kennisneming van de
      arbeidsomstandigheden in de onderneming.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel18
  - number: '18.2'
    text: |-
      De ondernemer is verplicht de leden van de ondernemingsraad en de leden van een vaste commissie of
      onderdeelcommissie, bedoeld in [artikel 15, tweede lid, onderscheidenlijk derde lid][ref1], gedurende een door de
      ondernemer en de ondernemingsraad gezamenlijk vast te stellen aantal dagen per jaar, in werktijd en met behoud van
      loon dan wel bezoldiging de gelegenheid te bieden de scholing en vorming van voldoende kwaliteit te ontvangen welke
      zij in verband met de vervulling van hun taak nodig oordelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel15
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '15'
        hoofdstuk: III
  - number: '18.3'
    text: |-
      De ondernemer en de ondernemingsraad stellen het aantal uren, bedoeld in het eerste lid, en het aantal dagen,
      bedoeld in het tweede lid, vast op een zodanig aantal als de betrokken leden van de ondernemingsraad en van de
      commissies van die raad voor de vervulling van hun taak redelijkerwijze nodig hebben. Daarbij wordt in acht genomen
      dat het aantal uren niet lager vastgesteld kan worden dan zestig per jaar en het aantal dagen:
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel18
  - number: 18.3.a
    text: |-
      voor leden van een in het tweede lid bedoelde commissie die niet tevens lid zijn van de ondernemingsraad, niet
      lager vastgesteld kan worden dan drie per jaar;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel18
  - number: 18.3.b
    text: |-
      voor leden van de ondernemingsraad die niet tevens lid zijn van een in het tweede lid bedoelde commissie, niet
      lager vastgesteld kan worden dan vijf per jaar; en
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel18
  - number: 18.3.c
    text: |-
      voor leden van de ondernemingsraad die tevens lid zijn van een commissie, niet lager vastgesteld kan worden dan
      acht per jaar.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel18
  - number: '18.4'
    text: |-
      De ondernemingsraad, alsmede ieder lid van de ondernemingsraad of van een commissie van die raad kan de
      kantonrechter verzoeken te bepalen dat de ondernemer gevolg dient te geven aan hetgeen is bepaald in het eerste,
      het tweede en het derde lid.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel18
  - number: '20.1'
    text: |-
      De leden van de ondernemingsraad en de leden van de commissies van die raad, alsmede de overeenkomstig
      [artikel 16][ref1] geraadpleegde deskundigen zijn verplicht tot geheimhouding van alle zaken- en bedrijfsgeheimen
      die zij in hun hoedanigheid vernemen, alsmede van alle aangelegenheden ten aanzien waarvan de ondernemer, dan
      wel de ondernemingsraad of de betrokken commissie hun geheimhouding heeft opgelegd of waarvan zij, in verband met
      opgelegde geheimhouding, het vertrouwelijk karakter moeten begrijpen. Het voornemen om geheimhouding op te leggen
      wordt zoveel mogelijk vóór de behandeling van de betrokken aangelegenheid meegedeeld. Degene die de geheimhouding
      oplegt, deelt daarbij tevens mee, welke schriftelijk of mondeling verstrekte gegevens onder de geheimhouding vallen
      en hoelang deze dient te duren, alsmede of er personen zijn ten aanzien van wie de geheimhouding niet in acht
      behoeft te worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel16
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '16'
        hoofdstuk: III
  - number: '20.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van degenen die met het secretariaat van de
      ondernemingsraad of van een commissie van die raad zijn belast.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel20
  - number: '20.3'
    text: |-
      De in het eerste lid bedoelde verplichting geldt niet tegenover hen die ingevolge een rechterlijke opdracht zijn
      belast met een onderzoek naar de gang van zaken in de onderneming.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel20
  - number: '20.4'
    text: |-
      De in het eerste lid bedoelde verplichting geldt voorts niet tegenover hem die door een lid van de ondernemingsraad
      of door een lid van een commissie van die raad wordt benaderd voor overleg, mits de ondernemer, onderscheidenlijk
      degene die geheimhouding heeft opgelegd, vooraf toestemming heeft gegeven voor het overleg met de betrokken
      persoon en deze laatste schriftelijk heeft verklaard, dat hij zich ten aanzien van de betrokken aangelegenheid tot
      geheimhouding verplicht. In dat geval is ten aanzien van de bedoelde persoon het eerste lid van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel20
  - number: '20.5'
    text: |-
      Een weigering de in het vorige lid bedoelde toestemming te verlenen, wordt door de ondernemer, onderscheidenlijk
      door degene die geheimhouding heeft opgelegd, met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel20
  - number: '20.6'
    text: |-
      De plicht tot geheimhouding vervalt niet door beëindiging van het lidmaatschap van de ondernemingsraad of van de
      betrokken commissie, noch door beëindiging van de werkzaamheden van de betrokkene in de onderneming.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel20
  - number: '20.7'
    text: |-
      De ondernemingsraad, alsmede ieder lid van de ondernemingsraad of van een commissie van die raad, alsmede
      een overeenkomstig [artikel 16][ref1] geraadpleegde deskundige en ieder die met het secretariaat van de
      ondernemingsraad of van een commissie van die raad is belast kan de kantonrechter verzoeken de opgelegde
      geheimhouding op te heffen op de grond dat de ondernemer bij afweging van de betrokken belangen niet in
      redelijkheid tot het opleggen van geheimhouding had kunnen besluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel16
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '16'
        hoofdstuk: III
  - number: '21'
    text: |-
      De ondernemer draagt er zorg voor, dat de in de onderneming werkzame personen die staan of gestaan hebben op een
      kandidatenlijst als bedoeld in [artikel 9][ref1], alsmede de leden en de gewezen leden van de ondernemingsraad
      en van de commissies van die raad niet uit hoofde van hun kandidaatstelling of van hun lidmaatschap van de
      ondernemingsraad of van een commissie van die raad worden benadeeld in hun positie in de onderneming. Indien
      de ondernemer aan de ondernemingsraad een secretaris heeft toegevoegd is de eerste volzin op die secretaris
      van overeenkomstige toepassing. Op degene die het initiatief neemt of heeft genomen tot het instellen van een
      ondernemingsraad is de eerste volzin van overeenkomstige toepassing. De ondernemingsraad, alsmede iedere in de
      onderneming werkzame persoon als in de eerste tot en met derde volzin bedoeld, kan de kantonrechter verzoeken te
      bepalen dat de ondernemer gevolg dient te geven aan hetgeen in de eerste tot en met derde volzin is bepaald. Ten
      aanzien van personen die krachtens publiekrechtelijke aanstelling in de onderneming werkzaam zijn, treedt een
      andere kamer van de rechtbank in de plaats van de kantonrechter.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel9
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '9'
        hoofdstuk: III
  - number: '22.1'
    text: |-
      De kosten die redelijkerwijze noodzakelijk zijn voor de vervulling van de taak van de ondernemingsraad en de
      commissies van die raad komen ten laste van de ondernemer.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel22
  - number: '22.2'
    text: |-
      Met inachtneming van het bepaalde in het eerste lid komen de kosten van het overeenkomstig [artikel 16][ref1]
      en [artikel 23a, zesde lid][ref2], raadplegen van een deskundige door de ondernemingsraad of een commissie van
      die raad, alsmede de kosten van het voeren van rechtsgedingen door de ondernemingsraad slechts ten laste van de
      ondernemer, indien hij van de te maken kosten vooraf in kennis is gesteld. De eerste volzin is niet van toepassing
      wanneer uitvoering is gegeven aan het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0002747#Artikel23a
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '16'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002747
        artikel: 23a
        hoofdstuk: IV
  - number: '22.3'
    text: |-
      Met inachtneming van het eerste lid komen de kosten van scholing en vorming, bedoeld in
      [artikel 18, tweede lid][ref1], ten laste van de ondernemer. De Raad kan voor verschillende kosten verbonden aan
      scholing en vorming richtbedragen vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel18
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '18'
        hoofdstuk: III
  - number: '22.4'
    text: |-
      De ondernemer kan in overeenstemming met de ondernemingsraad de kosten die de ondernemingsraad en de commissies
      van die raad in enig jaar zullen maken, voor zover deze geen verband houden met artikel [artikelen 17][ref1] en
      [18, eerste lid][ref2], vaststellen op een bepaald bedrag, dat de ondernemingsraad naar eigen inzicht kan besteden.
      Kosten waardoor het hier bedoelde bedrag zou worden overschreden, komen slechts ten laste van de ondernemer voor
      zover hij in het dragen daarvan toestemt.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002747#Artikel18
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '17'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002747
        artikel: '18'
        hoofdstuk: III
  - number: 22a
    text: |-
      In rechtsgedingen tussen de ondernemer en de ondernemingsraad kan de ondernemingsraad niet in de proceskosten
      worden veroordeeld.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel22a
  - number: '23.1'
    text: |-
      De ondernemer en de ondernemingsraad komen met elkaar bijeen binnen twee weken nadat hetzij de ondernemingsraad
      hetzij de ondernemer daarom onder opgave van redenen heeft verzocht.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel23
  - number: '23.2'
    text: |-
      In de in het eerste lid bedoelde overlegvergaderingen worden de aangelegenheden, de onderneming betreffende, aan
      de orde gesteld, ten aanzien waarvan hetzij de ondernemer, hetzij de ondernemingsraad overleg wenselijk acht of
      waarover ingevolge het bij of krachtens deze wet bepaalde overleg tussen de ondernemer en de ondernemingsraad
      moet plaatsvinden. De ondernemingsraad is bevoegd omtrent de bedoelde aangelegenheden voorstellen te doen en
      standpunten kenbaar te maken. Onder de aangelegenheden, de onderneming betreffende, is niet begrepen het beleid ten
      aanzien van, alsmede de uitvoering van een bij of krachtens een wettelijk voorschrift aan de ondernemer opgedragen
      publiekrechtelijke taak, behoudens voor zover deze uitvoering de werkzaamheden van de in de onderneming werkzame
      personen betreft.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel23
  - number: '23.3'
    text: |-
      De ondernemingsraad is ook buiten de overlegvergadering bevoegd aan de ondernemer voorstellen te doen omtrent de in
      het tweede lid bedoelde aangelegenheden. Een dergelijk voorstel wordt schriftelijk en voorzien van een toelichting
      aan de ondernemer voorgelegd. De ondernemer beslist over het voorstel niet dan nadat daarover ten minste éénmaal
      overleg is gepleegd in een overlegvergadering. Na het overleg deelt de ondernemer zo spoedig mogelijk schriftelijk
      en met redenen omkleed aan de ondernemingsraad mee, of en in hoeverre hij overeenkomstig het voorstel zal
      besluiten.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel23
  - number: '23.4'
    text: |-
      Het overleg wordt voor de ondernemer gevoerd door de bestuurder van de onderneming. Wanneer een onderneming meer
      dan één bestuurder heeft, bepalen dezen te zamen wie van hen overleg pleegt met de ondernemingsraad.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel23
  - number: '23.5'
    text: |-
      De in het vorige lid bedoelde bestuurder kan zich in geval van verhindering of ten aanzien van een bepaald
      onderwerp laten vervangen door een medebestuurder. Heeft de onderneming geen meerhoofdig bestuur, dan kan de
      bestuurder zich bij verhindering doen vervangen door een persoon als bedoeld in [artikel 24, tweede lid][ref1],
      of door een in de onderneming werkzame persoon die beschikt over bevoegdheden om namens de ondernemer overleg te
      voeren met de ondernemingsraad.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel24
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '24'
        hoofdstuk: IV
  - number: '23.6'
    text: |-
      De bestuurder of degene die hem vervangt kan zich bij het overleg laten bijstaan door een of meer medebestuurders,
      personen als bedoeld in [artikel 24, tweede lid][ref1], of in de onderneming werkzame personen.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel24
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '24'
        hoofdstuk: IV
  - number: 23a.1
    text: |-
      Een overlegvergadering kan slechts worden gehouden, indien ten aanzien van de ondernemingsraad wordt voldaan aan de
      bepalingen die ingevolge het reglement van de ondernemingsraad gelden voor het houden van een vergadering van die
      raad. Alle leden van de ondernemingsraad kunnen in de vergadering het woord voeren.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel23a
  - number: 23a.2
    text: |-
      De overlegvergadering wordt, tenzij de ondernemer en de ondernemingsraad te zamen een andere regeling treffen,
      beurtelings geleid door de bestuurder of degene die hem ingevolge [artikel 23, vijfde lid][ref1], vervangt en de
      voorzitter of de plaatsvervangende voorzitter van de ondernemingsraad.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel23
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '23'
        hoofdstuk: IV
  - number: 23a.3
    text: |-
      De secretaris van de ondernemingsraad treedt op als secretaris van de overlegvergadering, tenzij de ondernemer en
      de ondernemingsraad te zamen een andere persoon als secretaris aanwijzen.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel23a
  - number: 23a.4
    text: |-
      De agenda van de overlegvergadering bevat de onderwerpen die door de ondernemer of door de ondernemingsraad bij
      de secretaris voor het overleg zijn aangemeld. Het verslag van de overlegvergadering behoeft de goedkeuring van de
      ondernemer en de ondernemingsraad.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel23a
  - number: 23a.5
    text: |-
      De ondernemer en de ondernemingsraad maken gezamenlijk afspraken over de gang van zaken bij de overlegvergadering
      en over de wijze en het tijdstip waarop de agenda en het verslag van de overlegvergadering aan de in de onderneming
      werkzame personen bekend worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel23a
  - number: 23a.6
    text: |-
      Ten aanzien van de overlegvergadering zijn de [artikelen 17][ref1] en [22][ref2] van overeenkomstige toepassing.
      Zowel de ondernemingsraad als de ondernemer kan een of meer deskundigen uitnodigen tot het bijwonen van een
      overlegvergadering, indien dit voor de behandeling van een bepaald onderwerp redelijkerwijze nodig is. Zij stellen
      elkaar hiervan tijdig vooraf in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002747#Artikel22
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '17'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002747
        artikel: '22'
        hoofdstuk: III
  - number: 23b.1
    text: |-
      Tijdens een overlegvergadering kunnen zowel door de ondernemer als door de ondernemingsraad besluiten worden
      genomen.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel23b
  - number: 23b.2
    text: |-
      Een overlegvergadering wordt door de voorzitter geschorst, wanneer de ondernemer of de ondernemingsraad ten aanzien
      van een bepaald onderwerp afzonderlijk beraad wenselijk acht.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel23b
  - number: 23c
    text: |-
      Indien de ondernemingsraad aan een onderdeelcommissie de bevoegdheid heeft toegekend tot het plegen van overleg met
      degene die de leiding heeft van het betrokken onderdeel, zijn ten aanzien van dat overleg de [artikelen 17][ref1],
      [22][ref2], [23][ref3], [23a, tweede, vierde en zesde lid][ref4], [23b][ref5], [24, eerste lid][ref6],
      [25][ref7], [27][ref8], [28][ref9], [31a, eerste, zesde en zevende lid][ref10], [31b][ref11] en [31c][ref12] van
      overeenkomstige toepassing. In dit overleg kunnen geen aangelegenheden worden behandeld die in het overleg met de
      ondernemingsraad worden behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002747#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0002747#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0002747#Artikel23a
      [ref5]: https://wetten.overheid.nl/BWBR0002747#Artikel23b
      [ref6]: https://wetten.overheid.nl/BWBR0002747#Artikel24
      [ref7]: https://wetten.overheid.nl/BWBR0002747#Artikel25
      [ref8]: https://wetten.overheid.nl/BWBR0002747#Artikel27
      [ref9]: https://wetten.overheid.nl/BWBR0002747#Artikel28
      [ref10]: https://wetten.overheid.nl/BWBR0002747#Artikel31a
      [ref11]: https://wetten.overheid.nl/BWBR0002747#Artikel31b
      [ref12]: https://wetten.overheid.nl/BWBR0002747#Artikel31c
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel23c
    references:
      - id: ref1
        bwb_id: BWBR0002747
