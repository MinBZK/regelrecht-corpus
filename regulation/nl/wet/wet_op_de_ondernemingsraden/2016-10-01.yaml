        artikel: 31c
        hoofdstuk: IVB
  - number: '24.1'
    text: |-
      In de overlegvergadering wordt ten minste tweemaal per jaar de algemene gang van zaken van de onderneming
      besproken. De ondernemer doet in dit kader mededeling over besluiten die hij in voorbereiding heeft met betrekking
      tot de aangelegenheden als bedoeld in de [artikelen 25][ref1] en [27][ref2]. Daarbij worden afspraken gemaakt
      wanneer en op welke wijze de ondernemingsraad in de besluitvorming wordt betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002747#Artikel27
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '25'
        hoofdstuk: IVA
      - id: ref2
        bwb_id: BWBR0002747
        artikel: '27'
        hoofdstuk: IVA
  - number: '24.2'
    text: |-
      Indien de onderneming in stand wordt gehouden door een naamloze vennootschap, een besloten vennootschap met
      beperkte aansprakelijkheid, een coöperatie of een onderlinge waarborgmaatschappij, zijn bij de in het eerste lid
      bedoelde besprekingen de commissarissen van de vennootschap, de coöperatie of de onderlinge waarborgmaatschappij,
      als die er zijn, dan wel een of meer vertegenwoordigers uit hun midden aanwezig. Wordt ten minste de helft van de
      aandelen van de vennootschap middellijk of onmiddellijk voor eigen rekening gehouden door een andere vennootschap,
      dan rust de hiervoor bedoelde verplichting op de bestuurders van de laatstbedoelde vennootschap, dan wel op een
      of meer door hen aangewezen vertegenwoordigers. Wordt de onderneming in stand gehouden door een vereniging of een
      stichting, dan zijn de bestuursleden van die vereniging of die stichting, dan wel een of meer vertegenwoordigers
      uit hun midden aanwezig. De ondernemingsraad kan in een bepaald geval besluiten, dat aan dit lid geen toepassing
      behoeft te worden gegeven.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel24
  - number: '24.3'
    text: |-
      Het in het vorige lid bepaalde geldt niet ten aanzien van een onderneming die in stand wordt gehouden door een
      ondernemer die ten minste vijf ondernemingen in stand houdt waarvoor een ondernemingsraad is ingesteld waarop
      de bepalingen van deze wet van toepassing zijn, dan wel door een ondernemer die deel uitmaakt van in een groep
      verbonden ondernemers die te zamen ten minste vijf ondernemingsraden hebben ingesteld waarop de bepalingen van deze
      wet van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel24
  - number: '25.1'
    text: |-
      De ondernemingsraad wordt door de ondernemer in de gelegenheid gesteld advies uit te brengen over elk door hem
      voorgenomen besluit tot:
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel25
  - number: 25.1.a
    text: overdracht van de zeggenschap over de onderneming of een onderdeel daarvan;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel25
  - number: 25.1.b
    text: |-
      het vestigen van, dan wel het overnemen of afstoten van de zeggenschap over, een andere onderneming, alsmede het
      aangaan van, het aanbrengen van een belangrijke wijziging in of het verbreken van duurzame samenwerking met een
      andere onderneming, waaronder begrepen het aangaan, in belangrijke mate wijzigen of verbreken van een belangrijke
      financiële deelneming vanwege of ten behoeve van een dergelijke onderneming;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel25
  - number: 25.1.c
    text: beëindiging van de werkzaamheden van de onderneming of van een belangrijk onderdeel daarvan;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel25
  - number: 25.1.d
    text: belangrijke inkrimping, uitbreiding of andere wijziging van de werkzaamheden van de onderneming;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel25
  - number: 25.1.e
    text: |-
      belangrijke wijziging in de organisatie van de onderneming, dan wel in de verdeling van bevoegdheden binnen de
      onderneming;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel25
  - number: 25.1.f
    text: wijziging van de plaats waar de onderneming haar werkzaamheden uitoefent;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel25
  - number: 25.1.g
    text: het groepsgewijze werven of inlenen van arbeidskrachten;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel25
  - number: 25.1.h
    text: het doen van een belangrijke investering ten behoeve van de onderneming;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel25
  - number: 25.1.i
    text: het aantrekken van een belangrijk krediet ten behoeve van de onderneming;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel25
  - number: 25.1.j
    text: |-
      het verstrekken van een belangrijk krediet en het stellen van zekerheid voor belangrijke schulden van een andere
      ondernemer, tenzij dit geschiedt in de normale uitoefening van werkzaamheden in de onderneming;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel25
  - number: 25.1.k
    text: invoering of wijziging van een belangrijke technologische voorziening;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel25
  - number: 25.1.l
    text: |-
      het treffen van een belangrijke maatregel in verband met de zorg van de onderneming voor het milieu, waaronder
      begrepen het treffen of wijzigen van een beleidsmatige, organisatorische en administratieve voorziening in verband
      met het milieu;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel25
  - number: 25.1.m
    text: |-
      vaststelling van een regeling met betrekking tot het zelf dragen van het risico, bedoeld in
      [artikel 40, eerste lid, van de Wet financiering sociale verzekeringen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '40'
  - number: 25.1.n
    text: |-
      het verstrekken en het formuleren van een adviesopdracht aan een deskundige buiten de onderneming betreffende een
      der hiervoor bedoelde aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel25
  - number: '25.2'
    text: |-
      De ondernemer legt het te nemen besluit schriftelijk aan de ondernemingsraad voor. Het advies moet op een zodanig
      tijdstip worden gevraagd, dat het van wezenlijke invloed kan zijn op het te nemen besluit.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel25
  - number: '25.3'
    text: |-
      Bij het vragen van advies wordt aan de ondernemingsraad een overzicht verstrekt van de beweegredenen voor het
      besluit, alsmede van de gevolgen die het besluit naar te verwachten valt voor de in de onderneming werkzame
      personen zal hebben en van de naar aanleiding daarvan voorgenomen maatregelen.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel25
  - number: '25.4'
    text: |-
      De ondernemingsraad brengt met betrekking tot een voorgenomen besluit als bedoeld in het eerste lid geen advies uit
      dan nadat over de betrokken aangelegenheid ten minste éénmaal overleg is gepleegd in een overlegvergadering. Ten
      aanzien van de bespreking van het voorgenomen besluit in de overlegvergadering is [artikel 24, tweede lid][ref1],
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel24
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '24'
        hoofdstuk: IV
  - number: '25.5'
    text: |-
      Indien na het advies van de ondernemingsraad een besluit als in het eerste lid bedoeld wordt genomen, wordt de
      ondernemingsraad door de ondernemer zo spoedig mogelijk van het besluit schriftelijk in kennis gesteld. Indien het
      advies van de ondernemingsraad niet of niet geheel is gevolgd, wordt aan de ondernemingsraad tevens meegedeeld,
      waarom van dat advies is afgeweken. Voor zover de ondernemingsraad daarover nog niet heeft geadviseerd, wordt
      voorts het advies van de ondernemingsraad ingewonnen over de uitvoering van het besluit.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel25
  - number: '25.6'
    text: |-
      Tenzij het besluit van de ondernemer overeenstemt met het advies van de ondernemingsraad, is de ondernemer
      verplicht de uitvoering van zijn besluit op te schorten tot een maand na de dag waarop de ondernemingsraad van het
      besluit in kennis is gesteld. De verplichting vervalt wanneer de ondernemingsraad zulks te kennen geeft.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel25
  - number: '26.1'
    text: |-
      De ondernemingsraad kan bij de ondernemingskamer van het gerechtshof Amsterdam beroep instellen tegen een besluit
      van de ondernemer als bedoeld in [artikel 25, vijfde lid][ref1], hetzij wanneer dat besluit niet in overeenstemming
      is met het advies van de ondernemingsraad, hetzij wanneer feiten of omstandigheden bekend zijn geworden, die, waren
      zij aan de ondernemingsraad bekend geweest ten tijde van het uitbrengen van zijn advies, aanleiding zouden kunnen
      zijn geweest om dat advies niet uit te brengen zoals het is uitgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel25
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '25'
        hoofdstuk: IVA
  - number: '26.2'
    text: |-
      Het beroep wordt ingediend bij verzoekschrift, binnen een maand nadat de ondernemingsraad van het in het eerste lid
      bedoelde besluit in kennis is gesteld.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel26
  - number: '26.3'
    text: De ondernemer wordt van het ingestelde beroep in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel26
  - number: '26.4'
    text: |-
      Het beroep kan uitsluitend worden ingesteld ter zake dat de ondernemer bij afweging van de betrokken belangen niet
      in redelijkheid tot zijn besluit had kunnen komen.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel26
  - number: '26.5'
    text: |-
      De ondernemingskamer behandelt het verzoek met de meeste spoed. Alvorens te beslissen kan zij, ook ambtshalve,
      deskundigen, alsmede in de onderneming werkzame personen horen. Indien de ondernemingskamer het beroep gegrond
      bevindt, verklaart zij dat de ondernemer bij afweging van de betrokken belangen niet in redelijkheid tot het
      betrokken besluit had kunnen komen. Zij kan voorts, indien de ondernemingsraad daarom heeft verzocht, een of meer
      van de volgende voorzieningen treffen:
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel26
  - number: 26.5.a
    text: |-
      het opleggen van de verplichting aan de ondernemer om het besluit geheel of ten dele in te trekken, alsmede om aan
      te wijzen gevolgen van dat besluit ongedaan te maken;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel26
  - number: 26.5.b
    text: |-
      het opleggen van een verbod aan de ondernemer om handelingen te verrichten of te doen verrichten ter uitvoering van
      het besluit of van onderdelen daarvan.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel26
  - number: '26.6'
    text: |-
      Het is verboden een verplichting of een verbod als bedoeld in het vorige lid niet na te komen, onderscheidenlijk
      te overtreden.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel26
  - number: '26.7'
    text: |-
      De ondernemingskamer kan haar beslissing op een verzoek tot het treffen van voorzieningen voor een door haar te
      bepalen termijn aanhouden, indien beide partijen daarom verzoeken, dan wel indien de ondernemer op zich neemt het
      besluit waartegen beroep is ingesteld, in te trekken of te wijzigen, of bepaalde gevolgen van het besluit ongedaan
      te maken.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel26
  - number: '26.8'
    text: |-
      Nadat het verzoekschrift is ingediend kan de ondernemingskamer, zo nodig onverwijld, voorlopige voorzieningen
      treffen. Het vijfde lid, vierde en vijfde volzin, en het zesde lid, zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel26
  - number: '26.9'
    text: Van een beschikking van de ondernemingskamer staat uitsluitend beroep in cassatie open.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel26
  - number: '27.1'
    text: |-
      De ondernemer behoeft de instemming van de ondernemingsraad voor elk door hem voorgenomen besluit tot vaststelling,
      wijziging of intrekking van:
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel27
  - number: 27.1.a
    text: regelingen op grond van een pensioenovereenkomst, een winstdelingsregeling of een spaarregeling;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel27
  - number: 27.1.b
    text: een arbeids- en rusttijdenregeling of een vakantieregeling;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel27
  - number: 27.1.c
    text: een belonings- of een functiewaarderingssysteem;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel27
  - number: 27.1.d
    text: een regeling op het gebied van de arbeidsomstandigheden, het ziekteverzuim of het reintegratiebeleid;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel27
  - number: 27.1.e
    text: een regeling op het gebied van het aanstellings-, ontslag- of bevorderingsbeleid;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel27
  - number: 27.1.f
    text: een regeling op het gebied van de personeelsopleiding;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel27
  - number: 27.1.g
    text: een regeling op het gebied van de personeelsbeoordeling;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel27
  - number: 27.1.h
    text: een regeling op het gebied van het bedrijfsmaatschappelijk werk;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel27
  - number: 27.1.i
    text: een regeling op het gebied van het werkoverleg;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel27
  - number: 27.1.j
    text: een regeling op het gebied van de behandeling van klachten;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel27
  - number: 27.1.k
    text: |-
      een regeling omtrent het verwerken van alsmede de bescherming van de persoonsgegevens van de in de onderneming
      werkzame personen;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel27
  - number: 27.1.l
    text: |-
      een regeling inzake voorzieningen die gericht zijn op of geschikt zijn voor waarneming van of controle op
      aanwezigheid, gedrag of prestaties van de in de onderneming werkzame personen;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel27
  - number: 27.1.m
    text: |-
      een procedure voor het omgaan met het melden van een vermoeden van een misstand, als bedoeld in
      [artikel 2, eerste lid, van de Wet Huis voor klokkenluiders][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037852#Artikel2
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0037852
        artikel: '2'
  - number: '27.2'
    text: |-
      De ondernemer legt het te nemen besluit schriftelijk aan de ondernemingsraad voor. Hij verstrekt daarbij een
      overzicht van de beweegredenen voor het besluit, alsmede van de gevolgen die het besluit naar te verwachten
      valt voor de in de onderneming werkzame personen zal hebben. De ondernemingsraad beslist niet dan nadat over de
      betrokken aangelegenheid ten minste éénmaal overleg is gepleegd in een overlegvergadering. Na het overleg deelt de
      ondernemingsraad zo spoedig mogelijk schriftelijk en met redenen omkleed zijn beslissing aan de ondernemer mee. Na
      de beslissing van de ondernemingsraad deelt de ondernemer zo spoedig mogelijk schriftelijk aan de ondernemingsraad
      mee welk besluit hij heeft genomen en met ingang van welke datum hij dat besluit zal uitvoeren.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel27
  - number: '27.3'
    text: |-
      De in het eerste lid bedoelde instemming is niet vereist, voor zover de betrokken aangelegenheid voor
      de onderneming reeds inhoudelijk is geregeld in een collectieve arbeidsovereenkomst of een regeling van
      arbeidsvoorwaarden vastgesteld door een publiekrechtelijk orgaan. Instemming is eveneens niet vereist voor zover
      ter zake van een aangelegenheid als bedoeld in het eerste lid, onderdeel a, sprake is van verplichte deelneming in
      een bedrijfstakpensioenfonds als bedoeld in [artikel 1 van de Pensioenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '1'
  - number: '27.4'
    text: |-
      Heeft de ondernemer voor het voorgenomen besluit geen instemming van de ondernemingsraad verkregen, dan kan hij
      de kantonrechter toestemming vragen om het besluit te nemen. De kantonrechter geeft slechts toestemming, indien
      de beslissing van de ondernemingsraad om geen instemming te geven onredelijk is, of het voorgenomen besluit van
      de ondernemer gevergd wordt door zwaarwegende bedrijfsorganisatorische, bedrijfseconomische of bedrijfssociale
      redenen.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel27
  - number: '27.5'
    text: |-
      Een besluit als bedoeld in het eerste lid, genomen zonder de instemming van de ondernemingsraad of de toestemming
      van de kantonrechter, is nietig, indien de ondernemingsraad tegenover de ondernemer schriftelijk een beroep op de
      nietigheid heeft gedaan. De ondernemingsraad kan slechts een beroep op de nietigheid doen binnen een maand nadat
      hetzij de ondernemer hem zijn besluit overeenkomstig de laatste volzin van het tweede lid heeft meegedeeld, hetzij
        - bij gebreke van deze mededeling - de ondernemingsraad is gebleken dat de ondernemer uitvoering of toepassing
      geeft aan zijn besluit.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel27
  - number: '27.6'
    text: |-
      De ondernemingsraad kan de kantonrechter verzoeken de ondernemer te verplichten zich te onthouden van handelingen
      die strekken tot uitvoering of toepassing van een nietig besluit als bedoeld in het vijfde lid. De ondernemer kan
      de kantonrechter verzoeken te verklaren dat de ondernemingsraad ten onrechte een beroep heeft gedaan op nietigheid
      als bedoeld in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel27
  - number: '27.7'
    text: |-
      Onder regelingen op grond van een pensioenovereenkomst als bedoeld in het eerste lid, onderdeel a, worden mede
      verstaan regelingen opgenomen in een uitvoeringsovereenkomst als bedoeld in [artikel 1 van de Pensioenwet][ref1]
      of een uitvoeringsreglement als bedoeld in onderdeel b van de definitie van uitvoeringsreglement in artikel 1
      van de Pensioenwet, die van invloed zijn op de pensioenovereenkomst waaronder in ieder geval worden begrepen:
      regelingen over de wijze waarop de verschuldigde premie wordt vastgesteld, de maatstaven voor en de voorwaarden
      waaronder toeslagverlening plaatsvindt en de keuze voor onderbrenging bij een bepaalde pensioenuitvoerder,
      pensioeninstelling uit een andere lidstaat of verzekeraar met zetel buiten Nederland als bedoeld in
      [artikel 23, eerste lid, van de Pensioenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel23
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '23'
  - number: '28.1'
    text: |-
      De ondernemingsraad bevordert zoveel als in zijn vermogen ligt de naleving van de voor de onderneming geldende
      voorschriften op het gebied van de arbeidsvoorwaarden, alsmede van de voorschriften op het gebied van de
      arbeidsomstandigheden en arbeids- en rusttijden van de in de onderneming werkzame personen.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel28
  - number: '28.2'
    text: |-
      De ondernemingsraad bevordert voorts naar vermogen het werkoverleg, alsmede het overdragen van bevoegdheden in de
      onderneming, zodat de in de onderneming werkzame personen zoveel mogelijk worden betrokken bij de regeling van de
      arbeid in het onderdeel van de onderneming waarin zij werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel28
  - number: '28.3'
    text: |-
      De ondernemingsraad waakt in het algemeen tegen discriminatie in de onderneming en bevordert in het bijzonder
      de gelijke behandeling van mannen en vrouwen alsmede de inschakeling van gehandicapten en minderheden in de
      onderneming.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel28
  - number: '28.4'
    text: |-
      De ondernemingsraad bevordert naar vermogen de zorg van de onderneming voor het milieu, waaronder begrepen het
      treffen of wijzigen van beleidsmatige, organisatorische en administratieve voorzieningen in verband met het milieu.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel28
  - number: '29'
    text: |-
      De ondernemingsraad heeft het recht, al dan niet uit zijn midden, een door de ondernemer te bepalen aantal, maar
      ten minste de helft, te benoemen van de bestuursleden van door de ondernemer ten behoeve van in de onderneming
      werkzame personen opgerichte instellingen, behoudens voor zover bij of krachtens de wet op andere wijze in het
      bestuur van een instelling is voorzien.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel29
  - number: '30.1'
    text: |-
      De ondernemingsraad wordt door de ondernemer in de gelegenheid gesteld advies uit te brengen over elk door hem
      voorgenomen besluit tot benoeming of ontslag van een bestuurder van de onderneming.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel30
  - number: '30.2'
    text: |-
      Het advies moet op een zodanig tijdstip worden gevraagd, dat het van wezenlijke invloed kan zijn op het te nemen
      besluit.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel30
  - number: '30.3'
    text: |-
      De ondernemer stelt de ondernemingsraad in kennis van de beweegredenen voor het besluit en
      verstrekt voorts in het geval van een benoeming gegevens waaruit de ondernemingsraad zich een
      oordeel kan vormen over de betrokkene, in verband met diens toekomstige functie in de onderneming.
      [Artikel 25, vierde lid en vijfde lid, eerste en tweede volzin][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel25
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '25'
        hoofdstuk: IVA
  - number: '31.1'
    text: |-
      De ondernemer is verplicht desgevraagd aan de ondernemingsraad en aan de commissies van die raad tijdig alle
      inlichtingen en gegevens te verstrekken die deze voor de vervulling van hun taak redelijkerwijze nodig hebben. De
      inlichtingen en gegevens worden desgevraagd schriftelijk verstrekt.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel31
  - number: '31.2'
    text: |-
      De ondernemer is verplicht aan de ondernemingsraad bij het begin van iedere zittingsperiode schriftelijk gegevens
      te verstrekken omtrent:
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel31
  - number: 31.2.a
    text: |-
      de rechtsvorm van de ondernemer, waarbij indien de ondernemer een niet-publiekrechtelijke rechtspersoon is, mede de
      statuten van die rechtspersoon moeten worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel31
  - number: 31.2.b
    text: |-
      indien de ondernemer een natuurlijke persoon, een maatschap of een niet-rechtspersoonlijkheid bezittende
      vennootschap is: de naam en de woonplaats van onderscheidenlijk die persoon, de maten of de beherende vennoten;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel31
  - number: 31.2.c
    text: 'indien de ondernemer een rechtspersoon is: de naam en de woonplaats van de commissarissen of de bestuursleden;'
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel31
  - number: 31.2.d
    text: |-
      indien de ondernemer deel uitmaakt van een aantal in een groep verbonden ondernemers: de ondernemers die deel
      uitmaken van die groep, de zeggenschapsverhoudingen waardoor zij onderling zijn verbonden, alsmede de naam en
      de woonplaats van degenen die ten gevolge van de bedoelde verhoudingen feitelijke zeggenschap over de ondernemer
      kunnen uitoefenen;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel31
  - number: 31.2.e
    text: |-
      de ondernemers of de instellingen met wie de ondernemer, anders dan uit hoofde van zeggenschapsverhoudingen als
      bedoeld onder *d*, duurzame betrekkingen onderhoudt die van wezenlijk belang kunnen zijn voor het voortbestaan van
      de onderneming, alsmede de naam en de woonplaats van degenen die ten gevolge van zodanige betrekkingen feitelijke
      zeggenschap over de ondernemer kunnen uitoefenen;
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel31
  - number: 31.2.f
    text: |-
      de organisatie van de onderneming, de naam en de woonplaats van de bestuurders en van de belangrijkste overige
      leidinggevende personen, alsmede de wijze waarop de bevoegdheden tussen de bedoelde personen zijn verdeeld.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel31
  - number: '31.3'
    text: |-
      Het tweede lid, onderdeel d, strekt zich ook uit tot de ondernemer die deel uitmaakt van een internationale groep
      van ondernemingen. Het tweede lid, onderdeel e, strekt zich ook uit tot de ondernemer die anders dan uit hoofde
      van zeggenschapsverhoudingen als bedoeld in de vorige zin, duurzame betrekkingen met buitenlandse ondernemers of
      instellingen onderhoudt.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel31
  - number: '31.4'
    text: |-
      De ondernemer is verplicht de ondernemingsraad zo spoedig mogelijk in kennis te stellen van wijzigingen die zich in
      de in het tweede lid bedoelde gegevens hebben voorgedaan.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel31
  - number: 31a.1
    text: |-
      De ondernemer verstrekt, mede ten behoeve van de bespreking van de algemene gang van zaken van de onderneming,
      ten minste tweemaal per jaar aan de ondernemingsraad mondeling of schriftelijk algemene gegevens omtrent de
      werkzaamheden en de resultaten van de onderneming in het verstreken tijdvak, in het bijzonder met betrekking tot
      aangelegenheden als bedoeld in [artikel 25][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel25
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '25'
        hoofdstuk: IVA
  - number: 31a.2
    text: |-
      Indien de onderneming in stand wordt gehouden door een stichting of vereniging als bedoeld in
      [artikel 360, derde lid, van boek 2 van het Burgerlijk Wetboek][ref1], een coöperatie, een onderlinge
      waarborgmaatschappij, een naamloze vennootschap of een besloten vennootschap met beperkte aansprakelijkheid,
      verstrekt de ondernemer zo spoedig mogelijk na de vaststelling van zijn jaarrekening een exemplaar van de
      jaarrekening en het bestuursverslag in de Nederlandse taal en de daarbij te voegen overige gegevens, als bedoeld in
      [artikel 392 van Boek 2 van het Burgerlijk Wetboek][ref2], ter bespreking aan de ondernemingsraad. De mededeling die
      een rechtspersoon ingevolge [artikel 362, zesde lid, laatste volzin, van Boek 2 van het Burgerlijk Wetboek][ref3]
      moet verstrekken geschiedt gelijktijdig met die aan de algemene vergadering.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel360
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel392
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel362
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '360'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '392'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '362'
  - number: 31a.3
    text: |-
      Indien de financiële gegevens van een ondernemer die deel uitmaakt van in een groep
      verbonden ondernemers zijn opgenomen in een geconsolideerde jaarrekening als bedoeld in
      [artikel 405 van Boek 2 van het Burgerlijk Wetboek][ref1], verstrekt de ondernemer ter bespreking aan de
      ondernemingsraad deze geconsolideerde jaarrekening, het bestuursverslag en de overige gegevens, bedoeld in
      [artikel 392 van dat boek][ref2], van de rechtspersoon die de geconsolideerde jaarrekening heeft opgesteld.
      Indien de financiële gegevens van zulk een ondernemer niet in een geconsolideerde jaarrekening zijn opgenomen,
      verstrekt de ondernemer in plaats hiervan ter bespreking aan de ondernemingsraad schriftelijke gegevens waaruit
      de ondernemingsraad zich een inzicht kan vormen in het gezamenlijke resultaat van de ondernemingen van die groep
      ondernemers.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel405
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel392
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '405'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '392'
  - number: 31a.4
    text: |-
      Indien de jaarrekening van de ondernemer betrekking heeft op meer dan één onderneming, verstrekt de ondernemer aan
      de ondernemingsraad tevens schriftelijke gegevens waaruit deze zich een inzicht kan vormen in de mate waarin de
      onderneming waarvoor hij is ingesteld tot het gezamenlijke resultaat van die ondernemingen heeft bijgedragen. Het
      voorgaande is van overeenkomstige toepassing, indien een geconsolideerde jaarrekening, als bedoeld in het derde
      lid, wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel31a
  - number: 31a.5
    text: |-
      Indien de onderneming in stand wordt gehouden door een ondernemer op wie het tweede lid van dit artikel niet van
      toepassing is, verstrekt de ondernemer bij algemene maatregel van bestuur aangewezen vervangende schriftelijke
      gegevens ter bespreking aan de ondernemingsraad. Het derde en vierde lid van dit artikel zijn van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel31a
  - number: 31a.6
    text: |-
      De ondernemer doet, mede ten behoeve van de bespreking van de algemene gang van zaken van de onderneming, ten
      minste tweemaal per jaar aan de ondernemingsraad mondeling of schriftelijk mededeling omtrent zijn verwachtingen
      ten aanzien van de werkzaamheden en de resultaten van de onderneming in het komende tijdvak, in het bijzonder met
      betrekking tot aangelegenheden als bedoeld in [artikel 25][ref1], alsmede met betrekking tot alle investeringen in
      binnenland en buitenland.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel25
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '25'
        hoofdstuk: IVA
  - number: 31a.7
    text: |-
      Indien de ondernemer met betrekking tot de onderneming een meerjarenplan, dan wel een raming of een begroting van
      inkomsten of uitgaven pleegt op te stellen, wordt dat plan, onderscheidenlijk die raming of die begroting, dan wel
      een samenvatting daarvan, met een toelichting aan de ondernemingsraad verstrekt en in de bespreking betrokken. Het
      derde en vierde lid van dit artikel zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel31a
  - number: 31b.1
    text: |-
      De ondernemer verstrekt, mede ten behoeve van de bespreking van de algemene gang van zaken van de onderneming,
      ten minste éénmaal per jaar aan de ondernemingsraad schriftelijk algemene gegevens inzake de aantallen en de
      verschillende groepen van de in de onderneming werkzame personen, alsmede inzake het door hem in het afgelopen
      jaar ten aanzien van die personen gevoerde sociale beleid, in het bijzonder met betrekking tot aangelegenheden
      als bedoeld in de [artikelen 27][ref1], [28][ref2] en [29][ref3]. Deze gegevens worden kwantitatief zodanig
      gespecificeerd dat daaruit blijkt welke uitwerking de verschillende onderdelen van het sociale beleid hebben gehad
      voor afzonderlijke bedrijfsonderdelen en functiegroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0002747#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0002747#Artikel29
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel31b
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '27'
        hoofdstuk: IVA
      - id: ref2
        bwb_id: BWBR0002747
        artikel: '28'
        hoofdstuk: IVA
      - id: ref3
        bwb_id: BWBR0002747
        artikel: '29'
        hoofdstuk: IVA
  - number: 31b.2
    text: |-
      De ondernemer doet daarbij tevens mondeling of schriftelijk mededeling van zijn verwachtingen ten aanzien van de
      ontwikkeling van de personeelsbezetting in het komende jaar, alsmede van het door hem in dat jaar te voeren sociale
      beleid, in het bijzonder met betrekking tot aangelegenheden als bedoeld in de [artikelen 27][ref1], [28][ref2]
      en [29][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0002747#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0002747#Artikel29
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel31b
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '27'
        hoofdstuk: IVA
      - id: ref2
        bwb_id: BWBR0002747
        artikel: '28'
        hoofdstuk: IVA
      - id: ref3
        bwb_id: BWBR0002747
        artikel: '29'
        hoofdstuk: IVA
  - number: 31b.3
    text: |-
      De ondernemer verstrekt, mede ten behoeve van de bespreking van de algemene gang van zaken van de onderneming,
      tevens ten minste éénmaal per jaar aan de ondernemingsraad schriftelijk algemene gegevens inzake de op
      grond van een uitzendovereenkomst in de onderneming werkzame personen en doet daarbij tevens mondeling of
      schriftelijk mededeling ten aanzien van de te verwachten ontwikkelingen wat betreft het aantal op basis van een
      uitzendovereenkomst werkzame personen in het komende jaar.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel31b
  - number: 31c
    text: |-
      De ondernemer doet aan de ondernemingsraad zo spoedig mogelijk mededeling van zijn voornemen tot het verstrekken
      van een adviesopdracht aan een deskundige buiten de onderneming, met betrekking tot een aangelegenheid als bedoeld
      in [artikel 27][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel27
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel31c
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '27'
        hoofdstuk: IVA
  - number: 31d.1
    text: |-
      De ondernemer verstrekt, mede ten behoeve van de bespreking van de algemene gang van zaken van de onderneming,
      ten minste eenmaal per jaar aan de ondernemingsraad schriftelijk informatie over de hoogte en inhoud van de
      arbeidsvoorwaardelijke regelingen en afspraken per verschillende groep van de in de onderneming werkzame personen.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel31d
  - number: 31d.2
    text: |-
      De ondernemer verstrekt daarbij tevens schriftelijke informatie over de hoogte en inhoud van de
      arbeidsvoorwaardelijke regelingen en afspraken met het bestuur dat de rechtspersoon vertegenwoordigt en het totaal
      van de vergoedingen, dat wordt verstrekt aan het toezichthoudend orgaan, bedoeld in [artikel 24, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel24
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel31d
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '24'
        hoofdstuk: IV
  - number: 31d.3
    text: |-
      Ten aanzien van het eerste en tweede lid wordt inzichtelijk gemaakt met welk percentage deze arbeidsvoorwaardelijke
      regelingen en afspraken zich verhouden tot elkaar en tot die van het voorgaande jaar.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel31d
  - number: 31d.4
    text: |-
      Indien een groep, als bedoeld in het eerste lid, het bestuur of het toezichthoudend orgaan, bedoeld in het tweede
      lid, uit minder dan vijf personen bestaat, is het mogelijk om voor de toepassing van deze leden twee of meer
      functies samen te voegen, zodat een groep van ten minste vijf personen ontstaat.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel31d
  - number: 31d.5
    text: |-
      De ondernemer is verplicht de ondernemingsraad zo spoedig mogelijk in kennis te stellen van belangrijke wijzigingen
      die in deze regelingen en afspraken worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel31d
  - number: 31d.6
    text: |-
      Dit artikel is uitsluitend van toepassing op ondernemingen waarin in de regel ten minste 100 personen werkzaam
      zijn.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel31d
  - number: 31e
    text: |-
      [Artikel 31d][ref1] is niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel31d
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel31e
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: 31d
        hoofdstuk: IVB
  - number: 31e.a
    text: |-
      de besloten vennootschap met beperkte aansprakelijkheid waarvan een van de bestuurders of commissarissen
      een natuurlijk persoon is die een direct of indirect belang heeft in de rechtspersoon overeenkomstig
      [artikel 4.6 van de Wet inkomstenbelasting 2001][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel31e
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
  - number: 31e.b
    text: |-
      de rechtspersoon waarop de [artikelen 396][ref1] of [397 van titel 9 van Boek 2 van het Burgerlijk Wetboek][ref2]
      van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel396
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel397
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel31e
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '396'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '397'
  - number: 31f
    text: |-
      De ondernemer is verplicht de ondernemingsraad zo spoedig mogelijk schriftelijk te informeren over
      elke voorgenomen vaststelling, wijziging of intrekking van een uitvoeringsovereenkomst als bedoeld in
      [artikel 1 van de Pensioenwet][ref1] of een uitvoeringsreglement als bedoeld in onderdeel b van de definitie van
      uitvoeringsreglement in artikel 1 van de Pensioenwet.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel31f
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '1'
  - number: '32.1'
    text: |-
      Bij collectieve arbeidsovereenkomst of een regeling van arbeidsvoorwaarden vastgesteld door een publiekrechtelijk
      orgaan kunnen aan de ondernemingsraad of aan de ondernemingsraden van de bij die overeenkomst of die regeling
      betrokken onderneming of ondernemingen verdere bevoegdheden dan in deze wet genoemd worden toegekend.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel32
  - number: '32.2'
    text: |-
      Bij schriftelijke overeenkomst tussen de ondernemer en de ondernemingsraad kunnen aan de ondernemingsraad meer
      bevoegdheden dan de in deze wet genoemde worden toegekend en kunnen aanvullende voorschriften over de toepassing
      van het bij of krachtens deze wet bepaalde worden gegeven. De ondernemer zendt een afschrift van de overeenkomst
      aan de bedrijfscommissie.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel32
  - number: '32.3'
    text: |-
      Indien aan de ondernemingsraad op grond van dit artikel een adviesrecht of instemmingsrecht is toegekend, is het
      advies of de instemming van de ondernemingsraad niet vereist, voor zover de aangelegenheid voor de onderneming
      reeds inhoudelijk is geregeld in een collectieve arbeidsovereenkomst of in een regeling, vastgesteld door een
      publiekrechtelijk orgaan.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel32
  - number: '32.4'
    text: |-
      Indien in de overeenkomst aan de ondernemingsraad een recht op advies of instemming wordt gegeven over
      andere voorgenomen besluiten dan genoemd in de [artikelen 25][ref1] onderscheidenlijk [27][ref2], zijn de
      [artikelen 26][ref3] onderscheidenlijk [27, vierde tot en met zesde lid][ref4], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002747#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0002747#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0002747#Artikel27
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '25'
        hoofdstuk: IVA
      - id: ref2
        bwb_id: BWBR0002747
        artikel: '27'
        hoofdstuk: IVA
      - id: ref3
        bwb_id: BWBR0002747
        artikel: '26'
        hoofdstuk: IVA
      - id: ref4
        bwb_id: BWBR0002747
        artikel: '27'
        hoofdstuk: IVA
  - number: '33.1'
    text: |-
      De ondernemer die twee of meer ondernemingsraden heeft ingesteld stelt tevens voor de door hem in stand gehouden
      ondernemingen een centrale ondernemingsraad in indien dit bevorderlijk is voor een goede toepassing van deze wet
      ten aanzien van deze ondernemingen.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel33
  - number: '33.2'
    text: |-
      De ondernemer die meer dan twee ondernemingsraden heeft ingesteld stelt voor een aantal van de door hem in stand
      gehouden ondernemingen een groepsondernemingsraad in indien dit bevorderlijk is voor een goede toepassing van deze
      wet ten aanzien van deze ondernemingen.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel33
  - number: '33.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing ten aanzien van in een groep verbonden ondernemers,
      die te zamen twee of meer ondernemingsraden hebben ingesteld. De betrokken ondernemers wijzen een tot hun groep
      behorende ondernemer aan, die voor de toepassing van deze wet namens hen als ondernemer optreedt ten opzichte van
      de centrale ondernemingsraad of de groepsondernemingsraad.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel33
  - number: '34.1'
    text: |-
      Een centrale ondernemingsraad bestaat uit leden, gekozen door de betrokken ondernemingsraden uit de leden van elk
      van die raden. Voor ieder lid kan een plaatsvervanger worden gekozen, die dezelfde rechten en verplichtingen heeft
      als het lid dat hij vervangt.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel34
  - number: '34.2'
    text: |-
      Indien een of meer groepsondernemingsraden zijn ingesteld, kan de centrale ondernemingsraad in zijn reglement
      bepalen, dat die raad, in afwijking van het bepaalde in het eerste lid, geheel of ten dele zal bestaan uit leden,
      gekozen door de betrokken groepsondernemingsraden uit de leden van die raden. Voor ieder aldus gekozen lid kan een
      plaatsvervanger worden gekozen, die dezelfde rechten en verplichtingen heeft als het lid dat hij vervangt.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel34
  - number: '34.3'
    text: |-
      Het aantal leden dat uit elke ondernemingsraad of groepsondernemingsraad kan worden gekozen, wordt vastgesteld
      in het reglement van de centrale ondernemingsraad. Het reglement bevat voorts voorzieningen dat de verschillende
      groepen van de in de betrokken ondernemingen werkzame personen zoveel mogelijk in de centrale ondernemingsraad
      vertegenwoordigd zijn. De betrokken ondernemingsraden of groepsondernemingsraden worden over de vaststelling van de
      betrokken bepalingen van het reglement gehoord.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel34
  - number: '34.4'
    text: |-
      Een centrale ondernemingsraad kan in zijn reglement bepalen dat van die raad, behalve de in het derde lid bedoelde
      leden, ook deel kunnen uitmaken vertegenwoordigers van ondernemingen die door de in [artikel 33][ref1] bedoelde
      ondernemer of ondernemers in stand worden gehouden, maar ten aanzien waarvan geen verplichting tot het instellen
      van een ondernemingsraad geldt. De centrale ondernemingsraad regelt in zijn reglement het aantal en de wijze van
      verkiezing van de bedoelde vertegenwoordigers.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel33
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '33'
        hoofdstuk: V
  - number: '34.5'
    text: |-
      Wanneer een lid van een centrale ondernemingsraad of zijn plaatsvervanger ophoudt lid te zijn van de
      ondernemingsraad of van de groepsondernemingsraad die hem heeft gekozen, eindigt van rechtswege zijn lidmaatschap
      van de centrale ondernemingsraad. Het zelfde geldt wanneer een vertegenwoordiger van een onderneming als
      bedoeld in het vierde lid ophoudt in de betrokken onderneming werkzaam te zijn. De uitsluiting, bedoeld in
      [artikel 13][ref1], van een ondernemingsraadlid of van een groepsondernemingsraadlid, die tevens lid is van een
      centrale ondernemingsraad, heeft tot gevolg dat de betrokkene ook van deelname aan de werkzaamheden van de centrale
      ondernemingsraad is uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel13
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '13'
        hoofdstuk: III
  - number: '34.6'
    text: |-
      Ten aanzien van de centrale ondernemingsraad zijn de [artikelen 7][ref1], [8][ref2], [10][ref3]-[14][ref4],
      [15, eerste, tweede, vierde en vijfde lid][ref5], en [16][ref6]-[22][ref7] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002747#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002747#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0002747#Artikel14
      [ref5]: https://wetten.overheid.nl/BWBR0002747#Artikel15
      [ref6]: https://wetten.overheid.nl/BWBR0002747#Artikel16
      [ref7]: https://wetten.overheid.nl/BWBR0002747#Artikel22
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '7'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002747
        artikel: '8'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0002747
        artikel: '10'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0002747
        artikel: '14'
        hoofdstuk: III
      - id: ref5
        bwb_id: BWBR0002747
        artikel: '15'
        hoofdstuk: III
      - id: ref6
        bwb_id: BWBR0002747
        artikel: '16'
        hoofdstuk: III
      - id: ref7
        bwb_id: BWBR0002747
        artikel: '22'
        hoofdstuk: III
  - number: '34.7'
    text: |-
      Ten aanzien van een groepsondernemingsraad zijn de voorgaande leden, met uitzondering van het tweede lid, van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel34
  - number: '35.1'
    text: |-
      Ten aanzien van de centrale ondernemingsraden en de groepsondernemingsraden zijn de [artikelen 22a][ref1] tot
      en met [32][ref2], met uitzondering van de [artikelen 23c][ref3] en [24, derde lid][ref4], van overeenkomstige
      toepassing, met dien verstande dat door die raden uitsluitend aangelegenheden worden behandeld die van
      gemeenschappelijk belang zijn voor alle of voor de meerderheid van de ondernemingen waarvoor zij zijn ingesteld en
      ongeacht of ten aanzien van die aangelegenheden bevoegdheden toekomen aan de afzonderlijke ondernemingsraden.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel22a
      [ref2]: https://wetten.overheid.nl/BWBR0002747#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0002747#Artikel23c
      [ref4]: https://wetten.overheid.nl/BWBR0002747#Artikel24
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: 22a
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002747
        artikel: '32'
        hoofdstuk: IVC
      - id: ref3
        bwb_id: BWBR0002747
        artikel: 23c
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0002747
        artikel: '24'
        hoofdstuk: IV
  - number: '35.2'
    text: |-
      Indien bevoegdheden ten aanzien van aangelegenheden als bedoeld in het eerste lid toekomen aan afzonderlijke
      ondernemingsraden, gaan deze over naar de centrale ondernemingsraad, onderscheidenlijk de groepsondernemingsraad,
      met dien verstande dat een groepsondernemingsraad geen aangelegenheden behandelt die door de centrale
      ondernemingsraad worden behandeld.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel35
  - number: 35b.1
    text: |-
      De ondernemer die een onderneming in stand houdt waarin in de regel ten minste 10 personen maar minder dan 50
      personen werkzaam zijn en waarvoor geen ondernemingsraad of een personeelsvertegenwoordiging is ingesteld, is
      verplicht de in deze onderneming werkzame personen tenminste tweemaal per kalenderjaar in de gelegenheid te stellen
      gezamenlijk met hem bijeen te komen. Hij is voorts verplicht met de in de onderneming werkzame personen bijeen te
      komen, wanneer tenminste een vierde van hen daartoe een met redenen omkleed verzoek doet.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel35b
  - number: 35b.2
    text: |-
      In de in het eerste lid bedoelde vergaderingen worden de aangelegenheden, de onderneming betreffende, aan de orde
      gesteld ten aanzien waarvan de ondernemer of in de onderneming werkzame personen overleg wenselijk achten. Iedere
      in de onderneming werkzame persoon is bevoegd omtrent deze aangelegenheden voorstellen te doen en standpunten
      kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel35b
  - number: 35b.3
    text: |-
      Indien de ondernemer de onderneming niet zelf bestuurt, wordt het overleg voor hem gevoerd door de bestuurder
      van de onderneming. De ondernemer en de bestuurder kunnen zich bij verhindering laten vervangen door een in de
      onderneming werkzame persoon die bevoegd is om namens de ondernemer overleg met de werknemers te voeren.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel35b
  - number: 35b.4
    text: |-
      In de in het eerste lid bedoelde vergaderingen wordt tenminste eenmaal per jaar de algemene gang van zaken van
      de onderneming besproken. De ondernemer verstrekt daartoe mondeling of schriftelijk algemene gegevens omtrent
      de werkzaamheden en de resultaten van de onderneming in het afgelopen jaar, alsmede omtrent zijn verwachtingen
      dienaangaande in het komende jaar. Voor zover de ondernemer verplicht is zijn jaarrekening en bestuursverslag
      ter inzage van een ieder neer te leggen, worden in de Nederlandse taal gestelde exemplaren van deze jaarstukken
      ter bespreking aan de in de onderneming werkzame personen verstrekt. De ondernemer verstrekt voorts mondeling of
      schriftelijk algemene gegevens inzake het door hem ten aanzien van de in de onderneming werkzame personen gevoerde
      en te voeren sociale beleid.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel35b
  - number: 35b.5
    text: |-
      De in de onderneming werkzame personen worden door de ondernemer, in een vergadering als bedoeld in het eerste
      lid, in de gelegenheid gesteld advies uit te brengen over elk door hem voorgenomen besluit dat kan leiden tot
      verlies van de arbeidsplaats of tot een belangrijke verandering van de arbeid, de arbeidsvoorwaarden of de
      arbeidsomstandigheden van tenminste een vierde van de in de onderneming werkzame personen. Het advies wordt op
      een zodanig tijdstip gevraagd dat het van wezenlijke invloed kan zijn op het te nemen besluit. De in de eerste
      volzin bedoelde verplichting geldt niet, indien en voor zover de betrokken aangelegenheid voor de onderneming
      reeds inhoudelijk geregeld is in een collectieve arbeidsovereenkomst of in een regeling, vastgesteld door een
      publiekrechtelijk orgaan.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel35b
  - number: 35b.6
    text: |-
      De in de voorgaande leden bedoelde verplichtingen gelden niet ten aanzien van personen die nog geen zes maanden
      in de onderneming werkzaam zijn. Zij vervallen wanneer de ondernemer met toepassing van [artikel 5a][ref1]
      een ondernemingsraad heeft ingesteld, maar treden weer in werking wanneer de ondernemingsraad op grond van
      [artikel 5a, eerste lid][ref2], ophoudt te bestaan of overeenkomstig het tweede lid van dat artikel is opgeheven.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0002747#Artikel5a
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel35b
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: 5a
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002747
        artikel: 5a
        hoofdstuk: II
  - number: 35c.1
    text: |-
      De ondernemer die een onderneming in stand houdt waarin in de regel ten minste 10 personen maar minder dan 50
      personen werkzaam zijn en waarvoor geen ondernemingsraad is ingesteld, kan een personeelsvertegenwoordiging
      instellen, bestaande uit ten minste drie personen die rechtstreeks gekozen zijn bij geheime schriftelijke stemming
      door en uit in de onderneming werkzame personen.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel35c
  - number: 35c.2
    text: |-
      Op verzoek van de meerderheid van de in de onderneming werkzame personen stelt de ondernemer de in het eerste lid
      bedoelde personeelsvertegenwoordiging in.
    url: https://wetten.overheid.nl/BWBR0002747/2016-10-01#Artikel35c
  - number: 35c.3
    text: |-
      Indien toepassing is gegeven aan het eerste lid, is
      [artikel 5a, tweede lid, derde en vierde volzin][ref1], van overeenkomstige toepassing. De
      artikelen [7][ref2], [13][ref3],[ 17][ref4], [18, eerste en tweede lid][ref5], [21][ref6],
      __REF006___________________________________________________________________________________________________________
      ________, [22a][ref8],
      __REF008___________________________________________________________________________________________________________
      _______________________, [31, eerste lid][ref10], [32][ref11], [35b, vierde en vijfde lid][ref12], behoudens de in
      dat lid bedoelde arbeidsomstandigheden, en [36][ref13] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0002747#Artikel7
