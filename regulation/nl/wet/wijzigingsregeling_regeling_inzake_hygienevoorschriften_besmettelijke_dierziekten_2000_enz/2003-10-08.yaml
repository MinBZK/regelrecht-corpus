preamble:
  text: |-
    Gelet op de artikelen 10, eerste lid en tweede lid, onderdeel b, 11, eerste lid, 17, 18, 30 en 94, 94a en 94b van
    de Gezondheids- en welzijnswet voor dieren;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0015633/2003-10-08#ArtikelAanhef
articles:
  - number: III
    text: |-
      1 Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst en werkt, voor zover het [artikel II, onderdeel B][ref1] betreft, terug tot en met 1 mei 2003.

      2 De slachtplaats met geringe capaciteit die bij de inwerkingtreding van deze regeling niet voldoet aan de
      vereisten van de [Regeling inzake hygiënevoorschriften besmettelijke dierziekten 2000][ref2], beschikt uiterlijk
      binnen 5 maanden na inwerkingtreding van deze regeling over een reinigings- en ontsmettingsplaats als bedoeld in
      [artikel 5, eerste of derde lid, van de Regeling inzake hygiënevoorschriften besmettelijke dierziekten 2000][ref3]
      dan wel een vergunning als bedoeld in [artikel 5, vierde lid, van die regeling][ref4].

      3 Een aanvraag als bedoeld in
      [artikel 5b, eerste lid, van de Regeling inzake hygiënevoorschriften besmettelijke dierziekten 2000][ref5] wordt
      binnen 6 weken na de inwerkingtreding van deze regeling overeenkomstig het in dat lid bepaalde ingediend.


