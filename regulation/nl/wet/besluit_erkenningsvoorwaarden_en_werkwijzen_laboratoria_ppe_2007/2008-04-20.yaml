  - number: '3'
    text: |-
      Een laboratorium dat door de voorzitter op grond van [artikel 2][ref1] erkend is, blijft voldoen aan de in de
      [bijlage l][ref2] genoemde voorwaarden voor erkenning.


      [ref1]: https://wetten.overheid.nl/BWBR0023558#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0023558
