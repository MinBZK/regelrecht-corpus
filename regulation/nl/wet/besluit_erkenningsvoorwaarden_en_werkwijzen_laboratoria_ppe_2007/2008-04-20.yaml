    text: |-
      De voorzitter kan een laboratorium als bedoeld in
      [artikel 4 van de Verordening hygiënevoorschriften pluimveehouderij (PPE) 2007][ref1] en
      [artikel 4 van de Verordening hygiënevoorschriften pluimveeverwerkende industrie (PPE) 2007][ref2] erkennen,
      indien het naar zijn oordeel voldoet aan de in [bijlage l][ref3] opgenomen voorwaarden voor erkenning.


