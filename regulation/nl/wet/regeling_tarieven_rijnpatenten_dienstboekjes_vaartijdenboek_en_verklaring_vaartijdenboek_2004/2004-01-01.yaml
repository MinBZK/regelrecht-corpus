      - id: ref1
        bwb_id: BWBR0006029
      - id: ref2
        bwb_id: BWBR0007858
        artikel: '23'
  - number: '3.2'
    text: |-
      Voor de afgifte van een verklaring bij het vaartijdenboek, bedoeld in artikel
      26, derde lid, van de [Wet vaartijden en bemanningssterkte binnenvaart][ref1] en
      [artikel 23.08, vierde lid, van het Reglement onderzoek schepen op de Rijn 1995][ref2], is een vergoeding
      verschuldigd van € 4,20.


      [ref1]: https://wetten.overheid.nl/BWBR0006029
      [ref2]: https://wetten.overheid.nl/BWBR0007858#Artikel23
