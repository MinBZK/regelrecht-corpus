  url: https://wetten.overheid.nl/BWBR0016070/2004-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: Voor de afgifte van een Rijnpatent is een vergoeding verschuldigd van € 46,30.
    url: https://wetten.overheid.nl/BWBR0016070/2004-01-01#Artikel1
  - number: '1.2'
    text: |-
      Voor de uitbreiding, het verlengen, het vervangen of het omruilen van een Rijnpatent is een vergoeding verschuldigd
      van € 26,60.
    url: https://wetten.overheid.nl/BWBR0016070/2004-01-01#Artikel1
  - number: '2.1'
    text: |-
      Voor de afgifte van een dienstboekje, bedoeld in
      [artikel 23.04, eerste lid, van het Reglement onderzoek schepen op de Rijn 1995][ref1] en
      [artikel 2.06, eerste lid, van het Reglement Rijnpatenten 1998][ref2], is een vergoeding verschuldigd van € 12.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0008934#Artikel2
    url: https://wetten.overheid.nl/BWBR0016070/2004-01-01#Artikel2
