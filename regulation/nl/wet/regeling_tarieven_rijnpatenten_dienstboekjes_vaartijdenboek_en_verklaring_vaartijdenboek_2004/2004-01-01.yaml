        artikel: '2'
  - number: '2.2'
    text: Voor het jaarlijks afstempelen van een dienstboekje is een vergoeding verschuldigd van € 4,20.
    url: https://wetten.overheid.nl/BWBR0016070/2004-01-01#Artikel2
  - number: '3.1'
    text: |-
      Voor de afgifte van een vaartijdenboek, bedoeld in artikel 25, onder
      a, van de [Wet vaartijden en bemanningssterkte binnenvaart][ref1] en
      [artikel 23.08, eerste lid, van het Reglement onderzoek schepen op de Rijn 1995][ref2], is een vergoeding
      verschuldigd van € 14.


      [ref1]: https://wetten.overheid.nl/BWBR0006029
      [ref2]: https://wetten.overheid.nl/BWBR0007858#Artikel23
    url: https://wetten.overheid.nl/BWBR0016070/2004-01-01#Artikel3
