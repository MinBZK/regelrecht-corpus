    url: https://wetten.overheid.nl/BWBR0016070/2004-01-01#Artikel3
  - number: '4'
    text: De Regeling tarieven Rijnpatenten, dienstboekjes, vaartijdenboek en verklaring vaartijdenboek wordt ingetrokken.
