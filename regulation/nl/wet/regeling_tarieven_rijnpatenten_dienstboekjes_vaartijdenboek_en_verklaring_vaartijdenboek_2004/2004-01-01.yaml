  - number: '3.3'
    text: Voor het verrichten van mutaties in het vaartijdenboek is een vergoeding verschuldigd van € 4,20.
    url: https://wetten.overheid.nl/BWBR0016070/2004-01-01#Artikel3
  - number: '3.4'
    text: |-
      Voor het verrichten van mutaties in een verklaring bij het vaartijdenboek is een vergoeding verschuldigd van
