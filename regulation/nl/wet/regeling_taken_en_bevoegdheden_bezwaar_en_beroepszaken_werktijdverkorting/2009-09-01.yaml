regulatory_layer: WET
publication_date: '2009-11-10'
valid_from: '2009-09-01'
bwb_id: BWBR0016492
url: https://wetten.overheid.nl/BWBR0016492/2009-09-01
preamble:
  text: |-
    Gelet op artikel 22, eerste lid, van het Organisatie-, mandaat- en volmachtbesluit SZW 2004;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0016492/2009-09-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Het hoofd van de afdeling Juridische Zaken van de Arbeidsinspectie is belast met het behandelen van
      bezwaar- en beroepszaken naar aanleiding van beslissingen op verzoeken om ontheffing als bedoeld in
      [artikel 8, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref1] alsmede met juridische
      advisering op het gebied van werktijdverkorting.


      [ref1]: https://wetten.overheid.nl/BWBR0002014#Artikel8
    url: https://wetten.overheid.nl/BWBR0016492/2009-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002014
        artikel: '8'
  - number: '1.2'
    text: |-
      Aan het hoofd van de afdeling Juridische Zaken van de Arbeidsinspectie wordt in het kader van de behandeling van de
      bezwaar- en beroepszaken, bedoeld in het eerste lid, mandaat en machtiging verleend met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0016492/2009-09-01#Artikel1
  - number: 1.2.a
    text: de afhandeling van administratieve stukken;
    url: https://wetten.overheid.nl/BWBR0016492/2009-09-01#Artikel1
  - number: 1.2.b
    text: het machtigen van personen om een bewindspersoon in gerechtelijke procedures te vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0016492/2009-09-01#Artikel1
  - number: '2.1'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst en werkt terug tot en met 1 januari 2004.
    url: https://wetten.overheid.nl/BWBR0016492/2009-09-01#Artikel2
  - number: '2.2'
    text: 'Deze regeling wordt aangehaald als: Regeling taken en bevoegdheden bezwaar- en beroepszaken werktijdverkorting.'
    url: https://wetten.overheid.nl/BWBR0016492/2009-09-01#Artikel2
