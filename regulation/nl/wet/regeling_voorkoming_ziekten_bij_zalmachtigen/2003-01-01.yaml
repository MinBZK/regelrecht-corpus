publication_date: '2008-07-22'
valid_from: '2003-01-01'
bwb_id: BWBR0005632
url: https://wetten.overheid.nl/BWBR0005632/2003-01-01
preamble:
  text: |-
    Gelet op artikel 2b van de Visserijwet 1963 (Stb. 312) en artikel 3 van het Reglement zee- en kustvisserij 1977
    (Stb. 666);

    Gehoord het Produktschap voor Vis en Visprodukten en de Organisatie ter Verbetering van de Binnenvisserij;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0005632/2003-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:




                *bedrijf:*


                inrichting, of in het algemeen elke geografisch begrensde installatie, waarin zalmachtigen worden
      gekweekt om in de handel te worden gebracht;




                *kweker:*


                degene die zalmachtigen kweekt op een bedrijf;




                *handelaar:*


                degene die bedrijfsmatig vis in de handel brengt of anderszins handelt in vis met uitzondering van de
      verkoop in de detailhandel.




      2 Voor de toepassing van deze regeling wordt mede verstaan onder:

      a. zalmachtigen: de eieren en gameten van zalmachtigen

      b. kweken: het laten toenemen van vis in gewicht.
    url: https://wetten.overheid.nl/BWBR0005632/2003-01-01#Artikel1
  - number: '2'
    text: |-
      1 Kwekers zijn verplicht hun bedrijf te laten registreren.

      2 Registratie als bedoeld in het eerste lid geschiedt door de Minister van Landbouw, Natuurbeheer en Visserij.
    url: https://wetten.overheid.nl/BWBR0005632/2003-01-01#Artikel2
  - number: '3'
    text: |-
      1 Kwekers zijn verplicht toe te staan dat door ambtenaren als bedoeld in
      [artikel 114, tweede lid, van de Gezondheids- en welzijnswet voor dieren][ref1], ten behoeve van
      laboratoriumonderzoek voor het vaststellen van eventueel aanwezige visziekten:

      a. zalmachtigen bij wijze van monstername worden meegenomen;

      b. bij zalmachtigen bloed of ovariële vloeistof wordt afgenomen;

      c. medewerking te verlenen bij de uitvoering van deze handelingen.

      2 De omvang van de monstername of het afnemen van bloed of ovariële. vloeistoffen, als bedoeld in het eerste lid,
      is niet groter dan voor een verantwoord onderzoek noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel114
    url: https://wetten.overheid.nl/BWBR0005632/2003-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '114'
  - number: '4'
    text: |-
      Kwekers en handelaren zijn verplicht een in- en uitslagregister bij te houden van geleverde en ontvangen partijen
      zalmachtigen, waaruit moet blijken:

      1. indien de vis wordt geleverd:

      a. de datum van verzending,

      b. degene aan wie wordt geleverd, alsmede diens adres,

      c. de vervoerder,

      d. de vissoort,

      e. per vissoort het aantal exemplaren,

      f. per vissoort het gewicht, en,

      2. indien de vis wordt ontvangen:

      a. de datum van ontvangst,

      b. de leverancier, alsmede diens adres,

      c. de vervoerder,

      d. de vissoort,

      e. per vissoort het aantal exemplaren,

      f. per vissoort het gewicht,

      g. sterfte tijdens het transport.
    url: https://wetten.overheid.nl/BWBR0005632/2003-01-01#Artikel4
  - number: '5'
    text: |-
      Alle desbetreffende aantekeningen en bescheiden, zoals nota's, brieven en andere bewijsstukken,
      boeken, registers of andere hulpmiddelen waarin gegevens als bedoeld in [artikel 4][ref1] zijn
      vastgelegd, dienen vanaf het tijdstip van hun opstelling of verkrijging tot het tijdstip waarop
      twee kalenderjaren zijn verlopen, op een geordende wijze te worden bewaard. De ambtenaar, bedoeld in
      [artikel 114, tweede lid, van de Gezondheids- en welzijnswet voor dieren][ref2] kan ter zake aanwijzingen geven.


      [ref1]: https://wetten.overheid.nl/BWBR0005632#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel114
    url: https://wetten.overheid.nl/BWBR0005632/2003-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005632
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005662
        artikel: '114'
  - number: '6'
    text: |-
      1 Deze regeling treedt in werking met ingang van de dag na die van haar bekendmaking in de Staatscourant.

      2 Deze regeling kan worden aangehaald als: Regeling voorkoming ziekten bij zalmachtigen.
    url: https://wetten.overheid.nl/BWBR0005632/2003-01-01#Artikel6
