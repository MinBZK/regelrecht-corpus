---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_voorkoming_ziekten_bij_zalmachtigen
regulatory_layer: WET
publication_date: '2008-07-22'
valid_from: '2003-01-01'
bwb_id: BWBR0005632
url: https://wetten.overheid.nl/BWBR0005632/2003-01-01
preamble:
  text: |-
    Gelet op artikel 2b van de Visserijwet 1963 (Stb. 312) en artikel 3 van het Reglement zee- en kustvisserij 1977
    (Stb. 666);

    Gehoord het Produktschap voor Vis en Visprodukten en de Organisatie ter Verbetering van de Binnenvisserij;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0005632/2003-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:


                *bedrijf:*


                inrichting, of in het algemeen elke geografisch begrensde installatie, waarin zalmachtigen worden
      gekweekt om in de handel te worden gebracht;




                *kweker:*


                degene die zalmachtigen kweekt op een bedrijf;




                *handelaar:*


                degene die bedrijfsmatig vis in de handel brengt of anderszins handelt in vis met uitzondering van de
      verkoop in de detailhandel.
    url: https://wetten.overheid.nl/BWBR0005632/2003-01-01#Artikel1
  - number: '1.2'
    text: 'Voor de toepassing van deze regeling wordt mede verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005632/2003-01-01#Artikel1
  - number: 1.2.a
    text: 'zalmachtigen: de eieren en gameten van zalmachtigen'
    url: https://wetten.overheid.nl/BWBR0005632/2003-01-01#Artikel1
  - number: 1.2.b
    text: 'kweken: het laten toenemen van vis in gewicht.'
    url: https://wetten.overheid.nl/BWBR0005632/2003-01-01#Artikel1
  - number: '2.1'
    text: Kwekers zijn verplicht hun bedrijf te laten registreren.
    url: https://wetten.overheid.nl/BWBR0005632/2003-01-01#Artikel2
  - number: '2.2'
    text: Registratie als bedoeld in het eerste lid geschiedt door de Minister van Landbouw, Natuurbeheer en Visserij.
    url: https://wetten.overheid.nl/BWBR0005632/2003-01-01#Artikel2
  - number: '3.1'
    text: |-
      Kwekers zijn verplicht toe te staan dat door ambtenaren als bedoeld in
      [artikel 114, tweede lid, van de Gezondheids- en welzijnswet voor dieren][ref1], ten behoeve van
      laboratoriumonderzoek voor het vaststellen van eventueel aanwezige visziekten:


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel114
    url: https://wetten.overheid.nl/BWBR0005632/2003-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '114'
  - number: 3.1.a
    text: zalmachtigen bij wijze van monstername worden meegenomen;
    url: https://wetten.overheid.nl/BWBR0005632/2003-01-01#Artikel3
  - number: 3.1.b
    text: bij zalmachtigen bloed of ovariële vloeistof wordt afgenomen;
    url: https://wetten.overheid.nl/BWBR0005632/2003-01-01#Artikel3
  - number: 3.1.c
    text: medewerking te verlenen bij de uitvoering van deze handelingen.
    url: https://wetten.overheid.nl/BWBR0005632/2003-01-01#Artikel3
  - number: '3.2'
    text: |-
      De omvang van de monstername of het afnemen van bloed of ovariële. vloeistoffen, als bedoeld in het eerste lid, is
      niet groter dan voor een verantwoord onderzoek noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0005632/2003-01-01#Artikel3
  - number: '4'
    text: |-
      Kwekers en handelaren zijn verplicht een in- en uitslagregister bij te houden van geleverde en ontvangen partijen
      zalmachtigen, waaruit moet blijken:
    url: https://wetten.overheid.nl/BWBR0005632/2003-01-01#Artikel4
  - number: '4.1'
    text: 'indien de vis wordt geleverd:'
    url: https://wetten.overheid.nl/BWBR0005632/2003-01-01#Artikel4
  - number: 4.1.a
    text: de datum van verzending,
    url: https://wetten.overheid.nl/BWBR0005632/2003-01-01#Artikel4
  - number: 4.1.b
    text: degene aan wie wordt geleverd, alsmede diens adres,
    url: https://wetten.overheid.nl/BWBR0005632/2003-01-01#Artikel4
  - number: 4.1.c
    text: de vervoerder,
    url: https://wetten.overheid.nl/BWBR0005632/2003-01-01#Artikel4
  - number: 4.1.d
    text: de vissoort,
    url: https://wetten.overheid.nl/BWBR0005632/2003-01-01#Artikel4
  - number: 4.1.e
    text: per vissoort het aantal exemplaren,
    url: https://wetten.overheid.nl/BWBR0005632/2003-01-01#Artikel4
  - number: 4.1.f
    text: per vissoort het gewicht, en,
    url: https://wetten.overheid.nl/BWBR0005632/2003-01-01#Artikel4
  - number: '4.2'
    text: 'indien de vis wordt ontvangen:'
    url: https://wetten.overheid.nl/BWBR0005632/2003-01-01#Artikel4
  - number: 4.2.a
    text: de datum van ontvangst,
    url: https://wetten.overheid.nl/BWBR0005632/2003-01-01#Artikel4
  - number: 4.2.b
    text: de leverancier, alsmede diens adres,
    url: https://wetten.overheid.nl/BWBR0005632/2003-01-01#Artikel4
  - number: 4.2.c
    text: de vervoerder,
    url: https://wetten.overheid.nl/BWBR0005632/2003-01-01#Artikel4
  - number: 4.2.d
    text: de vissoort,
    url: https://wetten.overheid.nl/BWBR0005632/2003-01-01#Artikel4
  - number: 4.2.e
    text: per vissoort het aantal exemplaren,
    url: https://wetten.overheid.nl/BWBR0005632/2003-01-01#Artikel4
  - number: 4.2.f
    text: per vissoort het gewicht,
    url: https://wetten.overheid.nl/BWBR0005632/2003-01-01#Artikel4
  - number: 4.2.g
    text: sterfte tijdens het transport.
    url: https://wetten.overheid.nl/BWBR0005632/2003-01-01#Artikel4
  - number: '5'
    text: |-
      Alle desbetreffende aantekeningen en bescheiden, zoals nota's, brieven en andere bewijsstukken,
      boeken, registers of andere hulpmiddelen waarin gegevens als bedoeld in [artikel 4][ref1] zijn
      vastgelegd, dienen vanaf het tijdstip van hun opstelling of verkrijging tot het tijdstip waarop
      twee kalenderjaren zijn verlopen, op een geordende wijze te worden bewaard. De ambtenaar, bedoeld in
      [artikel 114, tweede lid, van de Gezondheids- en welzijnswet voor dieren][ref2] kan ter zake aanwijzingen geven.


      [ref1]: https://wetten.overheid.nl/BWBR0005632#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel114
    url: https://wetten.overheid.nl/BWBR0005632/2003-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005632
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005662
        artikel: '114'
  - number: '6.1'
    text: Deze regeling treedt in werking met ingang van de dag na die van haar bekendmaking in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0005632/2003-01-01#Artikel6
  - number: '6.2'
    text: 'Deze regeling kan worden aangehaald als: Regeling voorkoming ziekten bij zalmachtigen.'
    url: https://wetten.overheid.nl/BWBR0005632/2003-01-01#Artikel6
