preamble:
  text: |-
    Gelet op artikel 10, eerste en vierde lid, van richtlijn nr. 90/425/EEG van de Raad van de Europese Gemeenschappen
    van 26 juni 1990 inzake veterinaire en zoötechnische controles in het intracommunautaire handelsverkeer in bepaalde
    levende dieren en producten in het vooruitzicht van de totstandbrenging van de interne markt (PbEG L 224);

    Gelet op artikel 17, 30 en 31 van de Gezondheids- en welzijnswet voor dieren;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0022505/2007-09-17#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a.

      b. evenhoevigen: herkauwers en varkens;

      c. Verenigd Koninkrijk: Verenigd Koninkrijk, met uitzondering van Noord-Ierland.
    url: https://wetten.overheid.nl/BWBR0022505/2007-09-17#Artikel1
  - number: '4'
    text: |-
      1 Een vervoermiddel waarmee een of meer paardachtigen vanuit het Verenigd Koninkrijk in Nederland worden gebracht
      wordt terstond na lossing gereinigd en ontsmet.

      2 Een vervoermiddel dat kennelijk is gebruikt voor het vervoeren van een of meer paardachtigen, in het Verenigd
      Koninkrijk en leeg vanuit het Verenigd Koninkrijk, anders dan in doorvoer in Nederland wordt gebracht, wordt zo
      spoedig mogelijk na binnenkomst in Nederland gereinigd en ontsmet.
    url: https://wetten.overheid.nl/BWBR0022505/2007-09-17#Artikel4
  - number: '5'
    text: |-
      1 De houder van evenhoevigen houdt een register bij van alle bedrijfsmatige bezoeken waarin tenminste wordt
      opgenomen:

      a. de datum van het bezoek;

      b. de naam van de bezoeker, en indien van toepassing

      c. de naam van het bedrijf in opdracht waarvan hij het bedrijf waar evenhoevigen verblijven bezoekt.

      2 De houder van evenhoevigen bewaart het register, bedoeld in het eerste lid, gedurende ten minste 3 maanden.
    url: https://wetten.overheid.nl/BWBR0022505/2007-09-17#Artikel5
  - number: '6'
    text: |-
      Deze regeling wordt aangehaald als: Tijdelijke regeling maatregelen mond- en klauwzeer Verenigd Koninkrijk 2007
      (II).
    url: https://wetten.overheid.nl/BWBR0022505/2007-09-17#Artikel6
  - number: '7'
    text: Deze regeling wordt aan de media bekendgemaakt en treedt op 12 september 2007, om 19.00 uur in werking.
    url: https://wetten.overheid.nl/BWBR0022505/2007-09-17#Artikel7
