  - number: '1.2'
    text: |-
      Voor de toepassing van deze regeling maken besloten ruimten die zijn gelegen in één gebouw, dan wel in verscheidene
      belendende of nagenoeg belendende gebouwen, waarin dezelfde natuurlijke persoon of rechtspersoon, LPG-installaties
      inbouwt, deel uit van één werkplaats.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel1
  - number: '2.1'
    text: |-
      Een erkenning voor het verrichten van gekwalificeerde inbouw van LPG-installaties in motorrijtuigen kan worden
      verleend aan een natuurlijk persoon of rechtspersoon die exploitant is van:
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel2
  - number: 2.1.a
    text: één of meer in Nederland gevestigde bedrijven die LPG-installaties in motorrijtuigen inbouwen;
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel2
  - number: 2.1.b
    text: |-
      één of meer in Nederland gevestigde onderhoudsdiensten voor het eigen wagenpark die LPG-installaties inbouwen in
      motorrijtuigen behorende tot het eigen wagenpark.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel2
  - number: '2.2'
    text: |-
      Indien de aanvraag van de erkenning betrekking heeft op motorrijtuigen die in het Vestigingsbesluit bedrijven als
      motorvoertuigen worden aangemerkt, geldt ten aanzien van de in het eerste lid, onderdeel a, bedoelde bedrijven dat
      de aanvraag betrekking moet hebben op inrichtingen waarin het ingevolge de [Vestigingswet Bedrijven 1954][ref1]
      en eerdergenoemd vestigingsbesluit is toegestaan, het vervoermiddelenbedrijf als bedoeld in [artikel 7][ref2] van
      bedoeld besluit uit te oefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002130
      [ref2]: https://wetten.overheid.nl/BWBR0007077#Artikel7
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002130
      - id: ref2
        bwb_id: BWBR0007077
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '2.3'
    text: |-
      Een erkenning kan worden verleend voor één of meer werkplaatsen indien deze elk voldoen aan de in de
      [artikelen 3][ref1] tot en met [10][ref2] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0007077#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007077#Artikel10
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007077
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007077
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '3.1'
    text: |-
      De organisatiestructuur van het bedrijf moet in een organogram worden vastgelegd, waarin ten minste die functies
      moeten zijn vermeld welke een relatie hebben met de kwaliteitsborging van de LPG-inbouw.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel3
  - number: '3.2'
    text: |-
      Er moet, door middel van een verklaring, een directievertegenwoordiger zijn aangewezen die bevoegd en
      verantwoordelijk is voor het invoeren en op peil houden van het kwaliteitssysteem zoals bedoeld in de
      [hoofdstukken 2][ref1] en [4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007077#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0007077#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007077
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007077
        hoofdstuk: '4'
  - number: '3.3'
    text: |-
      Met betrekking tot de hiernavolgende aspecten moet zijn vastgelegd welke personen verantwoordelijk zijn voor de
      juiste uitvoering van de aan die aspecten verbonden voorschriften alsmede welke personen bevoegd zijn tot het nemen
      van maatregelen om er voor te zorgen dat aan de voorschriften wordt voldaan:
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel3
  - number: 3.3.a
    text: beheersing van documenten;
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel3
  - number: 3.3.b
    text: ingangscontrole;
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel3
  - number: 3.3.c
    text: algemene voorwaarden voor (inbouw)procesbeheersing;
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel3
  - number: 3.3.d
    text: eindcontrole;
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel3
  - number: 3.3.e
    text: vrijgave voertuig;
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel3
  - number: 3.3.f
    text: controle- en meetmiddelen;
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel3
  - number: 3.3.g
    text: |-
      kwaliteitsregistratie, als bedoeld in [artikel 30][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007077#Artikel30
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007077
        artikel: '30'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '3.4'
    text: |-
      Tevens moet zijn vastgelegd wie de plaatsvervangers zijn van de in het derde lid bedoelde personen of moet zijn
      vastgelegd dat bij afwezigheid van één of meerdere van deze personen de desbetreffende werkzaamheden niet worden
      uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel3
  - number: '4.1'
    text: |-
      Het inbouwproces moet geschieden in een overdekte en behoorlijk af te sluiten en goed verlichte ruimte welke
      voorzien is van verwarming.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel4
  - number: '4.2'
    text: |-
      De in het eerste lid bedoelde ruimte moet zodanige afmetingen hebben en zodanig zijn ingericht dat de
      motorrijtuigen waarin een LPG-installatie wordt ingebouwd in deze ruimte zodanig kunnen worden opgesteld dat zij
      van alle zijden goed toegankelijk zijn.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel4
  - number: '4.3'
    text: |-
      In de in het eerste lid bedoelde ruimte moet een doelmatige inspectieput of hefinrichting aanwezig zijn die
      geschikt is voor de motorrijtuigen waarin een LPG-installatie wordt ingebouwd. De inspectieput of hefinrichting
      moet degene die de inbouw verricht, in staat stellen de onderkant van een voertuig nagenoeg over de gehele lengte
      rechtopstaand te bewerken, hetgeen betekent dat de inspectieput een diepte en de hefinrichting een hefhoogte moet
      hebben van ten minste 1,40 m.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel4
  - number: '4.4'
    text: |-
      De inspectieput of hefinrichting moet zijn voorzien van een doelmatige verlichting; dit geldt niet voor
      hefinrichtingen welke niet zijn voorzien van rijplaten.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel4
  - number: '4.5'
    text: 'In de in het eerste lid bedoelde ruimte moet:'
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel4
  - number: 4.5.a
    text: |-
      een doelmatige voorziening aanwezig zijn waarmee uitlaatgassen direct door een daartoe bestemde opening naar buiten
      kunnen worden afgevoerd, en
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel4
  - number: 4.5.b
    text: |-
      ten behoeve van de controle van de afstelling van de koplampen met behulp van het koplamptestapparaat, een vlakke,
      horizontale of nagenoeg horizontale, vloer van voldoende afmetingen aanwezig zijn waarop gelijktijdig zowel het in
      te bouwen motorrijtuig als het koplamptestapparaat kunnen worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel4
  - number: '4.6'
    text: |-
      Er moet een ruimte aanwezig zijn waarin de administratie ter zake van de keuringen behoorlijk kan worden
      uitgevoerd: in deze ruimte moet zich een afsluitbare kast dan wel een gelijkwaardige voorziening bevinden, waarin
      waardepapieren zoals kenteken-delen afgesloten kunnen worden bewaard.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel4
  - number: '4.7'
    text: De in het eerste of zesde lid bedoelde ruimte moet zijn aangesloten op het openbare telefoonnet.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel4
  - number: '4.8'
    text: |-
      In de in het eerste of in het zesde lid bedoelde ruimte moet een voorziening aanwezig zijn, geschikt voor het
      gebruik van datacommunicatie. Deze voorziening moet bestaan uit een computer of terminal met een modem, geschikt
      voor de toegangsstructuur van een door de Dienst Wegverkeer geaccepteerd netwerk.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel4
  - number: '5'
    text: 'In de werkplaats moet de volgende apparatuur aanwezig zijn:'
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel5
  - number: 5.a
    text: |-
      een uitlaatgastester met lambdabepaling. Een eventuele koolmonoxidemeter met bijbehorende fles kalibratiegas
      mag uitsluitend worden gebruikt voor motorrijtuigen met een verbrandingsmotor met elektrische ontsteking,
      waarop de uitlaatgasmeting met lambdabepaling, bedoeld in [artikel 5.2.11, negende lid][ref1], dan wel
      [artikel 5.3.11, achtste lid, van het Voertuigreglement][ref2] niet van toepassing is. De uitlaatgastester
      met lambdabepaling alsmede de koolmonoxidemeter moeten voldoen aan de in [artikel 6][ref3] gestelde
      eisen. De fles kalibratiegas moet voldoen aan de eisen, gesteld in [artikel 1.3, eerste lid][ref4], en
      [artikel 1.6, derde lid, van de Voorschriften meetmiddelen 1997][ref5] en moet zich bevinden in een houder die
      geschikt is in relatie tot de constructie van de koolmonoxidemeter;


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0007077#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0009237#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0009237#Artikel1
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0006746
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0007077
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0009237
        artikel: '1'
      - id: ref5
        bwb_id: BWBR0009237
        artikel: '1'
  - number: 5.b
    text: |-
      een koplamptestapparaat welke voldoet aan de in [hoofdstuk 3][ref1],
      [paragraaf 10, van de Voorschriften meetmiddelen 1997][ref2] gestelde eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0009237#Paragraaf10
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009237
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0009237
        paragraaf: '10'
  - number: 5.c
    text: een apparaat waarmee een gasconcentratie overeenkomende met 800 ppm LPG gedetecteerd kan worden (lekgaszoeker);
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel5
  - number: 5.d
    text: |-
      een toerenteller welke voldoet aan de in [hoofdstuk 3][ref1],
      [paragraaf 2, van de Voorschriften meetmiddelen 1997][ref2] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0009237#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009237
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0009237
        paragraaf: '2'
  - number: '6.1'
    text: |-
      Ten aanzien van de uitlaatgastester met lambdabepaling, de koolmonoxidemeter en de toerenteller dient de aanvrager
      te beschikken over een certificaat van eerste keuring dan wel een certificaat van herkeuring als bedoeld in
      [hoofdstuk 1][ref1], [paragraaf 2, van de Voorschriften meetmiddelen 1997][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0009237#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009237
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0009237
        paragraaf: '2'
  - number: '6.2'
    text: |-
      Het certificaat van eerste keuring moet zijn afgegeven door een keuringsinstelling, het certificaat van herkeuring
      door een keuringsinstelling dan wel een onderzoeksgerechtigde.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel6
  - number: '6.3'
    text: |-
      De in het eerste lid bedoelde certificaten mogen op het tijdstip van indiening van de aanvraag hun geldigheid niet
      hebben verloren.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel6
  - number: '9'
    text: |-
      De apparatuur, bedoeld in [artikel 5][ref1], moet ook overigens deugdelijk zijn en in goede staat van onderhoud
      verkeren.


      [ref1]: https://wetten.overheid.nl/BWBR0007077#Artikel5
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007077
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '10.1'
    text: |-
      In de werkplaats moet ten minste één persoon werkzaam zijn die in het bezit is van een geldig diploma LPG-technicus
      afgegeven door de Stichting VAM, overeenkomstig een door de Dienst Wegverkeer goedgekeurd reglement.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel10
  - number: '10.2'
    text: |-
      De Dienst Wegverkeer bepaalt aan welke voorwaarden voldaan moet worden alvorens deelgenomen kan worden aan het
      examen LPG-technicus. Deze voorwaarden zullen in de Staatscourant bekend worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel10
  - number: '11'
    text: |-
      Voor de aanvraag van een erkenning wordt door de aanvrager een aanvraagformulier, volgens een door de Dienst
      Wegverkeer vastgesteld en in de Staatscourant bekendgemaakt model, bij de RDW ingediend.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel11
  - number: '12.1'
    text: |-
      De aanvrager van een erkenning moet, zoveel mogelijk tegelijk met het in [artikel 11][ref1] bedoelde
      aanvraagformulier, de volgende bescheiden overleggen:


      [ref1]: https://wetten.overheid.nl/BWBR0007077#Artikel11
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007077
        artikel: '11'
        hoofdstuk: '3'
  - number: 12.1.a
    text: |-
      voor zover inschrijving in het handelsregister ingevolge de [Handelsregisterwet 1996][ref1] verplicht is, een niet
      eerder dan één jaar vóór het tijdstip van indiening van de aanvraag door de secretaris van de Kamer van Koophandel
      en Fabrieken, waarbij de aanvrager of een onderneming waarop de aanvraag betrekking heeft, is ingeschreven,
      verstrekt uittreksel, afschrift, fotografische reproduktie of schriftelijke mededeling, waaruit blijkt dat de
      aanvrager of de onderneming op het tijdstip van afgifte van dat geschrift was ingeschreven in het handelsregister;


      [ref1]: https://wetten.overheid.nl/BWBR0007893
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007893
  - number: 12.1.b
    text: |-
      voor zover inschrijving in het handelsregister ingevolge [boek 2 van het Burgerlijk Wetboek][ref1] verplicht is
      of inschrijving in het handelsregister ingevolge [artikel 30, derde lid, van Boek 2 van genoemde wetboek][ref2]
      is geschied, een niet eerder dan één jaar vóór het tijdstip van indiening van de aanvraag door de secretaris van
      de Kamer van Koophandel en Fabrieken waarbij de aanvrager is ingeschreven, verstrekte afdruk of schriftelijke
      mededeling, waaruit blijkt dat de aanvrager op het tijdstip van afgifte van die afdruk of mededeling was
      ingeschreven in het handelsregister;


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel30
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '30'
  - number: 12.1.c
    text: |-
      indien de aanvraag namens de aanvrager door een ander wordt ingediend, een gewaarmerkt afschrift van een geschrift
      waaruit blijkt dat die ander tot de vertegenwoordiging bevoegd is;
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel12
  - number: 12.1.d
    text: |-
      voor zover van toepassing, een afschrift van de ingevolge [artikel 2, tweede lid][ref1], vereiste vergunningen
      voor het autobedrijf dan wel ontheffingen van het verbod het autobedrijf zonder vergunning uit te oefenen, die hun
      geldigheid niet hebben verloren;


      [ref1]: https://wetten.overheid.nl/BWBR0007077#Artikel2
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007077
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 12.1.e
    text: |-
      voor elke werkplaats waarvoor de erkenning wordt aangevraagd, een plattegrond van de werkplaats en de ruimte
      waarin de administratie ter zake van de inbouw moet worden gevoerd. Op de plattegrond moet zijn aangegeven waar de
      inspectieput of de hefinrichting zich bevindt alsmede de plaats waar de controle op de afstelling van de koplampen
      met het koplamptestapparaat, zoals bedoeld in [artikel 4, vijfde lid, onder b][ref1], zal plaatsvinden;


      [ref1]: https://wetten.overheid.nl/BWBR0007077#Artikel4
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007077
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 12.1.f
    text: |-
      voor zover ingevolge [artikel 6][ref1] voor vereiste meetmiddelen een certificaat wordt verlangd, een afschrift van
      dat certificaat;


      [ref1]: https://wetten.overheid.nl/BWBR0007077#Artikel6
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007077
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 12.1.g
    text: |-
      een afschrift van het in [artikel 10][ref1] genoemde diploma afgegeven aan de personen die in het aanvraagformulier
      als bevoegd tot inbouw zijn vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0007077#Artikel10
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007077
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '13'
    text: |-
      Indien aan de aanvrager van een erkenning al eerder een erkenning is verleend, doch op grond
      van [artikel 103, van de wet][ref1], deze is ingetrokken, kan, onverminderd het bepaalde in
      [artikel 101, derde lid, van de wet][ref2], door de Dienst Wegverkeer worden bepaald dat van
      [onderdelen van artikel 12][ref3] kan worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel103
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel101
      [ref3]: https://wetten.overheid.nl/BWBR0007077#Artikel12
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '103'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '101'
      - id: ref3
        bwb_id: BWBR0007077
        artikel: '12'
        hoofdstuk: '3'
  - number: '14'
    text: |-
      Aan de erkenning worden de in de [artikelen 15][ref1] tot en met [31][ref2] opgenomen voorschriften verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0007077#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0007077#Artikel31
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007077
        artikel: '15'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007077
        artikel: '31'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '15.1'
    text: |-
      Indien de erkenning is verleend aan de exploitant van één of meer bedrijven die reparaties of onderhoud
      aan voertuigen verrichten, en de erkenning voor de betrokken inrichtingen voor auto's in de zin van het
      Vestigingsbesluit motorvoertuig- en fietsbedrijven 1967 geldt, is de exploitant verplicht er zorg voor te dragen
      dat hij blijft voldoen aan de ingevolge de [Vestigingswet bedrijven 1954][ref1] en voornoemd vestigingsbesluit
      geldende voorwaarden om in die inrichtingen bedrijfsmatig de handelingen te mogen verrichten die zijn bedoeld in
      artikel 2, eerste lid, onder a, van meergenoemd vestigingsbesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0002130
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002130
  - number: '15.2'
    text: |-
      Indien de erkenning wordt verleend aan de exploitant van een onderhoudsdienst voor het eigen wagenpark, gelden voor
      de exploitant de volgende verplichtingen:
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel15
  - number: 15.2.a
    text: |-
      indien een andere rechtspersoon of andere rechtspersonen in een zodanig verband tot de erkenninghouder staat of
      staan dat er sprake is van één economische eenheid, dient daarvan, onder opgave van de naam en het adres van die
      rechtspersoon of rechtspersonen, terstond na de verlening van de erkenning schriftelijk opgave te worden gedaan
      aan de RDW. Dit verband moet ten genoege van de Dienst Wegverkeer worden aangetoond, d.m.v. een uittreksel uit het
      handelsregister of een accountantsverklaring;
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel15
  - number: 15.2.b
    text: |-
      indien zich wijzigingen in de samenstelling van de economische eenheid voordoen dient de erkenninghouder deze
      vooraf schriftelijk aan de RDW te melden.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel15
  - number: '17.1'
    text: De erkenninghouder moet in verband met de inbouw het bij en krachtens de wet bepaalde in acht nemen.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel17
  - number: '17.2'
    text: |-
      De erkenninghouder moet de inbouw van LPG-installaties verrichten met inachtneming van de ingevolge de
      [artikelen 6.1][ref1] en [6.7, tweede lid, van het Voertuigreglement][ref2], gestelde eisen en gebruik makende van
      de in [artikel 5][ref3] vermelde apparatuur.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0007077#Artikel5
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0006746
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0007077
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '17.3'
    text: De inbouw van LPG-installaties mag alleen plaatsvinden in de werkplaatsen waarvoor de erkenning is verleend.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel17
  - number: '17.4'
    text: |-
      Indien door de erkenninghouder ook G3-gassystemen worden ingebouwd, dient voor wat betreft deze systemen
      uit omschrijvingen en bewijsstukken duidelijk de relatie te blijken tussen de erkenninghouder en de
      fabrikant, importeur of leverancier van deze systemen. Het betreft hier onder meer informatieverstrekking en
      inbouwinstructies, alsmede de mogelijkheid voor terugkoppeling betreffende de juistheid en compleetheid daarvan.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel17
  - number: '18.1'
    text: |-
      Vanaf de buitenkant van elke werkplaats waarvoor de erkenning geldt is op een door de Dienst Wegverkeer
      vastgestelde en in de Staatscourant bekendgemaakte wijze zichtbaar dat de erkenning is verleend.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel18
  - number: '18.2'
    text: |-
      In elke werkplaats waarvoor de erkenning geldt moet de door de Dienst Wegverkeer afgegeven beschikking, waaruit
      blijkt dat voor de werkplaats een erkenning is verleend, aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel18
  - number: '18.3'
    text: |-
      Op verzoek van de aanvrager van een inbouw van een LPG-installatie moet de in het tweede lid bedoelde beschikking
      ter inzage worden gegeven.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel18
  - number: '19'
    text: |-
      De werkplaats waarvoor de erkenning geldt moet voortdurend blijven voldoen aan de in de [artikelen 2][ref1] tot en
      met [9][ref2] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0007077#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007077#Artikel9
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0007077
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007077
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '20.1'
    text: |-
      Ten aanzien van de uitlaatgastester met lambdabepaling, de koolmonoxidemeter en de toerenteller moet steeds een
      geldig certificaat van eerste keuring dan wel herkeuring aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel20
  - number: '20.2'
    text: |-
      De koolmonoxydemeter moet, alvorens te worden gebruikt, worden gekalibreerd, waarbij het volgende in acht moet
      worden genomen:
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel20
  - number: 20.2.a
    text: |-
      de kalibratie moet geschieden met gecertificeerd kalibratiegas overeenkomstig de gebruiksaanwijzing van de
      fabrikant;
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel20
  - number: 20.2.b
    text: |-
      de kalibratie moet periodiek worden herhaald en het resultaat van elke kalibratie moet worden vastgelegd op een
      controlelijst waarvan een model is weergegeven in [bijlage 2][ref1]. De uiterste datum waarop de koolmonoxydemeter
      opnieuw moet worden gekalibreerd wordt na elke kalibratie volgens de in [bijlage 2][ref2] beschreven systematiek
      bepaald en wordt op de controlelijst aangegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0007077
      [ref2]: https://wetten.overheid.nl/BWBR0007077
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0007077
      - id: ref2
        bwb_id: BWBR0007077
  - number: 20.2.c
    text: |-
      indien tijdens de kalibratie blijkt dat de aanwijzing van de koolmonoxydemeter meer dan 0,2% vol afwijkt van de
      samenstelling van het kalibratiegas, moet de koolmonoxydemeter worden bijgesteld.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel20
  - number: '20.3'
    text: |-
      Tevens moet vóór elk gebruik van de uitlaatgastester met lambdabepaling of de koolmonoxidemeter worden
      gecontroleerd of het monsternamesysteem in goede staat verkeert.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel20
  - number: '20.4'
    text: |-
      Het koplamptestapparaat moet ten minste één keer per maand gecontroleerd worden op de aanwezigheid van mechanische
      gebreken, compleetheid en goede werking. De resultaten van deze controles moeten worden vastgelegd op de
      controlelijst waarvan het model is opgenomen in [bijlage 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007077
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0007077
  - number: '21.1'
    text: |-
      In elke werkplaats waarvoor de erkenning geldt moet steeds ten minste één persoon werkzaam zijn, die voldoet aan de
      in [artikel 10][ref1] gestelde eis.


      [ref1]: https://wetten.overheid.nl/BWBR0007077#Artikel10
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0007077
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '21.2'
    text: 'Wijzigingen ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel21
  - number: 21.2.a
    text: |-
      de ingevolge [artikel 3][ref1] vastgelegde organisatiestructuur, en


      [ref1]: https://wetten.overheid.nl/BWBR0007077#Artikel3
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0007077
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 21.2.b
    text: |-
      de lijst van personen die bevoegd of verantwoordelijk zijn voor de inbouw van de LPG-installaties, moeten vooraf
      bij de RDW worden aangemeld. De door de Dienst Wegverkeer hieromtrent gegeven aanwijzingen moeten in acht worden
      genomen.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel21
  - number: '22.1'
    text: |-
      Door middel van een ingangscontrole moet alvorens tot inbouw wordt overgegaan worden vastgesteld dat de onderdelen
      van de LPG-installatie aan de in [hoofdstuk 5, afdeling 1, van de Regeling toelatingseisen][ref1] gestelde eisen
      voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Afdeling1
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009107
        afdeling: '1'
  - number: '22.2'
    text: |-
      Van de ingangscontrole moet een ingangscontrolerapport worden opgemaakt, waarvan het model is opgenomen in
      [bijlage 4][ref1], welke moet worden ondertekend door de persoon die verantwoordelijk is voor de ingangscontrole.


      [ref1]: https://wetten.overheid.nl/BWBR0007077
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0007077
  - number: '22.3'
    text: 'De ingangscontrole moet op de volgende wijze geschieden:'
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel22
  - number: 22.3.a
    text: |-
      ten aanzien van onderdelen die volgens [artikel 5.2][ref1] en [5.3 van de Regeling toelatingseisen][ref2]
      typegoedgekeurd moeten zijn, moet worden vastgesteld dat zij zijn voorzien van het vereiste identificatiemerk, dan
      wel dat zij zijn opgenomen in een daartoe door de RDW verstrekt overzicht;


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009107#Artikel5
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0009107
        artikel: '5'
  - number: 22.3.b
    text: |-
      ten aanzien van onderdelen die worden gemonteerd in voertuigen die moeten blijven voldoen aan het gestelde in het
      [Besluit typekeuring motorrijtuigen luchtverontreiniging][ref1], moet worden vastgesteld dat, blijkens een door
      de RDW geautoriseerde verklaring, de informatie op de sticker overeenkomt met de relevante onderdelen van de LPG-
      installatie alsmede het desbetreffende voertuig. Bij G3-gassystemen moet deze controle plaatsvinden aan de hand
      van de bijgeleverde documentatie en moet met behulp van deze documentatie tevens worden vastgesteld of de LPG-
      installatie voor het specifieke merk en type voertuig als G3-gassysteem is toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002890
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002890
  - number: 22.3.c
    text: |-
      ten aanzien van onderdelen die ingevolge [artikel 5.18][ref1] en [5.39 van de Regeling toelatingseisen][ref2] een
      beperkte inbouwtermijn kennen moet worden vastgesteld dat deze termijn niet is verstreken;


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009107#Artikel5
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0009107
        artikel: '5'
  - number: 22.3.d
    text: |-
      ten aanzien van alle overige onderdelen moet worden vastgesteld dat ze aan de aan het specifieke onderdeel gestelde
      eisen, zoals vermeld in [hoofdstuk 5, afdeling I, van de Regeling toelatingseisen][ref1] voldoen;


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Afdeling1
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009107
        afdeling: '1'
  - number: 22.3.e
    text: alle onderdelen moeten worden gecontroleerd op eventuele beschadigingen.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel22
  - number: '22.4'
    text: 'Op het ingangscontrolerapport moet ten minste worden vermeld:'
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel22
  - number: 22.4.a
    text: |-
      het merk, type en RDW-goedkeuringsnummer dan wel identificatiemerk van de in het derde lid, onderdeel a bedoelde
      onderdelen;
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel22
  - number: 22.4.b
    text: |-
      voor zover van toepassing, het merk en type van de in het derde lid, onderdeel b, bedoelde relevante onderdelen van
      de LPG-installatie en het voertuigtype zoals vermeld op de sticker;
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel22
  - number: 22.4.c
    text: de uiterste datum van inbouw van de in het derde lid, onderdeel c, bedoelde onderdelen.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel22
  - number: '22.5'
    text: |-
      Indien men beschikt over een schriftelijke overeenkomst met de leverancier, behoeven de in het vierde lid
      bedoelde gegevens slechts te worden vermeld bij elke 20ste ingebouwde LPG-installatie doch ten minste één keer
      per half jaar. In de overige gevallen kan worden volstaan met het afvinken van de desbetreffende onderdelen op
      het ingangscontrolerapport.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel22
  - number: '22.6'
    text: |-
      In de in het vijfde lid bedoelde schriftelijke overeenkomst moet de leverancier garanderen dat de door hem
      geleverde onderdelen, en waar van toepassing ook reeds samengestelde delen/systemen, voldoen aan de eisen gesteld
      ingevolge [artikel 6.1][ref1] en [6.7, tweede lid, van het Voertuigreglement][ref2], en de leverancier fabrikant
      of importeur is van LPG-onderdelen of LPG-installaties, dan wel als enige tussenleverancier zelf ook een dergelijke
      overeenkomst heeft met de fabrikant of importeur van LPG-onderdelen of LPG-installaties. Een afschrift van deze
      overeenkomsten moet kunnen worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel6
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0006746
        artikel: '6'
  - number: '22.7'
    text: |-
      Onderdelen waarvan nog niet is vastgesteld dat zij aan de daaraan gestelde eisen voldoen, moeten duidelijk als
      zodanig te herkennen zijn, doordat zij bij voorbeeld apart zijn opgeslagen.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel22
  - number: '23.1'
    text: |-
      Alvorens tot inbouw wordt overgegaan moet gecontroleerd worden of de volgende voertuiggegevens, voor zover het
      voertuig reeds geregistreerd is, met het kentekenbewijs overeenstemmen:
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel23
  - number: 23.1.a
    text: 'het kenteken vermeld op de kentekenplaten:'
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel23
  - number: 23.1.b
    text: het identificatienummer, en
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel23
  - number: 23.1.c
    text: plaats van het identificatienummer.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel23
  - number: '23.2'
    text: |-
      Indien het kenteken vermeld op de kentekenplaten niet overeenstemt met het kenteken vermeld op het kentekenbewijs,
      moeten eerst kentekenplaten met het correcte kenteken worden aangebracht alvorens tot melding aan de RDW als
      bedoeld in [artikel 28][ref1] mag worden overgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007077#Artikel28
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0007077
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '23.3'
    text: |-
      Indien het identificatienummer of de plaats van het identificatienummer niet overeenstemmen met de gegevens,
      vermeld op het kentekenbewijs, mag het voertuig, voorzien van de LPG-installatie, bij de RDW worden gemeld, doch
      moet de afwijking telefonisch aan de RDW worden medegedeeld.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel23
  - number: '23.4'
    text: |-
      Tevens moet gecontroleerd worden of het identificatienummer aanwezig is en goed leesbaar is; indien dat niet het
      geval is, moet het identificatienummer eerst onder toezicht van de Dienst Invoer en Accijnzen van het Ministerie
      van Financiën worden aangebracht alvorens het voertuig voorzien van de LPG-installatie bij de RDW wordt gemeld.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel23
  - number: '24'
    text: |-
      Alvorens inbouw plaatsvindt moet de daartoe verantwoordelijke persoon controleren of de registratie van de
      ingangscontrole juist is uitgevoerd en of de te monteren LPG-installatie bestemd is voor het desbetreffende
      voertuig.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel24
  - number: '25.1'
    text: |-
      Onverminderd het bepaalde in [artikel 17, tweede lid][ref1], moet het aanbrengen van de elektrische aansluitingen
      altijd geschieden overeenkomstig het daartoe door de fabrikant van de LPG-installatie overgelegde aansluitschema
      en moet het afstellen eveneens geschieden overeenkomstig door de fabrikant overgelegde documenten. Eventuele nadere
      aanwijzingen van de fabrikant neergelegd in deze documenten omtrent de wijze van monteren van onderdelen moeten
      zoveel mogelijk worden gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0007077#Artikel17
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0007077
        artikel: '17'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '25.2'
    text: |-
      Uit de in het eerste lid bedoelde documenten moet duidelijk blijken dat zij betrekking hebben op het desbetreffende
      voertuig. Dit betekent dat in ieder geval het model en type voertuig op het document moeten zijn vermeld. Tevens
      moet uit het document blijken dat het is afgegeven door de fabrikant of importeur van de installatie.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel25
  - number: '25.3'
    text: |-
      Ten einde het inademen van schadelijke uitlaatgassen zoveel mogelijk te beperken moet tijdens het draaien van de
      motor een afvoerslang aan de uitlaat zijn bevestigd.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel25
  - number: '25.4'
    text: |-
      Indien tijdens het inbouwen wordt geconstateerd dat onderdelen defect zijn of defect zijn geraakt, moeten deze als
      zodanig worden gemerkt en apart worden opgeslagen.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel25
  - number: '25.5'
    text: |-
      Het voertuig moet, nadat de LPG-tank is voorzien van LPG en nog niet is vastgesteld dat er geen sprake is van LPG-
      lekkage, onmiddellijk na binnenkomst in de werkplaats op lekkage worden gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel25
  - number: '26.1'
    text: |-
      Gedurende het inbouwproces moet het voortgangscontrolerapport waarvan het model is opgenomen in [bijlage 5][ref1],
      worden gehanteerd en moeten alle te controleren aspecten overeenkomstig de bevindingen worden afgevinkt.


      [ref1]: https://wetten.overheid.nl/BWBR0007077
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0007077
  - number: '26.2'
    text: |-
      Nadat de inbouw voltooid is, moet het voortgangscontrolerapport geheel zijn afgevinkt en worden ondertekend door de
      persoon die verantwoordelijk is voor de juiste uitvoering van het inbouwproces.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel26
  - number: '27.1'
    text: |-
      Door de LPG-technicus moet tijdens de eindcontrole worden vastgesteld dat de ingangscontrole heeft plaatsgevonden
      aan de hand van het desbetreffende ingangscontrolerapport en dat het voortgangscontrolerapport is afgewerkt. De
      beide rapporten moeten zijn ondertekend door de daarvoor verantwoordelijke personen.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel27
  - number: '27.2'
    text: |-
      Bij de eindcontrole moet worden vastgesteld dat het voertuig, inclusief de LPG-installatie, voldoet aan het
      bepaalde in [artikel 17, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007077#Artikel17
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0007077
        artikel: '17'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '27.3'
    text: |-
      Van de eindcontrole moet een registratie worden bijgehouden op een daartoe bestemd eindcontrolerapport, waarvan het
      model is opgenomen in [bijlage 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007077
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0007077
  - number: '27.4'
    text: Het in het derde lid bedoelde rapport moet worden ondertekend door de LPG-technicus.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel27
  - number: '27.5'
    text: |-
      Indien de LPG-technicus welke verantwoordelijk is voor de eindcontrole dezelfde persoon is als die ook het gehele
      inbouwproces heeft uitgevoerd, dan is het door hem of haar afgewerkte en ondertekende voortgangscontrolerapport
      voldoende bewijs voor een juist uitgevoerde eindcontrole.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel27
  - number: '28.1'
    text: |-
      Nadat de eindcontrole zoals bedoeld in [artikel 27][ref1] is uitgevoerd moet van elk voertuig de opnamekaart LPG-
      inbouw, waarvan het model is opgenomen in [bijlage 7][ref2], zo volledig mogelijk worden ingevuld en moet het
      voertuig bij de RDW worden gemeld met inachtneming van de door de Dienst Wegverkeer gegeven aanwijzingen.


      [ref1]: https://wetten.overheid.nl/BWBR0007077#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0007077
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0007077
        artikel: '27'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007077
  - number: '28.2'
    text: |-
      Alleen de inbouw van een LPG-installatie in in Nederland geregistreerde dan wel te registreren motorrijtuigen kan
      bij de RDW worden gemeld.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel28
  - number: '28.3'
    text: De opnamekaart LPG-inbouw moet worden ondertekend door de LPG-technicus.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel28
  - number: '28.4'
    text: |-
      De opnamekaart LPG-inbouw moet samen met deel I A dan wel deel I van het kentekenbewijs binnen drie weken na de
      inbouw van de LPG-installatie of, indien van toepassing, uiterlijk drie weken na de afgifte van het kentekenbewijs,
      aan de RDW zijn opgestuurd.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel28
  - number: '28.5'
    text: |-
      Nadat alle door de RDW aangegeven procedures zijn uitgevoerd en het gebruiksvoorschrift bij het voertuig is gevoegd
      kan het voertuig worden vrijgegeven door de LPG-technicus.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel28
  - number: '29.1'
    text: |-
      Indien het voertuig blijkens mededeling van de RDW ten aanzien van de LPG-installatie aan een steekproef moet
      worden onderworpen, gelden voor de erkenninghouder de in de volgende leden genoemde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel29
  - number: '29.2'
    text: |-
      De erkenninghouder mag in de staat van een voertuig dat aan een steekproef moet worden onderworpen, gedurende
      negentig minuten na de in [artikel 28][ref1] bedoelde melding geen wijziging aanbrengen of laten aanbrengen.


      [ref1]: https://wetten.overheid.nl/BWBR0007077#Artikel28
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0007077
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '29.3'
    text: 'Aan een steekproef moet alle medewerking worden verleend. Onder alle medewerking wordt in ieder geval verstaan dat:'
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel29
  - number: 29.3.a
    text: de LPG-technicus aanwezig is;
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel29
  - number: 29.3.b
    text: |-
      feitelijke assistentie wordt verleend bij het uitvoeren van de steekproef. Voorts moeten de ter zake door de Dienst
      Wegverkeer gegeven aanwijzingen in acht worden genomen.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel29
  - number: '29.4'
    text: |-
      Indien bij de steekproef wordt vastgesteld dat de LPG-installatie niet overeenkomstig
      [artikel 17, tweede lid][ref1], is ingebouwd wordt door de functionaris van de RDW een steekproefcontrolerapport
      opgemaakt welke door deze en door de LPG-technicus wordt ondertekend.


      [ref1]: https://wetten.overheid.nl/BWBR0007077#Artikel17
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0007077
        artikel: '17'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '29.5'
    text: 'De eigenaar of houder van een voertuig, waarvoor een steekproef wordt vereist:'
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel29
  - number: 29.5.a
    text: |-
      moet voorafgaande aan de steekproef deel I A dan wel deel I van het kentekenbewijs, behorende bij het
      desbetreffende voertuig, aan de daartoe aangewezen functionaris van de RDW, overleggen,
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel29
  - number: 29.5.b
    text: |-
      mag in de in het tweede lid bedoelde periode van 90 minuten in de staat van het voertuig geen wijzigingen brengen
      of laten brengen en is verplicht het voertuig voor de uitvoering van de steekproef beschikbaar te houden.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel29
  - number: '30.1'
    text: |-
      De erkenninghouder moet van klachten of tekortkomingen die zijn geconstateerd bij de ingangscontrole, het
      inbouwproces en de eindcontrole alsmede klachten van de eigenaar of houder van het voertuig een registratie
      bijhouden.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel30
  - number: '30.2'
    text: |-
      Indien dezelfde tekortkomingen of klachten meerdere keren voorkomen moet een onderzoek plaatsvinden naar de
      oorzaken en moeten zo mogelijk maatregelen ter verbetering worden getroffen ten einde te voorkomen dat deze
      tekortkomingen of klachten zich herhalen.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel30
  - number: '30.3'
    text: |-
      De in het eerste lid bedoelde klachten of tekortkomingen alsmede de in het tweede lid bedoelde getroffen
      maatregelen ter verbetering moeten worden vastgelegd op het kwaliteitsregistratieformulier, waarvan het model is
      opgenomen in [bijlage 8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007077
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0007077
  - number: '30.4'
    text: |-
      De getroffen maatregelen moeten regelmatig door de erkenninghouder en zijn personeel ten aanzien van de
      doeltreffendheid worden geëvalueerd.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel30
  - number: '31.1'
    text: 'De erkenninghouder moet van elk voertuig waarin een LPG-installatie is ingebouwd de volgende documenten archiveren:'
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel31
  - number: 31.1.a
    text: een afschrift van de factuur dan wel een werkorder of een verwijzing ernaar;
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel31
  - number: 31.1.b
    text: het ingangscontrolerapport;
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel31
  - number: 31.1.c
    text: het voortgangscontrolerapport;
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel31
  - number: 31.1.d
    text: het eindcontrolerapport, voor zover van toepassing;
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel31
  - number: 31.1.e
    text: een afschrift van de opnamekaart LPG-inbouw;
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel31
  - number: 31.1.f
    text: het steekproefcontrolerapport, voor zover van toepassing;
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel31
  - number: 31.1.g
    text: een afschrift van het aansluitschema en van de afstelgegevens of een verwijzing ernaar, en
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel31
  - number: 31.1.h
    text: |-
      in geval van een G3-gassysteem de in [artikel 22, derde lid, onderdeel b][ref1], bedoelde documentatie.


      [ref1]: https://wetten.overheid.nl/BWBR0007077#Artikel22
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0007077
        artikel: '22'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '31.2'
    text: 'Naast de in het eerste lid bedoelde documenten moet de erkenninghouder de volgende documenten archiveren:'
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel31
  - number: 31.2.a
    text: de controlelijsten van de kalibraties van de koolmonoxydemeter,
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel31
  - number: 31.2.b
    text: de controlelijsten van het koplamptestapparaat, en
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel31
  - number: 31.2.c
    text: het kwaliteitsregistratieformulier.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel31
  - number: '31.3'
    text: Alle in het eerste en tweede lid genoemde documenten moeten ten minste vijf jaar worden bewaard.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel31
  - number: '31.4'
    text: |-
      Documenten waarvan de geldigheid is komen te vervallen moeten direct worden verwijderd of als zodanig worden
      gemerkt.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel31
  - number: '31.5'
    text: Wijzigingen in documenten moeten worden gedateerd en worden voorzien van paraaf en naam van de documentenbeheerder.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel31
  - number: '31.6'
    text: |-
      Betrokken personen moeten op de hoogte zijn van de plaats waar de documenten bewaard worden en zij moeten van elke
      wijziging tijdig op de hoogte worden gebracht.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel31
  - number: '32'
    text: |-
      Het bepaalde in de [paragrafen 2][ref1] en [3][ref2] laat de bevoegdheid tot intrekking, wijziging en
      schorsing van de erkenning, zoals omschreven in [artikel 103 van de wet][ref3], in andere gevallen dan de in
      [paragrafen 2][ref4] en [3][ref5] beschreven gevallen, onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0007077#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0007077#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel103
      [ref4]: https://wetten.overheid.nl/BWBR0007077#Hoofdstuk5
      [ref5]: https://wetten.overheid.nl/BWBR0007077#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0007077
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007077
        hoofdstuk: '5'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '103'
      - id: ref4
        bwb_id: BWBR0007077
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0007077
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '33'
    text: |-
      Onverminderd het bepaalde in [artikel 17, derde lid][ref1], moet in het kader van het toezicht aan de daartoe
      aangewezen functionarissen van de RDW alle medewerking worden verleend. Hieronder wordt onder andere verstaan:


      [ref1]: https://wetten.overheid.nl/BWBR0007077#Artikel17
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0007077
        artikel: '17'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 33.a
    text: het verlenen van toegang tot de werkplaats,
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel33
  - number: 33.b
    text: het verstrekken van inlichtingen, en
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel33
  - number: 33.c
    text: het overleggen van bescheiden. De door de Directeur aangegeven aanwijzingen moeten in acht worden genomen.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel33
  - number: '34'
    text: |-
      Nadat een erkenning is verleend wordt ten minste één maal per jaar door middel van een herschouwing onderzocht of
      de erkenninghouder alsmede de werkplaats nog voldoen aan de in [hoofdstuk 2][ref1] opgenomen erkenningseisen en of
      de in [hoofdstuk 4][ref2] opgenomen erkenningsvoorschriften worden nageleefd. Deze controle kan tevens plaatsvinden
      in het kader van een steekproef van het voertuig.


      [ref1]: https://wetten.overheid.nl/BWBR0007077#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0007077#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0007077
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007077
        hoofdstuk: '4'
  - number: '35.1'
    text: |-
      Indien aan één of meer erkenningseisen of erkenningsvoorschriften niet wordt voldaan, is ingevolge
      [artikel 103, tweede lid, van de wet][ref1] intrekking of wijziging van de erkenning voor de betrokken werkplaats
      mogelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel103
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '103'
  - number: '35.2'
    text: |-
      De in het eerste lid bedoelde intrekking of wijziging van de erkenning zal, in het geval dat de erkenninghouder een
      erkenning heeft voor meerdere werkplaatsen, indien een van deze werkplaatsen niet voldoet aan de erkenningseisen of
      erkenningsvoorschriften, beperkt blijven tot die desbetreffende werkplaats.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel35
  - number: '36.1'
    text: |-
      Indien er sprake is van een in het [eerste lid van artikel 35][ref1] bedoelde situatie die echter op korte termijn
      hersteld kan worden, kan, in plaats van intrekking of wijziging van de erkenning, overgegaan worden tot schorsing
      van de erkenning voor een termijn van ten hoogste twaalf weken.


      [ref1]: https://wetten.overheid.nl/BWBR0007077#Artikel35
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0007077
        artikel: '35'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '36.2'
    text: |-
      Wordt binnen de in het eerste lid genoemde termijn niet aangetoond dat wederom aan de erkenningseisen wordt
      voldaan, dan volgt alsnog intrekking of wijziging van de erkenning.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel36
  - number: '37'
    text: 'In geval van niet-naleving van:'
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel37
  - number: 37.a
    text: |-
      de in [artikel 28][ref1] neergelegde verplichtingen ten aanzien van het melden van een voertuig, of


      [ref1]: https://wetten.overheid.nl/BWBR0007077#Artikel28
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel37
    references:
