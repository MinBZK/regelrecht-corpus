valid_from: '2005-06-10'
bwb_id: BWBR0007077
url: https://wetten.overheid.nl/BWBR0007077/2005-06-10
preamble:
  text: |-
    Gelet op de artikelen 100, 101 en 102 van de Wegenverkeerswet 1994;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:

              a
              erkenning:

                erkenning als bedoeld in [artikel 101, van de Wegenverkeerswet 1994][ref1];



              b
              erkenninghouder:

                houder van een erkenning als bedoeld in [artikel 101 van de Wegenverkeerswet 1994][ref2];



              c
              kwaliteitssysteem:

                een stelsel van vastgelegde bedrijfskundige procedures en regels, die ten doel hebben zekerheden te
      verkrijgen, dat het eindprodukt aan de gestelde voorwaarden voldoet;



              d
              kwaliteit:

                de mate van voldoen aan de gestelde eisen;



              e
              kalibreren:

                het verrichten van handelingen die nodig zijn voor het bepalen van de waarden van de afwijkingen van
      een meetmiddel ten opzichte van een overeengekomen standaard alsmede het justeren (bijstellen) indien de afwijking
      groter is dan toegestaan;



              f
              LPG-technicus:

                de persoon die beschikt over het in artikel 10 van deze regeling bedoelde diploma en die bij de Dienst
      Wegverkeer is aangemeld;



              g
              steekproef:

                de steekproefsgewijze keuring als bedoeld in [artikel 102 van de Wegenverkeerswet 1994][ref3];



              h
              werkplaats:

                inrichting waarin een bedrijf LPG-installaties inbouwt;



              i
              de Minister:

                de Minister van Verkeer en Waterstaat;



              j
              de Directeur:

                de Directeur van de Dienst Wegverkeer;



              k
              RDW:

                de Dienst Wegverkeer;



              l
              wet:

                [Wegenverkeerswet 1994][ref4].



              m
              keuringsinstelling:

                de ingevolge [artikel 101, eerste lid, van de wet][ref5] door de Minister aangewezen instelling;



              n
              onderzoeksgerechtigde:

                de onderneming of instelling die op grond van [hoofdstuk 2][ref6],
      [paragraaf 2, van de Voorschriften meetmiddelen 1997][ref7] door een keuringsinstelling is erkend tot het mogen
      afgeven van certificaten van herkeuring ten aanzien van nader bepaalde categorieën in gebruik zijnde meetmiddelen;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel101
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel102
      [ref4]: https://wetten.overheid.nl/BWBR0006622
      [ref5]: https://wetten.overheid.nl/BWBR0006622#Artikel101
      [ref6]: https://wetten.overheid.nl/BWBR0009237#Hoofdstuk2
      [ref7]: https://wetten.overheid.nl/BWBR0009237#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel1
    references:
      - id: ref1
