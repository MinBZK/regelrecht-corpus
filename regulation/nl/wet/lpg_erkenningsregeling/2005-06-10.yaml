        paragraaf: '2'
  - number: '38.1'
    text: |-
      De steekproef wordt uitgevoerd door een door de Directeur aangewezen functionaris van de RDW en vindt plaats in de
      werkplaats waar de LPG-installatie is ingebouwd.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel38
  - number: '38.2'
    text: |-
      Bij de steekproef wordt onderzocht of de LPG-installatie overeenkomstig de eisen bedoeld in
      [artikel 17, tweede lid][ref1], is ingebouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0007077#Artikel17
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0007077
        artikel: '17'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '39.1'
    text: |-
      Het resultaat van de steekproef telt mee in een door de Dienst Wegverkeer vastgesteld systeem van bonus- en
      strafpunten, dat bekendgemaakt wordt in de Staatscourant. Aan de hand van dit systeem wordt vastgesteld of de
      kwaliteit van de door de erkenninghouder verrichte inbouwen van dien aard is dat verminderd toezicht, verscherpt
      toezicht dan wel intrekking van de erkenning mogelijk dan wel noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel39
  - number: '39.2'
    text: |-
      De kennisgeving van het verscherpen van het toezicht kan plaatsvinden door middel van datacommunicatie. In dat
      geval wordt de kennisgeving na daartoe strekkend verzoek van de belanghebbende in een beschikking vastgelegd.
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel39
  - number: '40'
    text: |-
      Deze regeling treedt in werking met ingang van de dag waarop de [artikelen 100][ref1], [101][ref2] en
      [102, van de Wegenverkeerswet 1994][ref3] in werking treden.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel100
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel101
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel102
    url: https://wetten.overheid.nl/BWBR0007077/2005-06-10#Artikel40
