    text: |-
      1 De [artikelen 5:13][ref1] en [5:15 tot en met 5:20 van de Algemene wet bestuursrecht][ref2] zijn van
      overeenkomstige toepassing ten aanzien van de ambtenaren, bedoeld in [artikel 45][ref3].

      2 De ambtenaren, bedoeld in [artikel 45][ref4], zijn zonder toestemming van de bewoner bevoegd, met medeneming van
      de benodigde apparatuur, een woning te betreden.

      3 De ambtenaren, bedoeld in [artikel 45][ref5], zijn bevoegd afgifte te vorderen van bij of krachtens deze wet
      vereiste documenten die ongeldig zijn verklaard of zijn ingetrokken.


