  - number: '34'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels gesteld worden met betrekking tot:

      a. de binnenwateren waarop de vaarbewijzen geldig zijn, de houder van het vaarbewijs of het binnenschip waarmee
      wordt gevaren;

      b. de vereisten voor de afgifte van de vaarbewijzen;

      c. de modellen voor de vaarbewijzen.
    url: https://wetten.overheid.nl/BWBR0023009/2009-07-01#Artikel34
  - number: '35'
    text: |-
      1 Aan autoriteiten die betrokken zijn bij de uitvoering van deze wet of die zijn belast met de handhaving van de
      bij of krachtens deze wet vastgestelde regels, worden op bij of krachtens algemene maatregel van bestuur te bepalen
      wijze gegevens verstrekt omtrent afgegeven en ongeldige vaarbewijzen die deze autoriteiten voor de uitoefening van
      hun taak behoeven.

      2 Aan de met de afgifte van vaarbewijzen belaste autoriteiten buiten Nederland worden inlichtingen als in het
      eerste lid bedoeld verstrekt in de gevallen en op de wijze, zoals bij of krachtens algemene maatregel van bestuur
      bepaald.
    url: https://wetten.overheid.nl/BWBR0023009/2009-07-01#Artikel35
  - number: '36'
    text: |-
      1 Onze Minister kent aan een binnenschip dat in Nederland op grond van
      [artikel 785, eerste lid, van Boek 8 van het Burgerlijk Wetboek][ref1] te boek is gesteld en aan een binnenschip
      waarvoor een certificaat van onderzoek is afgegeven een scheepsnummer toe, waaronder mede wordt begrepen het
      aanmerken als scheepsnummer van een overeenkomstige aanduiding die bij of krachtens andere wet is toegekend.

      2 De eigenaar van het binnenschip waaraan een scheepsnummer is toegekend is verplicht:

      a. dit nummer binnen twee weken na de toekenning en kennisgeving ervan op zijn binnenschip aan te brengen;

      b. van elke wijziging in de omstandigheden van het binnenschip die aanleiding kunnen geven tot wijziging van het
      scheepsnummer binnen twee weken aan Onze Minister kennis te geven.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het
      scheepsnummer.

      4 Het is de eigenaar van het binnenschip verboden te handelen in strijd met het tweede lid of met de regels,
      bedoeld in het derde lid.


