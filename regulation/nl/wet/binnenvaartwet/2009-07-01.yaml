    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de verstrekking van
      gegevens betreffende het vervoer in het belang van de statistiek.
    url: https://wetten.overheid.nl/BWBR0023009/2009-07-01#Artikel38
  - number: '39'
    text: |-
      1 Persoonsgegevens als bedoeld in [artikel 16 van de Wet bescherming persoonsgegevens][ref1], betreffende de
      gezondheid, worden verwerkt ter uitvoering van:

      a. [artikel 6][ref2], mede betreffende de wettelijke onbekwaamheid, met het oogmerk te beoordelen of aan dit
      artikel toepassing kan worden gegeven dan wel of ontheffing onderscheidenlijk vrijstelling kan worden verleend;

      b. [artikel 23][ref3], met het oogmerk te beoordelen of een bemanningslid voldoet of niet meer voldoet aan de bij
      of krachtens deze wet gestelde vereisten betreffende de lichamelijke geschiktheid;

      c. [artikel 26, eerste lid][ref4], met het oogmerk te beoordelen of de aanvrager voldoet aan de bij of krachtens
      deze wet gestelde eisen betreffende de lichamelijke en geestelijke geschiktheid;

      d. [artikel 30, eerste lid, onderdeel d][ref5], met het oogmerk te beoordelen of sprake is van lichamelijke of
      geestelijke ongeschiktheid van de houder van een vaarbewijs.

      2 Onze Minister is verantwoordelijk voor de verwerking van de in het eerste lid bedoelde persoonsgegevens.

      3 Ter uitvoering van de Herziene Rijnvaartakte kunnen persoonsgegevens worden verwerkt betreffende de gezondheid
      van de bemanning van schepen die zich op de Rijn, inbegrepen de Lek en de Waal, bevinden. De verwerking van deze
      gegevens vindt plaats teneinde de lichamelijke geschiktheid van de bemanning vast te stellen.

      4 Bij of krachtens algemene maatregel van bestuur wordt bepaald wie verantwoordelijk is voor de verwerking van de
      in het derde lid bedoelde persoonsgegevens.


