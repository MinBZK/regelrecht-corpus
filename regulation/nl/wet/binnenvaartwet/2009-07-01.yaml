  - number: '14'
    text: |-
      1 Onze Minister is belast met het onderzoek van een schip ingevolge deze paragraaf. De onderzoeken kunnen geheel of
      ten dele worden verricht door daartoe door Onze Minister aangewezen natuurlijke personen of rechtspersonen.

      2 Onze Minister kan in overeenstemming met de ambtgenoten die het aangaat diensten en personen, ressorterende onder
      een ander ministerie dan dat van Onze Minister, aanwijzen die voor het verrichten van werkzaamheden samenhangende
      met het onderzoek van een schip ter beschikking worden gesteld van Onze Minister.

      3 Onze Minister stelt in overeenstemming met de ambtgenoten die het aangaat voor de krachtens het tweede lid
      aangewezen diensten en personen beleidsregels betreffende de vervulling van hun taak.

      4 Een aanwijzing als bedoeld in het eerste of tweede lid wordt bekendgemaakt in de Staatscourant.

      5 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het onderzoek en
      de aanwijzing van de in het eerste lid bedoelde personen.
    url: https://wetten.overheid.nl/BWBR0023009/2009-07-01#Artikel14
  - number: '15'
    text: |-
      1 Ten aanzien van een schip waarvoor een certificaat van onderzoek is afgegeven kan Onze Minister in de gevallen,
      bedoeld in [artikel 11, onderdeel a of b][ref1], of bij vermoeden van ernstige gebreken aan het schip een onderzoek
      instellen.

      2 Onze Minister kan naar aanleiding van het onderzoek aanwijzingen geven aan de eigenaar van het schip.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel11
    url: https://wetten.overheid.nl/BWBR0023009/2009-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '16'
    text: |-
      Onze Minister kan het certificaat intrekken, indien:

      a. bij het onderzoek blijkt dat niet wordt voldaan aan de in [artikel 8, eerste lid][ref1], bedoelde regels;

      b. bij het onderzoek blijkt dat bij gebruik van het schip de veiligheid van de vaart in gevaar wordt gebracht;

      c. niet wordt voldaan aan de vordering tot medewerking aan het onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel8
    url: https://wetten.overheid.nl/BWBR0023009/2009-07-01#Artikel16
