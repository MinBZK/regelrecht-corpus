  - number: '51'
    text: |-
      1 Degene die ingevolge deze wet een aanvraag doet in verband met:

      a. het verlenen, wijzigen of intrekken van een ontheffing ingevolge deze wet; of

      b. het afgeven, wijzigen of intrekken van ingevolge deze wet vereiste documenten;

      is voor de behandeling van die aanvraag een vergoeding van de kosten verschuldigd.

      2 Bij ministeriële regeling:

      a. worden de vergoedingen, bedoeld in het eerste lid, vastgesteld;

      b. kan worden bepaald dat, voor zover anderen dan Onze Minister de in het eerste lid bedoelde werkzaamheden
      verrichten, zij zelf daarvoor de vergoedingen alsmede de wijze van betaling van deze vergoedingen vaststellen met
      inachtneming van de bij ministeriële regeling gegeven regels;

      c. wordt bepaald aan wie de vergoedingen, bedoeld in het eerste lid, verschuldigd zijn.
    url: https://wetten.overheid.nl/BWBR0023009/2009-07-01#Artikel51
  - number: '52'
    text: |-
      1 Onverminderd de [artikelen 7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2] kan, ingeval buitengewone omstandigheden
      dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-President, [artikel 53][ref3] in
      werking worden gesteld.

      2 Wanneer het in het eerste lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepaling.

      3 Wordt het voorstel van wet door de Staten-Generaal verworpen, dan wordt bij koninklijk besluit, op voordracht van
      Onze Minister-President, de bepaling die ingevolge het eerste lid in werking is gesteld, onverwijld buiten werking
      gesteld.

      4 Bij koninklijk besluit, op voordracht van Onze Minister-President, wordt de bepaling die ingevolge het eerste lid
      in werking is gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.

      5 Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.

      6 Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het Staatsblad.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0023009#Artikel53
