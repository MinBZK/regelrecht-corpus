    text: |-
      1 Onze Minister kan, indien naar zijn oordeel de veilige vaart voldoende gewaarborgd is, met betrekking tot
      bepaalde categorieën van binnenschepen vrijstelling verlenen van de op een gezagvoerder rustende verplichting,
      bedoeld in [artikel 25, eerste lid][ref1]. Aan een vrijstelling kunnen voorschriften of beperkingen worden
      verbonden.

      2 Onze Minister kan, indien naar zijn oordeel de veilige vaart voldoende gewaarborgd is, aan een gezagvoerder
      ontheffing verlenen van de in [artikel 25, eerste lid][ref2], bedoelde verplichting. Aan een ontheffing kunnen
      voorschriften of beperkingen worden verbonden.

      3 Onze Minister kan een krachtens het tweede lid verleende ontheffing intrekken, indien de gezagvoerder de aldaar
      bedoelde voorschriften niet naleeft.

      4 Het is verboden te handelen in strijd met aan een vrijstelling of ontheffing als bedoeld in het eerste
      onderscheidenlijk tweede lid verbonden voorschriften.


