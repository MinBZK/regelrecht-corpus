  - number: '43'
    text: |-
      1 Bij ministeriële regeling wordt vastgesteld welke documenten die bij of krachtens deze wet zijn vereist:

      a. aan boord van het schip aanwezig zijn; of

      b. op andere wijze kunnen worden getoond.

      2 Het is degene op wie krachtens het eerste lid de verplichting berust documenten aan boord te hebben of op andere
      wijze te tonen, verboden te handelen in strijd met het eerste lid.
    url: https://wetten.overheid.nl/BWBR0023009/2009-07-01#Artikel43
  - number: '44'
    text: |-
      Onze Minister is bevoegd tot toepassing van bestuursdwang ter handhaving van de bij of krachtens deze wet en de
      Herziene Rijnvaartakte gestelde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0023009/2009-07-01#Artikel44
  - number: '45'
    text: |-
      1 Met de opsporing van de bij of krachtens deze wet en de Herziene Rijnvaartakte strafbaar gestelde feiten zijn
      belast de bij of krachtens [artikel 141 van het Wetboek van Strafvordering][ref1] aangewezen ambtenaren, alsmede de
      in [artikel 40][ref2] bedoelde ambtenaren.

      2 De in het eerste lid bedoelde ambtenaren zijn tevens belast met de opsporing van de feiten, strafbaar gesteld
      in de [artikelen 179 tot en met 182][ref3] en [184 van het Wetboek van Strafrecht][ref4], voor zover deze feiten
      betrekking hebben op een bevel, vordering of handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
