  - number: '29'
    text: |-
      1 Onze Minister wijst de instellingen of personen aan die belast zijn met het onderzoek naar de kennis en
      bekwaamheid als bedoeld in [artikel 26, tweede lid, onderdeel b][ref1]. Zij verstrekken een verklaring, indien het
      onderzoek met gunstig gevolg heeft plaatsgevonden.

      2 Het onderzoek kan geheel of gedeeltelijk achterwege blijven, indien de aanvrager in het bezit is van:

      a. een geldig vaarbewijs;

      b. een vaarbewijs dat zijn geldigheid heeft verloren door het verstrijken van de geldigheidsduur;

      c. een door Onze Minister ingevolge [artikel 32, eerste lid][ref2], erkend gelijkwaardig document of bewijs van
      kennis en bekwaamheid voor de binnenvaart.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot:

      a. het onderzoek naar de kennis en bekwaamheid, bedoeld in het eerste lid;

      b. de aanwijzing van instellingen of personen, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0023009#Artikel32
