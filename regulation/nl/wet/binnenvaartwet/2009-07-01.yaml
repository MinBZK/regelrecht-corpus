  - number: '42'
    text: |-
      1 Een ambtenaar als bedoeld in [artikel 40][ref1] is bevoegd afgifte van het vaarbewijs te vorderen indien
      naar zijn oordeel het vermoeden bestaat van lichamelijke of geestelijke ongeschiktheid tot het voeren van een
      binnenschip of de houder niet over de kennis of bekwaamheid beschikt die is vereist voor het voeren van een
      binnenschip. Hij legt het vaarbewijs waarvan afgifte is gevorderd onverwijld en onder opgave van redenen aan Onze
      Minister over.

      2 Onze Minister neemt, nadat hij van de vordering tot afgifte kennis heeft genomen, onverwijld een besluit over
      de geldigheid van het vaarbewijs. Totdat een besluit als bedoeld in dit lid is genomen, geldt het besluit van de
      vordering tot afgifte als een besluit als bedoeld in [artikel 31, derde lid][ref2].

      3 Wanneer Onze Minister niet tot verlies van geldigheid besluit, geeft hij het vaarbewijs aan de houder terug.

      4 Het eerste en tweede lid zijn van overeenkomstige toepassing op een vaarbewijs als bedoeld in
      [artikel 32, tweede lid][ref3]. Onze Minister legt dit vaarbewijs onverwijld en onder opgave van redenen over aan
      de desbetreffende bevoegde autoriteit in het buitenland met het verzoek over de geldigheid van het vaarbewijs een
      besluit te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0023009#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0023009#Artikel32
