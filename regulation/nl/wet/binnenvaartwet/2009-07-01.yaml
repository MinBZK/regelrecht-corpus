  - number: '32'
    text: |-
      1 Onze Minister kan een bewijs van kennis en bekwaamheid voor een of meer vormen van binnenvaart erkennen, indien
      naar zijn oordeel het bewijs voldoende waarborg biedt voor het veilig voeren van een binnenschip. Alsdan treedt
      het bewijs van kennis en bekwaamheid gedeeltelijk in de plaats van het onderzoek of geheel in de plaats van de
      verklaring, bedoeld in [artikel 29, eerste lid][ref1].

      2 Bij ministeriële regeling kunnen vaarbewijzen of bewijzen van kennis en bekwaamheid worden erkend die zijn
      afgegeven door een bevoegde autoriteit in het buitenland. Het eerste lid is van overeenkomstige toepassing.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op andere geneeskundige verklaringen dan de
      verklaring, bedoeld in [artikel 28, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0023009#Artikel28
