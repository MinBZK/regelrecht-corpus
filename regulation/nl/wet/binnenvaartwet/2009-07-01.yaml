  - number: '25'
    text: |-
      1 Voor het voeren van bij of krachtens algemene maatregel van bestuur te bepalen categorieën van schepen is aan de
      gezagvoerder een geldig vaarbewijs afgegeven.

      2 Bij of krachtens algemene maatregel van bestuur worden de verschillende soorten vaarbewijzen en de
      geldigheidsduur vastgesteld.

      3 Dit artikel is niet van toepassing op de gezagvoerder aan wie een bij of krachtens algemene maatregel van bestuur
      aan te wijzen gelijkwaardig document is afgegeven.

      4 Het is verboden een schip te gebruiken zonder dat aan de gezagvoerder het daarvoor vereiste geldige vaarbewijs
      is afgegeven.

      5 Het is degene die weet of redelijkerwijs moet weten, dat een op zijn naam gesteld vaarbewijs voor een gedeelte
      of het geheel van de geldigheidsduur ongeldig is verklaard, verboden een binnenschip gedurende dat gedeelte of het
      geheel van de geldigheidsduur te voeren of als gezagvoerder te doen voeren.
    url: https://wetten.overheid.nl/BWBR0023009/2009-07-01#Artikel25
  - number: '26'
    text: |-
      1 Onze Minister verstrekt een vaarbewijs na overlegging van verklaringen waaruit blijkt, dat de aanvrager voldoet
      aan bij of krachtens algemene maatregel van bestuur te stellen voorschriften om het binnenschip veilig te voeren.

      2 De in het eerste lid bedoelde voorschriften hebben betrekking op:

      a. de lichamelijke en geestelijke geschiktheid; en

      b. de kennis en de bekwaamheid om het binnenschip te voeren.

      3 De in het eerste lid bedoelde voorschriften kunnen betrekking hebben op de vaartijd. Onder vaartijd wordt
      verstaan de tijd die na het bereiken van de leeftijd van 16 jaar is doorgebracht als lid van de dekbemanning van
      een schip.

      4 De in het eerste lid bedoelde voorschriften kunnen verschillend zijn naar gelang het soort vaarbewijs.
    url: https://wetten.overheid.nl/BWBR0023009/2009-07-01#Artikel26
  - number: '27'
    text: |-
      1 Een vaarbewijs wordt niet afgegeven aan degene:

      a. die de leeftijd van 18 jaar nog niet heeft bereikt;

      b. van wie het vaarbewijs ongeldig is verklaard, gedurende de periode van ongeldigheid.

      2 Voor de toepassing van het eerste lid, onderdeel b, wordt onder vaarbewijs mede verstaan een vaarbewijs,
      afgegeven door het daartoe bevoegde gezag buiten Nederland, waarvan de houder in Nederland woont.
    url: https://wetten.overheid.nl/BWBR0023009/2009-07-01#Artikel27
  - number: '28'
    text: |-
      1 Onze Minister wijst de deskundigen aan die belast zijn met het onderzoek naar de lichamelijke en geestelijke
      geschiktheid, bedoeld in [artikel 26, tweede lid, onderdeel a][ref1]. De deskundige geeft een verklaring af, indien
      het onderzoek met gunstig gevolg heeft plaatsgevonden.

      2 Indien de in het eerste lid bedoelde verklaring daartoe aanleiding geeft, kunnen aan het vaarbewijs voorschriften
      of beperkingen worden verbonden, die op het vaarbewijs worden opgenomen.

      3 Indien de afgifte van een in het eerste lid bedoelde verklaring wordt geweigerd of indien blijkt uit die
      verklaring dat het gaat om een beperkte geschiktheid, dan wordt de aanvrager op diens aanvraag door een andere door
      Onze Minister aangewezen deskundige nogmaals onderzocht. Het eerste lid is van overeenkomstige toepassing.

      4 De deskundige gaat eerst tot een onderzoek over nadat de aanvrager zich heeft gelegitimeerd.

      5 Bij of krachtens algemene maatregel van bestuur kan worden bepaald in welke gevallen het onderzoek achterwege
      blijft en op welke wijze en voor welk soort vaarbewijs de aanvrager zijn lichamelijke en geestelijke geschiktheid
      opnieuw aantoont.

      6 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het
      onderzoek of de verklaring van lichamelijke en geestelijke geschiktheid.

      7 Het is de gezagvoerder of de werkgever verboden te handelen in strijd met de voorschriften die ingevolge het
      tweede lid zijn verbonden aan een vaarbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel26
