      1 Het is verboden een schip te gebruiken zonder geldige meetbrief, afgegeven op grond van de op 15 februari 1966 te
      Genève tot stand gekomen Overeenkomst nopens de meting van binnenvaartuigen (Trb.1967, 43).

      2 Bij ministeriële regeling worden regels gesteld met betrekking tot de meting en de meetbrieven.
    url: https://wetten.overheid.nl/BWBR0023009/2009-07-01#Artikel21
  - number: '22'
    text: |-
      1 Overeenkomstig bindende besluiten van instellingen van de Europese Gemeenschappen dan wel anderszins ter
      uitvoering van verdragen of bindende besluiten van volkenrechtelijke organisaties worden bij ministeriële regeling
      regels gesteld voor bij algemene maatregel van bestuur aan te wijzen categorieën van schepen met betrekking tot de
      vaartijden en bemanningssterkte, de uitrustingsstukken van binnenschepen en de hiermee verband houdende eisen.

      2 In het belang van de veiligheid van de vaart kan de regeling, bedoeld in het eerste lid, aanvullende regels
      bevatten inzake:

      a. de vaartijden van schepen;

      b. de samenstelling van de minimumbemanning van in die regeling aan te wijzen soorten schepen en categorieën
      daarvan en bij te onderscheiden exploitatiewijzen, alsmede de aan bemanningsleden te stellen eisen;

      c. eisen aan de deskundigheid van bemanningsleden, waaronder begrepen opleiding en ervaring;

      d. de rusttijden van de bemanningsleden.

      3 Indien de regeling, bedoeld in het eerste lid, uitsluitend betrekking heeft op de wateren, bedoeld in artikel
      4, eerste lid, van de Herziene Rijnvaartakte, kan Onze Minister voor de overige binnenwateren regels stellen met
      betrekking tot de in het eerste lid genoemde onderwerpen.

      4 Onze Minister kan, indien naar zijn oordeel de veilige vaart voldoende gewaarborgd is, met betrekking tot
      bepaalde categorieën van schepen vrijstelling verlenen van een of meer eisen, bedoeld in het eerste tot en met
      derde lid. Aan een vrijstelling kunnen voorschriften of beperkingen worden verbonden.

      5 Onze Minister kan ontheffing verlenen van de krachtens het eerste tot en met derde lid gestelde eisen. Aan de
      ontheffing kunnen voorschriften of beperkingen worden verbonden.

      6 Onze Minister kan een krachtens het vijfde lid verleende ontheffing intrekken, indien de aldaar bedoelde
      voorschriften niet worden nageleefd.

      7 De gezagvoerder of de werkgever zijn verplicht tot naleving van:

      a. het bepaalde krachtens het eerste en tweede lid, onderdelen a tot en met c;

      b. het tot hen gerichte krachtens het tweede lid, onderdeel d, bepaalde; en

      c. de krachtens het vierde of vijfde lid, aan een vrijstelling of ontheffing verbonden voorschriften.

      8 Een bemanningslid is verplicht tot naleving van:

      a. het tot hem gerichte krachtens het eerste en tweede lid, onderdelen a en d, bepaalde; en

      b. de tot hem gerichte krachtens het vierde of vijfde lid, aan een vrijstelling of ontheffing verbonden
      voorschriften.

      9 Het is verboden te handelen in strijd met dit artikel.
    url: https://wetten.overheid.nl/BWBR0023009/2009-07-01#Artikel22
  - number: '23'
    text: |-
      1 Het is een gezagvoerder of een werkgever verboden een binnenschip te gebruiken met een bemanningslid dat niet
      over een geldige geneeskundige verklaring beschikt.

      2 Bij of krachtens algemene maatregel van bestuur worden voorschriften gesteld met betrekking tot de geneeskundige
      verklaring.

      3 De [artikelen 28][ref1] en [31][ref2] zijn van overeenkomstige toepassing.


