    text: |-
      1 Een ambtenaar als bedoeld in [artikel 40][ref1] is bevoegd afgifte te vorderen van bij of krachtens deze wet
      vereiste documenten die ongeldig zijn verklaard of zijn ingetrokken.

      2 Een ambtenaar als bedoeld in [artikel 40][ref2] beschikt niet over de bevoegdheid, genoemd in
      [artikel 5:18 van de Algemene wet bestuursrecht][ref3].


