        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '17'
    text: |-
      1 Onze Minister kan het gebruik van een schip op de binnenwateren onderbreken, indien de staat waarin het zich
      bevindt zodanig is dat de veiligheid ervan of van zijn omgeving onmiddellijk gevaar loopt.

      2 In geval van toepassing van het eerste lid draagt de gezagvoerder er zorg voor, dat het schip onverwijld en met
      inachtneming van de aanwijzingen van Onze Minister naar een door hem aangewezen plaats wordt gebracht.

      3 De eigenaar dan wel de gezagvoerder laat het schip op de aangewezen plaats liggen, totdat naar het oordeel van
      Onze Minister de redenen voor het onderbreken van het gebruik zijn weggenomen.

      4 [Titel 5.3 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op de in het eerste lid bedoelde
      bevoegdheid.

      5 Het is verboden een schip te gebruiken zolang het gebruik met toepassing van dit artikel is onderbroken, tenzij
      met inachtneming van de ingevolge het tweede lid gegeven aanwijzingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0023009/2009-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '18'
    text: |-
      De kosten van een onderzoek en daarmee samenhangende werkzaamheden, voor zover deze worden verricht door Onze
      Minister of de in [artikel 14, tweede lid][ref1], bedoelde diensten en personen, komen ten laste van het Rijk:

      a. indien naar aanleiding van een vermoeden ten aanzien van de aanwezigheid van ernstige gebreken aan het schip op
      grond van [artikel 15][ref2] een onderzoek is ingesteld en gebleken is, dat het vermoeden onjuist is geweest; of

      b. indien ingevolge [artikel 17, eerste lid][ref3], het gebruik van een schip is onderbroken en gebleken is, dat
      het onderbreken ten onrechte is geschied.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0023009#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0023009#Artikel17
