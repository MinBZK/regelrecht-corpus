      1 Een ambtenaar als bedoeld in [artikel 40, eerste of tweede lid][ref1], kan vorderen dat binnen een door hem te
      stellen termijn een nieuw geneeskundig onderzoek wordt uitgevoerd, indien hij redelijkerwijs vermoedt dat de houder
      daarvan niet meer voldoet aan de eisen, bedoeld in [artikel 23, tweede lid][ref2].

      2 Indien een geneeskundige verklaring wordt afgegeven overeenkomstig het eerste lid, komen de kosten van afgifte
      ten laste van het Rijk.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste lid.


