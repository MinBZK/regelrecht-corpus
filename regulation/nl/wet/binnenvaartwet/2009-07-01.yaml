      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet en de Herziene Rijnvaartakte zijn
      belast:

      a. de bij of krachtens [artikel 141 van het Wetboek van Strafvordering][ref1] aangewezen ambtenaren;

      b. de door Onze Minister aangewezen ambtenaren van de Inspectie Verkeer en Waterstaat.

      2 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn voorts belast andere dan in het
      eerste lid, onderdeel b, bedoelde door Onze Minister aangewezen ambtenaren. Indien Onze Minister ambtenaren van
      provincies, gemeenten of waterschappen aanwijst, doet hij dit in overeenstemming met de desbetreffende besturen.

      3 Een aanwijzing als bedoeld in het tweede lid wordt bekendgemaakt in de Staatscourant.

      4 Onze Minister kan beleidsregels vaststellen met betrekking tot het toezicht op de naleving.


