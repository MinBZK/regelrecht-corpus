      1 In afwachting van de sluiting van overeenkomsten tussen de Europese Unie en derde landen inzake de wederzijdse
      erkenning van scheepscertificaten, kan Onze Minister scheepscertificaten van vaartuigen van derde landen erkennen
      voor het bevaren van de binnenwateren.

      2 Het afgeven van certificaten voor vaartuigen uit derde landen geschiedt overeenkomstig de bij of krachtens deze
      paragraaf gegeven voorschriften.
