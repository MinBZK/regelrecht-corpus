preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het ter bevordering van de binnenvaart wenselijk is de wetgeving te
    harmoniseren door de bepalingen die betrekking hebben op de toegang tot de markt, de technische staat van het
    schip, de scheepsmeting, de bemanning, het vaarbewijs, de scheepsnummering en de gegevensverstrekking in een
    wet bijeen te brengen, waarbij mede uitvoering wordt gegeven aan de Herziene Rijnvaartakte met bijbehorende
    protocollen, alsmede aan Verordening 1017/68/EEG van de Raad van 19 juli 1968 houdende de toepassing van
    mededingingsregels op het gebied van het vervoer per spoor, over de weg en over de binnenwateren (L 175), Richtlijn
    76/135/EEG van de Raad van 20 januari 1976 inzake wederzijdse erkenning van scheepsattesten voor binnenschepen
    (L 021), Richtlijn 80/1119/EEG van de Raad van 17 november 1980 betreffende de statistische registratie van het
    goederenvervoer over de binnenwateren (L 339), Richtlijn 82/714/EEG van de Raad van 4 oktober 1982 tot vaststelling
    van de technische voorschriften voor binnenschepen (L 301), Verordening nr. 2919/85/EEG van de Raad van 17 oktober
    1985 houdende vaststelling van de voorwaarden waaraan moet worden voldaan om in aanmerking te komen voor het regime
    dat door de Herziene Rijnvaartakte wordt gereserveerd voor de vaartuigen die tot de Rijnvaart behoren (L 280),
    Richtlijn 87/540/EEG van de Raad van 9 november 1987 betreffende de toegang tot het beroep van ondernemer van
    nationaal en internationaal goederenvervoer over de binnenwateren en inzake de onderlinge erkenning van dit beroep
    betreffende diploma's, certificaten en andere titels (L 322), Verordening 3921/91/EEG van de Raad van 16 december
    1991 tot vaststelling van de voorwaarden waaronder vervoersondernemers worden toegelaten tot binnenlands goederen-
    en personenvervoer over de binnenwateren in een Lid-Staat waar zij niet gevestigd zijn (L 373), Richtlijn 91/672/
    EEG van de Raad van 16 december 1991 inzake wederzijdse erkenning van de nationale vaarbewijzen voor het besturen
    van schepen in het goederen- en personenvervoer over de binnenwateren (L 373), Verordening 3912/92/EEG van de Raad
    van 17 december 1992 inzake in de Gemeenschap in het wegvervoer en de binnenvaart uitgevoerde controles van in een
    derde land ingeschreven of tot het verkeer toegelaten vervoermiddelen (L 395), Verordening 1356/96/EEG van de Raad
    van 8 juli 1996 tot vaststelling van gemeenschappelijke voorschriften voor het vervoer van goederen of personen
    over de binnenwateren, tussen Lid-Staten, om voor dit vervoer het vrij verrichten van diensten te verzekeren (L
    175) en Richtlijn 96/50/EG van de Raad van 23 juli 1996 betreffende de harmonisatie van voorwaarden voor de afgifte
    van nationale vaarbewijzen voor binnenvaartuigen welke bij het goederen- en personenvervoer in de Gemeenschap
    gebruikt worden (L 235);

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0023009/2009-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt, tenzij anders is bepaald, verstaan onder:

      bedrijfsmatig vervoer:

      1°. vervoer in de uitoefening van een bedrijf of beroep;

      2°. vervoer van goederen, uitsluitend bestemd voor of afkomstig van de eigen onderneming; of

      3°. slepen en duwen van schepen met sleep-, duw- en sleepduwboten;

      bemanningslid: ieder die zich als schipper, stuurman, machinist, volmatroos, matroos-motordrijver, matroos,
      lichtmatroos of deksman aan boord van een schip bevindt;

      bevoegde autoriteit: door Onze Minister aangewezen autoriteit;

      binnenschip:

      1°. vaartuig dat is bestemd voor de vaart op de binnenwateren of op dienovereenkomstige buitenlandse wateren;

      2°. drijvend werktuig;

      binnenwateren: wateren die in Nederland zijn gelegen binnen een langs de Nederlandse kust gaande, bij ministeriële
      regeling aan te wijzen lijn;

      bunkerstation: drijvend werktuig met permanente ligplaats dat is bestemd of wordt gebruikt voor de opslag of
      levering van brandstof voor voortstuwing van schepen;

      dekbemanning: de bemanning met uitzondering van de machinisten;

      diepgang: verticale afstand van het laagste punt van de scheepsromp aan de onderkant van de bodembeplating of van
      de kiel tot het vlak van de grootste inzinking van de scheepsromp in meters;

      drijvend werktuig: drijvend bouwsel waarop zich werkinstallaties bevinden, zoals bunkerstations, grind- of
      zandzuigers, baggermolens, hei-installaties, kranen en elevatoren;

      gezagvoerder: degene die het gezag voert over een schip;

      Herziene Rijnvaartakte: op 17 oktober 1868 te Mannheim tot stand gekomen Herziene Rijnvaartakte (Trb. 1955, 161);

      onderneming: rechtspersoon, vennootschap zonder rechtspersoonlijkheid, maatschap dan wel natuurlijke persoon, die
      zich bezig houdt met bedrijfsmatig vervoer;

      Onze Minister: Onze Minister van Verkeer en Waterstaat;

      schip: zeeschip of binnenschip;

      verwerken van persoonsgegevens: hetgeen daaronder wordt verstaan in de [Wet bescherming persoonsgegevens][ref1];

      werkgever:

      1°. degene jegens wie de gezagvoerder krachtens arbeidsovereenkomst of publiekrechtelijke aanstelling gehouden is
      tot het verrichten van arbeid, behalve indien die gezagvoerder aan een derde ter beschikking wordt gesteld voor het
      verrichten van arbeid welke die derde gewoonlijk doet verrichten;

      2°. degene aan wie de gezagvoerder ter beschikking is gesteld voor het verrichten van arbeid als bedoeld onder
      1°; of

      3°. degene die zonder werkgever als bedoeld onder 1° of 2° te zijn, de gezagvoerder onder zijn gezag arbeid doet
      verrichten;

      zeeschip: schip dat blijkens zijn constructie uitsluitend of in hoofdzaak wordt gebruikt voor de vaart op zee;

      2 In deze wet en de daarop berustende bepalingen wordt mede verstaan onder:

      eigenaar van een binnenschip: degene die het binnenschip in gebruik heeft, niet zijnde een reis- of tijdbevrachter;

      vervoer:

      1°. aanbieden van schepen voor het vervoeren van goederen en personen;

      2°. laden en lossen van goederen;

      3°. in- en ontschepen van personen; of

      4°. opslaan van goederen in schepen.

      3 In deze wet en de daarop berustende bepalingen wordt onder vervoer niet verstaan het door een schip vervoeren van
      met behulp van dit schip zelf gevangen vis als bedoeld in de [Visserijwet 1963][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011468
      [ref2]: https://wetten.overheid.nl/BWBR0002416
