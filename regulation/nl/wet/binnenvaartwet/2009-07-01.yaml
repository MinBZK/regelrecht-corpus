  - number: '2'
    text: |-
      Overeenkomstig bindende besluiten van instellingen van de Europese Gemeenschappen dan wel anderszins ter uitvoering
      van verdragen of bindende besluiten van volkenrechtelijke organisaties worden bij ministeriële regeling de
      binnenwateren onderverdeeld in zones, die kunnen verschillen met het oog op de eigen omstandigheden van de vaart.
    url: https://wetten.overheid.nl/BWBR0023009/2009-07-01#Artikel2
  - number: '3'
    text: Deze wet is van toepassing op de binnenwateren.
    url: https://wetten.overheid.nl/BWBR0023009/2009-07-01#Artikel3
  - number: '4'
    text: |-
      Deze wet is niet van toepassing op schepen:

      a. in het beheer van het Ministerie van Defensie; of

      b. behorende tot een buitenlandse krijgsmacht.
    url: https://wetten.overheid.nl/BWBR0023009/2009-07-01#Artikel4
  - number: '5'
    text: |-
      1 Het is degene die bedrijfsmatig vervoer van goederen of personen verricht verboden een schip te gebruiken
      waarvoor niet een in het tweede lid bedoeld document van toelating is afgegeven.

      2 Overeenkomstig bindende besluiten van instellingen van de Europese Gemeenschappen dan wel anderszins ter
      uitvoering van verdragen of bindende besluiten van volkenrechtelijke organisaties worden bij of krachtens algemene
      maatregel van bestuur documenten van toelating vastgesteld, die voor bepaalde categorieën van schepen of bepaalde
      soorten van vervoer kunnen verschillen.
    url: https://wetten.overheid.nl/BWBR0023009/2009-07-01#Artikel5
  - number: '6'
    text: |-
      1 Het is een onderneming of degene die een onderneming drijft verboden bedrijfsmatig goederen te vervoeren, anders
      dan bestemd voor of afkomstig van de eigen onderneming, zonder dat aan deze onderneming een persoon verbonden is
      aan wie een bewijs van vakbekwaamheid is afgegeven voor het bedrijfsmatig vervoer van goederen en die daadwerkelijk
      en bij voortduring leiding geeft aan de vervoersactiviteit van de onderneming.

      2 Onze Minister kan vrijstelling verlenen van de verplichting, bedoeld in het eerste lid. Aan een vrijstelling
      kunnen voorschriften of beperkingen worden verbonden.

      3 Bij ministeriële regeling worden regels gesteld met betrekking tot het aantonen van de vakbekwaamheid, waaronder
      in ieder geval zijn begrepen de vereiste kennisgebieden en de vereiste scholing of praktijkervaring.

      4 Documenten die ten bewijze van de vakbekwaamheid zijn afgegeven door een andere lidstaat van de Europese Unie
      krachtens bindende besluiten van instellingen van de Europese Gemeenschappen, door een andere staat die partij is
      bij de Overeenkomst betreffende de Europese Economische Ruimte of door Zwitserland, worden gelijkgesteld aan het
      bewijs van vakbekwaamheid, bedoeld in het eerste lid.

      5 Bij ministeriële regeling kan worden bepaald in welke gevallen en voor welke termijnen Onze Minister ontheffing
      kan verlenen van het eerste lid. Onze Minister kan aan de ontheffing voorschriften of beperkingen verbinden.

      6 Het is verboden te handelen in strijd met voorschriften die aan een vrijstelling of ontheffing als bedoeld in het
      tweede onderscheidenlijk vijfde lid zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0023009/2009-07-01#Artikel6
  - number: '7'
    text: |-
      1 Het is verboden een schip te gebruiken zonder de vereiste geldige certificaten.

      2 Overeenkomstig bindende besluiten van instellingen van de Europese Gemeenschappen dan wel anderszins ter
      uitvoering van verdragen of bindende besluiten van volkenrechtelijke organisaties worden bij of krachtens algemene
      maatregel van bestuur de soorten certificaten van onderzoek en de categorieën van binnenschepen aangewezen waarvoor
      een certificaat van onderzoek vereist is.
    url: https://wetten.overheid.nl/BWBR0023009/2009-07-01#Artikel7
  - number: '8'
    text: |-
      1 Overeenkomstig bindende besluiten van instellingen van de Europese Gemeenschappen dan wel anderszins ter
      uitvoering van verdragen of bindende besluiten van volkenrechtelijke organisaties worden bij ministeriële regeling
      regels gesteld met betrekking tot de technische staat van een binnenschip.

      2 Bij ministeriële regeling kunnen regels worden gesteld in aanvulling op de in het eerste lid bedoelde regels.

      3 Het is verboden een binnenschip te gebruiken in strijd met de regels, bedoeld in het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0023009/2009-07-01#Artikel8
  - number: '9'
    text: |-
      1 Onze Minister of de bevoegde autoriteit verstrekt op aanvraag voor het binnenschip een certificaat van onderzoek,
      indien bij onderzoek is gebleken, dat is voldaan aan de regels, bedoeld in [artikel 8][ref1].

      2 Bij ministeriële regeling worden regels gesteld met betrekking tot de geldigheidsduur van een certificaat van
      onderzoek, alsmede de voorwaarden waaronder een verloren gegaan of beschadigd exemplaar kan worden vervangen.

      3 Aan het certificaat van onderzoek kunnen voorschriften of beperkingen worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel8
    url: https://wetten.overheid.nl/BWBR0023009/2009-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '10'
    text: |-
      1 In het certificaat van onderzoek worden de voorschriften opgenomen die bij het gebruik van het binnenschip in
      acht moeten worden genomen, alsmede in voorkomende gevallen de toegestane afwijkingen en te treffen voorzieningen
      met vermelding van de binnenwateren en de periode, waarvoor deze gelden.

      2 Het is verboden een binnenschip te gebruiken in strijd met het eerste lid.
    url: https://wetten.overheid.nl/BWBR0023009/2009-07-01#Artikel10
  - number: '11'
    text: |-
      Het is de eigenaar of gezagvoerder van een binnenschip waarvoor een certificaat van onderzoek is afgegeven verboden
      het binnenschip te gebruiken zonder dat Onze Minister, onderscheidenlijk de bevoegde autoriteit onverwijld in
      kennis wordt gesteld van:

      a. belangrijke schade en herstel daarvan;

      b. verbouwing en andere ingrijpende wijzigingen;

      c. overgang van de eigendom.
    url: https://wetten.overheid.nl/BWBR0023009/2009-07-01#Artikel11
  - number: '12'
    text: |-
      Het is verboden een binnenschip te gebruiken waarvan de toestand, het gebruik en de uitrusting niet in
      overeenstemming zijn met hetgeen is vastgelegd in het certificaat van onderzoek.
    url: https://wetten.overheid.nl/BWBR0023009/2009-07-01#Artikel12
  - number: '13'
    text: |-
      1 Onze Minister kan met betrekking tot bepaalde categorieën van binnenschepen van een of meer van de krachtens
      [artikel 8][ref1] gestelde regels vrijstelling verlenen, indien naar zijn oordeel de veiligheid van de
      binnenschepen en de opvarenden voldoende gewaarborgd is. Aan een vrijstelling kunnen voorschriften of beperkingen
      worden verbonden.

      2 Onze Minister kan in bijzondere gevallen ontheffing verlenen van een of meer van de krachtens [artikel 8][ref2]
      gestelde regels. Aan een ontheffing kunnen voorschriften of beperkingen worden verbonden.

      3 Onze Minister kan een krachtens het tweede lid verleende ontheffing intrekken, indien de aldaar bedoelde
      voorschriften niet worden nageleefd.

      4 Het is verboden een binnenschip te gebruiken in strijd met de voorschriften die aan een vrijstelling of
      ontheffing als bedoeld in het eerste onderscheidenlijk tweede lid zijn verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0023009#Artikel8
