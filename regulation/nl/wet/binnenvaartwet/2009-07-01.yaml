  - number: '30'
    text: |-
      1 Onze Minister kan een vaarbewijs ongeldig verklaren voor een gedeelte of het geheel van de geldigheidsduur,
      indien:

      a. het vaarbewijs is afgegeven op grond van door de houder verschafte onjuiste gegevens en het niet zou zijn
      afgegeven, indien de onjuistheid van die gegevens ten tijde van de aanvraag bekend zou zijn geweest;

      b. het vaarbewijs kennelijk abusievelijk aan de houder is afgegeven;

      c. de houder hierom schriftelijk verzoekt;

      d. de houder blijkens een nader onderzoek niet beschikt over de lichamelijke of geestelijke geschiktheid die
      is vereist voor het voeren van een binnenschip dan wel zich op eerste vordering van Onze Minister niet aan een
      dergelijk onderzoek onderwerpt;

      e. naar zijn oordeel de houder niet over de kennis of bekwaamheid beschikt die is vereist voor het voeren van een
      binnenschip;

      f. de houder niet voldoet aan de voorschriften, bedoeld in [artikel 28, tweede lid][ref1].

      2 Indien bij het nader onderzoek, bedoeld in het eerste lid, onderdeel d, de ongeschiktheid niet blijkt,
      komen de kosten van het onderzoek ten laste van het Rijk. [Artikel 28, eerste lid en vierde lid][ref2], is van
      overeenkomstige toepassing.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het
      ongeldig verklaren, het invorderen en het teruggeven van een vaarbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0023009#Artikel28
