        hoofdstuk: '5'
        paragraaf: '1'
  - number: '47.3'
    text: |-
      De ambtenaren, bedoeld in [artikel 45][ref1], zijn bevoegd afgifte te vorderen van bij of krachtens deze wet
      vereiste documenten die ongeldig zijn verklaard of zijn ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel45
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel47
