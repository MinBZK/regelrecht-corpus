  - number: '47.2'
    text: |-
      De ambtenaren, bedoeld in [artikel 45][ref1], zijn zonder toestemming van de bewoner bevoegd, met medeneming van de
      benodigde apparatuur, een woning te betreden.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel45
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel47
