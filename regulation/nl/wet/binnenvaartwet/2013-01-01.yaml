$id: binnenvaartwet
regulatory_layer: WET
publication_date: '2008-05-15'
valid_from: '2013-01-01'
bwb_id: BWBR0023009
url: https://wetten.overheid.nl/BWBR0023009/2013-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het ter bevordering van de binnenvaart wenselijk is de wetgeving te
    harmoniseren door de bepalingen die betrekking hebben op de toegang tot de markt, de technische staat van het
    schip, de scheepsmeting, de bemanning, het vaarbewijs, de scheepsnummering en de gegevensverstrekking in een
    wet bijeen te brengen, waarbij mede uitvoering wordt gegeven aan de Herziene Rijnvaartakte met bijbehorende
    protocollen, alsmede aan Verordening 1017/68/EEG van de Raad van 19 juli 1968 houdende de toepassing van
    mededingingsregels op het gebied van het vervoer per spoor, over de weg en over de binnenwateren (L 175), Richtlijn
    76/135/EEG van de Raad van 20 januari 1976 inzake wederzijdse erkenning van scheepsattesten voor binnenschepen
    (L 021), Richtlijn 80/1119/EEG van de Raad van 17 november 1980 betreffende de statistische registratie van het
    goederenvervoer over de binnenwateren (L 339), Richtlijn 82/714/EEG van de Raad van 4 oktober 1982 tot vaststelling
    van de technische voorschriften voor binnenschepen (L 301), Verordening nr. 2919/85/EEG van de Raad van 17 oktober
    1985 houdende vaststelling van de voorwaarden waaraan moet worden voldaan om in aanmerking te komen voor het regime
    dat door de Herziene Rijnvaartakte wordt gereserveerd voor de vaartuigen die tot de Rijnvaart behoren (L 280),
    Richtlijn 87/540/EEG van de Raad van 9 november 1987 betreffende de toegang tot het beroep van ondernemer van
    nationaal en internationaal goederenvervoer over de binnenwateren en inzake de onderlinge erkenning van dit beroep
    betreffende diploma's, certificaten en andere titels (L 322), Verordening 3921/91/EEG van de Raad van 16 december
    1991 tot vaststelling van de voorwaarden waaronder vervoersondernemers worden toegelaten tot binnenlands goederen-
    en personenvervoer over de binnenwateren in een Lid-Staat waar zij niet gevestigd zijn (L 373), Richtlijn 91/672/
    EEG van de Raad van 16 december 1991 inzake wederzijdse erkenning van de nationale vaarbewijzen voor het besturen
    van schepen in het goederen- en personenvervoer over de binnenwateren (L 373), Verordening 3912/92/EEG van de Raad
    van 17 december 1992 inzake in de Gemeenschap in het wegvervoer en de binnenvaart uitgevoerde controles van in een
    derde land ingeschreven of tot het verkeer toegelaten vervoermiddelen (L 395), Verordening 1356/96/EEG van de Raad
    van 8 juli 1996 tot vaststelling van gemeenschappelijke voorschriften voor het vervoer van goederen of personen
    over de binnenwateren, tussen Lid-Staten, om voor dit vervoer het vrij verrichten van diensten te verzekeren (L
    175) en Richtlijn 96/50/EG van de Raad van 23 juli 1996 betreffende de harmonisatie van voorwaarden voor de afgifte
    van nationale vaarbewijzen voor binnenvaartuigen welke bij het goederen- en personenvervoer in de Gemeenschap
    gebruikt worden (L 235);

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt, tenzij anders is bepaald, verstaan onder: bedrijfsmatig
      vervoer: 1°. vervoer in de uitoefening van een bedrijf of beroep; 2°. vervoer van goederen, uitsluitend bestemd
      voor of afkomstig van de eigen onderneming; of 3°. slepen en duwen van schepen met sleep-, duw- en sleepduwboten;
      bemanningslid: ieder die zich als schipper, stuurman, machinist, volmatroos, matroos-motordrijver, matroos,
      lichtmatroos of deksman aan boord van een schip bevindt; bevoegde autoriteit: door Onze Minister aangewezen
      autoriteit; binnenschip: 1°. vaartuig dat is bestemd voor de vaart op de binnenwateren of op dienovereenkomstige
      buitenlandse wateren; 2°. drijvend werktuig; binnenwateren: wateren die in Nederland zijn gelegen binnen een
      langs de Nederlandse kust gaande, bij ministeriële regeling aan te wijzen lijn; dekbemanning: de bemanning
      met uitzondering van de machinisten; diepgang: verticale afstand van het laagste punt van de scheepsromp aan
      de onderkant van de bodembeplating of van de kiel tot het vlak van de grootste inzinking van de scheepsromp
      in meters; drijvend werktuig: drijvend bouwsel waarop zich werkinstallaties bevinden, zoals grind- of
      zandzuigers, baggermolens, hei-installaties, kranen en elevatoren; gezagvoerder: degene die het gezag voert
      over een schip; Herziene Rijnvaartakte: op 17 oktober 1868 te Mannheim tot stand gekomen Herziene Rijnvaartakte
      (Trb. 1955, 161); onderneming: rechtspersoon, vennootschap zonder rechtspersoonlijkheid, maatschap dan wel
      natuurlijke persoon, die zich bezig houdt met bedrijfsmatig vervoer; Onze Minister: Onze Minister van Verkeer
      en Waterstaat; schip: zeeschip of binnenschip; verwerken van persoonsgegevens: hetgeen daaronder wordt verstaan
      in de [Wet bescherming persoonsgegevens][ref1]; werkgever: 1°. degene jegens wie de gezagvoerder krachtens
      arbeidsovereenkomst of publiekrechtelijke aanstelling gehouden is tot het verrichten van arbeid, behalve indien die
      gezagvoerder aan een derde ter beschikking wordt gesteld voor het verrichten van arbeid welke die derde gewoonlijk
      doet verrichten; 2°. degene aan wie de gezagvoerder ter beschikking is gesteld voor het verrichten van arbeid als
      bedoeld onder 1°; of 3°. degene die zonder werkgever als bedoeld onder 1° of 2° te zijn, de gezagvoerder onder
      zijn gezag arbeid doet verrichten; zeeschip: schip dat blijkens zijn constructie uitsluitend of in hoofdzaak wordt
      gebruikt voor de vaart op zee;


      [ref1]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011468
  - number: '1.2'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt mede verstaan onder: eigenaar van een binnenschip: degene die
      het binnenschip in gebruik heeft, niet zijnde een reis- of tijdbevrachter; vervoer:
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel1
  - number: 1.2.1°
    text: aanbieden van schepen voor het vervoeren van goederen en personen;
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel1
  - number: 1.2.2°
    text: laden en lossen van goederen;
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel1
  - number: 1.2.3°
    text: in- en ontschepen van personen; of
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel1
  - number: 1.2.4°
    text: opslaan van goederen in schepen.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel1
  - number: '1.3'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder vervoer niet verstaan het door een schip vervoeren van
      met behulp van dit schip zelf gevangen vis als bedoeld in de [Visserijwet 1963][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002416
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002416
  - number: '2'
    text: |-
      Overeenkomstig bindende besluiten van instellingen van de Europese Gemeenschappen dan wel anderszins ter uitvoering
      van verdragen of bindende besluiten van volkenrechtelijke organisaties worden bij ministeriële regeling de
      binnenwateren onderverdeeld in zones, die kunnen verschillen met het oog op de eigen omstandigheden van de vaart.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel2
  - number: '3'
    text: Deze wet is van toepassing op de binnenwateren.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel3
  - number: '4'
    text: 'Deze wet is niet van toepassing op schepen:'
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel4
  - number: 4.a
    text: in het beheer van het Ministerie van Defensie; of
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel4
  - number: 4.b
    text: behorende tot een buitenlandse krijgsmacht.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel4
  - number: '5.1'
    text: |-
      Het is degene die bedrijfsmatig vervoer van goederen of personen verricht verboden een schip te gebruiken waarvoor
      niet een in het tweede lid bedoeld document van toelating is afgegeven.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel5
  - number: '5.2'
    text: |-
      Overeenkomstig bindende besluiten van instellingen van de Europese Gemeenschappen dan wel anderszins ter uitvoering
      van verdragen of bindende besluiten van volkenrechtelijke organisaties worden bij of krachtens algemene maatregel
      van bestuur documenten van toelating vastgesteld, die voor bepaalde categorieën van schepen of bepaalde soorten van
      vervoer kunnen verschillen.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel5
  - number: '6.1'
    text: |-
      Het is een onderneming of degene die een onderneming drijft verboden bedrijfsmatig goederen te vervoeren, anders
      dan bestemd voor of afkomstig van de eigen onderneming, zonder dat aan deze onderneming een persoon verbonden is
      aan wie een bewijs van vakbekwaamheid is afgegeven voor het bedrijfsmatig vervoer van goederen en die daadwerkelijk
      en bij voortduring leiding geeft aan de vervoersactiviteit van de onderneming.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel6
  - number: '6.2'
    text: |-
      Onze Minister kan vrijstelling verlenen van de verplichting, bedoeld in het eerste lid. Aan een vrijstelling kunnen
      voorschriften of beperkingen worden verbonden. [Paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref1] is
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '6.3'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot het aantonen van de vakbekwaamheid, waaronder in
      ieder geval zijn begrepen de vereiste kennisgebieden en de vereiste scholing of praktijkervaring.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel6
  - number: '6.4'
    text: |-
      Documenten die ten bewijze van de vakbekwaamheid zijn afgegeven door een andere lidstaat van de Europese Unie
      krachtens bindende besluiten van instellingen van de Europese Gemeenschappen, door een andere staat die partij is
      bij de Overeenkomst betreffende de Europese Economische Ruimte of door Zwitserland, worden gelijkgesteld aan het
      bewijs van vakbekwaamheid, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel6
  - number: '6.5'
    text: |-
      Bij ministeriële regeling kan worden bepaald in welke gevallen en voor welke termijnen Onze Minister ontheffing kan
      verlenen van het eerste lid. Onze Minister kan aan de ontheffing voorschriften of beperkingen verbinden.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel6
  - number: '6.6'
    text: |-
      Het is verboden te handelen in strijd met voorschriften die aan een vrijstelling of ontheffing als bedoeld in het
      tweede onderscheidenlijk vijfde lid zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel6
  - number: '7.1'
    text: Het is verboden een schip te gebruiken zonder de vereiste geldige certificaten.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel7
  - number: '7.2'
    text: |-
      Overeenkomstig bindende besluiten van instellingen van de Europese Gemeenschappen dan wel anderszins ter uitvoering
      van verdragen of bindende besluiten van volkenrechtelijke organisaties worden bij of krachtens algemene maatregel
      van bestuur de soorten certificaten van onderzoek en de categorieën van binnenschepen aangewezen waarvoor een
      certificaat van onderzoek vereist is.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel7
  - number: '8.1'
    text: |-
      Overeenkomstig bindende besluiten van instellingen van de Europese Gemeenschappen dan wel anderszins ter uitvoering
      van verdragen of bindende besluiten van volkenrechtelijke organisaties worden bij ministeriële regeling regels
      gesteld met betrekking tot de technische staat van een binnenschip.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel8
  - number: '8.2'
    text: Bij ministeriële regeling kunnen regels worden gesteld in aanvulling op de in het eerste lid bedoelde regels.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel8
  - number: '8.3'
    text: Het is verboden een binnenschip te gebruiken in strijd met de regels, bedoeld in het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel8
  - number: '9.1'
    text: |-
      Onze Minister of de bevoegde autoriteit verstrekt op aanvraag voor het binnenschip een certificaat van onderzoek,
      indien bij onderzoek is gebleken, dat is voldaan aan de regels, bedoeld in [artikel 8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel8
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '9.2'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de geldigheidsduur van een certificaat van
      onderzoek, alsmede de voorwaarden waaronder een verloren gegaan of beschadigd exemplaar kan worden vervangen.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel9
  - number: '9.3'
    text: Aan het certificaat van onderzoek kunnen voorschriften of beperkingen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel9
  - number: '10.1'
    text: |-
      In het certificaat van onderzoek worden de voorschriften opgenomen die bij het gebruik van het binnenschip in acht
      moeten worden genomen, alsmede in voorkomende gevallen de toegestane afwijkingen en te treffen voorzieningen met
      vermelding van de binnenwateren en de periode, waarvoor deze gelden.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel10
  - number: '10.2'
    text: Het is verboden een binnenschip te gebruiken in strijd met het eerste lid.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel10
  - number: '11'
    text: |-
      Het is de eigenaar of gezagvoerder van een binnenschip waarvoor een certificaat van onderzoek is afgegeven verboden
      het binnenschip te gebruiken zonder dat Onze Minister, onderscheidenlijk de bevoegde autoriteit onverwijld in
      kennis wordt gesteld van:
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel11
  - number: 11.a
    text: belangrijke schade en herstel daarvan;
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel11
  - number: 11.b
    text: verbouwing en andere ingrijpende wijzigingen;
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel11
  - number: 11.c
    text: overgang van de eigendom.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel11
  - number: '12'
    text: |-
      Het is verboden een binnenschip te gebruiken waarvan de toestand, het gebruik en de uitrusting niet in
      overeenstemming zijn met hetgeen is vastgelegd in het certificaat van onderzoek.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel12
  - number: '13.1'
    text: |-
      Onze Minister kan met betrekking tot bepaalde categorieën van binnenschepen van een of meer van de krachtens
      [artikel 8][ref1] gestelde regels vrijstelling verlenen, indien naar zijn oordeel de veiligheid van de
      binnenschepen en de opvarenden voldoende gewaarborgd is. Aan een vrijstelling kunnen voorschriften of beperkingen
      worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel8
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '13.2'
    text: |-
      Onze Minister kan in bijzondere gevallen ontheffing verlenen van een of meer van de krachtens [artikel 8][ref1]
      gestelde regels. Aan een ontheffing kunnen voorschriften of beperkingen worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel8
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '13.3'
    text: |-
      Onze Minister kan een krachtens het tweede lid verleende ontheffing intrekken, indien de aldaar bedoelde
      voorschriften niet worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel13
  - number: '13.4'
    text: |-
      Het is verboden een binnenschip te gebruiken in strijd met de voorschriften die aan een vrijstelling of ontheffing
      als bedoeld in het eerste onderscheidenlijk tweede lid zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel13
  - number: '14.1'
    text: |-
      Onze Minister is belast met het onderzoek van een schip ingevolge deze paragraaf. De onderzoeken kunnen geheel of
      ten dele worden verricht door daartoe door Onze Minister aangewezen natuurlijke personen of rechtspersonen of door
      de Commissie van de Europese Gemeenschappen erkende classificatiebureaus.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel14
  - number: '14.2'
    text: |-
      Onze Minister kan in overeenstemming met de ambtgenoten die het aangaat diensten en personen, ressorterende onder
      een ander ministerie dan dat van Onze Minister, aanwijzen die voor het verrichten van werkzaamheden samenhangende
      met het onderzoek van een schip ter beschikking worden gesteld van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel14
  - number: '14.3'
    text: |-
      Onze Minister stelt in overeenstemming met de ambtgenoten die het aangaat voor de krachtens het tweede lid
      aangewezen diensten en personen beleidsregels betreffende de vervulling van hun taak.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel14
  - number: '14.4'
    text: Een aanwijzing als bedoeld in het eerste of tweede lid wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel14
  - number: '14.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het onderzoek en de
      aanwijzing van de in het eerste lid bedoelde personen.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel14
  - number: '15.1'
    text: |-
      Ten aanzien van een schip waarvoor een certificaat van onderzoek is afgegeven kan Onze Minister in de gevallen,
      bedoeld in [artikel 11, onderdeel a of b][ref1], of bij vermoeden van ernstige gebreken aan het schip een onderzoek
      instellen.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel11
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '15.2'
    text: Onze Minister kan naar aanleiding van het onderzoek aanwijzingen geven aan de eigenaar van het schip.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel15
  - number: '16'
    text: 'Onze Minister kan het certificaat intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel16
  - number: 16.a
    text: |-
      bij het onderzoek blijkt dat niet wordt voldaan aan de in [artikel 8, eerste lid][ref1], bedoelde regels;


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel8
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 16.b
    text: bij het onderzoek blijkt dat bij gebruik van het schip de veiligheid van de vaart in gevaar wordt gebracht;
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel16
  - number: 16.c
    text: niet wordt voldaan aan de vordering tot medewerking aan het onderzoek.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel16
  - number: '17.1'
    text: |-
      Onze Minister kan het gebruik van een schip op de binnenwateren onderbreken, indien de staat waarin het zich
      bevindt zodanig is dat de veiligheid ervan of van zijn omgeving onmiddellijk gevaar loopt.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel17
  - number: '17.2'
    text: |-
      In geval van toepassing van het eerste lid draagt de gezagvoerder er zorg voor, dat het schip onverwijld en met
      inachtneming van de aanwijzingen van Onze Minister naar een door hem aangewezen plaats wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel17
  - number: '17.3'
    text: |-
      De eigenaar dan wel de gezagvoerder laat het schip op de aangewezen plaats liggen, totdat naar het oordeel van Onze
      Minister de redenen voor het onderbreken van het gebruik zijn weggenomen.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel17
  - number: '17.4'
    text: |-
      [Titel 5.3 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op de in het eerste lid bedoelde
      bevoegdheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '17.5'
    text: |-
      Het is verboden een schip te gebruiken zolang het gebruik met toepassing van dit artikel is onderbroken, tenzij met
      inachtneming van de ingevolge het tweede lid gegeven aanwijzingen.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel17
  - number: '18'
    text: |-
      De kosten van een onderzoek en daarmee samenhangende werkzaamheden, voor zover deze worden verricht door Onze
      Minister of de in [artikel 14, tweede lid][ref1], bedoelde diensten en personen, komen ten laste van het Rijk:


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel14
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 18.a
    text: |-
      indien naar aanleiding van een vermoeden ten aanzien van de aanwezigheid van ernstige gebreken aan het schip op
      grond van [artikel 15][ref1] een onderzoek is ingesteld en gebleken is, dat het vermoeden onjuist is geweest; of


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel15
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 18.b
    text: |-
      indien ingevolge [artikel 17, eerste lid][ref1], het gebruik van een schip is onderbroken en gebleken is, dat het
      onderbreken ten onrechte is geschied.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel17
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '19.1'
    text: |-
      In afwachting van de sluiting van overeenkomsten tussen de Europese Unie en derde landen inzake de wederzijdse
      erkenning van scheepscertificaten, kan Onze Minister scheepscertificaten van vaartuigen van derde landen erkennen
      voor het bevaren van de binnenwateren.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel19
  - number: '19.2'
    text: |-
      Het afgeven van certificaten voor vaartuigen uit derde landen geschiedt overeenkomstig de bij of krachtens deze
      paragraaf gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel19
  - number: '20'
    text: 'Deze paragraaf is van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel20
  - number: 20.a
    text: |-
      een binnenschip dat ingevolge
      __REF000___________________________________________________________________________________________________________
      _____ te boek is gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel785
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '785'
  - number: 20.b
    text: |-
      een zeeschip waarmee, op grond van een certificaat van onderzoek, op de binnenwateren met een grotere diepgang mag
      worden gevaren dan op zee of in de kustwateren.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel20
  - number: '21.1'
    text: |-
      Het is verboden een schip te gebruiken zonder geldige meetbrief, afgegeven op grond van de op 15 februari 1966 te
      Genève tot stand gekomen Overeenkomst nopens de meting van binnenvaartuigen (Trb.1967, 43).
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel21
  - number: '21.2'
    text: Bij ministeriële regeling worden regels gesteld met betrekking tot de meting en de meetbrieven.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel21
  - number: '21.3'
    text: |-
      [Paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref1] is van toepassing op de afgifte van meetbrieven
      krachtens het tweede lid, voor zover het gaat om de afgifte van een gewaarmerkt afschrift van eerder afgegeven
      meetbrieven die verloren zijn geraakt of door slijtage ongeldig zijn geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '22.1'
    text: |-
      Overeenkomstig bindende besluiten van instellingen van de Europese Gemeenschappen dan wel anderszins ter uitvoering
      van verdragen of bindende besluiten van volkenrechtelijke organisaties worden bij ministeriële regeling regels
      gesteld voor bij algemene maatregel van bestuur aan te wijzen categorieën van schepen met betrekking tot de
      vaartijden en bemanningssterkte, de uitrustingsstukken van binnenschepen en de hiermee verband houdende eisen.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel22
  - number: '22.2'
    text: |-
      In het belang van de veiligheid van de vaart kan de regeling, bedoeld in het eerste lid, aanvullende regels
      bevatten inzake:
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel22
  - number: 22.2.a
    text: de vaartijden van schepen;
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel22
  - number: 22.2.b
    text: |-
      de samenstelling van de minimumbemanning van in die regeling aan te wijzen soorten schepen en categorieën daarvan
      en bij te onderscheiden exploitatiewijzen, alsmede de aan bemanningsleden te stellen eisen;
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel22
  - number: 22.2.c
    text: eisen aan de deskundigheid van bemanningsleden, waaronder begrepen opleiding en ervaring;
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel22
  - number: 22.2.d
    text: de rusttijden van de bemanningsleden.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel22
  - number: '22.3'
    text: |-
      Indien de regeling, bedoeld in het eerste lid, uitsluitend betrekking heeft op de wateren, bedoeld in artikel
      4, eerste lid, van de Herziene Rijnvaartakte, kan Onze Minister voor de overige binnenwateren regels stellen met
      betrekking tot de in het eerste lid genoemde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel22
  - number: '22.4'
    text: |-
      Onze Minister kan, indien naar zijn oordeel de veilige vaart voldoende gewaarborgd is, met betrekking tot bepaalde
      categorieën van schepen vrijstelling verlenen van een of meer eisen, bedoeld in het eerste tot en met derde lid.
      Aan een vrijstelling kunnen voorschriften of beperkingen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel22
  - number: '22.5'
    text: |-
      Onze Minister kan ontheffing verlenen van de krachtens het eerste tot en met derde lid gestelde eisen. Aan de
      ontheffing kunnen voorschriften of beperkingen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel22
  - number: '22.6'
    text: |-
      Onze Minister kan een krachtens het vijfde lid verleende ontheffing intrekken, indien de aldaar bedoelde
      voorschriften niet worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel22
  - number: '22.7'
    text: 'De gezagvoerder of de werkgever zijn verplicht tot naleving van:'
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel22
  - number: 22.7.a
    text: het bepaalde krachtens het eerste en tweede lid, onderdelen a tot en met c;
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel22
  - number: 22.7.b
    text: het tot hen gerichte krachtens het tweede lid, onderdeel d, bepaalde; en
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel22
  - number: 22.7.c
    text: de krachtens het vierde of vijfde lid, aan een vrijstelling of ontheffing verbonden voorschriften.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel22
  - number: '22.8'
    text: 'Een bemanningslid is verplicht tot naleving van:'
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel22
  - number: 22.8.a
    text: het tot hem gerichte krachtens het eerste en tweede lid, onderdelen a en d, bepaalde; en
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel22
  - number: 22.8.b
    text: de tot hem gerichte krachtens het vierde of vijfde lid, aan een vrijstelling of ontheffing verbonden voorschriften.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel22
  - number: '22.9'
    text: Het is verboden te handelen in strijd met dit artikel.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel22
  - number: '23.1'
    text: |-
      Het is een gezagvoerder of een werkgever verboden een binnenschip te gebruiken met een bemanningslid dat niet over
      een geldige geneeskundige verklaring beschikt.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel23
  - number: '23.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften gesteld met betrekking tot de geneeskundige
      verklaring.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel23
  - number: '23.3'
    text: |-
      De [artikelen 28][ref1] en [31][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0023009#Artikel31
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0023009
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '24.1'
    text: |-
      Een ambtenaar als bedoeld in [artikel 40, eerste of tweede lid][ref1], kan vorderen dat binnen een door hem te
      stellen termijn een nieuw geneeskundig onderzoek wordt uitgevoerd, indien hij redelijkerwijs vermoedt dat de houder
      daarvan niet meer voldoet aan de eisen, bedoeld in [artikel 23, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0023009#Artikel23
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '40'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0023009
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '24.2'
    text: |-
      Indien een geneeskundige verklaring wordt afgegeven overeenkomstig het eerste lid, komen de kosten van afgifte ten
      laste van het Rijk.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel24
  - number: '24.3'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel24
  - number: '25.1'
    text: |-
      Voor het voeren van bij of krachtens algemene maatregel van bestuur te bepalen categorieën van schepen is aan de
      gezagvoerder een geldig vaarbewijs afgegeven.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel25
  - number: '25.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden de verschillende soorten vaarbewijzen en de geldigheidsduur
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel25
  - number: '25.3'
    text: |-
      Dit artikel is niet van toepassing op de gezagvoerder aan wie een bij of krachtens algemene maatregel van bestuur
      aan te wijzen gelijkwaardig document is afgegeven.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel25
  - number: '25.4'
    text: |-
      Het is verboden een schip te gebruiken zonder dat aan de gezagvoerder het daarvoor vereiste geldige vaarbewijs
      is afgegeven.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel25
  - number: '25.5'
    text: 'Het voeren of als gezagvoerder doen voeren van een binnenschip is verboden aan degene:'
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel25
  - number: 25.5.a
    text: |-
      die weet of redelijkerwijs moet weten dat een op zijn naam gesteld vaarbewijs voor een gedeelte of het geheel van
      de geldigheidsduur ongeldig is verklaard, gedurende dat gedeelte of het geheel van de geldigheidsduur,
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel25
  - number: 25.5.b
    text: |-
      aan wie ingevolge [artikel 35b van de Scheepvaartverkeerswet][ref1] de bevoegdheid tot het voeren van schepen is
      ontzegd, gedurende de termijn van ontzegging, of


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel35b
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: 35b
  - number: 25.5.c
    text: |-
      van wie het vaarbewijs of het bewijs van vrijstelling of ontheffing, bedoeld in [artikel 31][ref1], met toepassing
      van de [artikelen 35a][ref2] of [35c van de Scheepvaartverkeerswet][ref3] is ingenomen en niet is teruggegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel35a
      [ref3]: https://wetten.overheid.nl/BWBR0004364#Artikel35c
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0004364
        artikel: 35a
      - id: ref3
        bwb_id: BWBR0004364
        artikel: 35c
  - number: '26.1'
    text: |-
      Onze Minister verstrekt een vaarbewijs na overlegging van verklaringen waaruit blijkt, dat de aanvrager voldoet aan
      bij of krachtens algemene maatregel van bestuur te stellen voorschriften om het binnenschip veilig te voeren.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel26
  - number: '26.2'
    text: 'De in het eerste lid bedoelde voorschriften hebben betrekking op:'
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel26
  - number: 26.2.a
    text: de lichamelijke en geestelijke geschiktheid; en
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel26
  - number: 26.2.b
    text: de kennis en de bekwaamheid om het binnenschip te voeren.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel26
  - number: '26.3'
    text: |-
      De in het eerste lid bedoelde voorschriften kunnen betrekking hebben op de vaartijd. Onder vaartijd wordt verstaan
      de tijd die na het bereiken van de leeftijd van 16 jaar is doorgebracht als lid van de dekbemanning van een schip.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel26
  - number: '26.4'
    text: De in het eerste lid bedoelde voorschriften kunnen verschillend zijn naar gelang het soort vaarbewijs.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel26
  - number: '27.1'
    text: |-
      Een vaarbewijs of bewijs van vrijstelling of ontheffing, bedoeld in [artikel 31][ref1], wordt niet afgegeven aan
      degene:


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel31
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 27.1.a
    text: die de leeftijd van 18 jaar nog niet heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel27
  - number: 27.1.b
    text: van wie het bewijs ongeldig is verklaard, gedurende de termijn van ongeldigheid;
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel27
  - number: 27.1.c
    text: |-
      aan wie ingevolge [artikel 35b van de Scheepvaartverkeerswet][ref1] de bevoegdheid tot het voeren van schepen is
      ontzegd, gedurende de termijn van ontzegging; of


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel35b
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: 35b
  - number: 27.1.d
    text: |-
      van wie het bewijs met toepassing van de [artikelen 35a][ref1] of [35c van de Scheepvaartverkeerswet][ref2] is
      ingenomen en niet is teruggegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel35a
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel35c
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: 35a
      - id: ref2
        bwb_id: BWBR0004364
        artikel: 35c
  - number: '27.2'
    text: |-
      Voor de toepassing van het eerste lid, onderdeel b, wordt onder vaarbewijs mede verstaan een vaarbewijs, afgegeven
      door het daartoe bevoegde gezag buiten Nederland, waarvan de houder in Nederland woont.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel27
  - number: '28.1'
    text: |-
      Onze Minister wijst de deskundigen aan die belast zijn met het onderzoek naar de lichamelijke en geestelijke
      geschiktheid, bedoeld in [artikel 26, tweede lid, onderdeel a][ref1]. De deskundige geeft een verklaring af, indien
      het onderzoek met gunstig gevolg heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel26
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '28.2'
    text: |-
      Indien de in het eerste lid bedoelde verklaring daartoe aanleiding geeft, kunnen aan het vaarbewijs voorschriften
      of beperkingen worden verbonden, die op het vaarbewijs worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel28
  - number: '28.3'
    text: |-
      Indien de afgifte van een in het eerste lid bedoelde verklaring wordt geweigerd of indien blijkt uit die verklaring
      dat het gaat om een beperkte geschiktheid, dan wordt de aanvrager op diens aanvraag door een andere door Onze
      Minister aangewezen deskundige nogmaals onderzocht. Het eerste lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel28
  - number: '28.4'
    text: De deskundige gaat eerst tot een onderzoek over nadat de aanvrager zich heeft gelegitimeerd.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel28
  - number: '28.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald in welke gevallen het onderzoek achterwege
      blijft en op welke wijze en voor welk soort vaarbewijs de aanvrager zijn lichamelijke en geestelijke geschiktheid
      opnieuw aantoont.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel28
  - number: '28.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het
      onderzoek of de verklaring van lichamelijke en geestelijke geschiktheid.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel28
  - number: '28.7'
    text: |-
      Het is de gezagvoerder of de werkgever verboden te handelen in strijd met de voorschriften die ingevolge het tweede
      lid zijn verbonden aan een vaarbewijs.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel28
  - number: '29.1'
    text: |-
      Onze Minister wijst de instellingen of personen aan die belast zijn met het onderzoek naar de kennis en bekwaamheid
      als bedoeld in [artikel 26, tweede lid, onderdeel b][ref1]. Op de aangewezen instellingen of personen is de
      Kaderwet zelfstandige bestuursorganen van toepassing. Zij verstrekken een verklaring, indien het onderzoek met
      gunstig gevolg heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel26
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '29.2'
    text: 'Het onderzoek kan geheel of gedeeltelijk achterwege blijven, indien de aanvrager in het bezit is van:'
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel29
  - number: 29.2.a
    text: een geldig vaarbewijs;
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel29
  - number: 29.2.b
    text: een vaarbewijs dat zijn geldigheid heeft verloren door het verstrijken van de geldigheidsduur;
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel29
  - number: 29.2.c
    text: |-
      een door Onze Minister ingevolge [artikel 32, eerste lid][ref1], erkend gelijkwaardig document of bewijs van kennis
      en bekwaamheid voor de binnenvaart.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel32
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '29.3'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel29
  - number: 29.3.a
    text: het onderzoek naar de kennis en bekwaamheid, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel29
  - number: 29.3.b
    text: de aanwijzing van instellingen of personen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel29
  - number: '30.1'
    text: 'Onze Minister kan een vaarbewijs ongeldig verklaren voor een gedeelte of het geheel van de geldigheidsduur, indien:'
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel30
  - number: 30.1.a
    text: |-
      het vaarbewijs is afgegeven op grond van door de houder verschafte onjuiste gegevens en het niet zou zijn
      afgegeven, indien de onjuistheid van die gegevens ten tijde van de aanvraag bekend zou zijn geweest;
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel30
  - number: 30.1.b
    text: het vaarbewijs kennelijk abusievelijk aan de houder is afgegeven;
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel30
  - number: 30.1.c
    text: de houder hierom schriftelijk verzoekt;
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel30
  - number: 30.1.d
    text: |-
      de houder blijkens een nader onderzoek niet beschikt over de lichamelijke of geestelijke geschiktheid die is
      vereist voor het voeren van een binnenschip dan wel zich op eerste vordering van Onze Minister niet aan een
      dergelijk onderzoek onderwerpt;
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel30
  - number: 30.1.e
    text: |-
      naar zijn oordeel de houder niet over de kennis of bekwaamheid beschikt die is vereist voor het voeren van een
      binnenschip;
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel30
  - number: 30.1.f
    text: |-
      de houder niet voldoet aan de voorschriften, bedoeld in [artikel 28, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel28
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '30.2'
    text: |-
      Indien bij het nader onderzoek, bedoeld in het eerste lid, onderdeel d, de ongeschiktheid niet blijkt, komen
      de kosten van het onderzoek ten laste van het Rijk. [Artikel 28, eerste lid en vierde lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel28
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '30.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het ongeldig
      verklaren, het invorderen en het teruggeven van een vaarbewijs.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel30
  - number: '31.1'
    text: |-
      Onze Minister kan, indien naar zijn oordeel de veilige vaart voldoende gewaarborgd is, met betrekking tot bepaalde
      categorieën van binnenschepen vrijstelling verlenen van de op een gezagvoerder rustende verplichting, bedoeld in
      [artikel 25, eerste lid][ref1]. Aan een vrijstelling kunnen voorschriften of beperkingen worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel25
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '31.2'
    text: |-
      Onze Minister kan, indien naar zijn oordeel de veilige vaart voldoende gewaarborgd is, aan een gezagvoerder
      ontheffing verlenen van de in [artikel 25, eerste lid][ref1], bedoelde verplichting. Aan een ontheffing kunnen
      voorschriften of beperkingen worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel25
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '31.3'
    text: |-
      Onze Minister kan een krachtens het tweede lid verleende ontheffing intrekken, indien de gezagvoerder de aldaar
      bedoelde voorschriften niet naleeft.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel31
  - number: '31.4'
    text: |-
      Het is verboden te handelen in strijd met aan een vrijstelling of ontheffing als bedoeld in het eerste
      onderscheidenlijk tweede lid verbonden voorschriften.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel31
  - number: '32.1'
    text: |-
      Onze Minister kan een bewijs van kennis en bekwaamheid voor een of meer vormen van binnenvaart erkennen, indien
      naar zijn oordeel het bewijs voldoende waarborg biedt voor het veilig voeren van een binnenschip. Alsdan treedt
      het bewijs van kennis en bekwaamheid gedeeltelijk in de plaats van het onderzoek of geheel in de plaats van de
      verklaring, bedoeld in [artikel 29, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel29
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '32.2'
    text: |-
      Bij ministeriële regeling kunnen vaarbewijzen of bewijzen van kennis en bekwaamheid worden erkend die zijn
      afgegeven door een bevoegde autoriteit in het buitenland. Het eerste lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel32
  - number: '32.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op andere geneeskundige verklaringen dan de
      verklaring, bedoeld in [artikel 28, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel28
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '33.1'
    text: |-
      Overeenkomstig bindende besluiten van instellingen van de Europese Gemeenschappen dan wel anderszins ter uitvoering
      van verdragen of bindende besluiten van volkenrechtelijke organisaties worden bij ministeriële regeling regels
      gegeven ten aanzien van vaarbewijzen.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel33
  - number: '33.2'
    text: Het is verboden te handelen in strijd met de regels, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel33
  - number: '34'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen nadere regels gesteld worden met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel34
  - number: 34.a
    text: |-
      de binnenwateren waarop de vaarbewijzen geldig zijn, de houder van het vaarbewijs of het binnenschip waarmee wordt
      gevaren;
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel34
  - number: 34.b
    text: de vereisten voor de afgifte van de vaarbewijzen;
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel34
  - number: 34.c
    text: de modellen voor de vaarbewijzen.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel34
  - number: '35.1'
    text: |-
      Aan autoriteiten die betrokken zijn bij de uitvoering van deze wet of die zijn belast met de handhaving van de bij
      of krachtens deze wet vastgestelde regels, worden op bij of krachtens algemene maatregel van bestuur te bepalen
      wijze gegevens verstrekt omtrent afgegeven en ongeldige vaarbewijzen die deze autoriteiten voor de uitoefening van
      hun taak behoeven.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel35
  - number: '35.2'
    text: |-
      Aan de met de afgifte van vaarbewijzen belaste autoriteiten buiten Nederland worden inlichtingen als in het eerste
      lid bedoeld verstrekt in de gevallen en op de wijze, zoals bij of krachtens algemene maatregel van bestuur bepaald.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel35
  - number: 35a.1
    text: 'Onze Minister houdt een register bij van:'
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel35a
  - number: 35a.1.a
    text: |-
      ontzeggingen van de vaarbevoegdheid als bedoeld in [artikel 35b van de Scheepvaartverkeerswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel35b
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: 35b
  - number: 35a.1.b
    text: |-
      vaarbewijzen of bewijzen van vrijstelling of ontheffing als bedoeld in [artikel 31][ref1], die:


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel31
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 35a.1.b.1°
    text: |-
      zijn ingeleverd of ingevorderd ingevolge de [artikelen 35a][ref1], [35b][ref2] of
      [35c van de Scheepvaartverkeerswet][ref3], of


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel35a
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel35b
      [ref3]: https://wetten.overheid.nl/BWBR0004364#Artikel35c
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: 35a
      - id: ref2
        bwb_id: BWBR0004364
        artikel: 35b
      - id: ref3
        bwb_id: BWBR0004364
        artikel: 35c
  - number: 35a.1.b.2°
    text: ongeldig zijn verklaard.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel35a
  - number: 35a.2
    text: 'Het verzamelen van gegevens als bedoeld in het eerste lid, geschiedt voor de volgende doeleinden:'
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel35a
  - number: 35a.2.a
    text: |-
      een goede en adequate uitvoering van deze wet, voor zover het gaat om de ontzegging van de vaarbevoegdheid en de
      ongeldigverklaring van vaardocumenten, bedoeld in [artikel 25, vijfde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel25
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 35a.2.b
    text: |-
      de handhaving van bij of krachtens deze wet vastgestelde voorschriften, voor zover het gaat om ontzegging van de
      vaarbevoegdheid en de ongeldigverklaring van vaardocumenten, bedoeld in [artikel 25, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel25
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 35a.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de inrichting en het beheer
      van het register. Deze regels betreffen in ieder geval:
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel35a
  - number: 35a.3.a
    text: de periode gedurende welke de gegevens worden bewaard;
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel35a
  - number: 35a.3.b
    text: de waarborgen dat de persoonlijke levenssfeer van de betrokkene niet onevenredig wordt geschaad;
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel35a
  - number: 35a.3.c
    text: de genomen maatregelen om de beveiliging van de verwerking te waarborgen;
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel35a
  - number: 35a.3.d
    text: de verbetering, aanvulling of verwijdering van gegevens, al dan niet op verzoek van betrokkene;
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel35a
  - number: 35a.3.e
    text: de ontvangers of categorieën van ontvangers aan wie de gegevens kunnen worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel35a
  - number: 35a.3.f
    text: de voorgenomen doorgiften van gegevens naar landen buiten de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel35a
  - number: 35b.1
    text: |-
      Aan autoriteiten die betrokken zijn bij de uitvoering van deze wet of zijn belast met de handhaving van de bij of
      krachtens deze wet vastgestelde voorschriften, worden op bij of krachtens algemene maatregel van bestuur te bepalen
      wijze gegevens verstrekt omtrent ontzeggingen van de vaarbevoegdheid die deze autoriteiten voor de uitoefening van
      hun taak behoeven.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel35b
  - number: 35b.2
    text: |-
      Aan de met de afgifte van vaarbewijzen belaste autoriteiten buiten Nederland worden inlichtingen als in het eerste
      lid bedoeld verstrekt in de gevallen en op de wijze, zoals bij of krachtens algemene maatregel van bestuur bepaald.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel35b
  - number: 35c.1
    text: |-
      Onze Minister is op bij algemene maatregel van bestuur bepaalde wijze bevoegd tot het invoeren, wijzigen dan wel
      verwijderen van gegevens die van belang zijn voor het bijhouden van het register.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel35c
  - number: 35c.2
    text: |-
      Het openbaar ministerie bij de rechtbank waar een ontzegging van de vaarbevoegdheid wordt uitgesproken, doet binnen
      twee weken mededeling aan Onze Minister van die ontzegging, waarbij de termijn van ontzegging wordt vermeld.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel35c
  - number: '36.1'
    text: |-
      Onze Minister kent aan een binnenschip dat in Nederland op grond van
      [artikel 785, eerste lid, van Boek 8 van het Burgerlijk Wetboek][ref1] te boek is gesteld en aan een binnenschip
      waarvoor een certificaat van onderzoek is afgegeven een scheepsnummer toe, waaronder mede wordt begrepen het
      aanmerken als scheepsnummer van een overeenkomstige aanduiding die bij of krachtens andere wet is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel785
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '785'
  - number: '36.2'
    text: 'De eigenaar van het binnenschip waaraan een scheepsnummer is toegekend is verplicht:'
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel36
  - number: 36.2.a
    text: dit nummer binnen twee weken na de toekenning en kennisgeving ervan op zijn binnenschip aan te brengen;
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel36
  - number: 36.2.b
    text: |-
      van elke wijziging in de omstandigheden van het binnenschip die aanleiding kunnen geven tot wijziging van het
      scheepsnummer binnen twee weken aan Onze Minister kennis te geven.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel36
  - number: '36.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het
      scheepsnummer.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel36
  - number: '36.4'
    text: |-
      Het is de eigenaar van het binnenschip verboden te handelen in strijd met het tweede lid of met de regels, bedoeld
      in het derde lid.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel36
  - number: '37.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de registratie van
      gegevens ten behoeve van het toezicht op de naleving van de krachtens [hoofdstuk 3, paragraaf 3][ref1], gegeven
      regels en voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0023009
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '37.2'
    text: Het is verboden te handelen in strijd met de regels, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel37
  - number: '38'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de verstrekking van
      gegevens betreffende het vervoer in het belang van de statistiek.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel38
  - number: '39.1'
    text: |-
      Persoonsgegevens betreffende de gezondheid of strafrechtelijke persoonsgegevens als bedoeld in
      [artikel 16 van de Wet bescherming persoonsgegevens][ref1], worden verwerkt ter uitvoering van:


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel16
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '16'
  - number: 39.1.a
    text: |-
      [artikel 6][ref1], mede betreffende de wettelijke onbekwaamheid, met het oogmerk te beoordelen of aan dit artikel
      toepassing kan worden gegeven dan wel of ontheffing onderscheidenlijk vrijstelling kan worden verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel6
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '6'
        hoofdstuk: '2'
  - number: 39.1.b
    text: |-
      [artikel 23][ref1], met het oogmerk te beoordelen of een bemanningslid voldoet of niet meer voldoet aan de bij of
      krachtens deze wet gestelde vereisten betreffende de lichamelijke geschiktheid;


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel23
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 39.1.c
    text: |-
      [artikel 26, eerste lid][ref1], met het oogmerk te beoordelen of de aanvrager voldoet aan de bij of krachtens deze
      wet gestelde eisen betreffende de lichamelijke en geestelijke geschiktheid;


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel26
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 39.1.d
    text: |-
      [artikel 30, eerste lid, onderdeel d][ref1], met het oogmerk te beoordelen of sprake is van lichamelijke of
      geestelijke ongeschiktheid van de houder van een vaarbewijs;


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel30
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 39.1.e
    text: |-
      [artikel 35a][ref1], ter handhaving van rechterlijke uitspraken houdende ontzegging van de vaarbevoegdheid
      en ter voorkoming van de afgifte van vaarbewijzen of bewijzen van vrijstelling of ontheffingen, bedoeld in
      [artikel 31][ref2], aan personen als bedoeld in [artikel 25, vijfde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel35a
      [ref2]: https://wetten.overheid.nl/BWBR0023009#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0023009#Artikel25
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: 35a
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0023009
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0023009
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '39.2'
    text: Onze Minister is verantwoordelijk voor de verwerking van de in het eerste lid bedoelde persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel39
  - number: '39.3'
    text: |-
      Ter uitvoering van de Herziene Rijnvaartakte kunnen persoonsgegevens worden verwerkt betreffende de gezondheid
      van de bemanning van schepen die zich op de Rijn, inbegrepen de Lek en de Waal, bevinden. De verwerking van deze
      gegevens vindt plaats teneinde de lichamelijke geschiktheid van de bemanning vast te stellen.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel39
  - number: '39.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt bepaald wie verantwoordelijk is voor de verwerking van de in
      het derde lid bedoelde persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel39
  - number: 39a
    text: 'In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel39a
  - number: 39a.a
    text: |-
      verdrag: het op 9 september 1996 te Straatsburg tot stand gekomen verdrag inzake de verzameling, afgifte en inname
      van afval in de Rijn- en binnenvaart (Trb. 1996, 293);
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel39a
  - number: 39a.b
    text: 'afvalbeheerbijdrage: de in artikel 6, eerste lid, van het verdrag bedoelde verwijderingsbijdrage;'
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel39a
  - number: 39a.c
    text: |-
      betrekken van gasolie: het betrekken van gasolie in gevallen waarin de levering van die gasolie gepaard gaat
      met een uitslag of een invoer ter zake waarvan [artikel 66, eerste lid, onder a, van de Wet op de accijns][ref1]
      van toepassing is, dan wel ter zake van de levering van die gasolie
      [artikel 70, eerste lid, onder b, van die wet][ref2] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel70
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '66'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '70'
  - number: 39a.d
    text: 'leverancier: leverancier van de gasolie;'
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel39a
  - number: 39a.e
    text: 'nationaal instituut: Nederlandse nationaal instituut, bedoeld in artikel 9 van het verdrag.'
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel39a
  - number: 39b.1
    text: |-
      Dit hoofdstuk is van toepassing op binnenschepen waarvan de hoofd- of hulpmotoren, met uitzondering van
      ankerlieren, verbrandingsmotoren zijn.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel39b
  - number: 39b.2
    text: |-
      In afwijking van het eerste lid is dit hoofdstuk, met uitzondering van [artikel 39e][ref1], niet van toepassing met
      betrekking tot schepen die zijn toegelaten voor de zee- of kustvaart en overwegend daartoe bestemd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel39e
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel39b
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: 39e
        hoofdstuk: 4a
        paragraaf: '2'
  - number: 39c.1
    text: |-
      Ter zake van het betrekken van gasolie ten behoeve van een schip wordt een afvalbeheerbijdrage geheven van de
      eigenaar van het schip.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel39c
  - number: 39c.2
    text: De afvalbeheerbijdrage is verschuldigd op het tijdstip van het betrekken, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel39c
  - number: 39c.3
    text: |-
      De betaling van de afvalbeheerbijdrage geschiedt namens de eigenaar van het schip door de gezagvoerder en door
      tussenkomst van de leverancier, volgens de bij algemene maatregel van bestuur vastgestelde voorschriften voor de
      eigenaar van het schip en de gezagvoerder ten aanzien van het betrekken en voor de leverancier ten aanzien van het
      leveren van gasolie.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel39c
  - number: 39d.1
    text: De afvalbeheerbijdrage wordt berekend over het aantal liters gasolie dat ten behoeve van het schip is betrokken.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel39d
  - number: 39d.2
    text: |-
      Het in een kalenderjaar geldende tarief van de afvalbeheerbijdrage is het tarief dat krachtens artikel 14, derde
      lid, onder b, van het verdrag voor het desbetreffende kalenderjaar is vastgesteld bij besluit van de Conferentie
      der Verdragsluitende Partijen.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel39d
  - number: 39d.3
    text: |-
      Het tarief van de afvalbeheerbijdrage wordt door Onze Minister telkens zo spoedig mogelijk na de in het tweede lid
      bedoelde vaststelling in de Staatscourant bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel39d
  - number: 39e
    text: |-
      Bij algemene maatregel van bestuur worden de administratieve verplichtingen van de eigenaar van het schip en de
      gezagvoerder, alsmede van de leverancier in verband met de afvalbeheerbijdrage geregeld.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel39e
  - number: 39f
    text: |-
      Bij constatering van het feit dat voor een schip niet volledig is voldaan aan de ingevolge
      [artikel 39c, derde lid][ref1], geldende voorschriften, geeft Onze Minister met betrekking tot het
      bedrag aan afvalbeheerbijdrage dat door de eigenaar van het schip is verschuldigd toepassing aan
      [artikel 4:86 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel39c
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel39f
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: 39c
        hoofdstuk: 4a
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 39g.1
    text: |-
      Onze Minister wijst in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer
      een rechtspersoon met volledige rechtsbevoegdheid, waarin vertegenwoordigers van de bedrijfstak van de binnenvaart
      zijn opgenomen, aan als nationaal instituut.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel39g
  - number: 39g.2
    text: 'Het nationaal instituut is belast met:'
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel39g
  - number: 39g.2.a
    text: |-
      de organisatie van de inzameling en de verdere verwijdering van olie- en vethoudende scheepsafvalstoffen, alsmede
      de financiering daarvan, bedoeld in artikel 9, eerste lid, van het verdrag, met inbegrip van de inning van de
      afvalbeheerbijdrage, en
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel39g
  - number: 39g.2.b
    text: |-
      de Nederlandse vertegenwoordiging in het Internationaal Verevenings- en Coördinatieorgaan, in overeenstemming met
      artikel 10, tweede lid, laatste volzin, van het verdrag.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel39g
  - number: 39g.3
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels omtrent de taken van het nationaal instituut en de wijze
      van uitoefening daarvan vastgesteld.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel39g
  - number: 39g.4
    text: |-
      Onze Minister draagt zorg voor de vervulling van de taken die ingevolge het verdrag aan nationale instituten kunnen
      worden opgedragen, voor zover die niet behoren tot de in het tweede lid bedoelde taken, alsmede voor de vervulling
      van de in het tweede lid bedoelde taken indien geen aanwijzing als bedoeld in het eerste lid van kracht is.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel39g
  - number: 39g.5
    text: |-
      Een aanwijzing als bedoeld in het eerste lid kan worden ingetrokken indien de aangewezen instelling niet langer
      voldoet aan het bepaalde in het eerste lid, dan wel handelt in strijd met de in het derde lid bedoelde regels.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel39g
  - number: 39h.1
    text: |-
      Onze Minister verstrekt aan de ingevolge [artikel 39g][ref1] aangewezen rechtspersoon subsidie:


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel39g
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel39h
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: 39g
        hoofdstuk: 4a
        paragraaf: '3'
  - number: 39h.1.a
    text: |-
      ten aanzien van de kosten van de personele en materiële voorzieningen die nodig zijn voor de uitvoering van de
      ingevolge [artikel 39g][ref1] aan het nationaal instituut toegekende taken en


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel39g
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel39h
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: 39g
        hoofdstuk: 4a
        paragraaf: '3'
  - number: 39h.1.b
    text: ten aanzien van de internationale financiële verevening, bedoeld in artikel 10, eerste lid, van het verdrag.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel39h
  - number: 39h.2
    text: |-
      De [Kaderwet subsidies Verkeer en Waterstaat][ref1] en [afdeling 4.2.8 van de Algemene wet bestuursrecht][ref2]
      zijn van toepassing op de subsidieverstrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0009196
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.2.8
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel39h
    references:
      - id: ref1
        bwb_id: BWBR0009196
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: 4.2.8
  - number: 39i
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld ten aanzien van de in dit
      hoofdstuk geregelde onderwerpen, voor zover dat nodig is voor een goede uitvoering van het verdrag, daaronder
      begrepen de uitvoering van een besluit van de Conferentie der Verdragsluitende Partijen.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel39i
  - number: '40.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet en de Herziene Rijnvaartakte zijn
      belast:
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel40
  - number: 40.1.a
    text: |-
      de bij of krachtens [artikel 141 van het Wetboek van Strafvordering][ref1] aangewezen ambtenaren;


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 40.1.b
    text: de door Onze Minister aangewezen ambtenaren van de Inspectie Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel40
  - number: '40.2'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn voorts belast andere dan in het
      eerste lid, onderdeel b, bedoelde door Onze Minister aangewezen ambtenaren. Indien Onze Minister ambtenaren van
      provincies, gemeenten of waterschappen aanwijst, doet hij dit in overeenstemming met de desbetreffende besturen.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel40
  - number: '40.3'
    text: Een aanwijzing als bedoeld in het tweede lid wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel40
  - number: '40.4'
    text: Onze Minister kan beleidsregels vaststellen met betrekking tot het toezicht op de naleving.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel40
  - number: '41.1'
    text: |-
      Een ambtenaar als bedoeld in [artikel 40][ref1] is bevoegd afgifte te vorderen van bij of krachtens deze wet
      vereiste documenten die ongeldig zijn verklaard of zijn ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel40
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '40'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '41.2'
    text: |-
      Een ambtenaar als bedoeld in [artikel 40][ref1] beschikt niet over de bevoegdheid, genoemd in
      [artikel 5:18 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '40'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '42.1'
    text: |-
      Een ambtenaar als bedoeld in [artikel 40][ref1] is bevoegd afgifte van het vaarbewijs te vorderen indien naar zijn
      oordeel het vermoeden bestaat van lichamelijke of geestelijke ongeschiktheid tot het voeren van een binnenschip of
      de houder niet over de kennis of bekwaamheid beschikt die is vereist voor het voeren van een binnenschip. Hij legt
      het vaarbewijs waarvan afgifte is gevorderd onverwijld en onder opgave van redenen aan Onze Minister over.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel40
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '40'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '42.2'
    text: |-
      Onze Minister neemt, nadat hij van de vordering tot afgifte kennis heeft genomen, onverwijld een besluit over
      de geldigheid van het vaarbewijs. Totdat een besluit als bedoeld in dit lid is genomen, geldt het besluit van de
      vordering tot afgifte als een besluit als bedoeld in [artikel 31, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel31
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '42.3'
    text: Wanneer Onze Minister niet tot verlies van geldigheid besluit, geeft hij het vaarbewijs aan de houder terug.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel42
  - number: '42.4'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op een vaarbewijs als bedoeld in
      [artikel 32, tweede lid][ref1]. Onze Minister legt dit vaarbewijs onverwijld en onder opgave van redenen over aan
      de desbetreffende bevoegde autoriteit in het buitenland met het verzoek over de geldigheid van het vaarbewijs een
      besluit te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel32
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '43.1'
    text: 'Bij ministeriële regeling wordt vastgesteld welke documenten die bij of krachtens deze wet zijn vereist:'
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel43
  - number: 43.1.a
    text: aan boord van het schip aanwezig zijn; of
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel43
  - number: 43.1.b
    text: op andere wijze kunnen worden getoond.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel43
  - number: '43.2'
    text: |-
      Het is degene op wie krachtens het eerste lid de verplichting berust documenten aan boord te hebben of op andere
      wijze te tonen, verboden te handelen in strijd met het eerste lid.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel43
  - number: '44'
    text: |-
      Onze Minister is bevoegd tot toepassing van bestuursdwang ter handhaving van de bij of krachtens deze wet en de
      Herziene Rijnvaartakte gestelde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel44
  - number: '45.1'
    text: |-
      Met de opsporing van de bij of krachtens deze wet en de Herziene Rijnvaartakte strafbaar gestelde feiten zijn
      belast de bij of krachtens [artikel 141 van het Wetboek van Strafvordering][ref1] aangewezen ambtenaren, alsmede de
      in [artikel 40][ref2] bedoelde ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0023009#Artikel40
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0023009
        artikel: '40'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '45.2'
    text: |-
      De in het eerste lid bedoelde ambtenaren zijn tevens belast met de opsporing van de feiten, strafbaar gesteld
      in de [artikelen 179 tot en met 182][ref1] en [184 van het Wetboek van Strafrecht][ref2], voor zover deze feiten
      betrekking hebben op een bevel, vordering of handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '179'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '184'
  - number: '46.1'
    text: |-
      Op de eerste vordering van de ambtenaren, bedoeld in de [artikelen 40][ref1] en [45][ref2], geeft de houder
      behoorlijk ter inzage af de documenten die bij of krachtens deze wet zijn vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0023009#Artikel45
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '40'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0023009
        artikel: '45'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '46.2'
    text: Het is verboden te handelen in strijd met het eerste lid.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel46
  - number: '47.1'
    text: |-
      De [artikelen 5:13][ref1] en [5:15 tot en met 5:20 van de Algemene wet bestuursrecht][ref2] zijn van
      overeenkomstige toepassing ten aanzien van de ambtenaren, bedoeld in [artikel 45][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0023009#Artikel45
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
