  - number: '48.2'
    text: |-
      De bestuurlijke boete die ten hoogste kan worden opgelegd komt overeen met de boete van de vierde categorie,
      bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
  - number: '48.3'
    text: |-
      De op te leggen bestuurlijke boete kan met maximaal 50% worden verhoogd, indien binnen een periode van 48 maanden
      tweemaal voor een zelfde feit, elk afzonderlijk in een periode van maximaal 24 maanden voorafgaand aan dat feit,
      een boete is opgelegd en onherroepelijk is geworden. In afwijking van het tweede lid geldt deze verhoging ook voor
      de ten hoogste op te leggen boete.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel48
  - number: '48.4'
    text: Bij ministeriële regeling worden de boetebedragen voor de beboetbare feiten vastgesteld.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel48
  - number: '48.5'
    text: |-
      Geen bestuurlijke boete wordt opgelegd inzake overtredingen als bedoeld in de
      [artikelen 25, vierde lid en vijfde lid][ref1], [28, zevende lid][ref2], [31, vierde lid][ref3], en
      [33, tweede lid][ref4], voor zover het betreft bij ministeriële regeling aangewezen categorieën vaarbewijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0023009#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0023009#Artikel31
      [ref4]: https://wetten.overheid.nl/BWBR0023009#Artikel33
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel48
    references:
