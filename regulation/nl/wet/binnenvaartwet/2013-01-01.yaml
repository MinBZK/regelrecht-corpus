      - id: ref2
        bwb_id: BWBR0023009
        artikel: '48'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '49.3'
    text: Strafbare feiten als bedoeld in het eerste en tweede lid zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel49
  - number: '50'
    text: Indien een bestuurlijke boete wordt opgelegd kan Onze Minister de geldsom invorderen bij dwangbevel.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel50
  - number: '51.1'
    text: 'Degene die ingevolge deze wet een aanvraag doet in verband met:'
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel51
  - number: 51.1.a
    text: het verlenen, wijzigen of intrekken van een ontheffing ingevolge deze wet; of
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel51
  - number: 51.1.b
    text: het afgeven, wijzigen of intrekken van ingevolge deze wet vereiste documenten;
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel51
  - number: '51.2'
    text: 'Bij ministeriële regeling:'
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel51
  - number: 51.2.a
    text: worden de vergoedingen, bedoeld in het eerste lid, vastgesteld;
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel51
  - number: 51.2.b
    text: |-
      kan worden bepaald dat, voor zover anderen dan Onze Minister de in het eerste lid bedoelde werkzaamheden
      verrichten, zij zelf daarvoor de vergoedingen alsmede de wijze van betaling van deze vergoedingen vaststellen met
      inachtneming van de bij ministeriële regeling gegeven regels;
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel51
  - number: 51.2.c
    text: wordt bepaald aan wie de vergoedingen, bedoeld in het eerste lid, verschuldigd zijn.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel51
  - number: '52.1'
    text: |-
      Onverminderd de [artikelen 7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2] kan, ingeval buitengewone omstandigheden
      dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-President, [artikel 53][ref3] in
      werking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0023009#Artikel53
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0023009
        artikel: '53'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '52.2'
    text: |-
      Wanneer het in het eerste lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepaling.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel52
  - number: '52.3'
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan wordt bij koninklijk besluit, op voordracht van
      Onze Minister-President, de bepaling die ingevolge het eerste lid in werking is gesteld, onverwijld buiten werking
      gesteld.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel52
  - number: '52.4'
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, wordt de bepaling die ingevolge het eerste lid
      in werking is gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel52
  - number: '52.5'
    text: |-
      Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel52
  - number: '52.6'
    text: Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het Staatsblad.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel52
  - number: '54'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel54
  - number: '55'
    text: 'Deze wet wordt aangehaald als: Binnenvaartwet.'
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel55
