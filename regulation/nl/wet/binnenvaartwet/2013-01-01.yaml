  - number: '49.2'
    text: |-
      Handelen in strijd met [artikel 17, vijfde lid][ref1], alsmede met de bepalingen, bedoeld in
      [artikel 48, vijfde lid][ref2], voor zover het betreft bij ministeriële regeling aangewezen categorieën
      vaarbewijzen, is een strafbaar feit.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0023009#Artikel48
    url: https://wetten.overheid.nl/BWBR0023009/2013-01-01#Artikel49
    references:
