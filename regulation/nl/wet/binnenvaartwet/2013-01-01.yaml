  - number: '49.1'
    text: |-
      Wanneer door het handelen in strijd met de [artikelen 5, eerste lid][ref1], [6, eerste lid en zesde lid][ref2],
      [7, eerste lid][ref3], [8, derde lid][ref4], [10, tweede lid][ref5], [11][ref6], [12][ref7],
