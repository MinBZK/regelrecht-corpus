  - number: 1.c
    text: |-
      de met de onder a en b genoemde wateren in open verbinding staande havens onder nautisch beheer van het Rijk en
      zijwateren onder waterstaatkundig beheer van het Rijk.
    url: https://wetten.overheid.nl/BWBR0023205/2009-12-22#Artikel1
  - number: '2'
    text: |-
      Voor de toepassing van [artikel 2, eerste lid, onderdeel b, van het Besluit ontgrondingen in rijkswateren][ref1]
      gelden de volgende maximale hoeveelheden vaste stoffen en maximaal aantal reizen:


      [ref1]: https://wetten.overheid.nl/BWBR0023362#Artikel2
    url: https://wetten.overheid.nl/BWBR0023205/2009-12-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0023362
        artikel: '2'
  - number: 2.a
    text: 'Noordzee: 40.000 m3 per ontgronding in maximaal 10 reizen;'
    url: https://wetten.overheid.nl/BWBR0023205/2009-12-22#Artikel2
  - number: 2.b
    text: |-
      Eems, Dollard, IJsselmeer, Markermeer (met inbegrip van Oostvaardersdiep), Ketelmeer, Keteldiep, Haringvliet,
      Hollandsch Diep, Grevelingenmeer, Krammer, Volkerak, Zoommeer, Oosterschelde, en Westerschelde: 5000 m3 in maximaal
      5 reizen;
    url: https://wetten.overheid.nl/BWBR0023205/2009-12-22#Artikel2
  - number: 2.c
    text: 'overige rijkswateren: 2500 m3 per ontgronding in maximaal 5 reizen.'
    url: https://wetten.overheid.nl/BWBR0023205/2009-12-22#Artikel2
  - number: '3'
    text: |-
      Deze regeling treedt in werking op het tijdstip waarop het [Besluit ontgrondingen in rijkswateren][ref1] in werking
      treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0023362
    url: https://wetten.overheid.nl/BWBR0023205/2009-12-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0023362
  - number: '4'
    text: 'Deze regeling wordt aangehaald als: Regeling ontgrondingen in rijkswateren.'
    url: https://wetten.overheid.nl/BWBR0023205/2009-12-22#Artikel4
