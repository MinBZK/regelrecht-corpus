preamble:
  text: |-
    Gelet op artikel 8, eerste lid, van de Ontgrondingenwet en artikel 2, eerste lid, onderdeel b, van het Besluit
    ontgrondingen in rijkswateren;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0023205/2009-12-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Als rijkswateren als bedoeld in [artikel 8, eerste lid, van de Ontgrondingenwet][ref1] worden aangewezen:

      a. de wateren, genoemd in [bijlage II, onderdeel 1, bij het Waterbesluit][ref2], waarbij tot de Noordzee wordt
      gerekend de territoriale wateren en de Nederlandse exclusieve economische zone van de Noordzee;

      b. de volgende wateren:

      1°. gekanaliseerde Dieze

      2°. Kanaal Henriëttewaard-Engelen

      3°. Kanaal Sluis-Brugge

      4°. Kanaal Wessem-Nederweert

      5°. Markkanaal

      6°. Noordervaart

      7°. Oostelijke Rijkswaterleiding

      8°. Oude Maasje

      9°. Schelde-Rijnkanaal

      10°. Veerse Meer

      11°. Voedingskanaal (Limburg)

      12°. Wantij

      13°. Westelijke Rijkswaterleiding

      14°. Wilhelminakanaal

      15°. Zuiderkanaal

      16°. Zuid-Willemsvaart

      c. de met de onder a en b genoemde wateren in open verbinding staande havens onder nautisch beheer van het Rijk en
      zijwateren onder waterstaatkundig beheer van het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0002505#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0026872
    url: https://wetten.overheid.nl/BWBR0023205/2009-12-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002505
        artikel: '8'
      - id: ref2
