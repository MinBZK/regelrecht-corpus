preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is in verband met de inwerkingtreding van de Algemene
    douanewet, de Statistiekwet 1950, de In- en uitvoerwet en de Douanewet in te trekken alsmede de Algemene wet inzake
    rijksbelastingen en andere wetten aan te passen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0023754/2012-01-01#ArtikelAanhef
articles:
  - number: XLVI
    text: 'De navolgende wetten worden ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0023754/2012-01-01#ArtikelXLVI
  - number: XLVI.a
    text: |-
      de [Statistiekwet 1950][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0002064
    url: https://wetten.overheid.nl/BWBR0023754/2012-01-01#ArtikelXLVI
    references:
      - id: ref1
        bwb_id: BWBR0002064
  - number: XLVI.b
    text: |-
      de [In- en uitvoerwet][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0002376
    url: https://wetten.overheid.nl/BWBR0023754/2012-01-01#ArtikelXLVI
    references:
      - id: ref1
        bwb_id: BWBR0002376
  - number: XLVI.c
    text: |-
      de [Douanewet][ref1].

      [ref1]: https://wetten.overheid.nl/BWBR0007632
    url: https://wetten.overheid.nl/BWBR0023754/2012-01-01#ArtikelXLVI
    references:
      - id: ref1
        bwb_id: BWBR0007632
  - number: XLVII
    text: |-
      De bij [artikel XLVI][ref1] van deze wet ingetrokken wetten, de bij deze wet gewijzigde wetten alsmede de daarop
      berustende bepalingen blijven – met inbegrip van bepalingen van overgangsrecht – van toepassing zoals zij golden
      voor de inwerkingtreding van deze wet voor zover zij betrekking hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0023754#ArtikelXLVI
    url: https://wetten.overheid.nl/BWBR0023754/2012-01-01#ArtikelXLVII
    references:
      - id: ref1
        bwb_id: BWBR0023754
        artikel: XLVI
  - number: XLVII.a
    text: |-
      de heffing van belastingen, invoerrechten, rechten bij invoer en rechten bij uitvoer waarvan de feiten die
      aanleiding geven tot het ontstaan van de verschuldigdheid van die belastingen, invoerrechten, rechten bij invoer
      dan wel rechten bij uitvoer zich hebben voorgedaan vóór de dag van de inwerkingtreding van deze wet;
    url: https://wetten.overheid.nl/BWBR0023754/2012-01-01#ArtikelXLVII
  - number: XLVII.b
    text: |-
      strafbare feiten en feiten die aanleiding kunnen zijn tot het opleggen van een bestuurlijke boete welke zich hebben
      voorgedaan vóór de dag van de inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0023754/2012-01-01#ArtikelXLVII
  - number: XLVIII.1
    text: |-
      Beschikkingen die zijn genomen op grond van bepalingen bij of krachtens de [Douanewet][ref1] worden tot
      wederopzegging, doch uiterlijk tot en met de laatste dag van het tijdvak van twaalf maanden dat ingaat op de dag
      van de inwerkingtreding van deze wet, aangemerkt als te zijn genomen op grond van de bepalingen bij of krachtens
      de [Algemene douanewet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007632
      [ref2]: https://wetten.overheid.nl/BWBR0023746
    url: https://wetten.overheid.nl/BWBR0023754/2012-01-01#ArtikelXLVIII
    references:
      - id: ref1
        bwb_id: BWBR0007632
      - id: ref2
        bwb_id: BWBR0023746
  - number: XLVIII.2
    text: |-
      Bij ministeriële regeling kunnen nadere overgangsbepalingen worden vastgesteld in verband met de inwerkingtreding
      van de [Algemene douanewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023746
    url: https://wetten.overheid.nl/BWBR0023754/2012-01-01#ArtikelXLVIII
    references:
      - id: ref1
        bwb_id: BWBR0023746
  - number: L
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0023754/2012-01-01#ArtikelL
  - number: LI
    text: 'Deze wet wordt aangehaald als: Aanpassingswet Algemene douanewet.'
    url: https://wetten.overheid.nl/BWBR0023754/2012-01-01#ArtikelLI
