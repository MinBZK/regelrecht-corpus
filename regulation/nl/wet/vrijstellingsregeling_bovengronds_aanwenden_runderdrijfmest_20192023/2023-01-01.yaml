articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *bedrijf:* bedrijf als bedoeld in [artikel 1, eerste lid, onderdeel i, van de Meststoffenwet][ref1];
        - *runderdrijfmest:* drijfmest als bedoeld in
      [artikel 1, eerste lid, onderdeel j, van het Besluit gebruik meststoffen][ref2], en afkomstig
      van runderen uit de diercategorieën met de diernummers 100, 101, 102, 104 of 120, als bedoeld in
      [bijlage D van de Uitvoeringsregeling Meststoffenwet][ref3];
        - *vaste rundermest:* vaste mest als bedoeld in
      [artikel 1, eerste lid, onderdeel i, van het Besluit gebruik meststoffen][ref4], en afkomstig
      van runderen uit de diercategorieën met de diernummers 100, 101, 102, 104 of 120, als bedoeld in
      [bijlage D van de Uitvoeringsregeling Meststoffenwet][ref5];
        - *tot het bedrijf behorende oppervlakte landbouwgrond:* tot het bedrijf behorende oppervlakte landbouwgrond als
      bedoeld in [artikel 1, eerste lid, onderdeel m, van de Meststoffenwet][ref6].


