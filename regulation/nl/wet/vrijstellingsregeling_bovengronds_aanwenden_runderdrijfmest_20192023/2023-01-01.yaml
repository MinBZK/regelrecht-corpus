  - number: '2'
    text: |-
      1 Vrijstelling van het verbod, bedoeld in [artikel 5, eerste lid, van het Besluit gebruik meststoffen][ref1], wordt
      verleend voor zover het gaat om de aanwending van runderdrijfmest, waarbij de runderdrijfmest:

      a. geproduceerd is op het eigen bedrijf;

      b. op grasland van de tot het bedrijf behorende oppervlakte landbouwgrond wordt aangewend;

      c. niet wordt aangewend binnen een afstand van ten minste twee meter vanaf de insteek van een watergang.

      2 De vrijstelling geldt niet voor de tot het bedrijf behorende oppervlakte landbouwgrond van een landbouwer die
      beschikt over een vergunning als bedoeld in [artikel 25a van de Uitvoeringsregeling Meststoffenwet][ref2] of
      daarvoor een aanvraag heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009066#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0018989#Artikel25a
