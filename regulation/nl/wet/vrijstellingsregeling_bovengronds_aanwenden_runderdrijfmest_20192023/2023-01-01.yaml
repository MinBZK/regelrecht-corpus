  - number: '3'
    text: |-
      1 Aan de vrijstelling, bedoeld in [artikel 2][ref1], zijn de volgende voorwaarden verbonden:

      a. in het jaar voorafgaand aan en in het jaar dat gebruik wordt gemaakt van de vrijstelling:

      1°. bestaat minimaal 85 procent van de tot het bedrijf behorende oppervlakte landbouwgrond uit grasland;

      2°. bedraagt de kunstmestgift op het bedrijf minder dan 100 kilogram stikstof per hectare grasland;

      3°. is het stikstofoverschot op het bedrijf maximaal 100 kilogram stikstof per hectare, berekend volgens het
      principe van een stikstofbalans op bedrijfsniveau;

      4°. worden de runderen met het diernummer 100, bedoeld in
      [bijlage D, tabel IA of tabel IB, van de Uitvoeringsregeling Meststoffenwet][ref2], vanaf twee weken na de
      afkalfdatum in de periode van 15 maart tot en met 30 november geweid gedurende minimaal 6 uur per dag en minimaal
      150 dagen per jaar;

      5° worden de niet-melkgevende runderen met het diernummer 100, bedoeld in
      [bijlage D, tabel IA of tabel IB, van de Uitvoeringsregeling Meststoffenwet][ref3], in de periode van 1 mei tot
      en met 30 september in afwijking van onderdeel 4° dag en nacht geweid tot minimaal drie weken voor de verwachte
      afkalfdatum;

      6° worden de runderen met de diernummers 102 en 120, bedoeld in
      [bijlage D, tabel IA of tabel IB, van de Uitvoeringsregeling Meststoffenwet][ref4], in de periode van 15 maart tot
      en met 30 november dag en nacht geweid gedurende minimaal 150 dagen per jaar;

      7°. worden de runderen met het diernummer 101, bedoeld in
      [bijlage D, tabel IA of tabel IB, van de Uitvoeringsregeling Meststoffenwet][ref5], en met een leeftijd van zes
      maanden of ouder, in de periode van 1 juni tot en met 31 augustus dag en nacht geweid;

      8°. in afwijking van het onder 4°, 5°, 6° en 7° bepaalde hoeven runderen op de dagen dat zij ziek zijn niet geweid
      te worden;

      b. indien in 2019 gebruikt wordt gemaakt van de vrijstelling geldt, in afwijking
      van onderdeel a, dat in 2018 is voldaan aan de voorwaarden zoals vermeld in
      __REF000___________________________________________________________________________________________________________
      _______;

      c. op het bedrijf mag, ten behoeve van bemesting van tot het bedrijf behorende oppervlakte bouwland, geen andere
      dierlijke mest worden aangevoerd dan runderdrijfmest of vaste rundermest;

      d. uiterlijk op 1 februari van elk jaar dat de landbouwer van de vrijstelling gebruik maakt, meldt hij het bedrijf
      voor de toepassing van [artikel 2][ref7] aan bij de minister waarmee de landbouwer verklaart te voldoen aan artikel
      2 en aan de voorwaarden, bedoeld in de onderdelen a en b, en het tweede lid; indien in 2019 gebruik wordt gemaakt
      van de vrijstelling dient deze aanmelding te worden gedaan voorafgaand aan de eerste keer dat de landbouwer gebruik
      wil maken van de vrijstelling, doch uiterlijk op 1 maart 2019;

      e. de landbouwer houdt een weidegangkalender bij waarop per dag wordt bijgehouden hoeveel runderen per diernummer
      geweid worden en gedurende hoeveel uren; de weidegangkalender loopt niet meer dan 1 week achter;

      f. de landbouwer houdt gegevens bij waarmee kan worden aangetoond dat aan de voorwaarden, bedoeld in de onderdelen
      a tot en met e, en het tweede lid, wordt voldaan, stelt daarvan tenminste jaarlijks een rapport op en bewaart deze
      gegevens, het jaarlijks rapport en een afschrift van de aanmelding als onderdeel van de administratie, bedoeld in
      [artikel 32, eerste lid, van het Uitvoeringsbesluit Meststoffenwet][ref8]; de landbouwer toont deze gegevens op
      verzoek aan de toezichthouder bij een controle.

      2 De vrijstelling voor een bedrijf waar in ieder geval runderen met diernummer 100, bedoeld in
      [bijlage D, tabel IA of tabel IB, van de Uitvoeringsregeling Meststoffenwet][ref9] worden gehouden, wordt verleend
      onder de voorwaarde dat in het jaar voorafgaand aan en in het jaar dat gebruik wordt gemaakt van de vrijstelling:

      a. de melkproductie van het bedrijf niet hoger dan 14.000 kilogram per hectare is, indien de op het bedrijf
      geproduceerde mest niet volledig kan worden geplaatst op het eigen bedrijf;

      b. het gemiddeld gewogen ureumgetal van de op het bedrijf tijdens de perioden van 1 januari tot en met 31 maart en
      van 1 december tot en met 31 december geproduceerde melk lager is dan 21 milligram per 100 gram melk.


