  url: https://wetten.overheid.nl/BWBR0025218/2021-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder *minister*: Minister van Justitie en Veiligheid.'
    url: https://wetten.overheid.nl/BWBR0025218/2021-07-01#Artikel1
  - number: 1a
    text: Het Staatsblad wordt uitgegeven op https://www.officielebekendmakingen.nl.
    url: https://wetten.overheid.nl/BWBR0025218/2021-07-01#Artikel1a
  - number: '2'
    text: |-
      1 De minister draagt er zorg voor dat de betrouwbaarheid en de beveiliging van de elektronische uitgifte en
      beschikbaarstelling van het Staatsblad voldoen aan de volgende eisen:

      a. De publicaties worden uitgegeven en beschikbaar gehouden in het bestandsformaat PDF/A, conformiteitsniveau a.

      b. Het systeem voor gegevensverwerking waarmee de publicaties worden uitgegeven en beschikbaar gehouden, voldoet
      aan hoge continuïteitseisen.

      c. Het systeem voor gegevensverwerking waarmee de publicaties worden uitgegeven en beschikbaar gehouden, is volgens
      algemeen aanvaarde nationale en internationale standaarden voor informatiebeveiliging ingericht.

      d. Alle mutaties in het systeem voor gegevensverwerking waarmee de publicaties worden uitgegeven en beschikbaar
      gehouden, worden geregistreerd en deze registratie wordt buiten dit systeem opgeslagen.

      e. Van elke publicatie wordt een elektronische kopie gemaakt, die wordt opgeslagen buiten het systeem voor
      gegevensverwerking waarmee de publicaties worden uitgegeven en beschikbaar gehouden.

      2 In afwijking van het eerste lid, onderdeel a, kunnen onderdelen van publicaties worden uitgegeven en beschikbaar
      gehouden in het bestandsformaat GML-XML voor zover het geometrische of geografische informatie betreft, waaronder
      begrepen de geometrische begrenzing van gebieden.
    url: https://wetten.overheid.nl/BWBR0025218/2021-07-01#Artikel2
  - number: 2a
    text: |-
      Met betrekking tot de plaatsing in het Staatsblad van wetten, algemene maatregelen van bestuur en andere
      koninklijke besluiten waarbij algemeen verbindende voorschriften worden vastgesteld, worden de regels of
      technische standaarden, bedoeld in [artikel 2.3, eerste onderscheidenlijk tweede lid, van de Regeling elektronische
      publicaties](onbekend) toegepast die met betrekking tot de plaatsing in de Staatscourant van anders dan bij wet,
      algemene maatregel van bestuur of ander koninklijk besluit vastgestelde algemeen verbindende voorschriften zijn
      gesteld onderscheidenlijk zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0025218/2021-07-01#Artikel2a
  - number: '3'
    text: |-
      Vervangende uitgifte van het Staatsblad als bedoeld in [artikel 17, eerste lid, van de Bekendmakingswet][ref1],
      geschiedt:

      a. door middel van publicatie op een door de minister aan te wijzen vervangend internetadres,

      b. door middel van een papieren uitgave, te verstrekken door een nooddistributiepunt dat wordt ingericht door het
      in [artikel 4][ref2] genoemde uitgiftepunt, of

      c. op een andere door de minister te bepalen wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0025218#Artikel4
    url: https://wetten.overheid.nl/BWBR0025218/2021-07-01#Artikel3
