preamble:
  text: |-
    Gelet op de artikelen 9 en 10, tweede lid, van de Bekendmakingswet en de artikelen 2, eerste lid, 4, tweede lid, 8,
    eerste lid, en 10, tweede lid, van het Bekendmakingsbesluit;

