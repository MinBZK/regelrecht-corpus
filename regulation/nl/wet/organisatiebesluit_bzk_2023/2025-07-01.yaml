      Overeenkomstig [artikel 1 van het Besluit regeling functie en verantwoordelijkheid van de secretaris-generaal][ref1]
      (Stb. 1988, 499), is de secretaris-generaal belast met de ambtelijke leiding van al hetgeen het Ministerie betreft.
      Tot deze taak behoort in ieder geval:

      a. het informeren en adviseren van de bewindspersonen over aangelegenheden, de bewindspersonen of het Ministerie
      betreffende;

      b. het zorgdragen voor de coördinatie en integratie van beleidsvoorbereiding, beleidsontwikkeling en
      beleidsuitvoering binnen het Ministerie;

      c. het uitoefenen van de algemene controlfunctie bij het Ministerie;

      d. het rechtstreeks leiding geven aan de plaatsvervangend secretaris-generaal, de directeuren-generaal en de
      directeur FEZ;

      e. het voorzitterschap van de Bestuursraad;

      f. het zorgdragen voor het nemen van besluiten over en het geven van algemene aanwijzingen ten aanzien van de
      formatie van het Ministerie;

      g. het voeren van overleg met de Departementale Ondernemingsraad en de Ondernemingsraad BZK Kerndepartement, als
      bestuurder in de zin van de [Wet op de Ondernemingsraden][ref2], en met de vakbonden zoals bedoeld in paragraaf
      26.2 CAO Rijk 2022;

      h. het geven van uitvoering aan de [Regeling audit committees van het Rijk][ref3];

      i. het verlenen of weigeren van goedkeuring van besluiten tot uitzonderingen op de aanbestedingsregelgeving;

      j. het eigenaarschap van het agentschap Rijksvastgoedbedrijf.


