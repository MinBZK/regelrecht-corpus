  - number: '9'
    text: |-
      1 Het directoraat-generaal Ruimtelijke Ordening staat onder leiding van een directeur-generaal.

      2 Het directoraat-generaal richt zich op het algemeen beleid ruimtelijke ordening en de regie op de uitvoering van
      de inrichting van de leefomgeving in Nederland, en heeft onder meer de volgende taken:

      a. het algemeen beleid, de programmatische aanpak en de borging van de ruimtelijke ordening in Nederland;

      b. de regie op de ontwikkeling van de fysieke leefomgeving en inrichting van de ruimte en de politieke,
      interdepartementale en interbestuurlijke besluitvorming bij tegengestelde belangen;

      c. de interbestuurlijke en interdepartementale programmering en coördinatie van (de inwerkingtreding,
      implementatie en doorontwikkeling van) de Nationale omgevingsvisie, de [Omgevingswet][ref1] en GEO-informatie als
      stelselverantwoordelijk Ministerie, en de doorontwikkeling van de stelselverantwoordelijkheid;

      d. de beleidsvorming op hoe de nationale regie op de ruimtelijke inrichting vorm krijgt, voorbereiding van
      politieke besluitvoering en voorbereiding van wetgeving vanuit ruimtelijk perspectief;

      e. de nationale regie op de gebieden en/of regio’s die aandacht behoeven en/of waar sprake is van conflicterende
      belangen en inzet richting de uitvoering;

      f. het grondbeleid en de inzet van het grondinstrumentarium ten behoeve van de realisatie;

      g. het inzicht van juridisch instrumentarium.

      3 Het directoraat-generaal bestaat uit de volgende organisatieonderdelen:

      a. de directie Ruimtelijk Beleid;

      b. de directie Ruimtelijke Ontwikkeling;

      c. de programmadirectie Aan de Slag.


