  - number: '30'
    text: |-
      1 De Minister stelt de inrichting van de organisatie vast conform het bepaalde in
      [artikel 3, tweede lid, van het Coördinatiebesluit organisatie en bedrijfsvoering rijksdienst 2011][ref1].

      2 De secretaris-generaal is bevoegd tot het nader vaststellen van de inrichting van de onder de directoraten-
      generaal, de clusters M&M en BO, Logius en RvIG ressorterende organisatieonderdelen, na advisering door de
      directeur P&O.

      3 De secretaris-generaal is bevoegd tot het nader vaststellen van de inrichting van de Algemene Inlichtingen- en
      Veiligheidsdienst op voordracht van de directeur-generaal van de Algemene Inlichtingen- en Veiligheidsdienst en na
      advisering van de directeur P&O.

      4 De secretaris-generaal en de directeuren-generaal van Algemene Bestuursdienst, Vastgoed en Bedrijfsvoering Rijk
      en van de Algemene Inlichtingen- en Veiligheidsdienst stellen met inachtneming van dit besluit ten behoeve van hun
      dienst- of organisatieonderdelen periodiek een capaciteitsplan vast.


      [ref1]: https://wetten.overheid.nl/BWBR0029514#Artikel3
    url: https://wetten.overheid.nl/BWBR0047860/2025-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0029514
        artikel: '3'
  - number: '31'
    text: |-
      1 Tot de taak van de directoraten-generaal, de clusters M&M en BO, RvIG en Logius behoort voorts de uitvoering
      van andere taken dan hiervoor genoemd, in opdracht van de bewindspersonen, de secretaris-generaal of de
      plaatsvervangend secretaris-generaal, voor zover hogere wet- en regelgeving zich daartegen niet verzet.

      2 Tot de taak van de in dit besluit genoemde organisatieonderdelen, ressorterend onder de dienstonderdelen genoemd
      in het eerste lid, behoort voorts de uitvoering van andere taken dan vermeld, in opdracht van de bewindspersonen,
      de secretaris-generaal, de plaatsvervangend secretaris-generaal of het diensthoofd, voor zover hogere wet- en
      regelgeving zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0047860/2025-07-01#Artikel31
  - number: '32'
    text: |-
      1 De directeur P&O is belast met het beheer van dit besluit.

      2 De secretaris-generaal, de plaatsvervangend secretaris-generaal, de directeuren-generaal en de algemeen
      directeuren Logius en RvIG, ieder voor zover het hen aangaat, zijn verantwoordelijk voor een juiste, volledige en
      tijdige aanlevering aan de directeur P&O van de gegevens die een goed beheer van dit besluit mogelijk maken.

      3 Het beheer en de aanlevering van gegevens geschieden met inachtneming van de desbetreffende (richtlijnen inzake)
      administratieve organisatiebeschrijvingen.
    url: https://wetten.overheid.nl/BWBR0047860/2025-07-01#Artikel32
  - number: '33'
    text: Wijziging van dit besluit is voorbehouden aan de Minister en geschiedt op voordracht van de directeur P&O.
    url: https://wetten.overheid.nl/BWBR0047860/2025-07-01#Artikel33
  - number: '34'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na datum van uitgifte van de Staatscourant
      waarin het wordt geplaatst en werkt terug tot en met 23 maart 2022, met uitzondering van
      [artikel 8 tweede lid onderdeel h en derde lid onderdeel d][ref1], die werken terug tot en met 22 april 2022,
      [artikel 14 derde lid][ref2], dat werkt terug tot en met 2 mei 2022 en [artikel 11 derde lid onderdeel g][ref3] dat
      werkt terug tot en met 19 mei 2022.


