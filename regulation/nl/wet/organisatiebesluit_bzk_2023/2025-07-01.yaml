      1 De regeringscommissaris Omgevingswet staat beheersmatig onder leiding van de secretaris-generaal.

      2 De regeringscommissaris Omgevingswet heeft de volgende taken:

      a. het gevraagd en ongevraagd adviseren van de Minister en de Ministers die het mede aangaat over en het doen van
      voorstellen voor de kwaliteit, eenheid of doorontwikkeling van het wettelijk stelsel van de Omgevingswet;

      b. het signaleren en agenderen van belangrijke ontwikkelingen rondom het wettelijk stelsel van de Omgevingswet; en

      c. het bij de uitvoering van de taken onder a en b: zorgen voor verbinding met de uitvoeringspraktijk, bestuur,
      wetenschap en rechtelijke macht.

      3 De regeringscommissaris Omgevingswet wordt voor de werkzaamheden ondersteund door de directie Constitutionele
      Zaken en Wetgeving en heeft een budget voor de toebedeelde taken. De middelen hiervoor worden verstrekt door het
      Ministerie.
