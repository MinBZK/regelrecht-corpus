    text: |-
      1 De directie Financieel-economische Zaken staat onder leiding van een directeur.

      2 De directie heeft onder meer de volgende taken:

      a. de dienstverlening en vakinhoudelijke advisering ten behoeve van het beleid van de financieel-economische
      processen, het (doen) vertalen van centrale kaders en richtlijnen in specifieke voorschriften en procedures;

      b. het beoordelen van beleidsvoorstellen op samenhang tussen inhoudelijke doelstellingen en middeleninzet,
      inclusief de advisering aan de bewindspersonen, de secretaris-generaal, de plaatsvervangend secretaris-generaal en
      de bestuursraad;

      c. het Ministerie breed toetsen van de producten in het kader van de begroting, beleid en beheer en het adviseren
      van de politieke en ambtelijke top hierover;

      d. het voeren van overleg namens het departement met het Ministerie van Financiën over alle begrotings- en
      verantwoordingsaangelegenheden;

      e. het zorgdragen voor een adequaat financieel-economisch beheer voor het Ministerie;

      f. het borgen van de kwaliteit van de bedrijfsvoering en de daaraan verbonden (financieel administratieve)
      processen binnen het Ministerie;

      g. het adviseren van de bewindspersonen, de secretaris-generaal en de plaatsvervangend secretaris-generaal ten
      aanzien van bijzondere vraagstukken op concernniveau.

      h. het adviseren van de (gemandateerd) eigenaren van agentschappen, ZBO’s en diensten.

      3 De directeur Financieel-economische Zaken bekleedt de functie van coördinerend directeur Inkoop (CDI) en heeft
      vanuit die hoedanigheid onder meer de volgende taken:

      a. het stellen van kaders voor het inkoopbeleid van het Ministerie;

      b. de coördinatie van de inkoopfunctie en het contractbeheer van het Ministerie;

      c. de centrale ondersteuning en advisering bij inkoopvraagstukken;

      d. het adviseren van de (gemandateerd) eigenaren van rijksbrede inkoopcategorieën binnen het Ministerie.
    url: https://wetten.overheid.nl/BWBR0047860/2025-07-01#Artikel20
  - number: '21'
    text: |-
      1 De directie CIO&I staat onder leiding van een directeur. De directeur CIO&I vervult tevens de rol van CIO BZK.

      2 De directie draagt conform het taakbesluit CIO Rijksdienst onder meer zorg voor de advisering, kaderstelling,
      toezicht en handhaving op het terrein van de informatievoorziening en ICT binnen bedrijfsvoering en beleid
      in algemene zin, het gebruik van ICT-middelen, alsmede voor het bevorderen van informatiebewustzijn,
      informatiebeveiliging en (toezicht op) privacy. De directie CIO & I draagt hiertoe bij op de volgende wijze:

      a. het opstellen en coördineren van de departementale strategie en visie op de informatievoorziening en ICT voor
      bedrijfsvoering en beleid;

      b. het adviseren op en strategisch sparren over de sturing op het geheel aan programma’s en projecten, de
      samenhang en de risico’s ten aanzien van de IT-projectenportfolio en de sturing op Lifecyclemanagement, Beheer en
      Exploitatie, Architectuur en portfoliomanagement;

      c. het opstellen en coördineren van een samenhangende aanpak op privacy, gegevensbescherming en integrale- en
      informatiebeveiliging, waartoe de directie ook de Functionaris Gegevensbescherming van BZK huisvest;

      d. het stimuleren van de digitale vernieuwing binnen het Ministerie door de investeren in een cultuur van
      kennisdeling en het vertalen van technologische ontwikkelingen naar BZK-beleid en het vertalen van het BZK-beleid
      (grote per) naar de eigen organisatie;

      e. het ontwikkelen en coördineren van informatievoorzieningsbeleid en digitaliseringsbeleid en de ontwikkeling, met
      inachtneming van toepasselijke rijksbrede kaders en ICT-voorzieningen;

      f. het sturen op het gebruik, de toegankelijkheid en integriteit van data en informatie van en door het Ministerie
      met als doel een duurzame en toegankelijke informatiehuishouding te realiseren binnen het Ministerie;

      g. het uitvoeren van oordelen aangaande de beheersing, haalbaarheid, risico’s en implicaties van alle voorgenomen
      en in uitvoering zijnde activiteiten met een (grote) ICT-component, conform de daarvoor geldende rijksbrede
      kwaliteitsnormen en het adviseren van lijnmanagement en bewindspersonen hierover;

      h. de verantwoordelijk voor het CIO stelsel BZK, het uitvoeren van de bijbehorende PDCA cyclus, CIO gesprekken,
      eigenaar van het I-beraad en het aanmelden van activiteiten bij het Adviescollege ICT-toetsing, als bedoeld in
      [artikel 4, eerste lid, van het Instellingsbesluit Adviescollege ICT-toetsing][ref1].


