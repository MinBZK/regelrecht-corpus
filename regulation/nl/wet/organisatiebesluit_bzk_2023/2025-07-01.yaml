      1 Het directoraat-generaal Volkshuisvesting en Bouwen staat onder leiding van een directeur-generaal.

      2 Het directoraat-generaal richt zich op het domein van wonen en gebouwde omgeving, bouwen en de energietransitie
      van de gebouwde omgeving in Nederland, geeft uitvoering aan de regisserende en ondersteunende rol van de Minister
      voor Volkshuisvesting en Ruimtelijke Ordening en heeft onder meer de volgende taken:

      a. het beleid en de regelgeving voor de huurwoningmarkt, woningcorporaties en koopwoningmarkt, gericht op
      betaalbaarheid, kwaliteit en leefbaarheid van woningen;

      b. de realisatie van de kwantitatieve en kwalitatieve bouwopgave – op korte, middellande en lange termijn – en het
      in balans brengen van vraag en aanbod op de woningmarkt;

      c. de ontwikkeling van de kaders en de regelingen ter stimulering van de energietransitie in de gebouwde omgeving
      en de realisatie van aardgasvrije wijken en klimaat neutrale gebouwen;

      d. de focus op wonen en gebouwde omgeving, financiële aspecten en het realiseren van energietransitie-doelen;

      e. het ontwikkelen en realiseren van een hernieuwde Nationale Woon- en Bouwagenda en de maatregelen om vraag en
      aanbod op de woningmarkt in balans te brengen;

      f. de samenwerking met andere overheden en partners ter realisatie van de gestelde ambitie op het gebied van de
      woningbouw;

      g. het verlenen van ondersteuning in kennis en handelingsperspectief aan gemeenten, het bevorderen van kennisdeling
      tussen gemeenten ten behoeve van de lokale warmtetransitie en het versnellen daarvan, en het periodiek monitoren
      van de voortgang;

      h. het opdrachtgeverschap voor het zelfstandige bestuursorgaan de Toelatingsorganisatie Kwaliteitsborging Bouw;

      i. het opdrachtgeverschap voor het zelfstandige bestuursorgaan de Huurcommissie.

      3 Het directoraat-generaal bestaat uit de volgende organisatieonderdelen:

      a. de directie Bouwen en Energie;

      b. de directie Woningbouw;

      c. de directie Wonen;

      d. de programmadirectie Nationaal Programma Lokale Warmtetransitie (NPLW).
