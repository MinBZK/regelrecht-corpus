      1 Het directoraat-generaal Vastgoed en Bedrijfsvoering Rijk staat onder leiding van een directeur-generaal.

      2 Onder de directeur-generaal ressorteert een plaatsvervangend directeur-generaal. De plaatsvervangend directeur-
      generaal heeft de personele verantwoordelijkheid van de directeuren van de organisatieonderdelen genoemd in het
      vierde lid, onder b tot en met h en treedt tevens op als gemandateerd eigenaar. De plaatsvervangend directeur-
      generaal is plaatsvervangend directeur-generaal op Rijksbrede bedrijfsvoering. De plaatsvervangend directeur-
      generaal is geen plaatsvervangend directeur-generaal voor het Rijksvastgoedbedrijf.

      3 Het directoraat-generaal Vastgoed en Bedrijfsvoering Rijk heeft onder meer de volgende taken:

      a. de taken, bedoeld in het [Besluit taak RVB 2017][ref1];

      b. het op kwalitatief goede en efficiënte wijze uitvoeren van bedrijfsvoeringstaken voor de Rijksoverheid;

      c. het bevorderen, realiseren en (doen) in stand houden van onderlinge samenhang, integratie en synergie in de
      dienstverlening vanuit het directoraat-generaal;

      d. het optreden als gemandateerd eigenaar voor de organisatieonderdelen, genoemd in het vierde lid, onder b tot en
      met i.

      4 Het directoraat-generaal Vastgoed en Bedrijfsvoering Rijk bestaat uit de volgende organisatieonderdelen:

      a. het agentschap Rijksvastgoedbedrijf;

      b. het agentschap Organisatie en Personeel Rijk;

      c. het agentschap Rijksorganisatie voor Ontwikkeling, Digitalisering en Innovatie;

      d. het agentschap Rijksorganisatie Beveiliging en Logistiek;

      e. het agentschap FMHaaglanden;

      f. het agentschap SSC-ICT;

      g. de kasdienst Rijksinkoopsamenwerking;

      h. de kasdienst Organisatie voor Bedrijfsvoering en Financiën

      i. de kasdienst Doc-Direkt;

      5 Het Rijksvastgoedbedrijf bestaat uit de volgende organisatieonderdelen:

      a. de directie Portefeuillestrategie & Portefeuillemanagement;

      b. de directie Transacties & Projecten;

      c. de directie Vastgoedbeheer;

      d. de directie Financiën en Bestuursadvisering;

      e. de directie Gebieds- en Vastgoedontwikkeling;

      f. het bureau directeur-generaal;

      g. het Atelier Rijksbouwmeester.

      6 Het Rijksvastgoedbedrijf staat onder leiding van een directeur-generaal die tevens directeur-generaal is van het
      directoraat-generaal Vastgoed en Bedrijfsvoering Rijk.

      7 Voor aangelegenheden die behoren tot het werkterrein van het Rijksvastgoedbedrijf treedt de directeur-
      generaal op en doet stukken af en ondertekent deze als directeur-generaal Rijksvastgoedbedrijf en voor de overige
      aangelegenheden als directeur-generaal Vastgoed en Bedrijfsvoering Rijk.


