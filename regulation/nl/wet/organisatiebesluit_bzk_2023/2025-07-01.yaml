  - number: '27'
    text: |-
      1 Logius staat onder leiding van een algemeen directeur.

      2 Logius heeft onder meer de volgende taken:

      a. het beheren en exploiteren van overheidsbrede samenhangende ICT voorzieningen op het gebied van toegang,
      gegevensuitwisseling, informatiebeveiliging, standaardisatie, overheidspublicaties en overheidsinformatie ten
      behoeve van digitale dienstverlening van de overheid en publieke instellingen aan burgers en bedrijven;

      b. het bevorderen van het gebruik van deze generieke voorzieningen;

      c. het beheren van stelsels van de generieke digitale infrastructuur;

      d. het voeren van het secretariaat voor het Forum voor Standaardisatie.
    url: https://wetten.overheid.nl/BWBR0047860/2025-07-01#Artikel27
  - number: '28'
    text: |-
      1 De Rijksdienst voor Identiteitsgegevens staat onder leiding van een algemeen directeur.

      2 De Rijksdienst voor Identiteitsgegevens heeft onder meer de volgende taken:

      a. het beheer van de basisregistratie personen, de persoonsinformatievoorziening in de Caribische delen van het
      Koninkrijk, het burgerservicenummer en de Nederlandse reisdocumenten;

      b. de wijze waarop de persoonsgegevens van burgers worden vastgelegd, beheerd en verstrekt voor de publieke
      dienstverlening;

      c. het bijdragen aan onderzoek en ontwikkeling, innovatie en regie in het identiteitsdomein.
    url: https://wetten.overheid.nl/BWBR0047860/2025-07-01#Artikel28
  - number: '29'
    text: |-
      1 De dienst Toelatingsorganisatie Kwaliteitsborging Bouw staat onder leiding van het bestuur van de
      Toelatingsorganisatie Kwaliteitsborging Bouw.

      2 De dienst Toelatingsorganisatie Kwaliteitsborging Bouw heeft de taken bedoeld in [Artikel 7ak Woningwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel7ak
