      1 Het directoraat-generaal Openbaar Bestuur en Democratische Rechtsstaat staat onder leiding van een directeur-
      generaal.

      2 Het directoraat-generaal draagt zorg voor het beschermen en vernieuwen van democratische instituties en het
      versterken van de rechtsstatelijkheid van overheidshandelen door het uitvoeren van onder andere de volgende taken:

      a. de inrichting en de bekostiging van het openbaar bestuur, de interbestuurlijke en financiële verhoudingen en het
      vernieuwen van de financieringssystematiek;

      b. de borging van de democratische rechtsstaat;

      c. de borging van de rechtstatelijke instituties, waaronder het parlement, de Raad van State, de Algemene
      Rekenkamer en de Nationale ombudsman;

      d. de borging van fundamentele grondrechten en vrijheid van burgers in de [Grondwet][ref1] en andere wet- en
      regelgeving;

      e. het onderhoud van het stelsel van de [Grondwet][ref2] en het [Statuut][ref3];

      f. de rijksbrede coördinatie van het antidiscriminatiebeleid en de beleidsverantwoordelijkheid voor de
      [Algemene wet gelijke behandeling][ref4];

      g. voorbereiding van de noodzakelijke wijzigingen in het constitutionele bestel;

      h. de samenwerking met andere overheden aan openbaar bestuur en een weerbare, robuuste democratie;

      i. het versterken van het gebiedsgericht werken en het inzetten op het verbeteren van de onderlinge samenwerking
      tussen directies, directoraten-generaal en departementen en interbestuurlijk met andere overheidslagen.

      3 Het directoraat-generaal bestaat uit de volgende organisatieonderdelen:

      a. de directie Democratie en Bestuur;

      b. de directie Bestuur, Financiën en Regio’s;

      c. de directie Constitutionele Zaken en Wetgeving.


