      1 Het directoraat-generaal Koninkrijksrelaties staat onder leiding van een directeur-generaal.

      2 Het directoraat-generaal heeft onder meer de volgende taken:

      a. het zorg dragen voor een toekomstbeeld, scenario’s en handvatten om het Koninkrijk nader vorm en inhoud te
      geven, door beleidsvorming, beleidsvaststelling en uitvoering;

      b. het onderhouden van goede relaties met en het coördineren van de samenwerking met de openbare lichamen van
      Caribisch Nederland en met Curaçao, Aruba en Sint Maarten;

      c. het met andere partners binnen en buiten het departement zorg dragen voor het opstellen en verwezenlijken van
      het beleid van het Ministerie voor de openbare lichamen van Caribisch Nederland;

      d. het met andere partners binnen en buiten het departement zorg dragen voor de coördinatie van het algemene beleid
      van de rijksoverheid op dit terrein, met de speerpunten die samen met de openbare lichamen van Caribisch Nederland
      en de departementen worden bepaald;

      e. het beheersmatig aansturen van de kabinetten van de gouverneur en de Rijksvertegenwoordiger voor de openbare
      lichamen Bonaire, Sint Eustatius en Saba;

      f. het ter beschikking stellen van mensen en middelen aan het College Financieel Toezicht Curaçao en Sint Maarten,
      het College Financieel Toezicht Bonaire, Sint Eustatius en Saba, en het College Aruba Financieel Toezicht;

      g. het aansturen van de Rijksdienst Caribisch Nederland (RCN);

      h. het ondersteunen van de Vertegenwoordiger bij het uitvoeren van zijn taken en opdracht zoals vastgelegd in het
      koninklijk besluit van 4 maart 2013 (Stcrt. 2013, nr. 8486).

      3 Het directoraat-generaal bestaat uit de volgende organisatieonderdelen:

      a. de dienst Rijksdienst Caribisch Nederland;

      b. de dienst SSO-CN.

      4 Het directoraat-generaal kent geen directies, maar wel de volgende verantwoordelijken;

      a. de directeur Landen;

      b. de directeur Caribisch Nederland.

      5 Onder de directeur Landen ressorteert de vertegenwoordiger van Nederland in Aruba, Curaçao en Sint-Maarten. De
      vertegenwoordiger geeft leiding aan de Vertegenwoordiging.

      6 De vertegenwoordiger heeft de taken als bedoeld in het besluit in het tweede lid onder h.
    url: https://wetten.overheid.nl/BWBR0047860/2025-07-01#Artikel10
  - number: '11'
    text: |-
      1 Het directoraat-generaal Digitalisering en Overheidsorganisatie staat onder leiding van een directeur-generaal.

      2 Het directoraat-generaal heeft onder meer de volgende taken:

      a. de ontwikkeling van het werkgeverschap in de publieke sector (met een accent op de kabinetssectoren),
      modernisering van het werkgeverschap voor de sector Rijk, en de doorontwikkeling van de personele functie (HRM) van
      en in de Rijksdienst;

      b. de interbestuurlijke en interdepartementale ontwikkeling van de i-Overheid voor burgers en bedrijven:

      1°. de randvoorwaardelijke beleidsontwikkeling ten behoeve van de i-samenleving waaruit onder andere voortvloeit
      de ontwikkeling en realisatie van de digitale basisvoorzieningen voor burgers en bedrijven, met inbegrip van de
      bijbehorende regelgeving, toezicht en de bijbehorende bestuurlijke structuur voor de aansturing en financiering van
      de voorzieningen;

      2°. het opdrachtgeverschap aan RvIG, Logius, DICTU, ICTU, de Kamer van Koophandel en de samenwerkingsovereenkomsten
      met de Rijksdienst voor ondernemend Nederland voor zover deze voortkomen uit de verantwoordelijkheid voor de
      voorzieningen en beleidsverantwoordelijkheden;

      3°. de digitale identificatie (eID);

      c. het bevorderen van de optimale vormgeving van de informatisering en ICT in het Rijk en bij zelfstandige
      bestuursorganen door het stellen van kaders en het toezicht daarop;

      d. de ontwikkeling van en sturing op het rijksbrede bedrijfsvoeringsbeleid en de beoordeling of de beleidsambities
      worden gerealiseerd;

      e. de kaders voor inkoop, aanbesteden, faciliteiten en huisvesting bij het Rijk en het toezicht daarop;

      f. de doorontwikkeling van een rijksdienst en van een efficiënte en effectieve bedrijfsvoering van de overheid,
      inclusief de monitoring en verantwoording van het rijksbrede bedrijfsvoeringsbeleid;

      g. het zorgdragen voor de stelsels van de basisregistratie personen, de Persoonsinformatievoorziening in de
      Caribische delen van het Koninkrijk (PIVA), het burgerservicenummer en reisdocumenten met de bijbehorende
      registraties, alsmede de verwerking van persoonsgegevens met het oog op die stelsels;

      h. de zorg voor het bewaken van het integrale karakter en de consistentie van de rijksbrede kaders voor beveiliging
      alsmede het toezicht op de werking van de integrale beveiliging van de Rijksdienst;

      i. de coördinerende functie op digitalisering van de samenleving, waarin economisch belang, grondrechten en
      veiligheid samenkomen en geborgd worden in de digitale driehoek van het Ministerie, het Ministerie van Justitie en
      Veiligheid en het Ministerie van Economische Zaken en Klimaat;

      j. het versterken van de samenwerking tussen de EU-lidstaten op het gebied van digitalisering en het aanpakken
      van digibetisme.

      3 Het directoraat-generaal bestaat uit de volgende organisatieonderdelen:

      a. de directie Ambtenaar en Organisatie (DA&O);

      b. de directie Inkoop- Facilitair- en Huisvestingsbeleid Rijk (DIFHR);

      c. de directie Chief Information Officier Rijk;

      d. de directie Digitale Samenleving;

      e. de directie Digitale Overheid;

      f. het secretariaat voor het Adviescollege ICT-toetsing;

      g. het bureau Adviescollege Openbaarheid en Informatiehuishouding.

      4 De directeur Digitale Samenleving is tevens plaatsvervangend directeur-generaal Digitalisering en
      Overheidsorganisatie. De plaatsvervangend directeur-generaal Digitalisering en Overheidsorganisatie is
      verantwoordelijk voor de positionering, profilering en vertegenwoordiging van Nederland in Europa op de
      digitaliseringopgave.
