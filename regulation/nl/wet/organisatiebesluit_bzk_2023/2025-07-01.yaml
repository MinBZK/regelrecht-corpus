      1 De Nationaal Coördinator tegen Discriminatie en Racisme staat beheersmatig onder leiding van de secretaris-
      generaal.

      2 De Nationaal Coördinator tegen Discriminatie en Racisme heeft onder meer de volgende taken:

      a. het bevorderen en voeren van overleg met en het onderhouden van relaties met maatschappelijke initiatieven,
      bewegingen en belangengroepen op het terrein van discriminatie, alsmede met betrokken bestuursorganen en bedrijven;

      b. het doen van een voorstel aan de Minister voor het meerjarig programma alsmede de jaarlijkse actieprogramma’s;

      c. het bevorderen dat alle betrokken partijen, zowel binnen de overheid als in de samenleving, vanuit hun eigen
      verantwoordelijkheid, hun rol vervullen om de aanpak van discriminatie te versterken en de doelen van het Nationaal
      Programma te halen;

      d. het bewaken van de voortgang van de uitvoering van het Nationaal Programma en daarover rechtstreeks adviseren
      aan de Minister;

      e. het op verzoek bijstaan van de Minister bij de behandeling van het Nationaal Programma in het parlement,
      waarbij de Nationaal Coördinator tegen Discriminatie en Racisme desgewenst het woord kan voeren over feiten en
      omstandigheden betreffende het Nationaal Programma;

      f. het doen van voorstellen voor de agenda van de vergaderingen van de ‘Stuurgroep voor de aanpak van discriminatie
      en racisme;

      g. het nemen van initiatieven in het opbouwen en in stand houden van draagvlak voor het Nationaal Programma;

      h. het bevorderen van de communicatie over het Nationaal Programma.

      3 De Nationaal Coördinator tegen Discriminatie en Racisme wordt bij het uitvoeren van zijn taken ondersteund
      door een bureau. Het hoofd van het Bureau wordt rechtstreeks aangestuurd door de Nationaal Coördinator tegen
      Discriminatie en Racisme.
