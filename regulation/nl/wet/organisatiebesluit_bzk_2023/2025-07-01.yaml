      1 Het cluster Bestuursondersteuning staat onder inhoudelijke leiding van de plaatsvervangend secretaris-generaal
      en onder beheersmatige leiding van de clusterdirecteur Bestuursondersteuning. De rol van clusterdirecteur
      Bestuursondersteuning wordt roulerend vervuld door de directeuren KIEM, BA en Communicatie. Bij afwezigheid van de
      plaatsvervangend secretaris-generaal is de clusterdirecteur Bestuursondersteuning plaatsvervanger ten aanzien van
      aangelegenheden die het cluster Bestuursondersteuning als geheel betreffen.

      2 Het cluster Bestuursondersteuning helpt beleid en uitvoering publieke waarde te realiseren, rekening houdend met
      de politieke omgeving waarin die waardecreatie plaatsvindt en moet worden gelegitimeerd. Het cluster draagt zorg
      voor de overkoepelende blik, de signaalfunctie en het verbindend vermogen.

      3 Het cluster bestaat uit de volgende organisatieonderdelen:

      a. de directie Communicatie;

      b. de directie Bestuurlijke Advisering (BA);

      c. de directie Kennis, Internationaal, Europa en Macro-economie (KIEM).
    url: https://wetten.overheid.nl/BWBR0047860/2025-07-01#Artikel22
  - number: '23'
    text: |-
      1 De directie Communicatie staat onder leiding van een directeur.

      2 De directie heeft onder meer de volgende taken:

      a. optreden als strategische, autonome adviseur van bewindspersonen, ambtelijke top en beleid met als doel het
      helpen ontwikkelen en realiseren van maatschappelijk gedragen beleid;

      b. werken aan het realiseren van de lange-termijn-ambities van kabinet en departement;

      c. managen van de dagelijkse actualiteit (kansen, issues, crises).
    url: https://wetten.overheid.nl/BWBR0047860/2025-07-01#Artikel23
  - number: '24'
    text: |-
      1 De directie BA staat onder leiding van een directeur.

      2 De directie heeft onder meer de volgende taken:

      a. BZK in de volle breedte ondersteunen bij het aanbrengen van samenhang en integraliteit in het politieke en
      beleidswerk, specifiek vanuit politiek-bestuurlijk oogpunt;

      b. adviseren van directies en bewindspersonen op inhoud;

      c. faciliteren van het proces van stukkenstroom onder meer door gerichte kennisoverdracht, het aanbieden van een
      aanpak bij belangrijke, nieuwe dossiers, het beschikbaar stellen van informatie en hulpmiddelen en met inzet van
      haar uitgebreide netwerk binnen en buiten BZK;

      d. coördinatie en monitoring van de parlementaire informatiestromen tussen het Ministerie en de Eerste en Tweede
      Kamer en facilitaire, protocollaire en managementondersteuning van de ambtelijke en politieke leiding;

      e. advisering Openbare Orde, Inlichtingen en Veiligheid, ondersteuning ten aanzien van de sturing en het beheer van
      de AIVD en de besluitvorming, verantwoording en toezicht op het gebied van operationele uitvoering;

      f. voorbereiding van het departement op het beheersen van grootschalige incidenten, actualiteiten of crises, en
      invulling van de piketfunctie en interdepartementaal aanspreekpunt in geval van crisis.
    url: https://wetten.overheid.nl/BWBR0047860/2025-07-01#Artikel24
  - number: '25'
    text: |-
      1 De directie KIEM staat onder leiding van een directeur.

      2 De directie heeft onder meer de volgende taken:

      a. de inhoudelijke, BZK-brede strategische agenda versterken;

      b. het Europees en internationaal beleid van BZK coördineren;

      c. de economische rationaliteit inbrengen in het BZK-beleid.
    url: https://wetten.overheid.nl/BWBR0047860/2025-07-01#Artikel25
  - number: '26'
    text: |-
      1 De Dienst van de Huurcommissie staat onder leiding van het bestuur van de Huurcommissie bedoeld in de
      [Uitvoeringswet huurprijzen woonruimte][ref1].

      2 De Dienst van de Huurcommissie heeft de taken bedoeld in de [artikelen 4][ref2], [4a][ref3] en
