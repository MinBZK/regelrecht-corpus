      1 Er is een Bestuursraad Binnenlandse Zaken en Koninkrijksrelaties Smal en een Bestuursraad Binnenlandse Zaken en
      Koninkrijksrelaties Breed.

      2 De Bestuursraad Smal is samengesteld uit de secretaris-generaal, de plaatsvervangend secretaris-
      generaal, de directeuren-generaal Openbaar Bestuur en Democratische Rechtsstaat, Volkshuisvesting en Bouwen,
      Koninkrijksrelaties, Digitalisering en Overheidsorganisatie, Vastgoed en Bedrijfsvoering Rijk, Ruimtelijke
      Ordening en de directeuren Constitutionele Zaken en Wetgeving en Financieel-economische Zaken. De leden kunnen zich
      incidenteel laten vervangen door hun plaatsvervangers of, in uitzonderlijke gevallen, door een andere rechtstreeks
      onder hen ressorterende functionaris. De overige directeuren-generaal en de Chief Information Officer BZK (CIO BZK)
      hebben een staande uitnodiging voor de Bestuursraad Smal.

      3 De Bestuursraad Breed is samengesteld uit de Bestuursraad Smal aangevuld met de directeuren-generaal Algemene
      Inlichtingen- en Veiligheidsdienst en Algemene Bestuursdienst. De leden kunnen zich incidenteel laten vervangen
      door hun plaatsvervangers of, in uitzonderlijke gevallen, door een andere rechtstreeks onder hen ressorterende
      functionaris. De CIO BZK heeft een staande uitnodiging voor de Bestuursraad Breed.

      4 Het overleg in de Bestuursraad Smal, respectievelijk de Bestuursraad Breed, heeft, onverminderd het bepaalde
      in de departementale mandaat- en volmachtsbesluiten over de bevoegdheden van de afzonderlijke leden van de
      Bestuursraad Smal, respectievelijk de Bestuursraad Breed ten aanzien van de onderwerpen die in het overleg aan
      de orde komen, ten doel het bespreken en het bereiken van overeenstemming over de departementale beleids- en
      beheerkaders en het toezien op de uitvoering van deze kaders.

      5 De Bestuursraad Smal, respectievelijk de Bestuursraad Breed, heeft tevens tot doel het bespreken en het bereiken
      van overeenstemming over aspecten van het departementale personeelsbeleid en personele aangelegenheden alsmede het
      toezien op de uitvoering hiervan.

      6 Al hetgeen in de vergaderingen aan de orde komt is vertrouwelijk, voor zover niet anders is besloten of indien
      bij wettelijk voorschrift anders is bepaald.

      7 Een adviseur van de directie Bestuursadvisering voert het secretariaat van de Bestuursraad.

      8 Een adviseur van de directie P&O voert het secretariaat van de bespreking van het departementale
      personeelsbeleid.
