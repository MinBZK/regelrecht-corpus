      1 De directie Constitutionele Zaken en Wetgeving staat onder leiding van een directeur.

      2 De directie is, naast de beleidsmatige taken zoals genoemd in
      [artikel 6 tweede lid onderdeel b tot en met i][ref1] van dit besluit, belast met de departement brede juridische
      taken en zelfstandige advisering over onder meer:

      a. het beheer en onderhoud van de [Grondwet][ref2] en het [Statuut][ref3];

      b. de toetsing van (concept)regelgeving, beleid en maatregelen aan de [Grondwet][ref4], het [Statuut][ref5]
      en relevante internationale verdragen, inclusief het EU-recht, alsmede het vervullen van de functie van
      Coördinatiepunt staatssteun decentrale overheden (CSDO);

      c. het opstellen van regelgeving waar de bewindspersonen eerstverantwoordelijk voor zijn;

      d. het bijdragen aan de totstandkoming van nationale en internationale wetgeving waarbij de bewindspersonen mede
      zijn betrokken;

      e. de noodzaak, wenselijkheid en mogelijkheid om door middel van wetgeving bij te dragen aan het bereiken van de
      beleidsdoelstellingen van de bewindspersonen;

      f. het begeleiden en voeren van bestuursrechtelijke en civielrechtelijke (gerechtelijke) procedures namens de
      bewindspersonen of de Staat der Nederlanden en de advisering over juridische aangelegenheden in het algemeen,
      alsmede de advisering in bijzondere opdrachten van bewindspersonen en de ambtelijke top;

      g. de rijksbrede stelselverantwoordelijkheid voor de [Omgevingswet][ref6].


