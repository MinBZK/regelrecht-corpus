      1 Het cluster Mensen en Middelen, met uitzondering van FEZ en sRob, staat onder inhoudelijke leiding van de
      plaatsvervangend secretaris-generaal en onder beheersmatige leiding van de clusterdirecteur Mensen en Middelen.
      De directeur P&O vervult de rol van clusterdirecteur Mensen en Middelen. Bij afwezigheid van de plaatsvervangend
      secretaris-generaal is de clusterdirecteur Mensen en Middelen plaatsvervanger ten aanzien van aangelegenheden die
      het cluster Mensen en Middelen als geheel betreffen. Bij afwezigheid van de clusterdirecteur Mensen en Middelen
      is de directeur FEZ eerste plaatsvervanger en de directeur Chief Information Officer & Informatiemanagement tweede
      plaatsvervanger.

      2 De directie FEZ staat onder de inhoudelijk leiding van de secretaris-generaal en onder de beheersmatige leiding
      van de plaatsvervangend secretaris-generaal.

      3 Het sRob staat onder de beheersmatige leiding van de clusterdirecteur Mensen en Middelen.

      4 Het cluster Mensen en Middelen draagt zorg voor integrale advisering over mensen en middelen op niveau van de
      bestuursraden, de directoraten-generaal en directies.

      5 Het cluster bestaat uit de volgende organisatieonderdelen:

      a. de directie P&O (P&O);

      b. de directie Financieel-Economische Zaken (FEZ);

      c. de directie Chief Information Officer & Informatiemanagement (CIO&I);

      d. het secretariaat van de Raad voor het openbaar bestuur (sRob).
