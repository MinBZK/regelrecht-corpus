      1 De plaatsvervangend secretaris-generaal staat onder leiding van de secretaris-generaal.

      2 De plaatsvervangend secretaris-generaal heeft onder meer de volgende taken:

      a. de verantwoordelijkheid voor de departement brede samenhangende bedrijfsvoering georganiseerd in het cluster M&M
      en cluster BO;

      b. het rechtstreeks leiding geven aan en de eindverantwoordelijkheid voor het functioneren van de directeuren
      Personeel en Organisatie (P&O), Chief Information Officer & Informatiemanagement (CIO&I), Communicatie, Kennis,
      Internationaal, Europa en Macro-economie (KIEM) en Bestuursadvisering (BA);

      c. de portefeuillehouder in de Bestuursraad voor de onderwerpen P&O, CIO&I, Communicatie, KIEM en BA;

      d. de verantwoordelijkheid voor één of meerdere departement brede portefeuilles;

      e. het eigenaarschap van alle tot het Ministerie behorende uitvoeringsorganisaties, tenzij deze rol ergens anders
      is belegd;

      f. de vertegenwoordiging van het Ministerie in de Interdepartementale Commissie Bedrijfsvoering Rijk;

      g. het opdrachtgeverschap met betrekking tot de departementale herindelingen volgens ‘[Handboek departementale
      herschikkingen 2019](https://kennisopenbaarbestuur.nl/rapporten-publicaties/handboek-departementale-
      herschikkkingen/)’ en eventuele vervolgversies;

      h. het opdrachtgeverschap van de Beveiligingsautoriteit en het fungeren als contactpersoon bij afwezigheid van de
      secretaris-generaal en de beslissingsbevoegdheid bij calamiteiten.

      3 De plaatsvervangend secretaris-generaal is plaatsvervanger van de secretaris-generaal, met uitzondering van de
      inhoudelijke dossiers op het werkgebied van de directeuren-generaal. In voorkomende gevallen kan de secretaris-
      generaal ervoor kiezen om de plaatsvervangend secretaris-generaal aan te wijzen als vervanger voor:

      a. de bestuurstaken in de zin van de [Wet op de Ondernemingsraden][ref1] richting de Departementale
      Ondernemingsraad en de Ondernemingsraad Kerndepartement BZK;

      b. het opdrachtgeverschap op het gebied van organisatieontwikkeling en begeleiden van transitie en
      organisatieveranderingstrajecten die voortvloeien uit wijzigingen in de organisatie;

      c. domein overstijgende onderwerpen zoals vervanging in Secretarissen-Generaal Overleg en crisisbeheersing.


