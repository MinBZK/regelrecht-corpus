      1 De regeringscommissaris Informatiehuishouding staat beheersmatig onder leiding van de secretaris-generaal.

      2 De regeringscommissaris Informatiehuishouding heeft onder meer de volgende taken:

      a. als boegbeeld het initiatief nemen in het opbouwen en in stand houden van politiek en bestuurlijk draagvlak voor
      het programma Open op Orde;

      b. het voeren van, en zitting nemen in, overleggen en het onderhouden van een nauwe samenwerkingsrelatie met de
      betrokken rijksoverheidsorganisaties;

      c. het stimuleren dat rijksoverheidsorganisaties, vanuit hun eigen verantwoordelijkheid, de informatiehuishouding
      verbeteren en de doelen van het programma Open op Orde halen, en met de betrokken rijksoverheidsorganisaties
      knelpunten in de uitvoering van het programma Open op Orde benoemen en oplossingen aandragen;

      d. zo nodig rijksoverheidsorganisaties op de voortgang aanspreken en indien het de voortgang van het programma Open
      op Orde ten goede komt en voor de realisatie van het programma Open op Orde noodzakelijk is, voorstellen doen aan
      de Minister om bevoegdheden in te zetten;

      e. het signaleren van ontwikkelingen en bewaken van de voortgang van de uitvoering van het programma Open op Orde
      en daarover rechtstreeks adviseren aan de Minister;

      f. het inzichtelijk laten maken van maatschappelijke effecten van de uitvoering van het Programma Open op Orde;

      g. het op verzoek bijstaan van de Minister, bij de behandeling van het programma Open op Orde in het parlement,
      waarbij de regeringscommissaris Informatiehuishouding desgewenst het woord kan voeren over feiten en omstandigheden
      betreffende het programma Open op Orde;

      h. het adviseren over, en het doen van, voorstellen voor verbeteringen ten aanzien van het functioneren van het
      sturingssysteem.

      3 De regeringscommissaris Informatiehuishouding wordt bij het uitvoeren van zijn taken ondersteund door een bureau.
    url: https://wetten.overheid.nl/BWBR0047860/2025-07-01#Artikel15
