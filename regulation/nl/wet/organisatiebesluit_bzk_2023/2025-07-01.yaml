    text: |-
      In dit besluit wordt verstaan onder:

      a. *Ministerie:* het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties;

      b. *Minister:* de Minister van Binnenlandse Zaken en Koninkrijksrelaties;

      c. *bewindspersonen:* de Minister van Binnenlandse Zaken en Koninkrijksrelaties, Minister voor Volkshuisvesting
      en Ruimtelijke Ordening of de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties, afhankelijk van wie
      het aangaat;

      d. *capaciteitsplan:* schriftelijk stuk waarin de uitwerking van de flexibele organisatiestructuur van een
      dienstonderdeel wordt vastgelegd evenals de verdeling van de formatie binnen deze structuur;

      e. *BZK Kerndepartement:* de directoraten-generaal Openbaar Bestuur en Democratische Rechtsstaat, Volkshuisvesting
      en Bouwen, Koninkrijksrelaties, Digitalisering en Overheidsorganisatie, Ruimtelijke Ordening en de clusters Mensen
      en Middelen en Bestuursondersteuning.
    url: https://wetten.overheid.nl/BWBR0047860/2025-07-01#Artikel1
  - number: '2'
    text: |-
      1 Het Ministerie bestaat uit de secretaris-generaal, de plaatsvervangend secretaris-generaal en de volgende
      dienstonderdelen:

      a. het directoraat-generaal Openbaar Bestuur en Democratische Rechtsstaat (DGOBDR);

      b. het directoraat-generaal Volkshuisvesting en Bouwen (DGVB);

      c. het directoraat-generaal Ruimtelijke Ordening (DGRO);

      d. het directoraat-generaal Koninkrijksrelaties (DGKR);

      e. het directoraat-generaal Digitalisering en Overheidsorganisatie (DGDOO);

      f. het directoraat-generaal Algemene Bestuursdienst (DGABD);

      g. het directoraat-generaal Algemene Inlichtingen- en Veiligheidsdienst (AIVD);

      h. de Nationaal Coördinator tegen Discriminatie en Racisme (NCDR);

      i. de regeringscommissaris Informatiehuishouding (IHH);

      j. de regeringscommissaris [Omgevingswet][ref1];

      k. het directoraat-generaal Vastgoed en Bedrijfsvoering Rijk (DGVBR);

      l. het cluster Mensen en Middelen (M&M);

      m. het cluster Bestuursondersteuning (BO);

      n. het agentschap Dienst van de Huurcommissie (DHC);

      o. het agentschap Logius;

      p. het agentschap Rijksdienst voor Identiteitsgegevens (RvIG);

      q. de dienst Toelatingsorganisatie Kwaliteitsborging Bouw (TloKB).

      2 De dienstonderdelen bestaan uit organisatieonderdelen waarvan de inrichting nader kan worden beschreven op een
      wijze als bedoeld in [artikel 29, tweede lid][ref2].

      3 De secretaris-generaal geeft rechtstreeks leiding aan de leidinggevende functionarissen van de dienstonderdelen,
      genoemd in het eerste lid, met uitzondering van:

      a. het agentschap Dienst Huurcommissie dat ressorteert onder het bestuur van de Huurcommissie;

      b. de dienst Toelatingsorganisatie Kwaliteitsborging Bouw die ressorteert onder het bestuur van de
      Toelatingsorganisatie Kwaliteitsborging Bouw.

      4 de Nationaal Coördinator tegen Discriminatie en Racisme genoemd in het eerste lid, onder h, en de
      regeringscommissarissen genoemd in het eerste lid, onder i en j, voeren de aan hen opgedragen taken uit onder de
      verantwoordelijkheid van de Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
