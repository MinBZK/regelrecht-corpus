  - number: '3'
    text: |-
      1 Het aanvraagformulier voor een jachtakte als bedoeld in [artikel 38, eerste lid, onderdeel a][ref1], of
      [artikel 43, eerste lid, Flora- en faunawet][ref2] wordt vastgesteld volgens het model als opgenomen in
      [bijlage 7][ref3] bij deze regeling.

      2 Het aanvraagformulier voor een valkeniersakte als bedoeld in
      [artikel 38, eerste lid, onderdeel b, Flora- en faunawet][ref4] wordt vastgesteld volgens het model als opgenomen
      in [bijlage 8][ref5] bij deze regeling.

      3 Het aanvraagformulier voor een valkeniersakte als bedoeld in [artikel 45, eerste lid, Flora- en faunawet][ref6]
      wordt vastgesteld volgens het model als opgenomen in [bijlage 9][ref7] bij deze regeling.

      4 Het aanvraagformulier voor een kooikersakte als bedoeld in
      [artikel 38, eerste lid, onderdeel c, Flora- en faunawet][ref8] wordt vastgesteld volgens het model als opgenomen
      in [bijlage 10][ref9] bij deze regeling.

      5 Het aanvraagformulier voor een duplicaat van een valkeniersakte als bedoeld in
      [artikel 38, eerste lid, onderdeel b, Flora- en faunawet][ref10] en voor een duplicaat van een kooikersakte als
      bedoeld in artikel 38, eerste lid, onderdeel c, Flora- en faunawet wordt vastgesteld volgens het model opgenomen in
      [bijlage 11][ref11] bij deze regeling.


