  - number: '2'
    text: |-
      1 De door de korpschef aan te brengen en te stempelen zegel op een jachtakte als bedoeld in
      [artikel 38, eerste lid, onderdeel a, van de Flora- en faunawet][ref1], geldig van 1 april 2016 tot en met 31 maart
      2017, wordt vastgesteld volgens het model als opgenomen in [bijlage 4][ref2] bij deze regeling en is gedrukt op een
      donkerblauwe achtergrond (kleuraanduiding Pantone blue 072).

      2 De door de korpschef aan te brengen en te stempelen zegel op een jachtakte als bedoeld in
      [artikel 45, eerste lid, van de Flora- en faunawet][ref3], geldig van 1 april 2016 tot en met 31 maart 2017, wordt
      vastgesteld volgens het model als opgenomen in [bijlage 5][ref4] bij deze regeling en is gedrukt op een turquoise
      achtergrond (kleuraanduiding Pantone 333).

      3 De door de korpschef aan te brengen en te stempelen zegel op een duplicaat jachtakte als bedoeld in
      [artikel 38, eerste lid, onderdeel a][ref5], of [artikel 45, eerste lid, van de Flora- en faunawet][ref6], geldig
      van 1 april 2016 tot en met 31 maart 2017, wordt vastgesteld volgens het model als opgenomen in [bijlage 6][ref7]
      bij deze regeling en is gedrukt op een roodbruine achtergrond (kleuraanduiding Pantone 484).


