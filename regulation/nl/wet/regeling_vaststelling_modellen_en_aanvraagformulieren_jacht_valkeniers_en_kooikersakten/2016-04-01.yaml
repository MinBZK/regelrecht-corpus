preamble:
  text: |-
    Gelet op artikel 38, tweede lid, Flora- en faunawet;

    Gelet op artikel 1, eerste en tweede lid, Jachtregeling;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0013474/2016-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Het model van een jachtakte als bedoeld in [artikel 38, eerste lid, onderdeel a][ref1], of
      [artikel 45, eerste lid, Flora- en faunawet][ref2] wordt gevormd door de als bijlage 1 bij deze regeling gevoegde
      akte, voorzien van een door de korpschef gestempelde zegel, die jaarlijks door de Minster van Economische Zaken
      wordt vastgesteld.

      2 Het model van een valkeniersakte als bedoeld in [artikel 38, eerste lid, onderdeel b][ref3], of
      [artikel 45, eerste lid, Flora- en faunawet][ref4] wordt vastgesteld volgens het model als opgenomen in bijlage 2
      bij deze regeling.

      3 Het model van een kooikersakte als bedoeld in [artikel 38, eerste lid, onderdeel c, Flora- en faunawet][ref5]
      wordt vastgesteld volgens het model als opgenomen in bijlage 3 bij deze regeling.


