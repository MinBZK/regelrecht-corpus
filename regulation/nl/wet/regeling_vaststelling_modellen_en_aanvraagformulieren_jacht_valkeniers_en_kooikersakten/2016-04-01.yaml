  - number: '2.1'
    text: |-
      De door de korpschef aan te brengen en te stempelen zegel op een jachtakte als bedoeld in
      [artikel 38, eerste lid, onderdeel a, van de Flora- en faunawet][ref1], geldig van 1 april 2016 tot en met 31 maart
      2017, wordt vastgesteld volgens het model als opgenomen in [bijlage 4][ref2] bij deze regeling en is gedrukt op een
      donkerblauwe achtergrond (kleuraanduiding Pantone blue 072).


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0013474
    url: https://wetten.overheid.nl/BWBR0013474/2016-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0013474
  - number: '2.2'
    text: |-
      De door de korpschef aan te brengen en te stempelen zegel op een jachtakte als bedoeld in
      [artikel 45, eerste lid, van de Flora- en faunawet][ref1], geldig van 1 april 2016 tot en met 31 maart 2017, wordt
      vastgesteld volgens het model als opgenomen in [bijlage 5][ref2] bij deze regeling en is gedrukt op een turquoise
      achtergrond (kleuraanduiding Pantone 333).


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0013474
    url: https://wetten.overheid.nl/BWBR0013474/2016-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '45'
      - id: ref2
        bwb_id: BWBR0013474
  - number: '2.3'
    text: |-
      De door de korpschef aan te brengen en te stempelen zegel op een duplicaat jachtakte als bedoeld in
      [artikel 38, eerste lid, onderdeel a][ref1], of [artikel 45, eerste lid, van de Flora- en faunawet][ref2], geldig
      van 1 april 2016 tot en met 31 maart 2017, wordt vastgesteld volgens het model als opgenomen in [bijlage 6][ref3]
      bij deze regeling en is gedrukt op een roodbruine achtergrond (kleuraanduiding Pantone 484).


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel45
