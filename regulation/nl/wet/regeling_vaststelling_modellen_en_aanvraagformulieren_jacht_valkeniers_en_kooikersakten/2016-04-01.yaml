    text: |-
      Het model van een kooikersakte als bedoeld in [artikel 38, eerste lid, onderdeel c, Flora- en faunawet][ref1] wordt
      vastgesteld volgens het model als opgenomen in bijlage 3 bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel38
    url: https://wetten.overheid.nl/BWBR0013474/2016-04-01#Artikel1
