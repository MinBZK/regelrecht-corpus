    text: |-
      Het model van een valkeniersakte als bedoeld in [artikel 38, eerste lid, onderdeel b][ref1], of
      [artikel 45, eerste lid, Flora- en faunawet][ref2] wordt vastgesteld volgens het model als opgenomen in bijlage 2
      bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel45
    url: https://wetten.overheid.nl/BWBR0013474/2016-04-01#Artikel1
