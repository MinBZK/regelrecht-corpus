articles:
  - number: '1.1'
    text: |-
      Het model van een jachtakte als bedoeld in [artikel 38, eerste lid, onderdeel a][ref1], of
      [artikel 45, eerste lid, Flora- en faunawet][ref2] wordt gevormd door de als bijlage 1 bij deze regeling gevoegde
      akte, voorzien van een door de korpschef gestempelde zegel, die jaarlijks door de Minster van Economische Zaken
      wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel45
    url: https://wetten.overheid.nl/BWBR0013474/2016-04-01#Artikel1
