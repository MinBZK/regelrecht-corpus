preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is in de Pensioenwet en in de Wet verplichte
    beroepspensioenregeling de mogelijkheid op te nemen om pensioenaanspraken gedurende de gehele uitkeringsperiode
    flexibel te maken;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0038177/2016-09-01#ArtikelAanhef
articles:
  - number: IV
    text: |-
      In afwijking van [artikel I, onderdelen G en Ib][ref1], voor zover het betreft
      [artikel 63b van de Pensioenwet][ref2] en [artikel II, onderdelen G en K][ref3], voor zover het betreft
      [artikel 75b van de Wet verplichte beroepspensioenregeling][ref4], geldt de verplichting om de opgaven en
      indicaties, bedoeld in de [artikelen 44a][ref5] en 63b van de Pensioenwet en de [artikelen 55a][ref6] en 75b van
      de Wet verplichte beroepspensioenregeling, weer te geven op basis van een pessimistisch scenario, een verwacht
      scenario en een optimistisch scenario, niet tot een bij koninklijk besluit te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0038177#ArtikelI
