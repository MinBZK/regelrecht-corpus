        artikel: 47b
  - number: '3.1'
    text: |-
      Van structurele informatieverstrekking is sprake als er doorlopend informatie wordt verstrekt of als er sprake
      is van grote hoeveelheden. De Directeur-Generaal der Belastingen (zie hoofdstuk 2.2.2) beslist over verzoeken
      om structurele informatieverstrekking. Voor het structureel verstrekken van informatie ten behoeve van
      opsporingsonderzoeken wordt geen ontheffing verleend. Met betrekking tot het verstrekken van informatie ten behoeve
      van opsporingsonderzoeken geeft [hoofdstuk 6][ref1] regels.

      Indien ontheffing is verleend wordt het bestuursorgaan waaraan de Belasting-dienst informatie mag verstrekken
      opgenomen in de bijlagen 2A, 2B of 2C. In deze bijlagen worden tevens de bestuursorganen opgenomen waaraan
      informatie moet worden verstrekt op grond van een wettelijke verplichting. In hoofdstuk 1.3. is aangegeven welke
      directeur, met inachtneming van de hoofdstukken 2.1. en 2.2., de aanpassing van de bijlagen voorbereidt.

      De informatie van de Belastingdienst kan in het algemeen slechts dienen voor de verificatie van de gegevens die bij
      een ander bestuursorgaan bekend zijn. Dit uitgangspunt houdt echter niet in dat de Belastingdienst de gegevens voor
      het andere bestuursorgaan verifieert. Het bestuursorgaan waaraan de Belastingdienst gegevens verstrekt dient die
      gegevens zelf te verifiëren met de hem bekende gegevens. Bij gebleken afwijkingen dient het informatie-ontvangende
      bestuursorgaan een nader onderzoek in te stellen, waarbij de Belastingdienst kan worden betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0010092#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0010092/1993-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0010092
        hoofdstuk: '6'
  - number: '3.2'
    text: |-
      Ter uitvoering van structurele informatieverstrekking worden afspraken gemaakt. Deze afspraken worden neergelegd in
      een convenant tussen de Belastingdienst en het informatie-ontvangende bestuursorgaan. De afspraken hebben in ieder
      geval betrekking op de waarborgen voor verdere geheimhouding bij het informatie-ontvangende bestuursorgaan. Te
      denken valt hierbij aan afspraken over interne controle, accountantsverklaringen, vrijwaring voor eventuele schade
      die de Belastingdienst lijdt als (indirect) gevolg van bewust of onbewust verkeerd gebruik van de informatie door
      het ontvangende bestuursorgaan. In voorkomende gevallen zou tevens overwogen kunnen worden om in het convenant de
      mogelijkheid van uitsluiting voor de toekomst van het recht op gegevens op te nemen. De afspraken tussen de Douane
      en het informatie-ontvangende bestuursorgaan worden gemaakt door de Directeur douane. De afspraken ten aanzien
      van de uitwisseling van het sociaal-fiscaal nummer worden gemaakt door de Directeur ondernemingen Noord, indien
      nodig in overleg met de directeuren die tevens bij de informatieverstrekking zijn betrokken. De overige afspraken
      worden gecoördineerd door de Directeur particulieren, zo nodig in overleg met de directeuren die tevens bij de
      informatieverstrekking betrokken zijn.

      De verantwoordelijke directeur draagt zorg voor registratie van de verstrekte informatie per ontvangend
      bestuursorgaan en de daaraan verbonden kosten. Met het informatie-ontvangende bestuursorgaan maakt de directeur
      afspraken over het terug melden van resultaten. Periodiek beziet de verantwoordelijke directeur het rendement van
      de informatieverstrekking bij het ontvangende bestuursorgaan in relatie tot de werklast voor de Belastingdienst. Zo
      nodig treedt hij in overleg om afspraken te herzien.
    url: https://wetten.overheid.nl/BWBR0010092/1993-01-01#Artikel3.2
  - number: '3.3'
    text: |-
      3.3.1 Geautomatiseerde informatieverstrekking uit de centrale bestanden vindt plaats aan de instellingen genoemde
      in de bijlagen 2A, 2B en 2C in de gevallen dat dit in deze bijlagen door middel van een (A) is aangegeven. Voordat
      de Belastingdienst informatie verstrekt, wordt geverifieerd of het bestuursorgaan dat informatie vraagt wel het
      juiste SoFi-nummer heeft vermeld. Zo wordt voorkomen dat gegevens van een verkeerde persoon worden verstrekt.

      Indien een bestuursorgaan niet over een SoFi-nummer beschikt, maar dit wel mag gebruiken, vindt voorafgaand aan
      de informatieverstrekking een geautomatiseerde identificatie plaats. Gegevens met betrekking tot naam, adres,
      woonplaats en geboortedatum worden vergeleken met de gegevens in het systeem Beheer van relaties. Indien een
      eenduidige identificatie mogelijk is, met andere woorden: indien maar één persoon voldoet aan de opgegeven
      persoonsgegevens, wordt een SoFi-nummer bij de opgegeven persoonsgegevens gevoegd. Indien geen eenduidige
      identificatie mogelijk is, met andere woorden: indien geen of meer dan één persoon voldoet aan de opgegeven
      persoonsgegevens, dient handmatige identificatie plaats te vinden. Hiervoor kan een beroep worden gedaan op de
      eenheden van de Belastingdienst.

      3.3.2 De eenheden van de Belastingdienst zijn niet betrokken bij de geautomatiseerde informatieverstrekking uit
      centrale bestanden, maar kunnen naar aanleiding van deze informatieverstrekking wel door belastingplichtigen
      worden benaderd. Door fouten in de bestanden kan de Belastingdienst onjuiste informatie hebben verstrekt aan
      andere bestuursorganen. De eenheid gaat op verzoek van de belastingplichtige na of de informatie die aan een
      bestuursorgaan is verstrekt overeenkomt met de op de eenheid beschikbare informatie over de belastingplichtige.
      Daarnaast kan contact worden gezocht met het bestuursorgaan waaraan de informatie is verstrekt om het probleem van
      de belastingplichtige op te lossen. Indien de eenheid meent dat aan een bestuursorgaan verkeerde inkomensgegevens
      zijn verstrekt dan kan de eenheid op verzoek van de belastingplichtige het juiste belastbaar inkomen vaststellen en
      dit tevens aan het desbetreffende bestuursorgaan verstrekken.

      3.3.3 De uitvoeringsinstellingen op het gebied van de sociale verzekeringen en de gemeentelijke sociale
      diensten controleren met behulp van informatie uit geautomatiseerde bestanden van de Belastingdienst
      of uitkeringsgerechtigden naast hun uitkering ten onrechte nog andere looninkomsten hebben genoten. De
      Belastingdienst verstrekt in het geval dat onterechte samenloop wordt geconstateerd op geautomatiseerde wijze het
      loonbelastingnummer en de naam-, adres- en woonplaatsgegevens van de inhoudingsplichtige die het inkomen heeft
      uitbetaald.
    url: https://wetten.overheid.nl/BWBR0010092/1993-01-01#Artikel3.3
  - number: '4.1'
    text: |-
      In dit hoofdstuk wordt omschreven hoe op een eenheid moet worden omgegaan met een incidenteel verzoek om
      informatie. Er zijn daarbij vier situaties te onderscheiden.

      a) Er is sprake van een wettelijke plicht tot informatieverstrekking (zie hoofdstuk 4.2).

      b) Een belastingplichtige verzoekt om informatie over zichzelf (zie hoofdstuk 4.3).

      c) Een bestuursorgaan verzoekt om informatie (zie hoofdstuk 4.4).

      d) Een (rechts)persoon verzoekt om informatie over een ander (zie hoofdstuk 4.5). [Hoofdstuk 4][ref1] is niet van
      toepassing op de informatieverstrekking aan bestuursorganen die in het kader van het strafrecht werkzaam zijn. Met
      betrekking tot het verstrekken van informatie ten behoeve van de opsporing van strafbare feiten en het afleggen van
      getuigenverklaringen geeft [hoofdstuk 6][ref2] regels.

      Een verzoek om informatie moet schriftelijk worden ingediend. Een uitzondering op deze regel vormt de situatie dat
      een belastingplichtige mondeling om informatie over zichzelf verzoekt. Een dergelijk verzoek kan wel in behandeling
      worden genomen. De informatie wordt schriftelijk verstrekt, tenzij er sprake is van statusinformatie (zie hoofdstuk
      4.3.1). Onder statusinformatie wordt verstaan informatie over de stand van zaken van de afhandeling van aangiften,
      bezwaarschriften en verzoeken. In dit hoofdstuk is verder aangegeven dat de verstrekking van informatie moet worden
      vastgelegd (zie hoofdstuk 4.6) en dat er afspraken moeten worden gemaakt over het melden van de resultaten van de
      informatieverstrekking (zie hoofdstuk 4.7).


      [ref1]: https://wetten.overheid.nl/BWBR0010092#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0010092#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0010092/1993-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0010092
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0010092
        hoofdstuk: '6'
  - number: '4.2'
    text: |-
      De bestuursorganen waaraan op grond van een wettelijke verplichting informatie moet worden verstrekt zijn opgenomen
      in de bijlagen 2A, 2B en 2C. Op een eenheid wordt getoetst of het verzoek aan de in de bijlage opgenomen criteria
      voldoet. Het kan voorkomen dat de gevraagde informatie niet is omschreven in de bijlagen. In dat geval gaat
      het hoofd van de eenheid na of de verstrekking valt binnen een wettelijke verplichting. Wel zal hij, indien de
      wettelijke bepaling daartoe ruimte biedt, een belangenafweging moeten maken (zie hoofdstuk 2.1.3.). Als het hoofd
      van de eenheid na afweging van alle belangen van mening is dat de informatie, ondanks de wettelijke plicht waarop
      een beroep wordt gedaan, niet zou moeten worden verstrekt, legt hij het verzoek voor de Directeur AFZ.

      Indien het hoofd van de eenheid van mening is dat de informatie wel zou moeten worden verstrekt, maar er sprake
      lijkt van structurele informatieverstrekking legt hij het verzoek voor aan de directeur.
    url: https://wetten.overheid.nl/BWBR0010092/1993-01-01#Artikel4.2
  - number: '4.3'
    text: |-
      De volgende informatie kan zonder meer aan belastingplichtige worden verstrekt:

        - De documenten die door een belastingplichtige zelf zijn aangeleverd, worden op verzoek van die belastingplichtige
      altijd aan hem openbaar gemaakt (door in kopie te verstrekken of ter inzage te geven).
        - Het openbaar deel van een controlerapport wordt uit eigen beweging door de Belastingdienst aan belastingplichtige
      verstrekt.
        - Op verzoek wordt aan een belastingplichtige altijd een verklaring over zijn vastgesteld of aangegeven inkomen en
      vermogen afgegeven. Daartoe kan het formulier Inkomstenbelasting nr. 60 (zie bijage 3) worden gebruikt. Gegevens
      van de echtgenoot/partner worden alleen ingevuld als daar nadrukkelijk om is gevraagd en de echtgenoot/partner daar
      een machtiging voor heeft verleend.
        - Op verzoek kan een schriftelijke verklaring, inhoudende dat een belastingplichtige geen belastingschuld (meer)
      heeft, worden afgegeven aan die belastingplichtige. Ook kan, als dat in overeenstemming is met de werkelijkheid, op
      verzoek een schriftelijke verklaring aan de belastingplichtige worden afgegeven waaruit blijkt dat in het verleden
      voor wat betreft de invordering zich geen moeilijkheden hebben voorgedaan. Op die verklaringen wordt aangegeven dat
      het een weergave is van de situatie op dat moment.

      Indien iemand zich in persoon vervoegt met een vraag om informatie dient hij zijn identiteit aan te tonen. Bij het
      verstrekken van informatie aan belastingplichtige zelf is bijvoorbeeld een rijbewijs voldoende ter identificatie.
      Aan het verstrekken van een SoFi-nummer zijn zwaardere eisen gesteld. Verwezen wordt naar [hoofdstuk 2.8][ref1].
      Op telefonisch verzoek van een belastingplichtige en in reactie op een fax wordt slechts statusinformatie ter
      zake van de eigen aangifte verstrekt. Andere informatie mag alleen schriftelijk worden verzonden naar het bij de
      Belastingdienst bekende postadres.

      Voor de behandeling van verzoeken waarin een belastingplichtige met een beroep op de [WOB][ref2] nog andere
      informatie over zichzelf vraagt, wordt verwezen naar [hoofdstuk 2.5][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0010092#Artikel2.8
      [ref2]: https://wetten.overheid.nl/BWBR0005252
      [ref3]: https://wetten.overheid.nl/BWBR0010092#Artikel2.5
    url: https://wetten.overheid.nl/BWBR0010092/1993-01-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0010092
        artikel: '2.8'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005252
      - id: ref3
        bwb_id: BWBR0010092
        artikel: '2.5'
        hoofdstuk: '2'
  - number: '4.4'
    text: |-
      Als een bestuursorgaan een eenheid om informatie verzoekt moet eerst bekeken worden of dit bestuursorgaan is
      opgenomen in de relevante bijlage (zie [hoofdstuk 3][ref1] en de bijlagen 2A, 2B en 2C). Als dat het geval is,
      wordt het verzoek getoetst aan de in de bijlage opgenomen criteria.

      Als het bestuursorgaan niet is opgenomen in bijlage 2A, 2B of 2C, of indien het verzoek niet voldoet aan de in de
      bijlagen vermelde criteria, wordt het verzoek voorgelegd aan het hoofd van de eenheid. Het hoofd van de eenheid
      toetst het verzoek aan het uitgangspunt van hoofdstuk 2.2., waarbij tevens wordt beoordeeld of de gevraagde
      informatie een gegenereerd gegeven is als bedoeld in hoofdstuk 2.1.2. Indien het voorgaande geen belemmering vormt
      om aan het verzoek tegemoet te komen, vindt nog een toets plaats aan de voorwaarden genoemd in hoofdstuk 4.4.1.
      tot en met 4.4.4. De beslissing op het verzoek wordt schriftelijk medegedeeld. Een afwijzing geschiedt onder opgaaf
      van redenen.

      4.4.1 Het uitgangspunt is dat uitsluitend schriftelijke verzoeken om informatie in behandeling worden genomen. Het
      is in uitzonderingssituaties mogelijk dat een bestuursorgaan telefonisch informatie vraagt, die telefonisch moet
      worden verstrekt. Het is dan noodzakelijk dat er op de eenheid zekerheid bestaat dat de informatie daadwerkelijk
      terecht komt bij het verzoekende bestuursorgaan. Dit kan door terug te bellen naar een centraal nummer van het
      bestuursorgaan.

      Een verzoek om informatie aan een eenheid moet betrekking hebben op een specifieke aangelegenheid. In elk verzoek
      om informatie moet duidelijk aangegeven zijn welk bestuursorgaan om informatie vraagt en voor welk doel de
      informatie gebruikt zal worden. De gevraagde informatie kan in zijn algemeenheid slechts dienen voor de verificatie
      van de gegevens die bij het andere bestuursorgaan reeds bekend zijn (zie hoofdstuk 3.1.). Bovendien moet vaststaan
      dat geheimhouding van de informatie bij het informatie-ontvangende bestuursorgaan is gewaarborgd. De eenheid
      vraagt om een nadere toelichting indien deze gegevens ontbreken, dan wel niet voldoende duidelijk zijn. Het verzoek
      wordt afgewezen, met een verwijzing naar de fiscale geheimhoudingsplicht, als die nadere gegevens uitblijven of de
      toelichting onvoldoende duidelijk maakt voor welk doel de informatie wordt gevraagd.

      Het incidenteel verstrekken van informatie door de eenheid mag geen structureel karakter krijgen. Uit
      organisatorisch oogpunt wordt daar op de eenheid uitdrukkelijk voor gewaakt. Verzoeken die naar men vermoedt over
      structurele informatieverstrekking gaan worden voorgelegd aan de directeur.

      4.4.2 Het hoofd van de eenheid houdt bij de beoordeling van een verzoek rekening met het tijdsbeslag op de
      Belastingdienst. Het is van belang dat acht wordt geslagen op de omvang van de werkzaamheden die gepaard gaan met
      het verstrekken van informatie. Het verzoek om informatie mag in beginsel geen speciaal daarop gericht onderzoek
      van de Belastingdienst tot gevolg hebben. Indien het verzoek volgens het hoofd van een eenheid leidt tot een
      onevenredig groot beslag op de eenheid, legt hij het verzoek voor aan de directeur, waarna de directeur beslist of
      tot informatieverstrekking wordt overgegaan.

      4.4.3 Het hoofd van de eenheid beoordeelt bij elk verzoek eerst of het verzoekende bestuursorgaan zelf de
      informatie elders kan verkrijgen. De verzoeker zal in de eerste plaats zelf maatregelen moeten nemen om de
      benodigde informatie te verzamelen. Medewerking van de Belastingdienst komt pas aan de orde als verzoeker geen
      reële andere middelen ten dienste staan.

      4.4.4 Aan een verzoek om informatie wordt niet of slechts ten dele voldaan indien er naar het oordeel van het hoofd
      van de eenheid meer wordt gevraagd dan nodig is voor het doel waarvoor de informatie wordt gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0010092#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0010092/1993-01-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0010092
        hoofdstuk: '3'
  - number: '4.5'
    text: |-
      4.5.1 In het kader van de intracommunautaire transacties kan een ondernemer de Belastingdienst verzoeken een hem
      bekende combinatie van een OB-nummer en de n.a.w.-gegevens van een buitenlandse ondernemer te verifiëren. Ten
      behoeve van binnenlandse transacties kan aan een ondernemer informatie worden verstrekt over het ondernemerschap
      van een derde, het aanwezig zijn van een vaste inrichting in Nederland etc., mits dit voor de uitvoering van de
      belastingwet van belang is.

      4.5.2 In bepaalde gevallen kan een SoFi-nummer worden verstrekt aan een inhoudingsplichtige. Verwezen wordt naar de
      bijlagen 2B en 7.

      4.5.3 [Artikel 23 AWR][ref1] bepaalt dat degene van wie inkomens- of vermogensbestanddelen zijn begrepen in
      het voorwerp van de belasting waarop de aanslag of de voor bezwaar vatbare beschikking van een derde betrekking
      heeft, zelfstandig de mogelijkheid van bezwaar heeft. Het tweede lid bepaalt dat de inspecteur de hiervoor
      bedoelde belanghebbende desgevraagd op de hoogte moet stellen van de gegevens met betrekking tot de aanslag of de
      beschikking voor zover deze gegevens voor het maken van bezwaar redelijkerwijs van belang kunnen worden geacht.

      4.5.4 In bepaalde gevallen kan een curator in een faillissement informatie verkrijgen ten behoeve van de
      aansprakelijkstelling van bestuurders. Verwezen wordt naar artikel 36, paragraaf 1, lid 4, van de Leidraad
      Invordering.

      4.5.5 Op grond van [artikel 50, derde lid, van de Invorderingswet][ref2] moet de ontvanger de aansprakelijkgestelde
      desgevraagd op de hoogte stellen van de gegevens met betrekking tot de belastingaanslag waarvoor hij aansprakelijk
      is gesteld. Een dergelijke informatieplicht bestaat echter niet met betrekking tot gegevens die geen rechtstreeks
      verband houden met de belastingaanslag. Verwezen wordt naar artikel 49, paragraaf 2, lid 6, van de Leidraad
      Invordering.

      4.5.6 Dit voorschrift verleent geen ontheffing van de geheimhoudingsplicht voor andere gevallen dan hiervoor
      genoemd. Indien het hoofd van de eenheid, naar aanleiding van een verzoek van een particulier of rechtspersoon
      om informatie over een derde, van mening is dat er een belang is om toch over te gaan tot het verstrekken van
      informatie, legt hij het verzoek met advies ter beslissing voor aan de Directeur AFZ. Voor de behandeling van
      verzoeken waarin iemand met een beroep op de [WOB][ref3] de openbaarmaking van een document over een derde verzoekt
      wordt verwezen naar hoofdstuk 2.5.


