  - number: '1.2'
    text: |-
      [Hoofdstuk 2][ref1] bevat een algemene toelichting op de diverse regelingen die te maken hebben met de
      geheimhoudingsplicht waaronder de WPR en de [WOB][ref2]. In [hoofdstuk 3][ref3] wordt de structurele
      informatieverstrekking weergegeven. [Hoofdstuk 4][ref4] geeft regels voor de behandeling van incidentele verzoeken
      om informatieverstrekking die aan een eenheid van de Belastingdienst zijn gericht. De mogelijkheden tot het
      spontaan verstrekken van informatie worden behandeld in [hoofdstuk 5][ref5]. In [hoofdstuk 6][ref6] is een aantal
      bijzondere onderwerpen beschreven.

      In de bijlagen 2A, 2B en 2C is vermeld aan welke bestuursorganen informatie kan worden verstrekt. Bijlage 2A
      bevat de informatieverstrekking door de Douane (de Directie Douane en de Douane districten). Bijlage 2B bevat
      de informatieverstrekking door de overige directies en eenheden van de Belastingdienst. Bijlage 2C bevat de
      informatieverstrekking door de Directie ondernemingen Noord ten aanzien van het sociaal-fiscaal nummer. In de
      bijlagen is vermeld:

        - aan wie wordt verstrekt;
        - welke informatie wordt verstrekt;
        - met welk doel er wordt verstrekt;
        - op grond van welke wet er moet worden verstrekt in het geval er een wettelijke verplichting bestaat;
        - op welke wijze de verstrekking plaatsvindt (geautomatiseerd uit centrale bestanden (A) of handmatig door een
      eenheid (H));
        - of er bijzonderheden zijn.


