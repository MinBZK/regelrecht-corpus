  - number: '6.3'
    text: |-
      6.3.1 Een ieder is verplicht van de zeer ernstige misdrijven als genoemd in artikel 160 Sv aangifte te doen
      bij de politie. De belastingambtenaar is voor het doen van aangifte op grond van artikel 160 Sv ontheven van de
      geheimhoudingsplicht. Dergelijke ernstige misdrijven zijn bijvoorbeeld misdrijven tegen de staat of de koninklijke
      waardigheid, tegen het leven gericht of mensenroof of verkrachting.

      6.3.2 In de gevallen genoemd in [artikel 162, eerste lid, WvSv][ref1] bestaat voor een ambtenaar de verplichting
      om aangifte te doen bij de officier van justitie of één van zijn hulpofficieren van bepaalde misdrijven
      (ambtsmisdrijven). Dit is de zogenaamde actieve aangifteplicht. Eén van de voorbeelden van een ambtsmisdrijf
      is het aannemen van steekpenningen door een ambtenaar ([art. 362 WvSr][ref2]). Hierbij is van belang dat in het
      strafrecht ,,de ambtenaar” ruim is omschreven (zie art. 84 Sr) en ook verkozen personen daaronder worden begrepen.

      Als een ambtenaar van de Belastingdienst bij het vervullen van zijn taak het vermoeden heeft of kennis krijgt van
      een dergelijk misdrijf, legt hij de zaak, door tussenkomst van het hoofd van de eenheid, met advies voor aan het
      hoofd van de FIOD. Het hoofd van de FIOD gaat over tot het doen van aangifte als ook hij dat misdrijf vermoedt.

      6.3.3 Een ieder is, op grond van [artikel 161 van het WvSv][ref3] bevoegd, maar niet verplicht, bij de politie
      aangifte te doen van andere strafbare feiten. In het geval een ambtenaar van de Belastingdienst in de uitoefening
      van zijn functie van een strafbaar feit niet vallend onder de [artikelen 160][ref4] of [162 van het WvSv][ref5] op
      de hoogte komt, legt hij die zaak door tussenkomst van het hoofd van de eenheid voor aan:

      1. het hoofd van de FIOD , als het feit gepleegd is door een ambtenaar;

      2. de contactambtenaar in de overige gevallen.

      Het hoofd van de FIOD, respectievelijk de contactambtenaar, doet van de volgende delicten in ieder geval aangifte:

        - delicten in de vermogensrechtelijke sfeer (diefstal, oplichting, verduistering, heling e.d.) wanneer het met het
      delict gemoeide financiële belang een bedrag van ƒ 50.000,- te boven gaat.
        - delicten die een (in)directe bedreiging vormen voor de (geestelijke) volksgezondheid en die een bedrijfsmatig
      karakter hebben. Van het produceren of verhandelen van kinderporno en het bedrijfsmatig kweken van hennep of de
      handel in harddrugs wordt in alle gevallen aangifte gedaan.
        - paspoortfraude.
        - het aannemen of betalen van steekpenningen, mits er sprake is van een misdrijf in de zin van het WvSr.
        - bedreiging of mishandeling van belastingdienstambtenaren.
        - misdrijven ter zake waarvan de belastingplichtige door de Nederlandse strafrechter kan worden veroordeeld en
      waarvoor in de belastingaangifte een aftrekpost is opgevoerd, die, na een onherroepelijke veroordeling dan wel
      transactie, op grond van de aftrekbeperking genoemd in de artikelen 8a, eerste lid, onderdelen c of d, en 36,
      eerste lid, onderdelen m of n van de Wet op de inkomstenbelasting 1964, kan worden geweigerd. Dit kan bijvoorbeeld
      het geval zijn bij het bedrijfsmatig kweken van hennep.

      Ten aanzien van andere delicten beslist het hoofd van de FIOD, respectievelijk de contactambtenaar, of aangifte
      wordt gedaan. In daartoe aanleiding gevende gevallen (zie hoofdstuk 2.2.2) legt het hoofd van de FIOD c.q. de
      contactambtenaar de zaak voor aan de Directeur AFZ, alvorens aangifte te doen.

      6.3.4 Als een ambtenaar van de Belastingdienst bij het vervullen van zijn taak het vermoeden heeft of kennis krijgt
      van een mogelijke overtreding van disciplinaire en/of strafrechtelijke normen door een collega, wordt gehandeld
      conform de “Gedragslijn bij strafbare feiten begaan door ambtenaren van de Belastingdienst in functie”, beschikking
      van 10 mei 1993, nr. AFZ93/3732 (boekwerk Belastingen Algemeen nr. 18.00.10).


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel162
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel362
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel161
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel160
      [ref5]: https://wetten.overheid.nl/BWBR0001903#Artikel162
