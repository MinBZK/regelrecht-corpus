  - number: '4.6'
    text: |-
      Indien het hoofd van de eenheid informatie verstrekt aan een belastingplichtige vindt schriftelijke vastlegging
      plaats, bijvoorbeeld in het dossier van de belastingplichtige.

      Bij informatieverstrekking aan bestuursorganen vindt eveneens registratie van de verstrekte informatie plaats.
      Daarnaast worden de daarvoor gemaakte kosten geregistreerd.
    url: https://wetten.overheid.nl/BWBR0010092/1993-01-01#Artikel4.6
  - number: '4.7'
    text: |-
      Met de bestuursorganen waaraan informatie wordt verstrekt worden afspraken gemaakt over het terug melden van de
      resultaten van de informatieverstrekking.
    url: https://wetten.overheid.nl/BWBR0010092/1993-01-01#Artikel4.7
  - number: '5.1'
    text: |-
      Op grond van de WPR is het op eigen initiatief verstrekken van informatie uit een persoonsregistratie aan anderen
      dan de natuurlijk persoon op wie de informatie betrekking heeft niet toegestaan (zie hoofdstuk 2.4). Dit heeft tot
      gevolg dat de Belastingdienst vrij zelden op eigen initiatief informatie kan verstrekken, aangezien veel van de
      informatie in persoonsregistraties aanwezig is. Voor informatie die slechts in de legger of een dossier aanwezig
      is, bestaat deze mogelijkheid tot informatieverstrekking wel. Een legger of een dossier op een eenheid valt niet
      onder het begrip persoonsregistratie in de zin van de WPR. De spontaan te verstrekken informatie uit de legger mag
      echter geen informatie zijn die afkomstig is uit een persoonsregistratie en die bijvoorbeeld slechts in afschrift
      in de legger aanwezig is. Voor het vastleggen van de verstrekte informatie en het terug melden van resultaten wordt
      verwezen naar hoofdstuk 4.6 en 4.7.
    url: https://wetten.overheid.nl/BWBR0010092/1993-01-01#Artikel5.1
  - number: '5.2'
    text: |-
      De hiervoor onder hoofdstuk 5.1 genoemde beperking uit de WPR met betrekking tot informatieverstrekking uit een
      persoonsregistratie speelt bij informatieverstrekking aan belastingplichtige geen rol. De Belastingdienst kan op
      eigen initiatief zonder meer informatie over een belastingplichtige aan die belastingplichtige zelf verstrekken of
      aan zijn gemachtigde voor zover de machtiging reikt. Zo wordt het openbaar deel van het controlerapport spontaan
      aan belastingplichtige verstrekt (zie hoofdstuk 4.3.1).
    url: https://wetten.overheid.nl/BWBR0010092/1993-01-01#Artikel5.2
  - number: '5.3'
    text: |-
      Informatieverstrekking op eigen initiatief is alleen mogelijk indien deze informatieverstrekking in overeenstemming
      is met de uitgangspunten van hoofdstuk 2.2. Bovendien wordt voor spontane gegevensverstrekking zonder titel in
      enigerlei vorm in dit voorschrift geen ontheffing verleend.

      Een titel vormt het feit dat de te verstrekken informatie alsmede het bestuursorgaan waaraan de informatie
      verstrekt gaat worden, opgenomen zijn in de bijlagen 2A, 2B of 2C van het voorschrift. Ook is het mogelijk dat
      er een (aparte) ontheffing van de geheimhoudingsplicht is verleend in het kader van een convenant tussen de
      Belastingdienst en het informatieverkrijgende bestuursorgaan. (zie ook de samenwerkingsvoorschriften opgenomen in
      bijlage 6 en in Belastingen Algemeen nr. 15.70.00. en nr.15.90.00.).

      De informatie mag niet afkomstig zijn uit een persoonsregistratie (zie hoofdstuk 2.4.1 en 5.1). Een voorstel om
      spontaan informatie te verstrekken wordt ter beslissing voorgelegd aan het hoofd van een eenheid, waarbij het
      belang bij de informatieverstrekking moet worden aangegeven. Spontane informatieverstrekking blijft achterwege
      bij een te gering financieel belang. Ook moet worden voorkomen dat informatie wordt verstrekt zonder dat het
      enig effect heeft, bijvoorbeeld omdat het informatie-ontvangende bestuursorgaan niet de capaciteit heeft deze te
      verwerken of het beleidsmatig niet opportuun acht om maatregelen te nemen.
    url: https://wetten.overheid.nl/BWBR0010092/1993-01-01#Artikel5.3
  - number: '6.1'
    text: |-
      Dit hoofdstuk bevat een aantal bijzondere onderwerpen op het gebied van het strafrecht en het civiele recht. Aan
      de orde komen onder meer het afleggen van getuigenverklaringen, de aangifte van strafbare feiten en het verstrekken
      van informatie aan opsporingsdiensten. De in dit hoofdstuk genoemde [artikelen 160][ref1], [161][ref2] en
      [162 van het WvSv][ref3] zijn opgenomen in bijlage 4.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel160
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel161
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel162
