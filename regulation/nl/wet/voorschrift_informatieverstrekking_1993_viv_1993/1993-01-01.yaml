  - number: '6.2'
    text: |-
      6.2.1 Een ambtenaar die wordt opgeroepen om als getuige mededeling te doen over aangelegenheden die hem bekend
      zijn geworden bij de uitoefening van zijn werkzaamheden, moet voor de rechter verschijnen. Als hem over hetgeen hem
      wordt gevraagd geheimhouding is opgelegd, moet hij zich in een aantal gevallen met een beroep op zijn wettelijke
      plicht tot geheimhouding verschonen. Het verschoningsrecht is neergelegd in [artikel 191 van het WvBRv][ref1] en
      [artikel 218 van het WvSv][ref2]. Deze artikelen zijn opgenomen in bijlage 5.

      6.2.2 In strafzaken die enkel het gevolg zijn van overtredingen van de belastingwetgeving of een andere wet
      waarvoor ambtenaren van de Belastingdienst bevoegd zijn (zie het boekwerk Niet-Fiscale Douanevoorschriften) geldt
      dat het afleggen van een getuigenis valt onder de uitvoering van die wet. De ambtenaar kan zich niet verschonen en
      kan zonder ontheffing een getuigenverklaring afleggen.

      Bij oproeping als getuige of deskundige in een strafzaak of administratiefrechtelijke zaak die niet alleen het
      gevolg is van een overtreding van de belastingwetgeving of een andere wet waarvoor de Belastingdienst bevoegd
      is, beslist de contactambtenaar of de ambtenaar zich al dan niet moet beroepen op zijn verschoningsrecht. In het
      geval een FIOD-medewerker als getuige of deskundige wordt opgeroepen beslist het hoofd van de desbetreffende FIOD-
      vestiging.

      Opmerking verdient in dit verband dat geen beroep op het verschoningsrecht moet worden gedaan als het een zaak
      betreft waarvan ingevolge het bepaalde in hoofdstuk 6.3 aangifte is gedaan.

      6.2.3 Door de Hoge Raad is in 1991 (beschikking van 8 november 1991, NJ 1992, 277) uitgemaakt dat een ambtenaar
      van de Belastingdienst een verschoningsrecht heeft met betrekking tot alle gegevens welke onder de fiscale
      geheimhoudingsplicht vallen. In deze beschikking heeft de Hoge Raad aangegeven dat de strekking van de fiscale
      geheimhoudingsplicht tot gevolg heeft dat de woorden ,,een ander” in die fiscale geheimhoudingsbepaling zien op
      ieder ander dan degene tot wie het in dat artikel vervatte verbod zich richt. De Hoge Raad is van mening dat de
      fiscale geheimhoudingsplicht zijn rechtvaardiging vindt in het algemeen belang. Het publiek (belastingplichtigen)
      moet niet van het verstrekken van inlichtingen en bescheiden aan de Belastingdienst worden weerhouden door de vrees
      dat die gegevens voor andere doeleinden kunnen worden gebruikt dan voor een juiste en doelmatige uitvoering van de
      aan de Belastingdienst opgedragen taak. Daarnaast heeft de Hoge Raad aangegeven dat het er daarbij niet toe doet of
      een belastingplichtige om wiens gegevens het gaat toestemming heeft gegeven aan de Belastingdienst om die gegevens
      verder te verstrekken. Met andere woorden: het algemeen belang bij de fiscale geheimhouding prevaleert boven het
      individuele belang van betrokkenen.

      Uit het arrest van de Hoge Raad van 21 februari 1997 (Vakstudie Nieuws 1997, blz.1296) blijkt echter dat de
      ambtenaar van de Belastingdienst die als getuige in een civiele procedure wordt opgeroepen niet het recht heeft
      zich bij voorbaat, dus nog zonder dat hem vragen zijn gesteld, op zijn verschoningsrecht te beroepen. Hij zal
      van vraag tot vraag moeten beoordelen of hij een antwoord kan geven zonder zijn fiscale geheimhoudingsplicht te
      schenden. Uit het arrest kan worden afgeleid dat bij vragen van organisatorische aard het verschoningsrecht niet
      snel met kans op succes kan worden ingeroepen. Een vraag van organisatorische aard is bijvoorbeeld de vraag óf er
      gesprekken tussen de Belastingdienst en de belastingadviseur hebben plaatsgevonden. Overigens geeft de Hoge Raad in
      dit arrest enige voorbeelden van onderwerpen die wél onder het verschoningsrecht vallen: de inhoud van de betrokken
      belastingaanslagen, de resultaten van enig door de Belastingdienst ter zake van die aanslagen ingesteld onderzoek
      en punten van geschil tussen belastingplichtige en de Belastingdienst.

      Omdat het niet helder is op welke vragen wel en op welke vragen niet als getuige kan worden ingegaan dient elke
      in een civiele procedure als getuige opgeroepen ambtenaar van de Belastingdienst vòòraf contact op te nemen met
      de directie AFZ. Ook in de situatie dat het hoofd van een eenheid van mening is dat er een bijzonder belang is
      om geen beroep op het verschoningsrecht te doen en over te gaan tot het afleggen van een getuigenverklaring, legt
      hij de zaak voor aan AFZ. Opmerking verdient dat bij een civiele procedure in het kader van de uitvoering van
      de [Invorderingswet 1990][ref3] (bijvoorbeeld op grond van [artikel 49 Invorderingswet][ref4]) een beroep op dat
      verschoningsrecht niet aan de orde kan zijn. Voor een dergelijke procedure geldt dat er sprake is van uitvoering
      van [Invorderingswet 1990][ref5], zodat het afleggen van een getuigenverklaring valt onder de uitvoering van die
      wet.

      6.2.4 Bij een oproep om als getuige/deskundige in het buitenland te verschijnen dient contact te worden opgenomen
      met de Directie AFZ, afdeling Wederzijdse Bijstand (zie onder meer hoofdstuk 3.2.6. van het Voorschrift Wederzijdse
      Bijstand Douane). Daarin is aangegeven hoe in de verschillende voorkomende situaties moet worden gehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel191
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel218
      [ref3]: https://wetten.overheid.nl/BWBR0004770
      [ref4]: https://wetten.overheid.nl/BWBR0004770#Artikel49
      [ref5]: https://wetten.overheid.nl/BWBR0004770
