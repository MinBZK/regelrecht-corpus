  - number: '2.6'
    text: |-
      In een aantal wettelijke regelingen zijn de ambtenaren van de douane aangewezen als controle- en/of
      opsporingsambtenaar. Deze regelingen zijn onder meer opgenomen in het boekwerk Niet-Fiscale Douanevoorschriften.
      Bij toepassing van deze regelingen komt het voor dat de douane informatie verkrijgt die van belang is voor
      andere bestuursorganen die eveneens met de uitvoering van de desbetreffende regeling zijn belast. Voor zover deze
      informatie van belang is voor de juiste uitvoering van de regeling zijn de ambtenaren ontheven van hun fiscale
      geheimhoudingsverplichting en kan de informatie worden doorgegeven.

      Over de vraag of informatie valt binnen het kader van de bovengenoemde regelingen beslist het hoofd van het
      douane district. Een belangenafweging als bedoeld in hoofdstuk 2.1.3. behoeft hij daarbij niet meer te maken.
      Gelet op het karakter van de informatieverstrekking is het afsluiten van convenanten met betrekking tot de
      informatieverstrekking niet noodzakelijk.

      Wel moet rekening gehouden worden met een mogelijke geheimhoudings-bepaling in de betreffende wettelijke regeling
      zelf. In een aantal voorschriften in het boekwerk Niet-Fiscale Douanevoorschriften is nadere uitleg gegeven over de
      geheimhoudingsbepalingen van de daarin opgenomen wettelijke regelingen.
    url: https://wetten.overheid.nl/BWBR0010092/1993-01-01#Artikel2.6
  - number: '2.7'
    text: |-
      Gelet op het uitgangspunt dat slechts één dienst de controle op goederen aan de buitengrens verricht is binnen de
      douane de één-loket-gedachte reeds ver ontwikkeld (vgl. het ATAN-platform op Schiphol). Daartoe vindt intensieve
      gegevensuitwisseling plaats met de andere betrokken bestuursorganen ter zake van binnenkomende goederen. Voor zover
      nodig is de douane voor deze gegevensuitwisseling van de geheimhoudingsplicht ontheven.
    url: https://wetten.overheid.nl/BWBR0010092/1993-01-01#Artikel2.7
  - number: '2.8'
    text: |-
      De [Wet op de identificatieplicht][ref1] heeft tot gevolg dat een ieder die zijn SoFi- nummer bij de
      Belastingdienst komt vragen, zich eerst moet identificeren met bijvoorbeeld een geldig paspoort of een
      verblijfsvergunning voor vreemdelingen (zie [artikel 47b AWR][ref2]). De regels en werkwijzen met betrekking tot de
      SoFi-nummers en de verstrekking daarvan zijn opgenomen in het Handboek Klantenadministratie, werkstromen.


      [ref1]: https://wetten.overheid.nl/BWBR0006297
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel47b
