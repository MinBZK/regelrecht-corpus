        bwb_id: BWBR0010092
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0010092
        hoofdstuk: '4'
  - number: '2.5'
    text: |-
      De [WOB][ref1] regelt hoe de overheid bij de uitvoering van haar taak openheid en openbaarheid van bestuur
      betracht. De [WOB][ref2] geeft aanwijzingen over informatieverstrekking op verzoek en informatieverstrekking
      uit eigen beweging. Er behoeft alleen informatie te worden verstrekt die is vastgelegd in documenten. Onder een
      document wordt verstaan een schriftelijk stuk of ander materiaal dat gegevens bevat (met andere woorden: andere
      gegevensdragers).

      De fiscale geheimhoudingsbepalingen zijn aan te merken als lex specialis ten opzichte van de [WOB][ref3]. Volgens
      vaste jurisprudentie van de Afdeling bestuursrechtspraak van de Raad van State dient echter een bestuursorgaan
      de mogelijkheid tot het verlenen van ontheffing van de fiscale geheimhoudingsplicht te toetsen aan de
      uitzonderingsgronden en de beperkingen van de [WOB][ref4].

      Op basis van de [WOB][ref5] heeft een belastingplichtige in beginsel recht op openbaarmaking van op hem betrekking
      hebbende informatie die is neergelegd in een document, tenzij één van de hierna genoemde uitzonderingsgronden of
      beperkingen van toepassing is.

      Verzoeken van derden over individuele belastingplichtigen worden altijd afgewezen met een beroep op de fiscale
      geheimhoudingsplicht.

      Omdat het mogelijk is om ontheffing van de geheimhoudingsplicht te verlenen zal het beroep op de
      geheimhoudingsplicht altijd mede moeten worden gemotiveerd met de uitzonderingsgronden en beperkingen van de
      [WOB][ref6]. Voor fiscale zaken zijn vooral de absolute uitzonderingsgrond van artikel 10, eerste lid, onderdeel c
      (bedrijfs- en fabricagegegevens die door natuurlijke personen en rechtspersonen vertrouwelijk aan de overheid zijn
      medegedeeld), en de relatieve uitzonderingsgronden van artikel 10, tweede lid, onderdelen b, d, e en g van belang.

      De relatieve uitzonderingsgronden betreffen de met de geheimhouding gemoeide belangen van inspectie, controle
      of toezicht, de eerbiediging van de persoonlijke levenssfeer, het voorkomen van onevenredige bevoordeling of
      benadeling van bij de aangelegenheid betrokken natuurlijke personen of rechtspersonen dan wel van derden en de met
      die belangen verbonden economische of financiële belangen van de Staat.

      Indien aan het verzoek van een belastingplichtige tegemoet wordt gekomen wordt hem op grond van
      [artikel 7 van de WOB][ref7] een kopie verstrekt van het document waarin informatie over hem is opgenomen of wordt
      hem op een andere wijze toegestaan van de inhoud daarvan kennis te nemen.

      Op een verzoek om informatie op grond van de WOB moet binnen twee weken worden beslist (zie [artikel 6 WOB][ref8]).
      In een bijzonder geval kan die termijn, mits gemotiveerd, met ten hoogste twee weken worden verlengd. De
      behandeling van een WOB-verzoek is vrijwel geheel gemandateerd aan de hoofden van de eenheden (zie de Regeling van
      21 december 1993, WJB93/1579, Stcrt. 1993/247 en de besluiten van 4 januari 1994, nr. AFZ94/65 en van 1 juni 1994,
      nr AFZ94/2984).


      [ref1]: https://wetten.overheid.nl/BWBR0005252
      [ref2]: https://wetten.overheid.nl/BWBR0005252
      [ref3]: https://wetten.overheid.nl/BWBR0005252
      [ref4]: https://wetten.overheid.nl/BWBR0005252
      [ref5]: https://wetten.overheid.nl/BWBR0005252
      [ref6]: https://wetten.overheid.nl/BWBR0005252
      [ref7]: https://wetten.overheid.nl/BWBR0005252#Artikel7
      [ref8]: https://wetten.overheid.nl/BWBR0005252#Artikel6
