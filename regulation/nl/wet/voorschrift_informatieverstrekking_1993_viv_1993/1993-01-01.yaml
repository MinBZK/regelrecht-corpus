  - number: '2.1'
    text: |-
      2.1.1 De fiscale geheimhouding is in de wet vastgelegd. De belastingplichtige moet erop kunnen vertrouwen dat van
      de door hem verstrekte informatie geen ander gebruik wordt gemaakt dan voor het uitvoeren van de belastingwetgeving
      door de Belastingdienst. Het werk van de Belastingdienst zou ernstig worden bemoeilijkt als een belastingplichtige
        - uit vrees dat zijn informatie bij derden terecht kan komen - informatie achterhoudt die voor de Belastingdienst
      juist van belang is. De Belastingdienst beschikt over veel, ook gevoelige informatie, bijvoorbeeld informatie over
      de bedrijfsvoering van ondernemingen. Het bekend worden van deze informatie zou kunnen leiden tot verstoringen van
      de concurrentieverhoudingen. Ook in de particuliere sfeer kan de bij de Belastingdienst bekende informatie gevoelig
      zijn. Te denken valt aan echtscheidings- en alimentatiezaken.

      Alle beschikbare informatie over een belastingplichtige valt onder de geheimhoudingsplicht tenzij het gaat om
      informatie die nodig is voor de uitvoering van de belastingwetgeving. (Zie Hoge Raad 8 november 1991, NJ 1992,
      277).

      2.1.2 De Belastingdienst heeft veel gegevens over belastingplichtigen. De gegevens waarover de Belastingdienst
      beschikt zijn te onderscheiden in gegevens die de Belastingdienst van anderen heeft verkregen en gegevens die de
      Belastingdienst zelf heeft gevormd.

      De Belastingdienst verzamelt gegevens ten dienste van een bepaald en vastomlijnd doel, namelijk de heffing en
      inning van belastingen. De Belastingdienst gebruikt de van derden verkregen gegevens uitsluitend voor dat doel (de
      zogenaamde doelbinding).

      De Belastingdienst verwerkt gegevens en genereert daarmee informatie. De daardoor verkregen informatie kan
      de Belastingdienst als daartoe een wettelijke verplichting bestaat of met gebruikmaking van de mogelijkheid
      tot ontheffing van de fiscale geheimhoudingsplicht, verder verstrekken dan nodig is voor de heffing of
      invordering van belastingen. Een voorbeeld: de Belastingdienst verwerkt de van de banken in het kader van de
      informatieverplichtingen verkregen gegevens. De daaruit voortgekomen informatie kan de Belastingdienst met
      ontheffing verder verstrekken, indien het onderhavige Voorschrift verstrekking mogelijk maakt. Van derden verkregen
      gegevens die de Belastingdienst niet heeft verwerkt kunnen niet aan anderen worden verstrekt. Dit is bijvoorbeeld
      het geval met de van derden verkregen bankrekeningnummers.

      De doelbinding moet ook gelden voor de bestuursorganen, waaraan de Belastingdienst gegevens verstrekt. De
      Belastingdienst stelt daarom bij informatieverstrekking de voorwaarde dat de bestuursorganen de door de
      Belastingdienst verstrekte gegevens uitsluitend gebruiken ten behoeve van de doeleinden met het oog waarop de
      Belastingdienst de gegevens heeft verstrekt. Tevens stelt de Belastingdienst de voorwaarde dat de bestuursorganen
      de verkregen gegevens niet verder verstrekken.

      2.1.3 De Belastingdienst zal voorafgaand aan de informatieverstrekking (zie hoofdstuk 2.2) onder meer de volgende
      belangen af dienen te wegen:

        - het belang van een effectieve fraudebestrijding en/of een effectieve uitoefening van de aan het ontvangende
      bestuursorgaan opgedragen taken;
        - het belang van de bescherming van de persoonlijke levenssfeer van de burger dan wel het belang van de bescherming
      van bedrijfsgegevens;
        - de belangen die de Belastingdienst heeft bij naleving van de geheimhoudingsplicht (zie hoofdstuk 2.1.1.);
        - de inspanningen die de Belastingdienst zich met informatieverstrekking moet getroosten zowel qua hoeveelheid als
      qua soort gegeven;
        - de bijdrage die de aan het ontvangende bestuursorgaan verstrekte gegevens kunnen leveren aan een effectieve
      fraudebestrijding.

      Indien uit de bijlagen 2A, 2B en 2C blijkt dat er voor de gegevensverstrekking geen wettelijke basis is dan zijn
      ernaar aanleiding van een ontheffing van de geheimhoudingsplicht, tussen de Belastingdienst en het desbetreffende
      bestuursorgaan afspraken gemaakt over informatie-uitwisseling. In dat geval heeft de belangenafweging al
      plaatsgevonden en hoeft niet ten aanzien van ieder individueel verzoek alsnog een belangenafweging plaats te
      vinden.

      Indien er een wettelijke verplichting tot informatieverstrekking bestaat, maar de wettelijke bepaling de ruimte
      biedt voor een belangenafweging, zal de belangenafweging moeten plaatsvinden. Informatieverstrekking zal in deze
      situatie echter slechts in uitzonderlijke gevallen kunnen worden geweigerd (bijvoorbeeld als het doel waarvoor de
      gegevens worden gevraagd in wanverhouding staat tot de inspanningen die de Belastingdienst voor de verstrekking
      moet verrichten). De beslissing om, ondanks een wettelijke verplichting, geen informatie te verstrekken dient
      vooraf te worden voorgelegd aan de Directeur AFZ.

      2.1.4 Het verstrekken van informatie binnen de Belastingdienst is altijd mogelijk voor zover de informatie nodig is
      voor de uitvoering van de belastingwetgeving. Om deze reden kan bijvoorbeeld informatie over een belastingplichtige
      die op een eenheid Ondernemingen bekend is, worden doorgegeven aan een Douane district indien die informatie
      daar nodig is voor de uitvoering van de belastingwetgeving. De Belastingdienst mag informatie van de ene
      belastingplichtige gebruiken voor de heffing en invordering bij een andere belastingplichtige. Het hoofd van de
      eenheid autoriseert zijn medewerkers voor het gebruik van informatie uit op geautomatiseerde wijze toegankelijke
      gegevensverzamelingen. Ook autoriseert hij - indien dit nodig is voor de duur van een specifiek onderzoek -
      medewerkers van andere eenheden ten behoeve van een dergelijk informatiegebruik. Indien deze laatste vorm van
      informatieverstrekking een structureel karakter heeft wordt dit vastgelegd. Verwezen wordt naar het Handboek
      Informatiebeveiliging en de reglementen ter bescherming van de persoonlijke levenssfeer.
    url: https://wetten.overheid.nl/BWBR0010092/1993-01-01#Artikel2.1
  - number: '2.2'
    text: |-
      De Belastingdienst verstrekt, met inachtneming van het bepaalde in hoofdstuk 2.1.3., informatie aan
      bestuursorganen:

      a) indien een algemeen verbindend voorschrift tot gegevensverstrekking verplicht (zie hoofdstuk 2.2.1.);

      b) indien de informatieverstrekking bij kan dragen aan het handhaven van overheidsregelingen of aan de bestrijding
      of de voorkoming van misbruik of oneigenlijk gebruik van overheidsregelingen. De Douane verstrekt tevens informatie
      in gevallen waarin sprake is van onregelmatigheden op het gebied van de openbare orde, veiligheid, volksgezondheid
      en milieu-hygiëne, als ook wanneer economische belangen van de staat gevaar kunnen lopen;

      c) in andere gevallen waarin naar het oordeel van de Staatssecretaris van Financiën bij afweging van het belang dat
      met informatieverstrekking wordt gediend, tegen het belang van fiscale geheimhouding, aan het eerstgenoemde belang
      groter gewicht moet worden toegekend. In het geval sub a is ontheffing van de geheimhoudingsplicht niet nodig.

      In het geval sub b dient wel ontheffing te worden verleend (zie hoofdstuk 2.2.2.). De geheimhoudingsplicht belet
      niet dat de Belastingdienst informatie verstrekt indien dit noodzakelijk is voor het uitvoeren van de belastingwet.
      In een dergelijk geval is ontheffing van de geheimhoudingsplicht dus ook niet nodig (zie hoofdstuk 2.2.3.). De
      regels voor het verstrekken van informatie aan opsporingsinstanties zijn in [hoofdstuk 6][ref1] opgenomen.

      2.2.1 In verschillende wetten zijn bepalingen opgenomen die de Belastingdienst opdragen om informatie te
      verstrekken. In deze gevallen behoeft geen ontheffing van de geheimhoudingsplicht te worden verleend. Wel zal
      moeten worden getoetst of het beroep op de wettelijke verplichting terecht is en, indien de wettelijke bepaling
      daartoe ruimte biedt, een belangenafweging moeten plaatsvinden (zie hoofdstuk 2.1.3.). Bestuursorganen waaraan
      structureel informatie wordt verstrekt op grond van een wettelijke verplichting zijn opgenomen in de bijlagen 2A,
      2B en 2C (zie de hoofdstukken 3.1. en 4.2.).

      2.2.2 De Belastingdienst ontvangt veel verzoeken om informatie te verstrekken. De wet biedt de Staatssecretaris
      de mogelijkheid om ontheffing van de geheimhoudingsplicht te verlenen zodat informatie kan worden verstrekt. Het
      voorschrift geeft aan in welke gevallen een dergelijke ontheffing is verleend. Het voorschrift geeft verder regels
      met betrekking tot informatieverstrekking en delegeert de beslissing in een aantal gevallen aan de Belastingdienst.
      Op verzoeken om informatieverstrekking beslist:

        - het hoofd van een eenheid indien het verzoek een incidenteel geval van informatieverstrekking betreft;
        - de Directeur-Generaal der Belastingen op voorstel van de directeur indien het verzoek een structurele vorm van
      informatieverstrekking betreft;
        - de Directeur-Generaal der Belastingen indien het verzoek a. een politiek gevoelige zaak betreft (landelijk of
      regionaal); b. betrekking heeft op een (wetenschappelijk) onderzoek; c. niet op grond van dit voorschrift kan
      worden behandeld.

      2.2.3 In een fiscale procedure moet de van belang zijnde informatie worden verstrekt aan de belastingrechter; de
      behandeling van een ingesteld beroep valt onder het uitvoeren van de belastingwetgeving.

      Daarnaast zal het, ingeval een aanslag (mede) is gebaseerd op informatie afkomstig van derden (bijvoorbeeld een
      renseignement), in bepaalde gevallen noodzakelijk zijn de bron van deze gegevens bekend te maken ter onderbouwing
      van de aanslag. Belastingplichtige kan deze gegevens verlangen ten einde zich gemotiveerd tegen de aanslag te
      kunnen verweren. Indien deze gegevens worden verstrekt is er sprake van informatieverstrekking die nodig is voor
      het uitvoeren van de belastingwet, zodat geen ontheffing nodig is.

      Overigens geldt de fiscale geheimhoudingsplicht onverkort voor derden aan wie voor de uitvoering van de
      belastingwetgeving informatie wordt verstrekt. Dit geldt bijvoorbeeld voor een inhoudingsplichtige die in het
      kader van de uitvoering van de belastingwet informatie verkrijgt (bijvoorbeeld het sociaal-fiscaal nummer van zijn
      werknemers).


      [ref1]: https://wetten.overheid.nl/BWBR0010092#Hoofdstuk6
