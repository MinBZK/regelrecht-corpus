  - number: '6.4'
    text: |-
      6.4.1 Op grond van het tweede lid van [artikel 162 van het WvSv][ref1] moeten aan de officier van justitie
      desgevraagd inlichtingen worden verstrekt omtrent strafbare feiten met de opsporing waarvan ambtenaren van de
      Belastingdienst niet zijn belast maar waarvan zij bij de uitvoering van hun werkzaamheden kennis hebben genomen.
      Dit is de zogenaamde passieve informatieplicht. De hoofden van de eenheden en van de vestigingen van de FIOD
      kunnen in dit kader op schriftelijk verzoek van de officier van justitie bij hen beschikbare informatie verstrekken
      voor zover deze van belang is voor de opsporing en/of vervolging van een strafbaar feit. Ten overvloede wordt
      in dit kader opgemerkt dat informatie omtrent strafbare feiten waarvoor de ambtenaar van de Belastingdienst wél
      opsporingsbevoegdheid bezit zonder meer aan de officier van justitie kan worden verstrekt.

      6.4.2 Een rechter-commissaris kan in geval van verdenking van bepaalde strafbare feiten (geldboete vijfde
      categorie) een strafrechtelijk financieel onderzoek (SFO) instellen. Dit gebeurt naar aanleiding van een met
      redenen omklede vordering van de officier van justitie, bij machtiging. Ten behoeve van een SFO kan op basis van
      [artikel 126a WvSv][ref2] bepaalde informatie aan de Belastingdienst worden gevraagd. Het hoofd van een eenheid
      respectievelijk de FIOD-vestiging kan in dit kader op schriftelijk verzoek van de officier van justitie aan de met
      het SFO belaste opsporingsambtenaar informatie verstrekken, mits deze een afschrift van de machtiging SFO toont.
      Om in het kader van de ontnemingswetgeving tot een goede afstemming te komen tussen de officier van justitie en de
      Belastingdienst is het nodig dat de officier van justitie in een zo vroeg mogelijk stadium in contact treedt met
      de Belastingdienst. In overeenstemming met het Besluit van 1 december 1997, nr. AFZ97/2041M, neemt de officier van
      justitie in zaken met beduidende maatschappelijke impact contact op met de Directeur AFZ. In andere gevallen zal
      de officier van justitie zich wenden tot de fraudecoördinator van de desbetreffende eenheid. In overleg tussen de
      officier van justitie en de (plv) Directeur AFZ respectievelijk de fraudecoördinator wordt bezien of het fiscale
      traject, het strafrechtelijke traject dan wel een combinatie van beide trajecten wordt gekozen voor de afroming
      van de criminele winsten. De (plv)Directeur AFZ en de fraudecoördinator zijn ten behoeve van dit overleg van de
      geheimhoudingsplicht ontheven.

      6.4.3 Het hoofd van de eenheid verstrekt desgevraagd aan de medewerker van de Belastingdienst/FIOD, die werkzaam is
      bij de Centrale Recherche Informatiedienst (CRI), informatie, welke van belang kan zijn in het kader van zogenaamde
      verdachte financiële transacties en in het kader van meldingen van buitenlandse meldpunten. Verder verstrekt het
      hoofd van de eenheid desgevraagd aan de medewerker van de Belastingdienst/FIOD in het kader van een strafrechtelijk
      onderzoek de informatie welke nodig is voor de beantwoording van informatieverzoeken van Interpol en buitenlandse
      liaisons.

      Het hoofd van de eenheid verstrekt desgevraagd aan de medewerker van de Belastingdienst die gedetacheerd is
      bij het Meldpunt Ongebruikelijke Transacties (M.O.T.) informatie die het M.O.T. nodig heeft om ten aanzien van
      gemelde ongebruikelijke transacties te kunnen beoordelen of er sprake is van een verdachte transactie. Voor deze
      informatieverstrekking is hij van zijn geheimhoudingsplicht ontheven. De waarborgen bij deze informatieverstrekking
      zijn vastgelegd in het samenwerkingsconvenant Belastingdienst-MOT.

      6.4.4 Het hoofd van de eenheid verstrekt op schriftelijk verzoek, met inachtneming van het bepaalde in hoofdstuk
      2.1.3. aan de opsporingsambtenaren van de Gemeentelijke Sociale Diensten, van de erkende uitvoeringsinstellingen
      sociale verzekeringen en van de Dienst recherche zaken van VROM de informatie die van belang kan zijn in het kader
      van de handhaving van respectievelijk de Algemene bijstandswet, de Organisatiewet sociale verzekeringen, de Wet
      individuele huursubsidie en de diverse beschikkingen in verband met bijdragen voorde eigen woning.

      Indien informatie is verstrekt, vindt schriftelijke vastlegging plaats, bijvoorbeeld in de legger van de betrokken
      belastingplichtige. Het hoofd van de FIOD wordt van de verstrekking in kennis gesteld.

      6.4.5 Voor informatieverstrekking aan opsporingsinstanties in andere gevallen dan genoemd in hoofdstuk 6.4.1.,
      6.4.2., 6.4.3. en 6.4.4. verleent dit voorschrift geen ontheffing. Indien het hoofd van de eenheid respectievelijk
      de FIOD-vestiging van mening is dat er een maatschappelijk belang is om toch tot informatieverstrekking over te
      gaan legt hij de zaak met advies voor aan het hoofd van de FIOD. Dit geldt ook voor verzoeken om informatie door
      een medewerker van de Binnenlandse Veiligheidsdienst. Verzoeken om informatieverstrekking voor vooronderzoeken
      gericht op segmenten van de samenleving, waarbij nog geen vermoeden bestaat van aanwijsbare strafbare
      feiten (een verkennend strafrechtelijk onderzoek) worden altijd voorgelegd aan de Directeur AFZ. Indien tot
      informatieverstrekking wordt besloten, is degene die over de informatie beschikt van zijn geheimhoudingsplicht
      ontheven.

      6.4.6 Indien informatie is verstrekt vindt schriftelijke vastlegging plaats, bijvoorbeeld in de legger van de
      betrokken belastingplichtige.


