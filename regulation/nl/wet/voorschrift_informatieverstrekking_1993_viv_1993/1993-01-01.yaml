  - number: '6.5'
    text: |-
      De Belastingdienst werkt samen met andere instanties met een publiekrechtelijke taak. De samenwerking moet
      bijdragen aan de vervulling van (één van) de kerntaken van de Belastingdienst: de heffing en de invordering van
      belastingen (in ruime zin), de controle en het toezicht op fiscale en douane-verplichtingen, de opsporing van
      fiscale en douanedelicten en de in niet-fiscale wetgeving aan de Belastingdienst opgedragen taken.

      Het kader, waarbinnen de samenwerking met andere instanties plaatsvindt, is vastgesteld in afzonderlijke
      voorschriften (opgenomen in bijlage 6 en in Belastingen Algemeen nr. 15.70.00. en nr. 15.90.00.). In deze
      voorschriften wordt onder meer bepaald dat aan elke vorm van samenwerking met andere instanties een convenant
      ten grondslag ligt. In een dergelijk convenant moet met betrekking tot de verstrekking van informatie door de
      Belastingdienst en het gebruik van informatie het volgende worden geregeld:

      a. de Belastingdienst verstrekt aan het samenwerkingsverband de in het convenantgespecificeerde informatie. Deze
      in het convenant gespecificeerde informatie omvat niet meer dan de informatie die op grond van het onderhavige
      voorschrift aan elk van de in het samenwerkingsverbanddeelnemende instanties op verzoek zou worden verstrekt;

      b. de medewerkers van de Belastingdienst, die in het samenwerkingsverband werkzaam zijn, vorderen ten behoeve van
      het samenwerkingsverband van belasting-, inhoudings- en administratieplichtigen geen andere gegevens dan die, welke
      de Belastingdienst op grond van het gestelde sub a aan het samenwerkingsverband verstrekt;

      c. het beheer en de beveiliging van door het samenwerkingsverband opgebouwde informatieverzamelingen dienen te
      voldoen aan de dienaangaande binnen de Belastingdienst geldende normen;

      d. het samenwerkingsverband maakt informatie nopens een persoon of zaken van personen of lichamen niet verder
      bekend dan noodzakelijk is ter bereiking van de doelstelling van het samenwerkingsverband;

      e. de door het samenwerkingsverband opgebouwde informatieverzamelingen worden bij beëindiging van de samenwerking
      overgedragen aan één van de in het samenwerkingsverband deelnemende instanties. Deze instantie draagt ervoor zorg
      dat de informatie na beëindiging van het samenwerkingsverband niet voor een ander doel wordt gebruikt dan het doel,
      waarvoor de informatieverzamelingen zijn aangelegd.

      In de eerder genoemde voorschriften inzake de samenwerking met andere instanties wordt tevens bepaald
      dat samenwerkingsconvenanten steeds ter goedkeuring worden voorgelegd aan het naast hogere niveau in de
      Belastingdienst.
