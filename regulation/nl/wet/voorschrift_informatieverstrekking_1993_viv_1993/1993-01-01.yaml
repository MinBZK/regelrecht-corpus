  - number: '1.1'
    text: |-
      Het Voorschrift Informatieverstrekking geeft regels over het verstrekken van informatie door de Belastingdienst.
      Het gaat om informatie welke een onderdeel of een ambtenaar van de Belastingdienst bekend is geworden bij de
      uitvoering van de belastingwetgeving. Deze informatie moet geheim gehouden worden behalve indien deze informatie
      nodig is voor het uitvoeren van de belastingwetgeving door andere onderdelen van de Belastingdienst. Hieruit
      volgt dat de geheimhoudingsplicht niet alleen geldt tegenover personen of instanties buiten de Belastingdienst,
      maar ook tussen ambtenaren van de Belastingdienst onderling, voor zover het verstrekken van informatie niet van
      belang is voor de uitvoering van de belastingwetgeving. De van belang zijnde artikelen uit de fiscale wetten
      zijn [artikel 67 AWR][ref1], [artikel 67 Invorderingswet 1990][ref2] en [artikel 10 Registratiewet][ref3].
      In deze artikelen is aan de Minister de mogelijkheid gegeven tot het verlenen van ontheffing van de
      geheimhoudingsplicht. De Staatssecretaris oefent deze bevoegdheid uit. Het onderhavige voorschrift gaat zowel in
      op de geheimhoudingsplicht als op de mogelijkheid van ontheffing van de geheimhoudingsplicht. De teksten van deze
      artikelen zijn opgenomen in bijlage 1.

      Ook zijn de bepalingen over geheimhouding in [artikel 2:5 van de Algemene wet bestuursrecht][ref4],
      de personeelsvoorschriften van de Belastingdienst en de strafbepaling in het
      [Wetboek van Strafrecht (artikel 272)][ref5] over schending van geheimen van belang voor de ambtenaren van de
      Belastingdienst.


