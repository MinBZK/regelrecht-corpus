  - number: '6.6'
    text: |-
      De artikelen 30 tot en met 34 van het WvSv regelen de rechten van de verdachte met betrekking tot het
      kennis nemen van de processtukken. In dat verband heeft ook de verdachte in fiscale zaken (zie bijvoorbeeld
      [artikel 31 WvSv][ref1]) of zijn raadsman recht op kennisneming van het proces-verbaal van zijn verhoor. De
      verdachte kan niet alleen processtukken inzien maar kan er ook aantekeningen over maken. Kopieën van een proces-
      verbaal worden op aanvraag zo spoedig als dit mogelijk is verstrekt. Deze worden dan tegen ontvangstbevestiging
      afgegeven of aangetekend verzonden. Een verzoek aan de Belastingdienst om inzage in een proces-verbaal wordt,
      behoudens in het geval dat het procesverbaal is opgemaakt door de FIOD, ter beoordeling voorgelegd aan de
      contactambtenaar die beslist of er inzage kan worden verleend. Indien het proces-verbaal is opgemaakt door de FIOD
      wordt het verzoek overgedragen aan het hoofd van de FIOD-vestiging. In zaken waarbij de officier van justitie het
      onderzoek leidt of waarbij het proces-verbaal aan hem is ingezonden bepaalt deze of inzage wordt verleend. Is dit
      het geval, dan draagt de contactambtenaar respectievelijk het hoofd van de FIOD-vestiging het verzoek onmiddellijk
      over aan die officier van justitie.

      Indien een proces-verbaal niet wordt ingezonden aan het Openbaar Ministerie, maar wel mede de grondslag voor de
      motivering van een op te leggen bestuurlijke boete vormt, stelt de Belastingdienst belastingplichtige op zijn
      verzoek in kennis van de onderdelen uit het proces-verbaal die van belang zijn voor die bestuurlijke boete. Het
      proces-verbaal wordt dan geanonimiseerd voor wat betreft gegevens van derden. De contactambtenaar wordt betrokken
      bij zo’n verzoek omdat hij op de hoogte is van de stand van zaken met betrekking tot de afdoening van het proces-
      verbaal.


