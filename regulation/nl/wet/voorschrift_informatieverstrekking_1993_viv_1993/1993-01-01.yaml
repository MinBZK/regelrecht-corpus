      Het voorbereiden van aanpassingen van het voorschrift is opgedragen aan:

      a) De Directeur ondernemingen Zuid voor wat betreft de inhoud van het voorschrift, exclusief de bijlagen 2A, 2B
      en 2C;

      b) De Directeur ondernemingen Noord voor wat betreft bijlage 2C;

      c) De Directeur particulieren voor wat betreft de bijlage 2B;

      d) De Directeur douane voor wat betreft de bijlage 2A.
