  - number: '1.4'
    text: |-
      *Directeur:* het hoofd van de directie waaronder de eenheid ressorteert.

      *Hoofd van een eenheid:* de ambtenaar die als zodanig is aangeduid in de Uitvoeringsregeling Belastingdienst. Onder
      hoofd van een eenheid wordt tevens het hoofd van een Douane district verstaan.

      *Contactambtenaar:* de ambtenaar als bedoeld in artikel 84 AWR.

      *Bestuursorgaan:*

      a) een orgaan van een rechtspersoon die krachtens publiekrecht is ingesteld, of

      b) een ander persoon of college, met enig openbaar gezag bekleed. ([art. 1:1, eerste lid, van de Awb][ref1])

      *Belastingplichtige:* de persoon die of het lichaam dat belastingplichtige, inhoudingsplichtige of
      belastingschuldige op grond van de belastingwetgeving is. Tevens wordt onder belastingplichtige verstaan: de
      vertegenwoordiger, de curator, de bewindvoerder, de erfgenaam en de persoon aan wie of het lichaam waaraan in de
      wettelijke bepalingen van de DW een verplichting is opgelegd.

      Onder het begrip ,,uitvoeren van de belastingwetgeving” wordt in dit voorschrift eveneens verstaan het uitvoeren
      van wettelijke bepalingen in de zin van de DW.


