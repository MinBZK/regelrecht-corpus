  - number: '2.3'
    text: |-
      In internationaal verband zijn er verdragen en andere regelingen die verplichten tot het verstrekken van informatie
      aan andere landen. Teneinde het buitenland informatie te kunnen verstrekken behoeft geen ontheffing van de
      geheimhoudingsplicht te worden verleend. Aangezien de uitvoering van het internationale inlichtingenverkeer is
      opgedragen aan de zogeheten bevoegde autoriteit of een door hem aangewezen instantie neemt de Belastingdienst niet
      zelf contact op met de buitenlandse autoriteit, maar zendt de informatie aan één van de volgende instanties:

        - de Belastingdienst/FIOD/Centrale vestiging informatie voor wat betreft de heffing en invordering op het gebied
      van de directe belastingen en de BTW;
        - de Centrale Eenheid Deventer als het gaat om BTW gegevens betreffende intracommunautaire transacties in het kader
      van de [Verordening 218/92](31992R0218) EG;
        - het Douane Informatie Centrum Rotterdam als het douane- en accijnsgegevens betreft;
        - het Douane district Arnhem voor de bijstand bij de douane-invordering en de invordering van accijnzen.

      Deze instanties treden op namens de bevoegde autoriteit en zijn belast met de coördinatie van de
      inlichtingenverstrekking. Ten aanzien van informatie die in het kader van verdragen en andere regelingen uit het
      buitenland is verkregen geldt de geheimhoudingsplicht. In het algemeen zullen de gegevens slechts mogen worden
      gebruikt voor de heffing en/of invordering van de belastingen die in het betreffende verdrag of de van belang
      zijnde regeling zijn genoemd. Vragen over het gebruik van ,,buitenlandse” gegevens voor andere doeleinden, en
      vragen betreffende de openbaarmaking van de gegevens aan belastingplichtige kunnen worden voorgelegd aan de
      hierboven genoemde eenheden van de Belastingdienst.
    url: https://wetten.overheid.nl/BWBR0010092/1993-01-01#Artikel2.3
  - number: '2.4'
    text: |-
      2.4.1 Veel informatie over natuurlijke personen is bij de Belastingdienst opgeslagen in persoonsregistraties. Een
      persoonsregistratie in de zin van de WPR is een samenhangende verzameling van op verschillende personen betrekking
      hebbende gegevens die langs geautomatiseerde weg wordt gevoerd of, met het oog op een doeltreffende raadpleging van
      die gegevens, systematisch is aangelegd. De persoonsgegevens die zijn opgenomen in de geautomatiseerde bestanden
      van de Belastingdienst vallen onder het begrip persoonsregistratie. Voor alle informatie die over natuurlijke
      personen is opgenomen in een persoonsregistratie geldt, naast de fiscale geheimhoudingsplicht, de WPR. De WPR
      regelt wanneer en onder welke voorwaarden gegevens uit een persoonsregistratie gebruikt kunnen worden en wanneer
      deze aan derden mogen worden verstrekt.

      Een legger- of dossierverzameling bij de Belastingdienst wordt niet beschouwd als een persoonsregistratie. Dat
      betekent dat de informatie die daarin is opgenomen niet onder de werking van de WPR valt. Is deze informatie
      oorspronkelijk afkomstig uit een persoonsregistratie dan geldt de WPR wel. Hierbij valt te denken aan een uitdraai
      uit een geautomatiseerde administratie in de legger.

      De Belastingdienst moet op grond van de WPR elke verstrekking van informatie vastleggen. Volgens de WPR dient aan
      het verstrekken van informatie een verzoek ten grondslag te liggen; het spontaan verstrekken van informatie uit
      een persoonsregistratie is niet toegestaan. Als informatie niet afkomstig is uit een persoonsregistratie en daarmee
      niet onder de werking van de WPR valt, is spontane verstrekking in beginsel wel mogelijk. Het op initiatief van de
      Belastingdienst verstrekken van informatie komt in [hoofdstuk 5][ref1] aan de orde.

      2.4.2 Op grond van de WPR bestaat voor de Belastingdienst de verplichting om voor elke persoonsregistratie een
      reglement op te stellen. Deze reglementen zijn opgenomen in het boekwerk Informatieverstrekking. De reglementen
      staan ook op het Infoweb van de Belastingdienst. In de reglementen is telkens in artikel 10 opgenomen aan welk
      bestuursorgaan informatie uit die persoonsregistratie wordt of mag worden verstrekt.

      2.4.3 Voor het verstrekken van informatie aan de in artikel 10 van de reglementen genoemde bestuursorganen
      is ontheffing van de geheimhoudingsplicht verleend. Daarnaast is in artikel 10 vaak de mogelijkheid
      opgenomen om incidenteel nog informatie te verstrekken aan andere bestuursorganen. Indien een niet
      genoemd bestuursorgaan verzoekt om informatie beoordeelt het hoofd van de eenheid het verzoek op basis van
      [hoofdstuk 4 van dit voorschrift][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010092#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0010092#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0010092/1993-01-01#Artikel2.4
    references:
