  - number: '18'
    text: |-
      1 Indien een nieuwkomer in strijd met de [artikelen 2][ref1], [4, vierde lid][ref2], [8, eerste volzin][ref3],
      [9, eerste lid][ref4], [10, derde lid][ref5], of [12, eerste lid][ref6], handelt, legt het college van burgemeester
      en wethouders ter zake van de overtreding aan de nieuwkomer bij beschikking een bestuurlijke boete op.

      2 De hoogte van de boete wordt afgestemd op de ernst van het feit, de omstandigheden waarin de nieuwkomer verkeert,
      en de mate van verwijtbaarheid.

      3 De beschikking vermeldt in ieder geval:

      a. de hoogte van de boete,

      b. de termijn waarbinnen de boete moet worden betaald,

      c. het feit ter zake waarvan de boete wordt opgelegd alsmede het overtreden wettelijk voorschrift en

      d. een aanduiding van de plaats waar en van het tijdstip waarop de overtreding is begaan.

      4 Indien daarvoor dringende redenen aanwezig zijn, kan het college van burgemeester en wethouders besluiten van het
      opleggen van een boete af te zien.

      5 Het opleggen van een boete blijft achterwege, indien voor dezelfde gedraging de bijstand is verlaagd op grond van
      [artikel 18, tweede lid, van de Wet werk en bijstand][ref7].

      6 De bevoegdheid tot het opleggen van een boete vervalt twee jaar nadat de overtreding is begaan.

      7 Bij gemeentelijke verordening worden nadere regels gesteld over de hoogte van de boete.


