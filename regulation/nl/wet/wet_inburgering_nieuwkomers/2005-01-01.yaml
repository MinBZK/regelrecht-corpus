  - number: '2'
    text: |-
      1 Iedere nieuwkomer meldt zich op een door het college van burgemeester en wethouders te bepalen
      wijze bij een door dit college aangewezen instantie voor het houden van een inburgeringsonderzoek. Hij
      meldt zich met een door hem ingevuld aanmeldingsformulier. Indien het een nieuwkomer als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°][ref1], betreft, wordt hem dit formulier overhandigd tegelijk
      met de beschikking waarbij de aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd wordt
      ingewilligd. Indien het een nieuwkomer als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 2°][ref2],
      betreft, wordt hem dit formulier overhandigd op het moment dat hij aangifte van verblijf en adres als bedoeld
      in [artikel 65 van de Wet gemeentelijke basisadministratie persoonsgegevens][ref3] doet. Onze Minister van
      Binnenlandse Zaken stelt voor het formulier een model vast.

      2 De nieuwkomer die vreemdeling is, voldoet aan de in het eerste lid bedoelde verplichting:

      a. indien hij in een opvangcentrum verblijft, binnen zes weken nadat hij na vertrek
      uit het centrum voor de eerste keer aangifte van verblijf en adres als bedoeld in
      [artikel 65 van de Wet gemeentelijke basisadministratie persoonsgegevens][ref4] heeft gedaan, en

      b. in de overige gevallen, binnen zes weken nadat hem de beschikking, waarbij de aanvraag tot het verlenen van een
      verblijfsvergunning voor bepaalde tijd wordt ingewilligd is uitgereikt.

      3 De nieuwkomer die Nederlander is, voldoet aan de in het eerste lid bedoelde
      verplichting binnen zes weken nadat hij aangifte van verblijf en adres als bedoeld in
      [artikel 65 van de Wet gemeentelijke basisadministratie persoonsgegevens][ref5] heeft gedaan.

      4 Onder een opvangcentrum als bedoeld in het tweede lid wordt verstaan: een door het Rijk beschikbaar gestelde
      accommodatie die uitsluitend bestemd is voor het bieden van tijdelijke opvang aan vreemdelingen.


