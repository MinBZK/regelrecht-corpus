        artikel: '15'
        hoofdstuk: '4'
  - number: '7'
    text: |-
      Het college van burgemeester en wethouders draagt er zorg voor dat er voor de nieuwkomers voor wie een
      inburgeringsprogramma is vastgesteld, een zodanig aanbod van inburgeringsprogramma's is dat zij aan de krachtens
      deze wet voor hen geldende verplichtingen kunnen voldoen.
    url: https://wetten.overheid.nl/BWBR0009544/2005-01-01#Artikel7
  - number: '8'
    text: |-
      Binnen een door het college van burgemeester en wethouders te bepalen termijn na de bekendmaking
      van het voor hem vastgestelde inburgeringsprogramma, laat de nieuwkomer zich voor het volgen van het
      educatieve programma inschrijven bij een instelling. Het college draagt er zorg voor dat deze termijn
      zo wordt gekozen dat het bevoegd gezag van de instelling kan voldoen aan de verplichting, bedoeld in
      [artikel 8.1.3, achtste lid, van de Wet educatie en beroepsonderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8.1.3
    url: https://wetten.overheid.nl/BWBR0009544/2005-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8.1.3
  - number: '9'
    text: |-
      1 De deelnemer is aanwezig bij alle onderdelen van het voor hem vastgestelde educatieve programma.

      2 De deelnemer is van de in het eerste lid bedoelde verplichting vrijgesteld, zolang zich een van de in
      [artikel 11, onder a tot en met e en g, van de Leerplichtwet 1969][ref1] genoemde omstandigheden voordoet, met dien
      verstande dat in dat artikel voor «jongere» moet worden gelezen: deelnemer.

      3 In het geval, bedoeld in het tweede lid, zijn de [artikelen 12][ref2], [13][ref3], [13b][ref4] en
      [14 van de Leerplichtwet 1969][ref5] van overeenkomstige toepassing, met dien verstande dat in de gevallen, bedoeld
      in de [artikelen 13b][ref6] en [14, eerste lid, van die wet][ref7], de kennisgeving, onderscheidenlijk het verzoek
      wordt gedaan door de deelnemer.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0002628#Artikel13
