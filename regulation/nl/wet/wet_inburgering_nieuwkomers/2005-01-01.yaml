  - number: '14'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels vastgesteld voor het geval dat de nieuwkomer tijdens
      zijn deelname aan het voor hem vastgestelde inburgeringsprogramma aangifte van adreswijziging als bedoeld in
      [artikel 66 van de Wet gemeentelijke basisadministratie persoonsgegevens][ref1] doet bij het bestuur van een
      andere gemeente dan de gemeente waarvan het college van burgemeester en wethouders het inburgeringsprogramma heeft
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel66
    url: https://wetten.overheid.nl/BWBR0009544/2005-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '66'
  - number: '15'
    text: |-
      1 Het college van burgemeester en wethouders draagt er zorg voor dat de nieuwkomer vanaf het moment waarop deze
      zich op grond van [artikel 2][ref1] heeft gemeld, tot aan het moment waarop het inburgeringsprogramma is voltooid,
      voldoende wordt begeleid.

      2 Ten behoeve van de begeleiding van de nieuwkomer wordt voor hem een individueel trajectplan opgesteld
      waarin het tijdens het inburgeringsonderzoek vastgestelde niveau van de kennis, het inzicht en de vaardigheden
      van de nieuwkomer, het met het inburgeringsprogramma te bereiken einddoel en een regeling van tussentijdse
      evaluatiegesprekken met de nieuwkomer worden vastgelegd. Tijdens deze evaluatiegesprekken wordt vastgesteld welke
      voortgang de nieuwkomer heeft geboekt bij het deelnemen aan het voor hem vastgestelde inburgeringsprogramma. Bij of
      krachtens algemene maatregel van bestuur worden regels gegeven over de vaststelling van de voortgang alsmede over
      de registratie daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel2
    url: https://wetten.overheid.nl/BWBR0009544/2005-01-01#Artikel15
    references:
