  - number: '19'
    text: |-
      1 Indien het college van burgemeester en wethouders of een ambtenaar jegens de nieuwkomer een handeling verricht
      waaraan deze in redelijkheid de gevolgtrekking kan verbinden dat aan hem wegens een bepaald feit een boete zal
      worden opgelegd, is de nieuwkomer niet langer verplicht ter zake van dat feit enige verklaring af te leggen.

      2 Indien het college van burgemeester en wethouders voornemens is een boete op te leggen, geeft het de nieuwkomer
      daarvan kennis onder vermelding van het feit ter zake waarvan het voornemen bestaat en van de gronden waarop het
      voornemen berust. De kennisgeving is een handeling als bedoeld in het eerste lid.

      3 Op verzoek van de nieuwkomer die de in het tweede lid bedoelde kennisgeving wegens zijn gebrekkige kennis van de
      Nederlandse taal onvoldoende begrijpt, draagt het college van burgemeester en wethouders er zoveel mogelijk zorg
      voor dat de in die kennisgeving vermelde gronden aan de nieuwkomer worden meegedeeld in een voor hem begrijpelijke
      taal.

      4 In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] stelt het college van burgemeester en
      wethouders de nieuwkomer in de gelegenheid om naar keuze schriftelijk of mondeling zijn zienswijze naar voren te
      brengen voordat de boete wordt opgelegd.

      5 Indien de nieuwkomer zijn zienswijze naar voren brengt, draagt het college van burgemeester en wethouders er op
      verzoek van de nieuwkomer die de Nederlandse taal onvoldoende begrijpt, zorg voor dat een tolk wordt benoemd die de
      nieuwkomer kan bijstaan, tenzij redelijkerwijs kan worden aangenomen dat daaraan geen behoefte bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
    url: https://wetten.overheid.nl/BWBR0009544/2005-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
  - number: '20'
    text: |-
      1 Indien de boete niet is betaald binnen de overeenkomstig [artikel 18, derde lid, onder b][ref1], bepaalde
      termijn, wordt de nieuwkomer schriftelijk bevolen binnen twee weken alsnog het bedrag van de boete, verhoogd met de
      kosten van de aanmaning, te betalen.

      2 Bij gebreke van betaling kan het college van burgemeester en wethouders de boete, verhoogd met de op de aanmaning
      en invordering betrekking hebbende kosten, bij dwangbevel invorderen.

      3 De bevoegdheid tot invordering vervalt binnen twee jaar nadat de beschikking inzake oplegging van de boete
      onherroepelijk is geworden.

      4 Het dwangbevel wordt op kosten van de overtreder bij deurwaardersexploit betekend en levert een executoriale
      titel op in de zin van het [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering](onbekend).

      5 Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van de
      gemeente. Het verzet schorst de tenuitvoerlegging. Op verzoek van de gemeente kan de rechter de schorsing van de
      tenuitvoerlegging opheffen.

      6 De boete komt ten goede aan de gemeente.


