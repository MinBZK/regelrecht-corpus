  - number: '10'
    text: |-
      1 Het bevoegd gezag van de instelling waarbij de deelnemer zich heeft laten inschrijven, geeft de deelnemer binnen
      een jaar na de inschrijving de gelegenheid een toets af te leggen. Het bevoegd gezag draagt er zorg voor dat de
      deelnemer de in [artikel 6, eerste lid, onderdeel a, onder 1°, 2° en 3°][ref1], bedoelde onderdelen van het voor
      hem vastgestelde educatieve programma tijdig binnen deze termijn heeft voltooid.

      2 Het bevoegd gezag van de instelling kan de deelnemer de gelegenheid geven een toets af te leggen, indien
      deze de in [artikel 6, eerste lid, onderdeel a, onder 1°, 2° en 3°][ref2], bedoelde onderdelen van het voor
      hem vastgestelde educatieve programma nog niet heeft voltooid, mits de deelnemer tegenover het bevoegd gezag
      aannemelijk heeft kunnen maken dan wel het bevoegd gezag op grond van eigen bevindingen verwacht dat de deelnemer
      bij de toets het in [artikel 11, eerste lid, onder b][ref3], bedoelde niveau zal kunnen behalen. Indien dit niveau
      wordt behaald, vervalt voor de deelnemer de in [artikel 9, eerste lid][ref4], bedoelde verplichting. Indien dit
      niveau niet wordt behaald, worden de desbetreffende onderdelen van het educatieve programma voortgezet totdat zij
      zijn voltooid, dan wel tot een eerder tijdstip, zodra opnieuw aan de in de eerste volzin bedoelde voorwaarde wordt
      voldaan.

      3 Indien de deelnemer daartoe de gelegenheid is gegeven, legt hij de toets af.


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009544#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0009544#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0009544#Artikel9
