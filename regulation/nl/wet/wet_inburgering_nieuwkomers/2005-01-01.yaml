  - number: '11'
    text: |-
      1 De resultaten van de toets worden gemeten naar twee verschillende niveaus, waarbij:

      a. het ene niveau tenminste aangeeft dat de deelnemer in de Nederlandse
      samenleving als ingeburgerd kan worden beschouwd op een wijze als bedoeld in
      [artikel 8, eerste lid, onder d, van de Rijkswet op het Nederlanderschap][ref1], en

      b. het andere niveau in voorkomende gevallen betekenis heeft voor de doorstroming naar vervolgonderwijs en de
      arbeidsmarkt.

      2 Bij regeling van Onze Minister van Onderwijs, Cultuur en Wetenschappen worden nadere regels gesteld over de in
      het eerste lid bedoelde niveaus.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel8
    url: https://wetten.overheid.nl/BWBR0009544/2005-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '8'
  - number: '12'
    text: |-
      1 De nieuwkomer verleent zijn medewerking aan de in [artikel 6, eerste lid, onder b en c][ref1], bedoelde
      onderdelen van het voor hem vastgestelde inburgeringsprogramma.

      2 Ten behoeve van de uitvoering van het in [artikel 6, eerste lid, onder c][ref2], bedoelde onderdeel
      van het inburgeringsprogramma draagt het college van burgemeester en wethouders er zorg voor dat
      een advies wordt opgesteld over doorstroming van de nieuwkomer naar vervolgonderwijs of naar de
      arbeidsmarkt. Bij het opstellen van het advies worden de resultaten, vermeld in de verklaring, bedoeld in
      [artikel 7.4.15 van de Wet educatie en beroepsonderwijs][ref3], en de Centrale organisatie werk en inkomen
      betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009544#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7.4.15
    url: https://wetten.overheid.nl/BWBR0009544/2005-01-01#Artikel12
