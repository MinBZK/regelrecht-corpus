  - number: '6'
    text: |-
      1 Een inburgeringsprogramma bestaat uit:

      a. een op het niveau, bedoeld in [artikel 11, eerste lid, onder b][ref1], gericht educatief programma van een door
      het college van burgemeester en wethouders met inachtneming van het tweede lid vast te stellen aantal uren dat de
      volgende onderdelen bevat:

      1°. een op dat niveau gericht deel van een in [artikel 7.3.1 van de Wet educatie en beroepsonderwijs][ref2]
      bedoelde opleiding Nederlands als tweede taal I of II,

      2°. een in dat artikel van die wet bedoelde opleiding gericht op sociale redzaamheid,

      3°. een in dat artikel van die wet bedoelde opleiding gericht op breed maatschappelijk functioneren en

      4°. een toets,

      b. maatschappelijke begeleiding en

      c. doorgeleiding naar een instantie die zorgdraagt voor verdere scholing of voor toegang tot de arbeidsmarkt, voor
      zover de nieuwkomer daarvoor in aanmerking komt.

      2 In het inburgeringsprogramma worden in ieder geval het resultaat, de intensiteit en de duur van de in het eerste
      lid, onderdeel a, onder 1°, 2° en 3°, bedoelde onderdelen van het educatieve programma vastgesteld. Het aantal uren
      van het educatieve programma wordt vastgesteld op de grondslag van een gemiddelde omvang van deze programma's van
      600 uren.

      3 Indien tijdens het inburgeringsonderzoek aannemelijk is geworden dat de nieuwkomer de kennis, het inzicht en
      de vaardigheden die hij zou verwerven door het volgen van een van de in het eerste lid, onderdeel a, onder 1°, 2°
      en 3°, bedoelde onderdelen van het educatieve programma of gedeelten daarvan, reeds in voldoende mate op andere
      wijze heeft verworven dan wel binnen een redelijke termijn in voldoende mate op andere wijze zal verwerven, neemt
      het college van burgemeester en wethouders dit onderdeel of gedeelte daarvan niet op in het voor de betrokken
      nieuwkomer vast te stellen inburgeringsprogramma.

      4 Het college van burgemeester en wethouders kan het inburgeringsprogramma wijzigen, indien de evaluatiegesprekken,
      bedoeld in [artikel 15][ref3], of andere, bijzondere redenen daartoe aanleiding geven.

      5 Het college van burgemeester en wethouders vraagt een instelling om advies ten behoeve van het vaststellen of
      wijzigen van het inburgeringsprogramma, voor zover dit het educatieve programma betreft.


