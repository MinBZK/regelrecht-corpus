  - number: '4'
    text: |-
      1 Het college van burgemeester en wethouders draagt er zorg voor dat het inburgeringsonderzoek zo
      spoedig mogelijk wordt gehouden nadat de betrokken nieuwkomer zich heeft gemeld. Het college draagt
      er tevens zorg voor dat bij het onderzoek een instelling en, voor zover de nieuwkomer op grond van de
      [Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] het recht toekomt zich te laten registreren als
      werkzoekende, de Centrale organisatie werk en inkomen worden betrokken.

      2 Het inburgeringsonderzoek is een onderzoek naar de mate waarin de nieuwkomer in Nederland in een maatschappelijke
      achterstandssituatie kan geraken. Het onderzoek heeft in ieder geval betrekking op de mate waarin de nieuwkomer
      actief en passief de Nederlandse taal beheerst en kennis van de Nederlandse samenleving en de Nederlandse
      arbeidsmarkt heeft, alsmede op de mate waarin hij naar verwachting door het volgen van een voor hem vast te stellen
      inburgeringsprogramma kennis, inzicht en vaardigheden kan verwerven met het oog op verdere scholing of toegang tot
      de arbeidsmarkt.

      3 Het inburgeringsonderzoek bestaat uit:

      a. een beoordeling van het ingevulde aanmeldingsformulier,

      b. tenzij uit de op het formulier ingevulde gegevens blijkt dat de nieuwkomer niet voor een inburgeringsprogramma
      in aanmerking komt, een begingesprek met de nieuwkomer waarin het doel van een inburgeringsprogramma en de verdere
      procedure uiteen worden gezet en de nieuwkomer, zo nodig, om een toelichting op deze gegevens wordt gevraagd,

      c. tenzij uit het begingesprek blijkt dat de nieuwkomer niet voor een inburgeringsprogramma in aanmerking komt, een
      test van de kennis, het inzicht en de vaardigheden van de nieuwkomer ten behoeve van de vaststelling van de inhoud
      van het inburgeringsprogramma en

      d. tenzij uit de resultaten van de test blijkt dat de nieuwkomer niet voor een inburgeringsprogramma in aanmerking
      komt, een eindgesprek met de nieuwkomer waarin met hem het vast te stellen inburgeringsprogramma, het met het
      programma te bereiken einddoel en zijn rechten en verplichtingen worden besproken.

      4 De nieuwkomer verleent zijn medewerking aan het inburgeringsonderzoek. Het college van burgemeester en wethouders
      maakt aan de nieuwkomer tijdig bekend waaruit de te verlenen medewerking bestaat.

      5 Bij algemene maatregel van bestuur worden nadere regels gesteld over de criteria aan de hand waarvan het
      inburgeringsonderzoek wordt gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0013060
