  - number: '3'
    text: |-
      1 Het college van burgemeester en wethouders ontheft de nieuwkomer van de in [artikel 2][ref1] bedoelde
      verplichting, indien deze:

      a. op lichamelijke of psychische gronden niet in staat is aan enige krachtens deze wet voor hem geldende
      verplichting te voldoen,

      b. behoort tot de nieuwkomers, bedoeld in [artikel 1, eerste lid, onderdeel a, onder 2°][ref2], en hier voor een
      tijdelijk doel verblijft of aan bij of krachtens algemene maatregel van bestuur op voordracht van Onze Minister van
      Binnenlandse Zaken vast te stellen opleidingseisen voldoet, of

      c. op andere dan onder a en b bedoelde, gewichtige gronden niet in staat is aan een zodanige verplichting te
      voldoen.

      2 De nieuwkomer dient een aanvraag tot een ontheffing als bedoeld in het eerste lid in binnen dezelfde termijn als
      waarbinnen aan de in [artikel 2][ref3] bedoelde verplichting zou moeten zijn voldaan.

      3 Het college van burgemeester en wethouders vermeldt in zijn besluit tot ontheffing de duur van de ontheffing. De
      duur van de ontheffing bedraagt ten hoogste een jaar. De ontheffing wordt voor onbepaalde tijd verleend, indien:

      a. uit bij de aanvraag verschafte gegevens en bescheiden blijkt dat de nieuwkomer nooit in staat zal zijn aan enige
      krachtens deze wet voor hem geldende verplichting te voldoen, of

      b. betrokkene een nieuwkomer als bedoeld in het eerste lid, onder b, is.

      4 Het college van burgemeester en wethouders kan de duur van de ontheffing verlengen. Op het besluit tot verlenging
      is het derde lid van overeenkomstige toepassing.

      5 Zolang niet op de aanvraag tot ontheffing of tot verlenging van de duur daarvan is beslist, is de in
      [artikel 2][ref4] bedoelde verplichting opgeschort.

      6 Onder verblijf voor een tijdelijk doel als bedoeld in het eerste lid, onder b, wordt het verblijf verstaan van
      de Nederlander die behoort tot een bij regeling van Onze Minister van Binnenlandse Zaken aan te wijzen categorie
      van Nederlanders. De aan te wijzen categorie komt zoveel mogelijk overeen met een categorie van vreemdelingen als
      bedoeld in [artikel 1, tweede lid][ref5].


