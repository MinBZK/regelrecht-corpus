  - number: '17'
    text: |-
      1 Het toezicht op de naleving van de [artikelen 2][ref1], [4, vierde lid][ref2], [8, eerste volzin][ref3],
      [9, eerste lid][ref4], [10, derde lid][ref5], en [12, eerste lid][ref6], is opgedragen aan het college
      van burgemeester en wethouders, dat daartoe een of meer ambtenaren aanwijst. Op dit toezicht zijn de
      [artikelen 16, tweede, derde en vierde lid][ref7], [17][ref8], [18, eerste en derde lid][ref9], en
      [21, tweede lid, van de Leerplichtwet 1969][ref10] van overeenkomstige toepassing.

      2 Het college van burgemeester en wethouders controleert of de nieuwkomers die als ingezetene in de
      basisadministratie persoonsgegevens zijn ingeschreven, zich hebben gehouden aan hun verplichting, bedoeld in
      [artikel 2][ref11].

      3 Indien blijkt dat een nieuwkomer zich niet aan de verplichting, bedoeld in [artikel 2][ref12] of
      [9, eerste lid][ref13], heeft gehouden, zonder dat een grond voor ontheffing dan wel vrijstelling aanwezig
      is, zich niet aan de verplichting, bedoeld in de [artikelen 4, vierde lid][ref14], [8, eerste volzin][ref15],
      [10, derde lid][ref16], of [12, eerste lid][ref17], heeft gehouden of indien een kennisgeving als bedoeld in
      [artikel 21, tweede lid, van de Leerplichtwet 1969][ref18] is ontvangen, stelt de ambtenaar een onderzoek in.
      Hij hoort de betrokken nieuwkomer en tracht hem te bewegen zijn verplichtingen na te komen. Indien blijkt dat de
      nieuwkomer weigert deze verplichtingen na te komen, zendt de ambtenaar een verslag van zijn bevindingen aan het
      college van burgemeester en wethouders.


