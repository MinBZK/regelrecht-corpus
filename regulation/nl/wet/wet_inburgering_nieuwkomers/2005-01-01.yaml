  - number: '5'
    text: |-
      1 Zo spoedig mogelijk nadat het inburgeringsonderzoek is gehouden, stelt het college van burgemeester en
      wethouders op grond van de resultaten van het onderzoek voor de betrokken nieuwkomer een inburgeringsprogramma
      vast. Het inburgeringsprogramma is gericht op vergroting van de sociale redzaamheid van de nieuwkomer en van diens
      mogelijkheden om zich verder te scholen of toe te treden tot de arbeidsmarkt.

      2 Het college van burgemeester en wethouders besluit het vaststellen van een inburgeringsprogramma achterwege te
      laten, indien tijdens het inburgeringsonderzoek aannemelijk is geworden dat de nieuwkomer de kennis, het inzicht en
      de vaardigheden die hij door het deelnemen aan een inburgeringsprogramma zou kunnen verwerven, reeds in voldoende
      mate op andere wijze heeft verworven dan wel binnen een redelijke termijn in voldoende mate op andere wijze zal
      verwerven.

      3 Het college van burgemeester en wethouders kan aan een besluit als bedoeld in het tweede lid de voorwaarde
      verbinden dat de betrokken nieuwkomer op een door het college te bepalen datum een toets aflegt en daarbij het
      in [artikel 11, eerste lid, onder b][ref1], bedoelde niveau behaalt. Het college draagt er zorg voor dat de
      toets wordt afgenomen door een instelling. In het geval dat aan de in de eerste volzin genoemde voorwaarde niet
      wordt voldaan, stelt het college zo spoedig mogelijk na de datum waarop de resultaten van de toets bekend zijn
      gemaakt, voor de betrokken nieuwkomer alsnog een inburgeringsprogramma vast. In dat geval wordt de termijn,
      bedoeld in [artikel 8.1.3, achtste lid, van de Wet educatie en beroepsonderwijs][ref2] verlengd met de tijd die
      is verlopen tussen de datum waarop het in de eerste volzin bedoelde besluit is genomen, en de datum waarop het
      inburgeringsprogramma is vastgesteld.

      4 Onverminderd het derde lid kan de in het tweede lid bedoelde nieuwkomer bij het college van burgemeester en
      wethouders een aanvraag indienen tot het nemen van een besluit hem een toets te laten afleggen. Het college voldoet
      aan deze aanvraag, tenzij gewichtige redenen zich daartegen verzetten. Indien het college aan de aanvraag voldoet,
      draagt het er zorg voor dat de toets wordt afgenomen door een instelling.

      5 Bij algemene maatregel van bestuur kunnen nadere regels over de uitvoering van het tweede lid worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8.1.3
