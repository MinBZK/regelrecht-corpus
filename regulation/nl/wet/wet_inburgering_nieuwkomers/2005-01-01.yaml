        artikel: '2'
        hoofdstuk: '2'
  - number: '16'
    text: |-
      Onze Minister van Volksgezondheid, Welzijn en Sport kent, na overleg met Onze Ministers van Onderwijs, Cultuur
      en Wetenschappen en van Binnenlandse Zaken, aan de gemeenten jaarlijks een rijksbijdrage toe ten behoeve van
      de uitvoering van de [artikelen 4][ref1], [5][ref2] en [6, eerste lid, onder b en c][ref3], en [15][ref4]. De
      bijdrage wordt, binnen het raam van de door de begrotingswetgever vastgestelde middelen, berekend op grond van een
      bij of krachtens algemene maatregel van bestuur vastgestelde berekeningswijze. De rijksbijdrage kan mede worden
      aangewend voor educatieve programma's. Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld
      met betrekking tot de rijksbijdrage. Deze regels hebben in ieder geval betrekking op voorwaarden, te verbinden aan
      de toekenning van de rijksbijdrage en aan de in de derde volzin bedoelde aanwending, tussentijdse wijziging van
      de rijksbijdrage, verantwoording van de besteding van de rijksbijdrage en bestemming van niet bestede middelen.
      De voordracht voor een in dit artikel bedoelde algemene maatregel van bestuur wordt gedaan door Onze Minister van
      Volksgezondheid, Welzijn en Sport.


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel4
