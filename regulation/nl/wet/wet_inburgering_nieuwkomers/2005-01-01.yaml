preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels vast te stellen met betrekking tot de
    inburgering van nieuwkomers in de Nederlandse samenleving;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009544/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. nieuwkomer:

      1°. De vreemdeling die in Nederland rechtmatig verblijf heeft op grond van een verblijfsvergunning voor bepaalde
      tijd als bedoeld in [artikel 14][ref1] en [artikel 28 van de Vreemdelingenwet 2000][ref2], die de leeftijd
      van achttien jaar heeft bereikt en die voor de eerste keer tot Nederland is toegelaten, behoudens degene die
      hier voor een tijdelijk doel verblijft, tenzij hij behoort tot een bij regeling van Onze Minister voor Grote
      Steden- en Integratiebeleid aan te wijzen categorie van vreemdelingen, en behoudens degene die op grond van
      bepalingen van verdragen of van besluiten van volkenrechtelijke organisaties niet verplicht kan worden aan een
      inburgeringsprogramma deel te nemen, en

      2°. de Nederlander die geboren is buiten Nederland, de leeftijd van achttien jaar heeft bereikt en voor de eerste
      keer in Nederland ingezetene in de zin van de [Wet gemeentelijke basisadministratie persoonsgegevens][ref3] is;

      b. college van burgemeester en wethouders: het college van burgemeester en wethouders van de gemeente waar de
      nieuwkomer een woonplaats als bedoeld in [titel 3 van boek 1 van het Burgerlijk Wetboek][ref4] heeft;

      c. inburgeringsonderzoek: een onderzoek als bedoeld in [artikel 4, derde lid][ref5];

      d. inburgeringsprogramma: een programma als bedoeld in [artikel 6, eerste lid][ref6];

      e. educatief programma: een programma als bedoeld in [artikel 6, eerste lid, onder a][ref7];

      f. instelling: een instelling als bedoeld in [artikel 1.3.1 van de Wet educatie en beroepsonderwijs][ref8] waarmee
      een overeenkomst als bedoeld in [artikel 2.3.4 van die wet][ref9] is gesloten;

      g. bevoegd gezag: het bevoegd gezag, bedoeld in
      [artikel 1.1.1, onder w, van de Wet educatie en beroepsonderwijs][ref10];

      h. deelnemer: de nieuwkomer die zich bij een instelling heeft laten inschrijven voor het volgen van het voor hem
      vastgestelde educatieve programma;

      i. toets: de toets, bedoeld in [artikel 10][ref11];

      j. ambtenaar: de ambtenaar, bedoeld in [artikel 17, eerste lid][ref12];

      k. Centrale organisatie werk en inkomen: de Centrale organisatie werk en inkomen, genoemd in
      [hoofdstuk 4 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref13].

      2 Onder verblijf voor een tijdelijk doel als bedoeld in het eerste lid, onderdeel a, onder 1°, wordt het verblijf
      verstaan van:

      a. de vreemdeling ten behoeve van wie over een geldige tewerkstellingsvergunning als bedoeld in
      [artikel 2 van de Wet arbeid vreemdelingen][ref14] wordt beschikt, en zijn gezinsleden,

      b. de vreemdeling, bedoeld in [artikel 3, eerste lid, onder b, van de Wet arbeid vreemdelingen][ref15], en zijn
      gezinsleden en

      c. de vreemdeling die behoort tot een bij regeling van Onze Minister van Binnenlandse Zaken aan te wijzen categorie
      van vreemdelingen.

      3 Met een nieuwkomer als bedoeld in het eerste lid, onderdeel a, onder 1° en onder 2°, worden voor de toepassing
      van deze wet gelijkgesteld respectievelijk de in het eerste lid, onderdeel a, onder 1°, bedoelde vreemdeling
      en de in het eerste lid, onderdeel a, onder 2°, bedoelde Nederlander, op wie de [artikelen 2][ref16] en
      [4a van de Leerplichtwet 1969][ref17] niet van toepassing zijn en die de leeftijd van achttien jaren nog niet heeft
      bereikt.

      4 Met een nieuwkomer als bedoeld in het eerste lid, onderdeel a, onder 1° en onder 2°, worden voor de toepassing
      van deze wet gelijkgesteld respectievelijk de in het eerste lid, onderdeel a, onder 1°, bedoelde vreemdeling
      en de in het eerste lid, onderdeel a, onder 2°, bedoelde Nederlander, die de leeftijd van achttien jaar nog
      niet heeft bereikt en die op grond van de [artikelen 4a tot en met 4c van de Leerplichtwet 1969][ref18],
      gedurende ten hoogste twee dagen per week het daar bedoelde onderwijs geregeld zou dienen te volgen.
      [Artikel 4a van de Leerplichtwet 1969][ref19] is niet van toepassing ten aanzien van degene die op grond van de
      eerste volzin is gelijkgesteld met een nieuwkomer.


