  - number: '23'
    text: |-
      Onze Minister van Binnenlandse Zaken zendt binnen drie jaar na de inwerkingtreding van deze wet aan de Staten-
      Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0009544/2005-01-01#Artikel23
  - number: '24'
    text: |-
      1 Voor zover het tijdstip waarop deze wet in werking treedt binnen de termijn, bedoeld in
      [artikel 2, tweede of derde lid][ref1], valt, wordt deze termijn verlengd tot het tijdstip waarop zes weken zijn
      verstreken sinds het tijdstip van inwerkingtreding.

      2 Onder de in [artikel 1, eerste lid, onderdeel a, onder 2°][ref2], bedoelde nieuwkomer wordt niet verstaan de
      Nederlander die in enig persoonsregister als bedoeld in het Besluit bevolkingsboekhouding opgenomen is geweest.

      3 De [artikelen 2.3.1][ref3] en [2.3.2 van de Wet educatie en beroepsonderwijs][ref4], zoals deze
      luiden na de inwerkingtreding van deze wet, en [artikel 16][ref5] vinden voor het eerst toepassing
      met betrekking tot het eerste kalenderjaar na deze inwerkingtreding. De voorwaarden, gesteld krachtens
      [artikel 2.3.1, eerste lid, derde volzin, van de Wet educatie en beroepsonderwijs][ref6], zoals dit luidt op de dag
      voor de inwerkingtreding van [artikel 21, onderdeel A][ref7], blijven van kracht ten aanzien van de middelen waarop
      deze voorwaarden betrekking hebben.

      4 Voor zover deze wet, de [Wet educatie en beroepsonderwijs][ref8] of de [Welzijnswet 1994][ref9]
      daarin niet voorziet, alsmede indien nodig in afwijking van het bij of krachtens deze wetten bepaalde,
      worden bij ministeriële regeling regels vastgesteld ten behoeve van een goede invoering van deze wet, de
      [Wet educatie en beroepsonderwijs][ref10], zoals gewijzigd door deze wet, of de [Welzijnswet 1994][ref11], zoals
      gewijzigd door deze wet.

      5 [Artikel 1, derde en vierde lid][ref12], is voor de eerste maal van toepassing op de daar bedoelde
      vreemdeling of Nederlander die na inwerkingtreding van deze wet voor de eerste keer tot Nederland is toegelaten,
      respectievelijk die na inwerkingtreding van deze wet voor de eerste keer in Nederland ingezetene in de zin van de
      [Wet gemeentelijke basisadministratie persoonsgegevens][ref13] is.


