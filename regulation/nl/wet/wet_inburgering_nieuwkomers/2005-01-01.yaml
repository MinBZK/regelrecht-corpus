  - number: '13'
    text: |-
      1 Het college van burgemeester en wethouders draagt er zorg voor dat het inburgeringsprogramma is voltooid binnen
      zes maanden nadat de betrokken nieuwkomer de toets heeft afgelegd.

      2 Nadat het inburgeringsprogramma is voltooid, draagt het college van burgemeester en wethouders er zorg voor dat
      aan de deelnemer een certificaat wordt uitgereikt waaruit diens deelname aan het programma blijkt. Indien uit de
      verklaring, bedoeld in [artikel 7.4.15 van de Wet educatie en beroepsonderwijs][ref1], blijkt dat de deelnemer
      heeft voldaan aan een van de in [artikel 11, eerste lid][ref2], bedoelde niveaus, wordt op het certificaat het
      behaalde niveau vermeld.

      3 Onze Minister van Binnenlandse Zaken stelt voor het certificaat een model vast.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.4.15
      [ref2]: https://wetten.overheid.nl/BWBR0009544#Artikel11
    url: https://wetten.overheid.nl/BWBR0009544/2005-01-01#Artikel13
    references:
