preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is te komen tot een herziening, bundeling en harmonisatie
    van het ongevallenonderzoek in de transportsector en daartoe op te richten de Raad voor de Transportveiligheid,
    alsmede te komen tot implementatie van richtlijn nr. 94/56/EG van de Raad van de Europese Unie van 21 november
    1994, houdende vaststelling van de grondbeginselen voor het onderzoek van ongevallen en incidenten in de
    burgerluchtvaart (PbEG L 319);

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.1.b
    text: |-
      de raad: de Raad voor de Transportveiligheid, genoemd in [artikel 2, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009753#Artikel2
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009753
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 1.1.c
    text: |-
      kamer: kamer van de raad als bedoeld in [artikel 4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009753#Artikel4
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009753
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 1.1.d
    text: |-
      schip: elke zaak, geen luchtvaartuig zijnde, die blijkens zijn constructie bestemd is om te drijven en drijft of
      heeft gedreven;
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.1.e
    text: 'zeeschip: schip dat blijkens zijn constructie uitsluitend of in hoofdzaak voor drijven in zee is bestemd;'
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.1.f
    text: |-
      Nederlands zeeschip: zeeschip dat op grond van de Nederlandse rechtsregels gerechtigd is de vlag van het Koninkrijk
      der Nederlanden te voeren;
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.1.g
    text: |-
      luchtvaartuig: toestel, dat in de dampkring kan worden gehouden ten gevolge van krachten die de lucht daarop
      uitoefent, met inbegrip of met uitzondering van bij algemene maatregel van bestuur aan te wijzen toestellen;
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.1.h
    text: |-
      Nederlands luchtvaartuig: luchtvaartuig als bedoeld in [artikel 1, onder e, van de Luchtvaartwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel1
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '1'
  - number: 1.1.i
    text: |-
      scheepvaartongeval: elk voorval aan een schip overkomen, waarbij dodelijk of ernstig letsel of schade van betekenis
      aan een schip of aan het mariene milieu is veroorzaakt;
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.1.j
    text: 'spoorwegongeval: elk voorval op een spoorweg, waarbij dodelijk letsel of schade van betekenis is veroorzaakt;'
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.1.k
    text: |-
      buisleidingongeval: elk voorval in een ondergronds transportsysteem, waarbij dodelijk of ernstig letsel of schade
      van betekenis is veroorzaakt;
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.1.l
    text: |-
      wegenverkeersongeval: elk voorval aan een verkeersdeelnemer overkomen op een voor het verkeer feitelijk openstaande
      weg, waarbij dodelijk of ernstig letsel of schade van betekenis is veroorzaakt;
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.1.m
    text: |-
      luchtvaartongeval: elk voorval dat samenhangt met het gebruik van een luchtvaartuig en plaatsvindt tussen het
      tijdstip waarop een persoon zich aan boord begeeft met het voornemen een vlucht uit te voeren en het tijdstip
      waarop alle personen die zich met dit voornemen aan boord hebben begeven, zijn uitgestapt, en waarbij:
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.1.m.1°
    text: |-
      een persoon dodelijk of ernstig gewond raakt als gevolg van het zich in het luchtvaartuig bevinden, direct contact
      met een onderdeel van het luchtvaartuig, inclusief de onderdelen die van het luchtvaartuig zijn losgeraakt of
      directe blootstelling aan de uitlaatstroom van de reactoren, behalve wanneer de letsels een natuurlijke oorzaak
      hebben, door de persoon zelf of door anderen zijn toegebracht, of wanneer de letsels verstekelingen treffen die
      zich buiten de normale voor passagiers en het personeel bedoelde ruimten ophouden, of
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.1.m.2°
    text: |-
      het luchtvaartuig schade of een structureel defect oploopt, waardoor afbreuk wordt gedaan aan zijn soliditeit,
      prestaties of vluchtkenmerken en die normaliter ingrijpende herstelwerkzaamheden of vervanging van het getroffen
      onderdeel noodzakelijk zouden maken, behalve wanneer het gaat om motorstoring of motorschade en de schade
      beperkt is tot de motor, de motorkap of motoronderdelen, dan wel om schade die beperkt is tot de propellers,
      de vleugelpunten, de antennes, de banden, de remmen, de stroomlijnkappen of tot deukjes of gaatjes in de
      vliegtuighuid, of
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.1.m.3°
    text: het luchtvaartuig vermist wordt of volledig onbereikbaar is;
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.1.n
    text: 'ongeval: scheepvaart-, spoorweg-, buisleiding-, wegenverkeers- of luchtvaartongeval;'
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.1.o
    text: 'incident: voorval, dat geen ongeval is, en'
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.1.o.1°
    text: |-
      dat samenhangt met het functioneren van een luchtvaartuig en afbreuk doet of zou kunnen doen aan een veilige
      vluchtuitvoering, of
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.1.o.2°
    text: |-
      dat samenhangt met het functioneren van een schip en waarbij de veiligheid van het schip of van personen in gevaar
      is gebracht of waardoor ernstige schade aan het schip of het mariene milieu zou kunnen ontstaan, of
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.1.o.3°
    text: |-
      dat zich heeft afgespeeld op een spoorweg of een daarmee vergelijkbare geleider en waarbij de veiligheid van
      personen in gevaar is gebracht, of
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.1.o.4°
    text: |-
      dat zich heeft afgespeeld in een ondergronds transportsysteem en waarbij de veiligheid van personen in gevaar is
      gebracht, of
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.1.o.5°
    text: |-
      dat aan een verkeersdeelnemer is overkomen op een voor het verkeer feitelijk openstaande weg en waarbij de
      veiligheid van personen in gevaar is gebracht, of
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.1.o.6°
    text: dat een dreiging voor ernstige schade aan het milieu heeft veroorzaakt;
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.1.p
    text: |-
      ernstig incident: incident dat zich voordoet onder omstandigheden die erop wijzen dat bijna een luchtvaartongeval
      heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.1.q
    text: |-
      dodelijk letsel: letsel door een persoon bij een ongeval opgelopen, dat binnen dertig dagen na het tijdstip van het
      ongeval de dood tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.1.r
    text: 'ernstig letsel: letsel door een persoon bij een ongeval opgelopen, dat:'
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.1.r.1°
    text: |-
      opneming in een ziekenhuis gedurende meer dan 48 uur vereist, welke aanvangt binnen zeven dagen na het oplopen van
      het letsel, of
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.1.r.2°
    text: de breuk van een bot tot gevolg heeft, uitgezonderd enkelvoudige breuken van vingers, tenen of de neus, of
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.1.r.3°
    text: |-
      gepaard gaat met scheurwonden die ernstige bloedingen of beschadigingen van zenuwen, spieren of pezen veroorzaken,
      of
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.1.r.4°
    text: gepaard gaat met letsel aan een inwendig orgaan, of
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.1.r.5°
    text: |-
      gepaard gaat met tweedegraads of derdegraads brandwonden of brandwonden over meer dan 5% van het lichaamsoppervlak,
      of
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.1.r.6°
    text: gepaard gaat met geconstateerde blootstelling aan besmettelijke stoffen of schadelijke straling;
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.1.s
    text: |-
      oorzaken: handelingen, verzuimen, gebeurtenissen, omstandigheden of een combinatie daarvan die tot het ongeval, het
      ernstige incident of het incident hebben geleid;
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.1.t
    text: |-
      betrokkene: natuurlijk persoon, rechtspersoon of bestuursorgaan wiens handelen of nalaten blijkens het voorlopig
      oordeel van de raad heeft bijgedragen tot het ontstaan van het ongeval of incident, of de nabestaanden van een
      natuurlijk persoon als hiervoor bedoeld;
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.1.u
    text: |-
      veiligheidsaanbeveling: voorstel van de raad op basis van uit onderzoek voortvloeiende informatie met de bedoeling
      ongevallen en incidenten te voorkomen;
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.1.v
    text: |-
      exploitant van een luchtvaartuig: persoon, organisatie of onderneming die een of meer luchtvaartuigen exploiteert
      of voornemens is te exploiteren;
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.1.w
    text: |-
      onderneming: iedere natuurlijke persoon, iedere rechtspersoon met of zonder winstoogmerk of ieder overheidslichaam
      met of zonder rechtspersoonlijkheid;
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.1.x
    text: |-
      staat van ontwerp: staat die rechtsmacht heeft over de organisatie die verantwoordelijk is voor het ontwerp van
      een luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.1.y
    text: |-
      staat van vervaardiging: staat, die rechtsmacht heeft over de organisatie, die verantwoordelijk is voor de
      vervaardiging van een luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.1.z
    text: |-
      staat van het voorval: staat op of boven het grondgebied waarvan, de territoriale wateren daaronder begrepen, een
      ongeval of incident plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.1.aa
    text: |-
      staat van de exploitant: staat waarin de exploitant van een luchtvaartuig zijn voornaamste plaats van bedrijvigheid
      heeft of, bij gebreke daarvan, de exploitant is gevestigd;
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.1.bb
    text: |-
      staat met aanmerkelijk belang: in geval van een ongeval of incident met een zeeschip, staat die tot een van de bij
      ministeriële regeling aangewezen categorieën behoort;
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.1.cc
    text: |-
      vluchtrecorder: elk soort, ter vergemakkelijking van onderzoeken van ongevallen en incidenten, in het luchtvaartuig
      geïnstalleerd registratietoestel.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: '1.2'
    text: |-
      Deze wet is niet van toepassing op een ongeval of incident waarbij geen ander schip, luchtvaartuig of voertuig is
      betrokken dan een schip, luchtvaartuig of voertuig dat in gebruik is ten behoeve van Onze Minister van Defensie dan
      wel van een buitenlandse krijgsmacht.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: '1.3'
    text: |-
      Met een Nederlands luchtvaartuig wordt gelijkgesteld een luchtvaartuig dat door een in Nederland gevestigde
      onderneming wordt geëxploiteerd.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: '1.4'
    text: 'Het bepaalde bij of krachtens deze wet ten aanzien van de staat van de exploitant is slechts van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.4.a
    text: |-
      het betrokken luchtvaartuig is geleasd door, gecharterd door of de beschikking daarover door uitwisseling is
      verkregen door een staat die niet tevens de staat is waar het luchtvaartuig is ingeschreven, en
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: 1.4.b
    text: |-
      deze staat, geheel of gedeeltelijk, de functies en verplichtingen van de laatstbedoelde staat, die voortvloeien uit
      annex 13 bij het op 7 december 1994 te Chicago tot stand gekomen Verdrag inzake de internationale burgerluchtvaart
      (Trb. 1973, 109), vervult.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel1
  - number: '2.1'
    text: Er is een Raad voor de Transportveiligheid.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel2
  - number: '2.2'
    text: De raad bezit rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel2
  - number: '2.3'
    text: De raad is gevestigd te Den Haag.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel2
  - number: '3.1'
    text: |-
      De raad heeft, met het uitsluitende doel toekomstige ongevallen of incidenten te voorkomen, tot taak te
      onderzoeken en vast te stellen wat de oorzaken of vermoedelijke oorzaken van individuele of categorieën
      ongevallen en incidenten zijn en, indien de uitkomsten van een en ander daartoe aanleiding geven, daaraan
      veiligheidsaanbevelingen te verbinden.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel3
  - number: '3.2'
    text: 'De raad stelt een onderzoek in naar ongevallen en ernstige incidenten met:'
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel3
  - number: 3.2.a
    text: luchtvaartuigen op of boven Nederlands grondgebied met inbegrip van de territoriale zee;
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel3
  - number: 3.2.b
    text: Nederlandse luchtvaartuigen boven volle zee;
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel3
  - number: 3.2.c
    text: |-
      Nederlandse luchtvaartuigen in het buitenland, indien de betrokken staat geen onderzoek instelt, indien deze het
      onderzoek aan de Nederlandse autoriteiten overlaat of indien niet kan worden vastgesteld dat de plaats van het
      voorval binnen het grondgebied van enige staat ligt en niet met een andere staat wordt overeengekomen dat deze het
      onderzoek verricht.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel3
  - number: '3.3'
    text: 'De raad stelt een onderzoek in naar ongevallen met:'
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel3
  - number: 3.3.a
    text: |-
      zeeschepen, varende in Europese wateren onder Nederlandse jurisdictie, met dien verstande dat indien bij het
      ongeval een schip is betrokken of het ongeval een schip betreft dat de vlag van een andere staat voert, het
      onderzoek uitgevoerd wordt in samenwerking met die andere staat tenzij die daaraan geen medewerking verleent;
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel3
  - number: 3.3.b
    text: |-
      Nederlandse zeeschepen, varende in wateren onder andere dan Nederlandse jurisdictie, met dien verstande dat indien
      de met betrekking tot die wateren bevoegde staat, de Nederlandse Antillen of Aruba een onderzoek instelt, het
      onderzoek uitgevoerd wordt in samenwerking met die andere staat, de Nederlandse Antillen onderscheidenlijk Aruba
      tenzij die daaraan geen medewerking verleent, en indien bij het ongeval tevens een ander schip betrokken is en de
      staat waarvan dat schip de vlag voert een onderzoek instelt, het onderzoek in samenwerking met die staat uitgevoerd
      wordt tenzij die daaraan geen medewerking verleent;
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel3
  - number: 3.3.c
    text: |-
      Nederlandse zeeschepen, varende op volle zee, met dien verstande dat indien het ongeval verlies van het leven van
      of ernstig letsel aan onderdanen van een andere staat of ernstige schade aan schepen of installaties van een andere
      staat heeft veroorzaakt, het onderzoek uitgevoerd wordt in samenwerking met die andere staat tenzij die daaraan
      geen medewerking verleent;
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel3
  - number: 3.3.d
    text: andere schepen dan zeeschepen, varende in Europese wateren onder Nederlandse jurisdictie.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel3
  - number: '3.4'
    text: |-
      De raad kan een onderzoek naar een incident dat niet een ernstig incident met een luchtvaartuig is, alleen
      instellen voorzover dat van belang kan zijn voor het doen van veiligheidsaanbevelingen.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel3
  - number: '3.5'
    text: |-
      De raad kan een onderzoek naar een wegenverkeersongeval alleen instellen voorzover dat van belang kan zijn voor het
      doen van veiligheidsaanbevelingen.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel3
  - number: '3.6'
    text: |-
      De raad kan het onderzoek naar een luchtvaartongeval of een ernstig incident met een ander dan een Nederlands
      luchtvaartuig geheel of gedeeltelijk overlaten aan de staat waar het luchtvaartuig is ingeschreven of de staat van
      de exploitant indien deze naar zijn oordeel op voldoende deskundige wijze het onderzoek zal verrichten.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel3
  - number: '4'
    text: 'Onder de raad ressorteren vier kamers, te weten:'
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel4
  - number: 4.a
    text: een kamer voor scheepvaartongevallen,
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel4
  - number: 4.b
    text: een kamer voor luchtvaartongevallen,
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel4
  - number: 4.c
    text: een kamer voor spoorwegongevallen en
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel4
  - number: 4.d
    text: een kamer voor wegenverkeersongevallen.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel4
  - number: '5'
    text: De raad bestaat uit ten minste veertien en ten hoogste zeventien leden, de voorzitter daaronder begrepen.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel5
  - number: '6.1'
    text: Elke kamer van de raad bestaat uit ten hoogste vijf leden, de voorzitter daaronder begrepen.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel6
  - number: '6.2'
    text: Voor elke kamer worden ten hoogste vijf plaatsvervangende leden benoemd.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel6
  - number: '7.1'
    text: |-
      De leden van de raad en van de kamers worden bij koninklijk besluit benoemd, geschorst en ontslagen, de raad
      gehoord.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel7
  - number: '7.2'
    text: |-
      De keuze van de leden geschiedt op zodanige wijze dat alle relevante deskundigheid in de raad en in de kamers
      aanwezig is. Bij algemene maatregel van bestuur worden terzake nadere regels gesteld.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel7
  - number: '7.3'
    text: |-
      De benoeming geschiedt voor een periode van vier jaar. De leden van de raad en van de kamers kunnen worden
      herbenoemd.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel7
  - number: '7.4'
    text: |-
      Op eigen verzoek wordt aan de leden ontslag verleend uiterlijk met ingang van de eerste dag van de derde
      kalendermaand na de dag waarop Onze Minister het verzoek om ontslag heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel7
  - number: '7.5'
    text: |-
      Het eerste tot en met het vierde lid zijn van overeenkomstige toepassing op de plaatsvervangende leden van de
      kamers.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel7
  - number: '8.1'
    text: Een van de leden van de raad wordt bij koninklijk besluit benoemd tot voorzitter.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel8
  - number: '8.2'
    text: De raad wijst één van de leden van de raad aan als plaatsvervangend voorzitter van de raad.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel8
  - number: '8.3'
    text: Een lid is niet tegelijkertijd voorzitter van de raad en van een van de kamers.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel8
  - number: '9.1'
    text: Van elk van de kamers wordt een der leden bij koninklijk besluit benoemd tot voorzitter.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel9
  - number: '9.2'
    text: Een kamer wijst één van zijn leden aan als plaatsvervangend voorzitter.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel9
  - number: '10'
    text: Van elk der kamers zijn de voorzitter en een of twee andere leden tevens lid van de raad.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel10
  - number: '11'
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel11
  - number: 11.a
    text: |-
      de wijze van beëdiging van de voorzitter en de overige leden van de raad alsmede van de voorzitters, de overige
      leden en de plaatsvervangende leden van de kamers;
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel11
  - number: 11.b
    text: de vergoeding, waaronder de vergoeding van reis- en verblijfkosten, van de onder a bedoelde personen.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel11
  - number: '12.1'
    text: Aan de raad is een secretaris verbonden.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel12
  - number: '12.2'
    text: |-
      Aan de raad wordt een bureau toegevoegd. Van het bureau maakt voor elke vervoerssector waarvoor een kamer is
      ingesteld, ten minste één deskundige deel uit.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel12
  - number: '12.3'
    text: De secretaris geeft leiding aan het bureau.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel12
  - number: '13.1'
    text: |-
      De secretaris noch een van de medewerkers van het bureau, genoemd in [artikel 12, tweede lid][ref1], is lid van de
      raad of van één van de kamers.


      [ref1]: https://wetten.overheid.nl/BWBR0009753#Artikel12
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009753
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '13.2'
    text: De secretaris is voor de uitoefening van zijn taak uitsluitend verantwoording schuldig aan de raad.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel13
  - number: '14.1'
    text: |-
      Onze Minister kan op verzoek van de raad een of meer onder hem ressorterende deskundigen aanwijzen, die met
      inachtneming van de door of namens een kamer gegeven aanwijzingen de kamer tijdens het verrichten van een nader
      aangeduid onderzoek bijstaan.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel14
  - number: '14.2'
    text: |-
      De personen, aangewezen op grond van het eerste lid, vallen tijdens het verrichten van het betrokken onderzoek
      onder de verantwoordelijkheid van de betrokken kamer.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel14
  - number: '15.1'
    text: |-
      De medewerkers van het bureau, genoemd in [artikel 12, tweede lid][ref1], alsmede de op grond van
      [artikel 14, eerste lid][ref2], benoemde personen melden onverwijld aan de voorzitter van de betrokken kamer dat
      het onderzoek:


      [ref1]: https://wetten.overheid.nl/BWBR0009753#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0009753#Artikel14
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009753
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009753
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 15.1.a
    text: henzelf of hun bloed- of aanverwanten tot en met de vierde graad aangaat dan wel,
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel15
  - number: 15.1.b
    text: instellingen of rechtspersonen betreft bij welke zij werkzaam zijn of belang hebben.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel15
  - number: '15.2'
    text: |-
      Indien de voorzitter van een kamer op grond van het eerste lid daarom verzoekt vervangt Onze Minister in het
      betreffende onderzoek een of meer personen benoemd op grond van [artikel 14, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009753#Artikel14
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009753
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '16'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de bezoldiging en de vergoeding van
      reis- en verblijfkosten van de op grond van [artikel 14, eerste lid][ref1], aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0009753#Artikel14
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009753
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '17.1'
    text: |-
      De rechtspositie van de secretaris en de medewerkers van het bureau, genoemd in [artikel 12, tweede lid][ref1], is
      in overeenstemming met de regels die gelden voor ambtenaren die zijn aangesteld bij ministeries, met dien verstande
      dat waar in deze regels een bevoegdheid is toegekend aan een andere minister dan Onze Minister van Binnenlandse
      Zaken, deze bevoegdheid wordt uitgeoefend door het bestuur van de raad, bedoeld in [artikel 20][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009753#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0009753#Artikel20
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0009753
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009753
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '17.2'
    text: Bij algemene maatregel van bestuur kan worden afgeweken van de in het eerste lid genoemde regels.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel17
  - number: '18.1'
    text: De leden van de raad en van de kamers hebben zitting zonder last.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel18
  - number: '18.2'
    text: 'De leden van de raad en van de kamers onthouden zich van deelneming aan de behandeling van een onderzoek, dat:'
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel18
  - number: 18.2.a
    text: henzelf of hun bloed- of aanverwanten tot en met de vierde graad aangaat dan wel,
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel18
  - number: 18.2.b
    text: instellingen of rechtspersonen betreft bij welke zij werkzaam zijn of belang hebben.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel18
  - number: '18.3'
    text: Het eerste en het tweede lid zijn van overeenkomstige toepassing op de plaatsvervangende leden van de kamers.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel18
  - number: '19.1'
    text: |-
      De raad stelt, binnen een half jaar na zijn instelling, onder goedkeuring van Onze Minister, een bestuursreglement
      vast.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel19
  - number: '19.2'
    text: |-
      De goedkeuring, bedoeld in het eerste lid, kan worden onthouden wegens strijd met het recht of wegens het feit
      dat voorschriften van het reglement naar het oordeel van Onze Minister nadelig zouden zijn voor een doelmatig
      functioneren van de raad.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel19
  - number: '20'
    text: De voorzitter van de raad en de voorzitters van de kamers vormen tezamen het bestuur van de raad.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel20
  - number: '21'
    text: |-
      De raad wordt in en buiten rechte vertegenwoordigd door de voorzitter van de raad en, bij afwezigheid van deze,
      door de plaatsvervangend voorzitter van de raad.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel21
  - number: '22.1'
    text: |-
      De inkomsten van de raad bestaan uit een jaarlijkse bijdrage ten laste van de begroting voor het Ministerie van
      Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel22
  - number: '22.2'
    text: |-
      Indien bijzondere omstandigheden dit noodzakelijk maken, kunnen aan de raad additionele middelen ter beschikking
      worden gesteld.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel22
  - number: '23.1'
    text: |-
      Het bestuur van de raad stelt vóór 1 november een begroting vast voor het volgende boekjaar alsmede een financieel
      meerjarenbeleidsplan.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel23
  - number: '23.2'
    text: De begroting en het financieel meerjarenbeleidsplan behoeven de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel23
  - number: '23.3'
    text: |-
      De goedkeuring, bedoeld in het tweede lid, kan worden onthouden wegens strijd met het recht of wegens het feit
      dat middelen, uitgaande van het onderzoeksprogramma van de raad, naar het oordeel van Onze Minister niet doelmatig
      zouden worden besteed.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel23
  - number: '24.1'
    text: |-
      Het bestuur van de raad brengt jaarlijks aan Onze Minister vóór 1 april een financieel verslag uit, dat vergezeld
      gaat van een verklaring omtrent de getrouwheid en de rechtmatigheid, afgegeven door een accountant als bedoeld in
      [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '24.2'
    text: De raad stelt de in het eerste lid bedoelde stukken algemeen verkrijgbaar.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel24
  - number: '25'
    text: |-
      Bij ministeriële regeling worden voorschriften gesteld over de inrichting van de begroting, het financiële
      meerjarenbeleidsplan en aandachtspunten voor de accountantscontrole.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel25
  - number: '26.1'
    text: |-
      De raad stelt jaarlijks vóór 1 juli een verslag op van de werkzaamheden, het gevoerde beleid in het algemeen
      en de doelmatigheid en doeltreffendheid van zijn werkzaamheden en werkwijze in het bijzonder in het afgelopen
      kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel26
  - number: '26.2'
    text: |-
      In het jaarverslag wordt in ieder geval een overzicht gepubliceerd van de onderzochte ongevallen of incidenten, de
      conclusies daaromtrent in de eindrapporten en de daaraan verbonden veiligheidsaanbevelingen. Het jaarverslag bevat
      tevens het onderzoeksprogramma van de raad.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel26
  - number: '26.3'
    text: Het jaarverslag wordt aan Onze Minister toegezonden en algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel26
  - number: '27.1'
    text: |-
      De raad verstrekt desgevraagd Onze Minister de voor de uitoefening van diens taak benodigde inlichtingen. Onze
      Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de vervulling van zijn taak
      redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel27
  - number: '27.2'
    text: Onze Minister verstrekt de raad de inlichtingen die deze voor zijn taakuitoefening nodig heeft.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel27
  - number: '27.3'
    text: |-
      Onze Minister stelt een informatiestatuut vast. Het informatiestatuut bevat inhoudelijke en procedurele
      voorschriften met betrekking tot het informatieverkeer tussen Onze Minister en de raad dat voor een goede
      uitvoering van deze wet noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel27
  - number: '28.1'
    text: |-
      Bij algemene maatregel van bestuur worden de personen of instanties aangewezen, die verplicht zijn tot het melden
      van bij die aanwijzing aangeduide ongevallen en ernstige incidenten.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel28
  - number: '28.2'
    text: |-
      De in het eerste lid bedoelde aanwijzing kan ook betrekking hebben op de melding van een incident met uitzondering
      van een incident als bedoeld in [artikel 1, eerste lid, onderdeel o, onder 5°][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009753#Artikel1
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0009753
        artikel: '1'
        hoofdstuk: '1'
  - number: '28.3'
    text: |-
      De melding geschiedt aan de raad en bevat in elk geval de aanduiding van de plaats van het ongeval of het incident,
      de aard daarvan, de gevolgen wat betreft schade en letsel, de omstandigheden waaronder het ongeval of incident
      heeft plaatsgevonden, alsmede de bij algemene maatregel van bestuur te bepalen gegevens. De raad geeft de melding
      door aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel28
  - number: '28.4'
    text: |-
      De verplichting tot melding, bedoeld in het eerste en het tweede lid is niet van toepassing op de krachtens het
      eerste lid aangewezen personen, voorzover zij weten dat één van de andere krachtens het eerste lid aangewezen
      personen melding heeft gemaakt van het in het eerste lid bedoelde ongeval of van het in het tweede lid bedoelde
      incident.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel28
  - number: '28.5'
    text: |-
      De verplichting tot melding, bedoeld in het eerste en tweede lid, is evenmin van toepassing in de bij algemene
      maatregel van bestuur aangeduide gevallen waarin reeds krachtens een andere wettelijke regeling een verplichting
      tot melding bestaat. Bij deze algemene maatregel van bestuur kan tevens worden bepaald dat de instantie waaraan de
      melding in die gevallen plaatsvindt, deze in de daarbij te bepalen mate van gedetailleerdheid moet doorgeven aan de
      raad. De raad geeft deze meldingen door aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel28
  - number: '29.1'
    text: |-
      Indien een melding een ongeval of ernstig incident met een luchtvaartuig op of boven het Nederlandse grondgebied,
      met inbegrip van de territoriale zee, betreft, doet Onze Minister terzake zo spoedig mogelijk een melding toekomen
      aan:
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel29
  - number: 29.1.a
    text: de staat waar het luchtvaartuig is ingeschreven;
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel29
  - number: 29.1.b
    text: de staat van de exploitant;
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel29
  - number: 29.1.c
    text: de staat van ontwerp;
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel29
  - number: 29.1.d
    text: de staat van vervaardiging;
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel29
  - number: 29.1.e
    text: |-
      de staat waarvan onderdanen bij het ongeval of incident zijn omgekomen of zwaar lichamelijk letsel hebben opgelopen
      en
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel29
  - number: 29.1.f
    text: |-
      indien het gaat om een luchtvaartuig met een startmassa van meer dan 2250 kg, de internationale
      burgerluchtvaartorganisatie.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel29
  - number: '29.2'
    text: |-
      Indien een melding een ander ernstig incident met een luchtvaartuig dan bedoeld in het eerste lid betreft doet
      Onze Minister terzake een melding toekomen aan de onder c en d bedoelde staten alsmede aan de staat op of boven het
      grondgebied waarvan, met inbegrip van de territoriale zee, het incident zich heeft voorgedaan.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel29
  - number: '29.3'
    text: |-
      Bij ministeriële regeling worden nadere voorschriften gegeven omtrent de in het eerste en het tweede lid bedoelde
      melding.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel29
  - number: '30.1'
    text: |-
      Indien een melding een ongeval of een incident met een zeeschip in de Europese wateren onder Nederlandse
      jurisdictie betreft, doet Onze Minister terzake zo spoedig mogelijk een melding toekomen aan de staat waarvan het
      schip de vlag voert. Hij vermeldt daarbij tevens welke actie door Nederland wordt voorgesteld.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel30
  - number: '30.2'
    text: Bij ministeriële regeling worden nadere voorschriften gegeven omtrent de in het eerste lid bedoelde melding.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel30
  - number: '31.1'
    text: |-
      De burgemeester draagt er zorg voor dat de situatie ter plaatse van een ongeval niet wordt gewijzigd dan na overleg
      met de voorzitter van de betrokken kamer of degene die door deze is aangewezen, tenzij uit een oogpunt van openbare
      orde en veiligheid, van de bescherming van leven en gezondheid van personen en dieren, van de bescherming van het
      milieu of van de beperking van de schade, het treffen van maatregelen onverwijld geboden is.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel31
  - number: '31.2'
    text: Bij algemene maatregel van bestuur kunnen terzake van het bepaalde in het eerste lid nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel31
  - number: '31.3'
    text: Het eerste lid is niet van toepassing op een wegenverkeersongeval en op een scheepvaartongeval.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel31
  - number: '32.1'
    text: |-
      De overblijfselen van een vervoermiddel dat bij een ongeval betrokken is, alsmede daarbij aangetroffen voorwerpen
      afkomstig uit het vervoermiddel blijven ter beschikking van de kamer voor de duur van het onderzoek of zoveel
      korter of langer als de kamer nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel32
  - number: '32.2'
    text: |-
      Het is een ieder verboden onbevoegdelijk overblijfselen van een vervoermiddel dat bij een ongeval betrokken is, bij
      een ongeval weg te nemen of op andere wijze aan het onderzoek te onttrekken.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel32
  - number: '32.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen terzake van het bepaalde in het eerste lid en terzake van de
      teruggave van zaken nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel32
  - number: '32.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot van overheidswege
      te verlenen bijstand bij het weer ter beschikking krijgen van overblijfselen als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel32
  - number: '32.5'
    text: Het eerste en tweede lid gelden niet voor wegenverkeersongevallen.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel32
  - number: '33'
    text: |-
      In deze paragraaf wordt verstaan onder een onderzoeker: de leden en de plaatsvervangende leden van een kamer, de
      medewerkers van het bureau, genoemd in [artikel 12, tweede lid][ref1], voorzover als zodanig bij hun aanstelling
      aangewezen, en de op grond van [artikel 14, eerste lid][ref2], benoemde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0009753#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0009753#Artikel14
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0009753
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009753
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '34.1'
    text: |-
      Bij de uitoefening van zijn taak draagt een onderzoeker een legitimatiebewijs bij zich, dat is uitgegeven door
      de raad.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel34
  - number: '34.2'
    text: Een onderzoeker toont zijn legitimatiebewijs desgevraagd aanstonds.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel34
  - number: '34.3'
    text: Het legitimatiebewijs bevat een foto van de onderzoeker en vermeldt in ieder geval zijn naam en hoedanigheid.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel34
  - number: '35'
    text: |-
      Een onderzoeker maakt van zijn bevoegdheden slechts gebruik voor zover dat redelijkerwijs voor de vervulling van
      zijn taak nodig is.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel35
  - number: '36'
    text: |-
      Onze Minister kan algemene aanwijzingen geven voor de uitoefening van de aan een onderzoeker toekomende
      bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel36
  - number: '37.1'
    text: |-
      Een onderzoeker is bevoegd, met medeneming van de benodigde apparatuur, elke plaats te betreden, met inbegrip van
      het woongedeelte van een schip. Een woning niet aan boord van een schip wordt slechts betreden met toestemming van
      de bewoner.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel37
  - number: '37.2'
    text: Zo nodig verschaft hij zich toegang met behulp van de sterke arm.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel37
  - number: '37.3'
    text: Hij is bevoegd zich te doen vergezellen door personen die daartoe door hem zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel37
  - number: '37.4'
    text: |-
      De bevoegdheid, bedoeld in het eerste en derde lid, wordt met betrekking tot militaire luchtvaartterreinen,
      die krachtens hun aanwijzing of een terzake verleende ontheffing mede door burgerluchtvaartuigen mogen worden
      gebruikt, en met betrekking tot gedeelten van militaire fabrieken, werkplaatsen en aangehorigheden, waar zich
      burgerluchtvaartuigen bevinden, uitgeoefend in overeenstemming met Onze Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel37
  - number: '38.1'
    text: Een onderzoeker is bevoegd inlichtingen te vorderen.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel38
  - number: '38.2'
    text: Een onderzoeker is bevoegd inzage te vorderen van zakelijke gegevens en bescheiden.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel38
  - number: '38.3'
    text: Hij is bevoegd van de gegevens en bescheiden kopieën te maken.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel38
  - number: '38.4'
    text: |-
      Indien het maken van kopieën niet ter plaatse kan geschieden, is hij bevoegd de gegevens en bescheiden voor dat
      doel korte tijd mee te nemen tegen een door hem af te geven schriftelijk bewijs.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel38
  - number: '39.1'
    text: Een onderzoeker is bevoegd zaken te onderzoeken, aan opneming te onderwerpen en daarvan monsters te nemen.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel39
  - number: '39.2'
    text: Hij is bevoegd daartoe verpakkingen te openen.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel39
  - number: '39.3'
    text: |-
      Indien het onderzoek, de opneming of de monsterneming niet ter plaatse kan geschieden, is hij bevoegd de zaken voor
      dat doel mee te nemen tegen een door hem af te geven schriftelijk bewijs.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel39
  - number: '39.4'
    text: De genomen monsters worden voor zover mogelijk teruggegeven.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel39
  - number: '40.1'
    text: |-
      Een ieder is verplicht aan een onderzoeker alle medewerking te verlenen die deze redelijkerwijs kan vorderen bij de
      uitoefening van zijn bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel40
  - number: '40.2'
    text: |-
      Zij die uit hoofde van ambt, beroep of wettelijk voorschrift verplicht zijn tot geheimhouding kunnen het verlenen
      van medewerking weigeren, voor zover dit uit hun geheimhoudingsplicht voortvloeit.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel40
  - number: '40.3'
    text: |-
      Van het verlenen van medewerking kunnen zich verschonen zij die daardoor zichzelf of een van hun bloed- of
      aanverwanten in de rechte lijn of in de zijlijn in de tweede of derde graad of hun echtgenoot of vroegere
      echtgenoot dan wel geregistreerde partner of vroegere geregistreerde partner aan het gevaar van een
      strafrechtelijke veroordeling of een nadelige civielrechtelijke uitspraak zouden blootstellen.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel40
  - number: '41.1'
    text: De raad besluit tot het instellen van een onderzoek.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel41
  - number: '41.2'
    text: |-
      De raad kan daarbij aspecten aanwijzen die moeten worden onderzocht. In geval van een onderzoek als bedoeld in
      [artikel 3, tweede of derde lid][ref1], kan deze aanwijzing geen limitatief karakter hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0009753#Artikel3
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0009753
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '41.3'
    text: De raad stelt Onze Minister in kennis van het besluit tot het instellen van een onderzoek.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel41
  - number: '42.1'
    text: |-
      Het onderzoek wordt verricht door de kamer die voor de betrokken vervoerssector is ingesteld. Indien
      vervoerssectoren die onder meer dan één kamer vallen, zijn betrokken, treft de raad terzake een voorziening.
      Hij treft daarbij mede een voorziening terzake van de verplichtingen en bevoegdheden die aan een kamer bij de
      uitvoering van een onderzoek toekomen.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel42
  - number: '42.2'
    text: |-
      De kamer wordt in het onderzoek bijgestaan door het bureau, genoemd in [artikel 12, tweede lid][ref1], en, in
      voorkomende gevallen, door personen als bedoeld in [artikel 14, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009753#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0009753#Artikel14
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0009753
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009753
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '42.3'
    text: |-
      De raad kan bepalen dat het onderzoek naar een incident wordt uitbesteed aan een instantie, die het onderzoek onder
      toezicht van de betrokken kamer uitvoert. De raad voorziet in dat geval in, door Onze Minister goed te keuren,
      garanties voor de onafhankelijkheid van het onderzoek.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel42
  - number: '43.1'
    text: |-
      Indien een onderzoek wordt ingesteld terzake van een ongeval of ernstig incident met een Nederlands luchtvaartuig
      met een startmassa van meer dan 2250 kg zendt de raad zo spoedig mogelijk een melding terzake aan:
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel43
  - number: 43.1.a
    text: de staat van de exploitant,
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel43
  - number: 43.1.b
    text: de staat van ontwerp,
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel43
  - number: 43.1.c
    text: de staat van vervaardiging en
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel43
  - number: 43.1.d
    text: de internationale burgerluchtvaartorganisatie.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel43
  - number: '43.2'
    text: Bij ministeriële regeling worden nadere voorschriften gesteld omtrent de in het eerste lid bedoelde melding.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel43
  - number: '44.1'
    text: |-
      Indien een onderzoek wordt ingesteld terzake van een ongeval met een zeeschip zendt de raad zo spoedig mogelijk een
      melding terzake aan de staten met aanmerkelijk belang.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel44
  - number: '44.2'
    text: Bij ministeriële regeling kunnen nadere voorschriften worden gesteld omtrent de in het eerste lid bedoelde melding.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel44
  - number: '45.1'
    text: |-
      De raad kan toestaan dat op verzoek van een staat één of meer gevolmachtigde vertegenwoordigers aan het onderzoek
      deelnemen. De raad kan ook een dergelijk verzoek tot een andere staat richten.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel45
  - number: '45.2'
    text: De vertegenwoordigers kunnen zich door deskundigen doen bijstaan.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel45
  - number: '45.3'
    text: |-
      De vertegenwoordigers en deskundigen hebben toegang tot de tijdens het onderzoek vergaarde gegevens en informatie,
      mits zij zich tot geheimhouding verplichten en zij in de staten die zij vertegenwoordigen, niet aan een ruimere
      openbaarheid van gegevens zijn gehouden dan ingevolge deze wet mogelijk is. Zij geven aan de raad alle relevante
      informatie die zij ter beschikking hebben.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel45
  - number: '45.4'
    text: |-
      Bij ministeriële regeling wordt bepaald in welke gevallen de raad in verband met internationale afspraken verplicht
      is toepassing te geven aan het eerste lid. Bij ministeriële regeling wordt eveneens bepaald in welke gevallen de
      raad verplicht is een uitnodiging te doen tot een verzoek als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel45
  - number: '45.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de bevoegdheden van de
      gevolmachtigde vertegenwoordigers en de deskundigen die hen bijstaan.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel45
  - number: '46'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nader aan te duiden rechten terzake van een onderzoek worden
      toegekend aan een staat waarvan burgers dodelijk of ernstig letsel hebben bekomen.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel46
  - number: '47'
    text: |-
      De raad is bevoegd ten behoeve van het onderzoek naar een luchtvaartongeval, naar een ernstig incident of naar een
      incident met een luchtvaartuig, de bijstand in te roepen van instanties en organisaties uit de andere lidstaten
      van de Europese Unie of een van de overige staten die partij zijn bij de Overeenkomst betreffende de Europese
      Economische Ruimte voor het beschikbaar stellen van:
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel47
  - number: 47.a
    text: 'installaties, voorzieningen en apparatuur voor:'
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel47
  - number: 47.a.1°
    text: het technische onderzoek van wrakstukken en boordapparatuur en andere voor het onderzoek belangrijke voorwerpen,
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel47
  - number: 47.a.2°
    text: de verwerking van informatie afkomstig van vluchtrecorders en
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel47
  - number: 47.a.3°
    text: de elektronische opslag en verwerking van gegevens over luchtvaartongevallen;
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel47
  - number: 47.b
    text: |-
      deskundigen die gespecialiseerd zijn in onderzoek naar ongevallen of incidenten, teneinde hun welomschreven
      werkzaamheden toe te vertrouwen en zulks uitsluitend bij een onderzoek naar aanleiding van een belangrijk
      luchtvaartongeval.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel47
  - number: '48.1'
    text: |-
      Binnen dertig dagen na de datum van een ongeval met een luchtvaartuig met een startmassa van meer dan 2250 kg
      waarnaar de raad een onderzoek instelt, wordt, voorzover van toepassing, door de kamer een voorlopig bericht
      toegezonden aan:
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel48
  - number: 48.1.a
    text: de staat van registratie,
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel48
  - number: 48.1.b
    text: de staat van ontwerp,
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel48
  - number: 48.1.c
    text: de staat van vervaardiging,
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel48
  - number: 48.1.d
    text: de staat van de exploitant,
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel48
  - number: 48.1.e
    text: |-
      de staat die overeenkomstig [artikel 45][ref1] betrokken is bij het onderzoek of relevante informatie of
      faciliteiten heeft verstrekt,


      [ref1]: https://wetten.overheid.nl/BWBR0009753#Artikel45
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0009753
        artikel: '45'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 48.1.f
    text: de staat waar het ongeval heeft plaatsgevonden,
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel48
  - number: 48.1.g
    text: de internationale burgerluchtvaartorganisatie;
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel48
  - number: '48.2'
    text: |-
      Bij ongevallen of ernstige incidenten met luchtvaartuigen met een startmassa van 2250 kg of minder, waarnaar de
      raad een onderzoek instelt, kan de raad besluiten een voorlopig bericht toe te zenden aan de staten, genoemd in het
      eerste lid, onder a tot en met f.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel48
  - number: '48.3'
    text: |-
      Bij ministeriële regeling worden nadere voorschriften gesteld omtrent het voorlopige bericht, bedoeld in het eerste
      en het tweede lid.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel48
  - number: '48.4'
    text: Het voorlopig bericht is niet openbaar.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel48
  - number: '49.1'
    text: |-
      Zo spoedig mogelijk zendt de kamer, ingeval een onderzoek een ongeval met een luchtvaartuig met een startmassa van
      meer dan 2250 kg betreft, het rapport met de uit het onderzoek naar voren gekomen gegevens betreffende het ongeval
      naar de internationale burgerluchtvaartorganisatie.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel49
  - number: '49.2'
    text: Het rapport, bedoeld in het eerste lid, is niet openbaar.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel49
  - number: '49.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing indien een onderzoek een ernstig incident met een
      luchtvaartuig met een startmassa van meer dan 5700 kg betreft, indien het onderzoek zaken aan het licht heeft
      gebracht die van betekenis kunnen worden geacht voor andere staten.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel49
  - number: '50.1'
    text: De kamer kan een zitting houden.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel50
  - number: '50.2'
    text: 'Van plaats, dag en uur van de zitting doet de kamer schriftelijk mededeling aan:'
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel50
  - number: 50.2.a
    text: Onze Minister,
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel50
  - number: 50.2.b
    text: de betrokkenen en
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel50
  - number: 50.2.c
    text: de vertegenwoordigers van de staten die aan het onderzoek deelnemen.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel50
  - number: '50.3'
    text: Plaats, dag en uur van de zitting worden eveneens bekend gemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel50
  - number: '51'
    text: |-
      Indien de kamer besluit een zitting te houden, hebben betrokkenen het recht de op het ongeval of incident
      betrekking hebbende stukken in te zien en daarvan afschrift te maken. Zij zijn anders dan ter voorbereiding van de
      behandeling ter zitting tot geheimhouding van deze informatie verplicht.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel51
  - number: '52.1'
    text: De kamer houdt zitting in het openbaar.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel52
  - number: '52.2'
    text: |-
      De kamer kan om gewichtige redenen besluiten de behandeling van een zaak of een gedeelte daarvan niet in het
      openbaar te houden.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel52
  - number: '52.3'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld omtrent de orde van behandeling van zaken door
      een kamer.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel52
  - number: '53.1'
    text: |-
      De voorzitter van de kamer roept de personen die hij als getuige of deskundige wenst te horen, op. Zonodig kan de
      voorzitter van een kamer de oproepingen bij deurwaardersexploot doen betekenen. Tussen de dag waarop de oproeping
      is betekend en die van de zitting liggen ten minste twee weken.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel53
  - number: '53.2'
    text: Een ieder die als getuige of deskundige is opgeroepen, is verplicht voor de kamer te verschijnen.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel53
  - number: '53.3'
    text: |-
      Indien de getuige of deskundige aan wie de oproeping is betekend, niet verschijnt, wordt daarvan proces-verbaal
      opgemaakt, hetwelk een nauwkeurige beschrijving van de oproeping bevat en door de voorzitter van de kamer wordt
      ondertekend.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel53
  - number: '53.4'
    text: |-
      Het proces-verbaal van niet-verschijning levert behoudens tegenbewijs, volledig bewijs op van hetgeen daarin staat
      vermeld.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel53
  - number: '53.5'
    text: |-
      De voorzitter van een kamer kan de officier van justitie bij de rechtbank binnen welker rechtsgebied de raad
      zitting houdt, verzoeken de getuige of deskundige bij niet verschijnen ter zitting van de kamer te dagvaarden en
      daarbij te voegen een bevel tot medebrenging.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel53
  - number: '53.6'
    text: |-
      Betrokkenen hebben het recht op hun verzoek als getuigen ter zitting te worden gehoord indien zij niet door de
      kamer zijn opgeroepen. Andere belanghebbenden kunnen op hun verzoek ter zitting worden gehoord.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel53
  - number: '54.1'
    text: |-
      De kamer kan het verhoor van een getuige, mits deze de leeftijd van zestien jaar heeft bereikt, niet doen
      plaatsvinden dan nadat deze eerst in handen van de voorzitter de eed of de belofte heeft afgelegd dat hij de gehele
      waarheid en niets dan de waarheid zal zeggen. Indien een getuige met gebrekkige ontwikkeling of ziekelijke storing
      van zijn geestesvermogens, naar het oordeel van de raad, de betekenis van de eed of de belofte niet voldoende
      beseft, wordt hij op straffe van nietigheid, niet beëdigd of hem de belofte afgenomen, maar wordt hij aangemaand de
      gehele waarheid en niets dan de waarheid te zeggen.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel54
  - number: '54.2'
    text: |-
      De kamer kan het verhoor van een deskundige niet doen plaatsvinden dan nadat deze eerst in handen van de voorzitter
      de eed of de belofte heeft afgelegd dat hij zijn verslag naar beste weten zal uitbrengen.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel54
  - number: '54.3'
    text: |-
      Getuigen en deskundigen zijn verplicht desgevraagd door de voorzitter van de kamer de eed of belofte te doen en
      getuigenis af te leggen of hun diensten als deskundige te verlenen, een en ander behoudens verschoning wegens
      ambts- of beroepsgeheim.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel54
  - number: '54.4'
    text: |-
      Van het geven van getuigenis of het beantwoorden van vragen kunnen zich verschonen zij die daardoor zichzelf of
      een van hun bloed- of aanverwanten in de rechte lijn of in de zijlijn in de tweede of derde graad of hun echtgenoot
      of vroegere echtgenoot dan wel geregistreerde partner of vroegere geregistreerde partner aan het gevaar van een
      strafrechtelijke veroordeling of een nadelige civielrechtelijke uitspraak zouden blootstellen.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel54
  - number: '54.5'
    text: |-
      Van het verhoor van getuigen en deskundigen wordt een proces-verbaal opgemaakt, dat door de voorzitter van de kamer
      en de secretaris wordt ondertekend.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel54
  - number: '55'
    text: |-
      De kamer kan aan de door de voorzitter opgeroepen getuigen en deskundigen en door de voorzitter aangewezen tolken
      een bij of krachtens algemene maatregel van bestuur vast te stellen schadeloosstelling toekennen.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel55
  - number: '56'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels omtrent het onderzoek van de kamer of een
      instantie als bedoeld in [artikel 42, derde lid][ref1], gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009753#Artikel42
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0009753
        artikel: '42'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '57.1'
    text: Ter afronding van zijn onderzoek stelt de kamer een rapport op.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel57
  - number: '57.2'
    text: 'Het rapport bevat:'
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel57
  - number: 57.2.a
    text: een analyse van de toedracht van het ongeval of van het incident alsmede de gegevens waarop deze analyse berust, en
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel57
  - number: 57.2.b
    text: de vaststelling van de oorzaken althans van de vermoedelijke oorzaken van het ongeval of van het incident.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel57
  - number: '57.3'
    text: |-
      Indien de kamer daartoe aanleiding ziet kan hij in het rapport aantekeningen opnemen omtrent door hem vermoede
      structurele veiligheidstekorten.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel57
  - number: '57.4'
    text: |-
      In het rapport worden de gegevens, bedoeld in [artikel 74][ref1], slechts opgenomen voorzover zij wezenlijk zijn
      voor de analyse van de toedracht van het ongeval of het incident.


      [ref1]: https://wetten.overheid.nl/BWBR0009753#Artikel74
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0009753
        artikel: '74'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: '58.1'
    text: De kamer doet het rapport toekomen aan de raad.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel58
  - number: '58.2'
    text: |-
      Indien de kamer geen zitting heeft gehouden, zendt hij het rapport tevens aan de betrokkenen. Deze kunnen
      schriftelijk commentaar leveren gedurende een termijn van dertig dagen, die aanvangt met ingang van de dag na die
      waarop het rapport is verzonden. Zij zijn tot geheimhouding van het rapport verplicht.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel58
  - number: '58.3'
    text: Indien ingevolge het tweede lid ontvangen commentaar daartoe aanleiding geeft, kan de kamer het rapport aanpassen.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel58
  - number: '58.4'
    text: Het rapport alsmede de documenten die zijn benut voor de vaststelling daarvan, zijn niet openbaar.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel58
  - number: '59.1'
    text: |-
      De raad beziet, in overleg met de kamer, of het rapport van de kamer aanleiding geeft tot het signaleren van
      structurele veiligheidstekorten en het formuleren van veiligheidsaanbevelingen.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel59
  - number: '59.2'
    text: De raad stelt het eindrapport vast.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel59
  - number: '59.3'
    text: 'Het eindrapport bevat:'
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel59
  - number: 59.3.a
    text: een analyse van de toedracht van het ongeval of van het incident, alsmede de gegevens waarop deze analyse berust,
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel59
  - number: 59.3.b
    text: de vaststelling van de oorzaken althans de vermoedelijke oorzaken van het ongeval of van het incident en,
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel59
  - number: 59.3.c
    text: indien daartoe aanleiding bestaat, de constatering van structurele veiligheidstekorten en veiligheidsaanbevelingen.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel59
  - number: '59.4'
    text: |-
      Wat betreft de onderdelen, bedoeld in het derde lid, onder a en b, neemt de raad het, eventueel ingevolge
      [artikel 58, derde lid][ref1], gewijzigde, rapport van de kamer over.


      [ref1]: https://wetten.overheid.nl/BWBR0009753#Artikel58
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0009753
        artikel: '58'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '59.5'
    text: |-
      De raad kan besluiten bepaalde informatie niet in het eindrapport op te nemen.
      [Artikel 10 van de Wet openbaarheid van bestuur][ref1] is hierbij van overeenkomstige toepassing. Het eindrapport
      vermeldt niet de naam, het adres of identificatiegegevens van gelijksoortige aard ten aanzien van de personen, die
      betrokken zijn bij een ongeval of incident.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '59.6'
    text: Bij ministeriële regeling worden nadere voorschriften omtrent het eindrapport vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel59
  - number: '60.1'
    text: |-
      Ingeval van een onderzoek betreffende een ongeval of een incident met een luchtvaartuig zendt de raad het
      eindrapport in concept aan alle staten die hebben deelgenomen aan het onderzoek met de uitnodiging zo spoedig
      mogelijk, doch in ieder geval binnen zestig dagen hun commentaar van betekenis te geven.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel60
  - number: '60.2'
    text: |-
      Indien het ingevolge het eerste lid ontvangen commentaar daartoe aanleiding geeft, kunnen de kamer en de raad zijn
      rapport onderscheidenlijk het eindrapport aanpassen.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel60
  - number: '61.1'
    text: |-
      In geval van een onderzoek betreffende een ongeval of incident met een zeeschip zendt de raad het eindrapport in
      concept aan alle staten met aanmerkelijk belang met de uitnodiging zo spoedig mogelijk doch in ieder geval binnen
      dertig dagen of een andere overeengekomen termijn, hun commentaar van betekenis te geven.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel61
  - number: '61.2'
    text: |-
      Indien het ingevolge het eerste lid ontvangen commentaar daartoe aanleiding geeft, kunnen de kamer en de raad zijn
      rapport onderscheidenlijk eindrapport aanpassen. Ingeval geen aanpassing conform de essentie van het commentaar
      plaatsvindt, wordt het commentaar bij het eindrapport gevoegd.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel61
  - number: '62'
    text: |-
      De raad streeft ernaar het eindrapport binnen twaalf maanden na het tijdstip van het ongeval of incident uit te
      brengen.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel62
  - number: '63.1'
    text: De raad maakt het eindrapport openbaar.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel63
  - number: '63.2'
    text: |-
      De raad zendt in elk geval een afschrift van het eindrapport aan Onze Minister, het betrokken bestuursorgaan en
      de betrokkenen.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel63
  - number: '63.3'
    text: |-
      Voorzover het een luchtvaartongeval, een ernstig incident of een incident met een luchtvaartuig betreft,
      zendt de raad een afschrift van het eindrapport tevens aan de Commissie van de Europese Unie. Voorzover
      het een luchtvaartongeval betreft, zendt de raad een afschrift van het eindrapport tevens aan de staat
      waarvan onderdanen bij het ongeval zijn omgekomen of ernstig zijn verwond en aan de staten, genoemd in
      [artikel 48, eerste lid, onder a tot en met e][ref1]. Voorzover het een luchtvaartongeval betreft met een
      luchtvaartuig met een startmassa van meer dan 5700 kg, zendt de raad tenslotte een afschrift van het rapport aan de
      internationale burgerluchtvaartorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0009753#Artikel48
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0009753
        artikel: '48'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '63.4'
    text: |-
      Voorzover het een ongeval of een incident met een zeeschip betreft, zendt de raad een afschrift van het eindrapport
      tevens aan de Internationale Maritieme Organisatie.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel63
  - number: '63.5'
    text: |-
      Een ieder kan een afschrift van het eindrapport verkrijgen. De raad kan besluiten dat voor een afschrift kosten
      in rekening worden gebracht. De kosten worden berekend volgens de normen van het Besluit tarieven openbaarheid
      van bestuur.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel63
  - number: '64'
    text: |-
      Een veiligheidsaanbeveling behelst niet een vermoeden van schuld aan of aansprakelijkheid wegens een ongeval of
      een incident.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel64
  - number: '65'
    text: |-
      Indien noodzakelijk voor onverwijld optreden om ongevallen of incidenten te voorkomen, doet de raad reeds tijdens
      een onderzoek voorstellen voor preventieve maatregelen.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel65
  - number: '66.1'
    text: |-
      Indien na de sluiting van het onderzoek nieuwe feiten aan het licht komen, die van wezenlijk belang zijn met
      betrekking tot de in het eindrapport neergelegde conclusies of veiligheidsaanbevelingen, besluit de raad tot
      heropening van het onderzoek.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel66
  - number: '66.2'
    text: De raad stelt Onze Minister in kennis van het besluit tot heropening van het onderzoek.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel66
  - number: '67'
    text: |-
      In geval van een ongeval of incident, naar de oorzaak waarvan tevens ingevolge de Wet ongevallenraad Defensie
      onderzoek wordt verricht, draagt de raad zorg voor onderlinge afstemming van de werkzaamheden van de raad en van de
      ongevallenraad Defensie.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel67
  - number: '68'
    text: |-
      De raad verstrekt, indien een onderzoek een ongeval of een incident met een zeeschip betreft, desgevraagd Onze
      Minister binnen een door deze te bepalen redelijke termijn alle gegevens die deze nodig heeft om over dat ongeval
      of incident de Internationale Maritieme Organisatie in te lichten, voorzover de raad over deze gegevens beschikt.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel68
  - number: '69'
    text: |-
      Indien de raad aan een bestuursorgaan een veiligheidsaanbeveling heeft gedaan, bepaalt het bestuursorgaan tot wie
      de veiligheidsaanbevelingen zich richten, binnen een jaar zijn standpunt daaromtrent. Indien het bestuursorgaan
      niet Onze Minister is, maakt het bedoeld standpunt kenbaar aan Onze Minister. Het zendt een afschrift van zijn
      bericht aan Onze Minister aan de raad. Indien het bestuursorgaan Onze Minister is, maakt deze bedoeld standpunt
      kenbaar aan de raad.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel69
  - number: '70.1'
    text: |-
      Indien de raad aan een ander dan een bestuursorgaan een veiligheidsaanbeveling heeft gedaan, deelt deze binnen een
      jaar aan Onze Minister mee op welke wijze hij gevolg aan de aanbeveling zal geven en zendt hij afschrift van deze
      mededeling aan de raad.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel70
  - number: '70.2'
    text: Onze Minister beraadt zich of nadere maatregelen noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel70
  - number: '71.1'
    text: |-
      Het onderzoek naar de identiteit van de slachtoffers van een ongeval wordt uitgevoerd door het Korps landelijke
      politiediensten.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel71
  - number: '71.2'
    text: |-
      Het Korps landelijke politiediensten is bevoegd ten behoeve van het identificatieonderzoek alle plaatsen te
      betreden waar zich resten van het luchtvaartuig, weg-, railvoertuig, schip en slachtoffers bevinden.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel71
  - number: '71.3'
    text: Het Korps landelijke politiediensten stelt de raad in kennis van de identiteit van de slachtoffers van een ongeval.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel71
  - number: '72.1'
    text: |-
      Onze Minister kan, gehoord de raad en in overeenstemming met Onze Minister van Justitie regels stellen ten aanzien
      van de samenwerking tussen de raad, het openbaar ministerie, het Korps landelijke politiediensten en de regionale
      politiekorpsen.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel72
  - number: '72.2'
    text: |-
      De in het eerste lid bedoelde regels betreffen in elk geval het overleg en de coördinatie indien naar aanleiding
      van een ongeval of een incident ook een strafrechtelijke onderzoek wordt ingesteld of overwogen, alsmede de ter
      beschikking stelling van in beslag genomen voorwerpen.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel72
  - number: '73'
    text: Onze Minister kan regels stellen
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel73
  - number: 73.a
    text: |-
      ten aanzien van het overleg en de coördinatie tussen de raad en Onze Minister ingeval naar aanleiding van een
      ongeval of incident ook het opleggen van een bestuursrechtelijke maatregel wordt overwogen en
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel73
  - number: 73.b
    text: omtrent de in dat kader aan Onze Minister ter beschikking stelling van inbeslaggenomen voorwerpen.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel73
  - number: '74.1'
    text: 'Niet kunnen als bewijzen in een rechtsgeding worden gebruikt:'
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel74
  - number: 74.1.a
    text: verklaringen van personen, afgelegd in het kader van het onderzoek van de raad;
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel74
  - number: 74.1.b
    text: |-
      in het kader van het onderzoek vastgelegde communicatie tussen personen die betrokken zijn geweest bij het laten
      functioneren van het bij een onderzoek betrokken vervoermiddel;
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel74
  - number: 74.1.c
    text: |-
      in het kader van het onderzoek vastgelegde medische of privé-informatie betreffende personen die betrokken zijn bij
      het ongeval of incident;
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel74
  - number: 74.1.d
    text: gegevens die zijn ontleend aan een vluchtrecorder, een cockpit voice recorder en de transscripten daarvan;
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel74
  - number: 74.1.e
    text: meningen geuit in het kader van het verrichten van het onderzoek.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel74
  - number: '74.2'
    text: |-
      Het eerste lid, aanhef en onder a, is niet van toepassing bij de vervolging van een getuige of deskundige terzake
      van meineed als bedoeld in [artikel 207 van het Wetboek van Strafrecht][ref1], in verband met een door hem voor de
      raad afgelegde verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel207
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '207'
  - number: '75.1'
    text: |-
      Indien een ongeval of ernstig incident buiten Nederland, de territoriale wateren daaronder begrepen, een Nederlands
      luchtvaartuig betreft of een luchtvaartuig waarvan de exploitant in Nederland is gevestigd, geeft Onze Minister zo
      spoedig mogelijk aan de staat van het voorval alle relevante informatie over het betrokken luchtvaartuig en zijn
      bemanning.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel75
  - number: '75.2'
    text: |-
      In het geval, bedoeld in het eerste lid, deelt Onze Minister de staat van het voorval ook mede of Nederland
      vertegenwoordigd wil zijn bij het onderzoek. Indien Nederland dit wil, geeft hij ook de verwachte datum van
      aankomst van de vertegenwoordiger aan.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel75
  - number: '76'
    text: |-
      Indien een ongeval of een ernstig incident buiten Nederland, de territoriale wateren daaronder begrepen, een
      luchtvaartuig betreft dat in Nederland is ontworpen of vervaardigd, wordt door Onze Minister, indien de staat van
      het voorval verzoekt om deelneming aan het onderzoek, aan deze staat medegedeeld:
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel76
  - number: 76.a
    text: |-
      ingeval het gaat om een ongeval of ernstig incident met een luchtvaartuig met een startmassa van meer dan 100 000
      kg, de naam van de gevolmachtigde vertegenwoordiger alsmede of hij aanwezig zal zijn bij het onderzoek en, zo dit
      het geval is, de verwachte datum van zijn aankomst;
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel76
  - number: 76.b
    text: |-
      ingeval het gaat om een ongeval of ernstig incident met een ander luchtvaartuig, of Nederland een gevolmachtigde
      vertegenwoordiger zal aanwijzen alsmede, indien Nederland dit doet, zijn naam, of hij aanwezig zal zijn bij het
      onderzoek en, zo dit het geval is, de verwachte datum van zijn aankomst.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel76
  - number: '77.1'
    text: |-
      Indien een onderzoek terzake van een ongeval of ernstig incident met een ander dan een Nederlands luchtvaartuig
      waarvan de exploitant in Nederland is gevestigd of waarvan Nederland de staat van ontwerp of vervaardiging is,
      wordt ingesteld door de staat waarin het luchtvaartuig is ingeschreven, geeft Onze Minister desverzocht aan deze
      staat alle relevante informatie betreffende het betrokken luchtvaartuig en zijn bemanning.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel77
  - number: '77.2'
    text: |-
      In het geval, bedoeld in het eerste lid, deelt Onze Minister de staat waarin het luchtvaartuig is ingeschreven, ook
      mee of Nederland vertegenwoordigd wil zijn bij het onderzoek. Indien Nederland dit wil, geeft hij ook de verwachte
      datum van aankomst van de vertegenwoordiger aan.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel77
  - number: '78'
    text: |-
      Indien de staat die een onderzoek verricht terzake van een ongeval met een luchtvaartuig met een startmassa
      van meer dan 2250 kg dat in Nederland is ingeschreven, waarvan de exploitant in Nederland woont of waarvan
      Nederland de staat van ontwerp of vervaardiging is, verzoekt om deelneming door Nederland, wijst Onze Minister een
      gevolmachtigde vertegenwoordiger terzake van het onderzoek aan.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel78
  - number: '79'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de aanwijzing door Onze
      Minister van een vertegenwoordiger als bedoeld in [artikel 75, tweede lid][ref1], [artikel 76][ref2],
      [artikel 77, tweede lid][ref3], of [artikel 78][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0009753#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0009753#Artikel76
      [ref3]: https://wetten.overheid.nl/BWBR0009753#Artikel77
      [ref4]: https://wetten.overheid.nl/BWBR0009753#Artikel78
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0009753
        artikel: '75'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0009753
        artikel: '76'
        hoofdstuk: '8'
      - id: ref3
        bwb_id: BWBR0009753
        artikel: '77'
        hoofdstuk: '8'
      - id: ref4
        bwb_id: BWBR0009753
        artikel: '78'
        hoofdstuk: '8'
  - number: '80.1'
    text: |-
      De raad kan aan een onderzoek naar een luchtvaartongeval of een ernstig incident buiten Nederland dat door een
      andere staat wordt ingesteld, deelnemen, voorzover die staat daarvoor toestemming geeft.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel80
  - number: '80.2'
    text: |-
      Onze Minister kan aan de raad opdracht geven deel te nemen aan een onderzoek naar een ongeval of ernstig incident
      met een luchtvaartuig in een andere staat.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel80
  - number: '81'
    text: |-
      Op verzoek van de staat die een onderzoek terzake van een ongeval of incident met een luchtvaartuig verricht,
      verschaft Onze Minister alle relevante informatie die hij beschikbaar heeft.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel81
  - number: '82.1'
    text: |-
      Indien voorafgaand aan een ongeval of incident met een luchtvaartuig gebruik is gemaakt of normalerwijze gebruik
      zou moeten zijn gemaakt van faciliteiten of diensten in Nederland en Onze Minister informatie heeft die belangrijk
      is voor het onderzoek, verschaft hij deze aan de staat die het onderzoek verricht.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel82
  - number: '82.2'
    text: |-
      Indien een onderzoek een ongeval of incident betreft met een luchtvaartuig dat in Nederland is ingeschreven of
      waarvan de exploitant in Nederland is gevestigd, verschaft Onze Minister op verzoek van de staat die het onderzoek
      verricht, de wezenlijke informatie waarover hij beschikt, over elke organisatie waarvan de activiteiten direct of
      indirect de vlucht van het vliegtuig kunnen hebben beïnvloed.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel82
  - number: '83'
    text: |-
      Ingeval er sprake is van een ongeval of ernstig incident met een Nederlands luchtvaartuig of een luchtvaartuig
      waarvan de exploitant in Nederland is gevestigd, en het luchtvaartuig in een andere staat landt dan die waarin het
      ongeval of het incident zich heeft voorgedaan, verschaft Onze Minister, op verzoek van de staat die het onderzoek
      verricht, aan deze staat de opnamen van de vluchtrecorder en, indien nodig, van de verbonden vluchtrecorders.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel83
  - number: '84.1'
    text: |-
      Op verzoek van een andere lid-staat van de Europese Unie of een van de overige staten die partij zijn bij de
      Overeenkomst betreffende de Europese Economische Ruimte die een onderzoek naar een luchtvaartongeval, naar een
      ernstig incident of naar een incident met een luchtvaartuig leidt, kan Onze Minister de raad opdragen, binnen de
      grenzen van zijn mogelijkheden, bijstand te verlenen.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel84
  - number: '84.2'
    text: |-
      Ingeval een luchtvaartongeval heeft plaatsgevonden in volle zee in de nabijheid van Nederland, geeft Onze Minister
      aan de staat die het onderzoek verricht alle mogelijke bijstand.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel84
  - number: '84.3'
    text: |-
      Op verzoek van de Nederlandse Antillen of Aruba kan Onze Minister de raad opdragen, binnen de grenzen van zijn
      mogelijkheden, bijstand te verlenen aan een vanwege de autoriteiten van een van die landen verricht onderzoek
      betreffende een scheepvaartongeval.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel84
  - number: '85'
    text: |-
      Onze Minister en de raad maken een ontwerp-rapport dat zij hebben verkregen gedurende een onderzoek, verricht
      door een andere staat, door de Nederlandse Antillen of door Aruba, niet openbaar tenzij zij daartoe uitdrukkelijk
      toestemming hebben gekregen van het betrokken land of het betrokken stuk door dat land reeds openbaar is gemaakt of
      is vrij gegeven.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel85
  - number: '86'
    text: |-
      Indien Nederland veiligheidsaanbevelingen of andere voorstellen voor preventieve maatregelen krijgt van een andere
      staat, deelt Onze Minister de betrokken staat, met redenen omkleed, mede welk gevolg aan de aanbevelingen of de
      voorstellen zal worden gegeven.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel86
  - number: '87.1'
    text: |-
      Degene die handelt in strijd met het bepaalde in de op grond van [artikel 28, eerste lid][ref1], gegeven algemene
      maatregel van bestuur, of in strijd met [artikel 32, tweede lid][ref2], [51][ref3], [53, tweede lid][ref4], en
      [70, eerste lid][ref5], wordt gestraft met een geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0009753#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0009753#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0009753#Artikel51
      [ref4]: https://wetten.overheid.nl/BWBR0009753#Artikel53
      [ref5]: https://wetten.overheid.nl/BWBR0009753#Artikel70
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0009753
        artikel: '28'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0009753
        artikel: '32'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0009753
        artikel: '51'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0009753
        artikel: '53'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0009753
        artikel: '70'
        hoofdstuk: '6'
  - number: '87.2'
    text: De krachtens het eerste lid strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel87
  - number: '88.1'
    text: |-
      Met de opsporing van de bij [artikel 87][ref1] strafbaar gestelde feiten zijn, onverminderd de ambtenaren,
      bedoeld in [artikel 141 van het Wetboek van Strafvordering][ref2], belast de ambtenaren aangewezen bij
      besluit van Onze Minister van Verkeer en Waterstaat en Onze Minister van Justitie. Deze ambtenaren zijn
      tevens belast met de opsporing van de feiten strafbaar gesteld in de [artikelen 179 tot en met 182][ref3] en
      [184 van het Wetboek van Strafrecht][ref4], voor zover deze feiten betrekking hebben op een bevel, vordering of
      handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0009753#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0009753
        artikel: '87'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '179'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '184'
  - number: '88.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel88
  - number: '89.1'
    text: |-
      Onze Minister zendt binnen drie jaar na de inwerkingtreding van deze wet en vervolgens telkens na vijf jaar aan de
      Staten-Generaal een verslag over de doeltreffendheid en doelmatigheid van het functioneren van de raad.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel89
  - number: '89.2'
    text: |-
      Bij de ministeriële regeling, bedoeld in [artikel 27, derde lid][ref1], worden voorschriften gesteld omtrent de
      totstandkoming van het verslag en de betrokkenheid van de raad daarbij.


      [ref1]: https://wetten.overheid.nl/BWBR0009753#Artikel27
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0009753
        artikel: '27'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '90.1'
    text: |-
      Indien de raad ernstig in gebreke blijft in de uitoefening van zijn taak wat betreft de onderzoeken, bedoeld in
      [artikel 3, tweede en derde lid][ref1], kan Onze Minister de taak waarnemen. In dat geval zijn op de door Onze
      Minister aan te wijzen personen [de artikelen 33][ref2] tot en met [40][ref3] van overeenkomstige toepassing.
      Onderzoeken worden verricht met inachtneming van de [artikelen 43 tot en met 67][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0009753#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009753#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0009753#Artikel40
      [ref4]: https://wetten.overheid.nl/BWBR0009753#Artikel43
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0009753
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009753
        artikel: '33'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0009753
        artikel: '40'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0009753
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '90.2'
    text: |-
      Onze Minister doet van zijn besluit tot waarneming van de taak van de raad schriftelijk mededeling aan de raad. Dit
      besluit wordt gepubliceerd in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel90
  - number: '91'
    text: |-
      Onderzoeken naar ongevallen of incidenten ingevolge de Luchtvaartongevallenwet, de Binnenvaartrampenwet en
      de [Spoorwegwet][ref1] die zijn begonnen voor de datum van inwerkingtreding van deze wet, worden door de raad
      afgehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001848
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0001848
  - number: '92'
    text: |-
      In afwijking van [artikel 7, eerste lid][ref1], geschiedt de benoeming van de leden van de raad voor de eerste maal
      zonder dat de raad wordt gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0009753#Artikel7
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0009753
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '93'
    text: De Binnenvaartrampenwet wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel93
  - number: '102'
    text: De Luchtvaartongevallenwet wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel102
  - number: '104'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip. Bij koninklijk besluit kan worden
      bepaald dat deze wet op een later tijdstip in werking treedt ten aanzien van het onderzoek naar ongevallen en
      incidenten met een zeeschip. Indien dit geschiedt, treden de bepalingen van deze wet die verband houden met de
      opheffing van de Raad voor de Scheepvaart, ook eerst met ingang van dat latere tijdstip in werking.
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel104
  - number: '105'
    text: 'Deze wet wordt aangehaald als: Wet Raad voor de Transportveiligheid.'
    url: https://wetten.overheid.nl/BWBR0009753/2005-01-01#Artikel105
