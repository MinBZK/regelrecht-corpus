  text: |-
    Besluit van het Productschap Pluimvee en Eieren van 13 september 2007;

    Gelet op de Verordening hygiënevoorschriften pluimveehouderij (PPE) 2007;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0022609/2009-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Dit besluit neemt de terminologie, als omschreven in
      [artikel 1 van de Verordening hygiënevoorschriften pluimveehouderij (PPE) 2007][ref1], over en verstaat daarnaast
      onder ondernemer: een natuurlijk persoon of rechtspersoon die een leghennenbedrijf uitoefent.


      [ref1]: https://wetten.overheid.nl/BWBR0022479#Artikel1
    url: https://wetten.overheid.nl/BWBR0022609/2009-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0022479
        artikel: '1'
  - number: '2'
    text: |-
      De in [artikel 2, derde lid, van de Verordening][ref1] bedoelde eisen waaraan de ondernemer die zijn leghennen in
      kooien houdt, heeft te voldoen, zijn opgenomen in [Bijlage I][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022479#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022609
    url: https://wetten.overheid.nl/BWBR0022609/2009-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0022479
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0022609
  - number: '3'
    text: |-
      1 De uitslag van een hygiënogram als bedoeld in [artikel 3, vijfde lid, van de Verordening][ref1], is kleiner dan
      of gelijk aan 2,0.

      2 Indien de in het eerste lid bedoelde uitslag groter dan 2,0 maar kleiner dan of gelijk aan 3,0 is, dan wordt
      door een professioneel ontsmettingsbedrijf de stal opnieuw ontsmet. Daarna mag een nieuw koppel leghennen worden
      geplaatst.

      3 Indien de in het eerste lid bedoelde uitslag groter is dan 3,0 dan dient de stal door een professioneel
      ontsmettingsbedrijf opnieuw te worden ontsmet. Na het ontsmetten wordt opnieuw een hygiënogram uitgevoerd. Een
      nieuw koppel leghennen mag alleen dan worden opgezet, indien de uitslag van het hygiënogram kleiner dan of gelijk
      is aan 2,0.

      4 Wanneer overeenkomstig
      [Bijlage II onder b. van het Besluit erkenningsvoorwaarden en werkwijzen HOSOWO–instanties (PPE) 2007][ref2] de
      uitslag van twee van de vijf onderdelen van de visuele controle slecht is, wordt na de volgende ronde nogmaals een
      hygiënogram uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0022479#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0023545
    url: https://wetten.overheid.nl/BWBR0022609/2009-01-01#Artikel3
