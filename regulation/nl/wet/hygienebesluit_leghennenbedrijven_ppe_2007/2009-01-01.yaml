  - number: '4'
    text: |-
      1 Het reguliere onderzoek op de aanwezigheid van Salmonella als genoemd in
      [artikel 4, tweede lid, onderdeel b, van de Verordening][ref1], wordt uitgevoerd op de wijze als omschreven in
      [Bijlage II, hoofdstuk 1.1][ref2].

      2 Het officiële onderzoek op de aanwezigheid van Salmonella als genoemd in
      [artikel 4, tweede lid, onderdeel c, van de Verordening][ref3], wordt uitgevoerd op de wijze als omschreven in
      [Bijlage II, hoofdstuk 1.2][ref4].

      3 Indien met de in het eerste lid en tweede lid bedoelde onderzoeken de serotypen Salmonella enteritidis of
      Salmonella typhimurium worden aangetoond, handelt de ondernemer overeenkomstig [Bijlage II, hoofdstuk 2][ref5].

      4 Het verificatieonderzoek als genoemd in [artikel 4, vijfde lid, onderdeel b, van de Verordening][ref6], wordt
      uitgevoerd op de wijze als omschreven in [Bijlage II, hoofdstuk 4.7][ref7].


