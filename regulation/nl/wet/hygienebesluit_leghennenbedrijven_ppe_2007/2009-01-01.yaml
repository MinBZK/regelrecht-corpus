      1 De resultaten van de analyse van de monsters als bedoeld in
      [artikel 4, tweede lid, onderdeel b, van de Verordening][ref1] worden door of namens de ondernemer doorgegeven
      overeenkomstig [Bijlage II, hoofdstuk 3.1][ref2].

      2 De resultaten van de analyse van de monsters als bedoeld in
      [artikel 4, tweede lid, onderdeel c, van de Verordening][ref3] worden door of namens de ondernemer doorgegeven
      overeenkomstig [Bijlage II, hoofdstuk 3.2][ref4].


