  - number: '6'
    text: |-
      Indien op grond van het verificatieonderzoek als bedoeld in [artikel 4, vijfde lid, van de Verordening][ref1]
      een besmetting met de serotypen Salmonella enteritidis of Salmonella typhimurium is bevestigd in een
      meerleeftijdenleghennenstal, mag de ondernemer geen leghennen in de meerleeftijdenleghennenstal plaatsen voordat de
      tijdens de besmetting aanwezige leghennen van het bedrijf zijn afgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0022479#Artikel4
    url: https://wetten.overheid.nl/BWBR0022609/2009-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0022479
        artikel: '4'
  - number: '7'
    text: |-
      1 Indien de ondernemer graan aan leghennen voert dat afkomstig is van eigen teelt of rechtstreeks afkomstig
      is van een andere teler, bewaart de ondernemer een monster van iedere partij graan. Indien op grond van het
      verificatieonderzoek als bedoeld in [artikel 4, vijfde lid, van de Verordening][ref1] een besmetting met de
      serotypen Salmonella enteritidis of Salmonella typhimirium is bevestigd bij een koppel leghennen, wordt het
      bewaarde monster graan onderzocht op de aanwezigheid van de serotypen Salmonella enteritidis of Salmonella
      typhimirium, overeenkomstig het werkvoorschrift zoals opgenomen in [Bijlage III][ref2].

      2 Indien uit het onderzoek bedoeld in het eerste lid blijkt dat de partij graan besmet is met de serotypen
      Salmonella enteritidis of Salmonella typhimirium, mag de ondernemer deze partij graan niet aan de leghennen voeren.

      3 Indien de ondernemer de in het tweede lid bedoelde partij graan zodanig heeft behandeld dat deze partij niet meer
      met de serotypen Salmonella enteritidis of Salmonella typhimiriumis is besmet, en na deze behandeling een tweede
      onderzoek overeenkomstig het in [Bijlage III][ref3] opgenomen werkvoorschrift bevestigd dat deze partij niet meer
      met de serotypen Salmonella enteritidis of Salmonella typhimiriumis is besmet, mag de ondernemer deze partij aan de
      leghennen voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0022479#Artikel4
