        artikel: 1:8
      - id: ref2
        bwb_id: BWBR0009950
  - number: XIX
    text: |-
      Na de inwerkingtreding van deze wet berust:

      a. het [Besluit alternatieve verdeling nummers][ref1] op
      [artikel 4.2, negende lid, van de Telecommunicatiewet][ref2];

      b. het [Besluit randapparaten en radioapparaten][ref3] mede op de [artikelen 10.1b][ref4] en
      [10.13, van de Telecommunicatiewet][ref5];

      c. het [Besluit 1-1-2 alarmcentrales][ref6] mede op [artikel 11.10, vijfde lid, van de Telecommunicatiewet][ref7].


