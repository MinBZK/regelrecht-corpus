  - number: XXI
    text: |-
      1 Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.

      2 In het koninklijk besluit kan worden bepaald dat daarbij aan te geven artikelen of onderdelen daarvan op een
      later, bij koninklijk besluit te bepalen tijdstip in werking treden.

      3 In een koninklijk besluit als bedoeld in het eerste en tweede lid, wordt zo nodig toepassing gegeven aan
      [artikel 16 van de Tijdelijke referendumwet][ref1].


