preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is de Telecommunicatiewet en andere wetten te wijzigen
    in verband met de implementatie van Richtlijn nr. 2002/19/EG van het Europees Parlement en de Raad van de Europese
    Unie van 7 maart 2002 inzake de toegang tot en de interconnectie van elektronische-communicatienetwerken en
    bijbehorende faciliteiten (PbEG L 108), Richtlijn nr. 2002/20/EG van het Europees Parlement en de Raad van de
    Europese Unie van 7 maart 2002 betreffende de machtiging voor elektronische-communicatienetwerken en -diensten
    (PbEG L 108), Richtlijn nr. 2002/21/EG van het Europees Parlement en de Raad van de Europese Unie van 7 maart
    2002 inzake een gemeenschappelijk regelgevingskader voor elektronische-communicatienetwerken en -diensten (PbEG
    L 108), Richtlijn nr. 2002/22/EG van het Europees Parlement en de Raad van de Europese Unie van 7 maart 2002
    inzake de universele dienst en gebruikersrechten met betrekking tot elektronische-communicatienetwerken en
    -diensten (PbEG L 108), Richtlijn nr. 2002/58/EG van het Europees Parlement en de Raad van de Europese Unie van
    12 juli 2002 betreffende de verwerking van persoonsgegevens en de bescherming van de persoonlijke levenssfeer
    in de sector elektronische communicatie (PbEG L 201), alsmede Richtlijn nr. 2002/77/EG van de Commissie van
    de Europese Gemeenschappen van 16 september 2002 betreffende de mededinging op de markten voor elektronische-
    communicatienetwerken en -diensten (PbEG L 249);

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0016635/2004-05-19#ArtikelAanhef
articles:
  - number: XI
    text: |-
      Onverminderd het bepaalde in [artikel 1:8, eerste lid, van de Algemene wet bestuursrecht][ref1], blijven
      verplichtingen op grond van deze wet of op grond van de [Telecommunicatiewet][ref2] zoals deze luidt na het
      tijdstip van inwerkingtreding van deze wet, die ertoe strekken om ontwerpen van besluiten aan de Staten-Generaal
      voor te leggen buiten toepassing voor zover deze besluiten zijn vastgesteld voor het tijdstip van inwerkingtreding
      van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0009950
    url: https://wetten.overheid.nl/BWBR0016635/2004-05-19#ArtikelXI
    references:
