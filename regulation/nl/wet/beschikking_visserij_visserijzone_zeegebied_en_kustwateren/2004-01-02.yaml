        artikel: '2'
  - number: '3'
    text: >-
      1 Het is verboden in het zeegebied en de kustwateren te vissen met een palingfuik, staand want, hoekwant, aalkub,
      aalkistje, ankerkuil of enig ander vast vistuig.


      2 Het is verboden in de kustwateren te vissen met een zegen.
    url: https://wetten.overheid.nl/BWBR0003150/2004-01-02#Artikel3
  - number: '4'
    text: >-
      Het is verboden in de visserijzone, het zeegebied en de kustwateren te vissen met enig vistuig geschikt voor het
      vangen van schelpdieren.
    url: https://wetten.overheid.nl/BWBR0003150/2004-01-02#Artikel4
  - number: '5'
    text: |-
      Het is verboden te vissen met:

      a. sleepnetten in de Oosterschelde ten oosten van de Oosterscheldekering;

      b. sleepnetten met wekkerkettingen in de gebieden genoemd in [bijlage 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003150
    url: https://wetten.overheid.nl/BWBR0003150/2004-01-02#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003150
  - number: '7'
    text: >-
      1 Het vissen met enig vistuig geschikt voor het vangen van garnalen (Crangon crangon) is in de visserijzone, het
      zeegebied en de kustwateren met uitzondering van de Westerschelde verboden.


      2 Het in het eerste lid gestelde verbod geldt niet voor degene, die anders dan met behulp van een vaartuig op
      garnalen vist.
    url: https://wetten.overheid.nl/BWBR0003150/2004-01-02#Artikel7
  - number: '8'
    text: |-
      1 Het is verboden schelpdieren te rapen in:

      a. de gebieden, bedoeld in [bijlage 1][ref1] en [bijlage 2][ref2], en

      b. andere gesloten gebieden die alszodanig door de Minister in de Staatscourant bekend zijn gemaakt, voor de duur
      dat deze andere gebieden door hem gesloten zijn verklaard.

      2 Van het verbod, bedoeld in het eerste lid, wordt vrijstelling verleend aan:

      a. degene die handmatig schelpdieren raapt en die:

      - visrechthebbende is op de desbetreffende schelpdierpercelen, gelegen in de in het eerste lid bedoelde gebieden,
      dan wel
      - van de visrechthebbende vooraf schriftelijke toestemming heeft gekregen handmatig schelpdieren te rapen op die
      percelen;

      b. degene die handmatig schelpdieren raapt voor eigen gebruik, tot ten hoogste tien kg. per dag.

      3 Onverminderd het bepaalde in de voorgaande leden, is het verboden in de visserijzone, het zeegebied en de
      kustwateren schaal- en schelpdieren te rapen tussen één uur na zonsondergang en één uur vóór zonsopgang.


      [ref1]: https://wetten.overheid.nl/BWBR0003150
      [ref2]: https://wetten.overheid.nl/BWBR0003150
    url: https://wetten.overheid.nl/BWBR0003150/2004-01-02#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003150
      - id: ref2
        bwb_id: BWBR0003150
  - number: '9'
    text: >-
      1 Het is verboden in de visserijzone, het zeegebied en de kustwateren schelpdieren uit te zaaien of uit te zetten.


      2 Het in het eerste lid bedoelde verbod geldt niet voor het uitzetten of uitzaaien van:


      a. mosselen in de Waddenzee, indien deze afkomstig zijn uit het Nederlandse gedeelte van de Waddenzee;


      b. mosselen en oesters in de Oosterschelde, indien deze afkomstig zijn uit de Oosterschelde.
    url: https://wetten.overheid.nl/BWBR0003150/2004-01-02#Artikel9
  - number: '10'
    text: |-
      1 Het is verboden op of in de nabijheid van enig in [artikel 1][ref1] bedoeld water een vistuig voorhanden
      te hebben, indien een voor zover het gebruik van dat vistuig in dat water ingevolge het bepaalde in de vorige
      artikelen verboden is.

      2 Het verbod geldt niet indien het vistuig zodanig is verpakt of in zodanige toestand is, dat dadelijk gebruik
      daarvan niet mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0003150#Artikel1
    url: https://wetten.overheid.nl/BWBR0003150/2004-01-02#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003150
        artikel: '1'
  - number: '11'
    text: |-
      1 De in de [artikelen 3][ref1], [4][ref2], [5, onder a][ref3], [7, eerste lid][ref4], [8][ref5] en [9][ref6]
      gestelde verboden gelden niet voor degene, die voorzien is van een vergunning van de minister.

      2 Een vergunning als bedoeld in het eerste lid, wordt niet verleend voor het vissen met vistuigen geschikt voor het
      vangen van schelpdieren in de gebieden genoemd in [bijlage 1][ref7].

      3 Een vergunning als bedoeld in het eerste lid bestemd voor het vissen met enig vistuig geschikt voor het vangen
      van garnalen (Crangon, crangon) in de visserijzone, het zeegebieden of de kustwateren bevat met ingang van
      1 januari 2002 de volgende gegevens: a. de naam van de vergunninghouder; b. de lettertekens, het nummer, het
      motorvermogen en de tonnage van het vissersvaartuig ten behoeve waarvan de vergunning is verleend, en c. het
      segment, bedoeld de bijlage bij beschikking nr. 2001/21/EG van de Commissie van de Europese Gemeenschappen van 21
      december 2000 tot wijziging van Beschikking 98/121/EG houdende goedkeuring van het meerjarig oriëntatieprogramma
      voor de vissersvloot van Nederland voor de periode van 1 januari 1997 tot en met 31 december 2001 (PbEG L 5)
      waartoe het vissersvaartuig behoort.

      4 Een vergunning als bedoeld in het derde lid wordt slechts verleend ten aanzien van een vissersvaartuig dat
      behoort tot hetzelfde segment, bedoeld in het derde lid, onderdeel c, als het vissersvaartuig ten behoeve waarvan
      die vergunning laatstelijk is verleend.

      5

      6

      7 De minister maakt in de maanden januari, april, juli en oktober het in het vierde lid, onderdeel b, bedoelde
      percentage per segment als bedoeld in het derde lid, onderdeel c, bekend in de Staatscourant.


