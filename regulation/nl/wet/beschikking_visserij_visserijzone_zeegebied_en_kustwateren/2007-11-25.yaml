---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: beschikking_visserij_visserijzone_zeegebied_en_kustwateren
regulatory_layer: WET
publication_date: '2008-09-26'
valid_from: '2007-11-25'
bwb_id: BWBR0003150
url: https://wetten.overheid.nl/BWBR0003150/2007-11-25
preamble:
  text: |-
    Gelet op artikel 3 en 4 van het Reglement zee- en kustvisserij 1977 (Stb. 666);

    Na overleg met het Produktschap voor Vis en Visprodukten, het Visserijschap, het Bedrijfschap voor de Groothandel
    in Vis en Aanverwante Bedrijven, het Centraal Nederlands Hengelaars Verbond en de Nederlandse Vereniging van
    Sportvissersfederaties,

    Besluit:
  url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van dit besluit wordt verstaan onder:

            a

              *‘visserijzone’:*


              de in [artikel 1, vierde lid, onder a][ref1], van de Visserijwet 1968 (Stb. 312) bedoelde zone;



            b

              *‘zeegebied’:*


              de als zodanig bij het [Besluit aanwijzing zeegebied en kustwateren 1970][ref2] (Stb. 176) aangewezen
      wateren;



            c

              *‘kustwateren’:*


              de als zodanig bij het [Besluit aanwijzing zeegebied en kustwateren 1970][ref3] aangewezen wateren.



            d
            ‘Minister’:

              minister van Landbouw, Natuur en Voedselkwaliteit;



            e

              *‘rapen’:*


              het vergaren, niet zijnde het vissen met enig vistuig geschikt voor het vangen van schelpdieren;



            f

              *‘handmatig’:*


              met de hand, zonder gebruikmaking van enig hulpmiddel, dan wel louter met gebruikmaking van een riek of
      een spade.


      [ref1]: https://wetten.overheid.nl/BWBR0003150#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002703
      [ref3]: https://wetten.overheid.nl/BWBR0002703
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003150
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002703
      - id: ref3
        bwb_id: BWBR0002703
  - number: '2.1'
    text: 'Het is verboden in het zeegebied en de kustwateren te vissen met:'
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel2
  - number: 2.1.a
    text: |-
      de harpoen, de elger, de aalschaar, of enig ander vistuig, hetwelk geëigend is de vis te verwonden, met
      uitzondering van het hoekwant, de reep, de dobber, de zetangel of fleur, de hengel of spieringtuig;
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel2
  - number: 2.1.b
    text: |-
      een visnet waarvan het netwerk van metaalgaas is vervaardigd, met uitzondering van de kreeftenkorf en enig ander
      net, bestemd of mede bestemd tot het vangen van schaal- en schelpdieren, zeesterren en zee- of koraalmos.
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel2
  - number: '2.2'
    text: |-
      Het is verboden in de kustwateren genoemd in
      [artikel 2, eerste lid, van het Besluit aanwijzing zeegebied en kustwateren 1970][ref1] te vissen met een kuilnet,
      waarvan de maaswijdte kleiner is dan 17 mm.


      [ref1]: https://wetten.overheid.nl/BWBR0002703#Artikel2
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002703
        artikel: '2'
  - number: '2.3'
    text: |-
      Het is verboden in de kustwateren genoemd in
      [artikel 2, derde tot en met zevende lid, van het Besluit aanwijzing zeegebied en kustwateren 1970][ref1] met de
      hierna genoemde vistuigen te vissen, indien de maaswijdte kleiner is dan het aantal millimeters, vermeld achter het
      desbetreffende vistuig:


      [ref1]: https://wetten.overheid.nl/BWBR0002703#Artikel2
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002703
        artikel: '2'
  - number: 2.3.a
    text: de ankerkuil 13 mm
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel2
  - number: 2.3.b
    text: het staande ansjovisnet, de fuik van een ansjovisweer 15 mm
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel2
  - number: 2.3.c
    text: het kuilnet 17 mm
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel2
  - number: 2.3.d
    text: de zegen 20 mm
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel2
  - number: 2.3.e
    text: het spieringdrijfnet 25 mm
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel2
  - number: 2.3.f
    text: het schutnet, het staande botnet, de fuik aan een botweer 80 mm
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel2
  - number: '2.4'
    text: |-
      Het is verboden in de kustwateren te vissen met een vistuig, waarvoor een minimummaaswijdte is vastgesteld, indien
      met betrekking tot dat vistuig enige handeling is verricht of enig middel is aangewend, waardoor het ontsnappen van
      vis kan worden bemoeilijkt of belet.
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel2
  - number: '2.5'
    text: |-
      Onder spieringdrijfnet, als bedoeld in het derde lid, onderdeel e, wordt verstaan, ieder een- of meerwandig
      wargaren, hetwelk bij gebruik door de stroom wordt voortbewogen, met een maaswijdte van 45 mm of minder.
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel2
  - number: '3.1'
    text: |-
      Het is verboden in het zeegebied en de kustwateren te vissen met een palingfuik, staand want, hoekwant, aalkub,
      aalkistje, ankerkuil of enig ander vast vistuig.
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel3
  - number: '3.2'
    text: Het is verboden in de kustwateren te vissen met een zegen.
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel3
  - number: '4'
    text: 'Het is verboden te vissen met enig vistuig geschikt voor het vangen van schelpdieren in:'
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel4
  - number: 4.a
    text: |-
      de gebieden, genoemd in [bijlage 3][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003150
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003150
  - number: 4.b
    text: |-
      de exclusieve 12-mijlszone, bedoeld in
      [artikel 2 van de Regeling eisen, administratie en registratie inzake uitoefening visserij][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0020043#Artikel2
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020043
        artikel: '2'
  - number: 4.c
    text: het zeegebied, en
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel4
  - number: 4.d
    text: de kustwateren.
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel4
  - number: '5'
    text: 'Het is verboden te vissen met:'
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel5
  - number: 5.a
    text: |-
      sleepnetten al dan niet met wekkerkettingen in de Oosterschelde ten oosten van de Oosterscheldekering en in het
      gebied genoemd in [bijlage 4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003150#Artikel4
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003150
        artikel: '4'
  - number: 5.b
    text: |-
      sleepnetten met wekkerkettingen in de gebieden genoemd in [bijlage 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003150
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003150
  - number: '7.1'
    text: |-
      Het vissen met enig vistuig geschikt voor het vangen van garnalen (Crangon crangon) is in de visserijzone, het
      zeegebied en de kustwateren met uitzondering van de Westerschelde verboden.
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel7
  - number: '7.2'
    text: |-
      Het in het eerste lid gestelde verbod geldt niet voor degene, die anders dan met behulp van een vaartuig op
      garnalen vist.
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel7
  - number: '8.1'
    text: 'Het is verboden schelpdieren te rapen in:'
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel8
  - number: 8.1.a
    text: |-
      de gebieden, bedoeld in [bijlage 1][ref1], [bijlage 2][ref2] en [bijlage 4][ref3], en


      [ref1]: https://wetten.overheid.nl/BWBR0003150
      [ref2]: https://wetten.overheid.nl/BWBR0003150
      [ref3]: https://wetten.overheid.nl/BWBR0003150
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003150
      - id: ref2
        bwb_id: BWBR0003150
      - id: ref3
        bwb_id: BWBR0003150
  - number: 8.1.b
    text: |-
      andere gesloten gebieden die alszodanig door de Minister in de Staatscourant bekend zijn gemaakt, voor de duur dat
      deze andere gebieden door hem gesloten zijn verklaard.
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel8
  - number: '8.2'
    text: 'Van het verbod, bedoeld in het eerste lid, wordt vrijstelling verleend aan:'
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel8
  - number: 8.2.a
    text: |-
      degene die handmatig schelpdieren raapt en die: - visrechthebbende is op de desbetreffende schelpdierpercelen,
      gelegen in de in het eerste lid bedoelde gebieden, dan wel
        - van de visrechthebbende vooraf schriftelijke toestemming heeft gekregen handmatig schelpdieren te rapen op die
      percelen;
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel8
  - number: 8.2.b
    text: degene die handmatig schelpdieren raapt voor eigen gebruik, tot ten hoogste tien kg. per dag.
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel8
  - number: '8.3'
    text: |-
      De vrijstelling, bedoeld in het tweede lid, geldt niet voor het vissen in het gebied genoemd in [bijlage 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003150
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003150
  - number: '8.4'
    text: |-
      Onverminderd het bepaalde in de voorgaande leden, is het verboden in de visserijzone, het zeegebied en de
      kustwateren schaal- en schelpdieren te rapen tussen één uur na zonsondergang en één uur vóór zonsopgang.
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel8
  - number: '9.1'
    text: Het is verboden in de visserijzone, het zeegebied en de kustwateren schelpdieren uit te zaaien of uit te zetten.
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel9
  - number: '9.2'
    text: 'Het in het eerste lid bedoelde verbod geldt niet voor het uitzetten of uitzaaien van:'
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel9
  - number: 9.2.a
    text: mosselen in de Waddenzee, indien deze afkomstig zijn uit het Nederlandse gedeelte van de Waddenzee;
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel9
  - number: 9.2.b
    text: mosselen en oesters in de Oosterschelde, indien deze afkomstig zijn uit de Oosterschelde.
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel9
  - number: '10.1'
    text: |-
      Het is verboden op of in de nabijheid van enig in [artikel 1][ref1] bedoeld water een vistuig voorhanden te hebben,
      indien een voor zover het gebruik van dat vistuig in dat water ingevolge het bepaalde in de vorige artikelen
      verboden is.


      [ref1]: https://wetten.overheid.nl/BWBR0003150#Artikel1
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003150
        artikel: '1'
  - number: '10.2'
    text: |-
      Het verbod geldt niet indien het vistuig zodanig is verpakt of in zodanige toestand is, dat dadelijk gebruik
      daarvan niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel10
  - number: '11.1'
    text: |-
      De in de [artikelen 3][ref1], [4][ref2], [5, onder a][ref3], [7, eerste lid][ref4], [8][ref5] en [9][ref6]
      gestelde verboden gelden niet voor degene, die voorzien is van een vergunning van de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003150#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003150#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003150#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0003150#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0003150#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0003150#Artikel9
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003150
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0003150
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0003150
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0003150
        artikel: '7'
      - id: ref5
        bwb_id: BWBR0003150
        artikel: '8'
      - id: ref6
        bwb_id: BWBR0003150
        artikel: '9'
  - number: '11.2'
    text: 'Een vergunning als bedoeld in het eerste lid, wordt niet verleend voor:'
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel11
  - number: 11.2.a
    text: |-
      het vissen in het gebied genoemd in [bijlage 4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003150
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003150
  - number: 11.2.b
    text: |-
      het vissen met vistuigen geschikt voor het vangen van schelpdieren in de gebieden genoemd in [bijlage 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003150
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003150
  - number: '11.3'
    text: |-
      In afwijking van het eerste lid is het verboden om van vrijdag 12.00 uur tot de daaropvolgende zondag 24.00 uur
      buiten de haven te zijn met een vaartuig dat enig vistuig aan boord heeft geschikt voor het vangen van garnalen
      (Crangon crangon).
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel11
  - number: '11.4'
    text: |-
      Het derde lid is niet van toepassing, indien het vissen wordt uitgevoerd als toeristische activiteit met een
      daarvoor geschikt vaartuig en de vangst niet op de markt wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel11
  - number: '11.5'
    text: |-
      In afwijking van het derde lid is het toegestaan om buiten de Nederlandse wateren tijdens opeenvolgende tijdvakken
      van twee weken telkens ten hoogste negen etmalen buiten de haven te zijn met een vaartuig dat enig vistuig aan
      boord heeft geschikt voor het vangen van garnalen (Crangon crangon). Het eerste tijdvak begint op de eerste zondag
      in oktober om 24.00 uur en loopt twee weken later op zondag om 24.00 uur af.
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel11
  - number: '11.6'
    text: |-
      Een vergunning als bedoeld in het eerste lid bestemd voor het vissen met enig vistuig geschikt voor het vangen van
      garnalen (Crangon, crangon) in de visserijzone, het zeegebied of de kustwateren bevat met ingang van 1 januari 2002
      de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel11
  - number: 11.6.a
    text: de naam van de vergunninghouder;
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel11
  - number: 11.6.b
    text: |-
      de lettertekens, het nummer, het motorvermogen en de tonnage van het vissersvaartuig ten behoeve waarvan de
      vergunning is verleend, en
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel11
  - number: 11.6.c
    text: |-
      het segment, bedoeld in [artikel 1, eerste lid, onderdeel l, van de Regeling visvergunning][ref1] waartoe het
      vissersvaartuig behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0016244#Artikel1
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0016244
        artikel: '1'
  - number: '11.7'
    text: 'Een vergunning als bedoeld in het zesde lid wordt ten aanzien van een vissersvaartuig slechts verleend indien:'
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel11
  - number: 11.7.a
    text: |-
      het vissersvaartuig dient ter vervanging van een vissersvaartuig of vissersvaartuigen ten aanzien waarvan een
      vergunning als bedoeld in het zesde lid is verleend en de vergunninghouder afstand heeft gedaan van zijn gehele
      vergunning ten gunste van de aanvrager van de vergunning en het totaal verleende aantal vergunningen als bedoeld in
      het zesde lid niet toeneemt;
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel11
  - number: 11.7.b
    text: |-
      het motorvermogen van dat vissersvaartuig niet meer bedraagt dan het motorvermogen van het vissersvaartuig of de
      vissersvaartuigen die worden vervangen;
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel11
  - number: 11.7.c
    text: |-
      het vissersvaartuig ten aanzien waarvan de vergunning wordt aangevraagd behoort tot hetzelfde segment als het
      vaartuig ten aanzien waarvan de vergunning laatstelijk is verleend;
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel11
  - number: 11.7.d
    text: |-
      het vissersvaartuig voldoet aan de voorwaarden van artikel 29 van [Verordening (EG) 850/98](31998R0850) van de Raad
      van de Europese Unie van 30 maart 1998 voor de instandhouding van de visbestanden via technische maatregelen voor
      de bescherming van jonge exemplaren van mariene organismen (PbEG L 125), en
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel11
  - number: 11.7.e
    text: |-
      de aanvrager een meetrapport van een onafhankelijk meetbureau als bedoeld in
      [artikel 1, eerste lid, onderdeel m, van de Regeling visvergunning][ref1] overlegt dat niet ouder is dan
      twee maanden en waaruit het motorvermogen blijkt van het vissersvaartuig ten behoeve waarvan de vergunning is
      aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0016244#Artikel1
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0016244
        artikel: '1'
  - number: '11.8'
    text: |-
      Onderdeel a van het zevende lid is niet van toepassing indien een vergunning als bedoeld in het zesde lid wordt
      aangevraagd door een aanvrager die op grond van [artikel 11b, derde lid][ref1], de vergunning heeft gereserveerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003150#Artikel11b
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003150
        artikel: 11b
  - number: '11.9'
    text: 'De vergunning, bedoeld in het zesde lid, wordt ingetrokken indien:'
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel11
  - number: 11.9.a
    text: de vergunninghouder afstand van de vergunning heeft gedaan als bedoeld in het zevende lid, onderdeel a;
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel11
  - number: 11.9.b
    text: |-
      de visserijactiviteiten van een vissersvaartuig definitief worden beëindigd als bedoeld in artikel 23 van
      verordening (EG) nr. 1198/2006 van de Raad van 27 juli 2006 inzake het Europees Visserijfonds (PbEU L223) en
      ten aanzien van de beëindiging door de Minister of door de Commissie van de Europese Gemeenschappen subsidie is
      verleend.
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel11
  - number: '11.10'
    text: |-
      De minister kan de vergunning, bedoeld in het zesde lid voor een periode van twee weken schorsen, indien naar
      het oordeel van de minister met het vissersvaartuig ten behoeve waarvan de vergunning is toegekend is gehandeld
      in strijd met het derde of vijfde lid. Indien binnen een jaar na afloop van de schorsing naar het oordeel van
      de minister nogmaals met het vaartuig in strijd met het derde of vijfde lid wordt gehandeld, kan de minister de
      vergunning voor een periode van vier weken schorsen.
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel11
  - number: 11a
    text: |-
      Het is verboden de visserij uit te oefenen met een vissersvaartuig waarvan het motorvermogen groter is dan het
      motorvermogen dat staat vermeld op de ten behoeve van dat vissersvaartuig verleende vergunning als bedoeld in
      [artikel 11, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003150#Artikel11
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0003150
        artikel: '11'
  - number: 11b.1
    text: |-
      De houder van een vergunning bestemd voor het vissen met enig vistuig geschikt voor het
      vangen van garnalen (Crangon, crangon) als bedoeld in [artikel 11][ref1] overlegt uiterlijk op
      19 augustus 2006 aan de minister een meetrapport van een onafhankelijk meetbureau als bedoeld in
      [artikel 1, eerste lid, onderdeel m, van de Regeling visvergunning][ref2] waaruit het motorvermogen blijkt van het
      vissersvaartuig ten behoeve waarvan de vergunning is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003150#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0016244#Artikel1
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0003150
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0016244
        artikel: '1'
  - number: 11b.2
    text: Het meetrapport, bedoeld in het eerste lid, is opgemaakt na 1 juni 2005.
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel11b
  - number: 11b.3
    text: |-
      In afwijking van het eerste lid kan de vergunninghouder uiterlijk op 19 augustus 2006 de vergunning bestemd voor
      het vissen met enig vistuig geschikt voor het vangen van garnalen (Crangon, crangon) inleveren bij de minister met
      het verzoek de vergunning in te trekken en voor hem te reserveren.
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel11b
  - number: 11b.4
    text: |-
      De minister kan de visvergunning schorsen indien naar het oordeel van de minister niet aan het eerste, tweede of
      derde lid is voldaan.
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel11b
  - number: 11b.5
    text: |-
      De minister kan de schorsing van de visvergunning, bedoeld in het vierde lid, beëindigen op het moment dat naar het
      oordeel van de minister blijkt dat na 19 augustus 2006 alsnog wordt voldaan aan het eerste en het tweede lid of aan
      het derde lid.
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel11b
  - number: '12.1'
    text: De minister kan vrijstelling of ontheffing verlenen van het bepaalde in deze beschikking.
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel12
  - number: '12.2'
    text: |-
      Een vrijstelling of ontheffing als bedoeld in het eerste lid, wordt niet verleend voor het vissen in het gebied
      genoemd in [bijlage 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003150
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003150
  - number: '13.1'
    text: |-
      Aan ontheffingen, vrijstellingen en vergunningen, als bedoeld in de vorige artikelen kunnen voorschriften worden
      verbonden. Zij kunnen ook onder beperkingen worden verleend. Zij kunnen worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel13
  - number: '13.2'
    text: |-
      Niet naleven van beperkingen of voorschriften als bedoeld in het eerst lid wordt aangemerkt als handelen zonder
      ontheffing, vrijstelling of vergunning als bedoeld in de [artikelen 11][ref1] en [12][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003150#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003150#Artikel12
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003150
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0003150
        artikel: '12'
  - number: 13a
    text: |-
      Bij het verlenen van ontheffingen, vrijstellingen en vergunningen, als bedoeld in de [artikelen 11][ref1] en
      [12][ref2] voor kustwateren alsmede bij het daaraan verbinden van voorschriften en het verlenen onder beperkingen,
      als bedoeld in [artikel 13][ref3], wordt mede rekening gehouden met de belangen van de natuurbescherming.


      [ref1]: https://wetten.overheid.nl/BWBR0003150#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003150#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0003150#Artikel13
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0003150
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0003150
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0003150
        artikel: '13'
  - number: '14'
    text: 'De volgende beschikkingen worden ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel14
  - number: 14.a
    text: de Beschikking van 27 april 1970 (Stcrt. 82) betreffende verboden vistuigen in de kustwateren;
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel14
  - number: 14.b
    text: |-
      de Beschikking van 21 mei 1974 (Stcrt. 99) betreffende het vissen met enig vistuig bestemd tot het vangen van
      kokkels/kokhanen (Cardium Edule L.);
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel14
  - number: 14.c
    text: de Beschikking regeling garnalenvangst 1975 (Stcrt. 197).
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel14
  - number: '15'
    text: |-
      Deze regeling treedt in werking op 1 januari 1978. Zij kan worden aangehaald als ‘Beschikking visserij
      visserijzone, zeegebied en kustwateren’.
    url: https://wetten.overheid.nl/BWBR0003150/2007-11-25#Artikel15
