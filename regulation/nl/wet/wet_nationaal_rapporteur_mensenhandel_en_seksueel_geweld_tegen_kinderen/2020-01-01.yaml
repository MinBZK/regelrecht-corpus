articles:
  - number: '1'
    text: Er is een Nationaal rapporteur mensenhandel en seksueel geweld tegen kinderen.
    url: https://wetten.overheid.nl/BWBR0034176/2020-01-01#Artikel1
  - number: '2'
    text: |-
      1 De Nationaal rapporteur mensenhandel en seksueel geweld tegen kinderen wordt in zijn werkzaamheden ondersteund
      door een bureau. Het bureau en de Nationaal rapporteur mensenhandel en seksueel geweld tegen kinderen vormen samen
      het instituut Nationaal rapporteur mensenhandel en seksueel geweld tegen kinderen.

      2 De medewerkers van het bureau leggen voor hun werkzaamheden uitsluitend verantwoording af aan de Nationaal
      rapporteur mensenhandel en seksueel geweld tegen kinderen.

      3 Onze Minister van Justitie en Veiligheid sluit, wijzigt en beëindigt arbeidsovereenkomsten met de medewerkers van
      het bureau op verzoek van de Nationaal rapporteur mensenhandel en seksueel geweld tegen kinderen.

      4 Onze Minister van Veiligheid en Justitie draagt, na overleg met de Nationaal rapporteur mensenhandel en seksueel
      geweld tegen kinderen, zorg voor de nodige voorzieningen ten behoeve van de werkzaamheden van het instituut
      Nationaal rapporteur mensenhandel en seksueel geweld tegen kinderen.
    url: https://wetten.overheid.nl/BWBR0034176/2020-01-01#Artikel2
  - number: '3'
    text: |-
      1 De Nationaal rapporteur mensenhandel en seksueel geweld tegen kinderen wordt bij koninklijk besluit benoemd op
      voordracht van Onze Minister van Veiligheid en Justitie, na overleg met Onze Minister van Volksgezondheid, Welzijn
      en Sport. Hij wordt benoemd voor ten hoogste vier jaar. Herbenoeming kan voor ten hoogste vier jaar plaatsvinden.

      2 De Nationaal rapporteur mensenhandel en seksueel geweld tegen kinderen wordt op eigen aanvraag ontslagen. Hij
      kan voorts bij koninklijk besluit worden geschorst en ontslagen wegens ongeschiktheid, onbekwaamheid of op andere
      zwaarwegende gronden.

      3 Bij regeling van Onze Minister van Justitie en Veiligheid wordt de rechtspositie van de Nationaal rapporteur
      mensenhandel en seksueel geweld tegen kinderen nader geregeld en kunnen regels worden gesteld met betrekking tot
      vereisten voor benoembaarheid tot Nationaal rapporteur mensenhandel en seksueel geweld tegen kinderen.
    url: https://wetten.overheid.nl/BWBR0034176/2020-01-01#Artikel3
  - number: '4'
    text: De Nationaal rapporteur mensenhandel en seksueel geweld tegen kinderen regelt zijn werkwijze en die van het bureau.
    url: https://wetten.overheid.nl/BWBR0034176/2020-01-01#Artikel4
  - number: '5'
    text: |-
      De Nationaal rapporteur mensenhandel en seksueel geweld tegen kinderen heeft tot taak:

      a. het onderzoeken van de ontwikkelingen in de omvang en kenmerken van mensenhandel en seksueel geweld tegen
      kinderen alsmede de effecten van genomen beleidsmaatregelen in de aanpak van mensenhandel en seksueel geweld tegen
      kinderen;

      b. het adviseren van de regering over de voorkoming en bestrijding van mensenhandel en seksueel geweld tegen
      kinderen;

      c. het periodiek rapporteren aan de regering door toezending van zijn rapporten ten aanzien van mensenhandel en ten
      aanzien van seksueel geweld tegen kinderen aan Onze Minister van Veiligheid en Justitie.
    url: https://wetten.overheid.nl/BWBR0034176/2020-01-01#Artikel5
  - number: '6'
    text: De Nationaal rapporteur mensenhandel en seksueel geweld tegen kinderen vervult zijn taak in onafhankelijkheid.
    url: https://wetten.overheid.nl/BWBR0034176/2020-01-01#Artikel6
  - number: '7'
    text: |-
      1 De rapporten, genoemd in [artikel 5, onder c][ref1], bevatten in ieder geval:

      a. een verantwoording van de wijze van onderzoek;

      b. de resultaten van het verrichte onderzoek en de daarop gebaseerde conclusies;

      c. aanbevelingen ter verbetering van de voorkoming en bestrijding van mensenhandel en seksueel geweld tegen
      kinderen.

      2 De aanbevelingen, genoemd in het eerste lid, onder c, kunnen zich richten tot de centrale overheid, lokale
      overheid en andere bestuursorganen, tot internationale organisaties, non-gouvernementele organisaties en tot andere
      betrokkenen.

      3 Onze Minister van Veiligheid en Justitie zendt de rapporten ter kennisneming aan de Tweede Kamer der Staten-
      Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0034176#Artikel5
    url: https://wetten.overheid.nl/BWBR0034176/2020-01-01#Artikel7
    references:
