        artikel: '5'
  - number: '8'
    text: |-
      De Nationaal rapporteur mensenhandel en seksueel geweld tegen kinderen stelt ieder jaar een jaarplan op en zendt
      dit aan Onze Minister van Veiligheid en Justitie.
    url: https://wetten.overheid.nl/BWBR0034176/2020-01-01#Artikel8
  - number: '9'
    text: |-
      Elke vier jaar wordt het instituut van de Nationaal rapporteur mensenhandel en seksueel geweld tegen kinderen
      geëvalueerd. Aan de hand van de evaluatie wordt bezien of wijziging van de taken van de Nationaal rapporteur
      mensenhandel en seksueel geweld tegen kinderen gewenst is.
    url: https://wetten.overheid.nl/BWBR0034176/2020-01-01#Artikel9
