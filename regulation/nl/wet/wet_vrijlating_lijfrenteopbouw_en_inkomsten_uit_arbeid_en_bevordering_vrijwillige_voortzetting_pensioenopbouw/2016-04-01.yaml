preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de lijfrenteopbouw en inkomsten uit arbeid deels vrij
    te laten voor de personen die een beroep doen op algemene bijstand op grond van de Participatiewet en de termijn te
    verlengen waarin deelnemers aan een pensioenregeling kunnen kiezen voor vrijwillige voortzetting daarvan;

    Zo is het dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-Generaal,
    hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0037322/2016-04-01#ArtikelAanhef
articles:
  - number: Va
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid zendt binnen drie jaar na de inwerkingtreding van deze wet aan
      de Staten-Generaal een verslag over de doeltreffendheid en de effecten van de toepassing van de voorwaarden en de
      bedragen, genoemd in [artikel 15, tweede lid, onderdeel b, van de Participatiewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel15
    url: https://wetten.overheid.nl/BWBR0037322/2016-04-01#ArtikelVa
    references:
