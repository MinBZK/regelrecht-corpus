  - number: '5'
    text: |-
      Ten aanzien van luchtvaartuigen als bedoeld in de [artikelen 2][ref1], [3][ref2] en [4][ref3], moeten de
      Nederlandse bijzondere luchtwaardigheidsaanwijzingen voor zover zij van toepassing en van kracht zijn, zijn
      opgevolgd.


