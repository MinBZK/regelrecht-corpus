  - number: '4'
    text: |-
      Naast de in [artikel 1][ref1] genoemde documenten worden, voor een luchtvaartuig dat is vervaardigd in een staat,
      waarmee Nederland een overeenkomst heeft gesloten inzake wederzijdse erkenning van bewijzen van luchtwaardigheid
      en dat wordt geïmporteerd uit een staat waarmee Nederland geen overeenkomst heeft gesloten inzake wederzijdse
      erkenning van bewijzen van luchtwaardigheid, voor de afgifte van het standaard-BvL bij de Minister van Verkeer en
      Waterstaat de volgende documenten ingediend:

      a. het destijds door de staat, waarin het luchtvaartuig is vervaardigd, afgegeven bewijs van luchtwaardigheid voor
      export;

      b. de documenten waaruit blijkt dat het luchtvaartuig in overeenstemming is met het type-certificaat, of het door
      de Minister van Verkeer en Waterstaat geaccepteerd type-ontwerp, dan wel een aanvullend type-certificaat dat voor
      het type-ontwerp is afgegeven, alsmede de van toepassing zijnde luchtwaardigheidsaanwijzingen en na inspectie
      volgens de van toepassing zijnde luchtwaardigheidseisen, luchtwaardig is bevonden en geschikt voor veilige
      operatie.


