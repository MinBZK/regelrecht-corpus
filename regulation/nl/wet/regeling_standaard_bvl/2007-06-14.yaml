  - number: 5.a
    text: |-
      1 In dit artikel wordt verstaan onder:

        - Verordening (EG) nr. 1592/2002 (PbEG L 240): verordening van het Europees Parlement en de Raad van de Europese
      Gemeenschappen van 15 juli 2002 tot vaststelling van gemeenschappelijke regels op het gebied van burgerluchtvaart
      en tot oprichting van een Europees Agentschap voor de veiligheid van de luchtvaart;
        - Verordening (EG) nr. 1702/2003 (PbEG L 243): verordening van de Commissie van de Europese Gemeenschappen van
      24 september 2003 tot vaststelling van uitvoeringsvoorschriften inzake de luchtwaardigheid en milieucertificering
      van luchtvaartuigen en aanverwante producten, onderdelen en uitrustingsstukken, alsmede voor de certificering van
      ontwerp- en productieorganisaties;
        - Verordening (EG) nr. 2042/2003 (PbEG L 315): verordening van de Commissie van de Europese Gemeenschappen van
      20 november 2003 betreffende de permanente luchtwaardigheid van luchtvaartuigen en luchtvaartproducten, -onderdelen
      en -uitrustingsstukken, en betreffende de goedkeuring van bij voornoemde taken betrokken organisaties en personen;
        - Airworthiness Review Certificate (ARC): certificaat van herbeoordeling van de luchtwaardigheid dat wordt
      afgegeven door de Minister of een daartoe erkende managementorganisatie voor permanente luchtwaardigheid;
        - Continuous Airworthiness Management Organisation (CAMO): een ingevolge Verordening (EG) 2042/2003 erkende
      management organisatie voor permanente luchtwaardigheid;
        - Part 21: Bijlage 1 bij Verordening (EG) nr. 1702/2003 betreffende certificatieprocedures voor luchtvaartuigen,
      aanverwante producten en onderdelen;
        - Part 21 subpart H: onderdeel van Part 21 waarin de eisen en de procedures worden vastgelegd voor de afgifte van
      bewijzen van luchtwaardigheid.

      2 De Minister van Verkeer en Waterstaat kan bij een aanvraag voor de afgifte van een standaard-BvL voor een
      luchtvaartuig uit de algemene luchtvaart dat valt onder Verordening (EG) nr. 1592/2002, in plaats van een
      standaard-BvL met een geldigheid van 1 jaar, een standaard-BvL voor onbepaalde duur tezamen met een ARC voor 1
      jaar afgeven.

      3 De Minister van Verkeer en Waterstaat geeft bij een aanvraag voor de afgifte van een standaard-BvL voor een
      luchtvaartuig dat valt onder Verordening (EG) nr. 1592/2002, op basis van een positieve rapportage van een daartoe
      erkende CAMO, volgens de voorschriften van Part 21 Subpart H, een standaard-BvL voor onbepaalde duur tezamen met
      een ARC voor 1 jaar af.
    url: https://wetten.overheid.nl/BWBR0012876/2007-06-14#Artikel5.a
  - number: '6'
    text: |-
      1 Indien is gebleken, dat de gegevens, vermeld op het standaard-BvL, niet met de werkelijkheid overeenkomen, wordt
      een standaard-Bvl, dat de juiste gegevens vermeldt, aan de houder gezonden.

      2 De eigenaar of houder is verplicht het vroeger ontvangen standaard-BvL binnen een week na de datum van verzending
      van het in het vorige lid bedoelde gewijzigde exemplaar aan de Minister van Verkeer en Waterstaat te zenden.
    url: https://wetten.overheid.nl/BWBR0012876/2007-06-14#Artikel6
  - number: '7'
    text: |-
      Bij de overdracht van een luchtvaartuig van wordt het Standaard BvL door de voormalige houder van dat luchtvaartuig
      overgedragen aan de nieuwe houder van dat luchtvaartuig.
    url: https://wetten.overheid.nl/BWBR0012876/2007-06-14#Artikel7
  - number: '8'
    text: |-
      1 De aanvraag voor de verlenging van het standaard-BvL wordt ingediend en afgehandeld volgens de
      [Regeling verlenging bewijzen van luchtwaardigheid][ref1]. De verlenging van de termijn van geldigheid kan nog tot
      hoogstens zes maanden na het verstrijken van de op het standaard-BvL vermelde termijn van geldigheid geschieden.

      2 Bij verlenging wordt aan de houder een nieuw bewijs gezonden, waaruit blijkt tot en met welke datum het bewijs
      geldig is.


      [ref1]: https://wetten.overheid.nl/BWBR0011596
    url: https://wetten.overheid.nl/BWBR0012876/2007-06-14#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011596
  - number: '9'
    text: |-
      1 Een standaard-BvL kan door de Minister van Verkeer en Waterstaat worden vernieuwd, indien het is verloren of
      indien het onleesbaar, beschadigd of anderszins onbruikbaar is geworden.

      2 Indien een standaard-BvL wegens verlies is vernieuwd en het verloren bewijs wordt teruggevonden, is de eigenaar
      of houder van het luchtvaartuig verplicht het teruggevonden standaard-BvL zo spoedig mogelijk aan de Minister van
      Verkeer en Waterstaat te zenden.

      3 Indien een standaard-BvL anders dan wegens vermissing is vernieuwd, is de eigenaar of houder van het
      luchtvaartuig verplicht het oorspronkelijke standaard-BvL binnen een week na de datum van verzending van het nieuwe
      bewijs aan de Minister van Verkeer en Waterstaat te zenden.
    url: https://wetten.overheid.nl/BWBR0012876/2007-06-14#Artikel9
  - number: '10'
    text: Deze regeling treedt in werking met ingang van 15 oktober 2001.
