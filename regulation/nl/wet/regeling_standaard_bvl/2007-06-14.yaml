preamble:
  text: |-
    Gelet op artikel 3.24 van de Wet luchtvaart en op de artikelen 16, tweede lid, en 22, onder a, b en c, van het
    Besluit luchtwaardigheid;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012876/2007-06-14#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De aanvraag voor afgifte van een standaard-BvL geschiedt door indiening bij de Minister van Verkeer en Waterstaat
      van een volledig ingevuld en ondertekend formulier, waarvan exemplaren kosteloos bij de Minister van Verkeer en
      Waterstaat verkrijgbaar zijn.

      2 Bij de aanvraag van een standaard bewijs van luchtwaardigheid wordt ten minste ingediend:

      a. een gewichts- en zwaartepuntsrapport en een beladingsschema indien dit van toepassing is volgens de van
      toepassing zijnde JAR;

      b. het vlieghandboek, indien vereist door de van toepassing zijnde luchtwaardigheidseisen;

      c. voor een gebruikt luchtvaartuig de historische gegevens ter vaststelling van de productie, modificatie en
      onderhoudsstandaard van het luchtvaartuig;

      d. een nauwkeurige omschrijving van de eventuele afwijkingen ten opzichte van het geaccepteerde type-ontwerp.
      Indien de aanvrager hieraan niet kan voldoen, worden de gegevens ingediend, aan de hand waarvan de bedoelde
      afwijkingen kunnen worden vastgesteld.

      3 Indien de gegevens geheel of gedeeltelijk beschikbaar zijn op microfilms of computer-gegevensdragers, kan de
      Minister van Verkeer en Waterstaat toestaan dat deze microfilms of computer-gegevensdragers bij de aanvraag worden
      ingediend. De aanvrager verstrekt de benodigde leesapparatuur, die binnen enkele seconden een afdruk van het
      geprojecteerde beeld of de gegevens kan vervaardigen, aan de Minister van Verkeer en Waterstaat.

      4 Het model van het standaard-BvL is opgenomen in de bij deze regeling behorende [bijlage 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012876
    url: https://wetten.overheid.nl/BWBR0012876/2007-06-14#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0012876
  - number: '2'
    text: |-
      Naast de in [artikel 1][ref1] genoemde documenten worden voor een luchtvaartuig, dat voldoet aan een type-
      certificaat dat door de Minister van Verkeer en Waterstaat is afgegeven op basis van een door de JAA uitgevoerde
      certificatie procedure voor de afgifte van het standaard-BvL, bij de Minister van Verkeer en Waterstaat de volgende
      documenten ingediend:

      a. voor een nieuw luchtvaartuig dat geproduceerd is in een JAA-lidstaat, genoemd in de bij deze regeling behorende
      [bijlage 2][ref2]:

      1º een verklaring van conformiteit van de houder van een POA, of

      2º in geval van productie met een toestemming volgens JAR 21 subpart F, een verklaring van conformiteit van de
      producent, bekrachtigd door de autoriteit van die JAA-lidstaat;

      b. voor een nieuw luchtvaartuig dat geproduceerd is in een staat waarmee de Minister van Verkeer en Waterstaat een
      overeenkomst heeft gesloten aangaande wederzijdse erkenning van bewijzen van luchtwaardigheid niet zijnde een JAA-
      lidstaat als bedoeld onder a:

      1º een verklaring van de autoriteit van het exporterende land, dat het luchtvaartuig voldoet aan een door de
      Minister van Verkeer en Waterstaat geaccepteerd type ontwerp, afgegeven in overeenstemming met de overeenkomst;

      c. voor een gebruikt luchtvaartuig komende uit een JAA-lidstaat genoemd in de bij deze regeling behorende
      [bijlage 2][ref3]:

      1º een geldig bewijs van luchtwaardigheid afgegeven door de bevoegde autoriteit van die JAA-lidstaat, of

      2º de documenten waaruit blijkt dat het luchtvaartuig in overeenstemming is met het type-certificaat dan wel
      met een aanvullend type-certificaat dat voor het type-ontwerp is afgegeven, alsmede met de van toepassing zijnde
      luchtwaardigheidsaanwijzingen en na inspectie volgens de van toepassing zijnde JAR, luchtwaardig is bevonden en
      geschikt voor veilige operatie;

      d. voor een gebruikt luchtvaartuig komende uit een staat waarmee de Minister van Verkeer en Waterstaat een
      overeenkomst heeft gesloten, aangaande wederzijdse erkenning van bewijzen van luchtwaardigheid niet zijnde een JAA-
      lidstaat als bedoeld onder c:

      1º de documenten waaruit blijkt dat het luchtvaartuig in overeenstemming is met het type-certificaat dan wel
      met een aanvullend type-certificaat dat voor het type-ontwerp is afgegeven, alsmede met de van toepassing zijnde
      luchtwaardigheidsaanwijzingen en na inspectie volgens de van toepassing zijnde JAR, luchtwaardig is bevonden en
      geschikt voor veilige operatie.


