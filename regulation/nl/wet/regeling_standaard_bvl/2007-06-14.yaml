  - number: '3'
    text: |-
      1 Naast het indienen van de in [artikel 1][ref1] genoemde documenten wordt, voor een luchtvaartuig dat
      voldoet aan een type-certificaat dat op basis van een door de Minister van Verkeer en Waterstaat uitgevoerde
      certificatieprocedure is afgegeven, of een door de Minister van Verkeer en Waterstaat geaccepteerd type-ontwerp:

      a. dat is ontworpen, gebouwd, beproefd en uitgerust in de Verenigde Staten van Amerika en wordt geïmporteerd uit de
      Verenigde Staten van Amerika binnen het raam van de Overeenkomst inzake afgifte van bewijzen van luchtwaardigheid
      (Trb. 1974, 60), voor de afgifte van het standaard-BvL, aangetoond dat het:

      1º is ontworpen, gebouwd, beproefd en uitgerust overeenkomstig de van toepassing zijnde wetten, bepalingen en eisen
      van de Verenigde Staten van Amerika;

      2º voldoet aan alle bijzondere eisen die op de datum van aanvraag voor het standaard-BvL van toepassing zijn, voor
      zover die eisen ter kennis zijn gebracht van de Verenigde Staten van Amerika;

      3º is voorzien van een door de FAA afgegeven bewijs van luchtwaardigheid voor export naar Nederland;

      b. dat is ontworpen, gebouwd, beproefd en uitgerust in Canada en wordt geïmporteerd uit Canada binnen het raam van
      de Overeenkomst inzake afgifte van bewijzen van luchtwaardigheid, voor de afgifte van het standaard-BvL, aangetoond
      dat het:

      1º is ontworpen, gebouwd, beproefd en uitgerust overeenkomstig de van toepassing zijnde wetten, bepalingen en eisen
      van Canada;

      2º voldoet aan alle bijzondere eisen die op de datum van aanvraag voor het standaard-BvL van toepassing zijn;

      3º is voorzien van een door de Transport Canada afgegeven bewijs van luchtwaardigheid voor export naar Nederland;

      c. dat is ontworpen, gebouwd, beproefd en uitgerust in het gebied van een overeenkomst sluitende staat als bedoeld
      in de Multilaterale Overeenkomst inzake bewijzen van luchtwaardigheid van ingevoerde luchtvaartuigen (Trb. 1961,
      117) en die binnen het raam van die overeenkomst wordt geïmporteerd, voor de afgifte van het standaard-BvL,
      aangetoond dat het:

      1º is ontworpen, gebouwd, beproefd en uitgerust overeenkomstig de van toepassing zijnde wetten, bepalingen en eisen
      van de staat waarin dat is gebeurd;

      2º voldoet aan de van toepassing zijnde minimum eisen die zijn vastgesteld overeenkomstig het Verdrag van Chicago;

      3º voldoet aan alle overige bijzondere eisen, die op de datum van aanvraag voor het standaard-BvL van toepassing
      zijn, voor zover die eisen ter kennis zijn gebracht van de overeenkomst sluitende staten;

      4º is voorzien van een door de exporterende staat afgegeven bewijs van luchtwaardigheid, of een bewijs van
      luchtwaardigheid voor export naar Nederland, dat niet eerder is afgegeven dan 60 dagen onmiddellijk voorafgaand aan
      de datum van aanvraag voor afgifte van een standaard-BvL.

      2 Naast het indienen van de in [artikel 1][ref2] genoemde documenten worden, voor een luchtvaartuig dat
      voldoet aan een type-certificaat dat op basis van een door de Minister van Verkeer en Waterstaat uitgevoerde
      certificatieprocedure is afgegeven, of een door de Minister van Verkeer en Waterstaat geaccepteerd type-ontwerp:

      a. dat in de Verenigde Staten van Amerika is vervaardigd en dat uit een andere staat waarmee de Minister
      van Verkeer en Waterstaat een overeenkomst heeft gesloten, aangaande wederzijdse erkenning van bewijzen van
      luchtwaardigheid, wordt geïmporteerd, voor de afgifte van het standaard-BvL eerste lid onder a.1° en a.2° van
      toepassing verklaart en door de aanvrager nog de volgende gegevens ingediend:

      1º het destijds afgegeven Amerikaanse bewijs van luchtwaardigheid voor export;

      2º een bewijs van luchtwaardigheid, of een bewijs van luchtwaardigheid voor export naar Nederland, afgegeven door
      de staat waaruit het vliegtuig wordt geïmporteerd, niet eerder dan 60 dagen, onmiddellijk voorafgaande aan de datum
      van de aanvraag voor afgifte van een standaard-BvL;

      b. dat in Canada is vervaardigd en dat uit een andere staat waarmee de Minister van Verkeer en Waterstaat een
      overeenkomst heeft gesloten, aangaande wederzijdse erkenning van bewijzen van luchtwaardigheid, wordt geïmporteerd,
      voor de afgifte van het standaard-BvL eerste lid onder b.1° en b.2° van toepassing verklaard en door de aanvrager
      nog de volgende gegevens ingediend:

      1º het destijds afgegeven Canadese bewijs van luchtwaardigheid voor export;

      2º een bewijs van luchtwaardigheid of een bewijs van luchtwaardigheid voor export naar Nederland, afgegeven door
      de staat waaruit het vliegtuig wordt geïmporteerd, niet eerder dan 60 dagen, onmiddellijk voorafgaande aan de datum
      van de aanvraag voor afgifte van een standaard-BvL;

      c. dat is vervaardigd in een overeenkomst sluitende staat als bedoeld in de Multilaterale Overeenkomst inzake
      bewijzen van luchtwaardigheid van ingevoerde luchtvaartuigen (Trb. 1961, 117) en dat uit een andere staat waarmee
      de Minister van Verkeer en Waterstaat een overeenkomst heeft gesloten, aangaande wederzijdse erkenning van bewijzen
      van luchtwaardigheid, voor de afgifte van het standaard-BvL eerste lid onder c.1° t/m c.3° van toepassing verklaard
      en door de aanvrager nog de volgende gegevens ingediend:

      1º het destijds door de staat, waarin het luchtvaartuig is vervaardigd, afgegeven bewijs van luchtwaardigheid voor
      export;

      2º een bewijs van luchtwaardigheid, of een bewijs van luchtwaardigheid voor export naar Nederland, afgegeven door
      de staat waaruit het luchtvaartuig wordt geïmporteerd, niet eerder dan 60 dagen, onmiddellijk voorafgaande aan de
      datum van de aanvraag.


