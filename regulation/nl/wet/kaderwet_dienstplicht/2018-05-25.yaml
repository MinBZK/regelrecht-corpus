---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: kaderwet_dienstplicht
regulatory_layer: WET
publication_date: '2019-05-16'
valid_from: '2018-05-25'
bwb_id: BWBR0008589
url: https://wetten.overheid.nl/BWBR0008589/2018-05-25
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is ingevolge artikel 98, derde lid, eerste volzin, en
    het additionele artikel XXX van de Grondwet regels te stellen met betrekking tot de bevoegdheid tot opschorting
    van de oproeping van dienstplichtigen in werkelijke dienst en de oproeping van dienstplichtigen in buitengewone
    omstandigheden; dat het voorts gewenst is de afzonderlijke regelingen op het gebied van de dienstplicht samen te
    voegen tot een Kaderwet dienstplicht;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Defensie;'
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel1
  - number: 1.1.b
    text: 'dienstplichtige: hij die ingevolge deze wet geschikt is verklaard voor het vervullen van werkelijke dienst;'
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel1
  - number: 1.1.c
    text: 'groot verlof: tijd gedurende welke de dienstplichtige zich niet in werkelijke dienst bevindt of moet bevinden.'
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel1
  - number: '1.2'
    text: |-
      Waar in deze wet en de daarop berustende bepalingen wordt gesproken van personen, die ongeschikt zijn verklaard,
      zijn ontheven van de verplichting tot het vervullen van werkelijke dienst, zijn uitgesloten van de dienstplicht
      of te wier aanzien een rechterlijke uitspraak heeft plaatsgehad, worden hieronder, voor zover het tegendeel niet
      blijkt, verstaan degenen omtrent wie het desbetreffende besluit of de desbetreffende uitspraak onherroepelijk is
      geworden.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel1
  - number: '1.3'
    text: |-
      Waar in deze wet en de daarop berustende bepalingen wordt gesproken van het oproepen van dienstplichtigen voor het
      vervullen van werkelijke dienst, wordt daaronder ten aanzien van hen die zich reeds in werkelijke dienst bevinden,
      verstaan het houden of blijven in werkelijke dienst.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel1
  - number: '2'
    text: |-
      Uitgezonderd paragraaf 2 van hoofdstuk 1 is deze wet niet van toepassing op hen die als militair ambtenaar zijn
      aangesteld.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel2
  - number: '3.1'
    text: |-
      Voor de dienstplicht wordt ingeschreven de mannelijke Nederlander die op 1 februari van het jaar waarin hij de
      leeftijd van 17 jaar bereikt als ingezetene in de basisregistratie personen is ingeschreven of had behoren te zijn
      ingeschreven.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel3
  - number: '3.2'
    text: 'Voor de dienstplicht wordt voorts ingeschreven:'
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel3
  - number: 3.2.a
    text: |-
      de mannelijke Nederlander, die na het in het eerste lid bedoelde tijdstip en voor 1 januari van het jaar, waarin
      hij de leeftijd van 35 jaar bereikt als ingezetene in de basisregistratie personen wordt ingeschreven of behoort te
      worden ingeschreven; en
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel3
  - number: 3.2.b
    text: |-
      de mannelijke persoon die in het in onderdeel a bedoelde tijdvak Nederlander of opnieuw Nederlander is geworden,
      indien hij als ingezetene in de basisregistratie personen is ingeschreven of had behoren te zijn ingeschreven.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel3
  - number: '4.1'
    text: |-
      De inschrijving voor de dienstplicht geschiedt door het college van burgemeester en wethouders van de gemeente,
      waar de in [artikel 3][ref1] bedoelde personen op het tijdstip van de inschrijving, als ingezetene met een adres in
      de basisregistratie personen zijn ingeschreven of hadden behoren te zijn ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0008589#Artikel3
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008589
        artikel: '3'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '4.2'
    text: |-
      Voor zover Onze Minister het nodig oordeelt, geschiedt de inschrijving op aangifte en vindt deze plaats bij het
      college van burgemeester en wethouders van de gemeente, bedoeld in het eerste lid. In dat geval worden bij algemene
      maatregel van bestuur nadere regels gesteld met betrekking tot inschrijving op aangifte. Deze algemene maatregel
      van bestuur bevat ten minste een regeling omtrent de wijze waarop en de termijn waarbinnen de inschrijving op
      aangifte plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel4
  - number: '5'
    text: |-
      Onze Minister zendt zo spoedig mogelijk nadat de inschrijving heeft plaatsgevonden aan iedere voor de dienstplicht
      ingeschreven persoon een bericht van inschrijving met vermelding van het registratienummer.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel5
  - number: '6.1'
    text: |-
      Voor zover Onze Minister het nodig acht, is iedere ingeschrevene verplicht zich te onderwerpen aan een onderzoek
      ter beoordeling van zijn lichamelijke en geestelijke geschiktheid voor het vervullen van werkelijke dienst in het
      algemeen en ter verkrijging van gegevens voor zijn bestemming in de krijgsmacht, in deze wet aangeduid als keuring.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel6
  - number: '6.2'
    text: Ten behoeve van de keuring stelt Onze Minister keuringscommissies in.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel6
  - number: '6.3'
    text: |-
      De ingeschrevene is verplicht bij de aanmelding voor het ondergaan van de keuring de aan hem toegezonden oproep te
      tonen en een document te overleggen als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '6.4'
    text: |-
      De keuringsuitslag wordt binnen twee weken na de keuring door een keuringscommissie vastgesteld. Bij
      geschiktverklaring vermeldt de bekendmaking dat de betrokkene als dienstplichtige wordt aangemerkt.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel6
  - number: '7.1'
    text: |-
      Een aanvraag om herkeuring dient door betrokkene binnen zes weken na de bekendmaking van de keuringsuitslag
      schriftelijk aan de herkeuringscommissie te worden gedaan. De aanvraag vermeldt mede het registratienummer en is
      met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel7
  - number: '7.2'
    text: Ten behoeve van de herkeuring stelt Onze Minister een of meer herkeuringscommissies in.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel7
  - number: '7.3'
    text: Aan een herkeuring wordt niet deelgenomen door een geneeskundige die de keuring heeft verricht.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel7
  - number: '7.4'
    text: |-
      Indien de aanvrager is verhinderd aan de oproep voor de herkeuring gevolg te geven, doet hij daarvan schriftelijk
      met opgave van redenen onverwijld mededeling aan de herkeuringscommissie. Indien de redenen waarom aan de oproep
      geen gevolg werd gegeven, naar het oordeel van de herkeuringscommissie gegrond zijn, wordt een nieuwe datum voor
      de herkeuring vastgesteld en wordt de aanvrager daarvoor opnieuw opgeroepen. Indien de redenen ongegrond worden
      geoordeeld, vervalt de aanvraag tot herkeuring.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel7
  - number: '7.5'
    text: |-
      De herkeuringsuitslag wordt binnen twee weken na de herkeuring door een herkeuringscommissie vastgesteld. Bij
      geschiktverklaring vermeldt de bekendmaking dat de betrokkene als dienstplichtige wordt aangemerkt.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel7
  - number: '8.1'
    text: 'De beslissing van een keuringscommissie of een herkeuringscommissie betreft:'
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel8
  - number: 8.1.a
    text: geschiktheid voor het vervullen van werkelijke dienst;
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel8
  - number: 8.1.b
    text: tijdelijke ongeschiktheid voor het vervullen van werkelijke dienst; of
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel8
  - number: 8.1.c
    text: ongeschiktheid voor het vervullen van werkelijke dienst.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel8
  - number: '8.2'
    text: De beslissing van een herkeuringscommissie treedt in de plaats van die van een keuringscommissie.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel8
  - number: '8.3'
    text: |-
      Na het verstrijken van de duur van de tijdelijke ongeschiktheid wordt de betrokkene opnieuw voor een keuring
      opgeroepen.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel8
  - number: '9'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot keuring en herkeuring als
      bedoeld in deze paragraaf. Deze algemene maatregel van bestuur bevat ten minste een regeling omtrent:
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel9
  - number: 9.a
    text: de omvang en de samenstelling van de keurings- en herkeuringscommissies;
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel9
  - number: 9.b
    text: de vereisten waaraan de leden van de keurings- en herkeuringscommissies moeten voldoen;
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel9
  - number: 9.c
    text: de omvang van de keuring en de herkeuring; en
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel9
  - number: 9.d
    text: de wijze waarop de geschiktheid of ongeschiktheid voor het vervullen van werkelijke dienst wordt beoordeeld.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel9
  - number: '10'
    text: |-
      Bestaat er naar het oordeel van Onze Minister gegrond vermoeden, dat iemand voorgoed ongeschikt is verklaard
      voor het vervullen van werkelijke dienst als gevolg van bedrog, dan wordt de desbetreffende beslissing door hem
      vervallen verklaard en komen op betrokkene de verplichtingen te rusten als ware hij geschikt verklaard.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel10
  - number: '11.1'
    text: Van de dienst wordt uitgesloten
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel11
  - number: 11.1.a
    text: |-
      hij die bij rechterlijke uitspraak is veroordeeld tot een of meer straffen, zwaarder of tezamen zwaarder dan een
      gevangenisstraf van zes maanden; of
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel11
  - number: 11.1.b
    text: hij die bij rechterlijke uitspraak is ontzet uit het recht om bij de gewapende macht te dienen.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel11
  - number: '11.2'
    text: |-
      Onverminderd het eerste lid kan van de dienst worden uitgesloten hij die bij rechterlijke uitspraak is
      veroordeeld ter zake van een van de misdrijven omschreven in [artikel 36, tweede lid][ref1], van deze wet en in de
      [artikelen 109][ref2] en [139 van het Wetboek van Militair Strafrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008589#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0001869#Artikel109
      [ref3]: https://wetten.overheid.nl/BWBR0001869#Artikel139
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008589
        artikel: '36'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0001869
        artikel: '109'
      - id: ref3
        bwb_id: BWBR0001869
        artikel: '139'
  - number: '11.3'
    text: |-
      Voor de toepassing van het eerste lid wordt hij, die gratie heeft gekregen, geacht slechts te zijn veroordeeld tot
      de straf, welke krachtens de gratie op hem blijft rusten of komt te rusten.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel11
  - number: '11.4'
    text: De uitsluiting geschiedt door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel11
  - number: '11.5'
    text: In bijzondere gevallen kan de uitsluiting, bedoeld in het eerste lid, achterwege worden gelaten.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel11
  - number: '11.6'
    text: |-
      Onze Minister van Justitie bewerkstelligt dat ten aanzien van de voor de dienstplicht ingeschreven personen, die in
      de termen vallen om te worden uitgesloten als bedoeld in het eerste en tweede lid, de nodige opgaven worden gedaan
      aan Onze Minister. Onze Minister verwerkt strafrechtelijke persoonsgegevens voor zover dit noodzakelijk is voor de
      toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel11
  - number: '12'
    text: |-
      Op aanvraag kan door Onze Minister uitstel worden verleend van de in [artikel 18, eerste lid][ref1], bedoelde
      verplichtingen tot het vervullen van werkelijke dienst in de gevallen, waarin dit in het belang van de
      dienstplichtige of om andere redenen wenselijk is en voor zover het militair belang niet wordt geschaad. De
      aanvraag vermeldt mede het registratienummer en is met redenen omkleed.


      [ref1]: https://wetten.overheid.nl/BWBR0008589#Artikel18
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008589
        artikel: '18'
        hoofdstuk: '1'
        paragraaf: '5'
  - number: '13'
    text: |-
      Op aanvraag wordt door Onze Minister ontheffing verleend van de in [artikel 18, eerste lid][ref1], bedoelde
      verplichtingen tot het vervullen van werkelijke dienst wegens:


      [ref1]: https://wetten.overheid.nl/BWBR0008589#Artikel18
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008589
        artikel: '18'
        hoofdstuk: '1'
        paragraaf: '5'
  - number: 13.a
    text: persoonlijke onmisbaarheid; of
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel13
  - number: 13.b
    text: de aanwezigheid van bijzondere omstandigheden.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel13
  - number: '14'
    text: |-
      Onze Minister verleent vrijstelling van de in [artikel 18, eerste lid][ref1], bedoelde verplichtingen tot het
      vervullen van werkelijke dienst wegens:


      [ref1]: https://wetten.overheid.nl/BWBR0008589#Artikel18
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008589
        artikel: '18'
        hoofdstuk: '1'
        paragraaf: '5'
  - number: 14.a
    text: kostwinnerschap;
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel14
  - number: 14.b
    text: het bekleden van een geestelijk ambt of een opleiding tot zodanig ambt; of
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel14
  - number: 14.c
    text: broederdienst.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel14
  - number: '16.1'
    text: Uitstel, een ontheffing of een vrijstelling kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel16
  - number: '16.2'
    text: Aan uitstel, een ontheffing of een vrijstelling kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel16
  - number: '16.3'
    text: 'Uitstel, een ontheffing of een vrijstelling kan door Onze Minister worden ingetrokken, wanneer:'
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel16
  - number: 16.3.a
    text: een of meer redenen waarom het uitstel, de ontheffing of de vrijstelling is verleend, is of zijn vervallen;
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel16
  - number: 16.3.b
    text: een of meer van de daaraan verbonden voorschriften niet wordt of worden nageleefd; of
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel16
  - number: 16.3.c
    text: |-
      na de verlening zodanige feiten of omstandigheden bekend zijn geworden dat, indien deze ten tijde van de verlening
      bekend waren geweest, het uitstel, de ontheffing of de vrijstelling niet of niet in die vorm zou zijn verleend.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel16
  - number: '17'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot uitstel, ontheffing
      en vrijstelling als bedoeld in de [artikelen 12][ref1], [13][ref2], en [14][ref3]. De krachtens de eerste volzin
      vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan acht weken na de datum van uitgifte
      van het *Staatsblad* waarin hij is geplaatst. Van de plaatsing wordt onverwijld mededeling gedaan aan de beide
      kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0008589#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0008589#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0008589#Artikel14
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008589
        artikel: '12'
        hoofdstuk: '1'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0008589
        artikel: '13'
        hoofdstuk: '1'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0008589
        artikel: '14'
        hoofdstuk: '1'
        paragraaf: '5'
  - number: '18.1'
    text: |-
      De dienstplichtige is in gewone omstandigheden uitsluitend verplicht tot het vervullen van werkelijke dienst voor
      opleiding en oefening alsmede voor herhalingsoefeningen.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel18
  - number: '18.2'
    text: |-
      Oproeping voor opleiding en oefening respectievelijk herhalingsoefeningen geschiedt door Onze Minister. De
      dienstplichtigen zijn verplicht aan de oproeping gevolg te geven.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel18
  - number: '18.3'
    text: |-
      Onverminderd de [artikelen 12][ref1], [13][ref2], [14][ref3], alsmede [het vijfde lid van dit artikel][ref4], gaat
      de oproeping van jongere dienstplichtigen zoveel mogelijk vooraf aan de oproeping van oudere dienstplichtigen. Voor
      opleiding en oefening worden dienstplichtigen ouder dan 35 jaar niet opgeroepen. In geval van herhalingsoefeningen
      vindt geen oproeping van dienstplichtigen ouder dan 45 jaar plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0008589#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0008589#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0008589#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0008589#Artikel18
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008589
        artikel: '12'
        hoofdstuk: '1'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0008589
        artikel: '13'
        hoofdstuk: '1'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0008589
        artikel: '14'
        hoofdstuk: '1'
        paragraaf: '5'
      - id: ref4
        bwb_id: BWBR0008589
        artikel: '18'
        hoofdstuk: '1'
        paragraaf: '5'
  - number: '18.4'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld omtrent de duur van de werkelijke dienst, bedoeld
      in het eerste lid, die voor groepen van functies verschillend kan worden gesteld. De duur van de opleiding
      en oefening bedraagt ten hoogste achttien maanden. De duur van de herhalingsoefeningen bedraagt al of niet
      aaneengesloten ten hoogste drie maanden.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel18
  - number: '18.5'
    text: |-
      Bij algemene maatregel van bestuur kunnen groepen van dienstplichtigen worden aangewezen die in geval van een
      oproeping als bedoeld in het eerste lid niet of voorlopig niet in werkelijke dienst behoeven te komen.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel18
  - number: '19.1'
    text: |-
      Onverminderd [artikel 20][ref1] kan Onze Minister in geval van buitengewone omstandigheden dienstplichtigen
      oproepen voor het vervullen van werkelijke dienst, voor zover dat nodig is ter uitvoering van de militaire taak. De
      dienstplichtigen zijn verplicht aan deze oproeping gevolg te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0008589#Artikel20
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0008589
        artikel: '20'
        hoofdstuk: '1'
        paragraaf: '5'
  - number: '19.2'
    text: |-
      Onverminderd het derde lid gaat de oproeping van jongere dienstplichtigen zoveel mogelijk vooraf aan de oproeping
      van oudere dienstplichtigen. Oproeping van dienstplichtigen ouder dan 45 jaar vindt niet plaats.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel19
  - number: '19.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen groepen van dienstplichtigen worden aangewezen die in geval van een
      oproeping als bedoeld in het eerste lid niet of voorlopig niet in werkelijke dienst behoeven te komen.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel19
  - number: '20.1'
    text: |-
      Onverminderd de [artikelen 7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2] kan, ingeval buitengewone
      omstandigheden dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-President,
      [artikel 19, eerste lid][ref3], in werking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0008589#Artikel19
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0008589
        artikel: '19'
        hoofdstuk: '1'
        paragraaf: '5'
  - number: '20.2'
    text: |-
      Wanneer het besluit, bedoeld in het eerste lid, is genomen wordt onverwijld een voorstel van wet aan de Tweede
      Kamer der Staten-Generaal gezonden omtrent het voortduren van de werking van [artikel 19, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008589#Artikel19
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0008589
        artikel: '19'
        hoofdstuk: '1'
        paragraaf: '5'
  - number: '20.3'
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan wordt bij koninklijk besluit, op voordracht van
      Onze Minister-President, [artikel 19, eerste lid][ref1], onverwijld buiten werking gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008589#Artikel19
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0008589
        artikel: '19'
        hoofdstuk: '1'
        paragraaf: '5'
  - number: '20.4'
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, kan [artikel 19, eerste lid][ref1], buiten
      werking worden gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0008589#Artikel19
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0008589
        artikel: '19'
        hoofdstuk: '1'
        paragraaf: '5'
  - number: '20.5'
    text: |-
      Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel20
  - number: '20.6'
    text: Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het *Staatsblad*.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel20
  - number: '21'
    text: De werkelijke dienst kan voor de dienstplichtige, indien hij voor groot verlof in aanmerking komt, worden verlengd
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel21
  - number: 21.a
    text: |-
      gedurende evenveel dagen als hij voor het ondergaan van straf, door ongeoorloofde afwezigheid of door desertie niet
      aan de dagelijkse dienst heeft deelgenomen;
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel21
  - number: 21.b
    text: |-
      zolang dit nodig is voor het ondergaan van straf, voor het onderzoek omtrent een strafbaar feit waarvan hij wordt
      verdacht en waarvoor een vrijheidsbenemende straf kan worden opgelegd; of
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel21
  - number: 21.c
    text: |-
      zolang het vertrek met groot verlof gevaar kan opleveren voor de verspreiding van een bij het onderdeel van de
      krijgsmacht waar de werkelijke dienst wordt vervuld heersende of geheerst hebbende besmettelijke ziekte.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel21
  - number: '22.1'
    text: Het verlenen van groot verlof geschiedt door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel22
  - number: '22.2'
    text: |-
      De dienstplichtige met groot verlof is verplicht om aan door Onze Minister aan te wijzen functionarissen inzage te
      verlenen van aan hem uitgereikte militaire bescheiden alsmede om aan Onze Minister desgevraagd alle in verband met
      zijn dienstplicht gewenste inlichtingen te verschaffen.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel22
  - number: '23'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voor de dienstplichtige in werkelijke dienst en voor zover
      nodig voor de gewezen dienstplichtige voorschriften vastgesteld betreffende:
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel23
  - number: 23.a
    text: opleiding;
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel23
  - number: 23.b
    text: onderzoek naar de geschiktheid en de bekwaamheid anders dan ingevolge hoofdstuk 1;
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel23
  - number: 23.c
    text: bevordering;
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel23
  - number: 23.d
    text: terugstelling bij administratieve maatregel;
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel23
  - number: 23.e
    text: diensttijden;
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel23
  - number: 23.f
    text: verlof;
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel23
  - number: 23.g
    text: aanspraken en verplichtingen in verband met de gezondheidszorg;
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel23
  - number: 23.h
    text: bescherming bij de arbeid;
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel23
  - number: 23.i
    text: woon-, verblijfs- en bereikbaarheidsverplichtingen;
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel23
  - number: 23.j
    text: rechten en verplichtingen van dienstplichtigen, verband houdende met het uitoefenen van medezeggenschap;
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel23
  - number: 23.k
    text: bezoldiging en overige militaire inkomsten;
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel23
  - number: 23.l
    text: overige rechten en verplichtingen; en
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel23
  - number: 23.m
    text: |-
      de wijze, waarop met de daarvoor in aanmerking komende vakorganisaties van overheidspersoneel en verenigingen van
      dienstplichtige militairen overleg wordt gepleegd over aangelegenheden van algemeen belang voor de rechtstoestand
      van dienstplichtigen, alsmede de gevallen waarin overeenstemming in dat overleg dient te worden bereikt.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel23
  - number: '24'
    text: |-
      [Artikel 4:8 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op beschikkingen inzake
      functietoewijzing, bevordering en aanwijzing voor het volgen van een opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '25'
    text: |-
      [Titel II van de Ambtenarenwet][ref1] vindt op dienstplichtigen in werkelijke dienst en op gewezen dienstplichtigen
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001947
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0001947
  - number: '26'
    text: De uit deze wet voortvloeiende verplichtingen zijn niet langer van toepassing
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel26
  - number: 26.a
    text: voor zover de dienstplichtige in werkelijke dienst
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel26
  - number: 26.a.1°
    text: blijkt voorgoed ongeschikt te zijn;
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel26
  - number: 26.a.2°
    text: van de dienst wordt uitgesloten;
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel26
  - number: 26.a.3°
    text: |-
      door herhaald wangedrag blijkt ongevoelig te zijn voor bestraffing ingevolge de [Wet militair tuchtrecht][ref1] en
      deswege niet in de dienst kan worden gehandhaafd; of


      [ref1]: https://wetten.overheid.nl/BWBR0004788
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004788
  - number: 26.a.4°
    text: blijkens een verdrag niet tot dienstplicht is verplicht;
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel26
  - number: 26.b
    text: zodra de dienstplichtige in werkelijke dienst
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel26
  - number: 26.b.1°
    text: het Nederlanderschap verliest; of
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel26
  - number: 26.b.2°
    text: |-
      een tegen hem gewezen rechterlijke uitspraak waarbij de bijkomende straf van ontzetting uit het recht om bij de
      gewapende macht te dienen is opgelegd zonder dat daarbij is bepaald dat deze straf geheel of gedeeltelijk niet ten
      uitvoer zal worden gelegd, in kracht van gewijsde is gegaan.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel26
  - number: '27.1'
    text: |-
      De dienstplichtige in werkelijke dienst onthoudt zich van het openbaren van gedachten of gevoelens dan wel van
      de uitoefening van het recht tot vereniging, tot vergadering en tot betoging, indien door de uitoefening van deze
      rechten de goede vervulling van zijn functie of de goede functionering van de openbare dienst, voor zover deze in
      verband staat met zijn functievervulling, niet in redelijkheid zou zijn verzekerd.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel27
  - number: '27.2'
    text: 'Het eerste lid is voor wat betreft het recht van vereniging niet van toepassing op het lidmaatschap van:'
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel27
  - number: 27.2.a
    text: |-
      een politieke groepering waarvan de naam of aanduiding is ingeschreven overeenkomstig de [artikelen G1](onbekend)
      of [G2 van de Kieswet](onbekend);
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel27
  - number: 27.2.b
    text: |-
      een politieke groepering waarvan de naam of aanduiding is ingeschreven overeenkomstig [artikel G3 van de Kieswet]
      (onbekend), en die, indien na de inschrijving verkiezingen zijn gehouden voor de gemeenteraden, aan de laatst
      gehouden verkiezingen heeft deelgenomen; of
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel27
  - number: 27.2.c
    text: een vakvereniging.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel27
  - number: '27.3'
    text: |-
      De dienstplichtige is verplicht tot geheimhouding van enig gegeven, de dienst betreffende, tegenover een ieder die
      tot kennisneming daarvan niet bevoegd is, voor zover die verplichting uit de aard van de zaak volgt.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel27
  - number: '28'
    text: |-
      De dienstplichtige in werkelijke dienst is niet gehouden tot dienstverrichting op voor hem op grond van zijn
      godsdienst of levensovertuiging geldende feest- en rustdagen, tenzij het dienstbelang dit onvermijdelijk maakt.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel28
  - number: '29.1'
    text: |-
      Aan de dienstplichtige in werkelijke dienst wordt buitengewoon verlof verleend voor het bijwonen van vergaderingen
      en zittingen van een publiekrechtelijk college, waarin hij is benoemd of verkozen, en voor het verrichten van
      daaruit voortvloeiende werkzaamheden ten behoeve van dit college, tenzij de belangen van de dienst vorderen dat het
      verlof niet wordt verleend. Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld inzake het
      doorbetalen van bezoldiging.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel29
  - number: '29.2'
    text: |-
      Aan de dienstplichtige in werkelijke dienst wordt, tenzij de belangen van de dienst vorderen dat het verlof
      niet wordt verleend, buitengewoon verlof verleend voor aan te wijzen activiteiten van of voor een vereniging van
      militairen overeenkomstig regels te stellen bij of krachtens algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel29
  - number: '30.1'
    text: |-
      De dienstplichtige in werkelijke dienst is verplicht zich tijdens het verblijf in een gebouw, luchtvaartuig of
      voertuig alsmede op een vaartuig of een terrein, dat in gebruik is bij of ten behoeve van de krijgsmacht of dat
      de dienstplichtige tot verblijf of gebruik dient bij de vervulling van zijn taak in internationaal verband, te
      onderwerpen aan een in het belang van de dienst door het bevoegd gezag gelast onderzoek aan zijn lichaam of zijn
      kleding of van zijn daar aanwezige goederen.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel30
  - number: '30.2'
    text: |-
      Het bevoegd gezag op wiens last het onderzoek, bedoeld in het eerste lid, plaats heeft, neemt de nodige maatregelen
      ten einde daarbij een onredelijke of onbehoorlijke bejegening te voorkomen.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel30
  - number: '31'
    text: |-
      Het is de dienstplichtige in werkelijke dienst verboden, anders dan met toestemming of in opdracht van Onze
      Minister of van een door deze aan te wijzen functionaris, te reizen naar of te verblijven in:
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel31
  - number: 31.a
    text: |-
      bij koninklijk besluit aangewezen landen, waarin het verblijf door een dienstplichtige in werkelijke dienst een
      bijzonder risico voor de veiligheid of andere gewichtige belangen van de Staat of zijn bondgenoten kan opleveren;
      of
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel31
  - number: 31.b
    text: een land of een landsdeel waar feitelijk een gewapend conflict bestaat.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel31
  - number: '33'
    text: |-
      Ten aanzien van hetgeen bij of krachtens hoofdstuk 2 is bepaald zijn de
      [artikelen 3 tot en met 8 van de Militaire Ambtenarenwet 1931][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel3
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0001952
        artikel: '3'
  - number: '34.1'
    text: |-
      De dienstplichtige in werkelijke dienst die zich bezwaard voelt over een van een militaire meerdere als
      bedoeld in [artikel 67 van het Wetboek van Militair Strafrecht][ref1] ontvangen bevel, dan wel meent van een
      zodanige meerdere een krenkende of onbillijke behandeling te hebben ondervonden, kan daarover in afwijking
      van [artikel 9:8, eerste lid, onder b, van de Algemene wet bestuursrecht][ref2] binnen zes weken schriftelijk
      een met redenen omklede klacht indienen bij de tot straffen bevoegde militaire meerdere, bedoeld in
      [artikel 49 van de Wet militair tuchtrecht][ref3] onder wiens rechtstreeks bevel degene, tegen wie de klacht is
      gericht, is gesteld dan wel bij een door Onze Minister aangewezen functionaris.


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0004788#Artikel49
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '67'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0004788
        artikel: '49'
  - number: '34.2'
    text: |-
      Geen klacht kan worden ingediend over besluiten of handelingen ter uitvoering van de
      [Wet militair tuchtrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004788
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0004788
  - number: '34.3'
    text: |-
      Op de behandeling van de klacht zijn de [afdelingen 9.1.2][ref1] en [9.1.3 van de Algemene wet bestuursrecht][ref2]
      van overeenkomstige toepassing, met dien verstande dat in afwijking van
      [artikel 9:11, eerste lid, van de Algemene wet bestuursrecht][ref3] de klacht binnen twaalf weken wordt afgehandeld
      indien de klager dan wel de militaire meerdere tegen wie het klaagschrift is gericht dan wel getuigen zich om
      redenen van dienst buiten Nederland bevinden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling9.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling9.1.3
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 9.1.2
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: 9.1.3
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '9'
  - number: '34.4'
    text: Bij algemene maatregel van bestuur worden nadere regels gesteld ter uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel34
  - number: '35.1'
    text: |-
      Met hechtenis van ten hoogste veertien dagen of geldboete van de tweede categorie wordt gestraft hij die niet
      voldoet aan de ingevolge [artikel 4, tweede lid][ref1], en [artikel 22, tweede lid][ref2], op hem rustende
      verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0008589#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008589#Artikel22
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0008589
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008589
        artikel: '22'
        hoofdstuk: '1'
        paragraaf: '6'
  - number: '35.2'
    text: |-
      Opzettelijke overtreding van het bepaalde bij het eerste lid wordt gestraft met gevangenisstraf van ten hoogste
      twee maanden of een geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel35
  - number: '36.1'
    text: 'Met hechtenis van ten hoogste een maand of geldboete van de tweede categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel36
  - number: 36.1.a
    text: |-
      hij die niet voldoet aan de ingevolge [artikel 6][ref1] op hem rustende verplichtingen;


      [ref1]: https://wetten.overheid.nl/BWBR0008589#Artikel6
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0008589
        artikel: '6'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 36.1.b
    text: |-
      hij die ingevolge deze wet voor de werkelijke dienst is opgeroepen en niet verschijnt op tijd en plaats bij dat
      deel van de krijgsmacht, waarbij hij is ingedeeld, tenzij hem zulks niet valt toe te rekenen.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel36
  - number: '36.2'
    text: |-
      Opzettelijke overtreding van het bepaalde bij het eerste lid wordt gestraft met gevangenisstraf van ten hoogste
      twee jaren of geldboete van de vierde categorie. Overtreding in buitengewone omstandigheden van het bepaalde bij
      het eerste lid wordt gestraft met gevangenisstraf van ten hoogste vijf jaren of geldboete van de vierde categorie.
      [Artikel 71][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel71a
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: 71a
  - number: '37.1'
    text: |-
      De in [artikelen 35, eerste lid][ref1], en [36, eerste lid][ref2], strafbaar gestelde feiten zijn overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0008589#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0008589#Artikel36
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0008589
        artikel: '35'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0008589
        artikel: '36'
        hoofdstuk: '3'
  - number: '37.2'
    text: |-
      De in de [artikelen 35, tweede lid][ref1], en [36, tweede lid][ref2], strafbaar gestelde feiten zijn misdrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0008589#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0008589#Artikel36
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0008589
        artikel: '35'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0008589
        artikel: '36'
        hoofdstuk: '3'
  - number: '38'
    text: |-
      Met de opsporing van de in deze wet strafbare gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref1], belast de militairen van de Koninklijke marechaussee. Zij
      hebben toegang tot elke plaats, voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '39.1'
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, kunnen de paragrafen 3 en 5 van hoofdstuk 1, met
      uitzondering van artikel 19, derde lid, alsmede de [hoofdstukken 2][ref1] en [3][ref2], met uitzondering van de
      artikelen 27, derde lid, 35, 37 en 38, worden opgeschort. Bij dat besluit kan de opschorting voor de verschillende
      hoofdstukken, paragrafen, artikelen of onderdelen daarvan op verschillende tijdstippen worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008589#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0008589#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0008589
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008589
        hoofdstuk: '3'
  - number: '39.2'
    text: |-
      Het koninklijk besluit, bedoeld in het eerste lid, wordt aan de beide kamers der Staten-Generaal overgelegd en
      treedt niet in werking dan nadat twee weken na de overlegging zijn verstreken. Indien een van de kamers daartegen
      overwegende bezwaren te kennen heeft gegeven, wordt het besluit ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel39
  - number: '39.3'
    text: |-
      De opschorting is niet van toepassing bij de oproeping van dienstplichtigen als bedoeld in [artikel 64][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008589#Artikel64
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0008589
        artikel: '64'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '40.1'
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, kan de opschorting van de paragrafen 3 en 5 van
      [hoofdstuk 1][ref1], met uitzondering van artikel 19, derde lid, alsmede de [hoofdstukken 2][ref2] en [3][ref3],
      met uitzondering van de artikelen 27, derde lid, 35, 37 en 38 worden beëindigd. Bij dat besluit kan de beëindiging
      van de opschorting voor de verschillende hoofdstukken, paragrafen, artikelen of onderdelen daarvan op verschillende
      tijdstippen worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008589#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0008589#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0008589#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0008589
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0008589
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0008589
        hoofdstuk: '3'
  - number: '40.2'
    text: |-
      Een krachtens het eerste lid vastgesteld besluit wordt aan de beide kamers der Staten-Generaal overgelegd. Het
      besluit treedt niet in werking dan nadat twee weken na de overlegging zijn verstreken. Indien een van de kamers
      daartegen overwegende bezwaren te kennen heeft gegeven, wordt het besluit ingetrokken. De tweede en de derde volzin
      zijn niet van toepassing indien door de beide kamers te kennen is gegeven dat het koninklijk besluit op een eerder
      tijdstip in werking kan treden.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel40
  - number: '41.1'
    text: De Wet van 4 augustus 1947 (*Stb.* H 293) betreffende uitzending dienstplichtigen wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel41
  - number: '41.2'
    text: De Wet rechtstoestand dienstplichtigen wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel41
  - number: '41.3'
    text: De Dienstplichtwet wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel41
  - number: '57'
    text: |-
      Zij die op grond van de Dienstplichtwet zoals luidend voor inwerkingtreding van deze wet voor de dienstplicht zijn
      ingeschreven, worden aangemerkt als ingeschrevenen voor de dienstplicht in de zin van deze wet.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel57
  - number: '58.1'
    text: |-
      Zij die op grond van de Dienstplichtwet voorgoed ongeschikt voor de dienst zijn of worden verklaard, worden
      aangemerkt als voorgoed ongeschikt voor de dienst in de zin van deze wet.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel58
  - number: '58.2'
    text: |-
      Zij die op het tijdstip van inwerkingtreding van deze wet op grond van de Dienstplichtwet tijdelijk ongeschikt voor
      de dienst zijn verklaard, worden aangemerkt als ingeschrevenen in de zin van deze wet.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel58
  - number: '58.3'
    text: |-
      Zij die op het tijdstip van inwerkingtreding van deze wet op grond van de Dienstplichtwet geschikt
      voor de dienst zijn verklaard doch nog niet zijn ingelijfd, worden aangemerkt als ingeschrevenen
      in de zin van deze wet. De eerste volzin is niet van toepassing op hen die op grond van
      [artikel 9, eerste lid, van de Wet gewetensbezwaren militaire dienst][ref1] zijn vrijgesteld van de militaire
      verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002386#Artikel9
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002386
        artikel: '9'
  - number: '59'
    text: |-
      Zij die voor het tijdstip van inwerkingtreden van deze wet op grond van de Dienstplichtwet zijn ingelijfd als
      gewoon dienstplichtigen doch niet meer voor eerste oefening worden opgeroepen, worden aangemerkt als ingeschrevenen
      in de zin van deze wet.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel59
  - number: '60.1'
    text: 'Degene aan wie op grond van:'
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel60
  - number: 60.1.a
    text: |-
      artikel 15, eerste lid, onderdelen *a*, *c* of *d*, van de Dienstplichtwet zoals luidend voor inwerkingtreding van
      deze wet een voorgoed verleende vrijstelling is of wordt verleend, wordt overeenkomstig de bepalingen van deze wet
      aangemerkt als dienstplichtige in het genot van een voorgoed verleende vrijstelling;
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel60
  - number: 60.1.b
    text: |-
      artikel 15, eerste lid, onderdelen *b* of *e*, van de Dienstplichtwet zoals luidend voor inwerkingtreding van
      deze wet een voorgoed verleende vrijstelling is of wordt verleend, wordt overeenkomstig de bepalingen van deze wet
      aangemerkt als dienstplichtige in het genot van een voorgoed verleende ontheffing.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel60
  - number: '60.2'
    text: 'Degene aan wie op het tijdstip van inwerkingtreding van deze wet op grond van:'
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel60
  - number: 60.2.a
    text: |-
      artikel 15, eerste lid, onderdelen *a*, *c* of *d*, van de Dienstplichtwet een tijdelijke vrijstelling is verleend,
      wordt na afloop van de duur van deze vrijstelling overeenkomstig de bepalingen van deze wet aangemerkt als
      dienstplichtige in het genot van een voorgoed verleende vrijstelling;
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel60
  - number: 60.2.b
    text: |-
      artikel 15, eerste lid, onderdelen *b* of *e*, van de Dienstplichtwet een tijdelijke vrijstelling is verleend,
      wordt na afloop van de duur van deze vrijstelling overeenkomstig de bepalingen van deze wet aangemerkt als
      dienstplichtige in het genot van een voorgoed verleende ontheffing.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel60
  - number: '60.3'
    text: |-
      De op het tijdstip van inwerkingtreding van deze wet ingediende doch nog niet afgedane aanvragen om vrijstelling
      worden overeenkomstig de bepalingen van de Dienstplichtwet zoals luidend voor inwerkingtreding van deze wet
      verder behandeld en afgedaan, met dien verstande dat in afwijking van artikel 15, derde lid, eerste volzin,
      van de Dienstplichtwet aanvragen om vrijstelling wegens kostwinnerschap, persoonlijke onmisbaarheid of het
      bekleden van een geestelijk ambt of een godsdienstig-menslievend ambt of opleiding tot zodanig ambt voorgoed
      worden verleend. De eerste volzin is van overeenkomstige toepassing op de door de dienstplichtigen, bedoeld in
      [artikel 62, eerste lid][ref1], ingediende aanvragen om vrijstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0008589#Artikel62
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0008589
        artikel: '62'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '60.4'
    text: |-
      Dienstplichtigen in het genot van een voorgoed verleende vrijstelling dan wel in het genot van een voorgoed
      verleende ontheffing als bedoeld in het eerste en tweede lid kunnen door Onze Minister uitsluitend in buitengewone
      omstandigheden worden opgeroepen. Deze verplichting gevolg te geven aan de oproeping blijft op hen rusten tot
      1 oktober van het jaar waarin de leeftijd van 35 jaar wordt bereikt. Op degene aan wie op grond van artikel 15,
      eerste lid, onder *c*, van de Dienstplichtwet zoals luidend voor inwerkingtreding van deze wet, vrijstelling
      is verleend, zijn de eerste en de tweede volzin slechts van toepassing, indien bij de oproeping in buitengewone
      omstandigheden is gebleken dat betrokkene niet meer verkeert in de omstandigheid waarvoor hem ingevolge die wet
      vrijstelling is verleend.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel60
  - number: '60.5'
    text: |-
      Overeenkomstig [artikel 6][ref1] kunnen zij opnieuw worden opgeroepen voor een keuring.


      [ref1]: https://wetten.overheid.nl/BWBR0008589#Artikel6
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0008589
        artikel: '6'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: '61'
    text: |-
      Zij die op grond van de Dienstplichtwet zoals luidend voor inwerkingtreding van deze wet van de dienst zijn
      uitgesloten, worden aangemerkt als uitgesloten van de dienst in de zin van deze wet.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel61
  - number: '62.1'
    text: |-
      Voor gewoon dienstplichtigen die op het tijdstip van inwerkingtreding van deze wet de werkelijke dienst voor eerste
      oefening vervullen, blijft de Dienstplichtwet zoals luidend voor het inwerkingtreden van deze wet van kracht tot
      1 januari 1997, met uitzondering van hoofdstuk II, de artikelen 22 en 22, voor zover het bepaalde krachtens het
      laatstgenoemde artikel mede van toepassing is op hoofdstuk V, en hoofdstuk XI.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel62
  - number: '62.2'
    text: |-
      Voor dienstplichtigen in werkelijke dienst en voor zover nodig voor gewezen dienstplichtigen blijft de Wet
      rechtstoestand dienstplichtigen zoals luidend voor het inwerkingtreden van deze wet van kracht tot 1 januari 1997,
      met uitzondering van artikel 2.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel62
  - number: '63'
    text: |-
      In afwijking van [artikel 62, tweede lid][ref1], van deze wet blijft het bepaalde bij of krachtens artikel 2 en
      artikel 3 van de Wet rechtstoestand dienstplichtigen zoals luidend voor inwerkingtreding van deze wet van kracht na
      1 januari 1997 voor zover het bepaalde bij of krachtens deze artikelen mede van toepassing is verklaard op gewezen
      dienstplichtigen.


      [ref1]: https://wetten.overheid.nl/BWBR0008589#Artikel62
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0008589
        artikel: '62'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '64.1'
    text: |-
      Gewoon dienstplichtigen, vrijwilligers op de voet van gewoon dienstplichtige daaronder begrepen, aan wie na de
      vervulling van de werkelijke dienst voor eerste oefening op grond van de Dienstplichtwet groot verlof is verleend,
      worden aangemerkt als dienstplichtigen in de zin van deze wet.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel64
  - number: '64.2'
    text: 'De in het eerste lid bedoelde dienstplichtigen zijn uitsluitend verplicht:'
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel64
  - number: 64.2.a
    text: in gewone omstandigheden voor herhalingsoefeningen in werkelijke dienst te komen; en
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel64
  - number: 64.2.b
    text: in buitengewone omstandigheden in werkelijke dienst te komen.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel64
  - number: '64.3'
    text: De verplichting gevolg te geven aan een oproeping blijft op hen rusten
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel64
  - number: 64.3.a
    text: |-
      tot 1 oktober van het jaar waarin de leeftijd van 35 jaar wordt bereikt, voor zover zij als dienstplichtige geen
      rang hebben bekleed; of
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel64
  - number: 64.3.b
    text: |-
      tot 1 oktober van het jaar waarin de leeftijd van 40 jaar wordt bereikt, voor zover zij als dienstplichtige een
      onderofficiersrang hebben bekleed.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel64
  - number: '64.4'
    text: |-
      Overeenkomstig [artikel 6][ref1] kunnen zij opnieuw voor een keuring worden opgeroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0008589#Artikel6
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0008589
        artikel: '6'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: '64.5'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ter uitvoering van het tweede lid voor zover het
      betreft het voor herhalingsoefeningen in werkelijke dienst komen.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel64
  - number: '64.6'
    text: |-
      Onze Minister kan in buitengewone omstandigheden regels stellen met betrekking tot en voor zover nodig in afwijking
      van de in [artikel 23][ref1] genoemde onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0008589#Artikel23
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0008589
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '64.7'
    text: |-
      De ministeriële regeling, bedoeld in het zesde lid, wordt op de daarin te bepalen wijze bekendgemaakt. De regeling
      treedt in werking terstond na de bekendmaking. De regeling wordt in ieder geval geplaatst in de *Staatscourant*.
      Zo spoedig mogelijk na de plaatsing in de *Staatscourant* van deze regeling wordt een voordracht gedaan voor een
      algemene maatregel van bestuur tot nadere regeling van de betrokken onderwerpen.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel64
  - number: '65.1'
    text: |-
      Zij die op grond van de Dienstplichtwet zoals luidend voor inwerkingtreding van deze wet zijn bestemd tot
      buitengewoon dienstplichtigen worden aangemerkt als dienstplichtigen in de zin van deze wet.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel65
  - number: '65.2'
    text: |-
      De in het eerste lid bedoelde dienstplichtigen kunnen door Onze Minister uitsluitend in buitengewone omstandigheden
      in werkelijke dienst worden opgeroepen, met dien verstande dat zij behoren tot groepen die in die omstandigheden
      alleen bij dringende behoefte in werkelijke dienst behoeven te komen. Deze verplichting gevolg te geven aan de
      oproeping blijft op hen rusten tot 1 oktober van het jaar waarin de leeftijd van 35 jaar wordt bereikt.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel65
  - number: '65.3'
    text: |-
      Overeenkomstig [artikel 6][ref1] kunnen zij opnieuw worden opgeroepen voor een keuring.


      [ref1]: https://wetten.overheid.nl/BWBR0008589#Artikel6
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0008589
        artikel: '6'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: '66'
    text: |-
      In afwijking van [artikel 62, eerste lid][ref1], van deze wet blijft artikel 39 van de Dienstplichtwet
      zoals luidend voor inwerkingtreding van deze wet na 1 januari 1997 van kracht, voor zover de verschuldigde
      schadevergoeding door betrokkenen ter zake van beschadiging, zoekraken of verloren gaan van rijksgoederen niet voor
      die datum is voldaan, onverminderd de overige daaraan verbonden gevolgen.


      [ref1]: https://wetten.overheid.nl/BWBR0008589#Artikel62
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0008589
        artikel: '62'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '67'
    text: |-
      Zij die op grond van de Dienstplichtwet tot het reservepersoneel behoren of komen te behoren, blijven daartoe
      behoren tot het tijdstip waarop hun dienstplicht volgens artikel 41 van die wet zoals luidend voor inwerkingtreding
      van deze wet zou eindigen, tenzij hun volgens de geldende wettelijke bepalingen eerder ontslag wordt verleend.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel67
  - number: '68'
    text: |-
      In afwijking van [artikel 62, eerste lid][ref1], van deze wet blijven de artikelen 26 en 45 tot en met 47 van de
      Dienstplichtwet zoals luidend voor inwerkingtreding van deze wet van kracht voor degenen tegen wie voor 1 januari
      1997 op grond van een of meer van deze artikelen een strafvervolging aanhangig is gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0008589#Artikel62
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0008589
        artikel: '62'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '69'
    text: |-
      Op geschillen die tijdig krachtens de in [artikel 41, tweede en derde lid][ref1], genoemde wetten aanhangig zijn of
      worden gemaakt, blijven de op het tijdstip van inwerkingtreding van deze wet geldende voorschriften van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008589#Artikel41
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0008589
        artikel: '41'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '70'
    text: |-
      De op het tijdstip van inwerkingtreding van deze wet geldende algemene maatregel van bestuur, vastgesteld krachtens
      artikel 30, derde lid, van de Dienstplichtwet berust vanaf dat tijdstip op [artikel 19, derde lid][ref1], van deze
      wet.


      [ref1]: https://wetten.overheid.nl/BWBR0008589#Artikel19
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0008589
        artikel: '19'
        hoofdstuk: '1'
        paragraaf: '5'
  - number: '71.1'
    text: |-
      Deze wet treedt, met uitzondering van paragraaf 2 van hoofdstuk 5, in werking op een bij koninklijk besluit te
      bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel71
  - number: '71.2'
    text: |-
      Paragraaf 2 van [hoofdstuk 5][ref1] treedt in werking met ingang van 1 januari 1997, met uitzondering van
      [artikel 46][ref2], dat in werking treedt bij het in het eerste lid genoemde koninklijk besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0008589#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0008589#Artikel46
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0008589
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0008589
        artikel: '46'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '71.3'
    text: |-
      In afwijking van [artikel 39, eerste en tweede lid][ref1], worden de paragrafen 3 en 5 van hoofdstuk 1, met
      uitzondering van artikel 19, derde lid, alsmede [de hoofdstukken 2][ref2] en [3][ref3], met uitzondering van de
      artikelen 27, derde lid, 35, 37 en 38, bij inwerkingtreding van deze wet opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0008589#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0008589#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0008589#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0008589
        artikel: '39'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0008589
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0008589
        hoofdstuk: '3'
  - number: '71.4'
    text: |-
      De in het derde lid bedoelde opschorting is niet van toepassing bij de oproeping van dienstplichtigen als bedoeld
      in [artikel 64][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008589#Artikel64
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0008589
        artikel: '64'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '72'
    text: 'Deze wet wordt aangehaald als: Kaderwet dienstplicht.'
    url: https://wetten.overheid.nl/BWBR0008589/2018-05-25#Artikel72
