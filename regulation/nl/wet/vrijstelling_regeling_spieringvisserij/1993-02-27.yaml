preamble:
  text: |-
    Gelet op de artikelen 11 en 12 van het Reglement voor de binnenvisserij 1985 (Stb. 283);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0004734/1993-02-27#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Van het bepaalde in artikel 4, tweede lid, van het Reglement voor de binnenvisserij 1985
      wordt voor de spieringvisserij op het IJsselmeer een vrijstelling verleend voor de periode
      die door de Minister van Landbouw, Natuurbeheer en Visserij is vastgesteld krachtens
      [artikel 2, vierde lid, van de Regeling IJsselmeervisserij 1993][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005886#Artikel2
    url: https://wetten.overheid.nl/BWBR0004734/1993-02-27#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005886
        artikel: '2'
  - number: '2'
    text: |-
      Vis van andere soorten dan spiering dient onmiddellijk nadat deze is opgehaald weer in hetzelfde water te worden
      teruggezet.
    url: https://wetten.overheid.nl/BWBR0004734/1993-02-27#Artikel2
  - number: '3'
    text: |-
      Deze regeling treedt in werking met ingang van de dag volgend op die van haar bekendmaking in de Staatscourant en
      werkt terug tot 1 maart 1990.
    url: https://wetten.overheid.nl/BWBR0004734/1993-02-27#Artikel3
