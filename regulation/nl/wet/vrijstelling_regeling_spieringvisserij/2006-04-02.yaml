preamble:
  text: |-
    Gelet op de artikelen 11 en 12 van het Reglement voor de binnenvisserij 1985 (Stb. 283);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0004734/2006-04-02#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Van het bepaalde in artikel 4, tweede lid, van het Reglement voor de binnenvisserij 1985
      wordt voor de spieringvisserij op het IJsselmeer een vrijstelling verleend voor de periode
      die door de Minister van Landbouw, Natuurbeheer en Visserij is vastgesteld krachtens
      [artikel 2, vierde lid, van de Regeling IJsselmeervisserij 1993][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005886#Artikel2
    url: https://wetten.overheid.nl/BWBR0004734/2006-04-02#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005886
        artikel: '2'
  - number: 1a
    text: |-
      1 De periode, bedoeld in [artikel 2, vierde lid, van de Regeling IJsselmeervisserij 1993][ref1], begint op 3 april
      2006, 08.00 uur en eindigt op 21 april 2006, 16.00 uur.

      2 In de periode, bedoeld in het eerste lid, mag de visserij:

      a. met de grote fuik worden uitgeoefend met maximaal 30 merkjes per vergunninghouder;

      b. met de schietfuik worden uitgeoefend met maximaal 75 merkjes per vergunninghouder.

      3 De vergunninghouder meldt de op de merkjes vermelde nummers, uiterlijk voor aanvang van de visserij:

      a. indien hij aangesloten is bij de PO-IJsselmeer, bedoeld in de [Regeling visserij-inspanning IJsselmeer][ref2],
      bij het bestuur van voornoemde producentenorganisatie;

      b. indien hij niet aangesloten is bij voornoemde producentenorganisatie, aan de Directie Visserij van het
      Ministerie van Landbouw, Natuur en Voedselkwaliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0005886#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008072
    url: https://wetten.overheid.nl/BWBR0004734/2006-04-02#Artikel1a
    references:
