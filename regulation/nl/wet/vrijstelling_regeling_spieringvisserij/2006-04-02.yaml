  - number: '2'
    text: |-
      Vis van andere soorten dan spiering dient onmiddellijk nadat deze is opgehaald weer in hetzelfde water te worden
      teruggezet.
    url: https://wetten.overheid.nl/BWBR0004734/2006-04-02#Artikel2
  - number: 2a
    text: |-
      Deze regeling berust op de [artikelen 11][ref1] en [12 van het Reglement voor de binnenvisserij 1985][ref2], en
      [artikel 2, vierde lid, van de Regeling IJsselmeervisserij 1993][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009027#Artikel11
