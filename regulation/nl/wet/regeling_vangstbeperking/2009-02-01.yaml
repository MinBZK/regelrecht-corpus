---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_vangstbeperking
regulatory_layer: WET
publication_date: '2009-03-31'
valid_from: '2009-02-01'
bwb_id: BWBR0006379
url: https://wetten.overheid.nl/BWBR0006379/2009-02-01
preamble:
  text: |-
    Gelet op de artikelen 3, 4 en 6 van het Reglement zee- en kustvisserij 1977;

    Na overleg met het Produktschap voor Vis en Visprodukten;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel1
  - number: 1.1.a
    text: 'minister: Minister van Landbouw, Natuur en Voedselkwaliteit;'
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel1
  - number: 1.1.b
    text: |-
      deelgebied, sector of deelsector: zeegebied als omschreven in [bijlage 1][ref1] bij deze regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0006379
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006379
  - number: 1.1.c
    text: |-
      boomkor: vistuig dat bestaat uit één net dat is bevestigd aan en in horizontale richting wordt opgehouden door een
      constructie bestaande uit een boom die ten minste aan elk der uiteinden voorzien is van een slede of een slof, dan
      wel een soortgelijke constructie waarmee een net in horizontale richting wordt opengehouden;
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel1
  - number: 1.1.d
    text: |-
      motorvermogen: motorvermogen dat is vermeld op de visvergunning, bedoeld in
      [artikel 1, onderdeel g, van de Regeling visvergunning][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016244#Artikel1
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0016244
        artikel: '1'
  - number: 1.1.e
    text: |-
      visserijzone: zone als bedoeld in [artikel 1, vierde lid, onderdeel a, van de Visserijwet 1963][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel1
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '1'
  - number: 1.1.f
    text: |-
      [verordening nr. 850/98](31998R0850): [Verordening (EG) nr. 850/98](31998R0850) van de Raad van de Europese Unie
      van 30 maart 1998 voor de instandhouding van de visbestanden via technische maatregelen voor de bescherming van
      jonge exemplaren van mariene organismen (Pb EG L 125);
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel1
  - number: 1.1.g
    text: |-
      verordening inzake vangstmogelijkheden: Verordening van 19 december 2008 van de Raad van de Europese Unie tot
      vaststelling, voor 2009, van de vangstmogelijkheden voor sommige visbestanden en groepen visbestanden welke in
      de wateren van de Gemeenschap en, voor vaartuigen van de Gemeenschap, in andere wateren met vangstbeperkingen van
      toepassing zijn, en tot vaststelling van de bij de visserij in acht te nemen voorschriften.
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van deze regeling vindt het aanlanden van vis plaats op het tijdstip waarop het vissersvaartuig
      direct of indirect verbinding met de wal heeft gekregen.
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel1
  - number: '2.1'
    text: |-
      Het is verboden met een vissersvaartuig de visserij uit te oefenen op de vissoorten genoemd in de
      [bijlagen 2][ref1], [3][ref2] en [4][ref3] in de bij die vissoorten genoemde wateren.


      [ref1]: https://wetten.overheid.nl/BWBR0006379
      [ref2]: https://wetten.overheid.nl/BWBR0006379
      [ref3]: https://wetten.overheid.nl/BWBR0006379
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006379
      - id: ref2
        bwb_id: BWBR0006379
      - id: ref3
        bwb_id: BWBR0006379
  - number: '2.2'
    text: 'Van het verbod, bedoeld in het eerste lid, wordt vrijstelling verleend voor zover het betreft de vangst door:'
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel2
  - number: 2.2.a
    text: |-
      de gezamenlijke Nederlandse vissers van de hoeveelheid per vissoort, per deelgebied of sector en voor de periode
      vermeld in [bijlage 3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006379
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006379
  - number: 2.2.b
    text: |-
      de gezamenlijke vissers van de lidstaten van de Europese Unie van de hoeveelheid per vissoort, per deelgebied of
      sector en voor de periode vermeld in [bijlage 4][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0006379
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006379
  - number: 2.2.c
    text: |-
      vissersvaartuigen die de vlag voeren van, of geregistreerd zijn in een andere staat dan een lidstaat van de
      Europese Unie, in de gebieden vermeld in [bijlage 2][ref1], [3][ref2] en [4][ref3], mits de visserij wordt
      uitgeoefend overeenkomstig artikel 14 van de verordening inzake vangstmogelijkheden.


      [ref1]: https://wetten.overheid.nl/BWBR0006379
      [ref2]: https://wetten.overheid.nl/BWBR0006379
      [ref3]: https://wetten.overheid.nl/BWBR0006379
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006379
      - id: ref2
        bwb_id: BWBR0006379
      - id: ref3
        bwb_id: BWBR0006379
  - number: '2.3'
    text: |-
      De minister kan de vrijstellingen bedoeld in het tweede lid intrekken dan wel de in [bijlage 3][ref1] en
      [4][ref2] genoemde hoeveelheden wijzigen, voor zover hij dit noodzakelijk acht voor de nakoming van communautaire
      verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006379
      [ref2]: https://wetten.overheid.nl/BWBR0006379
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006379
      - id: ref2
        bwb_id: BWBR0006379
  - number: '2.4'
    text: |-
      De minister maakt het tijdstip bekend waarop naar zijn oordeel de in het tweede lid bedoelde hoeveelheden zijn
      opgevist. Dit tijdstip kan per vissoort verschillen.
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel2
  - number: '2.5'
    text: |-
      De minister kan de vrijstellingen bedoeld in het tweede lid intrekken, voor zover hij dit noodzakelijk acht voor de
      naleving van reeds ingetrokken vrijstellingen als bedoeld in dit artikel en in [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006379#Artikel3
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006379
        artikel: '3'
  - number: '2.6'
    text: |-
      De minister kan ontheffing van het in het eerste lid en het in [artikel 3, eerste lid][ref1], gestelde verbod
      verlenen voor zover het gaat om vangsten voor wetenschappelijk onderzoek op grond van artikel 43 van [verordening
      nr. 850/98](31998R0850).


      [ref1]: https://wetten.overheid.nl/BWBR0006379#Artikel3
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006379
        artikel: '3'
  - number: '2.7'
    text: |-
      De minister kan de vrijstelling als bedoeld in het tweede lid voor een bepaalde periode intrekken voor de vangst
      van kabeljauw in de gebieden, bedoeld in de onderdelen 5a.1 en 5d.1 van bijlage III van de verordening inzake
      vangstmogelijkheden, voor de aldaar bedoelde vaartuigen, indien hij dat noodzakelijk acht ter nakoming van het
      bepaalde in de onderdelen 5a.3 en 5d.3 van die bijlage.
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel2
  - number: 2a.1
    text: |-
      De door de gezamenlijke Nederlandse vissers aangevoerde hoeveelheden vis worden in mindering gebracht op het
      desbetreffende quotum, respectievelijk het desbetreffende Gemeenschapsaandeel, bedoeld in [bijlage 3][ref1],
      respectievelijk [bijlage 4][ref2], van deze regeling, met uitzondering van de vangsten, bedoeld in artikel 9,
      tweede lid, van de verordening inzake vangstmogelijkheden.


      [ref1]: https://wetten.overheid.nl/BWBR0006379
      [ref2]: https://wetten.overheid.nl/BWBR0006379
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0006379
      - id: ref2
        bwb_id: BWBR0006379
  - number: 2a.2
    text: |-
      Indien een Nederlandse visser op één dag meerdere malen een hoeveelheid van 50 kg of minder van dezelfde vissoort
      aanvoert, wordt de totale hoeveelheid die de visser op die dag van die vissoort aanvoert in mindering gebracht op:
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel2a
  - number: 2a.2.a
    text: |-
      het quotum voor de desbetreffende vissoort, bedoeld in [bijlage 3][ref1], bij deze regeling, en in voorkomend geval
      op zijn contingent, bedoeld in [artikel 1, onderdeel g, van de Regeling contingentering zeevis][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0006379
      [ref2]: https://wetten.overheid.nl/BWBR0008477#Artikel1
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0006379
      - id: ref2
        bwb_id: BWBR0008477
        artikel: '1'
  - number: 2a.2.b
    text: |-
      het desbetreffende Gemeenschapsaandeel, bedoeld [bijlage 4][ref1], bij deze regeling,


      [ref1]: https://wetten.overheid.nl/BWBR0006379
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0006379
  - number: 2a.2.c
    text: tenzij die totale hoeveelheid 50 kg of minder bedraagt.
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel2a
  - number: 2b.1
    text: |-
      De minister kan een deel van de vangstmogelijkheden die voor een kalenderjaar ingevolge artikel 20, eerste lid,
      van [verordening (EG) nr. 2371/2002](32002R2371) van de Raad van 20 december 2002 inzake de instandhouding en
      de duurzame exploitatie van de visbestanden in het kader van het gemeenschappelijk visserijbeleid (Pb EG L 358)
      op de vissoorten en de gebieden, bedoeld in [onderdeel a van de bijlage bij de Regeling contingentering zeevis]
      (onbekend), aan Nederland zijn toegewezen, reserveren ten behoeve van:
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel2b
  - number: 2b.1.a
    text: |-
      het ruilen van vangstmogelijkheden met andere lidstaten als bedoeld in artikel 20, vijfde lid, van de in de aanhef
      bedoelde verordening;
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel2b
  - number: 2b.1.b
    text: |-
      verlagingen van de aan Nederland toegewezen vangstmogelijkheden als bedoeld in artikel 23, vierde lid, van de in
      de aanhef bedoelde verordening, in de artikelen 21, vierde lid, 23, eerste lid, en 32, tweede lid van [verordening
      (EEG) nr. 2847/93](31993R2847) van de Raad van 12 oktober 1993 tot invoering van een controleregeling voor het
      gemeenschappelijk visserijbeleid (PbEG L 261) en in artikel 5 van [verordening (EG) nr. 847/96](31996R0847) van de
      Raad van 6 mei 1996 tot invoering van aanvullende voorwaarden voor het meerjarenbeheer van de TAC’s en quota PbEG L
      115), en
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel2b
  - number: 2b.1.c
    text: |-
      toewijzing aan een ondernemer als bedoeld in
      [artikel 1, onderdeel c, van de Regeling contingentering zeevis][ref1], respectievelijk aan een groep dan
      wel producentenorganisatie als bedoeld in [artikel 16, tweede lid, van die regeling][ref2], waarvan is
      vastgesteld dat met het vissersvaartuig van de ondernemer of met de vissersvaartuigen van de ondernemers
      die bij de desbetreffende groep dan wel producentenorganisatie zijn aangesloten in een nader te bepalen
      periode de visserij is uitgeoefend overeenkomstig [artikel 5 van de Regeling visvergunning][ref3], de
      [artikelen 2 tot en met 4][ref4] en [10 tot met 10b van de Regeling technische maatregelen 2000][ref5] of met de
      [artikelen 2 tot en met 4 van de Regeling contingentering zeevis][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0008477#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008477#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0016244#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0011061#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0011061#Artikel10
      [ref6]: https://wetten.overheid.nl/BWBR0008477#Artikel2
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0008477
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0008477
        artikel: '16'
      - id: ref3
        bwb_id: BWBR0016244
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0011061
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0011061
        artikel: '10'
      - id: ref6
        bwb_id: BWBR0008477
        artikel: '2'
  - number: 2b.2
    text: |-
      Voor de vangst van het deel van de vangstmogelijkheden dat is gereserveerd op grond van het eerste lid, onderdelen
      a en b, wordt, na aftrek van de geruilde hoeveelheden en de verlagingen, uiterlijk 1 juni van een kalenderjaar
      vrijstelling, als bedoeld in [artikel 2, tweede lid][ref1], verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006379#Artikel2
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0006379
        artikel: '2'
  - number: 2b.3
    text: |-
      Het deel van de vangstmogelijkheden dat wordt gereserveerd op grond van het eerste lid, onderdeel c, bedraagt
      ten hoogste 10% van de aan Nederland toegewezen vangstmogelijkheden op de vissoorten in de gebieden, bedoeld in
      [bijlage 3][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0006379
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0006379
  - number: 2b.4
    text: |-
      Voor de vangst van het deel van de vangstmogelijkheden dat is gereserveerd op grond van het eerste lid, onderdeel
      c, wordt aan ondernemers of groepen als bedoeld in dat onderdeel uiterlijk 1 juni van een kalenderjaar vrijstelling
      als bedoeld in [artikel 2, tweede lid][ref1], verleend. De minister stelt de criteria vast die worden gehanteerd
      bij de verlening van die vrijstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0006379#Artikel2
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0006379
        artikel: '2'
  - number: '3.1'
    text: |-
      Het is verboden met andere vaartuigen dan vissersvaartuigen de visserij met trawlnetten, staande netten, Deense
      zegennetten of soortgelijke netten uit te oefenen op de vissoorten genoemd in de [bijlagen 2][ref1], [3][ref2] en
      [4][ref3] in de bij die vissoorten genoemde wateren alsmede dergelijke netten aan boord te hebben van een ander
      vaartuig dan een vissersvaartuig.


      [ref1]: https://wetten.overheid.nl/BWBR0006379
      [ref2]: https://wetten.overheid.nl/BWBR0006379
      [ref3]: https://wetten.overheid.nl/BWBR0006379
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006379
      - id: ref2
        bwb_id: BWBR0006379
      - id: ref3
        bwb_id: BWBR0006379
  - number: '3.2'
    text: |-
      In afwijking van het eerste lid is het toegestaan staande netten
      aan boord te hebben in het zeegebied en de kustwateren bedoeld in
      [artikel 1, onderdelen b en c, van de Beschikking visserij visserijzone, zeegebied en kustwateren][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003150#Artikel1
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003150
        artikel: '1'
  - number: '3.3'
    text: |-
      Het is verboden één of meer boomkorren aan boord te hebben van een vissersvaartuig waarmee ingevolge de Regeling
      contingentering zeevis geen tong of schol in het vangstgebied mag worden opgevist, aan boord gehouden dan wel
      aangeland.
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel3
  - number: '3.4'
    text: |-
      Het derde lid is niet van toepassing op de visserij met een vissersvaartuig waarvoor een vergunning voor de
      garnalenvisserij als bedoeld in [artikel 11 van de Beschikking visserij visserijzone, zeegebied en kustwateren][ref1]
      is verleend en evenmin op de visserij met een vissersvaartuig waarmee de spieringvisserij bedoeld in
      [artikel 4, tweede lid, onderdeel c, van de Regeling technische maatregelen 2000][ref2] wordt uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0003150#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0011061#Artikel4
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003150
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0011061
        artikel: '4'
  - number: '3.5'
    text: |-
      De minister kan aan een scheepswerf ontheffing van het in het eerste lid gestelde verbod verlenen, voor zover het
      betreft de uitoefening van de visserij door een vaartuig:
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel3
  - number: 3.5.a
    text: |-
      dat in aanbouw is op die scheepswerf en nog niet is afgeleverd en niet is geregistreerd overeenkomstig het bepaalde
      bij en krachtens het [Besluit registratie vissersvaartuigen 1998][ref1] en


      [ref1]: https://wetten.overheid.nl/BWBR0009353
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009353
  - number: 3.5.b
    text: |-
      waarmee in het kader van een proefvaart de visserij wordt uitgeoefend om de werking van bij dat vaartuig behorende
      trawlnetten, Deense zegennetten of soortgelijke netten alsmede staande netten te beproeven.
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel3
  - number: '4'
    text: |-
      Het is verboden vis van de soorten die zijn aangewezen krachtens
      [artikel 1, tweede lid, onderdeel a, van de Visserijwet 1963][ref1] te verhandelen indien de vis niet is gevangen
      met een vissersvaartuig.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel1
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '1'
  - number: '5.1'
    text: |-
      Met ingang van de door de Commissie van de Europese Gemeenschappen overeenkomstig artikel 21, derde lid, van de
      [verordening (EEG) nr. 2847/93](31993R2847) van de Raad van de Europese Gemeenschappen van 12 oktober 1993 tot
      invoering van een controleregeling voor het gemeenschappelijk visserijbeleid (PbEG L 261) vastgestelde datum, is
      het verboden:
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel5
  - number: 5.1.a
    text: |-
      in de visserijzone met een vaartuig dat de vlag voert van, of geregistreerd is in een andere lidstaat van de
      Europese Unie dan Nederland, de visserij uit te oefenen op de vissoorten waarvoor voornoemde vaststelling geldt;
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel5
  - number: 5.1.b
    text: vis van de soorten waarvoor voornoemde vaststelling geldt in de visserijzone aan boord te houden van dat vaartuig;
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel5
  - number: 5.1.c
    text: vis van deze soorten met dat vaartuig in Nederland aan te voeren.
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel5
  - number: '5.2'
    text: |-
      Met ingang van de door de Commissie van de Europese Gemeenschappen overeenkomstig artikel 21, derde lid, van de in
      het eerste lid genoemde verordening vastgestelde datum, is het verboden:
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel5
  - number: 5.2.a
    text: |-
      in de visserijzone, met een vaartuig dat de vlag voert van, of geregistreerd is in, een andere lid-staat van de
      Europese Unie dan Nederland de visserij uit te oefenen op de vissoorten waarvoor voornoemde vaststelling geldt;
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel5
  - number: 5.2.b
    text: vis van de soorten waarvoor voornoemde vaststelling geldt in de visserijzone aan boord te houden van dat vaartuig;
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel5
  - number: 5.2.c
    text: vis van deze soorten met dat vaartuig in Nederland aan te voeren.
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel5
  - number: '5.3'
    text: |-
      Met ingang van de door de Commissie van de Europese Gemeenschappen overeenkomstig artikel 28 quinquis van de in het
      eerste lid genoemde verordening vastgestelde datum, is het verboden:
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel5
  - number: 5.3.a
    text: |-
      in de visserijzone, met een vissersvaartuig dat de vlag voert van, of geregistreerd is in een andere staat dan
      een lidstaat van de Europese Unie de visserij uit te oefenen op de vissoorten waarvoor de voornoemde vaststelling
      geldt, tenzij is voldaan aan de voorwaarden, bedoeld in artikel 18 van de verordening inzake vangstmogelijkheden;
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel5
  - number: 5.3.b
    text: |-
      vis van de soorten waarvoor de voornoemde vaststelling geldt in de visserijzone aan boord te houden van dat
      vissersvaartuig of over te laden;
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel5
  - number: 5.3.c
    text: vis van deze soorten met dat vissersvaartuig in Nederland aan te voeren.
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel5
  - number: '10.1'
    text: Het is verboden diepgevroren vis in verpakkingen aan te landen.
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel10
  - number: '10.2'
    text: |-
      Het in het eerste lid gestelde verbod is niet van toepassing voor het aanlanden van diepgevroren vis in
      verpakkingen, indien op de verpakking de in de verpakking aanwezige vis per vissoort is vermeld volgens de codes
      bedoeld in artikel 1, vierde lid, van [verordening (EEG) nr. 2807/83](31983R2807) van de Commissie van de Europese
      Gemeenschappen van 22 september 1983 houdende uitvoeringsbepalingen inzake de registratie van gegevens over de
      visvangst van de Lid-Staten (PbEG L 276).
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel10
  - number: '11.1'
    text: |-
      Vis, behorende tot de soorten, genoemd in de [bijlagen 2][ref1], [3][ref2] en [4][ref3] en gevangen in de bij die
      vissoorten genoemde deelgebieden en sectoren moet onmiddellijk na het ophalen van het net in zee worden teruggezet.


      [ref1]: https://wetten.overheid.nl/BWBR0006379
      [ref2]: https://wetten.overheid.nl/BWBR0006379
      [ref3]: https://wetten.overheid.nl/BWBR0006379
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006379
      - id: ref2
        bwb_id: BWBR0006379
      - id: ref3
        bwb_id: BWBR0006379
  - number: '11.2'
    text: De in het eerste lid bedoelde vis mag niet worden aangevoerd.
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel11
  - number: '11.3'
    text: |-
      Van het bepaalde in het eerste lid en het tweede lid wordt vrijstelling verleend ten aanzien van vis, welke met
      inachtneming van de [artikelen 2][ref1], [3][ref2], en [12, vierde lid][ref3], is gevangen.


      [ref1]: https://wetten.overheid.nl/BWBR0006379#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006379#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0006379#Artikel12
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006379
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006379
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0006379
        artikel: '12'
  - number: '12.1'
    text: |-
      In afwijking van [artikel 11, eerste en tweede lid][ref1], mogen vangsten van de in [artikel 11, eerste lid][ref2],
      bedoelde soorten aan boord worden gehouden of worden aangevoerd indien:


      [ref1]: https://wetten.overheid.nl/BWBR0006379#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0006379#Artikel11
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006379
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0006379
        artikel: '11'
  - number: 12.1.a
    text: |-
      wat betreft andere soorten dan haring en makreel, de vangsten uit verschillende soorten bestaan en overeenkomstig
      artikel 4 van [verordening nr. 850/98](31998R0850) met netten met een maaswijdte van minder dan 32 mm zijn gedaan
      en noch aan boord, noch bij aanvoer zijn gesorteerd, en zijn gevangen overeenkomstig de [artikelen 5][ref1] en
      [6 van de Regeling technische maatregelen 2000][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011061#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011061#Artikel6
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0011061
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0011061
        artikel: '6'
  - number: 12.1.b
    text: |-
      wat betreft haring die is gevangen in de ICES-deelgebieden III en IV, onverminderd het derde lid, de vangsten
      voldoen aan artikel 2, van [verordening (EG) nr. 1434/98](31998R1434) van de Raad van de Europese Unie van 29 juni
      1998 tot vaststelling van de voorwaarden waarop haring mag worden aangevoerd voor andere industriële doeleinden
      dan rechtstreekse menselijke consumptie (Pb EG L 191), en zijn gevangen overeenkomstig de [artikelen 5][ref1] en
      [6 van de Regeling technische maatregelen 2000][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011061#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011061#Artikel6
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0011061
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0011061
        artikel: '6'
  - number: 12.1.c
    text: |-
      wat betreft gemengde vangsten van makreel met horsmakreel of sardines, het aandeel makreel in die vangsten niet
      meer bedraagt dan 10% van het totale gewicht aan makreel, horsmakreel en sardines aan boord, en de vangsten niet
      gesorteerd zijn. Het aandeel makreel wordt bepaald overeenkomstig artikel 9, vierde lid, van de verordening inzake
      vangstmogelijkheden.
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel12
  - number: '12.2'
    text: 'De vangst van:'
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel12
  - number: 12.2.a
    text: |-
      heek mag slechts dan aan boord worden gehouden of worden aangevoerd als de hoeveelheid heek aan boord niet meer
      bedraagt dan 5% van het gewicht van de totale vangst aan boord;
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel12
  - number: 12.2.b
    text: |-
      schelvis mag slechts dan aan boord worden gehouden of worden aangevoerd als de hoeveelheid schelvis aan boord niet
      meer bedraagt dan 50% van het gewicht van de totale vangst aan boord.
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel12
  - number: '12.3'
    text: |-
      Het is verboden met een vissersvaartuig ongesorteerde vangsten van vis gevangen in de ICES-deelgebieden II (EG-
      wateren), III, en IV en de ICES-sector VIId aan te landen.
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel12
  - number: '12.4'
    text: |-
      Het is verboden kabeljauw aan boord te houden of aan te landen indien die is vermengd met andere mariene
      organismen.
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel12
  - number: '12.5'
    text: |-
      In afwijking van het eerste lid, onderdeel b, is artikel 2, eerste lid, van de in dat onderdeel bedoelde
      verordening niet van toepassing op haring die is gevangen in ICES-deelgebied IV, de ICES-sectoren IIIa en VIId en
      ICES-sector IIa (EG-wateren).
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel12
  - number: '13.1'
    text: Het is verboden met een vissersvaartuig haring of makreel aan te landen.
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel13
  - number: '13.2'
    text: 'Van het in het eerste lid bedoelde verbod wordt vrijstelling verleend indien:'
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel13
  - number: 13.2.a
    text: |-
      de haring, onderscheidenlijk de makreel, met het aanlandende vissersvaartuig is gevangen met inachtneming van de
      Regeling contingentering zeevis;
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel13
  - number: 13.2.b
    text: |-
      de aangelande haring onderscheidenlijk de aangelande makreel van een met naam en registratienummer genoemd schip
      of vissersvaartuig werd overgeladen, en het overladen van de aangelande haring overeenkomstig het bepaalde in
      [artikel 14][ref1] is gemeld, met vermelding van het vangstgebied en de plaats van overladen, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0006379#Artikel14
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006379
        artikel: '14'
  - number: 13.2.c
    text: |-
      de haring onderscheidenlijk de makreel in een buitenlandse haven aan boord is genomen van het aanlandende
      vissersvaartuig.
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel13
  - number: '14.1'
    text: Het is verboden haring over te laden zonder voorafgaande melding overeenkomstig het tweede lid.
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel14
  - number: '14.2'
    text: 'De melding, bedoeld in het eerste lid, dient:'
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel14
  - number: 14.2.a
    text: |-
      plaats te vinden door verzending van een faxbericht door de kapitein, de eigenaar of diens gemachtigde aan de
      meldkamer van de Algemene Inspectiedienst te Kerkrade (045-5461011), waarin ten minste is aangegeven:
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel14
  - number: 14.2.a.1º
    text: de plaats van overladen;
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel14
  - number: 14.2.a.2º
    text: de datum en het tijdstip van overladen;
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel14
  - number: 14.2.a.3º
    text: de datum en het tijdstip van het doen van de melding;
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel14
  - number: 14.2.a.4º
    text: de naam en het registratienummer van het schip of vissersvaartuig waarvan wordt overgeladen;
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel14
  - number: 14.2.a.5º
    text: de naam en het registratienummer van het schip of vissersvaartuig waarop wordt overgeladen;
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel14
  - number: 14.2.a.6º
    text: de naam van de ondernemer en van de kapitein van het schip of vissersvaartuig waarvan wordt overgeladen;
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel14
  - number: 14.2.a.7º
    text: de naam van de ondernemer en van de kapitein van het schip of vissersvaartuig waarop wordt overgeladen;
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel14
  - number: 14.2.a.8º
    text: de haven waarin de overgeladen haring wordt aangeland;
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel14
  - number: 14.2.b
    text: tenminste 24 uur voor het tijdstip van overlading plaats te vinden.
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel14
  - number: '16.1'
    text: |-
      De Beschikking [regeling vangstbeperking][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006379
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006379
  - number: '16.2'
    text: |-
      De Beschikking [regeling vangstbeperking][ref1] blijft evenwel van toepassing op verzoeken als bedoeld in de
      [artikelen 7][ref2], [8][ref3], 8a, 8b, [10][ref4] en [11][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0006379
      [ref2]: https://wetten.overheid.nl/BWBR0006379#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0006379#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0006379#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0006379#Artikel11
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006379
      - id: ref2
        bwb_id: BWBR0006379
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0006379
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0006379
        artikel: '10'
      - id: ref5
        bwb_id: BWBR0006379
        artikel: '11'
  - number: '17'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst. Deze regeling zal met de toelichting in de Staatscourant worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel17
  - number: '18'
    text: |-
      Deze regeling kan worden aangehaald als [Regeling vangstbeperking][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006379
    url: https://wetten.overheid.nl/BWBR0006379/2009-02-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006379
