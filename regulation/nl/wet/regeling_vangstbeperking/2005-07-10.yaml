  - number: '12'
    text: |-
      1 In afwijking van [artikel 11, eerste en tweede lid][ref1], mogen vangsten van de in
      [artikel 11, eerste lid][ref2], bedoelde soorten aan boord worden gehouden of worden aangevoerd indien:

      a. wat betreft andere soorten dan haring en makreel, de vangsten uit verschillende soorten bestaan en
      overeenkomstig artikel 4 van [verordening nr. 850/98](31998R0850) met netten met een maaswijdte van minder
      dan 32 mm zijn gedaan en noch aan boord, noch bij aanvoer zijn gesorteerd, en zijn gevangen overeenkomstig de
      [artikelen 5][ref3] en [6 van de Regeling technische maatregelen 2000][ref4];

      b. wat betreft haring die is gevangen in de ICES-deelgebieden III en IV, onverminderd het derde lid, de vangsten
      voldoen aan artikel 2, van [verordening (EG) nr. 1434/98](31998R1434) van de Raad van de Europese Unie van 29 juni
      1998 tot vaststelling van de voorwaarden waarop haring mag worden aangevoerd voor andere industriële doeleinden
      dan rechtstreekse menselijke consumptie (Pb EG L 191), en zijn gevangen overeenkomstig de [artikelen 5][ref5] en
      [6 van de Regeling technische maatregelen 2000][ref6];.

      c. wat betreft haring die is gevangen buiten de ICES-deelgebieden III en IV, onverminderd het derde lid, de
      vangsten voldoen aan onderdeel 11 van Bijlage III van de in [artikel 2a, eerste lid][ref7], bedoelde verordening;.

      d. wat betreft gemengde vangsten van makreel met horsmakreel of sardines, het aandeel makreel in die vangsten
      niet meer bedraagt dan 10% van het totale gewicht aan makreel, horsmakreel en sardines aan boord, en de
      vangsten niet gesorteerd zijn. Het aandeel makreel wordt bepaald overeenkomstig artikel 8, vierde lid, van de in
      [artikel 2a, eerste lid][ref8], bedoelde verordening.

      2 De vangst van:

      a. heek mag slechts dan aan boord worden gehouden of worden aangevoerd als de hoeveelheid heek aan boord niet meer
      bedraagt dan 5% van het gewicht van de totale vangst aan boord;

      b. schelvis mag slechts dan aan boord worden gehouden of worden aangevoerd als de hoeveelheid schelvis aan boord
      niet meer bedraagt dan 50% van het gewicht van de totale vangst aan boord.

      3 Het is verboden met een vissersvaartuig ongesorteerde vangsten van vis gevangen in de ICES-deelgebieden II (EG-
      wateren), III, en IV en de ICES-sector VIId aan te landen.

      4 Het is verboden kabeljauw aan boord te houden of aan te landen indien die is vermengd met andere mariene
      organismen.


