      Het is verboden vis van de soorten die zijn aangewezen krachtens
      [artikel 1, tweede lid, onderdeel a, van de Visserijwet 1963][ref1] te verhandelen indien de vis niet is gevangen
      met een vissersvaartuig.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel1
