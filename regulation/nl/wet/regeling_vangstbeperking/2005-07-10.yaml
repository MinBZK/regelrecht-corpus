  - number: 2a
    text: |-
      1 De door de gezamenlijke Nederlandse vissers aangevoerde hoeveelheden vis worden in mindering gebracht op het
      desbetreffende quotum, respectievelijk het desbetreffende Gemeenschapsaandeel, bedoeld in [bijlage 3][ref1],
      respectievelijk [bijlage 4][ref2], van deze regeling, met uitzondering van de vangsten, bedoeld in artikel 8,
      eerste lid, onderdelen c, e en f, van [verordening (EG) nr. 27/2005](32005R0027) van de Raad van 22 december 2004
      tot vaststelling, voor 2005, van de vangstmogelijkheden voor sommige visbestanden en groepen visbestanden welke in
      de wateren van de Gemeenschap en, voor vaartuigen van de Gemeenschap, in andere wateren met vangstbeperkingen van
      toepassing zijn, en tot vaststelling van de bij de visserij in acht te nemen voorschriften (PbEU L 12).

      2 Indien een Nederlandse visser op één dag meerdere malen een hoeveelheid van 50 kg of minder van dezelfde vissoort
      aanvoert, wordt de totale hoeveelheid die de visser op die dag van die vissoort aanvoert in mindering gebracht op:

      a. het quotum voor de desbetreffende vissoort, bedoeld in [bijlage 3][ref3], bij deze regeling, en in voorkomend
      geval op zijn contingent, bedoeld in [artikel 1, onderdeel g, van de Regeling contingentering zeevis][ref4], of

      b. het desbetreffende Gemeenschapsaandeel, bedoeld [bijlage 4][ref5], bij deze regeling,

      c. tenzij die totale hoeveelheid 50 kg of minder bedraagt.


