      1 Het is verboden met een vissersvaartuig de visserij uit te oefenen op de vissoorten genoemd in de
      [bijlagen 2][ref1], [3][ref2] en [4][ref3] in de bij die vissoorten genoemde wateren.

      2 Van het verbod, bedoeld in het eerste lid, wordt vrijstelling verleend voor zover het betreft de vangst door:

      a. de gezamenlijke Nederlandse vissers van de hoeveelheid per vissoort, per deelgebied of sector en voor de periode
      vermeld in [bijlage 3][ref4];

      b. de gezamenlijke vissers van de lidstaten van de Europese Unie van de hoeveelheid per vissoort, per deelgebied of
      sector en voor de periode vermeld in [bijlage 4][ref5], en

      c. vissersvaartuigen die de vlag voeren van, of geregistreerd zijn in een andere staat dan een lidstaat van de
      Europese Unie, in de gebieden vermeld in [bijlage 2][ref6], [3][ref7] en [4][ref8], mits de visserij wordt
      uitgeoefend overeenkomstig artikel 13 van de in [artikel 2a][ref9], eerste lid bedoelde verordening.

      3 De minister kan de vrijstellingen bedoeld in het tweede lid intrekken dan wel de in [bijlage 3][ref10] en
      [4][ref11] genoemde hoeveelheden wijzigen, voor zover hij dit noodzakelijk acht voor de nakoming van communautaire
      verplichtingen.

      4 De minister maakt het tijdstip bekend waarop naar zijn oordeel de in het tweede lid bedoelde hoeveelheden zijn
      opgevist. Dit tijdstip kan per vissoort verschillen.

      5 De minister kan de vrijstellingen bedoeld in het tweede lid intrekken, voor zover hij dit noodzakelijk acht voor
      de naleving van reeds ingetrokken vrijstellingen als bedoeld in dit artikel en in [artikel 3][ref12].

      6 De minister kan ontheffing van het in het eerste lid en het in [artikel 3, eerste lid][ref13], gestelde verbod
      verlenen voor zover het gaat om vangsten voor wetenschappelijk onderzoek op grond van artikel 43 van [verordening
      nr. 850/98](31998R0850).


