    text: |-
      1 Aan ontheffingen en vrijstellingen als bedoeld in de [artikelen 2][ref1], [3][ref2], [11][ref3] en [13][ref4],
      kunnen voorschriften worden verbonden. Zij kunnen onder beperkingen worden verleend. Zij kunnen te allen tijde
      worden ingetrokken.

      2 De minister kan in overeenstemming met artikel 54 van de in [artikel 2a, eerste lid][ref5], bedoelde verordening
      ontheffing verlenen van de bepalingen van deze regeling voor zover het betreft het uitoefenen van de visserij enkel
      ten behoeve van wetenschappelijk onderzoek.


