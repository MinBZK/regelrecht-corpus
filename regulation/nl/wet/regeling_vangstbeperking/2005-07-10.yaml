  - number: '13'
    text: |-
      1 Het is verboden met een vissersvaartuig haring of makreel aan te landen.

      2 Van het in het eerste lid bedoelde verbod wordt vrijstelling verleend indien:

      a. de haring, onderscheidenlijk de makreel, met het aanlandende vissersvaartuig is gevangen met inachtneming van de
      Regeling contingentering zeevis;

      b. de aangelande haring onderscheidenlijk de aangelande makreel van een met naam en registratienummer genoemd
      schip of vissersvaartuig werd overgeladen, en het overladen van de aangelande haring overeenkomstig het bepaalde in
      [artikel 14][ref1] is gemeld, met vermelding van het vangstgebied en de plaats van overladen, dan wel

      c. de haring onderscheidenlijk de makreel in een buitenlandse haven aan boord is genomen van het aanlandende
      vissersvaartuig.


      [ref1]: https://wetten.overheid.nl/BWBR0006379#Artikel14
    url: https://wetten.overheid.nl/BWBR0006379/2005-07-10#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006379
        artikel: '14'
  - number: '14'
    text: |-
      1 Het is verboden haring over te laden zonder voorafgaande melding overeenkomstig het tweede lid.

      2 De melding, bedoeld in het eerste lid, dient:

      a. plaats te vinden door verzending van een faxbericht door de kapitein, de eigenaar of diens gemachtigde aan de
      meldkamer van de Algemene Inspectiedienst te Kerkrade (045-5461011), waarin ten minste is aangegeven:

      1º de plaats van overladen;

      2º de datum en het tijdstip van overladen;

      3º de datum en het tijdstip van het doen van de melding;

      4º de naam en het registratienummer van het schip of vissersvaartuig waarvan wordt overgeladen;

      5º de naam en het registratienummer van het schip of vissersvaartuig waarop wordt overgeladen;

      6º de naam van de ondernemer en van de kapitein van het schip of vissersvaartuig waarvan wordt overgeladen;

      7º de naam van de ondernemer en van de kapitein van het schip of vissersvaartuig waarop wordt overgeladen;

      8º de haven waarin de overgeladen haring wordt aangeland;

      b. tenminste 24 uur voor het tijdstip van overlading plaats te vinden.
    url: https://wetten.overheid.nl/BWBR0006379/2005-07-10#Artikel14
