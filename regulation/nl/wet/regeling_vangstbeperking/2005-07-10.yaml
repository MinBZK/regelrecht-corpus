  - number: 2b
    text: |-
      1 De minister kan een deel van de vangstmogelijkheden die voor een kalenderjaar ingevolge artikel 20, eerste lid,
      van [verordening (EG) nr. 2371/2002](32002R2371) van de Raad van 20 december 2002 inzake de instandhouding en
      de duurzame exploitatie van de visbestanden in het kader van het gemeenschappelijk visserijbeleid (Pb EG L 358)
      op de vissoorten en de gebieden, bedoeld in [onderdeel a van de bijlage bij de Regeling contingentering zeevis]
      (onbekend), aan Nederland zijn toegewezen, reserveren ten behoeve van:

      a. het ruilen van vangstmogelijkheden met andere lidstaten als bedoeld in artikel 20, vijfde lid, van de in de
      aanhef bedoelde verordening;

      b. verlagingen van de aan Nederland toegewezen vangstmogelijkheden als bedoeld in artikel 23, vierde lid,
      van de in de aanhef bedoelde verordening, in de artikelen 21, vierde lid, en 32, tweede lid, van [verordening
      (EEG) nr. 2847/93](31993R2847) van de Raad van 12 oktober 1993 tot invoering van een controleregeling voor het
      gemeenschappelijk visserijbeleid (PbEG L 261) en in artikel 5 van [verordening (EG) nr. 847/96](31996R0847) van de
      Raad van 6 mei 1996 tot invoering van aanvullende voorwaarden voor het meerjarenbeheer van de TAC’s en quota PbEG L
      115), en

      c. toewijzing aan een ondernemer als bedoeld in
      [artikel 1, onderdeel c, van de Regeling contingentering zeevis][ref1], respectievelijk aan een groep als bedoeld
      in [artikel 16, tweede lid, van die regeling][ref2], waarvan is vastgesteld dat met het vissersvaartuig van de
      ondernemer of met de vissersvaartuigen van de ondernemers die bij de desbetreffende groep zijn aangesloten in een
      nader te bepalen periode de visserij is uitgeoefend overeenkomstig [artikel 5 van de Regeling visvergunning][ref3],
      de [artikelen 2 tot en met 4][ref4] en [10 tot met 10b van de Regeling technische maatregelen 2000][ref5] of met de
      [artikelen 2 tot en met 4 van de Regeling contingentering zeevis][ref6].

      2 Voor de vangst van het deel van de vangstmogelijkheden dat is gereserveerd op grond van het eerste lid,
      onderdelen a en b, wordt, na aftrek van de geruilde hoeveelheden en de verlagingen, uiterlijk 1 juni van een
      kalenderjaar vrijstelling, als bedoeld in [artikel 2, tweede lid][ref7], verleend.

      3 Het deel van de vangstmogelijkheden dat wordt gereserveerd op grond van het eerste lid, onderdeel c, bedraagt
      ten hoogste 10% van de aan Nederland toegewezen vangstmogelijkheden op de vissoorten in de gebieden, bedoeld in
      [bijlage 3][ref8] bij deze regeling.

      4 Voor de vangst van het deel van de vangstmogelijkheden dat is gereserveerd op grond van het eerste lid, onderdeel
      c, wordt aan ondernemers of groepen als bedoeld in dat onderdeel uiterlijk 1 juni van een kalenderjaar vrijstelling
      als bedoeld in [artikel 2, tweede lid][ref9], verleend. De minister stelt de criteria vast die worden gehanteerd
      bij de verlening van die vrijstelling.


