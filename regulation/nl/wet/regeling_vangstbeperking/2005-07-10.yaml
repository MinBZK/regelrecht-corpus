  - number: '5'
    text: |-
      1 Met ingang van de door de Commissie van de Europese Gemeenschappen overeenkomstig artikel 21, derde lid, van
      de [verordening (EEG) nr. 2847/93](31993R2847) van de Raad van de Europese Gemeenschappen van 12 oktober 1993 tot
      invoering van een controleregeling voor het gemeenschappelijk visserijbeleid (PbEG L 261) vastgestelde datum, is
      het verboden:

      a. in de visserijzone met een vaartuig dat de vlag voert van, of geregistreerd is in een andere lidstaat van de
      Europese Unie dan Nederland, de visserij uit te oefenen op de vissoorten waarvoor voornoemde vaststelling geldt;

      b. vis van de soorten waarvoor voornoemde vaststelling geldt in de visserijzone aan boord te houden van dat
      vaartuig;

      c. vis van deze soorten met dat vaartuig in Nederland aan te voeren.

      2 Met ingang van de door de Commissie van de Europese Gemeenschappen overeenkomstig artikel 21, derde lid, van de
      in het eerste lid genoemde verordening vastgestelde datum, is het verboden:

      a. in de visserijzone, met een vaartuig dat de vlag voert van, of geregistreerd is in, een andere lid-staat van de
      Europese Unie dan Nederland de visserij uit te oefenen op de vissoorten waarvoor voornoemde vaststelling geldt;

      b. vis van de soorten waarvoor voornoemde vaststelling geldt in de visserijzone aan boord te houden van dat
      vaartuig;

      c. vis van deze soorten met dat vaartuig in Nederland aan te voeren.

      3 Met ingang van de door de Commissie van de Europese Gemeenschappen overeenkomstig artikel 28 quinquis van de in
      het eerste lid genoemde verordening vastgestelde datum, is het verboden:

      a. in de visserijzone, met een vissersvaartuig dat de vlag voert van, of geregistreerd is in een andere staat dan
      een lidstaat van de Europese Unie de visserij uit te oefenen op de vissoorten waarvoor de voornoemde vaststelling
      geldt;

      b. vis van de soorten waarvoor de voornoemde vaststelling geldt in de visserijzone aan boord te houden van dat
      vissersvaartuig of over te laden;

      c. vis van deze soorten met dat vissersvaartuig in Nederland aan te voeren.
    url: https://wetten.overheid.nl/BWBR0006379/2005-07-10#Artikel5
  - number: '10'
    text: |-
      1 Het is verboden diepgevroren vis in verpakkingen aan te landen.

      2 Het in het eerste lid gestelde verbod is niet van toepassing voor het aanlanden van diepgevroren vis in
      verpakkingen, indien op de verpakking de in de verpakking aanwezige vis per vissoort is vermeld volgens de codes
      bedoeld in artikel 1, vierde lid, van [verordening (EEG) nr. 2807/83](31983R2807) van de Commissie van de Europese
      Gemeenschappen van 22 september 1983 houdende uitvoeringsbepalingen inzake de registratie van gegevens over de
      visvangst van de Lid-Staten (PbEG L 276).
    url: https://wetten.overheid.nl/BWBR0006379/2005-07-10#Artikel10
  - number: '11'
    text: |-
      1 Vis, behorende tot de soorten, genoemd in de [bijlagen 2][ref1], [3][ref2] en [4][ref3] en gevangen in de
      bij die vissoorten genoemde deelgebieden en sectoren moet onmiddellijk na het ophalen van het net in zee worden
      teruggezet.

      2 De in het eerste lid bedoelde vis mag niet worden aangevoerd.

      3 Van het bepaalde in het eerste lid en het tweede lid wordt vrijstelling verleend ten aanzien van vis, welke met
      inachtneming van de [artikelen 2][ref4], [3][ref5], en [12, vierde lid][ref6], is gevangen.


