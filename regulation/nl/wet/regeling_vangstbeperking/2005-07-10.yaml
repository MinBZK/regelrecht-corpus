  - number: '3'
    text: |-
      1 Het is verboden met andere vaartuigen dan vissersvaartuigen de visserij met trawlnetten, staande netten, Deense
      zegennetten of soortgelijke netten uit te oefenen op de vissoorten genoemd in de [bijlagen 2][ref1], [3][ref2] en
      [4][ref3] in de bij die vissoorten genoemde wateren alsmede dergelijke netten aan boord te hebben van een ander
      vaartuig dan een vissersvaartuig.

      2 In afwijking van het eerste lid is het toegestaan staande netten
      aan boord te hebben in het zeegebied en de kustwateren bedoeld in
      [artikel 1, onderdelen b en c, van de Beschikking visserij visserijzone, zeegebied en kustwateren][ref4].

      3 Het is verboden één of meer boomkorren aan boord te hebben van een vissersvaartuig waarmee ingevolge de Regeling
      contingentering zeevis geen tong of schol in het vangstgebied mag worden opgevist, aan boord gehouden dan wel
      aangeland.

      4 Het derde lid is niet van toepassing op de visserij met een vissersvaartuig waarvoor een vergunning voor de
      garnalenvisserij als bedoeld in [artikel 11 van de Beschikking visserij visserijzone, zeegebied en kustwateren][ref5]
      is verleend en evenmin op de visserij met een vissersvaartuig waarmee de spieringvisserij bedoeld in
      [artikel 4, tweede lid, onderdeel c, van de Regeling technische maatregelen 2000][ref6] wordt uitgeoefend.

      5 De minister kan aan een scheepswerf ontheffing van het in het eerste lid gestelde verbod verlenen, voor zover het
      betreft de uitoefening van de visserij door een vaartuig:

      a. dat in aanbouw is op die scheepswerf en nog niet is afgeleverd en niet is geregistreerd overeenkomstig het
      bepaalde bij en krachtens het [Besluit registratie vissersvaartuigen 1998][ref7] en

      b. waarmee in het kader van een proefvaart de visserij wordt uitgeoefend om de werking van bij dat vaartuig
      behorende trawlnetten, Deense zegennetten of soortgelijke netten alsmede staande netten te beproeven.


