articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

      a. minister: Minister van Landbouw, Natuur en Voedselkwaliteit;

      b. deelgebied, sector of deelsector: zeegebied als omschreven in [bijlage 1][ref1] bij deze regeling;

      c. boomkor: vistuig dat bestaat uit één net dat is bevestigd aan en in horizontale richting wordt opgehouden door
      een constructie bestaande uit een boom die ten minste aan elk der uiteinden voorzien is van een slede of een slof,
      dan wel een soortgelijke constructie waarmee een net in horizontale richting wordt opengehouden;

      d. motorvermogen: motorvermogen dat is vermeld op de visvergunning, bedoeld in
      [artikel 1, onderdeel g, van de Regeling visvergunning][ref2];

      e. visserijzone: zone als bedoeld in [artikel 1, vierde lid, onderdeel a, van de Visserijwet 1963][ref3];

      f. [verordening nr. 850/98](31998R0850): [Verordening (EG) nr. 850/98](31998R0850) van de Raad van de Europese Unie
      van 30 maart 1998 voor de instandhouding van de visbestanden via technische maatregelen voor de bescherming van
      jonge exemplaren van mariene organismen (Pb EG L 125).

      2 Voor de toepassing van deze regeling vindt het aanlanden van vis plaats op het tijdstip waarop het
      vissersvaartuig direct of indirect verbinding met de wal heeft gekregen.


