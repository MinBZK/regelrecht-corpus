  - number: XXIII
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid zendt binnen vijf jaar na de inwerkingtreding van deze wet aan
      de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0039377/2021-01-01#ArtikelXXIII
  - number: XXIIIb
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kan een bestuursorgaan of instelling worden
      belast met de ondersteuning bij de vaststelling van de beslagvrije voet met toepassing van de
      [artikelen 475da tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref1].

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over:

      a. de verwerkingsverantwoordelijkheid voor de gegevensverwerking voor de ondersteuning bij de vaststelling van de
      beslagvrije voet;

      b. de wijze van gegevensverwerking;

      c. de voorwaarden waaronder deze gegevensverwerking plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475da
    url: https://wetten.overheid.nl/BWBR0039377/2021-01-01#ArtikelXXIIIb
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475da
  - number: XXIIIc
    text: |-
      1 In afwijking van de [artikelen 475da tot en met 475dc van het Wetboek van Burgerlijke Rechtsvordering][ref1]
      kunnen bij besluit van Onze Minister van Sociale Zaken en Werkgelegenheid beslagleggende partijen worden aangewezen
      waarop [artikel 475d van het Wetboek van Burgerlijke Rechtsvordering][ref2], zoals dat luidde op de dag voorafgaand
      aan de inwerkingtreding van deze wet, van toepassing blijft tot en met 6 maanden na inwerkingtreding van dit
      artikel.

      2 De partijen genoemd in het eerste lid kunnen worden aangewezen bij besluit van Onze Minister van Sociale Zaken
      en Werkgelegenheid als zij een gemotiveerde opgave doen van de reden waarom zij gebruik willen maken van de
      overgangsperiode.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475da
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
