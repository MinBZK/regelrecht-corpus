  - number: XXIV
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0039377/2021-01-01#ArtikelXXIV
  - number: XXV
    text: 'Deze wet wordt aangehaald als: Wet vereenvoudiging beslagvrije voet.'
    url: https://wetten.overheid.nl/BWBR0039377/2021-01-01#ArtikelXXV
