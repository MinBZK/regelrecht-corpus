preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is te komen tot een vereenvoudiging van de vaststelling
    van de beslagvrije voet;

    Zo is het dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-Generaal,
    hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0039377/2021-01-01#ArtikelAanhef
articles:
  - number: XXII
    text: |-
      1 Indien voor de datum van inwerkingtreding van [artikel I, onderdeel F][ref1], van deze wet beslag is gelegd op
      een periodieke vordering tot betaling waaraan een beslagvrije voet is verbonden, blijft de door de deurwaarder
      volgens het recht dat gold voor de datum van inwerkingtreding van dat artikelonderdeel vastgestelde beslagvrije
      voet van toepassing, tot het moment dat de beslagvrije voet door de deurwaarder of, in geval van samenloop van
      beslagen als bedoeld in [artikel 478][ref2] de coördinerende deurwaarder opnieuw wordt vastgesteld op grond van
      een van de in [artikel 475d, derde of vierde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref3] bedoelde
      situaties.

      2 [Artikel 475c, tweede tot en met vierde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref4] geldt tot
      twaalf maanden na de datum van inwerkingtreding van [artikel I, onderdeel E][ref5], van deze wet niet voor een
      beslag dat is gelegd voor de datum van inwerkingtreding van dat artikelonderdeel.


