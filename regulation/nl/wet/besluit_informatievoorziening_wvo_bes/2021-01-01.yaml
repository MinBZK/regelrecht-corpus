preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Onderwijs, Cultuur en Wetenschap van 21 september 2010, nr. WJZ/236449
    (3840), directie Wetgeving en Juridische Zaken, gedaan in overeenstemming met Onze Minister van Landbouw, Natuur en
    Voedselkwaliteit en mede namens de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties;

    Gelet op de artikelen 176 en 177 van de Wet voortgezet onderwijs BES;

    De Afdeling advisering van de Raad van State gehoord (advies van 21 oktober 2010, No. W05.10.0452/I);

    Gezien het nader rapport van Onze Minister van Onderwijs, Cultuur en Wetenschap van 31 januari 2011, nr. WJZ
    256793 (3840), directie Wetgeving en Juridische Zaken, uitgebracht mede namens Onze Minister van Economische Zaken,
    Landbouw en Innovatie en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0029594/2021-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Dit besluit verstaat onder:

        - *de wet:* de [Wet voortgezet onderwijs BES][ref1];
        - *Onze Minister:* Onze Minister van Onderwijs, Cultuur en Wetenschap;
        - *school:* een school voor voortgezet onderwijs, tenzij het tegendeel blijkt;
        - *bevoegd gezag:* voor wat betreft: 1°. een openbare school in stand gehouden door een openbaar lichaam: het
      bestuurscollege van het desbetreffende openbaar lichaam, voor zover de eilandsraad niet anders bepaalt, en indien
      de eilandsraad dit besluit, met inachtneming van door hem te stellen regelen, en 2°. een bijzondere school: het
      schoolbestuur;
        - *samenwerkingsverband:* een samenwerkingsverband als bedoeld in
      [artikel 1 van de Wet op het voortgezet onderwijs BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030284
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel1
    url: https://wetten.overheid.nl/BWBR0029594/2021-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0030284
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '1'
  - number: '2'
    text: |-
      De gegevens, bedoeld in de [artikelen 176][ref1] en [177 van de wet][ref2], waarover een bevoegd gezag beschikt,
      worden gedefinieerd en geordend volgens de voorschriften vermeld in de bijlage bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel176
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel177
    url: https://wetten.overheid.nl/BWBR0029594/2021-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '176'
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '177'
  - number: '3'
    text: |-
      1 Bij ministeriële regeling wordt een nadere invulling gegeven van de gegevens, bedoeld in [artikel 2][ref1], en
      van de wijze waarop de gegevens beschikbaar worden gesteld. Tevens kan een nadere invulling worden gegeven van
      de gegevens die betrekking hebben op verstrekte aanvullende bekostiging en de wijze waarop deze gegevens worden
      gedefinieerd, geordend en beschikbaar gesteld.

      2 Daarbij wordt aangegeven welke gevraagde gegevens van belang zijn voor de berekening van de hoogte van de
      bekostiging als bedoeld in [artikel 176 van de wet][ref2].

      3 In voorkomende gevallen kan Onze Minister bij het verzoek om beschikbaarstelling reeds bij hem bekende gegevens
      opnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0029594#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel176
    url: https://wetten.overheid.nl/BWBR0029594/2021-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0029594
        artikel: '2'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '176'
  - number: '4'
    text: |-
      Bij ministeriële regeling kan in spoedeisende gevallen een aanvullende vragenlijst ten aanzien van bekostiging
      worden vastgesteld ter beantwoording door het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0029594/2021-01-01#Artikel4
  - number: '5'
    text: |-
      Tot het tijdstip van inwerkingtreding van de [artikelen 2][ref1] en [3][ref2], worden bij ministeriële regeling
      de gegevens vastgesteld die het bevoegd gezag ten aanzien van bekostiging en beleid aan Onze Minister levert en op
      welke wijze deze gegevens worden gedefinieerd en geordend.


      [ref1]: https://wetten.overheid.nl/BWBR0029594#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0029594#Artikel3
    url: https://wetten.overheid.nl/BWBR0029594/2021-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0029594
        artikel: '2'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0029594
        artikel: '3'
        hoofdstuk: II
  - number: '6'
    text: |-
      1 De [artikelen 1][ref1], [4][ref2] en [5][ref3] treden in werking met ingang van de dag in Bonaire, Sint
      Eustatius en Saba na de datum van uitgifte van het Staatsblad waarin dit besluit wordt geplaatst.

      2 De [artikelen 2][ref4] en [3][ref5] treden in werking met ingang van een bij koninklijk besluit te bepalen
      tijdstip.


