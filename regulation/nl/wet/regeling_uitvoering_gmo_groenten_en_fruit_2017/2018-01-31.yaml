  - number: '213'
    text: |-
      1 De producentenorganisatie of unie van producentenorganisaties overlegt een evaluatie als bedoeld in artikel 57,
      derde lid, van [verordening 2017/891](32791R2017) met gebruikmaking van een door de minister beschikbaar gesteld
      middel.

      2 Ter uitvoering van artikel 57, derde lid, van [verordening 2017/891](32791R2017) bevat de evaluatie in ieder
      geval de volgende onderdelen:

      a. een beschrijving van de geplande en daadwerkelijke gedurende de looptijd van het operationeel programma
      uitgevoerde projecten en activiteiten, bedoeld in [artikel 51, eerste lid, onderdelen d en e][ref1];

      b. een motivering van afwijkingen tussen geplande en daadwerkelijke uitgevoerde projecten en activiteiten als
      bedoeld in onderdeel a;

      c. een beschrijving per project en activiteit van de geplande en gedurende de looptijd van het operationeel
      programma daadwerkelijk bereikte realisatie van de in het goedgekeurde operationele programma vastgestelde meetbare
      streefdoelen als bedoeld in [artikel 51, eerste lid, onderdeel c][ref2];

      d. een motivering van afwijkingen tussen geplande en de daadwerkelijk bereikte realisatie, bedoeld in onderdeel c;

      e. een beschrijving van de bijdrage die de uitvoering van het operationeel programma gedurende haar looptijd
      geleverd heeft aan de realisatie van het operationeel programma, met name de strategische doelen, bedoeld in
      [artikel 47, eerste en tweede lid][ref3];

      f. een beschrijving van de begrote en daadwerkelijke benutting van het actiefonds gedurende de looptijd van het
      operationeel programma;

      g. een motivering van afwijkingen tussen begrote en de daadwerkelijk bereikte benutting van het actiefonds, en

      h. een beschrijving van de wijzigingen van het operationele programma als gevolg van de afwijkingen, bedoeld in
      onderdeel b, d en f.

      3 Indien de looptijd van een operationeel programma is verlengd op grond van artikel 34, eerste lid, van
      [verordening 2017/891](32791R2017) behoeft de evaluatie slechts één maal te worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0039769#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0039769#Artikel51
