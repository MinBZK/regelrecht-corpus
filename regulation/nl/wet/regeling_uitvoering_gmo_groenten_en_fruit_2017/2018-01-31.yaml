  - number: '189'
    text: |-
      1 Producentenorganisaties sluiten schriftelijke overeenkomsten met afnemers als bedoeld in
      [artikel 185, derde lid][ref1], en transporteurs van uit de markt genomen producten met gebruikmaking van een door
      de minister beschikbaar gesteld model, waarin de afnemers en transporteurs worden verplicht:

      a. tot naleving van de voorwaarden uit artikel 47 van [verordening 2017/891](32791R2017), inclusief het voeren van
      een aparte voorraadboekhouding voor de betrokken concrete acties;

      b. bij ontvangst van de uit de markt genomen producten de daarbij behorende door de minister ter beschikking
      gestelde vrachtbrief te ondertekenen;

      c. de vrachtbrief, bedoeld in onderdeel b, en de overeenkomst met de producentenorganisatie gedurende tenminste 7
      kalenderjaren, volgend op het kalenderjaar waarin het verkoopseizoen eindigt, te bewaren, en

      d. tot vervoer van de uit de markt genomen producten voor bestemmingen als bedoeld in
      [artikel 185, derde lid, onderdeel a en b][ref2], zonder dat verlies uit het vervoermiddel van producten of delen
      ervan plaatsvindt.

      2 In aanvulling op het eerste lid worden ontvangers van uit de markt genomen producten als bedoeld in
      [artikel 185, derde lid, onderdelen a en b][ref3], verplicht om de uit de markt genomen producten in geval van de
      bestemmingen, bedoeld in artikel 185, derde lid, onderdelen a en b:

      a. een niet voor menselijke consumptie geschikte bestemming te geven die:

      1°. de normale afzet van de betrokken productie niet in de weg staat, en

      2°. geen negatieve milieu-impact of negatieve fytosanitaire gevolgen heeft als bedoeld in artikel 46, eerste lid,
      van [verordening 2017/891](32791R2017), en

      b. bij ontvangst per vracht te wegen en de weegbrieven gedurende tenminste 7 kalenderjaren, volgend op het
      kalenderjaar waarin het verkoopseizoen eindigt, te bewaren.

      3 Indien voor gratis uitreiking, als bedoeld in [artikel 185, derde lid, onderdeel c][ref4], bestemd product door
      de verwerkende industrie wordt verwerkt toont de afnemer ten genoegen van de minister aan de hand van bewijsstukken
      aan dat het product niet opnieuw in het commerciële handelscircuit terecht komt.


      [ref1]: https://wetten.overheid.nl/BWBR0039769#Artikel185
