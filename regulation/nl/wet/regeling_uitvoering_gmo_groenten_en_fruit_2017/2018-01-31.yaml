      1 Uitgaven van de producentenorganisatie ten behoeve van marktonderzoek en marktontwikkeling, inclusief
      personeelskosten, zijn subsidiabel indien het gaat om:

      a. consumentenonderzoek en aankoop van paneldata;

      b. het testen van een product waarvoor de producentenorganisatie erkend is door een panel;

      c. onderzoek naar het onderhouden van schap of retail positionering;

      d. productmarktanalyses;

      e. marktonderzoek, en

      f. het doen van marktonderzoek door middel van pop-up stores.

      2 Uitgaven als bedoeld in het eerste lid, die identiek zijn aan eerdere uitgaven van de producentenorganisatie,
      zijn uitsluitend subsidiabel indien zij zijn gedaan binnen 4 jaar na de factuurdatum van de laatste factuur voor
      die eerdere uitgaven.

      3 Onderzoeken als bedoeld in het eerste lid naar verwerkte producten zijn slechts subsidiabel indien dit onderzoek
      betrekking heeft op producten die bestemd zijn voor de food-markt.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel144
  - number: '145'
    text: |-
      1 Uitgaven van de producentenorganisatie ten behoeve van ontwikkeling en verbetering van intrinsieke
      producteigenschappen of nieuwe producten, inclusief personeelskosten, zijn subsidiabel wanneer het gaat
      om licenties voor het recht op het gebruik van zaden en plantgoed ten behoeve van nieuwe rassen indien de
      producentenorganisatie door middel van contracten of andere schriftelijke bescheiden aantoont dat het ras gedurende
      de looptijd van het project slechts op een vooraf vastgestelde hoeveelheid areaal wordt geproduceerd.

      2 Uitgaven als bedoeld in het eerste lid voor een volledige overname van een licentie en de kosten van aankoop van
      het zaad en het plantgoed zijn niet subsidiabel.

      3 Uitgaven als bedoeld in het eerste lid, die identiek zijn aan eerdere uitgaven van de producentenorganisatie,
      zijn uitsluitend subsidiabel indien zij zijn gedaan binnen 4 jaar na de factuurdatum van de laatste factuur voor
      die eerdere uitgaven.

      4 De producentenorganisatie overlegt jaarlijks bij de indiening van de steunaanvraag aan de minister, met
      gebruikmaking van een door de minister beschikbaar middel, een overzicht betreffende de planten die met
      gebruikmaking van de zaden en het plantgoed, bedoeld in het eerste lid, zijn geteeld.

      5 De producentenorganisatie overlegt bij de indiening van de steunaanvraag voor het laatste uitvoeringsjaar van het
      operationeel programma aan de minister, met gebruikmaking van een door de minister beschikbaar gesteld middel, het
      resultaat van de evaluatie waaruit blijkt hoe de producentenorganisatie zich in de markt met het betreffende ras
      heeft onderscheiden.

      6 De producentenorganisatie beschikt over de afleverbonnen voor de zaden en het plantgoed, bedoeld in het eerste
      lid en overlegt deze desgevraagd aan de minister.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel145
  - number: '146'
    text: |-
      1 Uitgaven van de producentenorganisatie ten behoeve van ontwikkeling en verbetering van intrinsieke
      producteigenschappen of nieuwe producten, inclusief personeelskosten, zijn subsidiabel wanneer het gaat om
      rassenproeven op intrinsieke producteigenschappen.

      2 Rassenproeven, bedoeld in het eerste lid, zijn slechts subsidiabel indien de producten van de geteste rassen
      bedoeld zijn voor menselijke consumptie.

      3 Uitgaven als bedoeld in het eerste lid, die identiek zijn aan eerdere uitgaven van de producentenorganisatie,
      zijn uitsluitend subsidiabel indien zij zijn gedaan binnen 4 jaar na de factuurdatum van de laatste factuur voor
      die eerdere uitgaven.

      4 De producentenorganisatie overlegt jaarlijks bij de indiening van de steunaanvraag aan de minister:

      a. het contract en de gedetailleerde factuur voor de uitvoering van de rassenproeven, bedoeld in het eerste lid, en

      b. een overzicht van de producenten waar de activiteit wordt verricht.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel146
  - number: '147'
    text: |-
      1 Uitgaven van de producentenorganisatie ten behoeve van ontwikkeling en verbetering van concepten rondom verse
      producten, inclusief personeelskosten, zijn subsidiabel indien het gaat om:

      a. conceptontwikkeling op het gebied van duurzaamheid, gezondheid en gemak, of

      b. ontwikkeling van nieuwe verpakkingen voor het verse product.

      2 Uitgaven als bedoeld in het eerste lid, onderdeel b, zijn slechts subsidiabel indien deze rechtstreeks bijdragen
      aan het kwaliteitsbehoud.

      3 De producentenorganisatie overlegt jaarlijks bij de indiening van de steunaanvraag aan de minister:

      a. een overzicht van de producenten waar de activiteiten worden verricht, en

      b. een gedetailleerde factuur.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel147
  - number: '148'
    text: |-
      1 Uitgaven van de producentenorganisatie ten behoeve van ontwikkeling en verbetering van concepten rondom bewerkte
      en verwerkte producten, inclusief personeelskosten, zijn subsidiabel indien het gaat om:

      a. conceptontwikkeling van bewerkte en verwerkte producten op het gebied van duurzaamheid, gezondheid en gemak;

      b. ontwikkeling van nieuwe verpakkingen ten behoeve van verwerkte en bewerkte producten;

      c. ontwikkeling van nieuwe verwerkte producten ten behoeve van de foodmarkt, en

      d. ontwikkeling van ondersteunende voedingsproducten en niet voedingsproducten ten behoeve van bewerkte en
      verwerkte producten.

      2 Uitgaven als bedoeld in het eerste lid, onderdelen c en d, zijn slechts subsidiabel indien het verwerkte
      product dat de producentenorganisatie met behulp van de activiteiten, bedoeld in het eerste lid, onderdelen c en
      d, produceert:

      a. direct, zonder verdere verwerking, door consumenten kan worden geconsumeerd.

      b. niet wordt verwerkt in ingrediënten ten behoeve van de voedselindustrie.

      3 Uitgaven als bedoeld in het eerste lid, onderdeel d, zijn slechts subsidiabel indien deze rechtstreeks bijdragen
      aan het kwaliteitsbehoud van groente- en fruit producten.

      4 De producentenorganisatie overlegt jaarlijks bij de indiening van de steunaanvraag aan de minister:

      a. een overzicht van het aantal producenten ten behoeve van de betreffende productgroep waarvoor de activiteiten
      worden verricht, en

      b. een gedetailleerde factuur.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel148
  - number: '149'
    text: |-
      1 Uitgaven van de producentenorganisatie ten behoeve van generieke afzetbevordering, inclusief personeelskosten,
      zijn subsidiabel indien het gaat om uitgaven voor:

      a. generieke promotie op consumentenbeurzen;

      b. generieke promotie tijdens publieksevenementen;

      c. generieke promotie in het kader van duurzaam telen;

      d. generieke promotie gericht op doelgroepen;

      e. sectorpromotie en PR-campagnes;

      f. collectieve acties voor GMO producten door meerdere producentenorganisaties, en

      g. websites en sociale media, voor zover het gaat om:

      1°. het voor de eerste maal registreren van domeinnamen;

      2°. het bouwen van nieuwe websites, of

      3°. het uitbouwen van bestaande websites met aantoonbaar nieuwe elementen.

      2 Uitgaven als bedoeld in het eerste lid zijn niet subsidiabel als het gaat om:

      a. activiteiten op het gebied van verkoop van producten;

      b. activiteiten op het gebied van gezamenlijke verkoopbevordering waarvan de kosten mede worden gedragen door een
      afnemer;

      c. de kosten van producten in het geval van het gratis verstrekken van product;

      d. abonnementen bij providers, hosting van serverruimte, communicatie met het web, het updaten van bestaande
      websites, personeelskosten ten behoeve van berichtgeving in het kader van social media, en

      e. uitgaven voor sponsoring.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel149
  - number: '150'
    text: |-
      1 Uitgaven van de producentenorganisatie ten behoeven van marketing en verkoopbevordering van merken en
      handelsnamen van de producentenorganisatie en hun dochterondernemingen, inclusief personeelskosten, die wordt
      meegenomen in de berekening van de waarde van de afgezette productie op grond van artikel 22, achtste lid, van
      [verordening 2017/891](32791R2017), zijn subsidiabel indien het gaat om uitgaven voor:

      a. promotie van merken of handelsnamen op consumentenbeurzen;

      b. promotie van merken of handelsnamen op publieksevenementen;

      c. promotie van merken of handelsnamen in het kader van duurzaam telen;

      d. promotie van merken of handelsnamen gericht op doelgroepen;

      e. sectorpromotie en PR-campagnes;

      f. websites en sociale media, indien het gaat om:

      1°. het voor de eerste maal registreren van een domeinnaam;

      2°. het bouwen van een nieuwe website, en

      3°. het uitbreiden van een bestaande website met aantoonbaar nieuwe elementen.

      g. het opstellen en uitvoeren van plannen voor accountmanagement of categorymanagement, en

      h. het laten uitvoeren van onderzoek op het gebied van afzetbeleid, voor zover niet gericht op de interne
      organisatie van de producentenorganisatie.

      2 Uitgaven als bedoeld in het eerste lid zijn niet subsidiabel als het gaat om:

      a. de aankoop van een licentie;

      b. activiteiten ten behoeve van een merk waarvan de licentie gehuurd of geleased is;

      c. activiteiten op het gebied van verkoop van producten;

      d. uitgaven voor gezamenlijke verkoopbevordering, waarvan de kosten mede worden gedragen door een afnemer;

      e. de kosten van producten in het geval van het gratis verstrekken van product;

      f. abonnementen bij providers, hosting van serverruimte, communicatie met het web, het updaten van bestaande
      websites, personeelskosten ten behoeve van berichtgeving in het kader van social media;

      g. uitgaven voor sponsoring, en

      h. PR-activiteiten richting potentiële leden van een producentenorganisatie.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel150
  - number: '151'
    text: |-
      1 Uitgaven van de producentenorganisatie voor reclameactiviteiten en reclameartikelen voor producten waarvoor de
      producentenorganisatie is erkend, inclusief personeelskosten, zijn subsidiabel als het gaat om uitgaven voor:

      a. advertenties in magazines of kranten;

      b. promotie in een blad of magazine van supermarkten, indien:

      1°. in het blad of magazine duidelijk vermeld is dat de producentenorganisatie de afzender is, en

      2°. er geen logo of verwijzing naar de supermarkt in de advertentie is opgenomen.

      c. ontwikkelingskosten van de lay-out en extra kosten van reclamedrukwerk op verpakkingen of etiketten,
      steekkaarten of wikkels voor zover gebruikt bij tijdelijke acties;

      d. toonbankdisplays, flyers of folders, gadgets, belettering, aangekochte producten voor standaankleding;

      e. billboards, radioreclame, tv-reclame, banners op websites;

      f. uitdelen van producten ter waarde van de marktprijs van het uit te delen product, indien deze actie aantoonbaar
      minimaal vier weken voor de uitvoering van de actie gepland is en niet bedoeld is als interventiemaatregel;

      g. kookdemonstraties;

      h. bedrijfsrondleidingen bij een producentenorganisatie of lid van de producentenorganisatie, een open dag, opening
      of jubileum, of

      i. deelname aan beurzen, indien deze beurzen gericht zijn op afnemers van de producentenorganisatie, met
      uitzondering van verstrekte consumpties.

      2 Ter onderbouwing van de uitgaven, bedoeld in het eerste lid, onderdeel h, overlegt de producentenorganisatie aan
      de minister bij de indiening van de steunaanvraag een uitnodigingenlijst.

      3 Reclameacties en reclameartikelen waarvan de kosten mede worden gedragen door een afnemer zijn niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel151
  - number: '152'
    text: |-
      1 Uitgaven van de producentenorganisatie voor personeelskosten en externe diensten ten behoeve van activiteiten
      gericht op het bepalen van een marktstrategie zijn subsidiabel indien het gaat om:

      a. het laten uitvoeren van onderzoek op het gebied van afzetbeleid voor zover niet gericht op de interne
      organisatie van de producentenorganisatie;

      b. het jaarlijks aanpassen of opstellen van marketingplannen of accountplannen, of

      c. relatiebeheer in het kader van contact met afnemers.

      2 Onder marktstrategie als bedoeld in het eerste lid wordt verstaan samenwerking in de keten, reclame, innovatie en
      planning van het productaanbod.

      3 Onder personeel en externe diensten als bedoeld in het eerste lid wordt verstaan:

      a. categoriemanagers;

      b. accountmanagers;

      c. productmanagers;

      d. marketingpersoneel;

      e. marketingmanagers, of

      f. marktonderzoekers.

      4 De activiteiten van het personeel en externe diensten, bedoeld in het derde lid, hebben in ieder geval betrekking
      op het:

      a. samenstellen van een innovatief, concurrerend en formulegericht assortiment per productgroep;

      b. behouden van klanten of nieuwe klanten werven door acquisitieactiviteiten;

      c. bepalen van de ontwikkeling, de productie, de marketing en het in de markt zetten van een product en het
      analyseren van de resultaten met het oog op de commerciële lange termijn doelen;

      d. bepalen van de marktstrategie door middel van marketingplannen en het ervoor zorgen dat deze strategie wordt
      geïmplementeerd en nageleefd;

      e. onderzoek naar alle factoren op alle verschillende (potentiële) markten die de vraag naar een product
      beïnvloeden, onder meer wat betreft trends, klanttevredenheid, de onderliggende behoeften van klanten en het imago
      van de sector.

      5 Activiteiten van het personeel en van externe diensten op het gebied van het verkopen van producten op
      welke manier dan ook, het opnemen van bestellingen, het leveren en de allocatie van het product, het maken van
      prijsafspraken ten aanzien van producten van niet-leden of waarvoor de producentenorganisatie niet is erkend, zijn
      niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel152
  - number: '153'
    text: |-
      1 Uitgaven van de producentenorganisatie voor personeel en externe diensten voor nieuwbouw van sorteercentra en
      verpakcentra, distributiecentra, verwerkingscentra, fustopslag, dockboards en op afzetverbetering gerichte sorteer-
      en verpakkingslijnen, bedoeld in [artikel 139, eerste lid][ref1], ten behoeve van de bundeling van productstromen
      zijn subsidiabel indien het gaat om:

      a. de kosten van bouwkundig advies;

      b. de kosten van bouwbegeleiding;

      c. de kosten van projectmanagement;

      d. de kosten van onafhankelijk toezicht op uitvoering van een project;

      e. de kosten van haalbaarheidsstudies;

      f. juridische en administratiekosten,

      g. reis- en verblijfkosten,

      2 Uitgaven als bedoeld in het eerste lid zijn slechts subsidiabel ten aanzien van nieuwbouw van gebouwen die
      eigendom zijn van de producentenorganisatie of een dochteronderneming die voor minimaal 90% eigendom is van de
      producentenorganisatie en voor zover het gaat om ruimtes die zijn aangemerkt als subsidiabel in [bijlage II][ref2],
      of elementen die zijn aangemerkt als subsidiabel in [bijlage III][ref3].

      3 Uitgaven als bedoeld in het eerste lid waarvan het fiscaal en bedrijfseconomisch gebruikelijk is dat deze worden
      geactiveerd in het investeringsbedrag zijn niet subsidiabel.

      4 Uitgaven als bedoeld in het eerste lid, onderdeel g, zijn niet subsidiabel indien het gaat om reis- en
      verblijfkosten voor het personeel van de producentenorganisatie of haar leden.


      [ref1]: https://wetten.overheid.nl/BWBR0039769#Artikel139
