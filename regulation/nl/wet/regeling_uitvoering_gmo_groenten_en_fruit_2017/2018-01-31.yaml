        afdeling: '1'
  - number: '131'
    text: |-
      Indien dit noodzakelijk is voor het functioneren van de belichtingsinstallatie, bedoeld in artikel 130, eerste lid,
      zijn uitgaven van de producentenorganisatie voor de aansluiting van een extern trafostation van het energiebedrijf
      of de verzwaring van de netkoppeling op de warmte-krachtkoppelingsinstallatie, inclusief personeelskosten,
      subsidiabel.
