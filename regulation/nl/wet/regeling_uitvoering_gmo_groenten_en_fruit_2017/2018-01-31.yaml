        bwb_id: BWBR0039769
        artikel: '63'
        hoofdstuk: '3'
  - number: '69'
    text: |-
      1 De producentenorganisatie neemt duurzame productiemiddelen binnen twaalf maanden na de factuurdatum van de
      laatste factuur in gebruik.

      2 De producentenorganisatie toont de aanschaf van de duurzame productiemiddelen aan de hand van facturen of
      afleverbonnen aan en verstrekt deze onverwijld aan de minister, indien de minister daar om verzoekt.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel69
  - number: '70'
    text: |-
      1 Duurzame productiemiddelen zijn subsidiabel indien zij toegankelijk zijn voor alle leden van de
      productenorganisatie.

      2 Duurzame productiemiddelen geplaatst op het bedrijf van een lid van een producentenorganisatie zijn subsidiabel
      indien de producentenorganisatie schriftelijk met het lid overeenkomt dat het productiemiddel toegankelijk is voor
      de producentenorganisatie en al haar leden.

      3 Investeringen in elementaire voorzieningen als afwateringssystemen, riolering, aansluiting op waterleiding en
      aansluiting op systemen voor datacommunicatie, die worden gezien als onmisbare elementen, op het bedrijf van een
      lid zijn subsidiabel.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel70
  - number: '71'
    text: |-
      Investeringen die voor 1 januari 2008 reeds in een operationeel programma waren opgenomen en ook na 1 januari 2008
      nog in een operationeel programma zijn opgenomen, zijn voor het deel dat betrekking heeft op de periode voor 1
      januari 2008 subsidiabel naar rato van het aandeel van de investering dat wordt gebruikt voor producten waarvoor de
      producentenorganisatie is erkend.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel71
  - number: '72'
    text: |-
      1 Ter uitvoering van artikel 31, vierde lid, van [verordening 2017/891](32791R2017) toont de producentenorganisatie
      het gebruik van duurzame productiemiddelen aan met behulp van gebruiksadministraties per productiemiddel, tenzij de
      producentenorganisatie het gebruik van het productiemiddel op andere wijze aantoont ten genoegen van de minister.

      2 De producentenorganisatie geeft bij de indiening van het operationeel programma aan op welke wijze de
      gebruiksadministratie, bedoeld in het eerste lid gevoerd gaat worden.

      3 De gebruiksadministratie, bedoeld in het eerste lid registreert minimaal de volgende elementen:

      a. het jaar;

      b. het project;

      c. de locatie;

      d. het soort productiemiddel;

      e. de aanschafdatum;

      f. de leverancier, het merk, het type, het serienummer of registratienummer;

      g. de hoeveelheid bewerkt of voorbereid product per dag waarvoor de producentenorganisatie is erkend;

      h. de hoeveelheid bewerkt of voorbereid product per dag waarvoor de producentenorganisatie niet is erkend, en

      i. de totale hoeveelheid bewerkt of voorbereid product per dag.

      4 De hoeveelheden bewerkt of voorbereid product, bedoeld in het derde lid, onderdelen g tot en met i, worden
      geregistreerd op:

      a. productstromen op locatieniveau in geval van distributiecentra en gebouwen;

      b. palletregistraties in geval van koelcellen, of

      c. stuks, collie of kilogramregistraties, in geval van sorteerlijnen en verpakkingsmachines.

      5 De gebruiksadministratie wordt bij de indiening van de steunaanvraag, geaggregeerd per maand aan de minister
      overgelegd.

      6 De minister kan, op eigen initiatief of op verzoek van een producentenorganisatie besluiten, in afwijking van het
      tweede, derde en vierde lid, andere voorschriften te stellen aan de gebruiksadministratie.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel72
  - number: '73'
    text: |-
      1 Uitgaven voor het installeren en monteren van duurzame productiemiddelen en de bijkomende kosten van installatie
      en montage, waarvan het fiscaal en bedrijfseconomisch gebruikelijk is dat deze worden geactiveerd, zijn als
      onderdeel van het duurzame productiemiddel subsidiabel.

      2 In afwijking van het eerste lid zijn uitgaven voor het installeren en monteren van duurzame productiemiddelen
      niet subsidiabel voor zover het gaat om uitgaven voor:

      a. service en onderhoud van duurzame productiemiddelen, of

      b. construction all risk verzekeringen.

      3 Uitgaven voor het demonteren van duurzame productiemiddelen zijn subsidiabel wanneer dit tot doel heeft het
      productiemiddel te verhuizen, reviseren, transporteren en opnieuw monteren.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel73
  - number: '74'
    text: |-
      1 De producentenorganisatie neemt in de steunaanvraag alleen uitgaven op voor:

      a. nieuwbouw of verbouw van gebouwen die eigendom zijn van de producentenorganisatie of een dochteronderneming die
      voor minimaal 90% eigendom is van de producentenorganisatie;

      b. ruimtes die zijn aangemerkt als subsidiabel in [bijlage II][ref1], en

      c. elementen die zijn aangemerkt als subsidiabel in [bijlage III][ref2].

      2 Uitgaven als bedoeld in [deel 2 van bijlage II][ref3] en [kolom 2 van bijlage III][ref4] zijn niet subsidiabel.

      3 De producentenorganisatie onderbouwt bij de indiening van het operationeel programma de subsidiabele uitgaven,
      bedoeld in het eerste lid, aan de hand van:

      a. bouwtekeningen, die aangegeven welk deel van de uitgaven subsidiabele ruimten en subsidiabele elementen betreft;

      b. offertes van de aanneem- of bouwsom, en

      c. een uitsplitsing, met gebruikmaking van een door de minister beschikbaar gesteld middel, van subsidiabele en
      niet subsidiabele oppervlakten en elementen en bijbehorende uitgaven.

      4 De producentenorganisatie onderbouwt bij de indiening van de steunaanvraag de subsidiabele uitgaven aan de hand
      van:

      a. bouwtekeningen die aangeven welk deel van de uitgaven subsidiabele ruimten en subsidiabele elementen betreffen;

      b. facturen op naam van de producentenorganisatie met vermelding van de aanneem- of bouwsom, en

      c. een uitsplitsing, met gebruikmaking van een door de minister beschikbaar gesteld middel, van subsidiabele en
      niet subsidiabele oppervlakte en elementen en bijbehorende uitgaven.


      [ref1]: https://wetten.overheid.nl/BWBR0039769
