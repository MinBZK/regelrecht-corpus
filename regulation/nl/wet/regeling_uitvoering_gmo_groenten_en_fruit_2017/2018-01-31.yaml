  - number: '34'
    text: |-
      Een erkenning als bedoeld in artikel 156 van [verordening 1308/2013](32013R1308) wordt slechts verleend indien
      wordt voldaan aan de op grond van artikel 156 van [verordening 1308/2013](32013R1308), titel I, hoofdstuk I,
      afdeling 3, van [verordening 2017/891](32791R2017) en de in artikelen 32 en 33 gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel34
  - number: '35'
    text: |-
      De erkenning van een producentenorganisatie wordt met ingang van het tijdstip van verstrijken van de in artikel
      59, eerste lid, van [verordening 2017/891](32791R2017) bedoelde in het aanmaningsbesluit vastgestelde termijn van
      rechtswege opgeschort als bedoeld in artikel 59, tweede lid, van [verordening 2017/891](32791R2017), tenzij de
      minister schriftelijk aan de producentenorganisatie meedeelt dat de niet-naleving van de erkenningscriteria tijdig
      is gecorrigeerd.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel35
  - number: '36'
    text: |-
      De referentieperiode voor het bepalen van de waarde van de afgezette productie, bedoeld in artikel 23, eerste lid,
      van [verordening 2017/891](32791R2017), is het kalenderjaar twee jaar vóór het uitvoeringsjaar waarvoor de waarde
      afgezette productie wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel36
  - number: '37'
    text: |-
      1 Producten zijn geproduceerd door een producentenorganisatie of een lid van de producentenorganisatie als bedoeld
      in artikel 22, eerste lid, eerste alinea, van [verordening 2017/891](32791R2017), wanneer de productie voor eigen
      rekening en risico van de producentenorganisatie of haar lid heeft plaatsgevonden.

      2 Producten zijn geproduceerd door een unie van producentenorganisaties of een aangesloten producentenorganisaties
      als bedoeld in artikel 22, eerste lid, tweede alinea, van [verordening 2017/891](32791R2017), wanneer de productie
      voor eigen rekening en risico van de unie van producentenorganisaties of daarbij aangesloten producentenorganisatie
      heeft plaatsgevonden.

      3 De producentenorganisatie of unie van producentenorganisaties controleert de naleving van het eerste
      onderscheidenlijk tweede lid.

      4 Ter uitvoering van artikel 22, zesde lid, van [verordening 2017/891](32791R2017) omvat de waarde van de
      afgezette productie in het stadium ‘af producentenorganisatie’ de aan de afnemer gefactureerde kosten van
      verpakkingsmateriaal, eenmalig fust, huur van meermalig fust en de verpakking waarin of pallet waarop het product
      ten verkoop wordt aangeboden.

      5 In de waarde van de afgezette productie worden geen transportkosten naar de afnemer opgenomen, ongeacht of deze
      op de verkoopfactuur zijn vermeld.

      6 Ter uitvoering van artikel 22, tiende lid, van [verordening 2017/891](32791R2017) wordt slechts een vergoeding
      meegeteld die is uitgekeerd aan de producentenorganisatie of unie van producentenorganisaties.

      7 In de waarde van de afgezette productie worden geen debiteuren opgenomen die op het tijdstip van definitieve
      opgave van de waarde van de afgezette productie als bedoeld in [artikel 43][ref1] nog openstaan. Terugbetalingen
      aan afnemers worden uit de waarde van de afgezette productie gehaald op het moment dat creditering in de
      boekhouding van de producentenorganisatie plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0039769#Artikel43
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel37
    references:
