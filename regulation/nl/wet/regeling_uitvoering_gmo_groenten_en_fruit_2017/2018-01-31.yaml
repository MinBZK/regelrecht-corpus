      Uitgaven van de producentenorganisatie voor advies en begeleiding ten behoeve van de teelt in geval van biologische
      productie, inclusief personeelskosten, zijn subsidiabel indien:

      a. het gaat om:

      1°. biologische teelt;

      2°. bodemvruchtbaarheid;

      3°. biologische bemesting;

      4°. compostering;

      5°. vruchtwisseling;

      6°. rassenkeuze;

      7°. biologische bestrijding en biologisch evenwicht, of

      8°. biologische teelttechniek;

      b. voldaan is aan de bepalingen opgenomen in [verordening 834/2007](32007R0834), en [verordening 889/2008]
      (32008R0889), en

      c. deelnemende leden van de producentenorganisatie beschikken over een geldig Skal certificaat of een bevestiging
      van Stichting Skal dat het bedrijf van het lid in omschakeling is naar biologische productie.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel179
  - number: '180'
    text: |-
      1 Uitgaven van de producentenorganisatie voor advies en begeleiding ten behoeve van de teelt in het geval van
      geïntegreerde plaagbestrijding, inclusief personeelskosten, zijn subsidiabel als het gaat om:

      a. biologische of geïntegreerde bestrijding;

      b. geleide bestrijding;

      c. het voorkomen van ziekten en plagen met inbegrip van gewas-, water- of bodemanalyses gericht op het vaststellen
      van ziekten en plagen.

      2 Bij de indiening van de steunaanvraag verstrekt de producentenorganisatie in geval van uitgaven voor een
      analyse als bedoeld in het eerste lid, onderdeel c, per soort analyse, met gebruikmaking van een door de minister
      beschikbaar gesteld middel, aan de minister informatie over de analyse.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel180
  - number: '181'
    text: |-
      1 Uitgaven van de producentenorganisatie voor algemeen advies en begeleiding ten behoeve van de teelt in het
      geval van geïntegreerde productie die mede de kwaliteit en het milieu betreffen, inclusief personeelskosten, zijn
      subsidiabel indien het onder meer gaat om:

      a. gewasbeoordeling;

      b. gewasbescherming;

      c. watermanagement;

      d. bemesting en reduceren mineralengebruik;

      e. klimaataansturing, of

      f. energiereductie.

      2 Uitgaven als bedoeld in het eerste lid die betrekking hebben op de begeleiding van het trekken van witlofpennen
      zijn niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel181
