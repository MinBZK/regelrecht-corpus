preamble:
  text: |-
    Gelet op de artikelen 1, 3, 32 tot en met 34, 36, 152 tot en met 156, 159 en 160 van Verordening (EU) nr. 1308/2013
    van het Europees Parlement en de Raad van 17 december 2013 tot vaststelling van een gemeenschappelijke ordening van
    de markten voor landbouwproducten en tot intrekking van de Verordeningen (EEG) nr. 922/72, (EEG) nr. 234/79, (EG)
    nr. 1037/2001 en (EG) nr. 1234/2007 van de Raad (PbEU 2013 L 347);

    Gelet op gedelegeerde verordening (EU) 2017/891 van de Commissie van 13 maart 2017 tot aanvulling van Verordening
    (EU) nr. 1308/2013 van het Europees Parlement en de Raad wat betreft de sectoren groenten en fruit en verwerkte
    groenten en fruit en tot aanvulling van Verordening (EU) nr. 1306/2013 van het Europees Parlement en de Raad wat
    betreft de in deze sectoren toe te passen sancties en tot wijziging van Uitvoeringsverordening (EU) nr. 543/2011
    van de Commissie;

    Gelet op uitvoeringsverordening (EU) 2017/892 van de Commissie van 13 maart 2017 tot vaststelling van voorschriften
    voor de toepassing van Verordening (EU) nr. 1308/2013 van het Europees Parlement en de Raad, wat betreft de
    sectoren groenten en fruit en verwerkte groenten en fruit;

    Gelet op de artikelen 13, eerste en tweede lid, 15 en 19, eerste lid, van de Landbouwwet;

