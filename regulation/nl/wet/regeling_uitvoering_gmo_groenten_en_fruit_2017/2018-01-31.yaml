      1 Uitgaven van de producentenorganisatie voor personeelskosten en externe diensten in het kader van
      afzetbevorderings -en communicatieacties als bedoeld in artikel 33, derde lid, onderdeel c, van [verordening
      1308/2013](32013R1308) zijn subsidiabel indien het gaat om:

      a. marktonderzoek;

      b. marktstudies;

      c. introductie van een nieuwe verpakkingswijze;

      d. introductie van een merk;

      e. promotie, of

      f. reclame.

      2 Onder de uitgaven, bedoeld in het eerste lid, worden mede verstaan voorbereidende uitgaven.
