  - number: '53'
    text: |-
      1 Ter uitvoering van artikel 25, tweede lid, van [verordening 2017/891](32791R2017) wordt een operationeel
      programma of een verzoek tot wijziging van een operationeel programma als bedoeld in artikel 34, eerste lid van
      [verordening 2017/891](32791R2017) door de algemene vergadering van de producentenorganisatie goedgekeurd.

      2 In aanvulling op artikel 5 van [verordening 2017/892](32792R2017) overlegt een producentenorganisatie voor 8
      december van het jaar waarin een operationeel programma of een wijziging daarvan voor goedkeuring is voorgelegd
      aan de minister bewijstukken waarmee wordt aangetoond dat de goedkeuring van het besluit tot goedkeuring van
      het operationeel programma of tot wijziging van een operationeel programma door de algemene vergadering van de
      producentenorganisatie heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel53
  - number: '54'
    text: |-
      1 De producentenorganisatie of unie van producentenorganisaties dient het operationele programma als bedoeld
      in artikel 6, eerste lid, van [verordening 2017/892](32792R2017), in met gebruikmaking van een door de minister
      beschikbaar gesteld middel.

      2 In afwijking van artikel 6, eerste lid, van [verordening 2017/892](32792R2017) dient de producentenorganisatie of
      unie van producentenorganisaties een operationeel programma dat aanvangt in 2018, in voor 1 oktober 2017.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel54
  - number: '55'
    text: |-
      1 Een wijziging van een operationeel programma als bedoeld in artikel 34, eerste lid, van [verordening 2017/891]
      (32791R2017) kan betrekking hebben op:

      a. een wijziging in de meerjarenbegroting voor de volgende uitvoeringsjaren van het operationeel programma;

      b. het toevoegen of laten vervallen van uitgavenposten voor activiteiten opgenomen in een goedgekeurd operationeel
      programma;

      c. het toevoegen van streefdoelen, projecten of activiteiten aan het operationele programma voor de volgende jaren;

      d. het laten vervallen van projecten of activiteiten in het operationele programma voor de volgende jaren,

      e. een wijziging van de verdeling van de tranches waarin investeringen via het actiefonds worden gefinancierd;

      f. het jaarbedrag van het actiefonds, en

      g. de looptijd van het operationele programma.

      2 Een verzoek tot wijziging als bedoeld in artikel 34, eerste lid, van [verordening 2017/891](32791R2017) wordt
      voor 15 september ingediend met gebruikmaking van een door de minister beschikbaar gesteld middel.

      3 Het toevoegen van uitgavenposten als bedoeld in het eerste lid, onderdeel b, of activiteiten als bedoeld in het
      eerste lid, onderdeel c, is slechts mogelijk indien de activiteit subsidiabel is op grond van [hoofdstuk 3][ref1]
      en 4 van dit deel.

      4 Op een wijziging als bedoeld in het eerste lid, onderdelen b en c, is [artikel 51][ref2] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039769#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0039769#Artikel51
