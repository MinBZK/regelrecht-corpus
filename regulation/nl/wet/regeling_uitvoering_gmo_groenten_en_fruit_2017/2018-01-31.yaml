  - number: '97'
    text: |-
      De minister kan subsidie voor in het operationeel programma opgenomen milieuacties aanpassen wanneer het relevante
      referentieniveau wijzigt.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel97
  - number: '98'
    text: |-
      1 De producentenorganisatie voert activiteiten ter realisatie van het strategisch doel, bedoeld in
      [artikel 47, eerste lid, onderdeel a][ref1], uit gedurende de gehele looptijd van het operationeel programma.

      2 De activiteiten, bedoeld in het eerste lid, worden tevens in een volgend operationeel programma opgenomen, indien
      dit noodzakelijk is om de looptijd te bereiken die van toepassing is op grond van artikel 28, vijfde lid, van
      [verordening 1305/2013](32013R1305).

      3 De producentenorganisatie gebruikt de technische middelen, met uitzondering van vaste activa, waarvoor
      subsidie wordt verstrekt voor uitvoering van activiteiten ter realisatie van het strategisch doel, bedoeld in
      [artikel 47, eerste lid, onderdeel a][ref2], gedurende de hele periode, bedoeld in artikel 28, vijfde lid, van
      [verordening 1305/2013](32013R1305), voor de doeleinden zoals goedgekeurd in het operationeel programma.


      [ref1]: https://wetten.overheid.nl/BWBR0039769#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0039769#Artikel47
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel98
