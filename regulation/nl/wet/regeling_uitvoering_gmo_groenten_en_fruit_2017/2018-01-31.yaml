  - number: '217'
    text: |-
      De minister wijst een verzoek als bedoeld in artikel 164, eerste lid, of 165 van [verordening 1308/2013]
      (32013R1308) uiterlijk toe tot en met 31 december 2020.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel217
  - number: '218'
    text: Dit deel strekt ter uitvoering van artikel 76 van [verordening 2017/891](32791R2017).
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel218
  - number: '219'
    text: |-
      1 Wanneer een onjuiste opgave leidt tot een hogere subsidie wordt de subsidie, behoudens overmacht of kennelijke
      vergissing, lager vastgesteld tot het bedrag waarvoor de producentenorganisatie bij een juiste opgave in
      aanmerking zou zijn gekomen, onder extra aftrek van 20 procent van het verschil tussen het opgegeven bedrag en het
      vastgestelde bedrag, indien blijkt dat:

      a. de producentenorganisatie onjuiste gegevens heeft verstrekt met betrekking tot de waarde van de afgezette
      productie, of

      b. de producentenorganisatie onjuiste gegevens heeft verstrekt met betrekking tot de bijdragen aan het actiefonds.

      2 Indien de subsidie reeds daadwerkelijk is vastgesteld wordt de subsidie overeenkomstig het eerste lid ten nadele
      van de producentenorganisatie gewijzigd.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel219
  - number: '220'
    text: |-
      1 Indien blijkt dat het operationeel programma of enig onderdeel daarvan, in strijd met de voorwaarden waaronder
      het is goedgekeurd of in strijd met de op grond van [verordening 1308/2013](32013R1308) gestelde voorschriften is
      uitgevoerd, wordt, behoudens overmacht, de subsidie verlaagd met een percentage van 20 procent, berekend over:

      a. de totale waarde van de onjuist uitgevoerde onderdelen van het operationeel programma, of

      b. de begrote waarde van de niet uitgevoerde onderdelen van het operationeel programma.

      2 Indien de subsidie reeds daadwerkelijk is vastgesteld wordt de subsidie overeenkomstig het eerste lid ten nadele
      van de producentenorganisatie gewijzigd.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel220
  - number: '221'
    text: |-
      1 Indien blijkt dat de producentenorganisatie of één of meer van haar leden voor een uit het actiefonds
      gefinancierde actie overlappende nationale of communautaire financiering heeft ontvangen, wordt de aan de
      betreffende actie gerelateerde subsidie lager vastgesteld door:

      a. ontneming van het gehele voordeel als gevolg van de overlappende financiering, en

      b. een extra verlaging van 50 procent op het bedrag dat volgt uit de toepassing van onderdeel a.

      2 Indien de subsidie reeds daadwerkelijk is vastgesteld wordt de subsidie overeenkomstig het eerste lid ten nadele
      van de producentenorganisatie gewijzigd.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel221
  - number: '222'
    text: |-
      1 Indien aan de administratie van de producentenorganisatie, haar leden of van ondernemingen aan wie de
      producentenorganisatie activiteiten heeft uitbesteed op grond van [verordening 1308/2013](32013R1308) eisen zijn
      gesteld en blijkt dat aan deze eisen niet is voldaan, wordt de aan de desbetreffende actie gerelateerde subsidie,
      behoudens overmacht, verlaagd met 20 procent.

      2 Indien de subsidie reeds daadwerkelijk is vastgesteld wordt de subsidie overeenkomstig het eerste lid ten nadele
      van de producentenorganisatie gewijzigd.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel222
  - number: '223'
    text: |-
      1 Indien informatie niet aan de minister wordt verstrekt overeenkomstig op grond van [verordening 1308/2013]
      (32013R1308) of deze regeling gestelde eisen en dit niet binnen een door de minister gestelde redelijke termijn
      wordt hersteld, wordt de subsidie voor elke niet-naleving 2 procent lager vastgesteld.

      2 Indien de subsidie reeds daadwerkelijk is vastgesteld wordt de subsidie overeenkomstig het eerste lid ten nadele
      van de producentenorganisatie gewijzigd.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel223
  - number: '224'
    text: |-
      Indien uit een onderzoek als bedoeld in artikel 60, eerste lid, van [verordening 2017/891](32791R2017) blijkt dat
      sprake is van fraude, worden de kosten van dit onderzoek ten laste van de producentenorganisaties gebracht.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel224
  - number: '225'
    text: |-
      Bij samenloop van diverse subsidieverlagende factoren als bedoeld in de [artikelen 219 tot en met 223][ref1]
      bedraagt de totale subsidieverlaging, indien er geen sprake is van opzet of grove nalatigheid, niet meer dan 50
      procent.


      [ref1]: https://wetten.overheid.nl/BWBR0039769#Artikel219
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel225
    references:
      - id: ref1
        bwb_id: BWBR0039769
        artikel: '219'
  - number: '228'
    text: |-
      1 Een verzoek tot wijziging van een operationeel programma om te voldoen aan [verordening 2017/891](32791R2017) en
      [verordening 2017/892](32792R2017) als bedoeld in artikel 80, eerste lid, onderdeel b, van [verordening 2017/891]
      (32791R2017), wordt ingediend voor 1 oktober 2017.

      2 Voor de toepassing van artikel 80, eerste lid, onderdeel a, van [verordening 2017/891](32791R2017) wordt als het
      einde van een operationeel programma beschouwd het einde van de geldende looptijd, inclusief reeds goedgekeurde
      verlenging daarvan.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel228
  - number: '229'
    text: |-
      1 Met betrekking tot het uitvoeringsjaar 2017 blijven
      [deel 3 tot en met 6 van de Regeling uitvoering GMO groenten en fruit][ref1] van toepassing, zoals deze luidden op
      14 juli 2017.

      2 Onverminderd het eerste lid wordt een voor de inwerkingtreding van deze regeling
      goedgekeurd operationeel programma beheerst door de bepalingen van [deel 4][ref2] en
      [artikel 312a van de Regeling uitvoering GMO groenten en fruit][ref3] zoals die golden op 14 juli 2017.

      3 In afwijking van het tweede lid wordt een operationeel programma beheerst door de bepalingen van deze regeling
      indien de producentenorganisatie verzoekt om een wijziging van een operationeel programma die strekt tot een
      aanpassing van de looptijd van het operationeel programma.

      4 In afwijking van het tweede lid wordt een operationeel programma beheerst door de bepalingen van deze regeling
      indien de producentenorganisatie verzoekt om een wijziging van een operationeel programma als bedoeld in
      [artikel 228][ref4].

      5 Het toevoegen van een activiteit aan een operationeel programma als bedoeld in het tweede lid door middel van een
      wijzigingsverzoek per 1 januari 2018 is toegestaan:

      a. indien de activiteit subsidiabel is op grond van deze regeling, en

      b. onder de voorwaarden die [hoofdstuk 4 van deel 4][ref5] van deze regeling aan deze activiteit stelt.

      6 Het toevoegen van een maatregel als bedoeld in artikel 2, onderdeel f, van [verordening 2017/891](32791R2017)
      of een doel als bedoeld in artikel 33, eerste lid, of 152, eerste lid, onder c, van [verordening 1308/2013]
      (32013R1308) aan een operationeel programma als bedoeld in het tweede lid door middel van een wijzigingsverzoek per
      1 januari 2018 is toegestaan:

      a. indien de activiteiten ter uitvoering van de maatregel of het doel subsidiabel zijn op grond van deze regeling,
      en

      b. onder de voorwaarden die [hoofdstuk 4 van deel 4][ref6] van deze regeling aan deze activiteiten stelt.

      7 Uitgaven voor investeringen in duurzame productiemiddelen die niet of onder andere voorwaarden dan op 14 juli
      2017 subsidiabel zijn op grond van deze regeling kunnen worden opgenomen in een nieuw operationeel programma onder
      de voorwaarden voor subsidiabele activiteiten zoals deze golden op 14 juli 2017 indien:

      a. zij onderdeel uitmaken van een voor de inwerkingtreding van deze regeling goedgekeurd operationeel programma;

      b. de producentenorganisatie voor deze investering voor 1 januari 2018 aan de minister heeft gemeld dat deze
      uitgaven gedurende meerdere jaren in de steunaanvraag worden opgenomen, en

      c. de eerste termijn van deze uitgaven voor 1 januari 2018 in de steunaanvraag is opgenomen.

      8 Het toevoegen van een investering in een duurzaam productiemiddel aan een operationeel programma als bedoeld
      in het tweede lid door middel van een wijzigingsverzoek per 1 januari 2018 is toegestaan onder de voorwaarden die
      [hoofdstuk 4 van deel 4][ref7] van deze regeling aan die investering stelt.

      9 Een verzoek tot wijziging van een operationeel programma als bedoeld in het tweede lid wordt niet goedgekeurd
      indien dit strekt tot het in eenmaal in de steunaanvraag opnemen van de resterende termijn van uitgaven voor
      investeringen in duurzame productiemiddelen waarvan eerder is aangegeven dat zij in meerdere termijnen ten laste
      van het actiefonds worden gebracht.

      10 Wijzigingen van statuten van producentenorganisaties als gevolg van aanpassing van deze regeling treden
      uiterlijk op 1 januari 2019 in werking.

      11 Op gedragingen die hebben plaatsgevonden voor 15 juli 2017 en waarvoor na die datum een sanctie wordt
      opgelegd, is [deel 7 van de Regeling uitvoering GMO][ref8] groenten en fruit van toepassing zoals dat gold
      op 14 juli 2017, tenzij de toepassing van deel 7 van deze regeling voor de producentenorganisatie of unie van
      producentenorganisaties gunstiger is.


