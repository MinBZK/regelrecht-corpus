    text: |-
      Ter uitvoering van artikel 30, vierde lid, van [verordening 2017/891](32791R2017) kunnen in uitzonderlijke gevallen
      de werkelijke kosten van milieuacties, anders dan de verwerving van vaste activa, subsidiabel worden gesteld indien
      de producentenorganisatie in haar operationeel programma onderbouwt dat het, gezien de hoogte van de werkelijk
      uit de milieuactie voortvloeiende kosten, nodig is om rekening te houden met de specifieke omstandigheden van de
      milieuactie.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel118
  - number: '119'
    text: |-
      1 Uitgaven voor zaden van rassen met één of meerdere extra resistenties met als doel vermindering van het gebruik
      van chemische gewasbeschermingsmiddelen zijn subsidiabel.

      2 De producentenorganisatie onderbouwt bij de indiening van het operationeel programma aan de hand van
      schriftelijke bewijsstukken, dat het ras, bedoeld het eerste lid, beschikt over één of meerdere extra resistenties
      ten opzichte van de belangrijkste standaardrassen aan de hand van een vergelijking tussen deze rassen.

      3 De producentenorganisatie beschikt over de afleverbonnen of plantenpaspoorten van zaden als bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel119
  - number: '120'
    text: |-
      1 Voor de rassen, bedoeld in [artikel 119, eerste lid][ref1], zijn de meerkosten ten opzichte van een standaardras
      zonder extra resistentie subsidiabel.

      2 De producentenorganisatie onderbouwt bij de indiening van de steunaanvraag, met gebruikmaking van een
      door de minister beschikbaar gesteld middel, de meerkosten, bedoeld in het eerste lid, door middel van een
      vergelijking tussen de kosten van de belangrijkste standaardrassen en het ras met de extra resistentie, bedoeld in
      [artikel 119, eerste lid][ref2].

      3 De vergelijking, bedoeld in het tweede lid, wordt gemaakt per ras en per leverancier.

      4 De kosten van gecoat zaad worden bij de prijsvergelijking, bedoeld in het derde lid, buiten beschouwing gelaten.

      5 De producentenorganisatie beschikt over de afleverbonnen van het zaad, bedoeld in
      [artikel 119, eerste lid][ref3].


