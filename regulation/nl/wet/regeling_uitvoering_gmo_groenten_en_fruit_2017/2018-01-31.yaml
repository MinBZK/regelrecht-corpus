  - number: '75'
    text: |-
      1 De aankoop van onbebouwde grond, bedoeld in punt 6 van bijlage III van [verordening 2017/891](32791R2017), is
      subsidiabel indien deze grond daadwerkelijk wordt aangewend voor de realisatie van in het operationeel programma
      opgenomen investeringen.

      2 De aankoop van grond die wordt gebruikt voor onderdelen van investeringen die op grond van
      [deel 2 van bijlage II][ref1] en [kolom 2 van bijlage III][ref2] niet subsidiabel zijn, is niet subsidiabel.

      3 De producentenorganisatie toont bij de indiening van het operationeel programma aan de hand van bouwtekeningen
      of plattegronden aan welke delen van de grond worden aangewend voor in het operationeel programma opgenomen
      subsidiabele investeringen.

      4 De producentenorganisatie gebruikt de grond binnen de looptijd van het operationeel programma voor realisatie van
      de investering waarvoor de grond is aangekocht.


