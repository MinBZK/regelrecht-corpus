  - number: '122'
    text: |-
      Uitgaven voor middelen voor biologische of geïntegreerde gewasbescherming en het voorkomen van ziekten en plagen
      zijn subsidiabel indien het uitgaven betreft voor:

      a. macrobiologische bestrijders en aaltjes, die zijn toegelaten op grond van de Regeling natuurbescherming;

      b. microbiologische bestrijders die zijn toegelaten op grond van de
      [Wet gewasbeschermingsmiddelen en biociden][ref1];

      c. overige gewasbeschermingsmiddelen van natuurlijke oorsprong die zijn toegelaten op grond van de
      [Wet gewasbeschermingsmiddelen en biociden][ref2];

      d. middelen voor feromoonverwarring die zijn toegelaten op grond van de
      [Wet gewasbeschermingsmiddelen en biociden][ref3];

      e. feromonen als lokstof in vallen of op rollertraps en vangplaten;

      f. vangplaten en rollertraps;

      g. kalkmelk voor de fruitteelt;

      h. organismen, voeding en middelen voor dosering ter ondersteuning van biologische gewasbescherming, en

      i. bakken om eitjes, poppen of larven van fruitvliegen te doden.


      [ref1]: https://wetten.overheid.nl/BWBR0021670
      [ref2]: https://wetten.overheid.nl/BWBR0021670
      [ref3]: https://wetten.overheid.nl/BWBR0021670
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel122
    references:
