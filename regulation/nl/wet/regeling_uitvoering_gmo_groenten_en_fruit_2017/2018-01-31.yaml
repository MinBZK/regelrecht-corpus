  - number: '51'
    text: |-
      1 De informatie over de voorgestelde maatregelen, bedoeld in artikel 4, eerste lid, onderdeel c, van [verordening
      2017/892](32792R2017), bevat per strategisch doel de volgende onderdelen:

      a. de meetbare streefdoelen die de producentenorganisatie in het kader van het strategisch doel beoogt te
      realiseren;

      b. een onderbouwing van de gekozen en niet gekozen meetbare streefdoelen van de producentenorganisatie aan de hand
      van de SWOT analyse, bedoeld in [artikel 49][ref1];

      c. per meetbaar streefdoel van de producentenorganisatie:

      1°. een meetbare en controleerbare nulsituatie, voor zover mogelijk gebaseerd op de gemeenschappelijke
      uitgangsindicatoren, bedoeld in bijlage II van [verordening 2017/892](32792R2017);

      2°. de percentages of cijfers, voor zover mogelijk uitgedrukt in dezelfde eenheid als de gekwantificeerde
      streefcijfers, die de producentenorganisatie aan het eind van de looptijd van het operationele programma nastreeft;

      3°. alle projecten waarmee de realisatie van het streefdoel van de producentenorganisatie wordt nagestreefd;

      d. per project:

      1°. een omschrijving van het project;

      2°. een omschrijving en onderbouwing van de verwachte bijdrage, absoluut of relatief, van het project aan de
      realisatie van de meetbare streefdoelen van de producentenorganisatie,

      3°. een onderbouwing van het vernieuwende karakter van het project, en

      4°. de subsidiabele activiteiten die in het kader van project worden ingezet om de meetbare streefdoelen van de
      producentenorganisatie te realiseren;

      e. per subsidiabele activiteit:

      1°. een omschrijving van de activiteit;

      2°. een omschrijving en onderbouwing van de verwachte bijdrage, absoluut of relatief, van de activiteit aan de
      realisatie van de meetbare streefdoelen van de producentenorganisatie;

      3°. een onderbouwing van de subsidiariteit van de activiteit en de bijbehorende uitgavenposten;

      4°. per uitvoeringsjaar van het operationeel programma een planning van werkzaamheden voor de activiteit, en

      5°. per uitvoeringsjaar van het operationeel programma een begroting voor de activiteit onderbouwd aan de hand van:

      i. minimaal drie kostenbegrotingen per uitgavenpost voor uitgavenposten die betrekking hebben op het eerste jaar
      van het operationeel programma, en

      ii. minimaal één kostenbegroting per uitgavenpost voor uitgavenposten die betrekking hebben op de volgende jaren
      van het operationeel programma

      2 De meetbare streefdoelen:

      a. sluiten geheel of gedeeltelijk aan bij de gekwantificeerde streefcijfers, en

      b. dragen bij aan de realisatie van de gekwantificeerde streefcijfers.

      3 Een project heeft een vernieuwend karakter als bedoeld in het eerste lid, onderdeel d, onder 3°, wanneer de
      producentenorganisatie kan aantonen dat zij gedurende de looptijd van het voorafgaande operationele programma geen
      planmatige of bewuste activiteiten heeft ondernomen op het gebied van het betreffende project.

      4 In afwijking van het eerste lid, onderdeel d, onder 3° geldt het vereiste dat een project een vernieuwend
      karakter moet hebben niet voor maatregelen als bedoeld in artikel 2, onderdeel f, onder vi en vii, van [verordening
      2017/891](32791R2017).

      5 Indien de meetbare streefdoelen, bedoeld in het eerste lid, moeten worden aangepast dient de
      producentenorganisatie of unie van producentenorganisaties voor het volgende jaar een verzoek tot wijziging van het
      operationeel programma als bedoeld in artikel 34, eerste lid, van [verordening 2017/891](32791R2017) in.

      6 De uitgavenposten die in het operationeel programma zijn opgenomen voor de jaren na het eerste jaar van het
      operationeel programma worden voor de desbetreffende jaren jaarlijks door middel van een verzoek tot wijziging
      van het operationeel programma, als bedoeld in artikel 34, eerste lid, van [verordening 2017/891](32791R2017),
      onderbouwd door middel van minimaal drie kostenbegrotingen per uitgavenpost.

      7 In afwijking van het eerste lid, onderdeel e, onder 5°, en het zesde lid, wordt een begroting voor een
      uitgavenpost voor een activiteit waarvan de uitgaven in een uitvoeringsjaar worden geraamd op minder dan € 25.000
      onderbouwd aan de hand van een enkele kostenbegroting.

      8 Indien een uitgavenpost voor een activiteit aantoonbaar niet door meer dan twee partijen kan worden uitgevoerd
      wordt een kostenbegroting, in afwijking van het eerste lid, onderdeel e, onder 5°, en het zesde lid, onderbouwd met
      de beschikbare kostenbegrotingen.

      9 Indien een begroting voor een activiteit wordt onderbouwd aan de hand van meerdere kostenbegrotingen wordt de
      keuze voor de in de begroting opgenomen kostenbegroting voldoende gemotiveerd.


      [ref1]: https://wetten.overheid.nl/BWBR0039769#Artikel49
