articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *aanvoerprognose:* opgave door een lid van een producentenorganisatie van de hoeveelheid en aard van de producten
      die het lid in een door de producentenorganisatie te bepalen tijdvak bij de producentenorganisatie verwacht aan
      te voeren;
        - *accountant:* accountant die is ingeschreven in het accountantsregister, bedoeld in
      [artikel 36, eerste lid, van de Wet op het Accountantsberoep][ref1];
        - *actiefonds:* actiefonds als bedoeld in artikel 32 van [verordening 1308/2013](32013R1308);
        - *activiteit:* actie als bedoeld in artikel 2, onderdeel g, van [verordening 2017/891](32791R2017) ter uitvoering
      van een project;
        - *areaalenquête:* inventarisatie van een door een lid van de producentenorganisatie beteeld areaal en de door dit
      lid geteelde producten;
        - *denatureren:* ongeschikt maken voor menselijke consumptie.
        - *duurzaam productiemiddel:* tastbaar activum als bedoeld in artikel 2, onderdeel h, van [verordening 2017/891]
      (32791R2017), dat is gefinancierd met behulp van het actiefonds;
        - *erkenningsaanvraag:* een verzoek als bedoeld in artikel 154, eerste lid, van [verordening 1308/2013]
      (32013R1308);
        - *erkenningsbesluit:* besluit van de minister op een verzoek als bedoeld in artikel 154, eerste lid, van
      [verordening 1308/2013](32013R1308);
        - *forfaitair standaardtarief:* vast of maximaal bedrag per eenheid dat wordt gebruikt om de te declareren bedragen
      vast te stellen;
        - *gedeeltelijke betaling:* gedeeltelijke betaling als bedoeld in artikel 12 van [verordening 2017/892]
      (32792R2017);
        - *gekwantificeerd streefcijfer:* gekwantificeerd streefcijfer als bedoeld in artikel 27, derde lid, van
      [verordening 2017/891](32791R2017);
        - *goederenlogistiek:* het verzamelen, ophalen, sorteren, opslaan, verpakken, transporteren en distribueren van
      het product;
        - *lid:* aangesloten producent als bedoeld in artikel 2, onderdeel b van [verordening 2017/891](32791R2017);
        - *meetbaar streefdoel:* meetbaar streefdoel als bedoeld in artikel 4, eerste lid, onderdeel b, van [verordening
      2017/892](32792R2017);
        - *minister:* Minister van Economische Zaken;
        - *nationaal kader:* nationaal kader als bedoeld in artikel 36, eerste lid, van [verordening 1308/2013]
      (32013R1308);
        - *nationale strategie:* nationale strategie als bedoeld in artikel 36, tweede lid, van [verordening 1308/2013]
      (32013R1308);
        - *niet-producerend lid:* lid van een producentenorganisatie dat meer dan één teeltseizoen geen producten teelt
      waarvoor de producentenorganisatie is erkend;
        - *operationeel programma:* programma, bedoeld in artikel 33 van [verordening 1308/2013](32013R1308);
        - *producentenorganisatie:* door de minister erkende producentenorganisatie als bedoeld in artikel 152 van
      [verordening 1308/2013](32013R1308);
        - *project:* samenhangend geheel van activiteiten die subsidiabel zijn gesteld in deze regeling ter uitvoering van
      een strategisch doel dat door een producentenorganisatie wordt nagestreefd met haar operationeel programma;
        - *richtlijn 2000/29:* [Richtlijn 2000/29/EG](32000L0029) van de Raad van 8 mei 2000 betreffende de beschermende
      maatregelen tegen het binnenbrengen en de verspreiding in de Gemeenschap van voor planten en voor plantaardige
      producten schadelijke organismen (PBEU 2000, L 169);
        - *richtlijn 2002/63:* [Richtlijn 2002/63/EG](32002L0063) van de Commissie van 11 juli 2002 houdende vaststelling
      van communautaire bemonsteringsmethoden voor de officiële controle op residuen van bestrijdingsmiddelen in en op
      producten van plantaardige en van dierlijke oorsprong en tot intrekking van [Richtlijn 79/700/EEG](31979L0700)(PBEU
      2002, L 187);
        - *steunaanvraag:* een aanvraag om subsidie als bedoeld in artikel 9, eerste lid, van [verordening 2017/892]
      (32792R2017);
        - *subsidie:* financiële steun van de Unie als bedoeld in artikel 34 van [verordening 1308/2013](32013R1308);
        - *stadium af producentenorganisatie:* moment waarop er een verkooptransactie plaatsvindt door of namens de
      producentenorganisatie met een derde partij of een minder dan 90 procent dochteronderneming;
        - *strategisch doel:* doelstelling als bedoeld in artikel 36, tweede lid, onderdeel c, van [verordening 1308/2013]
      (32013R1308) of een doel als bedoeld in artikel 4, eerste lid, onderdeel b, van [verordening 2017/892](32792R2017),
      dat een producentenorganisatie nastreeft met haar operationeel programma;
        - *SWOT analyse:* bedrijfskundig model dat intern de sterktes en zwaktes en in de omgeving de kansen en
      bedreigingen analyseert;
        - *tussentijdse wijziging:* een wijziging van het operationeel programma in de loop van het jaar als bedoeld in
      artikel 34, tweede lid, van [verordening 2017/891](32791R2017);
        - *uitvoeringsjaar:* jaar van uitvoering van een operationeel programma;
        - *unie van producentenorganisaties:* unie van erkende producentenorganisaties als bedoeld in artikel 156 van
      [verordening 1308/2013](32013R1308);
        - *verkoper:* natuurlijke of rechtspersoon die door een producentenorganisatie is belast met de verkoop van
      producten van de leden van de producentenorganisatie waarvoor de producentenorganisatie is erkend;
        - *verordening 834/2007:* [Verordening (EG) nr. 834/2007](32007R0834) van de Raad van 28 juni 2007 inzake de
      biologische productie en de etikettering van biologische producten en tot intrekking van [Verordening (EEG) nr.
      2092/91](31991R2092) (PBEU 2007, L 189);
        - *verordening 874/2009:* [Verordening (EG) nr. 874/2009](32009R0874) van de Commissie van 17 september 2009
      houdende uitvoeringsbepalingen van [Verordening (EG) nr. 2100/94](31994R2100) van de Raad wat betreft de procedures
      voor het Communautair Bureau voor plantenrassen (PBEU 2009, L 251);
        - *verordening 889/2008:* [Verordening (EG) nr. 889/2008](32008R0889) van de Commissie van 5 september 2008 tot
      vaststelling van bepalingen ter uitvoering van [Verordening (EG) nr. 834/2007](32007R0834) van de Raad inzake de
      biologische productie en de etikettering van biologische producten, wat de biologische productie, de etikettering
      en de controle betreft (PBEU 2008, L 250);
        - *verordening 2017/891:* gedelegeerde verordening (EU) 2017/891 van de Commissie van 13 maart 2017 tot aanvulling
      van Verordening (EU) nr. 1308/2013 van het Europees Parlement en de Raad wat betreft de sectoren groenten en fruit
      en verwerkte groenten en fruit en tot aanvulling van Verordening (EU) nr. 1306/2013 van het Europees Parlement en
      de Raad wat betreft de in deze sectoren toe te passen sancties en tot wijziging van Uitvoeringsverordening (EU) nr.
      543/2011 van de Commissie (PBEU 2017, L 138);
        - *verordening 2017/892:* uitvoeringsverordening (EU) 2017/892 van de Commissie van 13 maart 2017 tot vaststelling
      van voorschriften voor de toepassing van Verordening (EU) nr. 1308/2013 van het Europees Parlement en de Raad, wat
      betreft de sectoren groenten en fruit en verwerkte groenten en fruit (PBEU 2017, L 138);
        - *verordening 1857/2006:* [Verordening (EG) nr. 1857/2006](32006R1857) van de Commissie van 15 december 2006
      betreffende de toepassing van de artikelen 87 en 88 van het Verdrag op staatssteun voor kleine en middelgrote
      ondernemingen die landbouwproducten produceren, en tot wijziging van [Verordening (EG) nr. 70/2001](32001R0070)
      (PBEU 2006, L 358);
        - *verordening 1308/2013:* Verordening (EU) nr. 1308/2013 van het Europees Parlement en de Raad van 17 december
      2013 tot vaststelling van een gemeenschappelijke ordening van de markten voor landbouwproducten en tot intrekking
      van de [Verordeningen (EEG) nr. 922/72](31972R0922), [(EEG) nr. 234/79](31979R0234), [(EG) nr. 1037/2001]
      (32001R1037)en [(EG) nr. 1234/2007](32007R1234)van de Raad (PBEU 2013, L 347);
        - *verordening 2100/94:* [Verordening (EG) nr. 2100/94](31994R2100) van de Raad van 27 juli 1994 inzake het
      communautaire kwekersrecht (PBEU 1994, L 227);
        - *voorschotaanvraag:* aanvraag als bedoeld in artikel 35, eerste lid, van [verordening 2017/891](32791R2017);
        - *waarde afgezette productie:* de waarde van de afgezette productie van een producentenorganisatie als bedoeld in
      artikel 22 van [verordening 2017/891](32791R2017);


