  - number: '32'
    text: |-
      1 Alleen een erkende producentenorganisatie kan lid zijn van een unie van producentenorganisaties.

      2 Een unie van producentenorganisaties bestrijkt de totale groep van producten waarvoor zij is erkend.

      3 De minister kan ontheffing verlenen voor de in het tweede lid gestelde voorwaarde.

      4 Een unie van producentenorganisaties is verplicht een operationeel programma of een operationeel deelprogramma in
      te dienen en ten uitvoer te leggen.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel32
  - number: '33'
    text: |-
      De [artikelen 7][ref1],[17][ref2][18][ref3] en [22][ref4] zijn van overeenkomstige toepassing op unies van
      producentenorganisaties.


