  - number: '41'
    text: |-
      1 De producentenorganisatie kan voor de bepaling van de waarde van de afgezette productie van de
      producentenorganisatie in aanmerking nemen de waarde afgezette productie van leden die:

      a. gedurende de referentieperiode, bedoeld in [artikel 36][ref1], waren aangesloten bij een in een andere lidstaat
      erkende producentenorganisatie, en

      b. na de referentieperiode, bedoeld in [artikel 36][ref2], tot de producentenorganisatie zijn toegetreden, voor
      zover deze leden voldoen aan het vereiste van artikel 23, tweede lid, van [verordening 2017/891](32791R2017).

      2 De waarde afgezette productie van de in het eerste lid bedoelde leden wordt in aanmerking genomen bij het bepalen
      van de waarde afgezette productie van de producentenorganisatie indien:

      a. de producentenorganisatie waar de producent was aangesloten gedurende de referentieperiode, bedoeld in
      [artikel 36][ref3], de nieuwe producentenorganisatie een schriftelijke verklaring verstrekt over de waarde van de
      voor het individuele lid afgezette producten waarvoor het lid bij de nieuwe producentenorganisatie is aangesloten,
      of

      b. het lid een overzicht en controleverklaring of rapportage als bedoeld in
      [artikel 40, tweede lid, onderdeel b][ref4], verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0039769#Artikel36
