  - number: '40'
    text: |-
      1 De producentenorganisatie kan voor de bepaling van de waarde van de afgezette productie in aanmerking nemen de
      waarde van de afgezette productie van leden die:

      a. na de referentieperiode, bedoeld in [artikel36][ref1] tot de producentenorganisatie zijn toegetreden, voor zover
      deze leden voldoen aan het vereiste van artikel 23, tweede lid, van [verordening 2017/891](32791R2017) en

      b. gedurende de referentieperiode, bedoeld in [artikel 36][ref2],

      1°. niet waren aangesloten bij een erkende producentenorganisatie, of

      2°. waren aangesloten bij een producentenorganisatie waarvan de erkenning nadien is ingetrokken.

      2 De waarde van de afgezette productie van de leden, bedoeld in het eerste lid, wordt in aanmerking genomen bij de
      bepaling van de waarde afgezette productie van de producentenorganisatie indien het lid de producentenorganisatie:

      a. een overzicht verstrekt van de waarde van de afgezette productie van de producten waarvoor de producent bij de
      producentenorganisatie is aangesloten, en

      b. een controleverklaring of rapportage naar aanleiding van een COS 4400 onderzoek van een extern accountant
      overlegt waarin wordt bevestigd dat de waarde die is opgegeven in het overzicht, bedoeld in onderdeel a:

      1°. juist is;

      2°. gerealiseerd is door de verkoop van producten waarvoor de producentenorganisatie is erkend;

      3°. dat de betreffende producten voor eigen rekening en risico door de betreffende producent binnen het grondgebied
      van de Europese Unie zijn geproduceerd, en

      4°. geen BTW en transportkosten bevat.


      [ref1]: https://wetten.overheid.nl/BWBR0039769#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0039769#Artikel36
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel40
