    text: |-
      1 Uitgaven voor het enten van plantmateriaal met als doel het verminderen van het gebruik van chemische
      gewasbeschermingsmiddelen zijn subsidiabel.

      2 De onderverdeling van rassen in tariefgroepen vindt plaats op basis van het rassenregister van de Raad voor de
      Plantenrassen.

      3 De producentenorganisatie onderbouwt bij de indiening van de steunaanvraag de uitgaven, bedoeld in het eerste
      lid, met gebruikmaking van een door de minister beschikbaar gesteld middel.

      4 De producentenorganisatie beschikt over de afleverbonnen van het plantmateriaal, bedoeld in het eerste lid, en
      overlegt deze desgevraagd aan de minister.
