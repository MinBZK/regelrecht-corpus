  - number: '3'
    text: |-
      [Deel 2 tot en met 8][ref1] van deze regeling is van toepassing op de producten van de sector groenten en fruit,
      bedoeld in artikel 1, tweede lid, onderdeel i, van [verordening 1308/2013](32013R1308) en op dergelijke producten
      die uitsluitend zijn bestemd om te worden verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0039769
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0039769
  - number: '4'
    text: |-
      De rechtspersoonlijkheid van een producentenorganisatie als bedoeld in artikel 154, eerste lid, van [verordening
      1308/2013](32013R1308) blijkt uit:

      a. een in het handelsregister neergelegd authentiek afschrift van de oprichtingsakte van de producentenorganisatie,
      of

      b. een in het handelsregister van de Kamer van Koophandel neergelegd authentiek afschrift van de statuten van de
      producentenorganisatie, en

      c. een inschrijving bij het Handelsregister van de Kamer van Koophandel.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel4
  - number: '5'
    text: |-
      Van een producentenorganisatie kunnen lid zijn:

      a. een natuurlijk persoon;

      b. een rechtspersoon als bedoeld in [artikel 2 van Boek 3 van het Burgerlijk Wetboek][ref1] of een rechtspersoon
      naar buitenlands recht, of

      c. een in het Handelsregister van de Kamer van Koophandel ingeschreven maatschap, vennootschap onder firma of
      commanditaire vennootschap.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel2
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '2'
  - number: '6'
    text: |-
      1 Het minimumaantal leden en de minimale waarde afgezette productie, bedoeld in artikel 154, eerste lid, onderdeel
      b, van [verordening 1308/2013](32013R1308) bedraagt ongeacht of de producentenorganisatie een operationeel
      programma heeft:

      a. voor producentenorganisaties die zijn erkend voor 1 januari 2008 tenminste vijf leden, met een gezamenlijke
      waarde van de afgezette productie van €  00.000;

      b. voor producentenorganisaties die zijn erkend na 1 januari 2008 tenminste tien leden, met een gezamenlijke waarde
      van de afgezette productie van € 25.000.000.

      2 Rechtspersonen die eigendom zijn van één natuurlijke persoon of rechtspersoon worden bij de beoordeling van de
      erkenningsaanvraag gezamenlijk door de minister aangemerkt als één lid. Indien de minister in redelijkheid vermoedt
      dat een oneigenlijk aantal entiteiten, als bedoeld in artikel 5, wordt gecreëerd met het oog op het eerste lid of
      artikel 24, kan de minister deze entiteiten gezamenlijk aanmerken als één lid.

      3 Indien een lid van een producentenorganisatie een rechtspersoon is waarbij meerdere producenten zijn aangesloten,
      kan de minister besluiten deze producenten bij de beoordeling van de erkenningsaanvraag mee te tellen bij de
      bepaling van het aantal leden, bedoeld in het eerste lid.

      4 Producentenorganisaties houden een ledenlijst bij met gebruikmaking van een door de minister beschikbaar gesteld
      model.

      5 De referentieperiode voor het bepalen van de waarde van de afgezette productie, bedoeld in artikel 8, eerste lid,
      van [verordening 2017/891](32791R2017), is het kalenderjaar twee jaar vóór het jaar waarvoor de waarde afgezette
      productie wordt vastgesteld. De waarde van de afgezette productie wordt berekend op basis van de waarde van de
      afgezette productie tijdens de referentieperiode van de producenten die op 1 januari van het jaar waarin erkenning
      wordt gevraagd zijn aangesloten bij de producentenorganisatie.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel6
  - number: '7'
    text: |-
      1 Het lidmaatschap van een producentenorganisatie duurt minimaal één jaar en treedt in werking op een door het
      bestuur van de producentenorganisatie te bepalen tijdstip.

      2 Aspirant leden verzoeken de producentenorganisatie schriftelijk om lidmaatschap en verklaren in dit verzoek:

      a. de statuten van de producentenorganisatie na te leven;

      b. niet bij een andere erkende producentenorganisatie te zijn aangesloten voor het product waarvoor de
      producentenorganisatie is erkend, en

      c. geen product waarvoor de producentenorganisatie is erkend buiten de producentenorganisatie om te zullen
      afzetten, behoudens toestemming als bedoeld in artikel 12 van [verordening 2017/891](32791R2017).

      3 Een producentenorganisatie bepaalt in haar statuten dat het lidmaatschap kan worden opgezegd met ingang van 1
      januari met inachtneming van een opzegtermijn van tenminste drie maanden en ten hoogste zes maanden.

      4 De bevestiging van lidmaatschap en opzegging van lidmaatschap, alsmede de datum waarop het lidmaatschap en de
      opzegging in werking treedt, wordt door de producentenorganisatie schriftelijk aan het lid meegedeeld.

      5 Bepalingen omtrent de minimumduur, opzeggingsdata en inwerkingtreding van opzegging van het lidmaatschap zijn
      niet van toepassing in geval van:

      a. overlijden van het lid;

      b. faillissement van het lid;

      c. toepassing van het sanctiereglement van de producentenorganisatie inzake royement, en

      d. indien dit redelijkerwijs niet van het lid of coöperatie gevergd kan worden.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel7
  - number: '8'
    text: |-
      Een producentenorganisatie kan niet-producerende leden hebben, indien in de statuten van de producentenorganisatie
      wordt bepaald dat deze leden:

      a. reeds aangesloten waren bij de producentenorganisatie vóór zij gedurende meer dan één productieseizoen geen
      producten meer teelden waarvoor de producentenorganisatie is erkend;

      b. opgenomen worden in een afzonderlijke ledenadministratie, en

      c. niet mogen deelnemen aan de stemming van de algemene vergadering over besluiten inzake het actiefonds of het
      operationeel programma van de producentenorganisatie.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel8
  - number: '9'
    text: |-
      1 Producentenorganisaties tonen aan dat zij voldoen aan artikel 152, eerste lid, onderdeel b, van [verordening
      1308/2013](32013R1308) aan de hand van:

      a. de oprichtingsakte van de producentenorganisatie, en

      b. de notulen van de eerste vergadering of oprichtingsvergadering van de producentenorganisatie.

      2 Het eerste lid is niet van toepassing op producentenorganisaties die zijn erkend voor 1 januari 2008.

      3 De producentenorganisaties, bedoeld in het tweede lid, worden geacht te voldoen aan het vereiste van artikel 152,
      eerste lid, onderdeel b, van [verordening 1308/2013](32013R1308).
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel9
  - number: '10'
    text: |-
      Een lid van het bestuur of de Raad van Commissarissen van een producentenorganisatie of een functionaris van
      een producentenorganisatie die betrokken is bij het verkoopbeleid, is geen afnemer van producten waarvoor de
      producentenorganisatie is erkend is ingevolge artikel 152, eerste lid, van [verordening 1308/2013](32013R1308).
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel10
  - number: '11'
    text: |-
      1 Producentenorganisaties verbieden hun leden in hun statuten op grond van artikel 160 van [verordening 1308/2013]
      (32013R1308) om activiteiten te ontplooien die het vermoeden doen ontstaan dat de verkoop van het product waarvoor
      zij bij de producentenorganisatie zijn aangesloten niet uitsluitend via de producentenorganisatie verloopt.

      2 Producentenorganisaties nemen het in het eerste lid bedoelde verbod uiterlijk op 1 januari 2019 op in hun
      statuten.

      3 Het eerste lid is niet van toepassing op activiteiten met betrekking tot de verkoop op grond van artikel 12 van
      [verordening 2017/891](32791R2017).
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel11
  - number: '12'
    text: |-
      Producentenorganisaties bepalen op grond van artikel 152, eerste lid, onderdeel c, onder ii, van [verordening
      1308/2013](32013R1308) op welk moment leden hun product aan de producentenorganisatie ter verkoop aanbieden.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel12
  - number: '13'
    text: |-
      1 Producentenorganisaties verplichten in hun statuten hun leden op grond van artikel 152, eerste lid, onderdeel c,
      onder ii, van [verordening 1308/2013](32013R1308) om aan de producentenorganisatie:

      a. melding te doen van eigendomsbelangen in ondernemingen die door het lid geproduceerde producten verkopen, indien
      het lid voor deze producten is aangesloten bij de producentenorganisatie, en

      b. aan de hand van schriftelijke bewijsstukken aan te tonen dat binnen de in het eerste lid bedoelde ondernemingen
      is verzekerd dat het lid:

      1°. geen invloed kan uitoefenen op het vaststellen van de verkoopvoorwaarden door de ondernemingen van de producten
      waarvoor het lid bij de producentenorganisatie is aangesloten, en

      2°. geen invloed kan uitoefenen op besluiten aangaande commerciële relaties en het prijsbeleid van de
      ondernemingen.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel13
  - number: '14'
    text: |-
      1 Producentenorganisaties stellen in hun statuten voorschriften vast voor de controle op de naleving van hun
      statuten door hun leden.

      2 De in het eerste lid bedoelde voorschriften bevatten ten aanzien van de controle op de naleving door hun leden
      van artikel 160 van [verordening 1308/2013](32013R1308) voor de door de producentenorganisatie gedurende het jaar
      uit te voeren controles tenminste:

      a. een systematische vergelijking per producent van areaalenquêtes en aanvoerprognoses met de daadwerkelijk aan de
      producentenorganisatie geleverde hoeveelheden gedurende het kalenderjaar;

      b. een verificatie van de door de leden verstrekte areaalenquêtes en aanvoerprognoses door middel van bezoek door
      de producentenorganisatie aan de leden gedurende het jaar;

      c. een periodieke vergelijking van de aanvoerprognoses en de daadwerkelijke aanvoer met een door de
      producentenorganisatie, op basis van statistische normen of ervaringscijfers, vast te stellen normstelling per
      areaal;

      d. een registratie van de op basis van de onderdelen a tot en met c aangetroffen verschillen en de daarvoor door
      het lid gegeven verklaring, en

      e. een registratie van de door de producentenorganisatie getroffen acties naar aanleiding van op grond van
      onderdeel d onverklaarde verschillen.

      3 De in het eerste lid bedoelde voorschriften bevatten voor de door de producentenorganisatie na afloop van het
      kalenderjaar uit te voeren controles minimaal:

      a. een verplichting voor ieder lid om uiterlijk voor 1 mei na afloop van het kalenderjaar schriftelijk aan de
      producentenorganisatie te verklaren:

      1°. de hoeveelheid of waarde van het product die hij dat jaar geproduceerd heeft;

      2°. de hoeveelheid of waarde van het product die hij dat jaar bij derden heeft ingekocht;

      3°. de hoeveelheid of waarde van het product die hij dat jaar via de producentenorganisatie verkocht heeft;

      4°. de hoeveelheid of waarde van het product die hij dat jaar op grond van artikel 12 van [verordening 2017/891]
      (32791R2017) buiten de producentenorganisatie om verkocht heeft;

      5°. dat hij, uitgezonderd de verkoop op grond van artikel 12 van [verordening 2017/891](32791R2017), geen door
      hem geteelde producten waarvoor hij bij de producentenorganisatie is aangesloten buiten de producentenorganisatie
      verkocht heeft, en

      6°. dat hij bij verkoop op grond van artikel 12 van [verordening 2017/891](32791R2017) de daaraan door de
      producentenorganisatie gestelde voorwaarden heeft nageleefd;

      b. een vergelijking van informatie uit de in onderdeel a bedoelde verklaringen met de omzetgegevens van het lid;

      c. een onderzoek door de producentenorganisatie naar de, op basis van de op grond van onderdeel b uitvoerde
      vergelijking, geconstateerde verschillen tussen de eigen verklaringen en de omzetgegevens van het lid;

      d. een verplichting tot het instellen van een accountantsonderzoek naar op grond van onderdeel c onvoldoende
      verklaarde verschillen;

      e. een registratie van de uitkomsten van het in onderdeel d bedoelde accountantsonderzoek, en

      f. een registratie van de opvolging van de uitkomsten van het in onderdeel e bedoelde accountantsonderzoek door de
      producentenorganisatie, waaronder sanctionering van de betreffende leden.

      4 De in het eerste lid bedoelde voorschriften bevatten een verplichting voor de producentenorganisatie om de
      juistheid van in het derde lid, onderdeel a, bedoelde verklaring te laten onderzoeken door een accountant door
      middel van een COS 4400 onderzoek.

      5 Het in het vierde lid bedoelde onderzoek betreft:

      a. de leden die verzuimd hebben voor 1 juni na afloop van het kalenderjaar de in het derde lid, onderdeel a,
      bedoelde eigen verklaring te verstrekken;

      b. de leden waarbij door de producentenorganisatie of door controle-instanties in het jaar voorafgaand aan het
      controlejaar is vastgesteld dat zij artikel 160 van [verordening 1308/2013](32013R1308) niet hebben nageleefd;

      c. de leden waarbij door de producentenorganisatie in het voorafgaande kalenderjaar is vastgesteld dat verschillen
      tussen areaalgegevens en omzetgegevens onvoldoende konden worden verklaard, en

      d. minimaal 2 procent van de leden van de producentenorganisatie, met een minimum van één lid, die niet reeds op
      grond van onderdelen a tot en met c deel uit maken van het onderzoek.

      6 Indien de accountant bij meerdere leden in deze deelwaarneming afwijkende bevindingen constateert treft de
      producentenorganisatie afhankelijk van de aard van de afwijkingen passende maatregelen.

      7 De in het eerste lid bedoelde voorschriften bevatten een verplichting voor de producentenorganisatie om jaarlijks
      de betrouwbaarheid van het geheel aan maatregelen dat de producentenorganisatie neemt voor controle op de naleving
      door hun leden te evalueren, mede aan de hand van de uitkomsten van het in het vierde lid bedoelde onderzoek. Een
      verslag van de evaluatie wordt door de algemene vergadering besproken en geaccordeerd.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel14
  - number: '15'
    text: |-
      1 Producentenorganisaties stellen in hun statuten voorschriften vast voor sanctionering van niet naleving van hun
      statuten door hun leden die, behoudens gevallen van overmacht, tenminste bepalen dat:

      a. bij een eerste overtreding van de statutaire verplichtingen ter uitvoering van artikel 160 van [verordening
      1308/2013](32013R1308), artikel 12 van [verordening 2017/891](32791R2017) en de artikelen 11, 12, 13, en 14 het lid
      minimaal een schriftelijke waarschuwing krijgt;

      b. bij een tweede soortgelijke overtreding begaan binnen vijf jaar na het begaan van de eerste overtreding bedoeld
      in onderdeel a, minimaal een boete aan het lid wordt opgelegd en deze boete daadwerkelijk wordt geïncasseerd, en

      c. leden bij alle soortgelijke vervolgovertredingen begaan binnen vijf jaar na het begaan van de eerste overtreding
      bedoeld in onderdeel a, worden geroyeerd.

      2 Producentenorganisaties administreren alle geconstateerde overtredingen van hun statutaire verplichtingen en aan
      hun leden opgelegde sancties.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel15
  - number: '16'
    text: |-
      Producentenorganisaties beschikken op grond van artikel 7, onderdeel a, van [verordening 2017/891](32791R2017)
      tenminste over een deugdelijk en accuraat systeem van areaalenquêtes en aanvoerprognoses.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel16
  - number: '17'
    text: |-
      Producentenorganisaties, en voor zover van toepassing unies van producentenorganisaties, beschikken op grond
      van artikel 154, eerste lid, onderdeel c, van [verordening 1308/2013](32013R1308) tenminste over een volledige
      beschrijving van de interne organisatie en van de administratieve en interne beheersing van:

      a. de verkoop en prijsbepaling;

      b. de goederenlogistiek;

      c. de financiële administratie;

      d. de beoordeling van investeringen en uitgaven waarvoor subsidie wordt aangevraagd;

      e. het aannemen van nieuwe leden en het beëindigen van het lidmaatschap;

      f. het vergaren van informatie van de leden en de verwerking van mutaties daarin, waaronder de controle op de
      juistheid van de ledenlijst;

      g. de beoordeling van areaalenquêtes en aanvoerprognoses, waaronder de vergelijking met realisaties;

      h. de controle op naleving van artikel 160 van [verordening 1308/2013](32013R1308) door de leden waaronder het
      verlenen van toestemming als bedoeld in artikel 12 van [verordening 2017/891](32791R2017);

      i. het opleggen van sancties, en

      j. het uitbesteden van activiteiten als bedoeld in artikel 155 van [verordening 1308/2013](32013R1308).
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel17
  - number: '18'
    text: |-
      1 De producentenorganisatie beschikt op grond van artikel 154, eerste lid, onderdeel c, van [verordening 1308/2013]
      (32013R1308) over een redelijk niveau van vermogen en liquiditeit.

      2 Een negatief vermogen wordt door de producentenorganisatie, op grond van artikel 154, eerste lid, onderdeel c,
      van [verordening 1308/2013](32013R1308) binnen één kalenderjaar aangevuld.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel18
  - number: '19'
    text: |-
      1 De producentenorganisatie beschikt ten behoeve van het commercieel en budgettair beheer van haar activiteiten,
      bedoeld in artikel 153, tweede lid, onderdeel f, van [verordening 1308/2013](32013R1308), op grond van artikel 7
      van [verordening 2017/891](32791R2017) over een eigen, als zodanig kenbare, kantoorruimte die beschikt over een
      eigen opgang, welke niet door ruimtes van een afnemer of een lid van de producentenorganisatie leidt.

      2 De in het eerste lid bedoelde kantoorruimte is eigendom van de producentenorganisatie of wordt door de
      producentenorganisatie gehuurd.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel19
  - number: '20'
    text: |-
      1 Producentenorganisaties maken voor hun financieel administratieve werkzaamheden, waaronder het factureren naar
      afnemers en leden en het opstellen van budgetten, gebruik van eigen personeel.

      2 De in het eerste lid bedoelde verplichting geldt niet voor het opstellen van jaarrekeningen en fiscale zaken.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel20
  - number: '21'
    text: |-
      1 Producentenorganisaties, dan wel dochterondernemingen of unies van producentenorganisaties indien de afzet
      door hen wordt verricht, tonen op grond van artikel 11 van [verordening 2017/891](32791R2017) aan de hand van
      schriftelijke bewijsstukken aan dat zij de verkoopvoorwaarden, en meer in het bijzonder de verkoopprijzen, voor
      de producten van de leden van de producentenorganisatie waarvoor de producentenorganisatie is erkend daadwerkelijk
      bepalen.

      2 De in het eerste lid bedoelde schriftelijke bewijsstukken tonen aan:

      a. welke verkoper er binnen de producentenorganisatie, dochteronderneming of unie van producentenorganisaties
      of door de producentenorganisatie belast is met de verkoop van de producten van de leden waarvoor de
      producentenorganisatie is erkend;

      b. wat de taak of opdracht van de in onderdeel a bedoelde verkoper is;

      c. op welke wijze de in onderdeel a bedoelde verkoper door de producentenorganisatie, dochteronderneming of unie
      van producentenorganisaties wordt aangestuurd;

      d. welke aanwijzingen de in onderdeel a bedoelde verkoper van de producentenorganisatie, dochteronderneming of unie
      van producentenorganisaties gekregen heeft voor het voeren van onderhandelingen over de verkoopvoorwaarden;

      e. op welke wijze de in onderdeel a bedoelde verkoper achteraf verantwoording aflegt aan de producentenorganisatie,
      dochteronderneming of unie van producentenorganisaties over de gerealiseerde verkoopvoorwaarden, en

      f. dat de in onderdeel e bedoelde verantwoording daadwerkelijk wordt afgelegd.

      3 De producentenorganisatie legt haar afzetbeleid vast in een besluit van het bestuur dat door de algemene
      vergadering wordt goedgekeurd.

      4 De producentenorganisatie, dochteronderneming of unie van producentenorganisaties bepaalt op welke locatie of
      welke locaties het aanbod van de producten van haar leden fysiek geconcentreerd wordt.

      5 Het afzetbeleid van de producentenorganisatie wordt jaarlijks door haar bestuur geëvalueerd en deze evaluatie
      wordt jaarlijks door de algemene vergadering van de producentenorganisatie besproken en geaccordeerd.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel21
  - number: '22'
    text: |-
      1 Artikel 155 van [verordening 1308/2013](32013R1308) is van toepassing op de activiteiten van de
      producentenorganisatie die bijdragen aan het realiseren van de doelstellingen van de producentenorganisatie,
      bedoeld in de artikelen 152 en 154 van [verordening 1308/2013](32013R1308).

      2 Wanneer een producentenorganisatie de in het eerste lid bedoelde activiteiten heeft uitbesteed toont de
      producentenorganisatie op grond van artikel 155 van [verordening 1308/2013](32013R1308) door middel van door het
      bestuur en de algemene vergadering geaccordeerde schriftelijke bewijsstukken aan:

      a. welke activiteiten worden uitbesteed;

      b. waarom deze activiteiten niet door de producentenorganisatie zelf worden uitgevoerd;

      c. aan wie deze activiteiten worden uitbesteed;

      d. waarom tot de keuze voor uitbesteding aan de in onderdeel c bedoelde entiteit is gekomen, en

      e. welke afspraken er met de in onderdeel c bedoelde entiteit zijn gemaakt.

      3 De producentenorganisatie toont op grond van artikel 13, tweede lid, van [verordening 2017/891](32791R2017) aan
      de hand van schriftelijke bewijsstukken aan op welke wijze de in het tweede lid, onderdeel c, bedoelde entiteit:

      a. door de producentenorganisatie wordt aangestuurd bij de uitvoering van de aan haar uitbestede activiteiten, en

      b. verantwoording aflegt aan de producentenorganisatie over de uitvoering van de aan haar uitbestede activiteiten.

      4 Wanneer een producentenorganisatie verkoopactiviteiten uitbesteedt, toont zij aan de hand van schriftelijke
      bewijsstukken aan dat zij gedurende de verkoopperiode minimaal één maal per week met de in het tweede lid,
      onderdeel c, bedoelde entiteit overlegt over de te hanteren verkoopvoorwaarden, waaronder de verkoopprijs.

      5 De keuze voor uitbesteding wordt jaarlijks per geval door het bestuur van de producentenorganisatie geëvalueerd
      en een verslag van deze evaluatie wordt jaarlijks door de algemene vergadering besproken en geaccordeerd.

      6 Activiteiten van de producentenorganisatie die niet worden uitbesteed aan haar leden zijn:

      a. verkoop van de producten van haar leden waarvoor de producentenorganisatie is erkend;

      b. commercieel en budgettair beheer.

      7 Activiteiten van de producentenorganisatie die niet worden uitbesteed zijn:

      a. controle op de naleving van de statuten, met uitzondering van accountantsonderzoek;

      b. boekhouding, facturering en uitbetaling aan de leden;

      c. kennis van productie van de leden.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel22
  - number: '23'
    text: |-
      Producentenorganisaties nemen in hun statuten op dat zij alle in artikel 152, eerste lid, onderdeel c, onder i, ii
      en iii, van [verordening 1308/2013](32013R1308) genoemde doelstellingen nastreven en tonen aan dat zij uitvoering
      geven aan deze doelstellingen.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel23
  - number: '24'
    text: |-
      1 Ongeacht de rechtsvorm van een producentenorganisatie bepalen de statuten van een producentenorganisatie op grond
      van artikel 153, tweede lid, onderdeel c, van [verordening 1308/2013](32013R1308) dat:

      a. bij een producentenorganisatie met 10 leden of meer een lid maximaal 10 procent van de stemmen van een
      voltallige algemene vergadering van de producentenorganisatie heeft, en

      b. bij een producentenorganisatie met minder dan 10 leden een lid maximaal 20 procent van de stemmen van een
      voltallige algemene vergadering van de producentenorganisatie heeft.

      2 De percentages genoemd in het eerste lid omvatten tevens volmachten.

      3 Indien een natuurlijk persoon, afgezien van volmachten, bevoegd is om te stemmen voor meerdere leden, geldt het
      in het eerste lid genoemde maximum percentage van de stemmen voor deze rechtspersonen gezamenlijk.

      4 In geval van een rechtsvorm met aandeelhouders, bepalen de statuten van een producentenorganisatie dat een
      natuurlijke persoon of rechtspersoon maximaal 10% van de aandelen van de producentenorganisatie heeft.

      5 De statuten van een unie van producentenorganisaties bepalen:

      a. ongeacht de rechtsvorm van de unie van de producentenorganisatie, dat een lid maximaal 50% van de stemmen van
      een voltallige algemene vergadering van de unie van producentenorganisaties heeft, en

      b. in geval van een rechtsvorm met aandeelhouders, dat een natuurlijke persoon of rechtspersoon maximaal 50% van de
      aandelen van de unie van producentenorganisaties heeft.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel24
  - number: '25'
    text: |-
      1 Een producentenorganisatie kan haar leden slechts toestemming als bedoeld in artikel 12 van [verordening
      2017/891](32791R2017) verlenen indien deze mogelijkheid in haar statuten is opgenomen.

      2 Indien een producentenorganisatie haar leden toestaat gebruik te maken van de uitzondering, bedoeld in artikel 12
      van [verordening 2017/891](32791R2017), stelt de producentenorganisatie voorschriften vast inzake:

      a. de procedure voor verlening van de toestemming;

      b. de algemene voorwaarden voor verlening van de toestemming, bedoeld in artikel 12 van [verordening 2017/891]
      (32791R2017), en

      c. de rapportageverplichtingen bij het gebruik van de toestemming.

      3 Een producentenorganisatie verleent toestemming als bedoeld in het eerste lid jaarlijks schriftelijk en per
      individueel geval voordat gebruik wordt gemaakt van de uitzondering, bedoeld in artikel 12 van [verordening
      2017/891](32791R2017).

      4 Indien een producentenorganisatie aan een toestemming als bedoeld in het eerste lid specifieke voorwaarden
      verbindt, worden deze voorwaarden in de toestemming vermeld.

      5 Een marginaal deel van het volume van de verhandelbare productie, bedoeld in artikel 12, eerste lid, onderdeel b,
      van [verordening 2017/891](32791R2017), bedraagt maximaal 5 procent van het volume van de verhandelbare productie
      van de producentenorganisatie.

      6 Producten die normaliter niet onder de handelsactiviteiten van de producentenorganisatie vallen, bedoeld in
      artikel 12, eerste lid, onderdeel c, van [verordening 2017/891](32791R2017), zijn:

      a. producten die niet onder het gebruikelijke productassortiment van de producentenorganisatie vallen, terwijl deze
      producten wel onderwerp zijn van de erkenning, of

      b. producten welke gewoonlijk wel door de producentenorganisatie worden verkocht, maar door teeltmethode of
      variëteit afwijken van het gangbare productenpakket.

      7 Een producentenorganisatie kan in een situatie, bedoeld in artikel 12, eerste lid, onderdeel c, van [verordening
      2017/891](32791R2017), een lid toestaan om maximaal 40%, qua volume of qua waarde, van de productie buiten de
      producentenorganisatie om af te zetten, zoals bedoeld in artikel 12, tweede lid, van [verordening 2017/891]
      (32791R2017), indien:

      a. dat lid producten teelt onder licentie van een andere producentenorganisatie;

      b. de verkooprechten met betrekking tot die producten exclusief bij die andere producentenorganisatie liggen, en

      c. de producten waarop de toestemming betrekking heeft uitsluitend via die andere producentenorganisatie worden
      afgezet.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel25
  - number: '26'
    text: |-
      Een erkenning als bedoeld in artikel 154, eerste lid, van [verordening 1308/2013](32013R1308) wordt verleend indien
      de aanvrager kan aantonen dat hij voldoet aan de op grond van de artikelen 152, 153, 154 en 155 van [verordening
      1308/2013](32013R1308) en titel 1van deze afdeling gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel26
  - number: '27'
    text: |-
      1 Een verzoek om erkenning omvat ter uitvoering van artikel 154, vierde lid, van [verordening 1308/2013]
      (32013R1308) de volgende stukken:

      a. de oprichtingsakte en statuten;

      b. het huishoudelijk reglement;

      c. een uittreksel uit het handelsregister van de Kamer van Koophandel;

      d. notulen van de oprichtingsvergadering;

      e. het meerjarenplan;

      f. de bestuursnotitie omtrent de afzet en aanbodbundeling;

      g. de bestuursnotitie omtrent de uitbesteding van activiteiten;

      h. de ledenlijst;

      i. indien aanwezig de jaarrekeningen van de producentenorganisatie over de afgelopen drie boekjaren;

      j. de beschrijving van de administratieve organisatie en interne beheersing, bedoeld in artikel 17;

      k. de beschrijving van de samenstelling van het bestuur;

      l. de procuratieregeling;

      m. het autorisatieschema;

      n. een organogram;

      o. de bevoegdhedenmatrix en parafenlijst;

      p. een beschrijving van de ondernemingsstructuur en dochterondernemingen, en

      q. een beschrijving van de goederenlogistiek.

      2 Indien dit nodig is voor de beoordeling van het verzoek om erkenning, bedoeld in artikel 154, vierde lid,
      van [verordening 1308/2013](32013R1308) kan de minister de producentenorganisatie verzoeken om aanvullende
      schriftelijke bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel27
  - number: '28'
    text: |-
      Indien de minister op grond van artikel 27, tweede lid, aanvullende bewijsstukken opvraagt wordt de in artikel 154,
      vierde lid, van [verordening 1308/2013](32013R1308) bedoelde termijn opgeschort tot de op grond van artikel 27,
      tweede lid, verzochte aanvullende bewijsstukken door de producentenorganisatie aan de minister zijn overlegd.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel28
  - number: '29'
    text: |-
      1 Een erkenning kan op verzoek van de producentenorganisatie worden gewijzigd of beëindigd met ingang van 1
      januari.

      2 De producentenorganisatie dient een verzoek tot wijziging van de erkenning in uiterlijk op 1 september
      voorafgaand aan het jaar met ingang waarvan wijziging van de erkenning wordt gevraagd.

      3 De producentenorganisatie dient een verzoek tot beëindiging van de erkenning in uiterlijk op 1 december
      voorafgaand aan het jaar met ingang waarvan beëindiging van de erkenning wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel29
  - number: '30'
    text: |-
      De producentenorganisatie informeert de minister onverwijld over:

      a. wijzigingen in hun statuten;

      b. wijzigingen in hun organisatiestructuur, en

      c. voornemens tot fusie of samenwerking.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel30
  - number: '31'
    text: |-
      1 De producentenorganisatie overlegt jaarlijks voor 1 maart de volgende stukken aan de minister:

      a. een uittreksel uit het handelsregister van de Kamer van Koophandel;

      b. de verslagen van de in het afgelopen boekjaar gehouden algemene vergaderingen;

      c. een beschrijving van het afzetbeleid en de evaluatie, bedoeld in [artikel 21, vijfde lid][ref1];

      d. het verslag van de evaluatie, bedoeld in [artikel 14, zevende lid][ref2];

      e. het verslag van de evaluatie, bedoeld in [artikel 22, vijfde lid][ref3], en

      f. de jaarrekening over het afgelopen boekjaar, voorzien van een controleverklaring van een extern accountant.

      2 Een producentenorganisatie die geen steunaanvraag indient bij de minister, overlegt ter uitvoering van artikel
      21, eerste lid, van [verordening 2017/892](32792R2017) jaarlijks voor 1 maart aan de minister:

      a. een digitale ledenlijst per 1 januari van het lopende jaar, met gebruikmaking van een door de minister
      beschikbaar gesteld middel;

      b. een overzicht van de leden die gedurende het vorige jaar zijn uitgetreden, onder vermelding van de datum van
      uittreding, met gebruikmaking van een door de minister beschikbaar gesteld middel, en

      c. een parafenlijst van tekenbevoegde personen binnen de producentenorganisatie.

      3 De producentenorganisatie overlegt, indien de statuten of de huishoudelijke reglementen van de
      producentenorganisatie gedurende een kalenderjaar gewijzigd zijn, voor 1 maart van het kalenderjaar volgend
      op het jaar waarin de wijziging heeft plaatsgevonden aan de minister de gewijzigde statuten of de gewijzigde
      huishoudelijke reglementen van de producentenorganisatie.

      4 De producentenorganisatie rapporteert jaarlijks uiterlijk op 1 juni van het eerste jaar na het jaar waarop de
      controles, bedoeld in [artikel 14, derde lid][ref4], betrekking hebben, aan de minister:

      a. de namen van bij de producentenorganisatie aangesloten leden die weigeren om de in
      [artikel 14, derde lid, onderdeel a][ref5], bedoelde verklaring te overleggen;

      b. de namen van bij de producentenorganisatie uitgetreden leden die weigeren om de verklaring,
      [bedoeld in artikel 14, derde lid, onderdeel a][ref6], te overleggen;

      c. de voorlopige bevindingen van de producentenorganisatie over de naleving van artikel 160 van [verordening
      1308/2013](32013R1308) door haar leden, en

      d. de door de producentenorganisatie opgelegde sancties wegens niet naleving van artikel 160 van [verordening
      1308/2013](32013R1308) door haar leden.

      5 De producentenorganisatie rapporteert jaarlijks uiterlijk op 1 april van het tweede jaar na het jaar waarop het
      in [artikel 14, vierde lid][ref7], bedoelde onderzoek betrekking heeft aan de minister:

      a. de aantallen producenten per productgroep die aan een onderzoek door een accountant als bedoeld in
      [artikel 14, vierde lid][ref8], zijn onderworpen, alsmede hun afzonderlijke omzetcijfers;

      b. de door de accountant op grond van het in [artikel 14, vierde lid][ref9], bedoelde onderzoek gerapporteerde
      afwijkende bevindingen, en

      c. de door de producentenorganisatie naar aanleiding van de in onderdeel b bedoelde afwijkende bevindingen
      getroffen of te treffen corrigerende maatregelen.

      6 De producentenorganisatie overlegt jaarlijks uiterlijk op 1 juni, met gebruikmaking van een door de minister
      beschikbaar gesteld middel, aan de minister een samenvattend overzicht van:

      a. de door de leden op grond van [artikel 14, derde lid, onderdeel a, onder 1° tot en met 4°][ref10], aan de
      producentenorganisatie verstrekte informatie;

      b. het areaal van de leden van de producentenorganisatie;

      c. de door de leden van de producentenorganisatie geteelde gewassen;

      d. de hoeveelheden product waarvoor aan de leden een toestemming op grond van artikel 12 van [verordening 2017/891]
      (32791R2017) is verleend, en

      e. de omzet van de producentenorganisatie.


