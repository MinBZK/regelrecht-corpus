    text: |-
      Ter uitvoering van artikel 27, vijfde lid, van [verordening 2017/891](32791R2017) betreffen de uitgaven van de
      uitvoering van het operationeel programma per project als bedoeld in [artikel 51, eerste lid, onderdeel d][ref1],
      maximaal 50 procent van het totale operationele programma.


