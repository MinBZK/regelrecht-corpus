  - number: '57'
    text: |-
      1 Wijzigingen van de begroting voor activiteiten opgenomen in een goedgekeurd operationeel programma met minder
      dan 20% en het vervallen van activiteiten opgenomen in een goedgekeurd operationeel programma worden door de
      producentenorganisatie gemeld aan de minister op de data bedoeld in [artikel 56, zesde lid][ref1].

      2 In afwijking van het eerste lid wordt een wijziging van de begroting als bedoeld in het eerste lid die ontstaat
      na 31 oktober van een uitvoeringsjaar aan de minister gemeld in de steunaanvraag, bedoeld in artikel 9, eerste lid,
      van [verordening 2017/892](32792R2017), voor het betreffende uitvoeringsjaar.

      3 Een wijziging van de begroting voor een activiteit opgenomen in een goedgekeurd operationeel programma met
      minder dan 20% als bedoeld in het eerste lid wordt door de producentenorganisatie onderbouwd aan de hand van
      kostenbegrotingen.


