  - number: '76'
    text: |-
      1 Duurzame productiemiddelen, met uitzondering van duurzame onroerende productiemiddelen zijnde bomen en meerjarige
      planten, zijn eigendom van de producentenorganisatie, unie van productenorganisaties of een dochteronderneming die
      voor minimaal 90% eigendom is van een of meer producentenorganisaties of unies van producentenorganisaties.

      2 Duurzame productiemiddelen die worden gefinancierd door meerdere erkende producentenorganisaties of unies
      van producentenorganisaties zijn subsidiabel naar rato van het aandeel in de financiering van elk van die
      producentenorganisaties of unies van producentenorganisaties.

      3 Kosten als bedoeld in [artikel 101, derde lid, van Boek 5 van het Burgerlijk Wetboek][ref1] voor het vestigen van
      een recht van opstal zijn niet subsidiabel.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel101
