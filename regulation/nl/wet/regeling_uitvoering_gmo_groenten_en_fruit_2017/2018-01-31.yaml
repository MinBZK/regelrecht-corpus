    text: |-
      De minister stelt de door de lidstaten vast te stellen maximale steunbedragen, bedoeld in artikel 45, eerste lid,
      van [verordening 2017/891](32791R2017) vast.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel187
  - number: '188'
    text: |-
      1 Als erkende liefdadigheidsinstellingen of -organisaties als bedoeld in artikel 34, vierde lid,
      onderdeel a, van [verordening 1308/2013](32013R1308) worden aangewezen voedselbanken die op grond van
      [artikel 5b, eerste lid, van de Algemene wet inzake rijksbelastingen][ref1] zijn aangemerkt als algemeen nut
      beogende instelling.

      2 Als personen die op grond van de nationale wetgeving recht hebben op overheidsbijstand, met name omdat zij over
      onvoldoende middelen beschikken om in hun onderhoud te voorzien als bedoeld in artikel 34, vierde lid, onderdeel a,
      van [verordening 1308/2013](32013R1308) worden aangemerkt:

      a. personen die op grond van [artikel 11, eerste lid, van de Wet werk en bijstand][ref2] recht hebben op een
      overheidsuitkering, en

      b. andere personen die ten genoegen van de voedselbanken kunnen aantonen niet over voldoende middelen te beschikken
      om in hun onderhoud te voorzien.

      3 Het overnamecertificaat, bedoeld in artikel 47, eerste lid, onderdeel d, van [verordening 2017/891](32791R2017)
      wordt getekend door:

      a. het regionale distributiecentrum, in het geval de uit de markt genomen producten geleverd worden aan een
      regionale distributiecentrum voor voedselbanken, en

      b. de voedselbank, in het geval de uit de markt genomen producten geleverd worden aan de voedselbank die de uit de
      markt genomen producten daadwerkelijk uitreikt aan de eindontvangers.

      4 Indien een voedselbank van haar aanvragers een symbolische bijdrage vraagt voor de voedselpakketten vraagt de
      voedselbank hiervoor vooraf toestemming aan onze minister en houdt zij hiervoor een financiële boekhouding bij.

      5 Indien een voedselbank de op grond van deze regeling ontvangen producten verwerkt of laat verwerken toont de
      voedselbank aan dat de verwerkte producten volledig ten goede komen aan de personen bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel5b
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel11
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel188
