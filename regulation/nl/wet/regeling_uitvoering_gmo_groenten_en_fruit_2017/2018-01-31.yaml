  - number: '56'
    text: |-
      1 Een wijziging van een operationeel programma gedurende het jaar, als bedoeld in artikel 34, tweede lid, van
      [verordening 2017/891](32791R2017), betreft de toekomst en kan betrekking hebben op:

      a. het toevoegen van nieuwe uitgavenposten aan bestaande activiteiten of van nieuwe activiteiten aan bestaande
      projecten opgenomen in een goedgekeurd operationeel programma, indien deze toevoeging voorafgaand aan het
      uitvoeringsjaar niet voorzienbaar was;

      b. een wijziging van de begroting voor een uitgavenpost voor een activiteit opgenomen in een goedgekeurd
      operationeel programma met meer dan 20%;

      c. het verhogen van het jaarbedrag van het actiefonds met maximaal 25%;

      d. het verlagen van het jaarbedrag van het actiefonds met maximaal 80%, en

      e. het toevoegen van andere soorten financiële bijdragen aan het actiefonds dan oorspronkelijk goedgekeurd.

      2 De producentenorganisatie geeft ten aanzien van wijzigingen als bedoeld in het eerste lid, gemotiveerd aan:

      a. hoe het begrote bedrag tot stand gekomen is;

      b. waarom het noodzakelijk is dat deze wijziging gedurende het jaar gedaan wordt, en

      c. wat de gevolgen van deze wijziging zijn voor de uitvoering van het operationeel programma.

      3 In aanvulling op het tweede lid geeft de producenteorganisatie ten aanzien van wijzigingen als bedoeld in het
      eerste lid, onderdeel a, gemotiveerd aan:

      a. waarom deze activiteit of uitgavenpost subsidiabel is;

      b. waarom deze wijziging niet voorzienbaar was, en

      c. indien het een nieuwe activiteit betreft, welk strategisch doel deze activiteit ondersteunt.

      4 Op een wijziging als bedoeld in het eerste lid, onderdeel a, is
      [artikel 51, eerste lid, onderdeel e, subonderdeel 5][ref1], alsmede zevende tot en met negende lid, van
      overeenkomstige toepassing.

      5 Ten aanzien van de wijzigingen, bedoeld in het eerste lid, onderdelen c en d, wordt door de
      producentenorganisatie aangetoond dat de wijziging geen afbreuk doet aan de strategische doelen en de meetbare
      streefdoelen van het operationele programma.

      6 De producentenorganisatie dient een verzoek tot wijziging als bedoeld in artikel 34, tweede lid, van [verordening
      2017/891](32791R2017) in op:

      a. 1 februari van het uitvoeringsjaar waar het verzoek tot wijziging betrekking op heeft;

      b. 1 mei van het uitvoeringsjaar waar het verzoek tot wijziging betrekking op heeft;

      c. 1 augustus van het uitvoeringsjaar waar het verzoek tot wijziging betrekking op heeft, of

      d. 31 oktober van het uitvoeringsjaar waar het verzoek tot wijziging betrekking op heeft.

      7 Het toevoegen van uitgavenposten of activiteiten als bedoeld in het eerste lid, onderdeel a, is slechts mogelijk
      indien de uitgavenpost of activiteit subsidiabel is op grond van [hoofdstuk 3][ref2] en [4][ref3] van dit deel.


      [ref1]: https://wetten.overheid.nl/BWBR0039769#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0039769#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0039769#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel56
