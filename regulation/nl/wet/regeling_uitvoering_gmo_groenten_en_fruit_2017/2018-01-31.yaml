  - number: '138'
    text: |-
      1 Uitgaven van de producentenorganisatie ten behoeve van ontwikkeling en verbetering van intrinsieke
      producteigenschappen of nieuwe producten zijn subsidiabel indien:

      a. het gaat om de aanschaf van:

      1°. bomen of meerjarig plantmateriaal ten behoeve van nieuwe markten of nieuwe productmarktcombinaties, of

      2°. kruisbestuivers die nodig zijn voor de aanplant van nieuw in het operationeel programma op te nemen bomen en
      meerjarige planten, en

      b. de producentenorganisatie door middel van contracten of andere schriftelijke bescheiden aantoont dat de bomen
      of meerjarig plantmateriaal gedurende de looptijd van het project slechts op een vooraf vastgestelde hoeveelheid
      areaal wordt geproduceerd.

      2 Uitgaven als bedoeld in het eerste lid, voor identieke investeringen zijn uitsluitend subsidiabel in geval van
      uitgaven gedaan binnen 4 jaar na de factuurdatum van de laatste factuur voor de eerste investering.

      3 Uitgaven voor de aankoop van meerjarig plantmateriaal en bomen, bedoeld in het eerste lid, onderdeel a, onder 1°,
      zijn evenwel slechts subsidiabel indien:

      a. er gedurende meerdere jaren van de bomen en planten geoogst wordt, en

      b. het gaat om de uitgaven voor de initiële aanplant.

      4 De producentenorganisatie overlegt voor de uitgaven, bedoeld in het eerste lid, jaarlijks bij de indiening van de
      steunaanvraag informatie over het desbetreffende product aan de minister met gebruikmaking van een door de minister
      beschikbaar gesteld middel.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel138
  - number: '139'
    text: |-
      1 Uitgaven van de producentenorganisatie ten behoeve van het ontsluiten van nieuwe markten zijn subsidiabel, indien
      het gaat om op afzetverbetering gerichte investeringen in:

      a. sorteer- en verpakcentra:

      b. distributiecentra;

      c. verwerkingscentra;

      d. fustopslag;

      e. dockboards, of

      f. sorteer- en verpakkingslijnen.

      2 Uitgaven als bedoeld in het eerste lid zijn niet subsidiabel indien het gaat om:

      a. investeringen ter vervanging van oude centra als bedoeld in het eerste lid;

      b. standaard sorteer- en verpakkingslijnen op teeltbedrijven of op bestaande locaties van de
      producentenorganisatie, of

      c. met de sorteerlijn geïntegreerde aanvoerprognosesystemen.

      3 De producentenorganisatie overlegt jaarlijks bij de indiening van de steunaanvraag aan de minister een overzicht
      van de hoeveelheden product waarvan de productstroom gebundeld is met behulp van de investeringen bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel139
  - number: '140'
    text: |-
      1 Uitgaven van de producentenorganisatie voor investeringen ten behoeve van het vergroten van de afzetwaarde
      van producten door middel van het vergroten van de duurzaamheid van het product en van het productieproces zijn
      subsidiabel, indien het gaat om:

      a. één volledige investering in fertigatie in het kader van precisiebemestingtechnieken die bestemd is voor
      besparing en het gereguleerd doseren van water en meststoffen aan gewassen in vollegrondsfruitteelt;

      b. de besparing op het meststoffenverbruik door de producentenorganisatie is aangetoond, en

      c. de investering niet leidt tot een hoger watergebruik.

      2 Onder een investering in fertigatie als bedoeld in het eerste lid wordt verstaan:

      a. een waterafgiftesysteem op het perceel, waaronder de waterpomp, verdeelleidingen en druppelleidingen die niet
      uitsluitend worden gebruikt voor het geven van water;

      b. een regeleenheid;

      c. vochtmeetapparatuur;

      d. apparatuur voor het bepalen van het mineralengehalte en pH, of

      e. voorzieningen voor dosering en menging van meststoffen.

      3 Druppelleidingen als bedoeld in het tweede lid, onderdeel a, zijn uitsluitend subsidiabel bij initiële
      investeringen.

      4 Investeringen in een waterafgiftesysteem als bedoeld in het tweede lid, onderdeel a, zijn niet subsidiabel indien
      het investeringen betreft in:

      a. fertigatie in teeltsystemen los van de grond;

      b. aanleg van een waterbron, of

      c. afvoerleidingen naar het te fertigeren perceel.

      5 De producentenorganisatie overlegt bij de indiening van het operationeel programma aan de minister, met
      gebruikmaking van een door de minister beschikbaar gesteld middel, per lid een projectplan met projectbegroting,
      voorzien van bijbehorende offertes.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel140
  - number: '141'
    text: |-
      1 De producentenorganisatie overlegt bij de indiening van de steunaanvraag aan de minister, met gebruikmaking van
      een door de minister beschikbaar gesteld middel, voor de investering, bedoeld in [artikel 140][ref1], een opgave
      van de gerealiseerde besparing op het meststoffenverbruik en waterverbruik.

      2 De berekening van de gerealiseerde besparing op het meststoffenverbruik, gemeten in kilogrammen, als gevolg van
      een investering als bedoeld in [artikel 140][ref2], vindt plaats op basis van een vergelijking tussen:

      a. het mineralenverbruik, volgens de mineralenregistratie, van het jaar voorafgaand aan het jaar van
      inbedrijfstelling van de investering, en

      b. het mineralenverbruik, volgens de mineralenregistratie, gedurende het jaar:

      1°. van ingebruikname van de investering, of

      2°. volgend op het jaar van ingebruikname, in geval van inbedrijfstelling tijdens het teeltseizoen.

      3 Het vaststellen van veranderingen in het waterverbruik en meststoffenverbruik, gemeten in m3, als gevolg van een
      investering als bedoeld in [artikel 140, eerste lid][ref3], vindt plaats op basis van een vergelijking tussen:

      a. het waterverbruik en meststoffenverbruik van het jaar voorafgaand aan het jaar van inbedrijfstelling van de
      investering, en

      b. het waterverbruik en meststoffenverbruik gedurende het jaar:

      1°. van ingebruikname van de investering, of

      2°. volgend op het jaar van ingebruikname, in geval van inbedrijfstelling tijdens het teeltseizoen.


      [ref1]: https://wetten.overheid.nl/BWBR0039769#Artikel140
      [ref2]: https://wetten.overheid.nl/BWBR0039769#Artikel140
      [ref3]: https://wetten.overheid.nl/BWBR0039769#Artikel140
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel141
