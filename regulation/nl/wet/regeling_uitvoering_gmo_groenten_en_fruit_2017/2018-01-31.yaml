      - id: ref1
        bwb_id: BWBR0039769
        artikel: '47'
        hoofdstuk: 1*
      - id: ref2
        bwb_id: BWBR0039769
        artikel: '47'
        hoofdstuk: 1*
  - number: '99'
    text: |-
      Investeringen in duurzame productiemiddelen die op grond van deze afdeling subsidiabel zijn kunnen gedurende de
      bedrijfseconomische levensduur vervangen worden, indien er significante milieuvoordelen zijn.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel99
  - number: '100'
    text: |-
      1 Uitgaven voor investeringen in innovatieve en emissiebeperkende gewasbeschermingsapparatuur zijn subsidiabel
      indien deze investeringen tot doel hebben om het gebruik van chemische bestrijdingsmiddelen te verminderen of te
      voorkomen.

      2 Als innovatieve en emissiebeperkende gewasbeschermingsapparatuur wordt beschouwd:

      a. spuitapparatuur;

      b. UV-licht ter bestrijding van schimmelziekten;

      c. mechanische onkruidbestrijdingsapparatuur,

      d. GPS systemen in het kader van de precisielandbouwtechnieken, indien de inzet van GPS systemen leidt tot
      positieve effecten op het milieu of de kwaliteit van producten door aantoonbaar toepassen van:

      1°. precisie zaaien of planten;

      2°. precisietoediening van meststoffen en gewasbeschermingsmiddelen en

      3°. precisie mechanische onkruidbestrijding;

      e. apparatuur voor het elektrochemisch activeren van een zwakke oplossing van natriumchloride in onthard water in
      combinatie met een vernevelaar ter bestrijding van micro organismen, of

      f. apparatuur om looftrekdoeken te ontsmetten.

      3 Spuitleidingen en het transportsysteem voor het verplaatsen naar de volgende rij of afdeling van spuitrobots en
      UV belichtingswagens zijn niet subsidiabel.

      4 In geval van opgebouwde zelfrijdende landbouwspuitmachines is uitsluitend het spuitsysteem subsidiabel.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel100
  - number: '101'
    text: |-
      1 De producentenorganisatie onderbouwt de emissiebeperking, bedoeld in [artikel 100, eerste lid][ref1]:

      a. bij de indiening van het operationeel programma of voorafgaand aan de uitvoering van de investering aan de hand
      van bij het betreffende merk of type apparatuur uitgevoerd onafhankelijk onderzoek, en

      b. door bij de indiening van de steunaanvraag een jaarlijkse opgave van het totale gebruik aan werkzame stof in
      kilogram per hectare van het betrokken teeltbedrijf te overleggen waarbij de nulsituatie wordt weergegeven.

      2 In afwijking van het eerste lid, onderdeel a, kan de minister indien er geen onafhankelijk onderzoek beschikbaar
      is, bij de beoordeling van de steunaanvraag van een betrokken teeltbedrijf een meerjarige spuitregistratie opvragen
      ter vergelijking van:

      a. het gewasbeschermingsmiddelenverbruik in het jaar voorafgaand aan het jaar van inbedrijfstelling van de
      investering, en

      b. het gewasbeschermingsmiddelenverbruik gedurende het jaar:

      1°. van ingebruikname van de investering, of

      2°. volgend op het jaar van ingebruikname, in geval van inbedrijfstelling tijdens het teeltseizoen.

      3 De nulsituatie, bedoeld in het eerste lid, onderdeel b, is het gemiddelde gebruik aan werkzame stof in kilogram
      per hectare van het betrokken teeltbedrijf over 3 voorgaande jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0039769#Artikel100
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0039769
        artikel: '100'
        hoofdstuk: '4'
        afdeling: '2'
  - number: '102'
    text: |-
      Uitgaven voor hygiënesluizen en hygiënestations ter voorkoming van insleep van ziekten in kassen door medewerkers
      en bezoekers zijn subsidiabel indien de sluis de enige toegang vormt tot de te betreden ruimte onder quarantaine.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel102
  - number: '103'
    text: |-
      1 Uitgaven van de producentenorganisatie voor insectengaas bij vollegrondsteelten ter wering van insecten zijn
      subsidiabel.

      2 De uitgaven van de producentenorganisatie voor vliesdoek zijn niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel103
  - number: '104'
    text: |-
      1 Uitgaven voor investeringen in duurzame energie zijn subsidiabel indien:

      a. de specificatie van de investering een reductie van het energieverbruik uit fossiele brandstoffen of energie
      ingekocht op het net van minimaal 15% geeft, en

      b. het gaat om onder meer:

      1°. zonnepanelen;

      2°. zonnecollectoren, of

      3°. windmolens.

      2 In afwijking van het eerste lid kan de minister in uitzonderlijke gevallen een reductie van het energieverbruik
      uit fossiele brandstoffen of energie ingekocht op het net van minimaal 7% toestaan, indien de activiteit andere
      milieuvoordelen waarborgt.

      3 In geval van een investering in een installatie voor zonne-energie als bedoeld in het eerste lid, onderdelen a en
      b, zijn de kosten van de installatie zelf en het draagmateriaal subsidiabel.

      4 Uitgaven voor aanpassing aan het gebouw en een installatie voor zonne-energie op het dak van een nabijgelegen
      bedrijf van een derde zijn niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel104
  - number: '105'
    text: |-
      1 Uitgaven voor investeringen in warmte-krachtkoppeling installaties zijn subsidiabel indien de specificatie van
      de investering een reductie van het energieverbruik uit fossiele brandstoffen of energie ingekocht op het net van
      minimaal 15% geeft.

      2 In afwijking van het eerste lid kan de minister in uitzonderlijke gevallen een reductie van het energieverbruik
      uit fossiele brandstoffen of energie ingekocht op het net van minimaal 7% toestaan, indien de activiteit andere
      milieuvoordelen waarborgt.

      3 Uitgaven voor bouwkundige voorzieningen bij aanschaf van warmte-krachtkoppeling installaties zijn niet
      subsidiabel.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel105
  - number: '106'
    text: |-
      1 Uitgaven voor investeringen in aardwarmte zijn subsidiabel indien de specificatie van de investering een reductie
      van het energieverbruik uit fossiele brandstoffen of energie ingekocht op het net van minimaal 15% geeft.

      2 In afwijking van het eerste lid kan de minister in uitzonderlijke gevallen een reductie van het energieverbruik
      uit fossiele brandstoffen of energie ingekocht op het net van minimaal 7% toestaan, indien de activiteit andere
      milieuvoordelen waarborgt.

      3 Uitgaven voor investeringen voor aansluiting van het teeltbedrijf op een geothermische bron zijn subsidiabel.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel106
  - number: '107'
    text: |-
      1 Uitgaven voor investeringen in aanvullende meetapparatuur voor metingen in de kas ter voorkoming van schade aan
      gewassen is subsidiabel indien deze apparatuur extreem gevoelig is voor NO, NO, C2H4 en CO en waarden kleiner dan
      5.000 microgram per liter meet.

      2 De producentenorganisatie onderbouwt de emissie na rookgasreiniging:

      a. bij de indiening van het operationeel programma aan de hand van de specificatie van de leverancier vooraf, en

      b. bij de indiening van de steunaanvraag aan de hand van de metingen van de emissieconcentratie na
      ingebruikstelling.

      3 Uitgaven van de producentenorganisatie voor voorzieningen voor distributie en regeling van CO in de kas zijn
      niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel107
  - number: '108'
    text: |-
      1 Uitgaven voor investeringen in aansluitingen op een COnetwerk en aansluitingen voor CO-opslag, alsmede
      bijbehorende meetapparatuur voor de afvang van COvoor stookinstallaties zijn subsidiabel indien de afgevangen
      CO wordt aangewend voor dosering aan het gewas in de kassen van het betreffende teeltbedrijf of cluster van
      teeltbedrijven.

      2 Uitgaven van de producentenorganisatie voor voorzieningen voor distributie en regeling van CO in de kas zijn
      niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel108
  - number: '109'
    text: |-
      1 Uitgaven voor investeringen op bedrijven, anders dan glastuinbouwbedrijven, in warmtepompen, warmtewisselaars,
      warmte- en koudebuffering zijn subsidiabel indien de specificatie van de investering een reductie van het
      energieverbruik uit fossiele brandstoffen of energie ingekocht op het net van minimaal 15% geeft.

      2 In afwijking van het eerste lid kan de minister in uitzonderlijke gevallen een reductie van het energieverbruik
      uit fossiele brandstoffen of energie ingekocht op het net van minimaal 7% toestaan, indien de activiteit andere
      milieuvoordelen waarborgt.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel109
  - number: '110'
    text: |-
      1 Uitgaven voor investeringen in het kader van het programma ‘Kas als Energiebron’ of ‘Het nieuwe telen’ zijn
      subsidiabel indien:

      a. de specificatie van de investering een reductie van het energieverbruik uit fossiele brandstoffen of energie
      ingekocht op het net van minimaal 15% geeft;

      b. het gaat om installaties ten behoeve van semi-gesloten kassen die een combinatie vormen van:

      1°. buitenluchtaanzuiging in combinatie met een tweede beweegbaar energiescherm;

      2°. energiebesparend ventilatiesysteem met warmteterugwinning of voorverwarming;

      3°. luchtbehandelingsystemen ter ontvochtiging van lucht;

      4°. hogedrukvernevelingsysteem met een adiabatische koeling waarbij de druppelgrootte 5 tot maximaal 15 micron
      bedraagt;

      5°. warmtewisselingsysteem;

      6°. warmtepomp;

      7°. seizoensopslagsysteem voor warmte en koude;

      8°. warmtebuffertank;

      9°. tweede energiescherm, waarbij de energiebesparing met het doek dicht minimaal 45% bedraagt;

      10°. eerste energiescherm voor bedrijven met een verbruik van minder dan 25 Nm3 aardgasequivalent/m2, waarbij de
      energiebesparing met het doek dicht minimaal 35% bedraagt, of

      11°. gevelscherm, waarbij de energiebesparing met het scherm dicht minimaal 40% bedraagt.

      2 In afwijking van het eerste lid kan de minister in uitzonderlijke gevallen een reductie van het energieverbruik
      uit fossiele brandstoffen of energie ingekocht op het net van minimaal 7% toestaan, indien de activiteit andere
      milieuvoordelen waarborgt.

      3 Het scherm, bedoeld in het eerste lid, onderdeel b, onder 9 tot en met 11, is geen scherm voor lichtafscherming.

      4 De vervanging van bestaande schermen, bedoeld in het eerste lid, onderdeel b, onder 9 tot en met 11, is niet
      subsidiabel.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel110
  - number: '111'
    text: Uitgaven voor investeringen in zelfpersende containers zijn subsidiabel.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel111
  - number: '112'
    text: |-
      1 Uitgaven voor investeringen in innovatieve installaties ten behoeve van waterbesparing zijn subsidiabel indien:

      a. de specificatie van de investering een reductie van het waterverbruik van minimaal 15% geeft;

      b. de investeringen gericht zijn op de vervanging of de modernisering van bestaande systemen met het doel het
      waterverbruik te verminderen, en

      c. het gaat om:

      1°. bodemvochtsensoren in de vollegrondsteelt, of

      2°. installaties gericht op het hergebruik van spoelwater bij het afleveringsklaar maken van geoogst product.

      2 In afwijking van het eerste lid, onderdeel a, kan de minister in uitzonderlijke gevallen een reductie van het
      waterverbruik van minimaal 7% toestaan, indien de activiteit andere milieuvoordelen waarborgt.

      3 Het vaststellen van waterbesparing, gemeten in m³, als gevolg van een investering als bedoeld in het eerste lid
      vindt plaats op basis van een vergelijking tussen:

      a. het waterverbruik van de 12 maanden voorafgaand aan het jaar van inbedrijfstelling van de investering, en

      b. het waterverbruik gedurende het jaar:

      1°. na ingebruikname van de investering, of

      2°. volgend op het jaar van ingebruikname, in geval van inbedrijfstelling tijdens het teeltseizoen.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel112
  - number: '113'
    text: |-
      1 Uitgaven voor investeringen in installaties ten behoeve van het zuiveren van water voorafgaand aan lozing zijn
      subsidiabel indien het bevoegd gezag heeft bepaald dat de verplichting om water dat gewasbeschermingsmiddelen bevat
      voorafgaand aan het lozen door een zuiveringsvoorziening te leiden die ten minste 95% van de werkzame stoffen die
      bestaan uit organische verbindingen uit het afvalwater verwijdert, voor de desbetreffende inrichting niet geldt
      en de specificatie van de investering een reductie van de emissie van afvalstoffen in het geloosde afvalwater van
      minimaal 15% geeft.

      2 In afwijking van het eerste lid kan de minister in uitzonderlijke gevallen een reductie van de emissie van
      afvalstoffen in het geloosde afvalwater van minimaal 7% toestaan, indien de activiteit andere milieuvoordelen
      waarborgt.

      3 In geval van waterzuivering als bedoeld in het eerste lid overlegt de producentenorganisatie, bij indiening van
      de steunaanvraag aan de minister, een opgave van de emissiereductie van afvalstoffen in het geloosde afvalwater.
      De reductie wordt vastgesteld aan de hand van een vergelijking van de metingen voor inbedrijfstelling van de
      investering en direct na inbedrijfstelling van de investering.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel113
  - number: '114'
    text: |-
      Ter uitvoering van artikel 30, vierde lid, van [verordening 2017/891](32791R2017) kunnen in uitzonderlijke gevallen
      de werkelijke kosten van milieuacties, anders dan de verwerving van vaste activa, subsidiabel worden gesteld indien
      de producentenorganisatie in haar operationeel programma onderbouwt dat dit, gezien de hoogte van de werkelijk
      uit de milieuactie voortvloeiende kosten, nodig is om rekening te houden met de specifieke omstandigheden van de
      milieuactie.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel114
  - number: '115'
    text: |-
      1 Uitgaven voor aankoop van mest en compost afkomstig van door de Stichting Skal, bedoeld in
      [artikel 1 van het Landbouwkwaliteitsbesluit 2007][ref1], gecertificeerde biologische landbouwbedrijven zijn
      subsidiabel.

      2 De producentenorganisatie toont de biologische oorsprong van mest en compost bij de indiening van de
      steunaanvraag aan door middel van:

      a. een factuur en een afleverbon met vermelding van Skalnummer en ‘eko’ of ‘bio’;

      b. het Skal certificaat van de leverancier, en

      c. een opgave per deelnemende producent van:

      1°. het areaal GMO waardige gewassen;

      2°. de hoeveelheid en het type mest of compost, en

      3°. de opgevoerde kosten.

      3 In afwijking van het tweede lid, onderdeel b, kan de producentenorganisatie in plaats van Skal certificaten een
      lijst van Skal gecertificeerde leveranciers en Skalnummers overleggen.

      4 De uitgaven van de producentenorganisatie, bedoeld in het eerste lid, voor geconcentreerde handelsmeststoffen
      zijn niet subsidiabel.


      [ref1]: https://wetten.overheid.nl/BWBR0022535#Artikel1
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0022535
        artikel: '1'
  - number: '116'
    text: |-
      1 Uitgaven voor het verbeteren van de bodemvruchtbaarheid door het activeren van bodemleven door middel van het
      toedienen van micro-organismen zijn subsidiabel.

      2 De producentenorganisatie verzoekt de minister vooraf om goedkeuring van de micro-organismen, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel116
  - number: '117'
    text: |-
      1 Uitgaven voor biologische vermeerdering en opkweek van uitgangsmateriaal en de niet-chemische
      behandeling bij zaden van gangbare oorsprong zijn subsidiabel indien zij door de Stichting Skal, bedoeld in
      [artikel 1 van het Landbouwkwaliteitsbesluit 2007][ref1], gecertificeerd zijn.

      2 Voor de uitgaven, bedoeld in het eerste lid, geldt een forfaitair tarief van 25%.

      3 De producentenorganisatie toont de biologische oorsprong van uitgangsmateriaal bij de indiening van de
      steunaanvraag aan door middel van:

      a. een factuur en een afleverbon met vermelding van Skalnummer en ‘eko’ of ‘bio’ en, indien van toepassing, ‘niet
      chemisch behandeld’, en

      b. het Skal certificaat van de leverancier.

      4 In afwijking van het derde lid, onderdeel b, kan de producentenorganisatie in plaats van Skal certificaten een
      lijst van Skal gecertificeerde leveranciers en Skalnummers overleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0022535#Artikel1
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0022535
        artikel: '1'
