        artikel: '77'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '80'
    text: |-
      1 De restwaarde, bedoeld in artikel 32, zesde lid, van [verordening 2017/891](32791R2017), wordt bepaald volgens de
      voorschriften van artikel 79, vierde lid.

      3 De vervanging van onderdelen van duurzame productiemiddelen is niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel80
  - number: '81'
    text: |-
      Indien een producentenorganisatie of unie van producentenorganisaties uitgaven voor een investering in een duurzaam
      productiemiddel in identieke tranches in de steunaanvraag opneemt, als bedoeld in artikel 31, zesde lid, van
      [verordening 2017/891](32791R2017), wordt de eerste tranche niet eerder opgenomen dan in de steunaanvraag die de
      periode betreft die de factuurdatum van de laatste factuur voor het duurzame productiemiddel omvat.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel81
  - number: '82'
    text: |-
      1 Duurzame productiemiddelen kunnen ten laste van het actiefonds worden gebracht gedurende maximaal de periode,
      bedoeld in [artikel 77][ref1].

      2 Uitgaven voor duurzame productiemiddelen, inclusief duurzame productiemiddelen die worden verworven door middel
      van langlopende leasecontracten, kunnen ook voor het volgende operationele programma in aanmerking worden genomen,
      indien de periode, bedoeld in [artikel 77][ref2], langer is dan de looptijd van het operationele programma.


      [ref1]: https://wetten.overheid.nl/BWBR0039769#Artikel77
