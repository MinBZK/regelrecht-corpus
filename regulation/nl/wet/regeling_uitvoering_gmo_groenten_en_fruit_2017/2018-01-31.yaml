    text: |-
      1 Uitgaven voor de meerkosten van materialen, monitoring en begeleiding van biologische grondontsmetting ten
      opzichte van gangbare grondontsmetting, inclusief personeelskosten, zijn subsidiabel.

      2 De producentenorganisatie toont de meerkosten, bedoeld in het eerste lid, bij indiening van de steunaanvraag aan
      door middel van offertes of facturen.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel125
  - number: '126'
    text: |-
      Ter uitvoering van artikel 30, vierde lid, van [verordening 2017/891](32791R2017) kunnen in uitzonderlijke gevallen
      de werkelijke kosten van milieuacties, anders dan de verwerving van vaste activa, subsidiabel worden gesteld indien
      de producentenorganisatie in haar operationeel programma onderbouwt dat het, gezien de hoogte van de werkelijk
      uit de milieuactie voortvloeiende kosten, nodig is om rekening te houden met de specifieke omstandigheden van de
      milieuactie.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel126
  - number: '127'
    text: |-
      1 Uitgaven voor de meerkosten van biologisch afbreekbaar folie bestemd voor onkruidbestrijding ten opzichte van
      kunststoffolie zijn subsidiabel.

      2 De meerkosten, bedoeld in het eerste lid, worden door de producentenorganisatie bij het indienen van de
      steunaanvraag aangetoond aan de hand van offertes en facturen.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel127
  - number: '128'
    text: |-
      1 Uitgaven voor deelname aan nationaal of internationaal maatschappelijk aanvaarde milieuzorgsystemen en
      aanvullende certificeringssystemen die openstaan voor alle producenten van groenten en fruit, inclusief
      personeelskosten, zijn subsidiabel indien:

      a. het milieuzorgsysteem bindende voorwaarden omvat met betrekking tot productiemethoden;

      b. de naleving van de voorwaarden, bedoeld in onderdeel a, het onderwerp zijn van een onafhankelijke controle door
      gekwalificeerde personen of organen, en

      c. het gaat om de volgende uitgaven voor:

      1°. begeleiding, audits, certificering en lidmaatschapkosten, indien zij noodzakelijk zijn voor deelname aan
      milieuzorgsystemen;

      2°. personeelskosten voor milieuzorgsystemen, indien zij nodig zijn voor de deelname in milieuzorgsystemen;

      3°. het ontwikkelen van materialen voor milieuzorgsystemen, en

      4°. het ontwikkelen en verbeteren van ICT en registratiemodules ten behoeve van milieuzorgsystemen

      2 Milieuzorgsystemen, bedoeld in het eerste lid, op het teeltbedrijf van aangesloten leden zijn:

      a. Skal biologische productie, voor teelt van gewassen;

      b. certificeringssystemen, zoals Milieukeur, MPS Fruit & Vegetable, Duurzame Glastuinbouw Producten, CO2Footprint,
      en

      c. certificeringssystemen van retailers, zoals Albert Heijn Protocol, Field to Fork, LEAF en Sedex.

      3 Milieuzorgsystemen, bedoeld in het eerste lid, op het centrale niveau van de producentenorganisatie of
      distributiecentra van de producentenorganisatie zijn:

      a. ISO 14001 Milieu;

      b. Skal bereiding, verpakking, handel en opslag, en

      c. Milieukeur.

      4 Uitgaven als bedoeld in het eerste lid zijn niet subsidiabel indien het gaat om uitgaven voor:

      a. uitgaven voor certificering van groenlabelkassen, en

      b. de aanschaf van materialen, bedoeld in het eerste lid, onderdeel c, onder 3°.

      5 De producentenorganisatie overlegt bij de indiening van de steunaanvraag, met gebruikmaking van een door de
      minister beschikbaar gesteld middel, cijfers met betrekking tot de deelname van producenten aan de systemen,
      bedoeld in het tweede lid.

      6 Uitgaven als bedoeld in het eerste lid, onderdeel c, onder 4°, voor abonnementen of licenties voor
      registratiemodules, gedaan voor het einde van het kwartaal dat de factuurdatum van de laatste factuur voor de
      registratiemodule omvat, zijn eenmalig subsidiabel.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel128
  - number: '129'
    text: |-
      Uitgaven van de producentenorganisatie voor activiteiten ter realisatie van het strategisch doel marktgericht
      produceren, bedoeld in [artikel 47, eerste lid, onderdeel b][ref1], en ter uitvoering van de maatregel, bedoeld
      in artikel 2, onderdeel f, onder i, van [verordening 2017/891](32791R2017), zijn subsidiabel, indien wordt voldaan
      aan:

      a. [deel 4, hoofdstuk 3][ref2], en

      b. deze afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0039769#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0039769#Hoofdstuk3
