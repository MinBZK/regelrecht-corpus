  - number: '170'
    text: |-
      1 Uitgaven van de producentenorganisatie voor personeel en externe diensten voor nieuwbouw van sorteercentra en
      verpakcentra, distributiecentra, verwerkingscentra, fustopslag, dockboards en op afzetverbetering gerichte sorteer-
      en verpakkingslijnen, bedoeld in artikel 166, eerste lid, ten behoeve van het ontsluiten van nieuwe markten zijn
      subsidiabel indien het gaat om:

      a. de kosten van bouwkundig advies;

      b. de kosten van bouwbegeleiding;

      c. de kosten van projectmanagement;

      d. de kosten van onafhankelijk toezicht op uitvoering van een project;

      e. de kosten van haalbaarheidsstudies;

      f. juridische en administratiekosten,

      g. reis- en verblijfkosten.

      2 Uitgaven als bedoeld in het eerste lid waarvan het fiscaal en bedrijfseconomisch gebruikelijk is dat deze worden
      geactiveerd in het investeringsbedrag zijn niet subsidiabel.

      3 Uitgaven als bedoeld in het eerste lid, onderdeel g, zijn niet subsidiabel indien het gaat om reis- en
      verblijfkosten voor het personeel van de producentenorganisatie of haar leden.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel170
  - number: '171'
    text: |-
