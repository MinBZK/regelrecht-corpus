  - number: '50'
    text: |-
      In de beschrijving van de doelen, bedoeld in artikel 4, eerste lid, onderdeel b, van [verordening 2017/892]
      (32792R2017), onderbouwt de producentenorganisatie aan de hand van de SWOT analyse, bedoeld in [artikel 49][ref1],
      de keuze om de strategische doelen, bedoeld in [artikel 47][ref2], wel of niet na te streven met het operationeel
      programma.


      [ref1]: https://wetten.overheid.nl/BWBR0039769#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0039769#Artikel47
