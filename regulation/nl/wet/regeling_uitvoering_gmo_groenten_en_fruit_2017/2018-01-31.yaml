        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0039769
        hoofdstuk: '4'
  - number: '202'
    text: |-
      1 Uitgaven als bedoeld in [deel 4, hoofdstuk 3][ref1] en [4][ref2], worden opgenomen in de steunaanvraag voor het
      uitvoeringsjaar waarin de activiteit wordt uitgevoerd en de uitgaven worden dat jaar betaald, tenzij in hoofdstuk 3
      of 4 van deel 4 anders wordt bepaald.

      2 In afwijking van het eerste lid kunnen uitgaven als bedoeld in [hoofdstuk 3][ref3] en [4 van deel 4][ref4] worden
      betaald in de periode van 1 januari tot en met 14 februari van het jaar volgend op het uitvoeringsjaar waarin de
      activiteit wordt uitgevoerd, indien de uitgaven in die periode in het actiefonds worden verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0039769#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0039769#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0039769#Hoofdstuk3
      [ref4]: https://wetten.overheid.nl/BWBR0039769#Hoofdstuk4
