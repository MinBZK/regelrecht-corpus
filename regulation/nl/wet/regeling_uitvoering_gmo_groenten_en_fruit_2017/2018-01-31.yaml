  - number: '198'
    text: |-
      Uitgaven van de producentenorganisatie voor activiteiten ten behoeve van versterking van de interne structuur van
      de producentenorganisatie door fusies en overnames zijn subsidiabel, indien het gaat om:

      a. de juridische kosten en administratiekosten, en

      b. de kosten van haalbaarheidsstudies.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel198
  - number: '199'
    text: |-
      1 Uitgaven van de producentenorganisatie ten behoeve van de versterking van de verticale samenwerking in de keten
      voor beleggingen in aandelen zijn subsidiabel indien het gaat om uitgaven voor de waarde van de materiële vaste
      activa.

      2 De producentenorganisatie toont de belegging, bedoeld in het eerste lid, bij de indiening van de steunaanvraag
      aan door middel van bankstukken.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel199
  - number: '200'
    text: |-
      Indien een uitgave afwijkt van de in het operationele programma opgenomen begroting voor een uitgavenpost voor een
      activiteit, wordt deze afwijking in de steunaanvraag voldoende gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel200
  - number: '201'
    text: |-
      1 Als bewijsstuk als bedoeld in artikel 9, tweede lid, onderdelen a en d, van [verordening 2017/892](32792R2017),
      gelden:

      a. een overzicht van de per project en activiteit aangevraagde steun, en

      b. een detailstaat van de verrichte uitbetalingen en afschrijvingen.

      2 Als bewijsstuk als bedoeld in artikel 9, tweede lid, onderdeel i, van [verordening 2017/892](32792R2017), geldt
      de detailstaat betalingen en afschrijvingen van de producentenorganisatie waarin de facturen voor de betreffende
      acties zijn opgenomen.

      3 Indien uitgaven voor activiteiten op grond van [deel 4, hoofdstuk 3][ref1] of [4][ref2], voor 50% subsidiabel
      zijn, worden de volledige uitgaven van de producentenorganisatie voor deze activiteiten opgenomen in de detailstaat
      van de verrichte uitbetalingen en afschrijvingen, bedoeld in het eerste lid, onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0039769#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0039769#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel201
