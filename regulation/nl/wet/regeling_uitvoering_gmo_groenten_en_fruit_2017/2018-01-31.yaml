      - id: ref2
        bwb_id: BWBR0039769
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0039769
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0039769
        hoofdstuk: '4'
  - number: '203'
    text: |-
      1 Uitgaven als bedoeld in artikel 9, derde lid, van [verordening 2017/892](32792R2017), kunnen in de steunaanvraag
      van het jaar waarin zij geprogrammeerd zijn worden opgenomen, indien de producentenorganisatie, in een bijlage bij
      de steunaanvraag, gemotiveerd aangeeft dat deze uitgaven betrekking hebben op situaties die:

      a. aantoonbaar zijn ontstaan na indiening van het operationeel programma;

      b. geheel buiten de invloedsfeer van de producentenorganisatie liggen, en

      c. niet het gevolg zijn van een risicovolle planning door de producentenorganisatie.

      2 Producentenorganisaties laten een extern accountant een controle uitvoeren en een controleverklaring afleggen,
      met gebruikmaking van een door de minister beschikbaar gesteld model, over de naleving van de in het eerste lid
      bedoelde voorwaarden.

      3 Producentenorganisaties overleggen de verklaring, bedoeld in het derde lid, uiterlijk op 15 mei van het jaar na
      het jaar waarvoor de subsidie wordt aangevraagd aan de minister.

      4 De minister besluit of de uitgaven, bedoeld in het eerste lid, subsidiabel zijn.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel203
  - number: '204'
    text: |-
      1 Producentenorganisaties laten een extern accountant de juistheid van de bewijsstukken, bedoeld in artikel
      9, tweede lid, onderdelen a, c, d, f, en i, van [verordening 2017/892](32792R2017), controleren en laten de
      bewijsstukken door de accountant waarmerken.

      2 Producentenorganisaties laten een extern accountant een controle uitvoeren op de naleving van de punten, bedoeld
      in artikel 9, tweede lid, onderdelen e, g en h van [verordening 2017/892](32792R2017).

      3 De in het eerste en tweede lid bedoelde accountant stelt op basis van de door hem uitgevoerde controle een
      controleverklaring op met gebruikmaking van een door de minister beschikbaar gesteld model, alsmede een verslag van
      de verrichte werkzaamheden.

      4 De in het derde lid bedoelde controleverklaring geldt met het bijbehorende verslag als bewijsstuk als bedoeld in
      artikel 9, tweede lid, onderdelen a en c tot en met i van [verordening 2017/892](32792R2017).
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel204
  - number: '205'
    text: |-
      Producentenorganisaties overleggen ter uitvoering van artikel 27 van [verordening 2017/892](32792R2017) jaarlijks
      tegelijk met de indiening van de steunaanvraag:

      a. een digitale ledenlijst per 1 januari van het jaar volgend op het jaar waarop de steunaanvraag betrekking heeft
      met gebruikmaking van een door de minister beschikbaar gesteld middel;

      b. een overzicht van de leden die gedurende het jaar waarop de steunaanvraag betrekking heeft zijn uitgetreden,
      onder vermelding van de datum van uittreding, met gebruikmaking van een door de minister beschikbaar gesteld
      middel, en

      c. een parafenlijst van tekeningbevoegde personen binnen de producentenorganisatie.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel205
  - number: '206'
    text: |-
      1 Een producentenorganisatie die in enig jaar een goedgekeurd operationeel programma uitvoert kan de minister
      uiterlijk op de volgende data om betaling van een voorschot als bedoeld in artikel 35, eerste lid, van [verordening
      2017/891](32791R2017) verzoeken:

      a. eerste voorschot: 31 januari;

      b. tweede voorschot: 31 mei, en

      c. derde voorschot: 30 september

      2 In een verzoek om een voorschot als bedoeld in het eerste lid wordt:

      a. het bedrag van het verzochte voorschot genoemd, en

      b. een onderbouwing opgenomen aan de hand van een reële raming van de verwachte uitgaven.

      3 Een producentenorganisatie die om een voorschot als bedoeld in het eerste lid verzoekt, is ook verplicht om voor
      de tweede en derde termijn van het betreffende jaar een voorschot te verzoeken.

      4 Ten behoeve van ieder volgend voorschot toont de producentenorganisatie aan dat de eerdere voorschotten en de
      overeenkomstige bijdrage van de producentenorganisatie daadwerkelijk zijn besteed door de volgende bewijsstukken
      betreffende het kwartaal voorafgaand aan het kwartaal waarvoor het voorschot wordt gevraagd te overleggen aan de
      minister:

      a. de kwartaalrapportage, en

      b. de detailstaat betalingen en afschrijvingen.

      5 De producentenorganisatie laat een extern accountant een controle uitvoeren op de juistheid van de bedragen
      opgenomen in de bewijsstukken, bedoeld in het vierde lid.

      6 De in het eerste en tweede lid bedoelde accountant stelt op basis van de door hem uitgevoerde controle, met
      gebruikmaking van een door de minister beschikbaar gesteld model, een controleverklaring op en waarmerkt de in het
      vierde lid bedoelde bewijsstukken.

      7 De bewijsstukken, bedoeld in het vierde en zesde lid, worden gelijktijdig met het verzoek, bedoeld in het eerste
      lid, onderdelen b en c, aan de minister overlegd.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel206
  - number: '207'
    text: |-
      1 Bij een verzoek om vrijgave van de zekerheid, bedoeld in artikel 35, tweede lid, van [verordening 2017/891]
      (32791R2017), worden, voor het kwartaal waarop de gestelde zekerheid betrekking heeft, de bewijsstukken, bedoeld in
      artikel 206, vierde tot en met zesde lid, ingediend.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel207
  - number: '208'
    text: |-
      1 Een producentenorganisatie kan de minister uiterlijk op 1 mei, 1 augustus of 31 oktober van enig jaar verzoeken
      om een betaling van het gedeelte van de steun dat overeenkomt met de reeds in het kader van het operationele
      programma bestede en nog niet aan de producentenorganisatie betaalde bedragen, bedoeld in artikel 12 van
      [verordening 2017/892](32792R2017).

      2 Ter onderbouwing van het verzoek om gedeeltelijke betaling als bedoeld in het eerst lid, overlegt de
      producentenorganisatie de volgende bewijsstukken aan de minister:

      a. een rapportage, met gebruikmaking van een door de minister beschikbaar gesteld middel, over de bij het verzoek
      betrokken periode, en

      b. een detailstaat betalingen en afschrijvingen.

      3 De producentenorganisatie laat een extern accountant een controle uitvoeren op de juistheid van de bedragen
      opgenomen in de bewijsstukken, bedoeld in het tweede lid.

      4 De accountant, bedoeld in het derde lid, stelt op basis van de door hem uitgevoerde controle een
      controleverklaring op, met gebruikmaking van een door de minister beschikbaar gesteld model, en waarmerkt de
      bewijsstukken, bedoeld in het tweede lid.

      5 De bewijsstukken, bedoeld in het tweede en vierde lid, worden uiterlijk op de volgende data aan de minister
      overlegd:

      a. eerste rapportage: 15 mei van het jaar waarop het verzoek om gedeeltelijke betaling betrekking heeft;

      b. tweede rapportage: 15 augustus van het jaar waarop het verzoek om gedeeltelijke betaling betrekking heeft, en

      c. derde rapportage: 15 november van het jaar waarop het verzoek om gedeeltelijke betaling betrekking heeft.

      6 Indien een uitgave afwijkt van de in het operationele programma opgenomen begroting voor een uitgavenpost voor
      een activiteit, wordt deze afwijking bij het verzoek om gedeeltelijke betaling voldoende gemotiveerd.

      7 Een verzoek om gedeeltelijke betaling wordt ten aanzien van overheadkosten als bedoeld in bijlage III, onderdeel
      2, sub a, van [verordening 2017/891](32791R2017), slechts gedaan voor een gedeelte van het forfait, naar rato van
      het gedeelte van het jaar waarop het verzoek betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel208
  - number: '209'
    text: |-
      Indien een producentenorganisatie werkt met een administratie van dertien perioden wordt, voor de toepassing van de
      [artikelen 206][ref1], [207][ref2] en [208][ref3], onder kwartaal verstaan één keer een tijdvak van vier perioden
      en drie keer een tijdvak van drie perioden.


      [ref1]: https://wetten.overheid.nl/BWBR0039769#Artikel206
      [ref2]: https://wetten.overheid.nl/BWBR0039769#Artikel207
