      Uit de bewijsstukken bedoeld in artikel 16, tweede lid, van [verordening 2017/892](32792R2017) blijkt:

      a. vanaf welk adres de uit de markt genomen producten bestemd voor gratis uitreiking vervoerd zijn;

      b. het adres waar de uit de markt genomen goederen bestemd voor gratis uitreiking zijn afgeleverd aan een
      voedselbank als bedoeld in [artikel 188, eerste lid][ref1], en

      c. het aantal afgelegde kilometers.


