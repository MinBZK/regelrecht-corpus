  - number: '214'
    text: |-
      Paragraaf 5 van de Regeling producenten- en brancheorganisaties is van overeenkomstige toepassing op
      producentenorganisaties en unies van producentenorganisaties.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel214
  - number: '215'
    text: |-
      1 Een producentenorganisatie of unie van producentenorganisaties leeft de voorschriften als bedoeld in artikel 164,
      eerste, derde en vierde lid en 165 van [verordening 1308/2013](32013R1308) na.

      2 In geval van niet-naleving van een voorschrift als bedoeld in het eerste lid kan de minister:

      a. de op grond van artikel 164, eerste lid, van [verordening 1308/2013](32013R1308) vastgestelde
      verbindendverklaring van een voorschrift intrekken;

      b. de op grond van artikel 165 van [verordening 1308/2013](32013R1308) vastgestelde verplichting tot het afdragen
      van een financiële bijdrage intrekken.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel215
  - number: '216'
    text: |-
      Een verzoek als bedoeld in de [artikelen 164, eerste lid][ref1] of [165][ref2], of een zienswijze als bedoeld in
      artikel 165, wordt ingediend met gebruikmaking van een door de minister beschikbaar gesteld middel.


      [ref1]: https://wetten.overheid.nl/BWBR0039769#Artikel164
