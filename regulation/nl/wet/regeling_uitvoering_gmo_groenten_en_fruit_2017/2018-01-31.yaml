  - number: '184'
    text: |-
      1 Uitgaven van de producentenorganisatie, inclusief personeelskosten, voor collectieve generieke promotie-uitingen
      op het gebied van crisis zijn subsidiabel.

      2 Bij de indiening van het operationeel programma legt de producentenorganisatie in het kader van de uitgaven,
      bedoeld in het eerste lid, een plan inhoudende de concrete invulling van de acties en begroting voor aan de
      minister.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel184
  - number: '185'
    text: |-
      1 Uitgaven van de producentenorganisatie voor het uit de markt nemen van producten als bedoeld in artikel 33, derde
      lid, onderdeel f, van [verordening 1308/2013](32013R1308) zijn subsidiabel.

      2 Als producten bedoeld in artikel 33, derde lid, onderdeel f, van [verordening 1308/2013](32013R1308) worden
      aangewezen:

      a. tomaten met GN code 0702 00 00;

      b. wortels met GN code 0706 10 00;

      c. witte kool en rode kool met GN code 0704 90 10;

      d. niet-scherpsmakende pepers (paprika’s) met GN code 0709 60 10;

      e. bloemkool en broccoli met GN code 0704 10 00;

      f. komkommers met GN code 0707 00 05;

      g. augurken met GN code 0707 00 90;

      h. champignons agaricus met GN code 0709 51 00;

      i. appelen met GN code 0808 10;

      j. peren met GN code 0808 30;

      k. pruimen met GN code 0809 40 05, en

      l. rood fruit met GN codes 0810 20, 0810 30 en 0810 40;

      3 Als toegestane bestemmingen als bedoeld in artikel 46, eerste lid, van [verordening 2017/891](32791R2017) worden
      aangewezen:

      a. afvoer naar de afvalverwerkende industrie, nadat het product is gedenatureerd;

      b. afvoer naar veehouders ten behoeve van vervoedering, nadat het product is gedenatureerd, en

      c. gratis verstrekking, als bedoeld in artikel 46, tweede lid, van [verordening 2017/891](32791R2017), aan
      liefdadigheidsinstellingen of -organisaties als bedoeld in [artikel 188, eerste lid][ref1].

      4 Afvalverwerkers, bedoeld in het vierde lid, onderdeel a, beschikken over een geldige milieuvergunning.

      5 Afnemers van producten die op grond van het eerste lid uit de markt genomen zijn mogen geen vergoeding betalen
      voor het uit de markt genomen product.


      [ref1]: https://wetten.overheid.nl/BWBR0039769#Artikel188
