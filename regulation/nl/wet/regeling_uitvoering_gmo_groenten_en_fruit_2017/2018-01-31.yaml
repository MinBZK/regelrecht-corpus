        bwb_id: BWBR0039769
        artikel: '43'
        hoofdstuk: '1'
  - number: '38'
    text: |-
      De waarde van de afgezette productie van leden die zijn toegetreden tot de producentenorganisatie gedurende de
      referentieperiode, bedoeld in [artikel 36][ref1], wordt in aanmerking genomen voor de bepaling van de waarde
      afgezette productie van de producentenorganisatie vanaf de datum die door het bestuur van de producentenorganisatie
      in haar schriftelijke bevestiging als bedoeld in artikel 7, vierde lid, is aangewezen als de datum waarop het
      lidmaatschap in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0039769#Artikel36
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0039769
        artikel: '36'
        hoofdstuk: '1'
  - number: '39'
    text: |-
      1 De producentenorganisatie kan bij de bepaling van de waarde van de afgezette productie van de
      producentenorganisatie de waarde van de afgezette productie van leden in aanmerking nemen die:

      a. gedurende de referentieperiode, bedoeld in [artikel 36][ref1], voor de producten waarvoor de
      producentenorganisatie is erkend waren aangesloten bij een andere in Nederland erkende producentenorganisatie, en

      b. na de referentieperiode, bedoeld in [artikel 36][ref2], voor de producten waarvoor de producentenorganisatie is
      erkend tot de producentenorganisatie zijn toegetreden, voor zover deze leden voldoen aan het vereiste van artikel
      23, tweede lid, van [verordening 2017/891](32791R2017).

      2 De waarde van de afgezette productie van de leden, bedoeld in het eerste lid, wordt slechts door de nieuwe
      producentenorganisatie in aanmerking genomen indien de producentenorganisatie waar de producent was aangesloten
      gedurende de referentieperiode, bedoeld in artikel 36, de nieuwe producentenorganisatie uiterlijk op 15 november
      van het jaar waarvoor de waarde van de afgezette productie bepaald wordt een overzicht verstrekt van de waarde
      van de voor het individuele lid afgezette producten waarvoor het lid bij de nieuwe producentenorganisatie is
      aangesloten, met gebruikmaking van een door de minister beschikbaar gesteld model.

      3 Indien de waarde van de afgezette productie van een lid als bedoeld in het eerste lid niet in aanmerking is
      genomen bij de bepaling van de waarde van de afgezette productie van de producentenorganisatie waar de producent
      was aangesloten gedurende de referentieperiode, bedoeld in [artikel36][ref3], is [artikel 40, tweede lid][ref4],
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039769#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0039769#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0039769#Artikel36
      [ref4]: https://wetten.overheid.nl/BWBR0039769#Artikel40
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel39
