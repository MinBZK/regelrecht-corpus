  - number: '130'
    text: |-
      1 Uitgaven van de producentenorganisatie voor investeringen in de aanschaf van belichtingsinstallaties ten behoeve
      van het jaarrond produceren zijn subsidiabel indien de energie die gedurende de instandhoudingstermijn, bedoeld
      in [artikel 77, eerste lid][ref1], wordt gebruikt voor de belichtingsinstallatie een aantoonbaar duurzaam karakter
      heeft of wordt opgewekt met behulp van een warmtekrachtkoppelingsinstallatie.

      2 De producentenorganisatie toont bij de indiening van het operationeel programma aan dat:

      a. verkoop van het betreffende product op dat moment niet jaarrond plaatsvindt, en

      b. de verkoop van het betreffende product met behulp van de belichtingsinstallatie waarvoor steun wordt aangevraagd
      wel jaarrond kan plaatsvinden.

      3 De producentenorganisatie toont bij indiening van de steunaanvraag voor het laatste uitvoeringsjaar van het
      operationeel programma aan dat de productie van het product jaarrond plaatsvindt.

      4 Uitgaven voor schermen ten behoeve van lichtafscherming en verwijderingsbijdragen zijn niet subsidiabel.

      5 De producentenorganisatie overlegt jaarlijks bij de indiening van de steunaanvraag aan de minister een overzicht
      van de hoeveelheden product, met uitsplitsing naar gewas en type klant, die zijn geproduceerd met behulp van de in
      het eerste lid bedoelde belichtingsinstallatie.


      [ref1]: https://wetten.overheid.nl/BWBR0039769#Artikel77
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel130
