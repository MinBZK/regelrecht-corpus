  - number: '83'
    text: |-
      1 Tweedehands duurzame productiemiddelen zijn subsidiabel indien:

      a. het aanschafbedrag hoger is dan € 10.000, en

      b. de producentenorganisatie bij indiening van de steunaanvraag aan de minister een verklaring van de verkopende
      partij overlegt dat voor de aankoop van het productiemiddel in de voorafgaande zeven jaren geen uniale steun of
      nationale subsidie is ontvangen.

      2 In afwijking van het eerste lid, onderdeel b, bedraagt de termijn waarbinnen geen uniale steun of nationale
      subsidie mag zijn ontvangen voor onroerende zaken tien jaar.

      3 Tweedehands duurzame productiemiddelen die bij een aangesloten producent zijn aangeschaft zijn niet subsidiabel
      indien deze productiemiddelen vervolgens bij deze of een andere aangesloten producent worden geplaatst.

      4 Dit artikel is van overeenkomstige toepassing op investeringen die worden gehuurd of geleased.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel83
  - number: '84'
    text: |-
      1 Duurzame productiemiddelen op het terrein van ICT zijn subsidiabel indien het gaat om:

      a. hardware die:

      1°. een integraal onderdeel uitmaakt van subsidiabele installaties, of

      2°. ondersteunend is voor subsidiabele activiteiten en op grond van offertes kan worden toegerekend aan deze
      activiteiten;

      b. software applicaties die ondersteunend zijn voor subsidiabele activiteiten die bijdragen aan handhaving van
      kwaliteit, milieubescherming of verbetering van de afzet en op grond van offertes kan worden toegerekend aan deze
      activiteiten.

      2 De producentenorganisatie toont bij de indiening van de steunaanvraag aan:

      a. welke applicaties via de server gebruikt worden, en

      b. wat het capaciteitsbeslag en het gebruik van de subsidiabele applicaties is.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel84
  - number: '85'
    text: |-
      1 Uitgaven voor investeringen in uitgangsmateriaal van rassen van meerjarige gewassen en licenties voor het gebruik
      van zaden en plantgoed van nieuwe rassen van meerjarige gewassen die zijn opgenomen in het operationeel programma
      van een producentenorganisatie zijn subsidiabel, indien de bedoelde rassen:

      a. toegelaten zijn door de Stichting Nederlandse Algemene Kwaliteitsdienst voor de Tuinbouw;

      b. ingeschreven staan in het Nederlandse rassenregister van de Raad voor de plantenrassen, of

      c. ingeschreven staan bij een keuringsinstantie van een andere lidstaat.

      2 Op verzoek van de minister overlegt de producentenorganisatie voor de zaden en het plantgoed, bedoeld in het
      eerste lid, het plantenpaspoort, bedoeld in [richtlijn 2000/29](32000L0029).
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel85
  - number: '86'
    text: |-
      Producentenorganisaties houden voor alle duurzame productiemiddelen die zijn opgenomen in een lopend operationeel
      programma, met gebruikmaking van een door de minister beschikbaar gesteld middel, een actueel register bij.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel86
  - number: '87'
    text: |-
      1 Uitgaven voor huur als alternatief voor koop van duurzame productiemiddelen zijn subsidiabel overeenkomstig punt
      10 van bijlage III van [verordening 2017/891](32791R2017), voor zover koop van de productiemiddelen subsidiabel
      zou zijn.

      2 In het geval de uitgaven, bedoeld in het eerste lid, betrekking hebben op twee uitvoeringsjaren van het
      operationeel programma, zijn deze uitgaven, in afwijking van [artikel 202][ref1], eerste lid, subsidiabel in het
      jaar waarin zij aan de producentenorganisatie zijn gefactureerd.

      3 De producentenorganisatie overlegt ter uitvoering van artikel 31, eerste lid, en punt 10 van bijlage III
      van [verordening 2017/891](32791R2017) jaarlijks bij de indiening van de steunaanvraag aan de minister voor de
      uitgaven, bedoeld in het eerste lid, een huurcontract.

      4 De producentenorganisatie overlegt ter uitvoering van artikel 31, eerste lid, en punt 10 van bijlage III van
      [verordening 2017/891](32791R2017) jaarlijks bij de indiening van de steunaanvraag aan de minister een overzicht
      van de hoeveelheden product waarvan de productstroom gebundeld is met behulp van huur.


      [ref1]: https://wetten.overheid.nl/BWBR0039769#Artikel202
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0039769
        artikel: '202'
  - number: '88'
    text: |-
      1 Een producentenorganisatie die uitgaven voor investeringen in installaties voor energiebesparende projecten
      opneemt in haar operationeel programma voegt aan de informatie, bedoeld in artikel 51, een energiebalans toe,
      waarin wordt vermeld wat de beginsituatie en de verwachte situatie is, op basis van een door een deskundige:

      a. opgestelde technische specificatie, en

      b. gemaakte berekening van de verwachte energiestromen en de verwachte energiebesparing.

      2 Ter verantwoording van de gerealiseerde energiebesparing overlegt de producentenorganisatie bij de steunaanvraag
      die wordt ingediend nadat de installaties één jaar in bedrijf zijn gesteld, het volgende:

      a. het declaratieformulier energiebesparende investeringen, met gebruikmaking van een door de minister beschikbaar
      gesteld middel;

      b. een overzicht van de bereikte energiebesparing volgens de geactualiseerde energiebalans, met gebruikmaking van
      een door de minister beschikbaar gesteld middel;

      c. de jaaropgave van het energieverbruik in het kader van de uniforme milieuregistratie die is overgelegd aan de
      Uitvoeringsorganisatie Glastuinbouw en Milieu en het voor deze registratie bijgehouden logboek of de meest recente
      jaarafrekening van de energieleverancier.

      3 Indien een afwijking van de verwachte energiebesparing, bedoeld in het eerste lid, door de producentenorganisatie
      onvoldoende gemotiveerd wordt kan de minister uitgaven voor investeringen als bedoeld in het eerste lid niet
      subsidiabel oordelen.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel88
  - number: '89'
    text: |-
      1 Indien de totale hoeveelheid aan derden geleverde energie die wordt opgewekt met een energiebesparende
      installatie groter is dan de totale hoeveelheid energie die door het lid waar de investering is geplaatst van
      energieleveranciers is afgenomen, wordt de opbrengst van de netto energielevering aan derden van energie die wordt
      opgewekt met die installatie in mindering gebracht op de subsidie voor de desbetreffende investering. Indien de
      subsidie reeds is vastgesteld wordt de subsidie ten nadele van de producentenorganisatie gewijzigd.

      2 Wanneer de energie die wordt opgewekt met de in het eerste lid bedoelde installatie uitsluitend op het
      teeltbedrijf zelf gebruikt wordt, overlegt de producentenorganisatie aan de minister jaarlijks bij het indienen van
      de steunaanvraag, vanaf het jaar na de factuurdatum van de laatste factuur voor de installatie, de energiebalans
      waaruit blijkt dat er geen warmte of elektriciteit is geleverd aan derden.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel89
  - number: '90'
    text: |-
      1 Uitgaven voor investeringen in een energiebesparende installatie uitgevoerd door middel van een participatie in
      een samenwerkingsverband van agrarische bedrijven met energieclustering zijn subsidiabel.

      2 Een agrarisch samenwerkingsverband als bedoeld in het eerste lid omvat ook een leveringsovereenkomst tussen
      agrarische bedrijven.

      3 Indien de gezamenlijke opbrengsten uit de participatie in een samenwerkingsverband voor een
      producentenorganisatie en diens leden of een unie van producentenorganisaties en diens leden groter zijn dan de
      gezamenlijke kosten van de totale hoeveelheid energie die door die producentenorganisatie en diens leden of die
      unie van producentenorganisaties en diens leden is afgenomen van het samenwerkingsverband, wordt het verschil in
      mindering gebracht op de subsidie voor de desbetreffende investering. Indien de subsidie reeds is vastgesteld wordt
      de subsidie ten nadele van de producentenorganisatie gewijzigd.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel90
  - number: '91'
    text: |-
      1 Een producentenorganisatie die uitgaven voor investeringen in installaties voor verbeterde waterkwaliteit,
      waterbesparing of besparing op het mineralenverbruik opneemt in haar operationeel programma voegt aan de
      informatie, bedoeld in artikel 51, een prognose toe van de verwachte verbetering of besparing per installatie, aan
      de hand van een technische specificatie van de leverancier of deskundige.

      2 Ter verantwoording van de gerealiseerde verbetering van de waterkwaliteit of de waterzuivering, of van de
      gerealiseerde besparing op het waterverbruik of het mineralenverbruik overlegt de producentenorganisatie bij de
      steunaanvraag die wordt ingediend na één jaar na de factuurdatum van de laatste factuur, het volgende:

      a. het declaratieformulier installaties waterkwaliteit, waterbesparing, waterzuivering en fertigatie in de
      fruitteelt, met gebruikmaking van een door de minister beschikbaar gesteld middel;

      b. een overzicht van de bereikte verbetering of besparing per installatie, met gebruikmaking van een door de
      minister beschikbaar gesteld middel, aan de hand van een vergelijking van:

      1°. een meting van de situatie voor de ingebruikname van de installatie, en

      2°. een meting van de gerealiseerde situatie na de ingebruikname van de installatie.

      3 In geval van leidingwater wordt de bereikte waterbesparing onderbouwd aan de hand van de jaarafrekening van het
      waterleidingbedrijf.

      4 Indien uitgaven voor investeringen in duurzame productiemiddelen op grond van titel 1 van hoofdstuk 4 van dit
      deel subsidiabel zijn wanneer een waterbesparing of energiebesparing van 15% wordt gerealiseerd, wordt de besparing
      berekend in het kader van en op het niveau van de investering.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel91
  - number: '92'
    text: |-
      1 Uitgaven voor de inhuur van externen zijn subsidiabel, indien de voor uitvoering van een activiteit benodigde
      kennis of capaciteit bij een producentenorganisatie niet voldoende aanwezig is.

      2 Externen als bedoeld in het eerste lid beschikken minimaal over het opleidingsniveau, bedoeld in
      [artikel 66, eerste lid][ref1].

      3 Producentenorganisaties geven in het operationeel programma aan welke specifieke taken aan externe diensten
      worden uitbesteed.

      4 De minister kan een producentenorganisatie, ten behoeve van de beoordeling van de subsidiabiliteit van uitgaven
      voor de inhuur van externen, verzoeken om aanvullende informatie en bewijsstukken te overleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0039769#Artikel66
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0039769
        artikel: '66'
        hoofdstuk: '3'
  - number: '93'
    text: |-
      1 Uitgaven voor kilometers gereden met de eigen auto door leden en medewerkers van de producentenorganisatie zijn
      subsidiabel indien:

      a. deze leden en medewerkers in het operationeel programma zijn opgenomen;

      b. de kilometers zijn gemaakt in het kader van een in het operationeel programma opgenomen activiteit;

      c. de vergoedingen daadwerkelijk aan de medewerker of het lid zijn uitbetaald;

      d. de vergoeding maximaal € 0,19 per kilometer bedraagt, en

      e. er een deugdelijke kilometeradministratie is bijgehouden die is geaccordeerd door de projectleider of
      leidinggevende die verantwoordelijk is voor de uitvoering van de activiteit en een andere persoon is dan de persoon
      die de reis heeft gemaakt.

      2 Uitgaven voor vliegtickets voor buitenlandse dienstreizen, plaatsbewijzen voor het openbaar vervoer en tickets
      voor veerboten zijn subsidiabel op basis van de economy class prijzen van deze tickets of plaatsbewijzen.

      3 Producentenorganisaties kunnen voor uitgaven voor verblijfkosten voor dienstreizen en excursies
      in binnenland en EU-lidstaten door medewerkers en aangesloten leden vergoedingen verstrekken voor de
      daadwerkelijk gemaakte kosten binnen de maxima van [artikel 5 van de Reisregeling Binnenland][ref1] en
      [artikel 3 van de Reisregeling Buitenland][ref2].

      4 De in het tweede en derde lid bedoelde uitgaven worden, met uitzondering van de vergoeding toegekend voor
      dagkosten, bij indiening van de steunaanvraag onderbouwd aan de hand van:

      a. facturen, en

      b. vervoersbewijzen.

      5 Kosten voor auto’s in eigendom van of geleased dan wel gehuurd door de producentenorganisatie zijn niet
      subsidiabel.


      [ref1]: https://wetten.overheid.nl/BWBR0005912#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006914#Artikel3
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0005912
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0006914
        artikel: '3'
  - number: '94'
    text: |-
      1 Uitgaven voor overige kosten op het gebied van ICT zijn subsidiabel voor zover deze ICT voorzieningen
      ondersteunend zijn voor subsidiabele activiteiten en op grond van offertes kunnen worden toegerekend aan deze
      activiteiten.

      2 Uitgaven voor licenties en voor abonnementen voor software applicaties als bedoeld in
      [artikel 84, eerste lid, onderdeel b][ref1], gedaan voor het einde van het kwartaal dat de factuurdatum van de
      laatste factuur voor de ICT voorziening omvat, zijn eenmalig subsidiabel indien het uitgaven voor subsidiabele
      applicaties en modules betreft.

      3 Onderhoudsabonnementen zijn niet subsidiabel.


      [ref1]: https://wetten.overheid.nl/BWBR0039769#Artikel84
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel94
