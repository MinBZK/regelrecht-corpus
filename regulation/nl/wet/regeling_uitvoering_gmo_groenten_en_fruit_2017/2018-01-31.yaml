  - number: '142'
    text: |-
      1 Uitgaven van de producentenorganisatie voor investeringen ten behoeve van het vergroten van de afzetwaarde
      van producten door middel van het vergroten van de duurzaamheid van het product en van het productieproces zijn
      subsidiabel indien:

      a. het gaat om investeringen om de kwaliteit van water bij substraatteelt bij de bron te verbeteren en de emissie
      van vervuild recirculatiewater te voorkomen;

      b. de verbetering van de waterkwaliteit door de producentenorganisatie is aangetoond, en

      c. de investeringen niet leiden tot een hoger waterverbruik.

      2 Een producentenorganisatie die uitgaven voor investeringen als bedoeld in het eerste lid in haar operationeel
      programma opneemt, voegt aan de informatie, bedoeld in [artikel 51][ref1], een technische specificatie van de
      leverancier van het systeem of een erkende deskundige toe ten behoeve van de onderbouwing van de te bereiken
      verbetering van de waterkwaliteit.

      3 Uitgaven als bedoeld in het eerste lid voor afdekzeilen van bassins en silo’s voor wateropslag zijn niet
      subsidiabel.


      [ref1]: https://wetten.overheid.nl/BWBR0039769#Artikel51
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel142
