      1 Uitgaven van de producentenorganisatie voor de aanschaf van systemen voor aanvoerprognoses en areaalenquêtes
      zijn subsidiabel indien het gaat om systemen bij de producentenorganisatie en haar leden die met elkaar kunnen
      communiceren.

      2 De producentenorganisatie overlegt jaarlijks bij de indiening van de steunaanvraag aan de minister een overzicht
      van het aantal systemen, bedoeld in het eerste lid, en het aantal aansluitingen van haar leden op deze systemen.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel155
  - number: '156'
    text: |-
      1 Uitgaven van producentenorganisaties ten behoeve van voorraadbeheer en distributie zijn subsidiabel indien het
      gaat om het ontwerpen, bouwen en implementeren van ICT systemen voor logistieke planning en voor zover zij tot
      doel hebben:

      a. kwaliteitsverbetering van het proces;

      b. tracking and tracing van producten;

      c. koppeling van vraag aan aanbod, en

      d. efficiencyverbetering.

      2 Uitgaven als bedoeld in het eerste lid, voor identieke investeringen zijn uitsluitend subsidiabel in geval van
      uitgaven gedaan binnen 4 jaar na de factuurdatum van de laatste factuur voor de eerste investering.

      3 Onder de uitgaven, bedoeld in het eerste lid, vallen kosten voor de interface van ICT systemen voor logistieke
      planning, inclusief de benodigde aanpassingen ten behoeve van de werking van de interface, met:

      a. een aanvoerregistratiesysteem;

      b. een verkoopsysteem;

      c. het verladingssysteem;

      d. een orderregistratiesysteem, of

      e. een facturatiesysteem.

      4 Uitgaven als bedoeld in het eerste lid op locatie van de leden van de producentenorganisatie zijn slechts
      subsidiabel indien de producentenorganisatie kan aantonen dat zij integraal onderdeel uitmaken van het systeem voor
      logistieke planning van de producentenorganisatie.

      5 Uitgaven als bedoeld in het eerste lid, zijn subsidiabel indien de producentenorganisatie aan de minister op
      basis van een offerte kan aantonen dat het ICT systeem uitsluitend bestemd is voor de functionaliteiten, genoemd in
      het eerste lid.

      6 Uitgaven voor het verder uitrollen van ICT systemen voor logistieke planning zijn niet subsidiabel.

      7 Bij de indiening van het operationeel programma wordt een onderbouwd plan overlegd met daarin:

      a. een gedetailleerde beschrijving van het project;

      b. een begroting van de investeringskosten;

      c. een definiëring van de onderdelen van de investeringskosten;

      d. een verdeling van de subsidiabele en niet-subsidiabele kosten met bijbehorende begrote bedragen, en

      e. een gedetailleerde beschrijving van de functionaliteit van de verschillende onderdelen door de leverancier.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel156
  - number: '157'
    text: |-
      1 Uitgaven van de producentenorganisatie voor koeling van producten ten behoeve van lange bewaring zijn
      subsidiabel, indien het gaat om:

      a. koelhuizen,

      b. koelcellen,

      c. koelinstallaties en

      d. vriescellen.

      2 De producentenorganisatie overlegt jaarlijks bij de indiening van de steunaanvraag aan de minister een overzicht
      van de gekoelde hoeveelheden product, met uitsplitsing naar gewas en type klant.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel157
  - number: '158'
    text: |-
      1 Uitgaven van de producentenorganisatie voor investeringen in conditioneringssystemen ten behoeve van lange
      bewaring van producten zijn subsidiabel.

      2 Uitgaven als bedoeld in het eerste lid zijn niet subsidiabel indien het gaat om:

      a. installaties of apparatuur voor conditionering van champignon- en witloftrekcellen, en

      b. droogsystemen voor de aanzuiging van buitenlucht ten behoeve van knoflook.
