  - number: '42'
    text: |-
      De waarde van de afgezette productie die is gerealiseerd door verkoop van producten van leden die op 1
      januari van het uitvoeringsjaar waarvoor de waarde van de afgezette productie wordt berekend niet meer bij
      de producentenorganisatie zijn aangesloten, wordt aantoonbaar uit de waarde van de afgezette productie van de
      producentenorganisatie verwijderd voor het betreffende jaar.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel42
  - number: '43'
    text: |-
      1 Producentenorganisaties laten een extern accountant een controle uitvoeren en een controleverklaring over
      de juistheid van de opgave van de waarde van de afgezette productie van de producentenorganisatie opstellen,
      met gebruikmaking van een door de minister beschikbaar gesteld model, alsmede een verslag over de verrichte
      werkzaamheden.

      2 Producentenorganisaties overleggen jaarlijks uiterlijk op 2 december aan de minister:

      a. de definitieve opgave van de waarde van de afgezette productie, met gebruikmaking van een door de minister
      beschikbaar gesteld middel, en

      b. de in het eerste lid bedoelde controleverklaring met het bijbehorende verslag.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel43
  - number: '44'
    text: |-
      1 De wijze van berekening van de financiële bijdragen aan het actiefonds, bedoeld in artikel 32, eerste
      lid, onderdeel a, van [verordening 1308/2013](32013R1308), wordt door de producentenorganisatie of unie van
      producentenorganisaties vastgelegd in haar statuten.

      2 De financiële bijdragen van de leden, bedoeld in artikel 32, eerste lid, onderdeel a, onderdeel i of ii, van
      [verordening 1308/2013](32013R1308), kunnen op basis van objectieve criteria worden onderscheiden.

      3 Ter uitvoering van artikel 25, tweede lid, van [verordening 2017/891](32791R2017) wordt het besluit van de
      producentenorganisatie of unie van producentenorganisaties tot vaststelling van de financiële bijdragen aan het
      actiefonds, bedoeld in artikel 32, eerste lid, onderdeel a, van [verordening 1308/2013](32013R1308) goedgekeurd
      door de algemene vergadering van de producentenorganisatie.

      4 In aanvulling op artikel 5 van [verordening 2017/892](32792R2017) overlegt een producentenorganisatie of unie
      van producentenorganisaties voor 8 december van het jaar waarin een operationeel programma, of een wijziging als
      bedoeld in artikel 34, eerste lid, van [verordening 2017/891](32791R2017) daarvan, voor goedkeuring is voorgelegd
      aan de minister bewijstukken waarmee wordt aangetoond dat de goedkeuring van het besluit tot vaststelling van de
      bijdragen aan het actiefonds door de algemene vergadering, bedoeld in het derde lid, heeft plaatsgevonden.

      5 Indien in een jaar sprake is van een tekort van het actiefonds, kunnen tot en met 14 februari van het volgende
      jaar financiële bijdragen als bedoeld in artikel 32, eerste lid, onderdeel a, van [verordening 1308/2013]
      (32013R1308) aan het actiefonds worden gedaan.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel44
  - number: '45'
    text: |-
      1 Door de producentenorganisatie of unie van producentenorganisaties wordt voor het actiefonds:

      a. een bankrekening geopend;

      b. een grootboekrekening gereserveerd, of

      c. een aparte kostenplaats aangemaakt.

      2 De afsluiting van het kwartaal of het jaar in de administratie van de grootboekrekening of bankrekening van het
      actiefonds van de producentenorganisatie of unie van producentenorganisaties sluit direct aan op kwartaalrapportage
      of de jaarrapportage.

      3 Het saldo van de eigen bijdragen van leden aan het actiefonds van de producentenorganisatie of unie van
      producentenorganisaties is op 14 februari van enig jaar groter dan of gelijk aan nul.

      4 De producentenorganisatie of unie van producentenorganisaties laat een extern accountant een controle uitvoeren
      en, met gebruikmaking van een door de minister beschikbaar gesteld model, een controleverklaring afleggen over:

      a. de juistheid van de in het tweede lid bedoelde afsluiting, en

      b. de naleving van de voorschriften inzake het beheer van het actiefonds, bedoeld in artikel 24 van [verordening
      2017/891](32791R2017).
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel45
  - number: '46'
    text: |-
      1 De producentenorganisatie of unie van producentenorganisaties informeert jaarlijks na afloop van het
      uitvoeringsjaar haar leden in een algemene vergadering over de realisatie van het operationeel programma gedurende
      het voorgaande uitvoeringsjaar, in het bijzonder voor wat betreft:

      a. de bedragen die per project over het uitvoeringsjaar zijn gerealiseerd;

      b. welke investeringen van € 100.000 en hoger gedurende het uitvoeringsjaar op locatie van de
      producentenorganisatie of unie van producentenorganisaties zijn gerealiseerd, en

      c. welke investeringen van € 50.000 en hoger gedurende het uitvoeringsjaar op andere locaties zijn gerealiseerd,
      onder vermelding van het adres van de locaties.

      2 De producentenorganisatie of unie van producentenorganisaties overlegt aan de minister jaarlijks voor 1 juli na
      enig uitvoeringsjaar bewijsstukken waaruit blijkt dat het voldaan heeft aan haar informatieverplichting als bedoeld
      in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel46
  - number: '47'
    text: |-
      1 Producentenorganisaties streven met hun operationeel programma minimaal elk van de volgende strategische doelen
      na:

      a. verduurzaming, en

      b. marktgericht produceren.

      2 Producentenorganisaties kunnen met hun operationeel programma tevens het strategisch doel versterking
      afzetstructuur nastreven.

      3 De gekwantificeerde streefcijfers zijn voor Nederland:

      a. voor de strategische doelstelling verduurzaming voor de periode van 1 januari 2018 tot en met 1 januari 2019:

      1°. vermindering van de uitstoot van broeikasgassen;

      2°. het hergebruik van afvalstoffen;

      3°. het voorkomen van emissie van gewasbeschermingsmiddelen en nutriënten naar lucht, water en bodem;

      4°. het bevorderen van geïntegreerde productie, en

      5°. het bevorderen van omschakeling naar een biologische productiewijze;

      b. voor het strategische doel marktgericht produceren voor de periode van 1 januari 2017 tot en met 31 december
      2020:

      1°. van de totale omzet van Nederlandse producentenorganisaties is op 31 december 2020 15% afkomstig uit de afzet
      van nieuwe producten of nieuwe concepten op bestaande markten of het aanboren van nieuwe afzetkanalen en markten;

      2°. een jaarlijkse toename van 2,5% van de omzet per areaal;

      3°. een toename van het aantal producten dat wordt afgezet in een hogere kwaliteitsklasse of met een onderscheidend
      kwaliteitslabel, en

      4°. een jaarlijkse groei van 5% van de omzet van biologisch gecertificeerde productie in groente en fruit.

      c. voor de strategische doelstelling versterking afzetstructuur voor de periode van 1 januari 2017 tot en met 31
      december 2020:

      1°. verdergaande samenwerking tussen producentenorganisaties;

      2°. een toename van de organisatiegraad per subsector met 15% van het aangesloten areaal op 31 december 2020 ten
      opzichte van 1 januari 2014.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel47
  - number: '48'
    text: |-
      1 In aanvulling op de gegevens, bedoeld in artikel 4 van [verordening 2017/892](32792R2017), bevat een operationeel
      programma de visie van de producentenorganisatie voor de toekomst van de producentenorganisatie.

      2 In de visie van de producentenorganisatie, bedoeld in het eerste lid, is ten minste een beschrijving opgenomen
      van:

      a. het toekomstbeeld dat de producentenorganisatie nastreeft en aan het einde van de looptijd van het operationeel
      programma wil hebben gerealiseerd, en

      b. de wijze waarop dit toekomstbeeld past binnen de strategische doelstellingen bedoeld in artikel 47.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel48
  - number: '49'
    text: |-
      De beschrijving van de uitgangssituatie, bedoeld in artikel 4, eerste lid, onderdeel a, van [verordening 2017/892]
      (32792R2017) bevat een SWOT analyse waarin tenminste:

      a. een beschrijving en onderbouwing is opgenomen van de sterke en zwakke punten van de producentenorganisatie, en

      b. een beschrijving en onderbouwing is opgenomen van de kansen en bedreigingen voor de producentenorganisatie
      bij het realiseren van de visie, bedoeld in [artikel 48][ref1], en de strategische doelen, bedoeld in
      [artikel 47][ref2], van de producentenorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0039769#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0039769#Artikel47
