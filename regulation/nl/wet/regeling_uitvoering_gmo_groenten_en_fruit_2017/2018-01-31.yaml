      1 Uitgaven van producentenorganisaties voor investeringen in ICT systemen voor markt en afzet zijn subsidiabel
      indien het systeem tot doel heeft:

      a. kwaliteitsverbetering van het proces;

      b. koppeling van vraag aan aanbod, of

      c. efficiencyverbetering.

      2 Uitgaven als bedoeld in het eerste lid, voor identieke investeringen zijn uitsluitend subsidiabel in geval van
      uitgaven gedaan binnen 4 jaar na de factuurdatum van de laatste factuur voor de eerste investering.

      3 De producentenorganisatie overlegt jaarlijks bij de indiening van de steunaanvraag aan de minister een overzicht
      van het aantal systemen, bedoeld in het eerste lid, en het aantal aansluitingen van haar klanten op deze systemen.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel164
  - number: '165'
    text: |-
      1 Uitgaven van producentenorganisaties voor investeringen in ICT systemen voor customer relationship management
      zijn subsidiabel.

      2 Uitgaven als bedoeld in het eerste lid, voor identieke investeringen zijn uitsluitend subsidiabel in geval van
      uitgaven gedaan binnen 4 jaar na de factuurdatum van de laatste factuur voor de eerste investering.

      3 Onder de uitgaven, bedoeld in het eerste lid, vallen kosten voor de interface van de ICT systemen voor customer
      relationship management, inclusief de benodigde aanpassingen ten behoeve van de werking van de interface, met:

      a. een aanvoerregistratiesysteem;

      b. een verkoopsysteem;

      c. het verladingssysteem;

      d. een orderregistratiesysteem, of

      e. een facturatiesysteem.

      4 Uitgaven als bedoeld in het eerste lid op locatie van de leden van de producentenorganisatie zijn slechts
      subsidiabel indien de producentenorganisatie kan aantonen dat zij integraal onderdeel uitmaken van het ICT systeem
      voor customer relationship management van de producentenorganisatie.

      5 Uitgaven voor het verder uitrollen van ICT systemen voor customer relationship management zijn niet subsidiabel.

      6 In geval van de uitgaven, bedoeld in het eerste lid, wordt door de producentenorganisatie aan de minister bij de
      indiening van het operationeel programma een onderbouwd plan overlegd met daarin:

      a. een gedetailleerde beschrijving van het project;

      b. een begroting van de investeringskosten;

      c. een definiëring van de onderdelen van de investeringskosten;

      d. een verdeling van de subsidiabele en niet-subsidiabele kosten met bijbehorende begrote bedragen, en

      e. een gedetailleerde beschrijving van de functionaliteit van de verschillende onderdelen door de leverancier.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel165
  - number: '166'
    text: |-
      1 Uitgaven van de producentenorganisatie ten behoeve van de bundeling van productstromen zijn subsidiabel, indien
      het gaat om op afzetverbetering gerichte investeringen in:

      a. sorteer- en verpakcentra:

      b. distributiecentra;

      c. verwerkingscentra;

      d. fustopslag;

      e. dockboards, of

      f. sorteer- en verpakkingslijnen.

      2 Uitgaven als bedoeld in het eerste lid zijn niet subsidiabel indien het gaat om:

      a. investeringen ter vervanging van oude centra als bedoeld in het eerste lid;

      b. standaard sorteer- en verpakkingslijnen op teeltbedrijven en op bestaande locaties van de
      producentenorganisatie;

      c. met de sorteerlijn geïntegreerde aanvoerprognosesystemen;

      3 De producentenorganisatie overlegt jaarlijks bij de indiening van de steunaanvraag aan de minister een overzicht
      van de hoeveelheden product waarvan de productstroom gebundeld is met behulp van de investeringen bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel166
  - number: '167'
    text: |-
      1 Uitgaven van de producentenorganisatie in vollegrondsteelt zijn subsidiabel indien:

      a. het gaat om investeringen in gecombineerde oogst-, sorteer- en verpakkingssystemen, waaronder apparatuur,
      bestemd voor het reinigen, sorteren, wegen of verpakken van de in de grond geteelde gewassen, en

      b. de investeringen gebruikt worden in het veld direct na de oogstfase.

      2 In geval van een geïntegreerd systeem met een oogstmachine zijn de meerkosten van de toegevoegde functies ten
      opzichte van een vergelijkbare oogstmachine zonder extra functies als uitgaven als bedoeld in het eerste lid,
      subsidiabel.

      3 Indien de in het eerste lid bedoelde uitgaven een mobiel pakstation betreffen, zijn maximaal twee in het
      pakstation geïntegreerde wagens subsidiabel.

      4 Investeringen in aparte oogstsystemen en tractoren zijn niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel167
  - number: '168'
    text: |-
      Uitgaven van producentenorganisaties voor ICT systemen voor markt en afzet, bedoeld in artikel 164, eerste lid,
      inclusief personeelskosten, zijn subsidiabel indien het gaat om de kosten van de benodigde aanpassingen van het
      systeem en de interface, inclusief de benodigde aanpassingen ten behoeve van de werking van de interface, met:

      a. een aanvoerregistratiesysteem;

      b. een verkoopsysteem;

      c. een verladingssysteem;

      d. een orderregistratiesysteem, of

      e. een facturatiesyteem
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel168
  - number: '169'
    text: |-
      1 Uitgaven van de producentenorganisatie ten behoeve van het ontwerpen, bouwen en implementeren van ICT systemen
      voor customer relationship management systemen als bedoeld in [artikel 165, eerste lid][ref1], inclusief
      personeelskosten, zijn subsidiabel.

      2 Bij de indiening van het operationeel programma overlegt de producentenorganisatie aan de minister:

      a. een begroting van het aantal uren per taak of functie, en

      b. een omschrijving van de taken en functies.


      [ref1]: https://wetten.overheid.nl/BWBR0039769#Artikel165
