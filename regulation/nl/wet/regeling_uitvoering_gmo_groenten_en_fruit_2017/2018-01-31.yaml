    text: |-
      1 Uitgaven van de producentenorganisatie voor het groen oogsten en niet oogsten van producten als bedoeld in
      artikel 33, derde lid, onderdeel g, van [verordening 1308/2013](32013R1308) zijn subsidiabel.

      2 Als producten bedoeld in artikel 33, derde lid, onderdeel g, van [verordening 1308/2013](32013R1308) worden
      aangewezen:

      a. tomaten met GN code 0702 00 00;

      b. wortels met GN code 0706 10 00;

      c. witte kool en rode kool met GN code 0704 90 10;

      d. niet-scherpsmakende pepers (paprika’s) met GN code 0709 60 10;

      e. bloemkool en broccoli met GN code 0704 10 00;

      f. komkommers met GN code 0707 00 05;

      g. augurken met GN code 0707 00 90;

      h. champignons Agaricus met GN code 0709 51 00;

      i. appelen met GN code 0808 10;

      j. peren met GN code 0808 30;

      k. pruimen met GN code 0809 40 05, en

      l. rood fruit met GN codes 0810 20, 0810 30 en 0810 40.

      3 Uitgaven voor het groen oogsten en niet oogsten van percelen beplant met appelbomen of perenbomen jonger dan twee
      jaar, zijn niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel191
  - number: '192'
    text: |-
      De minister stelt de voor groen oogsten en niet oogsten te betalen vergoedingen, vast overeenkomstig artikel 48,
      vierde lid, van [verordening 2017/891](32791R2017).
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel192
  - number: '193'
    text: |-
      1 Een voorafgaande melding als bedoeld in artikel 48, vijfde lid, van [verordening 2017/891](32791R2017), wordt
      elektronisch ingediend bij de minister.

      2 In de melding wordt het door de minister toegekende registratienummer van het toepasselijke perceel
      of de registratienummers van de toepasselijke percelen, zoals vermeld op het formulier, bedoeld in de
      [Regeling landbouwtelling en gecombineerde opgave][ref1] zoals die geldt op het moment waarop de melding wordt
      gedaan, opgegeven.

      3 Ten behoeve van de in het eerste lid bedoelde melding maakt de producentenorganisatie of unie van
      producentenorganisaties gebruik van een door de minister beschikbaar gesteld middel.

      4 Indien de melding plaatsvindt voor 0:00 uur, vindt de controle, bedoeld in artikel 31, eerste en tweede lid, van
      [verordening 2017/892](32792R2017) uiterlijk de derde werkdag plaats;


      [ref1]: https://wetten.overheid.nl/BWBR0039257
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel193
    references:
      - id: ref1
        bwb_id: BWBR0039257
  - number: '194'
    text: |-
      Voor producten waarvan de normale oogst reeds begonnen is maar die een langere oogstperiode dan een maand hebben
      wordt de resterende oogstcapaciteit door de producentenorganisatie ten genoegen van de minister bepaald aan de
      hand van:

      a. afleverbonnen van de planten;

      b. de normale productiecyclus van een gewas, en

      c. de oorspronkelijk geplande ruimdatum.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel194
  - number: '195'
    text: |-
      1 De producentenorganisatie voert het vernietigde gewas, indien van toepassing, of het groen geoogste product af.

      2 Als toegestane bestemmingen voor de in het eerste lid bedoelde afvoer worden aangewezen:

      a. afvalverwerkers, en

      b. veehouders ten behoeve van vervoedering.

      3 Afvalverwerkers bedoeld in het tweede lid, onderdeel a, beschikken over een geldige milieuvergunning.

      4 Producentenorganisaties sluiten schriftelijke overeenkomsten met afnemers als bedoeld in het tweede lid en
      transporteurs van de in het eerste lid bedoelde gewassen en producten met gebruikmaking van een door de minister
      beschikbaar gesteld model, waarin de afnemers en transporteurs worden verplicht:

      a. tot naleving van de voorwaarden uit artikel 47, tweede lid, van [verordening 2017/891](32791R2017), inclusief
      het voeren van een aparte voorraadboekhouding voor de betrokken concrete acties;

      b. bij ontvangst van de in het eerste lid bedoelde gewassen en producten de daarbij behorende door de minister ter
      beschikking gestelde vrachtbrief te ondertekenen, en

      c. de vrachtbrief, bedoeld in onderdeel b, en de overeenkomst met de producentenorganisatie gedurende tenminste 7
      kalenderjaren, volgend op het kalenderjaar waarin het verkoopseizoen eindigt, te bewaren.

      5 In aanvulling op het vierde lid worden ontvangers van de gewassen en producten bedoeld in het eerste lid
      verplicht om deze gewassen en producten:

      a. een niet voor menselijke consumptie geschikte bestemming te geven die:

      1°. de normale afzet van de betrokken productie niet in de weg staat, en

      2°. geen negatieve milieu-impact of negatieve fytosanitaire gevolgen heeft als bedoeld in artikel 46, eerste lid,
      van [verordening 2017/891](32791R2017), en

      b. bij ontvangst per vracht te wegen en de weegbrieven gedurende tenminste 7 kalenderjaren, volgend op het
      kalenderjaar waarin het verkoopseizoen eindigt, te bewaren.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel195
  - number: '196'
    text: |-
      1 Uitgaven voor premies ten behoeve van een oogstverzekering als bedoeld in artikel 33, derde lid, onderdeel
      h, van [verordening 1308/2013](32013R1308) en de artikelen 50 en 51 van [verordening 2017/891](32791R2017) zijn
      subsidiabel indien de producentenorganisatie voor die verzekering een raamovereenkomst met de verzekeraar heeft
      gesloten, of:

      a. de oogstverzekering op naam van de producentenorganisatie is gesteld, en

      b. de uitgaven door de producentenorganisatie worden gedaan.

      2 Uitgaven als bedoeld in het eerste lid zijn slechts subsidiabel indien zij betrekking hebben op het deel van de
      polis dat betrekking heeft op gewasschade als gevolg van weersomstandigheden of klimatologische omstandigheden.

      3 Uitgaven als bedoeld in het eerste lid, zijn uitsluitend subsidiabel indien zij daadwerkelijk betaald zijn,
      met uitzondering van assurantiebelasting en polis- of andere soortgelijke kosten onder aftrek van kortingen en
      retributies op pro rato basis van de betaalde premies.

      4 Indien de oogstverzekering, bedoeld in het eerste lid, uitsluitend dekking biedt tegen ongunstige
      weersomstandigheden vindt artikel 34, derde lid, van [verordening 1308/2013](32013R1308) geen toepassing.

      5 Bij de indiening van de steunaanvraag wordt door de producentenorganisatie aan de minister, met gebruikmaking van
      een door de minister beschikbaar gesteld middel, in geval van de uitgaven, bedoeld in het eerste lid, informatie
      overlegd over de verzekering en de daaraan deelnemende leden.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel196
  - number: '197'
    text: |-
      Uitgaven van de producentenorganisatie voor activiteiten ter realisatie van het doel versterking afzetstructuur,
      bedoeld in [artikel 47, tweede lid][ref1], en ter uitvoering van de maatregel, bedoeld in artikel 2, onderdeel f,
      onder viii, van [verordening 2017/891](32791R2017), zijn subsidiabel, indien wordt voldaan aan:

      a. [deel 4, hoofdstuk 3][ref2], en

      b. deze afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0039769#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0039769#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel197
