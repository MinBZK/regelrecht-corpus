      - id: ref1
        bwb_id: BWBR0039769
        artikel: '68'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0039769
        artikel: '68'
        hoofdstuk: '3'
  - number: '65'
    text: |-
      1 Voor de kosten, bedoeld in [artikel 63, onderdeel c][ref1], geldt een forfaitair uurtarief van € 40.

      2 Wanneer een lid van een producentenorganisatie meerdere eigenaren of directeuren heeft, geeft de
      producentenorganisatie bij de indiening van het operationeel programma aan welke eigenaar of directeur de
      activiteiten zal uitvoeren en welke personeelskosten daarvoor worden opgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0039769#Artikel63
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0039769
        artikel: '63'
        hoofdstuk: '3'
  - number: '66'
    text: |-
      1 Onder vakbekwaam personeel als bedoeld in punt twee, onderdeel b, van bijlage III van [verordening 2017/891]
      (32791R2017), wordt verstaan personeel met een werk- en denkniveau met minimaal het opleidingsniveau van het
      middelbaar beroepsonderwijs, dat is verkregen door:

      a. een afgeronde opleiding, of

      b. ervaring en specifieke vakkennis.

      2 De eisen omtrent vakbekwaamheid, bedoeld in het eerste lid, worden door de producentenorganisatie opgenomen
      in door de directie of het bestuur geaccordeerde functieprofielen, welke worden opgenomen in de administratieve
      organisatie van de producentenorganisatie.

      3 De producentenorganisatie overlegt bij de indiening van het operationeel programma of een verzoek tot wijziging
      van een operationeel programma aan de minister, ter onderbouwing van de vakbekwaamheid van het personeel, bedoeld
      in het eerste lid:

      a. de door de directie of het bestuur van de producentenorganisatie geaccordeerde functieprofielen, en

      b. een volledige taakomschrijving per subsidiabele activiteit van het voor die activiteit ingezette personeel.

      4 De verplichting opgenomen in het derde lid is slechts van toepassing op een verzoek tot wijziging van een
      operationeel programma voor zover hiermee functies worden opgevoerd die niet eerder in het operationeel programma
      waren opgenomen.

      5 De minister kan, ter onderbouwing van de vakbekwaamheid, bedoeld in het eerste lid, schriftelijke bewijsstukken
      opvragen.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel66
  - number: '67'
    text: |-
      1 De producentenorganisatie houdt ter onderbouwing van de gewerkte uren, bedoeld in punt twee, onderdeel b, van
      bijlage III van [verordening 2017/891](32791R2017), een volledige urenadministratie bij die minimaal één keer per
      maand geparafeerd en gedateerd wordt door:

      a. de betreffende medewerker, en

      b. de projectleider of leidinggevende.

      2 Op verzoek van de minister overlegt de producentenorganisatie de urenadministratie bedoeld in het eerste lid.

      3 De medewerker, bedoeld in het eerste lid onderdeel a, mag niet dezelfde persoon zijn als de projectleider of
      leidinggevende, bedoeld in het eerste lid onderdeel b.

      4 De urenadministratie, bedoeld in het eerste lid:

      a. wordt bijgehouden gedurende het hele kalenderjaar of voor de duur van de arbeidsovereenkomst van de medewerker
      wiens inzet wordt toegerekend aan een subsidiabele activiteit;

      b. omvat alle uren waarvoor de betreffende medewerker een arbeidscontract heeft, waaronder de uren die niet worden
      toegerekend aan subsidiabele activiteiten;

      c. bevat een korte en duidelijke omschrijving van ter uitvoering van de subsidiabele activiteit verrichte
      werkzaamheden, en

      d. geeft duidelijk weer voor hoeveel uren de betreffende medewerker wordt ingezet:

      1°. per activiteit, en

      2°. voor niet-subsidiabele activiteiten.

      5 De minister kan, in afwijking van het vierde lid, onderdeel d, op verzoek van een producentenorganisatie
      schriftelijk toestemming verlenen om de onderverdeling, bedoeld in het derde lid, onderdeel d, te maken aan de hand
      van een andere deugdelijke onderbouwing.

      6 Indien managers of leidinggevenden uren maken ter uitvoering van een activiteit blijkt uit de urenadministratie,
      bedoeld in het eerste lid, dat managementactiviteiten en beheersmatige activiteiten niet zijn toegerekend aan
      subsidiabele activiteiten.

      7 Het aantal uren waarvoor in de steunaanvraag per activiteit steun wordt aangevraagd overschrijdt niet het aantal
      uren dat ingevolge de goedkeuring van het operationeel programma of het verzoek tot wijziging daarvan voor deze
      activiteit is goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel67
  - number: '68'
    text: |-
      1 De producentenorganisatie onderbouwt de loonkosten, bedoeld in [artikel 63, onderdeel a][ref1], van de
      subsidiabele activiteiten aan de hand van uurtarieven op basis van het jaarsalaris van de desbetreffende
      medewerkers.

      2 In het uurtarief, bedoeld in het eerste lid, kan worden opgenomen:

      a. het contractueel of bij CAO overeengekomen brutoloon;

      b. een bij contract of CAO overeengekomen niet winstafhankelijke dertiende maand;

      c. een onregelmatigheidstoeslag;

      d. een ploegentoeslag;

      e. het werkgeversdeel sociale verzekeringswetten;

      f. de voor rekening van de werkgever komende kosten voor de ziektekostenverzekering;

      g. het werkgeversdeel pensioen en vervroegde uittreding, en

      h. dotaties aan pensioenvoorzieningen voor zover onderbouwd kan worden dat hier rechtens afdwingbare verplichtingen
      tegenover staan.

      3 Ten behoeve van de berekening van het uurtarief, bedoeld in het eerste lid, wordt het jaarsalaris gedeeld door:

      a. het aantal uur dat de overeengekomen werkweek bedraagt vermenigvuldigd met 43 werkweken, of

      b. in geval van een niet volledig gewerkt jaar, het aantal uur dat de overeengekomen werkweek bedraagt
      vermenigvuldigd met het aantal werkweken in het desbetreffende jaar vermenigvuldigd met 0,827.

      4 Overwerktoeslagen worden niet het in het eerste lid bedoelde uurtarief opgenomen.

      5 De producentenorganisatie overlegt bij de indiening van operationeel programma van één personeelslid een
      voorbeeld van de berekening aan de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0039769#Artikel63
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel68
