        bwb_id: BWBR0021670
      - id: ref2
        bwb_id: BWBR0021670
      - id: ref3
        bwb_id: BWBR0021670
  - number: '123'
    text: |-
      1 Uitgaven voor biologische of geïntegreerde gewasbescherming en het voorkomen van ziekten en plagen zijn
      subsidiabel indien het gaat om:

      a. verblazingsapparatuur voor het effectief doseren van natuurlijke vijanden;

      b. een scoutbox voor automatische detectie en diagnose van plagen, en

      c. vlieglampen en sporenfilters voor de champignonteelt.

      2 In afwijking van het eerste lid zijn de volgende uitgaven niet subsidiabel:

      a. afdichtingsmateriaal ten behoeve van het afdichten van champignoncellen;

      b. messen ter voorkoming van verspreiding van virussen, en

      c. grondstomen en stomen van materialen in de kas.

      3 Uitgaven voor een softwarelicentie voor een scoutbox als bedoeld in het eerste lid onderdeel b, gedaan voor
      het einde van het kwartaal dat de factuurdatum van de laatste factuur voor de scoutbox omvat, zijn eenmalig
      subsidiabel.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel123
