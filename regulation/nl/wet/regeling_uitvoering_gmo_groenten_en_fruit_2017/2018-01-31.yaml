  - number: '58'
    text: |-
      Indien een producentenorganisatie of unie van producentenorganisaties de uitvoering van haar operationele programma
      voor het einde van de geplande looptijd ervan stopzet, meldt zij dit onverwijld aan de minister.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel58
  - number: '59'
    text: |-
      Een verzoek om bij fusie operationele programma’s parallel uit te voeren tot het einde van de looptijd, als bedoeld
      in artikel 15, tweede lid, van [verordening 2017/891](32791R2017), wordt ingediend voor 15 juli van het jaar van
      de fusie.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel59
  - number: '60'
    text: |-
      1 De uitgaven, bedoeld in dit hoofdstuk, zijn subsidiabel indien zij op grond van hoofdstuk 4 van dit deel
      subsidiabel worden gesteld.

      2 De uitgaven, bedoeld in [bijlage I][ref1], zijn niet subsidiabel.

      3 Ter uitvoering van artikel 30, derde lid van [verordening 2017/891](32791R2017) is het steunniveau
      voor activiteiten die subsidiabel zijn op grond van hoofdstuk 4 van dit deel, waarvoor door leden van de
      producentenorganisatie of van een bij de unie van producentenorganisaties aangesloten producentenorganisatie tevens
      subsidie kan worden aangevraagd op grond van [verordening 1305/2013](32013R1305), niet hoger dan het maximale
      steunbedrag voor deze activiteiten op grond van [verordening 1305/2013](32013R1305).

      4 Ter uitvoering van artikel 30, zesde lid, van [verordening 2017/891](32791R2017) zijn activiteiten niet
      subsidiabel als voor die activiteiten subsidie is verleend uit hoofde van een afzetbevorderingsprogramma dat in
      het kader van verordening (EU) nr. 1144/2014 van het Europees Parlement en de Raad van 22 oktober 2014 inzake
      voorlichtings- en afzetbevorderingsacties betreffende landbouwproducten uitgevoerd op de interne markt en in
      derde landen en tot intrekking van [Verordening (EG) nr. 3/2008](32008R0003) van de Raad (PB EU 2014 L 317) is
      goedgekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0039769
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0039769
  - number: '61'
    text: |-
      Indien subsidiabele uitgaven worden onderbouwd met een factuur:

      a. wordt deze geaccordeerd door de projectleider die verantwoordelijk is voor de uitvoering van de activiteit
      waarvoor de uitgaven zijn gedaan, en

      b. bevat deze een omschrijving waaruit blijkt:

      1°. welke werkzaamheden zijn uitgevoerd of diensten zijn aangekocht, en

      2°. waar en wanneer deze werkzaamheden of diensten zijn uitgevoerd of aangekocht.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel61
  - number: '62'
    text: |-
      Bij het bepalen van de factuurdatum van de laatste factuur voor een duurzaam productiemiddel worden facturen voor
      eventueel onvoorzien meerwerk niet meegerekend.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel62
  - number: '63'
    text: |-
      Onder personeelskosten als bedoeld in punt twee van bijlage III van [verordening 2017/891](32791R2017) worden
      verstaan:

      a. de loonkosten voor personeel in dienst van:

      1°. de producentenorganisatie, of

      2°. een dochteronderneming die voor minimaal 90% eigendom is van de producentenorganisatie;

      b. de kosten voor het inhuren van gedetacheerd personeel en uitzendkrachten ingehuurd door de in onderdeel a
      genoemde ondernemingen, en

      c. de arbeidskosten van:

      1°. een lid, indien het lid een natuurlijk persoon is, of

      2°. de eigenaar of directeur van een lid, indien het lid een rechtspersoon is.
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel63
  - number: '64'
    text: |-
      1 Personeelskosten zijn subsidiabel voor maximaal:

      a. 90% van het aantal uren, bedoeld in [artikel 68, derde lid][ref1], of

      b. 80% van het aantal uren, bedoeld in [artikel 68, derde lid][ref2], in geval van managers en leidinggevenden.

      2 Uren worden alleen aan een activiteit toegerekend wanneer de producentenorganisatie aannemelijk maakt dat:

      a. de uren aan de betreffende activiteit zijn besteed, en

      b. de verhouding tussen de bestede uren en de omvang van de betreffende activiteit redelijk is.

      3 Personeelskosten voor managementactiviteiten en beheersmatige activiteiten zijn niet subsidiabel.

      4 Activiteiten van leden van de directie of het bestuur van een producentenorganisatie of een dochteronderneming
      zijn niet subsidiabel.

      5 De minister kan, op verzoek van een producentenorganisatie, in afwijking van het vierde lid, besluiten dat
      personeelskosten voor een lid van de directie of het bestuur subsidiabel zijn, indien het kosten betreft voor
      concrete en aantoonbare activiteiten ter uitvoering van een activiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0039769#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0039769#Artikel68
    url: https://wetten.overheid.nl/BWBR0039769/2018-01-31#Artikel64
