  - number: '3'
    text: |-
      1 Bij het doen van de aangifte ten invoer van de in [artikel 2, eerste lid][ref1], genoemde goederen, wordt,
      behoudens bij invoer uit het vrije verkeer van België of Luxemburg een naar waarheid ingevuld formulier L, als
      bedoeld in [artikel 37 van de Douaneregeling][ref2], dan wel op een formulier zekerheidstelling als bedoeld in de
      [Regeling in- en uitvoer landbouwgoederen][ref3] overgelegd.

      2 Op het formulier L in enkelvoud, als bedoeld in [artikel 37 van de Douaneregeling][ref4], dan wel op een
      formulier zekerheidstelling als bedoeld in de [Regeling in- en uitvoer landbouwgoederen][ref5] worden alle
      gegevens vermeld die nodig zijn voor de toepassing van de onderhavige beschikking. Met name dient de soort alcohol
      (synthetische alcohol of alcohol uit landbouwprodukten) te worden vermeld.

      3 De rijksbelastingdienst zendt terstond nadat de ten invoer aangegeven goederen ter beschikking van de aangever
      zijn gesteld het formulier L in enkelvoud, als bedoeld in [artikel 37 van de Douaneregeling][ref6], dan wel op
      een formulier zekerheidstelling als bedoeld in de [Regeling in- en uitvoer landbouwgoederen][ref7] toe aan het
      Hoofdproductschap.


      [ref1]: https://wetten.overheid.nl/BWBR0003711#Artikel2
