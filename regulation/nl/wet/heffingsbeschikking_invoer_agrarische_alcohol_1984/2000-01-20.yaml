  - number: '7'
    text: |-
      Het Hoofdproductschap is bevoegd nadere regelen te stellen voor de juiste toepassing van het bepaalde in deze
      regeling.
    url: https://wetten.overheid.nl/BWBR0003711/2000-01-20#Artikel7
  - number: '8'
    text: |-
      1 De bevoegdheden tot:

      a. het opleggen van de heffing, bedoeld in [artikel 2][ref1];

      b. het bepalen van het beloop van de te stellen zekerheid, bedoeld in [artikel 4, tweede lid][ref2];

      c. het stellen van nadere regelen, als bedoeld in [artikel 7][ref3], zijn overgedragen aan het bestuur van het
      Hoofdproductschap.

      2 Met betrekking tot het uitoefenen van de in het vorige lid overgedragen bevoegdheden wordt het bepaalde in
      de verordening in acht genomen en is [artikel 120 van de Regeling in- en uitvoer landbouwgoederen][ref4] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003711#Artikel2
