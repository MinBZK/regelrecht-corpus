  - number: '4'
    text: |-
      1 De in [artikel 2][ref1] bedoelde heffing wordt opgelegd door het Hoofdproductschap en is verschuldigd door de
      importeur.

      2 De heffing dient binnen een door het Hoofdproduktschap te bepalen termijn aan het Hoofdproduktschap te worden
      betaald. Ter verzekering van de voldoening van de heffing dient bij en ten genoegen van het Hoofdproduktschap
      zekerheid te worden gesteld, voordat de aangifte ten invoer wordt gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003711#Artikel2
    url: https://wetten.overheid.nl/BWBR0003711/2000-01-20#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003711
        artikel: '2'
  - number: '5'
    text: |-
      1 Wanneer Frankrijk de in [artikel 2, lid 1][ref1], bedoelde heffing toepast, wordt in het vak ‘omschrijving van de
      goederen’ van het document dat wordt opgesteld om het communautaire karakter van het produkt te staven, de volgende
      vermeldingen aangebracht: ‘Compenserende heffing toegepast – [Verordening (EEG) nr. 2541/84](31984R2541)’, dan wel
      een zelfde vermelding in een van de andere officiële talen van de Gemeenschap.

      2 De in het vorige lid bedoelde vermelding wordt gewaarmerkt door het stempel van het Franse douanekantoor dat het
      betrokken document afgeeft.

      3 Wanneer het document dat wordt opgesteld om het communautaire karakter van het produkt te staven, door een
      nieuw document vervangen wordt, wordt daarop de in lid 1 bedoelde vermelding van het oorspronkelijke document
      aangebracht; deze vermelding wordt door het stempel van het bevoegde douanekantoor gewaarmerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0003711#Artikel2
    url: https://wetten.overheid.nl/BWBR0003711/2000-01-20#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003711
        artikel: '2'
  - number: 5a
    text: |-
      1 Ten bewijze dat de heffing ingevolge [artikel 2, derde lid][ref1], niet is verschuldigd, moet in het vak
      ‘omschrijving van de goederen’ van het document dat wordt opgesteld om het communautaire karakter van het produkt
      te staven, één van de volgende vermeldingen zijn aangebracht:

      ‘Produkt dat niet is verkregen uit landbouwprodukten in de zin van het Verdrag’.

      of

      ‘Produkt gedenatureerd overeenkomstig de in Frankrijk geldende voorschriften’, danwel een zelfde vermelding in een
      van de andere officiële talen van de Gemeenschap.

      2 De in het eerste lid bedoelde vermeldingen worden gewaarmerkt door het stempel van het Franse douanekantoor dat
      het bedoelde document heeft geviseerd of geldig gemaakt.

      3 Wanneer het document dat wordt opgesteld om het communautaire karakter van het produkten te staven, door
      een nieuw document vervangen wordt, wordt daarop een van de in het eerste lid bedoelde vermeldingen van het
      oorspronkelijke document aangebracht. Deze vermeldingen worden gewaarmerkt door het stempel van het douanekantoor
      dat het nieuwe document viseert of geldig maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0003711#Artikel2
    url: https://wetten.overheid.nl/BWBR0003711/2000-01-20#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0003711
        artikel: '2'
  - number: '6'
    text: |-
      Ten aanzien van de in [artikel 2][ref1] bedoelde invoer en de in [artikel 4][ref2]
      bedoelde heffing zijn de [artikel 3][ref3], [7, eerste lid, onder a][ref4], [63][ref5], en
      [64 van de Regeling in- en uitvoer landbouwgoederen][ref6] van overeenkomstige toepassing.


