preamble:
  text: |-
    Gelet op artikel 11 van de In- en uitvoerwet (Stb. 1962, 295) en op de artikelen 5 en 7 van het In- en
    uitvoerbesluit Landbouwgoederen 1980 (Stb. 1980, 758);

    In overeenstemming met de staatssecretaris van Financiën;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0003711/2000-01-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van het bij of krachtens deze regeling bepaalde wordt verstaan onder:



            Verdrag:

              [Verdrag tot oprichting van de Europese Gemeenschap](onbekend);



            Hoofdproductschap:

              Hoofdproductschap Akkerbouw.
    url: https://wetten.overheid.nl/BWBR0003711/2000-01-20#Artikel1
  - number: '2'
    text: |-
      1 Onverminderd hetgeen in andere wettelijke bepalingen is voorgeschreven zijn de navolgende goederen ter zake van
      het invoeren onderworpen aan een heffing van 0,075 ECU per % vol/hl, tenzij:

      a. is aangetoond, dat de goederen van oorsprong zijn uit een ander land dan Frankrijk, dan wel

      b. artikel 6 van de verordening van toepassing is, dan wel

      c. door middel van de door het bevoegde douanekantoor gewaarmerkte vermelding als bedoeld in
      [artikel 5, eerste lid][ref1], in het vak ‘omschrijving van de goederen’ van het document dat in de Lid-Staat van
      verzending wordt opgesteld om het communautaire karakter van het produkt te bewijzen, is aangetoond, dat de heffing
      reeds in een andere Lid-Staat is betaald.






                    *Post tarief van invoerrechten*


                    *Omschrijving*






                    ex 22071000, 22089999


                    Ethylalcohol, niet gedenatureerd, in verpakking inhoudende meer dan 2 liter






      2 In afwijking in zoverre van het eerste lid, zijn de aldaar genoemde goederen niet aan een heffing onderworpen
      indien Frankrijk de heffing bij uitvoer heeft toegepast. Alsdan is [artikel 5][ref2] van toepassing.

      3 De in het eerste lid bedoelde heffing is evenmin verschuldigd indien is aangetoond, dat de alcohol niet is
      verkregen uit landbouwprodukten in de zin van het Verdrag, of is gedenatureerd overeenkomstig de ter zake in
      Frankrijk geldende voorschriften. Alsdan is [artikel 5a][ref3] van toepassing.

      4 Ingval gebruik wordt gemaakt van een regeling inzake opslag in een inrichting voor douaneopslag zijn de
      gebruikelijke behandelingen bedoeld in artikel 1, eerste lid, punt 12 van de [Richtlijn 71/235/EEG](31971L0235)
      verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0003711#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003711#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0003711#Artikel5a
