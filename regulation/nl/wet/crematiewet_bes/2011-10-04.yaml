        hoofdstuk: III
  - number: '27.3'
    text: |-
      het verbranden van een lijk voordat dit ingevolge het bij [artikel 14, eerste lid][ref1], of krachtens artikel 14,
      tweede lid is toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028203#Artikel14
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel27
    references:
      - id: ref1
