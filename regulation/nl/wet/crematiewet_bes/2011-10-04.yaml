---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: crematiewet_bes
regulatory_layer: WET
publication_date: '2011-10-03'
valid_from: '2011-10-04'
bwb_id: BWBR0028203
url: https://wetten.overheid.nl/BWBR0028203/2011-10-04
articles:
  - number: '1'
    text: 'In deze wet wordt verstaan onder openbaar lichaam: het openbaar lichaam Bonaire, Sint Eustatius of Saba.'
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel1
  - number: 1a.1
    text: |-
      Lijkbezorging kan, onverminderd het daaromtrent in de [Begrafeniswet BES][ref1] bepaalde, eveneens geschieden door
      crematie.


      [ref1]: https://wetten.overheid.nl/BWBR0028363
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0028363
  - number: 1a.2
    text: Crematie van het lijk van een overleden persoon of doodgeboren kind geschiedt in een crematorium.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel1a
  - number: '2.1'
    text: |-
      De houder van een crematorium houdt een register van alle daar verbrande lijken, met een nauwkeurige aanduiding van
      de bestemming, welke aan de as is gegeven en van degene op wiens aanwijzing zulks is geschied.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel2
  - number: '2.2'
    text: |-
      Het in het eerste lid bedoelde register is openbaar en wordt bij opheffing van het crematorium overgebracht naar de
      archieven van het openbaar lichaam waarin het was gelegen.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel2
  - number: '2.3'
    text: Het model van het register wordt bij eilandsbesluit houdende algemene maatregelen vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel2
  - number: '3'
    text: |-
      Het is verboden een crematorium, dat niet op de voet van het bepaalde bij of krachtens deze wet is gevestigd of in
      werking is, alszodanig in werking te brengen of te houden.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel3
  - number: '4.1'
    text: |-
      Een crematorium kan slechts worden gevestigd en in werking gehouden door een kerkgenootschap dan wel door een
      privaatrechtelijke rechtspersoon of een natuurlijk persoon.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel4
  - number: '4.2'
    text: |-
      Onder kerkgenootschap wordt mede verstaan een onderdeel daarvan of een rechtspersoon, in het leven geroepen door
      een of meer kerkgenootschappen of onderdelen daarvan.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel4
  - number: '5.1'
    text: Het vestigen, uitbreiden of wijzigen van een crematorium behoeft vergunning van het bestuurscollege.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel5
  - number: '5.2'
    text: |-
      Onverminderd het bepaalde in [artikel 8][ref1] kan het bestuurscollege aan de vergunning voorschiften verbinden of
      deze onder beperkingen verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0028203#Artikel8
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028203
        artikel: '8'
        hoofdstuk: II
  - number: '5.3'
    text: |-
      Bij eilandsbesluit houdende algemene maatregelen kan voor het betrokken openbaar lichaam een maximum aantal te
      verlenen vergunningen voor het vestigen van een crematorium worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel5
  - number: '6'
    text: |-
      Een besluit tot het verlenen van een vergunning voor het vestigen van een crematorium wordt niet genomen, dan
      nadat door het Bestuurscollege, volgens bij eilandsbesluit houdende algemene maatregelen te stellen regelen, van
      het verzoekschrift mededeling is gedaan in een of meer lokale nieuwsbladen of op de voor publicatie van officiële
      mededelingen gebruikelijke wijze en ter inzagelegging van het verzoekschrift met bijlagen ten bestuurskantore
      heeft plaatsgevonden en voorts aan een ieder tot het indienen van schriftelijke bezwaren bij het bestuurscollege
      gelegenheid is gegeven.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel6
  - number: '7'
    text: |-
      Bij eilandsbesluit houdende algemene maatregelen worden de gevallen geregeld waarin een verleende vergunning door
      het bestuurscollege kan worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel7
  - number: '8'
    text: |-
      Bij eilandsbesluit houdende algemene maatregelen kunnen regelen worden gesteld omtrent de inrichting van crematoria
      en omtrent hetgeen in de crematoria en op hun erven in acht moet worden genomen.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel8
  - number: '9'
    text: |-
      De identiteit van een lijk wordt in het crematorium waar het zal worden verbrand, vastgesteld op bij eilandsbesluit
      houdende algemene maatregelen te bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel9
  - number: 9a
    text: |-
      Zijn er omstandigheden, die een gewelddadige dood doen vermoeden, dan geschiedt de verbranding niet dan met
      toestemming van de Officier van Justitie, zo mogelijk na voorafgegane gerechtelijke schouwing.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel9a
  - number: '10'
    text: |-
      Geen crematie van een lijk geschiedt zonder schriftelijk verlof van de ambtenaar van de burgerlijke stand, dat
      kosteloos en vrij van zegel wordt afgegeven en waarin de plaats van crematie wordt vermeld.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel10
  - number: '11'
    text: |-
      Verlof tot crematie wordt niet verleend, zolang niet is overgelegd een der schriftelijke verklaringen
      als bedoeld in de Wet verklaringen van overlijden BES, dan wel een verklaring van geen bezwaar
      tegen crematie, afgegeven door de officier van justitie. Indien de officier van justitie in de
      gevallen als bedoeld in [artikel 1, derde lid, van de Wet verklaringen van overlijden BES][ref1]
      meent niet tot de afgifte van een verklaring van geen bezwaar tegen crematie te kunnen overgaan,
      stelt deze de op grond van [artikel 4 van de Wet verklaringen van overlijden BES][ref2]
      aangewezen geneeskundige en de regionale toetsingscommissie, bedoeld in
      [artikel 19c van de Wet toetsing levensbeëindiging op verzoek en hulp bij zelfdoding][ref3], hiervan onverwijld op
      de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0028199#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028199#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0012410#Artikel19
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028199
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0028199
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0012410
        artikel: '19'
  - number: '12.1'
    text: |-
      De ingevolge [artikel 11][ref1] overgelegde stukken worden bij de akte van overlijden gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028203#Artikel11
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028203
        artikel: '11'
        hoofdstuk: III
  - number: '12.2'
    text: |-
      Bij gebreke van een akte worden de overgelegde stukken bewaard door de ambtenaar van de burgerlijke stand van het
      openbaar lichaam waarin de crematie geschiedt.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel12
  - number: '13.1'
    text: |-
      Voor de toepassing van dit hoofdstuk wordt als bevoegde ambtenaar van de burgerlijke stand aangemerkt die van het
      openbaar lichaam, waarin betreffende overledene of doodgeborene ingevolge aangifte een akte in het register van
      overlijden is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel13
  - number: '13.2'
    text: |-
      Bij gebreke van een akte is bevoegd de ambtenaar van de burgerlijke stand van het openbaar lichaam waarin crematie
      zal gescheiden.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel13
  - number: '14.1'
    text: |-
      Crematie geschiedt niet eerder dan 36 uren na het overlijden of de levenloze geboorte en uiterlijk op de zesde
      werkdag na het overlijden of de levenloze geboorte.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel14
  - number: '14.2'
    text: |-
      Na de door het bestuurscollege aangewezen geneeskundige te hebben gehoord kan de gezaghebber van het openbaar
      lichaam waar het lijk zich bevindt, voor de crematie daarvan een andere termijn stellen.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel14
  - number: '15'
    text: |-
      Ten aanzien van lijken, die binnen een openbaar lichaam ter crematie worden binnengebracht, kan bij eilandsbesluit
      houdende algemene maatregelen van het bepaalde in dit hoofdstuk worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel15
  - number: '16.1'
    text: |-
      Overblijfselen van lijken en kisten, die bij roering van een graf of grafkelder te voorschijn mochten komen, mogen
      worden verbrand met schriftelijk verlof van de officier van justitie wanneer het verzoek daartoe gedaan wordt door
      degene die het in [artikel 4 van de Begrafeniswet BES][ref1] bedoelde verlof heeft aangevraagd, dan wel degene, die
      redelijkerwijze geacht kan worden in diens plaats te zijn getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0028363#Artikel4
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028363
        artikel: '4'
  - number: '16.2'
    text: Ten aanzien van de in het vorige lid bedoelde crematie zijn de bepalingen van dit hoofdstuk niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel16
  - number: '17.1'
    text: |-
      Na de crematie wordt de as geborgen in een bus, die hermetisch gesloten wordt en waarop de naam, de voornamen en
      de datum van overlijden c.q. levenloze geboorte van de overledene of doodgeborene alsmede een registratienummer in
      onuitwisbare letters en cijfers staan vermeld.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel17
  - number: '17.2'
    text: |-
      Binnen achttien jaren na het plaatsen van het in het eerste lid bedoelde opschrift mag dit niet van een ongeopende
      asbus worden verwijderd of daarop onleesbaar worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel17
  - number: '18.1'
    text: Een maand nadat de as in de bus is geborgen kan zij worden verstrooid.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel18
  - number: '18.2'
    text: |-
      Mits voldaan aan het in [artikel 17, eerste lid][ref1], bepaalde, is de invoer van de as van in het buitenland
      of in het Europese deel van Nederland verbrande lijken naar een openbaar lichaam toegelaten. Bij aankomst dient
      te worden overgelegd een desbetreffende verklaring van overlijden of van levenloze geboorte of een daarmede
      overeenstemmend document waaruit de identiteit van de gecremeerde persoon of het doodgeboren kind blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0028203#Artikel17
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028203
        artikel: '17'
        hoofdstuk: IV
  - number: '18.3'
    text: |-
      Uit het buitenland, een ander openbaar lichaam of het Europese deel van Nederland afkomstige as kan niet eerder dan
      een maand na de invoer worden verstrooid.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel18
  - number: '18.4'
    text: |-
      Een asbus kan een maand nadat de as in de bus is geborgen ter bijzetting of verstrooiing van haar inhoud, naar een
      ander openbaar lichaam, naar het Europese deel van Nederland of naar het buitenland worden gezonden.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel18
  - number: '18.5'
    text: |-
      Op verzoek van degene die het in [artikel 10][ref1] bedoelde verlof heeft aangevraagd dan wel degene, die
      redelijkerwijze geacht kan worden in diens plaats te zijn getreden, kan de officier van justitie in bijzondere
      gevallen ontheffing verlenen van de in de voorgaande leden genoemde termijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0028203#Artikel10
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028203
        artikel: '10'
        hoofdstuk: III
  - number: '19.1'
    text: 'Een asbus kan worden bijgezet:'
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel19
  - number: 19.1.a
    text: in een in het bijzonder daarvoor bestemd gedeelte van het crematorium, of
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel19
  - number: 19.1.b
    text: in of op een graf of grafkelder of op een afzonderlijke plaats op een begraafplaats, of
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel19
  - number: 19.1.c
    text: in een buiten een crematorium of begraafplaats gelegen bewaarplaats.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel19
  - number: '19.2'
    text: |-
      Een maand nadat de as in de bus is geborgen kan deze worden overgebracht naar de woning van de niet van tafel en
      bed gescheiden echtgenoot of andere levensgezel dan wel van een meerderjarige erfgenaam of anders van degene die de
      zorg voor de asbus op zich neemt.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel19
  - number: '20.1'
    text: |-
      De bijzetting van een asbus in of op een graf of grafkelder waarop een uitsluitend recht berust, kan slechts
      geschieden met toestemming van de rechthebbende op het graf of de grafkelder en, voorzover het bijzetting in
      een graf of grafkelder betreft, tevens na daartoe bekomen verlof van de gezaghebber, de door het bestuurscollege
      aangewezen geneeskundige gehoord.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel20
  - number: '20.2'
    text: |-
      Het verbod van [artikel 31, eerste alinea, van de Begrafeniswet BES][ref1] is niet van toepassing op de bijzetting
      van een asbus in een graf of grafkelder.


      [ref1]: https://wetten.overheid.nl/BWBR0028363#Artikel31
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028363
        artikel: '31'
  - number: '21.1'
    text: |-
      Voor elke begraafplaats wordt, hetzij door de zorg van de eigenaar van een bijzondere begraafplaats, hetzij door
      of vanwege de ambtenaren van de burgerlijke stand een register van alle daar bijgezette asbussen gehouden, met een
      nauwkeurige aanduiding van de plaats waar zij bijgezet zijn.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel21
  - number: '21.3'
    text: |-
      Ten aanzien van het in het eerste lid bedoelde register zijn de [leden 2 en 3 van artikel 2][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028203#Artikel2
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0028203
        artikel: '2'
        hoofdstuk: I
  - number: '22.1'
    text: |-
      Een bewaarplaats als bedoeld in [artikel 19, eerste lid, onder c][ref1] wordt niet in gebruik genomen dan met
      vergunning van het bestuurscollege.


      [ref1]: https://wetten.overheid.nl/BWBR0028203#Artikel19
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0028203
        artikel: '19'
        hoofdstuk: IV
  - number: '22.2'
    text: |-
      De houder van een bewaarplaats houdt een register van alle daar bijgezette asbussen, met een nauwkeurige aanduiding
      van de plaats waar zij bijgezet zijn.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel22
  - number: '22.3'
    text: |-
      Ten aanzien van het in het tweede lid bedoelde register zijn de [leden 2 en 3 van artikel 2][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028203#Artikel2
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0028203
        artikel: '2'
        hoofdstuk: I
  - number: '23.1'
    text: |-
      Een asbus welke is bijgezet kan met het oog op een nieuwe bestemming worden verwijderd na daartoe bekomen verlof
      van de gezaghebber, de door het bestuurscollege aangewezen geneeskundige gehoord.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel23
  - number: '23.2'
    text: |-
      Is de asbus in of op een graf of grafkelder bijgezet, dan kan, indien het een graf of grafkelder betreft waarop een
      uitsluitend recht berust, verwijdering van de asbus slechts geschieden met toestemming van de rechthebbende.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel23
  - number: '23.3'
    text: |-
      De voorgaande leden alsmede het verbod van [artikel 31, eerste alinea, van de Begrafeniswet BES][ref1] zijn niet
      van toepassing op de verwijdering van een asbus ingevolge rechterlijk bevel met het oog op een strafrechtelijk
      onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0028363#Artikel31
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028363
        artikel: '31'
  - number: '24.1'
    text: |-
      Het [tweede lid van artikel 23][ref1] geldt niet voor het ruimen van asbussen op last van de houder van de plaats
      van bijzetting.


      [ref1]: https://wetten.overheid.nl/BWBR0028203#Artikel23
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0028203
        artikel: '23'
        hoofdstuk: IV
  - number: '24.2'
    text: |-
      Dit ruimen vindt niet plaats dan na verloop van achttien jaren, nadat de as in de bus is geborgen en slechts met
      toestemming van de rechthebbende op de ruimte waar de asbus is bijgezet.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel24
  - number: '24.3'
    text: De ruiming geschiedt door verstrooiing van de as.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel24
  - number: '25'
    text: |-
      Omtrent de bestemming en bewaring van as kunnen bij eilandsbesluit houdende algemene maatregelen nadere regelen
      worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel25
  - number: '26'
    text: Crematoria staan onder toezicht van het bestuurscollege van het openbaar lichaam waarin zij zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel26
  - number: 26a.1
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de door het bestuurscollege
      aangewezen ambtenaren en andere personen van de gezondheidsdienst van het openbaar lichaam. Een zodanige aanwijzing
      wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel26a
  - number: 26a.2
    text: |-
      De in het eerste lid bedoelde personen zijn, uitsluitend voor zover dat voor de vervulling van hun taak
      redelijkerwijze noodzakelijk is, bevoegd:
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel26a
  - number: 26a.2.a
    text: alle inlichtingen te vragen;
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel26a
  - number: 26a.2.b
    text: |-
      inzage te verlangen van alle registers, boeken, bescheiden en andere informatiedragers en daarvan afschrift te
      nemen of deze daartoe tijdelijk mee te nemen;
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel26a
  - number: 26a.2.c
    text: goederen aan opneming en onderzoek te onderwerpen en deze daartoe tijdelijk mee te nemen;
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel26a
  - number: 26a.2.d
    text: |-
      alle plaatsen, met uitzondering van woningen zonder de uitdrukkelijke toestemming van de bewoner, te betreden,
      vergezeld van door hen aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel26a
  - number: 26a.3
    text: |-
      Zo nodig, wordt de toegang tot een plaats als bedoeld in het tweede lid, onderdeel d, verschaft met behulp van de
      sterke arm.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel26a
  - number: 26a.4
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de taakuitoefening van de in het
      eerste lid bedoelde personen.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel26a
  - number: 26a.5
    text: |-
      Een ieder is verplicht aan de in het eerste lid bedoelde personen alle medewerking te verlenen die op grond van het
      tweede lid wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel26a
  - number: '27'
    text: 'Met hechtenis van ten hoogste drie maanden of geldboete van de derde categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel27
  - number: '27.1'
    text: |-
      het verbranden van een lijk in strijd met of anders dan met inachtneming van hetgeen is bepaald bij de
      [artikelen 1, tweede lid][ref1], en [10][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028203#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028203#Artikel10
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel27
