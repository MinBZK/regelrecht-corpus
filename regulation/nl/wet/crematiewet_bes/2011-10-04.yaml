        artikel: '24'
        hoofdstuk: IV
  - number: '27.5'
    text: |-
      het verstrooien van as of het verzenden, verwijderen, bewaren of vervoeren van een asbus in strijd met of anders
      dan met in achtneming van hetgeen is bepaald bij of krachtens de [artikelen 18][ref1], [19, tweede lid][ref2],
      en [23][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028203#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0028203#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0028203#Artikel23
