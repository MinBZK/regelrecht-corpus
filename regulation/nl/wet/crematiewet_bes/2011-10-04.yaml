  - number: '29'
    text: De bij of krachtens deze wet strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel29
  - number: '30'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel30
  - number: '31.1'
    text: |-
      Met de opsporing van de bij deze wet strafbaar gestelde feiten zijn, naast de in
      [artikel 184 van het Wetboek van Strafvordering BES][ref1] bedoelde ambtenaren, belast de ambtenaren en andere
      personen van de gezondheidsdienst van het openbaar lichaam, door het betrokken bestuurscollege daartoe aangewezen.
      Een zodanige aanwijzing wordt bekendgemaakt in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel184
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '184'
  - number: '31.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de vereisten waaraan de
      krachtens het eerste lid aangewezen personen dienen te voldoen.
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel31
  - number: '32'
    text: |-
      Voor zover in deze wet niet anders is bepaald, zijn de bepalingen van de [Begrafeniswet BES][ref1] voor zoveel
      mogelijk van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028363
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0028363
  - number: '38'
    text: 'Deze wet wordt aangehaald als: Crematiewet BES.'
    url: https://wetten.overheid.nl/BWBR0028203/2011-10-04#Artikel38
