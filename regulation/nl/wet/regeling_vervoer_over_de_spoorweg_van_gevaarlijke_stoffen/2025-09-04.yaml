preamble:
  text: |-
    Gelet op artikel 10 van Richtlijn 96/49/EG van de Raad van de Europese Gemeenschappen van 23 juli 1996 betreffende
    de onderlinge aanpassing van de wetgevingen der Lid-Staten inzake het vervoer van gevaarlijke goederen per spoor
    (PbEG L 235), op artikel 4b, tweede lid, onderdeel a, van de Wegenverkeerswet 1994 en op artikel 2 van het Besluit
    vervoer gevaarlijke stoffen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0010053/2025-09-04#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

      a. *Minister:* Minister van Infrastructuur en Milieu;

      b. *bevoegde autoriteit:*

      1°. Minister,

      2°. een in [bijlage 3][ref1] bij deze regeling erkende instantie, of

      3°. een met toepassing van de [Regeling erkende instanties vervoer gevaarlijke stoffen][ref2] erkende instantie.

      c. *COTIF:* Convention relative aux transports internationaux ferroviaires;

      d. *richtlijn nr. 2008/68/EG:* richtlijn nr. 2008/68/EG van het Europees Parlement en de Raad van de Europese Unie
      van 24 september 2008 betreffende het vervoer van gevaarlijke goederen over land (PbEU L 260).

      2 De in [bijlage 1][ref3] opgenomen begripsbepalingen zijn van toepassing op de [bijlagen 2][ref4] en [3][ref5]
      voorzover daarin niet anders is bepaald.


