  - number: '2'
    text: |-
      Bij deze regeling behoren drie bijlagen:

      a. [bijlage 1][ref1]: voorschriften betreffende het vervoer van gevaarlijke stoffen op Nederlands grondgebied over
      de spoorweg, zijnde de Nederlandse vertaling van het RID;

      b. [bijlage 2][ref2]: voorschriften in afwijking van of in aanvulling op [bijlage 1][ref3];

      c. [bijlage 3][ref4]: erkende instanties, bedoeld in [artikel 1, eerste lid, onderdeel b, 2°][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0010053
      [ref2]: https://wetten.overheid.nl/BWBR0010053
      [ref3]: https://wetten.overheid.nl/BWBR0010053
      [ref4]: https://wetten.overheid.nl/BWBR0010053
      [ref5]: https://wetten.overheid.nl/BWBR0010053#Artikel1
    url: https://wetten.overheid.nl/BWBR0010053/2025-09-04#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010053
      - id: ref2
