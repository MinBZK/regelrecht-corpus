        artikel: '1'
  - number: '3'
    text: |-
      Met voorwaardelijk tot het vervoer over de spoorweg toegelaten gevaarlijke stoffen als bedoeld in bijlage 1 mogen
      de handelingen, bedoeld in [artikel 2 van het Besluit vervoer gevaarlijke stoffen][ref1], worden verricht, mits de
      in deze regeling gestelde voorschriften in acht worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008080#Artikel2
    url: https://wetten.overheid.nl/BWBR0010053/2025-09-04#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008080
        artikel: '2'
  - number: '4'
    text: |-
      1 De Minister kan voorschriften vaststellen die afwijken van de [bijlagen 1][ref1], [2][ref2] of [3][ref3], met
      betrekking tot het vervoer van gevaarlijke stoffen per spoor van en naar landen die partij zijn bij de Organisation
      for Cooperation of Railways (OSJD), indien door passende maatregelen en voorschriften handhaving van eenzelfde
      veiligheidsniveau als dat van het RID wordt gegarandeerd.

      2 De voorschriften, bedoeld in het eerste lid, gelden alleen voor het in die republieken toegelaten vervoer met
      spoorwegwagons van gevaarlijke goederen in colli, in bulk of in containers.


      [ref1]: https://wetten.overheid.nl/BWBR0010053
      [ref2]: https://wetten.overheid.nl/BWBR0010053
      [ref3]: https://wetten.overheid.nl/BWBR0010053
    url: https://wetten.overheid.nl/BWBR0010053/2025-09-04#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0010053
      - id: ref2
        bwb_id: BWBR0010053
      - id: ref3
        bwb_id: BWBR0010053
  - number: '5'
    text: |-
      1 De door de bevoegde autoriteiten op voet van het RID overeengekomen tijdelijke afwijkingen worden in de vorm van
      een multilaterale overeenkomst aan de bevoegde autoriteiten van de andere lidstaten van de Europese Unie voorgelegd
      door de bevoegde autoriteit die het initiatief tot de overeenkomst neemt. Van dergelijke afwijkingen doet de
      Minister mededeling aan de Europese Commissie.

      2 De afwijkingen, bedoeld in het eerste lid, worden verleend zonder onderscheid naar nationaliteit of
      vestigingsplaats van de verzender, de vervoerder of de ontvanger, hebben een looptijd van ten hoogste vijf jaar en
      zijn niet hernieuwbaar.
    url: https://wetten.overheid.nl/BWBR0010053/2025-09-04#Artikel5
  - number: '6'
    text: |-
      Met de in de bij deze regeling behorende [bijlagen 1][ref1] en [2][ref2] vastgestelde technische normen of
      technische eisen worden gelijkgesteld daaraan gelijkwaardige technische normen of technische eisen, vastgesteld
      door of vanwege een andere lidstaat van de Europese Unie dan wel door of vanwege een staat die partij is bij de
      overeenkomst inzake de Europese Economische Ruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0010053
      [ref2]: https://wetten.overheid.nl/BWBR0010053
    url: https://wetten.overheid.nl/BWBR0010053/2025-09-04#Artikel6
