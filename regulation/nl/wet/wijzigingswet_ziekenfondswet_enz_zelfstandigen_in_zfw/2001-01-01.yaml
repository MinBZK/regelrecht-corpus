preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om zelfstandigen, voor wie gelet op hun inkomen,
    toegang tot de sociale ziektekostenverzekering is aangewezen, onder de ziekenfondsverzekering te brengen en de
    daaruit voortvloeiende toename van het aantal ziekenfondsverzekerden te compenseren door middel van een tijdelijke
    wijziging van de indexeringsmethodiek van de loongrens voor de ziekenfondsverzekering;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0010805/2001-01-01#ArtikelAanhef
articles:
  - number: II.1
    text: |-
      De toename van het aantal ziekenfondsverzekerden als gevolg van de inwerkingtreding van deze
      wet wordt gecompenseerd door een tijdelijke wijziging van de indexeringsmethodiek, bedoeld in
      [artikel 3a, eerste en tweede lid, van de Ziekenfondswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3a
    url: https://wetten.overheid.nl/BWBR0010805/2001-01-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 3a
  - number: II.2
    text: |-
      De indexering op grond van de ontwikkeling van het indexcijfer der lonen, bedoeld in
      [artikel 3a, eerste en tweede lid, van de Ziekenfondswet][ref1], wordt vervangen door een indexering op grond van
      de tabelcorrectiefactor tot het begin van het kalenderjaar in de loop waarvan de compensatie, bedoeld in het eerste
      lid, zou worden bereikt bij een ongewijzigde voortzetting van de in dat lid bedoelde tijdelijke wijziging van de
      indexeringsmethodiek.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3a
    url: https://wetten.overheid.nl/BWBR0010805/2001-01-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 3a
  - number: II.3
    text: |-
      Bij de eerste keer dat de gewijzigde indexeringsmethodiek, bedoeld in het tweede lid, wordt
      toegepast, wordt het sedert 1 januari 1999 ontstane verschil tussen de indexering, bedoeld in
      [artikel 3a, eerste en tweede lid, van de Ziekenfondswet][ref1] en de indexering op grond van de
      tabelcorrectiefactor, bedoeld in [artikel 10.2 van de Wet inkomstenbelasting 2001][ref2], zoals
      bedoeld in dit artikel, mede in aanmerking genomen bij de vaststelling van het bedrag, bedoeld in
      [artikel 3a, eerste lid, van de Ziekenfondswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel3a
    url: https://wetten.overheid.nl/BWBR0010805/2001-01-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 3a
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0002460
        artikel: 3a
  - number: II.4
    text: |-
      Voor het kalenderjaar waarin de compensatie, bedoeld in het eerste lid zou worden bereikt bij ongewijzigde
      voortzetting van de tijdelijke wijziging van de indexeringsmethodiek, wordt bij algemene maatregel van
      bestuur het bedrag, bedoeld in de [artikelen 3, eerste lid, onder a][ref1], [3c, eerste lid][ref2] en
      [3d, eerste lid, van de Ziekenfondswet][ref3], op zodanige wijze vastgesteld dat de compensatie, bedoeld in het
      eerste lid, aan het einde van dat kalenderjaar is gerealiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel3c
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel3d
    url: https://wetten.overheid.nl/BWBR0010805/2001-01-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002460
        artikel: 3c
      - id: ref3
        bwb_id: BWBR0002460
        artikel: 3d
  - number: II.5
    text: |-
      Toepassing van dit artikel vindt slechts plaats voor zover het in
      [artikel 3, eerste lid, onder a, van de Ziekenfondswet][ref1], bedoelde bedrag zoals dat voor het voorafgaande
      kalenderjaar werd vastgesteld, niet lager zal zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3
    url: https://wetten.overheid.nl/BWBR0010805/2001-01-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '3'
  - number: II.6
    text: |-
      Dit artikel is van overeenkomstige toepassing op de bedragen bedoeld in de [artikelen 3c, eerste lid][ref1] en
      [3d, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3c
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel3d
    url: https://wetten.overheid.nl/BWBR0010805/2001-01-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 3c
      - id: ref2
        bwb_id: BWBR0002460
        artikel: 3d
  - number: II.7
    text: |-
      Voor de toepassing van dit artikel is
      [artikel 3a, eerste lid, eerste volzin, derde en vierde lid van de Ziekenfondswet][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3a
    url: https://wetten.overheid.nl/BWBR0010805/2001-01-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 3a
  - number: II.8
    text: |-
      Voor de toepassing van [artikel 9, tweede lid, tweede volzin, van de Coördinatiewet Sociale Verzekering][ref1]
      wordt een herziening van het in [artikel 3, eerste lid, onder a, van de Ziekenfondswet][ref2] genoemde bedrag
      ingevolge dit artikel gelijkgesteld met een herziening ingevolge [artikel 3a van de Ziekenfondswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002126#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel3a
    url: https://wetten.overheid.nl/BWBR0010805/2001-01-01#ArtikelII
