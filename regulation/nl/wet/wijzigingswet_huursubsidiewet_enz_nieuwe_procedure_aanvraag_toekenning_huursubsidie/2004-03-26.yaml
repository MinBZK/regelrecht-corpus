  - number: X
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip. In het besluit kan worden bepaald
      dat de verschillende artikelen of onderdelen daarvan terugwerken tot en met een in dat besluit te bepalen tijdstip,
      dat voor die artikelen of onderdelen verschillend kan worden vastgesteld. In dat besluit wordt zonodig toepassing
      gegeven aan [artikel 16 van de Tijdelijke referendumwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel16
