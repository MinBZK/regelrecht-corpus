  - number: IV
    text: |-
      Indien over het tijdvak dat loopt van 1 juli 2002 tot en met 30 juni 2003 een aanvraag om toekenning van
      huursubsidie als bedoeld in [artikel 28, eerste lid, van de Huursubsidiewet][ref1] gedurende de eerste vijf dagen
      van een kalendermaand wordt ingediend, wordt huursubsidie toegekend voor die kalendermaand.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel28
    url: https://wetten.overheid.nl/BWBR0016332/2004-03-26#ArtikelIV
