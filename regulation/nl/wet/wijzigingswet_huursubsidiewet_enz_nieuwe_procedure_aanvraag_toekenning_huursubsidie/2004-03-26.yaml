        artikel: '28'
  - number: V
    text: |-
      Voor de periode van 1 juli 2002 tot het tijdstip van inwerkingtreding
      van de [Uitvoeringswet huurprijzen woonruimte][ref1] geldt in plaats van
      [artikel 17, eerste lid, tweede volzin, van de Huurprijzenwet woonruimte][ref2] het volgende:

      Als een dergelijk verzoek wordt mede aangemerkt een verzoek ingevolge
      [artikel 3a van de Wet op de huurcommissies][ref3], indien een aanvraag om huursubsidie voor de betreffende
      woonruimte is ingediend binnen de in de eerste volzin bedoelde termijn en indien en zodra de voorzitter van de
      huurcommissie op dat verzoek een verklaring heeft afgegeven waaruit blijkt dat de overeengekomen huurprijs hoger is
      dan de bij de desbetreffende woonruimte behorende maximale huurprijsgrens.


      [ref1]: https://wetten.overheid.nl/BWBR0014315
      [ref2]: https://wetten.overheid.nl/BWBR0003221#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0003222#Artikel3a
    url: https://wetten.overheid.nl/BWBR0016332/2004-03-26#ArtikelV
