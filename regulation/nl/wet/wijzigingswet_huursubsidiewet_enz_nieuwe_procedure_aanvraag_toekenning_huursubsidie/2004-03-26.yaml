  - number: III
    text: |-
      1 Een aanvraag om toekenning van huursubsidie wordt afgedaan overeenkomstig de [Huursubsidiewet][ref1], zoals zij
      laatstelijk luidde vóór de inwerkingtreding van deze wet, indien het een aanvraag betreft die wordt ingediend vóór
      de inwerkingtreding van deze wet en betrekking heeft op het subsidietijdvak 1 juli 2001 tot en met 30 juni 2002.

      2 Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer zendt binnen vier
      weken na de positieve beschikking op een aanvraag als bedoeld in het eerste lid aan de betrokken
      huurders een door hem vastgesteld huursubsidiebericht of beperkt huursubsidiebericht als bedoeld in
      [artikel 1, onderdeel g respectievelijk a, van de Huursubsidiewet][ref2].

      3 Een aanvraag om toekenning van huursubsidie wordt afgedaan overeenkomstig de [Huursubsidiewet][ref3], zoals
      zij komt te luiden na inwerkingtreding van deze wet, indien het een aanvraag betreft die wordt ingediend vóór de
      inwerkingtreding van deze wet en betrekking heeft op het subsidietijdvak 1 juli 2002 tot en met 30 juni 2003 of het
      subsidietijdvak 1 juli 2003 tot en met 30 juni 2004.

      4 Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer zendt uiterlijk 1 juli 2003
      respectievelijk 1 juli 2004 na de positieve beschikking op een aanvraag als bedoeld in het derde lid aan de
      betrokken huurders een door hem vastgesteld huursubsidiebericht of beperkt huursubsidiebericht als bedoeld in
      [artikel 1, onderdeel g respectievelijk a, van de Huursubsidiewet][ref4].


