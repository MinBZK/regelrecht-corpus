preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Huursubsidiewet en enkele andere wetten te wijzigen
    teneinde aan huurders die een aanvraag om toekenning van huursubsidie indienen een huursubsidiebericht of een
    beperkt huursubsidiebericht te doen toekomen en enkele andere wijzigingen in die wetten aan te brengen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0016332/2004-03-26#ArtikelAanhef
articles:
  - number: II
    text: |-
      1 Indien de zending van huursubsidieberichten en beperkte huursubsidieberichten, bedoeld in
      [artikel 30a, eerste lid, van de Huursubsidiewet][ref1], het met betrekking tot die zending zenden van
      gegevens, bedoeld in [artikel 30aa, eerste lid, van die wet][ref2], het stellen van een termijn, bedoeld in
      [artikel 30aa, tweede lid, van die wet][ref3], het verstrekken van gegevens ten behoeve van het opstellen van
      huursubsidieberichten of beperkte huursubsidieberichten, bedoeld in [artikel 30b, eerste lid, van die wet][ref4],
      of het uitbetalen van een voorschot, bedoeld in [artikel 31, derde lid, van die wet][ref5], plaatsvindt vóór de
      inwerkingtreding van deze wet, wordt die zending van huursubsidieberichten of beperkte huursubsidieberichten, die
      zending van gegevens, dat stellen van een termijn, die gegevensverstrekking of die uitbetaling aangemerkt als te
      hebben plaatsgevonden ingevolge het betrokken genoemde artikellid van de [Huursubsidiewet][ref6], zoals dit komt te
      luiden na inwerkingtreding van deze wet.

      2 In de gevallen, bedoeld in het eerste lid, zijn de [artikelen 22a][ref7] en
      [28 tot en met 30 van de Huursubsidiewet][ref8], zoals zij laatstelijk luidde vóór de inwerkingtreding van deze
      wet, niet van toepassing.


