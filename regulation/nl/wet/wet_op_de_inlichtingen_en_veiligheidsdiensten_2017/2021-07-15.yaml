  - number: '170'
    text: |-
      Zij die op het tijdstip van inwerkingtreding van deze wet lid zijn van de commissie van toezicht, blijven voor
      de resterende duur van hun benoemingsperiode lid van de commissie van toezicht. Een van de leden, anders dan de
      voorzitter, wordt door de commissie aangewezen als voorzitter van de afdeling klachtbehandeling.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel170
  - number: '171.1'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld. In dat besluit wordt zo nodig
      toepassing gegeven aan [artikel 12, eerste lid, van de Wet raadgevend referendum][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel12
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '12'
  - number: '171.2'
    text: |-
      Voor de bekendmaking van deze wet stelt Onze Minister-President, Minister van Algemene Zaken, de nummering van de
      artikelen, paragrafen en hoofdstukken van deze wet opnieuw vast, brengt hij de in deze wet voorkomende aanhalingen
      van artikelen, paragrafen en hoofdstukken daarmee in overeenstemming en vervangt hij de in deze wet voorkomende
      aanduiding «20..» door het jaartal van het Staatsblad waarin deze wet zal worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel171
  - number: '172'
    text: |-
      Deze wet wordt aangehaald als: Wet op de inlichtingen- en veiligheidsdiensten met vermelding van het jaartal van
      het Staatsblad waarin zij zal worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel172
