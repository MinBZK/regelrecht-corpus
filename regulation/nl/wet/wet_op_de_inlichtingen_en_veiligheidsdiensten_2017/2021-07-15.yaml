  - number: '142.2'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, Onze Minister van Defensie en Onze Minister van
      Economische Zaken gezamenlijk kunnen in bijzondere gevallen de personen en instanties, bedoeld in het eerste lid,
      ontheffing verlenen van de verplichting tot medewerking.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel142
  - number: '143.1'
    text: |-
      Overtreding van de [artikelen 44, vijfde lid][ref1], [45, twaalfde lid][ref2], [52, derde lid][ref3],
      [53, vijfde en zesde lid][ref4], [54, vierde lid][ref5], [55, vierde lid][ref6], [56, derde lid][ref7],
      [57, vierde lid][ref8], is strafbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0039896#Artikel52
