preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe regels te stellen met betrekking de taken
    en bevoegdheden van de inlichtingen- en veiligheidsdiensten in het kader van de nationale veiligheid, de
    coördinatie van de taakuitvoering van deze diensten, de verwerking van gegevens door deze diensten, de nationale
    en internationale samenwerking van deze diensten, de uitoefening van het toezicht en de behandeling van klachten
    en de geheimhouding, alsmede in verband daarmee enkele wetten te wijzigen en de Wet op de inlichtingen- en
    veiligheidsdiensten 2002 te vervangen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *dienst:* de Algemene Inlichtingen- en
      Veiligheidsdienst of de Militaire Inlichtingen- en Veiligheidsdienst;
        - *coördinator:* de functionaris, bedoeld in [artikel 4][ref1];
        - *Onze betrokken Minister:* 1°. ten aanzien van de Algemene Inlichtingen- en Veiligheidsdienst: Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties; 2°. ten aanzien van de Militaire Inlichtingen- en Veiligheidsdienst:
      Onze Minister van Defensie; 3°. ten aanzien van de coördinator: Onze Minister-President, Minister van Algemene
      Zaken;
        - *gegevens:* persoonsgegevens en andere gegevens;
        - *persoonsgegevens:* gegevens die betrekking hebben op een identificeerbare of geïdentificeerde, individuele
      natuurlijke persoon;
        - *gegevensverwerking of verwerking van gegevens:* elke handeling of elk geheel van handelingen met betrekking
      tot gegevens, waaronder in ieder geval het verzamelen, vastleggen, ordenen, bewaren, bijwerken, wijzigen,
      opvragen, raadplegen, gebruiken, verstrekken door middel van doorzending, verspreiding of enige andere vorm
      van terbeschikkingstelling, samenbrengen, met elkaar in verband brengen, alsmede het afschermen, uitwissen of
      vernietigen van gegevens;
        - *commissie van toezicht:* de commissie, bedoeld in [artikel 97][ref2];
        - *toetsingscommissie:* de commissie, bedoeld in [artikel 32][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel97
      [ref3]: https://wetten.overheid.nl/BWBR0039896#Artikel32
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel1
    references:
