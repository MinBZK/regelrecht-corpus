  - number: '143.2'
    text: |-
      Overtredingen van de in het eerste lid strafbaar gestelde feiten zijn misdrijven, voor zover zij opzettelijk zijn
      begaan. Voor zover zij geen misdrijven zijn, zijn zij overtredingen.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel143
  - number: '143.3'
    text: Overtreding van de in het eerste lid strafbaar gestelde feiten wordt gestraft
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel143
  - number: 143.3.a
    text: in geval van een misdrijf, met gevangenisstraf van ten hoogste twee jaar of geldboete van de vierde categorie;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel143
  - number: 143.3.b
    text: in geval van een overtreding, met hechtenis van ten hoogste zes maanden of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel143
  - number: '144'
    text: |-
      Op gegevens verwerkt door of ten behoeve van inlichtingen- en veiligheidsdiensten die zijn opgeheven, zijn
      de [artikelen 20][ref1], [21][ref2], [23][ref3], [24][ref4], [62][ref5], [69][ref6], [70][ref7] alsmede de
      [hoofdstukken 5][ref8], [7][ref9] en [8][ref10] van overeenkomstige toepassing, met dien verstande dat de
      desbetreffende bevoegdheden en verplichtingen toekomen aan Onze Minister bij wie de desbetreffende gegevens
      berusten.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel20
