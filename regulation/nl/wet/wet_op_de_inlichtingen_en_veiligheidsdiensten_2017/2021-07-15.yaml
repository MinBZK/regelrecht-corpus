  - number: '33.1'
    text: |-
      De toetsingscommissie bestaat uit drie leden, waaronder de voorzitter. Voorts kunnen plaatsvervangende leden worden
      benoemd die de leden vervangen bij verhindering en ontstentenis. De leden en plaatsvervangende leden worden benoemd
      bij koninklijk besluit op voordracht van Onze betrokken Ministers gezamenlijk voor een tijdvak van zes jaar en
      kunnen eenmaal worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel33
  - number: '33.2'
    text: |-
      Ten minste twee van de drie leden, waaronder de voorzitter, dienen ten minste
      zes jaar de functie van rechterlijk ambtenaar met rechtspraak belast, bedoeld in
      [artikel 1, onderdeel c, van de Wet op de rechterlijke organisatie][ref1], te hebben vervuld, dan wel ten minste
      zes jaar als lid van de Afdeling bestuursrechtspraak van de Raad van State, als lid belast met rechtspraak bij
      het College van Beroep voor het bedrijfsleven of als lid belast met rechtspraak bij de Centrale Raad van Beroep
      werkzaam te zijn geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel1
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '1'
  - number: '33.3'
    text: |-
      De leden en de plaatsvervangende leden van de toetsingscommissie kunnen niet tevens lid zijn van de commissie van
      toezicht of van de afdeling klachtbehandeling van de commissie van toezicht.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel33
  - number: '33.4'
    text: |-
      De [artikelen 99, eerste, tweede, vijfde, zesde, achtste en negende lid][ref1], [100][ref2], [101][ref3],
      [102][ref4] en [104][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel100
