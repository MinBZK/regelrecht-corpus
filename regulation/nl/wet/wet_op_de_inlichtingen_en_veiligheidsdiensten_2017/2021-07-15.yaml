  - number: '2'
    text: |-
      De diensten en de coördinator verrichten hun taak in gebondenheid aan de wet en in ondergeschiktheid aan Onze
      betrokken Minister.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel2
  - number: '3.1'
    text: |-
      Onze betrokken Ministers plegen regelmatig onderling overleg over hun beleid betreffende de diensten en de
      coördinatie van dat beleid.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel3
  - number: '3.2'
    text: |-
      Voor zover het overleg, bedoeld in het eerste lid, betrekking heeft op de wijze waarop door de diensten
      invulling wordt gegeven aan de taken als bedoeld in [artikel 8, tweede lid, onder a en d][ref1], en
      [artikel 10, tweede lid, onder a, c en e][ref2], worden bij het overleg ook Onze Ministers van Buitenlandse Zaken
      en van Veiligheid en Justitie betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel10
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '3.3'
    text: |-
      Andere dan Onze betrokken Ministers worden voor deelname aan het overleg uitgenodigd, indien dit, gelet op de door
      hen te behartigen belangen, noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel3
  - number: '4.1'
    text: Er is een coördinator van de inlichtingen- en veiligheidsdiensten.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel4
  - number: '4.2'
    text: De coördinator wordt op gemeenschappelijke voordracht van Onze betrokken Ministers bij koninklijk besluit benoemd.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel4
  - number: '4.3'
    text: |-
      De coördinator heeft tot taak om overeenkomstig de aanwijzingen van Onze Minister-President, Minister van Algemene
      Zaken, in overeenstemming met Onze overige betrokken Ministers:
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel4
  - number: 4.3.a
    text: |-
      het in [artikel 3][ref1] bedoelde overleg voor te bereiden;


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel3
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 4.3.b
    text: de uitvoering van de taken van de diensten te coördineren.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel4
  - number: '4.4'
    text: De coördinator stelt Onze betrokken Ministers in kennis van al hetgeen van belang kan zijn.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel4
  - number: '4.5'
    text: De coördinator beschikt ter ondersteuning van zijn werkzaamheden over een secretariaat.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel4
  - number: '4.6'
    text: |-
      Op de verwerking van gegevens door de coördinator is [hoofdstuk 3][ref1] met uitzondering van
      [paragraaf 3.2.5][ref2], alsmede [hoofdstuk 5][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0039896#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0039896
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0039896
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0039896
        hoofdstuk: '5'
  - number: '5.1'
    text: Er is een Commissie Veiligheids- en Inlichtingendiensten Nederland.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel5
  - number: '5.2'
    text: |-
      De commissie bestaat uit door Onze Minister die het aangaat aangewezen vertegenwoordigers dan wel hun aangewezen
      plaatsvervangers van het ministerie van Algemene Zaken, Binnenlandse Zaken en Koninkrijksrelaties, Defensie,
      Buitenlandse Zaken en Veiligheid en Justitie. Vertegenwoordigers van andere ministeries kunnen voor deelname worden
      uitgenodigd, indien dit, gelet op de door hen te behartigen belangen, noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel5
  - number: '5.3'
    text: De commissie staat onder voorzitterschap van de coördinator van de inlichtingen- en veiligheidsdiensten.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel5
  - number: '5.4'
    text: 'De commissie heeft in ieder geval tot taak:'
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel5
  - number: 5.4.a
    text: |-
      het jaarlijks in kaart brengen van de inlichtingenbehoefte van Onze Ministers, bedoeld in
      [artikel 3, eerste en tweede lid][ref1], in relatie tot de aan de Algemene Inlichtingen- en Veiligheidsdienst
      onderscheidenlijk Militaire Inlichtingen- en Veiligheidsdienst opgedragen taken als bedoeld in
      [artikel 8, tweede lid, onder a en d][ref2], onderscheidenlijk [artikel 10, tweede lid, onder a, c en e][ref3]
      alsmede het wegen en prioriteren van de vastgestelde behoefte aan inlichtingen;


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0039896#Artikel10
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref3
        bwb_id: BWBR0039896
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 5.4.b
    text: |-
      het ten behoeve van besluitvorming door Onze betrokken Ministers gezamenlijk op basis van de inventarisatie,
      bedoeld onder a, opstellen van een voorstel voor een geïntegreerde aanwijzing, welke bestaat uit:
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel5
  - number: 5.4.b.i
    text: de onderzoeken die verricht dienen te worden, uitgewerkt naar thema, en de onderzoeksplanning;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel5
  - number: 5.4.b.ii
    text: de prioritering met betrekking tot de onderzoeken.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel5
  - number: 5.4.c
    text: |-
      het op regelmatige basis, ten minste eenmaal per vier maanden, voeren van overleg over de voortgang in de
      uitvoering van de door Onze betrokken Ministers gezamenlijk vastgestelde geïntegreerde aanwijzing en het doen van
      voorstellen tot aanpassing van de inlichtingenbehoefte en de prioritering.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel5
  - number: '5.5'
    text: |-
      Bij besluit van Onze betrokken Ministers gezamenlijk kunnen andere taken aan de commissie worden opgedragen. Het
      besluit wordt in de Staatscourant geplaatst.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel5
  - number: '6.1'
    text: |-
      Onze betrokken Ministers gezamenlijk stellen de geïntegreerde aanwijzing voor de uitvoering van de in
      [artikel 8, tweede lid, onder a en d][ref1], onderscheidenlijk [artikel 10, tweede lid, onder a, c en e][ref2]
      bedoelde taken vast. De geïntegreerde aanwijzing heeft een looptijd van vier jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel10
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '6.2'
    text: |-
      Onze betrokken Ministers bezien jaarlijks aan de hand van voorstellen van de commissie als bedoeld in
      [artikel 5][ref1] of de geïntegreerde aanwijzing aanpassing behoeft.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel5
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '6.3'
    text: |-
      De vaststelling van de geïntegreerde aanwijzing alsmede daarop aan te brengen aanpassingen geschiedt niet dan nadat
      ter zake overleg is gevoerd met Onze Ministers van Buitenlandse Zaken en van Veiligheid en Justitie.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel6
  - number: '7'
    text: |-
      De hoofden van de diensten alsmede de vertegenwoordigers in de commissie, bedoeld in [artikel 5][ref1], verlenen de
      coördinator medewerking voor de uitoefening van zijn taak. Zij verschaffen hem daartoe alle nodige inlichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel5
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '8.1'
    text: Er is een Algemene Inlichtingen- en Veiligheidsdienst.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel8
  - number: '8.2'
    text: 'De Algemene Inlichtingen- en Veiligheidsdienst heeft in het belang van de nationale veiligheid tot taak:'
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel8
  - number: 8.2.a
    text: |-
      het verrichten van onderzoek met betrekking tot organisaties en personen die door de doelen die zij nastreven,
      dan wel door hun activiteiten aanleiding geven tot het ernstige vermoeden dat zij een gevaar vormen voor het
      voortbestaan van de democratische rechtsorde, dan wel voor de veiligheid of voor andere gewichtige belangen van
      de staat;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel8
  - number: 8.2.b
    text: |-
      het verrichten van veiligheidsonderzoeken als bedoeld in de [Wet veiligheidsonderzoeken][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008277
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008277
  - number: 8.2.c
    text: |-
      het bevorderen van maatregelen ter bescherming van de onder a genoemde belangen, waaronder begrepen maatregelen ter
      beveiliging van gegevens waarvan de geheimhouding door de nationale veiligheid wordt geboden en van die onderdelen
      van de overheidsdienst en van het bedrijfsleven die naar het oordeel van Onze ter zake verantwoordelijke Ministers
      van vitaal belang zijn voor de instandhouding van het maatschappelijk leven;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel8
  - number: 8.2.d
    text: het verrichten van onderzoek betreffende andere landen;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel8
  - number: 8.2.e
    text: |-
      het opstellen van dreigings- en risicoanalyses op verzoek van Onze Minister van Binnenlandse
      Zaken en Koninkrijksrelaties en Onze Minister van Veiligheid en Justitie gezamenlijk ten behoeve
      van de beveiliging van de personen, bedoeld in de [artikelen 4, derde lid, onderdeel b][ref1], en
      [42, eerste lid, onder c, van de Politiewet 2012][ref2] en de bewaking en de beveiliging van de objecten en de
      diensten die zijn aangewezen op grond van [artikel 16 van die wet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel16
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '42'
      - id: ref3
        bwb_id: BWBR0031788
        artikel: '16'
  - number: 8.2.f
    text: |-
      het op een daartoe strekkend verzoek van een bij regeling van Onze betrokken Ministers gezamenlijk aangewezen
      persoon of instantie doen van mededeling omtrent door de dienst verwerkte gegevens omtrent personen of instanties
      in bij die regeling aangewezen gevallen.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel8
  - number: '9.1'
    text: |-
      De dreigings- en risicoanalyses, bedoeld in [artikel 8, tweede lid, onderdeel e][ref1], worden opgesteld naar
      aanleiding van gegevens die worden verstrekt door:


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel8
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 9.1.a
    text: |-
      de personen, bedoeld in de [artikelen 4, derde lid, onder b][ref1], en
      [42, eerste lid, onder c, van de Politiewet 2012][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel42
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '42'
  - number: 9.1.b
    text: |-
      degenen die belast zijn met de behartiging van de belangen van de personen, bedoeld in de
      [artikelen 4, derde lid, onder b][ref1], en [42, eerste lid, onder c, van de Politiewet 2012][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel42
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '42'
  - number: 9.1.c
    text: |-
      degenen die belast zijn met de behartiging van de belangen van de objecten of de diensten, die zijn aangewezen op
      grond van [artikel 16 van de Politiewet 2012][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel16
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '16'
  - number: 9.1.d
    text: de diensten;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel9
  - number: 9.1.e
    text: de politie; of
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel9
  - number: 9.1.f
    text: het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel9
  - number: '9.2'
    text: |-
      De Algemene Inlichtingen- en Veiligheidsdienst is slechts bevoegd gegevens te verzamelen ten behoeve van het
      opstellen van de dreigings- en risicoanalyses, bedoeld in [artikel 8, tweede lid, onderdeel e][ref1], indien de
      gegevens die op grond van het eerste lid zijn verstrekt dat noodzakelijk maken.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel8
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '10.1'
    text: Er is een Militaire Inlichtingen- en Veiligheidsdienst.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel10
  - number: '10.2'
    text: 'De Militaire Inlichtingen- en Veiligheidsdienst heeft in het belang van de nationale veiligheid tot taak:'
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel10
  - number: 10.2.a
    text: 'het verrichten van onderzoek:'
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel10
  - number: 10.2.a.1°
    text: |-
      omtrent het potentieel en de strijdkrachten van andere mogendheden, ten behoeve van een juiste opbouw en een
      doeltreffend gebruik van de krijgsmacht;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel10
  - number: 10.2.a.2°
    text: |-
      naar factoren die van invloed zijn of kunnen zijn op de handhaving en bevordering van de internationale rechtsorde
      voor zover de krijgsmacht daarbij is betrokken of naar verwachting betrokken kan worden;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel10
  - number: 10.2.b
    text: |-
      het verrichten van veiligheidsonderzoeken als bedoeld in de [Wet veiligheidsonderzoeken][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008277
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008277
  - number: 10.2.c
    text: 'het verrichten van onderzoek dat nodig is voor het treffen van maatregelen:'
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel10
  - number: 10.2.c.1°
    text: ter voorkoming van activiteiten die ten doel hebben de veiligheid of paraatheid van de krijgsmacht te schaden;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel10
  - number: 10.2.c.2°
    text: ter bevordering van een juist verloop van mobilisatie en concentratie der strijdkrachten;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel10
  - number: 10.2.c.3°
    text: ten behoeve van een ongestoorde voorbereiding en inzet van de krijgsmacht als bedoeld in onderdeel a, onder 2°.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel10
  - number: 10.2.d
    text: |-
      het bevorderen van maatregelen ter bescherming van de onder c genoemde belangen, waaronder begrepen maatregelen ter
      beveiliging van gegevens betreffende de krijgsmacht waarvan de geheimhouding is geboden;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel10
  - number: 10.2.e
    text: het verrichten van onderzoek betreffende andere landen, ten aanzien van onderwerpen met een militaire relevantie;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel10
  - number: 10.2.f
    text: |-
      het opstellen van dreigingsanalyses op verzoek van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      en Onze Minister van Veiligheid en Justitie gezamenlijk ten behoeve van de beveiliging van de personen, bedoeld
      in de [artikelen 4, derde lid, onderdeel b][ref1], en [42, eerste lid, onder c, van de Politiewet 2012][ref2]
      en de bewaking en de beveiliging van de objecten en de diensten die zijn aangewezen op grond van
      [artikel 16 van die wet][ref3], voor zover het betreft personen, objecten en diensten met een militaire relevantie;


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel16
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '42'
      - id: ref3
        bwb_id: BWBR0031788
        artikel: '16'
  - number: 10.2.g
    text: |-
      het op een daartoe strekkend verzoek van een bij regeling van Onze betrokken Ministers gezamenlijk aangewezen
      persoon of instantie doen van mededeling omtrent door de dienst verwerkte gegevens omtrent personen of instanties,
      voor zover het betreft personen en instanties met een militaire relevantie, in bij die regeling aangewezen
      gevallen.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel10
  - number: '11.1'
    text: |-
      De dreigingsanalyses, bedoeld in [artikel 10, tweede lid, onderdeel f][ref1], worden opgesteld naar aanleiding van
      gegevens die worden verstrekt door:


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel10
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 11.1.a
    text: |-
      de personen, bedoeld in de [artikelen 4, derde lid, onder b][ref1], en
      [42, eerste lid, onder c, van de Politiewet 2012][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel42
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '42'
  - number: 11.1.b
    text: |-
      degenen die belast zijn met de behartiging van de belangen van de personen, bedoeld in de
      [artikelen 4, derde lid, onder b][ref1], en [42, eerste lid, onder c, van de Politiewet 2012][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel42
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '42'
  - number: 11.1.c
    text: |-
      degenen die belast zijn met de behartiging van de belangen van de objecten of de diensten, die zijn aangewezen op
      grond van [artikel 16 van de Politiewet 2012][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel16
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '16'
  - number: 11.1.d
    text: de diensten;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel11
  - number: 11.1.e
    text: de politie; of
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel11
  - number: 11.1.f
    text: het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel11
  - number: '11.2'
    text: |-
      De Militaire Inlichtingen- en Veiligheidsdienst is slechts bevoegd gegevens te verzamelen ten behoeve van het
      opstellen van de dreigingsanalyses, bedoeld in [artikel 10, tweede lid, onderdeel f][ref1], indien de gegevens die
      op grond van het eerste lid zijn verstrekt dat noodzakelijk maken.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel10
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '12.1'
    text: |-
      Onze betrokken Ministers brengen jaarlijks voor 1 mei gelijktijdig aan beide kamers der Staten-Generaal
      een openbaar verslag uit van de wijze waarop de Algemene Inlichtingen- en Veiligheidsdienst en de Militaire
      Inlichtingen- en Veiligheidsdienst hun taken in het afgelopen kalenderjaar hebben verricht.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel12
  - number: '12.2'
    text: 'In het verslag wordt in ieder geval volledig overzicht gegeven van:'
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel12
  - number: 12.2.a
    text: de aandachtsgebieden waarop de dienst zijn activiteiten in het afgelopen jaar heeft gericht;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel12
  - number: 12.2.b
    text: de aandachtsgebieden waarop de dienst zijn activiteiten in het lopende jaar in ieder geval zal richten.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel12
  - number: '12.3'
    text: 'In het openbare jaarverslag blijft vermelding achterwege van in ieder geval de gegevens die zicht geven op:'
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel12
  - number: 12.3.a
    text: door de dienst aangewende middelen in concrete aangelegenheden;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel12
  - number: 12.3.b
    text: door de dienst aangewende geheime bronnen;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel12
  - number: 12.3.c
    text: het actuele kennisniveau van de dienst.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel12
  - number: '12.4'
    text: |-
      Onze betrokken Minister kan de gegevens, bedoeld in het derde lid, vertrouwelijk meedelen aan een of beide kamers
      der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel12
  - number: '12.5'
    text: |-
      Onverminderd de verplichting, bedoeld in het eerste lid, informeren Onze betrokken Ministers uit eigen beweging
      beide kamers der Staten-Generaal, indien daartoe aanleiding bestaat. Het derde en het vierde lid zijn van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel12
  - number: '13.1'
    text: De ambtenaren van de diensten bezitten geen bevoegdheid tot het opsporen van strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel13
  - number: '13.2'
    text: |-
      De in [artikel 91][ref1] en [artikel 92][ref2] bedoelde ambtenaren oefenen bij het verrichten van de daar bedoelde
      werkzaamheden geen bevoegdheden tot het opsporen van strafbare feiten uit.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel92
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '91'
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '92'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: '14.1'
    text: |-
      Het is de ambtenaar van een dienst verboden, anders dan in de uitoefening van zijn functie, te reizen naar dan wel
      te verblijven in:
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel14
  - number: 14.1.a
    text: een land waar feitelijk een gewapend conflict bestaat;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel14
  - number: 14.1.b
    text: |-
      door Onze betrokken Ministers gezamenlijk bij ministeriële regeling aangewezen landen waarin het verblijf door een
      ambtenaar van een dienst een bijzonder risico voor de nationale veiligheid kan opleveren.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel14
  - number: '14.2'
    text: |-
      Onze betrokken Minister kan ontheffing van het in het eerste lid bedoelde verbod verlenen, indien dringende
      persoonlijke of andere belangen van de betrokken ambtenaar dat vereisen en de veiligheid of andere gewichtige
      belangen van de staat zich daartegen niet verzetten.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel14
  - number: '14.3'
    text: |-
      Dit artikel is van overeenkomstige toepassing ten aanzien van de coördinator, de aan hem ondergeschikte ambtenaren
      en de krachtens [artikel 91, tweede lid][ref1], en [artikel 92, tweede lid][ref2], aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel92
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '91'
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '92'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: '15.1'
    text: |-
      De hoofden van de diensten dragen zorg voor het treffen van de noodzakelijke voorzieningen van personele,
      organisatorische en technische aard ter beveiliging van de ambtenaren van de diensten.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel15
  - number: '15.2'
    text: |-
      Aan de ambtenaren, bedoeld in het eerste lid, kan met het oog op hun persoonlijke veiligheid door het hoofd van
      de desbetreffende dienst worden toegestaan zich in het kader van hun taakuitvoering te bedienen van een aangenomen
      identiteit en hoedanigheid. [Artikel 41, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel41
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '41'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '15.3'
    text: Van de toepassing van dit artikel wordt aantekening gehouden.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel15
  - number: '15.4'
    text: |-
      Dit artikel is van overeenkomstige toepassing ten aanzien van de krachtens [artikel 91, tweede lid][ref1], en
      [92, tweede lid][ref2], aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel92
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '91'
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '92'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: '16'
    text: |-
      Onze betrokken Minister kan ten aanzien van de organisatie, de werkwijze en het beheer van een dienst nadere regels
      stellen.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel16
  - number: '17'
    text: |-
      De diensten zijn bevoegd tot het verwerken van gegevens met inachtneming van de eisen die daaraan bij of krachtens
      deze wet of de [Wet veiligheidsonderzoeken][ref1] zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008277
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008277
  - number: '18.1'
    text: |-
      De verwerking van gegevens vindt slechts plaats voor een bepaald doel en slechts voor zover dat noodzakelijk is
      voor een goede uitvoering van deze wet of de [Wet veiligheidsonderzoeken][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008277
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008277
  - number: '18.2'
    text: De verwerking van gegevens geschiedt in overeenstemming met de wet en op behoorlijke en zorgvuldige wijze.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel18
  - number: '18.3'
    text: |-
      De gegevens die in het kader van de taakuitvoering van de diensten worden verwerkt, zijn voorzien van een
      aanduiding omtrent de mate van betrouwbaarheid dan wel een verwijzing naar het document of de bron waaraan de
      gegevens zijn ontleend.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel18
  - number: '19.1'
    text: |-
      De verwerking van persoonsgegevens door de Algemene Inlichtingen- en Veiligheidsdienst kan slechts betrekking
      hebben op personen:
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel19
  - number: 19.1.a
    text: |-
      die aanleiding geven tot het ernstige vermoeden dat zij een gevaar vormen voor de democratische rechtsorde, dan wel
      voor de veiligheid of voor andere gewichtige belangen van de staat;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel19
  - number: 19.1.b
    text: die toestemming hebben verleend voor een veiligheidsonderzoek;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel19
  - number: 19.1.c
    text: omtrent wie dat noodzakelijk is in het kader van het onderzoek betreffende andere landen;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel19
  - number: 19.1.d
    text: over wie door een andere inlichtingen- of veiligheidsdienst gegevens zijn ingewonnen;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel19
  - number: 19.1.e
    text: wier gegevens noodzakelijk zijn ter ondersteuning van een goede taakuitvoering door de dienst;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel19
  - number: 19.1.f
    text: die werkzaam zijn of zijn geweest voor een dienst;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel19
  - number: 19.1.g
    text: |-
      omtrent wie dat noodzakelijk is in het kader van het opstellen van de dreigings- en risicoanalyses, bedoeld in
      [artikel 8, tweede lid, onderdeel e][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel8
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 19.1.h
    text: |-
      omtrent wie dat noodzakelijk is in het kader van het doen van een mededeling als bedoeld in
      [artikel 8, tweede lid, onderdeel f][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel8
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '19.2'
    text: |-
      De verwerking van persoonsgegevens door de Militaire Inlichtingen- en Veiligheidsdienst kan slechts betrekking
      hebben op personen:
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel19
  - number: 19.2.a
    text: |-
      die aanleiding geven tot het ernstige vermoeden dat zij een gevaar vormen voor de veiligheid of de paraatheid van
      de krijgsmacht;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel19
  - number: 19.2.b
    text: die toestemming hebben verleend voor een veiligheidsonderzoek;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel19
  - number: 19.2.c
    text: omtrent wie dat noodzakelijk is in het kader van het onderzoek betreffende andere landen;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel19
  - number: 19.2.d
    text: over wie door een andere inlichtingen- of veiligheidsdienst gegevens zijn ingewonnen;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel19
  - number: 19.2.e
    text: wier gegevens noodzakelijk zijn ter ondersteuning van een goede taakuitvoering door de dienst;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel19
  - number: 19.2.f
    text: die werkzaam zijn of zijn geweest voor een dienst;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel19
  - number: 19.2.g
    text: |-
      omtrent wie dat noodzakelijk is in het kader van een onderzoek als bedoeld in
      [artikel 10, tweede lid, onderdeel a, sub 2°][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel10
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 19.2.h
    text: |-
      omtrent wie dat noodzakelijk is in het kader van het opstellen van de dreigingsanalyses, bedoeld in
      [artikel 10, tweede lid, onderdeel f][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel10
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 19.2.i
    text: |-
      omtrent wie dat noodzakelijk is in het kader van het opstellen van een analyse door de Militaire Inlichtingen-
      en Veiligheidsdienst, in opdracht van onze minister van Defensie, van potentiële dreigingen tegen een bij
      de krijgsmacht werkzaam persoon of een bij de krijgsmacht in gebruik zijnd object, welke niet ingevolge
      de [artikelen 4, derde lid, onderdeel b][ref1], en [42, eerste lid, onderdeel c][ref2], onderscheidenlijk
      [artikel 16 van de Politiewet 2012][ref3] is aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel16
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '42'
      - id: ref3
        bwb_id: BWBR0031788
        artikel: '16'
  - number: 19.2.j
    text: |-
      omtrent wie dat noodzakelijk is in het kader van het doen van een mededeling als bedoeld in
      [artikel 10, tweede lid, onderdeel g][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel10
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '19.3'
    text: |-
      De verwerking van persoonsgegevens wegens iemands godsdienst of levensovertuiging, ras, lidmaatschap van een
      vakvereniging, gezondheid en seksuele leven vindt niet plaats.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel19
  - number: '19.4'
    text: |-
      De verwerking van persoonsgegevens die betrekking hebben op de in het derde lid bedoelde kenmerken vindt
      slechts plaats in aanvulling op de verwerking van andere gegevens en slechts voor zover dat voor het doel van de
      gegevensverwerking onvermijdelijk is.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel19
  - number: '19.5'
    text: |-
      Onverminderd de verwerking van persoonsgegevens als bedoeld in het eerste en tweede lid, zijn de diensten bevoegd
      tot verwerking van gegevens omtrent andere personen, indien die gegevens een logisch en onlosmakelijk onderdeel
      vormen van de door de diensten te verwerven of verworven gegevensbestanden.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel19
  - number: '20.1'
    text: |-
      De gegevens die, gelet op het doel waarvoor zij worden verwerkt, geen betekenis hebben of hun betekenis hebben
      verloren, worden verwijderd.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel20
  - number: '20.2'
    text: |-
      Indien blijkt dat gegevens onjuist zijn of ten onrechte worden verwerkt, worden deze verbeterd onderscheidenlijk
      verwijderd. Onze betrokken Minister doet daarvan zo spoedig mogelijk mededeling aan hen wie hij de desbetreffende
      gegevens heeft verstrekt.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel20
  - number: '20.3'
    text: De verwijderde gegevens worden vernietigd, tenzij wettelijke regels omtrent bewaring daaraan in de weg staan.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel20
  - number: '20.4'
    text: |-
      Indien met betrekking tot de voor vernietiging in aanmerking komende gegevens een aanvraag tot kennisneming
      als bedoeld in [artikel 76][ref1] of [80][ref2] is gedaan, wordt de vernietiging van de desbetreffende gegevens
      opgeschort tot ten minste het moment waarop het besluit op de aanvraag onherroepelijk is geworden. Voor zover
      de aanvraag om kennisneming is ingewilligd, worden de desbetreffende gegevens niet eerder vernietigd dan nadat
      de betrokkene van de desbetreffende gegevens overeenkomstig artikel 76, derde lid, onderscheidenlijk artikel 80,
      tweede lid, kennis heeft kunnen nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel80
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '76'
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '80'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: '20.5'
    text: 'Indien de voor vernietiging in aanmerking komende gegevens van belang zijn:'
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel20
  - number: 20.5.a
    text: in het kader van een aanhangige klacht of een aanhangig bezwaar,
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel20
  - number: 20.5.b
    text: |-
      in het kader van een procedure bij een rechter, dan wel indien beroep openstaat tegen een uitspraak die in een
      zodanige procedure is gedaan, wordt de vernietiging opgeschort tot ten minste het moment waarop de beslissing op de
      klacht of het bezwaar dan wel de rechterlijke uitspraak onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel20
  - number: '21.1'
    text: |-
      In afwijking van [artikel 12, eerste lid, van de Archiefwet 1995][ref1] worden slechts die archiefbescheiden,
      bedoeld in [artikel 1, aanhef, onderdeel c, onder 1°, 2° en 4°, van de Archiefwet 1995][ref2], naar een
      archiefbewaarplaats overgebracht die ouder zijn dan twintig jaar en waarvan door Onze betrokken Minister, na advies
      van de beheerder van die archiefbewaarplaats, is vastgesteld dat daaraan geen beperkingen aan de openbaarheid
      dienen te worden gesteld met het oog op het belang van de staat of van diens bondgenoten.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel1
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0007376
        artikel: '1'
  - number: '21.2'
    text: |-
      De in het eerste lid bedoelde beperkingen hebben geen betrekking op archiefbescheiden die ouder zijn dan
      vijfenzeventig jaar, tenzij Onze betrokken Minister, in overeenstemming met het gevoelen van de Ministerraad,
      anders beslist.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel21
  - number: '22.1'
    text: |-
      De [artikelen 17][ref1], [18][ref2] en [19, eerste, derde, vierde en vijfde lid][ref3], zijn tevens van toepassing
      op de verwerking van gegevens ten behoeve van de Algemene Inlichtingen- en Veiligheidsdienst door de ambtenaren,
      bedoeld in [artikel 91][ref4], en de artikelen 17, 18 en 19, tweede tot en met vijfde lid, zijn tevens van
      toepassing op de verwerking van gegevens ten behoeve van de Militaire Inlichtingen- en Veiligheidsdienst door de
      ambtenaren, bedoeld in [artikel 92][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0039896#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0039896#Artikel91
      [ref5]: https://wetten.overheid.nl/BWBR0039896#Artikel92
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref3
        bwb_id: BWBR0039896
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref4
        bwb_id: BWBR0039896
        artikel: '91'
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref5
        bwb_id: BWBR0039896
        artikel: '92'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: '22.2'
    text: |-
      De verwerking van gegevens, bedoeld in het eerste lid, ten behoeve van de Algemene Inlichtingen- en
      Veiligheidsdienst onderscheidenlijk de Militaire Inlichtingen- en Veiligheidsdienst, blijft strikt gescheiden
      van de verwerking van gegevens door de desbetreffende ambtenaren ten behoeve van andere doeleinden. Het hoofd
      van de Algemene Inlichtingen- en Veiligheidsdienst onderscheidenlijk het hoofd van de Militaire Inlichtingen- en
      Veiligheidsdienst kan daaromtrent nadere aanwijzingen geven.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel22
  - number: '22.3'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties onderscheidenlijk Onze Minister van Defensie draagt
      zorg voor archiefbescheiden die verband houden met de gegevensverwerking ten behoeve van de Algemene Inlichtingen-
      en Veiligheidsdienst onderscheidenlijk de Militaire Inlichtingen- en Veiligheidsdienst door de ambtenaren,
      bedoeld in [artikel 91][ref1] onderscheidenlijk [artikel 92][ref2], voor zover deze archiefbescheiden niet zijn
      overgebracht naar een rijksarchiefbewaarplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel92
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '91'
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '92'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: '23'
    text: 'De hoofden van de diensten dragen zorg voor:'
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel23
  - number: 23.a
    text: de geheimhouding van daarvoor in aanmerking komende gegevens;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel23
  - number: 23.b
    text: de geheimhouding van daarvoor in aanmerking komende bronnen waaruit gegevens afkomstig zijn;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel23
  - number: 23.c
    text: de veiligheid van de personen met wier medewerking gegevens worden verzameld.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel23
  - number: '24.1'
    text: |-
      De hoofden van de diensten dragen er voorts zorg voor dat de technische, personele en organisatorische maatregelen
      in verband met de verwerking van gegevens in overeenstemming zijn met hetgeen bij of krachtens deze wet is bepaald.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel24
  - number: '24.2'
    text: 'Tot de maatregelen, bedoeld in het eerste lid, behoren in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel24
  - number: 24.2.a
    text: |-
      de nodige voorzieningen ter bevordering van de juistheid en de volledigheid van de gegevens die worden verwerkt
      alsmede ter bevordering van de kwaliteit van de gegevensverwerking, waaronder begrepen de daarbij gehanteerde
      algoritmen en modellen;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel24
  - number: 24.2.b
    text: |-
      de nodige voorzieningen van technische en organisatorische aard ter beveiliging van de gegevensverwerking tegen
      verlies of aantasting van gegevens alsmede tegen onbevoegde gegevensverwerking;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel24
  - number: 24.2.c
    text: |-
      de aanwijzing van personen die bij uitsluiting van anderen bevoegd zijn tot de bij de aanwijzing vermelde
      werkzaamheden in het kader van de verwerking van gegevens.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel24
  - number: '25.1'
    text: |-
      De diensten zijn, met inachtneming van het bepaalde bij of krachtens deze wet, in ieder geval bevoegd tot het
      verzamelen van gegevens:
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel25
  - number: 25.1.a
    text: uit voor een ieder toegankelijke informatiebronnen;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel25
  - number: 25.1.b
    text: |-
      uit informatiebronnen waarvoor aan de dienst een recht op kennisneming van de aldaar berustende gegevens is
      verleend;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel25
  - number: 25.1.c
    text: |-
      via raadpleging van informanten als bedoeld in [artikel 39][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel39
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '39'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 25.1.d
    text: |-
      met uitoefening van bijzondere bevoegdheden als bedoeld in [paragraaf 3.2.5][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0039896
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 25.1.e
    text: in het kader van de samenwerking tussen inlichtingen- en veiligheidsdiensten en met andere instanties.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel25
  - number: '25.2'
    text: |-
      Onze betrokken Minister kan, indien de onder hem ressorterende dienst het noodzakelijk acht gegevens te verzamelen
      uit een andere informatiebron als bedoeld in het eerste lid, op een daartoe strekkend verzoek van het hoofd
      van de dienst daarvoor toestemming verlenen. In het verzoek wordt met redenen omkleed aangegeven waarom van de
      desbetreffende informatiebron gebruik dient te worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel25
  - number: '26.1'
    text: |-
      Bij het verzamelen van gegevens maken de diensten slechts gebruik van die bevoegdheid, die gelet op de
      omstandigheden van het geval, waaronder de ernst van de bedreiging van de door een dienst te beschermen belangen,
      mede in vergelijking met andere beschikbare bevoegdheden voor de betrokkene het minste nadeel oplevert.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel26
  - number: '26.2'
    text: |-
      De uitoefening van een bevoegdheid blijft achterwege, indien de uitoefening ervan voor betrokkene een onevenredig
      nadeel in vergelijking met het daarbij na te streven doel oplevert.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel26
  - number: '26.3'
    text: De uitoefening van een bevoegdheid dient evenredig te zijn aan het daarmee beoogde doel.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel26
  - number: '26.4'
    text: |-
      De uitoefening van een bevoegdheid wordt onmiddellijk gestaakt, indien het doel waartoe de bevoegdheid is
      uitgeoefend is bereikt dan wel met de uitoefening van een minder ingrijpende bevoegdheid kan worden volstaan.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel26
  - number: '26.5'
    text: De uitoefening van een bevoegdheid dient zo gericht mogelijk te zijn.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel26
  - number: '27.1'
    text: |-
      Gegevens verkregen door uitoefening van een bijzondere bevoegdheid als bedoeld in [paragraaf 3.2.5][ref1]
      worden zo spoedig mogelijk op hun relevantie voor het onderzoek waarvoor ze zijn verworven onderzocht.
      Gegevens waarvan is vastgesteld dat deze niet relevant zijn voor het onderzoek dan wel enig ander lopend
      onderzoek vallend onder de taken, bedoeld in [artikel 8, tweede lid, onder a en d][ref2], onderscheidenlijk
      [artikel 10, tweede lid, onder a, c en e][ref3], worden terstond vernietigd. Gegevens die, tenzij bij de wet
      anders is bepaald, na een periode van een jaar niet op hun relevantie voor het onderzoek dan wel enig ander lopend
      onderzoek vallend onder de taken, bedoeld in artikel 8, tweede lid, onder a en d, onderscheidenlijk artikel 10,
      tweede lid, onder a, c en e, zijn onderzocht, worden terstond vernietigd.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0039896#Artikel10
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0039896
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref3
        bwb_id: BWBR0039896
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '27.2'
    text: |-
      Gegevens die betrekking hebben op de vertrouwelijke communicatie tussen een advocaat en diens cliënt en verkregen
      zijn door de uitoefening van een bijzondere bevoegdheid als bedoeld in [paragraaf 3.2.5][ref1] in andere gevallen
      dan bedoeld in [artikel 30, derde lid][ref2], worden terstond vernietigd, tenzij de verdere verwerking van de
      gegevens noodzakelijk is voor het onderzoek in het kader waarvan de gegevens zijn verworven en de rechtbank Den
      Haag daartoe toestemming heeft verleend. Ingeval de rechtbank Den Haag de toestemming als bedoeld in de vorige
      volzin niet verleent, worden de gegevens terstond vernietigd. Van de vernietiging wordt een verslag opgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel30
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0039896
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '27.3'
    text: |-
      Het hoofd van de dienst kan de termijn van een jaar als bedoeld in het eerste lid, derde volzin, eenmalig met
      ten hoogste zes maanden verlengen met betrekking tot een daarbij aangegeven categorie van gegevens die met de
      uitoefening van een bevoegdheid voor het desbetreffende onderzoek zijn verkregen.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel27
  - number: '28.1'
    text: |-
      Een bijzondere bevoegdheid als bedoeld in [paragraaf 3.2.5][ref1] mag slechts worden uitgeoefend, voor zover dat
      noodzakelijk is voor de goede uitvoering van de taken, bedoeld in [artikel 8, tweede lid, onder a en d][ref2], en
      de taken, bedoeld in [artikel 10, tweede lid, onder a, c, en e][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0039896#Artikel10
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0039896
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref3
        bwb_id: BWBR0039896
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '28.2'
    text: |-
      Een bijzondere bevoegdheid als bedoeld in [paragraaf 3.2.5][ref1] kan, in afwijking van het bepaalde in het eerste
      lid, voorts worden uitgeoefend ter ondersteuning van een goede taakuitvoering van de diensten, voor zover dat
      noodzakelijk is om:


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0039896
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 28.2.a
    text: |-
      te beoordelen of het noodzakelijk is bijzondere veiligheidsmaatregelen te treffen voor een persoon die werkzaam is
      voor of ten behoeve van de dienst in verband met de vervulling door deze persoon van een aan hem op te dragen dan
      wel opgedragen taak;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel28
  - number: 28.2.b
    text: te beoordelen of de personen met wier medewerking gegevens worden verzameld betrouwbaar zijn.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel28
  - number: '29.1'
    text: |-
      De toestemming voor de uitoefening van een bijzondere bevoegdheid als bedoeld in [paragraaf 3.2.5][ref1], wordt,
      voor zover bij of krachtens de wet niet anders is bepaald, verleend voor een periode van ten hoogste drie maanden
      en kan telkens op een daartoe strekkend verzoek worden verlengd voor eenzelfde periode.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0039896
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '29.2'
    text: 'Een verzoek om toestemming, alsmede een verzoek om verlenging van een toestemming, bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel29
  - number: 29.2.a
    text: een aanduiding van de bevoegdheid waarvoor toestemming wordt gevraagd;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel29
  - number: 29.2.b
    text: |-
      voor zover van toepassing, gegevens betreffende de identiteit van de persoon dan wel de organisatie ten aanzien van
      wie onderscheidenlijk waarvan de uitoefening van de desbetreffende bevoegdheid wordt verlangd;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel29
  - number: 29.2.c
    text: voor zover de persoon werkzaam is als journalist of advocaat, de vermelding van deze hoedanigheid;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel29
  - number: 29.2.d
    text: een omschrijving van het onderzoek waarvoor de desbetreffende bevoegdheid dient te worden uitgeoefend;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel29
  - number: 29.2.e
    text: een omschrijving van het met de uitoefening van de bevoegdheid beoogde doel;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel29
  - number: 29.2.f
    text: de reden waarom uitoefening van de desbetreffende bevoegdheid noodzakelijk wordt geacht;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel29
  - number: 29.2.g
    text: |-
      voor zover het een verzoek om verlenging van de toestemming betreft, een aanduiding van de met de uitoefening van
      de desbetreffende bevoegdheid behaalde resultaten;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel29
  - number: 29.2.h
    text: |-
      een omschrijving van de wijze waarop een zo gericht mogelijke inzet van de desbetreffende bevoegdheid wordt
      gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel29
  - number: 29.2.i
    text: |-
      de reden waarom de uitoefening van de desbetreffende bevoegdheid evenredig aan het daarmee beoogde doel kan worden
      geacht;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel29
  - number: 29.2.j
    text: |-
      de reden waarom niet met de uitoefening van een minder ingrijpende bevoegdheid kan worden volstaan om het daarmee
      beoogde doel te bereiken.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel29
  - number: '30.1'
    text: |-
      De toestemming voor de uitoefening van een bijzondere bevoegdheid als bedoeld in [paragraaf 3.2.5][ref1] in de
      gevallen, bedoeld in [artikel 28, tweede lid][ref2], wordt verleend door Onze betrokken Minister op een daartoe
      strekkend schriftelijk verzoek van het hoofd van de betrokken dienst. De toestemming wordt verleend voor een
      periode van ten hoogste vier weken en kan telkens op een daartoe strekkend schriftelijk verzoek worden verlengd
      voor eenzelfde periode. Van een verleende toestemming wordt de commissie van toezicht terstond op de hoogte
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel28
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0039896
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '30.2'
    text: |-
      De uitoefening van een bijzondere bevoegdheid als bedoeld in [paragraaf 3.2.5][ref1] jegens een journalist,
      waarbij de uitoefening kan leiden tot verwerving van gegevens inzake de bron van de journalist, is slechts
      toegestaan, indien de rechtbank Den Haag daartoe, op verzoek van Onze betrokken Minister, toestemming heeft
      verleend. De toestemming wordt verleend voor een periode van ten hoogste vier weken en kan telkens worden verlengd
      voor eenzelfde periode. Onder bron als bedoeld in de eerste volzin wordt verstaan: personen die gegevens ter
      openbaarmaking aan een journalist hebben verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0039896
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '30.3'
    text: |-
      De uitoefening van een bijzondere bevoegdheid als bedoeld in [paragraaf 3.2.5][ref1] jegens een advocaat, waarbij
      de uitoefening kan leiden tot verwerving van gegevens die betrekking hebben op de vertrouwelijke communicatie
      tussen een advocaat en diens cliënt, is slechts toegestaan, indien de rechtbank te Den Haag daartoe, op een daartoe
      strekkend verzoek van Onze betrokken Minister, toestemming heeft verleend. De toestemming wordt verleend voor een
      periode van ten hoogste vier weken en kan telkens op een daartoe strekkend verzoek worden verlengd voor eenzelfde
      periode.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0039896
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '31'
    text: Van de uitoefening van een bevoegdheid wordt aantekening gehouden.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel31
  - number: '32.1'
    text: Er is een toetsingscommissie inzet bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel32
  - number: '32.2'
    text: |-
      De toetsingscommissie is belast met het toetsen van de rechtmatigheid van de door Onze betrokken
      Minister verleende toestemming als bedoeld in de [artikelen 40, derde lid][ref1], [42, vierde lid][ref2],
      [43, tweede en vierde lid][ref3], [45, derde, vijfde en tiende lid][ref4], [47, tweede lid][ref5],
      [48, tweede lid][ref6], [49, vierde lid][ref7], [50, tweede en vierde lid][ref8], [53, tweede lid][ref9],
      [54, tweede lid][ref10] en [57, tweede lid][ref11]. Het oordeel van de toetsingscommissie is bindend.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0039896#Artikel43
      [ref4]: https://wetten.overheid.nl/BWBR0039896#Artikel45
