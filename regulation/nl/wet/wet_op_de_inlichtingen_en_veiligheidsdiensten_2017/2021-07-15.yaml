  - number: '36.1'
    text: |-
      Onze betrokken Minister legt een door hem verleende toestemming voor de uitoefening van een bevoegdheid als
      bedoeld in de [artikelen 40, derde lid][ref1], [42, vierde lid][ref2], [43, tweede en vierde lid][ref3],
      [45, derde, vijfde en tiende lid][ref4], [47, tweede lid][ref5], [48, tweede lid][ref6], [49, vierde lid][ref7],
      [50, tweede en vierde lid][ref8], [53, tweede lid][ref9], [54, tweede lid][ref10] en [57, tweede lid][ref11], ter
      toetsing voor aan de toetsingscommissie. Onze betrokken Minister verstrekt de toetsingscommissie daartoe het aan de
      toestemming ten grondslag liggende verzoek alsmede diens besluit. Onze betrokken Ministers verstrekken desgevraagd
      aan de toetsingscommissie alle inlichtingen en verlenen haar alle overige medewerking die zij voor een goede
      uitoefening van haar taak noodzakelijk acht.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0039896#Artikel43
      [ref4]: https://wetten.overheid.nl/BWBR0039896#Artikel45
      [ref5]: https://wetten.overheid.nl/BWBR0039896#Artikel47
      [ref6]: https://wetten.overheid.nl/BWBR0039896#Artikel48
      [ref7]: https://wetten.overheid.nl/BWBR0039896#Artikel49
      [ref8]: https://wetten.overheid.nl/BWBR0039896#Artikel50
      [ref9]: https://wetten.overheid.nl/BWBR0039896#Artikel53
      [ref10]: https://wetten.overheid.nl/BWBR0039896#Artikel54
      [ref11]: https://wetten.overheid.nl/BWBR0039896#Artikel57
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel36
    references:
