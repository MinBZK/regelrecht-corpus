      [ref8]: https://wetten.overheid.nl/BWBR0039896#Artikel50
      [ref9]: https://wetten.overheid.nl/BWBR0039896#Artikel53
      [ref10]: https://wetten.overheid.nl/BWBR0039896#Artikel54
      [ref11]: https://wetten.overheid.nl/BWBR0039896#Artikel57
