  - number: '167.1'
    text: |-
      Onze Minister-President, Onze Minister van Algemene Zaken, zendt in overeenstemming met Onze betrokken ministers,
      binnen vijf jaar na inwerkingtreding van deze wet, en vervolgens telkens na vijf jaar, aan de Staten-Generaal een
      verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel167
  - number: '167.2'
    text: |-
      Onze betrokken Minister zendt binnen vijf jaar na inwerkingtreding van deze wet, en vervolgens telkens na vijf
      jaar, aan de Staten-Generaal een verslag over het functioneren van de onder hem ressorterende dienst.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel167
