  - number: '145.1'
    text: |-
      De [Algemene wet bestuursrecht][ref1] dan wel het van toepassing zijnde bestuursrecht in de openbare
      lichamen Bonaire, Sint Eustatius en Saba, waaronder in ieder geval het recht dat voorziet in de
      verplichting tot bekendmaking van besluiten alsmede in de mogelijkheid van bezwaar en beroep daartegen,
      is niet van toepassing op de voorbereiding, totstandkoming en tenuitvoerlegging van besluiten op grond van
      [artikel 6][ref2], [artikel 8, tweede lid, onder e en f][ref3], [artikel 10, tweede lid, onder f en g][ref4],
      [artikel 15, tweede lid][ref5], op grond van de [hoofdstukken 3][ref6], [4][ref7] en [6][ref8] in het kader van
      de uitvoering van de taken, bedoeld in artikel 8, tweede lid, onder a, c, d, e en f, en artikel 10, tweede lid,
      onder a, c, d, e, f en g, alsmede [artikel 136, tweede lid, eerste volzin][ref9].


