  - number: '34.1'
    text: De toetsingscommissie wordt ondersteund door een secretariaat.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel34
  - number: '34.1'
    text: |-
      Op voordracht van Onze betrokken Ministers gezamenlijk, op aanbeveling van de voorzitter van de commissie wordt
      bij koninklijk besluit besloten tot het aangaan van een arbeidsovereenkomst met de tot het secretariaat behorende
      personen. Tot beëindiging van de arbeidsovereenkomst wordt bij koninklijk besluit op voordracht van Onze betrokken
      Ministers gezamenlijk, op aanbeveling van de voorzitter van de commissie besloten, tenzij de voorzitter van de
      commissie de arbeidsovereenkomst opzegt op grond van [artikel 677 van Boek 7 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel677
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '677'
  - number: '34.2'
    text: |-
      Bij koninklijk besluit op voordracht van Onze betrokken Ministers gezamenlijk kan worden bepaald in welke gevallen
      het tweede lid niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel34
  - number: '34.3'
    text: |-
      In afwijking van [artikel 4.6, eerste lid, van de Comptabiliteitswet 2016][ref1] vertegenwoordigt de voorzitter van
      de commissie de Staat bij het aangaan, wijzigen en beëindigen van individuele arbeidsovereenkomsten met de tot het
      secretariaat behorende personen.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel4
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '4'
  - number: '35.1'
    text: |-
      De toetsingscommissie stelt voor haar werkzaamheden een reglement van orde op. Dit reglement wordt in de
      Staatscourant geplaatst.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel35
  - number: '35.2'
    text: De vergaderingen van de toetsingscommissie zijn niet openbaar.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel35
  - number: '35.3'
    text: |-
      De [artikelen 23][ref1], [24][ref2], [132][ref3] en [133][ref4] zijn van overeenkomstige toepassing op de
      toetsingscommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0039896#Artikel132
