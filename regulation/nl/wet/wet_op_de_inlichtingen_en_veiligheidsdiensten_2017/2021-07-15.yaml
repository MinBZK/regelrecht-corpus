        bwb_id: BWBR0039896
        artikel: '57'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '36.2'
    text: |-
      De uitoefening van de desbetreffende bevoegdheid vangt niet eerder aan dan nadat de toetsingscommissie ter zake
      haar oordeel heeft uitgebracht dat deze rechtmatig is verleend. Het oordeel wordt zo spoedig mogelijk uitgebracht.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel36
  - number: '36.3'
    text: |-
      Indien de toetsingscommissie van oordeel is dat de toestemming niet rechtmatig is verleend, deelt zij haar oordeel
      met redenen omkleed aan Onze betrokken Minister mee. De door Onze betrokken Minister verleende toestemming vervalt
      dan van rechtswege.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel36
  - number: '37.1'
    text: |-
      Indien onverwijlde spoed toepassing van het bepaalde in [artikel 36, tweede lid][ref1], niet toelaat, kan reeds tot
      de uitoefening van een bevoegdheid waarvoor Onze betrokken Minister toestemming heeft verleend worden overgegaan.
      Onze betrokken Minister legt de toestemming onverwijld voor aan de toetsingscommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel36
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '37.2'
    text: |-
      Bij het voorleggen van de toestemming aan de toetsingscommissie wordt de toetsingscommissie omtrent de toepassing
      van het bepaalde in het eerste lid, eerste volzin, met redenen omkleed geïnformeerd. De toetsingscommissie betrekt
      de toepassing van het eerste lid, eerste volzin, in haar beoordeling.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel37
  - number: '37.3'
    text: |-
      Indien de toetsingscommissie van oordeel is dat de toestemming niet rechtmatig is verleend, deelt zij haar oordeel
      met redenen omkleed aan Onze betrokken Minister mee. De door Onze betrokken Minister verleende toestemming vervalt
      van rechtswege. De met de uitoefening van de bevoegdheid verzamelde gegevens worden terstond vernietigd.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel37
  - number: '37.4'
    text: |-
      Indien de toetsingscommissie van oordeel is dat ten onrechte toepassing is gegeven aan het bepaalde in het eerste
      lid, eerste volzin, maar van oordeel is dat de toestemming rechtmatig is verleend, bepaalt zij tevens welke
      gevolgen daaraan verbonden dienen te worden voor de gegevens die zijn verzameld voorafgaand aan het oordeel van de
      toetsingscommissie. Zij deelt haar oordeel met redenen omkleed aan Onze betrokken Minister mee.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel37
  - number: '38.1'
    text: |-
      De diensten zijn bevoegd tot het al dan niet met gebruikmaking van een technisch hulpmiddel stelselmatig verzamelen
      van gegevens omtrent personen uit voor een ieder toegankelijke informatiebronnen.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel38
  - number: '38.2'
    text: |-
      De uitoefening van de bevoegdheid, bedoeld in het eerste lid, is slechts toegestaan, indien Onze betrokken Minister
      of namens deze het hoofd van een dienst daarvoor toestemming heeft verleend. Het hoofd van een dienst kan aan
      hem ondergeschikte ambtenaren bij schriftelijk besluit aanwijzen die de toestemming, bedoeld in de eerste volzin,
      namens hem verlenen. Onze betrokken Minister wordt een afschrift van het besluit, bedoeld in de tweede volzin,
      gezonden. [Artikel 29][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel29
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '39.1'
    text: |-
      De diensten zijn bevoegd zich bij de uitvoering van hun taak, dan wel ter ondersteuning van een goede
      taakuitvoering, voor het verzamelen van gegevens te wenden tot bestuursorganen, ambtenaren en voorts een ieder die
      geacht wordt de benodigde gegevens te kunnen verstrekken.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel39
  - number: '39.2'
    text: |-
      In het geval dat een verzoek als bedoeld in het eerste lid wordt gericht tot een verantwoordelijke voor een
      gegevensverwerking, is de daarmee belaste ambtenaar verplicht zich ten opzichte van de verantwoordelijke voor een
      gegevensverwerking te legitimeren aan de hand van een daartoe door het betrokken hoofd van een dienst verstrekt
      legitimatiebewijs.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel39
  - number: '39.3'
    text: |-
      Aan een verzoek als bedoeld in het eerste lid kan tevens worden voldaan door het verlenen van rechtstreeks
      geautomatiseerde toegang aan de dienst tot de desbetreffende gegevens dan wel door het verstrekken van
      geautomatiseerde gegevensbestanden.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel39
  - number: '39.4'
    text: |-
      Voor zover rechtstreeks geautomatiseerde toegang als bedoeld in het derde lid wordt verleend, kunnen door
      de diensten verwerkte gegevens rechtstreeks geautomatiseerd worden vergeleken met de gegevens die door de
      verantwoordelijke voor de gegevensverwerking beschikbaar worden gesteld teneinde vast te stellen of er verbanden
      bestaan tussen de desbetreffende gegevens. De gerelateerde gegevens kunnen daarvoor door de verantwoordelijke voor
      de gegevensverwerking rechtstreeks worden verstrekt aan de dienst. Bij of krachtens algemene maatregel van bestuur
      worden nadere regels gesteld met betrekking tot de te treffen technische en organisatorische maatregelen inzake
      rechtstreeks geautomatiseerde toegang.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel39
  - number: '39.5'
    text: |-
      Bij of krachtens de wet geldende voorschriften voor de verantwoordelijke voor een gegevensverwerking betreffende
      de verstrekking van zodanige gegevens zijn niet van toepassing op verstrekkingen gedaan ingevolge een verzoek als
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel39
  - number: '39.6'
    text: |-
      Gegevens die betrekking hebben op dan wel kunnen leiden tot de vaststelling van de identiteit van een natuurlijke
      persoon die op heimelijke wijze medewerking heeft verleend aan een verzoek tot verstrekking van gegevens als
      bedoeld in het eerste lid worden dertig jaar nadat de medewerking van de desbetreffende natuurlijke persoon is
      beëindigd, vernietigd.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel39
  - number: '40.1'
    text: 'De diensten zijn bevoegd tot:'
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel40
  - number: 40.1.a
    text: |-
      het observeren en in het kader daarvan vastleggen van gegevens betreffende gedragingen van natuurlijke personen of
      gegevens betreffende zaken, al dan niet met behulp van observatie- en registratiemiddelen;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel40
  - number: 40.1.b
    text: |-
      het volgen en in het kader daarvan vastleggen van gegevens betreffende natuurlijke personen of zaken, al dan niet
      met behulp van volgmiddelen, plaatsbepalingsapparatuur en registratiemiddelen.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel40
  - number: '40.2'
    text: |-
      De uitoefening van de bevoegdheid, bedoeld in het eerste lid, is slechts toegestaan, indien Onze betrokken Minister
      of namens deze het hoofd van een dienst daarvoor toestemming heeft verleend. Het hoofd van een dienst kan aan
      hem ondergeschikte ambtenaren bij schriftelijk besluit aanwijzen die de toestemming, bedoeld in de eerste volzin,
      namens hem verlenen. Onze betrokken Minister wordt een afschrift van het besluit, bedoeld in de tweede volzin,
      gezonden.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel40
  - number: '40.3'
    text: |-
      De toepassing van observatie- en registratiemiddelen, bedoeld in het eerste lid, onder a, binnen woningen is
      slechts toegestaan, indien daarvoor door Onze betrokken Minister schriftelijk toestemming is verleend aan het hoofd
      van de dienst.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel40
  - number: '40.4'
    text: |-
      Het verzoek om toestemming als bedoeld in het derde lid wordt gedaan door het hoofd van de dienst en bevat in
      aanvulling op hetgeen in [artikel 29, tweede lid][ref1], is bepaald:


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel29
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 40.4.a
    text: het adres van de woning waarbinnen het middel dient te worden toegepast;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel40
  - number: 40.4.b
    text: een omschrijving van het soort middel dat wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel40
  - number: '41.1'
    text: |-
      De diensten zijn bevoegd tot de inzet van natuurlijke personen, al dan niet onder dekmantel van een aangenomen
      identiteit of hoedanigheid, die onder verantwoordelijkheid en onder instructie van een dienst zijn belast met het
      gericht gegevens verzamelen omtrent personen en organisaties die voor de taakuitvoering van de dienst van belang
      kunnen zijn. De bij of krachtens de wet geldende voorschriften betreffende de verstrekking van gegevens, die
      gelden voor een natuurlijke persoon als bedoeld in de eerste volzin zijn niet van toepassing op de verstrekking van
      zodanige gegevens door deze persoon aan de dienst.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel41
  - number: '41.2'
    text: |-
      De uitoefening van de bevoegdheid, bedoeld in het eerste lid, is slechts toegestaan, indien Onze betrokken Minister
      of namens deze het hoofd van een dienst daarvoor toestemming heeft verleend. Het hoofd van een dienst kan aan
      hem ondergeschikte ambtenaren bij schriftelijk besluit aanwijzen die de toestemming, bedoeld in de eerste volzin,
      namens hem verlenen. Onze betrokken Minister wordt een afschrift van het besluit, bedoeld in de tweede volzin,
      gezonden.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel41
  - number: '41.3'
    text: |-
      Onze betrokken Minister kan daarvoor in aanmerking komende bestuursorganen schriftelijk opdragen die medewerking
      te verlenen die noodzakelijk is om een natuurlijke persoon als bedoeld in het eerste lid van een aan te nemen
      identiteit te voorzien. De voor het bestuursorgaan geldende wettelijke voorschriften ter zake van deze verlangde
      werkzaamheden, blijven voor zover deze in de weg staan aan het verrichten van die werkzaamheden buiten toepassing.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel41
  - number: '41.4'
    text: |-
      De natuurlijke persoon, bedoeld in het eerste lid, kan bij instructie van de dienst tevens worden belast met het
      verrichten van handelingen die tot gevolg kunnen hebben dat medewerking wordt verleend aan het plegen van een
      strafbaar feit, dan wel een strafbaar feit wordt gepleegd. Een instructie als bedoeld in de eerste volzin wordt
      slechts gegeven, indien een goede taakuitvoering van de dienst dan wel de veiligheid van de betrokken natuurlijke
      persoon daartoe noodzaakt.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel41
  - number: '41.5'
    text: |-
      De natuurlijke persoon, bedoeld in het eerste lid, mag bij de uitvoering van de instructie door zijn optreden een
      persoon niet brengen tot ander handelen betreffende het beramen of plegen van strafbare feiten, dan waarop diens
      opzet reeds tevoren was gericht.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel41
  - number: '41.6'
    text: 'Bij de instructie, bedoeld in het vierde lid, wordt aan de desbetreffende persoon aangegeven:'
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel41
  - number: 41.6.a
    text: |-
      onder welke omstandigheden deze ter uitvoering van de instructie handelingen mag verrichten die tot gevolg kunnen
      hebben dat medewerking wordt verleend aan het plegen van een strafbaar feit, dan wel een strafbaar feit wordt
      gepleegd;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel41
  - number: 41.6.b
    text: |-
      de wijze waarop aan de instructie uitvoering dient te worden gegeven, waaronder begrepen de aard van de
      handelingen, die door de desbetreffende persoon daarbij zullen mogen worden verricht, voor zover deze bij het geven
      van de instructie zijn te voorzien.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel41
  - number: '41.7'
    text: De instructie aan de natuurlijke persoon, bedoeld in het eerste lid, wordt schriftelijk vastgelegd.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel41
  - number: '41.8'
    text: |-
      De toestemming voor de inzet van een natuurlijke persoon als bedoeld in het eerste lid wordt verleend voor een
      periode van ten hoogste een jaar en kan telkens op een daartoe strekkend verzoek worden verlengd voor eenzelfde
      periode.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel41
  - number: '41.9'
    text: |-
      Gegevens die betrekking hebben op dan wel kunnen leiden tot de vaststelling van de identiteit van een natuurlijke
      persoon als bedoeld in het eerste lid worden 30 jaar nadat de inzet van de desbetreffende natuurlijke persoon is
      beëindigd, vernietigd.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel41
  - number: '42.1'
    text: 'De diensten zijn bevoegd tot het, al dan niet met behulp van een technisch hulpmiddel:'
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel42
  - number: 42.1.a
    text: doorzoeken van besloten plaatsen;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel42
  - number: 42.1.b
    text: doorzoeken van gesloten voorwerpen;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel42
  - number: 42.1.c
    text: verrichten van onderzoeken aan een voorwerp gericht op de vaststelling van de identiteit van een persoon.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel42
  - number: '42.2'
    text: |-
      Indien dit noodzakelijk is voor het onderzoek van een dienst, kan een bij de toepassing van de bevoegdheid,
      bedoeld in het eerste lid, aangetroffen voorwerp voor een beperkte tijd door de desbetreffende dienst worden
      meegenomen, voor zover onderzoek van het desbetreffende voorwerp ter plaatse van de doorzoeking onmogelijk is en
      de daarmee beoogde verzameling van gegevens niet op een andere, minder ingrijpende wijze kan worden bewerkstelligd.
      De desbetreffende voorwerpen worden zo spoedig mogelijk teruggeplaatst, tenzij het belang van een goede
      taakuitoefening van de dienst zich daartegen verzet of met terugplaatsing geen redelijk belang wordt gediend.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel42
  - number: '42.3'
    text: |-
      De uitoefening van de bevoegdheid, bedoeld in het eerste lid, is slechts toegestaan, indien Onze betrokken Minister
      of namens deze het hoofd van een dienst daarvoor toestemming heeft verleend. Het hoofd van een dienst kan aan
      hem ondergeschikte ambtenaren bij schriftelijk besluit aanwijzen die de toestemming, bedoeld in de eerste volzin,
      namens hem verlenen. Onze betrokken Minister wordt een afschrift van het besluit, bedoeld in de tweede volzin,
      gezonden.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel42
  - number: '42.4'
    text: |-
      Van de bevoegdheid, bedoeld in het eerste lid, onder a, mag, voor zover het woningen betreft, slechts gebruik
      worden gemaakt, indien daarvoor door Onze betrokken Minister schriftelijk toestemming is verleend aan het hoofd van
      de dienst.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel42
  - number: '42.5'
    text: |-
      Het verzoek om toestemming als bedoeld in het vierde lid wordt gedaan door het hoofd van de dienst en bevat in
      aanvulling op hetgeen in [artikel 29, tweede lid][ref1], is bepaald, het adres van de woning die dient te worden
      doorzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel29
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '43.1'
    text: |-
      De diensten zijn bevoegd tot het verrichten van DNA-onderzoek op basis van celmateriaal op voorwerpen ten behoeve
      van:
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel43
  - number: 43.1.a
    text: het vaststellen van de identiteit van een persoon;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel43
  - number: 43.1.b
    text: de verificatie van de identiteit van een persoon.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel43
  - number: '43.2'
    text: |-
      De in het eerste lid bedoelde bevoegdheid mag slechts worden uitgeoefend, indien door Onze betrokken Minister
      daarvoor op een daartoe strekkend verzoek schriftelijk toestemming is verleend aan het hoofd van de dienst.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel43
  - number: '43.3'
    text: |-
      Het verzoek om toestemming, bedoeld in het tweede lid, wordt gedaan door het hoofd van de dienst en bevat in
      aanvulling op hetgeen is bepaald in [artikel 29, tweede lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel29
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 43.3.a
    text: |-
      een zo nauwkeurig mogelijke aanduiding van de persoon ten aanzien van wie de uitoefening van de bevoegdheid wordt
      verlangd, voor zover deze bekend is;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel43
  - number: 43.3.b
    text: |-
      een nauwkeurige omschrijving van het celmateriaal, waaronder begrepen het voorwerp met daarop mogelijk
      celmateriaal, waaraan het onderzoek wordt verricht alsmede de wijze waarop dit is verkregen.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel43
  - number: '43.4'
    text: |-
      Het in het eerste lid bedoelde DNA-onderzoek wordt binnen drie maanden nadat het celmateriaal, waaronder
      begrepen het voorwerp met daarop mogelijk celmateriaal, is vergaard, uitgevoerd. Indien binnen deze termijn
      geen DNA-onderzoek kan plaatsvinden wordt het celmateriaal, waaronder begrepen het voorwerp met daarop mogelijk
      celmateriaal, terstond vernietigd, tenzij Onze betrokken Minister de termijn, bedoeld in de eerste volzin, op een
      daartoe strekkend verzoek van het hoofd van de dienst voor een periode van ten hoogste drie maanden heeft verlengd.
      In aanvulling op het bepaalde in [artikel 29, tweede lid][ref1], wordt in het verzoek de reden aangegeven waarom
      het DNA-onderzoek niet binnen de termijn van drie maanden heeft kunnen plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel29
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '43.5'
    text: |-
      Het vergaarde celmateriaal, waaronder begrepen het voorwerp met daarop mogelijk celmateriaal, wordt binnen
      drie maanden na het DNA-onderzoek vernietigd. Van vernietiging van het voorwerp wordt afgezien, indien dit
      overeenkomstig het bepaalde in [artikel 42, tweede lid][ref1], kan worden teruggeplaatst. Van de vernietiging wordt
      een verslag gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel42
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '42'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '43.6'
    text: |-
      De resultaten van een DNA-onderzoek mogen uitsluitend worden verwerkt voor het onderzoek ten behoeve waarvan de
      toestemming is verleend. Elk verdere verwerking is slechts toegestaan, indien daarvoor toestemming is verkregen
      van Onze betrokken Minister. Het verzoek om toestemming wordt gedaan door het hoofd van de dienst en bevat in
      aanvulling op hetgeen in [artikel 29, tweede lid][ref1], is bepaald:


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel29
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 43.6.a
    text: een nauwkeurige omschrijving van de beoogde verdere verwerking;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel43
  - number: 43.6.b
    text: |-
      voor zover het de verstrekking van de resultaten van het DNA-onderzoek aan een derde betreft, welke derde het
      betreft.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel43
  - number: '43.7'
    text: |-
      Het door of ten behoeve van de dienst vervaardigde DNA-profiel wordt voor ten hoogste vijf jaren bewaard en daarna
      terstond vernietigd. Op een daartoe strekkend verzoek van het hoofd van de dienst aan Onze betrokken Minister kan
      de bewaartermijn telkens voor ten hoogste vijf jaren worden verlengd met dien verstande dat de bewaartermijn in
      totaliteit de dertig jaar niet overschrijdt. [Artikel 29, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel29
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '43.8'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld voor het verrichten van DNA-onderzoek, het
      verwerken van DNA-profielen, waaronder begrepen de inrichting, het beheer en de toegang tot deze gegevens, en
      de omgang met celmateriaal, waaronder begrepen voorwerpen met daarop mogelijk celmateriaal. De bij algemene
      maatregel van bestuur te stellen regels hebben mede betrekking op medewerkers van de dienst die bij de uitvoering
      van het DNA-onderzoek fysiek in aanraking kunnen komen met voorwerpen met daarop mogelijk celmateriaal en het
      veiliggestelde celmateriaal. De voordracht voor een krachtens de eerste volzin vast te stellen algemene maatregel
      van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers van de Staten-Generaal is
      overgelegd.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel43
  - number: '44.1'
    text: |-
      De diensten zijn bevoegd tot het openen van brieven en andere geadresseerde zendingen, zonder goedvinden van de
      afzender of de geadresseerde, indien de rechtbank Den Haag daartoe, op verzoek van het hoofd van de dienst, een
      last heeft afgegeven.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel44
  - number: '44.2'
    text: |-
      Het verzoek om een last, bedoeld in het eerste lid, bevat in aanvulling op hetgeen is bepaald in
      [artikel 29, tweede lid][ref1], de naam en het adres van de instelling van post of vervoer, die de brieven of
      andere geadresseerde zendingen dient uit te leveren.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel29
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '44.3'
    text: |-
      Een last wordt slechts afgegeven, indien dat noodzakelijk is voor een goede uitoefening van de aan de dienst
      opgedragen taak.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel44
  - number: '44.4'
    text: 'Een last, bedoeld in het eerste lid, wordt afgegeven:'
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel44
  - number: 44.4.a
    text: per brief of andere geadresseerde zending, indien deze reeds in het bezit van de dienst is;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel44
  - number: 44.4.b
    text: |-
      voor een daarbij te bepalen periode van ten hoogste drie maanden, indien het betreft het openen van brieven of
      andere geadresseerde zendingen die aan een in de last vermelde instelling van post dan wel vervoer zijn of worden
      toevertrouwd.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel44
  - number: '44.5'
    text: |-
      De instelling van post dan wel vervoer, bedoeld in het vierde lid, onder b, is gehouden de brieven en andere
      geadresseerde zendingen, waarop de last betrekking heeft, tegen ontvangstbewijs uit te leveren aan een door het
      hoofd van de dienst daartoe aangewezen ambtenaar van de dienst.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel44
  - number: '44.6'
    text: |-
      De ambtenaar is gehouden zich jegens de instelling van post dan wel vervoer te legitimeren aan de hand van een door
      het hoofd van de dienst verstrekt legitimatiebewijs.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel44
  - number: '44.7'
    text: |-
      De diensten dragen zorg dat een door een instelling van post of vervoer uitgeleverde brief of andere geadresseerde
      zending na onderzoek daarvan, onverwijld aan de desbetreffende instelling ter verzending terug wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel44
  - number: '45.1'
    text: 'De diensten zijn bevoegd tot:'
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel45
  - number: 45.1.a
    text: |-
      het verkennen van de technische kenmerken van geautomatiseerde werken die op een communicatienetwerk zijn
      aangesloten;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel45
  - number: 45.1.b
    text: |-
      het al dan niet met gebruikmaking van een technisch hulpmiddel, valse signalen, valse sleutels, valse hoedanigheid
      of door tussenkomst van het geautomatiseerd werk van een derde, binnendringen in een geautomatiseerd werk.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel45
  - number: '45.2'
    text: 'Tot de bevoegdheid in het eerste lid, onder b, behoort tevens de bevoegdheid tot:'
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel45
  - number: 45.2.a
    text: het doorbreken van enige beveiliging;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel45
  - number: 45.2.b
    text: |-
      het aanbrengen van technische voorzieningen teneinde versleuteling van gegevens opgeslagen of verwerkt in het
      geautomatiseerde werk ongedaan te maken;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel45
  - number: 45.2.c
    text: |-
      het aanbrengen van technische voorzieningen in verband met de toepassing van de bevoegdheid als bedoeld in de
      [artikelen 40, eerste lid][ref1], en [47, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel47
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '47'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 45.2.d
    text: het overnemen van de gegevens opgeslagen of verwerkt in het geautomatiseerde werk.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel45
  - number: '45.3'
    text: |-
      De in het eerste lid bedoelde bevoegdheid mag slechts worden uitgeoefend, indien door Onze betrokken Minister
      daarvoor op een daartoe strekkend verzoek schriftelijk toestemming is verleend aan het hoofd van de dienst.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel45
  - number: '45.4'
    text: |-
      Het verzoek om toestemming, bedoeld in het derde lid, wordt gedaan door het hoofd van de dienst en bevat in
      aanvulling op hetgeen is bepaald in [artikel 29, tweede lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel29
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 45.4.a
    text: een omschrijving van de technische risico’s verbonden aan de uitoefening van de desbetreffende bevoegdheid;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel45
  - number: 45.4.b
    text: |-
      voor zover van toepassing, welke bevoegdheden als bedoeld in het tweede lid, bij de uitoefening van de in het
      eerste lid, onder b, bedoelde bevoegdheid worden toegepast;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel45
  - number: 45.4.c
    text: |-
      voor zover het de uitoefening van de in het eerste lid, onder b, bedoelde bevoegdheid betreft, zo mogelijk een
      nummer, technisch kenmerk of een andere aanduiding waarmee het geautomatiseerde werk kan worden geïdentificeerd.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel45
  - number: '45.5'
    text: |-
      Indien bij de uitoefening van de in het eerste lid, onder b, bedoelde bevoegdheid het binnendringen via het
      geautomatiseerd werk van een derde plaatsvindt, is met betrekking tot het geautomatiseerde werk van die derde, het
      derde en vierde lid van overeenkomstige toepassing. De uitoefening van de bevoegdheid, bedoeld in het tweede lid,
      onder c, is daarbij uitgesloten.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel45
  - number: '45.6'
    text: |-
      Het hoofd van de dienst wijst aan hem ondergeschikte ambtenaren aan die bij uitsluiting van anderen zijn belast met
      de feitelijke uitvoering van de in het eerste lid bedoelde bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel45
  - number: '45.7'
    text: |-
      Na beëindiging van de uitoefening van de bevoegdheid als bedoeld in het eerste lid, onder b, wordt het daarbij
      gebruikte technische hulpmiddel verwijderd. Indien het technische hulpmiddel niet kan worden verwijderd, wordt
      daarvan een verslag opgesteld.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel45
  - number: '45.8'
    text: |-
      Een ingevolge het derde en vijfde lid verleende toestemming voor het binnendringen in een geautomatiseerd werk van
      een persoon of organisatie omvat, voor de duur van de verleende toestemming, tevens de bevoegdheid om binnen te
      dringen in een ander geautomatiseerd werk van die persoon of organisatie voor zover dat in de plaats treedt van of
      een aanvulling is op het geautomatiseerde werk waar oorspronkelijk de toestemming voor is verleend.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel45
  - number: '45.9'
    text: |-
      De diensten zijn bevoegd zich te wenden tot degene van wie redelijkerwijs vermoed wordt dat hij kennis draagt van
      de wijze van versleuteling van de gegevens opgeslagen of verwerkt in het geautomatiseerde werk als bedoeld in het
      eerste lid met de opdracht alle noodzakelijke medewerking te verlenen tot het ontsleutelen van de gegevens door
      hetzij deze kennis ter beschikking te stellen, hetzij de versleuteling ongedaan te maken.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel45
  - number: '45.10'
    text: |-
      De bevoegdheid, bedoeld in het negende lid, mag slechts worden uitgeoefend indien door Onze betrokken Minister op
      een daartoe strekkend verzoek toestemming is verleend aan het hoofd van de dienst.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel45
  - number: '45.11'
    text: |-
      Het verzoek om toestemming, bedoeld in het tiende lid, is schriftelijk en bevat in aanvulling op hetgeen is bepaald
      in [artikel 29, tweede lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel29
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 45.11.a
    text: gegevens betreffende de identiteit van de persoon aan wie de opdracht wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel45
  - number: 45.11.b
    text: |-
      een omschrijving van het geautomatiseerde werk waarin de desbetreffende gegevens worden verwerkt of opgeslagen ten
      aanzien waarvan de medewerking wordt verlangd.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel45
  - number: '45.12'
    text: De persoon aan wie een opdracht als bedoeld in het negende lid wordt gericht is verplicht daaraan te voldoen.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel45
  - number: '46'
    text: |-
      In deze paragraaf en de daarop berustende bepalingen wordt verstaan onder: - *aanbieder van een
      communicatiedienst:* de natuurlijke of rechtspersoon die in de uitoefening van een beroep of bedrijf aan de
      gebruikers van zijn dienst de mogelijkheid biedt te communiceren met behulp van een geautomatiseerd werk, of die
      gegevens verwerkt of opslaat ten behoeve van een zodanige dienst of de gebruikers van die dienst;
        - *gebruiker:* de natuurlijke persoon of rechtspersoon die met de aanbieder van een communicatiedienst een
      overeenkomst is aangegaan met betrekking tot het gebruik van die dienst of die feitelijk gebruik maakt van een
      zodanige dienst;
        - *nummer:* een nummer als bedoeld in [artikel 1.1 van de Telecommunicatiewet][ref1];
        - *technisch kenmerk:* ieder kenmerk, niet zijnde een nummer, dat gebruikt wordt bij het overbrengen van
      communicatie of de verbinding tussen geautomatiseerde werken.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel1
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '1'
  - number: '47.1'
    text: |-
      De diensten zijn bevoegd tot het met een technisch hulpmiddel gericht aftappen, ontvangen, opnemen en afluisteren
      van elke vorm van gesprek, telecommunicatie of gegevensoverdracht door middel van een geautomatiseerd werk,
      ongeacht waar een en ander plaatsvindt. Tot de bevoegdheid, bedoeld in de eerste volzin, behoort tevens de
      bevoegdheid om versleuteling van de gesprekken, telecommunicatie of gegevensoverdracht ongedaan te maken.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel47
  - number: '47.2'
    text: |-
      De in het eerste lid bedoelde bevoegdheid mag slechts worden uitgeoefend, indien Onze betrokken Minister daarvoor
      op een daartoe strekkend verzoek toestemming is verleend aan het hoofd van de dienst.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel47
  - number: '47.3'
    text: |-
      Het verzoek om toestemming, bedoeld in het tweede lid, wordt gedaan door het hoofd van de dienst en bevat in
      aanvulling op hetgeen is bepaald in [artikel 29, tweede lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel29
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 47.3.a
    text: voor zover van toepassing, het nummer dan wel het technisch kenmerk;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel47
  - number: 47.3.b
    text: |-
      gegevens betreffende de identiteit van de persoon dan wel de organisatie ten aanzien van wie onderscheidenlijk
      waarvan de uitoefening van de desbetreffende bevoegdheid wordt verlangd.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel47
  - number: '47.4'
    text: |-
      Indien bij het verzoek om toestemming het nummer of het technisch kenmerk, bedoeld in het derde lid, onder a,
      nog niet bekend is, wordt de toestemming slechts verleend onder de voorwaarde dat de bevoegdheid slechts mag
      worden uitgeoefend, zodra het desbetreffende nummer of het technisch kenmerk bekend is. De diensten zijn bevoegd
      tot het gebruik van een technisch hulpmiddel waarmee het nummer of het technisch kenmerk, bedoeld in de eerste
      volzin, kan worden verkregen. De diensten zijn bevoegd om in dat kader van de daarbij ontvangen gegevens kennis
      te nemen voor zover en zolang dat noodzakelijk is ter vaststelling van het juiste nummer of het technisch kenmerk.
      Ontvangen gegevens die geen betrekking hebben op het hier bedoelde nummer of het technisch kenmerk worden terstond
      vernietigd.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel47
  - number: '47.5'
    text: |-
      Onze betrokken Minister is bevoegd tot het verlenen van toestemming aan door hem bij besluit aangewezen aan hem
      ondergeschikte ambtenaren, welke ter uitvoering van het bepaalde in het vierde lid bij uitsluiting van anderen
      kennis mogen nemen van de inhoud van de ontvangen gegevens ter vaststelling van het juiste nummer of het technisch
      kenmerk. Onze betrokken Minister kan de bevoegdheid, bedoeld in de eerste volzin, mandateren aan het hoofd van
      de dienst.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel47
  - number: '47.6'
    text: |-
      Indien bij het verzoek om toestemming de gegevens, bedoeld in het derde lid, onder b, nog niet bekend zijn, wordt
      de toestemming slechts verleend onder de voorwaarde de desbetreffende gegevens zo spoedig mogelijk aan te vullen.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel47
  - number: '47.7'
    text: |-
      Een ingevolge het tweede lid verleende toestemming voor het ontvangen en opnemen van de telecommunicatie van
      een persoon of organisatie aan de hand van een nummer of technisch kenmerk, omvat, voor de duur van de verleende
      toestemming, tevens de bevoegdheid om de telecommunicatie te ontvangen of op te nemen aan de hand van na de
      toestemmingverlening bekend geworden andere nummers of technische kenmerken van de desbetreffende persoon of
      organisatie.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel47
  - number: '47.8'
    text: |-
      Voor zover het gericht ontvangen en opnemen van telecommunicatie die zijn oorsprong of bestemming heeft in
      andere landen betrekking heeft op militair verkeer, wordt, tenzij de medewerking van een aanbieder van een
      communicatiedienst is vereist, in afwijking van het bepaalde in het tweede lid de toestemming verleend door het
      hoofd van de Militaire Inlichtingen- en Veiligheidsdienst. Niet-militair verkeer dat in dit kader wordt ontvangen
      of opgenomen wordt terstond vernietigd.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel47
  - number: '48.1'
    text: |-
      De diensten zijn bevoegd tot het met een technisch hulpmiddel onderzoeksopdrachtgericht aftappen, ontvangen,
      opnemen en afluisteren van elke vorm van telecommunicatie of gegevensoverdracht door middel van een geautomatiseerd
      werk ongeacht waar een en ander plaatsvindt, indien wordt voldaan aan hetgeen bij of krachtens dit artikel is
      gesteld. Tot de bevoegdheid, bedoeld in de eerste volzin, behoort tevens de bevoegdheid tot het ongedaan maken van
      de versleuteling van de telecommunicatie of gegevens alsmede de technische analyse van de gegevens voor zover deze
      gericht is op de optimalisatie van de uitoefening van de in de eerste volzin bedoelde bevoegdheid. Ten behoeve
      van de technische analyse mag, voor zover noodzakelijk, de inhoud van de telecommunicatie of gegevens uitsluitend
      worden gecontroleerd op de goede uitvoering van de ontvangst.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel48
  - number: '48.2'
    text: |-
      De in het eerste lid bedoelde bevoegdheid mag slechts worden uitgeoefend, indien door Onze betrokken Minister
      daarvoor op een daartoe strekkend verzoek toestemming is verleend aan het hoofd van de dienst. De toestemming wordt
      verleend voor een periode van ten hoogste een jaar en kan telkens op een daartoe strekkend verzoek worden verlengd
      voor eenzelfde periode.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel48
  - number: '48.3'
    text: |-
      Het verzoek om toestemming, bedoeld in het tweede lid, wordt gedaan door het hoofd van de dienst en bevat in
      aanvulling op hetgeen is bepaald in [artikel 29, tweede lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel29
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 48.3.a
    text: |-
      voor zover van toepassing de reden waarom de uitoefening van de bevoegdheid ook betrekking dient te hebben op de
      inhoud van telecommunicatie of gegevensoverdracht door middel van een geautomatiseerd werk;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel48
  - number: 48.3.b
    text: |-
      een typering van de telecommunicatie of de gegevensoverdracht door middel van een geautomatiseerd werk ten aanzien
      waarvan de bevoegdheid dient te worden toegepast.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel48
  - number: '48.4'
    text: |-
      Onze betrokken Minister is bevoegd tot het verlenen van toestemming aan door hem bij besluit aangewezen aan hem
      ondergeschikte ambtenaren, welke bij uitsluiting van anderen kennis mogen nemen van de verworven gegevens ten
      behoeve van de in het eerste lid, tweede en derde volzin, bedoelde activiteiten. Onze betrokken Minister kan de
      bevoegdheid, bedoeld in de eerste volzin, mandateren aan het hoofd van de dienst.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel48
  - number: '48.5'
    text: |-
      In afwijking van het bepaalde in [artikel 27, eerste lid][ref1], mogen gegevens die zijn verzameld door
      uitoefening van de bevoegdheid als bedoeld in het eerste lid voor een periode van ten hoogste drie jaren na
      verwerving of na het ongedaan maken van de versleuteling worden bewaard ten behoeve van een gegevensverwerking
      als bedoeld in de [artikelen 49][ref2] en [50][ref3]. Gegevens waarvan in dat kader is vastgesteld dat deze
      niet relevant zijn voor het onderzoek dan wel enig ander lopend onderzoek vallend onder de taken, bedoeld in
      [artikel 8, tweede lid, onder a en d][ref4], onderscheidelijk [artikel 10, tweede lid, onder a, c en e][ref5],
      worden terstond vernietigd. Gegevens die niet op hun relevantie zijn onderzocht, worden na afloop van deze periode
      terstond vernietigd.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0039896#Artikel50
      [ref4]: https://wetten.overheid.nl/BWBR0039896#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0039896#Artikel10
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '49'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0039896
        artikel: '50'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref4
        bwb_id: BWBR0039896
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref5
        bwb_id: BWBR0039896
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '48.6'
    text: |-
      Indien gegevens versleuteld zijn mogen zij in verband met het ongedaan maken van de versleuteling voor een periode
      van ten hoogste drie jaar na verwerving worden bewaard. Versleutelde gegevens worden na afloop van deze periode
      terstond vernietigd. Op een daartoe strekkend verzoek van het hoofd van de dienst aan Onze betrokken Minister
      kan de bewaartermijn telkens voor ten hoogste drie jaren worden verlengd. Het vierde lid is van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel48
  - number: '49.1'
    text: |-
      De diensten zijn bevoegd tot onderzoek aan de gegevens die door de uitoefening van de bevoegdheid, bedoeld in
      [artikel 48][ref1], zijn verworven, met het oog op:


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel48
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '48'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 49.1.a
    text: het vaststellen van de kenmerken en de aard van de telecommunicatie;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel49
  - number: 49.1.b
    text: het vaststellen van de identiteit van de persoon of organisatie behorende bij de telecommunicatie.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel49
  - number: '49.2'
    text: |-
      De diensten zijn voorts in verband met de uitvoering van een verleende toestemming als bedoeld in
      [artikel 50, tweede lid][ref1], bevoegd tot onderzoek aan de ingevolge [artikel 48][ref2] verworven gegevens, met
      het oog op:


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel48
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '50'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '48'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 49.2.a
    text: |-
      het vaststellen en verifiëren van selectiecriteria in relatie tot personen en organisaties die onderscheidenlijk
      onderwerpen welke door de diensten worden onderzocht;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel49
  - number: 49.2.b
    text: |-
      de identificatie van personen of organisaties, welke in het kader van lopende onderzoeken van de dienst in
      aanmerking komen voor onderzoek door de dienst.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel49
  - number: '49.3'
    text: |-
      Van de resultaten van het onderzoek als bedoeld in het eerste en tweede lid mag, indien dat noodzakelijk is voor
      een goede taakuitvoering door de dienst, aantekening worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel49
  - number: '49.4'
    text: |-
      De in het eerste en tweede lid bedoelde bevoegdheid mag slechts worden uitgeoefend, indien door Onze betrokken
      Minister daarvoor op een daartoe strekkend verzoek toestemming is verleend aan het hoofd van de dienst. De
      toestemming voor de uitoefening van de bevoegdheid, bedoeld in het eerste lid, wordt verleend voor een periode
      van ten hoogste een jaar en voor de bevoegdheid, bedoeld in het tweede lid, voor een periode van ten hoogste drie
      maanden. De toestemming kan telkens op een daartoe strekkend verzoek worden verlengd voor eenzelfde periode.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel49
  - number: '49.5'
    text: |-
      Onze betrokken Minister is bevoegd tot het verlenen van toestemming aan door hem bij besluit aangewezen aan hem
      ondergeschikte ambtenaren, welke ter uitvoering van het bepaalde in dit artikel bij uitsluiting van anderen kennis
      mogen nemen van de inhoud van de ingevolge [artikel 48][ref1] verworven gegevens ten behoeve van de in het eerste
      en tweede lid bedoelde activiteiten. Onze betrokken Minister kan de bevoegdheid, bedoeld in de eerste volzin,
      mandateren aan het hoofd van de dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel48
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '48'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '50.1'
    text: 'De diensten zijn bevoegd tot:'
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel50
  - number: 50.1.a
    text: |-
      het selecteren van de gegevens die door de uitoefening van de bevoegdheid, bedoeld in [artikel 48][ref1], zijn
      verzameld;


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel48
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '48'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 50.1.b
    text: |-
      het toepassen van geautomatiseerde data-analyse als bedoeld in [artikel 60][ref1] ten aanzien van de ingevolge
      [artikel 48][ref2] verzamelde gegevens anders dan die welke de inhoud van de desbetreffende telecommunicatie
      betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel48
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '60'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '48'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '50.2'
    text: |-
      De toestemming voor de selectie als bedoeld in het eerste lid, onder a, wordt door Onze betrokken Minister op een
      daartoe strekkend verzoek verleend aan het hoofd van de dienst voor een periode van ten hoogste drie maanden en kan
      telkens op een daartoe strekkend verzoek worden verlengd voor eenzelfde periode. Het verzoek om toestemming bevat
      in aanvulling op hetgeen is bepaald in [artikel 29, tweede lid][ref1], de identiteit van de persoon of organisatie
      of een omschrijving van het onderwerp ten aanzien waarvan de bevoegdheid moet worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel29
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '50.3'
    text: |-
      Ter uitvoering van een door Onze betrokken Minister verleende toestemming als bedoeld in het tweede lid kunnen,
      gerelateerd aan het desbetreffende onderzoek, selectiecriteria worden vastgesteld. Selectiecriteria worden voorzien
      van een toereikende motivering in relatie tot het onderzoek waarvoor ze dienen te worden toegepast. Het vaststellen
      van de selectiecriteria geschiedt door Onze betrokken Minister of namens deze het hoofd van de dienst. Het hoofd
      van de dienst kan aan hem ondergeschikte ambtenaren bij schriftelijk besluit aanwijzen die de toestemming, bedoeld
      in de vorige volzin, namens hem verlenen. Onze betrokken Minister wordt een afschrift van het besluit, bedoeld
      in de vorige volzin, gezonden. Indien de toestemming als bedoeld in het tweede lid vervalt, worden de daaraan
      gerelateerde selectiecriteria terstond verwijderd.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel50
  - number: '50.4'
    text: |-
      De toestemming voor de geautomatiseerde data-analyse als bedoeld in het eerste lid, onder b, voor zover deze
      gericht is op het identificeren van personen of organisaties, waarbij sprake is van een verwerking als bedoeld in
      [artikel 60, tweede lid][ref1], wordt door Onze betrokken Minister op een daartoe strekkend verzoek verleend aan
      het hoofd van de dienst voor een periode van ten hoogste een jaar en kan telkens op een daartoe strekkend verzoek
      worden verlengd voor eenzelfde periode. Het verzoek tot het verlenen van toestemming bevat in aanvulling op hetgeen
      is bepaald in [artikel 29, tweede lid][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel29
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '60'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 50.4.a
    text: |-
      een aanduiding van de toe te passen vorm van geautomatiseerde data-analyse als bedoeld in
      [artikel 60, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel60
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '60'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 50.4.b
    text: |-
      voor zover van toepassing een aanduiding van de gegevensbestanden die in de geautomatiseerde data-analyse worden
      betrokken.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel50
  - number: '51'
    text: |-
      Deze paragraaf is van toepassing op de uitoefening van de bevoegdheid als bedoeld in
      [artikel 47, eerste lid][ref1], waarvoor de medewerking is vereist van een aanbieder van een communicatiedienst op
      wie niet reeds op grond van [artikel 13.2 van de Telecommunicatiewet][ref2] een verplichting tot medewerking rust,
      alsmede op de uitoefening van de bevoegdheid als bedoeld in [artikel 48, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0039896#Artikel48
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '47'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '13'
      - id: ref3
        bwb_id: BWBR0039896
        artikel: '48'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '52.1'
    text: |-
      De diensten zijn bevoegd zich te wenden tot een aanbieder van een communicatiedienst met de opdracht
      gegevens te verstrekken, welke noodzakelijk zijn om toepassing te kunnen geven aan de bevoegdheid, bedoeld in
      [artikel 47, eerste lid][ref1], dan wel [artikel 48, eerste lid][ref2]. Bij algemene maatregel van bestuur worden
      de categorieën van gegevens bepaald, waarop de in de eerste zin bedoelde opdracht betrekking kan hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel48
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '47'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '48'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '52.2'
    text: 'De opdracht wordt schriftelijk verleend door het hoofd van de dienst en omvat ten minste:'
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel52
  - number: 52.2.a
    text: |-
      gegevens betreffende de identiteit van de aanbieder van een communicatiedienst die de gegevens dient te
      verstrekken;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel52
  - number: 52.2.b
    text: een omschrijving van de gegevens die dienen te worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel52
  - number: 52.2.c
    text: een redelijke termijn waarbinnen de gegevens dienen te worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel52
  - number: '52.3'
    text: |-
      De aanbieder van een communicatiedienst is verplicht aan een opdracht als bedoeld in het eerste lid, eerste volzin,
      te voldoen.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel52
  - number: '52.4'
    text: |-
      Op de verstrekking van gegevens ingevolge een opdracht als bedoeld in het eerste lid, is
      [artikel 39, vijfde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel39
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '39'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '52.5'
    text: |-
      [Artikel 13.6, tweede en derde lid, van de Telecommunicatiewet][ref1] is van overeenkomstige toepassing op het
      voldoen aan een opdracht als bedoeld in het eerste lid door aanbieders van communicatiediensten.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel13
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '13'
  - number: '53.1'
    text: |-
      De diensten zijn bevoegd zich te wenden tot een aanbieder van een communicatiedienst met de opdracht om
      medewerking te verlenen aan de uitvoering van de bevoegdheid als bedoeld in [artikel 47, eerste lid][ref1], dan
      wel [artikel 48, eerste lid][ref2], waarvoor op grond van artikel 47, tweede lid, dan wel artikel 48, tweede lid,
      toestemming is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel48
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '47'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '48'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '53.2'
    text: |-
      De in het eerste lid bedoelde bevoegdheid mag slechts worden uitgeoefend, indien door Onze betrokken Minister
      daarvoor op een daartoe strekkend verzoek toestemming is verleend aan het hoofd van de dienst.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel53
  - number: '53.3'
    text: |-
      Het verzoek om toestemming, bedoeld in het tweede lid, wordt gedaan door het hoofd van de dienst en bevat in
      aanvulling op hetgeen is bepaald in [artikel 29, tweede lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel29
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 53.3.a
    text: |-
      gegevens betreffende de identiteit van de aanbieder van een communicatiedienst aan wie de opdracht tot medewerking
      dient te worden opgelegd;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel53
  - number: 53.3.b
    text: |-
      een nauwkeurige omschrijving van de soort medewerking die aan de desbetreffende aanbieder dient te worden
      opgedragen.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel53
  - number: '53.4'
    text: |-
      Een toestemming als bedoeld in het tweede lid wordt niet eerder ter uitvoering gebracht dan nadat ter zake met de
      desbetreffende aanbieder van een communicatiedienst overleg is gevoerd. Het bepaalde in de eerste volzin is niet
      van toepassing ingeval de toestemming ongewijzigd wordt verlengd.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel53
  - number: '53.5'
    text: De aanbieder van een communicatiedienst is verplicht aan een opdracht als bedoeld in het eerste lid te voldoen.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel53
  - number: '53.6'
    text: |-
      De aanbieder van een communicatiedienst is gehouden om de door hem getroffen voorzieningen van technische aard als
      onderdeel van de door hem verlangde medewerking voor een periode van een jaar na afloop van de periode waarvoor de
      opdracht als bedoeld in het eerste lid is gegeven in stand te houden. Onze betrokken Minister of namens deze het
      hoofd van de dienst kan de aanbieder van de verplichting, bedoeld in de eerste volzin, ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel53
  - number: '53.7'
    text: |-
      De aanbieder van een communicatiedienst die ingevolge dit artikel verplicht is medewerking te verlenen aan
      de uitvoering van een opdracht als bedoeld in het eerste lid, heeft naar redelijkheid aanspraak op vergoeding
      uit ’s-Rijks kas van de investerings-, exploitatie- en onderhoudskosten voor de technische voorzieningen die
      zijn of worden gemaakt teneinde te kunnen voldoen aan de opdracht, alsmede van de door de aanbieder van een
      communicatiedienst gemaakte administratie- en personeelskosten rechtstreeks voortvloeiend uit het voldoen aan de
      opdracht.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel53
  - number: '53.8'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de vaststelling en de vergoeding van de kosten,
      bedoeld in het zevende lid.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel53
  - number: '54.1'
    text: 'De diensten zijn bevoegd zich te wenden tot:'
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel54
  - number: 54.1.a
    text: |-
      een aanbieder van een communicatiedienst met de opdracht gegevens te verstrekken die betrekking hebben op de
      telecommunicatie van een gebruiker die door de aanbieder als onderdeel van de door hem verleende communicatiedienst
      ten behoeve van een gebruiker is opgeslagen;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel54
  - number: 54.1.b
    text: |-
      een persoon of instantie die in het kader van de uitoefening van een beroep of bedrijf de opslag verzorgt van
      door derden via geautomatiseerde werken verwerkte gegevens en waartoe voor die derde rechtstreeks geautomatiseerde
      toegang bestaat, met de opdracht de desbetreffende gegevens te verstrekken.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel54
  - number: '54.2'
    text: |-
      De in het eerste lid bedoelde bevoegdheid mag slechts worden uitgeoefend, indien door Onze betrokken Minister
      daarvoor op een daartoe strekkend verzoek toestemming is verleend aan het hoofd van de dienst.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel54
  - number: '54.3'
    text: |-
      Het verzoek om toestemming, bedoeld in het derde lid, wordt schriftelijk gedaan en bevat in aanvulling op hetgeen
      is bepaald in [artikel 29, tweede lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel29
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 54.3.a
    text: |-
      het nummer of een andere aanduiding waarmee de gebruiker als bedoeld in het eerste lid, onder a, onderscheidenlijk
      de derde als bedoeld in het eerste lid, onder b, kan worden geïdentificeerd;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel54
  - number: 54.3.b
    text: een nauwkeurige omschrijving van de gegevens die verstrekt dienen te worden;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel54
  - number: 54.3.c
    text: de periode waarover de gegevens verstrekt dienen te worden.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel54
  - number: '54.4'
    text: |-
      De aanbieder van een communicatiedienst onderscheidenlijk de persoon of instantie die in het kader van de
      uitoefening van een beroep of bedrijf de opslag verzorgt is verplicht aan een opdracht als bedoeld in het eerste
      lid te voldoen.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel54
  - number: '54.5'
    text: |-
      Op de verstrekking van gegevens ingevolge een opdracht als bedoeld in het eerste lid is
      [artikel 39, vijfde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel39
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '39'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '54.6'
    text: |-
      [Artikel 13.6, tweede en derde lid, van de Telecommunicatiewet][ref1] is van overeenkomstige toepassing op het
      voldoen aan een opdracht als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel13
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '13'
  - number: '55.1'
    text: |-
      De diensten zijn bevoegd zich te wenden tot een aanbieder van een communicatiedienst met de opdracht gegevens te
      verstrekken over een gebruiker en over het communicatieverkeer dat met betrekking tot die gebruiker voor of op het
      tijdstip van de opdracht heeft plaatsgevonden dan wel na dat tijdstip zal plaatsvinden. Bij algemene maatregel van
      bestuur worden de gegevens aangewezen waarop de opdracht betrekking kan hebben.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel55
  - number: '55.2'
    text: |-
      De in het eerste lid bedoelde bevoegdheid mag slechts worden uitgeoefend met toestemming van Onze betrokken
      Minister of namens deze het hoofd van de betrokken dienst.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel55
  - number: '55.3'
    text: 'De opdracht als bedoeld in het eerste lid wordt schriftelijk verstrekt en bevat:'
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel55
  - number: 55.3.a
    text: |-
      het nummer dan wel het technisch kenmerk of een andere aanduiding waarmee de gebruiker kan worden geïdentificeerd,
      of
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel55
  - number: 55.3.b
    text: gegevens betreffende de locatie van de gebruiker, en
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel55
  - number: 55.3.c
    text: een omschrijving van de gegevens die verstrekt dienen te worden, alsmede
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel55
  - number: 55.3.d
    text: de periode waarover de gegevens moeten worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel55
  - number: '55.4'
    text: |-
      De aanbieder van een communicatiedienst op wie niet reeds ingevolge [artikel 13.4 van de Telecommunicatiewet][ref1]
      een verplichting tot medewerking rust, is verplicht aan een opdracht als bedoeld in het eerste lid, eerste volzin,
      te voldoen. De verlangde gegevens worden, voor zover bij de opdracht niet anders is bepaald, terstond verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel13
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '13'
  - number: '55.5'
    text: |-
      Op de verstrekking van gegevens ingevolge een opdracht als bedoeld in het eerste lid, is
      [artikel 39, vijfde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel39
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '39'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '55.6'
    text: |-
      [Artikel 13.6, tweede en derde lid, van de Telecommunicatiewet][ref1] is van overeenkomstige toepassing op het
      voldoen aan een opdracht als bedoeld in het eerste lid door aanbieders van communicatiediensten, voor zover zij
      niet reeds op grond van artikel 13.6, tweede lid, van de Telecommunicatiewet in aanmerking komen voor vergoeding
      van de aldaar bedoelde kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel13
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '13'
  - number: '56.1'
    text: |-
      De diensten zijn bevoegd zich te wenden tot een aanbieder van een communicatiedienst met de opdracht gegevens te
      verstrekken ter zake van:
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel56
  - number: 56.1.a
    text: naam, adres, postcode, woonplaats, nummer, technisch kenmerk en soort dienst van een gebruiker, alsmede
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel56
  - number: 56.1.b
    text: |-
      naam, adres, postcode, woonplaats van degene die de rekening betaalt voor de communicatiedienst die de gebruiker
      ter beschikking heeft of heeft gehad en het daartoe gebruikte bankrekeningnummer dan wel betalingsmiddel.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel56
  - number: '56.2'
    text: |-
      Indien de gegevens, bedoeld in het eerste lid, onder a, bij de aanbieder van een openbaar telecommunicatienetwerk
      of openbare telecommunicatiedienst in de zin van de [Telecommunicatiewet][ref1] niet bekend zijn en zij nodig
      zijn voor de toepassing van [artikel 47][ref2] en [artikel 55][ref3] kan de dienst opdragen dat de desbetreffende
      aanbieder de verzochte gegevens achterhaalt en verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0009950
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0039896#Artikel55
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0009950
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '47'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0039896
        artikel: '55'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '56.3'
    text: |-
      De aanbieder van een communicatiedienst op wie niet reeds ingevolge [artikel 13.4 van de Telecommunicatiewet][ref1]
      een verplichting tot medewerking rust is verplicht aan een opdracht als bedoeld in het eerste lid te voldoen. De
      verlangde gegevens worden, voor zover bij de opdracht niet anders is bepaald, terstond verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel13
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '13'
  - number: '56.4'
    text: |-
      Een opdracht aan een aanbieder van een communicatiedienst op wie niet de verplichting tot verstrekking als bedoeld
      in [artikel 13.4 van de Telecommunicatiewet][ref1] van toepassing is, wordt schriftelijk gedaan door of namens het
      hoofd van de desbetreffende dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel13
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '13'
  - number: '56.5'
    text: |-
      Op de verstrekking van gegevens ingevolge een opdracht als bedoeld in het eerste lid is
      [artikel 39, vijfde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel39
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '39'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '56.6'
    text: |-
      [Artikel 13.6, tweede en derde lid, van de Telecommunicatiewet][ref1] is van overeenkomstige toepassing op het
      voldoen aan een opdracht als bedoeld in het eerste lid door aanbieders van communicatiediensten, voor zover zij
      niet reeds op grond van artikel 13.6, tweede lid, van de Telecommunicatiewet in aanmerking komen voor vergoeding
      van de aldaar bedoelde kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel13
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '13'
  - number: '57.1'
    text: |-
      De diensten zijn bevoegd in het kader van de uitoefening van de bevoegdheid, bedoeld in de
      [artikelen 47, eerste lid, tweede volzin][ref1], en [48, eerste lid, tweede volzin][ref2], zich te wenden
      tot degene van wie redelijkerwijs vermoed wordt dat hij kennis draagt van de wijze van versleuteling van de
      desbetreffende gesprekken, telecommunicatie of gegevensoverdracht met de opdracht alle noodzakelijke medewerking
      te verlenen tot het ontsleutelen van de gegevens door hetzij deze kennis ter beschikking te stellen, hetzij de
      versleuteling ongedaan te maken. Een opdracht ziet niet op het inbouwen van het afzwakken van de encryptie van de
      systemen of op het inbouwen van toegang tot de systemen om ontsleutelde gegevens te verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel48
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '47'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '48'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '57.2'
    text: |-
      De bevoegdheid, bedoeld in het eerste lid, mag slechts worden uitgeoefend indien door Onze betrokken Minister op
      een daartoe strekkend verzoek toestemming is verleend aan het hoofd van de dienst.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel57
  - number: '57.3'
    text: |-
      Het verzoek om toestemming, bedoeld in het tweede lid, is schriftelijk en bevat in aanvulling op hetgeen is bepaald
      in [artikel 29, tweede lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel29
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 57.3.a
    text: gegevens betreffende de identiteit van de persoon aan wie de opdracht tot medewerking wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel57
  - number: 57.3.b
    text: |-
      een omschrijving van de gesprekken, telecommunicatie of de gegevensoverdracht ten aanzien waarvan de medewerking
      wordt opgedragen.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel57
  - number: '57.4'
    text: De persoon aan wie een opdracht als bedoeld in het eerste lid wordt gericht is verplicht daaraan te voldoen.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel57
  - number: '58.1'
    text: 'De diensten hebben toegang tot elke plaats, voor zover dat redelijkerwijs nodig is om:'
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel58
  - number: 58.1.a
    text: |-
      observatie- en registratiemiddelen als bedoeld in [artikel 40, eerste lid, onder a][ref1], aan te brengen, te
      vervangen of te verwijderen alsmede daarmee samenhangende voorbereidende activiteiten uit te voeren;


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel40
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 58.1.b
    text: |-
      volgmiddelen, plaatsbepalingsapparatuur en registratiemiddelen als bedoeld in
      [artikel 40, eerste lid, onder b][ref1], aan te brengen, te vervangen of te verwijderen alsmede daarmee
      samenhangende voorbereidende activiteiten uit te voeren;


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel40
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 58.1.c
    text: |-
      de bevoegdheid, bedoeld in [artikel 42, eerste lid, onder a][ref1], uit te oefenen;


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel42
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '42'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 58.1.d
    text: |-
      de bevoegdheid, bedoeld in [artikel 45][ref1], uit te oefenen;


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel45
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 58.1.e
    text: |-
      de bevoegdheid, bedoeld in [artikel 47][ref1], uit te oefenen, waaronder begrepen het aanbrengen, vervangen of
      verwijderen van een technisch hulpmiddel alsmede daarmee samenhangende voorbereidende activiteiten uit te voeren;


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel47
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '47'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 58.1.f
    text: |-
      met betrekking tot de aldaar aanwezige telecommunicatie-apparatuur de gegevens te verzamelen die noodzakelijk zijn
      om de bevoegdheid, waarvoor overeenkomstig [artikel 47, zesde lid][ref1], toestemming is verleend, uit te kunnen
      oefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel47
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '47'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '58.2'
    text: |-
      De uitoefening van de bevoegdheid, bedoeld in het eerste lid, is slechts toegestaan door personen die daartoe door
      het hoofd van een dienst zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel58
  - number: '58.3'
    text: |-
      De [artikelen 1, eerste, tweede en derde lid][ref1], en
      [artikel 2, eerste lid, laatste volzin, van de Algemene wet op het binnentreden][ref2] zijn niet van toepassing.
      Onze betrokken Minister of namens deze het hoofd van een dienst is bevoegd tot het geven van een machtiging als
      bedoeld in artikel 2 van de Algemene wet op het binnentreden.


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006763#Artikel2
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006763
        artikel: '2'
  - number: '58.4'
    text: |-
      Het eerste tot en met derde lid zijn van overeenkomstige toepassing op het verwijderen van een technisch
      hulpmiddel, indien de toestemming voor de uitoefening van de bijzondere bevoegdheid in welk kader het technisch
      hulpmiddel is toegepast inmiddels is beëindigd.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel58
  - number: '59.1'
    text: |-
      Onze betrokken Minister onderzoekt vijf jaar na de beëindiging van de uitoefening van een bijzondere bevoegdheid
      als bedoeld in de [artikelen 44, eerste lid][ref1], [47, eerste lid][ref2], alsmede [artikel 58, eerste lid][ref3],
      voor zover is binnengetreden in een woning zonder toestemming van de bewoner, en daarna telkens eenmaal per jaar,
      of de persoon ten aanzien van wie één van deze bijzondere bevoegdheden is uitgeoefend, daarvan verslag kan worden
      uitgebracht. Indien dit mogelijk is, geschiedt dit zo spoedig mogelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0039896#Artikel58
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '44'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '47'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0039896
        artikel: '58'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '59.2'
    text: |-
      Indien het uitbrengen van het verslag aan de persoon ten aanzien van wie de bijzondere bevoegdheden, bedoeld in
      het eerste lid, zijn uitgeoefend niet mogelijk is, wordt de commissie van toezicht hiervan op de hoogte gesteld. De
      mededeling aan de commissie gaat vergezeld van de motivering waarom het verslag niet kan worden uitgebracht.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel59
  - number: '59.3'
    text: 'Het verslag is schriftelijk en omvat uitsluitend:'
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel59
  - number: 59.3.a
    text: gegevens betreffende de identiteit van de betrokken persoon;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel59
  - number: 59.3.b
    text: |-
      een aanduiding van de bijzondere bevoegdheid als bedoeld in het eerste lid die ten aanzien van de betrokken persoon
      is uitgeoefend;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel59
  - number: 59.3.c
    text: |-
      de persoon of instantie die voor de uitoefening van de bijzondere bevoegdheid toestemming, machtiging dan wel last
      heeft verleend;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel59
  - number: 59.3.d
    text: de datum waarop voor de bevoegdheidsuitoefening toestemming, machtiging dan wel last is verleend;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel59
  - number: 59.3.e
    text: |-
      de periode gedurende welke de bevoegdheidsuitoefening heeft plaatsgevonden en, indien de uitoefening van de
      bevoegdheid betrekking had op het binnentreden van een woning zonder toestemming van de bewoner, een aanduiding van
      de woning waarin is binnengetreden.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel59
  - number: '59.4'
    text: |-
      Voor zover de bevoegdheidsuitoefening het binnentreden van een woning zonder toestemming van de bewoner betreft,
      blijft [artikel 10, tweede lid, van de Algemene wet op het binnentreden][ref1] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel10
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '10'
  - number: '59.5'
    text: |-
      De verplichting tot het uitbrengen van een verslag, bedoeld in het eerste lid, vervalt op het moment dat is
      vastgesteld dat zulks redelijkerwijs niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel59
  - number: '59.6'
    text: |-
      Het uitbrengen van een verslag aan de persoon wordt uitgesteld, indien de desbetreffende bijzondere bevoegdheid is
      uitgeoefend in het kader van een onderzoek, waaromtrent verstrekking van gegevens aan de betrokken persoon, indien
      deze op het moment van onderzoek een aanvraag als bedoeld in [artikel 76][ref1] zou hebben ingediend, ingevolge
      [artikel 82][ref2] zou moeten worden geweigerd.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel82
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '76'
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '82'
        hoofdstuk: '5'
        paragraaf: '5.5'
  - number: '59.7'
    text: |-
      De verplichting tot onderzoek, bedoeld in het eerste lid, vervalt, indien het uitbrengen van een verslag omtrent de
      uitoefening van de desbetreffende bijzondere bevoegdheid naar redelijke verwachting ertoe leidt, dat:
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel59
  - number: 59.7.a
    text: bronnen van een dienst, daaronder begrepen inlichtingen- en veiligheidsdiensten van andere landen, worden onthuld;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel59
  - number: 59.7.b
    text: betrekkingen met andere landen en met internationale organisaties ernstig worden geschaad;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel59
  - number: 59.7.c
    text: |-
      een specifieke toepassing van een methode van een dienst of de identiteit van degene die de betrokken dienst
      behulpzaam is geweest bij de toepassing van de methode worden onthuld.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel59
  - number: '60.1'
    text: 'De diensten zijn bevoegd om geautomatiseerde data-analyse toe te passen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel60
  - number: 60.1.a
    text: gegevens uit eigen geautomatiseerde gegevensbestanden,
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel60
  - number: 60.1.b
    text: gegevens uit voor een ieder toegankelijke informatiebronnen,
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel60
  - number: 60.1.c
    text: |-
      gegevens uit geautomatiseerde gegevensbestanden waartoe de diensten rechtstreeks geautomatiseerde toegang hebben,
      en
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel60
  - number: 60.1.d
    text: gegevens uit door derden verstrekte geautomatiseerde gegevensbestanden.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel60
  - number: '60.2'
    text: 'Ten behoeve van de verwerking van de gegevens als bedoeld in het eerste lid kunnen de gegevens in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel60
  - number: 60.2.a
    text: |-
      op geautomatiseerde wijze onderling met elkaar worden vergeleken, dan wel in combinatie met elkaar worden
      vergeleken,
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel60
  - number: 60.2.b
    text: worden doorzocht aan de hand van profielen, en
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel60
  - number: 60.2.c
    text: worden vergeleken met het oog op het opsporen van bepaalde patronen.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel60
  - number: '60.3'
    text: |-
      Het bevorderen of treffen van maatregelen jegens een persoon uitsluitend op basis van de resultaten van een
      gegevensverwerking als bedoeld in het tweede lid is niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel60
  - number: '61'
    text: |-
      De verstrekking van door of ten behoeve van een dienst verwerkte gegevens aan een binnen de dienst of
      ingevolge [artikel 91][ref1] ten behoeve van de Algemene Inlichtingen- en Veiligheidsdienst werkzame ambtenaar
      onderscheidenlijk ingevolge [artikel 92][ref2] ten behoeve van de Militaire Inlichtingen- en Veiligheidsdienst
      werkzame ambtenaar vindt slechts plaats, voor zover dat noodzakelijk is voor een goede uitvoering van de aan de
      desbetreffende ambtenaar opgedragen taak.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel92
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '91'
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '92'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: '62.1'
    text: |-
      De diensten zijn in het kader van een goede taakuitvoering bevoegd om omtrent door of ten behoeve van de dienst
      verwerkte gegevens mededeling te doen aan:
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel62
  - number: 62.1.a
    text: Onze Ministers wie deze aangaan;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel62
  - number: 62.1.b
    text: andere bestuursorganen wie deze aangaan;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel62
  - number: 62.1.c
    text: andere personen of instanties wie deze aangaan;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel62
  - number: 62.1.d
    text: |-
      daarvoor in aanmerking komende inlichtingen- en veiligheidsdiensten van andere landen waarmee een
      samenwerkingsrelatie als bedoeld in [artikel 88, eerste lid][ref1], wordt onderhouden, alsmede andere daarvoor in
      aanmerking komende internationale beveiligings-, verbindingsinlichtingen- en inlichtingenorganen.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel88
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '88'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '62.2'
    text: |-
      Een mededeling als bedoeld in het eerste lid geschiedt door Onze betrokken Minister, indien de aard van de
      mededeling daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel62
  - number: '62.3'
    text: |-
      Onverminderd de mededeling, bedoeld in het eerste lid, kan van door de diensten verwerkte gegevens voorts slechts
      mededeling worden gedaan in de gevallen voorzien bij deze wet.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel62
  - number: '63.1'
    text: |-
      Onverminderd het bepaalde in [artikel 62][ref1] kan in het kader van een goede taakuitvoering op
      een daartoe strekkend schriftelijk verzoek als bedoeld in [artikel 8, tweede lid, onder f][ref2], en
      [artikel 10, tweede lid, onder g][ref3], mededeling worden gedaan omtrent door de dienst verwerkte gegevens omtrent
      een persoon of instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0039896#Artikel10
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '62'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref3
        bwb_id: BWBR0039896
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '63.2'
    text: |-
      Een verzoek als bedoeld in het eerste lid wordt gericht aan Onze betrokken Minister en bevat in ieder geval de
      volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel63
  - number: 63.2.a
    text: |-
      naam, voornamen, adres en geboortedatum van de betrokken persoon dan wel identificerende gegevens betreffende de
      instantie;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel63
  - number: 63.2.b
    text: voor zover van toepassing een verklaring van de betrokken persoon dat hij instemt met het verzoek;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel63
  - number: 63.2.c
    text: de aanleiding voor het verzoek.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel63
  - number: '63.3'
    text: |-
      Een verklaring als bedoeld in het tweede lid, onder b, kan achterwege blijven indien dit de effectiviteit van het
      uitvoeren van het verzoek zou kunnen schaden.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel63
  - number: '63.4'
    text: |-
      Een mededeling als bedoeld in het eerste lid geschiedt door Onze betrokken Minister dan wel namens deze het hoofd
      van de betrokken dienst, voor zover dit in de regeling als bedoeld in [artikel 8, tweede lid, onder f][ref1], of,
      [10, tweede lid, onder g][ref2], is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel10
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '64.1'
    text: |-
      De diensten zijn in het kader van een goede taakuitvoering voorts bevoegd om op grond van een dringende en
      gewichtige reden gegevens te verstrekken aan:
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel64
  - number: 64.1.a
    text: |-
      een inlichtingen- of veiligheidsdienst van een ander land waarmee geen samenwerkingsrelatie bestaat als bedoeld in
      [artikel 88, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel88
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '88'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 64.1.b
    text: |-
      een inlichtingen- of veiligheidsdienst van een ander land waarmee een samenwerkingsrelatie bestaat als bedoeld
      in [artikel 88, eerste lid][ref1], maar waarbij in het kader van de weging, bedoeld in artikel 88, tweede lid, is
      vastgesteld dat daaraan regulier geen gegevens kunnen worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel88
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '88'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '64.2'
    text: |-
      Een verstrekking als bedoeld in het eerste lid vindt niet eerder plaats dan nadat Onze betrokken Minister op een
      daartoe strekkend verzoek van het hoofd van de dienst toestemming heeft verleend.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel64
  - number: '64.3'
    text: |-
      Van een toestemming tot verstrekking van ongeëvalueerde gegevens wordt de commissie van toezicht terstond op de
      hoogte gesteld.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel64
  - number: '65.1'
    text: |-
      De verstrekking van gegevens kan geschieden onder de voorwaarde dat degene aan wie de gegevens worden verstrekt,
      deze gegevens niet aan anderen mag verstrekken.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel65
  - number: '65.2'
    text: |-
      De voorwaarde, bedoeld in het eerste lid, wordt in ieder geval gesteld, indien gegevens worden verstrekt aan
      een instantie als bedoeld in [artikel 62, eerste lid, onder d][ref1], alsmede aan een instantie als bedoeld in
      [artikel 64, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel64
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '62'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '64'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '65.3'
    text: |-
      Indien gegevens zijn verstrekt onder de voorwaarde dat deze niet aan anderen mogen worden verstrekt, kan door Onze
      betrokken Minister of namens deze het hoofd van de dienst alsnog toestemming worden verleend om deze aan andere
      personen of instanties te verstrekken. Aan de toestemming kunnen voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel65
  - number: '66.1'
    text: |-
      Onze betrokken Minister of namens deze het hoofd van de dienst kan, indien bij de verwerking van gegevens door of
      ten behoeve van een dienst blijkt van gegevens die tevens van belang kunnen zijn voor de opsporing of vervolging
      van strafbare feiten, uit eigen beweging dan wel desgevraagd daarvan schriftelijk mededeling doen aan het daartoe
      aangewezen lid van het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel66
  - number: '66.2'
    text: |-
      In spoedeisende gevallen kan de mededeling, bedoeld in het eerste lid, mondeling geschieden. Onze betrokken
      Minister of namens deze het hoofd van de dienst bevestigt de desbetreffende mededeling zo spoedig mogelijk
      schriftelijk.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel66
  - number: '66.3'
    text: |-
      Indien de mededeling, bedoeld in het eerste lid, betrekking heeft op gegevens die betrekking hebben op de
      vertrouwelijke communicatie tussen een advocaat en diens cliënt wordt voorafgaand aan het doen van die mededeling
      toestemming van de rechtbank Den Haag gevraagd. Indien de toestemming niet wordt verleend, blijft de mededeling
      achterwege. Het tweede lid is niet van toepassing op een mededeling als bedoeld in de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel66
  - number: '66.4'
    text: |-
      Op een daartoe strekkend verzoek van het daartoe aangewezen lid van het openbaar ministerie wordt inzage gegeven in
      alle aan de mededeling ten grondslag liggende gegevens die voor de beoordeling van de juistheid van de mededeling
      noodzakelijk zijn. De [artikelen 135][ref1] en [136][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel135
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel136
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '135'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '136'
        hoofdstuk: '8'
  - number: '67.1'
    text: |-
      Onverminderd het bepaalde in [artikel 66][ref1] kan voorts, indien bij de verwerking van gegevens door of ten
      behoeve van een dienst daarvan is gebleken, uit eigen beweging dan wel desgevraagd op grond van een dringende en
      gewichtige reden schriftelijk mededeling worden gedaan van gegevens aan bij of krachtens algemene maatregel van
      bestuur aangewezen personen of instanties die betrokken zijn bij de uitvoering van een publieke taak, voor zover
      deze gegevens tevens van belang kunnen zijn voor de behartiging van de aan hen in dat kader opgedragen belangen.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel66
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '66'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '67.2'
    text: |-
      [Artikel 68, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel68
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '68'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '67.3'
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel67
  - number: '68.1'
    text: |-
      Persoonsgegevens worden door Onze betrokken Minister of namens deze het hoofd van de dienst schriftelijk
      medegedeeld, indien de persoon of instantie waaraan de desbetreffende mededeling wordt gedaan naar aanleiding van
      die mededeling jegens de desbetreffende persoon bevoegd is maatregelen te treffen.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel68
  - number: '68.2'
    text: |-
      In spoedeisende gevallen kan de mededeling, bedoeld in het eerste lid, mondeling geschieden. Onze betrokken
      Minister of namens deze het hoofd van de dienst bevestigt de desbetreffende mededeling zo spoedig mogelijk
      schriftelijk.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel68
  - number: '68.3'
    text: |-
      Onze betrokken Minister of namens deze het hoofd van de dienst kan aan een persoon of instantie inzage verlenen in
      de aan de mededeling ten grondslag liggende gegevens, voor zover dat voor de beoordeling van de juistheid van de
      mededeling noodzakelijk is. De [artikelen 135][ref1] en [136, tweede en derde lid][ref2], zijn van overeenkomstige
      toepassing op de personen en instanties waaraan inzage in de desbetreffende gegevens is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel135
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel136
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '135'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '136'
        hoofdstuk: '8'
  - number: '69.1'
    text: |-
      Verstrekking van persoonsgegevens waarvan de juistheid redelijkerwijs niet kan worden vastgesteld of die meer dan
      10 jaar geleden zijn verwerkt, terwijl ten aanzien van de desbetreffende persoon sindsdien geen nieuwe gegevens
      zijn verwerkt, vindt niet plaats.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel69
  - number: '69.2'
    text: 'In afwijking van het eerste lid kan over persoonsgegevens slechts mededeling worden gedaan aan:'
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel69
  - number: 69.2.a
    text: |-
      een dienst of een instantie, bedoeld in [artikel 62, eerste lid, onder d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel62
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '62'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 69.2.b
    text: instanties die zijn belast met de opsporing en vervolging van strafbare feiten;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel69
  - number: 69.2.c
    text: andere instanties in door Onze betrokken Minister te bepalen bijzondere gevallen.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel69
  - number: '69.3'
    text: |-
      Bij een mededeling als bedoeld in het tweede lid wordt de mate van betrouwbaarheid alsmede de ouderdom van
      de daaraan ten grondslag liggende gegevens vermeld. Indien met betrekking tot de desbetreffende gegevens een
      verklaring als bedoeld in [artikel 77, eerste lid][ref1], voorhanden is, wordt deze gelijktijdig verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel77
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '77'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '69.4'
    text: |-
      [Artikel 68, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel68
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '68'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '70'
    text: Van de verstrekking van persoonsgegevens wordt aantekening gehouden.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel70
  - number: '71'
    text: |-
      Op de uitoefening van de bijzondere bevoegdheden in dit hoofdstuk zijn de [artikelen 28][ref1], [29][ref2] en
      [31][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0039896#Artikel31
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0039896
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '72.1'
    text: |-
      De diensten zijn bevoegd tot het oprichten en de inzet van rechtspersonen ter voorbereiding op en ondersteuning van
      operationele activiteiten.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel72
  - number: '72.2'
    text: |-
      De uitoefening van de bevoegdheid, bedoeld in het eerste lid, is slechts toegestaan, indien Onze betrokken Minister
      of namens deze het hoofd van een dienst daarvoor toestemming heeft verleend. Het hoofd van een dienst kan aan
      hem ondergeschikte ambtenaren bij schriftelijk besluit aanwijzen die de toestemming, bedoeld in de eerste volzin,
      namens hem verlenen. Onze betrokken Minister wordt een afschrift van het besluit, bedoeld in de tweede volzin,
      gezonden.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel72
  - number: '72.3'
    text: |-
      De toestemming voor de inzet van een rechtspersoon wordt verleend voor de duur van het onderzoek waarbij deze wordt
      ingezet, met inbegrip van de periode die nodig is om tot een verantwoorde afbouw van de inzet in verband met het
      desbetreffende onderzoek te komen.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel72
  - number: '72.4'
    text: |-
      Met betrekking tot het oprichten van rechtspersonen als bedoeld in het eerste lid blijft
      [artikel 4.7, eerste lid, aanhef en onderdeel a, en vierde lid, van de Comptabiliteitswet 2016][ref1] buiten
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel4
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '4'
  - number: '73.1'
    text: |-
      De diensten zijn bevoegd tot het bevorderen of treffen van maatregelen ter bescherming van door de desbetreffende
      dienst te behartigen belangen, al dan niet met behulp van een technisch hulpmiddel.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel73
  - number: '73.2'
    text: |-
      De uitoefening van de bevoegdheid, bedoeld in het eerste lid, is slechts toegestaan, indien Onze betrokken Minister
      of namens deze het hoofd van een dienst daarvoor toestemming heeft verleend. Het hoofd van een dienst kan aan
      hem ondergeschikte ambtenaren bij schriftelijk besluit aanwijzen die de toestemming, bedoeld in de eerste volzin,
      namens hem verlenen. Onze betrokken Minister wordt een afschrift van het besluit, bedoeld in de tweede volzin,
      gezonden.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel73
  - number: '73.3'
    text: |-
      Bij het bevorderen of treffen van een maatregel wordt slechts die maatregel bevorderd of getroffen, die gelet
      op de omstandigheden van het geval, waaronder de ernst van de bedreiging van de door een dienst te beschermen
      belangen, voor de betrokkene het minste nadeel oplevert. [Artikel 26, tweede tot en met vierde lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel26
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '73.4'
    text: |-
      Het bevorderen of treffen van maatregelen als bedoeld in het eerste lid kan bij een instructie als bedoeld in
      [artikel 41, eerste lid][ref1], worden opgedragen aan een natuurlijke persoon als bedoeld in dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel41
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '41'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '73.5'
    text: |-
      In het geval dat het bevorderen of treffen van maatregelen wordt opgedragen aan een medewerker van de dienst, is
      [artikel 41, vierde tot en met zevende lid][ref1], van overeenkomstige toepassing, met dien verstande dat onder «de
      natuurlijke persoon» of «persoon» in de desbetreffende artikelleden wordt verstaan: de medewerker van de dienst die
      wordt belast met de feitelijke uitvoering van de in het eerste lid bedoelde handelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel41
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '41'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '74'
    text: |-
      Onverminderd de kennisneming van op grond van [paragraaf 3.4][ref1] verstrekte gegevens, kan van de gegevens
      verwerkt door of ten behoeve van een dienst slechts kennis worden genomen overeenkomstig de bepalingen van dit
      hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0039896
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '75'
    text: |-
      In dit hoofdstuk wordt onder document, bestuurlijke aangelegenheid, intern beraad, persoonlijke
      beleidsopvatting, ambtelijk of gemengd samengestelde adviescommissie verstaan, hetgeen daaronder
      in [artikel 1 van de Wet openbaarheid van bestuur][ref1] dan wel in de [artikelen 1][ref2] en
      [12 van de Wet openbaarheid van bestuur BES][ref3] wordt verstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028154#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0028154#Artikel12
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0028154
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0028154
        artikel: '12'
  - number: '76.1'
    text: |-
      Onze betrokken Minister deelt een ieder op diens aanvraag zo spoedig mogelijk, doch uiterlijk binnen drie maanden
      mede of en, zo ja, welke hem betreffende persoonsgegevens door of ten behoeve van een dienst zijn verwerkt. Onze
      betrokken Minister kan zijn besluit voor ten hoogste vier weken verdagen. Van de verdaging wordt voor de afloop van
      de eerste termijn schriftelijk gemotiveerd mededeling gedaan aan de aanvrager.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel76
  - number: '76.2'
    text: Een aanvraag als bedoeld in het eerste lid kan langs elektronische weg worden gedaan.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel76
  - number: '76.3'
    text: |-
      Voor zover een aanvraag als bedoeld in het eerste lid wordt ingewilligd, stelt Onze betrokken Minister de aanvrager
      zo spoedig mogelijk, doch uiterlijk binnen vier weken na bekendmaking van zijn besluit in de gelegenheid van zijn
      gegevens kennis te nemen.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel76
  - number: '76.4'
    text: Onze betrokken Minister draagt zorg voor een deugdelijke vaststelling van de identiteit van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel76
  - number: '77.1'
    text: |-
      Degene die ingevolge [artikel 76][ref1] kennis heeft genomen van door of ten behoeve van een dienst omtrent
      hem verwerkte gegevens, kan daaromtrent een schriftelijke verklaring overleggen. Deze verklaring wordt bij de
      desbetreffende gegevens gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel76
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '76'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '77.2'
    text: |-
      Bij de kennisneming door betrokkene van de hem betreffende gegevens, wordt deze gewezen op het bepaalde in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel77
  - number: '77.3'
    text: De verklaring wordt gelijktijdig met de gegevens waarop deze betrekking heeft verwijderd en vernietigd.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel77
  - number: '78.1'
    text: |-
      In afwijking van [artikel 76][ref1] stelt het hoofd van een dienst een persoon werkzaam bij of ten behoeve van een
      dienst of werkzaam geweest bij of ten behoeve van een dienst op diens verzoek zo spoedig mogelijk, doch uiterlijk
      binnen vier weken na het verzoek, in de gelegenheid van zijn gegevens in de personeels- en salarisadministratie van
      de desbetreffende dienst kennis te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel76
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '76'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '78.2'
    text: Van inzage zijn uitgezonderd de gegevens die zicht kunnen geven op bronnen die geheim moeten worden gehouden.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel78
  - number: '78.3'
    text: |-
      Het hoofd van een dienst kan, in afwijking van [artikel 2:1, eerste lid, van de Algemene wet bestuursrecht][ref1],
      bepalen dat kennisneming van de gegevens slechts is voorbehouden aan de betrokken persoon persoonlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: '78.4'
    text: |-
      Degene die kennis heeft genomen van de hem betreffende gegevens, kan het hoofd van de dienst schriftelijk verzoeken
      deze te verbeteren, aan te vullen of te verwijderen, indien deze feitelijk onjuist zijn, voor het doel van de
      verwerking onvolledig of niet ter zake dienend zijn dan wel in strijd met een wettelijk voorschrift zijn verwerkt.
      Het verzoek behelst de aan te brengen wijzigingen.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel78
  - number: '78.5'
    text: |-
      Het hoofd van een dienst bericht de verzoeker binnen zes weken na ontvangst van het verzoek, bedoeld in het vierde
      lid, of dan wel in hoeverre hij daaraan voldoet.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel78
  - number: '78.6'
    text: |-
      [Artikel 85][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel85
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '85'
        hoofdstuk: '5'
        paragraaf: '5.5'
  - number: '79.1'
    text: |-
      [Artikel 76][ref1] is van overeenkomstige toepassing op een aanvraag met betrekking tot persoonsgegevens die zijn
      verwerkt door of ten behoeve van een dienst ten aanzien van een overleden echtgenoot, geregistreerd partner, kind
      of ouder van de aanvrager.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel76
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '76'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '79.2'
    text: 'In de aanvraag, bedoeld in het eerste lid, worden ten minste de volgende gegevens vermeld:'
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel79
  - number: 79.2.a
    text: naam en voorletters van de overledene;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel79
  - number: 79.2.b
    text: geboortedatum en geboorteplaats van de overledene;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel79
  - number: 79.2.c
    text: datum van overlijden en plaats van overlijden;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel79
  - number: 79.2.d
    text: de hoedanigheid van de overledene in relatie tot de aanvrager.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel79
  - number: '79.3'
    text: |-
      In de gevallen dat blijkt dat de aanvraag, bedoeld in het eerste lid, betrekking heeft op gegevens van een persoon
      die nog niet is overleden of op gegevens van een overleden persoon die niet de hoedanigheid van echtgenoot,
      geregistreerd partner, kind of ouder van de aanvrager heeft wordt de aanvraag niet ontvankelijk verklaard.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel79
  - number: '80.1'
    text: |-
      Onze betrokken Minister deelt een ieder op diens aanvraag zo spoedig mogelijk, doch uiterlijk binnen drie
      maanden mede of kennis kan worden genomen van andere dan persoonsgegevens betreffende de in de aanvraag vermelde
      bestuurlijke aangelegenheid. Onze betrokken Minister kan zijn besluit voor ten hoogste vier weken verdagen. Van de
      verdaging wordt voor de afloop van de eerste termijn schriftelijk gemotiveerd mededeling gedaan aan de aanvrager.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel80
  - number: '80.2'
    text: |-
      Voor zover een aanvraag als bedoeld in het eerste lid wordt ingewilligd, stelt Onze betrokken Minister de
      aanvrager zo spoedig mogelijk doch uiterlijk binnen vier weken na bekendmaking van zijn besluit in kennis van de
      desbetreffende gegevens.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel80
  - number: '81.1'
    text: 'Onze betrokken Minister stelt de aanvrager in kennis van de desbetreffende gegevens door:'
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel81
  - number: 81.1.a
    text: |-
      het geven van een kopie van het document waarin de gegevens zijn neergelegd of door de letterlijke inhoud daarvan
      in andere vorm te verstrekken,
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel81
  - number: 81.1.b
    text: inzage van de inhoud van het desbetreffende document toe te staan,
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel81
  - number: 81.1.c
    text: een uittreksel of een samenvatting van de inhoud van het desbetreffende document te geven of
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel81
  - number: 81.1.d
    text: inlichtingen uit het desbetreffende document te verschaffen.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel81
  - number: '81.2'
    text: |-
      Bij het kiezen tussen de vormen van inkennisstelling houdt Onze betrokken Minister rekening met de voorkeur van de
      aanvrager en het belang van de dienst.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel81
  - number: '81.3'
    text: |-
      Voor het vervaardigen van kopieën van documenten en uittreksels of samenvattingen van de inhoud daarvan kan van de
      aanvrager een vergoeding worden gevraagd. De bij of krachtens [artikel 12 van de Wet openbaarheid van bestuur][ref1]
      dan wel [artikel 14 van de Wet openbaarheid van bestuur BES][ref2] gestelde regels zijn daarop van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0028154#Artikel14
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0028154
        artikel: '14'
  - number: '82.1'
    text: |-
      Een aanvraag als bedoeld in [artikel 76][ref1] wordt in ieder geval afgewezen, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel76
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '76'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 82.1.a
    text: 'betreffende de aanvrager in het kader van enig onderzoek gegevens zijn verwerkt, tenzij:'
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel82
  - number: 82.1.a.1°
    text: de desbetreffende gegevens meer dan 5 jaar geleden zijn verwerkt,
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel82
  - number: 82.1.a.2°
    text: |-
      met betrekking tot de aanvrager sindsdien geen nieuwe gegevens zijn verwerkt in verband met het onderzoek in het
      kader waarvan de desbetreffende gegevens zijn verwerkt, en
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel82
  - number: 82.1.a.3°
    text: de desbetreffende gegevens niet relevant zijn voor enig lopend onderzoek;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel82
  - number: 82.1.b
    text: betreffende de aanvrager geen gegevens zijn verwerkt.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel82
  - number: '82.2'
    text: |-
      Indien een aanvraag ingevolge het eerste lid wordt afgewezen, wordt bij de motivering van de afwijzing slechts in
      algemene termen gewezen op alle aldaar vermelde gronden voor de afwijzing.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel82
  - number: '83'
    text: |-
      [Artikel 82][ref1] is van overeenkomstige toepassing op een aanvraag als bedoeld in [artikel 79][ref2] met dien
      verstande dat in artikel 82 voor «de aanvrager» wordt gelezen: de overleden persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel79
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '82'
        hoofdstuk: '5'
        paragraaf: '5.5'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '79'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '84.1'
    text: |-
      Een aanvraag als bedoeld in [artikel 80][ref1] wordt afgewezen, voor zover verstrekking van de gegevens waarop de
      aanvraag betrekking heeft:


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel80
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '80'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 84.1.a
    text: de eenheid van de Kroon in gevaar zou kunnen brengen;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel84
  - number: 84.1.b
    text: de nationale veiligheid zou kunnen schaden;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel84
  - number: 84.1.c
    text: |-
      bedrijfs- en fabricagegegevens betreft, die door natuurlijke personen of rechtspersonen vertrouwelijk aan de
      overheid zijn medegedeeld.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel84
  - number: '84.2'
    text: |-
      Een aanvraag wordt voorts afgewezen voor zover het belang van verstrekking van de gegevens waarop de aanvraag
      betrekking heeft, niet opweegt tegen de volgende belangen:
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel84
  - number: 84.2.a
    text: de betrekkingen van Nederland met andere landen en met internationale organisaties;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel84
  - number: 84.2.b
    text: de economische of financiële belangen van de staat, de andere publiekrechtelijke lichamen of bestuursorganen;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel84
  - number: 84.2.c
    text: de opsporing en vervolging van strafbare feiten;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel84
  - number: 84.2.d
    text: inspectie, controle en toezicht door of vanwege bestuursorganen;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel84
  - number: 84.2.e
    text: de eerbiediging van de persoonlijke levenssfeer;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel84
  - number: 84.2.f
    text: |-
      het belang, dat de persoon of organisatie waarop de gegevens betrekking hebben erbij heeft om als eerste kennis te
      kunnen nemen van de gegevens;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel84
  - number: 84.2.g
    text: |-
      het voorkomen van onevenredige bevoordeling of benadeling van bij de aangelegenheid betrokken natuurlijke personen
      of rechtspersonen dan wel derden.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel84
  - number: '84.3'
    text: |-
      Indien een aanvraag tot kennisneming wordt afgewezen wordt de commissie van toezicht hiervan op de hoogte gesteld.
      De mededeling aan de commissie gaat vergezeld van een motivering waarom het verzoek is afgewezen.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel84
  - number: '84.4'
    text: |-
      De voorgaande leden zijn van overeenkomstige toepassing op een aanvraag als bedoeld in [artikel 76][ref1]
      onderscheidenlijk [79][ref2], voor zover een dergelijke aanvraag niet wordt afgewezen ingevolge [artikel 82][ref3]
      onderscheidenlijk [83][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel79
      [ref3]: https://wetten.overheid.nl/BWBR0039896#Artikel82
      [ref4]: https://wetten.overheid.nl/BWBR0039896#Artikel83
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '76'
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '79'
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref3
        bwb_id: BWBR0039896
        artikel: '82'
        hoofdstuk: '5'
        paragraaf: '5.5'
      - id: ref4
        bwb_id: BWBR0039896
        artikel: '83'
        hoofdstuk: '5'
        paragraaf: '5.5'
  - number: '85.1'
    text: |-
      In het geval dat de aanvraag betrekking heeft op gegevens vervat in documenten, opgesteld ten behoeve van intern
      beraad, worden geen gegevens verstrekt over daarin opgenomen persoonlijke beleidsopvattingen.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel85
  - number: '85.2'
    text: |-
      Over persoonlijke beleidsopvattingen kunnen met het oog op een goede en democratische bestuursvoering gegevens
      worden verstrekt in niet tot personen herleidbare vorm. Indien degene die deze opvattingen heeft geuit of zich
      erachter heeft gesteld, daarmee heeft ingestemd, kunnen de gegevens in tot personen herleidbare vorm worden
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel85
  - number: '85.3'
    text: |-
      Met betrekking tot adviezen van een ambtelijke of gemengd samengestelde adviescommissie kan het verstrekken van
      gegevens over de daarin opgenomen persoonlijke beleidsopvattingen plaatsvinden, indien het voornemen daartoe
      door het bestuursorgaan dat het rechtstreeks aangaat aan de leden van de adviescommissie voor de aanvang van hun
      werkzaamheden kenbaar is gemaakt.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel85
  - number: '86.1'
    text: |-
      De Algemene Inlichtingen- en Veiligheidsdienst en de Militaire Inlichtingen- en Veiligheidsdienst werken zoveel
      mogelijk samen.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel86
  - number: '86.2'
    text: 'De diensten zijn in het kader van de samenwerking, bedoeld in het eerste lid, in ieder geval bevoegd tot:'
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel86
  - number: 86.2.a
    text: de verstrekking van gegevens;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel86
  - number: 86.2.b
    text: het verlenen van technische en andere vormen van ondersteuning.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel86
  - number: '86.3'
    text: |-
      Een verzoek om het verlenen van technische en andere vormen van ondersteuning voor zover deze betrekking heeft op
      de toepassing van bijzondere bevoegdheden als bedoeld in de [paragrafen 3.2.5][ref1], [4.2][ref2] of [4.3][ref3]
      wordt gedaan door Onze betrokken Minister of namens deze het hoofd van de dienst en omvat een nauwkeurige
      omschrijving van de verlangde werkzaamheden. Onze betrokken Minister die om de ondersteuning heeft verzocht, is
      verantwoordelijk voor de feitelijke uitvoering van de te verrichten werkzaamheden. De verzochte ondersteuning wordt
      slechts verleend, indien daarvoor toestemming is verkregen van Onze betrokken Minister of namens deze het hoofd van
      de dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0039896#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0039896
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0039896
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0039896
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '86.4'
    text: |-
      In het kader van de samenwerking als bedoeld in het eerste lid zijn de diensten voorts bevoegd gezamenlijke
      werkverbanden te vormen. Onze betrokken Ministers gezamenlijk kunnen met betrekking tot een gezamenlijk werkverband
      bij ministeriële regeling nadere regels stellen. Voor zover de ministeriële regeling betrekking heeft op de
      ondersteuning bij toepassing van bijzondere bevoegdheden als bedoeld in de [paragrafen 3.2.5][ref1], [4.2][ref2] of
      [4.3][ref3], blijft het derde lid, eerste volzin ter zake buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0039896#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0039896
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0039896
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0039896
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '86.5'
    text: |-
      In afwijking van het derde lid kan het verzoek om ondersteuning als bedoeld in het tweede lid, aanhef en onder
      b, worden gedaan door of namens het hoofd van de betrokken dienst, mits het verzoek om medewerking uitsluitend
      betrekking heeft op het ter beschikking stellen van technische apparatuur.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel86
  - number: '87.1'
    text: |-
      In het kader van de samenwerking als bedoeld in [artikel 86, eerste lid][ref1], draagt een dienst er zorg voor dat
      hij de andere dienst tijdig informeert over voorgenomen operationele activiteiten in Nederland en in andere landen,
      die naar verwachting van invloed kunnen zijn op een goede taakuitvoering van die andere dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel86
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '86'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '87.2'
    text: |-
      Indien de eigen goede taakuitvoering van een dienst zich verzet tegen het verstrekken van informatie als bedoeld in
      het eerste lid, treden de hoofden van de diensten met elkaar in overleg.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel87
  - number: '88.1'
    text: |-
      De diensten zijn bevoegd tot het aangaan van samenwerkingsrelaties met daarvoor in aanmerking komende inlichtingen-
      en veiligheidsdiensten van andere landen.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel88
  - number: '88.2'
    text: |-
      Voorafgaand aan het aangaan van een samenwerkingsrelatie als bedoeld in het eerste lid weegt de dienst aan de hand
      van de criteria als bedoeld in het derde lid of kan worden overgegaan tot het aangaan van een samenwerkingsrelatie
      en, zo ja, wat de aard en intensiteit van de beoogde samenwerking kan zijn.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel88
  - number: '88.3'
    text: 'Bij de weging als bedoeld in het tweede lid worden in ieder geval de volgende criteria betrokken:'
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel88
  - number: 88.3.a
    text: de democratische inbedding van de dienst in het desbetreffende land;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel88
  - number: 88.3.b
    text: de eerbiediging van de mensenrechten door het desbetreffende land;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel88
  - number: 88.3.c
    text: de professionaliteit en betrouwbaarheid van de desbetreffende dienst;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel88
  - number: 88.3.d
    text: de wettelijke bevoegdheden en mogelijkheden van de dienst in het desbetreffende land;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel88
  - number: 88.3.e
    text: het door de desbetreffende dienst geboden niveau van gegevensbescherming.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel88
  - number: '88.4'
    text: |-
      Een samenwerkingsrelatie met een inlichtingen- en veiligheidsdienst van een ander land wordt pas aangegaan, indien
      daartoe door Onze betrokken Minister toestemming is verleend. Onze betrokken Minister kan de bevoegdheid tot het
      verlenen van toestemming mandateren aan het hoofd van de dienst. Van een verleende toestemming door het hoofd van
      de dienst wordt Onze betrokken Minister zo spoedig mogelijk geïnformeerd.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel88
  - number: '88.5'
    text: |-
      Het hoofd van de dienst draagt er zorg voor dat indien omstandigheden daartoe aanleiding geven de aard en
      intensiteit van de samenwerkingsrelatie met een inlichtingen- en veiligheidsdienst van een ander land opnieuw wordt
      gewogen. Het tweede tot en met vierde lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel88
  - number: '89.1'
    text: |-
      In het kader van een samenwerkingsrelatie als bedoeld in [artikel 88][ref1] zijn de diensten bevoegd aan de
      desbetreffende dienst van een ander land gegevens te verstrekken ten behoeve van door deze instanties te behartigen
      belangen, voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel88
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '88'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 89.1.a
    text: deze belangen niet onverenigbaar zijn met de belangen die de diensten hebben te behartigen, en
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel89
  - number: 89.1.b
    text: een goede taakuitvoering door de diensten zich niet tegen verstrekking verzet.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel89
  - number: '89.2'
    text: |-
      Voor zover de verstrekking van gegevens als bedoeld in het eerste lid betrekking heeft op ongeëvalueerde gegevens,
      vindt de verstrekking niet eerder plaats dan nadat Onze betrokken Minister daarvoor toestemming heeft verleend. De
      toestemming voor meerdere opeenvolgende verstrekkingen van vergelijkbare aard wordt verleend voor een periode van
      ten hoogste twaalf maanden en kan telkens op een daartoe strekkend verzoek worden verleend voor eenzelfde periode.
      Van een toestemming tot verstrekking wordt de commissie van toezicht terstond op de hoogte gesteld.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel89
  - number: '89.3'
    text: |-
      Op de verstrekking van gegevens als bedoeld in het eerste lid zijn de [artikelen 65][ref1], [69][ref2] en
      [70][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel69
      [ref3]: https://wetten.overheid.nl/BWBR0039896#Artikel70
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '65'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '69'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref3
        bwb_id: BWBR0039896
        artikel: '70'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '89.4'
    text: |-
      In het kader van een samenwerkingsrelatie als bedoeld in [artikel 88][ref1] zijn de diensten voorts bevoegd op een
      daartoe schriftelijk verzoek aan de desbetreffende dienst technische en andere vormen van ondersteuning te verlenen
      ten behoeve van door deze instanties te behartigen belangen, voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel88
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '88'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 89.4.a
    text: deze belangen niet onverenigbaar zijn met de belangen die de diensten hebben te behartigen, en
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel89
  - number: 89.4.b
    text: |-
      een goede taakuitvoering door de diensten zich niet tegen de verlening van de desbetreffende vorm van ondersteuning
      verzet.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel89
  - number: '89.5'
    text: |-
      Een verzoek om ondersteuning als bedoeld in het vierde lid dient ondertekend te zijn door de daartoe bevoegde
      autoriteit van deze dienst en omvat een nauwkeurige omschrijving van de verlangde vorm van ondersteuning alsmede
      de reden waarom de ondersteuning wenselijk wordt geacht. De verzochte ondersteuning wordt slechts verleend, indien
      daarvoor toestemming is verkregen van Onze betrokken Minister.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel89
  - number: '89.6'
    text: |-
      Onze betrokken Minister kan, voor zover de ondersteuning geen betrekking heeft op de uitoefening van een bijzondere
      bevoegdheid als bedoeld in [paragraaf 3.2.5][ref1], [4.2][ref2] of [4.3][ref3], de bevoegdheid tot het verlenen van
      toestemming als bedoeld in het vijfde lid mandateren aan het hoofd van de dienst met dien verstande dat ingeval het
      een dienst van een ander land betreft ter zake waarvan uit de weging als bedoeld in [artikel 88][ref4] is gebleken
      dat daaraan risico’s zijn verbonden, de toestemming wordt verleend door Onze betrokken Minister. Van een verleende
      toestemming door het hoofd van de dienst wordt Onze betrokken Minister zo spoedig mogelijk geïnformeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0039896#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0039896#Artikel88
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0039896
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0039896
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0039896
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref4
        bwb_id: BWBR0039896
        artikel: '88'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '90.1'
    text: |-
      De diensten zijn in het kader van een goede taakuitvoering bevoegd tot het doen van een verzoek om technische
      en ander vormen van ondersteuning aan inlichtingen- en veiligheidsdiensten van andere landen, indien daarvoor
      overeenkomstig het bepaalde in dit artikel toestemming is verleend.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel90
  - number: '90.2'
    text: |-
      Indien het verzoek, bedoeld in het eerste lid, strekt ter ondersteuning bij de uitoefening van een bijzondere
      bevoegdheid, waarvoor toestemming is verleend, wordt de toestemming voor het verzoek om ondersteuning verleend door
      degene die ingevolge het bij of krachtens deze wet bepaalde, bevoegd is tot het verlenen van toestemming voor de
      uitoefening van de desbetreffende bijzondere bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel90
  - number: '90.3'
    text: |-
      Indien het verzoek om ondersteuning als bedoeld in het eerste lid het verrichten van een handeling betreft
      die overeenkomt met de uitoefening van een bijzondere bevoegdheid als bedoeld in de [paragrafen 3.2.5][ref1],
      [4.2][ref2] en [4.3][ref3], is hetgeen bij of krachtens deze paragrafen ter zake is bepaald, van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0039896#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0039896
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0039896
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0039896
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '90.4'
    text: |-
      In afwijking van het bepaalde in het tweede en derde lid, wordt, ingeval de verlangde ondersteuning niet in
      overeenstemming is met de aard en intensiteit van de samenwerkingsrelatie met de desbetreffende inlichtingen-
      en veiligheidsdienst van een ander land, zoals vastgesteld naar aanleiding van de weging als bedoeld in
      [artikel 88][ref1], de toestemming voor het verzoek om ondersteuning verleend door Onze betrokken Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel88
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '88'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '90.5'
    text: |-
      Een verzoek om ondersteuning als bedoeld in het eerste lid kan geen betrekking hebben op het verrichten van
      handelingen die niet overeenkomen met de uitoefening van een bevoegdheid als bedoeld in deze wet.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel90
  - number: '90.6'
    text: Van een verzoek om ondersteuning alsmede van de verleende toestemming daarvoor wordt aantekening gehouden.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel90
  - number: '91.1'
    text: |-
      De korpschef, de politiechef van een landelijke eenheid, de politiechef van een regionale eenheid, de commandant
      van de Koninklijke marechaussee, de directeur-generaal van de rijksbelastingdienst van het Ministerie van
      Financiën, de Hoofddirecteur van de Immigratie- en Naturalisatiedienst van het Ministerie van Veiligheid en
      Justitie en de inspecteur-generaal van de Inspectie SZW van het Ministerie van Sociale Zaken en Werkgelegenheid
      verrichten werkzaamheden ten behoeve van de Algemene Inlichtingen- en Veiligheidsdienst.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel91
  - number: '91.2'
    text: |-
      Onze Ministers onder wie de in het eerste lid genoemde ambtenaren ressorteren, onderscheidenlijk de korpschef en de
      korpsbeheerder van het politiekorps van Bonaire, Sint Eustatius en Saba wijzen in overeenstemming met Onze Minister
      van Binnenlandse Zaken en Koninkrijksrelaties ondergeschikten van deze ambtenaren aan tot de feitelijke uitvoering
      van en het toezicht op de aldaar bedoelde werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel91
  - number: '91.3'
    text: |-
      De in dit artikel bedoelde werkzaamheden worden verricht onder verantwoordelijkheid van Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties en overeenkomstig de aanwijzingen van het hoofd van de Algemene
      Inlichtingen- en Veiligheidsdienst.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel91
  - number: '91.4'
    text: |-
      Met betrekking tot het optreden van ambtenaren van politie en van ambtenaren van de Koninklijke marechaussee ter
      uitvoering van de in dit artikel bedoelde werkzaamheden blijft [hoofdstuk 7 van de Politiewet 2012][ref1] buiten
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0031788
        hoofdstuk: '7'
  - number: '92.1'
    text: |-
      De commandant van de Koninklijke marechaussee verricht werkzaamheden ten behoeve van de Militaire Inlichtingen-
      en Veiligheidsdienst.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel92
  - number: '92.2'
    text: |-
      Onze Minister van Defensie wijst ondergeschikten van de in het eerste lid bedoelde ambtenaar aan tot de feitelijke
      uitvoering van en het toezicht op de aldaar bedoelde werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel92
  - number: '92.3'
    text: |-
      De in het eerste lid bedoelde werkzaamheden worden verricht onder verantwoordelijkheid van Onze Minister van
      Defensie en overeenkomstig de aanwijzingen van het hoofd van de Militaire Inlichtingen- en Veiligheidsdienst.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel92
  - number: '92.4'
    text: |-
      Met betrekking tot het optreden van ambtenaren van de Koninklijke marechaussee ter uitvoering van de in dit artikel
      bedoelde werkzaamheden blijft [hoofdstuk 7 van de Politiewet 2012][ref1] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0031788
        hoofdstuk: '7'
  - number: '93.1'
    text: |-
      De leden van het openbaar ministerie doen, door tussenkomst van het College van procureurs-generaal dan wel, voor
      zover van toepassing, de procureur-generaal, bedoeld in de rijkswet openbare ministeries van Curaçao, van Sint
      Maarten en van Bonaire, Sint Eustatius en Saba, desgevraagd dan wel uit eigen beweging onverwijld mededeling van
      gegevens die voor een dienst van belang kunnen zijn aan die dienst.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel93
  - number: '93.2'
    text: |-
      Steeds wanneer de vervulling van de taak van het openbaar ministerie en van een dienst daartoe aanleiding geeft,
      plegen een lid van het College van procureurs-generaal dan wel, voor zover van toepassing, de procureur-generaal,
      bedoeld in de rijkswet openbare ministeries van Curaçao, van Sint Maarten en van Bonaire, Sint Eustatius en Saba en
      het hoofd van de betrokken dienst overleg.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel93
  - number: '94.1'
    text: |-
      De ambtenaren van politie, de ambtenaren van de Koninklijke marechaussee en de ambtenaren van de
      rijksbelastingdienst doen desgevraagd dan wel uit eigen beweging onverwijld mededeling van gegevens die voor
      een dienst van belang kunnen zijn aan de in [artikel 91, eerste lid][ref1], bedoelde ambtenaar aan wie zij
      ondergeschikt zijn. In afwijking van de eerste zin vindt de mededeling van ambtenaren van politie die zijn
      tewerkgesteld bij een regionale eenheid plaats aan de politiechef van de desbetreffende regionale eenheid. De in
      artikel 91, eerste lid, bedoelde ambtenaar waaraan de mededeling is gedaan, zendt de gegevens onverwijld aan die
      dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel91
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '91'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: '94.2'
    text: |-
      In afwijking van het bepaalde in het eerste lid kan de verstrekking van de gegevens tevens plaatsvinden op
      rechtstreeks geautomatiseerde wijze. Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld
      met betrekking tot de te treffen technische en organisatorische maatregelen.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel94
  - number: '95.1'
    text: |-
      De diensten zijn bevoegd op schriftelijk verzoek van het daartoe bevoegde gezag tot het verlenen van technische
      en andere vormen van ondersteuning aan de met opsporing van strafbare feiten belaste instanties. Een verzoek
      om ondersteuning wordt ingediend door tussenkomst van het daartoe aangewezen lid van het openbaar ministerie en
      omvat een nauwkeurige omschrijving van de verlangde werkzaamheden. Het bevoegde gezag dat om de ondersteuning
      heeft verzocht, is verantwoordelijk voor de feitelijke uitvoering van de te verrichten werkzaamheden. De verzochte
      ondersteuning wordt slechts verleend, indien daarvoor toestemming is verkregen van Onze betrokken Minister of
      namens deze het hoofd van de dienst.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel95
  - number: '95.2'
    text: |-
      Onze betrokken Minister is bevoegd zich te wenden tot Onze Minister van Veiligheid en Justitie met het
      schriftelijke verzoek tot het verlenen van technische en andere vormen van ondersteuning aan de betrokken dienst
      bij de uitvoering van diens taak door een of meer landelijke eenheden van de politie. Het verzoek omvat een
      nauwkeurige omschrijving van de verlangde werkzaamheden. Onze betrokken Minister die om de ondersteuning heeft
      verzocht, is verantwoordelijk voor de feitelijke uitvoering van de te verrichten werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel95
  - number: '95.3'
    text: |-
      Onze betrokken Minister is bevoegd zich te wenden tot Onze Minister van Defensie met het schriftelijke verzoek
      tot het verlenen van technische en andere vormen van ondersteuning aan de betrokken dienst bij de uitvoering
      van diens taak door de Koninklijke marechaussee. Het verzoek omvat een nauwkeurige omschrijving van de verlangde
      werkzaamheden. Onze betrokken Minister die om de ondersteuning heeft verzocht, is verantwoordelijk voor de
      feitelijke uitvoering van de te verrichten werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel95
  - number: '95.4'
    text: |-
      In afwijking van het bepaalde in het tweede en derde lid kan in daarbij door Onze betrokken Minister bepaalde
      gevallen en onder daarbij te stellen voorwaarden het schriftelijk verzoek namens Onze betrokken Minister worden
      gedaan door of namens het hoofd van de betrokken dienst. In spoedeisende gevallen kan het verzoek, bedoeld in
      de eerste volzin, mondeling geschieden en wordt deze zo spoedig mogelijk schriftelijk bevestigd. Onze betrokken
      Minister wordt omtrent verzoeken als bedoeld in dit lid zo spoedig mogelijk geïnformeerd.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel95
  - number: '96.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot door de
      diensten in het kader van hun goede taakuitvoering aangegane samenwerkingsverbanden met andere instanties.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel96
  - number: '96.2'
    text: 'De in het eerste lid bedoelde regels betreffen in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel96
  - number: 96.2.a
    text: een omschrijving van het doel van het samenwerkingsverband;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel96
  - number: 96.2.b
    text: een aanduiding van de deelnemende instanties;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel96
  - number: 96.2.c
    text: de taak en werkwijze van het samenwerkingsverband;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel96
  - number: 96.2.d
    text: de wijze waarop de afstemming tussen de diensten en de deelnemende instanties plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel96
  - number: 96.2.e
    text: de wijze waarop omtrent het functioneren van het samenwerkingsverband verantwoording wordt afgelegd.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel96
  - number: '97.1'
    text: Er is een commissie van toezicht op de inlichtingen- en veiligheidsdiensten.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel97
  - number: '97.2'
    text: 'De commissie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel97
  - number: 97.2.a
    text: een afdeling toezicht, en
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel97
  - number: 97.2.b
    text: een afdeling klachtbehandeling.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel97
  - number: '97.3'
    text: 'De afdeling toezicht is belast met:'
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel97
  - number: 97.3.a
    text: |-
      het toezicht op de rechtmatigheid van de uitvoering van hetgeen bij of krachtens deze wet en de
      [Wet veiligheidsonderzoeken][ref1] is gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0008277
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0008277
  - number: 97.3.b
    text: |-
      het gevraagd en ongevraagd inlichten en adviseren van Onze betrokken Ministers aangaande de door de commissie
      geconstateerde bevindingen. Desgewenst kan de commissie onze betrokken Ministers vragen deze inlichtingen en
      adviezen ter kennis van een of beide kamers der Staten-Generaal te brengen, waarbij de werkwijze zoals beschreven
      in [artikel 113][ref1] van overeenkomstige toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel113
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '113'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 97.3.c
    text: |-
      het ongevraagd adviseren van Onze betrokken Ministers ter zake van de uitvoering van [artikel 59][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel59
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '59'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 97.3.d
    text: |-
      het toezicht op de toepassing van de bevoegdheid van
      [artikel 14, vierde lid, van de Rijkswet op het Nederlanderschap][ref1] door Onze Minister van Veiligheid en
      Justitie, waarbij in het bijzonder aandacht wordt geschonken aan de doelmatigheid en proportionaliteit van de
      toepassing van deze bevoegdheid.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel14
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '14'
  - number: '97.4'
    text: 'De afdeling klachtbehandeling is belast met:'
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel97
  - number: 97.4.a
    text: het onderzoeken en beoordelen van klachten;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel97
  - number: 97.4.b
    text: het onderzoeken en beoordelen van een melding van een vermoeden van een misstand.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel97
  - number: '98.1'
    text: |-
      De commissie van toezicht bestaat uit vier leden, onder wie de voorzitter. De leden worden benoemd bij koninklijk
      besluit op voordracht van Onze betrokken Ministers gezamenlijk voor een tijdvak van zes jaar en kunnen eenmaal
      worden herbenoemd. Drie leden, onder wie de voorzitter, worden benoemd in de afdeling toezicht. De voorzitter van
      de commissie van toezicht is tevens voorzitter van de afdeling toezicht. Een lid wordt benoemd als lid, tevens
      voorzitter van de afdeling klachtbehandeling.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel98
  - number: '98.2'
    text: |-
      De afdeling klachtbehandeling bestaat, naast de voorzitter, uit ten minste twee andere leden. Zij worden benoemd
      bij koninklijk besluit op voordracht van Onze betrokken Ministers gezamenlijk voor een tijdvak van zes jaar en
      kunnen eenmaal worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel98
  - number: '99.1'
    text: |-
      Voor de benoeming van de leden van de commissie van toezicht en de leden van de afdeling klachtbehandeling wordt
      door de Tweede Kamer der Staten-Generaal per vacature een voordracht van ten minste drie personen gedaan waaruit
      Onze betrokken Ministers een keuze maken. Bij haar voordracht slaat de Tweede Kamer zodanig acht als haar dienstig
      voorkomt op een door de vice-president van de Raad van State, de president van de Hoge Raad der Nederlanden en de
      Nationale ombudsman gezamenlijk opgemaakte aanbevelingslijst van ten minste drie kandidaten per vacature.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel99
  - number: '99.2'
    text: Onze betrokken Ministers kunnen de Tweede Kamer verzoeken een nieuwe voordracht te doen.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel99
  - number: '99.3'
    text: |-
      Aan ten minste twee van de drie leden van de afdeling toezicht, onder wie de voorzitter, en aan de leden
      van de afdeling klachtbehandeling dient door een universiteit dan wel de Open Universiteit waarop de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] betrekking heeft, de graad Bachelor op het gebied
      van het recht en tevens de graad Master op het gebied van het recht te zijn verleend, dan wel dienen zij aan
      een universiteit dan wel de Open Universiteit waarop de Wet op het hoger onderwijs en wetenschappelijk onderzoek
      betrekking heeft, het doctoraat in de rechtsgeleerdheid of het recht om de titel meester te voeren te hebben
      verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: '99.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen graden, verleend door een universiteit, de Open Universiteit of
      een hogeschool als bedoeld in de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], of daaraan
      gelijkwaardige getuigschriften worden aangewezen die voor de toepasselijkheid van het derde lid gelijk worden
      gesteld aan de in dat onderdeel bedoelde graad Bachelor op het gebied van het recht.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: '99.5'
    text: |-
      Alvorens hun ambt te aanvaarden leggen de leden van de commissie van toezicht en de leden van de afdeling
      klachtbehandeling in handen van de Minister-President, Minister van Algemene Zaken, af:
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel99
  - number: 99.5.a
    text: |-
      de eed of verklaring en belofte dat zij tot het verkrijgen van hun benoeming rechtstreeks noch middellijk, onder
      welke naam of onder welk voorwendsel ook, aan iemand iets hebben gegeven of beloofd, alsmede dat zij om iets in hun
      ambt te doen of te laten rechtstreeks noch middellijk van iemand enig geschenk of enige belofte hebben aangenomen
      of zullen aannemen;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel99
  - number: 99.5.b
    text: |-
      de eed of belofte van trouw aan de [Grondwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '99.6'
    text: |-
      De leden van de commissie van toezicht en de leden van de afdeling klachtbehandeling bezitten de Nederlandse
      nationaliteit.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel99
  - number: '99.7'
    text: |-
      De leden van de commissie van toezicht en de leden van de afdeling klachtbehandeling kunnen niet tevens lid zijn
      van de toetsingscommissie.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel99
  - number: '99.8'
    text: |-
      De leden van de commissie van toezicht en de leden van de afdeling klachtbehandeling vervullen geen betrekkingen
      waarvan de uitoefening ongewenst is met het oog op een goede vervulling van hun functie of op de handhaving van hun
      onpartijdigheid en onafhankelijkheid of van het vertrouwen daarin.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel99
  - number: '99.9'
    text: |-
      De betrekkingen van de leden van de commissie van toezicht en de leden van de afdeling klachtbehandeling worden
      door de voorzitter openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel99
  - number: '100'
    text: |-
      Aan de leden van de commissie van toezicht en de leden van de afdeling klachtbehandeling wordt bij koninklijk
      besluit, op voordracht van Onze betrokken Ministers gezamenlijk, ontslag verleend:
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel100
  - number: 100.a
    text: op verzoek van de betrokkene;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel100
  - number: 100.b
    text: wanneer de betrokkene uit hoofde van ziekten of gebreken blijvend ongeschikt is zijn functie te vervullen;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel100
  - number: 100.c
    text: |-
      bij de aanvaarding van een betrekking als bedoeld in [artikel 99, achtste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel99
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '99'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 100.d
    text: bij het verlies van Nederlanderschap;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel100
  - number: 100.e
    text: |-
      wanneer betrokkene bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem
      bij zulk een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel100
  - number: 100.f
    text: |-
      wanneer betrokkene ingevolge onherroepelijk geworden rechterlijke uitspraak onder curatele is gesteld, in staat van
      faillissement is verklaard, surseance van betaling heeft verkregen of wegens schulden is gegijzeld;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel100
  - number: 100.g
    text: |-
      wanneer naar het oordeel van Onze betrokken Ministers gezamenlijk, gehoord de Tweede Kamer der Staten-Generaal,
      betrokkene door handelen of nalaten ernstig nadeel toebrengt aan het in hem te stellen vertrouwen;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel100
  - number: 100.h
    text: |-
      met ingang van de eerste dag van de maand, volgend op die, waarin betrokkene de leeftijd van zeventig jaar heeft
      bereikt.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel100
  - number: '101.1'
    text: |-
      Door Onze betrokken Ministers gezamenlijk wordt een lid van de commissie van toezicht en een lid van de afdeling
      klachtbehandeling op non-actief gesteld, ingeval:
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel101
  - number: 101.1.a
    text: hij zich in voorlopige hechtenis bevindt;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel101
  - number: 101.1.b
    text: |-
      hij bij een nog niet onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem bij
      zulk een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel101
  - number: 101.1.c
    text: |-
      hij onder curatele is gesteld, in staat van faillissement is verklaard, surseance van betaling heeft verkregen of
      wegens schulden is gegijzeld ingevolge een nog niet onherroepelijk geworden rechterlijke uitspraak.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel101
  - number: '101.2'
    text: |-
      Door Onze betrokken Ministers gezamenlijk kan een lid van de commissie van toezicht en een lid van de afdeling
      klachtbehandeling op non-actief worden gesteld, indien hij wordt vervolgd wegens een misdrijf of indien er een
      ander ernstig vermoeden is voor het bestaan van feiten of omstandigheden die tot ontslag, anders dan op gronden
      vermeld in [artikel 100, onder b en h][ref1], zouden kunnen leiden.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel100
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '100'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '101.3'
    text: |-
      In het geval, bedoeld in het tweede lid, eindigt de non-activiteit na drie maanden. Door Onze betrokken Ministers
      gezamenlijk kan de non-activiteit telkens met ten hoogste drie maanden worden verlengd. De non-activiteit wordt
      door Onze betrokken Ministers gezamenlijk beëindigd zodra de grond voor non-activiteit is vervallen.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel101
  - number: '102'
    text: |-
      Bij algemene maatregel van bestuur worden de bezoldiging, de aanspraken in geval van ziekte, alsmede de overige
      rechten en plichten die betrekking hebben op de rechtspositie van de leden van de commissie van toezicht en de
      leden van de afdeling klachtbehandeling geregeld, voor zover daarin niet bij de wet is voorzien.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel102
  - number: '103.1'
    text: De commissie van toezicht alsmede haar afdelingen worden ondersteund door een secretariaat.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel103
  - number: '103.2'
    text: |-
      Op voordracht van Onze betrokken Ministers gezamenlijk, op aanbeveling van de voorzitter van de commissie wordt
      bij koninklijk besluit besloten tot het aangaan van een arbeidsovereenkomst met de tot het secretariaat behorende
      personen. Tot beëindiging van de arbeidsovereenkomst wordt bij koninklijk besluit op voordracht van Onze betrokken
      Ministers gezamenlijk, op aanbeveling van de voorzitter van de commissie besloten, tenzij de voorzitter van de
      commissie de arbeidsovereenkomst opzegt op grond van [artikel 677 van Boek 7 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel677
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '677'
  - number: '103.3'
    text: |-
      Bij koninklijk besluit op voordracht van Onze betrokken Ministers gezamenlijk, kan worden bepaald in welke gevallen
      het tweede lid niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel103
  - number: '103.4'
    text: |-
      Ten aanzien van het tot het secretariaat behorende personen gelden de voor alle ambtenaren geldende
      arbeidsvoorwaarden die zijn opgenomen in de laatstelijk afgesloten collectieve arbeidsovereenkomst voor ambtenaren
      die krachtens een arbeidsovereenkomst met de Staat werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel103
  - number: '103.5'
    text: |-
      Op verzoek van de commissie kunnen in de collectieve arbeidsovereenkomst, bedoeld in het vierde lid, andere
      arbeidsvoorwaarden voor de tot het secretariaat behorende personen worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel103
  - number: '104'
    text: |-
      Op de leden van de commissie van toezicht, de leden van de afdeling klachtbehandeling alsmede de tot het
      secretariaat behorende personen is [artikel 14, eerste en tweede lid][ref1], van overeenkomstige toepassing, met
      dien verstande dat de ontheffing, bedoeld in het tweede lid, wordt verleend door Onze Minister-President, Minister
      van Algemene Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel14
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '105'
    text: |-
      De voorzitters van de afdelingen van de commissie van toezicht regelen de werkzaamheden van de afdelingen. De
      regelingen worden in de Staatscourant bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel105
  - number: '106'
    text: De vergaderingen van de commissie van toezicht en haar afdelingen zijn niet openbaar.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel106
  - number: '107.1'
    text: |-
      Onze betrokken Ministers, de hoofden van de diensten, de coördinator en voorts een ieder die betrokken is of
      is geweest bij de uitvoering van deze wet en de [Wet veiligheidsonderzoeken][ref1] verstrekken desgevraagd aan
      de afdelingen van de commissie van toezicht alle inlichtingen en verlenen haar alle overige medewerking die
      zij voor een goede uitoefening van haar taak noodzakelijk acht. De afdelingen van de commissie van toezicht
      wordt desgevraagd rechtstreekse toegang verleend tot de in het kader van de uitvoering van deze wet en de Wet
      veiligheidsonderzoeken verwerkte gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0008277
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0008277
  - number: '107.2'
    text: |-
      In het geval dat een afdeling van de commissie van toezicht medewerking of inlichtingen verlangt van een persoon
      die betrokken is geweest bij de uitvoering van deze wet en de [Wet veiligheidsonderzoeken][ref1], stelt zij
      voorafgaand daaraan Onze betrokken Minister hiervan onverwijld in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0008277
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0008277
  - number: '107.3'
    text: |-
      Bij de verstrekking van inlichtingen als bedoeld in het eerste lid wordt, indien daartoe aanleiding bestaat,
      aangegeven welke inlichtingen in het belang van de nationale veiligheid ter uitsluitende kennisneming van de
      afdelingen van de commissie van toezicht dienen te blijven.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel107
  - number: '108.1'
    text: |-
      Een afdeling van de commissie van toezicht kan, indien zij dat voor een goede uitoefening van haar taak
      noodzakelijk acht, de personen, bedoeld in [artikel 107, eerste lid][ref1], en andere personen als getuige of als
      deskundige om inlichtingen verzoeken en deze oproepen om voor haar te verschijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel107
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '107'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: '108.2'
    text: |-
      Het verzoek geschiedt schriftelijk en vermeldt zo veel als mogelijk de feiten waaromtrent door de getuige of de
      deskundige inlichtingen dienen te worden verstrekt. Indien de getuige of de deskundige is opgeroepen om voor een
      afdeling van de commissie te verschijnen, vermeldt het verzoek tevens de plaats en het tijdstip waarop deze zal
      worden gehoord en de gevolgen die zijn verbonden aan het niet verschijnen. De oproeping om te verschijnen geschiedt
      bij aangetekende brief of bij brief met ontvangstbevestiging.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel108
  - number: '108.3'
    text: |-
      De getuige of de deskundige is verplicht alle inlichtingen te verschaffen die de afdelingen van de commissie van
      toezicht voor een goede taakuitoefening noodzakelijk acht en daartoe, indien de desbetreffende afdeling van de
      commissie van toezicht dat in haar verzoek heeft aangegeven, in persoon te verschijnen. De opgeroepene kan zich
      laten bijstaan door een raadsman.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel108
  - number: '108.4'
    text: |-
      De verplichting om voor een afdeling van de commissie te verschijnen geldt niet voor Onze betrokken Ministers.
      Wanneer een minister niet verschijnt, laat hij zich vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel108
  - number: '108.5'
    text: |-
      Indien een ambtenaar die betrokken is bij de uitvoering van deze wet ingevolge dit artikel als getuige of als
      deskundige optreedt is [artikel 136, tweede lid][ref1], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel136
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '136'
        hoofdstuk: '8'
  - number: '108.6'
    text: |-
      Een afdeling van de commissie van toezicht kan bevelen dat personen die, hoewel wettelijk opgeroepen, niet zijn
      verschenen, door de openbare macht voor haar worden gebracht om aan hun verplichtingen te voldoen.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel108
  - number: '108.7'
    text: |-
      De getuige of de deskundige kan zich van het verstrekken van inlichtingen verschonen wegens ambts- of
      beroepsgeheim, doch alleen voor zover het inlichtingen betreft waarvan de wetenschap aan hem als zodanig is
      toevertrouwd.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel108
  - number: '109.1'
    text: |-
      Een afdeling van de commissie van toezicht kan bevelen, dat getuigen niet zullen worden gehoord dan na het afleggen
      van de eed of belofte. De getuige legt in dat geval in handen van de voorzitter van de desbetreffende afdeling van
      de commissie van toezicht de eed of de belofte af, dat hij zal zeggen de gehele waarheid en niets dan de waarheid.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel109
  - number: '109.2'
    text: De deskundigen zijn verplicht hun taak onpartijdig en naar beste weten te verrichten.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel109
  - number: '110.1'
    text: |-
      Een afdeling van de commissie van toezicht is bevoegd om, indien een goede taakuitvoering dat noodzakelijk maakt,
      bepaalde werkzaamheden aan deskundigen op te dragen.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel110
  - number: '110.2'
    text: |-
      De deskundige die zijn opdracht heeft aanvaard, is verplicht zijn taak onpartijdig en naar beste weten te
      verrichten.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel110
  - number: '111'
    text: |-
      Een afdeling van de commissie van toezicht dan wel een daartoe door haar aangewezen lid is bevoegd alle plaatsen
      te betreden, met uitzondering van een woning zonder toestemming van de bewoner, voor zover dat voor de vervulling
      van haar taak redelijkerwijs nodig is. De afdeling dan wel het door haar aangewezen lid kan zich daarbij doen
      vergezellen van door de voorzitter aangewezen personen van het secretariaat, bedoeld in [artikel 103][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel103
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '103'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '112.1'
    text: |-
      In het kader van haar toezichthoudende taak, bedoeld in [artikel 97, derde lid, onder a][ref1], is de afdeling
      toezicht bevoegd tot het verrichten van onderzoek naar de wijze waarop hetgeen bij of krachtens deze wet of de
      [Wet veiligheidsonderzoeken][ref2] is gesteld, is uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel97
      [ref2]: https://wetten.overheid.nl/BWBR0008277
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '97'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref2
        bwb_id: BWBR0008277
  - number: '112.2'
    text: |-
      De afdeling toezicht kan voorts een onderzoek als bedoeld in het eerste lid verrichten op een daartoe strekkend
      verzoek van elk van de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel112
  - number: '112.3'
    text: |-
      Aan Onze betrokken Minister alsmede een of beide kamers der Staten-Generaal wordt van een voorgenomen onderzoek, zo
      nodig vertrouwelijk, mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel112
  - number: '113.1'
    text: |-
      De afdeling toezicht stelt naar aanleiding van het door haar verrichte onderzoek een toezichtsrapport op. Het
      toezichtsrapport is openbaar, met uitzondering van gegevens als bedoeld in [artikel 12, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel12
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '113.2'
    text: |-
      Alvorens het toezichtsrapport vast te stellen, stelt de afdeling toezicht Onze betrokken Minister in de gelegenheid
      binnen een door de afdeling toezicht gestelde redelijke termijn op de in het toezichtsrapport opgenomen bevindingen
      te reageren.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel113
  - number: '113.3'
    text: |-
      Na ontvangst van de reactie van Onze betrokken Minister stelt de afdeling toezicht het toezichtsrapport vast. Zij
      kan naar aanleiding van haar bevindingen Onze betrokken Minister aanbevelingen doen met betrekking tot eventueel te
      treffen maatregelen.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel113
  - number: '113.4'
    text: Het toezichtsrapport wordt na vaststelling door de afdeling toezicht gezonden aan Onze betrokken Minister.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel113
  - number: '113.5'
    text: |-
      Onze betrokken Minister zendt het toezichtsrapport alsmede zijn reactie daarop binnen zes weken aan de beide
      kamers der Staten-Generaal. Vermelding van in ieder geval de gegevens, bedoeld in [artikel 12, derde lid][ref1],
      blijft daarbij achterwege. Deze gegevens kunnen ter vertrouwelijke kennisneming aan een of beide kamers der Staten-
      Generaal worden medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel12
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '114.1'
    text: |-
      Een ieder heeft het recht bij de afdeling klachtbehandeling van de commissie van toezicht een klacht
      in te dienen over het optreden of het vermeende optreden van Onze betrokken Ministers, de hoofden van
      de diensten, de coördinator, en de voor de diensten en de coördinator werkzame personen jegens een
      natuurlijke of rechtspersoon ter uitvoering van deze wet of de [Wet veiligheidsonderzoeken][ref1].
      [Titel 9.2 van de Algemene wet bestuursrecht][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008277
      [ref2]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0008277
      - id: ref2
        bwb_id: BWBR0005537
  - number: '114.2'
    text: |-
      De afdeling klachtbehandeling is verplicht een klacht als bedoeld in het eerste lid in behandeling te nemen, tenzij
      [artikel 120][ref1], [121][ref2] of [122][ref3] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel120
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel121
      [ref3]: https://wetten.overheid.nl/BWBR0039896#Artikel122
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '120'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '121'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref3
        bwb_id: BWBR0039896
        artikel: '122'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: '114.3'
    text: |-
      Alvorens een klacht in te dienen bij de afdeling klachtbehandeling van de commissie van toezicht, stelt de
      klager Onze betrokken Minister wie het aangaat in kennis van de klacht en stelt hij deze in de gelegenheid diens
      zienswijze daarop te geven, tenzij dit redelijkerwijs niet van hem kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel114
  - number: '114.4'
    text: |-
      In afwijking van het bepaalde in [artikel 9:12, tweede lid, van de Algemene wet bestuursrecht][ref1], wordt bij de
      kennisgeving vermeld dat de klager een klacht bij de afdeling klachtbehandeling van de commissie van toezicht kan
      indienen en binnen welke termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '9'
  - number: '115.1'
    text: 'Het klaagschrift wordt ondertekend en bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel115
  - number: 115.1.a
    text: de naam en het adres van de verzoeker;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel115
  - number: 115.1.b
    text: de dagtekening;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel115
  - number: 115.1.c
    text: |-
      een omschrijving van het optreden of vermeende optreden waartegen het verzoek is gericht, een aanduiding van degene
      die aldus heeft opgetreden en een aanduiding van degene jegens wie het optreden heeft plaatsgevonden, indien deze
      niet de verzoeker is;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel115
  - number: 115.1.d
    text: de gronden van de klacht;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel115
  - number: 115.1.e
    text: |-
      de wijze waarop een klacht bij Onze betrokken Minister is ingediend, en zo mogelijk de bevindingen van het
      onderzoek naar de klacht door Onze betrokken Minister, zijn oordeel daarover alsmede de eventuele conclusies die
      Onze betrokken Minister hieraan verbonden heeft.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel115
  - number: '115.2'
    text: |-
      Indien het klaagschrift in een vreemde taal is gesteld en een vertaling voor een goede behandeling van het verzoek
      noodzakelijk is, draagt de klager zorg voor een vertaling.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel115
  - number: '115.3'
    text: |-
      Indien niet is voldaan aan de in dit artikel gestelde vereisten, stelt de afdeling klachtbehandeling de klager in
      de gelegenheid het verzuim binnen een door haar daartoe gestelde termijn te herstellen.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel115
  - number: '116'
    text: |-
      Aan de behandeling van de klacht wordt niet meegewerkt door een persoon die betrokken is geweest bij het optreden
      waarop de klacht betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel116
  - number: '117.1'
    text: |-
      De afdeling klachtbehandeling stelt Onze betrokken Minister, degene op wiens optreden het verzoek betrekking heeft,
      en de klager in de gelegenheid hun standpunt toe te lichten.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel117
  - number: '117.2'
    text: |-
      De afdeling klachtbehandeling beslist of de toelichting schriftelijk of mondeling en al dan niet in elkaars
      tegenwoordigheid wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel117
  - number: '118.1'
    text: |-
      De behandeling van een klacht door de afdeling klachtbehandeling vindt plaats door de voorzitter van de afdeling en
      twee door hem aangewezen andere leden van de afdeling klachtbehandeling.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel118
  - number: '118.2'
    text: |-
      Op het verkeer met de afdeling klachtbehandeling is [hoofdstuk 2 van de Algemene wet bestuursrecht][ref1] van
      overeenkomstige toepassing, met uitzondering van [artikel 2:3, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '2'
  - number: '119.1'
    text: |-
      Indien naar het oordeel van de afdeling klachtbehandeling ten aanzien van het in de klacht bedoelde optreden
      voor de verzoeker de mogelijkheid van bezwaar, beroep of beklag openstaat, wijst de afdeling de klager zo spoedig
      mogelijk op deze mogelijkheid en draagt zij het klaagschrift, nadat daarop de datum van ontvangst is aangetekend,
      aan de bevoegde instantie over, tenzij de klager kenbaar heeft gemaakt dat het klaagschrift aan hem moet worden
      teruggezonden.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel119
  - number: '119.2'
    text: |-
      [Artikel 6:15, derde lid, van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '120'
    text: |-
      De afdeling klachtbehandeling is niet bevoegd een onderzoek in te stellen of voort te zetten indien de klacht
      betrekking heeft op:
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel120
  - number: 120.a
    text: |-
      een aangelegenheid die behoort tot het algemeen regeringsbeleid, daaronder begrepen het algemeen beleid ter
      handhaving van de rechtsorde, of tot het algemeen beleid van het betrokken bestuursorgaan;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel120
  - number: 120.b
    text: een algemeen verbindend voorschrift;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel120
  - number: 120.c
    text: |-
      een optreden waartegen beklag kan worden gedaan of beroep kan worden ingesteld, tenzij die gedraging bestaat uit
      het niet tijdig nemen van een besluit, of waartegen een beklag- of beroepsprocedure aanhangig is;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel120
  - number: 120.d
    text: een optreden ten aanzien waarvan door een bestuursrechter uitspraak is gedaan;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel120
  - number: 120.e
    text: |-
      een optreden ten aanzien waarvan een procedure bij een andere rechterlijke instantie dan een bestuursrechter
      aanhangig is, dan wel beroep openstaat tegen een uitspraak die in een zodanige procedure is gedaan;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel120
  - number: 120.f
    text: een optreden waarop de rechterlijke macht toeziet.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel120
  - number: '121'
    text: 'De afdeling klachtbehandeling is niet verplicht een onderzoek in te stellen of voort te zetten indien:'
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel121
  - number: 121.a
    text: |-
      het klaagschrift niet voldoet aan de vereisten, bedoeld in [artikel 115][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel115
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '115'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 121.b
    text: de klacht kennelijk ongegrond is;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel121
  - number: 121.c
    text: |-
      het belang van de klager bij een onderzoek door de afdeling klachtbehandeling dan wel het gewicht van het optreden
      kennelijk onvoldoende is;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel121
  - number: 121.d
    text: de klager een ander is dan degene jegens wie het optreden heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel121
  - number: 121.e
    text: |-
      de klacht betrekking heeft op een optreden waartegen bezwaar kan worden gemaakt, tenzij het optreden bestaat uit
      het niet tijdig nemen van een besluit, of waartegen een bezwaarprocedure aanhangig is;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel121
  - number: 121.f
    text: |-
      de klacht betrekking heeft op een optreden waartegen door de klager bezwaar had kunnen worden gemaakt, beroep had
      kunnen worden ingesteld of beklag had kunnen worden gedaan;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel121
  - number: 121.g
    text: |-
      de klacht betrekking heeft op een optreden ten aanzien waarvan door een andere rechterlijke instantie dan een
      bestuursrechter uitspraak is gedaan;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel121
  - number: 121.h
    text: |-
      niet is voldaan aan het vereiste van [artikel 114, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel114
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '114'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 121.i
    text: |-
      een klacht, hetzelfde optreden betreffende, bij haar in behandeling is of – behoudens indien een nieuw feit of een
      nieuwe omstandigheid bekend is geworden en zulks tot een ander oordeel over het bedoelde optreden zou hebben kunnen
      leiden – door haar is afgedaan;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel121
  - number: 121.j
    text: |-
      ten aanzien van optreden dat nauw samenhangt met het onderwerp van het klaagschrift een procedure aanhangig is bij
      een rechterlijke instantie, dan wel ingevolge bezwaar, administratief beroep of beklag bij een andere instantie;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel121
  - number: 121.k
    text: |-
      de klacht betrekking heeft op een optreden dat nauw samenhangt met een onderwerp, dat door het instellen van een
      procedure aan het oordeel van een andere rechterlijke instantie dan een bestuursrechter onderworpen is;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel121
  - number: 121.l
    text: |-
      na tussenkomst van de afdeling klachtbehandeling naar haar oordeel alsnog naar behoren aan de grieven van de klager
      tegemoet is gekomen.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel121
  - number: '122.1'
    text: |-
      Voorts is de afdeling klachtbehandeling niet verplicht een onderzoek in te stellen of voort te zetten, indien de
      klacht wordt ingediend later dan een jaar:
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel122
  - number: 122.1.a
    text: na de kennisgeving door Onze betrokken Minister van de bevindingen van het onderzoek, of
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel122
  - number: 122.1.b
    text: |-
      nadat de klachtbehandeling door Onze betrokken Minister op andere wijze is geëindigd, dan wel ingevolge enig
      wettelijk voorschrift beëindigd had moeten zijn.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel122
  - number: '122.2'
    text: |-
      In afwijking van het eerste lid eindigt de termijn een jaar nadat het optreden heeft plaatsgevonden, indien
      redelijkerwijs niet van klager kan worden gevergd dat hij eerst een klacht bij Onze betrokken Minister indient.
      Is het optreden binnen een jaar nadat het plaatsvond, aan het oordeel van een andere rechterlijke instantie dan
      een bestuursrechter onderworpen, of is daartegen bezwaar gemaakt, administratief beroep ingesteld dan wel beklag
      gedaan, dan eindigt de termijn een jaar na de datum waarop:
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel122
  - number: 122.2.a
    text: in die procedure een uitspraak is gedaan waartegen geen beroep meer openstaat, of
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel122
  - number: 122.2.b
    text: de procedure op een andere wijze is geëindigd.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel122
  - number: '123.1'
    text: |-
      Indien de afdeling klachtbehandeling op grond van [artikel 120][ref1], [121][ref2] of [122][ref3] geen onderzoek
      instelt of dit niet voortzet, deelt zij dit onder vermelding van de redenen zo spoedig mogelijk schriftelijk aan de
      klager mede.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel120
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel121
      [ref3]: https://wetten.overheid.nl/BWBR0039896#Artikel122
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '120'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '121'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref3
        bwb_id: BWBR0039896
        artikel: '122'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: '123.2'
    text: |-
      In het geval dat de afdeling klachtbehandeling een onderzoek niet voortzet, doet zij de in het eerste lid bedoelde
      mededeling tevens aan Onze betrokken Minister en, in voorkomend geval, aan degene op wiens optreden het onderzoek
      betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel123
  - number: '124.1'
    text: De afdeling klachtbehandeling beoordeelt of in de door haar onderzochte aangelegenheid behoorlijk is gehandeld.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel124
  - number: '124.2'
    text: |-
      Indien ten aanzien van het optreden waarop het onderzoek van de afdeling klachtbehandeling betrekking heeft door
      een rechterlijke instantie uitspraak is gedaan, neemt de afdeling de rechtsgronden in acht waarop die uitspraak
      steunt of mede steunt.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel124
  - number: '124.3'
    text: |-
      De afdeling klachtbehandeling deelt haar oordeel omtrent de klacht schriftelijk en, voor zover de veiligheid dan
      wel andere gewichtige belangen van de staat zich daartegen niet verzetten, met redenen omkleed aan de klager mede.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel124
  - number: '124.4'
    text: |-
      De afdeling klachtbehandeling deelt zijn oordeel omtrent de klacht schriftelijk mede aan Onze betrokken Minister.
      De afdeling klachtbehandeling kan, ingeval zij tot het oordeel is gekomen dat in de door haar onderzochte
      aangelegenheid sprake is van een onrechtmatige of niet behoorlijke gedraging, in verband daarmee tevens bepalen
      dat, indien en voor zover dat in verband staat met het desbetreffende optreden:
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel124
  - number: 124.4.a
    text: een lopend onderzoek dient te worden gestaakt;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel124
  - number: 124.4.b
    text: de uitoefening van een bevoegdheid dient te worden beëindigd;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel124
  - number: 124.4.c
    text: door de diensten verwerkte gegevens worden verwijderd en vernietigd.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel124
  - number: '124.5'
    text: |-
      Onze betrokken Minister is gehouden het oordeel van de afdeling klachtbehandeling uit te voeren. Onze betrokken
      Minister stelt de afdeling klachtbehandeling en de klager binnen twee weken na ontvangst van het oordeel
      schriftelijk op de hoogte van de wijze waarop deze aan het oordeel van de afdeling klachtbehandeling uitvoering zal
      geven en binnen welke termijn.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel124
  - number: '125'
    text: |-
      In deze paragraaf wordt verstaan onder: - *melder:* een ieder die betrokken is of is geweest bij de uitvoering van
      deze wet of de [Wet veiligheidsonderzoeken][ref1];
        - *interne procedure:* een door Onze betrokken Minister vastgestelde procedure voor het omgaan met de melding van
      een vermoeden van een misstand;
        - *vermoeden van een misstand:* het vermoeden dat binnen een dienst of bij de coördinator, waarbij
      de melder werkt of heeft gewerkt of waarmee hij in het kader van de uitvoering van deze wet of de
      [Wet veiligheidsonderzoeken][ref2] in aanraking is gekomen, sprake is van een misstand voor zover het vermoeden
      gebaseerd is op redelijke gronden, die voortvloeien uit de kennis die de melder bij de desbetreffende dienst heeft
      opgedaan of voortvloeien uit de kennis die de melder heeft gekregen in verband met diens betrokkenheid bij de
      uitvoering van deze wet of de [Wet veiligheidsonderzoeken][ref3] en het maatschappelijk belang in het geding is bij
      de schending van een wettelijk voorschrift, een gevaar voor de veiligheid van personen, of een gevaar voor het goed
      functioneren van de openbare dienst als gevolg van een onbehoorlijke wijze van handelen of nalaten.


      [ref1]: https://wetten.overheid.nl/BWBR0008277
      [ref2]: https://wetten.overheid.nl/BWBR0008277
      [ref3]: https://wetten.overheid.nl/BWBR0008277
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0008277
      - id: ref2
        bwb_id: BWBR0008277
      - id: ref3
        bwb_id: BWBR0008277
  - number: '126.1'
    text: |-
      Een melder kan bij de afdeling klachtbehandeling het vermoeden van een misstand melden, nadat hij dit vermoeden
      heeft gemeld bij de dienst waarbinnen sprake is van vermoedelijke misstand aan een leidinggevende, een
      vertrouwenspersoon of een andere in een interne klachtenregeling aangewezen persoon en deze melding niet binnen een
      redelijke termijn of niet naar behoren is behandeld.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel126
  - number: '126.2'
    text: |-
      De melder kan het vermoeden van een misstand rechtstreeks melden bij de afdeling klachtbehandeling indien van hem
      in redelijkheid niet gevraagd kan worden dat hij het vermoeden bij de in het eerste lid bedoelde dienst meldt.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel126
  - number: '126.3'
    text: 'De melding bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel126
  - number: 126.3.a
    text: naam en adres van de melder;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel126
  - number: 126.3.b
    text: de organisatie waar de betrokkene werkzaam is of is geweest;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel126
  - number: 126.3.c
    text: de organisatie waarop de melding betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel126
  - number: 126.3.d
    text: een omschrijving van de misstand die wordt gemeld;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel126
  - number: 126.3.e
    text: de reden van de melding aan de afdeling klachtbehandeling.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel126
  - number: '126.4'
    text: |-
      De melder verschaft voorts de gegevens die voor de behandeling van de melding nodig zijn waarover de melder
      redelijkerwijs de beschikking kan krijgen.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel126
  - number: '126.5'
    text: |-
      Het eerste tot en met vierde lid is van overeenkomstige toepassing indien het een vermoeden van een misstand bij de
      coördinator betreft.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel126
  - number: '127.1'
    text: |-
      De afdeling klachtbehandeling neemt de melding in behandeling, indien zij van oordeel is dat er sprake is van
      een melding van het vermoeden van een misstand. Met betrekking tot de beoordeling van een melding en de verdere
      behandeling zijn de [artikelen 116][ref1] en [118][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel116
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel118
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '116'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '118'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: '127.2'
    text: |-
      Indien de afdeling klachtbehandeling de melding in behandeling neemt, deelt zij de inhoud van de melding aan Onze
      betrokken Minister mede, waarbij zij erop toeziet dat deze niet herleidbaar is tot de identiteit van de melder.
      De identiteit van de melder kan slechts aan Onze betrokken Minister worden medegedeeld, indien de melder daarmee
      instemt.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel127
  - number: '128.1'
    text: |-
      De afdeling klachtbehandeling is niet verplicht een onderzoek naar de melding in te stellen of voort te zetten,
      indien:
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel128
  - number: 128.1.a
    text: |-
      de melding niet voldoet aan het bepaalde in [artikel 126, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel126
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '126'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 128.1.b
    text: de melding kennelijk ongegrond is;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel128
  - number: 128.1.c
    text: |-
      het maatschappelijk belang bij een onderzoek door de afdeling klachtbehandeling, dan wel de ernst van de misstand,
      kennelijk onvoldoende is;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel128
  - number: 128.1.d
    text: |-
      een melding, dezelfde misstand betreffende, bij de afdeling klachtbehandeling in behandeling is of, behoudens
      indien een nieuw feit of een nieuwe omstandigheid bekend is geworden en zulks tot een ander oordeel over de
      bedoelde misstand zou hebben kunnen leiden, door de afdeling klachtbehandeling is afgedaan;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel128
  - number: 128.1.e
    text: bij onherroepelijke rechterlijke uitspraak reeds over de misstand is geoordeeld, of
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel128
  - number: 128.1.f
    text: |-
      de melder naar het oordeel van de afdeling klachtbehandeling onvoldoende meewerkt aan een zorgvuldig verloop van
      het onderzoek en het bewaren van de vertrouwelijkheid van uitkomsten van het onderzoek.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel128
  - number: '128.2'
    text: |-
      De afdeling klachtbehandeling neemt een melding niet in onderzoek indien de melding betrekking heeft op een
      gedraging ten aanzien waarvan een procedure bij de strafrechter aanhangig is, dan wel beroep openstaat tegen een
      uitspraak die in een zodanige procedure is gedaan.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel128
  - number: '129'
    text: |-
      Indien de afdeling klachtbehandeling geen onderzoek instelt of dit niet voortzet, deelt zij dit onder vermelding
      van de redenen zo spoedig mogelijk schriftelijk aan de melder en, voor zover Onze betrokken Minister op grond van
      [artikel 127, tweede lid][ref1], van de melding op de hoogte is gesteld, Onze betrokken Minister mede.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel127
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '127'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: '130'
    text: |-
      Met betrekking tot het onderzoek van een melding is [artikel 117][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel117
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '117'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: '131.1'
    text: De afdeling klachtbehandeling onderzoekt of het aannemelijk is dat sprake is van een misstand.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel131
  - number: '131.2'
    text: De afdeling klachtbehandeling stelt naar aanleiding van het door haar verrichte onderzoek een rapport op.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel131
  - number: '131.3'
    text: |-
      De afdeling klachtbehandeling stelt, alvorens het rapport vast te stellen, Onze betrokken Minister en de melder
      in de gelegenheid binnen een door de afdeling klachtbehandeling gestelde redelijke termijn op de in het rapport
      opgenomen bevindingen alsmede het oordeel van de afdeling klachtbehandeling te reageren. Het rapport wordt daartoe
      voor de melder bij de afdeling klachtbehandeling ter inzage gelegd.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel131
  - number: '131.4'
    text: |-
      Na ontvangst van de reactie van Onze betrokken Minister en de melder stelt de afdeling klachtbehandeling het
      rapport vast.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel131
  - number: '131.5'
    text: |-
      De afdeling klachtbehandeling deelt haar oordeel omtrent de melding schriftelijk en, voor zover de veiligheid of
      andere gewichtige belangen van de staat zich niet daartegen verzetten, met redenen omkleed aan de melder mede.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel131
  - number: '131.6'
    text: |-
      De afdeling klachtbehandeling deelt haar oordeel omtrent de melding schriftelijk mede aan Onze betrokken Minister.
      De afdeling klachtbehandeling kan naar aanleiding van het door haar verrichte onderzoek aan Onze betrokken Minister
      aanbevelingen doen.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel131
  - number: '131.7'
    text: |-
      Onze betrokken Minister stelt de afdeling klachtbehandeling binnen twee weken na ontvangst van het oordeel
      schriftelijk op de hoogte van de wijze waarop deze aan het oordeel van de afdeling klachtbehandeling gevolg zal
      geven en binnen welke termijn.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel131
  - number: '131.8'
    text: |-
      Onze betrokken Minister zendt het oordeel van de afdeling klachtbehandeling alsmede diens reactie als bedoeld in
      het zevende lid zo spoedig mogelijk aan een of beide kamers der Staten-Generaal. Vermelding van in ieder geval de
      gegevens, bedoeld in [artikel 12, derde lid][ref1], blijft daarbij achterwege. De gegevens, bedoeld in de tweede
      volzin, kunnen ter vertrouwelijke kennisneming aan een of beide kamers der Staten-Generaal worden medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel12
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '131.9'
    text: |-
      Een oordeel of aanbeveling behelst geen vaststelling van civielrechtelijke aansprakelijkheid in verband met een
      misstand, noch een vermoeden van schuld aan enig strafbaar feit.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel131
  - number: '132.1'
    text: |-
      De commissie van toezicht brengt jaarlijks voor 1 mei een openbaar verslag uit van haar werkzaamheden.
      Het verslag wordt aangeboden aan beide kamers der Staten-Generaal en aan Onze betrokken Ministers.
      [Artikel 12, derde en vierde lid][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel12
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '132.2'
    text: Het openbare jaarverslag wordt algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel132
  - number: '133.1'
    text: |-
      Gegevens die door Onze betrokken Ministers, de hoofden van de diensten, de coördinator en andere bij de uitvoering
      van deze wet en de [Wet veiligheidsonderzoeken][ref1] betrokken ambtenaren ten behoeve van de taakuitoefening door
      de commissie van toezicht en haar afdelingen daaraan zijn verstrekt en aldaar berusten, zijn niet openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0008277
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0008277
  - number: '133.2'
    text: Verzoeken om kennisneming of openbaarmaking van deze gegevens worden geweigerd.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel133
  - number: '133.3'
    text: |-
      [Artikel 21][ref1] is van overeenkomstige toepassing op de archiefbescheiden die berusten bij de commissie van
      toezicht en haar afdelingen, met dien verstande dat voor Onze betrokken Minister wordt gelezen: Onze betrokken
      Minister wie het aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel21
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '134'
    text: |-
      De [artikelen 23][ref1] en [24][ref2] zijn van overeenkomstige toepassing op de commissie van toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel24
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '135.1'
    text: |-
      Onverminderd de [artikelen 98 tot en met 98c van het Wetboek van Strafrecht][ref1] dan wel de
      [artikelen 104 tot en met 104c van het Wetboek van Strafrecht BES][ref2], is een ieder die betrokken is bij de
      uitvoering van deze wet en daarbij de beschikking krijgt over gegevens waarvan hij het vertrouwelijke karakter
      kent of redelijkerwijs moet vermoeden, verplicht tot geheimhouding daarvan behoudens voor zover enig wettelijk
      voorschrift hem tot bekendmaking verplicht. Deze verplichting duurt voort, nadat het betrokken zijn bij de
      uitvoering van deze wet is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel98
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel104
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '98'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '104'
  - number: '135.2'
    text: |-
      [Artikel 272, tweede lid, van het Wetboek van Strafrecht][ref1] dan wel
      [artikel 285, tweede lid, van het Wetboek van Strafrecht BES][ref2] is niet van toepassing in geval van handelen of
      nalaten in strijd met de in het eerste lid omschreven verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel272
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel285
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '272'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '285'
  - number: '136.1'
    text: |-
      De verplichting tot geheimhouding van een ambtenaar die betrokken is bij de uitvoering van deze wet, geldt niet
      tegenover hem aan wie de ambtenaar middellijk of onmiddellijk ondergeschikt is, noch in zover hij door een boven
      hem gestelde van die verplichting is ontslagen.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel136
  - number: '136.2'
    text: |-
      De ambtenaar, bedoeld in het eerste lid, die krachtens een wettelijke bepaling verplicht wordt als getuige of
      deskundige op te treden, legt slechts een verklaring af omtrent datgene waartoe zijn verplichting tot geheimhouding
      zich uitstrekt, voor zover Onze betrokken Minister en Onze Minister van Veiligheid en Justitie gezamenlijk hem
      daartoe schriftelijk van de verplichting hebben ontheven. Daarbij wordt voor ambtenaren die in hun functie kennis
      hebben gekregen van gegevens die krachtens [artikel 62, eerste lid, onder a en b][ref1], door een dienst zijn
      verstrekt als: «Onze betrokken Minister» aangemerkt: Onze Minister onder wie de dienst ressorteert die de gegevens
      heeft verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel62
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '62'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '136.3'
    text: |-
      Dit artikel is van overeenkomstige toepassing in het geval dat het betrokken zijn bij de uitvoering van deze wet
      is geëindigd.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel136
  - number: '137.1'
    text: |-
      Indien in een bestuursrechtelijke procedure inzake de toepassing van deze wet of de
      [Wet veiligheidsonderzoeken][ref1] Onze betrokken Minister of de commissie van toezicht door de bestuursrechter
      ingevolge [artikel 8:27][ref2], [8:28][ref3] of [8:45 van de Algemene wet bestuursrecht][ref4] wordt verplicht
      tot het verstrekken van inlichtingen dan wel het overleggen van stukken en de desbetreffende inlichtingen
      worden verstrekt onderscheidenlijk de stukken worden overgelegd waarbij door Onze betrokken Minister dan
      wel de commissie van toezicht is aangegeven dat vanwege het bestaan van gewichtige redenen als bedoeld in
      [artikel 8:29, eerste lid, van de Algemene wet bestuursrecht][ref5] uitsluitend de bestuursrechter kennis zal
      mogen nemen van de desbetreffende inlichtingen onderscheidenlijk de stukken, en de bestuursrechter op grond van
      artikel 8:29, derde lid, van de Algemene wet bestuursrecht tot het oordeel komt dat ten onrechte een beroep op
      gewichtige redenen wordt gedaan, worden de stukken aan Onze betrokken Minister dan wel de commissie van toezicht
      teruggezonden. De bestuursrechter stelt daaraan voorafgaand Onze betrokken Minister dan wel de commissie van
      toezicht in de gelegenheid de desbetreffende inlichtingen onderscheidenlijk stukken alsnog zonder het voorbehoud
      dat uitsluitend de bestuursrechter er kennis van kan nemen te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0008277
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0008277
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '137.2'
    text: |-
      Indien in een bestuursrechtelijke procedure inzake de toepassing van deze wet of de
      [Wet veiligheidsonderzoeken][ref1] Onze betrokken Minister of de commissie van toezicht door het Gerecht of
      het Hof ingevolge [artikel 23][ref2], [28][ref3] en [29 van de Wet administratieve rechtspraak BES][ref4]
      wordt verplicht tot het verstrekken van inlichtingen dan wel het overleggen van stukken en de desbetreffende
      inlichtingen worden verstrekt onderscheidenlijk de stukken worden overgelegd waarbij door Onze betrokken Minister
      dan wel de commissie van toezicht is aangegeven dat vanwege het bestaan van gewichtige redenen als bedoeld in
      [artikel 24, eerste lid, van de Wet administratieve rechtspraak BES][ref5] uitsluitend het Gerecht of het Hof
      kennis zal mogen nemen van de desbetreffende inlichtingen onderscheidenlijk de stukken, en het Gerecht of het
      Hof op grond van artikel 24, derde lid, van de Wet administratieve rechtspraak BES tot het oordeel komt dat ten
      onrechte een beroep op gewichtige redenen wordt gedaan, worden de stukken aan Onze betrokken Minister dan wel de
      commissie van toezicht teruggezonden. Het Gerecht of het Hof stelt daaraan voorafgaand Onze betrokken Minister dan
      wel de commissie van toezicht in de gelegenheid de desbetreffende inlichtingen onderscheidenlijk stukken alsnog
      zonder het voorbehoud dat uitsluitend het Gerecht of het Hof er kennis van kan nemen te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0008277
      [ref2]: https://wetten.overheid.nl/BWBR0028455#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0028455#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0028455#Artikel29
      [ref5]: https://wetten.overheid.nl/BWBR0028455#Artikel24
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0008277
      - id: ref2
        bwb_id: BWBR0028455
        artikel: '23'
      - id: ref3
        bwb_id: BWBR0028455
        artikel: '28'
      - id: ref4
        bwb_id: BWBR0028455
        artikel: '29'
      - id: ref5
        bwb_id: BWBR0028455
        artikel: '24'
  - number: '137.3'
    text: |-
      Het eerste en tweede lid is van overeenkomstige toepassing ingeval Onze betrokken Minister, niet zijnde partij in
      de bestuursrechtelijke procedure, wordt verplicht tot het geven van inlichtingen dan wel het overleggen van stukken
      in verband met door de dienst gedane mededelingen als bedoeld in [artikel 62, eerste lid, onder a en b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel62
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '62'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '137.4'
    text: |-
      Indien door Onze betrokken Minister of de commissie van toezicht aan de bestuursrechter onderscheidenlijk het
      Gerecht of het Hof stukken dienen te worden overgelegd, kan worden volstaan met het ter inzage geven van de
      desbetreffende stukken. Van de desbetreffende stukken mag op generlei wijze een afschrift worden vervaardigd.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel137
  - number: '138.1'
    text: |-
      Indien de staat in een civielrechtelijke procedure door de rechter op grond van
      [artikel 22 van het Wetboek van Burgerlijke Rechtsvordering][ref1] wordt bevolen bepaalde stellingen toe te lichten
      of bepaalde op de zaak betrekking hebbende bescheiden over te leggen en deze dit met een beroep op geheimhouding
      wegens gewichtige redenen weigert worden de desbetreffende inlichtingen of bescheiden ter vertrouwelijke
      kennisneming aan de rechter verstrekt onderscheidenlijk overgelegd door deze ter inzage te geven zonder dat hiervan
      een afschrift wordt vervaardigd, teneinde de rechter in de gelegenheid te stellen te beoordelen of de weigering van
      de staat gerechtvaardigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel22
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '22'
  - number: '138.2'
    text: |-
      Indien de rechter van oordeel is dat de weigering, bedoeld in het eerste lid, gerechtvaardigd is, kan de staat
      de rechter desalniettemin toestaan de inlichtingen of de bescheiden die hem ter vertrouwelijke kennisneming zijn
      verstrekt onderscheidenlijk aan hem zijn overgelegd of ter inzage gegeven, te betrekken bij de beoordeling van de
      zaak, zonder dat enig ander dan de rechter hiervan kennis zal mogen nemen. De rechter doet in dat geval alleen mede
      op grond van die inlichtingen of bescheiden uitspraak indien de wederpartij daartoe toestemming heeft verleend. De
      rechter kan uit het niet verlenen van die toestemming de gevolgtrekking maken die hij geraden acht.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel138
  - number: '138.3'
    text: |-
      De rechter verzoekt zich te mogen verschonen overeenkomstig
      [artikel 40 van het van het Wetboek van Burgerlijke Rechtsvordering][ref1] indien:


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel40
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '40'
  - number: 138.3.a
    text: |-
      de rechter van oordeel is dat de weigering, bedoeld in het eerste lid, gerechtvaardigd is, en hij van minimaal
      één van beide partijen geen toestemming heeft gekregen de inlichtingen of de bescheiden die hem ter vertrouwelijke
      kennisneming zijn verstrekt onderscheidenlijk aan hem zijn overgelegd of ter inzage gegeven, te betrekken bij de
      beoordeling van de zaak;
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel138
  - number: 138.3.b
    text: |-
      de rechter van oordeel is dat de weigering, bedoeld in het eerste lid, niet gerechtvaardigd is, maar de staat
      desalniettemin in die weigering volhardt.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel138
  - number: '138.4'
    text: |-
      In een geval als bedoeld in het derde lid, onder a of b, worden de bescheiden die overeenkomstig het eerste lid
      ter vertrouwelijke kennisneming aan de rechter zijn overgelegd of ter inzage gegeven, onverwijld aan de staat
      teruggezonden.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel138
  - number: '139'
    text: |-
      Indien ten behoeve van de beslissing op een tegen een besluit van Onze betrokken Minister ingediend
      bezwaarschrift, een adviescommissie als bedoeld in [artikel 7:13 van de Algemene wet bestuursrecht][ref1]
      is ingesteld, komt aan die commissie niet de bevoegdheid, bedoeld in artikel 7:13, vierde lid, van de
      Algemene wet bestuursrecht toe, voor zover deze betrekking heeft op de beslissing over de toepassing van
      [artikel 7:4, zesde lid, van de Algemene wet bestuursrecht][ref2]. De uitoefening van deze bevoegdheid blijft
      voorbehouden aan Onze betrokken Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '140'
    text: |-
      Deze wet is mede van toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba, met inachtneming van het
      in dit hoofdstuk bepaalde.
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel140
  - number: '141'
    text: |-
      Voor de toepassing van deze wet in de openbare lichamen Bonaire, Sint Eustatius en Saba is de
      [Algemene wet op het binnentreden][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006763
    url: https://wetten.overheid.nl/BWBR0039896/2021-07-15#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0006763
  - number: '142.1'
    text: |-
      De personen en instanties die bij of krachtens de [Wet op de telecommunicatievoorzieningen BES][ref1] bevoegd
      zijn tot het verzorgen van telecommunicatieverkeer voor derden zijn verplicht medewerking te verlenen aan
      de uitvoering van de bijzondere bevoegdheden als bedoeld in de [artikelen 47][ref2], [48][ref3], [52][ref4],
      [53][ref5], [54][ref6], [55][ref7], [56][ref8] en [57][ref9] van de wet, voor zover deze betrekking heeft
      op het aftappen of opnemen van telecommunicatie en het verstrekken van gegevens omtrent een gebruiker en het
      telecommunicatieverkeer met betrekking tot die gebruiker. Onder een gebruiker wordt in dit kader verstaan de
      natuurlijke of rechtspersoon die met de persoon of een instantie als bedoeld in de eerste volzin een overeenkomst
      is aangegaan met betrekking tot het verzorgen van telecommunicatieverkeer, alsmede de natuurlijke of rechtspersoon
      wiens telecommunicatieverkeer het betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0028469
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0039896#Artikel48
