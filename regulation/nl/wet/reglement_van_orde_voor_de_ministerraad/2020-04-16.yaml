---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: reglement_van_orde_voor_de_ministerraad
regulatory_layer: WET
publication_date: '2020-04-15'
valid_from: '2020-04-16'
bwb_id: BWBR0006501
url: https://wetten.overheid.nl/BWBR0006501/2020-04-16
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van onze Minister-President, Minister van Algemene Zaken, d.d. 25 februari 1994, nr. 94M001478,
    handelende in overeenstemming met het gevoelen van de ministerraad van het Koninkrijk;

    Gelet op artikel 10 van het Statuut voor het Koninkrijk en artikel 45 van de Grondwet;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel1
  - number: 1.a
    text: 'de raad: de ministerraad en voor zover zulks uit het Statuut volgt de raad van ministers van het Koninkrijk;'
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel1
  - number: 1.b
    text: |-
      ministers: de minister-president, de overige bij koninklijk besluit benoemde ministers en voor zover zulks uit het
      Statuut volgt de gevolmachtigde ministers;
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel1
  - number: 1.c
    text: |-
      de gevolmachtigde minister: de door de regering van Aruba, Curaçao onderscheidenlijk Sint Maarten benoemde
      gevolmachtigde minister.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel1
  - number: '2.1'
    text: De ministers vormen te zamen de raad.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel2
  - number: '2.2'
    text: De minister-president is voorzitter van de raad.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel2
  - number: '2.3'
    text: De bij koninklijk besluit benoemde vice-minister(s)-president(en) is (zijn) ondervoorzitter(s) van de raad.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel2
  - number: '2.4'
    text: De raad benoemt op voorstel van de minister-president de secretaris en de plaatsvervangend secretaris.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel2
  - number: '2.5'
    text: De minister-president benoemt een of meer adjunct-secretarissen.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel2
  - number: '3.1'
    text: |-
      Aan de vergaderingen van de raad, de onderraden en de andere commissies uit de raad kunnen deelnemen met
      raadgevende stem:
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel3
  - number: 3.1.a
    text: |-
      de door de regering van Aruba, Curaçao onderscheidenlijk Sint Maarten overeenkomstig
      [artikel 10, tweede lid van het Statuut][ref1] aangewezen minister;


      [ref1]: https://wetten.overheid.nl/BWBR0002154#Artikel10
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002154
        artikel: '10'
  - number: 3.1.b
    text: |-
      De staatssecretarissen, voorzover het zaken betreft waarbij zij uit hoofde van hun taak rechtstreeks zijn
      betrokken, bij afwezigheid van de minister, of voorzover de raad uit andere hoofde hun aanwezigheid wenselijk acht.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel3
  - number: '3.2'
    text: |-
      De directeur-generaal van de Rijksvoorlichtingsdienst of diens plaatsvervanger kan de vergaderingen als toehoorder
      bijwonen, tenzij de minister-president anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel3
  - number: '4.1'
    text: De raad beraadslaagt en besluit over het algemeen regeringsbeleid en bevordert de eenheid van dat beleid.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel4
  - number: '4.2'
    text: 'Te dien einde beraadslaagt en besluit de raad onder meer over:'
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel4
  - number: 4.2.a.1°
    text: |-
      de voorstellen van rijkswet en van wet en de ontwerpen van algemene maatregelen van rijksbestuur en van bestuur
      alvorens deze aan de Afdeling advisering van de Raad van State van het Koninkrijk respectievelijk de Afdeling
      advisering van de Raad van State worden aangeboden, alsmede over de consequenties van de ter zake door de Afdeling
      advisering van de Raad van State van het Koninkrijk respectievelijk de Afdeling advisering van de Raad van State
      uitgebrachte adviezen, indien deze ingrijpende kritiek op de inhoud of de vormgeving van het voorstel of ontwerp
      bevatten;
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel4
  - number: 4.2.a.2°
    text: |-
      het ter zake van een voorstel van rijkswet en van wet of een ontwerp van algemene maatregel van rijksbestuur
      en van bestuur vragen van een spoedadvies aan de Afdeling advisering van de Raad van State van het Koninkrijk
      respectievelijk de Afdeling advisering van de Raad van State;
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel4
  - number: 4.2.a.3°
    text: |-
      een voorstel of ontwerp waarover eerder door de raad is besloten, indien daarin ingrijpende wijzigingen worden
      aangebracht of indien hetgeen bij de verdere behandeling wordt aangevoerd tot ingrijpende wijziging aanleiding kan
      geven, dan wel indien intrekking van het voorstel of ontwerp wordt overwogen, een en ander tenzij dringende redenen
      zich naar het oordeel van de minister die voor het voorstel of ontwerp in de eerste plaats verantwoordelijk is en
      de minister-president zich tegen hernieuwde behandeling verzetten;
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel4
  - number: 4.2.a.4°
    text: |-
      de bekrachtiging van door de Staten-Generaal aangenomen initiatiefvoorstellen van rijkswet en van wet, alsmede het
      standpunt dat terzake bij de beraadslaging in elk der Kamers der Staten-Generaal zal worden ingenomen;
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel4
  - number: 4.2.b
    text: verdragen alvorens deze ter stilzwijgende goedkeuring aan de beide Kamers der Staten-Generaal worden toegezonden;
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel4
  - number: 4.2.c
    text: |-
      nota’s aan de Staten-Generaal alsmede die adviesaanvragen aan adviescolleges
      in de zin van de [Kaderwet adviescolleges][ref1] en de colleges in de zin van
      [artikel 2, onder b, van de Kaderwet adviescolleges][ref2] die kunnen leiden tot belangrijke politieke en
      financiële consequenties;


      [ref1]: https://wetten.overheid.nl/BWBR0008159
      [ref2]: https://wetten.overheid.nl/BWBR0008159#Artikel2
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008159
      - id: ref2
        bwb_id: BWBR0008159
        artikel: '2'
  - number: 4.2.d
    text: |-
      het bekendheid geven aan beleidsvoornemens in welke vorm dan ook, die van invloed kunnen zijn op de positie
      van het kabinet, of die belangrijke financiële consequenties kunnen hebben, benevens over beleidsvoornemens van
      een minister die het beleid van andere ministers kunnen raken en waarover het bereiken van overeenstemming niet
      mogelijk is gebleken;
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel4
  - number: 4.2.e
    text: |-
      de instelling, taak en samenstelling van adviescolleges in de zin van de [Kaderwet adviescolleges][ref1] en de
      colleges in de zin van [artikel 2, onder b, van de Kaderwet adviescolleges][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0008159
      [ref2]: https://wetten.overheid.nl/BWBR0008159#Artikel2
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008159
      - id: ref2
        bwb_id: BWBR0008159
        artikel: '2'
  - number: 4.2.f
    text: |-
      de instelling, taak en samenstelling van interdepartementale commissies, indien deze een permanent karakter hebben
      of indien de werkzaamheden kunnen leiden tot belangrijke politieke en financiële consequenties;
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel4
  - number: 4.2.g
    text: |-
      publikatie van de rapporten van colleges in de zin van [artikel 2, onder b, van de Kaderwet adviescolleges][ref1]
      en van interdepartementale commissies indien de werkzaamheden kunnen leiden tot belangrijke politieke en financiële
      consequenties;


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel2
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '2'
  - number: 4.2.h
    text: |-
      belangrijke onderwerpen het buitenlands beleid betreffende, daaronder begrepen het in internationaal verband
      doen van of instemmen met voorstellen die van aanmerkelijke invloed kunnen zijn op de geldende rechtsorde,
      verplichtingen van blijvende aard ten gevolge kunnen hebben, dan wel Aruba, Curaçao of Sint Maarten raken;
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel4
  - number: 4.2.i
    text: |-
      de voorbereiding van het Nederlandse standpunt ten behoeve van formele en informele vergaderingen van de Europese
      Raad en van de Raad van de Europese Unie;
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel4
  - number: 4.2.j
    text: |-
      aan delegaties dan wel aan vertegenwoordigers in het buitenland te verstrekken instructies, alsmede over de
      samenstelling van delegaties, een en ander voor zover het van belang is de raad hierin te kennen;
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel4
  - number: 4.2.k
    text: |-
      voordrachten van de minister-president voor koninklijke besluiten tot benoeming en ontslag van ministers en
      staatssecretarissen;
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel4
  - number: 4.2.l
    text: |-
      andere voordrachten voor koninklijke besluiten tot benoeming van personen en ontslag wegens andere reden dan op
      verzoek van de betrokkenen, voor zover het niet betreft benoeming of ontslag:
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel4
  - number: 4.2.l.1°
    text: |-
      van in Nederland werkzame leden van de rechterlijke macht, burgerlijke rijksambtenaren, ambtenaren van politie en
      militaire ambtenaren, voor zover deze lager bezoldigd worden dan een directeur-generaal bij een ministerie alsmede
      van burgemeesters van gemeenten met minder dan 50 000 inwoners, voor zover het geen provinciehoofdstad betreft;
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel4
  - number: 4.2.l.2°
    text: |-
      van ambtenaren die in een functie buiten Nederland werkzaam zijn bij diplomatieke vertegenwoordigingen in het
      buitenland, voor zover het geen hoofden van vertegenwoordigingen van het Koninkrijk in het buitenland of permanente
      vertegenwoordigers betreft;
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel4
  - number: 4.2.l.3°
    text: |-
      van personen over wie naar het oordeel van de minister-president en de desbetreffende minister geen beraadslaging
      en beslissing van de raad is vereist;
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel4
  - number: 4.2.m
    text: |-
      voorstellen voor ministeriële besluiten tot benoeming van personen en tot ontslag, wegens andere reden dan op
      verzoek van betrokkenen, voor zover deze gelijk aan of hoger dan een directeur-generaal bij een ministerie worden
      bezoldigd.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel4
  - number: '5'
    text: |-
      Over aangelegenheden bij welke het algemeen regeringsbeleid betrokken kan zijn, niet behorende tot die bedoeld
      in [artikel 4][ref1], plegen de ministers overleg met de minister-president. Indien het overleg niet tot
      overeenstemming leidt, worden deze aangelegenheden in de raad gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006501#Artikel4
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006501
        artikel: '4'
        paragraaf: '2'
  - number: '6'
    text: |-
      In gevallen waarin het niet duidelijk is, welke minister in de eerste plaats verantwoordelijk is voor een bepaalde
      aangelegenheid, beslist de minister-president over die verantwoordelijkheid.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel6
  - number: '7'
    text: |-
      De minister-president kan, indien een aangelegenheid door een minister die daarvoor in de eerste plaats
      verantwoordelijk is, niet in de raad aan de orde wordt gesteld, zelf zorg dragen voor de indiening van deze
      aangelegenheid bij de raad.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel7
  - number: '8'
    text: |-
      De raad vergadert in beginsel op vrijdag en voorts zo dikwijls als de minister-president of ten minste twee andere
      ministers dat wenselijk achten.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel8
  - number: '9.1'
    text: |-
      De minister-president stelt de agenda vast. Een exemplaar van de agenda wordt tijdig aan de ministers en de
      staatssecretarissen gezonden.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel9
  - number: '9.2'
    text: |-
      De voor de raad bestemde stukken worden in het algemeen 7 dagen voor de behandeling in de raad rondgezonden. Zij
      zijn voorzien van een daartoe bestemd aanbiedingsformulier.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel9
  - number: '10'
    text: De minister-president regelt de orde der werkzaamheden tijdens de vergaderingen.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel10
  - number: '11.1'
    text: |-
      Indien het nodig is bij wijze van stemming te beslissen, wordt het besluit, behoudens afwijking op grond van het
      Statuut, bij meerderheid van stemmen opgemaakt, waarbij iedere aanwezige minister één stem heeft.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel11
  - number: '11.2'
    text: De raad besluit niet bij stemming dan in aanwezigheid van ten minste de helft van het totale aantal ministers.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel11
  - number: '11.3'
    text: |-
      Bij staking van stemmen wordt de beslissing tot de volgende vergadering aangehouden, tenzij de beslissing niet
      uitgesteld kan worden of de vergadering voltallig is. In deze gevallen beslist de stem van de minister-president.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel11
  - number: '12.1'
    text: Indien een minister een besluit in strijd acht met zijn verantwoordelijkheid, geeft hij daarvan kennis aan de raad.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel12
  - number: '12.2'
    text: In geen geval handelt een minister of staatssecretaris tegen een besluit van de raad.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel12
  - number: '12.3'
    text: Voor zover dit uit het Statuut voortvloeit, geldt dit artikel niet voor de gevolmachtigde ministers.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel12
  - number: '13.1'
    text: |-
      De secretaris zorgt zo spoedig mogelijk na een vergadering voor het ontwerpen van een besluitenlijst, waarin de
      conclusies van de raad worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel13
  - number: '13.2'
    text: |-
      Een exemplaar van die lijst wordt vanwege de minister-president onverwijld toegezonden aan de ministers en de
      staatssecretarissen.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel13
  - number: '14.1'
    text: De secretaris zorgt voor het ontwerpen van de notulen. Zij worden zo spoedig mogelijk door de raad vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel14
  - number: '14.2'
    text: Een exemplaar van de notulen wordt de Koning ter kennisneming aangeboden.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel14
  - number: '15'
    text: De minister-president ondertekent de voordrachten van de raad voor koninklijke besluiten.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel15
  - number: '16.1'
    text: De minister-president ziet toe op de totstandkoming van een samenhangend regeringsbeleid.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel16
  - number: '16.2'
    text: Hij ziet toe op de uitvoering van de besluiten van de raad.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel16
  - number: '16.3'
    text: |-
      Hij kan in overeenstemming met het gevoelen van de raad nadere schriftelijke aanwijzingen vaststellen inzake de
      werkwijze van de raad.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel16
  - number: '17'
    text: |-
      De raad kan uit zijn midden onderraden vormen ter voorbereiding of ter beslissing van aangelegenheden inzake
      bepaalde delen van het algemeen regeringsbeleid.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel17
  - number: '18.1'
    text: De minister-president is voorzitter van de onderraden.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel18
  - number: '18.2'
    text: |-
      Uit de vaste leden wordt een coördinerend minister aangewezen, die toeziet op de deugdelijke interdepartementale
      voorbereiding van de onderwerpen die in een onderraad worden behandeld.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel18
  - number: '19.1'
    text: De raad benoemt op voorstel van de minister-president de secretaris van een onderraad.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel19
  - number: '19.2'
    text: De minister-president benoemt de adjunct-secretaris.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel19
  - number: '20.1'
    text: Een exemplaar van de agenda van een onderraad wordt tijdig aan de ministers en de staatssecretarissen gezonden.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel20
  - number: '20.2'
    text: |-
      De ministers die van een onderraad geen vaste leden zijn, kunnen desgewenst de vergaderingen bijwonen. Zij hebben
      dan dezelfde rechten als de vaste leden.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel20
  - number: '21.1'
    text: |-
      Een onderraad neemt geen beslissing over een aangelegenheid, welke niet op de agenda is vermeld en waarbij een
      niet-aanwezige minister in het bijzonder is betrokken.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel21
  - number: '21.2'
    text: Indien een minister dit verzoekt, verwijst de onderraad een aangelegenheid naar de raad.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel21
  - number: '21.3'
    text: |-
      Ook nadat de onderraad een beslissing heeft genomen, kan een minister verlangen dat de aangelegenheid aan het
      eindoordeel van de raad wordt onderworpen.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel21
  - number: '22.1'
    text: |-
      Indien het besprokene in een vergadering van een onderraad daartoe aanleiding geeft, zorgt de secretaris voor het
      ontwerpen van een besluitenlijst, waarin de conclusies van de onderraad zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel22
  - number: '22.2'
    text: De besluitenlijst van een onderraad behoeft de goedkeuring van de raad.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel22
  - number: '23.1'
    text: 'Deskundigen kunnen met raadgevende stem het overleg in een onderraad bijwonen:'
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel23
  - number: 23.1.a
    text: indien zij door de onderraad als vaste deelnemer zijn aangewezen;
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel23
  - number: 23.1.b
    text: indien zij daartoe door de voorzitter worden uitgenodigd.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel23
  - number: '23.2'
    text: |-
      Ministers kunnen zich met vooraf verkregen toestemming van de voorzitter tijdens de vergaderingen van een onderraad
      door een ambtenaar doen bijstaan.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel23
  - number: '24'
    text: Voor zover in deze paragraaf niet anders is bepaald, heeft een onderraad dezelfde werkwijze als de raad.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel24
  - number: '25.1'
    text: |-
      De raad kan uit zijn midden andere commissies met een permanent of tijdelijk karakter vormen ter voorbereiding of
      ter beslissing van bepaalde aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel25
  - number: '25.2'
    text: De minister-president is voorzitter van de commissies, tenzij de raad anders besluit.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel25
  - number: '25.3'
    text: De raad kan bepalen dat een commissie dezelfde werkwijze heeft als een onderraad.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel25
  - number: '26.1'
    text: Ten aanzien van hetgeen ter vergadering besproken wordt of geschiedt, bestaat een geheimhoudingsplicht.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel26
  - number: '26.2'
    text: 'De geheimhoudingsplicht bestaat niet:'
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel26
  - number: 26.2.a
    text: voor zover de raad of de minister-president namens de raad ontheffing van de geheimhouding verleent;
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel26
  - number: 26.2.b
    text: |-
      voor zover uitvoering van besluiten dit nodig maakt, dan wel de aard en omstandigheden van een besluit bekendmaking
      daarvan vorderen.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel26
  - number: '26.3'
    text: |-
      Dit artikel is van overeenkomstige toepassing met betrekking tot de vergaderingen van de onderraden en commissies
      uit de raad.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel26
  - number: 26a
    text: |-
      De minister-president kan, zo nodig en zo lang de continuïteit van de besluitvorming in het kader van de
      bestrijding van het coronavirus (covid-19) dit noodzakelijk maakt, beslissingen nemen, zo nodig in afwijking van
      het reglement, met betrekking tot de vergaderingen van de raad, zijn onderraden en commissies ten aanzien van
      de aanlevering van stukken, de aanwezigheid van anderen dan genoemd in de [artikelen 2][ref1] en [3][ref2], de
      werkwijze, de geheimhouding en de verslaglegging.


      [ref1]: https://wetten.overheid.nl/BWBR0006501#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006501#Artikel3
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0006501
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006501
        artikel: '3'
        paragraaf: '2'
  - number: '27'
    text: De minister-president zorgt ervoor dat dit reglement in acht wordt genomen.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel27
  - number: '28'
    text: |-
      Het koninklijk besluit van 16 mei 1979, houdende vaststelling van een reglement van orde voor de Raad van
      Ministers, (*Stb*. 264) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel28
  - number: '29'
    text: Dit besluit treedt in werking met ingang van 1 april 1994.
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel29
  - number: '30'
    text: 'Dit besluit wordt aangehaald als: reglement van orde voor de ministerraad.'
    url: https://wetten.overheid.nl/BWBR0006501/2020-04-16#Artikel30
