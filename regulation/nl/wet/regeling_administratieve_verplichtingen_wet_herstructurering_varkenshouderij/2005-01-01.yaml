preamble:
  text: |-
    Gelet op artikel 29, tweede en derde lid, van de Wet herstructurering varkenshouderij;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009813/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



             wet:

              [Wet herstructurering varkenshouderij][ref1];



             varken:

              dier van de diersoort varken, onderscheiden naar de in [bijlage A bij de wet][ref2] opgenomen
      diercategorieën binnen die diersoort.


      [ref1]: https://wetten.overheid.nl/BWBR0009542
      [ref2]: https://wetten.overheid.nl/BWBR0009542
    url: https://wetten.overheid.nl/BWBR0009813/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009542
      - id: ref2
        bwb_id: BWBR0009542
  - number: '2'
    text: |-
      1 De houder van varkens houdt een administratie bij van het aantal door hem gehouden varkens en van de tot het
      bedrijf behorende oppervlakte landbouwgrond. Indien een varkenshouder op meer dan één bedrijf varkens houdt, houdt
      hij voor elk bedrijf afzonderlijk een administratie bij.

      2 De administratie bevat de gegevens en wordt opgemaakt overeenkomstig artikel 2 van de Regeling administratieve
      verplichtingen Meststoffenwet.

      3 De administratie bevat de gegevens en wordt opgemaakt overeenkomstig artikel 3 van de Regeling administratieve
      verplichtingen Meststoffenwet, indien op het bedrijf [artikel 38, eerste lid, van de Meststoffenwet][ref1] van
      toepassing is.

      4 De administratie heeft betrekking op een jaar en wordt afgesloten vóór de eerste februari volgend op het jaar
      waarop deze betrekking heeft.

      5 Het eerste lid is niet van toepassing op de houder van varkens die een bedrijf voert waarvan het gemiddeld in
      het desbetreffende jaar op het bedrijf gehouden aantal dieren van de in [bijlage A bij de Meststoffenwet][ref2]
      onderscheiden diercategoriën, omgerekend in grootvee-eenheden overeenkomstig de in die bijlage daarvoor opgenomen
      normen, drie of minder bedraagt, en de gemiddeld in het desbetreffende jaar tot het bedrijf behorende oppervlakte
      landbouwgrond drie hectare of minder bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0009813/2005-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0004054
  - number: '3'
    text: |-
      1 In afwijking van [artikel 2][ref1] houdt de varkenshouder in 1998 een administratie bij van het aantal gehouden
      varkens in het nog niet verstreken deel van het jaar, door gebruik te maken van het formulier met toelichting,
      opgenomen in bijlage 1 bij deze regeling. De administratie wordt binnen de in de bijlage aangegeven termijnen en
      overeenkomstig de daarbij aangegeven wijze volledig en naar waarheid bijgehouden.

      2 De varkenshouder houdt de in het eerste lid bedoelde administratie bij door gebruik te maken
      van het formulier met toelichting, opgenomen in bijlage 2 bij deze regeling, indien op het bedrijf
      [artikel 38, eerste lid, van de Meststoffenwet][ref2] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0009813#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel38
    url: https://wetten.overheid.nl/BWBR0009813/2005-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009813
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '38'
  - number: '4'
    text: |-
      1 De varkenshouder die de in [artikel 2][ref1], onderscheidenlijk 3, bedoelde administratie bijhoudt, verstrekt
      vóór 1 september van het jaar volgend op het desbetreffende jaar aan de Dienst Regelingen gegevens over het
      gemiddeld in het desbetreffende jaar op het bedrijf gehouden aantal varkens en de gemiddeld in het desbetreffende
      jaar tot het bedrijf behorende oppervlakte landbouwgrond, door gebruik te maken van het in artikel 14, tweede lid,
      van de Regeling administratieve verplichtingen Meststoffenwet bedoelde formulier.

      2 Over het jaar 1998 verstrekt de varkenshouder gegevens over het gemiddeld in dat jaar op het bedrijf gehouden
      aantal varkens door gebruik te maken van een daartoe door de Minister van Landbouw, Natuur en Voedselkwaliteit
      vastgesteld formulier, dat overeen-komstig de op het formulier aangegeven wijze volledig en naar waarheid is
      ingevuld en ondertekend.


      [ref1]: https://wetten.overheid.nl/BWBR0009813#Artikel2
    url: https://wetten.overheid.nl/BWBR0009813/2005-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009813
        artikel: '2'
  - number: '5'
    text: |-
      1 Het gemiddeld in een jaar op een bedrijf gehouden aantal varkens wordt bepaald door:

      a. ingeval de administratie van het aantal op het bedrijf gehouden varkens de gegevens bevat en wordt opgemaakt
      overeenkomstig artikel 2 van de Regeling administratieve verplichtingen Meststoffenwet, de som van de aantallen
      dagelijks op het bedrijf gehouden varkens gedeeld door het aantal dagen waaruit het desbetreffende jaar bestaat,
      dan wel

      b. ingeval de administratie van het aantal op het bedrijf gehouden varkens de gegevens bevat en wordt opgemaakt
      overeenkomstig artikel 3 van de Regeling administratieve verplichtingen Meststoffenwet, de som van de aantallen op
      de eerste dag van elke maand op het bedrijf gehouden varkens gedeeld door 12.

      2 Het in 1998 gemiddeld op het bedrijf gehouden aantal varkens wordt bepaald voor het tijdvak dat bestaat uit het
      vanaf 1 september 1998 nog niet verstreken deel van het jaar door respectievelijk:

      a. de som van de aantallen dagelijks op het bedrijf gehouden varkens, gedeeld door het aantal dagen waaruit dat
      tijdvak bestaat, indien de administratie van het aantal op het bedrijf gehouden varkens de gegevens bevat en wordt
      opgemaakt overeen-komstig [artikel 3, eerste lid][ref1], dan wel

      b. de som van de aantallen op de eerste dag van elke maand op het bedrijf gehouden varkens, gedeeld door het aantal
      kalendermaanden waaruit dat tijdvak bestaat, indien de administratie van het aantal op het bedrijf gehouden varkens
      de gegevens bevat en wordt opgemaakt overeenkomstig [artikel 3, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009813#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009813#Artikel3
    url: https://wetten.overheid.nl/BWBR0009813/2005-01-01#Artikel5
