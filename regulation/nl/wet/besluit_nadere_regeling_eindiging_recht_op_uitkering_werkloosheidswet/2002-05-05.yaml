        artikel: '20'
  - number: 4a
    text: |-
      1 Voor de berekening van het aantal arbeidsuren, bedoeld in [artikel 20, derde en vierde lid][ref1],
      terzake waarvan het recht op uitkering eindigt, worden buiten beschouwing gelaten de arbeidsuren waarin
      bereikbaarheidsdiensten zijn verricht.

      2 Het eerste lid van dit artikel is niet van toepassing indien voor de arbeidsuren waarin bereikbaarheidsdiensten
      zijn verricht, een vergoeding is ontvangen die tenminste gelijk is aan de voor de betreffende werknemer geldende
      vergoeding voor het verrichten van zijn overige arbeid.

      3 Voor de toepassing van dit besluit wordt onder bereikbaarheidsdiensten verstaan: het buiten de gebruikelijke
      werktijden en/of plaats beschikbaar zijn om op aanwijzing door of namens de werkgever direct arbeid te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel20
    url: https://wetten.overheid.nl/BWBR0026096/2002-05-05#Artikel4a
