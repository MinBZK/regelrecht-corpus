preamble:
  text: |-
    Overwegende dat met wet van 22 december 1993 (Stb. 744) de bevoegdheid van de Sociale Verzekeringsraad, genoemd in
    artikel 20, zesde lid, van de Werkloosheidswet is gewijzigd;

    Overwegende dat het gewenst is zijn besluit van 18 december 1986, nr. 86/8028 in te trekken en een nieuw besluit
    te treffen;

    Gelet op artikel 20, zesde lid, van de Werkloosheidswet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0026096/2002-05-05#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de berekening van het aantal arbeidsuren, bedoeld in
      [artikel 20, derde en vierde lid, van de Werkloosheidswet][ref1] worden met arbeidsuren gelijkgesteld:

      a. uren waarin de werknemer zonder te werken loon heeft ontvangen;

      b. uren, waarin de werknemer niet heeft gewerkt en waarvoor hij een uitkering op grond van een
      vorstuitkeringsreglement heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel20
    url: https://wetten.overheid.nl/BWBR0026096/2002-05-05#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '20'
  - number: '2'
    text: |-
      1 Indien het aantal arbeidsuren in een kalenderweek als gevolg van een bepaalde wijze van invulling van
      arbeidsduurverkorting, geen juist beeld geeft van het arbeidspatroon, worden zonodig in afwijking van de voorgaande
      artikelen:

      a. uren, waarin de werknemer niet heeft gewerkt, gelijkgesteld met arbeidsuren;

      b. uren, waarin de werknemer heeft gewerkt, buiten beschouwing gelaten; of

      c. zowel uren, waarin de werknemer niet heeft gewerkt, gelijkgesteld met arbeidsuren als uren, waarin de werknemer
      heeft gewerkt, buiten beschouwing gelaten.

      2 Voor de toepassing van het eerste lid wordt de arbeidsduurverkorting geacht gelijkelijk te zijn verspreid
      over een periode van een kalenderjaar. Indien de werknemer in een kalenderweek meer uren arbeidsduurverkorting
      heeft genoten dan het op jaarbasis vastgesteld gemiddeld aantal per week, wordt het verschil voor de toepassing
      van het eerste lid gelijkgesteld met gewerkte uren. Indien de werknemer in een kalenderweek minder uren
      arbeidsduurverkorting heeft genoten dan het op jaarbasis vastgesteld gemiddeld aantal per week, wordt het verschil
      voor de toepassing van het eerste lid buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0026096/2002-05-05#Artikel2
  - number: '3'
    text: |-
      Indien het aantal arbeidsuren in een kalenderweek ten aanzien van de werknemer, die in ploegendienst of
      volgens andere vormen van werkroosters gaat werken, gelet op zijn arbeidspatroon geen juist beeld geeft van dat
      arbeidspatroon, worden zonodig in afwijking van de voorgaande artikelen niet-gewerkte uren zodanig gelijkgesteld
      met gewerkte uren dan wel, worden gewerkte uren zodanig buiten beschouwing gelaten, dat het gemiddeld aantal
      arbeidsuren overeenkomt met het aantal uren van dat arbeidspatroon.
    url: https://wetten.overheid.nl/BWBR0026096/2002-05-05#Artikel3
  - number: '4'
    text: |-
      1 Indien de werknemer meer dan één recht op uitkering op grond van de [Werkloosheidswet][ref1] heeft en zich een
      omstandigheid, als bedoeld in [artikel 20, eerste lid, onderdeel a en b, van de Werkloosheidswet][ref2], voordoet,
      worden voor de toepassing van het [tweede, derde, vierde en vijfde lid van dat artikel][ref3] de uitkeringsrechten
      beëindigd in de volgorde, waarin zij zijn ontstaan.

      2 Het Uitvoeringsinstituut werknemersverzekeringen neemt in afwijking van het eerste lid een andere volgorde in
      aanmerking, indien toepassing van dat lid tot een kennelijk onjuiste uitkomst leidt.

      3 In de situatie, bedoeld in het tweede lid, wordt voor de vaststelling van de volgorde, waarin de
      uitkeringsrechten worden beëindigd, uitgegaan van een samenhang tussen de werkloosheidssituaties en de reden van
      beëindiging van het recht op uitkering.

      4 Een samenhang, als bedoeld in het derde lid, wordt vastgesteld aan de hand van:

      a. het beroep of de beroepen van de werknemer;

      b. de bedrijfstak of bedrijfstakken waarin de werknemer werkzaam is;

      c. het aantal uren van de werkloosheid en het aantal uren, waarmee het uitkeringsrecht moet worden beëindigd;

      d. de hoogte van het loon.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel20
    url: https://wetten.overheid.nl/BWBR0026096/2002-05-05#Artikel4
