  - number: '5'
    text: Het besluit van de Sociale Verzekeringsraad van 18 december 1986, nr. 86/8028 (Stcrt. 1986, 248) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0026096/2002-05-05#Artikel5
  - number: '6'
    text: |-
      Het besluit, genoemd in [artikel 5][ref1], blijft van toepassing op feiten en omstandigheden, ontstaan voor de
      inwerkingtreding van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0026096#Artikel5
    url: https://wetten.overheid.nl/BWBR0026096/2002-05-05#Artikel6
