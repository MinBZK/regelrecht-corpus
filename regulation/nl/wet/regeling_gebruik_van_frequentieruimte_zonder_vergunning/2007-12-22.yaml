  - number: 2.1.k
    text: |-
      radiozendapparaten, zijnde GSM1800-basisstations, die zich bevinden aan boord van luchtvaartuigen en bestemd
      zijn voor aansluiting op een mobiel openbaar elektronisch communicatienetwerk en worden gebruikt op de in
      [bijlage 7][ref1] aangegeven frequentiebanden boven een vlieghoogte van 3000 meter, gerekend vanaf de grond;


      [ref1]: https://wetten.overheid.nl/BWBR0015732
    url: https://wetten.overheid.nl/BWBR0015732/2007-12-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015732
    machine_readable:
      input:
        - name: is_GSM1800_basisstation
          type: boolean
          description: Geeft aan of het een GSM1800-basisstation is
        - name: aan_boord_van_luchtvaartuig
          type: boolean
          description: Geeft aan of het zich aan boord van een luchtvaartuig bevindt
        - name: bestemd_voor_mobiel_openbaar_netwerk
          type: boolean
          description: Geeft aan of het bestemd is voor aansluiting op een mobiel openbaar elektronisch communicatienetwerk
        - name: vlieghoogte_boven_3000m
          type: boolean
          description: Geeft aan of het wordt gebruikt boven een vlieghoogte van 3000 meter
        - name: voldoet_aan_bijlage_7
          type: boolean
          description: Geeft aan of de frequentiebanden uit bijlage 7 in acht worden genomen
      execution:
        output:
          - name: is_compliant_2_1_k
            type: boolean
            description: Geeft aan of het apparatus voldoet aan 2.1.k
        actions:
          - output: is_compliant_2_1_k
            value:
              operation: AND
              conditions:
                - subject: $is_GSM1800_basisstation
                - subject: $aan_boord_van_luchtvaartuig
                - subject: $bestemd_voor_mobiel_openbaar_netwerk
                - subject: $vlieghoogte_boven_3000m
                - subject: $voldoet_aan_bijlage_7

  - number: 2.1.l
