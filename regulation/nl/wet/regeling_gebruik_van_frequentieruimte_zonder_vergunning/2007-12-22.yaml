  - number: 2.1.j
    text: |-
      randapparaten voor mobiele communicatie via ionisatiesporen van meteoren, mits de in [bijlage 6][ref1] aangegeven
      frequentieband en de daarbij behorende gebruiksvoorschriften in acht worden genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0015732
    url: https://wetten.overheid.nl/BWBR0015732/2007-12-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015732
    machine_readable:
      input:
        - name: is_randapparaat_ionisatiesporen
          type: boolean
          description: Geeft aan of het een randapparaat voor mobiele communicatie via ionisatiesporen van meteoren is
        - name: voldoet_aan_bijlage_6
