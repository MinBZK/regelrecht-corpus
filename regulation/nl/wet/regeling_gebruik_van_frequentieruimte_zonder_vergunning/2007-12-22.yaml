preamble:
  text: |-
    Gelet op artikel 3.4, eerste lid, onderdeel a, van de Telecommunicatiewet en artikel 18 van het Frequentiebesluit;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0015732/2007-12-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De gebruiker van frequentieruimte waarvoor geen vergunning is vereist, zorgt ervoor dat door het gebruik
      van het gewenste signaal van het radiozendapparaat geen storing of belemmering wordt veroorzaakt in andere
      radiozendapparaten dan wel in overige elektrische of elektronische apparaten.
    url: https://wetten.overheid.nl/BWBR0015732/2007-12-22#Artikel1
  - number: '2'
    text: |-
      1 Als categorieën radiozendapparaten, bedoeld in
      [artikel 3.4, eerste lid, onder a, van de Telecommunicatiewet][ref1], worden aangewezen:

      a. randapparaten die bestemd zijn voor aansluiting op een mobiel openbaar elektronisch communicatienetwerk, waar
      voor de in het netwerk gebruikte frequentieruimte krachtens [artikel 3.1 van de wet][ref2] vergunning is verleend.

      b. randapparaten die bestemd zijn voor aansluiting op een openbaar satellietsysteem, ten behoeve van mobiele
      communicatie, met uitzondering van het nood-, spoed en veiligheidsverkeer;

      c. randapparaten, zijnde koordloze telefoons, die bestemd zijn voor aansluiting op een openbaar telefoonnetwerk
      op een vaste locatie, mits de in [bijlage 1][ref3] aangegeven frequentiebanden en de daarbij behorende
      gebruiksvoorschriften in acht worden genomen;

      d. radiozendapparaten voor algemene radiocommunicatie in de 27 MHz-frequentieband (CB), mits de in
      [bijlage 2][ref4] aangegeven frequentiebanden en de daarbij behorende gebruiksvoorschriften in acht worden genomen;

      e. randapparaten die bestemd zijn voor aansluiting op een openbaar telecommunicatienetwerk ten behoeve van
      plaatsbepaling;

      f. mobiele VHF/UHF radiozendapparaten voor landmobiel gebruik die daadwerkelijk en krachtens een daartoe
      gesloten overeenkomst onderdeel zijn van een besloten netwerk, dat deel is van een radionetwerk met dynamische
      frequentietoewijzing ten behoeve waarvan een vergunning is verleend voor het gebruik van frequentieruimte
      (trunkinginstallatie);

      g. mobiele radiozendapparaten behorend tot een digitaal radionetwerk met dynamische frequentietoewijzing, mits
      de in [bijlage 3][ref5] aangegeven frequentieband en de daarbij behorende gebruiksvoorschriften in acht worden
      genomen;

      h. mobiele UHF radiozendapparaten, werkend in de frequentieband 446 MHz, bedoeld voor algemeen gebruik ten behoeve
      van communicatie over korte afstand (PMR 446), mits de in [bijlage 4][ref6] aangegeven frequentiebanden en de
      daarbij behorende gebruiksvoorschriften in acht worden genomen;

      i. randapparaten, zijnde satellietgrondstations, mits de in [bijlage 5][ref7] aangegeven frequentiebanden en de
      daarbij behorende gebruiksvoorschriften in acht worden genomen;

      j. randapparaten voor mobiele communicatie via ionisatiesporen van meteoren, mits de in [bijlage 6][ref8]
      aangegeven frequentieband en de daarbij behorende gebruiksvoorschriften in acht worden genomen;

      k. radiozendapparaten, zijnde GSM1800-basisstations, die zich bevinden aan boord van luchtvaartuigen en bestemd
      zijn voor aansluiting op een mobiel openbaar elektronisch communicatienetwerk en worden gebruikt op de in
      [bijlage 7][ref9] aangegeven frequentiebanden boven een vlieghoogte van 3000 meter, gerekend vanaf de grond;

      l. de in [bijlage 8][ref10] bedoelde categorieën radiozendapparaten, mits de in [die bijlage][ref11] aangegeven
      frequentiebanden en de daarbij behorende gebruiksvoorschriften in acht worden genomen;

      m. radiozendapparaten die gebruik maken van ultrabreedbandtechnologie, mits de in [bijlage 9][ref12] aangegeven
      frequentiebanden en de daarbij behorende gebruiksvoorschriften in acht worden genomen.

      2 Onder de aanwijzing, bedoeld in het eerste lid, vallen slechts apparaten die voldoen aan het bij of krachtens het
      [Besluit randapparaten en radioapparaten 2007][ref13] bepaalde.


