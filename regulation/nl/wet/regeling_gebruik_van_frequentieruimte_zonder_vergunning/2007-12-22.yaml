        - name: bestemd_voor_plaatsbepaling
          type: boolean
          description: Geeft aan of het apparaat bestemd is voor aansluiting op een openbaar telecommunicatienetwerk ten behoeve van plaatsbepaling
      execution:
        output:
          - name: is_compliant_2_1_e
            type: boolean
            description: Geeft aan of het apparatus voldoet aan 2.1.e
        actions:
          - output: is_compliant_2_1_e
            value:
              subject: $bestemd_voor_plaatsbepaling

  - number: 2.1.f
    text: |-
      mobiele VHF/UHF radiozendapparaten voor landmobiel gebruik die daadwerkelijk en krachtens een daartoe
      gesloten overeenkomst onderdeel zijn van een besloten netwerk, dat deel is van een radionetwerk met dynamische
      frequentietoewijzing ten behoeve waarvan een vergunning is verleend voor het gebruik van frequentieruimte
      (trunkinginstallatie);
    url: https://wetten.overheid.nl/BWBR0015732/2007-12-22#Artikel2
    machine_readable:
      input:
        - name: is_mobiel_VHF_UHF_radiozendapparaat
          type: boolean
          description: Geeft aan of het een mobiel VHF/UHF radiozendapparaat voor landmobiel gebruik is
        - name: onderdeel_van_besloten_netwerk
          type: boolean
          description: Geeft aan of het apparaat daadwerkelijk onderdeel is van een besloten netwerk
        - name: deel_van_radionetwerk_met_dynamische_toewijzing
          type: boolean
          description: Geeft aan of het netwerk deel is van een radionetwerk met dynamische frequentietoewijzing
        - name: vergunning_verleend_voor_frequentieruimte_trunking
          type: boolean
          description: Geeft aan of er een vergunning is verleend voor het gebruik van frequentieruimte (trunkinginstallatie)
      execution:
        output:
          - name: is_compliant_2_1_f
            type: boolean
            description: Geeft aan of het apparatus voldoet aan 2.1.f
        actions:
          - output: is_compliant_2_1_f
            value:
              operation: AND
              conditions:
                - subject: $is_mobiel_VHF_UHF_radiozendapparaat
                - subject: $onderdeel_van_besloten_netwerk
                - subject: $deel_van_radionetwerk_met_dynamische_toewijzing
                - subject: $vergunning_verleend_voor_frequentieruimte_trunking

  - number: 2.1.g
    text: |-
      mobiele radiozendapparaten behorend tot een digitaal radionetwerk met dynamische frequentietoewijzing, mits de in
      [bijlage 3][ref1] aangegeven frequentieband en de daarbij behorende gebruiksvoorschriften in acht worden genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0015732
    url: https://wetten.overheid.nl/BWBR0015732/2007-12-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015732
    machine_readable:
      input:
        - name: is_mobiel_radiozendapparaat_digitaal_netwerk
