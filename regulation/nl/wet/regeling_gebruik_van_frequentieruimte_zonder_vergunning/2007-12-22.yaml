    text: |-
      radiozendapparaten die gebruik maken van ultrabreedbandtechnologie, mits de in [bijlage 9][ref1] aangegeven
      frequentiebanden en de daarbij behorende gebruiksvoorschriften in acht worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0015732
    url: https://wetten.overheid.nl/BWBR0015732/2007-12-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015732
