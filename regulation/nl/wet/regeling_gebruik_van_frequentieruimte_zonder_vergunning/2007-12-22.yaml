          description: Geeft aan of het een satellietgrondstation is
        - name: voldoet_aan_bijlage_5
          type: boolean
          description: Geeft aan of de frequentiebanden en gebruiksvoorschriften uit bijlage 5 in acht worden genomen
      execution:
        output:
          - name: is_compliant_2_1_i
            type: boolean
            description: Geeft aan of het apparatus voldoet aan 2.1.i
        actions:
          - output: is_compliant_2_1_i
