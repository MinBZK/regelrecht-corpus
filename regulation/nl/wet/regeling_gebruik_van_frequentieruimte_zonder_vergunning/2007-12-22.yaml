  - number: 2.1.h
    text: |-
      mobiele UHF radiozendapparaten, werkend in de frequentieband 446 MHz, bedoeld voor algemeen gebruik ten behoeve van
      communicatie over korte afstand (PMR 446), mits de in [bijlage 4][ref1] aangegeven frequentiebanden en de daarbij
      behorende gebruiksvoorschriften in acht worden genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0015732
    url: https://wetten.overheid.nl/BWBR0015732/2007-12-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015732
    machine_readable:
      input:
        - name: is_mobiel_UHF_radiozendapparaat_446MHz
          type: boolean
          description: Geeft aan of het een mobiel UHF radiozendapparaat werkend in de 446 MHz-band (PMR 446) is
        - name: voldoet_aan_bijlage_4
          type: boolean
          description: Geeft aan of de frequentiebanden en gebruiksvoorschriften uit bijlage 4 in acht worden genomen
      execution:
        output:
          - name: is_compliant_2_1_h
            type: boolean
