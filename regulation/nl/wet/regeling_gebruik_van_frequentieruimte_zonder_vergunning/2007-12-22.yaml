---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_gebruik_van_frequentieruimte_zonder_vergunning
regulatory_layer: WET
publication_date: '2008-02-29'
valid_from: '2007-12-22'
bwb_id: BWBR0015732
url: https://wetten.overheid.nl/BWBR0015732/2007-12-22
preamble:
  text: |-
    Gelet op artikel 3.4, eerste lid, onderdeel a, van de Telecommunicatiewet en artikel 18 van het Frequentiebesluit;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0015732/2007-12-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De gebruiker van frequentieruimte waarvoor geen vergunning is vereist, zorgt ervoor dat door het gebruik
      van het gewenste signaal van het radiozendapparaat geen storing of belemmering wordt veroorzaakt in andere
      radiozendapparaten dan wel in overige elektrische of elektronische apparaten.
    url: https://wetten.overheid.nl/BWBR0015732/2007-12-22#Artikel1
    machine_readable:
      input:
        - name: storing_veroorzaakt
          type: boolean
          description: Geeft aan of storing wordt veroorzaakt
        - name: belemmering_veroorzaakt
          type: boolean
          description: Geeft aan of belemmering wordt veroorzaakt
      execution:
        output:
          - name: geen_storing_of_belemmering
            type: boolean
            description: Geeft aan of geen storing of belemmering wordt veroorzaakt
        actions:
          - output: geen_storing_of_belemmering
            value:
              operation: NOT
              value:
                operation: OR
                conditions:
                  - subject: $storing_veroorzaakt
                  - subject: $belemmering_veroorzaakt

  - number: '2.1'
    text: |-
      Als categorieën radiozendapparaten, bedoeld in [artikel 3.4, eerste lid, onder a, van de Telecommunicatiewet][ref1],
      worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0015732/2007-12-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'

  - number: 2.1.a
    text: |-
      randapparaten die bestemd zijn voor aansluiting op een mobiel openbaar elektronisch communicatienetwerk, waar voor
      de in het netwerk gebruikte frequentieruimte krachtens [artikel 3.1 van de wet][ref1] vergunning is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0015732/2007-12-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
    machine_readable:
      input:
        - name: vergunning_verleend_voor_frequentieruimte
          type: boolean
          description: Geeft aan of er een vergunning is verleend voor de gebruikte frequentieruimte
      execution:
        output:
          - name: is_compliant_2_1_a
            type: boolean
            description: Geeft aan of het apparaat voldoet aan 2.1.a
        actions:
          - output: is_compliant_2_1_a
            value:
              subject: $vergunning_verleend_voor_frequentieruimte

  - number: 2.1.b
    text: |-
      randapparaten die bestemd zijn voor aansluiting op een openbaar satellietsysteem, ten behoeve van mobiele
      communicatie, met uitzondering van het nood-, spoed en veiligheidsverkeer;
    url: https://wetten.overheid.nl/BWBR0015732/2007-12-22#Artikel2
    machine_readable:
      input:
        - name: bestemd_voor_openbaar_satellietsysteem
          type: boolean
          description: Geeft aan of het apparaat bestemd is voor aansluiting op een openbaar satellietsysteem
        - name: voor_mobiele_communicatie
          type: boolean
          description: Geeft aan of het apparaat ten behoeve is van mobiele communicatie
        - name: is_nood_spoed_veiligheidsverkeer
          type: boolean
          description: Geeft aan of het apparatus vallet onder nood-, spoed en veiligheidsverkeer
      execution:
        output:
          - name: is_compliant_2_1_b
            type: boolean
            description: Geeft aan of het apparaat voldoet aan 2.1.b
        actions:
          - output: is_compliant_2_1_b
            value:
              operation: AND
              conditions:
                - subject: $bestemd_voor_openbaar_satellietsysteem
                - subject: $voor_mobiele_communicatie
                - operation: NOT
                  value:
                    subject: $is_nood_spoed_veiligheidsverkeer

  - number: 2.1.c
    text: |-
      randapparaten, zijnde koordloze telefoons, die bestemd zijn voor aansluiting op een openbaar telefoonnetwerk
      op een vaste locatie, mits de in [bijlage 1][ref1] aangegeven frequentiebanden en de daarbij behorende
      gebruiksvoorschriften in acht worden genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0015732
    url: https://wetten.overheid.nl/BWBR0015732/2007-12-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015732
    machine_readable:
      input:
        - name: is_koordloze_telefoon
          type: boolean
          description: Geeft aan of het apparaat een koordloze telefoon is
        - name: bestemd_voor_openbaar_telefoonnetwerk
          type: boolean
          description: Geeft aan of het apparaat bestemd is voor aansluiting op een openbaar telefoonnetwerk
        - name: vaste_locatie
          type: boolean
          description: Geeft aan of het apparaat op een vaste locatie wordt gebruikt
        - name: voldoet_aan_bijlage_1
          type: boolean
          description: Geeft aan of de frequentiebanden en gebruiksvoorschriften uit bijlage 1 in acht worden genomen
      execution:
        output:
          - name: is_compliant_2_1_c
            type: boolean
            description: Geeft aan of het apparatus voldoet aan 2.1.c
        actions:
          - output: is_compliant_2_1_c
            value:
              operation: AND
              conditions:
                - subject: $is_koordloze_telefoon
                - subject: $bestemd_voor_openbaar_telefoonnetwerk
                - subject: $vaste_locatie
                - subject: $voldoet_aan_bijlage_1

  - number: 2.1.d
    text: |-
      radiozendapparaten voor algemene radiocommunicatie in de 27 MHz-frequentieband (CB), mits de in [bijlage 2][ref1]
      aangegeven frequentiebanden en de daarbij behorende gebruiksvoorschriften in acht worden genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0015732
    url: https://wetten.overheid.nl/BWBR0015732/2007-12-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015732
    machine_readable:
      input:
        - name: is_radiozendapparaat_voor_CB
          type: boolean
          description: Geeft aan of het een radiozendapparaat voor algemene radiocommunicatie in de 27 MHz-band (CB) is
        - name: voldoet_aan_bijlage_2
          type: boolean
          description: Geeft aan of de frequentiebanden en gebruiksvoorschriften uit bijlage 2 in acht worden genomen
      execution:
        output:
          - name: is_compliant_2_1_d
            type: boolean
            description: Geeft aan of het apparatus voldoet aan 2.1.d
        actions:
          - output: is_compliant_2_1_d
            value:
              operation: AND
              conditions:
                - subject: $is_radiozendapparaat_voor_CB
                - subject: $voldoet_aan_bijlage_2

  - number: 2.1.e
    text: |-
      randapparaten die bestemd zijn voor aansluiting op een openbaar telecommunicatienetwerk ten behoeve van
      plaatsbepaling;
    url: https://wetten.overheid.nl/BWBR0015732/2007-12-22#Artikel2
    machine_readable:
