                - subject: $gebruikt_ultrabreedbandtechnologie
                - subject: $voldoet_aan_bijlage_9

  - number: '2.2'
    text: |-
      Onder de aanwijzing, bedoeld in het eerste lid, vallen slechts apparaten die voldoen aan het bij of krachtens het
      [Besluit randapparaten en radioapparaten 2007][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0021037
    url: https://wetten.overheid.nl/BWBR0015732/2007-12-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0021037

  - number: '3'
    text: |-
      Deze regeling treedt in werking met ingang van de dag waarop de
      [Regeling aanvraag en toelating vergunningen voor het gebruik van frequentieruimte][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0015731
    url: https://wetten.overheid.nl/BWBR0015732/2007-12-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0015731

  - number: '4'
    text: 'Deze regeling wordt aangehaald als: Regeling gebruik van frequentieruimte zonder vergunning.'
    url: https://wetten.overheid.nl/BWBR0015732/2007-12-22#Artikel4
