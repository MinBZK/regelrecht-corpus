---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_gebruik_van_frequentieruimte_zonder_vergunning
regulatory_layer: WET
publication_date: '2008-02-29'
valid_from: '2006-11-22'
bwb_id: BWBR0015732
url: https://wetten.overheid.nl/BWBR0015732/2006-11-22
preamble:
  text: |-
    Gelet op artikel 3.4, eerste lid, onderdeel a, van de Telecommunicatiewet en artikel 18 van het Frequentiebesluit;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0015732/2006-11-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De gebruiker van frequentieruimte waarvoor geen vergunning is vereist, zorgt ervoor dat door het gebruik
      van het gewenste signaal van het radiozendapparaat geen storing of belemmering wordt veroorzaakt in andere
      radiozendapparaten dan wel in overige elektrische of elektronische apparaten.
    url: https://wetten.overheid.nl/BWBR0015732/2006-11-22#Artikel1
  - number: '2.1'
    text: |-
      Als categorieën radiozendapparaten, bedoeld in [artikel 3.4, eerste lid, onder a, van de Telecommunicatiewet][ref1],
      worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0015732/2006-11-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
  - number: 2.1.a
    text: |-
      randapparaten die bestemd zijn voor aansluiting op een mobiel openbaar elektronisch communicatienetwerk, waar voor
      de in het netwerk gebruikte frequentieruimte krachtens [artikel 3.1 van de wet][ref1] vergunning is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0015732/2006-11-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
  - number: 2.1.b
    text: |-
      randapparaten die bestemd zijn voor aansluiting op een openbaar satellietsysteem, ten behoeve van mobiele
      communicatie, met uitzondering van het nood-, spoed en veiligheidsverkeer;
    url: https://wetten.overheid.nl/BWBR0015732/2006-11-22#Artikel2
  - number: 2.1.c
    text: |-
      randapparaten, zijnde koordloze telefoons, die bestemd zijn voor aansluiting op een openbaar telefoonnetwerk
      op een vaste locatie, mits de in [bijlage 1][ref1] aangegeven frequentiebanden en de daarbij behorende
      gebruiksvoorschriften in acht worden genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0015732
    url: https://wetten.overheid.nl/BWBR0015732/2006-11-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015732
  - number: 2.1.d
    text: |-
      radiozendapparaten voor algemene radiocommunicatie in de 27 MHz-frequentieband (CB), mits de in [bijlage 2][ref1]
      aangegeven frequentiebanden en de daarbij behorende gebruiksvoorschriften in acht worden genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0015732
    url: https://wetten.overheid.nl/BWBR0015732/2006-11-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015732
  - number: 2.1.e
    text: |-
      randapparaten die bestemd zijn voor aansluiting op een openbaar telecommunicatienetwerk ten behoeve van
      plaatsbepaling;
    url: https://wetten.overheid.nl/BWBR0015732/2006-11-22#Artikel2
  - number: 2.1.f
    text: |-
      mobiele VHF/UHF radiozendapparaten voor landmobiel gebruik die daadwerkelijk en krachtens een daartoe
      gesloten overeenkomst onderdeel zijn van een besloten netwerk, dat deel is van een radionetwerk met dynamische
      frequentietoewijzing ten behoeve waarvan een vergunning is verleend voor het gebruik van frequentieruimte
      (trunkinginstallatie);
    url: https://wetten.overheid.nl/BWBR0015732/2006-11-22#Artikel2
  - number: 2.1.g
    text: |-
      mobiele radiozendapparaten behorend tot een digitaal radionetwerk met dynamische frequentietoewijzing, mits de in
      [bijlage 3][ref1] aangegeven frequentieband en de daarbij behorende gebruiksvoorschriften in acht worden genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0015732
    url: https://wetten.overheid.nl/BWBR0015732/2006-11-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015732
  - number: 2.1.h
    text: |-
      mobiele UHF radiozendapparaten, werkend in de frequentieband 446 MHz, bedoeld voor algemeen gebruik ten behoeve
      van spraak over korte afstand (PMR 446), mits de in [bijlage 4][ref1] aangegeven frequentiebanden en de daarbij
      behorende gebruiksvoorschriften in acht worden genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0015732
    url: https://wetten.overheid.nl/BWBR0015732/2006-11-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015732
  - number: 2.1.i
    text: |-
      randapparaten, zijnde satellietgrondstations, mits de in [bijlage 5][ref1] aangegeven frequentiebanden en de
      daarbij behorende gebruiksvoorschriften in acht worden genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0015732
    url: https://wetten.overheid.nl/BWBR0015732/2006-11-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015732
  - number: 2.1.j
    text: |-
      randapparaten voor mobiele communicatie via ionisatiesporen van meteoren, mits de in [bijlage 6][ref1] aangegeven
      frequentieband en de daarbij behorende gebruiksvoorschriften in acht worden genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0015732
    url: https://wetten.overheid.nl/BWBR0015732/2006-11-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015732
  - number: 2.1.k
    text: |-
      de in [bijlage 7][ref1] bedoelde categorieën radiozendapparaten, mits de in [die bijlage][ref2] aangegeven
      frequentiebanden en de daarbij behorende gebruiksvoorschriften in acht worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0015732
      [ref2]: https://wetten.overheid.nl/BWBR0015732
    url: https://wetten.overheid.nl/BWBR0015732/2006-11-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015732
      - id: ref2
        bwb_id: BWBR0015732
  - number: '2.2'
    text: |-
      Onder de aanwijzing, bedoeld in het eerste lid, vallen slechts apparaten die voldoen aan het bij of krachtens het
      [Besluit randapparaten en radioapparaten][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0011261
    url: https://wetten.overheid.nl/BWBR0015732/2006-11-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011261
  - number: '3'
    text: |-
      Deze regeling treedt in werking met ingang van de dag waarop de
      [Regeling aanvraag en toelating vergunningen voor het gebruik van frequentieruimte][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0015731
    url: https://wetten.overheid.nl/BWBR0015732/2006-11-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0015731
  - number: '4'
    text: 'Deze regeling wordt aangehaald als: Regeling gebruik van frequentieruimte zonder vergunning.'
    url: https://wetten.overheid.nl/BWBR0015732/2006-11-22#Artikel4
