        artikel: '10'
  - number: '4.1'
    text: |-
      Ingeval een Markham-winningsvergunning is verleend vóór het tijdstip van inwerkingtreden van deze wet, wordt die
      vergunning door Onze Minister zodanig gewijzigd, dat de daaraan verbonden voorschriften en beperkingen komen te
      voldoen aan [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005766#Artikel3
    url: https://wetten.overheid.nl/BWBR0005766/2003-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005766
        artikel: '3'
  - number: '4.2'
    text: |-
      Overigens kunnen de aan een Markham-winningsvergunning verbonden voorschriften en beperkingen worden gewijzigd
      en kunnen nieuwe voorschriften en beperkingen aan een zodanige vergunning worden verbonden, voor zover dat
      noodzakelijk is ter uitvoering van de artikelen 10, 11, 13, 14, 15, 16, 17, en 19 van de Markham-overeenkomst.
    url: https://wetten.overheid.nl/BWBR0005766/2003-01-01#Artikel4
  - number: '5.1'
    text: |-
      De houders van een Markham-winningsvergunning verlenen de door Onze Minister verlangde medewerking aan de
      totstandkoming van vergunninghoudersovereenkomsten.
    url: https://wetten.overheid.nl/BWBR0005766/2003-01-01#Artikel5
  - number: '5.2'
    text: |-
      Een vergunninghoudersovereenkomst als bedoeld in het eerste lid, alsmede wijzigingen daarin, treden in werking na
      goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005766/2003-01-01#Artikel5
  - number: '5.3'
    text: |-
      Onze Minister kan van de houders van een Markham-winningsvergunning verlangen dat zij zich op de door Onze Minister
      vast te stellen voorwaarden ten behoeve van de Nederlandse Staat verbinden tot de nakoming door partijen van het
      bepaalde in een vergunninghoudersovereenkomst.
    url: https://wetten.overheid.nl/BWBR0005766/2003-01-01#Artikel5
  - number: '5.4'
    text: |-
      Indien een vergunninghouder niet de in het eerste of derde lid verlangde medewerking verleent, dan wel
      een vergunninghoudersovereenkomst niet naleeft, kan Onze Minister overgaan tot intrekking van de Markham-
      winningsvergunning. Van de beschikking tot intrekking wordt mededeling gedaan in de Staatscourant.
      [Artikel 142 van de Mijnbouwwet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel142
    url: https://wetten.overheid.nl/BWBR0005766/2003-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '142'
  - number: '7.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0005766/2003-01-01#Artikel7
  - number: '7.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0005766/2003-01-01#Artikel7
  - number: '7.3'
    text: |-
      Onze Minister is bevoegd tot toepassing van bestuursdwang ter handhaving van
      [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1], voor zover het betreft het verlenen van
      medewerking aan een krachtens het eerste lid aangewezen ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005766/2003-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '9'
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0005766/2003-01-01#Artikel9
  - number: '10'
    text: 'Deze wet kan worden aangehaald als: Wet goedkeuring en uitvoering Markham-overeenkomst.'
    url: https://wetten.overheid.nl/BWBR0005766/2003-01-01#Artikel10
