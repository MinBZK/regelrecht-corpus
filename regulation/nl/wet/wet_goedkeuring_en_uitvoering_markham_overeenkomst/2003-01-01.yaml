preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de op 26 mei 1992 te 's-Gravenhage tot stand gekomen Overeenkomst
    tussen het Koninkrijk der Nederlanden en het Verenigd Koninkrijk van Groot-Brittannië en Noord-Ierland inzake
    de exploitatie van de voorkomens in het Markhamveld en de afname van bitumina daaruit (Trb. 1992, 99) ingevolge
    artikel 91, eerste lid, van de Grondwet de goedkeuring van de Staten-Generaal behoeft, alvorens het Koninkrijk
    daaraan kan worden gebonden, en dat ter uitvoering van deze Overeenkomst enige wettelijke voorzieningen moeten
    worden getroffen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005766/2003-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De op 26 mei 1992 te 's-Gravenhage tot stand gekomen Overeenkomst tussen het Koninkrijk der Nederlanden en
      het Verenigd Koninkrijk van Groot-Brittannië en Noord-Ierland inzake de exploitatie van de voorkomens in het
      Markhamveld en de afname van bitumina daaruit, met twee bijlagen, waarvan de Nederlandse en de Engelse tekst zijn
      geplaatst in *Tractatenblad* 1992, 99, wordt goedgekeurd voor Nederland.
    url: https://wetten.overheid.nl/BWBR0005766/2003-01-01#Artikel1
  - number: '2'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: **Markham-overeenkomst**: de op 26 mei
      1992 te 's-Gravenhage tot stand gekomen Overeenkomst tussen het Koninkrijk der Nederlanden en het Verenigd
      Koninkrijk van Groot-Brittannië en Noord-Ierland inzake de exploitatie van de voorkomens in het Markhamveld
      en de afname van bitumina daaruit; **voorkomens in het Markhamveld**: hetgeen daaronder wordt verstaan in de
      Markham-overeenkomst; **het Markham-gebied**: hetgeen daaronder wordt verstaan in de Markham-overeenkomst;
      **Markham-winningsvergunning**: een winningsvergunning als bedoeld in [artikel 1 van de Mijnbouwwet][ref1], met
      gebruikmaking waarvan aardolie en aardgas kan worden gewonnen uit een of meer voorkomens in het Markhamveld;
      **vergunninghoudersovereenkomst**: een overeenkomst als bedoeld in artikel 3 van de Markham-overeenkomst, gesloten
      tussen de houders van de Markham-winningsvergunning en de overige winners van delfstoffen uit de voorkomens in het
      Markham-veld; **Minister**: De Minister van Economische Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel1
    url: https://wetten.overheid.nl/BWBR0005766/2003-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '1'
  - number: '3.1'
    text: |-
      Met betrekking tot een Markham-winningsvergunning wordt in zoverre afgeweken van het bij en krachtens de paragrafen
      5.1.4 en 5.1.5 en [afdeling 5.6 van de Mijnbouwwet][ref1] bepaalde dat, voorzover het betreft het winnen van
      aardolie of aardgas uit voorkomens in het Markham-veld:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Afdeling5.6
    url: https://wetten.overheid.nl/BWBR0005766/2003-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0014168
        afdeling: '5.6'
  - number: 3.1.a
    text: |-
      de vergunninghouder jaarlijks aan de Staat een bedrag als bedoeld in
      [artikel 65, eerste lid, van de Mijnbouwwet][ref1] (cijns) is verschuldigd dat wordt bepaald op de in
      paragraaf 5.1.4 van die wet voorgeschreven wijze, met dien verstande dat niet wordt geheven over de in
      [artikel 66, tweede lid, van die wet][ref2] bedoelde omzet, maar over de omzet, waartoe de vergunninghouder
      ingevolge de vergunninghoudersovereenkomst gerechtigd is;


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel66
    url: https://wetten.overheid.nl/BWBR0005766/2003-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '65'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '66'
  - number: 3.1.b
    text: |-
      de vergunninghouder jaarlijks aan de Staat een bedrag is verschuldigd, berekend naar de met de winning behaalde
      winst, dat wordt bepaald op de wijze zoals voorgeschreven in paragraaf 5.1.5 van de Mijnbouwwet, met dien verstande
      dat voor de bepaling van het door de vergunninghouder verschuldigde bedrag niet wordt uitgegaan van de opbrengsten
      van krachtens de Markham-winningsvergunning gewonnen delfstoffen, maar van de opbrengsten van de uit de voorkomens
      in het Markhamveld gewonnen delfstoffen, waartoe de vergunninghouder ingevolge de vergunninghoudersovereenkomst
      gerechtigd is;
    url: https://wetten.overheid.nl/BWBR0005766/2003-01-01#Artikel3
  - number: 3.1.c
    text: |-
      voor de bepaling van het door de vergunninghouder verschuldigde bedrag, berekend naar de met de winning behaalde
      winst, kosten van het winnen en afleveren van delfstoffen, slechts in aanmerking worden genomen, voor zover zij
      kunnen worden toegerekend aan het deel van de uit de voorkomens van het Markhamveld gewonnen delfstoffen, waartoe
      de vergunninghouder ingevolge de vergunninghoudersovereenkomst gerechtigd is.
    url: https://wetten.overheid.nl/BWBR0005766/2003-01-01#Artikel3
  - number: '3.2'
    text: |-
      Met betrekking tot hetgeen ingevolge het eerste lid verschuldigd is, is [afdeling 5.4 van de Mijnbouwwet][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Afdeling5.4
    url: https://wetten.overheid.nl/BWBR0005766/2003-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0014168
        afdeling: '5.4'
  - number: '3.3'
    text: |-
      Aan een Markham-winningsvergunning worden voorts, voor zover het betreft de winning van aardolie of aardgas uit
      voorkomens in het Markham-veld, in aanvulling op het bij en krachtens de Mijnbouwwet bepaalde de beperkingen
      en voorschriften verbonden die noodzakelijk zijn ter uitvoering van de [artikelen 3][ref1], [4][ref2],
      [5, eerste, derde, vierde, vijfde en zesde lid][ref3], [6, eerste, tweede, derde en zesde lid][ref4], [7][ref5],
      [8, eerste lid][ref6], [10, tweede lid][ref7], 11, eerste, tweede en derde lid, 14, vierde lid, 16, eerste tot en
      met vierde en zevende lid, 20, tweede en derde lid, en 21 derde tot en met vijfde lid, van de Markham-overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0005766#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005766#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005766#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005766#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0005766#Artikel7
      [ref6]: https://wetten.overheid.nl/BWBR0005766#Artikel8
      [ref7]: https://wetten.overheid.nl/BWBR0005766#Artikel10
    url: https://wetten.overheid.nl/BWBR0005766/2003-01-01#Artikel3
