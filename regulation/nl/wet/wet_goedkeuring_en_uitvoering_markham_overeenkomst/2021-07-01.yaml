preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de op 26 mei 1992 te 's-Gravenhage tot stand gekomen Overeenkomst
    tussen het Koninkrijk der Nederlanden en het Verenigd Koninkrijk van Groot-Brittannië en Noord-Ierland inzake
    de exploitatie van de voorkomens in het Markhamveld en de afname van bitumina daaruit (Trb. 1992, 99) ingevolge
    artikel 91, eerste lid, van de Grondwet de goedkeuring van de Staten-Generaal behoeft, alvorens het Koninkrijk
    daaraan kan worden gebonden, en dat ter uitvoering van deze Overeenkomst enige wettelijke voorzieningen moeten
    worden getroffen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005766/2021-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De op 26 mei 1992 te 's-Gravenhage tot stand gekomen Overeenkomst tussen het Koninkrijk der Nederlanden en
      het Verenigd Koninkrijk van Groot-Brittannië en Noord-Ierland inzake de exploitatie van de voorkomens in het
      Markhamveld en de afname van bitumina daaruit, met twee bijlagen, waarvan de Nederlandse en de Engelse tekst zijn
      geplaatst in *Tractatenblad* 1992, 99, wordt goedgekeurd voor Nederland.
    url: https://wetten.overheid.nl/BWBR0005766/2021-07-01#Artikel1
  - number: '2'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: **Markham-overeenkomst**: de op 26 mei
      1992 te 's-Gravenhage tot stand gekomen Overeenkomst tussen het Koninkrijk der Nederlanden en het Verenigd
      Koninkrijk van Groot-Brittannië en Noord-Ierland inzake de exploitatie van de voorkomens in het Markhamveld
      en de afname van bitumina daaruit; **voorkomens in het Markhamveld**: hetgeen daaronder wordt verstaan in de
      Markham-overeenkomst; **het Markham-gebied**: hetgeen daaronder wordt verstaan in de Markham-overeenkomst;
      **Markham-winningsvergunning**: een winningsvergunning als bedoeld in [artikel 1 van de Mijnbouwwet][ref1], met
      gebruikmaking waarvan aardolie en aardgas kan worden gewonnen uit een of meer voorkomens in het Markhamveld;
      **vergunninghoudersovereenkomst**: een overeenkomst als bedoeld in artikel 3 van de Markham-overeenkomst, gesloten
      tussen de houders van de Markham-winningsvergunning en de overige winners van delfstoffen uit de voorkomens in het
      Markham-veld; **Onze Minister**: Onze Minister van Economische Zaken en Klimaat.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel1
    url: https://wetten.overheid.nl/BWBR0005766/2021-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '1'
  - number: '3.1'
    text: |-
      Met betrekking tot een Markham-winningsvergunning wordt in zoverre afgeweken van het bij en krachtens de
      [paragrafen 5.1.1.3][ref1] en [5.1.1.4 van de Mijnbouwwet][ref2] bepaalde dat, voorzover het betreft het winnen van
      aardolie of aardgas uit voorkomens in het Markham-veld:


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Paragraaf5.1.1.3
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Paragraaf5.1.1.4
    url: https://wetten.overheid.nl/BWBR0005766/2021-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0014168
        paragraaf: 5.1.1.3
      - id: ref2
        bwb_id: BWBR0014168
        paragraaf: 5.1.1.4
  - number: 3.1.a
    text: |-
      de vergunninghouder jaarlijks aan de Staat een afdracht als bedoeld in [artikel 60 van de Mijnbouwwet][ref1] is
      verschuldigd dat wordt bepaald op de in [paragraaf 5.1.1.3 van die wet][ref2] voorgeschreven wijze, met dien
      verstande dat niet wordt geheven over de in [artikel 62, tweede lid, van die wet][ref3] bedoelde omzet, maar over
      de omzet, waartoe de vergunninghouder ingevolge de vergunninghoudersovereenkomst gerechtigd is;


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Paragraaf5.1.1.3
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel62
    url: https://wetten.overheid.nl/BWBR0005766/2021-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '60'
      - id: ref2
        bwb_id: BWBR0014168
        paragraaf: 5.1.1.3
      - id: ref3
        bwb_id: BWBR0014168
        artikel: '62'
  - number: 3.1.b
    text: |-
      de vergunninghouder jaarlijks aan de Staat een bedrag is verschuldigd, berekend naar de met de winning behaalde
      winst, dat wordt bepaald op de wijze zoals voorgeschreven in [paragraaf 5.1.1.4 van de Mijnbouwwet][ref1], met
      dien verstande dat voor de bepaling van het door de vergunninghouder verschuldigde bedrag niet wordt uitgegaan
      van de opbrengsten van krachtens de Markham-winningsvergunning gewonnen delfstoffen, maar van de opbrengsten
      van de uit de voorkomens in het Markhamveld gewonnen delfstoffen, waartoe de vergunninghouder ingevolge de
      vergunninghoudersovereenkomst gerechtigd is;


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Paragraaf5.1.1.4
    url: https://wetten.overheid.nl/BWBR0005766/2021-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0014168
        paragraaf: 5.1.1.4
  - number: 3.1.c
    text: |-
      voor de bepaling van het door de vergunninghouder verschuldigde bedrag, berekend naar de met de winning behaalde
      winst, kosten van het winnen en afleveren van delfstoffen, slechts in aanmerking worden genomen, voor zover zij
      kunnen worden toegerekend aan het deel van de uit de voorkomens van het Markhamveld gewonnen delfstoffen, waartoe
      de vergunninghouder ingevolge de vergunninghoudersovereenkomst gerechtigd is.
    url: https://wetten.overheid.nl/BWBR0005766/2021-07-01#Artikel3
  - number: '3.2'
    text: |-
      Met betrekking tot hetgeen ingevolge het eerste lid verschuldigd is, is
      [paragraaf 5.1.1.5 van de Mijnbouwwet][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Paragraaf5.1.1.5
    url: https://wetten.overheid.nl/BWBR0005766/2021-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0014168
        paragraaf: 5.1.1.5
  - number: '3.3'
    text: |-
      Aan een Markham-winningsvergunning worden voorts, voor zover het betreft de winning van aardolie of aardgas
      uit voorkomens in het Markham-veld, in aanvulling op het bij en krachtens de [Mijnbouwwet][ref1] bepaalde de
      beperkingen en voorschriften verbonden die noodzakelijk zijn ter uitvoering van de artikelen 3, 4, 5, eerste,
      derde, vierde, vijfde en zesde lid, 6, eerste, tweede, derde en zesde lid, 7, 8, eerste lid, 10, tweede lid, 11,
      eerste, tweede en derde lid, 14, vierde lid, 16, eerste tot en met vierde en zevende lid, 20, tweede en derde lid,
      en 21 derde tot en met vijfde lid, van de Markham-overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0014168
    url: https://wetten.overheid.nl/BWBR0005766/2021-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0014168
  - number: '4.1'
    text: |-
      Ingeval een Markham-winningsvergunning is verleend vóór het tijdstip van inwerkingtreden van deze wet, wordt die
      vergunning door Onze Minister zodanig gewijzigd, dat de daaraan verbonden voorschriften en beperkingen komen te
      voldoen aan [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005766#Artikel3
    url: https://wetten.overheid.nl/BWBR0005766/2021-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005766
        artikel: '3'
  - number: '4.2'
    text: |-
      Overigens kunnen de aan een Markham-winningsvergunning verbonden voorschriften en beperkingen worden gewijzigd
      en kunnen nieuwe voorschriften en beperkingen aan een zodanige vergunning worden verbonden, voor zover dat
      noodzakelijk is ter uitvoering van de artikelen 10, 11, 13, 14, 15, 16, 17, en 19 van de Markham-overeenkomst of
      EU-regelgeving.
    url: https://wetten.overheid.nl/BWBR0005766/2021-07-01#Artikel4
  - number: '5.1'
    text: |-
      De houders van een Markham-winningsvergunning verlenen de door Onze Minister verlangde medewerking aan de
      totstandkoming van vergunninghoudersovereenkomsten.
    url: https://wetten.overheid.nl/BWBR0005766/2021-07-01#Artikel5
  - number: '5.2'
    text: |-
      Een vergunninghoudersovereenkomst als bedoeld in het eerste lid, alsmede wijzigingen daarin, treden in werking na
      goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005766/2021-07-01#Artikel5
  - number: '5.3'
    text: |-
      Onze Minister kan van de houders van een Markham-winningsvergunning verlangen dat zij zich op de door Onze Minister
      vast te stellen voorwaarden ten behoeve van de Nederlandse Staat verbinden tot de nakoming door partijen van het
      bepaalde in een vergunninghoudersovereenkomst.
    url: https://wetten.overheid.nl/BWBR0005766/2021-07-01#Artikel5
  - number: '5.4'
    text: |-
      Indien een vergunninghouder niet de in het eerste of derde lid verlangde medewerking verleent, dan wel
      een vergunninghoudersovereenkomst niet naleeft, kan Onze Minister overgaan tot intrekking van de Markham-
      winningsvergunning. Van de beschikking tot intrekking wordt mededeling gedaan in de Staatscourant.
      [Artikel 142 van de Mijnbouwwet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel142
    url: https://wetten.overheid.nl/BWBR0005766/2021-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '142'
  - number: '7.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0005766/2021-07-01#Artikel7
  - number: '7.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0005766/2021-07-01#Artikel7
  - number: '9'
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0005766/2021-07-01#Artikel9
  - number: '10'
    text: 'Deze wet kan worden aangehaald als: Wet goedkeuring en uitvoering Markham-overeenkomst.'
    url: https://wetten.overheid.nl/BWBR0005766/2021-07-01#Artikel10
