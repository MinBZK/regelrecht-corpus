  - number: '2'
    text: |-
      1 In de bij dit besluit behorende [bijlage 1][ref1] worden de plaatsen van vestiging en de
      werkgebieden van de Centra voor werk en inkomen vastgesteld, waarin de taken, bedoeld in
      [artikel 21, onderdelen a tot en met g en i,][ref2] worden uitgevoerd.

      2 In de bij dit besluit behorende [bijlagen 2][ref3] en [3][ref4] worden de plaatsen van vestiging en de
      werkgebieden van de vestigingen en districten van de afdeling Arbeidsjuridische dienstverlening vastgesteld, waarin
      de taken, bedoeld in [artikel 21, onderdeel h][ref5], worden uitgevoerd.

      3 In de bij dit besluit behorende [bijlage 3][ref6] worden de plaatsen van vestiging en werkgebieden van de Centra
      voor werk en inkomen vastgesteld, waarin de taken, bedoeld in [artikel 21a van de wet][ref7] worden uitgevoerd.


