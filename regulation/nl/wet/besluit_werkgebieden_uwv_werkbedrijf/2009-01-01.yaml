preamble:
  text: |-
    Gelet op artikel 24 van de Wet structuur uitvoeringsorganisatie werk en inkomen;

    Gezien de goedkeuring van de minister van Sociale Zaken en Werkgelegenheid,

    Besluit:
  url: https://wetten.overheid.nl/BWBR0013498/2009-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0013498/2009-01-01#Artikel1
  - number: 1.a
    text: |-
      de wet: de [Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060
    url: https://wetten.overheid.nl/BWBR0013498/2009-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013060
  - number: 1.b
    text: |-
      de Uitvoeringsinstituut werknemersverzekeringen: de Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 4 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0013498/2009-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '4'
  - number: 1.c
    text: |-
      Centrum voor werk en inkomen: een vestiging van de Uitvoeringsinstituut werknemersverzekeringen als bedoeld in
      [artikel 24 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel24
    url: https://wetten.overheid.nl/BWBR0013498/2009-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '24'
  - number: 1.d
    text: 'vestiging: een vestiging van de afdeling Arbeidsjuridische dienstverlening;'
    url: https://wetten.overheid.nl/BWBR0013498/2009-01-01#Artikel1
  - number: 1.e
    text: 'district: een regio die wordt bediend door meerdere vestigingen van de afdeling Arbeidsjuridische dienstverlening.'
    url: https://wetten.overheid.nl/BWBR0013498/2009-01-01#Artikel1
  - number: '2.1'
    text: |-
      In de bij dit besluit behorende [bijlage 1][ref1] worden de plaatsen van vestiging en de werkgebieden van de Centra
      voor werk en inkomen vastgesteld, waarin de taken, bedoeld in [artikel 21, onderdelen a tot en met g en i,][ref2]
      worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0013498
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel21
    url: https://wetten.overheid.nl/BWBR0013498/2009-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0013498
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '21'
  - number: '2.2'
    text: |-
      In de bij dit besluit behorende [bijlagen 2][ref1] en [3][ref2] worden de plaatsen van vestiging en de
      werkgebieden van de vestigingen en districten van de afdeling Arbeidsjuridische dienstverlening vastgesteld, waarin
      de taken, bedoeld in [artikel 21, onderdeel h][ref3], worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0013498
      [ref2]: https://wetten.overheid.nl/BWBR0013498
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel21
    url: https://wetten.overheid.nl/BWBR0013498/2009-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0013498
      - id: ref2
        bwb_id: BWBR0013498
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '21'
  - number: '2.3'
    text: |-
      In de bij dit besluit behorende [bijlage 3][ref1] worden de plaatsen van vestiging en werkgebieden van de Centra
      voor werk en inkomen vastgesteld, waarin de taken, bedoeld in [artikel 21a van de wet][ref2] worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0013498
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel21a
    url: https://wetten.overheid.nl/BWBR0013498/2009-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0013498
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 21a
  - number: '3.1'
    text: |-
      Verzoeken voor het verlenen van toestemming voor de opzegging van de arbeidsverhouding op grond van
      [artikel 6 van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref1] worden ingediend bij, en worden
      voorbereid op de bij dit besluit behorende [bijlage 2][ref2] vastgestelde vestigingen, voor de daarbij aangegeven
      werkgebieden.


      [ref1]: https://wetten.overheid.nl/BWBR0002014#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0013498
    url: https://wetten.overheid.nl/BWBR0013498/2009-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002014
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0013498
  - number: '3.2'
    text: |-
      De beslissing op een verzoek als bedoeld in het eerste lid wordt genomen op de vestiging binnen het werkgebied
      waarin de betrokken werknemer zijn arbeid verricht of heeft verricht.
    url: https://wetten.overheid.nl/BWBR0013498/2009-01-01#Artikel3
  - number: '3.3'
    text: |-
      Als de werkzaamheden van de betrokken werknemer zich uitstrekken over een werkgebied van twee of meer vestigingen,
      wordt de beslissing genomen op de vestiging binnen het werkgebied waarin de standplaats van de betrokken werknemer
      is gevestigd of, bij het ontbreken van een standplaats, waarin de vestiging van de werkgever is gelegen van waaruit
      het verzoek is ingediend.
    url: https://wetten.overheid.nl/BWBR0013498/2009-01-01#Artikel3
  - number: '3.4'
    text: |-
      Indien op basis van het tweede en derde lid geen uitsluitsel bestaat over de vraag op welke vestiging de beslissing
      moet worden genomen, geldt dat de beslissing wordt genomen op de vestiging binnen het werkgebied waarin de
      woonplaats van de betrokken werknemer is gelegen.
    url: https://wetten.overheid.nl/BWBR0013498/2009-01-01#Artikel3
  - number: '3.5'
    text: |-
      Indien een werkgever om bedrijfseconomische redenen de arbeidsverhouding met meer werknemers wenst op te zeggen en
      de toepassing van het bepaalde in het eerste tot en met vierde lid, er in resulteert dat op meer dan een vestiging
      binnen een district een beslissing moet worden genomen, kan de beslissing worden genomen op de vestiging van het
      districtshoofd AJD.
    url: https://wetten.overheid.nl/BWBR0013498/2009-01-01#Artikel3
  - number: '3.6'
    text: |-
      Indien de beslissing zou moeten worden genomen binnen meer districten, wordt de beslissing genomen op de vestiging
      van het districtshoofd AJD, waarin de vestiging van de werkgever is gelegen die de meeste individuele aanvragen
      indient, met dien verstande dat, als binnen drie of meer districten een beslissing zou moeten worden genomen, de
      beslissing wordt genomen op een door de Uitvoeringsinstituut werknemersverzekeringen aan te wijzen locatie, het
      hoofdkantoor van de afdeling Juridische Zaken daaronder begrepen.
    url: https://wetten.overheid.nl/BWBR0013498/2009-01-01#Artikel3
  - number: '3.7'
    text: |-
      In bijzondere omstandigheden kan de manager AJD besluiten dat de beslissing als bedoeld in dit artikel wordt
      genomen door het Hoofd Juridische Zaken van een ander district dan die volgens dit artikel bevoegd zou zijn.
    url: https://wetten.overheid.nl/BWBR0013498/2009-01-01#Artikel3
  - number: '4.1'
    text: |-
      De beslissing op een aanvraag voor afgifte van de verklaring langdurig werkloze, bedoeld in
      [hoofdstuk IV van de Wet vermindering afdracht loonbelasting en premie voor de volksverzekeringen][ref1] wordt
      genomen op de bij dit besluit behorende [bijlage 2][ref2] vastgestelde vestiging binnen wiens werkgebied de
      langdurig werkloze de arbeid gaat verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0013498
    url: https://wetten.overheid.nl/BWBR0013498/2009-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007746
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0013498
  - number: '4.2'
    text: |-
      Als de werkzaamheden van de langdurig werkloze zich uitstrekken over een werkgebied van twee of meer vestigingen,
      wordt de beslissing genomen op de vestiging binnen het werkgebied waarin de standplaats van de betrokken werknemer
      is gevestigd of, bij het ontbreken van een standplaats, waarin de vestiging van de inhoudingsplichtige is
      gevestigd.
    url: https://wetten.overheid.nl/BWBR0013498/2009-01-01#Artikel4
  - number: '5.1'
    text: |-
      Aanvragen voor tewerkstellingsvergunningen op grond van het
      [Delegatie- en uitvoeringsbesluit Wet arbeid vreemdelingen][ref1] worden ingediend bij de vestiging van de afdeling
      Arbeidsjuridische dienstverlening van de Uitvoeringsinstituut werknemersverzekeringen te Zoetermeer.


      [ref1]: https://wetten.overheid.nl/BWBR0007514
    url: https://wetten.overheid.nl/BWBR0013498/2009-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007514
  - number: '6'
    text: Dit besluit treedt in werking met ingang van de dagtekening van de Staatscourant, waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0013498/2009-01-01#Artikel6
  - number: '7'
    text: 'Dit besluit wordt aangehaald als: Besluit werkgebieden UWV WERKbedrijf.'
    url: https://wetten.overheid.nl/BWBR0013498/2009-01-01#Artikel7
