        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0013498
  - number: '5'
    text: |-
      1 Aanvragen voor tewerkstellingsvergunningen op grond van het
      [Delegatie- en uitvoeringsbesluit Wet arbeid vreemdelingen][ref1] kunnen worden ingediend bij de in
      [bijlage 3][ref2] vastgestelde vestigingen van de afdeling Juridische zaken van de Centrale organisatie werk en
      inkomen, voor de daarbij aangegeven werkgebieden.

      2 In afwijking van het bepaalde in het eerste lid, kan een aanvraag in gevallen waarin de Raad van bestuur besloten
      heeft dat een aanvraag direct centraal kan worden ingediend, worden ingediend bij de vestiging van de afdeling
      Juridische zaken van de Centrale organisatie werk en inkomen te Zoetermeer.

      3 De beslissing op aanvragen als bedoeld in dit artikel wordt in afwijking van [artikel 2][ref3], genomen op de
      vestiging van de afdeling Juridische zaken van de Centrale organisatie werk en inkomen te Zoetermeer. Beslissingen
      op grond van [artikel 4:5 Awb][ref4] kunnen ook worden genomen op de vestigingen als genoemd in [bijlage 3][ref5].


