preamble:
  text: |-
    Gelet op artikel 24 van de Wet structuur uitvoeringsorganisatie werk en inkomen;

    Gezien de goedkeuring van de minister van Sociale Zaken en Werkgelegenheid,

    Besluit:
  url: https://wetten.overheid.nl/BWBR0013498/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. de wet: de [Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];

      b. de Centrale organisatie werk en inkomen: de Centrale organisatie werk en inkomen, genoemd in
      [hoofdstuk 4 van de wet][ref2];

      c. Centrum voor werk en inkomen: een vestiging van de Centrale organisatie werk en inkomen als bedoeld in
      [artikel 24 van de wet][ref3];

      d. vestiging: een vestiging van de afdeling Juridische Zaken;

      e. district: een regio die wordt bediend door meerdere vestigingen van de afdeling Juridische Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0013060
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel24
