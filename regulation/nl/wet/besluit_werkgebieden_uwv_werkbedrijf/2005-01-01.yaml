        artikel: '21'
  - number: '3'
    text: |-
      1 Verzoeken voor het verlenen van toestemming voor de opzegging van de arbeidsverhouding op grond van
      [artikel 6 van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref1] worden ingediend bij, en worden
      voorbereid op de bij dit besluit behorende [bijlage 2][ref2] vastgestelde vestigingen, voor de daarbij aangegeven
      werkgebieden.

      2 De beslissing op een verzoek als bedoeld in het eerste lid wordt genomen op de vestiging binnen het werkgebied
      waarin de betrokken werknemer zijn arbeid verricht of heeft verricht.

      3 Als de werkzaamheden van de betrokken werknemer zich uitstrekken over een werkgebied van twee of meer
      vestigingen, wordt de beslissing genomen op de vestiging binnen het werkgebied waarin de standplaats van de
      betrokken werknemer is gevestigd of, bij het ontbreken van een standplaats, waarin de vestiging van de werkgever is
      gelegen van waaruit het verzoek is ingediend.

      4 Indien op basis van het tweede en derde lid geen uitsluitsel bestaat over de vraag op welke vestiging de
      beslissing moet worden genomen, geldt dat de beslissing wordt genomen op de vestiging binnen het werkgebied waarin
      de woonplaats van de betrokken werknemer is gelegen.

      5 Indien een werkgever om bedrijfseconomische redenen de arbeidsverhouding met meer werknemers wenst op te zeggen
      en de toepassing van het bepaalde in het eerste tot en met vierde lid, er in resulteert dat op meer dan een
      vestiging binnen een district een beslissing moet worden genomen, kan de beslissing worden genomen op de vestiging
      van het Hoofd Juridische Zaken van het district.

      6 Indien de beslissing zou moeten worden genomen binnen meer districten, wordt de beslissing genomen op de
      vestiging van het Hoofd Juridische Zaken van het district, waarin de vestiging van de werkgever is gelegen die de
      meeste individuele aanvragen indient, met dien verstande dat, als binnen drie of meer districten een beslissing
      zou moeten worden genomen, de beslissing wordt genomen op een door de Centrale organisatie werk en inkomen aan te
      wijzen locatie, het hoofdkantoor van de afdeling Juridische Zaken daaronder begrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0002014#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0013498
