  - number: '53.2'
    text: |-
      Ten aanzien van de bevoegdheid, bedoeld in het eerste lid, zijn
      de [artikelen 5:32, tweede tot en met vijfde lid][ref1], en
      [5:33 tot en met 5:35 van de Algemene wet bestuursrecht][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel53
