        artikel: '5'
  - number: '53.3'
    text: Onze Minister kan regels stellen ter zake van de uitoefening van de bevoegdheid, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel53
  - number: '54.1'
    text: |-
      De Autoriteit Financiële Markten kan een bestuurlijke boete opleggen ter zake van een overtreding van een
      voorschrift, gesteld bij of krachtens de [artikelen 5, eerste lid][ref1],[ 6, derde lid][ref2], [14][ref3],
      [15, tweede lid][ref4], [18, tweede en derde lid][ref5], [19][ref6], [20, tweede lid][ref7], [21][ref8],
      [22][ref9], [23][ref10] en [24][ref11] van deze wet en van [artikel 5:20 van de Algemene wet bestuursrecht][ref12].


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0019468#Artikel14
