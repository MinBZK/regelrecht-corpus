preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het met het oog op de waarborging van de publieke functie van de
    accountantsverklaring en de bevordering van het vertrouwen in de financiële markten wenselijk is dat regels worden
    gesteld voor accountantsorganisaties en accountants die wettelijke controles verrichten en dat onafhankelijk
    publiek toezicht wordt gehouden op de naleving van die regels;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt – voor zover niet anders is bepaald – verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel1
  - number: 1.1.a
    text: |-
      accountantsorganisatie: een onderneming of instelling die bedrijfsmatig wettelijke controles verricht, dan wel een
      organisatie waarin zodanige ondernemingen of instellingen met elkaar zijn verbonden;
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel1
  - number: 1.1.b
    text: 'accountantsverklaring: een schriftelijke mededeling inhoudende de uitkomst van een wettelijke controle;'
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel1
  - number: 1.1.c
    text: 'Autoriteit Financiële Markten: de Stichting Autoriteit Financiële Markten;'
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel1
  - number: 1.1.d
    text: |-
      controlecliënt: de onderneming of instelling die aan een accountantsorganisatie opdracht geeft tot een wettelijke
      controle;
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel1
  - number: 1.1.e
    text: |-
      externe accountant: de natuurlijke persoon die werkzaam is bij of verbonden is aan een accountantsorganisatie en
      die verantwoordelijk is voor de uitvoering van een wettelijke controle;
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel1
  - number: 1.1.f
    text: |-
      lidstaat: een staat die lid is van de Europese Unie alsmede een staat, niet zijnde een lidstaat van de Europese
      Unie, die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte;
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel1
  - number: 1.1.g
    text: 'Onze Minister: Onze Minister van Financiën;'
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel1
  - number: 1.1.h
    text: 'organisatie van openbaar belang:'
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel1
  - number: 1.1.h.1°
    text: |-
      een in Nederland gevestigde naamloze vennootschap naar Nederlands recht waarvan effecten zijn genoteerd aan een
      effectenbeurs in de zin van [artikel 1, onderdeel e, van de Wet toezicht effectenverkeer 1995][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel1
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: '1'
  - number: 1.1.h.2°
    text: |-
      een in Nederland gevestigde kredietinstelling als bedoeld in
      [artikel 1, onderdeel a, van de Wet toezicht kredietwezen 1992][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
  - number: 1.1.h.3°
    text: |-
      een in Nederland gevestigde centrale kredietinstelling als bedoeld in
      [artikel 1, onderdeel b, van de Wet toezicht kredietwezen 1992][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
  - number: 1.1.h.4°
    text: |-
      een in Nederland gevestigde verzekeraar als bedoeld in
      [artikel 1, onderdeel h, van de Wet toezicht verzekeringsbedrijf 1993][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel1
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '1'
  - number: 1.1.h.5°
    text: |-
      een onderneming, instelling of openbaar lichaam, behorende tot een van de ingevolge [artikel 2][ref1] aangewezen
      categorieën;


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel2
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '2'
        hoofdstuk: '1'
  - number: 1.1.i
    text: |-
      vrijwillige controle: een niet bij of krachtens de wet verplichte controle van financiële verantwoordingen van
      ondernemingen of instellingen die inhoudelijk overeenkomt met een wettelijke controle;
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel1
  - number: 1.1.j
    text: |-
      wettelijke controle: een controle van een financiële verantwoording van een onderneming of instelling ten behoeve
      van het maatschappelijk verkeer, die verplicht is gesteld bij of krachtens de in de bijlage bij deze wet genoemde
      wettelijke bepalingen.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel1
  - number: '1.2'
    text: De bijlage, bedoeld in het eerste lid, onderdeel j, kan worden gewijzigd bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel1
  - number: '2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden categorieën van ondernemingen, instellingen of openbare
      lichamen aangewezen wier omvang of functie in het maatschappelijk verkeer van zodanige aard is dat een ondeugdelijk
      uitgevoerde wettelijke controle van de financiële verantwoording een aanmerkelijke invloed kan hebben op het
      vertrouwen in de publieke functie van de accountantsverklaring.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel2
  - number: '3'
    text: |-
      Bij algemene maatregel van bestuur, op voordracht van Onze Minister en Onze Minister wie het mede aangaat, kunnen
      vrijwillige controles worden aangewezen waarop deze wet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel3
  - number: '4'
    text: |-
      De voordracht voor een algemene maatregel van bestuur als bedoeld in de [artikelen 1, tweede lid][ref1],
      [2][ref2], [3][ref3], [11, derde lid][ref4],[ 15, tweede lid][ref5], [18, derde lid][ref6],
      [19][ref7],[ 21, tweede lid][ref8], [22][ref9], [25][ref10], [26, tweede en derde lid][ref11], en [28][ref12] wordt
      niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0019468#Artikel3
