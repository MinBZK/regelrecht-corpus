  - number: '5.1'
    text: |-
      Het is verboden een wettelijke controle te verrichten zonder daartoe van de Autoriteit Financiële Markten een
      vergunning te hebben verkregen.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel5
  - number: '5.2'
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel5
  - number: 5.2.a
    text: |-
      gemeenten die accountants in gemeentelijke dienst hebben aangesteld als bedoeld in
      [artikel 213, zevende lid, van de Gemeentewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel213
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '213'
  - number: 5.2.b
    text: |-
      provincies die accountants in provinciale dienst hebben aangesteld als bedoeld in
      [artikel 217, zevende lid, van de Provinciewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel217
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '217'
  - number: 5.2.c
    text: |-
      accountantsdiensten als bedoeld in [artikel 66, eerste lid, van de Comptabiliteitswet 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel66
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '66'
  - number: '6.1'
    text: |-
      De Autoriteit Financiële Markten verleent een vergunning aan een aanvrager die geen accountantsorganisatie als
      bedoeld in [artikel 5, tweede lid][ref1], is, en die heeft aangetoond dat hijzelf en de bij hem werkzame of aan
      hem verbonden externe accountants voldoen aan het bij of krachtens [paragraaf 3.1.2][ref2] en [afdeling 3.2][ref3]
      bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0019468#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '5'
        hoofdstuk: '2'
        afdeling: '2.1'
      - id: ref2
        bwb_id: BWBR0019468
        hoofdstuk: '3'
        paragraaf: 3.1.2
        afdeling: '3.1'
      - id: ref3
        bwb_id: BWBR0019468
        hoofdstuk: '3'
        afdeling: '3.2'
  - number: '6.2'
    text: |-
      Indien de aanvrager voornemens is tevens wettelijke controles te verrichten bij organisaties van openbaar belang,
      toont de aanvrager bovendien aan dat hijzelf en de bij hem werkzame of aan hem verbonden externe accountants
      voldoen aan het bij of krachtens [paragraaf 3.1.3][ref1] bepaalde. Indien is voldaan aan het bepaalde in de vorige
      volzin, vermeldt de Autoriteit Financiële Markten in de vergunning dat deze mede strekt tot het verrichten van
      wettelijke controles bij organisaties van openbaar belang.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0019468
        hoofdstuk: '3'
        paragraaf: 3.1.3
        afdeling: '3.1'
  - number: '6.3'
    text: De Autoriteit Financiële Markten kan aan een vergunning voorschriften verbinden en beperkingen stellen.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel6
  - number: '7'
    text: De vergunning is niet overdraagbaar.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel7
  - number: '8'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld ten aanzien van de wijze waarop de aanvraag
      voor een vergunning wordt ingediend, de gegevens die daarbij worden verstrekt, de bescheiden die daarbij worden
      overgelegd, de voorschriften die aan de vergunning worden verbonden en de beperkingen die aan de vergunning gesteld
      kunnen worden.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel8
  - number: '9'
    text: De vergunning vervalt indien de accountantsorganisatie waaraan de vergunning is verleend ophoudt te bestaan.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel9
  - number: '10'
    text: |-
      De Autoriteit Financiële Markten kan de voorschriften en beperkingen, bedoeld in [artikel 6, derde lid][ref1],
      wijzigen, aanvullen of intrekken, of alsnog voorschriften verbinden of beperkingen stellen aan een vergunning, of
      de vergunning intrekken of beperken:


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel6
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '6'
        hoofdstuk: '2'
        afdeling: '2.1'
  - number: 10.a
    text: op verzoek van de houder;
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel10
  - number: 10.b
    text: |-
      indien de houder naar later blijkt bij de aanvraag onjuiste of onvolledige gegevens heeft verstrekt, en kennis
      omtrent de juiste en volledige gegevens tot een andere beslissing zou hebben geleid;
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel10
  - number: 10.c
    text: |-
      indien de houder omstandigheden of feiten heeft verzwegen op grond waarvan, indien zij zich hadden voorgedaan of
      bekend waren geweest op het tijdstip waarop de vergunning werd verleend, de vergunning zou zijn geweigerd;
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel10
  - number: 10.d
    text: |-
      indien de houder in staat van faillissement is komen te verkeren of surseance van betaling heeft verkregen
      of indien ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is verklaard of
      indien door een rechterlijke beschikking één of meer goederen van de houder onder bewind als bedoeld in de
      [artikelen 380][ref1], [409][ref2] of [431 van Boek 1 van het Burgerlijk Wetboek][ref3] zijn gesteld of indien de
      ondercuratelestelling van de houder is uitgesproken;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel380
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel409
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel431
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '380'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '409'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '431'
  - number: 10.e
    text: |-
      indien zich omstandigheden voordoen of feiten bekend worden welke ertoe leiden of zouden kunnen leiden dat de
      formele of feitelijke zeggenschapsstructuur van de accountantsorganisatie in zodanige mate ondoorzichtig wordt dat
      deze een belemmering zou vormen voor het adequaat uitoefenen van het toezicht op de accountantsorganisatie;
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel10
  - number: 10.f
    text: indien de houder niet meer voldoet aan bij of krachtens deze wet gestelde regels.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel10
  - number: '11.1'
    text: |-
      De Autoriteit Financiële Markten houdt een openbaar register waarin vergunninghoudende accountantsorganisaties
      en externe accountants worden ingeschreven. Een externe accountant wordt ingeschreven op voordracht van de
      accountantsorganisatie waarbij hij werkzaam is of waaraan hij is verbonden en indien hij voldoet aan het bij of
      krachtens [afdeling 3.2][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0019468
        hoofdstuk: '3'
        afdeling: '3.2'
  - number: '11.2'
    text: |-
      De Autoriteit Financiële Markten draagt zorg voor het goed functioneren van het register. Het register vermeldt de
      aan de vergunning van de accountantsorganisatie verbonden voorschriften en de daaraan gestelde beperkingen.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel11
  - number: '11.3'
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel11
  - number: 11.3.a
    text: de inrichting en de werking van het register; en
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel11
  - number: 11.3.b
    text: andere gegevens over de accountantsorganisaties en de externe accountants die in het register worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel11
  - number: '11.4'
    text: |-
      De Autoriteit Financiële Markten haalt de inschrijving van de accountantsorganisatie in het register door zodra de
      vergunning is ingetrokken of vervallen.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel11
  - number: '11.5'
    text: |-
      De Autoriteit Financiële Markten haalt de inschrijving van de externe accountant in het register tijdelijk door
      indien de accountantskamer de maatregel van tijdelijke doorhaling heeft opgelegd.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel11
  - number: '11.6'
    text: 'De Autoriteit Financiële Markten haalt de inschrijving van de externe accountant in het register door:'
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel11
  - number: 11.6.a
    text: indien de vergunning van de accountantsorganisatie is ingetrokken of vervallen;
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel11
  - number: 11.6.b
    text: indien de accountantskamer de maatregel tot doorhaling van de inschrijving heeft opgelegd;
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel11
  - number: 11.6.c
    text: op verzoek van de accountantsorganisatie waarbij de externe accountant werkzaam is of waaraan hij is verbonden;
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel11
  - number: 11.6.d
    text: op verzoek van de externe accountant;
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel11
  - number: 11.6.e
    text: indien de externe accountant is overleden;
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel11
  - number: 11.6.f
    text: |-
      indien de inschrijving van de externe accountant als registeraccountant of Accountant-
      Administratieconsulent is doorgehaald in het accountantsregister, bedoeld in
      [artikel 55, eerste lid, van de Wet op de Registeraccountants][ref1], onderscheidenlijk
      [artikel 36, eerste lid, van de Wet op de Accountants-Administratieconsulenten][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel36
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '55'
      - id: ref2
        bwb_id: BWBR0002856
        artikel: '36'
  - number: '12'
    text: |-
      Aan een ieder wordt kosteloos inzage verleend in het register. De Autoriteit Financiële Markten verstrekt aan een
      ieder desgevraagd, tegen betaling van de kostprijs, afschriften uit het register.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel12
  - number: '13'
    text: |-
      De voorschriften in deze afdeling zijn van toepassing op accountantsorganisaties waaraan een vergunning is
      verleend.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel13
  - number: '14'
    text: |-
      De accountantsorganisatie draagt er zorg voor dat de externe accountants die bij haar werkzaam zijn of aan haar
      zijn verbonden voldoen aan het bij of krachtens [afdeling 3.2][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0019468
        hoofdstuk: '3'
        afdeling: '3.2'
  - number: '15.1'
    text: |-
      De betrouwbaarheid van de personen die het dagelijks beleid van de accountantsorganisatie bepalen of mede bepalen
      staat buiten twijfel.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel15
  - number: '15.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld ten aanzien van de betrouwbaarheid van de in
      het eerste lid bedoelde personen.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel15
  - number: '16.1'
    text: |-
      De personen die het dagelijks beleid van de accountantsorganisatie bepalen zijn deskundig ten aanzien van het
      stelsel van kwaliteitsbeheersing van de accountantsorganisatie.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel16
  - number: '16.2'
    text: |-
      De meerderheid van de personen die het dagelijks beleid bepalen van de accountantsorganisatie voldoet aan
      de krachtens [artikel 25][ref1] te stellen regels inzake vakbekwaamheid van externe accountants. Indien de
      accountantsorganisatie twee dagelijks beleidsbepalers heeft, voldoet tenminste een van deze personen aan deze
      regels.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel25
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '25'
        hoofdstuk: '3'
        afdeling: '3.2'
  - number: '17'
    text: |-
      De formele of feitelijke zeggenschapsstructuur van de accountantsorganisatie vormt geen belemmering voor
      het adequaat uitoefenen van het toezicht op de naleving van het bij of krachtens deze wet bepaalde door de
      accountantsorganisatie.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel17
  - number: '18.1'
    text: De accountantsorganisatie beschikt over een stelsel van kwaliteitsbeheersing.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel18
  - number: '18.2'
    text: |-
      Het stelsel van kwaliteitsbeheersing is zodanig ingericht dat de werkzaamheden betreffende een wettelijke controle
      te allen tijde plaatsvinden onder de verantwoordelijkheid van een externe accountant.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel18
  - number: '18.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden met het oog op de bevordering van het vertrouwen in
      de financiële markten, de waarborging van het publieke belang van de accountantsverklaring en het toezicht op
      de naleving van de bij of krachtens deze wet gestelde regels, regels gesteld ten aanzien van het stelsel van
      kwaliteitsbeheersing.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel18
  - number: '19'
    text: |-
      De accountantsorganisatie voldoet aan bij of krachtens algemene maatregel van bestuur te stellen regels terzake van
      haar onafhankelijkheid.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel19
  - number: '20'
    text: |-
      Een accountantsorganisatie die bij het verrichten van een wettelijke controle de beschikking krijgt over gegevens
      waarvan zij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, is verplicht tot geheimhouding van
      die gegevens, behoudens voor zover zij bij of krachtens wettelijk voorschrift tot mededeling verplicht is.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel20
  - number: '21.1'
    text: |-
      Een accountantsorganisatie richt de bedrijfsvoering zodanig in dat deze een beheerste en integere uitoefening van
      haar bedrijf waarborgt.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel21
  - number: '21.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het eerste lid. Deze
      regels hebben betrekking op:
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel21
  - number: 21.2.a
    text: het beheersen van bedrijfsprocessen en bedrijfsrisico’s;
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel21
  - number: 21.2.b
    text: 'integriteit, waaronder wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel21
  - number: 21.2.b.1°
    text: het tegengaan van verstrengeling van tegenstrijdige belangen;
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel21
  - number: 21.2.b.2°
    text: |-
      het tegengaan van betrokkenheid van de accountantsorganisatie, de externe accountants of andere medewerkers van de
      accountantsorganisatie bij strafbare feiten en wetsovertredingen die het vertrouwen in de accountantsorganisatie of
      in de financiële markten kunnen schaden;
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel21
  - number: 21.2.b.3°
    text: |-
      het tegengaan van relaties met cliënten die het vertrouwen in de accountantsorganisatie of in de financiële markten
      kunnen schaden;
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel21
  - number: 21.2.c
    text: |-
      het voorkomen dat bij het verrichten van wettelijke controles de onafhankelijkheid in het geding komt van de
      externe accountants of andere medewerkers van de accountantsorganisatie die ten behoeve van die wettelijke
      controles werkzaamheden verrichten;
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel21
  - number: 21.2.d
    text: andere bij algemene maatregel van bestuur te noemen onderwerpen.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel21
  - number: '22'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen, onverminderd [artikel 18][ref1], aanvullende regels worden
      gesteld ten aanzien van het stelsel van kwaliteitsbeheersing van accountantsorganisaties die wettelijke controles
      verrichten bij organisaties van openbaar belang.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel18
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: 3.1.2
        afdeling: '3.1'
  - number: '23'
    text: |-
      De accountantsorganisatie verricht geen wettelijke controle bij een organisatie van openbaar belang, indien zij met
      betrekking tot die organisatie:
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel23
  - number: 23.a
    text: |-
      op enig tijdstip gedurende de daaraan voorafgaande twee jaar de financiële verantwoording waarop de wettelijke
      controle betrekking heeft, heeft samengesteld; of
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel23
  - number: 23.b
    text: |-
      gedurende de periode waarop de financiële verantwoording betrekking heeft of ten tijde van het verrichten
      van de wettelijke controle een aanmerkelijk deel van de financiële administratie heeft verzorgd of ingericht,
      onderscheidenlijk verzorgt of inricht.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel23
  - number: '24.1'
    text: |-
      De accountantsorganisatie doet geen wettelijke controle bij een organisatie van openbaar belang uitvoeren door een
      externe accountant die verantwoordelijk is geweest voor de gedurende de voorafgaande zeven aaneengesloten boekjaren
      bij die organisatie van openbaar belang uitgevoerde wettelijke controles.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel24
  - number: '24.2'
    text: |-
      De accountantsorganisatie draagt ervoor zorg dat een externe accountant die bij een organisatie van openbaar belang
      verantwoordelijk is geweest voor de uitgevoerde wettelijke controles en die zijn werkzaamheden heeft beëindigd,
      gedurende twee aaneengesloten boekjaren geen wettelijke controles uitvoert voor die organisatie van openbaar
      belang.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel24
  - number: '25'
    text: |-
      De externe accountant voldoet aan bij of krachtens algemene maatregel van bestuur te stellen regels terzake van
      zijn vakbekwaamheid, onafhankelijkheid, objectiviteit en integriteit.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel25
  - number: '26.1'
    text: |-
      Een externe accountant die tijdens het verrichten van een wettelijke controle de beschikking krijgt over gegevens
      waarvan hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, is verplicht tot geheimhouding van
      die gegevens, behoudens voor zover hij bij of krachtens wettelijk voorschrift tot mededeling verplicht is.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel26
  - number: '26.2'
    text: |-
      Een externe accountant die tijdens het verrichten van een wettelijke controle de beschikking krijgt over gegevens
      of inlichtingen die het redelijk vermoeden rechtvaardigen dat sprake is van fraude van materieel belang ten
      aanzien van de financiële verantwoording van de controlecliënt, meldt dit aan een opsporingsambtenaar als bedoeld
      in [artikel 141 van het Wetboek van Strafvordering][ref1] behoudens in de bij algemene maatregel van bestuur te
      bepalen gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '26.3'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald wat wordt verstaan onder fraude van materieel belang en worden
      regels gesteld omtrent het tijdstip en de wijze waarop de melding, bedoeld in het tweede lid, plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel26
  - number: '26.4'
    text: |-
      De externe accountant die tot een melding als bedoeld in het tweede lid is overgegaan, is niet aansprakelijk
      voor de schade die een derde dientengevolge lijdt, tenzij aannemelijk wordt gemaakt dat gelet op alle feiten en
      omstandigheden in redelijkheid niet tot melding had mogen worden overgegaan.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel26
  - number: '27'
    text: |-
      De externe accountant is een registeraccountant of een Accountant-Administratieconsulent
      ten aanzien van wie in het accountantsregister een aantekening is geplaatst als bedoeld in
      [artikel 36, derde lid, van de Wet op de Accountants-Administratieconsulenten][ref1] en voldoet aan de bij en
      krachtens de [Wet op de Registeraccountants][ref2] of de [Wet op de Accountants-Administratieconsulenten][ref3]
      gestelde regels, voor zover deze van toepassing zijn op het uitvoeren van werkzaamheden betreffende de
      totstandkoming of de uitvoering van een opdracht tot het verrichten van wettelijke controles.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0002374
      [ref3]: https://wetten.overheid.nl/BWBR0002856
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '36'
      - id: ref2
        bwb_id: BWBR0002374
      - id: ref3
        bwb_id: BWBR0002856
  - number: '28'
    text: |-
      Met het oog op de waarborging van de publieke functie van de accountantsverklaring kan bij algemene maatregel van
      bestuur [artikel 27][ref1] buiten toepassing worden verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel27
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '27'
        hoofdstuk: '3'
        afdeling: '3.2'
  - number: '29'
    text: |-
      De externe accountant geeft de accountantsverklaring af en ondertekent deze op eigen naam en vermeldt daarbij de
      accountantsorganisatie waarbij hij werkzaam is of waaraan hij is verbonden.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel29
  - number: '30'
    text: |-
      Indien de externe accountant met betrekking tot het uitvoeren van werkzaamheden betreffende de totstandkoming
      of de uitvoering van een of meer opdrachten tot het verrichten van wettelijke controles wordt betrokken in een
      tuchtrechtsgeding, meldt hij dit onverwijld aan de betrokken controlecliënten.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel30
  - number: '31.1'
    text: |-
      De externe accountant is aan tuchtrechtspraak onderworpen indien hij bij het uitvoeren van werkzaamheden
      betreffende de totstandkoming of de uitvoering van een opdracht tot het verrichten van wettelijke controles handelt
      of heeft gehandeld in strijd met het bij of krachtens de [artikelen 25][ref1], [27][ref2], [29][ref3] of [30][ref4]
      van deze wet bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0019468#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0019468#Artikel30
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '25'
        hoofdstuk: '3'
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: '27'
        hoofdstuk: '3'
        afdeling: '3.2'
      - id: ref3
        bwb_id: BWBR0019468
        artikel: '29'
        hoofdstuk: '3'
        afdeling: '3.2'
      - id: ref4
        bwb_id: BWBR0019468
        artikel: '30'
        hoofdstuk: '3'
        afdeling: '3.2'
  - number: '31.2'
    text: |-
      Deze tuchtrechtspraak wordt uitgeoefend in eerste aanleg door de accountantskamer te Zwolle en in hoger beroep,
      tevens in hoogste ressort, door het College van Beroep voor het bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel31
  - number: '32.1'
    text: |-
      De Autoriteit Financiële Markten stelt jaarlijks een begroting op van de in het daaropvolgende jaar te verwachten
      baten en lasten, investeringsuitgaven alsmede inkomsten en uitgaven met betrekking tot de uitvoering van de bij en
      krachtens deze wet opgedragen taak en de daaruit voortvloeiende werkzaamheden. De begroting wordt op een zodanige
      wijze opgesteld dat de lasten en de uitgaven structureel worden gedekt door de baten en de inkomsten.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel32
  - number: '32.2'
    text: De begrotingsposten worden van een toelichting voorzien.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel32
  - number: '32.3'
    text: |-
      Tenzij de werkzaamheden waarop de begroting betrekking heeft nog niet eerder werden verricht, bevat de begroting
      een vergelijking met de begroting van het lopende jaar en de laatst goedgekeurde jaarrekening waarmee Onze Minister
      heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel32
  - number: '32.4'
    text: |-
      De Autoriteit Financiële Markten zendt de begroting voor 1 december van het aan het begrotingsjaar voorafgaande
      jaar ter instemming aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel32
  - number: '32.5'
    text: |-
      De instemming kan worden onthouden wegens strijd met het recht of het algemeen belang. Ingeval van gebleken
      strijdigheid wordt instemming niet onthouden dan nadat de Autoriteit Financiële Markten in de gelegenheid is
      gesteld de begroting aan te passen, binnen een door Onze Minister te stellen redelijke termijn.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel32
  - number: '32.6'
    text: |-
      De Autoriteit Financiële Markten doet onverwijld na instemming mededeling van de begroting in de Staatscourant en
      houdt de begroting gedurende een jaar na instemming op elektronische wijze ter inzage.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel32
  - number: '32.7'
    text: |-
      Wanneer Onze Minister niet met de begroting heeft ingestemd vóór 1 januari van het jaar waarop deze betrekking
      heeft, kan de Autoriteit Financiële Markten, in het belang van een juiste uitvoering van haar taak, voor het
      aangaan van verplichtingen en het verrichten van uitgaven beschikken over ten hoogste drie twaalfde gedeelten van
      de bedragen die bij de overeenkomstige onderdelen in de begroting van het voorafgaande jaar waren toegestaan.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel32
  - number: '33'
    text: |-
      Indien gedurende het jaar aanmerkelijke verschillen ontstaan of dreigen te ontstaan tussen de werkelijke en begrote
      baten en lasten dan wel inkomsten en uitgaven, doet de Autoriteit Financiële Markten daarvan onverwijld mededeling
      aan Onze Minister onder vermelding van de oorzaak van de verschillen.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel33
  - number: '34'
    text: Bij ministeriële regeling kunnen regels worden gesteld voor de inrichting van de begroting.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel34
  - number: '35.1'
    text: |-
      De Autoriteit Financiële Markten stelt jaarlijks een jaarrekening op van de bij deze wet opgedragen taak en de
      daaruit voortvloeiende werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel35
  - number: '35.2'
    text: |-
      De jaarrekening van de Autoriteit Financiële Markten, waarin rekening en verantwoording wordt afgelegd van het
      financieel beheer en van de geleverde prestaties over het verstreken boekjaar, wordt ingericht zoveel mogelijk met
      overeenkomstige toepassing van [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: '35.3'
    text: |-
      De jaarrekening gaat vergezeld van een verklaring omtrent de getrouwheid, afgegeven door een door
      de Autoriteit Financiële Markten aangewezen registeraccountant of Accountant-Administratieconsulent
      ten aanzien van wie in het accountantsregister een aantekening is geplaatst als bedoeld in
      [artikel 36, derde lid, van de Wet op de Accountants-Administratieconsulenten][ref1], die niet werkzaam is bij of
      verbonden is aan een accountantsorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel36
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '36'
  - number: '35.4'
    text: |-
      De accountant voegt bij de verklaring, bedoeld in het tweede lid, een verslag van zijn bevindingen omtrent de
      rechtmatige inning en besteding van de middelen door de Autoriteit Financiële Markten uit hoofde van deze wet.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel35
  - number: '35.5'
    text: |-
      De accountant voegt bij de verklaring, bedoeld in het tweede lid, tevens een verslag van zijn bevindingen over
      de vraag of het beheer en de organisatie van de Autoriteit Financiële Markten uit hoofde van deze wet voldoen aan
      eisen van doelmatigheid.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel35
  - number: '35.6'
    text: |-
      De Autoriteit Financiële Markten zendt de jaarrekening voor 1 mei van het op het boekjaar volgende jaar ter
      instemming aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel35
  - number: '35.7'
    text: De instemming kan worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel35
  - number: '35.8'
    text: |-
      De Autoriteit Financiële Markten doet onverwijld na instemming mededeling van de jaarrekening in de Staatscourant
      en houdt de jaarrekening gedurende een jaar na instemming op elektronische wijze ter inzage.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel35
  - number: '36.1'
    text: |-
      Het verschil tussen de aan het eind van een begrotingsjaar gerealiseerde baten van de Autoriteit Financiële Markten
      en de gerealiseerde lasten van de Autoriteit Financiële Markten vormt het exploitatiesaldo.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel36
  - number: '36.2'
    text: |-
      Indien in enig boekjaar een exploitatiesaldo ontstaat en de Autoriteit Financiële Markten dit exploitatiesaldo
      wil betrekken bij de in rekening te brengen kosten als bedoeld in [artikel 38][ref1] doet de Autoriteit Financiële
      Markten daaromtrent een voorstel in de jaarrekening.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel38
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '38'
        hoofdstuk: '4'
  - number: '37.1'
    text: |-
      De Autoriteit Financiële Markten stelt jaarlijks een jaarverslag op. Het jaarverslag beschrijft de taakuitoefening
      en het daartoe gevoerde beleid uit hoofde van deze wet in het voorafgaande jaar. Het jaarverslag beschrijft voorts
      het gevoerde beleid met betrekking tot de kwaliteitszorg.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel37
  - number: '37.2'
    text: |-
      De Autoriteit Financiële Markten zendt het jaarverslag voor 1 mei aan Onze Minister. Onze Minister zendt een
      afschrift van het jaarverslag aan de Tweede Kamer der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel37
  - number: '37.3'
    text: De Autoriteit Financiële Markten houdt het jaarverslag op elektronische wijze ter inzage.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel37
  - number: '38.1'
    text: |-
      De Autoriteit Financiële Markten legt een voorgenomen statutenwijziging ter voorafgaande instemming voor aan Onze
      Minister. De [artikelen 10:28 tot en met 10:31 van de Algemene wet bestuursrecht][ref1] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: '38.2'
    text: 'De instemming, bedoeld in het eerste lid, kan worden geweigerd:'
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel38
  - number: 38.2.a
    text: indien de statuten na wijziging onvoldoende zijn afgestemd op het in deze wet bepaalde;
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel38
  - number: 38.2.b
    text: |-
      indien de statuten onvoldoende waarborgen bieden voor een onafhankelijke taakvervulling door de Autoriteit
      Financiële Markten;
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel38
  - number: 38.2.c
    text: wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel38
  - number: '39.1'
    text: |-
      De Autoriteit Financiële Markten draagt met betrekking tot de uitoefening van haar taak op grond van deze wet zorg
      voor:
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel39
  - number: 39.1.a
    text: een tijdige voorbereiding en uitvoering;
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel39
  - number: 39.1.b
    text: de kwaliteit van de daarbij gebruikte procedures;
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel39
  - number: 39.1.c
    text: de zorgvuldige behandeling van een ieder die met haar in aanraking komt;
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel39
  - number: 39.1.d
    text: de zorgvuldige behandeling van bezwaarschriften en klachten die worden ontvangen.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel39
  - number: '39.2'
    text: |-
      De Autoriteit Financiële Markten treft voorzieningen, waardoor ieder die met haar in aanraking komt in de
      gelegenheid is voorstellen tot verbetering van werkwijzen en procedures te doen.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel39
  - number: '39.3'
    text: |-
      In het jaarverslag, bedoeld in [artikel 37][ref1], doet de Autoriteit Financiële Markten verslag van hetgeen tot
      uitvoering van het eerste en het tweede lid is verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel37
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '37'
        hoofdstuk: '4'
  - number: '40.1'
    text: 'De Autoriteit Financiële Markten stelt een orgaan in voor overleg over:'
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel40
  - number: 40.1.a
    text: de door de Autoriteit Financiële Markten op te stellen begroting;
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel40
  - number: 40.1.b
    text: |-
      de door de Autoriteit Financiële Markten gerealiseerde baten en lasten alsmede inkomsten en uitgaven, en verrichte
      werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel40
  - number: 40.1.c
    text: |-
      de kosten voor accountantsorganisaties die verband houden met de uitoefening van haar taak op grond van deze wet en
      daaruit voortvloeiende werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel40
  - number: '40.2'
    text: |-
      Het overleg wordt gevoerd door de Autoriteit Financiële Markten en een representatieve vertegenwoordiging van
      onder haar toezicht staande accountantsorganisaties of representatieve organisaties, waaronder het Nederlands
      Instituut van Registeraccountants, bedoeld in [artikel 1, eerste lid, van de Wet op de Registeraccountants][ref1],
      en de Nederlandse Orde van Accountants-Administratieconsulenten, bedoeld in
      [artikel 2 van de Wet op de Accountants-Administratieconsulenten][ref2]. Onze Minister wijst ambtenaren aan die
      namens hem het overleg bijwonen.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel2
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002856
        artikel: '2'
  - number: '40.3'
    text: Het overleg vindt ten minste tweemaal per jaar plaats.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel40
  - number: '40.4'
    text: |-
      De Autoriteit Financiële Markten maakt het verslag van het overleg binnen een redelijke termijn na het overleg
      openbaar.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel40
  - number: '41.1'
    text: |-
      De Autoriteit Financiële Markten brengt jaarlijks de kosten van de werkzaamheden die zij verricht in verband met
      de uitoefening van haar taak op grond van deze wet in rekening bij de accountantsorganisaties ten aanzien waarvan
      die werkzaamheden worden verricht, voor zover deze kosten niet ten laste komen van de Rijksbegroting. Tot de kosten
      behoren onder meer de kosten die zij ter voorbereiding op de uitvoering van haar taak heeft gemaakt, voordat deze
      taak aan haar werd opgedragen.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel41
  - number: '41.2'
    text: |-
      De kosten worden gebaseerd op de begroting waarmee Onze Minister heeft ingestemd en op het exploitatiesaldo,
      indien Onze Minister heeft ingestemd met de jaarrekening waarin een voorstel als bedoeld in
      [artikel 36, tweede lid][ref1], is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel36
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '36'
        hoofdstuk: '4'
  - number: '41.3'
    text: |-
      Op de begrote kosten worden de opbrengsten uit boetes en verbeurde dwangsommen, voor zover de hieraan ten grondslag
      liggende besluiten van de Autoriteit Financiële Markten in het voorafgaande jaar onherroepelijk zijn geworden, in
      mindering gebracht.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel41
  - number: '41.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste
      tot en met derde lid. Deze regels hebben onder meer betrekking op de toerekening van toezichthandelingen aan
      ondernemingen.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel41
  - number: '41.5'
    text: Bij ministeriële regeling worden tarieven vastgesteld inzake individueel toerekenbare toezichthandelingen.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel41
  - number: '42'
    text: |-
      De Autoriteit Financiële Markten verstrekt Onze Minister desgevraagd inlichtingen die nodig zijn voor de
      beoordeling van de uitvoerbaarheid van algemene beleidsvoornemens en voorgenomen wettelijke voorschriften, voor
      zover deze betrekking hebben op het door de Autoriteit Financiële Markten uit te oefenen toezicht ingevolge deze
      wet.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel42
  - number: '43.1'
    text: |-
      Onze Minister kan aan de Autoriteit Financiële Markten de gegevens of inlichtingen vragen die nodig zijn voor een
      onderzoek naar de toereikendheid van deze wet of de wijze waarop de Autoriteit Financiële Markten deze wet uitvoert
      of heeft uitgevoerd, indien dat ter wille van het toezicht nodig blijkt.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel43
  - number: '43.2'
    text: |-
      De Autoriteit Financiële Markten verstrekt aan Onze Minister de in het eerste lid bedoelde
      gegevens of inlichtingen, tenzij het vertrouwelijke gegevens of inlichtingen betreft in de zin van
      [artikel 2:5 van de Algemene wet bestuursrecht][ref1], die betrekking hebben op of herleidbaar zijn tot een
      afzonderlijke onderneming, instelling of natuurlijke persoon, met uitzondering van gegevens of inlichtingen die
      betrekking hebben op of herleidbaar zijn tot een afzonderlijke accountantsorganisatie:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: 43.2.a
    text: |-
      die een vergunning als bedoeld in [artikel 5, eerste lid][ref1], heeft verkregen; en


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel5
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '5'
        hoofdstuk: '2'
        afdeling: '2.1'
  - number: 43.2.b
    text: ten aanzien waarvan surseance van betaling is verleend; of
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel43
  - number: 43.2.c
    text: die in staat van faillissement is verklaard; of
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel43
  - number: 43.2.d
    text: die op grond van een rechterlijke uitspraak is ontbonden.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel43
  - number: '43.3'
    text: |-
      Onze Minister kan een derde opdragen de gegevens of inlichtingen die hem ingevolge het tweede lid zijn verstrekt
      te onderzoeken en aan hem verslag uit te brengen. Tevens kan Onze Minister de derde die in zijn opdracht
      handelt, machtigen namens hem gegevens of inlichtingen in te winnen, in welk geval het eerste en tweede lid van
      overeenkomstige toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel43
  - number: '43.4'
    text: |-
      Onze Minister gebruikt de gegevens of inlichtingen die hij ingevolge het tweede of derde lid heeft verkregen
      uitsluitend voor het vormen van zijn oordeel over de toereikendheid van deze wet of de wijze waarop de Autoriteit
      Financiële Markten deze wet uitvoert of heeft uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel43
  - number: '43.5'
    text: |-
      Onze Minister en degenen die in zijn opdracht handelen zijn verplicht tot geheimhouding van de op grond van het
      tweede lid ontvangen gegevens of inlichtingen.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel43
  - number: '43.6'
    text: |-
      Niettegenstaande het vierde en vijfde lid kan Onze Minister de aan de gegevens of inlichtingen ontleende
      bevindingen en de daaruit getrokken conclusies aan de beide kamers der Staten-Generaal mededelen en de conclusies
      in algemene zin uit het onderzoek openbaar maken.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel43
  - number: '43.7'
    text: |-
      De [Wet openbaarheid van bestuur][ref1] en de [Wet Nationale ombudsman][ref2] zijn niet van toepassing met
      betrekking tot de in dit artikel bedoelde gegevens of inlichtingen die Onze Minister of de in zijn opdracht
      werkende derde onder zich heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
      [ref2]: https://wetten.overheid.nl/BWBR0003372
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0005252
      - id: ref2
        bwb_id: BWBR0003372
  - number: '44.1'
    text: |-
      Indien naar het oordeel van Onze Minister de Autoriteit Financiële Markten haar taak ernstig verwaarloost, kan Onze
      Minister de noodzakelijke voorzieningen treffen.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel44
  - number: '44.2'
    text: |-
      Ter uitvoering van het eerste lid kan Onze Minister besluiten een of meer onderdelen van de taak van de Autoriteit
      Financiële Markten zelf uit te voeren of door een ander bestuursorgaan te laten uitvoeren. Alsdan komen de
      desbetreffende bevoegdheden van de Autoriteit Financiële Markten toe aan Onze Minister onderscheidenlijk het andere
      bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel44
  - number: '44.3'
    text: |-
      De voorzieningen worden, spoedeisende gevallen uitgezonderd, niet eerder getroffen dan nadat de Autoriteit
      Financiële Markten in de gelegenheid is gesteld om binnen een door Onze Minister te stellen termijn alsnog haar
      taak naar behoren uit te voeren.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel44
  - number: '44.4'
    text: |-
      Onze Minister stelt de Tweede Kamer der Staten-Generaal onverwijld in kennis van door hem getroffen voorzieningen
      als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel44
  - number: '45.1'
    text: |-
      Onze Minister zendt vijf jaar na inwerkingtreding van deze wet en vervolgens elke vijf jaar een verslag aan de
      Tweede Kamer der Staten-Generaal over de doeltreffendheid en doelmatigheid van het functioneren van de Autoriteit
      Financiële Markten in het kader van de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel45
  - number: '45.2'
    text: |-
      De Autoriteit Financiële Markten verstrekt desgevraagd aan Onze Minister gegevens en inlichtingen ten behoeve van
      het verslag.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel45
  - number: '46'
    text: |-
      Tegen besluiten van Onze Minister inzake instemming met de begroting of de jaarrekening kan geen beroep worden
      ingesteld, in afwijking van [artikel 8:1 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '47'
    text: |-
      Een meerderheid van de leden van het bestuur van de Autoriteit Financiële Markten die het dagelijks beleid met
      betrekking tot het toezicht op de naleving van deze wet bepalen:
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel47
  - number: 47.a
    text: |-
      is gedurende de drie voorafgaande jaren dat zij het dagelijks beleid bepalen, niet verantwoordelijk geweest voor
      het uitvoeren van wettelijke controles;
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel47
  - number: 47.b
    text: |-
      heeft gedurende de drie voorafgaande jaren geen deel uitgemaakt van de dagelijkse leiding van een
      accountantsorganisatie;
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel47
  - number: 47.c
    text: |-
      heeft gedurende de drie voorafgaande jaren niet als stemgerechtigd lid deel uitgemaakt van het bestuur van een
      accountantsorganisatie; en
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel47
  - number: 47.d
    text: is gedurende de drie voorafgaande jaren niet werkzaam geweest of verbonden aan een accountantsorganisatie.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel47
  - number: '48.1'
    text: |-
      De Autoriteit Financiële Markten houdt bij de uitvoering van het toezicht op de naleving van deze
      wet rekening met de uitkomsten van de beoordeling van de werking van door accountantsorganisaties
      gehanteerde stelsels van kwaliteitsbeheersing door andere organisaties, waaronder de openbare
      lichamen, bedoeld in [artikel 1, eerste lid, van de Wet op de Registeraccountants][ref1], en
      [artikel 2, eerste lid, van de Wet op de Accountants-Administratieconsulenten][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel2
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002856
        artikel: '2'
  - number: '48.2'
    text: Bij of krachtens algemene maatregel van bestuur kunnen terzake van het eerste lid regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel48
  - number: '49.1'
    text: |-
      Met het toezicht op de naleving van de bij en krachtens deze wet gestelde regels zijn belast de bij besluit van de
      Autoriteit Financiële Markten aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel49
  - number: '49.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel49
  - number: '50'
    text: |-
      De personen, bedoeld in het [eerste lid van artikel 44][ref1], beschikken niet over de bevoegdheden, genoemd in de
      [artikelen 5:18][ref2] en [5:19 van de Algemene wet bestuursrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '44'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '51.1'
    text: |-
      De Autoriteit Financiële Markten kan ten behoeve van de juiste uitvoering van haar bij of krachtens deze wet
      geregelde taken en bevoegdheden van een ieder inlichtingen vorderen.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel51
  - number: '51.2'
    text: |-
      De [artikelen 5:13][ref1] en [5:20 van de Algemene wet bestuursrecht][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '52'
    text: |-
      De Autoriteit Financiële Markten kan de accountantsorganisatie waaraan een vergunning is verleend die niet
      voldoet aan hetgeen bij of krachtens deze wet is bepaald, door middel van het geven van een aanwijzing
      verplichten om binnen een door de Autoriteit Financiële Markten gestelde redelijke termijn ten aanzien van in de
      aanwijzingsbeschikking aan te geven punten een bepaalde gedragslijn te volgen.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel52
  - number: '53.1'
    text: |-
      De Autoriteit Financiële Markten kan een last onder dwangsom opleggen ter zake van een overtreding van
      een voorschrift, gesteld bij of krachtens de [artikelen 5, eerste lid][ref1], [6, derde lid][ref2],
      [14][ref3], [15, tweede lid][ref4], [16][ref5], [17][ref6], [18, tweede en derde lid][ref7],
      [19][ref8], [21][ref9],[ 22][ref10], [23][ref11] en [24][ref12] van deze wet en
      [artikel 5:20 van de Algemene wet bestuursrecht][ref13].


