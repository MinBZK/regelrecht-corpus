  - number: '54.2'
    text: De bestuurlijke boete komt toe aan de Autoriteit Financiële Markten.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel54
  - number: '54.3'
    text: |-
      Onze Minister, in overeenstemming met Onze Minister van Justitie, kan regels stellen ter zake van de uitoefening
      van de bevoegdheid, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel54
  - number: '55.1'
    text: |-
      Het bedrag van de bestuurlijke boete wordt bepaald bij algemene maatregel van bestuur, met dien verstande dat de
      boete voor een afzonderlijke overtreding ten hoogste € 900.000 bedraagt.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel55
  - number: '55.2'
    text: |-
      De algemene maatregel van bestuur, bedoeld in het eerste lid, bepaalt bij elke daarin omschreven overtreding het
      bedrag van de deswege op te leggen bestuurlijke boete.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel55
  - number: '55.3'
    text: |-
      De Autoriteit Financiële Markten kan het bedrag van de bestuurlijke boete lager stellen dan in de algemene
      maatregel van bestuur is bepaald, indien het bedrag van de boete in een bepaald geval onevenredig hoog is.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel55
  - number: '56'
    text: |-
      Degene jegens wie de Autoriteit Financiële Markten een handeling heeft verricht waaraan hij in redelijkheid de
      gevolgtrekking kan verbinden dat hij ervan wordt verdacht een overtreding te hebben begaan die met een bestuurlijke
      boete wordt bedreigd, is niet verplicht ter zake daarvan enige inlichting te verstrekken. Hij wordt hiervan in
      kennis gesteld alvorens hem om informatie wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel56
  - number: '57.1'
    text: |-
      Indien de Autoriteit Financiële Markten voornemens is een bestuurlijke boete op te leggen, geeft zij de betrokkene
      daarvan kennis onder vermelding van de gronden waarop het voornemen berust.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel57
  - number: '57.2'
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1], stelt de Autoriteit Financiële Markten
      de betrokkene in de gelegenheid om naar keuze schriftelijk of mondeling zijn zienswijze naar voren te brengen
      voordat de bestuurlijke boete wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
  - number: '58.1'
    text: De Autoriteit Financiële Markten legt de bestuurlijke boete op bij beschikking.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel58
  - number: '58.2'
    text: 'De beschikking vermeldt in elk geval:'
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel58
  - number: 58.2.a
    text: het feit ter zake waarvan de bestuurlijke boete wordt opgelegd, alsmede het overtreden voorschrift;
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel58
  - number: 58.2.b
    text: het bedrag van de boete en de gegevens op basis waarvan dit bedrag is bepaald; en
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel58
  - number: 58.2.c
    text: |-
      de termijn, bedoeld in [artikel 59, eerste lid][ref1], waarbinnen de boete moet worden betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel59
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '59'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '59.1'
    text: |-
      De bestuurlijke boete wordt betaald binnen zes weken na de inwerkingtreding van de beschikking waarbij zij is
      opgelegd.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel59
  - number: '59.2'
    text: |-
      De bestuurlijke boete wordt vermeerderd met de wettelijke rente, te rekenen vanaf de dag waarop sedert de
      bekendmaking van de beschikking zes weken zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel59
  - number: '59.3'
    text: |-
      Indien de bestuurlijke boete niet tijdig is betaald, stuurt de Autoriteit Financiële Markten schriftelijk een
      aanmaning om binnen twee weken de boete, verhoogd met de kosten van de aanmaning, alsnog te betalen. De aanmaning
      bevat de aanzegging dat de boete, voor zover deze niet binnen de gestelde termijn wordt betaald, overeenkomstig het
      vierde lid zal worden ingevorderd.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel59
  - number: '59.4'
    text: |-
      Bij gebreke van tijdige betaling kan de Autoriteit Financiële Markten de bestuurlijke boete, verhoogd met de kosten
      van de aanmaning en van de invordering, bij dwangbevel invorderen.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel59
  - number: '59.5'
    text: |-
      Het dwangbevel wordt op kosten van de overtreder bij deurwaardersexploot betekend en levert een executoriale titel
      op in de zin van het [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '59.6'
    text: |-
      Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van de
      rechtspersoon die de bestuurlijke boete heeft opgelegd.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel59
  - number: '59.7'
    text: |-
      Het verzet schorst de tenuitvoerlegging niet, tenzij de voorzieningenrechter van de rechtbank in kort geding
      desgevraagd anders beslist.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel59
  - number: '59.8'
    text: |-
      Het verzet kan niet worden gegrond op de stelling dat de bestuurlijke boete ten onrechte of op een te hoog bedrag
      is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel59
  - number: '60.1'
    text: |-
      De bevoegdheid tot het opleggen van een bestuurlijke boete vervalt indien ter zake van de overtreding op grond
      waarvan de boete kan worden opgelegd, tegen de overtreder een strafvervolging is ingesteld en het onderzoek
      ter terechtzitting een aanvang heeft genomen, dan wel het recht tot strafvordering is vervallen ingevolge
      [artikel 74 van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
  - number: '60.2'
    text: |-
      Het recht tot strafvervolging met betrekking tot een overtreding als bedoeld in [artikel 54][ref1] vervalt, indien
      de Autoriteit Financiële Markten ter zake van hetzelfde feit reeds een bestuurlijke boete heeft opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel54
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '54'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '61.1'
    text: |-
      De bevoegdheid tot het opleggen van een bestuurlijke boete vervalt drie jaren na de dag waarop de overtreding is
      begaan.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel61
  - number: '61.2'
    text: |-
      De termijn, bedoeld in het eerste lid, wordt gestuit door de bekendmaking van de beschikking waarbij een
      bestuurlijke boete wordt opgelegd.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel61
  - number: '62'
    text: |-
      De werkzaamheden in verband met het opleggen van een bestuurlijke boete worden verricht door personen die niet
      betrokken zijn geweest bij het vaststellen van de overtreding en het daaraan voorafgaande onderzoek.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel62
  - number: '63'
    text: |-
      Indien beroep wordt ingesteld tegen een besluit op grond van deze wet is, in afwijking van
      [artikel 8:7 van de Algemene wet bestuursrecht][ref1], de rechtbank te Rotterdam bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '64'
    text: |-
      De Autoriteit Financiële Markten kan, in afwijking van [artikel 2:5 van de Algemene wet bestuursrecht][ref1],
      teneinde de naleving van de wet te bevorderen, ter openbare kennis brengen:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: 64.a
    text: |-
      haar weigering om een aangevraagde vergunning te verlenen, wanneer deze weigering niet meer in beroep kan worden
      getroffen en de aanvrager handelt als was hem de vergunning verleend;
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel64
  - number: 64.b
    text: |-
      het feit dat degene waarop naar haar oordeel het verbod, bedoeld in [artikel 4, eerste lid][ref1], van toepassing
      is, niet over een vergunning beschikt en handelt als was hem een vergunning verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel4
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '4'
        hoofdstuk: '1'
  - number: 64.c
    text: |-
      het feit dat een accountantsorganisatie een op grond van [artikel 52][ref1] gegeven aanwijzing niet heeft
      opgevolgd;


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel52
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '52'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 64.d
    text: |-
      het feit ter zake waarvan een last onder dwangsom of een bestuurlijke boete is opgelegd, het overtreden
      voorschrift, alsmede de naam, het adres en de woonplaats van degene aan wie de last onder dwangsom of de
      bestuurlijke boete is opgelegd.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel64
  - number: '65'
    text: |-
      Degene jegens wie door de Autoriteit Financiële Markten een handeling is verricht waaraan hij in redelijkheid
      de gevolgtrekking kan verbinden dat de Autoriteit Financiële Markten zijn handelen of nalaten op grond van
      [artikel 64][ref1] ter openbare kennis zal brengen, is niet verplicht ter zake daarvan enige verklaring af te
      leggen. Hij wordt hiervan in kennis gesteld alvorens hem om informatie wordt gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel64
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '64'
        hoofdstuk: '6'
  - number: '66.1'
    text: |-
      De Autoriteit Financiële Markten geeft, indien zij voornemens is op grond van [artikel 64][ref1] een handelen of
      nalaten ter openbare kennis te brengen, de betrokkene daarvan kennis onder vermelding van de gronden waarop het
      voornemen berust.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel64
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '64'
        hoofdstuk: '6'
  - number: '66.2'
    text: |-
      In aanvulling op [artikel 4:8 van de Algemene wet bestuursrecht][ref1] is de Autoriteit Financiële Markten niet
      gehouden de betrokkene in de gelegenheid te stellen om zijn zienswijze naar voren te brengen, indien van de
      betrokkene geen adres bekend is en het adres ook niet met redelijke inspanning kan worden verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '67'
    text: |-
      De beschikking om op grond van [artikel 64][ref1] een feit ter openbare kennis te brengen vermeldt in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel64
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '64'
        hoofdstuk: '6'
  - number: 67.a
    text: het feit dat ter openbare kennis wordt gebracht;
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel67
  - number: 67.b
    text: de wijze waarop het feit ter openbare kennis wordt gebracht; en
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel67
  - number: 67.c
    text: de termijn waarna het feit ter openbare kennis wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel67
  - number: '68'
    text: |-
      Tenzij de bevordering van de naleving van deze wet geen uitstel toelaat, wordt de werking van de beschikking om
      op grond van [artikel 64][ref1] een feit ter openbare kennis te brengen opgeschort totdat de beroepstermijn is
      verstreken of, indien beroep is ingesteld, op het beroep is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel64
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '64'
        hoofdstuk: '6'
  - number: '69'
    text: |-
      In afwijking van [artikel 3:40 van de Algemene wet bestuursrecht][ref1] treedt de beschikking in werking op de dag
      waarop het feit ter openbare kennis is gebracht zonder dat de werking voor de duur van de beroepstermijn of, indien
      beroep is ingesteld, van het beroep wordt opgeschort, indien van de betrokkene geen adres bekend is en het adres
      ook niet met een redelijke inspanning kan worden verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '70.1'
    text: |-
      De bevoegdheid om op grond van [artikel 64][ref1] een feit ter openbare kennis te brengen vervalt indien ter zake
      van het feit een strafvervolging is ingesteld en het onderzoek ter terechtzitting een aanvang heeft genomen, dan
      wel het recht tot strafvordering is vervallen ingevolge [artikel 74 van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '64'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '74'
  - number: '70.2'
    text: |-
      Het recht tot strafvervolging met betrekking tot een feit als bedoeld in [artikel 64][ref1] vervalt, indien de
      Autoriteit Financiële Markten het feit reeds ter openbare kennis heeft gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel64
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '64'
        hoofdstuk: '6'
  - number: '71.1'
    text: |-
      De bevoegdheid om op grond van [artikel 64][ref1] een feit ter openbare kennis te brengen vervalt drie jaren na de
      dag waarop het feit heeft plaats gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel64
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '64'
        hoofdstuk: '6'
  - number: '71.2'
    text: |-
      De termijn, bedoeld in het eerste lid, wordt gestuit door de bekendmaking van de beschikking waarbij het feit ter
      openbare kennis wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel71
  - number: '72'
    text: |-
      De werkzaamheden in verband met het op grond van [artikel 64][ref1] ter openbare kennis brengen van een feit worden
      verricht door personen die niet betrokken zijn geweest bij het vaststellen van het feit en het daaraan voorafgaande
      onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel64
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '64'
        hoofdstuk: '6'
  - number: '79'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel79
  - number: '80.1'
    text: |-
      Het is een accountantsorganisatie toegestaan om na het tijdstip van inwerkingtreding van deze wet zonder vergunning
      haar werkzaamheden ten behoeve van het uitvoeren van wettelijke controles voort te zetten dan wel opdrachten tot
      uitvoering van wettelijke controles te aanvaarden, onder de in het tweede lid genoemde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel80
  - number: '80.2'
    text: |-
      De accountantsorganisatie vraagt binnen een maand na inwerkingtreding van deze wet een vergunning aan bij de
      Autoriteit Financiële Markten en legt binnen drie maanden na deze aanvraag de gegevens en bescheiden, bedoeld in
      [artikel 8][ref1], aan de Autoriteit Financiële Markten over.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel8
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '2.1'
  - number: '80.3'
    text: |-
      Het eerste lid is van toepassing totdat de Autoriteit Financiële Markten onherroepelijk op de vergunningaanvraag
      heeft beslist.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel80
  - number: '80.4'
    text: |-
      De Autoriteit Financiële Markten beslist binnen twaalf maanden na inwerkingtreding van deze wet op een aanvraag
      als bedoeld in het tweede lid. Onze Minister kan deze termijn ten hoogste twee maal met een periode van een half
      jaar verlengen.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel80
  - number: '80.5'
    text: |-
      De accountantsorganisatie die op grond van het tweede lid een vergunning heeft aangevraagd, wordt als aanvrager
      in de zin van het tweede lid ingeschreven in het register, bedoeld in [artikel 11][ref1]. De Autoriteit Financiële
      Markten haalt deze inschrijving door zodra zij op de aanvraag heeft beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel11
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: '81'
    text: |-
      De besluiten die voor het tijdstip van inwerkingtreding van deze wet zijn genomen door onderscheidenlijk het
      examenbureau, bedoeld in [artikel 74, eerste lid, van de Wet op de Registeraccountants][ref1], het curatorium,
      bedoeld in [artikel 75, eerste lid, van de Wet op de Registeraccountants][ref2] en het examenbureau, bedoeld in
      [artikel 85, eerste lid, van de Wet op de Accountants-Administratieconsulenten][ref3], en die betrekking hebben
      op een periode na bedoeld tijdstip, worden na dat tijdstip geacht te zijn genomen door de Commissie eindtermen
      accountantsopleiding, bedoeld in [artikel 69, eerste lid, van de Wet op de Registeraccountants][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0002374#Artikel75
      [ref3]: https://wetten.overheid.nl/BWBR0002856#Artikel85
      [ref4]: https://wetten.overheid.nl/BWBR0002374#Artikel69
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '74'
      - id: ref2
        bwb_id: BWBR0002374
        artikel: '75'
      - id: ref3
        bwb_id: BWBR0002856
        artikel: '85'
      - id: ref4
        bwb_id: BWBR0002374
        artikel: '69'
  - number: '82'
    text: |-
      In geval voor het tijdstip van inwerkingtreding van deze wet beroep is ingesteld tegen een
      op grond van de [Wet op de Registeraccountants][ref1] genomen besluit door het examenbureau,
      bedoeld in [artikel 74, eerste lid, van die wet][ref2] of het curatorium, bedoeld in
      [artikel 75, eerste lid, van die wet][ref3], onderscheidenlijk tegen een op grond van de
      [Wet op de Accountants-Administratieconsulenten][ref4] genomen besluit door het examenbureau,
      bedoeld in [artikel 85, eerste lid, van die wet][ref5] of het curatorium, bedoeld in
      [artikel 89, eerste lid, van die wet][ref6] wordt op het bezwaar en beroep beslist met toepassing van het voor dat
      tijdstip geldende recht.


      [ref1]: https://wetten.overheid.nl/BWBR0002374
      [ref2]: https://wetten.overheid.nl/BWBR0002374#Artikel74
      [ref3]: https://wetten.overheid.nl/BWBR0002374#Artikel75
      [ref4]: https://wetten.overheid.nl/BWBR0002856
      [ref5]: https://wetten.overheid.nl/BWBR0002856#Artikel85
      [ref6]: https://wetten.overheid.nl/BWBR0002856#Artikel89
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0002374
      - id: ref2
        bwb_id: BWBR0002374
        artikel: '74'
      - id: ref3
        bwb_id: BWBR0002374
        artikel: '75'
      - id: ref4
        bwb_id: BWBR0002856
      - id: ref5
        bwb_id: BWBR0002856
        artikel: '85'
      - id: ref6
        bwb_id: BWBR0002856
        artikel: '89'
  - number: '83.1'
    text: |-
      Indien voor een opleiding als bedoeld in
      [artikel 69, tweede lid, onderdeel b, van de Wet op de Registeraccountants][ref1] of
      [artikel 56, eerste lid, onderdeel b, van de Wet op Accountants-Administratieconsulenten][ref2] een verklaring
      van gelijkwaardigheid is afgegeven, geldt deze verklaring van gelijkwaardigheid als aanwijzing in de zin van deze
      artikelen:


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel56
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '69'
      - id: ref2
        bwb_id: BWBR0002856
        artikel: '56'
  - number: 83.1.a
    text: |-
      totdat het accreditatieorgaan, bedoeld in
      [artikel 5a.2, eerste lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], voor de
      desbetreffende opleiding een onherroepelijk accreditatiebesluit als bedoeld in artikel 5.10, vierde lid, van die
      wet heeft genomen; of


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
  - number: 83.1.b
    text: |-
      totdat de Commissie eindtermen accountantsopleiding een onherroepelijk besluit omtrent de aanwijzing van die
      opleiding heeft genomen.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel83
  - number: '83.2'
    text: |-
      Een door het examenbureau, bedoeld in [artikel 74, eerste lid, van de Wet op de Registeraccountants][ref1], voor
      het tijdstip van inwerkingtreding van dit wetsvoorstel afgegeven verklaring van gelijkwaardigheid als bedoeld in
      [artikel 79a, eerste of tweede lid, van die wet][ref2] is geldig tot uiterlijk 31 december 2008.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0002374#Artikel79a
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '74'
      - id: ref2
        bwb_id: BWBR0002374
        artikel: 79a
  - number: '83.3'
    text: |-
      Een door het examenbureau, bedoeld in
      [artikel 85, eerste lid, van de Wet op de Accountants-Administratieconsulenten][ref1], voor het tijdstip
      van inwerkingtreding van dit wetsvoorstel afgegeven verklaring van gelijkwaardigheid als bedoeld in
      [artikel 91, eerste lid, van die wet][ref2] is geldig tot uiterlijk 31 december 2008.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel91
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '85'
      - id: ref2
        bwb_id: BWBR0002856
        artikel: '91'
  - number: '83.4'
    text: |-
      De accountantsopleidingen aan de Universiteit Nyenrode en de Universiteit van de Nederlandse
      Antillen worden tot uiterlijk 31 december 2008 geacht te voldoen aan de eindtermen, bedoeld in
      [artikel 69, tweede lid, onderdeel a, van de Wet op de Registeraccountants][ref1], dan wel:


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel69
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '69'
  - number: 83.4.a
    text: |-
      tot het voor die datum gelegen tijdstip waarop het accreditatieorgaan, bedoeld in
      [artikel 5a.2, eerste lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], voor de
      desbetreffende opleiding een onherroepelijk accreditatiebesluit als bedoeld in artikel 5.10, vierde lid, van die
      wet heeft genomen; of


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5a
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 5a
  - number: 83.4.b
    text: |-
      tot het voor die datum gelegen tijdstip waarop de Commissie eindtermen accountantsopleiding een
      onherroepelijk besluit heeft genomen omtrent de aanwijzing van de desbetreffende opleiding op grond van
      [artikel 69, tweede lid, onderdeel b, van de Wet op de Registeraccountants][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel69
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '69'
  - number: '84'
    text: |-
      In afwijking van [artikel 67, tweede lid, van de Wet op de Registeraccountants][ref1] en
      [artikel 54, tweede lid, van de Wet op de Accountants-Administratieconsulenten][ref2], blijven de regels,
      opgenomen in de [artikelen 8 tot en met 13 van het Examenbesluit registeraccountants 1994][ref3] onderscheidenlijk
      de [artikelen 8 tot en met 13 van het Examenbesluit Accountants-Administratieconsulenten 1994][ref4],
      zoals deze luidden voor het tijdstip van inwerkingtreding van deze wet, van
      toepassing op de praktijkstage, tot het tijdstip waarop de verordening, bedoeld in
      [artikel 67, tweede lid, van de Wet op de Registeraccountants][ref5] onderscheidenlijk de verordening, bedoeld in
      [artikel 54, tweede lid, van de Wet op de Accountants-Administratieconsulenten][ref6], in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel54
      [ref3]: https://wetten.overheid.nl/BWBR0006453#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0006454#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0002374#Artikel67
      [ref6]: https://wetten.overheid.nl/BWBR0002856#Artikel54
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '67'
      - id: ref2
        bwb_id: BWBR0002856
        artikel: '54'
      - id: ref3
        bwb_id: BWBR0006453
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0006454
        artikel: '8'
      - id: ref5
        bwb_id: BWBR0002374
        artikel: '67'
      - id: ref6
        bwb_id: BWBR0002856
        artikel: '54'
  - number: '85.1'
    text: |-
      Tot het tijdstip waarop de Commissie eindtermen accountantsopleiding de eindtermen, bedoeld in
      [artikel 56, eerste lid, onderdeel a, van de Wet op de Accountants-Administratieconsulenten][ref1] heeft
      vastgesteld, blijven de door het examenbureau, bedoeld in [artikel 85, eerste lid, van die wet][ref2], vastgestelde
      eisen, bedoeld in [artikel 5, eerste lid, van het Examenbesluit Accountants-Administratieconsulenten 1994][ref3],
      zoals die luidden voor het tijdstip van inwerkingtreding van deze wet, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel85
      [ref3]: https://wetten.overheid.nl/BWBR0006454#Artikel5
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '56'
      - id: ref2
        bwb_id: BWBR0002856
        artikel: '85'
      - id: ref3
        bwb_id: BWBR0006454
        artikel: '5'
  - number: '85.2'
    text: |-
      Tot het tijdstip waarop de Commissie eindtermen accountantsopleiding de eindtermen, bedoeld in
      [artikel 69, tweede lid, onderdeel a, van de Wet op de Registeraccountants][ref1] heeft vastgesteld, blijven de
      door het examenbureau, bedoeld in [artikel 74, eerste lid, van die wet][ref2], vastgestelde eisen, bedoeld in
      [artikel 5, eerste lid, van het Examenbesluit registeraccountants 1994][ref3], zoals die luidden voor het tijdstip
      van inwerkingtreding van deze wet, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0002374#Artikel74
      [ref3]: https://wetten.overheid.nl/BWBR0006453#Artikel5
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '69'
      - id: ref2
        bwb_id: BWBR0002374
        artikel: '74'
      - id: ref3
        bwb_id: BWBR0006453
        artikel: '5'
  - number: '86.1'
    text: |-
      Binnen zes weken na het tijdstip van inwerkingtreding van deze wet zendt de Autoriteit Financiële Markten ter
      instemming aan Onze Minister een begroting van de in het resterende deel van het lopende jaar te verwachten baten
      en lasten, investeringsuitgaven alsmede inkomsten en uitgaven met betrekking tot de uitvoering van de bij en
      krachtens deze wet opgedragen taak en daaruit voortvloeiende werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel86
  - number: '86.2'
    text: |-
      [Artikel 32, tweede, vijfde en zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel32
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '32'
        hoofdstuk: '4'
  - number: '87'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel87
  - number: '88'
    text: 'Deze wet wordt aangehaald als: Wet toezicht accountantsorganisaties.'
    url: https://wetten.overheid.nl/BWBR0019468/2007-01-01#Artikel88
