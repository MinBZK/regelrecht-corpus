  - number: 63h
    text: |-
      1 Indien een toezichthoudende instantie van een andere lidstaat ten behoeve van het toezicht op een auditkantoor in
      die staat de Autoriteit Financiële Markten verzoekt in Nederland een onderzoek te verrichten of in de gelegenheid
      te worden gesteld om bij dit onderzoek aanwezig te zijn, geeft de Autoriteit Financiële Markten aan dit verzoek
      gevolg, tenzij:

      a. een dergelijk onderzoek gevaar zou kunnen opleveren voor de Nederlandse soevereiniteit, nationale veiligheid of
      openbare orde; of

      b. met betrekking tot dezelfde handelingen tegen dezelfde accountantsorganisatie of auditkantoor reeds in Nederland
      een strafrechtelijke procedure is ingesteld;

      c. door de dezelfde accountantsorganisatie een beroep is ingesteld tegen een beschikking als bedoeld in
      [artikel 58][ref1] ten aanzien van dezelfde handelingen; of

      d. met betrekking tot dezelfde handelingen en dezelfde accountantsorganisatie of auditkantoor door de Autoriteit
      Financiële Markten een onherroepelijk besluit is genomen.

      2 De Autoriteit Financiële Markten kan ten behoeve van een onderzoek als bedoeld in het eerste lid bij eenieder
      inlichtingen vorderen. De [artikelen 5:13][ref2], [5:17][ref3] en [5:20 van de Algemene wet bestuursrecht][ref4]
      zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel513
