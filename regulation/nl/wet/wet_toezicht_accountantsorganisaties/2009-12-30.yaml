    text: |-
      1 De Autoriteit Financiële Markten kan ten behoeve van de juiste uitvoering van haar bij of krachtens deze wet
      geregelde taken en bevoegdheden van een ieder inlichtingen vorderen.

      2 De [artikelen 5:13][ref1] en [5:20 van de Algemene wet bestuursrecht][ref2] zijn van overeenkomstige toepassing.


