  - number: '68'
    text: |-
      Onverminderd [artikel 67][ref1] maakt de Autoriteit Financiële Markten een besluit tot het opleggen van
      een bestuurlijke boete ingevolge deze wet openbaar, nadat het rechtens onaantastbaar is geworden, tenzij de
      openbaarmaking van het besluit in strijd is of zou kunnen komen met het doel van het door de toezichthouder uit te
      oefenen toezicht op de naleving van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel67
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '67'
        hoofdstuk: '6'
  - number: '69'
    text: |-
      1 De Autoriteit Financiële Markten maakt een besluit tot het opleggen van een last onder dwangsom ingevolge deze
      wet openbaar wanneer een dwangsom wordt verbeurd, tenzij de openbaarmaking van het besluit in strijd is of zou
      kunnen komen met het doel van het door de Autoriteit Financiële Markten uit te oefenen toezicht op de naleving van
      deze wet.

      2 Indien wordt verzocht om een voorlopige voorziening als bedoeld in
      [artikel 8:81 van de Algemene wet bestuursrecht][ref1], wordt de openbaarmaking van het besluit opgeschort totdat
      er een uitspraak is van de voorzieningenrechter.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel881
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 8:81
  - number: '70'
    text: |-
      Indien bescherming van de belangen die deze wet beoogt te beschermen geen uitstel toelaat, kan de
      Autoriteit Financiële Markten, in afwijking van [artikel 67, tweede en derde lid][ref1], [68][ref2], of
      [69, eerste en tweede lid][ref3], onverwijld overgaan tot openbaarmaking van een besluit tot het opleggen van een
      bestuurlijke boete onderscheidenlijk een last onder dwangsom.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel67
