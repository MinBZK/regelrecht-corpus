  - number: 12c
    text: |-
      1 De Autoriteit Financiële Markten draagt, op verzoek, zorg voor de inschrijving in het register, bedoeld in
      [artikel 11][ref1], van een auditorganisatie van een derde land die aantoont dat:

      a. zij verklaringen afgeeft als bedoeld in [artikel 12b][ref2] of dat zij voornemens is deze verklaringen
      af te geven, tenzij het betreft verklaringen omtrent de controle van de jaarrekening of geconsolideerde
      jaarrekening van ondernemingen die uitsluitend effecten als bedoeld in onderdeel b van de definitie van effect
      in [artikel 1:1 van de Wet op het financieel toezicht][ref3] uitgeven die zijn toegelaten tot de handel op een in
      dat artikel bedoelde gereglementeerde markt met een nominale waarde per effect van ten minste € 50.000 of, in het
      geval van effecten in een andere valuta, met een nominale waarde per effect die op de datum van uitgifte ten minste
      gelijkwaardig is aan € 50.000;

      b. zij voldoet aan regels die gelijkwaardig zijn aan het bij of krachtens [artikel 15, eerste lid][ref4],
      [16][ref5] en [19][ref6] bepaalde;

      c. de controles, bedoeld in [artikel 12b][ref7], worden uitgevoerd in overeenstemming met de internationale
      controlestandaarden, bedoeld in artikel 26 van de richtlijn en overeenkomstig regels die gelijkwaardig zijn aan het
      bij of krachtens de [artikelen 25][ref8] of [25a][ref9] bepaalde; en

      d. zij op haar website jaarlijks een transparantieverslag publiceert met bij algemene maatregel van bestuur
      bepaalde informatie.

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld ten aanzien van de wijze waarop de aanvraag
      tot inschrijving wordt ingediend, de gegevens die daarbij worden verstrekt, en de bescheiden die daarbij worden
      overgelegd.

      3 De Autoriteit Financiële Markten beslist binnen twaalf maanden op een verzoek als bedoeld in het eerste lid. In
      afwachting van een besluit van de Commissie van de Europese Gemeenschappen als bedoeld in de artikelen 45, zesde
      lid, en 46, tweede lid, van de richtlijn kan de Autoriteit Financiële Markten de beslissing opschorten tot twaalf
      maanden nadat de Commissie van de Europese Gemeenschappen een besluit heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel11
