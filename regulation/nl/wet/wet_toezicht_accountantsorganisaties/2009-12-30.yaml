  - number: '11'
    text: |-
      1 De Autoriteit Financiële Markten houdt een openbaar register waarin vergunninghoudende accountantsorganisaties,
      auditorganisaties van een derde land die voldoen aan [artikel 12c, eerste lid][ref1], daarbij werkzame of
      daaraan verbonden auditors van een derde land die betrokken zijn bij het afgeven van verklaringen als bedoeld
      in [artikel 12b][ref2], en externe accountants worden ingeschreven. Een externe accountant wordt ingeschreven op
      voordracht van de accountantsorganisatie waarbij hij werkzaam is of waaraan hij is verbonden en indien hij voldoet
      aan het bij of krachtens [afdeling 3.2][ref3] bepaalde. Een auditor van een derde land wordt ingeschreven op
      voordracht van de auditorganisate van een derde land waarbij hij werkzaam is of waaraan hij is verbonden.

      2 De Autoriteit Financiële Markten draagt zorg voor het goed functioneren van het register. Het register vermeldt
      de aan de vergunning van de accountantsorganisatie verbonden voorschriften en de daaraan gestelde beperkingen.

      3 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot:

      a. de inrichting en de werking van het register; en

      b. andere gegevens over de accountantsorganisaties, auditorganisaties van een derde land, externe accountants en
      auditors van een derde land die in het register worden opgenomen.

      4 De Autoriteit Financiële Markten haalt de inschrijving van de accountantsorganisatie in het register door zodra
      de vergunning is ingetrokken of vervallen.

      5 De Autoriteit Financiële Markten haalt de inschrijving van de externe accountant in het register tijdelijk door
      indien de accountantskamer de maatregel van tijdelijke doorhaling heeft opgelegd.

      6 De Autoriteit Financiële Markten haalt de inschrijving van de externe accountant in het register door:

      a. indien de vergunning van de accountantsorganisatie is ingetrokken of vervallen;

      b. indien de accountantskamer de maatregel tot doorhaling van de inschrijving heeft opgelegd;

      c. op verzoek van de accountantsorganisatie waarbij de externe accountant werkzaam is of waaraan hij is verbonden;

      d. op verzoek van de externe accountant;

      e. indien de externe accountant is overleden;

      f. indien de inschrijving van de externe accountant als registeraccountant of Accountant-
      Administratieconsulent is doorgehaald in het accountantsregister, bedoeld in
      [artikel 55, eerste lid, van de Wet op de Registeraccountants][ref4], onderscheidenlijk
      [artikel 36, eerste lid, van de Wet op de Accountants-Administratieconsulenten][ref5].

      7 Indien de Autoriteit Financiële Markten een vergunning intrekt van een accountantsorganisatie die als
      auditkantoor in de zin van de richtlijn is ingeschreven in het openbaar register in een andere lidstaat,
      doet de Autoriteit Financiële Markten daarvan met opgave van de redenen voor de intrekking mededeling aan de
      toezichthoudende instantie in die lidstaat.

      8 De Autoriteit Financiële Markten kan de inschrijving van een auditorganisatie van een derde land in het
      register doorhalen, indien deze niet langer voldoet aan de in [artikel 12c, eerste lid][ref6] gestelde eisen voor
      inschrijving in het register.

      9 De Autoriteit Financiële Markten haalt de inschrijving van een auditorganisatie van een derde land in het
      register door, indien deze een vergunning heeft verkregen als bedoeld in [artikel 5][ref7] of geen gevolg heeft
      gegeven aan een aanwijzing als bedoeld in [artikel 52][ref8].

      10 Een doorhaling in het register als bedoeld in het achtste of negende lid tast het rechtsgevolg van reeds door de
      desbetreffende auditorganisatie afgegeven verklaringen als bedoeld in [artikel 12b][ref9] niet aan.

      11 De Autoriteit Financiële Markten haalt de inschrijving van een auditor van een derde land in het register door:

      a. indien zij de inschrijving in het register van de auditorganisatie van een derde land waarbij de auditor van een
      derde land werkzaam is of waaraan deze is verbonden doorhaalt;

      b. op verzoek van de auditorganisatie van een derde land waarbij de auditor van een derde land werkzaam is of
      waaraan hij is verbonden;

      c. indien de auditor van een derde land niet meer als zodanig optreedt dan wel niet meer bevoegd is als zodanig op
      te treden;

      d. op verzoek van de auditor van een derde land; of

      e. indien de auditor van een derde land is overleden.


