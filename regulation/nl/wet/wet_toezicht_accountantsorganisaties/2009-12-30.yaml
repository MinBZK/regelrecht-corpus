  - number: 63d
    text: |-
      1 De Autoriteit Financiële Markten kan, in afwijking van [artikel 63a][ref1], vertrouwelijke gegevens of
      inlichtingen verkregen bij de vervulling van de haar ingevolge deze wet opgedragen taak, verstrekken aan de
      accountantskamer, bedoeld in [artikel 31, tweede lid][ref2], of het College van Beroep voor het bedrijfsleven.

      2 De Autoriteit Financiële Markten verstrekt geen vertrouwelijke gegevens of inlichtingen als bedoeld in het eerste
      lid indien de verstrekking van de vertrouwelijke gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen
      komen met de belangen die deze wet beoogt te beschermen.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel63a
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel31
