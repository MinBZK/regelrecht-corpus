        artikel: 63a
        hoofdstuk: 5a
  - number: 63g
    text: |-
      1 De Autoriteit Financiële Markten kan ter uitvoering van haar taak op grond van [artikel 63f][ref1] van een ieder
      inlichtingen vorderen, indien dat voor de vervulling van de taak van een toezichthoudende instantie in een andere
      lidstaat nodig is.

      2 De [artikelen 5:13][ref2] en [5:20 van de Algemene wet bestuursrecht][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel63f
