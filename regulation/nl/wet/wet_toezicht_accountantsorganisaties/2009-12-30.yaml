  - number: 63f
    text: |-
      1 De Autoriteit Financiële Markten werkt samen met toezichthoudende instanties van andere lidstaten, indien dat
      voor het vervullen van haar taak op grond van deze wet of voor de vervulling van de taak van die toezichthoudende
      instanties nodig is.

      2 De Autoriteit Financiële Markten verstrekt op verzoek aan een toezichthoudende instantie van een andere lidstaat,
      met inachtneming van [artikel 63a][ref1], alle gegevens en inlichtingen die voor de vervulling van de taak van die
      toezichthoudende instantie nodig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel63a
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel63f
