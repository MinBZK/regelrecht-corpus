  - number: 63b
    text: |-
      1 De Autoriteit Financiële Markten verstrekt, in afwijking van [artikel 63a, eerste lid][ref1], op verzoek van een
      toezichthoudende instantie van een andere lidstaat onverwijld vertrouwelijke gegevens of inlichtingen die ingevolge
      deze wet dan wel ingevolge [afdeling 5.2 van de Algemene wet bestuursrecht][ref2] zijn verstrekt of verkregen, aan
      die toezichthoudende instantie, tenzij:

      a. de verstrekking gevaar zou kunnen opleveren voor de Nederlandse soevereiniteit, nationale veiligheid of openbare
      orde; of

      b. de gegevens of inlichtingen betrekking hebben op handelingen van een accountantsorganisatie waartegen in
      Nederland reeds een strafrechtelijke procedure is ingesteld;

      c. reeds beroep is ingesteld tegen een beschikking als bedoeld in [artikel 58][ref3] ten aanzien van de handelingen
      waarop de gegevens of inlichtingen betrekking hebben; of

      d. met betrekking tot dezelfde handelingen en dezelfde accountantsorganisaties door de Autoriteit Financiële
      Markten een onherroepelijk besluit is genomen.

      2 Indien de Autoriteit Financiële Markten de gevraagde gegevens of inlichtingen niet onverwijld kan verstrekken,
      stelt zij de toezichthoudende instantie van de andere lidstaat hiervan in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel63a
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling5.2
      [ref3]: https://wetten.overheid.nl/BWBR0019468#Artikel58
