  - number: '13'
    text: |-
      De voorschriften in deze afdeling, met uitzondering van [artikel 21a][ref1], zijn van toepassing op
      accountantsorganisaties waaraan een vergunning is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel21a
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: 21a
        hoofdstuk: '3'
        paragraaf: 3.1.3
        afdeling: '3.1'
  - number: '14'
    text: |-
      De accountantsorganisatie draagt er zorg voor dat de externe accountants die bij haar werkzaam zijn of aan haar
      zijn verbonden voldoen aan het bij of krachtens [afdeling 3.2][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0019468
        hoofdstuk: '3'
        afdeling: '3.2'
  - number: '15'
    text: |-
      1 De betrouwbaarheid van de personen die het dagelijks beleid van de accountantsorganisatie bepalen of mede bepalen
      staat buiten twijfel.

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld ten aanzien van de betrouwbaarheid van de
      in het eerste lid bedoelde personen.
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel15
  - number: '16'
    text: |-
      1 De natuurlijke personen die het dagelijks beleid van de accountantsorganisatie bepalen zijn deskundig ten aanzien
      van het stelsel van kwaliteitsbeheersing van de accountantsorganisatie.

      2 Het dagelijks beleid van de accountantsorganisatie wordt in meerderheid bepaald door accountantsorganisaties,
      auditkantoren of door natuurlijke personen die voldoen aan de krachtens [artikel 25][ref1] te stellen regels inzake
      vakbekwaamheid van externe accountants of regels die daaraan gelijkwaardig zijn. Indien het dagelijks beleid van de
      accountantsorganisatie door twee personen wordt bepaald, voldoet tenminste een van deze personen aan deze regels.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel25
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '25'
        hoofdstuk: '3'
        afdeling: '3.2'
  - number: 16a
    text: |-
      De meerderheid van de stemrechten in een accountantsorganisatie wordt gehouden door:

      a. accountantsorganisaties;

      b. auditkantoren; of

      c. natuurlijke personen die voldoen aan de krachtens [artikel 25][ref1] te stellen regels inzake vakbekwaamheid van
      externe accountants of aan regels die daaraan gelijkwaardig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel25
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '25'
        hoofdstuk: '3'
        afdeling: '3.2'
  - number: '17'
    text: |-
      De formele of feitelijke zeggenschapsstructuur van de accountantsorganisatie vormt geen belemmering voor
      het adequaat uitoefenen van het toezicht op de naleving van het bij of krachtens deze wet bepaalde door de
      accountantsorganisatie.
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel17
  - number: '18'
    text: |-
      1 De accountantsorganisatie beschikt over een stelsel van kwaliteitsbeheersing.

      2 Het stelsel van kwaliteitsbeheersing is zodanig ingericht dat de werkzaamheden betreffende een wettelijke
      controle te allen tijde plaatsvinden onder de verantwoordelijkheid van een externe accountant.

      3 Bij of krachtens algemene maatregel van bestuur worden met het oog op de bevordering van het vertrouwen in de
      financiële markten, de waarborging van het publieke belang van de accountantsverklaring en het toezicht op de
      naleving van de bij of krachtens deze wet gestelde regels, regels gesteld ten aanzien van de kwaliteitsbeheersing
      en het stelsel van kwaliteitsbeheersing.
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel18
  - number: '19'
    text: |-
      1 Indien een accountantsorganisatie of een ander onderdeel van het netwerk betrekkingen onderhoudt met een
      controlecliënt of een met deze controlecliënt verbonden derde op grond waarvan een objectieve, redelijke en
      geïnformeerde derde partij zou concluderen dat die een bedreiging kunnen vormen voor de onafhankelijkheid van de
      accountantsorganisatie ten opzichte van die controlecliënt of derde, neemt de accountantsorganisatie maatregelen
      om haar onafhankelijkheid te waarborgen door deze bedreiging uit te sluiten of te beperken of, indien dat niet
      mogelijk is, accepteert de accountantsorganisatie de opdracht niet of beëindigt zij deze.

      2 De accountantsorganisatie legt de ingevolge het eerste lid genomen maatregelen vast.

      3 De accountantsorganisatie voldoet aan bij of krachtens algemene maatregel van bestuur te stellen regels terzake
      van haar onafhankelijkheid.
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel19
  - number: '20'
    text: |-
      1 Een accountantsorganisatie die bij het verrichten van een wettelijke controle de beschikking krijgt over gegevens
      waarvan zij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, is verplicht tot geheimhouding van
      die gegevens, behoudens voor zover zij bij of krachtens wettelijk voorschrift tot mededeling verplicht is.

      2 Een accountantsorganisatie kan, in afwijking van het eerste lid, vertrouwelijke gegevens of inlichtingen
      verkregen bij het verrichten van een wettelijke controle verstrekken aan organisaties als bedoeld in
      [artikel 48, eerste lid][ref1], voor zover die gegevens of inlichtingen noodzakelijk zijn voor de in dat lid
      bedoelde beoordeling.

      3 Een accountantsorganisatie verleent aan de accountantsorganisatie waaraan haar voormalige controlecliënt een
      opvolgende opdracht tot het verrichten van een wettelijke controle heeft verleend, desgevraagd toegang tot alle
      relevante informatie met betrekking tot die controlecliënt.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel48
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '48'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '21'
    text: |-
      1 Een accountantsorganisatie richt de bedrijfsvoering zodanig in dat deze een beheerste en integere uitoefening van
      haar bedrijf waarborgt.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het eerste lid.
      Deze regels hebben betrekking op:

      a. het beheersen van bedrijfsprocessen en bedrijfsrisico’s;

      b. integriteit, waaronder wordt verstaan:

      1°. het tegengaan van verstrengeling van tegenstrijdige belangen;

      2°. het tegengaan van betrokkenheid van de accountantsorganisatie, de externe accountants of andere medewerkers van
      de accountantsorganisatie bij strafbare feiten en wetsovertredingen die het vertrouwen in de accountantsorganisatie
      of in de financiële markten kunnen schaden;

      3°. het tegengaan van relaties met cliënten die het vertrouwen in de accountantsorganisatie of in de financiële
      markten kunnen schaden;

      c. het voorkomen dat bij het verrichten van wettelijke controles de onafhankelijkheid in het geding komt van
      de externe accountants of andere medewerkers van de accountantsorganisatie die ten behoeve van die wettelijke
      controles werkzaamheden verrichten;

      d. andere bij algemene maatregel van bestuur te noemen onderwerpen.
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel21
  - number: 21a
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van de instelling door organisaties van
      openbaar belang van een auditcomité of een orgaan met gelijksoortige taken.
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel21a
  - number: '22'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen, onverminderd [artikel 18][ref1], aanvullende regels worden
      gesteld ten aanzien van de kwaliteitsbeheersing en het stelsel van kwaliteitsbeheersing van accountantsorganisaties
      die wettelijke controles verrichten bij organisaties van openbaar belang.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel18
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: 3.1.2
        afdeling: '3.1'
  - number: '23'
    text: |-
      De accountantsorganisatie verricht geen wettelijke controle bij een organisatie van openbaar belang, indien zij met
      betrekking tot die organisatie:

      a. op enig tijdstip gedurende de daaraan voorafgaande twee jaar de financiële verantwoording waarop de wettelijke
      controle betrekking heeft, heeft samengesteld; of

      b. gedurende de periode waarop de financiële verantwoording betrekking heeft of ten tijde van het verrichten
      van de wettelijke controle een aanmerkelijk deel van de financiële administratie heeft verzorgd of ingericht,
      onderscheidenlijk verzorgt of inricht.
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel23
  - number: '24'
    text: |-
      1 De accountantsorganisatie doet geen wettelijke controle bij een organisatie van openbaar belang uitvoeren door
      een externe accountant die verantwoordelijk is geweest voor de gedurende de voorafgaande zeven aaneengesloten
      boekjaren bij die organisatie van openbaar belang uitgevoerde wettelijke controles.

      2 De accountantsorganisatie draagt ervoor zorg dat een externe accountant die bij een organisatie van openbaar
      belang verantwoordelijk is geweest voor de uitgevoerde wettelijke controles en die zijn werkzaamheden heeft
      beëindigd, gedurende twee aaneengesloten boekjaren geen wettelijke controles uitvoert voor die organisatie van
      openbaar belang.
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel24
  - number: 24a
    text: |-
      1 De accountantsorganisatie die wettelijke controles verricht bij een organisatie van openbaar belang bevestigt
      jaarlijks haar onafhankelijkheid van de controlecliënt aan het auditcomité, bedoeld in [artikel 21a][ref1].

      2 De accountantsorganisatie meldt jaarlijks aan het in het eerste lid bedoelde auditcomité alle door haar aan de
      controlecliënt verleende diensten anders dan het uitvoeren van wettelijke controles.

      3 De accountantsorganisatie voert met het in het eerste lid bedoelde auditcomité jaarlijks overleg over de
      bedreigingen terzake van haar onafhankelijkheid en de maatregelen die zijn genomen om deze bedreigingen in te
      perken.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel21a
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: 21a
        hoofdstuk: '3'
        paragraaf: 3.1.3
        afdeling: '3.1'
  - number: '25'
    text: |-
      De externe accountant voldoet aan bij of krachtens algemene maatregel van bestuur te stellen regels terzake van
      zijn vakbekwaamheid, objectiviteit en integriteit.
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel25
  - number: 25a
    text: |-
      1 Indien een externe accountant betrekkingen onderhoudt met een controlecliënt of een met deze controlecliënt
      verbonden derde op grond waarvan een objectieve, redelijke en geïnformeerde derde partij zou concluderen dat
      die een bedreiging kunnen vormen voor de onafhankelijkheid van de externe accountant ten opzichte van die
      controlecliënt of derde, neemt de externe accountant maatregelen om zijn onafhankelijkheid te waarborgen door deze
      bedreiging uit te sluiten of te beperken of, indien dat niet mogelijk is, accepteert de externe accountant geen
      betrokkenheid bij de uitvoering van de opdracht of beëindigt hij deze betrokkenheid.

      2 De externe accountant legt de ingevolge het eerste lid genomen maatregelen vast.

      3 De externe accountant voldoet aan bij of krachtens algemene maatregel van bestuur te stellen regels terzake van
      zijn onafhankelijkheid.
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel25a
  - number: '26'
    text: |-
      1 Een externe accountant die tijdens het verrichten van een wettelijke controle de beschikking krijgt over gegevens
      waarvan hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, is verplicht tot geheimhouding van
      die gegevens, behoudens voor zover hij bij of krachtens wettelijk voorschrift tot mededeling verplicht is.

      2 Een externe accountant die tijdens het verrichten van een wettelijke controle de beschikking krijgt over gegevens
      of inlichtingen die het redelijk vermoeden rechtvaardigen dat sprake is van fraude van materieel belang ten
      aanzien van de financiële verantwoording van de controlecliënt, meldt dit aan een opsporingsambtenaar als bedoeld
      in [artikel 141 van het Wetboek van Strafvordering][ref1] behoudens in de bij algemene maatregel van bestuur te
      bepalen gevallen.

      3 Bij algemene maatregel van bestuur wordt bepaald wat wordt verstaan onder fraude van materieel belang en worden
      regels gesteld omtrent het tijdstip en de wijze waarop de melding, bedoeld in het tweede lid, plaatsvindt.

      4 De externe accountant die tot een melding als bedoeld in het tweede lid is overgegaan, is niet aansprakelijk
      voor de schade die een derde dientengevolge lijdt, tenzij aannemelijk wordt gemaakt dat gelet op alle feiten en
      omstandigheden in redelijkheid niet tot melding had mogen worden overgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '27'
    text: |-
      De externe accountant is een registeraccountant of een Accountant-Administratieconsulent
      ten aanzien van wie in het accountantsregister een aantekening is geplaatst als bedoeld in
      [artikel 36, derde lid, van de Wet op de Accountants-Administratieconsulenten][ref1] en voldoet aan de bij en
      krachtens de [Wet op de Registeraccountants][ref2] of de [Wet op de Accountants-Administratieconsulenten][ref3]
      gestelde regels, voor zover deze van toepassing zijn op het uitvoeren van werkzaamheden betreffende de
      totstandkoming of de uitvoering van een opdracht tot het verrichten van wettelijke controles.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0002374
      [ref3]: https://wetten.overheid.nl/BWBR0002856
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '36'
      - id: ref2
        bwb_id: BWBR0002374
      - id: ref3
        bwb_id: BWBR0002856
  - number: '28'
    text: |-
      Met het oog op de waarborging van de publieke functie van de accountantsverklaring kan bij algemene maatregel van
      bestuur [artikel 27][ref1] buiten toepassing worden verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel27
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '27'
        hoofdstuk: '3'
        afdeling: '3.2'
  - number: '29'
    text: |-
      De externe accountant geeft de accountantsverklaring af en ondertekent deze op eigen naam en vermeldt daarbij de
      accountantsorganisatie waarbij hij werkzaam is of waaraan hij is verbonden.
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel29
  - number: 29a
    text: |-
      Degene die als externe accountant verantwoordelijk is geweest voor het uitvoeren van een wettelijke controle bij
      een organisatie van openbaar belang, aanvaardt geen functie als dagelijks beleidsbepaler bij die controlecliënt
      voordat een periode van ten minste twee jaren is verstreken sinds hij zijn werkzaamheden als externe accountant bij
      die controlecliënt heeft beëindigd.
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel29a
  - number: '30'
    text: |-
      Indien de externe accountant met betrekking tot het uitvoeren van werkzaamheden betreffende de totstandkoming
      of de uitvoering van een opdracht tot het verrichten van een wettelijke controle wordt betrokken in een
      tuchtrechtsgeding, meldt hij dit onverwijld aan de betrokken controlecliënt.
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel30
  - number: '31'
    text: |-
      1 De externe accountant is ten aanzien van zijn beroepsmatig handelen onderworpen aan tuchtrechtspraak op de voet
      van de [Wet tuchtrechtspraak accountants][ref1] ter zake van enig handelen of nalaten in strijd met het bij of
      krachtens deze wet bepaalde.

      2 Deze tuchtrechtspraak wordt uitgeoefend in eerste aanleg door de accountantskamer te Zwolle en in hoger beroep,
      tevens in hoogste ressort, door het College van Beroep voor het bedrijfsleven.


      [ref1]: https://wetten.overheid.nl/BWBR0024238
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0024238
  - number: '32'
    text: |-
      1 De Autoriteit Financiële Markten stelt jaarlijks een begroting op van de in het daaropvolgende jaar te verwachten
      baten en lasten, investeringsuitgaven alsmede inkomsten en uitgaven met betrekking tot de uitvoering van de bij en
      krachtens deze wet opgedragen taak en de daaruit voortvloeiende werkzaamheden. De begroting wordt op een zodanige
      wijze opgesteld dat de lasten en de uitgaven structureel worden gedekt door de baten en de inkomsten.

      2 De begrotingsposten worden van een toelichting voorzien.

      3 Tenzij de werkzaamheden waarop de begroting betrekking heeft nog niet eerder werden verricht, bevat de begroting
      een vergelijking met de begroting van het lopende jaar en de laatst goedgekeurde jaarrekening waarmee Onze Minister
      heeft ingestemd.

      4 De Autoriteit Financiële Markten zendt de begroting voor 1 december van het aan het begrotingsjaar voorafgaande
      jaar ter instemming aan Onze Minister.

      5 De instemming kan worden onthouden wegens strijd met het recht of het algemeen belang. Ingeval van gebleken
      strijdigheid wordt instemming niet onthouden dan nadat de Autoriteit Financiële Markten in de gelegenheid is
      gesteld de begroting aan te passen, binnen een door Onze Minister te stellen redelijke termijn.

      6 De Autoriteit Financiële Markten doet onverwijld na instemming mededeling van de begroting in de Staatscourant en
      houdt de begroting gedurende een jaar na instemming op elektronische wijze ter inzage.

      7 Wanneer Onze Minister niet met de begroting heeft ingestemd vóór 1 januari van het jaar waarop deze betrekking
      heeft, kan de Autoriteit Financiële Markten, in het belang van een juiste uitvoering van haar taak, voor het
      aangaan van verplichtingen en het verrichten van uitgaven beschikken over ten hoogste drie twaalfde gedeelten van
      de bedragen die bij de overeenkomstige onderdelen in de begroting van het voorafgaande jaar waren toegestaan.
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel32
  - number: '33'
    text: |-
      Indien gedurende het jaar aanmerkelijke verschillen ontstaan of dreigen te ontstaan tussen de werkelijke en begrote
      baten en lasten dan wel inkomsten en uitgaven, doet de Autoriteit Financiële Markten daarvan onverwijld mededeling
      aan Onze Minister onder vermelding van de oorzaak van de verschillen.
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel33
  - number: '34'
    text: Bij ministeriële regeling kunnen regels worden gesteld voor de inrichting van de begroting.
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel34
  - number: '35'
    text: |-
      1 De Autoriteit Financiële Markten stelt jaarlijks een jaarrekening op van de bij deze wet opgedragen taak en de
      daaruit voortvloeiende werkzaamheden.

      2 De jaarrekening van de Autoriteit Financiële Markten, waarin rekening en verantwoording wordt afgelegd van het
      financieel beheer en van de geleverde prestaties over het verstreken boekjaar, wordt ingericht zoveel mogelijk met
      overeenkomstige toepassing van [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1].

      3 De jaarrekening gaat vergezeld van een verklaring omtrent de getrouwheid, afgegeven door een door
      de Autoriteit Financiële Markten aangewezen registeraccountant of Accountant-Administratieconsulent
      ten aanzien van wie in het accountantsregister een aantekening is geplaatst als bedoeld in
      [artikel 36, derde lid, van de Wet op de Accountants-Administratieconsulenten][ref2], die niet werkzaam is bij of
      verbonden is aan een accountantsorganisatie.

      4 De accountant voegt bij de verklaring, bedoeld in het derde lid, een verslag van zijn bevindingen omtrent de
      rechtmatige inning en besteding van de middelen door de Autoriteit Financiële Markten uit hoofde van deze wet.

      5 De accountant voegt bij de verklaring, bedoeld in het derde lid, tevens een verslag van zijn bevindingen over
      de vraag of het beheer en de organisatie van de Autoriteit Financiële Markten uit hoofde van deze wet voldoen aan
      eisen van doelmatigheid.

      6 De Autoriteit Financiële Markten zendt de jaarrekening voor 1 mei van het op het boekjaar volgende jaar ter
      instemming aan Onze Minister.

      7 De instemming kan worden onthouden wegens strijd met het recht of het algemeen belang.

      8 De Autoriteit Financiële Markten doet onverwijld na instemming mededeling van de jaarrekening in de Staatscourant
      en houdt de jaarrekening gedurende een jaar na instemming op elektronische wijze ter inzage.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel36
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0002856
        artikel: '36'
  - number: '36'
    text: |-
      1 Het verschil tussen de aan het eind van een begrotingsjaar gerealiseerde baten van de Autoriteit Financiële
      Markten en de gerealiseerde lasten van de Autoriteit Financiële Markten vormt het exploitatiesaldo.

      2 Indien in enig boekjaar een exploitatiesaldo ontstaat en de Autoriteit Financiële Markten dit exploitatiesaldo
      wil betrekken bij de in rekening te brengen kosten als bedoeld in [artikel 41][ref1] doet de Autoriteit Financiële
      Markten daaromtrent een voorstel in de jaarrekening.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel41
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '41'
        hoofdstuk: '4'
  - number: '37'
    text: |-
      1 De Autoriteit Financiële Markten stelt jaarlijks een jaarverslag op. Het jaarverslag beschrijft de
      taakuitoefening en het daartoe gevoerde beleid uit hoofde van deze wet in het voorafgaande jaar. Het jaarverslag
      beschrijft voorts het gevoerde beleid met betrekking tot de kwaliteitszorg.

      2 De Autoriteit Financiële Markten zendt het jaarverslag voor 1 mei aan Onze Minister. Onze Minister zendt een
      afschrift van het jaarverslag aan de Tweede Kamer der Staten-Generaal.

      3 De Autoriteit Financiële Markten houdt het jaarverslag op elektronische wijze ter inzage.
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel37
  - number: '38'
    text: |-
      1 De Autoriteit Financiële Markten legt een voorgenomen statutenwijziging ter voorafgaande instemming voor aan Onze
      Minister. De [artikelen 10:28 tot en met 10:31 van de Algemene wet bestuursrecht][ref1] zijn van overeenkomstige
      toepassing.

      2 De instemming, bedoeld in het eerste lid, kan worden geweigerd:

      a. indien de statuten na wijziging onvoldoende zijn afgestemd op het in deze wet bepaalde;

      b. indien de statuten onvoldoende waarborgen bieden voor een onafhankelijke taakvervulling door de Autoriteit
      Financiële Markten;

      c. wegens strijd met het recht of het algemeen belang.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1028
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 10:28
  - number: '39'
    text: |-
      1 De Autoriteit Financiële Markten draagt met betrekking tot de uitoefening van haar taak op grond van deze wet
      zorg voor:

      a. een tijdige voorbereiding en uitvoering;

      b. de kwaliteit van de daarbij gebruikte procedures;

      c. de zorgvuldige behandeling van een ieder die met haar in aanraking komt;

      d. de zorgvuldige behandeling van bezwaarschriften en klachten die worden ontvangen.

      2 De Autoriteit Financiële Markten treft voorzieningen, waardoor ieder die met haar in aanraking komt in de
      gelegenheid is voorstellen tot verbetering van werkwijzen en procedures te doen.

      3 In het jaarverslag, bedoeld in [artikel 37][ref1], doet de Autoriteit Financiële Markten verslag van hetgeen tot
      uitvoering van het eerste en het tweede lid is verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel37
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '37'
        hoofdstuk: '4'
  - number: '40'
    text: |-
      1 De Autoriteit Financiële Markten stelt een orgaan in voor overleg over:

      a. de door de Autoriteit Financiële Markten op te stellen begroting;

      b. de door de Autoriteit Financiële Markten gerealiseerde baten en lasten alsmede inkomsten en uitgaven, en
      verrichte werkzaamheden;

      c. de kosten voor accountantsorganisaties en auditorganisaties van een derde land die verband houden met de
      uitoefening van haar taak op grond van deze wet en daaruit voortvloeiende werkzaamheden.

      2 Het overleg wordt gevoerd door de Autoriteit Financiële Markten en een representatieve vertegenwoordiging van
      onder haar toezicht staande accountantsorganisaties of representatieve organisaties, waaronder het Nederlands
      Instituut van Registeraccountants, bedoeld in [artikel 1, eerste lid, van de Wet op de Registeraccountants][ref1],
      en de Nederlandse Orde van Accountants-Administratieconsulenten, bedoeld in
      [artikel 2 van de Wet op de Accountants-Administratieconsulenten][ref2]. Onze Minister wijst ambtenaren aan die
      namens hem het overleg bijwonen.

      3 Het overleg vindt ten minste tweemaal per jaar plaats.

      4 De Autoriteit Financiële Markten maakt het verslag van het overleg binnen een redelijke termijn na het overleg
      openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel2
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002856
        artikel: '2'
  - number: '41'
    text: |-
      1 De Autoriteit Financiële Markten brengt jaarlijks de kosten van de werkzaamheden die zij verricht in verband met
      de uitoefening van haar taak op grond van deze wet in rekening bij de accountantsorganisaties en auditorganisaties
      van een derde land ten aanzien waarvan die werkzaamheden worden verricht, voor zover deze kosten niet ten laste
      komen van de Rijksbegroting. Tot de kosten behoren onder meer de kosten die zij ter voorbereiding op de uitvoering
      van haar taak heeft gemaakt, voordat deze taak aan haar werd opgedragen.

      2 De kosten worden gebaseerd op de begroting waarmee Onze Minister heeft ingestemd en op het
      exploitatiesaldo, indien Onze Minister heeft ingestemd met de jaarrekening waarin een voorstel als bedoeld in
      [artikel 36, tweede lid][ref1], is opgenomen.

      3 Op de begrote kosten worden de opbrengsten uit boetes en verbeurde dwangsommen, voor zover de hieraan ten
      grondslag liggende besluiten van de Autoriteit Financiële Markten in het voorafgaande jaar onherroepelijk zijn
      geworden, in mindering gebracht.

      4 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste
      tot en met derde lid. Deze regels hebben onder meer betrekking op de toerekening van toezichthandelingen aan
      accountantsorganisaties.

      5 Bij ministeriële regeling worden tarieven vastgesteld inzake individueel toerekenbare toezichthandelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel36
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '36'
        hoofdstuk: '4'
  - number: '42'
    text: |-
      De Autoriteit Financiële Markten verstrekt Onze Minister desgevraagd inlichtingen die nodig zijn voor de
      beoordeling van de uitvoerbaarheid van algemene beleidsvoornemens en voorgenomen wettelijke voorschriften, voor
      zover deze betrekking hebben op het door de Autoriteit Financiële Markten uit te oefenen toezicht ingevolge deze
      wet.
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel42
  - number: '43'
    text: |-
      1 Onze Minister kan aan de Autoriteit Financiële Markten de gegevens of inlichtingen vragen die nodig zijn voor een
      onderzoek naar de toereikendheid van deze wet of de wijze waarop de Autoriteit Financiële Markten deze wet uitvoert
      of heeft uitgevoerd, indien dat ter wille van het toezicht nodig blijkt.

      2 De Autoriteit Financiële Markten verstrekt aan Onze Minister de in het eerste lid bedoelde gegevens of
      inlichtingen, tenzij het vertrouwelijke gegevens of inlichtingen betreft in de zin van artikel 63a die betrekking
      hebben op of herleidbaar zijn tot een afzonderlijke onderneming, instelling of natuurlijke persoon, met
      uitzondering van gegevens of inlichtingen die betrekking hebben op of herleidbaar zijn tot een afzonderlijke
      accountantsorganisatie of auditorganisatie van een derde land:

      a. die een vergunning als bedoeld in [artikel 5, eerste lid][ref1], heeft verkregen onderscheidenlijk is
      ingeschreven op grond van [artikel 11, eerste lid][ref2]; en

      b. ten aanzien waarvan surseance van betaling is verleend; of

      c. die in staat van faillissement is verklaard; of

      d. die op grond van een rechterlijke uitspraak is ontbonden.

      3 Onze Minister kan een derde opdragen de gegevens of inlichtingen die hem ingevolge het tweede lid zijn
      verstrekt te onderzoeken en aan hem verslag uit te brengen. Tevens kan Onze Minister de derde die in zijn opdracht
      handelt, machtigen namens hem gegevens of inlichtingen in te winnen, in welk geval het eerste en tweede lid van
      overeenkomstige toepassing zijn.

      4 Onze Minister gebruikt de gegevens of inlichtingen die hij ingevolge het tweede of derde lid heeft verkregen
      uitsluitend voor het vormen van zijn oordeel over de toereikendheid van deze wet of de wijze waarop de Autoriteit
      Financiële Markten deze wet uitvoert of heeft uitgevoerd.

      5 Onze Minister en degenen die in zijn opdracht handelen zijn verplicht tot geheimhouding van de op grond van het
      tweede lid ontvangen gegevens of inlichtingen.

      6 Niettegenstaande het vierde en vijfde lid kan Onze Minister de aan de gegevens of inlichtingen ontleende
      bevindingen en de daaruit getrokken conclusies aan de beide kamers der Staten-Generaal mededelen en de conclusies
      in algemene zin uit het onderzoek openbaar maken.

      7 De [Wet openbaarheid van bestuur][ref3] en de [Wet Nationale ombudsman][ref4] zijn niet van toepassing met
      betrekking tot de in dit artikel bedoelde gegevens of inlichtingen die Onze Minister of de in zijn opdracht
      werkende derde onder zich heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0005252
      [ref4]: https://wetten.overheid.nl/BWBR0003372
