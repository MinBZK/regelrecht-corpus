  - number: 63c
    text: |-
      1 De Autoriteit Financiële Markten kan, in afwijking van [artikel 63a, eerste lid][ref1], vertrouwelijke gegevens
      of inlichtingen verkregen bij de uitvoering van de haar ingevolge deze wet opgedragen taak die betrekking hebben
      op overtredingen door accountantsorganisaties van [artikel 5, eerste lid][ref2], of [6, derde lid][ref3], van deze
      wet, verstrekken aan een Nederlandse instantie die is belast met de uitoefening van strafvorderlijke bevoegdheden
      of aan een deskundige die door een dergelijke instantie met een opdracht is belast, voor zover de verlangde
      gegevens of inlichtingen noodzakelijk zijn voor de uitoefening van die bevoegdheden of de uitvoering van die
      opdracht.

      2 Indien de instantie, bedoeld in het eerste lid, het voornemen heeft toepassing te geven aan de bevoegdheid
      tot het bij de Autoriteit Financiële Markten vorderen van de uitlevering van een voor inbeslagneming vatbaar
      voorwerp of aan de bevoegdheid tot het vorderen van de inzage of een afschrift van bescheiden als bedoeld in
      [artikel 96a][ref4], [105][ref5] of [126a van het Wetboek van Strafvordering][ref6], of [artikel 18][ref7] of
      [19 van de Wet op de economische delicten][ref8], en de vordering betreft vertrouwelijke gegevens of inlichtingen
      als bedoeld in [artikel 2:5 van de Algemene wet bestuursrecht][ref9], stelt die instantie voorafgaand aan de
      uitoefening van haar bevoegdheid de Autoriteit Financiële Markten in de gelegenheid haar zienswijze hierover
      kenbaar te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel63a
