  - number: 63i
    text: |-
      1 Indien de Autoriteit Financiële Markten vaststelt dat er in een andere lidstaat handelingen worden of zijn
      uitgevoerd die strijdig zijn met hetgeen ingevolge de richtlijn in die lidstaat is voorgeschreven, geeft zij
      hiervan op zo specifiek mogelijke wijze kennis aan de toezichthoudende instantie van de andere lidstaat.

      2 Indien de Autoriteit Financiële Markten een kennisgeving heeft ontvangen van een toezichthoudende instantie van
      een andere lidstaat dat er in Nederland handelingen worden of zijn uitgevoerd die strijdig zijn met deze wet, stelt
      zij de kennisgevende toezichthoudende instantie in kennis van de door haar genomen maatregelen, voor zover van
      toepassing, alsmede, voorzover mogelijk, van belangrijke tussentijdse ontwikkelingen.
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel63i
  - number: 63j
    text: |-
      1 De Autoriteit Financiële Markten kan, op verzoek van een toezichthoudende instantie van een staat die geen
      lidstaat is, gegevens of inlichtingen die afkomstig zijn van vergunninghoudende accountantsorganisaties of
      externe accountants en die betrekking hebben op controles bij ondernemingen die effecten hebben uitgegeven
      in de betrokken staat of die onderdeel uitmaken van een groep die is onderworpen aan een controle van
      geconsolideerde jaarrekeningen in die staat, met inachtneming van [artikel 63f][ref1], verstrekken aan de betrokken
      toezichthoudende instantie, indien:

      a. dat voor de vervulling van haar taak op grond van deze wet of van de taak van die toezichthoudende instantie
      nodig is;

      b. die toezichthoudende instantie voldoet aan eisen die de Commissie van de Europese Gemeenschappen overeenkomstig
      het bepaalde in artikel 47, derde lid, van de richtlijn adequaat heeft verklaard;

      c. de overdracht van persoonsgegevens geschiedt overeenkomstig de [Wet bescherming persoonsgegevens][ref2];

      d. met betrekking tot de gegevens en inlichtingen krachtens de wet in die staat ten minste gelijkwaardige
      waarborgen gelden ten aanzien van geheimhouding als op grond van [artikel 63a, eerste lid][ref3];

      e. zij met die toezichthoudende instantie op basis van wederkerigheid een overeenkomst heeft gesloten met
      betrekking tot gegevensverstrekking als bedoeld in dit artikel.

      2 De Autoriteit Financiële Markten voldoet niet aan het in het eerste lid bedoelde verzoek, indien:

      a. de verstrekking van de gegevens of inlichtingen gevaar zou kunnen opleveren voor de soevereiniteit, nationale
      veiligheid of openbare orde van Nederland of andere lidstaten; of

      b. met betrekking tot dezelfde handelingen tegen dezelfde accountantsorganisaties reeds in Nederland een
      strafrechtelijke procedure is ingesteld;

      c. door de dezelfde accountantsorganisatie een beroep is ingesteld tegen een beschikking als bedoeld in
      [artikel 58][ref4] ten aanzien van dezelfde handelingen ingesteld; of

      d. met betrekking tot dezelfde handelingen en dezelfde accountantsorganisaties of auditkantoren een onherroepelijk
      besluit is genomen.

      3 De Autoriteit Financiële Markten zendt onverwijld nadat met een toezichthoudende instantie van een staat die
      geen lidstaat is een overeenkomst is gesloten als bedoeld in het eerste lid, een afschrift van die overeenkomst aan
      Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel63f
      [ref2]: https://wetten.overheid.nl/BWBR0011468
      [ref3]: https://wetten.overheid.nl/BWBR0019468#Artikel63a
      [ref4]: https://wetten.overheid.nl/BWBR0019468#Artikel58
