  - number: '79'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel79
  - number: '80'
    text: |-
      1 Het is een accountantsorganisatie toegestaan om na het tijdstip van inwerkingtreding van deze wet zonder
      vergunning haar werkzaamheden ten behoeve van het uitvoeren van wettelijke controles voort te zetten dan wel
      opdrachten tot uitvoering van wettelijke controles te aanvaarden, onder de in het tweede lid genoemde voorwaarden.

      2 De accountantsorganisatie vraagt binnen een maand na inwerkingtreding van deze wet een vergunning aan bij de
      Autoriteit Financiële Markten en legt binnen drie maanden na deze aanvraag de gegevens en bescheiden, bedoeld in
      [artikel 8][ref1], aan de Autoriteit Financiële Markten over.

      3 Het eerste lid is van toepassing totdat de Autoriteit Financiële Markten onherroepelijk op de vergunningaanvraag
      heeft beslist.

      4 De Autoriteit Financiële Markten beslist binnen twaalf maanden na inwerkingtreding van deze wet op een aanvraag
      als bedoeld in het tweede lid. Onze Minister kan deze termijn ten hoogste twee maal met een periode van een half
      jaar verlengen.

      5 De accountantsorganisatie die op grond van het tweede lid een vergunning heeft aangevraagd, wordt als aanvrager
      in de zin van het tweede lid ingeschreven in het register, bedoeld in [artikel 11][ref2]. De Autoriteit Financiële
      Markten haalt deze inschrijving door zodra zij onherroepelijk op de aanvraag heeft beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel11
