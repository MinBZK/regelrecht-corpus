  - number: '64'
    text: |-
      De Autoriteit Financiële Markten kan een openbare waarschuwing uitvaardigen, indien nodig onder vermelding van de
      overwegingen die tot die waarschuwing hebben geleid, bij overtreding van een verbodsbepaling uit deze wet.
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel64
  - number: '65'
    text: |-
      1 De Autoriteit Financiële Markten stelt, indien zij besluit een openbare waarschuwing uit te zullen vaardigen als
      bedoeld in [artikel 64][ref1], de betrokken accountantsorganisatie in kennis van het besluit.

      2 Het besluit vermeldt in ieder geval de geconstateerde overtreding, de inhoud van de openbaarmaking, de gronden
      waarop het besluit berust alsmede de wijze waarop en de termijn waarna de openbare waarschuwing zal worden
      uitgevaardigd.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel64
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '64'
        hoofdstuk: '6'
  - number: '66'
    text: |-
      1 Het uitvaardigen van een openbare waarschuwing als bedoeld in [artikel 64][ref1] geschiedt niet eerder
      dan nadat vijf werkdagen zijn verstreken na de dag waarop de betrokken accountantsorganisatie overeenkomstig
      [artikel 65][ref2] in kennis is gesteld van het besluit.

      2 Indien wordt verzocht om een voorlopige voorziening als bedoeld in
      [artikel 8:81 van de Algemene wet bestuursrecht][ref3], wordt de werking van het besluit opgeschort totdat er een
      uitspraak is van de voorzieningenrechter.

      3 Indien bescherming van de belangen die deze wet beoogt te beschermen geen uitstel toelaat, kan de Autoriteit
      Financiële Markten, in afwijking van de voorgaande leden, onverwijld een openbare waarschuwing uitvaardigen.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel65
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel881
