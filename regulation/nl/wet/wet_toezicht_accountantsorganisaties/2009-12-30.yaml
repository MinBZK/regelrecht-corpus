  - number: '5'
    text: |-
      1 Het is verboden een wettelijke controle te verrichten zonder daartoe van de Autoriteit Financiële Markten een
      vergunning te hebben verkregen.

      2 Het eerste lid is niet van toepassing op:

      a. gemeenten die accountants in gemeentelijke dienst hebben aangesteld als bedoeld in
      [artikel 213, zevende lid, van de Gemeentewet][ref1];

      b. provincies die accountants in provinciale dienst hebben aangesteld als bedoeld in
      [artikel 217, zevende lid, van de Provinciewet][ref2];

      c. accountantsdiensten als bedoeld in [artikel 66, eerste lid, van de Comptabiliteitswet 2001][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel213
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel217
      [ref3]: https://wetten.overheid.nl/BWBR0013891#Artikel66
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel5
