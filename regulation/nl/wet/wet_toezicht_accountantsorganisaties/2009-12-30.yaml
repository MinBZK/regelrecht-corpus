  - number: '44'
    text: |-
      1 Indien naar het oordeel van Onze Minister de Autoriteit Financiële Markten haar taak ernstig verwaarloost, kan
      Onze Minister de noodzakelijke voorzieningen treffen.

      2 Ter uitvoering van het eerste lid kan Onze Minister besluiten een of meer onderdelen van de taak van de
      Autoriteit Financiële Markten zelf uit te voeren of door een ander bestuursorgaan te laten uitvoeren. Alsdan komen
      de desbetreffende bevoegdheden van de Autoriteit Financiële Markten toe aan Onze Minister onderscheidenlijk het
      andere bestuursorgaan.

      3 De voorzieningen worden, spoedeisende gevallen uitgezonderd, niet eerder getroffen dan nadat de Autoriteit
      Financiële Markten in de gelegenheid is gesteld om binnen een door Onze Minister te stellen termijn alsnog haar
      taak naar behoren uit te voeren.

      4 Onze Minister stelt de Tweede Kamer der Staten-Generaal onverwijld in kennis van door hem getroffen voorzieningen
      als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel44
  - number: '45'
    text: |-
      1 Onze Minister zendt vijf jaar na inwerkingtreding van deze wet en vervolgens elke vijf jaar een verslag aan de
      Tweede Kamer der Staten-Generaal over de doeltreffendheid en doelmatigheid van het functioneren van de Autoriteit
      Financiële Markten in het kader van de uitvoering van deze wet.

      2 De Autoriteit Financiële Markten verstrekt desgevraagd aan Onze Minister gegevens en inlichtingen ten behoeve van
      het verslag.
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel45
  - number: '46'
    text: |-
      Tegen besluiten van Onze Minister inzake instemming met de begroting of de jaarrekening kan geen beroep worden
      ingesteld, in afwijking van [artikel 8:1 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel81
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 8:1
  - number: '47'
    text: |-
      Een meerderheid van de leden van het bestuur van de Autoriteit Financiële Markten die het dagelijks beleid met
      betrekking tot het toezicht op de naleving van deze wet bepalen:

      a. is gedurende de drie voorafgaande jaren dat zij het dagelijks beleid bepalen, niet verantwoordelijk geweest voor
      het uitvoeren van wettelijke controles;

      b. heeft gedurende de drie voorafgaande jaren geen deel uitgemaakt van de dagelijkse leiding van een
      accountantsorganisatie;

      c. heeft gedurende de drie voorafgaande jaren niet als stemgerechtigd lid deel uitgemaakt van het bestuur van een
      accountantsorganisatie; en

      d. is gedurende de drie voorafgaande jaren niet werkzaam geweest of verbonden aan een accountantsorganisatie.
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel47
  - number: '48'
    text: |-
      1 De Autoriteit Financiële Markten houdt bij de uitvoering van het toezicht op de naleving van deze
      wet rekening met de uitkomsten van de beoordeling van de werking van door accountantsorganisaties
      gehanteerde stelsels van kwaliteitsbeheersing door andere organisaties, waaronder de openbare
      lichamen, bedoeld in [artikel 1, eerste lid, van de Wet op de Registeraccountants][ref1], en
      [artikel 2, eerste lid, van de Wet op de Accountants-Administratieconsulenten][ref2].

      2 Bij of krachtens algemene maatregel van bestuur kunnen terzake van het eerste lid regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel2
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002856
        artikel: '2'
  - number: 48a
    text: |-
      1 De Autoriteit Financiële Markten beoordeelt ten minste eenmaal in de zes jaar of een accountantsorganisatie
      voldoet aan het bij of krachtens deze wet bepaalde.

      2 Indien een accountantsorganisatie wettelijke controles verricht bij organisaties van openbaar belang, beoordeelt
      de Autoriteit Financiële Markten, in afwijking van het eerste lid, ten minste eenmaal in de drie jaar of die
      organisatie voldoet aan het bij of krachtens deze wet bepaalde.

      3 De Autoriteit Financiële Markten baseert haar beoordeling ten minste op een toetsing van een selectie van
      controledossiers.

      4 De Autoriteit Financiële Markten stelt een verslag op waarin de voornaamste conclusies van de beoordeling zijn
      opgenomen en verstrekt daarvan een afschrift aan de desbetreffende accountantsorganisatie.
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel48a
  - number: '49'
    text: |-
      1 Met het toezicht op de naleving van de bij en krachtens deze wet gestelde regels zijn belast de bij besluit van
      de Autoriteit Financiële Markten aangewezen personen.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel49
  - number: '50'
    text: |-
      De personen, bedoeld in het [eerste lid van artikel 49][ref1], beschikken niet over de bevoegdheden, genoemd in de
      [artikelen 5:18][ref2] en [5:19 van de Algemene wet bestuursrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel518
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel519
