  - number: '55'
    text: |-
      1 Het bedrag van de bestuurlijke boete wordt bepaald bij algemene maatregel van bestuur, met dien verstande dat
      de bestuurlijke boete voor een afzonderlijke overtreding ten hoogste € 4 000 000 bedraagt. Indien tijdens het
      plegen van de overtreding nog geen vijf jaren zijn verlopen sedert het opleggen van een bestuurlijke boete aan de
      overtreder ter zake van eenzelfde overtreding, wordt het bedrag van de bestuurlijke boete, bedoeld in de eerste
      volzin, voor een afzonderlijke overtreding verdubbeld.

      2 De algemene maatregel van bestuur, bedoeld in het eerste lid, bepaalt bij elke daarin omschreven overtreding het
      bedrag van de deswege op te leggen bestuurlijke boete. De overtredingen worden gerangschikt in categorieën naar
      zwaarte van de overtreding met de daarbij behorende basisbedragen, minimumbedragen en maximumbedragen. Daarbij
      wordt de volgende indeling gebruikt:










                    Categorie


                    Basisbedrag


                    Minimumbedrag


                    Maximumbedrag






                    1


                    € 10 000,–


                    € 0,–


                    € 10 000,–




                    2


                    € 500 000,–


                    € 0,–


                    € 1 000 000,–




                    3


                    € 2 000 000,–


                    € 0,–


                    € 4 000 000,–






      3 In afwijking van het eerste en tweede lid kan de toezichthouder de hoogte van de bestuurlijke boete vaststellen
      op ten hoogste twee keer het bedrag van het voordeel dat de overtreder door de overtreding heeft verkregen indien
      diens voordeel groter is dan € 2 000 000.
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel55
  - number: '56'
    text: |-
      1 Indien tegen een besluit tot het opleggen van een bestuurlijke boete bezwaar of beroep wordt aangetekend, schorst
      dit de verplichting tot betaling van de bestuurlijke boete totdat de beroepstermijn is verstreken of, indien beroep
      is ingesteld, op het beroep is beslist.

      2 De schorsing van de verplichting tot betaling van de bestuurlijke boete schorst niet de berekening van de
      wettelijke rente.
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel56
  - number: 62a
    text: |-
      1 Met het oog op waarborging van de publieke functie van de accountantsverklaring en de bevordering
      van het vertrouwen in de financiële markten, kan de Autoriteit Financiële Markten, nadat de beschikking
      waarbij een last onder dwangsom of een bestuurlijke boete is opgelegd, is bekendgemaakt, onverminderd
      [artikel 2:5 van de Algemene wet bestuursrecht][ref1], het feit ter zake waarvan een last onder dwangsom of een
      bestuurlijke boete is opgelegd, het overtreden voorschrift, alsmede de naam, het adres en de woonplaats van degene
      aan wie de last onder dwangsom of de bestuurlijke boete is opgelegd, ter openbare kennis brengen.

      2 Onze Minister kan regels stellen ter zake van de uitoefening van de bevoegdheid, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel25
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel62a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 2:5
  - number: '63'
    text: |-
      Indien beroep wordt ingesteld tegen een besluit op grond van deze wet is, in afwijking van
      [artikel 8:7 van de Algemene wet bestuursrecht][ref1], de rechtbank te Rotterdam bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel87
    url: https://wetten.overheid.nl/BWBR0019468/2009-12-30#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 8:7
  - number: 63a
    text: |-
      1 Het is een ieder die uit hoofde van de toepassing van deze wet of van ingevolge deze wet genomen besluiten enige
      taak vervult of heeft vervuld, verboden van vertrouwelijke gegevens of inlichtingen die ingevolge deze wet dan wel
      ingevolge [afdeling 5.2 van de Algemene wet bestuursrecht][ref1] zijn verstrekt of verkregen of van instanties die
      belast zijn met het toezicht op auditkantoren in een andere lidstaat zijn ontvangen, verder of anders gebruik te
      maken of daaraan verder of anders bekendheid te geven dan voor de uitvoering van zijn taak of op basis van deze wet
      noodzakelijk is.

      2 In afwijking van het eerste lid kan de Autoriteit Financiële Markten van vertrouwelijke gegevens of inlichtingen,
      verkregen bij de uitvoering van haar taak op grond van deze wet, gebruik maken voor haar taak op grond van de
      [Wet op het financieel toezicht][ref2], voor zover die gegevens of inlichtingen duiden op overtredingen als bedoeld
      in [artikel 1:97, eerste lid, van de Wet op het financieel toezicht][ref3].

      3 In afwijking van het eerste lid kan de Autoriteit Financiële Markten met gebruikmaking van vertrouwelijke
      gegevens of inlichtingen, verkregen bij de uitvoering van haar taak op grond van deze wet, mededelingen doen,
      indien deze niet kunnen worden herleid tot afzonderlijke personen, accountantsorganisaties of auditkantoren.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling5.2
      [ref2]: https://wetten.overheid.nl/BWBR0020368
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel197
