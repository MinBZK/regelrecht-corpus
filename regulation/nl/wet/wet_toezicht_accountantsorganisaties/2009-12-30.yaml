  - number: '71'
    text: |-
      1 Indien een verzoek om voorlopige voorziening als bedoeld in [Titel 8.3 van de Algemene wet bestuursrecht][ref1]
      is gedaan tegen een besluit als bedoeld in [artikel 64][ref2], [67, eerste lid][ref3], of [69, eerste lid][ref4],
      vindt het onderzoek ter zitting plaats met gesloten deuren.

      2 Indien de voorzieningenrechter een publicatieverbod van een besluit als bedoeld in [artikel 64][ref5],
      [67, eerste lid][ref6], of [69, eerste lid][ref7], heeft opgelegd, vindt het horen van belanghebbenden terzake van
      het bezwaar niet in het openbaar plaats.

      3 Indien de voorzieningenrechter een publicatieverbod van een besluit als bedoeld in [artikel 64][ref8],
      [67, eerste lid][ref9], of [69, eerste lid][ref10], heeft opgelegd, en beroep wordt ingesteld tegen de beslissing
      op het bezwaar tegen dat besluit, vindt het onderzoek ter zitting plaats met gesloten deuren.


