  - number: 12b
    text: |-
      1 Een door een auditorganisatie van een derde land of een auditor van een derde land afgegeven verklaring omtrent
      de controle van de jaarrekening of geconsolideerde jaarrekening van een onderneming met zetel in een staat die
      geen lidstaat is en waarvan de effecten zijn toegelaten tot de handel op een gereglementeerde markt als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref1] in Nederland, heeft uitsluitend rechtsgevolg in Nederland
      indien de auditorganisatie van een derde land onderscheidenlijk de auditor van een derde land is ingeschreven in
      het register, bedoeld in [artikel 11][ref2].

      2 Het eerste lid is niet van toepassing op een auditorganisatie van een derde land die verklaringen als bedoeld in
      dat lid afgeeft, indien:

      a. de Commissie van de Europese Gemeenschappen het desbetreffende derde land een overgangsperiode als bedoeld in
      artikel 46, tweede lid, vierde volzin, van de richtlijn heeft toegekend en ter zake van de gelijkwaardigheid van
      het stelsel van toezicht en handhaving van het derde land een besluit neemt als bedoeld in artikel 46, tweede lid,
      tweede volzin, van de richtlijn; en

      b. de auditorganisatie een aanvraag tot inschrijving in het register heeft ingediend in overeenstemming met het bij
      of krachtens [artikel 12c, tweede lid][ref3], bepaalde.

      3 Het tweede lid is van toepassing totdat onherroepelijk op de aanvraag tot inschrijving is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0019468#Artikel12c
