  - number: '83'
    text: |-
      1 Indien voor een opleiding als bedoeld in
      [artikel 69, tweede lid, onderdeel b, van de Wet op de Registeraccountants][ref1] of
      [artikel 56, eerste lid, onderdeel b, van de Wet op Accountants-Administratieconsulenten][ref2] een verklaring
      van gelijkwaardigheid is afgegeven, geldt deze verklaring van gelijkwaardigheid als aanwijzing in de zin van deze
      artikelen:

      a. totdat het accreditatieorgaan, bedoeld in
      [artikel 5a.2, eerste lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3],
      voor de desbetreffende opleiding een onherroepelijk accreditatiebesluit als bedoeld in
      [artikel 5a.9, vierde lid, van die wet][ref4] heeft genomen; of

      b. totdat de Commissie eindtermen accountantsopleiding een onherroepelijk besluit omtrent de aanwijzing van die
      opleiding heeft genomen.

      2 Een door het examenbureau, bedoeld in [artikel 74, eerste lid, van de Wet op de Registeraccountants][ref5], voor
      het tijdstip van inwerkingtreding van dit wetsvoorstel afgegeven verklaring van gelijkwaardigheid als bedoeld in
      [artikel 79a, eerste of tweede lid, van die wet][ref6] is geldig tot uiterlijk 31 december 2008.

      3 Een door het examenbureau, bedoeld in
      [artikel 85, eerste lid, van de Wet op de Accountants-Administratieconsulenten][ref7], voor het tijdstip
      van inwerkingtreding van dit wetsvoorstel afgegeven verklaring van gelijkwaardigheid als bedoeld in
      [artikel 91, eerste lid, van die wet][ref8] is geldig tot uiterlijk 31 december 2008.

      4 De accountantsopleidingen aan de Universiteit Nyenrode en de Universiteit van de Nederlandse
      Antillen worden tot uiterlijk 31 december 2008 geacht te voldoen aan de eindtermen, bedoeld in
      [artikel 69, tweede lid, onderdeel a, van de Wet op de Registeraccountants][ref9], dan wel:

      a. tot het voor die datum gelegen tijdstip waarop het accreditatieorgaan, bedoeld in
      [artikel 5a.2, eerste lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref10], voor de
      desbetreffende opleiding een onherroepelijk accreditatiebesluit als bedoeld in artikel 5.10, vierde lid, van die
      wet heeft genomen; of

      b. tot het voor die datum gelegen tijdstip waarop de Commissie eindtermen accountantsopleiding een
      onherroepelijk besluit heeft genomen omtrent de aanwijzing van de desbetreffende opleiding op grond van
      [artikel 69, tweede lid, onderdeel b, van de Wet op de Registeraccountants][ref11].


