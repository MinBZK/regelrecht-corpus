  - number: '67'
    text: |-
      1 De Autoriteit Financiële Markten maakt een besluit tot het opleggen van een bestuurlijke boete ingevolge deze wet
      na bekendmaking openbaar, indien de bestuurlijke boete is opgelegd terzake overtreding van:

      a. [artikel 5, eerste lid][ref1], [14][ref2], [15, eerste lid][ref3], 16a, of [20, eerste of derde lid][ref4], of

      b. [artikel 8, derde lid][ref5], [11, eerste of vierde lid][ref6], [12, derde lid][ref7],
      [13, eerste of tweede lid][ref8], [15a, eerste of tweede lid][ref9], [17 tweede lid][ref10],
      [18 tweede lid][ref11], [20 eerste tot en met derde lid][ref12], [29, tweede lid][ref13], of
      [32, eerste lid, van het Besluit toezicht accountantsorganisaties][ref14], of

      c. een bepaling waarvan de overtreding bij algemene maatregel van bestuur op grond van
      [artikel 55, eerste lid][ref15], beboetbaar is gesteld met tariefnummer 3.

      2 De openbaarmaking van het besluit tot het opleggen van een bestuurlijke boete geschiedt niet eerder dan nadat
      vijf werkdagen zijn verstreken na de dag waarop het besluit aan de betrokken accountantsorganisatie bekend is
      gemaakt.

      3 Indien wordt verzocht om een voorlopige voorziening als bedoeld in
      [artikel 8:81 van de Algemene wet bestuursrecht][ref16], wordt de openbaarmaking van het besluit opgeschort totdat
      er een uitspraak is van de voorzieningenrechter.

      4 Indien de openbaarmaking van het besluit in strijd is of zou kunnen komen met het doel van het door de Autoriteit
      Financiële Markten uit te oefenen toezicht op de naleving van deze wet blijft deze achterwege.


