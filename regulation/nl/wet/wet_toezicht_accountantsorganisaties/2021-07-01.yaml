  - number: 4a
    text: |-
      De [hoofdstukken 3][ref1], en [5 tot en met 6][ref2] zijn van overeenkomstige toepassing op accountantsorganisaties
      die controleverklaringen afgeven betreffende de jaarlijkse of geconsolideerde financiële overzichten van een
      vennootschap die haar statutaire zetel buiten de Europese Unie heeft en waarvan de verhandelbare effecten zijn
      toegelaten tot de handel op een gereglementeerde markt in een lidstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0019468
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0019468
        hoofdstuk: '5'
  - number: '5.1'
    text: |-
      Het is verboden een wettelijke controle te verrichten zonder daartoe van de Autoriteit Financiële Markten een
      vergunning te hebben verkregen.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel5
  - number: '5.2'
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel5
  - number: 5.2.a
    text: |-
      gemeenten die accountants in gemeentelijke dienst hebben aangesteld als bedoeld in
      [artikel 213, zevende lid, van de Gemeentewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel213
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '213'
  - number: 5.2.b
    text: |-
      provincies die accountants in provinciale dienst hebben aangesteld als bedoeld in
      [artikel 217, zevende lid, van de Provinciewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel217
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '217'
  - number: 5.2.c
    text: |-
      de Auditdienst Rijk als bedoeld in [artikel 1.1 van de Comptabiliteitswet 2016][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel1
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '1'
  - number: 5.2.d
    text: |-
      auditkantoren die op grond van [artikel 12e][ref1] zijn ingeschreven in het in [artikel 11][ref2] bedoelde
      register.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel12e
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel11
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel5
