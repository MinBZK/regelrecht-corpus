  - number: 63k.3
    text: |-
      De Autoriteit Financiële Markten is bevoegd tot toepassing van
      [artikel 5:20, derde lid, van de Algemene wet bestuursrecht][ref1] ten aanzien van de in het eerste lid bedoelde
      vordering en de in het tweede lid bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63k
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 63l.1
    text: |-
      De Autoriteit Financiële Markten verstrekt aan het Comité van Europese auditors-toezichthouders jaarlijks
      geaggregeerde informatie over alle bestuurlijke boetes en, wanneer een dwangsom wordt verbeurd, lasten onder
      dwangsom, die ingevolge deze wet of de EU-verordening zijn opgelegd.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63l
  - number: 63l.2
    text: |-
      De Autoriteit Financiële Markten deelt aan het Comité van Europese auditors-toezichthouders
      onverwijld alle maatregelen mee, bedoeld in de [artikelen 57][ref1] en [58][ref2] van deze wet en
      [artikel 2, eerste lid, onderdeel d, van de Wet tuchtrechtspraak accountants][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0024238#Artikel2
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63l
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '57'
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: '58'
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref3
        bwb_id: BWBR0024238
        artikel: '2'
  - number: 63m
    text: |-
      De Autoriteit Financiële Markten kan, in afwijking van [artikel 63a][ref1], vertrouwelijke gegevens of inlichtingen
      verkregen bij de vervulling van de haar ingevolge deze wet of de EU-verordening opgedragen taak, verstrekken aan
      buitenlandse nationale centrale banken die onderdeel uitmaken van het Europees Stelsel van Centrale Banken, bedoeld
      in artikel 282, eerste lid, van het Verdrag betreffende de werking van de Europese Unie en de Europese Centrale
      Bank, handelend in haar hoedanigheid van monetaire autoriteit, en het Europees Comité voor systeemrisico’s.
      [Artikel 63b, eerste lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel63a
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel63b
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63m
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: 63a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0019468
        artikel: 63b
        hoofdstuk: 5b
  - number: '64'
    text: |-
      De Autoriteit Financiële Markten kan een openbare waarschuwing uitvaardigen, indien nodig onder vermelding van de
      overwegingen die tot die waarschuwing hebben geleid, bij overtreding van deze wet of de EU-verordening.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel64
  - number: '65.1'
    text: |-
      De Autoriteit Financiële Markten stelt, indien zij besluit een openbare waarschuwing uit te zullen vaardigen als
      bedoeld in [artikel 64][ref1], de betrokken accountantsorganisatie in kennis van het besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel64
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '64'
        hoofdstuk: '6'
  - number: '65.2'
    text: |-
      Het besluit vermeldt in ieder geval de geconstateerde overtreding, de inhoud van de openbaarmaking, de gronden
      waarop het besluit berust alsmede de wijze waarop en de termijn waarna de openbare waarschuwing zal worden
      uitgevaardigd.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel65
  - number: 65a
    text: |-
      De Autoriteit Financiële Markten maakt op grond van [artikel 64][ref1] geen gegevens openbaar, voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel64
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel65a
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '64'
        hoofdstuk: '6'
  - number: 65a.a
    text: |-
      die gegevens herleidbaar zijn tot een natuurlijk persoon en bekendmaking van zijn persoonsgegevens onevenredig
      zou zijn;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel65a
  - number: 65a.b
    text: betrokken partijen in onevenredige mate schade zou worden berokkend;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel65a
  - number: 65a.c
    text: een lopend strafrechtelijk onderzoek zou worden ondermijnd;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel65a
  - number: 65a.d
    text: de stabiliteit van het financiële stelsel in gevaar zou worden gebracht; of
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel65a
  - number: 65a.e
    text: openbaarmaking in strijd is of zou kunnen komen met de belangen die deze wet beoogt te beschermen.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel65a
  - number: '66.1'
    text: |-
      Het uitvaardigen van een openbare waarschuwing als bedoeld in [artikel 64][ref1] geschiedt niet eerder dan
      nadat vijf werkdagen zijn verstreken na de dag waarop de betrokken accountantsorganisatie overeenkomstig
      [artikel 65][ref2] in kennis is gesteld van het besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel65
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '64'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: '65'
        hoofdstuk: '6'
  - number: '66.2'
    text: |-
      Indien wordt verzocht om een voorlopige voorziening als bedoeld in
      [artikel 8:81 van de Algemene wet bestuursrecht][ref1], wordt de werking van het besluit opgeschort totdat er een
      uitspraak is van de voorzieningenrechter.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '66.3'
    text: |-
      De Autoriteit Financiële Markten beëindigt het openbaar beschikbaar houden van gegevens die tot afzonderlijke
      accountantsorganisaties herleidbaar zijn op grond van [artikel 64][ref1] onverwijld indien en voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel64
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '64'
        hoofdstuk: '6'
  - number: 66.3.a
    text: het besluit tot uitvaardigen van een openbare waarschuwing wordt ingetrokken; of
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel66
  - number: 66.3.b
    text: het besluit tot uitvaardigen van een openbare waarschuwing door de bestuursrechter onherroepelijk is vernietigd.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel66
  - number: '66.4'
    text: |-
      In de gevallen bedoeld in het derde lid, biedt de Autoriteit Financiële Markten de belanghebbende aan de intrekking
      of de vernietiging openbaar te maken.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel66
  - number: 66a.1
    text: |-
      In afwijking van [artikel 66, eerste lid][ref1], kan de Autoriteit Financiële Markten op een kortere termijn en zo
      nodig onverwijld overgaan tot openbaarmaking op grond van [artikel 64][ref2], voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel64
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel66a
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '66'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: '64'
        hoofdstuk: '6'
  - number: 66a.1.a
    text: bescherming van de belangen die deze wet beoogt te beschermen geen verder uitstel toelaat; of
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel66a
  - number: 66a.1.b
    text: |-
      de overtreder zelf informatie openbaar heeft gemaakt over de overtreding en versnelde openbaarmaking in het belang
      van het publiek noodzakelijk is ter bescherming van het vertrouwen in het toezicht op accountantsorganisaties.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel66a
  - number: 66a.2
    text: |-
      In de gevallen bedoeld in het eerste lid kan de Autoriteit Financiële Markten besluiten dat
      [artikel 66, tweede lid][ref1], buiten toepassing blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel66
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel66a
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '66'
        hoofdstuk: '6'
  - number: 66a.3
    text: |-
      De Autoriteit Financiële Markten verricht een redelijke inspanning om de betrokken accountantsorganisatie
      voorafgaand aan de openbaarmaking in kennis te stellen van de voorgenomen openbaarmaking.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel66a
  - number: '67.1'
    text: |-
      De Autoriteit Financiële Markten maakt een besluit tot het opleggen van een bestuurlijke boete ingevolge deze wet
      na bekendmaking openbaar, indien de bestuurlijke boete is opgelegd terzake overtreding van:
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel67
  - number: 67.1.a
    text: |-
      [artikel 5, eerste lid][ref1], [14][ref2], [15, eerste lid][ref3], [16b][ref4], of [20, eerste of derde lid][ref5],
      of


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0019468#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0019468#Artikel16b
      [ref5]: https://wetten.overheid.nl/BWBR0019468#Artikel20
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel67
    references:
