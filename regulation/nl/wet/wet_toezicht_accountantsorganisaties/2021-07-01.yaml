  - number: '13'
    text: |-
      De voorschriften in deze afdeling, met uitzondering van [artikel 21a][ref1], zijn van toepassing op
      accountantsorganisaties waaraan een vergunning is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel21a
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: 21a
        hoofdstuk: '3'
        paragraaf: 3.1.3
        afdeling: '3.1'
  - number: '14'
    text: |-
      De accountantsorganisatie draagt er zorg voor dat de externe accountants die bij haar werkzaam zijn of aan haar
      zijn verbonden voldoen aan het bij of krachtens [afdeling 3.2][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0019468
        hoofdstuk: '3'
        afdeling: '3.2'
  - number: 14a
    text: |-
      De accountantsorganisatie draagt er zorg voor dat tekortkomingen met betrekking tot een wettelijke controle worden
      hersteld.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel14a
  - number: '15.1'
    text: |-
      De betrouwbaarheid van de personen die het dagelijks beleid van de accountantsorganisatie bepalen of mede bepalen
      staat buiten twijfel.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel15
  - number: '15.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld ten aanzien van de betrouwbaarheid van de in
      het eerste lid bedoelde personen.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel15
  - number: '16.1'
    text: |-
      Het dagelijks beleid van de accountantsorganisatie wordt in meerderheid bepaald door accountantsorganisaties,
      auditkantoren of door natuurlijke personen die voldoen aan de krachtens [artikel 25][ref1] te stellen regels inzake
      vakbekwaamheid van externe accountants of regels die daaraan gelijkwaardig zijn. Indien het dagelijks beleid van de
      accountantsorganisatie door twee personen wordt bepaald, voldoet ten minste een van deze personen aan deze regels.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel25
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '25'
        hoofdstuk: '3'
        afdeling: '3.2'
  - number: '16.2'
    text: |-
      De natuurlijke personen die het dagelijks beleid bepalen van een accountantsorganisatie met een vergunning die niet
      mede strekt tot het verrichten van wettelijke controles bij organisaties van openbaar belang zijn deskundig ten
      aanzien van het stelsel van kwaliteitsbeheersing van de accountantsorganisatie.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel16
  - number: '16.3'
    text: |-
      De natuurlijke personen die het dagelijks beleid bepalen van een accountantsorganisatie met een vergunning die mede
      strekt tot het verrichten van wettelijke controles bij organisaties van openbaar belang zijn geschikt in verband
      met de uitoefening van het bedrijf van de accountantsorganisatie.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel16
  - number: '16.4'
    text: |-
      Indien een accountantsorganisatie als bedoeld in het derde lid onderdeel uitmaakt van een netwerk, zijn
      de natuurlijke personen die het dagelijks beleid bepalen van het binnen het netwerk hiërarchisch hoogste
      netwerkonderdeel met zetel in Nederland dat invloed uitoefent op het beleid van de accountantsorganisatie eveneens
      geschikt in verband met de uitoefening van het bedrijf van de tot het netwerk behorende accountantsorganisatie.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel16
  - number: '16.5'
    text: |-
      De personen die belast zijn met het interne toezicht, bedoeld in [artikel 22a, derde lid][ref1], zijn geschikt in
      verband met de uitoefening van dit toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel22a
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: 22a
        hoofdstuk: '3'
        paragraaf: 3.1.3
        afdeling: '3.1'
  - number: '16.6'
    text: |-
      De accountantsorganisatie meldt wijzigingen ten aanzien van personen als bedoeld in het derde, vierde en vijfde lid
      aan de Autoriteit Financiële Markten. Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld
      ten aanzien van de daarbij te volgen procedures en te verstrekken gegevens, alsmede regels ten aanzien van de
      voorwaarden waaronder de wijzigingen ten uitvoer mogen worden gelegd.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel16
  - number: 16a
    text: |-
      Natuurlijke personen die het dagelijks beleid bepalen van een accountantsorganisatie met een vergunning die mede
      strekt tot het verrichten van wettelijke controles bij organisaties van openbaar belang, verrichten geen andere
      werkzaamheden dan die van dagelijks beleidsbepaler van de accountantsorganisatie, tenzij hiervoor voorafgaande
      goedkeuring is verleend door het orgaan, bedoeld in [artikel 22a, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel22a
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: 22a
        hoofdstuk: '3'
        paragraaf: 3.1.3
        afdeling: '3.1'
  - number: 16b
    text: 'De meerderheid van de stemrechten in een accountantsorganisatie wordt gehouden door:'
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel16b
  - number: 16b.a
    text: accountantsorganisaties;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel16b
  - number: 16b.b
    text: auditkantoren; of
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel16b
  - number: 16b.c
    text: |-
      natuurlijke personen die voldoen aan de krachtens [artikel 25][ref1] te stellen regels inzake vakbekwaamheid van
      externe accountants of aan regels die daaraan gelijkwaardig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel25
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel16b
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '25'
        hoofdstuk: '3'
        afdeling: '3.2'
  - number: '17'
    text: |-
      De formele of feitelijke zeggenschapsstructuur van de accountantsorganisatie vormt geen belemmering voor
      het adequaat uitoefenen van het toezicht op de naleving van het bij of krachtens deze wet bepaalde door de
      accountantsorganisatie.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel17
  - number: '18.1'
    text: De accountantsorganisatie beschikt over een stelsel van kwaliteitsbeheersing.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel18
  - number: '18.2'
    text: |-
      Het stelsel van kwaliteitsbeheersing is zodanig ingericht dat de werkzaamheden betreffende een wettelijke controle
      te allen tijde plaatsvinden onder de verantwoordelijkheid van een externe accountant.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel18
  - number: '18.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden met het oog op de bevordering van het vertrouwen in de
      financiële markten, de waarborging van het publieke belang van de accountantsverklaring en het toezicht op de
      naleving van de bij of krachtens deze wet gestelde regels, regels gesteld ten aanzien van de kwaliteitsbeheersing
      en het stelsel van kwaliteitsbeheersing.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel18
  - number: 18a
    text: |-
      Een accountantsorganisatie legt gedragsregels en procedures vast, die waarborgen dat belangrijke controletaken niet
      op zodanige wijze worden uitbesteed dat dit afbreuk doet aan de kwaliteitsbeheersing of een belemmering vormt voor
      adequaat toezicht op de naleving van deze wet of de verordening.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel18a
  - number: 18b.1
    text: |-
      Een accountantsorganisatie heeft een passend beloningsbeleid, ook ten aanzien van winstdeling, dat voldoende
      prestatieprikkels bevat om de kwaliteit van wettelijke controles te verzekeren.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel18b
  - number: 18b.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld ten aanzien van een passend
      beloningsbeleid.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel18b
  - number: '19.1'
    text: |-
      Een accountantsorganisatie is onafhankelijk van de controlecliënt waarbij zij een wettelijke controle verricht en
      niet betrokken bij de besluitvorming van de controlecliënt, waarbij de onafhankelijkheid in ieder geval vereist is
      gedurende de periode waarop de te controleren financiële verantwoording betrekking heeft en gedurende de periode
      waarin de wettelijke controle wordt verricht.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel19
  - number: '19.2'
    text: |-
      De accountantsorganisatie neemt maatregelen om te waarborgen dat bij het verrichten van een wettelijke controle
      haar onafhankelijkheid niet wordt beïnvloed door een bestaand of potentieel belangenconflict of andere directe of
      indirecte relatie waarbij zij, de externe accountant die de controle verricht, of, voor zover van toepassing, een
      ander onderdeel van het netwerk, beleidsbepalers van de accountantsorganisatie, of andere personen werkzaam onder
      haar verantwoordelijkheid, betrokken is of zijn.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel19
  - number: '19.3'
    text: |-
      De accountantsorganisatie accepteert geen opdracht tot een wettelijke controle, of beëindigt deze opdracht,
      indien sprake is van relaties als bedoeld in het tweede lid, die invloed kunnen hebben op de uitkomsten van de
      wettelijke controle, op grond waarvan een objectieve, redelijke en geïnformeerde derde partij, met inachtneming
      van de door de accountantsorganisatie getroffen maatregelen, zou concluderen dat de onafhankelijkheid van de
      accountantsorganisatie in het gedrang komt.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel19
  - number: '19.4'
    text: |-
      De accountantsorganisatie voldoet aan bij of krachtens algemene maatregel van bestuur te stellen nadere regels ter
      zake van haar onafhankelijkheid.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel19
  - number: '19.5'
    text: De accountantsorganisatie legt de ingevolge het tweede of derde lid genomen maatregelen vast.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel19
  - number: 19a
    text: |-
      Een accountantsorganisatie treft onverwijld gepaste maatregelen indien een accountantsverklaring of een onderdeel
      daarvan niet voldoet aan de eisen van [artikel 393, vijfde lid, van boek 2 van het Burgerlijk Wetboek][ref1]
      of, voor zover het gaat om de wettelijke controle van een organisatie van openbaar belang, artikel 10 van de EU-
      verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '20.1'
    text: |-
      Een accountantsorganisatie die bij het verrichten van een wettelijke controle de beschikking krijgt over gegevens
      waarvan zij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, is verplicht tot geheimhouding
      van die gegevens, behoudens voor zover zij bij of krachtens wettelijk voorschrift of bij de EU-verordening tot
      mededeling verplicht is.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel20
  - number: '20.2'
    text: |-
      Een accountantsorganisatie kan, in afwijking van het eerste lid, vertrouwelijke gegevens of inlichtingen verkregen
      bij het verrichten van een wettelijke controle verstrekken aan derden, indien [artikel 26, vijfde lid][ref1],
      van toepassing is, of aan organisaties als bedoeld in [artikel 48, eerste lid][ref2], voor zover die gegevens of
      inlichtingen noodzakelijk zijn voor de in dat lid bedoelde beoordeling.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel48
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '26'
        hoofdstuk: '3'
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: '48'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '20.3'
    text: |-
      Een accountantsorganisatie verleent aan de accountantsorganisatie waaraan haar voormalige controlecliënt een
      opvolgende opdracht tot het verrichten van een wettelijke controle, niet zijnde een wettelijke controle bij een
      organisatie van openbaar belang, heeft verleend, desgevraagd toegang tot alle relevante informatie met betrekking
      tot die controlecliënt, waaronder de meest recente wettelijke controle van die controlecliënt.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel20
  - number: '20.4'
    text: |-
      Het eerste lid is niet van toepassing op een accountantsorganisatie die een wettelijke controle verricht van
      een controlecliënt die deel uitmaakt van een groep ondernemingen of instellingen waarvan de moederonderneming
      in een derde land is gevestigd, voor wat betreft de overdracht van relevante documentatie van de verrichte
      controlewerkzaamheden door de accountantsorganisatie aan de groepsaccountant die in het derde land is gevestigd,
      voor zover deze documentatie nodig is voor het verrichten van de controle van de geconsolideerde financiële
      overzichten van de moederonderneming.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel20
  - number: '20.5'
    text: |-
      De accountantsorganisatie voldoet aan bij of krachtens algemene maatregel van bestuur te stellen regels ter zake
      van geheimhouding.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel20
  - number: '21.1'
    text: |-
      Een accountantsorganisatie richt de bedrijfsvoering zodanig in dat deze een beheerste en integere uitoefening van
      haar bedrijf waarborgt.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel21
  - number: '21.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het eerste lid.
      Deze regels hebben betrekking op:
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel21
  - number: 21.2.a
    text: het beheersen van bedrijfsprocessen en bedrijfsrisico’s;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel21
  - number: 21.2.b
    text: 'integriteit, waaronder wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel21
  - number: 21.2.b.1°
    text: het tegengaan van verstrengeling van tegenstrijdige belangen;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel21
  - number: 21.2.b.2°
    text: |-
      het tegengaan van betrokkenheid van de accountantsorganisatie, de externe accountants of andere medewerkers van de
      accountantsorganisatie bij strafbare feiten en wetsovertredingen die het vertrouwen in de accountantsorganisatie of
      in de financiële markten kunnen schaden;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel21
  - number: 21.2.b.3°
    text: |-
      het tegengaan van relaties met cliënten die het vertrouwen in de accountantsorganisatie of in de financiële markten
      kunnen schaden;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel21
  - number: 21.2.c
    text: |-
      het voorkomen dat bij het verrichten van wettelijke controles de onafhankelijkheid in het geding komt van de
      externe accountants, of andere personen werkzaam onder haar verantwoordelijkheid die in een positie zijn om directe
      of indirecte invloed uit te oefenen op de uitkomst van de wettelijke controle;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel21
  - number: 21.2.d
    text: |-
      het voorkomen dat bij het verrichten van wettelijke controles de professioneel-kritische instelling van de externe
      accountants in het geding komt;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel21
  - number: 21.2.e
    text: andere bij algemene maatregel van bestuur te noemen onderwerpen.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel21
  - number: 21a
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van de instelling door organisaties van
      openbaar belang van een auditcomité of een orgaan met gelijksoortige taken en ten aanzien van de bij dit comité of
      dit orgaan in te dienen aanvullende verklaring als bedoeld in artikel 11 van de EU-verordening.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel21a
  - number: '22'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen, onverminderd [artikel 18][ref1], aanvullende regels worden
      gesteld ten aanzien van de kwaliteitsbeheersing en het stelsel van kwaliteitsbeheersing van accountantsorganisaties
      die wettelijke controles verrichten bij organisaties van openbaar belang.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel18
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: 3.1.2
        afdeling: '3.1'
  - number: 22a.1
    text: |-
      Een accountantsorganisatie die een vergunning heeft om wettelijke controles te verrichten bij een organisatie van
      openbaar belang beschikt over een stelsel van onafhankelijk intern toezicht op het beleid en de algemene gang van
      zaken van de accountantsorganisatie.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel22a
  - number: 22a.2
    text: |-
      Indien een accountantsorganisatie als bedoeld in het eerste lid onderdeel uitmaakt van een netwerk, wordt het in
      het eerste lid bedoelde stelsel van onafhankelijk intern toezicht zodanig ingericht dat het ook betrekking heeft
      op het binnen het netwerk hiërarchisch hoogste netwerkonderdeel met zetel in Nederland dat invloed uitoefent op het
      beleid van de accountantsorganisatie.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel22a
  - number: 22a.3
    text: |-
      Het stelsel van onafhankelijk intern toezicht, bedoeld in het eerste lid, omvat ten minste een orgaan dat belast is
      met het interne toezicht, dat bestaat uit ten minste drie natuurlijke personen. Daalt het aantal leden beneden de
      drie, dan neemt het orgaan onverwijld maatregelen tot aanvulling van zijn ledental.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel22a
  - number: 22a.4
    text: |-
      De natuurlijke personen die deel uitmaken van het orgaan dat belast is met het interne toezicht zijn onafhankelijk
      ten opzichte van de personen die het dagelijks beleid van de accountantsorganisatie bepalen of stemrechten in de
      accountantsorganisatie houden, en, indien het stelsel van onafhankelijk intern toezicht overeenkomstig het tweede
      lid is ingericht, de personen die het dagelijks beleid bepalen van het onderdeel van het netwerk waarop het stelsel
      van onafhankelijk intern toezicht ook betrekking heeft en stemrechten in dat onderdeel houden.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel22a
  - number: 22a.5
    text: |-
      Indien een accountantsorganisatie als bedoeld in het eerste lid onderdeel uitmaakt van een netwerk, mag ten hoogste
      één persoon die deel uitmaakt van het orgaan dat belast is met het interne toezicht gelieerd zijn aan een onderdeel
      van het netwerk dat niet in Nederland gevestigd is. Deze persoon kan niet tot voorzitter van het orgaan worden
      benoemd.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel22a
  - number: 22a.6
    text: |-
      De personen die het dagelijks beleid van de accountantsorganisatie, bedoeld in het eerste lid, bepalen
      of de personen die het dagelijks beleid bepalen van het onderdeel van het netwerk waarop overeenkomstig
      artikel 22a, tweede lid, het stelsel van onafhankelijk intern toezicht eveneens betrekking heeft, worden
      benoemd uit een voordracht van het orgaan belast met het interne toezicht, tenzij [artikel 162][ref1] of
      [artikel 272 van Boek 2 van het Burgerlijk Wetboek][ref2] van toepassing is. Indien de voordracht wordt afgewezen,
      doet het orgaan belast met het interne toezicht een nieuwe voordracht voor de benoeming.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel162
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel272
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '162'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '272'
  - number: 22a.7
    text: |-
      Het in het derde lid bedoelde orgaan dat belast is met het interne toezicht heeft de volgende taken en
      bevoegdheden:
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel22a
  - number: 22a.7.a
    text: houdt toezicht op het stelsel van kwaliteitsbeheersing van de accountantsorganisatie;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel22a
  - number: 22a.7.b
    text: |-
      staat de personen die het dagelijks beleid bepalen van de accountantsorganisatie of, indien het stelsel van
      onafhankelijk intern toezicht overeenkomstig het tweede lid is ingericht, de personen die het dagelijks beleid
      bepalen van het binnen het netwerk hiërarchisch hoogste netwerkonderdeel met zetel in Nederland, met raad ter
      zijde;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel22a
  - number: 22a.7.c
    text: |-
      is bevoegd de personen die het dagelijks beleid van de accountantsorganisatie bepalen, of de personen die het
      dagelijks beleid bepalen van het onderdeel van het netwerk waarop overeenkomstig het tweede lid het stelsel van
      onafhankelijk intern toezicht eveneens betrekking heeft te allen tijde te schorsen en te ontslaan;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel22a
  - number: 22a.7.d
    text: andere bij of krachtens algemene maatregel van bestuur te bepalen taken en bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel22a
  - number: 22a.8
    text: |-
      De Autoriteit Financiële Markten kan op aanvraag ontheffing verlenen van het zesde lid indien de
      accountantsorganisatie aantoont dat zij daaraan niet kan voldoen en dat de doeleinden die het stelsel van
      onafhankelijk intern toezicht beogen te bereiken anderszins worden bereikt. Aan de ontheffing kunnen voorschriften
      worden verbonden en beperkingen worden gesteld. De ontheffing kan worden gewijzigd of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel22a
  - number: 22a.9
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het in het eerste
      en derde lid bedoelde stelsel van onafhankelijk intern toezicht. Deze regels hebben in elk geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel22a
  - number: 22a.9.a
    text: |-
      de inrichting van het stelsel van onafhankelijk intern toezicht en de in dat verband aan de onafhankelijkheid van
      de leden van het orgaan te stellen eisen;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel22a
  - number: 22a.9.b
    text: de onderwerpen waarover het orgaan dat belast is met het interne toezicht dient te worden geïnformeerd.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel22a
  - number: '23'
    text: |-
      De accountantsorganisatie verricht geen wettelijke controle bij een organisatie van openbaar belang, indien zij met
      betrekking tot die organisatie:
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel23
  - number: 23.a
    text: |-
      op enig tijdstip gedurende de daaraan voorafgaande twee jaar de financiële verantwoording waarop de wettelijke
      controle betrekking heeft, heeft samengesteld; of
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel23
  - number: 23.b
    text: |-
      gedurende de periode waarop de financiële verantwoording betrekking heeft of ten tijde van het verrichten
      van de wettelijke controle een aanmerkelijk deel van de financiële administratie heeft verzorgd of ingericht,
      onderscheidenlijk verzorgt of inricht.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel23
  - number: '24'
    text: |-
      De accountantsorganisatie doet geen wettelijke controle bij een organisatie van openbaar belang uitvoeren door een
      externe accountant die verantwoordelijk is geweest voor de gedurende de voorafgaande vijf aaneengesloten boekjaren
      bij die organisatie van openbaar belang uitgevoerde wettelijke controles.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel24
  - number: 24b.1
    text: |-
      In aanvulling op artikel 5, eerste lid, van de EU-verordening, verricht een accountantsorganisatie die de
      wettelijke controle verricht bij een organisatie van openbaar belang, naast controlediensten geen diensten voor die
      organisatie en aan die organisatie gelieerde entiteiten.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel24b
  - number: 24b.2
    text: |-
      In aanvulling op artikel 5, eerste lid, van de EU-verordening, verricht een accountantsorganisatie die onderdeel
      uitmaakt van een netwerk, geen wettelijke controles bij een organisatie van openbaar belang indien:
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel24b
  - number: 24b.2.a
    text: |-
      een ander onderdeel van het netwerk dat in Nederland is gevestigd andere werkzaamheden dan controlediensten als
      bedoeld in het eerste lid verricht voor die organisatie van openbaar belang, haar gelieerde entiteiten die in
      Nederland of in een andere lidstaat zijn gevestigd of haar gelieerde entiteiten als bedoeld in het derde lid,
      onderdeel a, die gevestigd zijn in een staat die geen lidstaat is; of
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel24b
  - number: 24b.2.b
    text: |-
      een ander onderdeel van het netwerk dat niet in Nederland is gevestigd andere werkzaamheden als bedoeld in het
      eerste lid verricht voor die organisatie van openbaar belang of een aan die organisatie gelieerde entiteit die in
      Nederland is gevestigd.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel24b
  - number: 24b.3
    text: 'Voor de toepassing van het eerste en tweede lid wordt onder gelieerde entiteit verstaan:'
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel24b
  - number: 24b.3.a
    text: |-
      de rechtspersoon of vennootschap die, alleen of samen met een andere groepsmaatschappij, aan het hoofd staat van
      de groep of het groepsdeel waar de organisatie van openbaar belang deel van uitmaakt alsmede een rechtspersoon of
      vennootschap die overheersende zeggenschap kan uitoefenen op of centrale leiding heeft over een organisatie van
      openbaar belang; en
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel24b
  - number: 24b.3.b
    text: |-
      iedere dochtermaatschappij van een organisatie van openbaar belang, andere groepsmaatschappij die onder de
      organisatie van openbaar belang valt, of andere rechtspersoon of vennootschap waarop een organisatie van openbaar
      belang overheersende zeggenschap kan uitoefenen of waarover zij de centrale leiding heeft.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel24b
  - number: 24b.4
    text: De Staat der Nederlanden is geen gelieerde entiteit als bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel24b
  - number: '25'
    text: 'Een externe accountant voldoet aan:'
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel25
  - number: 25.a
    text: de standaarden, bedoeld in artikel 26 van de richtlijn, die zijn goedgekeurd door de Europese Commissie; en
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel25
  - number: 25.b
    text: |-
      bij of krachtens algemene maatregel van bestuur te stellen regels ter zake van zijn vakbekwaamheid, objectiviteit,
      professioneel-kritische instelling en integriteit.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel25
  - number: 25a.1
    text: |-
      Een externe accountant is onafhankelijk van de controlecliënt waarbij hij een wettelijke controle verricht en
      niet betrokken bij de besluitvorming van de controlecliënt, waarbij de onafhankelijkheid in ieder geval vereist is
      gedurende de periode waarop de te controleren financiële verantwoording betrekking heeft en gedurende de periode
      waarin de wettelijke controle wordt verricht.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel25a
  - number: 25a.2
    text: |-
      De externe accountant neemt maatregelen om te waarborgen dat bij de uitvoering van een wettelijke controle zijn
      onafhankelijkheid niet wordt beïnvloed door een bestaand of potentieel belangenconflict of andere directe of
      indirecte relatie, waarbij hij, de accountantsorganisatie waarbij hij werkzaam is of waaraan hij verbonden is, of,
      voor zover van toepassing, een ander onderdeel van het netwerk, beleidsbepalers van de accountantsorganisatie, of
      andere personen werkzaam onder zijn verantwoordelijkheid, betrokken is of zijn.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel25a
  - number: 25a.3
    text: |-
      De externe accountant accepteert geen betrokkenheid bij een opdracht tot een wettelijke controle of beëindigt
      deze betrokkenheid, indien er sprake is van relaties als bedoeld in het tweede lid die invloed kunnen hebben op de
      uitkomsten van de wettelijke controle, op grond waarvan een objectieve, redelijke en geïnformeerde derde partij,
      met inachtneming van de door de externe accountant getroffen maatregelen, zou concluderen dat de onafhankelijkheid
      van de externe accountant in het gedrang komt.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel25a
  - number: 25a.4
    text: |-
      De externe accountant voldoet aan bij of krachtens algemene maatregel van bestuur te stellen nadere regels ter zake
      van zijn onafhankelijkheid.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel25a
  - number: 25a.5
    text: De externe accountant legt de ingevolge het tweede of derde lid genomen maatregelen vast.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel25a
  - number: 25b
    text: Een externe accountant herstelt de tekortkomingen met betrekking tot een wettelijke controle.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel25b
  - number: '26.1'
    text: |-
      Een externe accountant die tijdens het verrichten van een wettelijke controle de beschikking krijgt over gegevens
      waarvan hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, is verplicht tot geheimhouding
      van die gegevens, behoudens voor zover hij bij of krachtens wettelijk voorschrift of bij de EU-verordening tot
      mededeling verplicht is.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel26
  - number: '26.2'
    text: |-
      Een externe accountant die tijdens het verrichten van een wettelijke controle, niet zijnde een wettelijke
      controle bij een organisatie van openbaar belang, de beschikking krijgt over gegevens of inlichtingen
      die het redelijk vermoeden rechtvaardigen dat sprake is van fraude van materieel belang ten aanzien van
      de financiële verantwoording van de controlecliënt, meldt dit aan een opsporingsambtenaar als bedoeld in
      [artikel 141 van het Wetboek van Strafvordering][ref1] behoudens in de bij algemene maatregel van bestuur te
      bepalen gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '26.3'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald wat wordt verstaan onder fraude van materieel belang en worden
      regels gesteld omtrent het tijdstip en de wijze waarop de melding, bedoeld in het tweede lid, plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel26
  - number: '26.4'
    text: |-
      De externe accountant die tot een melding als bedoeld in het tweede lid is overgegaan, is niet aansprakelijk
      voor de schade die een derde dientengevolge lijdt, tenzij aannemelijk wordt gemaakt dat gelet op alle feiten en
      omstandigheden in redelijkheid niet tot melding had mogen worden overgegaan.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel26
  - number: '26.5'
    text: |-
      Een externe accountant kan, in afwijking van het eerste lid, volgens bij of krachtens algemene maatregel van
      bestuur te stellen regels vertrouwelijke gegevens of inlichtingen, verkregen bij het verrichten van een wettelijke
      controle, verstrekken aan derden.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel26
  - number: '27.1'
    text: |-
      De externe accountant is een accountant ten aanzien van wie in het accountantsregister een aantekening is opgenomen
      als bedoeld in [artikel 36, tweede lid, onderdeel i, van de Wet op het accountantsberoep][ref1] en die voldoet
      aan de bij of krachtens de [Wet op het accountantsberoep][ref2] gestelde regels, voor zover deze van toepassing
      zijn op het uitvoeren van wettelijke controles, dan wel een wettelijke auditor als bedoeld in artikel 2, onderdeel
      2, van de richtlijn, die in een andere lidstaat is toegelaten tot het verrichten van controles als bedoeld in
      artikel 2, onderdeel 1, van de richtlijn en die beschikt over een verklaring van vakbekwaamheid als bedoeld in
      [artikel 54 van de Wet op het accountantsberoep][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0032573
      [ref3]: https://wetten.overheid.nl/BWBR0032573#Artikel54
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0032573
        artikel: '36'
      - id: ref2
        bwb_id: BWBR0032573
      - id: ref3
        bwb_id: BWBR0032573
        artikel: '54'
  - number: '27.2'
    text: |-
      Wettelijke controles bij een organisatie van openbaar belang worden verricht onder de
      verantwoordelijkheid van een externe accountant, zijnde een Registeraccountant als bedoeld in
      [artikel 41, eerste lid, van de Wet op het accountantsberoep][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel41
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0032573
        artikel: '41'
  - number: '28'
    text: |-
      Met het oog op de waarborging van de publieke functie van de accountantsverklaring kan bij algemene maatregel van
      bestuur [artikel 27][ref1] buiten toepassing worden verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel27
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '27'
        hoofdstuk: '3'
        afdeling: '3.2'
  - number: '29'
    text: |-
      De externe accountant geeft de accountantsverklaring af en ondertekent deze op eigen naam en vermeldt daarbij de
      accountantsorganisatie waarbij hij werkzaam is of waaraan hij is verbonden.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel29
  - number: 29a.1
    text: |-
      Degene die als externe accountant verantwoordelijk is geweest voor het uitvoeren van een wettelijke controle,
      aanvaardt na het beëindigen van zijn werkzaamheden als externe accountant bij die controlecliënt gedurende een
      periode van ten minste een jaar geen functie als:
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel29a
  - number: 29a.1.a
    text: beleidsbepaler bij die controlecliënt;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel29a
  - number: 29a.1.b
    text: lid van het auditcomité of een orgaan met gelijksoortige taken van die controlecliënt;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel29a
  - number: 29a.1.c
    text: lid van het toezichthoudende orgaan van die controlecliënt.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel29a
  - number: 29a.2
    text: |-
      Indien de controlecliënt een organisatie van openbaar belang is, bedraagt de periode, bedoeld in het eerste lid,
      ten minste twee jaren.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel29a
  - number: '30'
    text: |-
      Indien de externe accountant met betrekking tot het uitvoeren van werkzaamheden betreffende de totstandkoming
      of de uitvoering van een opdracht tot het verrichten van een wettelijke controle wordt betrokken in een
      tuchtrechtsgeding, meldt hij dit onverwijld aan de betrokken controlecliënt.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel30
  - number: '31.1'
    text: |-
      De externe accountant is ten aanzien van zijn beroepsmatig handelen onderworpen aan tuchtrechtspraak op de voet
      van de [Wet tuchtrechtspraak accountants][ref1] ter zake van enig handelen of nalaten in strijd met het bij of
      krachtens deze wet of de EU-verordening bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0024238
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0024238
  - number: '31.2'
    text: |-
      Deze tuchtrechtspraak wordt uitgeoefend in eerste aanleg door de accountantskamer te Zwolle en in hoger beroep,
      tevens in hoogste ressort, door het College van Beroep voor het bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel31
  - number: '38.1'
    text: |-
      De Autoriteit Financiële Markten legt een voorgenomen statutenwijziging ter voorafgaande instemming voor aan Onze
      Minister. De [artikelen 10:28 tot en met 10:31 van de Algemene wet bestuursrecht][ref1] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: '38.2'
    text: 'De instemming, bedoeld in het eerste lid, kan worden geweigerd:'
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel38
  - number: 38.2.a
    text: indien de statuten na wijziging onvoldoende zijn afgestemd op het in deze wet bepaalde;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel38
  - number: 38.2.b
    text: |-
      indien de statuten onvoldoende waarborgen bieden voor een onafhankelijke taakvervulling door de Autoriteit
      Financiële Markten;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel38
  - number: 38.2.c
    text: wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel38
  - number: '39.1'
    text: |-
      De Autoriteit Financiële Markten draagt met betrekking tot de uitoefening van haar taak op grond van deze wet zorg
      voor:
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel39
  - number: 39.1.a
    text: een tijdige voorbereiding en uitvoering;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel39
  - number: 39.1.b
    text: de kwaliteit van de daarbij gebruikte procedures;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel39
  - number: 39.1.c
    text: de zorgvuldige behandeling van een ieder die met haar in aanraking komt;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel39
  - number: 39.1.d
    text: de zorgvuldige behandeling van bezwaarschriften en klachten die worden ontvangen.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel39
  - number: '39.2'
    text: |-
      De Autoriteit Financiële Markten treft voorzieningen, waardoor ieder die met haar in aanraking komt in de
      gelegenheid is voorstellen tot verbetering van werkwijzen en procedures te doen.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel39
  - number: '43.1'
    text: |-
      Onze Minister kan aan de Autoriteit Financiële Markten de gegevens of inlichtingen vragen die nodig zijn voor een
      onderzoek naar de toereikendheid van deze wet of de wijze waarop de Autoriteit Financiële Markten deze wet uitvoert
      of heeft uitgevoerd, indien dat ter wille van het toezicht nodig blijkt.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel43
  - number: '43.2'
    text: |-
      De Autoriteit Financiële Markten verstrekt aan Onze Minister de in het eerste lid bedoelde gegevens of
      inlichtingen, tenzij het vertrouwelijke gegevens of inlichtingen betreft in de zin van artikel 63a die betrekking
      hebben op of herleidbaar zijn tot een afzonderlijke onderneming, instelling of natuurlijke persoon, met
      uitzondering van gegevens of inlichtingen die betrekking hebben op of herleidbaar zijn tot een afzonderlijke
      accountantsorganisatie of auditorganisatie van een derde land:
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel43
  - number: 43.2.a
    text: |-
      die een vergunning als bedoeld in [artikel 5, eerste lid][ref1], heeft verkregen onderscheidenlijk is ingeschreven
      op grond van [artikel 11, eerste lid][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel11
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '5'
        hoofdstuk: '2'
        afdeling: '2.1'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 43.2.b
    text: ten aanzien waarvan surseance van betaling is verleend; of
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel43
  - number: 43.2.c
    text: die in staat van faillissement is verklaard; of
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel43
  - number: 43.2.d
    text: die op grond van een rechterlijke uitspraak is ontbonden.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel43
  - number: '43.3'
    text: |-
      Onze Minister kan een derde opdragen de gegevens of inlichtingen die hem ingevolge het tweede lid zijn verstrekt
      te onderzoeken en aan hem verslag uit te brengen. Tevens kan Onze Minister de derde die in zijn opdracht
      handelt, machtigen namens hem gegevens of inlichtingen in te winnen, in welk geval het eerste en tweede lid van
      overeenkomstige toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel43
  - number: '43.4'
    text: |-
      Onze Minister gebruikt de gegevens of inlichtingen die hij ingevolge het tweede of derde lid heeft verkregen
      uitsluitend voor het vormen van zijn oordeel over de toereikendheid van deze wet of de wijze waarop de Autoriteit
      Financiële Markten deze wet uitvoert of heeft uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel43
  - number: '43.5'
    text: |-
      Onze Minister en degenen die in zijn opdracht handelen zijn verplicht tot geheimhouding van de op grond van het
      tweede lid ontvangen gegevens of inlichtingen.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel43
  - number: '43.6'
    text: |-
      Niettegenstaande het vierde en vijfde lid kan Onze Minister de aan de gegevens of inlichtingen ontleende
      bevindingen en de daaruit getrokken conclusies aan de beide kamers der Staten-Generaal mededelen en de conclusies
      in algemene zin uit het onderzoek openbaar maken.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel43
  - number: '43.7'
    text: |-
      De [Wet openbaarheid van bestuur][ref1] en de [Wet Nationale ombudsman][ref2] zijn niet van toepassing met
      betrekking tot de in dit artikel bedoelde gegevens of inlichtingen die Onze Minister of de in zijn opdracht
      werkende derde onder zich heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
      [ref2]: https://wetten.overheid.nl/BWBR0003372
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0005252
      - id: ref2
        bwb_id: BWBR0003372
  - number: '47'
    text: |-
      De leden van het bestuur van de Autoriteit Financiële Markten die het dagelijks beleid met betrekking tot het
      toezicht op de naleving van deze wet bepalen:
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel47
  - number: 47.a
    text: |-
      zijn gedurende de periode dat zij deel uitmaken van het bestuur van de Autoriteit Financiële Markten niet
      verantwoordelijk voor het uitvoeren van wettelijke controles, noch zijn zij dat geweest gedurende de drie
      onmiddellijk aan deze periode voorafgaande jaren;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel47
  - number: 47.b
    text: |-
      maken gedurende de periode dat zij deel uitmaken van het bestuur van de Autoriteit Financiële Markten geen
      deel uit van het bestuur, de dagelijkse leiding of het orgaan dat belast is met het interne toezicht van een
      accountantsorganisatie, noch hebben zij hiervan in de drie onmiddellijk aan deze periode voorafgaande jaren deel
      uitgemaakt;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel47
  - number: 47.c
    text: |-
      bezitten gedurende de periode dat zij deel uitmaken van het bestuur van de Autoriteit Financiële Markten geen
      stemrechten in een accountantsorganisatie, noch hebben zij deze rechten bezeten in de drie onmiddellijk aan deze
      periode voorafgaande jaren;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel47
  - number: 47.d
    text: |-
      zijn gedurende de periode dat zij deel uitmaken van het bestuur van de Autoriteit Financiële Markten niet werkzaam
      bij of verbonden aan een accountantsorganisatie, noch zijn zij dat geweest in de drie onmiddellijk aan deze periode
      voorafgaande jaren.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel47
  - number: '48.1'
    text: |-
      De Autoriteit Financiële Markten houdt bij de uitvoering van het toezicht op de naleving van deze wet
      rekening met de uitkomsten van de beoordeling van de werking van door accountantsorganisaties gehanteerde
      stelsels van kwaliteitsbeheersing door andere organisaties, waaronder het openbare lichaam, bedoeld in
      [artikel 2, eerste lid, van de Wet op het accountantsberoep][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel2
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0032573
        artikel: '2'
  - number: '48.2'
    text: Bij of krachtens algemene maatregel van bestuur kunnen terzake van het eerste lid regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel48
  - number: 48a.1
    text: |-
      De Autoriteit Financiële Markten beoordeelt ten minste eenmaal in de zes jaar, of zoveel vaker als nodig is op
      basis van een risicoanalyse, of een accountantsorganisatie voldoet aan het bij of krachtens deze wet en de EU-
      verordening bepaalde.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel48a
  - number: 48a.2
    text: |-
      Indien een accountantsorganisatie wettelijke controles verricht bij organisaties van openbaar belang, beoordeelt
      de Autoriteit Financiële Markten, in afwijking van het eerste lid, ten minste eenmaal in de drie jaar of die
      organisatie voldoet aan het bij of krachtens deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel48a
  - number: 48a.3
    text: |-
      De Autoriteit Financiële Markten baseert haar beoordeling ten minste op een toetsing van een selectie van
      controledossiers.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel48a
  - number: 48a.4
    text: |-
      De beoordeling, bedoeld in het derde lid, is passend en evenredig ten opzichte van de schaal
      en complexiteit van de activiteit van de accountantsorganisatie. Bij de beoordeling van
      accountantsorganisaties die wettelijke controles verrichten bij middelgrote ondernemingen, bedoeld in
      [artikel 397, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1], wordt er rekening mee gehouden dat de
      internationale controlestandaarden, bedoeld in artikel 26 van de richtlijn, worden toegepast op een wijze die
      evenredig is met de omvang en complexiteit van de activiteiten van de controlecliënt.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel397
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '397'
  - number: 48a.5
    text: |-
      De Autoriteit Financiële Markten stelt een verslag op waarin de voornaamste conclusies van de beoordeling zijn
      opgenomen en verstrekt daarvan een afschrift aan de desbetreffende accountantsorganisatie.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel48a
  - number: 48a.6
    text: |-
      De Autoriteit Financiële Markten kan in afwijking van [artikel 63a][ref1] de voornaamste bevindingen en conclusies
      van beoordelingen als bedoeld in het vijfde lid openbaar maken, met dien verstande dat die bevindingen en
      conclusies niet herleidbaar zijn tot andere personen dan de betrokken accountantsorganisaties.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel63a
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: 63a
        hoofdstuk: 5a
  - number: 48a.7
    text: |-
      Indien de Autoriteit Financiële Markten op grond van het zesde lid bevindingen en conclusies openbaar maakt die
      mede zijn gebaseerd op een controledossier dat betrekking heeft op een organisatie van openbaar belang, doet de
      accountantsorganisatie mededeling aan het auditcomité van die organisatie van openbaar belang van de voornaamste
      bevindingen en conclusies uit het verslag bedoeld in het vijfde lid ten aanzien van dat controledossier. De
      accountantsorganisatie doet de mededeling binnen tien werkdagen na de openbaarmaking.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel48a
  - number: 48a.8
    text: |-
      De accountantsorganisatie stuurt onverwijld een afschrift van de mededeling, bedoeld in het zevende lid, aan de
      Autoriteit Financiële Markten.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel48a
  - number: 48b.1
    text: |-
      Alvorens over te gaan tot openbaarmaking van gegevens als bedoeld in [artikel 48a, zesde lid][ref1], neemt de
      Autoriteit Financiële Markten een besluit tot openbaarmaking. Dit besluit bevat de openbaar te maken gegevens en de
      wijze en termijn waarop de openbaarmaking zal plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel48a
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel48b
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: 48a
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 48b.2
    text: |-
      De Autoriteit Financiële Markten gaat pas over tot openbaarmaking op grond van [artikel 48a, zesde lid][ref1],
      nadat tien werkdagen zijn verstreken na de dag waarop het besluit tot openbaarmaking aan de betrokken
      accountantsorganisatie is bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel48a
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel48b
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: 48a
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 48b.3
    text: |-
      Indien wordt verzocht om een voorlopige voorziening als bedoeld in
      [artikel 8:81 van de Algemene wet bestuursrecht][ref1] om openbaarmaking op grond van
      [artikel 48a, zesde lid][ref2], te voorkomen, wordt de openbaarmaking opgeschort totdat er een uitspraak is van
      de voorzieningenrechter.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel48a
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel48b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: 48a
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 48b.4
    text: |-
      De Autoriteit Financiële Markten beëindigt het openbaar beschikbaar houden van gegevens die tot afzonderlijke
      accountantsorganisaties herleidbaar zijn op grond van [artikel 48a, zesde lid][ref1], onverwijld indien en voor
      zover:


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel48a
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel48b
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: 48a
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 48b.4.a
    text: het besluit tot openbaarmaking wordt ingetrokken; of
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel48b
  - number: 48b.4.b
    text: het besluit tot openbaarmaking door de bestuursrechter onherroepelijk is vernietigd.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel48b
  - number: 48b.5
    text: |-
      In de gevallen bedoeld in het vierde lid, biedt de Autoriteit Financiële Markten de betrokken
      accountantsorganisatie aan de intrekking of de vernietiging openbaar te maken.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel48b
  - number: 48c.1
    text: |-
      Alvorens over te gaan tot publicatie op grond van [artikel 48a, zesde lid][ref1], stelt de Autoriteit Financiële
      Markten elk van de betrokken accountantsorganisaties in de gelegenheid om binnen tien werkdagen na bekendmaking van
      het besluit tot openbaarmaking een schriftelijke reactie te geven op gegevens die openbaar worden gemaakt die op
      haar betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel48a
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel48c
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: 48a
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 48c.2
    text: |-
      De Autoriteit Financiële Markten maakt de schriftelijke reactie of een zakelijke weergave ervan gelijktijdig
      openbaar met de bevindingen en conclusies waarop de reactie betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel48c
  - number: 48c.3
    text: |-
      Bij het openbaar maken van de schriftelijke reactie maakt de Autoriteit Financiële Markten geen gegevens openbaar
      die herleidbaar zijn tot andere personen dan de betrokken accountantsorganisatie.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel48c
  - number: 48d
    text: |-
      De Autoriteit Financiële Markten maakt op grond van [artikel 48a, zesde lid][ref1], geen gegevens openbaar, voor
      zover:


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel48a
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel48d
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: 48a
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 48d.a
    text: |-
      die gegevens herleidbaar zijn tot een natuurlijk persoon en bekendmaking van zijn persoonlijke gegevens onevenredig
      zou zijn;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel48d
  - number: 48d.b
    text: betrokken partijen in onevenredige mate schade zou worden berokkend;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel48d
  - number: 48d.c
    text: een lopend strafrechtelijk onderzoek zou worden ondermijnd;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel48d
  - number: 48d.d
    text: de stabiliteit van het financiële stelsel in gevaar zou worden gebracht; of
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel48d
  - number: 48d.e
    text: openbaarmaking in strijd is of zou kunnen komen met de belangen die deze wet beoogt te beschermen.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel48d
  - number: 48e.1
    text: |-
      Indien wordt verzocht om een voorlopige voorziening als bedoeld in
      [artikel 8:81 van de Algemene wet bestuursrecht][ref1] om openbaarmaking op grond van
      [artikel 48a, zesde lid][ref2], te voorkomen, vindt het onderzoek ter zitting plaats met gesloten deuren.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel48a
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel48e
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: 48a
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 48e.2
    text: |-
      Indien de voorzieningenrechter openbaarmaking op grond van [artikel 48a, zesde lid][ref1], heeft verboden vindt
      het horen van belanghebbenden ter zake van het bezwaar tegen het besluit tot openbaarmaking niet in het openbaar
      plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel48a
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel48e
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: 48a
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 48e.3
    text: |-
      Indien de voorzieningenrechter openbaarmaking op grond van [artikel 48a, zesde lid][ref1], heeft verboden en beroep
      of hoger beroep wordt ingesteld tegen het besluit tot openbaarmaking vindt het onderzoek ter zitting plaats met
      gesloten deuren.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel48a
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel48e
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: 48a
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '49.1'
    text: |-
      Met het toezicht op de naleving van de bij en krachtens deze wet of bij de EU-verordening gestelde regels zijn
      belast de bij besluit van de Autoriteit Financiële Markten aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel49
  - number: '49.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel49
  - number: 49a
    text: |-
      Een door de Autoriteit Financiële Markten op grond van [artikel 49][ref1] aangewezen persoon die belast is met de
      beoordeling van een accountantsorganisatie, bedoeld in [artikel 48a, eerste en tweede lid][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel48a
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel49a
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '49'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: 48a
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 49a.a
    text: |-
      beschikt over passende beroepskwalificaties en relevante beroepservaring op het gebied van wettelijke controles en
      heeft een specifieke opleiding voor de uitvoering van kwaliteitsbeoordelingen genoten;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel49a
  - number: 49a.b
    text: |-
      is gedurende de drie jaren voorafgaand aan de beoordeling niet werkzaam geweest of verbonden aan die
      accountantsorganisatie; en
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel49a
  - number: 49a.c
    text: |-
      verklaart, voorafgaande aan de beoordeling, dat tussen hem en de te beoordelen accountantsorganisatie geen
      belangenconflicten bestaan.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel49a
  - number: '50'
    text: |-
      De personen, bedoeld in het [eerste lid van artikel 49][ref1], beschikken niet over de bevoegdheden, genoemd in de
      [artikelen 5:18][ref2] en [5:19 van de Algemene wet bestuursrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '49'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '51.1'
    text: |-
      De Autoriteit Financiële Markten kan ten behoeve van de juiste uitvoering van haar bij of krachtens deze wet
      geregelde taken en bevoegdheden van een ieder inlichtingen vorderen.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel51
  - number: '51.2'
    text: |-
      De [artikelen 5:13][ref1] en [5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref2] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '51.3'
    text: |-
      De Autoriteit Financiële Markten is bevoegd tot toepassing van
      [artikel 5:20, derde lid, van de Algemene wet bestuursrecht][ref1] ten aanzien van de vordering, bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 51a
    text: De Autoriteit Financiële Markten is belast met de uitvoering en handhaving van de EU-verordening.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel51a
  - number: '52'
    text: |-
      De Autoriteit Financiële Markten kan de accountantsorganisatie waaraan een vergunning is verleend die niet
      voldoet aan hetgeen bij of krachtens deze wet of bij de EU-verordening is bepaald, of het hiërarchisch hoogste
      netwerkonderdeel met zetel in Nederland dat invloed uitoefent op het beleid van de accountantsorganisatie dat niet
      voldoet aan hetgeen bij of krachtens de [artikelen 16][ref1] en [22a][ref2] van de wet is bepaald, door middel van
      het geven van een aanwijzing verplichten om binnen een door de Autoriteit Financiële Markten gestelde redelijke
      termijn ten aanzien van in de aanwijzingsbeschikking aan te geven punten een bepaalde gedragslijn te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel22a
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '16'
