  - number: '1.2'
    text: De bijlage, bedoeld in het eerste lid, onderdeel p, kan worden gewijzigd bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel1
  - number: '2.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden categorieën van ondernemingen, instellingen of openbare
      lichamen aangewezen wier omvang of functie in het maatschappelijk verkeer van zodanige aard is dat een ondeugdelijk
      uitgevoerde wettelijke controle van de financiële verantwoording een aanmerkelijke invloed kan hebben op het
      vertrouwen in de publieke functie van de accountantsverklaring.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel2
  - number: '2.2'
    text: |-
      Op de wettelijke controle van aangewezen categorieën van ondernemingen, instellingen of openbare lichamen als
      bedoeld in het eerste lid zijn de bepalingen betreffende wettelijke controles bij organisaties van openbaar
      belang uit de verordening van overeenkomstige toepassing voor zover daar bij of krachtens deze wet niet van wordt
      afgeweken.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel2
  - number: '3'
    text: |-
      Bij algemene maatregel van bestuur, op voordracht van Onze Minister en Onze Minister wie het mede aangaat, kunnen
      vrijwillige controles worden aangewezen waarop deze wet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel3
  - number: '4'
    text: |-
      De voordracht voor een algemene maatregel van bestuur als bedoeld in de [artikelen 2][ref1],
      [3][ref2], [11, derde lid][ref3], [15, tweede lid][ref4], [18, derde lid][ref5], [19, derde lid][ref6],
      [21, tweede lid][ref7], [22][ref8], [25][ref9], [25a, derde lid][ref10], [26, tweede en derde lid][ref11], en
      [28][ref12] wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is
      overgelegd.


