  - number: '54.2'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de uitoefening van de bevoegdheid,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel54
  - number: '55.1'
    text: |-
      Het bedrag van de bestuurlijke boete wordt bepaald bij algemene maatregel van bestuur, met dien verstande dat
      de bestuurlijke boete voor een afzonderlijke overtreding ten hoogste € 4 000 000 bedraagt. Indien tijdens het
      plegen van de overtreding nog geen vijf jaren zijn verlopen sedert het opleggen van een bestuurlijke boete aan de
      overtreder ter zake van eenzelfde overtreding, wordt het bedrag van de bestuurlijke boete, bedoeld in de eerste
      volzin, voor een afzonderlijke overtreding verdubbeld.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel55
  - number: '55.2'
    text: |-
      De algemene maatregel van bestuur, bedoeld in het eerste lid, bepaalt bij elke daarin omschreven overtreding het
      bedrag van de deswege op te leggen bestuurlijke boete. De overtredingen worden gerangschikt in categorieën naar
      zwaarte van de overtreding met de daarbij behorende basisbedragen, minimumbedragen en maximumbedragen. Daarbij
      wordt de volgende indeling gebruikt:








                    Categorie


                    Basisbedrag


                    Minimumbedrag


                    Maximumbedrag






                    1


                    € 10 000,–


                    € 0,–


                    € 10 000,–




                    2


                    € 500 000,–


                    € 0,–


                    € 1 000 000,–




                    3


                    € 2 000 000,–


                    € 0,–


                    € 4 000 000,–
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel55
  - number: '55.3'
    text: |-
      In afwijking van het eerste en tweede lid kan de toezichthouder de hoogte van de bestuurlijke boete vaststellen
      op ten hoogste twee keer het bedrag van het voordeel dat de overtreder door de overtreding heeft verkregen indien
      diens voordeel groter is dan € 2 000 000.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel55
  - number: '56.1'
    text: |-
      Indien tegen een besluit tot het opleggen van een bestuurlijke boete bezwaar of beroep wordt aangetekend, schorst
      dit de verplichting tot betaling van de bestuurlijke boete totdat de beroepstermijn is verstreken of, indien beroep
      is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel56
  - number: '56.2'
    text: |-
      De schorsing van de verplichting tot betaling van de bestuurlijke boete schorst niet de berekening van de
      wettelijke rente.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel56
  - number: '57.1'
    text: |-
      De Autoriteit Financiële Markten kan bij overtreding van een voorschrift van hetgeen bij of krachtens deze wet
      of de EU-verordening is bepaald en dat op grond van [artikel 55][ref1] beboetbaar is met een boete van de derde
      categorie, een dagelijks beleidsbepaler van een organisatie van openbaar belang, of een dagelijks beleidsbepaler
      van een accountantsorganisatie de bevoegdheid ontzeggen om bij een accountantsorganisatie of een organisatie van
      openbaar belang bepaalde functies uit te oefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel55
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '55'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '57.2'
    text: Een ontzegging als bedoeld in het eerste lid kan worden opgelegd voor de duur van ten hoogste drie jaar.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel57
  - number: '58.1'
    text: |-
      De Autoriteit Financiële Markten kan ter zake van een overtreding van hetgeen bij of krachtens deze wet of de EU-
      verordening is bepaald die op grond van [artikel 55][ref1] beboetbaar is met een boete van de derde categorie,
      bepalen dat een accountantsorganisatie die wettelijke controles verricht bij een organisatie van openbaar belang
      niet langer bevoegd is wettelijke controles te verrichten bij die controlecliënt.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel55
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '55'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '58.2'
    text: |-
      De Autoriteit Financiële Markten stelt de accountantsorganisatie en de controlecliënt, bedoeld in het eerste lid,
      voorafgaand in de gelegenheid om hun zienswijze naar voren te brengen over haar voornemen om een besluit te nemen
      als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel58
  - number: '58.3'
    text: |-
      Een besluit als bedoeld in het eerste lid treedt niet eerder in werking dan met ingang van de dag na afloop
      van de termijn, bedoeld in [artikel 6:7 van de Algemene wet bestuursrecht][ref1], voor het indienen van een
      bezwaarschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '58.4'
    text: |-
      Indien gedurende de in het derde lid bedoelde termijn bij de bevoegde rechter een verzoek om voorlopige voorziening
      is gedaan, treedt een besluit als bedoeld in het eerste lid in afwijking van het derde lid, niet eerder in werking
      dan dat op dat verzoek is beslist.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel58
  - number: '58.5'
    text: |-
      De Autoriteit Financiële Markten deelt het besluit als bedoeld in het eerste lid onverwijld mee aan de
      controlecliënt.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel58
  - number: 63a.1
    text: |-
      Het is een ieder die uit hoofde van de toepassing van deze wet of van ingevolge deze wet genomen besluiten enige
      taak vervult of heeft vervuld, verboden van vertrouwelijke gegevens of inlichtingen die ingevolge deze wet dan wel
      ingevolge [afdeling 5.2 van de Algemene wet bestuursrecht][ref1] zijn verstrekt of verkregen of van instanties die
      belast zijn met het toezicht op auditkantoren in een andere lidstaat zijn ontvangen, verder of anders gebruik te
      maken of daaraan verder of anders bekendheid te geven dan voor de uitvoering van zijn taak of op basis van deze wet
      noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling5.2
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '5.2'
  - number: 63a.2
    text: |-
      In afwijking van het eerste lid kan de Autoriteit Financiële Markten met gebruikmaking van vertrouwelijke gegevens
      of inlichtingen, verkregen bij de uitvoering van haar taak op grond van deze wet, mededelingen doen, indien deze
      niet kunnen worden herleid tot afzonderlijke personen, accountantsorganisaties of auditkantoren.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63a
  - number: 63b.1
    text: |-
      De Autoriteit Financiële Markten kan, in afwijking van [artikel 63a][ref1], vertrouwelijke gegevens of inlichtingen
      verkregen bij de vervulling van de haar ingevolge deze wet opgedragen taak, verstrekken aan De Nederlandsche Bank
      N.V., tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel63a
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63b
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: 63a
        hoofdstuk: 5a
  - number: 63b.1.a
    text: het doel waarvoor de vertrouwelijke gegevens of inlichtingen zullen worden gebruikt onvoldoende bepaald is;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63b
  - number: 63b.1.b
    text: |-
      het beoogde gebruik van de vertrouwelijke gegevens of inlichtingen niet past in het kader van het toezicht op
      financiële markten of op personen die op die markten werkzaam zijn;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63b
  - number: 63b.1.c
    text: |-
      de verstrekking van de vertrouwelijke gegevens of inlichtingen zich niet zou verdragen met de Nederlandse wet of de
      openbare orde;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63b
  - number: 63b.1.d
    text: de geheimhouding van de vertrouwelijke gegevens of inlichtingen niet in voldoende mate is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63b
  - number: 63b.1.e
    text: |-
      de verstrekking van de vertrouwelijke gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen komen met
      de belangen die deze wet beoogt te beschermen; of
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63b
  - number: 63b.1.f
    text: |-
      onvoldoende is gewaarborgd dat de vertrouwelijke gegevens of inlichtingen niet zullen worden gebruikt voor een
      ander doel dan waarvoor deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63b
  - number: 63b.2
    text: |-
      Voor zover de gegevens of inlichtingen, bedoeld in het eerste lid, zijn verkregen van een toezichthoudende
      instantie, verstrekt de Autoriteit Financiële Markten deze niet aan De Nederlandsche Bank N.V., tenzij de
      toezichthoudende instantie waarvan de gegevens of inlichtingen zijn verkregen uitdrukkelijk heeft ingestemd met
      de verstrekking van gegevens of inlichtingen en in voorkomend geval heeft ingestemd met het gebruik voor een ander
      doel dan waarvoor de gegevens of inlichtingen zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63b
  - number: 63b.3
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op het uitwisselen van vertrouwelijke gegevens of
      inlichtingen tussen de met verschillende taken belaste onderdelen van de Autoriteit Financiële Markten.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63b
  - number: 63c.1
    text: |-
      De Autoriteit Financiële Markten kan, in afwijking van [artikel 63a, eerste lid][ref1], vertrouwelijke gegevens
      of inlichtingen verkregen bij de uitvoering van de haar ingevolge deze wet opgedragen taak die betrekking hebben
      op overtredingen door accountantsorganisaties van [artikel 5, eerste lid][ref2], of [6, derde lid][ref3], van deze
      wet, verstrekken aan een Nederlandse instantie die is belast met de uitoefening van strafvorderlijke bevoegdheden
      of aan een deskundige die door een dergelijke instantie met een opdracht is belast, voor zover de verlangde
      gegevens of inlichtingen noodzakelijk zijn voor de uitoefening van die bevoegdheden of de uitvoering van die
      opdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel63a
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0019468#Artikel6
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63c
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: 63a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0019468
        artikel: '5'
        hoofdstuk: '2'
        afdeling: '2.1'
      - id: ref3
        bwb_id: BWBR0019468
        artikel: '6'
        hoofdstuk: '2'
        afdeling: '2.1'
  - number: 63c.2
    text: |-
      Indien de instantie, bedoeld in het eerste lid, het voornemen heeft toepassing te geven aan de bevoegdheid
      tot het bij de Autoriteit Financiële Markten vorderen van de uitlevering van een voor inbeslagneming vatbaar
      voorwerp of aan de bevoegdheid tot het vorderen van de inzage of een afschrift van bescheiden als bedoeld in
      [artikel 96a][ref1], [105][ref2] of [126a van het Wetboek van Strafvordering][ref3], of [artikel 18][ref4] of
      [19 van de Wet op de economische delicten][ref5], en de vordering betreft vertrouwelijke gegevens of inlichtingen
      als bedoeld in [artikel 2:5 van de Algemene wet bestuursrecht][ref6], stelt die instantie voorafgaand aan de
      uitoefening van haar bevoegdheid de Autoriteit Financiële Markten in de gelegenheid haar zienswijze hierover
      kenbaar te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel96a
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel105
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel126a
      [ref4]: https://wetten.overheid.nl/BWBR0002063#Artikel18
      [ref5]: https://wetten.overheid.nl/BWBR0002063#Artikel19
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63c
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 96a
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '105'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: 126a
      - id: ref4
        bwb_id: BWBR0002063
        artikel: '18'
      - id: ref5
        bwb_id: BWBR0002063
        artikel: '19'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '2'
  - number: 63cc.1
    text: |-
      De Autoriteit Financiële Markten kan, in afwijking van [artikel 63a, eerste lid][ref1], vertrouwelijke gegevens
      of inlichtingen verkregen bij de vervulling van de haar ingevolge deze wet opgedragen taak, verstrekken aan de
      Algemene Inlichtingen- en Veiligheidsdienst, de Belastingdienst, de Fiscale Inlichtingen- en Opsporingsdienst,
      de Nationale Politie, het Bureau Financieel Toezicht, de Financiële Inlichtingen Eenheid en het Openbaar
      Ministerie, voor zover dit dienstig is voor het versterken van de integriteit van de financiële markten of
      accountantsorganisaties.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel63a
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63cc
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: 63a
        hoofdstuk: 5a
  - number: 63cc.2
    text: |-
      De Autoriteit Financiële Markten verstrekt geen gegevens of inlichtingen die herleidbaar zijn tot andere personen
      dan accountantsorganisaties of externe accountants.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63cc
  - number: 63cc.3
    text: |-
      De Autoriteit Financiële Markten verstrekt geen vertrouwelijke gegevens of inlichtingen op grond van het eerste
      lid indien:
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63cc
  - number: 63cc.3.a
    text: het doel waarvoor de vertrouwelijke gegevens of inlichtingen zullen worden gebruikt onvoldoende bepaald is;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63cc
  - number: 63cc.3.b
    text: |-
      het beoogde gebruik van de vertrouwelijke gegevens of inlichtingen niet past in het kader van het toezicht op
      financiële markten, of het toezicht op basis van deze wet;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63cc
  - number: 63cc.3.c
    text: |-
      de verstrekking van de vertrouwelijke gegevens of inlichtingen zich niet zou verdragen met de Nederlandse wet of de
      openbare orde;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63cc
  - number: 63cc.3.d
    text: de geheimhouding van de vertrouwelijke gegevens of inlichtingen niet in voldoende mate is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63cc
  - number: 63cc.3.e
    text: |-
      de verstrekking van de vertrouwelijke gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen komen met
      de belangen die deze wet beoogt te beschermen; of
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63cc
  - number: 63cc.3.f
    text: |-
      onvoldoende is gewaarborgd dat de vertrouwelijke gegevens of inlichtingen niet zullen worden gebruikt voor een
      ander doel dan waarvoor deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63cc
  - number: 63cc.4
    text: |-
      Voor zover de gegevens of inlichtingen, bedoeld in het eerste lid, zijn verkregen van een toezichthoudende
      instantie, verstrekt de Autoriteit Financiële Markten deze niet aan een andere toezichthoudende instantie, tenzij
      de toezichthoudende instantie waarvan de gegevens of inlichtingen zijn verkregen uitdrukkelijk heeft ingestemd met
      de verstrekking van de gegevens of inlichtingen en in voorkomend geval heeft ingestemd met het gebruik voor een
      ander doel dan waarvoor de gegevens of inlichtingen zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63cc
  - number: 63cc.5
    text: |-
      Indien een instantie als bedoeld in het eerste lid aan de Autoriteit Financiële Markten die de vertrouwelijke
      gegevens of inlichtingen op grond van dat lid heeft verstrekt, verzoekt om die vertrouwelijke gegevens of
      inlichtingen te mogen gebruiken voor een ander doel dan waarvoor zij zijn verstrekt, willigt de Autoriteit
      Financiële Markten dat verzoek slechts in:
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63cc
  - number: 63cc.5.a
    text: indien het beoogde gebruik niet in strijd is met het eerste, tweede, derde of vierde lid; en
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63cc
  - number: 63cc.5.b
    text: |-
      voor zover die instantie op een andere wijze dan in deze wet voorzien met inachtneming van de daarvoor geldende
      wettelijke procedures voor dat andere doel de beschikking over die gegevens of inlichtingen zou kunnen verkrijgen.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63cc
  - number: 63d.1
    text: |-
      De Autoriteit Financiële Markten kan, in afwijking van [artikel 63a][ref1], vertrouwelijke gegevens of inlichtingen
      verkregen bij de vervulling van de haar ingevolge deze wet opgedragen taak, verstrekken aan de accountantskamer,
      bedoeld in [artikel 31, tweede lid][ref2], of het College van Beroep voor het bedrijfsleven.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel63a
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel31
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63d
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: 63a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0019468
        artikel: '31'
        hoofdstuk: '3'
        afdeling: '3.2'
  - number: 63d.2
    text: |-
      De Autoriteit Financiële Markten verstrekt geen vertrouwelijke gegevens of inlichtingen als bedoeld in het eerste
      lid indien de verstrekking van de vertrouwelijke gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen
      komen met de belangen die deze wet beoogt te beschermen.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63d
  - number: 63e.1
    text: |-
      De Autoriteit Financiële Markten kan, in afwijking van [artikel 63a][ref1], vertrouwelijke gegevens of inlichtingen
      verkregen bij de vervulling van de haar ingevolge deze wet opgedragen taak, verstrekken aan:


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel63a
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63e
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: 63a
        hoofdstuk: 5a
  - number: 63e.1.a
    text: |-
      de Nederlandse beroepsorganisatie van accountants, bedoeld in [artikel 2 van de Wet op het Accountantsberoep][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel2
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63e
    references:
      - id: ref1
        bwb_id: BWBR0032573
        artikel: '2'
  - number: 63e.1.b
    text: |-
      een organisatorisch verband van marktpartijen, dat zich ten doel stelt een doeltreffende bijdrage te leveren aan
      de uitvoering door de Autoriteit Financiële Markten van het toezicht op de naleving van deze wet en daartoe met de
      Autoriteit Financiële Markten een convenant heeft gesloten;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63e
  - number: 63e.2
    text: |-
      Voor zover de gegevens of inlichtingen, bedoeld in het eerste lid, zijn verkregen van een toezichthoudende
      instantie, verstrekt de Autoriteit Financiële Markten deze niet aan een instantie als bedoeld in het eerste
      lid, tenzij de toezichthoudende instantie waarvan de gegevens of inlichtingen zijn verkregen uitdrukkelijk heeft
      ingestemd met de verstrekking van de gegevens of inlichtingen en in voorkomend geval heeft ingestemd met het
      gebruik voor een ander doel dan waarvoor de gegevens of inlichtingen zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63e
  - number: 63f.1
    text: |-
      De Autoriteit Financiële Markten werkt samen met toezichthoudende instanties van andere lidstaten, indien dat
      voor het vervullen van haar taak op grond van deze wet of voor de vervulling van de taak van die toezichthoudende
      instanties nodig is.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63f
  - number: 63f.2
    text: |-
      De Autoriteit Financiële Markten verstrekt, in afwijking van [artikel 63a, eerste lid][ref1], op verzoek van een
      toezichthoudende instantie van een andere lidstaat onverwijld vertrouwelijke gegevens of inlichtingen die voor de
      vervulling van de taak van die toezichthoudende instantie nodig zijn, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel63a
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63f
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: 63a
        hoofdstuk: 5a
  - number: 63f.2.a
    text: |-
      een dergelijke verstrekking gevaar zou kunnen opleveren voor de Nederlandse soevereiniteit, nationale veiligheid of
      openbare orde;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63f
  - number: 63f.2.b
    text: |-
      de gegevens of inlichtingen betrekking hebben op handelingen van een accountantsorganisatie of andere personen
      waartegen in Nederland reeds een strafrechtelijke procedure is ingesteld;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63f
  - number: 63f.2.c
    text: |-
      door dezelfde accountantsorganisatie of andere personen een beroep is ingesteld tegen een bestuurlijke boete ten
      aanzien van dezelfde handelingen;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63f
  - number: 63f.2.d
    text: |-
      met betrekking tot dezelfde handelingen en dezelfde accountantsorganisatie door de Autoriteit Financiële Markten
      een onherroepelijk besluit is genomen; of
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63f
  - number: 63f.2.e
    text: |-
      met betrekking tot dezelfde handeling tegen dezelfde accountant, voor zover het een accountant betreft als
      bedoeld in [artikel 1, van de Wet op het accountantsberoep][ref1], een klacht is ingediend bij de accountantskamer
      overeenkomstig [artikel 22, eerste lid, van de Wet tuchtrechtspraak accountants][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0024238#Artikel22
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63f
    references:
      - id: ref1
        bwb_id: BWBR0032573
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0024238
        artikel: '22'
  - number: 63f.3
    text: |-
      Indien de Autoriteit Financiële Markten de gevraagde gegevens of inlichtingen niet onverwijld kan verstrekken,
      stelt zij de toezichthoudende instantie van de andere lidstaat hiervan in kennis.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63f
  - number: 63f.4
    text: |-
      Het tweede lid is niet van toepassing op het verstrekken van vertrouwelijke gegevens en inlichtingen door de
      Autoriteit Financiële Markten in overeenstemming met artikel 31, derde lid, van de EU-verordening.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63f
  - number: 63g.1
    text: |-
      De Autoriteit Financiële Markten kan ter uitvoering van haar taak op grond van [artikel 63f][ref1]
      van een ieder inlichtingen vorderen, indien dat voor de vervulling van de taak van een
      toezichthoudende instantie in een andere lidstaat nodig is. De artikelen [5:13][ref2] en
      [5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel63f
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63g
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: 63f
        hoofdstuk: 5c
        afdeling: 5c.1
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 63g.2
    text: |-
      Ten behoeve van de in het eerste lid bedoelde taak beschikken de personen, bedoeld in
      [artikel 49, eerste lid][ref1], over de bevoegdheden, genoemd in de [artikelen 5:15][ref2], [5:16][ref3],
      [5:16a][ref4] en [5:17 van de Algemene wet bestuursrecht][ref5]. De [artikelen 5:12][ref6], [5:13][ref7] en
      [5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref8] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref8]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63g
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '49'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref7
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref8
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 63g.3
    text: |-
      De Autoriteit Financiële Markten is bevoegd tot toepassing van
      [artikel 5:20, derde lid, van de Algemene wet bestuursrecht][ref1] ten aanzien van de in het eerste lid bedoelde
      vordering en de in het tweede lid bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63g
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 63h.1
    text: |-
      Indien een toezichthoudende instantie van een andere lidstaat ten behoeve van het toezicht op een auditkantoor in
      die staat de Autoriteit Financiële Markten verzoekt in Nederland een onderzoek te verrichten of in de gelegenheid
      te worden gesteld om bij dit onderzoek aanwezig te zijn, geeft de Autoriteit Financiële Markten aan dit verzoek
      gevolg, tenzij:
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63h
  - number: 63h.1.a
    text: |-
      een dergelijk onderzoek gevaar zou kunnen opleveren voor de Nederlandse soevereiniteit, nationale veiligheid of
      openbare orde; of
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63h
  - number: 63h.1.b
    text: |-
      met betrekking tot dezelfde handelingen tegen dezelfde accountantsorganisatie, auditkantoor of andere personen
      reeds in Nederland een strafrechtelijke procedure is ingesteld;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63h
  - number: 63h.1.c
    text: |-
      door dezelfde accountantsorganisatie, auditkantoor of andere personen een beroep is ingesteld tegen een
      bestuurlijke boete ten aanzien van dezelfde handelingen;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63h
  - number: 63h.1.d
    text: |-
      met betrekking tot dezelfde handelingen en dezelfde accountantsorganisatie of auditkantoor door de Autoriteit
      Financiële Markten een onherroepelijk besluit is genomen; of
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63h
  - number: 63h.1.e
    text: |-
      met betrekking tot dezelfde handeling tegen dezelfde accountant, voor zover het een accountant betreft als
      bedoeld in [artikel 1, van de Wet op het accountantsberoep][ref1], een klacht is ingediend bij de accountantskamer
      overeenkomstig [artikel 22, eerste lid, van de Wet tuchtrechtspraak accountants][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0024238#Artikel22
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63h
    references:
      - id: ref1
        bwb_id: BWBR0032573
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0024238
        artikel: '22'
  - number: 63h.2
    text: |-
      De Autoriteit Financiële Markten kan ten behoeve van een onderzoek als bedoeld in het
      eerste lid bij eenieder inlichtingen vorderen. De [artikelen 5:13][ref1], [5:17][ref2] en
      [5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63h
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 63h.3
    text: |-
      De Autoriteit Financiële Markten is bevoegd tot toepassing van
      [artikel 5:20, derde lid, van de Algemene wet bestuursrecht][ref1] ten aanzien van het in het eerste lid bedoelde
      onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63h
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 63i.1
    text: |-
      Indien de Autoriteit Financiële Markten vaststelt dat er in een andere lidstaat handelingen worden of zijn
      uitgevoerd die strijdig zijn met hetgeen ingevolge de richtlijn in die lidstaat is voorgeschreven, geeft zij
      hiervan op zo specifiek mogelijke wijze kennis aan de toezichthoudende instantie van de andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63i
  - number: 63i.2
    text: |-
      Indien de Autoriteit Financiële Markten een kennisgeving heeft ontvangen van een toezichthoudende instantie van
      een andere lidstaat dat er in Nederland handelingen worden of zijn uitgevoerd die strijdig zijn met deze wet, stelt
      zij de kennisgevende toezichthoudende instantie in kennis van de door haar genomen maatregelen, voor zover van
      toepassing, alsmede, voorzover mogelijk, van belangrijke tussentijdse ontwikkelingen.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63i
  - number: 63j.1
    text: |-
      De Autoriteit Financiële Markten kan, in afwijking van [artikel 63a, eerste lid][ref1], en met inachtneming van
      het tweede lid, op verzoek van een toezichthoudende instantie van een staat die geen lidstaat is, vertrouwelijke
      gegevens of inlichtingen aan die toezichthoudende instantie verstrekken die betrekking hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel63a
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63j
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: 63a
        hoofdstuk: 5a
  - number: 63j.1.a
    text: |-
      de controles bij ondernemingen die effecten hebben uitgegeven in de betrokken staat of die onderdeel uitmaken van
      een groep die is onderworpen aan een controle van geconsolideerde jaarrekeningen in die staat; of
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63j
  - number: 63j.1.b
    text: |-
      het bepaalde bij of krachtens [hoofdstuk 3][ref1] van deze wet, voor zover relevant voor de uitvoering van de onder
      a bedoelde controles.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63j
    references:
      - id: ref1
        bwb_id: BWBR0019468
        hoofdstuk: '3'
  - number: 63j.2
    text: |-
      De Autoriteit Financiële Markten kan vertrouwelijke gegevens en inlichtingen als bedoeld in het eerste lid
      uitsluitend verstrekken, indien:
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63j
  - number: 63j.2.a
    text: dat voor de vervulling van haar taak op grond van deze wet of de taak van die toezichthoudende instantie nodig is;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63j
  - number: 63j.2.b
    text: |-
      die toezichthoudende instantie voldoet aan eisen die de Europese Commissie overeenkomstig het bepaalde in
      artikel 47, derde lid, van de richtlijn adequaat heeft verklaard;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63j
  - number: 63j.2.c
    text: |-
      de overdracht van persoonsgegevens geschiedt overeenkomstig de [Wet bescherming persoonsgegevens][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63j
    references:
      - id: ref1
        bwb_id: BWBR0011468
  - number: 63j.2.d
    text: |-
      zij met die toezichthoudende instantie op basis van wederkerigheid een overeenkomst heeft gesloten met betrekking
      tot gegevensverstrekking als bedoeld in dit artikel.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63j
  - number: 63j.3
    text: 'De Autoriteit Financiële Markten voldoet niet aan het in het eerste lid bedoelde verzoek, indien:'
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63j
  - number: 63j.3.a
    text: |-
      de verstrekking van de gegevens of inlichtingen gevaar zou kunnen opleveren voor de soevereiniteit, nationale
      veiligheid of openbare orde van Nederland of andere lidstaten;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63j
  - number: 63j.3.b
    text: |-
      met de verstrekking van de gegevens en inlichtingen de bescherming van de commerciële belangen van de
      controlecliënt, met inbegrip van zijn intellectuele eigendomsrechten, in het gedrang komt;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63j
  - number: 63j.3.c
    text: |-
      met betrekking tot dezelfde handelingen tegen een accountantsorganisatie of andere personen reeds in Nederland een
      strafrechtelijke procedure is ingesteld;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63j
  - number: 63j.3.d
    text: |-
      door dezelfde accountantsorganisatie of andere personen een beroep is ingesteld tegen een bestuurlijke boete ten
      aanzien van dezelfde handelingen;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63j
  - number: 63j.3.e
    text: |-
      met betrekking tot dezelfde handelingen en dezelfde accountantsorganisaties of auditkantoren een onherroepelijk
      besluit is genomen; of
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63j
  - number: 63j.3.f
    text: |-
      met betrekking tot dezelfde handeling tegen dezelfde accountant, voor zover het een accountant betreft als
      bedoeld in [artikel 1, van de Wet op het accountantsberoep][ref1], een klacht is ingediend bij de accountantskamer
      overeenkomstig [artikel 22, eerste lid, van de Wet tuchtrechtspraak accountants][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0024238#Artikel22
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63j
    references:
      - id: ref1
        bwb_id: BWBR0032573
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0024238
        artikel: '22'
  - number: 63j.4
    text: |-
      De Autoriteit Financiële Markten zendt onverwijld nadat met een toezichthoudende instantie van een staat die geen
      lidstaat is een overeenkomst is gesloten als bedoeld in het eerste lid, een afschrift van die overeenkomst aan
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63j
  - number: 63j.5
    text: |-
      Het eerste tot en met vierde lid, met uitzondering van het tweede lid, onderdeel c, is niet van toepassing op de
      uitwisseling van gegevens en inlichtingen als bedoeld in artikel 36 van de EU-verordening.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63j
  - number: 63k.1
    text: |-
      De Autoriteit Financiële Markten kan ten behoeve van de samenwerking, bedoeld in [artikel 63j][ref1] of artikel
      36 van de EU-verordening, van een ieder inlichtingen vorderen, indien dat voor de vervulling van de taak
      van een toezichthoudende instantie in een staat die geen lidstaat is, nodig is. De artikelen [5:13][ref2] en
      [5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel63j
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63k
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: 63j
        hoofdstuk: 5c
        afdeling: 5c.2
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 63k.2
    text: |-
      Ten behoeve van de in het eerste lid bedoelde samenwerking beschikken de personen, bedoeld in
      [artikel 49, eerste lid][ref1], over de bevoegdheden, genoemd in de [artikelen 5:15][ref2], [5:16][ref3],
      [5:16a][ref4] en [5:17 van de Algemene wet bestuursrecht][ref5]. De [artikelen 5:12][ref6], [5:13][ref7] en
      [5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref8] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref8]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel63k
    references:
      - id: ref1
