      [48a, zevende en achtste lid van deze wet][ref20] en de artikelen 4, eerste, tweede en derde lid, 5, eerste, vierde
      en vijfde lid, 6, 7, 8, 10, 11, eerste, tweede, vierde en vijfde lid, 12, eerste lid, 13, 14, 15, 16, eerste tot en
