        hoofdstuk: 5c
        afdeling: 5c.2
  - number: 12d.3
    text: |-
      Bij de ministeriële regeling, bedoeld in het tweede lid, kan op basis van wederkerigheid tevens worden bepaald
      dat de [artikelen 12c, eerste lid][ref1], [52][ref2], [64][ref3], [65][ref4] en [66][ref5] geheel of gedeeltelijk
      niet van toepassing zijn ten aanzien van auditorganisaties van een derde land met zetel in een bij die regeling
      aangewezen staat die geen lidstaat is.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel12c
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel52
