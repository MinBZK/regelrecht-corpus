preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het met het oog op de waarborging van de publieke functie van de
    accountantsverklaring en de bevordering van het vertrouwen in de financiële markten wenselijk is dat regels worden
    gesteld voor accountantsorganisaties en accountants die wettelijke controles verrichten en dat onafhankelijk
    publiek toezicht wordt gehouden op de naleving van die regels;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt – voor zover niet anders is bepaald – verstaan onder: a.
      accountantsorganisatie: een onderneming of instelling die bedrijfsmatig wettelijke controles verricht, dan wel
      een organisatie waarin zodanige ondernemingen of instellingen met elkaar zijn verbonden; b. accountantsverklaring:
      een schriftelijke mededeling inhoudende de uitkomst van een wettelijke controle; c. auditkantoor: onderneming of
      instelling die door de toezichthoudende instantie van een andere lidstaat is toegelaten tot het verrichten van
      controles als bedoeld in artikel 2, onderdeel 1, van de richtlijn; d. Autoriteit Financiële Markten: de Stichting
      Autoriteit Financiële Markten; e. controlecliënt: de onderneming of instelling die aan een accountantsorganisatie
      opdracht geeft tot een wettelijke controle; f. externe accountant: de natuurlijke persoon die werkzaam is bij
      of verbonden is aan een accountantsorganisatie of auditkantoor en die verantwoordelijk is voor de uitvoering van
      een wettelijke controle; g. lidstaat: een staat die lid is van de Europese Unie alsmede een staat, niet zijnde
      een lidstaat van de Europese Unie, die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte;
      h. auditorganisatie van een derde land: onderneming of instelling die de controle uitvoert van de jaarrekening
      of geconsolideerde jaarrekening van een onderneming met zetel in een staat die geen lidstaat is en die niet als
      gevolg van een toelating overeenkomstig artikel 3 van de richtlijn in een lidstaat is toegelaten tot het verrichten
      van controles als bedoeld in artikel 2, onderdeel 1, van de richtlijn; i. auditor van een derde land: natuurlijke
      persoon die werkzaam is bij of verbonden is aan een auditorganisatie van een derde land en die verantwoordelijk
      is voor de uitvoering van de controle van de jaarrekening of geconsolideerde jaarrekening van een onderneming
      met zetel in een staat die geen lidstaat is en die niet als gevolg van een toelating overeenkomstig artikel 3
      of 44 van de richtlijn in een lidstaat is toegelaten tot het verrichten van controles als bedoeld in artikel 2,
      onderdeel 1, van de richtlijn; j. netwerk: samenwerkingsverband waartoe een accountantsorganisatie behoort, dat
      duidelijk is gericht op het delen van winst of kosten of waarbij duidelijk sprake is van: 1°. gemeenschappelijke
      eigendom, zeggenschap of bestuur; 2°. gezamenlijk beleid en procedures met betrekking tot kwaliteitsbeheersing;
      3°. een gezamenlijke bedrijfsstrategie; 4°. een gemeenschappelijke merknaam; of 5°. het delen van een aanzienlijk
      deel van de bedrijfsmiddelen; k. Onze Minister: Onze Minister van Financiën; l. organisatie van openbaar belang:
      1°. een in Nederland gevestigde rechtspersoon naar Nederlands recht waarvan effecten zijn toegelaten tot de handel
      op een gereglementeerde markt als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1]; 2°. een
      bank met zetel in Nederland als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref2] waaraan een
      vergunning is verleend ingevolge [die wet;][ref3] 3°. een centrale kredietinstelling met zetel in Nederland als
      bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref4] waaraan een vergunning is verleend ingevolge
      [die wet][ref5]; 4°. een verzekeraar als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref6]
      met zetel in Nederland, niet zijnde een verzekeraar met beperkte risico-omvang als bedoeld in dat artikel; 5°.
      een onderneming, instelling of openbaar lichaam, behorende tot een van de ingevolge [artikel 2][ref7] aangewezen
      categorieën; m. richtlijn: richtlijn nr. 2006/43/EG van het Europees Parlement en de Raad van de Europese Unie van
      17 mei 2006 betreffende de wettelijke controles van jaarrekeningen en geconsolideerde jaarrekeningen, tot wijziging
      van de Richtlijnen 78/660/EEG en 83/349/EEG van de Raad, en houdende intrekking van Richtlijn 84/253/EEG van de
      Raad (PbEU L 157); n. toezichthoudende instantie: overheidsinstantie of van overheidswege aangewezen instantie, die
      is belast met het toezicht op auditkantoren of auditorganisaties van een derde land; o. vrijwillige controle: een
      niet bij of krachtens de wet verplichte controle van financiële verantwoordingen van ondernemingen of instellingen
      die inhoudelijk overeenkomt met een wettelijke controle; p. wettelijke controle: een controle van een financiële
      verantwoording van een onderneming of instelling ten behoeve van het maatschappelijk verkeer, die verplicht is
      gesteld bij of krachtens de in de bijlage bij deze wet genoemde wettelijke bepalingen; of q. EU-verordening:
      verordening (EU) nr. 537/2014 van het Europees Parlement en de Raad van 16 april 2014 betreffende specifieke eisen
      voor de wettelijke controles van financiële overzichten van organisaties van openbaar belang (PbEU 2014, L 158).


