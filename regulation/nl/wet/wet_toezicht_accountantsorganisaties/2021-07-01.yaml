        afdeling: '2.5'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: '6.1'
    text: |-
      De Autoriteit Financiële Markten verleent een vergunning aan een aanvrager die geen accountantsorganisatie als
      bedoeld in [artikel 5, tweede lid][ref1], is, en die heeft aangetoond dat hijzelf en de bij hem werkzame of aan
      hem verbonden externe accountants voldoen aan het bij of krachtens [paragraaf 3.1.2][ref2] en [afdeling 3.2][ref3]
      bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0019468#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '5'
        hoofdstuk: '2'
        afdeling: '2.1'
      - id: ref2
        bwb_id: BWBR0019468
        hoofdstuk: '3'
        paragraaf: 3.1.2
        afdeling: '3.1'
      - id: ref3
        bwb_id: BWBR0019468
        hoofdstuk: '3'
        afdeling: '3.2'
  - number: '6.2'
    text: |-
      Indien de aanvrager voornemens is tevens wettelijke controles te verrichten bij organisaties van openbaar belang,
      toont de aanvrager bovendien aan dat hijzelf en de bij hem werkzame of aan hem verbonden externe accountants
      voldoen aan het bij of krachtens [paragraaf 3.1.3][ref1] bepaalde. Indien is voldaan aan het bepaalde in de vorige
      volzin, vermeldt de Autoriteit Financiële Markten in de vergunning dat deze mede strekt tot het verrichten van
      wettelijke controles bij organisaties van openbaar belang.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0019468
        hoofdstuk: '3'
        paragraaf: 3.1.3
        afdeling: '3.1'
  - number: '6.3'
    text: De Autoriteit Financiële Markten kan aan een vergunning voorschriften verbinden en beperkingen stellen.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel6
  - number: '6.4'
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op de aanvraag om een vergunning
      als bedoeld in [artikel 5, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
      [ref3]: https://wetten.overheid.nl/BWBR0019468#Artikel5
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
      - id: ref3
        bwb_id: BWBR0019468
        artikel: '5'
        hoofdstuk: '2'
        afdeling: '2.1'
  - number: '7'
    text: De vergunning is niet overdraagbaar.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel7
  - number: '8'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld ten aanzien van de wijze waarop de aanvraag
      voor een vergunning wordt ingediend, de gegevens die daarbij worden verstrekt, de bescheiden die daarbij worden
      overgelegd, de voorschriften die aan de vergunning worden verbonden en de beperkingen die aan de vergunning gesteld
      kunnen worden.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel8
  - number: '9'
    text: De vergunning vervalt indien de accountantsorganisatie waaraan de vergunning is verleend ophoudt te bestaan.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel9
  - number: '10'
    text: |-
      De Autoriteit Financiële Markten kan de voorschriften en beperkingen, bedoeld in [artikel 6, derde lid][ref1],
      wijzigen, aanvullen of intrekken, of alsnog voorschriften verbinden of beperkingen stellen aan een vergunning, of
      de vergunning intrekken of beperken:


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel6
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '6'
        hoofdstuk: '2'
        afdeling: '2.1'
  - number: 10.a
    text: op verzoek van de houder;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel10
  - number: 10.b
    text: |-
      indien de houder naar later blijkt bij de aanvraag onjuiste of onvolledige gegevens heeft verstrekt, en kennis
      omtrent de juiste en volledige gegevens tot een andere beslissing zou hebben geleid;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel10
  - number: 10.c
    text: |-
      indien de houder omstandigheden of feiten heeft verzwegen op grond waarvan, indien zij zich hadden voorgedaan of
      bekend waren geweest op het tijdstip waarop de vergunning werd verleend, de vergunning zou zijn geweigerd;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel10
  - number: 10.d
    text: |-
      indien de houder in staat van faillissement is komen te verkeren of surseance van betaling heeft verkregen
      of indien ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is verklaard of
      indien door een rechterlijke beschikking één of meer goederen van de houder onder bewind als bedoeld in de
      [artikelen 380][ref1], [409][ref2] of [431 van Boek 1 van het Burgerlijk Wetboek][ref3] zijn gesteld of indien de
      ondercuratelestelling van de houder is uitgesproken;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel380
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel409
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel431
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '380'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '409'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '431'
  - number: 10.e
    text: |-
      indien zich omstandigheden voordoen of feiten bekend worden welke ertoe leiden of zouden kunnen leiden dat de
      formele of feitelijke zeggenschapsstructuur van de accountantsorganisatie in zodanige mate ondoorzichtig wordt dat
      deze een belemmering zou vormen voor het adequaat uitoefenen van het toezicht op de accountantsorganisatie;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel10
  - number: 10.f
    text: indien de houder niet meer voldoet aan bij of krachtens deze wet gestelde regels;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel10
  - number: 10.g
    text: de houder gedurende een periode van 36 maanden geen gebruik van de vergunning heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel10
  - number: '11.1'
    text: |-
      De Autoriteit Financiële Markten houdt een openbaar register waarin vergunninghoudende accountantsorganisaties,
      auditkantoren die voldoen aan [artikel 12e][ref1], auditorganisaties van een derde land die voldoen aan
      [artikel 12c, eerste lid][ref2], daarbij werkzame of daaraan verbonden auditors van een derde land die
      betrokken zijn bij het afgeven van verklaringen als bedoeld in [artikel 12b][ref3], en externe accountants
      worden ingeschreven. Een externe accountant wordt ingeschreven op voordracht van de accountantsorganisatie
      of het auditkantoor waarbij hij werkzaam is of waaraan hij is verbonden en indien hij voldoet aan het bij of
      krachtens [afdeling 3.2][ref4] bepaalde. Een auditor van een derde land wordt ingeschreven op voordracht van de
      auditorganisate van een derde land waarbij hij werkzaam is of waaraan hij is verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel12e
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel12c
      [ref3]: https://wetten.overheid.nl/BWBR0019468#Artikel12b
      [ref4]: https://wetten.overheid.nl/BWBR0019468#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: 12e
        hoofdstuk: '2'
        afdeling: '2.5'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: 12c
        hoofdstuk: '2'
        afdeling: '2.4'
      - id: ref3
        bwb_id: BWBR0019468
        artikel: 12b
        hoofdstuk: '2'
        afdeling: '2.4'
      - id: ref4
        bwb_id: BWBR0019468
        hoofdstuk: '3'
        afdeling: '3.2'
  - number: '11.2'
    text: |-
      De Autoriteit Financiële Markten draagt zorg voor het goed functioneren van het register. Het register vermeldt de
      aan de vergunning van de accountantsorganisatie verbonden voorschriften en de daaraan gestelde beperkingen.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel11
  - number: '11.3'
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel11
  - number: 11.3.a
    text: de inrichting en de werking van het register; en
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel11
  - number: 11.3.b
    text: |-
      andere gegevens over de accountantsorganisaties, auditorganisaties van een derde land, externe accountants en
      auditors van een derde land die in het register worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel11
  - number: '11.4'
    text: |-
      De Autoriteit Financiële Markten vermeldt in het register de tuchtrechtelijke maatregelen die jegens de externe
      accountant zijn opgelegd en het tijdstip waarop deze zijn ingegaan en, voor zover van toepassing, het tijdstip
      waarop deze eindigen. Bij elke tuchtrechtelijk maatregel tot doorhaling van een inschrijving, wordt de datum van
      de doorhaling vermeld. Indien de vermelding betrekking heeft op een externe accountant die een wettelijke auditor
      is als bedoeld in [artikel 27][ref1], stelt de Autoriteit Financiële Markten de toezichthoudende instantie in
      de lidstaat waar de wettelijke auditor is toegelaten tot het verrichten van controles als bedoeld in artikel 2,
      onderdeel 1, van de richtlijn, van deze vermelding onverwijld in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel27
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '27'
        hoofdstuk: '3'
        afdeling: '3.2'
  - number: '11.5'
    text: |-
      De Autoriteit Financiële Markten verwijdert de tuchtrechtelijke maatregel uit het register nadat tien jaren zijn
      verstreken na het tijdstip waarop de tuchtrechtelijke maatregel is opgelegd.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel11
  - number: '11.6'
    text: |-
      Onverminderd het vijfde lid wordt een tuchtrechtelijke maatregel tot tijdelijke doorhaling van de inschrijving in
      het register tot vijf jaar na het einde van de maatregel in het register vermeld.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel11
  - number: '11.7'
    text: |-
      De Autoriteit Financiële Markten haalt de inschrijving van de accountantsorganisatie in het register door zodra de
      vergunning is ingetrokken of vervallen.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel11
  - number: '11.8'
    text: |-
      De Autoriteit Financiële Markten haalt de inschrijving van de externe accountant in het register tijdelijk door
      indien de accountantskamer de maatregel van tijdelijke doorhaling heeft opgelegd.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel11
  - number: '11.9'
    text: 'De Autoriteit Financiële Markten haalt de inschrijving van de externe accountant in het register door:'
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel11
  - number: 11.9.a
    text: indien de vergunning van de accountantsorganisatie is ingetrokken of vervallen;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel11
  - number: 11.9.b
    text: indien de accountantskamer de maatregel tot doorhaling van de inschrijving heeft opgelegd;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel11
  - number: 11.9.c
    text: op verzoek van de accountantsorganisatie waarbij de externe accountant werkzaam is of waaraan hij is verbonden;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel11
  - number: 11.9.d
    text: op verzoek van de externe accountant;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel11
  - number: 11.9.e
    text: indien de externe accountant is overleden;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel11
  - number: 11.9.f
    text: |-
      indien de inschrijving van de externe accountants in het register, bedoeld in
      [artikel 36, eerste lid, van de Wet op het accountantsberoep][ref1] is doorgehaald;


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel36
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0032573
        artikel: '36'
  - number: 11.9.g
    text: |-
      indien de externe accountant, die een wettelijke auditor is als bedoeld in [artikel 27][ref1], niet langer als
      wettelijke auditor door de toezichthoudende instantie in een andere lidstaat is toegelaten tot het verrichten van
      controles als bedoeld in artikel 2, onderdeel 1, van de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel27
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '27'
        hoofdstuk: '3'
        afdeling: '3.2'
  - number: '11.10'
    text: |-
      Indien de Autoriteit Financiële Markten een vergunning intrekt van een accountantsorganisatie die als auditkantoor
      in de zin van de richtlijn is ingeschreven in het openbaar register in een andere lidstaat, doet de Autoriteit
      Financiële Markten daarvan met opgave van de redenen voor de intrekking mededeling aan de toezichthoudende
      instantie in die lidstaat.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel11
  - number: '11.11'
    text: |-
      De Autoriteit Financiële Markten kan de inschrijving van een auditorganisatie van een derde land in het register
      doorhalen, indien deze niet langer voldoet aan de in [artikel 12c, eerste lid][ref1] gestelde eisen voor
      inschrijving in het register.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel12c
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: 12c
        hoofdstuk: '2'
        afdeling: '2.4'
  - number: '11.12'
    text: |-
      De Autoriteit Financiële Markten haalt de inschrijving van een auditorganisatie van een derde land in het register
      door, indien deze een vergunning heeft verkregen als bedoeld in [artikel 5][ref1] of geen gevolg heeft gegeven aan
      een aanwijzing als bedoeld in [artikel 52][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel52
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '5'
        hoofdstuk: '2'
        afdeling: '2.1'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: '52'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '11.13'
    text: |-
      Een doorhaling in het register als bedoeld in het achtste of negende lid tast het rechtsgevolg van reeds door de
      desbetreffende auditorganisatie afgegeven verklaringen als bedoeld in [artikel 12b][ref1] niet aan.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel12b
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: 12b
        hoofdstuk: '2'
        afdeling: '2.4'
  - number: '11.14'
    text: 'De Autoriteit Financiële Markten haalt de inschrijving van een auditor van een derde land in het register door:'
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel11
  - number: 11.14.a
    text: |-
      indien zij de inschrijving in het register van de auditorganisatie van een derde land waarbij de auditor van een
      derde land werkzaam is of waaraan deze is verbonden doorhaalt;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel11
  - number: 11.14.b
    text: |-
      op verzoek van de auditorganisatie van een derde land waarbij de auditor van een derde land werkzaam is of waaraan
      hij is verbonden;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel11
  - number: 11.14.c
    text: |-
      indien de auditor van een derde land niet meer als zodanig optreedt dan wel niet meer bevoegd is als zodanig op
      te treden;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel11
  - number: 11.14.d
    text: op verzoek van de auditor van een derde land; of
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel11
  - number: 11.14.e
    text: indien de auditor van een derde land is overleden.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel11
  - number: '12'
    text: |-
      Aan een ieder wordt kosteloos inzage verleend in het register. De Autoriteit Financiële Markten verstrekt aan een
      ieder desgevraagd, tegen betaling van de kostprijs, afschriften uit het register.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel12
  - number: 12a
    text: |-
      De [artikelen 12b][ref1] en [12c][ref2] zijn niet van toepassing op ondernemingen of instellingen waaraan een
      vergunning is verleend als bedoeld in [artikel 5][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel12b
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel12c
      [ref3]: https://wetten.overheid.nl/BWBR0019468#Artikel5
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: 12b
        hoofdstuk: '2'
        afdeling: '2.4'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: 12c
        hoofdstuk: '2'
        afdeling: '2.4'
      - id: ref3
        bwb_id: BWBR0019468
        artikel: '5'
        hoofdstuk: '2'
        afdeling: '2.1'
  - number: 12b.1
    text: |-
      Een door een auditorganisatie van een derde land of een auditor van een derde land afgegeven verklaring omtrent
      de controle van de jaarrekening of geconsolideerde jaarrekening van een onderneming met zetel in een staat die
      geen lidstaat is en waarvan de effecten zijn toegelaten tot de handel op een gereglementeerde markt als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref1] in Nederland, heeft uitsluitend rechtsgevolg in Nederland
      indien de auditorganisatie van een derde land onderscheidenlijk de auditor van een derde land is ingeschreven in
      het register, bedoeld in [artikel 11][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel11
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 12b.2
    text: |-
      Het eerste lid is niet van toepassing op een auditorganisatie van een derde land die verklaringen als bedoeld in
      dat lid afgeeft, indien:
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel12b
  - number: 12b.2.a
    text: |-
      de Commissie van de Europese Gemeenschappen het desbetreffende derde land een overgangsperiode als bedoeld in
      artikel 46, tweede lid, vierde volzin, van de richtlijn heeft toegekend en ter zake van de gelijkwaardigheid van
      het stelsel van toezicht en handhaving van het derde land een besluit neemt als bedoeld in artikel 46, tweede lid,
      tweede volzin, van de richtlijn; en
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel12b
  - number: 12b.2.b
    text: |-
      de auditorganisatie een aanvraag tot inschrijving in het register heeft ingediend in overeenstemming met het bij of
      krachtens [artikel 12c, tweede lid][ref1], bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel12c
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: 12c
        hoofdstuk: '2'
        afdeling: '2.4'
  - number: 12b.3
    text: Het tweede lid is van toepassing totdat onherroepelijk op de aanvraag tot inschrijving is beslist.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel12b
  - number: 12c.1
    text: |-
      De Autoriteit Financiële Markten draagt, op aanvraag, zorg voor de inschrijving in het register, bedoeld in
      [artikel 11][ref1], van een auditorganisatie van een derde land die aantoont dat:


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel11
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 12c.1.a
    text: |-
      zij verklaringen afgeeft als bedoeld in [artikel 12b][ref1], tenzij het betreft verklaringen omtrent de controle
      van de jaarrekening of geconsolideerde jaarrekening van ondernemingen die uitsluitend effecten als bedoeld in
      onderdeel b van de definitie van effect in [artikel 1:1 van de Wet op het financieel toezicht][ref2] uitgeven die
      zijn toegelaten tot de handel op een in dat artikel bedoelde gereglementeerde markt in Nederland met een nominale
      waarde per effect op de datum van uitgifte van ten minste:


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel12b
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: 12b
        hoofdstuk: '2'
        afdeling: '2.4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 12c.1.a.1°
    text: |-
      € 50.000 of, in het geval van effecten in een andere valuta, met een nominale waarde per effect die op de datum van
      uitgifte ten minste gelijkwaardig is aan € 50.000, indien de effecten zijn toegelaten tot de gereglementeerde markt
      voor 31 december 2010, of
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel12c
  - number: 12c.1.a.2°
    text: |-
      € 100.000 of, in het geval van effecten in een andere valuta, een nominale waarde per effect hebben die op de datum
      van uitgifte ten minste gelijkwaardig is aan € 100.000, indien de effecten zijn toegelaten tot de gereglementeerde
      markt op of na 31 december 2010;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel12c
  - number: 12c.1.b
    text: |-
      zij voldoet aan regels die gelijkwaardig zijn aan het bij of krachtens [artikel 15, eerste lid][ref1],
      [16, eerste en tweede lid,][ref2] en [19][ref3] bepaalde;


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0019468#Artikel19
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: 3.1.2
        afdeling: '3.1'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: 3.1.2
        afdeling: '3.1'
      - id: ref3
        bwb_id: BWBR0019468
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: 3.1.2
        afdeling: '3.1'
  - number: 12c.1.c
    text: |-
      de controles, bedoeld in [artikel 12b][ref1], worden uitgevoerd in overeenstemming met de internationale
      controlestandaarden, bedoeld in artikel 26 van de richtlijn, of gelijkwaardige controlestandaarden en
      overeenkomstig regels die gelijkwaardig zijn aan het bij of krachtens de [artikelen 19][ref2], [25][ref3] en
      [25a][ref4] bepaalde; en


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel12b
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0019468#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0019468#Artikel25a
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: 12b
        hoofdstuk: '2'
        afdeling: '2.4'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: 3.1.2
        afdeling: '3.1'
      - id: ref3
        bwb_id: BWBR0019468
        artikel: '25'
        hoofdstuk: '3'
        afdeling: '3.2'
      - id: ref4
        bwb_id: BWBR0019468
        artikel: 25a
        hoofdstuk: '3'
        afdeling: '3.2'
  - number: 12c.1.d
    text: |-
      zij op haar website een transparantieverslag publiceert dat de in artikel 13 van de EU-verordening bedoelde
      informatie bevat of aantoont dat zij aan gelijkwaardige openbaarmakingseisen voldoet.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel12c
  - number: 12c.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld ten aanzien van de wijze waarop de aanvraag
      tot inschrijving wordt ingediend, de gegevens die daarbij worden verstrekt, en de bescheiden die daarbij worden
      overgelegd.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel12c
  - number: 12c.3
    text: |-
      De Autoriteit Financiële Markten beslist binnen twaalf maanden op een aanvraag als bedoeld in het eerste lid. In
      afwachting van een besluit van de Commissie van de Europese Gemeenschappen als bedoeld in de artikelen 45, zesde
      lid, en 46, tweede lid, van de richtlijn kan de Autoriteit Financiële Markten de beslissing opschorten tot twaalf
      maanden nadat de Commissie van de Europese Gemeenschappen een besluit heeft genomen.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel12c
  - number: 12d.1
    text: |-
      De [artikelen 48a][ref1], [52][ref2], [64][ref3], [65][ref4], en [66][ref5] en de [hoofdstukken 5A][ref6] en
      [5B][ref7] zijn van overeenkomstige toepassing ten aanzien van auditorganisaties van een derde land die ingevolge
      [artikel 12c][ref8] zijn ingeschreven in het register, met dien verstande dat de in [artikel 64][ref9] bedoelde
      openbare waarschuwing kan worden uitgevaardigd, indien de auditorganisatie van een derde land niet voldoet aan de
      in [artikel 12c, eerste lid][ref10] gestelde eisen voor inschrijving in het register.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel48a
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel52
