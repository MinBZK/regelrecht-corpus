  - number: 67.1.b
    text: |-
      [artikel 8, derde lid][ref1], [11, eerste of vierde lid][ref2], [12, derde lid][ref3],
      [13, eerste of tweede lid][ref4], [15a, eerste of tweede lid][ref5], [17 tweede lid][ref6],
      [18 tweede lid][ref7], [20 eerste tot en met derde lid][ref8], [29, tweede lid][ref9],
      of [32, eerste lid, van het Besluit toezicht accountantsorganisaties][ref10], of


      [ref1]: https://wetten.overheid.nl/BWBR0020184#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0020184#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0020184#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0020184#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0020184#Artikel15a
      [ref6]: https://wetten.overheid.nl/BWBR0020184#Artikel17
      [ref7]: https://wetten.overheid.nl/BWBR0020184#Artikel18
      [ref8]: https://wetten.overheid.nl/BWBR0020184#Artikel20
      [ref9]: https://wetten.overheid.nl/BWBR0020184#Artikel29
