  - number: 12d.2
    text: |-
      Bij ministeriële regeling kan worden bepaald dat [artikel 48a][ref1] niet van toepassing is op auditorganisaties
      van een derde land, indien in de voorafgaande drie jaar een beoordeling als bedoeld in artikel 45, derde lid, van
      de richtlijn is uitgevoerd door een toezichthoudende instantie van:


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel48a
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel12d
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: 48a
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 12d.2.a
    text: een andere lidstaat; of
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel12d
  - number: 12d.2.b
    text: |-
      een staat niet zijnde een lidstaat die beschikt over een stelsel van toezicht en handhaving dat
      gelijkwaardig is aan dat op grond van deze wet, voor zover de Autoriteit Financiële Markten met de
      desbetreffende toezichthoudende instantie op basis van wederkerigheid een overeenkomst als bedoeld in
      [artikel 63j, tweede lid, onderdeel d][ref1], heeft gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel63j
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel12d
