  - number: '53.2'
    text: Onze Minister kan regels stellen ter zake van de uitoefening van de bevoegdheid, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel53
  - number: '54.1'
    text: |-
      De Autoriteit Financiële Markten kan een bestuurlijke boete opleggen ter zake van een
      overtreding van een voorschrift, gesteld bij of krachtens de [artikelen 5, eerste lid][ref1],
      [6, derde lid][ref2], [14][ref3], [14a][ref4],[15][ref5], [16b][ref6], [18][ref7],
      [18a][ref8], [18b][ref9], [19][ref10], [19a][ref11], [20, eerste, derde en vijfde lid][ref12],
      [21][ref13], [21a][ref14], [22][ref15], [22a, eerste tot en met zevende en negende lid][ref16],
      [23][ref17], [24][ref18], [24b][ref19] en [48a, zevende en achtste lid van deze wet][ref20],
      [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref21] en de artikelen 4, eerste, tweede en derde
      lid, 5, eerste, vierde en vijfde lid, 6, 7, 8, 10, 11, eerste, tweede, vierde en vijfde lid, 12, eerste lid, 13,
      14, 15, 16, eerste tot en met zesde lid, 17, eerste, derde, vijfde tot en met achtste lid, 18 en 26, achtste lid,
      van de EU-verordening.


