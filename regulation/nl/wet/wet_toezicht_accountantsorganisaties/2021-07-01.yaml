  - number: 12e.1
    text: |-
      Een auditkantoor kan een wettelijke controle verrichten indien de externe accountant die verantwoordelijk is voor
      de uitvoering van de wettelijke controle voldoet aan [artikel 27][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel27
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel12e
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '27'
        hoofdstuk: '3'
        afdeling: '3.2'
  - number: 12e.2
    text: |-
      De Autoriteit Financiële Markten draagt, op aanvraag, zorg voor de inschrijving in het register, bedoeld in
      [artikel 11][ref1], van een auditkantoor als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel11
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel12e
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: 12e.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld ten aanzien van de wijze waarop de aanvraag
      tot inschrijving wordt ingediend en de bescheiden en gegevens die daarbij worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel12e
  - number: 12e.4
    text: |-
      De Autoriteit Financiële Markten doet aan de toezichthoudende instantie in de lidstaat waar het auditkantoor is
      toegelaten mededeling van het besluit tot inschrijving in het register.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel12e
  - number: 12f
    text: |-
      De [artikelen 14][ref1], [19][ref2], [20][ref3], [23][ref4], [24][ref5] en [24b][ref6] en de
      [hoofdstukken 5 tot en met 6][ref7], met uitzondering van de [artikelen 48a][ref8] en [49a][ref9], zijn van
      overeenkomstige toepassing op auditkantoren die overeenkomstig [artikel 12e][ref10] wettelijke controles
      verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0019468#Artikel20
