  - number: 67.1.c
    text: |-
      een bepaling waarvan de overtreding bij algemene maatregel van bestuur op grond van [artikel 55, eerste lid][ref1],
      beboetbaar is gesteld met tariefnummer 3.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel55
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '55'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '67.2'
    text: |-
      Alvorens over te gaan tot openbaarmaking van het besluit tot het opleggen van een bestuurlijke boete neemt de
      Autoriteit Financiële Markten een besluit tot openbaarmaking. Dit besluit bevat de openbaar te maken gegevens en de
      wijze en termijn waarop de openbaarmaking zal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel67
  - number: '67.3'
    text: |-
      De Autoriteit Financiële Markten gaat pas over tot openbaarmaking op grond van het eerste lid, nadat vijf werkdagen
      zijn verstreken na de dag waarop het besluit aan de betrokken accountantsorganisatie bekend is gemaakt.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel67
  - number: '67.4'
    text: |-
      Indien wordt verzocht om een voorlopige voorziening als bedoeld in
      [artikel 8:81 van de Algemene wet bestuursrecht][ref1], wordt de openbaarmaking van het besluit opgeschort totdat
      er een uitspraak is van de voorzieningenrechter.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '67.5'
    text: |-
      De openbaarmaking van een besluit geschiedt in zodanige vorm dat het besluit niet herleidbaar is tot afzonderlijke
      personen, indien voorafgaand aan openbaarmaking door de Autoriteit Financiële Markten kan worden vastgesteld dat
      bij volledige openbaarmaking:
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel67
  - number: 67.5.a
    text: |-
      voor zover de boete wordt opgelegd aan een natuurlijk persoon, bekendmaking van zijn persoonlijke gegevens
      onevenredig zou zijn;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel67
  - number: 67.5.b
    text: betrokken partijen in onevenredige mate schade zou worden berokkend;
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel67
  - number: 67.5.c
    text: een lopend strafrechtelijk onderzoek zou worden ondermijnd; of
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel67
  - number: 67.5.d
    text: de stabiliteit van het financiële stelsel in gevaar zou worden gebracht.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel67
  - number: '67.6'
    text: |-
      De Autoriteit Financiële Markten maakt de indiening van een bezwaar of de instelling van een beroep tegen
      een besluit als bedoeld in het eerste lid, alsmede de uitkomst van dat bezwaar of beroep, bekend zodra dit
      redelijkerwijs uitvoerbaar is. Het vijfde lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel67
  - number: '68'
    text: |-
      Onverminderd [artikel 67][ref1] maakt de Autoriteit Financiële Markten een besluit tot het opleggen van een
      bestuurlijke boete ingevolge deze wet openbaar, nadat het rechtens onaantastbaar is geworden, alsmede, voor zover
      van toepassing, de uitkomst van een bezwaar of beroep dat daaraan vooraf is gegaan. Artikel 67, tweede tot en met
      vijfde lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel67
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '67'
        hoofdstuk: '6'
  - number: '69'
    text: |-
      De Autoriteit Financiële Markten maakt een besluit tot het opleggen van een last onder dwangsom ingevolge
      deze wet openbaar wanneer een dwangsom wordt verbeurd. [Artikel 67, tweede tot en met zesde lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel67
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '67'
        hoofdstuk: '6'
  - number: '70.1'
    text: |-
      In afwijking van [artikel 67, derde lid][ref1], [68][ref2] of [69][ref3] kan de Autoriteit Financiële Markten op
      een kortere termijn en zo nodig onverwijld overgaan tot openbaarmaking, voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel68
      [ref3]: https://wetten.overheid.nl/BWBR0019468#Artikel69
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '67'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: '68'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0019468
        artikel: '69'
        hoofdstuk: '6'
  - number: 70.1.a
    text: bescherming van de belangen die deze wet beoogt te beschermen geen uitstel toelaat; of
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel70
  - number: 70.1.b
    text: |-
      de overtreder zelf informatie openbaar heeft gemaakt over de overtreding of het besluit tot het opleggen van een
      bestuurlijke sanctie en versnelde openbaarmaking in het belang van het publiek noodzakelijk is ter bescherming van
      het vertrouwen in het toezicht op accountantsorganisaties.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel70
  - number: '70.2'
    text: |-
      In de gevallen genoemd in het eerste lid kan de Autoriteit Financiële Markten besluiten dat
      [artikel 67, vierde lid][ref1], buiten toepassing blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel67
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '67'
        hoofdstuk: '6'
  - number: '70.3'
    text: |-
      Indien bij openbaarmaking van een besluit tot het opleggen van een bestuurlijke sanctie toepassing wordt gegeven
      aan het eerste lid, is [artikel 67, zesde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel67
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '67'
        hoofdstuk: '6'
  - number: '70.4'
    text: |-
      De Autoriteit Financiële Markten verricht een redelijke inspanning om de betrokken accountantsorganisatie
      voorafgaand aan de openbaarmaking in kennis te stellen van de voorgenomen openbaarmaking.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel70
  - number: '70.5'
    text: |-
      De Autoriteit Financiële Markten beëindigt het openbaar beschikbaar houden van gegevens die tot afzonderlijke
      accountantsorganisaties herleidbaar zijn op grond van [artikel 68][ref1] onverwijld indien en voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel68
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '68'
        hoofdstuk: '6'
  - number: 70.5.a
    text: het besluit tot openbaarmaking wordt ingetrokken; of
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel70
  - number: 70.5.b
    text: het besluit tot openbaarmaking door de bestuursrechter onherroepelijk is vernietigd.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel70
  - number: '70.6'
    text: |-
      In de gevallen bedoeld in het vijfde lid, biedt de Autoriteit Financiële Markten de belanghebbende aan de
      intrekking of de vernietiging openbaar te maken.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel70
  - number: '70.7'
    text: |-
      In afwijking van [artikel 67, zesde lid][ref1], en [artikel 69][ref2] zijn het vijfde en zesde lid van
      overeenkomstige toepassing op een besluit tot openbaarmaking op grond van artikel 67 of 69, voor zover de
      openbaarmaking in strijd met artikel 67, vijfde lid, heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel69
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '67'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0019468
        artikel: '69'
        hoofdstuk: '6'
  - number: '71.1'
    text: |-
      Indien wordt verzocht om een voorlopige voorziening als bedoeld in
      [artikel 8:81 van de Algemene wet bestuursrecht][ref1] om openbaarmaking op grond van dit hoofdstuk te voorkomen,
      vindt het onderzoek ter zitting plaats met gesloten deuren.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '71.2'
    text: |-
      Indien de voorzieningenrechter openbaarmaking op grond van dit hoofdstuk heeft verboden, of indien op grond
      van [artikel 67, vijfde lid][ref1], nog geen tot afzonderlijke personen herleidbare openbaarmaking heeft
      plaatsgevonden, vindt het horen van belanghebbenden ter zake van het bezwaar tegen het besluit tot openbaarmaking
      of het besluit tot het opleggen van een bestuurlijke boete of een last onder dwangsom niet in het openbaar plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel67
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '67'
        hoofdstuk: '6'
  - number: '71.3'
    text: |-
      Indien de voorzieningenrechter openbaarmaking op grond van dit hoofdstuk heeft verboden, of indien op grond
      van [artikel 67, vijfde lid][ref1], nog geen tot afzonderlijke personen herleidbare openbaarmaking heeft
      plaatsgevonden, en beroep of hoger beroep wordt ingesteld tegen het besluit tot openbaarmaking of het besluit
      tot het opleggen van de bestuurlijke boete of de last onder dwangsom, vindt het onderzoek ter zitting plaats met
      gesloten deuren.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel67
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '67'
        hoofdstuk: '6'
  - number: '79'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel79
  - number: '80.1'
    text: |-
      Het is een accountantsorganisatie toegestaan om na het tijdstip van inwerkingtreding van deze wet zonder vergunning
      haar werkzaamheden ten behoeve van het uitvoeren van wettelijke controles voort te zetten dan wel opdrachten tot
      uitvoering van wettelijke controles te aanvaarden, onder de in het tweede lid genoemde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel80
  - number: '80.2'
    text: |-
      De accountantsorganisatie vraagt binnen een maand na inwerkingtreding van deze wet een vergunning aan bij de
      Autoriteit Financiële Markten en legt binnen drie maanden na deze aanvraag de gegevens en bescheiden, bedoeld in
      [artikel 8][ref1], aan de Autoriteit Financiële Markten over.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel8
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '8'
        hoofdstuk: '2'
        afdeling: '2.1'
  - number: '80.3'
    text: |-
      Het eerste lid is van toepassing totdat de Autoriteit Financiële Markten onherroepelijk op de vergunningaanvraag
      heeft beslist.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel80
  - number: '80.4'
    text: |-
      De Autoriteit Financiële Markten beslist binnen twaalf maanden na inwerkingtreding van deze wet op een aanvraag
      als bedoeld in het tweede lid. Onze Minister kan deze termijn ten hoogste twee maal met een periode van een half
      jaar verlengen.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel80
  - number: '80.5'
    text: |-
      De accountantsorganisatie die op grond van het tweede lid een vergunning heeft aangevraagd, wordt als aanvrager
      in de zin van het tweede lid ingeschreven in het register, bedoeld in [artikel 11][ref1]. De Autoriteit Financiële
      Markten haalt deze inschrijving door zodra zij onherroepelijk op de aanvraag heeft beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel11
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '2.3'
  - number: '81'
    text: |-
      De besluiten die voor het tijdstip van inwerkingtreding van deze wet zijn genomen door onderscheidenlijk het
      examenbureau, bedoeld in [artikel 74, eerste lid, van de Wet op de Registeraccountants][ref1], het curatorium,
      bedoeld in [artikel 75, eerste lid, van de Wet op de Registeraccountants][ref2] en het examenbureau, bedoeld in
      [artikel 85, eerste lid, van de Wet op de Accountants-Administratieconsulenten][ref3], en die betrekking hebben
      op een periode na bedoeld tijdstip, worden na dat tijdstip geacht te zijn genomen door de Commissie eindtermen
      accountantsopleiding, bedoeld in [artikel 69, eerste lid, van de Wet op de Registeraccountants][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0002374#Artikel75
      [ref3]: https://wetten.overheid.nl/BWBR0002856#Artikel85
      [ref4]: https://wetten.overheid.nl/BWBR0002374#Artikel69
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '74'
      - id: ref2
        bwb_id: BWBR0002374
        artikel: '75'
      - id: ref3
        bwb_id: BWBR0002856
        artikel: '85'
      - id: ref4
        bwb_id: BWBR0002374
        artikel: '69'
  - number: '82'
    text: |-
      In geval voor het tijdstip van inwerkingtreding van deze wet beroep is ingesteld tegen een
      op grond van de [Wet op de Registeraccountants][ref1] genomen besluit door het examenbureau,
      bedoeld in [artikel 74, eerste lid, van die wet][ref2] of het curatorium, bedoeld in
      [artikel 75, eerste lid, van die wet][ref3], onderscheidenlijk tegen een op grond van de
      [Wet op de Accountants-Administratieconsulenten][ref4] genomen besluit door het examenbureau,
      bedoeld in [artikel 85, eerste lid, van die wet][ref5] of het curatorium, bedoeld in
      [artikel 89, eerste lid, van die wet][ref6] wordt op het bezwaar en beroep beslist met toepassing van het voor dat
      tijdstip geldende recht.


      [ref1]: https://wetten.overheid.nl/BWBR0002374
      [ref2]: https://wetten.overheid.nl/BWBR0002374#Artikel74
      [ref3]: https://wetten.overheid.nl/BWBR0002374#Artikel75
      [ref4]: https://wetten.overheid.nl/BWBR0002856
      [ref5]: https://wetten.overheid.nl/BWBR0002856#Artikel85
      [ref6]: https://wetten.overheid.nl/BWBR0002856#Artikel89
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0002374
      - id: ref2
        bwb_id: BWBR0002374
        artikel: '74'
      - id: ref3
        bwb_id: BWBR0002374
        artikel: '75'
      - id: ref4
        bwb_id: BWBR0002856
      - id: ref5
        bwb_id: BWBR0002856
        artikel: '85'
      - id: ref6
        bwb_id: BWBR0002856
        artikel: '89'
  - number: '84'
    text: |-
      In afwijking van [artikel 67, tweede lid, van de Wet op de Registeraccountants][ref1] en
      [artikel 54, tweede lid, van de Wet op de Accountants-Administratieconsulenten][ref2], blijven de regels,
      opgenomen in de [artikelen 8 tot en met 13 van het Examenbesluit registeraccountants 1994][ref3] onderscheidenlijk
      de [artikelen 8 tot en met 13 van het Examenbesluit Accountants-Administratieconsulenten 1994][ref4],
      zoals deze luidden voor het tijdstip van inwerkingtreding van deze wet, van
      toepassing op de praktijkstage, tot het tijdstip waarop de verordening, bedoeld in
      [artikel 67, tweede lid, van de Wet op de Registeraccountants][ref5] onderscheidenlijk de verordening, bedoeld in
      [artikel 54, tweede lid, van de Wet op de Accountants-Administratieconsulenten][ref6], in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel54
      [ref3]: https://wetten.overheid.nl/BWBR0006453#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0006454#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0002374#Artikel67
      [ref6]: https://wetten.overheid.nl/BWBR0002856#Artikel54
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '67'
      - id: ref2
        bwb_id: BWBR0002856
        artikel: '54'
      - id: ref3
        bwb_id: BWBR0006453
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0006454
        artikel: '8'
      - id: ref5
        bwb_id: BWBR0002374
        artikel: '67'
      - id: ref6
        bwb_id: BWBR0002856
        artikel: '54'
  - number: '85.1'
    text: |-
      Tot het tijdstip waarop de Commissie eindtermen accountantsopleiding de eindtermen, bedoeld in
      [artikel 56, eerste lid, onderdeel a, van de Wet op de Accountants-Administratieconsulenten][ref1] heeft
      vastgesteld, blijven de door het examenbureau, bedoeld in [artikel 85, eerste lid, van die wet][ref2], vastgestelde
      eisen, bedoeld in [artikel 5, eerste lid, van het Examenbesluit Accountants-Administratieconsulenten 1994][ref3],
      zoals die luidden voor het tijdstip van inwerkingtreding van deze wet, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel85
      [ref3]: https://wetten.overheid.nl/BWBR0006454#Artikel5
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '56'
      - id: ref2
        bwb_id: BWBR0002856
        artikel: '85'
      - id: ref3
        bwb_id: BWBR0006454
        artikel: '5'
  - number: '85.2'
    text: |-
      Tot het tijdstip waarop de Commissie eindtermen accountantsopleiding de eindtermen, bedoeld in
      [artikel 69, tweede lid, onderdeel a, van de Wet op de Registeraccountants][ref1] heeft vastgesteld, blijven de
      door het examenbureau, bedoeld in [artikel 74, eerste lid, van die wet][ref2], vastgestelde eisen, bedoeld in
      [artikel 5, eerste lid, van het Examenbesluit registeraccountants 1994][ref3], zoals die luidden voor het tijdstip
      van inwerkingtreding van deze wet, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002374#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0002374#Artikel74
      [ref3]: https://wetten.overheid.nl/BWBR0006453#Artikel5
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0002374
        artikel: '69'
      - id: ref2
        bwb_id: BWBR0002374
        artikel: '74'
      - id: ref3
        bwb_id: BWBR0006453
        artikel: '5'
  - number: '86.1'
    text: |-
      Binnen zes weken na het tijdstip van inwerkingtreding van deze wet zendt de Autoriteit Financiële Markten ter
      instemming aan Onze Minister een begroting van de in het resterende deel van het lopende jaar te verwachten baten
      en lasten, investeringsuitgaven alsmede inkomsten en uitgaven met betrekking tot de uitvoering van de bij en
      krachtens deze wet opgedragen taak en daaruit voortvloeiende werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel86
  - number: '86.2'
    text: |-
      [Artikel 32, tweede, vijfde en zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel32
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '32'
        hoofdstuk: '4'
  - number: 86a.1
    text: |-
      Tot twee jaar na de inwerkingtreding van de [Wet op het accountantsberoep][ref1] is [artikel 24b][ref2] niet
      van toepassing op werkzaamheden waarvoor de opdracht aan de accountant of accountantsorganisatie is verstrekt
      voorafgaand aan de inwerkingtreding van de Wet op het accountantsberoep.


      [ref1]: https://wetten.overheid.nl/BWBR0032573
      [ref2]: https://wetten.overheid.nl/BWBR0019468#Artikel24b
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel86a
    references:
      - id: ref1
        bwb_id: BWBR0032573
      - id: ref2
        bwb_id: BWBR0019468
        artikel: 24b
        hoofdstuk: '3'
        paragraaf: 3.1.3
        afdeling: '3.1'
  - number: 86a.2
    text: |-
      [Artikel 27, tweede lid][ref1], treedt vijf jaar na de inwerkingtreding van de [Wet op het accountantsberoep][ref2]
      in werking.


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0032573
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel86a
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '27'
        hoofdstuk: '3'
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0032573
  - number: '87'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel87
  - number: '88'
    text: 'Deze wet wordt aangehaald als: Wet toezicht accountantsorganisaties.'
    url: https://wetten.overheid.nl/BWBR0019468/2021-07-01#Artikel88
