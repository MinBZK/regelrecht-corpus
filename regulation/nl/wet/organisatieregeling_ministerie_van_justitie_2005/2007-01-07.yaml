      - id: ref1
        bwb_id: BWBR0018331
        artikel: '3'
        hoofdstuk: I
  - number: '2'
    text: |-
      Het ministerie bestaat uit de volgende dienstonderdelen:

      a. de hierna genoemde dienstonderdelen, die rechtstreeks ressorteren onder de secretaris-generaal:

      1°. de directie Algemene Justitiële Strategie (DAJS);

      2°. het Wetenschappelijk Onderzoek- en Documentatiecentrum (WODC);

      3°. het bureau Secretaris-Generaal (BSG);

      4°. de directie Voorlichting (DV);

      5°. de directie Financieel-Economische Zaken (DFEZ);

      6°. de directie Personeel en Organisatie (DP&O);

      7°. de directie Informatisering (DI);

      8°. de Departementale Auditdienst (DAD);

      9°. de directie Bedrijfsvoering en Ondersteuning Bestuursdepartement (DBOB);

      10°. de Gemeenschappelijke Beheerorganisatie (GBO);

      11°. de directie Inkoop, Huisvesting en Milieu (DIHM);

      12°. de programmaorganisatie Vernieuwing HRM Justitie;

      b. het directoraat-generaal Internationale Aangelegenheden en Vreemdelingenzaken (DGIAV), dat bestaat uit een
      stafondersteuning en de volgende dienstonderdelen:

      1°. het stafbureau Internationale Zaken (SIZ);

      2°. de stafdirectie Coördinatie Vreemdelingenketen (SCV);

      3°. de directie Vreemdelingenbeleid (DVB);

      4°. de directie Coördinatie Integratiebeleid Minderheden (DCIM);

      5°. de directie Internationale Strafrechtelijke Aangelegenheden en Drugsbeleid (DISAD);

      6°. het secretariaat van de Adviescommissie voor vreemdelingenzaken (secretariaat ACV);

      7°. de Immigratie- en Naturalisatiedienst (IND);

      c. het directoraat-generaal Preventie, Jeugd en Sancties (DGPJS), dat bestaat uit een stafondersteuning en de
      volgende dienstonderdelen:

      1°. de directie Sanctie- en Preventiebeleid (DSP);

      2°. de directie Justitieel Jeugdbeleid (DJJ);

      3°. de Inspectie voor de Sanctietoepassing (ISt);

      4°. de baten-lastendienst Dienst JUSTIS;

      5°. de dienst Justitiële Inrichtingen (DJI);

      6°. de raad voor de kinderbescherming (RvdK);

      d. het directoraat-generaal Wetgeving, Rechtspleging en Rechtsbijstand (DGWRR), dat bestaat uit een
      stafondersteuning en de volgende dienstonderdelen:

      1°. de directie Wetgeving (DW);

      2°. de directie Strategie Rechtspleging (DSR);

      3°. de directie Toegang Rechtsbestel (DTR);

      e. het directoraat-generaal Rechtshandhaving (DGRh), dat bestaat uit de volgende dienstonderdelen:

      1°. het stafbureau (Sb) Directeur-Generaal;

      2°. het bureau Juridische en Beleidsondersteunende Aangelegenheden (BJBA);

      3°. het bureau Operationele Zaken (BOZ);

      4°. de directie Opsporingsbeleid (DOB);

      5°. de directie Handhaving (DH);

      6°. het Nederlands Forensisch Instituut (NFI);

      7°. het Centraal Justitieel Incassobureau (CJIB);

      8°. het Programmabureau Veiligheid;

      f. de Nationaal Coördinator Terrorismebestrijding (NCTb), bestaande uit de volgende dienstonderdelen:

      1°. het bureau NCTb;

      2°. de afdeling Communicatie;

      3°. de directie Beleid en Strategie (DBS);

      4°. de directie Regie (DR);

      5°. de directie Kennis & Analyse (DKA);

      6°. de directie Beveiliging Burgerluchtvaart (DBB);

      7°. de Inspectie Beveiliging Burgerluchtvaart (IBBLV);

      8°. de eenheid Bewaking en Beveiliging (EBB);

      g. het projectdirectoraat-generaal Herinrichting Vreemdelingenketen (PDGHV).
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel2
  - number: '3'
    text: |-
      1 De secretaris-generaal is ambtelijk eindverantwoordelijk voor de leiding van de in [artikel 2][ref1] genoemde
      dienstonderdelen.

      2 De secretaris-generaal wordt bij afwezigheid volledig vervangen door de plaatsvervangend secretaris-generaal.
      Daarnaast treedt de plaatsvervangend secretaris-generaal ten aanzien van door de secretaris-generaal vast te
      stellen taken in de bevoegdheden en verantwoordelijkheden van de secretaris-generaal.

      3 De directeuren-generaal zijn belast met de beleids- en bedrijfsvoering van de tot hun directoraat-generaal
      behorende onderdelen. Eén van de binnen het directoraat-generaal vallende directeuren van onderdelen wordt op
      voordracht van de betreffende directeur-generaal namens de minister door de secretaris-generaal aangewezen als
      plaatsvervangend directeur-generaal. De eerste en tweede volzin zijn van overeenkomstige toepassing op de Nationaal
      Coördinator Terreurbestrijding.

      4 De secretaris-generaal (voorzitter), de plaatsvervangend secretaris-generaal en de directeuren-generaal vormen
      samen de bestuursraad. De bestuursraad formuleert de Justitiebrede en gemeenschappelijke kaders en bewaakt dat de
      activiteiten en het beleid van de onderscheiden directoraten-generaal daarbinnen blijven. De voorzitter van het
      College van procureurs-generaal neemt als toehoorder deel aan de bestuursraad.


      [ref1]: https://wetten.overheid.nl/BWBR0018331#Artikel2
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018331
        artikel: '2'
        hoofdstuk: I
  - number: '4'
    text: |-
      1 Onverminderd [artikel 3][ref1] is de secretaris-generaal integraal verantwoordelijk voor de beleids- en
      bedrijfsvoering van de rechtstreeks onder hem ressorterende dienstonderdelen.

      2 Ten aanzien van door hem aan te wijzen dienstonderdelen kan de secretaris-generaal taken opdragen aan de
      plaatsvervangend secretaris-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0018331#Artikel3
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel4
