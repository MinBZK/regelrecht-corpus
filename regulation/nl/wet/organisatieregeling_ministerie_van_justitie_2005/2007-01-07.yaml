  - number: '57'
    text: |-
      1 De directeur Personeel en Organisatie is belast met het beheer van deze regeling.

      2 De secretaris-generaal, de plaatsvervangend secretaris-generaal en de directeuren-generaal zijn verantwoordelijk
      voor een juiste, volledige en tijdige aanlevering aan de directeur Personeel en Organisatie van de gegevens die een
      goed beheer van deze regeling mogelijk maken.
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel57
  - number: '58'
    text: |-
      Na inwerkingtreding van deze regeling berust het Taak- en bevoegdheidsbesluit plv. secretaris-generaal Justitie op
      de [artikelen 3, tweede lid, tweede volzin][ref1], en [4, tweede lid][ref2], van deze regeling.


