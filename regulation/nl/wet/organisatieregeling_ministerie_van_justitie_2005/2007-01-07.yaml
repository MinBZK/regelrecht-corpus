        artikel: '27'
  - number: '10'
    text: |-
      1 De directie Personeel en Organisatie (DP&O) is belast met advisering van de departementsleiding over en de
      ontwikkeling en coördinatie van justitiebreed organisatie- en personeelsbeleid.

      2 De directie bestaat uit:

      a. het cluster Human Resource Development;

      b. het cluster Arbeidsvoorwaarden, Rechtspositie en Juridische Aangelegenheden;

      c. het cluster Organisatieontwikkeling en -advies;

      d. het cluster Loopbaan/Mobiliteit;

      e. het cluster Innovatie;

      f. het cluster Informatiemanagement;

      g. het cluster Kwaliteitszorg;

      h. het cluster Personeelszaken;

      i. de dienst Salarisadministratie en Financiële Rechtspositietoepassing (SAFIR);

      j. het bedrijfsbureau.
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel10
  - number: '11'
    text: |-
      1 De directie Informatisering (DI) is belast met de advisering van de departementsleiding over, de coördinatie
      van departementale vraagstukken en projectleiding van sectoroverstijgende projecten op het gebied van informatie-
      en communicatietechnologie.

      2 De directie bestaat uit:

      a. de sectie ICT-advies;

      b. de sectie Programmamanagement;

      c. het projectenbureau.
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel11
  - number: '12'
    text: |-
      1 De Departementale Auditdienst (DAD) is belast met:

      a. het uitvoeren van de wettelijke controletaak, bedoeld in [artikel 66 van de Comptabiliteitswet 2001][ref1];

      b. het verrichten van overig periodiek onderzoek naar de bedrijfs- en de beleidsvoering op basis van de
      [artikelen 20][ref2] en [21 van de Comptabiliteitswet 2001][ref3].

      2 De DAD bestaat uit:

      a. de accountgroep I DGIAV;

      b. de accountgroep II DGPJS;

      c. de accountgroep III DGWRR, DGRh;

      d. de accountgroep IV SG en PSG-blok;

      e. het bureau Bedrijfsvoering en Managementondersteuning.


