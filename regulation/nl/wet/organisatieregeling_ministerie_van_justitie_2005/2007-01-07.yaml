  - number: '5'
    text: |-
      De directie Algemene Justitiële Strategie (DAJS) is belast met het ondersteunen van de departementsleiding bij het
      ontwikkelen en vormgeven van justitiebrede strategie. Dit bewerkstelligt zij in het bijzonder door het uitvoeren
      van toekomst- en omgevingsgerichte verkenningen en het op basis daarvan signaleren van strategische thema’s alsmede
      het bevorderen van de doorwerking daarvan, dit in goed samenspel met partners binnen en buiten het ministerie.
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel5
  - number: '6'
    text: |-
      1 Het Wetenschappelijk Onderzoek- en Documentatiecentrum (WODC) is belast met het verrichten van onderzoek en
      het doen verrichten van onderzoek, het adviseren over voorgenomen beleidsprogramma’s en te voeren beleid en te
      verrichten onderzoek alsmede het verspreiden van binnen het WODC aanwezige kennis op het terrein van Justitie en
      met de documentatie van (sociaal-)wetenschappelijke publicaties;

      2 Het WODC bestaat uit:

      a. de onderzoeksafdeling Asiel & Migratie;

      b. de onderzoeksafdeling Criminaliteitspreventie, Slachtofferzorg, Jeugdbescherming en Sanctietoepassing;

      c. de onderzoeksafdeling Regelgeving, Rechtspleging & Rechtsbijstand;

      d. de onderzoeksafdeling Rechtshandhaving;

      e. de afdeling Externe Wetenschappelijke Betrekkingen;

      f. de afdeling Statistische lnformatievoorziening en Beleidsanalyse;

      g. de afdeling Documentaire lnformatievoorziening;

      h. het bedrijfsbureau.
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel6
  - number: '7'
    text: |-
      Het bureau Secretaris-Generaal (BSG) is belast met algemene staftaken en de secretariële, administratieve en
      organisatorische ondersteuning van de ministers, de secretaris-generaal en de plaatsvervangend secretaris-generaal.
      Het is voorts belast met de protocolaire ondersteuning van de departementsleiding van het ministerie en vervult
      daarbij een coördinerende rol. Deze taken worden gekenmerkt door een representatief of vertrouwelijk karakter.
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel7
  - number: '8'
    text: |-
      1 De directie Voorlichting (DV) is belast met het geven van informatie van en over de Justitieorganisatie. Hierbij
      wordt gezocht naar een goede balans tussen het belang van het ministerie en dat van de ontvangers. Ook heeft de
      directie een belangrijke functie om politieke en maatschappelijke signalen op te vangen en terug te koppelen binnen
      de Justitieorganisatie.

      2 De directie bestaat uit:

      a. de afdeling Communicatieadvies;

      b. de afdeling Persvoorlichting en beleidspresentatie;

      c. de afdeling Off- en online media;

      d. de afdeling Publieksvoorlichting;

      e. het bureau Managementondersteuning.
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel8
  - number: '9'
    text: |-
      1 De directie Financieel-Economische Zaken (DFEZ) is belast met de advisering van de departementsleiding
      over financiële en macro-economische aspecten van beleid, bedrijfsvoering en uitvoering als bedoeld in
      [artikel 27, eerste en tweede lid, van de Comptabiliteitswet 2001][ref1] en de daaruit voortvloeiende regelgeving.

      2 De directie bestaat uit:

      a. de afdeling Begroting en Strategie;

      b. de afdeling Financiële Infrastructuur & Administratie;

      c. de afdeling Financieel-Economische Advisering & Control;

      d. het bureau Managementondersteuning.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel27
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel9
