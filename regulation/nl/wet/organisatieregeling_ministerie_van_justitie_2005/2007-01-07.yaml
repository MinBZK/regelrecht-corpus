  - number: '13'
    text: |-
      1 De directie Bedrijfsvoering en Ondersteuning Bestuursdepartement (DBOB) is voor de departementsleiding en
      directies in de sector bestuursdepartement dé dienstverlener op het gebied van huisvesting, werkplekservices,
      documentaire informatievoorziening, ICT en inkoopondersteuning binnen het bestuursdepartement.

      2 De directie bestaat uit:

      a. de hoofdafdeling Facilitaire Zaken;

      b. de hoofdafdeling Informatie & Communicatie Technologie;

      c. de hoofdafdeling Documentaire Informatievoorziening;

      d. de hoofdafdeling Commerciële Zaken;

      e. het bedrijfsbureau.
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel13
  - number: '14'
    text: |-
      1 De Gemeenschappelijke Beheerorganisatie (GBO) is belast met het beheer van geautomatiseerde personeelsinformatie-
      en financiële systemen ter ondersteuning van de bedrijfsvoering, en van andere gemeenschappelijk gebruikte
      systemen, zoals het intranet.

      2 De GBO bestaat uit:

      a. de afdeling Front Office;

      b. de afdeling Back Office;

      c. de afdeling Bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel14
  - number: '15'
    text: |-
      De directie Inkoop, Huisvesting en Milieu (DIHM) is belast met het realiseren van beleid, kaders en richtlijnen op
      het bedrijfsvoeringterrein van inkoop, huisvesting en milieu.
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel15
  - number: '16'
    text: |-
      De programmaorganisatie Vernieuwing HRM Justitie is belast met de taak om uitvoering te geven aan het
      kabinetsbesluit van 31 januari 2003 ter zake van de vernieuwing van de HRM functie binnen de sector Rijk en het
      kabinetsbesluit van 4 juli 2003 tot oprichting van een Shared Service Center HRM voor Personeelsregistratie en
      Salarisadministratie (Kamerstukken II 2002/03, 28 610, nr. 2) genaamd ‘P-Direkt’. De programmaorganisatie is
      belast met het vernieuwen van de personeelsfunctie, de Justitiebrede reorganisatie van de P&O-kolom en het invoeren
      van zelfbediening voor medewerkers en managers om een verbetering van de kwaliteit en efficiency te bereiken. De
      programmaorganisatie zorgt dat Justitiebreed wordt aangesloten op de diensten van het Shared Service Center HRM.
      Zij faciliteert daartoe de lijnorganisatie, die uiteindelijk verantwoordelijk blijft.
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel16
  - number: '17'
    text: |-
      1 Onverminderd [artikel 3][ref1] is de directeur-generaal Internationale Aangelegenheden en Vreemdelingenzaken
      integraal verantwoordelijk voor de beleids- en bedrijfsvoering van de binnen het directoraat-generaal
      Internationale Aangelegenheden en Vreemdelingenzaken ondergebrachte dienstonderdelen. De directeur-generaal is
      daarnaast verantwoordelijk voor de coördinatie van de internationale aspecten van het beleid van het ministerie.

      2 De directeur-generaal wordt hierbij secretarieel, organisatorisch en administratief ondersteund door de
      stafondersteuning.


      [ref1]: https://wetten.overheid.nl/BWBR0018331#Artikel3
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel17
