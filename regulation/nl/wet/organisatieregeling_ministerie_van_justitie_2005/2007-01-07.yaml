  - number: '18'
    text: |-
      Het stafbureau Internationale Zaken (SIZ) is belast met de coördinatie van de internationale aspecten van het
      beleid van het ministerie.
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel18
  - number: '19'
    text: |-
      1 De stafdirectie Coördinatie Vreemdelingenketen (SCV) maakt het mogelijk dat uitvoeringsinstanties in de
      vreemdelingenketen hun primaire processen zodanig inrichten dat een optimaal resultaat in de keten wordt bereikt en
      beleidsdoelstellingen worden gerealiseerd.

      2 De stafdirectie bestaat uit:

      a. het cluster Keteninformatie;

      b. het cluster Ketenorganisatie;

      c. het projectbureau van het project Terugkeer;

      d. het bedrijfsbureau.
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel19
  - number: '20'
    text: |-
      1 De directie Vreemdelingenbeleid (DVB) is belast met de zorg voor de nationale en internationale
      beleidsontwikkeling op het asiel- en immigratieterrein, alsmede op het terrein van opvang van asielzoekers.
      Het aandachtsveld van de directie bestaat aldus uit toelating, verblijf, toezicht, terugkeer, grensbewaking,
      visumbeleid, opvang en de coördinatie van het beleid tot het tegengaan van illegaal verblijf.

      2 De directie coördineert het interdepartementaal overleg ter voorbereiding van het regeringsbeleid inzake asiel
      en migratie.

      3 De directie adviseert de departementsleiding over het nationale en internationale vreemdelingenbeleid en
      ondersteunt de departementsleiding ten behoeve van en bij overleggen.

      4 De directie heeft verder tot taak het Centraal Orgaan opvang asielzoekers binnen de door de directeur-generaal
      gestelde kaders beheersmatig en financieel aan te sturen.

      5 De directie bestaat uit:

      a. het cluster Toelating en verblijf;

      b. het cluster Toezicht en terugkeer;

      c. het cluster Opvang en Financiën;

      d. de managementondersteuning.
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel20
  - number: '21'
    text: |-
      1 De directie Coördinatie Integratiebeleid Minderheden (DCIM) is belast met de verantwoordelijkheid voor het
      inburgeringsbeleid.

      2 De directie is belast met het ontwikkelen en uitvoeren van het remigratiebeleid.

      3 De directie heeft een coördinerende taak ten aanzien van:

      a. het integratiebeleid waaronder, onderwijs, jeugd, arbeidsmarkt en diversiteitsbeleid;

      b. het antidiscriminatie- en remigratiebeleid;

      c. het strategisch beleid ten aanzien van de [Rijkswet op het Nederlanderschap][ref1];

      d. het initiëren van beleidsvoornemens van de directie op Europees en internationaal niveau.

      4 De directie bestaat uit:

      a. de afdeling Inburgering, Onderwijs en Werk;

      b. de afdeling Antiracisme, Huisvesting en Participatie;

      c. de afdeling Strategie, Onderzoek en Communicatie;

      d. het bureau Ondersteuning.


      [ref1]: https://wetten.overheid.nl/BWBR0003738
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003738
  - number: '22'
    text: |-
      1 De directie Internationale Strafrechtelijke Aangelegenheden en Drugsbeleid (DISAD) is belast met de ontwikkeling
      en coördinatie van en overleg over het nationaal en internationaal justitieel drugsbeleid, het verzorgen van
      de samenhang bij de inbreng van Justitie in internationale gremia op het gebied van justitiële en politiële
      samenwerking en met de ontwikkeling, coördinatie en uitvoering van taken op het terrein van de internationale
      rechtshulp in strafzaken en met de advisering van de departementsleiding over en de ontwikkeling van beleid op het
      gebied van de internationale strafrechtelijke samenwerking.

      2 De directie is belast met de samenwerking met de Nederlandse Antillen en Aruba voor zover dat raakt aan het
      werkterrein van Justitie.

      3 De directie bestaat uit:

      a. het bureau Coördinatie Drugsbeleid;

      b. het bureau Internationale Rechtshulp in Strafzaken;

      c. het bureau Internationale Strafrechtelijke Samenwerking;

      d. het bureau Managementondersteuning.
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel22
  - number: '23'
    text: |-
      1 Het secretariaat van de Adviescommissie voor vreemdelingenzaken (secretariaat ACV) is belast met de ambtelijke
      ondersteuning van die commissie.

      2 Het secretariaat bestaat uit:

      a. procescluster Advisering;

      b. procescluster Informatie en Documentatie;

      c. procescluster Bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel23
  - number: '24'
    text: |-
      De Immigratie- en Naturalisatiedienst (IND) is belast met de uitvoering van de Vreemdelingenwetgeving en van de
      [Rijkswet op het Nederlanderschap][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003738
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003738
  - number: '25'
    text: |-
      1 Onverminderd [artikel 3][ref1] is de directeur-generaal Preventie, Jeugd en Sancties integraal verantwoordelijk
      voor de beleids- en bedrijfsvoering van de binnen het directoraat-generaal Preventie, Jeugd en Sancties
      ondergebrachte dienstonderdelen.

      2 De directeur-generaal wordt hierbij secretarieel, organisatorisch en administratief ondersteund door de
      stafondersteuning.

      3 Bij de directeur-generaal kunnen programma’s worden ondergebracht, al dan niet van tijdelijke aard.


      [ref1]: https://wetten.overheid.nl/BWBR0018331#Artikel3
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0018331
        artikel: '3'
        hoofdstuk: I
  - number: '26'
    text: |-
      1 De directie Sanctie- en Preventiebeleid (DSP) is belast met de verantwoordelijkheid voor de advisering van de
      departementsleiding over en de coördinatie, ontwikkeling en evaluatie van beleid dat gericht is op het bevorderen
      van de veiligheid van de maatschappij door:

      a. de consequente en effectieve tenuitvoerlegging van vrijheidsbenemende en vrijheidsbeperkende straffen en
      maatregelen bij volwassenen;

      b. de vermindering van de recidive door gedragsinterventies en goede aansluiting op maatschappelijke opvang;

      c. het aanbieden van dienstverlening aan slachtoffers van criminaliteit;

      d. het voorkomen van criminaliteit door inzet van preventieve maatregelen met het oog op een veilige en
      rechtvaardige samenleving.

      2 Tevens is de directie belast met de advisering van de departementsleiding over en de ontwikkeling, coördinatie en
      evaluatie van beleid dat gericht is op het reguleren en beheersen van kansspelen met bijzondere aandacht voor het
      beschermen van de consument, het tegengaan van gokverslaving en het tegengaan van illegaliteit en criminaliteit.

      3 De directie heeft op haar terrein een coördinerende taak in de advisering van de directeur-generaal Preventie,
      Jeugd en Sancties omtrent de besturing en beleidsvoering van de baten-lastendienst Dienst JUSTIS en de dienst
      Justitiële Inrichtingen, voorzover het haar beleidsterrein betreft.

      4 De directie is namens de directeur-generaal belast met het toezicht op en het sturen van de door de directie
      gesubsidieerde organisaties en instellingen.

      5 De directie bestaat uit:

      a. de afdeling Informatievoorziening, Besturing en Begroting;

      b. de afdeling Sanctiebeleid;

      c. de afdeling Preventie en Slachtofferbeleid;

      d. het tijdelijke Programma kansspelen;

      e. de afdeling Reclassering;

      f. het bureau Managementondersteuning;

      g. het secretariaat van het Schadefonds Geweldsmisdrijven (SGM);

      h. het secretariaat van de Raad voor strafrechtstoepassing en Jeugdbescherming (secretariaat RSJ);

      i. het bureau van het College van toezicht op de kansspelen (bureau CvtK).

      6 De in het vijfde lid onder g, h en i, genoemde dienstonderdelen zijn belast met de bedrijfsvoering en
      ondersteuning van de in die onderdelen genoemde zelfstandige bestuursorganen.
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel26
  - number: '27'
    text: |-
      1 De directie Justitieel Jeugdbeleid (DJJ) is belast met de advisering van de departementsleiding over en de
      coördinatie, ontwikkeling en evaluatie van beleid dat zich richt op:

      a. het met justitiële instrumenten voorkomen en aanpakken van jeugdcriminaliteit en van bedreigende situaties voor
      kinderen en gezinnen;

      b. de bevordering van een samenhangende strafrechtelijke en pedagogische aanpak van de jeugdige nadat deze zich
      schuldig heeft gemaakt aan strafwaardig gedrag.

      2 De directie heeft een coördinerende taak in de advisering van de directeur-generaal Preventie, Jeugd en Sancties
      omtrent de besturing en beleidsvoering van de raad voor de kinderbescherming en de dienst Justitiële Inrichtingen,
      voorzover het haar beleidsterrein betreft.

      3 De directie is namens de directeur-generaal belast met het toezicht op en het sturen van de door de directie
      gesubsidieerde organisaties en instellingen en onderhoudt de besturingsrelatie omtrent de doeluitkeringen aan de
      provincies en grootstedelijke regio’s ten aanzien van de jeugdbescherming en de jeugdreclassering.

      4 De directie heeft verder tot taak het Landelijk Bureau Inning Onderhoudsbijdragen binnen de door de directeur-
      generaal gestelde kaders beheersmatig en financieel aan te sturen.

      5 De directie bestaat uit:

      a. de afdeling Toezicht en Financiën;

      b. de afdeling Besturing;

      c. de afdeling Ontwikkeling;

      d. de afdeling Juridische en Internationale Zaken, die tevens werkzaamheden verricht voor de directeur-generaal en
      diens stafondersteuning en de directie Sanctie- en Preventiebeleid;

      e. het directiesecretariaat.
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel27
  - number: '28'
    text: |-
      1 De Inspectie voor de Sanctietoepassing (ISt) ziet toe op de sanctietoepassing met het oog op zichtbare
      verbetering van de effectiviteit en kwaliteit van de sanctietoepassing.

      2 De Inspectie voor de Sanctietoepassing adviseert de departementsleiding ten behoeve van borging van behoorlijke
      sanctietoepassing.
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel28
  - number: '29'
    text: |-
      De baten-lastendienst Dienst JUSTIS is belast met het namens de minister nemen van besluiten en verwerken van
      informatie ter bevordering van een betrouwbare, veilige en rechtvaardige samenleving in sectoren met kwetsbare
      belangen.
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel29
  - number: '30'
    text: |-
      De dienst Justitiële Inrichtingen (DJI) is belast met het leveren van een bijdrage aan de veiligheid van de
      samenleving door tenuitvoerlegging van vrijheidsstraffen en vrijheidsbenemende maatregelen en door de aan de zorg
      van het Ministerie toevertrouwde personen de kans te bieden een maatschappelijk aanvaardbaar bestaan op te bouwen.
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel30
  - number: '31'
    text: |-
      De raad voor de kinderbescherming (RvdK) is belast met het waarborgen van het fundamentele recht van het kind
      op een gezonde en evenwichtige ontwikkeling en uitgroei naar volwassenheid. De raad voert de volgende taken uit:
      beschermingszaken, scheiding en omgang, adoptie en strafzaken.
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel31
  - number: '32'
    text: |-
      1 Onverminderd [artikel 3][ref1] is de directeur-generaal Wetgeving, Rechtspleging en Rechtsbijstand integraal
      verantwoordelijk voor de beleids- en bedrijfsvoering van de binnen het directoraat-generaal Wetgeving,
      Rechtspleging en Rechtsbijstand ondergebrachte dienstonderdelen.

      2 De directeur-generaal wordt hierbij secretarieel, organisatorisch en administratief ondersteund door de
      stafondersteuning.


      [ref1]: https://wetten.overheid.nl/BWBR0018331#Artikel3
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0018331
        artikel: '3'
        hoofdstuk: I
  - number: '33'
    text: |-
      1 De directie Wetgeving (DW) is belast met de ontwikkeling, totstandkoming, het beheer en onderhoud van
      Justitiewetgeving, alsmede met het ontwikkelen en uitdragen van het wetgevingskwaliteitsbeleid en de toetsing
      van ontwerpwetgeving van de ministeries op rechtsstatelijke en bestuurlijke kwaliteit, met inbegrip van de
      constitutionele, Europeesrechtelijke en internationaalrechtelijke toetsing van wetgeving. Voorts worden juridische
      adviestaken uitgevoerd betreffende: de coördinatie van contacten met de landsadvocaat, het geven van juridisch
      advies in gecompliceerde aangelegenheden en het uitvoeren van bijzondere opdrachten van de departementsleiding.

      2 De directie bestaat uit:

      a. de sector Straf- en sanctierecht;

      b. de sector Staats- en bestuursrecht;

      c. de sector Privaatrecht;

      d. de sector Wetgevingskwaliteitsbeleid;

      e. de Juridisch Adviseur;

      f. het bureau Managementondersteuning.
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel33
  - number: '34'
    text: |-
      1 De directie Strategie Rechtspleging (DSR) is binnen het kader van de ministeriële verantwoordelijkheid voor
      de rechtspleging belast met de beleidsadvisering van de departementsleiding over het stelsel van de rechterlijke
      organisatie en behartigt de relatie tussen de rechterlijke macht en de Minister van Justitie. De directie draagt
      zorg voor de bekostiging van de Raad voor de rechtspraak en beoordeelt de verantwoording van de raad. De directie
      is voorts belast met het beheer van de Hoge Raad, het College bescherming persoonsgegevens, de Commissie gelijke
      behandeling en de Nederlandse Vereniging voor Rechtspraak.

      2 De directie bestaat uit:

      a. de sector Strategie en Ontwikkeling;

      b. de sector Instrumentatie, Begroting en Verantwoording;

      c. het bureau Managementondersteuning.
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel34
  - number: '35'
    text: |-
      1 De directie Toegang Rechtsbestel (DTR) is belast met de beleidsadvisering van de departementsleiding over en
      de uitvoering van de aan de minister opgedragen taken op het terrein van de rechtsbijstand, juridische beroepen,
      alternatieve geschillenbeslechting (ADR), schuldsanering natuurlijke personen en tolken en vertalers.

      2 De directie bestaat uit:

      a. de afdeling Rechtsbijstand, Schuldsanering en Conflictbemiddeling;

      b. de afdeling Juridische Beroepsgroepen en Tolken;

      c. de afdeling Financieel Economische en Bestuurlijke Aangelegenheden;

      d. het bureau Managementondersteuning.
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel35
  - number: '36'
    text: |-
      1 Onverminderd [artikel 3][ref1] is de directeur-generaal Rechtshandhaving integraal verantwoordelijk
      voor de beleids- en bedrijfsvoering van de binnen het directoraat-generaal Rechtshandhaving ondergebrachte
      dienstonderdelen.

      2 De directeur-generaal is daarnaast beheersverantwoordelijk voor het openbaar ministerie.

      3 De directeur-generaal wordt hierbij secretarieel, organisatorisch en administratief ondersteund door het
      stafbureau, bedoeld in [artikel 40][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018331#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018331#Artikel40
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0018331
        artikel: '3'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0018331
        artikel: '40'
        hoofdstuk: VI
  - number: '37'
    text: |-
      Het stafbureau (Sb) Directeur-Generaal is belast met de ondersteuning en (politiek-bestuurlijke) advisering van de
      directeur-generaal, beide directeuren en de bureauhoofden. Binnen het stafbureau zijn de directieoverschrijdende
      staf- en bedrijfsvoeringsondersteuning ondergebracht.
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel37
  - number: '38'
    text: |-
      Het bureau Operationele Zaken (BOZ) is belast met de ondersteuning van de Minister van Justitie en de directeur-
      generaal Rechtshandhaving bij de uitoefening van een aantal strafvorderlijke bijzondere bevoegdheden, onder meer op
      het gebied van de opsporing, vervolging en crisisbeheersing en fungeert als aanspreekpunt voor onder meer politie,
      openbaar ministerie en andere (opsporings)instanties.
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel38
  - number: '39'
    text: |-
      Het bureau Juridische en Beleidsondersteunende Aangelegenheden (BJBA) is belast met de juridische en beleidsmatige
      ondersteuning van het directoraat-generaal.
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel39
  - number: '40'
    text: |-
      1 De Directie Opsporingsbeleid (DOb) is belast met het geven van vorm en inhoud aan het justitiële
      opsporingsbeleid. Bijzondere aandacht gaat daarbij uit naar nieuwe en politiek gevoelige verschijningsvormen van
      criminaliteit en de kwaliteit, organisatie en sturing van de opsporing.

      2 De directie bestaat uit:

      a. het cluster Criminaliteitsbestrijding;

      b. het cluster Kwaliteit, Organisatie en Sturing;

      c. het Meldpunt Ongebruikelijke Transacties (MOT);

      d. het bureau Platform Interceptie, Decryptie en Signaalanalyse;

      e. het Centraal Informatiepunt Onderzoek Telecommunicatie.
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel40
  - number: '41'
    text: |-
      1 De directie Handhaving is, met inachtneming van de verantwoordelijkheden van het openbaar ministerie, belast met
      de advisering van de Minister van Justitie over het beleid op het terrein van de rechtshandhaving in het algemeen
      en op het gebied van de strafrechtelijke handhaving in het bijzonder. Specifieke aandacht gaat daarbij uit naar
      coördinatie van beleid binnen de strafrechtketen.

      2 De directie bestaat uit:

      a. het cluster Strafrechtelijk beleid;

      b. het cluster Ordeningswetgeving;

      c. het expertisecentrum Rechtshandhaving;

      d. de Justitiële Informatiedienst (JustID).
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel41
  - number: '42'
    text: |-
      1 Het Nederlands Forensisch Instituut (NFI) staat, met het oog op de waarheidsvinding op het terrein van de
      forensische wetenschap ten dienste van het openbaar ministerie, de politie, overige personen en instanties die
      zijn belast met de opsporing van strafbare feiten, de zittende magistratuur en het Ministerie van Justitie. Indien
      de bijzondere deskundigheid van het NFI of gronden aan het algemeen belang daartoe aanleiding geven, kan worden
      besloten dat het NFI ook diensten verricht in het kader van de ondersteuning bij de daadwerkelijke handhaving van
      de (inter)nationale rechtsorde of de hulpverleningstaak van de politie dan wel ten behoeve van enig andere zaak.

      2 De kerntaken van het NFI zijn:

      a. het verrichten van forensisch zaakonderzoek op overwegend technisch, medisch-biologisch en
      natuurwetenschappelijk gebied en het ter zake uitbrengen van een verslag;

      b. het ontwikkelen en implementeren van nieuwe onderzoeksmethoden en technieken zowel ten behoeve van het NFI als
      politie en justitie;

      c. het zijn van (inter)nationaal kennis- en expertisecentrum.
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel42
  - number: '43'
    text: |-
      Het Centraal Justitieel Incassobureau (CJIB) is ten behoeve van het openbaar ministerie en het ministerie belast
      met het afhandelen, innen en coördineren van opgelegde straffen, bestuurlijke sancties, transacties en maatregelen.
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel43
  - number: '44'
    text: |-
      Het Programmabureau Veiligheid is een gezamenlijk bureau van en voor de Minister van Justitie en de Minister
      van Binnenlandse Zaken en Koninkrijksrelaties ten behoeve van de coördinatie van de uitvoering van het
      Veiligheidsprogramma ‘Naar een veiliger samenleving’ (Kamerstukken II 2002/03, 28 684, nr. 1).
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel44
  - number: '45'
    text: |-
      1 Onverminderd [artikel 3][ref1] is de Nationaal Coördinator Terrorismebestrijding integraal verantwoordelijk voor
      de beleids- en bedrijfsvoering van de rechtstreeks onder hem ressorterende dienstonderdelen.

      2 De NCTb legt inhoudelijk direct verantwoording af aan de Ministers van Justitie en van Binnenlandse Zaken en
      Koninkrijksrelaties.

      3 De NCTb wordt hierbij secretarieel, organisatorisch en administratief ondersteund door de Staf NCTb.


      [ref1]: https://wetten.overheid.nl/BWBR0018331#Artikel3
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0018331
        artikel: '3'
        hoofdstuk: I
  - number: '46'
    text: |-
      1 Het bureau NCTb is belast met de ondersteuning van de NCTb in de dagelijkse aansturing van de Staf NCTb en de
      ondersteuning van de Staf NCTb in primaire processen.

      2 Het bureau coördineert en beheert de inzet van de voor terrorismebestrijding beschikbare middelen, bereidt
      beslissingen over de aanwending van die middelen voor, brengt hierover advies uit aan de Ministers van Justitie
      en van Binnenlandse Zaken en Koninkrijksrelaties en waarborgt de informatievoorziening over de inzet van deze
      middelen.

      3 Het bureau adviseert de NCTb over beleidsvoorstellen waaraan financiële of uitvoeringsconsequenties zijn
      verbonden.

      4 Het bureau behandelt juridische vraagstukken, met name op het gebied van de toepassing van wetgeving.
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel46
  - number: '47'
    text: |-
      De afdeling Communicatie is belast met de invulling van de communicatiefilosofie, -concepten en -strategie per fase
      van terrorismebestrijding alsmede met het maken van draaiboeken en protocollen op het terrein van communicatie per
      fase ten tijde van crisis.
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel47
  - number: '48'
    text: |-
      1 De directie Beleid en Strategie (DBS) zorgt voor de ontwikkeling van een helder en eenduidig beleid op het vlak
      van terrorismebestrijding, daaronder begrepen strategische en internationale beleidsontwikkeling.

      2 De directie integreert bestaande beleidsactiviteiten van de diverse actoren, regisseert de beleidsmatige inbreng
      van andere betrokkenen binnen de Ministeries van Justitie en van Binnenlandse Zaken en Koninkrijksrelaties en
      draagt zorg voor de noodzakelijke onderzoeksprogrammering.
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel48
  - number: '49'
    text: |-
      De directie Regie (DR) is belast met:

      a. het regisseren van de samenwerking van de verschillende partijen op het specifieke terrein van
      terrorismebestrijding via structurele (procesgerichte) en incidentele (actiegerichte) regie;

      b. het realiseren van een hogere samenwerkingsgraad tussen die partijen.
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel49
  - number: '50'
    text: |-
      1 De directie Kennis & Analyse (DKA) vormt het centrale punt in de integratie van inlichtingen en informatie tot
      concrete analyses en een helder actueel dreigingsbeeld inzake terrorisme.

      2 De directie functioneert als het expertise- en informatiecentrum waarin alle andere partners op dit vlak
      participeren en hun informatie aanleveren. Verder vindt hier de waardering plaats van alle informatie uit
      bronnen op hoog en laag niveau binnen zeer diverse kringen, waarvoor het noodzakelijk is om informatiestromen te
      organiseren en te onderhouden.
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel50
  - number: '51'
    text: |-
      1 De directie Beveiliging Burgerluchtvaart (DBB) is belast met de beveiliging van de burgerluchtvaart tegen
      terrorisme.

      2 Het bureau heeft de volgende hoofdtaken:

      a. het in nationaal en internationaal verband opstellen van het beleid op het gebied van de beveiliging van de
      burgerluchtvaart;

      b. het opstellen van regels en het geven van aanwijzingen aan de Koninklijke Marechaussee en de luchtvaartsector op
      basis van de Luchtvaartwet en de [Politiewet 1993][ref1];

      c. het aansturen van de Koninklijke Marechaussee, voorzover deze onder het gezag van de Minister van Justitie is
      belast met het toezicht op de uitvoering van de beveiligingsmaatregelen door de luchtvaartsector;

      d. het opstellen en actualiseren van het nationaal beveiligingsplan voor de burgerluchtvaart;

      e. het uitvoeren van risicoanalyses op basis waarvan eventuele aanvullende beveiligingsmaatregelen worden genomen;

      f. het goedkeuren van beveiligingsplannen van zowel de luchthavens als de luchtvaartmaatschappijen;

      g. het onderzoeken van nieuwe beveiligingsconcepten, beveiligingsprocessen en beveiligingsapparatuur;

      h. het certificeren van opleidingsorganisaties;

      i. het deelnemen aan internationale beveiligingsaudits op luchthavens.


      [ref1]: https://wetten.overheid.nl/BWBR0006299
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0006299
  - number: '52'
    text: |-
      1 De Inspectie Beveiliging Burgerluchtvaart (IBBLV) is belast met:

      a. het toezicht op de inrichting van de keten van de beveiliging van de burgerluchtvaart;

      b. het toezicht op de kwaliteit van de beveiliging van de burgerluchtvaart, daaronder begrepen het toezicht
      op de taakuitoefening door de directie Beveiliging Burgerluchtvaart, en door de Commandant van de Koninklijke
      marechaussee, bedoeld in [artikel 37t van de Luchtvaartwet][ref1].

      2 De Inspectie adviseert de Nationaal Coördinator Terrorismebestrijding ten behoeve van borging van een
      aanvaardbaar niveau van beveiliging van de burgerluchtvaart.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37t
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37t
  - number: '53'
    text: |-
      De Eenheid Bewaking en Beveiliging (EBB) is belast met het onderhouden, uitvoeren en vernieuwen van een
      gezaghebbend, robuust en transparant nationaal stelsel van bewaken en beveiligen.
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel53
  - number: 53a
    text: |-
      Het projectdirectoraat-generaal Herinrichting Vreemdelingenketen is belast met:

      a. het tot stand brengen van een afzonderlijke terugkeerorganisatie;

      b. de aansturing van de totstandkoming van één toelatingsorganisatie;

      c. het tot stand brengen van overige verbeteringen in de vreemdelingenketen;

      d. de uitvoering van het project Terugkeer.
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel53a
  - number: '54'
    text: |-
      Bij de hoofden van de in [artikel 2][ref1] genoemde dienstonderdelen ligt voor het daarbij werkzame personeel een
      exemplaar van deze regeling alsmede het organisatie- en formatierapport van het betreffende dienstonderdeel ter
      inzage.


      [ref1]: https://wetten.overheid.nl/BWBR0018331#Artikel2
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0018331
        artikel: '2'
        hoofdstuk: I
  - number: '55'
    text: |-
      1 Een voornemen tot aanpassing van de organisatie zoals deze is weergegeven in deze regeling, wordt genomen door de
      secretaris generaal, gehoord de bestuursraad.

      2 De directeur Personeel en Organisatie adviseert de secretaris generaal alvorens een beslissing omtrent instemming
      wordt genomen.
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel55
  - number: '56'
    text: |-
      1 Elk van de in [artikel 2][ref1] genoemde dienstonderdelen ontwerpt en onderhoudt een organisatierapport en een
      formatierapport en, voor zover van toepassing, een taakbesluit en een baten-lastendienstregeling.

      2 Voor zover een document als bedoeld in het eerste lid betrekking heeft op een dienstonderdeel, genoemd in
      [artikel 2, onder a en f][ref2], is de secretaris-generaal bevoegd het document namens de minister vast te stellen.

      3 Voor zover een document als bedoeld in het eerste lid betrekking heeft op een dienstonderdeel, genoemd in
      [artikel 2, onder b tot en met e en g][ref3], is de directeur-generaal onder wie het dienstonderdeel ressorteert,
      bevoegd het document namens de minister vast te stellen.

      4 De secretaris-generaal respectievelijk de directeur-generaal kan de in het tweede respectievelijk derde lid
      bedoelde bevoegdheid mandateren aan een onder hem ressorterende ambtenaar.

      5 Alvorens een document als bedoeld in het eerste lid, kan worden vastgesteld, behoeft dit de instemming van de
      bestuursraad. De directeur Personeel en Organisatie adviseert de bestuursraad alvorens een beslissing omtrent
      instemming wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0018331#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018331#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0018331#Artikel2
    url: https://wetten.overheid.nl/BWBR0018331/2007-01-07#Artikel56
