  - number: Ia.2
    text: |-
      Naar aanleiding van de evaluatie van deze wet kan bij algemene maatregel van bestuur de kring van betrokkenen op
      wie [hoofdstuk 4a van de Wet hersteloperatie toeslagen][ref1] van toepassing is, worden uitgebreid.


      [ref1]: https://wetten.overheid.nl/BWBR0047436#Hoofdstuk4A
