preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is aanvullende maatregelen te treffen voor kinderen,
    ex-partners van gedupeerde aanvragers kinderopvangtoeslag, nabestaanden van overleden gedupeerde aanvragers
    kinderopvangtoeslag en nabestaanden van overleden kinderen in het kader van de hersteloperatie toeslagen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0048413/2025-01-01#ArtikelAanhef
articles:
  - number: Ia.1
    text: |-
      Onze Minister zendt, in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid, Onze Minister van
      Volksgezondheid, Welzijn en Sport en Onze Minister van Binnenlandse zaken, binnen één jaar na de inwerkingtreding
      van [artikel I, onderdeel EEa][ref1], aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten
      van [hoofdstuk 4a van de Wet hersteloperatie toeslagen][ref2] in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0048413#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0047436#Hoofdstuk4A
    url: https://wetten.overheid.nl/BWBR0048413/2025-01-01#ArtikelIa
