      artikelen en onderdelen daarvan verschillend kan worden vastgesteld, met dien verstande dat
      [artikel I, onderdelen A, onder 2, DD, onder 1, 3 en 5, EE, onder 1, 3 en 5, en CCC, onder 2][ref1],
      terugwerkt tot en met 5 november 2022.


