preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is aanvullende maatregelen te treffen voor kinderen,
    ex-partners van gedupeerde aanvragers kinderopvangtoeslag, nabestaanden van overleden gedupeerde aanvragers
    kinderopvangtoeslag en nabestaanden van overleden kinderen in het kader van de hersteloperatie toeslagen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0048413/2024-04-22#ArtikelAanhef
articles:
  - number: II.1
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      artikelen en onderdelen daarvan verschillend kan worden vastgesteld, met dien verstande dat
      [artikel I, onderdelen A, onder 2, DD, onder 1, 3 en 5, EE, onder 1, 3 en 5, en CCC, onder 2][ref1],
      terugwerkt tot en met 5 november 2022.


      [ref1]: https://wetten.overheid.nl/BWBR0048413#ArtikelI
    url: https://wetten.overheid.nl/BWBR0048413/2024-04-22#ArtikelII
