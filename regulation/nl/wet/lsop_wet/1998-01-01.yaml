valid_from: '1998-01-01'
bwb_id: BWBR0006942
url: https://wetten.overheid.nl/BWBR0006942/1998-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in verband met de intrekking van de Politiewet (Stb. 1989, 223)
    wenselijk is de bepalingen uit die wet die betrekking hebben op de uitvoering van taken op het gebied van de
    landelijke wervingsactiviteiten, de selectie en het onderwijs voor de politie in een afzonderlijke wet op te nemen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: LSOP: Landelijk selectie- en
      opleidingsinstituut politie; Onze Ministers: Onze Ministers van Justitie en van Binnenlandse Zaken gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel1
  - number: '2.1'
    text: |-
      Er is een Landelijk selectie- en opleidingsinstituut politie, belast met de in [artikel 3, eerste lid][ref1],
      genoemde taak.


      [ref1]: https://wetten.overheid.nl/BWBR0006942#Artikel3
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006942
        artikel: '3'
  - number: '2.2'
    text: Het LSOP heeft rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel2
  - number: '3.1'
    text: 'Het LSOP heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel3
  - number: 3.1.a
    text: |-
      de landelijke werving, de selectie en de verzorging van de basisopleidingen, die door Onze Ministers worden
      aangewezen, en de verzorging van de door Onze Ministers aan te wijzen vervolgopleidingen van ambtenaren van politie
      of andere door Onze Ministers aan te wijzen categorieën van personen; en
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel3
  - number: 3.1.b
    text: |-
      de selectie of de verzorging van andere dan de onder *a* bedoelde opleidingen van een door Onze Minister van
      Justitie of Onze Minister van Binnenlandse Zaken aan te wijzen categorie van personen.
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel3
  - number: '3.2'
    text: Het LSOP kan andere dan de in het eerste lid bedoelde opleidingen verzorgen.
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel3
  - number: '3.3'
    text: |-
      Onze Minister van Justitie of Onze Minister van Binnenlandse Zaken maakt van de bevoegdheid, bedoeld in het eerste
      lid, onder *b*, geen gebruik dan na overleg met Onze andere Minister en na het horen van de bestuursraad.
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel3
  - number: '3.4'
    text: Het LSOP beheert het selectiecentrum en de instellingen voor de door Onze Ministers aangewezen opleidingen.
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel3
  - number: '3.5'
    text: |-
      Het LSOP maakt bij de uitoefening van zijn taak zoveel mogelijk gebruik van de instellingen, bedoeld in het vierde
      lid. Het coördineert de werkzaamheden van deze instellingen.
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel3
  - number: '4'
    text: De organen van het LSOP zijn de bestuursraad en de directie.
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel4
  - number: '5.1'
    text: |-
      De bestuursraad is het hoogste orgaan van het LSOP. Aan de bestuursraad komt alle bevoegdheid toe voor zover bij de
      wet of het reglement niet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel5
  - number: '5.2'
    text: |-
      De bestuursraad bestaat uit vijftien leden, waaronder een voorzitter. Zij worden bij koninklijk besluit op
      gemeenschappelijke voordracht van Onze Ministers benoemd en ontslagen. De voorzitter en de overige leden van de
      bestuursraad worden benoemd voor een periode van vier jaren. Zij kunnen eenmaal worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel5
  - number: '5.3'
    text: 'In de bestuursraad hebben zitting:'
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel5
  - number: 5.3.a
    text: drie burgemeesters,
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel5
  - number: 5.3.b
    text: twee leden van het openbaar ministerie,
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel5
  - number: 5.3.c
    text: vier ambtenaren van politie,
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel5
  - number: 5.3.d
    text: twee vertegenwoordigers van politievakorganisaties en
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel5
  - number: 5.3.e
    text: |-
      vier leden uit onderscheidene sectoren van de maatschappij, zijnde anderen dan direct bij het functioneren van de
      politie betrokkenen.
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel5
  - number: '5.4'
    text: |-
      De leden van de bestuursraad kunnen uit hun midden een dagelijks bestuur benoemen, waaraan taken en bevoegdheden
      van de bestuursraad worden gedelegeerd.
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel5
  - number: '5.5'
    text: |-
      De voorzitter en een ander door de bestuursraad aan te wijzen lid vertegenwoordigen gezamenlijk het LSOP in en
      buiten rechte.
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel5
  - number: '5.6'
    text: |-
      De bestuursraad verstrekt Onze Ministers desgevraagd de inlichtingen die nodig zijn voor de beoordeling van de
      uitvoerbaarheid van beleidsvoornemens en voorgenomen wettelijke voorschriften, voor zover deze betrekking hebben op
      de landelijke werving, de selectie en het onderwijs van de politie.
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel5
  - number: '6.1'
    text: De directie is belast met de dagelijkse leiding van het LSOP.
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel6
  - number: '6.2'
    text: De directie bestaat uit ten hoogste drie leden.
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel6
  - number: '6.3'
    text: |-
      De directie is verantwoording verschuldigd aan de bestuursraad, neemt diens aanwijzingen in acht en verstrekt deze
      de gevraagde inlichtingen omtrent haar handelingen.
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel6
  - number: '7'
    text: |-
      De bestuursraad kan ten behoeve van de landelijke wervingsactiviteiten, de selectie en het onderwijs één of meer
      begeleidingscommissies instellen.
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel7
  - number: '8.1'
    text: |-
      De bestuursraad stelt ter nadere regeling van het bestuur en de inrichting van het LSOP een reglement vast, de
      directie gehoord.
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel8
  - number: '8.2'
    text: 'Het reglement bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel8
  - number: 8.2.a
    text: |-
      een opsomming van de taken en bevoegdheden van het dagelijks bestuur, bedoeld in [artikel 5, vierde lid][ref1],
      indien een dagelijks bestuur is benoemd:


      [ref1]: https://wetten.overheid.nl/BWBR0006942#Artikel5
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006942
        artikel: '5'
  - number: 8.2.b
    text: een opsomming van de taken die de directie verricht;
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel8
  - number: 8.2.c
    text: |-
      een opsomming van de werkzaamheden die de instellingen, bedoeld in [artikel 3, vierde lid][ref1], verrichten; en


      [ref1]: https://wetten.overheid.nl/BWBR0006942#Artikel3
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006942
        artikel: '3'
  - number: 8.2.d
    text: |-
      regels omtrent de samenstelling, taak en werkwijze van de begeleidingscommissies, bedoeld in [artikel 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006942#Artikel7
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006942
        artikel: '7'
  - number: '9.1'
    text: 'Tot het personeel van het LSOP worden in ieder geval gerekend:'
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel9
  - number: 9.1.a
    text: de leden van de directie;
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel9
  - number: 9.1.b
    text: de directeuren van de instellingen;
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel9
  - number: 9.1.c
    text: ambtenaren in dienst van het LSOP en
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel9
  - number: 9.1.d
    text: de bij het LSOP anders dan met het oog op het ontvangen van onderwijs gedetacheerde ambtenaren van politie.
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel9
  - number: '9.2'
    text: |-
      De in het eerste lid, onder *a*, bedoelde leden van de directie worden op aanbeveling van de bestuursraad bij
      koninklijk besluit op gemeenschappelijke voordracht van Onze Ministers benoemd, geschorst en ontslagen. Bij
      algemene maatregel van bestuur op gemeenschappelijke voordracht van Onze Ministers wordt bepaald welke andere
      ambtenaren dan die bedoeld in het eerste lid, onder *a*, op overeenkomstige wijze worden benoemd, geschorst en
      ontslagen.
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel9
  - number: '9.3'
    text: |-
      De in het eerste lid, onder *b*, bedoelde directeuren worden benoemd, geschorst en ontslagen door de bestuursraad,
      voor zover deze ambtenaren niet krachtens het tweede lid bij koninklijk besluit worden benoemd, geschorst en
      ontslagen.
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel9
  - number: '9.4'
    text: |-
      De in het eerste lid, onder c, bedoelde ambtenaren worden benoemd, bevorderd, geschorst en ontslagen door de
      directie, voor zover deze ambtenaren niet krachtens het tweede lid bij koninklijk besluit worden benoemd, geschorst
      en ontslagen.
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel9
  - number: '9.5'
    text: |-
      Ambtenaren, bedoeld in het eerste lid, onder *d*, worden door de beheerder van het politiekorps op verzoek van de
      directie bij het LSOP gedetacheerd. Bijzondere ambtenaren van politie worden door Onze Minister van Justitie op
      verzoek van de directie bij het LSOP gedetacheerd.
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel9
  - number: '9.6'
    text: |-
      Voor zover bij dit artikel niet anders is bepaald, zijn de bij of krachtens
      [artikel 50, eerste lid, van de Politiewet 1993][ref1] gestelde regels van overeenkomstige toepassing
      op de bij het LSOP in dienst zijnde ambtenaren. Bij of krachtens algemene maatregel van bestuur kunnen
      aanvullende bepalingen worden gegeven, indien dit in verband met enige andere bepaling uit deze wet vereist
      is.[Artikel 50, tweede lid, van de Politiewet 1993][ref2] is van overeenkomstige toepassing op de bij het LSOP in
      dienst zijnde ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel50
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '50'
      - id: ref2
        bwb_id: BWBR0006299
        artikel: '50'
  - number: '10.1'
    text: |-
      Onze Ministers stellen, de bestuursraad gehoord, de duur en de eindtermen vast van de opleidingen, bedoeld in
      [artikel 3, eerste lid, onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006942#Artikel3
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006942
        artikel: '3'
  - number: '10.2'
    text: |-
      Met betrekking tot opleidingen als bedoeld in [artikel 3, eerste lid, onder ][ref1], komt gelijke bevoegdheid toe
      aan Onze Minister van Justitie of aan Onze Minister van Binnenlandse Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0006942#Artikel3
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006942
        artikel: '3'
  - number: '10.3'
    text: |-
      Onze Minister van Justitie of Onze Minister van Binnenlandse Zaken maakt van de bevoegdheid, bedoeld in het tweede
      lid, geen gebruik dan na overleg met Onze andere Minister en na het horen van de bestuursraad.
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel10
  - number: '10.4'
    text: |-
      De bestuursraad stelt jaarlijks een werkplan vast voor elke opleiding die het LSOP verzorgt, de desbetreffende
      begeleidingscommissie gehoord. Het werkplan wordt ter kennisneming toegezonden aan Onze Ministers.
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel10
  - number: '10.5'
    text: De bestuursraad stelt het jaarlijks toe te laten aantal cursisten met betrekking tot de opleidingen vast.
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel10
  - number: '11.1'
    text: |-
      Aan het LSOP wordt jaarlijks uit 's Rijks kas een bijdrage verstrekt ter bekostiging van de in
      [artikel 3, eerste lid][ref1], bedoelde taak.


      [ref1]: https://wetten.overheid.nl/BWBR0006942#Artikel3
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006942
        artikel: '3'
  - number: '11.2'
    text: |-
      Het LSOP dient jaarlijks een begroting in van de inkomsten en uitgaven voor het daarop volgende kalenderjaar en
      doet rekening en verantwoording van de inkomsten en uitgaven in het daaraan voorafgaande kalenderjaar. De begroting
      en de rekening en verantwoording behoeven de instemming van Onze Ministers.
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel11
  - number: '11.3'
    text: De bestuursraad stelt jaarlijks een overzicht op van het gevoerde en het te voeren beleid.
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel11
  - number: '11.4'
    text: |-
      Onze Ministers kunnen nadere regels stellen omtrent de wijze waarop en de voorwaarden waaronder de bijdrage,
      bedoeld in het eerste lid, wordt verstrekt, alsmede omtrent de wijze waarop de begroting en de rekening en
      verantwoording zijn ingericht en de termijnen waarbinnen deze worden ingezonden.
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel11
  - number: '12.1'
    text: Onze Ministers dragen zorg voor de inspectie van de opleidingen.
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel12
  - number: '12.2'
    text: De bestuursraad verstrekt Onze Ministers inlichtingen over de hun toekomende taken en bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel12
  - number: '12.3'
    text: |-
      Onze Ministers kunnen aan de bestuursraad aanwijzingen geven indien dit met het oog op de goede uitvoering van zijn
      taak noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel12
  - number: 12a
    text: |-
      De [artikelen 53a][ref1] tot en met [53c van de Politiewet 1993][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel53a
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel53c
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: 53a
      - id: ref2
        bwb_id: BWBR0006299
        artikel: 53c
  - number: '13'
    text: |-
      Onze Ministers zenden voor 1 juli 1998 een evaluatie van de landelijke wervingsactiviteiten, de selectie en het
      onderwijs voor de politie op basis van deze wet, aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel13
  - number: '14.2'
    text: |-
      De nadere regelingen die zijn gebaseerd op [artikel 66][ref1], eerste lid, onder *b*, [artikel 67][ref2],
      [artikel 68][ref3], eerste lid, en [artikel 75](onbekend), eerste en tweede lid, en [artikel 76, vierde lid, van
      de Politiewet](onbekend), berusten na de intrekking van die wet op respectievelijk [artikel 3, eerste lid][ref4],
      [artikel 10, eerste en tweede lid][ref5], en [artikel 11, vierde lid][ref6], van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0006299#Artikel68
      [ref4]: https://wetten.overheid.nl/BWBR0006942#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0006942#Artikel10
      [ref6]: https://wetten.overheid.nl/BWBR0006942#Artikel11
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '66'
      - id: ref2
        bwb_id: BWBR0006299
        artikel: '67'
      - id: ref3
        bwb_id: BWBR0006299
        artikel: '68'
      - id: ref4
        bwb_id: BWBR0006942
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0006942
        artikel: '10'
      - id: ref6
        bwb_id: BWBR0006942
        artikel: '11'
  - number: '16'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel16
  - number: '17'
    text: 'Deze wet kan worden aangehaald als: LSOP-wet.'
    url: https://wetten.overheid.nl/BWBR0006942/1998-01-01#Artikel17
