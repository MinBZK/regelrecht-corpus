preamble:
  text: |-
    Gelet op artikel 11 van het Reglement voor de binnenvisserij 1985;

    Gezien het verzoek van de Federatie van Hengelsportverenigingen ’De Randstad’ d.d. 23 juni 1998;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0010058/1998-12-13#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Van artikel 6, eerste lid, onderdeel a, van het Reglement voor de binnenvisserij 1985 wordt vrijstelling verleend
      voor zover het betreft het vissen met de hengel, geaasd met enig kunstaas, in het Oostvoornsemeer.
    url: https://wetten.overheid.nl/BWBR0010058/1998-12-13#Artikel1
  - number: '2'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0010058/1998-12-13#Artikel2
