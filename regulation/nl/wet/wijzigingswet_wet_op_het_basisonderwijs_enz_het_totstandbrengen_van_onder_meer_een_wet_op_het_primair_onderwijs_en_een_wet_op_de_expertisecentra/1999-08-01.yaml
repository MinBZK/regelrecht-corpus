      Een personeelslid dat op 31 juli 1998 in dienst van een bevoegd gezag onderwijs geeft als bedoeld in
      [artikel 13, tweede lid, van de Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs][ref1]
      zoals luidend op die datum en bevoegd is op basis van [artikel 111, derde lid, van die wet][ref2], is bevoegd
      tot het geven van het onderwijs, bedoeld in [artikel 13, tweede lid, van de Wet op de expertisecentra][ref3]
      en [artikel 13, tweede lid, van deel II van de Wet op het voortgezet onderwijs](onbekend) voor de duur van het
      dienstverband met bedoeld bevoegd gezag of de rechtsopvolger van dat bevoegd gezag.


