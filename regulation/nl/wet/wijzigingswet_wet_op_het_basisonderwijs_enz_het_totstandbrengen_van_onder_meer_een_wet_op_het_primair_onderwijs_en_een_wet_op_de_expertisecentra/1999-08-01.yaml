  - number: IL.2
    text: |-
      De eerste volzin van het eerste lid is onverminderd
      [artikel 89, vijfde lid, van de Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs][ref1]
      zoals deze luidde op 31 juli 1998 van overeenkomstige toepassing op de periode van 1 januari 1999 tot en met 31
      december 1999 met dien verstande dat


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel89
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelIL
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '89'
  - number: IL.2.a
    text: |-
      de bedragen in de programma's van eisen worden aangepast overeenkomstig
      [artikel 89, zesde lid, van de Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs][ref1],
      zoals deze luidde op 31 juli 1998 en


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel89
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelIL
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '89'
  - number: IL.2.b
    text: |-
      de programma's van eisen voor de afzonderlijke soorten speciaal onderwijs als bedoeld in
      [artikel 2, tweede lid onder i, l en o van die wet][ref1] worden samengevoegd tot programma's van eisen die gelden
      voor alle speciale scholen voor basisonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelIL
