  - number: LV-1.1
    text: |-
      Met ingang van 1 augustus 1998 worden de regionale verwijzingscommissies, bedoeld in
      [artikel 32a van de Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs][ref1]
      zoals dit artikel luidde op 31 juli 1998, omgezet in regionale verwijzingscommissies als
      bedoeld in [artikel 13e1 van de Wet op het primair onderwijs][ref2] en zijn, voor zover
      bij algemene maatregel van bestuur niet anders wordt bepaald, de regio's, bedoeld in
      [artikel 13e1, tweede lid, van de Wet op het primair onderwijs][ref3] de regio's die op grond van
      [artikel 32a, tweede lid, van de Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs][ref4],
      zoals luidend vóór de inwerkingtreding van deze wet, werden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel32a
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel13e1
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel13e1
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel32a
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelLV-1
