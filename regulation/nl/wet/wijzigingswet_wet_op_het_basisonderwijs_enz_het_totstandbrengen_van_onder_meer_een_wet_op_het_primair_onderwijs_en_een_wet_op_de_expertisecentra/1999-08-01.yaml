      [artikel 3, zevende lid, van de Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs][ref1] is
      aangesteld of benoemd in het schooljaar 1997–1998 en waarvan de aanstelling of benoeming eindigt in het schooljaar
