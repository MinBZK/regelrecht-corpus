  - number: LI-1
    text: |-
      Voor de toepassing van [artikel 92, eerste lid, van de Wet op het primair onderwijs][ref1] begint op 1 januari 2000
      een nieuwe periode van vijf jaar als bedoeld in dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel92
