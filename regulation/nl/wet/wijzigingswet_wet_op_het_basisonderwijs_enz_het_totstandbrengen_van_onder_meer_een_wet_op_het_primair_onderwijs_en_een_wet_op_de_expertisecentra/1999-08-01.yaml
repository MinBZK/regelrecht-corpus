        artikel: '2'
  - number: IL.3
    text: |-
      Voor de in het tweede lid bedoelde periode wordt uitgegaan van het aantal leerlingen dat op 1 oktober 1998
      onderscheidenlijk, bij toepassing van [artikel 97, zevende lid, van laatstgenoemde wet][ref1] op 16 januari 1999
      was ingeschreven bij de speciale school voor basisonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel97
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelIL
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '97'
  - number: L.1
    text: |-
      In het schooljaar 1998–1999 wordt ten behoeve van besteding aan personele uitgaven aan de basisscholen naast de
      formatie, bedoeld in [artikel 96a, eerste lid onder a en b, van de Wet op het primair onderwijs][ref1] verstrekt:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel96a
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelL
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 96a
  - number: L.1.a
    text: een bedrag van f 28,- per leerling op basis van 103% van het feitelijke aantal leerlingen op 1 oktober 1997, en
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelL
  - number: L.1.b
    text: in voorkomende gevallen het bedrag, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelL
  - number: L.2
    text: |-
      Indien in het schooljaar 1998–1999 in een samenwerkingsverband de som van de formatierekeneenheden op grond van
      de [artikelen 96b1][ref1] en [96h van de Wet op primair onderwijs][ref2] hoger zou zijn geweest dan de som van
      de op grond van [artikel XLV, eerste lid][ref3], toegekende formatierekeneenheden en de in formatierekeneenheden
      uitgedrukte middelen bedoeld in het eerste lid, onder a, wordt aan de gezamenlijke basisscholen in dat verband een
      bedrag toegekend dat overeen komt met de geldswaarde van het verschil tussen beide sommen. Het Rijk verdeelt dit
      bedrag naar rato van het aantal leerlingen van elk van die basisscholen op 1 oktober 1997.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel96b1
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel96h
      [ref3]: https://wetten.overheid.nl/BWBR0009525#ArtikelXLV
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelL
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 96b1
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 96h
      - id: ref3
        bwb_id: BWBR0009525
        artikel: XLV
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: L.3
    text: |-
      Indien een speciale school voor basisonderwijs deelneemt aan meer dan een samenwerkingsverband, dan wordt voor de
      toepassing van het tweede lid de formatie van die school toegerekend aan de samenwerkingsverbanden naar rato van
      het aantal basisschoolleerlingen van elk van die verbanden op 1 oktober 1997.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelL
  - number: L.4
    text: |-
      In afwijking van [artikel 105i van de Wet op het primair onderwijs][ref1] en het eerste lid mag 10% van de
      vergoeding op grond van het eerste tot en met derde lid worden besteed aan materiële instandhouding.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel105i
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelL
    references:
