        artikel: 102e
  - number: LII.2
    text: |-
      Voor speciale scholen voor basisonderwijs vindt de toepassing van de overschrijdingsregeling voor de periode vanaf
      1 augustus 1998 plaats op basis van de [artikelen 105b tot en met 105g van de Wet op het primair onderwijs][ref1].
      De termijnen waarop de eerste vaststellingen, bedoeld in [artikel 105d, eerste, zesde en zevende lid][ref2], en
      [artikel 105e, eerste lid, van die wet][ref3] betrekking hebben, beginnen op die datum en worden dienovereenkomstig
      ingekort. De termijn waarop de eerste vaststelling, bedoeld in [artikel 105c, van die wet][ref4] betrekking heeft,
      begint op 1 januari 1999.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel105b
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel105d
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel105e
      [ref4]: https://wetten.overheid.nl/BWBR0003420#Artikel105c
