  - number: LII.1
    text: |-
      Voor het speciaal onderwijs aan kinderen met leer- en opvoedingsmoeilijkheden, moeilijk
      lerende kinderen of in hun ontwikkeling bedreigde kleuters van scholen onderscheidenlijk
      afdelingen die op 31 juli 1998 voor bekostiging in aanmerking kwamen, vindt de toepassing
      van de overschrijdingsregeling voor de periode tot en met die datum plaats op basis van de
      __REF000___________________________________________________________________________________________________________
      ____ zoals die luidden op die datum. De termijnen waarop de laatste vaststellingen, bedoeld in
      [artikel 102d, zesde en zevende lid][ref2], en [artikel 102e, eerste lid, van die wet][ref3] betrekking hebben,
      eindigen op die datum en worden dienovereenkomstig ingekort.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel102b
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel102d
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel102e
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelLII
