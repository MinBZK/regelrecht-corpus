preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om een deel van het speciaal onderwijs tezamen met het
    basisonderwijs te regelen in een Wet op het primair onderwijs, om een deel van het voortgezet speciaal onderwijs
    tezamen met het voortgezet onderwijs te regelen in de Wet op het voortgezet onderwijs, om het overige speciaal en
    voortgezet speciaal onderwijs te regelen in een Wet op de expertisecentra en om enige technische wijzigingen aan te
    brengen in enkele andere wetten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelAanhef
articles:
  - number: V.1
    text: De Overgangswet WBO wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelV
  - number: V.2
    text: De Overgangswet WBO zoals deze luidde op 31 juli 1998 blijft van toepassing op
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelV
  - number: V.2.a
    text: aanvragen die binnen de daarvoor geldende termijn zijn ingediend,
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelV
  - number: V.2.b
    text: bezwaarschriften en beroepschriften die binnen de daarvoor geldende termijn zijn ingediend, en
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelV
  - number: V.2.c
    text: aanspraken die op die datum op grond van artikel E 17 of E 18 van die wet bestaan.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelV
  - number: V.3
    text: |-
      Met ingang van het jaar 1986 ontvangt het bevoegd gezag van een bijzondere basisschool gevestigd in gebouwen en
      lokalen bedoeld in de artikelen 62, 126 en 127 van de Kleuteronderwijswet en de artikelen 84, 205 en 205bis van de
      Lager-onderwijswet 1920 jaarlijks van de gemeente een vergoeding.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelV
  - number: V.4
    text: |-
      Burgemeester en wethouders kunnen de jaarlijkse vergoeding bedoeld in het derde lid, vervangen door een uitkering
      ineens, indien het bevoegd gezag dat eigenaar is van de voor vergoeding in aanmerking komende gebouwen, dit
      verzoekt.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelV
  - number: V.5
    text: |-
      Bij algemene maatregel van bestuur worden nadere voorschriften gegeven omtrent de uitvoering van het derde lid.
      Deze algemene maatregel van bestuur bepaalt tevens de verplichtingen van het bevoegd gezag ten opzichte van de
      gemeente, indien de gebouwen en lokalen bedoeld in artikel 126 van de Kleuteronderwijswet en artikel 205 van de
      Lager-onderwijswet 1920, niet meer voor het basisonderwijs worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelV
  - number: V.6
    text: |-
      De algemene maatregel van bestuur bedoeld in het vijfde lid, wordt aan de Tweede Kamer der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat 30 dagen na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens de Kamer de wens te kennen wordt gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsontwerp zo spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelV
  - number: V.7
    text: |-
      De algemene maatregel van bestuur die op grond van artikel E 35, vierde lid, van de Overgangswet WBO tot stand is
      gekomen, geldt met ingang van 1 augustus 1998 als algemene maatregel van bestuur, gebaseerd op het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelV
  - number: VI.1
    text: De Overgangswet ISOVSO wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelVI
  - number: VI.2
    text: De Overgangswet ISOVSO zoals deze luidde op 31 juli 1998 blijft van toepassing op
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelVI
  - number: VI.2.a
    text: aanvragen die binnen de daarvoor geldende termijn zijn ingediend,
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelVI
  - number: VI.2.b
    text: bezwaarschriften en beroepschriften die binnen de daarvoor geldende termijn zijn ingediend, en
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelVI
  - number: VI.2.c
    text: |-
      aanspraken die op die datum op grond van artikel E 16, E 17 of E 18 van die wet bestaan, met dien verstande dat
      in artikel E 18 van die wet onder« een school voor speciaal onderwijs» tevens wordt begrepen: een speciale school
      voor basisonderwijs..
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelVI
  - number: VI.3
    text: |-
      Met ingang van het jaar 1989 ontvangt het bevoegd gezag van een bijzondere school voor speciaal onderwijs, voor
      voortgezet speciaal onderwijs dan wel voor speciaal en voortgezet speciaal onderwijs of een bijzondere speciale
      school voor basisonderwijs, gevestigd in gebouwen bedoeld in artikel 205 van de Lager-onderwijswet 1920 en in
      artikel 184 van het Besluit buitengewoon onderwijs 1967 (Stb. 1978, 582), jaarlijks van de gemeente een vergoeding
      per lokaal.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelVI
  - number: VI.4
    text: |-
      Burgemeester en wethouders kunnen de jaarlijkse vergoeding bedoeld in het derde lid, vervangen door een uitkering
      ineens, indien het bevoegd gezag dat eigenaar is van de voor vergoeding in aanmerking komende gebouwen, dit
      verzoekt.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelVI
  - number: VI.5
    text: |-
      Bij algemene maatregel van bestuur worden nadere voorschriften gegeven omtrent de uitvoering van het derde lid.
      Deze algemene maatregel van bestuur bepaalt tevens de verplichtingen van het bevoegd gezag ten opzichte van de
      gemeente, indien de gebouwen bedoeld in het derde lid, niet meer voor het geven van speciaal onderwijs, voortgezet
      speciaal onderwijs of basisonderwijs worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelVI
  - number: VI.6
    text: |-
      Geschillen tussen de gemeente en het bevoegd gezag over de toepassing van het bij of krachtens dit artikel
      bepaalde, worden onderworpen aan de beslissing van gedeputeerde staten, tenzij het geschillen betreft ter zake
      van gebouwen als bedoeld in artikel 184 van het Besluit buitengewoon onderwijs 1967, welke geschillen worden
      onderworpen aan de beslissing van de Minister van Onderwijs, Cultuur en Wetenschappen.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelVI
  - number: VI.7
    text: |-
      De algemene maatregel van bestuur die op grond van [artikel E24, vierde lid, van de Overgangswet ISOVSO](onbekend)
      tot stand is gekomen, geldt met ingang van 1 augustus 1998 als algemene maatregel van bestuur, gebaseerd op het
      vijfde lid.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelVI
  - number: VII.1
    text: |-
      De tekst van de [Wet op het primair onderwijs][ref1] wordt in het Staatsblad geplaatst. Voor de plaatsing in het
      Staatsblad stelt Onze Minister van Onderwijs, Cultuur en Wetenschappen de nummering van de artikelen, hoofdstukken,
      titels, afdelingen en paragrafen van de [Wet op het primair onderwijs][ref2] opnieuw vast en brengt hij de in die
      en deze wet voorkomende aanhalingen en de inhoudsopgave met de nieuwe nummering op grond van dit artikel en de
      [artikelen VIII][ref3] en [IX][ref4] in overeenstemming.


