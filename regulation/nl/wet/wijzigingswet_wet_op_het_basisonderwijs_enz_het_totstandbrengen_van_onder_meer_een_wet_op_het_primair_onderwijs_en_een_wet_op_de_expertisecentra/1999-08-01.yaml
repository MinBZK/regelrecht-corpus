  - number: XXIX
    text: |-
      De bij of krachtens de [artikelen XXX tot en met LV][ref1] gegeven voorschriften, voor zover zij scholen betreffen,
      zijn regels voor het openbaar onderwijs en voorwaarden voor bekostiging van het bijzonder onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0009525#ArtikelXXX
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXIX
    references:
      - id: ref1
        bwb_id: BWBR0009525
        artikel: XXX
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: XXX.1
    text: |-
      Bij ministeriële regeling worden regels vastgesteld of kunnen regels worden vastgesteld ten aanzien van onderwerpen
      waarvan deze wet bepaalt dat zij bij of krachtens algemene maatregel van bestuur worden onderscheidenlijk
      kunnen worden geregeld. De in de eerste volzin bedoelde regels vervallen met ingang van het tijdstip waarop de
      desbetreffende algemene maatregel van bestuur in werking treedt, doch uiterlijk twaalf maanden na het tijdstip
      waarop de bepaling waarop de algemene maatregel van bestuur berust, in werking is getreden.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXX
  - number: XXX.2
    text: |-
      Voor zover deze wet daarin niet voorziet, alsmede indien nodig in afwijking van het bij en krachtens deze wet
      bepaalde, kunnen bij ministeriële regeling tijdelijke regels worden vastgesteld ten behoeve van een goede invoering
      van deze wet.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXX
  - number: XXX.3
    text: |-
      Het ontwerp van een ministeriële regeling als bedoeld in het tweede lid wordt ten minste vier weken voordat de
      regeling wordt vastgesteld, toegezonden aan de beide kamers der StatenGeneraal.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXX
  - number: XXXI.1
    text: |-
      Onze Minister van Onderwijs, Cultuur en Wetenschappen kan bepalen dat de vergoedingen geheel of gedeeltelijk
      worden ingehouden, indien het bevoegd gezag van een openbare school, onderscheidenlijk het bevoegd gezag
      van een bijzondere school, de bij of krachtens de [artikelen XXX tot en met LV][ref1] gegeven voorschriften,
      onderscheidenlijk gestelde bekostigingsvoorwaarden, niet nakomt.


      [ref1]: https://wetten.overheid.nl/BWBR0009525#ArtikelXXX
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXI
    references:
      - id: ref1
        bwb_id: BWBR0009525
        artikel: XXX
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: XXXI.2
    text: |-
      Onze Minister van Onderwijs, Cultuur en Wetenschappen kent de vergoedingen wederom toe, indien blijkt dat de reden
      voor toepassing van het eerste lid is vervallen.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXI
  - number: XXXII.1
    text: |-
      Voor 1 mei 1998 of, indien het Staatsblad waarin deze wet wordt geplaatst na 2 april 1998 wordt uitgegeven,
      binnen 4 weken na de datum van uitgifte van dat Staatsblad, wordt aan Onze Minister van Onderwijs, Cultuur en
      Wetenschappen ter goedkeuring voorgelegd dat een samenwerkingsverband per 1 augustus 1998
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXII
  - number: XXXII.1.a
    text: voldoet aan het verwijzingspatroon zoals opgenomen in het tweede en derde lid,
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXII
  - number: XXXII.1.b
    text: voldoet aan de minimum-norm van 2000 leerlingen, en
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXII
  - number: XXXII.1.c.1°
    text: dezelfde samenstelling heeft als op 1 augustus 1995,
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXII
  - number: XXXII.1.c.2°
    text: |-
      een samenstelling heeft waarmee wordt ingestemd door de bevoegde gezagsorganen van alle betrokken scholen en de
      bereikbaarheid van de speciale school of speciale scholen in het samenwerkingsverband in stand blijft,
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXII
  - number: XXXII.1.c.3°
    text: |-
      een samenstelling heeft waarmee wordt ingestemd door de bevoegde gezagsorganen van alle betrokken scholen en er
      goed bereikbare zorgvoorzieningen zijn getroffen bij basisscholen,
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXII
  - number: XXXII.1.c.4°
    text: |-
      een samenstelling heeft waarmee niet wordt ingestemd door de bevoegde gezagsorganen van alle betrokken
      scholen, binnen de samenwerkingsverbanden waaraan deze scholen deelnemen met inachtneming van de wettelijke
      werkgelegenheids- en salarisgaranties goede oplossingen worden geboden voor de plaatsing van het personeel van
      de speciale scholen voor basisonderwijs en de bereikbaarheid van de speciale school of speciale scholen in het
      samenwerkingsverband in stand blijft, of
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXII
  - number: XXXII.1.c.5°
    text: |-
      een samenstelling heeft waarmee niet wordt ingestemd door de bevoegde gezagsorganen van alle betrokken
      scholen, binnen de samenwerkingsverbanden waaraan deze scholen deelnemen met inachtneming van de wettelijke
      werkgelegenheids- en salarisgaranties goede oplossingen worden geboden voor de plaatsing van het personeel van de
      speciale scholen voor basisonderwijs en er goed bereikbare zorgvoorzieningen zijn getroffen bij basisscholen.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXII
  - number: XXXII.2
    text: |-
      Het verwijzingspatroon, bedoeld in het eerste lid, onderdeel a, is dat de meeste basisscholen in een
      samenwerkingsverband
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXII
  - number: XXXII.2.a
    text: |-
      niet minder leerlingen hebben verwezen naar het speciaal onderwijs voor kinderen met leer- en
      opvoedingsmoeilijkheden, moeilijk lerende kinderen of in hun ontwikkeling bedreigde kleuters van scholen of
      scholengemeenschappen die zijn omgezet in een speciale school voor basisonderwijs van dat samenwerkingsverband dan
      naar dat speciaal onderwijs van andere scholen of scholengemeenschappen, of
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXII
  - number: XXXII.2.b
    text: |-
      geen leerlingen of slechts één leerling hebben verwezen naar het speciaal onderwijs voor kinderen met leer- en
      opvoedingsmoeilijkheden, moeilijk lerende kinderen of in hun ontwikkeling bedreigde kleuters.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXII
  - number: XXXII.3
    text: |-
      Voor de berekening op grond van het tweede lid worden de aantallen van de basisschool afkomstige leerlingen die op
      elk van de teldata 1 oktober 1993, 1 oktober 1994 en 1 oktober 1995 deelnamen aan het speciaal onderwijs van een
      school of scholengemeenschap opgeteld en worden de leerlingen die voor 2 oktober 1992 naar het speciaal onderwijs
      zijn gegaan buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXII
  - number: XXXII.4
    text: |-
      De betrokken scholen, bedoeld in het eerste lid, onderdelen c2° tot en met c5°, zijn de scholen die het
      desbetreffende samenwerkingsverband per 1 augustus 1998 gaan vormen en de scholen waarmee eerstgenoemde scholen in
      een of meer van de schooljaren 1995–1996, 1996–1997 en 1997–1998 een samenwerkingsverband vormden.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXII
  - number: XXXII.5
    text: |-
      Van het in stand blijven van de bereikbaarheid van de speciale school of scholen voor basisonderwijs, bedoeld in
      het eerste lid, onderdelen c2° en c4°, is sprake als de gemiddelde afstand van de basisscholen in het te vormen
      samenwerkingsverband tot de dichtstbijzijnde in het eigen verband gelegen speciale school voor basisonderwijs,
      daaronder niet begrepen een nevenvestiging, gelijk is aan of kleiner is dan de gemiddelde afstand in het schooljaar
      1995–1996 van de basisscholen in de samenwerkingsverbanden waarvan eerstgenoemde basisscholen in dat schooljaar
      deel uitmaakten tot de dichtstbijzijnde in het eigen verband gelegen school met speciaal onderwijs voor kinderen
      met leer- en opvoedingsmoeilijkheden of moeilijk lerende kinderen. Bij het bepalen van de gemiddelde afstand
      blijven buiten beschouwing:
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXII
  - number: XXXII.5.a
    text: |-
      scholen die in de periode van 1 augustus 1996 tot en met 1 augustus 1998 zijn gesticht of opgeheven, dan wel
      waarvan de bekostiging in die periode is beëindigd en
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXII
  - number: XXXII.5.b
    text: |-
      scholen die op 1 augustus 1995 deel uitmaakten van een samenwerkingsverband dat geheel opgaat in het te vormen
      samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXII
  - number: XXXII.6
    text: |-
      In de gevallen, bedoeld in het eerste lid, onder c4° en c5°, wordt een rapport overgelegd met betrekking tot
      het overleg met de personele geleding van de medezeggenschapsraad over de oplossingen voor de plaatsing van het
      personeel van de speciale scholen voor basisonderwijs.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXII
  - number: XXXII.7
    text: |-
      Onze Minister van Onderwijs, Cultuur en Wetenschappen hoort de landelijke besturenorganisaties en de Vereniging van
      Nederlandse Gemeenten alvorens over het verzoek om goedkeuring te beslissen in de gevallen, bedoeld in het eerste
      lid, onder c4° en c5°.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXII
  - number: XXXII.8
    text: |-
      Onze Minister van Onderwijs, Cultuur en Wetenschappen neemt bij zijn beslissing op het verzoek om goedkeuring het
      totaal van de te vormen samenwerkingsverbanden in acht.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXII
  - number: XXXII.9
    text: |-
      Wijzigingen in de samenstelling van de op grond van het eerste tot en met achtste lid tot stand gekomen
      samenwerkingsverbanden kunnen gedurende de periode van 1 augustus 1998 tot en met 31 juli 2003 slechts plaatsvinden
      voor zover zij het gevolg zijn van de stichting of opheffing van scholen of een volledige samenvoeging van
      samenwerkingsverbanden en door Onze Minister van Onderwijs, Cultuur en Wetenschappen zijn goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXII
  - number: XXXIII.1
    text: |-
      Met ingang van 1 augustus 1998 komen behoudens het gestelde in het tweede lid voor bekostiging als speciale school
      voor basisonderwijs als bedoeld in de [Wet op het primair onderwijs][ref1] in aanmerking:


      [ref1]: https://wetten.overheid.nl/BWBR0003420
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXIII
    references:
      - id: ref1
        bwb_id: BWBR0003420
  - number: XXXIII.1.a
    text: |-
      een school voor speciaal onderwijs aan kinderen met leer- en opvoedingsmoeilijkheden of moeilijk lerende kinderen
      tezamen met de eventueel daaraan verbonden afdeling voor in hun ontwikkeling bedreigde kleuters,
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXIII
  - number: XXXIII.1.b
    text: |-
      een scholengemeenschap voor speciaal onderwijs aan kinderen met leer- en opvoedingsmoeilijkheden en moeilijk
      lerende kinderen tezamen met de eventueel daaraan verbonden afdeling voor in hun ontwikkeling bedreigde kleuters,
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXIII
  - number: XXXIII.1.c
    text: |-
      het speciaal onderwijs van een school voor speciaal en voortgezet speciaal onderwijs aan kinderen met leer- en
      opvoedingsmoeilijkheden of moeilijk lerende kinderen tezamen met de eventueel aan de school verbonden afdeling voor
      in hun ontwikkeling bedreigde kleuters, en
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXIII
  - number: XXXIII.1.d
    text: |-
      het speciaal onderwijs van een scholengemeenschap voor speciaal en voortgezet speciaal onderwijs aan kinderen met
      leer- en opvoedingsmoeilijkheden en moeilijk lerende kinderen tezamen met de eventueel aan de scholengemeenschap
      verbonden afdeling voor in hun ontwikkeling bedreigde kleuters.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXIII
  - number: XXXIII.2
    text: |-
      Een afdeling voor zeer moeilijk lerende kinderen die op 31 juli 1998 was verbonden aan een school of
      scholengemeenschap als bedoeld in het eerste lid wordt met ingang van 1 augustus 1998 aangemerkt als een
      afdeling voor zeer moeilijk lerende kinderen van de speciale school voor basisonderwijs die uit eerstgenoemde
      school of scholengemeenschap is ontstaan. De leerlingen van de afdeling tellen niet mee voor de berekening van
      de formatie, de vergoeding voor nascholing en de vergoeding voor de materiële instandhouding van de speciale
      school voor basisonderwijs. Op de afdeling zijn de [Wet op de expertisecentra][ref1] en de daarop gebaseerde
      algemeen verbindende voorschriften en terzake vastgestelde beleidsregels van toepassing zoals deze luiden voor het
      desbetreffende onderwijs, met dien verstande dat bedoelde algemeen verbindende voorschriften en beleidsregels bij
      algemene maatregel van bestuur onderscheidenlijk ministeriële regeling of beleidsregels kunnen worden aangepast.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXIII
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: XXXIII.3
    text: Het eerste en tweede lid zijn alleen van toepassing voor zover
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXIII
  - number: XXXIII.3.a
    text: |-
      de desbetreffende school of scholengemeenschap, het desbetreffende onderwijs of de desbetreffende afdeling op 31
      juli 1998 voor bekostiging in aanmerking kwam of op grond van de op 31 juli 1998 geldende wetgeving met ingang van
      1 augustus 1998 voor bekostiging in aanmerking zou komen en
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXIII
  - number: XXXIII.3.b
    text: |-
      op grond van de op 31 juli 1998 geldende wetgeving met ingang van 1 augustus 1998 geen opheffing of beëindiging
      van de bekostiging van de desbetreffende school of scholengemeenschap, het desbetreffende onderwijs of de
      desbetreffende afdeling zou plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXIII
  - number: XXXIII.4
    text: |-
      In afwijking van [artikel 14, eerste lid, eerste volzin, van de Wet op het primair onderwijs][ref1] en
      [artikel 22, eerste lid, eerste volzin, van de Wet op de expertisecentra][ref2] kan aan een speciale
      school voor basisonderwijs met een afdeling als bedoeld in het tweede lid slechts een directeur
      verbonden zijn. In afwijking van [artikel 20a, tweede lid, van de Wet op het primair onderwijs][ref3] en
      [artikel 28a, tweede lid, van de Wet op de expertisecentra][ref4], geldt de benoeming van deze directeur ten
      behoeve van het verrichten van werkzaamheden aan door het bevoegd gezag in stand gehouden scholen als bedoeld in de
      genoemde wetten.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel20a
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel28a
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXIII
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '22'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: 20a
      - id: ref4
        bwb_id: BWBR0003549
        artikel: 28a
  - number: XXXIII.5
    text: |-
      [Artikel 3, zesde lid, van de Wet medezeggenschap onderwijs 1992][ref1] is van overeenkomstige toepassing op een
      speciale school voor basisonderwijs met een afdeling als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005746#Artikel3
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXIII
    references:
      - id: ref1
        bwb_id: BWBR0005746
        artikel: '3'
  - number: XXXIV.1
    text: |-
      Met ingang van 1 augustus 1998 kan aan een speciale school voor basisonderwijs een nevenvestiging verbonden zijn
      indien
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXIV
  - number: XXXIV.1.a
    text: de nevenvestiging op 31 juli 1998 bekostigd werd als
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXIV
  - number: XXXIV.1.a.1°
    text: |-
      een zelfstandige school voor speciaal onderwijs aan kinderen met leer- en opvoedingsmoeilijkheden of moeilijk
      lerende kinderen,
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXIV
  - number: XXXIV.1.a.2°
    text: |-
      een scholengemeenschap voor speciaal onderwijs aan kinderen met leer- en opvoedingsmoeilijkheden en moeilijk
      lerende kinderen,
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXIV
  - number: XXXIV.1.a.3°
    text: |-
      het speciaal onderwijs van een zelfstandige school voor speciaal en voortgezet speciaal onderwijs aan kinderen met
      leer- en opvoedingsmoeilijkheden of moeilijk lerende kinderen,
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXIV
  - number: XXXIV.1.a.4°
    text: |-
      het speciaal onderwijs van een scholengemeenschap voor speciaal en voortgezet speciaal onderwijs aan kinderen met
      leer- en opvoedingsmoeilijkheden en moeilijk lerende kinderen,
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXIV
  - number: XXXIV.1.b
    text: |-
      ingeval het betreft een nevenvestiging van een openbare school die in stand wordt gehouden door een andere
      rechtspersoon dan de gemeente op wier grondgebied de nevenvestiging is gelegen, die gemeente bij notariële akte de
      instandhouding van de school die nevenvestiging is geworden, heeft overgedragen aan die andere rechtspersoon, en
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXIV
  - number: XXXIV.1.c
    text: |-
      van de omvorming tot nevenvestiging voor 1 mei 1998 of, indien het Staatsblad waarin deze wet wordt geplaatst na
      2 april 1998 wordt uitgegeven, binnen 4 weken na de datum van uitgifte van dat Staatsblad, mededeling is gedaan
      aan Onze Minister van Onderwijs, Cultuur en Wetenschappen en, indien het betreft een situatie als bedoeld onder b,
      onder overlegging van de opgave waaruit blijkt dat aan het vereiste onder b is voldaan.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXIV
  - number: XXXIV.2
    text: |-
      Bij de akte, bedoeld in het eerste lid onder b, worden tevens overgedragen de rechten die het bevoegd gezag van een
      school toekomen ten aanzien van het gebouw en terrein, alsmede ten aanzien van de roerende zaken. In de akte wordt
      bepaald dat de rechtspersoon aan wie wordt overgedragen, het personeel in gelijke betrekkingen en onder dezelfde
      voorwaarden als vermeld in de akte van aanstelling, aan de school aanstelt met ingang van de datum van overdracht.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXIV
  - number: XXXIV.3
    text: |-
      Door overdracht met inachtneming van het eerste en tweede lid, treedt de verkrijgende rechtspersoon in alle uit
      de wet voortvloeiende rechten en verplichtingen van zijn rechtsvoorganger voor zover deze zijn hoedanigheid van
      bevoegd gezag betroffen.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXIV
  - number: XXXIV.4
    text: |-
      Onze Minister van Onderwijs, Cultuur en Wetenschappen deelt voor 1 augustus 1998 of, indien het Staatsblad waarin
      deze wet wordt geplaatst na 2 april 1998 wordt uitgegeven, binnen 3 maanden volgend op de mededeling, bedoeld in
      het eerste lid onder c, aan het bevoegd gezag van de beoogde nevenvestiging schriftelijk mede of de nevenvestiging
      zal worden bekostigd.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXIV
  - number: XXXV.1
    text: |-
      Het dienstverband tussen het bevoegd gezag van een school of scholengemeenschap als bedoeld in
      [artikel XXXIII, eerste juncto derde lid][ref1], en een personeelslid dat op 31 juli 1998 in dienst is bij dat
      bevoegd gezag wordt met ingang van 1 augustus 1998 voortgezet door het bevoegd gezag van de speciale school voor
      basisonderwijs die uit eerstgenoemde school of scholengemeenschap is ontstaan, ten behoeve van het verrichten van
      werkzaamheden voor de speciale school voor basisonderwijs voor zover


      [ref1]: https://wetten.overheid.nl/BWBR0009525#ArtikelXXXIII
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXV
    references:
      - id: ref1
        bwb_id: BWBR0009525
        artikel: XXXIII
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: XXXV.1.a
    text: |-
      het dienstverband gezien de op 31 juli 1998 geldende rechten en verplichtingen op 1 augustus 1998 zou zijn
      gehandhaafd, en
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXV
  - number: XXXV.1.b
    text: het personeelslid op 31 juli 1998 werkzaam was
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXV
  - number: XXXV.1.b.1°
    text: |-
      binnen het speciaal onderwijs aan kinderen met leer- en opvoedingsmoeilijkheden of moeilijk lerende kinderen van
      eerstgenoemde school of scholengemeenschap of de daaraan verbonden afdeling voor in hun ontwikkeling bedreigde
      kleuters,
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXV
  - number: XXXV.1.b.2°
    text: |-
      binnen het voortgezet speciaal onderwijs aan kinderen met leer- en opvoedingsmoeilijkheden of moeilijk lerende
      kinderen van eerstgenoemde school of scholengemeenschap en met toepassing van de afvloeiingsregeling, bedoeld in
      [hoofdstuk I-G van het Rechtspositiebesluit onderwijspersoneel][ref1], met ingang van 1 augustus 1998 werkzaam zal
      zijn voor de speciale school voor basisonderwijs, of


      [ref1]: https://wetten.overheid.nl/BWBR0003771#HoofdstukI-G
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXV
    references:
      - id: ref1
        bwb_id: BWBR0003771
        hoofdstuk: I-G
  - number: XXXV.1.b.3°
    text: |-
      binnen een afdeling voor speciaal onderwijs aan zeer moeilijk lerende kinderen van eerstgenoemde
      school of scholengemeenschap en met toepassing van de afvloeiingsregeling, bedoeld in
      [hoofdstuk I-G van het Rechtspositiebesluit onderwijspersoneel][ref1] met ingang van 1 augustus 1998 werkzaam zal
      zijn voor de speciale school voor basisonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003771#HoofdstukI-G
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXV
    references:
      - id: ref1
        bwb_id: BWBR0003771
        hoofdstuk: I-G
  - number: XXXV.2
    text: |-
      Het dienstverband tussen het bevoegd gezag van een school of scholengemeenschap als bedoeld in
      [artikel XXXIII, eerste lid, onderdeel c of d, juncto derde lid][ref1], en een personeelslid dat op 31 juli 1998
      in dienst is bij dat bevoegd gezag, wordt met ingang van 1 augustus 1998 voortgezet door het bevoegd gezag van de
      speciale school voor basisonderwijs die uit eerstgenoemde school of scholengemeenschap is ontstaan, ten behoeve van
      het verrichten van werkzaamheden aan de afdeling als bedoeld in [artikel XXXVII, eerste lid][ref2], voor zover


      [ref1]: https://wetten.overheid.nl/BWBR0009525#ArtikelXXXIII
      [ref2]: https://wetten.overheid.nl/BWBR0009525#ArtikelXXXVII
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXV
    references:
      - id: ref1
        bwb_id: BWBR0009525
        artikel: XXXIII
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0009525
        artikel: XXXVII
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: XXXV.2.a
    text: |-
      het dienstverband gezien de op 31 juli 1998 geldende rechten en verplichtingen op 1 augustus 1998 zou zijn
      gehandhaafd, en
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXV
  - number: XXXV.2.b
    text: |-
      het personeelslid op 31 juli 1998 werkzaam was binnen het voortgezet speciaal onderwijs van eerstgenoemde school
      of scholengemeenschap.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXV
  - number: XXXV.3
    text: |-
      Het dienstverband tussen het bevoegd gezag van een school of scholengemeenschap als bedoeld in
      [artikel XXXIII, eerste juncto derde lid][ref1], waaraan een afdeling voor zeer moeilijk lerende kinderen is
      verbonden, en een personeelslid dat op 31 juli 1998 in dienst is bij dat bevoegd gezag, wordt met ingang van 1
      augustus 1998 voortgezet door het bevoegd gezag van de speciale school voor basisonderwijs die uit die school of
      scholengemeenschap is ontstaan, ten behoeve van het verrichten van werkzaamheden aan de afdeling als bedoeld in
      [artikel XXXIII, tweede lid][ref2], voor zover


      [ref1]: https://wetten.overheid.nl/BWBR0009525#ArtikelXXXIII
      [ref2]: https://wetten.overheid.nl/BWBR0009525#ArtikelXXXIII
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXV
    references:
      - id: ref1
        bwb_id: BWBR0009525
        artikel: XXXIII
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0009525
        artikel: XXXIII
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: XXXV.3.a
    text: |-
      het dienstverband gezien de op 31 juli 1998 geldende rechten en verplichtingen op 1 augustus 1998 zou zijn
      gehandhaafd, en
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXV
  - number: XXXV.3.b
    text: het personeelslid op 31 juli 1998 werkzaam was binnen eerstgenoemde afdeling.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXV
  - number: XXXV.4
    text: |-
      De voortzetting per 1 augustus 1998 van een dienstverband als bedoeld in de voorgaande leden geschiedt
      zoveel mogelijk met inachtneming van de rechten en verplichtingen die onder de werking van de
      [Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs][ref1] per die datum in dat
      dienstverband zouden hebben gegolden en, voor wat betreft personeelsleden als bedoeld in het eerste lid,
      onverminderd de [artikelen XLI tot en met XLIII][ref2] en [artikel XLVII][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0009525#ArtikelXLI
      [ref3]: https://wetten.overheid.nl/BWBR0009525#ArtikelXLVII
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXV
    references:
      - id: ref1
        bwb_id: BWBR0003549
      - id: ref2
        bwb_id: BWBR0009525
        artikel: XLI
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref3
        bwb_id: BWBR0009525
        artikel: XLVII
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: XXXV.5
    text: |-
      In afwijking van het eerste tot en met het derde lid wordt het dienstverband tussen het bevoegd gezag van een
      school of scholengemeenschap als bedoeld in die leden en de directeur van die school of scholengemeenschap met
      ingang van 1 augustus 1998 voortgezet door het bevoegd gezag van de speciale school voor basisonderwijs, ten
      behoeve van het verrichten van werkzaamheden aan zowel de speciale school voor basisonderwijs als de daaraan
      verbonden afdeling, voor zover het dienstverband, gezien de op 31 juli 1998 geldende rechten en verplichtingen, op
      1 augustus 1998 zou zijn gehandhaafd.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXV
  - number: XXXVI.1
    text: |-
      Met ingang van 1 augustus 1998 komt behoudens het gestelde in het tweede lid voor bekostiging op grond van deel
      II van de [Wet op het voortgezet onderwijs][ref1] in aanmerking een school voor voortgezet speciaal onderwijs aan
      kinderen met leer- en opvoedingsmoeilijkheden of moeilijk lerende kinderen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXVI
    references:
      - id: ref1
        bwb_id: BWBR0002399
  - number: XXXVI.2
    text: |-
      [Artikel XXXIII, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009525#ArtikelXXXIII
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXVI
    references:
      - id: ref1
        bwb_id: BWBR0009525
        artikel: XXXIII
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: XXXVI.3
    text: |-
      Het dienstverband met het personeel wordt voortgezet voor zover het gezien de op 31 juli 1998 geldende rechten en
      verplichtingen op 1 augustus 1998 zou zijn gehandhaafd.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXVI
  - number: XXXVII.1
    text: |-
      Aan een speciale school voor basisonderwijs die is ontstaan uit een school voor speciaal en voortgezet speciaal
      onderwijs als bedoeld in [artikel XXXIII, eerste lid onder c][ref1], of een scholengemeenschap voor speciaal en
      voortgezet speciaal onderwijs als bedoeld in [artikel XXXIII, eerste lid onder d][ref2] , is in de periode vanaf
      1 augustus 1998 tot een bij koninklijk besluit te bepalen datum een afdeling voor voortgezet speciaal onderwijs
      voor kinderen met leer- en opvoedingsmoeilijkheden of moeilijk lerende kinderen verbonden die is ontstaan uit het
      voortgezet speciaal onderwijs van laatstgenoemde school.


      [ref1]: https://wetten.overheid.nl/BWBR0009525#ArtikelXXXIII
      [ref2]: https://wetten.overheid.nl/BWBR0009525#ArtikelXXXIII
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXVII
    references:
      - id: ref1
        bwb_id: BWBR0009525
        artikel: XXXIII
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0009525
        artikel: XXXIII
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: XXXVII.2
    text: Artikel XXXIII, derde lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXVII
  - number: XXXVII.3
    text: |-
      Op de afdeling zijn [deel II van de Wet op het voortgezet onderwijs](onbekend) en de daarop gebaseerde algemeen
      verbindende voorschriften en terzake vastgestelde beleidsregels van toepassing zoals deze luiden voor het
      desbetreffende onderwijs, met dien verstande dat bedoelde algemeen verbindende voorschriften en beleidsregels bij
      algemene maatregel van bestuur onderscheidenlijk ministeriële regeling of beleidsregels kunnen worden aangepast.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXVII
  - number: XXXVII.4
    text: |-
      De leerlingen van de afdeling tellen niet mee voor de berekening van de formatie en de vergoeding voor de kosten
      van vervanging van personeel, schoolspecifieke knelpunten in de personeelsvoorziening, nascholing en materiële
      instandhouding van de speciale school voor basisonderwijs.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXVII
  - number: XXXVII.5
    text: |-
      In afwijking van [artikel 14, eerste lid, eerste volzin, van de Wet op het primair onderwijs][ref1] en [artikel
      22, eerste lid, eerste volzin, van deel II van de Wet op het voortgezet onderwijs](onbekend) kan aan een speciale
      school voor basisonderwijs met een afdeling als bedoeld in dit artikel slechts een directeur verbonden zijn. In
      afwijking van [artikel 20a, tweede lid, van de Wet op het primair onderwijs][ref2] en [artikel 28a, tweede lid, van
      deel II van de Wet op het voortgezet onderwijs](onbekend), geldt de benoeming van deze directeur ten behoeve van
      het verrichten van werkzaamheden aan door het bevoegd gezag in stand gehouden scholen als bedoeld in eerstgenoemde
      wet en [deel II van laatstgenoemde wet](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel20a
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXVII
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 20a
  - number: XXXVII.6
    text: |-
      [Artikel 3, vijfde lid, onder b, en zesde lid, van de Wet medezeggenschap onderwijs 1992][ref1] is van
      overeenkomstige toepassing op een speciale school voor basisonderwijs met een afdeling als bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005746#Artikel3
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXVII
    references:
      - id: ref1
        bwb_id: BWBR0005746
        artikel: '3'
  - number: XXXIX.1
    text: |-
      Een afdeling voor in hun ontwikkeling bedreigde kleuters die op 31 juli 1998 was verbonden aan een school voor
      speciaal onderwijs of voor speciaal en voortgezet speciaal onderwijs aan zeer moeilijk opvoedbare kinderen is tot
      een bij koninklijk besluit te bepalen datum verbonden aan die school.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXIX
  - number: XXXIX.2
    text: |-
      [Artikel XXXIII, derde en vijfde lid][ref1], [artikel XXXV, vijfde lid][ref2], en [artikel XXXVI, derde lid][ref3],
      zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009525#ArtikelXXXIII
      [ref2]: https://wetten.overheid.nl/BWBR0009525#ArtikelXXXV
      [ref3]: https://wetten.overheid.nl/BWBR0009525#ArtikelXXXVI
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXIX
    references:
      - id: ref1
        bwb_id: BWBR0009525
        artikel: XXXIII
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0009525
        artikel: XXXV
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref3
        bwb_id: BWBR0009525
        artikel: XXXVI
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: XXXIX.3
    text: |-
      Op de afdeling, bedoeld in het eerste lid, zijn de [Wet op de expertisecentra][ref1] en de daarop gebaseerde
      algemeen verbindende voorschriften en terzake vastgestelde beleidsregels van toepassing, met dien verstande dat
      bedoelde algemeen verbindende voorschriften en beleidsregels bij algemene maatregel van bestuur onderscheidenlijk
      ministeriële regeling of beleidsregels kunnen worden aangepast.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXIX
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: XXXIX.4
    text: |-
      In afwijking van [artikel 22, eerste lid, eerste volzin, van de Wet op de expertisecentra][ref1] en
      __REF001___________________________________________________________________________________________________________
      ____________ zoals luidend op 31 juli 1998 kan aan een school met een afdeling als bedoeld in dit artikel, slechts
      een directeur verbonden zijn. In afwijking van [artikel 28a, tweede lid, van de Wet op de expertisecentra][ref3] en
      [artikel 28a, tweede lid, van de Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs][ref4]
      zoals luidend op 31 juli 1998, geldt de benoeming van deze directeur ten behoeve van het verrichten van
      werkzaamheden aan door het bevoegd gezag in stand gehouden scholen als bedoeld in eerstgenoemde en laatstgenoemde
      wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel28a
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel28a
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXXXIX
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '22'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: 28a
      - id: ref4
        bwb_id: BWBR0003549
        artikel: 28a
  - number: XL
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXL
  - number: XL.a
    text: |-
      personeelslid met een werkgelegenheidsgarantie: een personeelslid als bedoeld in
      [artikel XXXV, eerste lid][ref1], van wie de functie op 31 juli 1998 was opgenomen in de formatie als bedoeld in
      [artikel I-P76, tweede lid, onder a van het Rechtspositiebesluit onderwijspersoneel][ref2], voorzolang en voorzover
      dat personeelslid zonder onderbreking in dienst is bij


      [ref1]: https://wetten.overheid.nl/BWBR0009525#ArtikelXXXV
      [ref2]: https://wetten.overheid.nl/BWBR0003771#ArtikelI
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXL
    references:
      - id: ref1
        bwb_id: BWBR0009525
        artikel: XXXV
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0003771
        artikel: I
  - number: XL.a.1°
    text: |-
      het bevoegd gezag van een speciale school voor basisonderwijs als bedoeld in [artikel XXXV, eerste lid][ref1], ten
      behoeve van het verrichten van werkzaamheden aan die school, of


      [ref1]: https://wetten.overheid.nl/BWBR0009525#ArtikelXXXV
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXL
    references:
      - id: ref1
        bwb_id: BWBR0009525
        artikel: XXXV
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: XL.a.2°
    text: |-
      het bevoegd gezag van een andere speciale school voor basisonderwijs waarbij dat personeelslid in aansluiting op
      het onder 1° bedoelde dienstverband wordt herplaatst in een functie als bedoeld in [artikel XLII][ref1] ten behoeve
      van het verrichten van werkzaamheden aan die school;


      [ref1]: https://wetten.overheid.nl/BWBR0009525#ArtikelXLII
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXL
    references:
      - id: ref1
        bwb_id: BWBR0009525
        artikel: XLII
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: XL.b
    text: |-
      samenwerkingsverband: een samenwerkingsverband als bedoeld in [artikel XXXII, eerste lid][ref1], dat is goedgekeurd
      door Onze Minister van Onderwijs, Cultuur en Wetenschappen;


      [ref1]: https://wetten.overheid.nl/BWBR0009525#ArtikelXXXII
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXL
    references:
      - id: ref1
        bwb_id: BWBR0009525
        artikel: XXXII
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: XL.c
    text: |-
      zorgformatie voor de basisscholen: de formatie die aan het bevoegd gezag van alle scholen in een
      samenwerkingsverband dan wel, indien verschillende bevoegde gezagsorganen samenwerken in een samenwerkingsverband,
      de centrale dienst op grond van [artikel 96h, eerste of tweede lid, van de Wet op het primair onderwijs][ref1] is
      toegekend, verminderd met de WSNS-faciliteiten ad f 28,– per basisschoolleerling die in het schooljaar 1998–1999
      ten behoeve van de basisscholen in het samenwerkingsverband zijn toegekend;


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel96h
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXL
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 96h
  - number: XL.d
    text: |-
      zorgformatie voor de speciale scholen voor basisonderwijs: de formatie waarover de bevoegde gezagsorganen
      van de gezamenlijke scholen voor speciaal onderwijs in een samenwerkingsverband beschikken op grond van
      [artikel 96b1, eerste lid, onder c, van de Wet op het primair onderwijs][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel96b1
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXL
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 96b1
  - number: XL.e
    text: 'zorgformatie voor de gezamenlijke scholen: de som van de zorgformatie, bedoeld onder c en d.'
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXL
  - number: XLI.1
    text: |-
      Aan een personeelslid met een werkgelegenheidsgarantie wordt tot en met 31 juli 2003 geen ontslag verleend dat in
      verband staat met de inzet of de wijziging van de inzet in een samenwerkingsverband van:
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLI
  - number: XLI.1.a
    text: de zorgformatie voor de basisscholen,
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLI
  - number: XLI.1.b
    text: |-
      de zorgformatie voor de speciale school of scholen voor basisonderwijs van het bevoegd gezag waarbij het betrokken
      personeelslid is benoemd, of
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLI
  - number: XLI.1.c
    text: |-
      de overgangsformatie als bedoeld in de [artikelen XLV][ref1] en [XLVI][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009525#ArtikelXLV
      [ref2]: https://wetten.overheid.nl/BWBR0009525#ArtikelXLVI
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLI
    references:
      - id: ref1
        bwb_id: BWBR0009525
        artikel: XLV
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0009525
        artikel: XLVI
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: XLI.2
    text: |-
      In het schooljaar 1998–1999 vindt het eerste lid toepassing ten aanzien van de formatie, bedoeld
      in [artikel XLV, eerste lid][ref1], die de in het eerste lid bedoelde school of scholen voor dat
      schooljaar is toegekend, exclusief de formatie waarop die school of scholen bij toepassing van
      [artikel 96b1, eerste lid, onder a en b, van de Wet op het primair onderwijs][ref2] aanspraak zouden hebben
      gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0009525#ArtikelXLV
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel96b1
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLI
    references:
      - id: ref1
        bwb_id: BWBR0009525
        artikel: XLV
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 96b1
  - number: XLI.3
    text: 'Het eerste lid is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLI
  - number: XLI.3.a
    text: |-
      het betrokken personeelslid gelijktijdig wordt herplaatst in een functie als bedoeld in [artikel XLII][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0009525#ArtikelXLII
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLI
    references:
      - id: ref1
        bwb_id: BWBR0009525
        artikel: XLII
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: XLI.3.b
    text: het betrokken personeelslid herplaatsing in een functie als bedoeld onder a weigert.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLI
  - number: XLI.4
    text: |-
      Indien de omvang van de nieuwe functie, bedoeld in het derde lid, onder a en b, kleiner is dan de omvang van de
      functie waaruit ontslag wordt verleend, wordt dat ontslag slechts verleend voor dat deel van de oude functie dat
      qua omvang overeenkomt met de nieuwe functie.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLI
  - number: XLI.5
    text: |-
      Bij een ontslag in een geval als bedoeld in het derde lid, onder a of b, is artikel I-P85, eerste lid, eerste
      volzin, van het Rechtspositiebesluit onderwijspersoneel, niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLI
  - number: XLII.1
    text: |-
      Herplaatsing van een personeelslid met een werkgelegenheidsgarantie geschiedt zo mogelijk in een functie of
      functies met dezelfde omvang, dezelfde inhoud, dezelfde maximumschaal en hetzelfde carrièrepatroon als de functie
      waaruit ontslag wordt verleend, met dien verstande dat
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLII
  - number: XLII.1.a
    text: |-
      leraren en directieleden ten minste in aanmerking komen voor de functie van groepsleraar basisonderwijs, dan wel
      een andere onderwijsgevende functie waarvan de maximumschaal niet lager is dan de maximumschaal behorende bij
      eerstgenoemde functie;
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLII
  - number: XLII.1.b
    text: |-
      voor een voormalig directeur de maximumschaal behorende bij de nieuwe functie niet meer dan twee schalen lager mag
      zijn dan de maximumschaal behorende bij de oude functie;
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLII
  - number: XLII.1.c
    text: |-
      voor een lid van het onderwijsondersteunend personeel de maximumschaal behorende bij de nieuwe functie niet meer
      dan één schaal lager mag zijn dan de maximumschaal behorende bij de oude functie.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLII
  - number: XLII.2
    text: Een herplaatsing als bedoeld in het eerste lid geschiedt
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLII
  - number: XLII.2.a
    text: in een functie bij het bevoegd gezag van een school, instelling of centrale dienst als bedoeld in
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLII
  - number: XLII.2.a.1°
    text: |-
      de [Wet op het primair onderwijs][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003420
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLII
    references:
      - id: ref1
        bwb_id: BWBR0003420
  - number: XLII.2.a.2°
    text: |-
      de [Wet op de expertisecentra][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLII
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: XLII.2.a.3°
    text: '[deel II van de Wet op het voortgezet onderwijs](onbekend),'
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLII
  - number: XLII.2.b
    text: in vaste dienst, en
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLII
  - number: XLII.2.c
    text: |-
      in een functie die is opgenomen in de formatie, bedoeld in
      [artikel I-P76, tweede lid, onder a, van het Rechtspositiebesluit onderwijspersoneel][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003771#ArtikelI
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLII
    references:
      - id: ref1
        bwb_id: BWBR0003771
        artikel: I
  - number: XLIII.1
    text: |-
      Een personeelslid met een werkgelegenheidsgarantie dat zowel op 31 juli 1996 als op 31 juli 1998 was benoemd bij
      het bevoegd gezag van een school of scholengemeenschap als bedoeld in [artikel XXXIII, eerste lid][ref1], heeft bij
      herplaatsing in een nieuwe functie als bedoeld in [artikel XLII][ref2] ten minste aanspraak op salariëring volgens
      het carrièrepatroon dat in de oude functie laatstelijk voor hem gold, alsmede op behoud van het uitzicht op de
      maximumschaal welke in die functie laatstelijk voor hem gold. De in de eerste volzin bedoelde aanspraak geldt niet
      voor zover de omvang van de nieuwe functie de omvang van de oude functie overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0009525#ArtikelXXXIII
      [ref2]: https://wetten.overheid.nl/BWBR0009525#ArtikelXLII
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLIII
    references:
      - id: ref1
        bwb_id: BWBR0009525
        artikel: XXXIII
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0009525
        artikel: XLII
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: XLIII.2
    text: |-
      Bij een herplaatsing als bedoeld in het eerste lid wordt het verbruik van formatierekeneenheden, bedoeld in
      [artikel I-P78 van het Rechtspositiebesluit onderwijspersoneel][ref1], voor het betrokken personeelslid gebaseerd
      op de maximumschaal en het carrièrepatroon behorende bij de oude functie, tenzij het verbruik behorende bij de
      nieuwe functie gelijk of hoger is.


      [ref1]: https://wetten.overheid.nl/BWBR0003771#ArtikelI
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLIII
    references:
      - id: ref1
        bwb_id: BWBR0003771
        artikel: I
  - number: XLIII.3
    text: Indien de herplaatsing, bedoeld in het eerste lid, plaatsvindt in
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLIII
  - number: XLIII.3.a
    text: een functie aan een of meer basisscholen,
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLIII
  - number: XLIII.3.b
    text: |-
      het bij die functie behorende verbruik van formatierekeneenheden lager is dan het verbruik op grond van de oude
      functie,
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLIII
  - number: XLIII.3.c
    text: herplaatsing in een functie met hetzelfde verbruik van formatierekeneenheden als de oude functie niet mogelijk is,
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLIII
  - number: XLIII.3.d
    text: |-
      de benoeming in de oude functie uitsluitend gecontinueerd had kunnen worden met behulp van formatierekeneenheden
      als bedoeld in [artikel XLIV, eerste lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0009525#ArtikelXLIV
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLIII
    references:
      - id: ref1
        bwb_id: BWBR0009525
        artikel: XLIV
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: XLIII.3.e
    text: |-
      is voldaan aan de in het vierde lid bedoelde regels, heeft het bevoegd gezag waarbij het personeelslid wordt
      herplaatst voor de duur van het dienstverband met dat personeelslid aanspraak op een vergoeding van rijkswege ter
      grootte van het verschil in verbruik van formatierekeneenheden tussen de oude en de nieuwe functie.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLIII
  - number: XLIII.4
    text: Onze Minister van Onderwijs, Cultuur en Wetenschappen kan ter uitvoering van het derde lid nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLIII
  - number: XLIV.1
    text: |-
      Indien het bevoegd gezag van een speciale school voor basisonderwijs in enig schooljaar over onvoldoende
      formatierekeneenheden beschikt om de dienstbetrekking in stand te houden met een personeelslid met een
      werkgelegenheidsgarantie, dan draagt het bevoegd gezag van alle scholen in een samenwerkingsverband, dan wel,
      indien verschillende bevoegde gezagsorganen samenwerken in het verband, het bestuur van de centrale dienst van
      het verband het equivalent van het tekort aan formatierekeneenheden over aan het bevoegd gezag van eerstgenoemde
      school.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLIV
  - number: XLIV.2
    text: |-
      De verplichting, bedoeld in het eerste lid, heeft maximaal betrekking op de zorgformatie voor de basisscholen
      en de eventuele overgangsformatie, bedoeld in [artikel XLV, tweede lid][ref1], waarop aanspraak bestaat in het
      desbetreffende schooljaar, vermeerderd met de eventuele overgangsformatie, bedoeld in [artikel XLVI][ref2],
      waarop aanspraak bestaat in het desbetreffende schooljaar of, indien niet is voldaan aan de voorwaarde, bedoeld
      in het tweede lid onder b, van dat artikel, aanspraak zou hebben bestaan indien daaraan wel zou zijn voldaan.
      [Artikel 96c1, zesde en zevende lid, van de Wet op het primair onderwijs][ref3] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009525#ArtikelXLV
      [ref2]: https://wetten.overheid.nl/BWBR0009525#ArtikelXLVI
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel96c1
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLIV
    references:
      - id: ref1
        bwb_id: BWBR0009525
        artikel: XLV
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0009525
        artikel: XLVI
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: 96c1
  - number: XLIV.3
    text: |-
      Indien het bevoegd gezag van alle scholen in een samenwerkingsverband, dan wel, indien verschillende
      bevoegde gezagsorganen samenwerken in het verband, het bestuur van de centrale dienst van het verband tevens
      formatie overdraagt op grond van [artikel 96c1, tweede lid, van de Wet op het primair onderwijs][ref1],
      dan wordt die formatie voor de toepassing van het tweede lid in mindering gebracht op de zorgformatie
      voor de basisscholen en de eventuele overgangsformatie, bedoeld in [artikel XLV, tweede lid][ref2]. Indien
      de op grond van eerstgenoemd artikellid overgedragen formatie meer bedraagt dan de genoemde zorgformatie
      en eventuele overgangsformatie, dan blijft het meerdere voor de toepassing van het tweede lid buiten
      beschouwing. Indien de overdracht van formatie, bedoeld in de eerste volzin, plaatsvindt met toepassing van
      [artikel 96c1, vierde lid, tweede volzin, van de Wet op het primair onderwijs][ref3], dan wordt ter uitvoering van
      de eerste volzin uitgegaan van de formatie welke zonder die toepassing overgedragen had moeten worden.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel96c1
      [ref2]: https://wetten.overheid.nl/BWBR0009525#ArtikelXLV
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel96c1
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLIV
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 96c1
      - id: ref2
        bwb_id: BWBR0009525
        artikel: XLV
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: 96c1
  - number: XLIV.4
    text: |-
      Het reglement, bedoeld in [artikel 13c van de Wet op het primair onderwijs][ref1], bepaalt de wijze waarop
      de omvang wordt vastgesteld van het tekort, bedoeld in het eerste lid, respectievelijk van het aandeel van de
      onderscheiden basisscholen in de overdracht van formatierekeneenheden als bedoeld in dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel13c
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLIV
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 13c
  - number: XLIV.5
    text: |-
      [Artikel 96c1, tweede lid, van de Wet op het primair onderwijs][ref1] en artikel XLV, vierde lid, zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel96c1
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLIV
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 96c1
  - number: XLV.1
    text: |-
      Voor het schooljaar 1998–1999 wordt de formatie voor speciale scholen voor basisonderwijs in
      afwijking van [artikel 96b1 van de Wet op het primair onderwijs][ref1] bepaald met toepassing van het
      [Formatiebesluit ISOVSO 1992][ref2], zoals dat besluit luidde op 31 juli 1998, met dien verstande dat die formatie
      ten minste wordt bepaald op de formatie die de desbetreffende school op grond van genoemd besluit, respectievelijk
      de voor het schooljaar 1997–1998 geldende beleidsregels, op 31 juli 1998 van het Rijk ontving. Gedurende het
      schooljaar 1998–1999 vindt geen verhoging van de formatie plaats op grond van de artikelen 8 en 9 van genoemd
      besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel96b1
      [ref2]: https://wetten.overheid.nl/BWBR0005442
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLV
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 96b1
      - id: ref2
        bwb_id: BWBR0005442
  - number: XLV.2
    text: |-
      Indien, in geval van toepasselijkheid van de [artikelen 96b1][ref1] en
      [96h van de Wet op het primair onderwijs][ref2], in een samenwerkingsverband de som van de zorgformatie voor de
      gezamenlijke scholen en de formatie krachtens [artikel 96b1, eerste lid, onder a en b, van genoemde wet][ref3] in
      het schooljaar 1998–1999 minder zou zijn geweest dan de formatie, bedoeld in het eerste lid, eerste volzin, die de
      speciale scholen voor basisonderwijs op 31 juli 1998 ontvingen, dan heeft het bevoegd gezag van alle scholen in een
      samenwerkingsverband, dan wel, indien verschillende bevoegde gezagsorganen samenwerken in het verband, het bestuur
      van de centrale dienst van het verband in de schooljaren 1999–2000 tot en met 2002–2003 aanspraak op het volgende
      percentage van het verschil:


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel96b1
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel96h
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel96b1
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLV
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 96b1
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 96h
      - id: ref3
        bwb_id: BWBR0003420
        artikel: 96b1
  - number: XLV.2.a
    text: 'voor het schooljaar 1999–2000: 80%,'
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLV
  - number: XLV.2.b
    text: 'voor het schooljaar 2000–2001: 60%,'
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLV
  - number: XLV.2.c
    text: 'voor het schooljaar 2001–2002: 40%,'
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLV
  - number: XLV.2.d
    text: 'voor het schooljaar 2002–2003: 20%.'
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLV
  - number: XLV.3
    text: |-
      Indien de in het tweede lid bedoelde som in enig van de in dat lid genoemde schooljaren toeneemt, dan wordt het
      voor het desbetreffende schooljaar geldende percentage toegepast op het verschil tussen die toegenomen som en de
      formatie, bedoeld in het eerste lid, eerste volzin, die de speciale scholen voor basisonderwijs op 31 juli 1998
      ontvingen.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLV
  - number: XLV.4
    text: |-
      Indien een speciale school voor basisonderwijs deelneemt in meer dan een samenwerkingsverband, dan wordt voor de
      toepassing van het tweede en derde lid de formatie welke die school op 31 juli 1998 ontving, toegerekend aan de
      samenwerkingsverbanden naar rato van het aantal basisschoolleerlingen van elk samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLV
  - number: XLV.5
    text: |-
      Voor de toepassing van de voorgaande leden worden de speciale scholen voor basisonderwijs in het
      schooljaar 1997–1998 aangemerkt als de scholen of scholengemeenschappen of delen daarvan, bedoeld in
      [artikel XXXIII, eerste lid][ref1], waaruit zij zijn ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009525#ArtikelXXXIII
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLV
    references:
      - id: ref1
        bwb_id: BWBR0009525
        artikel: XXXIII
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: XLV.6
    text: |-
      De [artikelen 13b, tweede lid onder b][ref1], en [114b, zesde lid, van de Wet op het primair onderwijs][ref2] zijn
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel13b
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel114b
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLV
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 13b
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 114b
  - number: XLV.7
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen, zonodig in afwijking van dit artikel, nadere regels worden
      gesteld voor de berekening van de formatieve aanspraken ingevolge dit artikel.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLV
  - number: XLVI.1
    text: |-
      Onze Minister van Onderwijs, Cultuur en Wetenschappen kan, voor de eerste maal met ingang van 1 augustus 1999,
      op aanvraag van de bevoegde gezagsorganen van de gezamenlijke basisscholen in een samenwerkingsverband besluiten
      extra formatierekeneenheden toe te kennen aan het bevoegd gezag van alle scholen in een samenwerkingsverband,
      dan wel, indien verschillende bevoegde gezagsorganen samenwerken in het verband, het bestuur van de centrale
      dienst van het verband, voor zover de zorgformatie voor de basisscholen, vermeerderd met de overgangsformatie als
      bedoeld in [artikel XLV, tweede lid][ref1], ontoereikend is om te voldoen aan de overdrachtsverplichting ingevolge
      [artikel XLIV][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009525#ArtikelXLV
      [ref2]: https://wetten.overheid.nl/BWBR0009525#ArtikelXLIV
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLVI
    references:
      - id: ref1
        bwb_id: BWBR0009525
        artikel: XLV
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0009525
        artikel: XLIV
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: XLVI.2
    text: Een aanvraag als bedoeld in het eerste lid wordt slechts ingewilligd indien
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLVI
  - number: XLVI.2.a
    text: |-
      het betrokken bevoegd gezag of het bestuur van de betrokken centrale dienst aanspraak maakt op overgangsformatie
      als bedoeld in [artikel XLV, tweede lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0009525#ArtikelXLV
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLVI
    references:
      - id: ref1
        bwb_id: BWBR0009525
        artikel: XLV
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: XLVI.2.b
    text: |-
      het betrokken bevoegd gezag of de betrokken bevoegde gezagsorganen aantonen zich voldoende te hebben ingespannen om
      personeelsleden met een werkgelegenheidsgarantie te herplaatsen in functies als bedoeld in [artikel XLII][ref1] aan
      basisscholen in het desbetreffende samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0009525#ArtikelXLII
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLVI
    references:
      - id: ref1
        bwb_id: BWBR0009525
        artikel: XLII
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: XLVI.3
    text: |-
      Een aanvraag als bedoeld in het eerste lid wordt niet ingewilligd voor zover dit verzoek betrekking heeft op de
      meerdere overgedragen formatie als bedoeld in [artikel XLIV, derde lid][ref1], tweede volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0009525#ArtikelXLIV
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLVI
    references:
      - id: ref1
        bwb_id: BWBR0009525
        artikel: XLIV
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: XLVI.4
    text: |-
      De [artikelen 13b, tweede lid, onder b][ref1], en [114b, zesde lid, van de Wet op het primair onderwijs][ref2] zijn
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel13b
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel114b
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLVI
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 13b
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 114b
  - number: XLVII.1
    text: |-
      Een personeelslid met een werkgelegenheidsgarantie, wiens dienstbetrekking uitsluitend in stand kan worden
      gehouden met behulp van formatierekeneenheden als bedoeld in [artikel XLIV, eerste lid][ref1], is verplicht andere
      hem door het bevoegd gezag opgedragen werkzaamheden te verrichten aan de eigen of een andere instelling in het
      samenwerkingsverband, die in het kader van de door hem vervulde functie passend zijn te achten, dan wel een functie
      te aanvaarden als bedoeld in [artikel XLII][ref2] .


      [ref1]: https://wetten.overheid.nl/BWBR0009525#ArtikelXLIV
      [ref2]: https://wetten.overheid.nl/BWBR0009525#ArtikelXLII
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLVII
    references:
      - id: ref1
        bwb_id: BWBR0009525
        artikel: XLIV
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0009525
        artikel: XLII
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: XLVII.2
    text: |-
      In het schooljaar 1998–1999 is het eerste lid van toepassing ten aanzien van een personeelslid met een
      werkgelegenheidsgarantie wiens dienstbetrekking uitsluitend in stand kan worden gehouden met formatierekeneenheden
      als bedoeld in [artikel LI, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009525#ArtikelLI
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLVII
    references:
      - id: ref1
        bwb_id: BWBR0009525
        artikel: LI
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: XLVII.3
    text: |-
      Het bevoegd gezag kan een personeelslid als bedoeld in het eerste lid, wiens dienstbetrekking
      uitsluitend in stand kan worden gehouden met behulp van extra formatierekeneenheden als bedoeld
      in [artikel XLVI, eerste lid][ref1], tevens een scholingsplicht of een sollicitatieplicht
      opleggen. Op deze plichten zijn [artikel I-P84, derde lid][ref2], respectievelijk
      [ artikel I-P86 van het Rechtspositiebesluit onderwijspersoneel][ref3] van overeenkomstige toepassing, met
      dien verstande dat die plichten maximaal kunnen strekken tot scholing voor of sollicitatie naar een functie als
      bedoeld in [artikel XLII, eerste lid][ref4], bij het bevoegd gezag van een instelling in de sector Onderwijs en
      Wetenschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0009525#ArtikelXLVI
      [ref2]: https://wetten.overheid.nl/BWBR0003771#ArtikelI
      [ref3]: https://wetten.overheid.nl/BWBR0003771#ArtikelI
      [ref4]: https://wetten.overheid.nl/BWBR0009525#ArtikelXLII
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLVII
    references:
      - id: ref1
        bwb_id: BWBR0009525
        artikel: XLVI
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0003771
        artikel: I
      - id: ref3
        bwb_id: BWBR0003771
        artikel: I
      - id: ref4
        bwb_id: BWBR0009525
        artikel: XLII
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: XLVIII.1
    text: |-
      Voor de periode vanaf 1 augustus 1998 tot en met 31 december 1998 wordt de vergoeding voor de materiële
      instandhouding voor basisscholen in afwijking van [artikel 92 van de Wet op het primair onderwijs][ref1] bepaald
      met toepassing van de [Wet op het basisonderwijs][ref2] en de daarop gebaseerde algemeen verbindende voorschriften
      en terzake vastgestelde beleidsregels, zoals deze luidden op 31 juli 1998.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel92
      [ref2]: https://wetten.overheid.nl/BWBR0003420
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLVIII
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '92'
      - id: ref2
        bwb_id: BWBR0003420
  - number: XLVIII.2
    text: |-
      Het eerste lid is onverminderd [artikel 92, vijfde lid, van de Wet op het basisonderwijs][ref1] zoals
      deze luidde op 31 juli 1998 van overeenkomstige toepassing op de periode vanaf 1 januari 1999 tot en met
      31 december 1999, met dien verstande dat de teldatum 1 oktober 1998 onderscheidenlijk, bij toepassing
      van [artikel 100, zevende lid, van de Wet op het primair onderwijs][ref2] 1 maart 1999 wordt gehanteerd
      en de bedragen in de programma's van eisen met ingang van 1 januari 1999 worden aangepast overeenkomstig
      [artikel 92, zesde lid, van de Wet op het basisonderwijs][ref3], zoals deze luidde op 31 juli 1998.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel92
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel100
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel92
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLVIII
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '92'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '100'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '92'
  - number: XLVIII.3
    text: |-
      Basisscholen die deel uitmaken van een samenwerkingsverband dat de instemming, bedoeld in artikel 13a, zevende
      lid, heeft verkregen, hebben in de periode van 1 januari 1999 tot en met 31 december 1999 aanspraak op een bij
      ministeriële regeling te bepalen bedrag vermenigvuldigd met 2% van het aantal leerlingen van de school op de voor
      de desbetreffende periode geldende teldatum.
    url: https://wetten.overheid.nl/BWBR0009525/1999-08-01#ArtikelXLVIII
  - number: IL.1
    text: |-
      Voor de periode van 1 augustus 1998 tot en met 31 december 1998 wordt de vergoeding voor de materiële instandhouding
      voor speciale scholen voor basisonderwijs in afwijking van [artikel 92 van de Wet op het primair onderwijs][ref1]
      bepaald met toepassing van de [Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs][ref2]
      en de daarop gebaseerde algemeen verbindende voorschriften en terzake vastgestelde beleidsregels,
      zoals deze luidden op 31 juli 1998. Daarbij wordt uitgegaan van het aantal leerlingen dat op 1 oktober
      1997 onderscheidenlijk, bij toepassing van [artikel 97, zevende lid, van laatstgenoemde wet][ref3]
      op 16 januari 1998 was ingeschreven bij de afzonderlijke soorten speciaal onderwijs als bedoeld in
      __REF003___________________________________________________________________________________________________________
      _____________ van de school, scholengemeenschap of delen daarvan waaruit de desbetreffende school is ontstaan.


