  - number: LIII
    text: |-
      1 Een personeelslid dat op 31 juli 1998 in dienst van een bevoegd gezag onderwijs geeft als bedoeld in
      [artikel 13, tweede lid, van de Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs][ref1]
      zoals luidend op die datum en bevoegd is op basis van [artikel 111, derde lid, van die wet][ref2], is bevoegd
      tot het geven van het onderwijs, bedoeld in [artikel 13, tweede lid, van de Wet op de expertisecentra][ref3]
      en [artikel 13, tweede lid, van deel II van de Wet op het voortgezet onderwijs](onbekend) voor de duur van het
      dienstverband met bedoeld bevoegd gezag of de rechtsopvolger van dat bevoegd gezag.

      2 Voor een een personeelslid dat met toepassing van
      [artikel 3, zevende lid, van de Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs][ref4] is
      aangesteld of benoemd in het schooljaar 1997–1998 en waarvan de aanstelling of benoeming eindigt in het schooljaar
      1998–1999, kan tot het eind van die aanstelling of benoeming worden afgeweken van de eisen van benoembaarheid,
      gesteld in [artikel 3, eerste lid, onder b, van de Wet op het primair onderwijs][ref5].


