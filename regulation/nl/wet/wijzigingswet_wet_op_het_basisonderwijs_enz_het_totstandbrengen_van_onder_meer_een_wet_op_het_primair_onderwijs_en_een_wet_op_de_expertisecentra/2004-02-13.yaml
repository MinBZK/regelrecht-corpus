  - number: XLIII
    text: |-
      1 Een personeelslid met een werkgelegenheidsgarantie dat zowel op 31 juli 1996 als op 31 juli 1998 was benoemd bij
      het bevoegd gezag van een school of scholengemeenschap als bedoeld in [artikel XXXIII, eerste lid][ref1], heeft bij
      herplaatsing in een nieuwe functie als bedoeld in [artikel XLII][ref2] ten minste aanspraak op salariëring volgens
      het carrièrepatroon dat in de oude functie laatstelijk voor hem gold, alsmede op behoud van het uitzicht op de
      maximumschaal welke in die functie laatstelijk voor hem gold. De in de eerste volzin bedoelde aanspraak geldt niet
      voor zover de omvang van de nieuwe functie de omvang van de oude functie overschrijdt.

      2 Bij een herplaatsing als bedoeld in het eerste lid wordt het verbruik van formatierekeneenheden, bedoeld in
      [artikel I-P78 van het Rechtspositiebesluit onderwijspersoneel][ref3], voor het betrokken personeelslid gebaseerd
      op de maximumschaal en het carrièrepatroon behorende bij de oude functie, tenzij het verbruik behorende bij de
      nieuwe functie gelijk of hoger is.

      3 Indien de herplaatsing, bedoeld in het eerste lid, plaatsvindt in

      a. een functie aan een of meer basisscholen,

      b. het bij die functie behorende verbruik van formatierekeneenheden lager is dan het verbruik op grond van de oude
      functie,

      c. herplaatsing in een functie met hetzelfde verbruik van formatierekeneenheden als de oude functie niet mogelijk
      is,

      d. de benoeming in de oude functie uitsluitend gecontinueerd had kunnen worden met behulp van formatierekeneenheden
      als bedoeld in [artikel XLIV, eerste lid][ref4], en

      e. is voldaan aan de in het vierde lid bedoelde regels, heeft het bevoegd gezag waarbij het personeelslid wordt
      herplaatst voor de duur van het dienstverband met dat personeelslid aanspraak op een vergoeding van rijkswege ter
      grootte van het verschil in verbruik van formatierekeneenheden tussen de oude en de nieuwe functie.

      4 Onze Minister van Onderwijs, Cultuur en Wetenschappen kan ter uitvoering van het derde lid nadere regels stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0009525#ArtikelXXXIII
