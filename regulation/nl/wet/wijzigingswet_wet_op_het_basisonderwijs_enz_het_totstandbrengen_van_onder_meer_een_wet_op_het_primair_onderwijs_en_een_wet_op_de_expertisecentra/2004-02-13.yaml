  - number: IL
    text: |-
      1 Voor de periode van 1 augustus 1998 tot en met 31 december 1998 wordt de vergoeding
      voor de materiële instandhouding voor speciale scholen voor basisonderwijs in afwijking
      van [artikel 92 van de Wet op het primair onderwijs][ref1] bepaald met toepassing van de
      [Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs][ref2] en de daarop
      gebaseerde algemeen verbindende voorschriften en terzake vastgestelde beleidsregels, zoals deze
      luidden op 31 juli 1998. Daarbij wordt uitgegaan van het aantal leerlingen dat op 1 oktober 1997
      onderscheidenlijk, bij toepassing van [artikel 97, zevende lid, van laatstgenoemde wet][ref3] op
      16 januari 1998 was ingeschreven bij de afzonderlijke soorten speciaal onderwijs als bedoeld in
      __REF003___________________________________________________________________________________________________________
      _____________ van de school, scholengemeenschap of delen daarvan waaruit de desbetreffende school is ontstaan.

      2 De eerste volzin van het eerste lid is onverminderd
      [artikel 89, vijfde lid, van de Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs][ref5]
      zoals deze luidde op 31 juli 1998 van overeenkomstige toepassing op de periode van 1 januari 1999 tot en met 31
      december 1999 met dien verstande dat

      a. de bedragen in de programma's van eisen worden aangepast overeenkomstig
      [artikel 89, zesde lid, van de Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs][ref6],
      zoals deze luidde op 31 juli 1998 en

      b. de programma's van eisen voor de afzonderlijke soorten speciaal onderwijs als bedoeld in
      [artikel 2, tweede lid onder i, l en o van die wet][ref7] worden samengevoegd tot programma's van eisen die gelden
      voor alle speciale scholen voor basisonderwijs.

      3 Voor de in het tweede lid bedoelde periode wordt uitgegaan van het aantal leerlingen dat op 1 oktober 1998
      onderscheidenlijk, bij toepassing van [artikel 97, zevende lid, van laatstgenoemde wet][ref8] op 16 januari 1999
      was ingeschreven bij de speciale school voor basisonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel92
