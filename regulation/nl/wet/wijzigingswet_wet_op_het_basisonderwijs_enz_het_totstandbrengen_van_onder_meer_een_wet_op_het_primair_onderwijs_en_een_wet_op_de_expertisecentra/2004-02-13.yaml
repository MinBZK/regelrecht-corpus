  - number: LIV
    text: |-
      1 De goedkeuring op grond van [artikel 11, zevende lid, van de Wet op het basisonderwijs][ref1] zoals
      dit artikellid luidde op 31 juli 1998, blijft van kracht gedurende de termijn die daarvoor in de
      goedkeuringsbeschikking is opgenomen.

      2 Gedurende 2 schooljaren, volgend op de datum waarop de goedkeuring, bedoeld in het eerste lid, is geëindigd, is
      [artikel 107 van de Wet op het primair onderwijs][ref2] niet van toepassing op de school die door het vervallen van
      de goedkeuring niet meer voldoet aan de opheffingsnorm.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel11
