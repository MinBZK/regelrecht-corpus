  - number: XLI
    text: |-
      1 Aan een personeelslid met een werkgelegenheidsgarantie wordt tot en met 31 juli 2003 geen ontslag verleend dat in
      verband staat met de inzet of de wijziging van de inzet in een samenwerkingsverband van:

      a. de zorgformatie voor de basisscholen,

      b. de zorgformatie voor de speciale school of scholen voor basisonderwijs van het bevoegd gezag waarbij het
      betrokken personeelslid is benoemd, of

      c. de overgangsformatie als bedoeld in de [artikelen XLV][ref1] en [XLVI][ref2].

      2 In het schooljaar 1998–1999 vindt het eerste lid toepassing ten aanzien van de formatie, bedoeld
      in [artikel XLV, eerste lid][ref3], die de in het eerste lid bedoelde school of scholen voor dat
      schooljaar is toegekend, exclusief de formatie waarop die school of scholen bij toepassing van
      [artikel 96b1, eerste lid, onder a en b, van de Wet op het primair onderwijs][ref4] aanspraak zouden hebben
      gemaakt.

      3 Het eerste lid is niet van toepassing indien:

      a. het betrokken personeelslid gelijktijdig wordt herplaatst in een functie als bedoeld in [artikel XLII][ref5], of

      b. het betrokken personeelslid herplaatsing in een functie als bedoeld onder a weigert.

      4 Indien de omvang van de nieuwe functie, bedoeld in het derde lid, onder a en b, kleiner is dan de omvang van de
      functie waaruit ontslag wordt verleend, wordt dat ontslag slechts verleend voor dat deel van de oude functie dat
      qua omvang overeenkomt met de nieuwe functie.

      5 Bij een ontslag in een geval als bedoeld in het derde lid, onder a of b, is artikel I-P85, eerste lid, eerste
      volzin, van het Rechtspositiebesluit onderwijspersoneel, niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009525#ArtikelXLV
