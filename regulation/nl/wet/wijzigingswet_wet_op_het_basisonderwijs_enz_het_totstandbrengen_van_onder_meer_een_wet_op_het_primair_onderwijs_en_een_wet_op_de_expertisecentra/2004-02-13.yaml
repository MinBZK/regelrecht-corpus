  - number: LVI
    text: |-
      1 Deze wet treedt in werking met ingang van 1 augustus 1998, met uitzondering van

      a. [artikel I, onderdeel H][ref1], voor wat betreft [artikel 13d][ref2], en [artikel XXXII][ref3], die in werking
      treden met ingang van de dag na de datum van uitgifte van het Staatsblad waarin deze wet wordt geplaatst en

      b. [artikel XLIV][ref4], dat in werking treedt met ingang van 1 augustus 1999.

      2 [Artikel I][ref5] is voor wat betreft de datum 1 mei in [artikel 13b, eerste lid][ref6], voor het eerst van
      toepassing op het schooljaar 1999–2000.

      3 [Artikel I][ref7] is voor wat betreft [artikel 13c, tweede lid onder a][ref8], voor het eerst van toepassing op
      de inzet van de formatie voor het schooljaar 1999–2000.

      4 [Artikel I][ref9] is voor wat betreft de [artikelen 92][ref10] en [94][ref11] voor het eerst van toepassing
      op de programma's van eisen voor het jaar 2000 en voor wat betreft [artikel 95b][ref12] op de overdracht van de
      vergoeding voor materiële instandhouding met betrekking tot het jaar 2000.

      5 [Artikel I][ref13] is voor wat betreft [artikel 96b1][ref14] en [artikel 96h][ref15] voor het eerst van
      toepassing op de formatie voor het schooljaar 1999–2000.

      6 [Artikel I][ref16] is voor wat betreft de [artikelen 96c1][ref17] en [96c2][ref18] voor het eerst van toepassing
      op de overdracht van formatierekeneenheden ten behoeve van het schooljaar 1999–2000.


